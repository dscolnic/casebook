<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>SPECTRUM FRONT — Missions 1–3</title>
<style>
  :root{
    --amber:#ffb454; --green:#57e389; --red:#ff6b6b; --cyan:#4fd6ff; --blue:#5a8bff; --violet:#b58bff;
    --ink:#070a0c; --panel:rgba(9,13,15,.86); --line:rgba(122,150,160,.26);
    --txt:#dbe5e9; --dim:#8ea1a8;
  }
  *{box-sizing:border-box; -webkit-user-select:none; user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;background:#05070a;color:var(--txt);
    font-family:"Segoe UI",-apple-system,Roboto,Helvetica,Arial,sans-serif;}
  canvas{display:block;}
  #app{position:fixed;inset:0;}
  .mono{font-family:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;}
  .hidden{display:none !important;}

  /* ---------- Overlays (briefing / pause / debrief) ---------- */
  .overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 120% at 50% 25%,rgba(18,24,28,.82),rgba(3,5,8,.97));backdrop-filter:blur(3px);}
  .card{width:min(860px,94vw);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#0d1215,#0a0e11);
    border:1px solid var(--line);border-radius:14px;padding:28px 32px;box-shadow:0 30px 90px rgba(0,0,0,.6);}
  h1{font-size:40px;letter-spacing:.14em;margin:0;font-weight:800;
    background:linear-gradient(90deg,#ffe0b0,#ffb454);-webkit-background-clip:text;background-clip:text;color:transparent;}
  h2{letter-spacing:.14em;color:var(--amber);font-size:14px;text-transform:uppercase;margin:22px 0 8px;font-weight:700;}
  .sub{color:var(--dim);letter-spacing:.26em;text-transform:uppercase;font-size:12px;margin:8px 0 0;}
  p{line-height:1.55;color:#c8d4d9;}
  .btn{cursor:pointer;border:1px solid var(--amber);background:linear-gradient(180deg,rgba(255,180,84,.16),rgba(255,180,84,.03));
    color:var(--amber);padding:12px 22px;border-radius:9px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;font-size:13px;transition:.15s;}
  .btn:hover{background:rgba(255,180,84,.24);box-shadow:0 0 22px rgba(255,180,84,.22);}
  .btn.sec{border-color:var(--line);color:var(--txt);background:rgba(120,150,160,.05);}
  .btn.sec:hover{background:rgba(120,150,160,.14);box-shadow:none;}
  .btn.go{border-color:var(--green);color:var(--green);background:linear-gradient(180deg,rgba(87,227,137,.16),rgba(87,227,137,.03));}
  .btn.go:hover{background:rgba(87,227,137,.24);box-shadow:0 0 22px rgba(87,227,137,.22);}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:20px;}
  .tag{display:inline-block;font-size:11px;letter-spacing:.12em;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--dim);text-transform:uppercase;}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13.5px;margin:4px 0;}
  .kv b{color:#eaf1f3;font-weight:600;}
  .ctlgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 26px;}
  .ctl{display:flex;justify-content:space-between;gap:14px;padding:5px 0;border-bottom:1px dashed rgba(122,150,160,.14);font-size:13.5px;}
  .ctl .mono{color:var(--cyan);}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;z-index:20;pointer-events:none;font-size:13px;}
  #crosshair{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);opacity:.75;}
  #crosshair::before,#crosshair::after{content:"";position:absolute;background:rgba(232,242,242,.7);}
  #crosshair::before{left:50%;top:0;width:1.4px;height:100%;transform:translateX(-50%);}
  #crosshair::after{top:50%;left:0;height:1.4px;width:100%;transform:translateY(-50%);}
  #crosshair.rec{width:34px;height:34px;}
  #crosshair.rec::before,#crosshair.rec::after{background:var(--amber);}
  .corner{position:absolute;padding:11px 13px;background:var(--panel);border:1px solid var(--line);border-radius:11px;backdrop-filter:blur(4px);line-height:1.4;}
  #objPanel{left:16px;top:16px;max-width:340px;}
  #objMission{color:var(--amber);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11px;}
  #objTitle{color:#eaf1f3;font-weight:700;font-size:14px;margin:3px 0 6px;}
  #objList{margin:0;padding:0;list-style:none;}
  #objList li{padding:3px 0 3px 20px;position:relative;color:#c9d5da;font-size:12.5px;line-height:1.35;}
  #objList li::before{content:"○";position:absolute;left:0;color:var(--dim);}
  #objList li.done{color:var(--green);opacity:.7;}
  #objList li.done::before{content:"●";color:var(--green);}
  #objList li.active{color:#fff;}
  #objList li.active::before{content:"▸";color:var(--amber);}

  #timerWrap{top:14px;left:50%;transform:translateX(-50%);text-align:center;min-width:220px;}
  #timerLab{color:var(--dim);letter-spacing:.16em;text-transform:uppercase;font-size:10px;}
  #timerVal{font-size:26px;font-weight:800;letter-spacing:.04em;color:#eaf1f3;}
  #timerVal.warn{color:var(--amber);} #timerVal.crit{color:var(--red);animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.5;}}

  #statPanel{right:16px;top:16px;text-align:right;min-width:150px;}
  #statPanel .lab{color:var(--dim);letter-spacing:.12em;text-transform:uppercase;font-size:10px;}
  #eqName{color:var(--amber);font-size:15px;font-weight:700;margin-top:2px;}
  #scoreVal{color:var(--green);font-size:15px;font-weight:700;}

  /* dialogue subtitle */
  #dialogue{position:fixed;left:50%;bottom:20%;transform:translateX(-50%);z-index:24;width:min(720px,92vw);
    background:linear-gradient(180deg,rgba(10,16,18,.95),rgba(6,11,13,.97));border:1px solid var(--line);
    border-left:3px solid var(--amber);border-radius:10px;padding:12px 18px;box-shadow:0 14px 44px rgba(0,0,0,.55);pointer-events:none;}
  #dlgWho{color:var(--amber);letter-spacing:.12em;text-transform:uppercase;font-size:11px;font-weight:700;margin-bottom:4px;}
  #dlgText{color:#eef4f6;font-size:15px;line-height:1.45;}
  #dialogue.radio{border-left-color:var(--cyan);} #dialogue.radio #dlgWho{color:var(--cyan);}

  /* feed notes */
  #feed{position:fixed;left:16px;bottom:16px;z-index:20;width:320px;display:flex;flex-direction:column-reverse;gap:6px;}
  .note{background:var(--panel);border-left:3px solid var(--cyan);border-radius:6px;padding:8px 11px;font-size:12.5px;color:#d7e2e6;
    opacity:0;transform:translateX(-10px);animation:slidein .3s forwards;}
  .note.warn{border-left-color:var(--red);} .note.good{border-left-color:var(--green);} .note.amber{border-left-color:var(--amber);}
  @keyframes slidein{to{opacity:1;transform:none;}}

  /* interaction prompt */
  #prompt{position:fixed;left:50%;bottom:30%;transform:translateX(-50%);z-index:21;background:var(--panel);
    border:1px solid var(--amber);border-radius:8px;padding:9px 16px;letter-spacing:.04em;color:#eaf1f3;font-size:14px;}
  #prompt .key{display:inline-block;font-family:ui-monospace,monospace;background:rgba(255,180,84,.16);color:var(--amber);
    border:1px solid rgba(255,180,84,.35);border-radius:5px;padding:1px 7px;margin-right:6px;font-size:12px;}

  /* hint chip */
  #hintChip{position:fixed;right:16px;bottom:16px;z-index:21;pointer-events:auto;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:8px 12px;font-size:12px;color:var(--dim);cursor:pointer;}
  #hintChip b{color:var(--amber);}
  #hintChip:hover{border-color:var(--amber);color:#dbe5e9;}

  /* instrument screen (DOM, crisp) */
  #inst{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:22;width:min(620px,94vw);
    background:linear-gradient(180deg,rgba(6,13,13,.95),rgba(4,9,10,.97));border:1px solid rgba(90,220,180,.32);
    border-radius:12px;padding:12px 14px;box-shadow:0 0 44px rgba(20,60,50,.35),inset 0 0 30px rgba(30,90,70,.1);}
  #inst .ihead{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
  #instName{color:var(--green);letter-spacing:.16em;text-transform:uppercase;font-size:12px;font-weight:700;}
  #instHint{color:var(--dim);font-size:11px;}
  #instCanvas{width:100%;height:172px;display:block;border-radius:6px;background:#04110c;}
  #instReadout{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px;font-size:12px;color:#bfeeda;}
  #instReadout b{color:#eafff6;}
  #obsBar{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:7px;display:none;}
  #obsBar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--green));transition:width .1s linear;}
  #obsLab{font-size:11px;color:var(--amber);margin-top:4px;display:none;}

  /* equipment wheel */
  #wheel{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(3,6,8,.55);backdrop-filter:blur(2px);}
  #wheelRing{display:flex;gap:16px;}
  .slot{width:130px;height:132px;border:1px solid var(--line);border-radius:14px;background:var(--panel);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--dim);pointer-events:auto;}
  .slot.on{border-color:var(--amber);color:#eaf1f3;box-shadow:0 0 26px rgba(255,180,84,.22);}
  .slot.lock{opacity:.32;}
  .slot .ic{font-size:30px;}
  .slot .n{font-size:12.5px;text-align:center;letter-spacing:.04em;}
  .slot .k{font-size:11px;letter-spacing:.1em;color:var(--dim);}

  /* lesson card */
  #lesson{position:fixed;right:18px;top:120px;z-index:26;width:340px;background:linear-gradient(180deg,#0f1a1c,#0a1315);
    border:1px solid var(--cyan);border-radius:12px;padding:15px 17px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  #lesson .lt{color:var(--cyan);letter-spacing:.14em;text-transform:uppercase;font-size:11px;font-weight:700;margin-bottom:7px;display:flex;justify-content:space-between;}
  #lesson .lt .concept{color:var(--amber);}
  #lesson p{margin:0;font-size:13.5px;line-height:1.5;color:#dceaef;}
  #lesson .meas{margin-top:9px;font-size:12px;color:#bfe6d8;border-top:1px dashed rgba(122,150,160,.2);padding-top:8px;}
  #lesson .meas b{color:#eafff6;}
  #lessonBar{height:3px;background:var(--cyan);opacity:.5;margin-top:11px;border-radius:2px;transition:width linear;}

  /* generic modal (notebook, console, table, debrief) */
  #modalMount{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;
    background:radial-gradient(120% 120% at 50% 30%,rgba(16,22,26,.78),rgba(3,5,8,.95));backdrop-filter:blur(3px);}
  .mcard{width:min(920px,95vw);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#0d1215,#0a0e11);
    border:1px solid var(--line);border-radius:14px;padding:22px 26px;box-shadow:0 30px 90px rgba(0,0,0,.6);}
  .mtitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .mtitle h2{margin:0;}
  .evGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
  .evCard{background:rgba(120,150,160,.05);border:1px solid var(--line);border-radius:10px;padding:12px;}
  .evCard.good{border-color:rgba(87,227,137,.5);}
  .evCard.bad{border-color:rgba(255,107,107,.4);}
  .evCard .en{color:var(--amber);font-weight:700;font-size:13px;letter-spacing:.04em;}
  .evCard canvas{width:100%;height:56px;background:#04110c;border-radius:5px;margin:7px 0;display:block;}
  .evCard .er{font-size:11.5px;color:#c3d0d5;line-height:1.5;}
  .evCard .er b{color:#eafff6;}
  .evCard .rel{margin-top:7px;font-size:11px;color:var(--cyan);border-top:1px dashed rgba(122,150,160,.18);padding-top:6px;}
  .empty{color:var(--dim);font-size:13px;padding:20px 0;text-align:center;}

  /* console keypad */
  .console{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start;}
  .conScreen{background:#04110c;border:1px solid rgba(90,220,180,.3);border-radius:10px;padding:16px;font-family:ui-monospace,monospace;}
  .conFreq{font-size:34px;color:var(--green);letter-spacing:.06em;text-align:center;padding:10px 0;}
  .conMsg{font-size:13px;color:#bfeeda;min-height:40px;line-height:1.5;margin-top:8px;}
  .conMsg.bad{color:var(--red);} .conMsg.good{color:var(--green);}
  .conStat{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:10px;border-top:1px dashed rgba(122,150,160,.2);padding-top:8px;}
  .conStat b{color:#eaf1f3;}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .keypad button{padding:16px 0;font-size:20px;font-family:ui-monospace,monospace;background:rgba(120,150,160,.08);
    border:1px solid var(--line);border-radius:8px;color:#eaf1f3;cursor:pointer;}
  .keypad button:hover{border-color:var(--amber);background:rgba(255,180,84,.1);}
  .keypad button.wide{grid-column:span 3;}
  .strengthBar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px;}
  .strengthBar>i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--amber),var(--green));}

  /* planning table (mission 3) */
  #planC{width:100%;height:min(52vh,440px);background:#060b0d;border:1px solid var(--line);border-radius:10px;cursor:grab;}
  #planC.grabbing{cursor:grabbing;}
  .planLegend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:12px;color:var(--dim);}
  .planLegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
  .planCtl{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}

  #loading{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#05070a;gap:16px;text-align:center;padding:24px;}
  #loading .spin{width:46px;height:46px;border:3px solid rgba(255,180,84,.2);border-top-color:var(--amber);border-radius:50%;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  #err{max-width:640px;color:#ffd0d0;font-size:14px;line-height:1.5;}
  #err code{background:rgba(255,255,255,.08);padding:2px 7px;border-radius:5px;color:var(--amber);}
</style>
</head>
<body>
<div id="app"></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="crosshair"></div>
  <div class="corner" id="objPanel">
    <div id="objMission">MISSION</div>
    <div id="objTitle">—</div>
    <ul id="objList"></ul>
  </div>
  <div class="corner" id="timerWrap">
    <div id="timerLab">Extraction Window</div>
    <div id="timerVal" class="mono">--:--</div>
  </div>
  <div class="corner" id="statPanel">
    <div class="lab">Active instrument</div>
    <div id="eqName">— none —</div>
    <div class="lab" style="margin-top:8px">Score</div>
    <div id="scoreVal" class="mono">0</div>
  </div>
  <div id="dialogue" class="hidden"><div id="dlgWho">—</div><div id="dlgText"></div></div>
  <div id="feed"></div>
</div>

<div id="prompt" class="hidden"></div>
<div id="hintChip" class="hidden">Need help? Press <b>H</b> for a hint</div>

<!-- Instrument screen -->
<div id="inst" class="hidden">
  <div class="ihead"><div id="instName">SPECTRUM ANALYZER</div><div id="instHint"></div></div>
  <canvas id="instCanvas" width="1240" height="344"></canvas>
  <div id="obsBar"><i></i></div>
  <div id="obsLab"></div>
  <div id="instReadout"></div>
</div>

<!-- Equipment wheel -->
<div id="wheel"><div id="wheelRing"></div></div>

<!-- Lesson card -->
<div id="lesson" class="hidden">
  <div class="lt"><span id="lessonTitle">FIELD NOTE</span><span class="concept" id="lessonConcept"></span></div>
  <p id="lessonBody"></p>
  <div class="meas" id="lessonMeas"></div>
  <div id="lessonBar"></div>
</div>

<!-- Modal mount -->
<div id="modalMount"></div>

<!-- Loading -->
<div id="loading">
  <div class="spin" id="spin"></div>
  <div class="sub">Spectrum Front</div>
  <div id="loadMsg" style="color:var(--dim)">Loading engine…</div>
  <div id="err" class="hidden"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
/* ============================================================================
   SPECTRUM FRONT — FPS Gameplay, Missions 1–3
   A field-instrument training FPS. You do not shoot; you measure, observe,
   record evidence, and configure real radio systems. Every term you learn is
   named after something you already physically did.
   ========================================================================== */
let THREE, PointerLockControls;
const loadMsg=(m)=>{ const e=document.getElementById('loadMsg'); if(e) e.textContent=m; };
function fatal(msg){
  document.getElementById('spin')?.classList.add('hidden');
  loadMsg('Could not start.');
  const e=document.getElementById('err'); if(e){ e.classList.remove('hidden'); e.innerHTML=msg; }
}
try{
  loadMsg('Loading 3D engine…');
  THREE = await import('three');
  ({ PointerLockControls } = await import('three/addons/controls/PointerLockControls.js'));
}catch(err){
  fatal('Failed to load the 3D engine from the CDN.<br>This game needs an internet connection the first time it runs.<br><br><code>'+(err?.message||err)+'</code>');
  throw err;
}
loadMsg('Building world…');

/* ------------------------------------------------------------------ utils */
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const U={
  clamp:(v,a,b)=>Math.max(a,Math.min(b,v)),
  lerp:(a,b,t)=>a+(b-a)*t,
  rand:(a,b)=>a+Math.random()*(b-a),
  now:()=>performance.now()/1000,
  fmtTime:(s)=>{ s=Math.max(0,Math.ceil(s)); const m=Math.floor(s/60); const r=s%60; return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'); },
};
const $=(id)=>document.getElementById(id);

/* ============================ TextureFactory ============================ */
class TextureFactory{
  _cv(s=256){ const c=document.createElement('canvas'); c.width=c.height=s; return c; }
  _tex(c,rep=1){ const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep,rep);
    t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t; }
  ground(){ const c=this._cv(256), x=c.getContext('2d');
    x.fillStyle='#3a3d34'; x.fillRect(0,0,256,256);
    for(let i=0;i<2600;i++){ const g=U.rand(0,1); x.fillStyle=`rgba(${40+g*40|0},${44+g*36|0},${34+g*24|0},.5)`;
      x.fillRect(Math.random()*256,Math.random()*256,U.rand(1,3),U.rand(1,3)); }
    for(let i=0;i<8;i++){ x.strokeStyle='rgba(20,22,18,.3)'; x.lineWidth=U.rand(1,3); x.beginPath();
      x.moveTo(Math.random()*256,0); x.lineTo(Math.random()*256,256); x.stroke(); }
    return this._tex(c,26); }
  fabric(col='#3c4a3a'){ const c=this._cv(128), x=c.getContext('2d'); x.fillStyle=col; x.fillRect(0,0,128,128);
    for(let i=0;i<70;i++){ x.strokeStyle='rgba(0,0,0,.08)'; x.beginPath(); x.moveTo(0,i*2); x.lineTo(128,i*2); x.stroke(); }
    return this._tex(c,3); }
  metal(col='#40474a'){ const c=this._cv(128), x=c.getContext('2d'); x.fillStyle=col; x.fillRect(0,0,128,128);
    for(let i=0;i<400;i++){ const g=U.rand(-20,20); x.fillStyle=`rgba(${g+90|0},${g+96|0},${g+100|0},.15)`; x.fillRect(Math.random()*128,Math.random()*128,U.rand(1,10),1); }
    return this._tex(c,2); }
}
/* ============================ MaterialFactory =========================== */
class MaterialFactory{
  constructor(tf){ this.tf=tf; this.cache={}; }
  flat(color,opts={}){ return new THREE.MeshStandardMaterial({color,roughness:opts.rough??.85,metalness:opts.metal??.08,
    emissive:opts.emissive||0x000000, emissiveIntensity:opts.ei||1}); }
  ground(){ if(this.cache.g) return this.cache.g; const m=new THREE.MeshStandardMaterial({map:this.tf.ground(),roughness:.98,metalness:0}); return this.cache.g=m; }
  fabric(col){ const m=new THREE.MeshStandardMaterial({map:this.tf.fabric(col),roughness:.92,metalness:0}); return m; }
  metal(col,opts={}){ const m=new THREE.MeshStandardMaterial({map:this.tf.metal(col),roughness:opts.rough??.55,metalness:opts.metal??.6}); return m; }
  glow(color){ return new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:1.4,roughness:.4}); }
}

/* ============================ RendererManager =========================== */
class RendererManager{
  constructor(container){
    this.renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    this.renderer.setSize(innerWidth,innerHeight);
    this.renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    this.renderer.outputColorSpace=THREE.SRGBColorSpace;
    this.renderer.toneMapping=THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure=1.14;
    this.renderer.shadowMap.enabled=true;

/* ============================ AudioManager ============================== */
class AudioManager{
  constructor(){ this.ctx=null; this.master=null; this.enabled=true; this.vol=.6; this.started=false; this.loops={}; }
  start(){ if(this.started) return;
    try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); this.master=this.ctx.createGain();
      this.master.gain.value=this.vol; this.master.connect(this.ctx.destination); this.started=true; this._amb(); }
    catch(e){ this.enabled=false; } }
  _env(g,a,d,peak=1){ const t=this.ctx.currentTime; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a);
    g.gain.exponentialRampToValueAtTime(.0001,t+a+d); }
  tone(f,dur,type='sine',peak=.22,detune=0){ if(!this.ctx||!this.enabled)return; const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type; o.frequency.value=f; o.detune.value=detune; o.connect(g); g.connect(this.master); this._env(g,.005,dur,peak); o.start(); o.stop(this.ctx.currentTime+dur+.05); }
  noise(dur,peak=.3,ff=1200,type='lowpass'){ if(!this.ctx||!this.enabled)return; const len=Math.floor(this.ctx.sampleRate*dur);
    const b=this.ctx.createBuffer(1,len,this.ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const s=this.ctx.createBufferSource(); s.buffer=b; const fl=this.ctx.createBiquadFilter(); fl.type=type; fl.frequency.value=ff;
    const g=this.ctx.createGain(); s.connect(fl); fl.connect(g); g.connect(this.master); this._env(g,.004,dur,peak); s.start(); s.stop(this.ctx.currentTime+dur+.05); }
  step(){ this.noise(.06,.09,200,'lowpass'); }
  pickup(){ this.tone(660,.08,'triangle',.2); setTimeout(()=>this.tone(990,.1,'triangle',.2),80); }
  ui(){ this.tone(760,.05,'sine',.13); }
  chirp(){ this.tone(1500,.04,'sine',.11); }
  good(){ this.tone(680,.09,'sine',.2); setTimeout(()=>this.tone(1020,.12,'sine',.2),90); }
  bad(){ this.tone(150,.18,'sawtooth',.18); }
  record(){ this.tone(520,.06,'square',.16); setTimeout(()=>this.tone(880,.08,'square',.16),70); }
  complete(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.tone(f,.22,'triangle',.2),i*130)); }
  radio(){ this.noise(.22,.06,1600,'bandpass'); }
  beacon(){ this.tone(1200,.08,'sine',.14); }
  alarm(){ this.tone(720,.18,'square',.16); setTimeout(()=>this.tone(540,.18,'square',.16),200); }
  // continuous audio monitor of the signal at the marker
  monitor(active,strength,burst){ if(!this.ctx||!this.enabled) return;
    if(active && !this.loops.m){ const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.value=520;
      g.gain.value=.0001; o.connect(g); g.connect(this.master); o.start(); this.loops.m={o,g}; }
    if(!active && this.loops.m){ const l=this.loops.m; l.g.gain.setTargetAtTime(.0001,this.ctx.currentTime,.08); setTimeout(()=>{try{l.o.stop();}catch(e){}},250); this.loops.m=null; }
    if(active && this.loops.m){ const s=U.clamp(strength,0,1);
      this.loops.m.o.frequency.setTargetAtTime(320+s*900,this.ctx.currentTime,.05);
      this.loops.m.g.gain.setTargetAtTime(burst?(.02+s*.09):.004,this.ctx.currentTime,.03); } }
  _amb(){ if(!this.ctx)return; const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sawtooth'; o.frequency.value=44;
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=110; o.connect(f); f.connect(g); g.connect(this.master); g.gain.value=.04; o.start(); this.loops.amb={o,g}; }
}

class ParticleManager{

    this.points=new THREE.Points(this.geo,mat); this.points.frustumCulled=false; scene.add(this.points);
    for(let i=0;i<this.max;i++) this.parts.push({life:0,max:1,vx:0,vy:0,vz:0,x:0,y:-999,z:0,r:1,g:1,b:1,s:.2,grav:-2,smoke:false}); }
  emit(x,y,z,o={}){ const n=o.count||8; for(let k=0;k<n;k++){ const p=this.parts.find(p=>p.life<=0); if(!p)break;
    const sp=o.speed||2; p.x=x;p.y=y;p.z=z; p.vx=U.rand(-1,1)*sp; p.vy=(o.up||Math.random())*sp; p.vz=U.rand(-1,1)*sp;
    p.life=p.max=o.life||U.rand(.4,.9); const c=o.color||[.6,.55,.45]; p.r=c[0];p.g=c[1];p.b=c[2]; p.s=o.size||U.rand(.1,.28); p.grav=o.grav??-1; p.smoke=!!o.smoke; } }
  dust(x,y,z){ this.emit(x,y,z,{count:6,speed:.9,color:[.5,.46,.4],life:1.6,size:.34,grav:.1,smoke:true}); }
  spark(x,y,z,c=[.4,.9,.7]){ this.emit(x,y,z,{count:10,speed:2.2,color:c,life:.5,size:.1,grav:-3}); }
  update(dt){ let n=0; const pos=this.pos,col=this.col,siz=this.siz;
    for(const p of this.parts){ if(p.life>0){ p.life-=dt; p.vy+=p.grav*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
      if(p.y<.03){ p.y=.03; p.vy*=-.3; p.vx*=.6; p.vz*=.6; } const a=U.clamp(p.life/p.max,0,1);
      pos[n*3]=p.x;pos[n*3+1]=p.y;pos[n*3+2]=p.z; col[n*3]=p.r*a;col[n*3+1]=p.g*a;col[n*3+2]=p.b*a; siz[n]=p.smoke?p.s*(2-a):p.s*a; n++; } }
    for(let i=n;i<this.max;i++){ pos[i*3+1]=-999; siz[i]=0; }
    this.geo.attributes.position.needsUpdate=this.geo.attributes.color.needsUpdate=this.geo.attributes.size.needsUpdate=true;
    this.geo.setDrawRange(0,this.max); }

  console(x,z,rot=0,col='#2a3236',glow='#4fd6ff'){ const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=rot;
    const base=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.05,.7),this.mat.metal(col,{rough:.6,metal:.4})); base.position.y=.53; base.castShadow=true;

}

class PlayerController{
  constructor(camera,controls,world,audio){ this.cam=camera; this.controls=controls; this.world=world; this.audio=audio;
    this.pos=V3(0,1.7,20); this.vel=V3(0,0,0); this.onGround=true; this.height=1.7; this.crouchH=1.05; this.radius=.42;
    this.speed=5.6; this.sprintMul=1.6; this.crouch=false; this.sprint=false; this.stepT=0; this.bob=0; this.keys={};
    this.frozen=false; this.controls.getObject().position.copy(this.pos); }
  key(c,d){ this.keys[c]=d; }
  spawn(x,z,lookDeg=0){ this.pos.set(x,1.7,z); this.vel.set(0,0,0); this.controls.getObject().position.copy(this.pos); }
  update(dt){ const obj=this.controls.getObject();
    if(this.frozen){ obj.position.set(this.pos.x,this.pos.y,this.pos.z); return; }
    const fwd=new THREE.Vector3(); this.cam.getWorldDirection(fwd); fwd.y=0; fwd.normalize();
    const right=new THREE.Vector3().crossVectors(fwd,V3(0,1,0)).normalize(); let move=new THREE.Vector3();
    if(this.keys['KeyW'])move.add(fwd); if(this.keys['KeyS'])move.sub(fwd); if(this.keys['KeyD'])move.add(right); if(this.keys['KeyA'])move.sub(right);
    const moving=move.lengthSq()>0; if(moving)move.normalize();
    this.sprint=this.keys['ShiftLeft']&&this.keys['KeyW']&&!this.crouch;
    const sp=this.speed*(this.crouch?.5:1)*(this.sprint?this.sprintMul:1);
    const target=move.multiplyScalar(sp);
    this.vel.x=U.lerp(this.vel.x,target.x,1-Math.pow(.0009,dt)); this.vel.z=U.lerp(this.vel.z,target.z,1-Math.pow(.0009,dt));
    this.pos.x+=this.vel.x*dt; this.pos.z+=this.vel.z*dt;
    this.world.resolve(this.pos,this.radius);
    this.pos.x=U.clamp(this.pos.x,-92,92); this.pos.z=U.clamp(this.pos.z,-92,92);
    const targetH=this.crouch?this.crouchH:this.height; this.pos.y=U.lerp(this.pos.y,targetH,1-Math.pow(.005,dt));
    if(moving&&this.onGround){ this.stepT+=dt*(this.sprint?11:7); if(this.stepT>Math.PI){ this.stepT-=Math.PI; this.audio.step(); } this.bob=Math.sin(this.stepT*2)*.03*(this.sprint?1.4:1); } else this.bob*=.9;
    obj.position.set(this.pos.x,this.pos.y+this.bob,this.pos.z); }
  heading(){ const f=new THREE.Vector3(); this.cam.getWorldDirection(f); f.y=0; f.normalize(); return f; }
}

/* ============================ SpectrumSim ============================== */
// The physics of Missions 1 & 2. Signals have a location (freq), an occupied
// width (bandwidth), a power, and a timing (continuous or bursting). The
// analyzer renders a trace over a tunable center/span, plus a waterfall.
class Signal{
  constructor(o){ Object.assign(this,{power:.6,bw:24,mode:'cw',interval:1,duration:1,phase:0,hidden:true,color:'#57e389'},o); }
  onAt(t){ if(this.mode==='cw') return true; const p=((t+this.phase)%this.interval); return p<this.duration; }
  // fraction into current burst 0..1 for envelope (soft attack/decay)
  env(t){ if(this.mode==='cw') return 1; const p=((t+this.phase)%this.interval); if(p>=this.duration) return 0;
    const a=Math.min(p/(this.duration*.25),1), b=Math.min((this.duration-p)/(this.duration*.35),1); return Math.min(a,b); }
}
class SpectrumSim{
  constructor(signals,opts={}){ this.signals=signals; this.noiseFloorDbm=opts.noiseFloor??-96; this.t=0; this.waterfall=[]; this.wfMax=64; this.bins=opts.bins??220; }
  update(dt){ this.t+=dt; }
  // level 0..1 at a frequency (MHz), given time. sums signal bumps + noise.
  // minSigma keeps a narrow carrier at least ~1 display bin wide so it renders as
  // a visible spike instead of falling between samples (analyzer resolution bandwidth).
  levelAt(f,t,minSigma=0){ let lin=Math.pow(10,(this.noiseFloorDbm+U.rand(-2,2))/20)*.02;
    for(const s of this.signals){ const sigma=Math.max((s.bw/1000)*.6,minSigma); if(Math.abs(f-s.freq)>Math.max(.2,sigma*4)) continue;
      const e=s.env(t); if(e<=0) continue; const g=Math.exp(-Math.pow((f-s.freq)/sigma,2)); lin+=s.power*e*g; }
    return lin; }
  // dBm for display from linear-ish level
  dbm(level){ return U.clamp(-100 + level*78, -110, 6); }
  // spectrum array over center/span. Sub-bin-narrow signals are widened to ~1 bin.
  spectrum(center,span,t){ const out=new Array(this.bins); const lo=center-span/2; const bw=span/(this.bins-1); const minSig=bw*1.1;
    for(let i=0;i<this.bins;i++){ const f=lo+i*bw; out[i]={f,level:this.levelAt(f,t,minSig)}; } return out; }
  pushWaterfall(spec){ this.waterfall.push(spec.map(s=>s.level)); if(this.waterfall.length>this.wfMax) this.waterfall.shift(); }
  // strongest signal currently within [center-span/2, center+span/2]
  peakInView(center,span,t){ let best=null,bp=-1; for(const s of this.signals){ if(Math.abs(s.freq-center)>span/2) continue; const e=s.env(t); const eff=s.power*Math.max(e,.001);
    // for detection consider whether it's on now; but report even if momentarily off
    if(s.power>bp){ bp=s.power; best=s; } } return best; }
  signalNear(freq,tolMHz){ let best=null,bd=1e9; for(const s of this.signals){ const d=Math.abs(s.freq-freq); if(d<tolMHz && d<bd){ bd=d; best=s; } } return best; }
}

/* ============================ SystemsBus =============================== */
// UI systems shared across all missions: objectives, dialogue, feed notes,
// evidence notebook, lesson cards, hint ladder, score.
class Systems{
  constructor(game){ this.g=game; this.evidence=[]; this.lessonsSeen=new Set(); this.score=0; this.hintLevel=0; this._dlgTimer=null; this._lessonTimer=null; }
  /* ---- score ---- */
  addScore(pts,label){ this.score+=pts; $('scoreVal').textContent=this.score; if(pts>0){ this.note(`+${pts} · ${label}`,'good'); } }
  /* ---- feed notes ---- */
  note(text,kind=''){ const f=$('feed'); const d=document.createElement('div'); d.className='note'+(kind?' '+kind:''); d.textContent=text;
    f.appendChild(d); setTimeout(()=>{ d.style.transition='opacity .5s'; d.style.opacity='0'; setTimeout(()=>d.remove(),500); },5200); if(f.children.length>6) f.firstChild.remove(); }
  /* ---- dialogue ---- */
  say(who,text,{radio=false,dur=null,then=null}={}){ const box=$('dialogue'); box.classList.remove('hidden'); box.classList.toggle('radio',radio);
    $('dlgWho').textContent=who; $('dlgText').textContent=text; this.g.audio.radio&&radio&&this.g.audio.radio();
    clearTimeout(this._dlgTimer); const time=dur??Math.max(2600,text.length*46);
    this._dlgTimer=setTimeout(()=>{ box.classList.add('hidden'); if(then)then(); },time); }
  // play an ordered dialogue sequence [ [who,text,{opts}], ... ]
  sequence(lines,onDone){ let i=0; const next=()=>{ if(i>=lines.length){ onDone&&onDone(); return; } const [who,text,opts={}]=lines[i++];
    this.say(who,text,{...opts,then:next}); }; next(); }
  /* ---- objectives ---- */
  setObjective(mission,title,steps){ $('objMission').textContent=mission; $('objTitle').textContent=title;
    const ul=$('objList'); ul.innerHTML=''; this._steps=steps.map(s=>({...s})); this._renderSteps(); }
  _renderSteps(){ const ul=$('objList'); ul.innerHTML=''; let activeSet=false;
    for(const s of this._steps){ const li=document.createElement('li'); li.textContent=s.text;
      if(s.done) li.className='done'; else if(!activeSet){ li.className='active'; activeSet=true; } ul.appendChild(li); } }
  completeStep(id){ const s=this._steps?.find(s=>s.id===id); if(s&&!s.done){ s.done=true; this._renderSteps(); this.g.audio.chirp(); } }
  stepDone(id){ return !!this._steps?.find(s=>s.id===id)?.done; }
  /* ---- lesson cards (<=12s, one concept, uses player's measurement) ---- */
  lesson(concept,body,meas,{once=true,key=null}={}){ const k=key||concept; if(once&&this.lessonsSeen.has(k)) return; this.lessonsSeen.add(k);
    const el=$('lesson'); el.classList.remove('hidden'); $('lessonTitle').textContent='FIELD LESSON'; $('lessonConcept').textContent=concept.toUpperCase();
    $('lessonBody').textContent=body; $('lessonMeas').innerHTML=meas||''; $('lessonMeas').style.display=meas?'block':'none';
    this.g.audio.good(); this.evidence.lessonCards=this.evidence.lessonCards||[]; this._lessonLog=this._lessonLog||[]; this._lessonLog.push({concept,body,meas});
    const bar=$('lessonBar'); bar.style.transition='none'; bar.style.width='100%'; requestAnimationFrame(()=>{ bar.style.transition='width 11s linear'; bar.style.width='0%'; });
    clearTimeout(this._lessonTimer); this._lessonTimer=setTimeout(()=>el.classList.add('hidden'),11000); }
  hideLesson(){ $('lesson').classList.add('hidden'); clearTimeout(this._lessonTimer); }
  /* ---- evidence ---- */
  addEvidence(card){ card.time=this.g.missionClock(); this.evidence.push(card); this.g.audio.record(); this.note('Evidence recorded: '+card.name,'good'); return card; }
  hasEvidence(pred){ return this.evidence.some(pred); }
  /* ---- hints ---- */
  setHints(ladder){ this.hints=ladder; this.hintLevel=0; }
  nextHint(){ if(!this.hints||!this.hints.length) return; const h=this.hints[Math.min(this.hintLevel,this.hints.length-1)];
    this.hintUsed=true; if(this.hintLevel<this.hints.length) this.hintLevel++;
    this.say('HINT · '+h.tier, h.text, {dur:6000, radio:false}); this.note('Hint '+this.hintLevel+' used — reduces independence score','amber'); }
}

    this.center=400; this.span=40; this.spanMin=6; this.spanMax=80; this.band=[380,520];
    this.mode='record'; this.fine=false; this.tunedThisFrame=false;
    this.observeT=0; this.recordHold=0; this.recording=false; this.autoRecord=false;
    this.identified=new Set(); this.obs={}; this.recorded=new Set();
    this.measure={active:false,left:null,right:null,target:null};
    this._wfT=0; }
  give(n){ this.available.add(n); }
  has(n){ return this.available.has(n); }
  configFromMission(cfg){ if(!cfg) return; this.band=cfg.band||this.band; this.center=cfg.start??((this.band[0]+this.band[1])/2);
    this.span=cfg.span??40; this.spanMin=cfg.spanMin??6; this.spanMax=cfg.spanMax??80; this.mode=cfg.mode||'record';
    this.coarseStep=cfg.coarse??(this.span*0.04); this.fineStep=cfg.fine??(this.span*0.006);
    this.observeT=0; this.identified=new Set(); this.obs={}; this.recorded=new Set(); this.measure={active:false,left:null,right:null,target:null}; }
  equip(n){ if(!this.available.has(n)) return; this.active=n; $('inst').classList.remove('hidden'); $('eqName').textContent=INSTR_LABEL[n]; this.g.audio.pickup(); this.g.closeWheel(); }
  holster(){ this.active=null; $('inst').classList.add('hidden'); $('eqName').textContent='— none —'; this.g.audio.monitor(false,0,false); $('crosshair').classList.remove('rec'); $('obsBar').style.display='none'; $('obsLab').style.display='none'; }
  toggle(n){ if(this.active===n) this.holster(); else this.equip(n); }
  cycle(){ const list=[...this.available]; if(!list.length) return; const i=list.indexOf(this.active); this.equip(list[(i+1)%list.length]); }
  // span-relative steps: zooming in (smaller span) automatically makes tuning finer,
  // so precise landing is always possible without a dedicated fine-tune control.
  tune(dir){ if(this.active!=='analyzer') return; const step=(this.fine?this.span*0.008:this.span*0.07); this.center=U.clamp(this.center+dir*step,this.band[0],this.band[1]); this.tunedThisFrame=true; this.g.audio.chirp(); }
  spanAdjust(dir){ if(this.active!=='analyzer') return; this.span=U.clamp(this.span*(dir<0?0.85:1.18),this.spanMin,this.spanMax); this.g.audio.ui(); }
  recalibrate(){ if(this.active!=='analyzer') return; this.g.audio.ui(); this.g.systems.note('Analyzer recalibrated — noise floor re-estimated'); }
  // LMB press/hold on analyzer
  primaryDown(){ if(this.active==='tablet'){ this.recording=true; return; }
    if(this.active!=='analyzer') return;
    if(this.mode==='measure'){ this._measureEdge(); return; }
    this.recording=true; }
  primaryUp(){ this.recording=false; if(!this.autoRecord){ this.recordHold=0; $('crosshair').classList.remove('rec'); } }
  // keyboard equivalent of "use": one tap starts an auto-capture (no holding needed)
  primaryTap(){ if(this.active==='tablet'){ this.autoRecord=true; return; }
    if(this.active!=='analyzer') return;
    if(this.mode==='measure'){ this._measureEdge(); return; }
    if(!this.autoRecord) this.autoRecord=true; }
  _measureEdge(){ const m=this.g.mission; if(!m.sim) return;
    if(this.measure.left===null){ this.measure.left=this.center; this.g.audio.record(); this.g.systems.note('Left edge marked at '+this.center.toFixed(3)+' MHz'); }
    else if(this.measure.right===null){ this.measure.right=this.center; this.g.audio.record();
      const bw=Math.abs(this.measure.right-this.measure.left)*1000; // kHz
      m.onBandwidthMeasured&&m.onBandwidthMeasured(bw,{left:this.measure.left,right:this.measure.right}); this.measure.left=null; this.measure.right=null; } }
  update(dt){ if(this.active==='analyzer') this._updateAnalyzer(dt);
    else if(this.active==='tablet') this._updateTablet(dt); }
  _updateAnalyzer(dt){ const m=this.g.mission, sim=m.sim; if(!sim){ return; }
    // observation timer
    if(this.tunedThisFrame){ this.observeT=0; } else { this.observeT=Math.min(this.observeT+dt,6); }
    // per-signal dwell → identification of timing
    const tol=Math.max(0.35, sim.spectrum?0:0)+0.35;
    for(const s of sim.signals){ if(Math.abs(s.freq-this.center)<Math.max(0.5,s.bw/1000+0.25)){
      this.obs[s.id]=(this.obs[s.id]||0)+dt; if(s.mode==='cw' && this.obs[s.id]>0.6) this.identified.add(s.id);
      if(s.mode==='burst' && this.obs[s.id]>=s.interval*1.05) this.identified.add(s.id);
    } }
    // recording (record mode)
    const near=sim.signalNear(this.center,0.5);
    if(this.mode==='record'){ if((this.recording||this.autoRecord) && near){ this.recordHold+=dt; $('crosshair').classList.add('rec');
        if(this.recordHold>=1.0 && !this.recorded.has(near.id)){ this.recorded.add(near.id); this.recordHold=0; this.autoRecord=false; $('crosshair').classList.remove('rec'); m.onRecordSignal&&m.onRecordSignal(near,this.identified.has(near.id)); } }
      else { this.recordHold=0; this.autoRecord=false; $('crosshair').classList.remove('rec'); } }
    // audio monitor
    const lvl=sim.levelAt(this.center,sim.t); const on=near?near.onAt(sim.t):false;
    this.g.audio.monitor(true, U.clamp(lvl,0,1), on && lvl>0.12);
    this._renderAnalyzer(near);
    this.tunedThisFrame=false;
  }
  _renderAnalyzer(near){ const m=this.g.mission, sim=m.sim; const ctx=this.ctx, W=this.canvas.width, H=this.canvas.height;
    const wfH=104, gap=6, trTop=wfH+gap, trH=H-trTop-2;
    ctx.fillStyle='#04110c'; ctx.fillRect(0,0,W,H);
    const spec=sim.spectrum(this.center,this.span,sim.t);
    this._wfT+=1/60; if(this._wfT>0.045){ this._wfT=0; sim.pushWaterfall(spec); }
    // waterfall
    const wf=sim.waterfall, rows=wf.length, cols=sim.bins;
    if(rows){ const cellW=W/cols, cellH=wfH/sim.wfMax;
      for(let r=0;r<rows;r++){ const row=wf[rows-1-r]; const y=r*cellH;
        for(let c=0;c<cols;c++){ const v=U.clamp(row[c],0,1); if(v<0.04) continue;
          const g=Math.min(255,60+v*220|0), b=Math.min(255,40+v*90|0); ctx.fillStyle=`rgb(${20+v*40|0},${g},${b})`; ctx.fillRect(c*cellW,y,cellW+1,cellH+1); } } }
    ctx.strokeStyle='rgba(90,220,180,.25)'; ctx.strokeRect(.5,.5,W-1,wfH);
    ctx.fillStyle='#5f7d74'; ctx.font='11px monospace'; ctx.fillText('WATERFALL',6,14);
    // trace area
    ctx.save(); ctx.translate(0,trTop);
    ctx.fillStyle='#04110c'; ctx.fillRect(0,0,W,trH);
    for(let i=0;i<=8;i++){ const x=i/8*W; ctx.strokeStyle='rgba(90,220,180,.08)'; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,trH); ctx.stroke(); }
    // noise floor
    const nfLvl=0.06, nfy=trH-nfLvl*trH; ctx.strokeStyle='rgba(150,170,180,.45)'; ctx.setLineDash([6,6]); ctx.beginPath(); ctx.moveTo(0,nfy); ctx.lineTo(W,nfy); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#8ea1a8'; ctx.fillText('noise floor '+sim.dbm(nfLvl).toFixed(0)+' dBm',6,nfy-4);
    // trace
    ctx.beginPath(); ctx.strokeStyle='#57e389'; ctx.lineWidth=2; let peakL=0,peakF=this.center;
    spec.forEach((s,i)=>{ const x=i/(sim.bins-1)*W; const y=trH-U.clamp(s.level,0,1)*trH*0.94; if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); if(s.level>peakL){peakL=s.level;peakF=s.f;} });
    ctx.stroke(); ctx.lineTo(W,trH); ctx.lineTo(0,trH); ctx.closePath(); ctx.fillStyle='rgba(87,227,137,.12)'; ctx.fill();
    // measure marks
    if(this.mode==='measure'){ for(const [e,c] of [[this.measure.left,'#4fd6ff'],[this.measure.right,'#4fd6ff']]){ if(e==null) continue;
        const x=(e-(this.center-this.span/2))/this.span*W; ctx.strokeStyle=c; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,trH); ctx.stroke(); } }
    // marker (center)
    const mx=W/2; ctx.strokeStyle='#ffb454'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(mx,0); ctx.lineTo(mx,trH); ctx.stroke();
    ctx.fillStyle='#ffb454'; ctx.font='13px monospace'; ctx.textAlign='center'; ctx.fillText('▼ '+this.center.toFixed(3),mx,12); ctx.textAlign='left';
    // freq labels
    ctx.fillStyle='#7fb3a4'; ctx.font='12px monospace'; ctx.fillText((this.center-this.span/2).toFixed(1),4,trH-5);
    ctx.textAlign='right'; ctx.fillText((this.center+this.span/2).toFixed(1)+' MHz',W-4,trH-5); ctx.textAlign='left';
    ctx.restore();
    // observation bar
    const ob=$('obsBar'), ol=$('obsLab');
    if(this.observeT>0.05 && this.observeT<5.2){ ob.style.display='block'; ol.style.display='block'; ob.querySelector('i').style.width=Math.min(100,this.observeT/5*100)+'%'; ol.textContent='Observing this region: '+this.observeT.toFixed(1)+' s'; }
    else if(this.observeT>=5.2){ ob.style.display='block'; ol.style.display='block'; ob.querySelector('i').style.width='100%'; ol.textContent='Observation window complete ('+this.observeT.toFixed(1)+' s)'; }
    else { ob.style.display='none'; ol.style.display='none'; }
    // readout
    const ro=[['Center',this.center.toFixed(3)+' MHz'],['Span',this.span.toFixed(1)+' MHz'],['Peak',sim.dbm(peakL).toFixed(0)+' dBm @ '+peakF.toFixed(2)],
      ['Marker',sim.dbm(sim.levelAt(this.center,sim.t)).toFixed(0)+' dBm'],['Scan-hold',this.observeT>=5?'LOCKED':this.tunedThisFrame?'scanning':'holding'],
      ['At marker', near?(this.identified.has(near.id)?(near.mode==='burst'?('burst · '+near.interval.toFixed(1)+' s'):'continuous'):'observing…'):'— empty —']];
    $('instReadout').innerHTML=ro.map(([k,v])=>`<span>${k}: <b>${v}</b></span>`).join('');
    $('instHint').textContent = this.mode==='measure' ? '◄ ► tune · ▲ ▼ zoom · Space: mark band edge · R: recalibrate'
      : '◄ ► tune · ▲ ▼ zoom · Space: record · R: recalibrate';
    this.canvas._peakF=peakF;
  }
  _updateTablet(dt){ const m=this.g.mission; const ctx=this.ctx,W=this.canvas.width,H=this.canvas.height;
    ctx.fillStyle='#04110c'; ctx.fillRect(0,0,W,H);
    const d=m.tablet||{}; const hist=d.history||[];
    // packet-loss history graph
    ctx.strokeStyle='rgba(90,220,180,.1)'; for(let i=0;i<=5;i++){ const y=i/5*H; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    ctx.fillStyle='#5f7d74'; ctx.font='12px monospace'; ctx.fillText('MEDICAL PACKET LOSS (%)  0–60',8,16);
    ctx.beginPath(); ctx.lineWidth=2;
    hist.forEach((v,i)=>{ const x=i/(Math.max(1,d.histMax-1))*W; const y=H-U.clamp(v/60,0,1)*(H-20)-6; if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); });
    const cur=hist.length?hist[hist.length-1]:0; ctx.strokeStyle=cur<5?'#57e389':cur<20?'#ffb454':'#ff6b6b'; ctx.stroke();
    // 5% threshold
    const ty=H-5/60*(H-20)-6; ctx.setLineDash([5,5]); ctx.strokeStyle='rgba(87,227,137,.5)'; ctx.beginPath(); ctx.moveTo(0,ty); ctx.lineTo(W,ty); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#57e389'; ctx.fillText('5% target',W-70,ty-4);
    const ro=[['Patient devices',(d.devices??6)+' connected'],['Packet loss',(cur).toFixed(0)+'%'],['Median latency',(d.latency??42)+' ms'],
      ['Retransmissions',d.retrans??'low'],['Medical channel',(d.medFreq??2450).toFixed(3)+' MHz'],['Receiver filter',(d.filterW??260)+' kHz'],['Status',cur<5?'GREEN':cur<20?'DEGRADED':'RED']];
    $('instReadout').innerHTML=ro.map(([k,v])=>`<span>${k}: <b>${v}</b></span>`).join('');
    $('instHint').textContent='network diagnostic — LMB(hold) at node to record baseline';
    $('instHint').textContent='network diagnostic — press Space (or hold LMB) to record baseline';
    // baseline record via Space (tap) or LMB (hold)
    if(this.recording||this.autoRecord){ this.recordHold+=dt; $('crosshair').classList.add('rec'); if(this.recordHold>=1.0){ this.recordHold=0; $('crosshair').classList.remove('rec'); this.recording=false; this.autoRecord=false; m.onTabletRecord&&m.onTabletRecord(); } }
    else { this.recordHold=0; }
  }
}

/* ============================ Modal helper ============================= */
// Focused modal that releases pointer lock and restores game input on close.
let _activeModal=null;
function modal(bodyEl,{onClose,onOpen}={}){ const mount=$('modalMount'); mount.innerHTML=''; const card=document.createElement('div'); card.className='mcard';
  card.appendChild(bodyEl); mount.appendChild(card); mount.style.display='flex'; _activeModal={close}; GAME&&GAME.releaseLock();
  function close(){ mount.style.display='none'; mount.innerHTML=''; _activeModal=null; onClose&&onClose(); GAME&&GAME.requestLock(); }
  onOpen&&onOpen(close); return close; }
function modalOpen(){ return !!_activeModal; }
function closeModal(){ if(_activeModal) _activeModal.close(); }
function el(tag,cls,html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }

function openNotebook(game){ const s=game.systems; const body=el('div');

  if(!s.evidence.length){ body.appendChild(el('div','empty','No evidence recorded yet. Use an instrument and record a measurement.')); }
  else{ const grid=el('div','evGrid');
    s.evidence.forEach(c=>{ const card=el('div','evCard'+(c.good?' good':c.bad?' bad':'')); card.innerHTML=`<div class="en">${c.name}</div>`;
      const cv=el('canvas'); cv.width=200; cv.height=56; card.appendChild(cv); drawThumb(cv,c);
      card.insertAdjacentHTML('beforeend',`<div class="er">${c.lines.map(l=>l).join('<br>')}</div>`+(c.relevance?`<div class="rel">${c.relevance}</div>`:''));
      grid.appendChild(card); });
    body.appendChild(grid); }
  const foot=el('div','row'); const b=el('button','btn','Close'); b.onclick=()=>closeCb(); foot.appendChild(b); body.appendChild(foot);
  const closeCb=modal(body,{}); }
function drawThumb(cv,c){ const x=cv.getContext('2d'); x.fillStyle='#04110c'; x.fillRect(0,0,cv.width,cv.height);
  x.strokeStyle='#57e389'; x.lineWidth=1.5; x.beginPath();
  if(c.thumb==='burst'){ for(let i=0;i<cv.width;i++){ const on=(i%40)<6; const y=cv.height-(on?38:3)-4; if(i===0)x.moveTo(0,y); else x.lineTo(i,y);} }
  else if(c.thumb==='cw'){ for(let i=0;i<cv.width;i++){ const g=Math.exp(-Math.pow((i-cv.width/2)/8,2)); const y=cv.height-g*40-4; if(i===0)x.moveTo(0,y); else x.lineTo(i,y);} }
  else if(c.thumb==='wide'){ for(let i=0;i<cv.width;i++){ const g=Math.exp(-Math.pow((i-cv.width/2)/40,2)); const y=cv.height-g*40-4; if(i===0)x.moveTo(0,y); else x.lineTo(i,y);} }
  else { for(let i=0;i<cv.width;i++){ const y=cv.height-6-Math.random()*4; if(i===0)x.moveTo(0,y); else x.lineTo(i,y);} }
  x.stroke(); }

// pure packet-loss model. Medical and logistics OVERLAP, so filtering is a real
// tradeoff: too narrow clips the desired signal, too wide admits the interferer,
// and the best filter plateaus above 5% — only moving the interferer clears it.
// Clipping is measured against medical's defined core band (not gaussian tails),
// which decouples the two failure modes cleanly. Verified numerically.
const LOSS_K={sd:2.0, clip:85, leak:95, skirt:0.02};
function computeLoss(filter,{medFreq,bwMedKHz,logFreq,bwLogKHz,logPow}){
  const N=520, lo=medFreq-1.6, hi=medFreq+1.6, step=(hi-lo)/N; const sig=(x)=>1/(1+Math.exp(-x));
  const gAt=(f,cf,bwKHz)=>Math.exp(-Math.pow((f-cf)/((bwKHz/1000)/2/LOSS_K.sd),2));
  const coreLo=medFreq-bwMedKHz/2000, coreHi=medFreq+bwMedKHz/2000;
  let coreTot=0,coreIn=0,logIn=0,medTot=0;
  for(let i=0;i<N;i++){ const f=lo+i*step; const m=gAt(f,medFreq,bwMedKHz); const l=gAt(f,logFreq,bwLogKHz)*logPow;
    const T=sig((f-filter.lo)/LOSS_K.skirt)*sig((filter.hi-f)/LOSS_K.skirt); medTot+=m;
    if(f>=coreLo&&f<=coreHi){ coreTot+=m; coreIn+=m*T; } logIn+=l*T; }
  const clip=1-coreIn/coreTot, leak=logIn/medTot;
  return U.clamp(2 + clip*LOSS_K.clip + leak*LOSS_K.leak, 1, 92);
}
/* ---- Mission 2 focused UIs ---- */
function openFilterTuner(game,M){ const body=el('div'); body.appendChild(el('div','mtitle','<h2>Receiver Filter — Medical Telemetry</h2><span class="tag">drag the filter edges</span>'));

  body.appendChild(cv); const info=el('div'); info.style.cssText='display:flex;flex-wrap:wrap;gap:6px 24px;font-size:13px;color:#c8d4d9;margin-top:12px'; body.appendChild(info);

    id:3, name:'Choose a Link Before the Unit Is Cut Off', concept:'The spectrum as a finite, shared resource',
    briefing:{ role:'Communications planner', location:'Command-planning shelter → industrial field deployment',
      stakes:'A platoon is about to enter an industrial district where the existing relay is damaged. They need command voice, position reports, medical telemetry, and drone imagery. Build a communications plan that survives the terrain before the platoon crosses into the district. Many systems must share one finite spectrum.',
      primary:'The electromagnetic spectrum as a finite operational resource', secondary:'Frequency bands · bandwidth demand · propagation tradeoffs · spectrum planning' },
    get sim(){ return null; }, services:SERVICES, occupied:OCCUPIED, axis:[AXIS_LO,AXIS_HI],

      w.box(0,0.45,0,7,0.9,1.4,game.mat.metal('#222a2e',{rough:.6}));

      // relay sites outside
      w.box(30,4,-20,3,8,3,game.mat.metal('#4a5258',{rough:.6})); // water tower base
      w.box(40,3,-6,8,6,10,game.mat.metal('#3a4248',{rough:.8})); // warehouse
      // simple hill
      const hill=new THREE.Mesh(new THREE.SphereGeometry(8,16,12,0,Math.PI*2,0,Math.PI/2),game.mat.flat('#3d4436',{rough:1})); hill.position.set(-30,0,-24); w.scene.add(hill); w.addCollider(-30,-24,10,10,3);
      game.spawn(0,14);

        {id:'voice',text:'Give command voice a frequency that survives the terrain'},
        {id:'relay',text:'Walk to a relay site and place a terrain-tested relay for the drone'},
        {id:'priority',text:'Prioritize medical telemetry for the emergency burst'},
        {id:'exec',text:'Execute the full network test and survive the live inject'} ]);
      S.setHints([ {tier:'Strategic',text:'Start with the services that need the least spectrum, then protect the critical services.'},
        {tier:'Instrument',text:'The drone feed needs the widest clean region. Test terrain before committing to its band.'},
        {tier:'Procedural',text:'Place position reports in a narrow clear channel, keep medical separated and high priority, use a lower-frequency option for command voice, and support the higher-frequency drone link with a relay.'} ]);
      // interactables
      w.interact(V3(0,1.2,1.4),3.2,'Open the spectrum planning table',()=>openPlanningTable(game,this),{marker:false});
      w.interact(V3(30,2,-20),4,'Place relay: water tower',()=>chooseRelay('water'));
      w.interact(V3(40,3,-6),6,'Place relay: warehouse roof',()=>chooseRelay('warehouse'));
      w.interact(V3(-30,2,-24),7,'Place relay: low hill',()=>chooseRelay('hill'));
      S.sequence([
        ['Captain Idris','Once the platoon crosses the rail yard, the old relay will not cover them. They need voice, positions, medical telemetry, and drone imagery.'],
        ['Sergeant Vale','We do not have a separate clean channel for everything. Build a plan that survives the terrain.'] ],()=>{ timerRunning=true; $('hintChip').classList.remove('hidden'); });
    },
    update(dt){ if(timerRunning && !done){ timer-=dt; if(timer<=0){ timer=0; timerRunning=false; S.say('Captain Idris','Departure delayed by three minutes. Operational score reduced.'); S.note('Departure timer expired — one guided-planning overlay granted','warn'); timer=180; timerRunning=true; } }
      const tv=$('timerVal'); tv.textContent=U.fmtTime(timer); tv.className='mono'+(timer<90?' crit':timer<180?' warn':''); $('timerLab').textContent='Platoon departure'; },
    // planning callbacks
    relaySite(){ return relaySite; }, setMedPriority(v){ medPriority=v; if(v&&!S.stepDone('priority')){ S.completeStep('priority'); S.addScore(250,'Medical traffic correctly prioritized'); } },
    getMedPriority(){ return medPriority; },
    onPlaced(placedCount){ if(placedCount>=4 && !S.stepDone('place')){ S.completeStep('place'); S.addScore(200,'All four services assigned'); } },
    onVoiceOK(){ if(!S.stepDone('voice')){ S.completeStep('voice'); } },
    onNoOverlap(){ if(!S.stepDone('place')) return; S.addScore(0,''); },
    canExecute(){ return S.stepDone('place'); },
    execute(evalResult,cb){ // called from planning table execute

        if(relaySite==='warehouse') S.addScore(250,'Terrain-tested relay placed'); else S.addScore(150,'Relay placed (suboptimal site)');
        S.addScore(250,'Full network survives movement test'); S.addScore(100,'Plan completed before departure'); }

    finish(){ finishM3(this); },

    stats:[['Services placed','4 / 4'],['Relay site',relaySite||'—'],['Medical priority',M.getMedPriority()?'yes':'no'],['Result','platoon crossed with all links']],
    chain:['A signal has a location in frequency (Mission 1).','A signal also occupies a width around that location (Mission 2).','Many systems must share the finite spectrum, and placement must account for bandwidth, terrain, timing, and priority (Mission 3).'],
    score:[['Final total',S.score+' pts']], next:()=>game.victory() }); }
}
function openPlanningTable(game,M){ const S=game.systems; const body=el('div');
  body.appendChild(el('div','mtitle','<h2>Spectrum Planning Table</h2><span class="tag">drag service blocks onto the axis</span>'));
  const cv=el('canvas'); cv.width=880; cv.height=300; cv.id='planC'; body.appendChild(cv);
  const legend=el('div','planLegend'); legend.innerHTML='<span><i style="background:#555"></i>existing users (occupied)</span>'+M.services.map(s=>`<span><i style="background:${s.color}"></i>${s.name} · ${s.need}</span>`).join('');
  body.appendChild(legend);
  const info=el('div'); info.style.cssText='display:flex;flex-wrap:wrap;gap:6px 24px;font-size:13px;color:#c8d4d9;margin-top:10px'; body.appendChild(info);
  const ctl=el('div','planCtl');
  const priBtn=el('button','btn sec','Prioritize medical for emergency burst: OFF');
  const relLab=el('button','btn sec','Relay site: none (walk outside to place)'); relLab.disabled=true;
  const exec=el('button','btn go','Execute network test');
  const done=el('button','btn sec','Close'); ctl.append(priBtn,relLab,exec,done); body.appendChild(ctl);
  const [AX,BX]=[40,cv.width-20], LO=M.axis[0], HI=M.axis[1];
  const u2x=(u)=>AX+(u/100)*(BX-AX); const x2u=(x)=>U.clamp((x-AX)/(BX-AX)*100,0,100);
  // service placement state (band = [start,end] in 0..100 units, or null in tray)
  const placed={}; M.services.forEach((s,i)=>{ placed[s.id]=null; });
  const trayY=250; let drag=null;
  function overlapCheck(){ let overlap=false; const bands=[]; for(const s of M.services){ if(placed[s.id]){ bands.push([placed[s.id][0],placed[s.id][1],s]); } }
    for(const [a0,a1] of bands.map(b=>[b[0],b[1]])){ for(const [o0,o1] of M.occupied){ if(a0<o1&&a1>o0) overlap=true; } }
    for(let i=0;i<bands.length;i++) for(let j=i+1;j<bands.length;j++){ if(bands[i][0]<bands[j][1]&&bands[i][1]>bands[j][0]) overlap=true; }
    return overlap; }
  function evalPlan(){ const placedCount=M.services.filter(s=>placed[s.id]).length; const overlap=overlapCheck();
    const drone=placed['drone']; const droneFits = drone && (drone[1]-drone[0])>= M.services.find(s=>s.id==='drone').width-0.5;
    const voice=placed['voice']; const voiceLow = voice && (voice[0]+voice[1])/2 < 50; // lower half of band
    return {placedCount,overlap,droneFits,voiceLow}; }
  function draw(){ const ctx=cv.getContext('2d'),W=cv.width,H=cv.height; ctx.fillStyle='#060b0d'; ctx.fillRect(0,0,W,H);
    // axis
    const ay=150; ctx.strokeStyle='rgba(120,150,160,.4)'; ctx.beginPath(); ctx.moveTo(AX,ay); ctx.lineTo(BX,ay); ctx.stroke();
    for(let u=0;u<=100;u+=10){ const x=u2x(u); ctx.strokeStyle='rgba(120,150,160,.15)'; ctx.beginPath(); ctx.moveTo(x,ay-70); ctx.lineTo(x,ay+40); ctx.stroke();
      ctx.fillStyle='#5f7d74'; ctx.font='10px monospace'; ctx.fillText(Math.round(LO+(HI-LO)*u/100),x-10,ay+56); }
    ctx.fillStyle='#5f7d74'; ctx.font='11px monospace'; ctx.fillText('lower freq · better through terrain · larger antenna',AX,ay-80); ctx.textAlign='right'; ctx.fillText('higher freq · more open · smaller antenna',BX,ay-80); ctx.textAlign='left';
    // occupied
    for(const [o0,o1] of M.occupied){ ctx.fillStyle='rgba(90,100,105,.55)'; ctx.fillRect(u2x(o0),ay-64,u2x(o1)-u2x(o0),58); ctx.strokeStyle='rgba(150,160,165,.4)'; ctx.strokeRect(u2x(o0),ay-64,u2x(o1)-u2x(o0),58); }
    // placed + tray blocks
    const overlap=overlapCheck();
    M.services.forEach((s,i)=>{ const w=(s.width/100)*(BX-AX); let x,y;
      if(placed[s.id]){ x=u2x(placed[s.id][0]); y=ay-58; } else { x=AX+i*150; y=trayY; }
      const bad = placed[s.id] && isBad(s); ctx.fillStyle=s.color+(bad?'55':'cc'); ctx.fillRect(x,y,w,44);
      ctx.strokeStyle=bad?'#ff6b6b':'#eaf1f3'; ctx.lineWidth=bad?2:1; ctx.strokeRect(x,y,w,44);
      ctx.fillStyle='#0a0e11'; ctx.font='bold 11px sans-serif'; ctx.fillText(s.name,x+4,y+16); ctx.fillStyle='#0a0e11'; ctx.font='10px sans-serif'; ctx.fillText(s.width+' units',x+4,y+30); });
    ctx.fillStyle='#5f7d74'; ctx.font='11px monospace'; ctx.fillText('TRAY — drag up onto the axis',AX,trayY-6);
    const ev=evalPlan();
    info.innerHTML=`<span>Placed: <b>${ev.placedCount}/4</b></span><span>Overlap: <b style="color:${ev.overlap?'#ff6b6b':'#57e389'}">${ev.overlap?'CONFLICT':'clear'}</b></span>`+
      `<span>Drone fits: <b style="color:${ev.droneFits?'#57e389':'#ffb454'}">${ev.droneFits?'yes':'needs wider region'}</b></span>`+
      `<span>Voice terrain: <b style="color:${ev.voiceLow?'#57e389':'#ffb454'}">${placed['voice']?(ev.voiceLow?'lower band OK':'high band — blocked by plant'):'—'}</b></span>`;
    relLab.textContent='Relay site: '+(M.relaySite()||'none (walk outside to place)');
    if(ev.placedCount>=4) M.onPlaced(4); if(ev.voiceLow) M.onVoiceOK();
  }
  function isBad(s){ if(!placed[s.id]) return false; const [a0,a1]=placed[s.id]; for(const [o0,o1] of M.occupied){ if(a0<o1&&a1>o0) return true; }
    for(const t of M.services){ if(t.id!==s.id && placed[t.id]){ if(a0<placed[t.id][1]&&a1>placed[t.id][0]) return true; } } return false; }
  function pick(x,y){ for(const s of M.services){ const w=(s.width/100)*(BX-AX); let bx,by; if(placed[s.id]){ bx=u2x(placed[s.id][0]); by=150-58; } else { bx=AX+M.services.indexOf(s)*150; by=trayY; }
    if(x>=bx&&x<=bx+w&&y>=by&&y<=by+44) return {s,offset:x-bx}; } return null; }
  cv.onmousedown=(e)=>{ const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*cv.width, y=(e.clientY-r.top)/r.height*cv.height; drag=pick(x,y); cv.classList.add('grabbing'); };
  cv.onmousemove=(e)=>{ if(!drag) return; const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*cv.width, y=(e.clientY-r.top)/r.height*cv.height;
    const s=drag.s; const w=s.width; if(y<210){ let u0=x2u(x-drag.offset); u0=U.clamp(u0,0,100-w); placed[s.id]=[u0,u0+w]; } else { placed[s.id]=null; } draw(); };
  window.addEventListener('mouseup',()=>{ if(drag){ game.audio.ui(); } drag=null; cv.classList.remove('grabbing'); });
  priBtn.onclick=()=>{ const v=!M.getMedPriority(); M.setMedPriority(v); priBtn.textContent='Prioritize medical for emergency burst: '+(v?'ON':'OFF'); priBtn.classList.toggle('go',v); game.audio.ui(); };
  exec.onclick=()=>{ const ev=evalPlan(); M.execute(ev,(res)=>{
      if(res.fail){ game.audio.bad(); S.say(res.needRelay?'Captain Idris':'Sergeant Vale',res.fail); S.note('Network test failed — '+res.fail.slice(0,60)+'…','warn'); if(res.needRelay){ closeCb(); } }
      else if(res.injectFail){ game.audio.alarm(); S.say('Captain Idris',res.text); S.note('Emergency inject: medical delayed — set priority','warn'); }
      else if(res.success){ game.audio.complete(); S.say('Captain Idris',res.text,{then:()=>{ closeCb(); M.finish(); }}); } }); };
  done.onclick=()=>closeCb(); const closeCb=modal(body,{onOpen:draw}); draw();
}

    sun.shadow.camera.left=-60; sun.shadow.camera.right=60; sun.shadow.camera.top=60; sun.shadow.camera.bottom=-60; sun.shadow.camera.far=160; this.scene.add(sun);
    const amb=new THREE.AmbientLight(0x334046,0.4); this.scene.add(amb); }
  spawn(x,z){ this.player.spawn(x,z); }
  missionClock(){ return U.now()-this._missionStart; }
  requestLock(){ if(this.running && !this.paused && !modalOpen()){ try{ this.controls.lock(); }catch(e){/* pointer lock may be unavailable (e.g. headless) */} } }
  releaseLock(){ try{ if(this.controls.isLocked) this.controls.unlock(); }catch(e){} }
  startMission(id){ this._transitioning=true; this.instruments.holster(); this.instruments.available=new Set();
    this.world.reset(); this.systems.hintUsed=false; this.systems.hintLevel=0; $('prompt').classList.add('hidden'); $('dialogue').classList.add('hidden'); this.systems.hideLesson();
    this.mission = id===1?Mission1(this): id===2?Mission2(this): Mission3(this);
    this._missionStart=U.now(); this.mission.build();
    $('timerVal').textContent='--:--'; this._transitioning=false; this.paused=false; $('modalMount').style.display='none';
    this.requestLock(); // synchronous — stay inside the click gesture so pointer lock is granted
  }
  openBriefing(id){ const m = id===1?Mission1(this): id===2?Mission2(this): Mission3(this); const b=m.briefing;
    const body=el('div'); body.innerHTML=`<div class="sub">Mission ${id} of 3</div><h1 style="margin-top:6px">${m.name.toUpperCase()}</h1>
      <div class="row" style="margin-top:10px"><span class="tag">Primary: ${b.primary}</span></div>
      <h2>Operational stakes</h2><p>${b.stakes}</p>
      <div class="kv" style="margin-top:14px"><span style="color:var(--dim)">Role</span><b>${b.role}</b><span style="color:var(--dim)">Location</span><b>${b.location}</b>
      <span style="color:var(--dim)">Secondary concepts</span><b>${b.secondary}</b></div>`;
    if(id===1) body.innerHTML+=`<h2>Controls</h2><div class="ctlgrid">
      <div class="ctl"><span>Move / Look</span><span class="mono">WASD · Mouse</span></div><div class="ctl"><span>Sprint / Crouch</span><span class="mono">Shift · C</span></div>
      <div class="ctl"><span>Interact</span><span class="mono">E</span></div><div class="ctl"><span>Equipment wheel</span><span class="mono">Q</span></div>
      <div class="ctl"><span>Switch instrument</span><span class="mono">F</span></div><div class="ctl"><span>Tune analyzer</span><span class="mono">← →  (or wheel)</span></div>
      <div class="ctl"><span>Zoom span (finer tuning)</span><span class="mono">↑ ↓  (or [ ])</span></div><div class="ctl"><span>Record / Use</span><span class="mono">Space  (or hold LMB)</span></div>
      <div class="ctl"><span>Recalibrate</span><span class="mono">R</span></div><div class="ctl"><span>Evidence notebook</span><span class="mono">Tab</span></div>
      <div class="ctl"><span>Hint ladder</span><span class="mono">H</span></div><div class="ctl"><span>Pause</span><span class="mono">Esc</span></div></div>`;
    const foot=el('div','row'); const go=el('button','btn go',id===1?'Begin Mission 1':'Begin Mission '+id); go.onclick=()=>{ this.audio.start(); closeCb(); this.running=true; $('hud').classList.remove('hidden'); this.startMission(id); };
    foot.appendChild(go); body.appendChild(foot); const closeCb=modal(body,{});
  }
  victory(){ const body=el('div'); body.innerHTML=`<div class="sub">Campaign complete</div><h1 style="margin-top:6px">SPECTRUM FRONT</h1>
    <p>You built a connected mental model: find the signal → understand its occupied width → place many signals into a functioning operational environment. Every wireless system occupies part of a shared, finite range of frequencies — and successful planning depends on time, location, bandwidth, equipment, terrain, and mission priority.</p>
    <div class="kv"><span style="color:var(--dim)">Final score</span><b style="color:var(--green)">${this.systems.score} pts</b><span style="color:var(--dim)">Evidence recorded</span><b>${this.systems.evidence.length} cards</b></div>`;
    const foot=el('div','row'); const rb=el('button','btn','Replay Mission 1'); rb.onclick=()=>{ closeCb(); this.systems.score=0; this.systems.evidence=[]; $('scoreVal').textContent='0'; this.startMission(1); };
    const nb=el('button','btn sec','Review notebook'); nb.onclick=()=>openNotebook(this); foot.append(rb,nb); body.appendChild(foot); const closeCb=modal(body,{}); }
  pause(){ if(this.paused) return; this.paused=true; const body=el('div'); body.innerHTML='<h1>PAUSED</h1><p style="color:var(--dim)">Mission '+(this.mission?.id||1)+' — '+(this.mission?.name||'')+'</p>';
    const foot=el('div','row'); const r=el('button','btn go','Resume'); r.onclick=()=>{ closeCb(); this.paused=false; this.requestLock(); }; foot.appendChild(r); body.appendChild(foot);
    body.appendChild(el('h2',null,'Jump to mission'));
    const jr=el('div','row'); jr.style.marginTop='4px';
    [[1,'1 · Frequency'],[2,'2 · Bandwidth'],[3,'3 · Spectrum']].forEach(([id,lbl])=>{ const jb=el('button','btn sec'+(this.mission?.id===id?' go':''),lbl);
      jb.onclick=()=>{ closeCb(); this.paused=false; this.startMission(id); }; jr.appendChild(jb); });
    body.appendChild(jr);
    body.appendChild(el('p',null,'<span style="color:var(--dim);font-size:12px">Each mission is self-contained — you can play them in any order.</span>'));
    const closeCb=modal(body,{onClose:()=>{ this.paused=false; }}); }
  openWheel(){ if(!this.instruments.available.size){ this.systems.note('No instruments yet'); return; } this._wheelOpen=true; const wheel=$('wheel'); const ring=$('wheelRing'); ring.innerHTML='';
    [...this.instruments.available].forEach((n,i)=>{ const s=el('div','slot'+(this.instruments.active===n?' on':'')); s.innerHTML=`<div class="ic">${INSTR_ICON[n]}</div><div class="n">${INSTR_LABEL[n]}</div><div class="k">${i+1}</div>`;
      s.onclick=()=>{ this.instruments.equip(n); }; ring.appendChild(s); });
    wheel.style.display='flex'; this.releaseLock(); }
  closeWheel(){ $('wheel').style.display='none'; if(this._wheelOpen){ this._wheelOpen=false; this.requestLock(); } }
  interactScan(){ const p=this.player.pos; let best=null,bd=1e9;
    for(const it of this.world.interactables){ if(!it.enabled) continue; const d=Math.hypot(p.x-it.pos.x,p.z-it.pos.z); if(d<it.radius && d<bd){ bd=d; best=it; } }
    const pr=$('prompt'); if(best){ pr.classList.remove('hidden'); pr.innerHTML='<span class="key">E</span>'+best.prompt; this._nearIt=best; } else { pr.classList.add('hidden'); this._nearIt=null; } }
  doInteract(){ if(this._nearIt){ const it=this._nearIt; if(it.once) it.enabled=false; it.onE(it); } }
  loop(){ requestAnimationFrame(()=>this.loop()); const dt=Math.min(0.05,this.clock.getDelta());
    if(this.running && !this.paused && !modalOpen()){ this.player.update(dt); this.instruments.update(dt); this.mission&&this.mission.update(dt); this.interactScan(); }
    else { $('prompt').classList.add('hidden'); if(this.instruments.active==='analyzer'||this.instruments.active==='tablet'){ /* keep last frame */ } }
    // dynamic props (helicopter, monitors)
    for(const d of this.world.dynamic){ if(d.fly){ d.t+=dt; d.rotor.rotation.y+=dt*30; d.obj.position.x+=dt*10; d.obj.position.z+=dt*4; d.obj.position.y=26-d.t*1.2; } }
    this.particles.update(dt);
    // occasional dust
    if(Math.random()<0.02){ const a=Math.random()*Math.PI*2, r=U.rand(6,30); this.particles.dust(this.player.pos.x+Math.cos(a)*r,U.rand(0.2,2.5),this.player.pos.z+Math.sin(a)*r); }
    this.rm.render(this.scene,this.cam); }
}

/* ============================ Input =================================== */
class Input{
  constructor(game){ this.g=game; const dom=game.rm.renderer.domElement;
    addEventListener('keydown',e=>this.key(e,true)); addEventListener('keyup',e=>this.key(e,false));
    dom.addEventListener('mousedown',e=>this.mouse(e,true)); addEventListener('mouseup',e=>this.mouse(e,false));
    dom.addEventListener('wheel',e=>{ if(!this.active()) return; e.preventDefault(); this.g.instruments.tune(e.deltaY>0?-1:1); },{passive:false});
    dom.addEventListener('contextmenu',e=>e.preventDefault());
  }
  active(){ return this.g.running && !this.g.paused && !modalOpen() && this.g.controls.isLocked; }
  key(e,down){ const g=this.g; const c=e.code;
    // global toggles (work even when not locked, for Tab/H via modal etc.)
    if(down && c==='Escape'){ return; }
    if(!this.active()){ // allow closing wheel with Q/number
      if(down && g._wheelOpen){ if(c==='KeyQ') g.closeWheel(); const n=parseInt(e.key); if(n>=1&&n<=6){ const list=[...g.instruments.available]; if(list[n-1]) g.instruments.equip(list[n-1]); } }
      return; }
    if(['KeyW','KeyA','KeyS','KeyD','ShiftLeft'].includes(c)) g.player.key(c,down);
    if(c==='KeyC'||c==='ControlLeft') g.player.crouch=down;
    if(!down) return;
    switch(c){
      case 'KeyE': g.doInteract(); break;
      case 'KeyQ': g.openWheel(); break;
      case 'KeyF': g.instruments.available.size?g.instruments.cycle():null; break;
      case 'KeyR': g.instruments.recalibrate(); break;
      case 'KeyM': g.systems.note('Tactical map: you are at the '+(g.mission?.name||'field')); break;
      case 'Tab': e.preventDefault(); openNotebook(g); break;
      case 'KeyH': g.systems.nextHint(); break;
      case 'BracketLeft': g.instruments.spanAdjust(-1); break;
      case 'BracketRight': g.instruments.spanAdjust(1); break;
      // keyboard instrument controls (arrow keys + space) — no mouse needed
      case 'ArrowLeft': e.preventDefault(); g.instruments.tune(-1); break;
      case 'ArrowRight': e.preventDefault(); g.instruments.tune(1); break;
      case 'ArrowUp': e.preventDefault(); g.instruments.spanAdjust(-1); break;   // zoom in (finer tuning)
      case 'ArrowDown': e.preventDefault(); g.instruments.spanAdjust(1); break;   // zoom out
      case 'Space': e.preventDefault(); g.instruments.primaryTap(); break;
      case 'Digit1': case 'Digit2': case 'Digit3': { const n=parseInt(c.slice(-1)); const list=[...g.instruments.available]; if(list[n-1]) g.instruments.equip(list[n-1]); break; }
    }
  }
  mouse(e,down){ const g=this.g; if(g._wheelOpen && !down){ return; }
    if(!this.active()){ return; }
    if(e.button===0){ if(down) g.instruments.primaryDown(); else g.instruments.primaryUp(); }
    if(e.button===2){ g.instruments.fine=down; }
  }
}

ide layers grow with parabolic kinetics: as the film thickens, transport becomes slower, so growth continues but at a declining rate.\n\nPipeline corrosion is not identical to high-temperature oxidation, yet Wagner’s transport logic remains useful. Corrosion requires an electrochemical circuit: anodic regions dissolve metal, cathodic reactions consume electrons, and an electrolyte carries ionic current. Coatings and cathodic protection are intended to interrupt that circuit. A coating holiday, trapped moisture, disbondment, soil chemistry, or inadequate protection can localize attack. The outside surface may develop deep pits while most of the circumference looks sound.\n\nThat localization matters for evidence. A third-party strike tends to leave deformation, gouging, metal displacement, or fresh mechanical marks. Corrosion leaves wall-thickness loss, scale, rounded pits, and a history that can be compared with coating surveys and protection readings. Ground movement may bend or buckle a line, producing a different fracture geometry.\n\nWagner’s corrosion theory gives investigators a morphology to seek: scale, rounded pits, coating disbondment, and wall loss with electrochemical history. Brant Hollow shows something else at the opening—a fresh linear gouge, displaced metal, tooth spacing, and a dent matching excavation equipment. Nearby pipe retains adequate wall thickness and protective coating. Corrosion remains a plausible institutional story in many ruptures, but its expected material record is absent at this origin.","frame":"Sets a fresh tooth-gouged pipe section beside a scaled corrosion coupon. “Both remove metal, but only one bends and transfers it in an instant. Tell me which surface you see.”","q":[{"q":"What is central to Wagner’s view of oxide growth?","o":[{"t":"Rust forms mainly where a fresh mechanical strike exposes bright metal to air.","v":"wrong","fb":"Mechanical damage can initiate corrosion, but electrochemical transport can continue without a new strike."},{"t":"An oxide layer grows at one fixed rate regardless of thickness or environment.","v":"partial","fb":"Growth often slows as transport distance increases and conditions change."},{"t":"A skilled saboteur can imitate any corrosion pattern by applying acid after failure.","v":"danger","fb":"Speculation cannot replace pit geometry, scale history, and pre-event survey evidence."},{"t":"Ions and electrons move through a film, allowing reaction to continue beneath it.","v":"expert","fb":"Transport through the scale explains how oxidation can progress without bare metal remaining exposed."}],"clue":{"category":"what","label":"WHAT — lead","text":"The opening has a sharp fresh tooth gouge rather than scaled pits or broad wall thinning."}},{"q":"Why can localized pitting be dangerous even when most pipe looks sound?","o":[{"t":"A deep pit can leave too little wall to contain normal internal pressure.","v":"expert","fb":"Pressure capacity depends on the minimum remaining wall, not the average appearance of the pipe."},{"t":"Pits matter after they cover more than half the pipe circumference.","v":"wrong","fb":"A single severe local flaw can govern failure before broad corrosion develops."},{"t":"Any visible rust means the pipeline is already leaking at that spot.","v":"partial","fb":"Rust warrants assessment, but leakage depends on remaining wall and crack formation."},{"t":"Localized corrosion indicates a chemical attacker chose the rupture point.","v":"danger","fb":"Electrochemical cells naturally localize attack without deliberate targeting."}],"clue":{"category":"who","label":"WHO — lead","text":"The gouge spacing matches equipment assigned to one third-party contractor working inside the marked corridor."}},{"q":"Which pipe feature most favors fresh excavation damage over corrosion?","o":[{"t":"Rounded pits beneath scale and a broad region of reduced wall thickness.","v":"partial","fb":"Pits and scale would instead indicate an electrochemical history."},{"t":"A coating holiday beside wet soil and low cathodic-protection readings.","v":"wrong","fb":"Those conditions support corrosion risk rather than a new strike."},{"t":"A sharp tooth gouge with displaced bright metal and matching local dent.","v":"expert","fb":"Fresh deformation and tooth geometry are direct mechanical-contact signatures."},{"t":"Uniform thinning around the pipe circumference over a long distance.","v":"danger","fb":"Long uniform loss does not match a localized excavator contact."}],"clue":{"category":"where","label":"WHERE — lead","text":"Fresh deformation, displaced metal, and equipment tracks begin at the active excavation cut on the right-of-way."}}]},"pp_joukowsky":{"sci":"Nikolai Joukowsky (1847-1921)","topic":"Water hammer & pressure surge","lede":"Nikolai Joukowsky measured how a rapid change in flow launches a pressure wave through a pipe, giving investigators a signature for sudden hydraulic events.","no":2,"profile":"Nikolai Joukowsky, also transliterated Zhukovsky, was a Russian scientist whose work helped found modern aerodynamics and fluid mechanics. He studied the transient pressure waves produced when flowing liquid is stopped or redirected rapidly. The Joukowsky equation relates the pressure change to fluid density, wave speed, and the change in velocity. A fast valve closure can therefore create a sharp surge—water hammer—that travels through a pipeline and reflects from boundaries.\n\nGas pipelines are compressible systems and require models more elaborate than the classic liquid equation, but the investigative idea carries over. Sudden changes leave transient signatures. A control action, compressor trip, or rapid isolation produces a pressure wave with timing that can be followed across sensors. By contrast, a small leak may first cause a gradual imbalance between inlet and outlet flow, followed by a larger pressure collapse when the remaining wall tears open.\n\nA dispatcher’s screen can be misleading if viewed only at the moment of alarm. Historians reconstruct synchronized data from several stations, checking sensor clocks, valve positions, flow rates, and pressure derivatives. They also ask whether the transient occurred before the rupture and could have caused it, or after the rupture as a consequence. Sequence is more probative than peak magnitude alone.\n\nJoukowsky’s timing separates cause from response. At Brant Hollow, a sharp flow imbalance and pressure collapse begin at the moment excavation telemetry places the machine over the line; valve movement and later oscillations follow. There is no preceding pressure surge capable of opening the wall and no gradual leak signature. The control center records the hydraulic consequence, while the right-of-way supplies the initiating contact.","frame":"Freezes the SCADA replay at the first abrupt imbalance. “The opening must come before the system response if a machine struck the line. Put every signal in order.”","q":[{"q":"What does the classic Joukowsky relation connect?","o":[{"t":"Corrosion depth to soil resistivity, coating age, and cathodic current.","v":"partial","fb":"Those variables belong to integrity assessment rather than transient hydraulics."},{"t":"Pressure change to fluid density, wave speed, and change in velocity.","v":"expert","fb":"The relation quantifies the surge generated by a rapid flow change in a pipe."},{"t":"Explosion force to pipe diameter, burial depth, and ignition temperature.","v":"wrong","fb":"Combustion effects are separate from the pressure-wave relation."},{"t":"Sabotage probability to the number of valves an intruder could reach.","v":"danger","fb":"Joukowsky’s equation diagnoses hydraulic transients, not malicious access."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"Pressure containment fails abruptly before valve action, with no prior leak trend or initiating surge."}},{"q":"Why must investigators compare event timing rather than only peak pressure?","o":[{"t":"The largest pressure value identifies which employee made the mistake.","v":"wrong","fb":"Magnitude does not assign authority or even establish causal order."},{"t":"Any pressure oscillation indicates the dispatcher closed a valve too quickly.","v":"danger","fb":"Ruptures and automatic responses also generate transients; valve action must be timed."},{"t":"Timing matters mainly when sensors at each station use different units.","v":"partial","fb":"Clock alignment matters even with consistent units because causal ordering depends on seconds."},{"t":"A surge can cause failure only if the pressure wave precedes the opening.","v":"expert","fb":"A peak recorded after rupture may be a consequence or reflection rather than the initiating cause."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"The control trace locates the opening to the same segment where the contractor’s machine stopped and reversed."}},{"q":"Which pressure sequence best fits a machine opening the pipe?","o":[{"t":"An abrupt local flow imbalance and collapse, with valve response afterward.","v":"expert","fb":"The sudden opening must precede the protective system’s hydraulic response."},{"t":"A long slow leak trend that accelerates over several monitoring periods.","v":"partial","fb":"A long trend would better fit progressive wall deterioration."},{"t":"A large pressure wave arriving before any loss of line containment.","v":"wrong","fb":"A preceding wave would make surge the initiating mechanism."},{"t":"Stable measurements until ground movement bends several stations at once.","v":"danger","fb":"Broad simultaneous bending would support ground movement rather than contact."}],"clue":{"category":"who","label":"WHO — corroboration","text":"Machine GPS and a one-call ticket place that contractor directly over the pipeline when containment is first lost."}}]},"pp_firestone":{"sci":"Floyd Firestone (1898-1986)","topic":"Ultrasonic flaw detection","lede":"Floyd Firestone used reflected sound pulses to locate hidden cracks and voids, making internal damage visible without cutting a component apart.","no":3,"profile":"Floyd Alburn Firestone was an American physicist and engineer who developed an early practical pulse-echo method for ultrasonic nondestructive testing. In patents filed around 1940, he described sending short high-frequency sound pulses into a solid and receiving echoes from internal boundaries. A sound part produces an echo from its far surface. A crack, void, or inclusion reflects part of the pulse sooner. Measuring the travel time allows an inspector to estimate the flaw’s position.\n\nThe instrument became known as the supersonic reflectoscope. Its principle resembles sonar on a much smaller scale: transmit, listen, and convert time into distance using the material’s sound speed. Coupling between the probe and surface matters, as do calibration blocks, probe angle, component geometry, and interpretation. A weak or missed echo does not automatically mean no flaw; inspection coverage and procedure determine what could have been found.\n\nModern inline inspection tools use several technologies, including magnetic-flux leakage and ultrasonic methods, to estimate metal loss, cracks, and geometry while traveling through a pipeline. Their value is temporal. They can identify a flaw while the pipe still holds pressure, allowing repair or closer monitoring before the remaining wall reaches failure. Cancelling a run does not merely postpone data collection; it extends the interval during which an existing defect can grow unseen.\n\nFirestone’s inspection logic can also clear a system when coverage is complete. The latest inline run examined the eventual site, reported adequate wall, and its raw data remain consistent with the recovered segment. The new gouge was created after that examination. Locate markings, permit boundaries, equipment GPS, and supervisor messages then identify a third-party contractor that continued digging across the marked corridor. Here the external strike is not a convenient rumor; it is the only hypothesis that joins fresh metal, timing, and access.","frame":"Overlays a complete prior inspection pass with equipment GPS and locate marks. “A clean covered segment can still be damaged tomorrow. Separate missed detection from new contact.”","q":[{"q":"How does pulse-echo ultrasonic testing locate an internal flaw?","o":[{"t":"It measures how quickly surface rust changes color under ultraviolet light.","v":"wrong","fb":"That may characterize surface conditions but cannot locate a hidden internal reflector."},{"t":"It raises pressure until the weakest wall section bursts during a controlled test.","v":"danger","fb":"Destructive proof defeats the purpose of nondestructive inspection and may create the failure."},{"t":"It times an early reflected sound pulse from a boundary inside the material.","v":"expert","fb":"Travel time and sound speed place the reflector before the expected back-wall echo."},{"t":"It compares the component’s total weight with its original manufacturing record.","v":"partial","fb":"Weight can reveal gross loss but lacks the location and resolution of ultrasonic echoes."}],"clue":{"category":"what","label":"WHAT — decisive","text":"A fully covered earlier inspection found adequate wall; the new mechanical contact occurred afterward and opened the line."}},{"q":"Why is inspection coverage part of interpreting a “clean” result?","o":[{"t":"Any completed tool run assures the line has no defect anywhere in the pipeline.","v":"danger","fb":"No inspection method has unlimited sensitivity or coverage."},{"t":"A tool excludes just the flaws its route, sensors, and procedure could examine.","v":"expert","fb":"Detection claims depend on validated capability and complete coverage of the relevant region."},{"t":"Coverage matters after a pipe has already ruptured and been excavated.","v":"wrong","fb":"Coverage is essential before failure because it defines what the inspection could detect."},{"t":"A missed segment can be assumed identical to the nearest inspected segment.","v":"partial","fb":"Neighboring data may inform risk, but it cannot substitute for examining the uninspected location."}],"clue":{"category":"where","label":"WHERE — decisive","text":"Locate marks, machine position, gouge geometry, and rupture origin converge at the Right-of-Way & Excavation Site."}},{"q":"Which joined record most directly identifies the outside actor?","o":[{"t":"The operator’s inspection schedule and cathodic-protection review history.","v":"partial","fb":"Integrity records test corrosion but do not identify the fresh contact."},{"t":"The dispatcher’s valve commands after the first rupture alarm arrived.","v":"wrong","fb":"Response commands follow the opening and do not create the gouge."},{"t":"The regulator’s later enforcement notice issued after the neighborhood fire.","v":"danger","fb":"Post-event enforcement documents consequences rather than the initiating actor."},{"t":"Locate marks, equipment GPS, gouge geometry, and the supervisor’s dig order.","v":"expert","fb":"Access, machine position, physical match, and instruction converge on the contractor."}],"clue":{"category":"who","label":"WHO — decisive","text":"A supervisor message orders digging to continue across visible locate marks, and the same crew’s bucket carries matching metal transfer."}}]}},"story":["<b>Brant Hollow’s rupture looked like the end of a long integrity failure—and like the result of one excavator’s mistake.<\/b>","Line-Walker Dumas can read the recovered wall. The Dispatcher holds the millisecond pressure sequence. The Right-of-Way Records Clerk can join permits, locate marks, and equipment movement.","Corrosion, ground movement, and fresh third-party damage each leave different metal and timing.","The nine clues must determine whether the external-strike theory is a convenient accusation or the event the evidence actually records."],"endings":{"overclaimWhat":"corrosion","dismissalWhat":"freak","win":{"expertTitle":"The Bucket Tooth at Brant Hollow","expert":["You connect Morrow Excavation, the Right-of-Way & Excavation Site, and a third-party strike that opened a sound pipeline. Fresh gouging, machine GPS, locate marks, and pressure timing form one sequence.","The corrosion theory is the tempting systemic allegation, but prior coverage and recovered wall reject it. Ground movement cannot reproduce the tooth geometry or contractor access trail."],"soundTitle":"The Excavation Strike","sound":["Your accusation identifies the contractor, the right-of-way, and fresh mechanical damage.","Some equipment or inspection details remain incomplete, but the joined physical and timing evidence supports the verdict."],"namedTitle":"Right Strike, Thin Access Record","named":["You choose the correct actor, location, and mechanism.","The conclusion is right, though missed clues leave portions of the GPS, locate, or morphology chain incomplete."]},"overclaim":{"title":"The Systemic Corrosion Story Was Wrong Here","body":["The prior inline examination covered the site, and the recovered wall outside the gouge retains adequate thickness.","A familiar management-failure pattern should not override fresh mechanical evidence."]},"dismissal":{"title":"The Ground Did Not Shape a Bucket Tooth","body":["Localized denting, metal transfer, and machine tracking cannot be explained by a broad natural ground shift.","The rupture was sudden but directly traceable to human excavation."]},"wrongNames":{"title":"The Strike, Assigned Elsewhere","body":["You recognize external damage but misidentify the contractor or move the initiating contact away from the active excavation site."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"t_transformer","title":"The Aldergate Substation Fire","discipline":"Power Engineering & Dielectrics","venue":"the Aldergate substation inquiry","agent":{"name":"Investigator Emun Halle","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Power & Dielectric Pioneers","dossierName":"POWER & DIELECTRIC PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Aldergate substation inquiry","DAYS_TOTAL":3,"teaser":"A power transformer burns and the city goes dark. Did someone attack the yard, did chronic overheating age the insulation to failure, or did a direct lightning impulse exceed the protection and insulation level of an otherwise serviceable unit?","overclaimTag":"deliberate damage in the substation yard","truthTag":"a direct lightning impulse beyond the protected level","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A transformer tank, control traces, and an internal electrical breakdown\"><rect x=\"95\" y=\"32\" width=\"180\" height=\"78\" rx=\"7\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M125 52 h120 M125 72 h120 M125 92 h120\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><path d=\"M360 24 v92 M410 24 v92 M360 50 h50 M360 88 h50\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M455 28 l-18 34 h22 l-15 38 44-50 h-24 l18-22z\" fill=\"#B3261E\"/><path d=\"M530 102 C555 75,585 80,610 48\" fill=\"none\" stroke=\"#326891\" stroke-width=\"2\"/><\/svg>","overclaimTease":"The last flash can resemble sabotage or the end of a long decline. Compare pre-event loading and oil history with arrester records, lightning location, and the first electrical waveform.","CATS":{"who":{"title":"Who bears responsibility","truth":"lightning","items":[{"id":"lightning","label":"An act of nature — a lightning strike, not a person"},{"id":"engineer","label":"The substation protection engineer"},{"id":"operator","label":"Bram Odell — utility asset operator"}]},"where":{"title":"Where it culminates","truth":"yard","items":[{"id":"relay","label":"The Relay & Control House"},{"id":"yard","label":"The Substation Yard & Transformer"},{"id":"office","label":"The Utility Asset Office"}]},"what":{"title":"What happened","truth":"freak","items":[{"id":"attack","label":"Deliberate physical damage initiated the transformer fire"},{"id":"overload","label":"Long overheating degraded insulation until it broke down"},{"id":"freak","label":"A direct lightning impulse exceeded the protected insulation level"}]}},"READING_ORDER":["subop","oiltech","clerk"],"CHARACTERS":{"subop":{"name":"Operator Nkemi","role":"Substation operator","face":"⚡","badge":"N","legend":"the transformer yard","hint":"Months of loading and temperatures remained inside the approved band before a single high-amplitude impulse arrived.","reading":"tx_hopkinson"},"oiltech":{"name":"The Oil Technician","role":"Insulating-oil technician","face":"🧪","badge":"O","legend":"the oil laboratory","hint":"Sequential pre-event oil samples were stable and lacked the rising fault-gas trend expected from chronic internal damage.","reading":"tx_paschen"},"clerk":{"name":"The Asset Records Clerk","role":"Maintenance records clerk","face":"🗂","badge":"C","legend":"the asset office","hint":"Lightning location, arrester discharge, bushing flashover, and relay timing align at the transformer yard without an unauthorized entry.","reading":"tx_stefan"}},"TOPICS":{"tx_hopkinson":{"sci":"John Hopkinson (1849-1898)","topic":"Magnetic circuits & transformer theory","lede":"John Hopkinson gave engineers a circuit language for magnetic flux, making transformer loading and core behavior calculable rather than mysterious.","no":1,"profile":"John Hopkinson was a British electrical engineer and physicist who helped place the rapidly developing machinery of the late nineteenth century on a rigorous analytical foundation. He studied dynamos, alternating-current systems, and transformers at a moment when electrical power was moving from laboratory demonstration to public infrastructure. His name is attached to Hopkinson’s law, an analogy between an electric circuit and a magnetic circuit. Magnetomotive force drives magnetic flux through reluctance much as voltage drives current through resistance.\n\nThe analogy is not perfect, because iron is nonlinear and can saturate, but it lets designers reason about cores, windings, air gaps, and flux density. In a transformer, alternating current in the primary creates changing magnetic flux that induces voltage in the secondary. Load current produces copper losses proportional to current squared, while magnetic behavior contributes core losses. The resulting heat must be carried away through oil, radiators, and the tank. Operating above rating does not guarantee immediate failure; it accelerates insulation ageing and narrows the margin for another fault.\n\nHopkinson also investigated transformer theory directly, considering continuous iron magnetic circuits and the relationships among turns, current, resistance, and induction. His work helped engineers separate ordinary energy conversion from abnormal magnetic and thermal conditions.\n\nHopkinson’s framework makes chronic loading testable rather than rhetorical. Aldergate’s current, cooling, and temperature series remain within the approved operating band, with no sustained hot-spot pattern before the event. The first abnormal record is a steep external impulse coincident with a nearby lightning channel. Overload can certainly age a transformer, but the necessary thermal history is absent here. The physical culmination is the yard unit and its line entrance, not the asset office.","frame":"Pins a year of normal load and hot-spot curves beside one towering impulse waveform. “Chronic heat leaves a history. A lightning event leaves a beginning.”","q":[{"q":"What does Hopkinson’s magnetic-circuit analogy compare?","o":[{"t":"Magnetomotive force, flux, and reluctance to voltage, current, and resistance.","v":"expert","fb":"The analogy provides a practical language for calculating magnetic paths in transformer cores."},{"t":"Transformer oil pressure, flow, and temperature to a municipal water network.","v":"partial","fb":"Cooling hydraulics matter, but Hopkinson’s named analogy concerns magnetic rather than fluid circuits."},{"t":"Lightning current, ground resistance, and blast pressure inside a substation.","v":"wrong","fb":"Those variables describe surge protection and physical effects, not the magnetic-circuit relation."},{"t":"An attacker’s energy, access time, and ability to bypass the protective relays.","v":"danger","fb":"The theory analyzes equipment behavior without presuming a malicious actor."}],"clue":{"category":"what","label":"WHAT — lead","text":"Pre-event load and temperature histories lack the sustained heating required for accelerated insulation ageing."}},{"q":"Why does sustained overload damage a transformer even if it keeps supplying power?","o":[{"t":"Extra current permanently magnetizes the core after the first overloaded hour.","v":"wrong","fb":"Core behavior is more complex, and thermal ageing—not permanent magnetization—is the main long-duration concern here."},{"t":"Higher current raises losses and temperature, accelerating insulation ageing.","v":"expert","fb":"A unit can remain in service while heat steadily consumes the life of paper and oil insulation."},{"t":"Overload matters when a lightning strike arrives during the same minute.","v":"danger","fb":"Thermal degradation accumulates independently and can create the conditions for later internal failure."},{"t":"The nameplate rating is merely economic guidance and has no reliability meaning.","v":"partial","fb":"Ratings include thermal and insulation limits, even though short emergency loading may sometimes be managed."}],"clue":{"category":"who","label":"WHO — lead","text":"Operating records show no sustained overload decision or unauthorized yard access before the first impulse."}},{"q":"Which record most strongly argues against chronic thermal ageing?","o":[{"t":"A tank photograph taken after the transformer burned and ruptured.","v":"partial","fb":"Post-fire appearance cannot reconstruct the preceding temperature exposure."},{"t":"An asset-replacement plan listing the unit as older than its neighbors.","v":"wrong","fb":"Calendar age alone does not establish damaging thermal operation."},{"t":"A brief overload occurring after the lightning impulse had already arrived.","v":"danger","fb":"A later overload is consequence or response, not the initiating cause."},{"t":"Months of current, hot-spot temperature, and cooling data within limits.","v":"expert","fb":"A normal pre-event thermal history removes the sustained heating mechanism."}],"clue":{"category":"where","label":"WHERE — lead","text":"The first abnormal waveform and physical flashover occur at the transformer’s line bushing in the substation yard."}}]},"tx_paschen":{"sci":"Friedrich Paschen (1865-1947)","topic":"Gas breakdown & Paschen’s law","lede":"Friedrich Paschen showed that electrical breakdown through a gas depends on both pressure and distance, not voltage alone.","no":2,"profile":"Friedrich Paschen was a German physicist whose experimental work ranged from spectroscopy to electrical discharge. In the late nineteenth century he measured the voltage required to start a discharge between electrodes in a gas while changing the gas pressure and the electrode spacing. The result, known as Paschen’s law, showed that breakdown voltage depends mainly on the product of pressure and gap distance. The curve has a minimum: at some conditions electrons gain enough energy between collisions to ionize more molecules efficiently, creating an avalanche.\n\nThe law corrected a simple intuition that a larger gap or higher pressure must always be safer. If there are too few collisions, an electron cannot build an avalanche; if there are too many, it loses energy before ionizing the next molecule. Between those regimes, breakdown can occur at surprisingly modest voltage. Modern high-voltage insulation involves liquids, solids, interfaces, bubbles, moisture, and complex fields, so Paschen’s law is not a complete transformer model. It remains valuable for understanding why gaseous voids and evolving internal conditions can become weak points.\n\nAn internal discharge leaves traces. Electrical and thermal faults can decompose insulating oil and paper, generating gases that dissolve in the oil. Sequential dissolved-gas analysis can reveal whether gases are rising over time and whether the pattern is more consistent with heating, partial discharge, or arcing. A single post-fire sample is harder to interpret because the final event itself creates gas.\n\nPaschen’s work helps explain how a sufficiently large impulse can cross insulation gaps and initiate flashover even when routine condition monitoring is reassuring. Aldergate’s pre-event dissolved-gas samples are stable rather than progressively rising, while the bushing and arrester records show a sudden high-field event. One post-fire sample cannot manufacture a prior trend. The sequence therefore favors an external lightning impulse over months of hidden internal discharge.","frame":"Arranges stable oil reports beside the bushing flashover and arrester record. “Do not let gases made by the fire invent warnings that were absent before it.”","q":[{"q":"What variables are joined in Paschen’s law for gas breakdown?","o":[{"t":"Oil temperature and transformer current, through their arithmetic average.","v":"partial","fb":"Those variables matter to transformer condition but are not the variables in Paschen’s law."},{"t":"Lightning frequency and grounding resistance, through their peak value.","v":"wrong","fb":"Surge exposure and grounding are separate from the gas-gap relationship Paschen measured."},{"t":"Gas pressure and electrode spacing, combined through their product.","v":"expert","fb":"Breakdown conditions depend on how pressure and distance shape electron collisions and ionization."},{"t":"Attacker distance and explosive mass, through a security-risk score.","v":"danger","fb":"The physical discharge law does not require or diagnose sabotage."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"Sequential oil samples remain stable, while the event begins as one steep external impulse rather than a growing internal fault."}},{"q":"Why can a small gas void become dangerous inside high-voltage insulation?","o":[{"t":"Its pressure and gap can permit an ionizing avalanche at the local field.","v":"expert","fb":"A void can support discharge even when the surrounding bulk insulation remains intact."},{"t":"Gas conducts perfectly at every pressure, so any bubble shorts the winding instantly.","v":"wrong","fb":"Breakdown depends on conditions; a bubble is a risk, not an automatic metallic short."},{"t":"A void indicates someone opened the tank and deliberately injected air inside.","v":"danger","fb":"Voids and gas can arise from ageing, heating, moisture, and material degradation without intrusion."},{"t":"The bubble blocks all electric field and therefore protects the surrounding paper.","v":"partial","fb":"Field stress can concentrate around interfaces rather than disappear."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"Arrester discharge marks and the lightning-location solution align with the same yard entrance within milliseconds."}},{"q":"Which comparison most strongly supports one lightning impulse?","o":[{"t":"Several samples showing a rising combustible-gas trend over many months.","v":"partial","fb":"A rising trend would instead support chronic insulation deterioration."},{"t":"Stable pre-event gas samples followed by arrester discharge and bushing flashover.","v":"expert","fb":"Normal history plus a timed external impulse fits sudden flashover."},{"t":"Repeated requests for closer monitoring after internal partial discharges.","v":"wrong","fb":"Repeated internal warnings would contradict the one-event explanation."},{"t":"A post-fire oil sample containing gases produced during the final blaze.","v":"danger","fb":"After-fire gases cannot identify whether deterioration existed beforehand."}],"clue":{"category":"who","label":"WHO — corroboration","text":"Protection settings, maintenance, oil testing, and loading all meet their approved requirements before the event."}}]},"tx_stefan":{"sci":"Josef Stefan (1835-1893)","topic":"Thermal radiation & temperature","lede":"Josef Stefan found that emitted thermal power rises steeply with absolute temperature, making sustained heat an accelerating warning rather than a neutral condition.","no":3,"profile":"Josef Stefan was an Austrian physicist who worked in Vienna on heat conduction, gas kinetics, electromagnetism, and thermal radiation. In 1879 he examined experimental measurements of radiation from hot bodies and proposed that the energy emitted per unit area rises with the fourth power of absolute temperature. Ludwig Boltzmann later derived the relationship theoretically, and it became the Stefan–Boltzmann law. The law describes an ideal blackbody exactly and real surfaces through an emissivity factor.\n\nA power transformer does not cool by radiation alone. Oil circulation, conduction through materials, and convection through radiators usually carry much of the heat. Still, Stefan’s steep temperature relationship captures an engineering truth: thermal behavior is strongly nonlinear. Higher load creates more electrical loss; hotter oil and windings age insulation faster; damaged insulation can worsen dielectric performance and create additional local heating. Thermal images and long-term temperature records are therefore useful when interpreted alongside load and cooling status.\n\nInsulation ageing is cumulative. Cellulose paper around windings becomes brittle as temperature and chemical degradation progress. Oil oxidizes and can lose dielectric quality. A transformer may survive many periods above normal temperature while its remaining life falls much faster than the calendar suggests. Asset management must distinguish a short, controlled emergency from a chronic operating strategy.\n\nStefan’s thermal law provides the final check on the systemic-overheating theory. Temperature alarms, loading waivers, and cooling records do not show the cumulative heat exposure needed to explain accelerated insulation ageing. By contrast, lightning-location data, arrester discharge, relay onset, and yard damage align within milliseconds. The records leave no culpable operator or engineer below standard; this is a genuine low-probability impulse that exceeded the protected insulation level.","frame":"Aligns lightning-location time, relay onset, and yard damage to the millisecond. “A rare event still needs positive evidence. Show me the channel, not just the flash.”","q":[{"q":"What does the Stefan–Boltzmann law say about ideal thermal emission?","o":[{"t":"Emitted power rises linearly with Celsius temperature above freezing.","v":"wrong","fb":"The law uses absolute temperature and a fourth-power relationship, not a linear Celsius scale."},{"t":"Radiation begins after a surface becomes hot enough to glow visibly red.","v":"partial","fb":"All finite-temperature surfaces emit thermal radiation, including below visible glow."},{"t":"A fire’s brightness directly identifies whether sabotage caused it.","v":"danger","fb":"Thermal emission describes temperature, not motive or initiating cause."},{"t":"Emitted power per area rises with the fourth power of absolute temperature.","v":"expert","fb":"The strong temperature dependence makes thermal emission increase rapidly as an object becomes hotter."}],"clue":{"category":"what","label":"WHAT — decisive","text":"A direct lightning impulse exceeded the protected insulation level of an otherwise serviceable transformer; neither sabotage nor deferred deterioration fits the timeline."}},{"q":"Why is chronic overheating more serious than the calendar time alone suggests?","o":[{"t":"Heat erases earlier fault-gas evidence, making every later sample reassuring.","v":"wrong","fb":"Heating can generate and alter gases; it does not make sequential evidence irrelevant."},{"t":"Once a unit survives one overload, later overloads become progressively safer.","v":"danger","fb":"Survival does not restore consumed insulation life or thermal margin."},{"t":"Higher temperature accelerates chemical ageing of paper and insulating oil.","v":"expert","fb":"Thermal ageing consumes insulation life disproportionately during hot operation."},{"t":"Visible tank discoloration is the main indicator of meaningful insulation degradation.","v":"partial","fb":"Internal paper and oil can age well before obvious external damage appears."}],"clue":{"category":"where","label":"WHERE — decisive","text":"Waveform onset, bushing damage, arrester operation, and channel location converge at the Substation Yard & Transformer."}},{"q":"What joined evidence can clear both sabotage and deferred-maintenance theories?","o":[{"t":"No entry or thermal trend, plus a timed lightning channel and arrester operation.","v":"expert","fb":"Independent absence and positive impulse evidence test both competing stories."},{"t":"A security camera gap and a replacement delay in the same maintenance year.","v":"partial","fb":"Two suspicious facts do not establish either initiating mechanism."},{"t":"One eyewitness reporting a bright flash before the substation fire spread.","v":"wrong","fb":"A flash is expected in several electrical failures and lacks discrimination."},{"t":"The regulator’s assurance that lightning is common in the surrounding region.","v":"danger","fb":"Regional frequency does not tie a channel to this unit or moment."}],"clue":{"category":"who","label":"WHO — decisive","text":"The joined record identifies no culpable human action below standard; a directly timed lightning channel supplies the initiating energy."}}]}},"story":["<b>Aldergate’s transformer failed in a flash, but the months before it are as important as the millisecond of breakdown.<\/b>","Operator Nkemi has the loading history. The Oil Technician has the pre-event condition series. The Asset Records Clerk can join protection settings to lightning and relay timing.","Sabotage, chronic insulation decline, and a direct lightning exceedance each predict a different record before the fire.","The inquiry must decide whether someone accepted a known risk—or whether the equipment met its obligations and still met a rarer event."],"endings":{"overclaimWhat":"attack","dismissalWhat":"overload","win":{"expertTitle":"The Direct Impulse","expert":["You identify no culpable human actor, the Substation Yard & Transformer, and a direct lightning impulse beyond the protected insulation level. The channel, arrester, relay, and bushing records align.","The sabotage theory lacks access or physical evidence, while the chronic-overheating theory lacks the required thermal and gas history. This failure is a genuine residual-risk event."],"soundTitle":"The Lightning Sequence","sound":["Your verdict places the failure at the yard transformer and recognizes a direct impulse without human fault.","Some waveform or condition details remain incomplete, but the positive lightning evidence and normal prehistory support the result."],"namedTitle":"Right Impulse, Limited Condition Record","named":["You choose the correct responsibility finding, place, and mechanism.","The conclusion is right, although missed clues leave the protection or pre-event condition case less complete."]},"overclaim":{"title":"No Deliberate Entry or Damage","body":["Security, physical inspection, and electrical onset show no human intrusion or planted initiating fault.","A dramatic fire is not evidence of sabotage when a timed natural impulse is recorded."]},"dismissal":{"title":"The Systemic-Decline Story Was the False Pattern","body":["Loading, temperature, cooling, and dissolved-gas histories do not show the cumulative deterioration that the overload theory requires.","Importing a familiar deferred-maintenance narrative would ignore the unit’s normal pre-event condition."]},"wrongNames":{"title":"The Lightning Event, Given Human Blame","body":["You recognize the impulse but assign culpability or culmination away from the transformer yard where the complete event signature begins."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"w_water","title":"The Tap","discipline":"Water Supply & Environmental Health","venue":"the Rushton water inquiry","agent":{"name":"Investigator Faye Orwell","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Water Pioneers","dossierName":"WATER & PUBLIC-HEALTH PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Rushton water inquiry","DAYS_TOTAL":3,"teaser":"A source change is followed by rising lead in children’s blood. Was poison added at treatment, did the new water remain safe throughout distribution, or did altered chemistry attack old plumbing after a required control feed was left off?","overclaimTag":"intentional contamination at treatment","truthTag":"a plant operator left required corrosion control offline","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"Water moving from treatment pipes through corroding service lines to a household tap\"><path d=\"M20 32 H210 V52 H260\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M260 42 H410 V62 H520\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M40 94 C120 72,190 112,270 90 S420 70,620 94\" fill=\"none\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><g stroke=\"#121212\" fill=\"none\" stroke-width=\"2\"><path d=\"M520 46 v38 h64 v-38\"/><path d=\"M540 84 v26 M564 84 v26\"/><\/g><g stroke=\"#B3261E\" stroke-width=\"2\"><circle cx=\"463\" cy=\"62\" r=\"5\" fill=\"none\"/><circle cx=\"480\" cy=\"68\" r=\"3\" fill=\"#B3261E\"/><circle cx=\"496\" cy=\"58\" r=\"4\" fill=\"none\"/><\/g><\/svg>","overclaimTease":"Compare the authorized source plan with the actual treatment historian, finished-water chemistry, and household pattern. Policy, operation, and downstream exposure may point to different people.","CATS":{"who":{"title":"Who is behind it","truth":"operator","items":[{"id":"official","label":"Merrick — the city emergency manager"},{"id":"regulator","label":"The state environmental regulator"},{"id":"operator","label":"Operator Nunez — treatment-plant operator"}]},"where":{"title":"Where it culminates","truth":"plant","items":[{"id":"plant","label":"The Treatment Plant & Corrosion-Feed Station"},{"id":"cityhall","label":"The City Manager’s Office"},{"id":"lab","label":"The Water-Testing Laboratory"}]},"what":{"title":"What happened","truth":"corrosion","items":[{"id":"safe","label":"The source change remained within safe distribution limits"},{"id":"tampering","label":"A contaminant was intentionally added during treatment"},{"id":"corrosion","label":"The new chemistry destabilized protective pipe scale"}]}},"READING_ORDER":["operator2","chemist","clerk"],"CHARACTERS":{"operator2":{"name":"Shift Operator Vale","role":"Treatment-plant shift operator","face":"🚰","badge":"O","legend":"the treatment floor","hint":"The corrosion-feed order was active, but Operator Nunez repeatedly left the dosing pump offline during his shifts.","reading":"corrosionchem"},"chemist":{"name":"The Water Chemist","role":"Water-testing chemist","face":"🧪","badge":"W","legend":"the sample bench","hint":"Lead results track old plumbing and time on the new source, while treated plant water shows no added contaminant.","reading":"leadkids"},"clerk":{"name":"The City-Hall Clerk","role":"Municipal records clerk","face":"🗂","badge":"C","legend":"the records room","hint":"City and regulator records required corrosion control; plant logs isolate the unapproved departure to one operator.","reading":"flintcorrosion"}},"TOPICS":{"corrosionchem":{"sci":"Marcel Pourbaix (1904-1998)","topic":"Corrosion chemistry & passivation","lede":"Marcel Pourbaix turned corrosion from a vague story about “bad water” into a map of chemical conditions and stable surfaces.","no":1,"profile":"Marcel Pourbaix was a Belgian electrochemist who spent much of his career asking a practical question: under a given set of water conditions, will a metal remain intact, dissolve, or cover itself with a protective film? His answer became the potential–pH diagram, now usually called a Pourbaix diagram. The chart places acidity on one axis and electrochemical potential on the other, then marks the regions where a metal is immune, actively corroding, or passivated by a stable oxide layer.\n\nThe diagram does not predict a corrosion rate by itself, and real plumbing adds flow, temperature, minerals, disinfectants, and mixed metals. Its power is diagnostic. A small change in pH, alkalinity, chloride, or oxidation conditions can move a pipe surface across a boundary. A scale that had remained stable for years may begin dissolving, exposing fresh metal and releasing material that had been trapped in the wall. Corrosion control therefore means managing water chemistry as part of the distribution system, not merely producing clear water at the plant gate.\n\nPourbaix assembled and published extensive electrochemical equilibrium data, culminating in his Atlas of Electrochemical Equilibria in Aqueous Solutions. Engineers still use the diagrams to reason about pipelines, boilers, reinforced concrete, and drinking-water plumbing. They also warn against treating compliance at one sampling point as proof that the entire system is chemically stable.\n\nPourbaix’s diagrams make the missing feed technically meaningful. The source switch shifted pH, alkalinity, and chloride conditions enough to destabilize protective scale unless the ordered corrosion treatment was running. City authorization and regulator correspondence both required that control, but the plant historian shows the dosing pump repeatedly left offline during Operator Nunez’s shifts. The chemical mechanism begins at the Treatment Plant & Corrosion-Feed Station even though lead is released later inside household plumbing.","frame":"Sets the old and new source analyses beside a sketch of the distribution mains. “Clear water can still cross a chemical boundary after it leaves me. Show me you know which boundary matters.”","q":[{"q":"What does a Pourbaix diagram organize for a metal in water?","o":[{"t":"Expected pipe lifetime versus pressure, diameter, and average daily flow rate.","v":"partial","fb":"Hydraulics affect service life, but those variables are not the axes of a Pourbaix diagram."},{"t":"Disinfectant dose versus bacterial count at each stage of water treatment.","v":"wrong","fb":"That is a treatment-control chart rather than an electrochemical stability map."},{"t":"The concentration of any poison needed to remain invisible in routine samples.","v":"danger","fb":"Pourbaix diagrams describe metal-water equilibria, not how contaminants evade detection."},{"t":"Immunity, active corrosion, and passivation regions versus pH and potential.","v":"expert","fb":"The diagram separates the chemical domains in which metal stays intact, dissolves, or forms a protective film."}],"clue":{"category":"who","label":"WHO — lead","text":"The source-change order required corrosion dosing; the first departures appear as unexplained feed shutdowns tied to one operator’s shifts."}},{"q":"Why can a source change release lead even when no lead enters at the plant?","o":[{"t":"Higher pressure can manufacture lead ions from otherwise lead-free pipe material.","v":"wrong","fb":"Pressure may affect leaks and flow, but it cannot create an element that is not in the plumbing."},{"t":"Chlorine can transform harmless minerals into lead whenever water stands overnight.","v":"danger","fb":"Disinfectants influence corrosion chemistry, but they do not transmute other minerals into lead."},{"t":"New pH and redox conditions can dissolve a scale that had isolated the pipe wall.","v":"expert","fb":"A chemistry shift can destabilize passivating deposits and expose metal already present in plumbing."},{"t":"Old pipes release a fixed amount of lead regardless of the water that enters them.","v":"partial","fb":"Pipe material matters, yet release can change sharply when water chemistry or protective scale changes."}],"clue":{"category":"what","label":"WHAT — lead","text":"The source switch changed conditions that govern whether protective lead-bearing pipe scale remains stable."}},{"q":"Which record most directly shows who changed the corrosion regime?","o":[{"t":"The city order authorizing the new source with corrosion treatment required.","v":"partial","fb":"The order establishes the required safeguard rather than its defeat."},{"t":"Feed-pump historian and shift log showing repeated unapproved shutdowns.","v":"expert","fb":"Equipment state tied to operator shifts identifies the enacted departure."},{"t":"The regulator letter describing acceptable monitoring and control conditions.","v":"wrong","fb":"The regulator conditions support control and do not identify the shutdown."},{"t":"A resident complaint reporting discolored water weeks after the switch.","v":"danger","fb":"Complaints show consequences but not who changed plant operation."}],"clue":{"category":"where","label":"WHERE — lead","text":"Finished water contains no added poison, but the corrosion-feed station shows the control pump offline after the new source enters treatment."}}]},"leadkids":{"sci":"Herbert Needleman (1927-2017)","topic":"Lead exposure & children’s development","lede":"Herbert Needleman showed that children could be harmed by lead without displaying the dramatic symptoms medicine once required.","no":2,"profile":"Herbert Needleman was a pediatrician and psychiatrist who challenged the comfortable belief that lead mattered only when a child became visibly poisoned. In the 1970s he looked for a record of cumulative exposure in shed baby teeth. Dentine forms in layers and can retain lead absorbed during childhood, allowing researchers to compare exposure with school performance even when a child had no acute medical crisis.\n\nNeedleman and his collaborators reported that children with higher dentine lead burdens performed worse on measures of attention, language, classroom behavior, and psychological testing. Later follow-up work strengthened the case that low-level exposure could have lasting developmental effects. The research was controversial, especially because it threatened industries built around lead paint, gasoline, and other products, but it helped move public health away from a simple poisoning threshold and toward prevention.\n\nThe statistical lesson is as important as the toxicology. Population harm can appear as a shift in a distribution rather than a row of identical catastrophes. A citywide average may remain below a regulatory action level while particular neighborhoods, homes, or children experience much higher exposure. Removing high samples, changing the sampling pool, or averaging unlike locations can therefore erase the very pattern investigators need to see.\n\nNeedleman’s work makes the exposure pattern incompatible with both harmless averages and a poison added at the plant. Elevated results concentrate in homes with older service lines, increase with stagnation, and rise with time on the new source; water leaving treatment lacks the alleged contaminant. Raw samples remain valid, while the distribution pattern follows pipe interaction. The evidence also separates a broad policy failure from a specific operational departure: the required feed existed, but one operator did not keep it running.","frame":"Spreads the raw tap results beside a neighborhood map. “An average can hide the children at the tail. Read the pattern before anyone tells you the number was acceptable.”","q":[{"q":"What did Needleman’s use of shed teeth add to lead research?","o":[{"t":"A cumulative childhood exposure record that could be compared with later performance.","v":"expert","fb":"Dentine lead offered a longer exposure record than a single blood measurement taken after the fact."},{"t":"A way to prove each learning problem had no cause except environmental lead.","v":"danger","fb":"The studies showed associations and population effects, not a unique cause for every individual difficulty."},{"t":"A direct measurement of the lead concentration in a child’s current drinking water.","v":"wrong","fb":"Teeth record absorbed exposure; they do not identify the present concentration at a specific tap."},{"t":"A screening method that became useful after a child showed severe poisoning.","v":"partial","fb":"Needleman’s point was that meaningful harm could appear below the level of obvious acute poisoning."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"Elevated samples cluster in older plumbing and with stagnation rather than appearing uniformly in water leaving the plant."}},{"q":"Why can a citywide average conceal an important lead problem?","o":[{"t":"An average below an action level indicates that sampled households were protected.","v":"danger","fb":"An action level is not a guarantee that no home or child experienced a high exposure."},{"t":"Lead affects every child identically, so variation among homes is statistical noise.","v":"wrong","fb":"Exposure and susceptibility vary; the distribution is part of the evidence rather than noise."},{"t":"The median dominates because extreme readings are usually treated as laboratory errors.","v":"partial","fb":"Outliers require investigation, but automatically discarding them can erase real high-exposure homes."},{"t":"High exposures in vulnerable homes can disappear when unlike samples are pooled.","v":"expert","fb":"A mean can look acceptable while a subgroup or upper tail carries substantial risk."}],"clue":{"category":"who","label":"WHO — corroboration","text":"City and regulator records retain the safeguard, while the plant historian repeatedly links its absence to Operator Nunez’s console login."}},{"q":"Which location best distinguishes added poison from pipe-released lead?","o":[{"t":"The city office where resident complaint summaries were assembled.","v":"partial","fb":"Administrative summaries cannot locate the contaminant source."},{"t":"The laboratory average after high household results were removed.","v":"wrong","fb":"An edited average conceals rather than resolves the spatial mechanism."},{"t":"The plant feed station and finished-water samples before distribution.","v":"expert","fb":"Plant-side chemistry tests whether contamination existed before water reached pipes."},{"t":"One home tap with old plumbing and a long stagnation period.","v":"danger","fb":"One home shows exposure but cannot alone test treatment-stage addition."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"The plant historian aligns each untreated period with the chemistry later associated with elevated household lead release."}}]},"flintcorrosion":{"sci":"Marc Edwards (environmental engineer, b. 1964)","topic":"Corrosion control & the Flint water crisis","lede":"Marc Edwards followed household water, pipe chemistry, and citizens’ complaints until an administrative decision became a measurable exposure pathway.","no":3,"profile":"Marc Edwards is an environmental engineer at Virginia Tech whose work has focused on corrosion, premise plumbing, and the unintended consequences of water-treatment decisions. He became widely known through investigations of lead in Washington, D.C., drinking water and later the Flint water crisis. In both settings, the technical issue was not lead being poured into a reservoir. It was water chemistry interacting with lead-bearing service lines, solder, and household plumbing.\n\nCorrosion control commonly uses chemistry—often phosphate-based treatment, pH adjustment, or alkalinity management—to encourage stable protective scales. When a utility changes source water, disinfectant, or treatment conditions, it must test whether those scales will remain protective. Sampling design matters just as much. Flushing a tap, selecting low-risk homes, or failing to capture stagnant water can produce reassuring numbers that do not represent residents’ exposure. Edwards’s teams combined laboratory analysis, plumbing knowledge, and resident sampling to test the whole chain from treatment decision to tap.\n\nThe larger lesson is institutional. Residents can supply observations that formal monitoring misses: discoloration, rashes, unusual taste, or repeated high home tests. Those reports are not substitutes for chemistry, but they are reasons to investigate. When complaint records, corrosion studies, and sampling results all point in the same direction, dismissing each piece separately becomes less defensible.\n\nEdwards’s source-change method joins chemistry, operations, and residents. Pipe-loop tests predicted scale destabilization without dosing, complaints rose after the source switch, and the feed historian identifies repeated offline periods under one operator. The emergency manager’s order and regulator file both anticipated corrosion control rather than waiving it. Responsibility therefore sits with the frontline decision that defeated an approved safeguard, and the decisive physical scene is the treatment feed station where that decision was enacted.","frame":"Opens the source-change memo, the complaint ledger, and the pipe-loop test on the same desk. “A crisis sticks together only when the chemistry, the sampling, and the authority all point along one chain.”","q":[{"q":"What must a utility evaluate when changing drinking-water sources?","o":[{"t":"Whether the new source tastes acceptable to a majority of customers on its first day.","v":"partial","fb":"Taste complaints can matter, but they do not replace corrosion testing and distribution-system analysis."},{"t":"Whether the new chemistry will preserve protective scales throughout the network.","v":"expert","fb":"A source can meet treatment targets yet destabilize scales in service lines and household plumbing."},{"t":"Whether the plant operator can keep the water visibly clear without changing equipment.","v":"wrong","fb":"Clarity is not evidence that lead-bearing plumbing remains chemically protected."},{"t":"Whether officials can average enough samples to remain below the action threshold.","v":"danger","fb":"Sampling should discover exposure, not be designed backward from a desired compliance result."}],"clue":{"category":"what","label":"WHAT — decisive","text":"Required corrosion control stayed offline long enough for the new chemistry to destabilize scale and release lead from distribution plumbing."}},{"q":"Why are resident samples valuable in a corrosion investigation?","o":[{"t":"They test water after it has contacted the service lines and household plumbing.","v":"expert","fb":"The exposure point is the tap, where distribution and premise plumbing have altered the treated water."},{"t":"They replace laboratory quality control because residents know their own water best.","v":"partial","fb":"Residents reveal conditions and locations, but validated analysis is still needed to measure contaminants."},{"t":"They indicate that unusual taste or color is caused by toxic lead release.","v":"danger","fb":"Sensory changes warrant investigation but do not identify a contaminant by themselves."},{"t":"They show whether treatment staff followed the plant’s daily operating checklist.","v":"wrong","fb":"Plant procedure is documented elsewhere; home samples test the downstream result of those procedures."}],"clue":{"category":"where","label":"WHERE — decisive","text":"Source water, dosing status, alarm acknowledgment, and the first altered distribution chemistry converge at the Treatment Plant & Corrosion-Feed Station."}},{"q":"Which evidence most directly assigns the failed safeguard to one worker?","o":[{"t":"The emergency manager’s signature on the broader source-change authorization.","v":"partial","fb":"Authorization of the source is not authorization to disable required control."},{"t":"The regulator’s approval of a plan that included corrosion-control treatment.","v":"wrong","fb":"Approval supports the safeguard rather than the failure to operate it."},{"t":"The chemist’s validation of high samples from neighborhoods with old plumbing.","v":"danger","fb":"Validated samples establish harm but not the person controlling the pump."},{"t":"Required dosing orders plus historian gaps recurring on the same operator’s shifts.","v":"expert","fb":"The comparison separates approved policy from the frontline departure that defeated it."}],"clue":{"category":"who","label":"WHO — decisive","text":"One treatment operator left the required pump offline, acknowledged the alarm, and restored no dosing during the periods that changed distribution chemistry."}}]}},"story":["<b>Rushton’s new source looked acceptable at the plant gate; children’s exposure rose in neighborhoods with old plumbing.<\/b>","Shift Operator Vale can read the corrosion-feed historian. The Water Chemist holds raw household and finished-water results. The City-Hall Clerk can compare operating requirements with what the plant actually did.","Intentional contamination, a harmless source change, and destabilized pipe scale each predict a different location and exposure pattern.","The case turns on whether the approved safeguard was absent by policy—or defeated by the person operating it."],"endings":{"overclaimWhat":"tampering","dismissalWhat":"safe","win":{"expertTitle":"The Feed Left Offline","expert":["You connect Operator Nunez, the Treatment Plant & Corrosion-Feed Station, and the source chemistry that destabilized protective pipe scale.","No contaminant appears in finished water, and the neighborhood pattern rejects a harmless change. Orders required dosing; historian and shift records show the frontline operator repeatedly defeated that safeguard."],"soundTitle":"The Plant-Side Departure","sound":["Your accusation identifies the operator, the feed station, and the corrosion mechanism.","Some chemistry or historian details remain incomplete, but the required-control and exposure pattern support the conclusion."],"namedTitle":"Right Operator, Thin Chemistry","named":["You choose the correct person, location, and mechanism.","The verdict holds, though missed clues leave parts of the dosing or neighborhood evidence less complete."]},"overclaim":{"title":"No Poison Was Added at Treatment","body":["Finished-water testing lacks the alleged contaminant, while exposure tracks old plumbing, stagnation, and time on the source.","The treatment-stage poisoning story cannot explain that distribution pattern."]},"dismissal":{"title":"Plant Compliance Did Not Mean Distribution Safety","body":["The new chemistry interacted with old service lines after required corrosion control was left offline.","A safe-looking plant result does not erase lead released downstream from destabilized scale."]},"wrongNames":{"title":"The Corrosion Mechanism, Misassigned","body":["You recognize pipe-scale destabilization but place responsibility or culmination away from the operator and feed station that changed the water chemistry."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"w_compound","title":"The Compounding Room","discipline":"Pharmacy & Sterile Compounding","venue":"the Meridian Compounding inquiry","agent":{"name":"Investigator Del Marsh","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Pharmacy Pioneers","dossierName":"PHARMACY & STERILITY PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Meridian Compounding inquiry","DAYS_TOTAL":3,"teaser":"Patients in several states develop the same invasive infection after routine injections. Was a contaminant deliberately added, were the illnesses unrelated, or did altered production allow a facility organism to enter linked lots?","overclaimTag":"a deliberate contaminant in the medicine","truthTag":"a sterility failure repeatedly released from the owner’s office","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"An autoclave chamber and batch record with microbial growth appearing in a vial\"><rect x=\"78\" y=\"28\" width=\"230\" height=\"84\" rx=\"8\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><circle cx=\"160\" cy=\"70\" r=\"25\" fill=\"none\" stroke=\"#326891\" stroke-width=\"2\"/><path d=\"M160 45 v50 M135 70 h50\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><path d=\"M410 34 h76 l22 20 v58 h-98z\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M486 34 v22 h22\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><g fill=\"#B3261E\"><circle cx=\"445\" cy=\"72\" r=\"4\"/><circle cx=\"466\" cy=\"88\" r=\"5\"/><circle cx=\"437\" cy=\"96\" r=\"3\"/><\/g><\/svg>","overclaimTease":"Process records, environmental cultures, and patient isolates each answer a different part of the mystery. The final question is where that evidence was accepted or overridden before the lots left.","CATS":{"who":{"title":"Who is behind it","truth":"owner","items":[{"id":"pharmacist","label":"The compounding pharmacist"},{"id":"owner","label":"Guillory — the pharmacy owner"},{"id":"inspector","label":"The state pharmacy inspector"}]},"where":{"title":"Where it culminates","truth":"office","items":[{"id":"office","label":"The Owner’s Business Office"},{"id":"culture","label":"The Environmental-Monitoring Laboratory"},{"id":"cleanroom","label":"The Clean Room & Autoclave"}]},"what":{"title":"What happened","truth":"sterility","items":[{"id":"poison","label":"A deliberate biological contaminant was added to medicine"},{"id":"sterility","label":"Production changes allowed environmental organisms into batches"},{"id":"coincidence","label":"Unrelated infections coincidentally followed the injections"}]}},"READING_ORDER":["tech","micro","clerk"],"CHARACTERS":{"tech":{"name":"Pharmacy Tech Ruiz","role":"Compounding technician","face":"⚗️","badge":"T","legend":"the clean room","hint":"Validated sterilizer cycles were shortened, leaving loads without complete time-and-temperature evidence.","reading":"autoclave"},"micro":{"name":"The Micro Analyst","role":"Environmental-monitoring analyst","face":"🧫","badge":"M","legend":"the culture bench","hint":"Room plates, retained vials, and patient isolates yield the same organism and closely matching strain pattern.","reading":"tyndall"},"clerk":{"name":"The Batch Records Clerk","role":"Quality records clerk","face":"🗂","badge":"C","legend":"the owner’s office","hint":"The owner repeatedly authorized release after the laboratory flagged cycle deviations and environmental positives.","reading":"biologics"}},"TOPICS":{"autoclave":{"sci":"Charles Chamberland (1851-1908)","topic":"The autoclave & sterilizing filter","lede":"Charles Chamberland used pressure, steam, and fine porcelain to make invisible contamination into a controllable laboratory problem.","no":1,"profile":"Charles Chamberland joined Louis Pasteur’s laboratory in Paris in the 1870s and became a central builder of the tools that made bacteriology practical. Experiments on microbes depended on clean culture media and equipment; without reliable sterilization, a flask could grow organisms that came from the room rather than the experiment. Chamberland designed devices to close that loophole, including a porous porcelain filter and a steam-pressure sterilizer that became known as the Chamberland autoclave.\n\nAn autoclave raises the pressure above atmospheric pressure so saturated steam can reach temperatures above the ordinary boiling point of water. Steam condenses on cooler surfaces and transfers heat efficiently. But sterilization is a process, not a dial setting. The load must allow steam penetration; air must be removed; the target temperature must be reached throughout the chamber; and the exposure must last long enough. A displayed temperature at one location cannot prove that tightly packed vials or a cold spot received the required treatment. Records, indicators, and validated cycles are therefore part of the barrier.\n\nChamberland’s porcelain filter pursued the same logic by another route: exclude microbes physically from liquids that cannot tolerate heat. Both inventions separated a controlled product from environmental organisms through a barrier whose performance could be tested.\n\nIn Meridian, incomplete steam holds and missing cycle printouts show that a validated barrier was no longer being completed. That creates a credible route for viable environmental organisms without requiring deliberate addition. Chamberland’s lesson also separates technical failure from release authority: the clean room created the unsafe condition, but the medicine entered commerce only after the owner’s office accepted incomplete cycle evidence and signed the batch forward.","frame":"Unrolls a cycle chart that ends before the validated hold and places it beside a densely packed load diagram. “A chamber can be hot while the product is not yet sterile. Read the whole cycle.”","q":[{"q":"Why does an autoclave use pressurized steam rather than ordinary boiling?","o":[{"t":"Pressure mechanically crushes microorganisms even if the load remains cool.","v":"wrong","fb":"The primary sterilizing action is heat delivered by steam, not compression alone."},{"t":"Pressure permits hotter saturated steam that transfers lethal heat through the load.","v":"expert","fb":"Higher-temperature condensing steam can achieve validated microbial inactivation when it reaches the product."},{"t":"Steam chemically neutralizes added toxins while preserving the medicine’s full potency.","v":"danger","fb":"Autoclaving targets viable organisms and is not a universal antidote for deliberate chemicals."},{"t":"Boiling is identical, but pressure makes the printed cycle look more reliable.","v":"partial","fb":"Pressure changes attainable temperature and penetration conditions, not merely documentation."}],"clue":{"category":"what","label":"WHAT — lead","text":"Shortened steam holds weaken the validated barrier without implying that anyone deliberately added an organism."}},{"q":"What would most strongly show that a specific load was actually sterilized?","o":[{"t":"A green status light showing the chamber door remained locked for the run.","v":"partial","fb":"Door status confirms containment but not that the coldest product reached the required exposure."},{"t":"A technician’s memory that the chamber felt extremely hot when opened.","v":"wrong","fb":"Subjective heat cannot replace calibrated cycle data and load-specific indicators."},{"t":"A complete validated cycle plus indicators at the hardest-to-heat location.","v":"expert","fb":"Sterility assurance depends on time, temperature, steam contact, and evidence from the limiting location."},{"t":"The absence of visible cloudiness in every vial immediately after filling.","v":"danger","fb":"Sterile products can contain low microbial levels without visible growth at release."}],"clue":{"category":"who","label":"WHO — lead","text":"Technicians could run validated cycles but lacked authority to shorten recipes or release incomplete loads."}},{"q":"Where does an incomplete cycle become a released patient risk?","o":[{"v":"expert","t":"In the owner’s office, when incomplete loads receive release authorization.","fb":"Release authority turns a process deviation into distributed medicine."},{"v":"partial","t":"In the monitoring lab, when room, vial, and patient organisms match.","fb":"The lab proves the chain but does not authorize distribution."},{"v":"wrong","t":"At the autoclave display, when one chamber temperature appears.","fb":"One display point does not establish release or full load sterility."},{"v":"danger","t":"At distant hospitals, whenever illness follows an injection.","fb":"Clinical timing alone cannot identify who accepted the failed batch."}],"clue":{"category":"where","label":"WHERE — lead","text":"The incomplete cycle becomes a patient risk only after the owner’s office authorizes the affected load for release."}}]},"tyndall":{"sci":"John Tyndall (1820-1893)","topic":"Heat-resistant spores & intermittent heating","lede":"John Tyndall discovered that clear broth could survive boiling because some microbes waited in a resistant state before returning to growth.","no":2,"profile":"John Tyndall was an Irish physicist celebrated for work on heat, light, and the atmosphere, but his experiments also helped settle arguments about spontaneous generation and sterilization. Working with carefully prepared infusions, he showed that dust carried living germs. In a specially constructed dust-free chamber, sterilized broths remained clear until contaminated particles were admitted. Yet some infusions stubbornly spoiled after ordinary boiling, forcing him to investigate why heat sometimes seemed to fail.\n\nThe answer involved resistant bacterial spores. A vegetative cell actively growing in broth can be killed by conditions that a dormant spore survives. Tyndall developed intermittent heating: heat the material, allow surviving spores time to germinate into vulnerable cells, then heat again. The historical method, later called tyndallization, demonstrated a key principle even though modern pressure sterilization is more reliable for many products—microbial resistance depends on state, and one apparently successful heating step may not eliminate the most resistant population.\n\nTyndall also emphasized contamination routes. If organisms enter from dust after treatment, a perfect sterilization cycle can still be defeated. Investigators therefore compare the identity and distribution of organisms in the environment, product, and patients. Matching species and genetic patterns across those locations can tie an outbreak to a process rather than coincidence.\n\nTyndall’s work makes repeated matching organisms the strongest discriminator. Meridian’s environmental plates, retained vials, and patient isolates carry the same mold species and closely related strain profile across affected lots. That connected path is incompatible with unrelated infections and more specific than a generic poisoning claim. The laboratory established the route; the Owner’s Business Office became the culmination when those results were overruled and the linked lots remained on the release schedule.","frame":"Sets three culture plates in chronological order: room air, released vial, patient isolate. “A coincidence does not usually repeat the same biological signature along the production path.”","q":[{"q":"Why could a broth spoil after an apparently adequate boiling step?","o":[{"t":"Boiling creates new organisms from nutrients once the vessel returns to room temperature.","v":"wrong","fb":"Tyndall’s controlled experiments opposed spontaneous generation and traced growth to surviving or entering germs."},{"t":"A deliberate poison can transform into mold whenever it contacts warm glass.","v":"danger","fb":"Chemical poisoning does not explain viable fungal growth with a matching environmental source."},{"t":"All microbes survive boiling equally, so temperature records provide no useful evidence.","v":"partial","fb":"Some forms are more resistant, but thermal history remains central to evaluating survival."},{"t":"Dormant spores survived, then germinated and repopulated the cooled broth.","v":"expert","fb":"Heat resistance varies by microbial state, so surviving spores can restart growth after cooling."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"Cases cluster by lot, and the facility organism appears in both retained medicine and patient isolates."}},{"q":"What makes matching environmental and patient organisms powerful evidence?","o":[{"t":"The organisms share a broad fungal category common in many environments.","v":"partial","fb":"A broad category is too common to identify a shared source."},{"t":"A close strain match links the facility source to affected lots and cases.","v":"expert","fb":"Specific relatedness across room, product, and patient supports one transmission chain."},{"t":"Patients became ill after injections even though no retained vials were tested.","v":"wrong","fb":"Timing alone does not establish the organism’s route through production."},{"t":"One monitoring plate grew an organism after the outbreak became public.","v":"danger","fb":"A late isolated plate lacks the repeated lot-linked pattern required."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"Environmental positives and retained-vial growth are forwarded to the same office that keeps the lots on the schedule."}},{"q":"Which pattern argues most strongly against coincidence?","o":[{"t":"Patients became ill at different hospitals several days after their injections.","v":"partial","fb":"Different hospitals do not rule out a common manufactured source, and incubation periods can vary."},{"t":"The illness organism is common in nature and therefore is unlikely to identify a source.","v":"danger","fb":"A common organism can still be traced through matching isolates, timing, lots, and environmental location."},{"t":"Affected patients received linked lots carrying the same organism found in the room.","v":"expert","fb":"Shared lot exposure and biological matching make unrelated infections increasingly implausible."},{"t":"Some recipients of the implicated lots remained well despite receiving injections.","v":"wrong","fb":"Incomplete attack rates are normal and do not erase a strong common-source pattern."}],"clue":{"category":"who","label":"WHO — corroboration","text":"Laboratory positives and cycle deviations were escalated to the owner before affected lots left the facility."}}]},"biologics":{"sci":"Milton J. Rosenau (1869-1946)","topic":"Biologics sterility & public standards","lede":"Milton Rosenau treated biological medicines as public-health systems whose safety depended on production standards, testing, and accountable release.","no":3,"profile":"Milton J. Rosenau was an American physician and public-health leader who worked in the federal Hygienic Laboratory, an ancestor of the National Institutes of Health, and later taught at Harvard and the University of North Carolina. At a time when vaccines, antitoxins, and other biological products were expanding rapidly, manufacturing quality varied widely. A medicine derived from living systems could save lives, but contamination or inconsistent potency could also spread harm across every recipient of a batch.\n\nRosenau helped develop laboratory methods and standards for biological products and wrote an influential textbook on preventive medicine and hygiene. The regulatory lesson of biologics is batch accountability. Materials, environmental conditions, sterilization records, test results, deviations, and release decisions must remain linked. Sterility testing samples only a fraction of a lot, so a negative test cannot rescue a process known to be uncontrolled. Manufacturers rely on validated barriers and honest deviation handling, not on inspecting quality into the finished product after the fact.\n\nThis logic also explains why outbreaks can cross geography. A single contaminated batch distributed widely may produce cases in several states, while neighboring patients who received other lots remain well. Lot numbers and release dates can reveal a sharper pattern than hospital location.\n\nRosenau’s manufacturing perspective joins process control to release authority. The owner received reports of shortened cycles, environmental positives, and linked lot complaints, then authorized continued distribution under output pressure. The laboratory proves that the organism belonged to the facility ecology and traveled through production. The business office is where that scientific evidence, batch genealogy, production target, and release signature became one accountable decision.","frame":"Builds a ba

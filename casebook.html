sential corroboration."}],"clue":{"category":"who","label":"WHO — lead","text":"The disputed source packets arrived through external accounts before Corin Faye created interview notes or article drafts."}},{"q":"Which evidence would show that false sourcing entered from outside rather than beginning in a reporter’s notes?","o":[{"t":"Archived incoming messages and signed attachments that predate the draft.","v":"expert","fb":"Contemporaneous inbound records establish an external origin for the false material."},{"t":"An editor’s failure to answer every verification warning before publication.","v":"partial","fb":"Editorial failure explains publication but not who created the source network."},{"t":"A polished narrative whose quotations sound unusually vivid and complete.","v":"wrong","fb":"Writing quality cannot identify the provenance of the underlying evidence."},{"t":"A reporter’s later inability to persuade the witness to appear publicly.","v":"danger","fb":"A missing witness is suspicious, but timing and metadata locate the origin."}],"clue":{"category":"where","label":"WHERE — lead","text":"The newsroom contains the published narrative, but the original incoming headers and attachments survive in the Source & Fact-Check Files."}}]},"fromrecord":{"sci":"I. F. Stone (1907-1989)","topic":"Verify it from the public record","lede":"I. F. Stone built investigations from documents officials had already published, proving that records can contradict a polished official or journalistic account.","no":2,"profile":"Isidor Feinstein Stone, known as I. F. Stone, was an American journalist who became famous for the independent newsletter I. F. Stone’s Weekly. Working with a tiny staff and outside the daily press pack, he read government reports, hearing transcripts, budgets, footnotes, and statistics with unusual patience. His method was not simply collecting documents. It was comparing claims made in one place with facts buried in another, often using the government’s own record to expose contradiction.\n\nPublic records have limitations. They can be incomplete, delayed, mistaken, or shaped by institutions. But they provide fixed details that can be checked: whether a person held a job, whether an organization existed at an address, whether a meeting occurred, whether a court filing or license was issued, and whether dates align. A source who uses a pseudonym may still leave corroborating events and institutional traces. An invented biography often collapses across many small records at once.\n\nStone’s documentary approach also disciplines dramatic theories. If a hostile outsider planted a false source, investigators should be able to identify some external contact, communication path, or real-world event that entered the newsroom. If a genuine source merely made ordinary mistakes, much of the biography and surrounding record should remain intact. When employment, property, court, school, and telephone records all fail together, the problem is larger than a misspelled name.\n\nStone’s documentary instinct is decisive because the public biography is false while the digital provenance is real. Shell organizations, recycled addresses, and fabricated dockets connect the supposed witnesses to one outside network. The reporter’s file contains the incoming originals, including metadata that cannot be generated by later editing of newsroom notes. The records show an engineered source operation entering the paper, not a genuine witness with a few mistakes and not a source invented from scratch by the reporter.","frame":"Compares account-recovery data, shell-company filings, and document templates. “The biography is false, but the records still show who built it. Follow the infrastructure.”","q":[{"q":"What distinguished I. F. Stone’s documentary reporting method?","o":[{"t":"He relied mainly on anonymous tips because official documents offered little value.","v":"wrong","fb":"Stone used sources, but his reputation rested heavily on intensive documentary reading."},{"t":"He treated every government error as proof of an organized conspiracy.","v":"danger","fb":"A discrepancy prompts investigation; it does not determine motive by itself."},{"t":"He compared official claims with details buried across public records.","v":"expert","fb":"Cross-reading records allowed contradictions to emerge from sources institutions had published themselves."},{"t":"He accepted public reports at face value if they carried an official seal.","v":"partial","fb":"His method was precisely to read beyond the headline and test internal consistency."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"Multiple false corroborators resolve to shared external infrastructure rather than to independent people or one mistaken interview."}},{"q":"When does absence from public records become strong evidence?","o":[{"t":"Whenever one database returns no result on the first spelling attempted.","v":"partial","fb":"One search may fail through spelling, coverage, or access limits and should not settle the issue."},{"t":"After a government spokesperson confirms that the person was invented.","v":"wrong","fb":"Independent documentary verification need not depend on an official admission."},{"t":"When the missing record makes an outside smear more exciting than a clerical error.","v":"danger","fb":"Narrative appeal does not determine evidentiary weight."},{"t":"When several independent systems should contain traces and all fail consistently.","v":"expert","fb":"Converging absences across unrelated records can undermine the existence of the claimed identity or event."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"Public-record contradictions become meaningful when compared with the archived source packets and contact metadata in the same file set."}},{"q":"What most strongly separates an external plant from reporter-created records?","o":[{"t":"The reporter’s notes repeating details that later appeared in the article.","v":"partial","fb":"Notes show use of the material, not necessarily creation of the source trail."},{"t":"Independent message headers and account data leading to one outside operator.","v":"expert","fb":"External provenance survives even though the personas and claims are false."},{"t":"The editor approving publication after several questions remained open.","v":"wrong","fb":"Approval is a newsroom failure but does not identify the fabricator."},{"t":"The witness biography containing an employer that public records cannot verify.","v":"danger","fb":"A false biography rules out a genuine witness but not an internal invention."}],"clue":{"category":"who","label":"WHO — corroboration","text":"Supposedly independent personas share recovery numbers, payment routes, and document templates controlled outside the newspaper."}}]},"sourcing":{"sci":"Carl Bernstein (b. 1944)","topic":"The discipline of sourcing","lede":"Carl Bernstein’s Watergate reporting showed how separate sources and documents can corroborate a hidden system without any one witness carrying the whole case.","no":3,"profile":"Carl Bernstein joined The Washington Post as a young reporter and, with Bob Woodward, investigated the 1972 break-in at the Democratic National Committee headquarters and the broader Watergate scandal. The reporting depended on persistence, documents, and many sources with partial knowledge. No single conversation supplied the complete story. Names, payments, campaign records, grand-jury developments, and accounts from officials were checked against one another before the newspaper advanced its claims.\n\nSourcing discipline means matching a source’s access to the fact asserted. A person may know that a meeting occurred but not what was said inside it. Another may confirm a payment but not its purpose. Independent corroboration is especially important for consequential allegations. Two reporters hearing the same rumor from people who copied one original claim do not have two sources; they have one information chain. Editors therefore ask how sources know, whether they are independent, what documents support them, and what details can be verified without exposing identities.\n\nThe method also clarifies the difference between editorial failure and fabrication. An editor can be overly trusting, rush publication, or waive a check. Those choices can permit falsehood to pass. But if a reporter creates nonexistent witnesses, manufactured notes, and false contact records, the originating act remains with the reporter even when supervision failed.\n\nBernstein’s source-mapping lesson asks whether apparent corroborators are genuinely independent. In Ashford they were not: several personas used different names but shared recovery numbers, document templates, payment routes, and a source broker. The reporter and editor failed to recognize the convergence, yet the information chain still has an external origin. Mapping that chain identifies both the mechanism and the person who assembled it, while the Source & Fact-Check Files preserve the complete path into the newsroom.","frame":"Pins the supposed corroborators to a board and links their payment routes to one broker. “Different names do not make independent sources when one hand controls them all.”","q":[{"q":"What makes two sources genuinely independent?","o":[{"t":"They learned the fact through genuinely separate access or evidence chains.","v":"expert","fb":"Independence requires distinct origins, not merely two people repeating one account."},{"t":"They use different names while describing the same rumor in similar language.","v":"wrong","fb":"Different speakers can still share one unverified source."},{"t":"They agree with the reporter before either is asked how they know.","v":"danger","fb":"Agreement without provenance can manufacture confidence rather than corroboration."},{"t":"They work in different departments and report through separate managers.","v":"partial","fb":"Different departments may be independent, but investigators must verify how each learned the fact."}],"clue":{"category":"what","label":"WHAT — decisive","text":"A coordinated broker built a source network and planted it through authentic incoming channels that the newsroom failed to verify."}},{"q":"How should source access be matched to a claim?","o":[{"t":"Assume senior titles provide knowledge of every event inside an institution.","v":"danger","fb":"Status does not guarantee direct access to a particular meeting, payment, or document."},{"t":"Treat detailed quotations as proof that the source personally witnessed events.","v":"wrong","fb":"Detail can be invented or secondhand and must be tied to provenance."},{"t":"Verify that the source’s role could realistically expose them to that specific fact.","v":"expert","fb":"A source’s position and firsthand access determine what parts of a story they can credibly confirm."},{"t":"Accept indirect knowledge whenever the source has been reliable on unrelated stories.","v":"partial","fb":"Past reliability matters, but each claim still needs appropriate access and corroboration."}],"clue":{"category":"where","label":"WHERE — decisive","text":"Every false persona, incoming document, verification warning, and provenance marker converges in the Source & Fact-Check Files."}},{"q":"Which link most directly identifies who built the coordinated source network?","o":[{"t":"The reporter’s byline appearing on every installment of the investigation.","v":"partial","fb":"The byline identifies the publisher of claims, not the creator of the source accounts."},{"t":"The managing editor defending the series after publication complaints began.","v":"wrong","fb":"Defending the story may be negligent without proving authorship of the deception."},{"t":"Several local witnesses repeating similar phrases during follow-up interviews.","v":"danger","fb":"Similar wording matters only after its origin and independence are tested."},{"t":"Shared recovery numbers, payment routes, and templates tied to one broker.","v":"expert","fb":"Common control infrastructure joins the supposedly separate personas to one operator."}],"clue":{"category":"who","label":"WHO — decisive","text":"One source broker registered the accounts, funded the contacts, and supplied the files that the newsroom mistook for corroboration."}}]}},"story":["<b>The Ashford Dispatch printed a witness who never existed under the name the paper used.<\/b>","Fact-Checker Jonah Pell holds the unanswered challenges. The Records Clerk can read the incoming metadata. Local Stringer Ames tested the people, addresses, and institutions on the ground.","The reporter may have invented everything, a genuine source may simply be wrong, or an outside operator may have built a false network convincing enough to enter normal reporting channels.","Nine clues trace where the source trail began, where it was preserved, and who controlled the supposedly independent voices."],"endings":{"overclaimWhat":"fabrication","dismissalWhat":"mistake","win":{"expertTitle":"The Network That Entered the Newsroom","expert":["You connect Lyle Ames, the Source & Fact-Check Files, and a coordinated external source operation. Incoming originals, shared account infrastructure, and payment routes establish an outside origin.","Corin Faye and the editor failed badly at verification, but they did not create the personas. The evidence also exceeds an ordinary factual mistake: the witness network was deliberately manufactured."],"soundTitle":"The External Source Chain","sound":["Your accusation identifies the broker, the source files, and the coordinated plant.","Some provenance details remain incomplete, but the inbound records and shared control infrastructure support the verdict."],"namedTitle":"Right Operation, Thin Provenance","named":["You choose the correct actor, location, and mechanism.","The call is right, although missed clues leave portions of the metadata or account-control chain underdeveloped."]},"overclaim":{"title":"The Reporter Did Not Create the First Trail","body":["The archived packets, signatures, and message headers predate the reporter’s notes and arrived through outside-controlled accounts.","Blaming internal fabrication alone ignores the operator who constructed the source network and inserted it into the reporting process."]},"dismissal":{"title":"This Was Not One Bad Interview","body":["Several supposed witnesses shared identities, infrastructure, templates, and payment routes.","That coordinated design cannot be explained by ordinary errors from a genuine source."]},"wrongNames":{"title":"The False Sources, Mislocated","body":["You recognize a coordinated plant but assign it away from the broker and source files that preserve its external origin."]}}}];</script>

<script>
const PACKS = window.__PACKS__ || [];
const CHEATS = /cheat/.test(location.search);
const stage = document.getElementById('stage');
const CATORDER = ['who','where','what']; // notepad order mirrors real Casebook
let S = null;

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1900);
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function clueCount(){return S.clues.who.length+S.clues.what.length+S.clues.where.length;}

/* ---------- CASE SELECT ---------- */
function toSelect(){
  S=null;
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  document.getElementById('homeBtn').style.display='none';
  document.getElementById('cheatBtn').style.display='none';
  document.getElementById('brandsub').textContent='A RECKON deduction game';
  document.getElementById('side').innerHTML=`<div class="agent"><div class="who">Casebook</div><div class="role">The Bureau's open files</div></div><p class="legend">Pick a case. Each has three informants; reject the sensational answer and the do-nothing answer alike — the truth is in between.</p>`;
  if(!PACKS.length){
    stage.innerHTML='<div class="err"><h3>No case packs loaded</h3><p>This player must sit beside <code>pack_e_avalanche_v3.js</code> and <code>pack_f_firmware_v3.js</code>. If the browser blocks local scripts, serve the folder:</p><p style="font-family:monospace;font-size:13px">python3 -m http.server 8080</p></div>';
    return;
  }
  const cards = PACKS.map((p,i)=>`
    <button class="card" onclick="startCase(${i})">
      <div class="tag">${esc(p.discipline||'')}</div>
      <div class="cname">${esc(p.title)}</div>
      <div class="chint">${esc(p.teaser||'')}</div>
      <div class="cstate">Open the inquiry →</div>
    </button>`).join('');
  stage.innerHTML=`
    <div class="eyebrow">Casebook</div>
    <h1>Three informants. Three readings.</h1>
    <p class="teaser muted">Each informant holds one scientist's passage with three questions. Answer them — you'll see correct or incorrect and why — and the questions you get right file their clues into the notepad afterward (one WHO, one WHERE, one WHAT per reading). The candidates sit in the notepad on the right; cross them off as you reason. Accuse whenever you're ready.</p>
    <div class="cards" style="margin-top:18px">${cards}</div>
    <p class="muted" style="font-size:12px">${PACKS.length} case(s) loaded.</p>`;
}

/* ---------- START ---------- */
function startCase(idx){
  const pack=PACKS[idx];
  S={ pack, idx,
      answered:{},
      clues:{who:[],what:[],where:[]},
      crossed:{who:{},what:{},where:{}},
      completed:new Set(),
      filedReadings:new Set(),
      credibility:100,
      lastFiled:null };
  document.getElementById('homeBtn').style.display='';
  document.getElementById('cheatBtn').style.display=CHEATS?'':'none';
  document.getElementById('brandsub').textContent=pack.title;
  try{if(pack&&pack.id)location.hash=pack.id;}catch(e){}
  renderHub();
}

/* ---------- NOTEPAD (right rail) ---------- */
function renderSide(){
  if(!S){return;}
  const p=S.pack; const h=[];
  const ag=p.agent||{name:'Investigator',role:"Investigator's Notepad"};
  h.push(`<div class="agent"><div class="who">${esc(ag.name)}</div><div class="role">${esc(ag.role)}</div></div>`);
  CATORDER.forEach(cat=>{
    const c=p.CATS[cat];
    const left=c.items.filter(it=>!S.crossed[cat][it.id]);
    const solo=left.length===1;
    h.push(`<div class="cf-h">${esc(c.title)}<span class="cnt">${left.length} left · ${S.clues[cat].length}/3 clues</span></div>`);
    c.items.forEach(it=>{
      const crossed=!!S.crossed[cat][it.id];
      const isSolo=solo&&!crossed&&left[0].id===it.id;
      const cls=crossed?'crossed':(isSolo?'only':'');
      const mk=crossed?'✗':(isSolo?'◆':'○');
      h.push(`<button class="trow ${cls}" onclick="toggleCross('${cat}','${it.id}')" title="Tap to cross off / restore"><span class="mk">${mk}</span><span class="tlabel">${esc(it.label)}</span></button>`);
    });
    // gathered clues for this category
    const notes=S.clues[cat];
    if(notes.length){
      h.push(`<div class="clues">`+notes.map(n=>{
        const fl=(S.lastFiled&&S.lastFiled.cat===cat&&S.lastFiled.text===n.text)?'flash':'';
        return `<div class="clue-note ${fl}">${esc(n.text)}<span class="src">via ${esc(n.sci)}</span></div>`;
      }).join('')+`</div>`);
    } else {
      h.push(`<div class="clue-empty">No ${cat.toUpperCase()} clue secured yet.</div>`);
    }
  });
  const v=Math.round(S.credibility);
  h.push(`<div class="stat"><div class="row"><span>${esc(p.standingLabel||'Credibility')}</span><strong>${v}</strong></div><div class="bar"><i style="width:${v}%"></i></div></div>`);
  h.push(`<div class="legend">○ open · ✗ crossed off (tap a row) · ◆ last one standing. Clues are hints, not verdicts — you still commit the accusation.</div>`);
  const readN=(p.READING_ORDER||[]).filter(k=>S.completed.has(k)).length;
  h.push(`<button class="btn ghost wide" onclick="renderArchive()">${esc(p.readingShort||'Readings')} · readings (${readN}/${(p.READING_ORDER||[]).length})</button>`);
  h.push(`<button class="btn warn wide" onclick="goAccuse()">Make an accusation</button>`);
  document.getElementById('side').innerHTML=h.join('');
  S.lastFiled=null;
}
function toggleCross(cat,id){
  if(S.crossed[cat][id]) delete S.crossed[cat][id]; else S.crossed[cat][id]=true;
  renderSide();
}

/* ---------- HUB ---------- */
function renderHub(){
  const p=S.pack;
  const story=(p.story||[]).map(s=>`<p>${s}</p>`).join('');
  const cards=(p.READING_ORDER||Object.keys(p.CHARACTERS)).map(k=>{
    const c=p.CHARACTERS[k]; const done=S.completed.has(k);
    return `<button class="card ${done?'done':''}" onclick="openReading('${k}')">
      <div class="face">${c.face||'📄'}</div>
      <div class="cname">${esc(c.name)}</div>
      <div class="crole">${esc(c.role||'')}</div>
      <div class="chint">${esc(c.hint||'')}</div>
      <div class="cstate">${done?'Re-read the passage →':'Read the passage →'}</div>
    </button>`;
  }).join('');
  const allDone=S.completed.size>=(p.READING_ORDER||[]).length;
  stage.innerHTML=`
    <div class="eyebrow">${esc(p.venue||'the inquiry')}</div>
    <h1>${esc(p.title)}</h1>
    <div class="emblem">${p.emblem||''}</div>
    <div class="brief">
      <div class="incident">${p.story&&p.story[0]?p.story[0]:esc(p.teaser)}</div>
      <div class="qline">${esc(p.teaser||'')}</div>
    </div>
    <div class="task">
      <div class="th">Your job — settle three questions</div>
      <ol>
        ${CATORDER.map(cat=>`<li><b>${esc(p.CATS[cat].title)}?</b> — choose one of the ${p.CATS[cat].items.length} candidates in the notepad.</li>`).join('')}
      </ol>
      <p class="muted" style="font-size:13px;margin:10px 0 0">The right explanation lies between the sensational story and the do-nothing story. Read the three informants below to earn clues, then accuse.</p>
    </div>
    ${p.story&&p.story.length>1?`<div class="story" style="margin-top:16px">${p.story.slice(1).map(s=>`<p>${s}</p>`).join('')}</div>`:''}
    <h3 class="section-h">The three informants</h3>
    <p class="muted" style="font-size:12.5px;margin:2px 0 0">Each holds one scientist's passage. The candidates you're deciding among are in the notepad on the right.${allDone?'':' You may accuse anytime, but all three readings give the fullest chain.'}</p>
    <div class="cards">${cards}</div>`;
  renderSide();
}
function attemptedCount(k){return S.answered[k]?Object.keys(S.answered[k]).length:0;}

/* ---------- READING ---------- */
function openReading(charKey){
  const p=S.pack; const c=p.CHARACTERS[charKey]; const topic=p.TOPICS[c.reading];
  // A completed reading opens read-only (retrieve the passage); an unfinished one resumes.
  if(S.completed.has(charKey)){ renderArchiveReading(charKey); return; }
  S.view={char:charKey, topicKey:c.reading, qIndex:firstUnanswered(charKey,topic), showFb:false, chosen:null};
  renderReading();
}
function firstUnanswered(charKey,topic){
  const ans=S.answered[charKey]||{};
  for(let i=0;i<topic.q.length;i++){ if(ans[i]===undefined) return i; }
  return topic.q.length;
}
function renderReading(){
  const p=S.pack; const v=S.view; const c=p.CHARACTERS[v.char]; const topic=p.TOPICS[v.topicKey];
  const total=topic.q.length;

  if(v.qIndex>=total){
    S.completed.add(v.char);
    // File the earned clues NOW — after all three questions are answered.
    const ans=S.answered[v.char]||{};
    let correctN=0;
    const justFiled=[];
    if(!S.filedReadings.has(v.char)){
      topic.q.forEach((qq,qi)=>{
        if(ans[qi]==='expert'){
          correctN++;
          const cat=qq.clue.category;
          if(!S.clues[cat].some(x=>x.char===v.char && x.text===qq.clue.text)){
            const note={text:qq.clue.text,label:qq.clue.label,char:v.char,sci:topic.sci};
            S.clues[cat].push(note); justFiled.push(qq.clue);
          }
        }
      });
      S.filedReadings.add(v.char);
      if(justFiled.length){ S.lastFiled={cat:justFiled[justFiled.length-1].category,text:justFiled[justFiled.length-1].text};
        toast(`${justFiled.length} clue${justFiled.length>1?'s':''} filed to the notepad — ${clueCount()}/9`); }
    } else {
      topic.q.forEach((qq,qi)=>{ if(ans[qi]==='expert') correctN++; });
    }
    const filedList = justFiled.length
      ? `<div class="clues" style="max-width:520px;margin-top:12px">`+justFiled.map(cl=>`<div class="clue-note"><b>${esc(cl.label)}</b> — ${esc(cl.text)}</div>`).join('')+`</div>`
      : `<p class="muted" style="max-width:640px">No new clues secured from this reading.</p>`;
    const perCat = topic.q.map((qq,qi)=>{
      const ok=ans[qi]==='expert';
      return `<span class="tag">${ok?'✓':'✗'} ${qq.clue.category.toUpperCase()}</span>`;
    }).join(' ');
    stage.innerHTML=`
      <div class="eyebrow">${esc(topic.topic)}</div>
      <h2>${esc(topic.sci)} — reading complete</h2>
      <p class="muted" style="max-width:640px">You answered <strong>${correctN} of ${total}</strong> correctly with ${esc(c.name)}. ${perCat}</p>
      ${filedList}
      <div class="rowbtns"><span></span><button class="btn primary" onclick="renderHub()">Back to the three informants</button></div>`;
    renderSide();
    return;
  }

  const q=topic.q[v.qIndex];
  const opts=q.o.map((o,oi)=>{
    if(v.showFb){
      const chosen=oi===v.chosen;
      return `<button class="opt ${chosen?'chosen':'dim'}" disabled>${esc(o.t)}</button>`;
    }
    return `<button class="opt" onclick="answer(${oi})">${esc(o.t)}</button>`;
  }).join('');

  let fbBlock='';
  if(v.showFb){
    const o=q.o[v.chosen];
    const isExpert=o.v==='expert';
    // Casebook-style: just correct / incorrect and the why. Clues are filed after the reading.
    const fbClass = isExpert?'expert':(o.v==='danger'?'danger':'wrong');
    const verdictLabel = isExpert?'Correct':'Incorrect';
    fbBlock=`<div class="fb ${fbClass}"><div class="verdict">${verdictLabel}</div><div class="fbtext">${esc(o.fb)}</div></div>
      <div class="rowbtns"><span></span><button class="btn primary" onclick="nextQ()">${v.qIndex+1<total?'Next question':'See what you secured'}</button></div>`;
  }

  stage.innerHTML=`
    <button class="btn small" onclick="renderHub()">← Back to informants</button>
    <div class="reading-head" style="margin-top:13px">
      <div class="eyebrow">${esc(c.name)} · ${esc(topic.topic)}</div>
      <div class="sci">${esc(topic.sci)}</div>
      <div class="topic">${esc(topic.lede||'')}</div>
    </div>
    <div class="profile">${(topic.profile||'').split('\n\n').map(t=>`<p>${esc(t)}</p>`).join('')}</div>
    ${topic.frame?`<div class="frame">${esc(topic.frame)}</div>`:''}
    <div class="qwrap">
      <div class="qprog">Question ${v.qIndex+1} of ${total}</div>
      <div class="qtext">${esc(q.q)}</div>
      ${opts}${(v.showFb||!CHEATS)?'':'<button class="btn small ghost" style="margin-top:2px" onclick="cheatQ()">🔧 Cheat · pick the correct answer</button>'}${fbBlock}
    </div>`;
  renderSide();
}
function answer(oi){
  const p=S.pack; const v=S.view; const topic=p.TOPICS[v.topicKey]; const q=topic.q[v.qIndex]; const o=q.o[oi];
  if(!S.answered[v.char]) S.answered[v.char]={};
  S.answered[v.char][v.qIndex]=o.v;
  v.chosen=oi; v.showFb=true;
  const delta={expert:0,partial:-4,wrong:-8,danger:-14}[o.v]||0;
  S.credibility=Math.max(0,S.credibility+delta);
  // Clues are NOT filed here — they are awarded after all three questions (see reading-complete block).
  renderReading();
}
function nextQ(){ S.view.qIndex++; S.view.showFb=false; S.view.chosen=null; renderReading(); }

/* ---------- READINGS ARCHIVE (retrieve past passages) ---------- */
function renderArchive(){
  const p=S.pack;
  const order=p.READING_ORDER||Object.keys(p.CHARACTERS);
  const rows=order.map(k=>{
    const c=p.CHARACTERS[k]; const topic=p.TOPICS[c.reading];
    const done=S.completed.has(k); const started=attemptedCount(k)>0;
    const state = done?'Completed':(started?('In progress · '+attemptedCount(k)+'/3'):'Not yet read');
    const cta = (done||started)?'Re-read →':'Read →';
    const secured = CATORDER.filter(cat=>S.clues[cat].some(x=>x.char===k)).map(cat=>cat.toUpperCase());
    const cluetags = done||started ? `<div style="margin-top:6px">${['who','where','what'].map(cat=>`<span class="tag">${secured.includes(cat.toUpperCase())?'✓':'—'} ${cat.toUpperCase()}</span>`).join(' ')}</div>` : '';
    return `<button class="card" onclick="openReading('${k}')" style="min-height:auto">
      <div class="face">${c.face||'📄'}</div>
      <div class="cname">${esc(topic.sci)}</div>
      <div class="crole">${esc(topic.topic)} · held by ${esc(c.name)}</div>
      ${cluetags}
      <div class="cstate">${esc(state)} · ${cta}</div>
    </button>`;
  }).join('');
  stage.innerHTML=`
    <button class="btn small" onclick="renderHub()">← Back to informants</button>
    <div class="eyebrow" style="margin-top:13px">${esc(p.dossierName||'Readings')}</div>
    <h2>${esc(p.readingLabel||'Scientist readings')}</h2>
    <p class="muted" style="max-width:640px">Retrieve any passage you've opened. Completed readings open read-only, with your answers and the clues they yielded.</p>
    <div class="cards">${rows}</div>`;
  renderSide();
}
function renderArchiveReading(charKey){
  const p=S.pack; const c=p.CHARACTERS[charKey]; const topic=p.TOPICS[c.reading];
  const ans=S.answered[charKey]||{};
  const qblocks=topic.q.map((q,qi)=>{
    const mine=ans[qi];
    const opts=q.o.map(o=>{
      const isExpert=o.v==='expert';
      const isMine=mine!==undefined && o.v===mine;
      let tags='';
      if(isExpert) tags+='<span class="tag" style="color:var(--good)">correct</span> ';
      if(isMine && !isExpert) tags+='<span class="tag" style="color:var(--danger)">your answer</span> ';
      else if(isMine && isExpert) tags+='<span class="tag" style="color:var(--good)">your answer</span> ';
      return `<div class="opt ${isExpert?'chosen':(isMine?'':'dim')}" style="cursor:default">${tags}${esc(o.t)}${(isExpert||isMine)?`<div class="muted" style="font-size:12.5px;margin-top:6px">${esc(o.fb)}</div>`:''}</div>`;
    }).join('');
    const earned = mine==='expert';
    const clue = earned
      ? `<div class="clue-drop"><div class="clabel">${esc(q.clue.label)} · secured</div><div class="ctext">${esc(q.clue.text)}</div></div>`
      : `<div class="clue-locked">${esc(q.clue.category.toUpperCase())} clue was not secured (answered ${mine?('“'+mine+'”'):'—'}).</div>`;
    return `<div class="qwrap"><div class="qprog">Question ${qi+1} · ${esc(q.clue.category.toUpperCase())} clue</div>
      <div class="qtext">${esc(q.q)}</div>${opts}${clue}</div>`;
  }).join('');
  stage.innerHTML=`
    <button class="btn small" onclick="renderArchive()">← All readings</button>
    <span style="display:inline-block;width:6px"></span>
    <button class="btn small ghost" onclick="renderHub()">Informants</button>
    <div class="reading-head" style="margin-top:13px">
      <div class="eyebrow">Read-only · ${esc(c.name)} · ${esc(topic.topic)}</div>
      <div class="sci">${esc(topic.sci)}</div>
      <div class="topic">${esc(topic.lede||'')}</div>
    </div>
    <div class="profile">${(topic.profile||'').split('\n\n').map(t=>`<p>${esc(t)}</p>`).join('')}</div>
    ${topic.frame?`<div class="frame">${esc(topic.frame)}</div>`:''}
    ${qblocks}
    <div class="rowbtns"><span></span><button class="btn primary" onclick="renderArchive()">Back to all readings</button></div>`;
  renderSide();
}

/* ---------- CHEATS (prototype only) ---------- */
function cheatQ(){
  const v=S.view; const q=S.pack.TOPICS[v.topicKey].q[v.qIndex];
  const ei=q.o.findIndex(o=>o.v==='expert');
  answer(ei>=0?ei:0);
}
function cheatSolveAll(){
  const p=S.pack;
  (p.READING_ORDER||Object.keys(p.CHARACTERS)).forEach(k=>{
    const topic=p.TOPICS[p.CHARACTERS[k].reading];
    S.answered[k]=S.answered[k]||{};
    topic.q.forEach((qq,qi)=>{
      S.answered[k][qi]='expert';
      const cat=qq.clue.category;
      if(!S.clues[cat].some(x=>x.char===k && x.text===qq.clue.text))
        S.clues[cat].push({text:qq.clue.text,label:qq.clue.label,char:k,sci:topic.sci});
    });
    S.completed.add(k); S.filedReadings.add(k);
  });
  S.credibility=100;
  S.lastFiled=null;
  toast(`Cheat: all readings solved — ${clueCount()}/9 clues filed`);
  renderHub();
}

/* ---------- ACCUSE ---------- */
function goAccuse(){
  S.accuse={who:null,what:null,where:null};
  renderAccuse();
}
function renderAccuse(){
  const p=S.pack; const a=S.accuse;
  const cats=CATORDER.map(cat=>{
    const cdef=p.CATS[cat];
    const choices=cdef.items.map(it=>{
      const crossed=!!S.crossed[cat][it.id];
      return `<button class="choice ${a[cat]===it.id?'sel':''} ${crossed?'strike':''}" onclick="pick('${cat}','${it.id}')"><span class="lbl">${esc(it.label)}</span></button>`;
    }).join('');
    return `<div class="accuse-cat"><div class="catt">${esc(cdef.title)}</div>${choices}</div>`;
  }).join('');
  const ready=a.who&&a.what&&a.where;
  stage.innerHTML=`
    <button class="btn small" onclick="renderHub()">← Back</button>
    <div class="eyebrow" style="margin-top:13px">${esc(p.title)}</div>
    <h2>Name the who, the where, and the what.</h2>
    <p class="muted" style="max-width:640px">You've secured ${clueCount()} of 9 clues. Cross-read the notepad, then commit to one option per column. Rows you've crossed off appear struck through.</p>
    <div class="accuse-grid">${cats}</div>
    <div class="rowbtns">${CHEATS?'<button class="btn small ghost" onclick="cheatAccuse()">🔧 Cheat · fill correct</button>':'<span></span>'}<button class="btn primary" ${ready?'':'disabled'} onclick="resolve()">Deliver the verdict</button></div>`;
  renderSide();
}
function pick(cat,id){ S.accuse[cat]=id; renderAccuse(); }
function cheatAccuse(){ const p=S.pack; S.accuse={who:p.CATS.who.truth,what:p.CATS.what.truth,where:p.CATS.where.truth}; renderAccuse(); }

/* ---------- RESOLVE ---------- */
function resolve(){
  const p=S.pack; const a=S.accuse; const E=p.endings;
  const tWho=p.CATS.who.truth, tWhat=p.CATS.what.truth, tWhere=p.CATS.where.truth;
  const correctAll = a.who===tWho && a.what===tWhat && a.where===tWhere;
  const n=clueCount();
  const nameOf=(cat)=>{const it=p.CATS[cat].items.find(x=>x.id===a[cat]);return it?it.label:'?';};
  let title, paras, band;
  if(correctAll){
    const tier = n>=8?'expert':(n>=5?'sound':'named');
    if(tier==='expert'){title=E.win.expertTitle;paras=E.win.expert;}
    else if(tier==='sound'){title=E.win.soundTitle;paras=E.win.sound;}
    else {title=E.win.namedTitle;paras=E.win.named;}
    band=`Solved · ${n}/9 clues · reading tier <strong>${tier}</strong> · credibility ${Math.round(S.credibility)}`;
  } else if(a.what===E.overclaimWhat){ title=E.overclaim.title; paras=E.overclaim.body; band=`Overclaim · the vivid story over the documented chain · ${n}/9 clues`; }
  else if(a.what===E.dismissalWhat){ title=E.dismissal.title; paras=E.dismissal.body; band=`Dismissal · you called it chance · ${n}/9 clues`; }
  else { title=E.wrongNames.title; paras=E.wrongNames.body; band=`Right mechanism, misassigned · ${n}/9 clues`; }
  const truthLabel=(cat)=>{const id=p.CATS[cat].truth;const it=p.CATS[cat].items.find(x=>x.id===id);return it?it.label:'?';};
  const colOk=(cat)=>S.accuse[cat]===p.CATS[cat].truth;
  const nCorrect=CATORDER.filter(colOk).length;
  const statusCls=correctAll?'solved':'failed';
  const statusMark=correctAll?'✓':'✗';
  const statusLabel=correctAll?'Case solved':(nCorrect>0?`Not solved — ${nCorrect} of 3 right`:'Not solved');
  const statusSub=correctAll?'You named the who, the where, and the what correctly.':'Your accusation does not match the record. The truth is below.';
  const solutionRows=CATORDER.map(cat=>{
    const ok=colOk(cat);
    return `<tr>
      <td class="cat">${esc(p.CATS[cat].title)}</td>
      <td class="mine ${ok?'ok':'no'}">${esc(nameOf(cat))}</td>
      <td class="truth">${esc(truthLabel(cat))}</td>
      <td class="res">${ok?'<span style="color:var(--good)">✓</span>':'<span style="color:var(--danger)">✗</span>'}</td>
    </tr>`;
  }).join('');
  stage.innerHTML=`
    <div class="ending">
      <div class="eyebrow">Verdict — ${esc(p.title)}</div>
      <div class="result-status ${statusCls}">
        <span class="rmark">${statusMark}</span>
        <span><span class="rlabel">${statusLabel}</span><br><span class="rsub">${statusSub}</span></span>
      </div>
      <table class="solution-table">
        <thead><tr><th>Question</th><th>Your accusation</th><th>The truth</th><th></th></tr></thead>
        <tbody>${solutionRows}</tbody>
      </table>
      <div class="verdict-band">${band}</div>
      <div class="etitle">${title}</div>
      ${paras.map(t=>`<p>${t}</p>`).join('')}
      <div class="rowbtns">
        <button class="btn" onclick="renderArchive()">Re-read the passages</button>
        <button class="btn primary" onclick="startCase(${S.idx})">Play again</button>
        <button class="btn" onclick="toSelect()">Another case</button>
      </div>
    </div>`;
  renderSide();
}

/* boot */
function boot(){
  toSelect();
  const h=(location.hash||"").replace(/^#/,"");
  if(h){ const i=PACKS.findIndex(p=>p.id===h); if(i>=0) startCase(i); }
}
boot();
</script>

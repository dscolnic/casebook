<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sequence Chapters — Twenty Educational Logic Games</title>
<style>
:root{
  --bg:#ffffff;--panel:#ffffff;--panel2:#f2f2f0;--line:#e4e4e2;
  --text:#1a1a17;--muted:#565651;--blue:#2f5d86;--gold:#8a6a12;
  --green:#2f6d4f;--red:#b3261e;--orange:#a8622a;--shadow:0 1px 3px rgba(0,0,0,.07)
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#ffffff}
button{font:inherit}.wrap{max-width:1280px;margin:auto;padding:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}
.brand{display:flex;gap:11px;align-items:center}.patch{width:56px;height:56px;border:2px solid var(--gold);border-radius:15px;background:#eef3f7;display:grid;place-items:center;font-weight:900;text-align:center}
.brand h1{margin:0;font-size:21px}.brand small{color:var(--muted)}
.btn{border:1px solid var(--line);background:#f2f2f0;color:var(--text);padding:9px 13px;border-radius:9px;cursor:pointer}
.btn:hover:not(:disabled){background:#e9eef2}.btn.primary{background:#2f5d86;border-color:#2f5d86;color:#fff;font-weight:850}.btn:disabled{opacity:.35;cursor:not-allowed}
.panel{background:#ffffff;border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}
.hero,.game{padding:32px 36px}.hero h2,.gamehead h2{font-size:clamp(38px,6.4vw,64px);line-height:1;letter-spacing:-.045em;margin:9px 0 15px}
.hero p{font-size:17px;line-height:1.68;color:#565651;max-width:900px}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--gold);font-weight:900}
.storybox,.note,.feedback,.sourcebox{padding:14px 16px;border-radius:10px;line-height:1.55;margin:15px 0}
.storybox{border-left:4px solid var(--gold);background:rgba(239,202,114,.08)}
.note{border-left:4px solid var(--orange);background:rgba(239,173,104,.08)}
.sourcebox{border-left:4px solid var(--blue);background:#f7f7f5;color:var(--muted);font-size:13px}
.feedback{display:none}.feedback.show{display:block}.feedback.bad{border-left:4px solid var(--red);background:rgba(255,148,148,.08)}.feedback.good{border-left:4px solid var(--green);background:rgba(123,215,154,.08)}.feedback.lose{border-left:4px solid var(--red);background:rgba(255,148,148,.11)}
.hintpanel{border:1px solid #e4e4e2;background:#f7f7f5;border-radius:12px;padding:13px 14px;margin:14px 0}.hinthead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.hinthead strong{color:var(--gold)}.hinthead span{color:var(--muted);font-size:12px}.hintactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hintreveal{border-left:4px solid var(--blue);background:rgba(112,201,242,.075);border-radius:9px;padding:10px 12px;margin-top:9px;color:#565651;line-height:1.5}.hintreveal strong{color:var(--blue)}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.homegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.homecard{border:1px solid var(--line);background:#f7f7f5;border-radius:16px;padding:21px;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
.homecard:hover{border-color:var(--blue);transform:translateY(-2px)}.homecard .icon{width:48px;height:48px;border:2px solid var(--gold);border-radius:13px;display:grid;place-items:center;font-weight:900;background:#eef3f7}
.homecard .discipline{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--blue);font-weight:900;margin-top:12px}.homecard h3{font-size:25px;margin:6px 0}.homecard p{color:var(--muted);line-height:1.45}
.homecard .cardbrief{margin:8px 0 2px}.homecard .cardbrief p{font-size:12.5px;line-height:1.46;color:var(--muted);margin:0 0 6px}.homecard .cardbrief .cb-lead{font-size:13.5px;font-weight:700;color:var(--text)}
.motivation{margin:0 0 14px;padding:12px 15px;border-left:4px solid var(--blue);background:rgba(47,93,134,.07);border-radius:10px;line-height:1.5}.motivation .mot-lead{font-weight:700;color:var(--text);margin:0 0 6px}.motivation p{margin:0 0 6px;font-size:14px;color:var(--muted)}.motivation p:last-child{margin-bottom:0}
.lesson{border:1px solid var(--line);background:#f7f7f5;border-radius:14px;padding:16px;margin:17px 0}.lesson h3{margin:0 0 8px;color:var(--gold)}.overview{margin:0!important;max-width:none!important;color:#565651!important;font-size:15px!important;line-height:1.62!important}
.termgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.term{border:1px solid #e4e4e2;background:#f7f7f5;border-radius:10px;padding:11px}.term strong{display:block;color:var(--blue);margin-bottom:4px}.term p{margin:0!important;color:#565651!important;font-size:13px!important;line-height:1.46!important}
.gamehead{display:flex;justify-content:space-between;align-items:start;gap:18px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}.gamehead h2{font-size:38px}.gamehead p{margin:0;color:var(--muted);line-height:1.5;max-width:800px}.stage{border:1px solid var(--line);border-radius:999px;padding:8px 11px;background:#f2f2f0;font-size:12px;white-space:nowrap}
.playhelp{border:1px dashed #cfcfca;border-radius:11px;padding:12px 14px;color:var(--muted);line-height:1.48;margin-bottom:14px}.playhelp strong{color:var(--gold)}
.howto{margin:8px 0 0}.howto summary{cursor:pointer;color:var(--blue);font-size:12.5px;font-weight:700;list-style:none}.howto summary::-webkit-details-marker{display:none}.howto summary::before{content:"ⓘ  "}.howto p{font-size:13px;color:var(--muted);line-height:1.5;margin:7px 0 0;max-width:640px}
.sqinfo{margin:8px 20px}.sqinfo summary{cursor:pointer;color:var(--blue);font-weight:700;font-size:13px;list-style:none;padding:6px 0}.sqinfo summary::-webkit-details-marker{display:none}.sqinfo summary::before{content:"▸ "}.sqinfo[open] summary::before{content:"▾ "}.sqinfo>div{color:var(--muted);line-height:1.52;padding:2px 0 8px}
.chapter-stack{display:grid;gap:0}.chapter-wrap{position:relative}
.chapter{border:1px solid var(--line);background:#f7f7f5;border-radius:16px;padding:12px;transition:.15s}
.chapter.locked{border-color:var(--green);box-shadow:0 0 0 2px rgba(123,215,154,.12)}
.chapter.dragging{opacity:.45}.chapter.dragover{border-color:var(--gold);transform:translateY(3px)}
.chapter-head{display:grid;grid-template-columns:36px 26px minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:12px}
.chapter-number{width:34px;height:34px;border-radius:50%;background:#eef3f7;color:var(--gold);display:grid;place-items:center;font-weight:900}
.draghandle{font-size:23px;color:#7a7a72;cursor:grab;user-select:none;text-align:center}.draghandle:active{cursor:grabbing}.locked .chapter-head>.draghandle{color:#b0b0a8;cursor:not-allowed}
.chapter-title{font-weight:850;font-size:17px}.chapter-sub{color:var(--muted);font-size:12px;margin-top:2px}
.chapter-moves,.card-moves{display:flex;gap:5px}.card-moves{grid-column:1 / -1;justify-content:flex-end}.movebtn{width:32px;height:30px;border:1px solid var(--line);border-radius:8px;background:#f7f7f5;color:var(--text);cursor:pointer;font-weight:900;display:grid;place-items:center}.movebtn:hover:not(:disabled){border-color:var(--blue);background:#e9eef2}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.card{border:1px solid #e4e4e2;background:#f2f2f0;border-radius:11px;padding:8px;display:grid;grid-template-columns:24px 18px minmax(0,1fr);grid-template-rows:auto auto;column-gap:7px;row-gap:6px;align-items:start;min-height:96px;transition:.14s}
.card.locked{border-color:var(--green);background:rgba(123,215,154,.07)}.card.dragging{opacity:.45}.card.dragover{border-color:var(--gold);transform:translateY(2px)}
.card-num{width:22px;height:22px;border-radius:50%;background:#f7f7f5;color:var(--gold);display:grid;place-items:center;font-weight:900;font-size:10px}.card-title{font-weight:400;line-height:1.32;font-size:13px}.card.locked .draghandle{color:#b0b0a8;cursor:not-allowed}
.intro-panel{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:start;margin:0 20px 12px;padding:13px 15px;border-left:4px solid var(--blue);background:rgba(112,201,242,.075);border-radius:10px;color:#565651;line-height:1.52}.intro-icon{width:34px;height:34px;border-radius:50%;background:#eef3f7;color:var(--blue);display:grid;place-items:center;font-weight:900}.intro-panel strong{display:block;color:var(--blue);margin-bottom:3px}.segue{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:start;margin:12px 20px;padding:13px 15px;border-left:4px solid var(--gold);background:rgba(239,202,114,.075);border-radius:10px;color:#565651;line-height:1.52}
.segue-icon{width:34px;height:34px;border-radius:50%;background:#eef3f7;color:var(--gold);display:grid;place-items:center;font-weight:900}.segue strong{display:block;color:var(--gold);margin-bottom:3px}
.statusbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 0;color:var(--muted);font-size:13px}.green{color:var(--green);font-weight:800}
.solution-chapter{border:1px solid var(--line);background:#f7f7f5;border-radius:15px;padding:15px}.solution-chapter h3{margin:0 0 10px;color:var(--blue)}.solution-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.solution-card{border:1px solid #e4e4e2;background:#f2f2f0;border-radius:10px;padding:11px;line-height:1.4}.solution-card span{display:block;color:var(--gold);font-size:11px;font-weight:900;margin-bottom:5px}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.solution-cards{grid-template-columns:1fr 1fr}.termgrid,.homegrid{grid-template-columns:1fr}}
@media(max-width:600px){.hinthead{align-items:flex-start}.wrap{padding:11px}.hero,.game{padding:20px}.gamehead{flex-direction:column}.chapter-head{grid-template-columns:34px 22px 1fr}.chapter-moves{grid-column:3;justify-content:flex-end}.cards{grid-template-columns:1fr}.card{grid-template-columns:24px 18px minmax(0,1fr)}.solution-cards{grid-template-columns:1fr}.segue{margin:10px 4px}}
</style>
</head>

<script>
const GAMES=[{"id":"wound","icon":"✚","discipline":"Medicine & biology","title":"The Cut That Closes","headline":"Reconstruct how the body stops bleeding and rebuilds damaged skin.","kicker":"School athletics room · A clean cut has just occurred","story":["A student catches a forearm on a sharp edge. The cut is shallow but has broken small blood vessels and the protective skin barrier.","Reconstruct the repair process by matching each tissue state to the structures and cell activities it requires."],"overview":"A skin wound creates several problems at the same time: blood escapes from damaged vessels, microbes can enter through the broken barrier, tissue is missing, and the repaired area has little strength. Blood components, immune cells, connective-tissue cells, and skin cells solve different parts of this problem. The useful question is which structures or conditions each cell type needs in order to do its job.","terms":[["Platelet","A small blood-cell fragment that sticks to damaged vessels and to other platelets."],["Fibrin","A tough protein thread that forms a mesh through a blood clot."],["Fibroblast","A repair cell that produces collagen and other structural material."],["Granulation tissue","Soft, pink repair tissue rich in new capillaries and fibroblasts."],["Tensile strength","The amount of pulling force tissue can withstand without tearing."]],"note":"Real wound-healing phases overlap. This game uses the usual dominant progression: hemostasis, inflammation, proliferation, and remodeling.","sources":"Fact-checked against NIH/NCBI reviews of the overlapping phases of wound healing.","chapters":[{"id":"seal","cards":[["tear","The cut tears the skin and opens small blood vessels"],["narrow","Blood vessels tighten around the damaged area"],["platelets","Platelets gather into a temporary blood plug"],["fibrin","Fibrin threads reinforce the platelet plug"]]},{"id":"rebuild","cards":[["neutrophils","Neutrophils attack microbes inside the wound"],["macrophages","Macrophages remove debris and direct repair"],["capillaries","Tiny new blood vessels grow into the wound"],["fibroblasts","Fibroblasts lay down collagen and supporting tissue"]]},{"id":"finish","cards":[["skin","Skin cells spread across the repair tissue"],["contract","The wound edges pull closer together"],["vesselsfade","Extra repair blood vessels disappear"],["scar","Collagen fibers align and strengthen the scar"]]}],"chapterOrder":["seal","rebuild","finish"],"segues":["Bleeding is now controlled, but the wound is still open, contaminated, and missing tissue. The body can shift from emergency sealing to immune cleanup and construction of a living repair bed.","The gap now contains blood vessels, repair cells, and collagen. That foundation allows the surface barrier to close while the deeper scar is reshaped and strengthened."],"principles":[["Solve the immediate danger first","The body must limit blood loss before it can devote resources to cleaning and rebuilding tissue."],["Temporary structures can support durable ones","A quick biological fix may act as a scaffold for a stronger structure rather than being the final repair."],["Different cells require different conditions","Immune cells need access to the wound, repair cells need oxygen and support, and skin cells need a surface they can cross."],["Closed does not mean fully healed","A restored skin surface and a mechanically strong scar describe different accomplishments."]],"hints":["Blood vessels tighten around the injury before platelets gather into a temporary plug.","Skin cells spread across the repair tissue before collagen fibers finish aligning and strengthening the scar."],"intro":"The injury has just occurred. Blood is escaping through damaged small vessels, the protective skin barrier is open, and the wound contains exposed tissue. Sequence A must address the body’s most urgent problems without assuming that rebuilding is already underway.","collection":"Core collection"},{"id":"star","icon":"★","discipline":"Astronomy","title":"A Star Like the Sun","headline":"Follow one Sun-like star from a cold cloud to a white dwarf.","kicker":"Stellar evolution archive · Billions of years compressed into minutes","story":["A survey has assembled images of one solar-mass star at widely separated stages of its life, but the labels were lost.","Reconstruct the pathway for a star roughly like the Sun—not a massive star that ends in a core-collapse supernova."],"overview":"Snapshots of a Sun-like star can be misleading because a large red star can represent more than one internal condition. The most useful evidence lies in the core: whether gravity or fusion supplies the energy, which element is being fused, whether fusion occurs in the center or in shells, and whether the outer envelope remains attached to the compact core.","terms":[["Molecular cloud","A cold, dense region of gas and dust where stars can form."],["Protostar","A contracting young stellar object heated mainly by gravity, without stable hydrogen fusion."],["Main sequence","The long-lived stage in which core hydrogen fusion supports the star."],["Fusion shell","A layer around the core where nuclear fusion occurs."],["Planetary nebula","Glowing gas expelled from a low-mass star; it is unrelated to planets."],["White dwarf","A dense exposed stellar core with no sustained fusion."]],"note":"Exact details depend on mass and composition. The game shows the standard low- or intermediate-mass pathway.","sources":"Fact-checked against NASA explanations of stellar birth, main-sequence evolution, red giants, planetary nebulae, and white dwarfs.","chapters":[{"id":"birth","cards":[["collapse","A cold cloud fragment collapses under gravity"],["gather","A protostar gathers gas from its surroundings"],["heat","Compression heats the center of the protostar"],["hydrogen","Hydrogen fusion stabilizes the young star"]]},{"id":"giant","cards":[["fuel","Hydrogen becomes scarce in the stellar core"],["shell","Hydrogen fusion continues in a shell around the core"],["expand","The outer envelope swells into a red giant"],["helium","Helium fusion creates carbon and oxygen in the core"]]},{"id":"remnant","cards":[["carboncore","A dense carbon-oxygen core remains"],["winds","Pulsations and winds carry the outer gas into space"],["nebula","Ultraviolet light makes the expelled gas glow"],["dwarf","The exposed core remains as a cooling white dwarf"]]}],"chapterOrder":["birth","giant","remnant"],"segues":["The star now has a long-lived nuclear energy source, but the hydrogen available in its center is finite. A changing core fuel supply alters the balance between gravity, pressure, and the outer envelope.","The center now contains heavier elements, while the extended envelope has become unstable. Mass loss exposes the compact core and creates a glowing shell of expelled gas."],"principles":[["Track the source of energy","Ask whether the object is powered mainly by gravity, hydrogen fusion, helium fusion, or stored heat."],["The core keeps a chemical record","A helium-rich core and a carbon-oxygen core imply different nuclear reactions have occurred."],["Core changes affect the envelope","When fuel and pressure conditions change in the center, the outer layers can expand, pulse, or escape."],["Separate expelled gas from the remnant","A glowing gas shell and a compact white dwarf are different parts of the same former star."]],"hints":["A protostar gathers gas and heats through compression before hydrogen fusion stabilizes the young star.","Pulsations and winds carry outer gas into space before ultraviolet light makes that expelled gas glow."],"intro":"The material begins as a cold, dense concentration of gas and dust with no stable nuclear energy source. Sequence A must explain how gravity transforms that material into a long-lived star.","collection":"Core collection"},{"id":"web","icon":"⌁","discipline":"Computing","title":"The First Visit to a Secure Website","headline":"Put the hidden network and browser operations behind one click into order.","kicker":"Browser laboratory · Assume an uncached first visit over HTTPS","story":["A user enters a web address and presses Return. The browser must coordinate networking, security, document processing, and graphics to produce an interactive page.","Reconstruct the dependency chain from the information in the typed address to the final pixels on the screen."],"overview":"A secure webpage depends on several specialized systems. Human-readable addresses, numerical routing, reliable transport, encryption, application messages, document structure, supporting files, and visual rendering are different layers. The puzzle depends on recognizing how the output of one layer becomes the input used by a different layer.","terms":[["URL","The full web address, including the protocol, hostname, and path."],["DNS","The system that converts a hostname such as example.com into an IP address."],["IP address","A numerical network destination used to route packets."],["TCP","A transport protocol that provides ordered, reliable delivery."],["TLS","The protocol that authenticates the server and encrypts HTTPS traffic."],["HTML","The main markup language describing the structure of a web page."],["Render","To calculate the page’s appearance and draw it on the screen."]],"note":"Browsers perform some work in parallel and may reuse cached information. This game presents the dependency order for a fresh secure connection.","sources":"Fact-checked against MDN documentation on DNS, TCP, TLS, HTTP, parsing, layout, and painting.","chapters":[{"id":"connect","cards":[["parse","The browser separates the typed web address into parts"],["dns","DNS matches the website name to an IP address"],["tcp","The browser and server establish a reliable connection"],["tls","TLS verifies the server and creates encryption"]]},{"id":"exchange","cards":[["request","The browser sends an HTTP request for the page"],["receive","The server application receives the request"],["build","The server builds an HTTP response"],["html","The main HTML document reaches the browser"]]},{"id":"render","cards":[["parsehtml","The browser turns HTML into a document structure"],["assets","The browser loads styles, scripts, images, and fonts"],["layout","The browser calculates sizes, positions, and visual layers"],["paint","The browser paints pixels and activates interactive scripts"]]}],"chapterOrder":["connect","exchange","render"],"segues":["The browser now has a private, reliable channel to the correct server. That channel can carry a request naming the particular page the user wants.","The browser now possesses the page’s main structural instructions. Those instructions identify supporting files and provide the information needed to calculate and draw the page."],"principles":[["Each layer solves a different problem","Names, routing, reliable delivery, encryption, application messages, and visual rendering are not interchangeable."],["Outputs become inputs","The result produced by one system is often exactly what the next system needs."],["Security needs a communication path","The browser cannot negotiate an encrypted session with a server until it can reach that server reliably."],["A document is not yet a visible page","The browser still needs supporting files, layout calculations, and drawing operations."]],"hints":["DNS supplies the IP address before the browser and server establish their reliable connection.","The server builds an HTTP response before the main HTML document can reach the browser."],"intro":"The user has entered a secure web address, but the browser has no ready connection and has not yet obtained the requested page. Sequence A must establish a trustworthy communication path to the correct destination.","collection":"Core collection"},{"id":"law","icon":"§","discipline":"Law & civics","title":"A Federal Civil Case","headline":"Reconstruct the path from a complaint to appellate review.","kicker":"Fictional U.S. federal courthouse · A contract dispute proceeds through trial","story":["A manufacturer claims that a supplier broke a contract and caused financial losses. The dispute cannot be resolved informally.","Put the major procedural stages in order, assuming the case survives early motions, does not settle, reaches trial, and is appealed."],"overview":"A federal civil case is represented by a growing court record. Some documents state allegations, some prove formal notice, some answer legal claims, some gather factual material, some narrow disputed issues, and some record decisions. The puzzle asks which records can logically refer to or rely on specific records elsewhere in the file.","terms":[["Plaintiff","The party that begins the civil lawsuit."],["Defendant","The party against whom the claim is brought."],["Complaint","The document stating the plaintiff’s claims and requested relief."],["Summons","A formal notice telling the defendant that a lawsuit has been filed."],["Discovery","The structured exchange and collection of relevant evidence."],["Judgment","The court’s formal, enforceable disposition."],["Remand","An appellate court’s instruction sending a matter back to the lower court."]],"note":"Many civil cases settle or are dismissed without a trial. Deadlines and details vary. This is a simplified educational pathway, not legal advice.","sources":"Fact-checked against the U.S. Courts overview of federal civil cases and appellate review.","chapters":[{"id":"plead","cards":[["complaint","The plaintiff files a complaint with the court"],["summons","The court issues a summons for the defendant"],["service","The defendant receives the summons and complaint"],["answer","The defendant files an answer or a motion"]]},{"id":"evidence","cards":[["documents","The parties exchange relevant documents"],["depositions","Witnesses answer questions in sworn depositions"],["experts","Expert witnesses disclose their opinions"],["motions","The judge rules on pretrial motions"]]},{"id":"decision","cards":[["trial","Witnesses and exhibits are presented at trial"],["verdict","A judge or jury reaches a decision"],["judgment","The court enters an enforceable judgment"],["appeal","An appellate court reviews claimed legal errors"]]}],"chapterOrder":["plead","evidence","decision"],"segues":["The court now has the plaintiff’s claims, proof that the defendant received notice, and the defendant’s response. The dispute can move from written allegations toward a factual record.","The available evidence and the unresolved issues are now defined. The case can proceed to formal factfinding, an enforceable result, and possible review by a higher court."],"principles":[["Formal notice matters","A party cannot fairly be required to answer a lawsuit it has not officially received."],["Allegations and evidence are different","Pleadings state positions; discovery builds the factual record used to test them."],["Courts narrow disputes","Some legal and evidentiary questions are resolved so the factfinder can focus on what remains contested."],["Review requires a decision to review","An appellate court examines claimed errors in an existing lower-court record and judgment."]],"hints":["The court issues the summons before the defendant receives the summons and complaint.","The court enters an enforceable judgment before an appellate court reviews claimed legal errors."],"intro":"A private dispute has not yet become an enforceable court case. Sequence A must establish the plaintiff’s claims, formal notice to the defendant, and the defendant’s opportunity to respond.","collection":"Core collection"},{"id":"cuba","icon":"1962","discipline":"History & diplomacy","title":"Thirteen Days in October","headline":"Reconstruct the escalation and negotiated end of the Cuban Missile Crisis.","kicker":"National-security archive · October 1962","story":["Photographs reveal Soviet nuclear-missile sites under construction in Cuba. U.S. leaders must respond without triggering nuclear war.","Arrange the major events from secret deployment through public confrontation and negotiated withdrawal."],"overview":"The Cuban Missile Crisis produced very different kinds of evidence: Soviet construction activity in Cuba, U.S. reconnaissance photographs, classified policy memoranda, a presidential broadcast, naval operations records, private messages from Nikita Khrushchev, and a public diplomatic agreement. The puzzle depends on determining which documents and actions rely on information contained in specific parts of that record.","terms":[["U-2","A high-altitude reconnaissance aircraft used to photograph missile sites."],["ExComm","Kennedy’s senior advisory group for debating responses to the crisis."],["Quarantine","The U.S. term for the limited naval interdiction around Cuba."],["Jupiter missile","A U.S. nuclear missile deployed in Turkey during the crisis."],["Back channel","Private communication outside the most visible public negotiations."],["Non-invasion pledge","The U.S. assurance that it would not invade Cuba."]],"note":"The crisis involved simultaneous military and diplomatic actions. This game follows eight widely recognized milestones.","sources":"Fact-checked against the U.S. Department of State Office of the Historian chronology and documents.","chapters":[{"id":"discovery","cards":[["arrive","Soviet missile crews and equipment arrive in Cuba"],["construct","Launch sites are built under secrecy"],["photos","A U-2 spy plane photographs the missile sites"],["excomm","Kennedy convenes ExComm to study the evidence"]]},{"id":"quarantine","cards":[["debate","ExComm debates air strikes, invasion, and quarantine"],["address","Kennedy announces a naval quarantine on television"],["line","U.S. warships establish an interception line"],["turn","Some Soviet ships slow down or change course"]]},{"id":"bargain","cards":[["offer","Khrushchev offers a missiles-for-non-invasion bargain"],["danger","A Turkey demand and a U-2 shootdown raise the danger"],["accept","Kennedy accepts public terms and privately addresses Turkey"],["remove","Khrushchev orders the Cuban missiles removed"]]}],"chapterOrder":["discovery","quarantine","bargain"],"segues":["U.S. leaders now possess evidence of offensive missiles in Cuba. Their problem is to force removal of the missiles without allowing a local confrontation to grow into nuclear war.","The naval confrontation has eased, but the missiles remain and military forces are still on alert. The crisis now depends on bargaining that gives both governments a path away from escalation."],"principles":[["Evidence changes the policy problem","Leaders cannot debate a response to a hidden deployment until they possess credible information about it."],["Public decisions require operational follow-through","An announced policy and the military action enforcing it are related but distinct events."],["Pressure and bargaining can occur together","Military danger can rise even while private messages search for an acceptable settlement."],["Public and private terms may differ","Diplomatic agreements sometimes combine visible commitments with less visible understandings."]],"hints":["The U-2 photographs provide evidence before Kennedy convenes ExComm to study it.","Kennedy announces the naval quarantine before U.S. warships establish the interception line."],"intro":"Soviet personnel are secretly installing offensive missiles in Cuba while U.S. leaders remain unaware of the details. Sequence A must turn a concealed military development into evidence that can support presidential decision-making.","collection":"Core collection"},{"id":"rocket","icon":"▲","discipline":"Aerospace engineering","title":"Two Stages to Orbit","headline":"Arrange the major events of a representative two-stage launch.","kicker":"Launch control · A payload is bound for low Earth orbit","story":["A two-stage rocket must cross the atmosphere and accelerate a satellite sideways fast enough to remain in orbit.","Reconstruct a representative ascent sequence. Exact timing varies, but the dependencies are broadly shared."],"overview":"A two-stage launch vehicle changes mass, propulsion source, aerodynamic environment, and trajectory during ascent. Hold-down equipment, booster engines, separation hardware, an orbital engine, a payload fairing, and guidance software each have different operating limits. The useful clues are the interlocks that prevent unsafe commands and the measurements that define when hardware is no longer needed.","terms":[["Thrust","The force produced by an engine that pushes the rocket."],["Dynamic pressure","Aerodynamic pressure caused by the combination of air density and speed."],["Max Q","The point of maximum dynamic pressure during ascent."],["MECO","The commanded cutoff of the booster engines."],["Stage separation","The physical release of a spent rocket stage."],["Payload fairing","The protective shell around the payload during atmospheric flight."],["Orbit insertion","Reaching the required position and sideways velocity for the target orbit."]],"note":"Some rockets separate boosters, jettison fairings, or ignite upper stages at different times. This is a simplified representative profile.","sources":"Fact-checked against NASA launch-event timelines and explanations of max Q, MECO, staging, fairing jettison, and orbit insertion.","chapters":[{"id":"atmosphere","cards":[["ignite","The booster engines ignite while the rocket is held down"],["verify","Controllers verify that the engines produce stable thrust"],["liftoff","The rocket leaves the launch pad"],["maxq","The rocket passes through maximum aerodynamic pressure"]]},{"id":"staging","cards":[["fairing","The payload fairing separates in thin air"],["cutoff","The booster engines shut down"],["separate","The empty booster separates from the upper stage"],["upperignite","The upper-stage engine ignites"]]},{"id":"orbit","cards":[["accelerate","The upper stage builds sideways orbital speed"],["target","Guidance reaches the target position and velocity"],["shutdown","The upper-stage engine shuts down"],["deploy","The payload separates from the upper stage"]]}],"chapterOrder":["atmosphere","staging","orbit"],"segues":["The vehicle has survived the strongest atmospheric loading and is climbing into thinner air. Protective hardware becomes unnecessary, while the booster approaches the end of its useful burn.","The heavy booster and protective shell are gone. A lighter upper stage can now devote its propellant to the sideways speed and precise direction required for orbit."],"principles":[["Interlocks prevent unsafe transitions","A major command often requires sensor confirmation that the vehicle is ready."],["The atmosphere changes the rules","Hardware needed in dense air can become useless mass in thin air."],["Empty structure is a burden","Staging improves performance by discarding tanks and engines that can no longer contribute thrust."],["Orbit is mainly about sideways velocity","Altitude alone does not create orbit; guidance must reach the required position, speed, and direction."]],"hints":["Controllers verify stable booster thrust before the rocket is released from the launch pad.","The booster engines shut down before the empty booster separates from the upper stage."],"intro":"The fully fueled rocket is attached to the launch pad with its payload enclosed and its engines inactive. Sequence A must produce controlled thrust, release the vehicle safely, and carry it through the most demanding part of atmospheric flight.","collection":"Core collection"},{"id":"soap","icon":"◉","discipline":"Chemistry","title":"How Soap Carries Grease Away","headline":"Order the molecular events that let water remove oily dirt.","kicker":"Chemistry bench · A greasy surface meets soap and water","story":["Plain water beads around an oily stain instead of lifting it away. Adding soap changes what can happen at the oil-water boundary.","Arrange the molecular and physical events from the original grease film to the final rinse."],"overview":"Grease cleaning is a problem at the boundary between two materials that do not mix well. Soap molecules have chemically different ends, mechanical motion changes the size of oily pieces, and water can carry those pieces only if they remain compatible with the surrounding liquid. The puzzle asks which observed structures require particular physical conditions.","terms":[["Polar","Having an uneven electrical charge distribution; water is strongly polar."],["Nonpolar","Having little charge separation; many oils and greases are nonpolar."],["Surfactant","A molecule that reduces the difficulty of maintaining an oil-water boundary."],["Hydrophilic","Attracted to or compatible with water."],["Hydrophobic","Avoiding water and preferring nonpolar material such as oil."],["Micelle","An organized surfactant structure with oily material inside and water-facing heads outside."],["Dispersion","Small particles or droplets spread throughout a liquid instead of forming one separate layer."]],"note":"This is a simplified surfactant-cleaning pathway. Real detergents may contain builders, enzymes, solvents, and other ingredients.","sources":"Based on standard introductory surfactant and micelle chemistry.","chapters":[{"id":"boundary","cards":[["bead","Water beads around the grease film"],["spread","Soap molecules spread through the wash water"],["tails","Oil-loving soap tails enter the grease"],["heads","Water-loving soap heads remain in the water"]]},{"id":"droplets","cards":[["rub","Rubbing breaks the grease into small droplets"],["cover","Soap molecules cover the new droplet surfaces"],["inward","Soap tails point inward around the oil"],["outward","Soap heads point outward toward the water"]]},{"id":"remove","cards":[["resist","Coated grease droplets resist merging"],["disperse","The grease remains dispersed through the wash water"],["flow","Fresh water flows across the cleaned surface"],["rinse","The rinse carries the coated grease away"]]}],"chapterOrder":["boundary","droplets","remove"],"segues":["Soap now lines the boundary between grease and water. That molecular layer weakens the film’s attachment and allows mechanical motion to divide it into much smaller pieces.","The grease is now packaged inside coatings that are compatible with water. The remaining challenge is to keep those droplets separated long enough for flowing water to remove them."],"principles":[["Soap has two chemically different ends","One part interacts well with water while the other interacts well with grease."],["Boundaries matter","Soap molecules become useful when they organize at the interface between oil and water."],["Mechanical motion creates new surface","Breaking a film into droplets increases the area that soap molecules must cover."],["Removal requires stability and flow","Grease must remain dispersed instead of recombining, and moving water must carry it away."]],"hints":["Soap molecules spread through the wash water before their oil-loving tails enter the grease.","Rubbing creates small grease droplets before soap molecules can cover the newly created droplet surfaces."],"intro":"A greasy film is attached to a surface, and plain water remains separated from it. Sequence A must create a molecular connection between the water and the grease without assuming that the grease has already broken into droplets.","collection":"Core collection"},{"id":"lake","icon":"≈","discipline":"Ecology","title":"From Fertilizer to a Dead Zone","headline":"Reconstruct the oxygen-depletion pathway of eutrophication.","kicker":"Watershed investigation · Heavy rain follows fertilizer application","story":["A lake near agricultural fields turns green, and fish begin gathering near the surface while some die.","Arrange the physical, chemical, and biological states that connect fertilizer compounds on land with oxygen stress in the lake."],"overview":"Nutrient pollution connects land use with the chemistry and biology of a lake. Fertilizer compounds can support biological growth, dense organisms can alter the underwater light field, dead material can feed microbes, and microbial respiration can change the oxygen available to animals. The important distinction is between a resource, the organism using it, and the environmental condition produced by metabolism.","terms":[["Watershed","The land area whose water drains into the same lake or stream."],["Nitrate and phosphate","Nutrients containing nitrogen and phosphorus that can fertilize algal growth."],["Chlorophyll","The pigment used in photosynthesis and a useful indicator of algal biomass."],["Biomass","The total amount of living biological material."],["Decomposer","An organism, often a microbe, that breaks down dead organic matter."],["Dissolved oxygen","Oxygen mixed into water and available for aquatic respiration."],["Hypoxia","A condition in which dissolved oxygen is too low for many animals."]],"note":"Blooms can also cause toxins and other harms. This game follows the oxygen-depletion pathway.","sources":"Fact-checked against U.S. EPA explanations of nutrient pollution, blooms, decomposition, hypoxia, and fish kills.","chapters":[{"id":"growth","cards":[["wash","Rain washes nitrate and phosphate from fertilized fields"],["enter","Nutrients enter the lake through tributaries"],["reproduce","Algae use the nutrients to reproduce rapidly"],["bloom","A dense green bloom fills the sunlit water"]]},{"id":"organic","cards":[["shade","Less sunlight reaches submerged plants"],["decline","Submerged plants lose photosynthetic production"],["sink","Dead algae and plant tissue sink"],["collect","Organic matter accumulates near the lake bottom"]]},{"id":"oxygen","cards":[["bacteria","Bacteria consume the dead organic matter"],["respire","Microbial respiration uses dissolved oxygen"],["hypoxia","Deep water becomes dangerously low in oxygen"],["animals","Fish and bottom-dwelling animals flee or die"]]}],"chapterOrder":["growth","organic","oxygen"],"segues":["The surface population is now large enough to change the physical environment beneath it. By intercepting sunlight, the bloom affects plants that are not part of the surface population.","The lake now contains a large supply of dead biological material. Microbes can use that material as food, and their respiration changes the amount of oxygen available to aquatic animals."],"principles":[["Nutrients are resources, not poisons by themselves","The major chain begins because nitrogen and phosphorus support rapid biological growth."],["One population can change another population’s environment","A dense surface population can alter the light available deeper in the water."],["Dead matter is food for decomposers","Organic material stores chemical energy that microbes can use."],["Respiration changes water chemistry","Microbes consuming organic matter also consume dissolved oxygen needed by animals."]],"hints":["Nutrients enter the lake through tributaries before algae use those nutrients to reproduce rapidly.","Bacteria consume the dead organic matter before microbial respiration drives dissolved oxygen dangerously low."],"intro":"Fertilizer has been applied on land within the lake’s watershed, but the lake has not yet experienced a bloom. Sequence A must connect land runoff with unusually rapid biological growth in the sunlit water.","collection":"Core collection"},{"id":"tsunami","icon":"≋","discipline":"Earth science","title":"From Locked Fault to Coastal Flood","headline":"Follow the physical formation of an earthquake-generated tsunami.","kicker":"Subduction-zone observatory · A long offshore rupture begins","story":["Two tectonic plates have been locked offshore while stress accumulated. When the fault ruptures, it may disturb the ocean above it.","Arrange the physical sequence from stored tectonic stress to coastal inundation."],"overview":"A tsunami is not simply an earthquake wave in water. The relevant system includes a deforming plate boundary, the geometry of seafloor motion, the ocean surface, long-wave propagation, changing water depth, and the coastal landscape. The puzzle asks which physical state supplies the disturbance measured in a different part of the system.","terms":[["Subduction zone","A boundary where one tectonic plate descends beneath a different plate."],["Locked fault","A fault held by friction while surrounding rock continues to deform."],["Elastic strain","Stored deformation that can be released when rock slips."],["Seafloor displacement","A change in the elevation or position of the ocean bottom."],["Wavelength","The distance between corresponding points on successive waves."],["Shoaling","The transformation of a wave as it enters shallower water."],["Run-up","The maximum inland or uphill reach of tsunami water."]],"note":"Not every undersea earthquake produces a tsunami. Broad vertical displacement of the seafloor is especially important.","sources":"Fact-checked against NOAA explanations of earthquake-generated tsunamis, deep-ocean propagation, shoaling, and inundation.","chapters":[{"id":"source","cards":[["strain","A locked plate boundary stores elastic strain"],["rupture","The fault ruptures in an undersea earthquake"],["bottom","A broad area of seafloor rises and falls"],["water","The seafloor movement displaces the water above it"]]},{"id":"travel","cards":[["spread","Long wave fronts spread away from the source"],["cross","The tsunami crosses deep ocean rapidly"],["low","The offshore wave height remains modest"],["shelf","The waves reach the shallower continental margin"]]},{"id":"coast","cards":[["slow","The wave slows near the coast"],["grow","The wavelength shortens and the water height grows"],["current","Strong currents reach the shoreline"],["flood","Tsunami run-up floods inland areas"]]}],"chapterOrder":["source","travel","coast"],"segues":["The sea surface is now broadly raised and lowered above the earthquake source. Gravity turns that displaced water into long waves that can carry energy across an ocean basin.","The wave energy is now entering progressively shallower water. Less depth changes the wave’s speed and shape, concentrating its visible effects near the coast."],"principles":[["An earthquake is not enough by itself","A large tsunami requires broad displacement of the water, often from vertical seafloor motion."],["Trace the transfer of energy","Stored deformation moves the crust, the crust moves water, and gravity turns the displaced water into waves."],["Deep water hides the danger","A tsunami can move rapidly offshore while its surface height remains modest."],["Water depth transforms the wave","Approaching shallow water changes speed, wavelength, height, and current strength."]],"hints":["The fault ruptures before a broad area of seafloor rises and falls.","The waves reach the shallow continental margin before the wave slows near the coast."],"intro":"A section of an offshore plate boundary is locked by friction while tectonic motion continues to deform the surrounding rock. Sequence A must convert stored deformation into a broad disturbance of the ocean.","collection":"Core collection"},{"id":"payment","icon":"$","discipline":"Finance & payment systems","title":"What Happens After You Tap","headline":"Trace a card purchase from authorization to merchant payment.","kicker":"Coffee shop checkout · A customer taps a card","story":["The terminal displays Approved almost immediately, but the merchant has not yet received final funds.","Arrange the simplified four-party pathway from the tap to clearing and settlement."],"overview":"A card payment is both a communications problem and an accounting problem. The terminal, merchant processor, card network, issuing bank, acquiring bank, and merchant account hold different information and authority. A message saying “approved” is not the same thing as a reconciled obligation or transferred money.","terms":[["Merchant","The business accepting the card payment."],["Acquirer","The bank or processor serving the merchant side of the transaction."],["Issuer","The bank that issued the customer’s card and maintains the account."],["Card network","The system routing messages between the acquiring and issuing sides."],["Authorization","The issuer’s rapid approval or decline decision."],["Capture","The merchant’s submission of an approved sale for financial processing."],["Clearing","The reconciliation and calculation of what participants owe."],["Settlement","The actual transfer of funds between institutions."]],"note":"Messaging, timing, fees, and posting vary by network and country. This game distinguishes rapid authorization from clearing, settlement, and merchant funding.","sources":"Fact-checked against Federal Reserve descriptions of authorization, clearing, and settlement.","chapters":[{"id":"authorize","cards":[["read","The terminal reads the card credential and purchase amount"],["package","The acquirer packages an authorization request"],["route","The card network routes the request to the issuer"],["check","The issuer checks the account and fraud signals"]]},{"id":"capture","cards":[["decision","The issuer creates an approval or decline code"],["return","The network returns the decision to the terminal"],["complete","The merchant completes the approved sale"],["batch","The processor captures the sale in a batch"]]},{"id":"fund","cards":[["records","The institutions exchange detailed transaction records"],["clear","Clearing calculates the net obligations"],["settle","Settlement transfers funds between banks"],["credit","The acquirer credits the merchant account"]]}],"chapterOrder":["authorize","capture","fund"],"segues":["The institution responsible for the customer’s card now has the information needed to make a permission decision. That decision must travel back to the merchant so checkout can be completed.","The purchase now has both permission and a completed sale record, but no final merchant funding. The participating institutions must reconcile the records, calculate obligations, and move money."],"principles":[["Permission is not payment","An authorization message can approve a purchase even though money has not yet reached the merchant."],["Different institutions hold different information","The issuer knows the cardholder account, while the acquiring side serves the merchant."],["A completed sale must enter financial processing","The system needs a final record of what the merchant intends to collect."],["Accounting precedes movement of funds","Participants calculate obligations before banks transfer money and credit the merchant."]],"hints":["The card network routes the request to the issuer before the issuer checks the account and fraud signals.","Clearing calculates the net obligations before settlement transfers funds between banks."],"intro":"A customer presents a card at the terminal, but the merchant has neither permission to complete the sale nor any transferred funds. Sequence A must carry the purchase information to the institution able to make the authorization decision.","collection":"Core collection"},{"id":"infrared","icon":"IR","discipline":"Electro-optics & sensors","title":"Seeing Heat","headline":"Reconstruct how an infrared camera turns invisible thermal radiation into a calibrated image.","kicker":"Night surveillance laboratory · A warm object is present beyond visible-light range","story":["A camera is pointed toward a dark coastal scene. Ordinary visible-light contrast is poor, but objects and the environment emit and reflect infrared radiation.","Arrange the optical, electronic, and computational operations that turn that radiation into a useful image."],"principles":[["Radiation carries information","Objects emit infrared radiation according to temperature, surface properties, and wavelength. The camera measures radiation, not temperature directly."],["Optics map direction to position","A lens or mirror system sends radiation arriving from different directions to different detector pixels."],["Detectors need electronics","Absorbed infrared energy creates a small electrical response that must be read, amplified, and digitized."],["Calibration is part of measurement","Pixels respond differently and the camera itself emits heat. Useful imagery requires corrections before contrast or temperature is interpreted."]],"terms":[["Infrared radiation","Electromagnetic radiation with wavelengths longer than visible red light."],["Spectral band","A selected range of wavelengths admitted by the optics and detector."],["Focal plane array","A grid of detector pixels located where the optics form the image."],["Cryogenic cooling","Cooling a detector to reduce thermal noise and unwanted self-emission."],["Readout integrated circuit","Electronics connected to detector pixels that collect and transfer their signals."],["Analog-to-digital converter","A circuit that converts a continuously varying electrical signal into numerical samples."],["Nonuniformity correction","A calibration that compensates for unequal pixel offsets and sensitivities."],["Dynamic range","The span between the weakest and strongest signals an instrument can usefully measure."]],"note":"Infrared cameras use several detector materials, wavelength bands, cooling approaches, and processing architectures. This game represents a cooled thermal-infrared imaging chain.","sources":"Technical concepts checked against NASA descriptions of thermal-infrared focal-plane arrays and detector/readout systems; ONR alignment comes from electro-optics, infrared sensing, electronics, and C5ISRT research.","chapters":[{"id":"collect","cards":[["emit","A warm object emits infrared radiation"],["window","The camera window admits the selected infrared band"],["focus","The optics focus each viewing direction onto the focal plane"],["absorb","Detector pixels absorb the focused infrared energy"]]},{"id":"convert","cards":[["response","Absorbed energy changes each pixel’s electrical signal"],["readout","The readout circuit measures the pixel signals"],["amplify","Low-noise electronics amplify the analog data"],["digitize","The converter turns the signals into numerical pixel values"]]},{"id":"image","cards":[["reference","Calibration references estimate pixel offset and sensitivity"],["correct","Processing corrects unequal and defective pixels"],["contrast","Image mapping reveals meaningful thermal contrast"],["track","Detection software identifies and tracks an object"]]}],"chapterOrder":["collect","convert","image"],"intro":"The scene exists only as infrared radiation arriving from many directions. Sequence A must show how an optical instrument selects that radiation and maps the scene onto individual sensing elements.","segues":["The detector array now contains a spatial pattern of extremely small physical responses. Those responses are not yet a digital image; receiver electronics must preserve and measure them without allowing noise to dominate.","The camera now has an array of numbers, but raw detector values include unequal pixel behavior and instrument effects. Calibration and image processing are required before an operator or algorithm can interpret the scene."],"hints":["The camera window admits the selected infrared wavelengths before the optics focus them onto the focal plane.","The readout circuit measures the pixel signals before the analog-to-digital converter creates numerical values."],"collection":"ONR collection"},{"id":"ins","icon":"INS","discipline":"Precision navigation & estimation","title":"Finding Position Without GPS","headline":"Reconstruct how an inertial navigation system measures motion, computes a path, and controls accumulating drift.","kicker":"Submerged-navigation laboratory · Satellite signals are unavailable","story":["A vehicle knows its starting position and orientation, then enters an environment where GPS cannot be used continuously.","Arrange how accelerometers, gyroscopes, coordinate calculations, integration, and external corrections produce a usable navigation solution."],"principles":[["Motion sensors do not measure position directly","Gyroscopes measure rotation rate and accelerometers measure specific force. Position must be calculated from these measurements."],["Orientation controls interpretation","The same sensor reading means something different when the vehicle has rotated. Measurements must be transformed into a fixed navigation frame."],["Integration magnifies small errors","A tiny bias in acceleration can create growing velocity and position errors when integrated over time."],["Corrections should include uncertainty","A navigation filter weighs the inertial prediction and an external observation according to how uncertain each one is."]],"terms":[["Inertial measurement unit","A package containing accelerometers and gyroscopes along several axes."],["Accelerometer","A sensor that measures specific force along an axis."],["Gyroscope","A sensor that measures angular rotation rate."],["Attitude","The vehicle’s orientation relative to a reference frame."],["Navigation frame","A coordinate system tied to Earth or the local environment."],["Bias","A persistent sensor offset that causes accumulating error."],["Integration","A mathematical operation that accumulates a rate or acceleration over time."],["Kalman filter","An estimation method that combines predictions and measurements while tracking uncertainty."]],"note":"Real systems include Earth rotation, curved-Earth coordinates, lever-arm effects, detailed calibration, several external aiding sources, and complex filter architectures.","sources":"Technical concepts checked against NIST descriptions of accelerometers, gyroscopes, and precision navigation without GPS; ONR supports precision navigation, timing, mathematical estimation, and autonomous systems.","chapters":[{"id":"measure","cards":[["align","The system establishes its starting position and orientation"],["gyro","Gyroscopes measure the vehicle’s rotation rates"],["accel","Accelerometers measure specific force along three axes"],["sample","Electronics time-stamp and calibrate the sensor samples"]]},{"id":"compute","cards":[["attitude","Gyroscope data updates the estimated orientation"],["transform","Orientation rotates acceleration into navigation coordinates"],["gravity","The calculation removes the expected effect of gravity"],["integrate","The system integrates acceleration into velocity and position"]]},{"id":"correct","cards":[["drift","Sensor errors make the inertial position drift"],["observe","An external aid supplies a position or velocity observation"],["compare","The filter compares the observation with its prediction"],["update","The corrected state and uncertainty replace the drifting estimate"]]}],"chapterOrder":["measure","compute","correct"],"intro":"The vehicle begins with a known starting state but cannot obtain continuous satellite fixes. Sequence A must create synchronized measurements of translation and rotation that can support later navigation calculations.","segues":["The system now has calibrated motion measurements expressed in the sensor’s moving axes. The next sequence must determine orientation, transform the measurements into a stable coordinate system, and accumulate them into a path.","The navigation computer now produces position and velocity continuously, but even excellent sensors contain tiny errors. The next sequence uses an independent observation to detect and reduce the resulting drift."],"hints":["Gyroscope data updates the estimated orientation before acceleration can be rotated into navigation coordinates.","The external observation is compared with the inertial prediction before the filter updates the navigation state."],"collection":"ONR collection"},{"id":"ctd","icon":"CTD","discipline":"Oceanography & instrumentation","title":"Reading the Water Column","headline":"Reconstruct how a CTD profiler measures seawater and turns sensor data into an environmental profile.","kicker":"Research vessel · An instrument package is ready for an ocean cast","story":["Scientists need to know how temperature, salinity, density, and sound speed change from the surface to depth.","Arrange the instrument sampling, physical-property calculations, and quality-control steps that create a useful water-column profile."],"principles":[["The instrument measures proxies","A CTD measures electrical conductivity, temperature, and pressure; salinity and density are calculated from those observations."],["Measurements must describe the same water","Sensor placement, water flow, and response time matter because the package moves through gradients."],["Pressure is used for depth","Water pressure increases with depth, so a calibrated pressure sensor provides the vertical coordinate."],["Profiles support other models","The final variables influence currents, water-mass identification, buoyancy, and the speed and path of underwater sound."]],"terms":[["CTD","An instrument package measuring conductivity, temperature, and depth derived from pressure."],["Conductivity cell","A sensor that measures how readily seawater carries electrical current."],["Salinity","The concentration of dissolved salts, calculated from conductivity, temperature, and pressure."],["Pressure sensor","A device measuring the force per area exerted by the water column."],["Pump","A component that moves a controlled flow of seawater through sensors."],["Sensor lag","Delay between a change in the water and the full response of a sensor."],["Density","Mass per unit volume, controlled strongly by temperature, salinity, and pressure."],["Sound-speed profile","The change of acoustic wave speed with depth."]],"note":"Operational CTD packages may carry oxygen, fluorescence, optical, and chemical sensors and may collect water bottles. Detailed processing includes alignment, filtering, hysteresis, and ship-motion corrections.","sources":"Technical concepts checked against NOAA Ocean Exploration descriptions of CTD instruments and profiles; ONR Code 32 supports ocean observation, environmental prediction, and ocean acoustics.","chapters":[{"id":"sample","cards":[["lower","The ship lowers the CTD package through the water column"],["pump","A pump draws seawater through the sensor path"],["conduct","The conductivity cell measures the water’s electrical response"],["tempdepth","Temperature and pressure sensors measure the same sample"]]},{"id":"derive","cards":[["sync","Electronics align the measurements by time and depth"],["calibrate","Laboratory calibrations correct sensor response"],["salinity","Conductivity, temperature, and pressure determine salinity"],["properties","Salinity, temperature, and pressure determine density and sound speed"]]},{"id":"profile","cards":[["screen","Quality checks remove unstable or contaminated samples"],["bin","Measurements are averaged into depth intervals"],["interpret","Scientists identify layers, fronts, and water masses"],["model","The profile enters ocean and acoustic prediction models"]]}],"chapterOrder":["sample","derive","profile"],"intro":"The instrument hangs above the sea with calibrated sensors but no observations from the water column. Sequence A must place the package in the ocean and ensure that several sensors characterize a common parcel of water.","segues":["The instrument now has synchronized electrical and pressure observations, not direct measurements of every desired ocean property. The next sequence applies calibration and seawater relationships to derive salinity, density, and sound speed.","The derived values still contain samples affected by startup, flow disruption, or noise. The next sequence converts a raw cast into a depth-organized environmental product suitable for scientific and operational use."],"hints":["The pump draws seawater through the sensor path before the conductivity cell can characterize that flowing sample.","Calibration corrections are applied before conductivity, temperature, and pressure are used to calculate salinity."],"collection":"ONR collection"},{"id":"power","icon":"MW","discipline":"Naval power & controls","title":"Holding the Electrical Bus","headline":"Reconstruct how a ship responds when a major electrical load suddenly demands power.","kicker":"Integrated power-system laboratory · A high-demand load is commanded on","story":["A ship’s generators already support propulsion, sensors, computing, cooling, and hotel loads. A large additional load is requested.","Arrange how generation, energy storage, protection, and supervisory controls keep the electrical system stable."],"principles":[["Generation and consumption must balance","A sudden mismatch changes voltage, frequency, or stored energy in the electrical bus."],["Fast and slow resources play different roles","Storage and power electronics can react quickly while engines and generators take longer to increase output."],["Power quality protects every load","Supplying one demanding system must not produce unacceptable voltage or frequency for the rest of the ship."],["Control includes priorities","A resilient system can delay, reduce, or disconnect lower-priority loads when available power is limited."]],"terms":[["Electrical bus","The shared conductors and equipment through which power is distributed."],["Generator","A machine converting mechanical rotation into electrical energy."],["Power converter","Electronics that regulate or transform voltage, current, or frequency."],["Transient","A short-lived change as a system moves from one operating state to another."],["Energy storage","A battery, capacitor, flywheel, or other device that can absorb and release energy."],["Load shedding","Disconnecting selected electrical demand to protect system stability."],["Power quality","How closely voltage, frequency, and waveform remain within acceptable limits."],["Supervisory control","Higher-level software coordinating generators, storage, converters, and loads."]],"note":"Naval architectures may use AC, DC, or hybrid distribution; several generators and storage devices; zonal protection; and specialized pulsed loads. This is a representative control sequence.","sources":"Aligned with ONR Power and Energy programs covering integrated power systems, energy storage, power electronics, transient control, stability, reliability, and resilient distribution.","chapters":[{"id":"supply","cards":[["fuel","An engine converts fuel energy into shaft rotation"],["generator","The generator converts shaft rotation into electrical power"],["converter","Power electronics regulate the generated electricity"],["bus","The distribution bus supplies the ship’s operating loads"]]},{"id":"transient","cards":[["request","A major load requests a rapid increase in power"],["imbalance","Demand briefly exceeds the power supplied by generators"],["storage","Energy storage releases power into the bus"],["ramp","Generator controls increase sustained power output"]]},{"id":"stabilize","cards":[["monitor","Sensors verify voltage, current, and frequency throughout the system"],["prioritize","Supervisory control adjusts lower-priority loads if necessary"],["reroute","Distribution controls route power around unavailable equipment"],["balance","Generation, storage, and demand settle into a stable balance"]]}],"chapterOrder":["supply","transient","stabilize"],"intro":"The ship is operating normally with several loads sharing an energized distribution system. Sequence A must establish how stored chemical energy becomes controlled electrical power available on that shared bus.","segues":["The ship now has regulated power supporting its existing equipment. The next sequence begins when a major load changes demand more quickly than the rotating generators can immediately respond.","The fast disturbance has been contained, but the system must verify that all zones remain within limits and establish a sustainable configuration rather than relying indefinitely on temporary energy storage."],"hints":["The generator converts shaft rotation into electrical power before power electronics regulate that electricity.","Energy storage supports the bus during the transient before generator controls complete the slower increase in sustained output."],"collection":"ONR collection"},{"id":"corrosion","icon":"Fe","discipline":"Materials science & sustainment","title":"Stopping the Sea from Eating Steel","headline":"Reconstruct how seawater corrosion begins, becomes structural damage, and is controlled.","kicker":"Marine-structures laboratory · A protective coating has been damaged","story":["A steel structure spends years in conductive seawater while experiencing stress and repeated loading.","Arrange the electrochemical reactions, growth of localized damage, and maintenance actions that preserve structural reliability."],"principles":[["Corrosion is an electrical-chemical circuit","Oxidation and reduction occur at different locations while electrons travel through metal and ions travel through the electrolyte."],["Seawater closes the circuit","Dissolved salts make seawater conductive enough to support electrochemical reactions."],["Localized damage is especially dangerous","A small pit can concentrate stress and become a starting point for fatigue cracking."],["Protection interrupts one part of the system","Coatings block contact, cathodic protection changes electrical potential, and inspection catches failure before it grows."]],"terms":[["Oxidation","A reaction in which an atom loses electrons."],["Reduction","A reaction in which a chemical species gains or consumes electrons."],["Anode","The region where metal oxidation occurs."],["Cathode","The region where a reduction reaction consumes electrons."],["Electrolyte","A conductive liquid containing mobile ions, such as seawater."],["Pitting corrosion","Highly localized corrosion that creates deep cavities."],["Cathodic protection","Supplying electrons or controlling potential so the protected metal is less likely to oxidize."],["Fatigue crack","A crack that grows under repeated loading cycles."]],"note":"Marine corrosion involves many alloys, coatings, galvanic couples, microorganisms, oxygen gradients, flow conditions, and inspection methods. This game emphasizes pitting beneath coating damage.","sources":"Aligned with ONR programs in corrosion science and control, coatings, structural reliability, non-destructive evaluation, prognostics, and materials for marine environments.","chapters":[{"id":"cell","cards":[["damage","A scratch exposes steel beneath the protective coating"],["wet","Conductive seawater contacts the exposed metal"],["oxidize","Iron atoms lose electrons at an anodic region"],["reduce","A cathodic reaction consumes the electrons elsewhere"]]},{"id":"degrade","cards":[["products","Dissolved iron forms corrosion products"],["pit","Metal loss deepens into a localized pit"],["stress","The pit concentrates mechanical stress"],["crack","Repeated loading starts and grows a fatigue crack"]]},{"id":"protect","cards":[["inspect","Inspection locates coating failure and material loss"],["prepare","Damaged material is cleaned and the surface is prepared"],["coat","A repaired barrier coating isolates the steel from seawater"],["cathodic","Cathodic protection is checked to maintain protective potential"]]}],"chapterOrder":["cell","degrade","protect"],"intro":"Most of the steel is covered, but a small defect has exposed bare metal to seawater. Sequence A must establish a complete electrochemical path rather than treating rust as a simple reaction between iron and water.","segues":["The coupled electrochemical reactions are now removing metal atoms from a localized region. The next sequence shows how microscopic material loss can become a mechanical threat under repeated loading.","The structure now contains detectable damage with implications for strength and remaining life. The next sequence combines inspection, surface restoration, and electrical protection to interrupt further degradation."],"hints":["Seawater contacts the exposed steel before iron atoms can participate in the sustained corrosion cell.","A localized pit concentrates stress before repeated loading grows a fatigue crack from that region."],"collection":"ONR collection"},{"id":"swarm","icon":"Σ","discipline":"Autonomy & multi-agent systems","title":"Many Robots, One Search","headline":"Reconstruct how a team of autonomous vehicles divides work, shares evidence, and adapts when the mission changes.","kicker":"Maritime-autonomy test range · Several unmanned vehicles receive one search objective","story":["No single vehicle has complete sensor coverage, unlimited energy, or continuous communication with every teammate.","Arrange how a distributed team allocates tasks, builds a shared picture, and reorganizes after a new contact or vehicle failure."],"principles":[["Central control may be unavailable","Vehicles need local rules that still produce useful group behavior when communication is delayed or lost."],["Task allocation is an optimization problem","A good assignment considers distance, energy, sensor capability, risk, and duplication."],["Shared maps contain uncertainty","Reports from different vehicles may overlap, disagree, or describe a changing environment."],["Robust teams replan","The mission should continue when evidence changes, links fail, or a vehicle becomes unavailable."]],"terms":[["Multi-agent system","A group of autonomous decision-making vehicles or software agents."],["Task allocation","Assigning mission responsibilities among team members."],["Consensus","A process through which agents bring estimates or decisions toward agreement."],["Local observation","Information available directly to one vehicle’s sensors."],["Data association","Determining whether separate observations refer to the same object."],["Uncertainty","A numerical or qualitative description of what the system does not know."],["Replanning","Updating routes or assignments in response to new information."],["Fault tolerance","Continuing useful operation despite component, vehicle, or communication failures."]],"note":"Real swarms use diverse architectures, communication protocols, safety constraints, vehicle types, and levels of human supervision. This game uses a distributed search-and-map mission.","sources":"Aligned with ONR Science of Autonomy and Cooperative Autonomous Swarm Technology interests in unmanned maritime cooperation, perception, control, decision-making, reliability, and human-autonomy interaction.","chapters":[{"id":"allocate","cards":[["map","The team divides the search region into candidate tasks"],["cost","Each vehicle estimates travel, energy, and sensing cost"],["bid","Vehicles exchange compact task bids"],["assign","The team assigns nonduplicated search areas"]]},{"id":"share","cards":[["sense","Each vehicle gathers local observations"],["summarize","Onboard processing compresses the useful evidence"],["exchange","Available links carry summaries between teammates"],["fuse","The team associates observations and updates a shared map"]]},{"id":"adapt","cards":[["change","A new contact or vehicle failure changes mission value"],["reevaluate","Vehicles recalculate the remaining task costs"],["redistribute","The team redistributes routes and responsibilities"],["complete","The surviving vehicles finish the highest-value coverage"]]}],"chapterOrder":["allocate","share","adapt"],"intro":"The vehicles begin with a common mission objective but no detailed assignment of who should search each area. Sequence A must transform capabilities and costs into a division of labor that avoids wasteful duplication.","segues":["The vehicles now have separate responsibilities, but each one sees only a fraction of the environment. The next sequence turns local sensor observations into a shared operational picture despite limited links.","The team now has a fused map and an active plan, but neither is permanent. The next sequence responds to evidence or failures that change which tasks are most valuable and which vehicles can perform them."],"hints":["Vehicles estimate the cost of candidate tasks before they exchange bids for those tasks.","Onboard processing compresses local evidence before limited communication links carry the summaries to teammates."],"collection":"ONR collection"},{"id":"cyber","icon":"CY","discipline":"Cybersecurity & resilient computing","title":"Detect, Isolate, Recover","headline":"Reconstruct how a shipboard computing system responds to a suspected compromise without abandoning essential functions.","kicker":"Resilient-systems exercise · Monitoring detects behavior outside the approved baseline","story":["A networked service begins making requests that are unusual for its role. An immediate shutdown could disrupt operations, but ignoring the behavior could allow the compromise to spread.","Arrange the preparation, evidence-based containment, and trusted recovery process."],"principles":[["Detection needs a reference","Abnormal behavior is easier to recognize when approved software, configurations, identities, and traffic patterns are known."],["One alert is not always proof","Analysts and automated systems gain confidence by correlating evidence from several sources."],["Containment preserves options","Isolation should limit spread while maintaining essential services through trusted alternatives when possible."],["Recovery must restore trust","Restarting a compromised machine is not enough; vulnerable components, credentials, and persistence mechanisms must be addressed."]],"terms":[["Asset inventory","A record of approved devices, software, versions, and responsibilities."],["Telemetry","Logs and measurements describing system behavior."],["Baseline","A description of expected configuration or activity."],["Indicator of compromise","Evidence suggesting unauthorized access or malicious activity."],["Segmentation","Dividing a network so access between regions can be controlled."],["Credential","Information or cryptographic material used to prove identity."],["Trusted image","A verified software installation used to rebuild a system."],["Persistence","A method allowing malicious access to survive restarts or routine changes."]],"note":"Incident response varies with mission, classification, architecture, authority, and evidence. This educational sequence emphasizes preparation, corroborated detection, containment, eradication, restoration, and monitoring.","sources":"Aligned with ONR C5ISRT interests in cybersecurity, information assurance, resilient computing, communications, and decision-making under contested conditions; terminology is consistent with NIST incident-response concepts.","chapters":[{"id":"prepare","cards":[["inventory","Administrators record approved devices and software"],["identity","Users and services authenticate with controlled credentials"],["telemetry","Systems collect logs and network telemetry"],["baseline","Monitoring establishes expected patterns of behavior"]]},{"id":"contain","cards":[["anomaly","A process performs activity outside its normal role"],["correlate","Multiple observations raise confidence in a compromise"],["isolate","Defenders isolate the affected service or network segment"],["fallback","Essential functions move to a trusted backup path"]]},{"id":"recover","cards":[["scope","Investigators determine the affected accounts and systems"],["eradicate","Vulnerable software, persistence, and credentials are replaced"],["restore","Trusted components and verified data rebuild the service"],["monitor","Heightened monitoring confirms safe reconnection"]]}],"chapterOrder":["prepare","contain","recover"],"intro":"The system is still operating normally. Sequence A must create the identities, records, and behavioral evidence that will make a later compromise detectable and diagnosable.","segues":["The defenders now possess a reference for normal operation and a continuous stream of observations. The next sequence begins when behavior deviates from that reference and m

ust be contained without unnecessary mission loss.","The immediate spread has been limited and essential functions have an alternative path. The next sequence determines the true scope, removes the mechanism of compromise, and restores service from components that can be trusted."],"hints":["Systems collect logs and telemetry before monitoring can establish a meaningful behavioral baseline.","Several observations raise confidence in a compromise before defenders isolate the affected service."],"collection":"ONR collection"},{"id":"heat","icon":"°C","discipline":"Human performance & physiology","title":"Heat on the Flight Deck","headline":"Reconstruct how environmental heat and exertion become physiological strain—and how the risk is reversed.","kicker":"Human-performance laboratory · Hot weather, heavy work, and protective equipment","story":["A sailor performs demanding work in sun, heat, humidity, and protective clothing. The body must move internally generated and environmental heat to the surroundings.","Arrange the thermoregulatory response, the development of dangerous strain, and the intervention that restores safety."],"principles":[["Heat balance controls core temperature","The body stores heat when metabolic and environmental gains exceed losses through evaporation, radiation, convection, and conduction."],["Sweating only cools when it evaporates","Sweat that drips away or remains trapped under clothing removes much less heat."],["Circulation serves competing needs","More blood near the skin supports cooling, while working muscles and blood pressure also require circulation."],["Performance can decline before collapse","Dehydration and rising core temperature can impair attention, judgment, coordination, and work capacity."]],"terms":[["Metabolic heat","Heat produced by muscles and other tissues during activity."],["Core temperature","The temperature of deep body tissues and organs."],["Skin blood flow","Circulation near the body surface that transfers internal heat outward."],["Evaporation","The phase change of liquid sweat into vapor, which removes heat."],["Dehydration","Loss of body water that is not adequately replaced."],["Cardiovascular strain","Increased effort by the heart and circulation to support cooling and activity."],["Acclimatization","Physiological adaptation produced by repeated controlled heat exposure."],["Heat stroke","A medical emergency involving severe hyperthermia and central nervous system dysfunction."]],"note":"Individual risk depends on workload, clothing, humidity, radiant heat, acclimatization, hydration, health, medication, and recovery. Suspected heat stroke requires immediate emergency cooling and medical response.","sources":"Technical concepts checked against CDC/NIOSH heat-stress guidance; ONR Warfighter Performance research covers physiology, cognition, resilience, monitoring, training, and human effectiveness.","chapters":[{"id":"compensate","cards":[["gain","Muscle work and the environment add heat to the body"],["skin","Skin blood flow increases to move heat outward"],["sweat","Sweat glands release fluid onto the skin"],["evaporate","Evaporation carries heat into the surrounding air"]]},{"id":"strain","cards":[["lose","Continued sweating reduces body water"],["volume","Lower circulating volume makes cooling harder"],["heart","Heart rate rises to maintain skin and muscle blood flow"],["impair","Core temperature and performance begin to deteriorate"]]},{"id":"recover","cards":[["recognize","Monitoring or symptoms trigger a heat-stress response"],["stop","Work and environmental exposure are reduced"],["cool","Active cooling removes stored body heat"],["replace","Fluid replacement and recovery restore physiological stability"]]}],"chapterOrder":["compensate","strain","recover"],"intro":"The sailor begins work with a normal core temperature while the environment, clothing, and muscles create a growing heat load. Sequence A must show the body’s main mechanisms for moving that heat toward the environment.","segues":["The cooling response is active, but it consumes water and demands substantial circulation. If heat exposure and work continue, the same protective mechanisms can contribute to dehydration and cardiovascular strain.","The sailor now shows physiological or performance evidence that compensation is failing. The next sequence must reduce heat gain, remove stored heat, replace losses, and verify recovery rather than simply encouraging continued effort."],"hints":["Skin blood flow increases before sweating and evaporation can remove large amounts of internal heat at the surface.","Continued sweating reduces body water before reduced circulating volume raises cardiovascular strain."],"collection":"ONR collection"},{"id":"assimilation","icon":"4D","discipline":"Ocean prediction & applied mathematics","title":"From Ocean Sensor to Better Forecast","headline":"Reconstruct how observations and a numerical model are combined to estimate and predict the ocean.","kicker":"Fleet oceanography center · A glider crosses an evolving front","story":["A numerical ocean model predicts temperature, salinity, currents, and sea level, but its state is imperfect. New observations arrive from the ocean with their own errors and limited coverage.","Arrange how observations are checked, compared with a model, assimilated, and used to evaluate the resulting forecast."],"principles":[["Neither model nor observation is perfect","A model is spatially complete but approximate; an observation is more direct but sparse and noisy."],["Location and time are essential","A measurement can only be compared with the model state representing the same place, depth, and time."],["The difference is informative","The observation-minus-forecast difference reveals how the predicted state disagrees with reality."],["Uncertainty controls the correction","Data assimilation should make a large correction only when the observation is informative relative to model uncertainty."]],"terms":[["Numerical model","Equations solved on a computer grid to simulate the ocean."],["State estimate","The best available representation of variables throughout the modeled ocean."],["Quality control","Tests identifying implausible, duplicated, contaminated, or poorly located data."],["Observation operator","A calculation translating the model state into the quantity an instrument would measure."],["Innovation","The difference between an observation and the model prediction of that observation."],["Data assimilation","Mathematical combination of observations, a model forecast, and their uncertainties."],["Initialization","The state used to begin a forecast calculation."],["Forecast verification","Comparison of predictions with observations not already used to create them."]],"note":"Operational systems assimilate many observation types with sophisticated covariance models, bias corrections, ensembles, and coupled ocean-atmosphere components. This game shows one simplified cycle.","sources":"Aligned with ONR Ocean, Atmosphere and Space Sciences priorities in observations, environmental evolution, data assimilation, coupled prediction, and limits of predictability.","chapters":[{"id":"observe","cards":[["sample","A glider measures temperature and salinity"],["locate","Navigation and clocks assign position, depth, and time"],["transmit","The platform sends the observations ashore"],["quality","Automated checks flag unreliable measurements"]]},{"id":"assimilate","cards":[["forecast","The ocean model predicts the observed quantities"],["innovation","The system calculates observation-minus-forecast differences"],["weight","Uncertainties determine how strongly each difference is trusted"],["analysis","Assimilation produces an updated ocean state estimate"]]},{"id":"verify","cards":[["initialize","The updated state initializes a new forecast"],["predict","The model predicts currents, fronts, and water properties"],["compare","Later independent observations test the prediction"],["improve","Forecast errors guide model and observing improvements"]]}],"chapterOrder":["observe","assimilate","verify"],"intro":"A mobile ocean sensor has gathered information along a narrow path, while a model represents the entire region imperfectly. Sequence A must turn the raw sensor output into observations with trustworthy coordinates and quality information.","segues":["The observations are now usable, but they cover only selected locations. The next sequence compares them with the model’s corresponding predictions and uses uncertainty to construct a more complete state estimate.","The assimilation has produced a physically organized estimate across the model domain. The next sequence tests whether using that estimate actually improves prediction rather than merely fitting the observations already seen."],"hints":["Position, depth, and time are assigned before the observation can be compared with a model value.","The model predicts the observed quantity before the observation-minus-forecast difference can be calculated."],"collection":"ONR collection"},{"id":"spaceweather","icon":"☉","discipline":"Space weather & communications","title":"When the Sun Disturbs the Link","headline":"Reconstruct how a solar eruption changes near-Earth plasma and degrades radio navigation or communication.","kicker":"Space-environment operations center · Solar magnetic activity is increasing","story":["Naval communication and navigation systems depend on radio waves passing through or near the ionosphere. Conditions there can change rapidly when the Sun releases energy and plasma.","Arrange the solar event, the near-Earth response, and the resulting effects on radio systems."],"principles":[["Space weather begins with magnetic energy","Solar eruptions are driven by changing magnetic fields, not by ordinary weather or combustion."],["Different disturbances travel differently","Radiation can arrive in minutes, energetic particles later, and a coronal mass ejection over hours or days."],["The ionosphere is part of the radio path","Changing electron density alters refraction, delay, phase, absorption, and signal fluctuations."],["Effects depend on frequency and geometry","A disturbance can affect high-frequency communication, satellite links, and navigation signals in different ways."]],"terms":[["Solar flare","A rapid release of electromagnetic radiation from an active solar region."],["Coronal mass ejection","A large expulsion of magnetized plasma from the Sun."],["Solar wind","The continuous flow of plasma and magnetic field from the Sun."],["Magnetosphere","The region where Earth’s magnetic field strongly controls charged-particle motion."],["Ionosphere","An upper-atmospheric region containing free electrons and ions."],["Total electron content","The number of free electrons along a signal path."],["Scintillation","Rapid fluctuations in received signal amplitude or phase caused by irregular plasma."],["Space-weather forecast","A prediction or warning describing solar and near-Earth conditions and possible technological effects."]],"note":"Solar flares, energetic particles, coronal mass ejections, geomagnetic storms, and ionospheric disturbances have different timing and consequences. This game presents a representative eruption-to-radio-impact pathway.","sources":"Aligned with ONR marine meteorology and space-weather research in observations, coupled prediction, space effects, navigation, and communications; physical concepts are consistent with NOAA and NASA space-weather explanations.","chapters":[{"id":"sun","cards":[["store","Magnetic stress builds in an active region on the Sun"],["erupt","A solar eruption releases radiation and magnetized plasma"],["travel","The disturbance propagates through interplanetary space"],["detect","Spacecraft and solar observatories detect the event"]]},{"id":"earth","cards":[["arrive","The disturbance interacts with Earth’s magnetic environment"],["currents","Magnetospheric and ionospheric currents intensify"],["heat","Energy deposition heats and disturbs the upper atmosphere"],["electrons","Ionospheric electron density becomes irregular"]]},{"id":"systems","cards":[["enter","A radio signal enters the disturbed ionosphere"],["alter","Its path, delay, phase, or strength changes unpredictably"],["degrade","Communication or navigation performance degrades"],["adapt","Forecasts and alternate links help operators manage the disruption"]]}],"chapterOrder":["sun","earth","systems"],"intro":"The Sun contains an active region with increasingly stressed magnetic fields, while naval radio systems are still operating normally. Sequence A must produce and detect a disturbance capable of reaching the space environment around Earth.","segues":["The solar event has been observed and is moving through interplanetary space. The next sequence follows its interaction with Earth’s magnetic field, upper atmosphere, and electrically charged ionosphere.","The near-Earth plasma environment now differs from the assumptions used by ordinary radio propagation and navigation models. The next sequence shows how those changes enter a signal path and become an operational problem."],"hints":["Magnetic stress builds in the active solar region before an eruption releases radiation and plasma.","Ionospheric electron density becomes irregular before a radio signal experiences unpredictable phase or strength changes."],"collection":"ONR collection"}];

function shuffle(arr){
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a;
}
function chapterById(id){return current.chapters.find(c=>c.id===id)}
function cardTitle(chapterId,cardId){return chapterById(chapterId).cards.find(c=>c[0]===cardId)[1]}

}

const NC_GAMES=[{"id":"nc_sonar_path","icon":"≈","discipline":"Underwater acoustics","title":"From Machinery Noise to a Sonar Track","headline":"Follow the dependency chain that lets a passive array turn pressure fluctuations into a classified contact.","kicker":"Ocean acoustics laboratory · A distant ship is radiating broadband and tonal sound","story":["A ship over the horizon cannot be seen, yet its machinery and propeller disturb the surrounding water. A passive sonar operator receives only the pressure field that survives the ocean path.","Arrange the physical and computational sequence from source vibration to a stable bearing-and-frequency track."],"overview":"Passive sonar does not transmit a pulse. It depends on sound generated by a source, propagation through a variable ocean, conversion of pressure to electrical signals, array processing, and repeated observations that support classification. Each stage needs the output of the stage before it.","terms":[["Cavitation","Formation and collapse of vapor bubbles near a propeller when local pressure falls sufficiently."],["Sound-speed profile","How sound speed changes with depth because of temperature, salinity, and pressure."],["Refraction","Bending of a wave path when propagation speed changes with position."],["Hydrophone","A sensor that converts underwater pressure changes into an electrical signal."],["Beamforming","Combining time-shifted array channels to favor sound arriving from one direction."],["Tonal line","A narrow frequency feature often associated with rotating machinery."],["Track","A time-linked estimate of a contact’s bearing, motion, and signal features."]],"note":"Real oceans can create multiple paths, shadow zones, and strong biological or shipping noise. The game uses a single dominant path so the causal order remains unique.","sources":"Fact-checked against U.S. Navy and NOAA primers on underwater sound, sound-speed variation, sonar, hydrophones, and acoustic propagation.","chapters":[{"id":"source","cards":[["power","Loaded machinery and the propulsion shaft exert changing forces"],["vibrate","Those forces vibrate machinery foundations, hull plating, and the propeller"],["water","The moving surfaces push and pull on nearby seawater"],["field","The resulting pressure disturbances radiate as an acoustic field"]]},{"id":"ocean","cards":[["leave","Sound energy leaves the source region"],["profile","The local sound-speed profile sets how rays bend"],["loss","Spreading and absorption reduce the received level"],["arrival","A weakened pressure pattern reaches the receiving array"]]},{"id":"process","cards":[["sense","Hydrophones convert pressure changes into voltage signals"],["delay","The processor applies relative delays across array channels"],["beam","Beamforming emphasizes one arrival direction"],["track","Repeated bearings and spectral lines are associated into a contact track"]]}],"chapterOrder":["source","ocean","process"],"segues":["The source has created a pressure field, but the receiver will not observe a simple copy. The ocean path now determines which frequencies and directions survive.","The array has received pressure fluctuations, not a contact label. Sensor conversion and coherent processing must turn those fluctuations into directional evidence before tracking can begin."],"principles":[["Trace the information carrier","Mechanical vibration becomes pressure variation, then voltage, then a directional estimate."],["Propagation happens before detection","The sound-speed structure and transmission loss act on the signal before any processor can recover it."],["An array needs relative timing","Direction comes from phase or arrival-time differences among separated hydrophones."],["Classification follows detection","A stable bearing and spectrum provide the evidence used to form and classify a track."]],"hints":["The hull must first move the water before any acoustic pressure field can leave the source.","Hydrophones produce channel voltages before beamforming can favor an arrival direction."],"intro":"The distant ship is operating steadily. Sequence A must create an underwater pressure disturbance before ocean propagation or receiver processing can occur.","collection":"Navy course"},{"id":"nc_radar_echo","icon":"⌁","discipline":"Electromagnetics","title":"From Radar Pulse to Confirmed Track","headline":"Order the physical and information-processing steps behind pulse-echo radar.","kicker":"Surface-search radar · A small contact is near the electromagnetic horizon","story":["A rotating radar must illuminate a sector, receive a tiny echo amid noise and clutter, and decide whether repeated returns belong to one moving object.","Arrange the chain from waveform creation through detection, ranging, and track formation."],"overview":"Radar range is inferred from elapsed time, but a usable track requires much more than a stopwatch. The transmitter must create a waveform, the antenna must radiate it, the target must scatter some energy back, the receiver must protect itself and recover the echo, and repeated measurements must be associated over time.","terms":[["Pulse repetition interval","Time between transmitted pulses."],["Duplexer","A device that alternately connects a shared antenna to the transmitter and receiver while protecting the receiver."],["Backscatter","Energy redirected toward the radar after the wave interacts with a target."],["Matched filter","A processor designed to maximize response to a known waveform in noise."],["Range gate","A time window corresponding to a selected distance interval."],["Clutter","Unwanted echoes from sea, land, weather, or other distributed reflectors."],["Track file","A time-linked record of estimated target position and motion."]],"note":"Real radars may use pulse compression, Doppler processing, electronic steering, and parallel tracking. The sequence shows the dependency order common to pulse-echo systems.","sources":"Fact-checked against Naval History and Heritage Command radar descriptions and standard pulse-echo radar principles.","chapters":[{"id":"transmit","cards":[["waveform","The exciter forms a timed radio-frequency waveform"],["amplify","The transmitter raises the waveform to high peak power"],["switchtx","The duplexer connects the antenna to the transmitter"],["radiate","The antenna directs the pulse into a search sector"]]},{"id":"echo","cards":[["switchrx","After the pulse, the duplexer connects the antenna to the protected receiver"],["travel","The transmitted pulse propagates outward at electromagnetic-wave speed"],["scatter","A target intercepts and backscatters a small fraction"],["return","The echo returns through the antenna and receive path"]]},{"id":"track","cards":[["filter","The receiver and matched filter recover echo energy"],["range","Round-trip delay is converted into target range"],["detect","Threshold and clutter processing declare a plot"],["associate","Plots from successive scans are associated into a track"]]}],"chapterOrder":["transmit","echo","track"],"segues":["The pulse has left the antenna. A range measurement is impossible until energy interacts with an object and returns to the same radar.","The receiver now has a weak waveform mixed with noise and clutter. Signal processing must recover evidence from each scan before a tracker can connect detections through time."],"principles":[["Range comes from round-trip time","The clock starts with transmission and ends when the echo is received."],["Most transmitted energy never returns","Target geometry and spreading make the received echo far weaker than the outgoing pulse."],["Detection is not tracking","One threshold crossing is a plot; motion requires association across scans."],["Protection precedes reception","A shared-antenna receiver must be isolated from the high-power transmit pulse."]],"hints":["The target must scatter the outward pulse before an echo can travel back.","A plot must be declared on an individual scan before successive plots can be associated into a track."],"intro":"The radar has not yet transmitted. Sequence A must create, amplify, switch, and radiate a waveform before any target echo can exist.","collection":"Navy course"},{"id":"nc_gas_turbine_drive","icon":"↻","discipline":"Marine engineering","title":"From Intake Air to Propeller Thrust","headline":"Follow energy through a marine gas-turbine propulsion train.","kicker":"Engineering plant · A gas turbine is ordered from idle to ahead power","story":["The bridge requests more speed. Fuel alone cannot turn the propeller: the plant must establish airflow, release heat, extract shaft work, transmit torque, and accelerate water astern.","Arrange the thermodynamic and mechanical chain that produces ship thrust."],"overview":"A marine gas turbine is an open-cycle heat engine. The compressor raises air pressure, fuel adds chemical energy, hot gas expands through turbine stages, and a power turbine drives reduction gearing and a shaft. The propeller then converts shaft torque into a pressure and momentum change in the water.","terms":[["Compressor","Rotating stages that raise the pressure of incoming air."],["Combustor","Chamber where fuel burns in compressed air."],["Gas-generator turbine","Turbine stages that power the compressor."],["Power turbine","Turbine that extracts useful output shaft work."],["Reduction gear","Gearing that trades high turbine speed for lower propeller speed and higher torque."],["Pitch","The geometric advance associated with one propeller revolution in an ideal solid medium."],["Thrust","Force produced by changing the momentum and pressure of a fluid."]],"note":"Some ships use controllable-pitch propellers, combining gears, or electric transmission. This sequence follows a direct mechanical gas-turbine drive.","sources":"Fact-checked against standard Brayton-cycle and marine propulsion descriptions used in naval engineering education.","chapters":[{"id":"gaspath","cards":[["intake","Intake ducts deliver filtered ambient air"],["compress","Compressor stages raise the air pressure"],["burn","Fuel is metered and burns in the compressed airflow"],["expand","Hot gas expands through the gas-generator turbine"]]},{"id":"shaft","cards":[["compressorwork","The gas-generator turbine keeps the compressor turning"],["powerstage","Remaining gas energy turns the free power turbine"],["gear","Reduction gearing lowers rotational speed and raises shaft torque"],["shaft","The propulsion shaft carries torque toward the stern"]]},{"id":"thrust","cards":[["rotate","The propeller rotates under applied shaft torque"],["pressure","Blade sections create a pressure difference across the propeller disk"],["wake","The propeller accelerates a mass of water astern"],["ship","The reaction force accelerates the ship ahead"]]}],"chapterOrder":["gaspath","shaft","thrust"],"segues":["The gas generator is now self-sustaining. Useful propulsion still requires extracting remaining exhaust energy on a separate output shaft and matching its speed to the propeller.","Torque has reached the propeller shaft, but torque is not yet ship motion. The propeller must exchange momentum with the water to create an external force on the hull."],"principles":[["Follow energy, not just components","Chemical energy becomes thermal energy, gas kinetic energy, shaft work, and finally fluid momentum."],["The compressor must be paid for","Part of turbine work only keeps the engine breathing; useful output comes after that internal demand."],["Gearing matches machines","Turbines favor high rotational speed while large propellers operate efficiently at much lower speed."],["Thrust requires the environment","The ship moves because the propeller pushes water astern and water pushes the propeller—and ship—ahead."]],"hints":["Compressed air must reach the combustor before fuel can burn stably in the gas path.","Reduction gearing changes turbine speed before torque reaches the propeller shaft."],"intro":"The bridge has requested ahead power, but the engine contains only stationary air and rotating machinery at idle. Sequence A must establish the pressurized hot-gas path.","collection":"Navy course"},{"id":"nc_layered_defense","icon":"◎","discipline":"Systems engineering","title":"From Air Search to Engagement Assessment","headline":"Order the information and authorization chain in a layered defensive response.","kicker":"Task-group operations room · An uncorrelated air contact approaches","story":["A surveillance sensor reports a new contact. The force must transform an uncertain return into a shared track, assess identity and intent, select a proportionate response, and determine whether the threat remains.","Arrange the high-level decision chain without assuming that detection automatically authorizes engagement."],"overview":"A defensive system is a chain of evidence and control. Sensors create measurements; trackers create state estimates; identification combines cooperative, intelligence, and behavioral evidence; command evaluates rules and risk; weapons or countermeasures require a quality solution; and assessment closes the loop.","terms":[["Plot","A sensor-level observation from one scan or report."],["Track","A time-linked estimate of position, velocity, and uncertainty."],["Identification","Assessment of whether a contact is friendly, neutral, unknown, or hostile."],["Correlation","Determining whether reports from different sensors describe the same object."],["Fire-control quality","Accuracy and update rate sufficient for a selected engagement system."],["Authorization","Command permission under applicable rules and delegated authority."],["Assessment","Evaluation of whether the action achieved the intended effect."]],"note":"The puzzle stays at public, system-level concepts. Real engagement criteria, ranges, tactics, and authorities depend on mission and classification.","sources":"Fact-checked against public naval radar, command-and-control, identification, and layered-defense concepts.","chapters":[{"id":"build","cards":[["plot","A surveillance sensor generates an uncorrelated plot"],["initiate","Successive plots initiate a tentative track"],["correlate","Other sensor reports are correlated with that track"],["refine","The fused track gains a better position, velocity, and uncertainty estimate"]]},{"id":"decide","cards":[["identify","Cooperative, intelligence, and behavior evidence support identification"],["evaluate","Command evaluates intent, rules, geometry, and risk"],["select","The force selects a warning, maneuver, countermeasure, or engagement option"],["authorize","The responsible authority approves the selected action"]]},{"id":"act","cards":[["quality","Sensors maintain the quality required by the chosen system"],["execute","The approved action is executed"],["observe","Sensors observe the contact and action effects"],["assess","The force assesses whether the threat is removed or another layer is required"]]}],"chapterOrder":["build","decide","act"],"segues":["A common operating picture now contains a refined track. The next dependency is judgment: identity, intent, authority, and proportional response must be established before action.","The action has been authorized. Execution still depends on adequate track quality, and the defensive cycle is not complete until sensors determine what changed."],"principles":[["A measurement is not a decision","Sensor evidence must be tracked, correlated, and interpreted before command action."],["Identity and intent are separate questions","A known platform can still behave unexpectedly; an unknown contact is not automatically hostile."],["Authority is load-bearing","A technically possible action may remain prohibited or inappropriate."],["Assessment closes the loop","Defensive systems must observe outcomes and decide whether another response is needed."]],"hints":["Successive plots must first initiate a track before reports from other sensors can be correlated to it.","Authorization comes before execution, while assessment comes only after effects can be observed."],"intro":"Only one sensor has reported the contact. Sequence A must turn isolated measurements into a refined shared track before identification and command judgment can proceed.","collection":"Navy course"}];
function chooseGame(id){
 current=GAMES.find(g=>g.id===id)||NC_GAMES.find(g=>g.id===id);try{if(current)reckonStart(current.id)}catch(e){};resetGame();
 document.getElementById('patch').textContent=current.icon;
 document.getElementById('brandTitle').textContent=current.title;
 document.getElementById('brandSub').textContent=current.discipline;
 renderBrief();
}
function renderHome(){
 app.innerHTML=`<section class="panel hero"><div class="kicker">Three chapters · Four events each · Three tries</div><h2>Build three small sequences—and arrange the sequences themselves.</h2><p>Each of the twenty games contains twelve title-only event cards divided into three four-event chapters. The opening briefing teaches useful reasoning principles without describing the answer. During play, two optional relational hints are available.</p><div class="storybox"><strong>Three-check challenge:</strong> correct chapter positions and every card in its exact position lock in green. Solve the full puzzle within three checks. An unsuccessful third check ends the game and reveals the correct solution.</div></section><section class="homegrid">${GAMES.map(g=>`<div class="homecard" onclick="chooseGame('${g.id}')"><div class="icon">${g.icon}</div><div class="discipline">${g.collection} · ${g.discipline}</div><h3>${g.title}</h3><div class="cardbrief"><p class="cb-lead">${g.headline}</p>${(g.story||[]).map(s=>`<p>${s}</p>`).join('')}</div><strong style="color:var(--gold)">Open game →</strong></div>`).join('')}</section>`;
}
function renderBrief(){
 app.innerHTML=`<section class="panel hero"><div class="kicker">${current.kicker}</div><h2>${current.headline}</h2>${current.story.map(p=>`<p>${p}</p>`).join('')}
 <div class="storybox"><strong>Your task:</strong> Arrange four title-only cards inside each chapter. Use the starting situation and two bridge passages to place the three chapters. You have three checks and two optional hints.</div>
 <section class="lesson"><h3>How to reason through this puzzle</h3><div class="termgrid">${current.principles.map(p=>`<div class="term"><strong>${p[0]}</strong><p>${p[1]}</p></div>`).join('')}</div></section>
 <section class="lesson"><h3>Useful terms</h3><div class="termgrid">${current.terms.map(t=>`<div class="term"><strong>${t[0]}</strong><p>${t[1]}</p></div>`).join('')}</div></section>
 <div class="note"><strong>Simplifying assumption:</strong> ${current.note}</div><div class="sourcebox"><strong>Accuracy note:</strong> ${current.sources}</div>
 <div class="controls"><button class="btn primary" onclick="renderPlay()">Begin game</button></div></section>`;
}
function chapterLockedAt(index){return lockedChapters.has(chapterOrder[index])}
function moveChapter(index,delta){
 const target=index+delta;
 if(target<0||target>=chapterOrder.length||chapterLockedAt(index)||chapterLockedAt(target))return;
 [chapterOrder[index],chapterOrder[target]]=[chapterOrder[target],chapterOrder[index]];
 clearFeedback();renderPlay();
}
function isCardLocked(chapterId,index){
 return lockedCardPositions[chapterId]?.has(index)||false;
}
function nextUnlockedIndex(chapterId,index,delta){
 for(let i=index+delta;i>=0&&i<cardOrders[chapterId].length;i+=delta){
   if(!isCardLocked(chapterId,i))return i;
 }
 return -1;
}
function reorderUnlockedCards(chapterId,fromIndex,toIndex){
 if(fromIndex===toIndex||isCardLocked(chapterId,fromIndex)||isCardLocked(chapterId,toIndex))return;
 const arr=cardOrders[chapterId];
 const openIndices=arr.map((_,i)=>i).filter(i=>!isCardLocked(chapterId,i));
 const fromOpen=openIndices.indexOf(fromIndex),toOpen=openIndices.indexOf(toIndex);
 if(fromOpen<0||toOpen<0)return;
 const openCards=openIndices.map(i=>arr[i]);
 const [moved]=openCards.splice(fromOpen,1);
 openCards.splice(toOpen,0,moved);
 openIndices.forEach((position,i)=>{arr[position]=openCards[i]});
}
function moveCard(chapterId,index,delta){
 const target=nextUnlockedIndex(chapterId,index,delta);
 if(target<0||isCardLocked(chapterId,index))return;
 reorderUnlockedCards(chapterId,index,target);
 clearFeedback();renderPlay();
}
function dragChapterStart(e,id){
 if(lockedChapters.has(id)){e.preventDefault();return}
 dragType='chapter';dragChapter=id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id);
 e.currentTarget.closest('.chapter').classList.add('dragging');
}
function dragCardStart(e,chapterId,index){
 e.stopPropagation();
 if(isCardLocked(chapterId,index)){e.preventDefault();return}
 dragType='card';dragChapter=chapterId;dragCardIndex=index;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',chapterId+':'+index);
 e.currentTarget.classList.add('dragging');
}
function dragEnd(){
 document.querySelectorAll('.dragging,.dragover').forEach(x=>x.classList.remove('dragging','dragover'));
 dragType=null;dragChapter=null;dragCardIndex=null;
}
function chapterDragOver(e,index){
 if(dragType!=='chapter'||chapterLockedAt(index))return;
 e.preventDefault();e.currentTarget.classList.add('dragover');
}
function chapterDrop(e,index){
 if(dragType!=='chapter'||chapterLockedAt(index))return;
 e.preventDefault();
 const from=chapterOrder.indexOf(dragChapter);
 if(from<0||from===index||chapterLockedAt(from))return;
 const [id]=chapterOrder.splice(from,1);chapterOrder.splice(index,0,id);
 dragEnd();clearFeedback();renderPlay();
}
function cardDragOver(e,chapterId,index){
 e.stopPropagation();
 if(dragType!=='card'||dragChapter!==chapterId||isCardLocked(chapterId,index))return;
 e.preventDefault();e.currentTarget.classList.add('dragover');
}
function cardDrop(e,chapterId,index){
 e.stopPropagation();
 if(dragType!=='card'||dragChapter!==chapterId||isCardLocked(chapterId,index))return;
 e.preventDefault();
 reorderUnlockedCards(chapterId,dragCardIndex,index);
 dragEnd();clearFeedback();renderPlay();
}
function revealHint(index){
 if(index<0||index>1||hintsUsed[index])return;
 hintsUsed[index]=true;
 renderPlay();
}
function reshuffleUnlocked(){
 const freeChapters=shuffle(chapterOrder.filter(id=>!lockedChapters.has(id)));
 let chapterCursor=0;
 chapterOrder=chapterOrder.map(id=>lockedChapters.has(id)?id:freeChapters[chapterCursor++]);
 current.chapters.forEach(c=>{
   const arr=cardOrders[c.id];
   const openIndices=arr.map((_,i)=>i).filter(i=>!isCardLocked(c.id,i));
   const shuffled=shuffle(openIndices.map(i=>arr[i]));
   openIndices.forEach((position,i)=>{arr[position]=shuffled[i]});
 });
 clearFeedback();
 renderPlay();
}
function renderChapter(chapterId,index){
 const chapterLocked=lockedChapters.has(chapterId),lockedCount=lockedCardPositions[chapterId]?.size||0;
 return `<div class="chapter-wrap"><section class="chapter ${chapterLocked?'locked':''}" ondragover="chapterDragOver(event,${index})" ondrop="chapterDrop(event,${index})">
  <div class="chapter-head">
   <div class="chapter-number">${index+1}</div>
   <div class="draghandle" draggable="${!chapterLocked}" ondragstart="dragChapterStart(event,'${chapterId}')" ondragend="dragEnd()" title="${chapterLocked?'Chapter position confirmed':'Drag chapter'}">⋮⋮</div>
   <div><div class="chapter-title">Sequence ${String.fromCharCode(65+index)}</div><div class="chapter-sub">${chapterLocked?'Chapter position confirmed':`${lockedCount} of 4 card positions confirmed`}</div></div>
   <div class="chapter-moves"><button class="movebtn" onclick="moveChapter(${index},-1)" ${index===0||chapterLocked||chapterLockedAt(index-1)?'disabled':''}>▲</button><button class="movebtn" onclick="moveChapter(${index},1)" ${index===chapterOrder.length-1||chapterLocked||chapterLockedAt(index+1)?'disabled':''}>▼</button></div>
  </div>
  <div class="cards">${cardOrders[chapterId].map((cardId,i)=>{const locked=isCardLocked(chapterId,i),up=nextUnlockedIndex(chapterId,i,-1),down=nextUnlockedIndex(chapterId,i,1);return `<div class="card ${locked?'locked':''}" draggable="${!locked}" ondragstart="dragCardStart(event,'${chapterId}',${i})" ondragend="dragEnd()" ondragover="cardDragOver(event,'${chapterId}',${i})" ondrop="cardDrop(event,'${chapterId}',${i})">
   <div class="card-num">${i+1}</div><div class="draghandle">⋮⋮</div><div class="card-title">${cardTitle(chapterId,cardId)}</div>
   <div class="card-moves"><button class="movebtn" onclick="moveCard('${chapterId}',${i},-1)" ${locked||up<0?'disabled':''}>▲</button><button class="movebtn" onclick="moveCard('${chapterId}',${i},1)" ${locked||down<0?'disabled':''}>▼</button></div>
  </div>`}).join('')}</div>
 </section></div>`;
}
function renderPlay(){
 const remaining=3-attempts;
 app.innerHTML=`<section class="panel game"><div class="gamehead"><div><div class="kicker">${current.discipline} · Sequence</div><h2>${current.title}</h2><details class="howto"><summary>How to play</summary><p>Twelve title-only cards form three four-card chapters. Drag a card (or use its arrows) to order events inside a chapter; use the chapter handle to move a whole chapter. Correct positions lock green — solve within three checks.</p></details></div><div class="stage">${remaining} ${remaining===1?'try':'tries'} left · ${lockedChapters.size}/3 chapters placed</div></div>
 <div class="motivation"><p class="mot-lead">${current.headline}</p>${(current.story||[]).map(s=>`<p>${s}</p>`).join('')}</div>
 <div class="hintpanel">
 <div class="hintactions"><button class="btn" onclick="revealHint(0)" ${hintsUsed[0]?'disabled':''}>${hintsUsed[0]?'Hint 1 revealed':'Reveal Hint 1'}</button><button class="btn" onclick="revealHint(1)" ${hintsUsed[1]?'disabled':''}>${hintsUsed[1]?'Hint 2 revealed':'Reveal Hint 2'}</button></div>
 ${hintsUsed.map((used,i)=>used?`<div class="hintreveal"><strong>Hint ${i+1}:</strong> ${current.hints[i]}</div>`:'').join('')}</div>
 <div class="chapter-stack"><details class="sqinfo"><summary>Starting situation</summary><div>${current.intro}</div></details>${chapterOrder.map((id,i)=>`${renderChapter(id,i)}${i<2?`<details class="sqinfo"><summary>Bridge: Sequence ${String.fromCharCode(65+i)} → ${String.fromCharCode(66+i)}</summary><div>${current.segues[i]}</div></details>`:''}`).join('')}</div>
 <div class="statusbar"><span>Checks used: ${attempts} of 3</span><span class="green">${Object.values(lockedCardPositions).reduce((a,s)=>a+s.size,0)} of 12 card positions confirmed</span></div>
 <div class="controls"><button class="btn primary" onclick="checkAnswer()">Check both levels</button><button class="btn" onclick="reshuffleUnlocked()">Reshuffle unlocked items</button><button class="btn" onclick="renderBrief()">Review principles</button></div>
 <div class="feedback ${feedback?'show '+feedbackKind:''}">${feedback}</div></section>`;
}
function checkAnswer(){
 if(attempts>=3)return;
 attempts++;
 let allCards=true;
 current.chapters.forEach(c=>{
   const arr=cardOrders[c.id],correct=c.cards.map(x=>x[0]),locked=lockedCardPositions[c.id];
   arr.forEach((cardId,i)=>{if(cardId===correct[i])locked.add(i)});
   if(locked.size<4)allCards=false;
 });
 chapterOrder.forEach((id,i)=>{if(id===current.chapterOrder[i])lockedChapters.add(id)});
 const allChapters=chapterOrder.every((id,i)=>id===current.chapterOrder[i]);
 if(allCards&&allChapters){renderSolved();return}
 if(attempts>=3){renderLost();return}
 const remaining=3-attempts;
 feedbackKind='bad';
 feedback=`<strong>${lockedChapters.size} of 3 chapter positions and ${Object.values(lockedCardPositions).reduce((a,s)=>a+s.size,0)} of 12 card positions are confirmed.</strong> Every card in its exact position is now green and fixed. You have ${remaining} ${remaining===1?'try':'tries'} remaining.`;
 renderPlay();
}
function solutionMarkup(){
 return `<div class="chapter-stack"><div class="intro-panel"><div class="intro-icon">↓</div><div><strong>Starting situation</strong>${current.intro}</div></div>${current.chapterOrder.map((id,i)=>{const c=chapterById(id);return `<section class="solution-chapter"><h3>Chapter ${i+1}</h3><div class="solution-cards">${c.cards.map((card,j)=>`<div class="solution-card"><span>${j+1}</span>${card[1]}</div>`).join('')}</div></section>${i<2?`<div class="segue"><div class="segue-icon">↧</div><div><strong>Chapter transition</strong>${current.segues[i]}</div></div>`:''}`}).join('')}</div>`;
}
function renderSolved(){try{reckonReport({game:'Sequence',gameId:current&&current.id,gameTitle:current&&current.title,won:true});}catch(e){}
 app.innerHTML=`<section class="panel game"><div class="gamehead"><div><div class="kicker">All three chapters complete</div><h2>${current.title}</h2><p>You solved the four-event sequences and the order of the three larger chapters within the three-check limit.</p></div><div class="stage">${attempts} of 3 checks used</div></div>
 <div class="feedback show good"><strong>Correct.</strong> All twelve events and both chapter transitions are in place.</div>
 ${solutionMarkup()}
 <div class="controls"><button class="btn primary" onclick="resetGame();renderPlay()">Play again</button><button class="btn" onclick="goHome()">Choose another game</button></div></section>`;
}
function renderLost(){try{reckonReport({game:'Sequence',gameId:current&&current.id,gameTitle:current&&current.title,won:false});}catch(e){}
 app.innerHTML=`<section class="panel game"><div class="gamehead"><div><div class="kicker">Three-check limit reached</div><h2>${current.title}</h2><p>The third check did not complete both levels of the puzzle. The correct chapter and card order is shown below.</p></div><div class="stage">3 of 3 checks used</div></div>
 <div class="feedback show lose"><strong>Not solved in three tries.</strong> Study how each four-event chain leads into the bridge passage beneath it.</div>
 ${solutionMarkup()}
 <div class="controls"><button class="btn primary" onclick="resetGame();renderPlay()">Try a new shuffle</button><button class="btn" onclick="renderBrief()">Review principles</button><button class="btn" onclick="goHome()">Choose another game</button></div></section>`;
}
function bootFromHash(){var id=decodeURIComponent((location.hash||"").replace(/^#/,""));if(id&&(GAMES.some(function(g){return g.id===id})||NC_GAMES.some(function(g){return g.id===id}))){chooseGame(id);}else{renderHome();}}
bootFromHash();
window.addEventListener("hashchange",bootFromHash);
</script>

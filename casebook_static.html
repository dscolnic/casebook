<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casebook — RECKON</title>
<style>
:root{
  --bg:#ffffff; --paper:#ffffff; --ink:#1a1a17; --muted:#565651;
  --accent:#2f5d86; --hair:#e4e4e2; --chip:#f2f2f0; --hover:#f5f5f3;
  --danger:#B3261E; --good:#2f6d4f;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14140f; --paper:#1c1c16; --ink:#ece9df; --muted:#a6a598;
    --accent:#82b2d9; --hair:#2f2f26; --chip:#26261e; --hover:#22221a;
    --danger:#e08b84; --good:#7bbd9c; }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;line-height:1.12;margin:0}
h1{font-size:clamp(28px,4.5vw,40px)}h2{font-size:clamp(22px,3vw,29px)}h3{font-size:19px}h4{font-size:15px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:11px;background:var(--chip);padding:4px 8px;border-radius:3px;color:var(--muted)}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px max(16px,calc((100vw - 1080px)/2));background:var(--bg);border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand-title{font-family:var(--serif);font-size:18px;font-weight:700;white-space:nowrap}
.brand-sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:9px;flex-shrink:0}

.wrap{display:grid;grid-template-columns:1fr 320px;max-width:1080px;margin:0 auto;min-height:calc(100vh - 46px)}
.stage{padding:26px 30px 90px;min-width:0}
.side{background:var(--paper);border-left:1px solid var(--hair);padding:20px 18px;position:sticky;top:46px;align-self:start;height:calc(100vh - 46px);overflow-y:auto}
@media(max-width:860px){
  .wrap{grid-template-columns:1fr}
  .stage{padding:22px 18px 60px}
  .side{order:2;position:static;height:auto;border-left:0;border-top:1px solid var(--hair)}
}

.btn{border:1px solid var(--hair);background:var(--paper);padding:9px 13px;border-radius:4px;font-weight:650}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.92}
.btn.warn{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:12px}
.btn.wide{width:100%;text-align:center;padding:11px;margin-top:8px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,93,134,0)}50%{box-shadow:0 0 0 4px rgba(47,93,134,.18)}}

.emblem{border:1px solid var(--hair);padding:14px;background:var(--paper);margin:14px 0}
.emblem svg{width:100%;height:auto;max-height:120px}
.teaser{font-size:clamp(16px,2vw,19px);line-height:1.6;color:var(--ink);max-width:640px}
.story{margin:14px 0 0;max-width:640px}.story p{color:var(--muted);margin:0 0 10px}
.section-h{margin:22px 0 4px}
.howto{margin:14px 0 0;font-family:var(--sans)}
.howto summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:650;list-style:none}
.howto summary::-webkit-details-marker{display:none}
.howto summary::before{content:"ⓘ  "}
.howto p{font-size:13.5px;color:var(--muted);line-height:1.5;margin:8px 0 0;max-width:640px}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0 4px}
.card{border:1px solid var(--hair);background:var(--paper);padding:15px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:180px}
.card:hover{background:var(--hover)}
.card .face{font-size:28px}
.card .cname{font-family:var(--serif);font-size:17px}
.card .crole{font-size:12px;color:var(--muted)}
.card .chint{font-size:12.5px;color:var(--muted);border-top:1px solid var(--hair);padding-top:8px;margin-top:auto}
.card .cstate{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.card.done{opacity:.72}.card.done:hover{opacity:1}
@media(max-width:620px){.cards{grid-template-columns:1fr}}

.reading-head{border-bottom:1px solid var(--hair);padding-bottom:14px;margin-bottom:16px}
.reading-head .sci{font-family:var(--serif);font-size:24px;margin-top:4px}
.reading-head .topic{color:var(--muted);font-size:14px;margin-top:3px}
.profile{max-width:640px}.profile p{margin:0 0 12px;font-size:15px}
.frame{border-left:3px solid var(--accent);background:var(--chip);padding:11px 14px;margin:15px 0;font-style:italic;color:var(--ink);max-width:640px}
.qwrap{border:1px solid var(--hair);padding:17px;margin-top:15px;background:var(--paper);max-width:660px}
.qprog{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin-bottom:8px}
.qtext{font-family:var(--serif);font-size:18px;margin-bottom:13px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--hair);background:var(--paper);padding:12px 14px;border-radius:4px;margin-bottom:9px;line-height:1.45}
.opt:hover{background:var(--hover);border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.chosen{border-color:var(--accent);border-width:2px;padding:11px 13px}
.opt.dim{opacity:.5}
.fb{margin-top:6px;padding:13px 15px;border:1px solid var(--hair);background:var(--chip)}
.fb .verdict{font-size:11px;text-transform:uppercase;letter-spacing:.11em;font-weight:700;margin-bottom:6px}
.fb.expert .verdict{color:var(--good)}
.fb.partial .verdict,.fb.wrong .verdict{color:var(--muted)}
.fb.danger .verdict{color:var(--danger)}
.fb .fbtext{font-size:14px;color:var(--ink)}
.clue-drop{margin-top:11px;border-top:1px dashed var(--hair);padding-top:11px}
.clue-drop .clabel{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.clue-drop .ctext{font-size:13.5px;color:var(--ink);margin-top:4px}
.clue-locked{margin-top:11px;font-size:12px;color:var(--muted);border-top:1px dashed var(--hair);padding-top:11px}
.rowbtns{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}

/* ---- right-hand notepad ---- */
.agent{border-bottom:1px solid var(--hair);padding-bottom:10px;margin-bottom:4px}
.agent .who{font-family:var(--serif);font-size:17px}
.agent .role{font-size:12px;color:var(--muted)}
.cf-h{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--serif);font-size:14px;margin:16px 0 6px;border-bottom:2px solid var(--accent);padding-bottom:4px}
.cf-h .cnt{font-family:var(--sans);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400}
.trow{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--hair);padding:8px 2px;font-size:12.5px;line-height:1.35}
.trow:last-of-type{border-bottom:0}
.trow:hover{background:var(--hover)}
.trow .mk{width:14px;flex-shrink:0;color:var(--muted);font-size:12px;text-align:center}
.trow .tlabel{flex:1}
.trow.crossed .tlabel{text-decoration:line-through;color:var(--muted)}
.trow.crossed .mk{color:var(--muted)}
.trow.only .mk{color:var(--accent)}
.trow.only .tlabel{color:var(--ink);font-weight:650}
.clues{margin-top:7px;display:grid;gap:6px}
.clue-note{border:1px solid var(--hair);background:var(--chip);padding:8px 9px;font-size:11.5px;line-height:1.4}
.clue-note .src{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:5px}
.clue-note.flash{animation:flash 1.1s ease}
@keyframes flash{0%{background:var(--accent);color:#fff}100%{background:var(--chip)}}
.clue-empty{font-size:11px;color:var(--muted);font-style:italic;padding:2px 0}
.stat{margin-top:16px}
.stat .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
.stat .row strong{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--chip)}
.bar i{display:block;height:100%;background:var(--accent)}
.legend{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.5}

/* accuse */
.accuse-grid{display:grid;gap:14px;margin-top:16px;max-width:660px}
.accuse-cat{border:1px solid var(--hair);padding:14px;background:var(--paper)}
.accuse-cat .catt{font-family:var(--serif);font-size:16px;margin-bottom:8px}
.choice{display:block;width:100%;text-align:left;border:1px solid var(--hair);background:var(--paper);padding:11px 13px;border-radius:4px;margin-bottom:8px}
.choice:hover{background:var(--hover)}
.choice.sel{border-color:var(--accent);border-width:2px;padding:10px 12px}
.choice.strike{opacity:.5}.choice.strike .lbl{text-decoration:line-through}

.brief{border:1px solid var(--hair);background:var(--paper);padding:16px 18px;margin:16px 0;max-width:660px}
.brief .incident{font-family:var(--serif);font-size:18px;line-height:1.4;margin-bottom:8px}
.brief .qline{color:var(--muted);font-size:14.5px}
.task{max-width:660px;margin:6px 0 0}
.task .th{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:700;margin:16px 0 6px}
.task ol{margin:0;padding-left:20px}
.task li{margin-bottom:5px;font-size:14.5px}
.task li b{font-family:var(--serif);font-weight:700}
.result-status{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--hair);margin:10px 0 4px;max-width:680px}
.result-status .rmark{font-size:26px;line-height:1}
.result-status.solved{border-color:var(--good)}
.result-status.solved .rmark{color:var(--good)}
.result-status.failed{border-color:var(--danger)}
.result-status.failed .rmark{color:var(--danger)}
.result-status .rlabel{font-family:var(--serif);font-size:20px}
.result-status .rsub{font-size:12.5px;color:var(--muted)}
.solution-table{width:100%;max-width:680px;border-collapse:collapse;margin:14px 0;font-size:14px}
.solution-table th{text-align:left;font-family:var(--sans);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:6px 10px 6px 0;border-bottom:1px solid var(--hair)}
.solution-table td{padding:9px 10px 9px 0;border-bottom:1px solid var(--hair);vertical-align:top}
.solution-table .cat{color:var(--muted);white-space:nowrap}
.solution-table .mine.ok{color:var(--good)}
.solution-table .mine.no{color:var(--danger);text-decoration:line-through}
.solution-table .truth{font-weight:650}
.solution-table .res{text-align:center;width:34px}
.ending{max-width:680px}
.ending .etitle{font-family:var(--serif);font-size:clamp(24px,4vw,34px);margin:8px 0 14px}
.ending p{font-size:15.5px;margin:0 0 12px}
.verdict-band{padding:10px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);margin:14px 0;font-size:13px;color:var(--muted)}
.verdict-band strong{color:var(--ink)}
.err{border:1px solid var(--danger);background:var(--chip);padding:16px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 15px;font-size:13px;transition:.16s;z-index:60;border-radius:4px}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<script>window.__PACKS__ = [{"schemaVersion":3,"mode":"three_informants_three_readings","id":"m_bridge","title":"The Halloway Span","discipline":"Structural & Fracture Mechanics","venue":"the Halloway bridge inquiry","agent":{"name":"Inspector Nora Selby","role":"Investigator's Notepad"},"standingLabel":"Engineering credibility","readingShort":"Pioneers","readingLabel":"Structural & Fracture Pioneers","dossierName":"STRUCTURAL & FRACTURE PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Halloway bridge inquiry","DAYS_TOTAL":3,"teaser":"A bridge span drops during rush hour. Did exceptional scour remove a support, did a hidden fatigue crack finally run, or did a towboat strike the pier hard enough to launch the failure?","overclaimTag":"a vessel collision at the bridge","truthTag":"a documented towboat impact at the pier","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A truss bridge with a fatigue crack at a gusset connection\"><path d=\"M40 94 H620\" stroke=\"#326891\" stroke-width=\"2\"/><path d=\"M80 76 H580\" stroke=\"#121212\" stroke-width=\"5\"/><path d=\"M100 76 l55-42 55 42 55-42 55 42 55-42 55 42 55-42 55 42\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M330 68 l-10 9 13 8 -9 13\" fill=\"none\" stroke=\"#B3261E\" stroke-width=\"3\"/><path d=\"M145 76 v34 M515 76 v34\" stroke=\"#121212\" stroke-width=\"6\"/><\/svg>","overclaimTease":"Fracture mechanics does not automatically mean fatigue. Read the fresh metal, impact geometry, timing records, and prior inspection together before choosing between a long-growing flaw and a sudden collision.","CATS":{"who":{"title":"Who is behind it","truth":"br_towboat","items":[{"id":"br_engineer","label":"The bridge maintenance engineer"},{"id":"br_towboat","label":"Marlow Venn — the towboat captain"},{"id":"br_authority","label":"Gideon Marsh — bridge authority director"}]},"where":{"title":"Where it culminates","truth":"br_pier","items":[{"id":"br_truss","label":"The Truss & Gusset Connections"},{"id":"br_office","label":"The Bridge Authority Office"},{"id":"br_pier","label":"The Piers & Navigation Channel"}]},"what":{"title":"What happened","truth":"br_strike","items":[{"id":"br_flood","label":"Exceptional scour undermined a primary bridge support"},{"id":"br_strike","label":"A vessel impact initiated the span’s structural failure"},{"id":"br_fatigue","label":"A fatigue crack passed a scheduled reinspection window"}]}},"READING_ORDER":["br_rigger","br_ndt","br_clerk"],"CHARACTERS":{"br_rigger":{"name":"Rigger Tom Vasa","role":"Bridge steel rigger","face":"🔧","badge":"R","legend":"the truss","hint":"The failed connection shows a fresh overload tear and transferred marine paint rather than an old oxidized fatigue face.","reading":"br_griffith"},"br_ndt":{"name":"The NDT Technician","role":"Nondestructive-test technician","face":"🧲","badge":"N","legend":"the inspection platform","hint":"The last complete scan covered the fracture origin and found no growing indication before the collision date.","reading":"br_paris"},"br_clerk":{"name":"The Navigation Records Clerk","role":"Tow and bridge-event records clerk","face":"🗂","badge":"C","legend":"the navigation archive","hint":"AIS gaps, tow logs, hull repairs, and the bridge accelerometer converge on one captain’s vessel.","reading":"br_wells"}},"TOPICS":{"br_griffith":{"sci":"A. A. Griffith (1893-1963)","topic":"The energy theory of fracture","lede":"The engineer who pulled glass fibers until they told him the secret every broken thing shares: it started at a flaw.","no":1,"profile":"A. A. Griffith was a British aeronautical engineer whose 1920 paper 'The Phenomena of Rupture and Flow in Solids' founded the modern science of fracture. He was gnawed by a long-standing puzzle: real materials broke at stresses far below the enormous strength their atomic bonds predicted. Testing thin glass fibers, he found that thinner fibers were stronger, which pointed at tiny flaws as the culprit — the smaller the sample, the smaller its worst crack could be.\n\nGriffith reframed fracture as a competition of energies. A crack in a stressed body stores elastic strain energy in the material around it; extending the crack releases some of that energy but costs energy to create fresh surface. He showed a crack grows only when the strain energy released outpaces the surface energy required. This gives a critical crack size for a given stress: below it the crack sits stable, above it the crack runs and the part fails. Small flaws, not weak atoms, set real strength.\n\nGriffith later helped pioneer the jet engine at Rolls-Royce, but his fracture criterion stayed his monument, soon extended to metals by Irwin and Orowan.\n\nGriffith’s theory does not decree that every fracture began as years of fatigue. It supplies a way to ask whether a pre-existing flaw released stored energy or whether a sudden external load created the critical condition. At Halloway, most of the fracture surface is bright and recently torn, the pier bears a fresh scrape, and marine coating is embedded near the initiating deformation. Those observations fit abrupt overload after impact far better than an old oxidized crack or support loss from scour.","frame":"Holds a bright torn edge beside the scraped pier coating. “A fracture surface remembers whether the load grew for years or arrived in one violent contact. Read the metal.”","q":[{"q":"What problem did Griffith’s fracture theory explain?","o":[{"t":"Why tiny flaws make real materials fail far below ideal atomic strength.","v":"expert","fb":"Griffith connected practical strength to pre-existing cracks rather than perfect bond strength."},{"t":"Why sound steel requires a major external impact before any fracture can begin.","v":"danger","fb":"Existing flaws can grow under service stress without a single violent initiating blow."},{"t":"Why every old bridge eventually loses strength at the same calendar age.","v":"wrong","fb":"Fracture depends on flaw, stress, material, and environment rather than age alone."},{"t":"Why corrosion is the primary mechanism capable of creating a crack in steel.","v":"partial","fb":"Corrosion can assist damage, but fatigue, fabrication flaws, and other mechanisms also create cracks."}],"clue":{"category":"what","label":"WHAT — lead","text":"The fracture is dominated by bright recent overload tearing rather than an oxidized fatigue region grown over years."}},{"q":"When does a crack grow in Griffith’s energy balance?","o":[{"t":"Whenever any moving vehicle crosses the structure, regardless of crack size.","v":"wrong","fb":"Small flaws can remain stable under loads that do not reach the growth condition."},{"t":"When a barge or blast supplies energy from outside the bridge.","v":"danger","fb":"Stored elastic energy under ordinary loading can drive fracture once the flaw is critical."},{"t":"When released strain energy exceeds the cost of creating new surfaces.","v":"expert","fb":"Crack advance becomes favorable when the energy gained by extension exceeds the surface-energy requirement."},{"t":"When the crack reaches the geometric center of the gusset plate.","v":"partial","fb":"Criticality depends on energy, stress, geometry, and material—not a universal central location."}],"clue":{"category":"who","label":"WHO — lead","text":"The initiating damage carries marine paint and geometry matching one towboat, not maintenance tools or inspection equipment."}},{"q":"Which fracture observation most favors a recent vessel impact over long fatigue growth?","o":[{"t":"A broad oxidized fracture region crossed by many fatigue beach marks.","v":"partial","fb":"Oxidation and beach marks would instead support progressive crack growth."},{"t":"A bright ductile tear beside fresh deformation and transferred marine paint.","v":"expert","fb":"Fresh overload features and material transfer point to a sudden contact event."},{"t":"A clean office file showing that reinspection funding was deferred.","v":"wrong","fb":"Paperwork cannot replace physical evidence at the fracture origin."},{"t":"A deep scour hole beneath a pier after several weeks of high river flow.","v":"danger","fb":"Scour affects support conditions but does not create marine paint transfer."}],"clue":{"category":"where","label":"WHERE — lead","text":"Fresh scraping and paint transfer begin at the navigation-side pier rather than at an old truss crack or scour cavity."}}]},"br_paris":{"sci":"Paul C. Paris (1930-2017)","topic":"The law of fatigue-crack growth","lede":"The young engineer whose equation was rejected by three journals, then became the law that predicts how a crack creeps forward one truck at a time.","no":2,"profile":"Paul C. Paris was an American engineer who, around 1960, wrote the equation that lets engineers predict how fast a fatigue crack grows. Fracture mechanics could already say when a crack would fail, but not how quickly an existing crack would creep toward that point under repeated loads. Paris proposed that the growth per loading cycle depends on the range of the stress-intensity factor at the crack tip. His paper was famously turned down by leading journals before it became one of the most cited results in the field.\n\nParis's law states that the crack advance per cycle, da/dN, scales with the stress-intensity range, delta-K, raised to a power: da/dN equals C times delta-K to the m. Each pass of a loaded truck opens and closes the crack a little, and each cycle nudges the crack tip forward by an amount the law predicts. Because delta-K grows as the crack lengthens, the crack accelerates — slow for years, then alarmingly fast near the end. This is the mathematical heart of 'damage-tolerant' design: assume a flaw exists, calculate how many cycles it takes to reach critical size, and inspect well before then.\n\nParis’s law gives fatigue a clock: repeated loads should leave a detectable growth history, a prior indication, and characteristic progression toward critical size. Halloway’s complete scan covered the later origin without finding such a reflector, and the recovered surface lacks the broad fatigue region that years of truck cycles would produce. The absence does not prove perfect steel, but paired with the sudden bridge acceleration and vessel timing it makes a long missed reinspection story less credible than a new high-energy event.","frame":"Marks the later origin on the prior scan coverage map. “Fatigue needs a clock and a detectable history. Show me what their absence means before you blame a missed interval.”","q":[{"q":"What does Paris’s law relate?","o":[{"t":"Bridge deflection to river current and the height of floodwater.","v":"wrong","fb":"Those variables concern structural and hydraulic response, not fatigue-crack growth."},{"t":"Impact force to the speed and mass of a striking vessel.","v":"partial","fb":"Impact mechanics can be calculated, but Paris’s law addresses repeated cyclic loading."},{"t":"Crack growth mainly to the number of years since the bridge opened.","v":"danger","fb":"Traffic cycles and stress range matter more directly than calendar time alone."},{"t":"Fatigue-crack growth per load cycle to the range of stress intensity.","v":"expert","fb":"The law predicts how repeated loading advances a crack through its stable-growth regime."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"A complete prior scan covered the eventual origin and found no crack-growth indication before the event."}},{"q":"Why does a growing fatigue crack accelerate near the end of life?","o":[{"t":"As the crack lengthens, stress-intensity range rises and each cycle advances it farther.","v":"expert","fb":"The same traffic cycle becomes more damaging as the crack grows and amplifies tip stress."},{"t":"Steel chemically changes into a brittle material after a fixed number of trucks.","v":"wrong","fb":"Material condition matters, but the geometric growth of the crack drives increasing stress intensity."},{"t":"The final vehicle is assumed heavy enough to create the entire crack at once.","v":"danger","fb":"The last load may trigger failure after most of the crack developed over many ordinary cycles."},{"t":"Cracks move at a constant rate until they reach the far edge of the plate.","v":"partial","fb":"Paris behavior is not constant-rate; growth generally changes with stress-intensity range."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"Bridge sensors register the first impulse at the pier seconds before load redistributes into the span."}},{"q":"What finding would most weaken the theory of a fatigue crack missed by inspection?","o":[{"t":"A small prior indication that was scheduled for a timed return examination.","v":"partial","fb":"A prior indication would create the very crack-growth timeline the theory requires."},{"t":"Traffic growth that increased the number of stress cycles on the span.","v":"wrong","fb":"More cycles matter only if a flaw existed and grew at the relevant location."},{"t":"A complete scan of the origin showing no reflector, then fresh overload tearing.","v":"expert","fb":"Coverage at the later origin plus fresh morphology removes the expected fatigue history."},{"t":"A repair deferral signed after engineers calculated an inspection window.","v":"danger","fb":"A signed deferral would support institutional neglect rather than sudden impact."}],"clue":{"category":"who","label":"WHO — corroboration","text":"AIS timing and a fresh hull repair place the same vessel against the pier during the bridge’s first acceleration spike."}}]},"br_wells":{"sci":"Alan A. Wells (1924-2005)","topic":"Crack-tip opening displacement","lede":"The welding engineer who measured how far a crack yawns open before it runs, and gave shipyards and bridge shops a test they could trust.","no":3,"profile":"Alan A. Wells was a British engineer at the Welding Institute who, around 1961, gave the profession a fracture parameter suited to the tough, weldable steels used in ships, pipelines, and bridges. Irwin's linear elastic fracture mechanics assumes only a small pocket of yielding at a crack tip, but structural steel — especially near welds — yields a great deal before it breaks. Wells needed a measurable quantity that stayed meaningful once the metal at the tip had plastically deformed.\n\nHis idea was crack-tip opening displacement, or CTOD: as load rises, a sharp crack blunts and its faces separate by a measurable amount, and fracture occurs when that opening reaches a critical value characteristic of the material. CTOD can be measured in a laboratory test on a notched specimen and used to judge whether a real flaw in a real structure is tolerable. It became a cornerstone of engineering-critical-assessment procedures and welding standards, letting engineers set safe flaw sizes for steel that is too ductile for purely elastic analysis.\n\nWells’s crack-opening work helps interpret the final tear as ductile overload rather than assume all large fractures share one history. The structural evidence must then be joined to navigation records: AIS position, tow timing, impact marks, paint chemistry, and a fresh hull repair. Together they place the initiating force at the pier and identify the vessel operator who altered the voyage record afterward. Fracture mechanics remains central, but here it confirms the dramatic explanation instead of replacing it. The navigation record supplies the final independent comparison.","frame":"Lays the towboat’s AIS trace over bridge accelerometer timing and a hull-repair photograph. “The steel gives the force; the navigation record gives the hand behind it.”","q":[{"q":"What does crack-tip opening displacement measure?","o":[{"t":"How much the whole bridge deck moves vertically under one truck.","v":"wrong","fb":"Deck deflection is a global response, while CTOD is a local crack-tip measure."},{"t":"How far the crack faces separate near the tip as the material deforms.","v":"expert","fb":"CTOD gives a practical measure of fracture resistance in elastic-plastic materials such as structural steel."},{"t":"How wide an impact dent needs to be before it is classified as a barge strike.","v":"partial","fb":"Impact geometry is different from the opening displacement used in fracture assessment."},{"t":"How quickly rust color spreads across a newly painted gusset plate.","v":"danger","fb":"Surface appearance cannot replace a mechanical crack-tip assessment."}],"clue":{"category":"what","label":"WHAT — decisive","text":"A timed towboat contact supplied the sudden load that initiated failure; neither progressive fatigue nor exceptional scour fits the joined record."}},{"q":"Why is CTOD useful for welded structural steel?","o":[{"t":"It assumes the entire member remains perfectly brittle until it shatters.","v":"wrong","fb":"CTOD was developed precisely to handle significant plasticity near the crack tip."},{"t":"It converts every crack into a harmless rounded notch during service.","v":"danger","fb":"Measurement does not blunt or repair the defect; it estimates resistance and margin."},{"t":"It replaces inspection because a design value remains valid for every future flaw.","v":"partial","fb":"Assessment needs the actual crack, load, material state, and updated inspection data."},{"t":"It accounts for plastic deformation near a crack before unstable fracture.","v":"expert","fb":"Structural steels may yield locally, so a practical toughness measure must include elastic-plastic behavior."}],"clue":{"category":"where","label":"WHERE — decisive","text":"Impact marks, hull geometry, navigation timing, and the structural response all converge at the Piers & Navigation Channel."}},{"q":"Which joined record most directly identifies the source of the sudden bridge load?","o":[{"t":"AIS timing, pier marks, hull damage, and a captain’s altered tow log.","v":"expert","fb":"Independent navigation and physical records connect one vessel to the impact."},{"t":"A maintenance estimate for repairing an unrelated gusset connection.","v":"partial","fb":"An unrelated repair estimate does not establish the initiating event."},{"t":"A flood bulletin describing elevated river levels upstream of the bridge.","v":"wrong","fb":"High water alone does not match the contact marks and vessel timing."},{"t":"A state inspection report issued after the span had already collapsed.","v":"danger","fb":"Post-event inspection describes consequences, not the source of the load."}],"clue":{"category":"who","label":"WHO — decisive","text":"The towboat captain altered the voyage log after the collision while the authority and maintenance records remained internally consistent."}}]}},"story":["<b>The Halloway Span fell in seconds, but its steel can still say whether the fatal load arrived suddenly or grew unseen.<\/b>","Rigger Tom Vasa can read the torn connection. The NDT Technician has the last complete scan. The Navigation Records Clerk can join bridge sensors to vessel movement.","A hidden fatigue crack, exceptional scour, and a direct vessel strike each predict a different fracture surface and event sequence.","The nine clues must connect the first physical impulse, its location, and the operator responsible for it."],"endings":{"overclaimWhat":"br_fatigue","dismissalWhat":"br_flood","win":{"expertTitle":"The Towboat at the Pier","expert":["You connect Marlow Venn, the Piers & Navigation Channel, and a vessel impact that initiated the span failure. Fresh overload tearing, paint transfer, sensor timing, and hull damage form one event.","The fatigue theory overreads the field merely because fracture mechanics is involved; the scour theory cannot explain the contact marks or timed impulse. The dramatic answer is the one the evidence earns here."],"soundTitle":"The Impact Sequence","sound":["Your accusation identifies the captain, the pier, and the vessel strike.","Some fracture or navigation details remain missing, but the fresh morphology and event timing support the conclusion."],"namedTitle":"Right Collision, Thin Reconstruction","named":["You select the correct actor, location, and mechanism.","The verdict holds, although missed clues leave parts of the scan history, hull match, or timing chain incomplete."]},"overclaim":{"title":"The Fatigue Story Became the Overreach","body":["The prior scan covered the origin, and the recovered surface lacks the long oxidized growth region expected from a missed fatigue crack.","Institutional neglect is plausible in many bridge cases, but here it is the tempting systemic story that the physical evidence rejects."]},"dismissal":{"title":"Scour Does Not Leave a Towboat’s Signature","body":["Exceptional water levels cannot account for marine paint, matching hull damage, and a synchronized impulse at the navigation-side pier.","The event was sudden, but it was not an untraceable act of the river."]},"wrongNames":{"title":"The Impact, Assigned Elsewhere","body":["You recognize a vessel strike but misidentify the operator or move the initiating event away from the pier where all records converge."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"m_stadium","title":"The Coronet Arena Roof","discipline":"Structures & Crowd Dynamics","venue":"the Coronet Arena inquiry","agent":{"name":"Investigator Priya Lund","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Structures & Crowd Pioneers","dossierName":"STRUCTURES & CROWD-DYNAMICS PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Coronet Arena inquiry","DAYS_TOTAL":3,"teaser":"An arena roof folds during a sold-out winter event. Did an explosion cut the load path, did an unauthorized connection remove the design margin, or did an extraordinary snow drift exceed what a compliant roof was required to carry?","overclaimTag":"an explosive break in the roof structure","truthTag":"a rare snow drift beyond the approved design basis","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A long-span arena roof with a failed central connection above a loaded stand\"><path d=\"M70 92 Q330 18 590 92\" fill=\"none\" stroke=\"#121212\" stroke-width=\"4\"/><path d=\"M100 92 Q330 42 560 92\" fill=\"none\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><path d=\"M130 92 v22 M200 72 v42 M330 54 v60 M460 72 v42 M530 92 v22\" stroke=\"#121212\" stroke-width=\"2\"/><circle cx=\"330\" cy=\"54\" r=\"8\" fill=\"none\" stroke=\"#B3261E\" stroke-width=\"3\"/><path d=\"M320 44 l20 20 M340 44 l-20 20\" stroke=\"#B3261E\" stroke-width=\"2\"/><path d=\"M180 112 h300\" stroke=\"#326891\" stroke-width=\"3\"/><\/svg>","overclaimTease":"A spectacular collapse does not guarantee misconduct. Compare the installed node with the drawings, the crowd with its operating envelope, and the measured drift with the design return period.","CATS":{"who":{"title":"Who bears responsibility","truth":"st_storm","items":[{"id":"st_storm","label":"An act of nature — a record storm, not a person"},{"id":"st_developer","label":"Vaughn Kroll — arena developer"},{"id":"st_engineer","label":"The structural engineer of record"}]},"where":{"title":"Where it culminates","truth":"st_roof","items":[{"id":"st_stand","label":"The Stand & Concourse"},{"id":"st_roof","label":"The Roof Trusses & Snow-Drift Zone"},{"id":"st_office","label":"The Developer’s Project Office"}]},"what":{"title":"What happened","truth":"st_snow","items":[{"id":"st_bomb","label":"An explosive event severed the roof’s primary load path"},{"id":"st_connection","label":"An unauthorized weaker node failed under ordinary service loads"},{"id":"st_snow","label":"A code-exceeding snow drift overloaded a compliant roof zone"}]}},"READING_ORDER":["st_erector","st_steward","st_clerk"],"CHARACTERS":{"st_erector":{"name":"Steelworker Bo Renn","role":"Roof steel erector","face":"🔧","badge":"B","legend":"the roof truss","hint":"The failed node matches the issued detail in plate thickness, bolt count, and installation records.","reading":"st_shukhov"},"st_steward":{"name":"The Head Steward","role":"Crowd-safety steward","face":"📣","badge":"S","legend":"the loaded stand","hint":"Crowd density and synchronized motion stayed within the event envelope used for the approved design.","reading":"st_fruin"},"st_clerk":{"name":"The Project Records Clerk","role":"Design-change records clerk","face":"🗂","badge":"C","legend":"the developer’s office","hint":"Independent review finds no hidden substitution; the localized snow drift exceeded the code basis and original reliability target.","reading":"st_cornell"}},"TOPICS":{"st_shukhov":{"sci":"Vladimir Shukhov (1853-1939)","topic":"Steel lattice shells & tension roofs","lede":"The Moscow engineer who roofed vast halls with a net of steel decades before anyone had a name for what he was doing.","no":1,"profile":"Vladimir Shukhov was a Russian engineer of extraordinary range — oil pipelines, refineries, bridges, and, above all, some of the lightest long-span roofs ever built. Working in Moscow from the 1880s, he invented the steel lattice gridshell and the hanging steel roof decades before either had a name. For the 1896 All-Russian exhibition at Nizhny Novgorod he roofed enormous halls with thin steel membranes and curved lattices that weighed a fraction of anything comparable, hanging some roofs from a mesh of steel like an upturned tent.\n\nShukhov's insight was that form does the work. A curved lattice of slender bars, or a surface held in pure tension, can span an enormous distance on very little metal — if every member and every joint carries exactly the force the geometry demands. He calculated those forces meticulously and raised the famous hyperboloid Shukhov Tower from straight steel members arranged on a curved surface, proving that honest geometry could replace sheer mass.\n\nBut such structures are only as strong as their nodes. In a lattice shell or a tension roof the loads funnel through connections where many members meet, and each joint must be built to the design or the surface loses the path its force was meant to follow. Shukhov detailed his connections as carefully as his curves.\n\nShukhov’s work makes connections the first place to look, but it also gives investigators a way to clear them. At Coronet, bolt count, plate thickness, welds, and geometry match the issued detail, while fracture starts only after the roof zone carries an extreme asymmetric drift. A light lattice is not invulnerable; it is efficient within the loads for which its path was proportioned. The absence of an altered node matters as much as finding one would have mattered.","frame":"Checks bolt count, plate thickness, and weld geometry against the issued node detail. “A connection can be cleared as carefully as it can be condemned. Start with what was actually built.”","q":[{"q":"What allowed Shukhov’s long-span roofs to use so little material?","o":[{"t":"Heavy roof decking spread every load evenly without relying on joints.","v":"wrong","fb":"His light systems depended strongly on lattice geometry and connection behavior."},{"t":"Geometry directed forces through efficient lattice and tension load paths.","v":"expert","fb":"Shukhov used structural form to carry load with slender members rather than relying on mass."},{"t":"Thin steel stayed safe because weather loads barely affect flexible roof structures.","v":"danger","fb":"Lightweight structures still require designed paths for wind, snow, and service loads."},{"t":"Large masonry walls carried most loads while the roof served as decoration.","v":"partial","fb":"Supports receive forces, but the roof system actively spans and distributes them."}],"clue":{"category":"what","label":"WHAT — lead","text":"No blast residue or cut load path appears, and the node dimensions match the approved design."}},{"q":"Why are nodes critical in a lattice roof?","o":[{"t":"They transfer forces among members and preserve the intended load path.","v":"expert","fb":"A weak or altered node can interrupt force distribution across the entire structural form."},{"t":"They matter mainly for appearance because forces remain inside each member.","v":"wrong","fb":"Members must exchange tension and compression through connections."},{"t":"Any node failure indicates an explosive force acted at the connection.","v":"danger","fb":"Connections can fail from inadequate capacity under ordinary structural demand."},{"t":"Nodes carry dead weight rather than changing event or weather loads.","v":"partial","fb":"Connections transmit the full combination of loads assigned by the structural system."}],"clue":{"category":"who","label":"WHO — lead","text":"Field measurements show the critical node matches the engineer’s issued dimensions and the erector’s installation record."}},{"q":"Which finding would clear the node substitution theory?","o":[{"t":"A witness recalls a sharp sound as the roof began to move.","v":"partial","fb":"A sound is compatible with many failure mechanisms and proves no substitution."},{"t":"The developer once requested cost reductions on another arena package.","v":"wrong","fb":"Other cost requests do not establish a change at this connection."},{"t":"The failed joint looks small compared with the size of the roof span.","v":"danger","fb":"Efficient joints can look small while still matching their calculated demand."},{"t":"Installed plates, bolts, welds, and geometry all match the issued detail.","v":"expert","fb":"A complete dimensional match removes the alleged unauthorized weakening."}],"clue":{"category":"where","label":"WHERE — lead","text":"Failure begins beneath a sharply localized roof drift rather than at the concourse, office, or a blast point."}}]},"st_fruin":{"sci":"John J. Fruin (pedestrian-dynamics researcher)","topic":"Pedestrian level of service & crowd density","lede":"The traffic engineer who counted people the way others count cars, and turned a packed stand into a number you can weigh.","no":2,"profile":"John J. Fruin was an American traffic engineer who did for crowds what highway engineers had done for cars: he measured them. His 1971 book 'Pedestrian Planning and Design' introduced the pedestrian 'Level of Service,' a scale from A to F describing how freely people can move as a space fills, keyed to a hard number — density in persons per square metre. At low density people walk unimpeded; as density climbs past roughly four or five people per square metre, movement seizes up and the crowd begins to behave like a fluid, transmitting dangerous forces body to body.\n\nFruin later wrote directly about 'The Causes and Prevention of Crowd Disasters,' documenting how overcrowding kills — not by panic, as the myth goes, but by sheer density, where the pressure of packed bodies can bend steel railings and stop breathing. His work underpins modern venue capacity limits, egress calculations, and the posted counts that a steward is supposed to enforce.\n\nFor a structural inquiry, Fruin adds a second meaning to a crowd's density: it is also a load. Building codes assign a stand a live load per square metre based on an assumed, limited occupancy. Pack that stand far past its posted count — standing spectators crammed where seated numbers were assumed — and the weight bearing on the structure climbs well above what the design may have quietly counted on, especially if the design already trimmed its margins.\n\nFruin’s methods keep the crowd from becoming an easy scapegoat. Turnstile counts, video density, movement frequency, and concourse flow all remained within the event envelope used in the arena’s approved analysis. The spectators contributed real live and dynamic load, but not an unprecedented one. The unusual demand came from the roof itself, where wind deposited a deep drift over one structural bay while leaving nearby areas comparatively light.","frame":"Reconstructs density and movement spectra from turnstiles and video. “A crowd is measurable load, not an adjective. Put its demand inside or outside the approved envelope.”","q":[{"q":"What did Fruin’s pedestrian level-of-service work quantify?","o":[{"t":"How roof snow depth changes the tensile strength and stiffness of structural steel.","v":"wrong","fb":"That belongs to structural and material analysis rather than pedestrian dynamics."},{"t":"How loud crowd noise needs to be before it creates a damaging pressure wave.","v":"danger","fb":"Acoustic excitement does not function like an explosion in the roof structure."},{"t":"How density and available space affect walking speed, comfort, and flow.","v":"expert","fb":"Fruin translated crowd conditions into measurable relationships rather than impressionistic descriptions."},{"t":"How many seats a venue can sell without considering circulation or density.","v":"partial","fb":"Capacity is not only seat count; movement and local crowding matter."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"The crowd remained within its operating envelope while the roof drift exceeded the snow distribution used in design."}},{"q":"Why are synchronized crowd movements different from static headcount?","o":[{"t":"Synchronization removes weight because participants are briefly airborne.","v":"wrong","fb":"Average weight remains and repeated impacts can add dynamic demand."},{"t":"Rhythmic motion can create dynamic forces that vary in time and frequency.","v":"expert","fb":"People moving together can amplify structural response compared with the same mass standing still."},{"t":"Any rhythmic crowd indicates the roof failed chiefly from spectator behavior.","v":"danger","fb":"Dynamic loading must be compared with structural capacity and the approved design case."},{"t":"Crowd density dominates, so timing and movement can be ignored.","v":"partial","fb":"Density affects flow and load, while motion affects dynamic response."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"Snow mapping places the peak load over one truss bay while neighboring roof areas carried far less accumulation."}},{"q":"What evidence would show that the crowd was not the exceptional load?","o":[{"t":"Counts and movement spectra remain within the approved event envelope.","v":"expert","fb":"Measured demand within the design envelope rules out an unprecedented crowd case."},{"t":"The crowd was loud enough to be heard outside the arena walls.","v":"partial","fb":"Noise level does not measure structural force or occupancy demand."},{"t":"Several spectators jumped at the same moment during the performance.","v":"wrong","fb":"Synchronized movement matters only after its frequency and magnitude are quantified."},{"t":"The final roof shape appears to lean toward the occupied stand.","v":"danger","fb":"Collapse geometry cannot reconstruct crowd loading by itself."}],"clue":{"category":"who","label":"WHO — corroboration","text":"Crowd operations stayed inside approved limits, and inspection files show no unreviewed construction change or missed defect."}}]},"st_cornell":{"sci":"C. Allin Cornell (1938-2007)","topic":"Structural reliability & load factors","lede":"The engineer who put a number on safety itself, and showed that the margin in a roof is exactly what a cut corner spends.","no":3,"profile":"An American civil engineer, C. Allin Cornell helped turn structural safety from a matter of tradition into a matter of probability. Working from the 1960s onward, he was a founder of structural reliability theory and, with colleagues, of probabilistic seismic hazard analysis — the framework now used worldwide to reckon the earthquake, wind, and snow demands a structure must survive. He gave engineers the 'reliability index,' a way to measure how far a design sits from failure in the face of uncertainty.\n\nCornell's insight was that both the loads on a structure and its strength are uncertain, scattered quantities, not single fixed values. The snow that falls, the crowd that packs a stand, the true strength of a welded joint — all vary. Safety therefore cannot be a single lucky guess; it must be a deliberate margin sized so that the chance of the load exceeding the strength is acceptably small. This thinking became load-and-resistance-factor design, in which loads are multiplied up and strengths factored down, precisely so that a rare combination — a full house on the day of a heavy snow — is still carried with room to spare.\n\nThat margin is the whole point, and it is exactly what a quiet substitution consumes. When a connection is downgraded below its specified capacity, the reliability index drops; the roof may still stand on an ordinary day, but the buffer meant to absorb the rare combined load is gone. The structure has been silently moved closer to the edge without anyone feeling it move.\n\nCornell’s reliability framework explains why a compliant structure can still fail without fraud or sabotage. Codes select load combinations and return periods; they reduce risk rather than abolish it. Coronet’s records show the installed roof matched the reviewed design, while post-event measurement places the localized snow load beyond the design basis. That combination supports a low-probability exceedance—not because weather excuses every failure, but because the measured resistance and load distributions leave no hidden human reduction to explain.","frame":"Places the verified resistance beside a mapped asymmetric snow drift. “Reliability reduces risk; it does not abolish events beyond the selected basis. Compare the distributions.”","q":[{"q":"What did Cornell’s structural reliability work add to design?","o":[{"t":"An assurance that a code-compliant structure will not fail in service.","v":"danger","fb":"Codes reduce risk but cannot provide absolute certainty, especially after unreviewed changes."},{"t":"A method for replacing engineering calculations with expert intuition.","v":"wrong","fb":"Reliability analysis formalizes uncertainty rather than avoiding calculation."},{"t":"A rule applying the largest imaginable load without considering probability.","v":"partial","fb":"Design considers extreme loads, but reliability combines their likelihood with resistance uncertainty."},{"t":"A probabilistic way to compare uncertain loads, resistance, and failure risk.","v":"expert","fb":"Reliability methods recognize variation and calibrate safety margins against target risk."}],"clue":{"category":"what","label":"WHAT — decisive","text":"A rare asymmetric snow load surpassed the verified resistance of a compliant roof zone; neither sabotage nor a hidden substitution is required."}},{"q":"Why must a value-engineering change be checked against combined loads?","o":[{"t":"Cheaper materials retain identical strength when their dimensions look similar.","v":"wrong","fb":"Material, geometry, fasteners, and detailing determine resistance."},{"t":"The original engineer’s calculation remains valid regardless of what is installed.","v":"danger","fb":"A changed component requires updated analysis because resistance and load distribution may change."},{"t":"Reducing resistance can erase margin needed when ordinary load cases occur together.","v":"expert","fb":"A connection acceptable for one load alone may fail under the combination the system must carry."},{"t":"Rare snow dominates because crowd loads disappear once people are seated.","v":"partial","fb":"Seated crowds still impose gravity load, and movement can add dynamic demand."}],"clue":{"category":"where","label":"WHERE — decisive","text":"Measured drift depth, member demand, and the first structural motion all converge in the Roof Trusses & Snow-Drift Zone."}},{"q":"When can a code-compliant roof still fail without hidden misconduct?","o":[{"t":"Whenever the owner can show that an occupancy certificate was issued.","v":"partial","fb":"A certificate supports compliance but does not prove the event exceeded the basis."},{"t":"When a measured load exceeds the code basis and the verified resistance.","v":"expert","fb":"Reliability design accepts a small residual probability beyond selected load levels."},{"t":"Only when an explosion destroys enough evidence to prevent reconstruction.","v":"wrong","fb":"Missing evidence is not the same as evidence for an unavoidable exceedance."},{"t":"When ordinary snow combines with a deliberately weakened connection.","v":"danger","fb":"That combination describes a design-change case, not a compliant rare event."}],"clue":{"category":"who","label":"WHO — decisive","text":"Independent resistance checks and complete records leave no candidate human action below standard; the remaining cause is the measured load exceedance."}}]}},"story":["<b>The Coronet roof collapsed during a storm severe enough to make every explanation feel convenient.<\/b>","Steelworker Bo Renn can compare the node with the drawings. The Head Steward has the crowd measurements. The Project Records Clerk can reconstruct design resistance and the weather basis.","An explosion, a secretly weakened connection, and a genuine code-exceeding drift all remain possible until load and resistance are placed on the same scale.","The case asks whether someone failed—or whether a low-probability event crossed the limit that sound design can reduce but never erase."],"endings":{"overclaimWhat":"st_bomb","dismissalWhat":"st_connection","win":{"expertTitle":"Beyond the Design Snow","expert":["You identify no culpable human actor, the Roof Trusses & Snow-Drift Zone, and a code-exceeding asymmetric snow load. The node matches the drawings, the crowd stayed within limits, and the measured drift surpassed verified resistance.","The blast theory lacks physical residue, while the hidden-substitution theory collapses under dimensional and record checks. This case is the rare one in which the apparent act-of-nature explanation survives technical scrutiny."],"soundTitle":"The Load Exceeded the Basis","sound":["Your verdict places the failure in the roof drift zone and recognizes a genuine design-basis exceedance without a culpable actor.","Some reliability or weather details remain incomplete, but the verified construction and measured load support the result."],"namedTitle":"Right Storm, Limited Margin Analysis","named":["You choose the correct responsibility finding, place, and mechanism.","The conclusion is right, although missed clues leave the exact drift or resistance comparison less fully established."]},"overclaim":{"title":"No Explosive Load Path","body":["Investigators find no residue, cutting, blast deformation, or outward pressure pattern.","The dramatic visual collapse came from gravity loading, not an explosive event."]},"dismissal":{"title":"The Hidden-Connection Story Was the False Systemic Answer","body":["The critical node matches the issued design and verified capacity; no unauthorized substitution appears in steel or records.","Assuming management neglect simply because it is common in other cases would ignore the measured code-exceeding drift."]},"wrongNames":{"title":"The Rare Event, Put in the Wrong Place","body":["You recognize the snow exceedance but assign human blame or move the initiating load away from the roof drift zone."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"m_tunnel","title":"The Kingsgate Bore","discipline":"Tunnelling & Ground Engineering","venue":"the Kingsgate tunnel inquiry","agent":{"name":"Inspector Mabel Crane","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Tunnelling & Ground Pioneers","dossierName":"TUNNELLING & GROUND-ENGINEERING PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Kingsgate tunnel inquiry","DAYS_TOTAL":3,"teaser":"A metro tunnel collapses and pulls the street into the excavation. Did gas burst through the crown, did a natural void fail on its own, or did construction-linked ground movement grow visibly while support and intervention lagged?","overclaimTag":"a gas ignition inside the tunnel","truthTag":"a construction-aligned settlement trough allowed to grow","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A soft-ground tunnel beneath a settling street with a void above the lining\"><path d=\"M20 46 H640\" stroke=\"#121212\" stroke-width=\"3\"/><path d=\"M60 46 q80 40 160 0 t160 0 t160 0\" fill=\"none\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><path d=\"M180 110 a70 70 0 0 1 140 0\" fill=\"none\" stroke=\"#121212\" stroke-width=\"5\"/><path d=\"M205 110 a45 45 0 0 1 90 0\" fill=\"none\" stroke=\"#326891\" stroke-width=\"2\"/><path d=\"M250 44 l-15 24 16 6 -10 30 34-40 -16-7 12-23z\" fill=\"#B3261E\"/><\/svg>","overclaimTease":"Compare the shape and timing recorded at the face, the street, and the project files. An explosion, a natural void, and construction-linked ground loss do not move the same way.","CATS":{"who":{"title":"Who is behind it","truth":"tn_contractor","items":[{"id":"tn_engineer","label":"The tunnel design engineer"},{"id":"tn_inspector","label":"The transit-authority inspector"},{"id":"tn_contractor","label":"Emil Radek — tunnelling contractor"}]},"where":{"title":"Where it culminates","truth":"tn_surface","items":[{"id":"tn_surface","label":"The Surface Settlement Network"},{"id":"tn_face","label":"The Tunnel Face & Shield"},{"id":"tn_office","label":"The Contractor’s Site Office"}]},"what":{"title":"What happened","truth":"tn_settlement","items":[{"id":"tn_explosion","label":"A gas ignition and pressure burst shattered the tunnel crown"},{"id":"tn_settlement","label":"Ground loss grew as grouting and monitoring fell behind"},{"id":"tn_sinkhole","label":"A natural void collapsed independently of construction"}]}},"READING_ORDER":["tn_miner","tn_surveyor","tn_clerk"],"CHARACTERS":{"tn_miner":{"name":"Miner Jud Kolb","role":"Tunnel-face miner","face":"⛏️","badge":"J","legend":"the shield","hint":"Short grout runs left annular void behind the shield as production targets tightened.","reading":"tn_marcbrunel"},"tn_surveyor":{"name":"The Monitoring Surveyor","role":"Ground-settlement surveyor","face":"📐","badge":"S","legend":"the street network","hint":"Street markers formed a widening trough that tracked the tunnel advance for days.","reading":"tn_greathead"},"tn_clerk":{"name":"The Site Records Clerk","role":"Construction records clerk","face":"🗂","badge":"C","legend":"the contractor office","hint":"One contractor directive cut grout, raised intervention limits, and ordered work to continue through the measured movement.","reading":"tn_rabcewicz"}},"TOPICS":{"tn_marcbrunel":{"sci":"Marc Isambard Brunel (1769-1849)","topic":"The tunnelling shield","lede":"The émigré engineer who watched a shipworm chew through oak and copied its armored head to drive the first tunnel under a river.","no":1,"profile":"Marc Isambard Brunel was a French-born engineer who, after fleeing the Revolution and building a career in Britain, solved one of the oldest problems in civil engineering: how to dig through soft, waterlogged ground without the roof collapsing on the miners. His inspiration was biological. Watching the shipworm Teredo navalis bore through ship timber, its soft body shielded by hard plates at the head while it lined the hole behind it, he patented in 1818 a tunnelling shield that did the same for men.\n\nBrunel's shield was a great iron frame divided into cells, one miner to each, that held back the earth at the face while workers removed a board's width of soil at a time. As the shield inched forward on screws, bricklayers followed immediately behind, building the permanent lining before the ground could move. With it he drove the Thames Tunnel between Rotherhithe and Wapping from 1825 to 1843 — the first tunnel successfully built beneath a navigable river — through gravel, quicksand, and repeated floods that nearly killed his son Isambard Kingdom Brunel.\n\nAt Kingsgate, Brunel’s principle appears in the gap behind a modern shield. The machine advanced, but tail-void grouting repeatedly stopped short of the specified quantity. Soft ground then had space to migrate toward the lining and surface. The contractor’s production directive explains why support lagged, yet the event culminates in the settlement network: the surface profile records the consequence metre by metre and ties it to the shield’s passage. The geometry preserves that sequence clearly.","frame":"Points from the shield tail to the fresh lining and the annular gap between them. “Soft ground takes every space you leave. Tell me why support must follow the excavation.”","q":[{"q":"What problem did Brunel’s tunnelling shield solve?","o":[{"t":"It detected explosive gas before workers entered a new section.","v":"partial","fb":"Gas safety matters, but the shield was invented to support unstable ground during excavation."},{"t":"It drilled hard rock faster by concentrating impact at one cutter.","v":"wrong","fb":"Brunel’s shield addressed soft, waterlogged ground rather than hard-rock boring."},{"t":"It supported soft wet ground at the face while permanent lining followed.","v":"expert","fb":"The shield protected miners and controlled the ground until masonry could hold the opening."},{"t":"It allowed the ground to collapse freely and then filled the crater afterward.","v":"danger","fb":"Controlled support prevents ground loss; accepting collapse would endanger the tunnel and surface."}],"clue":{"category":"what","label":"WHAT — lead","text":"Shortened tail-void grouting left room for soft ground to migrate toward the lining and surface."}},{"q":"What did Brunel borrow from the shipworm?","o":[{"t":"A chemical secretion that dissolves soil ahead of the cutting face.","v":"wrong","fb":"The inspiration concerned physical shielding and lining, not chemical excavation."},{"t":"The ability to sense methane pockets before the cutting head reached them.","v":"partial","fb":"Shipworms did not provide the gas-detection principle."},{"t":"A method for moving fast enough that clay could not settle behind the shield.","v":"danger","fb":"Speed without support can increase ground loss rather than prevent it."},{"t":"An armored head that advances while the opening is lined immediately behind.","v":"expert","fb":"The biological model combined protected excavation with prompt support of the new hole."}],"clue":{"category":"who","label":"WHO — lead","text":"Face crews recorded shortened grout runs, but the quantity reduction came from the contractor controlling production targets."}},{"q":"Where is the effect of support lag most clearly reconstructed over time?","o":[{"t":"At the shield controls showing the machine’s daily production rate.","v":"partial","fb":"Production rate supplies context but does not measure surface movement."},{"t":"Across the surface markers that deepen behind the advancing shield.","v":"expert","fb":"The settlement network records the moving ground response before failure."},{"t":"Inside the site office where the reduced grout instruction was signed.","v":"wrong","fb":"The office identifies decisions rather than the physical culmination."},{"t":"In one photograph of the street after the final collapse occurred.","v":"danger","fb":"A final image cannot recover the earlier time-dependent trough."}],"clue":{"category":"where","label":"WHERE — lead","text":"The first coherent signal is a shallow settlement trough centered over the tunnel alignment behind the shield."}}]},"tn_greathead":{"sci":"James Henry Greathead (1844-1896)","topic":"The shield & compressed-air tunnelling","lede":"The South-African-born engineer who fused shield, compressed air, and cement grout into the recipe that dug London's deep tube — and named the void that grout must fill.","no":2,"profile":"James Henry Greathead was a civil engineer, born in South Africa and trained in Britain, who took the tunnelling shield from a clever prototype to a mature system. Having worked with Peter Barlow on the Tower Subway in 1869, he went on to build the City & South London Railway, opened in 1890 — the world's first deep-level electric underground railway — using a refined circular shield that became the template for the whole London 'tube.'\n\nGreathead's genius was combination. He drove his shield through wet ground and used compressed air to hold back water where the ground was worst, balancing the air pressure against the water trying to seep in. Most important for this case, he perfected grouting: as the shield advanced, cement grout was pumped under pressure into the annular gap left between the excavated bore and the iron lining behind the shield's tail. This filled the void, locked the lining against the surrounding soil, and stopped the ground from relaxing inward. The tool he used, the grout injector, is still called a Greathead grout pan.\n\nGreathead’s immediate lining and grouting were designed to prevent exactly the volume loss measured at Kingsgate. Survey points formed a broad, construction-aligned trough behind the shield rather than ejecta from an explosion or a localized collapse over an unrelated cavity. Because the trough deepened before the final cave-in, the surface network is not merely aftermath. It is the primary time series showing that the ground-loss mechanism was active, detectable, and still accelerating. It is a moving construction signature.","frame":"Overlays settlement contours on the tunnel alignment and circles the widening trough behind the shield. “Ground loss draws a shape at the surface. Read it before calling the hole natural.”","q":[{"q":"What combination made Greathead’s shield tunnelling effective in soft ground?","o":[{"t":"A cylindrical shield, compressed air, segmental lining, and grout behind it.","v":"expert","fb":"The system controlled the face, built support, and filled the gap around the completed lining."},{"t":"Open excavation from the surface followed by rebuilding the street.","v":"wrong","fb":"Greathead’s method enabled deep tunnelling without a continuous open trench."},{"t":"Explosive charges fired ahead of the shield to loosen wet clay.","v":"danger","fb":"Blasting is not the defining soft-ground method and would increase disturbance."},{"t":"A shield alone, with the surrounding ground left to close around the lining.","v":"partial","fb":"The annular void must be managed; grout is essential to limiting movement."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"The movement geometry follows construction and lacks the radial damage expected from a pressure burst."}},{"q":"Why is grout injected behind segmental tunnel lining?","o":[{"t":"To increase gas pressure so the face remains easier to excavate.","v":"wrong","fb":"Grout supports the ground; it is not a gas-pressure control medium."},{"t":"To conceal cracks in lining segments from later inspectors.","v":"danger","fb":"Proper grouting is a structural and ground-control operation, not a cosmetic cover."},{"t":"To fill the tail void and limit movement of surrounding ground.","v":"expert","fb":"Unfilled annular space permits soil to migrate and settlement to reach the surface."},{"t":"To lubricate the finished tunnel permanently for train operation.","v":"partial","fb":"Lubrication is not the purpose; filling and support are."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"Successive surveys show the trough widening and deepening in step with construction rather than remaining a fixed natural depression."}},{"q":"Which surface pattern most strongly links the collapse to shield tunnelling?","o":[{"t":"One circular depression fixed above an old natural cavity far from the face.","v":"partial","fb":"A fixed isolated depression would better support a natural cavity."},{"t":"Radial debris and pressure damage extending outward from the tunnel crown.","v":"wrong","fb":"Radial pressure damage would support an energetic burst instead of settlement."},{"t":"Random marker changes without spatial or temporal relation to construction.","v":"danger","fb":"Unstructured noise cannot establish a construction-linked mechanism."},{"t":"A widening trough centered on the alignment and following the shield advance.","v":"expert","fb":"A moving alignment-centered trough is the expected signature of construction volume loss."}],"clue":{"category":"who","label":"WHO — corroboration","text":"Survey alerts reached the contractor while advance continued without restoring grout or pausing the shield."}}]},"tn_rabcewicz":{"sci":"Ladislaus von Rabcewicz (1893-1975)","topic":"The New Austrian Tunnelling Method","lede":"The Austrian engineer who stopped fighting the ground and let it carry its own weight — but only if you measured its every move.","no":3,"profile":"Ladislaus von Rabcewicz was an Austrian civil engineer who, drawing on decades of Alpine tunnelling, formalised in the 1960s what he named the New Austrian Tunnelling Method, or NATM. His central idea overturned an old assumption. Earlier practice treated the ground as a dead load to be held up by a heavy, rigid lining. Rabcewicz argued that the surrounding rock or soil is itself a structural element: if you support it just enough, and let it deform a controlled amount, the ground arches around the opening and carries most of the load itself.\n\nThe method uses a thin, flexible initial support — sprayed concrete (shotcrete) and rock bolts — applied quickly, then permits measured deformation before a final lining goes in. What makes it work, and what makes it dangerous when abused, is monitoring. NATM demands continuous measurement of how the tunnel converges: extensometers, load cells, and survey targets track every millimetre of movement, and the support is adjusted in response. The ground is allowed to move, but only within limits the instruments confirm.\n\nRabcewicz’s observational method turns measurements into decisions. Kingsgate’s convergence and settlement crossed the original action levels, but the contractor raised those levels while cutting grout and maintaining advance. The directive identifies authority; the surface network establishes the failure’s culmination and timing. Together they show a monitored construction process drifting outside its control envelope, not a hidden gas burst or an independent geological surprise. The instruments therefore document both warning and consequence before the pavement finally gives way. Clearly.","frame":"Lays convergence readings and surface alarms beside the directive that raised stop-work thresholds. “Observation only protects you if the measured movement is allowed to change the work.”","q":[{"q":"What is central to the observational approach associated with Rabcewicz and modern tunnelling?","o":[{"t":"Fix every support decision permanently before excavation begins and ignore later movement.","v":"wrong","fb":"Observational tunnelling depends on adapting to measured conditions."},{"t":"Install support, measure ground response, and adjust construction as behavior develops.","v":"expert","fb":"The method treats monitoring as feedback that informs support and sequence."},{"t":"Allow large deformation because ground movement tends to strengthen a tunnel.","v":"danger","fb":"Controlled deformation can mobilize strength, but excessive movement is a warning requiring action."},{"t":"Rely on experienced workers’ impressions instead of instruments and surveys.","v":"partial","fb":"Experience matters, yet quantified monitoring is essential to the feedback loop."}],"clue":{"category":"what","label":"WHAT — decisive","text":"Ground loss crossed the original intervention limits while work continued under raised thresholds, turning a detected trend into collapse."}},{"q":"Why is changing a settlement trigger after movement begins dangerous?","o":[{"t":"It relabels an escalating response without reducing the underlying deformation.","v":"expert","fb":"A higher threshold changes the rule, not the ground or its trend."},{"t":"It improves safety because fewer alarms allow the team to focus on production.","v":"partial","fb":"Suppressing warnings cannot make the physical response safer."},{"t":"It proves the original trigger was scientifically incorrect from the start.","v":"wrong","fb":"A revision needs new evidence; timing alone does not invalidate the first limit."},{"t":"It prevents surface markers from recording further movement above the tunnel.","v":"danger","fb":"Instrumentation continues to measure movement regardless of the chosen trigger."}],"clue":{"category":"where","label":"WHERE — decisive","text":"The full movement history—from early drift to street collapse—is preserved in the Surface Settlement Network."}},{"q":"Which record most directly identifies the accountable authority?","o":[{"t":"The design engineer’s original support plan and monitoring intervention limits.","v":"partial","fb":"The original plan defines the safe baseline but not who authorized departure."},{"t":"The transit inspector’s emergency report and closure order written after collapse.","v":"wrong","fb":"Later findings do not replace the contemporaneous change directive."},{"t":"The signed directive reducing grout and raising intervention limits for schedule.","v":"expert","fb":"One decision links the weakened support and muted monitoring response to the contractor in control."},{"t":"An unsupported theory that a gas pocket vanished after producing the collapse.","v":"danger","fb":"A disappearing-cause theory cannot outweigh progressive movement and construction records."}],"clue":{"category":"who","label":"WHO — decisive","text":"One contractor signed the combined directive cutting support, raising action levels, and ordering uninterrupted advance."}}]}},"story":["<b>Kingsgate’s street did not disappear without warning; its survey points had been moving before the pavement opened.<\/b>","Miner Jud Kolb knows what was left behind the shield. The Monitoring Surveyor holds the surface time series. The Site Records Clerk has the production and trigger changes.","A gas burst, a natural void, and construction-linked ground loss produce different shapes in space and time.","The case turns on who let support lag, where the movement became undeniable, and whether the warnings were changed instead of answered."],"endings":{"overclaimWhat":"tn_explosion","dismissalWhat":"tn_sinkhole","win":{"expertTitle":"The Trough Behind the Shield","expert":["You connect Emil Radek, the Surface Settlement Network, and ground loss caused by shortened grouting and raised intervention thresholds.","The alignment-centered moving trough rejects a gas burst and an independent sinkhole. The contractor’s combined directive explains why the detectable movement was allowed to deepen."],"soundTitle":"The Settlement Record","sound":["Your accusation identifies the contractor, the surface network, and construction-linked ground loss.","Some grout or threshold details remain incomplete, but the spatial and temporal pattern supports the conclusion."],"namedTitle":"Right Mechanism, Thin Survey","named":["You select the correct person, place, and mechanism.","The verdict holds, though missed clues leave parts of the settlement progression or directive chain less complete."]},"overclaim":{"title":"No Pressure-Burst Pattern","body":["The ground moved as a widening trough behind the shield, without radial crown damage or ejecta.","The dramatic final collapse should not be mistaken for evidence of an explosion."]},"dismissal":{"title":"The Void Followed the Work","body":["A natural cavity would not normally track the shield alignment and advance over successive surveys.","The monitored geometry ties the ground loss to construction rather than fate."]},"wrongNames":{"title":"The Settlement, Misassigned","body":["You recognize construction-linked ground loss but place authority or culmination away from the contractor and surface network that establish the chain."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"m_tailings","title":"The Serra Verde Tailings Dam","discipline":"Slope Stability & Soil Liquefaction","venue":"the Serra Verde tailings inquiry","agent":{"name":"Inspector Rui Alvares","role":"Investigator's Notepad"},"standingLabel":"Engineering credibility","readingShort":"Pioneers","readingLabel":"Slope & Soil Pioneers","dossierName":"SLOPE-STABILITY & SOIL PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Serra Verde tailings inquiry","teaser":"A tailings dam liquefies moments after a sharp local pulse. Did an unauthorized production blast trigger the failure, did exceptional rain overtop the crest, or had static pore pressure already reached collapse without any external shock?","overclaimTag":"an unreported blast beside the dam","truthTag":"a real blasting pulse triggering cyclic liquefaction","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A tailings dam with a pressure spike after a nearby blast\"><path d=\"M50 112 L250 36 L430 112 Z\" fill=\"none\" stroke=\"#121212\" stroke-width=\"3\"/><path d=\"M250 36 L500 36 L610 112\" fill=\"none\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><path d=\"M470 75 l-14-24 18 5 -4-28 25 30 -18-3 8 24z\" fill=\"#B3261E\"/><path d=\"M120 96 v-42 M170 88 v-42 M220 75 v-42\" stroke=\"#326891\" stroke-width=\"2\"/><path d=\"M102 102 C148 88,190 105,238 84\" fill=\"none\" stroke=\"#326891\" stroke-width=\"2\"/><\/svg>","overclaimTease":"A blast explanation is dramatic but testable: the seismic pulse must precede the pore-pressure jump, match an industrial source, and connect to a party controlling the explosives.","DAYS_TOTAL":3,"CATS":{"who":{"title":"Who is behind it","truth":"tl_blaster","items":[{"id":"tl_engineer","label":"The dam-of-record engineer"},{"id":"tl_miningco","label":"Bruna Teixeira — mine operations director"},{"id":"tl_blaster","label":"Vale Norte’s blasting contractor"}]},"where":{"title":"Where it culminates","truth":"tl_toe","items":[{"id":"tl_toe","label":"The Toe, Piezometers & Blast Line"},{"id":"tl_office","label":"The Mine Operations Office"},{"id":"tl_crest","label":"The Raised Dam Crest"}]},"what":{"title":"What happened","truth":"tl_quake","items":[{"id":"tl_quake","label":"An unauthorized production blast triggered cyclic liquefaction"},{"id":"tl_liquefaction","label":"Static liquefaction began from rising pore pressure without a shock"},{"id":"tl_rain","label":"Exceptional rainfall overtopped an otherwise stable embankment"}]}},"READING_ORDER":["tl_walker","tl_reader","tl_clerk"],"CHARACTERS":{"tl_walker":{"name":"Dam-Walker Ana Reis","role":"Tailings-dam walker","face":"💧","badge":"A","legend":"the downstream toe","hint":"The crest was not overtopped, but the toe instruments jump immediately after one sharp ground pulse.","reading":"seed"},"tl_reader":{"name":"The Instrument Reader","role":"Geotechnical-instrument reader","face":"📈","badge":"I","legend":"the piezometer station","hint":"Pore pressure was elevated but stable until cyclic loading drove it abruptly toward the total stress.","reading":"castro"},"tl_clerk":{"name":"The Blasting Records Clerk","role":"Mine permits and explosives clerk","face":"🗂","badge":"C","legend":"the blast archive","hint":"Explosive issue sheets exceed the permitted shot, and the contractor’s electronic delay log was edited after the collapse.","reading":"wilson"}},"TOPICS":{"seed":{"sci":"Harry Bolton Seed (1922-1989)","topic":"Cyclic loading & liquefaction","lede":"Seed explained how repeated shaking transfers load from grain contacts into pore water until saturated soil loses strength.","no":1,"profile":"Harry Bolton Seed was a British-born geotechnical engineer who spent most of his career at the University of California, Berkeley. His research after damaging earthquakes helped establish modern soil liquefaction engineering. Loose, saturated sand can carry load through a skeleton of grains while water fills the pores. Under rapid cyclic shaking, the grains try to rearrange into a denser state, but the water cannot drain quick

":"A distant tsunami went unconfirmed after network neglect"},{"id":"blast","label":"An explosive source beneath the sea generated the destructive wave"}]}},"READING_ORDER":["buoytech","watchstander","clerk"],"CHARACTERS":{"buoytech":{"name":"Buoy Tech Sana","role":"Ocean-observing technician","face":"🛟","badge":"S","legend":"the buoy network","hint":"Every operating buoy passed its self-test; the first deep-ocean signal arrived after the nearest shore gauge was already climbing.","reading":"bernard"},"watchstander":{"name":"The Watchstander","role":"Tsunami warning-centre watchstander","face":"🌊","badge":"W","legend":"the forecast console","hint":"Back-projection points to the nearby canyon wall, leaving minutes rather than the long travel time of a basin-crossing wave.","reading":"titov"},"clerk":{"name":"The Marine Records Clerk","role":"Seismic and bathymetric records clerk","face":"🗂","badge":"C","legend":"the source archive","hint":"The acoustic and seismic record shows a prolonged slope collapse without the compact pressure pulse of an explosion.","reading":"kajiura"}},"TOPICS":{"bernard":{"sci":"Eddie Bernard (tsunami-warning oceanographer)","topic":"The DART deep-ocean buoy network","lede":"Bernard helped build the pressure-buoy system that can buy distant coasts hours, but cannot manufacture time for a local source.","no":1,"profile":"Eddie Bernard spent decades developing and operating systems intended to detect tsunamis before they reached distant coasts. Working with the United States tsunami research program and later directing NOAA’s Pacific Marine Environmental Laboratory, he helped advance the Deep-ocean Assessment and Reporting of Tsunamis system, known as DART.\n\nA DART station places a pressure recorder on the seafloor and a communication buoy at the surface. The recorder senses the tiny change in water-column pressure produced by a long tsunami wave in deep ocean. Data move acoustically to the buoy and then by satellite to warning centres. Because ordinary wind waves have short periods and small deep-water pressure signatures, the system can separate tsunami-scale changes when its algorithms and communications function properly.\n\nDART is powerful for ocean-wide events because a wave may need hours to cross a basin. It is less capable of protecting a coast very close to the source. Detection, confirmation, modelling, decision, communication, and public action all consume time. A local landslide tsunami can reach shore in minutes, sometimes before a deep-water station outside the source region records a clear signal. That limitation is not the same as equipment neglect.\n\nAt Sable Point, station health records show functioning instruments and continuous telemetry. The nearest deep-ocean anomaly begins after the first local tide gauge departs from normal. Bernard’s network therefore rules out a convenient maintenance scandal: the system heard the wave as soon as geometry allowed. The hard question is whether any warning chain could outrun a source so close to the beach.","frame":"Sana opens the station-health plot beside the shore gauge. “The buoy did speak. The question is whether the beach had time to hear it.”","q":[{"q":"What does a DART seafloor recorder measure?","o":[{"t":"Mainly the height of short wind waves passing the surface buoy.","v":"partial","fb":"Surface wind waves are not the primary bottom-pressure measurement."},{"t":"The chemical composition of sediments moving down a submarine slope.","v":"wrong","fb":"Sediment chemistry requires sampling, not the DART pressure instrument."},{"t":"The exact magnitude of nearly every earthquake before seismic stations report it.","v":"danger","fb":"DART observes ocean response; it does not replace seismic magnitude determination."},{"t":"Small water-column pressure changes caused by long tsunami waves in deep ocean.","v":"expert","fb":"The bottom pressure sensor detects the long-period pressure signal of a tsunami."}],"clue":{"category":"who","label":"WHO clue","text":"Bernard’s station-health data show the buoy system operating normally, leaving no maintenance decision or warning-chief order at the start of the event."}},{"q":"Why are DART buoys most valuable for distant tsunamis?","o":[{"t":"Long ocean travel gives time for detection, modelling, warning, and evacuation.","v":"expert","fb":"Basin-crossing travel time creates the operational margin the warning chain needs."},{"t":"Deep-ocean waves move more slowly than people can walk along the shoreline.","v":"partial","fb":"Tsunamis move hundreds of kilometres per hour in deep water."},{"t":"A distant source generally produces a larger pressure signal than a local source.","v":"wrong","fb":"Signal size depends on source and geometry, not distance alone."},{"t":"Warning centres can stop the wave after a buoy confirms its arrival.","v":"danger","fb":"Detection supports protective action but cannot halt the physical wave."}],"clue":{"category":"what","label":"WHAT clue","text":"The shore gauge began rising before the first usable deep-ocean confirmation, which is the timing expected from a near-field source rather than a neglected distant wave."}},{"q":"Which evidence distinguishes a short warning window from a failed buoy?","o":[{"t":"A buoy technician’s belief that local tsunamis are generally more dangerous at landfall in radar data.","v":"partial","fb":"General beliefs do not establish the performance of this station during this event."},{"t":"Continuous self-tests and telemetry paired with a shore arrival that precedes offshore confirmation.","v":"expert","fb":"Functioning telemetry plus arrival order directly tests whether the network had time to act."},{"t":"A single missing weather observation from the previous week before landfall at landfall in radar data.","v":"wrong","fb":"An unrelated weather gap does not explain the tsunami timing."},{"t":"An office budget document requesting replacement batteries next year at landfall in radar data before landfall.","v":"danger","fb":"Future maintenance planning is not evidence of failure during the event."}],"clue":{"category":"where","label":"WHERE clue","text":"The first hydrodynamic departure appears on the shore station beside the offshore canyon, placing the decisive timing evidence at the local source region."}}]},"titov":{"sci":"Vasily Titov (tsunami modeler)","topic":"Tsunami forecast modelling","lede":"Titov’s models turn source, depth, and arrival times into a forecast—and expose when the source lies too close for the cycle.","no":2,"profile":"Vasily Titov is a tsunami modeller whose work helped make real-time forecast products possible. Tsunamis are shallow-water waves on the scale of the ocean depth: their speed depends mainly on gravity and water depth, so bathymetry guides their paths. A forecast model begins with a source estimate, propagates the wave across the ocean, and then resolves how coastal shape and depth transform it into runup and inundation.\n\nTitov helped develop modelling systems that combine precomputed scenarios with live observations. Deep-ocean measurements can adjust the estimated source, while numerical grids translate that source into forecasts for specific coasts. The method works best when the source is known soon enough and when there is sufficient travel time to assimilate data. Uncertainty comes from earthquake parameters, landslide geometry, bathymetry, and the fine details of harbours and shorelines.\n\nBack-projection reverses part of the problem. If several gauges record arrival times, possible source regions can be tested by calculating which one produces that sequence. A distant earthquake source should create a coherent basin-scale pattern. A local slope failure can produce a highly directional wave, striking one coast hard while leaving far stations relatively quiet.\n\nSable Point’s first three gauges fit a source on the adjacent submarine canyon wall. A distant earthquake scenario arrives too late, while a blast-sized point source predicts a different directional and spectral pattern. Titov’s model reconstructs a short path and a narrow warning window. The centre issued its first message within its procedure, but the water had already reached the nearest evacuation road. The model does not make the disaster trivial; it shows why response time, rather than institutional silence, controlled the outcome.","frame":"The watchstander back-projects three arrivals onto the canyon. “Put the source far away and the times fail. Put it here and the warning clock nearly vanishes.”","q":[{"q":"What chiefly controls tsunami speed in deep water?","o":[{"t":"The wind speed at the sea surface during the preceding hour.","v":"partial","fb":"Wind drives ordinary surface waves but not the principal tsunami speed."},{"t":"The colour and salinity of the water above the source region in gauge data.","v":"wrong","fb":"Salinity has a minor effect compared with depth and gravity."},{"t":"Gravity and water depth, with bathymetry shaping the travel path.","v":"expert","fb":"For long shallow-water waves, depth sets propagation speed to first order."},{"t":"The number of warning buoys positioned along the coastline.","v":"danger","fb":"Buoys observe the wave; they do not determine its physical speed."}],"clue":{"category":"what","label":"WHAT clue","text":"Titov’s propagation times fit a very short path from the adjacent canyon, leaving too little interval for the full warning cycle even though the system functioned."}},{"q":"How can gauge arrival times help locate a tsunami source?","o":[{"t":"The highest gauge reading is automatically assigned as the exact source point.","v":"partial","fb":"Local amplification can make the highest station far from the source."},{"t":"All stations are assumed to receive the wave simultaneously in a connected ocean in gauge data.","v":"wrong","fb":"Different paths and depths produce different arrival times."},{"t":"Arrival time reveals mainly wave height and does not constrain location in gauge data.","v":"danger","fb":"Arrival chronology is one of the strongest location constraints."},{"t":"Models test which source region reproduces the observed sequence and spacing of arrivals.","v":"expert","fb":"The travel-time pattern provides a geometric back-projection of possible sources."}],"clue":{"category":"where","label":"WHERE clue","text":"Back-projection converges on the submarine canyon beside Sable Point rather than the warning centre or a distant basin source."}},{"q":"Which outcome is typical of a directional landslide tsunami?","o":[{"t":"Severe impact along one favoured coast with much weaker signals at other azimuths.","v":"expert","fb":"Landslide geometry can focus energy strongly in selected directions."},{"t":"The same wave height at nearly every station around the entire ocean basin.","v":"partial","fb":"Uniform global height is inconsistent with source and bathymetric directivity."},{"t":"No sea-level change near the source, followed by uniform distant flooding.","v":"wrong","fb":"Near-source gauges usually respond strongly to a nearby displacement."},{"t":"A pressure pulse that arrives before any mass moves downslope in wave data.","v":"danger","fb":"The moving mass creates the wave rather than following a prior ocean pulse."}],"clue":{"category":"who","label":"WHO clue","text":"The model requires no altered operator input or delayed decision; the observed directivity follows the natural slope geometry before any person could intervene."}}]},"kajiura":{"sci":"Kinjiro Kajiura (tsunami hydrodynamicist)","topic":"Tsunami source & propagation","lede":"Kajiura showed that earthquakes, blasts, and moving submarine slopes write different signatures into water and sound.","no":3,"profile":"Kinjiro Kajiura was a Japanese geophysicist who made major contributions to tsunami generation and propagation. His work examined how seafloor displacement creates long waves and how the shape and depth of the source affect what appears at the surface. For broad earthquake rupture, the water column is displaced over a large area. For submarine landslides, the moving mass couples to the water through a more complex, often shorter-duration geometry.\n\nSource mechanism leaves signatures. An explosion is a compact pressure release that radiates strong acoustic and seismic energy. An earthquake produces fault-wave patterns and a broad initial sea-surface displacement. A landslide can generate a prolonged acoustic rumble, evolving bathymetric change, and strongly directional waves. Distinguishing them requires combining seismograms, hydrophones, pressure records, and post-event seafloor surveys.\n\nKajiura also studied dispersion and coastal transformation. Very long earthquake tsunamis behave approximately as nondispersive shallow-water waves across much of the ocean. Shorter landslide components can disperse more noticeably, separating by frequency as they travel. Near the source, that spectral mix may reach shore before distant stations develop a clean textbook signal.\n\nThe Sable Point hydrophone record contains tens of seconds of low-frequency mass movement rather than one compact explosive pulse. A survey later maps fresh scar material and deposits at the canyon base. The local wave spectrum is broader than the distant earthquake templates. Kajiura’s source physics therefore supports an uncommon but natural landslide and rejects both a weapon and a disabled network. The event was difficult because its source sat almost inside the warning zone it threatened.","frame":"The clerk plays a long underwater rumble beside a sharp calibration shot. “One is a pulse. One is a hillside moving. Tell me which reached Sable Point.”","q":[{"q":"How would a submarine landslide source differ from a compact explosion?","o":[{"t":"It produces no acoustic or seismic signal because sediment moves too slowly in gauge data.","v":"partial","fb":"Rapid slope failures are readily recorded by hydrophones and seismometers."},{"t":"It can produce prolonged mass-movement sound and directional waves rather than one sharp pulse.","v":"expert","fb":"A moving mass can radiate over time and focus water according to its path."},{"t":"It would need to generate a perfectly symmetric wave field around the source.","v":"wrong","fb":"Landslide geometry commonly makes the wave field asymmetric."},{"t":"It generally begins with a tectonic double-couple earthquake of large magnitude.","v":"danger","fb":"Some landslides are earthquake-triggered, but a large fault rupture is not required."}],"clue":{"category":"what","label":"WHAT clue","text":"The prolonged acoustic source and broad local spectrum indicate moving sediment, not the sharp pressure pulse expected from an underwater weapon."}},{"q":"Why can landslide-tsunami waves be strongly directional?","o":[{"t":"Ocean water permits waves to travel in mainly one compass direction at a time.","v":"partial","fb":"Waves can propagate in many directions; the source controls their distribution."},{"t":"Warning buoys absorb energy from all directions except the one facing shore.","v":"wrong","fb":"Buoys measure without materially steering the tsunami."},{"t":"The moving mass transfers momentum along a particular slope and source geometry.","v":"expert","fb":"Source motion and bathymetry focus energy unevenly around a landslide."},{"t":"Direction is chosen by the first coastal authority to issue an alert.","v":"danger","fb":"Human alerts do not determine physical wave direction."}],"clue":{"category":"where","label":"WHERE clue","text":"Fresh scar and deposit mapping on the nearby canyon wall match the favoured direction of the destructive shore wave."}},{"q":"Which combined record most strongly rules out an underwater blast?","o":[{"t":"One loud report from shore followed by uncertainty about the source time.","v":"partial","fb":"A subjective sound report cannot identify the source mechanism."},{"t":"A warning-centre message issued after the first local gauge alarm in wave data.","v":"wrong","fb":"Message timing addresses response, not whether the source was explosive."},{"t":"A working buoy whose battery was scheduled for replacement next season in wave data.","v":"danger","fb":"Maintenance scheduling does not distinguish a blast from a landslide."},{"t":"A long mass-movement hydrophone signal, fresh slope scar, and dispersive local wave train.","v":"expert","fb":"Those independent observations all describe a moving slope rather than a compact detonation."}],"clue":{"category":"who","label":"WHO clue","text":"No explosive custodian, operator override, or suppressed alarm appears in the source record; the causal agent is the failed submarine slope itself."}}]}},"story":["<b>Sable Point receives the oldest natural warning—the sea drawing back—but almost no official lead time.<\/b>","Buoy Tech Sana has the network-health chronology. The Watchstander can back-project the gauge arrivals. The Marine Records Clerk holds the hydrophone signal and the new seafloor survey.","A weapon, a neglected distant warning, and a nearby natural source each explain the suddenness until travel time and source physics are combined.","The verdict must decide whether anyone could have inserted more time into a wave generated almost at the shoreline."],"endings":{"overclaimWhat":"blast","dismissalWhat":"neglected","win":{"expertTitle":"The Wave Inside the Warning Zone","expert":["You connect no culpable individual, the Offshore Canyon & Shore Stations, and a nearby submarine landslide producing a wave too fast for useful warning. The full clue chain links the initiating condition, the physical mechanism, and the decisive record without relying on candidate order.","The two alternative explanations each fit part of the scene, but neither survives the combined timing, material, and documentary evidence."],"soundTitle":"The Travel-Time Answer","sound":["Your accusation identifies no culpable individual, the Offshore Canyon & Shore Stations, and a nearby submarine landslide producing a wave too fast for useful warning.","A few missed clues leave gaps in the reconstruction, yet the evidence you recovered is sufficient to distinguish the true sequence from both traps."],"namedTitle":"Correct Source, Missing Detail","named":["You reach the correct three-part verdict with a thin evidentiary file.","The result is right, although the unrecovered clues would be needed to defend the causal chain under sustained challenge."]},"overclaim":{"title":"The Weapon Has No Pulse","body":["An underwater weapon should leave a compact pressure pulse and an explosive custody trail.","The prolonged mass-movement signal, fresh scar, and directional spectrum instead describe a collapsing slope."]},"dismissal":{"title":"A Working Network Cannot Create Distance","body":["The buoy network passed its health checks and transmitted continuously.","Its first deep-ocean confirmation arrived after the local shore rise because the source was inside the usual warning geometry."]},"wrongNames":{"title":"Right Mechanism, Wrong Attribution","body":["You recognize the governing mechanism but assign it to the wrong actor or move its decisive evidence away from the location where the records and physical traces converge."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"e_storm","title":"The Halloway Landfall","discipline":"Meteorology & Storm Forecasting","venue":"the Halloway storm inquiry","agent":{"name":"Investigator Cole Renard","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Meteorology Pioneers","dossierName":"METEOROLOGY PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Halloway storm inquiry","teaser":"A hurricane reaches Halloway with a surge warning weaker than the data on the forecast floor. Was the storm manipulated, did rapid intensification defeat every forecast, or did one forecaster manually soften a warning the observing system supported?","overclaimTag":"weather deliberately manipulated offshore","truthTag":"a forecaster manually downgraded a supported warning","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"Radar spiral approaching a coast beside an edited warning bulletin\"><path d=\"M45 104 H360\" stroke=\"#326891\" stroke-width=\"3\"/><path d=\"M250 26 C180 20,150 82,215 92 C278 102,315 48,274 35 C238 24,212 51,236 66\" fill=\"none\" stroke=\"#121212\" stroke-width=\"3\"/><rect x=\"430\" y=\"28\" width=\"150\" height=\"86\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M450 50 h110 M450 70 h90 M450 90 h110\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><path d=\"M492 64 l18 18 M510 64 l-18 18\" stroke=\"#B3261E\" stroke-width=\"3\"/><\/svg>","overclaimTease":"The storm’s violence is not evidence of control from outside. Compare the radar trend, surge physics, and the exact edits between the technical draft and the public bulletin.","DAYS_TOTAL":3,"CATS":{"who":{"title":"Who is behind it","truth":"forecaster","items":[{"id":"official","label":"Delia Marsh — regional emergency-management chief"},{"id":"forecaster","label":"Dr. Ivo Pell — lead hurricane forecaster"},{"id":"mayor","label":"The resort-town mayor"}]},"where":{"title":"Where it culminates","truth":"forecastfloor","items":[{"id":"office","label":"The Emergency-Management Office"},{"id":"coast","label":"The Coast & Tide Gauges"},{"id":"forecastfloor","label":"The Hurricane Forecast Floor"}]},"what":{"title":"What happened","truth":"downgraded","items":[{"id":"weapon","label":"An external intervention altered the storm before landfall"},{"id":"freak","label":"Rapid intensification made the stronger warning unavailable"},{"id":"downgraded","label":"A supported surge warning was manually reduced before release"}]}},"READING_ORDER":["spotter","radar","clerk"],"CHARACTERS":{"spotter":{"name":"Storm Spotter Vane","role":"Coastal observing volunteer","face":"🌀","badge":"V","legend":"the tide line","hint":"Surge and wind observations matched the stronger technical draft hours before the public bulletin was issued.","reading":"atlas"},"radar":{"name":"The Radar Analyst","role":"Hurricane radar analyst","face":"📡","badge":"R","legend":"the forecast floor","hint":"The radar loop and aircraft data showed an organizing eyewall and a rising surge threat, not an unknowable jump.","reading":"bjerknes"},"clerk":{"name":"The Forecast Archive Clerk","role":"Bulletin and revision clerk","face":"🗂","badge":"C","legend":"the issue desk","hint":"The final warning removed surge language during one forecaster’s authenticated edit session.","reading":"rsimpson"}},"TOPICS":{"atlas":{"sci":"David Atlas (1924-2015)","topic":"Radar meteorology & storm detection","lede":"Atlas turned radar echoes into a moving record of storm structure instead of a screen full of unexplained clutter.","no":1,"profile":"David Atlas began his scientific career during the Second World War, when radar operators noticed that rain and storms cluttered screens designed to detect aircraft. He became one of the founders of radar meteorology, studying how transmitted microwave energy scatters from raindrops, ice, and other particles. The strength and structure of the return can reveal where precipitation is located and how it is organized.\n\nAtlas helped move radar from a qualitative picture to a measurement system. Reflectivity is related to the size and concentration of hydrometeors, though the relation between reflectivity and rainfall rate varies with drop-size distribution and storm type. Doppler radar later added radial velocity, allowing analysts to see winds toward or away from the instrument, rotation, convergence, and the organization of rain bands. Radar does not measure every surface hazard directly, but it supplies a continuous structural history that can be compared with aircraft, satellite, buoy, and tide-gauge data.\n\nFor tropical cyclones, eyewall shape, rain-band curvature, and velocity patterns help reveal whether the circulation is strengthening or reorganizing. An apparent forecast surprise must therefore be tested against what the observing system actually showed before landfall. A storm can intensify rapidly, yet the timing of that intensification is an empirical question rather than a slogan.\n\nAt Halloway, the radar archive displays a tightening eyewall and increasing low-level velocities well before the public warning was softened. Coastal observations then confirm the expected surge progression. Atlas’s lesson is that the storm left a movie, not one dramatic frame. That movie rejects weather manipulation, and it also prevents “no forecast could catch it” from becoming an excuse when the relevant trend was already visible.","frame":"Vane runs the radar loop beside tide reports. “The coast did not meet a storm from nowhere. Watch what the eye was doing before the words changed.”","q":[{"q":"What does weather-radar reflectivity primarily describe?","o":[{"t":"The exact surface wind direction at nearly every point beneath the radar beam.","v":"partial","fb":"Doppler velocity estimates one component of motion; reflectivity is not exact surface wind."},{"t":"The ocean temperature several metres below the storm’s path at landfall in radar data.","v":"wrong","fb":"Subsurface ocean temperature requires different instruments."},{"t":"The returned microwave energy from precipitation particles within each sampled volume.","v":"expert","fb":"Reflectivity maps the strength of scattering from hydrometeors in the radar volume."},{"t":"The political urgency assigned to a warning by emergency officials at landfall in radar data.","v":"danger","fb":"Warning urgency is a human decision, not a radar observable."}],"clue":{"category":"where","label":"WHERE clue","text":"Atlas’s unedited radar archive on the forecast floor preserves the strengthening eyewall hours before the public language changed."}},{"q":"Why is a radar loop stronger evidence than one dramatic image?","o":[{"t":"It is expected to deliver an exact landfall intensity without any uncertainty.","v":"partial","fb":"Radar improves awareness but does not eliminate forecast uncertainty."},{"t":"It removes the need for aircraft, satellite, buoy, and tide observations at landfall.","v":"wrong","fb":"Multiple observing systems remain necessary because each samples different quantities."},{"t":"It strongly suggests that any storm change was caused by deliberate intervention at landfall.","v":"danger","fb":"A trend documents natural evolution; it does not imply external control."},{"t":"It shows the storm’s structural trend and timing rather than a single selected moment.","v":"expert","fb":"A sequence reveals organization and acceleration that one frame can hide."}],"clue":{"category":"what","label":"WHAT clue","text":"The loop shows strengthening before the deadline for the public bulletin, so the higher warning was scientifically available rather than defeated by a last-minute surprise."}},{"q":"Which record best challenges the claim that the coast was warned as strongly as the data allowed?","o":[{"t":"A technical draft matching the radar trend followed by a weaker public revision.","v":"expert","fb":"The contrast between evidence-based draft and final bulletin directly tests the warning decision."},{"t":"A photograph of damaged buildings taken after the storm had passed.","v":"partial","fb":"Post-storm damage cannot show what language was available beforehand."},{"t":"A seasonal tourism forecast prepared before hurricane season began.","v":"wrong","fb":"A seasonal outlook does not determine one event’s operational warning."},{"t":"A single resident’s memory that the wind sounded unusually loud.","v":"danger","fb":"A recollection lacks the timestamped technical and publication trail."}],"clue":{"category":"who","label":"WHO clue","text":"The observation record supports the stronger draft; responsibility therefore lies with the person who altered the forecast product, not with the spotter or emergency chief who received it."}}]},"bjerknes":{"sci":"Vilhelm Bjerknes (1862-1951)","topic":"The equations of weather prediction","lede":"Bjerknes proposed that a measured atmosphere could be advanced through equations, with uncertainty made explicit rather than hidden.","no":2,"profile":"Vilhelm Bjerknes sought to make weather prediction a problem of physics rather than proverb. A Norwegian physicist and meteorologist, he argued in the early twentieth century that the future atmosphere could be calculated if its present state were adequately observed and the governing equations of motion, thermodynamics, mass continuity, and moisture were solved forward in time. That program became the intellectual foundation of numerical weather prediction.\n\nThe task is difficult because the atmosphere is three-dimensional, rotating, stratified, moist, and only imperfectly sampled. Forecasting therefore combines equations with data assimilation: observations are blended into a physically consistent estimate of the current state. A model forecast is not one oracle number. Ensembles and alternative analyses reveal plausible ranges, and forecasters interpret those ranges alongside new observations.\n\nBjerknes also influenced the Bergen School, which described fronts and cyclones as organized dynamical systems. For a hurricane, pressure falls, wind structure, ocean heat, vertical shear, and inner-core organization constrain what intensification is plausible. Uncertainty remains, but the uncertainty itself can be communicated. A high-impact warning may be justified by a dangerous tail of the forecast distribution even when the central estimate is lower.\n\nThe Halloway forecast package contained an ensemble shift toward stronger landfall winds and a larger surge envelope. The lead forecaster’s internal discussion acknowledged that shift, then substituted the lower deterministic value in the public text. Bjerknes’s framework separates an honest forecast miss from selective use of the forecast. The equations did not promise certainty; they supplied a range whose dangerous portion was removed by hand.","frame":"The analyst places the ensemble plume beneath the final bulletin. “A forecast is a range with consequences. Tell me which part vanished.”","q":[{"q":"What was central to Bjerknes’s program for weather prediction?","o":[{"t":"Predict storms from recurring calendar dates without measuring the atmosphere.","v":"partial","fb":"Calendar recurrence cannot represent the evolving atmospheric state."},{"t":"Observe the atmospheric state and solve physical equations forward in time.","v":"expert","fb":"Bjerknes framed forecasting as an initial-value problem governed by physics."},{"t":"Treat nearly every forecast as a direct extrapolation of yesterday’s local weather.","v":"wrong","fb":"Persistence can help briefly, but it is not the physical forecasting program."},{"t":"Replace observations with public reports once a storm enters coastal waters.","v":"danger","fb":"Public reports supplement rather than replace instrumental observations."}],"clue":{"category":"what","label":"WHAT clue","text":"Bjerknes’s ensemble evidence already included the dangerous landfall range; the final warning became weaker through selection, not through missing science."}},{"q":"Why can an ensemble justify a strong warning before its worst member becomes certain?","o":[{"t":"The most extreme member is automatically the correct forecast for nearly every event.","v":"partial","fb":"The extreme member is one scenario and must be weighed, not chosen automatically."},{"t":"Ensembles remove the need for a forecaster to explain uncertainty to the public.","v":"wrong","fb":"Ensembles create information that still requires interpretation and communication."},{"t":"High-impact outcomes may be plausible enough that their consequences warrant communication.","v":"expert","fb":"Risk communication considers probability together with consequence, not certainty alone."},{"t":"A warning is valid mainly when nearly every model member predicts the same intensity.","v":"danger","fb":"Complete model agreement is rare and is not required for protective action."}],"clue":{"category":"where","label":"WHERE clue","text":"The decisive divergence occurs at the forecast workstation where the ensemble surge range was replaced by one lower deterministic value."}},{"q":"Which action most clearly turns forecast uncertainty into misconduct?","o":[{"t":"Updating a warning when new aircraft data materially changes the storm analysis before coastal landfall.","v":"partial","fb":"A documented update based on new evidence is normal forecasting practice."},{"t":"Describing confidence limits and explaining why several outcomes remain possible before coastal landfall.","v":"wrong","fb":"Transparent uncertainty is the opposite of concealing the scientific range."},{"t":"Issuing a cautious range that includes both the central forecast and dangerous tail before coastal landfall.","v":"danger","fb":"A range communicates uncertainty rather than erasing it."},{"t":"Deleting the supported high-impact range while presenting the lower estimate as the definitive science.","v":"expert","fb":"Selective omission misrepresents what the forecast system actually supported."}],"clue":{"category":"who","label":"WHO clue","text":"Authentication logs tie the selective rewrite to the lead forecaster’s account after the analyst objected, while the emergency chief received only the altered product."}}]},"rsimpson":{"sci":"Robert Simpson (1912-2014)","topic":"Hurricane classification & coastal hazard","lede":"Simpson helped create the famous hurricane scale and spent years warning that wind category is not the whole storm.","no":3,"profile":"Robert Simpson flew into hurricanes, directed the United States National Hurricane Research Project, and later led the National Hurricane Center. With engineer Herbert Saffir, he helped create the Saffir–Simpson scale, which classifies hurricanes by sustained wind speed. The scale gave officials and the public a common language for wind damage, but Simpson repeatedly emphasized that a category is not a complete description of hazard.\n\nStorm surge depends on more than the peak wind at the centre. The size of the wind field, forward speed, angle of approach, coastal bathymetry, tide, and shoreline shape can raise or lower water dramatically. Rainfall and tornado risk also sit outside the category number. Two storms with the same category can therefore produce very different consequences, and a lower-category storm can generate catastrophic surge.\n\nOperational forecasting must translate several hazard products rather than allow one familiar number to dominate. Surge models, tide gauges, radar, aircraft reconnaissance, and local topography all contribute. Simpson’s scale is valuable when used for what it measures and misleading when treated as a verdict on every coastal threat.\n\nThe Halloway revision retained the wind category but removed explicit surge language and the evacuation-zone recommendation. That choice made the bulletin sound scientifically conservative while discarding the hazard most strongly supported by the coast’s geometry and the model envelope. Simpson’s own work supplies the discriminator: if the final warning changed because the category did not rise, while the surge forecast did, then the edit was not a neutral restatement. It substituted one metric for the multi-hazard analysis.","frame":"The clerk highlights a category number and a deleted surge paragraph. “One stayed the same. One grew worse. Which did the public need?”","q":[{"q":"What does the Saffir–Simpson scale classify?","o":[{"t":"Hurricanes by sustained wind speed, not by every associated hazard.","v":"expert","fb":"The scale is a wind classification and cannot stand in for surge or rainfall products."},{"t":"Storm surge height from the local tide and coastal bathymetry.","v":"partial","fb":"Surge is modelled separately from wind category."},{"t":"Total rainfall and river flooding expected over the whole track.","v":"wrong","fb":"Rainfall varies with motion and moisture and is not encoded in the category."},{"t":"The probability that a forecast will verify at the named category.","v":"danger","fb":"Forecast confidence is also separate from the wind classification."}],"clue":{"category":"what","label":"WHAT clue","text":"Simpson’s distinction shows why holding the wind category steady did not justify deleting the independently rising surge warning."}},{"q":"How can a lower-category hurricane still produce catastrophic surge?","o":[{"t":"The category number secretly includes surge but forecasters sometimes read it backward.","v":"partial","fb":"The current scale does not encode a hidden surge number."},{"t":"A broad wind field, slow motion, approach angle, and shallow coast can pile up great water.","v":"expert","fb":"Surge responds to wind-field geometry and coastal conditions, not category alone."},{"t":"Surge occurs mainly when a storm weakens rapidly immediately before landfall.","v":"wrong","fb":"Weakening can coexist with surge, but it is not a required mechanism."},{"t":"Any surge above the tide strongly suggests the storm was artificially intensified offshore.","v":"danger","fb":"Natural storms routinely drive surge without external manipulation."}],"clue":{"category":"where","label":"WHERE clue","text":"Tide gauges and surge modelling at the issue desk support the removed evacuation zone even though the wind category remained unchanged."}},{"q":"Which publication change would Simpson’s framework treat as most misleading?","o":[{"t":"Adding a rainfall section because slow motion increased inland-flood risk.","v":"partial","fb":"Adding a distinct hazard product improves rather than distorts the warning."},{"t":"Explaining that two storms in one category may have different coastal effects.","v":"wrong","fb":"The statement correctly limits what category can communicate."},{"t":"Keeping the category while removing a separately supported surge warning.","v":"expert","fb":"That edit lets a wind label erase a different and well-supported hazard."},{"t":"Updating the surge map after new tide and track information arrives.","v":"danger","fb":"Evidence-based updates are normal when their rationale is preserved."}],"clue":{"category":"who","label":"WHO clue","text":"The revision history shows the lead forecaster removed surge language personally; neither the mayor nor emergency chief had access to alter the scientific bulletin."}}]}},"story":["<b>Halloway’s coast receives a familiar category number and an unfamiliar wall of water.<\/b>","Storm Spotter Vane has the observing chronology. The Radar Analyst can reconstruct the forecast range. The Forecast Archive Clerk holds every saved revision of the bulletin.","Weather manipulation, unforeseeable intensification, and a deliberate downgrade all sound plausible until the technical draft is compared with what the public was actually sent.","The case turns on who changed the warning, where that edit occurred, and whether the science supported stronger language before landfall."],"endings":{"overclaimWhat":"weapon","dismissalWhat":"freak","win":{"expertTitle":"The Warning That Was Edited","expert":["You connect Dr. Ivo Pell — the lead hurricane forecaster, the Hurricane Forecast Floor, and a supported surge warning manually reduced before release. The full clue chain links the initiating condition, the physical mechanism, and the decisive record without relying on candidate order.","The two alternative explanations each fit part of the scene, but neither survives the combined timing, material, and documentary evidence."],"soundTitle":"The Revision Trail","sound":["Your accusation identifies Dr. Ivo Pell — the lead hurricane forecaster, the Hurricane Forecast Floor, and a supported surge warning manually reduced before release.","A few missed clues leave gaps in the reconstruction, yet the evidence you recovered is sufficient to distinguish the true sequence from both traps."],"namedTitle":"Correct Edit, Incomplete File","named":["You reach the correct three-part verdict with a thin evidentiary file.","The result is right, although the unrecovered clues would be needed to defend the causal chain under sustained challenge."]},"overclaim":{"title":"No Hand Controlled the Storm","body":["The radar, aircraft, and tide records show a natural hurricane evolving through known processes.","No source, energy input, or control mechanism supports external weather manipulation."]},"dismissal":{"title":"Uncertainty Was Not Ignorance","body":["Rapid intensification was possible, but the dangerous range and surge signal were visible before publication.","The issue was not that prediction became impossible; it was that supported uncertainty was selectively removed."]},"wrongNames":{"title":"Right Mechanism, Wrong Attribution","body":["You recognize the governing mechanism but assign it to the wrong actor or move its decisive evidence away from the location where the records and physical traces converge."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"e_flood","title":"The Rossmere Flood","discipline":"Hydrology & Flood Science","venue":"the Rossmere flood inquiry","agent":{"name":"Inspector Tomasz Bey","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Hydrology Pioneers","dossierName":"HYDROLOGY PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Rossmere flood inquiry","teaser":"A canyon town is struck by a night flood after rainfall fills the entire upper basin. Did someone manipulate the dam, did officials ignore a forecastable rise, or did a rare storm exceed the network’s measured design envelope despite the planned response?","overclaimTag":"deliberate manipulation of the reservoir","truthTag":"a basin-wide hydrologic extreme beyond the mapped envelope","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"Tributary gauges rising together above a canyon town\"><path d=\"M20 28 C120 34,160 20,250 34 S430 24,640 36\" fill=\"none\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><path d=\"M40 108 C150 70,210 116,320 72 S510 100,620 54\" fill=\"none\" stroke=\"#326891\" stroke-width=\"4\"/><path d=\"M105 44 v42 M240 40 v46 M382 42 v44\" stroke=\"#121212\" stroke-width=\"2\"/><circle cx=\"105\" cy=\"64\" r=\"5\" fill=\"#B3261E\"/><circle cx=\"240\" cy=\"60\" r=\"5\" fill=\"#B3261E\"/><circle cx=\"382\" cy=\"62\" r=\"5\" fill=\"#B3261E\"/><path d=\"M505 91 h74 v28 h-74z\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><\/svg>","overclaimTease":"The dam is the most visible machine in the valley, but a natural flood should announce itself first across separated tributaries and then arrive in the order a runoff model predicts.","DAYS_TOTAL":3,"CATS":{"who":{"title":"Who is behind it","truth":"storm","items":[{"id":"manager","label":"Elias Thorn — reservoir operations manager"},{"id":"hydrologist","label":"The county hydrologist"},{"id":"storm","label":"An act of nature — the basin-wide storm, not a person"}]},"where":{"title":"Where it culminates","truth":"gauges","items":[{"id":"gauges","label":"The Upper Creek & Gauge Network"},{"id":"office","label":"The Water District Planning Office"},{"id":"controlroom","label":"The Dam Control Room"}]},"what":{"title":"What happened","truth":"freak","items":[{"id":"ignored","label":"A forecastable rise was missed after gauges and maps were neglected"},{"id":"freak","label":"An exceptional basin storm exceeded the measured design envelope"},{"id":"sabotage","label":"A deliberate gate action released the destructive surge"}]}},"READING_ORDER":["gaugekeeper","operator","clerk"],"CHARACTERS":{"gaugekeeper":{"name":"Gauge Keeper Wynn","role":"Stream-gauge keeper","face":"💧","badge":"W","legend":"the upper gauge line","hint":"Separated tributaries rose before any reservoir release, and every working station recorded the same exceptional storm pulse.","reading":"newell"},"operator":{"name":"The Gate Operator","role":"Dam gate operator","face":"🎚️","badge":"G","legend":"the control room","hint":"Gate movement followed the emergency schedule after the natural inflow was already above the spillway forecast.","reading":"sherman"},"clerk":{"name":"The Floodplain Clerk","role":"Hazard-map and response clerk","face":"🗺️","badge":"C","legend":"the planning archive","hint":"The response plan was used as written; the observed crest lay outside the mapped confidence band.","reading":"white"}},"TOPICS":{"newell":{"sci":"Frederick H. Newell (1862-1932)","topic":"Stream gauging & the hydrographic survey","lede":"Newell built the measurement network that turned a river’s rise from rumor into a timed, basin-wide record.","no":1,"profile":"Frederick Haynes Newell joined the young United States Geological Survey in the late nineteenth century, when rivers were usually described by anecdote rather than continuous measurement. He organized a national program of stream gauging and helped turn scattered observations into repeatable records. At a gauge, observers measure stage, the height of water, and periodically measure discharge. Those paired observations establish a rating curve that converts a continuous stage record into an estimate of flow.\n\nNewell understood that one station cannot describe a watershed. Rain falls unevenly, tributaries respond at different speeds, and reservoirs receive water assembled from many channels. A useful network therefore places instruments upstream, downstream, and on major branches. The order in which stations rise becomes evidence: a natural basin storm produces a travelling pattern, whereas a sudden gate release begins at the dam and propagates downstream.\n\nThe same records support engineering design. Long sequences reveal ordinary seasons, previous extremes, and the uncertainty around events rarer than the observation period. A new record can exceed every earlier point without implying that the instruments failed or that someone manufactured the water. It means the estimated tail of the distribution must be revised.\n\nRossmere’s surviving gauge traces can be read in Newell’s sequence. Remote tributaries rose first, then converged on the reservoir, while the downstream station responded later. That ordering tests sabotage more directly than the drama at the dam. It also tests neglect: the active stations transmitted throughout the storm, giving operators the same extraordinary but rapidly escalating inflow that the archive now shows.","frame":"Wynn lays three synchronized gauge traces across the table. “Read the order, not the headline. A flood tells you where it began if the stations are far enough apart.”","q":[{"q":"What does a stream-gauge rating curve allow hydrologists to estimate?","o":[{"t":"Continuous river discharge from repeated relations between water level and measured flow.","v":"expert","fb":"Exactly: paired stage and discharge measurements turn a level record into a flow history."},{"t":"Rainfall depth near the station from the speed at which the channel surface rises.","v":"partial","fb":"Stage responds to rainfall, but a gauge cannot infer local rainfall depth from rise speed alone."},{"t":"Sediment grain size from the maximum stage reached during each flood season.","v":"wrong","fb":"Sediment affects channels, yet a rating curve is built to convert stage into discharge."},{"t":"Whether a dam operator opened a gate by reading one downstream water mark alone.","v":"danger","fb":"One mark lacks the network timing needed to distinguish a release from basin runoff."}],"clue":{"category":"who","label":"WHO clue","text":"Newell’s network shows separated upstream stations rising before any control-room action, leaving no human command at the beginning of the flood sequence."}},{"q":"Which station pattern most strongly indicates basin runoff rather than a dam release?","o":[{"t":"Mainly the gauge below the dam jumps while upstream tributaries remain near seasonal levels.","v":"partial","fb":"A downstream-only jump would point toward a release or local failure, not distributed runoff."},{"t":"Several tributaries crest in travel-time order before the reservoir and downstream gauge.","v":"expert","fb":"That staggered upstream-to-downstream progression is the signature of water assembled across a basin."},{"t":"nearly every station reports an identical value at the same minute despite different channel sizes.","v":"wrong","fb":"Identical simultaneous values suggest a data problem rather than a physical flood wave."},{"t":"The control-room display goes blank shortly before a single downstream station rises.","v":"danger","fb":"A blank display creates uncertainty but does not supply the positive upstream sequence seen here."}],"clue":{"category":"what","label":"WHAT clue","text":"The rise travelled from multiple tributaries into the reservoir in the order expected from a basin-wide storm, not outward from a breached or opened dam."}},{"q":"Why can a measured flood exceed every event in a short historical record?","o":[{"t":"A functioning gauge gradually exaggerates large flows as its metal components become older.","v":"partial","fb":"Age can affect instruments, but calibration checks—not automatic exaggeration—address that concern."},{"t":"Rivers possess a fixed maximum discharge equal to the largest event previously recorded.","v":"wrong","fb":"A record maximum is not a physical ceiling on what the basin can produce."},{"t":"The observation period may not yet contain the rare tail of the watershed’s possible extremes.","v":"expert","fb":"Records sample probability; a rare but physical event can exceed all earlier observations."},{"t":"Any new record above the old maximum strongly suggests that an operator altered the hydrograph.","v":"danger","fb":"Exceeding a record is evidence of rarity, not by itself evidence of manipulation."}],"clue":{"category":"where","label":"WHERE clue","text":"The first decisive evidence sits in the upper gauge archive, where independent stations recorded the storm before the reservoir became the focus."}}]},"sherman":{"sci":"LeRoy K. Sherman (1869-1954)","topic":"The unit hydrograph","lede":"Sherman found a reusable fingerprint for how a watershed converts a pulse of rain into a river crest.","no":2,"profile":"LeRoy Sherman was an American hydrologist who gave engineers a practical way to connect a burst of rainfall with the river response that follows. In 1932 he introduced the unit hydrograph: the characteristic discharge curve produced by one unit of effective rainfall spread uniformly over a watershed for a specified duration. The method separates the catchment’s response from the particular size of a storm.\n\nOnce a unit hydrograph is derived from observed events, larger or more complex storms can be represented by scaling and adding shifted copies of that response. The approach assumes approximate linearity and a stable basin, conditions that are never perfect, but it supplies a disciplined timing test. Rainfall becomes runoff after infiltration and storage; tributaries deliver their portions; the combined hydrograph rises, peaks, and recedes. A dam release has a different origin and may impose a sharper downstream signal.\n\nSherman’s method also explains why peak flow is not determined by total rainfall alone. Duration, spatial distribution, antecedent wetness, and the timing of tributary contributions control whether runoff arrives together. When a large storm aligns those contributions, the peak can grow far beyond familiar floods even without a mechanical failure.\n\nAt Rossmere, the rainfall record and established basin response reproduce the observed inflow peak within the uncertainty expected for an extreme event. The gate log begins after that rise, and the downstream curve is the routed continuation of the same volume. Sherman’s hydrograph does not excuse careless operation; it asks whether the water balance requires it. Here the storm supplies the volume and timing before any disputed human action is introduced.","frame":"The operator sketches rainfall bars over the inflow curve. “Before you accuse anyone at these gates, show me whether the storm can make the hydrograph by itself.”","q":[{"q":"What is held constant in Sherman’s idea of a unit hydrograph?","o":[{"t":"The exact river stage produced by nearly every storm regardless of soil wetness or duration.","v":"partial","fb":"Real hydrographs vary with storm structure and antecedent conditions; stage is not fixed."},{"t":"The dam-gate position needed to keep downstream discharge at a fixed safe value.","v":"wrong","fb":"Gate operation is not the defining quantity in Sherman’s runoff-response method."},{"t":"The annual probability that any rainfall event will become a destructive flood.","v":"danger","fb":"Frequency analysis is separate from the response curve represented by a unit hydrograph."},{"t":"The watershed response to one specified unit and duration of effective rainfall.","v":"expert","fb":"A unit hydrograph represents the basin response to a defined effective-rainfall input."}],"clue":{"category":"what","label":"WHAT clue","text":"Sherman’s reconstructed hydrograph reaches the observed peak using the measured rainfall alone; no hidden release is needed to supply the flood volume."}},{"q":"How can two storms with the same total rainfall produce different flood peaks?","o":[{"t":"Their duration and tributary timing can either spread runoff out or make contributions coincide.","v":"expert","fb":"Runoff timing controls whether flows overlap at the outlet and amplify the crest."},{"t":"A watershed converts equal rainfall totals into identical peaks once its channel map is known.","v":"partial","fb":"Equal totals do not guarantee equal temporal or spatial distributions across a basin."},{"t":"Peak flow depends mainly on the reservoir operator’s final gate setting during the event.","v":"wrong","fb":"Gate settings may affect routing, but they do not erase the storm’s runoff timing."},{"t":"The larger peak would need to come from a failed gauge because rainfall volume was unchanged.","v":"danger","fb":"Different peaks can arise physically without any instrument failure."}],"clue":{"category":"where","label":"WHERE clue","text":"The control-room log shows the emergency gate sequence beginning only after the natural inflow hydrograph was already climbing past the ordinary operating band."}},{"q":"Which comparison best tests whether the operator created the Rossmere surge?","o":[{"t":"Inspect the operator’s demeanor and decide whether the late release appeared suspicious.","v":"partial","fb":"Behavior is not a substitute for hydrologic timing and volume."},{"t":"Route the measured inflow and gate history forward, then compare the predicted downstream curve.","v":"expert","fb":"A routed water balance tests whether the documented operations explain or merely follow the surge."},{"t":"Compare mainly the final flood depth with the maximum level printed on an old wall chart.","v":"wrong","fb":"One final depth discards the sequence needed to identify the source of the water."},{"t":"Assume any release during a disaster caused the disaster, regardless of its timing or volume.","v":"danger","fb":"Causation depends on the counterfactual hydrograph, not the mere presence of gate movement."}],"clue":{"category":"who","label":"WHO clue","text":"The routed record places the operator’s actions after the unavoidable inflow peak and shows those actions following the approved emergency rule rather than creating the event."}}]},"white":{"sci":"Gilbert F. White (1911-2006)","topic":"Floodplain management & flood risk","lede":"White taught governments that a flood map is a decision under uncertainty, not a wall around possibility.","no":3,"profile":"Gilbert F. White changed flood policy by arguing that societies should not answer every river hazard with a larger wall. Trained as a geographer, he studied how people choose among structural defenses, warnings, insurance, zoning, evacuation, and adaptation. His doctoral work on human adjustment to floods became a foundation of modern floodplain management.\n\nWhite emphasized that maps and design standards are decision tools, not promises. A “hundred-year” flood is a probability statement—roughly a one-percent annual chance under assumed conditions—not an event scheduled once per century. Estimates shift as records lengthen, land use changes, and extreme storms reveal parts of the distribution that were previously unseen. A mapped boundary therefore carries uncertainty on both sides.\n\nHe also examined the paradox of protection. Levees and reservoirs can reduce frequent losses while encouraging more development behind them, increasing exposure when a larger event arrives. Good policy combines defenses with land-use choices, public communication, and plans for exceedance. Evaluating a disaster requires asking whether decision-makers ignored known risk, or whether a prepared system encountered an event outside the evidence available when its plan was set.\n\nRossmere’s archive contains an adopted flood map, an evacuation trigger, and the messages that activated it. The town still suffered because the storm crest rose beyond the upper uncertainty band used in those documents and cut the only evacuation road early. White’s framework does not call that outcome harmless. It distinguishes an imperfect but followed plan from a suppressed study, and a rare natural exceedance from a sabotage story that the basin record cannot support.","frame":"The clerk opens the adopted map beside its uncertainty notes. “A line on paper can be crossed honestly or ignored dishonestly. Tell me which record distinguishes them.”","q":[{"q":"What does a “hundred-year flood” mean in floodplain planning?","o":[{"t":"The largest flood that can occur during each fixed one-hundred-year calendar interval.","v":"partial","fb":"Several such floods can occur close together, or none may occur for centuries."},{"t":"A flood that returns exactly one century after the previous event at the same location.","v":"wrong","fb":"Flood probabilities do not reset according to the date of the last event."},{"t":"An event with about a one-percent chance in any year under the model’s assumptions.","v":"expert","fb":"The term expresses annual probability, not a schedule or a physical maximum."},{"t":"A level that engineering works are guaranteed to contain whenever records are complete.","v":"danger","fb":"Design standards reduce risk but do not guarantee containment of every possible event."}],"clue":{"category":"where","label":"WHERE clue","text":"White’s planning file places the observed crest beyond the mapped uncertainty band, while the adopted response documents remain intact in the district archive."}},{"q":"Which finding would support neglect rather than an honest exceedance?","o":[{"t":"The observed flood rose above all events in the limited gauge record after an extreme storm.","v":"partial","fb":"A record exceedance alone does not show that anyone possessed better information beforehand."},{"t":"The evacuation road flooded earlier than expected even though the published trigger was used.","v":"wrong","fb":"A plan can fail under an extreme event even when its stated trigger is followed."},{"t":"Uncertainty widened when the record was updated to include the new extreme observation.","v":"danger","fb":"Revised uncertainty is the expected scientific response to new evidence."},{"t":"A newer hazard study predicted the crest and was withheld from the people using the old map.","v":"expert","fb":"Suppressing a decision-relevant study would turn uncertainty into a preventable governance failure."}],"clue":{"category":"who","label":"WHO clue","text":"The complete planning correspondence contains no buried replacement map or cancelled alert; the named officials used the information available before the storm."}},{"q":"Why did White warn against relying on one structural defense alone?","o":[{"t":"Protection can encourage exposure, so land use, warnings, and exceedance plans must share the job.","v":"expert","fb":"White treated flood safety as a portfolio of adjustments rather than a single barrier."},{"t":"Flood walls increase rainfall over the basin by trapping moist air near the river valley.","v":"partial","fb":"Flood defenses do not create basin rainfall through local atmospheric trapping."},{"t":"Reservoirs eliminate small floods but inevitably generate nearly every catastrophic flood downstream.","v":"wrong","fb":"Reservoirs alter routing, but they do not inevitably cause catastrophic floods."},{"t":"Nonstructural measures matter mainly after a levee or dam has already failed effectively.","v":"danger","fb":"Zoning, warning, and evacuation are preventive measures, not merely post-failure responses."}],"clue":{"category":"what","label":"WHAT clue","text":"White’s exceedance analysis supports a rare but physical flood beyond the mapped envelope, while rejecting both a concealed forecast and a deliberate gate attack."}}]}},"story":["<b>Rossmere wakes to mud, overturned houses, and a reservoir blamed before the water has finished receding.<\/b>","Gauge Keeper Wynn holds the upstream chronology. The Gate Operator can reconstruct the routed release. The Floodplain Clerk has the map, its uncertainty, and the response record.","A deliberate release, a neglected warning system, and a genuine hydrologic extreme each explain part of the scene until timing and volume are placed in one sequence.","Nine clues can show whether the disaster began with a person, a failed institution, or a storm the measured plan did not contain."],"endings":{"overclaimWhat":"ignored","dismissalWhat":"sabotage","win":{"expertTitle":"The Storm Beyond the Map","expert":["You connect no culpable individual, the Upper Creek & Gauge Network, and an exceptional basin storm exceeding the measured design envelope. The full clue chain links the initiating condition, the physical mechanism, and the decisive record without relying on candidate order.","The two alternative explanations each fit part of the scene, but neither survives the combined timing, material, and documentary evidence."],"soundTitle":"The Basin Record Holds","sound":["Your accusation identifies no culpable individual, the Upper Creek & Gauge Network, and an exceptional basin storm exceeding the measured design envelope.","A few missed clues leave gaps in the reconstruction, yet the evidence you recovered is sufficient to distinguish the true sequence from both traps."],"namedTitle":"Correct Event, Limited Proof","named":["You reach the correct three-part verdict with a thin evidentiary file.","The result is right, although the unrecovered clues would be needed to defend the causal chain under sustained challenge."]},"overclaim":{"title":"The Neglect Theory Overreaches","body":["A hidden forecast would require a newer map or alert record that the archive does not contain.","The working gauges, published trigger, and routed response show an imperfect plan being followed rather than silenced."]},"dismissal":{"title":"The Dam Did Not Create the Water","body":["A deliberate release would begin at the dam and propagate downstream.","The observed tributary-first sequence and water balance leave no missing gate volume for sabotage."]},"wrongNames":{"title":"Right Mechanism, Wrong Attribution","body":["You recognize the governing mechanism but assign it to the wrong actor or move its decisive evidence away from the location where the records and physical traces converge."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"e_asteroid","title":"The Hollow Vale Impact","discipline":"Planetary Defense & Impact Science","venue":"the Hollow Vale impact inquiry","agent":{"name":"Investigator Neve Ostrander","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Planetary-Defense Pioneers","dossierName":"PLANETARY-DEFENSE PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Hollow Vale impact inquiry","DAYS_TOTAL":3,"teaser":"A fireball flattened a valley without a moment of warning. Was it a controlled weapon, was a confirmed detection deliberately downplayed, or did a small dark asteroid approach from the Sun through a documented blind spot in the survey?","overclaimTag":"a weapon dropped from orbit","truthTag":"a natural sunward impact outside survey capability","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A small asteroid approaching from the Sun direction and striking a valley\"><circle cx=\"95\" cy=\"42\" r=\"25\" fill=\"none\" stroke=\"#326891\" stroke-width=\"3\"/><path d=\"M95 7 v18 M95 59 v18 M60 42 h18 M112 42 h18 M70 17 l13 13 M107 54 l13 13 M120 17 l-13 13 M83 54 l-13 13\" stroke=\"#326891\" stroke-width=\"2\"/><path d=\"M145 44 C250 48 350 66 455 92\" fill=\"none\" stroke=\"#B3261E\" stroke-width=\"3\" stroke-dasharray=\"8 5\"/><circle cx=\"250\" cy=\"56\" r=\"7\" fill=\"#B3261E\"/><path d=\"M360 112 q70-45 140 0 t140 0\" fill=\"none\" stroke=\"#121212\" stroke-width=\"3\"/><path d=\"M470 92 l-18 20 h36z\" fill=\"none\" stroke=\"#B3261E\" stroke-width=\"3\"/><\/svg>","overclaimTease":"An impact proves that an object arrived, not that it was observable in advance. Reconstruct the orbit, inspect the raw sky record, and test the survey against the object it actually faced.","CATS":{"who":{"title":"Who is behind it","truth":"nofault","items":[{"id":"director","label":"Sabine Verhoeven — the sky-survey programme director"},{"id":"astronomer","label":"The duty survey astronomer"},{"id":"nofault","label":"An act of nature — an unobservable sunward approach, not a person"}]},"where":{"title":"Where it culminates","truth":"observatory","items":[{"id":"crater","label":"The Impact Crater & Fall Field"},{"id":"observatory","label":"The Survey Observatory Archive"},{"id":"office","label":"The Civil-Defence Coordination Office"}]},"what":{"title":"What happened","truth":"freak","items":[{"id":"freak","label":"A small sunward asteroid struck outside the survey’s capability"},{"id":"weapon","label":"A controlled weapon was deliberately dropped from orbit"},{"id":"downplayed","label":"A confirmed impact detection was downplayed and filed away"}]}},"READING_ORDER":["observer","orbit","clerk"],"CHARACTERS":{"observer":{"name":"Night Observer Kade","role":"Survey night observer","face":"🔭","badge":"K","legend":"the pointing log","hint":"The telescope covered its approved fields, while the object remained inside daytime solar avoidance.","reading":"opik"},"orbit":{"name":"The Orbit Analyst","role":"Orbit-computation analyst","face":"🛰","badge":"O","legend":"the astrometry archive","hint":"No linked pre-impact positions exist; the supposed early streak is an unrelated satellite.","reading":"marsden"},"clerk":{"name":"The Programme Records Clerk","role":"Survey-capability records clerk","face":"🗂","badge":"C","legend":"the completeness file","hint":"Injection tests confirm an object of this size and geometry would not have entered the discovery stream.","reading":"morrison"}},"TOPICS":{"opik":{"sci":"Ernst Öpik (1893-1985)","topic":"Near-Earth asteroid encounters and impact probability","lede":"Ernst Öpik developed a mathematical way to estimate how small bodies encounter planets long before computers could integrate millions of trial orbits.","no":1,"profile":"Ernst Julius Öpik was an Estonian astronomer whose career ranged from stellar structure to meteors, comets, and planetary dynamics. He worked at Tartu Observatory and later at Armagh Observatory in Northern Ireland. In the early twentieth century he recognized that some meteors arrive on orbits capable of crossing Earth’s path and developed methods for calculating the frequency and geometry of close encounters between small bodies and planets.\n\nÖpik’s encounter theory turns orbital elements into probabilities. An asteroid may cross Earth’s orbital distance yet miss the planet because it arrives at a different time, inclination, or node. Repeated planetary encounters can alter its orbit. The method helped establish near-Earth objects as a population whose risks could be treated statistically rather than as supernatural bolts.\n\nProbability does not guarantee advance discovery. Optical surveys observe reflected sunlight and usually avoid pointing close to the Sun. A small dark object approaching from the sunward side can remain at low solar elongation, hidden in daylight glare, until shortly before atmospheric entry. An orbit cannot be calculated from observations that never occur.\n\nThe Hollow Vale object followed precisely that geometry. Atmospheric and infrasound data reconstruct an ordinary natural asteroid trajectory, not a controlled orbital weapon. Backward calculations place it inside the daytime search avoidance zone during every close approach detectable from the local survey. The programme’s logged fields covered its approved night-sky region, and no unused image contains the object. Öpik’s lesson therefore permits a rare but important conclusion: the impact was physically predictable in principle but not observationally available to this ground-based network before entry. A hazard can be real without a negligent person behind it.","frame":"Draws the reconstructed orbit through the bright sector around the Sun. “Crossing Earth’s path is not the same as appearing in a telescope’s night sky.”","q":[{"q":"What determines whether an Earth-crossing asteroid actually encounters the planet?","o":[{"t":"Its orbit needs to reach Earth’s distance at some point during a century.","v":"partial","fb":"Crossing distance creates possibility, while timing and geometry determine the actual meeting."},{"t":"Its timing, node, inclination, and planetary position must coincide in space and time.","v":"expert","fb":"An encounter requires geometric and temporal alignment, not merely overlapping orbital distances."},{"t":"Its diameter alone determines whether the paths intersect during one passage.","v":"wrong","fb":"Size affects brightness and consequences but does not by itself set encounter geometry."},{"t":"Any object that crosses Earth’s orbital radius should have been visible for months.","v":"danger","fb":"Sunward approach and faintness can prevent long-warning optical discovery."}],"clue":{"category":"what","label":"WHAT — lead","text":"The reconstructed orbit approaches from low solar elongation, keeping the object in daylight glare until atmospheric entry."}},{"q":"Which evidence distinguishes a natural asteroid from an orbital weapon?","o":[{"t":"No government publicly claimed responsibility during the first day after impact.","v":"wrong","fb":"Silence by governments is weak compared with physical trajectory and material evidence."},{"t":"Any object arriving from space should be classified as a weapon until disproved.","v":"danger","fb":"Origin should follow measurable dynamics rather than a presumption based on fear."},{"t":"A natural heliocentric orbit fits without propulsion or manufactured debris.","v":"expert","fb":"Orbital dynamics and recovered composition directly test natural versus engineered origin."},{"t":"The explosion was larger than any conventional weapon used in the region.","v":"partial","fb":"Energy scale alone cannot distinguish a natural impact from a hypothetical weapon."}],"clue":{"category":"who","label":"WHO — lead","text":"Trajectory, entry velocity, fragmentation, and composition match a natural small body without controlled maneuvers or artificial material."}},{"q":"Where should the network’s opportunity to detect the object be evaluated?","o":[{"t":"Inside the civil-defence office, where evacuation plans were stored after the event.","v":"wrong","fb":"Response planning does not determine whether photons reached a survey camera."},{"t":"By assuming one ground telescope can observe every part of the sky continuously in all seasons.","v":"danger","fb":"Daylight, weather, horizon, and solar avoidance create real observational limits."},{"t":"At the impact crater, because damage size reveals when telescopes should have seen it.","v":"partial","fb":"Crater energy constrains size but not the earlier visibility geometry by itself."},{"t":"Against the observatory’s actual fields, limiting brightness, cadence, and Sun constraints.","v":"expert","fb":"Detection opportunity depends on where and how deeply the survey actually observed."}],"clue":{"category":"where","label":"WHERE — lead","text":"Survey pointing logs and limiting depths at the observatory show complete approved coverage outside the Sun-avoidance region."}}]},"marsden":{"sci":"Brian Marsden (1937-2010)","topic":"Orbit determination and the Minor Planet Center","lede":"Brian Marsden turned scattered asteroid observations into orbits, warnings, and a durable international record of what the sky had actually shown.","no":2,"profile":"Brian G. Marsden was a British-born astronomer who spent most of his career at the Harvard-Smithsonian Center for Astrophysics and directed the Minor Planet Center. The MPC receives positional measurements of asteroids and comets from observatories around the world, links observations belonging to the same object, calculates preliminary orbits, and publishes information that allows follow-up.\n\nOrbit determination begins with angular positions at known times. A short observational arc can fit many possible distances and velocities, so early predictions may have large uncertainty regions. Additional measurements extend the arc and sharply improve the orbit. If an object is detected only once or near the survey limit, it may be lost before enough follow-up is obtained. Conversely, no orbit can be “buried” if the claimed original detections are absent from images and submission logs.\n\nMarsden was known for taking possible hazards seriously while also revising claims as data improved. His work illustrates the difference between an uncertain warning and evidence that no usable observation existed. Investigators should search raw images, source catalogs, rejected detections, correspondence, and MPC submissions, not merely final public notices.\n\nAt Hollow Vale, the alleged pre-impact detection dissolves under that audit. A streak in one archived frame is a satellite trail at a different time and direction. The object’s reconstructed brightness would have remained below the frame limit and too close to the Sun. No linked positions exist from which an orbit or warning could have been calculated. Marsden’s method therefore weighs against the story that a programme director downplayed a known collision course. The programme possessed no observational arc to downplay. The decisive records at the survey observatory document absence in the only scientifically meaningful sense: the object never entered a usable night-sky data stream.","frame":"Aligns raw frames, rejected detections, and MPC submissions. “A warning needs positions through time. One suspicious streak is not an orbit.”","q":[{"q":"Why is a short observational arc often insufficient for a reliable asteroid orbit?","o":[{"t":"Many combinations of distance and velocity can fit a few angular measurements.","v":"expert","fb":"Additional timed positions constrain the range of trajectories compatible with the observations."},{"t":"One isolated image is enough to prove a collision course if the streak looks unusual.","v":"danger","fb":"An unusual image feature needs identification and follow-up before it becomes an orbit."},{"t":"Asteroids change their physical diameter rapidly during each close approach.","v":"partial","fb":"Apparent size changes with distance, but that is not why short arcs are dynamically ambiguous."},{"t":"Orbit calculations require a recovered meteorite before any prediction is possible.","v":"wrong","fb":"Orbit determination relies on astrometry and does not require a post-impact sample."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"No sequence of positions exists; the supposed early detection is an unrelated satellite streak that cannot define the impactor’s orbit."}},{"q":"What record would reveal that a known hazard was deliberately downplayed?","o":[{"t":"Any rejected image detection, regardless of object identity or measurement quality.","v":"danger","fb":"Rejected artifacts are not hidden hazards unless they contain valid observations of the object."},{"t":"Usable astrometry and an internal orbit assessment absent from the public warning chain.","v":"expert","fb":"Suppression requires evidence that a real assessment existed and was withheld."},{"t":"A general budget memo noting that more sky coverage would improve future surveys.","v":"partial","fb":"A funding concern establishes capability limits, not concealment of this specific object."},{"t":"A public interview where the director calls asteroid impacts statistically rare but possible.","v":"wrong","fb":"General risk communication cannot substitute for a missing pre-impact orbit record."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"The observatory archive contains no linked astrometry, orbit solution, or hazard correspondence for the impactor before entry."}},{"q":"Who is responsible when no usable observations entered the network despite compliant coverage?","o":[{"t":"The duty astronomer, because every missed natural object occurs during someone’s shift.","v":"partial","fb":"Shift presence does not create an opportunity when the target is below limits and in daylight glare."},{"t":"The civil-defence official, because the impact caused damage within that jurisdiction.","v":"wrong","fb":"Jurisdiction over consequences does not create responsibility for impossible advance observation."},{"t":"No listed person, if the object never entered the scientifically available data stream.","v":"expert","fb":"Responsibility requires a missed duty or usable opportunity, neither of which the records show."},{"t":"The programme director, because a survey should detect every hazardous body in the sky.","v":"danger","fb":"No survey can guarantee full-time coverage of every size, direction, and solar elongation."}],"clue":{"category":"who","label":"WHO — corroboration","text":"The evidence supports no culpable candidate: the object remained outside the survey’s observable geometry until impact."}}]},"morrison":{"sci":"David Morrison (b. 1940)","topic":"Planetary defense, survey completeness, and residual risk","lede":"David Morrison helped frame asteroid defense as a survey problem with measurable completeness rather than a promise that every impactor will be found.","no":3,"profile":"David Morrison is an American planetary scientist who has worked on the Solar System, impact hazards, and the public communication of scientific risk. He chaired the 1992 NASA study that helped define the “Spaceguard” goal of discovering large near-Earth objects whose impacts could cause global catastrophe. That programme encouraged systematic surveys, orbit cataloging, and international attention to planetary defense.\n\nSurvey completeness is always conditional. It depends on object size and albedo, sky coverage, cadence, weather, limiting magnitude, and approach direction. Large objects are generally easier to discover long before impact; small bodies can remain undetected, especially when approaching from the Sun. A percentage-complete catalog is therefore not a guarantee against every local airburst.\n\nMorrison also emphasized communicating risk without sensationalism. A low-probability hazard can matter, but uncertain observations should not be presented as certain impacts. Likewise, an actual impact does not retroactively prove that somebody possessed actionable warning. A fair review asks whether the survey met its defined objective and whether the specifi

 is the architecture.”","q":[{"q":"Why is a strong cipher alone insufficient for system security?","o":[{"t":"Keys, modes, implementations, endpoints, and operations can each defeat it.","v":"expert","fb":"Security depends on the full system and its use, not the primitive in isolation."},{"t":"Modern algorithms are all equivalent once they use keys of similar length.","v":"wrong","fb":"Design, mode, implementation, and threat assumptions differ substantially."},{"t":"A strong cipher prevents any insider from making an unsafe policy decision.","v":"danger","fb":"Cryptography cannot stop authorized leaders from choosing weak configurations or retaining obsolete systems."},{"t":"Cipher replacement can wait until nontechnical business risks have been eliminated.","v":"partial","fb":"Technical and organizational risks interact and must be managed together."}],"clue":{"category":"what","label":"WHAT — decisive","text":"The recovered transactions require both an already weak cipher and key material reused after its approved lifetime."}},{"q":"What should a meaningful security exception contain?","o":[{"t":"A statement that the system is proprietary and therefore unlikely to be attacked.","v":"danger","fb":"Obscurity is not a compensating control for a known cryptographic weakness."},{"t":"A permanent approval because migration could interrupt business operations.","v":"wrong","fb":"Indefinite renewal turns accepted risk into the operating design."},{"t":"Known risk, compensating controls, accountable owner, and a time-bounded exit plan.","v":"expert","fb":"A useful exception manages temporary exposure and creates a path to removal."},{"t":"The auditor’s signature without technical detail, owner, or expiration.","v":"partial","fb":"Approval alone cannot guide control, monitoring, or retirement."}],"clue":{"category":"where","label":"WHERE — decisive","text":"Every retirement warning, completed migration plan, and final renewal converges in the Security Architect’s Office."}},{"q":"Which evidence most directly identifies responsibility for continued exposure?","o":[{"t":"The external group’s ability to automate its attack across many accounts.","v":"partial","fb":"Automation describes attacker efficiency but not who accepted the vulnerable architecture."},{"t":"Architect-signed waivers postponing a ready migration after known failures.","v":"expert","fb":"The waivers show who owned the decision to retain the weak design and key practice."},{"t":"The auditor’s report that first documented the deprecated cipher and reuse risk.","v":"wrong","fb":"Finding and reporting the risk is distinct from authorizing its continued use."},{"t":"The key custodian who implemented the approved repeated-stream schedule in production.","v":"danger","fb":"Operational execution matters, but the architecture authority set and renewed the unsafe policy."}],"clue":{"category":"who","label":"WHO — decisive","text":"One architecture owner signed the final production renewal after a completed replacement plan and two successful laboratory demonstrations."}}]}},"story":["<b>Meridian Bank’s proprietary cipher protected millions of transactions until the balances began moving.<\/b>","The Cryptographer can test what secrecy concealed. The Key Custodian holds the reuse history. The Security Records Clerk has the retirement reviews and production renewals.","A celebrated mathematical breakthrough, a brute-force miracle, and an obsolete system left live are all plausible until the same messages are tested against each explanation.","Nine clues can connect the algorithm, the key practice, the technical demonstrations, and the office that repeatedly kept the architecture in service."],"endings":{"overclaimWhat":"genius","dismissalWhat":"bruteforce","win":{"expertTitle":"The Weakness Reproduced","expert":["You connect Lena Marsh, the Security Architect’s Office, and the retired cipher with repeated key material. Laboratory tests reproduced the attack from ordinary techniques and paired messages.","The evidence rejects both a new mathematical breakthrough and exhaustive search of a sound key. Architecture renewals show who retained the exploitable combination after its replacement path was ready."],"soundTitle":"The Laboratory Explains the Loss","sound":["Your accusation identifies the architecture owner, the office, and the deprecated cipher plus repeated streams.","Some implementation details remain incomplete, but the recovered message structure and renewal trail support the same conclusion."],"namedTitle":"Correct Architecture, Limited Proof","named":["You name the right person, place, and mechanism.","Missed clues leave parts of the cryptanalysis or key-reuse chain thin, but the verdict matches the reproduced failure."]},"overclaim":{"title":"No New Mathematics Was Needed","body":["The reconstructed algorithm yielded to established analysis once its secret design became available.","Calling the attackers singular geniuses protects the bank’s design myth and ignores the repeatable laboratory result."]},"dismissal":{"title":"Not a Fair Search of a Sound Key","body":["Paired messages exposed shared stream material and predictable fields long before a full keyspace search would matter.","The brute-force story turns an avoidable design shortcut into computational bad luck."]},"wrongNames":{"title":"The Right Weakness, the Wrong Scene","body":["You recognize the cipher and key failure but misplace the authority or the office where the demonstrated weaknesses were repeatedly accepted."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"f_privacy","title":"The Beacon Consent Scandal","discipline":"Data Privacy & Information Systems","venue":"the Beacon data-privacy inquiry","agent":{"name":"Investigator Iris Kohl","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Data-Privacy Pioneers","dossierName":"DATA-PRIVACY & DATABASE PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Beacon data-privacy inquiry","DAYS_TOTAL":3,"teaser":"Detailed customer records appear for sale under real identities. Did criminals breach the warehouse, did approved analytics remain anonymous, or did someone inside the analytics workflow deliberately reconnect pseudonyms to people and export the result?","overclaimTag":"a criminal breach of the data warehouse","truthTag":"a re-identification analyst converted pseudonyms into a sale file","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A data table linked to a re-identified person and transferred to a commercial file\"><rect x=\"70\" y=\"28\" width=\"210\" height=\"84\" rx=\"6\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M92 50 h166 M92 68 h166 M92 86 h166\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><circle cx=\"400\" cy=\"70\" r=\"30\" fill=\"none\" stroke=\"#326891\" stroke-width=\"2\"/><path d=\"M400 40 v60 M370 70 h60\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><path d=\"M500 48 h80 v44 h-80z\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M475 70 h25\" stroke=\"#B3261E\" stroke-width=\"3\"/><circle cx=\"475\" cy=\"70\" r=\"5\" fill=\"#B3261E\"/><\/svg>","overclaimTease":"Follow the transformation row by row. A warehouse breach, a privacy-preserving analysis, and an internal identity join leave different credentials, outputs, and audit trails.","CATS":{"who":{"title":"Who is behind it","truth":"dataexec","items":[{"id":"dataexec","label":"Mara Venn — the re-identification analyst"},{"id":"thieves","label":"An outside criminal data-theft group"},{"id":"processor","label":"The contracted third-party processor"}]},"where":{"title":"Where it culminates","truth":"analytics","items":[{"id":"warehouse","label":"The Customer Data Warehouse"},{"id":"office","label":"The Data-Product Chief’s Office"},{"id":"analytics","label":"The Analytics & Re-identification Laboratory"}]},"what":{"title":"What happened","truth":"monetized","items":[{"id":"monetized","label":"An analyst restored identities and exported a commercial file"},{"id":"theft","label":"Criminal access exported identified records outside the company"},{"id":"anon","label":"Authorized analytics kept every released person effectively anonymous"}]}},"READING_ORDER":["dataeng2","analyst2","clerk"],"CHARACTERS":{"dataeng2":{"name":"The Data Engineer","role":"Data-warehouse engineer","face":"🗄️","badge":"D","legend":"the warehouse","hint":"The warehouse remained sealed, but a lookup table made its pseudonymous rows linkable from the analytics environment.","reading":"p_reident"},"analyst2":{"name":"The Analytics Lead","role":"Re-identification analyst","face":"📈","badge":"A","legend":"the analytics lab","hint":"One analyst account ran the identity join, generated named profiles, and staged the commercial extract.","reading":"p_diffpriv"},"clerk":{"name":"The Compliance Clerk","role":"Consent and contract clerk","face":"🗂","badge":"C","legend":"the data office","hint":"The approved product called for anonymous aggregates; the named row-level file never received compliance approval.","reading":"p_context"}},"TOPICS":{"p_reident":{"sci":"Latanya Sweeney (b. 1968)","topic":"Re-identification & k-anonymity","lede":"Latanya Sweeney showed that removing names does not make records anonymous when ordinary details can be linked to another dataset.","no":1,"profile":"Latanya Sweeney is a computer scientist whose work transformed public understanding of data anonymity. In the 1990s she demonstrated how records stripped of obvious identifiers could be re-identified by linking fields such as date of birth, sex, and ZIP code with publicly available voter information. Her best-known demonstration matched de-identified medical records to the voter roll and identified the record of the governor of Massachusetts. The lesson was not that every dataset is equally vulnerable, but that combinations of common attributes can be highly distinctive.\n\nSweeney developed the concept of k-anonymity, which requires each released record to be indistinguishable from at least k minus one others with respect to selected quasi-identifiers. Generalizing dates, suppressing rare categories, and broadening geography can reduce uniqueness. But k-anonymity has limits: it does not automatically prevent inference from sensitive values within a group, protect against outside knowledge, or cover new linkage sources that appear later.\n\nRe-identification is therefore a systems property. Investigators ask what fields were released, what auxiliary datasets were available, whether stable pseudonyms persisted across tables, and whether an internal mapping key remained accessible. A dataset can look anonymous on its face while preserving a direct route back to customer accounts.\n\nAt Beacon, the released rows could be reconnected to customer accounts through a persistent internal key. The warehouse logs show no external intrusion and no bulk export from its service account. Instead, the identity bridge was invoked from the analytics environment by a user who already possessed legitimate access. Sweeney’s work makes that distinction concrete: removing names is not anonymity when a second table restores them, and the person who performs the join leaves a different trail from a thief who breaks into storage.","frame":"Joins three “anonymous” attributes to a customer table and highlights one exact match. “A missing name is not anonymity if the rest of the row points back to one person.”","q":[{"q":"What is a quasi-identifier in re-identification research?","o":[{"t":"A secret database key used to map a coded record directly to one account.","v":"partial","fb":"A key can enable direct mapping, but quasi-identifiers are ordinary descriptive fields used in combination."},{"t":"A fabricated identity inserted by criminals to conceal a data breach.","v":"wrong","fb":"Quasi-identifiers are real record attributes, not attacker aliases."},{"t":"A non-name field that can identify someone when combined with outside data.","v":"expert","fb":"Birth date, geography, sex, and similar attributes can become identifying through linkage."},{"t":"Any field the company labels anonymous, regardless of its linkage potential.","v":"danger","fb":"A label does not determine whether outside data can make the field identifying."}],"clue":{"category":"what","label":"WHAT — lead","text":"Removing direct names did not prevent linkage because a persistent key connected the rows back to customer accounts."}},{"q":"What does k-anonymity attempt to achieve?","o":[{"t":"Each record shares its quasi-identifier pattern with at least k records.","v":"expert","fb":"The method reduces uniqueness by making selected identifying combinations less specific."},{"t":"Every sensitive value is encrypted with a different one-time key.","v":"wrong","fb":"Encryption and k-anonymity address different threats and use different mechanisms."},{"t":"No analyst can learn anything useful from the released dataset.","v":"partial","fb":"The goal is to retain utility while reducing identity risk, not eliminate all information."},{"t":"The company may sell data freely once direct names are removed.","v":"danger","fb":"De-identification does not by itself establish consent or appropriate use."}],"clue":{"category":"where","label":"WHERE — lead","text":"The warehouse retained pseudonymous service rows; the first named records appear only after queries run in the analytics environment."}},{"q":"Which record best distinguishes an internal identity join from a warehouse breach?","o":[{"t":"A sales contract showing that another company wanted detailed records.","v":"partial","fb":"Commercial interest supplies motive but does not identify the technical route."},{"t":"A list of customer fields stored in the warehouse before the incident.","v":"wrong","fb":"Stored fields describe risk but not who performed the identity restoration."},{"t":"A claim that pseudonymous identifiers can never be tied back to people.","v":"danger","fb":"Pseudonyms can be linkable; treating them as permanent anonymity is the error."},{"t":"Analytics queries invoking the lookup key while warehouse access stays normal.","v":"expert","fb":"The split audit trail shows legitimate storage access followed by deliberate re-identification."}],"clue":{"category":"who","label":"WHO — lead","text":"The identity lookup was invoked through one ordinary analyst account; warehouse and processor credentials show no corresponding breach."}}]},"p_diffpriv":{"sci":"Cynthia Dwork (b. 1958)","topic":"Differential privacy","lede":"Cynthia Dwork helped define privacy as a measurable limit on what an analysis can reveal about any one person’s participation.","no":2,"profile":"Cynthia Dwork is a theoretical computer scientist whose research spans cryptography, distributed systems, fairness, and privacy. In the mid-2000s, with collaborators, she introduced differential privacy as a rigorous answer to a recurring database problem: even aggregate statistics can leak information when many queries are combined or compared with outside knowledge. Removing names is not enough if the outputs change noticeably when one person’s data is present.\n\nA randomized algorithm is differentially private when its output distribution is nearly the same whether any one individual’s record is included or removed. The parameter epsilon describes the privacy loss bound; smaller values generally provide stronger privacy, though accuracy and cumulative use must be managed. Noise can be calibrated to query sensitivity, and a privacy budget tracks the effect of repeated analyses. The guarantee concerns what an observer can infer from outputs, not merely how the source table is labeled.\n\nDifferential privacy is designed primarily for statistics and models, not for publishing detailed row-level histories that remain useful for individual targeting. Exact matches, persistent identifiers, and unrestricted repeated queries are warning signs. A system may use encryption and access controls yet still violate privacy if authorized analysts can reconstruct individuals from precise outputs.\n\nBeacon’s product requirement called for aggregate trends with privacy controls, yet the disputed output contained exact named rows, locations, and events. Differential privacy would have limited what any one person contributed; this file did the opposite by preserving individual detail. Query history shows that the analyst repeatedly reduced grouping thresholds, joined the customer lookup, and staged the export. Dwork’s framework therefore identifies both the mechanism and the scene: the privacy failure was created in the analytics laboratory, not discovered after data escaped the warehouse.","frame":"Compares a noisy population chart with an exact customer dossier. “Privacy is not the word on the input table. It is the bound on what the output lets someone infer about one person.”","q":[{"q":"What does differential privacy bound?","o":[{"t":"How many employees may open an encrypted database during one workday.","v":"partial","fb":"Access control matters, but it is not the mathematical guarantee differential privacy provides."},{"t":"How much outputs change when one person’s record is added or removed.","v":"expert","fb":"The guarantee limits the influence of any individual’s participation on released results."},{"t":"Whether a dataset contains direct names before analysis begins.","v":"wrong","fb":"The framework protects outputs even when identification risks arise from inference rather than explicit names."},{"t":"Whether a company has permission to use data for any profitable purpose.","v":"danger","fb":"A mathematical privacy guarantee cannot substitute for consent and contextual limits."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"The disputed output preserved exact individuals rather than noisy aggregates or privacy-bounded statistics."}},{"q":"Why is repeated querying important in privacy analysis?","o":[{"t":"Repeated queries automatically encrypt the original records more securely.","v":"wrong","fb":"Query volume does not strengthen encryption and can instead increase information leakage."},{"t":"A repeated identical query confirms repeatability while leaving anonymity untested.","v":"partial","fb":"Repetition may test stability, but it does not establish a privacy guarantee."},{"t":"Many outputs can accumulate privacy loss and expose new individual details.","v":"expert","fb":"Composition is central because individually modest disclosures can combine into strong inference."},{"t":"Analysts may repeat queries without limit once direct identifiers are removed.","v":"danger","fb":"Unlimited precise queries can defeat superficial de-identification."}],"clue":{"category":"who","label":"WHO — corroboration","text":"The same user wrote the linkage script, lowered the grouping threshold, and staged the named export from a laboratory workstation."}},{"q":"Where did the privacy promise become a named commercial product?","o":[{"t":"In the analytics lab, where exact rows were joined to the identity table.","v":"expert","fb":"The named output was created by the linkage and export steps in analytics."},{"t":"In the warehouse, where pseudonymous service records were originally stored.","v":"partial","fb":"Storage began the data lifecycle but did not create the identified sale file."},{"t":"In the processor’s office, where a standard data-handling contract was signed.","v":"wrong","fb":"The contract did not authorize the row-level identity restoration at issue."},{"t":"On the criminal market, because any sale proves an outside breach occurred.","v":"danger","fb":"A later market appearance does not establish how the file was produced."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"Exact row-level matches, identity lookup calls, and export staging all occur on the re-identification laboratory’s systems."}}]},"p_context":{"sci":"Helen Nissenbaum (b. 1954)","topic":"Privacy as contextual integrity","lede":"Helen Nissenbaum reframed privacy as appropriate information flow: who sends what about whom, to which recipient, under what conditions.","no":3,"profile":"Helen Nissenbaum is a philosopher of technology whose theory of contextual integrity explains why privacy cannot be reduced to secrecy or individual control over isolated facts. Social life contains different contexts—health care, education, banking, friendship, employment—each with roles, purposes, and norms governing information flow. A fact may be appropriately shared in one setting and deeply intrusive when transferred to another recipient or used for another purpose.\n\nContextual integrity analyzes the actors, information type, transmission principle, and surrounding social purpose. A customer may provide location data to deliver a service, authorize a physician to share records for treatment, or give a bank information to assess a transaction. Those flows do not automatically authorize sale to advertisers, insurers, or data brokers. Consent language matters, but a broad legal clause can still conflict with reasonable contextual expectations if it silently changes recipient and purpose.\n\nThe theory also clarifies why “nothing secret was exposed” is a weak defense. Harm can arise from aggregation, persistence, and repurposing of information that was individually available. Likewise, security and privacy are distinct. A perfectly secured system can violate privacy through authorized flows that break contextual norms; a breach is not required.\n\nNissenbaum’s contextual integrity separates permission to operate a service from permission to sell named profiles. Beacon’s chief had approved an aggregate product, and the processor contract did not authorize identity restoration. The decisive breach occurred when an analyst repurposed service data inside the analytics workflow and produced a recipient-ready file outside those constraints. That makes the commercial context violation real without turning every manager, processor, or warehouse engineer into the culprit.","frame":"Places the customer consent beside the broker contract and draws arrows between sender, subject, recipient, and purpose. “The same data can be proper in one flow and wrongful in another.”","q":[{"q":"What does contextual integrity evaluate?","o":[{"t":"Whether data remains inside a technically secure network perimeter.","v":"partial","fb":"Security is relevant, but an authorized internal transfer can still violate contextual norms."},{"t":"Whether every person named in a dataset is already publicly known.","v":"wrong","fb":"Public availability of some facts does not authorize all aggregation and reuse."},{"t":"Whether a privacy policy contains broad language permitting future business use.","v":"danger","fb":"Formal breadth does not settle whether a new recipient and purpose preserve contextual integrity."},{"t":"Whether a data flow fits its roles, recipient, purpose, and governing norms.","v":"expert","fb":"Privacy depends on the appropriateness of the flow, not simply whether the fact is secret."}],"clue":{"category":"what","label":"WHAT — decisive","text":"A legitimate-access analyst restored identities and repurposed service records into a commercial sale file."}},{"q":"Why does the absence of a security breach not resolve this case?","o":[{"t":"Every privacy violation requires malware, stolen passwords, or an outside intruder.","v":"wrong","fb":"Misuse by authorized insiders is a central privacy risk."},{"t":"Authorized users can violate privacy by sending data through an inappropriate flow.","v":"expert","fb":"Privacy can fail through approved repurposing even when access controls function exactly as designed."},{"t":"A secure transfer indicates that customers consented to the destination.","v":"danger","fb":"Transport security protects data in motion but says nothing about permission or purpose."},{"t":"Security logs belong to criminal investigations rather than privacy analysis.","v":"partial","fb":"Logs help distinguish intrusion from authorized misuse, even though they do not settle consent."}],"clue":{"category":"where","label":"WHERE — decisive","text":"The customer key, named profiles, and recipient-ready commercial file converge in the Analytics & Re-identification Laboratory."}},{"q":"Which document best connects the changed data flow to the executive who approved it?","o":[{"t":"The warehouse log showing engineers maintained normal uptime and data availability.","v":"wrong","fb":"Uptime does not establish who approved re-identification or sale."},{"t":"The processor invoice documenting the transfer service and destination account.","v":"partial","fb":"The invoice shows implementation, while the company-side authorization identifies the governing decision."},{"t":"The signed contract sending identified profiles to a recipient absent from consent.","v":"expert","fb":"The contract connects the changed information flow to the executive who authorized it."},{"t":"A criminal forum post offering unrelated records and claiming a wider Beacon breach.","v":"danger","fb":"External criminal activity elsewhere cannot outweigh Beacon’s own contract and access trail."}],"clue":{"category":"who","label":"WHO — decisive","text":"One re-identification analyst created the identity bridge, named output, and transfer package despite an aggregate-only product specification."}}]}},"story":["<b>Beacon insists its intimate records were anonymous; buyers received names, locations, and histories.<\/b>","The Data Engineer can trace the warehouse keys. The Analytics Lead can compare the product with privacy-bounded output. The Compliance Clerk holds the approved purpose and recipient rules.","A criminal breach, a harmless anonymous analysis, and an internal re-identification each predict a different sequence of credentials and transformations.","The notepad must reconstruct where pseudonyms became people and who performed that conversion."],"endings":{"overclaimWhat":"theft","dismissalWhat":"anon","win":{"expertTitle":"The Identity Join","expert":["You connect Mara Venn, the Analytics & Re-identification Laboratory, and the internal restoration of identities for a commercial file.","Normal warehouse access, exact row-level output, and a single analyst audit trail reject both an outside break-in and the claim that the data remained anonymous."],"soundTitle":"The Named Output","sound":["Your accusation identifies the analyst, the analytics laboratory, and the unauthorized identity join.","Some contract or query details remain missing, but the transformation and export trail support the result."],"namedTitle":"Right Join, Thin Audit","named":["You select the correct person, location, and mechanism.","The verdict holds, although missed clues leave parts of the credential or context chain less developed."]},"overclaim":{"title":"The Warehouse Was Not Breached","body":["Storage logs show ordinary authenticated use rather than criminal entry or bulk extraction.","The identified file was created later through internal linkage, so the break-in story misses the actual act."]},"dismissal":{"title":"These Were Not Anonymous Aggregates","body":["The product preserved exact row-level identities, places, and events instead of limiting individual contribution.","Calling it anonymous ignores the lookup key and the named file generated from it."]},"wrongNames":{"title":"The Privacy Failure, Misassigned","body":["You recognize re-identification and sale but place the responsible analyst or decisive analytics environment elsewhere."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"f_breach","title":"The Halcyon Data Breach","discipline":"Computer Security & Information Systems","venue":"the Halcyon breach inquiry","agent":{"name":"Investigator Nora Vance","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Computer-Security Pioneers","dossierName":"COMPUTER-SECURITY PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Halcyon breach inquiry","teaser":"Ninety million records leave Halcyon through systems reported fully patched. Did a foreign intrusion crew compromise a trusted software path, did a known vulnerability remain open behind muted alarms, or did an internal service failure merely make intact records appear stolen?","overclaimTag":"an external supply-chain intrusion","truthTag":"a genuine foreign compromise of a trusted update path","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A signed software update entering database servers through a hidden command channel\"><rect x=\"65\" y=\"30\" width=\"155\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M85 52 h115 M85 70 h115 M85 88 h70\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><path d=\"M300 38 h80 v64 h-80z\" fill=\"none\" stroke=\"#326891\" stroke-width=\"2\"/><path d=\"M325 62 l12 12 22-30\" fill=\"none\" stroke=\"#326891\" stroke-width=\"3\"/><path d=\"M380 70 h85\" stroke=\"#B3261E\" stroke-width=\"3\"/><path d=\"M440 58 l14 12-14 12\" fill=\"none\" stroke=\"#B3261E\" stroke-width=\"3\"/><rect x=\"465\" y=\"28\" width=\"125\" height=\"84\" rx=\"6\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><\/svg>","overclaimTease":"An extraordinary intrusion is not proved by scale alone. It must leave a new trust failure, an external command path, and evidence that ordinary patch and alert controls were not the open door.","DAYS_TOTAL":3,"CATS":{"who":{"title":"Who is behind it","truth":"hacker","items":[{"id":"vendor","label":"The enterprise-software vendor"},{"id":"hacker","label":"The Ardent Jackal foreign intrusion crew"},{"id":"cto","label":"Dane Ferro — Halcyon security chief"}]},"where":{"title":"Where it culminates","truth":"servers","items":[{"id":"servers","label":"The Customer Database Servers"},{"id":"office","label":"The Security Chief’s Office"},{"id":"soc","label":"The Security Operations Centre"}]},"what":{"title":"What happened","truth":"mastermind","items":[{"id":"unpatched","label":"A known unpatched flaw and muted alert enabled ordinary intrusion"},{"id":"zeroday","label":"A storage failure made intact records appear externally stolen"},{"id":"mastermind","label":"A foreign crew compromised a trusted signed-update path"}]}},"READING_ORDER":["analyst","admin","clerk"],"CHARACTERS":{"analyst":{"name":"The SOC Analyst","role":"Security-operations analyst","face":"🖥️","badge":"A","legend":"the detection console","hint":"Routine vulnerability alerts were open and resolved; the first anomalous process carried a valid vendor signature.","reading":"denning"},"admin":{"name":"Sysadmin Rao","role":"Systems administrator","face":"🔧","badge":"S","legend":"the database cluster","hint":"The affected hosts were current on published patches, yet a trusted updater created an unlisted privileged service.","reading":"thompson"},"clerk":{"name":"The Incident Records Clerk","role":"Forensic logs and vendor liaison","face":"🗂","badge":"C","legend":"the evidence archive","hint":"Command traffic, staging times, and reused infrastructure match a foreign campaign rather than an internal outage.","reading":"stoll"}},"TOPICS":{"denning":{"sci":"Dorothy Denning (b. 1945)","topic":"Intrusion detection","lede":"Denning taught defenders to recognize misuse from behaviour, especially when a trusted control lets the first step through.","no":1,"profile":"Dorothy Denning is an American computer scientist whose 1980s research helped establish intrusion detection as a field. Her central observation was that security controls cannot prevent every misuse, so systems also need methods for recognizing behaviour that departs from legitimate activity. She proposed analysing audit records for patterns associated with users, programs, and resources, then flagging statistical anomalies and known forms of abuse.\n\nIntrusion detection has since divided into several overlapping approaches. Signature systems look for previously identified indicators, while anomaly systems model expected behaviour and highlight deviations. Host sensors can see processes, privileges, and file changes; network sensors can see connections and data flows. Detection quality depends on context. A rare administrator action may be legitimate, and a patient attacker may imitate ordinary traffic. Investigators therefore correlate many weak signals rather than treating one alert as a verdict.\n\nDenning’s framework also distinguishes prevention failure from detection failure. If a published vulnerability remains open and an alert is muted, the chain should contain scanner findings and repeated warnings before exploitation. A novel trusted-path compromise may begin differently: a signed process launches, behaves normally at first, then creates new privileges or contacts infrastructure not present in any rule set.\n\nHalcyon’s routine critical findings were patched and closed before the breach window. The earliest anomaly is a validly signed updater spawning an undocumented service, followed by encrypted outbound sessions to newly registered domains. Denning’s method does not make a sophisticated attacker mythical. It shows why this case begins with a fresh behavioural deviation rather than the known alert history the internal-negligence theory requires.","frame":"The analyst sorts closed vulnerabilities from the first unexplained process. “Known noise has a history. This began with something our rules had never seen.”","q":[{"q":"What problem was Denning’s intrusion-detection model designed to address?","o":[{"t":"Recognizing misuse from audit behaviour even when preventive controls do not block it.","v":"expert","fb":"Intrusion detection examines activity that preventive barriers may allow or miss."},{"t":"Guaranteeing that nearly every authorized program is harmless once it carries a signature.","v":"partial","fb":"A signature authenticates provenance, not the future behaviour of every signed component."},{"t":"Replacing all access controls with one statistical score for each employee.","v":"wrong","fb":"Detection complements rather than replaces access control."},{"t":"Determining an attacker’s nationality from the volume of stolen records alone.","v":"danger","fb":"Attribution requires infrastructure and operational evidence, not breach size."}],"clue":{"category":"what","label":"WHAT clue","text":"Denning’s chronology begins with a newly abnormal signed process, while the ordinary patch and alert findings were already closed before entry."}},{"q":"Why are several weak indicators often stronger than one dramatic alert?","o":[{"t":"A single alert is rarely useful unless at least ten different products repeat it.","v":"partial","fb":"One high-quality alert may matter; the issue is corroboration, not an arbitrary count."},{"t":"Correlated process, privilege, and network changes can form a coherent intrusion sequence.","v":"expert","fb":"Correlation across layers reduces the ambiguity of any one unusual event."},{"t":"Statistical anomalies automatically prove malicious intent without contextual review on the hosts.","v":"wrong","fb":"Anomalies require interpretation because legitimate work can also be unusual."},{"t":"Multiple indicators matter mainly when they are all generated by the same sensor.","v":"danger","fb":"Independent sensors often strengthen rather than weaken the chain."}],"clue":{"category":"where","label":"WHERE clue","text":"The correlated sequence—signed updater, privileged service, staging process, and egress—converges on the protected storage tier rather than the security office."}},{"q":"Which record would best support a muted-known-alert explanation?","o":[{"t":"A fully patched host starting a new signed service after a vendor update.","v":"partial","fb":"That sequence instead suggests compromise of a trusted update mechanism."},{"t":"A command domain registered shortly before data staging begins on the hosts.","v":"wrong","fb":"New infrastructure supports an external operation rather than an old muted alert."},{"t":"A repeated scanner finding left unresolved before the same flaw is exploited.","v":"expert","fb":"An unresolved matching finding would establish the ordinary preventable path."},{"t":"An unfamiliar process appearing first on systems with one software supplier on the hosts.","v":"danger","fb":"Supplier concentration points toward the update channel, not a generic patch lapse."}],"clue":{"category":"who","label":"WHO clue","text":"The SOC analyst’s closed-ticket record excludes the security chief’s deferred-patch theory and shifts attention toward whoever controlled the external command infrastructure."}}]},"thompson":{"sci":"Ken Thompson (b. 1943)","topic":"Trusting trust & software supply chains","lede":"Thompson showed that clean source can inherit a hidden betrayal from the tool that builds it.","no":2,"profile":"Ken Thompson helped create Unix at Bell Labs and later delivered one of computer security’s most unsettling arguments. In his 1984 Turing Award lecture, “Reflections on Trusting Trust,” he described how a compiler could be modified to insert a hidden backdoor when compiling a login program—and to reproduce the malicious compiler behaviour when compiling itself. The source code of both programs could then appear clean.\n\nThe thought experiment showed that inspection stops somewhere. Software depends on compilers, libraries, build systems, signing keys, update servers, and hardware. If an earlier trusted layer is compromised, later verification may faithfully approve malicious output. Thompson did not argue that trust is hopeless. He showed that security claims must include the provenance and diversity of the tools that produced the artifact.\n\nModern software signing has the same boundary. A valid signature proves that a package was signed by a particular key; it does not prove the build environment was honest or that the signer intended every included component. Reproducible builds, isolated signing, independent review, and multiple verification paths can narrow the trusted base.\n\nHalcyon’s updater bore the vendor’s valid signature and passed ordinary allow-listing. Binary comparison later found a loader absent from the public source and previous release. The compromised component installed a privileged service only on selected customer environments. Thompson’s lesson explains how a real external operation could cross a “trusted” boundary without an unpatched Halcyon server. The question becomes which build or signing layer changed, and who used the resulting access—not whether the familiar green check mark existed.","frame":"Rao compares a signed binary with the public source. “The signature is valid. The extra loader is also real. Tell me how both can be true.”","q":[{"q":"What did Thompson’s “trusting trust” example demonstrate?","o":[{"t":"Source review generally detects a backdoor before any program can be distributed.","v":"partial","fb":"Thompson’s point was precisely that source inspection can stop too late."},{"t":"A strong password prevents malicious code from entering through the build system.","v":"wrong","fb":"Authentication does not protect a compromised compiler or signing pipeline."},{"t":"Mainly hardware defects can survive repeated recompilation of a program.","v":"danger","fb":"The mechanism is software-based and can reproduce itself through compilation."},{"t":"A compromised compiler can insert hidden behaviour while apparently clean source remains.","v":"expert","fb":"The attack persists through the toolchain rather than appearing in inspected source."}],"clue":{"category":"what","label":"WHAT clue","text":"The valid signature cannot rescue the benign-update story because the delivered binary contains a loader absent from the reviewed source and earlier builds."}},{"q":"What does a valid software signature establish most directly?","o":[{"t":"That the package was signed with the corresponding key and was not altered afterward.","v":"expert","fb":"A signature authenticates origin and integrity after signing, not semantic safety."},{"t":"That nearly every line in the package is safe and matches the public source repository.","v":"partial","fb":"A compromised build can produce a signed binary that differs from reviewed source."},{"t":"That the vendor’s build environment could not have been accessed by an attacker.","v":"wrong","fb":"Signing says nothing by itself about the security of the build environment."},{"t":"That the receiving server no longer needs behavioural monitoring or least privilege.","v":"danger","fb":"Trusted software still requires constrained privilege and monitoring."}],"clue":{"category":"where","label":"WHERE clue","text":"Binary provenance links the implanted service to the signed updater installed on the database cluster, placing the operative breach at the servers."}},{"q":"Which control most directly reduces dependence on one hidden build chain?","o":[{"t":"A longer end-user password printed on the software installation guide.","v":"partial","fb":"User passwords do not validate compiler or package provenance."},{"t":"Independently reproducible builds compared across separate trusted environments.","v":"expert","fb":"Independent reproduction can expose output that one compromised toolchain alone creates."},{"t":"Disabling all update checks so the installed version rarely changes.","v":"wrong","fb":"Refusing updates preserves known flaws and is not a sound supply-chain defense."},{"t":"Keeping the compiler name confidential from customers and researchers.","v":"danger","fb":"Secrecy of tool names does not provide independent verification."}],"clue":{"category":"who","label":"WHO clue","text":"The malicious loader appears in the vendor-signed artifact but activates through foreign command servers; that combination separates the software vendor’s compromised path from the crew directing the operation."}}]},"stoll":{"sci":"Cliff Stoll (b. 1950)","topic":"Tracking an intruder through the logs","lede":"Stoll followed a few cents of discrepancy through months of logs until a remote operation acquired a shape.","no":3,"profile":"Cliff Stoll was an astronomer working as a systems manager at Lawrence Berkeley Laboratory when a tiny accounting discrepancy led him into a year-long intrusion investigation. In the mid-1980s he traced unauthorized activity through university and military networks, documenting login times, commands, files sought, and connections relayed across multiple systems. The case became widely known through his book The Cuckoo’s Egg.\n\nStoll’s achievement was patient correlation. Attackers can erase or alter local evidence, but complex operations leave traces at many boundaries: authentication logs, modem records, network gateways, telephone systems, account changes, and target selection. Time zones and work schedules can suggest location, while repeated infrastructure and tradecraft can link incidents. Such clues support attribution gradually; one Internet address or one foreign-language command is not enough.\n\nHe also used controlled observation, allowing the intruder to continue under surveillance so investigators could understand objectives and coordinate with other organizations. That strategy carries risk and requires authorization, but it showed the value of reconstructing an operation rather than stopping at the first compromised account.\n\nHalcyon’s command domains, staging intervals, and collection priorities overlap with a documented Ardent Jackal campaign against similar firms. The same certificate pattern and operator work hours recur, while the data leave through external relays rather than disappearing in a storage fault. Stoll’s method ties the trusted-path compromise to an active crew. It also disciplines the sensational claim: attribution rests on repeated infrastructure and behaviour, not on calling a large breach “nation-state” because the phrase sounds proportionate to the damage.","frame":"The clerk strings domains, certificates, and login times across the wall. “Attribution is not a flag on a screen. It is repetition. Find it.”","q":[{"q":"What made Stoll’s intrusion investigation persuasive?","o":[{"t":"He identified the attacker from one suspicious login address on the first night.","v":"partial","fb":"One address can be relayed or shared and is rarely sufficient attribution."},{"t":"He assumed that any search for military files proved a specific government sponsor.","v":"wrong","fb":"Target interest alone does not establish who directs the attacker."},{"t":"He correlated commands, times, accounts, and network paths across many systems.","v":"expert","fb":"The multi-source chronology transformed scattered traces into an operational pattern."},{"t":"He erased all compromised logs so the intruder would not know he was being watched.","v":"danger","fb":"Preserving evidence was central to following the intrusion."}],"clue":{"category":"who","label":"WHO clue","text":"Stoll-style correlation links the command domains, certificates, work hours, and target choices to the Ardent Jackal crew rather than a Halcyon employee."}},{"q":"Why is data egress important when testing a “storage failure” explanation?","o":[{"t":"Any database outage automatically creates identical copies on foreign servers.","v":"partial","fb":"An outage does not inherently transmit data elsewhere."},{"t":"Storage faults generally use command domains registered just before the event.","v":"wrong","fb":"Fresh command infrastructure is operational evidence, not a storage-fault symptom."},{"t":"Egress volume strongly suggests the legal identity of the person operating the remote system.","v":"danger","fb":"Traffic supports attribution but does not by itself name a person."},{"t":"External relays receiving staged archives show records were transferred, not merely unavailable.","v":"expert","fb":"Observed transfer paths distinguish exfiltration from a local availability problem."}],"clue":{"category":"what","label":"WHAT clue","text":"Staged archives crossed external relays under interactive command, ruling out the benign claim that an internal storage fault only made records appear missing."}},{"q":"Which attribution claim is strongest?","o":[{"t":"The operation reuses infrastructure and tradecraft documented across several related intrusions.","v":"expert","fb":"Repeated campaign infrastructure and behaviour provide cumulative attribution evidence."},{"t":"The breach is very large, so mainly one particular government could have caused it.","v":"partial","fb":"Scale does not uniquely identify an actor."},{"t":"A command was typed during nighttime in Halcyon’s local time zone on the hosts.","v":"wrong","fb":"Local nighttime is daytime in many regions and remains weak evidence."},{"t":"The attacker used encryption, which distinguishes foreign crews from ordinary criminals.","v":"danger","fb":"Encryption is common across many legitimate and malicious operations."}],"clue":{"category":"where","label":"WHERE clue","text":"The final outbound sessions and staged archives are preserved on the database-server forensic images, where the intrusion’s collection objective becomes explicit."}}]}},"story":["<b>Halcyon’s dashboards show green patches and valid signatures while customer archives stream toward unfamiliar relays.<\/b>","The SOC Analyst can separate old findings from the first anomaly. Sysadmin Rao has the signed updater and binary comparison. The Incident Records Clerk holds the campaign correlation.","A neglected known flaw, a harmless storage failure, and a genuine foreign operation all remain possible until trust provenance and egress are reconstructed.","The file must prove not merely that records left, but who directed the transfer and how a trusted path became the entry point."],"endings":{"overclaimWhat":"unpatched","dismissalWhat":"zeroday","win":{"expertTitle":"The Trusted Path Was the Breach","expert":["You connect the Ardent Jackal foreign intrusion crew, the Customer Database Servers, and a foreign compromise of a trusted signed-update path. The full clue chain links the initiating condition, the physical mechanism, and the decisive record without relying on candidate order.","The two alternative explanations each fit part of the scene, but neither survives the combined timing, material, and documentary evidence."],"soundTitle":"The External Operation","sound":["Your accusation identifies the Ardent Jackal foreign intrusion crew, the Customer Database Servers, and a foreign compromise of a trusted signed-update path.","A few missed clues leave gaps in the reconstruction, yet the evidence you recovered is sufficient to distinguish the true sequence from both traps."],"namedTitle":"Correct Crew, Thin Attribution","named":["You reach the correct three-part verdict with a thin evidentiary file.","The result is right, although the unrecovered clues would be needed to defend the causal chain under sustained challenge."]},"overclaim":{"title":"The Deferred-Patch Story Fails","body":["Halcyon’s matching critical findings were patched and closed before the breach window.","The first access came through a new signed component, not an old exposed service or muted recurring alert."]},"dismissal":{"title":"The Records Were Taken, Not Lost","body":["A storage failure cannot account for staged archives, external relays, and interactive command traffic.","The records were not merely unavailable; they were selected and transferred through a campaign infrastructure."]},"wrongNames":{"title":"Right Mechanism, Wrong Attribution","body":["You recognize the governing mechanism but assign it to the wrong actor or move its decisive evidence away from the location where the records and physical traces converge."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"f_netout","title":"The Great Grey-Out","discipline":"Computer Networks & the Internet","venue":"the network-outage inquiry","agent":{"name":"Investigator Tay Brennan","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Networking Pioneers","dossierName":"NETWORKING & INTERNET PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the network-outage inquiry","teaser":"Half the web becomes unreachable after one routing announcement spreads across peers. Was it a coordinated attack, an ordinary traffic surge, or a filter-bypassing configuration pushed by the on-call engineer?","overclaimTag":"a coordinated attack on global routing","truthTag":"a frontline route leak after a safeguard was bypassed","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A bad route announcement spreading from one core router through peers\"><g fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"><circle cx=\"100\" cy=\"70\" r=\"22\"/><circle cx=\"260\" cy=\"35\" r=\"22\"/><circle cx=\"260\" cy=\"105\" r=\"22\"/><circle cx=\"450\" cy=\"35\" r=\"22\"/><circle cx=\"450\" cy=\"105\" r=\"22\"/><circle cx=\"580\" cy=\"70\" r=\"22\"/><\/g><g stroke=\"#e2e2d8\" stroke-width=\"2\"><path d=\"M122 64 L238 41 M122 76 L238 99 M282 35 H428 M282 105 H428 M472 41 L558 64 M472 99 L558 76\"/><\/g><path d=\"M100 70 L580 70\" stroke=\"#B3261E\" stroke-width=\"4\" stroke-dasharray=\"8 6\"/><path d=\"M360 58 l14 12-14 12\" fill=\"none\" stroke=\"#B3261E\" stroke-width=\"3\"/><\/svg>","overclaimTease":"A global-looking failure can still begin with one ordinary configuration. Follow the route origin, the propagation rules, and the congestion signature before deciding whether an adversary was needed.","DAYS_TOTAL":3,"CATS":{"who":{"title":"Who is behind it","truth":"netops","items":[{"id":"attackers","label":"An outside routing-attack crew"},{"id":"registry","label":"The regional routing registry"},{"id":"netops","label":"Mara Quill — the on-call network engineer"}]},"where":{"title":"Where it culminates","truth":"routers","items":[{"id":"office","label":"The Operations Manager’s Office"},{"id":"noc","label":"The Network Operations Centre"},{"id":"routers","label":"The Core Routers & Peering Edge"}]},"what":{"title":"What happened","truth":"misconfig","items":[{"id":"misconfig","label":"A local route leak spread after an outbound filter was bypassed"},{"id":"attack","label":"A coordinated adversary injected false routes across the network"},{"id":"surge","label":"An ordinary traffic surge exhausted otherwise correct paths"}]}},"READING_ORDER":["engineer","peering","clerk"],"CHARACTERS":{"engineer":{"name":"The Network Engineer","role":"On-call network engineer","face":"🌐","badge":"N","legend":"the change console","hint":"One emergency command disabled export validation and originated a more-specific route from the wrong edge.","reading":"rekhter"},"peering":{"name":"The Peering Coordinator","role":"Peering and routing coordinator","face":"🔀","badge":"P","legend":"the peering edge","hint":"Peers accepted the announcement according to policy; the route’s origin and path begin inside the provider.","reading":"perlman"},"clerk":{"name":"The Change Records Clerk","role":"Configuration and incident clerk","face":"🗂","badge":"C","legend":"the operations archive","hint":"Traffic collapsed after reachability changed, while link utilization remained below congestion thresholds.","reading":"jacobson"}},"TOPICS":{"rekhter":{"sci":"Yakov Rekhter (Internet-routing pioneer)","topic":"The Border Gateway Protocol","lede":"Rekhter helped define the policy-driven routing system that can turn one mistaken announcement into a global detour.","no":1,"profile":"Yakov Rekhter is one of the principal architects of the Border Gateway Protocol, or BGP, the system through which independently operated networks exchange reachability on the Internet. BGP does not calculate one globally shortest path. Each autonomous system advertises which address prefixes it can reach, attaches a path of network numbers, and applies local policy to choose and export routes.\n\nThat design permits commercial and operational independence, but it also means trust is distributed. A network can accidentally announce prefixes it does not own, export routes learned from one provider to another, or advertise a path more specific than the legitimate route. Because routers generally prefer a more-specific prefix, one bad announcement can attract traffic rapidly. Filters, prefix limits, route registries, and cryptographic origin validation reduce the risk, but only if configured on the relevant session.\n\nBGP evidence is unusually chronological. The origin autonomous system, prefix, path changes, peer acceptance, and withdrawal times are recorded by route collectors. A coordinated attack might inject from external systems or manipulate several origins. A local leak begins at one authenticated router or automation process and then spreads through normal policy.\n\nIn the Grey-Out, collectors first see the affected prefixes originate from the provider’s own core edge immediately after an emergency change. Neighbouring networks accept the announcement because the export filter on that session has been bypassed. Rekhter’s protocol explains how one frontline command can create a global effect without a global attacker. The network’s scale amplifies the mistake; it does not identify the cause.","frame":"The engineer freezes the first route-collector frame. “The world repeated this line, but someone had to speak it first. Find the origin.”","q":[{"q":"What does BGP primarily exchange between autonomous systems?","o":[{"t":"Individual web pages and the application data requested by each user in BGP data.","v":"partial","fb":"Applications use routes but their content is not carried in BGP updates."},{"t":"Reachable address prefixes, path information, and policy-selected advertisements.","v":"expert","fb":"BGP distributes reachability and path attributes between independently managed networks."},{"t":"A universal map of the physically shortest fibre route for nearly every packet in BGP data.","v":"wrong","fb":"Policy, not only physical distance, determines BGP path selection."},{"t":"The processor load and memory state of all routers on the Internet in BGP data.","v":"danger","fb":"Router resource telemetry is managed by other protocols and tools."}],"clue":{"category":"what","label":"WHAT clue","text":"Rekhter’s route collectors show one local more-specific announcement spreading through normal BGP policy after an export safeguard was removed."}},{"q":"Why can a more-specific prefix attract traffic away from a legitimate route?","o":[{"t":"BGP generally trusts whichever announcement contains the largest autonomous-system number.","v":"partial","fb":"Autonomous-system numbers do not confer priority by size."},{"t":"A more-specific route physically increases the bandwidth of nearly every connected link.","v":"wrong","fb":"Route specificity changes selection, not link capacity."},{"t":"Routers generally prefer the longest matching prefix when forwarding packets.","v":"expert","fb":"Longest-prefix matching makes the narrower route win during forwarding."},{"t":"DNS converts longer prefix text into a higher routing priority automatically.","v":"danger","fb":"DNS naming and IP forwarding preferences are separate mechanisms."}],"clue":{"category":"where","label":"WHERE clue","text":"The decisive origin is the provider’s own peering-edge router, where the more-specific routes first enter the global table."}},{"q":"Which observation best distinguishes a local leak from coordinated external injection?","o":[{"t":"Many distant users report failures within the same twenty-minute period at the peering edge.","v":"partial","fb":"Widespread impact follows naturally once a route leak propagates."},{"t":"Several peers propagate the route after accepting it under their normal policy at the peering edge.","v":"wrong","fb":"Normal peer propagation describes amplification, not an external origin."},{"t":"News sites describe the outage as unusually widespread and simultaneous at the peering edge.","v":"danger","fb":"Public descriptions provide scale but not routing provenance."},{"t":"The first authenticated origin is one internal router immediately after a recorded change.","v":"expert","fb":"Internal origin plus change timing identifies the initiating configuration."}],"clue":{"category":"who","label":"WHO clue","text":"The authenticated change session and first BGP origin belong to the on-call engineer’s console, before any outside autonomous system advertises the prefixes."}}]},"perlman":{"sci":"Radia Perlman (b. 1951)","topic":"The spanning-tree protocol","lede":"Perlman made redundant networks stable by ensuring that useful alternate paths could not reinforce a loop.","no":2,"profile":"Radia Perlman designed the spanning-tree protocol while working at Digital Equipment Corporation. Ethernet bridges can connect local-network segments redundantly, which improves resilience, but a loop allows frames to circulate indefinitely. Because basic Ethernet frames carry no hop limit, broadcast traffic can multiply into a storm and make the network unusable.\n\nPerlman’s protocol lets bridges elect a root and choose a loop-free set of forwarding links while leaving redundant links blocked but available. The network continuously exchanges control messages and can reconverge when topology changes. The deeper design lesson is that redundancy needs a rule preventing parallel paths from reinforcing an error. Safety mechanisms are not ornamental; they make a richly connected system stable.\n\nAlthough BGP operates at a different layer and scale, the analogy is useful. Peering diversity improves reachability, yet export policy and origin validation must constrain what each neighbour can propagate. Removing a filter can turn normal cooperation into amplification. The peers are not necessarily malfunctioning when they spread the route; they are following the information and policy they were given.\n\nThe Grey-Out path records show no fabricated peer sessions and no mysterious second origin. Each neighbouring network accepts a route that the provider itself authenticated and exported. A registry entry remains correct, but the router policy fails to enforce it. Perlman’s work separates the safety net from the underlying topology: the global mesh behaved normally after one local barrier was bypassed. The person who issued that change cannot disappear into the complexity of the Internet simply because thousands of remote routers repeated it.","frame":"The peering coordinator draws a mesh and circles one missing filter. “Redundancy did not betray us. It obeyed the bad instruction we exported.”","q":[{"q":"What problem does spanning tree solve in a bridged Ethernet network?","o":[{"t":"It prevents forwarding loops while preserving redundant links for later use.","v":"expert","fb":"Spanning tree creates a loop-free forwarding topology from redundant physical links."},{"t":"It encrypts nearly every frame so neighbouring switches does not read its destination.","v":"partial","fb":"Frame encryption is not the protocol’s function."},{"t":"It assigns public Internet addresses to all devices connected to a bridge.","v":"wrong","fb":"Address assignment is handled separately from loop prevention."},{"t":"It increases bandwidth by sending nearly every frame around all loops simultaneously.","v":"danger","fb":"Uncontrolled replication around loops creates storms rather than useful capacity."}],"clue":{"category":"what","label":"WHAT clue","text":"Perlman’s stability lesson fits the incident: normal redundancy amplified one bad route only after the local export barrier was deliberately bypassed."}},{"q":"Why are remote peers not automatically the cause when they propagate a bad route?","o":[{"t":"Peers have no ability to filter routes under any Internet-routing standard in BGP data.","v":"partial","fb":"Peers can and do apply filters, limits, and validation policies."},{"t":"They may be following normal policy for an authenticated advertisement received from inside.","v":"expert","fb":"Propagation can be normal amplification of a locally originated mistake."},{"t":"nearly every propagated route is legally owned by the first network that receives it.","v":"wrong","fb":"Reception does not transfer ownership of an address prefix."},{"t":"BGP propagation strongly suggests that all participating networks coordinated the original error.","v":"danger","fb":"Shared propagation does not imply shared intent or origin."}],"clue":{"category":"who","label":"WHO clue","text":"Peer logs show ordinary acceptance of an internal announcement; the registry and external networks did not create the route that the engineer exported."}},{"q":"What is the relevant lesson of a blocked redundant path?","o":[{"t":"Redundancy is harmful and should be removed from all reliable network designs at the peering edge.","v":"partial","fb":"Resilience depends on redundancy managed by appropriate constraints."},{"t":"Blocked links serve no purpose once the first forwarding path becomes active at the peering edge.","v":"wrong","fb":"Blocked links can become active after failures and remain operationally valuable."},{"t":"A safety rule can preserve redundancy without allowing multiple paths to reinforce an error at the peering edge.","v":"expert","fb":"Controlled redundancy supplies resilience while containing loops or leaks."},{"t":"The safest network is one in which nearly every router advertises nearly every route to nearly every neighbour.","v":"danger","fb":"Unrestricted export is exactly what permits local errors to spread."}],"clue":{"category":"where","label":"WHERE clue","text":"The missing constraint is found in the export policy on the core peering edge, not in the registry database or the operations manager’s office."}}]},"jacobson":{"sci":"Van Jacobson (b. 1950)","topic":"TCP congestion control","lede":"Jacobson taught the Internet to back away from overload, leaving signatures that separate congestion from lost reachability.","no":3,"profile":"Van Jacobson is a computer scientist whose work in the late 1980s rescued the growing Internet from congestion collapse. As networks filled, senders continued injecting packets faster than routers could deliver them. Queues overflowed, packets were retransmitted, and those retransmissions created still more load. Useful throughput could fall even while links looked desperately busy.\n\nJacobson introduced algorithms that made TCP adapt its sending rate to the network. Slow start probes capacity cautiously; congestion avoidance increases the window gradually; packet loss or other signals cause senders to reduce the rate. The result is a feedback system that distinguishes available capacity from overload. Later work refined the signals, but the central lesson remains: congestion has measurable queue, loss, delay, and utilization signatures.\n\nA routing outage can resemble congestion to users because both make services slow or unreachable. The network evidence differs. Congestion develops as demand approaches capacity and produces rising queues, loss, and latency on the constrained paths. A route leak abruptly changes reachability, sending traffic to the wrong destination or into a black hole even when physical links are below capacity.\n\nDuring the Grey-Out, utilization on major links remains moderate and queues do not build before reachability collapses. The decisive timestamp is the route announcement, not a traffic spike. Jacobson’s framework rules out the do-nothing explanation that the Internet simply became busy. It also sharpens responsibility: after the engineer withdraws the leaked route and restores the filter, reachability returns without adding capacity or suppressing an external attack. The controlled rollback makes the difference between lost capacity and lost reachability especially direct.","frame":"The clerk lays flat utilization graphs beneath a cliff in reachability. “If traffic crushed us, where are the queues? If not, what changed?”","q":[{"q":"What is congestion collapse?","o":[{"t":"A routing table instantly loses all prefixes after one administrative login.","v":"partial","fb":"That describes a control or routing failure rather than congestion."},{"t":"A physical fibre breaks and prevents any packets from crossing that path.","v":"wrong","fb":"A fibre break is a topology fault, not the queueing phenomenon Jacobson addressed."},{"t":"DNS returns an incorrect name while packet delivery remains otherwise normal.","v":"danger","fb":"Name-resolution error is distinct from transport congestion."},{"t":"Useful throughput falls as excess traffic and retransmissions consume network capacity.","v":"expert","fb":"Congestion collapse is a feedback failure in which offered load crowds out useful delivery."}],"clue":{"category":"what","label":"WHAT clue","text":"Jacobson’s expected congestion signatures—rising utilization, queues, and loss—are absent before reachability fails, ruling out a mere traffic surge."}},{"q":"Which timeline most strongly supports a route leak?","o":[{"t":"Reachability changes at the announcement time while link utilization remains below capacity.","v":"expert","fb":"Abrupt routing change without prior saturation is the expected leak signature."},{"t":"Latency rises gradually as demand fills nearly every major link during a popular event.","v":"partial","fb":"That pattern is consistent with ordinary congestion."},{"t":"Packet loss increases with queue depth before any routing update appears in BGP data.","v":"wrong","fb":"Queue growth preceding route change points toward load rather than reachability."},{"t":"Performance improves mainly after new physical capacity is added to the network.","v":"danger","fb":"Capacity relief would support a congestion diagnosis."}],"clue":{"category":"where","label":"WHERE clue","text":"The outage begins and ends with configuration changes on the core routers, while the operations centre merely observes the resulting loss of reachability."}},{"q":"What result most directly tests the engineer’s causal role?","o":[{"t":"Waiting until overnight demand falls while leaving nearly every route unchanged.","v":"partial","fb":"Falling demand would test congestion but not the leaked route itself."},{"t":"Withdrawing the route and restoring the filter returns service without changing traffic demand.","v":"expert","fb":"The controlled reversal removes the suspected configuration and restores reachability."},{"t":"Publishing a statement that no attacker has claimed responsibility at the peering edge.","v":"wrong","fb":"Absence of a claim is weak evidence about technical cause."},{"t":"Replacing a registry contact record after the network is already stable at the peering edge.","v":"danger","fb":"A contact update does not alter forwarding or export policy."}],"clue":{"category":"who","label":"WHO clue","text":"The same engineer account that bypassed the filter withdraws the leaked route; service returns immediately, completing the frontline attribution."}}]}},"story":["<b>The Great Grey-Out looks coordinated because the same wrong route reaches thousands of networks within minutes.<\/b>","The Network Engineer has the authenticated origin. The Peering Coordinator can explain why neighbours propagated it. The Change Records Clerk holds the utilization and rollback timeline.","An outside attack, an ordinary demand surge, and one local safety bypass each produce widespread symptoms but leave different routing evidence.","The case asks who spoke the first false route, where it entered the global table, and why normal peers amplified it."],"endings":{"overclaimWhat":"attack","dismissalWhat":"surge","win":{"expertTitle":"The First False Route","expert":["You connect Mara Quill — the on-call network engineer, the Core Routers & Peering Edge, and a local route leak after an outbound filter was bypassed. The full clue chain links the initiating condition, the physical mechanism, and the decisive record without relying on candidate order.","The two alternative explanations each fit part of the scene, but neither survives the combined timing, material, and documentary evidence."],"soundTitle":"The Leak and Rollback","sound":["Your accusation identifies Mara Quill — the on-call network engineer, the Core Routers & Peering Edge, and a local route leak after an outbound filter was bypassed.","A few missed clues leave gaps in the reconstruction, yet the evidence you recovered is sufficient to distinguish the true sequence from both traps."],"namedTitle":"Correct Route, Incomplete Chain","named":["You reach the correct three-part verdict with a thin evidentiary file.","The result is right, although the unrecovered clues would be needed to defend the causal chain under sustained challenge."]},"overclaim":{"title":"Global Impact, Local Origin","body":["No external autonomous system originates the affected prefixes before the provider does.","Remote peers propagate the internally authenticated announcement under normal policy rather than coordinating an attack."]},"dismissal":{"title":"The Network Was Not Simply Busy","body":["Links remain below capacity and queues do not rise before reachability collapses.","Service returns through route withdrawal and filter restoration, not through reduced demand or added bandwidth."]},"wrongNames":{"title":"Right Mechanism, Wrong Attribution","body":["You recognize the governing mechanism but assign it to the wrong actor or move its decisive evidence away from the location where the records and physical traces converge."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"f_ai","title":"The Aegis Model","discipline":"Artificial Intelligence & Machine Learning","venue":"the Aegis model inquiry","agent":{"name":"Investigator Wen Astor","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Artificial-Intelligence Pioneers","dossierName":"ARTIFICIAL-INTELLIGENCE PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Aegis model inquiry","DAYS_TOTAL":3,"teaser":"A hiring model rejected qualified applicants from one group at a striking rate. Did it develop an independent objective, did a sound system encounter a few edge cases, or did approved data create a disparity that was measured and then hidden before launch?","overclaimTag":"a runaway discriminatory model","truthTag":"a measured data bias concealed at release","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A hiring model pipeline with unequal group outcomes and a suppressed validation report\"><rect x=\"55\" y=\"35\" width=\"135\" height=\"70\" rx=\"6\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M75 55 h95 M75 72 h95 M75 89 h60\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><path d=\"M190 70 H300\" stroke=\"#326891\" stroke-width=\"3\"/><circle cx=\"345\" cy=\"70\" r=\"35\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M335 48 v44 M355 48 v44\" stroke=\"#e2e2d8\" stroke-width=\"3\"/><path d=\"M380 70 H480\" stroke=\"#326891\" stroke-width=\"3\"/><rect x=\"480\" y=\"30\" width=\"125\" height=\"80\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M500 52 h85 M500 70 h60 M500 88 h75\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><path d=\"M490 40 l105 60 M595 40 l-105 60\" stroke=\"#B3261E\" stroke-width=\"3\"/><\/svg>","overclaimTease":"Do not infer motive from output alone. Trace the training population, disaggregate the validation, and compare the warning that existed with the document that was signed.","CATS":{"who":{"title":"Who is behind it","truth":"lead","items":[{"id":"outsider","label":"An outside data-poisoning crew"},{"id":"lead","label":"Dr. Priya Sandoval — the model lead scientist"},{"id":"auditor","label":"The external model auditor"}]},"where":{"title":"Where it culminates","truth":"evalroom","items":[{"id":"datalab","label":"The Training-Data Laboratory"},{"id":"evalroom","label":"The Model Evaluation & Release Room"},{"id":"office","label":"The Project Administration Office"}]},"what":{"title":"What happened","truth":"biasdata","items":[{"id":"sentient","label":"The model developed an independent discriminatory objective"},{"id":"edgecases","label":"A sound system produced a few unavoidable applicant errors"},{"id":"biasdata","label":"Biased data created a measured gap that was hidden before launch"}]}},"READING_ORDER":["dataeng","validator","clerk"],"CHARACTERS":{"dataeng":{"name":"The Data Engineer","role":"Training-data engineer","face":"🗄","badge":"D","legend":"the data inventory","hint":"The approved historical sample scarcely includes groups screened out before interview.","reading":"a_imagenet"},"validator":{"name":"The Validation Scientist","role":"Model-validation scientist","face":"📊","badge":"V","legend":"the subgroup dashboard","hint":"Independent holdouts reproduce a large false-rejection gap hidden by the overall score.","reading":"a_bias"},"clerk":{"name":"The Model Records Clerk","role":"Documentation and release clerk","face":"🗂","badge":"C","legend":"the version archive","hint":"The warning disappeared from the final model card under the lead scientist’s credential.","reading":"a_datacard"}},"TOPICS":{"a_imagenet":{"sci":"Fei-Fei Li (b. 1976)","topic":"ImageNet and the data behind machine learning","lede":"Fei-Fei Li showed that a learning system’s capabilities are shaped as much by its examples and labels as by its algorithm.","no":1,"profile":"Fei-Fei Li is a computer scientist whose work helped drive the modern transformation of computer vision. In the mid-2000s, researchers had many clever recognition algorithms but comparatively small, inconsistent training sets. Li argued that progress required a large, organized representation of the visual world. Her team built ImageNet, a database arranged around WordNet concepts and populated with millions of labeled images, using large-scale human annotation to make the project feasible.\n\nImageNet enabled a standardized challenge in which researchers could compare systems on the same categories and examples. The 2012 success of a deep convolutional network trained on the dataset helped demonstrate the power of combining large labeled data, graphics processors, and neural networks. Yet ImageNet also exposed a lasting lesson: datasets are designed artifacts. Category choices, collection methods, labels, and geographic or cultural coverage influence what a model learns and where it fails.\n\nMore data do not automatically mean representative data. A dataset can be enormous while rare groups, occupations, lighting conditions, or social contexts remain thinly sampled. Labels may reproduce historical decisions rather than objective truth. For a hiring system, “successful employee” examples may encode who was previously hired, promoted, or retained under earlier organizational biases. A model can learn that pattern faithfully and still produce unfair decisions.\n\nThe Aegis investigation begins in that distinction. The training archive contains many years of approved applicants but far fewer qualified candidates from groups historically screened out before interview. The model did not become sentient and invent a new prejudice. It optimized the target it was given. Li’s lesson is to examine the construction of the dataset before treating the model’s outputs as either mysterious autonomy or harmless edge cases. The first question is not how intelligent Aegis became, but whose past decisions its examples made normal.","frame":"Projects the training distribution beside the company’s applicant pool. “Millions of rows can still leave whole groups nearly absent. Tell me what scale does—and does not—guarantee.”","q":[{"q":"What was ImageNet’s major contribution to computer vision research?","o":[{"t":"It proved that collecting more examples automatically removes bias from labels.","v":"wrong","fb":"Scale can amplify collection and labeling bias instead of erasing it."},{"t":"It showed that a model trained on enough data no longer needs human evaluation.","v":"danger","fb":"Large training sets still require evaluation of coverage, labels, and deployment context."},{"t":"It supplied a large labeled benchmark that made data-intensive methods comparable.","v":"expert","fb":"ImageNet standardized a large-scale data resource and challenge rather than inventing neural networks."},{"t":"It introduced the first neural network capable of recognizing any visual object.","v":"partial","fb":"Neural networks predated ImageNet, though the dataset helped reveal their later power."}],"clue":{"category":"what","label":"WHAT — lead","text":"Aegis learned from historical selections that systematically omitted qualified candidates before the model ever saw them."}},{"q":"Why can a very large hiring dataset remain unrepresentative?","o":[{"t":"Every employment label is random once several departments contribute records.","v":"wrong","fb":"Multiple sources do not make labels random and may reproduce the same institutional practice."},{"t":"Past hiring decisions should be treated as objective ground truth by definition.","v":"danger","fb":"Historical outcomes can encode exclusion and should not be accepted as neutral truth."},{"t":"Large files become statistically unreliable simply because they contain too many rows.","v":"partial","fb":"Scale usually improves precision; the issue is biased inclusion, not file size itself."},{"t":"Historical selection can exclude groups before their examples ever enter the archive.","v":"expert","fb":"Selection before collection can preserve a large but systematically incomplete sample."}],"clue":{"category":"where","label":"WHERE — lead","text":"The training-data inventory and subgroup counts first expose the gap, but the consequential failure becomes visib

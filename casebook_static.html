Old paintings are often altered; the task is to separate campaigns rather than assume fraud."},{"t":"It changes the panel’s dimensions so historical measurements and frame records become unusable.","v":"partial","fb":"Physical alterations may affect size, but the main issue is the obscured image layer."}],"clue":{"category":"where","label":"WHERE — lead","text":"Cross-sections and infrared imaging at the treatment bench separate the clumsy surface from the coherent original layer beneath."}},{"q":"Who first created the evidence needed to distinguish the two paint campaigns?","o":[{"t":"The museum connoisseur who had seen the darkened surface through photographs.","v":"wrong","fb":"A photographic opinion preceded access to the revealing underlayer."},{"t":"The restorer who exposed and documented the underlying layer during treatment.","v":"expert","fb":"The treatment record identifies the person who recognized and preserved the material distinction."},{"t":"The unknown original painter, because authorship makes later investigation unnecessary.","v":"danger","fb":"Authorship remains the question; it cannot replace the evidence used to establish it."},{"t":"The gallery dealer who advertised the panel before technical examination.","v":"partial","fb":"Marketing introduced the object but did not create the technical evidence."}],"clue":{"category":"who","label":"WHO — lead","text":"Anselm Roterman halted cleaning, documented the boundary, and requested cross-sections when the earlier hand appeared."}}]},"ar_mccrone":{"sci":"Walter McCrone (1916-2002)","topic":"Polarized-light microscopy of pigments","lede":"Walter McCrone used tiny pigment particles to test grand claims about the age and origin of artworks and artifacts.","no":2,"profile":"Walter McCrone was an American microscopist who championed polarized-light microscopy as a powerful tool for identifying particles. At the McCrone Research Institute in Chicago, he trained scientists to examine crystal form, refractive behavior, color, and optical properties in samples far smaller than a pinhead. His work reached art, archaeology, forensics, and industrial materials.\n\nPigments have histories. Natural ultramarine from lapis lazuli, lead white, vermilion, azurite, earth colors, and later synthetic pigments entered artists’ palettes at different times and places. Finding titanium white in an untouched original layer of a supposed medieval painting would be strongly anachronistic. But interpretation depends on stratigraphy. A modern pigment in varnish, restoration, or surface contamination does not date the underlying image.\n\nMcCrone became publicly associated with contentious investigations, including the Vinland Map and the Shroud of Turin. Whether every conclusion persuaded every scholar, his methodological lesson remained clear: identify what particle was sampled, where it sat in the layer sequence, and whether the result can be independently repeated.\n\nThe Halberstadt samples show modern zinc and titanium pigments only in the later overpaint. Beneath it, the original passages contain historically appropriate lead white, azurite, vermilion, and copper green, with alteration products expected from age. No modern binder appears in the lower layer. A forger could choose old-looking colors, but reproducing aged reaction products beneath a documented nineteenth-century campaign would require a far more elaborate history than the object’s material sequence supports. McCrone’s microscope does not name the master by itself; it rules out the supposed anachronistic tell and confirms that the layer Roterman uncovered could genuinely belong to the claimed period.","frame":"Rotates pigment grains under crossed polarizers and points to the layer chart. “Modern color is present—above the old painting. Sampling without stratigraphy would accuse the wrong century.”","q":[{"q":"Why must pigment identification be tied to its layer position?","o":[{"t":"One modern particle anywhere on the object establishes the entire work as forged.","v":"danger","fb":"A modern particle is meaningful only after its origin and layer are established."},{"t":"Pigment names vary between laboratories even when the particles are identical.","v":"partial","fb":"Terminology matters, but physical position is the key chronological evidence here."},{"t":"Restoration pigments can be modern while the underlying painting remains old.","v":"expert","fb":"Stratigraphy distinguishes original material from later repair, varnish, or contamination."},{"t":"Every layer in a painting is normally applied during the same working session.","v":"wrong","fb":"Paintings accumulate varnish, retouching, and restoration across many campaigns."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"Modern pigments belong only to the later overpaint; the original layer contains period materials and age-consistent alteration."}},{"q":"Which result would be strongest evidence of a modern forgery?","o":[{"t":"A dealer refusing to describe the painting’s style in the laboratory report.","v":"danger","fb":"Dealer behavior may raise questions but cannot substitute for material chronology."},{"t":"A synthetic pigment confined to documented twentieth-century retouching layers.","v":"partial","fb":"Later retouching can legitimately contain modern materials and does not date the original."},{"t":"Natural ultramarine appearing in a blue passage from the original layer.","v":"wrong","fb":"Natural ultramarine is compatible with historical painting and is not an anachronism."},{"t":"A modern pigment consistently embedded in intact original layers across samples.","v":"expert","fb":"Repeated anachronistic material within the original campaign would directly conflict with the claimed date."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"Laboratory cross-sections place no anachronistic pigment or binder in the untouched original paint sequence."}},{"q":"Which person’s action preserved the layer sequence needed for reliable sampling?","o":[{"t":"The restorer who halted treatment and documented the cross-section locations.","v":"expert","fb":"Careful treatment and sampling records protect the provenance of the technical evidence."},{"t":"The dealer who arranged rapid surface cleaning before the approaching auction deadline.","v":"partial","fb":"Rapid cleaning risks blending or destroying the very sequence under investigation."},{"t":"The connoisseur who requested high-resolution visible-light photographs without sampling.","v":"wrong","fb":"Visible photographs cannot preserve microscopic layer relationships by themselves."},{"t":"The buyer who preferred a dramatic authenticity claim before testing was complete.","v":"danger","fb":"Market enthusiasm creates pressure rather than reliable evidence handling."}],"clue":{"category":"who","label":"WHO — corroboration","text":"Roterman stopped solvent work before the boundary was erased and recorded each sample location."}}]},"ar_stout":{"sci":"George L. Stout (1897-1978)","topic":"Conservation science and the material biography of paintings","lede":"George Stout treated a painting as a layered physical history whose repairs, supports, and surfaces must be understood before aesthetic judgment.","no":3,"profile":"George Leslie Stout was an American paintings conservator and one of the founders of modern conservation practice in the United States. At Harvard’s Fogg Art Museum, he worked with art historian Edward W. Forbes to study pigments, binders, supports, and deterioration. Stout helped establish technical conservation as a profession joining craft skill, documentation, chemistry, and art history.\n\nDuring the Second World War he served with the Monuments, Fine Arts, and Archives programme—the “Monuments Men”—helping recover and protect European cultural property. His later leadership at museums emphasized careful examination and records. Cleaning is not simply making a picture brighter. Solvents can remove original glazes as well as discolored varnish; structural treatment can alter evidence on the reverse; and every intervention should be documented and, where possible, reversible.\n\nA painting’s material biography includes its wooden support, ground, underdrawing, paint, varnish, repairs, labels, tool marks, and environmental damage. These elements can corroborate age and provenance. Dendrochronology can establish the earliest possible date of a panel, while old insect channels, ground preparation, and craquelure may show whether layers aged together.\n\nThe Halberstadt Panel’s support comes from oak felled in a range consistent with the proposed workshop, and the original ground extends beneath edges covered by a frame fitted centuries ago. Infrared imaging reveals an underdrawing with revisions rather than a mechanical copy. The later overpaint explains the crude visible style and contains the modern materials that first aroused suspicion. Stout’s whole-object method therefore supports the surprising conclusion: the spectacular answer is correct. Roterman did not manufacture a masterpiece; he found one beneath an old intervention, preserved the evidence, and moved the object into the laboratory where visual, material, and archival histories finally agreed.","frame":"Turns the panel edge, reverse, X-radiograph, and treatment diary into one sequence. “Authenticity is not one pigment or one eye. It is a biography whose layers agree.”","q":[{"q":"What does conservation science add to stylistic attribution?","o":[{"t":"A method for making every old painting look close to its original appearance.","v":"partial","fb":"Appearance may improve, but conservation prioritizes evidence and stability over cosmetic restoration."},{"t":"A material and treatment history that can corroborate or contradict visual judgment.","v":"expert","fb":"Technical evidence tests chronology and construction while remaining linked to art-historical comparison."},{"t":"A guarantee that scientific tests can identify the individual artist without context.","v":"wrong","fb":"Materials can narrow date and process without always naming one painter."},{"t":"Permission to remove all later layers whenever they seem aesthetically inferior.","v":"danger","fb":"Later layers may have historical value and should not be removed without careful justification."}],"clue":{"category":"where","label":"WHERE — decisive","text":"Support, ground, underdrawing, cross-sections, and treatment history converge in the imaging-and-treatment record."}},{"q":"Which combined evidence best supports a genuine old panel beneath later overpaint?","o":[{"t":"The seller’s price estimate assumes the panel will receive a prestigious attribution.","v":"wrong","fb":"Market valuation depends on attribution and cannot establish it."},{"t":"One dramatic laboratory result is accepted even when the rest of the object conflicts.","v":"danger","fb":"A single test can be contaminated, mislocated, or misunderstood without whole-object agreement."},{"t":"Independent material, structural, visual, and provenance indicators share one chronology.","v":"expert","fb":"Authenticity becomes strongest when independent evidence produced by different processes converges."},{"t":"The cleaned image resembles a famous masterpiece more strongly than before treatment.","v":"partial","fb":"Resemblance can prompt inquiry but remains vulnerable to imitation and expectation."}],"clue":{"category":"what","label":"WHAT — decisive","text":"Period pigments, age-consistent support, revised underdrawing, old frame coverage, and coherent Morellian details all agree."}},{"q":"Who is most directly associated with the responsible discovery rather than manufacture of the panel?","o":[{"t":"The museum connoisseur who initially dismissed the darkened surface as provincial.","v":"wrong","fb":"An early mistaken visual judgment was revised only after technical access improved."},{"t":"A deceased painter, because a genuine Old Master should not have a modern discoverer.","v":"danger","fb":"Rediscovery is a modern act even when the artwork itself is centuries old."},{"t":"The dealer who promoted the object as important after the first cleaning photograph.","v":"partial","fb":"Promotion followed discovery and did not establish the material sequence."},{"t":"The restorer who exposed the layer cautiously and preserved it for examination.","v":"expert","fb":"The records identify the person whose intervention revealed rather than created the evidence."}],"clue":{"category":"who","label":"WHO — decisive","text":"Roterman’s treatment diary documents the stopping point, discovery of the original layer, and immediate transfer for independent testing."}}]}},"story":["<b>A dark, awkward panel sold cheaply, then revealed a far more accomplished image during conservation.<\/b>","Conservator Nel can compare telltale forms. Archivist Boll holds the pigment and layer record. Framer Ruys can read the support, frame, and underdrawing history.","The panel may be a sophisticated forgery, a genuine old work hidden beneath later overpaint, or merely a clumsy copy receiving too much attention.","Nine clues test whether visual, material, and structural histories belong to one authentic painting—and who revealed rather than manufactured it."],"endings":{"overclaimWhat":"ar_forgery","dismissalWhat":"ar_obvious","win":{"expertTitle":"The Masterpiece Beneath the Overpaint","expert":["You connect Anselm Roterman, the Conservation Laboratory, and a genuine period panel surviving beneath later overpaint. Telltale details, layer-specific pigments, support history, underdrawing, and treatment records agree.","The work was not a sophisticated modern forgery, and the clumsy visible surface was not the original painting. Roterman’s careful intervention revealed and preserved an authentic earlier campaign."],"soundTitle":"The Genuine Underlayer","sound":["Your accusation identifies the restorer, the laboratory, and the authentic panel beneath overpaint.","Some material or attribution details remain incomplete, but the independent chronology supports the finding."],"namedTitle":"Right Work, Limited Attribution","named":["You select the correct WHO, WHERE, and WHAT.","The conclusion is right, although missed clues leave the precise workshop attribution or treatment history less fully established."]},"overclaim":{"title":"The Modern Pigments Belong to Restoration","body":["Cross-sections place zinc and titanium pigments above the original layer, while the lower campaign contains period materials and age-consistent alteration.","Calling the whole object a forgery mistakes a later intervention for the work it covered."]},"dismissal":{"title":"The Clumsy Surface Was Not the Original Hand","body":["Infrared imaging and cleaning reveal coherent underdrawing and repeated workshop details beneath the overpaint.","Dismissing the panel as an obvious daub ignores the older material sequence now exposed."]},"wrongNames":{"title":"The Authentic Panel, Misassigned","body":["You recognize the genuine underlayer but place discovery or culmination away from Roterman and the conservation laboratory that preserved the evidence."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"c_fall","title":"The Last Council of Vellano","discipline":"History & Historical Method","venue":"the Vellano fall inquiry","agent":{"name":"Archivist-Investigator Lena Corvo","role":"Investigator's Notepad"},"standingLabel":"Commission credibility","readingShort":"Historians","readingLabel":"Historians of Method","dossierName":"HISTORIANS OF METHOD","enterLabel":"Open the inquiry","subt":"A deduction game inside the Vellano fall inquiry","DAYS_TOTAL":3,"teaser":"A proud republic fell after a sealed order opened its river gate. Did the council formally stand down the garrison, was the city already doomed by decline, or did an exiled commander manufacture authority and coordinate a betrayal?","overclaimTag":"a legendary traitor at the gate","truthTag":"a documented external betrayal","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A city gate opened at night with a forged order and troops approaching\"><path d=\"M45 112 H615\" stroke=\"#121212\" stroke-width=\"3\"/><path d=\"M90 112 V40 H250 V112 M160 112 V70 H210 V112\" fill=\"none\" stroke=\"#121212\" stroke-width=\"4\"/><path d=\"M160 70 h50\" stroke=\"#B3261E\" stroke-width=\"5\"/><rect x=\"300\" y=\"28\" width=\"125\" height=\"78\" fill=\"none\" stroke=\"#326891\" stroke-width=\"2\"/><path d=\"M320 48 h85 M320 66 h85 M320 84 h52\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><path d=\"M430 67 C485 70 520 88 570 105\" fill=\"none\" stroke=\"#B3261E\" stroke-width=\"3\"/><\/svg>","overclaimTease":"Long decline can explain vulnerability without explaining one opened gate. Authenticate the order, align the night’s sequence, and follow the small records that survived the official story.","CATS":{"who":{"title":"Who is behind it","truth":"fa_general","items":[{"id":"fa_provv","label":"Provveditore Bassi — the council war magistrate"},{"id":"fa_general","label":"Ugo Sanvitale — the exiled condottiero"},{"id":"fa_doge","label":"Doge Reniero — the last head of state"}]},"where":{"title":"Where it culminates","truth":"fa_walls","items":[{"id":"fa_walls","label":"The River Gate & Postern Packet"},{"id":"fa_chamber","label":"The Last Council Chamber"},{"id":"fa_archive","label":"The State Archive & Chancery"}]},"what":{"title":"What happened","truth":"fa_betrayal","items":[{"id":"fa_decision","label":"A council faction formally voted to stand down the garrison"},{"id":"fa_inevit","label":"Long decline made the republic’s fall effectively inevitable"},{"id":"fa_betrayal","label":"An exile forged authority, bought the gate, and coordinated entry"}]}},"READING_ORDER":["fa_chancellor","fa_warden","fa_notary"],"CHARACTERS":{"fa_chancellor":{"name":"Chancery Clerk Orso","role":"Chancery records clerk","face":"🗂","badge":"O","legend":"the council minute","hint":"The authentic vote reinforced the watch; the gate instruction was produced elsewhere.","reading":"fa_thucydides"},"fa_warden":{"name":"Gate Warden Pia","role":"River-gate warden","face":"🗝","badge":"P","legend":"the postern packet","hint":"The order bore a copied seal and arrived while enemy scouts were already waiting.","reading":"fa_valla"},"fa_notary":{"name":"Notary Ferro","role":"City notary and chronicler","face":"🪶","badge":"F","legend":"the peripheral ledgers","hint":"Courier, wax, payment, and troop records converge on the exiled commander’s network.","reading":"fa_ginzburg"}},"TOPICS":{"fa_thucydides":{"sci":"Thucydides (c. 460-c. 400 BC)","topic":"Evidence, cause, and political history","lede":"Thucydides separated immediate events, deeper causes, and the stories participants later told about both.","no":1,"profile":"Thucydides was an Athenian general and historian whose account of the Peloponnesian War became a model of critical political history. Exiled after failing to prevent the loss of Amphipolis, he used his distance and contacts on both sides to investigate a conflict still unfolding. He rejected divine explanations and tried to distinguish rumor from what witnesses could support.\n\nThucydides was frank about method. He could not reproduce every speech word for word, so he presented what he believed speakers were most likely to have said while preserving the general sense. For events, he compared accounts and acknowledged how difficult accuracy was when memory, loyalty, and self-interest shaped testimony. He also distinguished immediate pretexts from underlying causes, famously identifying fear of Athenian power as a deeper driver of war.\n\nThat distinction matters when a state collapses. Long-term weakness can make a city vulnerable without making its fall inevitable. A council vote can contribute to exposure without explaining how an enemy entered a specific gate at a specific hour. Investigators must align orders, watch logs, physical access, and the sequence of military movement.\n\nVellano’s republic was divided and short of money, but the garrison was not formally stood down on the night of the fall. The authentic council minutes order reinforced watches. A separate gate instruction, delivered after the session under a copied seal, reverses that command. Enemy troops move only after the postern opens. Thucydides therefore resists the lazy claim that a declining republic simply died of its own condition. Structural weakness created opportunity; a concrete act exploited it. The immediate cause has a messenger, a document, and a beneficiary outside the council chamber.","frame":"Pins the council minute, gate log, and enemy movement times to the same hour. “Weak states invite danger. They do not open posterns by themselves.”","q":[{"q":"How did Thucydides distinguish deeper causes from immediate events?","o":[{"t":"He assumed that a weakened state’s defeat was inevitable regardless of decisions.","v":"danger","fb":"Vulnerability changes probability; it does not erase contingency or agency."},{"t":"He treated the most dramatic eyewitness account as the complete cause of an event.","v":"partial","fb":"Eyewitness testimony matters, but one vivid account can omit broader and immediate causes."},{"t":"He separated long-term pressures from the specific acts that triggered outcomes.","v":"expert","fb":"Thucydides examined both structural conditions and the proximate sequence of action."},{"t":"He explained wars chiefly through omens and divine punishment of declining cities.","v":"wrong","fb":"His history is notable for political and human causation rather than divine explanation."}],"clue":{"category":"what","label":"WHAT — lead","text":"The republic’s weakness created vulnerability, but a forged night order and opened postern supplied the immediate mechanism of conquest."}},{"q":"Which timeline best tests whether the council itself ordered the gate opened?","o":[{"t":"Treat the last order bearing the state seal as the council’s true decision.","v":"danger","fb":"A seal can be copied; provenance and timing must authenticate the instruction."},{"t":"Read later chronicles describing the republic as corrupt and exhausted.","v":"partial","fb":"Later interpretation provides context but cannot establish the night’s order chain."},{"t":"Count how many councillors fled the city during the following week.","v":"wrong","fb":"Flight after defeat does not show what the council commanded beforehand."},{"t":"Compare the signed minute, messenger arrival, gate action, and enemy movement.","v":"expert","fb":"A synchronized documentary and physical sequence tests authorship and implementation."}],"clue":{"category":"where","label":"WHERE — lead","text":"The authentic chamber minute precedes a contradictory order delivered at the River Gate, where the opening and entry are recorded."}},{"q":"Who benefits most directly from the contradictory gate order?","o":[{"t":"The exiled commander whose troops moved only after the forged order reached the gate.","v":"expert","fb":"Advance coordination between the false order and waiting troops identifies the operational beneficiary."},{"t":"The war magistrate who argued for reinforcing the walls throughout the council meeting.","v":"partial","fb":"Arguing for defense does not match the action that exposed the gate."},{"t":"The doge who remained in the palace until the attackers entered the city.","v":"wrong","fb":"Remaining in the palace provides no evidence of directing the external entry."},{"t":"Every faction opposing the government, regardless of access to the operation.","v":"danger","fb":"Political hostility creates motive broadly; operational timing narrows responsibility."}],"clue":{"category":"who","label":"WHO — lead","text":"Enemy scouts linked to Ugo Sanvitale were waiting at the postern before the false instruction arrived."}}]},"fa_valla":{"sci":"Lorenzo Valla (1407-1457)","topic":"Philology and the exposure of forged authority","lede":"Lorenzo Valla showed that a document can carry an impressive seal and still betray itself through language that belongs to another time or office.","no":2,"profile":"Lorenzo Valla was an Italian humanist, scholar, and priest whose close study of Latin became a tool for historical criticism. Around 1440 he analyzed the Donation of Constantine, a document long used to support papal territorial authority. Valla demonstrated that it could not have been written in the fourth century. Its vocabulary, institutions, titles, and style belonged to a later medieval world.\n\nHis argument was philological: language has a history. Words change meaning, administrative formulas evolve, and offices use conventional phrasing. A forger may imitate parchment, handwriting, or seals while unconsciously using expressions unavailable to the supposed author. Authenticity therefore rests on the agreement of material, language, institutional context, and provenance.\n\nValla’s method does not mean every irregular phrase proves fraud. A scribe can copy, translate, abbreviate, or modernize a text. Investigators compare multiple genuine documents from the same chancery, identify habitual formulas, and test whether the anomaly aligns with another writer’s practice.\n\nThe Vellano gate order survives in the warden’s packet. Its seal impression resembles the war magistrate’s, but the instruction uses a mercenary command phrase absent from council documents and common in Ugo Sanvitale’s surviving contracts. The wax contains a mineral filler used by his exile court, not the chancery stock logged that week. The clerk’s hand also differs from the registered council scribes. Valla’s lesson turns “treason” from legend into a testable claim: the authority was manufactured. The decisive WHERE is the River Gate because that is where the false document entered the chain of command and produced action. The archive authenticates the comparison; the gate packet preserves the operative forgery.","frame":"Places the gate order among genuine council commands and circles one mercenary formula. “The seal imitates the state. The language belongs to another household.”","q":[{"q":"How did Valla demonstrate that the Donation of Constantine was forged?","o":[{"t":"He proved the parchment itself was modern by applying a chemical dating test.","v":"partial","fb":"Material analysis can help, but Valla’s famous argument was primarily philological."},{"t":"He found vocabulary and institutions inconsistent with the document’s claimed era.","v":"expert","fb":"Historical language and institutional anachronisms undermined the claimed origin."},{"t":"He discovered a written confession signed by the medieval scribe who created it.","v":"wrong","fb":"No such confession formed the basis of his demonstration."},{"t":"He rejected the text chiefly because it strengthened an institution he opposed politically.","v":"danger","fb":"Motive for criticism does not replace the specific linguistic evidence he presented."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"The gate instruction imitates state authority while using language and materials tied to the exile commander’s household."}},{"q":"What comparison best tests the authenticity of the Vellano gate order?","o":[{"t":"Accept the document because the gate warden obeyed it during an emergency.","v":"wrong","fb":"Obedience proves the order was persuasive, not that it was authentic."},{"t":"Reject every copied or abbreviated instruction as a deliberate political forgery.","v":"danger","fb":"Copying can be legitimate; the pattern of mismatched language and materials establishes fraud."},{"t":"Match its language, seal material, handwriting, and formula against genuine orders.","v":"expert","fb":"Authentication requires several independent features to agree with the claimed source."},{"t":"Compare its dramatic content with later patriotic paintings of the city’s fall.","v":"partial","fb":"Later art reflects memory and politics, not the document’s production."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"The operative document preserved at the River Gate can be compared with genuine chancery formulas, wax stock, and registered hands."}},{"q":"Which linguistic fact most directly links the forgery to Ugo Sanvitale?","o":[{"t":"The paper contains a common military word used by armies throughout the region.","v":"wrong","fb":"A widespread term cannot identify one writer or office."},{"t":"The document mentions an enemy threat, so the enemy commander probably wrote and delivered it.","v":"danger","fb":"Content alone may be imitated; the unusual linguistic fingerprint supplies the stronger link."},{"t":"The order uses formal Latin rather than the dialect spoken by ordinary gate guards.","v":"partial","fb":"Formal language fits chancery practice and is not specific to the exile household."},{"t":"A rare mercenary phrase appears in his authenticated letters but not in council files.","v":"expert","fb":"A distinctive repeated formula can connect authorship when common alternatives are excluded."}],"clue":{"category":"who","label":"WHO — corroboration","text":"A command formula unique to Sanvitale’s contracts appears in the false order before his troops advance."}}]},"fa_ginzburg":{"sci":"Carlo Ginzburg (b. 1939)","topic":"Microhistory and the evidential paradigm","lede":"Carlo Ginzburg built large historical conclusions from small traces that powerful institutions had not thought worth erasing.","no":3,"profile":"Carlo Ginzburg is an Italian historian associated with microhistory, an approach that studies a small event, person, or community in extraordinary detail to reveal larger structures. His book The Cheese and the Worms reconstructed the ideas of a sixteenth-century miller, Menocchio, from Inquisition records. Rather than treating the records only as the voice of authority, Ginzburg read their questions, hesitations, and repeated details for traces of the accused man’s world.\n\nGinzburg has also written about the “evidential paradigm,” comparing historical inference with medicine, tracking, and connoisseurship. A hunter identifies an unseen animal from prints; a physician infers disease from symptoms; a historian reconstructs an act from details not designed as a complete confession. The strength comes from convergence and from understanding how each trace was produced.\n\nSmall clues can mislead when isolated. A seal fragment, payment, or unusual phrase might have innocent explanations. Microhistory joins them in a dense local sequence and tests alternatives. The method is especially effective when official narratives are polished but peripheral records remain messy.\n\nThe Vellano trail is made of such remnants. A stable ledger records Sanvitale’s courier horse arriving before midnight. A wax seller notes the distinctive filler purchased by his factor. The postern key shows fresh filing, and the gate warden’s household receives payment through a merchant used by the exiled commander. None alone proves conquest by fraud. Together with the forged order and troops waiting in darkness, they form a connected operation. Ginzburg’s approach makes the “one traitor” explanation true in a more precise form than legend: not a mythical villain inside the council, but an outside commander who manufactured authority, bought access, and exploited one gate.","frame":"Arranges a stable entry, wax purchase, key filing, and merchant payment around the false order. “Great betrayals survive in small accounts because nobody expects the scraps to meet again.”","q":[{"q":"What is distinctive about microhistorical investigation?","o":[{"t":"It reconstructs a small setting densely enough for minor traces to test larger claims.","v":"expert","fb":"Microhistory uses concentrated context and source criticism rather than mere small scale."},{"t":"It assumes every unexplained detail is intentional evidence left by a conspirator.","v":"danger","fb":"Traces gain force through convergence; ambiguity alone is not proof of design."},{"t":"It avoids archival detail and relies on broad theories of state decline.","v":"partial","fb":"The approach is grounded in close evidence, not avoidance of records."},{"t":"It treats one colorful anecdote as representative without checking its production.","v":"wrong","fb":"Anecdotes become useful only when their sources and alternatives are examined."}],"clue":{"category":"where","label":"WHERE — decisive","text":"Gate packet, key marks, courier ledger, and payment trail converge at the River Gate where the forged authority became physical access."}},{"q":"Why do several small traces matter more together than separately?","o":[{"t":"Four suspicious details make coincidence too unlikely to remain a serious explanation.","v":"danger","fb":"Convergence changes probability but still requires plausible alternatives to be tested."},{"t":"Independent traces produced by different activities converge on one sequence.","v":"expert","fb":"Different production pathways reduce the chance that one error or copied story explains them all."},{"t":"Each trace is dramatic enough to establish the entire operation by itself alone.","v":"partial","fb":"No single clue here carries the whole inference; their relationship does."},{"t":"The number of documents matters even when all repeat the same original rumor.","v":"wrong","fb":"Repeated dependence on one source does not create independent corroboration."}],"clue":{"category":"what","label":"WHAT — decisive","text":"Forgery, courier timing, key alteration, payment, and waiting troops form a single coordinated betrayal rather than inevitable decline."}},{"q":"Which combined evidence most directly identifies Ugo Sanvitale as the organizer?","o":[{"t":"He had publicly threatened Vellano after being exiled several years earlier.","v":"partial","fb":"A threat supplies motive but not the specific means and coordination of this operation."},{"t":"The doge lost office when the republic fell and therefore benefited least.","v":"wrong","fb":"Loss after the event does not locate the person who arranged the breach."},{"t":"His authenticated networks connect the forged order, access payment, and troop timing.","v":"expert","fb":"Operational links through separate records identify the organizer beyond general motive."},{"t":"The war magistrate’s genuine seal was copied, making him responsible for the forgery.","v":"danger","fb":"A copied credential victimizes its owner unless evidence shows participation in the copy."}],"clue":{"category":"who","label":"WHO — decisive","text":"His courier, household wax, contract phrase, payment channel, and waiting troops join across independent records."}}]}},"story":["<b>Vellano fell after its river postern opened under an order bearing the war magistrate’s seal.<\/b>","Chancery Clerk Orso holds the authentic council minute. Gate Warden Pia preserved the operative order. Notary Ferro can assemble the courier, material, payment, and troop traces.","The city may have been exposed by a council vote, doomed by long decline, or deliberately entered through authority manufactured by an exiled commander.","Nine clues separate structural weakness from the specific act that turned one vulnerable gate into conquest."],"endings":{"overclaimWhat":"fa_decision","dismissalWhat":"fa_inevit","win":{"expertTitle":"The Forged Order at the River Gate","expert":["You connect Ugo Sanvitale, the River Gate & Postern Packet, and an operation that forged authority, bought access, and coordinated enemy entry. Authentic minutes, language, material, payment, and movement records converge.","The council did not vote to stand down the garrison, and decline did not make the night inevitable. An outside commander exploited vulnerability through a specific, documented betrayal."],"soundTitle":"The Exile’s Gate Operation","sound":["Your accusation identifies Sanvitale, the River Gate, and the forged-order betrayal.","Some philological or payment details remain incomplete, but the operational timing supports the verdict."],"namedTitle":"Right Betrayal, Limited Archive","named":["You select the correct WHO, WHERE, and WHAT.","The conclusion is right, although missed clues leave parts of the forgery or access-payment chain less firmly established."]},"overclaim":{"title":"The Council Minute Ordered Reinforcement","body":["The authentic chamber record strengthens the watch; only the later gate instruction reverses it.","Blaming a formal council decision ignores the forged document and external coordination that produced the breach."]},"dismissal":{"title":"Decline Did Not Open the Postern","body":["Vellano was vulnerable, but troops entered only after a copied order, paid access, and timed movement.","Calling the fall inevitable erases the contingent operation that converted weakness into conquest."]},"wrongNames":{"title":"The Betrayal, Misassigned","body":["You recognize a forged gate operation but place it away from Sanvitale and the River Gate records that join document, payment, and entry."]}}}];</script>

<script>
const PACKS = window.__PACKS__ || [];
const NC_CASE=[{"schemaVersion":3,"mode":"three_informants_three_readings","id":"nc_greywake_case","title":"The Greywake Shoal","discipline":"Navigation Science & Bridge Systems","venue":"the Greywake grounding inquiry","agent":{"name":"Lt. Rowan Hale","role":"navigation-safety investigator"},"standingLabel":"Inquiry credibility","readingShort":"Navigators","readingLabel":"Navigation & Measurement Pioneers","dossierName":"NAVIGATION & MEASUREMENT PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Greywake grounding inquiry","DAYS_TOTAL":3,"teaser":"A destroyer passes dangerously close to a charted shoal after its electronic chart and radar overlay appear to agree. Was the ship deliberately spoofed, carried helplessly by an exceptional current, or guided by a heading error that independent fixes would have exposed?","overclaimTag":"a hostile satellite-navigation spoofing attack","truthTag":"a wrong gyro correction left unchallenged after independent fixes were suspended","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A ship track bending toward a shoal while a compass heading and radar overlay disagree\"><path d=\"M30 104 C180 90 300 72 610 38\" fill=\"none\" stroke=\"#326891\" stroke-width=\"4\"/><path d=\"M30 112 C210 104 360 104 610 100\" fill=\"none\" stroke=\"#121212\" stroke-width=\"3\" stroke-dasharray=\"10 7\"/><path d=\"M470 80 l18 -18 18 18 -18 18z\" fill=\"#B3261E\"/><circle cx=\"120\" cy=\"62\" r=\"24\" fill=\"none\" stroke=\"#121212\" stroke-width=\"3\"/><path d=\"M120 38 V86 M96 62 H144\" stroke=\"#121212\" stroke-width=\"2\"/></svg>","overclaimTease":"Compare heading, position, radar range, and current evidence. Spoofing, set and drift, and a common heading-reference error do not disagree in the same channels.","CATS":{"who":{"title":"Who let the risk persist","truth":"nc_navoff","items":[{"id":"nc_navoff","label":"Lt. Mara Voss — navigation officer"},{"id":"nc_tech","label":"Chief Eli Mercer — gyro technician"},{"id":"nc_helm","label":"QM2 Nia Cole — helmsman"}]},"where":{"title":"Where it culminates","truth":"nc_console","items":[{"id":"nc_console","label":"The Radar–Electronic Chart Integration Console"},{"id":"nc_bridgewing","label":"The Starboard Bridge Wing"},{"id":"nc_forecast","label":"The Ocean Forecast Desk"}]},"what":{"title":"What happened","truth":"nc_crosscheck","items":[{"id":"nc_spoof","label":"A hostile transmitter shifted every satellite position toward the shoal"},{"id":"nc_crosscheck","label":"A wrong gyro correction biased the overlay while independent fixes were waived"},{"id":"nc_current","label":"An exceptional current carried a correctly navigated ship off track"}]}},"READING_ORDER":["nc_anschutz","nc_sumner","nc_maury"],"CHARACTERS":{"nc_qm":{"name":"QM1 Tessa Ward","role":"Navigation plot supervisor","face":"🧭","badge":"T","legend":"the chart table","hint":"The written night order suspended radar-range and visual-bearing fixes after the overlay was declared reliable.","reading":"nc_sumner"},"nc_radar":{"name":"OS2 Malik Chen","role":"Surface-search radar operator","face":"◉","badge":"M","legend":"the radar console","hint":"Fixed lighthouse ranges drifted away from the chart overlay even while satellite positions remained smooth and internally consistent.","reading":"nc_anschutz"},"nc_ocean":{"name":"Dr. Lena Ortiz","role":"Embarked oceanographer","face":"≋","badge":"L","legend":"the current profile","hint":"The measured cross-current could explain less than one-third of the final cross-track error.","reading":"nc_maury"}},"TOPICS":{"nc_anschutz":{"sci":"Hermann Anschütz-Kaempfe (1872–1931)","topic":"The practical gyrocompass","lede":"The engineer whose north-seeking gyroscope gave steel ships a heading reference independent of magnetic disturbance.","no":1,"profile":"Hermann Anschütz-Kaempfe developed one of the first practical gyrocompasses after recognizing that a magnetic compass could be unreliable near large masses of steel and electrical equipment. A gyrocompass uses a rapidly spinning rotor, Earth rotation, gravity, and controlled damping to settle toward true north rather than magnetic north. Its usefulness is not that it can never be wrong, but that its errors have different causes and can be checked against celestial, visual, magnetic, or inertial references.\n\nA modern bridge may distribute one gyro heading to radar stabilization, an electronic chart, autopilot, and other consumers. That convenience creates a common-mode risk: two displays can agree because they share the same wrong input. Independent evidence must therefore come from a source that does not inherit the same heading reference.\n\nOn Greywake, radar video and the electronic-chart overlay appeared aligned because both used the same entered gyro correction. Raw radar ranges to fixed lighthouses did not need that correction and began rejecting the displayed track. The integrated console preserved the misleading agreement while the fix log recorded the missing independent challenge.","frame":"Points to a compass repeater and two displays fed from the same heading bus. “Agreement is only evidence when the channels are actually independent.”","q":[{"q":"Why can a gyrocompass be preferable to a magnetic compass on a steel ship?","o":[{"t":"It measures water current directly beneath the hull.","v":"wrong","fb":"A gyrocompass provides heading, not current."},{"t":"It seeks true north without relying on Earth’s local magnetic field.","v":"expert","fb":"Its north reference comes from gyroscopic dynamics, Earth rotation, gravity, and damping."},{"t":"It receives true north continuously from navigation satellites.","v":"partial","fb":"Modern systems may combine sources, but the gyrocompass principle is self-contained."},{"t":"It cannot develop systematic error once spun up.","v":"danger","fb":"Gyrocompasses require correction and comparison; treating them as infallible creates common-mode risk."}],"clue":{"category":"what","label":"WHAT — heading reference","text":"The maintenance entry applied a 2.8-degree correction with the wrong sign, biasing every display that consumed the gyro heading."}},{"q":"When radar overlay and electronic chart agree, what must be checked before calling them independent?","o":[{"t":"Whether both displays use the same heading, position, or timing input.","v":"expert","fb":"Shared inputs can create agreement without independent confirmation."},{"t":"Whether their screens use the same brightness setting.","v":"wrong","fb":"Brightness affects presentation, not navigation independence."},{"t":"Whether both are located on the bridge.","v":"partial","fb":"Location does not determine whether their data sources are independent."},{"t":"Whether the newer display has priority over the older one.","v":"danger","fb":"Recency is not a substitute for measurement independence."}],"clue":{"category":"where","label":"WHERE — common mode","text":"The misleading agreement was strongest at the integrated radar–chart console because both layers were stabilized by the same biased gyro input."}},{"q":"Which observation most directly tests a heading-reference error?","o":[{"t":"A larger-than-forecast engine fuel rate.","v":"wrong","fb":"Fuel rate does not directly test heading."},{"t":"A smooth satellite-position trace by itself.","v":"partial","fb":"Position smoothness does not reveal a shared heading bias."},{"t":"A difference between gyro heading and an independent visual or celestial azimuth.","v":"expert","fb":"An external azimuth tests the heading reference without inheriting its error."},{"t":"The absence of an equipment alarm.","v":"danger","fb":"Calibration and sign errors can remain plausible and alarm-free."}],"clue":{"category":"who","label":"WHO — authority","text":"Lt. Mara Voss signed the order treating the integrated overlay as sufficient and suspending the independent visual-bearing check."}}]},"nc_sumner":{"sci":"Thomas Hubbard Sumner (1807–1876)","topic":"The line of position","lede":"The sea captain who realized that one celestial observation can define a whole line on which the ship must lie.","no":2,"profile":"Thomas Hubbard Sumner’s 1837 Atlantic landfall produced a foundational navigation insight. When uncertain of latitude, he computed several positions from the same celestial observation and found that they lay along a line. The ship did not need a complete position from one measurement; it needed the geometric constraint that the observation actually supplied. Intersections with later or different lines could then fix position.\n\nThe deeper lesson survives in radar and electronic navigation. A range to a charted lighthouse defines a circle; a visual bearing defines a line; a depth contour constrains location; a satellite receiver supplies a position estimate. The strongest fix comes from constraints with different error mechanisms and useful crossing geometry.\n\nOn Greywake, fixed radar ranges formed circles that moved away from the electronic-chart symbol as the ship approached the shoal. Those ranges did not depend on the entered gyro correction. The navigation officer’s order removed the very observations that would have forced the integrated display to answer an independent geometric question.","frame":"Draws a range circle crossing a bearing line. “A fix is not a decorated dot. It is the intersection of constraints that could disagree.”","q":[{"q":"What is a line of position?","o":[{"t":"A route the ship has been ordered to follow.","v":"partial","fb":"A planned track is not a measured positional constraint."},{"t":"A set of possible positions consistent with one observation.","v":"expert","fb":"One observation often constrains position to a line or curve rather than a single point."},{"t":"The line connecting two satellites in orbit.","v":"wrong","fb":"Satellite geometry is different from the navigation meaning."},{"t":"A guarantee that every instrument agrees.","v":"danger","fb":"A line of position is useful precisely because it can challenge other evidence."}],"clue":{"category":"where","label":"WHERE — independent geometry","text":"Raw radar ranges to two fixed lighthouses rejected the ship symbol at the radar–electronic chart integration console."}},{"q":"Why are two differently generated lines of position valuable?","o":[{"t":"Their intersection can locate the ship while exposing incompatible measurements.","v":"expert","fb":"Independent constraints produce a fix and reveal disagreement."},{"t":"They allow the navigator to average away any large mistake automatically.","v":"danger","fb":"Averaging can hide a systematic error instead of diagnosing it."},{"t":"They make current and wind physically disappear.","v":"wrong","fb":"Environmental forces remain; fixes only measure their effect."},{"t":"They ensure the ship follows the planned course between fixes.","v":"partial","fb":"They reveal position at observation times, not automatic compliance between them."}],"clue":{"category":"what","label":"WHAT — cross-check","text":"The fix log shows that radar-range and visual-bearing lines were omitted after the integrated overlay was declared reliable."}},{"q":"Who is accountable for deciding whether the fix method is sufficient?","o":[{"t":"Only the radar manufacturer.","v":"wrong","fb":"Equipment design does not replace shipboard navigation authority."},{"t":"The person at the helm, regardless of orders.","v":"partial","fb":"The helmsman executes steering but does not own the fix policy."},{"t":"The navigation officer who approves the fix interval and independent sources.","v":"expert","fb":"The policy decision belongs to the officer responsible for the navigation plan and team."},{"t":"No one, because electronic charts are self-validating.","v":"danger","fb":"Electronic presentation cannot validate its own shared inputs."}],"clue":{"category":"who","label":"WHO — fix policy","text":"Lt. Mara Voss approved the night order that replaced independent fixes with confidence in the common display."}}]},"nc_maury":{"sci":"Matthew Fontaine Maury (1806–1873)","topic":"Winds, currents, and evidence at sea","lede":"The U.S. naval officer who turned thousands of ship logs into systematic wind and current charts.","no":3,"profile":"Matthew Fontaine Maury organized observations from ships’ logs to map prevailing winds and currents, showing that scattered operational records could become a predictive science. His charts shortened voyages by helping mariners choose routes that worked with recurring environmental patterns rather than treating the ocean as featureless.\n\nA current forecast is not a command to believe a number. It is a prior estimate to be updated with measured set and drift. Navigators compare predicted motion through the water with observed motion over the ground, then determine how much cross-track displacement the current can physically accumulate over time.\n\nOn Greywake, the embarked oceanographer measured a cross-current stronger than the forecast but not remotely large enough to create the full error. Integrating the measured current over the interval accounted for 0.8 nautical mile of set; the ship missed the intended track by 2.7 nautical miles. Current mattered, but it could not rescue the claim that the navigation references were correct.","frame":"Places a current vector beside a longer observed displacement. “An environmental explanation must pay the full distance budget, not merely point in the right direction.”","q":[{"q":"What made Maury’s wind and current work scientifically useful?","o":[{"t":"He replaced observations with one universal ocean model.","v":"danger","fb":"His contribution depended on aggregating many observations, not ignoring them."},{"t":"He compiled repeated ship reports into patterns that could be tested and used.","v":"expert","fb":"Systematic aggregation made environmental regularities operationally useful."},{"t":"He proved currents never vary from their averages.","v":"wrong","fb":"Charts describe patterns and variability, not immutable flow."},{"t":"He invented the gyrocompass.","v":"partial","fb":"His work concerned oceanography and route planning, not gyrocompass engineering."}],"clue":{"category":"what","label":"WHAT — distance budget","text":"Measured current integrated over the interval accounts for about 0.8 nautical mile, while the observed cross-track error reached 2.7 nautical miles."}},{"q":"How should a navigator test whether current explains an off-track position?","o":[{"t":"Check whether the current direction is vaguely toward the error.","v":"partial","fb":"Direction alone does not establish sufficient magnitude."},{"t":"Multiply measured drift by exposure time and compare the resulting displacement with the full error.","v":"expert","fb":"The environmental cause must close the quantitative displacement budget."},{"t":"Assume the largest forecast value occurred for the entire watch.","v":"danger","fb":"Choosing an extreme without measurement can manufacture an explanation."},{"t":"Ignore current whenever satellite navigation is available.","v":"wrong","fb":"Current still determines motion over ground and should be measured or estimated."}],"clue":{"category":"where","label":"WHERE — measured environment","text":"The ocean forecast desk recorded a real but insufficient current; the unresolved discrepancy remained visible at the navigation console."}},{"q":"Which decision turned a manageable environmental uncertainty into a near grounding?","o":[{"t":"The helmsman held the ordered heading.","v":"partial","fb":"The helmsman followed the command and could not see the full reference problem."},{"t":"The technician documented the maintenance action.","v":"wrong","fb":"The sign error began there, but independent fixes could still have caught it."},{"t":"The navigation officer waived the independent fixes that would separate current from reference error.","v":"expert","fb":"That policy allowed a correctable discrepancy to persist."},{"t":"No decision; current attack should move satellite-derived position itself or create inconsistencies among receivers. The recorded satellite fixes remained smooth and matched an independent portable receiver.","The disagreement followed heading-dependent radar overlay and visual bearing, not a common displacement of every position source."]},"dismissal":{"title":"The Current Was Real but Too Small","body":["The measured set contributed to cross-track motion, but its integrated displacement was less than one-third of the final error.","A forecast miss does not explain the 2.8-degree heading-reference discrepancy or why fixed radar ranges rejected the displayed track."]},"wrongNames":{"title":"The Error, Misassigned","body":["You recognize a navigation-reference failure but place responsibility or culmination away from the officer and integrated console that turned a correctable discrepancy into a near grounding."]}}}];PACKS.push(...NC_CASE);
const CHEATS = /cheat/.test(location.search);
const stage = document.getElementById('stage');
const CATORDER = ['who','where','what']; // notepad order mirrors real Casebook
let S = null;

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1900);
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function clueCount(){return S.clues.who.length+S.clues.what.length+S.clues.where.length;}

/* ---------- CASE SELECT ---------- */
function toSelect(){
  S=null;
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  document.getElementById('cheatBtn').style.display='none';
  document.getElementById('brandsub').textContent='A RECKON deduction game';
  document.getElementById('side').innerHTML=`<div class="agent"><div class="who">Casebook</div><div class="role">The Bureau's open files</div></div><p class="legend">Pick a case. Each has three informants; reject the sensational answer and the do-nothing answer alike — the truth is in between.</p>`;
  if(!PACKS.length){
    stage.innerHTML='<div class="err"><h3>No case packs loaded</h3><p>This player must sit beside <code>pack_e_avalanche_v3.js</code> and <code>pack_f_firmware_v3.js</code>. If the browser blocks local scripts, serve the folder:</p><p style="font-family:monospace;font-size:13px">python3 -m http.server 8080</p></div>';
    return;
  }
  const cards = PACKS.map((p,i)=>[p,i]).filter(a=>!/^nc_/.test(a[0].id)).map(([p,i])=>`
    <button class="card" onclick="startCase(${i})">
      <div class="tag">${esc(p.discipline||'')}</div>
      <div class="cname">${esc(p.title)}</div>
      <div class="chint">${esc(p.teaser||'')}</div>
      <div class="cstate">Open the inquiry →</div>
    </button>`).join('');
  stage.innerHTML=`
    <div class="eyebrow">Casebook</div>
    <h1>Three informants. Three readings.</h1>
    <p class="teaser muted">Each informant holds one scientist's passage with three questions. Answer them — you'll see correct or incorrect and why — and the questions you get right file their clues into the notepad afterward (one WHO, one WHERE, one WHAT per reading). The candidates sit in the notepad on the right; cross them off as you reason. Accuse whenever you're ready.</p>
    <div class="cards" style="margin-top:18px">${cards}</div>
    <p class="muted" style="font-size:12px">${PACKS.length} case(s) loaded.</p>`;
}

/* ---------- START ---------- */
function startCase(idx){
  const pack=PACKS[idx];
  S={ pack, idx,
      answered:{},
      clues:{who:[],what:[],where:[]},
      crossed:{who:{},what:{},where:{}},
      completed:new Set(),
      filedReadings:new Set(),
      credibility:100,
      lastFiled:null };
  try{reckonStart(pack.id);}catch(e){}
  document.getElementById('cheatBtn').style.display=CHEATS?'':'none';
  document.getElementById('brandsub').textContent=pack.title;
  try{if(pack&&pack.id)location.hash=pack.id;}catch(e){}
  renderHub();
}

/* ---------- NOTEPAD (right rail) ---------- */
function renderSide(){
  if(!S){return;}
  const p=S.pack; const h=[];
  const ag=p.agent||{name:'Investigator',role:"Investigator's Notepad"};
  h.push(`<div class="agent"><div class="who">${esc(ag.name)}</div><div class="role">${esc(ag.role)}</div></div>`);
  CATORDER.forEach(cat=>{
    const c=p.CATS[cat];
    const left=c.items.filter(it=>!S.crossed[cat][it.id]);
    const solo=left.length===1;
    h.push(`<div class="cf-h">${esc(c.title)}<span class="cnt">${left.length} left · ${S.clues[cat].length}/3 clues</span></div>`);
    c.items.forEach(it=>{
      const crossed=!!S.crossed[cat][it.id];
      const isSolo=solo&&!crossed&&left[0].id===it.id;
      const cls=crossed?'crossed':(isSolo?'only':'');
      const mk=crossed?'✗':(isSolo?'◆':'○');
      h.push(`<button class="trow ${cls}" onclick="toggleCross('${cat}','${it.id}')" title="Tap to cross off / restore"><span class="mk">${mk}</span><span class="tlabel">${esc(it.label)}</span></button>`);
    });
    // gathered clues for this category
    const notes=S.clues[cat];
    if(notes.length){
      h.push(`<div class="clues">`+notes.map(n=>{
        const fl=(S.lastFiled&&S.lastFiled.cat===cat&&S.lastFiled.text===n.text)?'flash':'';
        return `<div class="clue-note ${fl}">${esc(n.text)}<span class="src">via ${esc(n.sci)}</span></div>`;
      }).join('')+`</div>`);
    } else {
      h.push(`<div class="clue-empty">No ${cat.toUpperCase()} clue secured yet.</div>`);
    }
  });
  const v=Math.round(S.credibility);
  h.push(`<div class="stat"><div class="row"><span>${esc(p.standingLabel||'Credibility')}</span><strong>${v}</strong></div><div class="bar"><i style="width:${v}%"></i></div></div>`);
  h.push(`<div class="legend">○ open · ✗ crossed off (tap a row) · ◆ last one standing. Clues are hints, not verdicts — you still commit the accusation.</div>`);
  const readN=(p.READING_ORDER||[]).filter(k=>S.completed.has(k)).length;
  h.push(`<button class="btn ghost wide" onclick="renderArchive()">${esc(p.readingShort||'Readings')} · readings (${readN}/${(p.READING_ORDER||[]).length})</button>`);
  h.push(`<button class="btn warn wide" onclick="goAccuse()">Make an accusation</button>`);
  document.getElementById('side').innerHTML=h.join('');
  S.lastFiled=null;
}
function toggleCross(cat,id){
  if(S.crossed[cat][id]) delete S.crossed[cat][id]; else S.crossed[cat][id]=true;
  renderSide();
}

/* ---------- HUB ---------- */
function renderHub(){
  const p=S.pack;
  const story=(p.story||[]).map(s=>`<p>${s}</p>`).join('');
  const cards=(p.READING_ORDER||Object.keys(p.CHARACTERS)).map(k=>{
    const c=p.CHARACTERS[k]; const done=S.completed.has(k);
    return `<button class="card ${done?'done':''}" onclick="openReading('${k}')">
      <div class="face">${c.face||'📄'}</div>
      <div class="cname">${esc(c.name)}</div>
      <div class="crole">${esc(c.role||'')}</div>
      <div class="chint">${esc(c.hint||'')}</div>
      <div class="cstate">${done?'Meet again →':'Meet →'}</div>
    </button>`;
  }).join('');
  const allDone=S.completed.size>=(p.READING_ORDER||[]).length;
  stage.innerHTML=`
    <div class="eyebrow">${esc(p.venue||'the inquiry')}</div>
    <h1>${esc(p.title)}</h1>
    <div class="emblem">${p.emblem||''}</div>
    <div class="brief">
      <div class="incident">${p.story&&p.story[0]?p.story[0]:esc(p.teaser)}</div>
      <div class="qline">${esc(p.teaser||'')}</div>
    </div>
    <details class="howto"><summary>How to play</summary><p>Meet each of the three informants and answer their questions — right answers file clues into your notepad (one Who, one Where, one What per informant). When you're ready, make an accusation: name the Who, the Where, and the What. The true answer lies between the sensational story and the do-nothing one.</p></details>
    ${p.story&&p.story.length>1?`<div class="story" style="margin-top:16px">${p.story.slice(1).map(s=>`<p>${s}</p>`).join('')}</div>`:''}
    <h3 class="section-h">The three informants</h3>
    <div class="cards">${cards}</div>`;
  renderSide();
}
function attemptedCount(k){return S.answered[k]?Object.keys(S.answered[k]).length:0;}

/* ---------- READING ---------- */
function openReading(charKey){
  const p=S.pack; const c=p.CHARACTERS[charKey]; const topic=p.TOPICS[c.reading];
  // A completed reading opens read-only (retrieve the passage); an unfinished one resumes.
  if(S.completed.has(charKey)){ renderArchiveReading(charKey); return; }
  S.view={char:charKey, topicKey:c.reading, qIndex:firstUnanswered(charKey,topic), showFb:false, chosen:null};
  renderReading();
}
function firstUnanswered(charKey,topic){
  const ans=S.answered[charKey]||{};
  for(let i=0;i<topic.q.length;i++){ if(ans[i]===undefined) return i; }
  return topic.q.length;
}
function renderReading(){
  const p=S.pack; const v=S.view; const c=p.CHARACTERS[v.char]; const topic=p.TOPICS[v.topicKey];
  const total=topic.q.length;

  if(v.qIndex>=total){
    S.completed.add(v.char);
    // File the earned clues NOW — after all three questions are answered.
    const ans=S.answered[v.char]||{};
    let correctN=0;
    const justFiled=[];
    if(!S.filedReadings.has(v.char)){
      topic.q.forEach((qq,qi)=>{
        if(ans[qi]==='expert'){
          correctN++;
          const cat=qq.clue.category;
          if(!S.clues[cat].some(x=>x.char===v.char && x.text===qq.clue.text)){
            const note={text:qq.clue.text,label:qq.clue.label,char:v.char,sci:topic.sci};
            S.clues[cat].push(note); justFiled.push(qq.clue);
          }
        }
      });
      S.filedReadings.add(v.char);
      if(justFiled.length){ S.lastFiled={cat:justFiled[justFiled.length-1].category,text:justFiled[justFiled.length-1].text};
        toast(`${justFiled.length} clue${justFiled.length>1?'s':''} filed to the notepad — ${clueCount()}/9`); }
    } else {
      topic.q.forEach((qq,qi)=>{ if(ans[qi]==='expert') correctN++; });
    }
    const filedList = justFiled.length
      ? `<div class="clues" style="max-width:520px;margin-top:12px">`+justFiled.map(cl=>`<div class="clue-note"><b>${esc(cl.label)}</b> — ${esc(cl.text)}</div>`).join('')+`</div>`
      : `<p class="muted" style="max-width:640px">No new clues secured from this reading.</p>`;
    const perCat = topic.q.map((qq,qi)=>{
      const ok=ans[qi]==='expert';
      return `<span class="tag">${ok?'✓':'✗'} ${qq.clue.category.toUpperCase()}</span>`;
    }).join(' ');
    stage.innerHTML=`
      <div class="eyebrow">${esc(topic.topic)}</div>
      <h2>${esc(topic.sci)} — reading complete</h2>
      <p class="muted" style="max-width:640px">You answered <strong>${correctN} of ${total}</strong> correctly with ${esc(c.name)}. ${perCat}</p>
      ${filedList}
      <div class="rowbtns"><span></span><button class="btn primary" onclick="renderHub()">Back to the three informants</button></div>`;
    renderSide();
    return;
  }

  const q=topic.q[v.qIndex];
  const opts=q.o.map((o,oi)=>{
    if(v.showFb){
      const chosen=oi===v.chosen;
      return `<button class="opt ${chosen?'chosen':'dim'}" disabled>${esc(o.t)}</button>`;
    }
    return `<button class="opt" onclick="answer(${oi})">${esc(o.t)}</button>`;
  }).join('');

  let fbBlock='';
  if(v.showFb){
    const o=q.o[v.chosen];
    const isExpert=o.v==='expert';
    // Casebook-style: just correct / incorrect and the why. Clues are filed after the reading.
    const fbClass = isExpert?'expert':(o.v==='danger'?'danger':'wrong');
    const verdictLabel = isExpert?'Correct':'Incorrect';
    fbBlock=`<div class="fb ${fbClass}"><div class="verdict">${verdictLabel}</div><div class="fbtext">${esc(o.fb)}</div></div>
      <div class="rowbtns"><span></span><button class="btn primary" onclick="nextQ()">${v.qIndex+1<total?'Next question':'See what you secured'}</button></div>`;
  }

  stage.innerHTML=`
    <button class="btn small" onclick="renderHub()">← Back to informants</button>
    <div class="reading-head" style="margin-top:13px">
      <div class="eyebrow">${esc(c.name)} · ${esc(topic.topic)}</div>
      <div class="sci">${esc(topic.sci)}</div>
      <div class="topic">${esc(topic.lede||'')}</div>
    </div>
    <div class="profile">${(topic.profile||'').split('\n\n').map(t=>`<p>${esc(t)}</p>`).join('')}</div>
    ${topic.frame?`<div class="frame">${esc(topic.frame)}</div>`:''}
    <div class="qwrap">
      <div class="qprog">Question ${v.qIndex+1} of ${total}</div>
      <div class="qtext">${esc(q.q)}</div>
      ${opts}${(v.showFb||!CHEATS)?'':'<button class="btn small ghost" style="margin-top:2px" onclick="cheatQ()">🔧 Cheat · pick the correct answer</button>'}${fbBlock}
    </div>`;
  renderSide();
}
function answer(oi){
  const p=S.pack; const v=S.view; const topic=p.TOPICS[v.topicKey]; const q=topic.q[v.qIndex]; const o=q.o[oi];
  if(!S.answered[v.char]) S.answered[v.char]={};
  S.answered[v.char][v.qIndex]=o.v;
  v.chosen=oi; v.showFb=true;
  const delta={expert:0,partial:-4,wrong:-8,danger:-14}[o.v]||0;
  S.credibility=Math.max(0,S.credibility+delta);
  // Clues are NOT filed here — they are awarded after all three questions (see reading-complete block).
  renderReading();
}
function nextQ(){ S.view.qIndex++; S.view.showFb=false; S.view.chosen=null; renderReading(); }

/* ---------- READINGS ARCHIVE (retrieve past passages) ---------- */
function renderArchive(){
  const p=S.pack;
  const order=p.READING_ORDER||Object.keys(p.CHARACTERS);
  const rows=order.map(k=>{
    const c=p.CHARACTERS[k]; const topic=p.TOPICS[c.reading];
    const done=S.completed.has(k); const started=attemptedCount(k)>0;
    const state = done?'Completed':(started?('In progress · '+attemptedCount(k)+'/3'):'Not yet read');
    const cta = (done||started)?'Re-read →':'Read →';
    const secured = CATORDER.filter(cat=>S.clues[cat].some(x=>x.char===k)).map(cat=>cat.toUpperCase());
    const cluetags = done||started ? `<div style="margin-top:6px">${['who','where','what'].map(cat=>`<span class="tag">${secured.includes(cat.toUpperCase())?'✓':'—'} ${cat.toUpperCase()}</span>`).join(' ')}</div>` : '';
    return `<button class="card" onclick="openReading('${k}')" style="min-height:auto">
      <div class="face">${c.face||'📄'}</div>
      <div class="cname">${esc(topic.sci)}</div>
      <div class="crole">${esc(topic.topic)} · held by ${esc(c.name)}</div>
      ${cluetags}
      <div class="cstate">${esc(state)} · ${cta}</div>
    </button>`;
  }).join('');
  stage.innerHTML=`
    <button class="btn small" onclick="renderHub()">← Back to informants</button>
    <div class="eyebrow" style="margin-top:13px">${esc(p.dossierName||'Readings')}</div>
    <h2>${esc(p.readingLabel||'Scientist readings')}</h2>
    <p class="muted" style="max-width:640px">Retrieve any passage you've opened. Completed readings open read-only, with your answers and the clues they yielded.</p>
    <div class="cards">${rows}</div>`;
  renderSide();
}
function renderArchiveReading(charKey){
  const p=S.pack; const c=p.CHARACTERS[charKey]; const topic=p.TOPICS[c.reading];
  const ans=S.answered[charKey]||{};
  const qblocks=topic.q.map((q,qi)=>{
    const mine=ans[qi];
    const opts=q.o.map(o=>{
      const isExpert=o.v==='expert';
      const isMine=mine!==undefined && o.v===mine;
      let tags='';
      if(isExpert) tags+='<span class="tag" style="color:var(--good)">correct</span> ';
      if(isMine && !isExpert) tags+='<span class="tag" style="color:var(--danger)">your answer</span> ';
      else if(isMine && isExpert) tags+='<span class="tag" style="color:var(--good)">your answer</span> ';
      return `<div class="opt ${isExpert?'chosen':(isMine?'':'dim')}" style="cursor:default">${tags}${esc(o.t)}${(isExpert||isMine)?`<div class="muted" style="font-size:12.5px;margin-top:6px">${esc(o.fb)}</div>`:''}</div>`;
    }).join('');
    const earned = mine==='expert';
    const clue = earned
      ? `<div class="clue-drop"><div class="clabel">${esc(q.clue.label)} · secured</div><div class="ctext">${esc(q.clue.text)}</div></div>`
      : `<div class="clue-locked">${esc(q.clue.category.toUpperCase())} clue was not secured (answered ${mine?('“'+mine+'”'):'—'}).</div>`;
    return `<div class="qwrap"><div class="qprog">Question ${qi+1} · ${esc(q.clue.category.toUpperCase())} clue</div>
      <div class="qtext">${esc(q.q)}</div>${opts}${clue}</div>`;
  }).join('');
  stage.innerHTML=`
    <button class="btn small" onclick="renderArchive()">← All readings</button>
    <span style="display:inline-block;width:6px"></span>
    <button class="btn small ghost" onclick="renderHub()">Informants</button>
    <div class="reading-head" style="margin-top:13px">
      <div class="eyebrow">Read-only · ${esc(c.name)} · ${esc(topic.topic)}</div>
      <div class="sci">${esc(topic.sci)}</div>
      <div class="topic">${esc(topic.lede||'')}</div>
    </div>
    <div class="profile">${(topic.profile||'').split('\n\n').map(t=>`<p>${esc(t)}</p>`).join('')}</div>
    ${topic.frame?`<div class="frame">${esc(topic.frame)}</div>`:''}
    ${qblocks}
    <div class="rowbtns"><span></span><button class="btn primary" onclick="renderArchive()">Back to all readings</button></div>`;
  renderSide();
}

/* ---------- CHEATS (prototype only) ---------- */
function cheatQ(){
  const v=S.view; const q=S.pack.TOPICS[v.topicKey].q[v.qIndex];
  const ei=q.o.findIndex(o=>o.v==='expert');
  answer(ei>=0?ei:0);
}
function cheatSolveAll(){
  const p=S.pack;
  (p.READING_ORDER||Object.keys(p.CHARACTERS)).forEach(k=>{
    const topic=p.TOPICS[p.CHARACTERS[k].reading];
    S.answered[k]=S.answered[k]||{};
    topic.q.forEach((qq,qi)=>{
      S.answered[k][qi]='expert';
      const cat=qq.clue.category;
      if(!S.clues[cat].some(x=>x.char===k && x.text===qq.clue.text))
        S.clues[cat].push({text:qq.clue.text,label:qq.clue.label,char:k,sci:topic.sci});
    });
    S.completed.add(k); S.filedReadings.add(k);
  });
  S.credibility=100;
  S.lastFiled=null;
  toast(`Cheat: all readings solved — ${clueCount()}/9 clues filed`);
  renderHub();
}

/* ---------- ACCUSE ---------- */
function goAccuse(){
  S.accuse={who:null,what:null,where:null};
  renderAccuse();
}
function renderAccuse(){
  const p=S.pack; const a=S.accuse;
  const cats=CATORDER.map(cat=>{
    const cdef=p.CATS[cat];
    const choices=cdef.items.map(it=>{
      const crossed=!!S.crossed[cat][it.id];
      return `<button class="choice ${a[cat]===it.id?'sel':''} ${crossed?'strike':''}" onclick="pick('${cat}','${it.id}')"><span class="lbl">${esc(it.label)}</span></button>`;
    }).join('');
    return `<div class="accuse-cat"><div class="catt">${esc(cdef.title)}</div>${choices}</div>`;
  }).join('');
  const ready=a.who&&a.what&&a.where;
  stage.innerHTML=`
    <button class="btn small" onclick="renderHub()">← Back</button>
    <div class="eyebrow" style="margin-top:13px">${esc(p.title)}</div>
    <h2>Name the who, the where, and the what.</h2>
    <p class="muted" style="max-width:640px">You've secured ${clueCount()} of 9 clues. Cross-read the notepad, then commit to one option per column. Rows you've crossed off appear struck through.</p>
    <div class="accuse-grid">${cats}</div>
    <div class="rowbtns">${CHEATS?'<button class="btn small ghost" onclick="cheatAccuse()">🔧 Cheat · fill correct</button>':'<span></span>'}<button class="btn primary" ${ready?'':'disabled'} onclick="resolve()">Deliver the verdict</button></div>`;
  renderSide();
}
function pick(cat,id){ S.accuse[cat]=id; renderAccuse(); }
function cheatAccuse(){ const p=S.pack; S.accuse={who:p.CATS.who.truth,what:p.CATS.what.truth,where:p.CATS.where.truth}; renderAccuse(); }

/* ---------- RESOLVE ---------- */
function resolve(){
  const p=S.pack; const a=S.accuse; const E=p.endings;
  const tWho=p.CATS.who.truth, tWhat=p.CATS.what.truth, tWhere=p.CATS.where.truth;
  const correctAll = a.who===tWho && a.what===tWhat && a.where===tWhere;
  const n=clueCount();
  const nameOf=(cat)=>{const it=p.CATS[cat].items.find(x=>x.id===a[cat]);return it?it.label:'?';};
  try{reckonReport({game:'Casebook',gameId:p.id,gameTitle:p.title,won:correctAll,rank:correctAll?(n>=8?'EXPERT WITNESS':(n>=5?'SOUND, THIN':'NAMED')):'NOT SOLVED',cluesGathered:n,score:n});}catch(e){}
  let title, paras, band;
  if(correctAll){
    const tier = n>=8?'expert':(n>=5?'sound':'named');
    if(tier==='expert'){title=E.win.expertTitle;paras=E.win.expert;}
    else if(tier==='sound'){title=E.win.soundTitle;paras=E.win.sound;}
    else {title=E.win.namedTitle;paras=E.win.named;}
    band=`Solved · ${n}/9 clues · reading tier <strong>${tier}</strong> · credibility ${Math.round(S.credibility)}`;
  } else if(a.what===E.overclaimWhat){ title=E.overclaim.title; paras=E.overclaim.body; band=`Overclaim · the vivid story over the documented chain · ${n}/9 clues`; }
  else if(a.what===E.dismissalWhat){ title=E.dismissal.title; paras=E.dismissal.body; band=`Dismissal · you called it chance · ${n}/9 clues`; }
  else { title=E.wrongNames.title; paras=E.wrongNames.body; band=`Right mechanism, misassigned · ${n}/9 clues`; }
  const truthLabel=(cat)=>{const id=p.CATS[cat].truth;const it=p.CATS[cat].items.find(x=>x.id===id);return it?it.label:'?';};
  const colOk=(cat)=>S.accuse[cat]===p.CATS[cat].truth;
  const nCorrect=CATORDER.filter(colOk).length;
  const statusCls=correctAll?'solved':'failed';
  const statusMark=correctAll?'✓':'✗';
  const statusLabel=correctAll?'Case solved':(nCorrect>0?`Not solved — ${nCorrect} of 3 right`:'Not solved');
  const statusSub=correctAll?'You named the who, the where, and the what correctly.':'Your accusation does not match the record. The truth is below.';
  const solutionRows=CATORDER.map(cat=>{
    const ok=colOk(cat);
    return `<tr>
      <td class="cat">${esc(p.CATS[cat].title)}</td>
      <td class="mine ${ok?'ok':'no'}">${esc(nameOf(cat))}</td>
      <td class="truth">${esc(truthLabel(cat))}</td>
      <td class="res">${ok?'<span style="color:var(--good)">✓</span>':'<span style="color:var(--danger)">✗</span>'}</td>
    </tr>`;
  }).join('');
  stage.innerHTML=`
    <div class="ending">
      <div class="eyebrow">Verdict — ${esc(p.title)}</div>
      <div class="result-status ${statusCls}">
        <span class="rmark">${statusMark}</span>
        <span><span class="rlabel">${statusLabel}</span><br><span class="rsub">${statusSub}</span></span>
      </div>
      <table class="solution-table">
        <thead><tr><th>Question</th><th>Your accusation</th><th>The truth</th><th></th></tr></thead>
        <tbody>${solutionRows}</tbody>
      </table>
      <div class="verdict-band">${band}</div>
      <div class="etitle">${title}</div>
      ${paras.map(t=>`<p>${t}</p>`).join('')}
      <div class="rowbtns">
        <button class="btn" onclick="renderArchive()">Re-read the passages</button>
        <button class="btn primary" onclick="startCase(${S.idx})">Play again</button>
        <button class="btn" onclick="toSelect()">Another case</button>
      </div>
    </div>`;
  renderSide();
}

/* boot */
function boot(){
  const h=(location.hash||"").replace(/^#/,"");
  toSelect();
  if(h){ const i=PACKS.findIndex(p=>p.id===h); if(i>=0) startCase(i); }
}
boot();
</script>
<script src="reckon-results.js"></script>
</body>

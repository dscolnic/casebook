c object was discoverable within it.\n\nHollow Vale was caused by a small, dark body below the programme’s completeness target. Its sunward geometry eliminated night-time discovery opportunities during the final approach. Audit simulations insert artificial objects of the same brightness into the logged images: none would have been recovered before entry. The survey was not complete for this class, but it did not claim to be, and no official removed an existing warning. Morrison’s framework supports an uncomfortable but scientifically honest verdict. Planetary defense reduces risk through better coverage; it cannot make residual risk vanish. This impact was the residual case—natural, rare, and outside the documented capability of the network available that night.","frame":"Places the survey’s published completeness curve beside the reconstructed object size and approach. “A target defines what a programme promises. It is not a charm against everything smaller.”","q":[{"q":"What does survey completeness mean in planetary defense?","o":[{"t":"The percentage of the entire sky photographed at least once by any telescope.","v":"partial","fb":"One-time imaging omits depth, motion linking, cadence, and the defined object population."},{"t":"A guarantee that no undiscovered asteroid can strike within the covered region.","v":"wrong","fb":"Incomplete residual populations remain even in successful survey programmes."},{"t":"A public-relations number that should be ignored after any impact occurs.","v":"danger","fb":"An impact tests the limits of the metric but does not make documented capability meaningless."},{"t":"The fraction of a defined object population detectable under stated survey conditions.","v":"expert","fb":"Completeness belongs to a specified size, brightness, cadence, geometry, and detection system."}],"clue":{"category":"where","label":"WHERE — decisive","text":"The survey observatory’s published completeness target, injection tests, and pointing history define the actual capability available before impact."}},{"q":"Why does an actual impact not prove that officials ignored a warning?","o":[{"t":"Actionable responsibility requires evidence that a usable detection and assessment existed.","v":"expert","fb":"The causal question is whether actionable information existed and whether duties were breached."},{"t":"Natural events do not create duties for surveys, analysts, or civil-defence agencies.","v":"wrong","fb":"Natural hazards still require reasonable planning and response where information is available."},{"t":"Severe consequences are enough to infer that somebody concealed advance knowledge.","v":"danger","fb":"Harm cannot substitute for evidence of prior knowledge or opportunity."},{"t":"Officials are responsible chiefly for impacts larger than the programme’s formal target.","v":"partial","fb":"Targets define capability, but officials may still have duties for detected smaller objects."}],"clue":{"category":"who","label":"WHO — decisive","text":"No valid pre-impact observation, orbit, or warning existed for any official to suppress or mishandle."}},{"q":"What complete explanation best fits Hollow Vale?","o":[{"t":"A controlled orbital weapon imitated a natural trajectory and meteorite composition.","v":"wrong","fb":"The recovered dynamics and materials do not require an engineered object."},{"t":"Residual survey risk produced a natural impact with no usable advance detection.","v":"expert","fb":"Geometry, brightness, archive tests, and absence of astrometry support the residual-risk event."},{"t":"A defunded survey filed away a confirmed collision course to avoid public alarm.","v":"danger","fb":"The archive contains no confirmed course or internal warning that could have been buried."},{"t":"A known object was judged low risk because its early orbit carried large uncertainty.","v":"partial","fb":"No early orbit existed in this case, so uncertainty was not the reason warning failed."}],"clue":{"category":"what","label":"WHAT — decisive","text":"A small dark asteroid approached from the Sun, remained below documented survey capability, and struck without an actionable observing arc."}}]}},"story":["<b>A fireball flattened Hollow Vale without any public warning or known pre-impact orbit.<\/b>","Night Observer Kade holds the pointing and limiting-depth record. The Orbit Analyst can test every claimed detection. The programme clerk has completeness targets and injection simulations.","The object may have been a weapon, a known hazard that officials downplayed, or a small natural body that approached from a geometry the ground survey could not observe.","Nine clues ask whether actionable information ever existed before the impact and what the network was actually capable of seeing."],"endings":{"overclaimWhat":"weapon","dismissalWhat":"downplayed","win":{"expertTitle":"The Residual Risk From the Sun","expert":["You connect no culpable actor, the Survey Observatory Archive, and a small sunward asteroid that remained outside the network’s documented capability. Orbit reconstruction, image audit, and injection tests agree.","The object was not an engineered weapon, but neither was a confirmed warning suppressed. No usable astrometric arc existed before entry; the impact occupied a known residual blind spot in ground-based surveys."],"soundTitle":"The Unobservable Approach","sound":["Your accusation identifies the observatory record, the no-fault geometry, and the residual-risk impact.","Some orbit or completeness details remain incomplete, but the absence of usable observations supports the finding."],"namedTitle":"Right Event, Limited Orbit","named":["You select the correct WHO, WHERE, and WHAT.","The conclusion is right, although missed clues leave the solar-geometry or detection-limit case less fully quantified."]},"overclaim":{"title":"The Trajectory and Material Are Natural","body":["Reconstructed motion follows a heliocentric small-body orbit, and recovered fragments show ordinary meteoritic composition without controlled maneuvers.","A weapon theory adds machinery unsupported by the physical evidence."]},"dismissal":{"title":"There Was No Warning to Bury","body":["Raw images, rejected detections, MPC submissions, and correspondence contain no valid pre-impact observations of the object.","Capability limits are real, but they are not evidence that a known collision course was suppressed."]},"wrongNames":{"title":"The Blind Spot, Mislocated","body":["You recognize the unobservable approach but place it away from the observatory archive and capability tests that establish the no-fault result."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"e_avalanche","title":"The Whitewall Slide","discipline":"Snow, Avalanche & Glacier Science","teaser":"A wall of snow buried a crowded resort run at noon. Did patrol explosives release it, did an unforeseeable storm outrun every warning, or did the mountain's earlier signals matter more than the final trigger?","overclaimTag":"a control blast gone wrong","truthTag":"a documented weak layer left exposed","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A layered snow slope with a red fracture line above a resort run\"><g fill=\"none\" stroke=\"#e2e2d8\" stroke-width=\"1\"><path d=\"M20 118 C145 104 240 95 350 73 S540 39 640 25\"/><path d=\"M25 108 C150 95 250 84 360 64 S535 33 635 20\"/><path d=\"M30 96 C155 85 250 74 365 54 S535 27 630 15\"/><\/g><path d=\"M28 88 C150 80 250 68 360 49 S535 23 630 12\" fill=\"none\" stroke=\"#121212\" stroke-width=\"1.8\"/><path d=\"M40 100 C165 90 265 78 370 60 S535 36 622 26\" fill=\"none\" stroke=\"#326891\" stroke-width=\"1.7\" stroke-dasharray=\"5 4\"/><path d=\"M185 84 C242 75 285 68 340 58 C390 49 426 43 468 36\" fill=\"none\" stroke=\"#B3261E\" stroke-width=\"2.3\"/><path d=\"M185 84 L198 74 M240 75 L251 64 M298 66 L308 55 M358 55 L367 45 M420 44 L429 34\" stroke=\"#B3261E\" stroke-width=\"1.4\"/><g fill=\"none\" stroke=\"#121212\" stroke-width=\"1.5\"><path d=\"M485 104 L525 104 L518 118 L492 118 Z\"/><path d=\"M532 98 L574 98 L566 116 L540 116 Z\"/><line x1=\"505\" y1=\"104\" x2=\"505\" y2=\"88\"/><line x1=\"553\" y1=\"98\" x2=\"553\" y2=\"82\"/><\/g><circle cx=\"455\" cy=\"91\" r=\"3\" fill=\"#121212\"/><path d=\"M455 94 L455 107 M455 98 L447 104 M455 98 L464 103 M455 107 L448 116 M455 107 L462 116\" stroke=\"#121212\" stroke-width=\"1.4\"/><\/svg>","venue":"the Whitewall avalanche inquiry","agent":{"name":"Investigator Lena Harkness","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Snow & Avalanche Pioneers","dossierName":"SNOW & AVALANCHE PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Whitewall avalanche inquiry","DAYS_TOTAL":3,"overclaimTease":"A blast leaves an easy story; the snowpack may preserve a longer record of how the slope became ready to fail.","CATS":{"who":{"title":"Who is behind it","truth":"manager","items":[{"id":"manager","label":"Kurt Halden — resort operations manager"},{"id":"forecaster","label":"The avalanche forecaster"},{"id":"patrol","label":"The ski-patrol director"}]},"where":{"title":"Where it culminates","truth":"office","items":[{"id":"slope","label":"The Slope & Start Zone"},{"id":"patrolhut","label":"The Patrol & Forecast Hut"},{"id":"office","label":"The Resort Management Office"}]},"what":{"title":"What is happening","truth":"kept","items":[{"id":"blast","label":"A patrol control charge released an unstable slab"},{"id":"kept","label":"A mapped weak layer remained exposed after reopening"},{"id":"freak","label":"A sudden storm formed a danger no forecast could catch"}]}},"READING_ORDER":["patroller","snowforecaster","clerk"],"CHARACTERS":{"patroller":{"name":"Patroller Sten","role":"Ski-patrol observer","face":"⛷","badge":"S","legend":"the crown line","hint":"Dug the pits and traced the fracture onto the same buried layer noted all week.","reading":"lachapelle"},"snowforecaster":{"name":"The Snow Forecaster","role":"Avalanche forecaster","face":"🏔","badge":"F","legend":"the hazard board","hint":"Issued a high-hazard bulletin and can separate control work from the noon release.","reading":"atwater"},"clerk":{"name":"The Clerk","role":"Resort-office clerk","face":"🗂","badge":"C","legend":"the closure ledger","hint":"Keeps the measurement series, the closure entry, and the later reopening order.","reading":"church"}},"TOPICS":{"lachapelle":{"sci":"Edward LaChapelle (1926-2007)","topic":"Avalanche science & snow crystals","lede":"Ed LaChapelle learned to read a mountain's history in the shapes, bonds, and layers of its snow.","no":1,"profile":"Edward “Ed” LaChapelle combined physics, glaciology, mountaineering, and a lifetime on skis. After studying physics and mathematics, he trained at the Swiss Federal Institute for Snow and Avalanche Research in Davos. In 1952 he joined the U.S. Forest Service as a snow ranger at Alta, Utah, where Montgomery Atwater had established an avalanche research program. LaChapelle later led the Alta center, taught at the University of Washington, worked on glaciers from Greenland to Washington's Blue Glacier, and wrote influential guides on avalanche safety and snow crystals.\n\nSnow is not a uniform white material. Fresh crystals break, round, grow facets, sinter together, or lose bonds as temperature and vapor gradients move water through the pack. A cohesive slab can form above a weak layer of poorly bonded grains such as facets or buried surface hoar. Failure begins locally, but if the weak layer is continuous and the slab can transmit stress, a crack may propagate far beyond the initial disturbance. The visible skier, cornice fall, or explosive can be only the trigger; the snowpack's layered structure determines whether that trigger can release a large slab.\n\nField work therefore depends on profiles, not surface impressions. Observers dig pits, identify grain forms, measure hardness and temperature, and perform stability tests. A test result is local, so forecasters combine many pits with weather history, recent avalanches, terrain, and signs such as collapsing or shooting cracks. Persistent weak layers are especially treacherous because quiet days or unsuccessful control shots do not necessarily mean the layer has healed.\n\nLaChapelle's approach sharpens this case. A blast crater near a slope would not by itself explain where the fracture traveled. Investigators should trace the bed surface, examine the crown, and compare it with earlier pit descriptions. If the slab ran on the same buried layer documented across several days, the decisive story began before noon and before the final person or device disturbed the snow.","frame":"Brushes loose grains from a clear pit wall and follows one brittle band with a gloved finger. “The trigger gets the headline. The layer that carries the fracture tells you why the whole slope moved.”","q":[{"q":"What allows a small disturbance to release a much wider dry-slab avalanche?","o":[{"t":"A crack propagates through a continuous weak layer beneath a cohesive slab.","v":"expert","fb":"The slab transmits stress while the weak layer permits the fracture to spread beyond the trigger point."},{"t":"Loose surface snow rolls downhill and steadily gathers every deeper layer.","v":"wrong","fb":"That describes a loose-snow process, not the broad fracture of a cohesive slab over a weak layer."},{"t":"The trigger melts a channel that lubricates the entire slope within seconds.","v":"danger","fb":"Dry slabs commonly release through brittle weak-layer failure without rapid meltwater lubrication."},{"t":"Wind pushes the whole snow cover at once after the first patch begins sliding.","v":"partial","fb":"Wind can build slabs, but crack propagation through a weak layer explains the sudden connected release."}],"clue":{"category":"what","label":"WHAT clue","text":"The crown and bed surface follow the same buried faceted band described in earlier pits; the fracture did not originate at a fresh blast crater."}},{"q":"Why can an unsuccessful morning control shot fail to prove a persistent slab is safe at noon?","o":[{"t":"Explosives permanently strengthen nearby snow by compressing every weak grain.","v":"wrong","fb":"A shot may release or test unstable snow, but it does not uniformly heal a buried weak layer."},{"t":"The weak layer may be spatially variable and trigger later from a thinner spot.","v":"expert","fb":"Persistent layers can remain active even when one test or explosive fails to connect with a sensitive area."},{"t":"A later avalanche probably came from a second hidden charge placed after patrol left.","v":"danger","fb":"A later human trigger can find a sensitive part of the same layer without any additional explosive."},{"t":"The first shot matters chiefly when observers record its sound level at the resort base.","v":"partial","fb":"Acoustic records do not replace examining where the charge acted and whether the weak layer was connected."}],"clue":{"category":"who","label":"WHO clue","text":"The pit observers reported the weak band upward, but they did not hold the authority that returned the run to public use."}},{"q":"Which field comparison best tests whether the noon slide used a previously identified weak layer?","o":[{"t":"Measure the debris depth alone and infer the exact trigger from total volume.","v":"wrong","fb":"Debris volume describes avalanche size but rarely identifies the initiating layer or trigger by itself."},{"t":"Count every explosive used that week and assign the slide to the nearest detonation.","v":"danger","fb":"Timing alone can mislead unless the fracture and bed surface actually connect to the charge location."},{"t":"Match crown and bed-surface grains to the layer logged in earlier snow profiles.","v":"expert","fb":"Grain type, depth, and layer position can connect the released bed surface to prior observations."},{"t":"Compare skier traffic totals because crowded runs create deeper weak layers.","v":"partial","fb":"Traffic can supply triggers, but weak-layer formation depends on snow and weather processes, not crowd size."}],"clue":{"category":"where","label":"WHERE clue","text":"The mountain records where the slab released; the consequential decision about exposure was made away from the crown line."}}]},"atwater":{"sci":"Montgomery Atwater (1904-1976)","topic":"Avalanche forecasting & control","lede":"Montgomery Atwater turned Alta's deadly slopes into a field laboratory for forecasting, closure, and controlled release.","no":2,"profile":"Montgomery “Monty” Atwater came to avalanche work by an unusual route. Educated in literature, he had been a writer, rancher, and soldier before joining the U.S. Forest Service in 1945 as a snow ranger at Alta, Utah. The resort and road sat beneath active avalanche paths, and closures were then the main defense. Atwater established what the Forest Service describes as the first avalanche research center in the Western Hemisphere and helped build North American practice around systematic observation, forecasting, and control.\n\nForecasting does not mean predicting the exact minute and square meter of every release. It means assembling a structured judgment from snowfall, wind loading, temperature, snow structure, terrain, recent avalanche activity, and stability tests. Atwater kept detailed snow and water records at Alta. He also advanced active control: deliberately applying explosives or other triggers while terrain is closed, so unstable snow can be released under managed conditions rather than when the public is exposed. He later planned avalanche control for the 1960 Winter Olympics at Squaw Valley and wrote an early English-language avalanche handbook.\n\nControl work creates an easy misunderstanding. The presence of explosives is not evidence that an avalanche was accidental sabotage or that every later release was caused by the last charge. Investigators must compare exact times, locations, results, and closure status. A shot that produces no avalanche can be useful information, but it is not a guarantee; the charge may miss a sensitive spot, and a persistent weak layer may remain capable of propagating.\n\nAtwater's deeper lesson is operational. Hazard information matters only if it changes exposure. A forecaster can describe a dangerous slope, and patrol can test or close it, yet someone must decide whether the public stays out. In the Whitewall inquiry, separate the morning control log from the noon release, then follow the high-hazard bulletin to the person who had authority to keep the run closed or reopen it.","frame":"Pins the morning control map beside the noon crown sketch, then circles two different coordinates. “Explosives are evidence only when time, place, and result line up. Do not let one loud fact swallow the forecast.”","q":[{"q":"What is the purpose of explosive avalanche control on a managed slope?","o":[{"t":"Compact the snowpack permanently to prevent weak layers forming later that season.","v":"wrong","fb":"Explosives may affect a local area, but they do not permanently eliminate future weak-layer formation."},{"t":"Create a visible blast record treated as evidence that a later slide was intentional.","v":"danger","fb":"A control record documents mitigation work; causation still requires matching the charge to the fracture."},{"t":"Measure snow depth through the size of the crater left by each detonation.","v":"partial","fb":"Crater size is not a reliable substitute for snow profiles, weather data, and stability observations."},{"t":"Trigger unstable snow while terrain is closed and exposure can be controlled.","v":"expert","fb":"Control work aims to release or test instability before the public is placed beneath it."}],"clue":{"category":"what","label":"WHAT clue","text":"The logged control shots were fired during closure and outside the noon fracture's start point; their failure to release the slab did not certify it safe."}},{"q":"Which evidence most directly separates a control charge from the trigger of a later avalanche?","o":[{"t":"Compare the charge's time and coordinates with the crown and fracture origin.","v":"expert","fb":"Causation requires spatial and temporal agreement between the detonation and the release."},{"t":"Use the final debris location because all triggers leave a unique runout pattern.","v":"wrong","fb":"Runout depends on terrain and avalanche size and does not uniquely identify the initiating trigger."},{"t":"Ask whether patrol normally carries explosives during high-hazard mornings.","v":"partial","fb":"Routine practice gives context, but the specific map and timing are needed for this release."},{"t":"Assume the loudest event that day caused the largest movement of snow.","v":"danger","fb":"Salience is not mechanism; a later skier can trigger a primed layer far from an earlier blast."}],"clue":{"category":"where","label":"WHERE clue","text":"The high-hazard bulletin left the forecast hut intact; the reopening decision appears later in the management chain."}},{"q":"A forecaster rates a run high hazard and recommends closure. Who controls the remaining operational risk?","o":[{"t":"The forecaster alone, because issuing a high rating automatically closes every slope.","v":"wrong","fb":"Forecasts communicate hazard; operational closure authority can reside elsewhere in the organization."},{"t":"The operations authority deciding whether the public remains excluded from the run.","v":"expert","fb":"Forecasting informs the decision, but exposure depends on the official who opens or closes terrain."},{"t":"The patrol team alone, because explosives make every subsequent opening decision theirs.","v":"partial","fb":"Patrol supplies observations and control results, but management may retain final opening authority."},{"t":"The first skier entering the run, because personal choice transfers all responsibility.","v":"danger","fb":"A guest may trigger the slab, yet the resort still controls whether a known hazard is presented as open terrain."}],"clue":{"category":"who","label":"WHO clue","text":"The forecaster recommended continued closure; the person who overruled that recommendation held operations authority rather than forecast or patrol duty."}}]},"church":{"sci":"James E. Church (1869-1959)","topic":"Snow surveying & snowpack measurement","lede":"James Church replaced impressions of deep snow with repeatable measurements of the water actually stored inside it.","no":3,"profile":"James Edward Church was a classics professor at the University of Nevada, Reno, not a formally trained hydrologist. His love of the Sierra drew him repeatedly to Mount Rose, where he helped establish a high-altitude observatory. Around Lake Tahoe, arguments over floods, reservoir releases, and summer water supply exposed a practical problem: people could see snow on the mountains, but they could not reliably say how much water it contained.\n\nSnow depth alone is deceptive. A meter of light powder may contain less water than a much shallower layer of dense spring snow. During the winter of 1908–09, Church developed the Mount Rose snow sampler, a hollow metal tube that cuts a vertical core. The tube is weighed with and without the core; the difference gives snow-water equivalent, the depth of liquid water the snow would produce if melted. Church repeated measurements at fixed points along snow courses and compared them with later runoff and lake levels.\n\nThe power of his method came from consistency across place and time. One observation can be noisy or unrepresentative. A documented series reveals whether the pack is gaining load, settling, melting, or departing from normal conditions. Church's approach spread through the American West and helped inspire the federal cooperative snow-survey program. Modern automated stations add continuous data, but the principle remains: decisions improve when observations are standardized, preserved, and compared.\n\nWater-supply sampling is not the same as an avalanche stability test, yet Church's evidentiary discipline transfers directly. In this case, do not treat the noon storm or a single pit as the entire history. Read the dated snow records together. A multi-day sequence showing continued loading above a known weak layer makes the danger foreseeable. Then examine who received that series, where the closure status was changed, and whether the written order matched the measurements already on file.","frame":"Lays a week of snow-course sheets in chronological order and aligns the columns with a ruler. “One measurement is weather. A series becomes a record of what decision-makers had time to know.”","q":[{"q":"Why did Church's snow sampler improve on measuring snow depth alone?","o":[{"t":"It recorded surface temperature while avoiding any disturbance to the snowpack.","v":"wrong","fb":"The device extracts and weighs a core; temperature measurement is a separate observation."},{"t":"It found the deepest drift and treated that point as the basin-wide average.","v":"partial","fb":"Church used repeated fixed sampling points because one extreme drift would misrepresent the larger area."},{"t":"It measured snow-water equivalent, distinguishing light powder from dense snow.","v":"expert","fb":"Weighing a core reveals stored water, which depth alone cannot determine reliably."},{"t":"It identified every crystal shape and therefore predicted each avalanche trigger.","v":"danger","fb":"The sampler measures bulk water content, not a complete stability profile or exact trigger forecast."}],"clue":{"category":"what","label":"WHAT clue","text":"The dated series shows several days of added load above the same weak band; the dangerous structure predated the final storm pulse."}},{"q":"What makes a fixed snow course more informative than one convenient measurement near a lodge?","o":[{"t":"A fixed route makes each sample representative of the same depth and water content.","v":"wrong","fb":"Variation remains; the value lies in measuring it consistently rather than assuming uniform snow."},{"t":"A nearby lodge supplies accurate wind data for every elevation on the course.","v":"partial","fb":"A lodge station can add context, but mountain wind and deposition vary sharply with terrain and elevation."},{"t":"The same observer can choose whichever point best matches the expected forecast.","v":"danger","fb":"Changing sites to fit expectations destroys comparability and invites confirmation bias."},{"t":"Repeated samples at designated points reveal spatial and temporal change.","v":"expert","fb":"A consistent network reduces the chance that one easy or unusual location controls the conclusion."}],"clue":{"category":"where","label":"WHERE clue","text":"The measurement series and the later change from closed to open are filed together in the resort's management ledger."}},{"q":"Which document trail best shows whether the Whitewall danger was foreseeable before noon?","o":[{"t":"Dated profiles, loading measurements, hazard bulletins, and closure entries.","v":"expert","fb":"Together those records show what conditions developed, what was communicated, and how exposure changed."},{"t":"A weather summary written after rescue from the noon snowfall total alone.","v":"wrong","fb":"A retrospective single-period summary omits the multi-day loading and weak-layer observations."},{"t":"A visitor's video of the final powder cloud and the size of the debris pile.","v":"partial","fb":"The video documents the event but says little about the warnings available beforehand."},{"t":"The explosive inventory alone, because unused charges prove patrol expected safety.","v":"danger","fb":"Inventory cannot replace the snow and hazard record or show why terrain was reopened."}],"clue":{"category":"who","label":"WHO clue","text":"The closure ledger and reopening order carry the same operations authorization, after forecast and patrol warnings were already attached."}}]}},"story":["<b>At noon, Whitewall fractured above a crowded resort run.<\/b> The slab crossed the piste before most skiers understood the sound behind them.","Patroller Sten has the crown and pit observations. The Snow Forecaster has the control map and hazard bulletin. The Clerk has a week of measurements and the closure ledger.","A patrol charge offers a concrete cause. An unforeseeable storm offers a clean excuse. Each theory can borrow one fact from the mountain.","You may accuse before all three interviews, but every correct answer adds a WHO, WHAT, or WHERE note. Together the nine clues turn a sudden slide into a sequence of observations, warnings, and decisions."],"endings":{"overclaimWhat":"blast","dismissalWhat":"freak","win":{"expertTitle":"The Slope Was Reopened","expert":["You name <b>Kurt Halden — resort operations manager<\/b>, <b>The Resort Management Office<\/b>, and <b>A mapped weak layer remained exposed after reopening<\/b>. The slab fractured on the previously logged faceted band, while the control shots were earlier and outside the noon start point.","It was not a patrol charge releasing the crowd beneath it, and it was not a storm no forecast could catch. Forecast and patrol records reached management before the order that changed Whitewall from closed to open."],"soundTitle":"The Record Reaches Management","sound":["Your accusation correctly joins the operations manager, the management office, and the documented weak layer left exposed after reopening.","The snowpack evidence rejects both the blast-centered account and the claim that the danger appeared without warning."],"namedTitle":"The Right Opening Decision","named":["You identify Kurt Halden, the Resort Management Office, and the mapped weak layer that remained exposed after reopening.","The result is right, although missed clues leave the timing between warning, control work, and reopening less complete."]},"overclaim":{"title":"The Loudest Fact Wins","body":["Patrol did use explosives, but the logged shots were earlier and outside the fracture origin. The crown and bed surface follow a buried weak layer documented before the control work.","Blaming the blast confuses mitigation with cause and diverts attention from why the public was returned to a slope that still carried the unresolved hazard."]},"dismissal":{"title":"A Storm Without a History","body":["The final snowfall added load, but it did not create the whole danger at noon. Profiles and measurements show the weak layer and accumulating slab over several days.","Calling the release unforeseeable discards the hazard bulletin, the closure record, and the decision made after both were available."]},"wrongNames":{"title":"The Snowpack, Wrongly Assigned","body":["You understand that the documented weak layer remained exposed after reopening, but the bulletin and ledger place final authority and culmination elsewhere than your accusation."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"e_wildfire","title":"The Pinehaven Fire","discipline":"Wildfire & Combustion Science","venue":"the Pinehaven wildfire inquiry","agent":{"name":"Investigator June Alaric","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Wildfire-Science Pioneers","dossierName":"WILDFIRE-SCIENCE PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Pinehaven wildfire inquiry","DAYS_TOTAL":3,"teaser":"A lightning fire crossed a ridge and erased a mountain town in an afternoon. Was it coordinated arson, did deferred preparation and a held evacuation create the disaster, or did a verified wind-and-ember event exceed the planning envelope despite timely action?","overclaimTag":"coordinated arson","truthTag":"a natural fire beyond the adopted envelope","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A wind-driven wildfire crossing a ridge and sending embers toward a town\"><path d=\"M20 105 C140 58 230 95 345 48 S520 70 640 28\" fill=\"none\" stroke=\"#121212\" stroke-width=\"3\"/><path d=\"M75 93 l16-30 16 30 M155 77 l18-34 18 34 M265 70 l18-36 18 36\" fill=\"none\" stroke=\"#326891\" stroke-width=\"2\"/><g fill=\"#B3261E\"><circle cx=\"330\" cy=\"42\" r=\"4\"/><circle cx=\"370\" cy=\"31\" r=\"3\"/><circle cx=\"410\" cy=\"22\" r=\"4\"/><circle cx=\"455\" cy=\"38\" r=\"3\"/><\/g><path d=\"M500 95 h80 v28 h-80z M590 88 h45 v35 h-45z\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><\/svg>","overclaimTease":"A destructive outcome does not by itself identify negligence or arson. Test the origin, compare actual conditions with the plan, and measure whether protection standards were exceeded.","CATS":{"who":{"title":"Who is behind it","truth":"natural","items":[{"id":"chief","label":"Garrett Pyle — the forest district fire chief"},{"id":"sheriff","label":"The county sheriff directing evacuation"},{"id":"natural","label":"An act of nature — a lightning and extreme-wind event, not a person"}]},"where":{"title":"Where it culminates","truth":"ridge","items":[{"id":"ridge","label":"Pinehaven Ridge & the Lightning Origin"},{"id":"firecamp","label":"The Incident Command Post"},{"id":"office","label":"The Forest District Planning Office"}]},"what":{"title":"What happened","truth":"freak","items":[{"id":"freak","label":"A natural fire exceeded the verified planning and protection envelope"},{"id":"arson","label":"Coordinated arson created several linked ignition points"},{"id":"deferred","label":"Deferred fuel work and a delayed evacuation produced the losses"}]}},"READING_ORDER":["lookout","dispatcher","clerk"],"CHARACTERS":{"lookout":{"name":"Lookout Wren","role":"Fire lookout","face":"🔭","badge":"W","legend":"the ridge origin","hint":"Two lightning systems and the first camera frame fix one dry-strike ignition on the ridge.","reading":"byram"},"dispatcher":{"name":"The Dispatcher","role":"Incident dispatcher","face":"📻","badge":"D","legend":"the command timeline","hint":"Warnings and evacuation followed the written triggers before an unprecedented wind burst cut the road.","reading":"rothermel"},"clerk":{"name":"The Mitigation Survey Clerk","role":"Building and exposure-records clerk","face":"🗂","badge":"C","legend":"the loss survey","hint":"Compliant homes faced ember densities beyond the tests underlying the adopted standard.","reading":"cohen"}},"TOPICS":{"byram":{"sci":"George Byram (1909-1996)","topic":"Fireline intensity and extreme fire behavior","lede":"George Byram gave firefighters a way to express how much heat a moving fire releases along each metre of its front.","no":1,"profile":"George M. Byram was a U.S. Forest Service fire researcher whose work helped make wildfire behavior measurable. He studied combustion, wind, convection, and the energy released by forest fuels. His best-known quantity, Byram’s fireline intensity, combines the heat yield of the fuel, the mass consumed in the flaming front, and the rate at which that front advances. It expresses heat release per unit length of fireline and helps distinguish fires that hand crews can approach from fires that overwhelm direct attack.\n\nIntensity is not the same as burned area or flame appearance. A narrow front moving rapidly through dense dry fuel can release enormous energy. Byram also investigated blowup behavior, in which atmospheric instability, wind, terrain, and fire-generated convection interact to produce sudden acceleration. Under extreme conditions, spotting embers cross control lines and suppression tactics that work on ordinary days cease to be viable.\n\nA high-intensity fire can still have a preventable ignition or delayed response. Investigators therefore separate cause from behavior. Lightning networks, power-system logs, cameras, and burn patterns can locate ignition. Fuel measurements, wind observations, and spread rates then show whether a response plan was exceeded or merely ignored.\n\nPinehaven’s ignition was recorded by two lightning-detection systems within seconds of a dry strike on the ridge. No second origin, accelerant pattern, or human access trail appears. The exceptional feature is what followed: downslope winds doubled beyond the incident plan while very dry fuels produced fireline intensity above the threshold for direct attack. Byram’s measure does not excuse every loss, but it tests the central claim fairly. The initial crews and evacuation order matched the approved triggers; the fire’s energy and spotting distance then exceeded the planning envelope faster than alternate lines could be established.","frame":"Writes the measured spread rate and fuel consumption across a map of the ridge. “A flame can look like arson and still be physics. First calculate what crews were actually facing.”","q":[{"q":"What does Byram’s fireline intensity measure?","o":[{"t":"The probability that investigators should classify a fast fire as arson.","v":"danger","fb":"Rapid, intense behavior can arise from natural ignition and extreme environmental conditions."},{"t":"The total number of hectares that will eventually burn in the incident.","v":"partial","fb":"Area describes extent, while intensity describes energy release at the active line."},{"t":"The temperature of the hottest flame measured at one observation point.","v":"wrong","fb":"A single temperature does not capture the moving front’s heat-release rate."},{"t":"Heat released each second along a unit length of the flaming front.","v":"expert","fb":"Fireline intensity combines energy, consumed fuel, and rate of spread along the front."}],"clue":{"category":"what","label":"WHAT — lead","text":"Measured fuel consumption and spread produced intensity beyond the direct-attack range assumed in the incident plan."}},{"q":"Which evidence best separates a natural lightning ignition from coordinated arson?","o":[{"t":"Timed lightning data, one origin, and absence of separate human ignition trails.","v":"expert","fb":"Independent ignition timing and origin evidence identify cause without relying on the later severity."},{"t":"The fire spread rapidly enough that eyewitnesses could not approach the origin.","v":"partial","fb":"Limited access makes observation harder but does not positively identify lightning."},{"t":"The flames produced several spot fires beyond the first line through ember transport.","v":"wrong","fb":"Spot fires are expected ember ignitions from one intense wildfire, not separate arson origins."},{"t":"A destructive outcome should be attributed to a person so the inquiry has accountability.","v":"danger","fb":"Accountability must follow evidence; harm alone cannot create a human culprit."}],"clue":{"category":"who","label":"WHO — lead","text":"Independent lightning detections coincide with the single origin before any human access appears on cameras or gate logs."}},{"q":"Where does the earliest causal evidence converge?","o":[{"t":"Inside the forest district office where fuel budgets were approved years earlier.","v":"wrong","fb":"Budget history may matter in another case but does not locate this natural strike."},{"t":"At the ridge origin where strike timing and the first burn pattern coincide.","v":"expert","fb":"Ignition location is fixed by independent temporal and physical evidence at the origin."},{"t":"At whichever location suffered the greatest property loss after the fire expanded.","v":"danger","fb":"Damage severity identifies consequence rather than where the fire began."},{"t":"At the incident command post where the first resource order was recorded.","v":"partial","fb":"Command records begin the response timeline, not the ignition mechanism."}],"clue":{"category":"where","label":"WHERE — lead","text":"Lightning location, first smoke image, and initial burn scar converge on the exposed Pinehaven Ridge."}}]},"rothermel":{"sci":"Richard Rothermel (1929-2023)","topic":"The mathematical model of wildfire spread","lede":"Richard Rothermel translated fuel, moisture, wind, and slope into a practical estimate of how quickly a surface fire will move.","no":2,"profile":"Richard Rothermel was an American aeronautical engineer who became a landmark wildfire scientist at the U.S. Forest Service’s Northern Forest Fire Laboratory in Missoula. Drawing on laboratory burns and combustion theory, he developed the 1972 surface-fire spread model that still underlies widely used fire-behavior tools.\n\nThe model balances heat produced by the flame with the energy required to ignite unburned fuel ahead. Fuel loading, particle size, moisture, mineral content, wind, and slope alter that balance. Wind bends flames toward fresh fuel and carries heat forward; slope brings uphill fuel closer to the flame. The output is an expected rate of spread for a specified fuel bed and environment.\n\nRothermel did not claim that a single calculation predicts every wildfire. Real landscapes are heterogeneous, winds change, crown fire and long-range spotting require additional treatment, and inputs may be uncertain. Models are decision aids whose domain and assumptions must be known. Comparing forecasts with observed weather can reveal whether a plan was ignored or whether the event moved outside its design basis.\n\nAt Pinehaven, the pre-incident plan used a severe but historically supported wind scenario. The observed downslope burst was substantially stronger and arrived earlier than any station record used in that plan. When investigators insert the measured gusts, fuel moisture, and slope into the spread calculation, the observed advance is no longer mysterious. It also leaves little time between first detection and road cutoff. Dispatch records show the warning and evacuation triggers were executed at their stated thresholds. Rothermel’s method therefore cuts against two attractive narratives: fast spread is not proof of multiple arsonists, and the mere existence of fuel does not prove that ordinary management failure caused this particular run. The model shows a rare combination exceeding a defensible forecast envelope.","frame":"Updates the spread model with the actual gusts and watches the arrival line jump across the evacuation road. “A model can fail because people ignored it—or because the atmosphere supplied a case outside its inputs.”","q":[{"q":"Which variables are central to the Rothermel surface-fire spread model?","o":[{"t":"Flame temperature by itself, because spread is independent of fuel arrangement.","v":"wrong","fb":"Fuel geometry and moisture strongly affect whether heat ignites the next particles."},{"t":"An arson multiplier inserted whenever a fast fire outruns its first official forecast.","v":"danger","fb":"A model should explain behavior from measured conditions rather than insert motive as a parameter."},{"t":"Fuel properties, moisture, wind, and slope governing heat transfer to new fuel.","v":"expert","fb":"The model relates the fuel bed and environment to the rate of fire spread."},{"t":"Population density, road capacity, and the number of responding fire engines.","v":"partial","fb":"Those variables affect consequences and response, not the physical spread equation itself."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"Actual wind and fuel-moisture inputs reproduce the extraordinary run only after exceeding the severe planning scenario."}},{"q":"How can a model help distinguish ignored planning from a genuine exceedance event?","o":[{"t":"Treat any difference between forecast and outcome as evidence the model was useless.","v":"wrong","fb":"Model error requires diagnosis; it does not erase the information in assumptions and observations."},{"t":"Assume the plan was negligent whenever a rare event causes severe damage.","v":"danger","fb":"Severity alone does not establish that the original planning range was unreasonable."},{"t":"Select the model run that most closely matches the outcome after all choices are known.","v":"partial","fb":"After-the-fact matching can overfit unless the original assumptions and independent data remain visible."},{"t":"Compare the plan’s stated input range with verified conditions and observed spread.","v":"expert","fb":"The comparison tests whether decision-makers ignored expected conditions or faced verified inputs outside them."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"Weather stations on and below the ridge record the unprecedented wind burst that shifts the modeled arrival line."}},{"q":"What record weighs most strongly against blaming the incident commander for holding evacuation?","o":[{"t":"Timestamped warnings show the stated trigger produced an immediate evacuation order.","v":"expert","fb":"The trigger-to-order timeline tests the specific allegation that action was deliberately delayed."},{"t":"An emergency chief bears no responsibility when lightning supplies the ignition.","v":"danger","fb":"Natural ignition does not remove response responsibility; the documented timing does the exonerating here."},{"t":"The commander had led several previous fires without a fatal evacuation failure.","v":"partial","fb":"Past performance provides context but does not prove conduct in this incident."},{"t":"The command post remained operational until smoke entered the valley.","v":"wrong","fb":"Command-post endurance does not establish when public warning decisions were made."}],"clue":{"category":"who","label":"WHO — corroboration","text":"The evacuation order was issued when the plan’s trigger was reached, before the extraordinary wind burst accelerated the fire."}}]},"cohen":{"sci":"Jack Cohen (wildfire scientist)","topic":"The home-ignition zone and ember exposure","lede":"Jack Cohen showed that homes often ignite from local fuels and embers rather than from a continuous wall of forest flame.","no":3,"profile":"Jack Cohen is a U.S. Forest Service fire scientist known for research on how buildings ignite during wildland-urban interface fires. After destructive fires, public images often suggest that a giant flame front simply sweeps through a town. Cohen’s experiments and field studies emphasized the home-ignition zone: the building and its immediate surroundings, including roofs, vents, decks, vegetation, and nearby combustible material.\n\nWindborne embers can travel far ahead of the main fire. They collect in gutters, enter vents, lodge beneath decks, and ignite ornamental plants or stored materials. Whether a house survives depends strongly on construction and conditions within tens of metres, not only on the distant forest. This insight supports fire-resistant roofs, screened vents, clearance near structures, and attention to small receptive fuels.\n\nThe approach does not promise immunity. Exposure can exceed tested conditions. Extremely dense ember showers, structural damage from wind, and simultaneous ignitions can overwhelm otherwise compliant homes and municipal response. Investigators should compare construction, defensible space, ember density, and neighboring ignitions rather than assuming either perfect protection or inevitable destruction.\n\nPinehaven’s post-fire survey found that many buildings met the adopted roof, vent, and clearance requirements. Instrumented sites recorded an ember flux far above the design tests used when those requirements were established, driven by the same exceptional wind burst that crossed the ridge. Some vulnerable properties ignited first, but fire then spread among structures after roads were already cut off. Cohen’s lesson completes a difficult conclusion: mitigation remains valuable, yet this event cannot be reduced to a district chief’s skipped fuel project or a sheriff’s delayed order. The physical exposure exceeded the planning and building assumptions in force, after a natural ignition and timely response.","frame":"Compares screened vents and cleared yards with melted ember collectors. “Prepared does not mean invulnerable. The question is whether the exposure remained inside the protection standard.”","q":[{"q":"What is the home-ignition zone?","o":[{"t":"The full forest watershed from which smoke can eventually reach a community.","v":"partial","fb":"The wider landscape shapes exposure, but the home-ignition zone is much more local."},{"t":"The building and nearby surroundings that determine whether embers and heat ignite it.","v":"expert","fb":"Cohen’s zone focuses on the structure and nearby fuels that control ignition susceptibility."},{"t":"The interior room where firefighters first discover open flame during overhaul.","v":"wrong","fb":"Interior discovery may occur after ignition and does not define the relevant exposure area."},{"t":"A legal boundary proving landowners outside it have no wildfire responsibility.","v":"danger","fb":"The concept guides mitigation and evidence; it is not a boundary eliminating responsibility."}],"clue":{"category":"where","label":"WHERE — decisive","text":"The decisive physical chain begins on Pinehaven Ridge and continues through measured ember exposure into compliant neighborhoods."}},{"q":"When can compliant mitigation still be overwhelmed?","o":[{"t":"Whenever one neighboring property has less defensible space than the others.","v":"partial","fb":"A vulnerable neighbor raises risk but does not automatically overwhelm compliant construction."},{"t":"Screened vents and a cleared yard make survival certain in every wildfire.","v":"wrong","fb":"No practical building measure guarantees survival under unlimited exposure."},{"t":"When ember density, wind damage, and simultaneous ignitions exceed design assumptions.","v":"expert","fb":"Mitigation lowers risk within a range; exceptional exposure can still exceed that range."},{"t":"When arsonists place ignition devices directly against several buildings.","v":"danger","fb":"Extreme natural ember storms can create widespread ignitions without placed devices."}],"clue":{"category":"what","label":"WHAT — decisive","text":"Ember collectors and wind records document exposure beyond the tests underlying the adopted construction and clearance standard."}},{"q":"What final finding supports the conclusion that no candidate official caused the disaster?","o":[{"t":"No official admits a mistake in interviews, despite the complete operational record.","v":"partial","fb":"Denials are weak evidence without records and independent measurements."},{"t":"The fire caused so much damage that scientific investigation has no path to responsibility.","v":"wrong","fb":"Severe damage increases the need for analysis rather than making causation unknowable."},{"t":"Natural hazards automatically excuse every preparation and response decision.","v":"danger","fb":"Natural origin does not excuse negligence; this case is exculpatory because the actions and limits were tested."},{"t":"Independent records show natural ignition, timely action, and conditions beyond the plan.","v":"expert","fb":"The conclusion rests on positive evidence across ignition, decisions, and physical exceedance."}],"clue":{"category":"who","label":"WHO — decisive","text":"Lightning, timely triggers, compliant mitigation, and a verified code-exceeding wind-and-ember event align without a culpable intervention."}}]}},"story":["<b>A lightning strike became a firestorm that crossed Pinehaven Ridge and reached the town before alternate lines could be built.<\/b>","Lookout Wren holds the origin and intensity evidence. The Dispatcher can reconstruct warning and evacuation timing. The mitigation clerk has building compliance and ember-exposure measurements.","The losses may reflect coordinated arson, deferred preparation and delayed evacuation, or a natural combination that exceeded the planning and protection envelope despite timely action.","Nine clues test ignition, modeled spread, decision timing, and structure-level exposure before assigning a human culprit."],"endings":{"overclaimWhat":"arson","dismissalWhat":"deferred","win":{"expertTitle":"The Event Outside the Envelope","expert":["You connect no culpable actor, Pinehaven Ridge, and a natural fire that exceeded the verified planning and protection envelope. Lightning, intensity, spread modeling, response timing, and ember exposure agree.","There was no coordinated arson pattern, but the losses also cannot be assigned to deferred fuel work or a held evacuation order. The approved triggers were followed before a rare wind-and-ember event exceeded their defensible design basis."],"soundTitle":"The Natural Exceedance","sound":["Your accusation identifies the ridge origin, the no-fault event, and the conditions beyond the planning envelope.","Some intensity or mitigation details remain incomplete, but the independent timelines support the finding."],"namedTitle":"Right Event, Limited Measurement","named":["You select the correct WHO, WHERE, and WHAT.","The conclusion is right, although missed clues leave the exceedance of response or building assumptions less fully quantified."]},"overclaim":{"title":"One Lightning Origin, Not Coordinated Arson","body":["Independent strike detections, imagery, and the burn scar converge on one natural ignition with no separate human access trail.","Spot fires were created by extreme ember transport rather than multiple placed devices."]},"dismissal":{"title":"The Documented Actions Met the Adopted Triggers","body":["Evacuation began at the written threshold, and mitigation surveys show broad compliance with the standard then in force.","A familiar neglect narrative does not fit the verified timing and code-exceeding exposure in this event."]},"wrongNames":{"title":"The Rare Event, Mislocated","body":["You recognize the exceedance but place it away from the lightning origin and physical measurements that establish the no-fault chain."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"w_water","title":"The Tap","discipline":"Water Supply & Environmental Health","venue":"the Rushton water inquiry","agent":{"name":"Investigator Faye Orwell","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Water Pioneers","dossierName":"WATER & PUBLIC-HEALTH PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Rushton water inquiry","DAYS_TOTAL":3,"teaser":"A source change is followed by rising lead in children’s blood. Was poison added at treatment, did the new water remain safe throughout distribution, or did altered chemistry attack old plumbing after a required control feed was left off?","overclaimTag":"intentional contamination at treatment","truthTag":"a plant operator left required corrosion control offline","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"Water moving from treatment pipes through corroding service lines to a household tap\"><path d=\"M20 32 H210 V52 H260\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M260 42 H410 V62 H520\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M40 94 C120 72,190 112,270 90 S420 70,620 94\" fill=\"none\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><g stroke=\"#121212\" fill=\"none\" stroke-width=\"2\"><path d=\"M520 46 v38 h64 v-38\"/><path d=\"M540 84 v26 M564 84 v26\"/><\/g><g stroke=\"#B3261E\" stroke-width=\"2\"><circle cx=\"463\" cy=\"62\" r=\"5\" fill=\"none\"/><circle cx=\"480\" cy=\"68\" r=\"3\" fill=\"#B3261E\"/><circle cx=\"496\" cy=\"58\" r=\"4\" fill=\"none\"/><\/g><\/svg>","overclaimTease":"Compare the authorized source plan with the actual treatment historian, finished-water chemistry, and household pattern. Policy, operation, and downstream exposure may point to different people.","CATS":{"who":{"title":"Who is behind it","truth":"operator","items":[{"id":"official","label":"Merrick — the city emergency manager"},{"id":"regulator","label":"The state environmental regulator"},{"id":"operator","label":"Operator Nunez — treatment-plant operator"}]},"where":{"title":"Where it culminates","truth":"plant","items":[{"id":"plant","label":"The Treatment Plant & Corrosion-Feed Station"},{"id":"cityhall","label":"The City Manager’s Office"},{"id":"lab","label":"The Water-Testing Laboratory"}]},"what":{"title":"What happened","truth":"corrosion","items":[{"id":"safe","label":"The source change remained within safe distribution limits"},{"id":"tampering","label":"A contaminant was intentionally added during treatment"},{"id":"corrosion","label":"The new chemistry destabilized protective pipe scale"}]}},"READING_ORDER":["operator2","chemist","clerk"],"CHARACTERS":{"operator2":{"name":"Shift Operator Vale","role":"Treatment-plant shift operator","face":"🚰","badge":"O","legend":"the treatment floor","hint":"The corrosion-feed order was active, but Operator Nunez repeatedly left the dosing pump offline during his shifts.","reading":"corrosionchem"},"chemist":{"name":"The Water Chemist","role":"Water-testing chemist","face":"🧪","badge":"W","legend":"the sample bench","hint":"Lead results track old plumbing and time on the new source, while treated plant water shows no added contaminant.","reading":"leadkids"},"clerk":{"name":"The City-Hall Clerk","role":"Municipal records clerk","face":"🗂","badge":"C","legend":"the records room","hint":"City and regulator records required corrosion control; plant logs isolate the unapproved departure to one operator.","reading":"flintcorrosion"}},"TOPICS":{"corrosionchem":{"sci":"Marcel Pourbaix (1904-1998)","topic":"Corrosion chemistry & passivation","lede":"Marcel Pourbaix turned corrosion from a vague story about “bad water” into a map of chemical conditions and stable surfaces.","no":1,"profile":"Marcel Pourbaix was a Belgian electrochemist who spent much of his career asking a practical question: under a given set of water conditions, will a metal remain intact, dissolve, or cover itself with a protective film? His answer became the potential–pH diagram, now usually called a Pourbaix diagram. The chart places acidity on one axis and electrochemical potential on the other, then marks the regions where a metal is immune, actively corroding, or passivated by a stable oxide layer.\n\nThe diagram does not predict a corrosion rate by itself, and real plumbing adds flow, temperature, minerals, disinfectants, and mixed metals. Its power is diagnostic. A small change in pH, alkalinity, chloride, or oxidation conditions can move a pipe surface across a boundary. A scale that had remained stable for years may begin dissolving, exposing fresh metal and releasing material that had been trapped in the wall. Corrosion control therefore means managing water chemistry as part of the distribution system, not merely producing clear water at the plant gate.\n\nPourbaix assembled and published extensive electrochemical equilibrium data, culminating in his Atlas of Electrochemical Equilibria in Aqueous Solutions. Engineers still use the diagrams to reason about pipelines, boilers, reinforced concrete, and drinking-water plumbing. They also warn against treating compliance at one sampling point as proof that the entire system is chemically stable.\n\nPourbaix’s diagrams make the missing feed technically meaningful. The source switch shifted pH, alkalinity, and chloride conditions enough to destabilize protective scale unless the ordered corrosion treatment was running. City authorization and regulator correspondence both required that control, but the plant historian shows the dosing pump repeatedly left offline during Operator Nunez’s shifts. The chemical mechanism begins at the Treatment Plant & Corrosion-Feed Station even though lead is released later inside household plumbing.","frame":"Sets the old and new source analyses beside a sketch of the distribution mains. “Clear water can still cross a chemical boundary after it leaves me. Show me you know which boundary matters.”","q":[{"q":"What does a Pourbaix diagram organize for a metal in water?","o":[{"t":"Expected pipe lifetime versus pressure, diameter, and average daily flow rate.","v":"partial","fb":"Hydraulics affect service life, but those variables are not the axes of a Pourbaix diagram."},{"t":"Disinfectant dose versus bacterial count at each stage of water treatment.","v":"wrong","fb":"That is a treatment-control chart rather than an electrochemical stability map."},{"t":"The concentration of any poison needed to remain invisible in routine samples.","v":"danger","fb":"Pourbaix diagrams describe metal-water equilibria, not how contaminants evade detection."},{"t":"Immunity, active corrosion, and passivation regions versus pH and potential.","v":"expert","fb":"The diagram separates the chemical domains in which metal stays intact, dissolves, or forms a protective film."}],"clue":{"category":"who","label":"WHO — lead","text":"The source-change order required corrosion dosing; the first departures appear as unexplained feed shutdowns tied to one operator’s shifts."}},{"q":"Why can a source change release lead even when no lead enters at the plant?","o":[{"t":"Higher pressure can manufacture lead ions from otherwise lead-free pipe material.","v":"wrong","fb":"Pressure may affect leaks and flow, but it cannot create an element that is not in the plumbing."},{"t":"Chlorine can transform harmless minerals into lead whenever water stands overnight.","v":"danger","fb":"Disinfectants influence corrosion chemistry, but they do not transmute other minerals into lead."},{"t":"New pH and redox conditions can dissolve a scale that had isolated the pipe wall.","v":"expert","fb":"A chemistry shift can destabilize passivating deposits and expose metal already present in plumbing."},{"t":"Old pipes release a fixed amount of lead regardless of the water that enters them.","v":"partial","fb":"Pipe material matters, yet release can change sharply when water chemistry or protective scale changes."}],"clue":{"category":"what","label":"WHAT — lead","text":"The source switch changed conditions that govern whether protective lead-bearing pipe scale remains stable."}},{"q":"Which record most directly shows who changed the corrosion regime?","o":[{"t":"The city order authorizing the new source with corrosion treatment required.","v":"partial","fb":"The order establishes the required safeguard rather than its defeat."},{"t":"Feed-pump historian and shift log showing repeated unapproved shutdowns.","v":"expert","fb":"Equipment state tied to operator shifts identifies the enacted departure."},{"t":"The regulator letter describing acceptable monitoring and control conditions.","v":"wrong","fb":"The regulator conditions support control and do not identify the shutdown."},{"t":"A resident complaint reporting discolored water weeks after the switch.","v":"danger","fb":"Complaints show consequences but not who changed plant operation."}],"clue":{"category":"where","label":"WHERE — lead","text":"Finished water contains no added poison, but the corrosion-feed station shows the control pump offline after the new source enters treatment."}}]},"leadkids":{"sci":"Herbert Needleman (1927-2017)","topic":"Lead exposure & children’s development","lede":"Herbert Needleman showed that children could be harmed by lead without displaying the dramatic symptoms medicine once required.","no":2,"profile":"Herbert Needleman was a pediatrician and psychiatrist who challenged the comfortable belief that lead mattered only when a child became visibly poisoned. In the 1970s he looked for a record of cumulative exposure in shed baby teeth. Dentine forms in layers and can retain lead absorbed during childhood, allowing researchers to compare exposure with school performance even when a child had no acute medical crisis.\n\nNeedleman and his collaborators reported that children with higher dentine lead burdens performed worse on measures of attention, language, classroom behavior, and psychological testing. Later follow-up work strengthened the case that low-level exposure could have lasting developmental effects. The research was controversial, especially because it threatened industries built around lead paint, gasoline, and other products, but it helped move public health away from a simple poisoning threshold and toward prevention.\n\nThe statistical lesson is as important as the toxicology. Population harm can appear as a shift in a distribution rather than a row of identical catastrophes. A citywide average may remain below a regulatory action level while particular neighborhoods, homes, or children experience much higher exposure. Removing high samples, changing the sampling pool, or averaging unlike locations can therefore erase the very pattern investigators need to see.\n\nNeedleman’s work makes the exposure pattern incompatible with both harmless averages and a poison added at the plant. Elevated results concentrate in homes with older service lines, increase with stagnation, and rise with time on the new source; water leaving treatment lacks the alleged contaminant. Raw samples remain valid, while the distribution pattern follows pipe interaction. The evidence also separates a broad policy failure from a specific operational departure: the required feed existed, but one operator did not keep it running.","frame":"Spreads the raw tap results beside a neighborhood map. “An average can hide the children at the tail. Read the pattern before anyone tells you the number was acceptable.”","q":[{"q":"What did Needleman’s use of shed teeth add to lead research?","o":[{"t":"A cumulative childhood exposure record that could be compared with later performance.","v":"expert","fb":"Dentine lead offered a longer exposure record than a single blood measurement taken after the fact."},{"t":"A way to prove each learning problem had no cause except environmental lead.","v":"danger","fb":"The studies showed associations and population effects, not a unique cause for every individual difficulty."},{"t":"A direct measurement of the lead concentration in a child’s current drinking water.","v":"wrong","fb":"Teeth record absorbed exposure; they do not identify the present concentration at a specific tap."},{"t":"A screening method that became useful after a child showed severe poisoning.","v":"partial","fb":"Needleman’s point was that meaningful harm could appear below the level of obvious acute poisoning."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"Elevated samples cluster in older plumbing and with stagnation rather than appearing uniformly in water leaving the plant."}},{"q":"Why can a citywide average conceal an important lead problem?","o":[{"t":"An average below an action level indicates that sampled households were protected.","v":"danger","fb":"An action level is not a guarantee that no home or child experienced a high exposure."},{"t":"Lead affects every child identically, so variation among homes is statistical noise.","v":"wrong","fb":"Exposure and susceptibility vary; the distribution is part of the evidence rather than noise."},{"t":"The median dominates because extreme readings are usually treated as laboratory errors.","v":"partial","fb":"Outliers require investigation, but automatically discarding them can erase real high-exposure homes."},{"t":"High exposures in vulnerable homes can disappear when unlike samples are pooled.","v":"expert","fb":"A mean can look acceptable while a subgroup or upper tail carries substantial risk."}],"clue":{"category":"who","label":"WHO — corroboration","text":"City and regulator records retain the safeguard, while the plant historian repeatedly links its absence to Operator Nunez’s console login."}},{"q":"Which location best distinguishes added poison from pipe-released lead?","o":[{"t":"The city office where resident complaint summaries were assembled.","v":"partial","fb":"Administrative summaries cannot locate the contaminant source."},{"t":"The laboratory average after high household results were removed.","v":"wrong","fb":"An edited average conceals rather than resolves the spatial mechanism."},{"t":"The plant feed station and finished-water samples before distribution.","v":"expert","fb":"Plant-side chemistry tests whether contamination existed before water reached pipes."},{"t":"One home tap with old plumbing and a long stagnation period.","v":"danger","fb":"One home shows exposure but cannot alone test treatment-stage addition."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"The plant historian aligns each untreated period with the chemistry later associated with elevated household lead release."}}]},"flintcorrosion":{"sci":"Marc Edwards (environmental engineer, b. 1964)","topic":"Corrosion control & the Flint water crisis","lede":"Marc Edwards followed household water, pipe chemistry, and citizens’ complaints until an administrative decision became a measurable exposure pathway.","no":3,"profile":"Marc Edwards is an environmental engineer at Virginia Tech whose work has focused on corrosion, premise plumbing, and the unintended consequences of water-treatment decisions. He became widely known through investigations of lead in Washington, D.C., drinking water and later the Flint water crisis. In both settings, the technical issue was not lead being poured into a reservoir. It was water chemistry interacting with lead-bearing service lines, solder, and household plumbing.\n\nCorrosion control commonly uses chemistry—often phosphate-based treatment, pH adjustment, or alkalinity management—to encourage stable protective scales. When a utility changes source water, disinfectant, or treatment conditions, it must test whether those scales will remain protective. Sampling design matters just as much. Flushing a tap, selecting low-risk homes, or failing to capture stagnant water can produce reassuring numbers that do not represent residents’ exposure. Edwards’s teams combined laboratory analysis, plumbing knowledge, and resident sampling to test the whole chain from treatment decision to tap.\n\nThe larger lesson is institutional. Residents can supply observations that formal monitoring misses: discoloration, rashes, unusual taste, or repeated high home tests. Those reports are not substitutes for chemistry, but they are reasons to investigate. When complaint records, corrosion studies, and sampling results all point in the same direction, dismissing each piece separately becomes less defensible.\n\nEdwards’s source-change method joins chemistry, operations, and residents. Pipe-loop tests predicted scale destabilization without dosing, complaints rose after the source switch, and the feed historian identifies repeated offline periods under one operator. The emergency manager’s order and regulator file both anticipated corrosion control rather than waiving it. Responsibility therefore sits with the frontline decision that defeated an approved safeguard, and the decisive physical scene is the treatment feed station where that decision was enacted.","frame":"Opens the source-change memo, the complaint ledger, and the pipe-loop test on the same desk. “A crisis sticks together only when the chemistry, the sampling, and the authority all point along one chain.”","q":[{"q":"What must a utility evaluate when changing drinking-water sources?","o":[{"t":"Whether the new source tastes acceptable to a majority of customers on its first day.","v":"partial","fb":"Taste complaints can matter, but they do not replace corrosion testing and distribution-system analysis."},{"t":"Whether the new chemistry will preserve protective scales throughout the network.","v":"expert","fb":"A source can meet treatment targets yet destabilize scales in service lines and household plumbing."},{"t":"Whether the plant operator can keep the water visibly clear without changing equipment.","v":"wrong","fb":"Clarity is not evidence that lead-bearing plumbing remains chemically protected."},{"t":"Whether officials can average enough samples to remain below the action threshold.","v":"danger","fb":"Sampling should discover exposure, not be designed backward from a desired compliance result."}],"clue":{"category":"what","label":"WHAT — decisive","text":"Required corrosion control stayed offline long enough for the new chemistry to destabilize scale and release lead from distribution plumbing."}},{"q":"Why are resident samples valuable in a corrosion investigation?","o":[{"t":"They test water after it has contacted the service lines and household plumbing.","v":"expert","fb":"The exposure point is the tap, where distribution and premise plumbing have altered the treated water."},{"t":"They replace laboratory quality control because residents know their own water best.","v":"partial","fb":"Residents reveal conditions and locations, but validated analysis is still needed to measure contaminants."},{"t":"They indicate that unusual taste or color is caused by toxic lead release.","v":"danger","fb":"Sensory changes warrant investigation but do not identify a contaminant by themselves."},{"t":"They show whether treatment staff followed the plant’s daily operating checklist.","v":"wrong","fb":"Plant procedure is documented elsewhere; home samples test the downstream result of those procedures."}],"clue":{"category":"where","label":"WHERE — decisive","text":"Source water, dosing status, alarm acknowledgment, and the first altered distribution chemistry converge at the Treatment Plant & Corrosion-Feed Station."}},{"q":"Which evidence most directly assigns the failed safeguard to one worker?","o":[{"t":"The emergency manager’s signature on the broader source-change authorization.","v":"partial","fb":"Authorization of the source is not authorization to disable required control."},{"t":"The regulator’s approval of a plan that included corrosion-control treatment.","v":"wrong","fb":"Approval supports the safeguard rather than the failure to operate it."},{"t":"The chemist’s validation of high samples from neighborhoods with old plumbing.","v":"danger","fb":"Validated samples establish harm but not the person controlling the pump."},{"t":"Required dosing orders plus historian gaps recurring on the same operator’s shifts.","v":"expert","fb":"The comparison separates approved policy from the frontline departure that defeated it."}],"clue":{"category":"who","label":"WHO — decisive","text":"One treatment operator left the required pump offline, acknowledged the alarm, and restored no dosing during the periods that changed distribution chemistry."}}]}},"story":["<b>Rushton’s new source looked acceptable at the plant gate; children’s exposure rose in neighborhoods with old plumbing.<\/b>","Shift Operator Vale can read the corrosion-feed historian. The Water Chemist holds raw household and finished-water results. The City-Hall Clerk can compare operating requirements with what the plant actually did.","Intentional contamination, a harmless source change, and destabilized pipe scale each predict a different location and exposure pattern.","The case turns on whether the approved safeguard was absent by policy—or defeated by the person operating it."],"endings":{"overclaimWhat":"tampering","dismissalWhat":"safe","win":{"expertTitle":"The Feed Left Offline","expert":["You connect Operator Nunez, the Treatment Plant & Corrosion-Feed Station, and the source chemistry that destabilized protective pipe scale.","No contaminant appears in finished water, and the neighborhood pattern rejects a harmless change. Orders required dosing; historian and shift records show the frontline operator repeatedly defeated that safeguard."],"soundTitle":"The Plant-Side Departure","sound":["Your accusation identifies the operator, the feed station, and the corrosion mechanism.","Some chemistry or historian details remain incomplete, but the required-control and exposure pattern support the conclusion."],"namedTitle":"Right Operator, Thin Chemistry","named":["You choose the correct person, location, and mechanism.","The verdict holds, though missed clues leave parts of the dosing or neighborhood evidence less complete."]},"overclaim":{"title":"No Poison Was Added at Treatment","body":["Finished-water testing lacks the alleged contaminant, while exposure tracks old plumbing, stagnation, and time on the source.","The treatment-stage poisoning story cannot explain that distribution pattern."]},"dismissal":{"title":"Plant Compliance Did Not Mean Distribution Safety","body":["The new chemistry interacted with old service lines after required corrosion control was left offline.","A safe-looking plant result does not erase lead released downstream from destabilized scale."]},"wrongNames":{"title":"The Corrosion Mechanism, Misassigned","body":["You recognize pipe-scale destabilization but place responsibility or culmination away from the operator and feed station that changed the water chemistry."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"w_compound","title":"The Compounding Room","discipline":"Pharmacy & Sterile Compounding","venue":"the Meridian Compounding inquiry","agent":{"name":"Investigator Del Marsh","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Pharmacy Pioneers","dossierName":"PHARMACY & STERILITY PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Meridian Compounding inquiry","DAYS_TOTAL":3,"teaser":"Patients in several states develop the same invasive infection after routine injections. Was a contaminant deliberately added, were the illnesses unrelated, or did altered production allow a facility organism to enter linked lots?","overclaimTag":"a deliberate contaminant in the medicine","truthTag":"a sterility failure repeatedly released from the owner’s office","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"An autoclave chamber and batch record with microbial growth appearing in a vial\"><rect x=\"78\" y=\"28\" width=\"230\" height=\"84\" rx=\"8\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><circle cx=\"160\" cy=\"70\" r=\"25\" fill=\"none\" stroke=\"#326891\" stroke-width=\"2\"/><path d=\"M160 45 v50 M135 70 h50\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><path d=\"M410 34 h76 l22 20 v58 h-98z\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M486 34 v22 h22\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><g fill=\"#B3261E\"><circle cx=\"445\" cy=\"72\" r=\"4\"/><circle cx=\"466\" cy=\"88\" r=\"5\"/><circle cx=\"437\" cy=\"96\" r=\"3\"/><\/g><\/svg>","overclaimTease":"Process records, environmental cultures, and patient isolates each answer a different part of the mystery. The final question is where that evidence was accepted or overridden before the lots left.","CATS":{"who":{"title":"Who is behind it","truth":"owner","items":[{"id":"pharmacist","label":"The compounding pharmacist"},{"id":"owner","label":"Guillory — the pharmacy owner"},{"id":"inspector","label":"The state pharmacy inspector"}]},"where":{"title":"Where it culminates","truth":"office","items":[{"id":"office","label":"The Owner’s Business Office"},{"id":"culture","label":"The Environmental-Monitoring Laboratory"},{"id":"cleanroom","label":"The Clean Room & Autoclave"}]},"what":{"title":"What happened","truth":"sterility","items":[{"id":"poison","label":"A deliberate biological contaminant was added to medicine"},{"id":"sterility","label":"Production changes allowed environmental organisms into batches"},{"id":"coincidence","label":"Unrelated infections coincidentally followed the injections"}]}},"READING_ORDER":["tech","micro","clerk"],"CHARACTERS":{"tech":{"name":"Pharmacy Tech Ruiz","role":"Compounding technician","face":"⚗️","badge":"T","legend":"the clean room","hint":"Validated sterilizer cycles were shortened, leaving loads without complete time-and-temperature evidence.","reading":"autoclave"},"micro":{"name":"The Micro Analyst","role":"Environmental-monitoring analyst","face":"🧫","badge":"M","legend":"the culture bench","hint":"Room plates, retained vials, and patient isolates yield the same organism and closely matching strain pattern.","reading":"tyndall"},"cl

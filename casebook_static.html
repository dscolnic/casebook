machine's vibration spectrum reveal its health?","o":[{"t":"Because all faults produce the same single tone, easy to hear but not place.","v":"wrong","fb":"Different parts show at different frequencies; that is what locates the fault."},{"t":"Because vibration appears mainly after a part has already fully broken apart.","v":"wrong","fb":"It rises well before final failure, giving early warning."},{"t":"Each rotating part has a signature frequency, so faults show at known lines.","v":"expert","fb":"A defect raises its own telltale frequency, naming the failing part."},{"t":"Because louder machines are generally healthier than quiet ones in service.","v":"partial","fb":"Rising amplitude at a fault frequency signals trouble, not health."}],"clue":{"category":"who","label":"WHO clue","text":"The analyst’s escalation appears in the office file with the operator’s signed decision to monitor rather than ground the aircraft."}},{"q":"How does Den Hartog's science serve this board?","o":[{"t":"It treats severe vibration as evidence of an outside strike during the final flight.","v":"danger","fb":"Internal faults raise vibration with no external strike involved."},{"t":"It treats vibration as random noise that component analysis cannot attribute.","v":"wrong","fb":"Vibration is structured by frequency and is highly attributable."},{"t":"It lets the board ignore recorder trends and rely on the mountain weather.","v":"partial","fb":"The recorders supply the very spectrum his science interprets."},{"t":"It turns a rising vibration line into the named, dated voice of one part.","v":"expert","fb":"The spectrum attributes the trouble to a specific, failing component."}],"clue":{"category":"what","label":"WHAT clue","text":"The rising harmonics across several flights form a mechanical warning history that a sudden gust or deliberate strike would not leave."}}]}},"story":["<b>The Ridgeline Rotor falls in seconds after its transmission has warned for weeks.<\/b>","Mechanic Iris Dane has the debris history. The Flight-Data Analyst can read the harmonic growth. The Maintenance Records Clerk holds the deferrals and assignment decision.","A strike, a mountain gust, and a progressive gearbox failure each predict different relationships among rotor damage, vibration, and prior maintenance.","The case asks who accepted the known trend, where that decision survives, and what single component could remove both lift and anti-torque together."],"endings":{"overclaimWhat":"hx_strike","dismissalWhat":"hx_gust","win":{"expertTitle":"The Deferred Gearbox","expert":["You connect Rourke Vane — the charter-fleet operator, the Operator’s Maintenance Office, and progressive gearbox fatigue deferred beyond repeated warnings. The full clue chain links the initiating condition, the physical mechanism, and the decisive record without relying on candidate order.","The two alternative explanations each fit part of the scene, but neither survives the combined timing, material, and documentary evidence."],"soundTitle":"The Mechanical Warning Chain","sound":["Your accusation identifies Rourke Vane — the charter-fleet operator, the Operator’s Maintenance Office, and progressive gearbox fatigue deferred beyond repeated warnings.","A few missed clues leave gaps in the reconstruction, yet the evidence you recovered is sufficient to distinguish the true sequence from both traps."],"namedTitle":"Correct Failure, Thin Deferral","named":["You reach the correct three-part verdict with a thin evidentiary file.","The result is right, although the unrecovered clues would be needed to defend the causal chain under sustained challenge."]},"overclaim":{"title":"No External Strike Reached the Gear Train","body":["No bird residue, impact transient, or local blade damage precedes the simultaneous drive loss.","The fracture and debris originate inside the gearbox and predate the final flight."]},"dismissal":{"title":"The Mountain Did Not Create the Debris","body":["The flight record contains no gust capable of explaining the rising gear-mesh harmonics or spalled bearing.","Autorotation was compromised because rotor-drive integrity failed, not because weather alone overwhelmed a serviceable aircraft."]},"wrongNames":{"title":"Right Mechanism, Wrong Attribution","body":["You recognize the governing mechanism but assign it to the wrong actor or move its decisive evidence away from the location where the records and physical traces converge."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"t_wind","title":"The Fenmark Turbine Collapse","discipline":"Wind Energy & Fatigue Engineering","venue":"the Fenmark turbine inquiry","agent":{"name":"Inspector Yara Doss","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Wind & Fatigue Pioneers","dossierName":"WIND & FATIGUE PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Fenmark turbine inquiry","teaser":"A turbine throws a blade and folds its tower during a narrow convective gust front. Was the machine struck or sabotaged, had fatigue been missed during maintenance, or did a rare coherent gust exceed the certified load case despite an intact inspection record?","overclaimTag":"deliberate damage or an outside strike","truthTag":"a code-exceeding coherent gust with no culpable actor","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A wind turbine encountering a sharp coherent gust\"><path d=\"M300 126 V50\" stroke=\"#121212\" stroke-width=\"5\"/><circle cx=\"300\" cy=\"45\" r=\"8\" fill=\"none\" stroke=\"#121212\" stroke-width=\"3\"/><path d=\"M300 45 L220 24 M300 45 L370 12 M300 45 L356 102\" stroke=\"#121212\" stroke-width=\"5\"/><path d=\"M40 40 C120 14,160 66,240 38 M380 38 C460 12,520 62,620 28\" fill=\"none\" stroke=\"#B3261E\" stroke-width=\"4\"/><path d=\"M120 92 h120 M390 92 h170\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><\/svg>","overclaimTease":"A rare gust should leave a load signature distinct from fatigue or impact: a coherent wind spike, fresh overload fracture, and no long crack-growth history.","DAYS_TOTAL":3,"CATS":{"who":{"title":"Who is behind it","truth":"gust","items":[{"id":"gust","label":"An act of nature — the convective gust front, not a person"},{"id":"technician","label":"The turbine service lead"},{"id":"operator","label":"Sylvie Renn — wind-farm operator"}]},"where":{"title":"Where it culminates","truth":"nacelle","items":[{"id":"scada","label":"The SCADA Control Hut"},{"id":"nacelle","label":"The Nacelle, Rotor & Blade Root"},{"id":"office","label":"The Operator’s Asset Office"}]},"what":{"title":"What happened","truth":"freak","items":[{"id":"fatigue","label":"Blade-root fatigue progressed through a missed service interval"},{"id":"freak","label":"A coherent gust exceeded the certified transient load case"},{"id":"attack","label":"An outside strike or deliberate damage initiated the collapse"}]}},"READING_ORDER":["climber","scadaop","clerk"],"CHARACTERS":{"climber":{"name":"Blade Tech Aro","role":"Rope-access technician","face":"🧗","badge":"A","legend":"the blade root","hint":"The previous inspection is complete, and the recovered fracture is fresh overload rather than an oxidized fatigue front.","reading":"betz"},"scadaop":{"name":"The SCADA Operator","role":"Control-hut operator","face":"🖥️","badge":"S","legend":"the wind record","hint":"A narrow gust strikes all nearby turbines coherently and briefly exceeds the certified extreme operating gust.","reading":"glauert"},"clerk":{"name":"The Certification Clerk","role":"Load-case and maintenance clerk","face":"🗂","badge":"C","legend":"the engineering archive","hint":"Maintenance, bolt torque, and alarm records are complete; the measured transient falls outside the certification envelope.","reading":"rayleigh"}},"TOPICS":{"betz":{"sci":"Albert Betz (1885-1968)","topic":"The Betz limit & wind-turbine loading","lede":"Betz’s famous power limit also reveals how rapidly thrust demand rises when wind speed jumps.","no":1,"profile":"Albert Betz was a German physicist and engineer who gave wind-energy design one of its defining results. In 1919 he analysed an ideal rotor extracting energy from a moving stream of air. A turbine cannot stop the air completely, because the slowed flow must continue through and away from the rotor. Balancing mass, momentum, and energy yields the Betz limit: an ideal actuator disc can capture at most 16/27, about 59.3 percent, of the wind’s kinetic power.\n\nThe result is often described as an efficiency ceiling, but it also teaches load scaling. Wind power grows with the cube of wind speed, while aerodynamic thrust grows approximately with the square. A modest increase in wind can therefore create a large increase in both available power and structural demand. Real turbines regulate that demand through blade pitch, generator torque, yaw control, and shutdown strategies.\n\nDesign standards include operating gusts and parked extreme winds, yet every certification envelope has assumptions about duration, coherence, shear, direction change, and control response. A brief spatially coherent gust can load several blades and the tower differently from ordinary turbulence. The question after failure is whether the measured wind lies within the certified case and whether the rotor responded as expected.\n\nAt Fenmark, normal production stops as commanded, but the measured transient rises above the certified operating-gust envelope before pitch can unload the rotor. Betz’s scaling explains why the short speed increase creates a disproportionate thrust impulse. It neither excuses missing fatigue nor proves sabotage; it provides the load magnitude that both alternative stories must match.","frame":"Aro holds the clean fracture beside the gust record. “Wind load does not rise politely. Show me what a few extra metres per second can do.”","q":[{"q":"Why can no wind turbine extract all kinetic energy from the passing air?","o":[{"t":"The blades reflect exactly half the wind backward regardless of their design.","v":"partial","fb":"The optimal slowdown is derived from momentum, not a fixed reflection fraction."},{"t":"The air must retain enough motion to continue through and away from the rotor.","v":"expert","fb":"Betz’s momentum balance requires a continuing downstream flow."},{"t":"Generators does not convert rotational motion into electrical energy above low speed.","v":"wrong","fb":"Generators can operate efficiently; the aerodynamic stream sets the ideal limit."},{"t":"Atmospheric pressure becomes zero immediately behind an efficient rotor.","v":"danger","fb":"The wake pressure recovers and does not become a permanent vacuum."}],"clue":{"category":"what","label":"WHAT clue","text":"Betz’s load scaling shows the measured gust could create the recorded thrust impulse without impact or pre-existing fatigue."}},{"q":"How does aerodynamic thrust change approximately with wind speed?","o":[{"t":"It stays constant because blade pitch removes nearly every effect of stronger wind.","v":"partial","fb":"Controls reduce loads but cannot erase every transient instantly."},{"t":"It falls linearly as wind speed increases above the rated value in wind data.","v":"wrong","fb":"Above-rated control changes behaviour, but thrust does not simply fall linearly."},{"t":"It grows roughly with the square of speed for comparable operating conditions.","v":"expert","fb":"Squared speed means a short extreme can increase structural demand sharply."},{"t":"It depends mainly on generator voltage and not on the moving air.","v":"danger","fb":"Aerodynamic force originates in the air-blade interaction."}],"clue":{"category":"where","label":"WHERE clue","text":"The fresh blade-root overload and nacelle load cells align with the gust impulse at the rotor, not with damage originating in the office or control hut."}},{"q":"Which fracture observation most strongly weakens a missed-fatigue explanation?","o":[{"t":"A blade separated near a heavily loaded root connection across the turbine array.","v":"partial","fb":"The root is highly loaded in both fatigue and overload cases."},{"t":"The turbine had accumulated many operating hours before the event.","v":"wrong","fb":"Operating time creates opportunity but not proof of a crack."},{"t":"Technicians used standard nondestructive inspection during the prior service.","v":"danger","fb":"Standard inspection supports maintenance quality but the fracture surface is more direct."},{"t":"A fresh overload surface without an older oxidized crack-growth region.","v":"expert","fb":"Absence of progressive fatigue morphology favours one-time overload."}],"clue":{"category":"who","label":"WHO clue","text":"A complete inspection record and fresh fracture leave no technician or operator decision at the beginning of the failure; the initiating agent is the gust itself."}}]},"glauert":{"sci":"Hermann Glauert (1892-1934)","topic":"Blade-element momentum & rotor aerodynamics","lede":"Glauert linked each blade section to the flow through the whole rotor, making gust load a calculable event.","no":2,"profile":"Hermann Glauert was a British aerodynamicist at the Royal Aircraft Establishment who developed practical theories for propellers, wings, and rotors. Blade-element momentum theory combines two views. Momentum theory treats the rotor as a disc changing the flow, while blade-element theory divides each blade into small sections whose lift and drag depend on local speed and angle of attack.\n\nThe combined method lets engineers calculate thrust, torque, induced velocity, and the effects of blade geometry. A rotating blade experiences different relative wind along its span, and yaw, shear, turbulence, and rapid pitch changes make the inflow unsteady. Modern turbine codes extend Glauert’s framework with dynamic stall, wake dynamics, structural flexibility, and control models.\n\nGust coherence is important. Ordinary turbulence varies across the rotor, so loads partly average among blades and over time. A coherent gust changes wind over much of the disc together, producing a stronger collective thrust and tower-bending response. Directional shear or a fast veer can add asymmetric loading. Comparing multiple turbines and meteorological sensors can distinguish a real atmospheric front from a faulty anemometer on one machine.\n\nFenmark’s lidar, nacelle instruments, and neighbouring turbines record the same narrow gust and direction change. The failed machine’s pitch begins its commanded response, but the load peak arrives before the blades reach the unloading angle. Glauert’s rotor physics links the measured inflow to the transient root load. The event is rare, not unobservable, and the common signal across machines argues against local sabotage or a single defective sensor. That agreement across machines is the strongest reason to trust the measured gust.","frame":"The SCADA operator overlays lidar and five turbine traces. “One sensor can lie. A front crossing the farm leaves witnesses.”","q":[{"q":"What does blade-element momentum theory combine?","o":[{"t":"Section-by-section blade forces with the momentum change of flow through the rotor.","v":"expert","fb":"The method links local airfoil forces to the rotor’s overall flow and thrust."},{"t":"Electrical generator losses with the market price of delivered wind power.","v":"partial","fb":"Electrical and market quantities are outside the aerodynamic theory."},{"t":"Tower-foundation settlement with the chemical ageing of blade resin.","v":"wrong","fb":"Those structural and material issues require different models."},{"t":"Weather forecasts with a fixed assumption that nearly every blade sees identical wind.","v":"danger","fb":"The theory can represent varying local inflow rather than assuming perfect uniformity."}],"clue":{"category":"what","label":"WHAT clue","text":"Glauert’s reconstruction turns the measured coherent inflow into the blade-root load peak, confirming a gust-driven transient rather than a hidden crack."}},{"q":"Why can a coherent gust load a rotor more severely than ordinary turbulence?","o":[{"t":"Coherent gusts contain no moving air and therefore stop the rotor instantaneously.","v":"partial","fb":"A gust is a wind-speed change, not an absence of air."},{"t":"Much of the rotor disc experiences the change together, so loads do not average out.","v":"expert","fb":"Spatially aligned inflow creates a strong collective thrust response."},{"t":"Ordinary turbulence generally affects nearly every blade with exactly the same phase.","v":"wrong","fb":"Ordinary turbulence is often less correlated across the disc."},{"t":"A coherent gust can occur mainly after a turbine’s pitch system has failed.","v":"danger","fb":"The atmospheric event is independent of whether the pitch system is healthy."}],"clue":{"category":"where","label":"WHERE clue","text":"Lidar, adjacent turbines, and the failed nacelle record the same front, locating the decisive load at the rotor rather than in one faulty control channel."}},{"q":"Which observation best rules out one bad anemometer?","o":[{"t":"The failed turbine reports the highest single wind value in the farm in wind data.","v":"partial","fb":"One extreme instrument could itself be faulty."},{"t":"One technician remembers that the day felt unusually windy at ground level in wind data.","v":"wrong","fb":"A subjective ground impression does not validate rotor-height timing."},{"t":"Independent lidar and several nearby turbines record the same gust timing and direction shift.","v":"expert","fb":"Independent spatial agreement confirms a real atmospheric transient."},{"t":"The operator’s office received a weather advisory earlier in the week in wind data.","v":"danger","fb":"A broad advisory cannot establish the exact gust."}],"clue":{"category":"who","label":"WHO clue","text":"Independent instruments remove the operator and service lead as creators of the signal; no local data manipulation is needed to produce the event."}}]},"rayleigh":{"sci":"Lord Rayleigh (1842-1919)","topic":"Vibration, impulse & resonance","lede":"Rayleigh showed how a brief force can awaken a structure’s natural modes without years of hidden damage.","no":3,"profile":"Lord Rayleigh, born John William Strutt, made foundational contributions across acoustics, optics, and vibration. His work on oscillating systems showed how structures have natural modes and frequencies determined by mass, stiffness, and boundary conditions. When a periodic or transient force contains energy near a natural frequency, the response can be amplified.\n\nResonance is not limited to a perfectly repeating sinusoid. A sharp impulse or gust contains a range of frequencies and can excite several structural modes. Damping controls how quickly the motion decays. For a wind turbine, flexible blades, drivetrain components, nacelle, and tower interact; controls may also add or remove damping. Engineers use measured mode shapes and load simulations to avoid dangerous operating ranges and to evaluate transient extremes.\n\nFatigue and overload leave different evidence. Resonant cycling over long periods can grow cracks, producing beach marks, oxidation, or a progressive front. One exceptional transient may drive stress beyond ultimate strength and leave a comparatively fresh fracture. Vibration records can show whether a mode grew gradually before failure or responded once to a sudden input.\n\nFenmark’s tower and nacelle channels show a single large first-mode response beginning with the farm-wide gust, followed by immediate blade separation. Earlier spectra are stable, and maintenance torque checks are complete. The measured gust lies outside the certified transient case used for that control state. Rayleigh’s dynamics therefore support a genuine rare event. The conclusion is not “wind is unpredictable”; it is that one documented atmospheric input exceeded the modelled envelope without a hidden fatigue prelude.","frame":"The clerk runs the tower spectrum from calm operation into one violent mode. “Find whether this motion grew for months or arrived in one breath.”","q":[{"q":"What is a structural natural frequency?","o":[{"t":"The average wind speed naturally expected at the site each calendar year.","v":"partial","fb":"Wind climate and structural vibration are different quantities."},{"t":"A fixed generator frequency that prevents the tower from moving at the mode.","v":"wrong","fb":"Generator control does not make the flexible tower immobile."},{"t":"The fracture strength of a material expressed as cycles per second at the mode.","v":"danger","fb":"Strength is not itself a vibration frequency."},{"t":"A frequency at which the system tends to oscillate according to its mass and stiffness.","v":"expert","fb":"Natural modes arise from structural mass, stiffness, and constraints."}],"clue":{"category":"what","label":"WHAT clue","text":"Rayleigh’s modal record shows one large response launched by the gust, not a growing vibration or crack history before the event."}},{"q":"Why can a brief impulse excite a structural mode?","o":[{"t":"A sharp input contains a range of frequencies, including energy near the mode.","v":"expert","fb":"Broad-frequency content allows a transient to excite one or more modes."},{"t":"Mainly a perfectly periodic force can make any structure vibrate.","v":"partial","fb":"Repeated forcing is not required for a transient modal response."},{"t":"An impulse removes mass from the structure and changes gravity.","v":"wrong","fb":"The force changes motion, not the structure’s mass by definition."},{"t":"Modes exist mainly in laboratory models, not full-scale towers.","v":"danger","fb":"Full-scale structures have measurable natural modes."}],"clue":{"category":"where","label":"WHERE clue","text":"The nacelle and tower sensors capture the first-mode impulse at the turbine itself, synchronized with the farm-wide gust front."}},{"q":"Which record best distinguishes rare overload from long fatigue?","o":[{"t":"Many years of operation without examining the fracture surface or vibration archive.","v":"partial","fb":"Operating age alone cannot choose between fatigue and overload."},{"t":"Stable earlier spectra and a fresh fracture followed by one extreme modal response.","v":"expert","fb":"The combination directly tests history and final loading mechanism."},{"t":"A service schedule that contains fewer pages than the certification report.","v":"wrong","fb":"Document length has no causal meaning."},{"t":"A public claim that modern turbines are designed for severe weather.","v":"danger","fb":"General design claims do not replace event-specific evidence."}],"clue":{"category":"who","label":"WHO clue","text":"Certification and service records contain no waived maintenance or muted alarm; the evidence assigns no culpable person to the code-exceeding atmospheric input."}}]}},"story":["<b>Fenmark’s fallen turbine invites blame because the gust front has already passed and cannot answer questions.<\/b>","Blade Tech Aro has the fracture morphology. The SCADA Operator holds independent wind records. The Certification Clerk can compare the transient with the approved load envelope and maintenance file.","Sabotage, missed fatigue, and a genuine code-exceeding gust each predict a different history before the blade leaves the hub.","The verdict must decide whether the absence of a culprit is earned by evidence rather than selected by convenience."],"endings":{"overclaimWhat":"fatigue","dismissalWhat":"attack","win":{"expertTitle":"The Gust Beyond the Envelope","expert":["You connect no culpable individual, the Nacelle, Rotor & Blade Root, and a coherent gust exceeding the certified transient load case. The full clue chain links the initiating condition, the physical mechanism, and the decisive record without relying on candidate order.","The two alternative explanations each fit part of the scene, but neither survives the combined timing, material, and documentary evidence."],"soundTitle":"The Rare Load Case","sound":["Your accusation identifies no culpable individual, the Nacelle, Rotor & Blade Root, and a coherent gust exceeding the certified transient load case.","A few missed clues leave gaps in the reconstruction, yet the evidence you recovered is sufficient to distinguish the true sequence from both traps."],"namedTitle":"Correct Event, Sparse Dynamics","named":["You reach the correct three-part verdict with a thin evidentiary file.","The result is right, although the unrecovered clues would be needed to defend the causal chain under sustained challenge."]},"overclaim":{"title":"Fatigue Leaves a History","body":["The fracture lacks an older oxidized growth front, and earlier vibration spectra remain stable.","Inspection and torque records are complete; the failure begins with one extreme load rather than a missed maintenance interval."]},"dismissal":{"title":"No Strike Created the Wind","body":["Independent lidar and several turbines record the same atmospheric front, while the blade shows no impact or tool signature.","A local attacker is unnecessary and cannot explain the farm-wide coherent gust."]},"wrongNames":{"title":"Right Mechanism, Wrong Attribution","body":["You recognize the governing mechanism but assign it to the wrong actor or move its decisive evidence away from the location where the records and physical traces converge."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"m_adas","title":"The Autopilot on Vane Street","discipline":"Vehicle Automation & Safety","venue":"the Vane Street autonomy inquiry","agent":{"name":"Investigator Dana Okafor","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Vehicle-Automation Pioneers","dossierName":"VEHICLE-AUTOMATION & SAFETY PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Vane Street autonomy inquiry","DAYS_TOTAL":3,"teaser":"An automated car struck a pedestrian at night while its backup driver did not respond. Was it remotely hijacked, did one unforeseeable software upset occur, or did a known sensing limitation meet a safeguard the program had chosen to disable?","overclaimTag":"a remote vehicle hijack","truthTag":"a known sensing gap without its human backstop","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"An automated car approaching a pedestrian while sensors and driver monitor are disabled\"><path d=\"M20 112 H640\" stroke=\"#121212\" stroke-width=\"3\"/><path d=\"M95 86 h160 l35 26 H75z\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><circle cx=\"115\" cy=\"114\" r=\"13\" fill=\"none\" stroke=\"#121212\" stroke-width=\"3\"/><circle cx=\"245\" cy=\"114\" r=\"13\" fill=\"none\" stroke=\"#121212\" stroke-width=\"3\"/><path d=\"M300 76 q70-50 150 0\" fill=\"none\" stroke=\"#326891\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><circle cx=\"480\" cy=\"61\" r=\"8\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M480 69 v26 M480 76 l-13 13 M480 76 l13 13 M480 95 l-12 18 M480 95 l13 18\" stroke=\"#121212\" stroke-width=\"2\"/><rect x=\"540\" y=\"34\" width=\"70\" height=\"45\" rx=\"5\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M550 44 l50 25 M600 44 l-50 25\" stroke=\"#B3261E\" stroke-width=\"3\"/><\/svg>","overclaimTease":"Separate the machine’s perception from the system meant to supervise it. A crash can arise from one unlikely fault—or from two known protections allowed to fail together.","CATS":{"who":{"title":"Who is behind it","truth":"ad_maker","items":[{"id":"ad_driver","label":"The backup safety driver"},{"id":"ad_maker","label":"Sloane Pace — the autonomous-program lead"},{"id":"ad_regulator","label":"The transport-safety regulator"}]},"where":{"title":"Where it culminates","truth":"ad_office","items":[{"id":"ad_vehicle","label":"The Vehicle & Its Sensors"},{"id":"ad_datacenter","label":"The Telemetry & Perception Logs"},{"id":"ad_office","label":"The Program Development Office"}]},"what":{"title":"What happened","truth":"ad_sensorsafeguard","items":[{"id":"ad_hack","label":"A remote attacker redirected the automated vehicle"},{"id":"ad_sensorsafeguard","label":"A known night-sensing gap met a disabled driver safeguard"},{"id":"ad_glitch","label":"A unique software upset escaped otherwise intact protections"}]}},"READING_ORDER":["ad_tech","ad_analyst","ad_clerk"],"CHARACTERS":{"ad_tech":{"name":"Field Tech Ravi Sen","role":"Vehicle field technician","face":"🔧","badge":"R","legend":"the sensor rig","hint":"Night tests repeatedly showed unstable pedestrian detections before the fatal run.","reading":"ad_nader"},"ad_analyst":{"name":"The Perception Analyst","role":"Perception and telemetry analyst","face":"📈","badge":"P","legend":"the evaluation console","hint":"Object classifications changed several times while the disabled attention monitor recorded no effective takeover.","reading":"ad_haddon"},"ad_clerk":{"name":"The Program Records Clerk","role":"Safety-release records clerk","face":"🗂","badge":"C","legend":"the development file","hint":"The release waiver tied the known sensing ticket to a decision reducing backup-driver monitoring.","reading":"ad_bohlin"}},"TOPICS":{"ad_nader":{"sci":"Ralph Nader (b. 1934)","topic":"Automobile safety & crashworthiness","lede":"The lawyer who made a nation stop blaming the driver and start reading the blueprints.","no":1,"profile":"Ralph Nader is the American lawyer and consumer advocate whose 1965 book 'Unsafe at Any Speed' forced a nation to see the car crash as a design problem, not merely a driver problem. Its opening chapter dissected the handling of the Chevrolet Corvair, but its larger argument was broader: the industry had spent decades blaming 'the nut behind the wheel' while refusing to engineer cars that protected people when crashes inevitably happened. Nader marshaled evidence that manufacturers already knew how to make vehicles safer and had chosen not to.\n\nThe book's impact was immediate. It helped drive passage of the National Traffic and Motor Vehicle Safety Act of 1966, which for the first time let the federal government set binding safety standards and created the agency that became the National Highway Traffic Safety Administration. Nader popularized 'crashworthiness' — the idea of the 'second collision,' in which an occupant strikes the interior after the car strikes something — and argued that padded surfaces, collapsible columns, and belts should be designed in, not left to chance or to the buyer.\n\nHis deeper contribution was a way of thinking. A crash, Nader insisted, is a foreseeable event with foreseeable causes, and calling it an 'accident' too often excuses the people who could have prevented it.\n\nFor this inquiry, that lesson cuts against both easy answers. When an automated car kills someone, the sensational story reaches for an outside villain — a hijacker — and the comfortable story reaches for bad luck, a freak glitch. Nader would ask a colder question: what did the makers know they should build, and what did they leave out? The answer to that question is where responsibility, and the truth, actually live.","frame":"Sen wipes grease from a bracket. \"Folks love to call a crash bad luck, or pin it on whoever was behind the wheel. Ralph Nader never bought that, and neither do I. Show me you know what he actually changed.\"","q":[{"q":"What was the central argument of 'Unsafe at Any Speed'?","o":[{"t":"Faster engines are safer, since raw speed was not the hazard under review.","v":"wrong","fb":"He never argued speed was harmless; he argued cars must be crashworthy."},{"t":"Cars should be built to protect occupants, not merely to blame drivers.","v":"expert","fb":"Nader shifted the focus from the driver to the safety built into the car."},{"t":"Bad drivers cause almost every crash, so vehicle design barely matters.","v":"danger","fb":"That 'nut behind the wheel' excuse is exactly what Nader dismantled."},{"t":"The Corvair was the unsafe model, so fixing it resolved the broader problem.","v":"partial","fb":"The Corvair opened the book, but his case was against the whole industry."}],"clue":{"category":"what","label":"WHAT — lead","text":"The perception stack had repeatedly missed dark-clothed pedestrians at night, so the crash followed a known design exposure rather than a single inexplicable bit flip."}},{"q":"What does 'crashworthiness' and the second collision mean?","o":[{"t":"Building the car so rigid that deformation is eliminated during a collision.","v":"wrong","fb":"Crashworthiness manages the occupant's impact, not just body stiffness."},{"t":"Trusting a careful driver to simply avoid every crash before it starts.","v":"danger","fb":"Avoidance helps, but the point was to survive the crashes that happen."},{"t":"Designing a car so occupants survive striking the interior in a crash.","v":"expert","fb":"The 'second collision' is the occupant hitting the interior; design for it."},{"t":"Adding a single belt and treating the rest of the cabin as good enough.","v":"partial","fb":"Belts matter, but crashworthiness spans the whole occupant environment."}],"clue":{"category":"who","label":"WHO — lead","text":"The release decision that accepted the blind spot and reduced the backup-driver alert came from the program lead’s signed safety review."}},{"q":"Why does Nader's thinking matter to this inquiry?","o":[{"t":"A modern automated crash means an outsider seized control of the car.","v":"danger","fb":"That leaps to a hijacker; Nader would look first at the car's own design."},{"t":"Blame the regulator, since the maker bears no fault for a compliant vehicle.","v":"partial","fb":"Regulators share blame, but the maker's design choices come first here."},{"t":"Label it a freak accident and the file closes with nobody responsible.","v":"wrong","fb":"'Freak accident' is the very excuse Nader spent his career refuting."},{"t":"Treat the crash as foreseeable and ask what the makers left out or hid.","v":"expert","fb":"Nader's frame points straight at design choices and what was concealed."}],"clue":{"category":"where","label":"WHERE — lead","text":"The first combined record of sensor misses and monitor changes appears in the program development file, not in evidence of remote access to the vehicle."}}]},"ad_haddon":{"sci":"William Haddon Jr. (1926-1985)","topic":"The epidemiology of crashes & the Haddon matrix","lede":"The physician who treated the car crash as a disease — with a cause, a course, and a cure.","no":2,"profile":"William Haddon Jr. was an American physician and epidemiologist who became the first head of the federal agency now known as NHTSA in 1966. His radical move was to treat traffic injury as a public-health problem, subject to the same rigorous analysis as an epidemic. In this view the 'agent' of injury is energy — mechanical energy transferred to the body in a crash — and the task is to control that energy's release just as one would control a pathogen.\n\nHaddon built a framework, now called the Haddon Matrix, that organizes a crash into three phases — pre-crash, crash, and post-crash — crossed with three sets of factors: the human, the vehicle, and the physical and social environment. Each cell suggests places to intervene. Better hazard detection acts in the pre-crash phase; crumple zones and belts act in the crash phase; fast rescue and trauma care act in the post-crash phase. He also cataloged ten general strategies for injury control, from preventing the hazard's creation to strengthening the potential victim.\n\nThe power of the matrix is that it refuses single-cause thinking. A crash is never just a careless driver or just fate; it is a set of factors, many of them engineerable, interacting across time.\n\nFor this inquiry, Haddon is a compass. Faced with a fatal automated-vehicle crash, he would fill in the grid: what could the machine have sensed and done before impact; what protected the victim during it; what factors in the vehicle and its makers set the stage? That method exposes the trap answers for what they are. 'Hijack' fixates on one lurid human agent; 'freak glitch' pretends no factor was controllable. The matrix shows the controllable factors plainly.","frame":"The analyst sketches a three-by-three grid. \"Haddon wouldn't let anyone blame the driver or fate before filling in every box. Show me you can think in his matrix, and I'll walk you through the logs.\"","q":[{"q":"What was Haddon's central reframing of traffic injury?","o":[{"t":"As a public-health problem in which energy is the controllable agent of harm.","v":"expert","fb":"Haddon treated crash injury like a disease, with energy as the agent."},{"t":"As purely a vehicle problem, with the human and environment left out of it.","v":"partial","fb":"His matrix included human and environment factors, not the vehicle alone."},{"t":"As random misfortune that no method could study, predict, or hope to reduce.","v":"wrong","fb":"His whole point was that injury is patterned and preventable, not random."},{"t":"As a moral failing of reckless drivers that stiffer penalties could cure.","v":"danger","fb":"He rejected blaming the driver alone for a systemic, engineerable problem."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"The Haddon-style matrix of vehicle, human, and environment countermeasures was completed in the development office and shows the driver-monitor barrier removed before deployment."}},{"q":"What does the Haddon Matrix organize?","o":[{"t":"A list of vehicle parts to inspect, with people and setting left off the grid.","v":"partial","fb":"Parts are one cell; the grid also covers human and environmental factors."},{"t":"Pre-crash, crash, and post-crash phases against human, vehicle, environment.","v":"expert","fb":"Three phases crossed with three factor sets map every point to intervene."},{"t":"The seconds of impact, since events before and after it fall outside prevention.","v":"wrong","fb":"The matrix spans before and after the crash, not just the impact instant."},{"t":"A ranking of drivers by blame so the guiltiest can be prosecuted the hardest.","v":"danger","fb":"It is an analysis of factors to fix, not a tool for assigning driver blame."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"Night visibility, unstable classification, late braking, and an inattentive backup driver formed a linked barrier failure rather than one random software event."}},{"q":"How does the matrix expose the two trap answers here?","o":[{"t":"It points at post-crash rescue while leaving the sensors outside the picture.","v":"partial","fb":"Rescue is one column; the pre-crash sensing factors are central here."},{"t":"It confirms nothing was controllable, so the death was pure random misfortune.","v":"wrong","fb":"The matrix is built to reveal the controllable factors, not excuse them."},{"t":"It shows controllable factors the makers could have addressed before impact.","v":"expert","fb":"The grid surfaces exactly the design factors both traps ignore."},{"t":"It identifies a single hostile agent, since a person appears in the grid.","v":"danger","fb":"The grid holds vehicle and environment factors too, not just a lone attacker."}],"clue":{"category":"who","label":"WHO — corroboration","text":"The same program authority approved both continued night testing and a quieter attention alarm despite the documented interaction risk."}}]},"ad_bohlin":{"sci":"Nils Bohlin (1920-2002)","topic":"The three-point seatbelt","lede":"The engineer who designed the belt that has saved more than a million lives — then let the world copy it for free.","no":3,"profile":"Nils Bohlin was a Swedish engineer who, in 1959, designed the modern three-point seatbelt while working at Volvo. He came to cars from aviation: he had developed ejection seats at Saab, so he understood restraint under violent forces. The belts of the day were two-point lap belts that held the pelvis but let the upper body jackknife forward, sometimes causing severe internal injuries. Bohlin's insight was a belt that secured both the chest and the pelvis with a single buckle a driver could fasten one-handed, spreading crash forces across the strong bones of the shoulder and hips.\n\nThe design was elegant and, crucially, practical enough that people would actually wear it. Volvo made the three-point belt standard in 1959 and then did something rare: it left the patent open, allowing every other manufacturer to adopt the design freely because the safety benefit mattered more than the licensing revenue. The belt is now regarded as one of the most effective safety devices ever invented, credited with saving more than a million lives.\n\nBohlin's lesson is deceptively simple: a safety device only works when it is present, correct, and actually in use. A belt in the glovebox saves no one.\n\nFor this inquiry, that principle is sharp. Automated vehicles carry safeguards too — automatic braking, driver-attention monitors, watchdogs that catch the machine's blind spots. Like a belt, each is worthless if it is switched off, unbuckled, or quietly disabled. When the sensational story shouts 'hijack' and the lazy story shrugs 'glitch,' Bohlin would ask the plainer question: which protection was supposed to catch this, and was it actually engaged?","frame":"Sen holds up a frayed belt webbing. \"A safety part only counts when it's switched on and doing its job. Nils Bohlin proved that with a buckle. Convince me you understand why that matters here.\"","q":[{"q":"What made Bohlin's three-point belt better than earlier belts?","o":[{"t":"It replaced the need for any structural crumple zone at the front of the car.","v":"wrong","fb":"Belts complement crumple zones; they do not replace crash structure."},{"t":"It let the upper body swing freely so the ribs absorbed the whole impact.","v":"danger","fb":"That describes the old lap belt's flaw, which Bohlin's design fixed."},{"t":"It held the driver so rigidly that body movement was eliminated in a crash.","v":"partial","fb":"It manages motion and force; it does not freeze the body in place."},{"t":"It restrained chest and pelvis together, spreading force onto strong bones.","v":"expert","fb":"The three-point belt loads the shoulder and hips, sparing soft organs."}],"clue":{"category":"who","label":"WHO — decisive","text":"One release credential waived the attention-monitor requirement even though field staff had requested it remain active during night operation."}},{"q":"Why is it notable that Volvo left the belt patent open?","o":[{"t":"The safety benefit was judged to matter more than the licensing revenue.","v":"expert","fb":"Volvo shared the design so every maker's cars could be safer."},{"t":"It hid the belt's flaws so competitors would take the blame for failures.","v":"danger","fb":"There was no cover-up; the belt was shared precisely because it worked."},{"t":"It was a marketing stunt with no real effect on other manufacturers.","v":"partial","fb":"It was more than a stunt; open sharing spread a proven lifesaver."},{"t":"The patent was worthless because no rival ever wanted the design anyway.","v":"wrong","fb":"Rivals adopted it widely; the choice was deliberate generosity."}],"clue":{"category":"where","label":"WHERE — decisive","text":"Release notes, safety waivers, and the unresolved perception ticket converge in the signed development file."}},{"q":"How does Bohlin's principle apply to this inquiry?","o":[{"t":"A missing safeguard indicates an outsider hacked in and turned it off remotely.","v":"danger","fb":"A safeguard can be disabled from inside; that need not mean a hijacker."},{"t":"A safeguard saves no one unless it is present, correct, and switched on.","v":"expert","fb":"Ask which protection should have caught this, and whether it was engaged."},{"t":"The belt is what matters, while electronic safeguards are decorative extras.","v":"partial","fb":"Electronic safeguards are as real as belts; both must be active to help."},{"t":"Safeguards are fully reliable in practice, so this crash reduces to bad luck.","v":"wrong","fb":"Safeguards fail constantly when disabled; that is not mere bad luck."}],"clue":{"category":"what","label":"WHAT — decisive","text":"A known sensing weakness reached a pedestrian while the independent human-backup safeguard had been deliberately disabled."}}]}},"story":["<b>An automated test vehicle struck a pedestrian at night while its backup driver failed to intervene.<\/b>","Field Tech Ravi Sen holds the earlier sensor misses. The Perception Analyst can align classifications and braking. The records clerk has the release and driver-monitoring decisions.","The crash may have come from remote hijacking, a unique software upset, or a known sensing weakness operating without its intended human backstop.","Nine clues connect the vehicle behavior to the design decision that allowed that combination onto public streets."],"endings":{"overclaimWhat":"ad_hack","dismissalWhat":"ad_glitch","win":{"expertTitle":"The Safeguard Removed Before the Crash","expert":["You connect Sloane Pace, the Program Development Office, and a known night-sensing gap combined with a disabled driver-monitoring safeguard. The sensor uncertainty, release waiver, and attention record form one causal chain.","No remote command entered the vehicle, and the behavior was not a unique random upset. The program shipped a known exposure after weakening the independent human backstop intended to catch it."],"soundTitle":"The Known Gap and Missing Backstop","sound":["Your accusation identifies the program lead, the development record, and the interacting sensor and monitoring failures.","Some telemetry or review details remain incomplete, but the release history supports the finding."],"namedTitle":"Correct System, Thin Support","named":["You select the correct WHO, WHERE, and WHAT.","The verdict is right, although missed clues leave the interaction among perception, driver attention, and release authority less fully established."]},"overclaim":{"title":"No Remote Control Path Appears","body":["Authentication and network records show no external steering or command session during the event.","The vehicle followed its own perception and control stack while a known backup safeguard remained disabled."]},"dismissal":{"title":"The Failure Was Reproducible Before Launch","body":["Earlier night tests produced the same unstable classifications, and the attention-monitor change was documented before deployment.","That pattern cannot be reduced to a unique, unforeseeable software upset."]},"wrongNames":{"title":"The Safety Failure, Misassigned","body":["You recognize the combined sensing and monitoring failure but place it away from the release authority and development record that joined those risks."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"m_railx","title":"The Marsh Lane Crossing","discipline":"Railway Signalling & Interlocking","venue":"the Marsh Lane crossing inquiry","agent":{"name":"Investigator Glen Ashby","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Railway-Signalling Pioneers","dossierName":"RAILWAY-SIGNALLING PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Marsh Lane crossing inquiry","DAYS_TOTAL":3,"teaser":"An express struck a stopped train at a level crossing while the home signal displayed green. Was the line obstructed, did the driver pass a stop aspect, or did the signalling logic receive a false clear from inside its own maintenance chain?","overclaimTag":"sabotage on the railway","truthTag":"a maintenance bypass that produced a false clear","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A level crossing, occupied track circuit, and cleared signal\"><path d=\"M30 96 H630\" stroke=\"#121212\" stroke-width=\"5\"/><path d=\"M30 110 H630\" stroke=\"#121212\" stroke-width=\"5\"/><path d=\"M115 82 v42 M145 82 v42 M175 82 v42 M205 82 v42 M455 82 v42 M485 82 v42 M515 82 v42 M545 82 v42\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><rect x=\"280\" y=\"75\" width=\"105\" height=\"41\" rx=\"5\" fill=\"none\" stroke=\"#326891\" stroke-width=\"2\"/><circle cx=\"560\" cy=\"45\" r=\"18\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><circle cx=\"560\" cy=\"45\" r=\"7\" fill=\"#B3261E\"/><path d=\"M250 34 h75 v28 h-75z M335 34 h75 v28 h-75z\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M325 48 h10\" stroke=\"#B3261E\" stroke-width=\"4\"/><\/svg>","overclaimTease":"A green aspect is an output, not an explanation. Trace the occupied state from the rails through every relay that converted evidence into permission.","CATS":{"who":{"title":"Who is behind it","truth":"rx_infra","items":[{"id":"rx_infra","label":"Mara Doss — the signalling maintenance technician"},{"id":"rx_driver","label":"The express driver"},{"id":"rx_regulator","label":"The rail-safety inspector"}]},"where":{"title":"Where it culminates","truth":"rx_signalbox","items":[{"id":"rx_crossing","label":"The Crossing & Track Circuit"},{"id":"rx_signalbox","label":"The Signal-Box Relay & Event Recorder"},{"id":"rx_office","label":"The Infrastructure Head Office"}]},"what":{"title":"What happened","truth":"rx_interlock","items":[{"id":"rx_sabotage","label":"An object or explosive device obstructed the railway"},{"id":"rx_driver","label":"The express driver passed a correctly displayed stop signal"},{"id":"rx_interlock","label":"A maintenance bypass falsely cleared an occupied crossing"}]}},"READING_ORDER":["rx_technician","rx_signaller","rx_clerk"],"CHARACTERS":{"rx_technician":{"name":"S&T Tech Mara Doss","role":"Signal and telegraph technician","face":"🔧","badge":"M","legend":"the relay cabinet","hint":"A temporary strap held the occupied input in its clear state after the maintenance window.","reading":"rx_sykes"},"rx_signaller":{"name":"The Signaller","role":"Signalling-centre operator","face":"🚦","badge":"S","legend":"the control panel","hint":"The panel showed a valid green route even while field equipment reported a train on the crossing.","reading":"rx_robinson"},"rx_clerk":{"name":"The Infrastructure Records Clerk","role":"Maintenance and event-records clerk","face":"🗂","badge":"C","legend":"the event archive","hint":"Cabinet access, work-order closeout, and signal transitions all point to one unfinished intervention.","reading":"rx_hall"}},"TOPICS":{"rx_sykes":{"sci":"William Robert Sykes (1840-1917)","topic":"Lock-and-block interlocking","lede":"William Robert Sykes made a signal refuse to clear unless the track and the route agreed that movement was safe.","no":1,"profile":"William Robert Sykes was a British railway signal engineer who helped turn the late Victorian signal box from a place of disciplined judgment into a machine that physically constrained unsafe choices. Early railways relied on telegraph messages, timetables, and the vigilance of signallers. Those practices improved safety, but a tired or hurried operator could still accept a train into an occupied block or set conflicting routes. Sykes developed lock-and-block equipment that linked the block instruments, signals, and route controls so the railway itself enforced the sequence.\n\nThe key idea is interlocking. A signal lever cannot be moved to clear unless points are correctly set, conflicting signals remain at danger, and the next block is available. Once a train is accepted, the mechanism locks out incompatible movements until the train has passed and the track condition resets. The protection is not a warning that an operator may ignore; it is a constraint built into the control path. Later electrical and electronic systems changed the hardware, but retained the same principle: unsafe combinations should be impossible by design.\n\nInterlocks sometimes need maintenance, and railways provide controlled procedures for failures. A temporary release may be used under written authority, with reduced speed, direct confirmation, and prominent records. A hidden jumper is different. It substitutes a permanent clear condition for the evidence the interlock was designed to demand.\n\nAt Marsh Lane, the question is not whether the express driver saw a green aspect; the recorder shows that he did. Sykes directs attention behind the aspect. If an occupied crossing could coexist with a cleared route only because a relay input had been strapped, the final signal was truthful about the circuit it received but false about the railway outside. The person who installed that bridge converted a fail-safe system into a permissive one.","frame":"Opens the relay cabinet and points to a short copper strap across two terminals. “Sykes built locks so one unsafe condition could not simply be wished away. Tell me what this wire defeated.”","q":[{"q":"What distinguishes an interlock from an ordinary warning?","o":[{"t":"It physically prevents conflicting movements until required conditions are met.","v":"expert","fb":"An interlock constrains the control sequence instead of merely advising the operator."},{"t":"It displays several warnings so an operator can compare them before authorizing movement.","v":"partial","fb":"Warnings support judgment, but they do not make an unsafe lever movement impossible."},{"t":"It records train movements after the event but does not affect signal controls.","v":"wrong","fb":"Event recording preserves evidence; it is not the protective lock itself."},{"t":"It assumes a clear route whenever traffic pressure makes delay inconvenient to dispatchers.","v":"danger","fb":"Treating delay as proof of safety reverses the purpose of railway interlocking."}],"clue":{"category":"what","label":"WHAT — lead","text":"The route cleared because a temporary copper strap made the interlock read “safe” without proving the crossing was empty."}},{"q":"Under what condition may a failed interlock be temporarily released safely?","o":[{"t":"Whenever a signaller verbally confirms that no train appears on the panel.","v":"partial","fb":"Panel observation alone may repeat the same failed indication and needs independent confirmation."},{"t":"Only under a controlled procedure with authority, alternate checks, and limits.","v":"expert","fb":"A sanctioned release replaces one barrier with documented compensating protections."},{"t":"After the first delayed service has passed through without an incident.","v":"wrong","fb":"A successful movement does not validate a bypass or prove the route was safe."},{"t":"Whenever the failed device is believed more troublesome than the traffic risk.","v":"danger","fb":"Operational inconvenience cannot substitute for a safety assessment and authority."}],"clue":{"category":"who","label":"WHO — lead","text":"The bypass was fitted during a maintenance call by the technician assigned to the crossing relay, not by the driver or inspector."}},{"q":"What does Sykes’s principle imply when a green signal coexists with an occupied crossing?","o":[{"t":"Investigators should begin by testing whether the driver reacted quickly enough.","v":"partial","fb":"Driver response matters, but it cannot explain why an unsafe route was authorized."},{"t":"Investigators should assume the signal lamp changed color after the collision.","v":"wrong","fb":"Lamp damage after impact cannot account for the recorded pre-collision command state."},{"t":"Investigators should trace which locked condition was falsely satisfied upstream.","v":"expert","fb":"A cleared aspect is the end of a logic chain; the false premise must be located inside it."},{"t":"Investigators should treat the green aspect as proof the crossing was empty.","v":"danger","fb":"Trusting the output without testing its inputs is exactly how a defeated interlock escapes notice."}],"clue":{"category":"where","label":"WHERE — lead","text":"The contradictory safe indication was generated inside the signal-box relay chain, where the occupied input had been bridged."}}]},"rx_robinson":{"sci":"William Robinson (1840-1921)","topic":"The closed track circuit","lede":"William Robinson made a train announce its own presence by using its wheels and axles to complete an electrical circuit.","no":2,"profile":"William Robinson was an American inventor whose track circuit became one of railway signalling’s foundational safety devices. Before reliable train detection, a signalman learned that a block was clear through messages and observation. A forgotten wagon, a separated train, or poor visibility could defeat that human chain. Robinson patented practical electrical track circuits in the 1870s, using the rails as conductors and the train’s metal wheels and axles as the detecting element.\n\nIn a common arrangement, a relay is energized when the track is unoccupied. When a train enters, its wheelsets shunt current between the rails, causing the relay to drop and the signal system to display occupation. This “normally energized” design is fail-safe in an important sense: a broken wire, loss of power, or failed relay tends to mimic an occupied track and hold signals at danger. Safety comes from requiring healthy current for permission, not from requiring a special current to announce danger.\n\nTrack circuits are imperfect. Rust, contamination, insulated joints, wiring faults, or light vehicles can interfere with shunting. That is why technicians test relay currents, bonding, insulation, and correspondence between field occupation and panel indication. A bypass that holds the relay energized is especially serious because it changes a cautious failure into a false-clear condition.\n\nThe Marsh Lane event left a clean sequence. The stopped train’s axles occupied the crossing and the field circuit dropped as designed. Yet the control system continued to receive an energized input beyond a maintenance terminal. Robinson’s circuit therefore did not fail to see the train; its honest occupied state was intercepted. The distinction narrows both mechanism and location. A bomb on the line would not create a stable false-clear before impact, and a driver cannot alter a relay cabinet miles ahead. The evidence belongs in the signal chain between the rails and the panel.","frame":"Clips a meter across the rails, then compares it with the relay-room trace. “The train shunted the track exactly as Robinson intended. Something farther along refused to listen.”","q":[{"q":"Why are many track circuits designed with an energized relay for a clear track?","o":[{"t":"The relay supplies traction current directly to locomotives inside the section.","v":"wrong","fb":"Track detection and traction power are separate railway systems."},{"t":"A clear state remains latched even when electrical evidence disappears unexpectedly.","v":"danger","fb":"Latching clear after evidence vanishes defeats the fail-safe direction of the design."},{"t":"The energized relay makes trains move faster through blocks with heavy traffic.","v":"partial","fb":"Traffic capacity is not the reason the detection relay is normally energized."},{"t":"Loss of power or a broken wire then tends to produce the safer occupied state.","v":"expert","fb":"Requiring healthy energy for permission makes common electrical failures restrictive."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"Field current dropped under the stopped train, but a downstream bridge continued presenting an energized clear input."}},{"q":"Which test best separates a failed track circuit from a bypassed indication?","o":[{"t":"Compare field relay state with the corresponding input at each downstream stage.","v":"expert","fb":"Stage-by-stage correspondence testing identifies where a truthful state becomes falsified."},{"t":"Accept the control panel as the authoritative state and disregard field readings.","v":"danger","fb":"The panel is one endpoint of the system and may display the very error under investigation."},{"t":"Inspect the locomotive brakes and estimate whether it could have stopped sooner.","v":"partial","fb":"Braking analysis addresses collision severity, not the origin of a false-clear indication."},{"t":"Count passengers on the stopped train to confirm the crossing was occupied.","v":"wrong","fb":"Passenger count cannot locate an electrical contradiction in the signalling chain."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"Measurements agree that occupation was detected at the rails and contradicted only after the signal-box maintenance terminals."}},{"q":"What evidence most directly rules out the express driver as the source of the false clear?","o":[{"t":"A professional driver is unlikely to err while the signal system is operating.","v":"danger","fb":"Professional experience does not make human error impossible; the electronic evidence does the separating here."},{"t":"Fixed signalling issued the green command before the express reached the approach.","v":"expert","fb":"Timing and command provenance separate the driver’s response from the system’s authorization."},{"t":"The driver had a long service record without a previous signal overrun.","v":"partial","fb":"Prior performance affects context but cannot establish the cause of this command."},{"t":"The locomotive horn sounded normally as it approached the crossing.","v":"wrong","fb":"Horn use has no bearing on how the signal aspect was created."}],"clue":{"category":"who","label":"WHO — corroboration","text":"The signal command was generated before the express arrived, while the relay-cabinet access log records a maintenance intervention."}}]},"rx_hall":{"sci":"Thomas S. Hall (1827-1880)","topic":"Automatic railway signalling","lede":"Thomas Hall helped make signals respond automatically to track conditions instead of waiting for every human message.","no":3,"profile":"Thomas Seavey Hall was an American inventor associated with early automatic railway signalling in the nineteenth century. Railways were expanding faster than operators could safely manage by timetable and hand signals alone. Hall developed electrical systems in which a train’s presence influenced signals automatically, helping establish the idea that the track should communicate its condition directly to following traffic.\n\nAutomatic signalling does not remove people from responsibility. It changes where responsibility lies. Engineers define the logic, technicians maintain correspondence between field devices and indications, and operators respond to the aspects presented. The system is valuable because it closes the time gap between a train entering a block and a warning being issued. It also creates records: relay transitions, aspect commands, acknowledgments, and maintenance actions can be aligned into a timeline.\n\nA useful safety principle is independence. The device detecting occupation should not be casually overridden by the same pressure that wants a route cleared. When a fault must be worked around, a second check—direct communication, physical protection, reduced speed, or possession of the track—must replace the lost automatic barrier. Otherwise automation becomes theatre: the panel looks orderly while the evidence it displays has been manufactured.\n\nHall’s lesson completes the Marsh Lane chain. The crossing circuit changed to occupied, the signal logic should have held the express, and the driver obeyed the aspect actually shown. The decisive records are not dramatic. They are a maintenance login, a jumper noted as temporary, repeated false-clear tests, and no compensating operating restriction. Together they point to the technician who left the bridge in place after the repair window. The crash occurred at the crossing, but the unsafe permission culminated in the signalling centre’s relay and event record, where automatic protection had been converted into an automatic lie.","frame":"Aligns relay transitions, panel commands, and maintenance logins on one timeline. “Automatic does not mean ownerless. Someone changed what the machine was allowed to believe.”","q":[{"q":"What is the main safety advantage of automatic block signalling?","o":[{"t":"The system may continue showing clear until a human confirms every equipment failure.","v":"danger","fb":"Waiting for confirmation while retaining clear is the unsafe direction for a protection system."},{"t":"Signals can be cleared more quickly whenever the timetable begins running late.","v":"partial","fb":"Capacity can improve, but safety depends on accurate restrictive response rather than speed."},{"t":"Track conditions can restrict following movements without waiting for manual reports.","v":"expert","fb":"Automatic restriction shortens the delay between occupation and protection."},{"t":"Locomotives receive mechanical steering commands directly from signal lamps.","v":"wrong","fb":"Rail signals authorize movement; they do not steer trains mechanically."}],"clue":{"category":"where","label":"WHERE — decisive","text":"The event recorder in the signalling centre preserves occupation, bypass, and clear-command transitions in one synchronized chain."}},{"q":"What compensating measure is required when automatic train detection is deliberately unavailable?","o":[{"t":"A note should be left for the next maintenance shift to inspect the device.","v":"partial","fb":"A future note does not protect trains moving through the present failure."},{"t":"The timetable should be revised so trains arrive at wider scheduled intervals.","v":"wrong","fb":"Timetable spacing cannot guarantee that a crossing or block is physically clear."},{"t":"Normal running may continue if staff believe the failed indication is usually correct.","v":"danger","fb":"Belief in an unreliable indication is not a compensating control."},{"t":"An independent check and operating restriction must replace the lost barrier.","v":"expert","fb":"Removing a safety layer requires a real substitute that controls movement during the outage."}],"clue":{"category":"what","label":"WHAT — decisive","text":"No reduced speed, direct crossing confirmation, or track possession replaced the strapped-out interlock."}},{"q":"Which record most directly identifies responsibility for leaving the unsafe state in service?","o":[{"t":"The access log, work order, and closeout entry converge on one maintainer.","v":"expert","fb":"Converging maintenance records tie the physical alteration and its unresolved closeout to the actor."},{"t":"The driver’s route card lists the express schedule and assigned locomotive.","v":"wrong","fb":"A route card provides operating context but no evidence of relay modification."},{"t":"The infrastructure manager is responsible because the system belongs to that office.","v":"danger","fb":"Organizational authority alone should not replace evidence about the specific intervention."},{"t":"The signaller’s shift roster shows who watched the panel during the collision.","v":"partial","fb":"Panel duty explains who saw the result, not who created the false input."}],"clue":{"category":"who","label":"WHO — decisive","text":"The same technician’s credential opened the cabinet, recorded the temporary strap, and closed the job without removing it."}}]}},"story":["<b>An express entered Marsh Lane on a green signal while another train still occupied the crossing.<\/b>","S&T Tech Mara Doss knows the relay cabinet. The Signaller holds the panel timeline. The records clerk can join access, work orders, and aspect commands.","The possibilities are a planted obstruction, a driver who ignored a stop signal, or an automatic protection system made to report a condition that was not true.","Nine clues reconstruct how an occupied rail became a cleared route and who left that contradiction in service."],"endings":{"overclaimWhat":"rx_sabotage","dismissalWhat":"rx_driver","win":{"expertTitle":"The False Clear","expert":["You connect Mara Doss, the Signal-Box Relay & Event Recorder, and a maintenance bypass that falsely cleared an occupied crossing. Field detection worked; the bridge defeated the correspondence before the green command was issued.","No obstruction was planted on the line, and the driver did not pass a red aspect. The unsafe act was the temporary interlock strap left in service without any compensating restriction."],"soundTitle":"The Bypassed Interlock","sound":["Your accusation identifies the technician, the relay chain, and the false-clear mechanism.","Some maintenance details remain incomplete, but the field-to-panel contradiction supports the verdict."],"namedTitle":"Correct Route, Limited Record","named":["You select the correct WHO, WHERE, and WHAT.","The conclusion is sound, although missed clues leave parts of the access or closeout timeline unproved."]},"overclaim":{"title":"No Obstruction Created the Green Signal","body":["The crossing circuit registered the stopped train before impact, and no explosive or placed object explains the stable false-clear command.","The evidence follows a bridged relay input inside the signalling chain rather than sabotage on the railway."]},"dismissal":{"title":"The Driver Followed the Displayed Aspect","body":["The event recorder shows a green command before the express entered the approach, and cab evidence matches that display.","Driver error cannot explain why occupied track was represented as clear."]},"wrongNames":{"title":"The Mechanism, Misassigned","body":["You recognize a defeated interlock but place responsibility or culmination away from the maintenance intervention and relay record that created the false permission."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"t_pipeline","title":"The Brant Hollow Pipeline","discipline":"Pipeline Integrity & Fluid Mechanics","venue":"the Brant Hollow pipeline inquiry","agent":{"name":"Investigator Rhea Colton","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Fluid-Flow & Corrosion Pioneers","dossierName":"FLUID-FLOW & CORROSION PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Brant Hollow pipeline inquiry","DAYS_TOTAL":3,"teaser":"A gas pipeline ruptures beneath a residential block. Did a contractor strike the line, did corrosion escape the integrity program, or did the ground itself split an otherwise sound pipe?","overclaimTag":"external excavation damage at the rupture site","truthTag":"a third-party excavator struck a sound pipeline","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A buried gas pipeline with localized wall loss and a rupture\"><path d=\"M40 70 H620\" stroke=\"#121212\" stroke-width=\"12\" stroke-linecap=\"round\"/><path d=\"M40 70 H620\" stroke=\"#e2e2d8\" stroke-width=\"4\"/><path d=\"M350 52 l-12 18 12 18 12-18z\" fill=\"#B3261E\"/><path d=\"M330 42 q20 -18 40 0 M324 98 q26 18 52 0\" fill=\"none\" stroke=\"#326891\" stroke-width=\"2\"/><path d=\"M80 25 v25 M160 25 v25 M500 25 v25 M580 25 v25\" stroke=\"#121212\" stroke-width=\"2\"/><\/svg>","overclaimTease":"The vivid external-damage theory is not automatically an overreaction. Let wall morphology, pressure timing, prior inspection coverage, and excavation records decide whether the dramatic answer is the correct one.","CATS":{"who":{"title":"Who is behind it","truth":"excavator","items":[{"id":"controller","label":"The gas-control dispatcher"},{"id":"excavator","label":"Morrow Excavation — the third-party contractor"},{"id":"operator","label":"Hollis Trask — pipeline integrity operator"}]},"where":{"title":"Where it culminates","truth":"rightofway","items":[{"id":"control","label":"The Gas Control Center"},{"id":"office","label":"The Operator’s Integrity Office"},{"id":"rightofway","label":"The Right-of-Way & Excavation Site"}]},"what":{"title":"What happened","truth":"thirdparty","items":[{"id":"thirdparty","label":"Third-party excavation damage opened the pipeline wall"},{"id":"corrosion","label":"Progressive wall loss passed a cancelled inspection window"},{"id":"freak","label":"Sudden ground movement split an otherwise sound pipeline"}]}},"READING_ORDER":["patrol","dispatch","clerk"],"CHARACTERS":{"patrol":{"name":"Line-Walker Dumas","role":"Pipeline patroller","face":"🚶","badge":"P","legend":"the right-of-way","hint":"The excavated pipe carries a fresh tooth gouge and local dent without old scale at the opening.","reading":"pp_wagner"},"dispatch":{"name":"The Dispatcher","role":"Gas-control dispatcher","face":"🖥️","badge":"D","legend":"the control center","hint":"The pressure trace shows an abrupt opening first and system response afterward, not a leak growing from internal weakness.","reading":"pp_joukowsky"},"clerk":{"name":"The Right-of-Way Records Clerk","role":"Excavation and integrity records clerk","face":"🗂","badge":"C","legend":"the permit desk","hint":"Locate tickets, equipment GPS, and supervisor messages place one contractor over the line after marks were visible.","reading":"pp_firestone"}},"TOPICS":{"pp_wagner":{"sci":"Carl Wagner (1901-1977)","topic":"Oxidation & corrosion theory","lede":"Carl Wagner explained corrosion as coupled movement of ions and electrons through growing films, turning rust into a transport process with a history.","no":1,"profile":"Carl Wagner was a German physical chemist whose theories reshaped the study of oxidation, solid-state reactions, and electrochemistry. Rather than treating an oxide scale as inert debris, he analyzed how charged species move through it. Metal ions, oxygen ions, electrons, and defects can migrate across a film, allowing oxidation to continue even after the fresh metal is no longer directly exposed to air. His work helped explain why many oxide layers grow with parabolic kinetics: as the film thickens, transport becomes slower, so growth continues but at a declining rate.\n\nPipeline corrosion is not identical to high-temperature oxidation, yet Wagner’s transport logic remains useful. Corrosion requires an electrochemical circuit: anodic regions dissolve metal, cathodic reactions consume electrons, and an electrolyte carries ionic current. Coatings and cathodic protection are intended to interrupt that circuit. A coating holiday, trapped moisture, disbondment, soil chemistry, or inadequate protection can localize attack. The outside surface may develop deep pits while most of the circumference looks sound.\n\nThat localization matters for evidence. A third-party strike tends to leave deformation, gouging, metal displacement, or fresh mechanical marks. Corrosion leaves wall-thickness loss, scale, rounded pits, and a history that can be compared with coating surveys and protection readings. Ground movement may bend or buckle a line, producing a different fracture geometry.\n\nWagner’s corrosion theory gives investigators a morphology to seek: scale, rounded pits, coating disbondment, and wall loss with electrochemical history. Brant Hollow shows something else at the opening—a fresh linear gouge, displaced metal, tooth spacing, and a dent matching excavation equipment. Nearby pipe retains adequate wall thickness and protective coating. Corrosion remains a plausible institutional story in many ruptures, but its expected material record is absent at this origin.","frame":"Sets a fresh tooth-gouged pipe section beside a scaled corrosion coupon. “Both remove metal, but only one bends and transfers it in an instant. Tell me which surface you see.”","q":[{"q":"What is central to Wagner’s view of oxide growth?","o":[{"t":"Rust forms mainly where a fresh mechanical strike exposes bright metal to air.","v":"wrong","fb":"Mechanical damage can initiate corrosion, but electrochemical transport can continue without a new strike."},{"t":"An oxide layer grows at one fixed rate regardless of thickness or environment.","v":"partial","fb":"Growth often slows as transport distance increases and conditions change."},{"t":"A skilled saboteur can imitate any corrosion pattern by applying acid after failure.","v":"danger","fb":"Speculation cannot replace pit geometry, scale history, and pre-event survey evidence."},{"t":"Ions and electrons move through a film, allowing reaction to continue beneath it.","v":"expert","fb":"Transport through the scale explains how oxidation can progress without bare metal remaining exposed."}],"clue":{"category":"what","label":"WHAT — lead","text":"The opening has a sharp fresh tooth gouge rather than scaled pits or broad wall thinning."}},{"q":"Why can localized pitting be dangerous even when most pipe looks sound?","o":[{"t":"A deep pit can leave too little wall to contain normal internal pressure.","v":"expert","fb":"Pressure capacity depends on the minimum remaining wall, not the average appearance of the pipe."},{"t":"Pits matter after they cover more than half the pipe circumference.","v":"wrong","fb":"A single severe local flaw can govern failure before broad corrosion develops."},{"t":"Any visible rust means the pipeline is already leaking at that spot.","v":"partial","fb":"Rust warrants assessment, but leakage depends on remaining wall and crack formation."},{"t":"Localized corrosion indicates a chemical attacker chose the rupture point.","v":"danger","fb":"Electrochemical cells naturally localize attack without deliberate targeting."}],"clue":{"category":"who","label":"WHO — lead","text":"The gouge spacing matches equipment assigned to one third-party contractor working inside the marked corridor."}},{"q":"Which pipe feature most favors fresh excavation damage over corrosion?","o":[{"t":"Rounded pits beneath scale and a broad region of reduced wall thickness.","v":"partial","fb":"Pits and scale would instead indicate an electrochemical history."},{"t":"A coating holiday beside wet soil and low cathodic-protection readings.","v":"wrong","fb":"Those conditions support corrosion risk rather than a new strike."},{"t":"A sharp tooth gouge with displaced bright metal and matching local dent.","v":"expert","fb":"Fresh deformation and tooth geometry are direct mechanical-contact signatures."},{"t":"Uniform thinning around the pipe circumference over a long distance.","v":"danger","fb":"Long uniform loss does not match a localized excavator contact."}],"clue":{"category":"where","label":"WHERE — lead","text":"Fresh deformation, displaced metal, and equipment tracks begin at the active excavation cut on the right-of-way."}}]},"pp_joukowsky":{"sci":"Nikolai Joukowsky (1847-1921)","topic":"Water hammer & pressure surge","lede":"Nikolai Joukowsky measured how a rapid change in flow launches a pressure wave through a pipe, giving investigators a signature for sudden hydraulic events.","no":2,"profile":"Nikolai Joukowsky, also transliterated Zhukovsky, was a Russian scientist whose work helped found modern aerodynamics and fluid mechanics. He studied the transient pressure waves produced when flowing liquid is stopped or redirected rapidly. The Joukowsky equation relates the pressure change to fluid density, wave speed, and the change in velocity. A fast valve closure can therefore create a sharp surge—water hammer—that travels through a pipeline and reflects from boundaries.\n\nGas pipelines are compressible systems and require models more elaborate than the classic liquid equation, but the investigative idea carries over. Sudden changes leave transient signatures. A control action, compressor trip, or rapid isolation produces a pressure wave with timing that can be followed across sensors. By contrast, a small leak may first cause a gradual imbalance between inlet and outlet flow, followed by a larger pressure collapse when the remaining wall tears open.\n\nA dispatcher’s screen can be misleading if viewed only at the moment of alarm. Historians reconstruct synchronized data from several stations, checking sensor clocks, valve positions, flow rates, and pressure derivatives. They also ask whether the transient occurred before the rupture and could have caused it, or after the ruptu

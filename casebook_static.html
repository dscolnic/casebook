re as a consequence. Sequence is more probative than peak magnitude alone.\n\nJoukowsky’s timing separates cause from response. At Brant Hollow, a sharp flow imbalance and pressure collapse begin at the moment excavation telemetry places the machine over the line; valve movement and later oscillations follow. There is no preceding pressure surge capable of opening the wall and no gradual leak signature. The control center records the hydraulic consequence, while the right-of-way supplies the initiating contact.","frame":"Freezes the SCADA replay at the first abrupt imbalance. “The opening must come before the system response if a machine struck the line. Put every signal in order.”","q":[{"q":"What does the classic Joukowsky relation connect?","o":[{"t":"Corrosion depth to soil resistivity, coating age, and cathodic current.","v":"partial","fb":"Those variables belong to integrity assessment rather than transient hydraulics."},{"t":"Pressure change to fluid density, wave speed, and change in velocity.","v":"expert","fb":"The relation quantifies the surge generated by a rapid flow change in a pipe."},{"t":"Explosion force to pipe diameter, burial depth, and ignition temperature.","v":"wrong","fb":"Combustion effects are separate from the pressure-wave relation."},{"t":"Sabotage probability to the number of valves an intruder could reach.","v":"danger","fb":"Joukowsky’s equation diagnoses hydraulic transients, not malicious access."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"Pressure containment fails abruptly before valve action, with no prior leak trend or initiating surge."}},{"q":"Why must investigators compare event timing rather than only peak pressure?","o":[{"t":"The largest pressure value identifies which employee made the mistake.","v":"wrong","fb":"Magnitude does not assign authority or even establish causal order."},{"t":"Any pressure oscillation indicates the dispatcher closed a valve too quickly.","v":"danger","fb":"Ruptures and automatic responses also generate transients; valve action must be timed."},{"t":"Timing matters mainly when sensors at each station use different units.","v":"partial","fb":"Clock alignment matters even with consistent units because causal ordering depends on seconds."},{"t":"A surge can cause failure only if the pressure wave precedes the opening.","v":"expert","fb":"A peak recorded after rupture may be a consequence or reflection rather than the initiating cause."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"The control trace locates the opening to the same segment where the contractor’s machine stopped and reversed."}},{"q":"Which pressure sequence best fits a machine opening the pipe?","o":[{"t":"An abrupt local flow imbalance and collapse, with valve response afterward.","v":"expert","fb":"The sudden opening must precede the protective system’s hydraulic response."},{"t":"A long slow leak trend that accelerates over several monitoring periods.","v":"partial","fb":"A long trend would better fit progressive wall deterioration."},{"t":"A large pressure wave arriving before any loss of line containment.","v":"wrong","fb":"A preceding wave would make surge the initiating mechanism."},{"t":"Stable measurements until ground movement bends several stations at once.","v":"danger","fb":"Broad simultaneous bending would support ground movement rather than contact."}],"clue":{"category":"who","label":"WHO — corroboration","text":"Machine GPS and a one-call ticket place that contractor directly over the pipeline when containment is first lost."}}]},"pp_firestone":{"sci":"Floyd Firestone (1898-1986)","topic":"Ultrasonic flaw detection","lede":"Floyd Firestone used reflected sound pulses to locate hidden cracks and voids, making internal damage visible without cutting a component apart.","no":3,"profile":"Floyd Alburn Firestone was an American physicist and engineer who developed an early practical pulse-echo method for ultrasonic nondestructive testing. In patents filed around 1940, he described sending short high-frequency sound pulses into a solid and receiving echoes from internal boundaries. A sound part produces an echo from its far surface. A crack, void, or inclusion reflects part of the pulse sooner. Measuring the travel time allows an inspector to estimate the flaw’s position.\n\nThe instrument became known as the supersonic reflectoscope. Its principle resembles sonar on a much smaller scale: transmit, listen, and convert time into distance using the material’s sound speed. Coupling between the probe and surface matters, as do calibration blocks, probe angle, component geometry, and interpretation. A weak or missed echo does not automatically mean no flaw; inspection coverage and procedure determine what could have been found.\n\nModern inline inspection tools use several technologies, including magnetic-flux leakage and ultrasonic methods, to estimate metal loss, cracks, and geometry while traveling through a pipeline. Their value is temporal. They can identify a flaw while the pipe still holds pressure, allowing repair or closer monitoring before the remaining wall reaches failure. Cancelling a run does not merely postpone data collection; it extends the interval during which an existing defect can grow unseen.\n\nFirestone’s inspection logic can also clear a system when coverage is complete. The latest inline run examined the eventual site, reported adequate wall, and its raw data remain consistent with the recovered segment. The new gouge was created after that examination. Locate markings, permit boundaries, equipment GPS, and supervisor messages then identify a third-party contractor that continued digging across the marked corridor. Here the external strike is not a convenient rumor; it is the only hypothesis that joins fresh metal, timing, and access.","frame":"Overlays a complete prior inspection pass with equipment GPS and locate marks. “A clean covered segment can still be damaged tomorrow. Separate missed detection from new contact.”","q":[{"q":"How does pulse-echo ultrasonic testing locate an internal flaw?","o":[{"t":"It measures how quickly surface rust changes color under ultraviolet light.","v":"wrong","fb":"That may characterize surface conditions but cannot locate a hidden internal reflector."},{"t":"It raises pressure until the weakest wall section bursts during a controlled test.","v":"danger","fb":"Destructive proof defeats the purpose of nondestructive inspection and may create the failure."},{"t":"It times an early reflected sound pulse from a boundary inside the material.","v":"expert","fb":"Travel time and sound speed place the reflector before the expected back-wall echo."},{"t":"It compares the component’s total weight with its original manufacturing record.","v":"partial","fb":"Weight can reveal gross loss but lacks the location and resolution of ultrasonic echoes."}],"clue":{"category":"what","label":"WHAT — decisive","text":"A fully covered earlier inspection found adequate wall; the new mechanical contact occurred afterward and opened the line."}},{"q":"Why is inspection coverage part of interpreting a “clean” result?","o":[{"t":"Any completed tool run assures the line has no defect anywhere in the pipeline.","v":"danger","fb":"No inspection method has unlimited sensitivity or coverage."},{"t":"A tool excludes just the flaws its route, sensors, and procedure could examine.","v":"expert","fb":"Detection claims depend on validated capability and complete coverage of the relevant region."},{"t":"Coverage matters after a pipe has already ruptured and been excavated.","v":"wrong","fb":"Coverage is essential before failure because it defines what the inspection could detect."},{"t":"A missed segment can be assumed identical to the nearest inspected segment.","v":"partial","fb":"Neighboring data may inform risk, but it cannot substitute for examining the uninspected location."}],"clue":{"category":"where","label":"WHERE — decisive","text":"Locate marks, machine position, gouge geometry, and rupture origin converge at the Right-of-Way & Excavation Site."}},{"q":"Which joined record most directly identifies the outside actor?","o":[{"t":"The operator’s inspection schedule and cathodic-protection review history.","v":"partial","fb":"Integrity records test corrosion but do not identify the fresh contact."},{"t":"The dispatcher’s valve commands after the first rupture alarm arrived.","v":"wrong","fb":"Response commands follow the opening and do not create the gouge."},{"t":"The regulator’s later enforcement notice issued after the neighborhood fire.","v":"danger","fb":"Post-event enforcement documents consequences rather than the initiating actor."},{"t":"Locate marks, equipment GPS, gouge geometry, and the supervisor’s dig order.","v":"expert","fb":"Access, machine position, physical match, and instruction converge on the contractor."}],"clue":{"category":"who","label":"WHO — decisive","text":"A supervisor message orders digging to continue across visible locate marks, and the same crew’s bucket carries matching metal transfer."}}]}},"story":["<b>Brant Hollow’s rupture looked like the end of a long integrity failure—and like the result of one excavator’s mistake.<\/b>","Line-Walker Dumas can read the recovered wall. The Dispatcher holds the millisecond pressure sequence. The Right-of-Way Records Clerk can join permits, locate marks, and equipment movement.","Corrosion, ground movement, and fresh third-party damage each leave different metal and timing.","The nine clues must determine whether the external-strike theory is a convenient accusation or the event the evidence actually records."],"endings":{"overclaimWhat":"corrosion","dismissalWhat":"freak","win":{"expertTitle":"The Bucket Tooth at Brant Hollow","expert":["You connect Morrow Excavation, the Right-of-Way & Excavation Site, and a third-party strike that opened a sound pipeline. Fresh gouging, machine GPS, locate marks, and pressure timing form one sequence.","The corrosion theory is the tempting systemic allegation, but prior coverage and recovered wall reject it. Ground movement cannot reproduce the tooth geometry or contractor access trail."],"soundTitle":"The Excavation Strike","sound":["Your accusation identifies the contractor, the right-of-way, and fresh mechanical damage.","Some equipment or inspection details remain incomplete, but the joined physical and timing evidence supports the verdict."],"namedTitle":"Right Strike, Thin Access Record","named":["You choose the correct actor, location, and mechanism.","The conclusion is right, though missed clues leave portions of the GPS, locate, or morphology chain incomplete."]},"overclaim":{"title":"The Systemic Corrosion Story Was Wrong Here","body":["The prior inline examination covered the site, and the recovered wall outside the gouge retains adequate thickness.","A familiar management-failure pattern should not override fresh mechanical evidence."]},"dismissal":{"title":"The Ground Did Not Shape a Bucket Tooth","body":["Localized denting, metal transfer, and machine tracking cannot be explained by a broad natural ground shift.","The rupture was sudden but directly traceable to human excavation."]},"wrongNames":{"title":"The Strike, Assigned Elsewhere","body":["You recognize external damage but misidentify the contractor or move the initiating contact away from the active excavation site."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"t_transformer","title":"The Aldergate Substation Fire","discipline":"Power Engineering & Dielectrics","venue":"the Aldergate substation inquiry","agent":{"name":"Investigator Emun Halle","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Power & Dielectric Pioneers","dossierName":"POWER & DIELECTRIC PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Aldergate substation inquiry","DAYS_TOTAL":3,"teaser":"A power transformer burns and the city goes dark. Did someone attack the yard, did chronic overheating age the insulation to failure, or did a direct lightning impulse exceed the protection and insulation level of an otherwise serviceable unit?","overclaimTag":"deliberate damage in the substation yard","truthTag":"a direct lightning impulse beyond the protected level","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A transformer tank, control traces, and an internal electrical breakdown\"><rect x=\"95\" y=\"32\" width=\"180\" height=\"78\" rx=\"7\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M125 52 h120 M125 72 h120 M125 92 h120\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><path d=\"M360 24 v92 M410 24 v92 M360 50 h50 M360 88 h50\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M455 28 l-18 34 h22 l-15 38 44-50 h-24 l18-22z\" fill=\"#B3261E\"/><path d=\"M530 102 C555 75,585 80,610 48\" fill=\"none\" stroke=\"#326891\" stroke-width=\"2\"/><\/svg>","overclaimTease":"The last flash can resemble sabotage or the end of a long decline. Compare pre-event loading and oil history with arrester records, lightning location, and the first electrical waveform.","CATS":{"who":{"title":"Who bears responsibility","truth":"lightning","items":[{"id":"lightning","label":"An act of nature — a lightning strike, not a person"},{"id":"engineer","label":"The substation protection engineer"},{"id":"operator","label":"Bram Odell — utility asset operator"}]},"where":{"title":"Where it culminates","truth":"yard","items":[{"id":"relay","label":"The Relay & Control House"},{"id":"yard","label":"The Substation Yard & Transformer"},{"id":"office","label":"The Utility Asset Office"}]},"what":{"title":"What happened","truth":"freak","items":[{"id":"attack","label":"Deliberate physical damage initiated the transformer fire"},{"id":"overload","label":"Long overheating degraded insulation until it broke down"},{"id":"freak","label":"A direct lightning impulse exceeded the protected insulation level"}]}},"READING_ORDER":["subop","oiltech","clerk"],"CHARACTERS":{"subop":{"name":"Operator Nkemi","role":"Substation operator","face":"⚡","badge":"N","legend":"the transformer yard","hint":"Months of loading and temperatures remained inside the approved band before a single high-amplitude impulse arrived.","reading":"tx_hopkinson"},"oiltech":{"name":"The Oil Technician","role":"Insulating-oil technician","face":"🧪","badge":"O","legend":"the oil laboratory","hint":"Sequential pre-event oil samples were stable and lacked the rising fault-gas trend expected from chronic internal damage.","reading":"tx_paschen"},"clerk":{"name":"The Asset Records Clerk","role":"Maintenance records clerk","face":"🗂","badge":"C","legend":"the asset office","hint":"Lightning location, arrester discharge, bushing flashover, and relay timing align at the transformer yard without an unauthorized entry.","reading":"tx_stefan"}},"TOPICS":{"tx_hopkinson":{"sci":"John Hopkinson (1849-1898)","topic":"Magnetic circuits & transformer theory","lede":"John Hopkinson gave engineers a circuit language for magnetic flux, making transformer loading and core behavior calculable rather than mysterious.","no":1,"profile":"John Hopkinson was a British electrical engineer and physicist who helped place the rapidly developing machinery of the late nineteenth century on a rigorous analytical foundation. He studied dynamos, alternating-current systems, and transformers at a moment when electrical power was moving from laboratory demonstration to public infrastructure. His name is attached to Hopkinson’s law, an analogy between an electric circuit and a magnetic circuit. Magnetomotive force drives magnetic flux through reluctance much as voltage drives current through resistance.\n\nThe analogy is not perfect, because iron is nonlinear and can saturate, but it lets designers reason about cores, windings, air gaps, and flux density. In a transformer, alternating current in the primary creates changing magnetic flux that induces voltage in the secondary. Load current produces copper losses proportional to current squared, while magnetic behavior contributes core losses. The resulting heat must be carried away through oil, radiators, and the tank. Operating above rating does not guarantee immediate failure; it accelerates insulation ageing and narrows the margin for another fault.\n\nHopkinson also investigated transformer theory directly, considering continuous iron magnetic circuits and the relationships among turns, current, resistance, and induction. His work helped engineers separate ordinary energy conversion from abnormal magnetic and thermal conditions.\n\nHopkinson’s framework makes chronic loading testable rather than rhetorical. Aldergate’s current, cooling, and temperature series remain within the approved operating band, with no sustained hot-spot pattern before the event. The first abnormal record is a steep external impulse coincident with a nearby lightning channel. Overload can certainly age a transformer, but the necessary thermal history is absent here. The physical culmination is the yard unit and its line entrance, not the asset office.","frame":"Pins a year of normal load and hot-spot curves beside one towering impulse waveform. “Chronic heat leaves a history. A lightning event leaves a beginning.”","q":[{"q":"What does Hopkinson’s magnetic-circuit analogy compare?","o":[{"t":"Magnetomotive force, flux, and reluctance to voltage, current, and resistance.","v":"expert","fb":"The analogy provides a practical language for calculating magnetic paths in transformer cores."},{"t":"Transformer oil pressure, flow, and temperature to a municipal water network.","v":"partial","fb":"Cooling hydraulics matter, but Hopkinson’s named analogy concerns magnetic rather than fluid circuits."},{"t":"Lightning current, ground resistance, and blast pressure inside a substation.","v":"wrong","fb":"Those variables describe surge protection and physical effects, not the magnetic-circuit relation."},{"t":"An attacker’s energy, access time, and ability to bypass the protective relays.","v":"danger","fb":"The theory analyzes equipment behavior without presuming a malicious actor."}],"clue":{"category":"what","label":"WHAT — lead","text":"Pre-event load and temperature histories lack the sustained heating required for accelerated insulation ageing."}},{"q":"Why does sustained overload damage a transformer even if it keeps supplying power?","o":[{"t":"Extra current permanently magnetizes the core after the first overloaded hour.","v":"wrong","fb":"Core behavior is more complex, and thermal ageing—not permanent magnetization—is the main long-duration concern here."},{"t":"Higher current raises losses and temperature, accelerating insulation ageing.","v":"expert","fb":"A unit can remain in service while heat steadily consumes the life of paper and oil insulation."},{"t":"Overload matters when a lightning strike arrives during the same minute.","v":"danger","fb":"Thermal degradation accumulates independently and can create the conditions for later internal failure."},{"t":"The nameplate rating is merely economic guidance and has no reliability meaning.","v":"partial","fb":"Ratings include thermal and insulation limits, even though short emergency loading may sometimes be managed."}],"clue":{"category":"who","label":"WHO — lead","text":"Operating records show no sustained overload decision or unauthorized yard access before the first impulse."}},{"q":"Which record most strongly argues against chronic thermal ageing?","o":[{"t":"A tank photograph taken after the transformer burned and ruptured.","v":"partial","fb":"Post-fire appearance cannot reconstruct the preceding temperature exposure."},{"t":"An asset-replacement plan listing the unit as older than its neighbors.","v":"wrong","fb":"Calendar age alone does not establish damaging thermal operation."},{"t":"A brief overload occurring after the lightning impulse had already arrived.","v":"danger","fb":"A later overload is consequence or response, not the initiating cause."},{"t":"Months of current, hot-spot temperature, and cooling data within limits.","v":"expert","fb":"A normal pre-event thermal history removes the sustained heating mechanism."}],"clue":{"category":"where","label":"WHERE — lead","text":"The first abnormal waveform and physical flashover occur at the transformer’s line bushing in the substation yard."}}]},"tx_paschen":{"sci":"Friedrich Paschen (1865-1947)","topic":"Gas breakdown & Paschen’s law","lede":"Friedrich Paschen showed that electrical breakdown through a gas depends on both pressure and distance, not voltage alone.","no":2,"profile":"Friedrich Paschen was a German physicist whose experimental work ranged from spectroscopy to electrical discharge. In the late nineteenth century he measured the voltage required to start a discharge between electrodes in a gas while changing the gas pressure and the electrode spacing. The result, known as Paschen’s law, showed that breakdown voltage depends mainly on the product of pressure and gap distance. The curve has a minimum: at some conditions electrons gain enough energy between collisions to ionize more molecules efficiently, creating an avalanche.\n\nThe law corrected a simple intuition that a larger gap or higher pressure must always be safer. If there are too few collisions, an electron cannot build an avalanche; if there are too many, it loses energy before ionizing the next molecule. Between those regimes, breakdown can occur at surprisingly modest voltage. Modern high-voltage insulation involves liquids, solids, interfaces, bubbles, moisture, and complex fields, so Paschen’s law is not a complete transformer model. It remains valuable for understanding why gaseous voids and evolving internal conditions can become weak points.\n\nAn internal discharge leaves traces. Electrical and thermal faults can decompose insulating oil and paper, generating gases that dissolve in the oil. Sequential dissolved-gas analysis can reveal whether gases are rising over time and whether the pattern is more consistent with heating, partial discharge, or arcing. A single post-fire sample is harder to interpret because the final event itself creates gas.\n\nPaschen’s work helps explain how a sufficiently large impulse can cross insulation gaps and initiate flashover even when routine condition monitoring is reassuring. Aldergate’s pre-event dissolved-gas samples are stable rather than progressively rising, while the bushing and arrester records show a sudden high-field event. One post-fire sample cannot manufacture a prior trend. The sequence therefore favors an external lightning impulse over months of hidden internal discharge.","frame":"Arranges stable oil reports beside the bushing flashover and arrester record. “Do not let gases made by the fire invent warnings that were absent before it.”","q":[{"q":"What variables are joined in Paschen’s law for gas breakdown?","o":[{"t":"Oil temperature and transformer current, through their arithmetic average.","v":"partial","fb":"Those variables matter to transformer condition but are not the variables in Paschen’s law."},{"t":"Lightning frequency and grounding resistance, through their peak value.","v":"wrong","fb":"Surge exposure and grounding are separate from the gas-gap relationship Paschen measured."},{"t":"Gas pressure and electrode spacing, combined through their product.","v":"expert","fb":"Breakdown conditions depend on how pressure and distance shape electron collisions and ionization."},{"t":"Attacker distance and explosive mass, through a security-risk score.","v":"danger","fb":"The physical discharge law does not require or diagnose sabotage."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"Sequential oil samples remain stable, while the event begins as one steep external impulse rather than a growing internal fault."}},{"q":"Why can a small gas void become dangerous inside high-voltage insulation?","o":[{"t":"Its pressure and gap can permit an ionizing avalanche at the local field.","v":"expert","fb":"A void can support discharge even when the surrounding bulk insulation remains intact."},{"t":"Gas conducts perfectly at every pressure, so any bubble shorts the winding instantly.","v":"wrong","fb":"Breakdown depends on conditions; a bubble is a risk, not an automatic metallic short."},{"t":"A void indicates someone opened the tank and deliberately injected air inside.","v":"danger","fb":"Voids and gas can arise from ageing, heating, moisture, and material degradation without intrusion."},{"t":"The bubble blocks all electric field and therefore protects the surrounding paper.","v":"partial","fb":"Field stress can concentrate around interfaces rather than disappear."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"Arrester discharge marks and the lightning-location solution align with the same yard entrance within milliseconds."}},{"q":"Which comparison most strongly supports one lightning impulse?","o":[{"t":"Several samples showing a rising combustible-gas trend over many months.","v":"partial","fb":"A rising trend would instead support chronic insulation deterioration."},{"t":"Stable pre-event gas samples followed by arrester discharge and bushing flashover.","v":"expert","fb":"Normal history plus a timed external impulse fits sudden flashover."},{"t":"Repeated requests for closer monitoring after internal partial discharges.","v":"wrong","fb":"Repeated internal warnings would contradict the one-event explanation."},{"t":"A post-fire oil sample containing gases produced during the final blaze.","v":"danger","fb":"After-fire gases cannot identify whether deterioration existed beforehand."}],"clue":{"category":"who","label":"WHO — corroboration","text":"Protection settings, maintenance, oil testing, and loading all meet their approved requirements before the event."}}]},"tx_stefan":{"sci":"Josef Stefan (1835-1893)","topic":"Thermal radiation & temperature","lede":"Josef Stefan found that emitted thermal power rises steeply with absolute temperature, making sustained heat an accelerating warning rather than a neutral condition.","no":3,"profile":"Josef Stefan was an Austrian physicist who worked in Vienna on heat conduction, gas kinetics, electromagnetism, and thermal radiation. In 1879 he examined experimental measurements of radiation from hot bodies and proposed that the energy emitted per unit area rises with the fourth power of absolute temperature. Ludwig Boltzmann later derived the relationship theoretically, and it became the Stefan–Boltzmann law. The law describes an ideal blackbody exactly and real surfaces through an emissivity factor.\n\nA power transformer does not cool by radiation alone. Oil circulation, conduction through materials, and convection through radiators usually carry much of the heat. Still, Stefan’s steep temperature relationship captures an engineering truth: thermal behavior is strongly nonlinear. Higher load creates more electrical loss; hotter oil and windings age insulation faster; damaged insulation can worsen dielectric performance and create additional local heating. Thermal images and long-term temperature records are therefore useful when interpreted alongside load and cooling status.\n\nInsulation ageing is cumulative. Cellulose paper around windings becomes brittle as temperature and chemical degradation progress. Oil oxidizes and can lose dielectric quality. A transformer may survive many periods above normal temperature while its remaining life falls much faster than the calendar suggests. Asset management must distinguish a short, controlled emergency from a chronic operating strategy.\n\nStefan’s thermal law provides the final check on the systemic-overheating theory. Temperature alarms, loading waivers, and cooling records do not show the cumulative heat exposure needed to explain accelerated insulation ageing. By contrast, lightning-location data, arrester discharge, relay onset, and yard damage align within milliseconds. The records leave no culpable operator or engineer below standard; this is a genuine low-probability impulse that exceeded the protected insulation level.","frame":"Aligns lightning-location time, relay onset, and yard damage to the millisecond. “A rare event still needs positive evidence. Show me the channel, not just the flash.”","q":[{"q":"What does the Stefan–Boltzmann law say about ideal thermal emission?","o":[{"t":"Emitted power rises linearly with Celsius temperature above freezing.","v":"wrong","fb":"The law uses absolute temperature and a fourth-power relationship, not a linear Celsius scale."},{"t":"Radiation begins after a surface becomes hot enough to glow visibly red.","v":"partial","fb":"All finite-temperature surfaces emit thermal radiation, including below visible glow."},{"t":"A fire’s brightness directly identifies whether sabotage caused it.","v":"danger","fb":"Thermal emission describes temperature, not motive or initiating cause."},{"t":"Emitted power per area rises with the fourth power of absolute temperature.","v":"expert","fb":"The strong temperature dependence makes thermal emission increase rapidly as an object becomes hotter."}],"clue":{"category":"what","label":"WHAT — decisive","text":"A direct lightning impulse exceeded the protected insulation level of an otherwise serviceable transformer; neither sabotage nor deferred deterioration fits the timeline."}},{"q":"Why is chronic overheating more serious than the calendar time alone suggests?","o":[{"t":"Heat erases earlier fault-gas evidence, making every later sample reassuring.","v":"wrong","fb":"Heating can generate and alter gases; it does not make sequential evidence irrelevant."},{"t":"Once a unit survives one overload, later overloads become progressively safer.","v":"danger","fb":"Survival does not restore consumed insulation life or thermal margin."},{"t":"Higher temperature accelerates chemical ageing of paper and insulating oil.","v":"expert","fb":"Thermal ageing consumes insulation life disproportionately during hot operation."},{"t":"Visible tank discoloration is the main indicator of meaningful insulation degradation.","v":"partial","fb":"Internal paper and oil can age well before obvious external damage appears."}],"clue":{"category":"where","label":"WHERE — decisive","text":"Waveform onset, bushing damage, arrester operation, and channel location converge at the Substation Yard & Transformer."}},{"q":"What joined evidence can clear both sabotage and deferred-maintenance theories?","o":[{"t":"No entry or thermal trend, plus a timed lightning channel and arrester operation.","v":"expert","fb":"Independent absence and positive impulse evidence test both competing stories."},{"t":"A security camera gap and a replacement delay in the same maintenance year.","v":"partial","fb":"Two suspicious facts do not establish either initiating mechanism."},{"t":"One eyewitness reporting a bright flash before the substation fire spread.","v":"wrong","fb":"A flash is expected in several electrical failures and lacks discrimination."},{"t":"The regulator’s assurance that lightning is common in the surrounding region.","v":"danger","fb":"Regional frequency does not tie a channel to this unit or moment."}],"clue":{"category":"who","label":"WHO — decisive","text":"The joined record identifies no culpable human action below standard; a directly timed lightning channel supplies the initiating energy."}}]}},"story":["<b>Aldergate’s transformer failed in a flash, but the months before it are as important as the millisecond of breakdown.<\/b>","Operator Nkemi has the loading history. The Oil Technician has the pre-event condition series. The Asset Records Clerk can join protection settings to lightning and relay timing.","Sabotage, chronic insulation decline, and a direct lightning exceedance each predict a different record before the fire.","The inquiry must decide whether someone accepted a known risk—or whether the equipment met its obligations and still met a rarer event."],"endings":{"overclaimWhat":"attack","dismissalWhat":"overload","win":{"expertTitle":"The Direct Impulse","expert":["You identify no culpable human actor, the Substation Yard & Transformer, and a direct lightning impulse beyond the protected insulation level. The channel, arrester, relay, and bushing records align.","The sabotage theory lacks access or physical evidence, while the chronic-overheating theory lacks the required thermal and gas history. This failure is a genuine residual-risk event."],"soundTitle":"The Lightning Sequence","sound":["Your verdict places the failure at the yard transformer and recognizes a direct impulse without human fault.","Some waveform or condition details remain incomplete, but the positive lightning evidence and normal prehistory support the result."],"namedTitle":"Right Impulse, Limited Condition Record","named":["You choose the correct responsibility finding, place, and mechanism.","The conclusion is right, although missed clues leave the protection or pre-event condition case less complete."]},"overclaim":{"title":"No Deliberate Entry or Damage","body":["Security, physical inspection, and electrical onset show no human intrusion or planted initiating fault.","A dramatic fire is not evidence of sabotage when a timed natural impulse is recorded."]},"dismissal":{"title":"The Systemic-Decline Story Was the False Pattern","body":["Loading, temperature, cooling, and dissolved-gas histories do not show the cumulative deterioration that the overload theory requires.","Importing a familiar deferred-maintenance narrative would ignore the unit’s normal pre-event condition."]},"wrongNames":{"title":"The Lightning Event, Given Human Blame","body":["You recognize the impulse but assign culpability or culmination away from the transformer yard where the complete event signature begins."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"t_refinery","title":"The Halden Refinery Fire","discipline":"Process Safety & Combustion Engineering","venue":"the Halden refinery inquiry","agent":{"name":"Investigator Cara Mendel","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Combustion & Corrosion Pioneers","dossierName":"COMBUSTION & CORROSION PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Halden refinery inquiry","teaser":"A refinery fractionator ruptures and feeds a dawn fireball. Was an attacker responsible, did one random spark overwhelm a sound unit, or did the unit superintendent authorize operation with corroded equipment and the only relief path isolated?","overclaimTag":"deliberate sabotage of the process unit","truthTag":"an authorized relief isolation combined with known corrosion","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A refinery tower with isolated relief line and corroded rupture\"><path d=\"M100 118 V28 h90 v90\" fill=\"none\" stroke=\"#121212\" stroke-width=\"3\"/><path d=\"M120 50 h50 M120 72 h50 M120 94 h50\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><path d=\"M190 42 h115 v-18 h55\" fill=\"none\" stroke=\"#326891\" stroke-width=\"3\"/><path d=\"M280 30 l18 18 M298 30 l-18 18\" stroke=\"#B3261E\" stroke-width=\"3\"/><path d=\"M350 108 C390 72,430 92,455 52 C480 18,520 48,548 26\" fill=\"none\" stroke=\"#B3261E\" stroke-width=\"4\"/><path d=\"M402 118 h160\" stroke=\"#121212\" stroke-width=\"3\"/><\/svg>","overclaimTease":"The flame begins after containment is lost. Reconstruct pressure, relief capacity, wall condition, and authorization before treating ignition as either sabotage or meaningless chance.","DAYS_TOTAL":3,"CATS":{"who":{"title":"Who is behind it","truth":"superintendent","items":[{"id":"operator","label":"Garon Voss — refinery operator"},{"id":"superintendent","label":"Mira Halden — unit superintendent"},{"id":"inspector","label":"The state process-safety inspector"}]},"where":{"title":"Where it culminates","truth":"control","items":[{"id":"units","label":"The Fractionator, Relief Header & Flare"},{"id":"office","label":"The Corporate Asset Office"},{"id":"control","label":"The Unit Control Room"}]},"what":{"title":"What happened","truth":"neglect","items":[{"id":"attack","label":"Deliberate damage opened the vessel and ignited the release"},{"id":"freak","label":"A random ignition caused failure in an otherwise protected unit"},{"id":"neglect","label":"Known wall loss met rising pressure after the relief path was isolated"}]}},"READING_ORDER":["unitop","boardop","clerk"],"CHARACTERS":{"unitop":{"name":"Operator Delia Fenn","role":"Unit operator","face":"🔥","badge":"U","legend":"the fractionator deck","hint":"The vessel pressure climbed after the relief header was isolated under a live operating permit.","reading":"papin"},"boardop":{"name":"The Board Operator","role":"Control-room operator","face":"🎛️","badge":"B","legend":"the control console","hint":"Trend data show pressure and temperature rising through known alarm limits while the flare path remained unavailable.","reading":"fk"},"clerk":{"name":"The Inspection Records Clerk","role":"Corrosion and permit clerk","face":"🗂","badge":"C","legend":"the permit archive","hint":"Thickness readings, the temporary isolation, and the startup authorization carry the superintendent’s review.","reading":"pourbaix"}},"TOPICS":{"papin":{"sci":"Denis Papin (1647-1713)","topic":"The pressure vessel & safety valve","lede":"Papin made pressurized steam useful and added the escape path that keeps a closed vessel from becoming a bomb.","no":1,"profile":"Denis Papin was a French physician, physicist, and inventor whose experiments with steam made pressure both useful and visibly dangerous. In the 1670s he developed the “steam digester,” a strong closed vessel that used pressurized steam to cook and soften material at temperatures above the ordinary boiling point of water. The device was an ancestor of the pressure cooker and laboratory autoclave.\n\nPapin added a weighted safety valve so excess pressure could lift the valve and escape rather than rupture the vessel. The idea is simple but profound: a closed process that can continue generating vapour or gas needs an independent path sized for the worst credible pressure source. A relief valve is not a routine control knob. It is a last protective layer when normal regulation, cooling, or operator action is insufficient.\n\nRelief capacity depends on more than the valve body. The inlet, outlet, header, flare, back pressure, isolation valves, and discharge destination must all remain available. A perfectly tested valve cannot protect a vessel if a blind, closed block valve, frozen line, or overloaded header cuts the route. Temporary isolation during maintenance therefore requires rigorous control and compensating protection.\n\nAt Halden, the relief valve itself is intact, but its outlet is isolated from the flare while the fractionator remains in service. Papin’s safeguard has been converted into a sealed ornament. Pressure rises against a vessel already thinned by corrosion. The fire follows the rupture; the missing relief path explains why containment failed before any ignition source mattered. The closed line makes the missing protection physically visible.","frame":"Delia Fenn traces the relief line to a closed isolation. “A valve cannot save a vessel through a blind. Tell me what protection was actually available.”","q":[{"q":"Why did Papin add a safety valve to his steam digester?","o":[{"t":"To vent excess pressure before the closed vessel ruptured in the unit.","v":"expert","fb":"The valve provides an escape path when generated pressure exceeds the safe limit."},{"t":"To increase pressure without limit while keeping the vessel temperature fixed.","v":"partial","fb":"Unlimited pressure would defeat the purpose of the protective device."},{"t":"To admit outside air so steam could no longer form inside the chamber.","v":"wrong","fb":"Admitting air is not the operating principle of a pressure relief valve."},{"t":"To measure food density without changing pressure in the vessel.","v":"danger","fb":"The valve protects containment rather than measuring material density."}],"clue":{"category":"what","label":"WHAT clue","text":"Papin’s principle shows the initiating protection failure: pressure continued to rise because the relief route was physically isolated from the flare."}},{"q":"Why can a tested relief valve still fail to protect a vessel?","o":[{"t":"Relief valves work mainly on liquids and does not discharge vapour or gas in the unit.","v":"partial","fb":"Relief devices are commonly designed for vapour, gas, liquid, or mixed service."},{"t":"Its inlet or discharge path may be blocked, isolated, or exposed to excessive back pressure.","v":"expert","fb":"Protection requires the complete flow path, not merely a functioning valve mechanism."},{"t":"A valve becomes unnecessary whenever an operator is present in the control room.","v":"wrong","fb":"Operators cannot always respond fast enough to replace an independent layer."},{"t":"Testing permanently lowers the pressure rating of the protected vessel in the unit before rupture.","v":"danger","fb":"Proper testing does not inherently reduce vessel rating."}],"clue":{"category":"where","label":"WHERE clue","text":"The permit and control display place the decisive isolation in the control-room lineup, where the relief header was knowingly left unavailable during operation."}},{"q":"Which finding most weakens a sabotage explanation for the initial loss of containment?","o":[{"t":"A loud fireball is visible from outside the refinery after dawn in the unit.","v":"partial","fb":"Visual drama identifies consequence, not the initiating mechanism."},{"t":"The unit contains flammable hydrocarbons capable of burning after release in the unit.","v":"wrong","fb":"Flammability explains the fire after release but not why the vessel opened."},{"t":"Pressure trends rise normally against an isolated relief path until a thinned wall ruptures.","v":"expert","fb":"A continuous process-pressure sequence explains rupture without an external damaging act."},{"t":"One exterior camera loses contrast in the heat of the ensuing fire in the unit before rupture.","v":"danger","fb":"Heat-degraded video after ignition does not establish sabotage beforehand."}],"clue":{"category":"who","label":"WHO clue","text":"The operator followed the approved lineup; the authorization to run with the relief path isolated came from the superintendent who controlled the permit."}}]},"fk":{"sci":"David Frank-Kamenetskii (1910-1970)","topic":"Thermal explosion theory","lede":"Frank-Kamenetskii described the tipping point where heat generation outruns removal and a controlled process accelerates away.","no":2,"profile":"David Frank-Kamenetskii was a Soviet physicist and chemist who developed influential theories of combustion and thermal explosion. He studied systems in which heat is produced by chemical reaction while simultaneously being removed through the vessel wall, cooling medium, or surrounding environment. Because reaction rates often increase steeply with temperature, a small warming can accelerate heat generation, which causes further warming.\n\nThis positive feedback does not make every hot process unstable. Stability depends on geometry, heat-transfer area, kinetics, concentration, and cooling. Frank-Kamenetskii introduced dimensionless ways to compare heat generation with heat removal and identify conditions under which no stable temperature solution remains. Beyond that threshold, temperature accelerates toward runaway unless the reaction or feed is stopped.\n\nRefinery fractionators are not simple batch reactors, but the reasoning transfers to abnormal operation. Loss of cooling, blocked vapour removal, excess feed, or pressure accumulation can move a system away from its controlled state. Trend shape matters. A random ignition after a harmless leak does not explain rising vessel pressure before release. Sabotage would need an external discontinuity. A process excursion produces connected changes in temperature, pressure, and flow.\n\nHalden’s historian shows a slow temperature rise, increasing overhead pressure, and declining condenser duty before the vessel opens. Alarm acknowledgments occur, but the unit remains online. The flare header is unavailable, so vapour has no protective destination. Frank-Kamenetskii’s feedback picture links process conditions to the final rupture. The spark that ignites the cloud is consequential, yet it is not the root cause of the containment failure.","frame":"The board operator scrolls backward from the fireball into an hour of rising trends. “Ignition is the last frame. Find the feedback before it.”","q":[{"q":"What creates thermal runaway in Frank-Kamenetskii’s framework?","o":[{"t":"Cooling generally increases reaction rate until the vessel reaches a fixed limit in the trend.","v":"partial","fb":"Cooling opposes temperature rise rather than accelerating the reaction by definition."},{"t":"Pressure falls to zero whenever a chemical reaction releases energy in the trend.","v":"wrong","fb":"Exothermic reaction can raise both temperature and pressure."},{"t":"A spark would need to enter from outside before any process temperature can rise.","v":"danger","fb":"Many process excursions develop before any external ignition."},{"t":"Heat generation accelerates with temperature faster than the system can remove heat.","v":"expert","fb":"Runaway is a positive feedback between temperature and reaction heat."}],"clue":{"category":"what","label":"WHAT clue","text":"The historian shows linked temperature and pressure acceleration before rupture, identifying a process excursion rather than a random post-release spark as the initiating failure."}},{"q":"Why is the shape of a process trend important?","o":[{"t":"Connected changes in temperature, pressure, and cooling reveal feedback before the final event.","v":"expert","fb":"The sequence reveals whether variables evolve through a physical process mechanism."},{"t":"Mainly the maximum temperature matters; all earlier measurements are operational noise in the trend.","v":"partial","fb":"Discarding the approach to the peak removes causal information."},{"t":"A smooth trend strongly suggests the instruments were fabricated after the incident.","v":"wrong","fb":"Smooth physical trends are common and not evidence of fabrication."},{"t":"Trend data can identify ignition but rarely conditions leading to loss of containment.","v":"danger","fb":"Trends often show the pressure and thermal excursion that precedes ignition."}],"clue":{"category":"where","label":"WHERE clue","text":"The complete pre-rupture sequence survives in the control-room historian, not in the burned exterior scene or corporate summary."}},{"q":"Which response most directly interrupts a developing runaway?","o":[{"t":"Silence the alarms so operators can concentrate on ordinary production targets.","v":"partial","fb":"Muting information does not change the physical feedback."},{"t":"Reduce or stop the heat-generating feed while restoring cooling or safe vapour removal.","v":"expert","fb":"The response must reduce generation and restore a path for heat or pressure removal."},{"t":"Increase feed to push the unstable material through the vessel more quickly.","v":"wrong","fb":"Additional feed can intensify the excursion."},{"t":"Wait for an ignition source because runaway does not damage containment by itself.","v":"danger","fb":"Pressure and temperature can rupture equipment before a cloud ignites."}],"clue":{"category":"who","label":"WHO clue","text":"Control records show the board operator requested shutdown, but the unit superintendent denied it and renewed the live operating permit."}}]},"pourbaix":{"sci":"Marcel Pourbaix (1904-1998)","topic":"Corrosion & potential-pH diagrams","lede":"Pourbaix mapped when metals remain protected, dissolve, or lose the passive film on which their apparent strength depends.","no":3,"profile":"Marcel Pourbaix was a Belgian electrochemist best known for potential–pH diagrams, often called Pourbaix diagrams. These maps show the thermodynamically stable forms of a metal under combinations of acidity and electrochemical potential. A region may favour metallic immunity, active dissolution, or a protective oxide film called passivation.\n\nThe diagrams do not predict corrosion rate by themselves. Real equipment adds temperature, flow, contaminants, deposits, stress, and localized chemistry. Chlorides can break down passive films; sulphur compounds and acids can create aggressive environments; deposits can form crevices with chemistry unlike the bulk process. The practical lesson is that material condition depends on the environment at the wall, not only the nominal alloy name.\n\nThickness monitoring translates that chemistry into remaining structural margin. Ultrasonic readings, corrosion probes, inspection locations, and rate estimates are trended over time. A low reading may require reduced pressure, repair, replacement, or more frequent examination. Extrapolation is uncertain, but a measured wall below the minimum allowable thickness is not a cosmetic concern.\n\nHalden’s inspection grid shows localized thinning at the eventual rupture site. The most recent verified reading is below the action threshold, followed by a management deferral and no compensating pressure reduction. Fire damage cannot create the older layered corrosion product preserved around the break. Pourbaix’s chemistry establishes a pre-existing weak wall; Papin and Frank-Kamenetskii explain the rising load placed upon it. The combined evidence identifies an authorized process decision, not an attack and not an unavoidable spark. The remaining metal had already lost the margin required for safe pressure service.","frame":"The clerk overlays wall-thickness points on the rupture sketch. “The fire is new. This scale is old. Decide when the vessel became weak.”","q":[{"q":"What does a Pourbaix diagram show?","o":[{"t":"The exact corrosion rate of nearly every alloy in any flowing industrial process.","v":"partial","fb":"Rate also depends on transport, temperature, deposits, and local chemistry."},{"t":"The maximum pressure a vessel can hold after any amount of wall loss.","v":"wrong","fb":"Pressure capacity requires geometry, material properties, and measured thickness."},{"t":"Thermodynamically favoured metal, dissolved, or passive states across potential and pH.","v":"expert","fb":"The diagram maps equilibrium stability regions rather than a universal kinetic rate."},{"t":"The ignition temperature of nearly every hydrocarbon released from a refinery.","v":"danger","fb":"Combustion properties are outside the diagram’s purpose."}],"clue":{"category":"what","label":"WHAT clue","text":"Pourbaix’s corrosion logic and the preserved scale establish that the rupture wall was weakened before the fire, excluding damage created only by ignition."}},{"q":"Why are localized thickness readings important?","o":[{"t":"Average thickness generally equals the minimum thickness at the most corroded point.","v":"partial","fb":"Averages can conceal severe pits or thin bands."},{"t":"Localized corrosion affects appearance but not pressure containment at the wall at the thin spot.","v":"wrong","fb":"Local wall loss can govern the rupture pressure."},{"t":"One thick reading strongly suggests the entire vessel has uniform remaining strength.","v":"danger","fb":"Sparse thick readings do not exclude an unmeasured thin area."},{"t":"A small aggressive region can fall below safe wall thickness while surrounding metal appears sound.","v":"expert","fb":"Pressure failure can begin at a local minimum that a broad average hides."}],"clue":{"category":"where","label":"WHERE clue","text":"The inspection map and permit package meet in the control room, where the known thin location was operated above its compensating limit."}},{"q":"Which record most directly assigns the unsafe operating decision?","o":[{"t":"A signed permit renewing service after the low thickness reading and relief isolation.","v":"expert","fb":"The permit connects known condition, unavailable protection, and authority to continue operation."},{"t":"The operator’s routine log that records the pressure shown by the instrument.","v":"partial","fb":"Recording the condition is not equivalent to authorizing the risk."},{"t":"The state inspector’s earlier request for the next scheduled survey.","v":"wrong","fb":"Scheduling oversight is weaker than the specific live permit."},{"t":"A laboratory report identifying the hydrocarbon that burned after release.","v":"danger","fb":"Fuel identity explains combustion but not who accepted the pre-release conditions."}],"clue":{"category":"who","label":"WHO clue","text":"The superintendent signs the only permit combining the below-threshold wall reading, isolated relief path, and decision to keep the unit online."}}]}},"story":["<b>Halden’s fireball dominates the footage, but the unit’s final hour begins with pressure, temperature, and a relief path already unavailable.<\/b>","Operator Delia Fenn has the physical lineup. The Board Operator holds the process historian. The Inspection Records Clerk has the thickness grid and live permit.","Sabotage, an unlucky ignition, and an authorized degraded condition each explain the flame differently.","The inquiry must separate what opened the vessel from what ignited the material after it escaped."],"endings":{"overclaimWhat":"attack","dismissalWhat":"freak","win":{"expertTitle":"The Permit Behind the Fire","expert":["You connect Mira Halden — the unit superintendent, the Unit Control Room, and known wall loss meeting rising pressure after the relief path was isolated. The full clue chain links the initiating condition, the physical mechanism, and the decisive record without relying on candidate order.","The two alternative explanations each fit part of the scene, but neither survives the combined timing, material, and documentary evidence."],"soundTitle":"The Pressure and Wall Chain","sound":["Your accusation identifies Mira Halden — the unit superintendent, the Unit Control Room, and known wall loss meeting rising pressure after the relief path was isolated.","A few missed clues leave gaps in the reconstruction, yet the evidence you recovered is sufficient to distinguish the true sequence from both traps."],"namedTitle":"Correct Decision, Thin Reconstruction","named":["You reach the correct three-part verdict with a thin evidentiary file.","The result is right, although the unrecovered clues would be needed to defend the causal chain under sustained challenge."]},"overclaim":{"title":"No Saboteur Is Needed","body":["No external discontinuity, tool mark, or explosive residue precedes the pressure excursion.","The process historian and old corrosion scale provide a complete internal rupture mechanism."]},"dismissal":{"title":"The Spark Was Not the Root Cause","body":["The ignition source affected the released cloud, but containment had already failed through foreseeable pressure and wall loss.","Calling the spark random does not explain the isolated relief header or the signed decision to continue operation."]},"wrongNames":{"title":"Right Mechanism, Wrong Attribution","body":["You recognize the governing mechanism but assign it to the wrong actor or move its decisive evidence away from the location where the records and physical traces converge."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"e_quake","title":"Nine Seconds to Cordera","discipline":"Seismology & Earthquake Science","venue":"the Cordera seismic-source inquiry","agent":{"name":"Investigator Mara Solveig","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Seismology Pioneers","dossierName":"SEISMOLOGY PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Cordera seismic-source inquiry","teaser":"A sharp dawn shock rattles Cordera without the fault sequence expected by the warning centre. Was the source a clandestine blast, an ordinary earthquake whose sensors failed, or a rare tectonic event too abrupt for useful warning?","overclaimTag":"a clandestine underground detonation","truthTag":"a shallow explosive source disguised as an earthquake","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"Seismic stations around a shallow quarry source\"><path d=\"M20 104 C140 80,260 112,380 88 S540 102,640 76\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M300 86 l-14-24 18 4 -4-28 24 30 -18-3 8 25z\" fill=\"#B3261E\"/><g stroke=\"#326891\" stroke-width=\"2\"><path d=\"M90 96 q16-24 32 0\"/><path d=\"M470 91 q16-24 32 0\"/><path d=\"M560 84 q16-24 32 0\"/><\/g><path d=\"M302 82 C240 62,180 68,120 88 M306 82 C380 58,450 65,520 82\" fill=\"none\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><\/svg>","overclaimTease":"A dramatic source can be real, but it must leave the geometry of a pressure pulse: shallow depth, outward first motions, compact timing, and an industrial record at the source.","DAYS_TOTAL":3,"CATS":{"who":{"title":"Who is behind it","truth":"blaster","items":[{"id":"blaster","label":"Kestrel Quarry’s blasting contractor"},{"id":"director","label":"Roan Vesk — seismic-network director"},{"id":"seismologist","label":"The state seismologist"}]},"where":{"title":"Where it culminates","truth":"fault","items":[{"id":"office","label":"The Network Budget Office"},{"id":"fault","label":"The Quarry Bench & Sensor Sites"},{"id":"warncenter","label":"The Alert Operations Centre"}]},"what":{"title":"What happened","truth":"blast","items":[{"id":"silenced","label":"An ordinary earthquake went unalerted after the sensor network was cut"},{"id":"freak","label":"A rare tectonic rupture gave too little time for useful warning"},{"id":"blast","label":"A shallow underground detonation produced the recorded shock"}]}},"READING_ORDER":["fieldtech","dutyofficer","clerk"],"CHARACTERS":{"fieldtech":{"name":"Field Tech Odile","role":"Seismic field technician","face":"📡","badge":"O","legend":"the source stations","hint":"Nearby instruments were live and recorded a compact, shallow pulse centred on an active quarry bench.","reading":"byerly"},"dutyofficer":{"name":"The Duty Officer","role":"Alert-centre duty officer","face":"🚨","badge":"D","legend":"the alert centre","hint":"Automatic processing withheld an earthquake alert because the depth and phase pattern failed the tectonic checks.","reading":"gutenberg"},"clerk":{"name":"The Source Records Clerk","role":"Permits and waveform clerk","face":"🗂","badge":"C","legend":"the evidence room","hint":"Explosive deliveries, a missing blast notice, and the waveform source time converge within seconds.","reading":"aki"}},"TOPICS":{"byerly":{"sci":"Perry Byerly (1897-1978)","topic":"First motions & fault planes","lede":"Byerly learned to read the first push or pull at many stations as a geometric signature of the source.","no":1,"profile":"Perry Byerly built his seismological career at Berkeley, turning the first wiggles on a seismogram into information about how the ground moved at the source. When a P wave reaches a station, its first motion may push the ground away from the source, a compression, or pull it toward the source, a dilation. Plot those signs around an earthquake and a fault’s double-couple pattern emerges in opposing quadrants.\n\nThat geometry matters because different sources radiate differently. A slipping fault does not simply expand in all directions; one pair of quadrants begins in compression and the other in dilation. An idealized explosion is closer to an isotropic pressure source and sends initial compressions outward around the source. Real geology complicates amplitudes and paths, but a distributed polarity pattern remains a powerful discriminator when stations surround the event.\n\nByerly used such observations to infer fault planes before modern digital inversion. The method demands careful station timing, known instrument orientation, and enough azimuthal coverage to avoid mistaking a sparse pattern for certainty. It is a source test, not a judgment based on how frightening the shaking felt.\n\nCordera’s closest stations were operating, correctly oriented, and spread around the source. Their first motions point outward rather than dividing into the compression-and-dilation quadrants expected from fault slip. Byerly’s test therefore makes the sensational possibility scientifically examinable. It also challenges the network-neglect story: the decisive instruments did not go dark. They recorded a source whose mechanism was unlike the earthquakes the alert algorithm was designed to announce.","frame":"Odile pins red and blue polarity marks around a map. “A fault divides the compass. A pressure source pushes. Show me you can see the difference.”","q":[{"q":"What pattern does a typical slipping fault produce in P-wave first motions?","o":[{"t":"Mainly compressions at nearly every station, independent of azimuth.","v":"partial","fb":"All-around compression is more characteristic of an isotropic pressure source."},{"t":"Alternating compression and dilation quadrants around the source.","v":"expert","fb":"A double-couple fault source divides the surrounding stations into opposing polarity quadrants."},{"t":"Identical horizontal amplitudes with no polarity information.","v":"wrong","fb":"Amplitude equality would not replace the polarity geometry used in a focal mechanism."},{"t":"A complete absence of P waves until surface waves arrive.","v":"danger","fb":"Faults radiate P waves promptly; surface waves are not the first source evidence."}],"clue":{"category":"what","label":"WHAT clue","text":"Byerly’s polarity plot shows outward initial compression at stations around the source, the pattern expected from a compact pressure pulse rather than ordinary fault slip."}},{"q":"Why must first-motion stations surround the source?","o":[{"t":"Distance alone determines whether a seismogram came from an earthquake or an explosion.","v":"partial","fb":"Distance helps locate events but does not by itself determine the mechanism."},{"t":"One nearby station can identify the full source geometry without knowing its orientation in gauge data.","v":"wrong","fb":"A single oriented trace cannot map the surrounding compression and dilation field."},{"t":"Azimuthal coverage reveals whether polarities form quadrants or point outward everywhere.","v":"expert","fb":"The spatial polarity pattern, not one trace, distinguishes source geometries."},{"t":"Stations would need to be arranged in a straight line so travel times can be averaged.","v":"danger","fb":"A line of stations leaves major directional ambiguities rather than resolving them."}],"clue":{"category":"where","label":"WHERE clue","text":"The clearest polarity coverage surrounds the active quarry bench, not the mapped Cordera fault or the budget office."}},{"q":"Which finding would most weaken the claim that dead sensors hid an earthquake?","o":[{"t":"A distant citizen reported feeling one hard jolt before breakfast in the network.","v":"partial","fb":"A felt report lacks the mechanism and coverage contained in the instrumental record."},{"t":"The alert centre had requested more maintenance funding the previous year in the network.","v":"wrong","fb":"Funding pressure can be real without explaining the specific event."},{"t":"One remote station briefly lost telemetry during unrelated weather in the network in station data.","v":"danger","fb":"A remote telemetry gap is immaterial when the surrounding source stations recorded cleanly."},{"t":"Multiple nearby stations recorded clean, correctly timed first arrivals from the event.","v":"expert","fb":"A functioning local array directly contradicts the idea that the source passed through an empty network."}],"clue":{"category":"who","label":"WHO clue","text":"Maintenance logs and waveform headers show the local array was live; the network director did not silence the instruments that classified the source."}}]},"gutenberg":{"sci":"Beno Gutenberg (1889-1960)","topic":"Travel times, depth & seismic phases","lede":"Gutenberg used the arrival of seismic phases to place events in depth as well as on a map.","no":2,"profile":"Beno Gutenberg helped build modern seismology by using earthquake travel times to map the planet’s hidden layers. Working first in Germany and later at the California Institute of Technology, he identified the depth of the core-mantle boundary and, with Charles Richter, developed a practical magnitude scale for southern California earthquakes. His career linked the arrival of seismic phases to both Earth structure and source location.\n\nLocating an event requires comparing P- and S-wave arrival times at several stations. The differences constrain distance; the network geometry constrains latitude, longitude, and depth. Depth is especially useful when human activity is suspected. Tectonic earthquakes occupy faults through the crust and sometimes far deeper, while quarry blasts and most underground industrial explosions are very shallow. A shallow source is not proof of an explosion, because natural events can occur near the surface, but it changes the balance of evidence.\n\nGutenberg also distinguished body waves travelling through Earth from surface waves moving along it. Explosions often produce relatively strong compressional energy and weaker shear radiation than comparably sized fault ruptures. These ratios vary with geology and coupling, so they are used with polarity and contextual records rather than alone.\n\nThe Cordera solution places the source only a few hundred metres beneath the quarry property, well away from the hypocentral depth of the mapped fault segment. Its compact P arrival and weak shear energy agree with the first-motion evidence. The warning centre did not miss a normal deep rupture; its filters encountered a shallow source with a different phase balance. Gutenberg’s method turns “secret blast” from rumor into a location-and-depth claim that can be checked against the industrial site.","frame":"The duty officer aligns P and S arrivals beneath the alert log. “Before blaming the network, locate what it heard and tell me whether the source belongs on a fault.”","q":[{"q":"How do several stations constrain an earthquake’s depth?","o":[{"t":"Their P- and S-arrival differences are combined with network geometry in a location solution.","v":"expert","fb":"Arrival times across a network determine the hypocentre, including depth."},{"t":"The strongest shaking report is assigned as the source depth below that observer’s location.","v":"partial","fb":"Felt intensity varies with buildings and soils and cannot define hypocentral depth."},{"t":"Depth equals the distance to the station recording the largest surface-wave amplitude.","v":"wrong","fb":"Surface-wave amplitude is not a direct ruler for source depth."},{"t":"A magnitude number automatically supplies an exact depth without travel times.","v":"danger","fb":"Magnitude and depth are separate parameters inferred from different observations."}],"clue":{"category":"where","label":"WHERE clue","text":"Gutenberg’s travel-time solution places the source beneath the quarry property at industrial depth, not on the deeper mapped fault plane."}},{"q":"Why does a very shallow source matter in an explosion inquiry?","o":[{"t":"nearly every shallow seismic event is artificial and nearly every deep event is natural.","v":"partial","fb":"Natural shallow earthquakes exist, so depth alone cannot close the case."},{"t":"Most industrial blasts occur near the surface, while tectonic depth must be independently justified.","v":"expert","fb":"Shallow depth is a discriminator, though it must be combined with other source evidence."},{"t":"Shallow events does not generate P waves strong enough to be detected regionally at the source.","v":"wrong","fb":"Shallow blasts can radiate strong compressional waves over regional distances."},{"t":"Depth matters mainly for damage estimates and says nothing about source type at the source.","v":"danger","fb":"Depth informs both source interpretation and expected ground motion."}],"clue":{"category":"what","label":"WHAT clue","text":"The unusually shallow hypocentre and strong compressional phase support an industrial detonation while weakening both a deep tectonic rupture and a sensor-outage explanation."}},{"q":"What phase balance would be more consistent with a compact pressure source?","o":[{"t":"A dominant shear field with the full double-couple polarity pattern of a fault.","v":"partial","fb":"Strong shear and double-couple polarity would favour tectonic slip instead."},{"t":"No body waves at all, mainly long-period tides measured after the shaking.","v":"wrong","fb":"Both earthquakes and explosions generate body waves before tidal effects matter."},{"t":"Relatively strong compressional energy compared with the shear radiation of fault slip.","v":"expert","fb":"Explosive sources commonly emphasize P energy relative to shear, though ratios need context."},{"t":"Equal energy in nearly every phase regardless of geology, depth, or source coupling.","v":"danger","fb":"Phase ratios vary; perfect equality is not a realistic diagnostic rule."}],"clue":{"category":"who","label":"WHO clue","text":"The automated system classified the strong-P, shallow event as nontectonic before the duty officer reviewed it, so the absence of a public quake alert was procedural rather than concealment."}}]},"aki":{"sci":"Keiiti Aki (1930-2005)","topic":"Seismic moment & source spectra","lede":"Aki treated each waveform as a spectrum carrying the size, duration, and mechanism of its source.","no":3,"profile":"Keiiti Aki was a Japanese-American seismologist who helped transform earthquake records into quantitative pictures of the source. He advanced the use of seismic moment, a measure tied to fault area, average slip, and rock rigidity, and developed methods for analysing spectra and wave scattering. Rather than treating a seismogram as one magnitude number, Aki asked how energy was distributed across frequency and what that distribution revealed about rupture dimensions and duration.\n\nA fault rupture usually grows across an area over a finite time. Its spectrum carries a corner frequency related to source size, while the radiation pattern reflects shear motion. A contained explosion is more compact and impulsive. Spectral ratios, moment estimates, and waveform similarity can therefore test whether an event resembles nearby earthquakes or a family of known blasts. No single spectral rule is universal: depth, geology, and instrument response must be modelled.\n\nAki also emphasized the value of repeated events. If quarry blasts occur from the same bench under similar loading, their waveforms can correlate strongly even when their reported times differ. Matching an unknown event to that template can be more persuasive than arguing from magnitude alone.\n\nCordera’s dawn pulse closely matches two permitted Kestrel shots in waveform shape and corner frequency, but its explosive yield and timestamp are absent from the submitted notice. Delivery records show material issued to the contractor, and the loading sheet was altered after the event. Aki’s comparison links mechanism, place, and operational custody. It rejects the idea that a rare earthquake merely happened to imitate the quarry’s own seismic fingerprint.","frame":"The clerk overlays three waveforms until two disappear beneath the third. “One of these was permitted. One was not. Tell me what makes them family.”","q":[{"q":"What does seismic moment describe for a fault source?","o":[{"t":"The exact clock time at which the first station transmits an alert.","v":"partial","fb":"Alert time is an operational timestamp, not a source-strength measure."},{"t":"The number of buildings damaged within one kilometre of the epicentre.","v":"wrong","fb":"Damage depends on exposure and shaking, not directly on seismic moment alone."},{"t":"The explosive mass required for nearly every event with the same local magnitude.","v":"danger","fb":"Explosive yield and fault moment cannot be interchanged by one universal conversion."},{"t":"A quantity related to rock rigidity, slipped area, and average displacement.","v":"expert","fb":"Seismic moment represents the physical scale of faulting rather than its felt consequences."}],"clue":{"category":"what","label":"WHAT clue","text":"Aki’s spectral comparison matches the Cordera pulse to prior quarry shots, including their compact duration, rather than to local fault earthquakes."}},{"q":"Why are waveform templates from earlier quarry blasts valuable?","o":[{"t":"Events from the same source and mechanism can retain a distinctive correlated shape.","v":"expert","fb":"Correlation adds a source fingerprint when location and propagation paths are similar."},{"t":"Any two events with equal magnitude would need to produce identical seismograms everywhere.","v":"partial","fb":"Equal magnitude does not guarantee identical mechanism, path, or waveform."},{"t":"A template strongly suggests intent even if the source location and records disagree.","v":"wrong","fb":"Templates identify similarity; documentary evidence is still needed for responsibility."},{"t":"Past blasts erase the need to examine polarity, depth, or instrument response.","v":"danger","fb":"A robust conclusion combines waveform comparison with independent discriminators."}],"clue":{"category":"where","label":"WHERE clue","text":"The strongest waveform match comes from earlier permitted shots on the same quarry bench, placing the decisive comparison at the industrial source site."}},{"q":"Which record most directly connects the unreported source to a responsible party?","o":[{"t":"A network budget request written months before the event by the director.","v":"partial","fb":"Budget pressure does not explain an intact array recording a quarry-like source."},{"t":"Explosive issue sheets and an altered loading log held by the quarry contractor.","v":"expert","fb":"Custody and loading records connect the source material and timing to the contractor."},{"t":"A building-code map showing that Cordera lies in a region of moderate hazard.","v":"wrong","fb":"Regional hazard supports possible earthquakes but not this event’s operational chain."},{"t":"A newspaper photograph of dust rising after residents felt the shock.","v":"danger","fb":"A photograph is contextual, while issue and loading records establish control."}],"clue":{"category":"who","label":"WHO clue","text":"The contractor controlled the issued explosives and altered the only loading sheet covering the source time, completing the attribution without naming a network official."}}]}},"story":["<b>Cordera’s nine seconds of shaking begin a louder argument than the event itself.<\/b>","Field Tech Odile has the polarity map. The Duty Officer holds the depth and phase classification. The Source Records Clerk can compare the pulse with earlier industrial shots.","A silenced warning network, an improbable natural rupture, and a clandestine detonation each survive until source geometry and custody are read together.","The accusation must identify who controlled the source, where it originated, and why the alert system treated it differently from an earthquake."],"endings":{"overclaimWhat":"silenced","dismissalWhat":"freak","win":{"expertTitle":"The Unreported Shot","expert":["You connect Kestrel Quarry’s blasting contractor, the Quarry Bench & Sensor Sites, and a shallow underground detonation producing the recorded shock. The full clue chain links the initiating condition, the physical mechanism, and the decisive record without relying on candidate order.","The two alternative explanations each fit part of the scene, but neither survives the combined timing, material, and documentary evidence."],"soundTitle":"The Source Geometry Converges","sound":["Your accusation identifies Kestrel Quarry’s blasting contractor, the Quarry Bench & Sensor Sites, and a shallow underground detonation producing the recorded shock.","A few missed clues leave gaps in the reconstruction, yet the evidence you recovered is sufficient to distinguish the true sequence from both traps."],"namedTitle":"Correct Source, Sparse Chain","named":["You reach the correct three-part verdict with a thin evidentiary file.","The result is right, although the unrecovered clues would be needed to defend the causal chain under sustained challenge."]},"overclaim":{"title":"The Network Was Listening","body":["The intact local array recorded and classified the event; there is no missing sensor interval capable of hiding a normal earthquake.","Budget disputes explain institutional tension, not the outward polarities, shallow depth, or quarry waveform match."]},"dismissal":{"title":"A Fault Did Not Make This Pattern","body":["A rare tectonic rupture would still need a double-couple radiation pattern and a source on a plausible fault.","The industrial depth, strong compressional energy, and altered explosive log reject the act-of-nature account."]},"wrongNames":{"title":"Right Mechanism, Wrong Attribution","body":["You recognize the governing mechanism but assign it to the wrong actor or move its decisive evidence away from the location where the records and physical traces converge."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"e_tsunami","title":"The Sable Point Wave","discipline":"Tsunami Science & Oceanography","venue":"the Sable Point tsunami inquiry","agent":{"name":"Investigator Ravi Enns","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Tsunami-Science Pioneers","dossierName":"TSUNAMI-SCIENCE PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Sable Point tsunami inquiry","teaser":"The sea withdraws and returns before Sable Point receives a useful warning. Did an underwater blast make the wave, did officials neglect a working detection network, or did a nearby submarine landslide generate a wave that reached shore before deep-ocean confirmation could arrive?","overclaimTag":"an explosive source beneath the sea","truthTag":"a near-field landslide tsunami outrunning the warning cycle","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A submarine slope failure sending a short-travel tsunami to shore\"><path d=\"M20 42 C150 36,280 48,420 40 S560 48,640 38\" fill=\"none\" stroke=\"#326891\" stroke-width=\"3\"/><path d=\"M30 116 C150 102,250 114,350 88 S520 70,640 90\" fill=\"none\" stroke=\"#121212\" stroke-width=\"3\"/><path d=\"M320 82 l52 12 -34 18z\" fill=\"#B3261E\"/><path d=\"M410 72 C450 50,490 52,525 42\" fill=\"none\" stroke=\"#e2e2d8\" stroke-width=\"3\"/><path d=\"M570 34 v78 h45\" stroke=\"#121212\" stroke-width=\"2\"/><\/svg>","overclaimTease":"A local tsunami can be both rare and physically legible. Back-project the arrival, compare the source spectrum, and ask whether the warning system had enough travel time to act.","DAYS_TOTAL":3,"CATS":{"who":{"title":"Who is behind it","truth":"slope","items":[{"id":"slope","label":"An act of nature — a near-field slope failure, not a person"},{"id":"chief","label":"Nadia Voss — tsunami-warning chief"},{"id":"oceanographer","label":"The duty oceanographer"}]},"where":{"title":"Where it culminates","truth":"shore","items":[{"id":"watchfloor","label":"The Tsunami Warning Centre"},{"id":"shore","label":"The Offshore Canyon & Shore Stations"},{"id":"office","label":"The Warning Programme Office"}]},"what":{"title":"What happened","truth":"freak","items":[{"id":"freak","label":"A nearby submarine landslide outran the useful warning cycle"},{"id":"neglected","label

le in the Model Evaluation Room."}},{"q":"Which fact first directs responsibility toward the model leadership rather than an outside poisoner?","o":[{"t":"The approved dataset contains the imbalance before any external access occurs.","v":"expert","fb":"Internal provenance locates the source in approved data construction rather than intrusion."},{"t":"Any biased output establishes that a malicious outsider inserted poisoned examples.","v":"danger","fb":"Bias can arise from ordinary historical data without any malicious poisoning campaign."},{"t":"The model lead is the most senior scientist listed on the project chart.","v":"partial","fb":"Seniority matters only when tied to decisions and evidence about the dataset."},{"t":"Applicants complained online after the first rejection notices were sent.","v":"wrong","fb":"Complaints identify harm but not who created the underlying training pattern."}],"clue":{"category":"who","label":"WHO — lead","text":"The disputed training extract was an internally approved historical snapshot with no unauthorized additions or altered labels."}}]},"a_bias":{"sci":"Joy Buolamwini (b. 1989)","topic":"Algorithmic bias and disaggregated evaluation","lede":"Joy Buolamwini demonstrated that a system advertised as accurate can fail sharply when results are separated by gender and skin type.","no":2,"profile":"Joy Buolamwini is a computer scientist and founder of the Algorithmic Justice League. While studying at the MIT Media Lab, she found that commercial face-analysis systems had difficulty detecting her face unless she wore a white mask. That experience became a research question about whose faces were represented in training and evaluation.\n\nWith Timnit Gebru, Buolamwini conducted the Gender Shades study, published in 2018. The researchers built a more balanced evaluation set using parliamentarians from African and European countries and assessed commercial gender-classification systems across skin type and gender presentation. Overall accuracy numbers concealed large disparities. The systems performed best on lighter-skinned men and worst on darker-skinned women, with error-rate gaps far larger than a single aggregate score suggested.\n\nThe study did not claim that every error reflected intention or that one benchmark captured every identity. Its methodological force came from disaggregation. A model can meet an impressive average while imposing concentrated harm on a smaller group. Evaluation therefore needs relevant subgroups, uncertainty, task validity, and an understanding of how errors affect people in the deployment context.\n\nAegis passed its headline accuracy target. The hidden table tells a different story: false rejections for one applicant group were several times higher, especially for candidates with nonlinear employment histories. The validation scientist reproduced the gap on a holdout set and warned that the model’s confidence score did not measure fairness. Buolamwini’s lesson separates rare edge cases from patterned failure. If the same group is rejected repeatedly across independent evaluation slices, the result is not a handful of unlucky mistakes. It is a property of the system that leadership was obliged to confront before launch.","frame":"Replaces the single accuracy number with a grid of subgroup false-rejection rates. “The average is clean because the harmed group is small. Read the cells, not the headline.”","q":[{"q":"What did the Gender Shades study reveal about aggregate accuracy?","o":[{"t":"Any difference between groups indicates that the developer intentionally discriminated.","v":"partial","fb":"A disparity requires investigation, while intent is a separate evidentiary question."},{"t":"A strong average can conceal much worse performance for particular groups.","v":"expert","fb":"Disaggregation exposed concentrated errors that a single overall percentage obscured."},{"t":"Commercial systems were equally inaccurate for every skin type and gender group.","v":"wrong","fb":"The important finding was unequal performance, not uniformly poor accuracy."},{"t":"A model is fair whenever its total number of correct predictions remains high.","v":"danger","fb":"High total accuracy can coexist with serious and systematic subgroup harm."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"The model’s overall score concealed a repeated subgroup false-rejection gap across independent validation slices."}},{"q":"Which evaluation best separates patterned bias from a few rare edge cases?","o":[{"t":"A collection of memorable complaints selected after the model becomes controversial.","v":"partial","fb":"Complaints can surface harm but need representative testing to estimate a pattern."},{"t":"One overall accuracy score calculated on the complete applicant population.","v":"wrong","fb":"Aggregation is the very step that can hide subgroup failure."},{"t":"Repeated subgroup error gaps across independent and relevant holdout samples.","v":"expert","fb":"Replication across relevant slices shows a stable performance pattern rather than anecdotes."},{"t":"The absence of a statistically perfect test, treated as permission to ignore the gap.","v":"danger","fb":"Uncertainty should shape decisions, not erase a reproduced and consequential disparity."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"The decisive table is the disaggregated holdout analysis preserved in the Model Evaluation Room before launch."}},{"q":"Who had authority to convert the validation warning into a launch decision?","o":[{"t":"The data engineer who prepared the historical records under the approved specification.","v":"partial","fb":"Data preparation contributed to risk, but the release authority acted after seeing validation results."},{"t":"The outside auditor scheduled to review the system after deployment began.","v":"wrong","fb":"A later auditor cannot be the actor who removed evidence before launch."},{"t":"Every applicant rejected by the model shares responsibility for not fitting its pattern.","v":"danger","fb":"People harmed by a model do not become responsible for its design or deployment."},{"t":"The project lead who controlled the evaluation packet and final scientific sign-off.","v":"expert","fb":"Responsibility follows control over the evidence and the decision to proceed despite it."}],"clue":{"category":"who","label":"WHO — corroboration","text":"The lead scientist removed the subgroup appendix from the release packet and signed the model as ready for deployment."}}]},"a_datacard":{"sci":"Timnit Gebru (b. 1983)","topic":"Datasheets, documentation, and accountable model release","lede":"Timnit Gebru argued that datasets need records of origin, composition, limits, and intended use just as engineered components need specifications.","no":3,"profile":"Timnit Gebru is a computer scientist whose work has connected machine learning with questions of documentation, labor, power, and social impact. After research on computer vision and the Gender Shades project, she coauthored “Datasheets for Datasets,” proposing a structured form of documentation for data used to train and evaluate machine-learning systems.\n\nThe analogy comes from engineering. Electronic components arrive with datasheets describing operating conditions, tolerances, and limitations. Datasets often circulate without comparable records. Gebru and her collaborators proposed documenting motivation, composition, collection process, preprocessing, recommended uses, prohibited or unsuitable uses, maintenance, and known distributional concerns. Documentation does not make data unbiased, but it makes assumptions visible and reviewable.\n\nThis approach changes release governance. A model card or dataset sheet can preserve intended populations, subgroup results, caveats, and monitoring plans. If a project removes the uncomfortable sections while retaining the headline metric, investigators can compare drafts, version history, and sign-off records. Silence then becomes an action rather than an accidental absence.\n\nAegis had such a trail. The validation draft listed underrepresentation, the subgroup false-rejection gap, and a recommendation to delay deployment until the target and sampling plan were revised. The final packet kept the overall accuracy chart but omitted that section. Version history attributes the deletion to Dr. Priya Sandoval, followed by her scientific release signature. Gebru’s documentation principle completes the causal chain: biased historical data created the exposure, disaggregated evaluation measured it, and controlled documentation shows who buried the result and where. The system did not run away, and the harmed applicants were not isolated edge cases. A known limitation was converted into a public decision by removing the record that would have forced reconsideration.","frame":"Opens two versions of the model card and highlights the missing subgroup section. “Documentation is evidence of what the team knew. A deletion can be a decision.”","q":[{"q":"What is the purpose of a datasheet for a machine-learning dataset?","o":[{"t":"To document origin, composition, intended uses, limitations, and maintenance.","v":"expert","fb":"Structured documentation makes assumptions and limits visible without claiming perfection."},{"t":"To replace technical testing with a short public-relations description of the model.","v":"wrong","fb":"Documentation supplements empirical evaluation rather than replacing it."},{"t":"To keep collection choices confidential so external criticism remains limited.","v":"danger","fb":"Concealing collection decisions undermines accountability and informed use."},{"t":"To certify that every label is objectively correct for all future applications.","v":"partial","fb":"A datasheet records label methods and uncertainty but cannot guarantee universal truth."}],"clue":{"category":"where","label":"WHERE — decisive","text":"Versioned model cards and evaluation appendices preserve the removed warning in the Model Evaluation Room’s release record."}},{"q":"Why is deleting a limitation from a release document evidentially important?","o":[{"t":"It makes the data engineer solely responsible because the warning concerned training data.","v":"danger","fb":"The warning’s subject does not transfer release responsibility away from the signer who removed it."},{"t":"It identifies who controlled known risk information at the moment of release.","v":"expert","fb":"Authorship and timing connect knowledge of the risk to the authority that suppressed it."},{"t":"It establishes that every earlier contributor considered the limitation unimportant.","v":"partial","fb":"A final deletion cannot establish agreement from contributors whose warning was removed."},{"t":"It shows an automated formatter removed text while reducing the release file size.","v":"wrong","fb":"Version history attributes a substantive edit, not an automatic formatting operation."}],"clue":{"category":"who","label":"WHO — decisive","text":"Version history ties the deletion and final scientific sign-off to Dr. Priya Sandoval."}},{"q":"What complete sequence best explains the Aegis outcome?","o":[{"t":"An external crew inserted poisoned records despite clean internal provenance logs.","v":"danger","fb":"Internal provenance and version history contradict an outside poisoning campaign."},{"t":"A technically strong model made several unavoidable mistakes among unusual applicants.","v":"partial","fb":"The failures were repeated by subgroup and cannot be reduced to a few unusual cases."},{"t":"Biased examples produced a measured disparity that leadership concealed before deployment.","v":"expert","fb":"The causal chain links data construction, evaluation, and a documented release decision."},{"t":"The system became self-aware and independently changed its hiring objective.","v":"wrong","fb":"The model optimized its assigned objective and showed no autonomous goal change."}],"clue":{"category":"what","label":"WHAT — decisive","text":"Historical selection shaped the data, subgroup testing exposed the resulting gap, and the warning was removed before launch."}}]}},"story":["<b>Aegis rejected thousands of qualified applicants while reporting an impressive overall accuracy score.<\/b>","The Data Engineer can reconstruct who entered the training archive. The Validation Scientist holds subgroup results. The records clerk has the model-card versions and release signature.","The system may have developed its own discriminatory objective, produced a few unavoidable edge cases, or learned a historical pattern that leadership measured and chose not to disclose.","Nine clues follow the outcome from data selection through subgroup testing to the final act of release."],"endings":{"overclaimWhat":"sentient","dismissalWhat":"edgecases","win":{"expertTitle":"The Warning Removed Before Launch","expert":["You connect Dr. Priya Sandoval, the Model Evaluation & Release Room, and biased training data whose measured subgroup disparity was hidden before launch. Dataset provenance, disaggregated testing, and version history form one chain.","Aegis did not develop an independent goal, and the rejected applicants were not a handful of unavoidable edge cases. Leadership saw a reproducible gap, removed it from the release record, and deployed the model unchanged."],"soundTitle":"The Measured Bias and Buried Result","sound":["Your accusation identifies the lead scientist, the evaluation record, and the concealed disparity.","Some data or version details remain incomplete, but the validation pattern supports the finding."],"namedTitle":"Correct Model Failure, Thin Record","named":["You select the correct WHO, WHERE, and WHAT.","The conclusion is right, although missed clues leave parts of the data-selection or document-deletion sequence less firmly established."]},"overclaim":{"title":"The Model Followed Its Assigned Target","body":["Training provenance and objective records show no autonomous goal change or self-directed rewrite.","The discrimination arose from approved examples and a launch decision, not a runaway intelligence."]},"dismissal":{"title":"The Errors Were Patterned, Not Rare","body":["Independent holdouts reproduce the same subgroup false-rejection gap, and the result was important enough to appear in the draft model card.","Calling the cases isolated mistakes ignores a measured system property and the decision to hide it."]},"wrongNames":{"title":"The Bias, Misassigned","body":["You recognize the concealed disparity but place responsibility or culmination away from the release authority and evaluation record that converted it into deployment."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"f_firmware","title":"The Halden Infusion Pump","discipline":"Embedded & Firmware Engineering","teaser":"A drug pump delivered a lethal dose while preserving a valid command record. Did an intruder alter the dose, did a rare bit error escape intact safeguards, or did a repeatable firmware path reach production after its independent backstop was removed?","overclaimTag":"an altered dose command","truthTag":"a reproducible timing defect without its watchdog","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"An infusion pump with a rising dose trace and a crossed-out watchdog circuit\"><g fill=\"none\" stroke=\"#e2e2d8\" stroke-width=\"1\"><path d=\"M20 112 H640\"/><path d=\"M80 20 V122 M160 20 V122 M240 20 V122 M320 20 V122 M400 20 V122 M480 20 V122 M560 20 V122\"/><\/g><g fill=\"none\" stroke=\"#121212\" stroke-width=\"1.7\"><rect x=\"70\" y=\"24\" width=\"178\" height=\"92\" rx=\"8\"/><rect x=\"92\" y=\"42\" width=\"90\" height=\"36\" rx=\"3\"/><circle cx=\"211\" cy=\"50\" r=\"8\"/><circle cx=\"211\" cy=\"75\" r=\"8\"/><path d=\"M248 66 H330 C345 66 351 79 351 91 V111\"/><path d=\"M351 111 C351 122 365 122 365 111\"/><rect x=\"430\" y=\"36\" width=\"118\" height=\"62\" rx=\"5\"/><path d=\"M446 67 H466 L478 53 L490 82 L504 60 L518 67 H535\"/><\/g><path d=\"M102 64 H120 L128 58 L137 70 L148 50 L158 64 H173\" fill=\"none\" stroke=\"#326891\" stroke-width=\"2\"/><g stroke=\"#B3261E\" stroke-width=\"2\" stroke-linecap=\"round\"><line x1=\"451\" y1=\"42\" x2=\"527\" y2=\"92\"/><line x1=\"527\" y1=\"42\" x2=\"451\" y2=\"92\"/><\/g><path d=\"M365 111 C382 99 392 96 402 84 C416 68 422 52 430 44\" fill=\"none\" stroke=\"#B3261E\" stroke-width=\"2\"/><\/svg>","venue":"the infusion-pump firmware inquiry","agent":{"name":"Investigator Dana Voss","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Firmware & Coding Pioneers","dossierName":"FIRMWARE, CODING & HARDWARE PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the infusion-pump firmware inquiry","DAYS_TOTAL":3,"overclaimTease":"A clean command can still be unsafe. Separate corrupted data from deterministic logic, then locate where the failing sequence and missing hardware backstop were verified together.","CATS":{"who":{"title":"Who is behind it","truth":"firmlead","items":[{"id":"firmlead","label":"Cal Devereux — the embedded firmware engineer"},{"id":"tamperer","label":"An outside device tamperer"},{"id":"regulator","label":"The medical-device regulator"}]},"where":{"title":"Where it culminates","truth":"firmlab","items":[{"id":"bench","label":"The Device & Hardware Test Bench"},{"id":"office","label":"The Engineering Release Office"},{"id":"firmlab","label":"The Firmware Verification Laboratory"}]},"what":{"title":"What is happening","truth":"defect","items":[{"id":"tamper","label":"An intruder changed the dose command after release"},{"id":"defect","label":"A known timing fault shipped after its watchdog was removed"},{"id":"glitch","label":"A rare bit error defeated otherwise intact protections"}]}},"READING_ORDER":["firmeng","hwtech","clerk"],"CHARACTERS":{"firmeng":{"name":"The Firmware Engineer","role":"Embedded firmware engineer","face":"💾","badge":"F","legend":"the release console","hint":"Reproduced the same lethal scheduling path and closed the test under his own release credential.","reading":"m_hamming"},"hwtech":{"name":"The Hardware Test Engineer","role":"Hardware test engineer","face":"🔌","badge":"H","legend":"the safety board","hint":"Compared board revisions and found the independent watchdog missing from the production unit.","reading":"m_faulttol"},"clerk":{"name":"The Clerk","role":"Design records clerk","face":"🗂","badge":"C","legend":"the verification archive","hint":"Holds the defect disposition, the cost waiver, and the final authorization in one file.","reading":"m_microprog"}},"TOPICS":{"m_hamming":{"sci":"Richard Hamming (1915-1998)","topic":"Error-detecting & correcting codes","lede":"A ruined weekend computation pushed Richard Hamming to make machines locate their own corrupted bits.","no":1,"profile":"Richard Hamming arrived at Bell Telephone Laboratories after wartime work on the Manhattan Project and became an energetic advocate for electronic computation. In 1947 he expected a relay computer to spend the weekend processing colleagues' calculations. Instead, a detected error stopped the machine early, leaving Monday morning with no useful results. Hamming's frustration became a precise question: if a computer could notice that something was wrong, why could it not determine which bit was wrong and repair it?\n\nOrdinary parity adds one check bit that reveals whether an odd number of bits has flipped, but it does not identify the damaged position. Hamming arranged several parity checks over overlapping groups of data bits. A single flipped bit then fails a distinctive combination of checks. Read together, those failures form a syndrome: a compact address of the bad position. With enough separation between valid codewords—what became known as Hamming distance—a receiver can distinguish a valid word from a nearby corrupted one and correct a single-bit error.\n\nThe method also teaches what error-correcting codes do not prove. They protect representations of data against certain changes in storage or transmission. They do not detect a program that follows its own instructions and computes the wrong but perfectly well-formed value. A dosage command can pass parity, checksum, and format tests while still being unsafe if a timing path or state transition produces it deterministically.\n\nThat distinction matters in this inquiry. A random memory upset should leave evidence in protection checks or vary unpredictably. A failure that returns under the same scheduling sequence, while its command word remains internally valid, points elsewhere. Hamming's lesson is to separate corrupted data from incorrect logic before blaming either a mysterious intruder or unpreventable chance.","frame":"Slides three identical trace printouts beside a parity report. “One of these stories is random corruption. The other is a machine doing exactly what its code permits. Tell me which evidence separates them.”","q":[{"q":"How can a Hamming code locate a single flipped bit rather than merely notice an error?","o":[{"t":"The processor reruns the calculation and assumes the second result is accurate.","v":"danger","fb":"Rerunning may reproduce a deterministic software fault and offers no correction rule for corrupted data."},{"t":"Overlapping parity checks fail in a pattern that identifies the bit position.","v":"expert","fb":"The combined parity failures form a syndrome whose binary pattern points to the corrupted position."},{"t":"A repeated copy is compared byte by byte until the first mismatch appears.","v":"partial","fb":"Duplication can reveal disagreement, but it does not by itself tell which copy or bit is correct."},{"t":"A checksum is recomputed after every instruction and names the faulty address.","v":"wrong","fb":"A checksum can flag changed data, but standard checksums do not directly encode the bad bit's location."}],"clue":{"category":"who","label":"WHO clue","text":"The repeatable failures were closed under the credential of the person who owned the release gate—not by anyone outside the device team."}},{"q":"The pump issues the same excessive command whenever two tasks overlap, yet every parity check passes. What does Hamming's distinction suggest?","o":[{"t":"The trace is inconclusive until an outside attacker is ruled out by network logs.","v":"partial","fb":"Network evidence matters, but deterministic reproduction already weighs strongly against a stray altered bit."},{"t":"The same memory cell is probably struck by radiation during each task overlap.","v":"danger","fb":"Radiation-induced bit flips are not expected to recur on command under one software scheduling pattern."},{"t":"The command is likely valid data produced by a repeatable logic or timing fault.","v":"expert","fb":"Protection bits can remain correct when software consistently computes an unsafe but well-formed value."},{"t":"The parity system is probably broken because unsafe values ought to fail its checks.","v":"wrong","fb":"Parity tests data integrity, not whether the program's intended computation is medically safe."}],"clue":{"category":"what","label":"WHAT clue","text":"The dangerous dose reappeared under one scheduling pattern while its parity remained clean; Hamming's test points away from a stray bit."}},{"q":"What evidence would most strongly support a genuine single-bit corruption in a protected dose word?","o":[{"t":"A tester recalls one earlier anomaly without a reproducible trace or preserved data.","v":"partial","fb":"An anecdote may justify investigation, but it lacks the syndrome needed to diagnose a bit error."},{"t":"The same overdose appears whenever the logging task interrupts the dose task.","v":"danger","fb":"A trigger tied to task timing is evidence of program behavior rather than isolated data corruption."},{"t":"The command is clinically wrong but still matches every stored check bit exactly.","v":"wrong","fb":"A fully consistent codeword offers no Hamming-code evidence that a protected bit changed."},{"t":"A nonzero syndrome identifies one position, and correction restores a valid word.","v":"expert","fb":"That is the signature Hamming coding was designed to expose and repair."}],"clue":{"category":"where","label":"WHERE clue","text":"The bench data passed its protection checks; the decisive disposition and repeatable traces are joined in the controlled release-evidence set."}}]},"m_faulttol":{"sci":"Algirdas Avizienis (b. 1932)","topic":"Fault-tolerant computing","lede":"Algirdas Avizienis treated failure as a chain that careful architecture could interrupt before harm reached the user.","no":2,"profile":"Algirdas Avizienis was born in Kaunas, Lithuania, and reached the United States in 1950 after years in displaced-person camps in Germany. He studied electrical engineering at the University of Illinois, contributed to the ILLIAC II computer, and developed signed-digit arithmetic for faster calculation. After joining UCLA in 1962, he became one of the defining researchers in fault-tolerant computer architecture.\n\nFault tolerance begins by separating three stages that everyday speech often blends together. A fault is the underlying cause: a defective component, an incorrect design decision, or a software bug. When activated, the fault creates an erroneous internal state. If that error reaches the system's external service, the user experiences a failure. Designers cannot promise that faults will never exist, so they build barriers that detect, contain, mask, or recover from errors before service becomes unsafe.\n\nAvizienis studied redundancy in both hardware and software. Independent checking, replicated computations, voting, recovery blocks, and later N-version programming all pursue the same broad aim: one fault should not be allowed to dictate the final output unchecked. Independence is the difficult part. Two channels that share the same mistaken requirement or the same power source may fail together. A watchdog—a separate circuit that expects periodic signs of healthy operation—can be valuable precisely because it stands outside the main software path and can force a safe state when timing goes wrong.\n\nFor an infusion pump, the central question is not whether the firmware contained a fault; complex systems often do. It is whether the design still had an independent barrier between that fault and a patient. Avizienis's fault-error-failure chain makes the missing link visible. If a known software condition became lethal only after an external checker was deleted, calling the event either pure sabotage or meaningless bad luck misses the architecture that converted an internal error into delivered harm.","frame":"Sets the production board beside an earlier revision and taps the empty footprint near the timer line. “A fault is not yet a failure. Show me where the chain was supposed to break.”","q":[{"q":"In Avizienis's framework, which sequence correctly describes how harm emerges from a latent defect?","o":[{"t":"A fault activates, creates an internal error, and the error reaches service as failure.","v":"expert","fb":"The distinction matters because defenses can interrupt the chain between fault, error, and visible failure."},{"t":"A failure appears first, then engineers infer an error and finally document a fault.","v":"partial","fb":"That may describe an investigation's chronology, but not the causal sequence inside the system."},{"t":"An error and a fault are interchangeable terms until a user reports an injury.","v":"wrong","fb":"Dependability analysis separates the cause from the incorrect state it produces."},{"t":"A fault becomes a failure when an attacker deliberately activates the vulnerable feature.","v":"danger","fb":"Design faults can activate through ordinary operating conditions without malicious intervention."}],"clue":{"category":"what","label":"WHAT clue","text":"One internal timing error reached the patient only after the independent checker vanished; Avizienis would call that a broken containment chain."}},{"q":"Why is an independent hardware watchdog different from simply adding another software check?","o":[{"t":"It indicates the firmware is defect-free because hardware timing is deterministic.","v":"wrong","fb":"A watchdog limits consequences; it does not establish that the monitored software is defect-free."},{"t":"It can detect missed timing from outside the code path and force a safe state.","v":"expert","fb":"A checker outside the failing software can still act when that software stalls or runs out of sequence."},{"t":"It duplicates the same program so both copies agree on the calculated dose.","v":"danger","fb":"Identical copies can repeat the same design mistake and therefore lack useful independence."},{"t":"It records each instruction for later review without changing pump operation.","v":"partial","fb":"Logging helps reconstruction, while a true watchdog can intervene before unsafe service is delivered."}],"clue":{"category":"where","label":"WHERE clue","text":"The watchdog deletion is documented beside the failed timing test in the controlled release archive."}},{"q":"Which design change most clearly reduces fault tolerance even if the main firmware is unchanged?","o":[{"t":"Replacing a status lamp with a lower-power lamp of the same specification.","v":"wrong","fb":"A like-for-like indicator change does not remove a barrier in the dose-control path."},{"t":"Increasing log storage so more diagnostic records survive after treatment.","v":"partial","fb":"Better evidence aids investigation, but it does not itself stop an unsafe command from reaching the patient."},{"t":"Removing the separate watchdog that resets the pump after a missed deadline.","v":"expert","fb":"The main fault remains, but deleting an independent recovery barrier makes its consequences far more severe."},{"t":"Encrypting service traffic while keeping the timing monitor fully independent.","v":"danger","fb":"Security can matter, yet this change leaves the relevant fault-containment mechanism intact."}],"clue":{"category":"who","label":"WHO clue","text":"The same release authority accepted the unresolved timing fault and signed the waiver removing its independent backstop."}}]},"m_microprog":{"sci":"Maurice Wilkes (1913-2010)","topic":"Microprogramming & stored control","lede":"Maurice Wilkes showed that a computer's control logic could be written, revised, and therefore audited like a program.","no":3,"profile":"Maurice Wilkes returned to Cambridge after the Second World War determined to build a practical stored-program computer. After attending the Moore School lectures in Philadelphia in 1946, he led the construction of EDSAC at the University of Cambridge Mathematical Laboratory. The machine ran its first programs in May 1949 and soon became a working scientific service rather than a laboratory demonstration. Wilkes and colleagues also produced an early textbook on programming, complete with reusable subroutines and attention to the stubborn labor of debugging.\n\nEarly processors controlled their internal steps with complicated networks of gates and timing signals. Wilkes proposed microprogramming: represent those low-level control sequences as words in a control store. Each microinstruction activates selected operations—move a value, select an arithmetic function, advance a sequence—and a succession of microinstructions implements a machine instruction. The approach made control units more systematic. Behavior that would otherwise be buried in wiring could be specified as an ordered body of control information.\n\nThat change created a powerful investigative idea. When control is stored, versions matter. A machine can behave differently because its control sequence changed even though its visible hardware looks the same. Engineers can compare revisions, trace which branch executed, and ask who authorized a particular control image. Conversely, a perfectly authentic image may still contain a flawed sequence; authenticity and correctness are separate questions.\n\nModern infusion pumps do not use Wilkes's original diode-matrix control stores, but their firmware inherits the same principle: behavior is embodied in a specific, versioned set of instructions. The inquiry therefore turns on provenance. Which build was tested, which build shipped, what defect disposition accompanied it, and who approved the final combination? Wilkes's legacy directs attention away from dramatic speculation and toward the mundane but decisive chain linking source, compiled image, release record, and device behavior.","frame":"Opens a release binder to three version hashes and a handwritten disposition code. “Hardware can look unchanged while stored control tells a different story. Reconstruct which version became the machine.”","q":[{"q":"What was the central advantage of Wilkes's microprogramming idea for processor control?","o":[{"t":"Programs no longer needed memory because every instruction was rebuilt from switches.","v":"wrong","fb":"Microprogramming still depends on stored control information and does not eliminate program memory."},{"t":"Each user program gained direct authority to rewire the processor during execution.","v":"danger","fb":"The control store structures internal operation; ordinary applications do not freely rewire the machine."},{"t":"The arithmetic unit could correct any wrong result by repeating the last instruction.","v":"partial","fb":"Repeatability may aid diagnosis, but microprogramming is a method of organizing control, not universal correction."},{"t":"Control sequences could be written as microinstructions rather than fixed wiring alone.","v":"expert","fb":"Microprogramming made low-level processor behavior systematic and revisable through a control store."}],"clue":{"category":"where","label":"WHERE clue","text":"The shipped control image, reproducible trace, and defect closure are bound together in the signed verification record."}},{"q":"Two pumps have identical circuit boards but different signed firmware hashes. What would Wilkes's insight make investigators compare first?","o":[{"t":"The stored control versions and the exact branch sequence each version executes.","v":"expert","fb":"Identical hardware can deliver different behavior when its versioned control instructions differ."},{"t":"The patient's chart first, because a signed build is assumed free of internal defects.","v":"danger","fb":"A valid signature proves provenance, not that the signed program is correct or safe."},{"t":"The battery voltage, since software hashes change whenever supply voltage drifts.","v":"wrong","fb":"A cryptographic hash changes with the software image, not with ordinary operating voltage."},{"t":"The paint, serial labels, and enclosure screws for evidence of physical entry.","v":"partial","fb":"Physical inspection can test tampering, but it does not explain version-dependent control behavior."}],"clue":{"category":"what","label":"WHAT clue","text":"The production hash matches the authorized build exactly; the unsafe control path was inside the approved image rather than inserted afterward."}},{"q":"Which record best establishes who was responsible for the control image that reached production?","o":[{"t":"A regulator's later inspection report describing the pump after the overdose occurred.","v":"danger","fb":"Post-event oversight does not establish who approved the pre-event production configuration."},{"t":"The release manifest linking the signed build, defect disposition, and approver.","v":"expert","fb":"That chain connects the executable image to the decision that allowed it into production."},{"t":"A network scan showing no unknown device connected during the patient's treatment.","v":"wrong","fb":"The scan can weaken an intrusion theory but cannot assign responsibility for the shipped build."},{"t":"A laboratory notebook showing who first observed the timing anomaly months earlier.","v":"partial","fb":"Discovery history matters, but it does not identify the authority who released the final image."}],"clue":{"category":"who","label":"WHO clue","text":"The decisive manifest belongs to the lead who controlled firmware releases, not to the later regulator or an unseen intruder."}}]}},"story":["<b>At 02:14, the Halden pump delivered a dose its patient never survived while every command checksum remained valid.<\/b>","The Firmware Engineer has three matching execution traces. The Hardware Test Engineer has two board revisions. The Clerk can join both to the verification and release record.","The command may have been altered after release, a rare bit may have flipped, or a known internal schedule may have escaped after its independent checker disappeared.","Nine clues follow the value from protected data through control logic and hardware containment to the person who closed the failing test."],"endings":{"overclaimWhat":"tamper","dismissalWhat":"glitch","win":{"expertTitle":"The Failure Verified and Shipped","expert":["You connect Cal Devereux, the Firmware Verification Laboratory, and a known timing fault shipped after its watchdog was removed. Repeatable traces, clean protection checks, board revisions, and defect closure form one chain.","The dose was not rewritten after release, and a stray bit did not defeat intact safeguards. The embedded engineer closed a deterministic failure while the independent timing backstop was removed from production."],"soundTitle":"The Deterministic Dose Path","sound":["Your accusation identifies the engineer, the verification laboratory, and the timing defect without its watchdog.","Some release details remain incomplete, but repeatability and the missing independent checker support the verdict."],"namedTitle":"Correct Fault, Limited Chain","named":["You select the correct WHO, WHERE, and WHAT.","The conclusion is right, although missed clues leave parts of the test closure or board revision less firmly established."]},"overclaim":{"title":"The Production Image Was Not Altered","body":["The signed build matches the authorized release and the failure repeats under one internal task schedule.","An intrusion story cannot explain why the same valid command arises from approved code and hardware."]},"dismissal":{"title":"Chance Does Not Repeat on Demand","body":["The excessive dose returns under the same task overlap while parity and image checks remain clean.","A rare bit error cannot account for the known deterministic path or the removed watchdog that once contained it."]},"wrongNames":{"title":"The Fault, Misassigned","body":["You recognize the timing defect and missing watchdog but place responsibility or culmination away from the engineer and verification record that closed the failing condition."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"f_robot","title":"The Cell-9 Robot","discipline":"Robotics & Autonomous Systems","venue":"the Cell-9 robotics inquiry","agent":{"name":"Investigator Mara Quint","role":"Investigator's Notepad"},"standingLabel":"Inquiry credibility","readingShort":"Pioneers","readingLabel":"Robotics & Autonomy Pioneers","dossierName":"ROBOTICS & AUTONOMY PIONEERS","enterLabel":"Open the inquiry","subt":"A deduction game inside the Cell-9 robotics inquiry","DAYS_TOTAL":3,"teaser":"A robot arm killed a technician inside a guarded maintenance cell. Did an outside intruder take control, did plant staff bypass a safety interlock for production, or did the worker enter a cell whose protections were functioning correctly?","overclaimTag":"a remote robot takeover","truthTag":"a stolen service account that changed the robot’s map","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"An industrial robot arm moving inside a guarded cell while a remote command enters the controller\"><rect x=\"55\" y=\"24\" width=\"350\" height=\"96\" fill=\"none\" stroke=\"#e2e2d8\" stroke-width=\"2\" stroke-dasharray=\"7 5\"/><circle cx=\"145\" cy=\"96\" r=\"22\" fill=\"none\" stroke=\"#121212\" stroke-width=\"3\"/><path d=\"M145 74 l55-34 46 30 54-24\" fill=\"none\" stroke=\"#121212\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"200\" cy=\"40\" r=\"8\" fill=\"#326891\"/><circle cx=\"246\" cy=\"70\" r=\"8\" fill=\"#326891\"/><path d=\"M300 46 l25-8 -8 25\" fill=\"none\" stroke=\"#121212\" stroke-width=\"3\"/><rect x=\"470\" y=\"45\" width=\"120\" height=\"62\" rx=\"6\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M405 75 H470\" stroke=\"#B3261E\" stroke-width=\"4\"/><path d=\"M445 62 l15 13 -15 13\" fill=\"none\" stroke=\"#B3261E\" stroke-width=\"3\"/><\/svg>","overclaimTease":"Unexpected motion is not enough to prove a hack. Follow the command provenance, state estimates, and safety-map changes until one control path explains all three.","CATS":{"who":{"title":"Who is behind it","truth":"hacker","items":[{"id":"automation","label":"Guy Halloran — the plant automation manager"},{"id":"worker","label":"The maintenance crew inside Cell 9"},{"id":"hacker","label":"An outside intruder using a stolen service account"}]},"where":{"title":"Where it culminates","truth":"controls","items":[{"id":"controls","label":"The Robot Controller & Remote-Service Logs"},{"id":"cell","label":"The Robot Cell & Safety Cage"},{"id":"office","label":"The Automation Manager’s Office"}]},"what":{"title":"What happened","truth":"hack","items":[{"id":"hack","label":"A remote intruder altered the safety map and motion program"},{"id":"interlock","label":"Plant staff bypassed a known interlock to maintain production"},{"id":"operator","label":"The technician entered a correctly protected operating cell"}]}},"READING_ORDER":["technician","controls2","clerk"],"CHARACTERS":{"technician":{"name":"The Robot Technician","role":"Robotics maintenance technician","face":"🤖","badge":"R","legend":"the guarded cell","hint":"The crew entered under approved maintenance mode before an unknown remote session loaded a new job.","reading":"r_firstrobot"},"controls2":{"name":"The Controls Engineer","role":"Control-systems engineer","face":"🎛","badge":"E","legend":"the controller trace","hint":"Desired, estimated, and measured motion agree; the change began in commands, not sensors or mechanics.","reading":"r_kalman"},"clerk":{"name":"The Security Records Clerk","role":"Remote-access and safety-records clerk","face":"🗂","badge":"C","legend":"the service archive","hint":"A stolen vendor account changed the exclusion map and launched the motion from outside the plant.","reading":"r_motion"}},"TOPICS":{"r_firstrobot":{"sci":"George Devol (1912-2011)","topic":"The first industrial robot and recorded control","lede":"George Devol imagined a programmable machine that could repeat dangerous factory motions from stored instructions rather than human muscle.","no":1,"profile":"George Devol was an American inventor whose 1954 patent for a “Programmed Article Transfer” device became the foundation of the industrial robot. Devol combined a mechanical arm, hydraulic power, and a programmable memory that could store a sequence of positions and actions. With entrepreneur Joseph Engelberger, he developed the Unimate, first installed at a General Motors plant in 1961 to handle hot die-cast parts and other unpleasant, hazardous work.\n\nThe novelty was not simply an arm. Factories already used fixed automation. Devol’s machine could be taught a sequence, replay it, and be reassigned. That flexibility also created a new safety problem. A powerful arm may appear still while holding an executable program, and its next motion can begin faster than a nearby worker can react. Industrial cells therefore use guarded spaces, interlocks, teach modes, reduced-speed operation, and carefully controlled program changes.\n\nProgrammability leaves evidence. Controllers store job files, command histories, mode changes, timestamps, and sometimes checksums or signatures. A mechanical fault can cause a commanded move to be executed poorly; an altered program changes what the controller intended to do. Investigators must separate those layers by comparing the stored path, the issued command, and the measured motion.\n\nIn Cell 9, the arm did not merely drift or repeat an old maintenance cycle. The controller loaded a new motion block while the technician was inside the cage, then received a remote start through a service account. The gate interlock reported closed because its safety map had been changed in software, not because a maintainer jumpered the switch. Devol’s architecture makes the distinction precise: identify who changed the stored instructions, and the machine’s deadly movement stops looking like either spontaneous autonomy or a worker’s careless step.","frame":"Pulls the active job file beside the archived production version. “A robot does not ‘decide’ to invent a new path. Someone changed the instructions it was built to repeat.”","q":[{"q":"What made Devol’s industrial robot different from fixed factory automation?","o":[{"t":"Stored instructions let the same machine replay and change programmed motion sequences.","v":"expert","fb":"Devol’s key advance was reprogrammable stored control, not independent intention."},{"t":"The arm understood spoken goals and planned factory work without any programming.","v":"wrong","fb":"Unimate followed taught instructions and did not understand open-ended spoken goals."},{"t":"A programmable robot can create any motion it wants once no supervisor watches the cell.","v":"danger","fb":"Programmability expands possible behavior without making the controller self-willed."},{"t":"Hydraulic power allowed the arm to lift heavier parts than most human workers.","v":"partial","fb":"Power mattered for industrial use, but programmability distinguished the machine concept."}],"clue":{"category":"what","label":"WHAT — lead","text":"The fatal path appears as a newly loaded program block rather than a mechanical deviation from the approved job."}},{"q":"Which evidence separates an altered program from a mechanical motion fault?","o":[{"t":"A gearbox temperature alarm appears several minutes after the collision occurs.","v":"wrong","fb":"A later temperature alarm cannot explain the origin of the earlier command sequence."},{"t":"The commanded trajectory differs from the approved file before the arm begins moving.","v":"expert","fb":"A changed command establishes altered intent at the controller layer before mechanics execute it."},{"t":"Any unexpected motion should be treated as proof the robot was remotely controlled.","v":"danger","fb":"Unexpected behavior has many causes; command provenance is needed to prove takeover."},{"t":"The arm reaches a position slightly slower than its maintenance specification allows.","v":"partial","fb":"Timing variation may indicate wear but does not show that the intended path changed."}],"clue":{"category":"where","label":"WHERE — lead","text":"The approved path and the newly loaded block can be compared inside the robot-control and remote-service logs."}},{"q":"What first fact points away from maintenance-crew error and toward an outside actor?","o":[{"t":"The victim had worked on the same robot during several earlier scheduled shutdowns.","v":"wrong","fb":"Prior work establishes familiarity, not responsibility for this new program."},{"t":"The worker’s presence inside the cage establishes acceptance of every movement risk.","v":"danger","fb":"Authorized entry does not waive safeguards or imply consent to unexpected powered motion."},{"t":"A remote session loads the new job after local staff enter protected maintenance mode.","v":"expert","fb":"The timing and origin of the remote change separate local maintenance from the outside command."},{"t":"The technician carries tools that could physically reach the gate-switch hardware.","v":"partial","fb":"Physical access creates opportunity but does not match the recorded software intervention."}],"clue":{"category":"who","label":"WHO — lead","text":"The service account entered from an external address after the crew had locked the cell and begun the approved inspection."}}]},"r_kalman":{"sci":"Rudolf Kálmán (1930-2016)","topic":"State estimation and traceable sensor fusion","lede":"Rudolf Kálmán created a filter that continually compares a system’s predicted state with new measurements and preserves the corrections.","no":2,"profile":"Rudolf E. Kálmán was a Hungarian-American electrical engineer and mathematician whose 1960 work on recursive estimation became central to navigation, control, robotics, and signal processing. A control system rarely observes its true state directly. Sensors are noisy, some variables are hidden, and motion unfolds between measurements. The Kalman filter predicts the next state from a mathematical model, compares that prediction with a new measurement, and weights the correction according to uncertainty.\n\nThe method is recursive: it updates a compact state estimate rather than reprocessing the entire history. During the Apollo program, related estimation techniques helped navigation computers combine inertial measurements and tracking data. Modern robots use Kalman-family filters to estimate joint motion, vehicle position, target location, and equipment condition from imperfect streams.\n\nEstimation also supplies a forensic discipline. Investigators should distinguish the controller’s desired state, the estimator’s believed state, and the physical system’s measured state. If all three align during an unexpected movement, a random sensor hallucination is less plausible. If the desired path changes first and sensors accurately report the arm following it, the anomaly entered through commands. Conversely, a sensor fault may show implausible innovations—large differences between prediction and measurement—without a corresponding program change.\n\nCell 9’s logs contain that layered sequence. Joint encoders, current sensors, and the state estimator agreed that the arm followed the newly loaded path. No sudden localization jump preceded the motion. The safety-zone representation changed during the same authenticated remote session that inserted the job block. Kálmán’s framework therefore rules out a robot confused about where it was. The machine knew its state and executed a coherent command. The remaining question is whose credentials and network route supplied that command, evidence preserved in the control room rather than on the victim’s tools.","frame":"Plots desired joint angles, estimated state, and encoder measurements on one screen. “Three traces agree. The robot was not lost; it was told to go there.”","q":[{"q":"What does a Kalman filter do when new sensor data arrive?","o":[{"t":"It removes all noise and reconstructs the exact physical state without uncertainty.","v":"wrong","fb":"State estimation reduces uncertainty but never makes observation exact."},{"t":"It labels any surprising measurement as an attack and discards it automatically.","v":"danger","fb":"An innovation is evidence to evaluate, not automatic proof of malicious control."},{"t":"It averages every sensor equally so no single instrument can dominate the result.","v":"partial","fb":"Equal averaging ignores differences in sensor quality and predicted uncertainty."},{"t":"It combines prediction and measurement according to their estimated uncertainties.","v":"expert","fb":"The filter weights model and measurement rather than trusting either one absolutely."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"Predicted, estimated, and measured joint states remain consistent while the commanded path itself changes."}},{"q":"Which trace pattern would indicate a command change rather than sensor confusion?","o":[{"t":"The desired path changes while estimated and measured motion agree with it.","v":"expert","fb":"Agreement in following a changed command locates the anomaly at the command layer."},{"t":"One encoder briefly disagrees with the other sensors before returning to normal.","v":"partial","fb":"A brief sensor disagreement points toward measurement quality, not necessarily new intent."},{"t":"The estimator shows a large residual while the controller requests no movement.","v":"wrong","fb":"A residual without a command change is more consistent with sensing or modeling error."},{"t":"Every measurement remains constant, so investigators infer an invisible motion occurred.","v":"danger","fb":"Constant measurements provide no basis for claiming an unobserved physical movement."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"Control-room logs show the desired trajectory changed first, followed normally by estimator and encoder response."}},{"q":"What evidence ties the altered safety map to the same actor as the fatal motion?","o":[{"t":"Both files were stored on equipment supplied by the robot manufacturer.","v":"partial","fb":"Common hardware ownership does not identify who made the changes."},{"t":"The same authenticated session edits both files and launches the new sequence.","v":"expert","fb":"Shared session provenance joins the barrier removal and motion command to one operator."},{"t":"The technician had previously requested a safer maintenance-zone layout.","v":"wrong","fb":"A safety request points away from creating the dangerous configuration."},{"t":"Anyone who knew the cell dimensions could have changed the software anonymously.","v":"danger","fb":"Knowledge creates possibility, while authentication and timing identify the actual session."}],"clue":{"category":"who","label":"WHO — corroboration","text":"One remote session changed both the protected-zone file and the executable job before issuing start."}}]},"r_motion":{"sci":"Oussama Khatib (b. 1950)","topic":"Robot motion and obstacle avoidance","lede":"Oussama Khatib taught robots to treat nearby obstacles as forces that reshape motion before contact occurs.","no":3,"profile":"Oussama Khatib is a roboticist known for influential work on motion control, manipulation, and human-robot interaction. In the 1980s he developed the artificial potential field approach to real-time obstacle avoidance. A goal can be represented as an attractive potential and obstacles as repulsive potentials. The robot follows the resulting gradient, continually adjusting its path as geometry changes. The method has limitations, including local minima, but it helped move collision avoidance from offline path planning into responsive control.\n\nKhatib also developed operational-space control, which expresses robot tasks in terms of end-effector position, force, and motion rather than only joint coordinates. These ideas support robots that manipulate objects, share spaces, and react to contact while respecting physical constraints. Safety depends on accurate models of the environment and on trusted boundaries defining where people may be.\n\nA safety zone is therefore not decorative metadata. It changes which trajectories are considered permissible. If an authenticated update erases a protected volume, a planner may generate a mathematically smooth path straight through a person’s workspace. The resulting movement can look technically perfect: no joint fault, no unstable controller, no unexpected obstacle according to the altered map.\n\nThat is what the final Cell 9 evidence shows. The technician’s presence was visible to a separate cage sensor, but the remote session removed the corresponding exclusion volume from the robot controller. The new path passed through that space and was executed at production speed. Network records then trace the service credential to an external contractor account reused from a breached vendor portal. Khatib’s lesson prevents a misleading conclusion that the worker simply stepped into an unknowable machine path. The path was made legal inside the controller by someone who changed the environment the robot was allowed to believe.","frame":"Overlays the original and altered exclusion volumes on the arm’s path. “The motion was smooth because the map had been made dangerous. Find who redrew the world.”","q":[{"q":"How do artificial potential fields guide a robot around obstacles?","o":[{"t":"Every obstacle is converted into a fixed joint-angle limit before operation begins.","v":"partial","fb":"Joint limits matter, but they are not the same as representing workspace obstacles."},{"t":"The arm waits for physical contact and then calculates where the obstacle was.","v":"wrong","fb":"Reactive contact may reduce harm but does not provide pre-contact avoidance."},{"t":"Goals attract the path while modeled obstacles repel it during motion planning.","v":"expert","fb":"Potential fields reshape the planned path using goal attraction and obstacle repulsion."},{"t":"The planner ignores mapped obstacles whenever the shortest path reaches the goal faster.","v":"danger","fb":"Discarding obstacles for speed would invert the safety purpose of the planner."}],"clue":{"category":"where","label":"WHERE — decisive","text":"The original and altered protected-zone maps, motion plan, and remote edits all survive in the control system."}},{"q":"What happens if a valid safety exclusion volume is removed from the robot’s map?","o":[{"t":"The arm stops by default because missing map data are treated as occupied space.","v":"partial","fb":"Some systems default safely, but this controller treated the deleted zone as free space."},{"t":"The graphical display changes while executable motion remains unaffected by maps.","v":"wrong","fb":"The safety map directly constrains which trajectories the controller may execute."},{"t":"The worker becomes responsible because software no longer recognizes the protected area.","v":"danger","fb":"A removed safeguard does not transfer responsibility to the person it was meant to protect."},{"t":"The planner may generate a smooth trajectory through space that should remain protected.","v":"expert","fb":"Planning is only as safe as the environment and constraints represented to it."}],"clue":{"category":"what","label":"WHAT — decisive","text":"A remote edit made the victim’s maintenance space permissible, after which the controller planned and executed a coherent lethal path."}},{"q":"Which chain most directly identifies the external attacker?","o":[{"t":"Vendor-portal compromise links the service credential, network route, edits, and start.","v":"expert","fb":"The end-to-end digital provenance ties the external account to the dangerous actions."},{"t":"The robot manufacturer is responsible automatically because it designed the controller.","v":"danger","fb":"Design responsibility and authorship of a specific intrusion are different questions."},{"t":"The automation manager approved the vendor’s ordinary remote-maintenance contract.","v":"partial","fb":"Contract approval enabled access but does not identify the attacker who abused it."},{"t":"The technician’s badge opened the cage shortly before the remote session began.","v":"wrong","fb":"Badge access explains lawful entry, not the later remote software changes."}],"clue":{"category":"who","label":"WHO — decisive","text":"A breached vendor account, matching network address, file edits, and launch command form one continuous remote session."}}]}},"story":["<b>A robot arm accelerated through a technician inside a cell that had been placed in maintenance mode.<\/b>","The Robot Technician holds the approved job files. The Controls Engineer can separate command from sensor error. The security clerk has the remote-service and account history.","The arm may have been seized from outside, locally stripped of its interlock, or encountered a worker who entered a correctly protected cell.","Nine clues reconstruct who changed the robot’s internal map, where the command entered, and why the motion looked mechanically normal."],"endings":{"overclaimWhat":"interlock","dismissalWhat":"operator","win":{"expertTitle":"The Remote Path Into Cell 9","expert":["You connect the outside intruder, the Robot Controller & Remote-Service Logs, and a takeover that altered both the safety map and motion program. Command, state, network, and account records form one continuous session.","Plant management did not jumper the gate for production, and the technician did not enter an actively protected cell carelessly. A stolen vendor credential made the protected space appear free and then started the robot."],"soundTitle":"The Stolen Service Session","sound":["Your accusation identifies the intruder, the controller logs, and the altered map and job file.","Some account or motion details remain incomplete, but the remote provenance supports the verdict."],"namedTitle":"Correct Intrusion, Limited Trace","named":["You select the correct WHO, WHERE, and WHAT.","The call is right, although missed clues leave parts of the credential compromise or controller sequence underdeveloped."]},"overclaim":{"title":"No Local Interlock Jumper Caused This Motion","body":["The physical gate circuit remained in maintenance state, while the controller’s software exclusion map was changed remotely.","A familiar safety-bypass story misses the authenticated outside session that created and launched the path."]},"dismissal":{"title":"The Technician Entered Under Approved Maintenance Mode","body":["Badge, lockout, and work records show authorized entry before the remote changes began.","The victim’s presence does not explain why the controller erased the protected zone and issued production-speed motion."]},"wrongNames":{"title":"The Takeover, Mislocated","body":["You recognize malicious control but assign it away from the outside account and controller records that preserve the complete intrusion path."]}}},{"schemaVersion":3,"mode":"three_informants_three_readings","id":"j_press","title":"The Ashford Dispatch","discipline":"Journalism Ethics & Verification","venue":"the Ashford Dispatch review","agent":{"name":"Investigator Nadia Kerr","role":"Investigator's Notepad"},"standingLabel":"Newsroom credibility","readingShort":"Editors","readingLabel":"Figures of the Free Press","dossierName":"FIGURES OF THE FREE PRESS","enterLabel":"Open the review","subt":"A deduction game inside the Ashford Dispatch review","DAYS_TOTAL":3,"teaser":"A celebrated investigation collapses when its central witness proves synthetic. Did the reporter invent the entire source, did a real interview merely contain errors, or did an outside operator feed the newsroom a coordinated network of false identities and corroborators?","overclaimTag":"a coordinated operation against the newspaper","truthTag":"a coordinated external source operation that entered the paper","emblem":"<svg viewBox=\"0 0 660 140\" role=\"img\" aria-label=\"A newspaper story beside a source file with a missing identity\"><rect x=\"70\" y=\"24\" width=\"250\" height=\"92\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><path d=\"M92 44 h112 M92 60 h200 M92 76 h200 M92 92 h142\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><rect x=\"400\" y=\"34\" width=\"150\" height=\"72\" rx=\"5\" fill=\"none\" stroke=\"#121212\" stroke-width=\"2\"/><circle cx=\"432\" cy=\"66\" r=\"13\" fill=\"none\" stroke=\"#326891\" stroke-width=\"2\"/><path d=\"M458 56 h68 M458 72 h68 M416 92 h110\" stroke=\"#e2e2d8\" stroke-width=\"2\"/><path d=\"M425 55 l15 22 M440 55 l-15 22\" stroke=\"#B3261E\" stroke-width=\"3\"/><\/svg>","overclaimTease":"Do not decide from the source’s falsity alone. The origin lies in timestamps, incoming accounts, and whether the reporter created the trail or received it from outside.","CATS":{"who":{"title":"Who is behind it","truth":"broker","items":[{"id":"reporter","label":"Corin Faye — the star reporter"},{"id":"editor","label":"The managing editor"},{"id":"broker","label":"Lyle Ames — the outside source broker"}]},"where":{"title":"Where it culminates","truth":"sourcefiles","items":[{"id":"newsroom","label":"The Newsroom Floor"},{"id":"sourcefiles","label":"The Source & Fact-Check Files"},{"id":"editdesk","label":"The Managing Editor’s Desk"}]},"what":{"title":"What happened","truth":"smear","items":[{"id":"smear","label":"An outside broker planted a coordinated false source network"},{"id":"fabrication","label":"The reporter invented sources and supporting interview records"},{"id":"mistake","label":"A genuine source was reported with ordinary factual errors"}]}},"READING_ORDER":["factchecker","clerk","stringer"],"CHARACTERS":{"factchecker":{"name":"Fact-Checker Jonah Pell","role":"Newsroom fact-checker","face":"✅","badge":"P","legend":"the verification desk","hint":"The first source packets arrived from externally controlled accounts before the reporter drafted the disputed notes.","reading":"verification"},"clerk":{"name":"The Records Clerk","role":"Editorial records clerk","face":"🗂","badge":"C","legend":"the archive room","hint":"Message headers, attachments, and contact records preserve a common outside origin across several supposed witnesses.","reading":"fromrecord"},"stringer":{"name":"Local Stringer Ames","role":"Local correspondent","face":"📰","badge":"A","legend":"the reported town","hint":"The local identities were synthetic, but payments and account recovery data lead to one source broker beyond the newsroom.","reading":"sourcing"}},"TOPICS":{"verification":{"sci":"Bill Kovach (1932-2021)","topic":"The discipline of verification","lede":"Bill Kovach argued that journalism earns trust through a transparent method of checking, not through the confidence or fame of the reporter.","no":1,"profile":"Bill Kovach was an American journalist and editor whose career included reporting at The New York Times, leading the Washington bureau, editing the Atlanta Journal-Constitution, and directing the Nieman Foundation at Harvard. With Tom Rosenstiel, he helped articulate a modern statement of journalistic principles in The Elements of Journalism. At its center is the idea that journalism’s defining practice is a discipline of verification.\n\nVerification is more than avoiding obvious errors. Reporters test names, dates, locations, documents, quotations, and causal claims against independent evidence. They distinguish what they observed from what a source asserted, identify conflicts of interest, and seek corroboration especially when a source is confidential. Confidentiality can protect a real person from retaliation; it cannot exempt the reporter from proving to an editor that the person exists and is positioned to know what they claim. Notes, recordings, contact methods, documentary traces, and secondary witnesses create an audit trail without necessarily exposing the source publicly.\n\nKovach’s emphasis on method also separates journalism from rumor, propaganda, and fiction. A compelling narrative may be true, but its polish is not evidence. Likewise, one inaccurate detail can be an ordinary mistake, while a pattern of unverifiable names and quotations points to a more fundamental failure of method. Editors share responsibility for enforcing verification, yet the origin of invented material remains distinct from the failure to catch it.\n\nAt Ashford, verification initially failed because the witness biography and quotations could not be independently confirmed. The deeper audit, however, found that the reporter did not create the first contact trail. Signed attachments, incoming message headers, and archived call records predated the reporter’s notes and arrived from accounts controlled outside the paper. Kovach’s discipline therefore cuts in both directions: it exposes the newsroom’s poor checking while also preventing investigators from converting that failure into an unsupported accusation of internal fabrication.","frame":"Places the first source packet beside the reporter’s draft and highlights the incoming timestamp. “A false witness can still arrive through a real external channel. Tell me how provenance changes the accusation.”","q":[{"q":"What makes verification a discipline rather than a reporter’s personal confidence?","o":[{"t":"The reporter has covered the subject long enough to recognize what sounds true.","v":"partial","fb":"Experience guides inquiry, but plausibility cannot replace corroboration."},{"t":"The story survives legal review because no named subject threatens to sue.","v":"wrong","fb":"Legal risk and factual verification overlap only partly; silence does not establish truth."},{"t":"The newsroom protects every source from any internal identity check.","v":"danger","fb":"Confidentiality protects public disclosure, not accountability to responsible editors."},{"t":"Claims are tested against independent evidence and a reviewable reporting trail.","v":"expert","fb":"A repeatable method lets others evaluate the work without relying on the reporter’s certainty."}],"clue":{"category":"what","label":"WHAT — lead","text":"The witness biography is synthetic, yet the first digital trail predates the reporter’s notes and enters from outside the paper."}},{"q":"How should a newsroom handle a confidential central source?","o":[{"t":"Accept the source on the reporter’s assurance if the story wins early praise.","v":"danger","fb":"Prestige increases the need for scrutiny rather than replacing it."},{"t":"Confirm identity and access internally while limiting public disclosure.","v":"expert","fb":"Editors can protect confidentiality and still verify that the source exists and knows the subject."},{"t":"Publish the source’s full name so outside readers perform the fact-check.","v":"wrong","fb":"Public exposure may be unsafe and is not the only route to internal verification."},{"t":"Avoid using any documents because records could accidentally reveal identity.","v":"partial","fb":"Documents can be handled securely and often provide essential corroboration."}],"clue":{"category":"who","label":"WHO — lead","text":"The disputed source packets arrived through external accounts before Corin Faye created interview notes or article drafts."}},{"q":"Which evidence would show that false sourcing entered from outside rather than beginning in a reporter’s notes?","o":[{"t":"Archived incoming messages and signed attachments that predate the draft.","v":"expert","fb":"Contemporaneous inbound records establish an external origin for the false material."},{"t":"An editor’s failure to answer every verification warning before publication.","v":"partial","fb":"Editorial failure explains publication but not who created the source network."},{"t":"A polished narrative whose quotations sound unusually vivid and complete.","v":"wrong","fb":"Writing quality cannot identify the provenance of the underlying evidence."},{"t":"A reporter’s later inability to persuade the witness to appear publicly.","v":"danger","fb":"A missing witness is suspicious, but timing and metadata locate the origin."}],"clue":{"category":"where","label":"WHERE — lead","text":"The newsroom contains the published narrative, but the original incoming headers and attachments survive in the Source & Fact-Check Files."}}]},"fromrecord":{"sci":"I. F. Stone (1907-1989)","topic":"Verify it from the public record","lede":"I. F. Stone built investigations from documents officials had already published, proving that records can contradict a polished official or journalistic account.","no":2,"profile":"Isidor Feinstein Stone, known as I. F. Stone, was an American journalist who became famous for the independent newsletter I. F. Stone’s Weekly. Working with a tiny staff and outside the daily press pack, he read government reports, hearing transcripts, budgets, footnotes, and statistics with unusual patience. His method was not simply collecting documents. It was comparing claims made in one place with facts buried in another, often using the government’s own record to expose contradiction.\n\nPublic records have limitations. They can be incomplete, delayed, mistaken, or shaped by institutions. But they provide fixed details that can be checked: whether a person held a job, whether an organization existed at an address, whether a meeting occurred, whether a court filing or license was issued, and whether dates align. A source who uses a pseudonym may still leave corroborating events and institutional traces. An invented biography often collapses across many small records at once.\n\nStone’s documentary approach also disciplines dramatic theories. If a hostile outsider planted a false source, investigators should be able to identify some external contact, communication path, or real-world event that entered the newsroom. If a genuine source merely made ordinary mistakes, much of the biography and surrounding record should remain intact. When employment, property, court, school, and telephone records all fail together, the problem is larger than a misspelled name.\n\nStone’s documentary instinct is decisive because the public biography is false while the digital provenance is real. Shell organizations, recycled addresses, and fabricated dockets connect the supposed witnesses to one outside network. The reporter’s file contains the incoming originals, including metadata that cannot be generated by later editing of newsroom notes. The records show an engineered source operation entering the paper, not a genuine witness with a few mistakes and not a source invented from scratch by the reporter.","frame":"Compares account-recovery data, shell-company filings, and document templates. “The biography is false, but the records still show who built it. Follow the infrastructure.”","q":[{"q":"What distinguished I. F. Stone’s documentary reporting method?","o":[{"t":"He relied mainly on anonymous tips because official documents offered little value.","v":"wrong","fb":"Stone used sources, but his reputation rested heavily on intensive documentary reading."},{"t":"He treated every government error as proof of an organized conspiracy.","v":"danger","fb":"A discrepancy prompts investigation; it does not determine motive by itself."},{"t":"He compared official claims with details buried across public records.","v":"expert","fb":"Cross-reading records allowed contradictions to emerge from sources institutions had published themselves."},{"t":"He accepted public reports at face value if they carried an official seal.","v":"partial","fb":"His method was precisely to read beyond the headline and test internal consistency."}],"clue":{"category":"what","label":"WHAT — corroboration","text":"Multiple false corroborators resolve to shared external infrastructure rather than to independent people or one mistaken interview."}},{"q":"When does absence from public records become strong evidence?","o":[{"t":"Whenever one database returns no result on the first spelling attempted.","v":"partial","fb":"One search may fail through spelling, coverage, or access limits and should not settle the issue."},{"t":"After a government spokesperson confirms that the person was invented.","v":"wrong","fb":"Independent documentary verification need not depend on an official admission."},{"t":"When the missing record makes an outside smear more exciting than a clerical error.","v":"danger","fb":"Narrative appeal does not determine evidentiary weight."},{"t":"When several independent systems should contain traces and all fail consistently.","v":"expert","fb":"Converging absences across unrelated records can undermine the existence of the claimed identity or event."}],"clue":{"category":"where","label":"WHERE — corroboration","text":"Public-record contradictions become meaningful when compared with the archived source packets and contact metadata in the same file set."}},{"q":"What most strongly separates an external plant from reporter-created records?","o":[{"t":"The reporter’s notes repeating details that later appeared in the article.","v":"partial","fb":"Notes show use of the material, not necessarily creation of the source trail."},{"t":"Independent message headers and account data leading to one outside operator.","v":"expert","fb":"External provenance survives even though the personas and claims are false."},{"t":"The editor approving publication after several questions remained open.","v":"wrong","fb":"Approval is a newsroom failure but does not identify the fabricator."},{"t":"The witness biography containing an employer that public records cannot verify.","v":"danger","fb":"A false biography rules out a genuine witness but not an internal invention."}],"clue":{"category":"who","label":"WHO — corroboration","text":"Supposedly independent personas share recovery numbers, payment routes, and document templates controlled outside the newspaper."}}]},"sourcing":{"sci":"Carl Bernstein (b. 1944)","topic":"The discipline of sourcing","lede":"Carl Bernstein’s Watergate reporting showed how separate sources and documents can corroborate a hidden system without any one witness carrying the whole case.","no":3,"profile":"Carl Bernstein joined The Washington Post as a young reporter and, with Bob Woodward, investigated the 1972 break-in at the Democratic National Committee headquarters and the broader Watergate scandal. The reporting depended on persistence, documents, and many sources with partial knowledge. No single conversation supplied the complete story. Names, payments, campaign records, grand-jury developments, and accounts from officials were checked against one another before the newspaper advanced its claims.\n\nSourcing discipline means matching a source’s access to the fact asserted. A person may know that a meeting occurred but not what was said inside it. Another may confirm a payment but not its purpose. Independent corroboration is especially important for consequential allegations. Two reporters hearing the same rumor from people who copied one original claim do not have two sources; they have one information chain. Editors therefore ask how sources know, whether they are independent, what documents support them, and what details can be verified without exposing identities.\n\nThe method also clarifies the difference between editorial failure and fabrication. An editor can be overly trusting, rush publication, or waive a check. Those choices can permit falsehood to pass. But if a reporter creates nonexistent witnesses, manufactured notes, and false contact records, the originating act remains with the reporter even when supervision failed.\n\nBernstein’s source-mapping lesson asks whether apparent corroborators are genuinely independent. In Ashford they were not: several personas used different names but shared recovery numbers, document templates, payment routes, and a source broker. The reporter and editor failed to recognize the convergence, yet the information chain still has an external origin. Mapping that chain identifies both the mechanism and the person who assembled it, while the Source & Fact-Check Files preserve the complete path into the newsroom.","frame":"Pins the supposed corroborators to a board and links their payment routes to one broker. “Different names do not make independent sources when one hand controls them all.”","q":[{"q":"What makes two sources genuinely independent?","o":[{"t":"They learned the fact through genuinely separate access or evidence chains.","v":"expert","fb":"Independence requires distinct origins, not merely two people repeating one account."},{"t":"They use different names while describing the same rumor in similar language.","v":"wrong","fb":"Different speakers can still share one unverified source."},{"t":"They agree with the reporter before either is asked how they know.","v":"danger","fb":"Agreement without provenance can manufacture confidence rather than corroboration."},{"t":"They work in different departments and report through separate managers.","v":"partial","fb":"Different departments may be independent, but investigators must verify how each learned the fact."}],"clue":{"category":"what","label":"WHAT — decisive","text":"A coordinated broker built

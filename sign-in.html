<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · First Person Learning</title>

<!-- ┌───────────────────────────────────────────────────────────────────┐
     │  CLERK SETUP — replace the key below with YOUR Clerk Publishable    │
     │  Key (starts with pk_test_ or pk_live_), found in the Clerk         │
     │  dashboard under "API Keys". The Publishable Key is safe to expose. │
     │  Put the SAME key in sign-out.html. The SECRET key goes only in     │
     │  Replit Secrets as CLERK_SECRET_KEY — never in this file.           │
     │                                                                     │
     │  If the sign-in box never appears, replace this whole <script> tag  │
     │  with the exact one from Clerk dashboard → "JavaScript" quickstart. │
     └───────────────────────────────────────────────────────────────────┘ -->
<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_live_Y2xlcmsuZmlyc3RwZXJzb25sZWFybi5jb20k"
  src="https://clerk.firstpersonlearn.com/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
  type="text/javascript"></script>

<style>
  :root{--bg:#fff;--ink:#1a1a17;--muted:#565651;--accent:#2f5d86;--hair:#e4e4e2;--serif:Georgia,'Times New Roman',serif;--sans:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--bg);color:var(--ink);font-family:var(--sans);padding:32px}
  .brand{text-align:center}
  .brand h1{font-family:var(--serif);font-weight:700;font-size:44px;letter-spacing:.5px;margin:0;text-transform:uppercase}
  .brand p{color:var(--muted);margin:8px 0 0;font-size:15px}
  #signin{min-height:120px;display:flex;align-items:center;justify-content:center}
  .fallback{color:var(--muted);font-size:14px;max-width:420px;text-align:center;line-height:1.5}
  @media (prefers-color-scheme: dark){:root{--bg:#16150f;--ink:#f0eee6;--muted:#a8a69c;--hair:#33322b}}
</style>
</head>
<body>
  <div class="brand">
    <h1>First Person Learning</h1>
    <p>Sign in to play. Your campaigns follow your account, not the browser you started them in.</p>
  </div>
  <div id="signin"><span class="fallback">Loading sign-in…</span></div>

<script>
window.addEventListener("load", async function () {
  const box = document.getElementById("signin");
  if (typeof Clerk === "undefined") {
    box.innerHTML = '<span class="fallback">Sign-in didn\'t load. Check the Clerk Publishable Key in this page, or paste the script tag from your Clerk dashboard.</span>';
    return;
  }
  try {
    await Clerk.load();
    // Already signed in → go straight to the hub.
    if (Clerk.user) { location.replace("/games/"); return; }
    // Redirect the moment a session is established (version-proof).
    Clerk.addListener(function (res) { if (res && res.user) location.replace("/games/"); });
    box.innerHTML = "";
    Clerk.mountSignIn(box, { afterSignInUrl: "/games/", afterSignUpUrl: "/games/" });
  } catch (e) {
    box.innerHTML = '<span class="fallback">Could not start sign-in: ' + (e && e.message ? e.message : e) + '</span>';
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · First Person Learning</title>
<meta name="theme-color" content="#0d0f13">

<!-- ┌───────────────────────────────────────────────────────────────────────┐
     │  CLERK SETUP — do not hand-edit the key or the script host below.      │
     │  Both files that carry them are written together by                    │
     │      node scripts/set-clerk-key.mjs pk_live_…                          │
     │  which derives the host from the key, because a publishable key IS the │
     │  base64 of its own frontend host. `npm run clerk:check` reports which  │
     │  instance the pair points at. Editing one file by hand is how sign-in  │
     │  ends up working while sign-OUT silently talks to the other instance.  │
     │  The SECRET key never appears here — it is CLERK_SECRET_KEY in Replit. │
     └───────────────────────────────────────────────────────────────────────┘ -->
<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_live_Y2xlcmsuZmlyc3RwZXJzb25sZWFybi5jb20k"
  src="https://clerk.firstpersonlearn.com/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
  type="text/javascript"></script>

<style>
  /* One committed look, not a light/dark pair. The page is a photograph of a
     place with a card over it, and there is no light-mode version of that. The
     ground is painted dark first so a slow or blocked background image degrades
     to the same design rather than to a white flash. */
  :root{
    --ground:#0d0f13; --ink:#eef1f5; --dim:#a8b1c0; --faint:#78828f;
    --card:#141922; --line:#252c38; --accent:#4ea3d8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ground); color:var(--ink); overflow:hidden;
    font:400 16px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  }

  /* The world behind. An <img> rather than a CSS background: it can be given a
     decoding hint, and it can report failure, which a background-image cannot. */
  #bg{
    position:fixed; inset:0; width:100%; height:100%; object-fit:cover;
    /* Not opacity — house rule 5. A darkened, desaturated copy of the shot
       instead, so the card's own contrast is never fighting a wash. */
    filter:brightness(.42) saturate(.8) blur(2px);
    transform:scale(1.04);          /* hides the blur's soft edge */
    opacity:0; transition:opacity .9s ease;
  }
  #bg.in{opacity:1}
  /* Two scrims: a vertical one so the caption at the bottom stays readable, and
     a soft radial pool behind the card. */
  #veil{
    position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(60% 55% at 50% 44%, rgba(8,10,14,.72) 0%, rgba(8,10,14,.30) 60%, transparent 100%),
      linear-gradient(to bottom, rgba(8,10,14,.55) 0%, transparent 28%, transparent 62%, rgba(8,10,14,.80) 100%);
  }

  .page{
    position:relative; z-index:1; height:100%; overflow-y:auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:26px; padding:40px 24px calc(40px + env(safe-area-inset-bottom));
    text-align:center;
  }
  .brand h1{
    margin:0; font-size:clamp(1.6rem,4.6vw,2.3rem); line-height:1.1; font-weight:640;
    letter-spacing:-.018em; text-wrap:balance;
    text-shadow:0 2px 20px rgba(0,0,0,.6);
  }
  .brand p{
    margin:12px auto 0; max-width:44ch; color:var(--dim); font-size:15px;
    text-shadow:0 1px 12px rgba(0,0,0,.7);
  }
  #signin{min-height:150px; display:flex; align-items:center; justify-content:center}
  .fallback{
    max-width:42ch; color:var(--dim); font-size:14.5px; line-height:1.55;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:18px 20px;
  }
  .fallback b{color:var(--ink); font-weight:600}

  /* Which world you are looking at. It is the only thing on this page that says
     the product is nineteen places rather than one. */
  .where{
    position:fixed; left:0; right:0; bottom:calc(14px + env(safe-area-inset-bottom));
    z-index:1; text-align:center; pointer-events:none;
    font:500 11.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.14em; text-transform:uppercase; color:var(--faint);
    opacity:0; transition:opacity .9s ease .3s;
  }
  .where.in{opacity:1}
  /* Bottom-left, opposite .where, so neither is over the sign-in card. */
  .legal{
    position:fixed; left:22px; bottom:18px; margin:0; z-index:3;
    font-size:12px; color:#6b7484;
  }
  .legal a{color:#8b97a8; text-decoration:none}
  .legal a:hover{color:#dfe5ee; text-decoration:underline}
  @media (prefers-reduced-motion:reduce){
    #bg,.where{transition:none}
  }
</style>
</head>
<body>
  <img id="bg" alt="">
  <div id="veil"></div>

  <div class="page">
    <div class="brand">
      <h1>First Person Learning</h1>
      <p>Sign in to play. Your campaigns follow your account, not the browser you
        started them in.</p>
    </div>
    <div id="signin"><span class="fallback">Loading sign-in…</span></div>
  </div>

  <p class="where" id="where"></p>

  <!-- Read before anyone has an account, which is exactly when somebody wants
       to know what signing in will collect. Both pages are outside the gate. -->
  <p class="legal">
    <a href="/privacy.html">Privacy policy</a> · <a href="/support.html">Support</a>
  </p>

<script>
// The eighteen worlds, with what to call each one. Hardcoded rather than read
// from games.json: that file is behind the sign-in gate this page exists to get
// you past, so fetching it here would always fail.
const WORLDS = [
  ['aftershock',        'Kestrel Bay, three days after'],
  ['blackout',          'Calder Switching Station'],
  ['bring_them_home',   'Mission Control'],
  ['contamcity',        'Riverton, after the freight-yard fire'],
  ['deepwatch',         'Aboard the boat'],
  ['groundtruth',       'Station 12, Sablon Flats'],
  ['headwater',         'The gorge above the dam'],
  ['hospital',          "The children's hospital"],
  ['icecore',           'A drilling camp on the plateau'],
  ['midway',            'Corbin Park, shut for the season'],
  ['outbreak_riverton', 'Riverton General, week three'],
  ['planetary_defense', 'The ridge, after dark'],
  ['projecty',          'Los Alamos, 1943'],
  ['quantum',           'Ridgeway Quantum Laboratory'],
  ['redsand',           'Arcadia Rise, Mars'],
  ['seedbank',          'Wellmere breeding station'],
  ['sightline',         'The Hallam Exchange'],
  ['the_trial',         'The coordinating centre'],
];

(function background(){
  const [slug, caption] = WORLDS[Math.floor(Math.random() * WORLDS.length)];
  const img = document.getElementById('bg');
  const where = document.getElementById('where');
  img.addEventListener('load', () => {
    img.classList.add('in');
    where.textContent = caption;
    where.classList.add('in');
  });
  // A failed image leaves the dark ground and no caption. Never a white page,
  // and never a caption naming a place that is not on screen.
  img.addEventListener('error', () => { img.remove(); });
  img.src = '/games/shots/' + slug + '.jpg';
})();

window.addEventListener("load", async function () {
  const box = document.getElementById("signin");
  if (typeof Clerk === "undefined") {
    box.innerHTML = '<span class="fallback"><b>Sign-in could not load.</b> '
      + 'The authentication service did not respond. Reload in a moment, and if it '
      + 'keeps happening the sign-in host may not be reachable from this network.</span>';
    return;
  }
  try {
    await Clerk.load();
    // Where to land after the sign-in. The gate appends ?next=<the page you
    // were after> — usually a game clicked on the public shelf. Same-origin
    // paths only: a full URL or a protocol-relative //host here would make
    // this an open redirect.
    var q = new URLSearchParams(location.search).get("next");
    var next = (q && q.charAt(0) === "/" && q.charAt(1) !== "/" && q.charAt(1) !== "\\") ? q : "/games/";
    // Already signed in → go straight on.
    if (Clerk.user) { location.replace(next); return; }
    // Redirect the moment a session is established (version-proof).
    Clerk.addListener(function (res) { if (res && res.user) location.replace(next); });
    box.innerHTML = "";
    Clerk.mountSignIn(box, {
      afterSignInUrl: next,
      afterSignUpUrl: next,
      // Clerk titles its own card from the APPLICATION NAME in its dashboard,
      // which is still "Reckon" — the product this app used to be. That name is
      // on the first screen anybody sees, above a page headed First Person
      // Learning, so it read as two products. Overridden here rather than only
      // renamed in the dashboard because this is the copy a player reads; the
      // dashboard name still wants changing, since it also appears in Clerk's
      // own emails, which this cannot reach.
      localization: {
        signIn: {
          start: {
            title: 'Sign in to First Person Learning',
            subtitle: 'Your campaigns follow your account, not the browser you started them in.',
          },
        },
        signUp: {
          start: { title: 'Make an account', subtitle: 'One account, every game, on any device.' },
        },
      },
      // Clerk draws its own card, and its default is light — which over a dark
      // photograph reads as a dialog that has landed on the wrong page. These
      // are Clerk's own theme variables rather than CSS overrides, so the card
      // stays Clerk's to restyle when it changes.
      appearance: {
        variables: {
          colorBackground: '#141922',
          colorText: '#eef1f5',
          colorTextSecondary: '#a8b1c0',
          colorPrimary: '#4ea3d8',
          colorTextOnPrimaryBackground: '#0b1016',
          colorInputBackground: '#1b212b',
          colorInputText: '#eef1f5',
          colorNeutral: '#eef1f5',
          colorDanger: '#e8737f',
          borderRadius: '10px',
          fontFamily: 'ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif',
        },
        elements: {
          card: { border: '1px solid #252c38', boxShadow: '0 30px 80px rgba(0,0,0,.55)' },
        },
      },
    });
  } catch (e) {
    box.innerHTML = '<span class="fallback"><b>Could not start sign-in.</b> '
      + (e && e.message ? e.message : e) + '</span>';
  }
});
</script>
</body>
</html>

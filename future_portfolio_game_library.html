  );
  return `<section class="panel">
    <div class="section-head"><div><div class="eyebrow">Round library</div><h2>Choose exactly three</h2><p>The game contains 50 concrete historical technology packages. Broad mathematical-theory rounds have been removed because they do not fit the investment metaphor cleanly. Ideas are shuffled when play begins.</p></div><button class="btn ghost" onclick="returnToLibrary()">Back</button></div>
    <div class="picker-tools">
      <input id="pickerSearch" placeholder="Search people, fields, or eras" value="${esc(state.pickerQuery||'')}">
      <select id="pickerCategory"><option value="all">All categories</option>${cats.map(c=>`<option ${state.pickerCategory===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <select id="pickerDifficulty"><option value="all">All difficulties</option>${diffs.map(d=>`<option ${state.pickerDifficulty===d?'selected':''}>${esc(d)}</option>`).join('')}</select>
    </div>
    <div class="round-list">${rows.length?rows.map(r=>{
      const selected=state.pickerSelected.includes(r.id);
      return `<label class="round-choice ${selected?'selected':''}"><input type="checkbox" ${selected?'checked':''} onchange="toggleRoundChoice('${r.id}')"><div><strong>${esc(r.title)}</strong><div class="meta">${esc(r.category)} · ${esc(r.era)} · ${esc(r.difficulty)}</div><div class="meta">${esc(r.connection)}</div></div></label>`;
    }).join(''):`<div class="empty">No matching rounds.</div>`}</div>
    <div class="picker-footer"><strong>${state.pickerSelected.length}/3 selected</strong><div><button class="btn secondary" onclick="selectRandomPicker()">Surprise me</button> <button class="btn" ${state.pickerSelected.length===3?'':'disabled'} onclick="startGame(shuffle(state.pickerSelected))">Start game</button></div></div>
  </section>`;
}
function toggleRoundChoice(id){
  const a=state.pickerSelected;
  if(a.includes(id)) state.pickerSelected=a.filter(x=>x!==id);
  else if(a.length<3) a.push(id);
  else return showToast('Choose only three rounds.');
  render();
}
function selectRandomPicker(){ const g=GAME_SETS[Math.floor(Math.random()*GAME_SETS.length)]; state.pickerSelected=[...g.roundIds]; render(); }
function attachInputs(){
  const ps=$('#pickerSearch'); if(ps) ps.oninput=e=>{state.pickerQuery=e.target.value; render();};
  const pc=$('#pickerCategory'); if(pc) pc.onchange=e=>{state.pickerCategory=e.target.value;render();};
  const pd=$('#pickerDifficulty'); if(pd) pd.onchange=e=>{state.pickerDifficulty=e.target.value;render();};
}
function briefingView(){
  ensureCurrent(); const r=currentRound();
  return `<section class="panel">
    <div class="eyebrow">Round ${state.roundIndex+1} of 3 · ${esc(r.era)}</div>
    <h2>${esc(r.title)}</h2>
    <div class="round-meta"><span class="tag">${esc(r.category)}</span><span class="tag">${esc(r.discipline)}</span><span class="tag">${esc(r.difficulty)}</span>${r.judgmentCall?'<span class="tag">Judgment call</span>':''}</div>

    <div class="actions-row"><span class="pill">Available capital <strong>${money(state.bankrollUnits)}</strong></span><button class="btn" onclick="state.screen='invest';save();render();window.scrollTo(0,0)">Enter the investment room</button></div>
  </section>`;
}
function investView(){
  ensureCurrent(); const r=currentRound(); const ordered=state.current.ideaOrder.map(id=>ideaById(r,id));
  return `<section>
    <div class="panel round-intro">
      <div class="section-head"><div><div class="eyebrow">Round ${state.roundIndex+1} of 3 · ${esc(r.era)}</div><h2>${esc(r.title)}</h2><div class="round-meta"><span class="tag">${esc(r.category)}</span><span class="tag">${esc(r.discipline)}</span><span class="tag">${esc(r.difficulty)}</span>${r.judgmentCall?'<span class="tag">Judgment call</span>':''}</div></div><span class="pill">Starting bankroll <strong>${money(state.current.roundStartBankrollUnits)}</strong></span></div>
      <p class="briefing">${esc(r.briefing)}</p>
      <div class="connection"><small>Why these three belong together</small>${esc(r.connection)}</div>
      ${r.contentWarnings?.length?`<div class="connection" style="border-left-color:var(--red)"><small style="color:var(--red)">Content note</small>${r.contentWarnings.map(esc).join(' · ')}</div>`:''}
    </div>
    <div class="section-head" style="margin-top:24px"><div><div class="eyebrow">Invest your ${money(state.current.roundStartBankrollUnits)}</div><h2 style="font-size:34px">Choose among three ideas</h2></div></div>
    <div class="ideas-grid">${ordered.map((idea,i)=>ideaInvestCard(idea,i)).join('')}</div>
    ${portfolioBar(ordered)}
  </section>`;
}
function termHelp(tags=[]){
  if(!tags.length) return 'The key question is whether the underlying property can be turned into a reliable, scalable use.';
  const defs={
    'platform':'a foundation that supports many later products or uses',
    'network effects':'the idea becomes more useful as more people or institutions adopt the same system',
    'semiconductor':'a material whose electrical behavior can be precisely controlled to make electronic devices',
    'selective toxicity':'harms the disease-causing organism much more than it harms the patient',
    'legacy':'did not dominate directly, but strongly influenced later successful work',
    'standardization':'different organizations agree on compatible sizes, interfaces, or rules',
    'intermodal system':'the same cargo unit moves among ship, train, and truck without being unpacked',
    'geosynchronous orbit':'an orbit whose period matches Earth’s rotation; at the right geometry a satellite appears fixed in the sky',
    'active repeater':'receives, strengthens, and retransmits a signal instead of merely reflecting it',
    'magnetic recording':'stores information as a pattern of magnetization in a material',
    'solid-state imaging':'captures images in semiconductor devices rather than vacuum tubes or film',
    'fermentation':'uses microorganisms in controlled vessels to manufacture a product',
    'learning curve':'cost and reliability improve as producers gain experience and increase scale',
    'first mover':'an early entrant that gains an initial market advantage, even if later technologies surpass it',
    'sensitivity':'how well a detector responds to weak input signals',
    'toxicity':'the degree to which a substance damages the patient or other living tissue'
  };
  return tags.map(t=>`<strong>${esc(t)}:</strong> ${esc(defs[t]||'a core factor used to judge how broadly and reliably this idea could be applied')}`).join('<br>');
}
function ideaInvestCard(idea,i){
  const alloc=state.current.allocations[idea.id]||0;
  const max=state.bankrollUnits;
  const rr=idea.researchReports;
  return `<article class="idea-card">
    <div class="idea-head"><div class="idea-letter">Idea ${LETTERS[i]}</div><h3 class="idea-title">${esc(idea.concealedTitle)}</h3></div>
    <div class="idea-body">
      <div class="pitch">${esc(idea.pitch)}</div>
      <div class="mini-cols"><div class="mini-box good"><div class="mini-title">Potential advantages</div><ul class="clean">${idea.knownAdvantages.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="mini-box risk"><div class="mini-title">Known risks</div><ul class="clean">${idea.knownRisks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
      <div class="context-help"><details><summary>More context and term help <span>Free</span></summary><div class="context-grid">
        <div class="context-box"><strong>How it works</strong>${esc(rr.technical)}</div>
        <div class="context-box"><strong>Can it be built?</strong>${esc(rr.manufacturing)}</div>
        <div class="context-box"><strong>Who needs it?</strong>${esc(rr.market)}</div>
        <div class="context-box"><strong>What else is happening?</strong>${esc(rr.historicalContext)}</div>
        <div class="term-row"><strong>Terms in plain English</strong><br>${termHelp(idea.tags)}</div>
      </div></details></div>
    </div>
    <div class="allocation"><div class="allocation-label"><span>Your investment</span><strong>${money(alloc)}</strong></div><input type="range" min="0" max="${max}" step="1" value="${alloc}" oninput="setAllocation('${idea.id}',this.value)"><div class="money-input"><input aria-label="Investment in ${esc(idea.concealedTitle)}" type="number" min="0" max="${max/10}" step="0.1" value="${(alloc/10).toFixed(1)}" onchange="setAllocationMillions('${idea.id}',this.value)"></div><div class="quick-row"><button class="quick" onclick="bump('${idea.id}',-100)">−$10</button><button class="quick" onclick="bump('${idea.id}',100)">+$10</button><button class="quick" onclick="putRemainder('${idea.id}')">Add remainder</button></div></div>
  </article>`;
}
function portfolioBar(ideas){
  const used=totalAllocated(), rem=remaining();
  return `<div class="portfolio-bar"><div class="portfolio-top"><div class="portfolio-stats"><div class="stat"><small>Invested</small><strong>${money(used)}</strong></div><div class="stat remaining ${rem===0?'ok':'bad'}"><small>Unallocated</small><strong>${money(rem)}</strong></div></div><div><button class="btn ghost" onclick="clearAllocations()">Clear</button> <button class="btn secondary" onclick="splitEvenly()">Split evenly</button> <button class="btn" ${rem===0?'':'disabled'} onclick="lockPortfolio()">Submit investments</button></div></div><div class="allocation-strip">${ideas.map(x=>`<span style="width:${state.bankrollUnits?((state.current.allocations[x.id]||0)/state.bankrollUnits*100):0}%"></span>`).join('')}</div></div>`;
}
function buyReport(){ return; }
function setAllocation(id,v){
  let next=Math.max(0,Math.round(Number(v)||0)); const other=totalAllocated()-(state.current.allocations[id]||0);
  next=Math.min(next,state.bankrollUnits-other); state.current.allocations[id]=next; save(); render();
}
function setAllocationMillions(id,v){ setAllocation(id,Math.round((Number(v)||0)*10)); }
function bump(id,units){ setAllocation(id,(state.current.allocations[id]||0)+units); }
function putRemainder(id){ setAllocation(id,(state.current.allocations[id]||0)+remaining()); }
function clearAllocations(){ Object.keys(state.current.allocations).forEach(k=>state.current.allocations[k]=0);save();render(); }
function splitEvenly(){
  const ids=state.current.ideaOrder, base=Math.floor(state.bankrollUnits/3), rem=state.bankrollUnits-base*3;
  ids.forEach((id,i)=>state.current.allocations[id]=base+(i<rem?1:0)); save(); render();
}
function lockPortfolio(){
  if(remaining()!==0) return showToast('Allocate the full remaining bankroll first.');
  const r=currentRound();
  state.current.result=computeResult(r);
  state.current.revealCount=3;
  state.screen='reveal';
  save(); render(); window.scrollTo(0,0);
}
function computeResult(r){
  const items=state.current.ideaOrder.map(id=>{
    const idea=ideaById(r,id), invested=state.current.allocations[id]||0;
    const raw=invested*(idea.reveal.returnMultiplier+(idea.reveal.legacyBonusMultiplier||0));
    return {ideaId:id,invested,rawReturn:Math.round(raw),expertiseBonus:0,totalReturn:Math.round(raw)};
  });
  return {items,totalReturn:items.reduce((sum,item)=>sum+item.totalReturn,0),reportSpend:reportSpend()};
}
function impactMeaning(tier){
  if(tier==='transformative') return 'Transformative means it became a broad platform: it changed a major activity and supported many important later uses.';
  if(tier==='medium') return 'Medium means it produced real, durable value, but in a narrower market or for a shorter period than the round winner.';
  return 'Limited does not necessarily mean foolish or useless. It means the idea stayed niche, was displaced, arrived at the wrong time, or could not overcome a decisive constraint.';
}
function downstreamList(idea){
  return idea.innovationTree.nodes.filter(n=>n.kind!=='root'&&n.kind!=='blocked').map(n=>n.label);
}
function blockedList(idea){
  return idea.innovationTree.nodes.filter(n=>n.kind==='blocked').map(n=>n.label);
}
function revealView(){
  const r=currentRound(), res=state.current.result;
  const change=res.totalReturn-state.current.roundStartBankrollUnits;
  const changeLabel=change>=0?`+${money(change)}`:`−${money(Math.abs(change))}`;
  const winner=ideaById(r,r.debrief.winnerIdeaId);
  return `<section>
    <div class="section-head"><div><div class="eyebrow">Round ${state.roundIndex+1} result</div><h2>${esc(r.title)}</h2><p>You can now see both the financial result and the historical reason each idea expanded—or failed to.</p></div></div>
    <div class="round-total"><div><div class="eyebrow">Your portfolio</div><div style="color:var(--muted);margin-top:4px">Started with ${money(state.current.roundStartBankrollUnits)} · every dollar was invested</div></div><div style="text-align:right"><strong>${money(res.totalReturn)}</strong><div style="margin-top:5px;color:${change>=0?'var(--green)':'var(--red)'};font-weight:850">${changeLabel} this round</div></div></div>
    <div class="round-story"><div class="story-box"><strong>What transformed the field</strong><br>${esc(winner.reveal.historicalName)}. ${esc(r.debrief.winnerReason)}</div><div class="story-box"><strong>What separated the three</strong><br>${esc(r.debrief.investorLesson)}</div></div>
    <div class="reveal-grid">${state.current.ideaOrder.map((id,i)=>revealCard(r,ideaById(r,id),i,res.items.find(x=>x.ideaId===id),true)).join('')}</div>
    ${postReveal(r,res)}
  </section>`;
}
function revealCard(r,idea,i,item,shown){
  if(!shown) return `<article class="reveal-card hidden-card"><div><div class="hidden-symbol">?</div><strong>Idea ${LETTERS[i]}</strong><div style="margin-top:7px">${esc(idea.concealedTitle)}</div></div></article>`;
  const rev=idea.reveal, led=downstreamList(idea), blocked=blockedList(idea), rr=idea.researchReports;
  return `<article class="reveal-card"><span class="tier ${rev.impactTier}">${esc(rev.impactTier)}</span><h3 class="historical-name">${esc(rev.historicalName)}</h3>
    <div class="return-box"><div class="return-line"><span>Invested</span><strong>${money(item.invested)}</strong></div><div class="return-line"><span>Historical multiplier</span><strong>${rev.returnMultiplier}×${rev.legacyBonusMultiplier?` + ${rev.legacyBonusMultiplier}× legacy`:''}</strong></div><div class="return-line total"><span>Returned</span><strong>${money(item.totalReturn)}</strong></div></div>
    <div class="explain-block"><h4>What actually happened</h4><p>${esc(rev.historicalOutcome)}</p></div>
    <div class="explain-block"><h4>Why it received this rating</h4><p>${esc(rev.rankingRationale)}</p><div class="impact-meaning">${esc(impactMeaning(rev.impactTier))}</div></div>
    ${led.length?`<div class="explain-block"><h4>What it led to</h4><ul>${led.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    ${blocked.length?`<div class="explain-block"><h4>What never fully happened</h4><ul>${blocked.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    <details class="decision-clues"><summary>Clues available before you invested</summary><div><strong>Technical:</strong> ${esc(rr.technical)}<br><strong>Manufacturing:</strong> ${esc(rr.manufacturing)}<br><strong>Market:</strong> ${esc(rr.market)}<br><strong>Historical setting:</strong> ${esc(rr.historicalContext)}</div></details>
  </article>`;
}
function revealNext(){ state.current.revealCount++; save(); render(); }
function postReveal(r,res){
  return `<div class="section-head" style="margin-top:28px"><div><div class="eyebrow">How the futures branched</div><h2 style="font-size:32px">Compare the innovation trees</h2><p>The tree is not the reason by itself; it is a visual summary of the applications history actually produced.</p></div></div><div class="trees-grid">${state.current.ideaOrder.map((id,i)=>treeCard(ideaById(r,id),i)).join('')}</div>
  <div class="lesson"><strong>Investor lesson:</strong> ${esc(r.debrief.investorLesson)}<br><span style="color:var(--muted)">${esc(r.debrief.winnerReason)}</span>${r.rankingCaveat?`<br><span style="color:var(--muted)"><strong>Ranking caveat:</strong> ${esc(r.rankingCaveat)}</span>`:''}</div>
  <details class="sources"><summary>Historical sources in the dataset</summary><ol class="source-list">${r.sources.map(s=>`<li><a href="${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a></li>`).join('')}</ol></details>
  <div class="actions-row" style="justify-content:flex-end"><button class="btn" onclick="finishRound()">${state.roundIndex===2?'See final result':'Continue to round '+(state.roundIndex+2)}</button></div>`;
}
function treeCard(idea,i){
  const tree=idea.innovationTree, nodes=tree.nodes, edges=tree.edges;
  const incoming=Object.fromEntries(nodes.map(n=>[n.id,0])); edges.forEach(e=>incoming[e.to]=(incoming[e.to]||0)+1);
  const roots=nodes.filter(n=>!incoming[n.id]||n.kind==='root');
  const levels=[]; let frontier=roots.map(n=>n.id), seen=new Set();
  while(frontier.length){
    const lvl=frontier.filter(id=>!seen.has(id)); if(!lvl.length)break; levels.push(lvl.map(id=>nodes.find(n=>n.id===id)).filter(Boolean)); lvl.forEach(id=>seen.add(id));
    frontier=edges.filter(e=>lvl.includes(e.from)).map(e=>e.to);
  }
  const left=nodes.filter(n=>!seen.has(n.id)); if(left.length)levels.push(left);
  return `<article class="tree-card"><div class="tree-head"><div class="idea-letter">Idea ${LETTERS[i]} innovation tree</div><strong>${esc(idea.reveal.historicalName)}</strong></div>${levels.map((lvl,idx)=>`${idx?'<div class="tree-arrow">↓</div>':''}<div class="tree-level">${lvl.map(n=>`<div class="tree-node ${n.kind==='root'?'root':''} ${n.kind==='blocked'?'blocked':''}">${esc(n.label)}</div>`).join('')}</div>`).join('')}</article>`;
}
function finishRound(){
  const r=currentRound(), result=state.current.result;
  state.history.push({roundId:r.id,title:r.title,start:state.current.roundStartBankrollUnits,reports:result.reportSpend,allocations:{...state.current.allocations},ideaOrder:[...state.current.ideaOrder],returnUnits:result.totalReturn});
  state.bankrollUnits=result.totalReturn;
  if(state.roundIndex>=2){ state.screen='final'; state.current=null; }
  else { state.roundIndex++; state.current=null; state.screen='invest'; ensureCurrent(); }
  save(); render(); window.scrollTo(0,0);
}
function finalView(){
  const tiers=GAME_DATA.gameConfig.resultTiers, m=state.bankrollUnits/10;
  const tier=tiers.find(t=>m>=t.min&&(t.maxExclusive===null||m<t.maxExclusive))||tiers[tiers.length-1];
  const threshold=Math.round(GAME_DATA.gameConfig.successThresholdMillions*10), pct=Math.min(100,state.bankrollUnits/threshold*100);
  return `<section class="panel"><div class="eyebrow" style="text-align:center">Final portfolio</div><div class="final-number"><div class="money">${money(state.bankrollUnits)}</div><div class="final-tier">${esc(tier.label)}</div></div><div class="threshold-line"><span style="width:${pct}%"></span></div><p class="lede" style="text-align:center;font-size:17px">${state.bankrollUnits>=threshold?`You passed the ${money(threshold)} target.`:`You finished ${money(threshold-state.bankrollUnits)} below the ${money(threshold)} target.`}</p>
    <div class="history">${state.history.map((h,idx)=>historyRow(h,idx)).join('')}</div>
    <div class="actions-row" style="justify-content:center;margin-top:28px"><button class="btn" onclick="replayCurrentGame()">Replay this game</button><button class="btn secondary" onclick="returnToLibrary()">Choose another game</button></div></section>`;
}
function historyRow(h,idx){
  const r=roundById(h.roundId);
  const allocs=h.ideaOrder.map((id,i)=>`${LETTERS[i]} ${money(h.allocations[id])}`).join(' · ');
  return `<div class="history-row"><div><strong>Round ${idx+1}: ${esc(h.title)}</strong><div style="font-size:12px;margin-top:4px">${esc(r.category)}</div></div><div>Start<br><strong>${money(h.start)}</strong></div><div>Invested<br><strong style="font-size:12px">${allocs}</strong></div><div>Return<br><strong>${money(h.returnUnits)}</strong></div></div>`;
}
function replayCurrentGame(){
  const gameId=state.gameId;
  if(gameId) startGameSet(gameId); else startGame(state.roundIds);
}
function returnToLibrary(){ if(state && !['home','final'].includes(state.screen)) save(); else if(state?.screen==='final') clearSave(); state={screen:'home'}; render(); window.scrollTo(0,0); }
function goHome(){ returnToLibrary(); }
function restartPrompt(){
  if(confirm('Restart this three-round game from $100?')) replayCurrentGame();
}
function openHelp(){
  modalOpen=true;
  const wrapper=document.createElement('div'); wrapper.id='helpModal'; wrapper.className='modal-backdrop'; wrapper.onclick=e=>{if(e.target===wrapper)closeHelp()};
  wrapper.innerHTML=`<div class="modal"><div class="modal-head"><div><div class="eyebrow">How to play</div><h2 style="font-size:36px">Future Portfolio</h2></div><button class="icon-btn" onclick="closeHelp()">Close</button></div><ol><li><strong>Start with ${money(Math.round(GAME_DATA.gameConfig.startingBankrollMillions*10))}.</strong> Each round immediately shows the historical context and all three concealed ideas.</li><li><strong>Open context whenever useful.</strong> Technical, manufacturing, market, and historical explanations are free.</li><li><strong>Allocate everything.</strong> Split the remaining bankroll among the three ideas.</li><li><strong>Submit once.</strong> All three historical outcomes, returns, explanations, and innovation trees appear immediately.</li><li><strong>Reinvest for three rounds.</strong> Transformative ideas return 3×, medium ideas 1.5×, and limited ideas 0.25×, sometimes with a legacy bonus. Finish above ${money(Math.round(GAME_DATA.gameConfig.successThresholdMillions*10))}.</li></ol><p>Impact tiers are relative game judgments, not claims that scientific merit, profitability, and moral value are identical.</p></div>`;
  document.body.appendChild(wrapper);
}
function closeHelp(){ const m=$('#helpModal'); if(m)m.remove(); modalOpen=false; }

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalOpen)closeHelp();});
state={screen:'home'};
render();
</script>

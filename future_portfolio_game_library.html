<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Future Portfolio — fixed three-round historical science investment games.">
<title>Future Portfolio — Game Library</title>
<style>
  :root {
    --bg: #07111f;
    --bg2: #0d1a2b;
    --panel: rgba(16, 31, 50, 0.94);
    --panel2: rgba(24, 43, 66, 0.94);
    --ink: #f3f7fb;
    --muted: #a9b8c9;
    --line: rgba(255,255,255,0.12);
    --gold: #f2c66d;
    --green: #69d3a7;
    --blue: #79b8ff;
    --red: #ff8e8e;
    --purple: #be9cff;
    --shadow: 0 22px 65px rgba(0,0,0,0.34);
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 12% 12%, rgba(76,121,184,0.23), transparent 32%),
      radial-gradient(circle at 88% 18%, rgba(190,156,255,0.14), transparent 28%),
      linear-gradient(145deg, var(--bg), #09182a 55%, #07111f);
  }
  button, input, select { font: inherit; }
  button { cursor: pointer; }
  a { color: #9dccff; }
  .app { min-height: 100vh; }
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 12px 22px;
    background: rgba(5,13,24,0.88); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 12px;
    display:grid; place-items:center; color:#09111c; font-weight:900;
    background: linear-gradient(135deg, var(--gold), #fff0b4);
    box-shadow: 0 8px 25px rgba(242,198,109,0.2);
  }
  .brand-title { font-weight: 850; letter-spacing: -0.02em; }
  .brand-sub { font-size: 12px; color: var(--muted); }
  .status { display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
  .pill {
    padding: 8px 12px; border-radius: 999px; border:1px solid var(--line);
    background: rgba(255,255,255,0.045); color: var(--muted); font-size:13px;
  }
  .pill strong { color:var(--ink); }
  .icon-btn {
    border:1px solid var(--line); background:transparent; color:var(--muted);
    border-radius:11px; padding:8px 10px;
  }
  .icon-btn:hover { color:var(--ink); border-color:rgba(255,255,255,.28); }
  main { width:min(1220px, calc(100% - 28px)); margin:0 auto; padding: 34px 0 70px; }
  .hero { padding: 72px 0 28px; text-align:center; }
  .eyebrow { color:var(--gold); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.16em; }
  h1 { font-size:clamp(45px, 8vw, 92px); line-height:.93; letter-spacing:-.065em; margin:13px 0 22px; }
  h2 { font-size:clamp(28px, 4vw, 48px); line-height:1.04; letter-spacing:-.04em; margin:10px 0 14px; }
  h3 { margin:0; letter-spacing:-.02em; }
  .lede { color:var(--muted); max-width:760px; margin:0 auto; font-size:clamp(17px, 2.2vw, 22px); line-height:1.55; }
  .hero-actions { margin-top:32px; display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
  .btn {
    border:0; border-radius:14px; padding:13px 18px; font-weight:800;
    background:linear-gradient(135deg,var(--gold),#ffe8a5); color:#101722;
    box-shadow:0 12px 30px rgba(242,198,109,.16); transition:.17s transform,.17s opacity;
  }
  .btn:hover { transform:translateY(-1px); }
  .btn.secondary { background:rgba(255,255,255,.075); color:var(--ink); border:1px solid var(--line); box-shadow:none; }
  .btn.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); box-shadow:none; }
  .btn.danger { background:rgba(255,105,105,.12); color:#ffc5c5; border:1px solid rgba(255,105,105,.28); box-shadow:none; }
  .btn:disabled { opacity:.38; cursor:not-allowed; transform:none; }
  .library-head { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin-bottom:22px; }
  .library-head h1 { font-size:clamp(38px,6vw,68px); margin:8px 0 8px; line-height:.98; }
  .library-head p { margin:0; color:var(--muted); max-width:720px; line-height:1.5; }
  .games-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
  .game-card { width:100%; text-align:left; color:var(--ink); border:1px solid var(--line); border-radius:18px; background:linear-gradient(145deg,rgba(24,43,66,.88),rgba(13,29,48,.96)); padding:19px; min-height:172px; display:flex; flex-direction:column; justify-content:space-between; gap:18px; transition:.17s transform,.17s border-color,.17s background; }
  .game-card:hover { transform:translateY(-2px); border-color:rgba(242,198,109,.48); background:linear-gradient(145deg,rgba(29,50,76,.96),rgba(15,32,52,.98)); }
  .game-number { color:var(--gold); font-size:11px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; }
  .game-title { font-size:22px; font-weight:880; letter-spacing:-.03em; margin-top:7px; }
  .game-words { display:flex; flex-wrap:wrap; gap:7px; }
  .game-word { display:inline-flex; align-items:center; padding:7px 9px; border:1px solid rgba(121,184,255,.2); background:rgba(121,184,255,.075); color:#cee4ff; border-radius:999px; font-size:12px; font-weight:800; }
  .game-card-foot { display:flex; align-items:center; justify-content:space-between; gap:10px; color:var(--muted); font-size:12px; }
  .resume-card { margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; gap:15px; padding:15px 17px; border:1px solid rgba(105,211,167,.25); border-radius:15px; background:rgba(105,211,167,.07); }
  .resume-card strong { color:#bcf1da; }
  .library-note { color:var(--muted); font-size:12px; margin-top:18px; text-align:center; }
  .home-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:44px auto 0; max-width:980px; }
  .feature { text-align:left; padding:20px; border:1px solid var(--line); border-radius:18px; background:rgba(255,255,255,.035); }
  .feature .num { color:var(--gold); font-size:13px; font-weight:900; }
  .feature p { color:var(--muted); line-height:1.5; margin:8px 0 0; font-size:14px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:clamp(18px,3vw,34px); }
  .panel + .panel { margin-top:18px; }
  .section-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:20px; }
  .section-head p { color:var(--muted); margin:7px 0 0; line-height:1.5; }
  .round-meta { display:flex; flex-wrap:wrap; gap:8px; margin-top:15px; }
  .tag { display:inline-flex; padding:6px 9px; border-radius:999px; background:rgba(121,184,255,.10); border:1px solid rgba(121,184,255,.20); color:#c6e0ff; font-size:12px; }
  .briefing { font-size:clamp(18px,2vw,23px); line-height:1.65; color:#e7eef7; max-width:900px; }
  .connection { margin-top:22px; padding:16px 18px; border-left:3px solid var(--gold); background:rgba(242,198,109,.07); border-radius:0 12px 12px 0; }
  .connection small { display:block; text-transform:uppercase; letter-spacing:.12em; color:var(--gold); font-weight:800; margin-bottom:4px; }
  .actions-row { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:24px; }
  .ideas-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; align-items:start; }
  .idea-card { background:var(--panel2); border:1px solid var(--line); border-radius:18px; overflow:hidden; min-width:0; }
  .idea-head { padding:18px 18px 14px; border-bottom:1px solid var(--line); }
  .idea-letter { color:var(--gold); font-size:12px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; }
  .idea-title { font-size:21px; margin-top:6px; }
  .idea-body { padding:17px 18px; }
  .pitch { color:#e1eaf4; line-height:1.55; min-height:112px; }
  .mini-cols { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px; }
  .mini-box { padding:11px; border-radius:12px; background:rgba(255,255,255,.04); font-size:13px; }
  .mini-box.good { border-top:2px solid var(--green); }
  .mini-box.risk { border-top:2px solid var(--red); }
  .mini-title { font-weight:850; margin-bottom:7px; }
  ul.clean { margin:0; padding-left:17px; color:var(--muted); line-height:1.45; }
  ul.clean li + li { margin-top:4px; }

  .context-help { margin-top:15px; border-top:1px solid var(--line); padding-top:14px; }
  .context-help details { border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.03); overflow:hidden; }
  .context-help summary { list-style:none; cursor:pointer; padding:12px 13px; font-weight:850; color:#dfeaff; display:flex; justify-content:space-between; gap:10px; }
  .context-help summary::-webkit-details-marker { display:none; }
  .context-help summary::after { content:'+'; color:var(--gold); font-size:18px; }
  .context-help details[open] summary::after { content:'–'; }
  .context-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; padding:0 12px 12px; }
  .context-box { background:rgba(0,0,0,.17); border-radius:10px; padding:11px; color:var(--muted); font-size:13px; line-height:1.48; }
  .context-box strong { display:block; color:var(--ink); margin-bottom:4px; }
  .term-row { grid-column:1/-1; padding:10px 11px; border-radius:10px; background:rgba(121,184,255,.07); color:#c8dbef; font-size:13px; line-height:1.5; }
  .round-story { margin:18px 0; display:grid; grid-template-columns:1.1fr .9fr; gap:12px; }
  .story-box { border:1px solid var(--line); border-radius:15px; padding:16px; background:rgba(255,255,255,.035); line-height:1.55; }
  .story-box strong { color:var(--gold); }
  .explain-block { margin-top:13px; padding-top:12px; border-top:1px solid var(--line); }
  .explain-block h4 { margin:0 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.1em; color:var(--gold); }
  .explain-block p, .explain-block ul { margin:0; color:var(--muted); line-height:1.52; font-size:13px; }
  .explain-block ul { padding-left:18px; }
  .decision-clues { margin-top:12px; border-radius:12px; background:rgba(121,184,255,.06); padding:11px; }
  .decision-clues summary { cursor:pointer; font-weight:800; color:#dbeaff; }
  .decision-clues div { margin-top:8px; color:var(--muted); font-size:13px; line-height:1.5; }
  .impact-meaning { margin-top:10px; padding:10px 11px; border-radius:10px; background:rgba(242,198,109,.07); color:#e8debf; font-size:13px; line-height:1.5; }
  @media(max-width:760px){ .context-grid,.round-story{grid-template-columns:1fr;} }

  .reports { display:none; }
  .reports-title { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; font-weight:850; }
  .report-buttons { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:9px; }
  .report-btn { border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.045); color:#dce7f2; padding:9px 7px; font-size:12px; font-weight:750; }
  .report-btn:hover { border-color:rgba(255,255,255,.28); }
  .report-btn.bought { border-color:rgba(105,211,167,.35); background:rgba(105,211,167,.08); color:#bdf3dd; }
  .report-text { margin-top:8px; padding:10px 11px; border-radius:10px; background:rgba(0,0,0,.16); color:var(--muted); font-size:13px; line-height:1.45; }
  .allocation { padding:15px 18px 18px; border-top:1px solid var(--line); background:rgba(0,0,0,.10); }
  .allocation-label { display:flex; align-items:baseline; justify-content:space-between; gap:8px; font-size:13px; font-weight:800; }
  .money-input { margin-top:9px; display:flex; align-items:center; gap:8px; }
  .money-input input[type=number] { width:100%; background:#091522; border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:10px; }
  .quick-row { display:flex; gap:5px; flex-wrap:wrap; margin-top:8px; }
  .quick { border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:8px; padding:5px 7px; font-size:11px; }
  .quick:hover { color:var(--ink); }
  input[type=range] { width:100%; accent-color:var(--gold); margin-top:10px; }
  .portfolio-bar { position:sticky; bottom:12px; z-index:20; margin-top:18px; padding:15px 17px; border:1px solid rgba(242,198,109,.27); border-radius:16px; background:rgba(9,20,34,.96); box-shadow:var(--shadow); backdrop-filter:blur(16px); }
  .portfolio-top { display:flex; justify-content:space-between; gap:14px; align-items:center; flex-wrap:wrap; }
  .portfolio-stats { display:flex; gap:18px; flex-wrap:wrap; }
  .stat small { display:block; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.11em; }
  .stat strong { display:block; margin-top:2px; font-size:18px; }
  .remaining.ok strong { color:var(--green); }
  .remaining.bad strong { color:var(--red); }
  .allocation-strip { height:8px; border-radius:999px; display:flex; overflow:hidden; margin-top:12px; background:rgba(255,255,255,.06); }
  .allocation-strip span:nth-child(1){background:var(--blue)}
  .allocation-strip span:nth-child(2){background:var(--purple)}
  .allocation-strip span:nth-child(3){background:var(--gold)}
  .question-wrap { max-width:820px; margin:0 auto; }
  .question-note { color:var(--muted); line-height:1.55; padding:12px 14px; background:rgba(121,184,255,.075); border:1px solid rgba(121,184,255,.16); border-radius:12px; margin:15px 0 20px; }
  .options { display:grid; gap:10px; }
  .option { text-align:left; width:100%; border:1px solid var(--line); background:rgba(255,255,255,.045); color:var(--ink); border-radius:14px; padding:15px 16px; line-height:1.45; }
  .option:hover { border-color:rgba(242,198,109,.55); background:rgba(242,198,109,.06); }
  .option.selected { border-color:var(--gold); background:rgba(242,198,109,.1); }
  .reveal-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
  .reveal-card { border:1px solid var(--line); border-radius:18px; min-height:280px; padding:18px; background:var(--panel2); position:relative; overflow:hidden; }
  .reveal-card.hidden-card { display:grid; place-items:center; text-align:center; color:var(--muted); background:linear-gradient(145deg,rgba(24,43,66,.9),rgba(12,26,43,.95)); }
  .hidden-symbol { width:74px; height:74px; border-radius:50%; border:1px solid rgba(242,198,109,.35); display:grid; place-items:center; font-size:35px; color:var(--gold); margin:0 auto 12px; }
  .tier { display:inline-flex; border-radius:999px; padding:6px 9px; font-size:11px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; }
  .tier.transformative { background:rgba(105,211,167,.12); color:#a8efd2; border:1px solid rgba(105,211,167,.27); }
  .tier.medium { background:rgba(121,184,255,.12); color:#bbdcff; border:1px solid rgba(121,184,255,.25); }
  .tier.limited { background:rgba(255,142,142,.10); color:#ffc2c2; border:1px solid rgba(255,142,142,.23); }
  .historical-name { font-size:23px; margin:10px 0 8px; }
  .outcome { color:var(--muted); line-height:1.5; }
  .return-box { margin-top:14px; padding:12px; border-radius:12px; background:rgba(0,0,0,.18); }
  .return-line { display:flex; justify-content:space-between; gap:10px; margin:4px 0; font-size:13px; color:var(--muted); }
  .return-line.total { color:var(--ink); font-size:16px; font-weight:850; border-top:1px solid var(--line); padding-top:9px; margin-top:9px; }
  .expertise-result { margin:18px 0; padding:14px 16px; border-radius:14px; line-height:1.5; }
  .expertise-result.correct { background:rgba(105,211,167,.09); border:1px solid rgba(105,211,167,.23); }
  .expertise-result.wrong { background:rgba(255,142,142,.075); border:1px solid rgba(255,142,142,.2); }
  .round-total { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:18px; margin-top:17px; border:1px solid rgba(242,198,109,.26); border-radius:16px; background:rgba(242,198,109,.065); }
  .round-total strong { font-size:clamp(24px,4vw,38px); color:var(--gold); }
  .trees-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-top:18px; }
  .tree-card { border:1px solid var(--line); background:rgba(255,255,255,.027); border-radius:17px; padding:16px; }
  .tree-head { margin-bottom:14px; min-height:58px; }
  .tree-level { display:flex; gap:7px; justify-content:center; flex-wrap:wrap; }
  .tree-node { padding:8px 9px; border:1px solid rgba(121,184,255,.25); border-radius:9px; background:rgba(121,184,255,.075); font-size:12px; text-align:center; max-width:145px; }
  .tree-node.root { border-color:rgba(242,198,109,.37); background:rgba(242,198,109,.09); color:#ffe7ae; font-weight:850; }
  .tree-node.blocked { border-color:rgba(255,142,142,.27); background:rgba(255,142,142,.07); color:#ffc0c0; text-decoration:line-through; }
  .tree-arrow { text-align:center; color:var(--muted); padding:3px 0; }
  .lesson { margin-top:18px; padding:17px 19px; border-left:3px solid var(--purple); background:rgba(190,156,255,.065); border-radius:0 14px 14px 0; line-height:1.55; }
  details.sources { margin-top:16px; color:var(--muted); }
  details.sources summary { cursor:pointer; color:#c9d8e7; }
  .source-list { line-height:1.7; overflow-wrap:anywhere; }
  .picker-tools { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .picker-tools input, .picker-tools select { background:#0b1929; color:var(--ink); border:1px solid var(--line); border-radius:11px; padding:11px 12px; }
  .picker-tools input { min-width:250px; flex:1; }
  .round-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; max-height:58vh; overflow:auto; padding-right:5px; }
  .round-choice { display:flex; gap:12px; align-items:flex-start; text-align:left; border:1px solid var(--line); background:rgba(255,255,255,.035); color:var(--ink); padding:14px; border-radius:14px; }
  .round-choice:hover { border-color:rgba(255,255,255,.27); }
  .round-choice.selected { border-color:var(--gold); background:rgba(242,198,109,.07); }
  .round-choice input { margin-top:4px; accent-color:var(--gold); }
  .round-choice .meta { color:var(--muted); font-size:12px; margin-top:4px; }
  .picker-footer { position:sticky; bottom:0; display:flex; justify-content:space-between; align-items:center; gap:14px; padding:14px 0 0; background:linear-gradient(transparent, var(--panel) 22%); }
  .history { display:grid; gap:10px; margin-top:20px; }
  .history-row { display:grid; grid-template-columns:1.3fr repeat(3,.7fr) .8fr; gap:10px; align-items:center; border:1px solid var(--line); border-radius:13px; padding:12px; color:var(--muted); }
  .history-row strong { color:var(--ink); }
  .final-number { text-align:center; padding:26px 0 8px; }
  .final-number .money { font-size:clamp(58px,9vw,105px); font-weight:900; letter-spacing:-.07em; color:var(--gold); }
  .final-tier { font-size:clamp(22px,3vw,34px); font-weight:850; }
  .threshold-line { max-width:700px; margin:20px auto; height:10px; background:rgba(255,255,255,.07); border-radius:999px; overflow:hidden; }
  .threshold-line span { display:block; height:100%; background:linear-gradient(90deg,var(--blue),var(--gold),var(--green)); border-radius:inherit; }
  .toast { position:fixed; right:18px; bottom:18px; z-index:100; padding:12px 15px; border-radius:12px; background:#10243a; border:1px solid var(--line); box-shadow:var(--shadow); color:var(--ink); opacity:0; transform:translateY(8px); pointer-events:none; transition:.2s; max-width:360px; }
  .toast.show { opacity:1; transform:none; }
  .modal-backdrop { position:fixed; inset:0; z-index:80; display:grid; place-items:center; padding:18px; background:rgba(2,7,13,.76); backdrop-filter:blur(8px); }
  .modal { width:min(760px,100%); max-height:88vh; overflow:auto; background:#0d1d30; border:1px solid var(--line); border-radius:20px; padding:24px; box-shadow:var(--shadow); }
  .modal p, .modal li { color:var(--muted); line-height:1.55; }
  .modal-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; }
  .empty { text-align:center; color:var(--muted); padding:36px; }
  @media(max-width: 900px) {
    .ideas-grid,.reveal-grid,.trees-grid { grid-template-columns:1fr; }
    .idea-card .pitch { min-height:0; }
    .home-grid { grid-template-columns:1fr; }
    .games-grid { grid-template-columns:1fr; }
    .library-head { align-items:flex-start; flex-direction:column; }
    .round-list { grid-template-columns:1fr; }
    .history-row { grid-template-columns:1fr; }
    .topbar { align-items:flex-start; }
  }
  @media(max-width: 620px) {
    main { width:min(100% - 18px,1220px); padding-top:18px; }
    .topbar { padding:10px 12px; }
    .brand-sub { display:none; }
    .status .pill:nth-child(1){ display:none; }
    .panel { border-radius:16px; padding:16px; }
    .mini-cols { grid-template-columns:1fr; }
    .report-buttons { grid-template-columns:1fr; }

ity","era":"1970s–1980s","connection":"Competing solutions for protecting digital communication.","briefing":"Governments and businesses need secure digital communication, but the best balance of key management, speed, and mathematical security is unknown.","difficulty":"advanced","judgmentCall":false,"rankingCaveat":"","contentWarnings":[],"ideas":[{"concealedTitle":"Separate Public and Private Keys","pitch":"A user publishes one key while keeping a mathematically related private key for decryption or signing.","knownAdvantages":["Solves key distribution","Enables signatures","Works across open networks"],"knownRisks":["Computationally expensive","Requires trust infrastructure","New mathematics"],"researchReports":{"technical":"Trapdoor mathematical functions can separate public operations from private reversal.","manufacturing":"Software and later hardware can implement the calculations.","market":"Open networks desperately need secure exchange among strangers.","historicalContext":"Certificates and standards can form around the architecture."},"reveal":{"historicalName":"Public-key cryptography","impactTier":"transformative","returnMultiplier":3.0,"legacyBonusMultiplier":0.0,"historicalOutcome":"Enabled secure web traffic, digital signatures, certificates, encrypted messaging, and electronic commerce.","rankingRationale":"It solved the structural key-distribution problem and created many reusable security services."},"innovationTree":{"nodes":[{"id":"the-1970s-cryptography-portfolio-idea-1-node-1","label":"Public-key cryptography","kind":"root"},{"id":"the-1970s-cryptography-portfolio-idea-1-node-2","label":"secure websites","kind":"application"},{"id":"the-1970s-cryptography-portfolio-idea-1-node-3","label":"digital signatures","kind":"application"},{"id":"the-1970s-cryptography-portfolio-idea-1-node-4","label":"software authentication","kind":"application"},{"id":"the-1970s-cryptography-portfolio-idea-1-node-5","label":"encrypted messaging","kind":"application" bal commercial nuclear-power architecture.","rankingRationale":"Institutional momentum and a replicable supply chain outweighed competing theoretical advantages."},"innovationTree":{"nodes":[{"id":"the-early-nuclear-reactor-portfolio-idea-3-node-1","label":"Light-water reactor","kind":"root"},{"id":"the-early-nuclear-reactor-portfolio-idea-3-node-2","label":"commercial nuclear power","kind":"application"},{"id":"the-early-nuclear-reactor-portfolio-idea-3-node-3","label":"pressurized-water reactors","kind":"application"},{"id":"the-early-nuclear-reactor-portfolio-idea-3-node-4","label":"boiling-water reactors","kind":"application"},{"id":"the-early-nuclear-reactor-portfolio-idea-3-node-5","label":"naval-to-civilian supply chain","kind":"application"}],"edges":[{"from":"the-early-nuclear-reactor-portfolio-idea-3-node-1","to":"the-early-nuclear-reactor-portfolio-idea-3-node-2"},{"from":"the-early-nuclear-reactor-portfolio-idea-3-node-1","to":"the-early-nuclear-reactor-portfolio-idea-3-node-3"},{"from":"the-early-nuclear-reactor-portfolio-idea-3-node-1","to":"the-early-nuclear-reactor-portfolio-idea-3-node-4"},{"from":"the-early-nuclear-reactor-portfolio-idea-3-node-1","to":"the-early-nuclear-reactor-portfolio-idea-3-node-5"}]},"tags":["institutional advantage","energy platform"],"id":"the-early-nuclear-reactor-portfolio-idea-3","displayOrder":3}],"expertiseQuestion":{"prompt":"Why can institutional experience be as decisive as reactor physics?","options":["A mature supply chain removes accident risk entirely.","Breeder reactors require no specialized infrastructure.","Existing naval designs, trained operators, suppliers, and regulators reduce the cost and uncertainty of commercial deployment.","Institutional experience changes the laws of neutron physics."],"correctIndex":2,"explanation":"Deployment depends on organizations capable of constructing and operating the technology repeatedly.","bonusMultiplier":1.1},"debrief":{"winnerIdeaId":"the-early-nuclear-reactor-portfolio-idea-3","winnerReason":"Light-water reactors benefit from technical adequacy plus powerful institutional path dependence.","investorLesson":"Price the ecosystem that can deliver the technology, not only the theoretical design."},"sources":["https://www.energy.gov/ne/articles/9-notable-facts-about-worlds-first-nuclear-power-plant-ebr-i","https://www.nrc.gov/reading-rm/basic-ref/students/history-101.html"]},{"id":"three-solar-electric-futures","sequence":40,"category":"Transportation, Mechanical Engineering, and Energy","title":"Three Solar-Electric Futures","discipline":"energy and materials","era":"1950s–present","connection":"Competing routes for turning sunlight into electricity.","briefing":"The choices are electrochemical dye films, direct crystalline semiconductor cells, and mirrored heat engines with optional thermal storage.","difficulty":"intermediate","judgmentCall":false,"rankingCaveat":"","contentWarnings":[],"ideas":[{"concealedTitle":"Dye-Sensitized Electrochemical Cell","pitch":"Dye molecules absorb light on a nanostructured surface and transfer charge through an electrolyte.","knownAdvantages":["Works in diffuse light","Color and transparency options","Potential low-temperature manufacture"],"knownRisks":["Electrolyte leakage","Lower efficiency","Long-term stability"],"researchReports":{"technical":"Photoexcited dye injects electrons into a semiconductor network.","manufacturing":"Printing-like manufacturing is plausible, but sealing and stability are difficult.","market":"Indoor power, decorative panels, and low-light sensors offer niches.","historicalContext":"Silicon cost may fall faster than expected."},"reveal":{"historicalName":"Dye-sensitized solar cells","impactTier":"limited","returnMultiplier":0.25,"legacyBonusMultiplier":0.0,"historicalOutcome":"Found specialized and research uses without taking a large share of outdoor power generation.","rankingRationale":"Distinctive aesthetics and low-light performance did not overcome durability and efficiency limitations."},"innovationTree":{"nodes":[{"id":"three-solar-electric-futures-idea-1-node-1","label":"Dye-sensitized cell","kind":"root"},{"id":"three-solar-electric-futures-idea-1-node-2","label":"indoor energy harvesting","kind":"application"},{"id":"three-solar-electric-futures-idea-1-node-3","label":"decorative photovoltaics","kind":"application"},{"id":"three-solar-electric-futures-idea-1-node-4","label":"dominant utility generation","kind":"blocked"}],"edges":[{"from":"three-solar-electric-futures-idea-1-node-1","to":"three-solar-electric-futures-idea-1-node-2"},{"from":"three-solar-electric-futures-idea-1-node-1","to":"three-solar-electric-futures-idea-1-node-3"},{"from":"three-solar-electric-futures-idea-1-node-1","to":"three-solar-electric-futures-idea-1-node-4","status":"blocked"}]},"tags":["emerging photovoltaic"],"id":"three-solar-electric-futures-idea-1","displayOrder":1},{"concealedTitle":"Crystalline Semiconductor Junction","pitch":"Light creates electron-hole pairs in a solid silicon junction, producing current with no moving parts.","knownAdvantages":["Long life","Modular","Semiconductor learning curve"],"knownRisks":["High early cost","Intermittency","Purity and wafer processing"],"researchReports":{"technical":"A p-n junction separates photo-generated charge.","manufacturing":"Semiconductor manufacturing can improve yield, automation, and material use for decades.","market":"Satellites, remote power, rooftops, and utility farms form a sequence of expanding markets.","historicalContext":"Modularity permits deployment from watts to gigawatts."},"reveal":{"historicalName":"Crystalline-silicon photovoltaics","impactTier":"transformative","returnMultiplier":3.0,"legacyBonusMultiplier":0.0,"historicalOutcome":"Scaled from spacecraft to the dominant global solar-electric technology.","rankingRationale":"Modularity and a powerful manufacturing learning curve drove continuous cost decline and market expansion."},"innovationTree":{"nodes":[{"id":"three-solar-electric-futures-idea-2-node-1","label":"Silicon PV","kind":"root"},{"id":"three-solar-electric-futures-idea-2-node-2","label":"satellite power","kind":"application"},{"id":"three-solar-electric-futures-idea-2-node-3","label":"calculators and remote systems","kind":"application"},{"id":"three-solar-electric-futures-idea-2-node-4","label":"rooftop solar","kind":"application"},{"id":"three-solar-electric-futures-idea-2-node-5","label":"utility solar farms","kind":"application"},{"id":"three-solar-electric-futures-idea-2-node-6","label":"distributed energy","kind":"application"}],"edges":[{"from":"three-solar-electric-futures-idea-2-node-1","to":"three-solar-electric-futures-idea-2-node-2"},{"from":"three-solar-electric-futures-idea-2-node-1","to":"three-solar-electric-futures-idea-2-node-3"},{"from":"three-solar-electric-futures-idea-2-node-1","to":"three-solar-electric-futures-idea-2-node-4"},{"from":"three-solar-electric-futures-idea-2-node-1","to":"three-solar-electric-futures-idea-2-node-5"},{"from":"three-solar-electric-futures-idea-2-node-1","to":"three-solar-electric-futures-idea-2-node-6"}]},"tags":["learning curve","modular"],"id":"three-solar-electric-futures-idea-2","displayOrder":2},{"concealedTitle":"Concentrated Solar Heat","pitch":"Mirrors focus sunlight onto a receiver that heats a fluid, drives a turbine, and may store heat before generation.","knownAdvantages":["Thermal storage","Conventional turbine output","Large plant scale"],"knownRisks":["Needs strong direct sunlight","Complex moving mirrors","High project cost"],"researchReports":{"technical":"Concentration produces temperatures suitable for steam or other heat engines.","manufacturing":"Large engineered fields and thermal-storage tanks are feasible.","market":"Sunny regions and evening power markets offer value.","historicalContext":"Rapidly falling modular PV and battery costs create strong competition."},"reveal":{"historicalName":"Concentrated solar power","impactTier":"medium","returnMultiplier":1.5,"legacyBonusMultiplier":0.0,"historicalOutcome":"Produced important utility projects and valuable thermal-storage capability but remained smaller than PV.","rankingRationale":"Its dispatchability is useful, while geography and project complexity limit replication."},"innovationTree":{"nodes":[{"id":"three-solar-electric-futures-idea-3-node-1","label":"Concentrated solar","kind":"root"},{"id":"three-solar-electric-futures-idea-3-node-2","label":"utility power","kind":"application"},{"id":"three-solar-electric-futures-idea-3-node-3","label":"molten-salt storage","kind":"application"},{"id":"three-solar-electric-futures-idea-3-node-4","label":"industrial heat","kind":"application"}],"edges":[{"from":"three-solar-electric-futures-idea-3-node-1","to":"three-solar-electric-futures-idea-3-node-2"},{"from":"three-solar-electric-futures-idea-3-node-1","to":"three-solar-electric-futures-idea-3-node-3"},{"from":"three-solar-electric-futures-idea-3-node-1","to":"three-solar-electric-futures-idea-3-node-4"}]},"tags":["thermal energy"],"id":"three-solar-electric-futures-idea-3","displayOrder":3}],"expertiseQuestion":{"prompt":"Why does modularity strengthen silicon photovoltaics’ investment case?","options":["Silicon cells need a steam turbine for each panel.","The same basic unit can serve tiny devices or enormous farms while manufacturing improvements apply across all markets.","Every solar cell generates power at night without storage.","Modularity requires one unique factory for each installation."],"correctIndex":1,"explanation":"A modular product can enter niche markets first and ride a cumulative learning curve into mass infrastructure.","bonusMultiplier":1.1},"debrief":{"winnerIdeaId":"three-solar-electric-futures-idea-2","winnerReason":"Silicon PV creates the widest deployment and manufacturing ecosystem.","investorLesson":"Look for technologies that scale both up and down."},"sources":["https://www1.eere.energy.gov/solar/pdfs/47927_chapter4.pdf","https://www.energy.gov/eere/solar/solar-photovoltaic-technology-basics"]},{"id":"birth-of-electronic-imaging","sequence":41,"category":"Electricity, Electronics, and Hardware","title":"Birth of Electronic Imaging","discipline":"electronic imaging","era":"1920s–1970s","connection":"Competing electronic ways to turn a scene into an electrical image.","briefing":"Television and scientific imaging need cameras without moving film. Investors must choose between mature vacuum-tube approaches and a risky solid-state array.","difficulty":"intermediate","judgmentCall":false,"rankingCaveat":"","contentWarnings":[],"ideas":[{"concealedTitle":"Charge-Transfer Silicon Array","pitch":"A flat semiconductor array stores light as packets of electric charge, then moves those packets across the chip to be measured.","knownAdvantages":["No vacuum tube","Can form many pixels on one chip","Low power and compact"],"knownRisks":["Early chips contain defects","Readout electronics are difficult","Manufacturing yield is uncertain"],"researchReports":{"technical":"Each light-sensitive site accumulates charge in proportion to incoming light. Clock pulses transfer the charge row by row to an output amplifier.","manufacturing":"The idea depends on making large, clean semiconductor arrays with very few defective sites—difficult at first, but compatible with chip-fabrication learning curves.","market":"Astronomy, scientific imaging, television, surveillance, and eventually consumer photography all need smaller and more stable cameras.","historicalContext":"Camera tubes dominate electronic imaging, but semiconductor manufacturing is improving rapidly."},"reveal":{"historicalName":"Charge-coupled device (CCD)","impactTier":"transformative","returnMultiplier":3.0,"legacyBonusMultiplier":0.0,"historicalOutcome":"Moved from an intended memory concept into scientific cameras, astronomy, scanners, television, and digital photography.","rankingRationale":"It replaced fragile scanning tubes with a compact solid-state platform that improved as semiconductor manufacturing improved."},"innovationTree":{"nodes":[{"id":"birth-of-electronic-imaging-idea-1-node-1","label":"CCD image sensor","kind":"root"},{"id":"birth-of-electronic-imaging-idea-1-node-2","label":"astronomical cameras","kind":"application"},{"id":"birth-of-electronic-imaging-idea-1-node-3","label":"digital photography","kind":"application"},{"id":"birth-of-electronic-imaging-idea-1-node-4","label":"medical and scientific imaging","kind":"application"},{"id":"birth-of-electronic-imaging-idea-1-node-5","label":"scanners and machine vision","kind":"application"}],"edges":[{"from":"birth-of-electronic-imaging-idea-1-node-1","to":"birth-of-electronic-imaging-idea-1-node-2"},{"from":"birth-of-electronic-imaging-idea-1-node-1","to":"birth-of-electronic-imaging-idea-1-node-3"},{"from":"birth-of-electronic-imaging-idea-1-node-1","to":"birth-of-electronic-imaging-idea-1-node-4"},{"from":"birth-of-electronic-imaging-idea-1-node-1","to":"birth-of-electronic-imaging-idea-1-node-5"}]},"tags":["solid-state imaging","semiconductor","platform"],"id":"birth-of-electronic-imaging-idea-1","displayOrder":1},{"concealedTitle":"Photoconductive Camera Tube","pitch":"An electron beam scans a light-sensitive target inside a vacuum tube, converting the stored image into a television signal.","knownAdvantages":["Good image quality for its era","Smaller than earlier camera tubes","Works with existing television electronics"],"knownRisks":["Requires a vacuum tube","Image lag and burn-in","Bulky high-voltage camera systems"],"researchReports":{"technical":"Light changes the electrical resistance of a target; a scanning electron beam reads the resulting pattern line by line.","manufacturing":"Tube factories already know how to make vacuum electronics, so production is feasible before large image-sensor chips are mature.","market":"Broadcast, industrial television, security, and early space cameras provide substantial demand.","historicalContext":"The device can win the near-term camera market even if a smaller solid-state technology eventually overtakes it."},"reveal":{"historicalName":"Vidicon camera tube","impactTier":"medium","returnMultiplier":1.5,"legacyBonusMultiplier":0.25,"historicalOutcome":"Became a major television and industrial-camera technology for decades before solid-state sensors displaced it.","rankingRationale":"It was practical and commercially important, but its vacuum-tube architecture could not shrink and scale like semiconductor sensors."},"innovationTree":{"nodes":[{"id":"birth-of-electronic-imaging-idea-2-node-1","label":"Vidicon tube","kind":"root"},{"id":"birth-of-electronic-imaging-idea-2-node-2","label":"broadcast and studio cameras","kind":"application"},{"id":"birth-of-electronic-imaging-idea-2-node-3","label":"industrial television","kind":"application"},{"id":"birth-of-electronic-imaging-idea-2-node-4","label":"security cameras","kind":"application"},{"id":"birth-of-electronic-imaging-idea-2-node-5","label":"early spacecraft imaging","kind":"application"}],"edges":[{"from":"birth-of-electronic-imaging-idea-2-node-1","to":"birth-of-electronic-imaging-idea-2-node-2"},{"from":"birth-of-electronic-imaging-idea-2-node-1","to":"birth-of-electronic-imaging-idea-2-node-3"},{"from":"birth-of-electronic-imaging-idea-2-node-1","to":"birth-of-electronic-imaging-idea-2-node-4"},{"from":"birth-of-electronic-imaging-idea-2-node-1","to":"birth-of-electronic-imaging-idea-2-node-5"}]},"tags":["camera tube","near-term market"],"id":"birth-of-electronic-imaging-idea-2","displayOrder":2},{"concealedTitle":"Electron Image-Dissector Tube","pitch":"An electronic image is swept across a small aperture so one tiny portion can be measured at a time.","knownAdvantages":["Fully electronic scanning","No mechanical spinning disk","Can demonstrate television images"],"knownRisks":["Very low light sensitivity","Needs intense illumination","Poor signal efficiency"],"researchReports":{"technical":"The tube forms an electron image and magnetically scans it past an aperture, but most available electrons are discarded at any instant.","manufacturing":"It can be built with vacuum-tube methods, though precision alignment is demanding.","market":"Experimental television is interested, but ordinary scenes are not bright enough for easy use.","historicalContext":"Competing storage-type camera tubes preserve more of the incoming signal and therefore produce much stronger images."},"reveal":{"historicalName":"Image dissector","impactTier":"limited","returnMultiplier":0.25,"legacyBonusMultiplier":0.0,"historicalOutcome":"Helped demonstrate all-electronic television and found specialized scientific uses, but low sensitivity prevented broad camera adoption.","rankingRationale":"It solved scanning but wasted too much of the light signal, leaving it behind better storage tubes and later solid-state sensors."},"innovationTree":{"nodes":[{"id":"birth-of-electronic-imaging-idea-3-node-1","label":"Image dissector","kind":"root"},{"id":"birth-of-electronic-imaging-idea-3-node-2","label":"experimental electronic television","kind":"application"},{"id":"birth-of-electronic-imaging-idea-3-node-3","label":"specialized photometry","kind":"application"},{"id":"birth-of-electronic-imaging-idea-3-node-4","label":"mass-market camera adoption","kind":"blocked"}],"edges":[{"from":"birth-of-electronic-imaging-idea-3-node-1","to":"birth-of-electronic-imaging-idea-3-node-2"},{"from":"birth-of-electronic-imaging-idea-3-node-1","to":"birth-of-electronic-imaging-idea-3-node-3"},{"from":"birth-of-electronic-imaging-idea-3-node-1","to":"birth-of-electronic-imaging-idea-3-node-4","status":"blocked"}]},"tags":["electronic television","sensitivity"],"id":"birth-of-electronic-imaging-idea-3","displayOrder":3}],"expertiseQuestion":{"prompt":"Which clue best identifies the idea most likely to create the broadest durable platform?","options":["It combines a workable core with scalable production, infrastructure, and many follow-on uses.","It has the most dramatic demonstration.","It is the earliest proposal.","It uses the most specialized terminology."],"correctIndex":0,"explanation":"Transformative innovations usually align technical performance, manufacturability, demand, and an expandable ecosystem.","bonusMultiplier":1.1},"debrief":{"winnerIdeaId":"birth-of-electronic-imaging-idea-1","winnerReason":"The CCD became a general image-capture platform whose cost, size, and quality improved with the semiconductor industry.","investorLesson":"A technology that rides a powerful manufacturing learning curve can overtake a strong incumbent."},"sources":["https://www.computerhistory.org/revolution/memory-storage/8/263/1117","https://www.computerhistory.org/siliconengine/tunnel-diode-promises-a-high-speed-semiconductor-switch/"]},{"id":"the-race-to-record-sound","sequence":42,"category":"Computing, Information, and Communications","title":"The Race to Record Sound","discipline":"audio and media technology","era":"1900s–1950s","connection":"Competing media for capturing sound so it can be replayed later.","briefing":"Recorded sound is moving beyond discs. Three technologies can preserve an electrical waveform, but they differ sharply in editing, copying, and the markets they can enter.","difficulty":"intermediate","judgmentCall":false,"rankingCaveat":"","contentWarnings":[],"ideas":[{"concealedTitle":"Magnetized Coated Tape","pitch":"A flexible strip coated with magnetic particles records sound continuously and can be erased, edited, copied, and reused.","knownAdvantages":["Long recording time","Easy physical editing","Reusable and duplicable"],"knownRisks":["Background hiss","Tape can stretch or wear","Needs precise heads and transport"],"researchReports":{"technical":"The audio signal changes magnetization along a moving coated strip; playback converts the magnetic pattern back into electricity.","manufacturing":"Coating uniform particles onto inexpensive tape and maintaining steady speed are the main production challenges.","market":"Radio, music, dictation, film production, broadcasting, and computers all need editable recording.","historicalContext":"Wire recorders exist, while disc recording is established but difficult to edit and reuse."},"reveal":{"historicalName":"Magnetic tape recording","impactTier":"transformative","returnMultiplier":3.0,"legacyBonusMultiplier":0.0,"historicalOutcome":"Became the core medium for studio audio, broadcasting, home recording, video, and early large-scale computer storage.","rankingRationale":"Flexible tape made recording editable, copyable, inexpensive, and adaptable to both sound and data."},"innovationTree":{"nodes":[{"id":"the-race-to-record-sound-idea-1-node-1","label":"Magnetic tape","kind":"root"},{"id":"the-race-to-record-sound-idea-1-node-2","label":"radio production","kind":"application"},{"id":"the-race-to-record-sound-idea-1-node-3","label":"recorded music and multitracking","kind":"application"},{"id":"the-race-to-record-sound-idea-1-node-4","label":"video recording","kind":"application"},{"id":"the-race-to-record-sound-idea-1-node-5","label":"computer data storage","kind":"application"}],"edges":[{"from":"the-race-to-record-sound-idea-1-node-1","to":"the-race-to-record-sound-idea-1-node-2"},{"from":"the-race-to-record-sound-idea-1-node-1","to":"the-race-to-record-sound-idea-1-node-3"},{"from":"the-race-to-record-sound-idea-1-node-1","to":"the-race-to-record-sound-idea-1-node-4"},{"from":"the-race-to-record-sound-idea-1-node-1","to":"the-race-to-record-sound-idea-1-node-5"}]},"tags":["magnetic recording","editable medium","platform"],"id":"the-race-to-record-sound-idea-1","displayOrder":1},{"concealedTitle":"Variable Optical Track on Film","pitch":"Sound is converted into a changing light pattern photographed beside motion-picture images and read back by a lamp and photoelectric cell.","knownAdvantages":["Image and sound remain synchronized","Copies with the film","No magnetic head needed"],"knownRisks":["Mainly tied to cinema","Noise and distortion limits","Editing is less flexible"],"researchReports":{"technical":"The waveform is stored as variations in the width or darkness of an optical track running alongside the film frames.","manufacturing":"Film laboratories can print picture and soundtrack together using established photographic processes.","market":"The movie industry urgently needs reliable synchronized sound.","historicalContext":"It can dominate one enormous medium without becoming the universal way to record sound elsewhere."},"reveal":{"historicalName":"Optical sound-on-film","impactTier":"medium","returnMultiplier":1.5,"legacyBonusMultiplier":0.0,"historicalOutcome":"Made synchronized talking pictures practical and remained a durable cinema standard, but its main application stayed tied to film.","rankingRationale":"It transformed movies, yet lacked the cross-industry flexibility of magnetic tape."},"innovationTree":{"nodes":[{"id":"the-race-to-record-sound-idea-2-node-1","label":"Optical soundtrack","kind":"root"},{"id":"the-race-to-record-sound-idea-2-node-2","label":"talking pictures","kind":"application"},{"id":"the-race-to-record-sound-idea-2-node-3","label":"cinema distribution","kind":"application"},{"id":"the-race-to-record-sound-idea-2-node-4","label":"archival film sound","kind":"application"}],"edges":[{"from":"the-race-to-record-sound-idea-2-node-1","to":"the-race-to-record-sound-idea-2-node-2"},{"from":"the-race-to-record-sound-idea-2-node-1","to":"the-race-to-record-sound-idea-2-node-3"},{"from":"the-race-to-record-sound-idea-2-node-1","to":"the-race-to-record-sound-idea-2-node-4"}]},"tags":["cinema","optical recording"],"id":"the-race-to-record-sound-idea-2","displayOrder":2},{"concealedTitle":"Magnetized Steel Wire","pitch":"A thin steel wire moves past a recording head and stores sound as a magnetic pattern.","knownAdvantages":["Compact reels","Rugged recording medium","Useful for speech and field recording"],"knownRisks":["Hard to splice and edit","Wire tangles and breaks","Lower fidelity and convenience"],"researchReports":{"technical":"The principle is sound: varying magnetization along the wire stores the audio waveform.","manufacturing":"Steel wire and recording heads are practical, and wartime demand helps production.","market":"Military messages, dictation, and some home users need portable recording.","historicalContext":"A flat coated tape can carry more information, is easier to handle, and can be physically edited."},"reveal":{"historicalName":"Magnetic wire recorder","impactTier":"limited","returnMultiplier":0.25,"legacyBonusMultiplier":0.25,"historicalOutcome":"Found military, dictation, and early consumer uses but quickly lost to magnetic tape after World War II.","rankingRationale":"It worked, but tape was easier to edit, duplicate, store, and extend into higher-fidelity and data applications."},"innovationTree":{"nodes":[{"id":"the-race-to-record-sound-idea-3-node-1","label":"Wire recorder","kind":"root"},{"id":"the-race-to-record-sound-idea-3-node-2","label":"wartime field recording","kind":"application"},{"id":"the-race-to-record-sound-idea-3-node-3","label":"office dictation","kind":"application"},{"id":"the-race-to-record-sound-idea-3-node-4","label":"long-term mass recording","kind":"blocked"}],"edges":[{"from":"the-race-to-record-sound-idea-3-node-1","to":"the-race-to-record-sound-idea-3-node-2"},{"from":"the-race-to-record-sound-idea-3-node-1","to":"the-race-to-record-sound-idea-3-node-3"},{"from":"the-race-to-record-sound-idea-3-node-1","to":"the-race-to-record-sound-idea-3-node-4","status":"blocked"}]},"tags":["wire recording","displaced technology"],"id":"the-race-to-record-sound-idea-3","displayOrder":3}],"expertiseQuestion":{"prompt":"Which clue best identifies the idea most likely to create the broadest durable platform?","options":["It combines a workable core with scalable production, infrastructure, and many follow-on uses.","It has the most dramatic demonstration.","It is the earliest proposal.","It uses the most specialized terminology."],"correctIndex":0,"explanation":"Transformative innovations usually align technical performance, manufacturability, demand, and an expandable ecosystem.","bonusMultiplier":1.1},"debrief":{"winnerIdeaId":"the-race-to-record-sound-idea-1","winnerReason":"Magnetic tape did more than record sound: it became a reusable information medium that could support editing, video, and computer data.","investorLesson":"Look for the option that changes the workflow, not merely the storage material."},"sources":["https://americanhistory.si.edu/collections/object/nmah_2016756","https://americanhistory.si.edu/collections/object/nmah_1301344","https://americanhistory.si.edu/collections/object/nmah_759432"]},{"id":"the-early-satellite-communications-race","sequence":43,"category":"Earth, Atmosphere, Astronomy, and Space","title":"The Early Satellite-Communications Race","discipline":"space communications","era":"1958–1965","connection":"Early U.S. programs tested radically different ways to use space as a communications relay.","briefing":"Long-distance communications are expensive and vulnerable. Investors must choose between a passive mirror, an active satellite in a difficult orbit, and an artificial reflecting belt.","difficulty":"intermediate","judgmentCall":false,"rankingCaveat":"","contentWarnings":[],"ideas":[{"concealedTitle":"Active Repeater in a 24-Hour Orbit","pitch":"A satellite receives a radio signal, amplifies it, and retransmits it while orbiting at the same rate that Earth turns.","knownAdvantages":["Appears fixed over one region","High communication capacity","Ground antennas do not need constant tracking"],"knownRisks":["Very difficult high orbit","Signal delay","Complex reliable electronics in space"],"researchReports":{"technical":"At geosynchronous altitude, the satellite returns above the same longitude each day; an active transponder strengthens weak incoming signals.","manufacturing":"The spacecraft must survive launch, operate unattended, and maintain attitude and orbit for years.","market":"International telephone, television, military links, and remote regions need continuous long-distance channels.","historicalContext":"Medium-orbit active satellites and passive reflectors work, but require more satellites or tracking effort."},"reveal":{"historicalName":"Syncom and geostationary communications satellites","impactTier":"transformative","returnMultiplier":3.0,"legacyBonusMultiplier":0.0,"historicalOutcome":"Established the architecture used by global television, telephone, data links, weather satellites, and many modern communications systems.","rankingRationale":"One satellite could continuously cover a huge region, turning an expensive experiment into scalable communications infrastructure."},"innovationTree":{"nodes":[{"id":"the-early-satellite-communications-race-idea-1-node-1","label":"Geostationary active satellite","kind":"root"},{"id":"the-early-satellite-communications-race-idea-1-node-2","label":"global television distribution","kind":"application"},{"id":"the-early-satellite-communications-race-idea-1-node-3","label":"international telephone and data","kind":"application"},{"id":"the-early-satellite-communications-race-idea-1-node-4","label":"weather communications","kind":"application"},{"id":"the-early-satellite-communications-race-idea-1-node-5","label":"remote and maritime connectivity","kind":"application"}],"edges":[{"from":"the-early-satellite-communications-race-idea-1-node-1","to":"the-early-satellite-communications-race-idea-1-node-2"},{"from":"the-early-satellite-communications-race-idea-1-node-1","to":"the-early-satellite-communications-race-idea-1-node-3"},{"from":"the-early-satellite-communications-race-idea-1-node-1","to":"the-early-satellite-communications-race-idea-1-node-4"},{"from":"the-early-satellite-communications-race-idea-1-node-1","to":"the-early-satellite-communications-race-idea-1-node-5"}]},"tags":["geosynchronous orbit","active repeater","platform"],"id":"the-early-satellite-communications-race-idea-1","displayOrder":1},{"concealedTitle":"Giant Reflective Balloon","pitch":"A large metal-coated balloon in low orbit passively reflects radio signals sent from one ground station toward another.","knownAdvantages":["Simple electronics","Visible and easy to track","Proves space relay is possible"],"knownRisks":["Weak reflected signal","Short passes over each station","Low capacity"],"researchReports":{"technical":"The satellite acts like a mirror rather than an amplifier, so only a tiny fraction of transmitted power reaches the receiver.","manufacturing":"Inflatable reflective spheres are comparatively simple but must deploy reliably in space.","market":"Governments and telephone companies value demonstration links and atmospheric measurements.","historicalContext":"Active satellites promise better signal quality and capacity once reliable space electronics are available."},"reveal":{"historicalName":"Echo passive communications satellite","impactTier":"medium","returnMultiplier":1.5,"legacyBonusMultiplier":0.25,"historicalOutcome":"Demonstrated voice and telephone relay through space and supported important geodetic and atmospheric measurements.","rankingRationale":"It proved the concept and generated valuable science, but passive reflection could not match active satellites for capacity and continuous service."},"innovationTree":{"nodes":[{"id":"the-early-satellite-communications-race-idea-2-node-1","label":"Echo balloon satellite","kind":"root"},{"id":"the-early-satellite-communications-race-idea-2-node-2","label":"first satellite voice links","kind":"application"},{"id":"the-early-satellite-communications-race-idea-2-node-3","label":"geodesy and atmospheric density","kind":"application"},{"id":"the-early-satellite-communications-race-idea-2-node-4","label":"passive relay experiments","kind":"application"}],"edges":[{"from":"the-early-satellite-communications-race-idea-2-node-1","to":"the-early-satellite-communications-race-idea-2-node-2"},{"from":"the-early-satellite-communications-race-idea-2-node-1","to":"the-early-satellite-communications-race-idea-2-node-3"},{"from":"the-early-satellite-communications-race-idea-2-node-1","to":"the-early-satellite-communications-race-idea-2-node-4"}]},"tags":["passive satellite","demonstration"],"id":"the-early-satellite-communications-race-idea-2","displayOrder":2},{"concealedTitle":"Orbiting Cloud of Tiny Dipoles","pitch":"Millions of tiny conductive needles are released into orbit to create an artificial radio-reflecting belt around Earth.","knownAdvantages":["No vulnerable active spacecraft","Potential global reflection layer","Military communication backup"],"knownRisks":["Very low bandwidth","Uncontrolled orbital material","Astronomical and political objections"],"researchReports":{"technical":"Each dipole can scatter radio waves, but maintaining a useful and predictable reflecting cloud is difficult.","manufacturing":"The needles are easy to make; safe deployment and orbital behavior are the real problems.","market":"The military values resilient communication, but conventional satellites are improving quickly.","historicalContext":"Scientists and other nations object to altering the near-Earth environment with persistent artificial material."},"reveal":{"historicalName":"Project West Ford","impactTier":"limited","returnMultiplier":0.25,"legacyBonusMultiplier":0.0,"historicalOutcome":"Demonstrated a controversial artificial radio reflector but was not developed into an operational communications network.","rankingRationale":"Low capacity, environmental concerns, international opposition, and rapid progress in active satellites removed its strategic case."},"innovationTree":{"nodes":[{"id":"the-early-satellite-communications-race-idea-3-node-1","label":"West Ford dipole cloud","kind":"root"},{"id":"the-early-satellite-communications-race-idea-3-node-2","label":"experimental military radio link","kind":"application"},{"id":"the-early-satellite-communications-race-idea-3-node-3","label":"operational global network","kind":"blocked"},{"id":"the-early-satellite-communications-race-idea-3-node-4","label":"acceptable orbital environment","kind":"blocked"}],"edges":[{"from":"the-early-satellite-communications-race-idea-3-node-1","to":"the-early-satellite-communications-race-idea-3-node-2"},{"from":"the-early-satellite-communications-race-idea-3-node-1","to":"the-early-satellite-communications-race-idea-3-node-3","status":"blocked"},{"from":"the-early-satellite-communications-race-idea-3-node-1","to":"the-early-satellite-communications-race-idea-3-node-4","status":"blocked"}]},"tags":["orbital environment","military experiment"],"id":"the-early-satellite-communications-race-idea-3","displayOrder":3}],"expertiseQuestion":{"prompt":"Which clue best identifies the idea most likely to create the broadest durable platform?","options":["It combines a workable core with scalable production, infrastructure, and many follow-on uses.","It has the most dramatic demonstration.","It is the earliest proposal.","It uses the most specialized terminology."],"correctIndex":0,"explanation":"Transformative innovations usually align technical performance, manufacturability, demand, and an expandable ecosystem.","bonusMultiplier":1.1},"debrief":{"winnerIdeaId":"the-early-satellite-communications-race-idea-1","winnerReason":"Geostationary active satellites combined continuous coverage with strong signals and became infrastructure rather than a one-off experiment.","investorLesson":"The winning architecture often reduces operating complexity for every user, even if the central system is harder to build."},"sources":["https://www.nasa.gov/history/communications-satellites/","https://www.nasa.gov/image-article/50-years-of-communications-space/","https://ntrs.nasa.gov/citations/19730022102"]},{"id":"the-cargo-handling-revolution","sequence":44,"category":"Transportation, Mechanical Engineering, and Energy","title":"The Cargo-Handling Revolution","discipline":"freight and logistics","era":"1940s–1970s","connection":"Three methods try to replace slow piece-by-piece cargo handling with larger standardized units.","briefing":"Ships spend days in port while workers move individual crates, sacks, and barrels. The opportunity is enormous, but every solution requires coordination across transportation systems.","difficulty":"intermediate","judgmentCall":false,"rankingCaveat":"","contentWarnings":[],"ideas":[{"concealedTitle":"Standardized Intermodal Steel Box","pitch":"Goods are packed once into a locked steel box that moves unchanged among truck, train, and ship using standardized fittings and cranes.","knownAdvantages":["Fast transfers","Less theft and damage","Works across transportation modes"],"knownRisks":["Needs new ships, cranes, ports, and standards","Large up-front capital","Labor resistance"],"researchReports":{"technical":"The key invention is the complete system: standard dimensions, corner fittings, twist locks, cranes, ships, chassis, and documentation.","manufacturing":"Steel boxes are straightforward, but global value appears only after ports, carriers, railroads, and truckers adopt common standards.","market":"Nearly all manufactured goods could move more cheaply if cargo handling time collapses.","historicalContext":"Earlier boxes existed; the gamble is whether an interoperable network can overcome institutional resistance."},"reveal":{"historicalName":"Modern intermodal containerization","impactTier":"transformative","returnMultiplier":3.0,"legacyBonusMultiplier":0.0,"historicalOutcome":"Reorganized ports, ships, trucking, rail freight, factories, and global supply chains while sharply reducing handling cost, loss, and delay.","rankingRationale":"It was a system innovation: standardization allowed one unit to flow through an entire global network without unpacking."},"innovationTree":{"nodes":[{"id":"the-cargo-handling-revolution-idea-1-node-1","label":"Standard shipping container","kind":"root"},{"id":"the-cargo-handling-revolution-idea-1-node-2","label":"container ships and terminals","kind":"application"},{"id":"the-cargo-handling-revolution-idea-1-node-3","label":"intermodal rail and trucking","kind":"application"},{"id":"the-cargo-handling-revolution-idea-1-node-4","label":"global supply chains","kind":"application"},{"id":"the-cargo-handling-revolution-idea-1-node-5","label":"lower theft and cargo damage","kind":"application"}],"edges":[{"from":"the-cargo-handling-revolution-idea-1-node-1","to":"the-cargo-handling-revolution-idea-1-node-2"},{"from":"the-cargo-handling-revolution-idea-1-node-1","to":"the-cargo-handling-revolution-idea-1-node-3"},{"from":"the-cargo-handling-revolution-idea-1-node-1","to":"the-cargo-handling-revolution-idea-1-node-4"},{"from":"the-cargo-handling-revolution-idea-1-node-1","to":"the-cargo-handling-revolution-idea-1-node-5"}]},"tags":["standardization","intermodal system","network effects"],"id":"the-cargo-handling-revolution-idea-1","displayOrder":1},{"concealedTitle":"Reusable Pallet Unit Loads","pitch":"Boxes and sacks are stacked on a standard platform so forklifts can move a large unit instead of handling every package separately.","knownAdvantages":["Large labor savings","Works in warehouses and trucks","Modest infrastructure change"],"knownRisks":["Loads still need protection","Not ideal for every product","Does not eliminate shipboard handling"],"researchReports":{"technical":"A pallet converts many loose items into one forklift-sized load while preserving access to the goods.","manufacturing":"Wooden or metal pallets and forklifts can be adopted incrementally without rebuilding an entire port.","market":"Warehouses, factories, military logistics, retail distribution, and trucking all benefit.","historicalContext":"Palletization can spread earlier and more easily than containers, but it does not fully integrate ocean, rail, and road handling."},"reveal":{"historicalName":"Palletization","impactTier":"medium","returnMultiplier":1.5,"legacyBonusMultiplier":0.0,"historicalOutcome":"Became foundational to warehousing, military logistics, trucking, and retail distribution and remains essential alongside containers.","rankingRationale":"It delivered enormous handling efficiency but did not create the same sealed, globally standardized door-to-door system."},"innovationTree":{"nodes":[{"id":"the-cargo-handling-revolution-idea-2-node-1","label":"Standard pallet","kind":"root"},{"id":"the-cargo-handling-revolution-idea-2-node-2","label":"forklift warehouses","kind":"application"},{"id":"the-cargo-handling-revolution-idea-2-node-3","label":"military logistics","kind":"application"},{"id":"the-cargo-handling-revolution-idea-2-node-4","label":"retail distribution centers","kind":"application"},{"id":"the-cargo-handling-revolution-idea-2-node-5","label":"truck loading","kind":"application"}],"edges":[{"from":"the-cargo-handling-revolution-idea-2-node-1","to":"the-cargo-handling-revolution-idea-2-node-2"},{"from":"the-cargo-handling-revolution-idea-2-node-1","to":"the-cargo-handling-revolution-idea-2-node-3"},{"from":"the-cargo-handling-revolution-idea-2-node-1","to":"the-cargo-handling-revolution-idea-2-node-4"},{"from":"the-cargo-handling-revolution-idea-2-node-1","to":"the-cargo-handling-revolution-idea-2-node-5"}]},"tags":["unit load","warehouse logistics"],"id":"the-cargo-handling-revolution-idea-2","displayOrder":2},{"concealedTitle":"Ship That Carries Floating Barges","pitch":"A large vessel carries loaded barges that can be lowered into the water and towed to ports without modern cargo-handling equipment.","knownAdvantages":["Can serve shallow or poorly equipped ports","Ship need not wait for unloading","Barges travel inland"],"knownRisks":["Heavy barges reduce payload efficiency","Complex ship and handling gear","Best only on selected routes"],"researchReports":{"technical":"The carrier lifts whole barges aboard, allowing cargo to move through river and ocean networks without unloading.","manufacturing":"Special ships, standardized barges, powerful cranes, and compatible inland routes are all required.","market":"Developing ports and river systems provide a plausible niche.","historicalContext":"Container terminals are spreading and can move lighter standardized boxes through more modes."},"reveal":{"historicalName":"LASH barge-carrier system","impactTier":"limited","returnMultiplier":0.25,"legacyBonusMultiplier":0.0,"historicalOutcome":"Operated on selected routes and solved real port-access problems but remained a niche beside container shipping.","rankingRationale":"The system carried too much structural weight and required specialized routes and equipment, while containers fit a much broader network."},"innovationTree":{"nodes":[{"id":"the-cargo-handling-revolution-idea-3-node-1","label":"LASH carrier","kind":"root"},{"id":"the-cargo-handling-revolution-idea-3-node-2","label":"river-to-ocean barge service","kind":"application"},{"id":"the-cargo-handling-revolution-idea-3-node-3","label":"specialized trade routes","kind":"application"},{"id":"the-cargo-handling-revolution-idea-3-node-4","label":"dominant global freight standard","kind":"blocked"}],"edges":[{"from":"the-cargo-handling-revolution-idea-3-node-1","to":"the-cargo-handling-revolution-idea-3-node-2"},{"from":"the-cargo-handling-revolution-idea-3-node-1","to":"the-cargo-handling-revolution-idea-3-node-3"},{"from":"the-cargo-handling-revolution-idea-3-node-1","to":"the-cargo-handling-revolution-idea-3-node-4","status":"blocked"}]},"tags":["barge carrier","niche logistics"],"id":"the-cargo-handling-revolution-idea-3","displayOrder":3}],"expertiseQuestion":{"prompt":"Which clue best identifies the idea most likely to create the broadest durable platform?","options":["It combines a workable core with scalable production, infrastructure, and many follow-on uses.","It has the most dramatic demonstration.","It is the earliest proposal.","It uses the most specialized terminology."],"correctIndex":0,"explanation":"Transformative innovations usually align technical performance, manufacturability, demand, and an expandable ecosystem.","bonusMultiplier":1.1},"debrief":{"winnerIdeaId":"the-cargo-handling-revolution-idea-1","winnerReason":"Containerization succeeded because the box, locks, cranes, ships, trucks, trains, standards, and information systems were designed as one interoperable network.","investorLesson":"The object may be simple; the transformative innovation is often the surrounding system and standard."},"sources":["https://americanhistory.si.edu/explore/exhibitions/america-on-the-move/online/transforming-waterfront","https://americanhistory.si.edu/collections/object/nmah_844274","https://maritime.org/the-working-waterfront/"]},{"id":"the-first-modern-antibacterial-race","sequence":45,"category":"Medicine and Pharmaceuticals","title":"The First Modern Antibacterial Race","discipline":"infectious-disease medicine","era":"1930s–1940s","connection":"Competing early antibacterial discoveries offered different balances of potency, manufacturability, and safety.","briefing":"Doctors can finally see compounds stop bacteria in the laboratory. The investment question is which one can be produced, safely reach infections inside the body, and support many later medicines.","difficulty":"intermediate","judgmentCall":false,"rankingCaveat":"","contentWarnings":[],"ideas":[{"concealedTitle":"Mold-Derived Bacterial Inhibitor","pitch":"A substance secreted by a common mold kills or stops many disease-causing bacteria while showing comparatively low toxicity to animals.","knownAdvantages":["Powerful against serious infections","Selective toxicity","Potentially broad medical use"],"knownRisks":["Unstable and difficult to purify","Tiny early yields","Mass fermentation required"],"researchReports":{"technical":"The substance interferes with bacterial cell-wall construction, a target absent from human cells.","manufacturing":"The discovery is initially almost unusable because purification and production yields are poor; industrial fermentation is the decisive hurdle.","market":"Pneumonia, wound infections, sepsis, and wartime injuries create enormous unmet need.","historicalContext":"Synthetic antibacterial drugs already exist, so the mold product must prove it can be manufactured reliably."},"reveal":{"historicalName":"Penicillin","impactTier":"transformative","returnMultiplier":3.0,"legacyBonusMultiplier":0.0,"historicalOutcome":"Mass production during World War II opened the modern antibiotic era and transformed treatment of bacterial infections, surgery, and trauma care.","rankingRationale":"Its unusually favorable selective toxicity and broad clinical value justified solving a very difficult manufacturing problem."},"innovationTree":{"nodes":[{"id":"the-first-modern-antibacterial-race-idea-1-node-1","label":"Penicillin","kind":"root"},{"id":"the-first-modern-antibacterial-race-idea-1-node-2","label":"treatment of sepsis and pneumonia","kind":"application"},{"id":"the-first-modern-antibacterial-race-idea-1-node-3","label":"safer surgery and trauma care","kind":"application"},{"id":"the-first-modern-antibacterial-race-idea-1-node-4","label":"industrial antibiotic fermentation","kind":"application"},{"id":"the-first-modern-antibacterial-race-idea-1-node-5","label":"later beta-lactam drugs","kind":"application"}],"edges":[{"from":"the-first-modern-antibacterial-race-idea-1-node-1","to":"the-first-modern-antibacterial-race-idea-1-node-2"},{"from":"the-first-modern-antibacterial-race-idea-1-node-1","to":"the-first-modern-antibacterial-race-idea-1-node-3"},{"from":"the-first-modern-antibacterial-race-idea-1-node-1","to":"the-first-modern-antibacterial-race-idea-1-node-4"},{"from":"the-first-modern-antibacterial-race-idea-1-node-1","to":"the-first-modern-antibacterial-race-idea-1-node-5"}]},"tags":["antibiotic","fermentation","selective toxicity"],"id":"the-first-modern-antibacterial-race-idea-1","displayOrder":1},{"concealedTitle":"Synthetic Red-Dye Derivative","pitch":"A laboratory-made chemical related to textile dyes is converted in the body into a compound that blocks bacterial metabolism.","knownAdvantages":["Can be chemically manufactured","Works systemically","Immediate clinical results"],"knownRisks":["Allergic and blood-related toxicity","Resistance develops","Less effective for some infections"],"researchReports":{"technical":"The active sulfonamide resembles a nutrient bacteria need, blocking folate metabolism more strongly in microbes than in humans.","manufacturing":"Chemical factories can produce standardized tablets without fermentation.","market":"Before penicillin can be mass-produced, doctors urgently need any systemic antibacterial medicine.","historicalContext":"These drugs can dominate the immediate market but may later be displaced by safer or more powerful antibiotics."},"reveal":{"historicalName":"Sulfonamide drugs","impactTier":"medium","returnMultiplier":1.5,"legacyBonusMultiplier":0.25,"historicalOutcome":"Became the first widely successful systemic antibacterial medicines and saved many lives before penicillin and later antibiotics took over many uses.","rankingRationale":"They were manufacturable and immediately valuable, but toxicity, resistance, and a narrower therapeutic advantage limited their long-run platform."},"innovationTree":{"nodes":[{"id":"the-first-modern-antibacterial-race-idea-2-node-1","label":"Sulfonamides","kind":"root"},{"id":"the-first-modern-antibacterial-race-idea-2-node-2","label":"early systemic infection treatment","kind":"application"},{"id":"the-first-modern-antibacterial-race-idea-2-node-3","label":"wartime medicine","kind":"application"},{"id":"the-first-modern-antibacterial-race-idea-2-node-4","label":"combination antibacterial therapy","kind":"application"}],"edges":[{"from":"the-first-modern-antibacterial-race-idea-2-node-1","to":"the-first-modern-antibacterial-race-idea-2-node-2"},{"from":"the-first-modern-antibacterial-race-idea-2-node-1","to":"the-first-modern-antibacterial-race-idea-2-node-3"},{"from":"the-first-modern-antibacterial-race-idea-2-node-1","to":"the-first-modern-antibacterial-race-idea-2-node-4"}]},"tags":["synthetic drug","first mover"],"id":"the-first-modern-antibacterial-race-idea-2","displayOrder":2},{"concealedTitle":"Soil-Bacterium Membrane Toxin","pitch":"A compound isolated from a soil microbe powerfully damages bacterial membranes and can kill pathogens on contact.","knownAdvantages":["Strong antibacterial action","Natural microbial source","Useful on surfaces and wounds"],"knownRisks":["Damages human cells","Unsafe for systemic dosing","Narrow clinical route"],"researchReports":{"technical":"The peptide disrupts membranes, which explains both its antibacterial strength and its toxicity to human tissues.","manufacturing":"It can be isolated and formulated, but systemic safety is not solved by making more of it.","market":"Topical wounds and laboratory research provide uses, while doctors seek drugs safe enough to circulate through the body.","historicalContext":"A spectacular petri-dish result may fail when the same mechanism harms the patient."},"reveal":{"historicalName":"Gramicidin","impactTier":"limited","returnMultiplier":0.25,"legacyBonusMultiplier":0.0,"historicalOutcome":"Became useful mainly in topical preparations and as a major research tool for membranes rather than a general systemic antibiotic.","rankingRationale":"Its mechanism was insufficiently selective: the property that killed bacteria also damaged human cells."},"innovationTree":{"nodes":[{"id":"the-first-modern-antibacterial-race-idea-3-node-1","label":"Gramicidin","kind":"root"},{"id":"the-first-modern-antibacterial-race-idea-3-node-2","label":"topical antibacterial use","kind":"application"},{"id":"the-first-modern-antibacterial-race-idea-3-node-3","label":"membrane-biophysics research","kind":" const shuffle = arr => {
  const x=[...arr];
  for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}
  return x;
};
const roundById = id => GAME_DATA.roundPackages.find(r => r.id === id);
const ideaById = (round,id) => round.ideas.find(i => i.id === id);

function makeInitialState(roundIds, gameId=null){
  return {
    version: 4,
    screen: 'invest',
    gameId,
    roundIds,
    roundIndex: 0,
    bankrollUnits: Math.round(GAME_DATA.gameConfig.startingBankrollMillions*10),
    gameStartedAt: Date.now(),
    current: null,
    history: []
  };
}
function save(){
  if(!state) return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function loadSave(){
  try {
    const x=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(x && x.version===4 && Array.isArray(x.roundIds) && x.roundIds.length===3 && x.roundIds.every(id=>roundById(id))) return x;
  } catch(e) {}
  return null;
}
function clearSave(){ try{localStorage.removeItem(STORAGE_KEY)}catch(e){} }
function ensureCurrent(){
  if(state.current) return;
  const round=roundById(state.roundIds[state.roundIndex]);
  const ideaOrder=shuffle(round.ideas.map(i=>i.id));
  state.current={
    roundId: round.id,
    roundStartBankrollUnits: state.bankrollUnits,
    ideaOrder,
    purchasedReports: [],
    allocations: Object.fromEntries(ideaOrder.map(id=>[id,0])),
    revealCount: 0,
    result: null
  };
  save();
}
const gameSetById = id => GAME_SETS.find(g=>g.id===id);
function startGameSet(gameId){
  const game=gameSetById(gameId);

  state=makeInitialState([...game.roundIds], game.id);

}
function startGame(ids, gameId=null){

function currentRound(){ return roundById(state.roundIds[state.roundIndex]); }

function remaining(){ return state.bankrollUnits-totalAllocated(); }
function purchasedKey(ideaId,type){ return ideaId+'::'+type; }
function isPurchased(ideaId,type){ return state.current.purchasedReports.includes(purchasedKey(ideaId,type)); }
function reportSpend(){ return 0; }
function showToast(msg){
  const t=$('#toast'); if(!t)return; t.textContent=msg; t.classList.add('show'); clearTimeout(showToast.timer); showToast.timer=setTimeout(()=>t.classList.remove('show'),2200);
}

function topbar(){
  const inGame=state && !['home','picker'].includes(state.screen);

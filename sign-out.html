<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing out · First Person Learning</title>

<!-- Use the SAME Clerk Publishable Key as sign-in.html. -->
<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_live_Y2xlcmsuZmlyc3RwZXJzb25sZWFybi5jb20k"
  src="https://clerk.firstpersonlearn.com/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
  type="text/javascript"></script>

<meta name="theme-color" content="#0d0f13">
<style>
  /* Committed dark, no light variant. This page exists for the half-second
     between pressing Sign out and arriving at sign-in.html, and both pages
     either side of it are dark — a white flash between two dark screens reads
     as the app breaking. */
  body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;
       justify-content:center;background:#0d0f13;color:#a8b1c0;
       font:400 15px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
       -webkit-font-smoothing:antialiased}
</style>
</head>
<body>
  <p>Signing you out…</p>
<script>
window.addEventListener("load", async function () {
  try {
    if (typeof Clerk !== "undefined") { await Clerk.load(); await Clerk.signOut(); }
  } catch (e) {}
  location.replace("/sign-in.html");
});
</script>
</body>
</html>

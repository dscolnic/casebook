<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing out · RECKON</title>

<!-- Use the SAME Clerk Publishable Key as sign-in.html. -->
<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_test_REPLACE_WITH_YOUR_KEY"
  src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
  type="text/javascript"></script>

<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;color:#565651;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  @media (prefers-color-scheme: dark){body{background:#16150f;color:#a8a69c}}
</style>
</head>
<body>
  <p>Signing you out…</p>
<script>
window.addEventListener("load", async function () {
  try {
    if (typeof Clerk !== "undefined") { await Clerk.load(); await Clerk.signOut(); }
  } catch (e) {}
  location.replace("/sign-in.html");
});
</script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reactor Sensor Map</title>
<style>
:root{--bg:#07121d;--line:#385b70;--text:#eef7fb;--muted:#afc2cd;--blue:#70c9f2;--steel:#2e77a4;
  --gold:#efca72;--green:#78d69a;--red:#ff9292;--orange:#f0ad67}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(circle at 12% 0%,rgba(47,116,164,.28),transparent 31%),linear-gradient(180deg,#05101a,#0a1f30 55%,#05101a)}
.wrap{max-width:1060px;margin:auto;padding:24px 20px 70px}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--gold);font-weight:900}
h1{font-size:30px;margin:6px 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 16px;font-size:15px;line-height:1.5;max-width:720px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:1px solid var(--line);background:#12304559;color:var(--text);padding:9px 14px;border-radius:9px;cursor:pointer;font:inherit;font-size:14px}
.tab:hover{background:#1c3f58}
.tab.on{background:#2e77a4;border-color:#4d95bf;font-weight:800}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{border:1px solid var(--line);background:rgba(13,34,51,.9);border-radius:16px;padding:14px}
svg{width:100%;height:auto;display:block}
.mapcap{font-size:13px;color:var(--muted);margin-top:6px;text-align:center}
.legend{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:11px;border:1px solid var(--line);background:#112b3f;border-radius:11px;padding:10px 12px;cursor:pointer;transition:border-color .12s}
.li:hover,.li.sel{border-color:var(--blue)}
.li.sel{background:#163953}
.badge{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;color:#07121d;background:var(--steel)}
.li.off .badge{background:var(--orange)}
.li .body{min-width:0}
.li .nm{font-size:14px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.li .val{font-size:12px;font-weight:800;color:var(--blue)}
.li.off .val{color:var(--orange)}
.li .pp{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:3px}
.reading{border-top:1px solid #2c4a5e;margin-top:6px;padding-top:6px;font-size:12px}
.hintbar{font-size:13px;color:#d4e2e9;line-height:1.5;border-left:3px solid var(--gold);background:rgba(239,202,114,.08);padding:10px 13px;border-radius:9px;margin-top:14px}
/* svg pins */
.pin circle{stroke:#07121d;stroke-width:2;cursor:pointer}
.pin .num{fill:#07121d;font-weight:900;font-size:13px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin.sel circle{stroke:#fff;stroke-width:3}
.lbl{fill:var(--muted);font-size:11px}
.eqlbl{fill:#8fb0c2;font-size:11px;font-weight:700;letter-spacing:.03em}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="wrap">
<div class="kicker">Reactor operations · orientation</div>
<h1>The Plant, at a Glance</h1>
<p class="sub">Where each sensor sits, and what it watches. Switch alarms to see which sensors light up —
the <b>pattern of what's off-normal</b> is the diagnosis. Tap any pin or row for its explanation.</p>

<div class="tabs" id="tabs"></div>

<div class="grid">
  <div class="panel">
    <svg viewBox="0 0 520 470" role="img" aria-label="Pressurized-water reactor schematic">
      <!-- containment dome -->
      <path d="M40,430 L40,200 Q40,70 235,70 Q430,70 430,200 L430,430 Z"
            fill="rgba(112,201,242,.05)" stroke="var(--line)" stroke-width="2"/>
      <text x="235" y="90" class="eqlbl" text-anchor="middle">CONTAINMENT BUILDING</text>
      <!-- floor / sump -->
      <line x1="40" y1="430" x2="430" y2="430" stroke="var(--line)" stroke-width="2"/>
      <path d="M120,430 L150,452 L250,452 L280,430 Z" fill="rgba(112,201,242,.10)" stroke="var(--line)" stroke-width="1.5"/>
      <text x="200" y="465" class="lbl" text-anchor="middle">sump (floor)</text>
      <!-- reactor vessel + core -->
      <rect x="105" y="250" width="70" height="150" rx="30" fill="#173e59" stroke="var(--blue)" stroke-width="2"/>
      <rect x="120" y="300" width="40" height="70" fill="none" stroke="var(--gold)" stroke-width="2"/>
      <line x1="127" y1="305" x2="127" y2="365" stroke="var(--gold)" stroke-width="2"/>
      <line x1="140" y1="305" x2="140" y2="365" stroke="var(--gold)" stroke-width="2"/>
      <line x1="153" y1="305" x2="153" y2="365" stroke="var(--gold)" stroke-width="2"/>
      <text x="140" y="415" class="lbl" text-anchor="middle">reactor core</text>
      <!-- pressurizer -->
      <rect x="215" y="150" width="42" height="120" rx="16" fill="#173e59" stroke="var(--blue)" stroke-width="2"/>
      <text x="236" y="285" class="lbl" text-anchor="middle">pressurizer</text>
      <!-- steam generator -->
      <rect x="330" y="140" width="66" height="270" rx="26" fill="#173e59" stroke="var(--blue)" stroke-width="2"/>
      <text x="363" y="425" class="lbl" text-anchor="middle">steam generator</text>
      <!-- primary loop (blue): hot leg vessel->SG, cold leg SG->pump->vessel -->
      <path d="M175,270 H236 V150 M236,175 H363 V140" fill="none" stroke="var(--blue)" stroke-width="4" opacity=".8"/>
      <path d="M363,410 H300 Q270,410 270,388 H210 Q185,388 185,400 V400" fill="none" stroke="var(--steel)" stroke-width="4" opacity=".8"/>
      <circle cx="240" cy="388" r="12" fill="#0d2233" stroke="var(--blue)" stroke-width="2"/>
      <text x="240" y="391" class="lbl" text-anchor="middle" style="font-size:9px">pump</text>
      <!-- radiation monitors A/B/C near top -->
      <circle cx="290" cy="120" r="7" fill="#0d2233" stroke="var(--blue)" stroke-width="1.5"/>
      <circle cx="312" cy="120" r="7" fill="#0d2233" stroke="var(--blue)" stroke-width="1.5"/>
      <circle cx="334" cy="120" r="7" fill="#0d2233" stroke="var(--blue)" stroke-width="1.5"/>
      <text x="312" y="103" class="lbl" text-anchor="middle">rad monitors A · B · C</text>
      <!-- secondary side: steam out to turbine -->
      <path d="M396,175 H470 V150" fill="none" stroke="var(--gold)" stroke-width="3" stroke-dasharray="5 4"/>
      <path d="M455,150 l35,-14 v28 z" fill="#173e59" stroke="var(--gold)" stroke-width="1.5"/>
      <circle cx="500" cy="150" r="12" fill="#173e59" stroke="var(--gold)" stroke-width="1.5"/>
      <text x="478" y="192" class="lbl" text-anchor="middle">turbine (secondary)</text>
      <!-- pins injected here -->
      <g id="pins"></g>
    </svg>
    <div class="mapcap" id="mapcap"></div>
  </div>

  <div>
    <div class="legend" id="legend"></div>
    <div class="hintbar" id="hint"></div>
  </div>
</div>

<script>
const S=[
 {id:'coretemp',n:3,name:'Core exit temperature',x:140,y:258,purpose:"Temperature of water leaving the core. After a trip it should fall as decay heat is carried away."},
 {id:'rcs',n:1,name:'RCS pressure',x:205,y:270,purpose:"Pressure in the sealed coolant loop. Falling = coolant escaping; rising = heat with nowhere to go."},
 {id:'przr',n:2,name:'Pressurizer level',x:236,y:200,purpose:"How full the tank that sets coolant pressure is — a proxy for how much water remains in the primary loop."},
 {id:'crad',n:4,name:'Containment radiation (Monitor A)',x:290,y:120,purpose:"Radiation inside containment. Rises if radioactive coolant escapes — or if this one detector fails."},
 {id:'redun',n:8,name:'Redundant monitors (B & C)',x:323,y:120,purpose:"Independent detectors. If A screams but B & C read normal, the problem is the sensor, not the plant."},
 {id:'sg',n:6,name:'Steam generator level',x:363,y:275,purpose:"The boilers that carry the core's heat away. If they boil dry, the core loses its heat sink."},
 {id:'srad',n:7,name:'Secondary-side radiation',x:452,y:175,purpose:"Radiation on the steam side. Rises only if a tube leaks primary water into the secondary loop."},
 {id:'sump',n:5,name:'Containment sump',x:200,y:442,purpose:"Water pooling on the containment floor means coolant is leaking out of the pipes."}
];
const SCENARIOS=[
 {key:'loca',tab:'Alarm 1 · pressure falling',
  hint:"A real <b>loss-of-coolant accident</b>. See how the off-normal pins cluster around the <b>coolant loop and the sump</b> — coolant is leaving the pipes and pooling on the floor.",
  v:{rcs:'1,650 psia  ↓',przr:'22%  ↓',coretemp:'Rising  ↑',crad:'Mildly up',redun:'Agree',sg:'Normal',srad:'Normal',sump:'Rising  ↑'},
  off:['rcs','przr','coretemp','sump']},
 {key:'heatsink',tab:'Alarm 2 · temperature rising',
  hint:"A <b>lost heat sink</b>. Now the off-normal pins sit on the <b>steam generator and core temperature</b>, while the sump stays dry — nothing is leaking; the heat just can't escape.",
  v:{rcs:'Rising  ↑',przr:'High/normal',coretemp:'Rising  ↑',crad:'Normal',redun:'Agree',sg:'Boiling dry  ↓',srad:'Normal',sump:'Dry'},
  off:['rcs','coretemp','sg']},
 {key:'instrument',tab:'Alarm 3 · radiation off-scale',
  hint:"A <b>faulted instrument</b>. Only <b>one</b> pin is lit — Monitor A — while its redundant partners B & C and every physical sensor read normal. One detector against all the others is a sensor failure, not a release.",
  v:{rcs:'Normal',przr:'Normal',coretemp:'Settling',crad:'OFF-SCALE  ↑',redun:'B & C normal',sg:'Normal',srad:'Normal',sump:'Dry'},
  off:['crad']}
];

let scn=0, sel=null;
const pinsG=document.getElementById('pins'), legendEl=document.getElementById('legend'),
      tabsEl=document.getElementById('tabs'), hintEl=document.getElementById('hint'), mapcap=document.getElementById('mapcap');

tabsEl.innerHTML=SCENARIOS.map((s,i)=>`<button class="tab ${i===0?'on':''}" data-s="${i}">${s.tab}</button>`).join('');
tabsEl.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{scn=+b.dataset.s;sel=null;render();});

function render(){
  const S0=SCENARIOS[scn];
  tabsEl.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',i===scn));
  // pins
  pinsG.innerHTML=S.map(s=>{
    const off=S0.off.includes(s.id), fill=off?'var(--orange)':'var(--steel)';
    return `<g class="pin ${sel===s.id?'sel':''}" data-id="${s.id}">
      <circle cx="${s.x}" cy="${s.y}" r="13" fill="${fill}"/>
      <text class="num" x="${s.x}" y="${s.y}">${s.n}</text></g>`;
  }).join('');
  pinsG.querySelectorAll('.pin').forEach(p=>p.onclick=()=>{sel=p.dataset.id;render();});
  // legend
  legendEl.innerHTML=S.slice().sort((a,b)=>a.n-b.n).map(s=>{
    const off=S0.off.includes(s.id);
    return `<div class="li ${off?'off':''} ${sel===s.id?'sel':''}" data-id="${s.id}">
      <div class="badge">${s.n}</div>
      <div class="body"><div class="nm">${s.name} <span class="val">${S0.v[s.id]}</span></div>
        <div class="pp">${s.purpose}</div></div></div>`;
  }).join('');
  legendEl.querySelectorAll('.li').forEach(l=>l.onclick=()=>{sel=l.dataset.id;render();});
  hintEl.innerHTML=S0.hint;
  const selS=S.find(x=>x.id===sel);
  mapcap.innerHTML=selS?`<b style="color:var(--gold)">${selS.n}. ${selS.name}</b> — reads “${S0.v[selS.id]}”`
    :'Orange pins are off-normal in this alarm · tap a pin to read what it watches';
}
render();
</script></body></html>

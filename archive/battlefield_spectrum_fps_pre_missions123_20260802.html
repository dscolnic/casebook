/* ============================ UIManager ============================ */
class UIManager{
  constructor(){ this.feed=document.getElementById('feed'); this.lessonT=null; }
  note(msg,kind=''){ const d=document.createElement('div'); d.className='note '+(kind==='good'?'good':kind==='warn'?'warn':kind==='amber'?'amber':'');
    d.textContent=msg; this.feed.appendChild(d); setTimeout(()=>{ d.style.opacity=0; setTimeout(()=>d.remove(),400); },4200);
    while(this.feed.children.length>6) this.feed.removeChild(this.feed.firstChild); }
  lesson(title,body){ const el=document.getElementById('lesson');
    document.getElementById('lessonTitle').textContent=title.toUpperCase();
    document.getElementById('lessonBody').textContent=body; el.classList.remove('hidden');
    clearTimeout(this.lessonT); this.lessonT=setTimeout(()=>el.classList.add('hidden'),12000); }
  prompt(html){ const p=document.getElementById('prompt'); if(html){ p.innerHTML=html; p.classList.remove('hidden'); } else p.classList.add('hidden'); }
  showSig(dbm,label){ const s=document.getElementById('sig'); s.classList.remove('hidden');
    document.getElementById('sigVal').textContent=dbm.toFixed(0)+' dBm';
    document.getElementById('sigFill').style.width=U.clamp((dbm+110)/80*100,2,100)+'%';
    document.getElementById('sigMeta').textContent=label; }
  hideSig(){ document.getElementById('sig').classList.add('hidden'); }
  setHP(hp){ document.getElementById('hpFill').style.width=hp+'%';
    document.getElementById('damage').style.boxShadow='inset 0 0 200px rgba(255,0,0,'+((100-hp)/180)+')'; }
  setAmmo(a,r){ document.getElementById('ammo').textContent=a+' / '+r; }
  setActiveEq(name){ document.getElementById('activeEq').textContent=name; }
  setMode(m){ document.getElementById('modeLab').textContent=m; }
  setTimer(t){ document.getElementById('timer').textContent=t; }
  setObjective(mission){ document.getElementById('objTitle').textContent='M'+mission.id+' · '+mission.title;
    const ul=document.getElementById('objList'); ul.innerHTML='';
    mission.objectives.forEach(o=>{ const li=document.createElement('li'); li.textContent=o.text; if(o._done)li.classList.add('done'); ul.appendChild(li); });
    (mission.decisions||[]).forEach(d=>{ const li=document.createElement('li'); li.textContent='❓ '+d.title;
      li.style.color=d._answered?'var(--green)':'var(--cyan)'; if(d._answered)li.classList.add('done'); ul.appendChild(li); }); }
  showGuide(on){ document.getElementById('guide').classList.toggle('hidden',!on); }
  setGuideSignal(r){ const el=document.getElementById('guideSignal');
    if(!r){ el.classList.remove('show'); el.innerHTML=''; return; }
    el.classList.add('show'); el.style.borderLeftColor=r.color; el.style.background=r.bg;
    el.innerHTML=`<span class="gtag" style="background:${r.bg};color:${r.color}">${r.tag}</span>${r.text}`; }
  setGuide({step,total,do:doTxt,how,concept,way}){
    document.getElementById('guideStep').textContent=step!=null?`Step ${step}/${total}`:'Objective';
    document.getElementById('guideWay').textContent=way||'';
    document.getElementById('guideDo').textContent=doTxt||'';
    document.getElementById('guideHow').innerHTML=how||'';
    const def=concept?CONCEPT_DEF[concept]:'';
    document.getElementById('guideLearn').innerHTML=concept
      ? `<b style="color:var(--amber)">Learning — ${concept}:</b> ${def||''} <span style="opacity:.7">(press <span class="gkey">K</span> for the codex)</span>`
      : '';
  }
  compass(deg){ const strip=document.getElementById('compassStrip'); const dirs=['N','NE','E','SE','S','SW','W','NW'];
    let html=''; for(let i=-2;i<=10;i++){ const d=((i*45)%360+360)%360; html+=`<span style="display:inline-block;width:42px;text-align:center">${dirs[(Math.round(d/45))%8]}</span>`; }
    strip.innerHTML=html; strip.style.left=(-deg/45*42 - 60)+'px'; }
}

/* ============================ SaveManager ============================ */
const SAVE_KEY='spectrum_front_save_v1';
class SaveManager{
  load(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY))||{}; }catch(e){ return {}; } }
  save(o){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(o)); }catch(e){} }
  reset(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
}

/* ============================ Modal helper ============================ */
function modal(html,{onClose,wide}={}){
  const mount=document.getElementById('modalMount');
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="card" style="${wide?'width:min(1000px,96vw)':''}">${html}</div>`;
  mount.appendChild(ov);
  const close=()=>{ ov.remove(); onClose&&onClose(); };
  ov._close=close; return {ov,close};
}

class Game{
  constructor(){
    this.scene=new THREE.Scene();
    this.scene.background=new THREE.Color(0x1a2530);
    this.camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.1,400);
    this.clock=new THREE.Clock();
    this.flags={}; this.lessonsSeen=new Set(); this.paused=true; this.started=false;
    this.mode='weapon'; this.lastInstrument='analyzer'; this.missionIdx=0; this.missionTime=0;
    this.save=new SaveManager(); this.state=this.save.load();
    this.guided = this.state.guided!==false; // Guided Training is the default
    this.rank={score:100, forceMisuse:0, civHandling:1};
  }
  async init(){
    const container=document.getElementById('app');
    this.rm=new RendererManager(container);
    this.quality=this.state.quality||'medium';
    this.rm.applyQuality(this.quality);
    // lighting
    this._lighting();
    this.scene.fog=new THREE.FogExp2(0x1a2530, this.quality==='low'?0.008:0.0052);
    // factories + world
    this.tf=new TextureFactory(); this.matf=new MaterialFactory(this.tf);
    loadMsg('Building battlefield…');
    this.world=new WorldBuilder(this.scene,this.matf,this.tf,this.quality).build();
    // audio
    this.audio=new AudioManager(); this.audio.setVol(this.state.vol!=null?this.state.vol:0.7);
    // controls
    this.controls=new PointerLockControls(this.camera,document.body);
    if('pointerSpeed' in this.controls) this.controls.pointerSpeed=0.85; // comfortable look speed
    this.camera.rotation.order='YXZ';
    this.scene.add(this.controls.getObject());
    this.player=new PlayerController(this.camera,this.controls,this.world,this.audio);
    // signals
    this.sig=new SignalEngine(this.scene,this.world,this.matf);
    this.prop=new PropagationEngine(this.sig,this.world);
    this.net=new NetworkEngine();
    this.nb=new NotebookManager();
    this.ui=new UIManager();
    // particles + npc + weapon + instruments
    this.pm=new ParticleManager(this.scene,this.quality);
    this.npc=new NPCManager(this.scene,this.world,this.audio,this.pm,this.player);
    this.weapon=new WeaponSystem(this.scene,this.camera,this.world,this.audio,this.pm,this.sig,this.npc);
    this.inst=new InstrumentManager(this.scene,this.camera,this.prop,this.sig,this.net,this.nb,this.audio,this.ui,this.player);
    // NPCs
    this.npc.spawnFriendly(-4,4,'Comms Chief',['That LED rig has been frying our screens.','Anything that emits is a source — go find it.']);
    this.npc.spawnFriendly(6,10,'Medic',['Keep the telemetry link clean, please.']);
    // guided-mode waypoint beacon (amber pillar the player can navigate toward)
    const wp=new THREE.Group();
    const beam=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,12,10),
      new THREE.MeshBasicMaterial({color:0xffb454,transparent:true,opacity:0.22,depthWrite:false}));
    beam.position.y=6; wp.add(beam);
    this.wpRing=new THREE.Mesh(new THREE.TorusGeometry(1.2,0.08,8,24),new THREE.MeshBasicMaterial({color:0xffb454}));
    this.wpRing.rotation.x=-Math.PI/2; this.wpRing.position.y=0.25; wp.add(this.wpRing);
    const wpLight=new THREE.PointLight(0xffb454,0.8,8); wpLight.position.y=2; wp.add(wpLight);
    wp.visible=false; this.scene.add(wp); this.waypoint=wp;
    // post
    this.rm.setupPost(this.scene,this.camera);
    // missions
    this.missions=MISSIONS(this);
    if(this.state.missionIdx!=null) this.missionIdx=U.clamp(this.state.missionIdx,0,this.missions.length-1);
    // input
    this.input=new InputManager(this);
    // pointer lock events
    this.controls.addEventListener('lock',()=>{ this.paused=false; document.getElementById('hud').classList.remove('hidden'); });
    this.controls.addEventListener('unlock',()=>{ if(this.started&&!this._modalOpen()) this.pauseMenu(); });
    window.addEventListener('resize',()=>this.rm.resize(this.camera));
    this._loop=this._loop.bind(this);
    this.startMission(this.missionIdx,true);
    requestAnimationFrame(this._loop);
    document.getElementById('loading').classList.add('hidden');
  }
  _lighting(){
    const hemi=new THREE.HemisphereLight(0x9db6cc,0x3a352c,0.85); this.scene.add(hemi); this.hemi=hemi;
    const amb=new THREE.AmbientLight(0x556070,0.5); this.scene.add(amb); this.amb=amb;
    const sun=new THREE.DirectionalLight(0xffdcb0,2.0); sun.position.set(-40,60,-30); sun.castShadow=true;
    sun.shadow.mapSize.set(this.quality==='high'?2048:this.quality==='medium'?1024:512,this.quality==='high'?2048:1024);
    sun.shadow.camera.near=1; sun.shadow.camera.far=220; const d=110;
    sun.shadow.camera.left=-d; sun.shadow.camera.right=d; sun.shadow.camera.top=d; sun.shadow.camera.bottom=-d;
    sun.shadow.bias=-0.0004; this.scene.add(sun); this.sun=sun;
  }
  _modalOpen(){ return document.getElementById('modalMount').children.length>0; }
  currentMission(){ return this.missions[this.missionIdx]; }
  currentTitle(){ return 'M'+this.currentMission().id+' '+this.currentMission().title; }
  hasConclusion(tag){ return this.nb.conclusions.some(c=>c.tag===tag&&c.correct); }
  bearingSpread(){ const b=this.flags.bearings||[]; if(b.length<2)return 0;
    let min=999,max=-999; for(const x of b){ min=Math.min(min,x.deg); max=Math.max(max,x.deg); } return max-min; }

  /* ---------- mission flow ---------- */
  startMission(i,silent){ this.missionIdx=i; const m=this.currentMission();
    m.objectives.forEach(o=>o._done=false); this.missionTime=0; this.flags.bearings=this.flags.bearings||[];
    if(m.decisions) m.decisions.forEach(d=>{ d._presented=false; d._answered=false; delete this.flags['dec_'+d.id]; });
    this._decisionOpen=false;
    if(m.onStart) try{ m.onStart(); }catch(e){ console.warn(e); }
    this.teleportToMission(i); this.applyMood(i);
    this.ui.setObjective(m);
    this.persist();
    if(!silent){ this.audio.radio(); this.ui.note('New mission: '+m.title,'amber'); }
    this._hintLvl=0;
    if(this.guided && m.guide){ this.ui.note('▶ '+m.guide.do,'amber');
      this.ui.lesson('Mission '+m.id+' · You will learn', m.guide.learn); }
    this.updateGuide();
  }
  // Developer / level select: start any mission cleanly, with the tools you'd
  // have unlocked by then and that mission's progress flags reset.
  jumpToMission(i){
    i=U.clamp(i,0,this.missions.length-1);
    this.flags={ gotCase: i>0 ? true : !!this.flags.gotCase, bearings:[] };
    this.lessonsSeen=new Set();
    if(i>0) this.inst.unlockAll(); else { this.inst.unlock('analyzer'); this.inst.unlock('probe'); }
    this.net.medDown=false; this.net.relayFail=false;
    if(this.npc) this.npc.clearHostiles();
    this.missions.forEach(m=>{ m._complete=false; m.objectives.forEach(o=>o._done=false); });
    this.setMode('weapon');
    this.startMission(i,false);
    this.ui.note('Jumped to Mission '+this.missions[i].id+' · '+this.missions[i].title,'amber');
  }
  openLevelSelect(fromPause){ this.releasePointer();
    const {ov,close}=modal(`<div class="sub">Developer · Level Select</div><h1 style="font-size:26px">Jump to Mission</h1>
      <p style="color:var(--dim);font-size:13px">Starts the chosen mission with the instruments you'd have unlocked by then. That mission's progress is reset so you can test it from a clean state.</p>
      <div class="row">${this.missions.map((m,i)=>`<button class="btn ${i===this.missionIdx?'':'sec'}" data-mi="${i}">M${m.id} · ${m.title}</button>`).join('')}</div>
      <div class="row"><button class="btn sec" id="lsBack">Back</button></div>`,{wide:true});
    ov.querySelectorAll('[data-mi]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.mi; close(); this.jumpToMission(i); this.resumePointer(); });
    ov.querySelector('#lsBack').onclick=()=>{ close(); fromPause?this.pauseMenu():this.resumePointer(); };
  }
  updateGuide(){
    if(!this.guided){ this.ui.showGuide(false); if(this.waypoint) this.waypoint.visible=false; return; }
    const m=this.currentMission(), g=m.guide; this.ui.showGuide(true);
    const pend=this.pendingDecision();
    if(pend){ this.ui.setGuide({do:'❓ Field question ready: '+pend.title,
        how:'Press <span class="gkey">G</span> to answer — decide from what your instruments told you.', concept:pend.concept, way:''});
      if(this.waypoint) this.waypoint.visible=false; this.ui.setGuideSignal(null); return; }
    const idx=m.objectives.findIndex(o=>!o._done);
    if(idx<0){ this.ui.setGuide({do:'All objectives complete — read the after-action report.',how:'',concept:''});
      if(this.waypoint) this.waypoint.visible=false; return; }
    const obj=m.objectives[idx]; const st=(g&&g.steps&&g.steps[idx])||{how:'',concept:''};
    let way='';
    if(st.at){ const tx=st.at[0], tz=st.at[1], p=this.player.pos;
      const dist=Math.hypot(tx-p.x,tz-p.z); const bearing=(Math.atan2(tx-p.x,-(tz-p.z))*180/Math.PI+360)%360;
      const dirs=['N','NE','E','SE','S','SW','W','NW']; way='◈ '+dist.toFixed(0)+' m · '+dirs[Math.round(bearing/45)%8];
      if(this.waypoint){ this.waypoint.visible=dist>3; this.waypoint.position.set(tx,0,tz); }
    } else if(this.waypoint) this.waypoint.visible=false;
    this.ui.setGuide({step:idx+1,total:m.objectives.length,do:obj.text,how:st.how,concept:st.concept,way});
    // live "what this signal means" read-out from the active instrument
    this.ui.setGuideSignal((this.mode==='instrument'&&this.inst.lastRead)?this.inst.lastRead:null);
  }
  teleportToMission(i){ const id=(this.missions[i]&&this.missions[i].id)||(i+1); const s=MISSION_SPAWN[id]||[0,20];
    this.player.pos.set(s[0],1.7,s[1]); this.player.vel.set(0,0,0);
    this.camera.rotation.set(0,0,0); // face north toward the zone
    this.controls.getObject().position.copy(this.player.pos); }
  applyMood(i){ const id=(this.missions[i]&&this.missions[i].id)||(i+1); const m=MISSION_MOOD[id]||MISSION_MOOD[1];
    if(this.scene.fog){ this.scene.fog.color.setHex(m.fog); this.scene.fog.density=m.den; }
    this.scene.background.setHex(m.fog);
    if(this.sun){ this.sun.color.setHex(m.sun[0]); this.sun.intensity=m.sun[1]; }
    if(this.amb){ this.amb.color.setHex(m.amb); this.amb.intensity=m.ambI; }
    (this.moodLights||[]).forEach(l=>this.scene.remove(l)); this.moodLights=[];
    (m.lights||[]).forEach(([x,z,c,ii])=>{ const pl=new THREE.PointLight(c,ii,22); pl.position.set(x,3.5,z);
      this.scene.add(pl); this.moodLights.push(pl); });
    this.moodSmoke=m.smoke||[];
    this.ui.note('◈ Location: '+m.name,'amber');
  }
  // ---- Decision engine: evidence-grounded questions with consequences ----
  pendingDecision(){ const m=this.currentMission(); if(!m.decisions) return null;
    return m.decisions.find(d=>!this.flags['dec_'+d.id] && (!d.after||d.after(this))) || null; }
  answerDecision(){ const d=this.pendingDecision();
    if(d) this.openDecision(this.currentMission(),d);
    else this.ui.note('No field question is ready yet — gather the evidence it asks about first.'); }
  openDecision(m,dec){ if(this._decisionOpen||this._modalOpen()) return;
    this._decisionOpen=true; dec._presented=true; this.releasePointer();
    const opts=dec.options.map((o,i)=>`<button data-i="${i}">${o.t}</button>`).join('');
    const {ov,close}=modal(`<div class="sub">Field Decision · M${m.id}</div>
      <h1 style="font-size:23px">${dec.title}</h1>
      <p style="font-size:15.5px;line-height:1.55">${dec.prompt}</p>
      ${dec.evidence?`<div class="callout">${dec.evidence}</div>`:''}
      <h2>Your call</h2><div class="concl" id="decOpts">${opts}</div>
      <div id="decFx" style="margin-top:14px"></div>`);
    const fx=ov.querySelector('#decFx');
    const finish=()=>{ close(); this._decisionOpen=false; this.resumePointer(); this.checkObjectives(); };
    ov.querySelectorAll('#decOpts [data-i]').forEach(b=>b.onclick=()=>{
      const o=dec.options[+b.dataset.i];
      ov.querySelectorAll('#decOpts button').forEach(x=>x.disabled=true);
      if(o.correct){ this.flags['dec_'+dec.id]=true; dec._answered=true; this.audio.good();
        this.teach('dec_'+dec.id, dec.concept, (CONCEPT_DEF[dec.concept]||''));
        fx.innerHTML=`<div class="callout" style="border-left-color:var(--green)"><b style="color:var(--green)">Correct.</b> ${o.why}</div>
          <div class="row"><button class="btn" id="decNext">Continue</button></div>`;
        ov.querySelector('#decNext').onclick=finish;
      } else { this.penalize('Misread the field question.',6); this.audio.bad();
        fx.innerHTML=`<div class="callout" style="border-left-color:var(--red)"><b style="color:var(--red)">Not the best call.</b> ${o.why} ${dec.teach||''}</div>
          <div class="row"><button class="btn sec" id="decRetry">Reconsider</button>
          <button class="btn sec" id="decLater">Gather more evidence</button></div>`;
        ov.querySelector('#decRetry').onclick=()=>{ ov.querySelectorAll('#decOpts button').forEach(x=>x.disabled=false); fx.innerHTML=''; };
        ov.querySelector('#decLater').onclick=finish;
      }
    });
  }
  checkObjectives(){ const m=this.currentMission(); let changed=false, all=true;
    for(const o of m.objectives){ const d=!!o.f(); if(d&&!o._done){ o._done=true; changed=true; this.audio.good();
        this.ui.note('Objective complete: '+o.text,'good'); } if(!o._done) all=false; }
    if(changed) this.ui.setObjective(m);
    // surface an evidence-grounded question the moment its evidence exists
    const pend=this.pendingDecision();
    if(pend && !pend._presented && !this._decisionOpen && !this._modalOpen()){ this.openDecision(m,pend); return; }
    const decsDone=!(m.decisions||[]).some(d=>!this.flags['dec_'+d.id]);
    if(all && decsDone && !m._complete){ m._complete=true; this.afterAction(m); }
  }
  afterAction(m){ this.releasePointer();
    const correct=this.nb.conclusions.filter(c=>c.tag&&c.correct).length;
    const html=`<div class="sub">After-Action · Mission ${m.id}</div><h1 style="font-size:30px">${m.title}</h1>
      <p>${this._aar(m)}</p>
      <h2>What actually happened</h2><p>${m.conclusions.find(c=>c.correct).text}</p>
      <h2>Skills exercised</h2><p>${m.teach.join(' · ')}</p>
      <div class="row"><button class="btn" id="aarNext">${m.final?'View Final Assessment':'Continue to Next Mission'}</button>
      <button class="btn sec" id="aarReplay">Replay Mission</button></div>`;
    const {ov,close}=modal(html);
    ov.querySelector('#aarNext').onclick=()=>{ close();
      if(m.final){ this.finalAssessment(); }
      else { this.startMission(Math.min(this.missionIdx+1,this.missions.length-1),false); this.resumePointer(); } };
    ov.querySelector('#aarReplay').onclick=()=>{ close(); m._complete=false; this.startMission(this.missionIdx,false); this.resumePointer(); };
    this.audio.complete();
  }
  _aar(m){ switch(m.id){
    case 1:return 'You separated a broadband, unintended emission from clean intentional carriers. The flickering LED controller was leaking harmonic hash across staff equipment — a classic case where the loudest peak is not the whole story.';
    case 2:return 'Repeated short bursts with no stable link is the signature of a device trying to reconnect, not one that is healthy or dying. State inference beats a snapshot.';
    case 3:return 'Three separated bearings intersect at the source; one reflected bearing would have sent the squad to the wrong building. Unknown did not mean hostile — it was a civilian monitor.';
    case 4:return 'The medical link failed only when the logistics link was hot nearby: adjacent-channel overload, not hardware failure and not jamming. A channel change restored service.';
    case 5:return 'Your highest-power, highest-traffic node was advertising the command post. Cutting the relay beacon power preserved the link while shrinking the signature.';
    case 6:return 'Emitting is not receiving. Only the authenticated friendly rover accepted commands; the transmit-only beacon has no receiver at all.';
    case 7:return 'You triaged the crisis: restored medical telemetry, tracked a moving hostile emitter, engaged only armed threats, and reduced your own signature.';
    default:return 'Mission complete.'; } }
  finalAssessment(){ this.releasePointer();
    const s=this.rank; const acc=this.nb.conclusions.filter(c=>c.correct).length;
    let grade= s.forceMisuse>2?'C — Excessive Force': acc>=6?'S — Spectrum Dominance': acc>=4?'A — Mission Effective':'B — Objectives Met';
    modal(`<div class="sub">Campaign Complete</div><h1>SPECTRUM FRONT</h1>
      <h2>Final Assessment</h2>
      <div class="grid2">
        <div class="ctl"><b>Correct conclusions</b><span class="mono">${acc}</span></div>
        <div class="ctl"><b>Measurements logged</b><span class="mono">${this.nb.entries.length}</span></div>
        <div class="ctl"><b>Medical uptime preserved</b><span class="mono">${this.net.medDown?'no':'yes'}</span></div>
        <div class="ctl"><b>Friendly signature reduced</b><span class="mono">${this.flags.sigReduced?'yes':'no'}</span></div>
        <div class="ctl"><b>Civilian devices handled</b><span class="mono">${this.flags.civDestroyed?'mishandled':'correctly'}</span></div>
        <div class="ctl"><b>Unnecessary force</b><span class="mono">${s.forceMisuse}</span></div>
      </div>
      <h2 style="margin-top:18px">Rating: ${grade}</h2>
      <p>Detection, identification, localization, decoding, authentication, and authorized control are distinct steps. You practiced all of them.</p>
      <div class="row"><button class="btn" id="faClose">Return to Field</button></div>`).ov.querySelector('#faClose').onclick=()=>{
        document.getElementById('modalMount').innerHTML=''; this.resumePointer(); };
  }

  /* ---------- event hooks from systems ---------- */
  teach(id,title,body){ if(this.lessonsSeen.has(id))return; this.lessonsSeen.add(id); this.ui.lesson(title,body); }
  onMeasure(e,m){ if(e.id==='E12'||e.id==='E11') e.discovered=true;
    this.teach('first-measure','Reading the analyzer','A peak’s HEIGHT is its power; its WIDTH is its bandwidth. Compare both against the noise floor before you trust it.');
    if(e.intent==='unintended') this.teach('unintended','Unintended emission','No clean carrier, just broadband hash or a harmonic comb — that is electronics leaking energy, not a device transmitting on purpose.');
    if(e.pattern==='burst'||e.pattern==='periodic') this.teach('duty','Duty cycle & timing','This source is not always on. Its ON/OFF timing (bursty or periodic) is a fingerprint of what it is doing.');
    if(e.cls===CLASS.HOSTILE) this.teach('hostile','Hostile emitter','A hostile transmission is a valid target to locate — but detecting it is not the same as being able to control or safely engage it.');
    this.checkObjectives(); }
  onBandScan(band){ this.checkObjectives(); }
  onBearing(pos,deg){ this.flags.bearings.push({pos,deg});
    this.teach('triangulate','Triangulation','One bearing only gives a LINE toward the source. Move to a new spot and take another — three crossing lines pin it down.');
    if((this.flags.bearings||[]).length>=2 && this.bearingSpread()<8)
      this.ui.note('Those bearings are nearly parallel — move farther apart for a real fix.','warn');
    this.checkObjectives(); }
  onProbe(e){ this.teach('probe','Near-field probe','Up close, the probe separates an intended modulated carrier from unintended noise. It is how you tell a transmitter from broken electronics.');
    if(e.kind==='transmit-only') this.teach('txonly2','Transmit-only','This device only sends. With no receiver it can be detected and located, but never commanded.');
    this.checkObjectives(); }
  onTablet(){ this.flags.usedTablet=true;
    if(this.currentMission().id===5){ const n=this.net.mostConspicuous(); this.flags.identConspicuous=true;
      this.ui.note('Most conspicuous node: '+n.name+' (power+centrality)','amber'); }
    this.checkObjectives(); }
  onPlayerHit(){ this.ui.setHP(this.player.hp); if(this.player.hp<=0) this.playerDown(); }
  onWorldShot(hit){ // check if we hit an emitter device / friendly / civilian
    for(const e of this.sig.emitters){ if(e.mesh && hit.object===e.mesh){
      if(e.cls===CLASS.CIVILIAN||e.cls===CLASS.FRIENDLY||e.trueCls===CLASS.CIVILIAN){ this.penalize('Destroyed a civilian/friendly device.',20); this.flags.civDestroyed=true; }
      else this.ui.note('Hostile emitter hardware damaged.','amber'); return; } } }
  penalize(msg,amt){ this.rank.forceMisuse++; this.rank.score-=amt; this.ui.note('⚠ '+msg+' (-'+amt+')','warn'); this.audio.bad(); }
  playerDown(){ this.releasePointer(); this.player.hp=100; this.ui.setHP(100);
    modal(`<div class="sub">Casualty</div><h1 style="font-size:30px">You were hit hard</h1>
      <p>You have been stabilized at the aid station. Resume the mission.</p>
      <div class="row"><button class="btn" id="rz">Resume</button></div>`).ov.querySelector('#rz').onclick=(ev)=>{
        ev.target.closest('.overlay').remove(); this.player.pos.set(0,1.7,20); this.resumePointer(); }; }

  /* ---------- repair / command interactions ---------- */
  fieldRepair(){ const m=this.currentMission();
    if(m.id===4){ if(!this.flags.aidFixed){ this.flags.aidFixed=true; this.net.medDown=false;
        this.ui.note('Retuned medical telemetry to a clear channel.','good'); this.audio.good();
        setTimeout(()=>{ this.flags.aidVerified=true; this.flags.comparedAid=true; this.ui.note('Medical link verified: service restored.','good'); this.checkObjectives(); },1200);
      } this.checkObjectives(); return true; }
    if(m.id===5||m.id===7){ if(!this.flags.sigReduced){ this.flags.sigReduced=true; this.net.nodes.find(n=>n.id==='RLY-3').power=8;
        this.sig.byId('E4').power=8; this.ui.note('Relay beacon power reduced — signature down, link preserved.','good'); this.audio.good(); }
      this.checkObjectives(); return true; }
    if(m.id===6){ const near=this.inst._nearProbe();
      if(near && near.e.id==='E16'){ this.flags.roverCommanded=true; this.ui.note('Authorized rover acknowledged command. ✔','good'); this.audio.good(); }
      else if(near && near.e.id==='E15'){ this.ui.note('Transmit-only beacon: no response. It has no receiver.','warn'); this.audio.bad(); }
      else this.ui.note('No commandable authorized device in range.','warn');
      this.checkObjectives(); return true; }
    return false;
  }
  startFinal(){ // spawn hostiles + dynamic events
    this.sig.byId('E11').active=true; this.net.relayFail=false;
    this.npc.spawnHostile(50,44); this.npc.spawnHostile(60,50); this.npc.spawnHostile(54,40);
    this.npc.spawnHostile(56,52,true); this.net.medDown=true; this.flags.aidVerified=false;
    this.ui.note('CRISIS: assault + comms failure. Triage now.','warn'); this.audio.alarm();
  }

  /* ---------- pointer / pause ---------- */
  releasePointer(){ if(this.controls.isLocked) this.controls.unlock(); }
  resumePointer(){ document.getElementById('modalMount').innerHTML=''; try{ this.controls.lock(); }catch(e){} }
  pauseMenu(){ if(this._modalOpen())return; this.paused=true;
    const {ov,close}=modal(`<div class="sub">Paused</div><h1 style="font-size:34px">Field Pause</h1>
      <div class="row">
      <button class="btn" id="pResume">Resume</button>
      <button class="btn sec" id="pMap">Tactical Map (M)</button>
      <button class="btn sec" id="pNb">Notebook (Tab)</button>
      <button class="btn sec" id="pCodex">Concept Codex (K)</button>
      <button class="btn sec" id="pLevel">Level Select</button>
      <button class="btn sec" id="pGuide">Guidance: ${this.guided?'ON':'OFF'}</button>
      <button class="btn sec" id="pGfx">Graphics</button>
      <button class="btn sec" id="pAud">Audio</button>
      <button class="btn sec" id="pRestart">Restart Mission</button>
      <button class="btn sec" id="pReset">Reset Campaign</button></div>`);
    ov.querySelector('#pResume').onclick=()=>{ close(); this.resumePointer(); };
    ov.querySelector('#pMap').onclick=()=>{ close(); this.openMap(); };
    ov.querySelector('#pNb').onclick=()=>{ close(); this.openNotebook(); };
    ov.querySelector('#pCodex').onclick=()=>{ close(); this.openCodex(); };
    ov.querySelector('#pLevel').onclick=()=>{ close(); this.openLevelSelect(true); };
    ov.querySelector('#pGuide').onclick=()=>{ this.guided=!this.guided; this.state.guided=this.guided; this.save.save(this.state);
      this.ui.showGuide(this.guided); this.updateGuide(); close(); this.pauseMenu(); };
    ov.querySelector('#pGfx').onclick=()=>{ close(); this.gfxMenu(); };
    ov.querySelector('#pAud').onclick=()=>{ close(); this.audMenu(); };
    ov.querySelector('#pRestart').onclick=()=>{ close(); this.currentMission()._complete=false; this.startMission(this.missionIdx,false); this.resumePointer(); };
    ov.querySelector('#pReset').onclick=()=>{ close(); this.save.reset(); location.reload(); };
  }
  gfxMenu(){ const opts=['low','medium','high'];
    const {ov,close}=modal(`<div class="sub">Graphics</div><h1 style="font-size:28px">Quality</h1>
      <p>Current: <b class="mono" style="color:var(--cyan)">${this.quality}</b>. Change requires a quick reload for full effect on some settings.</p>
      <div class="row">${opts.map(o=>`<button class="btn ${o===this.quality?'':'sec'}" data-q="${o}">${o}</button>`).join('')}</div>
      <div class="row"><button class="btn sec" id="gBack">Back</button></div>`);
    ov.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ this.quality=b.dataset.q; this.rm.applyQuality(this.quality);
      this.persist(); this.ui.note('Quality: '+this.quality); close(); this.pauseMenu(); });
    ov.querySelector('#gBack').onclick=()=>{ close(); this.pauseMenu(); };
  }
  audMenu(){ const v=Math.round((this.state.vol!=null?this.state.vol:0.7)*100);
    const {ov,close}=modal(`<div class="sub">Audio</div><h1 style="font-size:28px">Volume</h1>
      <p>Master volume: <b class="mono" id="vlab">${v}%</b></p>
      <input type="range" id="vol" min="0" max="100" value="${v}" style="width:100%">
      <div class="row"><button class="btn sec" id="aBack">Back</button></div>`);
    const vol=ov.querySelector('#vol'); vol.oninput=()=>{ const val=vol.value/100; this.audio.setVol(val); this.state.vol=val;
      ov.querySelector('#vlab').textContent=vol.value+'%'; this.persist(); };
    ov.querySelector('#aBack').onclick=()=>{ close(); this.pauseMenu(); };
  }

  /* ---------- notebook + conclusions ---------- */
  openNotebook(){ this.releasePointer(); const m=this.currentMission();
    const rows=this.nb.entries.slice(-14).map(e=>`<tr><td class="mono">${e.time}</td><td>${e.instrument}</td><td class="mono">${e.freq}</td>
      <td class="mono">${e.power}</td><td class="mono">${e.bw}</td><td class="mono">${e.bearing}</td><td>${e.observation}</td><td>${e.confidence}</td></tr>`).join('');
    const concl=(m.conclusions||[]).map(c=>`<button data-c="${c.id}">${c.text}</button>`).join('');
    const {ov,close}=modal(`<div class="sub">Field Notebook · ${m.title}</div><h1 style="font-size:26px">Evidence Log</h1>
      <div style="max-height:34vh;overflow:auto"><table class="nbTable"><tr><th>Time</th><th>Instrument</th><th>Freq</th><th>Power</th><th>BW</th><th>Bearing</th><th>Observation</th><th>Conf.</th></tr>${rows||'<tr><td colspan=8 style="color:var(--dim)">No measurements yet. Use an instrument and press R to save.</td></tr>'}</table></div>
      <h2>Submit a conclusion</h2><p style="color:var(--dim);font-size:12px">Only conclusions supported by your collected evidence count as well justified.</p>
      <div class="concl">${concl}</div>
      <div class="row"><button class="btn sec" id="nbClose">Close</button></div>`,{wide:true});
    ov.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ const c=m.conclusions.find(x=>x.id===b.dataset.c);
      this._submitConclusion(m,c); close(); this.resumePointer(); });
    ov.querySelector('#nbClose').onclick=()=>{ close(); this.resumePointer(); };
  }
  _submitConclusion(m,c){
    // require some supporting evidence
    if(this.nb.entries.length<2){ this.ui.note('Not enough evidence yet — take more measurements first.','warn'); this.audio.bad();
      this.ui.lesson('Why you can’t conclude yet','A conclusion has to rest on logged measurements. Use an instrument and press R to record evidence, then decide.'); return; }
    const right=m.conclusions.find(x=>x.correct);
    if(c.correct){ if(!this.nb.conclusions.some(x=>x.tag===c.tag&&x.correct)) this.nb.addConclusion(c);
      this.ui.note('Well-justified conclusion accepted.','good'); this.audio.good();
      this.ui.lesson('Why this holds', (m.guide?m.guide.learn:'')+' Your notebook’s measurements back this reading.');
    } else { this.penalize('Unsupported conclusion.',8);
      this.ui.note('The evidence does not support that — reconsider.','warn');
      this.ui.lesson('Not supported by the evidence', 'Better reading: “'+right.text+'” '+(m.guide?m.guide.learn:'')); }
    this.checkObjectives();
  }
  openCodex(){ this.releasePointer();
    const body=CODEX.map(sec=>`<h2>${sec.group}</h2>`+
      sec.items.map(([t,d])=>`<div class="ctl" style="display:block;padding:7px 0"><b style="color:#eaf1f3">${t}</b><div style="color:#c3d0d5;font-size:13px;margin-top:2px;line-height:1.45">${d}</div></div>`).join('')
    ).join('');
    const {ov,close}=modal(`<div class="sub">Field Reference</div><h1 style="font-size:28px">Spectrum Codex</h1>
      <p style="color:var(--dim);font-size:13px">The concepts this training is built on. Everything here is something you actually use to complete missions — the learning is the mechanic.</p>
      ${body}
      <div class="row"><button class="btn" id="cxClose">Close</button></div>`,{wide:true});
    ov.querySelector('#cxClose').onclick=()=>{ close(); this.resumePointer(); };
  }
  openMap(){ this.releasePointer();
    const {ov,close}=modal(`<div class="sub">Tactical Map</div><h1 style="font-size:26px">${this.currentMission().loc}</h1>
      <canvas id="mapC" width="900" height="620"></canvas>
      <p style="color:var(--dim);font-size:12px">Player ▲ · friendly ● · your bearings ─ · measured sources ◆ · unknown emitters are NOT auto-revealed.</p>
      <div class="row"><button class="btn sec" id="mClose">Close</button></div>`,{wide:true});
    this._drawMap(ov.querySelector('#mapC'));
    ov.querySelector('#mClose').onclick=()=>{ close(); this.resumePointer(); };
  }
  _drawMap(c){ const x=c.getContext('2d'),W=c.width,H=c.height; const S=(W)/184; const tx=v=>W/2+v*S, tz=v=>H/2+v*S;
    x.fillStyle='#070d0f'; x.fillRect(0,0,W,H);
    x.strokeStyle='rgba(90,140,150,.15)'; for(let i=-80;i<=80;i+=20){ x.beginPath();x.moveTo(tx(i),0);x.lineTo(tx(i),H);x.stroke();
      x.beginPath();x.moveTo(0,tz(i));x.lineTo(W,tz(i));x.stroke(); }
    // zones
    x.font='12px monospace';
    for(const z of this.world.zones){ x.strokeStyle='rgba(255,180,84,.35)'; x.beginPath(); x.arc(tx(z.x),tz(z.z),z.r*S,0,7); x.stroke();
      x.fillStyle='rgba(255,180,84,.8)'; x.fillText(z.name,tx(z.x)-z.name.length*3.4,tz(z.z)); }
    // friendly nodes
    x.fillStyle='#57e389'; for(const n of [[-4,4],[6,10],[0,10]]){ x.beginPath(); x.arc(tx(n[0]),tz(n[1]),5,0,7); x.fill(); }
    // measured sources (only discovered)
    for(const e of this.sig.emitters){ if(e.discovered){ x.fillStyle= e.cls===CLASS.HOSTILE?'#ff5c5c':e.cls===CLASS.CIVILIAN?'#4fd6ff':'#ffb454';
      x.beginPath(); x.moveTo(tx(e.pos.x),tz(e.pos.z)-6); x.lineTo(tx(e.pos.x)+6,tz(e.pos.z)+5); x.lineTo(tx(e.pos.x)-6,tz(e.pos.z)+5); x.closePath(); x.fill(); } }
    // bearings
    x.strokeStyle='rgba(255,180,84,.6)'; for(const b of (this.flags.bearings||[])){ const a=b.deg*Math.PI/180;
      x.beginPath(); x.moveTo(tx(b.pos.x),tz(b.pos.z)); x.lineTo(tx(b.pos.x)+Math.sin(a)*300,tz(b.pos.z)-Math.cos(a)*300); x.stroke(); }
    // player
    const p=this.player.pos; x.save(); x.translate(tx(p.x),tz(p.z)); x.rotate(this.player.headingDeg()*Math.PI/180);
    x.fillStyle='#fff'; x.beginPath(); x.moveTo(0,-9); x.lineTo(6,7); x.lineTo(-6,7); x.closePath(); x.fill(); x.restore();
  }

  /* ---------- equipment wheel ---------- */
  toggleWheel(show){ const w=document.getElementById('wheel'); if(!show){ w.style.display='none'; return; }
    const ring=document.getElementById('wheelRing');
    const slots=[{key:'weapon',name:'Defensive Weapon',icon:'🔫',unl:true},
      ...INSTRUMENTS.map(i=>({key:i.key,name:i.name,icon:i.icon,unl:this.inst.isUnlocked(i.key)}))];
    ring.innerHTML=slots.map((s,i)=>`<div class="slot ${!s.unl?'lock':''} ${(this.mode==='weapon'&&s.key==='weapon')||(this.mode==='instrument'&&this.inst.active===s.key)?'on':''}" data-k="${s.key}">
      <div class="ic">${s.icon}</div><div class="n">${s.name}</div><div class="k">${s.unl?('['+(i+1)+']'):'LOCKED'}</div></div>`).join('');
    ring.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>{ this.selectEquip(el.dataset.k); this.toggleWheel(false); });
    w.style.display='flex';
  }
  selectEquip(key){ if(key==='weapon'){ this.setMode('weapon'); return; }
    if(!this.inst.isUnlocked(key)){ this.ui.note('Not yet collected.','warn'); return; }
    this.setMode('instrument',key); }
  setMode(mode,instKey){ this.mode=mode;
    if(mode==='weapon'){ this.weapon.setVisible(true); this.inst.setActive(null); this.ui.setActiveEq('Defensive Weapon');
      this.ui.setMode('WEAPON'); document.getElementById('ammo').parentElement.style.opacity=1; }
    else { this.weapon.setVisible(false); const k=instKey||this.lastInstrument; this.inst.setActive(k); this.lastInstrument=k;
      this.ui.setActiveEq(INSTRUMENTS.find(i=>i.key===k).name); this.ui.setMode('INSTRUMENT'); }
    this.audio.ui();
  }
  toggleWeaponInstrument(){ if(this.mode==='weapon') this.setMode('instrument',this.lastInstrument); else this.setMode('weapon'); }

  persist(){ this.state.missionIdx=this.missionIdx; this.state.quality=this.quality; this.save.save(this.state); }

  /* ---------- interaction ---------- */
  nearInteractable(){ const p=this.player.pos; let best=null,bd=99;
    for(const it of this.world.interactables){ const d=p.distanceTo(it.pos); if(d<(it.radius||3)&&d<bd){ bd=d; best=it; } }
    return best; }
  interact(){ const it=this.nearInteractable();
    if(it && it.type==='equipment'){ if(!this.flags.gotCase){ this.flags.gotCase=true; this.inst.unlock('analyzer'); this.inst.unlock('probe');
        this.audio.pickup(); this.ui.note('Equipment collected: Spectrum Analyzer + Near-Field Probe','good');
        this.ui.lesson('Field Kit','Open the equipment wheel with Q, or press 2–5 to select an instrument. Press R to save a measurement to your notebook.');
        this.checkObjectives(); } else this.ui.note('Equipment case already emptied.');
      return; }
    // command / repair opportunities
    if(this.fieldRepair()) return;
    if(it) this.ui.note(it.label);
  }

  /* ---------- hints ---------- */
  hint(){ const m=this.currentMission(); this._hintLvl=(this._hintLvl||0); const h=m.hints[Math.min(this._hintLvl,m.hints.length-1)];
    this.ui.lesson('Hint '+(this._hintLvl+1)+'/3', h); this._hintLvl=(this._hintLvl+1)%3; this.audio.ui(); }

  /* ---------- main loop ---------- */
  _loop(){ requestAnimationFrame(this._loop);
    let dt=this.clock.getDelta(); dt=Math.min(dt,0.05);
    try{
      const t=this.clock.elapsedTime;
      if(!this.paused){
        this.missionTime+=dt;
        this.player.update(dt);
        this.sig.update(dt);
        this.npc.update(dt,this);
        this.weapon.update(dt, this.player.vel.lengthSq()>1, this.player.sprint);
        this.inst.update(dt,this);
        this.pm.update(dt);
        this.world.updateLights(t);
        // HUD
        this.ui.setHP(this.player.hp); this.ui.setAmmo(this.weapon.ammo,this.weapon.reserve);
        this.ui.setTimer(U.fmtT(this.missionTime)); this.ui.compass(this.player.headingDeg());
        // interaction prompt
        const it=this.nearInteractable(); const m=this.currentMission();
        let promptHtml=null;
        if(it&&it.type==='equipment'&&!this.flags.gotCase) promptHtml='<b>E</b> Collect field equipment';
        else if((m.id===4&&!this.flags.aidFixed)) { if(this.player.pos.distanceTo(V3(-30,1.2,20))<10) promptHtml='<b>E</b> Apply authorized channel fix'; }
        else if((m.id===5||m.id===7)&&!this.flags.sigReduced&&this.player.pos.distanceTo(this.world.relayTop||V3(0,22,-72))<24) promptHtml='<b>E</b> Reduce relay beacon power';
        else if(m.id===6){ const near=this.inst._nearProbe(); if(near) promptHtml='<b>E</b> Attempt to command '+near.e.name; }
        else if(it) promptHtml='<b>E</b> '+it.label;
        this.ui.prompt(promptHtml);
        this.checkObjectives();
        this.updateGuide();
        if(this.waypoint&&this.waypoint.visible){ this.wpRing.rotation.z=t*1.5;
          this.wpRing.scale.setScalar(1+Math.sin(t*3)*0.12); }
        if(this.moodSmoke) for(const s of this.moodSmoke){ if(Math.random()<0.06) this.pm.smoke(s[0]+U.rand(-1,1),1.2,s[1]+U.rand(-1,1)); }
      }
      this.rm.render(this.scene,this.camera,t);
    }catch(e){ console.error('loop error',e); if(!this._loggedErr){ this._loggedErr=true; this.ui&&this.ui.note('Runtime warning (see console) — gameplay continues.','warn'); } }
  }
}

/* ============================ InputManager ============================ */
class InputManager{
  constructor(game){ this.g=game; this._wheelOpen=false; this._bind(); }
  _bind(){ const g=this.g;
    document.addEventListener('keydown',e=>{
      if(!g.started) return;
      g.player.key(e.code,true);
      if(g._modalOpen()){ if(e.code==='Escape'){} return; }
      switch(e.code){
        case 'Space': e.preventDefault(); g.player.jump(); break;
        case 'ControlLeft': case 'KeyC': g.player.crouch=true; break;
        case 'KeyE': g.interact(); break;
        case 'KeyF': g.toggleWeaponInstrument(); break;
        case 'KeyR':
          if(g.mode==='weapon'){
            if(g.weapon.ammo>=g.weapon.mag) g.ui.note('Magazine already full. (Switch to an instrument with 2–5, then R saves a reading.)');
            else if(g.weapon.reserve<=0) g.ui.note('No reserve ammunition.','warn');
            else g.weapon.reload();
          } else g.inst.saveMeasurement(g);
          break;
        case 'KeyQ': this._wheelOpen=!this._wheelOpen; g.toggleWheel(this._wheelOpen); g.paused=this._wheelOpen; if(this._wheelOpen)g.releasePointer(); else g.resumePointer(); break;
        case 'KeyM': g.openMap(); break;
        case 'Tab': e.preventDefault(); g.openNotebook(); break;
        case 'KeyH': g.hint(); break;
        case 'KeyG': g.answerDecision(); break;
        case 'KeyK': g.openCodex(); break;
        case 'KeyN': if(g.mode==='instrument'&&g.inst.active==='analyzer') g.inst.cyclePreset(e.shiftKey?-1:1); break;
        case 'Digit1': g.selectEquip('weapon'); break;
        case 'Digit2': g.selectEquip('analyzer'); break;
        case 'Digit3': g.selectEquip('df'); break;
        case 'Digit4': g.selectEquip('probe'); break;
        case 'Digit5': g.selectEquip('tablet'); break;
        case 'BracketLeft': g.inst.adjGain(-2); break;
        case 'BracketRight': g.inst.adjGain(2); break;
        case 'ArrowLeft': if(g.mode==='instrument') g.inst.tune(g.inst.active==='analyzer'?-(g.inst.span*0.03):-1); break;
        case 'ArrowRight': if(g.mode==='instrument') g.inst.tune(g.inst.active==='analyzer'?(g.inst.span*0.03):1); break;
        case 'ArrowUp': if(g.mode==='instrument') g.inst.changeSpan(0.8); break;
        case 'ArrowDown': if(g.mode==='instrument') g.inst.changeSpan(1.25); break;
        case 'Escape': break;
      }
    });
    document.addEventListener('keyup',e=>{ if(!g.started)return; g.player.key(e.code,false);
      if(e.code==='ControlLeft'||e.code==='KeyC') g.player.crouch=false; });
    document.addEventListener('mousedown',e=>{ if(!g.started||g.paused||g._modalOpen())return;
      if(e.button===0){ if(g.mode==='weapon') g.weapon.fire(g); else g.inst.saveMeasurement(g); }
      if(e.button===2){ if(g.mode==='weapon') g.weapon.ads=true; } });
    document.addEventListener('mouseup',e=>{ if(e.button===2) g.weapon.ads=false; });
    document.addEventListener('contextmenu',e=>{ if(g.started) e.preventDefault(); });
    window.addEventListener('wheel',e=>{ if(g.started&&!g.paused) e.preventDefault(); },{passive:false});
    // canvas click to lock
    g.rm.renderer.domElement.addEventListener('click',()=>{ if(g.started&&!g.paused&&!g.controls.isLocked&&!g._modalOpen()) g.controls.lock(); });
  }
}

/* ============================ Bootstrap ============================ */
const game=new Game();
loadMsg('Initializing systems…');
await game.init();

function briefing(){
  const m=game.currentMission();
  const controls=[
    ['Move','W A S D'],['Look','Mouse'],['Jump','Space'],['Sprint','Shift'],['Crouch','Ctrl / C'],
    ['Fire / Use instrument','Left Click'],['ADS / Precision','Right Click'],['Interact','E'],
    ['Weapon ↔ instrument','F'],['Equipment wheel','Q'],['Reload / Save reading','R'],
    ['Field notebook','Tab'],['Tactical map','M'],['Cycle analyzer band','N'],
    ['Tune / Span','◄ ► / ▲ ▼'],['Gain','[ ]'],['Hint (3 levels)','H'],
    ['Answer field question','G'],['Concept codex','K'],['Pause','Esc'],
  ];
  const {ov,close}=modal(`
    <div class="sub">Spectrum Operations · Field Training</div>
    <h1>SPECTRUM FRONT</h1>
    <div class="sub" style="margin:8px 0 0">Anything That Emits Is a Source</div>
    <p style="margin-top:16px">You are a spectrum operations specialist attached to a small tactical unit moving through a damaged urban district.
    Detect emissions, measure frequency and bandwidth, take bearings, classify sources, and act on evidence — not assumptions.
    Detection, identification, localization, decoding, authentication, and authorized control are all different things.</p>
    <div class="row" style="margin:6px 0 0">
      <span class="tag">Current: M${m.id} · ${m.title}</span>
      <span class="tag">${m.loc}</span>
      <span class="tag">${game.missions.length} missions</span>
    </div>
    <h2>Training Mode</h2>
    <div class="row" id="modeRow" style="margin-top:2px">
      <button class="btn ${game.guided?'':'sec'}" data-mode="guided">🎓 Guided Training</button>
      <button class="btn ${game.guided?'sec':''}" data-mode="field">🎖 Field Operations</button>
    </div>
    <p id="modeDesc" style="color:var(--dim);font-size:12.5px;margin-top:8px">${game.guided
      ? '<b style="color:var(--amber)">Recommended.</b> A guidance bar tells you the exact next action and the concept behind it, an amber waypoint beacon shows where to go, and a lesson pops for each new idea. Press H anytime for deeper hints.'
      : 'Minimal HUD — objectives only. No step-by-step guidance, no waypoint. For a second playthrough.'}</p>
    <h2>Mission Brief</h2><p>${m.brief}</p>
    <div class="grid2" style="margin-top:6px">
      <div><div class="lab">▶ What you’ll do</div><p style="margin:4px 0 0;font-size:13px">${m.guide?m.guide.do:m.brief}</p></div>
      <div><div class="lab">🎓 What you’ll learn</div><p style="margin:4px 0 0;font-size:13px">${m.guide?m.guide.learn:m.teach.join(', ')}</p></div>
    </div>
    <h2>Jump to Mission <span style="color:var(--dim);font-size:11px;font-weight:400;letter-spacing:0;text-transform:none">developer · level select — launches that mission directly</span></h2>
    <div class="row" id="missionRow" style="margin-top:2px">
      ${game.missions.map((mm,i)=>`<button class="btn sec" data-mi="${i}" style="padding:8px 13px" title="${mm.title}">M${mm.id}</button>`).join('')}
    </div>
    <h2>Controls</h2>
    <div class="grid2">${controls.map(c=>`<div class="ctl"><b>${c[0]}</b><span class="mono">${c[1]}</span></div>`).join('')}</div>
    <p style="color:var(--dim);font-size:12px;margin-top:14px">Tip: start at the glowing <b style="color:var(--amber)">Field Equipment Case</b> just ahead of you. Press <b>E</b> to collect your kit.</p>
    <div class="row">
      <button class="btn" id="startBtn">▶ Start Mission</button>
      <button class="btn sec" id="contBtn">Continue from M${m.id}</button>
      <button class="btn sec" id="resetBtn">Reset Saved Progress</button>
    </div>`);
  ov.querySelectorAll('#modeRow [data-mode]').forEach(b=>b.onclick=()=>{
    game.guided = b.dataset.mode==='guided'; game.state.guided=game.guided; game.save.save(game.state);
    ov.querySelectorAll('#modeRow [data-mode]').forEach(x=>x.classList.toggle('sec', x.dataset.mode!==b.dataset.mode));
    ov.querySelector('#modeDesc').innerHTML = game.guided
      ? '<b style="color:var(--amber)">Recommended.</b> A guidance bar tells you the exact next action and the concept behind it, an amber waypoint beacon shows where to go, and a lesson pops for each new idea. Press H anytime for deeper hints.'
      : 'Minimal HUD — objectives only. No step-by-step guidance, no waypoint. For a second playthrough.';
  });
  ov.querySelectorAll('#missionRow [data-mi]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.mi; game.jumpToMission(i); launch(close); });
  ov.querySelector('#startBtn').onclick=()=>launch(close);
  ov.querySelector('#contBtn').onclick=()=>launch(close);
  ov.querySelector('#resetBtn').onclick=()=>{ game.save.reset(); location.reload(); };
}
function launch(close){
  close();
  game.started=true; game.paused=false;
  game.audio.start();
  document.getElementById('hud').classList.remove('hidden');
  game.setMode('weapon');
  game.ui.setObjective(game.currentMission());
  game.ui.showGuide(game.guided);
  const gm=game.currentMission();
  if(game.guided && gm.guide){ game.ui.lesson('Mission '+gm.id+' · You will learn', gm.guide.learn); }
  game.updateGuide();
  game.ui.note('Radio: "Operator on the net. Collect your kit at the case."','amber');
  // Extra coaching for a first-time player on Mission 1
  if(game.guided && game.missionIdx===0){
    [[1500,'Move with W A S D · look with the mouse · hold Shift to sprint.'],
     [5500,'Follow the amber beacon → the glowing equipment case. Press E to collect your kit.'],
     [10500,'Once you have it: press 2 for the analyzer, then N to sweep bands. The bar up top always names your next step.'],
     [16000,'Watch the blue "signal read" line — it tells you what each source you point at actually is.']
    ].forEach(([t,msg])=>setTimeout(()=>{ if(game.started&&game.guided) game.ui.note(msg,'amber'); },t));
  }
  try{ game.controls.lock(); }catch(e){}
  // if pointer lock didn't engage (needs a user gesture inside canvas), prompt
  setTimeout(()=>{ if(!game.controls.isLocked){ game.ui.note('Click the screen to capture the mouse and look around.','amber'); } },300);
}
briefing();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>SPECTRUM FRONT — Anything That Emits Is a Source</title>
<style>
  :root{
    --amber:#ffb454; --green:#57e389; --red:#ff5c5c; --cyan:#4fd6ff; --blue:#5a8bff;
    --ink:#0a0c0e; --panel:rgba(10,14,16,.82); --line:rgba(120,150,160,.28);
    --txt:#d7e2e6; --dim:#8fa2a8;
  }
  *{box-sizing:border-box; -webkit-user-select:none; user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;background:#05070a;color:var(--txt);
    font-family:"Segoe UI",-apple-system,Roboto,Helvetica,Arial,sans-serif;}
  canvas{display:block;}
  #app{position:fixed;inset:0;}
  .mono{font-family:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;}
  .hidden{display:none !important;}
  .fade{transition:opacity .35s ease;}

  /* ---- Overlays ---- */
  .overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 120% at 50% 30%,rgba(20,26,30,.75),rgba(3,5,8,.96));
    backdrop-filter:blur(3px);}
  .card{width:min(880px,94vw);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#0d1215,#0a0e11);
    border:1px solid var(--line);border-radius:14px;padding:26px 30px;box-shadow:0 30px 90px rgba(0,0,0,.6);}
  h1{font-size:44px;letter-spacing:.16em;margin:0;font-weight:800;
    background:linear-gradient(90deg,#ffd79a,#ffb454);-webkit-background-clip:text;background-clip:text;color:transparent;}
  h2{letter-spacing:.14em;color:var(--amber);font-size:15px;text-transform:uppercase;margin:22px 0 8px;font-weight:700;}
  .sub{color:var(--dim);letter-spacing:.24em;text-transform:uppercase;font-size:13px;margin:6px 0 0;}
  p{line-height:1.5;color:#c3d0d5;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px;}
  .ctl{display:flex;justify-content:space-between;gap:14px;padding:5px 0;border-bottom:1px dashed rgba(120,150,160,.14);font-size:14px;}
  .ctl b{color:#eaf1f3;font-weight:600;}
  .ctl .mono{color:var(--cyan);}
  .btn{cursor:pointer;border:1px solid var(--amber);background:linear-gradient(180deg,rgba(255,180,84,.16),rgba(255,180,84,.04));
    color:var(--amber);padding:12px 22px;border-radius:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;font-size:14px;
    transition:.15s;}
  .btn:hover{background:rgba(255,180,84,.24);box-shadow:0 0 22px rgba(255,180,84,.25);}
  .btn.sec{border-color:var(--line);color:var(--txt);}
  .btn.sec:hover{background:rgba(120,150,160,.12);box-shadow:none;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px;}
  .tag{display:inline-block;font-size:11px;letter-spacing:.14em;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--dim);text-transform:uppercase;}

  /* ---- HUD ---- */
  #hud{position:fixed;inset:0;z-index:20;pointer-events:none;font-size:13px;}
  #crosshair{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);opacity:.8;}
  #crosshair::before,#crosshair::after{content:"";position:absolute;background:rgba(230,240,240,.7);}
  #crosshair::before{left:50%;top:0;width:1.5px;height:100%;transform:translateX(-50%);}
  #crosshair::after{top:50%;left:0;height:1.5px;width:100%;transform:translateY(-50%);}
  #hud .corner{position:absolute;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    backdrop-filter:blur(4px);line-height:1.4;}
  #hudBL{left:16px;bottom:16px;min-width:190px;}
  #hudBR{right:16px;bottom:16px;text-align:right;min-width:150px;}
  #hudTL{left:16px;top:16px;max-width:340px;}
  #hudTR{right:16px;top:16px;text-align:right;min-width:120px;}
  .lab{color:var(--dim);letter-spacing:.12em;text-transform:uppercase;font-size:10px;}
  .big{font-size:26px;font-weight:800;letter-spacing:.02em;}
  .bar{height:7px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px;}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));width:100%;transition:width .18s;}
  #hpFill{background:linear-gradient(90deg,#ff6a6a,#ffb454);}
  #objTitle{color:var(--amber);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;}
  #objList{margin:6px 0 0;padding:0;list-style:none;}
  #objList li{padding:2px 0 2px 18px;position:relative;color:#c9d5da;font-size:12px;}
  #objList li::before{content:"○";position:absolute;left:0;color:var(--dim);}
  #objList li.done{color:var(--green);text-decoration:line-through;opacity:.7;}
  #objList li.done::before{content:"●";color:var(--green);text-decoration:none;}
  /* guided training bar */
  #guide{position:fixed;top:48px;left:50%;transform:translateX(-50%);z-index:21;width:min(760px,94vw);
    background:linear-gradient(180deg,rgba(12,20,22,.94),rgba(8,14,16,.96));border:1px solid rgba(255,180,84,.4);
    border-radius:12px;padding:10px 16px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
  #guide .gtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px;}
  #guide .gstep{color:var(--amber);letter-spacing:.14em;text-transform:uppercase;font-size:11px;font-weight:700;}
  #guide .gway{color:var(--cyan);font-size:11px;letter-spacing:.06em;}
  #guide .gdo{color:#eaf1f3;font-size:14px;line-height:1.4;}
  #guide .ghow{color:#bfe6d8;font-size:12.5px;margin-top:3px;}
  #guide .gsig{font-size:12.5px;margin-top:6px;padding:6px 9px;border-radius:7px;background:rgba(79,214,255,.08);
    border-left:3px solid var(--cyan);color:#d6f2fb;line-height:1.4;display:none;}
  #guide .gsig.show{display:block;}
  #guide .gsig .gtag{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
    padding:1px 7px;border-radius:20px;margin-right:6px;vertical-align:middle;}
  #guide .glearn{color:var(--dim);font-size:11.5px;margin-top:6px;border-top:1px dashed rgba(120,150,160,.18);padding-top:5px;}
  #guide .glearn b{color:var(--amber);}
  #guide .gkey{display:inline-block;font-family:ui-monospace,monospace;background:rgba(255,180,84,.14);color:var(--amber);
    border:1px solid rgba(255,180,84,.3);border-radius:5px;padding:0 6px;font-size:11px;margin:0 1px;}
  #compass{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:340px;height:26px;overflow:hidden;
    background:var(--panel);border:1px solid var(--line);border-radius:13px;z-index:20;}
  #compass .strip{position:absolute;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;color:var(--dim);font-size:11px;letter-spacing:.2em;}
  #compass::after{content:"";position:absolute;left:50%;top:0;height:100%;width:2px;background:var(--amber);transform:translateX(-50%);}
  #prompt{position:fixed;left:50%;bottom:23%;transform:translateX(-50%);z-index:20;background:var(--panel);
    border:1px solid var(--amber);border-radius:8px;padding:8px 16px;letter-spacing:.06em;color:#eaf1f3;font-size:14px;}
  #prompt b{color:var(--amber);}
  #feed{position:fixed;left:16px;top:120px;z-index:20;width:320px;display:flex;flex-direction:column;gap:6px;}
  .note{background:var(--panel);border-left:3px solid var(--cyan);border-radius:6px;padding:7px 11px;font-size:12.5px;
    color:#d7e2e6;opacity:0;transform:translateX(-10px);animation:slidein .3s forwards;}
  .note.warn{border-left-color:var(--red);} .note.good{border-left-color:var(--green);} .note.amber{border-left-color:var(--amber);}
  @keyframes slidein{to{opacity:1;transform:none;}}
  #sig{position:fixed;right:16px;top:120px;z-index:20;width:220px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;}
  #sig .val{font-size:22px;font-weight:800;color:var(--cyan);}

  /* instrument screen (DOM, crisp) */
  #inst{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:22;width:min(560px,92vw);
    background:linear-gradient(180deg,rgba(6,12,12,.94),rgba(4,9,9,.96));border:1px solid rgba(90,220,180,.35);
    border-radius:12px;padding:12px 14px;box-shadow:0 0 40px rgba(20,60,50,.4),inset 0 0 30px rgba(30,90,70,.12);}
  #inst .ihead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  #inst .iname{color:var(--green);letter-spacing:.16em;text-transform:uppercase;font-size:12px;font-weight:700;}
  #inst .ihint{color:var(--dim);font-size:11px;}
  #inst canvas{width:100%;height:150px;display:block;border-radius:6px;background:#04110c;}
  #inst .readout{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:12px;color:#bfeeda;}
  #inst .readout b{color:#eafff6;}
  #tabletList{max-height:150px;overflow:auto;}
  .trow{display:grid;grid-template-columns:1.4fr .8fr .8fr .8fr;gap:8px;padding:3px 0;border-bottom:1px solid rgba(90,220,180,.12);font-size:12px;}
  .trow.h{color:var(--dim);text-transform:uppercase;font-size:10px;letter-spacing:.1em;}

  /* map + notebook modal */
  #mapC{width:100%;height:min(60vh,560px);background:#070b0d;border:1px solid var(--line);border-radius:10px;}
  .nbTable{width:100%;border-collapse:collapse;font-size:12px;}
  .nbTable th,.nbTable td{border-bottom:1px solid rgba(120,150,160,.14);padding:5px 7px;text-align:left;}
  .nbTable th{color:var(--amber);text-transform:uppercase;font-size:10px;letter-spacing:.08em;}
  .concl{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .concl button{text-align:left;cursor:pointer;background:rgba(120,150,160,.06);border:1px solid var(--line);color:#d7e2e6;
    padding:10px 12px;border-radius:8px;font-size:13px;}
  .concl button:hover{border-color:var(--amber);background:rgba(255,180,84,.08);}

  /* equipment wheel */
  #wheel{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(3,6,8,.5);backdrop-filter:blur(2px);}
  #wheel .ring{display:flex;gap:14px;}
  .slot{width:120px;height:120px;border:1px solid var(--line);border-radius:14px;background:var(--panel);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--dim);}
  .slot.on{border-color:var(--amber);color:#eaf1f3;box-shadow:0 0 26px rgba(255,180,84,.25);}
  .slot.lock{opacity:.35;}
  .slot .k{font-size:11px;letter-spacing:.1em;}
  .slot .n{font-size:12px;text-align:center;letter-spacing:.06em;}
  .slot .ic{font-size:30px;}

  /* lesson card */
  #lesson{position:fixed;right:20px;bottom:200px;z-index:24;width:330px;background:linear-gradient(180deg,#101a1c,#0b1416);
    border:1px solid var(--cyan);border-radius:12px;padding:14px 16px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  #lesson .lt{color:var(--cyan);letter-spacing:.14em;text-transform:uppercase;font-size:11px;font-weight:700;margin-bottom:6px;}
  #lesson p{margin:0;font-size:13px;line-height:1.45;color:#d7e2e6;}

  #loading{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#05070a;gap:16px;text-align:center;padding:24px;}
  #loading .spin{width:46px;height:46px;border:3px solid rgba(255,180,84,.2);border-top-color:var(--amber);border-radius:50%;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  #err{max-width:640px;color:#ffd0d0;font-size:14px;line-height:1.5;}
  #err code{background:rgba(255,255,255,.08);padding:2px 7px;border-radius:5px;color:var(--amber);}
  .damage{position:fixed;inset:0;z-index:19;pointer-events:none;box-shadow:inset 0 0 200px rgba(255,0,0,0);transition:box-shadow .25s;}
</style>
</head>
<body>
<div id="app"></div>

<div class="damage" id="damage"></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="crosshair"></div>
  <div id="compass"><div class="strip" id="compassStrip"></div></div>
  <div id="guide" class="hidden">
    <div class="gtop"><span class="gstep" id="guideStep">STEP</span><span class="gway" id="guideWay"></span></div>
    <div class="gdo" id="guideDo"></div>
    <div class="ghow" id="guideHow"></div>
    <div class="gsig" id="guideSignal"></div>
    <div class="glearn" id="guideLearn"></div>
  </div>
  <div class="corner" id="hudTL">
    <div id="objTitle">— STANDBY —</div>
    <ul id="objList"></ul>
  </div>
  <div class="corner" id="hudTR">
    <div class="lab">Mission Timer</div>
    <div class="big mono" id="timer">00:00</div>
  </div>
  <div class="corner" id="hudBL">
    <div class="lab">Health</div>
    <div class="bar"><i id="hpFill"></i></div>
    <div class="lab" style="margin-top:8px">Active Equipment</div>
    <div class="mono" id="activeEq" style="color:var(--amber);font-size:15px;">— none —</div>
  </div>
  <div class="corner" id="hudBR">
    <div class="lab">Ammunition</div>
    <div class="big mono" id="ammo">—</div>
    <div class="lab" id="modeLab" style="margin-top:6px;">WEAPON</div>
  </div>
  <div id="feed"></div>
  <div id="sig" class="hidden">
    <div class="lab">Received Signal</div>
    <div class="val mono" id="sigVal">-- dBm</div>
    <div class="bar"><i id="sigFill" style="width:0"></i></div>
    <div class="lab" style="margin-top:6px" id="sigMeta">—</div>
  </div>
</div>
<div id="prompt" class="hidden"></div>

<!-- Instrument DOM screen -->
<div id="inst" class="hidden">
  <div class="ihead"><div class="iname" id="instName">SPECTRUM ANALYZER</div><div class="ihint" id="instHint"></div></div>
  <canvas id="instCanvas" width="1120" height="300"></canvas>
  <div id="tabletList" class="hidden"></div>
  <div class="readout" id="instReadout"></div>
</div>

<!-- Equipment wheel -->
<div id="wheel"><div class="ring" id="wheelRing"></div></div>

<!-- Lesson card -->
<div id="lesson" class="hidden"><div class="lt" id="lessonTitle">FIELD NOTE</div><p id="lessonBody"></p></div>

<!-- Loading -->
<div id="loading">
  <div class="spin" id="spin"></div>
  <div class="sub">Spectrum Front</div>
  <div id="loadMsg" style="color:var(--dim)">Loading engine…</div>
  <div id="err" class="hidden"></div>
</div>

<!-- Modals mount here -->
<div id="modalMount"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
/* ============================================================================
   SPECTRUM FRONT — single-file 3D spectrum & sensor training FPS
   Systems: Game, RendererManager, WorldBuilder, MaterialFactory, TextureFactory,
   AudioManager, InputManager, PlayerController, WeaponSystem, InstrumentManager,
   SignalEngine, PropagationEngine, NetworkEngine, MissionManager, NPCManager,
   ParticleManager, UIManager, NotebookManager, SaveManager.
   ========================================================================== */
let THREE, PointerLockControls, EffectComposer, RenderPass, UnrealBloomPass, ShaderPass, OutputPass;
const loadMsg = (m)=>{ const e=document.getElementById('loadMsg'); if(e) e.textContent=m; };
function fatal(msg){
  const l=document.getElementById('loading'), s=document.getElementById('spin'), e=document.getElementById('err');
  if(s) s.style.display='none';
  if(l) l.classList.remove('hidden');
  if(e){ e.classList.remove('hidden'); e.innerHTML=msg; }
}
try{
  loadMsg('Loading Three.js…');
  THREE = await import('three');
  ({ PointerLockControls } = await import('three/addons/controls/PointerLockControls.js'));
  try{
    ({ EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js'));
    ({ RenderPass } = await import('three/addons/postprocessing/RenderPass.js'));
    ({ UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js'));
    ({ ShaderPass } = await import('three/addons/postprocessing/ShaderPass.js'));
    ({ OutputPass } = await import('three/addons/postprocessing/OutputPass.js'));
  }catch(pp){ console.warn('Post-processing unavailable, continuing without it.', pp); }
}catch(err){
  console.error(err);
  fatal('<b>Could not load the 3D engine.</b><br/>If you opened this file directly, some browsers block module loading from a <code>file://</code> URL. '+
        'Run a local server in this folder:<br/><br/><code>python3 -m http.server 8000</code><br/><br/>then open '+
        '<code>http://localhost:8000/battlefield_spectrum_fps.html</code>');
  throw err;
}

/* ---- tiny utils ---- */
const U = {
  clamp:(v,a,b)=>Math.min(b,Math.max(a,v)),
  lerp:(a,b,t)=>a+(b-a)*t,
  rand:(a,b)=>a+Math.random()*(b-a),
  irand:(a,b)=>Math.floor(a+Math.random()*(b-a+1)),
  db2lin:(d)=>Math.pow(10,d/10),
  fmtT:(s)=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');},
  now:()=>performance.now()/1000,
};
const V3 = (x,y,z)=>new THREE.Vector3(x,y,z);

/* ============================ TextureFactory ============================ */
// Canvas-generated albedo/roughness/bump/emissive maps. Cached by key.
class TextureFactory{
  constructor(){ this.cache=new Map(); }
  _cv(s=256){ const c=document.createElement('canvas'); c.width=c.height=s; return c; }
  _tex(c,rep=1){ const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep,rep);
    t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t; }
  _lin(c,rep=1){ const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep,rep); return t; }
  noise(ctx,s,amt,base){ const img=ctx.getImageData(0,0,s,s),d=img.data;
    for(let i=0;i<d.length;i+=4){ const n=(Math.random()-0.5)*amt; d[i]=U.clamp(d[i]+n,0,255);
      d[i+1]=U.clamp(d[i+1]+n,0,255); d[i+2]=U.clamp(d[i+2]+n,0,255);} ctx.putImageData(img,0,0); }
  cracks(ctx,s,n,col){ ctx.strokeStyle=col; ctx.lineWidth=1;
    for(let i=0;i<n;i++){ ctx.globalAlpha=U.rand(.1,.5); ctx.beginPath(); let x=U.rand(0,s),y=U.rand(0,s); ctx.moveTo(x,y);
      const seg=U.irand(3,7); for(let j=0;j<seg;j++){ x+=U.rand(-40,40); y+=U.rand(-40,40); ctx.lineTo(x,y);} ctx.stroke(); }
    ctx.globalAlpha=1; }
  get(kind){
    if(this.cache.has(kind)) return this.cache.get(kind);
    const s=256, c=this._cv(s), x=c.getContext('2d'); let out={};
    const fill=(col)=>{x.fillStyle=col;x.fillRect(0,0,s,s);};
    switch(kind){
      case 'concrete': fill('#6d6f70'); this.noise(x,s,40); this.cracks(x,s,26,'#3a3b3c'); out={map:this._tex(c,3),rough:.92}; break;
      case 'wetpavement': fill('#3b4145'); this.noise(x,s,26); this.cracks(x,s,14,'#22262a');
        x.fillStyle='rgba(120,150,170,.06)'; for(let i=0;i<40;i++)x.fillRect(U.rand(0,s),U.rand(0,s),U.rand(10,60),U.rand(2,8));
        out={map:this._tex(c,4),rough:.4,metal:.1}; break;
      case 'road': fill('#2c2e30'); this.noise(x,s,20); x.strokeStyle='#c9b45a'; x.lineWidth=8; x.setLineDash([40,30]);
        x.beginPath(); x.moveTo(s/2,0); x.lineTo(s/2,s); x.stroke(); out={map:this._tex(c,2),rough:.85}; break;
      case 'paintedmetal': fill('#4b5a52'); this.noise(x,s,14); x.fillStyle='rgba(30,40,36,.4)';
        for(let i=0;i<10;i++)x.fillRect(U.rand(0,s),U.rand(0,s),U.rand(6,30),U.rand(6,30)); out={map:this._tex(c,2),rough:.5,metal:.7}; break;
      case 'rustedmetal': fill('#6b4a34'); this.noise(x,s,34);
        for(let i=0;i<60;i++){x.fillStyle=`rgba(${U.irand(120,180)},${U.irand(60,90)},${U.irand(30,50)},.5)`;
          x.beginPath();x.arc(U.rand(0,s),U.rand(0,s),U.rand(3,14),0,7);x.fill();} out={map:this._tex(c,2),rough:.8,metal:.5}; break;
      case 'container': fill('#4a6b78'); this.noise(x,s,18); x.strokeStyle='rgba(20,40,48,.6)'; x.lineWidth=6;
        for(let i=16;i<s;i+=26){x.beginPath();x.moveTo(i,0);x.lineTo(i,s);x.stroke();} out={map:this._tex(c,1),rough:.6,metal:.4}; break;
      case 'polymer': fill('#26302e'); this.noise(x,s,10); out={map:this._tex(c,2),rough:.55,metal:.15}; break;
      case 'glass': fill('#26333a'); x.fillStyle='rgba(120,170,190,.15)'; x.fillRect(0,0,s,s);
        this.cracks(x,s,10,'rgba(200,220,230,.35)'); out={map:this._tex(c,1),rough:.08,metal:.1,transp:true}; break;
      case 'fabric': fill('#3c4a3a'); this.noise(x,s,16); x.strokeStyle='rgba(20,26,20,.3)';
        for(let i=0;i<s;i+=6){x.beginPath();x.moveTo(0,i);x.lineTo(s,i);x.stroke();} out={map:this._tex(c,3),rough:.95}; break;
      case 'soil': fill('#463a2c'); this.noise(x,s,42); out={map:this._tex(c,5),rough:1}; break;
      case 'rubble': fill('#57534d'); this.noise(x,s,50); for(let i=0;i<80;i++){x.fillStyle=`rgba(${U.irand(60,110)},${U.irand(60,105)},${U.irand(55,100)},.7)`;
        x.fillRect(U.rand(0,s),U.rand(0,s),U.rand(4,16),U.rand(4,16));} out={map:this._tex(c,4),rough:1}; break;
      case 'wood': fill('#6b4f30'); this.noise(x,s,20); x.strokeStyle='rgba(40,28,16,.4)'; x.lineWidth=2;
        for(let i=0;i<s;i+=10){x.beginPath();x.moveTo(0,i+U.rand(-3,3));x.bezierCurveTo(s/3,i+3,2*s/3,i-3,s,i);x.stroke();} out={map:this._tex(c,2),rough:.85}; break;
      case 'display': { fill('#02110b'); x.fillStyle='#0a3';
        for(let i=0;i<40;i++){x.globalAlpha=U.rand(.1,.7);x.fillRect(U.rand(0,s),U.rand(0,s),U.rand(2,8),2);}
        x.globalAlpha=1; const t=this._lin(c,1); out={map:t,emissive:true}; break; }
      default: fill('#555'); out={map:this._tex(c,1),rough:.8};
    }
    this.cache.set(kind,out); return out;
  }
}

/* ============================ MaterialFactory ============================ */
class MaterialFactory{
  constructor(tf){ this.tf=tf; this.cache=new Map(); }
  get(kind,opts={}){
    const key=kind+JSON.stringify(opts);
    if(this.cache.has(key)) return this.cache.get(key);
    const d=this.tf.get(kind);
    const m=new THREE.MeshStandardMaterial({
      map:d.map||null, color:opts.color||0xffffff,
      roughness:opts.rough!=null?opts.rough:(d.rough!=null?d.rough:.8),
      metalness:opts.metal!=null?opts.metal:(d.metal!=null?d.metal:.1),
      transparent:!!d.transp, opacity:d.transp?.55:1,
      emissive:d.emissive?new THREE.Color(opts.emissive||0x0a3):0x000000,
      emissiveMap:d.emissive?d.map:null, emissiveIntensity:d.emissive?1:0,
    });
    this.cache.set(key,m); return m;
  }
  flat(color,opts={}){ const m=new THREE.MeshStandardMaterial({color,roughness:opts.rough??.8,metalness:opts.metal??.1,
    emissive:opts.emissive||0x000000,emissiveIntensity:opts.ei||0}); return m; }
}

/* ============================ RendererManager ============================ */
class RendererManager{
  constructor(container){
    this.renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    this.renderer.setSize(innerWidth,innerHeight);
    this.renderer.outputColorSpace=THREE.SRGBColorSpace;
    this.renderer.toneMapping=THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure=1.18;
    this.renderer.shadowMap.enabled=true;
    this.renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    container.appendChild(this.renderer.domElement);
    this.composer=null; this.grainPass=null; this.bloomPass=null; this.usePost=true;
  }
  setupPost(scene,camera){
    if(!EffectComposer){ this.usePost=false; return; }
    try{
      this.composer=new EffectComposer(this.renderer);
      this.composer.addPass(new RenderPass(scene,camera));
      this.bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.55,0.7,0.85);
      this.composer.addPass(this.bloomPass);
      // grain + vignette + subtle chromatic aberration
      const GrainShader={
        uniforms:{ tDiffuse:{value:null}, time:{value:0}, amount:{value:0.028}, vig:{value:1.0}, ca:{value:0.0014} },
        vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
        fragmentShader:`
          uniform sampler2D tDiffuse; uniform float time, amount, vig, ca; varying vec2 vUv;
          float rand(vec2 c){ return fract(sin(dot(c,vec2(12.9898,78.233)))*43758.5453); }
          void main(){
            vec2 d=vUv-0.5; float r2=dot(d,d);
            vec2 off=d*ca*(0.5+r2);
            vec4 col; col.r=texture2D(tDiffuse,vUv+off).r; col.g=texture2D(tDiffuse,vUv).g;
            col.b=texture2D(tDiffuse,vUv-off).b; col.a=1.0;
            float g=(rand(vUv+time)-0.5)*amount; col.rgb+=g;
            float v=smoothstep(1.1,0.3,r2*vig*1.5); col.rgb*=mix(0.72,1.0,v);
            gl_FragColor=col;
          }`
      };
      this.grainPass=new ShaderPass(GrainShader);
      this.composer.addPass(this.grainPass);
      if(OutputPass) this.composer.addPass(new OutputPass());
      this.usePost=true;
    }catch(e){ console.warn('post setup failed',e); this.usePost=false; this.composer=null; }
  }
  resize(camera){
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    this.renderer.setSize(innerWidth,innerHeight);
    if(this.composer) this.composer.setSize(innerWidth,innerHeight);
  }
  applyQuality(q){
    const pr=Math.min(devicePixelRatio, q==='high'?2: q==='medium'?1.4:1);
    this.renderer.setPixelRatio(pr);
    this.renderer.shadowMap.enabled = q!=='low';
    if(this.bloomPass) this.bloomPass.enabled = q!=='low';
    this._q=q;
  }
  render(scene,camera,t){
    if(this.usePost && this.composer){ if(this.grainPass) this.grainPass.uniforms.time.value=t; this.composer.render(); }
    else this.renderer.render(scene,camera);
  }
}

/* ============================ AudioManager ============================ */
// Procedural Web Audio. No external files. Starts only after a user gesture.
class AudioManager{
  constructor(){ this.ctx=null; this.master=null; this.enabled=true; this.vol=0.7; this.started=false;
    this.loops={}; }
  start(){
    if(this.started) return;
    try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      this.master=this.ctx.createGain(); this.master.gain.value=this.vol; this.master.connect(this.ctx.destination);
      this.started=true; this._ambient();
    }catch(e){ console.warn('audio init failed',e); this.enabled=false; }
  }
  setVol(v){ this.vol=v; if(this.master) this.master.gain.value=v; }
  _env(g,a,d,peak=1){ const t=this.ctx.currentTime; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); }
  tone(freq,dur,type='sine',peak=0.25,detune=0){ if(!this.ctx||!this.enabled)return; const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type; o.frequency.value=freq; o.detune.value=detune; o.connect(g); g.connect(this.master); this._env(g,0.005,dur,peak); o.start(); o.stop(this.ctx.currentTime+dur+0.05); }
  noise(dur,peak=0.3,filterFreq=1200,type='lowpass'){ if(!this.ctx||!this.enabled)return; const n=this._noiseBuf(dur);
    const s=this.ctx.createBufferSource(); s.buffer=n; const f=this.ctx.createBiquadFilter(); f.type=type; f.frequency.value=filterFreq;
    const g=this.ctx.createGain(); s.connect(f); f.connect(g); g.connect(this.master); this._env(g,0.004,dur,peak); s.start(); s.stop(this.ctx.currentTime+dur+0.05); }
  _noiseBuf(dur){ const len=Math.floor(this.ctx.sampleRate*dur); const b=this.ctx.createBuffer(1,len,this.ctx.sampleRate); const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1; return b; }
  fire(){ this.noise(0.12,0.5,2600,'lowpass'); this.tone(90,0.09,'square',0.25); }
  dryfire(){ this.tone(400,0.03,'square',0.12); }
  reload(){ this.tone(300,0.02,'square',0.15); setTimeout(()=>this.tone(500,0.03,'square',0.15),140); setTimeout(()=>this.tone(240,0.03,'square',0.18),320); }
  step(surface){ const f=surface==='metal'?520:surface==='rubble'?260:180; this.noise(0.06,0.12,f,'lowpass'); }
  pickup(){ this.tone(660,0.08,'triangle',0.22); setTimeout(()=>this.tone(990,0.1,'triangle',0.22),80); }
  chirp(){ this.tone(1400,0.04,'sine',0.14); }
  ui(){ this.tone(880,0.05,'sine',0.16); }
  bad(){ this.tone(160,0.18,'sawtooth',0.2); }
  good(){ this.tone(720,0.09,'sine',0.2); setTimeout(()=>this.tone(1080,0.12,'sine',0.2),90); }
  complete(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.tone(f,0.22,'triangle',0.22),i*130)); }
  alarm(){ this.tone(740,0.2,'square',0.18); setTimeout(()=>this.tone(560,0.2,'square',0.18),220); }
  radio(){ this.noise(0.25,0.08,1600,'bandpass'); }
  // continuous signal-strength tone; call setSignalTone(dbm) each frame
  setSignalTone(active,strength){
    if(!this.ctx||!this.enabled) return;
    if(active && !this.loops.sig){ const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type='sine'; o.frequency.value=600; g.gain.value=0.0001; o.connect(g); g.connect(this.master); o.start();
      this.loops.sig={o,g}; }
    if(!active && this.loops.sig){ this.loops.sig.g.gain.setTargetAtTime(0.0001,this.ctx.currentTime,0.1);
      const l=this.loops.sig; setTimeout(()=>{try{l.o.stop();}catch(e){}},300); this.loops.sig=null; }
    if(active && this.loops.sig){ const s=U.clamp(strength,0,1);
      this.loops.sig.o.frequency.setTargetAtTime(300+s*1400,this.ctx.currentTime,0.05);
      this.loops.sig.g.gain.setTargetAtTime(0.02+s*0.08,this.ctx.currentTime,0.05); }
  }
  _ambient(){ if(!this.ctx)return; // low generator rumble bed
    const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sawtooth'; o.frequency.value=48;
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=120; o.connect(f); f.connect(g); g.connect(this.master);
    g.gain.value=0.05; o.start(); this.loops.amb={o,g}; }
}

/* ============================ ParticleManager ============================ */
// Pooled point-sprite particle systems: sparks, dust, smoke, muzzle.
class ParticleManager{
  constructor(scene,quality){ this.scene=scene; this.max=quality==='low'?140:quality==='medium'?320:600;
    this.parts=[]; this.geo=new THREE.BufferGeometry();
    this.pos=new Float32Array(this.max*3); this.col=new Float32Array(this.max*3); this.siz=new Float32Array(this.max);
    this.geo.setAttribute('position',new THREE.BufferAttribute(this.pos,3));
    this.geo.setAttribute('color',new THREE.BufferAttribute(this.col,3));
    this.geo.setAttribute('size',new THREE.BufferAttribute(this.siz,1));
    const mat=new THREE.PointsMaterial({size:0.25,vertexColors:true,transparent:true,opacity:0.9,depthWrite:false,
      blending:THREE.AdditiveBlending,sizeAttenuation:true});
    this.points=new THREE.Points(this.geo,mat); this.points.frustumCulled=false; scene.add(this.points);
    for(let i=0;i<this.max;i++) this.parts.push({life:0,max:1,vx:0,vy:0,vz:0,x:0,y:-999,z:0,r:1,g:1,b:1,s:0.2,grav:-4,smoke:false});
  }
  emit(x,y,z,opts={}){ const n=opts.count||8;
    for(let k=0;k<n;k++){ const p=this.parts.find(p=>p.life<=0); if(!p) break;
      const sp=opts.speed||3; p.x=x;p.y=y;p.z=z;
      p.vx=U.rand(-1,1)*sp; p.vy=(opts.up||Math.random())*sp; p.vz=U.rand(-1,1)*sp;
      p.life=p.max=opts.life||U.rand(0.3,0.8); const c=opts.color||[1,.7,.2];
      p.r=c[0];p.g=c[1];p.b=c[2]; p.s=opts.size||U.rand(0.08,0.22); p.grav=opts.grav!=null?opts.grav:-6; p.smoke=!!opts.smoke; }
  }
  sparks(x,y,z){ this.emit(x,y,z,{count:12,speed:5,color:[1,.75,.25],life:.4,size:.09,grav:-9}); }
  dust(x,y,z){ this.emit(x,y,z,{count:8,speed:1.4,color:[.55,.5,.42],life:1.1,size:.3,grav:-0.6,smoke:true}); }
  muzzle(x,y,z){ this.emit(x,y,z,{count:6,speed:2,color:[1,.85,.5],life:.12,size:.18,grav:0,up:0.2}); }
  smoke(x,y,z){ this.emit(x,y,z,{count:4,speed:.6,color:[.3,.3,.3],life:2.2,size:.5,grav:0.3,smoke:true}); }
  update(dt){ let n=0; const pos=this.pos,col=this.col,siz=this.siz;
    for(const p of this.parts){ if(p.life>0){ p.life-=dt; p.vy+=p.grav*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
        if(p.y<0.03){ p.y=0.03; p.vy*=-0.3; p.vx*=0.6; p.vz*=0.6; }
        const a=U.clamp(p.life/p.max,0,1);
        pos[n*3]=p.x; pos[n*3+1]=p.y; pos[n*3+2]=p.z;
        col[n*3]=p.r*a; col[n*3+1]=p.g*a; col[n*3+2]=p.b*a;
        siz[n]=p.smoke?p.s*(2-a):p.s*a; n++; }
    }
    for(let i=n;i<this.max;i++){ pos[i*3+1]=-999; siz[i]=0; }
    this.geo.attributes.position.needsUpdate=true; this.geo.attributes.color.needsUpdate=true; this.geo.attributes.size.needsUpdate=true;
    this.geo.setDrawRange(0,this.max);
  }
}

// Builds the 180x180 urban battlefield with distinct interconnected zones.
// Registers box colliders (AABB in XZ + height) and wall meshes for raycasts.
class WorldBuilder{
  constructor(scene,matf,tf,quality){
    this.scene=scene; this.mat=matf; this.tf=tf; this.q=quality;
    this.colliders=[];      // {minx,maxx,minz,maxz,h}
    this.walls=[];          // meshes for signal obstruction + bullet raycast
    this.lights=[];         // flicker lights
    this.zones=[];          // {name,x,z,r}
    this.interactables=[];  // {pos,label,type,radius,fn}
    this.fans=[]; this.flags=[];
  }
  addCollider(cx,cz,w,d,h){ this.colliders.push({minx:cx-w/2,maxx:cx+w/2,minz:cz-d/2,maxz:cz+d/2,h}); }
  box(cx,cy,cz,w,h,d,mat,collide=true,shadow=true){
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(cx,cy,cz);
    m.castShadow=shadow&&this.q!=='low'; m.receiveShadow=true; this.scene.add(m);
    if(collide){ this.addCollider(cx,cz,w,d,cy+h/2); this.walls.push(m); } return m;
  }
  build(){
    // ground
    const gmat=this.mat.get('wetpavement',{});
    const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),gmat);
    ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; this.scene.add(ground);
    // dirt patches
    const soil=this.mat.get('soil');
    for(let i=0;i<8;i++){ const p=new THREE.Mesh(new THREE.CircleGeometry(U.rand(6,14),12),soil);
      p.rotation.x=-Math.PI/2; p.position.set(U.rand(-80,80),0.01,U.rand(-80,80)); p.receiveShadow=true; this.scene.add(p); }
    // perimeter wall to contain the field
    const pw=this.mat.get('concrete');
    const P=92;
    [[0,-P,190,4],[0,P,190,4],[-P,0,4,190],[P,0,4,190]].forEach(([x,z,w,d])=>this.box(x,3,z,w,6,d,pw));

    this._fob();
    this._residential();
    this._industrial();
    this._ridge();
    this._market();
    this._enemyOP();
    this._scatter();
    return this;
  }
  _zone(name,x,z,r){ this.zones.push({name,x,z,r}); }
  _crate(x,z,s=1.2){ const m=this.box(x,s/2,z,s,s,s,this.mat.get('wood'),true,true); return m; }
  _pole(x,z,h=7){ const m=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.15,h,8),this.mat.flat(0x39413f,{metal:.6,rough:.5}));
    m.position.set(x,h/2,z); m.castShadow=this.q!=='low'; this.scene.add(m); this.addCollider(x,z,0.4,0.4,h);
    // cable
    return m; }
  _tent(x,z,col=0x3c4a3a){ const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.BoxGeometry(6,3,5),this.mat.get('fabric',{color:col})); body.position.y=1.5;
    const roof=new THREE.Mesh(new THREE.CylinderGeometry(3.1,3.1,6,3,1,false,0,Math.PI),this.mat.get('fabric',{color:col}));
    roof.rotation.z=Math.PI/2; roof.rotation.y=Math.PI/2; roof.position.y=3; roof.scale.set(1,1,0.55);
    g.add(body,roof); g.position.set(x,0,z); g.traverse(o=>{if(o.isMesh){o.castShadow=this.q!=='low';o.receiveShadow=true;}});
    this.scene.add(g); this.addCollider(x,z,6,5,3.2); return g; }
  _building(x,z,w,d,floors,col){
    const wall=this.mat.get('concrete',{color:col||0x8a8781}); const grp=new THREE.Group();
    const fh=3.2;
    for(let f=0;f<floors;f++){
      const y=f*fh; const shell=this.box(x,y+fh/2,z,w,fh,d,wall,true,true);
      // windows (shattered glass) as emissive-less dark insets on walls, via small boxes
      const gl=this.mat.get('glass');
      for(let wx=-w/2+2; wx<w/2-1; wx+=3){
        const win=new THREE.Mesh(new THREE.BoxGeometry(1.4,1.6,0.15),gl); win.position.set(x+wx,y+1.8,z+d/2+0.02); this.scene.add(win);
        const win2=win.clone(); win2.position.z=z-d/2-0.02; this.scene.add(win2);
      }
    }
    // rooftop lip + access (ladder implied by ramp)
    this.box(x,floors*fh+0.3,z,w+0.4,0.6,d+0.4,wall,false,true);
    // balcony
    this.box(x+w/2+0.6,fh+ (floors>1?fh:0),z,1.4,0.3,d*0.6,this.mat.get('rustedmetal'),true,true);
    return grp;
  }
  _fob(){ const X=0,Z=8; this._zone('Forward Operating Base',X,Z,22);
    this._tent(X-8,Z+2); this._tent(X+8,Z+2,0x4a4436);
    // tactical map table
    const table=this.box(X,0.5,Z-4,3,1,2,this.mat.get('paintedmetal'),true,true);
    // radio mast
    const mast=this._pole(X-14,Z-6,14);
    const dish=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,0.3,16),this.mat.get('paintedmetal',{color:0x9aa}));
    dish.position.set(X-14,13,Z-6); dish.rotation.x=Math.PI/2.4; this.scene.add(dish);
    // generator (hum light + collider)
    const gen=this.box(X+12,0.8,Z-4,2.4,1.6,1.6,this.mat.get('rustedmetal'),true,true);
    this.interactables.push({pos:V3(X+12,1,Z-4),label:'Generator (running)',type:'prop',radius:2.5});
    // command vehicle
    const veh=new THREE.Group();
    veh.add(new THREE.Mesh(new THREE.BoxGeometry(5,2,2.4),this.mat.get('paintedmetal',{color:0x394a3e})));
    const cab=new THREE.Mesh(new THREE.BoxGeometry(2,1.6,2.4),this.mat.get('paintedmetal',{color:0x2f3f34})); cab.position.set(1.6,0.4,0);
    veh.add(cab); veh.position.set(X-6,1.4,Z-9); veh.traverse(o=>{if(o.isMesh){o.castShadow=this.q!=='low';o.receiveShadow=true;}});
    this.scene.add(veh); this.addCollider(X-6,Z-9,6,2.6,2.4);
    // equipment case (opening tutorial pickup)
    const caseM=this.box(X,0.4,Z+6,1.6,0.8,1.1,this.mat.get('paintedmetal',{color:0x2a3a30}),true,true);
    const glow=new THREE.PointLight(0xffb454,1.2,6); glow.position.set(X,1.4,Z+6); this.scene.add(glow); this.lights.push({l:glow,base:1.2,type:'steady'});
    this.interactables.push({pos:V3(X,1,Z+6),label:'Field Equipment Case',type:'equipment',radius:3});
    this.equipCase=V3(X,1,Z+6);
    // friendly network nodes (glowing small boxes)
    for(let i=0;i<3;i++){ const n=this.box(X-16+i*16,0.6,Z+10,0.6,1.2,0.6,this.mat.get('paintedmetal',{color:0x25443a}),true,true);
      const pl=new THREE.PointLight(0x57e389,0.8,4); pl.position.set(X-16+i*16,1.4,Z+10); this.scene.add(pl); this.lights.push({l:pl,base:0.8,type:'steady'}); }
  }
  _residential(){ const X=-52,Z=-40; this._zone('Damaged Residential Block',X,Z,24);
    this._building(X-8,Z,12,10,2,0x8f8b83);
    this._building(X+8,Z-4,10,9,2,0x7d7a72);
    this._building(X,Z+12,14,8,1,0x878379);
    // partially collapsed wall (angled rubble)
    for(let i=0;i<6;i++){ const r=this.box(X-16+i*2,0.5,Z+7+i*0.4,2,U.rand(0.6,2),2,this.mat.get('rubble'),true,true); r.rotation.z=U.rand(-.2,.2); }
    // reflective surface (multipath) — big metal panel
    const panel=this.box(X+15,3,Z+6,0.3,6,8,this.mat.get('paintedmetal',{color:0x99a,metal:.9,rough:.15}),true,true);
    this.reflectors=this.reflectors||[]; this.reflectors.push(V3(X+15,2,Z+6));
    // courtyard fire
    this._fire(X,Z+4);
    // stairway ramp for rooftop access

  resolve(pos,radius){
    for(const c of this.colliders){
      if(pos.y> c.h+1.2) continue;
      const cx=U.clamp(pos.x,c.minx,c.maxx), cz=U.clamp(pos.z,c.minz,c.maxz);
      const dx=pos.x-cx, dz=pos.z-cz; const d2=dx*dx+dz*dz;
      if(d2<radius*radius){ const d=Math.sqrt(d2)||0.0001; const push=(radius-d);
        if(cx>c.minx&&cx<c.maxx&&cz>c.minz&&cz<c.maxz){ // inside: push to nearest edge
          const toL=pos.x-c.minx,toR=c.maxx-pos.x,toB=pos.z-c.minz,toT=c.maxz-pos.z;
          const m=Math.min(toL,toR,toB,toT);
          if(m===toL)pos.x=c.minx-radius; else if(m===toR)pos.x=c.maxx+radius;
          else if(m===toB)pos.z=c.minz-radius; else pos.z=c.maxz+radius;
        } else { pos.x+=dx/d*push; pos.z+=dz/d*push; }
      }
    }
    pos.x=U.clamp(pos.x,-89,89); pos.z=U.clamp(pos.z,-89,89);
  }
  updateLights(t){ for(const o of this.lights){ const {l,base,type}=o;
    if(type==='fire') l.intensity=base*(0.7+Math.sin(t*13+l.position.x)*0.15+Math.random()*0.2);
    else if(type==='flicker') l.intensity=base*(Math.random()>0.92?0.2:1);
    else if(type==='blink') l.intensity=base*((t*1.5%1)>0.5?1:0.1);
  }}
}

// Each emitter: id, pos, freq (MHz), bw (kHz), power (dBm EIRP), class, kind,
// intent (intentional/unintended), duty, active, mobile. Also spawns a small
// in-world device mesh so the source is physically present.
const CLASS = { FRIENDLY:'friendly', CIVILIAN:'civilian', UNKNOWN:'unknown', HOSTILE:'hostile' };
class SignalEngine{
  constructor(scene,world,matf){
    this.scene=scene; this.world=world; this.mat=matf; this.emitters=[]; this.t=0;
    this._def();
  }
  add(o){ o.id=o.id||('E'+this.emitters.length); o.active=o.active!==false; o.phase=Math.random()*10;
    o.mobile=!!o.mobile; o.pos=o.pos.clone(); o.state='nominal';
    // device mesh
    const col= o.cls===CLASS.FRIENDLY?0x57e389: o.cls===CLASS.CIVILIAN?0x4fd6ff: o.cls===CLASS.HOSTILE?0xff5c5c:0xffb454;
    const dev=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5), this.mat.get('display',{emissive:col}));
    dev.position.copy(o.pos); dev.position.y=Math.max(0.4,o.pos.y); this.scene.add(dev);
    const pl=new THREE.PointLight(col,0.5,3); pl.position.copy(dev.position); this.scene.add(pl);
    o.mesh=dev; o.light=pl; o.baseY=dev.position.y; o.discovered=false;
    this.emitters.push(o); return o; }

  byId(id){ return this.emitters.find(e=>e.id===id); }
  // duty/active gate for this instant
  activeNow(e){ if(!e.active) return false;
    if(e.pattern==='periodic'){ return ((this.t + e.phase) % e.period) < e.period*e.duty*3; }
    if(e.pattern==='burst'){ return (Math.sin(this.t*2.3+e.phase)*0.5+0.5) < e.duty; }
    return Math.random()<0.99; // continuous-ish
  }
  update(dt){ this.t+=dt;
    for(const e of this.emitters){
      // mobile emitters drift
      if(e.mobile && e.active){ e.pos.x+=Math.sin(this.t*0.4+e.phase)*dt*1.4; e.pos.z+=Math.cos(this.t*0.3+e.phase)*dt*1.2;
        e.mesh.position.set(e.pos.x,e.baseY,e.pos.z); e.light.position.copy(e.mesh.position); }
      const on=this.activeNow(e);
      e.mesh.material.emissiveIntensity=on?1:0.15; e.light.intensity=on?0.6:0.05;
      e.mesh.position.y=e.baseY+(e.mobile?Math.sin(this.t*2+e.phase)*0.3:0);
    }
  }
}

/* ============================ PropagationEngine ============================ */
// Simplified but internally consistent link model. Positions in "meters" (game units).
class PropagationEngine{
  constructor(sig,world){ this.sig=sig; this.world=world; this.ray=new THREE.Raycaster();
    this.noiseFloor=-96; this._rh=new THREE.Vector3(); }
  obstructions(from,to){ // count wall meshes between two points
    const dir=this._rh.copy(to).sub(from); const dist=dir.length(); dir.normalize();
    this.ray.set(from,dir); this.ray.far=dist;
    const hits=this.ray.intersectObjects(this.world.walls,false);
    return hits.length;
  }
  // received power in dBm at listener with antenna facing `heading` (unit XZ vec) and given directivity
  received(e, from, heading, directivity=0){
    if(!e.active) return this.noiseFloor-8;
    const on=this.sig.activeNow(e);
    const to=e.pos;
    const dx=to.x-from.x, dy=to.y-from.y, dz=to.z-from.z;
    const dist=Math.max(1.0,Math.sqrt(dx*dx+dy*dy+dz*dz));
    // Friis-ish free space path loss (MHz, meters): 20log10(d)+20log10(f)-27.55
    const fspl=20*Math.log10(dist)+20*Math.log10(Math.max(1,e.freq))-27.55;
    const nWalls=this.obstructions(from,to);
    const obLoss=nWalls*7 + (dy>3? dy*0.4:0);
    // antenna directivity: peak when heading points at source
    let dirGain=0;
    if(directivity>0){ const hx=to.x-from.x, hz=to.z-from.z; const hl=Math.hypot(hx,hz)||1;
      const dot=(heading.x*hx+heading.z*hz)/hl; // -1..1
      dirGain = directivity*(dot); // + when aligned, - when behind
    }
    let p = e.power - fspl - obLoss + dirGain;
    if(!on) p -= 26; // in the off part of duty cycle
    // multipath: reflectors can add a misleading local boost from a wrong direction
    if(this.world.reflectors){ for(const r of this.world.reflectors){
      const rd=Math.hypot(r.x-from.x,r.z-from.z); const ed=Math.hypot(r.x-to.x,r.z-to.z);
      if(rd<10 && ed<40){ p += 3*Math.max(0,1-rd/10); } } }
    p += U.rand(-1.5,1.5); // local noise
    return p;
  }
  // best bearing (degrees) as seen by rotating a directional antenna at `from`
  bearingTo(e,from){ const dx=e.pos.x-from.x, dz=e.pos.z-from.z; let a=Math.atan2(dx,-dz)*180/Math.PI; return (a+360)%360; }
  // full spectrum sample within [c-span/2, c+span/2] MHz -> array of {f,dbm}
  // Received power per emitter is computed ONCE (one raycast each), then only the
  // spectral SHAPE is evaluated per bin — keeps this cheap enough for 60 FPS.
  spectrum(from, center, span, bins, heading){
    const lo=center-span/2, hi=center+span/2, step=span/(bins-1);
    // precompute per-emitter linear power + shape params, only for emitters in view
    const contrib=[];
    for(const e of this.sig.emitters){
      const bwM=Math.max(0.02,e.bw/1000);
      const inView = (e.freq>lo-bwM*3 && e.freq<hi+bwM*3) ||
        (e.harmonics && e.harmonics.some(h=>h>lo-4&&h<hi+4));
      if(!inView) continue;
      const p=this.received(e,from,heading,0);
      contrib.push({e,lin:U.db2lin(p),bwM});
    }
    const nfLin=U.db2lin(this.noiseFloor);
    const out=new Array(bins);
    for(let i=0;i<bins;i++){ const f=lo+i*step; let lin=nfLin;
      for(const c of contrib){ const e=c.e;
        if(e.kind==='psu-noise'||e.kind==='led-harmonics'){
          let cc=c.lin*0.001; // broadband floor lift
          if(e.harmonics) for(const h of e.harmonics){ const g=Math.exp(-Math.pow((f-h)/2,2)); cc+=c.lin*g; }
          lin+=cc;
        } else {
          const g=Math.exp(-Math.pow((f-e.freq)/(c.bwM*0.6),2));
          lin+=c.lin*g;
        }
      }
      out[i]={f, dbm:10*Math.log10(lin)};
    }
    return out;
  }
}

    {id:'RVR-6',name:'Course Rover (auth)',ch:11,q:0.88,loss:1.8,lat:28,acks:true,role:'edge',central:0.2,authenticated:true},
  ]; this.medDown=false; this.relayFail=false; }

}

/* ============================ PlayerController ============================ */
class PlayerController{
  constructor(camera,controls,world,audio){
    this.cam=camera; this.controls=controls; this.world=world; this.audio=audio;
    this.pos=V3(0,1.7,20); this.vel=V3(0,0,0); this.onGround=true;
    this.height=1.7; this.crouchH=1.0; this.radius=0.45;
    this.speed=6.4; this.sprintMul=1.7; this.crouch=false; this.sprint=false;
    this.bob=0; this.stepT=0; this.hp=100; this.baseFov=72; this.fov=72;
    this.keys={}; this.controls.getObject().position.copy(this.pos);
  }
  key(code,down){ this.keys[code]=down; }
  jump(){ if(this.onGround){ this.vel.y=6.2; this.onGround=false; } }
  surfaceAt(){ // rough surface type by zone for footstep sound
    const p=this.pos; for(const z of this.world.zones){ if(Math.hypot(p.x-z.x,p.z-z.z)<z.r){
      if(z.name.includes('Industrial')) return 'metal'; if(z.name.includes('Residential')||z.name.includes('Market')) return 'rubble'; } }
    return 'dirt';
  }
  update(dt){
    const obj=this.controls.getObject();
    // desired horizontal velocity from input, camera-relative
    const fwd=new THREE.Vector3(); this.cam.getWorldDirection(fwd); fwd.y=0; fwd.normalize();
    const right=new THREE.Vector3().crossVectors(fwd,V3(0,1,0)).normalize();
    let move=new THREE.Vector3();
    if(this.keys['KeyW'])move.add(fwd); if(this.keys['KeyS'])move.sub(fwd);
    if(this.keys['KeyD'])move.add(right); if(this.keys['KeyA'])move.sub(right);
    const moving=move.lengthSq()>0; if(moving)move.normalize();
    this.sprint=this.keys['ShiftLeft']&&this.keys['KeyW']&&!this.crouch;
    let sp=this.speed*(this.crouch?0.5:1)*(this.sprint?this.sprintMul:1);
    // acceleration
    const target=move.multiplyScalar(sp);
    this.vel.x=U.lerp(this.vel.x,target.x,1-Math.pow(0.0008,dt));
    this.vel.z=U.lerp(this.vel.z,target.z,1-Math.pow(0.0008,dt));
    // gravity
    this.vel.y-=18*dt;
    // integrate
    this.pos.x+=this.vel.x*dt; this.pos.z+=this.vel.z*dt; this.pos.y+=this.vel.y*dt;
    // ground: find highest collider under player within radius for step-up
    let groundY=0;
    for(const c of this.world.colliders){ if(this.pos.x>c.minx-0.4&&this.pos.x<c.maxx+0.4&&this.pos.z>c.minz-0.4&&this.pos.z<c.maxz+0.4){
      if(c.h<=this.pos.y-this.height+1.4 && c.h>groundY && c.h<2.6) groundY=c.h; } }
    const targetH=this.crouch?this.crouchH:this.height;
    if(this.pos.y<=groundY+targetH){ this.pos.y=groundY+targetH; this.vel.y=Math.max(0,this.vel.y); this.onGround=true; } else this.onGround=false;
    // horizontal collision
    this.world.resolve(this.pos,this.radius);
    // footsteps + bob
    if(moving&&this.onGround){ this.stepT+=dt*(this.sprint?11:7);
      if(this.stepT>Math.PI){ this.stepT-=Math.PI; this.audio.step(this.surfaceAt()); }
      this.bob=Math.sin(this.stepT*2)*0.035*(this.sprint?1.4:1);
    } else this.bob*=0.9;
    // fov / tilt
    this.fov=U.lerp(this.fov,this.sprint?this.baseFov+8:this.baseFov,1-Math.pow(0.01,dt));
    if(Math.abs(this.cam.fov-this.fov)>0.1){ this.cam.fov=this.fov; this.cam.updateProjectionMatrix(); }
    // apply to camera holder (eye height + bob). NOTE: never write camera.rotation
    // here — PointerLockControls owns the camera orientation (YXZ quaternion) and
    // touching .z/.rotation reinterprets it in XYZ order and flips the view.
    obj.position.set(this.pos.x,this.pos.y+this.bob,this.pos.z);
  }
  heading(){ const f=new THREE.Vector3(); this.cam.getWorldDirection(f); f.y=0; f.normalize(); return f; }
  headingDeg(){ const f=this.heading(); return (Math.atan2(f.x,-f.z)*180/Math.PI+360)%360; }
  damage(d){ this.hp=U.clamp(this.hp-d,0,100); }
}

/* ============================ WeaponSystem ============================ */
class WeaponSystem{
  constructor(scene,camera,world,audio,particles,sig,npc){
    this.scene=scene; this.cam=camera; this.world=world; this.audio=audio; this.pm=particles; this.sig=sig; this.npc=npc;
    this.ammo=30; this.mag=30; this.reserve=120; this.reloading=false; this.recoil=0; this.ray=new THREE.Raycaster();
    this.decals=[]; this.maxDecals=48; this.lastFire=0; this.ads=false;
    this._build();
  }
  _build(){
    const g=new THREE.Group(); // first-person viewmodel
    const metal=new THREE.MeshStandardMaterial({color:0x23282a,metalness:0.8,roughness:0.4});
    const poly=new THREE.MeshStandardMaterial({color:0x14181a,metalness:0.2,roughness:0.7});
    const body=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.14,0.7),poly); body.position.set(0.18,-0.18,-0.5);
    const barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.5,8),metal); barrel.rotation.x=Math.PI/2; barrel.position.set(0.18,-0.15,-0.9);
    const mag=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.22,0.14),poly); mag.position.set(0.18,-0.32,-0.42);
    const grip=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.18,0.1),poly); grip.position.set(0.18,-0.3,-0.28); grip.rotation.x=0.3;
    const sight=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.05,0.1),metal); sight.position.set(0.18,-0.09,-0.55);
    // hands (glove primitives)
    const glove=new THREE.MeshStandardMaterial({color:0x2a2f2b,roughness:0.9});
    const handR=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.08,0.14),glove); handR.position.set(0.18,-0.26,-0.3);
    const handL=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.08,0.12),glove); handL.position.set(0.18,-0.22,-0.8);
    g.add(body,barrel,mag,grip,sight,handR,handL);
    // muzzle flash sprite
    const flashMat=new THREE.SpriteMaterial({color:0xffcc66,transparent:true,opacity:0,blending:THREE.AdditiveBlending});
    this.flash=new THREE.Sprite(flashMat); this.flash.scale.set(0.5,0.5,0.5); this.flash.position.set(0.18,-0.15,-1.15); g.add(this.flash);
    this.muzzlePos=new THREE.Vector3();
    g.visible=true; this.group=g; this.cam.add(g); this.basePos=g.position.clone();
    this.restPos=V3(0,0,0);
  }
  setVisible(v){ this.group.visible=v; }
  reload(){ if(this.reloading||this.ammo===this.mag||this.reserve<=0) return; this.reloading=true; this.audio.reload();
    setTimeout(()=>{ const need=this.mag-this.ammo, take=Math.min(need,this.reserve); this.ammo+=take; this.reserve-=take; this.reloading=false; },900); }
  fire(game){
    const t=U.now(); if(t-this.lastFire<0.09||this.reloading) return; this.lastFire=t;
    if(this.ammo<=0){ this.audio.dryfire(); return; }
    this.ammo--; this.recoil=Math.min(0.12,this.recoil+0.05); this.audio.fire();
    this.flash.material.opacity=1; this.flash.material.rotation=Math.random()*6;
    const mp=new THREE.Vector3(); this.flash.getWorldPosition(mp); this.pm.muzzle(mp.x,mp.y,mp.z);
    // raycast from camera center
    const dir=new THREE.Vector3(); this.cam.getWorldDirection(dir);
    const origin=new THREE.Vector3(); this.cam.getWorldPosition(origin);
    this.ray.set(origin,dir); this.ray.far=120;
    // check NPCs first
    const npcHit=this.npc?this.npc.raycast(this.ray):null;
    const wallHits=this.ray.intersectObjects(this.world.walls,false);
    const wallDist=wallHits.length?wallHits[0].distance:Infinity;
    if(npcHit && npcHit.distance<wallDist){ this.npc.hit(npcHit.npc,34,game); this.pm.sparks(npcHit.point.x,npcHit.point.y,npcHit.point.z); return; }
    if(wallHits.length){ const h=wallHits[0]; this._decal(h); this.pm.sparks(h.point.x,h.point.y,h.point.z); this.pm.dust(h.point.x,h.point.y,h.point.z);
      // did we shoot an emitter device or civilian/friendly prop? penalize
      if(game) game.onWorldShot(h);
    }
  }
  _decal(hit){ const geo=new THREE.CircleGeometry(0.06,6);
    const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0x0a0a0a,transparent:true,opacity:0.85,depthWrite:false}));
    m.position.copy(hit.point).add(hit.face.normal.clone().multiplyScalar(0.02));
    m.lookAt(hit.point.clone().add(hit.face.normal)); this.scene.add(m);
    this.decals.push(m); if(this.decals.length>this.maxDecals){ const old=this.decals.shift(); this.scene.remove(old); old.geometry.dispose(); } }
  update(dt,moving,sprint){
    this.recoil*=Math.pow(0.0005,dt);
    if(this.flash.material.opacity>0) this.flash.material.opacity=Math.max(0,this.flash.material.opacity-dt*14);
    // sway + ADS
    const sway=Math.sin(U.now()*(sprint?9:4))*(moving?0.012:0.004);
    const adsX=this.ads?-0.18:0, adsY=this.ads?0.03:0, adsZ=this.ads?0.08:0;
    const tp=this.basePos.clone().add(V3(adsX+sway, adsY+Math.cos(U.now()*3)*0.006 - this.recoil*0.5, adsZ+this.recoil));
    if(sprint){ tp.add(V3(-0.06,-0.04,0.05)); this.group.rotation.z=0.25; } else this.group.rotation.z=U.lerp(this.group.rotation.z,0,0.1);
    this.group.position.lerp(tp,1-Math.pow(0.002,dt));
    this.group.rotation.x=U.lerp(this.group.rotation.x, -this.recoil*1.5, 0.3);
  }
}

/* ============================ NPCManager ============================ */
class NPCManager{
  constructor(scene,world,audio,particles,player){
    this.scene=scene; this.world=world; this.audio=audio; this.pm=particles; this.player=player;
    this.npcs=[]; this.tmp=new THREE.Vector3();
  }
  spawnFriendly(x,z,name,lines){ const g=this._body(0x3a5a3a);
    g.position.set(x,0,z); this.scene.add(g);
    const n={grp:g,type:'friendly',name,lines,hp:100,x,z,post:V3(x,0,z),alive:true,hitbox:g.children[0]}; this.npcs.push(n); return n; }
  spawnHostile(x,z,drone=false){ const g=this._body(drone?0x333:0x5a3030,drone);
    g.position.set(x,drone?4:0,z); this.scene.add(g);
    const n={grp:g,type:drone?'drone':'hostile',hp:drone?60:100,x,z,alive:true,state:'patrol',t:Math.random()*10,
      hitbox:g.children[0],fireT:0,drone}; this.npcs.push(n); return n; }
  _body(col,drone=false){ const g=new THREE.Group();
    if(drone){ const b=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.25,0.8),new THREE.MeshStandardMaterial({color:col,metalness:.6,roughness:.4}));
      g.add(b); for(let i=0;i<4;i++){ const arm=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,0.05,10),new THREE.MeshStandardMaterial({color:0x222}));
        arm.position.set((i<2?1:-1)*0.5,0.1,(i%2?1:-1)*0.5); g.add(arm);}
      const eye=new THREE.PointLight(0xff3333,0.6,4); g.add(eye);
    } else {
      const torso=new THREE.Mesh(new THREE.CapsuleGeometry(0.35,0.9,4,8),new THREE.MeshStandardMaterial({color:col,roughness:.8}));
      torso.position.y=1.1; g.add(torso);
      const head=new THREE.Mesh(new THREE.SphereGeometry(0.24,10,10),new THREE.MeshStandardMaterial({color:0x1a1a1a})); head.position.y=1.85; g.add(head);
    }
    g.traverse(o=>{if(o.isMesh)o.castShadow=this.world.q!=='low';});
    return g; }
  raycast(ray){ let best=null; for(const n of this.npcs){ if(!n.alive)continue;
    const box=new THREE.Box3().setFromObject(n.grp); const pt=ray.ray.intersectBox(box,this.tmp.clone());
    if(pt){ const d=ray.ray.origin.distanceTo(pt); if(!best||d<best.distance) best={npc:n,distance:d,point:pt.clone()}; } }
    return best; }
  hit(n,dmg,game){ if(!n.alive)return;
    if(n.type==='friendly'){ if(game) game.penalize('Fired on a friendly unit.',18); return; }
    n.hp-=dmg; this.audio.bad();
    if(n.hp<=0){ n.alive=false; this.scene.remove(n.grp); this.pm.smoke(n.grp.position.x,n.grp.position.y+1,n.grp.position.z);
      if(game) game.flags['hostile_down']=(game.flags['hostile_down']||0)+1; } }
  update(dt,game){ const p=this.player.pos;
    for(const n of this.npcs){ if(!n.alive)continue; n.t+=dt;
      if(n.type==='friendly'){ n.grp.lookAt(p.x,1.5,p.z); continue; }
      const dx=p.x-n.grp.position.x, dz=p.z-n.grp.position.z; const dist=Math.hypot(dx,dz);
      if(dist<32){ n.state='engage'; }
      if(n.state==='engage'){
        n.grp.lookAt(p.x, n.drone?4:1.2, p.z);
        // approach a bit
        if(dist>8){ n.grp.position.x+=dx/dist*dt*(n.drone?2.5:2.2); n.grp.position.z+=dz/dist*dt*(n.drone?2.5:2.2); }
        n.fireT-=dt;
        if(n.fireT<=0 && dist<36){ n.fireT=U.rand(1.2,2.4);
          // line of sight check
          const from=n.grp.position.clone(); from.y=n.drone?4:1.4; const dir=this.tmp.set(p.x-from.x,(p.y)-from.y,p.z-from.z).normalize();
          const rc=new THREE.Raycaster(from,dir,0,dist); const blocked=rc.intersectObjects(this.world.walls,false).length>0;
          if(!blocked){ this.audio.alarm(); if(Math.random()<0.6){ this.player.damage(n.drone?6:9); if(game)game.onPlayerHit(); } }
        }
      } else { // patrol
        n.grp.position.x+=Math.sin(n.t*0.5)*dt*1.2; n.grp.position.z+=Math.cos(n.t*0.4)*dt*1.0;
      }
      if(n.drone) n.grp.position.y=4+Math.sin(n.t*2)*0.3;
    }
  }
  clearHostiles(){ for(const n of this.npcs){ if(n.type!=='friendly'&&n.alive){ this.scene.remove(n.grp); n.alive=false; } } }
}

function interpretSignal(e, missionId){
  const colors={friendly:'#57e389',civilian:'#4fd6ff',unknown:'#ffb454',hostile:'#ff5c5c'};
  const bg={friendly:'rgba(87,227,137,.16)',civilian:'rgba(79,214,255,.14)',unknown:'rgba(255,180,84,.14)',hostile:'rgba(255,92,92,.16)'};
  const guidance = e.cls==='friendly'?'Friendly — leave it alone.'
    : e.cls==='civilian'?'Civilian — never a target.'
    : e.cls==='hostile'?'Hostile — a valid threat.'
    : 'Unknown — inspect before you act (unknown ≠ hostile).';
  const meaning=KIND_MEANING[e.kind]||'an emission';
  const focus=(MISSION_FOCUS[missionId]||[]).includes(e.id);
  const star=focus?' <b style="color:#ffb454">★ Relevant to this objective.</b>':'';
  return { tag:e.cls, color:colors[e.cls], bg:bg[e.cls], text:`<b>${e.name}</b> — ${e.freq} MHz. ${meaning}. ${guidance}${star}` };

    const screen=new THREE.Mesh(new THREE.PlaneGeometry(0.3,0.17),new THREE.MeshBasicMaterial({map:this.screenTex}));
    screen.position.z=0.02; g.add(shell,screen);
    // small antenna nub
    const ant=new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.006,0.18,6),new THREE.MeshStandardMaterial({color:0x333}));
    ant.position.set(0.14,0.18,0); g.add(ant);
    g.position.set(-0.16,-0.16,-0.42); g.rotation.x=-0.35; g.visible=false;
    this.cam.add(g); this.vm=g; this.vmScreen=screen;
  }
  unlock(key){ this.unlocked.add(key); }
  unlockAll(){ INSTRUMENTS.forEach(i=>this.unlocked.add(i.key)); }
  isUnlocked(k){ return this.unlocked.has(k); }
  setActive(key){ if(key && !this.unlocked.has(key)) return false;
    this.active=key; const on=!!key; this.vm.visible=on;
    document.getElementById('inst').classList.toggle('hidden',!on);
    document.getElementById('tabletList').classList.toggle('hidden',key!=='tablet');
    document.getElementById('instCanvas').classList.toggle('hidden',key==='tablet');
    if(on){ document.getElementById('instName').textContent=INSTRUMENTS.find(i=>i.key===key).name.toUpperCase(); }
    return true; }
  // ---- controls routed from input ----
  tune(delta){ if(this.active==='analyzer'){ this.center=U.clamp(this.center+delta,20,6000); this.marker=this.center; } }
  changeSpan(f){ if(this.active==='analyzer'){ this.span=U.clamp(this.span*f,4,400); } }
  adjGain(d){ this.gain=U.clamp(this.gain+d,-20,30); }
  cyclePreset(dir){ this.presetIdx=(this.presetIdx+dir+this.bandPresets.length)%this.bandPresets.length;
    const p=this.bandPresets[this.presetIdx]; this.center=p.c; this.span=p.s; this.marker=p.c; this.audio.chirp();
    this.ui.note('Tuned band: '+p.label+' ('+p.c+' MHz)'); }
  // strongest emitter near marker (for save / mark)
  peakEmitter(){ let best=null,bp=-999; const from=this.player.pos, h=this.player.heading();
    for(const e of this.sig.emitters){ if(Math.abs(e.freq-this.marker)>Math.max(this.span*0.6, e.bw/1000+2)) continue;
      const p=this.prop.received(e,from,h,0); if(p>bp){ bp=p; best=e; } } return best?{e:best,dbm:bp}:null; }
  saveMeasurement(game){
    const from=this.player.pos, h=this.player.heading();
    if(this.active==='analyzer'){ const pk=this.peakEmitter();
      const band=Math.round(this.center/50)*50;
      const m={t:this.sig.t,loc:`${from.x.toFixed(0)},${from.z.toFixed(0)}`,instrument:'Analyzer',freq:this.center.toFixed(1)+' MHz',
        power:pk?pk.dbm.toFixed(1)+' dBm':'—', bw:pk?(pk.e.bw+' kHz'):'—', bearing:'—', band,
        observation: pk? this._describe(pk.e): 'noise floor only', confidence: pk? (pk.dbm>-70?'high':'medium'):'low',
        emitterId: pk?pk.e.id:null, mission: game?game.currentTitle():''};
      this.nb.record(m); this.audio.good(); this.ui.note('Measurement saved: '+(pk?pk.e.name:'noise floor'),'good');
      if(pk){ pk.e.discovered=true; game && game.onMeasure(pk.e,m); this._lessonFor(pk.e,game); }
      game && game.onBandScan(band);
    } else if(this.active==='df'){ if(this.dfPeakDeg==null){ this.ui.note('Sweep the antenna first — rotate to find a peak.','warn'); return; }
      const m={t:this.sig.t,loc:`${from.x.toFixed(0)},${from.z.toFixed(0)}`,instrument:'Direction Finder',freq:this.marker.toFixed(1)+' MHz',
        power:this.dfPeakPow.toFixed(1)+' dBm',bw:'—',bearing:this.dfPeakDeg.toFixed(0)+'°',observation:'bearing to strongest source',
        confidence:'per-position', emitterId:null, mission:game?game.currentTitle():''};
      this.nb.record(m); this.audio.good(); this.ui.note('Bearing saved: '+this.dfPeakDeg.toFixed(0)+'° (need ≥3 from separate spots)','good');
      game && game.onBearing(from.clone(),this.dfPeakDeg);
    } else if(this.active==='probe'){ const near=this._nearProbe();
      if(!near){ let extra='';
        const focus=(this.focusIds||[]).map(id=>this.sig.byId(id)).filter(Boolean);
        if(focus.length){ const from=this.player.pos; const tgt=focus.map(e=>({e,d:from.distanceTo(e.pos)})).sort((a,b)=>a.d-b.d)[0];
          extra=` The target device is ~${tgt.d.toFixed(0)} m away — walk right up to the glowing box (follow the amber beacon).`; }
        this.ui.note('Near-field probe: nothing in range yet.'+extra,'warn'); return; }
      const m={t:this.sig.t,loc:`${from.x.toFixed(0)},${from.z.toFixed(0)}`,instrument:'Near-Field Probe',freq:near.e.freq.toFixed(1)+' MHz',
        power:'strong (near)',bw:near.e.bw+' kHz',bearing:'—',observation:this._probeSignature(near.e),
        confidence:'high', emitterId:near.e.id, mission:game?game.currentTitle():''};
      this.nb.record(m); this.audio.good(); this.ui.note('Probe reading: '+this._probeSignature(near.e),'good');
      near.e.discovered=true; near.e.probed=true; game && game.onProbe(near.e);
    } else if(this.active==='tablet'){ this.ui.note('Network snapshot logged.','good');
      game && game.onTablet(); }
  }
  _describe(e){ const t=e.intent==='unintended'?'unintended emission':'intentional transmission';
    const pat= e.pattern==='periodic'?'periodic bursts': e.pattern==='burst'?'bursty': e.pattern==='broadband'?'broadband/harmonic noise':'continuous';
    return `${pat}, ${t}`; }
  _probeSignature(e){ switch(e.kind){
    case 'led-harmonics': return 'broadband harmonic comb — damaged LED driver (unintended)';
    case 'psu-noise': return 'switching-supply hash — unintended emission';
    case 'motor': return 'motor-controller commutation noise';
    case 'camera': return 'clean digital video carrier — intended transmission';
    case 'comm': case 'telemetry': case 'relay': case 'drone-control': return 'clean modulated carrier — intended transmission';
    case 'transmit-only': return 'periodic beacon, no receive activity detected';
    default: return e.intent==='unintended'?'noisy unintended emission':'modulated carrier'; } }
  _nearProbe(){ const from=this.player.pos; let best=null,bd=11;
    for(const e of this.sig.emitters){ const d=from.distanceTo(e.pos); if(d<bd){ bd=d; best={e,d}; } }
    // In guided missions, prefer the mission's target device if it is anywhere close,
    // so standing on the waypoint reliably probes the right thing.
    const focus=this.focusIds||[];
    if(focus.length){ for(const id of focus){ const e=this.sig.byId(id); if(!e) continue;
      const d=from.distanceTo(e.pos); if(d<14 && (!best||best.e.id!==id) ){ if(!best||d<best.d+5){ best={e,d}; } } } }
    return best; }
  _lessonFor(e,game){ if(!game)return;
    if((e.bw/1000)>2 && !game.lessonsSeen.has('bandwidth')){ game.lessonsSeen.add('bandwidth');
      this.ui.lesson('Bandwidth','Bandwidth is the range of frequencies a signal occupies. A strong center peak does not describe the entire channel it consumes.'); }
    if(e.kind==='transmit-only' && !game.lessonsSeen.has('txonly')){ game.lessonsSeen.add('txonly');
      this.ui.lesson('Detection ≠ Control','Detection establishes that energy is present. It does not establish that the device has a receiver or accepts commands.'); }
  }
  // ---- per-frame update + rendering ----
  update(dt,game){
    this.lastRead=null;
    if(!this.active){ this.audio.setSignalTone(false,0); this.ui.hideSig(); return; }
    const mid=game?game.currentMission().id:1;
    this.focusIds=MISSION_FOCUS[mid]||[];
    const from=this.player.pos, h=this.player.heading();
    const ctx=this.ctx, W=this.canvas.width, H=this.canvas.height;
    ctx.fillStyle='#04110c'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(90,220,180,.12)'; ctx.lineWidth=1;
    for(let i=0;i<10;i++){ const y=i/10*H; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    let ro=[]; // readout entries
    if(this.active==='analyzer'){
      const spec=this.prop.spectrum(from,this.center,this.span,this.bins,h);
      const min=-100, max=-20+this.gain;
      // grid verticals
      for(let i=0;i<=8;i++){ const x=i/8*W; ctx.strokeStyle='rgba(90,220,180,.08)'; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
      // noise floor
      const nf=this.prop.noiseFloor+this.gain;
      const nfy=H-(nf-min)/(max-min)*H; ctx.strokeStyle='rgba(120,140,150,.5)'; ctx.setLineDash([6,6]);
      ctx.beginPath(); ctx.moveTo(0,nfy); ctx.lineTo(W,nfy); ctx.stroke(); ctx.setLineDash([]);
      // trace
      ctx.beginPath(); ctx.strokeStyle='#57e389'; ctx.lineWidth=2;
      let peakP=-999,peakF=this.center;
      spec.forEach((s,i)=>{ const x=i/(this.bins-1)*W; const y=H-U.clamp((s.dbm+this.gain-min)/(max-min),0,1)*H;
        if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); if(s.dbm>peakP){peakP=s.dbm;peakF=s.f;} });
      ctx.stroke();
      // fill under
      ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fillStyle='rgba(87,227,137,.12)'; ctx.fill();
      // marker
      const mx=(this.marker-(this.center-this.span/2))/this.span*W;
      ctx.strokeStyle='#ffb454'; ctx.beginPath(); ctx.moveTo(mx,0); ctx.lineTo(mx,H); ctx.stroke();
      ctx.fillStyle='#ffb454'; ctx.font='16px monospace'; ctx.fillText('◆'+this.marker.toFixed(1),mx+4,18);
      // labels
      ctx.fillStyle='#7fb3a4'; ctx.font='15px monospace';
      ctx.fillText((this.center-this.span/2).toFixed(0),4,H-6); ctx.textAlign='right';
      ctx.fillText((this.center+this.span/2).toFixed(0)+' MHz',W-4,H-6); ctx.textAlign='left';
      const pk=this.peakEmitter();
      ro=[['Center',this.center.toFixed(1)+' MHz'],['Span',this.span.toFixed(0)+' MHz'],['Gain',(this.gain>=0?'+':'')+this.gain+' dB'],
          ['Peak',peakP.toFixed(0)+' dBm @ '+peakF.toFixed(1)],['Noise floor',(this.prop.noiseFloor+this.gain).toFixed(0)+' dBm'],
          ['Est. BW', pk?(pk.e.bw+' kHz'):'—']];
      this.ui.showSig(pk?pk.dbm:this.prop.noiseFloor, pk?pk.e.name:'noise floor');
      this.audio.setSignalTone(!!pk, pk?U.clamp((pk.dbm+100)/80,0,1):0);
      this.lastRead = pk?interpretSignal(pk.e,mid):null;
      document.getElementById('instHint').textContent='◄► tune  ·  ↑↓ span  ·  [ ] gain  ·  N band  ·  R save';
    }
    else if(this.active==='df'){
      // sweep: record strongest heading among emitters near marker
      let bestP=-140,bestDeg=null,bestE=null, secondPeak=null;
      const curDeg=this.player.headingDeg();
      for(const e of this.sig.emitters){ if(Math.abs(e.freq-this.marker)>Math.max(this.span,e.bw/1000+4)) continue;
        const p=this.prop.received(e,from,h,10); // strong directivity
        if(p>bestP){ bestP=p; bestDeg=this.prop.bearingTo(e,from); bestE=e; } }
      // multipath false peak from reflectors
      let multipath=false;
      if(this.sig.world.reflectors){ for(const r of this.sig.world.reflectors){ if(from.distanceTo(r)<12){ multipath=true;
        secondPeak=(this.prop.bearingTo({pos:r},from)); } } }
      // track running peak as player rotates (needs physical rotation to find it)
      const facingErr=Math.abs(((curDeg-(bestDeg||0)+540)%360)-180)-180; // 0 when aligned
      const aligned=Math.max(0,1-Math.abs(((curDeg-(bestDeg||0)+540)%360)-180)/60);
      const observedPow=bestP - (1-aligned)*20;
      if(observedPow>this.dfPeakPow-3 && aligned>0.5){ this.dfPeakPow=observedPow; this.dfPeakDeg=curDeg; }
      // draw polar
      const cx=W/2,cy=H/2,rad=Math.min(W,H)/2-18;
      ctx.strokeStyle='rgba(90,220,180,.25)'; for(let r=rad;r>0;r-=rad/3){ ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.stroke(); }
      // heading needle (up = current facing)
      ctx.save(); ctx.translate(cx,cy);
      // draw source lobe relative to current heading
      if(bestDeg!=null){ const rel=((bestDeg-curDeg)*Math.PI/180);
        const strength=U.clamp((observedPow+110)/70,0.1,1);
        ctx.rotate(rel); ctx.fillStyle='rgba(255,180,84,'+(0.25+strength*0.5)+')';
        ctx.beginPath(); ctx.moveTo(0,0); for(let a=-0.5;a<=0.5;a+=0.05){ ctx.lineTo(Math.sin(a)*rad*strength,-Math.cos(a)*rad*strength);} ctx.closePath(); ctx.fill();
        ctx.rotate(-rel);
      }
      if(multipath && secondPeak!=null){ const rel=((secondPeak-curDeg)*Math.PI/180); ctx.rotate(rel);
        ctx.fillStyle='rgba(255,92,92,.3)'; ctx.beginPath(); ctx.moveTo(0,0);
        for(let a=-0.35;a<=0.35;a+=0.05){ ctx.lineTo(Math.sin(a)*rad*0.6,-Math.cos(a)*rad*0.6);} ctx.closePath(); ctx.fill(); ctx.rotate(-rel); }
      ctx.restore();
      // needle
      ctx.strokeStyle='#ffb454'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx,cy-rad); ctx.stroke();
      ctx.fillStyle='#7fb3a4'; ctx.font='14px monospace';
      ctx.fillText('N',cx-4,cy-rad-4);
      const q=Math.round(aligned*100);
      ro=[['Heading',curDeg.toFixed(0)+'°'],['Rel. power',observedPow.toFixed(0)+' dBm'],
          ['Bearing-quality',q+'%'],['Best bearing',this.dfPeakDeg!=null?this.dfPeakDeg.toFixed(0)+'°':'— sweep —'],
          ['Strongest dir',bestDeg!=null?bestDeg.toFixed(0)+'°':'—'],['Multipath',multipath?'⚠ reflector near':'clear']];
      if(multipath && !game.lessonsSeen.has('multipath')){ game.lessonsSeen.add('multipath');
        this.ui.lesson('Multipath','Urban reflections can produce a stronger local direction than the direct path. Change position before trusting the bearing.'); }
      this.ui.showSig(observedPow,'bearing '+(bestDeg!=null?bestDeg.toFixed(0):'--')+'°');
      this.audio.setSignalTone(true,U.clamp(aligned,0,1));
      this.lastRead = bestE?interpretSignal(bestE,mid):null;
      document.getElementById('instHint').textContent='rotate to sweep  ·  ◄► retune  ·  R save bearing';
    }
    else if(this.active==='probe'){
      const near=this._nearProbe();
      ctx.strokeStyle='#4fd6ff'; ctx.lineWidth=2; ctx.beginPath();
      for(let x=0;x<W;x++){ let v; if(near){ const e=near.e; const strength=1-near.d/8;
          if(e.kind==='led-harmonics'||e.kind==='psu-noise') v=(Math.random()-0.5)*strength + Math.sin(x*0.4)*0.2*strength;
          else if(e.kind==='motor') v=Math.sign(Math.sin(x*0.12))*strength*0.6 + (Math.random()-0.5)*0.15;
          else v=Math.sin(x*0.08+this.sig.t*4)*strength*0.7; }
        else v=(Math.random()-0.5)*0.08;
        const y=H/2 - v*H*0.4; if(x===0)ctx.moveTo(0,y); else ctx.lineTo(x,y); }
      ctx.stroke();
      ro=[['Range',near?near.d.toFixed(1)+' m':'> 8 m (nothing)'],['Coupling',near?'strong':'none'],
          ['Signature',near?this._probeSignature(near.e):'—'],['Emission',near?(near.e.intent):'—']];
      this.ui.showSig(near?(-20-near.d*4):-110, near?'near-field: '+near.e.name:'no coupling');
      this.audio.setSignalTone(!!near, near?1-near.d/8:0);
      this.lastRead = near?interpretSignal(near.e,mid):null;
      document.getElementById('instHint').textContent='get within a few meters  ·  R log signature';
    }
    else if(this.active==='tablet'){
      this.net.update();
      const list=document.getElementById('tabletList');
      list.innerHTML='<div class="trow h"><span>Node</span><span>Ch</span><span>Quality</span><span>Loss / Lat</span></div>'+
        this.net.nodes.map(n=>`<div class="trow"><span>${n.name}${n.authenticated?' 🔑':''}</span><span>${n.ch}</span>`+
          `<span style="color:${n.q>0.7?'#57e389':n.q>0.4?'#ffb454':'#ff5c5c'}">${(n.q*100).toFixed(0)}%</span>`+
          `<span>${n.loss.toFixed(1)}% / ${n.lat.toFixed(0)}ms</span></div>`).join('');
      ro=[['Nodes',this.net.nodes.length],['Authorized-only','yes'],['Note','friendly systems only']];
      this.ui.hideSig(); this.audio.setSignalTone(false,0);
      document.getElementById('instHint').textContent='authorized friendly network diagnostics';
    }
    document.getElementById('instReadout').innerHTML=ro.map(([k,v])=>`<span>${k}: <b>${v}</b></span>`).join('');
    this.screenTex.needsUpdate=true;
  }
}

// Objectives are event-driven flags. Missions unlock tools, place NPCs/events,

function MISSIONS(game){ const g=game; return [
  { id:1, title:'The Room Is Alive', loc:'Forward Operating Base',
    brief:'A new operations center is assembled. Multiple signals are visible and one is disrupting staff equipment. Find and classify the culprit.',

      learn:'How to read a spectrum: center frequency, span, power, the noise floor, and the difference between an intended transmission and unintended electronic noise.',

        {how:'Walk to the glowing case ahead and press <span class="gkey">E</span> to collect the analyzer + probe.',concept:'Instruments',at:[0,14]},
        {how:'Switch to the analyzer (<span class="gkey">2</span>) and press <span class="gkey">N</span> to sweep across at least 3 bands.',concept:'Frequency & span',at:[0,4]},
        {how:'Point at different devices and press <span class="gkey">R</span> to log 4 distinct emissions to your notebook.',concept:'Power & noise floor',at:[0,4]},

  { id:2, title:'What Is the Device Doing?', loc:'Industrial Yard',

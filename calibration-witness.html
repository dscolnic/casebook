ulse to the atoms, which concentrates all of the interaction into one sharp instant.","v":"wrong","fb":"That's essentially Rabi's single-pulse method; Ramsey uses two separated pulses."},{"t":"By heating the atoms so that the spectral line spreads out and thereby becomes considerably easier to locate and center.","v":"wrong","fb":"Heating broadens lines; the method narrows them by extending coherent evolution."},{"t":"By deliberately adding a controlled amount of random noise to the driving field to average away any small imperfections.","v":"wrong","fb":"Noise degrades a resonance; the method sharpens it by lengthening the undisturbed interval."},{"t":"By splitting the interaction into two pulses separated by a long interval of free evolution, so the width depends on that time.","v":"expert","fb":"Longer separation gives narrower fringes and higher precision."}]},{"q":"How can a platform navigate with no satellite signal at all?","o":[{"t":"By simply guessing at its own position more or less at random until the estimate happens to look about right.","v":"wrong","fb":"It uses precise onboard quantum sensors to track motion, not guesswork."},{"t":"By waiting patiently in place until satellite coverage happens to return, and only then resuming its journey onward.","v":"wrong","fb":"The point is genuine independence from satellites — it navigates continuously."},{"t":"It simply cannot, since all forms of accurate navigation ultimately depend on receiving some kind of satellite signal.","v":"wrong","fb":"Onboard quantum clocks and inertial sensors remove that dependence entirely."},{"t":"By carrying its own atomic clocks and cold-atom interferometers to dead-reckon its motion from precise quantum measurements.","v":"expert","fb":"Self-contained quantum inertial navigation — unjammable."}]},{"q":"Timing modules moving between an isolated precision lab and conditioned materials most likely indicate what?","o":[{"t":"A nuclear weapon that relies on the timing modules to provide extremely precise control of its detonation sequence.","v":"danger","fb":"The overclaim the case is built to test — the evidence points to navigation, not detonics."},{"t":"An ordinary commercial factory that happens to be engaged in producing household wall clocks for the domestic market.","v":"wrong","fb":"Atomic timing modules are precision frequency references for navigation, not consumer clocks."},{"t":"A fairly minor technical upgrade being made to the site's existing medical imaging and diagnostic equipment.","v":"wrong","fb":"That ignores the isolation, the conditioned materials, and the strategic character of the timing."},{"t":"A quantum navigation and sensing package — strategically sensitive and dual-use, but emphatically not a weapon.","v":"expert","fb":"The correct, restrained reading of the whole clue chain."}]}]},"esaki":{"sci":"Leo Esaki (1925-)","topic":"Tunneling, Semiconductors & Scanning Probes","lede":"Quantum particles pass through barriers they could never climb — and that leak can image single atoms.","profile":"Leo Esaki is a Japanese physicist who won the 1973 Nobel Prize for the first clear demonstration of a purely quantum effect in a solid-state device: quantum tunneling. Working in industry in the late 1950s, he built a semiconductor diode, now called the Esaki or tunnel diode, whose peculiar behavior could only be explained by electrons passing straight through an energy barrier that, by classical physics, they lacked the energy to cross.\n\nTunneling is one of the strangest and most useful consequences of the wave nature of matter. A classical ball rolled at a hill it cannot surmount always rolls back. But a quantum particle is described by a wavefunction that does not stop abruptly at a barrier; it decays through the barrier and, if the barrier is thin enough, emerges with small but nonzero amplitude on the far side. The particle has a real probability of appearing beyond a wall it could never climb. Crucially, that probability depends extraordinarily steeply — exponentially — on the barrier's width: shrink the gap a little and the tunneling current leaps.\n\nThis exponential sensitivity is not a nuisance but a gift. It is the operating principle of the scanning tunneling microscope (STM), invented by Binnig and Rohrer, which won its own Nobel Prize. A fine conducting tip is brought within a fraction of a nanometer of a surface, and a tunneling current flows across the gap. Because the current changes so violently with distance, moving the tip and holding the current constant traces the surface with atomic resolution — the STM can image and even manipulate individual atoms. Tunneling turned a quantum curiosity into an eye for the atomic world.\n\nTunneling also underlies much more: the alpha decay of nuclei (an alpha particle tunneling out through the nuclear barrier, which Gamow explained), the operation of flash memory and modern transistors, and Josephson junctions used in superconducting quantum devices and ultra-sensitive magnetometers. Esaki's broader career helped establish the physics of semiconductor heterostructures and quantum wells — engineered layered materials that confine electrons and are the basis of countless modern electronic and photonic devices.\n\nFor this case, tunneling matters in two ways. Conceptually, it is a reminder that quantum systems do things classical intuition forbids, and that the most sensitive instruments often exploit an exponential dependence — a tiny change producing a huge signal. Practically, scanning probes and tunneling-based sensors are part of the toolkit of precision measurement and materials characterization that a serious quantum laboratory would possess. An instrument whose signal explodes with a nanometer of motion is measuring something very small, very deliberately.","frame":"\"The equipment in there,\" Teodor says, nodding toward Hall 9, \"is worth more than my truck a hundred times over, and nobody will say why. You explain it, and I'll open up:\"","q":[{"q":"What is quantum tunneling?","o":[{"t":"A particle smashing straight through a barrier by sheer accumulated force, battering its way to the far side over time.","v":"wrong","fb":"No force overcomes the barrier; the wavefunction penetrates it, giving a probability of appearing beyond."},{"t":"A classical ball simply rolling over the top of a hill that it already has more than enough energy to climb.","v":"wrong","fb":"That's ordinary classical motion; tunneling is appearing beyond an insurmountable barrier."},{"t":"The gradual radioactive decay of the barrier material itself, which slowly opens a path for the particle to slip through.","v":"wrong","fb":"Tunneling is a particle's wavefunction penetrating a barrier, not decay of the barrier."},{"t":"A particle passing through a barrier it classically lacks the energy to cross, since its wavefunction extends beyond it.","v":"expert","fb":"The wave nature of matter lets it leak through thin barriers."}]},{"q":"How does the tunneling probability depend on the width of the barrier?","o":[{"t":"Not at all, since the width of the barrier turns out to be completely irrelevant to whether or not a particle tunnels.","v":"wrong","fb":"Width is the dominant factor, exponentially so — the basis of the STM."},{"t":"Linearly and quite gently, so that doubling the width of the barrier simply cuts the tunneling current neatly in half.","v":"wrong","fb":"The dependence is exponential, far steeper — a slight widening can cut current by orders of magnitude."},{"t":"Only on the color of the tunneling particle, since it is the particle rather than the barrier that governs the rate.","v":"wrong","fb":"Particles have no color; tunneling is governed by the barrier's width and height."},{"t":"Exponentially, so that even a very small change in the barrier's width produces a large change in the tunneling current.","v":"expert","fb":"This steep dependence is what lets an STM resolve single atoms."}]},{"q":"How does a scanning tunneling microscope achieve atomic resolution?","o":[{"t":"By illuminating the sample surface with an extremely bright and tightly focused beam of ordinary visible light.","v":"wrong","fb":"Visible light's wavelength is far too large to resolve atoms; the STM uses a tunneling current."},{"t":"By physically dragging a very sharp needle across the surface and mechanically feeling out its bumps and hollows.","v":"wrong","fb":"It senses a tunneling current across a gap without touching, not by scraping."},{"t":"By measuring the natural radioactivity emitted by the individual atoms making up the surface being examined.","v":"wrong","fb":"It measures a tunneling current, not radioactivity."},{"t":"A tunneling current across a sub-nanometer tip-to-surface gap changes so steeply with distance that scanning maps each atom.","v":"expert","fb":"Exponential sensitivity turned into an atomic-scale eye."}]}]}};

const $=id=>document.getElementById(id);
const logEl=$("log");
function flash(msg){ const f=document.createElement("div"); f.className="flash"; f.textContent=msg; document.body.appendChild(f); setTimeout(()=>f.remove(),2600); }
function beat(html){ const el=document.createElement("div"); el.className="beat"; el.innerHTML=html; return el; }
function scrollTop0(){ window.scrollTo({top:0,behavior:"smooth"}); }
function scrollEnd(){ window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}); }

function renderSide(){
  const h=[];
  h.push(`<div class="agent"><div class="badge">◎</div><div><div class="who">Dr. Mara Vale</div><div class="role">Detective's Notepad</div></div></div>`);
  if(G.view!=="title"&&G.view!=="ending") h.push(`<div class="daysbig">${G.daysLeft}<small>days remaining</small></div>`);
  h.push(`<div class="cf-intro">A clue lights a card gold — click it to cross off. The letters show each informant: <span class="ab ab-has">M</span> told you · <span class="ab ab-unsure">A</span> asked, unsure · <span class="ab ab-lacks">T</span> lacks it.</div>`);
  const INF=[["marisz","M"],["archivist","A"],["teodor","T"]];
  ["who","where","what"].forEach(cat=>{
    const c=CATS[cat];
    const left=c.items.filter(it=>!G.crossed[cat][it.id]);
    const anyCue=c.items.some(it=>G.revealed[cat+":"+it.id]&&!G.crossed[cat][it.id]);
    const solo=(left.length===1);
    h.push(`<div class="cf-h">${c.title} <span class="cnt">${left.length} left${anyCue?` · <span class="flag">⚑</span>`:""}</span></div><div class="cf-box">`);
    c.items.forEach(it=>{
      const k=cat+":"+it.id;
      const crossed=!!G.crossed[cat][it.id];
      const cue=!crossed&&!!G.revealed[k];
      const isSolo=solo&&!crossed&&left[0].id===it.id;
      const cls=crossed?"crossed":(cue?"cue":(isSolo?"only":""));
      const mk=crossed?"✗":(cue?"!":(isSolo?"◆":"○"));
      const asks=INF.map(([id,ltr])=>{
        const st=(G.ask[id]||{})[k]||"unasked";
        const tip={has:id+" told you this — cross it off",lacks:id+" does not hold this clue",unsure:"asked "+id+", but they maxed out on something else",unasked:"not yet learned from "+id}[st];
        return `<span class="ab ab-${st}" title="${tip}">${ltr}</span>`;
      }).join("");
      h.push(`<div class="theory ${cls}" onclick="toggleCross('${cat}','${it.id}')" title="${crossed?"click to un-cross":"click to cross off"}"><span class="mk">${mk}</span><span class="tlabel">${it.label}</span><span class="asks">${asks}</span></div>`);
    });
    h.push(`</div>`);
  });
  h.push(`<div class="cf-h" style="margin-top:12px">Standing</div>`);
  const v=Math.round(G.standing);
  h.push(`<div class="stat"><div class="row"><span>Scientific reputation</span><span>${v}</span></div><div class="bar"><i style="width:${v}%;background:var(--accent2)"></i></div></div>`);
  if(G.view!=="title"&&G.view!=="ending"){
    h.push(`<button class="btn ghost" onclick="openClues()">Clues log (${G.clues.length})</button>`);
    h.push(`<button class="btn ghost" onclick="openInbox()">Circulars (${G.emails.length}/24)</button>`);
    h.push(`<button class="btn warn" onclick="goAccuse()">Make an Accusation</button>`);
  }
  $("side").innerHTML=h.join("");
}
function toggleCross(cat,id){ if(G.crossed[cat][id]) delete G.crossed[cat][id]; else G.crossed[cat][id]=true; renderSide(); }

/* modal reader */
function openInbox(){
  if(!G.emails.length){ flash("No circulars yet — meet an informant to receive one."); return; }
  const rows=G.emails.slice().reverse().map(k=>{const t=TOPICS[k];const u=!G.emailsRead[k]?"unread":"";return `<div class="mailrow ${u}" onclick="openEmail('${k}')"><div class="subj">${t.sci}</div><div class="m">${t.topic}</div></div>`;}).join("");
  $("reader").innerHTML=`<button class="close" onclick="closeModal()">CLOSE</button><h1 style="font-size:20px">Science-History Circulars</h1><p style="color:#6b5f45;font-style:italic">${G.emails.length} of 18 received. Each profile is exactly the topic the matching informant will quiz you on — reread them any time.</p>${rows}`;
  $("modal").classList.add("open");
}
function openEmail(k){ const t=TOPICS[k]; G.emailsRead[k]=true; const p=t.profile.split("\n\n").map(x=>`<p>${x}</p>`).join(""); $("reader").innerHTML=`<button class="close" onclick="closeModal()">CLOSE</button><button class="close" onclick="openInbox()" style="margin-right:8px">‹ ALL</button><div class="hdr"><div class="from">Langley circular</div><h1>${t.sci}</h1><div class="lede">${t.topic} — ${t.lede}</div></div>${p}`; renderSide(); }
function openClues(){ if(!G.clues.length){ flash("No clues yet — meet informants and answer well."); return; } const rows=G.clues.map((c,i)=>`<div class="mailrow"><div class="subj">${i+1}. Rule out: ${c.text}</div><div class="m">from ${c.from}</div></div>`).join(""); $("reader").innerHTML=`<button class="close" onclick="closeModal()">CLOSE</button><h1 style="font-size:20px">Clues collected</h1><p style="color:#6b5f45;font-style:italic">Each clue clears one card. You cross it off yourself — click the gold entries in your notepad.</p>${rows}`; $("modal").classList.add("open"); }
function closeModal(){ $("modal").classList.remove("open"); }
$("modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });

function setTop(){ $("daysLabel").textContent=G.view==="title"?"":`${G.daysLeft} day${G.daysLeft===1?"":"s"} left`; $("locLabel").textContent=(G.view==="board"||G.view==="place"||G.view==="meet")?("Karsovia — "+PLACES[G.loc].name):""; }

/* ------------------------------ BOARD ------------------------------ */
function renderBoard(){
  G.view="board"; setTop(); renderSide();
  const W=600,H=360;
  const edges=EDGES.map(e=>{const a=PLACES[e[0]].xy,b=PLACES[e[1]].xy;return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#2b3d52" stroke-width="3" stroke-dasharray="2 6"/>`;}).join("");
  const nodes=Object.keys(PLACES).map(id=>{
    const p=PLACES[id],[x,y]=p.xy,here=id===G.loc,cost=travelCost(G.loc,id);
    const fill=here?"#1c3a4e":"#12202c", stroke=here?"#57c98a":"#3a5a78";
    const costTxt=here?"you are here":`${cost} day${cost>1?"s":""}`;
    return `<g class="node" onclick="travelTo('${id}')"><circle class="ncirc" cx="${x}" cy="${y}" r="22" fill="${fill}" stroke="${stroke}" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="15" fill="#cfe4f2">◉</text><text x="${x}" y="${y-30}" text-anchor="middle" font-family="monospace" font-size="11" fill="#dfe7f2">${p.name.replace(/^(The |National |Research |University )/,"")}</text><text x="${x}" y="${y+38}" text-anchor="middle" font-family="monospace" font-size="10" fill="${here?'#57c98a':'#f0b429'}">${costTxt}</text></g>`;
  }).join("");
  logEl.innerHTML=`<div class="beat">
    <div class="scene-title">The board — where will you go?</div>
    <div class="narr"><p>You have <b>${G.daysLeft} day${G.daysLeft===1?"":"s"}</b> before your visa expires. A hop costs a day or two; each stop is one appointment. All three informants can be found across the country — travel to a place, and choose whom to meet there.</p></div>
    <div class="board"><svg viewBox="0 0 ${W} ${H}">${edges}${nodes}</svg><div class="board-legend"><span>⚙ <b>Marisz</b> — reactor</span><span>▤ <b>The Archivist</b> — records</span><span>✦ <b>Teodor</b> — the edges</span></div></div>
    <div class="btnrow"><button class="btn" onclick="travelTo('${G.loc}')">Meet someone here (${PLACES[G.loc].name}) — 1 day</button><button class="btn warn" onclick="goAccuse()">Ready to accuse</button></div>
  </div>`;
  scrollTop0();
}
function travelTo(id){
  const cost=travelCost(G.loc,id);
  if(cost>G.daysLeft){ flash("Not enough days left to go there."); return; }
  G.daysLeft-=cost; G.loc=id; arriveMail();
  if(G.daysLeft<=0){ renderBoard(); flash("Out of days — make your accusation."); return; }
  renderPlace();
}
function arriveMail(){ /* circulars are delivered per-appointment, not per-place */ }

/* --------------------------- CHOOSE PERSON ------------------------- */
function renderPlace(){
  G.view="place"; setTop(); renderSide();
  const cards=Object.keys(CHARACTERS).map(pid=>{const c=CHARACTERS[pid];
    return `<button class="person" onclick="meetPerson('${pid}')"><div class="pface">${c.face}</div><div><div class="pn">Meet ${c.name}</div><div class="pr">${c.role} — ${c.hint}</div></div></button>`;
  }).join("");
  logEl.innerHTML=`<div class="beat">
    <div class="scene-title">${PLACES[G.loc].name} — whom will you see?</div>
    <div class="narr"><p><em>You have arrived. Choose one informant to keep an appointment with. A circular from Langley will reach you on the way in.</em></p></div>
    <div class="people-row">${cards}</div>
    <div class="btnrow"><button class="btn ghost" onclick="renderBoard()">← Back to the board</button></div>
  </div>`;
  scrollTop0();
}

/* --------------------- CIRCULAR POPUP + APPOINTMENT ---------------- */
function meetPerson(pid){
  const arr=TOPICMAP[G.loc][pid];
  const ck=G.loc+"|"+pid;
  if(G.comboIdx[ck]==null) G.comboIdx[ck]=Math.floor(Math.random()*arr.length);
  const topic=arr[G.comboIdx[ck]%arr.length]; G.comboIdx[ck]++;
  G.meet={char:pid, place:G.loc, topic:topic, who:null, what:null, qs:[], qi:0, wrong:0};
  // the matched scientist's profile pops up BEFORE the appointment
  if(!G.emails.includes(topic)) G.emails.push(topic);
  G.emailsRead[topic]=true; renderSide();
  const t=TOPICS[topic]; const p=t.profile.split("\n\n").map(x=>`<p>${x}</p>`).join("");
  $("reader").innerHTML=`<button class="close" onclick="beginAppointment()">CONTINUE TO THE MEETING →</button><div class="hdr"><div class="from">Langley circular · ${PLACES[G.loc].name} · ${CHARACTERS[pid].name}</div><h1>${t.sci}</h1><div class="lede">${t.topic} — ${t.lede}</div></div>${p}<div style="margin-top:16px;text-align:center"><button class="btn" onclick="beginAppointment()">Continue to the meeting →</button></div>`;
  $("modal").classList.add("open");
}
function beginAppointment(){
  closeModal();
  G.view="meet"; setTop(); renderSide();
  const c=CHARACTERS[G.meet.char], place=G.meet.place;
  const story=STORIES[G.meet.char][place];
  const whoOpts=CATS.who.items.map(it=>`<option value="${it.id}">${it.label}</option>`).join("");
  const whatOpts=CATS.what.items.map(it=>`<option value="${it.id}">${it.label}</option>`).join("");
  logEl.innerHTML="";
  logEl.appendChild(beat(`<div class="meet">
    <div class="who"><div class="face">${c.face}</div><div><div class="nm">${c.name}</div><div class="rl">${c.role} · at ${PLACES[place].name}</div></div></div>
    <div class="desc">${story}</div>
    <div class="scene-title">Put a suggestion to them</div>
    <p style="color:var(--muted);font-size:14px;margin:2px 0 10px">Name a suspect and a scenario. <b>Where is fixed: ${PLACES[place].name}</b>, since that's where you're standing. ${c.name} can cross off only what they actually know — and how much depends on how you answer.</p>
    <div class="acc-field"><label>Suggest — WHO is in charge</label><select id="meet-who"><option value="">— choose a suspect —</option>${whoOpts}</select></div>
    <div class="acc-field"><label>Suggest — WHAT is happening</label><select id="meet-what"><option value="">— choose a scenario —</option>${whatOpts}</select></div>
    <div class="btnrow"><button class="btn" onclick="submitSuggestion()">Put it to them</button><button class="btn ghost" onclick="renderBoard()">Leave without asking</button></div>
  </div>`));
  scrollTop0();
}
function submitSuggestion(){
  const who=$("meet-who").value, what=$("meet-what").value;
  if(!who||!what){ flash("Choose one WHO and one WHAT to suggest."); return; }
  G.meet.who=who; G.meet.what=what;
  const bank=TOPICS[G.meet.topic].q;
  const start=G.topicQ[G.meet.topic]||0;
  G.meet.qs=[0,1,2].map(k=>bank[(start+k)%bank.length]);
  G.topicQ[G.meet.topic]=(start+3)%bank.length;
  G.meet.qi=0; G.meet.wrong=0;
  // the informant's in-character challenge frames the quiz
  logEl.appendChild(beat(`<div class="meet"><div class="frame">${TOPICS[G.meet.topic].frame}</div></div>`));
  renderQuestion();
}
function renderQuestion(){
  const m=G.meet;
  if(m.qi>=m.qs.length){ finishMeeting(); return; }
  const qd=m.qs[m.qi];
  const el=beat(`<div class="meet"><div class="qprog">Question ${m.qi+1} of 3 · ${m.wrong} wrong so far</div><div class="prompt">${qd.q}</div><div class="opts">${qd.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="lab">${String.fromCharCode(65+i)}.</span>${o.t}</button>`).join("")}</div><div class="fbslot"></div></div>`);
  logEl.appendChild(el); scrollEnd();
  let answered=false;
  el.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(answered) return; answered=true;
    const o=qd.o[+b.dataset.i], wrong=(o.v==="wrong"||o.v==="danger");
    if(wrong){ m.wrong++; G.standing=Math.max(0,G.standing-3);} else { G.standing=Math.min(100,G.standing+2);}
    renderSide();
    el.querySelectorAll(".opt").forEach((x,xi)=>{ x.disabled=true; if(xi===+b.dataset.i) x.classList.add("chosen"); });
    const vmap={expert:"EXPERT",partial:"PARTIAL CREDIT",wrong:"WRONG",danger:"DANGEROUS"};
    const slot=el.querySelector(".fbslot");
    slot.innerHTML=`<div class="feedback v-${o.v}"><span class="verdict">${vmap[o.v]}</span>${o.fb}</div><button class="btn">Continue</button>`;
    slot.querySelector(".btn").addEventListener("click",()=>{ slot.querySelector(".btn").remove(); m.qi++; renderQuestion(); });
    scrollEnd();
  }));
}
function finishMeeting(){
  const m=G.meet, ch=CHARACTERS[m.char];
  const allow = m.wrong===0?2 : m.wrong===1?1 : 0;
  // the suggestion, WHERE fixed to current place; reveal held cards among the three, priority where,who,what
  const sug=[{cat:"where",id:m.place},{cat:"who",id:m.who},{cat:"what",id:m.what}];
  const holds=s=>ch.hand.some(b=>b.cat===s.cat&&b.id===s.id);
  const notGiven=s=>!G.given[m.char+"|"+s.cat+":"+s.id];
  const cands=sug.filter(s=>holds(s)&&notGiven(s));
  const give=cands.slice(0,allow);
  give.forEach(s=>{ G.given[m.char+"|"+s.cat+":"+s.id]=true; G.revealed[s.cat+":"+s.id]=true;
    G.clues.push({text:shortLabel(s.cat,s.id)+" — "+CATS[s.cat].title, from:ch.name}); });
  // record what we now know about THIS informant for the three probed cards (Clue-style notepad marks):
  //  has = they told us (revealed it now or earlier); lacks = proven absent (leftover capacity, still not shown);
  //  unsure = we asked but capacity was used up on other clues, so it's undetermined.
  const gaveKeys=new Set(give.map(s=>s.cat+":"+s.id));
  G.ask[m.char]=G.ask[m.char]||{};
  sug.forEach(s=>{ const k=s.cat+":"+s.id, cur=G.ask[m.char][k];
    if(gaveKeys.has(k)) G.ask[m.char][k]="has";
    else if(G.given[m.char+"|"+k]) G.ask[m.char][k]="has";   // told us in an earlier meeting
    else if(give.length<allow) G.ask[m.char][k]="lacks";     // leftover capacity, yet not shown => they don't hold it
    else if(cur!=="lacks") G.ask[m.char][k]="unsure";        // capacity spent elsewhere => undetermined
  });
  renderSide();

  const perf = m.wrong===0?`You answered all three correctly — ${ch.name} speaks freely (up to two clues).`
    : m.wrong===1?`One slip — ${ch.name} offers a single clue.`
    : `Two or more wrong — ${ch.name} loses confidence and shares nothing.`;
  let body;
  if(give.length){
    const lis=give.map(s=>`<li>Rule out <b>${shortLabel(s.cat,s.id)}</b> <span style="color:var(--muted)">(${CATS[s.cat].title})</span></li>`).join("");
    body=`<div class="cluecard"><div class="clab">🔍 ${give.length} new clue${give.length>1?"s":""}</div>${perf}<ul>${lis}</ul><div class="hint">These cards are lit gold in your notepad → cross them off yourself.</div></div>`;
  } else if(allow===0){
    body=`<div class="nothing">${perf} Come back another day, surer of the physics.</div>`;
  } else {
    body=`<div class="nothing">${perf} But ${ch.name} holds nothing on <b>${shortLabel("who",m.who)}</b>, <b>${shortLabel("what",m.what)}</b>, or this place — or you've already learned it. Try a different suspect, scenario, place, or informant.</div>`;
  }
  const out = G.daysLeft<=0;
  const btns = out ? `<div class="btnrow"><button class="btn warn" onclick="goAccuse()">Make your accusation</button></div>`
    : `<div class="btnrow"><button class="btn" onclick="renderBoard()">Back to the board</button><button class="btn warn" onclick="goAccuse()">Accuse now</button></div>`;
  logEl.appendChild(beat(`<div class="meet">${body}${out?`<p style="color:var(--bad)"><b>Your time is up.</b></p>`:""}${btns}</div>`));
  scrollEnd();
}

/* --------------------------- ACCUSATION ---------------------------- */
function goAccuse(){
  G.view="accuse"; setTop(); renderSide();
  const sel=cat=>`<select id="acc-${cat}"><option value="">— choose —</option>${CATS[cat].items.map(it=>`<option value="${it.id}">${it.label}</option>`).join("")}</select>`;
  logEl.innerHTML=`<div class="beat"><div class="accuse-box"><h2>Your accusation to Langley</h2>
    <p>Name all three. It only holds if the person, the place, and the nature are all correct — like calling the envelope in Clue.</p>
    <div class="acc-field"><label>Who is in charge</label>${sel("who")}</div>
    <div class="acc-field"><label>Where it culminates</label>${sel("where")}</div>
    <div class="acc-field"><label>What is happening</label>${sel("what")}</div>
    <div class="btnrow"><button class="btn warn" onclick="submitAccuse()">File the report</button>${G.daysLeft>0?`<button class="btn ghost" onclick="renderBoard()">Keep investigating</button>`:""}</div>
  </div></div>`;
  scrollTop0();
}
function submitAccuse(){
  const who=$("acc-who").value, where=$("acc-where").value, what=$("acc-what").value;
  if(!who||!where||!what){ flash("Choose one option in each of the three fields."); return; }
  renderEnding(who,where,what);
}

/* ----------------------------- ENDINGS ----------------------------- */
function renderEnding(who,where,what){
  G.view="ending"; G.finished=true; setTop(); renderSide();
  const got=Object.keys(G.revealed).length;
  const whoOK=who===CATS.who.truth, whereOK=where===CATS.where.truth, whatOK=what===CATS.what.truth;
  let rank,title,body;
  if(whoOK&&whereOK&&whatOK){
    if(got>=8){ rank="EXPERT WITNESS"; title="What the Evidence Supports, and No More";
      body=["Mara names it exactly: Deputy Minister Kova orchestrating the concealment; the work culminating in Hall 9; an undeclared neutron-conditioned quantum navigation and sensing program behind a medical-contamination cover-up — not a weapon.",
        "Every card accounted for. She kept her cover, worked her informants, and claimed precisely what she could defend. Mara Vale goes home a calibration specialist, exactly as she arrived — which is the whole point."]; }
    else if(got>=5){ rank="SOUND, THIN"; title="Right — but Lightly Proven";
      body=["Mara names the right three — Kova, Hall 9, the quantum program behind a cover-up. The shape is correct and her restraint exactly right.",
        "But she left too many cards unturned; an analyst will have to firm up the chain. Close and honest — a few more days of legwork would have made it unassailable."]; }
    else { rank="NAMED, NOT PROVEN"; title="The Right Answer, Unearned";
      body=["Mara names the truth — Kova, Hall 9, the quantum program — but gathered too few clues to back it. It reads like a guess.",
        "Langley cannot act on an accusation this thin, however correct. Being right is not the same as being able to prove it."]; }
  }
  else if(!whatOK){
    if(what==="bomb"){ rank="OVERCLAIM"; title="The Analyst Who Cried Bomb";
      body=["Mara reports a covert nuclear weapon — dramatic, and not what the evidence shows.",
        "Nothing she gathered was weapon assembly. The overclaim collapses under scrutiny into a quantum-navigation story plus a safety cover-up, and the real findings are tainted by association."]; }
    else if(what==="calib"){ rank="DISMISSAL"; title="The Auditor Who Signed Off";
      body=["Mara concludes it was tired detectors and sloppy paperwork — exactly the conclusion Karsovia built the cover-up to produce.",
        "Falsified dates, an activated coupon, an isolated hall: every anomaly pointed one way, and 'bad detector' explains none of them."]; }
    else if(what==="power"){ rank="MISSED IT"; title="The Peaceful Explanation";
      body=["Mara concludes Karsovia is merely expanding peaceful power. Comfortable, and wrong.",
        "Peaceful power needs no falsified dates, no concealed exposure, no magnetically-screened hall. The cover-up and the quantum program vanish from her report."]; }
    else if(what==="espionage"){ rank="WRONG TRACK"; title="Chasing the Wrong Crime";
      body=["Mara reports the theft of stolen foreign technology — a crime story, but not this one.",
        "The evidence is of something built here — neutron-conditioned materials feeding a precision quantum lab — not smuggled in. She followed a scent that led away from the truth."]; }
    else { rank="HALF THE TRUTH"; title="The Safety Report";
      body=["Mara reports a concealed medical-contamination incident and stops there. Half right, and the more dangerous half is missing.",
        "The activation, the isolated hall, the timing modules all point past a hospital accident to an undeclared quantum program. She caught the cover-up and never saw what it hid."]; }
  }
  else { rank="RIGHT NATURE, WRONG NAMES"; title="So Close";
    body=["Mara understands what is happening — an undeclared quantum navigation program behind a safety cover-up, not a bomb and not an accident. The physics, she has cold.",
      `But her accusation misnames ${!whereOK?"where it culminates":""}${(!whereOK&&!whoOK)?" and ":""}${!whoOK?"who is in charge":""}. An accusation that points at the wrong room or the wrong person doesn't hold. It centers on Hall 9, and it is Deputy Minister Kova who turned a safety incident into a shield.`]; }

  logEl.innerHTML=`<div class="beat"><div class="ending"><div class="rank">◆ ${rank}</div><h2>${title}</h2>
    <div class="narr">${body.map(p=>`<p>${p}</p>`).join("")}</div>
    <div style="margin-top:12px;font-family:monospace;font-size:12px;color:var(--muted)">Accused — Who: ${shortLabel("who",who)} · Where: ${shortLabel("where",where)} · What: ${shortLabel("what",what)}</div>
    <div style="margin-top:8px;border-top:1px solid var(--line);padding-top:10px;font-family:monospace;font-size:12px;color:var(--muted)">Clues gathered: ${got}/9 · Circulars read: ${G.emails.length}/24 · Days used: ${DAYS_TOTAL-G.daysLeft}/${DAYS_TOTAL} · Standing ${Math.round(G.standing)}</div>
    <button class="btn ghost" style="margin-top:16px" onclick="location.reload()">Play again</button></div></div>`;
  scrollTop0();
}

/* --------------------------- TITLE / BOOT -------------------------- */
function showTitle(){
  G.view="title"; setTop();
  logEl.innerHTML=`<div class="title-screen beat">
    <div class="subt">A deduction game in the closed republic of Karsovia</div>
    <h1>The Calibration Witness</h1>
    <div class="blurb">
      <p>You are <b>Dr. Mara Vale</b>, in Karsovia under cover as a detector-calibration specialist. Solve it Clue-style: <b>who is in charge</b>, <b>where it culminates</b>, and <b>what is really happening</b> — one answer in each column of your notepad.</p>
      <p>Three informants each <b>hold three clues</b> (they are not the suspects), and their hands are reshuffled every game. Travel the <b>board</b> of four sites — a hop is one or two days — and pick whom to meet. Each place-and-person meeting draws one of <b>24 physicist profiles</b> (which one varies run to run): it <b>pops up as a circular before the appointment</b>, exactly the topic you're about to be tested on. Then you make a <b>suggestion</b> — a specific <b>WHO</b> and <b>WHAT</b>, with <b>WHERE fixed to where you stand</b>. The informant <b>tests you</b> with three physics questions: <b>ace all for up to two clues, miss one for a single clue, miss two or more and they clam up</b> — and they can only reveal clues they actually hold.</p>
      <p>Each clue lights a card gold; <b>you cross it off yourself.</b> You have <b>${DAYS_TOTAL} days</b>. When you're sure — or out of time — <b>accuse: Who, Where, and What, all three must match.</b></p>
    </div>
    <button class="btn" onclick="beginGame()">Arrive in Vetrograd</button>
  </div>`;
  renderSide();
}
function beginGame(){ shuffleHands(); G.loc="ministry"; renderBoard(); }

window.travelTo=travelTo; window.renderPlace=renderPlace; window.meetPerson=meetPerson;
window.beginAppointment=beginAppointment; window.submitSuggestion=submitSuggestion;
window.renderBoard=renderBoard; window.goAccuse=goAccuse; window.submitAccuse=submitAccuse;
window.toggleCross=toggleCross; window.openInbox=openInbox; window.openEmail=openEmail;
window.openClues=openClues; window.closeModal=closeModal; window.beginGame=beginGame;
showTitle();

</script>

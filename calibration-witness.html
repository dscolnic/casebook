<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Calibration Witness</title>
<style>
  :root{
    --bg:#0c1016; --panel:#141b25; --panel2:#0f151d; --ink:#dfe7f2; --muted:#8a99ad;
    --line:#243244; --accent:#4ea1d3; --accent2:#f0b429; --good:#57c98a; --warn:#e8974b;
    --bad:#e0596b; --danger:#c0392b; --paper:#efe7d4; --paperink:#2c2418;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:radial-gradient(1200px 600px at 70% -10%, #182233 0%, #0c1016 60%);
    color:var(--ink); font:16px/1.6 "Iowan Old Style","Palatino Linotype",Georgia,serif; -webkit-font-smoothing:antialiased;}
  .wrap{display:grid; grid-template-columns:1fr 360px; min-height:100vh}
  @media (max-width:940px){ .wrap{grid-template-columns:1fr} .side{order:2; height:auto; position:static} }

  .stage{padding:22px 30px 120px; max-width:900px; margin:0 auto; width:100%}
  .topbar{display:flex; align-items:baseline; gap:14px; border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:18px; flex-wrap:wrap}
  .topbar h1{font-size:20px; letter-spacing:.5px; margin:0; font-weight:600}
  .topbar .days{color:var(--accent2); font-size:13px; letter-spacing:1px; text-transform:uppercase; font-family:"Courier New",monospace}
  .topbar .loc{color:var(--muted); font-size:13px; margin-left:auto; font-style:italic}

  .log{display:flex; flex-direction:column; gap:16px}
  .beat{animation:rise .4s ease}
  @keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  .scene-title{font-family:"Courier New",monospace; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--accent); margin:4px 0 2px}
  .narr p{margin:0 0 12px} .narr em{color:#cfe4f2}

  /* board */
  .board{border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#0a1119}
  .board svg{display:block; width:100%; height:auto}
  .node{cursor:pointer}
  .node:hover .ncirc{stroke:var(--accent2); stroke-width:3}
  .node .ncirc{transition:.15s}
  .board-legend{padding:10px 14px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted); display:flex; gap:16px; flex-wrap:wrap}
  .board-legend b{color:var(--ink)}

  /* meeting */
  .meet{border:1px solid var(--line); border-radius:12px; background:linear-gradient(180deg,#151d28,#111721); padding:16px 18px}
  .meet .who{display:flex; gap:12px; align-items:center; margin-bottom:10px}
  .meet .face{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#2a3a4d,#16202b);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;flex:none}
  .meet .nm{font-size:17px;font-weight:600} .meet .rl{font-size:12px;color:var(--muted)}
  .meet .desc{font-size:14px;color:#c3cee0;margin-bottom:12px}
  .meet .frame{font-size:15px;color:#e7dcc2;font-style:italic;border-left:3px solid var(--accent2);background:rgba(240,180,41,.07);padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:4px}
  .topicbtns{display:flex;gap:10px;flex-wrap:wrap}
  .prompt{font-size:17px; margin:6px 0 14px}
  .opts{display:flex; flex-direction:column; gap:9px}
  .opt{text-align:left; background:#0e141d; color:var(--ink); border:1px solid var(--line); border-radius:9px; padding:11px 14px; cursor:pointer; font:inherit; font-size:15px; transition:.15s}
  .opt:hover{border-color:var(--accent); background:#131c28}
  .opt .lab{color:var(--muted); font-family:"Courier New",monospace; margin-right:8px}
  .opt:disabled{opacity:.55; cursor:default} .opt.chosen{border-color:var(--accent2)}
  .qprog{font-family:"Courier New",monospace;font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:6px}
  .feedback{margin-top:14px; border-left:3px solid var(--muted); padding:10px 14px; background:#0d131b; border-radius:0 8px 8px 0; font-size:15px}
  .feedback .verdict{font-family:"Courier New",monospace; font-size:12px; letter-spacing:2px; text-transform:uppercase; display:block; margin-bottom:5px}
  .v-expert{border-color:var(--good)} .v-expert .verdict{color:var(--good)}
  .v-partial{border-color:var(--warn)} .v-partial .verdict{color:var(--warn)}
  .v-wrong{border-color:var(--bad)} .v-wrong .verdict{color:var(--bad)}
  .v-danger{border-color:var(--danger)} .v-danger .verdict{color:var(--danger)}

  .btn{display:inline-block; margin-top:14px; background:var(--accent); color:#04121c; border:none; border-radius:9px; padding:11px 22px; font:inherit; font-weight:700; letter-spacing:.5px; cursor:pointer; transition:.15s}
  .btn:hover{filter:brightness(1.1)} .btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--accent)}
  .btn.warn{background:var(--accent2); color:#1a1400} .btn.small{padding:8px 14px; font-size:14px; margin-top:0}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}

  .cluecard{margin-top:12px; border:1px solid var(--accent2); border-radius:9px; background:linear-gradient(180deg,#241f10,#191408); padding:12px 14px; font-size:14px; animation:rise .35s ease}
  .cluecard .clab{font-family:"Courier New",monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--accent2); margin-bottom:6px}
  .cluecard ul{margin:6px 0 0; padding-left:18px} .cluecard li{margin:3px 0}
  .cluecard .hint{margin-top:8px; font-size:12.5px; color:#c9b789; font-style:italic}
  .nothing{margin-top:12px; border-left:3px solid var(--bad); background:#160f12; padding:10px 14px; border-radius:0 8px 8px 0; font-size:14px; color:#e6b3bc}

  .accuse-box,.ending{border:2px solid var(--accent2); border-radius:14px; background:linear-gradient(180deg,#1a2230,#0e141d); padding:22px 24px}
  .accuse-box h2,.ending h2{margin:0 0 6px} .accuse-box p{color:var(--muted); margin:0 0 16px}
  .acc-field{margin-bottom:15px}
  .acc-field label{display:block; font-family:"Courier New",monospace; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--accent); margin-bottom:6px}
  .acc-field select{width:100%; background:#0e141d; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:11px 12px; font:inherit; font-size:15px}
  .people-row{display:flex; flex-direction:column; gap:10px; margin-top:6px}
  .person{display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:10px; background:#101823; padding:11px 13px; cursor:pointer; transition:.15s; text-align:left; color:var(--ink); font:inherit; width:100%}
  .person:hover{border-color:var(--accent2); background:#151d28}
  .person .pface{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#2a3a4d,#16202b);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;flex:none}
  .person .pn{font-size:15px;font-weight:600} .person .pr{font-size:12px;color:var(--muted); line-height:1.35}
  .ending .rank{font-family:"Courier New",monospace; letter-spacing:2px; text-transform:uppercase; font-size:13px; margin-bottom:14px}

  /* sidebar */
  .side{background:var(--panel); border-left:1px solid var(--line); padding:16px 15px; position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto}
  .agent{display:flex; align-items:center; gap:10px; margin-bottom:10px}
  .agent .badge{width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#2a3a4d,#16202b); border:1px solid var(--line); display:grid; place-items:center; font-size:17px}
  .agent .who{font-size:15px; font-weight:600} .agent .role{font-size:11px; color:var(--muted)}
  .cf-intro{font-size:12px; color:var(--muted); font-style:italic; margin-bottom:6px; line-height:1.4}
  .cf-h{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin:14px 0 6px; font-family:"Courier New",monospace; display:flex; justify-content:space-between}
  .cf-h .cnt{color:var(--accent2)} .cf-h .flag{color:var(--accent2); font-weight:700}
  .cf-box{border:1px solid var(--line); border-radius:9px; background:var(--panel2); padding:2px 0}
  .theory{padding:7px 11px; font-size:13px; border-bottom:1px solid #1c2734; display:flex; gap:8px; align-items:flex-start; cursor:pointer; user-select:none; transition:background .12s}
  .theory:last-child{border-bottom:none} .theory:hover{background:#131c28}
  .theory .mk{font-family:"Courier New",monospace; color:var(--muted); flex:none; width:12px; text-align:center}
  .theory.crossed{color:#54606f; text-decoration:line-through; text-decoration-color:var(--bad)}
  .theory.crossed .mk{color:var(--bad); text-decoration:none}
  .theory.cue{background:rgba(240,180,41,.12); box-shadow:inset 3px 0 0 var(--accent2)}
  .theory.cue:hover{background:rgba(240,180,41,.2)} .theory.cue .mk{color:var(--accent2); font-weight:800}
  .theory.only{color:var(--good); font-weight:600} .theory.only .mk{color:var(--good)}
  .theory .tlabel{flex:1; min-width:0}
  .asks{display:flex; gap:3px; flex:none; align-items:center; margin-left:4px}
  .ab{width:15px; height:15px; border-radius:3px; font:700 10px/15px "Courier New",monospace; text-align:center; border:1px solid var(--line); color:var(--muted); background:#0a0f16}
  .ab-has{background:rgba(87,201,138,.28); border-color:var(--good); color:#9af0bf}
  .ab-unsure{background:rgba(240,180,41,.26); border-color:var(--accent2); color:#f6d98a}
  .ab-lacks{background:rgba(224,89,107,.2); border-color:#7a3a44; color:#e79aa4}
  .ab-unasked{opacity:.32}
  .stat{margin-bottom:8px}
  .stat .row{display:flex; justify-content:space-between; font-size:11px; margin-bottom:3px; font-family:"Courier New",monospace; letter-spacing:.5px}
  .bar{height:6px; border-radius:4px; background:#0a0f16; overflow:hidden; border:1px solid var(--line)}
  .bar i{display:block; height:100%; transition:width .5s ease}
  .daysbig{font-family:"Courier New",monospace; font-size:26px; color:var(--accent2); text-align:center; letter-spacing:1px}
  .daysbig small{display:block; font-size:10px; letter-spacing:2px; color:var(--muted); text-transform:uppercase}
  .side .btn{width:100%; text-align:center; margin-top:9px}

  .modal{position:fixed; inset:0; background:rgba(4,7,11,.72); display:none; place-items:center; z-index:50; padding:24px}
  .modal.open{display:grid}
  .reader{background:var(--paper); color:var(--paperink); max-width:720px; width:100%; max-height:86vh; overflow-y:auto; border-radius:8px; padding:30px 38px; font-family:Georgia,"Times New Roman",serif; box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .reader .hdr{border-bottom:2px solid #b9ac8c; padding-bottom:10px; margin-bottom:18px}
  .reader .hdr .from{font-family:"Courier New",monospace; font-size:12px; color:#6b5f45}
  .reader h1{font-size:25px; margin:6px 0 2px; font-weight:700} .reader .lede{font-style:italic; color:#5c5138}
  .reader p{margin:0 0 13px; font-size:16px; line-height:1.65}
  .reader .close{position:sticky; top:0; float:right; background:#3a3020; color:var(--paper); border:none; border-radius:6px; padding:7px 14px; cursor:pointer; font-family:"Courier New",monospace}
  .mailrow{padding:9px 11px; border-radius:7px; cursor:pointer; border:1px solid transparent}
  .mailrow:hover{background:#111a24; border-color:var(--line)} .mailrow .subj{font-size:14px; font-weight:600}
  .mailrow.unread .subj::before{content:"● "; color:var(--accent2)} .mailrow .m{font-size:11px; color:var(--muted); font-family:"Courier New",monospace}

  .title-screen{max-width:680px; margin:5vh auto 0; text-align:center}
  .title-screen h1{font-size:42px; letter-spacing:1px; margin:0 0 6px}
  .title-screen .subt{color:var(--accent2); font-family:"Courier New",monospace; letter-spacing:3px; text-transform:uppercase; font-size:13px}
  .title-screen .blurb{color:var(--muted); margin:20px auto; max-width:580px; text-align:left}
  .title-screen .blurb p{margin:0 0 12px} .title-screen .blurb b{color:var(--ink)}
  .flash{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#12202c; border:1px solid var(--accent); color:var(--ink); padding:11px 20px; border-radius:10px; font-size:14px; box-shadow:0 10px 40px rgba(0,0,0,.5); z-index:60; animation:rise .3s ease}
</style>
</head>
<body>
<div class="wrap">
  <main class="stage">
    <div class="topbar">
      <h1>The Calibration Witness</h1>
      <span class="days" id="daysLabel"></span>
      <span class="loc" id="locLabel"></span>
    </div>
    <div class="log" id="log"></div>
  </main>
  <aside class="side" id="side"></aside>
</div>
<div class="modal" id="modal"><div class="reader" id="reader"></div></div>

<script>
/* =====================================================================
   THE CALIBRATION WITNESS — a Clue-style deduction game.
   Solve WHO is in charge + WHERE it culminates + WHAT is happening.
   Three informants (not the suspects) each HOLD 5 clues. Travel the board
   (1-2 days a hop), pick an informant, and make a SUGGESTION from dropdowns:
   a specific WHO and a specific WHAT (WHERE = where you stand). Answer their
   three physics questions — ace all for up to 2 clues, one slip for 1, two+
   for none — and they can only cross off clues they actually hold. A science
   circular pops up before every appointment. Beat the countdown, then accuse.
   ===================================================================== */

const DAYS_TOTAL = 10;
const G = {
  view:"title", daysLeft:DAYS_TOTAL, loc:"ministry",
  revealed:{}, crossed:{who:{},where:{},what:{}}, clues:[],
  topicQ:{}, given:{}, standing:50, emails:[], emailsRead:{},
  ask:{}, // ask[informant]["cat:id"] = "has" | "lacks" | "unsure" — what we've learned per informant per card
  comboIdx:{}, // per place|person combo, which of its two topics to show next
  meet:null, finished:false,
};
/* Replayability: shuffle which informant holds each non-solution clue (the
   true answers are never held), so the route and whom-to-press differ each game. */
function shuffleHands(){
  const infs=["marisz","archivist","teodor"];
  ["where","who","what"].forEach(cat=>{
    const ids=CATS[cat].items.map(i=>i.id).filter(i=>i!==CATS[cat].truth);
    for(let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=ids[i]; ids[i]=ids[j]; ids[j]=t; }
    infs.forEach((inf,k)=>{ const slot=CHARACTERS[inf].hand.find(b=>b.cat===cat); slot.id=ids[k]; });
  });
}
const key=b=>b.cat+":"+b.id;

/* --------------------------- CLUE CARDS ---------------------------- */
const CATS = {
  who:{ title:"Who is in charge", truth:"kova", items:[
    {id:"priol", label:"Dr. Anselm Priol — nuclear physicist"},
    {id:"renko", label:"Chief Eng. Renko — reactor"},
    {id:"sabel", label:"Dr. Irena Sabel — quantum metrologist"},
    {id:"kova",  label:"Dep. Minister Kova — the ministry"},
  ]},
  where:{ title:"Where it culminates", truth:"hall9", items:[
    {id:"isotope",   label:"National Isotope Center"},
    {id:"reactor",   label:"Research Reactor Hall"},
    {id:"ministry",  label:"The Ministry"},
    {id:"hall9",     label:"Hall 9"},
  ]},
  what:{ title:"What is happening", truth:"quantum", items:[
    {id:"bomb",     label:"A covert nuclear weapon"},
    {id:"calib",    label:"Nothing wrong — calibration errors"},
    {id:"medical",  label:"A medical contamination cover-up, only"},
    {id:"quantum",  label:"Undeclared quantum navigation, behind a cover-up"},
  ]},
};
function itemLabel(cat,id){ const it=CATS[cat].items.find(x=>x.id===id); return it?it.label:id; }
function shortLabel(cat,id){ return itemLabel(cat,id).split(" — ")[0]; }

/* ----------------------------- BOARD ------------------------------- */
const PLACES = {
  ministry:  {name:"The Ministry",                xy:[130,80]},
  isotope:   {name:"National Isotope Center",     xy:[300,90]},
  reactor:   {name:"Research Reactor Hall",       xy:[300,300]},
  hall9:     {name:"Hall 9",                       xy:[500,300]},
};
const EDGES = [["ministry","isotope"],["isotope","reactor"],["reactor","hall9"],["ministry","reactor"]];
function adjacent(a,b){ return EDGES.some(e=>(e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a)); }
function travelCost(a,b){ return a===b?1:(adjacent(a,b)?1:2); }

/* --------------------------- INFORMANTS ---------------------------- */
/* Not the suspects. Each HOLDS exactly 3 clues (one per category). Meetable
   at ANY place. Hands are shuffled per game (see shuffleHands) for replay. */
const CHARACTERS = {
  marisz:{ name:"Marisz Vekh", role:"Reactor technician", face:"⚙",
    hint:"Knows the neutron floor: the reactor people, the activated materials, and the wild talk of a weapon.",
    hand:[{cat:"where",id:"reactor"},{cat:"who",id:"renko"},{cat:"what",id:"bomb"}] },
  archivist:{ name:"The Archivist", role:"Ministry records clerk", face:"▤",
    hint:"Keeps the paper: shipping dates, activity logs, and which official signs for what.",
    hand:[{cat:"where",id:"isotope"},{cat:"who",id:"priol"},{cat:"what",id:"calib"}] },
  teodor:{ name:"Teodor", role:"Border driver & fixer", face:"✦",
    hint:"Hauls freight to the country's quiet corners; hears every rumor, and has a firm sense of what is NOT going on.",
    hand:[{cat:"where",id:"ministry"},{cat:"who",id:"sabel"},{cat:"what",id:"medical"}] },
};

/* --------------- 3 informants x 6 places = 18 stories -------------- */
const STORIES = {
 marisz:{
  border:"Marisz meets you in the freezing customs annex, coat collar up, eyes flicking to the cameras. \"I shouldn't be this far from the plant — they notice when technicians travel. Ask me quickly, and don't write anything down.\"",
  ministry:"Under the ministry's chandeliers Marisz looks profoundly out of place, twisting her dosimeter badge. \"All this,\" she whispers, \"bought on a budget that says we only make medicine. I've stood in the flux. I know what it costs.\"",
  isotope:"Among the shipping crates Marisz relaxes a fraction — nearly her world. \"The labels here change after the barrels leave my hands,\" she says, tapping one. \"I keep the real numbers in my head, where no one can rewrite them.\"",
  university:"Marisz lingers at the back of an empty lecture hall, staring at chalk equations. \"I trained here once, before they sent me to the floor and told me to stop asking what the coupons were for.\"",
  reactor:"Here Marisz is finally herself, blue light on her face, pumps humming. \"This I understand,\" she says quietly. \"The neutrons don't lie, even when the paperwork does. Ask me about the flux — that, I can answer.\"",
  hall9:"Marisz won't approach Hall 9's door, speaking to you from across the loading yard. \"They take conditioned material in from my reactor at night. I'm not cleared to know why. But I know it isn't medicine.\"",
 },
 archivist:{
  border:"The Archivist has come to the border 'to verify a manifest,' or so the travel chit claims. \"Everything leaves a paper trail,\" they say, adjusting their spectacles. \"Even — especially — the things meant to have none.\"",
  ministry:"In the ledger-lined basement beneath the ministry, the Archivist is at home. \"I file what I'm given,\" they say mildly, \"and I remember what the numbers said before someone kindly improved them.\"",
  isotope:"The Archivist runs a finger down a shipping ledger and sighs. \"A date is a claim, and a claim can be checked against the decay. People forget that. Then they're surprised when the decay disagrees.\"",
  university:"In the university archive the clerk seems almost content among old dissertations. \"The interesting names,\" they murmur, \"are the ones who published brilliantly, then went silent and began signing classified requisitions.\"",
  reactor:"The Archivist stands well back from the core, clutching a folder. \"I handle paper, not physics. But I can tell you whose signature authorizes each thing that leaves this building.\"",
  hall9:"The Archivist studies Hall 9's blank facade. \"No requisition for that building has ever crossed my desk. That absence is itself a record — and arranging it took real authority.\"",
 },
 teodor:{
  border:"Teodor leans on his idling truck at the crossing, grinning through the sleet. \"My office. Everything that enters this country comes past me. You want to know what's real? Ask the man who carries it.\"",
  ministry:"Teodor squeaks across the ministry's marble, comically out of place and enjoying it. \"They don't like my sort in here. But drivers hear what ministers say when they think the help isn't listening.\"",
  isotope:"At the isotope dock Teodor is loading crates he clearly knows too well. \"Medical, they stamp them,\" he says with a wink. \"I've driven 'medical' to some very odd addresses. Not one of them a hospital.\"",
  university:"Teodor waits by the university gate, out of place among the students. \"I ferry the quiet professors to places that aren't on any map. The ones who come back not talking.\"",
  reactor:"Teodor isn't allowed past the reactor fence and knows it. \"I drop at the gate. But I've hauled the shielded boxes coming out — heavy, warm sometimes. Not the weight of aspirin.\"",
  hall9:"Hall 9 has clearly rattled even Teodor. \"Air-ride trailers, guards who don't speak, deliveries at three in the morning. Whatever's in there, they handle it like it could hear us.\"",
 },
};

/* ---------------------------- QUESTIONS ---------------------------- */
/* ===================== 24 TOPICS across 12 place-x-person combos =====
   4 places x 3 informants = 12 combos; each combo maps to TWO scientists
   (24 total), one shown per meeting (randomized per game, cycling on revisit)
   for replayability. The pre-appointment circular IS that scientist's profile;
   the frame is the informant's in-character reason for the quiz; questions are
   length-balanced. right=expert|partial, wrong=wrong|danger.
   ==================================================================== */
const TOPICMAP = {"isotope":{"marisz":["curie","sievert"],"archivist":["soddy","aston"],"teodor":["geiger","roentgen"]},"reactor":{"marisz":["fermi","chadwick"],"archivist":["seaborg","meitner"],"teodor":["rutherford","bethe"]},"ministry":{"marisz":["einstein","debroglie"],"archivist":["bohr","planck"],"teodor":["bennett","heisenberg"]},"hall9":{"marisz":["stern","rabi"],"archivist":["townes","feynman"],"teodor":["ramsey","esaki"]}};
const TOPICS = {"curie":{"sci":"Marie Curie (1867-1934)","topic":"Radioactivity, Half-Life & Activity","lede":"A radioactive sample carries its own clock, and its numbers must add up.","profile":"Marie Curie, born Maria Sklodowska in Warsaw in 1867, turned radioactivity from a curiosity into a quantitative science. Denied a university education in occupied Poland, she studied in Paris and stayed to do the work that would make her the first person to win two Nobel Prizes, in Physics and in Chemistry. With Pierre Curie she measured the faint ionization produced by uranium and thorium and coined the word radioactivity.\n\nHer decisive move was to trust a discrepancy. Pitchblende ore was several times more active than its uranium content could explain. Rather than blame the apparatus, she reasoned that unknown, far more radioactive elements must be hidden in it — and, processing tonnes of ore by hand in a leaky shed, isolated polonium and radium. The lesson is exact: when a measured activity does not match the declared contents, the honest conclusion is that either the declaration is wrong or something undeclared is present.\n\nCurie's science rests on a few quantitative pillars. Activity is the number of decays per second, and for a pure substance it is proportional to how many radioactive atoms are present — so a known amount of a known isotope has a predictable activity. Decay is exponential and governed by the half-life: the time for half the atoms (and thus half the activity) to decay away. After one half-life, half remains; after two, a quarter; after three, an eighth. Because this clock is fixed by nuclear physics and untouched by chemistry or temperature, a sample's present activity plus knowledge of the isotope reconstructs how much was there and how long ago it was prepared. A declared preparation date and a decay curve must agree; if they do not, one of them is a fiction.\n\nThis is the tool that convicts a rewritten label. A waste drum whose activity has fallen by half over eight days is, by definition, one half-life old in that isotope — roughly eight days into its decay. A fresh sticker claiming it was processed two days ago is contradicted by the drum's own physics. The atoms keep honest time even when the paperwork lies.\n\nCurie paid for her discoveries with her health, dying in 1934 of aplastic anemia almost certainly caused by chronic exposure; her notebooks are still radioactive. Her enduring discipline is to respect the anomaly and to insist that quantities be consistent. In an investigation, the most valuable object in the room is often the number that refuses to match the story.","frame":"Marisz keeps her voice under the hum of the machines. \"I log the numbers everyone else signs without reading. Before I show you anything, I have to know you actually understand them — that you're not just another inspector who nods. Tell me:\"","q":[{"q":"A waste drum's measured activity has fallen to exactly half over eight days. What does that most defensibly show?","o":[{"t":"That its contents are nearly spent and safe now, since losing half its activity means most of the material's potency is gone.","v":"wrong","fb":"One halving leaves half remaining, not almost nothing — the error that releases waste too early."},{"t":"That roughly one half-life has elapsed, since a fall to half means half the nuclei decayed — about eight days of aging here.","v":"expert","fb":"A drop to one half is one half-life; the drum dates itself to ~8 days old."},{"t":"That the drum is leaking, since a steady fall in activity is what you would see as material escaped a failing seal.","v":"wrong","fb":"Activity falls because nuclei decay in place, not because material physically escapes."},{"t":"That nothing precise can be said, since radioactive decay is far too irregular for one halving to fix any age reliably.","v":"partial","fb":"Bulk decay is regular; a clean halving reads directly as one elapsed half-life, a precise clock."}]},{"q":"That drum bears a fresh sticker: 'processed 2 days ago.' How should you weigh label against decay?","o":[{"t":"Trust the label, since an official processing date is documentation and decay curves are too approximate to overturn a record.","v":"wrong","fb":"Bulk decay is precise, which is exactly what makes the date-versus-activity contradiction decisive."},{"t":"Suspect the isotope, since a mismatch this large most likely means the drum holds a different element than declared.","v":"wrong","fb":"The clash is between date and activity; the isotope can be as labeled and the date still be false."},{"t":"Trust the decay, since an eight-day-old activity profile cannot belong to two-day-old material and the date is fiction.","v":"expert","fb":"The atoms keep honest time; a rewritten date can't survive the decay curve."},{"t":"Blame transit, since time in storage and shipping naturally drives a fresh drum's reading well below its true value.","v":"wrong","fb":"Transit only causes the ordinary computable decay; it can't fake an eight-day age."}]},{"q":"For a pure radioactive sample, its activity is directly proportional to which quantity?","o":[{"t":"The sample's temperature, since warming the atoms speeds up the rate at which their nuclei disintegrate.","v":"wrong","fb":"Decay rate is set by the nucleus and is independent of temperature."},{"t":"The chemical compound it sits in, since tightly bound molecules hold their atoms together and decay more slowly.","v":"wrong","fb":"Radioactivity is nuclear; the same atoms decay at the same rate in any chemical form."},{"t":"The volume of its container, since a given activity spreads out to fill whatever space is made available to it.","v":"wrong","fb":"Activity is a property of the atoms present, not the container's size."},{"t":"The number of radioactive atoms present, since each has a fixed chance per second to decay, so more atoms mean more decays.","v":"expert","fb":"This is why a known mass of a known isotope has a predictable activity."}]}]},"sievert":{"sci":"Rolf Sievert (1896-1966)","topic":"Radiation Dose, Shielding & Biological Effect","lede":"Why the same becquerel can be harmless on a shelf and lethal in a lung.","profile":"Rolf Sievert was a Swedish medical physicist who spent his life on a single unglamorous question: how much radiation is a body actually receiving, and how much harm does it do? Born in Stockholm in 1896, he built some of the first precise dosimeters, founded radiation-protection programs, and chaired the international committee that set exposure limits. The SI unit of biological dose, the sievert, is named for him.\n\nHis work forces a distinction that trips up almost everyone. The activity of a source (becquerels, decays per second) tells you how busy the atoms are, not how dangerous they are to you. What matters biologically is the energy actually deposited in tissue per unit mass — the absorbed dose, measured in grays — and then a further weighting for how damaging that particular radiation is, giving the equivalent dose in sieverts. A gray of alpha particles delivered inside the body does far more biological damage than a gray of gamma rays, because alphas dump all their energy in a tiny track through living cells. This is why a weighting factor exists at all.\n\nTwo further distinctions are load-bearing. First, dose versus dose rate: the sievert is an accumulated quantity, while the rate (sieverts per hour) is intensity. A low rate over a long time and a high rate over a short time can give the same total dose, which is why \"the reading was only high for a moment\" is not automatically reassuring. Second, external versus internal exposure. Alpha and beta emitters that are trivially shielded outside the body — paper stops alpha, thin metal stops beta — become the most dangerous of all once inhaled or ingested, because there is no longer any shield between the source and the cells. Gamma and neutron radiation, being penetrating, dose you from outside as well.\n\nSievert also pioneered the idea that protection rests on three practical levers: time, distance, and shielding. Reduce the time in the field, increase the distance (intensity falls roughly as the inverse square), or put appropriate mass between you and the source — dense material for gamma, hydrogen-rich material for neutrons.\n\nFor an investigator, Sievert's discipline is the antidote to both panic and complacency. A badge that logs real dose in a corridor everyone calls clean is not noise; a penetrating field can deliver dose while leaving nothing on the skin to wipe off. Ask always: dose or rate, inside or outside, which radiation, and over how long.","frame":"She turns her dosimeter badge over and over. \"They keep telling us it's safe. I want to believe a real physicist over a ministry poster. So — prove to me you know what 'safe' even means:\"","q":[{"q":"A source's activity is quoted in becquerels. Why is that number alone an incomplete measure of danger to a person?","o":[{"t":"Because the becquerel already folds in the biological weighting, so it slightly overstates the hazard and must be scaled down.","v":"wrong","fb":"The becquerel is a pure count of decays per second; the weighting lives in the sievert, not in it."},{"t":"Because harm depends on the energy deposited in tissue and the radiation type, which a raw decay count does not capture.","v":"expert","fb":"Busyness of the atoms is not the same as energy delivered to cells."},{"t":"Because becquerels really measure chemical toxicity, which is a separate threat from the radiation the source emits.","v":"wrong","fb":"Becquerels are strictly a nuclear decay rate, unrelated to chemical toxicity."},{"t":"Because two sources of equal becquerels must deliver equal dose, so once you have the number it tells you everything.","v":"wrong","fb":"Equal activity can mean very unequal dose depending on radiation type and whether the source is inside the body."}]},{"q":"Why is an alpha emitter far more dangerous inhaled than merely held in the hand?","o":[{"t":"Because the moist interior of the body converts the alpha particles into penetrating gamma rays that irradiate the torso.","v":"wrong","fb":"Radiation type doesn't transmute on ingestion; the alphas stay alphas, now trapped against living cells."},{"t":"Because the lungs concentrate the radioactivity and re-emit it outward at higher intensity than the original source had.","v":"wrong","fb":"Tissue neither concentrates nor re-broadcasts radiation; the danger is short-range alphas sitting among cells."},{"t":"Because inside the body no dead skin or air gap stops the alphas, so all their energy lands in a tiny volume of living tissue.","v":"expert","fb":"Alpha's short range makes it nearly harmless outside and devastating inside."},{"t":"Because alpha is the weakest radiation, so the route into the body barely changes the modest risk that it poses.","v":"danger","fb":"The fallacy that killed the radium dial-painters; 'easily stopped' only reassures when the source stays outside."}]},{"q":"A corridor's dose-rate meter reads normal now, yet a technician's badge logged a real dose earlier. What follows?","o":[{"t":"The badge must have failed, since a dosimeter disagreeing with a calibrated area monitor is the more likely one to be wrong.","v":"wrong","fb":"The cover-up's reflex; a currently-normal rate is fully consistent with an intense field since shut off."},{"t":"The technician must be contaminated, since a badge can only register a reading if radioactive material is on the person.","v":"wrong","fb":"A penetrating external field doses badge and body with no contamination at all."},{"t":"Nothing can be said, since a badge and an area meter measure the identical quantity and so should never disagree at all.","v":"wrong","fb":"They measure different things — accumulated dose versus present intensity — and need not agree later."},{"t":"A field present earlier could have delivered a real dose, since dose accumulates over time even after a source subsides.","v":"expert","fb":"Dose is the integral of rate over time; 'it's fine now' doesn't erase what was absorbed."}]}]},"soddy":{"sci":"Frederick Soddy (1877-1956)","topic":"Isotopes, Mass Number & Nuclear Identity","lede":"Chemistry names the element; only the nucleus tells you which isotope — and the spectrum never lies.","profile":"Frederick Soddy was an English radiochemist who, working alongside Rutherford in Montreal and later on his own, gave the field two ideas without which radiation evidence is unreadable. The first was that radioactivity is transmutation: when a nucleus emits an alpha or beta particle it changes into a different element, stepping through a decay chain until it reaches a stable end. This was almost alchemical, and Soddy relished the shock of it.\n\nThe second, for which he won the 1921 Nobel Prize in Chemistry, was the isotope. Tracking decay chains, chemists kept finding species that were chemically identical yet had different radioactive behavior and different atomic weights. Soddy realized these were varieties of the same element occupying the same place in the periodic table — hence isotope, \"same place.\" We now understand it through the nucleus: the number of protons, the atomic number Z, defines the element and fixes its chemistry, while the number of neutrons can vary, changing the mass without changing the chemical identity. The mass number A is simply protons plus neutrons. Uranium always has Z = 92; uranium-235 and uranium-238 differ only in neutron count (143 versus 146) yet behave completely differently in a reactor.\n\nThe investigative payoff is sharp. Because chemistry cannot separate or distinguish isotopes, a chemical label or a shipping paper tells you the element but not necessarily which isotope, nor how active it should be. Two consignments described identically by chemistry can be radiologically worlds apart. To tell isotopes apart you need a nuclear measurement — of mass, or of the energies of the radiation emitted.\n\nThat is where gamma spectroscopy becomes decisive, and where Soddy's isotopes meet Planck's quanta. Because nuclear energy levels are quantized, each radioactive isotope emits gamma rays at its own fixed, discrete set of energies — a spectral fingerprint as specific as a signature. A detector that sorts gammas by energy produces peaks whose positions identify the emitters, regardless of what the paperwork claims. A clean peak at an energy that no declared isotope, no natural background, and no simple instrument fault can produce is not an error to be calibrated away. It is an undeclared substance announcing its own identity.\n\nSoddy later turned, more eccentrically, to economics and social criticism, but his scientific gift endures. For this case his rule is simple and unforgiving: when a label and a spectrum disagree, believe the spectrum. The nucleus is the honest witness; the sticker is only a claim.","frame":"The Archivist does not look up from the ledger. \"Papers can be forged; understanding cannot. Answer correctly and I'll let you see what the labels don't say. Get it wrong and you're just another tourist:\"","q":[{"q":"Two samples are called 'the same element.' Why does that not make them identical?","o":[{"t":"Because samples of one element always differ chemically from batch to batch, so no two are ever really the same.","v":"wrong","fb":"Isotopes of an element are chemically identical — that sameness is what fooled early chemists."},{"t":"Because they may be different isotopes: same protons and chemistry, but different neutrons, mass, and nuclear stability.","v":"expert","fb":"Chemistry fixes the element; it does not fix the nucleus."},{"t":"Because if they behaved differently they would have to be different elements, so the shared description must be mistaken.","v":"wrong","fb":"Same element, different isotope is exactly the possibility being overlooked."},{"t":"Because the only thing that can differ between them is their outward color or their physical appearance to the eye.","v":"wrong","fb":"The real difference is nuclear — neutron number, mass, half-life — not appearance."}]},{"q":"Uranium has atomic number Z = 92. How many neutrons are in a nucleus of U-235?","o":[{"t":"92, since in a stable nucleus the neutrons balance the protons one for one to keep it electrically and structurally even.","v":"wrong","fb":"That balance holds only for light nuclei; heavy ones like uranium carry many more neutrons than protons."},{"t":"235, since the mass number written after an element's name simply states how many neutrons that isotope contains.","v":"wrong","fb":"235 is protons plus neutrons together; subtract the 92 protons to get the neutrons."},{"t":"143, since the mass number 235 is protons plus neutrons, so the neutron count is 235 minus the 92 protons.","v":"expert","fb":"Mass number = protons + neutrons, giving 235 - 92 = 143."},{"t":"146, since U-235 shares the same neutron count as the far more common natural isotope uranium-238.","v":"partial","fb":"146 is U-238's neutron count; U-235 has three fewer, 143 — the very difference between them."}]},{"q":"A clean gamma peak appears where no declared isotope, background, or fault could put one. What does that indicate?","o":[{"t":"The energy axis is miscalibrated, since a single misplaced peak is the classic sign of a detector whose scale has drifted.","v":"wrong","fb":"Miscalibration shifts every peak together; it can't invent a lone line where nothing should emit."},{"t":"A weapon has been built, since an unaccounted emission at a strategic site can only point to an active weapons program.","v":"danger","fb":"An unexplained isotope is a serious lead, not proof of a weapon — the overclaim to avoid."},{"t":"The sample is legally cleared, since its accompanying paperwork governs what it may contain regardless of the spectrum.","v":"wrong","fb":"Physics, not paperwork, is speaking; the spectrum reads the nucleus directly."},{"t":"An undeclared substance is present, since a discrete peak is a characteristic emission and this one is on no manifest.","v":"expert","fb":"The nucleus announces itself; the label simply omitted it."}]}]},"aston":{"sci":"Francis Aston (1877-1945)","topic":"Nuclear Mass, Mass Spectrometry & Binding Energy","lede":"Weigh a nucleus precisely enough and its missing mass reveals where the energy is hidden.","profile":"Francis Aston was an English chemist and physicist who built the instrument that made isotopes visible and weighable: the mass spectrometer. Trained partly as a glassblower and instrument-maker, he had exactly the patient, hands-on precision the problem demanded. His device ionizes atoms, accelerates them, and bends their paths with electric and magnetic fields; because the deflection depends on mass-to-charge ratio, atoms of different mass land at different places, sorted by weight. For this he won the 1922 Nobel Prize in Chemistry.\n\nAston's measurements confirmed and quantified Soddy's isotopes. He showed that most elements are mixtures of isotopes with whole-number mass numbers, resolving why measured atomic weights were often not whole numbers — they are averages over the natural isotope mix. Mass spectrometry remains the definitive way to identify what isotopes are actually present in a sample and in what proportions, which is precisely why it matters for anyone tracking nuclear material: it reads composition directly, past any label.\n\nHis subtler discovery was the \"packing fraction,\" the small but systematic deviation of nuclear masses from exact whole numbers. A nucleus weighs slightly less than the sum of its separate protons and neutrons. That missing mass, the mass defect, is the binding energy that holds the nucleus together, released when the nucleons came together, and related to mass by Einstein's E = mc-squared. Plotting binding energy per nucleon across the periodic table gives one of the most important curves in physics: it rises steeply from hydrogen, peaks around iron, and declines toward the heaviest elements.\n\nThat single curve explains where nuclear energy comes from, in both directions. Fusing very light nuclei climbs toward the peak and releases energy; splitting very heavy nuclei like uranium also moves fragments toward the more tightly bound middle and releases energy. Iron, at the summit, is the ash of both processes — you cannot extract nuclear energy from it by either route. Aston himself foresaw, with striking prescience in a 1922 lecture, both the vast promise and the danger of unlocking this energy.\n\nFor an investigator, Aston supplies two things. First, a principle: if you want to know what a material really is, weigh its nuclei — mass spectrometry cuts through mislabeling. Second, a sense of scale: the energies bound in nuclei are millions of times those of chemical bonds, which is why a small mass of nuclear material carries strategic weight far beyond its size, and why the difference between isotopes that look chemically identical can be the difference between fuel, medicine, and something far more consequential.","frame":"\"I deal in identities — of shipments, of people. So let's establish yours,\" the Archivist says coolly. \"A genuine specialist will know how a nucleus is truly identified:\"","q":[{"q":"On what principle does a mass spectrometer separate atoms?","o":[{"t":"On their color under ultraviolet light, since each isotope is thought to fluoresce at a slightly different wavelength.","v":"wrong","fb":"That's optical spectroscopy of electrons; it can't separate isotopes, which differ in mass."},{"t":"On their chemical reactivity, since heavier isotopes are known to react measurably faster in a suitable reference solution.","v":"wrong","fb":"Chemistry cannot separate isotopes; their reactivity is essentially identical."},{"t":"On their radioactive decay rate, since the instrument times how quickly each atom disintegrates in order to identify it.","v":"wrong","fb":"Mass spectrometry measures mass directly and works on stable atoms too."},{"t":"On their mass-to-charge ratio, since after ionizing and accelerating them, fields bend lighter atoms more than heavier ones.","v":"expert","fb":"Deflection depends on mass-to-charge, sorting isotopes by weight."}]},{"q":"A nucleus weighs slightly less than its separate protons and neutrons. What is that missing mass?","o":[{"t":"A small measurement error, since instruments cannot yet weigh nuclei precisely enough to make the totals truly agree.","v":"wrong","fb":"It is a real, systematic, reproducible effect — the mass defect — not error."},{"t":"The mass of the atom's electrons, since those are not counted as part of the nucleus when the nucleons are added up.","v":"wrong","fb":"Electron mass is separate and tiny; this deficit is nuclear binding energy."},{"t":"The binding energy that holds the nucleus together, since mass and energy are interchangeable through E = mc-squared.","v":"expert","fb":"The mass defect is the binding energy — Aston's packing fraction."},{"t":"Evidence a neutron has escaped, since a nucleus lighter than its parts must have quietly shed one of its particles.","v":"wrong","fb":"No nucleons are missing; the shortfall is energy released when the nucleus formed."}]},{"q":"The binding-energy-per-nucleon curve peaks near iron. What does that peak explain?","o":[{"t":"That only fusion of light nuclei can release energy, since binding energy keeps rising toward the heaviest elements.","v":"wrong","fb":"Fission of heavy nuclei releases energy too — both move toward the peak from opposite ends."},{"t":"That iron is the most radioactive element, since sitting at the top of the curve makes it the most prone to decay.","v":"wrong","fb":"Iron is the most tightly bound and among the most stable — that's why no energy comes from it."},{"t":"That energy can be pulled from iron by fission or fusion, since it holds more binding energy than any other element.","v":"wrong","fb":"Iron sits at the summit; neither splitting nor fusing it releases energy."},{"t":"That both fusing light nuclei and splitting heavy ones release energy, since each drives fragments toward the bound middle.","v":"expert","fb":"One curve, two slopes; iron is the ash of both."}]}]},"geiger":{"sci":"Hans Geiger (1882-1945)","topic":"Detectors, Counting Statistics & Calibration","lede":"Every reading is a count with error bars — and every count needs a calibrated instrument.","profile":"Hans Geiger was the German experimental physicist whose name rides on the most recognizable instrument in radiation science. Working under Rutherford, he was the hands behind the gold-foil scattering counts, learning to register individual particles one at a time. With Walther Muller he later perfected the Geiger-Muller tube, a gas-filled detector in which a single ionizing particle triggers a cascade — an avalanche of ionization — producing an electrical pulse loud enough to click in a speaker.\n\nThe Geiger counter teaches how detectors actually work. Radiation ionizes the gas; a high voltage multiplies the freed charges into a measurable pulse. Crucially, a G-M tube has an operating plateau: a voltage range over which the count rate is nearly independent of small voltage changes. Operating on that plateau is what makes readings reproducible. It also has a dead time — a brief interval after each pulse when it is blind — so at high rates it undercounts, and the raw number must be corrected. A detector is not a truth oracle; it is an instrument with a response function that must be understood.\n\nGeiger's deeper lesson is statistical. Radioactive decay is random: each nucleus has a fixed probability per unit time of decaying, but you cannot predict which or when. Counts therefore follow Poisson statistics. If you record N counts, the typical fluctuation is about the square root of N. Count 100 and the uncertainty is roughly 10, or ten percent; count 10,000 and it is about 100, or one percent. To halve your uncertainty you must count four times as long. This is why a brief measurement of a weak source is noisy, and why claims must respect their error bars.\n\nCalibration ties it together. An instrument must be checked against a known reference source so that its readings map correctly to activity or dose, and its background — the ever-present count from cosmic rays and natural radioactivity — must be measured and subtracted. A reading is only meaningful as a signal above a known background, with a known efficiency, on a properly calibrated device.\n\nThis is where the honest science and the cover story collide. \"The detector just needs recalibration\" is sometimes true and sometimes a way to make an inconvenient signal disappear. The discipline is to ask: was the instrument on its plateau, was the background measured, is the count statistically significant, and does recalibration explain a broadband drift — or is someone tuning the instrument until a real, sharp signal stops being reported? Geiger's counting is the grammar of every radiation claim in this case.","frame":"Teodor grins but his eyes are hard. \"I don't move information for amateurs. You want what I've hauled and where? First show me you'd even understand a detector's reading:\"","q":[{"q":"You record 100 counts from a source. What is the approximate statistical uncertainty on that number?","o":[{"t":"Zero, since a count is a direct tally of events and a directly counted whole number carries no uncertainty of its own.","v":"wrong","fb":"Decay is random, so any finite count fluctuates by about the square root of N — here roughly 10."},{"t":"About 100, since in a fully random process the uncertainty is as large as the very quantity you are trying to measure.","v":"wrong","fb":"That would make measurement useless; the fluctuation is root-N, about 10, not N."},{"t":"About 50, since measurements of random events are generally reliable only to within about half of their stated value.","v":"wrong","fb":"No such rule; the Poisson uncertainty here is root-100, which is 10."},{"t":"About 10, since radioactive counts follow Poisson statistics where the typical fluctuation is the square root of the total.","v":"expert","fb":"Root-100 is 10, or about ten percent."}]},{"q":"To halve the statistical uncertainty of a count rate, what must you do?","o":[{"t":"Raise the detector voltage, since larger and cleaner pulses reduce the scatter and tighten up the recorded count.","v":"wrong","fb":"Voltage sets the operating point, not statistical precision — that comes only from more counts."},{"t":"Move the source much closer, since the resulting higher count rate directly improves the statistical accuracy of the reading.","v":"wrong","fb":"A higher rate gathers counts faster, but precision depends on total counts, not the rate."},{"t":"Count for about four times as long, since uncertainty falls as one over the square root of N, so 4x the counts halves it.","v":"expert","fb":"Root-N scaling: four times the counts, half the uncertainty."},{"t":"Count for exactly twice as long, since doubling the counting time straightforwardly doubles the precision of the result.","v":"partial","fb":"Doubling counts improves precision only ~30 percent; you need four times as many to halve it."}]},{"q":"'The detector just needs recalibration' is a legitimate explanation — except when?","o":[{"t":"Except when the instrument was ever calibrated before, since a once-calibrated detector should not be able to drift again.","v":"wrong","fb":"Prior calibration doesn't prevent drift; recalibration can be perfectly genuine."},{"t":"Except when the technician offering it is friendly and cooperative, since a helpful manner suggests an honest account.","v":"wrong","fb":"Rapport has no bearing on whether the physics of the claim holds up."},{"t":"Except when it is used to erase a sharp, reproducible signal, since a smooth calibration drift can't create a discrete peak.","v":"expert","fb":"Recalibration explains broadband drift, not a real line — that's the tell."},{"t":"Except when the detector was imported rather than built domestically, since foreign instruments are inherently less reliable.","v":"wrong","fb":"Where an instrument was built doesn't determine whether recalibration is valid."}]}]},"roentgen":{"sci":"Wilhelm Röntgen (1845-1923)","topic":"X-Rays & the Physics of Detection","lede":"A stray glow across a darkened lab announced a radiation that sees through flesh.","profile":"Wilhelm Röntgen was a meticulous German experimentalist who, in November 1895, noticed something impossible: a screen coated in fluorescent material glowing faintly across his darkened laboratory while a shrouded cathode-ray tube ran nearby. Nothing visible should have reached it. Rather than dismiss the glow, he chased it for weeks in near-seclusion, and found an invisible, penetrating radiation he called X-rays — X for the unknown. Within days he had photographed the bones of his wife's hand, and the world had its first look inside a living body. He received the very first Nobel Prize in Physics, in 1901.\n\nX-rays are high-energy electromagnetic radiation — photons far more energetic than visible light — produced when fast electrons slam into a target and decelerate abruptly. Because their wavelength is comparable to atomic spacings and their energy is high, they pass through soft tissue while being absorbed more strongly by dense material like bone and metal. That differential absorption is the whole basis of radiography: an X-ray image is a shadow map of what stops the rays and what lets them through.\n\nRöntgen's discovery matters here for two reasons beyond medicine. First, it is the archetype of detection physics: an unexpected signal, taken seriously, reveals a new penetrating radiation, and the instrument that catches it — a fluorescent screen, a photographic plate, later an electronic detector — becomes a way to see the invisible. Every radiation monitor in this case descends from that lineage. Second, X-rays sit on the same electromagnetic spectrum as gamma rays; the practical distinction is origin, not nature: X-rays come from electron transitions and decelerations in the electron cloud, gamma rays from the nucleus. Confusing where a photon comes from — electron shell versus nucleus — is a classic way to misread a spectrum.\n\nRöntgen refused to patent his discovery, insisting it belonged to humanity, and lived to see it transform medicine and, less happily, to see early workers injured by careless exposure before dose was understood. For an investigator his lesson is Becquerel's twin: the decisive clue is often a faint anomaly at the edge of an experiment that everyone else would have wiped away. Detection begins with taking the unexpected glow seriously.","frame":"\"Everything that crosses my route gets scanned,\" Teodor says. \"Half the guards don't know what the machines are seeing. Do you? Prove it and we'll talk:\"","q":[{"q":"How is a radiographic X-ray image formed?","o":[{"t":"By the body glowing under the X-rays, since living tissue fluoresces brightly enough to be photographed directly onto film.","v":"wrong","fb":"The image is a transmission shadow, not the body's own glow; contrast is differential absorption."},{"t":"By reflection, since the X-rays bounce off internal surfaces much as light reflects from a mirror and return an image.","v":"wrong","fb":"Radiography works by transmission and absorption, not reflection."},{"t":"By differential absorption, since dense material like bone stops more X-rays than soft tissue, casting a shadow on the detector.","v":"expert","fb":"An X-ray image is a shadow map of what stops the rays."},{"t":"By heat, since the warmer regions of the body emit more X-rays of their own that the film gradually records over time.","v":"wrong","fb":"The X-rays come from the tube and pass through; the body's warmth doesn't emit them."}]},{"q":"X-rays and gamma rays are both energetic electromagnetic radiation. What actually distinguishes them?","o":[{"t":"Their speed, since gamma rays are more energetic and therefore travel measurably faster than X-rays through matter.","v":"wrong","fb":"Both are electromagnetic radiation at light speed; speed is not the distinction."},{"t":"Their charge, since X-rays carry a small positive charge on each photon that gamma-ray photons happen to lack.","v":"wrong","fb":"Both are uncharged photons; neither carries charge."},{"t":"Their origin, since X-rays come from electrons in the outer cloud while gamma rays are emitted from the nucleus itself.","v":"expert","fb":"The distinction is source — electron shell versus nucleus — not their nature."},{"t":"Their obedience to physics, since gamma rays are nuclear and so follow entirely different laws than X-rays do.","v":"wrong","fb":"Both are photons obeying the same electromagnetic laws; only their origin differs."}]},{"q":"Why do X-rays pass through soft tissue but stop more in bone and metal?","o":[{"t":"Because soft tissue is chemically inert to X-rays while bone actively reacts with and neutralizes the incoming beam.","v":"wrong","fb":"It's not chemistry; absorption depends on density and atomic number, not reactivity."},{"t":"Because bone is faintly radioactive and emits its own rays that collide with and block the incoming X-rays.","v":"wrong","fb":"Bone isn't radioactive; it simply absorbs more of the incident X-rays than soft tissue."},{"t":"Because metal is magnetic and its field deflects the charged X-ray beam sideways away from the recording film.","v":"wrong","fb":"X-rays are uncharged photons unaffected by magnetism; the effect is absorption by dense material."},{"t":"Because denser, higher-atomic-number material absorbs more of the penetrating photons while low-density tissue lets most pass.","v":"expert","fb":"Denser, heavier-element material stops more radiation — the basis of contrast."}]}]},"fermi":{"sci":"Enrico Fermi (1901-1954)","topic":"Fission, Chain Reactions & Reactor Physics","lede":"Slow the neutrons, count them carefully, and a controlled fire tends itself.","profile":"Enrico Fermi was that rare physicist supreme in both theory and experiment. Born in Rome in 1901, he fled Fascist Italy after collecting his 1938 Nobel Prize and, four years later, built the first self-sustaining nuclear chain reaction under the stands of a Chicago football stadium. His name marks the physics of the reactor.\n\nFermi's key early discovery was counterintuitive: neutrons that had been slowed down were far more effective at inducing nuclear reactions than fast ones. Bombarding elements through paraffin or water, he found the light hydrogen nuclei slowed the neutrons by collisions, and these slow, or thermal, neutrons were much more readily captured. In uranium-235 a thermal neutron is far more likely to cause fission than a fast one, because the fission cross-section rises steeply as neutron energy falls. Slowing a projectile to make it more effective is the heart of reactor design.\n\nFission itself splits a heavy nucleus into fragments, releasing energy and — crucially — two or three new neutrons. If, on average, at least one of those neutrons goes on to cause another fission, the reaction sustains itself: a chain reaction. The average number of fissions caused by each generation is the multiplication factor k. When k equals one the reactor is critical and steady; below one it dies away; above one it grows. The entire art of reactor operation is holding k at one.\n\nThree distinct components make this possible, and confusing them is the classic error. The moderator (graphite or water) slows neutrons so U-235 will fission them. The control rods (cadmium or boron, strong neutron absorbers) are inserted or withdrawn to soak up neutrons and throttle the chain. The coolant carries away the heat, so the core does not destroy itself. In many designs water is both moderator and coolant, but the roles are separate: slowing, absorbing, cooling. A reactor is not a slow bomb; it is a controlled, self-limiting balance.\n\nFermi's neutrons also, unavoidably, activate the materials around them, and this is where reactor physics meets the investigation. Ordinary medical-isotope work irradiates small targets briefly. But conditioning materials in a sustained, engineered neutron flux — producing heavily activated coupons or breeding new elements — is a very different scale of neutron work, and it points to purposes beyond making a diagnostic tracer.\n\nFermi was famous for extracting the essential number from minimal data, the \"Fermi estimate.\" His discipline for this case: ask what the neutrons are doing, at what scale, and to what materials. The neutrons don't care about the cover story; their flux and their products reveal what the reactor is really for.","frame":"On the reactor floor Marisz finally relaxes a little; this is her world. \"Anyone can wave a badge. But if you understand my reactor, you'll understand what I'm frightened of. Humor me:\"","q":[{"q":"Why does slowing neutrons make U-235 more likely to fission?","o":[{"t":"Because slow neutrons become denser as they lose speed and so strike the target nucleus with considerably greater force.","v":"wrong","fb":"Neutrons don't change density; the mechanism is capture probability, not impact force."},{"t":"Because slowing them increases their number, and a larger population of neutrons simply causes proportionally more fissions.","v":"partial","fb":"Number sustains a chain, but slowing changes each neutron's capture probability, which is the key effect."},{"t":"Because fast neutrons overshoot the nucleus entirely, while any neutron that has been slowed down is certain to be caught.","v":"wrong","fb":"It's a probability rising as energy falls, not overshooting or guaranteed capture."},{"t":"Because the fission cross-section climbs steeply as neutron energy falls, so a slow neutron lingers and is far more readily caught.","v":"expert","fb":"Fermi's slow-neutron insight — the reason moderators exist."}]},{"q":"Match the three reactor components to their jobs.","o":[{"t":"Control rods slow the neutrons, the moderator absorbs them, and the coolant supplies fresh neutrons to keep the chain going.","v":"wrong","fb":"Scrambled: rods absorb, the moderator slows, and nothing 'supplies' neutrons — the chain does."},{"t":"All three components absorb neutrons, and it is only the choice of material that distinguishes how each of them behaves.","v":"wrong","fb":"Only the rods absorb; the moderator slows and the coolant removes heat."},{"t":"The moderator and rods both slow the neutrons down, while the coolant alone does anything at all to the chain reaction.","v":"partial","fb":"Coolant cooling is right, but moderator and rods do opposite jobs — slowing versus absorbing."},{"t":"The moderator slows the neutrons, the control rods absorb them to throttle the chain, and the coolant carries off the heat.","v":"expert","fb":"Three distinct roles — the trio most people conflate."}]},{"q":"A metal coupon shows heavy neutron activation far beyond a diagnostic tracer target. What does that suggest?","o":[{"t":"Nothing unusual at all, since every research reactor trivially activates nearby materials to about this degree as routine.","v":"wrong","fb":"Heavy, deliberate activation isn't the light irradiation a tracer needs — the scale is the signal."},{"t":"Conclusive proof of a nuclear weapon, since activation this heavy at a secret site can only point to weapons work.","v":"danger","fb":"It points to serious neutron work, but by itself is not a weapon — the overclaim to resist."},{"t":"Surface contamination, since the coupon has simply picked up loose radioactive dust from around the reactor hall.","v":"wrong","fb":"Bulk activation is transmutation of the coupon's own atoms, not dust to be wiped off."},{"t":"Sustained, engineered neutron conditioning, since the depth of activation points to purposeful work beyond making a tracer.","v":"expert","fb":"The scale of activation reveals a purpose beyond routine isotope production."}]}]},"chadwick":{"sci":"James Chadwick (1891-1974)","topic":"The Neutron, Activation & Nuclear Reactions","lede":"A particle with no charge slips into the nucleus and rewrites the material from the inside.","profile":"James Chadwick discovered the neutron in 1932, the missing piece that made the modern nucleus comprehensible and opened the door to nuclear energy. A student of Rutherford, interned in Germany during the First World War, he spent years chasing the evidence for a neutral nuclear particle before a few intense weeks of experiment clinched it. The neutron's defining property is its lack of electric charge, and almost everything important follows from that one fact.\n\nCharged particles — alphas, betas, protons — are pushed and pulled by the electric fields of the electrons and nuclei they pass, so they interact strongly, lose energy fast, and travel only short distances. A neutron feels no such barrier. It ignores electron clouds and is unrepelled by a nucleus's positive charge until it makes a direct, close encounter. This is why neutrons are so penetrating, and why, paradoxically, they are among the hardest radiations to shield: you stop them not with dense metal but with hydrogen-rich material such as water or plastic, which slows them by collisions.\n\nThe neutron's neutrality also lets it enter and transform a nucleus. A charged projectile must overcome electrical repulsion to reach a nucleus; a neutron can simply be absorbed. When a nucleus captures a neutron it becomes a heavier isotope, often unstable, which then decays and emits radiation. This is neutron activation, and distinguishing it from contamination is one of the most important skills in radiation forensics.\n\nContamination means radioactive material has been physically deposited on or in an object — dust, residue, a spill. The object is dirty on the surface and can, in principle, be cleaned; the radioactivity is foreign material sitting on it. Activation is categorically different: the object's own atoms have been transmuted by neutron capture, so it is radioactive through and through, from within its bulk, and no amount of wiping will clean it because nothing was deposited. A structural metal coupon that was verified non-radioactive, then later emits gamma rays from its bulk, has been activated — and activation is possible only where neutrons have been present. Finding activation is finding evidence of a neutron source.\n\nNeutrons also carry a human cost. Because they deposit energy efficiently in tissue by knocking recoil protons out of the body's hydrogen, a neutron field can deliver a serious dose while leaving no contamination on the skin. A badge that logs dose in a corridor with nothing to wipe off may be recording exactly such a field.\n\nChadwick led the British mission to the Manhattan Project. For this case his neutron is the quiet key: it explains penetrating dose without contamination, activated materials that betray a hidden flux, and the whole distinction between something spilled and something transmuted.","frame":"She lowers her voice to almost nothing. \"The neutrons are the part no one will discuss with me. If you're the specialist you claim, you can tell me what I've been too afraid to ask aloud:\"","q":[{"q":"Why is the neutron so penetrating and hard to shield?","o":[{"t":"Because it is the heaviest of the common particles and simply drives through ordinary matter on the strength of its momentum.","v":"wrong","fb":"Penetration comes from its lack of charge, not its mass; a heavy charged particle stops quickly."},{"t":"Because it carries a strong positive charge that pushes the surrounding matter aside as it travels deeper and deeper in.","v":"wrong","fb":"The neutron is uncharged — that neutrality is the whole reason it penetrates."},{"t":"Because it is in fact easily stopped by a thin metal sheet, so shielding neutrons is really quite straightforward to do.","v":"wrong","fb":"Thin metal stops beta; neutrons need hydrogenous material to slow them by collisions."},{"t":"Because, having no charge, it is neither repelled nor slowed by electric fields and passes freely until a direct nuclear hit.","v":"expert","fb":"Chargelessness is the neutron's superpower and its shielding headache."}]},{"q":"A previously non-radioactive metal coupon now emits gamma rays from its bulk. What has happened?","o":[{"t":"Surface contamination, since radioactive residue has settled onto the coupon and could in principle be cleaned back off.","v":"wrong","fb":"Contamination sits on the surface; this comes from the bulk, which only transmutation explains."},{"t":"A faulty first reading, since the coupon was probably slightly radioactive all along and the 'before' measurement missed it.","v":"wrong","fb":"Discarding a verified 'before' to save a story is the cover-up move; clean-then-active means activation."},{"t":"Neutron activation, since its own atoms captured neutrons and became radioactive, proving a neutron source was present.","v":"expert","fb":"Bulk radioactivity from a once-clean object means activation."},{"t":"Ordinary corrosion, since the slow chemical breakdown of the metal over time is what releases the gamma radiation.","v":"wrong","fb":"Corrosion is chemical; gamma emission from the bulk is a nuclear transmutation."}]},{"q":"How can a person receive a real dose in a corridor with no contamination on them?","o":[{"t":"They cannot, since without any radioactive material actually on the body there is simply nothing there to deliver a dose.","v":"wrong","fb":"The badge-fault fallacy — a penetrating external field doses the body with nothing on the skin."},{"t":"Only by swallowing radioactive dust, since ingestion is the one and only way to be dosed without visible contamination.","v":"wrong","fb":"Ingestion is one route, but an external neutron or gamma field needs no intake at all."},{"t":"By touching a warm surface, since heat conducted into the body from hot equipment registers on a badge as a radiation dose.","v":"wrong","fb":"Thermal heat is not ionizing radiation; a dose reflects radiation energy, not warmth."},{"t":"By a penetrating field, especially neutrons, which deposit energy in tissue via recoil protons and leave nothing removable.","v":"expert","fb":"Dose without contamination is the neutron signature."}]}]},"seaborg":{"sci":"Glenn Seaborg (1912-1999)","topic":"Plutonium, the Actinides & Nuclear Chemistry","lede":"Feed a reactor's neutrons to uranium and you breed new elements that never existed on Earth.","profile":"Glenn Seaborg was an American nuclear chemist who discovered or co-discovered ten elements — more than anyone in history — and reshaped the periodic table itself. Born in Michigan in 1912, he spent his career at Berkeley, won the 1951 Nobel Prize in Chemistry, and is one of the few people to have an element named for him in his lifetime: seaborgium. His work is the chemistry of the heaviest elements and, inescapably, of the nuclear age.\n\nHis most consequential discovery was plutonium, in 1941. Plutonium does not occur in nature in any meaningful quantity; it is bred. When uranium-238 — the abundant, non-fissile isotope — captures a neutron in a reactor, it transmutes through a short decay chain into plutonium-239, which is fissile. This is the profound fact of reactor chemistry: a reactor running on ordinary uranium slowly manufactures a new fissile element in its fuel. Seaborg's team learned to separate this plutonium chemically from the intensely radioactive spent fuel, working at first with quantities too small to see.\n\nSeaborg also solved a puzzle that had defeated others: where the heavy elements belong in the periodic table. He proposed the actinide concept, recognizing that thorium, uranium, plutonium and their neighbors form a distinct series in which a particular electron shell is filling, analogous to the rare-earth lanthanides. This reorganized the bottom of the periodic table into the form used today and correctly predicted the chemistry of elements not yet discovered.\n\nThe investigative significance is direct. Different isotopes and elements of the actinides have sharply different uses and hazards, and telling them apart is nuclear chemistry, not guesswork. The presence of plutonium where only uranium was declared, or of specific activation and fission products, is a chemical and radiological fingerprint of what a reactor has actually been doing. Reprocessing — chemically separating plutonium or other products from irradiated fuel — leaves detectable traces and is one of the most sensitive activities in the nuclear world, because it is the bridge between civilian reactors and weapons-usable material.\n\nSeaborg was also a statesman of science, advising presidents and signing the Franck Report and later arms-control efforts, keenly aware that the elements he discovered carried both promise and peril. For this case his discipline is the chemist's: identify the actual species present and ask how they got there. A reactor's neutron flux plus its chemistry write a record in the materials — bred elements, activation products, separation residues — that no relabeling can fully erase.","frame":"The Archivist taps a requisition. \"I know who signs for what. Whether you understand what they're signing for is the question. Convince me:\"","q":[{"q":"How is plutonium-239 produced?","o":[{"t":"It is mined directly from natural ore, since plutonium occurs in usable trace amounts within ordinary uranium deposits.","v":"wrong","fb":"Plutonium doesn't occur in meaningful natural quantities; it is bred in reactors."},{"t":"It is synthesized chemically, since combining purified uranium with the right plutonium-bearing reagents yields the element.","v":"wrong","fb":"Making a new element is a nuclear transmutation, not a chemical combination."},{"t":"It forms on cooling, since chilling uranium to cryogenic temperatures eventually converts its structure into plutonium.","v":"wrong","fb":"Temperature doesn't transmute nuclei; only neutron capture and decay yield plutonium."},{"t":"Uranium-238 captures a neutron in a reactor and transmutes through a short decay chain into fissile plutonium-239.","v":"expert","fb":"Plutonium is bred from U-238, not mined or made chemically."}]},{"q":"Why is a reactor running on ordinary uranium significant beyond producing power?","o":[{"t":"Because its neutron flux gradually converts the fuel into ordinary iron, steadily depleting the uranium that was loaded.","v":"wrong","fb":"Neutron capture on U-238 leads up to plutonium, not down to iron."},{"t":"Because it destroys all the radioactivity in the fuel over time, leaving the spent fuel inert and comparatively safe.","v":"wrong","fb":"The opposite: spent fuel is intensely radioactive and holds bred plutonium."},{"t":"Because it does nothing further of note, since once its fuel has fissioned it is chemically and nuclearly quite finished.","v":"wrong","fb":"Spent fuel holds newly bred plutonium, which is exactly why it is sensitive."},{"t":"Because its neutron flux slowly breeds fissile plutonium inside the fuel, which can afterward be chemically separated out.","v":"expert","fb":"That breeding is the bridge to weapons-usable material."}]},{"q":"Finding plutonium where only uranium was declared is significant because it is:","o":[{"t":"Chemically indistinguishable from uranium, and therefore not actually reliable as evidence that anything is amiss here.","v":"wrong","fb":"Plutonium is a distinct element with its own signature; it points to undeclared activity."},{"t":"Almost certainly an innocent labeling slip, since an entire element can end up on a manifest through simple clerical error.","v":"wrong","fb":"A whole undeclared element doesn't arise from a slip; it points to deliberate work."},{"t":"Evidence of a chemical spill on site, since spilled compounds are what usually turn up unexpectedly in facility samples.","v":"wrong","fb":"Plutonium's presence is a nuclear signature — bred by neutrons and separated — not a spill."},{"t":"A radiological and chemical fingerprint of undeclared reactor activity, whether the breeding of plutonium or its reprocessing.","v":"expert","fb":"The species present, and how it arose, betrays the operation."}]}]},"meitner":{"sci":"Lise Meitner (1878-1968)","topic":"Fission Energy, Mass-Energy & the Ethics of Discovery","lede":"She named the splitting of the atom — and was written out of the prize for it.","profile":"Lise Meitner was an Austrian-Swedish physicist whose career is both a triumph of insight and a parable about credit, secrecy, and power. Born in Vienna in 1878, she became the first woman to hold a full physics professorship in Germany, working for three decades with the chemist Otto Hahn. As a Jew in Nazi Germany she was forced to flee in 1938, escaping to Sweden with almost nothing, while Hahn continued the experiments they had designed together.\n\nThat winter Hahn sent her a puzzle by letter: bombarding uranium with neutrons produced barium, an element little more than half uranium's weight. To the chemists it made no sense. Meitner, walking in the snow with her nephew Otto Frisch, worked it out. The uranium nucleus, she realized, could behave like a wobbling drop of liquid, its charge straining against the surface tension holding it together, until it split into two. She and Frisch calculated the energy released using Einstein's mass-energy relation: the fragments weighed slightly less than the original nucleus, and that missing mass reappeared as a large burst of kinetic energy. They named the process fission, borrowing the biologists' word for a dividing cell.\n\nThis was one of the most important calculations of the century, and it was hers. Yet the 1944 Nobel Prize in Chemistry went to Hahn alone — a famous injustice, compounded by the politics of exile and the secrecy of the wartime bomb project she refused to

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnosis: Five Causal Logic Games</title><style>
:root{--bg:#07121d;--panel:#10283b;--line:#385b70;--text:#eef7fb;--muted:#afc2cd;--blue:#70c9f2;--gold:#efca72;--green:#78d69a;--red:#ff9292;--orange:#f0ad67;--shadow:0 22px 68px rgba(0,0,0,.36)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 12% 0%,rgba(47,116,164,.28),transparent 31%),radial-gradient(circle at 90% 8%,rgba(239,173,103,.10),transparent 23%),linear-gradient(180deg,#05101a,#0a1f30 52%,#05101a)}button{font:inherit}.wrap{max-width:1440px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}.brand{display:flex;gap:11px;align-items:center}.patch{width:52px;height:52px;border-radius:15px;border:2px solid var(--gold);background:#173e59;display:grid;place-items:center;font-weight:900;font-size:15px;text-align:center}.brand h1{margin:0;font-size:21px}.brand small{color:var(--muted)}.btn{border:1px solid var(--line);background:#17354d;color:var(--text);padding:9px 13px;border-radius:9px;cursor:pointer}.btn:hover{background:#224b68}.btn.primary{background:#2e77a4;border-color:#4d95bf;font-weight:800}.panel{background:rgba(13,34,51,.98);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}.hero,.game{padding:32px 36px}.hero h2,.gamehead h2{font-size:clamp(38px,6.6vw,66px);line-height:1;letter-spacing:-.04em;margin:9px 0 15px}.hero p{font-size:17px;line-height:1.68;color:#d8e7ef;max-width:870px}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--gold);font-weight:900}.storybox,.warning,.feedback,.tip,.rule,.casebox{padding:14px 16px;border-radius:10px;line-height:1.55;margin:15px 0}.storybox{border-left:4px solid var(--gold);background:rgba(239,202,114,.08)}.warning{border-left:4px solid var(--orange);background:rgba(240,173,103,.08)}.tip,.casebox{border-left:4px solid var(--blue);background:rgba(112,201,242,.08)}.feedback{display:none}.feedback.show{display:block}.feedback.bad{border-left:4px solid var(--red);background:rgba(255,146,146,.08)}.feedback.good{border-left:4px solid var(--green);background:rgba(120,214,154,.08)}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.gamehead{display:flex;justify-content:space-between;gap:18px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}.gamehead h2{font-size:38px}.gamehead p{margin:0;color:var(--muted);line-height:1.5;max-width:760px}.stage{border:1px solid var(--line);border-radius:999px;padding:8px 11px;background:#17354d;font-size:12px;white-space:nowrap}.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.homecard{border:1px solid var(--line);background:#10283b;border-radius:16px;padding:21px;cursor:pointer;box-shadow:var(--shadow)}.homecard:hover{border-color:var(--blue);transform:translateY(-2px)}.homecard .icon{width:46px;height:46px;border:2px solid var(--gold);border-radius:13px;display:grid;place-items:center;font-weight:900;background:#173e59}.homecard .discipline{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--blue);font-weight:900;margin-top:12px}.homecard h3{font-size:25px;margin:6px 0}.homecard p{color:var(--muted);line-height:1.45}.primer{border:1px solid var(--line);background:#0b2132;border-radius:14px;padding:15px;margin:0 0 18px}.primer-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:11px}.primer-head h3{margin:0;color:var(--gold);font-size:18px}.primer-head span{color:var(--muted);font-size:12px}.primer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.concept{border:1px solid #315267;background:#122c40;border-radius:10px;padding:12px}.concept strong{display:block;color:var(--blue);margin-bottom:5px}.concept p{margin:0;color:#d4e2e9;font-size:13px;line-height:1.48}
.sensor-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.sensor{border:1px solid var(--line);background:#112b3f;border-radius:11px;padding:13px}.sensor .label{font-size:9px;text-transform:uppercase;letter-spacing:.11em;color:var(--blue);font-weight:900}.sensor .value{font-size:22px;font-weight:900;margin:6px 0}.sensor small{display:block;color:var(--muted);line-height:1.4}.sensor .meaning{border-top:1px solid #315166;margin-top:9px;padding-top:8px;color:#d4e2e9;font-size:12px;line-height:1.45}.sensor .meaning strong{color:var(--gold)}.high{color:var(--red)}.low{color:var(--orange)}.normal{color:var(--green)}.rules{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.rule{border:1px solid var(--line);background:#112b3f;margin:0}.rule strong{color:var(--blue)}.rule small{display:block;color:var(--muted);margin-top:5px;line-height:1.42}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.choice{border:1px solid var(--line);background:#17354d;border-radius:11px;padding:13px;cursor:pointer}.choice:hover{border-color:#6992aa}.choice.selected{outline:2px solid var(--gold);background:#214b66}.choice .tag{font-size:9px;text-transform:uppercase;letter-spacing:.11em;color:var(--blue);font-weight:900}.choice strong{display:block;margin:5px 0}.choice small{display:block;color:var(--muted);line-height:1.42}.diagnosis-layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px;align-items:start}.evidence-pane{min-width:0}.choice-sidebar{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;border:1px solid var(--line);background:#0b2132;border-radius:15px;padding:15px;scrollbar-width:thin}.choice-sidebar h3{margin:3px 0 9px;font-size:15px;color:var(--blue)}.choice-sidebar .choice-grid{grid-template-columns:1fr;gap:8px;margin:0 0 15px}.choice-sidebar .choice{padding:11px}.choice-sidebar .choice strong{font-size:14px;line-height:1.3}.choice-sidebar .choice small{font-size:12px;line-height:1.42}.choice-sidebar .choice small:before{content:'In plain language: ';color:var(--gold);font-weight:800}.choice-sidebar .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.choice-sidebar .controls .primary{grid-column:1/-1}.choice-sidebar .btn{width:100%;padding:9px 8px}.choice-sidebar .feedback{margin:12px 0 0;font-size:13px}.sidebar-title{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:11px;padding-bottom:10px;border-bottom:1px solid var(--line)}.sidebar-title strong{font-size:16px}.selection-summary{font-size:11px;color:var(--muted);line-height:1.4}.chain{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:center;margin:19px 0}.chainbox{border:1px solid var(--line);background:#112b3f;border-radius:11px;padding:14px;text-align:center;min-height:110px;display:grid;place-items:center}.arrow{font-size:23px;color:var(--gold);font-weight:900}.review{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}.review-item{border:1px solid var(--line);background:#112b3f;border-radius:11px;padding:13px}.review-item h3{margin:0 0 6px;color:var(--blue);font-size:16px}.review-item p{margin:0;color:var(--muted);line-height:1.5}@media(max-width:1050px){.primer-grid{grid-template-columns:1fr}.diagnosis-layout{grid-template-columns:1fr}.choice-sidebar{position:static;max-height:none;overflow:visible}.choice-sidebar .choice-grid{grid-template-columns:1fr 1fr}.sensor-grid{grid-template-columns:1fr 1fr}.rules,.review,.homegrid{grid-template-columns:1fr}}@media(max-width:650px){.wrap{padding:11px}.hero,.game{padding:20px}.gamehead{flex-direction:column}.sensor-grid,.choice-grid,.choice-sidebar .choice-grid{grid-template-columns:1fr}.choice-sidebar .controls{grid-template-columns:1fr}.choice-sidebar .controls .primary{grid-column:auto}.chain{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}
</style></head><body><div class="wrap"><div class="top"><div class="brand"><div id="patch" class="patch">Dx</div><div><h1 id="brandTitle">Diagnosis</h1><small id="brandSub">Five causal logic games</small></div></div><button class="btn" onclick="goHome()">Case library</button></div><div id="app"></div></div><script>
const CASES=[{"id": "medicine", "icon": "ER", "title": "The Deep-Breathing Case", "discipline": "Emergency medicine", "kicker": "Fictional emergency department · 6:20 p.m.", "headline": "The breathing looks dramatic. The oxygen level is normal.", "brief": ["A 19-year-old arrives with thirst, nausea, abdominal pain, and unusually deep, rapid breathing. Her insulin pump was found disconnected after a day of feeling ill.", "The team must decide whether the breathing problem begins in the lungs or is the body’s response to a chemical disturbance in the blood."], "update": "She is alert, breathing deeply at 30 breaths per minute, and has no wheeze. Blood pressure is 112/70 mmHg.", "readings": [["Blood glucose", "412 mg/dL", "high", "Markedly elevated", "The concentration of sugar in the blood. A very high value suggests glucose is not being used or controlled normally."], ["Blood pH", "7.18", "low", "Acidic", "A scale of how acidic or alkaline the blood is. About 7.4 is normal; 7.18 means the blood is dangerously acidic."], ["Bicarbonate", "11 mmol/L", "low", "Low buffering reserve", "A major chemical buffer in blood. It is consumed while neutralizing acid, so a low value supports metabolic acidosis."], ["Blood ketones", "5.8 mmol/L", "high", "Markedly elevated", "Acidic chemicals made when the body burns fat rapidly. A high value points toward severe insulin deficiency."], ["Respiratory rate", "30/min", "high", "Deep, regular breaths", "How many breaths occur each minute. Deep, rapid breathing can be compensation for metabolic acidosis."], ["Oxygen saturation", "98%", "normal", "Normal", "The percentage of hemoglobin carrying oxygen. A normal value argues against severe failure to move oxygen through the lungs."], ["Temperature", "98.9°F", "normal", "No fever", "A fever can support infection. A normal temperature does not rule infection out, but it weakens it in this pattern."], ["Lactate", "1.4 mmol/L", "normal", "Not elevated", "A chemical that often rises when tissues are poorly perfused or severely stressed. A normal value weakens lactic acidosis."]], "rules": [["Severe insulin deficiency makes the body break down fat for fuel.", "That produces ketone acids and can lower pH and bicarbonate."], ["Metabolic acidosis can trigger deep, rapid breathing.", "The lungs remove carbon dioxide, partially compensating for excess acid."], ["Septic shock often raises lactate when tissues are poorly perfused.", "Fever, hypotension, or elevated lactate would strengthen that explanation."], ["Opioid toxicity suppresses breathing.", "It tends to cause slow or shallow breathing, not deep compensation."], ["Asthma narrows the airways.", "It more naturally produces wheeze and airflow obstruction, not high ketones."], ["Normal values matter.", "Normal oxygen, temperature, and lactate weaken several rivals."]], "causes": [["dka", "Diabetic ketoacidosis after loss of insulin delivery", "Insulin deficiency changes how the body obtains energy."], ["sepsis", "Sepsis with lactic acidosis", "Infection and poor perfusion generate excess lactate."], ["opioid", "Opioid toxicity", "A drug suppresses the brain’s respiratory drive."], ["asthma", "Acute asthma flare", "Airway narrowing makes it difficult to move air."]], "mechs": [["ketones", "Ketoacid accumulation from fat breakdown", "Acid production lowers pH and bicarbonate; breathing deepens to compensate."], ["lactate", "Lactic-acid accumulation from poor perfusion", "Tissues produce excess lactate when oxygen delivery is inadequate."], ["suppression", "Suppressed respiratory drive", "The brain sends too little signal to breathe."], ["narrowing", "Reversible airway narrowing", "Airflow is obstructed in the bronchi."]], "answer": ["dka", "ketones"], "hints": ["Start with the values that identify the type of acid present.", "Ketones are markedly elevated, while lactate is normal.", "The deep breathing is a response to the blood chemistry, not the original problem.", "Choose the condition caused by loss of insulin delivery."], "wrong": {"sepsis": "Normal lactate, temperature, and blood pressure make sepsis a poor fit.", "opioid": "The respiratory drive is increased rather than suppressed.", "asthma": "Asthma does not explain high ketones, low bicarbonate, and acidic pH.", "lactate": "The measured lactate is normal.", "suppression": "The patient is breathing more, not less.", "narrowing": "There is no wheeze or oxygen deficit, and airway narrowing would not create ketones."}, "solution": "Diabetic ketoacidosis is driving the breathing pattern.", "summary": "Loss of insulin delivery caused fat breakdown and ketoacid production. Low pH and bicarbonate are direct chemical effects; deep breathing is a compensatory downstream response.", "chain": ["Loss of insulin delivery", "Ketoacid accumulation", "Metabolic acidosis and deep compensatory breathing"], "review": [["Why ketones matter", "They identify fat-derived acids rather than lactate from poor perfusion."], ["Why breathing is downstream", "The lungs are trying to compensate by removing carbon dioxide."], ["Why sepsis loses", "The lactate is normal and there is no fever or hypotension."], ["Why asthma loses", "The metabolic laboratory pattern remains unexplained."]], "primer": [["Insulin and fuel", "Insulin lets many cells use glucose. When insulin is severely lacking, the body turns to fat for fuel and produces acidic chemicals called ketones."], ["Acids and buffers", "Blood normally stays close to pH 7.4. Bicarbonate is one of its main chemical buffers; it falls when it is used up neutralizing excess acid."], ["Compensation", "Deep, rapid breathing can be the body’s attempt to correct an acid problem by exhaling more carbon dioxide. The breathing can therefore be an effect, not the original disease."]]}, {"id": "computing", "icon": "DB", "title": "The Checkout That Froze", "discipline": "Computing and databases", "kicker": "Online retailer operations center · 9:05 a.m.", "headline": "Checkout is slow, but the servers are not busy.", "brief": ["A retailer’s checkout page has become nearly unusable during an ordinary morning. Customers wait several seconds after clicking “Place order,” though traffic is close to normal.", "The slowdown began after a migration increased the orders table from 80,000 rows to 1.2 million rows."], "update": "No hardware alarms have fired, and latency worsened gradually as the database grew.", "readings": [["Request rate", "8,200/min", "normal", "Near normal load", "How many checkout requests arrive each minute. A normal rate means unusual traffic is not the obvious cause."], ["Application CPU", "43%", "normal", "Plenty of headroom", "The fraction of processor capacity being used by the web application. Forty-three percent leaves substantial unused capacity."], ["Application memory", "61%", "normal", "Stable for 24 hours", "The fraction of memory in use. A stable value argues against a leak that keeps accumulating unused data."], ["Network round trip", "21 ms", "normal", "No unusual delay", "The time for a message to travel to the database and back. Twenty-one milliseconds is much shorter than the multi-second delay."], ["Database query p95", "2.9 s", "high", "Main source of latency", "Ninety-five percent of database queries finish within this time. A value of 2.9 seconds identifies the database stage as slow."], ["Rows examined/request", "1.4 million", "high", "Far above rows returned", "How many table rows the database checks for one lookup. Examining 1.4 million rows for one request suggests it is scanning nearly the whole table."], ["Cache hit rate", "94%", "normal", "Cache functioning", "The percentage of requests answered from fast stored results rather than slower underlying work. Ninety-four percent indicates the cache is operating."], ["DB connections", "42 / 200", "normal", "Pool not exhausted", "Open communication slots between the application and database. Only 42 of 200 are occupied, so the pool is not exhausted."]], "rules": [["A missing database index can force a full table scan.", "The database may inspect a huge number of rows to find a small result."], ["Full scans get slower as a table grows.", "Latency can rise while request rate and CPU remain moderate."], ["CPU saturation should appear as persistently high CPU use.", "That is not present here."], ["A memory leak produces rising memory use or long collection pauses.", "Memory is stable."], ["Packet loss raises network delay and retransmissions.", "Round-trip time is normal."], ["A complete explanation must identify where time is spent.", "Query time and rows examined point to the slow stage."]], "causes": [["index", "A required index was omitted during migration", "The lookup column is no longer indexed."], ["cpu", "Application servers are CPU-saturated", "Too many calculations compete for processor time."], ["memory", "The checkout service has a memory leak", "Unused objects accumulate."], ["network", "Packet loss between application and database", "Queries and results must be retransmitted."]], "mechs": [["scan", "Full table scans on each order lookup", "The database examines roughly the whole table."], ["compute", "Insufficient processing capacity", "The application queue grows because CPU time is exhausted."], ["gc", "Swapping or long garbage-collection pauses", "Memory pressure repeatedly interrupts work."], ["retries", "Network retransmissions", "Lost packets add repeated delays."]], "answer": ["index", "scan"], "hints": ["Find the stage whose measured latency is abnormal.", "Compare rows examined with the number of rows actually needed.", "Ask which fault worsens as the table grows.", "Normal CPU, memory, network, cache, and connections eliminate resource explanations."], "wrong": {"cpu": "CPU is only 43%, so processing capacity is not the limit.", "memory": "Memory is stable rather than climbing.", "network": "Round-trip time is normal.", "compute": "A compute bottleneck should produce high CPU use.", "gc": "There is no memory pressure.", "retries": "The network is healthy while the database query is slow."}, "solution": "The migration omitted a needed database index.", "summary": "Each checkout lookup scans roughly the entire table. Table growth increases database work, raising query latency while the application servers and network remain healthy.", "chain": ["Missing lookup index", "Full table scan", "Long database query and slow checkout"], "review": [["Why rows examined matter", "Inspecting 1.4 million rows for a small lookup signals an inefficient access path."], ["Why CPU stays moderate", "The application waits for the database rather than exhausting processors."], ["Why growth matters", "A full scan scales with table size."], ["Why normal readings matter", "They prevent a vague “the servers are overloaded” explanation."]], "primer": [["Find the bottleneck", "A slow page does not mean every part of the system is overloaded. The key is to find which stage is actually consuming the time."], ["What an index does", "A database index is like a book’s index: it lets the database jump near the desired record instead of reading every row from the beginning."], ["Percentiles", "A p95 value is the time below which 95% of requests finish. It highlights the slow experience of typical unlucky users without focusing on one extreme outlier."]]}, {"id": "ecology", "icon": "H₂O", "title": "The Dawn Fish Kill", "discipline": "Ecology and environmental science", "kicker": "Lake Mercer field station · 6:10 a.m.", "headline": "Fish are dying at dawn, but the lake looks healthy by afternoon.", "brief": ["Residents report fish gasping near the surface shortly before sunrise. By mid-afternoon, the lake is bright green and dissolved oxygen looks much better.", "The event began several days after heavy rain washed material from surrounding farmland into the lake."], "update": "Most deaths occur in shallow coves just before sunrise. No chemical odor is reported.", "readings": [["Dissolved O₂ at dawn", "1.1 mg/L", "low", "Severe hypoxia", "The amount of oxygen mixed into the water just before sunrise, after a full night without photosynthesis."], ["Dissolved O₂ at 3 p.m.", "8.4 mg/L", "normal", "Strong recovery", "The oxygen level after hours of daylight photosynthesis. The strong recovery shows that time of day matters."], ["Nitrate", "4.8 mg/L", "high", "Elevated nutrient", "A nitrogen-containing nutrient used by algae and plants. High nitrate can support rapid algal growth."], ["Phosphate", "0.19 mg/L", "high", "Elevated nutrient", "A phosphorus-containing nutrient. Even small amounts can strongly limit or stimulate freshwater algal growth."], ["Chlorophyll-a", "92 µg/L", "high", "Dense algal biomass", "A green pigment used in photosynthesis. Scientists use it as an estimate of how much algae is in the water."], ["Water temperature", "24°C", "normal", "Warm but not extreme", "Temperature affects biological activity and how much oxygen water can hold. Twenty-four degrees is warm but not an extreme heat event."], ["pH dawn → afternoon", "7.2 → 9.1", "high", "Large daily swing", "pH measures acidity. Photosynthesis removes carbon dioxide and can push pH upward during the day, producing a large daily swing."], ["Pesticide screen", "Negative", "normal", "No common pesticide detected", "A laboratory check for common toxic pesticides. A negative result weakens, but does not absolutely eliminate, a poisoning explanation."]], "rules": [["Nutrient runoff can produce a dense algal bloom.", "Nitrogen and phosphorus stimulate rapid growth."], ["Photosynthesis raises oxygen and pH during daylight.", "Algae produce oxygen and remove carbon dioxide in light."], ["Respiration continues at night while photosynthesis stops.", "A dense community can consume oxygen until dawn."], ["A toxic spill should not create a daily oxygen recovery.", "Poisoning does not switch off in sunlight."], ["Thermal pollution requires unusually warm water.", "The temperature is not extreme."], ["Acid drainage should keep pH persistently low.", "Afternoon pH 9.1 fits strong photosynthesis instead."]], "causes": [["nutrients", "Fertilizer-rich runoff after heavy rain", "Nitrogen and phosphorus entered from fields."], ["pesticide", "A pesticide spill", "A chemical directly poisoned aquatic life."], ["thermal", "Hot-water discharge", "Warmer water held less oxygen."], ["acid", "Acidic drainage", "Low pH and metals damaged fish gills."]], "mechs": [["bloom", "Algal bloom with nighttime respiration and decomposition", "Biological oxygen demand peaks overnight."], ["toxin", "Direct toxic poisoning", "A chemical damages fish regardless of daylight."], ["solubility", "Reduced oxygen solubility in hot water", "Warm water cannot hold as much oxygen."], ["gills", "Acid and metals injure fish gills", "Fish cannot exchange gases effectively."]], "answer": ["nutrients", "bloom"], "hints": ["Focus on what changes between dawn and afternoon.", "Ask what runs in daylight but stops at night.", "Nutrients and chlorophyll explain why the swing is so large.", "Choose the cause that entered after the rain."], "wrong": {"pesticide": "A pesticide does not explain daily oxygen recovery.", "thermal": "The water is not unusually hot and temperature does not explain the pH swing.", "acid": "Afternoon pH is strongly alkaline.", "toxin": "The timing points to a biological oxygen cycle.", "solubility": "Oxygen solubility does not change this dramatically over one day at the same temperature.", "gills": "The nutrient and pH pattern do not fit acid drainage."}, "solution": "Nutrient runoff triggered an algal bloom.", "summary": "The bloom produces oxygen and raises pH in daylight, but the dense community consumes oxygen all night. Oxygen reaches its minimum before sunrise, causing the fish kill.", "chain": ["Nutrient runoff", "Dense bloom and high nighttime oxygen demand", "Severe dawn hypoxia and fish deaths"], "review": [["Why dawn is dangerous", "Photosynthesis has been absent all night while respiration continues."], ["Why afternoon looks healthy", "Strong photosynthesis temporarily restores oxygen and raises pH."], ["Why nutrients matter", "They sustain the unusually dense algal biomass."], ["Why a toxin loses", "A persistent poison would not explain the repeated daily recovery."]], "primer": [["Dissolved oxygen", "Fish breathe oxygen dissolved in water. Very low dissolved oxygen is called hypoxia and can cause fish to gasp or die."], ["Photosynthesis versus respiration", "In daylight, algae make oxygen through photosynthesis. At night, photosynthesis stops but algae, fish, and microbes continue consuming oxygen through respiration."], ["Nutrients and blooms", "Nitrate and phosphate act like fertilizer. Too much can support a dense algal bloom, which greatly strengthens the day-night oxygen cycle."]]}, {"id": "astronomy", "icon": "★", "title": "The Planet That Might Not Be", "discipline": "Astronomy and data interpretation", "kicker": "Small-planet survey review room · 2:15 p.m.", "headline": "The star dims every 4.26 days. Is something crossing it?", "brief": ["A survey flags a nearby Sun-like star whose brightness drops at a regular interval. The team must determine whether the signal is a planet or a common impostor.", "Follow-up observations test whether the dimming belongs to the target and behaves like a geometric transit."], "update": "Two independent telescopes detect the same signal over nine months.", "readings": [["Dip depth", "1.10%", "normal", "Repeatable", "The percentage of starlight lost during the event. A repeatable depth suggests the same-sized object or pattern returns."], ["Period", "4.260 days", "normal", "Stable over 9 months", "The time from one dip to the next. A stable period is consistent with an orbit or rotation."], ["Duration", "2.6 hours", "normal", "Short, discrete event", "How long each dimming event lasts. A short, discrete event is more transit-like than a broad brightness wave."], ["Odd/even depth", "1.10% / 1.09%", "normal", "Essentially identical", "A comparison of alternating events. Different depths can reveal two unequal stars eclipsing each other."], ["Blue/red depth", "1.11% / 1.09%", "normal", "Nearly color-independent", "A comparison in two colors. A dark planet blocks nearly the same fraction in both, while blended stars or starspots can be more color-dependent."], ["Image centroid shift", "<0.1 pixel", "normal", "Dimming stays on target", "The movement of the image’s center of light during the dip. A shift can reveal that a nearby background star—not the target—is fading."], ["Secondary eclipse", "None", "normal", "Below 0.05%", "A second, usually shallower dip when an orbiting luminous object passes behind the star. Its absence weakens many stellar-binary explanations."], ["Independent telescope", "Confirmed", "normal", "Same period and depth", "A second instrument observed the same signal. This makes a detector-specific error much less likely."]], "rules": [["A transiting planet blocks a nearly color-independent fraction of starlight.", "An opaque body hides part of the stellar disk."], ["A blended eclipsing binary often shifts the image centroid or changes depth with color.", "The fading source may be a nearby star."], ["An eclipsing binary can show unequal odd/even events or a secondary eclipse.", "Two luminous stars can eclipse differently."], ["Starspots usually create broader, evolving, color-dependent modulation.", "Cool regions rotate in and out of view."], ["Detector drift is unlikely to repeat in an independent telescope.", "Independent confirmation separates sky from instrument."], ["Periodicity alone does not prove a planet.", "Localization, color, and event shape must agree."]], "causes": [["planet", "A planet orbiting the target star", "A dark body passes in front once per orbit."], ["binary", "A blended eclipsing binary nearby", "A neighboring pair fades and contaminates the target light."], ["spot", "A rotating starspot pattern", "Cool regions repeatedly reduce brightness."], ["detector", "A periodic detector error", "The instrument creates a false signal."]], "mechs": [["transit", "Geometric occultation of the stellar disk", "The planet blocks a stable fraction of light."], ["blend", "Diluted eclipses from a neighboring source", "A deep binary eclipse appears shallow after extra light is added."], ["rotation", "Stellar rotation carries dark regions into view", "Brightness changes as spots cross the visible hemisphere."], ["gain", "Periodic detector gain variation", "Measured counts change even though the star does not."]], "answer": ["planet", "transit"], "hints": ["Use the tests that ask whether the fading occurs on the target.", "No centroid shift and equal blue/red depths weaken a neighbor.", "Equal odd/even events and no secondary weaken a binary.", "Independent confirmation weakens an instrument explanation."], "wrong": {"binary": "No centroid motion, color dependence, odd/even difference, or secondary eclipse is seen.", "spot": "The signal is short, stable, and nearly color-independent rather than broad and evolving.", "detector": "Two independent telescopes recover the same period and depth.", "blend": "The fading remains localized on the target.", "rotation": "The event is a discrete dip, not broad rotational modulation.", "gain": "Independent instruments show the same signal."}, "solution": "The evidence supports a transiting planet.", "summary": "A dark body crosses the target every 4.260 days, blocking about 1.10% of its light. Follow-up tests remove the most common stellar and instrumental impostors.", "chain": ["Planet in a stable orbit", "Geometric transit", "Short, periodic, color-independent brightness dip"], "review": [["Why color matters", "A dark planet blocks nearly the same visible-light fraction in blue and red."], ["Why centroid matters", "A fading background star would usually shift the image center."], ["Why odd/even matters", "A binary can alternate primary and secondary eclipses."], ["Why independent confirmation matters", "Another instrument separates an astrophysical event from a detector artifact."]], "primer": [["A transit", "A transit occurs when a planet crosses in front of its star and blocks a small fraction of the starlight."], ["False positives", "Other effects can imitate a transit: two stars eclipsing each other, dark starspots rotating into view, or an instrument changing sensitivity."], ["Independent tests", "Astronomers do not trust periodic dimming alone. They test color, image position, alternating events, secondary eclipses, and independent telescopes."]]}, {"id": "economics", "icon": "£", "title": "Bread at Forty Pence", "discipline": "Economics and historical reasoning", "kicker": "Fictional port city · Wartime winter, 1812", "headline": "Bread prices have surged. Is the money failing—or the supply line?", "brief": ["Within three weeks, bread prices in Bellhaven rise sharply. Officials blame merchants, while merchants blame the war.", "You have customs ledgers, wage records, shipping-insurance quotes, and retail sales data."], "update": "An enemy squadron began stopping grain ships outside the harbor three weeks before the price spike.", "readings": [["Wheat arrivals", "−47%", "low", "Compared with prior winter", "The amount of imported wheat reaching the city. A 47% fall means the physical supply entering the market has nearly halved."], ["Shipping insurance", "3% → 14%", "high", "Risk premium surged", "The price charged to protect a voyage against loss. A jump from 3% to 14% shows transport became much riskier and more costly."], ["Bread price", "+58%", "high", "Largest increase", "The retail cost of bread. It rose sharply, but price alone cannot distinguish supply, demand, money, or taxes."], ["Bread quantity sold", "−24%", "low", "Consumers bought less", "The amount consumers actually bought. Falling quantity alongside rising price is a key sign of a supply contraction."], ["Nominal wages", "+2%", "normal", "Nearly unchanged", "Wages measured in money, without adjusting for prices. Nearly unchanged wages weaken the idea of a household spending boom."], ["Coin supply", "+3%", "normal", "Little expansion", "The amount of money circulating in the city. Only a small increase weakens a rapid monetary-inflation explanation."], ["Cloth and soap prices", "+4%", "normal", "Small broad increase", "Prices of unrelated goods. Their small change shows the bread increase is not part of a similarly large rise across all markets."], ["Bread excise tax", "Unchanged", "normal", "No new tax", "A tax charged on bread. Because it did not change, a new tax cannot explain the sudden price increase."]], "rules": [["A blockade can reduce imports and raise transport risk.", "Less grain arrives and successful voyages cost more."], ["A supply contraction raises price while reducing quantity sold.", "A pure demand boom tends to raise both."], ["Monetary inflation usually affects many prices.", "Stable money and non-food prices weaken it."], ["A demand boom should be accompanied by stronger incomes or purchases.", "Wages are flat and bread sales fell."], ["A new commodity tax requires a tax change.", "The excise rate did not change."], ["Historical timing matters.", "The shipping interruption precedes the price surge."]], "causes": [["blockade", "The enemy naval blockade of grain shipping", "Imports fell and voyages became riskier."], ["money", "Rapid expansion of the money supply", "More currency chased the same goods."], ["demand", "A sudden boom in household demand", "Consumers tried to buy more bread."], ["tax", "A new excise tax on bread", "The government added a charge to each loaf."]], "mechs": [["supply", "Supply contraction plus higher transport cost", "Less wheat reaches the city and shipments cost more."], ["inflation", "Broad currency devaluation", "Money loses purchasing power across goods."], ["demandshift", "Outward shift in demand", "Households buy more at each price."], ["taxwedge", "Tax wedge", "A new tax raises retail price."]], "answer": ["blockade", "supply"], "hints": ["Look at price and quantity together.", "Bread price rises while quantity sold falls.", "Compare wheat arrivals and shipping insurance with the blockade.", "Stable wages, money, other prices, and taxes weaken the alternatives."], "wrong": {"money": "A monetary explanation should produce broader price increases.", "demand": "A demand boom would more naturally raise both price and quantity.", "tax": "The bread tax did not change.", "inflation": "Cloth, soap, and wages remain nearly stable.", "demandshift": "Bread quantity sold fell.", "taxwedge": "There is no new tax."}, "solution": "The naval blockade created a grain-supply shock.", "summary": "Fewer wheat ships reached the city, and successful voyages became expensive to insure. Reduced supply raised bread prices while lowering quantity sold.", "chain": ["Naval blockade", "Lower grain supply and higher shipping risk", "Higher bread price and lower quantity sold"], "review": [["Why price alone is ambiguous", "Inflation, demand, taxes, and supply can all raise prices."], ["Why quantity matters", "Price rising while quantity falls points to supply contraction."], ["Why insurance matters", "It directly records wartime transport risk."], ["Why other prices matter", "Their stability weakens general inflation."]], "primer": [["Price and quantity together", "A higher price alone does not reveal the cause. Economists also ask whether the amount sold rose or fell."], ["Supply shock", "When supply falls, goods become scarcer: price usually rises while quantity sold falls."], ["Broad inflation versus one market", "If money broadly loses value, many prices tend to rise. If one imported staple rises much more than other goods, a market-specific supply problem is more plausible."]]}];let current=null,stage=0,cause=null,mechanism=null,hints=0;
let shuffledCauses=[],shuffledMechs=[];
const app=document.getElementById('app');

function shuffleChoices(items){
  const arr=[...items];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function prepareChoices(){
  shuffledCauses=shuffleChoices(current.causes);
  shuffledMechs=shuffleChoices(current.mechs);
}
function goHome(){current=null;stage=0;cause=null;mechanism=null;hints=0;document.getElementById('patch').textContent='Dx';document.getElementById('brandTitle').textContent='Diagnosis';document.getElementById('brandSub').textContent='Five causal logic games';renderHome()}
function chooseCase(id){current=CASES.find(x=>x.id===id);stage=0;cause=null;mechanism=null;hints=0;prepareChoices();document.getElementById('patch').textContent=current.icon;document.getElementById('brandTitle').textContent=current.title;document.getElementById('brandSub').textContent=current.discipline;renderBriefing()}
function renderHome(){app.innerHTML=`<section class="panel hero"><div class="kicker">Five disciplines · One reasoning skill</div><h2>Which cause and mechanism explain the complete pattern?</h2><p>Each case uses the same one-stage diagnosis structure, but the evidence changes from laboratory values to server telemetry, lake chemistry, telescope observations, and historical market records.</p></section><section class="homegrid">${CASES.map(c=>`<div class="homecard" onclick="chooseCase('${c.id}')"><div class="icon">${c.icon}</div><div class="discipline">${c.discipline}</div><h3>${c.title}</h3><p>${c.headline}</p><strong style="color:var(--gold)">Open case →</strong></div>`).join('')}</section>`}
function renderBriefing(){app.innerHTML=`<section class="panel hero"><div class="kicker">${current.kicker}</div><h2>${current.headline}</h2>${current.brief.map(p=>`<p>${p}</p>`).join('')}<div class="storybox"><strong>Your task:</strong> Identify both the underlying cause and the intermediate mechanism that explain the complete evidence pattern.</div><div class="warning"><strong>Note:</strong> This is a fictional, simplified educational simulation.</div><div class="controls"><button class="btn primary" onclick="stage=1;renderCase()">Open the case file</button></div></section>`}
function renderCase(){app.innerHTML=`<section class="panel game"><div class="gamehead"><div><div class="kicker">Causal diagnosis</div><h2>What is the root cause—and how does it produce the evidence?</h2><p>Read the short teaching guide, then use the readings and causal rules to build one complete explanation.</p></div><div class="stage">One-stage case</div></div><div class="diagnosis-layout"><main class="evidence-pane"><div class="casebox"><strong>Case update:</strong> ${current.update}</div><section class="primer"><div class="primer-head"><h3>Ideas you need before solving</h3><span>No prior expertise assumed</span></div><div class="primer-grid">${current.primer.map(p=>`<div class="concept"><strong>${p[0]}</strong><p>${p[1]}</p></div>`).join('')}</div></section><div class="sensor-grid">${current.readings.map(r=>`<div class="sensor"><div class="label">${r[0]}</div><div class="value ${r[2]}">${r[1]}</div><small>${r[3]}</small><div class="meaning"><strong>What this means:</strong> ${r[4]}</div></div>`).join('')}</div><div class="rules">${current.rules.map((r,i)=>`<div class="rule"><strong>How the system works ${i+1}.</strong> ${r[0]}<small>${r[1]}</small></div>`).join('')}</div></main><aside class="choice-sidebar"><div class="sidebar-title"><strong>Build your diagnosis</strong><span class="selection-summary">${cause&&mechanism?'Ready to test':cause||mechanism?'1 of 2 selected':'Choose 2 parts'}</span></div><h3>1. Root cause</h3><div class="choice-grid">${shuffledCauses.map(c=>`<div class="choice ${cause===c[0]?'selected':''}" onclick="cause='${c[0]}';renderCase()"><div class="tag">Possible cause</div><strong>${c[1]}</strong><small>${c[2]}</small></div>`).join('')}</div><h3>2. Intermediate mechanism</h3><div class="choice-grid">${shuffledMechs.map(m=>`<div class="choice ${mechanism===m[0]?'selected':''}" onclick="mechanism='${m[0]}';renderCase()"><div class="tag">Possible mechanism</div><strong>${m[1]}</strong><small>${m[2]}</small></div>`).join('')}</div>${hints?`<div class="tip"><strong>Hint ${hints}:</strong> ${current.hints[hints-1]}</div>`:''}<div class="controls"><button class="btn primary" onclick="checkAnswer()">Test explanation</button><button class="btn" onclick="showHint()">Show one hint</button><button class="btn" onclick="prepareChoices();renderCase()">Reshuffle choices</button><button class="btn" onclick="renderBriefing()">Review story</button></div><div id="feedback" class="feedback"></div></aside></div></section>`}
function showHint(){if(hints<current.hints.length)hints++;renderCase()}
function checkAnswer(){const fb=document.getElementById('feedback');if(!cause||!mechanism){fb.className='feedback show bad';fb.innerHTML='<strong>Select both a root cause and a mechanism.</strong>';return}if(cause===current.answer[0]&&mechanism===current.answer[1]){renderSolved();return}let msgs=[];if(cause!==current.answer[0]&&current.wrong[cause])msgs.push(current.wrong[cause]);if(mechanism!==current.answer[1]&&current.wrong[mechanism])msgs.push(current.wrong[mechanism]);fb.className='feedback show bad';fb.innerHTML=`<strong>The explanation does not fit the complete pattern.</strong><ul>${msgs.map(x=>`<li>${x}</li>`).join('')}</ul>`}
function renderSolved(){app.innerHTML=`<section class="panel game"><div class="gamehead"><div><div class="kicker">Case solved</div><h2>${current.solution}</h2><p>${current.summary}</p></div><div class="stage">Diagnosis complete</div></div><div class="feedback show good"><strong>Correct causal chain:</strong> ${current.chain.join(' → ')}</div><div class="chain">${current.chain.map((x,i)=>`${i?'<div class="arrow">→</div>':''}<div class="chainbox"><strong>${i===0?'Root cause':i===1?'Intermediate mechanism':'Observed outcome'}</strong><br>${x}</div>`).join('')}</div><div class="review">${current.review.map(r=>`<div class="review-item"><h3>${r[0]}</h3><p>${r[1]}</p></div>`).join('')}</div><div class="storybox"><strong>Why this is a diagnosis puzzle:</strong> the answer must explain the positive evidence, the intermediate process, and the normal findings that eliminate rivals.</div><div class="controls"><button class="btn primary" onclick="cause=null;mechanism=null;hints=0;prepareChoices();renderCase()">Play again</button><button class="btn" onclick="goHome()">Choose another case</button></div></section>`}
renderHome();
</script></body></html>

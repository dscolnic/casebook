<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RECKON — Reasoning Games</title>
<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --ink:#1a1a17; --muted:#565651;
    --accent:#2f5d86; --hair:#e4e4e2; --chip:#f4f4f1; --hover:#eef0f2;
    --serif:Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14140f; --panel:#1c1c16; --ink:#ece9df; --muted:#a6a598;
      --accent:#82b2d9; --hair:#2f2f26; --chip:#24241d; --hover:#22221a; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);line-height:1.55;font-size:17px;padding:0 20px}
  .wrap{max-width:780px;margin:0 auto;padding:0 0 12vh}
  a{color:var(--accent)}
  .masthead{border-bottom:3px double var(--ink);padding:6vh 0 16px;margin-bottom:8px}
  .masthead h1{font-family:var(--serif);font-weight:700;font-size:52px;line-height:1;letter-spacing:1px;margin:0;text-transform:uppercase}
  .masthead .tag{font-family:var(--sans);font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-top:12px}
  section.game{margin:40px 0 0}
  .ghead{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:9px}
  .ghead h2{font-family:var(--serif);font-size:27px;margin:0;letter-spacing:-.3px}
  .mono{flex:none;width:38px;height:38px;display:grid;place-items:center;background:var(--accent);color:#fff;border-radius:5px}
  .mono svg{width:22px;height:22px;display:block}
  .desc{font-size:16px;color:var(--ink);margin:13px 0 0;max-width:60ch}
  .today{margin:15px 0 0;background:var(--chip);border-left:3px solid var(--accent);border-radius:0 7px 7px 0;padding:14px 16px}
  .today .tk{font-family:var(--sans);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);font-weight:700}
  .today .tt{font-family:var(--serif);font-size:22px;font-weight:700;margin:4px 0 0;letter-spacing:-.2px}
  .today .ts{font-family:var(--sans);font-size:13px;color:var(--muted);margin:3px 0 0}
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin:13px 0 0}
  .btn{font-family:var(--sans);font-size:14px;font-weight:650;border:1px solid var(--hair);background:var(--panel);color:var(--ink);padding:9px 15px;border-radius:5px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{opacity:.92}
  .btn.ghost{background:transparent}
  .panel.arch{margin:10px 0 0;border-left:2px solid var(--hair);padding:2px 0 2px 14px}
  a.row{display:flex;align-items:baseline;gap:12px;padding:9px 6px 9px 2px;border-bottom:1px solid var(--hair);text-decoration:none;color:inherit}
  a.row:hover{background:var(--hover)}
  a.row .t{flex:1;font-size:15px}
  a.row .go{font-family:var(--sans);font-size:12px;color:var(--muted);white-space:nowrap}
  a.row:hover .go{color:var(--accent)}
  .mystats{margin-top:52px}
  .statsgrid{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0 20px}
  .statcard{flex:1;min-width:120px;border:1px solid var(--hair);border-top:3px solid var(--accent);padding:13px 16px}
  .statcard .n{font-family:var(--serif);font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .statcard .l{font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .stbl{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:14px}
  .stbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--hair);padding:7px 10px 7px 0}
  .stbl td{padding:9px 10px 9px 0;border-bottom:1px solid var(--hair);font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  footer{color:var(--muted);font-size:13px;margin-top:52px;font-family:var(--sans);border-top:1px solid var(--hair);padding-top:16px}
  @media (max-width:620px){ .masthead h1{font-size:40px} body{font-size:16px} .statcard{min-width:44%} }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>Reckon</h1>
    <div class="tag">Reasoning games · a fresh puzzle every day</div>
  </div>

  <div id="daily" class="daily"></div>

  <section class="mystats">
    <div class="ghead" style="border-bottom-color:var(--accent)"><span class="mono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h16"/><path d="M8 20v-5M13 20v-9M18 20v-3"/></svg></span><h2>My stats</h2></div>
    <div id="statsBody" class="muted" style="margin-top:14px">Loading…</div>
  </section>

  <footer>RECKON · one sign-in, a daily puzzle in every game.</footer>
</div>
<script>

ling","rail signalling · headways · capacity"],["bp_m_rig","Deepwater Drilling and the Gulf Spill","offshore drilling · pressure · spill scale"],["bp_m_stadium","Wembley Stadium: Structure and Crowds","stadiums · crowds · long-span roofs"],["bp_m_sub","The Real Scale of the Deep Ocean","deep ocean · pressure · sonar"],["bp_m_tailings","The Brumadinho Tailings Disaster","tailings · liquefaction · runout"],["bp_m_tunnel","The Channel Tunnel by the Numbers","tunnels · excavation · rail"],["bp_marine","RMS Titanic: Ship Scale and Buoyancy","ships · displacement · capacity"],["bp_rail","Fast Trains and Rail Capacity","railways · speed · energy"],["bp_rocket","Saturn V and Apollo 11","rockets · thrust · lunar travel"],["bp_tower","Burj Khalifa by the Numbers","skyscrapers · elevators · concrete"],["bp_blackout","The 2003 Northeast Blackout","electric grid · cascading failure · restoration"],["bp_chemplant","Chemical Plants and Toxic Releases","process safety · toxic gases · industrial scale"],["bp_reactor","Nuclear Reactor Power and Decay Heat","nuclear power · fission · decay heat"],["bp_t_battery","Grid Batteries and Stored Energy","batteries · power · grid storage"],["bp_t_dust","Combustible Dust: Thin Layers, Large Hazards","dust explosions · combustion · standards"],["bp_t_pipeline","The Keystone Pipeline by the Numbers","pipelines · flow · pressure waves"],["bp_t_refinery","Oil Refineries and Daily Throughput","refining · fuels · process scale"],["bp_t_transformer","Large Power Transformers","transformers · voltage · efficiency"],["bp_t_wind","The Haliade-X Offshore Wind Turbine","wind power · rotor scale · fatigue"],["bp_t_oncology","Radiation Therapy and Dose","radiotherapy · dose · treatment scale"],["bp_w_anes","Anesthesia: Drugs, Oxygen, and Monitoring","anesthesia · physiology · monitoring"],["bp_w_blood","Blood Donation and Transfusion","blood banking · volume · supply"],["bp_w_compound","Sterile Compounding and Clean Rooms","pharmacy · sterile processing · clean rooms"],["bp_w_hai","Healthcare-Associated Infections","infection control · hospitals · rates"],["bp_w_surg","Surgery and Patient Safety","surgery · checklists · operating rooms"],["bp_w_trial","Clinical Trials by the Numbers","clinical trials · efficacy · follow-up"],["bp_w_water","Drinking Water: Supply and Lead","water systems · treatment · public health"],["bp_f_ai","Large Language Models by the Numbers","artificial intelligence · training · model scale"],["bp_f_breach","Major Data Breaches by the Numbers","cybersecurity · records · exposure"],["bp_f_crypto","Cryptography: Keys, Blocks, and Brute Force","cryptography · keyspace · standards"],["bp_f_firmware","Embedded Computers: Apollo to Arduino","firmware · memory · processors"],["bp_f_netout","Internet Scale, Addresses, and Latency","internet · fiber · addressing"],["bp_f_privacy","Privacy Lessons from Real Data Sets","privacy · re-identification · data scale"],["bp_f_robot","Mobile Robots at Work","robotics · payload · autonomy"],["bp_software","Software Failures and Computer Limits","software safety · overflow · timing"],["bp_j_bank","Silicon Valley Bank and Bank Runs","banking · deposits · liquidity"],["bp_j_capture","Regulated Electric Utilities","regulation · utility rates · public choice"],["bp_j_convict","Wrongful Convictions and Exoneration","criminal evidence · exoneration · due process"],["bp_j_fraud","Corporate Accounting Fraud by the Numbers","accounting · market value · fraud"],["bp_j_press","News Organizations and Verification Scale","journalism · verification · global news"],["bp_j_trust","Monopoly and Antitrust Scale","antitrust · market power · concentration"],["bp_j_vote","The Scale of a U.S. Presidential Election","elections · turnout · administration"],["bp_c_arch","Archaeology and Scientific Dating","archaeology · radiocarbon · excavation"],["bp_c_art","Artworks, Images, and Authentication","art history · imaging · conservation"],["bp_c_doping","Cycling and Anti-Doping by the Numbers","sports science · cycling · anti-doping"],["bp_c_fall","The Roman Empire by the Numbers","history · infrastructure · empire"],["bp_c_fraud","Scientific Fraud and Reproducibility","research integrity · replication · statistics"],["bp_c_psych","Classic Psychology Experiments by the Numbers","psychology · conformity · replication"],["bp_c_script","Deciphering Ancient Scripts","linguistics · inscriptions · decipherment"],["bp_gmtroy","Troy, Homer, and the Bronze Age","Troy · Homer · archaeology"]]},"Science Tank":{"link":"sciencetank.html#","fileLink":false,"cases":[["electric-futures","Electric Futures","Tesla, Edison, Bell"],["digital-office","Digital Office","Storage, PARC, Mouse"],["internet-foundations","Internet Foundations","Web, Crypto, Databases"],["machine-media","Machine Media","AI, Imaging, Audio"],["synthetic-materials","Synthetic Materials","Dyes, Plastics, Polymers"],["energy-materials","Energy Materials","Glass, Batteries, Solar"],["early-medicine","Early Medicine","Chemotherapy, Anesthesia, Antibiotics"],["drug-discovery","Drug Discovery","Statins, Cancer, Pharmacology"],["dna-revolution","DNA Revolution","CRISPR, Sequencing, PCR"],["biotech-origins","Biotech Origins","Fluorescence, Insulin, Microbes"],["feeding-billions","Feeding Billions","Nitrogen, Wheat, Irrigation"],["crop-protection","Crop Protection","Insects, Genomes, Preservation"],["watching-earth","Watching Earth","GPS, Satellites, Weather"],["earth-and-space","Earth and Space","Tectonics, Optics, Communications"],["flight-revolution","Flight Revolution","Wings, Jets, Engines"],["scale-and-systems","Scale and Systems","Nuclear, Cargo, Power"],["evidence-decisions","Evidence and Decisions","Cholera, Behavior, Forensics"],["undersea-systems","Undersea Systems","Detection, Propulsion, Navigation"],["seeing-inside","Seeing Inside","Tomography, Isotopes, Endoscopy"],["vaccine-strategies","Vaccine Strategies","Polio, Hepatitis, Pandemic"],["aviation-ambitions","Aviation Ambitions","Atlantic, Supersonic, Vertical"],["format-wars","Format Wars","Video, Audio, HD"],["handheld-computing","Handheld Computing","PDAs, Readers, Tablets"],["moon-and-rockets","Moon and Rockets","Apollo, Shuttle, Reuse"],["cleaning-the-atmosphere","Cleaning the Atmosphere","Emissions, Refrigerants, Sulfur"],["robots-at-work","Robots at Work","Factories, Warehouses, Driving"],["building-upward","Building Upward","Elevators, Bridges, Concrete"],["switching-and-signals","Switching and Signals","Switching, Cellular, Messaging"],["food-futures","Food Futures","Freezing, Sweeteners, Protein"],["advanced-materials","Advanced Materials","Turbines, Composites, Printing"],["precision-instruments","Precision Instruments","Microscopy, Time, Detectors"],["trust-and-screening","Trust and Screening","Biometrics, Airports, Currency"]]}};
/* Daily hub: per game -> logo + description + today's puzzle (Play / Archive) +
   My stats. Client-side date math over each game's case list. */
const ORDER = ["Casebook", "Diagnosis", "Sequence", "Ballpark", "Science Tank"];
const ICON = {
  // magnifier — deduction
  "Casebook": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l6 6"/></svg>`,
  // gauge — instrument panel
  "Diagnosis": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3.5 16a8.5 8.5 0 0 1 17 0"/><path d="M12 16l4.5-5.5"/><circle cx="12" cy="16" r="1.3" fill="currentColor" stroke="none"/></svg>`,
  // connected steps — ordering
  "Sequence": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="6" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="18" r="2"/><path d="M6.6 7.4 10.4 10.6M13.6 13.4 17.4 16.6"/></svg>`,
  // bars — estimation
  "Ballpark": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h16"/><path d="M7 20v-6M12 20v-10M17 20v-4"/></svg>`,
  // lightbulb — innovation bets
  "Science Tank": `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 18h5M10.5 21h3"/><path d="M12 3a6 6 0 0 0-3.8 10.6c.7.6 1.3 1.3 1.3 2.4h5c0-1.1.6-1.8 1.3-2.4A6 6 0 0 0 12 3z"/></svg>`,
};
const DESC = {
  "Casebook": "A Clue-style deduction game. Three scientists each give you a reading; from their combined evidence you settle who did it, where it happened, and what really occurred — rejecting both the sensational story and the do-nothing one.",
  "Diagnosis": "Step into a real instrumented system — a spacecraft, a reactor, a data center — and read the whole panel of gauges to find the one fault that fits every reading, not just the loudest alarm.",
  "Sequence": "Reconstruct how a real system, procedure, or event actually unfolds, step by step — putting the stages in the order that the physics, biology, or process truly demands.",
  "Ballpark": "Estimate a hard “how many / how much” quantity by placing real, sourced numbers into named factors — Fermi-style reasoning with the actual figures.",
  "Science Tank": "Invest across three concealed historical innovations. The reveal separates what paid off from what quietly changed the world without ever paying its backers.",
};
const START = Date.UTC(2026, 6, 1);
const DAY = 86400000;
function dayIndex() { return Math.floor((Date.now() - START) / DAY); }
function mod(n, m) { return ((n % m) + m) % m; }
function caseLink(g, c) { return g.fileLink ? g.link + c[3] : g.link + encodeURIComponent(c[0]); }
function fmtDate(ts) { return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function renderDaily() {
  const di = dayIndex();
  let html = "";
  for (const name of ORDER) {
    const g = GAMES[name];
    if (!g || !g.cases.length) continue;
    const N = g.cases.length;
    const today = g.cases[mod(di, N)];
    let arch = "";
    for (let k = 1; k <= 14; k++) {
      const c = g.cases[mod(di - k, N)];
      arch += `<a class="row arch-row" href="${caseLink(g, c)}"><span class="t">${esc(c[1])}</span><span class="go">${fmtDate(Date.now() - k * DAY)}</span></a>`;
    }
    const science = today[2] ? `<div class="ts">${esc(today[2])}</div>` : "";
    html += `<section class="game">
      <div class="ghead"><span class="mono">${ICON[name] || ""}</span><h2>${name}</h2></div>
      <p class="desc">${esc(DESC[name] || "")}</p>
      <div class="today">
        <div class="tk">Today's puzzle</div>
        <div class="tt">${esc(today[1])}</div>
        ${science}
        <div class="controls">
          <a class="btn primary" href="${caseLink(g, today)}">Play now →</a>
          <button class="btn ghost" data-t="arch">Archive</button>
        </div>
      </div>
      <div class="panel arch" hidden>${arch}</div>
    </section>`;
  }
  const root = document.getElementById("daily");
  root.innerHTML = html;
  root.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-t]");
    if (!b) return;
    const panel = b.closest(".today").parentElement.querySelector(".panel.arch");
    const opening = panel.hasAttribute("hidden");
    if (opening) panel.removeAttribute("hidden"); else panel.setAttribute("hidden", "");
    b.textContent = opening ? "Hide archive" : "Archive";
  });
}

async function renderStats() {
  const el = document.getElementById("statsBody");
  let s = null;
  try { const r = await fetch("/api/stats", { credentials: "same-origin" }); s = r.ok ? await r.json() : null; } catch (e) { s = null; }
  if (!s) { el.innerHTML = `<a href="/api/login">Sign in</a> to track your streak and stats across every game.`; return; }
  const st = s.streak || {};
  const total = (s.results || []).length;
  const grid = `<div class="statsgrid">
    <div class="statcard"><div class="n">${st.currentStreak || 0}</div><div class="l">Current streak</div></div>
    <div class="statcard"><div class="n">${st.longestStreak || 0}</div><div class="l">Longest streak</div></div>
    <div class="statcard"><div class="n">${total}</div><div class="l">Games finished</div></div>
    <div class="statcard"><div class="n">${s.wins || 0}</div><div class="l">Wins</div></div>
  </div>`;
  const rows = (s.byGame || []).map(b => `<tr><td>${esc(b.game)}</td><td>${b.played}</td><td>${b.wins}</td><td>${b.avgScore == null ? "—" : b.avgScore}</td></tr>`).join("");
  const table = rows
    ? `<table class="stbl"><thead><tr><th>Game</th><th>Finished</th><th>Wins</th><th>Avg score</th></tr></thead><tbody>${rows}</tbody></table>`
    : `<p class="muted">Finish a game and your stats will appear here.</p>`;
  el.innerHTML = grid + table;
}

renderDaily();
renderStats();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RECKON — Reasoning Games</title>
<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --ink:#1a1a17; --muted:#565651;
    --accent:#2f5d86; --hair:#e4e4e2; --chip:#f2f2f0; --hover:#f5f5f3;
    --serif:Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14140f; --panel:#1c1c16; --ink:#ece9df; --muted:#a6a598;
      --accent:#82b2d9; --hair:#2f2f26; --chip:#26261e; --hover:#22221a; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);line-height:1.55;font-size:17px;padding:0 20px}
  .wrap{max-width:760px;margin:0 auto;padding:6vh 0 12vh}
  a{color:var(--accent)}
  .brand{letter-spacing:.5px}
  h1{font-family:var(--serif);font-weight:700;font-size:40px;line-height:1.08;letter-spacing:-.5px;margin:0 0 10px}
  .lede{font-family:var(--sans);font-size:15px;color:var(--muted);margin:0 0 8px;max-width:52ch}
  .ghead h2{font-family:var(--serif);font-size:26px;margin:0 0 2px;letter-spacing:-.3px;border-bottom:2px solid var(--ink);padding-bottom:8px}
  section.game{margin:36px 0 0}
  .today-line{font-size:18px;margin:10px 0 0}.today-line b{font-weight:700}
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 0}
  .btn{font-family:var(--sans);font-size:14px;font-weight:650;border:1px solid var(--hair);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:5px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{opacity:.92}
  .btn.ghost{background:transparent}
  .panel{margin:12px 0 0;padding:12px 15px;background:var(--chip);border-radius:6px}
  .panel.info p{margin:0 0 7px;font-family:var(--sans);font-size:14.5px;color:var(--muted);line-height:1.5}
  .panel.info .sci{color:var(--ink)}
  .panel.arch{background:none;border-left:2px solid var(--hair);padding:2px 0 2px 12px}
  a.row{display:flex;align-items:baseline;gap:12px;padding:10px 6px 10px 2px;border-bottom:1px solid var(--hair);text-decoration:none;color:inherit}
  a.row:hover{background:var(--hover)}
  a.row .t{flex:1;font-size:15px}
  a.row .go{font-family:var(--sans);font-size:12px;color:var(--muted);white-space:nowrap}
  a.row:hover .go{color:var(--accent)}
  .mystats{margin-top:48px}
  .statsgrid{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 18px}
  .statcard{border:1px solid var(--hair);padding:12px 18px;min-width:120px}
  .statcard .n{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1}
  .statcard .l{font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:5px}
  .stbl{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:14px}
  .stbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--hair);padding:6px 10px 6px 0}
  .stbl td{padding:8px 10px 8px 0;border-bottom:1px solid var(--hair)}
  .muted{color:var(--muted)}
  footer{color:var(--muted);font-size:13px;margin-top:48px;font-family:var(--sans)}
  @media (max-width:620px){ h1{font-size:32px} body{font-size:16px} }
</style>
</head>

/* Minimalist daily hub: per game -> See today's info / Play now / Archive,
   plus a My stats section. Client-side date math over each game's case list. */
const ORDER = ["Casebook", "Diagnosis", "Sequence", "Ballpark", "Science Tank"];
const DESC = {
  "Casebook": "A Clue-style deduction — from three scientists' readings, settle who, where, and what really happened.",
  "Diagnosis": "Enter a real instrumented system and find the cause that fits the entire panel.",
  "Sequence": "Reconstruct how a system, procedure, or event actually unfolds, step by step.",
  "Ballpark": "Estimate a hard “how many / how much” quantity by placing real numbers into named factors.",
  "Science Tank": "Invest across three concealed historical innovations; the reveal separates what paid off from what changed the world without paying at all.",
};
const START = Date.UTC(2026, 6, 1);   // Day 1 = 2026-07-01
const DAY = 86400000;
function dayIndex() { return Math.floor((Date.now() - START) / DAY); }
function mod(n, m) { return ((n % m) + m) % m; }
function caseLink(g, c) { return g.fileLink ? g.link + c[3] : g.link + encodeURIComponent(c[0]); }
function fmtDate(ts) { return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function renderDaily() {
  const di = dayIndex();
  let html = "";
  for (const name of ORDER) {
    const g = GAMES[name];
    if (!g || !g.cases.length) continue;
    const N = g.cases.length;
    const today = g.cases[mod(di, N)];
    let arch = "";
    for (let k = 1; k <= 14; k++) {
      const c = g.cases[mod(di - k, N)];
      arch += `<a class="row arch-row" href="${caseLink(g, c)}"><span class="t">${esc(c[1])}</span><span class="go">${fmtDate(Date.now() - k * DAY)}</span></a>`;
    }
    const science = today[2] ? `<p class="sci"><b>Science area:</b> ${esc(today[2])}</p>` : "";
    html += `<section class="game">
      <div class="ghead"><h2>${name}</h2></div>
      <div class="today-line">Today · <b>${esc(today[1])}</b></div>
      <div class="controls">
        <button class="btn ghost" data-t="info">See today's info</button>
        <a class="btn primary" href="${caseLink(g, today)}">Play now →</a>
        <button class="btn ghost" data-t="arch">Archive</button>
      </div>
      <div class="panel info" hidden><p>${esc(DESC[name] || "")}</p>${science}</div>
      <div class="panel arch" hidden>${arch}</div>
    </section>`;
  }
  const root = document.getElementById("daily");
  root.innerHTML = html;
  root.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-t]");
    if (!b) return;
    const sec = b.closest("section");
    const panel = sec.querySelector(".panel." + b.dataset.t);
    const opening = panel.hasAttribute("hidden");
    if (opening) panel.removeAttribute("hidden"); else panel.setAttribute("hidden", "");
    if (b.dataset.t === "info") b.textContent = opening ? "Hide info" : "See today's info";
    else b.textContent = opening ? "Hide archive" : "Archive";
  });
}

async function renderStats() {
  const el = document.getElementById("statsBody");
  let s = null;
  try { const r = await fetch("/api/stats", { credentials: "same-origin" }); s = r.ok ? await r.json() : null; } catch (e) { s = null; }
  if (!s) { el.innerHTML = `<a href="/api/login">Sign in</a> to track your streak and stats across every game.`; return; }
  const st = s.streak || {};
  const total = (s.results || []).length;
  const grid = `<div class="statsgrid">
    <div class="statcard"><div class="n">${st.currentStreak || 0}</div><div class="l">Current streak</div></div>
    <div class="statcard"><div class="n">${st.longestStreak || 0}</div><div class="l">Longest streak</div></div>
    <div class="statcard"><div class="n">${total}</div><div class="l">Games finished</div></div>
    <div class="statcard"><div class="n">${s.wins || 0}</div><div class="l">Wins</div></div>
  </div>`;
  const rows = (s.byGame || []).map(b => `<tr><td>${esc(b.game)}</td><td>${b.played}</td><td>${b.wins}</td><td>${b.avgScore == null ? "—" : b.avgScore}</td></tr>`).join("");
  const table = rows
    ? `<table class="stbl"><thead><tr><th>Game</th><th>Finished</th><th>Wins</th><th>Avg score</th></tr></thead><tbody>${rows}</tbody></table>`
    : `<p class="muted">Finish a game and your stats will appear here.</p>`;
  el.innerHTML = grid + table;
}

renderDaily();
renderStats();
</script>

#game>section{margin-bottom:16px}
.card.mapcard{overflow:visible}

/* Generous padding frames the schematic so the value boxes sit outside the
   diagram border — a column down each side and a row across the bottom,
   clear of the instruments drawn in the middle. */
.diagram{position:relative;max-width:1020px;margin:0 auto;padding:20px 186px 156px}
.diagram svg{width:100%;height:auto;display:block;border-radius:15px;background:linear-gradient(180deg,#f7f7f5,#f7f7f5)}
.chips{position:absolute;inset:20px 186px 156px;pointer-events:none}
.chip{position:absolute;pointer-events:auto;width:158px;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 5px 16px rgba(20,50,70,.14);padding:9px 10px;text-align:center;cursor:default;z-index:3}
/* each edge anchors the box just outside the border and grows it away from
   the picture (vertical position set inline for the side columns, horizontal
   for the bottom row) */
.chip.left{left:0;transform:translate(-100%,-50%);margin-left:-18px}
.chip.right{left:100%;transform:translate(0,-50%);margin-left:18px}
.chip.bottom{top:100%;transform:translate(-50%,0);margin-top:16px}
.chip:hover{border-color:var(--cyan);box-shadow:0 10px 26px rgba(20,50,70,.28);z-index:40}
.chip .clab{display:block;font-size:9px;font-weight:850;text-transform:uppercase;letter-spacing:.05em;color:var(--cyan)}
.chip .cval{display:block;font-size:12px;font-weight:850;line-height:1.22;margin-top:3px;letter-spacing:-.01em;color:var(--text);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chip .cref{display:block;font-size:8.5px;color:var(--amber);margin-top:4px;text-transform:uppercase;letter-spacing:.02em;line-height:1.3;white-space:normal;overflow-wrap:anywhere}
.chip .cpurpose{margin:7px 0 0;padding-top:7px;border-top:1px solid var(--line);font-size:9.5px;line-height:1.4;color:var(--muted);text-align:left}
.chip .tip{position:absolute;left:50%;bottom:calc(100% + 9px);transform:translateX(-50%);width:210px;background:#0d2733;color:#eaf3f8;border-radius:10px;padding:9px 11px;font-size:11px;line-height:1.45;text-align:left;box-shadow:0 12px 32px rgba(0,0,0,.35);opacity:0;visibility:hidden;transition:opacity .12s;z-index:50;pointer-events:none}
.chip .tip b{color:#fff}
.chip .tip .tipread{display:inline-block;margin:3px 0;color:#9fd0ea;font-weight:700}
.chip:hover .tip{opacity:1;visibility:visible}
.chip .tip::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#0d2733}
.chip.bottom .tip{bottom:auto;top:calc(100% + 9px)}
.chip.bottom .tip::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:#0d2733}
.chip.left .tip{left:0;right:auto;transform:none}
.chip.left .tip::after{left:16px;right:auto;transform:none}
.chip.right .tip{left:auto;right:0;transform:none}
.chip.right .tip::after{left:auto;right:14px;transform:none}
@media(max-width:760px){
 .diagram{max-width:none;padding:6px}
 .chips{position:static;inset:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;pointer-events:auto}
 .chip{position:static;transform:none!important;margin:0!important;width:auto}
 .chip .cval{-webkit-line-clamp:unset}
 .chip .tip{position:static;opacity:1;visibility:visible;transform:none;width:auto;margin-top:7px;background:#f2f2f0;color:#565651;box-shadow:none}
 .chip .tip::after{display:none}
}

the loud reading works:</b> only the firemain casualty combines compartment flooding with a large firemain-pressure loss.","quiet":"<b>Why the quiet readings confirm it:</b> normal cooling pressure and tank soundings eliminate two other seawater systems, while branch isolation stops the source."},"chain":["Firemain branch ruptures","Pressurized seawater enters the compartment","Local isolation stops ingress and dewatering recovers"],"take":"Use system pressure plus isolation response to trace flooding back to the pipe that supplied it."},"logic":[["Bilge level rising + seawater salinity","Hull, firemain, cooling, or ballast source remains"],["Firemain pressure low","Firemain rupture becomes the direct system explanation"],["Cooling pressure and ballast soundings normal","Cooling and ballast explanations fail"],["Firemain isolation stops ingress","Firemain rupture remains"]]},{"answer":"cooling","alarm":"cooling","poleA":{"lab":"Cooling branch","val":"46 psi → 18 psi","note":"Pressure falls only on the port seawater-cooling loop."},"hook":"During a high-load engineering watch, water begins spraying from behind a machinery skid. Firemain pressure remains normal.","riddle":"The bilge rise is real and salty. <span class=\"q\">Which sea-connected system is losing pressure, and does isolating it stop the leak?</span>","vals":{"level":{"observed":"2 cm → 14 cm in 7 min","reference":"Alarm at 5 cm"},"salinity":{"observed":"32 practical salinity units","reference":"Seawater-like above 28"},"firemain":{"observed":"148 psi steady","reference":"Normal 135–165 psi"},"cooling":{"observed":"46 → 18 psi on port loop","reference":"Normal 40–50 psi"},"isolation":{"observed":"Spray stops after port cooler inlet and outlet shut","reference":"No change if hull source"},"list":{"observed":"0.4° port, improving under pumping","reference":"Investigate above 1.0°"},"ballast":{"observed":"All tanks unchanged","reference":"No transfer ordered"},"pump":{"observed":"19 m³/h discharge; level receding","reference":"Rated 20 m³/h"},"redundant":{"observed":"13.4 cm","reference":"Agreement target ±1 cm"},"adjacent":{"observed":"Dry","reference":"No boundary leakage expected"}},"reasons":{"hull":"A hull breach would continue after closing the cooler inlet and outlet; here the spray stops.","firemain":"Firemain pressure is normal and firemain isolation is not what changed the leak.","ballastx":"No ballast tank or valve position changes accompany the event.","sensor":"Two level channels, salty conductivity, visible spray, and pump discharge confirm real water.","pumpfail":"The pump is producing near-rated flow; the problem is a pressurized source, not failed dewatering.","normal":"A maintenance drain is not a high-pressure spray and would be documented and finite."},"resolve":{"title":"Ruptured seawater-cooling branch","paras":["Only the port cooling loop loses pressure. The firemain and ballast system stay normal, and closing both sides of the cooler branch stops the spray.","Because the source is isolated and the bilge pump is healthy, the water level begins to fall without progressive flooding."],"why":{"loud":"<b>Why the loud reading works:</b> the affected cooling loop loses pressure while the other seawater systems remain steady.","quiet":"<b>Why the quiet readings confirm it:</b> two-sided branch isolation stops the leak, proving the source lies inside that piping boundary."},"chain":["Cooling pipe fails","Sea-connected loop sprays into machinery room","Inlet and outlet isolation stop the source"],"take":"A pressure loss identifies the candidate system; an isolation test proves the boundary."},"logic":[["Real salty flooding","Hull, firemain, cooling, or ballast source remains"],["Cooling pressure low while firemain normal","Cooling branch is singled out"],["Ballast soundings unchanged","Ballast transfer fails"],["Cooling isolation stops spray","Cooling-line rupture remains"]]},{"answer":"hull","alarm":"level","poleA":{"lab":"Flooding rate","val":"0.9 m³/min after all local systems isolated","note":"Water continues to enter from low on the shell side."},"hook":"After a collision with floating debris, a low compartment reports rapid flooding. All local seawater piping can be isolated, but the level keeps climbing.","riddle":"Every ship system now reads normal. <span class=\"q\">Does continuing seawater ingress prove the source is outside the piping system?</span>","vals":{"level":{"observed":"4 cm → 38 cm in 12 min","reference":"Alarm at 5 cm"},"salinity":{"observed":"34 practical salinity units","reference":"Seawater-like above 28"},"firemain":{"observed":"151 psi steady","reference":"Normal 135–165 psi"},"cooling":{"observed":"45 psi steady","reference":"Normal 40–50 psi"},"isolation":{"observed":"No rate change after firemain, cooling, and ballast isolation","reference":"A piping source should slow or stop"},"list":{"observed":"0.2° → 1.3° starboard","reference":"Investigate above 1.0°"},"ballast":{"observed":"All soundings unchanged","reference":"No transfer ordered"},"pump":{"observed":"20 m³/h discharge; estimated ingress 54 m³/h","reference":"Rated 20 m³/h"},"redundant":{"observed":"37 cm","reference":"Agreement target ±1 cm"},"adjacent":{"observed":"Dry but boundary head rising","reference":"Progressive flooding not yet present"}},"reasons":{"firemain":"A firemain source should lower firemain pressure and respond to branch isolation; neither occurs.","cooling":"Cooling pressure is normal and cooling isolation does not change the rate.","ballastx":"Tank soundings remain fixed and ballast isolation does not change ingress.","sensor":"Independent level, salinity, list, and pump discharge all prove physical water.","pumpfail":"The pump is at rated discharge; it is simply smaller than the measured ingress.","normal":"A documented drain cannot sustain a 54 m³/h rate or produce increasing list after all system isolation."},"resolve":{"title":"Hull breach below the waterline","paras":["Seawater continues entering at roughly 54 m³/h after every local sea-connected piping system is isolated. System pressures and tank soundings remain normal, so the source lies outside those networks.","The bilge pump is healthy but undersized for the casualty. Increasing list and independent level agreement show a growing off-center flood that requires patching, shoring, and boundary control."],"why":{"loud":"<b>Why the loud readings tie:</b> several casualties can produce salty water and a rising bilge.","quiet":"<b>Why the quiet readings decide it:</b> normal system pressures plus no response to isolation remove every internal seawater path, leaving the shell boundary."},"chain":["Shell plating is opened below the waterline","External sea pressure drives continuous ingress","Pumping cannot keep up until the hull opening is controlled"],"take":"When every internal source is isolated and the rate persists, move the causal boundary outward to the hull."},"logic":[["Seawater and rising level","Several seawater sources remain"],["All system pressures normal","Firemain and cooling ruptures fail"],["Ballast soundings unchanged","Ballast transfer fails"],["No change after all system isolation","Hull breach remains"]]}],"schematic":{"viewBox":"0 0 520 390","svg":"<defs><linearGradient id=\"seaBg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#cfe6f0\"/><stop offset=\"1\" stop-color=\"#a7cfe0\"/></linearGradient><marker id=\"seaArrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#0d6b8f\"/></marker><style>.clean-border{fill:url(#seaBg);stroke:#8cacbd;stroke-width:2}.room{fill:#eef5f9;stroke:#3b5e6f;stroke-width:2}.component{fill:#b2d1e4;stroke:#3b5e6f;stroke-width:1.7}.component2{fill:#9ec6db;stroke:#3b5e6f;stroke-width:1.7}.water{fill:#7fb6d4;stroke:none;opacity:.85}.flow{fill:none;stroke:#0d6b8f;stroke-width:3;marker-end:url(#seaArrow)}.pipe{fill:none;stroke:#5b7d8e;stroke-width:6;stroke-linecap:round}.bulk{stroke:#2f4a58;stroke-width:6;stroke-linecap:round}.leader{fill:none;stroke:#547080;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;opacity:.78}.anchor{fill:#375565}.slabel{fill:#08303f;font:700 10px Inter,system-ui,sans-serif}.labelbg{fill:#e2eff6;stroke:#96b8ca;stroke-width:1;opacity:.95}.breach{fill:none;stroke:#b23a2e;stroke-width:2.4;stroke-linejoin:round}</style></defs><rect x=\"12\" y=\"12\" width=\"496\" height=\"366\" rx=\"24\" class=\"clean-border\"/><rect x=\"55\" y=\"118\" width=\"310\" height=\"205\" rx=\"8\" class=\"room\"/><path d=\"M57 258 q12 -6 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 V321 H57 Z\" class=\"water\"/><line x1=\"365\" y1=\"120\" x2=\"365\" y2=\"321\" class=\"bulk\"/><rect x=\"372\" y=\"262\" width=\"120\" height=\"58\" rx=\"6\" class=\"component2\"/><rect x=\"400\" y=\"152\" width=\"70\" height=\"82\" rx=\"6\" class=\"component\"/><path d=\"M406 178 H464 M406 205 H464\" stroke=\"#3b5e6f\" stroke-width=\"2\"/><path d=\"M110 96 V140\" class=\"pipe\"/><circle cx=\"110\" cy=\"140\" r=\"13\" class=\"component\"/><path d=\"M110 140 L117 133\" stroke=\"#08303f\" stroke-width=\"2\"/><path d=\"M230 96 V140\" class=\"pipe\"/><circle cx=\"230\" cy=\"140\" r=\"13\" class=\"component\"/><path d=\"M230 140 L237 133\" stroke=\"#08303f\" stroke-width=\"2\"/><path d=\"M308 140 L332 164 L308 164 L332 140 Z\" class=\"component\"/><path d=\"M430 108 a20 20 0 0 1 40 0\" fill=\"none\" stroke=\"#3b5e6f\" stroke-width=\"2\"/><line x1=\"450\" y1=\"108\" x2=\"458\" y2=\"94\" stroke=\"#b23a2e\" stroke-width=\"2.4\"/><circle cx=\"450\" cy=\"108\" r=\"2.6\" class=\"anchor\"/><path d=\"M138 323 l6 -8 l6 8 l6 -8 l6 8\" class=\"breach\"/><path d=\"M150 345 V326\" class=\"flow\"/><rect x=\"86\" y=\"250\" width=\"18\" height=\"20\" rx=\"3\" class=\"component\"/><rect x=\"291\" y=\"250\" width=\"18\" height=\"20\" rx=\"3\" class=\"component\"/><circle cx=\"175\" cy=\"296\" r=\"9\" class=\"component2\"/><circle cx=\"250\" cy=\"300\" r=\"13\" class=\"component\"/><path d=\"M250 300 L250 289 M250 300 L259 305 M250 300 L241 305\" stroke=\"#08303f\" stroke-width=\"2\"/><path d=\"M 110 362 L 110 260 L 95 260\" class=\"leader\"/><circle cx=\"95\" cy=\"260\" r=\"2.4\" class=\"anchor\"/><path d=\"M 185 362 L 185 296 L 175 296\" class=\"leader\"/><circle cx=\"175\" cy=\"296\" r=\"2.4\" class=\"anchor\"/><path d=\"M 140 30 L 140 140 L 110 140\" class=\"leader\"/><circle cx=\"110\" cy=\"140\" r=\"2.4\" class=\"anchor\"/><path d=\"M 250 30 L 250 140 L 230 140\" class=\"leader\"/><circle cx=\"230\" cy=\"140\" r=\"2.4\" class=\"anchor\"/><path d=\"M 360 30 L 360 152 L 320 152\" class=\"leader\"/><circle cx=\"320\" cy=\"152\" r=\"2.4\" class=\"anchor\"/><path d=\"M 490 80 L 450 80 L 450 108\" class=\"leader\"/><circle cx=\"450\" cy=\"108\" r=\"2.4\" class=\"anchor\"/><path d=\"M 490 195 L 452 195 L 452 195\" class=\"leader\"/><circle cx=\"452\" cy=\"195\" r=\"2.4\" class=\"anchor\"/><path d=\"M 260 362 L 260 300 L 250 300\" class=\"leader\"/><circle cx=\"250\" cy=\"300\" r=\"2.4\" class=\"anchor\"/><path d=\"M 330 362 L 330 260 L 300 260\" class=\"leader\"/><circle cx=\"300\" cy=\"260\" r=\"2.4\" class=\"anchor\"/><path d=\"M 490 300 L 372 300 L 372 290\" class=\"leader\"/><circle cx=\"372\" cy=\"290\" r=\"2.4\" class=\"anchor\"/><g><rect x=\"77\" y=\"160\" width=\"66\" height=\"20\" rx=\"10\" class=\"labelbg\"/><text x=\"110\" y=\"174\" text-anchor=\"middle\" class=\"slabel\">firemain</text></g><g><rect x=\"200\" y=\"160\" width=\"59\" height=\"20\" rx=\"10\" class=\"labelbg\"/><text x=\"230\" y=\"174\" text-anchor=\"middle\" class=\"slabel\">cooling</text></g><g><rect x=\"284\" y=\"177\" width=\"72\" height=\"20\" rx=\"10\" class=\"labelbg\"/><text x=\"320\" y=\"191\" text-anchor=\"middle\" class=\"slabel\">isolation</text></g><g><rect x=\"426\" y=\"117\" width=\"48\" height=\"20\" rx=\"10\" class=\"labelbg\"/><text x=\"450\" y=\"131\" text-anchor=\"middle\" class=\"slabel\">list</text></g><g><rect x=\"405\" y=\"237\" width=\"59\" height=\"20\" rx=\"10\" class=\"labelbg\"/><text x=\"435\" y=\"251\" text-anchor=\"middle\" class=\"slabel\">ballast</text></g><g><rect x=\"386\" y=\"281\" width=\"92\" height=\"20\" rx=\"10\" class=\"labelbg\"/><text x=\"432\" y=\"295\" text-anchor=\"middle\" class=\"slabel\">adjacent</text></g><g><rect x=\"103\" y=\"291\" width=\"46\" height=\"20\" rx=\"10\" class=\"labelbg\"/><text x=\"126\" y=\"305\" text-anchor=\"middle\" class=\"slabel\">hull</text></g><g><rect x=\"224\" y=\"265\" width=\"52\" height=\"20\" rx=\"10\" class=\"labelbg\"/><text x=\"250\" y=\"279\" text-anchor=\"middle\" class=\"slabel\">pump</text></g>"},"scopeNote":"The values are fictional training data chosen to make system-boundary reasoning explicit. They are not ship-class procedures or casualty-control limits."};
const ids=Object.keys(PACK.readings), letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const SHORT={level:'Bilge level',salinity:'Salinity',firemain:'Firemain',cooling:'Cooling',isolation:'Isolation',list:'List',ballast:'Ballast',pump:'Bilge pump',redundant:'2nd level',adjacent:'Adjacent'};
// Which edge each reading's box sits on, and its position (%) along that edge.
const LAYOUT={firemain:{edge:'left',pos:16},cooling:{edge:'left',pos:50},isolation:{edge:'left',pos:84},list:{edge:'right',pos:16},ballast:{edge:'right',pos:50},adjacent:{edge:'right',pos:84},level:{edge:'bottom',pos:12},salinity:{edge:'bottom',pos:37},pump:{edge:'bottom',pos:63},redundant:{edge:'bottom',pos:88}};
let roundIndex=0,score=0,answered=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setupIntro(){document.getElementById('introTitle').textContent=PACK.intro.title;document.getElementById('introLead').textContent=PACK.intro.lead;const sn=document.getElementById('scopeNote');if(PACK.scopeNote){sn.textContent=PACK.scopeNote;sn.classList.remove('hidden')}else sn.classList.add('hidden');document.getElementById('introGrid').innerHTML=PACK.intro.cards.map(c=>`<div class="introitem"><h3>${esc(c.title)}</h3><p>${esc(c.body)}</p></div>`).join('');document.getElementById('introTake').innerHTML=`<b>${esc(PACK.intro.takeaway)}</b>`}
function setupMap(){document.getElementById('map').innerHTML=PACK.schematic.svg;}
function isCompound(r){return Array.isArray(r.compound)&&r.compound.length===2}
function renderRound(){answered=false;const r=PACK.rounds[roundIndex],multi=isCompound(r);document.getElementById('roundPill').textContent=`Round ${roundIndex+1} / ${PACK.rounds.length}`;document.getElementById('scorePill').textContent=`Score ${score} / ${PACK.rounds.length}`;const choices=Object.entries(PACK.hypotheses);document.getElementById('briefBody').innerHTML=`<p class="hook">${esc(r.hook)}</p><div class="riddle">${r.riddle}</div>`;document.getElementById('chips').innerHTML=ids.map(id=>{const rd=PACK.readings[id],v=r.vals[id],L=LAYOUT[id]||{edge:'bottom',pos:50};const posStyle=L.edge==='bottom'?`left:${L.pos}%`:`top:${L.pos}%`;return `<div class="chip ${L.edge}" style="${posStyle}"><span class="clab">${esc(SHORT[id]||rd.name)}</span><span class="cval">${esc(v.observed)}</span><span class="cref">${esc(v.reference)}</span><p class="cpurpose">${esc(rd.purpose)}</p></div>`}).join('');document.getElementById('choiceBody').innerHTML=`${multi?'<div class="multihelp">Select one or two causes, then submit. Two independently supported processes may be true at once.</div>':''}<div class="choices">${choices.map(([id,h],i)=>`<button class="choice" data-id="${id}"><span class="letter">${letters[i]}</span><span class="choicecopy"><span class="ctitle">${esc(h.label)}</span><span class="cdesc">${esc(h.choice)}</span></span></button>`).join('')}</div><div id="feedback" class="feedback"></div>${multi?'<button id="submitBtn" class="submit">Submit selected causes</button>':''}<button id="nextBtn" class="next">${roundIndex===PACK.rounds.length-1?'See final score':'Next round'}</button>`;
if(multi){const selected=new Set();document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(answered)return;const id=b.dataset.id;if(selected.has(id)){selected.delete(id);b.classList.remove('selected')}else if(selected.size<2){selected.add(id);b.classList.add('selected')}});document.getElementById('submitBtn').onclick=()=>answerMulti([...selected]);}else document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answerSingle(b.dataset.id,b));
document.getElementById('nextBtn').onclick=nextRound;
const res=document.getElementById('resolution');res.className='card resolution';res.innerHTML='';window.scrollTo({top:0,behavior:'smooth'})}
function reveal(r){const res=document.getElementById('resolution');res.className='card resolution show';res.innerHTML=`<h2>${esc(r.resolve.title)}</h2>${r.resolve.paras.map(p=>`<p>${p}</p>`).join('')}<div class="why"><div>${r.resolve.why.loud}</div><div>${r.resolve.why.quiet}</div></div><div class="logic"><h3>How the evidence narrows</h3>${r.logic.map(x=>`<div class="logicrow"><div class="logicclue">${esc(x[0])}</div><div class="arrow">→</div><div class="logicresult">${esc(x[1])}</div></div>`).join('')}</div><div class="chain">${r.resolve.chain.map((x,i)=>`<span class="node">${esc(x)}</span>${i<r.resolve.chain.length-1?'<span class="arrow">→</span>':''}`).join('')}</div><div class="take">${esc(r.resolve.take)}</div>`;document.getElementById('nextBtn').classList.add('show');res.scrollIntoView({behavior:'smooth',block:'start'})}
function answerSingle(id,btn){if(answered)return;answered=true;const r=PACK.rounds[roundIndex],ok=id===r.answer;if(ok)score++;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.id===r.answer)b.classList.add('correct');else if(b===btn)b.classList.add('wrong')});const f=document.getElementById('feedback');f.className='feedback show '+(ok?'good':'bad');const reason=ok?PACK.hypotheses[r.answer].call.arg:r.reasons[id];f.innerHTML=`<h3>${ok?'Correct':'Not quite'} — ${esc(r.resolve.title)}</h3><p>${esc(reason)}</p>`;document.getElementById('scorePill').textContent=`Score ${score} / ${PACK.rounds.length}`;reveal(r)}
function answerMulti(sel){if(answered)return;const r=PACK.rounds[roundIndex],need=r.compound;if(sel.length<1){const f=document.getElementById('feedback');f.className='feedback show bad';f.innerHTML='<h3>Select at least one cause</h3><p>You may choose up to two causes in this round.</p>';return}answered=true;const ok=sel.length===2&&need.every(x=>sel.includes(x));if(ok)score++;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;b.classList.remove('selected');if(need.includes(b.dataset.id))b.classList.add('correct');else if(sel.includes(b.dataset.id))b.classList.add('wrong')});const f=document.getElementById('feedback');f.className='feedback show '+(ok?'good':'bad');let msg;if(ok)msg=`Correct pair: ${need.map(x=>PACK.hypotheses[x].label).join(' + ')}. Each cause explains a separate evidence chain.`;else if(sel.length===1)msg='One cause leaves an independently confirmed part of the panel unexplained.';else{const wrong=sel.find(x=>!need.includes(x));msg=(wrong&&r.reasons[wrong])||'That pair does not cover the whole panel.'}f.innerHTML=`<h3>${ok?'Correct':'Not quite'} — ${esc(r.resolve.title)}</h3><p>${esc(msg)}</p>`;document.getElementById('scorePill').textContent=`Score ${score} / ${PACK.rounds.length}`;document.getElementById('submitBtn').style.display='none';reveal(r)}
function nextRound(){if(roundIndex<PACK.rounds.length-1){roundIndex++;renderRound()}else{try{reckonReport({game:'Diagnosis',gameId:'nc_flooding',gameTitle:PACK.title,won:score>=Math.ceil(PACK.rounds.length*0.6),score:score});}catch(e){}document.getElementById('game').innerHTML=`<section class="card complete"><div class="eyebrow">Shift complete</div><h2>${score} / ${PACK.rounds.length}</h2><p>You used the full panel to combine clues, break ties, and trace each flooding casualty back to its source.</p><button class="restart" onclick="location.reload()">Play again</button></section>`;window.scrollTo({top:0,behavior:'smooth'})}}
document.getElementById('startBtn').onclick=()=>{document.getElementById('introScreen').classList.add('hidden');document.getElementById('game').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};
document.getElementById('guideBtn').onclick=()=>{document.getElementById('introScreen').classList.remove('hidden');document.getElementById('game').classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})};
setupIntro();setupMap();const lt=document.getElementById('legendToggle');if(lt)lt.onclick=()=>{const lg=document.getElementById('legend');const open=lg.classList.toggle('open');lt.textContent=open?'Hide sensor key':'Show sensor key'};renderRound();
</script></body></html>

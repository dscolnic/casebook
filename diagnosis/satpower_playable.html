const PACK={"id":"satpower","title":"Power Margin","domain":"Spacecraft electrical power","role":"You are the spacecraft power-systems controller.","intro":{"title":"How this system works","lead":"A solar-powered spacecraft must continuously balance generation, storage, and load. Solar arrays power the bus in sunlight and charge the battery; the battery supports the bus during eclipse or when demand briefly exceeds array output. Voltage regulation keeps sensitive electronics inside a narrow operating band.","cards":[{"title":"How power flows","body":"Sunlight becomes array current, regulators hold the main bus voltage, loads draw power, and the battery absorbs or supplies the difference."},{"title":"How failures appear","body":"Shadowing reduces array current, a load surge increases demand, and battery aging raises internal resistance so voltage sags even at ordinary current."},{"title":"What telemetry measures","body":"Bus voltage, array current, battery current, load commands, temperature, and resistance estimates reveal whether the problem is generation, demand, storage, or instrumentation."},{"title":"Why context matters","body":"Battery discharge during a planned eclipse is normal. A single biased current channel can also imitate a power imbalance, so controllers compare redundant measurements and Sun geometry."}],"takeaway":"The loud reading gets your attention, but the right explanation is the one that fits the whole panel."},"system":{"parts":[["Solar array","Generates electrical power when illuminated and correctly pointed."],["Power regulator","Conditions array output and holds the spacecraft bus near its design voltage."],["Battery","Stores energy and supports the bus during eclipse or short demand peaks."],["Loads","Payloads, heaters, communications, and actuators consume commanded power."],["Telemetry","Redundant current, voltage, temperature, and attitude data close the power balance."]],"soWrong":"A low bus voltage can come from weak generation, exces y.","call":{"title":"Resistance-estimator bias","arg":"Recompute resistance from raw pulse telemetry."},"sig":{"busv":"normal","battcur":"normal","array":"normal","load":"normal","battemp":"normal","resist":"high","sun":"sunlit","cur2":"agree","command":"none","relax":"normal","switch":"normal","eventflag":"none"}}},"dismissal":"authorized","reassuring":{"lab":"Power controller","val":"REGULATION LOOP ACTIVE","note":"The regulator can remain active while generation, demand, or battery margin is already deteriorating."},"rounds":[{"answer":"battery","alarm":"resist","poleA":{"lab":"Source impedance","val":"Resistance estimate 118 mΩ; ordinary −8.4 A discharge","note":"The same current now produces more internal loss and slower recovery."},"hook":"During a routine communications pass, the bus sags more than expected even though the payload configuration and solar input are unchanged.","riddle":"The battery current is not unusually high. <span class=\"q\">Why is the same current now producing a larger voltage loss?<\/span>","vals":{"busv":{"observed":"28.0 → 25.6 V / 90 s","reference":"Normal regulated band 27.2–28.4 V"},"battcur":{"observed":"−8.4 A discharge","reference":"Typical sunlit transient −6 to −10 A"},"array":{"observed":"31.2 A","reference":"Expected 29–33 A"},"load":{"observed":"612 W","reference":"Commanded 605–620 W"},"battemp":{"observed":"22.1 → 28.7°C / 14 min","reference":"Typical 18–25°C"},"resist":{"observed":"118 mΩ","reference":"Baseline 61–74 mΩ"},"sun":{"observed":"0.8° array-Sun error","reference":"Normal <2.0°"},"cur2":{"observed":"−8.1 A","reference":"Agreement target ±0.6 A"},"command":{"observed":"No extra-load command","reference":"All loads require logged command"},"relax":{"observed":"19 s to recover 90%","reference":"Healthy 5–8 s"},"switch":{"observed":"All payload switches nominal","reference":"Only commanded loads closed"},"eventflag":{"observed":"No active anomaly","reference":"Normal none"}},"reasons":{"loadsurge":"A load surge would produce high battery current and a higher commanded or measured load. Both remain ordinary.","shadow":"Shadowing would lower array current or show poor Sun geometry; array output and pointing are normal.","authorized":"A scheduled calibration can warm the battery under load, but current is not high and no authorization exists.","resistbias":"It explains high estimated resistance alone, not slow pulse recovery, battery heating, and bus sag.","relaxbias":"It explains slow recovery alone, not high resistance and heating."},"resolve":{"title":"Battery degradation","paras":["The resistance estimate has nearly doubled, and the battery warms while supplying an ordinary 8 A transient. The increased internal voltage drop pulls the bus below its regulated band.","Low bus voltage is shared by load and generation problems; normal battery current is shared by a benign sensor scenario. Only their pair—voltage down at ordinary current—isolates lost battery margin."],"why":{"loud":"<b>Why the headline pair works:<\/b> the bus sags without the heavy current expected from excess demand or missing generation.","quiet":"<b>Why the quiet readings confirm it:<\/b> high resistance and temperature directly identify battery aging."},"chain":["Internal resistance increases","Ordinary discharge creates larger internal loss","Bus voltage sags and battery heats"],"take":"A voltage problem with ordinary current points to the source impedance, not necessarily the load."},"logic":[["Bus voltage down","Battery, load, or generation problem remain"],["Battery current ordinary","Large load and shadowing weaken"],["Resistance high","Battery degradation or resistance-estimator bias remain"],["Slow pulse recovery + battery heating","Battery degradation remains"]]},{"answer":"loadsurge","alarm":"load","poleA":{"lab":"Demand state","val":"1.18 kW measured; 640 W commanded","note":"A real branch has energized beyond the planned spacecraft load."},"hook":"A payload mode transition coincides with a sudden bus sag and heavy battery discharge.","riddle":"The extra electrical demand is physically present. <span class=\"q\">What energized it, and does the command history authorize that state?<\/span>","vals":{"busv":{"observed":"28.1 → 25.9 V / 12 s","reference":"Normal regulated band 27.2–28.4 V"},"battcur":{"observed":"−24.8 A discharge","reference":"Typical sunlit transient −6 to −10 A"},"array":{"observed":"31.0 A","reference":"Expected 29–33 A"},"load":{"observed":"1.18 kW; command 640 W","reference":"Normal 590–680 W"},"battemp":{"observed":"23.0°C","reference":"Typical 18–25°C"},"resist":{"observed":"69 mΩ","reference":"Baseline 61–74 mΩ"},"sun":{"observed":"1.1° array-Sun error","reference":"Normal <2.0°"},"cur2":{"observed":"−24.4 A","reference":"Agreement target ±0.6 A"},"command":{"observed":"No payload activation command","reference":"All loads require logged command"},"relax":{"observed":"6 s to recover 90%","reference":"Healthy 5–8 s"},"switch":{"observed":"Heater bank H3 closed","reference":"May be planned or uncommanded"},"eventflag":{"observed":"Unexpected-power event active","reference":"Scheduled tests marked planned"}},"reasons":{"battery":"A degraded battery can sag at ordinary current, but current here is nearly three times the normal transient and resistance remains baseline.","shadow":"Shadowing shares the low-voltage, high-discharge pair, but array current and Sun pointing remain normal.","authorized":"It shares normal array power, high load, and strong battery discharge, but the command record shows no scheduled calibration.","resistbias":"A resistance estimate problem does not close a payload switch or double actual load.","relaxbias":"A pulse-timing problem does not double load."},"resolve":{"title":"Uncommanded load surge","paras":["The array continues generating normally, but measured load jumps to 1.18 kW against a 640 W command. The battery supplies the shortfall, pulling the bus down.","Array current alone cannot distinguish an uncommanded load from a planned calibration. Missing authorization alone cannot distinguish excess load from lost generation. Those two quiet readings together force the load-surge diagnosis."],"why":{"loud":"<b>Why the loud readings tie:<\/b> both lost generation and excess demand make the battery discharge heavily.","quiet":"<b>Why the tie breaks:<\/b> the array and Sun geometry remain healthy, while the load telemetry identifies the deficit."},"chain":["Uncommanded equipment draws power","Battery supplies the generation shortfall","Heavy discharge pulls bus voltage down"],"take":"When storage fills a deficit, compare generation and demand before blaming the battery."},"logic":[["Voltage down + discharge high","Uncommanded load, planned calibration, or lost array input remain"],["Array current normal","Uncommanded or planned load remain"],["No authorization command","Uncommanded load or lost generation remain"],["Normal array + no authorization","Uncommanded load surge remains"]]},{"answer":"battery","alarm":"busv","experimental":false,"compound":["battery","loadsurge"],"observed":{"busv":"down","battcur":"high","array":"normal","load":"high","battemp":"high","resist":"high","sun":"sunlit","cur2":"agree","command":"none","relax":"slow","switch":"closed","eventflag":"unexpected"},"poleA":{"lab":"Storage under stress","val":"Bus 24.9 V; battery −26.1 A; resistance 121 mΩ","note":"An excessive load is acting on a battery that has already lost internal margin."},"hook":"A heater bank turns on unexpectedly during sunlight. The battery current rises, but the voltage collapse is much larger than the load alone should produce.","riddle":"One cause explains the demand and another explains the exaggerated sag. <span class=\"q\">Which two faults are present?<\/span>","vals":{"busv":{"observed":"28.0 → 24.9 V / 18 s","reference":"Normal regulated band 27.2–28.4 V"},"battcur":{"observed":"−26.1 A discharge","reference":"Typical sunlit transient −6 to −10 A"},"array":{"observed":"30.8 A","reference":"Expected 29–33 A"},"load":{"observed":"1.21 kW; command 645 W","reference":"Normal 590–680 W"},"battemp":{"observed":"22.4 → 31.2°C / 12 min","reference":"Typical 18–25°C"},"resist":{"observed":"121 mΩ","reference":"Baseline 61–74 mΩ"},"sun":{"observed":"0.9° array-Sun error","reference":"Normal <2.0°"},"cur2":{"observed":"−25.8 A","reference":"Agreement target ±0.6 A"},"command":{"observed":"No payload activation command","reference":"All loads require logged command"},"relax":{"observed":"21 s to recover 90%","reference":"Healthy 5–8 s"},"switch":{"observed":"Heater bank H3 closed unexpectedly","reference":"Expected open"},"eventflag":{"observed":"Unexpected-power event active","reference":"Scheduled tests marked planned"}},"reasons":{"battery":"Battery degradation explains the excessive sag, resistance, and heating, but not the measured 1.21 kW load against a 645 W command.","loadsurge":"The load surge explains heavy discharge, but a healthy 69 mΩ battery would not produce this voltage collapse and heating.","shadow":"Array current and Sun geometry are normal, and shadowing cannot explain the high battery resistance or excess commanded load.","authorized":"It explains high load but has a scheduled command and planned switch state, and it cannot explain degraded pulse recovery.","resistbias":"It explains high resistance alone but not slow recovery, heating, real high load, or an unexpected switch.","relaxbias":"It explains slow recovery alone but not high resistance and real load activation."},"resolve":{"title":"Battery degradation + uncommanded load surge","paras":["The heater-bank load has nearly doubled total demand, while the battery’s high internal resistance converts that current into an abnormally large voltage drop and heat rise.","The compound round requires four independent measurements. Resistance and pulse recovery jointly prove battery degradation; branch load and physical switch state jointly prove uncommanded equipment activation. Each individual clue has a specific telemetry or operational mimic."],"why":{"loud":"<b>Why one cause fails:<\/b> demand and storage health are measured independently.","quiet":"<b>Why the pair is forced:<\/b> only a load surge explains the extra watts, and only degradation explains the high resistance and disproportionate sag."},"chain":["Uncommanded heater load increases demand","Degraded battery supplies current inefficiently","Combined faults collapse bus margin"],"take":"A severe outcome may reflect an ordinary fault acting on already weakened redundancy or storage."},"logic":[["High resistance + slow pulse recovery","Requires battery degradation"],["High load + unexpected anomaly flag","Requires real uncommanded load; planned calibration or one telemetry bias explains only one"],["Closed branch switch + battery current","Confirms equipment is actually energized"],["Four independent electrical checks","Battery degradation and load surge are simultaneous"]]}],"schematic":{"viewBox":"0 0 520 390","svg":"<defs><linearGradient id=\"cleanBg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#c7dcee\"/><stop offset=\"1\" stop-color=\"#e3eff8\"/><\/linearGradient><marker id=\"cleanArrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"#107096\"/><\/marker><style>.clean-border{fill:url(#cleanBg);stroke:#8cacbd;stroke-width:2}.component{fill:#b2d1e4;stroke:#3b5e6f;stroke-width:1.7}.component2{fill:#9ec6db;stroke:#3b5e6f;stroke-width:1.7}.flow{fill:none;stroke:#107096;stroke-width:3;marker-end:url(#cleanArrow)}.flow2{fill:none;stroke:#a0781f;stroke-width:3;marker-end:url(#cleanArrow)}.leader{fill:none;stroke:#547080;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;opacity:.78}.anchor{fill:#375565}.slabel{fill:#041015;font:700 10.5px Inter,system-ui,sans-serif}.labelbg{fill:#dcedf7;stroke:#96b8ca;stroke-width:1;opacity:.94}<\/style><\/defs><rect x=\"12\" y=\"12\" width=\"496\" height=\"366\" rx=\"24\" class=\"clean-border\"/><path d=\"M 30 70 L 58 70 L 58 75 L 60 75\" class=\"leader\"/><circle cx=\"60\" cy=\"75\" r=\"2.4\" class=\"anchor\"/><path d=\"M 30 130 L 58 130 L 58 160 L 112 160\" class=\"leader\"/><circle cx=\"112\" cy=\"160\" r=\"2.4\" class=\"anchor\"/><path d=\"M 240 35 L 240 68 L 260 68 L 260 180\" class=\"leader\"/><circle cx=\"260\" cy=\"180\" r=\"2.4\" class=\"anchor\"/><path d=\"M 330 35 L 330 68 L 305 68 L 305 244\" class=\"leader\"/><circle cx=\"305\" cy=\"244\" r=\"2.4\" class=\"anchor\"/><path d=\"M 490 110 L 462 110 L 462 160 L 405 160\" class=\"leader\"/><circle cx=\"405\" cy=\"160\" r=\"2.4\" class=\"anchor\"/><path d=\"M 490 165 L 462 165 L 462 215 L 420 215\" class=\"leader\"/><circle cx=\"420\" cy=\"215\" r=\"2.4\" class=\"anchor\"/><path d=\"M 490 220 L 462 220 L 462 265 L 430 265\" class=\"leader\"/><circle cx=\"430\" cy=\"265\" r=\"2.4\" class=\"anchor\"/><path d=\"M 490 275 L 462 275 L 462 305 L 430 305\" class=\"leader\"/><circle cx=\"430\" cy=\"305\" r=\"2.4\" class=\"anchor\"/><path d=\"M 250 355 L 250 327 L 260 327 L 260 285\" class=\"leader\"/><circle cx=\"260\" cy=\"285\" r=\"2.4\" class=\"anchor\"/><path d=\"M 190 355 L 190 327 L 220 327 L 220 305\" class=\"leader\"/><circle cx=\"220\" cy=\"305\" r=\"2.4\" class=\"anchor\"/><path d=\"M 310 355 L 310 327 L 300 327 L 300 305\" class=\"leader\"/><circle cx=\"300\" cy=\"305\" r=\"2.4\" class=\"anchor\"/><path d=\"M 30 305 L 58 305 L 58 305 L 178 305\" class=\"leader\"/><circle cx=\"178\" cy=\"305\" r=\"2.4\" class=\"anchor\"/><circle cx=\"60\" cy=\"75\" r=\"18\" fill=\"#a37b20\" stroke=\"#5f4200\"/><g stroke=\"#a37b20\" stroke-width=\"2\"><path d=\"M60 45 V35 M60 105 V115 M30 75 H20 M90 75 H100\"/><\/g><rect x=\"78\" y=\"125\" width=\"72\" height=\"92\" rx=\"10\" class=\"component2\"/><g stroke=\"#2f4e5d\"><path d=\"M96 125 V217 M114 125 V217 M132 125 V217 M78 148 H150 M78 171 H150 M78 194 H150\"/><\/g><path d=\"M150 170 H192\" class=\"flow\"/><rect x=\"192\" y=\"137\" width=\"136\" height=\"86\" rx=\"14\" class=\"component2\"/><path d=\"M208 180 H312\" stroke=\"#a37b20\" stroke-width=\"5\"/><path d=\"M260 223 V254\" class=\"flow\"/><rect x=\"204\" y=\"254\" width=\"112\" height=\"70\" rx=\"12\" class=\"component\"/><rect x=\"350\" y=\"128\" width=\"104\" height=\"72\" rx=\"12\" class=\"component\"/><path d=\"M328 180 H350\" class=\"flow\"/><rect x=\"360\" y=\"212\" width=\"92\" height=\"112\" rx=\"12\" class=\"component2\"/><g><rect x=\"75.0\" y=\"223.5\" width=\"76\" height=\"23\" rx=\"11.5\" class=\"labelbg\"/><text x=\"113\" y=\"238.7\" text-anchor=\"middle\" class=\"slabel\">solar array<\/text><\/g><g><rect x=\"228.0\" y=\"105.5\" width=\"64\" height=\"23\" rx=\"11.5\" class=\"labelbg\"/><text x=\"260\" y=\"120.7\" text-anchor=\"middle\" class=\"slabel\">main bus<\/text><\/g><g><rect x=\"224.0\" y=\"276.5\" width=\"72\" height=\"23\" rx=\"11.5\" class=\"labelbg\"/><text x=\"260\" y=\"291.7\" text-anchor=\"middle\" class=\"slabel\">battery<\/text><\/g><g><rect x=\"356.0\" y=\"100.5\" width=\"92\" height=\"23\" rx=\"11.5\" class=\"labelbg\"/><text x=\"402\" y=\"115.7\" text-anchor=\"middle\" class=\"slabel\">spacecraft loads<\/text><\/g><g><rect x=\"350.0\" y=\"325.5\" width=\"112\" height=\"23\" rx=\"11.5\" class=\"labelbg\"/><text x=\"406\" y=\"340.7\" text-anchor=\"middle\" class=\"slabel\">command + telemetry<\/text><\/g>"}};
const ids=Object.keys(PACK.readings), letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
let roundIndex=0,score=0,answered=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setupIntro(){document.getElementById('introTitle').textContent=PACK.intro.title;document.getElementById('introLead').textContent=PACK.intro.lead;const sn=document.getElementById('scopeNote');if(PACK.scopeNote){sn.textContent=PACK.scopeNote;sn.classList.remove('hidden')}else sn.classList.add('hidden');document.getElementById('introGrid').innerHTML=PACK.intro.cards.map(c=>`<div class="introitem"><h3>${esc(c.title)}</h3><p>${esc(c.body)}</p></div>`).join('');document.getElementById('introTake').innerHTML=`<b>${esc(PACK.intro.takeaway)}</b>`}
function setupMap(){const svg=document.getElementById('map');svg.innerHTML=PACK.schematic.svg+ids.map((id,i)=>{const p=PACK.readings[id].pin;return `<g class="pin" data-reading="${id}"><circle cx="${p.x}" cy="${p.y}" r="10.5"></circle><text x="${p.x}" y="${p.y+4}" text-anchor="middle">${i+1}</text></g>`}).join('');document.querySelectorAll('.pin').forEach(p=>p.onclick=()=>document.getElementById('reading-'+p.dataset.reading).scrollIntoView({behavior:'smooth',block:'center'}));document.getElementById('legend').innerHTML=ids.map((id,i)=>`<div class="legend"><b>${i+1}</b>${esc(PACK.readings[id].name)}</div>`).join('')}
function isCompound(r){return Array.isArray(r.compound)&&r.compound.length===2}
function renderRound(){answered=false;const r=PACK.rounds[roundIndex],multi=isCompound(r);document.getElementById('roundPill').textContent=`Round ${roundIndex+1} / ${PACK.rounds.length}`;document.getElementById('scorePill').textContent=`Score ${score} / ${PACK.rounds.length}`;const choices=Object.entries(PACK.hypotheses);document.getElementById('caseBody').innerHTML=`<div class="poles"><div class="pole alarm"><small>Alarming reading</small><strong>${esc(r.poleA.val)}</strong><span>${esc(r.poleA.note)}</span></div><div class="pole calm"><small>Reassuring status</small><strong>${esc(PACK.reassuring.val)}</strong><span>${esc(PACK.reassuring.note)}</span></div></div><p class="hook">${esc(r.hook)}</p><div class="riddle">${r.riddle}</div>${multi?'<div class="multihelp">Select one or two causes, then submit. Two independently supported processes may be true at once.</div>':''}<div class="choices">${choices.map(([id,h],i)=>`<button class="choice" data-id="${id}"><span class="letter">${letters[i]}</span><span class="choicecopy"><span class="ctitle">${esc(h.label)}</span><span class="cdesc">${esc(h.choice)}</span></span></button>`).join('')}</div><div id="feedback" class="feedback"></div>${multi?'<button id="submitBtn" class="submit">Submit selected causes</button>':''}<button id="nextBtn" class="next">${roundIndex===PACK.rounds.length-1?'See final score':'Next round'}</button>`;
if(multi){const selected=new Set();document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(answered)return;const id=b.dataset.id;if(selected.has(id)){selected.delete(id);b.classList.remove('selected')}else if(selected.size<2){selected.add(id);b.classList.add('selected')}});document.getElementById('submitBtn').onclick=()=>answerMulti([...selected]);}else document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answerSingle(b.dataset.id,b));
document.getElementById('nextBtn').onclick=nextRound;
document.getElementById('readingGrid').innerHTML=ids.map((id,i)=>{const rd=PACK.readings[id],v=r.vals[id];return `<article id="reading-${id}" class="reading ${id===r.alarm?'alarmreading':''}"><span class="rnum">${i+1}</span><h3>${esc(rd.name)}</h3><span class="zone">${esc(rd.zone)}</span><div class="value"><div class="observed">${esc(v.observed)}</div><div class="reference">${esc(v.reference)}</div></div><p class="purpose">${esc(rd.purpose)}</p></article>`}).join('');
const res=document.getElementById('resolution');res.className='card resolution';res.innerHTML='';window.scrollTo({top:0,behavior:'smooth'})}
function reveal(r){const res=document.getElementById('resolution');res.className='card resolution show';res.innerHTML=`<h2>${esc(r.resolve.title)}</h2>${r.resolve.paras.map(p=>`<p>${p}</p>`).join('')}<div class="why"><div>${r.resolve.why.loud}</div><div>${r.resolve.why.quiet}</div></div><div class="logic"><h3>How the evidence narrows</h3>${r.logic.map(x=>`<div class="logicrow"><div class="logicclue">${esc(x[0])}</div><div class="arrow">→</div><div class="logicresult">${esc(x[1])}</div></div>`).join('')}</div><div class="chain">${r.resolve.chain.map((x,i)=>`<span class="node">${esc(x)}</span>${i<r.resolve.chain.length-1?'<span class="arrow">→</span>':''}`).join('')}</div><div class="take">${esc(r.resolve.take)}</div>`;document.getElementById('nextBtn').classList.add('show');res.scrollIntoView({behavior:'smooth',block:'start'})}
function answerSingle(id,btn){if(answered)return;answered=true;const r=PACK.rounds[roundIndex],ok=id===r.answer;if(ok)score++;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.id===r.answer)b.classList.add('correct');else if(b===btn)b.classList.add('wrong')});const f=document.getElementById('feedback');f.className='feedback show '+(ok?'good':'bad');const reason=ok?PACK.hypotheses[r.answer].call.arg:r.reasons[id];f.innerHTML=`<h3>${ok?'Correct':'Not quite'} — ${esc(r.resolve.title)}</h3><p>${esc(reason)}</p>`;document.getElementById('scorePill').textContent=`Score ${score} / ${PACK.rounds.length}`;reveal(r)}
function answerMulti(sel){if(answered)return;const r=PACK.rounds[roundIndex],need=r.compound;if(sel.length<1){const f=document.getElementById('feedback');f.className='feedback show bad';f.innerHTML='<h3>Select at least one cause</h3><p>You may choose up to two causes in this round.</p>';return}answered=true;const ok=sel.length===2&&need.every(x=>sel.includes(x));if(ok)score++;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;b.classList.remove('selected');if(need.includes(b.dataset.id))b.classList.add('correct');else if(sel.includes(b.dataset.id))b.classList.add('wrong')});const f=document.getElementById('feedback');f.className='feedback show '+(ok?'good':'bad');let msg;if(ok)msg=`Correct pair: ${need.map(x=>PACK.hypotheses[x].label).join(' + ')}. Each cause explains a separate evidence chain.`;else if(sel.length===1)msg='One cause leaves an independently confirmed part of the panel unexplained.';else{const wrong=sel.find(x=>!need.includes(x));msg=(wrong&&r.reasons[wrong])||'That pair does not cover the whole panel.'}f.innerHTML=`<h3>${ok?'Correct':'Not quite'} — ${esc(r.resolve.title)}</h3><p>${esc(msg)}</p>`;document.getElementById('scorePill').textContent=`Score ${score} / ${PACK.rounds.length}`;document.getElementById('submitBtn').style.display='none';reveal(r)}
function nextRound(){if(roundIndex<PACK.rounds.length-1){roundIndex++;renderRound()}else{try{reckonReport({game:'Diagnosis',gameId:PACK.id,gameTitle:PACK.title,won:score===PACK.rounds.length,score:score});}catch(e){}document.getElementById('game').innerHTML=`<section class="card complete"><div class="eyebrow">Shift complete</div><h2>${score} / ${PACK.rounds.length}</h2><p>You used the full panel to combine clues, break ties, and recognize a uniquely forced two-cause diagnosis.</p><button class="restart" onclick="location.reload()">Play again</button></section>`;window.scrollTo({top:0,behavior:'smooth'})}}
document.getElementById('startBtn').onclick=()=>{document.getElementById('introScreen').classList.add('hidden');document.getElementById('game').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};
document.getElementById('guideBtn').onclick=()=>{document.getElementById('introScreen').classList.remove('hidden');document.getElementById('game').classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})};
setupIntro();setupMap();const lt=document.getElementById('legendToggle');if(lt)lt.onclick=()=>{const lg=document.getElementById('legend');const open=lg.classList.toggle('open');lt.textContent=open?'Hide sensor key':'Show sensor key'};renderRound();
</script></body></html>

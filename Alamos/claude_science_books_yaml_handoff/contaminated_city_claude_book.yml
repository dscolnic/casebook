# Claude-ready mission book. Follows BOOK_TEMPLATE.md conventions.
# Exactly 15 missions, 3 stops per mission. Formats use exact importer names.
# Diagnosis is a first-class format: the full evidence panel is visible and quiet readings matter.
theme:
  id: contaminated_city
  title: The Contaminated City
  subtitle: "Chief Scientific Officer \xB7 Riverton Response"
groups:
- id: IDENT
  code: IDENT
  name: Molecular Identification
  color: '#704f88'
  desc: Composition, formula, chromatography, spectroscopy, and analytical controls.
  defaultLeader: okonjo
  milestones:
  - Establish identity
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: ATMOS
  code: ATMOS
  name: Gas & Atmosphere
  color: '#315c78'
  desc: Gas behavior, plume transport, atmospheric chemistry, and weather coupling.
  defaultLeader: park
  milestones:
  - Track the plume
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: WATER
  code: WATER
  name: Solutions & Water
  color: '#4b775f'
  desc: Solubility, concentration, dilution, acid-base chemistry, and water measurements.
  defaultLeader: alvarez
  milestones:
  - Close the water balance
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: REACT
  code: REACT
  name: Reactions & Equilibrium
  color: '#9a741d'
  desc: Stoichiometry, equilibrium, acids and bases, and reaction pathways.
  defaultLeader: hassan
  milestones:
  - Constrain the reaction
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: ENERGY
  code: ENERGY
  name: Thermochemistry & Kinetics
  color: '#9a3f36'
  desc: Heat, enthalpy, rates, activation, and runaway feedback.
  defaultLeader: wright
  milestones:
  - Follow energy and rate
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: MATERIAL
  code: MAT
  name: Materials & Treatment
  color: '#3d6f52'
  desc: Electrochemistry, corrosion, treatment, transfer, and verification.
  defaultLeader: kim
  milestones:
  - Verify where material goes
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
roster:
- id: okonjo
  name: Dr. Adaeze Okonjo
  role: Analytical Chemistry Lead
  division: IDENT
  bio: 'Runs identification as an evidence chain: separation, structural signature, blank, standard, and independent confirmation.'
- id: park
  name: Dr. Mina Park
  role: Atmospheric Chemistry Lead
  division: ATMOS
  bio: Explains why concentration can change because of transport and weather even when the source stays constant.
- id: alvarez
  name: Dr. Elena Alvarez
  role: Water Chemistry Lead
  division: WATER
  bio: Uses mass balance, concentration, matrix effects, and quality controls to interpret water samples.
- id: hassan
  name: Dr. Samir Hassan
  role: Reaction Chemistry Lead
  division: REACT
  bio: Turns balanced reactions and equilibrium constraints into predictions that can be checked against measurements.
- id: wright
  name: Dr. Leah Wright
  role: Thermochemistry Lead
  division: ENERGY
  bio: Uses energy balance and kinetics to distinguish stored heat from ongoing heat generation.
- id: kim
  name: Dr. Daniel Kim
  role: Materials and Treatment Lead
  division: MATERIAL
  bio: Tracks oxidation, corrosion, adsorption, precipitation, and treatment products across compartments.
glossary:
- name: Molarity
  aliases:
  - molarity
  def: Moles of dissolved substance per liter of solution.
- name: Blank
  aliases:
  - blank
  def: A control sample that should contain none of the target analyte.
- name: Calibration
  aliases:
  - calibration
  def: A measured relationship between instrument response and known standards.
- name: Enthalpy
  aliases:
  - enthalpy
  def: A thermodynamic quantity whose change at constant pressure tracks heat released or absorbed.
- name: Limiting reactant
  aliases:
  - limiting reactant
  def: The reactant that runs out first and therefore limits reaction extent.
- name: Matrix effect
  aliases:
  - matrix effect
  def: A change in instrument response caused by other material in the sample, not the target analyte itself.
missions:
- title: The Unknown Containers
  objective: Create a provisional identity list and choose the next discriminating measurements.
  briefing: "A freight-yard fire damages several unlabeled containers beside Riverton\u2019s river. The response team must\
    \ establish chemical identity and hazard classes before firefighters, residents, and the water utility act on rumors."
  stake: A wrong identity can cause an incompatible firefighting or treatment decision.
  takeaway: Use atoms and ions, periodic trends, chemical formulas, nomenclature, evidence quality as an evidence chain rather
    than as isolated facts.
  stops:
  - group: MATERIAL
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Read the formula, not the rumor
    place: Accident Command Post
    scene: Match each formula-level observation to the correct chemical interpretation.
    takeaway: Chemical identity begins with explicit composition and charge.
    format: PROTOCOL
    scenarios:
    - The formula contains a metal cation and a polyatomic anion.
    - Two substances share the same elements but different ratios.
    - An ion has more electrons than protons.
    - A label gives a common name with no composition or concentration.
    choices:
    - Likely an ionic compound.
    - They are distinct compounds, not interchangeable names.
    - It is negatively charged.
    - The record is insufficient for hazard prediction.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: Composition, ratio, and charge constrain identity; an informal name may hide crucial differences.
  - group: IDENT
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: From damaged container to provisional identity
    place: Molecular Identification Lab
    scene: Order the non-destructive evidence workflow.
    takeaway: Identity is an evidence package, not a guess from color or odor.
    format: SEQUENCE
    cards:
    - Secure and inventory containers without opening them unnecessarily.
    - Reconcile markings, manifests, and chain-of-custody records.
    - Use validated remote or small-sample analytical methods.
    - Integrate records and measurements into a confidence-ranked identity list.
    order:
    - 0
    - 1
    - 2
    - 3
    why: Physical control and records preserve safety and provenance before analytical evidence is interpreted.
  - group: MATERIAL
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Spend the first analytical reserve
    place: Records and Shipping Office
    scene: Allocate 100 credits.
    takeaway: Early chemistry should reduce uncertainty without creating new exposure.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Recover shipping records and supplier lot information.
    - label: B
      text: Use orthogonal analytical methods with different selectivity.
    - label: C
      text: Ask responders to identify chemicals by smell.
    - label: D
      text: Establish reference samples and blanks.
    recommended:
      A: 30
      B: 45
      C: 0
      D: 25
    evidence: Allocate 100 credits.
- title: The Vapor Cloud
  objective: Provide a bounded plume assessment and decision triggers for evacuation zones.
  briefing: A colorless plume moves toward two neighborhoods as the weather changes. The team must estimate expansion, density,
    and direction without treating an ideal-gas model as a complete atmospheric forecast.
  stake: A delayed evacuation risks exposure; an overbroad evacuation can block emergency access and overwhelm shelters.
  takeaway: Use ideal gas law, temperature and pressure, moles and volume, density, model limits as an evidence chain rather
    than as isolated facts.
  stops:
  - group: ATMOS
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: How much volume can the gas occupy?
    place: Mobile Weather Station
    scene: Use an idealized release only to establish scale.
    takeaway: Simple gas laws provide scale while atmospheric transport determines exposure.
    format: BALLPARK
    question: Estimate the gas volume at ambient conditions.
    estimate:
      labels:
      - 2.0e4 mol
      - 8.31 J/mol/K
      - 300 K
      - 1.0e5 Pa
      values:
      - 20000.0
      - 8.31
      - 300
      - 100000.0
      slots: 4
      template: '{0} x {1} x {2} / {3}'
      formula: a*b*c/d
      correct:
      - 0
      - 1
      - 2
      - 3
      target: 498.6
      tolerance: 60
      units: m^3
      solution: V = nRT/P is about 500 m^3.
      prompt: Use an idealized release only to establish scale.
      question: Estimate the gas volume at ambient conditions.
  - group: ATMOS
    task: Which explanation fits the source data, vertical profile, and weather measurements together?
    title: Why is the plume staying near the ground?
    place: Gas Properties Lab
    scene: The source is no longer increasing, yet street-level monitors remain high while measurements above the rooftops
      stay much lower. Command needs to know whether the chemistry changed or the atmosphere is trapping the plume.
    takeaway: Atmospheric concentration depends on transport as well as source strength; a stable layer can trap the same
      amount of material near the ground.
    format: DIAGNOSIS
    headline: The source is no longer increasing, yet street-level monitors remain high while measurements above the rooftops
      stay much lower.
    readings:
    - zone: Ground concentration
      label: Ground concentration
      value: High and persistent
      status: alarm
      note: Several street monitors agree
    - zone: 20 m concentration
      label: 20 m concentration
      value: Much lower
      status: alarm
      note: Strong vertical gradient
    - zone: Wind speed
      label: Wind speed
      value: Very low
      status: alarm
      note: Weak horizontal mixing
    - zone: Temperature profile
      label: Temperature profile
      value: Cool surface, warmer air aloft
      status: normal
      note: Stable inversion suppresses rising motion
    - zone: Source monitor
      label: Source monitor
      value: Steady, not increasing
      status: normal
      note: No evidence of a new release surge
    choices:
    - label: Temperature inversion
      mechanism: Stable warm air above cool surface air suppresses vertical mixing and traps pollution low.
    - label: Sudden source surge
      mechanism: The release rate has sharply increased and drives all concentrations upward.
    - label: Wind-sensor failure
      mechanism: The plume only appears stagnant because one wind instrument is wrong.
    - label: Rapid chemical destruction aloft
      mechanism: The compound disappears chemically as soon as it rises above the street layer.
    answer: Temperature inversion
    why: The strongest clues are the vertical temperature structure and concentration gradient, while the source remains steady.
      A stable inversion naturally explains persistent ground-level concentration without requiring a new release.
  - group: ATMOS
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Choose the next plume evidence
    place: Evacuation Command
    scene: Allocate 100 credits.
    takeaway: High-stakes forecasts should combine measurements with transparent models.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Deploy calibrated sensors upwind, crosswind, and downwind.
    - label: B
      text: Improve local wind and stability measurements.
    - label: C
      text: Rely on one uncalibrated handheld reading at the source.
    - label: D
      text: Run multiple dispersion scenarios with explicit assumptions.
    recommended:
      A: 40
      B: 30
      C: 5
      D: 25
    evidence: Allocate 100 credits.
- title: What Dissolved in the River?
  objective: Predict where each chemical class will be found and design a mass-balance sampling plan.
  briefing: Runoff from the accident enters the river. Some compounds remain in surface films, some dissolve, and others bind
    to sediment. The player must predict partitioning from molecular interactions and verify it with sampling.
  stake: If the team samples only water, a persistent sediment reservoir may be missed until it re-enters the water supply.
  takeaway: Use polarity, intermolecular forces, solubility, partitioning, sampling design as an evidence chain rather than
    as isolated facts.
  stops:
  - group: WATER
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Where will the chemical go?
    place: River Sampling Boat
    scene: Match each molecular feature to the most likely environmental behavior.
    takeaway: The absence of a chemical from water does not mean it has disappeared.
    format: PROTOCOL
    scenarios:
    - Small ionic species in water.
    - Nonpolar organic liquid with low water affinity.
    - Polar neutral molecule capable of hydrogen bonding.
    - Hydrophobic compound with strong affinity for organic-rich sediment.
    choices:
    - Often dissolves as hydrated ions.
    - May form a separate phase or surface film.
    - Often has appreciable water solubility.
    - May concentrate in suspended particles or sediment.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: Solubility and partitioning follow interactions among solute, water, and environmental phases.
  - group: WATER
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: Build a river mass-balance survey
    place: Solutions and Polarity Lab
    scene: Order the sampling logic.
    takeaway: Environmental chemistry requires sampling the phases predicted by molecular behavior.
    format: SEQUENCE
    cards:
    - Define upstream background and downstream decision points.
    - Sample water, suspended solids, sediment, and surface films with blanks.
    - Measure concentrations and flow or phase masses.
    - Compare recovered mass across locations and phases, including uncertainty.
    order:
    - 0
    - 1
    - 2
    - 3
    why: A defensible survey starts with comparison sites and includes all plausible reservoirs.
  - group: WATER
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Spend the river survey budget
    place: Sediment Analysis Room
    scene: Allocate 100 credits.
    takeaway: Sampling design should test the partitioning model rather than confirm appearances.
    format: SCIENCETANK
    proposals:
    - label: A
      text: High-frequency water sampling near the intake.
    - label: B
      text: Sediment and suspended-solids sampling.
    - label: C
      text: Upstream and tributary comparison sites.
    - label: D
      text: One dramatic sample collected where discoloration is visible.
    recommended:
      A: 35
      B: 30
      C: 25
      D: 10
    evidence: Allocate 100 credits.
- title: Identify the Unknowns
  objective: Assign confidence-ranked identities to mixture components using orthogonal evidence.
  briefing: Chromatography reveals several peaks, while spectroscopy suggests overlapping functional groups. The player must
    combine separation and structural evidence rather than forcing one peak to equal one compound.
  stake: A false identification could lead the treatment plant to use chemistry that creates a more hazardous byproduct.
  takeaway: Use separation, retention, spectral fingerprints, calibration, mixtures as an evidence chain rather than as isolated
    facts.
  stops:
  - group: IDENT
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: From mixture to supported identity
    place: Chromatography Lab
    scene: Order the analytical chain.
    takeaway: Orthogonal evidence protects against coincidental matches.
    format: SEQUENCE
    cards:
    - Separate mixture components under a validated method.
    - Measure detector response and retention relative to standards.
    - Collect or compare structural spectral information.
    - Require agreement across methods before high-confidence identification.
    order:
    - 0
    - 1
    - 2
    - 3
    why: Separation reduces overlap; standards and structural evidence then support identity.
  - group: IDENT
    task: Which explanation fits the sample, blank, confirmation method, and instrument checks?
    title: Why do the analytical methods disagree?
    place: Spectroscopy Suite
    scene: One chromatography run appears to identify the target compound, but an independent method does not confirm it.
      The laboratory must explain the disagreement before the city labels the river sample.
    takeaway: Analytical identity is a package of evidence. A peak in a blank can be more informative than a large peak in
      the sample.
    format: DIAGNOSIS
    headline: One chromatography run appears to identify the target compound, but an independent method does not confirm it.
    readings:
    - zone: Sample chromatogram
      label: Sample chromatogram
      value: Peak at target retention time
      status: alarm
      note: The headline signal
    - zone: Sequence blank
      label: Sequence blank
      value: Same peak at lower amplitude
      status: alarm
      note: Blank should contain no river analyte
    - zone: Independent confirmation
      label: Independent confirmation
      value: Target not detected
      status: normal
      note: Uses a different analytical principle
    - zone: Column pressure
      label: Column pressure
      value: Stable
      status: normal
      note: No sign of a gross flow failure
    - zone: Later clean run
      label: Later clean run
      value: Peak fades after intervening blanks
      status: alarm
      note: Pattern weakens through the sequence
    choices:
    - label: Target truly present
      mechanism: The river sample contains the target and the blank peak is coincidence.
    - label: Laboratory carryover
      mechanism: Residual material in the analytical sequence creates a peak in both sample and blank runs.
    - label: Column-flow failure
      mechanism: Changing pressure shifts retention and creates a false identification.
    - label: Random detector noise
      mechanism: Uncorrelated noise happens to produce the same peak position repeatedly.
    answer: Laboratory carryover
    why: The target-like peak appears in the blank, an independent method fails to confirm it, and the peak fades through
      later clean runs. That pattern is much more consistent with carryover than with a real river concentration.
  - group: IDENT
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Resolve the ambiguous peak
    place: Reference Library
    scene: Allocate 100 credits.
    takeaway: Better presentation cannot repair missing selectivity or validation.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Improve chromatographic separation.
    - label: B
      text: Use a second structural method.
    - label: C
      text: Increase the font size of the existing report.
    - label: D
      text: Analyze certified reference material and matrix spikes.
    recommended:
      A: 35
      B: 35
      C: 0
      D: 30
    evidence: Allocate 100 credits.
- title: The Concentration Problem
  objective: Produce concentration maps whose units, detection limits, and quality controls are explicit.
  briefing: "City leaders ask whether the contaminant is \u201Chigh,\u201D but samples differ in dilution, path length, and\
    \ matrix interference. The team must turn signals into defensible concentrations."
  stake: An incorrect concentration map can either close a safe water system or expose residents through a false reassurance.
  takeaway: Use molarity, dilution, Beer-Lambert law, calibration curves, uncertainty as an evidence chain rather than as
    isolated facts.
  stops:
  - group: IDENT
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Undo the dilution
    place: Quantitative Analysis Lab
    scene: A river sample is diluted before analysis.
    takeaway: Sample preparation is part of the quantitative result.
    format: BALLPARK
    question: Estimate the original concentration.
    estimate:
      labels:
      - 2.5 mg/L diluted concentration
      - 100 mL final volume
      - 10 mL original sample
      values:
      - 2.5
      - 100
      - 10
      slots: 3
      template: '{0} x {1} / {2}'
      formula: a*b/c
      correct:
      - 0
      - 1
      - 2
      target: 25
      tolerance: 2
      units: mg/L
      solution: 2.5 x 100/10 = 25 mg/L.
      prompt: A river sample is diluted before analysis.
      question: Estimate the original concentration.
  - group: WATER
    task: Which explanation best fits the optical reading and the independent quality-control checks?
    title: Why did the concentration suddenly jump?
    place: River Mapping Center
    scene: A muddy downstream sample shows almost twice the absorbance of the morning sample. The city wants to know whether
      contaminant concentration truly doubled or the sample matrix fooled the optical method.
    takeaway: A calibration curve is only valid when the sample behaves enough like the standards; matrix effects can mimic
      concentration changes.
    format: DIAGNOSIS
    headline: A muddy downstream sample shows almost twice the absorbance of the morning sample.
    readings:
    - zone: Absorbance
      label: Absorbance
      value: Nearly doubled
      status: alarm
      note: Converted concentration would look much higher
    - zone: Instrument blank
      label: Instrument blank
      value: Normal
      status: normal
      note: No broad baseline shift
    - zone: Calibration standards
      label: Calibration standards
      value: Same slope as morning
      status: normal
      note: Instrument response to clean standards is stable
    - zone: Sample turbidity
      label: Sample turbidity
      value: Much higher
      status: alarm
      note: Suspended particles scatter light
    - zone: Target-specific second method
      label: Target-specific second method
      value: Nearly unchanged
      status: normal
      note: Independent chemistry does not show a doubling
    choices:
    - label: True concentration doubling
      mechanism: The target chemical concentration really increased by about a factor of two.
    - label: Optical matrix interference
      mechanism: Suspended material adds scattering or absorbance that the calibration interprets as analyte.
    - label: Calibration drift
      mechanism: The instrument sensitivity changed for standards and samples together.
    - label: Dilution arithmetic error
      mechanism: The recorded dilution factor alone created the apparent jump.
    answer: Optical matrix interference
    why: The clean calibration and blank are stable, but turbidity is high and an independent method does not confirm the
      doubling. The sample matrix, not analyte concentration, best explains the optical jump.
  - group: IDENT
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Map concentration with limited samples
    place: Quality Assurance Desk
    scene: Allocate 100 credits.
    takeaway: "Spatial coverage without analytical validity\u2014or validity without spatial coverage\u2014cannot protect\
      \ the city."
    format: SCIENCETANK
    proposals:
    - label: A
      text: Dense sampling near the drinking-water intake.
    - label: B
      text: Longitudinal samples upstream and downstream over time.
    - label: C
      text: Replicates, blanks, and spikes.
    - label: D
      text: Sample only the visibly discolored water.
    recommended:
      A: 35
      B: 35
      C: 25
      D: 5
    evidence: Allocate 100 credits.
- title: A Reaction Underground
  objective: Estimate the maximum reaction scale and define measurements that verify whether the assumed chemistry is occurring.
  briefing: Two drainage streams may mix in a confined tunnel. The player must determine limiting reactants, plausible products,
    and gas or heat generation before crews enter.
  stake: Entering before bounding the chemistry could expose crews to heat, pressure, or oxygen displacement.
  takeaway: Use balanced equations, mole ratios, limiting reactant, yield, gas production as an evidence chain rather than
    as isolated facts.
  stops:
  - group: REACT
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: From identity to reaction estimate
    place: Sewer Monitoring Station
    scene: Order the stoichiometric workflow.
    takeaway: Stoichiometry is a conditional prediction based on a specified reaction.
    format: SEQUENCE
    cards:
    - Write and balance the plausible reaction.
    - Convert measured amounts to moles.
    - Use mole ratios to identify the limiting reactant.
    - Calculate theoretical products and compare with observed gas or heat.
    order:
    - 0
    - 1
    - 2
    - 3
    why: A balanced equation defines the conversion ratios before amounts can be compared.
  - group: REACT
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Which reactant limits?
    place: Stoichiometry Lab
    scene: "Use the generic reaction 2A + B \u2192 products."
    takeaway: Limiting-reactant logic prevents impossible product estimates.
    format: BALLPARK
    question: Identify the limiting reactant and maximum reaction extent in moles of B consumed.
    estimate:
      labels:
      - 10 mol A
      - 8 mol B
      values:
      - 10
      - 8
      slots: 2
      template: min({0}/2, {1})
      formula: Math.min(a/2,b)
      correct:
      - 0
      - 1
      target: 5
      tolerance: 0.2
      units: mol B reacted
      solution: If 2 A react per 1 B, 10 mol A can consume 5 mol B, so A limits.
      prompt: "Use the generic reaction 2A + B \u2192 products."
      question: Identify the limiting reactant and maximum reaction extent in moles of B consumed.
  - group: MATERIAL
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Is the assumed reaction happening?
    place: Confined-Space Safety Command
    scene: Match each observation to the strongest conclusion.
    takeaway: A balanced equation is testable through conserved quantities and product signatures.
    format: PROTOCOL
    scenarios:
    - Expected gas appears with the predicted ratio to reactant loss.
    - Temperature rises but no products are measured.
    - One reactant disappears in the blank.
    - Observed product exceeds the theoretical maximum.
    choices:
    - Evidence supports the proposed reaction.
    - Heat alone is nonspecific; test alternatives.
    - The method or container may be consuming the reactant.
    - The reaction model, units, or measurement is wrong.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: Mass balance and controls constrain reaction claims.
- title: The Heat Is Rising
  objective: Create an energy balance and choose a monitoring plan that detects self-heating early.
  briefing: A storage zone continues warming after the visible fire is out. The team must distinguish stored heat from ongoing
    exothermic reaction and estimate whether cooling can keep up.
  stake: If self-heating is mistaken for leftover warmth, responders may leave before runaway conditions develop.
  takeaway: Use enthalpy, calorimetry, specific heat, energy balance, exothermic reactions as an evidence chain rather than
    as isolated facts.
  stops:
  - group: ENERGY
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: How much energy raises the temperature?
    place: Thermal Camera Team
    scene: Estimate the sensible heat in a water-like containment bath.
    takeaway: Temperature becomes meaningful when connected to mass and heat capacity.
    format: BALLPARK
    question: Estimate the absorbed heat.
    estimate:
      labels:
      - 2000 kg
      - 4.2 kJ/kg/K
      - 5 K
      values:
      - 2000
      - 4.2
      - 5
      slots: 3
      template: '{0} x {1} x {2} / 1000'
      formula: a*b*c/1000
      correct:
      - 0
      - 1
      - 2
      target: 42
      tolerance: 3
      units: MJ
      solution: "q = mc\u0394T = 42 MJ."
      prompt: Estimate the sensible heat in a water-like containment bath.
      question: Estimate the absorbed heat.
  - group: ENERGY
    task: Which explanation fits the temperature history and energy-flow evidence?
    title: Stored heat or continuing reaction?
    place: Calorimetry Lab
    scene: The visible fire is out, but one storage zone continues to warm. The team must decide whether it is merely cooling
      slowly or still generating heat internally.
    takeaway: Energy accounting can distinguish a warm object from an object that is actively producing heat.
    format: DIAGNOSIS
    headline: The visible fire is out, but one storage zone continues to warm.
    readings:
    - zone: Core temperature
      label: Core temperature
      value: Rising about 2 C per hour
      status: alarm
      note: Trend continues after external flames are gone
    - zone: Boundary heat flux
      label: Boundary heat flux
      value: Net heat leaving the zone
      status: alarm
      note: Surroundings are not supplying the increase
    - zone: Nearby inert reference
      label: Nearby inert reference
      value: Cooling steadily
      status: alarm
      note: Same room conditions, no internal chemistry

# Claude-ready mission book. Follows BOOK_TEMPLATE.md conventions.
# Exactly 15 missions, 3 stops per mission. Formats use exact importer names.
# Diagnosis is a first-class format: the full evidence panel is visible and quiet readings matter.
theme:
  id: planetary_defense
  title: Planetary Defense
  subtitle: "Campaign Director \xB7 International NEO Response"
groups:
- id: DISC
  code: DISC
  name: Discovery & Imaging
  color: '#315c78'
  desc: Images, signal-to-noise, moving-object detection, and artifact rejection.
  defaultLeader: nguyen
  milestones:
  - Validate the detection
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: ORBIT
  code: ORBIT
  name: Astrometry & Orbit
  color: '#704f88'
  desc: Sky position, timing, orbit fitting, covariance, and impact probability.
  defaultLeader: rossi
  milestones:
  - Constrain the orbit
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: CHAR
  code: CHAR
  name: Physical Characterization
  color: '#4b775f'
  desc: Brightness, albedo, spectra, rotation, size, and composition.
  defaultLeader: adebayo
  milestones:
  - Measure the body
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: RADAR
  code: RADAR
  name: Radar & Dynamics
  color: '#9a741d'
  desc: Range, delay, velocity, momentum transfer, and independent orbit constraints.
  defaultLeader: fischer
  milestones:
  - Add geometric leverage
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: IMPACT
  code: IMPACT
  name: Entry & Consequences
  color: '#9a3f36'
  desc: Energy, atmospheric entry, fragmentation, consequence uncertainty, and deflection physics.
  defaultLeader: banerjee
  milestones:
  - Bound the consequence
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: OPS
  code: OPS
  name: Survey & Response
  color: '#3d6f52'
  desc: Completeness, observing geometry, response decisions, communication, and long-term readiness.
  defaultLeader: garcia
  milestones:
  - Turn evidence into action
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
roster:
- id: nguyen
  name: Dr. Linh Nguyen
  role: Survey Imaging Lead
  division: DISC
  bio: Distinguishes real moving sources from cosmic rays, detector defects, and image-processing artifacts using repeated
    and independent observations.
- id: rossi
  name: Dr. Marco Rossi
  role: Orbit Determination Lead
  division: ORBIT
  bio: Treats every position as a timed measurement with calibration and covariance, then asks which observation reduces the
    dangerous uncertainty.
- id: adebayo
  name: Dr. Tola Adebayo
  role: Physical Characterization Lead
  division: CHAR
  bio: Combines brightness, color, spectra, thermal information, and rotation without pretending any one observable uniquely
    determines size or composition.
- id: fischer
  name: Dr. Anna Fischer
  role: Radar Dynamics Lead
  division: RADAR
  bio: Uses signal delay and Doppler measurements to add independent geometric constraints to optical astrometry.
- id: banerjee
  name: Dr. Rohan Banerjee
  role: Impact Physics Lead
  division: IMPACT
  bio: Connects size, density, speed, atmosphere, and fragmentation to consequence ranges rather than single deterministic
    outcomes.
- id: garcia
  name: Dr. Isabel Garcia
  role: Survey and Response Lead
  division: OPS
  bio: Balances observing completeness, uncertainty reduction, public communication, and response thresholds without confusing
    expected value with a prediction.
glossary:
- name: Astrometry
  aliases:
  - astrometry
  def: Measurement of an object position on the sky.
- name: Solar elongation
  aliases:
  - solar elongation
  def: The angular separation between an object and the Sun as seen from the observer.
- name: Albedo
  aliases:
  - albedo
  def: The fraction of incident light a surface reflects.
- name: Light curve
  aliases:
  - light curve
  def: Brightness measured as a function of time.
- name: Covariance
  aliases:
  - covariance
  def: A description of how uncertainties in fitted quantities vary together.
- name: Radar delay
  aliases:
  - radar delay
  def: Round-trip travel time of a radar signal, used to infer range.
missions:
- title: The Discovery Image
  objective: Validate a new-object candidate and preserve the measurements needed for follow-up.
  briefing: A survey telescope flags a faint moving point near the ecliptic. The player must determine whether it is a real
    Solar System object, an image artifact, or a known source.
  stake: If the candidate is real and close, every hour of delay expands the region where it may be lost.
  takeaway: Use digital images, signal-to-noise, artifacts, moving-object detection, controls as an evidence chain rather
    than as isolated facts.
  stops:
  - group: DISC
    task: Which explanation fits the motion, image shape, detector map, and independent follow-up?
    title: Object or artifact?
    place: Survey Telescope Control
    scene: A survey pipeline flags a faint moving point near the ecliptic. Before an international alert goes out, the discovery
      team must determine whether the source is a real Solar System object or a detector/image artifact.
    takeaway: A discovery becomes convincing when motion is coherent in sky coordinates but not tied to one detector, exposure,
      or telescope.
    format: DIAGNOSIS
    headline: A survey pipeline flags a faint moving point near the ecliptic.
    readings:
    - zone: Three survey exposures
      label: Three survey exposures
      value: Source moves linearly between frames
      status: alarm
      note: Motion is consistent in time and direction
    - zone: Point-spread shape
      label: Point-spread shape
      value: Star-like in each exposure
      status: alarm
      note: Not a single-pixel spike
    - zone: Detector defect map
      label: Detector defect map
      value: No hot pixel at those positions
      status: alarm
      note: The source crosses different detector pixels
    - zone: Background stars
      label: Background stars
      value: Remain fixed after astrometric alignment
      status: normal
      note: Image registration is stable
    - zone: Second telescope
      label: Second telescope
      value: Recovers source near predicted position
      status: alarm
      note: Independent hardware confirms motion
    choices:
    - label: Real moving Solar System object
      mechanism: A point source changes sky position coherently while stars and detector coordinates remain stable.
    - label: Cosmic-ray hit
      mechanism: A charged particle creates a transient sharp feature in one exposure.
    - label: Hot detector pixel
      mechanism: A fixed detector location appears bright whenever that pixel is read.
    - label: Image-registration artifact
      mechanism: Misalignment makes many fixed stars appear to shift together.
    answer: Real moving Solar System object
    why: The source is point-like, moves across different pixels while stars remain fixed, appears repeatedly, and is recovered
      independently. No single detector or registration artifact explains the full panel.
  - group: DISC
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: Validate the discovery
    place: Image Processing Lab
    scene: Order the workflow.
    takeaway: A discovery is useful only when another observer can test it.
    format: SEQUENCE
    cards:
    - Calibrate the images and identify transient or moving candidates.
    - Reject known stars, satellites, detector defects, and catalogued objects.
    - Measure position, time, brightness, and uncertainty for each detection.
    - Submit the candidate and predicted follow-up region to the tracking network.
    order:
    - 0
    - 1
    - 2
    - 3
    why: Calibration and rejection precede astrometry and follow-up.
  - group: ORBIT
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: How far did it move?
    place: Minor-Planet Operations Desk
    scene: The object shifts 12 arcseconds in 20 minutes.
    takeaway: Repeated images turn apparent motion into a measurable rate.
    format: BALLPARK
    question: Estimate rate in arcseconds per minute and per hour.
    estimate:
      labels:
      - 12 arcsec
      - 20 min
      values:
      - 12
      - 20
      slots: 2
      template: '{0}/{1} x 60'
      formula: a/b*60
      correct:
      - 0
      - 1
      target: 36
      tolerance: 3
      units: arcsec/hour
      solution: 12/20 = 0.6 arcsec/min = 36 arcsec/hour.
      prompt: The object shifts 12 arcseconds in 20 minutes.
      question: Estimate rate in arcseconds per minute and per hour.
- title: Confirm the Motion
  objective: Produce a consistent astrometric track and identify observations that should be down-weighted or repeated.
  briefing: Follow-up telescopes obtain positions with different clocks and plate solutions. The player must combine astrometry
    without creating a false trajectory from inconsistent reference frames.
  stake: A weak orbit can either lose the object or falsely place Earth in its path.
  takeaway: Use angular coordinates, plate calibration, time standards, uncertainty, residuals as an evidence chain rather
    than as isolated facts.
  stops:
  - group: OPS
    task: Which explanation fits the residual pattern across field position, timing, catalog stars, and the independent telescope?
    title: Why do the measured positions disagree?
    place: Follow-Up Telescope Network
    scene: Follow-up astrometry from one wide-field camera curves away from the orbit fit, while a second telescope agrees.
      The team must decide whether the asteroid accelerated unexpectedly or one observing system carries a position-dependent
      bias.
    takeaway: 'Astrometric residuals can diagnose the instrument: a bias that follows focal-plane position rather than the
      moving object is a calibration signature.'
    format: DIAGNOSIS
    headline: Follow-up astrometry from one wide-field camera curves away from the orbit fit, while a second telescope agrees.
    readings:
    - zone: Asteroid residuals
      label: Asteroid residuals
      value: Grow toward field edge
      status: alarm
      note: Small near center, larger at large radius
    - zone: Reference-star residuals
      label: Reference-star residuals
      value: Show the same spatial pattern
      status: alarm
      note: Not unique to the asteroid
    - zone: Exposure timestamps
      label: Exposure timestamps
      value: Agree with observatory clock
      status: alarm
      note: No measurable timing jump
    - zone: Second telescope
      label: Second telescope
      value: Agrees with predicted orbit
      status: normal
      note: Independent instrument does not see the offset
    - zone: Distortion calibration
      label: Distortion calibration
      value: Older than current camera configuration
      status: alarm
      note: Geometric model may be stale
    choices:
    - label: Focal-plane distortion calibration error
      mechanism: A position-dependent mapping from detector coordinates to sky coordinates biases both stars and asteroid
        near the field edge.
    - label: Real asteroid acceleration
      mechanism: A physical force changes only the asteroid trajectory on the sky.
    - label: Timing error
      mechanism: Incorrect exposure time shifts moving-object positions while fixed reference stars remain correctly mapped.
    - label: Catalog-wide star error
      mechanism: The reference catalog is wrong in the same way for both telescopes and all field positions.
    answer: Focal-plane distortion calibration error
    why: The residual follows detector position and appears in reference stars, while timestamps are sound and a second telescope
      agrees with the orbit. That pattern localizes the problem to the camera geometry model.
  - group: ORBIT
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: Build the observation arc
    place: Astrometry Lab
    scene: Order the process.
    takeaway: Prediction is the operational test of an astrometric model.
    format: SEQUENCE
    cards:
    - Place every measurement in a common coordinate and time system.
    - Fit a preliminary sky-plane motion model.
    - Inspect residuals for station, time, or field-dependent structure.
    - Predict the next uncertainty region and schedule follow-up.
    order:
    - 0
    - 1
    - 2
    - 3
    why: A preliminary model becomes useful when residuals are interrogated and predictions are tested.
  - group: OPS
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Buy the best next observation
    place: Time Standards Room
    scene: Allocate 100 follow-up credits.
    takeaway: The best follow-up is chosen for information gain, not convenience or publicity.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Another exposure immediately from the same telescope.
    - label: B
      text: A later observation that lengthens the time baseline.
    - label: C
      text: A geographically separated observation for parallax.
    - label: D
      text: A press release before confirmation.
    recommended:
      A: 20
      B: 45
      C: 35
      D: 0
    evidence: Allocate 100 follow-up credits.
- title: An Orbit from Sparse Data
  objective: Construct a family of allowed orbits and choose observations that collapse the dangerous dimensions.
  briefing: Only a short arc is available, and many three-dimensional orbits project to nearly the same sky motion. The player
    must reason with Keplerian motion and orbit families rather than report one overconfident solution.
  stake: An overconfident nominal orbit can hide impact solutions that remain inside the uncertainty region.
  takeaway: Use Keplerian orbits, state vectors, degeneracy, orbital elements, prediction as an evidence chain rather than
    as isolated facts.
  stops:
  - group: ORBIT
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: From angles to orbit family
    place: Orbit Determination Center
    scene: Order the orbit-determination logic.
    takeaway: Uncertainty should be propagated as an ensemble of physically allowed trajectories.
    format: SEQUENCE
    cards:
    - Combine timed directions and any range information.
    - Generate state vectors consistent with the observations and uncertainties.
    - Propagate each allowed state under gravity.
    - Compare future sky positions and Earth-approach distances across the family.
    order:
    - 0
    - 1
    - 2
    - 3
    why: Sparse angular data define a region of state space, not a unique orbit.
  - group: OPS
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Which orbit feature does the data constrain?
    place: Celestial Mechanics Group
    scene: Match each evidence type to its strongest contribution.
    takeaway: Orbit determination is an information-geometry problem.
    format: PROTOCOL
    scenarios:
    - Longer observation arc.
    - Radar range.
    - Radar range rate.
    - Observations from widely separated Earth locations.
    choices:
    - Curvature and mean motion.
    - Line-of-sight distance.
    - Line-of-sight velocity.
    - Parallax and distance geometry.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: Different observations collapse different orbit degeneracies.
  - group: OPS
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Collapse the orbit uncertainty
    place: Follow-Up Scheduling Desk
    scene: Allocate 100 credits.
    takeaway: A sharper-looking orbit is not a better orbit unless new evidence narrows the allowed family.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Obtain radar range if geometry permits.
    - label: B
      text: Extend optical tracking over additional nights.
    - label: C
      text: Improve the nominal orbit display without changing data.
    - label: D
      text: Observe from a second hemisphere or long baseline.
    recommended:
      A: 35
      B: 40
      C: 0
      D: 25
    evidence: Allocate 100 credits.
- title: The Uncertainty Corridor
  objective: Report an impact probability and uncertainty corridor that remain meaningful as new data arrive.
  briefing: The nominal trajectory misses Earth, but a thin set of allowed solutions passes through it. The player must interpret
    probability, covariance, and nonlinear propagation without confusing low probability with zero consequence.
  stake: Poor communication can either create panic or delay preparations for a genuine low-probability, high-consequence
    threat.
  takeaway: Use probability distributions, covariance, nonlinear propagation, risk corridors, decision thresholds as an evidence
    chain rather than as isolated facts.
  stops:
  - group: IMPACT
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Read the risk correctly
    place: Impact Monitoring Center
    scene: Match each statement to the scientifically defensible interpretation.
    takeaway: Planetary-defense risk lives in the distribution, not just the best-fit trajectory.
    format: PROTOCOL
    scenarios:
    - Nominal orbit misses Earth.
    - A small fraction of allowed orbits intersect Earth.
    - New data remove most impact solutions.
    - Probability rises after an observation even though the nominal miss distance increases.
    choices:
    - A miss is not guaranteed while uncertainty remains.
    - Impact probability is nonzero and should be monitored.
    - Risk has decreased because the allowed region changed.
    - Nonlinear geometry can redistribute probability; inspect the full solution set.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: Nominal values and integrated probabilities answer different questions.
  - group: ORBIT
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Probability from an ensemble
    place: Statistical Orbit Lab
    scene: In a simplified Monte Carlo set, 37 of 100,000 allowed trajectories strike Earth.
    takeaway: A tiny probability can be estimated only with enough samples and a valid uncertainty model.
    format: BALLPARK
    question: Estimate probability as a decimal and percent.
    estimate:
      labels:
      - 37 impacting samples
      - 100000 total samples
      values:
      - 37
      - 100000
      slots: 2
      template: '{0}/{1} x 100'
      formula: a/b*100
      correct:
      - 0
      - 1
      target: 0.037
      tolerance: 0.004
      units: '%'
      solution: 37/100000 = 3.7e-4 = 0.037%.
      prompt: In a simplified Monte Carlo set, 37 of 100,000 allowed trajectories strike Earth.
      question: Estimate probability as a decimal and percent.
  - group: OPS
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Reduce the dangerous uncertainty
    place: Planetary Defense Coordination Office
    scene: Allocate 100 credits.
    takeaway: The best observation separates the live hypotheses rather than merely adding another point.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Observe where predicted positions differ most among impact and non-impact solutions.
    - label: B
      text: Repeat low-leverage images that all solutions predict equally.
    - label: C
      text: Improve timing and astrometric bias calibration.
    - label: D
      text: Run independent orbit software and assumptions.
    recommended:
      A: 40
      B: 10
      C: 25
      D: 25
    evidence: Allocate 100 credits.
- title: How Large Is It?
  objective: Produce a diameter range rather than a single unsupported value.
  briefing: "The object\u2019s brightness is known, but size depends strongly on reflectivity. The player must combine photometry,\
    \ albedo, and thermal evidence to bound diameter."
  stake: Impact energy depends strongly on size, so a factor-of-two diameter error becomes a much larger mass and energy error.
  takeaway: Use brightness, inverse-square law, albedo, thermal emission, size degeneracy as an evidence chain rather than
    as isolated facts.
  stops:
  - group: CHAR
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: What controls apparent brightness?
    place: Photometry Lab
    scene: Match each factor to its role.
    takeaway: A bright asteroid is not necessarily large.
    format: PROTOCOL
    scenarios:
    - Larger cross-sectional area.
    - Higher reflectivity.
    - Greater distance from the Sun.
    - Greater distance from the observer.
    choices:
    - Usually increases reflected flux.
    - Increases reflected flux for the same size and geometry.
    - Reduces illumination.
    - Reduces received flux through geometric spreading.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: Brightness entangles size, reflectivity, and geometry.
  - group: OPS
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Diameter-albedo degeneracy
    place: Infrared Telescope Team
    scene: Two objects have the same reflected brightness, but one has four times the albedo.
    takeaway: Photometry alone cannot uniquely determine size without an albedo assumption.
    format: BALLPARK
    question: "How does the higher-albedo object\u2019s diameter compare?"
    estimate:
      labels:
      - 4 x albedo
      - 1 x reference brightness
      values:
      - 4
      - 1
      slots: 2
      template: sqrt({1}/{0})
      formula: Math.sqrt(b/a)
      correct:
      - 0
      - 1
      target: 0.5
      tolerance: 0.05
      units: diameter ratio
      solution: At fixed reflected brightness, four times the albedo permits about half the diameter.
      prompt: Two objects have the same reflected brightness, but one has four times the albedo.
      question: "How does the higher-albedo object\u2019s diameter compare?"
  - group: CHAR
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Bound the diameter
    place: Physical Characterization Group
    scene: Allocate 100 characterization credits.
    takeaway: Physical characterization improves when methods break the same degeneracy in independent ways.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Thermal-infrared measurement.
    - label: B
      text: Multi-band reflected-light photometry and phase behavior.
    - label: C
      text: Assume the average albedo of a familiar asteroid class.
    - label: D
      text: Radar size constraints if available.
    recommended:
      A: 40
      B: 25
      C: 10
      D: 25
    evidence: Allocate 100 characterization credits.
- title: What Is It Made Of?
  objective: Assign a composition class with explicit alternatives and confidence.
  briefing: Spectra show broad features, but weathering, grain size, and viewing geometry complicate composition. The player
    must avoid turning a taxonomic resemblance into an exact material claim.
  stake: Composition affects density, fragmentation, and deflection response, so an unsupported label can distort every later
    model.
  takeaway: Use spectra, absorption features, mineralogy, taxonomy, model ambiguity as an evidence chain rather than as isolated
    facts.
  stops:
  - group: CHAR
    task: Which explanation fits the target, standard star, airmass, and space-based comparison?
    title: Real absorption or spectral artifact?
    place: Spectroscopy Observatory
    scene: A spectrum seems to show a broad absorption feature that could change the inferred surface composition. The spectroscopy
      team checks whether the feature belongs to the asteroid, Earth atmosphere, or the detector.
    takeaway: A spectrum contains the telescope, detector, Earth atmosphere, and target all at once; composition requires
      separating those layers.
    format: DIAGNOSIS
    headline: A spectrum seems to show a broad absorption feature that could change the inferred surface composition.
    readings:
    - zone: Asteroid spectrum
      label: Asteroid spectrum
      value: Broad dip near 1.4 microns
      status: alarm
      note: Candidate composition feature
    - zone: Standard-star spectrum
      label: Standard-star spectrum
      value: Dip at the same wavelength
      status: alarm
      note: Observed through the same atmosphere
    - zone: Airmass dependence
      label: Airmass dependence
      value: Feature deepens at larger airmass
      status: alarm
      note: Tracks atmospheric path length
    - zone: Detector flat field
      label: Detector flat field
      value: Stable
      status: normal
      note: No matching pixel-scale sensitivity defect
    - zone: Space-based spectrum
      label: Space-based spectrum
      value: Feature absent
      status: alarm
      note: No terrestrial atmosphere in that observation
    choices:
    - label: Asteroid mineral absorption
      mechanism: Surface material absorbs light at that wavelength.
    - label: Telluric atmospheric absorption
      mechanism: Molecules in Earth atmosphere imprint the same wavelength-dependent feature on ground-based spectra.
    - label: Detector flat-field error
      mechanism: Pixel sensitivity creates a fixed instrumental dip independent of atmospheric path.
    - label: Random noise
      mechanism: An uncorrelated fluctuation happens to mimic a broad repeatable feature.
    answer: Telluric atmospheric absorption
    why: The feature appears in the standard star, strengthens with airmass, is absent from space, and is not tied to detector
      flat-field structure. It belongs to Earth atmosphere, not the asteroid.
  - group: OPS
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: From photons to composition class
    place: Meteorite Comparison Lab
    scene: Order the inference chain.
    takeaway: A good composition result retains the plausible alternatives.
    format: SEQUENCE
    cards:
    - Calibrate solar, atmospheric, and instrument response.
    - Measure reflectance as a function of wavelength.
    - Identify robust features and compare multiple physical models.
    - Report supported classes, alternatives, and needed follow-up.
    order:
    - 0
    - 1
    - 2
    - 3
    why: Calibration precedes feature interpretation and model comparison.
  - group: OPS
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Improve the composition claim
    place: Composition Review Room
    scene: Allocate 100 credits.
    takeaway: Characterization should seek discriminating evidence rather than stronger labels.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Extend wavelength coverage.
    - label: B
      text: Observe at additional phase angles or rotations.
    - label: C
      text: Obtain polarimetry or radar texture constraints.
    - label: D
      text: Rename the asteroid after the preferred composition.
    recommended:
      A: 40
      B: 25
      C: 35
      D: 0
    evidence: Allocate 100 credits.
- title: The Spinning Target
  objective: Produce a rotation-state range suitable for imaging and deflection planning.
  briefing: Brightness varies dramatically over hours, suggesting rotation and an elongated shape. The player must derive
    a period, identify aliases, and determine whether the body may be tumbling.
  stake: A mistimed encounter can image or strike the wrong face of the asteroid.
  takeaway: Use periodic signals, light curves, aliasing, rotation, shape inference as an evidence chain rather than as isolated
    facts.
  stops:
  - group: CHAR
    task: Which explanation fits the repeatability, comparison stars, filters, and observing geometry?
    title: Rotation or observing artifact?
    place: Time-Series Photometry Network
    scene: The asteroid brightens and fades by a few tenths of a magnitude. The team wants to use the pattern to infer spin,
      but first it must prove that the periodicity belongs to the object rather than clouds or detector drift.
    takeaway: Periodicity becomes physical evidence only after environmental and instrumental periodicities are ruled out.
    format: DIAGNOSIS
    headline: The asteroid brightens and fades by a few tenths of a magnitude.
    readings:
    - zone: Asteroid brightness
      label: Asteroid brightness
      value: Repeats every 4.8 hours
      status: alarm
      note: Pattern appears across two nights
    - zone: Comparison stars
      label: Comparison stars
      value: Stable to within measurement noise
      status: normal
      note: Sky transparency and calibration remain steady
    - zone: Two filters
      label: Two filters
      value: Same period in both
      status: alarm
      note: Not confined to one detector response band
    - zone: Detector position
      label: Detector position
      value: Object lands on different pixels
      status: alarm
      note: Pattern does not follow one pixel region
    - zone: Phase-angle trend
      label: Phase-angle trend
      value: Slow monotonic change only
      status: alarm
      note: Too slow to create the repeating cycle
    choices:
    - label: Asteroid rotation
      mechanism: An irregular shape or surface pattern presents changing projected brightness as the body spins.
    - label: Passing clouds
      mechanism: Atmospheric transparency changes all sources together.
    - label: Detector sensitivity drift
      mechanism: One detector region changes response with time.
    - label: Phase-angle change
      mechanism: The Sun-object-observer geometry changes brightness smoothly over the observing span.
    answer: Asteroid rotation

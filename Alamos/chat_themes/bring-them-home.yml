warmups:
  greet:
    title: Meet the six people who can save the crew
    why: Meet each lead now so you know who owns the ship's path, power, air, radio, motion,
      and final calls.
  trial-near:
    title: Carry the first alarm across Mission Control
    why: Reach the pressure, power, and guidance consoles before the crew acts on three readings
      that may share one fault.
  follow:
    title: Shadow the live handover
    why: Follow the outgoing controller so no lost fact becomes the next shift's wrong order.
  hunt:
    title: Find the missing survival logs
    item:
      name: consumable log
      plural: consumable logs
    why: Recover the air, water, power, fuel, heat, and filter logs so the room knows how long
      the crew can live.
  canvass:
    title: Find who truly saw the explosion
    why: Ask each console what it measured so one bad data path is not mistaken for damage across
      the ship.
  evade:
    title: Keep an unverified story off the air
    why: Avoid the press officer until the room knows whether the crew faces a leak or a sensor
      fault.
  tag:
    title: Catch Reyes before the first burn call
    why: Reach Reyes with the corrected ship mass before she locks a burn based on the old number.
copy:
  NAV: <p>Guidance. Where the spacecraft is, how fast, and how much of that is actually known.</p>
  ELEC: <p>Electrical systems. Every watt aboard is drawn from an inventory that is not being
    refilled.</p>
  THERM: <p>Thermal and life support. Heat, gas and water — the three things a cabin runs
    out of.</p>
  COMMS: <p>Communications. Everything known about the vehicle arrives through this room.</p>
  STRUCT: <p>Structures and dynamics. Rotation, vibration and the loads a spacecraft was built
    to take.</p>
  INTEG: <p>Mission operations. Six rooms report here and one person decides.</p>
  SIGNIN: <p>Badge and sign-in. Nobody reaches the operations floor without appearing on this
    sheet.</p>
  GALLERY: <p>The viewing gallery. Off-shift controllers wait out a burn here rather than
    at home.</p>
  QUIET: <p>The crew family room. Kept staffed, and kept away from the loop.</p>
  LIBRARY: <p>The trajectory library. Every plot, every burn, every version that was superseded.</p>
lessons:
- group: NAV
  title: Which measurement constrains what? — Review
  concept: Doppler shift
  place: Deep-Space Tracking Station
  task: Match each observation to the part of the state it leaves unmeasured.
  scene: Whitaker has one station and a 20-minute pass. Each reading misses part of the ship's
    state. Name each blind part before the pass begins.
  guide: Four observations, and four things none of them can see. Pair them by asking what
    the instrument is physically sensitive to, then take the complement. A frequency shift
    responds to motion along the beam. A travel time responds to distance along a line. An
    angle fixes the line and nothing on it. And one of the four is built by subtracting two
    earlier answers.
  background:
  - Why this is a matching board and not four separate questions. Responses on boards like
    this are written to be plausible for more than one situation, so choosing them one at
    a time lets a nearly-right answer through unexamined. Having to place all of them forces
    the comparison — not "is this reasonable here", but "is it more right here than there".
  - Why a blind axis is worth scheduling against. A pass is short and the station can only
    be pointed at one thing at a time, so the observation worth buying is the one whose blind
    axis is already covered by something else. Two measurements blind in the same direction
    cost twice and buy once.
  - Why the transverse direction is the hard one here. A Doppler track is the cheapest measurement
    on the list and the one the room trusts most, and it responds only to the component of
    velocity along the beam. A spacecraft drifting sideways at a kilometre a second moves
    the carrier by nothing.
  takesAsRead:
  - 'Waves: frequency, wavelength, speed'
  - Circular motion and centripetal force
  assumes:
  - a measurement responds to one component of the motion and not to the others
  - subtracting two measured numbers carries both of their errors into the answer
  takeaway: Every observation is blind along some axis.
  format: PROTOCOL
  columns:
  - The observation
  - What it cannot see
  scenarios:
  - A Doppler track held through the whole pass.
  - A round-trip range measurement at closest approach.
  - A pair of star-camera bearings ninety minutes apart.
  - Two positions differenced to give a velocity.
  choices:
  - Motion across the beam. A velocity at right angles to the line of sight shifts the returned
    frequency by nothing at all.
  - Direction. A distance says how far along a line the spacecraft has got and never which
    of the lines it is on.
  - Distance. An angle fixes the line the spacecraft lies along and says nothing whatever
    about how far out it is.
  - Precision. Each position arrives with its own error, and the subtraction carries both
    of them into the rate.
  mapping:
  - 0
  - 1
  - 2
  - 3
  rebuttals:
  - Doppler is a frequency shift.
  - Range is a time multiplied by a speed.
  - A bearing is an angle against catalogued stars.
  - A rate built by subtraction inherits the errors of both numbers subtracted, which is why
    it is the noisiest quantity on the board.
  why: Each observation responds to one part of the motion and is silent about the rest. So
    the useful question about a short pass is not which measurement is best but which axis
    is still uncovered. Doppler carries the line-of-sight component of velocity and nothing
    across it.
  reason: A short pass must measure the part no other tool can see.
- group: NAV
  title: Reconstruct the state vector — Review
  concept: Vectors and components
  place: Guidance Room
  task: Arrange the four cards from the earliest prerequisite or cause to the latest result.
  scene: The guidance unit has reset again. Hand-read star angles remain, but their clocks
    differ. Agree on the axes and clock before using them.
  guide: All four of these will be done, so ask what each one needs to be true already. A
    direction is only a direction once somebody has said which way the axes point. Components
    cannot be added until they are components on the same axes. A velocity is a difference
    between two positions. And the crew read attitude in their own frame, not in the room's.
  background:
  - 'Why the order is graded whole. A sequence is a claim about dependency: each step is here
    because the one before it has already happened, or has to have. One transposed pair falsifies
    that claim wherever it sits, so partial credit would be credit for a sequence that does
    not work.'
  - What a hand-taken mark actually is. A sextant angle between a star and a landmark is a
    direction and a moment, and nothing else. It carries no distance, no frame and no clock
    of its own, which is why all three have to be supplied before any arithmetic is done to
    it.
  - Why the last step is a rotation rather than a calculation. The state is computed in the
    frame the ground works in, and the crew fly the vehicle in theirs. The same vector has
    different numbers in the two, so a state handed across without the rotation is right and
    unusable.
  assumes:
  - a direction is only a set of numbers once the axes have been named
  - components add only when they are components on the same axes
  takeaway: A vector is numbers plus the axes they are measured against.
  format: SEQUENCE
  cards:
  - Name one set of axes and one clock, and record which way each axis points.
  - Resolve every sextant mark into components along the three named axes.
  - Add the components against the last trusted range for a position, and difference two positions
    for a velocity.
  - Rotate the finished state into the crew's own body axes before any burn attitude is read
    off it.
  order:
  - 0
  - 1
  - 2
  - 3
  rebuttals:
  - Name the axes and the clock first.
  - Resolve the marks into components second.
  - Combine into a position and difference for velocity third.
  - Rotate into body axes last.
  why: A vector is a set of numbers together with the axes they are measured against. The
    numbers mean nothing without the axes. So the frame and the clock are settled before anything
    is resolved.
  reason: A burn vector is useless until its axes and clock agree.
- group: INTEG
  title: 'What failed: the spacecraft or the sensors? — Review'
  concept: 'Systems thinking: dependency, redundancy, failure modes'
  place: Mission Control
  task: Open the dependency chain behind each temperature reading, keep what stands on its
    own, and name the shared source.
  scene: Three tank sensors rise after one circuit card was changed. Two other tools stay
    steady. Decide if the tank is hot before venting fuel.
  guide: Open each temperature channel to see what it depends on. Keep the ones that would
    still stand if the new card were faulty, and untick the rest. Then name the shared source.
    Venting the tank is not free and it is not reversible, so the question is whether the
    gas is warming or the measurement chain is.
  background:
  - Why three thermocouples can be one measurement. Redundant temperature channels are usually
    amplified and digitised by one conditioning card, which supplies the excitation and the
    cold-junction reference. A fault in either moves all three readings the same way at the
    same moment, which is exactly what a warming tank looks like on the display.
  - Why the boil-off rate is worth more than three thermocouples here. Gas leaving a tank
    through a relief path is a flow, measured by a different instrument on a different chain,
    and it is a direct consequence of the tank being warm. It cannot inherit a fault in the
    temperature electronics because it does not pass through them.
  - Why the timing matters as much as the pattern. The card was fitted this morning, and the
    divergence starts hours later rather than at the swap, which is how a marginal connection
    behaves as it warms. A shared cause does not have to act at the instant it is installed.
  assumes:
  - redundant sensors often share one amplifier and one reference
  - an instrument on a different physical principle does not inherit that fault
  takeaway: Redundancy only buys independence when the redundant paths do not meet.
  format: TRACE
  question: Which temperature evidence survives the dependency check, and what shared source
    moved the rest?
  trace:
    decision: Decide whether the tank gas is really warming or three channels inherited a
      fault in the new conditioning card.
    hint: Open each channel to see what it depends on. Keep the channels whose measurement
      path does not run through the suspect card.
    channels:
    - id: tc_a
      label: Tank thermocouple A
      reading: up nine degrees Celsius in four minutes
      depends:
      - tank
      - cond_card
    - id: tc_b
      label: Tank thermocouple B
      reading: up nine degrees Celsius in four minutes
      depends:
      - tank
      - cond_card
    - id: tc_c
      label: Tank thermocouple C
      reading: up eight degrees Celsius in four minutes
      depends:
      - tank
      - cond_card
    - id: boiloff
      label: Relief line boil-off rate
      reading: steady at 0.4 kilograms an hour since the bang
      depends:
      - tank
      - vent_path
    - id: handheld
      label: Crew hand-held infrared reading
      reading: within a degree of the figure taken this morning
      depends:
      - tank
      - crew_optics
    resources:
    - id: tank
      label: Tank gas temperature
    - id: cond_card
      label: Signal conditioning card fitted this morning
    - id: vent_path
      label: Relief line flow meter
    - id: crew_optics
      label: Hand-held infrared thermometer
    target: cond_card
    independent:
    - boiloff
    - handheld
  answerText: Keep the boil-off rate and the crew's hand-held reading.
  why: Three channels agreeing is three votes only if they can fail separately. These three
    are amplified and referenced by one card. A fault in that card moves all of them the same
    way at once, which is indistinguishable on the display from a tank that is genuinely warming.
  reason: Venting for a bad card would throw away fuel the crew needs.
- group: THERM
  title: What the pressure difference is for — Review
  concept: Fluid pressure and flow
  place: Life Support Lab
  task: The pump still holds 24 psi across the loop and the flow has fallen by a third. What
    does that combination mean?
  scene: Coolant flow falls by one third, but the pump still adds 24 psi. Decide whether the
    push or the path changed.
  guide: 'All four options explain a flow that has fallen. They differ in what they hold responsible:
    the path, the pump, the instrument, or the fluid. Ask of each whether it is consistent
    with a driving difference that has not moved. A pressure difference makes the fluid go;
    how obstructed the path is decides how much of it goes per minute.'
  background:
  - Why the wrong options are the interesting ones. Each distractor is written to be the answer
    under one specific misreading — a step skipped, a quantity confused with a rate, a correlation
    taken for a cause. Identifying which misreading each belongs to is where the learning
    is; the right answer alone can be reached on instinct and teach nothing.
  - 'Why an unchanged difference is the informative half. Two numbers describe this loop:
    what pushes and what resists. If the push is where it was and the flow has fallen, the
    resistance is the only term left to have moved. Had the difference fallen with the flow,
    the pump would be the first thing to look at instead.'
  - What can add resistance in a cold loop. A partly closed valve, a loaded filter, gas collected
    at a high point, or glycol thickening as the cabin cools. All four reduce the flow at
    an unchanged pressure difference, and the way to separate them is where in the loop the
    pressure is lost rather than how much.
  takesAsRead:
  - Newton's laws and free-body reasoning
  assumes:
  - a pressure difference drives a flow and the path decides its rate
  takeaway: When the push has not changed and the flow has, the path is what moved.
  format: CHOICE
  question: The pump still holds 24 psi across the loop and the flow has fallen by a third.
    What does that combination mean?
  choices:
  - The push is unchanged, so the loss of flow points to added resistance in the loop.
  - A pump holding its pressure rise cannot have lost flow, so the flow meter is at fault.
  - Pressure difference and flow are one measurement in two units, so both readings cannot
    be right together.
  - Colder glycol is denser, and a denser fluid always carries more flow at the same pressure
    difference.
  answer: The push is unchanged, so the loss of flow points to added resistance in the loop.
  rebuttals:
  - A pump sets the pressure rise it can hold, not the flow that results.
  - They are two different quantities.
  - Cooling thickens glycol rather than helping it along.
  why: Two quantities describe this loop and only one of them has moved. The pressure difference
    is what drives the glycol. The resistance of the path decides how much arrives per minute.
  reason: The crew needs flow, not just a healthy pump reading.

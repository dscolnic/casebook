    reason: The crew needs a path that survives a bad water estimate.
  - group: THERM
    task: Order the commitment so the abort trigger still has something to act on.
    title: Commit to the path
    place: Thermal and Entry Review
    scene: The burn will close most other paths. Before it starts, write the sign that would
      prove this plan unsafe while there is still time to act.
    guide: All four of these will happen, and the burn closes most of the alternatives. Ask
      of each what would be impossible afterwards. Comparing candidates under the nominal
      case settles nothing, because the nominal case was never in doubt. And an abort trigger
      defined after the burn is a trigger with nothing left to act on.
    background:
    - 'Why the order is graded whole. A sequence is a claim about dependency: each step is
      here because the one before it has already happened, or has to have. One transposed
      pair falsifies that claim wherever it sits, so partial credit would be credit for a
      sequence that does not work.'
    - Why the ends are the place to start. The first and last cards are constrained by having
      nothing before or after them, which usually makes them the two you can settle from the
      scene alone. Pinning them collapses the remaining arrangements sharply, and what is
      left in the middle is where the actual judgement lives.
    - What the rail can be ordered on. Time is the usual axis, but it is not the only one.
      An order can run on cost, on risk, or on reversibility — every observation that leaves
      the sample as it was, before any that consumes it. On those boards a chronological reading
      finds nothing, because none of the steps has to happen at a particular hour.
    takeaway: Set the bad sign before the burn. After the burn, the same sign may come too
      late to help.
    format: SEQUENCE
    rebuttals:
    - 'Quantify the margins first: fuel, consumables, thermal, corridor width.'
    - Compare under off-planned conditions second.
    - Name the abort observation and its time third.
    - Burn last.
    assumes:
    - a decision can only be undone while the means to undo it still exist
    cards:
    - 'Quantify the margins: propellant, consumables, thermal, and the corridor width.'
    - Compare the candidates under the off-nominal cases, not the nominal one.
    - Name the observation that would show the choice was wrong, and the time it arrives.
    - Burn, and keep updating the margins against what the tracking returns.
    order:
    - 0
    - 1
    - 2
    - 3
    why: Set the bad sign before the burn. After the burn, the same sign may come too late
      to help. An abort rule helps only while fuel remains to use it.
    reason: An abort rule helps only while fuel remains to use it.

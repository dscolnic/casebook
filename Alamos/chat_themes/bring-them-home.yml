- title: Choose the Return Path
  objective: Select a return plan with explicit margins and contingencies for the dominant
    uncertainties.
  briefing: Four paths home spend fuel, time, water, and entry margin in different ways. Choose
    the one that survives a bad estimate.
  stake: Four paths home remain, and each spends a different safety margin. Water may run
    out almost a day earlier than the best estimate. You must choose the path that still works
    when that estimate is wrong.
  takeaway: Use optimization, constraints, trade spaces, margins, critical path as an evidence
    chain rather than as isolated facts.
  stops:
  - group: INTEG
    task: Match each case to the best scientific answer. Use each choice once.
    title: Name the binding constraint
    place: Mission Design Center
    scene: Four paths home are on the board. Each spends fuel, time, water, heat, or radio
      cover. Name the limit each path comes closest to.
    guide: 'Four return paths, and four subsystems that pay for them. Pair them by asking
      what each path spends: consumables, propellant, heating, or the crew''s own ability
      to navigate. No path is cheapest on every count. So the useful question is not which
      is fastest but which constraint each one pushes closest to its limit.'
    background:
    - Why this is a matching board and not four separate questions. Responses on boards like
      this are written to be plausible for more than one situation, so choosing them one at
      a time lets a nearly-right answer through unexamined. Having to place all of them forces
      the comparison — not "is this reasonable here", but "is it more right here than there".
    - How to use the one-each rule. Because the responses are a set to be distributed rather
      than a list to be sampled, every join you make constrains the rest. Settling the two
      you are confident of can leave the remaining pair decided by elimination. Where it does
      not, two responses are still competing for one situation, and that is exactly the distinction
      the stop is testing.
    - 'Why you cannot be wrong about exactly one. With every response used once, three correct
      joins leave the fourth with only one place to go. Any error therefore involves at least
      two joins. That is worth remembering when the last pair looks forced: the fault is usually
      not in the join you are struggling with, but in one you made early and stopped questioning.'
    assumes:
    - a spacecraft carries a fixed amount of everything it needs
    takeaway: Each path spends a different margin. The binding limit is the one closest to
      failure.
    format: PROTOCOL
    why: Each path spends a different margin. The binding limit is the one closest to failure.
      The safest path is set by the limit it nearly breaks.
    columns:
    - What the option changes
    - What runs out first
    rebuttals:
    - More days is more oxygen, more water, more scrubber capacity and more power.
    - A larger burn is fuel.
    - A steeper entry raises peak heating and deceleration together.
    - A long blackout is time with no ground support.
    scenarios:
    - Longer return time.
    - Larger correction burn.
    - Steeper atmospheric entry.
    - Long communications blackout.
    choices:
    - Consumables and thermal survival.
    - Fuel and propulsion reliability.
    - Heating and deceleration.
    - Crew autonomy and navigation confidence.
    mapping:
    - 0
    - 1
    - 2
    - 3
    reason: The safest path is set by the limit it nearly breaks.
  - group: INTEG
    task: Move the consumable-endurance assumption through its allowed range and choose the
      return path that remains feasible at the pessimistic end.
    title: Select the robust trajectory
    place: Life-Support Desk
    scene: The four paths take 58, 63, 66, or 71 hours. Their fuel and entry margins differ.
      Choose the one that still works if water runs short early.
    guide: Four return paths, and the consumable estimate is uncertain by about a day. Move
      that estimate to its pessimistic end before choosing, and watch which trajectories go
      dark. A path that works at the nominal estimate and fails a day short is not a plan.
      Water is the tightest supply, so it is the one to test against.
    background:
    - Why the pessimistic end rather than the expected one. The endurance figure is an estimate
      with a spread, not a measurement. Choosing at the middle of it means accepting a real
      chance of running out, and running out of water on a return trajectory is not recoverable
      by any later decision.
    - What the trade actually is. A faster path uses more propellant and leaves less entry
      margin; a slower one asks more of the consumables. Neither end is safe, which is why
      the choice is made by testing both against their uncertain quantity rather than by minimising
      one number.
    - Why water rather than oxygen or power. It is the supply with the least margin, so it
      fails first, and every hour added to the trajectory costs it directly. The binding constraint
      is the one worth stressing; testing against a comfortable supply proves nothing.
    assumes:
    - a constraint can eliminate an otherwise attractive option
    - uncertainty should be tested in the direction that makes the plan hardest
    takeaway: Test each path with the worst fair water estimate. The 63-hour path still clears
      all key limits.

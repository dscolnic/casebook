  - group: INTEG
    task: Use the available tracking and targeting actions to place enough of the entry-angle
      distribution inside the safe corridor.
    title: Protect the entry corridor
    place: Crew G-Load Console
    scene: Safe entry lies from 5.3° to 7.7°. The best path is 6.2° with a 0.5° one-sigma
      spread. Use two actions to make the full range safer.
    guide: The display is a probability distribution, not a hard band of every possible angle.
      Its centre is 6.2 degrees and its one-sigma width is 0.5 degrees; the safe corridor
      spans 5.3 to 7.7. One action shifts the centre, while an independent tracking pass reduces
      the statistical width. Apply the actions and judge the probability left outside either
      boundary.
    background:
    - Why one sigma is not a fence. A standard deviation describes the width of a probability
      distribution; it is not the set of all angles the vehicle could have. Entry safety therefore
      depends on how much probability remains outside the corridor, not simply whether the
      drawn one-sigma interval fits between the lines.
    - 'Two different actions. A targeting correction moves the nominal, which slides the whole
      band along the corridor. A tracking pass adds information, which is the only thing that
      makes it narrower. Confusing them is the classic error in this room: the number on the
      display gets better and the risk does not.'
    - Why 'when is it ready' is part of the question. Every action costs time on a clock the
      vehicle sets, and the crew cannot wait for an arbitrarily tight solution. So the decision
      is not merely what to do but when the band is inside the corridor by enough that the
      next hour is better spent elsewhere.
    assumes:
    - an uncertainty band describes a range of plausible states
    - a narrower distribution puts more probability near its center
    takeaway: Moving the mean changes the centre. New tracking narrows the spread. Safe entry
      needs both.

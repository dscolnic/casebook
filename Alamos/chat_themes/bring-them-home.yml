        label: Ground receiver path
      - id: tx_chain
        label: Spacecraft transmitter chain
      - id: pointing
        label: Antenna pointing correction
      reversalRequired: true
      acceptResponseDb: 0.6
      observable:
        label: received power db relative
      response: 11
      truth: pointing
    answerText: The antenna pointing is the cause.
    why: A turn that matches the fade points to antenna aim. Two ground sites make a ground
      fault less likely. The next burn needs both a voice link and tracking data.

- group: T
  task: Allocate 100 research credits across the 3 proposals. You may hold credits in reserve, but explain the decision 
    criterion.
  title: Sensitivity analysis
  setup: A model depends on three uncertain inputs.
  scene: >-
    Von Neumann has a prediction resting on three uncertain inputs and a hundred credits
    to spend on reducing that uncertainty. Wartime schedules mean only some of the three
    can be measured or calculated any better.
  guide: >-
    Decision value is uncertainty multiplied by sensitivity, and the two are
    quoted separately here. One parameter carries the widest uncertainty on the
    list and moves the output almost not at all. One is already the best known of
    the three, and the output is very sensitive to it. The third sits between them
    on both terms. Nothing here is badly measured in absolute terms. What differs
    is how much of the prediction's error each one owns.
  rules: >-
    Spread the hundred points across the 3 proposals. At least 80 of them have to
    be committed, because a panel that funds almost nothing has not decided
    anything. Your largest single allocation must be 35 or more, and it has to
    land on what the evidence supports most. Keep the total sitting on proposals
    the evidence does not support under fifteen. And a proposal it does support
    should not be left under twenty.
  background:
  - >-
    Why the whole spread is graded. Funding is not a vote for one idea. A
    portfolio says what you think is likely, what is worth hedging against, and
    what is not worth pursuing at all — and the last two are where most of the
    information is. Backing the right proposal while quietly funding a bad one is
    a worse answer than it looks. That is why the small numbers count as much as
    the big one.
  - >-
    What the three numbers are for. Thirty-five is what makes a lead a lead: below
    it you have hedged rather than chosen. Fifteen is the most that can sit on
    unsupported work before it stops being a rounding error. Past that it is a
    second opinion nobody argued for. Twenty is the floor under a line of work you
    have already called strong, because funding it too thin to finish spends the
    money and buys nothing.
  - >-
    Why there is a floor on the total. Points held back are not caution; they are
    a decision not to decide, taken with somebody else's money and somebody else's
    deadline. The floor is what forces the panel to say something.
  takeaway: The largest-looking uncertainty is not always the most important one.
  format: SCIENCETANK
  why: Decision value depends on uncertainty multiplied by sensitivity, not uncertainty alone.
  proposals:
  - label: A
    text: A parameter with 20% uncertainty but almost no effect on the output
  - label: B
    text: A parameter with 5% uncertainty and a very large sensitivity
  - label: C
    text: A parameter with 10% uncertainty and moderate sensitivity
  recommended:
    B: 55
    C: 35
    A: 10
  answerText: "Recommended: 55 to B, 35 to C, 10 to A."
- group: T
  task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
  title: Transport equations and approximations
  setup: Match each modeling need to the most appropriate simplified method.
  scene: >-
    Bethe has four modelling jobs waiting and three methods available to the theory group.
    Each job has been going to whichever method its author happens to prefer, and nothing
    on the mesa says which one suits which problem.
  guide: >-
    Four needs and four methods, and no method is best everywhere. Pair them by
    asking what each one costs and what it assumes. One needs scattering to have
    smoothed the angles first. One scales with how many histories you run rather
    than with the geometry. And one is a hand estimate.
  background:
  - >-
    Why this is a matching board and not four separate questions. Responses on
    boards like this are written to be plausible for more than one situation, so
    choosing them one at a time lets a nearly-right answer through unexamined.
    Having to place all of them forces the comparison — not "is this reasonable
    here", but "is it more right here than there".
  - >-
    How to use the one-each rule. Because the responses are a set to be
    distributed rather than a list to be sampled, every join you make constrains
    the rest. Settling the two you are confident of can leave the remaining pair
    decided by elimination. Where it does not, two responses are still competing
    for one situation, and that is exactly the distinction the stop is testing.
  - >-
    Why you cannot be wrong about exactly one. With every response used once,
    three correct joins leave the fourth with only one place to go. Any error
    therefore involves at least two joins. That is worth remembering when the last
    pair looks forced: the fault is usually not in the join you are struggling
    with, but in one you made early and stopped questioning.
  takeaway: Model choice should follow the question and required fidelity.
  format: PROTOCOL
  why: No single method is best for every geometry, energy range, or decision.
  columns:
  - What you want to compute
  - Which method computes it
  scenarios:
  - Rapid whole-system estimate in a strongly scattering region
  - Detailed treatment of complex geometry and rare paths
  - High-precision benchmark in a simple geometry
  - First-order hand estimate
  choices:
  - The diffusion approximation. Valid once scattering has smoothed the angular distribution, and cheap enough to run by
    hand.
  - Monte Carlo. Cost scales with the number of histories rather than with geometric complexity, and rare paths appear 
    only if enough are run.
  - A deterministic transport solver. Repeatable and free of statistical noise, but only where the geometry can be 
    gridded.
  - A scaling argument. Gives no absolute number, only how the answer moves with size or density — often the decision 
    that actually matters.
  mapping: [0, 1, 2, 3]
  answerText: Rapid whole-system estimate in a strongly scattering region -> The diffusion approximation. Valid once 
    scattering has smoothed the angular distribution, and cheap enough to run by hand.; Detailed treatment of complex 
    geometry and rare paths -> Monte Carlo. Cost scales with the number of histories rather than with geometric 
    complexity, and rare paths appear only if enough are run.; High-precision benchmark in a simple geometry -> A 
    deterministic transport solver. Repeatable and free of statistical noise, but only where the geometry can be 
    gridded.; First-order hand estimate -> A scaling argument. Gives no absolute number, only how the answer moves with 
    size or density — often the decision that actually matters.

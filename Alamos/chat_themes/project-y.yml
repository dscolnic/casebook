- group: CM
  task: Allocate 100 research credits across the 3 proposals. You may hold credits in reserve, but explain the decision 
    criterion.
  title: Heat treatment
  setup: A material shows inconsistent hardness after fabrication.
  scene: >-
    Hornig has material coming off fabrication with hardness that will not repeat from one
    batch to the next. A hundred research credits are on the table, and three proposals
    disagree about what a heat treatment even is.
  guide: >-
    One composition can end up harder, softer or more brittle depending on its
    thermal history. The record of that history is therefore part of the result.
    Mapping time and temperature against microstructure gives a process another
    shop can reproduce. Varying the cooling rate on small samples reaches the part
    of the history a fixed schedule holds still. Hardness alone is one number, and
    it can rise while toughness falls. Assembly and shock response both need
    properties that repeat between batches.
  rules: >-
    Spread the hundred points across the 3 proposals. At least 80 of them have to
    be committed, because a panel that funds almost nothing has not decided
    anything. Your largest single allocation must be 35 or more, and it has to
    land on what the evidence supports most. Keep the total sitting on proposals
    the evidence does not support under fifteen. And a proposal it does support
    should not be left under twenty.
  background:
  - >-
    Why the whole spread is graded. Funding is not a vote for one idea. A
    portfolio says what you think is likely, what is worth hedging against, and
    what is not worth pursuing at all — and the last two are where most of the
    information is. Backing the right proposal while quietly funding a bad one is
    a worse answer than it looks. That is why the small numbers count as much as
    the big one.
  - >-
    What the three numbers are for. Thirty-five is what makes a lead a lead: below
    it you have hedged rather than chosen. Fifteen is the most that can sit on
    unsupported work before it stops being a rounding error. Past that it is a
    second opinion nobody argued for. Twenty is the floor under a line of work you
    have already called strong, because funding it too thin to finish spends the
    money and buys nothing.
  - >-
    Why there is a floor on the total. Points held back are not caution; they are
    a decision not to decide, taken with somebody else's money and somebody else's
    deadline. The floor is what forces the panel to say something.
  takeaway: Heat treatment is a reproducible path through temperature and time, not a single temperature setting.
  format: SCIENCETANK
  why: A controlled process map connects thermal history, microstructure, and properties.
  proposals:
  - label: A
    text: Run controlled heat-treatment coupons that map how time and temperature change the metal’s microscopic 
      structure.
  - label: B
    text: Heat the material without a planned schedule and judge success only by whether hardness rises.
  - label: C
    text: Test small samples with several controlled cooling rates, then compare hardness, strength, and microstructure.
  recommended:
    A: 45
    C: 50
  answerText: "Recommended: 45 to A, 50 to C, 5 held; none to B."
- group: CM
  task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
  title: Machining and surface integrity
  setup: Match each machining risk to a control.
  scene: >-
    David Greenglass, the machinist cutting these parts, has a run where every diameter
    measures correct and two components still came back rejected. He wants the controls
    agreed before the next lot goes on the lathe.
  guide: >-
    Four problems and four controls. Pair them by asking what each problem
    damages: the dimensions, the surface beneath them, the chemistry, or the fit.
    A part can be dimensionally perfect and carry a transformed surface layer. And
    one of these drifts gradually, so nothing fails and parts leave tolerance one
    at a time.
  background:
  - >-
    Why this is a matching board and not four separate questions. Responses on
    boards like this are written to be plausible for more than one situation, so
    choosing them one at a time lets a nearly-right answer through unexamined.
    Having to place all of them forces the comparison — not "is this reasonable
    here", but "is it more right here than there".
  - >-
    How to use the one-each rule. Because the responses are a set to be
    distributed rather than a list to be sampled, every join you make constrains
    the rest. Settling the two you are confident of can leave the remaining pair
    decided by elimination. Where it does not, two responses are still competing
    for one situation, and that is exactly the distinction the stop is testing.
  - >-
    Why you cannot be wrong about exactly one. With every response used once,
    three correct joins leave the fourth with only one place to go. Any error
    therefore involves at least two joins. That is worth remembering when the last
    pair looks forced: the fault is usually not in the join you are struggling
    with, but in one you made early and stopped questioning.
  takeaway: A dimension can be correct while the surface or contamination state is unacceptable.
  format: PROTOCOL
  why: Machining quality includes chemistry, stress, cleanliness, and geometry.
  columns:
  - What can go wrong
  - How you control it
  scenarios:
  - Tool wear changes dimensions
  - Cutting heat alters the surface
  - Coolant contaminates the material
  - Burrs interfere with fit
  choices:
  - Track cutting-edge life and re-measure parts through the run. The drift is gradual, so nothing fails — the parts 
    simply leave tolerance one at a time.
  - Control speed, feed, and cooling under a qualified process. A part can be dimensionally perfect and still carry a 
    damaged or transformed surface layer.
  - Use approved coolant and verify post-machining cleaning. The residue is chemical, so no dimensional inspection will 
    find it.
  - Deburr and inspect edges. A raised fragment is small enough to pass a dimensional check yet still prevent assembly 
    or break loose later.
  mapping: [0, 1, 2, 3]
  answerText: Tool wear changes dimensions -> Track cutting-edge life and re-measure parts through the run. The drift is
    gradual, so nothing fails — the parts simply leave tolerance one at a time; Cutting heat alters the surface -> 
    Control speed, feed, and cooling under a qualified process. A part can be dimensionally perfect and still carry a 
    damaged or transformed surface layer; Coolant contaminates the material -> Use approved coolant and verify 
    post-machining cleaning. The residue is chemical, so no dimensional inspection will find it; Burrs interfere with 
    fit -> Deburr and inspect edges. A raised fragment is small enough to pass a dimensional check yet still prevent 
    assembly or break loose later
- group: CM
  task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
  title: Nondestructive evaluation
  setup: Match each defect to a likely method.
  scene: >-
    Bradbury has four finished components and four different worries about them, and not
    one of the four can be cut apart to settle the question. The inspection bay wants to
    know what to book time for.
  guide: >-
    Four flaws and four methods. Pair them by asking where the flaw is and what
    the material allows. Does it reach the surface? Is it deep in the bulk? Just
    under a conductive skin? Or is the whole shape wrong? A surface method cannot
    see into a thick part however good it is.
  background:
  - >-
    Why this is a matching board and not four separate questions. Responses on
    boards like this are written to be plausible for more than one situation, so
    choosing them one at a time lets a nearly-right answer through unexamined.
    Having to place all of them forces the comparison — not "is this reasonable
    here", but "is it more right here than there".
  - >-
    How to use the one-each rule. Because the responses are a set to be
    distributed rather than a list to be sampled, every join you make constrains
    the rest. Settling the two you are confident of can leave the remaining pair
    decided by elimination. Where it does not, two responses are still competing
    for one situation, and that is exactly the distinction the stop is testing.
  - >-
    Why you cannot be wrong about exactly one. With every response used once,
    three correct joins leave the fourth with only one place to go. Any error
    therefore involves at least two joins. That is worth remembering when the last
    pair looks forced: the fault is usually not in the join you are struggling
    with, but in one you made early and stopped questioning.
  takeaway: No single nondestructive test sees every defect.
  format: PROTOCOL
  why: Inspection method must match defect location, material, and required resolution.
  columns:
  - What you need to find
  - Which method finds it
  scenarios:
  - Surface-breaking crack on a nonporous part
  - Internal void in a thick object
  - Subsurface flaw in a conductive material
  - Overall dimensional distortion
  choices:
  - Dye penetrant. Liquid wicks in and bleeds back out under developer, so the flaw must reach the surface and the 
    surface must not absorb the dye.
  - Radiography or ultrasound. Both send energy through the bulk, reaching flaws no surface method can see.
  - Eddy-current testing. Induced currents are perturbed by a flaw just below the surface, but only in metals.
  - Dimensional metrology. Nothing is cracked or hollow, so what is measured is geometry against the drawing.
  mapping: [0, 1, 2, 3]
  answerText: Surface-breaking crack on a nonporous part -> Dye penetrant. Liquid wicks in and bleeds back out under 
    developer, so the flaw must reach the surface and the surface must not absorb the dye.; Internal void in a thick 
    object -> Radiography or ultrasound. Both send energy through the bulk, reaching flaws no surface method can see.; 
    Subsurface flaw in a conductive material -> Eddy-current testing. Induced currents are perturbed by a flaw just 
    below the surface, but only in metals.; Overall dimensional distortion -> Dimensional metrology. Nothing is cracked 
    or hollow, so what is measured is geometry against the drawing.
- group: CM
  task: Estimate the unaccounted amount.
  title: Assay and inventory
  setup: A process begins with 100.0 units of material and reports 97.5 units in product plus 1.5 units in measured 
    waste.
  scene: >-
    A run started with 100 units, shipped 97.5 as product, and measured 1.5 in waste.
    Seaborg has to write the inventory line before the material moves on, and a
    discrepancy here is a security matter as well as a scientific one.
  guide: >-
    Four numbers, and two of them are waste figures ten times apart. Ask of each
    which one this run produced. And note what the answer is. It is what the
    balance cannot account for, which is the number the whole exercise exists to
    produce.
  background:
  - >-
    Why an estimate rather than a calculation. Every quantity on this board is
    already measured or stated, so nothing here has to be derived. What is being
    tested is whether you can pick the quantities the relationship actually needs,
    and whether the size of the answer looks right once they are in place.
  - >-
    Why the tiles carry labels. A bare number cannot be checked against the
    relationship it is going into. Reading the label is how a unit mismatch, or a
    quantity belonging to a different part of the problem, is caught before it is
    placed — which is the habit this format exists to build.
  takeaway: An inventory difference is a question requiring uncertainty analysis, not automatic evidence of loss.
  format: BALLPARK
  why: 100.0 - 97.5 - 1.5=1.0.
  estimate:
    prompt: A process starts with 100.0 units of material, ships 97.5 units as product, and measures 1.5 units in waste.
      Estimate the unaccounted amount.
    question: Choose the starting, product, and waste amounts.
    labels:
    - 100 starting units
    - 97.5 product units
    - 1.5 waste units
    - 15 waste units
    values: [100, 97.5, 1.5, 15]
    slots: 3
    template: unaccounted ≈ {0} − {1} − {2}
    formula: a-b-c
    correct: [0, 1, 2]
    target: 1
    tolerance: 0.12
    units: unit
    solution: 100 − 97.5 − 1.5 = 1.0 unit.
    explanation: A high-yield process can still leave a small but important inventory discrepancy after product and 
      measured waste are counted.
    givens:
    - Unaccounted inventory = input - known outputs
    relationship: "Mass balance: what is unaccounted for = what went in − product − waste."
  answerText: 1.0 unit.

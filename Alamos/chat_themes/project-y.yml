    Bethe has a late-stage design review in which every extra interface adds manufacturing, modeling, and diagnostic uncertainty.
    The question is not which historic geometry to build, but why simpler configurations are often easier to validate.
  guide: >-
    Four problems and four things the simplification buys. Pair them by asking who
    each one helps: the machinists, the theorists, the test programme, or the
    programme's need to freeze one configuration. Fewer manufactured interfaces is
    a physics answer and a systems answer at the same time.

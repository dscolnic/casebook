      bench. This programme cannot spare either the material or the weeks, so the
      question is what changed between the qualified coupon and this actual part.
    guide: >-
      Four properties, and none of them is a synonym for another. Ask of each what
      it actually measures. Deflection under load? Where permanent bending begins?
      Resistance to being dented? Or energy absorbed before it breaks? A material
      can be hard and brittle, and that is how a part passes a test and fails in
      service.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to
      be the answer under one specific misreading — a step skipped, a quantity
      confused with a rate, a correlation taken for a cause. Identifying which
      misreading each belongs to is where the learning is; the right answer alone
      can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the
      qualifying clause and the unit. So across a whole game the key used to be the
      longest option far more often than chance — 88 per cent of passage quizzes
      here, before it was fixed. It is now checked per game as a binomial tail, so
      length, hedging and specificity have had the signal taken out of them
      deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the
      verdict prints them — the reason that option fails, not a restatement of the
      right one. They are worth reading after a correct answer as well: a right
      choice made for an approximate reason is indistinguishable from a sound one
      until the day the approximation is what is being tested.
    takesAsRead:
    - "Units and conversions: MeV, u, barns, scientific notation"
    assumes:
    - a material can be strong in one sense and weak in another
    takeaway: Strength, stiffness, hardness, and toughness should not be treated as synonyms.
    format: DIAGNOSIS
    answerText: Machining damaged the surface layer
    why: Four properties are involved and they are not synonyms. Elastic modulus is stiffness — how much it deflects 
      under load. Yield strength is where permanent deformation begins. Hardness is resistance to indentation. Toughness
      is how much energy the material absorbs before it fractures. A material can be hard and brittle, or soft and very 
      tough, so choosing the wrong one of these as 'strong' is how a part that passed every specification arrives 

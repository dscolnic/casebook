  - Proceed only when the test director releases the final hold under the agreed authority structure.
  - After the event, maintain access control, collect remote evidence, and initiate radiation surveys before recovery 
    work.
  order: [0, 1, 2, 3]
  answerText: 1 -> 2 -> 3 -> 4 (Confirm the approved test configuration and all independent sign-offs. -> Review 
    weather, evacuation, communications, diagnostics, and firing-system status at defined holds. -> Proceed only when 
    the test director releases the final hold under the agreed authority structure. -> After the event, maintain access 

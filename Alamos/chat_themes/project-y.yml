# The campaign: One working day each, 3 stops and a callback from day 3.
missions:
- title: The Mesa Has No Common Language
  objective: Build a shared, checkable language for nuclei, isotopes, detector signals, and uncertainty before the new 
    laboratory starts making irreversible decisions.
  briefing: 'Los Alamos is only weeks old. Physicists, chemists, engineers, and military staff are using the same words to
    mean different things. Before the laboratory can compare evidence, the player must make the measurements commensurable:
    identify what was measured, in what units, and through which instrument chain.'
  stake: It is April 1943, and a secret lab now stands where a school once stood. Five teams use different words for the
    same things, so their results do not fit together. Today you must decide what each symbol and signal means. If you fail,
    later choices may rest on errors no one can see.
  takeaway: A large scientific program cannot integrate evidence until measurements share definitions, units, and 
    traceable physical meaning.
  stops:
  - group: T
    call: Decode the nucleus
    reason: The teams cannot compare any later result until the symbols on their boards mean the same physical things.
    task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
    title: The nucleus as a physical system
    setup: A theorist receives four unfamiliar nuclide labels and must extract the right quantity before doing any 
      calculation.
    scene: Your first morning on the Hill. Oppenheimer, the laboratory director, stops at your bench with four nuclide labels and no explanation, 
      and expects the right quantity pulled out of each one before anybody calculates anything.
    guide: >-
      Four things you need and four ways to get them. Pair them by asking what each
      symbol counts. One counts protons. One counts protons and neutrons together.
      So one of these answers is a subtraction rather than a symbol on the label.
      And a neutral atom's electron count follows from its protons.
    background:
    - >-
      Why this is a matching board and not four separate questions. Responses on
      boards like this are written to be plausible for more than one situation, so
      choosing them one at a time lets a nearly-right answer through unexamined.
      Having to place all of them forces the comparison — not "is this reasonable
      here", but "is it more right here than there".
    - >-
      How to use the one-each rule. Because the responses are a set to be
      distributed rather than a list to be sampled, every join you make constrains
      the rest. Settling the two you are confident of can leave the remaining pair
      decided by elimination. Where it does not, two responses are still competing
      for one situation, and that is exactly the distinction the stop is testing.
    - >-
      Why you cannot be wrong about exactly one. With every response used once,
      three correct joins leave the fourth with only one place to go. Any error
      therefore involves at least two joins. That is worth remembering when the last
      pair looks forced: the fault is usually not in the join you are struggling
      with, but in one you made early and stopped questioning.
    assumes:
    - an atom has a nucleus of protons and neutrons, with electrons around it
    takeaway: Nuclear reasoning starts by translating notation into particles and conserved quantities.
    format: PROTOCOL
    why: Notation is only useful when each symbol is tied to a physical count. The atomic number Z is the proton count, 
      and it fixes which element this is. The mass number A counts protons and neutrons together, so the neutron count 
      is A minus Z — a subtraction, not a symbol on the label. Two atoms are isotopes of one element when Z is the same 
      and A differs. And a neutral atom has as many electrons as protons, which is why Z decides the chemistry as well 
      as the identity.
    rebuttals:
    - The proton count is read straight off the atomic number Z. It is the one quantity the notation gives you directly.
    - The neutron count is A minus Z. Nothing on the label states it, which is why this is the step people skip.
    - Isotopes share Z and differ in A. Same element, different nucleus — and that difference is the reason this site 
      exists.
    - A neutral atom balances its protons with electrons, so the electron count equals Z. That is what ties chemistry to
      the nucleus.
    columns:
    - What you want to know
    - How you get it
    scenarios:
    - Need the number of protons
    - Need the number of neutrons
    - Need to decide whether two atoms are isotopes
    - Need the net charge of a neutral atom
    choices:
    - Read atomic number Z.
    - Compute A - Z.
    - Compare Z while A differs.
    - Set electron count equal to Z.
    mapping: [0, 1, 2, 3]
    answerText: Need the number of protons -> Read atomic number Z; Need the number of neutrons -> Compute A - Z; Need 
      to decide whether two atoms are isotopes -> Compare Z while A differs; Need the net charge of a neutral atom -> 
      Set electron count equal to Z
  - group: CM
    task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
    title: Isotopes and chemical identity
    scene: Glenn Seaborg, the chemist charged with isolating plutonium, wants a straight answer from Chemistry and 
      Metallurgy. It turns on one fact. Everything shipped here has a chemical form and an isotopic makeup, and they are
      not the same thing.
    guide: >-
      Four questions and four answers, and three of them say yes. Ask of each
      whether the property lives in the electrons or in the nucleus. Bonding is
      electrons, and extra neutrons barely disturb them. Stability is nuclear. So
      ordinary chemistry has almost no handle here, and mass does.
    background:
    - >-
      Why this is a matching board and not four separate questions. Responses on
      boards like this are written to be plausible for more than one situation, so
      choosing them one at a time lets a nearly-right answer through unexamined.
      Having to place all of them forces the comparison — not "is this reasonable
      here", but "is it more right here than there".
    - >-
      How to use the one-each rule. Because the responses are a set to be
      distributed rather than a list to be sampled, every join you make constrains
      the rest. Settling the two you are confident of can leave the remaining pair
      decided by elimination. Where it does not, two responses are still competing
      for one situation, and that is exactly the distinction the stop is testing.
    - >-
      Why you cannot be wrong about exactly one. With every response used once,
      three correct joins leave the fourth with only one place to go. Any error
      therefore involves at least two joins. That is worth remembering when the last
      pair looks forced: the fault is usually not in the join you are struggling
      with, but in one you made early and stopped questioning.
    assumes:
    - chemical bonding is done by electrons
    takeaway: Materials work must track both chemical form and isotopic composition.
    format: PROTOCOL
    answerText: "Will two isotopes form similar chemical compounds? -> Yes: bonding is set by electron structure, which extra
      neutrons barely disturb.; Will they have the same half-life? -> No: stability is set inside the nucleus and can differ
      by orders of magnitude.; Can mass spectrometry distinguish them? -> Yes: sorting by mass-to-charge ratio responds to
      exactly the difference chemistry ignores.; Does atomic number determine the element? -> Yes: the proton count fixes
      the electron structure and therefore the chemical identity."
    why: "Isotopes of an element carry the same proton count and nearly the same electrons, so they form the same compounds
      and answer to the same reagents. Ordinary chemistry therefore has almost no handle for separating them. Nuclear stability
      is different: it is set inside the nucleus, and half-lives can differ enormously between isotopes of one element. Mass
      spectrometry sorts by mass-to-charge ratio, responding to the difference chemistry mostly ignores. That is why isotopic
      separation is a physical problem as well as a chemical one."
    call: Connect isotopes to chemistry
    reason: Today you must keep chemical form and isotope makeup separate or the shared records will start with a false match.
    setup: Match each question to the relevant property.
    rebuttals:
    - Two isotopes form similar compounds, because bonding is set by electron structure and extra neutrons barely 
      disturb it.
    - They do not share a half-life. Stability lives inside the nucleus, and it can differ by orders of magnitude.
    - Mass spectrometry can separate them, because sorting by mass-to-charge responds to exactly the difference 
      chemistry cannot see.
    - Atomic number does fix the element, because the proton count fixes the electron structure and the chemistry with 
      it.
    columns:
    - What you want to know
    - What the physics says
    scenarios:
    - Will two isotopes form similar chemical compounds?
    - Will they have the same half-life?
    - Can mass spectrometry distinguish them?
    - Does atomic number determine the element?
    choices:
    - "Yes: bonding is set by electron structure, which extra neutrons barely disturb."
    - "No: stability is set inside the nucleus and can differ by orders of magnitude."
    - "Yes: sorting by mass-to-charge ratio responds to exactly the difference chemistry ignores."
    - "Yes: the proton count fixes the electron structure and therefore the chemical identity."
    mapping: [0, 1, 2, 3]
  - group: P
    task: Arrange the four cards from earliest cause or prerequisite to latest result.
    title: Ionization and detector signals
    scene: Robert Bacher, who heads the physics division, puts it plainly — nobody here can see a single neutron or 
      alpha particle. Everything the Hill will claim about cross sections, backgrounds and yields rests on a chain of 
      conversions working in order.
    guide: >-
      These four are one chain, and a detector never measures the radiation itself.
      Ask of each card what has to exist before it. Nothing is amplified before
      something is set free. And nothing is set free before energy is deposited.
      That middle step decides what the instrument can see at all.
    background:
    - >-
      Why the order is graded whole. A sequence is a claim about dependency: each
      step is here because the one before it has already happened, or has to have.
      One transposed pair falsifies that claim wherever it sits, so partial credit
      would be credit for a sequence that does not work.
    - >-
      Why the ends are the place to start. The first and last cards are constrained
      by having nothing before or after them, which usually makes them the two you
      can settle from the scene alone. Pinning them collapses the remaining
      arrangements sharply, and what is left in the middle is where the actual
      judgement lives.
    - >-
      What the rail can be ordered on. Time is the usual axis, but it is not the
      only one. An order can run on cost, on risk, or on reversibility — every
      observation that leaves the sample as it was, before any that consumes it. On
      those boards a chronological reading finds nothing, because none of the steps
      has to happen at a particular hour.
    takesAsRead:
    - Decay constant, half-life and activity
    assumes:
    - radiation deposits energy in whatever it passes through
    takeaway: A detector measures the consequences of an interaction, not radiation directly.
    format: SEQUENCE
    answerText: 2 -> 3 -> 4 -> 5 (Radiation deposits energy in the sensitive material -> The material sets free charge 
      or light -> Electronics collect and amplify the response -> The data system digitizes and stores a pulse)
    why: A detector measures the consequences of an interaction, never the radiation itself. Energy has to be deposited 
      in the sensitive material first — nothing downstream exists until that happens. That deposit sets free charge or 
      light, which is the transducer step and the one that decides what the instrument is sensitive to at all. 
      Electronics then collect and amplify a response too small to handle raw. The data system digitises and stores a 
      pulse last. Get the chain wrong and you are measuring your own apparatus.
    call: Turn ionization into a signal
    reason: The lab needs this signal chain now so every team knows what its counters actually measured.
    setup: Order the detector chain from deposited energy to stored data.
    rebuttals:
    - Energy deposited in the sensitive material is where everything starts. No deposit, no signal, however good the 
      electronics are.
    - "Free charge or light is the transducer step: the point where a nuclear event becomes something electrical."
    - Collection and amplification come third. They make a tiny response handleable, and they cannot create one that was
      never made.
    - Digitising and storing the pulse is last. It is the step people picture as the measurement, and it is the only one
      that adds no physics.
    cards:
    - Radiation deposits energy in the sensitive material
    - The material sets free charge or light
    - Electronics collect and amplify the response
    - The data system digitizes and stores a pulse
    order: [0, 1, 2, 3]
- title: Where Does the Energy Come From?
  objective: Connect mass, binding energy, calibration, and competing early program concepts without confusing a 
    convincing calculation with a validated measurement.
  briefing: The laboratory can calculate enormous nuclear energies, but the numbers are only useful if the instruments 
    and assumptions behind them are sound. The player checks the mass-energy scale, breaks a calibration degeneracy, and
    compares the evidence demands of two historically competing design programs at a high level.
  stake: It is May 1943, and the lab has more plans than people or time. A strong equation can still mislead if its inputs
    or tools are wrong. Today you must trace an energy claim back to its source and decide what proof each plan would need.
    Your choice will shape where the lab puts its staff and tests.
  takeaway: A correct equation is only one link in an evidence chain; calibration and assumptions decide whether its 
    result can support a program decision.
  stops:
  - group: T
    task: Estimate the total binding energy and the binding energy per nucleon.
    title: Mass defect and binding energy
    scene: "Hans Bethe, who heads the Theoretical Division, wants a number before lunch: how tightly a medium-heavy nucleus
      is bound. The arithmetic is small enough for one line, but the energy scale is the reason this laboratory exists at
      all."
    guide: >-
      Four numbers, and two of them are the same defect written a thousand times
      apart. Ask of each whether it is per nucleon or per nucleus. The conversion
      turns mass into energy, so it belongs beside the mass term. And work out the
      per-nucleon figure before the total.
    background:
    - >-
      Why an estimate rather than a calculation. Every quantity on this board is
      already measured or stated, so nothing here has to be derived. What is being
      tested is whether you can pick the quantities the relationship actually needs,
      and whether the size of the answer looks right once they are in place.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the
      relationship it is going into. Reading the label is how a unit mismatch, or a
      quantity belonging to a different part of the problem, is caught before it is
      placed — which is the habit this format exists to build.
    assumes:
    - mass and energy are related by E = mc², with E the energy, m the mass and c the speed of light
    takeaway: Tiny changes in mass correspond to large nuclear energies.
    format: BALLPARK
    answerText: About 1.5×10^3 MeV total, or about 7.5 MeV per nucleon.
    why: A bound nucleus weighs less than the loose protons and neutrons that went into it. That missing mass is the 
      binding energy holding it together. The conversion factor is the speed of light squared. So a mass difference far 
      too small to weigh becomes an energy larger than any chemical reaction can produce. Work in atomic mass units and 
      1 unit is about 931 MeV. That is what turns a defect of 8 thousandths of a unit per nucleon into more than 1000 
      MeV for the whole nucleus.
    call: Estimate binding energy
    reason: This estimate sets the energy scale for today's program debate, but only if every input and unit can be checked.
    setup: A medium-heavy nucleus has about 200 nucleons and a mass defect of about 0.008 atomic mass units per nucleon.
    estimate:
      prompt: A medium-heavy nucleus has about 200 nucleons, with a mass defect of roughly 0.008 atomic mass units per 
        nucleon. 1 atomic mass unit is worth about 931 MeV. Estimate both the binding energy per nucleon and the total 
        binding energy.
      question: Choose the mass defect per nucleon, the nucleon count, and the mass-to-energy conversion; compute B/A 
        first and then B.
      labels:
      - 0.008 u/nucleon
      - 200 nucleons
      - 931 MeV/u
      - 8 u/nucleon
      values: [0.008, 200, 931, 8]
      slots: 3
      template: E ≈ {0} × {1} × {2}
      formula: a*b*c
      correct: [0, 1, 2]
      target: 1489.6
      tolerance: 80
      units: MeV
      solution: B/A ≈ 0.008 u/nucleon × 931 MeV/u ≈ 7.45 MeV/nucleon. Then B ≈ 7.45 MeV/nucleon × 200 nucleons ≈ 
        1.49×10³ MeV.
      explanation: The mass defect per nucleon gives about 7.5 MeV of binding per nucleon. Multiplying by about 200 
        nucleons gives roughly 1,500 MeV for the whole nucleus. The first number is what is plotted on the 
        binding-energy-per-nucleon curve; the second is the total energy needed to separate this nucleus completely.
      givens:
      - Mass defect is about 0.008 u per nucleon
      - A nucleus of this size has about 200 nucleons
      - 1 atomic mass unit corresponds to about 931 MeV
      relationship: Binding energy per nucleon B/A = mass defect per nucleon × 931 MeV/u. Total binding energy B = (B/A)
        × A.
  - group: P
    task: Use the first reference line to map every gain-and-offset pair it allows. Then add the second line and lock 
      the calibration that satisfies both.
    title: One reference line is not a calibration
    scene: Two Physics groups bring spectra from different instruments to Bacher’s afternoon comparison meeting, and the
      peaks refuse to line up. Each group trusts its own axis. Somebody has to decide whether the disagreement belongs 
      to the samples or to the instruments.
    guide: >-
      Two controls, gain and offset, slide along a family of calibrations that all
      put one reference line where it belongs. Find out how wide that family is
      before deciding anything. Then bring in the second reference line, which does
      not permit the same trade, and watch the family collapse.
    background:
    - >-
      Why one line cannot calibrate an axis. A linear axis has two unknowns: how
      much a step is worth, and where zero sits. One known peak gives one equation.
      Every gain paired with the offset that puts that peak in the right place fits
      equally well, which is exactly the family the controls slide along.
    - >-
      Why the second line is not a repeat. It constrains the same two unknowns
      through a different combination, so the pairs that satisfied the first no
      longer satisfy this one. Where the two constraints cross is the calibration,
      and it is why standards come with more than one line.
    - >-
      What is at stake this afternoon. If the axes can be reconciled, the spectra
      agree and the disagreement was instrumental. If they cannot, the difference is
      in the samples. Both groups trusting their own axis is how a meeting spends an
      afternoon arguing about the wrong thing.
    assumes:
    - a straight-line calibration can have both a slope and an offset
    - one equation cannot determine two unknowns
    takeaway: One calibration point cannot determine both a slope and an offset; a second independent point breaks that 
      degeneracy.
    format: DEGENERACY
    question: Which gain and offset are fixed by both reference lines?
    degeneracy:
      hint: Move gain and offset until the 500 keV reference lands on its marked channel. Notice that many pairs work. 
        Then reveal the 1000 keV reference and satisfy both lines at once.
      controls:
      - id: gain
        label: Gain
        min: 1.5
        max: 2.5
        step: 0.1
        unit: keV/channel
      - id: offset
        label: Offset
        min: -150
        max: 150
        step: 10
        unit: keV
      truth:
        a: 2
        b: 0
      locus:
      - a: 1.6
        b: 100
      - a: 1.8
        b: 50
      - a: 2
        b: 0
      - a: 2.2
        b: -50
      - a: 2.4
        b: -100
      second:
        label: Reference line B
        locus:
        - a: 1.8
          b: 100
        - a: 1.9
          b: 50
        - a: 2
          b: 0
        - a: 2.1
          b: -50
        - a: 2.2
          b: -100
      observable:
        label: Reference line A
      tolerance:
        a: 0.05
        b: 10
    answerText: Gain = 2.0 keV per channel and offset = 0 keV. The first line alone permits many combinations; the 
      second line leaves only their intersection.
    why: "A straight-line calibration has two unknowns: gain and offset. One known line gives only one equation, so many gain-and-offset
      pairs reproduce it exactly. That is not noise; it is missing information. A second line at a different energy supplies
      a second equation. The two allowed loci cross at one point, fixing both parameters. This is why a convincing-looking
      one-point calibration can still place every unknown peak at the wrong energy."
    call: Calibrate measured energy
    reason: The two spectra cannot guide a program choice until you know whether their gap comes from the samples or the instruments.
    setup: Order the calibration workflow.
  - group: E
    task: Match each high-level program claim to the kind of evidence it would require, without turning either 
      historical architecture into a construction lesson.
    title: What each early program would have to prove
    scene: At a 1943 meeting, laboratory director Oppenheimer weighs two plans. One uses ideas the teams know well. The
      other needs new tests of shape and timing. You must decide what proof each plan needs before people and rooms are assigned.
    guide: >-
      Four situations and four responses, and both designs chase the same goal. Ask
      of each whether it is about the geometry of the assembly or about its timing.
      One route drives two pieces along a line. One squeezes inward, and nobody has
      built one. A measurement decides between them.
    background:
    - >-
      Why this is a matching board and not four separate questions. Responses on
      boards like this are written to be plausible for more than one situation, so
      choosing them one at a time lets a nearly-right answer through unexamined.
      Having to place all of them forces the comparison — not "is this reasonable
      here", but "is it more right here than there".
    - >-
      How to use the one-each rule. Because the responses are a set to be
      distributed rather than a list to be sampled, every join you make constrains
      the rest. Settling the two you are confident of can leave the remaining pair
      decided by elimination. Where it does not, two responses are still competing
      for one situation, and that is exactly the distinction the stop is testing.
    - >-
      Why you cannot be wrong about exactly one. With every response used once,
      three correct joins leave the fourth with only one place to go. Any error
      therefore involves at least two joins. That is worth remembering when the last
      pair looks forced: the fault is usually not in the join you are struggling
      with, but in one you made early and stopped questioning.

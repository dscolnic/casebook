- group: CM
  task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
  title: Gloveboxes and atmospheres
  setup: Match each risk to the appropriate feature.
  scene: >-
    Hornig is fitting out a new glovebox line for material that is radioactive and also
    reacts with damp air. Every feature on the drawing has to answer to one of those
    problems, and the shop wants the list by Friday.
  guide: >-
    Four aims and four features. Pair them by asking what each feature actually
    controls. Which way a leak goes? What the atmosphere contains? How things
    cross the boundary? Or whether anybody would know? One of them removes the
    reactant rather than containing the product.
  background:
  - >-
    Why this is a matching board and not four separate questions. Responses on
    boards like this are written to be plausible for more than one situation, so
    choosing them one at a time lets a nearly-right answer through unexamined.
    Having to place all of them forces the comparison — not "is this reasonable
    here", but "is it more right here than there".
  - >-
    How to use the one-each rule. Because the responses are a set to be
    distributed rather than a list to be sampled, every join you make constrains
    the rest. Settling the two you are confident of can leave the remaining pair
    decided by elimination. Where it does not, two responses are still competing
    for one situation, and that is exactly the distinction the stop is testing.
  - >-
    Why you cannot be wrong about exactly one. With every response used once,
    three correct joins leave the fourth with only one place to go. Any error
    therefore involves at least two joins. That is worth remembering when the last
    pair looks forced: the fault is usually not in the join you are struggling
    with, but in one you made early and stopped questioning.
  takeaway: Confinement protects the room; atmosphere control protects the material.
  format: PROTOCOL
  why: A glovebox is a controlled system of confinement, atmosphere, transfer, and monitoring.
  columns:
  - What you want to do
  - How you do it
  scenarios:
  - Prevent airborne material from escaping
  - Prevent oxygen or moisture reaction
  - Move items without opening the main enclosure
  - Detect loss of confinement
  choices:
  - Negative pressure with filtered exhaust. Air leaks inward rather than outward, so even a breach moves contamination 
    the safe way.
  - An inert atmosphere. Removes the reactant instead of containing the product.
  - A transfer lock or bag-out port. Holds the pressure boundary during transfer, which is when confinement is most 
    often lost.
  - Pressure indicators and contamination monitors. Confinement can fail silently, so the boundary needs an instrument 
    watching it.
  mapping: [0, 1, 2, 3]
  answerText: Prevent airborne material from escaping -> Negative pressure with filtered exhaust. Air leaks inward 
    rather than outward, so even a breach moves contamination the safe way.; Prevent oxygen or moisture reaction -> An 
    inert atmosphere. Removes the reactant instead of containing the product.; Move items without opening the main 
    enclosure -> A transfer lock or bag-out port. Holds the pressure boundary during transfer, which is when confinement
    is most often lost.; Detect loss of confinement -> Pressure indicators and contamination monitors. Confinement can 
    fail silently, so the boundary needs an instrument watching it.
- group: CM
  task: Allocate 100 research credits across the 3 proposals. You may hold credits in reserve, but explain the decision 
    criterion.
  title: Corrosion and compatibility
  setup: A new process fluid contacts several metals and seals.
  scene: >-

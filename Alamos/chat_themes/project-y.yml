- title: The Counts Do Not Agree
  objective: Use decay, tracer recovery, and background measurements to determine whether conflicting laboratory yields 
    are physics, chemistry, or instrumentation.
  briefing: Three groups report incompatible yields from the same material stream. The player follows a decaying tracer 
    through a separation, corrects measurements to a common time, and isolates a background-count problem before the 
    disagreement gets mistaken for new physics.
  stake: It is July 1943, and three reports give three amounts for the same material. The sample changes with time, while
    the counter may add signals of its own. Today you must put every result on one clock and find where the gap begins. Until
    you do, the lab may blame the wrong team and lose scarce material.
  takeaway: Time-dependent samples and instrument backgrounds must be separated before a count rate can be treated as a 
    material yield.
  stops:
  - group: T
    task: Estimate how many nuclei remain after the shift, then use the half-life to estimate the sample's activity at 
      that moment.
    title: Radioactive decay law
    scene: A tracer sample has sat through a six-hour chemistry shift, and the separation team needs to know what 
      remains before the next measurement starts. Every count here belongs to something that has been decaying since it 
      was made.
    guide: >-
      Four numbers, and two of them are counts of half-lives that differ by a factor
      of ten. Ask of each whether it is a population, a fraction, or a number of
      halvings. Six hours of two-hour halvings is not thirty of them. And each
      halving multiplies by the same fraction.
    background:
    - >-
      Why an estimate rather than a calculation. Every quantity on this board is
      already measured or stated, so nothing here has to be derived. What is being
      tested is whether you can pick the quantities the relationship actually needs,
      and whether the size of the answer looks right once they are in place.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the
      relationship it is going into. Reading the label is how a unit mismatch, or a
      quantity belonging to a different part of the problem, is caught before it is
      placed — which is the habit this format exists to build.
    takesAsRead:
    - "Radioactive decay modes: alpha, beta, gamma"
    - Exponential decay and logarithms
    assumes:
    - a half-life is the time for half of a large population to decay
    takeaway: Half-life fixes both how a population falls with time and, through the decay constant, its activity at any
      moment.
    format: BALLPARK
    answerText: About 1,250 nuclei remain. With λ = ln2/(2 h) ≈ 9.6×10^-5 s^-1, the activity is A = λN ≈ 0.12 decays/s, 
      or 0.12 Bq.
    why: "Decay is random for one nucleus and predictable for a large population. 6 hours is 3 two-hour half-lives, so 10,000
      nuclei fall to 1 eighth, or about 1,250. Half-life also fixes the decay constant: λ = ln2/t½. For a two-hour half-life,
      λ is about 9.6×10⁻⁵ s⁻¹. Activity is then A = λN, so the remaining sample produces about 0.12 decays each second. Population
      and count rate are linked by the same decay law."
    call: Model radioactive decay
    reason: The three reports were taken at different times, so today's first task is to place them on one clock.
    setup: A tracer with a 2-hour half-life starts at 10,000 nuclei and is left for a 6-hour shift.
    estimate:
      prompt: A tracer starts with 10,000 nuclei, has a two-hour half-life, and sits for 6 hours. Estimate how many 
        nuclei remain. Then use λ = ln2/t½ and A = λN to estimate the activity.
      question: Choose the starting population, the number of half-lives, and the half-life needed to find λ.
      labels:
      - 10,000 nuclei
      - 1/2
      - 3 half-lives
      - 30 half-lives
      values: [10000, 0.5, 3, 30]
      slots: 3
      template: N ≈ {0} × ({1})^{2}
      formula: a*Math.pow(b,c)
      correct: [0, 1, 2]
      target: 1250
      tolerance: 80
      units: nuclei
      solution: λ = 0.693/7,200 s ≈ 9.6×10⁻⁵ s⁻¹. Then N(21,600 s) = 10,000e^(−λt) ≈ 1,250 nuclei. Finally A = λN ≈ 0.12
        s⁻¹ = 0.12 Bq.
      explanation: Six hours is three half-lives, so one eighth of the original population remains. The same half-life 
        gives the decay constant, which turns the surviving population into an expected decay rate.
      givens:
      - Each half-life leaves one-half of the previous amount
      - A 6-hour wait is 3 2-hour half-lives
      relationship: First λ = ln2/t½. Then N(t) = N₀e^(−λt), and activity is A = λN.
  - group: CM
    call: Use a radiochemical tracer
    reason: The lab must learn whether material was truly lost during the separation before it blames decay or the counter.
    task: Estimate the chemical yield.
    title: Radiochemical tracers
    setup: A process begins with 5,000 tracer counts per minute and, once corrected for decay during the separation, 
      recovers 4,000 counts per minute.
    scene: Chemistry & Metallurgy is running separations on quantities too small to weigh directly and needs to know how
      much is being lost between steps. A decaying tracer provides the bookkeeping signal.
    guide: >-
      Four numbers, in two pairs, and only one pair belongs to this separation. Ask
      of each whether it is what went in or what came out. And note what makes a raw
      ratio dishonest here. The tracer decayed throughout, so both counts have to be
      corrected to the same moment.
    background:
    - >-
      Why an estimate rather than a calculation. Every quantity on this board is
      already measured or stated, so nothing here has to be derived. What is being
      tested is whether you can pick the quantities the relationship actually needs,
      and whether the size of the answer looks right once they are in place.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the
      relationship it is going into. Reading the label is how a unit mismatch, or a
      quantity belonging to a different part of the problem, is caught before it is
      placed — which is the habit this format exists to build.
    assumes:
    - a radioactive sample announces itself through its own radiation
    takeaway: A tracer turns invisible material loss into a measurable fraction.
    format: BALLPARK
    why: "A tracer is a small amount of radioactive material that travels with the chemistry and reports where it went. That
      turns an invisible loss into a measurable fraction: yield is what came out over what went in. The correction that makes
      it honest is decay — the tracer has been decaying throughout the separation, so a raw count afterwards understates the
      recovery and flatters the loss. Both counts have to be corrected to the same moment before the ratio means anything."
    estimate:
      prompt: A separation starts with 5,000 tracer counts per minute. The recovered fraction is counted afterwards and,
        once corrected for decay during the process, comes to 4,000 counts per minute. Estimate the chemical yield.
      question: Choose the recovered and initial count rates.
      labels:
      - 4,000 recovered counts
      - 5,000 initial counts
      - 400 recovered counts
      - 50,000 initial counts
      values: [4000, 5000, 400, 50000]
      slots: 2
      template: yield ≈ ({0} ÷ {1}) × 100
      formula: a/b*100
      correct: [0, 1]
      target: 80
      tolerance: 3
      units: "%"
      solution: 4,000 ÷ 5,000 × 100 ≈ 80%.
      explanation: "Four-fifths recovered means a fifth of the target is somewhere else — on glassware, in the discarded phase,
        or still in the residue — and that missing fifth has to be accounted for before the assay means anything. Note what
        the decay correction bought: without it the later count is lower simply because time passed, and the chemistry would
        be blamed for a loss it did not cause. A raw count rate is not a quantity of material."
      givens:
      - Chemical yield = recovered signal / initial signal
      - The recovered count must be decay-corrected before it is compared
      relationship: Yield = recovered ÷ started, as a percentage.
    answerText: About 80%.
  - group: P
    task: Change one condition at a time, compare the count rate, and confirm the cause by removing it and then 
      restoring it.
    title: Find what carries the background
    concept: Attenuation of radiation through matter
    scene: A weak sample has been counting for an hour, and Elizabeth Graves wants to know whether the excess belongs to
      the sample or the counting hardware.
    guide: >-
      The number you are watching is the counting rate with no sample in the
      station, and the excess is how much of it cannot be accounted for. A change
      has told you something only when it moves that excess by more than the rate
      wanders on its own between runs. Several parts of the station changed when it
      was built, so choose one, run it, and put it back. Name the part the excess
      follows.
    background:
    - >-
      What a background is. A detector counts things whether or not you gave it
      anything to count: cosmic rays, activity in the concrete, contamination on the
      housing, noise in the electronics. The rate with no sample in place is the sum
      of all of those, and a weak sample is only detectable to the extent that its
      own counts stand above that sum.
    - >-
      Why one change at a time. Change two things and a response tells you only that
      one of them mattered. The station has a shield, a room and a detector, and
      each of them can carry background for its own reason, so the only reading that
      names a part is the one where nothing else moved.
    - >-
      Why putting it back matters. A rate that drops when you shield the detector
      and stays down when you unshield it was falling for some other reason — drift,
      a decaying source, somebody switching off a pump down the corridor. A cause
      has to follow the change in both directions, and that is the whole of what
      reversal tests.
    assumes:
    - background is measured with no sample present
    - one changed variable can be tested against a stable baseline
    takeaway: A suspected cause is strongest when changing only that cause moves the reading and reversing the change 
      restores it.
    format: CONTROL
    question: Which part of the counting station carries the excess?
    control:
      hint: Start from the no-sample rate. Change one thing only. A useful change must move the excess by much more than
        the repeat scatter, and you must restore the original condition once.
      baseline: 131
      noise: 4
      tolerance: 6
      observable:
        label: Original detector, no sample
        unit: counts/min
      response: -36
      truth: detector
      variables:
      - id: lead
        label: Add external lead
      - id: room
        label: Move original detector to clean room
      - id: detector
        label: Substitute clean identical detector
    answerText: The original detector or its holder is contaminated. With no sample it reads about 131 counts/min; a 
      clean identical detector is near the normal 95 counts/min background, and restoring the original hardware restores
      the excess.
    why: "The sample cannot explain a count excess that remains after the sample is removed. Extra shielding cannot explain
      it when more lead changes nothing. The decisive comparison is hardware: the original detector still runs high in a clean
      room, while an identical clean detector in the same room returns to the normal background. Put the original detector
      back and the excess returns. That reversal makes contamination of the detector or holder a causal result rather than
      a correlation."
    call: Measure the background
    reason: A blank reading can show whether the last part of today's count gap follows the instrument instead of the sample.
    setup: You are deciding whether a weak sample is really emitting anything.
- title: Is the Difference Real?
  objective: Use cross sections, counting statistics, and material balance to decide whether an apparent disagreement is
    large enough—and clean enough—to matter.
  briefing: Two groups believe their measurements disagree. The player converts interaction probability into a 
    measurable scale, asks whether the count difference exceeds ordinary statistical fluctuation, and refuses a 
    chemistry result whose mass balance does not close.
  stake: It is October 1943, and two teams disagree about a gap in their counts. The gap may be real, or it may be normal
    noise or missing material. Today you must decide how much evidence the gap carries and make the material ledger close.
    A bad call could waste a rare sample and send the lab after a false result.
  takeaway: A scientific disagreement becomes actionable only after random fluctuation, missing material, and shared 
    measurement errors have been ruled out.
  stops:
  - group: T
    task: Estimate the macroscopic cross section, the mean free path, and the fraction of an uncollided beam left after 

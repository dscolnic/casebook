- group: CM
  task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
  title: Chemical process safety
  setup: Match each hazard to a primary control.
  scene: >-
    Kistiakowsky has a new process being scaled up faster than anybody would like. Four
    things about it could go wrong in a room with people in it, and he wants a control
    named against each before it runs.
  guide: >-
    Four hazards and four controls. Pair them by asking what each control bounds.
    The rate of energy release? Where pressure can go? How much is at risk? Or
    what the air is doing? One of them works by keeping the trial small enough to
    contain whatever happens.
  background:
  - >-
    Why this is a matching board and not four separate questions. Responses on
    boards like this are written to be plausible for more than one situation, so
    choosing them one at a time lets a nearly-right answer through unexamined.
    Having to place all of them forces the comparison — not "is this reasonable
    here", but "is it more right here than there".
  - >-
    How to use the one-each rule. Because the responses are a set to be
    distributed rather than a list to be sampled, every join you make constrains
    the rest. Settling the two you are confident of can leave the remaining pair
    decided by elimination. Where it does not, two responses are still competing
    for one situation, and that is exactly the distinction the stop is testing.
  - >-
    Why you cannot be wrong about exactly one. With every response used once,
    three correct joins leave the fourth with only one place to go. Any error
    therefore involves at least two joins. That is worth remembering when the last
    pair looks forced: the fault is usually not in the join you are struggling
    with, but in one you made early and stopped questioning.
  takeaway: A chemically successful reaction can still be an unsafe process.
  format: PROTOCOL
  why: Process safety controls the rate and consequence of energy and material release.
  columns:
  - The hazard
  - How you control it
  scenarios:
  - Unexpected heat release
  - Gas generation in a closed vessel
  - Unknown chemical compatibility
  - Loss of ventilation
  choices:
  - Monitor temperature, add reagent slowly, and keep a shutdown path ready, so the rate of energy release stays 
    bounded.
  - Provide relief and a vent path, because otherwise the pressure has nowhere to go and the vessel becomes the failure 
    point.
  - Test at small scale first, so anything unexpected is small enough to contain.
  - Stop work and restore confinement, because the control that was keeping vapour out of the room is gone.
  mapping: [0, 1, 2, 3]
  answerText: Unexpected heat release -> Monitor temperature, add reagent slowly, and keep a shutdown path ready, so the
    rate of energy release stays bounded.; Gas generation in a closed vessel -> Provide relief and a vent path, because 
    otherwise the pressure has nowhere to go and the vessel becomes the failure point.; Unknown chemical compatibility 
    -> Test at small scale first, so anything unexpected is small enough to contain.; Loss of ventilation -> Stop work 
    and restore confinement, because the control that was keeping vapour out of the room is gone.
- group: CM
  task: Arrange the four cards from earliest cause or prerequisite to latest result.
  title: Waste and environmental control
  setup: Order the responsible workflow.
  scene: >-
    The drums behind the chemistry building have been filling faster than anybody planned,
    and the site has no agreed routine for them. Seaborg wants the handling settled before
    somebody improvises it on a night shift.
  guide: >-
    All four steps happen, so ask what each one needs known first. Nothing can be
    segregated by category before the categories are established. And nothing can
    be treated by an approved process before anybody knows what it is. Labelling
    comes last because it records all of it.
  background:
  - >-
    Why the order is graded whole. A sequence is a claim about dependency: each
    step is here because the one before it has already happened, or has to have.
    One transposed pair falsifies that claim wherever it sits, so partial credit
    would be credit for a sequence that does not work.
  - >-
    Why the ends are the place to start. The first and last cards are constrained
    by having nothing before or after them, which usually makes them the two you
    can settle from the scene alone. Pinning them collapses the remaining
    arrangements sharply, and what is left in the middle is where the actual
    judgement lives.
  - >-
    What the rail can be ordered on. Time is the usual axis, but it is not the
    only one. An order can run on cost, on risk, or on reversibility — every
    observation that leaves the sample as it was, before any that consumes it. On
    those boards a chronological reading finds nothing, because none of the steps
    has to happen at a particular hour.
  takeaway: Environmental responsibility is part of the process design, not a final cleanup step.
  format: SEQUENCE
  why: Waste management begins with characterization and compatibility.
  cards:
  - Characterize the waste and hazards
  - Segregate incompatible or different regulatory categories
  - Minimize, treat, or stabilize through an approved process
  - Label, store, and document transfer or disposal
  order: [0, 1, 2, 3]
  answerText: 2 -> 3 -> 4 -> 5 (Characterize the waste and hazards -> Segregate incompatible or different regulatory 
    categories -> Minimize, treat, or stabilize through an approved process -> Label, store, and document transfer or 
    disposal)
- group: CM
  task: Allocate 100 research credits across the 3 proposals. You may hold credits in reserve, but explain the decision 
    criterion.
  title: Batch variability
  setup: 3 interventions compete for 100 credits.
  scene: >-
    Two batches made to the same written process have come out different, and nobody on
    the floor can point to what changed. Bradbury has a hundred research credits and three
    proposals that would spend them very differently.
  guide: >-
    Two batches made to one written process differ because something drifted, and
    final inspection sees the difference without seeing the cause. Measuring
    temperature, composition and timing during a run makes a batch traceable to
    its own history, and costs instruments and record-keeping on every run.
    Varying the suspected controls deliberately separates their effects and their
    interactions, and costs material and time. More inspection catches more bad
    batches and explains none of them. Production has to become reproducible, not
    merely screened.
  rules: >-
    Spread the hundred points across the 3 proposals. At least 80 of them have to
    be committed, because a panel that funds almost nothing has not decided
    anything. Your largest single allocation must be 35 or more, and it has to
    land on what the evidence supports most. Keep the total sitting on proposals
    the evidence does not support under fifteen. And a proposal it does support
    should not be left under twenty.
  background:
  - >-
    Why the whole spread is graded. Funding is not a vote for one idea. A
    portfolio says what you think is likely, what is worth hedging against, and
    what is not worth pursuing at all — and the last two are where most of the
    information is. Backing the right proposal while quietly funding a bad one is
    a worse answer than it looks. That is why the small numbers count as much as
    the big one.
  - >-
    What the three numbers are for. Thirty-five is what makes a lead a lead: below
    it you have hedged rather than chosen. Fifteen is the most that can sit on
    unsupported work before it stops being a rounding error. Past that it is a
    second opinion nobody argued for. Twenty is the floor under a line of work you
    have already called strong, because funding it too thin to finish spends the
    money and buys nothing.
  - >-
    Why there is a floor on the total. Points held back are not caution; they are
    a decision not to decide, taken with somebody else's money and somebody else's
    deadline. The floor is what forces the panel to say something.
  takeaway: Quality improves fastest when variation is traced to controllable process variables.
  format: SCIENCETANK
  why: Inspection catches failures; process measurement and controlled experiments explain and prevent them.
  proposals:
  - label: A
    text: Rely on more end-of-line inspection without measuring which process variable caused the batch difference.
  - label: B
    text: Measure temperature, composition, and timing during each run so batch differences can be traced to process 
      history.
  - label: C
    text: Vary the suspected process controls systematically so their separate effects and interactions can be measured.
  recommended:
    B: 35
    C: 55
    A: 10
  answerText: "Recommended: 35 to B, 55 to C, 10 to A."
- group: CM
  task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
  title: Chain of custody and records
  setup: Match each record problem to the corrective action.
  scene: >-
    Four results have arrived at Bradbury's desk and each one has a gap in its record: a
    label, a calibration version, a signature, a revision date. He wants a corrective
    action written against each before the dossier closes.
  guide: >-
    Four failures and four responses. Pair them by asking what has been lost: the
    identity, the configuration, the approval, or the version. A number without
    the instrument settings behind it cannot be obtained again years later. And an
    unsigned transfer is a gap rather than a formality.
  background:
  - >-
    Why this is a matching board and not four separate questions. Responses on
    boards like this are written to be plausible for more than one situation, so
    choosing them one at a time lets a nearly-right answer through unexamined.
    Having to place all of them forces the comparison — not "is this reasonable
    here", but "is it more right here than there".
  - >-
    How to use the one-each rule. Because the responses are a set to be
    distributed rather than a list to be sampled, every join you make constrains
    the rest. Settling the two you are confident of can leave the remaining pair
    decided by elimination. Where it does not, two responses are still competing
    for one situation, and that is exactly the distinction the stop is testing.
  - >-
    Why you cannot be wrong about exactly one. With every response used once,
    three correct joins leave the fourth with only one place to go. Any error
    therefore involves at least two joins. That is worth remembering when the last
    pair looks forced: the fault is usually not in the join you are struggling
    with, but in one you made early and stopped questioning.
  takeaway: A technically good result without provenance may be unusable.
  format: PROTOCOL
  why: Traceability requires contemporaneous identity, configuration, and approval records.
  columns:
  - The gap in the record
  - How you close it
  scenarios:
  - Sample label detached
  - Result file lacks calibration version
  - Transfer occurred without signature
  - Process sheet was revised after the run
  choices:
  - Quarantine the sample and reconstruct its identity from independent records before using any result linked to it.
  - Bind the number to the instrument settings and the software build that produced it, so another analyst can obtain it
    again years later.
  - Document and investigate the custody gap because an unsigned transfer leaves uncertainty about who controlled the 
    material.
  - Preserve both process-sheet versions and explain the later revision so the record does not falsely imply the newer 
    procedure was used during the run.
  mapping: [0, 1, 2, 3]
  answerText: Sample label detached -> Quarantine the sample and reconstruct its identity from independent records 
    before using any result linked to it; Result file lacks calibration version -> Bind the number to the instrument 
    settings and the software build that produced it, so another analyst can obtain it again years later; Transfer 
    occurred without signature -> Document and investigate the custody gap because an unsigned transfer leaves 
    uncertainty about who controlled the material; Process sheet was revised after the run -> Preserve both 
    process-sheet versions and explain the later revision so the record does not falsely imply the newer procedure was 
    used during the run
- group: E
  task: Match each situation to the best action, control, document, or interpretation. Each option is used once.
  title: Translate a complex wartime system into engineering requirements

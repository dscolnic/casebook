- group: X
  task: Arrange the four cards from earliest cause or prerequisite to latest result.
  title: Hydrodynamic scaling with inert mock materials
  setup: Order the logic of a useful scaled hydrodynamic experiment.
  scene: >-
    Norris Bradbury, who runs the mock shots at the test range, wants the logic of the
    next one settled before anybody casts a charge. Inert materials stand in for the real
    assembly, and every shot costs weeks the schedule does not have.
  guide: >-
    All four steps happen, so ask what each one has to be settled before it.
    Materials cannot be chosen before you know which quantities the model has to
    preserve. And the assumptions are revised against what the diagnostics saw,
    which is why several independent ones are used.
  background:
  - >-
    Why the order is graded whole. A sequence is a claim about dependency: each
    step is here because the one before it has already happened, or has to have.
    One transposed pair falsifies that claim wherever it sits, so partial credit
    would be credit for a sequence that does not work.
  - >-
    Why the ends are the place to start. The first and last cards are constrained
    by having nothing before or after them, which usually makes them the two you
    can settle from the scene alone. Pinning them collapses the remaining
    arrangements sharply, and what is left in the middle is where the actual
    judgement lives.
  - >-
    What the rail can be ordered on. Time is the usual axis, but it is not the
    only one. An order can run on cost, on risk, or on reversibility — every
    observation that leaves the sample as it was, before any that consumes it. On
    those boards a chronological reading finds nothing, because none of the steps
    has to happen at a particular hour.
  takeaway: Similarity is an argument supported by evidence, not a visual resemblance.
  format: SEQUENCE
  why: A scaled experiment is informative only when the preserved and distorted physics are explicit.
  cards:
  - Identify the dimensionless or relative quantities the model must preserve.
  - Choose inert materials and geometry that reproduce the relevant wave interactions as closely as practical.
  - Instrument the shot with multiple independent diagnostics.
  - Revise the scaling assumptions against the wave history the diagnostics recorded.
  order: [0, 1, 2, 3]
  answerText: 1 -> 2 -> 3 -> 4 (Identify the dimensionless or relative quantities the model must preserve. -> Choose 
    inert materials and geometry that reproduce the relevant wave interactions as closely as practical. -> Instrument 
    the shot with multiple independent diagnostics. -> Compare the measured wave history with the model and revise the 
    scaling assumptions.)

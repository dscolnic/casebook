    template: live fraction ≈ ({0} − {1}×{2}) × 100
    formula: (a-b*c)*100
    correct: [0, 1, 2]
    target: 98
    tolerance: 1
    units: "%"
    solution: (1 − 2,000×10⁻⁵)×100 ≈ 98%.
    explanation: R tau is 0.02 here, so the linear correction is trustworthy and the detector is live 98% of the time. 
      10 times the rate would put R tau at 0.2, where the first-order form breaks down and the full nonparalyzable 
      expression is needed — the formula carries its own validity limit.

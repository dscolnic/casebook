- group: P
  task: Arrange the four cards from earliest cause or prerequisite to latest result.
  title: Gamma-ray spectroscopy
  setup: Order the analysis from raw spectrum to line identification.
  scene: >-
    A counting run on fission products has finished and Wu has the raw spectrum on the
    analysis table. The energy scale has not been set today and the shielding was changed
    on Tuesday. Bacher wants the identifications by evening.
  guide: >-
    All four steps happen, so ask what each one would spoil if it came later. A
    peak found before the background is modelled may be background. And a peak
    found before the energy scale is calibrated cannot be compared with anything.
    Identification is the last step rather than the first.
  background:
  - >-
    Why the order is graded whole. A sequence is a claim about dependency: each
    step is here because the one before it has already happened, or has to have.
    One transposed pair falsifies that claim wherever it sits, so partial credit
    would be credit for a sequence that does not work.
  - >-
    Why the ends are the place to start. The first and last cards are constrained
    by having nothing before or after them, which usually makes them the two you
    can settle from the scene alone. Pinning them collapses the remaining
    arrangements sharply, and what is left in the middle is where the actual
    judgement lives.
  - >-
    What the rail can be ordered on. Time is the usual axis, but it is not the
    only one. An order can run on cost, on risk, or on reversibility — every
    observation that leaves the sample as it was, before any that consumes it. On
    those boards a chronological reading finds nothing, because none of the steps
    has to happen at a particular hour.
  takeaway: A spectral line is evidence only after instrumental response and background are understood.
  format: SEQUENCE
  why: Peak finding without background and calibration invites false identifications.
  cards:
  - Subtract or model the background
  - Calibrate energy and resolution
  - Identify statistically significant peaks
  - Compare energies and intensities with candidate transitions
  order: [0, 1, 2, 3]
  answerText: 2 -> 3 -> 4 -> 5 (Subtract or model the background -> Calibrate energy and resolution -> Identify 
    statistically significant peaks -> Compare energies and intensities with candidate transitions)

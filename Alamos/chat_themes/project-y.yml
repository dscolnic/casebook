- group: E
  task: Estimate how far the centre of mass sits from the light module.
  title: Packaging and center of gravity
  setup: An inert mockup has a 100 kg module and a 300 kg module separated by 1.5 m along a reference axis. This is not 
    a Fat Man dimension set.
  scene: >-
    The shop has an inert mockup on the trestle, a 100 kg module and a 300 kg module set
    1.5 m apart along the reference axis. Greenglass, the machinist who built it, needs
    the balance point marked before the suspension crew arrives.
  guide: >-
    Four numbers, and one of them is the light module, which the relationship does
    not use directly. Ask of each what the balance depends on. The centre of mass
    sits nearer the heavier side, so check your answer against that before
    believing it.
  background:
  - >-
    Why an estimate rather than a calculation. Every quantity on this board is
    already measured or stated, so nothing here has to be derived. What is being
    tested is whether you can pick the quantities the relationship actually needs,
    and whether the size of the answer looks right once they are in place.
  - >-
    Why the tiles carry labels. A bare number cannot be checked against the
    relationship it is going into. Reading the label is how a unit mismatch, or a
    quantity belonging to a different part of the problem, is caught before it is
    placed — which is the habit this format exists to build.
  takeaway: Packaging decisions affect handling, suspension, and flight behavior even when every component works 
    individually.
  format: BALLPARK
  why: Balance follows the mass, so the centre of gravity sits close to the heavier module.
  estimate:
    prompt: An inert mockup carries a 100 kg module and a 300 kg module 1.5 m apart along its axis, 400 kg in total. 
      Estimate how far the centre of mass sits from the light module.
    question: Choose the separation, the heavy module mass, and the total mass.
    labels:
    - 1.5 m separation
    - 300 kg heavy module
    - 400 kg total mass
    - 100 kg light module
    values: [1.5, 300, 400, 100]
    slots: 3
    template: x_cm ≈ {0} × {1} ÷ {2}
    formula: a*b/c
    correct: [0, 1, 2]
    target: 1.125
    tolerance: 0.06
    units: m
    solution: 1.5 m × 300 kg ÷ 400 kg ≈ 1.13 m from the light module.
    explanation: The balance point sits three-quarters of the way toward the heavy module. Balance follows mass, so 
      changing one module’s mass moves the whole assembly’s centre of gravity and with it the aircraft-interface and 
      release behaviour.
    givens:
    - Total mass = 400 kg
    - Distance from the light module = separation x heavy mass / total mass
    relationship: Centre of mass from the light module = separation × heavy mass ÷ total mass.
  answerText: About 1.13 m from the light module, three-quarters of the way toward the heavy 1.
- group: E
  task: Allocate 100 research credits across the 3 proposals. You may hold credits in reserve, but explain the decision 

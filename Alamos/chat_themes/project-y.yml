lessons:
- group: T
  task: Arrange the four cards from earliest cause or prerequisite to latest result.
  title: The binding-energy curve
  setup: Place the reasoning steps that connect the curve to energy release.
  scene: >-
    The binding-energy curve is chalked up in the Theoretical Division. Bethe wants the
    reasoning behind fission's energy release written out step by step, before it goes
    into the notebook the laboratory will work from.
  guide: >-
    These four are one argument, and it only reaches an answer by comparison. Ask
    of each card what has to be located first. Nothing can be called more tightly
    bound before both states are on the curve. And the energy released is the
    difference, which is the last step rather than the first.
  background:
  - >-
    Why the order is graded whole. A sequence is a claim about dependency: each
    step is here because the one before it has already happened, or has to have.
    One transposed pair falsifies that claim wherever it sits, so partial credit
    would be credit for a sequence that does not work.
  - >-
    Why the ends are the place to start. The first and last cards are constrained
    by having nothing before or after them, which usually makes them the two you
    can settle from the scene alone. Pinning them collapses the remaining
    arrangements sharply, and what is left in the middle is where the actual
    judgement lives.
  - >-
    What the rail can be ordered on. Time is the usual axis, but it is not the
    only one. An order can run on cost, on risk, or on reversibility — every
    observation that leaves the sample as it was, before any that consumes it. On
    those boards a chronological reading finds nothing, because none of the steps
    has to happen at a particular hour.
  takeaway: Energy release is a difference between states, not a property of one isolated point.
  format: SEQUENCE
  why: The curve predicts energy release only after initial and final states are compared.
  cards:
  - Locate the initial nuclei on the binding-energy-per-nucleon curve
  - Identify products closer to the broad maximum
  - Recognize that the products are more tightly bound
  - Convert the binding-energy difference into released energy
  order: [0, 1, 2, 3]
  answerText: 2 -> 3 -> 4 -> 5 (Locate the initial nuclei on the binding-energy-per-nucleon curve -> Identify products 
    closer to the broad maximum -> Recognize that the products are more tightly bound -> Convert the binding-energy 
    difference into released energy)
- group: T
  task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
  title: Activity and count rate
  setup: A calculation group must choose the missing factor for four count-rate questions.
  scene: >-
    Leona Woods, who builds the counters, has four count-rate questions on the bench and a
    group of calculators waiting. Each one needs a different missing factor before a
    detector reading can be quoted as what the source is doing.
  guide: >-
    Four conversions and four operations. Pair them by asking what belongs to the
    source and what belongs to the instrument. Activity is the source's. A count
    rate belongs to the source and the detector together. So one of these
    multiplies by an instrument property, and one divides by it before comparing.
  background:
  - >-
    Why this is a matching board and not four separate questions. Responses on
    boards like this are written to be plausible for more than one situation, so
    choosing them one at a time lets a nearly-right answer through unexamined.
    Having to place all of them forces the comparison — not "is this reasonable
    here", but "is it more right here than there".
  - >-
    How to use the one-each rule. Because the responses are a set to be
    distributed rather than a list to be sampled, every join you make constrains
    the rest. Settling the two you are confident of can leave the remaining pair
    decided by elimination. Where it does not, two responses are still competing
    for one situation, and that is exactly the distinction the stop is testing.
  - >-
    Why you cannot be wrong about exactly one. With every response used once,
    three correct joins leave the fourth with only one place to go. Any error
    therefore involves at least two joins. That is worth remembering when the last
    pair looks forced: the fault is usually not in the join you are struggling
    with, but in one you made early and stopped questioning.
  takeaway: A detector does not observe every decay, and it also observes events that are not from the source.
  format: PROTOCOL
  why: Activity belongs to the source; count rate belongs to the source-detector arrangement.
  columns:
  - What you want to work out
  - How you work it out
  scenarios:
  - Convert number of nuclei to decays per second
  - Convert decays per second to detected events
  - Correct a measured gross rate
  - Compare two sources measured at different efficiencies
  choices:
  - Multiply by decay constant.
  - Multiply by detector efficiency.
  - Subtract background rate.
  - Divide by efficiency before comparison.
  mapping: [0, 1, 2, 3]
  answerText: Convert number of nuclei to decays per second -> Multiply by decay constant; Convert decays per second to 
    detected events -> Multiply by detector efficiency; Correct a measured gross rate -> Subtract background rate; 
    Compare two sources measured at different efficiencies -> Divide by efficiency before comparison
- group: T
  task: Arrange the four cards from earliest cause or prerequisite to latest result.
  title: Exponential attenuation and mean free path
  setup: Order the conceptual chain behind exponential attenuation.
  scene: >-
    Fermi wants the reasoning behind attenuation set out in order before anybody uses the
    tables. The theory group keeps quoting a mean free path for neutrons crossing a slab,
    and nobody has agreed what that average is over.
  guide: >-
    These four are one argument, and the exponential is the conclusion rather than
    the assumption. Ask of each card what has to be true before it. Probabilities
    multiply along a path only once each interval has one. And that repeated
    multiplication is what makes the shape exponential.
  background:
  - >-
    Why the order is graded whole. A sequence is a claim about dependency: each
    step is here because the one before it has already happened, or has to have.
    One transposed pair falsifies that claim wherever it sits, so partial credit
    would be credit for a sequence that does not work.
  - >-
    Why the ends are the place to start. The first and last cards are constrained
    by having nothing before or after them, which usually makes them the two you
    can settle from the scene alone. Pinning them collapses the remaining
    arrangements sharply, and what is left in the middle is where the actual
    judgement lives.
  - >-
    What the rail can be ordered on. Time is the usual axis, but it is not the
    only one. An order can run on cost, on risk, or on reversibility — every
    observation that leaves the sample as it was, before any that consumes it. On
    those boards a chronological reading finds nothing, because none of the steps
    has to happen at a particular hour.
  takeaway: Exponential attenuation is a probability model, not a guarantee that every particle travels exactly one mean
    free path.
  format: SEQUENCE
  why: An exponential appears because the same fractional survival process repeats over many small intervals.
  cards:
  - A particle enters a uniform material
  - Each short path interval carries a small interaction probability
  - Survival probabilities multiply along the path
  - Transmitted intensity falls exponentially with thickness
  order: [0, 1, 2, 3]
  answerText: 2 -> 3 -> 4 -> 5 (A particle enters a uniform material -> Each short path interval carries a small 
    interaction probability -> Survival probabilities multiply along the path -> The surviving intensity becomes 
    exponential in thickness)
- group: T
  scene: >-
    A bomb is finite rather than an infinite block of material. Klaus Fuchs, a theorist in
    T Division, is estimating a competition: collisions inside the assembly against escape
    through its surface. The test case is a neutron in a large water tank.
  guide: >-
    Four numbers, and two of them are the total path rather than a step, and a
    step count ten times too small. Ask of each which the relationship needs. A
    random walk does not go as far as it travels. The net distance grows with the
    square root of the steps, not with the steps.
  background:
  - >-
    Why an estimate rather than a calculation. Every quantity on this board is
    already measured or stated, so nothing here has to be derived. What is being
    tested is whether you can pick the quantities the relationship actually needs,
    and whether the size of the answer looks right once they are in place.
  - >-
    Why the tiles carry labels. A bare number cannot be checked against the
    relationship it is going into. Reading the label is how a unit mismatch, or a
    quantity belonging to a different part of the problem, is caught before it is
    placed — which is the habit this format exists to build.
  task: Estimate the net displacement.
  title: Diffusion and leakage
  setup: A neutron in a large water tank makes about 100 scattering steps of about 2 cm each.
  takeaway: Many collisions can produce a modest net displacement because directions randomize.
  format: BALLPARK
  why: 2 x sqrt(100) = 20 cm, far less than the 200 cm of path travelled.
  estimate:
    prompt: A neutron in a large water tank scatters about 100 times, travelling about 2 cm between collisions. 
      Random-walk displacement is roughly the step length times the square root of the number of steps. Estimate its net
      displacement.
    question: Choose the step length and the number of steps.
    labels:
    - 2 cm
    - 100 steps
    - 200 cm
    - 10 steps
    values: [2, 100, 200, 10]
    slots: 2
    template: displacement ≈ {0} × √{1}
    formula: a*Math.sqrt(b)
    correct: [0, 1]
    target: 20
    tolerance: 2
    units: cm
    solution: 2 cm × √100 ≈ 20 cm.
    explanation: The neutron covers 200 cm of path but ends up only about 20 cm from where it started. That gap between 
      path length and net displacement is why a moderator can be far smaller than the total distance a neutron travels 
      inside it.
    givens:
    - Root-mean-square displacement is roughly step length x sqrt(number of steps)
    relationship: A random walk goes net distance ≈ step length × the square root of the number of steps.
  answerText: About 20 cm.
- group: T
  task: Estimate the population after two generations.
  title: Neutron multiplication factor
  setup: A simplified system begins with 1,000 neutrons and has k=0.95.
  scene: >-
    Fermi is settling the theory group's language for chain reactions, because every group
    on the mesa quotes the multiplication factor with a different meaning attached to it.
    A simplified system on the board starts with a thousand neutrons.
  guide: >-
    Four numbers, and two of them are multiplication factors. Only one belongs to
    this system. Ask of each whether it describes the generation, the population,
    or how many generations. And note what happens with a factor below one: each
    generation is smaller than the last.
  background:
  - >-
    Why an estimate rather than a calculation. Every quantity on this board is
    already measured or stated, so nothing here has to be derived. What is being
    tested is whether you can pick the quantities the relationship actually needs,
    and whether the size of the answer looks right once they are in place.
  - >-
    Why the tiles carry labels. A bare number cannot be checked against the
    relationship it is going into. Reading the label is how a unit mismatch, or a
    quantity belonging to a different part of the problem, is caught before it is
    placed — which is the habit this format exists to build.
  takeaway: Small deviations of k from one compound over many generations.
  format: BALLPARK
  why: 1000 x 0.95^2 is about 903.
  estimate:
    prompt: A system starts with 1,000 neutrons and is slightly subcritical at k = 0.95. Estimate the population 2 
      generations later.
    question: Choose the initial population, the multiplication factor, and the generation count.
    labels:
    - 1,000 neutrons
    - "0.95"
    - 2 generations
    - "0.50"
    values: [1000, 0.95, 2, 0.5]
    slots: 3
    template: N₂ ≈ {0} × ({1})^{2}
    formula: a*Math.pow(b,c)
    correct: [0, 1, 2]
    target: 902.5
    tolerance: 35
    units: neutrons
    solution: 1,000 × 0.95² ≈ 900 neutrons.
    explanation: A system described as only slightly subcritical should have k just below one, so the population 
      declines gently over a few generations.
    givens:
    - After 1 generation N1=k N0
    - After 2 generations N2=k^2 N0
    relationship: After n generations, the population = the starting number × kⁿ.
  answerText: About 900 neutrons.
- group: T
  task: Arrange the four cards from earliest cause or prerequisite to latest result.
  title: Prompt and delayed neutron timescales
  setup: Order the reasoning used to analyze a mixed prompt-delayed population.
  scene: >-
    Most fission neutrons appear almost immediately and a small fraction arrive later.
    Bethe wants the analysis of a mixed population written out in order, because reactor
    people and bomb people keep using one word for two different clocks.
  guide: >-
    All four steps happen, and the small population matters out of proportion to
    its size. Ask of each card what would be missing without it. A delay is
    useless without knowing what fraction carries it. And a response cannot be
    predicted before both populations have their timescales attached.
  background:
  - >-
    Why the order is graded whole. A sequence is a claim about dependency: each
    step is here because the one before it has already happened, or has to have.
    One transposed pair falsifies that claim wherever it sits, so partial credit
    would be credit for a sequence that does not work.
  - >-
    Why the ends are the place to start. The first and last cards are constrained
    by having nothing before or after them, which usually makes them the two you
    can settle from the scene alone. Pinning them collapses the remaining
    arrangements sharply, and what is left in the middle is where the actual
    judgement lives.
  - >-
    What the rail can be ordered on. Time is the usual axis, but it is not the
    only one. An order can run on cost, on risk, or on reversibility — every
    observation that leaves the sample as it was, before any that consumes it. On
    those boards a chronological reading finds nothing, because none of the steps
    has to happen at a particular hour.
  takeaway: A small component can dominate controllability when its timescale is very different.
  format: SEQUENCE
  why: A useful kinetics model preserves both the small delayed fraction and its much longer timescale.
  cards:
  - Identify which neutron populations are present
  - Assign each population its characteristic delay or lifetime
  - Weight each contribution by its fraction
  - Combine them to predict the system response
  order: [0, 1, 2, 3]
  answerText: 2 -> 3 -> 4 -> 5 (Identify which neutron populations are present -> Assign each population its 
    characteristic delay or lifetime -> Weight each contribution by its fraction -> Combine them to predict the system 
    response)
- group: T
  task: Allocate 100 research credits across the 3 proposals. You may hold credits in reserve, but explain the decision 
    criterion.
  title: Criticality safety as a systems concept
  setup: A laboratory has 100 credits to reduce uncertainty in routine handling of fissile materials.
  scene: >-
    Elizabeth Graves, the critical-assemblies physicist, has a hundred credits to spend on
    reducing uncertainty in the routine handling of fissile material. Three proposals are
    on the table, and the handling arrangements have grown up piecemeal around the
    benches.
  guide: >-
    k depends on mass, reflection, moderation and geometry together, and an
    accident needs only one of them to move. Mass accounting is independent of the
    operator's own arithmetic, so it catches a limit being exceeded before
    geometry matters at all. Accidental moderation and geometry changes are the
    least measured terms here and the hardest to see in a logbook. A warning
    display adds no measurement and no limit. It reports what is already known to
    whoever is reading it.
  rules: >-
    Spread the hundred points across the 3 proposals. At least 80 of them have to
    be committed, because a panel that funds almost nothing has not decided
    anything. Your largest single allocation must be 35 or more, and it has to
    land on what the evidence supports most. Keep the total sitting on proposals
    the evidence does not support under fifteen. And a proposal it does support
    should not be left under twenty.
  background:
  - >-
    Why the whole spread is graded. Funding is not a vote for one idea. A
    portfolio says what you think is likely, what is worth hedging against, and
    what is not worth pursuing at all — and the last two are where most of the
    information is. Backing the right proposal while quietly funding a bad one is
    a worse answer than it looks. That is why the small numbers count as much as
    the big one.
  - >-
    What the three numbers are for. Thirty-five is what makes a lead a lead: below
    it you have hedged rather than chosen. Fifteen is the most that can sit on
    unsupported work before it stops being a rounding error. Past that it is a
    second opinion nobody argued for. Twenty is the floor under a line of work you
    have already called strong, because funding it too thin to finish spends the
    money and buys nothing.
  - >-
    Why there is a floor on the total. Points held back are not caution; they are
    a decision not to decide, taken with somebody else's money and somebody else's
    deadline. The floor is what forces the panel to say something.
  takeaway: Criticality safety is achieved by layered limits and verified process control, not by one calculation.
  format: SCIENCETANK
  why: The highest-value work reduces uncertainty in the variables that govern neutron balance and provides independent 
    controls.
  proposals:
  - label: A
    text: Improve independent mass-accounting and process limits
  - label: B
    text: Characterize accidental moderation and geometry changes
  - label: C
    text: Add a decorative warning display with no new measurement
  recommended:
    A: 45
    B: 50
  answerText: "Recommended: 45 to A, 50 to B, 5 held for follow-up; near-zero to C."
- group: T
  task: Estimate joules per fission.
  title: Energy released in fission
  setup: Assume a notional fission releases about 200 MeV and 1 MeV=1.60 x 10^-13 joule.
  scene: >-
    Oppenheimer wants a figure he can quote for the energy in a single fission before the
    next colloquium. The theory group has the notional two hundred million electron volts
    per event and a conversion to joules on the board.
  guide: >-
    Four numbers, and two of them are conversions. One belongs to atomic mass
    units rather than to joules. Ask of each what units it carries. And note the
    scale of the answer. It is tiny for a laboratory and enormous for one atom,
    which is the whole point of the arithmetic.
  background:
  - >-
    Why an estimate rather than a calculation. Every quantity on this board is
    already measured or stated, so nothing here has to be derived. What is being
    tested is whether you can pick the quantities the relationship actually needs,
    and whether the size of the answer looks right once they are in place.
  - >-
    Why the tiles carry labels. A bare number cannot be checked against the
    relationship it is going into. Reading the label is how a unit mismatch, or a
    quantity belonging to a different part of the problem, is caught before it is
    placed — which is the habit this format exists to build.
  takeaway: Macroscopic nuclear energy comes from an immense number of microscopic events.
  format: BALLPARK
  why: The energy per event is tiny macroscopically but enormous per atom.
  estimate:
    prompt: 1 fission releases about 200 MeV, and 1 MeV is 1.6×10⁻¹³ joule. Estimate the energy of a single fission in 
      joules.
    question: Choose the energy per fission and the MeV-to-joule conversion.
    labels:
    - 200 MeV
    - 1.6×10⁻¹³ J/MeV
    - 931 MeV
    - 10⁶ J/MeV
    values: [200, 1.6e-13, 931, 1000000]
    slots: 2
    template: E ≈ {0} × {1}
    formula: a*b
    correct: [0, 1]
    target: 3.2e-11
    tolerance: 5e-12
    units: J
    solution: 200 MeV × 1.6×10⁻¹³ J/MeV ≈ 3.2×10⁻¹¹ J.
    explanation: A fission releases a few hundred MeV. 1 MeV is about 1.6×10⁻¹³ joule.
    givens:
    - Energy per event = 200 x 1.60 x 10^-13 J
    relationship: Energy in joules = energy in MeV × the number of joules in one MeV.
  answerText: About 3.2 x 10^-11 J.
- group: T
  task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
  title: Fission fragments and heat deposition
  setup: Match each fission-energy carrier to its dominant transport behavior.
  scene: >-
    Chien-Shiung Wu, the Columbia physicist working on fission, is asking where the energy
    from one event actually ends up. Several carriers leave that event at once, and the
    theory group has been treating them as though they all behave alike.
  guide: >-
    Four carriers and four behaviours. Pair them by asking two things of each: how
    far it travels before it stops, and for how long it keeps arriving. One stops
    within microns, which is why it heats locally. One keeps releasing energy for
    years, which is why the products need cooling long afterwards.
  background:
  - >-
    Why this is a matching board and not four separate questions. Responses on
    boards like this are written to be plausible for more than one situation, so
    choosing them one at a time lets a nearly-right answer through unexamined.
    Having to place all of them forces the comparison — not "is this reasonable
    here", but "is it more right here than there".
  - >-
    How to use the one-each rule. Because the responses are a set to be
    distributed rather than a list to be sampled, every join you make constrains
    the rest. Settling the two you are confident of can leave the remaining pair
    decided by elimination. Where it does not, two responses are still competing
    for one situation, and that is exactly the distinction the stop is testing.
  - >-
    Why you cannot be wrong about exactly one. With every response used once,
    three correct joins leave the fourth with only one place to go. Any error
    therefore involves at least two joins. That is worth remembering when the last
    pair looks forced: the fault is usually not in the join you are struggling
    with, but in one you made early and stopped questioning.
  takeaway: Energy accounting must include both immediate deposition and later decay heat.
  format: PROTOCOL
  why: Different carriers move energy over different distances and times.
  columns:
  - Which product carries the energy
  - Where that energy ends up
  scenarios:
  - Heavy charged fragments
  - Fast neutrons
  - Prompt gamma rays
  - Delayed beta and gamma radiation
  choices:
  - Stops within microns of the event, making it the dominant source of immediate local heating.
  - Carries energy tens of centimetres away and can start further fissions before slowing down.
  - Leaves at the speed of light and needs dense material to be stopped.
  - Keeps releasing energy for minutes to years afterwards, so the products must be cooled and shielded long after the 
    event.
  mapping: [0, 1, 2, 3]
  answerText: Heavy charged fragments -> Stops within microns of the event, making it the dominant source of immediate 
    local heating.; Fast neutrons -> Carries energy tens of centimetres away and can start further fissions before 
    slowing down.; Prompt gamma rays -> Leaves at the speed of light and needs dense material to be stopped.; Delayed 
    beta and gamma radiation -> Keeps releasing energy for minutes to years afterwards, so the products must be cooled 
    and shielded long after the event.

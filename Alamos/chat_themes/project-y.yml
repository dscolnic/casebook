- group: CM
  task: Estimate the density.
  title: Density measurement
  setup: A sample has mass 250 g and measured volume 20 cm^3.
  scene: >-
    A sample has come across to Hornig with a mass of 250 grams and a measured volume of
    20 cubic centimetres. Before anything else is done to it, she wants to know whether
    the metal is what the label says.
  guide: >-
    Four numbers, in two pairs, and each pair differs by a factor of ten. Ask of
    each whether it is a mass or a volume. Then check which pair goes together.
    Two of these would give an answer that looks reasonable and is out by a
    hundred.
  background:
  - >-
    Why an estimate rather than a calculation. Every quantity on this board is
    already measured or stated, so nothing here has to be derived. What is being
    tested is whether you can pick the quantities the relationship actually needs,
    and whether the size of the answer looks right once they are in place.
  - >-
    Why the tiles carry labels. A bare number cannot be checked against the
    relationship it is going into. Reading the label is how a unit mismatch, or a
    quantity belonging to a different part of the problem, is caught before it is
    placed — which is the habit this format exists to build.
  takeaway: Density measurements can reveal voids, phase changes, or composition differences.
  format: BALLPARK
  why: 250/20=12.5.
  estimate:
    prompt: A metal sample has a mass of 250 g and a measured volume of 20 cm³. Estimate its density.
    question: Choose the mass and the volume.
    labels:
    - 250 g
    - 20 cm³
    - 25 g
    - 200 cm³
    values: [250, 20, 25, 200]
    slots: 2
    template: density ≈ {0} ÷ {1}
    formula: a/b
    correct: [0, 1]
    target: 12.5
    tolerance: 0.7
    units: g/cm³
    solution: 250 g ÷ 20 cm³ ≈ 12.5 g/cm³.
    explanation: At 12.5 g/cm³ the sample sits between lead at 11.3 and uranium at 19, so density alone is enough to 
      flag a substituted material, a porous casting, or a bad volume measurement before any chemistry is done.
    givens:
    - Density = mass/volume
    relationship: Density = mass ÷ volume.
  answerText: 12.5 g/cm^3.
- group: CM
  task: Estimate the length change in millimetres.
  title: Thermal properties
  setup: A 100 mm component has expansion coefficient 15 x 10^-6 per kelvin and warms by 100 K.
  scene: >-
    A hundred-millimetre component has to hold its fit through a hundred-kelvin swing
    between the shop and the assembly bay. Bradbury wants the number before the tolerance
    is written, because parts are measured cold and used warm.
  guide: >-
    Four numbers, and two of them are temperature changes ten times apart. Ask of
    each which one this part saw. And watch the units: the coefficient is per
    kelvin, the length is in millimetres, and the answer is wanted in millimetres
    too.
  background:
  - >-
    Why an estimate rather than a calculation. Every quantity on this board is
    already measured or stated, so nothing here has to be derived. What is being
    tested is whether you can pick the quantities the relationship actually needs,
    and whether the size of the answer looks right once they are in place.
  - >-
    Why the tiles carry labels. A bare number cannot be checked against the
    relationship it is going into. Reading the label is how a unit mismatch, or a
    quantity belonging to a different part of the problem, is caught before it is
    placed — which is the habit this format exists to build.
  takeaway: Small expansion coefficients can create meaningful dimensional changes over large temperature swings.
  format: BALLPARK
  why: 15 x 10^-6 x 0.10 x 100=1.5 x 10^-4 m.
  estimate:
    prompt: A 100 mm metal component with expansion coefficient 15×10⁻⁶ K⁻¹ is heated by 100 K. Estimate the length 
      change in millimetres.
    question: Choose the coefficient, the original length, and the temperature change.
    labels:
    - 15×10⁻⁶ K⁻¹
    - 100 mm
    - 100 K
    - 10 K
    values: [0.000015, 100, 100, 10]
    slots: 3
    template: ΔL ≈ {0} × {1} × {2}
    formula: a*b*c
    correct: [0, 1, 2]
    target: 0.15
    tolerance: 0.02
    units: mm
    solution: 15×10⁻⁶ K⁻¹ × 100 mm × 100 K ≈ 0.15 mm.
    explanation: A tenth of a millimetre sounds negligible until it is compared with the fit it has to hold. Machining 
      tolerances on a precision assembly run at this same scale, so a part measured cold can be out of tolerance warm.
    givens:
    - Delta L = alpha L Delta T
    relationship: Length change = expansion coefficient × original length × temperature change.
  answerText: About 0.15 mm.

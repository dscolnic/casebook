        Estimate the conservative lower bound.
      question: Choose the measured value and the uncertainty.
      labels:
      - 102 measured units
      - 3 uncertainty units
      - 100 threshold units
      - 30 uncertainty units
      values: [102, 3, 100, 30]
      slots: 2
      template: lower bound ≈ {0} − {1}
      formula: a-b
      correct: [0, 1]
      target: 99
      tolerance: 0.15
      units: units
      solution: 102 − 3 ≈ 99 units, which falls below a 100-unit threshold.
      explanation: The lower bound of 99 falls below the 100-unit threshold, so a measurement that reads above the limit
        still does not demonstrate compliance. The margin has to exceed the uncertainty before a pass is unambiguous.
      givens:
      - The lower plausible value is about 99
      relationship: The lower bound of a result = the measured value − its uncertainty. Compare that against the 
        threshold, not the central value.
- title: One Integrated Trial
  objective: Choose tests that can discriminate between explanations, expose the schedule's true critical path, and 
    define what scaled inert experiments can and cannot transfer.
  briefing: The full program is converging on one integrated non-nuclear campaign. The player spends scarce test access 
    on the experiment that can actually separate hypotheses, calculates schedule float, and states scaling limits before
    interpreting an inert hydrodynamic mockup.
  stake: It is April 1945, and one hidden bottleneck now controls the whole schedule. Only a few full tests remain, and a
    dramatic test may not tell the two main ideas apart. Today you must choose a useful test, find the work that sets the date,
    and limit what a small mockup can prove. The wrong choice could spend the last test and still leave the key question open.
  takeaway: The best integrated test is the one whose possible outcomes change the decision, and the best schedule is 
    the one that exposes the dependency that really sets the date.
  stops:
  - group: P
    task: Spend the single week of facility time on the test whose possible outcomes would separate the competing timing
      hypotheses.
    title: Buy the test that can decide
    scene: >-
      Three team leads are waiting outside the facility office, each with a test they
      say cannot wait. There is one week of access left in the schedule and only one
      proposal can take it. Bacher needs a name before Monday.
    guide: >-
      One week of access, three tests, and one name needed before Monday. Open each
      proposal and ask what decision its result would change. A test that everybody
      agrees is important but whose result changes nothing this month has not earned
      the week. Commit to the one that moves the programme's next decision.
    background:
    - >-
      What makes a test decisive rather than valuable. Two possible outcomes leading
      to different actions. A test whose likely result confirms the current plan is
      worth running eventually and not worth the only week of access left.
    - >-
      Why the leads all say theirs cannot wait. Each is right about their own
      programme and none of them is holding the schedule. The scheduler is the only
      person looking at what the next decision actually requires, which is why the
      choice sits there.
    - >-
      Why Monday. A name given late costs the week itself, so an imperfect choice
      made in time beats a better one made after the access has lapsed.
    assumes:
    - an experiment is useful when different explanations predict different outcomes
    - facility time is limited
    takeaway: A test is valuable when its possible outcomes distinguish competing explanations, not when it merely 
      produces more data.
    format: VALUE
    question: Which test changes the programme's next decision?
    value:
      hint: You have one facility week. Open each plan to see what its result would tell you, then spend the week on the
        evidence that can separate the two timing explanations.
      budget:
        amount: 1
        unit: facility week
      decision: Choose which timing explanation to pursue in the next design cycle.
      options:
      - id: discriminate
        label: Small test aimed at the timing signature where the hypotheses differ
        cost: 1
        axis: hypothesis separation
        decisive: true
        reveals: Which timing hypothesis survives when the one observable they predict differently is measured.
      - id: fullscale
        label: Full-scale assembly shot with limited diagnostics
        cost: 1
        axis: integrated performance
        decisive: false
        reveals: Whether the integrated assembly performs well or badly, while leaving several causes capable of 
          producing the same result.
      - id: repeats
        label: Long repeat series at the already-tested condition
        cost: 1
        axis: repeatability
        decisive: false
        reveals: The statistical scatter at a condition already known, without distinguishing the two explanations.
      - id: undocumented
        label: Repeat last month's poorly documented configuration
        cost: 1
        axis: comparability
        decisive: false
        reveals: A new outcome that cannot be cleanly compared with the old one because the original configuration is 
          uncertain.
    answerText: Use the week on the small test that cleanly separates the two timing hypotheses. Its outcomes point to 
      different explanations, so the result changes what the programme does next.
    why: Before a test is run, each hypothesis should predict what the chosen observable will do. If both hypotheses 
      predict the same trace, even perfect data cannot separate them. Repeating one condition can reduce statistical 
      uncertainty while leaving the decision unchanged. A large integrated shot can also be ambiguous if several causes 
      move the same output. The valuable test is the smallest one whose outcomes differ between the hypotheses, with 
      diagnostics aimed directly at that difference.
    call: Instrument the non-nuclear test
    reason: With few trials left, today's test must record evidence that can separate the two live explanations.
    setup: Three test concepts compete for one week of facility time.
  - group: E
    task: Estimate how much a parallel chain can slip before it controls the date.
    title: Critical path to an integrated trial
    scene: >-
      Groves, the Army officer who commands the Manhattan Project, wants a date for the integrated trial, and three chains of work are running
      in parallel toward it. Lens inspection, electrical qualification and casing work
      each report their own weeks, and nobody has put the three on one sheet.
    guide: >-
      Four numbers, and two of them belong to other questions: one task, and both
      chains added together. Ask of each whether it is a chain length. Only the
      longest chain moves the date. The gap between the two is what a parallel chain
      can lose before it becomes the one that matters.
    background:
    - >-
      Why an estimate rather than a calculation. Every quantity on this board is
      already measured or stated, so nothing here has to be derived. What is being
      tested is whether you can pick the quantities the relationship actually needs,
      and whether the size of the answer looks right once they are in place.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the
      relationship it is going into. Reading the label is how a unit mismatch, or a
      quantity belonging to a different part of the problem, is caught before it is
      placed — which is the habit this format exists to build.
    assumes:
    - work that can happen in parallel does not add up
    takeaway: Schedule management starts with dependencies, not activity counts.
    format: BALLPARK
    answerText: Two weeks of float; a third week of slippage makes it the new critical path.
    why: The longest chain is the critical path. It is the only place where adding people or shifts moves the date. 
      Effort poured into a task that is not on it changes nothing, however busy it makes everyone. It is spent on float 
      that was already there. Float is the gap between the controlling chain and the one being worked on, and it is 
      finite. Enough slippage on a parallel chain makes that chain the new critical path. At which point the whole 
      calculation has to be done again.
    call: Identify the critical path
    reason: The promised date is false unless you find the one chain of jobs that controls when the trial can happen.
    setup: "A simplified schedule has three dependency chains: lens inspection at 3 + 4 + 2 weeks, electrical qualification
      at 2 + 3 + 2, and casing work at 2 + 2 + 3."
    estimate:
      prompt: The controlling chain of an integrated trial runs 9 weeks. A parallel chain in the same trial runs 7 
        weeks. Estimate how much the parallel chain can slip before it becomes the chain that sets the date.
      question: Choose the controlling chain duration and the parallel chain duration.
      labels:
      - 9 weeks controlling chain
      - 7 weeks parallel chain
      - 4 weeks single task
      - 12 weeks both chains
      values: [9, 7, 4, 12]
      slots: 2
      template: float ≈ {0} − {1}
      formula: a-b
      correct: [0, 1]
      target: 2
      tolerance: 0.2
      units: weeks
      solution: 9 weeks − 7 weeks = 2 weeks of float.
      explanation: "The parallel chain carries two weeks of slack: two weeks of trouble there costs the programme nothing,
        and a third week makes it the new critical path. This is why adding people to work off the critical path buys no schedule
        at all — the effort is spent on float that already existed. Manage the float, not just the length."
      givens:
      - Lens inspection chain totals 9 weeks and controls the date
      - Each other chain totals 7 weeks
      - Float = controlling chain - parallel chain
      relationship: Float on a parallel chain = the length of the controlling chain − the length of that chain.
  - group: X
    task: A half-scale inert hydrodynamic mockup is run. Which conclusions are entitled to transfer to full scale?
    title: What a scaled inert experiment can and cannot tell you
    place: Implosion Test Range
    scene: >-
      Bacher has a half-scale inert mockup on the table. Geometric dimensions, propagation measurements and diagnostic records
      are listed at both scales. He wants the team to state the similarity assumptions before interpreting the result.
    guide: >-
      Ratios can transfer when the relevant dimensionless groups are matched. Intrinsic material lengths and times do not
      automatically scale with the geometry. Choose the claim that preserves that distinction.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to
      be the answer under one specific misreading — a step skipped, a quantity
      confused with a rate, a correlation taken for a cause. Identifying which
      misreading each belongs to is where the learning is; the right answer alone
      can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the
      qualifying clause and the unit. So across a whole game the key used to be the
      longest option far more often than chance — 88 per cent of passage quizzes
      here, before it was fixed. It is now checked per game as a binomial tail, so
      length, hedging and specificity have had the signal taken out of them
      deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the
      verdict prints them — the reason that option fails, not a restatement of the
      right one. They are worth reading after a correct answer as well: a right
      choice made for an approximate reason is indistinguishable from a sound one
      until the day the approximation is what is being tested.
    takesAsRead:
    - "Units and conversions: MeV, u, barns, scientific notation"
    assumes:
    - a dimensionless ratio has the same value at any scale
    takeaway: A smaller model is useful only when the lab states which parts of the physics stay alike and which need a
      fresh test.
    format: CHOICE
    answerText: Transfer only conclusions governed by matched dimensionless ratios; re-check effects tied to intrinsic 
      material length or time scales.
    why: "Similarity is controlled by dimensionless groups. If the governing ratios match, a scaled inert experiment can reproduce
      the behavior associated with them. But material diffusion lengths, relaxation times and propagation properties have
      their own dimensions and do not simply halve because the geometry does. The scientific discipline is to write down which
      similarities are preserved before the result is used."
    call: Decide what scaling preserves
    reason: The small mockup can guide the final choice only if the lab states which effects truly carry to full size.
    rebuttals:
    - An unchanged propagation speed does not make every absolute time transferable when path lengths change.
    - A single geometric scale factor works only if all physically relevant intrinsic scales change with it, which they 
      usually do not.
    - Scaled experiments can be quantitatively predictive when the governing dimensionless groups are matched.
    choices:
    - Transfer only conclusions governed by matched dimensionless ratios; re-check effects tied to intrinsic material 
      length or time scales.
    - Transfer all timing results directly because the material propagation speed is unchanged.
    - Transfer every geometric and timing conclusion after multiplying lengths and times by the same scale factor.
    - Treat every scaled result as qualitative only, because material properties make similarity impossible.
    answer: Transfer only conclusions governed by matched dimensionless ratios; re-check effects tied to intrinsic 
      material length or time scales.
  - group: T
    task: Work the shop queue while the priority changes.
    title: What the shop is making today
    reason: The schedule can be trusted only if today's work, tests, and handoffs all refer to the same approved item.
    concept: "Experimental method: controls, calibration, systematic vs random error"
    place: Theoretical Division
    scene: >-
      The machine shop takes work from every division and cannot take it all. The
      priority is set on a card at the window. Bacher's committee changes it whenever
      the schedule does, after a test date moves or an assay comes back.
    guide: >-
      Release the jobs the current priority wants and hold the rest. The card at the
      window is changed during the day and nobody announces it. What is scored is the
      jobs either side of a change, because they are the only ones that show whether the
      window is reading the card.
    background:
    - >-
      Why a shop priority changes. Early it is whatever the test date needs. When an assay
      comes back wrong it is whatever the re-measurement needs, because a number nobody
      trusts stops every calculation resting on it. When a division head appears it is
      whatever that division wants, which is a different rule and worth naming honestly.
    - >-
      Why the changeover costs here. A machined part is hours of a scarce machinist and a
      scarcer piece of material. A job released under the old priority is not merely late —
      it has consumed the capacity the new priority was written to buy.
    assumes:
    - a workshop with limited capacity decides what to make first
    takeaway: The cost of a withdrawn instruction is paid by whoever is still working to it.
    format: SPOT
    question: Release to the priority on the card, and keep watching the card.
    answerText: Read the card rather than the queue. Every change leaves an hour in which the old priority still looks 
      like today's.
    why: >-
      Three priorities run across the day and each wants a different part of the queue.
      Anything the test date needs, then anything a re-measurement needs, then anything a
      division head has asked for in person. A job can answer two at once, which is what
      makes the change cost real. The panel scores the window either side of each change,
      because most of the queue is wanted by neither priority and is correctly held by
      somebody who has read nothing. And the cost here is material as well as time: a part
      released under yesterday's priority has used a machinist, a lathe and a piece of
      metal that the new priority was written to spend on something else, and none of the
      three comes back at the end of the day.
    spot:
      duration: 40
      switchEvery: 12
      pass: 0.75
      hint: The priority is on the card at the window, and it changes without an announcement.

- group: X
  task: Match each situation to the best action, control, document, or interpretation. Each option is used once.
  title: Betatron and high-speed radiography
  setup: Match each radiography problem to its remedy.
  scene: >-
    Leona Woods, a physicist who builds detectors, has four betatron radiographs pinned up
    and not one of them settles the question. The machine can photograph through dense
    material during the shot, but only if everything about the exposure is right.
  guide: >-
    Four problems and four fixes. Pair them by asking which property of the image
    each is about. The time resolution? The range of brightness it can hold? Its
    registration against the event? Or the geometry it was taken from? One viewing
    angle cannot separate two possible asymmetries, whatever the exposure.
  background:
  - >-
    Why this is a matching board and not four separate questions. Responses on
    boards like this are written to be plausible for more than one situation, so
    choosing them one at a time lets a nearly-right answer through unexamined.
    Having to place all of them forces the comparison — not "is this reasonable
    here", but "is it more right here than there".
  - >-
    How to use the one-each rule. Because the responses are a set to be
    distributed rather than a list to be sampled, every join you make constrains
    the rest. Settling the two you are confident of can leave the remaining pair
    decided by elimination. Where it does not, two responses are still competing
    for one situation, and that is exactly the distinction the stop is testing.
  - >-
    Why you cannot be wrong about exactly one. With every response used once,
    three correct joins leave the fourth with only one place to go. Any error
    therefore involves at least two joins. That is worth remembering when the last
    pair looks forced: the fault is usually not in the join you are struggling
    with, but in one you made early and stopped questioning.
  takeaway: A picture becomes evidence only when its formation process is understood.
  format: PROTOCOL
  why: Radiography depends on temporal resolution, dynamic range, timing registration, and geometry.
  columns:
  - What is wrong with the image
  - How you fix it
  scenarios:
  - The image is blurred because the exposure window is too long.
  - Dense regions exceed the useful detector range.
  - The x-ray time cannot be related to initiation time.
  - One viewing angle cannot distinguish two possible asymmetries.
  choices:
  - Use a shorter or more precisely timed x-ray pulse so motion during the exposure does not blur the image.
  - Take a second exposure with the screen stepped down in sensitivity, so the darkest part of the picture still lands 
    on the working part of the curve.
  - Feed one marker pulse to both the firing set and the recorder, so the two records share a zero.
  - Add another viewing direction or a complementary diagnostic so two different three-dimensional shapes do not look 
    identical.
  mapping: [0, 1, 2, 3]
  answerText: The image is blurred because the exposure window is too long -> Use a shorter or more precisely timed 
    x-ray pulse so motion during the exposure does not blur the image; Dense regions exceed the useful detector range ->
    Take a second exposure with the screen stepped down in sensitivity, so the darkest part of the picture still lands 
    on the working part of the curve; The x-ray time cannot be related to initiation time -> Feed one marker pulse to 
    both the firing set and the recorder, so the two records share a zero; One viewing angle cannot distinguish two 
    possible asymmetries -> Add another viewing direction or a complementary diagnostic so two different 
    three-dimensional shapes do not look identical

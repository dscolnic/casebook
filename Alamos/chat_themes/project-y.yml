theme:
  id: projecty
  title: Project Y
  subtitle: Los Alamos · 1943–45
format: 2

# The areas of study. One column of the game each; every group needs somebody on the roster.
groups:
- id: T
  code: T
  name: Theory & Calculations
  color: "#315c78"
  difficulty: 5
  type: ballpark
  desc: Neutron physics, decay, reaction rates, and carrying uncertainty through a calculation.
  defaultLeader: bethe
  budget: 72
  milestones:
  - name: Build the chain-reaction notebook
    cost: 14
    work: 11
    brief: Set up the basic neutron-balance, decay, and reaction-rate language that the rest of the program will use.
  - name: Bound the multiplication and timing estimates
    cost: 20
    work: 15
    brief: Compare competing assumptions and identify which parameters actually control the answer.
  - name: Carry uncertainty through the theory stack
    cost: 24
    work: 18
    brief: Carry measurement and model uncertainty all the way to a program-level prediction.
  - name: Issue final predictive tables to the laboratory
    cost: 28
    work: 22
    brief: Translate theory into lookup tables, threshold estimates, and testable predictions.
  issues:
  - Two calculations agree numerically but rely on the same hidden approximation.
  - A predicted trend changes sign when one neglected uncertainty is included.
  - The group has three plausible estimates of neutron multiplication and no clean comparison.
- id: P
  code: P
  name: Experimental Physics & Diagnostics
  color: "#4b775f"
  difficulty: 4
  type: diagnosis
  desc: Counting statistics, detector behavior, timing, and diagnostic reliability.
  defaultLeader: bacher
  budget: 72
  milestones:
  - name: Calibrate counters and timing channels
    cost: 13
    work: 10
    brief: Establish baselines, dead-time corrections, and timing references for core diagnostics.
  - name: Resolve time-dependent signals
    cost: 19
    work: 14
    brief: Separate true physical transients from trigger, gain, or bandwidth artifacts.
  - name: Cross-check independent diagnostic lines
    cost: 24
    work: 18
    brief: Use instruments with different failure modes to test the same physical conclusion.
  - name: Qualify the field instrumentation package
    cost: 30
    work: 22
    brief: Prove that the measurement system remains interpretable outside ideal laboratory conditions.
  issues:
  - A detector channel disagrees with two independent counters after background subtraction.
  - All traces flatten at the same maximum value despite different source strengths.
  - A timing shift appears only after the shared clock chain was serviced.
- id: CM
  code: CM
  name: Chemistry & Metallurgy
  color: "#8a6921"
  difficulty: 4
  type: protocol
  desc: Isotopes, materials properties, contamination control, and repeatable handling.
  defaultLeader: kennedy
  budget: 80
  milestones:
  - name: Characterize the incoming material stream
    cost: 15
    work: 11
    brief: Document isotopic content, purity, and physical state before processing begins.
  - name: Stabilize fabrication and handling procedures
    cost: 22
    work: 15
    brief: Turn laboratory experience into a safe, reproducible materials workflow.
  - name: Verify properties across multiple batches
    cost: 27
    work: 19
    brief: Demonstrate that independent samples satisfy the same evidence-based acceptance criteria.
  - name: Release certified components to integration
    cost: 32
    work: 23
    brief: Complete documentation, property checks, and handoff controls before assembly.
  issues:
  - Two chemically similar batches give different count rates after the same preparation.
  - A successful small trial was copied before the yield-measurement procedure was fully documented.
  - A release package is waiting on an independent contamination survey.
- id: E
  code: E
  name: Ordnance & Engineering
  color: "#865044"
  difficulty: 3
  type: sequence
  desc: Interfaces, timing logic, qualification tests, and instrumented engineering trials.
  defaultLeader: parsons
  budget: 88
  milestones:
  - name: Freeze the system interfaces
    cost: 16
    work: 12
    brief: Make every subsystem state what it supplies, requires, and cannot tolerate.
  - name: Prototype the non-nuclear hardware
    cost: 24
    work: 16
    brief: Expose fit, timing, and manufacturability problems before full integration.
  - name: Run an instrumented engineering trial
    cost: 30
    work: 20
    brief: Test the assembled hardware while preserving evidence about what happened.
  - name: Qualify assembly and delivery operations
    cost: 36
    work: 24
    brief: Demonstrate that the full non-nuclear system can be handled and deployed reliably.
  issues:
  - Two teams are building to different revisions of the same interface sheet.
  - A test is scheduled before its instrumentation has pass/fail criteria.
  - A prototype succeeded, but the team cannot reconstruct which exact configuration was tested.
- id: X
  code: X
  name: Implosion & Systems Integration
  color: "#704f88"
  difficulty: 5
  type: sciencetank
  desc: Integrate theory, diagnostics, materials, and engineering into one evidence chain.
  defaultLeader: kistiakowsky
  budget: 96
  milestones:
  - name: Reconcile subsystem requirements
    cost: 18
    work: 13
    brief: Turn conflicting local goals into one set of system-level constraints.
  - name: Choose the decisive integration tests
    cost: 27
    work: 17
    brief: Spend scarce tests on evidence that can truly separate competing explanations.
  - name: Run the full instrumented non-nuclear trial
    cost: 33
    work: 22
    brief: Combine the system under controlled conditions and preserve multiple diagnostics.
  - name: Hold the final readiness review
    cost: 40
    work: 26
    brief: Judge the complete evidence chain, unresolved risks, and contingency plans.
  issues:
  - Every division has data, but the data do not answer the same system-level question.
  - The next proposed test is dramatic but cannot distinguish the two leading explanations.
  - A readiness claim depends on one measurement with no independent failure mode.

# The cast. `division` is what makes a person a valid person stop.
roster:
- id: oppenheimer
  name: J. Robert Oppenheimer
  role: Laboratory Director
  division: T
  color: "#1a2e4a"
  bio: |-
    <b>J. Robert Oppenheimer (1904–1967)</b> was an American theoretical physicist who taught at Berkeley and Caltech and became one of the central organizers of American theoretical physics before World War II.

    In 1942 Oppenheimer suggested the Los Alamos Ranch School area when General Leslie Groves was looking for an isolated laboratory site; Groves made the final site selection. Oppenheimer then became scientific director of Project Y. He organized a civilian laboratory under military authority, created regular colloquia so separate divisions could share enough information to solve coupled problems, and repeatedly had to decide when new evidence justified changing the program.

    After the war he chaired the Atomic Energy Commission's General Advisory Committee and became a prominent public voice on nuclear policy and international control. His 1954 security hearing removed his clearance; the U.S. government formally vacated that decision in 2022. His legacy combines major scientific leadership with continuing debate over the responsibilities of scientists who work on weapons.
  quiz:
  - q: What did Oppenheimer decide once plutonium turned out to fission spontaneously?
    a: To keep both the gun and implosion programmes, and then put implosion first
    wrong:
    - To stop implosion work altogether and concentrate the mesa on the gun design
    - To hold the two programmes at equal priority until Trinity settled it
    - To hand the choice to the Army rather than make it inside the laboratory
- id: groves
  name: Leslie R. Groves
  role: Commanding General, Manhattan Engineer District
  division: E
  color: "#3a3a2a"
  bio: |-
    <b>Leslie R. Groves (1896–1970)</b> was a United States Army Corps of Engineers officer who had just overseen construction of the Pentagon when he was assigned to the Manhattan Engineer District in September 1942. An engineer by training at West Point and MIT, he combined blunt administrative force with an understanding of how to shield scientists from bureaucratic delay. He controlled the project’s $2 billion budget and its industrial sites at Oak Ridge and Hanford.

    Groves selected the Los Alamos site after rejecting Jemez Springs, chose Oppenheimer as director over strong security objections, and enforced a brutal schedule that moved the laboratory from empty mesa to working town in five months via M. M. Sundt Construction. He negotiated with Vannevar Bush and James Conant for resources, secured the Sundt housing program, and mediated between military secrecy and scientific openness. He presented the Army-Navy E Award to Los Alamos at Fuller Lodge on 16 October 1945.

    After the war he oversaw the Bikini tests and briefly headed Army Special Weapons. He retired in 1948, wrote <i>Now It Can Be Told</i> (1962), and defended his management as necessary to end the war. Historians credit his Groves–Oppenheimer partnership as the organizational engine that made Los Alamos function despite competing scientific and military cultures.
  quiz:
  - q: What appointment did Groves make over strong objections from his own security people?
    a: Oppenheimer as director of the laboratory
    wrong:
    - A civilian contract rather than a military one for the whole site
    - Jemez Springs as the site, against his engineers’ advice
    - A scientific committee to control the project’s budget
- id: fermi
  name: Enrico Fermi
  role: Nobel 1938 — Chicago Pile & F Division
  division: T
  color: "#2c4a3a"
  bio: |-
    <b>Enrico Fermi (1901–1954)</b> was an Italian-American physicist awarded the 1938 Nobel Prize for work on neutron-induced radioactivity and slow neutrons. After leaving Fascist Italy for the United States, he led the team that achieved the first controlled self-sustaining nuclear chain reaction in Chicago Pile-1 on 2 December 1942.

    Fermi worked across the Manhattan Project at Chicago, Oak Ridge, Hanford, and Los Alamos. At Los Alamos he served as a senior scientific leader and was famous for rapid order-of-magnitude estimates that exposed whether a more elaborate calculation was plausible. At Trinity he made a rough blast estimate by dropping scraps of paper as the pressure wave arrived.

    After the war Fermi returned to the University of Chicago and worked in particle and nuclear physics. He died of stomach cancer in 1954. His name survives in fermions, Fermi statistics, the element fermium, Fermilab, and a style of estimation that treats physical scale as evidence.
  quiz:
  - q: How did Fermi estimate the Trinity yield where he stood?
    a: He dropped shredded paper and watched how far it blew
    wrong:
    - He timed the flash against the arrival of the sound at the bunker
    - He read a pressure gauge mounted on a post outside the bunker
    - He counted the seconds the cloud took to reach its full height
- id: bethe
  name: Hans Bethe
  role: Head, Theoretical Division T — Nobel 1967
  division: T
  color: "#4a3a6a"
  bio: |-
    <b>Hans Bethe (1906–2005)</b> was a German-American theoretical physicist who emigrated in 1933 after the Nazi dismissal of Jewish academics. Trained in Munich and Cambridge, he was already renowned for work on quantum electrodynamics and nuclear reactions. His clear, rigorous calculation style earned him the role of arbiter of what could be trusted on paper.

    As head of Los Alamos Theoretical Division (T) with about 40 theorists including Feynman, Peierls, Teller, and von Neumann, he oversaw calculations of critical mass, tamped implosion compression, and the opacity of bomb materials. He instituted weekly T Division talks and a practice of independent recalculation of every important number. He supervised the T-1 hydrodynamics and T-2 diffusion work that made Fat Man’s lens design credible, and he personally corrected several early overestimates of efficiency that could have misled engineering.

    After the war he returned to Cornell, won the 1967 Nobel Prize for the theory of stellar nucleosynthesis, and became a senior voice for arms control, test-ban verification, and eventually opposition to the Strategic Defense Initiative. He served as a Los Alamos consultant into his nineties and was regarded as the laboratory’s conscience on technical honesty.
  quiz:
  - q: What practice did Bethe institute in the Theoretical Division?
    a: Working the significant figures out again from scratch, separately
    wrong:
    - One approved calculation method that the whole division had to use
    - A rule that no number was used until an experiment had confirmed it
    - Review of every calculation by the Ordnance engineers who would build it
- id: bacher
  name: Robert Bacher
  role: Head, Physics (G) Division — Gadget
  division: P
  color: "#5a4a3a"
  bio: |-
    <b>Robert Bacher (1905–2004)</b> was an American experimental nuclear physicist trained at Michigan and Caltech, a student of Robert Millikan. Before Los Alamos he worked on cosmic rays and at Cornell, and he was one of the few physicists trusted by both Ernest Lawrence and James Conant for experimental judgment.

    At Los Alamos he first headed Experimental Physics and then G (Gadget) Division, responsible for the assembly and testing of the Trinity device and the physics of the pit. He organized the “cowpuncher” committees that forced interfaces between gun and implosion work, managed the RaLa (radio-lanthanum) implosion diagnostics, and ultimately oversaw the final assembly of the Gadget in the Trinity tower. Anecdotally, he personally drove the plutonium core by car from Los Alamos to the tower for security.

    After the war he became the first civilian member of the Atomic Energy Commission, later provost of Caltech and a founder of Los Alamos County government. His insistence on measurable, instrumented tests became a lasting Los Alamos culture of “no test without diagnostics.”
  quiz:
  - q: What rule of Los Alamos culture is credited to Bacher’s insistence?
    a: No test without diagnostics
    wrong:
    - No calculation without an independent recalculation
    - No assembly without a written procedure signed by two people
    - No design change accepted after a full-scale test
- id: kistiakowsky
  name: George Kistiakowsky
  role: Head, Explosives Division X
  division: X
  color: "#6a4a3a"
  bio: |-
    <b>George Kistiakowsky (1900–1982)</b> was a Ukrainian-born American physical chemist who earned his doctorate in Berlin and joined Harvard in 1930. An authority on thermochemistry and explosives, he had served in World War I and understood both laboratory chemistry and large-scale detonation.

    At Los Alamos he led X Division, which at its peak employed about 600 people casting and machining Composition B and Baratol lenses to tolerances of ±0.01 inch. His teams used flash X-ray, high-speed photography, and pin diagnostics to detect jets and asymmetries in implosion and iteratively corrected lens shapes. He personally bet Oppenheimer ten dollars that implosion would fail, later paying with champagne after Trinity succeeded.

    After the war he served as President Eisenhower’s science adviser, advocated for the Limited Test Ban Treaty, and became a prominent voice for arms control while continuing research on chemical kinetics at Harvard.
  quiz:
  - q: How did Kistiakowsky’s division find asymmetries in an implosion?
    a: By instrumenting the event — flash X-ray, photography and pin timing
    wrong:
    - By weighing and measuring each lens casting before and after it was fired
    - By recording the detonation from three widely separated sound stations
    - By calculating the wave shape beforehand and accepting the computed result
- id: parsons
  name: William “Deak” Parsons
  role: Ordnance Division O — Weaponeer, Little Boy
  division: E
  color: "#2f3a4a"
  bio: |-
    <b>William Sterling Parsons (1901–1953)</b> was a United States Naval Academy graduate and ordnance officer who pioneered radar proximity fuses before the war. His experience bridging laboratory science and fleet ordnance made him Groves’ choice to ensure weapons could actually be delivered.

    As head of Ordnance (O/E) Division at Los Alamos he was responsible for gun assembly, fuzing, ballistics, and the logistics of moving weapons to Tinian. He designed the safety/arming architecture for Little Boy and, as weaponeer aboard the Enola Gay on 6 August 1945, armed the weapon in flight — a safety decision he personally insisted upon. He also coordinated the engineering of the Fat Man tail and release mechanisms.

    After the war he continued as a rear admiral in naval nuclear matters and participated in Operation Crossroads at Bikini. He died suddenly of a heart attack at the Pentagon in 1953 while still on active duty. Yosemite’s Parsons Memorial Lodge honors him.
  quiz:
  - q: What safety decision did Parsons insist on personally?
    a: Arming the weapon in flight rather than before the aircraft took off
    wrong:
    - Carrying a second weaponeer in case the first was incapacitated in flight
    - Testing the fuzing system over open water before the mission was flown
    - Flying the assembly and its initiator out on separate aircraft
- id: szilard
  name: Leo Szilard
  role: Chain reaction patent; Einstein letter; dissent
  division: T
  color: "#3a2e2e"
  bio: |-
    <b>Leo Szilard (1898–1964)</b> was a Hungarian-American physicist who conceived the neutron-driven chain-reaction idea in the 1930s and, with Eugene Wigner, helped draft the 1939 letter that Albert Einstein sent to President Roosevelt warning about the possibility of German atomic-weapons work.

    During the Manhattan Project Szilard worked mainly at the Metallurgical Laboratory in Chicago, where he often clashed with General Groves over secrecy and scientific communication. In 1945 he helped press the moral and political debate over combat use. The petition associated with his name gathered roughly seventy signatures from Manhattan Project scientists and urged the President to consider the moral consequences before using the bomb against Japan.

    After the war Szilard moved increasingly into biology and became an important voice for arms control and international scientific responsibility. He appears in this game as a reminder that helping create a technical possibility does not settle what ought to be done with it.
  quiz:
  - q: What did Szilard do in July 1945, having helped start the project in 1939?
    a: Circulated a petition of 155 scientists urging a warning first
    wrong:
    - Resigned from the project and asked for his chain-reaction patent back
    - Asked Einstein to send a second letter to the President, as in 1939
    - Published the Chicago pile results in order to force a public debate
- id: lawrence
  name: Ernest Lawrence
  role: Berkeley Rad Lab — Calutrons
  division: CM
  color: "#3a4a2e"
  bio: |-
    <b>Ernest Lawrence (1901–1958)</b> was an American physicist who invented the cyclotron at Berkeley in 1930, for which he received the 1939 Nobel Prize. His Radiation Laboratory pioneered the “big science” model of large accelerator teams, graduate students, and industrial-scale magnets.

    During the war his laboratory was converted to electromagnetic separation of uranium isotopes. His 184-inch magnet design became the calutrons (California University Cyclotrons) built at Oak Ridge’s Y-12 plant, which enriched the uranium used in Little Boy. He recruited Oppenheimer to Berkeley in 1929, and the Berkeley-to-Los Alamos pipeline delivered much of the project’s talent and isotope chemistry.

    After the war he continued to expand Berkeley’s accelerators (Bevatron) and advocated for continued nuclear weapons development, including the hydrogen bomb. His brother John Lawrence, a physician, pioneered radiation biology and medical isotope work. The Lawrence Berkeley and Lawrence Livermore laboratories are named for him.
  quiz:
  - q: What was Lawrence’s Berkeley laboratory turned to during the war?
    a: Electromagnetic separation of uranium isotopes, scaled up as the Y-12 calutrons
    wrong:
    - Gaseous diffusion of uranium, scaled up as the K-25 plant at Oak Ridge
    - Production of plutonium in the water-cooled reactors at Hanford
    - Machining and proof-testing the explosive components at Los Alamos
- id: seaborg
  name: Glenn Seaborg
  role: Chemistry — plutonium isolation
  division: CM
  color: "#2e3a4a"
  bio: |-
    <b>Glenn Seaborg (1912–1999)</b> was an American chemist at Berkeley who, as a graduate student with Edwin McMillan, co-discovered plutonium in 1941. His expertise in actinide chemistry made him central to the question of whether plutonium could be produced and isolated in usable quantities.

    At the Metallurgical Laboratory in Chicago he led the chemical team that developed the bismuth-phosphate precipitation process that first isolated microgram quantities of plutonium from irradiated uranium. That chemistry was scaled at scale to the massive Queen Mary separation canyons at Hanford. He advised Los Alamos on plutonium metallurgy, in particular the stabilization of the δ-phase for pit fabrication.

    He received the 1951 Nobel Prize in Chemistry for the discovery and chemistry of transuranium elements, later served as UC Berkeley chancellor and chair of the Atomic Energy Commission (1961-71), and championed science education. Element 106, seaborgium, is named for him.
  quiz:
  - q: What did the bismuth-phosphate process Seaborg’s team developed actually do?
    a: Separated the first microgram quantities of plutonium out of irradiated uranium
    wrong:
    - Separated uranium isotopes from each other by their small difference in mass
    - Stabilised plutonium in its δ phase so that a pit could be machined from it
    - Purified the graphite that moderated the neutrons in the Chicago pile
- id: chadwick
  name: James Chadwick
  role: British Mission head — neutron
  division: P
  color: "#4a3a4a"
  bio: |-
    <b>James Chadwick (1891–1974)</b> was an English physicist who discovered the neutron in 1932 at the Cavendish Laboratory, work for which he received the 1935 Nobel Prize. As a protégé of Rutherford, he was the leading authority on neutron properties at the start of the war.

    He headed the 20-member British Mission to Los Alamos from 1943 to 1945, which included Rudolf Peierls, Otto Frisch, William Penney, and Klaus Fuchs. The Mission settled critical-mass calculations, tamp efficiency, and the hydrodynamics of implosion, providing independent checks that convinced Groves to back implosion. Chadwick’s authority in British and American councils made the technical Anglo-American alliance function.

    After the war he returned to Cambridge as Master of Gonville and Caius College and advised the British atomic energy program, though he was excluded from its weapons decisions. He was knighted in 1945 and remains a central figure in the institutional history of nuclear physics.
  quiz:
  - q: What did the British Mission contribute that changed Groves’ mind?
    a: Independent checks on critical mass, tamper efficiency and implosion hydrodynamics
    wrong:
    - The casting and machining of the explosive lenses that the design needed
    - The design of the gaseous-diffusion plant that enriched the uranium
    - The neutron cross-section measurements that set the lattice of the pile
- id: ulm
  name: Stanisław Ulam
  role: Mathematics — Monte Carlo & staging
  division: X
  color: "#3a3a5a"
  bio: |-
    <b>Stanisław Ulam (1909–1984)</b> was a Polish-American mathematician who joined Los Alamos during World War II after John von Neumann recruited him into the project. His wartime work centered on mathematical problems in hydrodynamics, branching processes, and the behavior of complex physical systems.

    The Monte Carlo method belongs mainly to the immediate postwar Los Alamos period, not to the wartime Project Y story. In 1946 Ulam proposed reviving statistical sampling as a practical computational method; he discussed the idea with von Neumann, and Nicholas Metropolis later helped develop and name the method. Early electronic computers made the approach useful for problems that were otherwise too complicated to solve directly.

    Ulam remained an influential Los Alamos mathematician after the war and later contributed to many areas of applied mathematics and physics. In this game his importance is mathematical judgment: when a deterministic calculation becomes unwieldy, ask what can be learned by sampling many possible histories instead.
  quiz:
  - q: What is the Monte Carlo method that Ulam and Metropolis invented?
    a: Simulating neutron histories by random sampling, on a computer
    wrong:
    - Averaging many repeated experimental runs to remove random error
    - Solving the hydrodynamic equations exactly, one shell at a time
    - Estimating a result from the spread of independent hand calculations
- id: vonneumann
  name: John von Neumann
  role: Mathematics & computing — implosion
  division: X
  color: "#2a2a4a"
  bio: |-
    <b>John von Neumann (1903–1957)</b> was a Hungarian-American mathematician whose work ranged from set theory and quantum mechanics to game theory, numerical methods, and computer architecture.

    During the Manhattan Project he consulted at Los Alamos on shock-wave mathematics, hydrodynamics, and numerical calculation. His value to the laboratory was not one isolated formula but the ability to turn difficult physical intuition into a mathematical model that could be compared with experiment. He also encouraged the use of punched-card and electronic computing for problems too large for hand calculation.

    After the war von Neumann helped shape modern stored-program computing and continued to advise the U.S. government on science and technology. The educational point here is model discipline: a powerful calculation is useful only when its assumptions and comparison with data remain visible.
  quiz:
  - q: What did von Neumann’s mathematics of shaped charges accomplish?
    a: Turning a detonation spreading outward into a shock converging inward
    wrong:
    - Making the detonation reach every point of the surface at full pressure
    - Slowing the detonation so that the assembly had time to compress
    - Removing the need for more than one detonation point
- id: meitner
  name: Lise Meitner
  role: Fission discovery 1938 — refused bomb work
  division: T
  color: "#5a3a3a"
  bio: |-
    <b>Lise Meitner (1878–1968)</b> was an Austrian-Swedish physicist and one of the central figures in the discovery of nuclear fission. After fleeing Nazi Germany in 1938, she continued corresponding with Otto Hahn and Fritz Strassmann. Their chemical experiments produced the evidence that uranium had formed much lighter products; Meitner and her nephew Otto Frisch supplied the physical interpretation that the nucleus had split and introduced the term <i>fission</i>.

    In 1942 Meitner was invited to join the Manhattan Project and refused, saying she would have nothing to do with a bomb. She therefore was not a Project Y scientist; her appearance in this book is historical context for the physics that made Project Y possible.

    Otto Hahn received the 1944 Nobel Prize in Chemistry without Meitner or Frisch, an omission widely criticized by historians of science. Meitner later received the Enrico Fermi Award with Hahn and Strassmann in 1966.
  quiz:
  - q: What did Meitner do when the Manhattan Project invited her personally?
    a: She refused, and never worked on the weapon programme
    wrong:
    - Agreed to consult on the theory only, and only from Stockholm
    - Accepted, and was then refused entry to the United States
    - Asked to be put on reactor physics rather than on weapons work
- id: woods
  name: Leona Woods (Marshall Libby)
  role: Youngest CP-1, 23 — detectors
  division: P
  color: "#4a4a6a"
  bio: |-
    <b>Leona Woods Marshall Libby (1919–1986)</b> was the youngest and only woman on the Chicago Pile-1 team. She helped build and calibrate neutron detectors used to follow the pile as it reached the first controlled self-sustaining chain reaction in December 1942.

    Woods was not stationed at wartime Los Alamos. After Chicago and Argonne she moved to Hanford, where she worked on the production reactors and was present when B Reactor suffered its unexpected xenon-135 poisoning problem. She and other reactor physicists helped diagnose the strong neutron absorption responsible for the shutdown.

    Her work belongs in this game as part of the wider Manhattan Project evidence network: measurements made at Chicago and Hanford changed what Los Alamos believed about reactor physics and plutonium production even when the people who made those measurements were hundreds of miles away.
  quiz:
  - q: What was Leona Woods responsible for under Stagg Field on 2 December 1942?
    a: The boron-trifluoride counters that showed the pile had gone critical
    wrong:
    - The control rods, and withdrawing them on Fermi’s word
    - The graphite lattice, and the purity of the blocks it was built from
    - The cadmium sheets that would have shut the pile down in an emergency
- id: wu
  name: Chien-Shiung Wu
  role: Columbia — fission, xenon, parity
  division: P
  color: "#3a4a5a"
  bio: |-
    <b>Chien-Shiung Wu (1912–1997)</b> was a Chinese-American experimental physicist who worked on the Manhattan Project at Columbia University's Substitute Alloy Materials Laboratory, not at Los Alamos. Her wartime work included radiation detectors and research connected with gaseous-diffusion uranium separation.

    Wu's earlier nuclear measurements also helped the project understand xenon-135, whose enormous neutron absorption was implicated when Hanford's B Reactor unexpectedly lost power in 1944. Her experimental reputation rested on careful detector physics and on treating an anomalous result as a physical question rather than an instrument embarrassment.

    After the war Wu became one of the leading experimental physicists of the twentieth century. Her 1956 beta-decay experiment demonstrated parity violation in the weak interaction. In this game she represents the fact that Project Y depended on evidence produced well beyond the Los Alamos fence.
  quiz:
  - q: What had shut down the Hanford B Reactor, and what did Wu’s earlier work explain?
    a: Xenon-135 poisoning — her 1940 work on how strongly xenon absorbs neutrons
    wrong:
    - Corrosion in the cooling channels — her earlier work on metals in hot water
    - Graphite too impure to moderate — her work on the purity a pile demands
    - Fuel jammed by thermal expansion — her work on materials under heat
- id: mayer
  name: Maria Goeppert Mayer
  role: Teller group — opacity, Nobel 1963
  division: T
  color: "#4a5a6a"
  bio: |-
    <b>Maria Goeppert Mayer (1906–1972)</b> was a German-American theoretical physicist. During most of the Manhattan Project she worked at Columbia University's SAM Laboratory on isotope-separation and opacity problems under Harold Urey and in collaboration with Edward Teller's network.

    In 1945 she spent time at Los Alamos working with Teller's group on high-temperature opacity calculations. That work asked how radiation moves through very hot matter, a difficult inference problem in which the model mattered as much as the measured inputs.

    After the war Goeppert Mayer developed the nuclear shell model, explaining the 'magic numbers' of especially stable nuclei. She shared the 1963 Nobel Prize in Physics for that work. Her wartime story is also a reminder that major scientific contributions were often made from marginal or temporary academic appointments.
  quiz:
  - q: What was Maria Goeppert Mayer calculating for Teller’s group?
    a: Opacity — how photons diffuse through matter at very high temperature
    wrong:
    - Critical mass, and how much a tamper around the core changes it
    - The shell structure of the nucleus and its magic numbers of nucleons
    - The neutron cross sections that the pile calculations were built on
- id: fuchs
  name: Klaus Fuchs
  role: T Division — spy
  division: T
  color: "#3a3a3a"
  bio: |-
    <b>Klaus Fuchs (1911–1988)</b> was a German-born British theoretical physicist who joined the British Mission and worked in Los Alamos's theoretical program. Colleagues regarded him as an able calculator and gave him access to highly classified information.

    Beginning during the war, Fuchs secretly passed substantial Manhattan Project information to the Soviet Union through couriers. Decrypted intelligence and investigation after the war led to his confession in 1950. He was convicted in Britain of violating the Official Secrets Act, served nine years in prison, and later moved to East Germany.

    His case matters here as a history-of-science problem about secrecy, trust, and compartmentalization. The game does not reproduce the technical material he transmitted; the relevant fact is that classified scientific knowledge crossed the security boundary through a trusted insider.
  quiz:
  - q: What did the Fuchs case leave behind at Los Alamos?
    a: The Q clearance system, tighter compartmentalisation and a lasting distrust
    wrong:
    - The expulsion of the whole British Mission from the laboratory
    - The transfer of the theoretical work to Britain under Peierls
    - The end of the weekly colloquium where everything had been discussed
- id: hall
  name: Theodore Hall
  role: Youngest physicist, 19 — spy
  division: P
  color: "#3a2e2e"
  bio: |-
    <b>Theodore Hall (1925–1999)</b> was an American physicist recruited to Los Alamos in 1944 at age nineteen, making him one of the youngest physicists on the project.

    Hall secretly volunteered information about the Manhattan Project to the Soviet Union, motivated by his belief that a U.S. nuclear monopoly would be dangerous. U.S. counterintelligence later identified him through the Venona decrypts, but he was never prosecuted, in part because using the highly secret Venona material in court would have exposed intelligence capabilities.

    After the war Hall became a biophysicist. His case, like Fuchs's, is included here as evidence that a scientific organization can be technically integrated while remaining institutionally vulnerable in ways its technical measurements cannot detect.
  quiz:
  - q: How did Hall’s case end, unlike Fuchs’s?
    a: He was identified through Venona and never prosecuted
    wrong:
    - He confessed in 1950 and served 9 years in an English prison
    - He was never identified by any investigation, then or afterwards
    - He was tried alongside the Rosenbergs in 1951 and acquitted
- id: greenglass
  name: David Greenglass
  role: Machinist — spy
  division: E
  color: "#4a3a3a"
  bio: |-
    <b>David Greenglass (1922–2014)</b> was a U.S. Army machinist assigned to Los Alamos's Special Engineer Detachment. His work in project machine shops gave him access to classified manufacturing information.

    Greenglass passed Manhattan Project information to a Soviet espionage network connected with Julius Rosenberg. After his arrest he cooperated with prosecutors and testified at the Rosenberg trial; decades later he acknowledged that parts of his testimony had minimized his wife Ruth's role and intensified controversy over the case.

    For this game the important point is institutional rather than technical: classified information can leave through ordinary access paths, and later testimony about espionage can itself become an evidence problem with incentives, memory, and disputed reliability.
  quiz:
  - q: What gave a machinist access to the implosion design?
    a: He machined the precision molds for the lenses, so he saw their geometry
    wrong:
    - He had the run of the Theoretical Division’s calculation reports
    - He assembled the core itself and drove it out to the Trinity tower
    - He photographed the drawings held in the ordnance division’s vault
- id: hinton
  name: Joan Hinton
  role: Experimental, 22 — youngest woman
  division: P
  color: "#5a4a4a"
  bio: |-
    <b>Joan Hinton (1921–2010)</b> was an American physicist who earned her degree at Bennington and Wisconsin, working under Elmer Hutchison. She joined the Metallurgical Laboratory in Chicago, where she worked on Enrico Fermi’s pile and on the gaseous diffusion problem, and then was invited to Los Alamos at age 22 as one of the youngest women in Experimental Physics.

    At Los Alamos she worked on reactor construction and on the Trinity cloud-tracking team, calibrating detectors that measured the radioactive plume. She witnessed the July 1945 test and was deeply unsettled by the August uses. She refused the post-war secrecy oath required for Bikini Atoll tests and left Los Alamos in 1946, disillusioned with weapons work.

    After the war she became a political activist, moving to Yan’an, China in 1948 with her husband Sid Engst to work on dairy farming and agriculture through the Great Leap Forward and Cultural Revolution. She lived on a farm near Beijing for the rest of her life, remaining a committed socialist critic of American nuclear policy.
  quiz:
  - q: Why did Joan Hinton leave Los Alamos in 1946?
    a: She refused the secrecy oath required to work on the Bikini tests
    wrong:
    - She was dismissed once the Trinity cloud-tracking work had ended
    - She left in order to finish the doctorate the war had interrupted
    - Her clearance was withdrawn over her politics after the war
- id: hornig
  name: Lilli Hornig
  role: Chemist — lenses & plutonium
  division: CM
  color: "#6a4a6a"
  bio: |-
    <b>Lilli Hornig (1921–2017)</b> was a Czech-American chemist who came to Los Alamos in 1944 after her husband Donald Hornig was recruited by George Kistiakowsky.

    She first worked on fundamental plutonium chemistry, including the solubility of plutonium compounds. After concerns were raised about possible reproductive hazards from plutonium exposure, Hornig and another woman were removed from that work; she objected to the unequal treatment and transferred to the explosives program. She later recalled both the scientific excitement and the sexism of the wartime laboratory.

    Hornig signed a Los Alamos petition urging a demonstration of the atomic bomb rather than immediate use on a populated target. After the war she completed her doctorate and became a major advocate for women in science and higher education.
  quiz:
  - q: What assignment did Hornig say she was given because she was a woman?
    a: Establishing that the inhalation hazard from plutonium was low
    wrong:
    - Typing and filing the specifications for the explosive lenses
    - Running the chemistry stockroom rather than a laboratory bench
    - Escorting visiting families around the technical area
- id: graves
  name: Elizabeth “Diz” Graves
  role: Critical assemblies — physicist
  division: P
  color: "#5a3a4a"
  bio: |-
    <b>Elizabeth 'Diz' Riddle Graves (1916–1972)</b> was an American experimental physicist with a PhD from the University of Chicago. She and her husband Alvin Graves joined Los Alamos in 1943.

    At Los Alamos she carried out neutron-physics experiments and was one of the relatively few people skilled at operating the Cockcroft-Walton accelerator used for measurements. Historical accounts also credit her with work on neutron-reflector questions. During Trinity, while pregnant, she and Alvin monitored the test from Carrizozo, well away from the site.

    Graves was not a Black woman scientist; that claim in the earlier draft was an error. Her real story is still remarkable: she was one of the women doing front-line experimental nuclear physics at Los Alamos while navigating a laboratory culture built overwhelmingly around men.
  quiz:
  - q: What did Elizabeth Graves measure, and what did it let the laboratory avoid?
    a: Neutron multiplication in subcritical assemblies — how near criticality a pit was
    wrong:
    - The energy of the cyclotron beam — so that the accelerator could be calibrated
    - The purity of plutonium metal — so that a pit could be cast without voids
    - The timing of the detonators — so that the lenses could be fired together
- id: bradbury
  name: Norris Bradbury
  role: Trinity assembly → 2nd director
  division: E
  color: "#2e4a3a"
  bio: |-
    <b>Norris Bradbury (1909–1997)</b> was an American physicist who earned his PhD at Berkeley under Ernest Lawrence and served as a naval reserve officer. Recruited to Los Alamos in 1944, he was noted for meticulous experimental technique and calm under pressure.

    He led the Trinity assembly team that assembled the Gadget in the 100-foot tower at Jornada del Muerto and checked the final high-explosive assembly in the New Mexico summer heat. His careful procedures were credited with avoiding a pre-test accident. In the fall of 1945 Groves and Oppenheimer selected him to succeed Oppenheimer as laboratory director.

    As director from 1945 to 1970 he transformed the wartime camp into the Los Alamos National Laboratory, building the permanent technical areas (including TA-3), managing the transition to Castle and Bravo thermonuclear tests, and establishing the laboratory’s post-war culture of large-scale computing and stockpile stewardship. He remained low-key, preferring to keep the laboratory small and focused.
  quiz:
  - q: What was Bradbury’s job at Trinity, before he became director?
    a: He led the assembly team and checked the final explosive assembly in the tower
    wrong:
    - He ran the diagnostic instrumentation laid out on the desert around the tower
    - He commanded the base camp and the evacuation arrangements for the test
    - He calculated the expected yield against which the test would be judged
- id: mckibbin
  name: Dorothy McKibbin
  role: 109 East Palace — Gatekeeper
  division: E
  color: "#6a5a3a"
  bio: |-
    <b>Dorothy McKibbin (1897–1985)</b> was a Santa Fe widow and former Chandler’s shop employee who was hired in March 1943 to run the Los Alamos Project’s Santa Fe Hill Office at 109 East Palace Avenue. She had no scientific training but became the human face of the secret city.

    Every arrival to Los Alamos — some 2,000 scientists, families, and workers — first reported to her office, where she issued passes, arranged housing assignments from Bathtub Row to hutment, found dentists and babysitters, and calmed terrified wives who had not been told where they were going. She memorized the classified directory and never disclosed names or locations. Oppenheimer considered her indispensable.

    After the war she remained at 109 East Palace as a Los Alamos institution, known to all as “Mrs. McKibbin.” An oral-history subject and friend to many scientists, her house on Old Santa Fe Trail is now part of the Manhattan Project National Historical Park. The phrase “Everyone met Dorothy first” is still quoted by survivors.
  quiz:
  - q: What happened at 109 East Palace Avenue in Santa Fe?
    a: Every arrival reported there first, and left with a pass and somewhere to live
    wrong:
    - The project’s mail was censored there before it went down the hill
    - It was the Army office that vetted scientists before they were hired
    - It held the classified directory the whole laboratory worked from
- id: kitty
  name: Katherine “Kitty” Oppenheimer
  role: Botanist — community voice
  division: CM
  color: "#6a5a6a"
  bio: |-
    <b>Katherine “Kitty” Oppenheimer (1910–1972)</b> was an American botanist and biologist who had studied at the University of Pittsburgh and Berkeley, where she met Robert Oppenheimer. Well-educated and outspoken, she arrived on the mesa with their young children Peter and Katherine (Toni) and lived at Bathtub Row house V-17.

    She became an informal leader on community issues: protesting erratic housing assignments, commissary shortages, and the harassment of wives by military security. She organized the Los Alamos community garden, censored mail as part of security duties, and hosted salon-like discussions that mixed science, politics, and personal strain. The isolation, surveillance, and drinking culture weighed heavily on her.

    After the war the family moved to Princeton’s Institute for Advanced Study; her later years were marked by depression and alcoholism and periodic separations. She died of an embolism in Panama in 1972 while traveling. Recent biographies have re-evaluated her as more than “the director’s wife” — as a scientifically trained interlocutor whose critiques of security reflected broader tensions on the hill.
  quiz:
  - q: What did Kitty Oppenheimer take on beyond her own household on the mesa?
    a: Community grievances — housing, the commissary, how security treated the wives
    wrong:
    - The mesa’s school, which she ran through the first two years of the site
    - Botanical survey work along the canyons for the Army’s engineers
    - The hospital laboratory, where her scientific training was put to use

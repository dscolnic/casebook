    title: Reaction cross sections
    scene: Bethe needs a reaction rate before the afternoon seminar and hands you a cross section written in barns. 
      Nearly every number this laboratory argues about is built out of the multiplication that follows.
    guide: >-
      Four numbers, and two of them are areas thirty powers of ten apart. Ask of
      each whether it is a density, an area, or a bare one. Check the units before
      choosing, because a cross section is an area. One parameter comes out of the
      first step and then does all three jobs.
    background:
    - >-
      Why an estimate rather than a calculation. Every quantity on this board is
      already measured or stated, so nothing here has to be derived. What is being
      tested is whether you can pick the quantities the relationship actually needs,
      and whether the size of the answer looks right once they are in place.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the
      relationship it is going into. Reading the label is how a unit mismatch, or a
      quantity belonging to a different part of the problem, is caught before it is
      placed — which is the habit this format exists to build.
    takesAsRead:
    - Fission, neutron multiplication and chain reactions
    assumes:
    - a cross section is expressed as an area
    takeaway: Number density turns a microscopic cross section into an interaction probability per length, which sets 
      both mean free path and exponential attenuation.
    format: BALLPARK
    answerText: Σ ≈ 0.01 cm^-1, the mean free path is about 100 cm, and after 1 mean free path I/I₀ = e^-1 ≈ 0.37.
    why: "A microscopic cross section is an interaction probability written as an area. Multiply it by the number of targets
      per volume and you get the macroscopic cross section Σ, an inverse length. Its inverse is the mean free path. The same
      Σ also controls attenuation: I/I₀ = e⁻Σx. After 1 mean free path, x = 1/Σ, so the exponent is minus 1 and about 37%
      of an uncollided beam remains. One parameter connects all three ideas."
    call: Interpret a cross section
    reason: Today's count gap means little until you turn interaction chance into the scale the experiment should produce.
    setup: A solid has number density n = 10^22 cm^-3, and the cross section is 1 barn = 10^-24 cm^2.
    estimate:
      prompt: A solid has number density 10^22 cm^-3 and a neutron cross section of 1 barn = 10^-24 cm^2. Estimate Σ, 
        the mean free path, and the uncollided fraction left after one mean free path.
      question: Choose the number density and cross section, then use the resulting Σ in both 1/Σ and e^-Σx.
      labels:
      - "1"
      - 10²² cm⁻³
      - 10⁻²⁴ cm²
      - 10⁶ cm²
      values: [1, 1e+22, 1e-24, 1000000]
      slots: 3
      template: λ ≈ {0} ÷ ({1} × {2})
      formula: a/(b*c)
      correct: [0, 1, 2]
      target: 100
      tolerance: 15
      units: cm
      solution: Σ = 10²²×10⁻²⁴ = 10⁻² cm⁻¹. mfp = 1/Σ = 100 cm. At x = 100 cm, I/I₀ = e⁻¹ ≈ 0.37.
      explanation: Here Σ is 0.01 cm⁻¹, so the mean free path is about 100 cm. Setting x equal to that mean free path 
        makes Σx = 1, leaving e⁻¹ ≈ 0.37 of the uncollided beam.
      givens:
      - Sigma = n sigma
      - Mean free path = 1/Sigma
      relationship: The macroscopic cross section is Σ = nσ, the number density times the microscopic cross section; 
        mean free path = 1/Σ; attenuation is I/I₀ = e^-Σx.

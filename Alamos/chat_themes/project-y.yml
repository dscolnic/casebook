- group: E
  task: Estimate the worst-case stack.
  title: Tooling, jigs, and tolerance stack-up
  setup: Use an invented three-interface fixture; no weapon geometry is represented.
  scene: >-
    A new fixture in the machine shop stacks three independently machined interfaces, each
    held to plus or minus 0.15 mm. Greenglass, the machinist who cut them, has been asked
    what the fixture can promise about the finished assembly.
  guide: >-
    Four numbers, in two pairs, and only one of each belongs here. Ask of each
    whether it is a per-interface tolerance or a count of interfaces. And note
    what the answer is for. A fixture has to control the assembly-level stack, not
    each part on its own.
  background:
  - >-
    Why an estimate rather than a calculation. Every quantity on this board is
    already measured or stated, so nothing here has to be derived. What is being
    tested is whether you can pick the quantities the relationship actually needs,
    and whether the size of the answer looks right once they are in place.
  - >-
    Why the tiles carry labels. A bare number cannot be checked against the
    relationship it is going into. Reading the label is how a unit mismatch, or a
    quantity belonging to a different part of the problem, is caught before it is
    placed — which is the habit this format exists to build.
  takeaway: Precision comes from the full datum and tooling system.
  format: BALLPARK
  why: A fixture must control the assembly-level stack, not merely each individual component.
  estimate:
    prompt: A fixture stacks 3 independently machined interfaces, each held to ±0.15 mm, and worst-case absolute limits 
      add. Estimate the worst-case stack.
    question: Choose the per-interface tolerance and the number of interfaces.
    labels:
    - 0.15 mm/interface
    - 3 interfaces
    - 0.015 mm/interface
    - 12 interfaces
    values: [0.15, 3, 0.015, 12]
    slots: 2
    template: worst-case stack ≈ {0} × {1}
    formula: a*b
    correct: [0, 1]
    target: 0.45
    tolerance: 0.035
    units: mm
    solution: 0.15 mm × 3 ≈ 0.45 mm.
    explanation: Worst-case tolerance stack-up adds aligned limits directly, unlike statistical root-sum-square 
      combination.
    givens:
    - 3 independent worst-case placement limits are each +/-0.15 mm
    - Worst-case absolute limits add
    - Statistical root-sum-square may be smaller but requires justified independence
    relationship: Worst-case stack-up = tolerance per interface × the number of interfaces.
  answerText: Worst case = +/-0.45 mm.
- group: E
  task: Match each situation to the best action, control, document, or interpretation. Each option is used once.
  title: Inspection and lot traceability
  setup: Match each record to the question it answers.
  scene: >-
    A test result came back good yesterday and nobody can say which parts were in the
    unit. Lilli Hornig, the chemist on the lens castings, has four questions of that kind
    and four kinds of record in the cabinet behind her.
  guide: >-
    Four questions and four records. Pair them by asking what each record follows.
    A part from raw stock? A measurement against a drawing? One particular unit
    that was fired? Or something that failed? Without these, a success cannot be
    repeated and a failure cannot be bounded.
  background:
  - >-
    Why this is a matching board and not four separate questions. Responses on
    boards like this are written to be plausible for more than one situation, so
    choosing them one at a time lets a nearly-right answer through unexamined.
    Having to place all of them forces the comparison — not "is this reasonable
    here", but "is it more right here than there".
  - >-
    How to use the one-each rule. Because the responses are a set to be
    distributed rather than a list to be sampled, every join you make constrains
    the rest. Settling the two you are confident of can leave the remaining pair
    decided by elimination. Where it does not, two responses are still competing
    for one situation, and that is exactly the distinction the stop is testing.
  - >-
    Why you cannot be wrong about exactly one. With every response used once,
    three correct joins leave the fourth with only one place to go. Any error
    therefore involves at least two joins. That is worth remembering when the last
    pair looks forced: the fault is usually not in the join you are struggling
    with, but in one you made early and stopped questioning.
  takeaway: The historical record of a complex device is itself an engineering instrument.
  format: PROTOCOL
  why: Without traceability, a successful test cannot be reproduced and a failure cannot be bounded.
  columns:
  - What you want to know
  - Which record tells you
  scenarios:
  - Which production batch supplied this component?
  - Was the approved geometry verified before assembly?
  - Which exact configuration produced the test result?
  - What happened to a component that failed inspection?
  choices:
  - The lot traveler, which follows a part from raw stock and carries a stamp for every processing step it saw.
  - The inspection report, which lists what was actually measured against the drawing and by whom.
  - The as-built record, which names the individual parts and drawing revisions that went into the unit that was fired.
  - The nonconformance and disposition record, which says on whose authority a rejected part was scrapped, reworked, or 
    used as it stood.
  mapping: [0, 1, 2, 3]
  answerText: Which production batch supplied this component? -> The lot traveler, which follows a part from raw stock 
    and carries a stamp for every processing step it saw; Was the approved geometry verified before assembly? -> The 
    inspection report, which lists what was actually measured against the drawing and by whom; Which exact configuration
    produced the test result? -> The as-built record, which names the individual parts and drawing revisions that went 
    into the unit that was fired; What happened to a component that failed inspection? -> The nonconformance and 
    disposition record, which says on whose authority a rejected part was scrapped, reworked, or used as it stood
- group: E
  task: Allocate 100 research credits across the 3 proposals. You may hold credits in reserve, but explain the decision 
    criterion.
  title: Environmental qualification of Fat Man subsystems
  setup: The qualification team must distribute its next 100 credits.
  scene: >-
    Subsystems that have only run in a quiet laboratory are due to go by ship, truck and
    aircraft to Tinian. Groves, the commanding general, wants them declared fit for that
    journey, and the qualification team has one month of credit to spend.
  guide: >-
    The conditions this hardware has to survive are transport vibration,
    temperature swings, humidity and aircraft operation, and in service they
    arrive together. One full-system trial exercises all of them at once and tells
    you only whether it passed. A staged programme finds cheap failures at
    component level first, and spends the integrated test on the coupled effects
    that appear late. Testing at room temperature costs least and leaves the
    temperature and humidity terms untried. The mission is short; the storage and
    transit before it are not.
  rules: >-
    Spread the hundred points across the 3 proposals. At least 80 of them have to
    be committed, because a panel that funds almost nothing has not decided
    anything. Your largest single allocation must be 35 or more, and it has to
    land on what the evidence supports most. Keep the total sitting on proposals
    the evidence does not support under fifteen. And a proposal it does support
    should not be left under twenty.
  background:
  - >-
    Why the whole spread is graded. Funding is not a vote for one idea. A
    portfolio says what you think is likely, what is worth hedging against, and
    what is not worth pursuing at all — and the last two are where most of the
    information is. Backing the right proposal while quietly funding a bad one is
    a worse answer than it looks. That is why the small numbers count as much as
    the big one.
  - >-
    What the three numbers are for. Thirty-five is what makes a lead a lead: below
    it you have hedged rather than chosen. Fifteen is the most that can sit on
    unsupported work before it stops being a rounding error. Past that it is a
    second opinion nobody argued for. Twenty is the floor under a line of work you
    have already called strong, because funding it too thin to finish spends the
    money and buys nothing.
  - >-
    Why there is a floor on the total. Points held back are not caution; they are
    a decision not to decide, taken with somebody else's money and somebody else's
    deadline. The floor is what forces the panel to say something.
  takeaway: Qualification is a ladder of evidence, not one final ordeal.
  format: SCIENCETANK
  why: A staged campaign finds inexpensive failures early while preserving integrated tests for coupled effects.
  proposals:
  - label: A
    text: Spend all credits on one dramatic full-system trial.
  - label: B
    text: "Build a staged program: component screening, subsystem environments, instrumented carriage, then a limited integrated
      test."
  - label: C
    text: Test only at room temperature because the mission duration is short.
  recommended:
    B: 85
    A: 10
  answerText: "Recommended: 85 to B, 10 to A only after prerequisites, 5 in reserve."
- group: E
  scene: >-
    The readiness board wants one reliability figure for a diagnostic chain. Four required subsystems must all work for the
    result to be recorded.
  guide: >-
    Four numbers, in two pairs, and only one of each belongs here. Ask of each
    whether it is a per-link reliability or a number of links. And note what the
    arithmetic does. Each required element is another chance to fail, even when
    every one looks reliable on its own.
  background:
  - >-
    Why an estimate rather than a calculation. Every quantity on this board is
    already measured or stated, so nothing here has to be derived. What is being
    tested is whether you can pick the quantities the relationship actually needs,
    and whether the size of the answer looks right once they are in place.
  - >-
    Why the tiles carry labels. A bare number cannot be checked against the
    relationship it is going into. Reading the label is how a unit mismatch, or a
    quantity belonging to a different part of the problem, is caught before it is
    placed — which is the habit this format exists to build.
  task: Estimate total reliability.
  title: Reliability of a required series chain
  setup: A generic experiment has 4 required independent subsystems, each with reliability 0.98 for one run.
  takeaway: System reliability cannot be inferred from the best component; required independent elements multiply.
  format: BALLPARK
  why: Every required element creates another opportunity for failure, even when each subsystem looks highly reliable.
  estimate:
    prompt: A diagnostic chain needs 4 required subsystems in series, each with independent reliability 0.98. Estimate 
      the reliability of the whole chain.
    question: Choose the per-subsystem reliability and the subsystem count.
    labels:
    - 0.98 per subsystem
    - 4 required subsystems
    - 0.80 per subsystem
    - 40 required subsystems
    values:
    - 0.98
    - 4
    - 0.8
    - 40
    slots: 2
    template: series reliability ≈ ({0})^{1}
    formula: Math.pow(a,b)
    correct: [0, 1]
    target: 0.922
    tolerance: 0.02
    units: fraction
    solution: 0.98^4 ≈ 0.92.
    explanation: Series-system reliability declines as more required components are added, even when each component is 
      highly reliable.
    givens:
    - Four required subsystems
    - Each reliability = 0.98
    - Series reliability = product of component reliabilities
    relationship: A chain works only if every link does, so reliability = the per-link reliability raised to the number 
      of links.
  answerText: R ≈ 0.98^4 ≈ 0.92.
- group: E
  task: Match each situation to the best action, control, document, or interpretation. Each option is used once.
  title: Fat Man failure modes and effects analysis
  concept: "Criticality: mass, geometry, reflectors, moderation"
  setup: Match each notional failure to the first review category.
  scene: >-
    Four anomalies came out of last night's rehearsal and they are sitting on one sheet in
    no particular order. The physics division head, Bacher, will not let the next
    rehearsal be scheduled until each has a disposition.
  guide: >-
    Four anomalies and four dispositions. Pair them by asking what each one
    threatens: safety, the mission function, the evidence, or only the schedule.
    One of them leaves the true state unknown, which is different from knowing it
    is bad. Each needs a path decided in advance.
  background:
  - >-
    Why this is a matching board and not four separate questions. Responses on
    boards like this are written to be plausible for more than one situation, so
    choosing them one at a time lets a nearly-right answer through unexamined.
    Having to place all of them forces the comparison — not "is this reasonable
    here", but "is it more right here than there".

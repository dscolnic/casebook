      already measured or stated, so nothing here has to be derived. What is being
      tested is whether you can pick the quantities the relationship actually needs,
      and whether the size of the answer looks right once they are in place.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the
      relationship it is going into. Reading the label is how a unit mismatch, or a
      quantity belonging to a different part of the problem, is caught before it is
      placed — which is the habit this format exists to build.
    takesAsRead:
    - "Descriptive statistics: mean, spread, standard deviation"
    assumes:
    - radioactive decays arrive at random
    takeaway: Four times as many counts are needed to cut statistical uncertainty in half.
    format: BALLPARK
    answerText: About 5%.
    why: "A repeat of the same run would not give exactly the same total. For Poisson counting, the typical fluctuation is
      about the square root of the count, so the fractional uncertainty is 1/√N. 400 counts gives 5%. To cut that in half,
      to 2.5%, you need 4 times as many counts. That slow square-root improvement is why counting statistics are a planning
      tool: longer runs buy precision, but they buy it expensively."
    call: Use Poisson statistics
    reason: The lab must decide now whether the reported gap is larger than the random swing expected from counting.
    setup: A run records 400 net counts with negligible background uncertainty.
    estimate:
      prompt: A counting run records 400 net counts, and Poisson fluctuations are about √N. Estimate the fractional 
        statistical uncertainty.
      question: Choose the numerator and the count total.
      labels:
      - "1"
      - 400 counts
      - 40 counts
      - 4,000 counts
      values: [1, 400, 40, 4000]
      slots: 2
      template: fractional uncertainty ≈ {0} ÷ √{1}
      formula: a/Math.sqrt(b)
      correct: [0, 1]
      target: 0.05
      tolerance: 0.006
      units: fraction
      solution: 1/√400 ≈ 0.05, or 5%.
      explanation: "400 counts gives 5%. The scaling is what matters for planning: uncertainty falls as 1/√N, so halving it
        to 2.5% takes 1,600 counts — 4 times the run. Precision bought by counting longer gets expensive fast, which is why
        detector efficiency and background suppression are worth as much as extra hours."
      givens:
      - Poisson fluctuation is about sqrt(N)
      - Fractional uncertainty is sqrt(N)/N
      relationship: Fractional uncertainty = 1 ÷ the square root of the number of counts.
  - group: CM
    task: Read the reported quantities, decide which belong in the material ledger, and close the input to within the 
      allowed tolerance.
    title: Close the material balance
    concept: "Units and conversions: MeV, u, barns, scientific notation"
    scene: A separation batch has come back and the numbers do not close. Chemistry & Metallurgy will not release the 
      report until the ledger does; downstream work assumes the reported recovery really means what it says.
    guide: >-
      Read every stream first, because reading costs nothing. Then count only the
      masses that belong to the same material ledger. The batch does not close, and
      the missing mass has gone somewhere real — an uncounted route rather than an
      arithmetic slip. Report the total when the ledger closes.
    background:
    - >-
      Why a balance has to close. Material is conserved, so a batch that does not
      add up is a statement that something has not been measured, not that some of
      it stopped existing. Every unclosed ledger is a location nobody has looked at
      yet.
    - >-
      Where material actually goes. Holdup in the equipment, residue on filters and
      vessel walls, a side stream taken for analysis, losses to a scrubber. Each is
      ordinary and each is invisible in the streams somebody thought to weigh.
    - >-
      Why it matters downstream. Somebody is going to cast this material assuming
      the report means what they think it means. In this programme, an assay that is
      quietly wrong about how much is present is the kind of error that ends with a
      criticality rather than a memo.
    assumes:
    - percent of input material can be added across mutually exclusive output routes
    - purity and recovered quantity are different measurements
    takeaway: A purity result cannot substitute for a closed material balance; losses outside measured process streams 
      must still be counted.
    format: BALANCE
    question: Which uncounted route closes the material balance?
    balance:
      hint: Read every card before counting it. Only percentages of the original target material belong in this ledger; 
        a percentage describing composition answers a different question.
      total:
        amount: 100
        unit: "% of input"
        label: Target material entering the separation
      streams:
      - id: product
        label: Recorded product and other measured outputs
        value: 93.5
        display: 93.5% of input
      - id: aqueous
        label: Discarded aqueous stream
        value: 0.4
        display: 0.4% of input
      - id: walls
        label: Material recovered by vessel-wall swab
        value: 5.8
        display: 5.8% of input
        hidden: true
        note: This result is filed with the vessel inspection rather than the process-stream ledger.
      - id: purity
        label: Fraction of counts from the target isotope
        value: 91
        display: 91%
        countable: false
        unitNote: This is a fraction of measured activity, not a fraction of the original material input.
      tolerance: 0.5
    answerText: Count the vessel-wall loss. Recorded outputs account for 93.9% of the input; adding the 5.8% found on 
      the walls gives 99.7%, which closes the 100% input within rounding.
    why: The input is 100% of the target material. Recorded product and aqueous output account for only 93.9%, so 6.1% 
      is still missing. The 91% purity result answers a different question and cannot be added to that ledger. A wall 
      swab finds 5.8% of the input on the vessel surface. Add that loss route and the balance closes to 99.7%, inside 
      rounding. Yield, purity, and material balance are different claims.
    call: Verify yield and purity
    reason: No one can call the missing fraction new physics today until Chemistry shows where the full sample went.
    setup: You are reconciling a separation batch whose numbers do not close.
- title: The Material Changes the Plan
  objective: Use neutron transport and independent detector evidence to understand why reactor-produced plutonium forced
    Los Alamos to reconsider a major design path.
  briefing: 'New material from the production reactors does not behave like the earlier samples. The player separates neutron-transport
    physics from detector failure and then interprets the historically decisive result: reactor-produced plutonium carried
    a much higher spontaneous-neutron background than the plutonium gun program could tolerate.'
  stake: It is spring 1944, and new plutonium gives far more stray neutron counts than expected. The counts could come from
    the material or from bad counters. Today you must use independent evidence to decide which is true. If the material is
    different, a year of work may no longer solve the lab's real problem.
  takeaway: When a material property invalidates a design assumption, the responsible response is to verify the property
    independently and then change the program—not defend sunk work.
  stops:
  - group: T
    call: Follow neutron moderation
    reason: The team must predict how neutrons move through today's test before it can judge whether the extra counts are physical.
    task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
    title: Neutron energy and moderation
    setup: Match each physical observation to the most relevant interaction idea.
    scene: Bethe sketches a fission neutron on the board and asks what happens next — it carries a great deal of energy,
      and everything depends on what it hits. Confusing the possibilities is how a shielding calculation goes quietly 
      wrong.
    guide: >-
      Four things that can happen to a neutron, and four processes. Pair them by
      asking two questions. Is the neutron still there afterwards? And how much
      energy did it give up? A heavy target barely recoils, so it takes almost
      nothing away. One of these removes the neutron entirely.
    background:
    - >-
      Why this is a matching board and not four separate questions. Responses on
      boards like this are written to be plausible for more than one situation, so
      choosing them one at a time lets a nearly-right answer through unexamined.
      Having to place all of them forces the comparison — not "is this reasonable
      here", but "is it more right here than there".
    - >-
      How to use the one-each rule. Because the responses are a set to be
      distributed rather than a list to be sampled, every join you make constrains
      the rest. Settling the two you are confident of can leave the remaining pair
      decided by elimination. Where it does not, two responses are still competing
      for one situation, and that is exactly the distinction the stop is testing.
    - >-
      Why you cannot be wrong about exactly one. With every response used once,
      three correct joins leave the fourth with only one place to go. Any error
      therefore involves at least two joins. That is worth remembering when the last
      pair looks forced: the fault is usually not in the join you are struggling
      with, but in one you made early and stopped questioning.
    takesAsRead:
    - Fission, neutron multiplication and chain reactions
    assumes:
    - a light ball loses more energy hitting something its own size
    takeaway: Energy management and neutron removal are not interchangeable.
    format: PROTOCOL
    why: Slowing, redirecting and absorbing are three different processes with three different consequences. In elastic 
      scattering the neutron transfers some energy and continues as a neutron — it is still in the system. In absorption
      it is captured into a compound nucleus and is gone. Scattering off a heavy nucleus changes direction and gives up 
      very little energy, because a heavy target barely recoils. Scattering off light nuclei is what slows neutrons 
      efficiently, because a light nucleus can take a large share of the energy in one collision.
    rebuttals:
    - A neutron that loses energy and remains a neutron has scattered elastically. It is still available to do something
      later.
    - A neutron that disappears into a compound nucleus has been absorbed. It is removed from the population entirely, 
      which is a different consequence.
    - "A direction change with little energy loss is scattering off a heavy nucleus: the target hardly recoils, so it hardly
      takes any energy."
    - Efficient slowing through repeated collisions needs light nuclei, because a light nucleus can take a large share 
      of the energy each time.
    columns:
    - What happens to the neutron
    - Which process that is
    scenarios:
    - Neutron loses energy but remains a neutron
    - Neutron disappears and a compound nucleus forms
    - Direction changes with little energy loss
    - A material slows neutrons efficiently through repeated collisions
    choices:
    - "Elastic scattering. A billiard-ball collision: the target recoils with whatever share of the motion it can take, and
      the particle carries on with the rest."
    - Absorption. The target keeps the particle and becomes a heavier, excited species, so the travelling population 
      drops by one.
    - Scattering off a heavy nucleus. The target barely recoils, so it takes almost nothing away and the path bends 
      instead of slowing.
    - Moderation by light nuclei. A target of nearly the same mass can carry away a large fraction in a single hit, so a
      few dozen encounters reach thermal speeds.
    mapping: [0, 1, 2, 3]
    answerText: "Neutron loses energy but remains a neutron -> Elastic scattering. A billiard-ball collision: the target recoils
      with whatever share of the motion it can take, and the particle carries on with the rest; Neutron disappears and a compound
      nucleus forms -> Absorption. The target keeps the particle and becomes a heavier, excited species, so the travelling
      population drops by one; Direction changes with little energy loss -> Scattering off a heavy nucleus. The target barely
      recoils, so it takes almost nothing away and the path bends instead of slowing; A material slows neutrons efficiently
      through repeated collisions -> Moderation by light nuclei. A target of nearly the same mass can carry away a large fraction
      in a single hit, so a few dozen encounters reach thermal speeds"
  - group: P
    task: Open the dependency chain behind each check, keep the evidence that does not share the counter threshold, and 
      name the shared source that explains the low recorded rate.
    title: Are the neutrons missing, or the counts?
    concept: "Detectors: ionisation, count rate, efficiency, dead time"
    scene: A neutron counter is reading well below prediction, and Bacher wants to know whether the physics or the 
      instrument is at fault before anybody reports it upstairs. The measurement built on this counter is one the whole 
      plutonium programme depends on.
    guide: >-
      Open each reading to see what it was computed from. Keep the ones that could
      still see neutrons arriving without passing through the discriminator, and
      untick the rest. Then name the dependency the failed readouts share. Both
      halves count: discarding an independent measurement costs as much as keeping a
      dependent one.
    background:
    - >-
      Why the two explanations look identical on the console. Fewer neutrons
      arriving and fewer neutrons being counted produce the same low number. Nothing
      about the number itself separates them, which is why the answer has to come
      from what each channel depended on rather than from its value.
    - >-
      What the counting chain contains. A detector, a discriminator that decides
      whether a pulse is large enough to count, an amplifier, a scaler. A threshold
      set too high silently rejects real events, and every channel downstream of it
      reports the same shortfall convincingly.
    - >-
      Why an independent channel is worth so much here. An activation foil or a
      geometry check sees neutrons arriving without the electronics deciding
      anything. One such measurement settles a question no number of counter runs
      can.
    assumes:
    - a neutron detector converts an interaction into an electrical pulse
    - a discriminator rejects pulses below a set threshold
    takeaway: Independent evidence can separate a missing physical signal from a failure in the instrument that reports 
      it.
    format: TRACE
    question: Are neutrons failing to arrive, or is the counting chain discarding them?
    trace:
      hint: Open each reading and trace what it depends on. Keep at least one measurement that can see neutron arrival 
        without using the discriminator, then identify the dependency shared by the failed counting readouts.
      target: threshold
      channels:
      - id: counter
        label: Recorded counter rate
        reading: 340 counts/min (expected about 1,200 counts/min)
        depends:
        - source
        - geometry
        - detector_conversion
        - threshold
      - id: pulseheight
        label: Pulse-height distribution
        reading: large population just below the threshold (expected distribution clear of threshold)
        depends:
        - detector_conversion
        - threshold
      - id: foil
        label: Activation foil at detector face
        reading: activity as predicted (expected activity as predicted)
        depends:
        - source
        - geometry
        - foil_activation
      - id: geometry
        label: Inverse-square geometry check
        reading: follows 1/r² within 4% (expected follows 1/r²)
        depends:
        - source
        - geometry
      - id: repeat
        label: Five repeat counter runs
        reading: all within 4% (expected about 5% statistical scatter)
        depends:
        - detector_conversion
        - threshold
      resources:
      - id: threshold
        label: Discriminator threshold
      - id: source
        label: Source strength
      - id: geometry
        label: Source-detector geometry
      - id: detector
        label: Detector conversion efficiency
      - id: detector_conversion
        label: detector conversion
      - id: foil_activation
        label: foil activation
      independent:
      - foil
      - geometry
    answerText: The neutrons are arriving; the discriminator threshold is too high. The activation foil sees the 
      expected exposure while the counter records only 340/min and many real pulses sit just below the cut.
    why: "The main counter is low, but that result depends on every stage of the counting chain. The activation foil does
      not: it sees the expected neutron exposure without using the discriminator electronics. Geometry also behaves as expected
      under the inverse-square check. Meanwhile the pulse-height distribution piles up just below the discriminator threshold.
      Those observations can all be true together only if neutrons are arriving and real detector pulses are being rejected.
      Agreement among dependent readouts is not independent evidence."
    call: Detect neutrons reliably
    reason: Independent counters are needed now to show whether the surprising signal belongs to the new material.
    setup: You are checking a neutron counter that reads well below prediction.

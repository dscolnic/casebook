    task: Use the binding-energy-per-nucleon curve to decide which direction of nuclear change can release energy, 
      without turning that principle into an ignition or weapon-design lesson.
    title: What the binding-energy curve can tell you
    place: Theoretical Division
    scene: >-
      The binding-energy curve is still on Bethe's blackboard in August 1945. A younger physicist asks what the curve itself
      establishes—and what it does not.
    guide: >-
      The curve compares how tightly bound nuclei are. Moving toward more tightly bound products can release energy. It does
      not, by itself, tell you whether a reaction will occur quickly or how to make it occur.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to
      be the answer under one specific misreading — a step skipped, a quantity
      confused with a rate, a correlation taken for a cause. Identifying which
      misreading each belongs to is where the learning is; the right answer alone
      can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the
      qualifying clause and the unit. So across a whole game the key used to be the
      longest option far more often than chance — 88 per cent of passage quizzes
      here, before it was fixed. It is now checked per game as a binomial tail, so
      length, hedging and specificity have had the signal taken out of them
      deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the
      verdict prints them — the reason that option fails, not a restatement of the
      right one. They are worth reading after a correct answer as well: a right
      choice made for an approximate reason is indistinguishable from a sound one
      until the day the approximation is what is being tested.
    assumes:
    - like charges repel, and the nuclear force acts only at very short range
    takeaway: Energetic favorability and reaction accessibility are different questions.
    format: CHOICE
    answerText: A reaction can release energy when its products are more tightly bound per nucleon than its reactants; 
      the binding-energy curve alone does not tell you the reaction rate or how to initiate it.
    why: "Binding energy per nucleon rises from very light nuclei toward iron and nickel and then falls gradually for heavier
      nuclei. Moving toward more tightly bound products can release energy through a mass difference. But an energy-releasing
      direction is not the same thing as an accessible reaction path. The curve tells you the energy bookkeeping, not the
      kinetics or engineering."
    call: Separate energy bookkeeping from reaction access
    reason: The final record must not confuse energy that is possible on paper with a reaction the system can actually reach.
    rebuttals:
    - The curve describes relative binding, not a required trigger or reaction mechanism.
    - A favorable energy difference does not imply a fast reaction.
    - The curve is useful for energy accounting even when the actual pathway is strongly suppressed.
    choices:
    - Products that are more tightly bound per nucleon can lie lower in mass-energy, so the difference can be released; 
      the curve alone says nothing about how fast the reaction occurs.
    - Any reaction that moves upward on the binding-energy curve must occur spontaneously at ordinary conditions.
    - The curve specifies the temperature or neutron energy needed to start every nuclear reaction.
    - The curve matters only for fission and cannot describe why other nuclear changes may release energy.
    answer: Products that are more tightly bound per nucleon can lie lower in mass-energy, so the difference can be 
      released; the curve alone says nothing about how fast the reaction occurs.

    format: BALLPARK
    answerText: sigma_total = sqrt(29), about 5.4 ns.
    why: "Independent timing uncertainties combine in quadrature. Two, three and four nanoseconds therefore give about 5.4
      ns rather than 9 ns. The largest term contributes the most variance and is the best place to improve first. This is

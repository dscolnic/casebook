    answerText: Keep the written operating limit below the proof-test boundary so one credible variation does not 
      consume the entire margin.
    why: A proof test establishes what happened in one controlled configuration. Real use adds temperature changes, 
      alignment error, wear, measurement uncertainty and ordinary handling variation. A written operating limit sits 
      inside the demonstrated boundary so one credible deviation does not erase the full margin. The general engineering
      lesson is that a safety factor belongs to the system of uncertainties, not to one number alone.

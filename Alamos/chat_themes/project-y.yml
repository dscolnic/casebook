  - label: C
    text: Choose by nominal handbook values and skip batch measurements to save test time.
  recommended:
    B: 90
    A: 5
  answerText: "Recommended: 90 to reproducible inert material characterization, 5 to a bounded comparison, 5 in reserve."
- group: E
  task: Arrange the four cards from earliest cause or prerequisite to latest result.
  title: A pulsed diagnostic unit as a system
  setup: Order a conceptual fast-measurement sequence without circuit values or construction details.
  scene: >-
    Two groups are testing the same pulsed diagnostic unit to different written procedures. The integration team wants one
    order of operations that both groups can reproduce.
  guide: >-
    All four functions exist and each is tested separately as well as together. Ask what must be true before the next step:
    safe initialization, state verification, authorized trigger receipt, and distribution to recording channels.
  background:
  - >-
    Why the order is graded whole. A sequence is a claim about dependency: each
    step is here because the one before it has already happened, or has to have.
    One transposed pair falsifies that claim wherever it sits, so partial credit
    would be credit for a sequence that does not work.
  - >-
    Why the ends are the place to start. The first and last cards are constrained
    by having nothing before or after them, which usually makes them the two you
    can settle from the scene alone. Pinning them collapses the remaining
    arrangements sharply, and what is left in the middle is where the actual
    judgement lives.
  - >-
    What the rail can be ordered on. Time is the usual axis, but it is not the
    only one. An order can run on cost, on risk, or on reversibility — every
    observation that leaves the sample as it was, before any that consumes it. On
    those boards a chronological reading finds nothing, because none of the steps
    has to happen at a particular hour.
  takeaway: A fast diagnostic unit is an interface between experiment logic and precise physical timing.
  format: SEQUENCE
  why: Initialization, state verification, trigger receipt, and signal distribution are separate functions that must be 
    tested separately and together.
  cards:
  - Initialize and verify the energy-storage and reference subsystem while outputs remain inhibited.
  - Confirm the diagnostic unit's safe state and continuity through approved checks.
  - Receive the authorized experiment trigger.
  - Distribute the conditioned reference pulse to the recording channels and preserve the diagnostic record.
  order:
  - 0
  - 1
  - 2
  - 3
  answerText: Initialize and verify → confirm safe state and continuity → receive the authorized experiment trigger → 
    distribute the reference pulse to recording channels.
- group: E
  task: Estimate the largest allowed path mismatch, then state the engineering response.
  title: Cable routing and signal integrity
  setup: An inert test rack must hold 2 signal paths matched to within 2 ns; signal speed in the cable is 2.0 x 10^8 
    m/s. These are classroom values.
  scene: >-
    A test rack is being wired, and its two signal paths have to arrive within two
    nanoseconds of each other. Signals travel at 2×10⁸ m/s in the cable. Bacher, who heads
    the physics division, wants something the installers can check with a tape measure.
  guide: >-
    Four numbers, and two of them are signal speeds a factor of two apart. Ask of
    each which cable this is. And note what the answer turns into. A timing
    tolerance becomes a length in centimetres, which makes cable geometry part of
    the timing system rather than an installation detail.
  background:
  - >-
    Why an estimate rather than a calculation. Every quantity on this board is
    already measured or stated, so nothing here has to be derived. What is being
    tested is whether you can pick the quantities the relationship actually needs,
    and whether the size of the answer looks right once they are in place.
  - >-
    Why the tiles carry labels. A bare number cannot be checked against the
    relationship it is going into. Reading the label is how a unit mismatch, or a
    quantity belonging to a different part of the problem, is caught before it is
    placed — which is the habit this format exists to build.
  takeaway: Seemingly passive hardware can carry critical timing information.
  format: BALLPARK
  why: Cable geometry can become part of the timing system.
  estimate:
    prompt: A test rack must hold 2 signal paths matched to within 2 ns (2×10⁻⁹ s), and signals travel at 2×10⁸ m/s in 
      the cable. Estimate the largest path mismatch that still meets the requirement, in centimetres.
    question: Choose the timing tolerance, the signal speed, and the metres-to-centimetres conversion.
    labels:
    - 2×10⁻⁹ s tolerance
    - 2×10⁸ m/s signal speed
    - 100 cm/m
    - 1×10⁸ m/s signal speed
    values: [2e-9, 200000000, 100, 100000000]
    slots: 3
    template: max mismatch ≈ {0} × {1} × {2}
    formula: a*b*c
    correct: [0, 1, 2]
    target: 40
    tolerance: 4
    units: cm
    solution: 2×10⁻⁹ s × 2×10⁸ m/s × 100 cm/m ≈ 40 cm.
    explanation: "A 2 ns budget buys 40 cm of route mismatch — generous on a rack, but easy to spend once a cable detours
      around equipment. Converting the timing requirement into a length limit is what makes it inspectable: a technician can
      measure cable, not nanoseconds."
    givens:
    - Timing tolerance = 2 ns = 2 x 10^-9 s
    - Signal speed = 2.0 x 10^8 m/s
    - Allowed path mismatch = tolerance x signal speed
    relationship: Allowed length mismatch = timing tolerance × signal speed. Multiply by 100 to turn metres into 
      centimetres.
  answerText: About 0.4 m, or 40 cm. The response is to turn the timing requirement into a measurable cable-length limit
    held under configuration control.
- group: E
  task: Arrange the four cards from earliest cause or prerequisite to latest result.
  title: Controlled assembly workflow for a one-shot experiment
  setup: Order a non-operational assembly-control workflow.
  scene: >-

    internal design.
  format: SCIENCETANK
  why: 'Vehicle integration is an interface problem: the carrier only needs the properties that affect flight, handling, and
    release.'
  proposals:
  - label: A
    text: Concentrate only on the payload interior and assume the aircraft can adapt later.
  - label: B
    text: Measure mass properties, structural interfaces, release behavior, and aircraft-system loads with inert test 
      articles.
  - label: C
    text: Use one successful drop as complete qualification for every aircraft and environmental condition.
  recommended:
    B: 90
    A: 5
  answerText: "Recommended: put the large majority into inert interface testing and measured aircraft compatibility."
- group: E
  task: Estimate the fall time ignoring drag.
  title: Drop time and the pumpkin-bomb test program
  setup: Use a deliberately simplified vacuum calculation for an inert training shape; real trajectories require drag 
    and full flight testing.
  scene: >-
    Crews are dropping inert pumpkin bombs with Fat Man's external shape and weight, to
    measure release behavior, aircraft handling and bombing procedure. Groves, the
    commanding general, wants a figure for how long the shape falls from 8,000 m before
    the next series is flown.
  guide: >-
    Four numbers, and two of them are altitudes ten times apart. Ask of each which
    one the aircraft flew at. And note what the answer is worth. It ignores the
    air entirely, which is exactly why inert drop tests were flown instead of
    trusting it.
  background:
  - >-
    Why an estimate rather than a calculation. Every quantity on this board is
    already measured or stated, so nothing here has to be derived. What is being
    tested is whether you can pick the quantities the relationship actually needs,
    and whether the size of the answer looks right once they are in place.
  - >-
    Why the tiles carry labels. A bare number cannot be checked against the
    relationship it is going into. Reading the label is how a unit mismatch, or a
    quantity belonging to a different part of the problem, is caught before it is
    placed — which is the habit this format exists to build.
  takeaway: Ballistic mockups convert a paper release concept into measured flight evidence.
  format: BALLPARK
  why: The simple result establishes a scale; inert drop tests were necessary because real aerodynamic behavior, winds, 
    and aircraft motion matter.
  estimate:
    prompt: An inert test shape is released from 8,000 m, with g = 9.8 m/s². Ignoring drag, the fall time is t ≈ 
      √(2h/g). Estimate it.
    question: Choose the factor in the free-fall equation, the altitude, and g.
    labels:
    - "2"
    - 8,000 m
    - 9.8 m/s²
    - 800 m
    values: [2, 8000, 9.8, 800]
    slots: 3
    template: t ≈ √(({0}×{1}) ÷ {2})
    formula: Math.sqrt(a*b/c)
    correct: [0, 1, 2]
    target: 40.4
    tolerance: 2.5
    units: s
    solution: √(2×8,000/9.8) ≈ 40 s.
    explanation: A fall from several kilometers takes tens of seconds in vacuum. Real trajectories require drag and full
      flight testing.
    givens:
    - Release altitude h = 8,000 m
    - g = 9.8 m/s^2
    - Use t approximately sqrt(2h/g)
    relationship: For a drop from rest, time = the square root of (2 × height ÷ g).
  answerText: t approximately sqrt(16,000/9.8) approximately 40 seconds.

  - group: X
    task: Match each wave-shaping question to a measurement that can answer it in an inert laboratory mockup.
    title: What an inert wave-shaping test can establish
    concept: Shock waves, compression and hydrodynamics
    scene: Kistiakowsky, the head of the explosives division, has his group studying how waves move through different materials. The player is not designing
      the weapon; the task is to decide which measurements make a claim about wave shape defensible.
    guide: >-
      Pair each claim with the observation that isolates it: measure material propagation separately, then combined arrival
      times, then manufacturing repeatability, then cross-check the reconstructed front with an independent diagnostic.
    background:
    - >-
      Why this is a matching board and not four separate questions. Responses on
      boards like this are written to be plausible for more than one situation, so
      choosing them one at a time lets a nearly-right answer through unexamined.
      Having to place all of them forces the comparison — not "is this reasonable
      here", but "is it more right here than there".
    - >-
      How to use the one-each rule. Because the responses are a set to be
      distributed rather than a list to be sampled, every join you make constrains
      the rest. Settling the two you are confident of can leave the remaining pair
      decided by elimination. Where it does not, two responses are still competing
      for one situation, and that is exactly the distinction the stop is testing.
    - >-
      Why you cannot be wrong about exactly one. With every response used once,
      three correct joins leave the fourth with only one place to go. Any error
      therefore involves at least two joins. That is worth remembering when the last
      pair looks forced: the fault is usually not in the join you are struggling
      with, but in one you made early and stopped questioning.
    takesAsRead:
    - Pressure, temperature and equations of state
    assumes:
    - a lens bends light by slowing it in some places more than others
    takeaway: Wave-shaping claims are earned by inert measurements of propagation, arrival-time uniformity, 
      manufacturing variation, and independent reconstruction.
    format: PROTOCOL
    answerText: Material propagation speed -> measure each material separately; composite arrival uniformity -> compare 
      times around the inert test surface; manufacturing repeatability -> repeat as-built mockups across batches; 
      independent confirmation -> reconstruct the same front with a second diagnostic.
    why: Pressure waves move at different speeds in different materials. An inert test can show how even their arrival is,
      how much joints or batches change it, and whether a second tool sees the same front. Each claim needs its own measure.
      The test supports only the parts that those measures can check.
    call: Turn wave-shaping claims into measurements
    reason: The two tools disagree today, so the lab needs a clear measure of wave timing and an independent check.
    setup: Match each inert-test question to the evidence that settles it.
    rebuttals:
    - The component propagation speeds are measured separately before a composite result can be interpreted.
    - Relative arrival time is the direct observable for uniformity in the inert mockup.
    - Manufacturing variation is a population question, so repeated as-built tests are needed.
    - A second diagnostic matters because the first reconstruction can carry its own timing or calibration bias.
    columns:
    - Question the inert wave-shaping program must settle
    - Evidence or action that settles it
    scenarios:
    - Do the candidate materials carry a pressure front at measurably different speeds?
    - When combined in the inert mockup, do the monitored paths reach the target surface with the intended relative 
      timing?
    - Do joints and batch-to-batch material variation change an otherwise repeatable result?
    - Does an independent diagnostic reconstruct the same overall wavefront?
    choices:
    - Measure the propagation speed of each candidate material separately before combining them.
    - Compare arrival times at distributed sensors around the inert test surface.
    - Repeat as-built mockups across batches and joints rather than trusting dimensions alone.

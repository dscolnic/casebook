      - 3 ns cable-characterization uncertainty
      - 4 ns recorder uncertainty
      - 9 ns linear sum
      values:
      - 2
      - 3
      - 4
      - 9
      slots: 3
      template: σ_total ≈ √({0}²+{1}²+{2}²)
      formula: Math.sqrt(a*a+b*b+c*c)
      correct: [0, 1, 2]

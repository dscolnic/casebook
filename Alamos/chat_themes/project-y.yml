- title: A Year of Work Ends
  objective: Turn the 1944 plutonium result into a program decision while keeping the lesson at the level of evidence, 
    timing risk, and organizational change.
  briefing: The higher spontaneous-neutron background is confirmed. The player estimates a laboratory background count, 
    follows the evidence chain that ended the plutonium gun program, and sequences the reorganization needed to test a 
    different approach without treating the device itself as an instructional object.
  stake: It is July 1944, and several tests now show that the old plutonium plan rests on a false claim. Ending it will throw
    away a year of work and move people to a less tested plan. Today you must show what failed and decide how the lab should
    change course. The new plan must answer to evidence, not pride or past effort.
  takeaway: A scientific pivot is strongest when the failed assumption is named explicitly and the new program is 
    organized around tests that can falsify its replacement.
  stops:
  - group: T
    task: Use a measured background rate and counting interval to estimate the number of spontaneous-neutron counts 
      expected during a laboratory measurement.
    title: How large is the neutron background?
    scene: The new reactor-produced plutonium gives a neutron background far above the earlier material. Before anyone 
      connects that fact to a program decision, Bacher wants the size of the background written as an ordinary counting 
      problem.
    guide: >-
      Rate times time gives an expected count. This is a laboratory-background calculation, not a device-timing calculation.
      Pick the measured rate and the observation time, then check whether the result is large enough that ordinary Poisson
      fluctuation cannot explain the difference from the old samples.
    background:
    - >-
      Why an estimate rather than a calculation. Every quantity on this board is
      already measured or stated, so nothing here has to be derived. What is being
      tested is whether you can pick the quantities the relationship actually needs,
      and whether the size of the answer looks right once they are in place.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the
      relationship it is going into. Reading the label is how a unit mismatch, or a
      quantity belonging to a different part of the problem, is caught before it is
      placed — which is the habit this format exists to build.
    assumes:
    - some heavy nuclei split without being hit by anything
    takeaway: The decisive historical fact was a reproducibly higher spontaneous-neutron background in reactor-produced 
      plutonium.
    format: BALLPARK
    answerText: About 1,200 excess counts in 10 minutes.
    why: A count rate becomes comparable only when it is tied to an observation time. Here the new sample averages 120 
      counts per minute above background for 10 minutes, so about 1,200 excess counts are expected. The square-root 
      statistical fluctuation of a count this large is only a few tens of counts, far smaller than the excess. That does
      not by itself choose a weapon architecture; it establishes that the material property is real enough to force the 
      next question.
    call: Understand spontaneous-fission backgrounds
    reason: The lab needs the size of the unwanted neutron signal today to show why the old timing claim cannot stand.
    setup: A sample emits spontaneous-fission neutrons at about 10^4 per second. A slow mechanical assembly takes about 
      10^-3 s; a fast one takes about 10^-6 s.
    estimate:
      prompt: A reactor-produced plutonium sample gives an excess neutron count rate of about 120 counts per minute 
        above the laboratory background. It is observed for 10 minutes. Estimate the excess counts.
      question: Choose the excess rate and the counting time.
      labels:
      - 120 counts/min excess
      - 10 min observation
      - 1,200 counts/min
      - 0.1 min observation
      values:
      - 120
      - 10
      - 1200
      - 0.1
      slots: 2
      template: '{0} × {1}'
      formula: a*b
      correct:
      - 0
      - 1
      target: 1200
      tolerance: 80
      units: counts
      solution: 120 counts/min × 10 min ≈ 1,200 excess counts.
      explanation: "This establishes the scale of the laboratory background measurement. It does not use or imply an assembly
        time."
      givens:
      - Excess count rate = 120 counts/min
      - Observation time = 10 min
      relationship: Expected counts = count rate × observation time.
  - group: E
    call: Explain why Thin Man was abandoned
    reason: You must link the measured material change to the failed program assumption before ending a year of work.
    task: Order the historical evidence-to-decision chain without reconstructing the device.
    title: Why the plutonium gun program ended
    setup: Order the historical reasoning that turned an unexpected material result into a program-wide redesign.
    scene: The higher spontaneous-neutron background has now been reproduced. Oppenheimer must decide what it means for 
      the plutonium gun program and how to reorganize the laboratory.
    guide: >-
      Keep this at the level of assumptions and program consequences. The new material measurement comes first. Then identify
      which earlier assumption it invalidates, make the program decision, and only then reorganize staff and tests.
    background:
    - >-
      Why the order is graded whole. A sequence is a claim about dependency: each
      step is here because the one before it has already happened, or has to have.
      One transposed pair falsifies that claim wherever it sits, so partial credit
      would be credit for a sequence that does not work.
    - >-
      Why the ends are the place to start. The first and last cards are constrained
      by having nothing before or after them, which usually makes them the two you
      can settle from the scene alone. Pinning them collapses the remaining
      arrangements sharply, and what is left in the middle is where the actual
      judgement lives.
    - >-
      What the rail can be ordered on. Time is the usual axis, but it is not the
      only one. An order can run on cost, on risk, or on reversibility — every
      observation that leaves the sample as it was, before any that consumes it. On
      those boards a chronological reading finds nothing, because none of the steps
      has to happen at a particular hour.
    takesAsRead:
    - Pressure, temperature and equations of state
    assumes:
    - a measurement can rule out a design without anybody being wrong
    takeaway: The plutonium gun program ended because a newly measured material property invalidated a key assumption, 
      not because the underlying nuclear physics suddenly changed.
    format: SEQUENCE
    why: "Reactor-produced plutonium carried a much higher spontaneous-neutron background than the early program had assumed.
      That made the plutonium gun approach unreliable. Los Alamos therefore abandoned that route for plutonium and concentrated
      the plutonium effort on implosion research. The historical lesson is how a new measurement can invalidate a design assumption
      and force a program-level pivot."
    rebuttals:
    - The material result has to be established first; otherwise the pivot is only a reaction to one instrument.
    - Name the failed assumption second. A program cannot learn from a pivot if it never states what became false.
    - The program decision follows the evidence. Sunk work is not a physical argument.
    - Reorganization comes last, once the replacement program's evidence needs are known.
    cards:
    - Confirm the unexpectedly high spontaneous-neutron background in reactor-produced plutonium with independent 
      measurements.
    - Identify the early plutonium gun-program assumption that the new material no longer satisfies.
    - End the plutonium gun program rather than treating the material result as an engineering nuisance.
    - Reorganize the plutonium effort around implosion research, diagnostics, and integration tests.
    order:
    - 0
    - 1
    - 2
    - 3
    answerText: Confirm the higher spontaneous-neutron background → identify the failed gun-program assumption → abandon
      the plutonium gun route → reorganize the plutonium effort around implosion research and new diagnostics.

- group: T
  task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
  title: Symmetry and perturbations
  setup: Match the observed pattern to the simplest qualitative description.
  scene: >-
    A perfectly spherical implosion is an idealisation, and Kistiakowsky's lens work keeps
    producing departures from it: timing errors, gaps, surface roughness. The theory group
    has four observed patterns on the bench and no shared vocabulary for them.
  guide: >-
    Four shapes and four mode names. Pair them by asking what each one does to the
    assembly. Changes its size and not its shape? Moves its centre? Keeps the
    volume and spoils the shape? Or grows from small roughness? Mode language
    turns a complicated shape into something you can talk about.
  background:
  - >-
    Why this is a matching board and not four separate questions. Responses on
    boards like this are written to be plausible for more than one situation, so
    choosing them one at a time lets a nearly-right answer through unexamined.
    Having to place all of them forces the comparison — not "is this reasonable
    here", but "is it more right here than there".
  - >-
    How to use the one-each rule. Because the responses are a set to be
    distributed rather than a list to be sampled, every join you make constrains
    the rest. Settling the two you are confident of can leave the remaining pair
    decided by elimination. Where it does not, two responses are still competing
    for one situation, and that is exactly the distinction the stop is testing.
  - >-
    Why you cannot be wrong about exactly one. With every response used once,
    three correct joins leave the fourth with only one place to go. Any error
    therefore involves at least two joins. That is worth remembering when the last
    pair looks forced: the fault is usually not in the join you are struggling
    with, but in one you made early and stopped questioning.
  takeaway: Symmetry errors are best diagnosed by decomposing them into modes.
  format: PROTOCOL
  why: Mode language converts a complicated shape into interpretable patterns.
  columns:
  - What the compression looks like
  - Which mode that is
  scenarios:
  - All directions shift together
  - One side leads while the opposite side lags
  - Four alternating high-low regions appear
  - Small-scale roughness grows over time
  choices:
  - A monopole, or uniform mode. Changes the assembly’s size but not its shape, altering density without breaking 
    symmetry.
  - A dipole. The centre of compression moves off the geometric centre — displacement rather than distortion.
  - A quadrupole. Volume survives but the sphere goes elongated or flattened, so the shape is wrong even when the size 
    is right.
  - High-order perturbation growth. Short wavelengths grow fastest, so a small initial defect can dominate late in the 
    compression.
  mapping: [0, 1, 2, 3]
  answerText: All directions shift together -> A monopole, or uniform mode. Changes the assembly’s size but not its 
    shape, altering density without breaking symmetry.; One side leads while the opposite side lags -> A dipole. The 
    centre of compression moves off the geometric centre — displacement rather than distortion.; Four alternating 
    high-low regions appear -> A quadrupole. Volume survives but the sphere goes elongated or flattened, so the shape is
    wrong even when the size is right.; Small-scale roughness grows over time -> High-order perturbation growth. Short 
    wavelengths grow fastest, so a small initial defect can dominate late in the compression.
- group: P
  task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
  title: Gas-filled detectors
  setup: Match the measurement goal to the best operating regime.
  scene: >-
    Leona Woods, who builds counters for the physics division, has four gas-filled tubes
    on one bench and a shared high-voltage supply between them. Four groups have asked her
    for four different measurements, and each tube has to be set for its own job.
  guide: >-
    Four needs and four operating regions. Pair them by asking what the field
    strength does to the signal. No multiplication gives a steady current. Large
    but linear multiplication keeps the pulse height meaningful. And beyond that
    every event gives the same pulse, whatever arrived.
  background:
  - >-
    Why this is a matching board and not four separate questions. Responses on
    boards like this are written to be plausible for more than one situation, so
    choosing them one at a time lets a nearly-right answer through unexamined.
    Having to place all of them forces the comparison — not "is this reasonable
    here", but "is it more right here than there".
  - >-
    How to use the one-each rule. Because the responses are a set to be
    distributed rather than a list to be sampled, every join you make constrains
    the rest. Settling the two you are confident of can leave the remaining pair
    decided by elimination. Where it does not, two responses are still competing
    for one situation, and that is exactly the distinction the stop is testing.
  - >-
    Why you cannot be wrong about exactly one. With every response used once,
    three correct joins leave the fourth with only one place to go. Any error
    therefore involves at least two joins. That is worth remembering when the last
    pair looks forced: the fault is usually not in the join you are struggling
    with, but in one you made early and stopped questioning.
  takeaway: Operating voltage determines what information a gas detector preserves.
  format: PROTOCOL
  why: Electric-field strength changes whether the detector measures total ionization, amplified ionization, or a 
    saturated discharge.
  columns:
  - What you want to measure
  - Which operating region measures it
  scenarios:
  - Measure average dose rate over a broad range
  - Preserve some pulse-size information
  - Count individual events with simple electronics
  - Avoid operation where continuous discharge dominates
  choices:
  - The ionization-chamber region. No gas multiplication, so the output is a steady current proportional to total 
    ionization rather than one pulse per event.
  - The proportional region. Multiplication is large but linear, so pulse height still tracks energy deposited.
  - "The Geiger–Müller region. Every event yields the same large pulse: easy to count, useless for spectroscopy."
  - Below electrical breakdown. Past it the discharge sustains itself and the output stops depending on the radiation at
    all.
  mapping: [0, 1, 2, 3]
  answerText: "Measure average dose rate over a broad range -> The ionization-chamber region. No gas multiplication, so the
    output is a steady current proportional to total ionization rather than one pulse per event.; Preserve some pulse-size
    information -> The proportional region. Multiplication is large but linear, so pulse height still tracks energy deposited.;
    Count individual events with simple electronics -> The Geiger–Müller region. Every event yields the same large pulse:
    easy to count, useless for spectroscopy.; Avoid operation where continuous discharge dominates -> Below electrical breakdown.
    Past it the discharge sustains itself and the output stops depending on the radiation at all."
- group: P
  task: Estimate the fractional statistical fluctuation.
  title: Scintillation detectors
  setup: A scintillator produces about 10,000 detected photoelectrons for a reference event.
  scene: >-
    Joan Hinton, the young experimenter running the fast counters, has a scintillator that
    gives about ten thousand detected photoelectrons for a reference event. Timing work
    depends on it, and she wants to know how steady that pulse height is run to run.
  guide: >-
    Four numbers, and three of them are photoelectron counts. Only one belongs to
    this measurement. Ask of each whether it is the numerator or the count. And
    note how the answer improves: a hundred times more light halves the noise ten
    times over, not a hundred.
  background:
  - >-
    Why an estimate rather than a calculation. Every quantity on this board is
    already measured or stated, so nothing here has to be derived. What is being
    tested is whether you can pick the quantities the relationship actually needs,
    and whether the size of the answer looks right once they are in place.
  - >-
    Why the tiles carry labels. A bare number cannot be checked against the
    relationship it is going into. Reading the label is how a unit mismatch, or a
    quantity belonging to a different part of the problem, is caught before it is
    placed — which is the habit this format exists to build.
  takeaway: More detected photons usually improve statistical energy resolution.
  format: BALLPARK
  why: 1/sqrt(10000)=0.01.
  estimate:
    prompt: A scintillation event releases about 10,000 detected photoelectrons, and counting fluctuations scale as 
      1/√N. Estimate the fractional noise.
    question: Choose the numerator and the photoelectron count.
    labels:
    - "1"
    - 10,000 photoelectrons
    - 100 photoelectrons
    - 1,000,000 photoelectrons
    values: [1, 10000, 100, 1000000]
    slots: 2
    template: fractional noise ≈ {0} ÷ √{1}
    formula: a/Math.sqrt(b)
    correct: [0, 1]
    target: 0.01
    tolerance: 0.002
    units: fraction
    solution: 1/√10,000 ≈ 0.01, or 1%.
    explanation: Photoelectron statistics are approximately Poisson, so fractional noise decreases as one over the 
      square root of the count.
    givens:
    - Statistical fractional fluctuation is roughly 1/sqrt(N)
    relationship: "Counting fluctuation is Poisson: the fractional noise = 1 ÷ the square root of the number counted."
  answerText: About 1%.

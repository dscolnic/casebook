  - group: CM
    task: Spend the final 100-credit improvement budget on the evidence system that will remain useful when the next 
      batch behaves differently.
    title: Leave a materials capability, not just better numbers
    scene: >-
      Hornig's final dossier has to show more than that components existed. The division
      has one last hundred credits of improvement to spend, and the choice says what it
      thinks a materials capability is. It is the last money the division will be given.
    guide: >-
      One hundred credits, and the choice says what the division thinks a materials
      capability is. Open each investment and ask what it leaves behind when the
      programme ends. Better numbers on the current components are worth something;
      a method, a standard or a trained group is worth it next year too.
    background:
    - >-
      What a capability is, as distinct from a result. A result answers today's
      question. A capability answers questions nobody has asked yet: a calibrated
      technique, a documented procedure, a set of reference materials, people who
      know how to use them. The dossier is being read by people deciding what to
      fund next.
    - >-
      Why the temptation is to buy numbers. Precision on an existing measurement is
      visible, defensible and easy to write up. It is also spent the moment the
      component it describes is superseded.
    - >-
      Why this is the last hundred credits. Nothing follows it, so anything that
      needs a second round to be useful is worth nothing here. That constraint is
      what separates the durable investments from the promising ones.
    assumes:
    - future batches may differ from today's batch
    - a record is useful when it preserves relationships, not only isolated measurements
    takeaway: A durable materials programme links process conditions to composition, structure, properties, and 
      traceable batch records.
    format: VALUE
    question: Which investment creates the most durable materials capability?
    value:
      hint: You can fund one improvement. Open each option and ask what a future team would learn when a later batch 
        comes out different.
      budget:
        amount: 100
        unit: credits
      decision: Choose the improvement that best preserves the ability to explain and correct future batch variation.
      options:
      - id: records
        label: Link each batch's process conditions to measured properties
        cost: 100
        axis: process-property traceability
        decisive: true
        reveals: Which process conditions consistently travel with changes in composition, structure, or performance 
          across batches.
      - id: independent
        label: Add independent composition and microscopy checks to every batch
        cost: 100
        axis: batch verification
        decisive: false
        reveals: Whether each batch's measurements agree across methods, without linking differences back to how the 
          batch was made.
      - id: remeasure
        label: Re-measure released batches to tighter tolerance
        cost: 100
        axis: measurement precision
        decisive: false
        reveals: More precise values for material already released, without explaining the process conditions that 
          produced those values.
      - id: throughput
        label: Raise production throughput with records unchanged
        cost: 100
        axis: production volume
        decisive: false
        reveals: How much more material can be produced, while preserving the same blind spot about why batches differ.
    answerText: Spend the 100 credits on records that link each batch's process conditions to its measured composition, 
      structure, and properties. That creates an evidence chain future staff can use to explain variation.
    why: Another measurement can describe one batch more precisely, but it does not explain why the next batch differs. 
      A process-to-properties record connects what was done to what the material became. That relationship can be tested
      across batches and used later to diagnose a change in structure or performance. Extra composition checks, tighter 
      remeasurement, and higher throughput all have value, but none creates that causal record. The durable capability 
      is the evidence chain linking process history to measured properties.
    call: Complete the materials dossier
    reason: Each final claim needs a traceable sample and process record before staff and materials leave the program.
    setup: The division has 1 final 100-credit improvement budget.

- group: E
  task: Allocate 100 research credits across the 3 proposals. You may hold credits in reserve, but explain the decision 
    criterion.
  title: The Jumbo contingency decision
  setup: The Trinity team must decide where to invest as confidence in implosion rises.
  scene: >-
    Jumbo, the steel vessel ordered to hold the plutonium if the high explosives fail, is
    standing at the Trinity site. Confidence in implosion has moved since it was ordered,
    and Groves wants the contingency money decided this week.
  guide: >-
    Jumbo would protect scarce plutonium if the high explosives fail, and it
    stands between the device and several of the diagnostics. The evidence for a
    successful test has moved since the vessel was ordered. The vessel's own
    hazards have not been assessed at the site. Diagnostics, site safety and
    recovery planning are needed whatever the test does. Cancelling every
    contingency saves the most and leaves no plan for a failure that is unlikely
    rather than impossible. A bounded assessment costs weeks, not months.
  rules: >-
    Spread the hundred points across the 3 proposals. At least 80 of them have to
    be committed, because a panel that funds almost nothing has not decided
    anything. Your largest single allocation must be 35 or more, and it has to
    land on what the evidence supports most. Keep the total sitting on proposals
    the evidence does not support under fifteen. And a proposal it does support
    should not be left under twenty.
  background:
  - >-
    Why the whole spread is graded. Funding is not a vote for one idea. A
    portfolio says what you think is likely, what is worth hedging against, and
    what is not worth pursuing at all — and the last two are where most of the
    information is. Backing the right proposal while quietly funding a bad one is
    a worse answer than it looks. That is why the small numbers count as much as
    the big one.
  - >-
    What the three numbers are for. Thirty-five is what makes a lead a lead: below
    it you have hedged rather than chosen. Fifteen is the most that can sit on
    unsupported work before it stops being a rounding error. Past that it is a
    second opinion nobody argued for. Twenty is the floor under a line of work you
    have already called strong, because funding it too thin to finish spends the
    money and buys nothing.
  - >-
    Why there is a floor on the total. Points held back are not caution; they are
    a decision not to decide, taken with somebody else's money and somebody else's
    deadline. The floor is what forces the panel to say something.
  takeaway: Good engineering retires or reshapes contingencies when their decision value changes.
  format: SCIENCETANK
  why: Jumbo illustrates how contingency plans can become less valuable as evidence changes, while consequence 
    management remains essential.
  proposals:
  - label: A
    text: Continue the containment-vessel plan regardless of new evidence.
  - label: B
    text: Shift funds toward diagnostics, site safety, and recovery plans while retaining a bounded contingency 
      assessment.
  - label: C
    text: Cancel every contingency because a successful test is now expected.
  recommended:
    B: 70
    A: 15
  answerText: "Recommended: 70 to B, 15 to A for limited contingency knowledge, 15 to site safety and reserve within B."
- group: E
  task: Match each situation to the best action, control, document, or interpretation. Each option is used once.
  title: Interfaces to Trinity diagnostics
  setup: Match each diagnostic concern to the correct engineering control.
  scene: >-
    Four instrument teams have set up at Trinity and each has written its own timing
    marks, coordinates and ranges. Bacher, who heads the physics division, has four
    complaints from the recording crews and wants each answered before the next dry run.
  guide: >-
    Four problems and four fixes. Pair them by asking what has become unrelatable:
    the times, the positions, the ranges, or the wiring a calibration belongs to.
    A record that cannot be tied to the event is a record of something else,
    however good the instrument was.
  background:
  - >-
    Why this is a matching board and not four separate questions. Responses on
    boards like this are written to be plausible for more than one situation, so
    choosing them one at a time lets a nearly-right answer through unexamined.
    Having to place all of them forces the comparison — not "is this reasonable
    here", but "is it more right here than there".
  - >-
    How to use the one-each rule. Because the responses are a set to be
    distributed rather than a list to be sampled, every join you make constrains
    the rest. Settling the two you are confident of can leave the remaining pair
    decided by elimination. Where it does not, two responses are still competing
    for one situation, and that is exactly the distinction the stop is testing.
  - >-
    Why you cannot be wrong about exactly one. With every response used once,
    three correct joins leave the fourth with only one place to go. Any error
    therefore involves at least two joins. That is worth remembering when the last
    pair looks forced: the fault is usually not in the join you are struggling
    with, but in one you made early and stopped questioning.
  takeaway: Measurement interfaces deserve the same control as hardware interfaces.
  format: PROTOCOL
  why: Diagnostics are useful only if their time, position, range, and configuration are traceable to the event.
  columns:
  - What is wrong with the record
  - How you fix it
  scenarios:
  - A camera time mark cannot be related to the firing command.
  - A cable change is made after the timing calibration.
  - Two instruments use different coordinate origins for the same event.
  - A recorder saturates at the expected signal level.
  choices:
  - Add a shared timing fiducial so the camera record can be aligned with the firing command and other instruments.
  - Re-run the delay measurement before the next shot and log the new hardware, because a correction belongs to the 
    wiring it was taken on.
  - Create one common coordinate system and interface drawing so every instrument describes the same physical location.
  - Add a lower-sensitivity channel or a different diagnostic so an unexpectedly strong signal does not saturate every 
    record.
  mapping: [0, 1, 2, 3]
  answerText: A camera time mark cannot be related to the firing command -> Add a shared timing fiducial so the camera 
    record can be aligned with the firing command and other instruments; A cable change is made after the timing 
    calibration -> Re-run the delay measurement before the next shot and log the new hardware, because a correction 
    belongs to the wiring it was taken on; Two instruments use different coordinate origins for the same event -> Create
    one common coordinate system and interface drawing so every instrument describes the same physical location; A 
    recorder saturates at the expected signal level -> Add a lower-sensitivity channel or a different diagnostic so an 
    unexpectedly strong signal does not saturate every record

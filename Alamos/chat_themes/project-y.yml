    no two are prepared the same way. One is visibly thick, one sits on a heavy backing.
    She wants each problem named before any of them goes under a counter.
  guide: >-
    Four symptoms and four fixes. Pair them by asking where in the arrangement the
    problem lives. In the sample itself? In what it sits on? In the air between?
    Or in the window? Geometry and materials can dominate a charged-particle
    measurement, which is why none of these fixes is about the source's activity.
  background:
  - >-
    Why this is a matching board and not four separate questions. Responses on
    boards like this are written to be plausible for more than one situation, so
    choosing them one at a time lets a nearly-right answer through unexamined.
    Having to place all of them forces the comparison — not "is this reasonable
    here", but "is it more right here than there".
  - >-
    How to use the one-each rule. Because the responses are a set to be
    distributed rather than a list to be sampled, every join you make constrains
    the rest. Settling the two you are confident of can leave the remaining pair
    decided by elimination. Where it does not, two responses are still competing
    for one situation, and that is exactly the distinction the stop is testing.
  - >-
    Why you cannot be wrong about exactly one. With every response used once,
    three correct joins leave the fourth with only one place to go. Any error
    therefore involves at least two joins. That is worth remembering when the last
    pair looks forced: the fault is usually not in the join you are struggling
    with, but in one you made early and stopped questioning.
  takeaway: Good sample preparation is part of the detector, not an afterthought.
  format: PROTOCOL
  why: Sample geometry and window materials can dominate charged-particle measurements.
  columns:
  - What the counter shows
  - What you do about it
  scenarios:
  - Alpha peak is broadened and shifted low
  - Beta rate changes with backing material
  - Counts vanish when the source is moved a few centimeters away
  - Window blocks nearly all events
  choices:
  - Prepare a thinner, more uniform deposit.
  - Standardize backing and geometry.
  - Recognize the short alpha range in air.
  - Use an appropriately thin entrance window.
  mapping: [0, 1, 2, 3]
  answerText: Alpha peak is broadened and shifted low -> Prepare a thinner, more uniform deposit; Beta rate changes with
    backing material -> Standardize backing and geometry; Counts vanish when the source is moved a few centimeters away 
    -> Recognize the short alpha range in air; Window blocks nearly all events -> Use an appropriately thin entrance 
    window

- group: P
  task: Allocate 100 research credits across the 3 proposals. You may hold credits in reserve, but explain the decision 
    criterion.
  title: Redundancy and common-mode failure
  setup: The current system relies on two detectors sharing the same clock and amplifier design.
  scene: >-
    Two channels have been agreeing all month, and Bacher has just noticed on the wiring
    diagram that they run off one clock and one amplifier design. A hundred credits are
    left for instrument work, and the readiness review is in three weeks.
  guide: >-
    Two channels agreeing is evidence only if they can fail apart. The existing
    channels share one clock, one power supply and one analysis assumption, so a
    fault in any of the three moves both together. A third identical detector on
    the same electronics raises the count and leaves all three shared. A different
    detector type with its own clock breaks all three, and costs more to build and
    to calibrate. A larger display changes how the traces are read and adds no
    channel.
  rules: >-
    Spread the hundred points across the 3 proposals. At least 80 of them have to
    be committed, because a panel that funds almost nothing has not decided
    anything. Your largest single allocation must be 35 or more, and it has to
    land on what the evidence supports most. Keep the total sitting on proposals
    the evidence does not support under fifteen. And a proposal it does support
    should not be left under twenty.
  background:
  - >-
    Why the whole spread is graded. Funding is not a vote for one idea. A
    portfolio says what you think is likely, what is worth hedging against, and
    what is not worth pursuing at all — and the last two are where most of the
    information is. Backing the right proposal while quietly funding a bad one is
    a worse answer than it looks. That is why the small numbers count as much as
    the big one.
  - >-
    What the three numbers are for. Thirty-five is what makes a lead a lead: below
    it you have hedged rather than chosen. Fifteen is the most that can sit on
    unsupported work before it stops being a rounding error. Past that it is a
    second opinion nobody argued for. Twenty is the floor under a line of work you
    have already called strong, because funding it too thin to finish spends the
    money and buys nothing.
  - >-
    Why there is a floor on the total. Points held back are not caution; they are
    a decision not to decide, taken with somebody else's money and somebody else's
    deadline. The floor is what forces the panel to say something.
  takeaway: Three copies of one instrument can still behave like one instrument.
  format: SCIENCETANK
  why: Independence matters more than count when all channels share the same failure mode.
  proposals:
  - label: A
    text: A third identical detector on the same electronics
  - label: B
    text: A different detector type with an independent clock
  - label: C
    text: A larger display for the existing traces
  recommended:
    B: 80
    A: 15
  answerText: "Recommended: 80 to B, 15 to A for capacity, 5 held; near-zero to C."
- group: P
  task: Arrange the four cards from earliest cause or prerequisite to latest result.
  title: Data acquisition architecture
  setup: Order the data-acquisition chain.
  scene: >-
    Hinton has a bench of unwired boxes: amplifiers, a digitiser, a trigger unit, cable
    drums. The shot is four weeks off, the fast experiment gets one chance to record
    anything at all, and the configuration sheet is still blank.
  guide: >-
    These four are one path from a sensor to a stored file. Ask of each card what
    it needs first. Nothing can be triggered on a signal too small to see. And a
    waveform stored without its configuration and timing may be impossible to
    interpret later.
  background:
  - >-
    Why the order is graded whole. A sequence is a claim about dependency: each
    step is here because the one before it has already happened, or has to have.
    One transposed pair falsifies that claim wherever it sits, so partial credit
    would be credit for a sequence that does not work.
  - >-
    Why the ends are the place to start. The first and last cards are constrained
    by having nothing before or after them, which usually makes them the two you
    can settle from the scene alone. Pinning them collapses the remaining
    arrangements sharply, and what is left in the middle is where the actual
    judgement lives.
  - >-
    What the rail can be ordered on. Time is the usual axis, but it is not the
    only one. An order can run on cost, on risk, or on reversibility — every
    observation that leaves the sample as it was, before any that consumes it. On
    those boards a chronological reading finds nothing, because none of the steps
    has to happen at a particular hour.
  takeaway: Data quality includes the record of how the data were produced.
  format: SEQUENCE
  why: A waveform without configuration and timing metadata may be impossible to interpret later.
  cards:
  - Condition and amplify the analog sensor output
  - Apply a trigger or continuous sampling rule
  - Digitize and timestamp the waveform
  - Store data with configuration and calibration metadata
  order: [0, 1, 2, 3]
  answerText: 2 -> 3 -> 4 -> 5 (Condition and amplify the analog sensor output -> Apply a trigger or continuous sampling
    rule -> Digitize and timestamp the waveform -> Store data with configuration and calibration metadata)
- group: P
  task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
  title: Field instrumentation
  setup: Match each field risk to the best mitigation.
  scene: >-
    Norris Bradbury, who is assembling the Trinity shot, has come back from the desert
    with a list. Long cable runs, no shelter, borrowed power, and a two-hour drive to the
    nearest spare. Everything in the bay has to survive out there once.
  guide: >-
    Four field problems and four responses. Pair them by asking where the problem
    arises: in the cable, in the surrounding electrical noise, in the access, or
    in the mechanics. None of these exists on a laboratory bench, which is why
    field design starts from the failure modes rather than from the measurement.
  background:
  - >-
    Why this is a matching board and not four separate questions. Responses on
    boards like this are written to be plausible for more than one situation, so
    choosing them one at a time lets a nearly-right answer through unexamined.
    Having to place all of them forces the comparison — not "is this reasonable
    here", but "is it more right here than there".
  - >-
    How to use the one-each rule. Because the responses are a set to be
    distributed rather than a list to be sampled, every join you make constrains
    the rest. Settling the two you are confident of can leave the remaining pair
    decided by elimination. Where it does not, two responses are still competing
    for one situation, and that is exactly the distinction the stop is testing.
  - >-
    Why you cannot be wrong about exactly one. With every response used once,
    three correct joins leave the fourth with only one place to go. Any error
    therefore involves at least two joins. That is worth remembering when the last
    pair looks forced: the fault is usually not in the join you are struggling
    with, but in one you made early and stopped questioning.
  takeaway: A field instrument must survive, synchronize, and explain its own health.
  format: PROTOCOL
  why: Field measurement design begins with failure modes that do not exist on the laboratory bench.
  columns:
  - The field problem
  - How you handle it
  scenarios:
  - Long analog cable degrades a fast pulse
  - Strong electromagnetic transient couples into wiring
  - Sensor cannot be accessed after installation
  - Mechanical shock threatens connectors
  choices:
  - Digitize closer to the sensor or characterize cable response.
  - Use shielding, grounding, and differential transmission.
  - Add remote health checks and redundant channels.
  - Use qualified connectors and strain relief.
  mapping: [0, 1, 2, 3]
  answerText: Long analog cable degrades a fast pulse -> Digitize closer to the sensor or characterize cable response; 
    Strong electromagnetic transient couples into wiring -> Use shielding, grounding, and differential transmission; 
    Sensor cannot be accessed after installation -> Add remote health checks and redundant channels; Mechanical shock 
    threatens connectors -> Use qualified connectors and strain relief
- group: P
  task: Arrange the four cards from earliest cause or prerequisite to latest result.
  title: Blind analysis and data integrity
  setup: Order a simple blind-analysis workflow.
  scene: >-
    Everybody in the room already knows what the theory division predicts. The last two
    analyses were adjusted twice each before they were reported, and Bacher has asked for
    the workflow written down before this run is touched.
  guide: >-
    All four steps happen, so ask which of them cannot be reversed. Once you have
    seen the answer-sensitive data, no later care restores the state you were in
    before. So the selections, the tuning and the freeze all belong on one side of
    that moment, and the result on the other.
  background:
  - >-
    Why the order is graded whole. A sequence is a claim about dependency: each
    step is here because the one before it has already happened, or has to have.
    One transposed pair falsifies that claim wherever it sits, so partial credit
    would be credit for a sequence that does not work.
  - >-
    Why the ends are the place to start. The first and last cards are constrained
    by having nothing before or after them, which usually makes them the two you
    can settle from the scene alone. Pinning them collapses the remaining
    arrangements sharply, and what is left in the middle is where the actual
    judgement lives.
  - >-
    What the rail can be ordered on. Time is the usual axis, but it is not the
    only one. An order can run on cost, on risk, or on reversibility — every
    observation that leaves the sample as it was, before any that consumes it. On
    those boards a chronological reading finds nothing, because none of the steps
    has to happen at a particular hour.
  takeaway: Data integrity is both a technical and organizational property.
  format: SEQUENCE
  why: Blinding prevents unconscious tuning toward a desired answer.
  cards:
  - Define selections and validation tests before viewing the answer-sensitive region
  - Develop and tune using simulations, sidebands, or calibration data
  - Freeze the analysis and document software versions
  - Unblind, compute the result, and perform prespecified checks
  order: [0, 1, 2, 3]
  answerText: 2 -> 3 -> 4 -> 5 (Define selections and validation tests before viewing the answer-sensitive region -> 
    Develop and tune using simulations, sidebands, or calibration data -> Freeze the analysis and document software 
    versions -> Unblind, compute the result, and perform prespecified checks)
- group: CM
  task: Arrange the four cards from earliest cause or prerequisite to latest result.
  title: Mass balance
  setup: Order the bookkeeping workflow.
  scene: >-
    Glenn Seaborg, the chemist isolating the plutonium, has a run whose numbers do not
    close. Nobody can yet say whether the missing material is in the waste, in the
    equipment, or only in the arithmetic. Nothing leaves the building on a ledger like
    that.
  guide: >-
    All four steps happen, so ask what each one needs defined before it. Nothing
    can be counted as coming in until there is a boundary for it to cross. And a
    balance cannot be closed until the inventory change is known, which is the
    part people leave out.
  background:
  - >-
    Why the order is graded whole. A sequence is a claim about dependency: each
    step is here because the one before it has already happened, or has to have.
    One transposed pair falsifies that claim wherever it sits, so partial credit
    would be credit for a sequence that does not work.
  - >-
    Why the ends are the place to start. The first and last cards are constrained
    by having nothing before or after them, which usually makes them the two you
    can settle from the scene alone. Pinning them collapses the remaining
    arrangements sharply, and what is left in the middle is where the actual
    judgement lives.
  - >-
    What the rail can be ordered on. Time is the usual axis, but it is not the
    only one. An order can run on cost, on risk, or on reversibility — every
    observation that leaves the sample as it was, before any that consumes it. On
    those boards a chronological reading finds nothing, because none of the steps
    has to happen at a particular hour.
  takeaway: Missing mass is often missing measurement or an undefined boundary.
  format: SEQUENCE
  why: A balance cannot close until the boundary and inventory change are defined.
  cards:
  - Define the system boundary and time interval
  - Measure or estimate all incoming streams
  - Measure product, waste, and inventory changes
  - Compare inputs and outputs with uncertainty
  order: [0, 1, 2, 3]
  answerText: 2 -> 3 -> 4 -> 5 (Define the system boundary and time interval -> Measure or estimate all incoming streams
    -> Measure product, waste, and inventory changes -> Compare inputs and outputs with uncertainty)
- group: CM
  task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
  title: Oxidation states
  setup: Match each goal to the most direct chemical lever.

  task: Arrange the four cards from earliest cause or prerequisite to latest result.
  title: Configuration control after a design change
  setup: Order the change-control process.
  scene: >-
    An anomaly found last week has produced a sensible local improvement, and two
    divisions have already started building to it. With Trinity approaching, Oppenheimer
    wants the change routed properly rather than adopted a shop at a time.
  guide: >-
    All four steps happen, so ask what each one has to cover. A change reviewed by
    one division misses the interfaces it shares with the others. And a revision
    approved before the affected test results are identified leaves earlier
    evidence attached to a configuration that no longer exists.
  background:
  - >-
    Why the order is graded whole. A sequence is a claim about dependency: each
    step is here because the one before it has already happened, or has to have.

    one sheet and a measurement of the same feature on another. They agree. The question
    in the room is what that agreement is worth as evidence for Fat Man.
  guide: >-
    All four steps happen, so ask which of them cannot be reordered. A prediction
    made after the data is not a prediction. And a model updated on one set of
    data has to be tested on another, because a fit is not a forecast. That is how
    a model earns any authority at all.
  background:
  - >-
    Why the order is graded whole. A sequence is a claim about dependency: each
    step is here because the one before it has already happened, or has to have.
    One transposed pair falsifies that claim wherever it sits, so partial credit
    would be credit for a sequence that does not work.
  - >-
    Why the ends are the place to start. The first and last cards are constrained
    by having nothing before or after them, which usually makes them the two you
    can settle from the scene alone. Pinning them collapses the remaining
    arrangements sharply, and what is left in the middle is where the actual
    judgement lives.
  - >-
    What the rail can be ordered on. Time is the usual axis, but it is not the
    only one. An order can run on cost, on risk, or on reversibility — every
    observation that leaves the sample as it was, before any that consumes it. On
    those boards a chronological reading finds nothing, because none of the steps
    has to happen at a particular hour.
  takeaway: Post hoc agreement is weaker than a successful pre-test prediction.
  format: SEQUENCE
  why: A model earns predictive authority by confronting data it did not already absorb.
  cards:
  - Generate pre-test predictions for specific observables, including uncertainty bands.
  - Conduct the controlled experiment without retuning the prediction afterward.
  - Compare arrival times, transmission histories, radiographs, and symmetry metrics.
  - Update model parameters or model form, and test that version on a fresh experiment.
  order: [0, 1, 2, 3]
  answerText: 1 -> 2 -> 3 -> 4 (Generate pre-test predictions for specific observables, including uncertainty bands. -> 
    Conduct the controlled experiment without retuning the prediction afterward. -> Compare arrival times, transmission 
    histories, radiographs, and symmetry metrics. -> Update model parameters or model form, then test the revised model 
    on a new experiment.)

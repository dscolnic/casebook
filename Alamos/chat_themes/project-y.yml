    takesAsRead:
    - Pressure, temperature and equations of state
    assumes:
    - a chain reaction started early releases energy early
    takeaway: Material physics can determine the required system architecture.
    format: PROTOCOL
    answerText: "Reactor-produced plutonium contains isotopic components with a higher spontaneous-neutron background -> Count
      what the material emits while it sits still on the bench. Whatever comes out unprompted sets the clock every assembly
      scheme has to beat; A comparatively slow assembly remains vulnerable to an early neutron -> Recognize the timing problem:
      a slower assembly gives a stray neutron more opportunity to start the chain reaction too early; An early chain reaction
      can disrupt the assembly before the intended state is reached -> Predict pre-initiation: early fission releases energy
      before full assembly and disrupts the material, producing a much weaker result; Los Alamos therefore reorganizes around
      a fast squeeze that arrives evenly from every side -> Shift to rapid implosion, which squeezes the material from all
      sides and shortens the vulnerable assembly time"
    why: "Reactor-produced plutonium contains isotopes that emit neutrons on their own. The material supplies its own stray
      neutrons, at a rate nobody chose. A slow assembly spends longer in the state where one of those could start the chain.
      A chain that starts early releases enough energy to blow the pieces apart before most of the material has reacted. That
      is pre-initiation. It is a property of the material, not a defect better workmanship can fix. Implosion is the answer:
      squeeze from all sides, and cut the vulnerable time."
    call: Explain why plutonium required implosion
    reason: Once the material result is trusted, you must decide today whether it breaks the key timing assumption behind the old plan.
    setup: Match each observation to its implication for the plutonium weapon program.
    rebuttals:
    - The higher spontaneous-neutron background in reactor-produced plutonium is a material measurement. It is the fact 
      everything downstream follows from.
    - "A slow assembly staying vulnerable longer is the timing consequence: more time in the dangerous state means more chances
      for a stray neutron."
    - An early chain reaction disrupting the assembly is pre-initiation — the physical consequence, and the reason the 
      timing matters.
    - Reorganising around a fast squeeze arriving evenly from every side is the programme's response. It is what the 
      laboratory did about the first three, not another fact about the material.
    columns:
    - What is true of the material
    - What follows for the design
    scenarios:
    - Reactor-produced plutonium contains isotopic components with a higher spontaneous-neutron background.
    - A comparatively slow assembly remains vulnerable to an early neutron.
    - An early chain reaction can disrupt the assembly before the intended state is reached.
    - Los Alamos therefore reorganizes around a fast squeeze that arrives evenly from every side.
    choices:
    - Count what the material emits while it sits still on the bench. Whatever comes out unprompted sets the clock every
      assembly scheme has to beat.
    - "Recognize the timing problem: a slower assembly gives a stray neutron more opportunity to start the chain reaction
      too early."
    - "Predict pre-initiation: early fission releases energy before full assembly and disrupts the material, producing a much
      weaker result."
    - Shift to rapid implosion, which squeezes the material from all sides and shortens the vulnerable assembly time.

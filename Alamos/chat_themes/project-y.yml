    assumes:
    - a detonation travels outward from where it starts
    takeaway: A successful pivot preserves the evidence that killed the old plan and gives the new plan explicit tests 
      it can still fail.
    format: SEQUENCE
    answerText: Record the failed assumption and evidence → state the replacement program's testable requirements → 
      build independent diagnostics and inert tests → commit the integrated schedule only after pass/fail evidence 
      exists.
    why: A pivot is more than moving people. The laboratory first records the failed assumption and the measurements 
      that disproved it. It then states the new program-level requirements without pretending the replacement is already
      validated. Independent diagnostics are built around those requirements. Only after the tests can actually 
      distinguish success from failure does the integrated schedule become meaningful.
    call: Move from outward detonation to inward compression
    reason: The replacement effort needs testable claims now, or the lab will trade one unsupported plan for another.
    setup: Order the physical chain from initiation through inward compression.
    rebuttals:
    - Preserve the evidence first. Otherwise the laboratory can later rewrite why the old program ended.
    - Requirements come before tests; a test without a claim is only activity.
    - Independent diagnostics come before integration so failures can still be attributed.
    - The schedule is last because dates built on undefined evidence are only promises.
    cards:
    - A written record names the failed assumption and the measurements that disproved it.
    - The replacement program has system-level requirements stated as testable claims.
    - Independent diagnostics and inert experiments can falsify the replacement claims.
    - The integrated schedule has defined pass/fail evidence at each gate.
    order:
    - 0
    - 1
    - 2
    - 3
- title: Can Compression Be Predicted?
  objective: Connect high-pressure material behavior, phase changes, and inert wave-shaping experiments while keeping 
    model limits visible.
  briefing: The new program depends on matter behaving predictably under extreme compression, but equations of state and
    phase behavior are uncertain outside ordinary laboratory conditions. The player checks compression work, diagnoses a
    phase-model mismatch, and designs an inert wave-shaping measurement that can test symmetry without revealing 
    weapon-construction details.
  stake: It is September 1944, and the new plan depends on matter under pressures no table can fully describe. A metal
    shifts form, and two tools disagree about an inert test. Today you must decide what the models truly support and which
    new check is needed. The danger is not what the lab does not know, but what it thinks it knows.
  takeaway: Extreme-condition models need independent material measurements and inert validation tests before their 
    extrapolations can be trusted.
  stops:

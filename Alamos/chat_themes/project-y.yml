    moving at roughly the speed of sound, so it arrives after the light does; Electromagnetic radiation carries intense 
    heat outward -> Thermal radiation. Arrives first at light speed, and is stopped by anything opaque between source 
    and target; Neutrons and gamma rays released in the first instants -> Prompt ionizing radiation. Delivered within 
    moments and only near the event, because air attenuates it strongly; Fission products and activated material can be 
    transported and deposited after the event -> Residual radiation and fallout. The one channel that persists for days 
    to years and can be carried far downwind
- group: X
  task: Allocate 100 research credits across the 3 proposals. You may hold credits in reserve, but explain the decision 
    criterion.
  title: Final Project Y synthesis
  setup: The final review has 100 curriculum credits to preserve the most important lessons.
  scene: >-
    The final review has one page to say what Project Y was without reducing it to a clever device. The record has to hold
    the physics, the evidence system, the organization, and the human consequences together.
  guide: >-
    The three chains on the board are not alternatives to one another. The weapon
    existed because all three held at once. The physics chain is what a
    measurement can settle, and it is the best documented of the three. The
    engineering chain is where reproducibility, timing and configuration control
    decide whether a principle becomes a device anybody can deliver. The third
    covers Trinity, Nagasaki, radiation effects, secrecy and dissent. Its evidence
    is the only kind here that is not a laboratory record.
  rules: >-
    Spread the hundred points across the 3 proposals. At least 80 of them have to
    be committed, because a panel that funds almost nothing has not decided
    anything. Your largest single allocation must be 35 or more, and it has to
    land on what the evidence supports most. Keep the total sitting on proposals
    the evidence does not support under fifteen. And a proposal it does support
    should not be left under twenty.
  background:
  - >-
    Why the whole spread is graded. Funding is not a vote for one idea. A
    portfolio says what you think is likely, what is worth hedging against, and
    what is not worth pursuing at all — and the last two are where most of the
    information is. Backing the right proposal while quietly funding a bad one is
    a worse answer than it looks. That is why the small numbers count as much as
    the big one.
  - >-
    What the three numbers are for. Thirty-five is what makes a lead a lead: below
    it you have hedged rather than chosen. Fifteen is the most that can sit on
    unsupported work before it stops being a rounding error. Past that it is a
    second opinion nobody argued for. Twenty is the floor under a line of work you
    have already called strong, because funding it too thin to finish spends the
    money and buys nothing.
  - >-
    Why there is a floor on the total. Points held back are not caution; they are
    a decision not to decide, taken with somebody else's money and somebody else's
    deadline. The floor is what forces the panel to say something.
  takeaway: The complete lesson is how science, systems, institutions, secrecy, and human consequences became 
    inseparable.
  format: SCIENCETANK
  why: Project Y cannot be understood as only a physics problem, only an engineering program, or only a historical 
    event.
  proposals:
  - label: A
    text: 'Preserve the nuclear-physics and measurement lessons: models, statistics, calibration, and uncertainty.'
  - label: B
    text: 'Preserve the systems lessons: interfaces, independent diagnostics, configuration control, and program pivots.'
  - label: C
    text: 'Preserve the historical and human record: secrecy, displacement, Trinity downwinders, Hiroshima and Nagasaki, scientific
      dissent, and postwar responsibility.'
  recommended:
    A: 35
    B: 35
    C: 30
  answerText: "Recommended: a balanced portfolio across physical reasoning, evidence-and-systems engineering, and historical/human
    consequences."
- group: T
  task: The two labels on the crate give different counts for the same nucleus. What does the disagreement mean?
  title: The nucleus as a physical system — Review
  concept: "Nuclear structure: protons, neutrons, isotopes, nuclide notation"
  setup: A crate arrives labelled twice, and the stockroom cannot book it in until the two labels are reconciled.
  scene: >-
    A crate reaches the stockroom with a label on each end, and the two do not describe
    the same nucleus. One counts 92 protons and 146 neutrons. The other reads uranium
    235. Hans Bethe, who heads the Theoretical Division, wants it settled before the
    material is booked in.
  guide: >-
    One label counts particles and the other is a nuclide name, so put them in the
    same currency before comparing. A mass number is protons and neutrons added
    together. The element is fixed by the proton count alone, and that part is not in
    dispute here. What is in dispute is what the nucleus weighs.
  background:
  - >-
    Why the wrong options are the interesting ones. Each distractor is written to
    be the answer under one specific misreading — a step skipped, a quantity
    confused with a rate, a correlation taken for a cause. Identifying which
    misreading each belongs to is where the learning is; the right answer alone
    can be reached on instinct and teach nothing.
  - >-
    Why the shape of an option tells you nothing. A correct answer collects the
    qualifying clause and the unit. So across a whole game the key used to be the
    longest option far more often than chance — 88 per cent of passage quizzes
    here, before it was fixed. It is now checked per game as a binomial tail, so
    length, hedging and specificity have had the signal taken out of them
    deliberately.
  - >-
    What the verdict adds. Every wrong option carries its own rebuttal, and the
    verdict prints them — the reason that option fails, not a restatement of the
    right one. They are worth reading after a correct answer as well: a right
    choice made for an approximate reason is indistinguishable from a sound one
    until the day the approximation is what is being tested.
  assumes:
  - an atom has a nucleus of protons and neutrons, with electrons around it
  takeaway: Chemical identity and nuclear identity are separate facts, and a label stating only one of them is 
    incomplete.
  format: CHOICE
  why: A nuclide symbol carries two facts and they are not interchangeable. The element name is the proton count, and 
    that alone settles the chemistry. The mass number is protons and neutrons together. So 92 protons with 146 neutrons 
    is mass 238, and the crate is uranium 238 by one label and uranium 235 by the other. Same element, same behaviour in
    a beaker, a different nucleus and a very different cross section. No chemical assay on this mesa would tell the two 
    apart.
  rebuttals:
  - A neutral uranium atom always carries 92 electrons, but nothing fixes how many neutrons sit in the nucleus. That 
    freedom is what isotopes are.
  - Neutrons carry no charge, so adding them changes the mass and leaves the element exactly where it was.
  - Both labels describe one nucleus, one by counting its parts and one by naming it, so they are directly comparable.
  choices:
  - Two nuclides of the same element, because 92 protons with 146 neutrons is mass 238 rather than 235.
  - One nuclide written two ways, because a neutral atom of an element has a fixed neutron count.
  - Two different elements, because adding neutrons moves a nucleus along the periodic table.
  - Nothing comparable, because one label counts particles and the other reports a chemical weight.
  answer: Two nuclides of the same element, because 92 protons with 146 neutrons is mass 238 rather than 235.
  answerText: Two nuclides of the same element, because 92 protons with 146 neutrons is mass 238 rather than 235.
- group: CM
  task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
  title: Isotopes and chemical identity — Review
  concept: "Nuclear structure: protons, neutrons, isotopes, nuclide notation"
  setup: Four stockroom questions about one delivery, each answered by a different property.
  scene: >-
    Lilli Hornig, the chemist working on lenses and plutonium, has four questions from the
    stockroom on one sheet. Each turns on the same thing. Does the property being asked
    about belong to the electrons of the delivered material, or to its nucleus?
  guide: >-
    Four questions and four places to look. Ask of each whether the property lives in the
    electron shells or in the nucleus. Bonding and dissolving are electrons, and a few
    extra neutrons barely disturb them. What an arriving neutron does is nuclear. And a
    physical separation has only the mass to work with.
  background:
  - >-
    Why this is a matching board and not four separate questions. Responses on
    boards like this are written to be plausible for more than one situation, so
    choosing them one at a time lets a nearly-right answer through unexamined.
    Having to place all of them forces the comparison — not "is this reasonable
    here", but "is it more right here than there".
  - >-
    How to use the one-each rule. Because the responses are a set to be
    distributed rather than a list to be sampled, every join you make constrains
    the rest. Settling the two you are confident of can leave the remaining pair
    decided by elimination. Where it does not, two responses are still competing
    for one situation, and that is exactly the distinction the stop is testing.
  - >-
    Why you cannot be wrong about exactly one. With every response used once,
    three correct joins leave the fourth with only one place to go. Any error
    therefore involves at least two joins. That is worth remembering when the last
    pair looks forced: the fault is usually not in the join you are struggling
    with, but in one you made early and stopped questioning.
  assumes:
  - chemical bonding is a property of the electrons
  takeaway: Which method can see a difference depends on where in the atom that difference lives.
  format: PROTOCOL
  why: Chemical behaviour is decided by the electron shells, and the electron count follows from the proton count alone.
    Two isotopes therefore carry the same shells, dissolve in the same acid, and behave alike in every reaction, which 
    is why no chemical assay separates them. What an arriving neutron does is decided in the nucleus, and there the two 
    are not alike at all. The one handle left is mass, and every separation plant built for this project works on 
    nothing else.
  columns:
  - What the stockroom is asking
  - Where the answer lives
  scenarios:
  - Whether two deliveries will dissolve in the same acid
  - Whether one delivery will fission on slow neutrons and the other will not
  - Whether a chemical assay can tell the two deliveries apart
  - Whether the two can be separated at all
  choices:
  - The electron shells, which the extra neutrons barely disturb.
  - The nucleus, which decides what an arriving neutron does.
  - Neither one, because the chemistry is identical and the assay is blind to it.
  - The mass difference, which is the only handle a physical method has.
  mapping: [0, 1, 2, 3]
  answerText: Whether two deliveries will dissolve in the same acid -> The electron shells, which the extra neutrons 
    barely disturb; Whether one delivery will fission on slow neutrons and the other will not -> The nucleus, which 
    decides what an arriving neutron does; Whether a chemical assay can tell the two deliveries apart -> Neither one, 
    because the chemistry is identical and the assay is blind to it; Whether the two can be separated at all -> The mass
    difference, which is the only handle a physical method has
- group: P
  task: Arrange the four cards from earliest cause or prerequisite to latest result.
  title: Ionization and detector signals — Review
  concept: "Detectors: ionisation, count rate, efficiency, dead time"
  setup: Order the steps that turn a raw overnight count into a quoted source activity.
  scene: >-
    Leona Woods, who builds the counters here, has a tape of raw counts from an
    overnight run and a figure somebody has already quoted from it. She wants the steps
    between the two written out in order before that figure goes any further.
  guide: >-
    These four are one chain, and the number at the end is meant to belong to the source
    rather than to the counter. Ask of each card what has to exist before it. Nothing
    can be corrected as a rate until it is a rate. And nothing about the source can be
    claimed while the instrument is still inside the number.
  background:
  - >-
    Why the order is graded whole. A sequence is a claim about dependency: each
    step is here because the one before it has already happened, or has to have.
    One transposed pair falsifies that claim wherever it sits, so partial credit
    would be credit for a sequence that does not work.
  - >-
    Why the ends are the place to start. The first and last cards are constrained
    by having nothing before or after them, which usually makes them the two you
    can settle from the scene alone. Pinning them collapses the remaining
    arrangements sharply, and what is left in the middle is where the actual
    judgement lives.
  - >-
    What the rail can be ordered on. Time is the usual axis, but it is not the
    only one. An order can run on cost, on risk, or on reversibility — every
    observation that leaves the sample as it was, before any that consumes it. On
    those boards a chronological reading finds nothing, because none of the steps
    has to happen at a particular hour.
  takesAsRead:
  - Decay constant, half-life and activity
  assumes:
  - a counter records only a fraction of the events that happen
  takeaway: A reported quantity belongs to the source only once everything belonging to the instrument has been taken 
    back out.
  format: SEQUENCE
  why: A counter reports its own events, never the source. The pulses are totalled first, then divided by the live time,
    because every correction after that is written as a rate. Next the background rate comes out, measured with the 
    source taken away, since the counter answers to cosmic rays and to contamination whether or not anything is on the 
    shelf. Only then does efficiency convert what was detected into what actually decayed. Skip a step and the figure 
    quoted is a property of the apparatus.
  rebuttals:
  - Counting the pulses is where it starts. Everything after it is a correction applied to that total.
  - A total over an unstated interval is not a rate, and every correction that follows is written as a rate.
  - The background is what the counter reports with the source taken away, so it comes out before anything is claimed.
  - Efficiency is last because it is the only step that turns a counter reading into a statement about the source.
  cards:
  - Count the pulses recorded over the run
  - Convert the total into a rate per second
  - Subtract the background rate measured with the source removed
  - Divide by the detector efficiency to reach decays per second
  order: [0, 1, 2, 3]
  answerText: 2 -> 3 -> 4 -> 5 (Count the pulses recorded over the run -> Convert the total into a rate per second -> 
    Subtract the background rate measured with the source removed -> Divide by the detector efficiency to reach decays 
    per second)
- group: E
  task: The two routes end at the same physical condition. Which difference between them should drive the order sheet?
  title: Two weapon architectures at Los Alamos — Review
  concept: "Criticality: mass, geometry, reflectors, moderation"
  setup: Ordnance must choose which difference between the two assembly routes commits the long-lead order.
  scene: >-
    William Parsons, who runs the Ordnance Division, has a long-lead order sheet in
    front of him and a fortnight to sign it. Two assembly routes are still open, and
    what he signs commits buildings and people to one of them.
  guide: >-
    Four differences between the routes, and both routes end at the same physical
    condition. Ask of each whether it separates them at all. Mass, geometry, reflection
    and moderation are available to either design. Three of these are therefore
    describing something both can do, and one is not.
  background:
  - >-
    Why the wrong options are the interesting ones. Each distractor is written to
    be the answer under one specific misreading — a step skipped, a quantity
    confused with a rate, a correlation taken for a cause. Identifying which
    misreading each belongs to is where the learning is; the right answer alone
    can be reached on instinct and teach nothing.
  - >-
    Why the shape of an option tells you nothing. A correct answer collects the
    qualifying clause and the unit. So across a whole game the key used to be the
    longest option far more often than chance — 88 per cent of passage quizzes
    here, before it was fixed. It is now checked per game as a binomial tail, so
    length, hedging and specificity have had the signal taken out of them
    deliberately.
  - >-
    What the verdict adds. Every wrong option carries its own rebuttal, and the
    verdict prints them — the reason that option fails, not a restatement of the
    right one. They are worth reading after a correct answer as well: a right
    choice made for an approximate reason is indistinguishable from a sound one
    until the day the approximation is what is being tested.
  takesAsRead:
  - Fission, neutron multiplication and chain reactions
  assumes:
  - criticality depends on geometry and surroundings as well as on mass
  takeaway: When two designs reach the same physical condition, the engineering choice is about the path and its timing.
  format: CHOICE
  why: Criticality answers to mass, geometry, reflection and moderation together, and both routes are aiming at the same
    condition. What separates them is the path taken to reach it. One drives two pieces along a line and is limited by 
    how fast a piece can travel. The other squeezes a shell inward, is very much faster, and has never been built. Speed
    is what the order sheet is really buying, because an assembly only counts if it finishes before a stray neutron 
    arrives.
  rebuttals:
  - Mass alone does not settle criticality. Geometry, reflection and moderation move the same mass either side of the 
    boundary.
  - A reflector lowers the mass needed and either route can carry one, so it does not separate the two paths.
  - Crew size is a real handling concern, and it is not what the assembly time depends on.
  choices:
  - How fast each route can carry the pieces from clearly subcritical to well past critical.
  - Which route needs the smaller total mass of active material, since mass is the whole of criticality.
  - Which route uses the thicker reflector, because reflection is what makes the difference.
  - Which route can be assembled by fewer people, since that lowers the handling risk.
  answer: How fast each route can carry the pieces from clearly subcritical to well past critical.
  answerText: How fast each route can carry the pieces from clearly subcritical to well past critical.

# Diagnosis panels shared by several lessons, expanded at load by normalize.js.
packs:
  p6:
    id: p6
    level: L2
    title: The excess that would not go away
    role: You are deciding whether a weak sample is really emitting anything.
    hook: A sample has been counting about 40% above the rate recorded last week. The group wants to log it as a genuine
      activity increase. Before that goes in the book, the counting station has been put through a short series of 
      checks.
    riddle: Something in this room is producing counts. What is it?
    salient:
    - shield
    - hvoff
    zones:
      source: Sample stage
      detector: Detector
      room: Room and shielding
      elec: Electronics
    readings:
      gross:
        name: Gross count rate, sample in place
        zone: source
        observed: 138 counts/min
        reference: about 98 counts/min last week
        purpose: The total rate from everything the detector can see. It cannot separate the sample from anything else 
          contributing.
      blank:
        name: Rate with the sample removed
        zone: detector
        observed: 131 counts/min
        reference: about 95 counts/min last week
        purpose: What the station counts with nothing on the stage. If the excess survives here it was never coming from
          the sample.
      shield:
        name: Effect of extra lead around the detector
        zone: room
        observed: no measurable change
        reference: external gamma sources are attenuated by roughly half
        purpose: Lead placed outside the detector attenuates radiation arriving from the room. It does nothing about a 
          source already inside the shield.
      hvoff:
        name: Counts with detector high voltage off
        zone: elec
        observed: 0 counts/min
        reference: 0 counts/min
        purpose: With no bias the detector cannot multiply real events, so anything still counted is electrical. Silence
          here clears the amplifier chain and nothing else.
      swap:
        name: Detector moved to a clean room, no sample
        zone: detector
        observed: excess persists
        reference: excess should be left behind
        purpose: Whether the excess travels with the hardware or stays with the location. This separates a contaminated 
          instrument from a changed environment.
      secondet:
        name: Second identical detector, same room
        zone: room
        observed: normal rate
        reference: normal rate
        purpose: An independent instrument in the same place. A genuine change in the room should appear on both.
      repeat:
        name: Ten repeat measurements
        zone: detector
        observed: all within 3% of each other
        reference: expected random spread of about 3%
        purpose: Whether the effect reproduces. A fluctuation does not survive repetition; a real cause does.
    hypotheses:
      realsample:
        label: The sample really is more active
        choice: The material on the stage is emitting more than it was, and the counting station is reporting it 
          correctly.
        sig:
          gross: hi
          blank: norm
          shield: drop
          hvoff: zero
          swap: gone
          secondet: norm
          repeat: consistent
      roombg:
        label: Room background has risen
        choice: Something stored nearby is raising the radiation level at this bench, so every measurement made here 
          reads high.
        sig:
          gross: hi
          blank: hi
          shield: drop
          hvoff: zero
          swap: gone
          secondet: hi
          repeat: consistent
      contam:
        label: The detector or its holder is contaminated
        choice: Loose activity has transferred onto the instrument itself, so it counts its own contamination wherever 
          it goes.
        sig:
          gross: hi
          blank: hi
          shield: nochange
          hvoff: zero
          swap: persists
          secondet: norm
          repeat: consistent
      noisefloor:
        label: Electrical noise is being counted
        choice: Instability in the bias supply or amplifier is producing pulses large enough to cross the threshold and 
          be recorded as events.
        sig:
          gross: hi
          blank: hi
          shield: nochange
          hvoff: hi
          swap: persists
          secondet: norm
          repeat: consistent
      statfluke:
        label: Nothing to explain — ordinary statistical spread
        choice: Counting is a random process, and a run that lands high by chance needs no cause beyond the statistics.
        sig:
          gross: norm
          blank: norm
          shield: drop
          hvoff: zero
          swap: gone
          secondet: norm
          repeat: varies
    dismissal: statfluke
    answer: contam
    reasons:
      realsample: It explains the high gross rate, and it would be the convenient answer. But the excess is still there 
        with the sample off the stage — 131 counts/min against a 95 baseline. Whatever is counting is not on the stage.
      roombg: "It explains an excess that survives removing the sample. It fails twice: the second detector in the same room
        reads normal, and the excess follows the instrument to a clean room instead of staying behind."
      noisefloor: "It fits the two loud findings exactly — a persisting excess that extra lead does not touch. It dies on
        the high-voltage test: with the bias off, the counter records nothing at all, so the pulses are real ionization, not
        electronics."
      statfluke: 10 repeats agree within 3%. Chance spread does not reproduce ten times, and it cannot survive removing 
        the sample.
    resolve:
      title: The instrument is counting itself
      paras:
      - Loose activity has transferred onto the detector or its sample holder. The station is measuring a real source of
        radiation, which is why the pulses behave in every way like genuine events — they are genuine events. They are 
        simply not coming from the sample anyone cares about.
      - This is the failure that background measurement exists to catch. A contaminated instrument produces a stable, 
        reproducible, physically plausible excess. It survives repetition, it has the right pulse character, and it will
        happily be logged as a discovery.
      why:
        loud: The two headline findings — an excess that persists with the sample removed, and extra shielding that 
          changes nothing — narrow this to a source inside the shield, either contamination or electronics. Neither 
          finding can separate those two.
        quiet: "Silence with the high voltage off is what settles it. That single quiet reading eliminates electronics entirely,
          because a dead detector cannot produce ionization pulses. The normal second detector and the excess travelling to
          a clean room then corroborate: the activity is on this instrument."
      chain:
      - Loose activity transfers onto the detector or holder
      - The instrument counts its own contamination as if it were sample
      - Every sample measured on this station reads high until it is cleaned
      take: Measure the background with the instrument you will use, not just the room you will use it in.
    logic:
    - - Excess survives removing the sample
      - the source is not on the stage
    - - Extra lead changes nothing
      - "the source is inside the shield: contamination or electronics"
    - - No counts with the bias off
      - electronics cleared — the pulses are real ionization
    - - Excess follows the detector to a clean room
      - the activity is on the instrument
  cm8:
    id: cm8
    level: L2
    title: The batch that does not add up
    role: You are reconciling a separation batch whose numbers do not close.
    hook: A separation reports 91% purity and a clean product, but the mass balance is short by about 6% of the input. 
      The chemist would like to sign the batch record. Six checks are on the bench.
    riddle: The material left the process. Where did it go?
    salient:
    - massbal
    - glassware
    zones:
      balance: Material balance
      streams: Process streams
      vessel: Vessels and transfer
      assay: Assay and standards
    readings:
      massbal:
        name: Input minus all measured outputs
        zone: balance
        observed: short by 6.1%
        reference: closes within 1%
        purpose: Whether everything that went in is accounted for in a measured stream. A gap says material left by a 
          route nobody is measuring; it does not say which route.
      raffinate:
        name: Activity in the discarded aqueous stream
        zone: streams
        observed: 0.4% of input
        reference: under 1% for a complete separation
        purpose: Target left behind in the stream that was thrown away. High values mean the separation itself did not 
          finish.
      glassware:
        name: Activity swabbed from vessel walls
        zone: vessel
        observed: 5.8% of input
        reference: under 0.5%
        purpose: Material adhering to surfaces instead of travelling with the liquid. Surfaces are outside every 
          measured stream, so this loss is invisible to the balance.
      assaypurity:
        name: Fraction of counts from the target isotope
        zone: assay
        observed: 91%
        reference: above 90%
        purpose: How much of the measured activity is the species of interest. It says nothing about how much of the 
          element was recovered.
      standardcheck:
        name: Known reference source on the same counter
        zone: assay
        observed: within 1.5% of certificate
        reference: within 2%
        purpose: Whether the instrument is reading correctly at all. A drifted counter can manufacture an apparent gap 
          out of good chemistry.
      gravimetric:
        name: Weighed product mass vs assayed mass
        zone: balance
        observed: agree within 1%
        reference: agree within 2%
        purpose: An independent check on the product. Disagreement points to something inert riding along with the 
          target.
    hypotheses:
      incomplete:
        label: The separation did not finish
        choice: Part of the target stayed in the liquid that was discarded, so the loss should be sitting in a stream 
          that was measured and thrown away.
        sig:
          massbal: gap
          raffinate: hot
          glassware: clean
          assaypurity: high
          standardcheck: ok
          gravimetric: agree
      coprecip:
        label: A contaminant came down with the product
        choice: Another species precipitated alongside the target, adding mass that is not the element of interest and 
          coating the vessel as it formed.
        sig:
          massbal: excess
          raffinate: clean
          glassware: hot
          assaypurity: low
          standardcheck: ok
          gravimetric: disagree
      standarderr:
        label: The counting standard is mis-calibrated
        choice: The instrument converts counts to quantity with the wrong factor, so the chemistry is fine and only the 
          arithmetic is short.
        sig:
          massbal: gap
          raffinate: clean
          glassware: clean
          assaypurity: high
          standardcheck: "off"
          gravimetric: agree
      adsorb:
        label: Target adsorbed onto the vessel walls
        choice: The element plated out on glass and transfer lines, leaving the process by a route that no stream 
          measurement covers.
        sig:
          massbal: gap
          raffinate: clean
          glassware: hot
          assaypurity: high
          standardcheck: ok
          gravimetric: agree
      roundoff:
        label: Nothing to explain — bookkeeping
        choice: The gap is the accumulated rounding of several separately reported figures and does not correspond to 
          missing material.
        sig:
          massbal: closes
          raffinate: clean
          glassware: clean
          assaypurity: high
          standardcheck: ok
          gravimetric: agree
    dismissal: roundoff
    answer: adsorb
    reasons:
      incomplete: It is the first thing to suspect when a balance is short, and it explains the gap. But the discarded 
        aqueous phase holds 0.4% of the input — under the completeness limit. The separation worked; the material went 
        somewhere else.
      coprecip: "It accounts for the hot glassware. It gets the balance backwards: co-precipitation adds mass to the product,
        so the balance would run long, not short. Purity at 91% and the weighed mass agreeing with the assay both argue against
        extra material riding along."
      standarderr: It would explain a gap with clean streams, and it is worth ruling out on every batch. The reference 
        source reads within 1.5% of its certificate, so the counter is converting correctly.
      roundoff: A 6.1% gap is far outside the 1% the balance normally closes to, and 5.8% of the input is physically 
        present on the vessel walls. There is material to find.
    resolve:
      title: The loss is on the glass
      paras:
      - The target adsorbed onto vessel walls and transfer lines. It never entered a measured stream, which is exactly 
        why the balance could not find it — the accounting covers liquids in and liquids out, and this material is on a 
        surface.
      - Note that every quality figure on this batch is good. Purity is 91%, the standard checks out, the product weighs
        what the assay says it should, and the discarded phase is clean. A batch can pass every test it is given and 
        still have lost a twentieth of the material to a route nobody measured.
      why:
        loud: "The 2 headline findings are a 6.1% gap and 5.8% of the input recovered from vessel walls. Neither alone identifies
          the cause: a gap fits three different candidates, and hot glassware fits both adsorption and co-precipitation."
        quiet: Together they close it, and the quiet readings confirm the mechanism rather than merely permitting it. 
          The clean raffinate rules out an unfinished separation, the reference source rules out the counter, and the 
          agreeing gravimetric rules out extra material coming down with the product.
      chain:
      - Target plates onto glass and transfer-line surfaces
      - Material leaves the process outside every measured stream
      - Yield is real but unrecorded, and the balance cannot say where it went
      take: A yield figure is only as complete as the list of routes you measured.
    logic:
    - - Balance short by 6.1%
      - material left by an unmeasured route
    - - 5.8% recovered from vessel walls
      - the route is surface adsorption or co-precipitation
    - - Raffinate clean at 0.4%
      - the separation itself finished
    - - Balance short, not long, and purity high
      - nothing extra came down with the product
  p15:
    id: p15
    level: L2
    title: The neutrons that never arrived
    role: You are checking a neutron counter that reads well below prediction.
    hook: A calibrated source should give roughly 1,200 counts per minute on this counter. It is reading 340. The source
      certificate is current and the geometry was set up from the drawing.
    riddle: Are the neutrons missing, or is the counter missing them?
    salient:
    - pulseheight
    - cadmium
    zones:
      source: Source and path
      detector: Detector
      elec: Electronics
      indep: Independent check
    readings:
      rate:
        name: Measured rate
        zone: detector
        observed: 340 counts/min
        reference: about 1,200 counts/min predicted
        purpose: The headline shortfall. It cannot distinguish neutrons that never arrived from neutrons that arrived 
          and were not recorded.
      pulseheight:
        name: Pulse-height distribution
        zone: elec
        observed: large population piled up just below the threshold
        reference: distribution well clear of the threshold
        purpose: Where recorded pulses sit relative to the discriminator. Pulses bunched under the cut are being 
          produced but not counted; it does not say why they are small.
      foil:
        name: Activation foil at the detector face
        zone: indep
        observed: activity as predicted
        reference: activity as predicted
        purpose: "A measurement with no electronics at all: neutrons either activate the foil or they do not. It proves arrival,
          and nothing about the counting chain."
      cadmium:
        name: Rate change when cadmium is inserted
        zone: source
        observed: change under 5%
        reference: a thermalized field drops sharply; a fast field barely moves
        purpose: Cadmium absorbs slow neutrons strongly and fast ones hardly at all, so the size of the change reports 
          how much of the field has been slowed.
      distance:
        name: Rate against inverse-square check
        zone: source
        observed: follows 1/r² within 4%
        reference: follows 1/r²
        purpose: Whether the geometry is what the drawing says. A steeper falloff means the real solid angle is smaller 
          than assumed.
      repeat:
        name: Five repeat runs
        zone: detector
        observed: all within 4%
        reference: Poisson scatter of about 5%
        purpose: Whether the shortfall is stable. A reproducible deficit has a cause; scatter does not.
    hypotheses:
      moderation:
        label: The field has been slowed by nearby material
        choice: Neutrons scattering off surrounding matter arrive with much lower energy, depositing less in the 
          detector and producing smaller pulses.
        sig:
          rate: low
          pulseheight: under
          foil: normal
          cadmium: big
          distance: inverse
          repeat: consistent
      absorption:
        label: A layer between source and detector is absorbing them
        choice: Hydrogenous or boron-loaded material in the path removes neutrons before they reach the detector, so 
          fewer arrive at all.
        sig:
          rate: low
          pulseheight: clear
          foil: low
          cadmium: small
          distance: inverse
          repeat: consistent
      threshold:
        label: The discriminator threshold is set too high
        choice: Real pulses of ordinary size are falling below the level at which the counter accepts an event, so 
          genuine neutrons go unrecorded.
        sig:
          rate: low
          pulseheight: under
          foil: normal
          cadmium: small
          distance: inverse
          repeat: consistent
      geometry:
        label: The solid angle is smaller than assumed
        choice: The real source-to-detector separation or alignment differs from the drawing, so the counter intercepts 
          a smaller fraction than the prediction assumed.
        sig:
          rate: low
          pulseheight: clear
          foil: low
          cadmium: small
          distance: steeper
          repeat: consistent
      normalvar:
        label: Nothing to explain — ordinary variation
        choice: Day-to-day differences in a counting setup of this kind are large, and a single low reading does not 
          need a cause.
        sig:
          rate: normal
          pulseheight: clear
          foil: normal
          cadmium: small
          distance: inverse
          repeat: varies
    dismissal: normalvar
    answer: threshold
    reasons:
      moderation: "It is a real mechanism and it produces exactly the pile-up of small pulses seen here — this is the rival
        worth taking seriously. It fails the cadmium test: a field slowed enough to lose two-thirds of the counts would collapse
        when cadmium is inserted, and the change measured is under 5%."
      absorption: It explains a shortfall in arrivals. But the activation foil records the predicted activity, so the 
        neutrons are reaching the detector face. Nothing removed them from the path.
      geometry: Always worth suspecting when a prediction and a measurement disagree by a factor of three. The rate 
        follows inverse-square within 4%, so the geometry matches the drawing it was predicted from.
      normalvar: 5 runs agree within 4%, tighter than the Poisson scatter. A factor-of-three deficit that reproduces is 
        not variation.
    resolve:
      title: The neutrons arrived and were not counted
      paras:
      - The discriminator threshold is set above where this detector puts its pulses, so ordinary events are being 
        produced, amplified, and then rejected. The counting chain is discarding two-thirds of a perfectly good signal.
      - The activation foil is the reading that reframes the whole problem. It measures neutrons with no electronics 
        whatsoever, and it says the predicted flux is arriving. Once arrival is established, every explanation involving
        the source, the path, or the geometry is dead, and the fault has to be downstream of the detector face.
      why:
        loud: "Pulses piled up under the threshold is the striking finding, but it has two honest explanations: the pulses
          are small because the neutrons are slow, or the cut is too high for normal pulses. The pile-up cannot distinguish
          them."
        quiet: Cadmium separates them. A slowed field is defined by its sensitivity to cadmium, and this field barely 
          responds — under 5%. So the neutrons are not slow, and the threshold is wrong. The foil and the inverse-square
          check independently confirm that arrival and geometry are both fine.
      chain:
      - Discriminator threshold set above the detector pulse distribution
      - Genuine neutron events are produced and then rejected as noise
      - The counter reports a third of the true rate with no sign of malfunction
      take: Before believing a low count, find one measurement that does not go through the electronics.
    logic:
    - - Pulses piled up below the threshold
      - events are being produced but not accepted
    - - Cadmium changes the rate by under 5%
      - the field is not thermalized — the pulses are not small because the neutrons are slow
    - - Activation foil reads as predicted
      - the neutrons are arriving; the fault is after the detector face
    - - Rate follows 1/r²
      - the geometry matches the prediction
  cm12:
    id: cm12
    level: L3
    title: A phase that should not be there
    role: You are explaining a microstructure the phase diagram does not predict.
    hook: A cast part has come back from metallography with two phases where the diagram says there should be one at 
      this composition and temperature. It is measurably harder than the last five castings. The diagram is not wrong, 
      so something about this casting is not what was assumed.
    riddle: The equilibrium map does not predict this structure. What did the metal experience that the map does not 
      describe?
    salient:
    - micro
    - hardness
    zones:
      metallography: Metallography
      assay: Chemical assay
      process: Process record
      xray: Diffraction
    readings:
      micro:
        name: Etched microstructure
        zone: metallography
        observed: two distinct phases
        reference: single phase at this composition and temperature
        purpose: What structure is actually present. It shows that equilibrium was not reached or not what was assumed, 
          without saying which.
      hardness:
        name: Bulk hardness
        zone: metallography
        observed: 31% above the recent average
        reference: within 10% of the average
        purpose: A bulk mechanical consequence of structure. Many different second phases raise hardness, so it confirms
          the structure is real but does not identify it.
      chemcomp:
        name: Bulk composition assay
        zone: assay
        observed: all major elements on specification
        reference: on specification
        purpose: Whether the alloy sits where the drawing says on the diagram. On-specification composition removes the 
          simplest explanation for landing in a different phase field.
      coolrate:
        name: Thermocouple cooling record
        zone: process
        observed: within the normal band throughout
        reference: within the normal band
        purpose: How fast the casting actually cooled. Cooling rate decides whether the metal had time to reach the 
          structure the diagram predicts.
      xrd:
        name: X-ray diffraction phase identification
        zone: xray
        observed: a second equilibrium phase, not a metastable one
        reference: single phase
        purpose: Identifies which phases are present by crystal structure. It distinguishes a phase frozen in by fast 
          cooling from one that is genuinely stable under these conditions.
      impurity:
        name: Trace element assay
        zone: assay
        observed: 1 trace element at 9x its usual level
        reference: at or below usual levels
        purpose: Elements too dilute to appear in the major assay. Small amounts can shift phase boundaries or 
          concentrate locally during freezing.
      repolish:
        name: Re-prepared and re-etched specimen
        zone: metallography
        observed: second phase still present
        reference: unchanged if real
        purpose: Whether the feature survives new preparation. Polishing and etching can create appearances that are not
          in the metal.
    hypotheses:
      quench:
        label: Cooled too fast — a metastable phase was retained
        choice: Rapid cooling denied the metal time to reach equilibrium, freezing in a structure the diagram only 
          predicts at higher temperature.
        sig:
          micro: two
          hardness: high
          chemcomp: onspec
          coolrate: fast
          xrd: metastable
          impurity: clean
          repolish: unchanged
      composition:
        label: Composition is off specification
        choice: The alloy is not where the drawing says it is, so it sits in a two-phase field of the diagram and a 
          second phase is the correct equilibrium answer.
        sig:
          micro: two
          hardness: high
          chemcomp: offspec
          coolrate: normal
          xrd: equilibrium
          impurity: clean
          repolish: unchanged
      contamination:
        label: A trace impurity stabilised an extra phase
        choice: An element present in small quantity shifted the local phase boundary, making a second phase stable at a
          composition the diagram treats as single-phase.
        sig:
          micro: two
          hardness: high
          chemcomp: onspec
          coolrate: normal
          xrd: equilibrium
          impurity: elevated
          repolish: unchanged
      segregation:
        label: Slow freezing let the composition segregate
        choice: Solute rejected ahead of the freezing front concentrated in the last liquid, so parts of the casting 
          have a different local composition from the bulk.
        sig:
          micro: two
          hardness: high
          chemcomp: onspec
          coolrate: slow
          xrd: equilibrium
          impurity: elevated
          repolish: unchanged
      etchartifact:
        label: Nothing to explain — a preparation artifact
        choice: The apparent second phase is a product of polishing or etching rather than a feature of the metal.
        sig:
          micro: two
          hardness: normal
          chemcomp: onspec
          coolrate: normal
          xrd: single
          impurity: clean
          repolish: resolved
    dismissal: etchartifact
    answer: contamination
    reasons:
      quench: "It explains a second phase with on-specification composition, and it is the standard answer when a structure
        disagrees with the diagram. Two readings defeat it: the cooling record stays inside the normal band throughout, and
        diffraction identifies an equilibrium phase rather than a metastable one."
      composition: It would make the second phase correct rather than anomalous, which is the cleanest possible 
        explanation. The bulk assay puts every major element on specification, so the alloy is where the drawing says it
        is.
      segregation: "A serious rival: it explains an on-specification bulk with locally elevated trace levels and an equilibrium
        second phase. It needs slow freezing to concentrate solute in the last liquid, and the thermocouple record shows an
        ordinary cooling rate."
      etchartifact: Worth eliminating first and cheap to test. The second phase survives re-preparation, diffraction 
        sees it as a distinct crystal structure, and the hardness is 31% high — a polishing artifact does not change 
        bulk hardness.
    resolve:
      title: A trace element moved the boundary
      paras:
      - "An impurity nine times its usual level has shifted the local phase boundary, so a second phase is genuinely stable
        at a composition the diagram treats as single-phase. Diffraction confirms it: this is an equilibrium phase, not something
        frozen in."
      - The diagram was never wrong. It describes the alloy system it was drawn for, and this casting is a slightly 
        different system. That is the honest reading of any equilibrium map — it is a statement about a specified 
        composition, and a trace element the assay was not looking for makes the composition something else.
      why:
        loud: Two phases and high hardness establish that the structure is real and consequential, but they leave four 
          candidates standing. Every mechanism here produces a hard, two-phase casting; the loud readings cannot choose 
          between them.
        quiet: "Two quiet readings in different departments do the work. The trace assay narrows the field to the two candidates
          that involve locally elevated impurity, contamination and segregation. The process record then separates those:
          segregation requires slow freezing, and cooling was normal. Diffraction corroborates by identifying the phase as
          equilibrium rather than metastable."
      chain:
      - A trace element enters at nine times its usual level
      - The local phase boundary shifts and a second phase becomes stable
      - The casting is harder than specification and the diagram appears to be violated
      take: A phase diagram describes one composition. Verify you still have that composition before doubting the map.
    logic:
    - - 2 phases, hardness 31% high
      - the structure is real — four mechanisms remain
    - - Trace element 9x usual level
      - narrows to contamination or segregation
    - - Cooling record normal
      - segregation needs slow freezing — eliminated
    - - Diffraction sees an equilibrium phase
      - not a metastable structure frozen in by quenching
  p12:
    id: p12
    level: L3
    title: Eight channels that will not agree
    role: You are finding out why a timing array disagrees with itself.
    hook: 8 channels watching 1 event report arrival times spread over 14 ns when the array is specified to 4. An 
      independent clock cross-check came back clean, so the reference itself is sound. The spread is in the array.
    riddle: Every channel sees the same event. What is different about what each one reports?
    salient:
    - spread
    - refcheck
    zones:
      array: Channel array
      cable: Cable plant
      disc: Discriminators
      ref: Time reference
    readings:
      spread:
        name: Channel-to-channel arrival spread
        zone: array
        observed: 14 ns
        reference: 4 ns specified
        purpose: How badly the array disagrees. It establishes that a problem exists without locating it.
      refcheck:
        name: Independent clock cross-check
        zone: ref
        observed: agrees within 0.3 ns
        reference: agrees within 1 ns
        purpose: Whether the shared time reference is where it claims to be. A sound reference means the disagreement 
          was introduced downstream of it.
      pattern:
        name: Shape of the disagreement
        zone: array
        observed: scattered across channels, no single outlier
        reference: no pattern
        purpose: Whether channels move together, one moves alone, or all scatter. Each fault leaves a different 
          signature here.
      amplitude:
        name: Apparent time against pulse height
        zone: disc
        observed: no correlation
        reference: no correlation
        purpose: Whether large pulses appear earlier than small ones. A fixed threshold is crossed sooner by a steeper 
          edge, which makes timing depend on amplitude rather than on physics.
      cablelen:
        name: Measured cable lengths
        zone: cable
        observed: all matched within 5 cm
        reference: matched within 10 cm
        purpose: Physical path length per channel. Signal speed is finite, so extra cable is a fixed offset in one 
          channel — measurable with a tape rather than a scope.
      pulserinject:
        name: Identical test pulses injected at the inputs
        zone: disc
        observed: all channels align within 1 ns
        reference: align within 1 ns
        purpose: Removes the detectors and the event, leaving the electronics and cable. Alignment here means the fixed 
          delays through the chain are equal.
      width:
        name: Per-channel distribution width
        zone: array
        observed: broad on every channel
        reference: narrow
        purpose: The spread of repeated measurements within one channel. A fixed error shifts a narrow distribution; a 
          random one widens it.
    hypotheses:
      clockoffset:
        label: The shared reference has shifted
        choice: One common time reference feeds every channel, so an error there moves all of them by the same amount 
          and cancels in channel-to-channel differences.
        sig:
          spread: large
          refcheck: offset
          pattern: common
          amplitude: none
          cablelen: matched
          pulserinject: aligned
          width: narrow
      timewalk:
        label: Time walk at the discriminators
        choice: A fixed threshold is crossed earlier by a steeper leading edge, so recorded time depends on pulse 
          amplitude even when the events are simultaneous.
        sig:
          spread: large
          refcheck: ok
          pattern: scattered
          amplitude: correlated
          cablelen: matched
          pulserinject: aligned
          width: broad
      cabledelay:
        label: One channel has a longer signal path
        choice: Extra cable on a single channel adds a fixed delay to that channel only, leaving the others correct.
        sig:
          spread: large
          refcheck: ok
          pattern: one-channel
          amplitude: none
          cablelen: mismatched
          pulserinject: offset-one
          width: narrow
      jitter:
        label: Random jitter at the threshold
        choice: Noise riding on the signal moves the moment each pulse crosses the threshold, scattering arrival times 
          symmetrically around the true value.
        sig:
          spread: large
          refcheck: ok
          pattern: scattered
          amplitude: none
          cablelen: matched
          pulserinject: aligned
          width: broad
      withinspec:
        label: Nothing to explain — inside tolerance
        choice: An array of this size is expected to disagree at this level, and the spread does not warrant 
          investigation.
        sig:
          spread: small
          refcheck: ok
          pattern: scattered
          amplitude: none
          cablelen: matched
          pulserinject: aligned
          width: narrow
    dismissal: withinspec
    answer: jitter
    reasons:
      clockoffset: It is the first thing to check on a shared-reference array, and it would explain a large spread. The 
        independent cross-check agrees within 0.3 ns, so the reference is sound — and a common offset would cancel in 
        channel-to-channel differences anyway rather than creating them.
      timewalk: The strongest rival. It survives both headline findings and it broadens the per-channel distribution 
        exactly as observed. It requires recorded time to track pulse height, and there is no correlation between them 
        at all.
      cabledelay: It explains a large spread with a sound reference, and it is easy to check. Cable lengths match within
        5 cm, injected test pulses align across all channels, and the disagreement is scattered rather than isolated to 
        1 channel — a cable fault moves 1 channel, not 8.
      withinspec: The array is specified to 4 ns and is delivering 14. Calling that acceptable would mean abandoning the
        specification rather than meeting it.
    resolve:
      title: Noise at the threshold, not a delay
      paras:
      - Random noise on the signal is moving the instant each pulse crosses the discriminator threshold. Every channel 
        is affected, none is biased, and the result is a symmetric scatter about the true arrival time — which is why 
        the mean is still right and only the width has grown.
      - "The distinction matters for what you do next. A fixed error can be measured once and subtracted. Jitter cannot: it
        must be reduced at the source by improving signal-to-noise, shaping the pulse, or replacing threshold discrimination
        with a method that does not depend on where a noisy edge crosses a fixed level."
      why:
        loud: A 14 ns spread with a clean reference cross-check leaves 3 live candidates — time walk, cable delay, and 
          jitter. The loud readings establish that the disagreement is real and was introduced downstream of the 
          reference, and there they stop.
        quiet: Two quiet readings in different parts of the chain finish it. No correlation between apparent time and 
          pulse height eliminates time walk, the one rival that otherwise fits every observation. Matched cable lengths,
          backed by injected test pulses aligning across all channels, eliminate a path-length fault. What survives is a
          random error, and the broad per-channel width confirms it.
      chain:
      - Noise rides on the signal into the discriminator
      - The threshold-crossing moment moves randomly, event to event
      - Arrival times scatter symmetrically and no amount of calibration removes it
      take: A fixed error can be calibrated out. A random one has to be engineered out.
    logic:
    - - 14 ns spread, reference clean
      - "three candidates remain: time walk, cable delay, jitter"
    - - No correlation between time and pulse height
      - time walk eliminated
    - - Cable lengths matched, test pulses aligned
      - path-length fault eliminated
    - - Every channel broad, none biased
      - a random error, not a fixed one
  cm17:
    id: cm17
    level: L2
    title: The part that broke without bending
    role: You are running the failure analysis on a component that broke in service.
    hook: A machined component failed under a load it was qualified for. It broke cleanly, with no visible bending. The 
      material certificate is in order and the part passed dimensional inspection before installation.
    riddle: The material was qualified for this load. What made this part different from the coupon that qualified it?
    salient:
    - hardness
    - origin
    zones:
      fracture: Fracture surface
      geom: Geometry
      surface: Surface condition
      history: Load history
    readings:
      fracture:
        name: Fracture surface appearance
        zone: fracture
        observed: flat cleavage facets, no shear lip
        reference: ductile tearing with a shear lip
        purpose: How the crack travelled. Cleavage means the material separated without absorbing much energy; it does 
          not say why it was able to.
      deformation:
        name: Permanent deformation near the break
        zone: geom
        observed: none measurable
        reference: visible necking if the part yielded
        purpose: Whether the part deformed before it broke. Absence of deformation rules out simple overload past yield.
      hardness:
        name: Surface hardness vs bulk hardness
        zone: surface
        observed: surface 44% harder than bulk
        reference: uniform within 10%
        purpose: Whether the outer layer differs from the interior. A hardened surface layer is often also a brittle 
          one, and it can come from the material or from the machining.
      origin:
        name: Crack origin location
        zone: fracture
        observed: at the machined surface
        reference: wherever stress is highest
        purpose: Where the failure started. A surface origin points at surface condition, geometry, or handling rather 
          than at bulk material.
      cycles:
        name: Load history
        zone: history
        observed: single steady application
        reference: as qualified
        purpose: Whether the part was loaded once or repeatedly. Progressive cracking requires cycles; a single 
          application does not produce it.
      dimensional:
        name: Dimensions before failure
        zone: geom
        observed: within drawing tolerance
        reference: within drawing tolerance
        purpose: Whether the part was made to size. In-tolerance dimensions remove geometry as the stress concentrator.
    hypotheses:
      brittle:
        label: The material itself was too brittle
        choice: The bulk material had insufficient toughness for the application, so it separated without absorbing 
          energy anywhere the stress was highest.
        sig:
          fracture: cleavage
          deformation: none
          hardness: elevated
          origin: interior
          cycles: steady
          dimensional: intol
      yieldfail:
        label: Loaded past its yield strength
        choice: The applied load exceeded the stress at which the material deforms permanently, so the part changed 
          shape before it gave way.
        sig:
          fracture: ductile
          deformation: large
          hardness: uniform
          origin: bulk
          cycles: steady
          dimensional: outtol
      fatigue:
        label: Progressive cracking under cyclic load
        choice: Repeated loading grew a crack from the surface over many cycles until the remaining section could no 
          longer carry the load.
        sig:
          fracture: striations
          deformation: none
          hardness: uniform
          origin: surface
          cycles: cyclic
          dimensional: intol
      surfacedamage:
        label: Machining damaged the surface layer
        choice: Cutting heat transformed and hardened a thin surface layer, creating a brittle skin that cracked first 
          and handed a running crack to sound material underneath.
        sig:
          fracture: cleavage
          deformation: none
          hardness: elevated
          origin: surface
          cycles: steady
          dimensional: intol
      mishandling:
        label: Nothing to explain — damaged before installation
        choice: The part was knocked or dropped in transit, and the break reflects that damage rather than anything 
          about the material or the process.
        sig:
          fracture: cleavage
          deformation: none
          hardness: uniform
          origin: surface
          cycles: steady
          dimensional: intol
    dismissal: mishandling
    answer: surfacedamage
    reasons:
      brittle: It explains cleavage without deformation and it explains the hardness reading, so it is the rival that 
        survives longest. But a bulk-brittle part fails wherever the stress is highest, which here is in the interior. 
        This crack started at the machined surface.
      yieldfail: The obvious candidate for a part that broke under load, and the easiest to check. It requires visible 
        permanent deformation, and there is none measurable. The fracture is cleavage rather than ductile tearing, and 
        the part was in tolerance.
      fatigue: It correctly predicts a surface origin, which is why it cannot be dismissed on location alone. It needs 
        repeated loading to grow a crack, and the load history shows a single steady application. The fracture also 
        shows cleavage facets rather than the progressive striations fatigue leaves behind.
      mishandling: It would explain a surface-origin cleavage break, and handling damage is common enough to be worth 
        ruling out. It cannot explain a surface layer 44% harder than the bulk — dropping a part does not harden it.
    resolve:
      title: The skin failed before the metal did
      paras:
      - Cutting heat during machining transformed a thin surface layer into something harder and more brittle than the 
        material underneath. That skin cracked at a load the bulk material could carry, and once a sharp crack existed 
        it ran into sound metal and took the part with it.
      - Every acceptance check this part faced was passed. The material certificate was valid, the dimensions were in 
        tolerance, and the load was within qualification. The property that failed — surface condition after machining —
        was not on the inspection list, and no dimensional measurement would ever have found it.
      why:
        loud: "The 2 headline findings are a surface 44% harder than the bulk and a crack that started at the machined surface.
          Neither settles it alone: elevated surface hardness also fits a bulk-brittle material, and a surface origin also
          fits fatigue and handling damage."
        quiet: Together they leave one answer, and the quiet readings close off the alternatives. No permanent 
          deformation rules out plain overload, a single steady application rules out fatigue, and in-tolerance 
          dimensions rule out geometry as the stress concentrator.
      chain:
      - Machining heat transforms and hardens a thin surface layer
      - The brittle skin cracks at a load the bulk material can carry
      - The crack runs into sound metal and the part fails below its qualified strength
      take: A part is only as good as the property you did not inspect.
    logic:
    - - Surface 44% harder than bulk
      - a brittle skin, from the material or from machining
    - - Crack started at the machined surface
      - not a bulk-material failure
    - - No permanent deformation
      - not simple overload past yield
    - - Single steady load application
      - not fatigue, despite the surface origin
  e15:
    id: e15
    level: L3
    title: The mockup that disagreed with the model
    role: You are deciding whether an inert trial found a real effect or an artifact of the mockup.
    hook: An inert assembly trial returns an arrival time 8% later than predicted. The radiograph shows the assembly in 
      the geometry it was designed to have. The team is split on whether this is a finding or a defect in the test.
    riddle: A mockup can only answer the question its materials and instruments preserve. Did this one preserve it?
    salient:
    - arrival
    - radiograph
    zones:
      timing: Timing
      imaging: Radiography
      hardware: Recovered hardware
      materials: Materials certification
    readings:
      arrival:
        name: Measured vs predicted arrival time
        zone: timing
        observed: 8% late
        reference: within 2% of prediction
        purpose: The headline discrepancy. It says the model and the trial disagree, not which of them is wrong.
      radiograph:
        name: Radiographic geometry at time of arrival
        zone: imaging
        observed: as designed
        reference: as designed
        purpose: Whether the assembly was in the configuration the prediction assumed. Correct geometry removes assembly
          error as the explanation.
      recovered:
        name: Condition of recovered hardware
        zone: hardware
        observed: intact, no witness marks
        reference: intact
        purpose: What the hardware experienced. Marks and distortion reveal constraint or contact the design did not 
          intend.
      matcert:
        name: Surrogate material certificate
        zone: materials
        observed: density and sound speed within 1% of the material it stands in for
        reference: within 2%
        purpose: How faithfully the stand-in material reproduces the property under test. A surrogate that differs here 
          cannot answer questions that depend on it.
      fixturewitness:
        name: Fixture witness marks
        zone: hardware
        observed: clean
        reference: clean
        purpose: Whether the test fixture touched or constrained the assembly during the event, which would make the 
          trial measure the fixture as much as the article.
      channelcross:
        name: Agreement between independent channels
        zone: timing
        observed: 3 channels agree within 1%
        reference: agree within 2%
        purpose: Whether separate instruments tell the same story. Agreement across independent channels makes an 
          instrumentation fault very hard to sustain.
      scaling:
        name: Discrepancy against surrogate density ratio
        zone: materials
        observed: independent of the density ratio
        reference: scales with the ratio if the surrogate is responsible
        purpose: Whether the size of the disagreement tracks the property the surrogate fails to reproduce. A surrogate 
          artifact scales with the substitution; a real effect does not.
      repeat:
        name: Second identical shot
        zone: timing
        observed: reproduces within 1%
        reference: reproduces
        purpose: Whether the discrepancy is stable. A reproducible disagreement is a property of the system, not of one 
          trial.
    hypotheses:
      surrogate:
        label: The surrogate material does not behave like the real one
        choice: The stand-in material responds differently under load, so the trial is measuring the surrogate rather 
          than the article the model describes.
        sig:
          arrival: late
          radiograph: asdesigned
          recovered: intact
          matcert: mismatch
          fixturewitness: clean
          channelcross: agree
          scaling: scales
          repeat: reproduces
      fixture:
        label: The test fixture constrained the assembly
        choice: The rig held or contacted the assembly during the event, so part of what was measured belongs to the 
          fixture and not to the design.
        sig:
          arrival: late
          radiograph: distorted
          recovered: marked
          matcert: match
          fixturewitness: marked
          channelcross: agree
          scaling: independent
          repeat: reproduces
      instrument:
        label: A diagnostic channel is misreporting
        choice: The timing chain has a fault or a lost fiducial, so the discrepancy is in the record rather than in the 
          event.
        sig:
          arrival: late
          radiograph: asdesigned
          recovered: intact
          matcert: match
          fixturewitness: clean
          channelcross: disagree
          scaling: independent
          repeat: varies
      realeffect:
        label: The model is missing a real effect
        choice: The assembly genuinely behaves this way and the prediction omits a mechanism that matters at this scale.
        sig:
          arrival: late
          radiograph: asdesigned
          recovered: intact
          matcert: match
          fixturewitness: clean
          channelcross: agree
          scaling: independent
          repeat: reproduces
      withintol:
        label: Nothing to explain — inside declared tolerance
        choice: The trial declared a tolerance wide enough to contain this difference, so no discrepancy requires 
          explanation.
        sig:
          arrival: nominal
          radiograph: asdesigned
          recovered: intact
          matcert: match
          fixturewitness: clean
          channelcross: agree
          scaling: independent
          repeat: reproduces
    dismissal: withintol
    answer: realeffect
    reasons:
      surrogate: "The rival that has to be taken most seriously, because it is the standard reason a mockup result does not
        transfer, and it survives both headline findings. Two readings defeat it: the surrogate certificate matches the real
        material within 1% on the property in question, and the size of the discrepancy does not scale with the density ratio
        the way a substitution artifact would."
      fixture: It explains a late arrival, and fixtures do corrupt trials this way. The recovered hardware is intact, 
        the fixture witness marks are clean, and the radiograph shows the designed geometry rather than a constrained 
        one.
      instrument: Worth suspecting whenever a single number disagrees with a model. 3 independent channels agree within 
        1% and the second shot reproduces within 1%. An instrumentation fault that reproduces identically across 
        independent channels and repeat trials is not an instrumentation fault.
      withintol: The trial was specified to 2% and returned 8%, reproducibly. Widening the tolerance after the fact to 
        contain the result is how a test stops being able to fail.
    resolve:
      title: The trial is right and the model is incomplete
      paras:
      - Every way the mockup could have lied has been checked and cleared. The surrogate reproduces the property under 
        test, the fixture did not touch the assembly, the geometry was as designed, and three independent channels agree
        across two shots. What remains is that the assembly really does behave this way and the prediction is missing a 
        mechanism.
      - This is the outcome a mockup programme exists to make possible, and it is only available because the trial was 
        built so that its own failure modes could be ruled out. Without the material certificate, the witness marks, the
        channel redundancy, and the repeat shot, an 8% discrepancy is an argument. With them it is a finding.
      why:
        loud: "A reproducible 8% late arrival with the designed geometry confirmed leaves 3 candidates: a surrogate artifact,
          an instrumentation fault, or a real effect. Correct geometry is what makes the discrepancy interesting rather than
          trivial, but it cannot say which of the three is responsible."
        quiet: Two quiet readings from different departments settle it. The materials certificate, backed by the 
          discrepancy not scaling with the density ratio, eliminates the surrogate. Independent channel agreement, 
          backed by the repeat shot, eliminates the instruments. Ruling out the mockup is what licenses believing it.
      chain:
      - A mechanism absent from the model affects the assembly
      - The trial measures it and every mockup artifact is independently excluded
      - The 8% discrepancy becomes evidence that the model needs revision
      take: A mockup earns the right to contradict a model only after its own artifacts have been ruled out.
    logic:
    - - 8% late, geometry as designed, reproducible
      - "three candidates: surrogate, instruments, real effect"
    - - Surrogate certificate matches within 1%
      - the stand-in reproduces the property under test
    - - Discrepancy does not scale with density ratio
      - not a substitution artifact
    - - Three channels agree, second shot reproduces
      - not an instrumentation fault
  x18:
    id: x18
    level: L4
    compound:
    - lotvariation
    - inversion
    title: Two entries in one uncertainty budget
    role: You are assigning an inert integration trial's anomalies to the right uncertainty terms.
    hook: "An inert wave-propagation trial has two problems: distributed sensors report a wider arrival-time spread than budgeted,
      and the analysis software infers a material state below the model prediction. The budget has to name causes, and no
      single entry accounts for both."
    riddle: Select the two causes that together account for every reading. No single cause does.
    salient:
    - arrivalspread
    - densityinferred
    zones:
      timing: Timing
      materials: Materials
      fixture: Fixture
      electronics: Electronics
      analysis: Analysis
    readings:
      arrivalspread:
        name: Sensor arrival-time spread
        zone: timing
        observed: 19 relative timing units
        reference: 8 units budgeted
        purpose: Whether distributed sensors agree on when an inert wavefront arrived.
      lotcert:
        name: Material-batch propagation certificates
        zone: materials
        observed: spread of 2.4% across batches used
        reference: within 0.5% for one qualified batch
        purpose: Whether the stand-in materials carry the wave at consistent speeds.
      placementmetrology:
        name: Fixture placement metrology
        zone: fixture
        observed: all sensors and samples within tolerance
        reference: within tolerance
        purpose: Whether path-length differences came from the fixture rather than the material.
      triggerselftest:
        name: Shared reference-clock self-test
        zone: electronics
        observed: pass
        reference: pass
        purpose: Whether a common timing reference introduced unequal channel delays.
      densityinferred:
        name: Inferred material-state parameter
        zone: analysis
        observed: 13% below prediction
        reference: within 5% of prediction
        purpose: The output of the analysis chain, derived from imaging rather than measured directly.
      radiographraw:
        name: Raw imaging transmission
        zone: analysis
        observed: consistent with previous inert trials
        reference: consistent
        purpose: The measurement before the inversion model is applied.
      attenuationstd:
        name: Imaging-model calibration against a reference wedge
        zone: analysis
        observed: fails by 11% at the high end
        reference: within 3% across the calibrated range
        purpose: Whether the model converting transmission into the reported state is valid where it is being used.
    hypotheses:
      lotvariation:
        label: Material-batch propagation variation
        choice: Batches with slightly different propagation speeds widen the arrival spread without requiring a fixture 
          or clock fault.
        sig:
          arrivalspread: wide
          lotcert: spread
          placementmetrology: intol
          triggerselftest: pass
          densityinferred: nominal
          radiographraw: consistent
          attenuationstd: pass
      placement:
        label: Fixture placement tolerance
        choice: Sensors or samples sitting away from intended positions change path lengths and therefore arrival times.
        sig:
          arrivalspread: wide
          lotcert: uniform
          placementmetrology: outtol
          triggerselftest: pass
          densityinferred: nominal
          radiographraw: consistent
          attenuationstd: pass
      triggercal:
        label: Shared reference-clock error
        choice: The common timing reference distributes unequal delays, so channels disagree for an electronic rather 
          than physical reason.
        sig:
          arrivalspread: wide
          lotcert: uniform
          placementmetrology: intol
          triggerselftest: fail
          densityinferred: nominal
          radiographraw: consistent
          attenuationstd: pass
      inversion:
        label: Imaging-model error in the state inversion
        choice: The model converting transmission into the reported material state is biased in the range being used, 
          even though the raw data are sound.
        sig:
          arrivalspread: narrow
          lotcert: uniform
          placementmetrology: intol
          triggerselftest: pass
          densityinferred: low
          radiographraw: consistent
          attenuationstd: fail
      withinbudget:
        label: Nothing to explain — inside the declared budget
        choice: Both figures fall inside the predeclared uncertainty budget, so no new cause is needed.
        sig:
          arrivalspread: narrow
          lotcert: uniform
          placementmetrology: intol
          triggerselftest: pass
          densityinferred: nominal
          radiographraw: consistent
          attenuationstd: pass
    dismissal: withinbudget
    answer: lotvariation
    reasons:
      placement: Placement could widen the arrival spread, but metrology puts the fixture inside tolerance and it cannot
        explain the analysis calibration failure.
      triggercal: A shared clock is worth checking, but its self-test passes and it cannot explain the biased inferred 
        state.
      withinbudget: Both headline discrepancies exceed the predeclared budget, and the reference-wedge calibration also 
        fails.
    resolve:
      title: One materials term and one analysis term
      paras:
      - Two independent causes sit in different parts of the evidence chain. Material batches with measurably different 
        propagation speeds widen the sensor arrival spread. Separately, the imaging inversion fails its reference 
        calibration in the range being used, biasing the inferred state even though the raw data are normal.
      - Neither cause explains the other. The honest budget therefore needs two entries rather than one story forced 
        onto every anomaly.
      - This is why an uncertainty budget includes software models and calibration as well as hardware. A model that 
        converts a measurement into a reported quantity is part of the measurement chain.
      why:
        loud: The two headline anomalies belong to different evidence chains and no single cause predicts both.
        quiet: In-tolerance placement and a passing clock self-test remove the other timing explanations, while normal 
          raw imaging plus a failed reference calibration isolates the analysis-side bias.
      chain:
      - Material-batch variation and a mis-calibrated inversion act independently
      - Arrival spread widens from material variation while the inferred state is biased by model error
      - The uncertainty budget records two separate entries rather than hiding one inside the other
      take: When two anomalies sit in different subsystems, the honest budget can need two causes.
    logic:
    - - Wide arrival spread and low inferred state
      - no single cause predicts both
    - - Fixture in tolerance and reference clock passes
      - timing cause narrows to material variation
    - - Material certificates show batch spread
      - first cause confirmed
    - - Raw imaging normal and reference-wedge calibration fails
      - 'second cause confirmed: model error'
  p29:
    id: p29
    level: L4
    compound:
    - realasym
    - channelfail
    title: The channel that disagreed, and the reason it mattered
    role: You are deciding what an integrated trial's diagnostics actually established.
    hook: Four channels watched the trial. Three tell one story and the fourth tells another. Someone has proposed 
      discarding the fourth as a bad channel and reporting the other three. Before that happens, the full panel is on 
      the table.
    riddle: Select the two causes that together account for every reading. No single cause does.
    salient:
    - crosschan
    - gaincheck
    zones:
      channels: Recording channels
      cal: Calibration
      field: Field of view
      hardware: Recovered hardware
    readings:
      crosschan:
        name: Agreement among the three healthy channels
        zone: channels
        observed: they disagree with each other by 9%
        reference: agree within 3%
        purpose: Whether the majority actually forms a consistent account. Three channels outvoting a fourth means 
          nothing if the three do not agree among themselves.
      oddchan:
        name: Fourth channel against the others
        zone: channels
        observed: disagrees
        reference: agrees within 3%
        purpose: The finding that started the argument. A disagreeing channel may be faulty or may be the only one 
          positioned to see something real.
      gaincheck:
        name: Pulser gain check, fourth channel
        zone: cal
        observed: 38% below reference
        reference: within 5% of reference
        purpose: Instrument response to a known injected signal. It tests the channel independently of the event and is 
          the cleanest evidence a channel is not trustworthy.
      baseline:
        name: Pre-shot baseline, fourth channel
        zone: cal
        observed: elevated and drifting
        reference: flat
        purpose: What the channel recorded before anything happened. A disturbed baseline is a property of the 
          instrument, not of the event.
      fiducial:
        name: Timing fiducial on the fourth channel
        zone: channels
        observed: present and clean
        reference: present
        purpose: Whether the channel's record can be placed in time. A lost fiducial misaligns a record without 
          corrupting its amplitude.
      fovmap:
        name: Field-of-view coverage map
        zone: field
        observed: covers the region in question
        reference: covers
        purpose: Whether a diagnostic could see the region at all. A channel that cannot see something is not evidence 
          about it either way.
      witness:
        name: Recovered witness plate
        zone: hardware
        observed: clearly asymmetric
        reference: symmetric
        purpose: A physical record independent of every electronic channel. It cannot be argued with on instrumentation 
          grounds.
      repeat:
        name: Second shot
        zone: channels
        observed: reproduces the same pattern
        reference: reproduces
        purpose: Whether the picture is stable across trials. Reproduction separates a property of the system from an 
          accident of one shot.
    hypotheses:
      channelfail:
        label: The fourth recording channel lost gain
        choice: That channel's response has fallen, so its amplitudes are wrong and its disagreement with the others is 
          an instrument fault rather than an observation.
        sig:
          crosschan: agree
          oddchan: disagree
          gaincheck: low
          baseline: elevated
          fiducial: present
          fovmap: covers
          witness: symmetric
          repeat: reproduces
      realasym:
        label: A genuine asymmetry the channels sample unequally
        choice: The event really was asymmetric, so channels looking at different parts of it correctly report different
          things and no amount of averaging will reconcile them.
        sig:
          crosschan: disagree
          oddchan: disagree
          gaincheck: nominal
          baseline: flat
          fiducial: present
          fovmap: covers
          witness: asymmetric
          repeat: reproduces
      synclost:
        label: The fourth channel lost its timing fiducial
        choice: Without a fiducial that record cannot be aligned with the others, so it appears to disagree purely 
          because it is placed wrongly in time.
        sig:
          crosschan: agree
          oddchan: disagree
          gaincheck: nominal
          baseline: flat
          fiducial: missing
          fovmap: covers
          witness: symmetric
          repeat: reproduces
      fieldofview:
        label: The fourth channel could not see the region
        choice: Its field of view excluded the area in question, so its record is not evidence about that region at all 
          and the apparent conflict is not a conflict.
        sig:
          crosschan: agree
          oddchan: disagree
          gaincheck: nominal
          baseline: flat
          fiducial: present
          fovmap: excludes
          witness: symmetric
          repeat: reproduces
      agreement:
        label: Nothing to explain — they agree within uncertainty
        choice: Once each channel's uncertainty is allowed for, all four records are compatible and there is no 
          disagreement to account for.
        sig:
          crosschan: agree
          oddchan: agree
          gaincheck: nominal
          baseline: flat
          fiducial: present
          fovmap: covers
          witness: symmetric
          repeat: reproduces
    dismissal: agreement
    answer: realasym
    reasons:
      synclost: A lost fiducial is a real way for a channel to disagree without being wrong about amplitude. This one's 
        fiducial is present and clean, and a timing misalignment would not explain a gain check 38% low or a drifting 
        baseline.
      fieldofview: A channel that cannot see a region should not be treated as evidence about it, so the check is the 
        right one to make. The coverage map shows this channel covering the region in question, and like the fiducial 
        explanation it accounts for nothing on the calibration side.
      agreement: The 3 so-called healthy channels disagree with each other by 9% against a 3% specification, and the 
        recovered witness plate is clearly asymmetric. There is a disagreement, and it is not an artifact of 
        uncertainty.
    resolve:
      title: A real asymmetry and a broken channel, at the same time
      paras:
      - Two things are true at once. The event genuinely was asymmetric — the 3 surviving channels disagree with each 
        other by 9%, and the recovered witness plate, which owes nothing to any electronic channel, is clearly 
        asymmetric. And separately, the fourth channel really has lost gain, with a pulser check 38% low and a drifting 
        pre-shot baseline.
      - "The proposal on the table was to discard the fourth channel and report the other three. That would have been half
        right and wholly misleading: the channel is faulty, but the disagreement it was blamed for is real and survives its
        removal. Discarding it would have produced three mutually inconsistent records reported as a consistent result."
      - This is what integrated diagnostic coverage is for. A single faulty channel is recoverable. A faulty channel 
        that happens to sit where a real effect is visible is only recoverable if there is independent evidence — here, 
        the mutual disagreement among the others and a piece of recovered hardware.
      why:
        loud: The two headline findings pull in opposite directions and cannot both be explained by one cause. Mutual 
          disagreement among the healthy channels is evidence of a real asymmetry; a gain check 38% low is evidence of a
          broken instrument. Either one alone tells a clean story, and the clean story is wrong.
        quiet: The quiet readings assign each finding to its own cause. A present fiducial and a covering field of view 
          remove the other explanations for the fourth channel's behaviour, leaving a genuine gain failure. The 
          asymmetric witness plate and the reproducing second shot establish the asymmetry independently of every 
          channel, including the broken one.
      chain:
      - A real asymmetry and an independent channel gain failure occur in the same trial
      - The broken channel is blamed for a disagreement that is genuinely present
      - Discarding it would report three inconsistent records as a consistent result
      take: A channel can be faulty and still be pointing at something real. Prove the fault and the finding separately.
    logic:
    - - Healthy channels disagree 9%, fourth channel gain 38% low
      - no single cause predicts both
    - - Fiducial present, field of view covers the region
      - the fourth channel's problem is gain, not alignment or coverage
    - - Witness plate clearly asymmetric
      - the asymmetry is real, independent of every channel
    - - Second shot reproduces the pattern
      - a property of the system, not an accident of one trial

# Between-mission funding vignettes.
specialRequests:
  3:
    personId: hinton
    cost: 2
    title: Criticality safety interlocks for the chemistry wing
    division: CM
    paragraphs:
    - Joan Hinton, who works on critical assembly diagnostics, has flagged that the chemistry wing where plutonium 
      solutions are handled still relies on a single administrative limit for mass and geometry. One mislabeled beaker 
      or an extra transfer could bring fissile material close to a critical configuration. A $2 interlock — a second 
      independent mass accounting check plus a neutron counter at the doorway — would give a layered safety case instead
      of trusting 1 person’s arithmetic.
    - This is not just a science question. The technicians are mostly young women on 12-hour shifts, sharing thin-walled
      hutments, and a criticality accident would be a health and community catastrophe before it ever affected the 
      weapon program. Hinton argues that spending now preserves both accurate chemistry yields and the lives of the 
      people who live two blocks from the lab. As director you can approve the $2 from the $20 reserve, or defer and 
      accept 12–24h of added risk while the lab operates on a single barrier.
  6:
    personId: hornig
    cost: 3
    title: Ventilation upgrade for plutonium metallurgy
    division: CM
    paragraphs:
    - "Donald Hornig’s metallurgy group is pressing plutonium ingots in a lab where the ventilation hoods were sized for uranium.
      Plutonium dust is alpha-active: a few micrograms lodged in a lung delivers a lifetime dose, and the hoods now run at
      only 60% of the face velocity needed. Hornig needs $3 for a filtered exhaust upgrade and daily nose-count swipes. The
      science is clear — without it, solubility measurements will drift as surface oxide builds, and the yield verification
      you need for Mission 5 will be unreliable."
    - "The human cost is visible around town: families share laundry where dust can travel home, the school is 400 meters
      downwind, and the infirmary has only 12 beds for a mesa that will soon hold 6,000 people. Hornig frames the request
      as both measurement fidelity and public health. Funding it keeps the phase-diagram work honest; deferring it saves $3
      now but adds 12–24h while the group reworks contaminated samples and the town absorbs avoidable exposure."
  9:
    personId: mckibbin
    cost: 2
    title: Housing Office support for arriving families
    division: E
    paragraphs:
    - Dorothy McKibbin, who runs the gate at 109 East Palace in Santa Fe and assigns every hutment on the Hill, reports 
      that 40 families arriving for the implosion push are bunked in unheated Pacific huts with a single pot-belly 
      stove. Children are studying by coal light, and the community school — staffed by scientists’ wives — has doubled 
      to 150 pupils without extra benches or paper. A $2 allocation would finish Sundt duplex partitions, add a coal 
      delivery, and buy school supplies.
    - "From a program view this looks like “town” rather than “physics,” but McKibbin notes the link: engineers who spent
      the night shoveling ash or nursing a sick child make timing errors on lens molds the next day. Fuller Lodge evening
      lectures and Saturday dances at the theater are not luxuries; they are the retention system for a town that cannot be
      resupplied quickly at 7,300 feet. Approving keeps the technical workforce functional; deferring risks 12–24h of absenteeism
      and rework."
  12:
    personId: bradbury
    cost: 3
    title: Theater and PX film for morale and timing calibration
    division: X
    paragraphs:
    - Norris Bradbury, who will soon oversee assembly, requests $3 to keep Theater No. 2 running 3 nights a week and to 
      buy high-speed film for the P-Division imaging group that shares the same projection budget. The cultural argument
      and the science argument coincide. The theater is the only building where the entire mesa can hear the same 
      colloquium — Bethe on implosion was given there in February — and where mixed crews discuss misalignments without 
      rank. Without it, X-Division lens crews and E-Division ordnance drift into separate vocabularies.
    - For health, the same film stock is also used to radiograph inert lens assemblies; without a steady supply, crews 
      will test with fewer views and miss asymmetry that later shows up as jetting. At 2,200 m, with censored mail and 
      no road out without a pass, morale directly governs precision. Funding both uses of the film sustains the shared 
      language you built in Mission 1; deferring saves $3 but adds 12–24h as teams re-establish common timing baselines.
  15:
    personId: kitty
    cost: 2
    title: Post-Trinity health follow-up and community support
    division: CM
    paragraphs:
    - "Kitty Oppenheimer, in her role coordinating housing and infirmary liaison, asks for $2 to expand the infirmary’s post-shot
      capacity: iodine tablets, additional nose counts, and a visiting nurse for the canyon trailers where dust settled after
      the test. The immediate fission yield may be known, but the delayed health picture is not. Fallout is not yet understood
      by the community, and families are already asking whether the pond water is safe."
    - Even if the technical chain is complete, the town’s trust is part of the evidence chain. A complete dossier must 
      include what was promised about return to the mesa, how samples will be tracked, and what families are told about 
      life downwind. This is the cultural and ethical counterpart to the technical freeze you will impose in Mission 15.
      Approving acknowledges that responsibility persists after a device is complete; deferring saves $2 now but incurs 
      12–24h while rumors and incomplete records compound.

# What is inside each room.
interiors:
  T:
    caption: A number without its uncertainty is an opinion with a decimal point.
    standLine: Two computing groups have returned estimates that disagree by more than either one’s stated error. One of
      the two error bars is wrong.
    station:
      kind: panel
      title: Computing room
      rows:
      - label: Group A estimate
        value: 1.00 ×
        status: normal
      - label: Group B estimate
        value: 1.31 ×
        status: high
      - label: Stated spread
        value: ± 4 %
        status: alarm
      - label: Method
        value: hand computation, checked twice
        status: normal
  P:
    caption: Counting is a random process. A single run is a sample, not a result.
    standLine: The counter is running against a background that has not been measured today. Everything downstream 
      depends on that subtraction.
    station:
      kind: vitals
      animated: true
      wave: ecg
      rate: 7
      title: Counting bench
      rows:
      - label: Counts
        value: 412
        unit: per minute
        status: normal
      - label: Background
        value: not run
        unit: today
        status: alarm
      - label: Dead time
        value: 3.1
        unit: "% of window"
        status: high
  CM:
    caption: A material is what the analysis says it is, not what the label says.
    standLine: Purity is inside tolerance and the swipe survey outside the glovebox is not. Both belong to the same 
      batch.
    station:
      kind: panel
      title: Metallurgy bay
      rows:
      - label: Purity, assayed
        value: 99.4 %
        status: normal
      - label: Swipe, bench edge
        value: above limit
        status: alarm
      - label: Glovebox pressure
        value: "-12 Pa"
        status: normal
      - label: Batch traceability
        value: complete
        status: normal
  E:
    caption: An interface is where two groups each assumed the other had it.
    standLine: Channel timing across the firing set is inside specification on average and outside it on two channels. 
      Averages do not fire anything.
    station:
      kind: vitals
      animated: true
      wave: sine
      rate: 4
      title: Timing rig
      status: high
      rows:
      - label: Spread, all channels
        value: 0.9
        unit: µs
        status: normal
      - label: Worst channel
        value: 4.2
        unit: µs
        status: alarm
      - label: Qualification shots
        value: 6
        unit: of 20
        status: low
  X:
    caption: Integration is where four groups’ evidence has to survive being put together.
    standLine: Every group reports success against its own criterion. The question on this bench is whether the four 
      criteria are the same one.
    station:
      kind: panel
      title: Integration board
      rows:
      - label: Theory
        value: estimate delivered
        status: normal
      - label: Diagnostics
        value: background pending
        status: high
      - label: Materials
        value: batch cleared
        status: normal
      - label: Engineering
        value: two channels out
        status: alarm
      - label: Agreed criterion
        value: none written
        status: alarm

# --------------------------------------------------------------- the warm-ups
warmups:
  greet:
    title: The mesa is full of people who cannot tell you what they do
    why: Meet the people in each division so you know who can help when the work begins.
  trial-near:
    title: Walk the mesa before you are trusted with an errand on it
    why: Visit the main buildings now so you can cross the mesa quickly when an urgent job starts.
  follow:
    title: Keep up with the commanding general
    why: Keep up with the commanding general so you can see which parts of the lab need help.
  hunt:
    title: Five detectors signed out, and the log accounts for three
    item: {name: detector, plural: detectors}
    why: Find the two missing detectors so every later count can be tied to the right instrument.
  canvass:
    title: Who is worried about the same thing you are
    why: Ask each division about the problem so you know whether anyone has already solved part of it.
  evade:
    title: The security officer with questions about your notebook
    why: Avoid the security officer until the laboratory director can explain why your notebook was in the wrong building.
  tag:
    title: Catch the theory chief before the Tuesday meeting
    why: Reach the theory chief before his meeting so your team uses the corrected number this afternoon.

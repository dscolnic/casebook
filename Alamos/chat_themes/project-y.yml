- group: E
  task: Allocate 100 research credits across the 3 proposals. You may hold credits in reserve, but explain the decision 
    criterion.
  title: Choose materials for an inert wave-propagation study
  setup: Choose a safe research portfolio; the lesson contains no energetic formulations or processing recipes.
  scene: >-
    The inert wave-shaping program needs materials whose propagation properties are repeatable enough to support a model.
    The panel has to choose whether to chase ideal single-sample performance or reproducible material characterization.
  guide: >-
    A lens works only if the wave behaviour and the castings both hold from
    segment to segment. Detonation velocity is one property and can be optimised
    on its own. Stability, compatibility, aging and casting quality are the
    others, and each is measured separately. Machinability is real and immediate,
    and says nothing about how a wave crosses a boundary. Inert characterisation
    with small authorized tests and aging observations is the slowest route. It is
    also the only one that reports on more than one property at a time.
  rules: >-
    Spread the hundred points across the 3 proposals. At least 80 of them have to
    be committed, because a panel that funds almost nothing has not decided
    anything. Your largest single allocation must be 35 or more, and it has to
    land on what the evidence supports most. Keep the total sitting on proposals
    the evidence does not support under fifteen. And a proposal it does support

    task: Estimate the work scale.
    title: Equations of state
    setup: A notional sample experiences an average pressure of 5 x 10^9 Pa while its volume decreases by 2 x 10^-6 m^3.
    scene: Von Neumann, a mathematician on the implosion work, is calculating work done on a material at pressures nothing in the laboratory has ever measured, 
      and wants the units checked line by line. An error in the units looks exactly like an error in the physics.
    guide: >-
      Four numbers: two pressures and two volumes, each pair a hundredfold apart.
      Ask of each whether it describes this regime or handbook conditions. Work is a
      pressure times a volume change, so an error in either is an error of the same
      size in the answer.
    background:
    - >-
      Why an estimate rather than a calculation. Every quantity on this board is
      already measured or stated, so nothing here has to be derived. What is being
      tested is whether you can pick the quantities the relationship actually needs,
      and whether the size of the answer looks right once they are in place.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the
      relationship it is going into. Reading the label is how a unit mismatch, or a
      quantity belonging to a different part of the problem, is caught before it is
      placed — which is the habit this format exists to build.
    takesAsRead:
    - "Units and conversions: MeV, u, barns, scientific notation"
    assumes:
    - pressure times a volume change is work
    takeaway: Extreme-state calculations require both thermodynamic relationships and careful unit scaling.
    format: BALLPARK
    why: An equation of state ties pressure, density, temperature and internal energy together for a substance. The 
      familiar handbook values were all taken at room conditions. They describe a completely different regime from the 
      one implosion makes. That is why this work is unforgiving in two directions at once. The thermodynamics has to be 
      right. So does every unit conversion carrying it across many powers of ten. Pressure in pascals times a volume 
      change in cubic metres gives joules, and the powers of ten do most of the work.
    estimate:
      prompt: A sample is compressed by an average pressure of 5×10⁹ Pa while its volume falls by 2×10⁻⁶ m³. Estimate 
        the compression work.
      question: Choose the pressure and the volume change.
      labels:
      - 5×10⁹ Pa
      - 2×10⁻⁶ m³
      - 5×10⁶ Pa
      - 2×10⁻⁴ m³
      values: [5000000000, 0.000002, 5000000, 0.0002]
      slots: 2
      template: work ≈ {0} × {1}
      formula: a*b
      correct: [0, 1]
      target: 10000
      tolerance: 1200
      units: J
      solution: 5×10⁹ Pa × 2×10⁻⁶ m³ ≈ 10⁴ J.
      explanation: "Gigapascal pressure acting on a few cubic centimetres is kilojoule-scale work. That number sets the bar
        for whatever drives the compression: it has to deliver at least this much into the sample. It is also why chemical
        explosive, at a few megajoules per kilogram, is a credible driver at this scale — the energy is available, the difficulty
        is delivering it symmetrically."
      givens:
      - Work scale is pressure x volume change
      relationship: Work ≈ pressure × the volume change it acts through.

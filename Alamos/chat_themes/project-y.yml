  - group: P
    task: Estimate the blur distance.
    title: High-speed imaging and radiography
    concept: Order-of-magnitude estimation from givens
    scene: >-
      On the analysis table are high-speed photographs from yesterday’s implosion test,
      with radiographs of the opaque assembly beside them. Each image is labeled with
      its exposure time. Bacher has listed the object speeds and the feature sizes his
      committee wants measured.
    guide: >-
      Four numbers, and two of them are exposure times a thousand apart. Ask of each
      which one this camera used. And note what the answer is: a limit the optics
      cannot beat. Anything moving during the exposure travels a real distance, and
      that distance is the blur.
    background:
    - >-
      Why an estimate rather than a calculation. Every quantity on this board is
      already measured or stated, so nothing here has to be derived. What is being
      tested is whether you can pick the quantities the relationship actually needs,
      and whether the size of the answer looks right once they are in place.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the
      relationship it is going into. Reading the label is how a unit mismatch, or a
      quantity belonging to a different part of the problem, is caught before it is
      placed — which is the habit this format exists to build.
    assumes:
    - a photograph records everything that happened while the shutter was open
    takeaway: Exposure time sets a direct spatial-blur limit for rapidly moving objects.
    format: BALLPARK
    answerText: 0.5 mm.
    why: "Anything moving during the exposure travels a real distance, and that distance becomes motion blur: speed times
      exposure time. 500 metres per second across 1 microsecond is half a millimetre. That is a resolution limit even if the
      optics are perfect. Exposure time, viewing angle, penetration, and timing all decide what an image can establish. Blur
      is especially useful because it is calculable before the shot, so the diagnostic can be designed around the feature
      size rather than judged afterwards."
    call: Apply high-speed imaging and radiography
    reason: The lab needs to see motion during today's inert test instead of guessing from broken parts after it ends.
    setup: An object moves at 500 m/s during a 1 microsecond exposure.
    estimate:
      prompt: An object moving at 500 m/s is recorded with a 1-microsecond (10⁻⁶ s) exposure. Estimate the motion blur 
        in millimetres.
      question: Choose the speed, the exposure time, and the metres-to-millimetres conversion.
      labels:
      - 500 m/s
      - 10⁻⁶ s
      - 1,000 mm/m
      - 10⁻³ s
      values: [500, 0.000001, 1000, 0.001]
      slots: 3
      template: blur ≈ {0} × {1} × {2}
      formula: a*b*c
      correct: [0, 1, 2]
      target: 0.5
      tolerance: 0.06
      units: mm
      solution: 500 m/s × 10⁻⁶ s × 1,000 mm/m ≈ 0.5 mm.
      explanation: "0.5 mm of blur. Whether that is acceptable is not a property of the camera but a comparison: blur has
        to be small against the feature being resolved. A boundary moving across a 5 mm gap is measurable at this exposure;
        a 0.5 mm perturbation is not measurable at all, because it is smeared into its own width. Shortening the exposure
        is the only lever that does not also cost signal."
      givens:
      - Blur distance = speed x exposure time
      relationship: Motion blur = speed × exposure time. Multiply by 1,000 to turn metres into millimetres.

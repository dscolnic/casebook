    task: A nucleus at rest splits into a heavy and a light fragment. Which carries more kinetic energy?
    title: Where the fragments go
    concept: Conservation of energy and momentum in reactions
    place: Diagnostics Bay
    scene: >-
      A nucleus at rest splits into a heavy fragment and a light one. The masses are
      measured and the bay is arguing about which fragment carries the larger share of
      kinetic energy. Bethe has asked for an answer before anyone looks at the detector
      data.
    guide: >-
      Four answers, and the nucleus started at rest. Ask of each whether it respects
      that. Total momentum was zero, so the two fragments leave with equal and
      opposite momentum. From there the question is what equal momentum does to two
      different masses, and one option refuses to decide at all.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to
      be the answer under one specific misreading — a step skipped, a quantity
      confused with a rate, a correlation taken for a cause. Identifying which
      misreading each belongs to is where the learning is; the right answer alone
      can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the
      qualifying clause and the unit. So across a whole game the key used to be the
      longest option far more often than chance — 88 per cent of passage quizzes
      here, before it was fixed. It is now checked per game as a binomial tail, so
      length, hedging and specificity have had the signal taken out of them
      deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the
      verdict prints them — the reason that option fails, not a restatement of the
      right one. They are worth reading after a correct answer as well: a right
      choice made for an approximate reason is indistinguishable from a sound one
      until the day the approximation is what is being tested.
    assumes:
    - momentum is conserved in an isolated system
    takeaway: Momentum conservation fixes the ratio of fragment speeds, and energy follows from it.
    format: CHOICE
    answerText: The lighter fragment carries more kinetic energy. Equal and opposite momenta imply K = p²/(2m), so at 
      the same |p| the smaller mass has the larger kinetic energy.
    why: The nucleus starts at rest, so total momentum is zero. The two fragments therefore leave with equal and 
      opposite momentum. The lighter fragment must move faster because the momentum magnitude is the same for both. 
      Kinetic energy can be written as p²/(2m). At equal momentum, the smaller mass has the larger kinetic energy. 
      Momentum conservation fixes the relation between the motions; the energy formula then tells how the released 
      energy is divided.
    call: Recognize measurements that share an error
    reason: Two agreeing tools may share one fault, so today's budget must not count them as separate proof.
    rebuttals:
    - Kinetic energy at fixed momentum falls with mass rather than rising with it.
    - Equal momenta do not mean equal energies, because energy depends on momentum squared over mass.
    - The binding energies fix the total energy released, not how it divides between the fragments.
    choices:
    - "The lighter one: equal and opposite momenta give it the greater speed."
    - "The heavier one: kinetic energy rises with the mass of the fragment."
    - They share it equally, since momentum is conserved in the split.
    - It cannot be decided without knowing the two binding energies.
    answer: "The lighter one: equal and opposite momenta give it the greater speed."

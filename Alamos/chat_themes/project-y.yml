    title: What evidence qualifies a production lot?
    scene: >-
      A production lot of timing modules is waiting on a release decision. The bench holds one carefully built prototype,
      dimensional inspection records, and access to a large integrated trial.
    guide: >-
      Ask what each option tells you about the units in the lot. A champion prototype measures design potential. Inspection
      measures conformance. A large integrated trial entangles many causes. The release claim is about the distribution of
      the manufactured population.
    background:
    - >-
      Why a prototype cannot qualify a lot. It was built by the best person
      available, slowly, with attention nobody can repeat a thousand times. It
      measures what the design can do, not what the production line did. Those are
      different questions and the release decision is about the second.
    - >-
      What inspection records can and cannot show. They record that units passed the
      checks somebody chose. If the failure mode is not among those checks, a
      perfect record is consistent with a bad lot — which is why sampled functional
      testing exists at all.
    - >-
      Why the full-system trial is seductive and expensive. It exercises everything
      at once, so a pass is reassuring and a failure is hard to attribute. Spending
      most of the credit on one integrated result can leave you knowing that
      something worked without knowing whether this lot will.
    assumes:
    - a sample can estimate the spread of a production population
    - a component test is more diagnostic than an integrated test when the component itself is the question
    takeaway: Reliability is a population property, so lot acceptance must sample the manufactured distribution rather 
      than its best member.
    format: VALUE
    question: Which measurement tells you whether a production lot is reliable?
    value:
      hint: You can buy one test plan. Read what each plan would reveal before spending the credits; the release 
        decision is about the manufactured population.
      budget:
        amount: 100
        unit: credits
      decision: Release or hold a production lot based on evidence about its timing-performance distribution.
      options:
      - id: lots
        label: Sample several lots and measure timing spread
        cost: 100
        axis: population timing distribution
        decisive: true
        reveals: Whether the manufactured population, including its tail, meets the stated timing-performance 
          requirement.
      - id: champion
        label: Build one best-achievable timing module and cycle it repeatedly
        cost: 100
        axis: single-unit repeatability
        decisive: false
        reveals: How repeatable one specially prepared unit is, without showing lot-to-lot or unit-to-unit spread.
      - id: dimensions
        label: Tighten drawing tolerances and re-inspect dimensions
        cost: 100
        axis: dimensional conformance
        decisive: false
        reveals: Whether parts match the drawing more closely, not whether accepted parts fire with the required timing 
          spread.
      - id: system
        label: Wait for the next large integrated inert trial
        cost: 100
        axis: integrated outcome
        decisive: false
        reveals: Whether the whole system performed, while leaving many component causes entangled if it did not.
    answerText: Spend the test budget sampling several lots and measuring the timing spread. That evidence directly 
      tests the population being accepted.
    why: A single excellent unit can be repeatable and still say nothing about the next units off the line. Lot 
      acceptance is a population claim. Dimensional inspection checks conformance to a drawing, not functional timing. A
      large integrated trial mixes too many causes. Sampling the manufactured population exposes unit-to-unit and 
      lot-to-lot spread and directly answers the release decision.

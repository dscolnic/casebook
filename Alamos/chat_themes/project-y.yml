    only one. An order can run on cost, on risk, or on reversibility — every
    observation that leaves the sample as it was, before any that consumes it. On
    those boards a chronological reading finds nothing, because none of the steps
    has to happen at a particular hour.
  takeaway: A design is not changed until the whole evidence system is changed with it.
  format: SEQUENCE
  why: A late change propagates through hardware, procedures, training, and interpretation of earlier tests.
  cards:
  - Document the anomaly and identify every affected interface and test result.

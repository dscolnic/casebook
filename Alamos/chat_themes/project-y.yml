    dissolved at all? Or what the air can do to it? Oxidation state and
    complexation are usually what decide where an element ends up.
  background:
  - >-
    Why this is a matching board and not four separate questions. Responses on
    boards like this are written to be plausible for more than one situation, so
    choosing them one at a time lets a nearly-right answer through unexamined.
    Having to place all of them forces the comparison — not "is this reasonable
    here", but "is it more right here than there".
  - >-
    How to use the one-each rule. Because the responses are a set to be
    distributed rather than a list to be sampled, every join you make constrains
    the rest. Settling the two you are confident of can leave the remaining pair
    decided by elimination. Where it does not, two responses are still competing
    for one situation, and that is exactly the distinction the stop is testing.
  - >-
    Why you cannot be wrong about exactly one. With every response used once,
    three correct joins leave the fourth with only one place to go. Any error
    therefore involves at least two joins. That is worth remembering when the last
    pair looks forced: the fault is usually not in the join you are struggling
    with, but in one you made early and stopped questioning.
  takeaway: Separation chemistry is controlled manipulation of equilibrium, not magic filtration.
  format: PROTOCOL
  why: Oxidation state and complexation often control where an element resides.
  columns:
  - What you want to do
  - How you do it
  scenarios:
  - Change an ion’s oxidation state
  - Keep a metal ion dissolved
  - Drive a sparingly soluble compound to precipitate
  - Prevent unwanted oxidation by air
  choices:
  - Add a redox reagent under monitored conditions.
  - Add a suitable complexing ligand.
  - Adjust chemistry to exceed solubility product.
  - Use an inert atmosphere or reducing conditions.
  mapping: [0, 1, 2, 3]
  answerText: Change an ion’s oxidation state -> Add a redox reagent under monitored conditions; Keep a metal ion 
    dissolved -> Add a suitable complexing ligand; Drive a sparingly soluble compound to precipitate -> Adjust chemistry
    to exceed solubility product; Prevent unwanted oxidation by air -> Use an inert atmosphere or reducing conditions
- group: CM
  task: Arrange the four cards from earliest cause or prerequisite to latest result.
  title: Precipitation and solubility
  setup: Order the procedure.
  scene: >-
    Seaborg is precipitating a batch and the yield and the purity are not telling the same
    story. He wants the procedure fixed in writing before the next one goes in. There is
    not enough of this material to redo a batch.
  guide: >-
    All four steps happen, so ask what each one leaves for the next. A solid
    cannot be separated before it has grown. And a yield measured before washing
    includes whatever came out with it. Purity and yield are two different
    numbers, and only one of them is flattered by skipping a step.
  background:
  - >-
    Why the order is graded whole. A sequence is a claim about dependency: each
    step is here because the one before it has already happened, or has to have.
    One transposed pair falsifies that claim wherever it sits, so partial credit
    would be credit for a sequence that does not work.
  - >-
    Why the ends are the place to start. The first and last cards are constrained
    by having nothing before or after them, which usually makes them the two you
    can settle from the scene alone. Pinning them collapses the remaining
    arrangements sharply, and what is left in the middle is where the actual
    judgement lives.
  - >-
    What the rail can be ordered on. Time is the usual axis, but it is not the
    only one. An order can run on cost, on risk, or on reversibility — every
    observation that leaves the sample as it was, before any that consumes it. On
    those boards a chronological reading finds nothing, because none of the steps
    has to happen at a particular hour.
  takeaway: A precipitate is both a chemical product and a potential collector of impurities.
  format: SEQUENCE
  why: Yield without washing and purity checks can preserve contaminants.
  cards:
  - Adjust solution conditions to form the desired solid
  - Allow nucleation and growth under controlled mixing
  - Separate and wash the precipitate
  - Measure yield and purity
  order: [0, 1, 2, 3]
  answerText: 2 -> 3 -> 4 -> 5 (Adjust solution conditions to form the desired solid -> Allow nucleation and growth 
    under controlled mixing -> Separate and wash the precipitate -> Measure yield and purity)
- group: CM
  task: Estimate the fraction extracted in one stage.
  title: Solvent extraction
  setup: A solute has distribution ratio D=4 between organic and aqueous phases, with equal phase volumes.
  scene: >-
    Seaborg has a solute that favours the organic phase four to one over the aqueous, with
    the two phase volumes equal. Before the stage count is fixed he wants to know what a
    single pass actually recovers.
  guide: >-
    Four numbers, in two pairs, and only one of each belongs here. Ask of each
    whether it is a distribution ratio or a phase-volume ratio. Both are ratios,
    which is why the labels matter more than the values. And note what one stage
    can and cannot achieve.
  background:
  - >-
    Why an estimate rather than a calculation. Every quantity on this board is
    already measured or stated, so nothing here has to be derived. What is being
    tested is whether you can pick the quantities the relationship actually needs,
    and whether the size of the answer looks right once they are in place.
  - >-
    Why the tiles carry labels. A bare number cannot be checked against the
    relationship it is going into. Reading the label is how a unit mismatch, or a
    quantity belonging to a different part of the problem, is caught before it is
    placed — which is the habit this format exists to build.
  takeaway: Several modest stages can outperform one imperfect separation.
  format: BALLPARK
  why: 4/(4+1)=0.8.
  estimate:
    prompt: A solute has a distribution ratio of 4 between the organic and aqueous phases, and the 2 phase volumes are 
      equal. Estimate the percentage extracted in one stage.
    question: Choose the distribution ratio and the phase-volume ratio.
    labels:
    - 4 distribution ratio
    - 1 equal phase-volume ratio
    - 40 distribution ratio
    - 0.1 phase-volume ratio
    values: [4, 1, 40, 0.1]
    slots: 2
    template: fraction extracted ≈ {0} ÷ ({0}+{1}) × 100
    formula: a/(a+b)*100
    correct: [0, 1]
    target: 80
    tolerance: 3
    units: "%"
    solution: 4 ÷ (4+1) × 100 ≈ 80%.
    explanation: 1 stage at D = 4 leaves a fifth of the solute behind. A second identical stage would leave a fifth of 
      that again, which is why extraction is run as a series of stages rather than pushed to completion in one.
    givens:
    - Fraction in organic phase = D/(D+1) for equal volumes
    relationship: Fraction extracted = D ÷ (D + phase-volume ratio), as a percentage.
  answerText: About 80%.
- group: CM
  task: Arrange the four cards from earliest cause or prerequisite to latest result.
  title: Ion exchange
  setup: Order the column workflow.
  scene: >-
    A column run has lost part of the target and nobody can say at which step. Seaborg
    wants the resin work written down as a standing procedure before the next small batch
    goes onto it. There is not enough to lose twice.
  guide: >-
    All four steps happen, so ask what each one needs to be true first. A resin in
    the wrong chemical form has no selectivity to offer. Loading past capacity
    means the front is already at the outlet. And washing has to come before
    elution, or it takes the target with it.
  background:
  - >-
    Why the order is graded whole. A sequence is a claim about dependency: each
    step is here because the one before it has already happened, or has to have.
    One transposed pair falsifies that claim wherever it sits, so partial credit
    would be credit for a sequence that does not work.
  - >-
    Why the ends are the place to start. The first and last cards are constrained
    by having nothing before or after them, which usually makes them the two you
    can settle from the scene alone. Pinning them collapses the remaining
    arrangements sharply, and what is left in the middle is where the actual
    judgement lives.
  - >-
    What the rail can be ordered on. Time is the usual axis, but it is not the
    only one. An order can run on cost, on risk, or on reversibility — every
    observation that leaves the sample as it was, before any that consumes it. On
    those boards a chronological reading finds nothing, because none of the steps
    has to happen at a particular hour.
  takeaway: Breakthrough signals that the process is outrunning the resin capacity.
  format: SEQUENCE
  why: Column selectivity is useful only when capacity and chemical form are controlled.
  cards:
  - Condition the resin in the desired chemical form
  - Load the sample below capacity
  - Wash away weakly retained species
  - Elute the target under changed conditions
  order: [0, 1, 2, 3]
  answerText: 2 -> 3 -> 4 -> 5 (Condition the resin in the desired chemical form -> Load the sample below capacity -> 
    Wash away weakly retained species -> Elute the target under changed conditions)

    are controlled.'
  format: SCIENCETANK
  why: A useful research material must have measurable propagation properties, batch consistency, manufacturability, and
    a safe repeatable test method.
  proposals:
  - label: A
    text: Choose the single specimen with the most extreme propagation contrast and optimize around it.
  - label: B
    text: Characterize several safe inert materials across batches, measuring propagation speed, uniformity, and 

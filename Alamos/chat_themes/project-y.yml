- title: Make 'Nearly Simultaneous' Measurable
  objective: Turn vague claims about timing and symmetry into calibrated measurement requirements and explicit 
    uncertainty budgets.
  briefing: Different groups are using words such as 'simultaneous' and 'symmetric' without a shared quantitative test. 
    The player dates a decaying source, traces timing jitter through an instrument chain, calculates a cable-delay 
    mismatch, and controls a numerical chain-reaction model rather than operating real critical hardware.
  stake: It is October 1944, and three teams use the words "nearly at once" in three different ways. A vague claim cannot
    guide a test or show that a system works. Today you must choose a shared measure, show how to read it, and state its doubt.
    After this, every timing claim must come with a number and a check.
  takeaway: Engineering language becomes scientific evidence only when qualitative requirements are tied to calibrated 
    observables and uncertainty.
  stops:
  - group: X
    call: Define an arrival-time symmetry metric
    reason: The teams need one timing measure today before they can compare whether an inert test is truly even.
    task: Use the supplied values and give a sensible rounded result with units.
    title: How many half-lives have passed
    place: Diagnostics Bay
    question: Estimate the elapsed time since the first count.
    scene: A sample counted at 8,000 counts a minute reads 500 today, and the notebook does not say when the first count
      was taken. Kistiakowsky wants the elapsed time; the chart puts the half-life at 12 hours.
    guide: >-
      Six numbers, and three of them are steps of the working: a ratio, a count of
      halvings, and a base. Ask of each whether the relationship needs it or
      produces it. And note the habit. Work in ratios rather than differences,
      because a drop of 7,500 counts means nothing on its own.
    background:
    - >-
      Why an estimate rather than a calculation. Every quantity on this board is
      already measured or stated, so nothing here has to be derived. What is being
      tested is whether you can pick the quantities the relationship actually needs,
      and whether the size of the answer looks right once they are in place.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the
      relationship it is going into. Reading the label is how a unit mismatch, or a
      quantity belonging to a different part of the problem, is caught before it is
      placed — which is the habit this format exists to build.
    assumes:
    - a half-life is the time for half of a sample to decay
    takeaway: Exponential decay is counted in half-lives, and logarithms are how you get the number of them.
    format: BALLPARK
    why: "Every half-life halves the count rate, so the elapsed time is the number of halvings times the half-life. 8000 to
      500 is a factor of 32 is 2 to the fourth: 4 half-lives, or 48 hours. Written as a logarithm it is log base two of the
      ratio, which is what a semi-log plot shows as a straight line. The useful habit is to work in ratios rather than differences
      — the difference of 7,500 counts means nothing on its own."
    estimate:
      prompt: A sample read 8,000 counts a minute when it was first measured and reads 500 today. The half-life on the 
        chart is 12 hours.
      question: Estimate the elapsed time since the first count.
      labels:
      - 8,000 cpm (the first count)
      - 500 cpm (today)
      - 12 h (half-life)
      - 16 (the ratio)
      - 4 (halvings)
      - 2 (the base)
      values: [8000, 500, 12, 16, 4, 2]
      slots: 3
      template: log2({0} ÷ {1}) × {2}
      formula: Math.log2(a/b)*c
      correct: [0, 1, 2]
      target: 48
      tolerance: 6
      units: hours
      solution: 8,000 ÷ 500 = 16. log2(16) = 4 half-lives. Times 12 hours is 48 hours.
      explanation: Work in ratios, not differences. The rate falls by a constant factor each half-life.
      relationship: Elapsed time = half-life × log2(first rate ÷ present rate).
    answerText: 8,000 to 500 is a factor of 16, which is 4 half-lives, so about 48 hours.
  - group: P
    task: Change one part of the timing chain at a time. Compare the arrival-time spread after each substitution, then 
      restore the live path to confirm which change actually removes the jitter.
    title: Find where timing jitter enters
    scene: A timing array is disagreeing with itself, and Bacher has ruled that until this is settled no symmetry claim 
      from it means anything. The Hill is about to spend months measuring differences of nanoseconds.
    guide: >-
      The number you are watching is the spread in arrival times between channels,
      and the live path gives about fourteen nanoseconds of it. Substituting a
      reference part asks a specific question: if that part were perfect, how much
      spread would be left? A substitution that leaves the spread where it was has
      cleared that part. Run one at a time, restore it, and name the stage the
      spread follows.
    background:
    - >-
      What the spread is made of. Every stage between the particle and the recorded
      time adds its own variation: how the detector forms a pulse, how the cable
      carries it, how the discriminator decides when the pulse crossed a threshold.
      Those add in quadrature, so the largest one dominates and the others are
      nearly invisible until it is removed.
    - >-
      Why substitution rather than adjustment. A reference pulse injected at the
      electronics input is a known, jitter-free signal. Feeding it in replaces one
      stage with something whose contribution is negligible, so what remains is
      everything else. That makes the measurement subtractive: the drop when a stage
      is bypassed is that stage's own contribution.
    - >-
      What is riding on it. Months of measurement here are differences of
      nanoseconds, so a timing path that adds fourteen of them is not a detail.
      Until the array agrees with itself, no asymmetry it reports can be separated
      from its own jitter, which is why this is settled before the physics starts.
    assumes:
    - a fixed delay shifts a distribution while random jitter broadens it
    - a controlled substitution changes one part of a measurement chain at a time
    takeaway: A controlled substitution localizes an instrument error only when one change removes the effect and 
      reversing that change brings it back.
    format: CONTROL
    question: Which part of the live timing path is responsible for the broad arrival-time spread?
    control:
      hint: Run one substitution at a time and compare the channel-to-channel spread with the 14 ns live baseline. After
        you find a change that removes the spread, restore the original path and check that the spread returns.
      baseline: 14
      noise: 1
      tolerance: 2
      observable:
        label: Live timing path
        unit: ns
      response: -13
      truth: detector_pulse
      variables:
      - id: detector_pulse
        label: Bypass live detector pulse formation with identical pulses injected at the electronics inputs
      - id: cables
        label: Replace the channel cables with equal-length reference leads while keeping live detector pulses
      - id: discriminator
        label: Replace the discriminator stage with a reference unit while keeping live detector pulses
    answerText: The broad random spread enters in the live detector-pulse stage before the electronics-input injection 
      point. Only bypassing that stage collapses the spread from 14 ns to about 1 ns, and restoring the live path brings
      the 14 ns spread back.
    why: A useful control changes one suspected part of the measurement chain while leaving the rest in place. The live 
      timing path shows a 14 ns spread. Equalized cables or a replacement discriminator leave nearly the same broad 
      distribution, so neither explains it. Identical pulses injected at the electronics inputs collapse the spread to 
      about 1 ns. When the live detector path is restored, the broad spread returns. The changing element is therefore 
      the live pulse-formation stage upstream of the injection point.
    call: Calibrate timing channels
    reason: A shared measure is useless unless today's channels agree on time and show how much they may drift.
    setup: You are finding out why a timing array disagrees with itself.
  - group: E
    task: Estimate the timing difference created by unequal diagnostic-cable lengths.
    title: Why synchronization became an engineering requirement
    scene: Two fast diagnostic channels are supposed to observe the same inert event, but one signal path is longer. 
      Parsons, an ordnance engineer, wants the delay budget written in a form a technician can inspect with a tape measure.
    guide: >-
      A path difference becomes an arrival-time difference because signals travel at a finite speed. Choose the path mismatch,
      signal speed, and conversion to nanoseconds.
    background:
    - >-
      Why an estimate rather than a calculation. Every quantity on this board is
      already measured or stated, so nothing here has to be derived. What is being
      tested is whether you can pick the quantities the relationship actually needs,
      and whether the size of the answer looks right once they are in place.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the
      relationship it is going into. Reading the label is how a unit mismatch, or a
      quantity belonging to a different part of the problem, is caught before it is
      placed — which is the habit this format exists to build.
    assumes:
    - a signal travels along a cable at a finite speed
    takeaway: 'Synchronization is a physical measurement-chain problem: cable length, electronics, and reference clocks all
      contribute timing error.'
    format: BALLPARK
    answerText: Δt = 0.40/(2.0×10^8) ≈ 2×10^-9 s, or 2 ns.
    why: "A small path-length difference in a fast diagnostic system becomes a measurable timing offset. Divide the extra
      cable length by the signal speed. This turns a vague requirement such as 'record together' into something inspectable.
      The lesson is metrology: a timing claim is only as good as the physical paths and references that define it."
    call: Translate synchronization into measurement
    reason: The engineering team must turn the new timing limit into checks a technician can make before the next trial.
    setup: Two diagnostic channels differ only in signal-cable path length.
    estimate:
      prompt: Two diagnostic signal paths differ in length by 0.4 m, and signals travel at 2×10^8 m/s in the cable. 
        Estimate the timing difference in nanoseconds.
      question: Choose the path mismatch, the signal speed, and the seconds-to-nanoseconds conversion.
      labels:
      - 0.4 m path mismatch
      - 2×10⁸ m/s signal speed
      - 10⁹ ns/s
      - 2×10⁶ m/s signal speed
      values: [0.4, 200000000, 1000000000, 2000000]
      slots: 3
      template: delay ≈ ({0} ÷ {1}) × {2}
      formula: a/b*c
      correct: [0, 1, 2]
      target: 2
      tolerance: 0.25
      units: ns
      solution: 0.4 m ÷ 2×10⁸ m/s × 10⁹ ns/s ≈ 2 ns.
      explanation: "0.4 m of extra cable produces about 2 ns of additional delay. This is a diagnostic synchronization calculation,
        not a firing-system specification."
      givens:
      - Signal speed in cable = 2.0 × 10^8 m/s
      - Two diagnostic cable paths differ by 0.40 m
      - Delay difference = path difference / signal speed
      relationship: Delay = path mismatch ÷ signal speed. Multiply by 10⁹ to turn seconds into nanoseconds.
  - group: X
    task: Use the simulated feedback control to keep a numerical chain-reaction model near a steady level while its 
      model parameters drift.
    title: Hold a multiplication model at steady state
    reason: The shared timing limit needs a stable model today so changes in the output can be tied to one input at a time.
    takesAsRead:
    - "Radioactive decay modes: alpha, beta, gamma"
    concept: "Fission, neutron multiplication and chain reactions"
    place: Experimental Area
    scene: Bethe has put a simplified multiplication model on the board. The purpose is to understand feedback, not to 
      operate a real reactor. A slider changes the model's loss term while several abstract parameters drift.
    guide: >-
      Keep the simulated level inside the band by balancing modeled growth and loss. Treat every disturbance as a change in
      a rate. The exercise teaches feedback and dynamic equilibrium without using real reactor controls.
    background:
    - In a multiplication model, a level grows when each generation produces more than replaces itself and falls when 
      losses dominate. A steady trace therefore represents a balance of rates, not a system that has stopped changing.
    - The disturbances here are deliberately abstract model coefficients. They stand for any slow parameter drift in a 
      feedback system and are not instructions for controlling nuclear hardware.
    - The useful habit is to anticipate a persistent rate change rather than chase the displayed level after it has 
      already moved.
    assumes:
    - a multiplication model can grow, hold steady, or decay depending on the balance of gain and loss
    takeaway: A dynamic steady state is a balance of rates, and feedback should be reasoned about through the model 
      rather than by copying real hardware procedures.
    format: HOLD
    question: Hold the simulated multiplication level near its target while the model coefficients drift.
    answerText: Keep the model inside the band for most of the run by adjusting the abstract loss term to balance the 
      modeled growth rate.
    why: >-
      The exercise is a numerical feedback model. If modeled gain exceeds modeled loss, the displayed level grows; if loss
      exceeds gain, it decays. A steady level therefore requires the two rates to balance. The control is intentionally abstract
      so the lesson is about dynamic equilibrium and feedback, not about operating a reactor.
    hold:
      quantity: Simulated multiplication level
      unit: relative
      control: Model loss setting
      hold: 1
      band: 0.4
      narrowTo: 0.2
      duration: 45
      direction: raise
      authority: 0.1
      pass: 0.8
      hint: Treat each disturbance as a persistent change in the model's rate balance.
      disturbances:
      - label: Model gain coefficient drifts slightly upward
        at: 4
        amount: -0.03
      - label: A modeled loss term is removed
        at: 20
        amount: 0.05
      - label: A second modeled absorber term grows
        at: 38
        amount: -0.045
      commit: Report the simulation
- title: Prove It Without the Real Device
  objective: Use material tests, conservative acceptance rules, inert mockups, and fast diagnostics to learn from 
    stand-ins without pretending they reproduce everything.
  briefing: A full nuclear system cannot be used as an iterative laboratory test. The player therefore has to decide 
    what individual material tests and inert mockups are entitled to prove, and where conservative acceptance criteria 
    are needed because the real system cannot be repeatedly tested.
  stake: It is December 1944, and the lab cannot test the final system again and again. Each stand-in can answer one question
    but may hide what it cannot copy. Today you must set material limits, judge a mockup, and measure motion during the test.

- group: T
  task: Estimate the surface-to-volume ratio, then say what doubling the radius does to it.
  title: Geometry and neutron leakage
  setup: A sphere has a radius of 5 cm.
  scene: >-
    Oppenheimer wants a shape argument he can put to Ordnance without waiting for a full
    transport calculation. There is a sphere of five centimetres radius on the board, and
    the same material can be cast compact or drawn out.
  guide: >-
    Four numbers, and two of them are radii. Only one is this sphere's. Ask of
    each whether the relationship needs it. Leakage follows the surface and
    production follows the volume, so the ratio between them is what matters. And
    note which way it goes as the body grows.
  background:
  - >-
    Why an estimate rather than a calculation. Every quantity on this board is
    already measured or stated, so nothing here has to be derived. What is being
    tested is whether you can pick the quantities the relationship actually needs,
    and whether the size of the answer looks right once they are in place.
  - >-
    Why the tiles carry labels. A bare number cannot be checked against the
    relationship it is going into. Reading the label is how a unit mismatch, or a
    quantity belonging to a different part of the problem, is caught before it is
    placed — which is the habit this format exists to build.
  takeaway: Geometry influences neutron economy through boundary leakage, not merely through total mass.
  format: BALLPARK
  why: Surface-to-volume falls as 1/L, so a larger body has less boundary per unit volume and leaks relatively less.
  estimate:
    prompt: Leakage is set by how much boundary a body has per unit of volume. For a sphere that ratio is 3/R. Estimate 
      it for a sphere of radius 5 cm.
    question: Choose the sphere factor and the radius.
    labels:
    - 3 (sphere factor)
    - 5 cm radius
    - 10 cm radius
    - 2 (doubling factor)
    values: [3, 5, 10, 2]
    slots: 2
    template: S/V ≈ {0} ÷ {1}
    formula: a/b
    correct: [0, 1]
    target: 0.6
    tolerance: 0.05
    units: cm⁻¹
    solution: 3 ÷ 5 cm ≈ 0.6 cm⁻¹.
    explanation: A 10 cm sphere gives 3 ÷ 10 = 0.3 cm⁻¹, half as much surface per unit of volume. Surface grows as L² 
      while volume grows as L³, so doubling the size halves the boundary available for leakage — which is why a larger 
      assembly reaches criticality on less material.
    givens:
    - For a sphere, surface-to-volume ratio = 3/R
    - Surface scales as L^2 and volume as L^3
    relationship: For a sphere, surface-to-volume ratio = 3 ÷ radius. Leakage follows surface; production follows 
      volume.
  answerText: About 0.6 cm^-1; doubling the radius halves it to about 0.3 cm^-1.

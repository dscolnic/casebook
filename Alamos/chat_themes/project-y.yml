- group: X
  task: Estimate the probability of at least one event using P ≈ lambda when lambda is small.
  title: Random-event probability in a short observation window
  setup: Invented classroom rates illustrate Poisson timing and do not represent any weapon material or device.
  scene: >-
    Fermi puts a generic detector problem on the board: random events arrive at a steady rate and the instrument is vulnerable
    to a false trigger during a short gate. How likely is at least one event in that window?
  guide: >-
    Four numbers, and two of them are windows a thousand apart. Ask of each which
    assembly this is. And note what the answer says. For a fixed random rate, the
    only lever is the length of the window. So the timing decides the risk rather
    than the material.
  background:
  - >-
    Why an estimate rather than a calculation. Every quantity on this board is
    already measured or stated, so nothing here has to be derived. What is being
    tested is whether you can pick the quantities the relationship actually needs,
    and whether the size of the answer looks right once they are in place.
  - >-
    Why the tiles carry labels. A bare number cannot be checked against the
    relationship it is going into. Reading the label is how a unit mismatch, or a
    quantity belonging to a different part of the problem, is caught before it is
    placed — which is the habit this format exists to build.
  takeaway: Poisson event rates turn a time window into a probability; the same mathematics appears in detectors, 
    communications, and reliability.
  format: BALLPARK
  why: For a fixed random-event rate, shortening the vulnerable observation window lowers the probability of an 
    accidental event.
  estimate:
    prompt: Random detector events arrive at 200 per second and an electronic gate is open for 10 microseconds (10^-5 
      s). When the expected count is small, estimate the probability of at least one accidental event as a percentage.
    question: Choose the event rate, the time window, and the percent conversion.
    labels:
    - 200 events/s
    - 10^-5 s gate
    - 100%/unit
    - 10^-2 s gate
    values:
    - 200
    - 1e-05
    - 100
    - 0.01
    slots: 3
    template: probability ≈ {0} × {1} × {2}
    formula: a*b*c
    correct: [0, 1, 2]
    target: 0.2
    tolerance: 0.03
    units: "%"
    solution: 200 s^-1 × 10^-5 s × 100 ≈ 0.2%.
    explanation: For a small expected count λ, the probability of at least one event is approximately λ. A short window 
      can make even a substantial rate produce a small probability.
    givens:
    - Random event rate = 200/s
    - Gate width = 10 microseconds = 1×10^-5 s
    relationship: Probability ≈ the event rate × the length of the vulnerable window. Multiply by 100 for a percentage.
  answerText: lambda = 200 × 10^-5 = 0.002, so P ≈ 0.2%.

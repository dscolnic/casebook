    stress, and only the second kind survives a short test. Short coupon tests
    across many candidate pairs are cheap and clear the obvious failures within
    weeks. Longer exposures under temperature and stress reach the slow
    mechanisms, and each one occupies a rig for months. Waiting for a failure in
    service costs a component and produces no mechanism. Storage and transport are
    the conditions these parts have to survive.

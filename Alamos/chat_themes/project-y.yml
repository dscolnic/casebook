  scene: >-
    Many diagnostic channels must record the same fast event on one time base, and they currently share a reference clock,
    a power supply, and a procedure. Three reliability proposals compete for the next test budget.
  guide: >-
    Adding channels on one shared reference multiplies the count but not the independence. Independent timing references test
    whether channels can fail separately. Testing shared power and procedure is how a common-mode fault is exposed. Physical
    separation alone is not independence.
  rules: >-
    Spread the hundred points across the 3 proposals. At least 80 of them have to
    be committed, because a panel that funds almost nothing has not decided
    anything. Your largest single allocation must be 35 or more, and it has to

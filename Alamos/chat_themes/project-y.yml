- group: X
  task: Estimate final density divided by initial density.
  title: Spherical compression and density
  setup: This is a generic sphere calculation, not a Fat Man dimension or compression claim.
  scene: >-
    John von Neumann, the mathematician working the implosion problem, keeps the study
    group at the blackboard on a textbook sphere. Its mass is fixed and its radius comes
    in a little. How much the density moves is what the lens work has to buy.
  guide: >-
    Four numbers, and two of them are radius ratios. Only one describes this
    compression. Ask of each what the relationship needs. Volume goes as the cube
    of radius, so a modest squeeze in radius is a much larger change in density.
    Check the direction of your answer before believing it.
  background:
  - >-
    Why an estimate rather than a calculation. Every quantity on this board is
    already measured or stated, so nothing here has to be derived. What is being
    tested is whether you can pick the quantities the relationship actually needs,
    and whether the size of the answer looks right once they are in place.
  - >-
    Why the tiles carry labels. A bare number cannot be checked against the
    relationship it is going into. Reading the label is how a unit mismatch, or a
    quantity belonging to a different part of the problem, is caught before it is
    placed — which is the habit this format exists to build.
  takeaway: Three-dimensional convergence amplifies small radial changes.
  format: BALLPARK
  why: A ten-percent radius decrease corresponds to roughly a thirty-seven-percent density increase for a constant-mass 
    sphere.
  estimate:
    prompt: A sphere is compressed until its radius is 0.90 of the original, with mass unchanged, and density scales as 
      1/R³. Estimate the ratio of final to initial density.
    question: Choose the mass ratio, the radius ratio, and the spatial exponent.
    labels:
    - 1 mass ratio
    - 0.90 radius ratio
    - 3 spatial dimensions
    - 0.50 radius ratio
    values: [1, 0.9, 3, 0.5]
    slots: 3
    template: density ratio ≈ {0} ÷ ({1})^{2}
    formula: a/Math.pow(b,c)
    correct: [0, 1, 2]
    target: 1.372
    tolerance: 0.06
    units: ratio
    solution: 1 ÷ 0.90³ ≈ 1.37.
    explanation: Sphere volume scales with the cube of radius, so a modest radial reduction produces a larger fractional
      density increase.
    givens:
    - Mass remains constant
    - Final radius = 0.90 times initial radius
    - Density scales as 1/radius^3
    relationship: Density = mass ÷ volume, and volume goes as radius³. At fixed mass, the density ratio = 1 ÷ (radius 
      ratio)³.
  answerText: rho_f/rho_i = 1/(0.90)^3 approximately 1.37.

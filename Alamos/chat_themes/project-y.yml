    Bradbury wants the workflow signed before any controlled hardware moves.
  guide: >-
    All four steps happen, so ask what each one has to be true before it. A
    component of unknown identity cannot be assembled into a controlled
    configuration. And an electrical test proves the configuration that exists
    rather than the one on the drawing. The records are sealed last because they
    record all of it.
  background:
  - >-
    Why the order is graded whole. A sequence is a claim about dependency: each
    step is here because the one before it has already happened, or has to have.
    One transposed pair falsifies that claim wherever it sits, so partial credit

    therefore involves at least two joins. That is worth remembering when the last
    pair looks forced: the fault is usually not in the join you are struggling
    with, but in one you made early and stopped questioning.
  takeaway: Robust design often wins by reducing the number of ways reality can differ from the model.
  format: PROTOCOL
  why: Simplification can reduce the number of interfaces, assumptions, and configuration variants that separate a model
    from the thing actually tested.
  columns:
  - What the program needs
  - What the simplification gives it
  scenarios:
  - A complicated internal configuration amplifies manufacturing and assembly uncertainty.
  - Theoretical calculations are dominated by poorly constrained internal boundaries.
  - Development tests are hard to compare because each uses a different internal configuration.
  - Many teams need a single version they can all build and test.
  choices:
  - Reduce internal geometric complexity so fewer manufactured interfaces can vary.
  - Choose a simpler model geometry with fewer poorly constrained boundaries.
  - Run development tests against the same simplified reference configuration.
  - Freeze and record one common baseline for the last trial.
  mapping:
  - 0
  - 1
  - 2
  - 3
  answerText: Fewer interfaces; simpler model; like-for-like test geometry; one documented integration baseline.

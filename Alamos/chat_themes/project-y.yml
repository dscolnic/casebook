- title: Write the Questions Before Trinity
  objective: Treat Trinity as a one-shot scientific experiment by defining its questions, diagnostics, environmental 
    monitoring, and model comparisons before the event.
  briefing: A single full-scale test is about to carry years of expectations. The player must prevent the event from 
    becoming its own proof by writing the questions first, establishing independent diagnostics and environmental 
    measurements, and separating what an integrated outcome can show from what only post-event monitoring can reveal.
  stake: It is July 1945, and the Trinity test can happen only once. A missing tool or vague question cannot be fixed after
    the event. Today you must decide what proof each claim needs and what must be watched beyond the test field. People and
    land outside the site may bear effects they did not choose.
  takeaway: A one-shot experiment must define its questions and evidence in advance, including measurements of 
    consequences outside the apparatus itself.
  stops:
  - group: X
    task: Match each pre-test question to the evidence that can actually answer it.
    title: Write Trinity as an experiment
    concept: "Experimental method: controls, calibration, systematic vs random error"
    scene: >-
      Bethe wants Trinity written down as questions before it becomes an event. One integrated test carries dozens of expectations,
      and a dramatic outcome cannot be allowed to count as proof of everything.
    guide: >-
      Four questions and four kinds of evidence. Pair them by asking what each
      question needs: the whole event, one subsystem's traces, a comparison with
      something written beforehand, or measurements taken afterwards. A test without
      its questions written down first becomes an argument later about what it
      proved.
    background:
    - >-
      Why this is a matching board and not four separate questions. Responses on
      boards like this are written to be plausible for more than one situation, so
      choosing them one at a time lets a nearly-right answer through unexamined.
      Having to place all of them forces the comparison — not "is this reasonable
      here", but "is it more right here than there".
    - >-
      How to use the one-each rule. Because the responses are a set to be
      distributed rather than a list to be sampled, every join you make constrains
      the rest. Settling the two you are confident of can leave the remaining pair
      decided by elimination. Where it does not, two responses are still competing
      for one situation, and that is exactly the distinction the stop is testing.
    - >-
      Why you cannot be wrong about exactly one. With every response used once,
      three correct joins leave the fourth with only one place to go. Any error
      therefore involves at least two joins. That is worth remembering when the last
      pair looks forced: the fault is usually not in the join you are struggling
      with, but in one you made early and stopped questioning.
    assumes:
    - a test proves what it was designed to ask
    takeaway: A one-shot full-system test should be written as a set of questions before the event, including questions 
      about environmental and human consequences.
    format: PROTOCOL
    answerText: Integrated performance -> full-system effects record; diagnostic health -> independent channel checks; 
      model validation -> comparison with the pre-test prediction envelope; consequences beyond the site -> post-event 
      environmental and exposure monitoring.
    why: Different claims require different evidence. The integrated event can answer whether the full system functioned
      at all. Independent diagnostic records show whether the measurement system itself remained interpretable. A model 
      is tested only against a prediction written before the observation. Consequences beyond the instrument field 
      require measurements after the event and outside the apparatus. Writing those questions first prevents one 
      spectacular outcome from swallowing every other claim.
    call: Write Trinity as an experiment
    reason: The questions and proof must be fixed today so one striking result cannot be used to support every claim.
    setup: Match each pre-test question to the evidence that settles it.
    rebuttals:
    - Only the integrated event can answer whether the full system functioned in the broad sense being tested.
    - Diagnostic health is a measurement-system question and needs records independent of the overall outcome.
    - Model validation requires a prediction made before the observation.
    - Consequences to people and surroundings require observations outside and after the instrumented event.
    columns:
    - Question written before the shot
    - Evidence that can answer it
    scenarios:
    - Did the integrated test produce the broad class of effects the laboratory expected?
    - Did the independent diagnostic channels remain interpretable through the event?
    - Did the event fall within the range the model committed to in advance?
    - What radiological and physical consequences occurred at and beyond the site?
    choices:
    - The full-system effects record from the event itself.
    - Independent channel-health, calibration and timing records from the diagnostic network.
    - Place the recorded effects beside the dated upper and lower model bounds.
    - Post-event environmental and exposure measurements that show what changed where.
    mapping:
    - 0
    - 1
    - 2
    - 3
  - group: E
    task: Arrange the field-experiment steps so that diagnostics, safety, and environmental monitoring are verified 
      before the irreversible event.
    title: Integrate a one-shot field experiment
    scene: >-
      The desert site has power, communications, cameras, weather instruments and radiation-monitoring stations spread across
      a schedule threatened by weather. Bradbury, the Trinity assembly leader, wants every interface proved while it can still be fixed.
    guide: >-
      Keep the sequence about experimental readiness. Establish site services and monitoring first, verify diagnostics and
      calibrations second, lock the approved test configuration only after those checks pass, and run only against explicit
      hold points with post-event monitoring already assigned.
    background:
    - >-
      Why the order is graded whole. A sequence is a claim about dependency: each
      step is here because the one before it has already happened, or has to have.
      One transposed pair falsifies that claim wherever it sits, so partial credit
      would be credit for a sequence that does not work.
    - >-
      Why the ends are the place to start. The first and last cards are constrained
      by having nothing before or after them, which usually makes them the two you
      can settle from the scene alone. Pinning them collapses the remaining
      arrangements sharply, and what is left in the middle is where the actual
      judgement lives.
    - >-
      What the rail can be ordered on. Time is the usual axis, but it is not the
      only one. An order can run on cost, on risk, or on reversibility — every
      observation that leaves the sample as it was, before any that consumes it. On
      those boards a chronological reading finds nothing, because none of the steps
      has to happen at a particular hour.
    assumes:
    - a schedule set by weather cannot be extended
    takeaway: Field integration should preserve the ability to detect and correct a failed interface before an 
      irreversible test.
    format: SEQUENCE
    answerText: Establish site services and environmental monitoring → verify diagnostics and calibrations end to end → 
      lock the approved experimental configuration → run against hold points and continue post-event monitoring and 
      documentation.
    why: A one-shot field experiment is only useful if the measurement and safety systems are ready before the event. 
      Site services, controlled access, weather and environmental monitoring come first. Diagnostic channels and 
      calibrations are then checked end to end. The approved experimental configuration is locked only after those 
      checks pass. Finally, the run proceeds against hold points, followed by the monitoring and documentation already 
      assigned before the event.
    call: Coordinate the field experiment
    reason: Every tool, safety check, and outside monitor must work together before the one event that cannot be repeated.
    setup: Order the readiness sequence for a one-shot field test.
    rebuttals:
    - Site services and monitoring come first because every later observation depends on them.
    - Diagnostics and calibrations are verified while failures can still be repaired.
    - The configuration is locked only after the evidence system is ready; otherwise the test article changes underneath
      the measurement plan.
    - The irreversible run is last, and post-event monitoring is part of the experiment rather than an afterthought.
    cards:
    - Working power, communications, access control, weather stations, and outside monitors cover the site.
    - Diagnostic channels, calibration records, data paths, and independent backups pass end-to-end checks.
    - The approved experimental configuration is locked with its measurement and safety records.
    - Event operations use defined hold points, with assigned monitors and records spanning the run.
    order:
    - 0
    - 1
    - 2
    - 3
  - group: P
    task: Which transformation makes exponential decay linear, and what physical quantity comes from the slope?
    title: The plot that makes a decay a straight line
    concept: "Graphical analysis: semi-log plots and slopes"
    place: Diagnostics Bay
    scene: >-
      Two counters have produced a table of count rate against time. The notebook has it
      plotted on ordinary axes, as a curve nobody can read a number off. Bethe wants the
      half-life out of it before the tower crew drives out.
    guide: >-
      Four ways to plot the same data. Ask of each what shape it turns an
      exponential into. Then ask what the slope of that shape means. One option
      takes the logarithm of both axes, which suits a power law rather than a decay.
      And a straight line is easy to check by eye, which is the point.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to
      be the answer under one specific misreading — a step skipped, a quantity
      confused with a rate, a correlation taken for a cause. Identifying which
      misreading each belongs to is where the learning is; the right answer alone
      can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the
      qualifying clause and the unit. So across a whole game the key used to be the
      longest option far more often than chance — 88 per cent of passage quizzes
      here, before it was fixed. It is now checked per game as a binomial tail, so
      length, hedging and specificity have had the signal taken out of them
      deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the
      verdict prints them — the reason that option fails, not a restatement of the
      right one. They are worth reading after a correct answer as well: a right
      choice made for an approximate reason is indistinguishable from a sound one
      until the day the approximation is what is being tested.
    assumes:
    - a logarithm turns a constant ratio into a constant difference
    takeaway: Plotting a logarithm turns an exponential into a straight line, and its slope is the decay constant.
    format: CHOICE
    answerText: Plot ln(count rate) versus time. The slope is −λ, and the half-life follows from t½ = ln2/λ.
    why: "An exponential plotted on linear axes is a curve, which is hard to check by eye. Take the logarithm of the count
      rate and the same data becomes a straight line. Its slope is minus the decay constant, so the half-life follows from
      t½ = ln2/λ. The transformed plot also exposes failures: a second component can change the slope, while background can
      flatten the line at late times. Choosing the axes is part of the measurement."
    call: Linearize an exponential
    reason: The team needs a readable form of the detector curve now to compare the event with the forecast made before it.
    rebuttals:
    - A straight-line fit on linear axes is only a local approximation to an exponential and its slope changes with 
      time.
    - A log-log plot linearizes power laws. Exponential decay becomes linear when only the count-rate axis is logged.
    - Taking the reciprocal does not turn an exponential into a line; it produces another exponential.
    choices:
    - Plot ln(count rate) against time; the slope is −λ, so t½ = ln2/λ.
    - Plot count rate against time and fit a straight line to the late-time points; the slope is −λ.
    - Plot ln(count rate) against ln(time); the slope is −λ for any radioactive decay.
    - Plot 1/(count rate) against time; the slope gives the half-life directly.
    answer: Plot ln(count rate) against time; the slope is −λ, so t½ = ln2/λ.
  - group: T
    task: Why does splitting uranium release energy while splitting carbon would absorb it?
    title: Where the energy in fission comes from
    concept: Binding energy per nucleon and the stability curve
    place: Theoretical Division
    scene: >-
      A visitor at Bethe's blackboard asks why splitting a heavy nucleus releases energy
      while splitting a light one costs energy. The binding-energy curve is already
      drawn there, and nobody has used it to answer.
    guide: >-
      Four accounts of where the energy comes from. Ask of each whether it uses the
      shape of the binding-energy curve. It rises steeply, peaks near iron, and
      falls slowly to uranium. So what matters is whether the products sit higher on
      it than the reactants, and two of these options ignore that.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to
      be the answer under one specific misreading — a step skipped, a quantity
      confused with a rate, a correlation taken for a cause. Identifying which
      misreading each belongs to is where the learning is; the right answer alone
      can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the
      qualifying clause and the unit. So across a whole game the key used to be the
      longest option far more often than chance — 88 per cent of passage quizzes
      here, before it was fixed. It is now checked per game as a binomial tail, so
      length, hedging and specificity have had the signal taken out of them
      deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the
      verdict prints them — the reason that option fails, not a restatement of the
      right one. They are worth reading after a correct answer as well: a right
      choice made for an approximate reason is indistinguishable from a sound one
      until the day the approximation is what is being tested.
    assumes:
    - a nucleus is held together by binding energy
    takeaway: The binding-energy-per-nucleon curve says which way a nuclear reaction releases energy.
    format: CHOICE
    answerText: Fission releases energy when the products are more tightly bound per nucleon than the original heavy 
      nucleus. The mass difference between those states appears as released energy.
    why: Binding energy per nucleon rises steeply from hydrogen, peaks around iron and nickel, and falls slowly to 
      uranium. A reaction releases energy when its products sit HIGHER on that curve than its reactants, because the 
      products are more tightly bound. Uranium splitting into two mid-mass fragments moves up the curve, so energy comes
      out. Carbon splitting would move down it, so energy would have to go in. The same curve is why fusion of light 
      nuclei also releases energy — from the other side of the peak.
    call: Read the binding-energy curve
    reason: The energy scale must be tied to known nuclear trends before the lab writes its final prediction range.
    rebuttals:
    - Coulomb repulsion contributes to why heavy nuclei are less tightly bound, but the reaction energy is the total 
      binding-energy difference between initial and final nuclei.
    - The number of fragments does not determine the sign of the reaction energy. The binding energies of reactants and 
      products do.
    - Radioactivity concerns whether a process occurs spontaneously and how fast. The energy balance is set by the 
      masses and binding energies of the states.
    choices:
    - The fragments lie higher on the binding-energy-per-nucleon curve, so the products are more tightly bound and the 
      mass difference appears as released energy.
    - The fragments separate electrically after the split, so nearly all released energy is simply Coulomb repulsion and
      the binding-energy change is secondary bookkeeping.
    - Any heavy nucleus releases energy when divided because the same mass is distributed among more particles and 
      therefore more kinetic degrees of freedom.
    - Uranium releases energy because it is radioactive; a stable nucleus such as carbon would have no available nuclear
      energy to release.
    answer: The fragments lie higher on the binding-energy-per-nucleon curve, so the products are more tightly bound and
      the mass difference appears as released energy.
- title: What Did Trinity Actually Prove?
  objective: Compare observations with broad prediction bands, audit disagreements with independent evidence, and freeze
    only the claims that the test actually supports.
  briefing: Trinity succeeded as an integrated test, but success is not the same as validating every model or 
    eliminating every uncertainty. The player interprets a prediction-band comparison, distinguishes isotope physics 
    from chemistry, spends follow-up work on independent checks, and controls configuration changes without turning 
    post-test evidence into a recipe.
  stake: It is late July 1945, and Trinity worked, but the records do not all agree. Some tools match, one estimate stands
    apart, and fallout was found beyond the site. Today you must decide which claims grew stronger and which still need a new
    check. Success cannot erase doubt or harm outside the test field.
  takeaway: A successful integrated test validates claims selectively; it does not erase discrepancies, environmental 
    consequences, or model uncertainty.
  stops:
  - group: X
    call: Compare prediction with observation
    reason: The lab must compare the result with the range written before the test, not move the range after seeing it.
    task: Estimate the offset in units of the measurement uncertainty, then state the strongest justified conclusion.
    title: Compare a prediction band with an observation
    setup: A classroom model predicts an observable between 15 and 25 units; the measurement reads 21 units with an 
      uncertainty of +/-2.
    scene: >-
      Bethe has the theory division's prediction band chalked up beside a single
      diagnostic reading of 21 units, plus or minus 2. The temptation after Trinity is
      to treat one comparison as a verdict on the whole model.
    guide: >-
      Four numbers, and two of them describe the band rather than the measurement:
      its midpoint and its lower edge. Ask of each what the comparison needs. A gap
      is measured in units of the measurement's own uncertainty. And note that a
      wide band would have accommodated almost anything.
    background:
    - >-
      Why an estimate rather than a calculation. Every quantity on this board is
      already measured or stated, so nothing here has to be derived. What is being
      tested is whether you can pick the quantities the relationship actually needs,
      and whether the size of the answer looks right once they are in place.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the
      relationship it is going into. Reading the label is how a unit mismatch, or a
      quantity belonging to a different part of the problem, is caught before it is
      placed — which is the habit this format exists to build.
    assumes:
    - a wide prediction is easy to agree with
    takeaway: Evidence should update a model claim by claim, not by declaring total victory.
    format: BALLPARK
    why: The gap between an observation and a prediction is measured in units of the measurement's own uncertainty. Take
      the difference and divide by that uncertainty. Half a sigma from the middle of the band is consistent. But 
      consistency with a band this wide is weak evidence, because 15 to 25 would have accommodated almost anything. 
      Agreement supports the part of the model that produced the band, and no more. One agreeing diagnostic can sit 
      beside others that disagree, and those still need explaining.
    estimate:
      prompt: A model predicts an observable between 15 and 25 units, so its midpoint is 20. The measurement reads 21 
        units with an uncertainty of ±2. Estimate the offset in units of the measurement uncertainty.
      question: Choose the observed value, the band midpoint, and the measurement uncertainty.
      labels:
      - 21 observed
      - 20 band midpoint
      - 2 measurement uncertainty
      - 15 band lower edge
      values: [21, 20, 2, 15]
      slots: 3
      template: offset ≈ |{0} − {1}| ÷ {2}
      formula: Math.abs(a-b)/c
      correct: [0, 1, 2]
      target: 0.5
      tolerance: 0.1
      units: σ
      solution: "|21 − 20| ÷ 2 ≈ 0.5σ."
      explanation: "Half a sigma is no disagreement at all — at this precision the observation and the midpoint are indistinguishable.
        Be careful what that licenses: it says the measurement is consistent with the model, not that the model is confirmed.
        A band 10 units wide is easy to agree with, so consistency here is weak evidence, and diagnostics that disagree with
        each other still need explaining."
      givens:
      - "Prediction band: 15 to 25, midpoint 20"
      - "Measurement: 21 +/- 2"
      relationship: Distance in sigma = |observed − predicted| ÷ the measurement uncertainty.
    answerText: "|21 - 20|/2 = 0.5 sigma. The observation is consistent with the prediction band, but a band that wide makes
      consistency weak evidence; it does not confirm every model assumption, and diagnostics that disagree with each other
      still need explaining."
  - group: CM
    task: Why is ordinary chemistry a poor way to separate uranium-235 from uranium-238 in bulk?
    title: Why separation is a physical problem
    place: Chemistry and Metallurgy Building
    scene: >-
      At Chemistry and Metallurgy a production planner has brought Seaborg a request to
      enrich uranium-235 relative to uranium-238 by an ordinary chemical route. He has
      to decide whether the two isotopes give chemistry enough contrast to make that
      plan practical.
    guide: >-
      Four explanations, and all four mention a difference. Ask of each whether that
      difference is chemical or physical. The electron structures are almost
      identical, which is what ordinary chemistry answers to. What is left is about
      one part in 235 of mass, and that is what a physical process can grip.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to
      be the answer under one specific misreading — a step skipped, a quantity
      confused with a rate, a correlation taken for a cause. Identifying which
      misreading each belongs to is where the learning is; the right answer alone
      can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the
      qualifying clause and the unit. So across a whole game the key used to be the
      longest option far more often than chance — 88 per cent of passage quizzes
      here, before it was fixed. It is now checked per game as a binomial tail, so
      length, hedging and specificity have had the signal taken out of them
      deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the
      verdict prints them — the reason that option fails, not a restatement of the
      right one. They are worth reading after a correct answer as well: a right
      choice made for an approximate reason is indistinguishable from a sound one
      until the day the approximation is what is being tested.
    assumes:
    - chemical behaviour is set by electrons, and isotopes differ only in the nucleus
    takeaway: Isotopes of one element have nearly the same electron structure, so practical enrichment must exploit a 
      tiny isotope-dependent physical difference.
    format: CHOICE
    answerText: Ordinary chemistry offers almost no selectivity because the isotopes have nearly identical electron 
      structures. Enrichment has to exploit a small isotope-dependent physical difference, especially mass.
    why: Chemical behaviour is controlled mainly by electrons, and the two uranium isotopes have the same electron count
      and almost the same electronic structure. Their ordinary chemical reactions are therefore nearly identical. The 
      useful contrast is the small mass difference, about 1 part in 235, which can be exploited by processes that 
      respond to mass or mass-to-charge ratio. The tiny size of that contrast is why isotope enrichment requires 
      repeated separation stages rather than one ordinary chemical reaction.
    call: Identify the usable isotope contrast
    reason: Today's material record must separate isotope evidence from chemistry before either is used to explain the event.
    rebuttals:
    - The limitation is not mainly reaction speed or handling. The electronic structures that drive ordinary chemistry 
      are almost the same.
    - A tiny isotope mass difference does not make bulk solutions separate by ordinary settling or filtration.
    - A detector can identify radiation from a population, but that does not provide a practical chemical force that 
      sorts neutral atoms into separate bulk streams.
    choices:
    - Their electron structures are nearly identical, so ordinary chemical reactions provide almost no selectivity; 
      enrichment instead exploits a small isotope-dependent physical difference.
    - Their chemical reaction rates differ enough for separation, but the difference is too slow to be useful only 
      because uranium compounds are difficult to handle.
    - Their densities differ by about 1 part in 235, so settling or filtration is the natural route but requires 
      extremely long columns.
    - Their radioactivities differ, so radiation detectors can sort individual atoms even though the chemistry itself 
      cannot.
    answer: Their electron structures are nearly identical, so ordinary chemical reactions provide almost no 
      selectivity; enrichment instead exploits a small isotope-dependent physical difference.
  - group: T
    task: Choose two follow-up checks. Buy evidence that can distinguish a shared calibration problem from a real 
      physics discrepancy.
    title: Spend the follow-up checks on independence
    scene: >-
      Fermi, a senior physicist known for quick estimates, has a blast estimate that disagrees with the theory prediction by three standard
      deviations. The division can complete two follow-up checks before the next review,
      and every extra run that repeats the same dependency consumes one of those
      chances.
    guide: >-
      Two follow-up checks, and a three-sigma disagreement between theory and
      experiment. Open each check and ask what it depends on. A run that repeats a
      dependency the disagreement already contains cannot resolve it, however much
      data it returns. Buy the two that could change the interpretation rather than
      the precision.
    background:
    - >-
      What three standard deviations is and is not. It is unlikely to be chance and
      it is not proof of new physics. Most disagreements that size turn out to be a
      shared assumption — a cross-section, a calibration, a background model — used
      on both sides or wrong on one.
    - >-
      Why repeating the measurement rarely helps. More runs on the same apparatus
      reduce the statistical part of the error and leave every systematic exactly
      where it was. If the disagreement is systematic, better statistics make it
      sharper and no more explicable.
    - >-
      What independence looks like here. A check that uses a different detector, a
      different reaction, or a different calibration path constrains the same
      quantity through different assumptions. Only that can tell a real discrepancy
      from a shared mistake.
    assumes:
    - a systematic error does not average away with more repeats
    - independent measurements should not share the same critical calibration
    takeaway: When theory and experiment disagree, the next measurements should attack shared systematics and add 
      evidence based on different dependencies.
    format: VALUE
    question: Which two checks can change the interpretation of the disagreement?
    value:
      hint: You can fund two checks. Read what each one would reveal. One should test a shared dependency; the other 
        should stand on a different measurement chain.
      budget:
        amount: 2
        unit: follow-up checks
      decision: Decide whether the three-sigma gap is best treated as a shared systematic or as a discrepancy that 
        survives independent measurement.
      options:
      - id: audit
        label: Audit the calibration shared by the original comparison
        cost: 1
        axis: shared systematic
        decisive: true
        reveals: Whether a common calibration bias can account for the apparent disagreement.
      - id: independent
        label: Repeat the observable with a different detector or calibration path
        cost: 1
        axis: independent measurement
        decisive: true
        reveals: Whether the discrepancy survives when the critical dependency chain changes.
      - id: more
        label: Collect more data with the same setup
        cost: 1
        axis: statistical precision
        decisive: false
        reveals: A smaller random error bar around a result that still carries the same systematic dependencies.
      - id: retune
        label: Retune uncertain model parameters until the curves agree
        cost: 1
        axis: model flexibility
        decisive: false
        reveals: That the model can be adjusted to match the datum, without identifying why the original prediction 
          missed it.
    answerText: Use the two checks on the shared-calibration audit and an independent measurement with a different 
      dependency chain. Together they can distinguish common bias from a discrepancy that survives independent evidence.
    why: More of the same data reduces random error but carries the same systematic dependencies. Retuning the model can
      hide the discrepancy without explaining it. First audit the calibration shared by the measurements, because a 
      common bias can create a confident disagreement. Then use a measurement based on different hardware or a different
      calibration path. If the discrepancy survives independent evidence, the case for missing physics strengthens. If 
      it disappears, the original measurement chain becomes the leading suspect.
    call: Reconcile theory and experiment
    reason: Only a few follow-up checks are possible, so they must test causes that can fail apart from the first estimate.
    setup: Theory and experiment disagree by three standard deviations.
  - group: E
    task: Order the post-test evidence process from raw records to a controlled final technical configuration.
    title: Freeze claims, not confidence
    scene: >-
      Trinity has produced new evidence and teams are already proposing last-minute changes. Bradbury wants the laboratory
      to separate what the data support from what people merely want to improve.
    guide: >-
      Reconcile the records, compare them with pre-test predictions, name unresolved discrepancies, and only then approve
      evidence-supported changes and freeze the documented configuration.
    background:
    - >-
      Why the order is graded whole. A sequence is a claim about dependency: each
      step is here because the one before it has already happened, or has to have.
      One transposed pair falsifies that claim wherever it sits, so partial credit
      would be credit for a sequence that does not work.
    - >-
      Why the ends are the place to start. The first and last cards are constrained
      by having nothing before or after them, which usually makes them the two you
      can settle from the scene alone. Pinning them collapses the remaining
      arrangements sharply, and what is left in the middle is where the actual
      judgement lives.
    - >-
      What the rail can be ordered on. Time is the usual axis, but it is not the
      only one. An order can run on cost, on risk, or on reversibility — every
      observation that leaves the sample as it was, before any that consumes it. On
      those boards a chronological reading finds nothing, because none of the steps
      has to happen at a particular hour.
    assumes:
    - what was tested and what gets built can drift apart
    takeaway: Post-test configuration control should freeze only changes supported by reconciled evidence, while 
      preserving unresolved discrepancies.
    format: SEQUENCE
    answerText: Reconcile independent records → compare with pre-test predictions and name discrepancies → approve only 
      evidence-supported changes and freeze the documented configuration → update records and training against that 
      frozen version.
    why: Separate records have to be reconciled before they can support one account of the event. That account is 
      compared with predictions written beforehand, and unexplained discrepancies are kept visible rather than absorbed 
      into a success narrative. Only then are evidence-supported changes approved and the technical documentation 
      frozen. The lesson is configuration control and epistemic discipline, not weapon assembly.
    call: Control the post-test evidence freeze
    reason: Changes made after success still need records, or later teams will not know which tested form the claims describe.
    setup: Order the post-test evidence and configuration-control process.
    rebuttals:
    - Reconcile the records first; disagreeing records cannot yet support one claim.
    - Compare with pre-test predictions second and keep unresolved discrepancies visible.
    - Evidence-supported changes and the configuration freeze come third.
    - Documentation and training are updated last against the version that is actually frozen.
    cards:
    - Recover and reconcile the independent diagnostic and environmental records into one account of the event.
    - Compare that account with the pre-test predictions, and name what remains unexplained.
    - Approve only changes supported by the evidence, and freeze the documented technical configuration.
    - Update records, procedures, and training against that frozen version.
    order:
    - 0
    - 1
    - 2
    - 3
- title: What Can Science Decide?
  objective: Close the wartime evidence chain while separating technical findings, uncertainty, human consequences, and 
    policy judgments that science alone cannot settle.
  briefing: By August 1945 the immediate technical program is closing, but scientists across the Manhattan Project 
    disagree about demonstration, combat use, secrecy, and postwar control. The player finishes the evidence record, 
    preserves diagnostic and materials capability, and signs a final statement that distinguishes what the laboratory 
    knows from what it recommends.
  stake: It is August 1945, and the lab's technical work is ending while the moral fight grows. Scientists can agree on the

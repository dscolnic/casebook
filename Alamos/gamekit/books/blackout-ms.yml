        takeaway: A forecast is a normal shape plus what the weather adds, and the second part gets measured.
        format: BALLPARK
        question: What should tomorrow's evening peak be?
        answerText: About 6,880 megawatts. That is the normal Friday peak plus four degrees of cold at 120 megawatts each.
        why: Demand looks much the same most days, because people do much the same things at much the same times. What moves it is weather. The useful way to hold that is a figure for what one degree is worth on this system, measured from this winter rather than taken from a book. Here it is a hundred and twenty megawatts a degree, and tomorrow is four degrees below. So the peak lands near six thousand nine hundred.
        estimate:
          prompt: A normal Friday peaks at 6,400 megawatts. This winter, demand rises 120 megawatts for every degree below zero. Tomorrow is four degrees below.
          question: What should tomorrow's evening peak be?
          labels:
            - 6,400 MW (a normal Friday peak)
            - 120 MW for each degree
            - 4 (degrees below zero tomorrow)
            - 310 MW (the reserve being held)
          values: [6400, 120, 4, 310]
          slots: 3
          template: "{0} + {1} × {2}"
          formula: a+b*c
          correct: [0, 1, 2]
          target: 6880
          tolerance: 120
          units: MW
          solution: 6,400 + 120 × 4 is 6,880 megawatts.
          explanation: The reserve covers how wrong this could be. It is a separate decision, and adding it here counts the same worry twice.
          givens:
            - Base peak is 6,400 MW
            - Sensitivity is 120 MW per degree below 0
            - Tomorrow is four degrees below zero
          relationship: Peak = the normal peak + what one degree adds × how many degrees below zero.
      - group: OPS
        task: Match each plant to why it sits where it does.
        title: Cheapest first, and the exceptions
        place: System Operations
        scene: Four plants and an order to sign. Reyes wants each one matched to the real reason it sits where it does, rather than to its price.
        assumes:
          - generators are normally run cheapest first
        takeaway: "Cheapest first is the rule, and three things bend it: where a plant is, how fast it moves, and whether it can be relied on."
        format: CASEBOOK
        why: Running the cheapest first is what keeps electricity affordable. Three things bend that order. A plant that costs almost nothing to run goes first, and if nobody can promise its output, something reliable stays behind it. A plant that can change output fast is worth holding at half, because the other half is what gets called on. And a plant in the right place can be needed whatever it costs.
        rebuttals:
          - Costing nothing to run puts it first, and output nobody can promise is why something reliable stays behind it.
          - Holding a fast machine at half output is buying spare. A machine at full output has none to sell.
          - Being in the right place can be worth more than being cheap, when the cheap one overloads a line.
          - Dear and slow means last. It is the plant the system is trying not to need.
        columns:
          - The plant
          - Why it sits where it does
        scenarios:
          - The ridge fleet, almost free to run, with output nobody can promise.
          - A gas machine that can move fast, deliberately left at half output.
          - Old, on the wrong side of the line, kept off.
          - Old, on the right side of the squeeze, run anyway.
        choices:
          - First in the queue on cost, with something reliable kept behind it.
          - Held at half output, because only that leaves spare.
          - Held back, because starting it overloads something downstream.
          - Run out of turn for where it is, not its price.
        mapping: [0, 1, 2, 3]
      - group: GEN
        task: Decide what to do with more wind than the line can carry.
        title: When the cheapest power cannot get out
        place: Generation Hall
        scene: Sarraf can make 340 megawatts on the ridge tonight. The line out of the valley carries about 190. There is no second way out.
        assumes:
          - power has to have a path to wherever it is used
        takeaway: Electricity that cannot reach anybody is not electricity, whatever it cost to make.
        format: SCIENCETANK
        answerText: Some of it has to stop, and the useful move is a store on the ridge. It shifts tonight's surplus into hours when the line is free.
        why: A line at its limit is a wall, not a preference, so some of tonight's wind is not going anywhere. The only question is what the system buys instead. A second line fixes it for good and takes years. A store on the ridge moves the surplus in time rather than in space, which is the right shape for a problem that happens forty nights a winter. Paying the fleet to stop is what happens meanwhile, and it buys nothing.
        proposals:
          - label: A
            text: Install storage at the ridge, to move the surplus into the hours when the corridor is free.
          - label: B
            text: Pay the fleet to curtail tonight, and every night like it, until something else changes.
          - label: C
            text: Reinforce the corridor with a second circuit, commissioned in about three years.
          - label: D
            text: Run the corridor above its limit and accept the risk while the wind lasts.
        recommended:
          A: 45
          C: 25
        evidence: |-
          The ridge can produce 340 MW tonight. The corridor is rated at about 190 MW continuous. Nights like
          this occur perhaps 40 times a winter. Storage at the ridge would be about 50 MW for 4 hours,
          at 85% round trip. The corridor's second circuit has been on the reinforcement list for
          two years without a date.
  - title: Cranking path
    objective: Build a live system out of a dead one, in the only order that works.
    briefing: The valley collapsed at 19:04 and nothing in it can start without power it has not got.
    stake: "Saturday evening. The island has gone, the valley is dark, and every machine in it needs electricity before it can start. The pumps, the fans, the controls, the switchgear itself. Nadia Haddad has one small water-driven machine that can start on its own. Thabo Dube has a yard full of open switches. Today you work out why that small machine matters more than the big one, and write the restart in the order physics allows."
    takeaway: A dead system is rebuilt from one machine that needs nothing, outward along a path chosen in advance.
    stops:
      - group: GEN
        task: Turn the lost power into the energy nobody got.
        title: What the dark hours cost
        place: Generation Hall
        scene: The valley was drawing about 300 megawatts when it went dark. Haddad expects two and a half hours to bring it back, and the report wants energy rather than power.
        assumes:
          - power kept up over a stretch of time delivers energy
        takeaway: Power is the rate. Energy is the amount, and everything is settled in energy.
        format: BALLPARK
        question: How much energy did the valley never get?
        answerText: About 750 megawatt hours never delivered. Three hundred megawatts, for two and a half hours.
        why: "Power says how fast electricity is arriving. Energy says how much arrived. Both get called demand, which is why they get muddled. Multiply the power by the hours it was missing and you get energy: three hundred megawatts for two and a half hours is seven hundred and fifty megawatt hours. That is the figure every claim and every inquiry runs on, because it grows with the length of the outage."
        estimate:
          prompt: The valley was drawing about 300 megawatts when it collapsed. Bringing it back is expected to take two and a half hours.
          question: How much energy did the valley never get?
          labels:
            - 300 MW (demand when it went)
            - 2.5 h (how long to bring it back)
            - 26,000 (households affected)
            - 49.4 Hz (frequency before the split)
          values: [300, 2.5, 26000, 49.4]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 750
          tolerance: 80
          units: MWh
          solution: 300 × 2.5 is 750 megawatt hours.
          explanation: The number of households and the frequency both matter to the story, and neither belongs in this sum. One is who it happened to. The other is why.
          givens:
            - Demand at collapse was about 300 MW
            - Restoration is expected to take about 2.5 hours
          relationship: Energy = power × the time it was missing.
      - group: OPS
        task: Build the restart path, then name the link that decides it.
        title: The order physics allows
        place: System Operations
        scene: One hydro machine that can start with no outside power. A dead network. And a room that wants the big station back first. Nothing gets switched until the order is written down.
        assumes:
          - the big station needs electricity for its own pumps and fans before it can start
          - the hydro machine can start with no supply at all
        takeaway: The biggest machine is useless until something smaller can wake it up.
        format: CHAIN
        question: How does starting power reach the big station, and which link decides it?
        chain:
          hint: Assemble the transfer path from the source that can start unaided to the machine that cannot. Then choose the required link whose capacity governs whether startup power reaches the auxiliaries.
          links:
            - id: gate
              label: Reservoir gate
              transfers: water flow
              capacity: 30
              unit: MW equivalent
            - id: turbine
              label: Hydro turbine
              transfers: mechanical torque
              capacity: 24
              unit: MW
            - id: hydro-gen
              label: Hydro generator
              transfers: electrical power
              capacity: 20
              unit: MW
            - id: startup-feeder
              label: Black-start feeder
              transfers: electrical power to station auxiliaries
              capacity: 8
              unit: MW
            - id: auxiliaries
              label: Large-station pumps and fans
              transfers: startup services
              requires: 6
              unit: MW
            - id: large-gen
              label: Large station generator
              transfers: electrical output after startup
              capacity: 500
              unit: MW
          distractor: large-gen
          order:
            - gate
            - turbine
            - hydro-gen
            - startup-feeder
            - auxiliaries
            - large-gen
          governing: startup-feeder
        answerText: Water, hydro turbine, hydro generator, small feeder, the big station's own pumps and fans, then the big generator. The small feeder decides it.
        why: "A dead network cannot start from its biggest generator, because that machine needs power before it can make any. Pumps, fans, controls. The hydro machine is different: water pushes the turbine round with no electricity involved at all. So it goes first, and its output travels down a small feeder to wake the big station's own equipment. That small feeder is the link everything waits on. It only has to carry the auxiliaries."
      - group: DIST
        task: Match each step of the restart to what limits it.
        title: Why it cannot go faster
        place: Distribution Depot
        scene: Obi has crews asking why the restart is moving a few streets at a time. The substation is live and the whole feeder could be closed in one movement.
        assumes:
          - a small live system is upset far more by a given block of load than a big one
        takeaway: Every step is limited by something different, and rushing the wrong one collapses it again.
        format: CASEBOOK
        why: What limits the restart changes as it grows. Very early, the live piece is tiny, so any block of load is enormous next to it and the frequency dives. Long lines with almost nothing on them push the voltage up rather than down, which is the opposite of most people's instinct. Streets that have been off in winter come back higher than normal, because every heater is calling at once. And joining two live systems is a matching problem.
        rebuttals:
          - Early on the island is small, so any block is a large share of it. That is a frequency limit.
          - A long line with little on it pushes the voltage up rather than down, which is a voltage limit.
          - Cold load comes back above normal, because every heater in the street is calling at once.
          - Joining two live systems is about matching them, not about how much either can carry.
        columns:
          - The step
          - What limits it
        scenarios:
          - Adding the first blocks of load to a very small live island.
          - Energising a long line with almost nothing on it.
          - Restoring a street that has been off for two hours in winter.
          - Joining the restored island back to its neighbour.
        choices:
          - A frequency limit, because a small system cannot take a big step.
          - A voltage limit, since a quiet line pushes the end up.
          - A cold-load limit, because everything that was off comes back at once.
          - A matching limit, since both sides must agree first.
        mapping: [0, 1, 2, 3]
  - title: Three things at once
    objective: Rank three simultaneous problems, and hold the reasoning while they interfere.
    briefing: A fault, a forecast miss and a plant coming off at the same hour, and one room.
    stake: "Thursday, twenty to five, and three things arrive together. A cable fault has taken a feeder with three thousand three hundred households on it. Ravi Lindgren's forecast is running two hundred megawatts under, and climbing. And the gas machine that has carried the peak all week must come off at six. Dolores Reyes has one crew and about eighty minutes. Today you decide what gets attention first. None of these is new; all three at once is."
    takeaway: Ranking is not about which problem is worst but about which one gets worse fastest and which one is cheapest to remove.
    stops:
      - group: OPS
        task: Keep the one that cannot wait, and hand the rest over properly.
        title: Which of the three cannot wait
        place: System Operations
        scene: Reyes has three live problems on the board and can only keep one herself. Whitlock is ready to take a handover, and she will not accept an instruction that amounts to watch it.
        assumes:
          - a bad problem that is not getting worse is different from a small one that is
          - getting reserve in place takes time before the peak
        takeaway: Urgency is about how fast something is getting worse and whether somebody else can own the next move.
        format: DELEGATE
        question: What do you keep, and what exactly do you hand over?
        delegate:
          hint: Choose one problem to keep. For every handoff, assign a person, a first action and a measurable return condition; “watch it” is refused.
          problems:
            - id: forecast
              label: Forecast is 200 MW low and worsening
              rate: +40 MW error per 10 min
              consequence: Reserve procurement closes in 20 min; lost lead time cannot be recovered before the peak.
              trend: rising
              irreversible: true
              loud: false
              delegable: false
            - id: cable
              label: Cable fault with 3,300 households off
              rate: 0 additional households per 10 min
              consequence: Customers remain off while the dispatched crew repairs the fault.
              trend: stable
              irreversible: false
              loud: true
              delegable: true
            - id: fuel
              label: Gas machine reaches its fuel limit at 18:00
              rate: known 180 MW loss at a fixed time
              consequence: Replacement generation must be loaded before 18:00.
              trend: stable
              irreversible: false
              loud: false
              delegable: true
          firstActions:
            - id: field-check
              label: Confirm crew arrival and fault location
            - id: start-replacement
              label: Begin loading 180 MW of replacement generation
          returnConditions:
            - problem: cable
              condition: crew reports the fault is larger than a one-shift repair
            - problem: fuel
              condition: replacement generation is more than 30 MW behind its loading plan
          team:
            - id: field
              label: Field coordinator
            - id: generation
              label: Generation desk
          first: forecast
        answerText: Keep the forecast error, because it is still growing. Hand the cable fault to the field team and the fuel-limited machine to the generation desk. Each gets a first move and a number.
        why: The cable fault is loud and stable. Those customers are already off, and a crew is on the way. The machine running out of fuel has a known time and a known size, so somebody else can line up its replacement. The forecast error is different. It is still growing, and getting reserve in place takes hours. Every update that goes by without a decision removes choices nobody can get back.
      - group: TRANS
        task: Work out what the line is wasting now.
        title: The same line, busier
        place: Transmission & Protection
        scene: With the feeder out, the flow has shifted and the line is carrying more than it was. Novak wants the heat figure before deciding whether the evening needs a switching change.
        assumes:
          - the busier a wire is, the larger the share of the power it turns into heat
        takeaway: When something counts twice over, a small rise in it is a big rise in the result.
        format: BALLPARK
        question: How much is the line wasting as heat now?
        answerText: About 20 megawatts, against 17 an hour ago. The flow rose about a ninth and the waste rose about a fifth.
        why: An hour ago this line carried eleven hundred and fifty megawatts and wasted about seventeen. Now it carries twelve hundred and eighty and wastes about twenty. The flow went up about a ninth. The waste went up about a fifth. That is because the heat depends on the current twice over, so it always outruns the flow. And the limit on the line is a heat limit, so the margin disappears faster than the loading suggests.
        estimate:
          prompt: The line now carries 1,280 megawatts, and about 0.016 of that — one and six tenths per cent — is lost as heat.
          question: How much is the line wasting as heat now?
          labels:
            - 1,280 MW (what it carries now)
            - 1.6 MW lost for every 100 MW carried
            - 1,150 MW (what it carried an hour ago)
            - 1.5 MW for every 100, an hour ago
          values: [1280, 1.6, 1150, 1.5]
          slots: 2
          template: "{0} ÷ 100 × {1}"
          formula: a/100*b
          correct: [0, 1]
          target: 20.5
          tolerance: 2
          units: MW
          solution: 1,280 is nearly thirteen hundreds, and 1.6 lost from each hundred is about 20 megawatts.
          explanation: The share itself has gone up, from 0.015 to 0.016, because a busier wire wastes a bigger fraction. That is why the answer rises faster than the flow.
          givens:
            - the steady current is now 1,280 A in each phase
            - Resistance remains 4.2 Ω per phase
            - There are three phases
          relationship: Lost = what it carries × the share lost.
      - group: LOAD
        task: Put the evening's four moves in order.
        title: An order that survives being carried out
        place: Load & Forecasting
        scene: Lindgren has four moves for the evening and no view on the order. Two of them change what the others are worth, and one cannot be undone inside the shift.
        assumes:
          - some actions change what the actions after them are worth
        takeaway: Do what improves your information first, and what you cannot undo last.
        format: SEQUENCE
        why: Fix the forecast first, because every other number is sized against it. Get that wrong and you do the right thing in the wrong amount. Bring the reserve forward next. It costs money rather than customers, and it can be handed back. Then start loading the replacement plant, which needs real minutes and has to be underway before the fuel runs down. Reconfiguring the network goes last, because it is the one nobody can quietly undo.
        cards:
          - Fix the forecast, so every other number is sized against something real.
          - Bring the reserve forward, to cover the machine coming off at six.
          - Start loading the replacement plant, which needs the minutes.
          - Reconfigure the network around the faulted feeder.
        order: [0, 1, 2, 3]
        axis: This is not a clock. You could do any of the four right now. Order them by how easily each one can be undone, easiest first.
        ends: [Easy to take back, Nobody can undo it]
  - title: What we know, and how well
    objective: Say how strongly each of the fortnight's claims is held, and what outlives the emergency.
    briefing: The event report has to state what is established, what is inferred and what is still a guess.
    stake: "Friday. The fortnight goes into a report, and Dolores Reyes will not sign one that states everything at the same confidence. A reader who cannot tell a measurement from a guess will act on both the same way. June Farrow has the evidence file. Ravi Lindgren wants his forecast written as a range. Today you sort the fortnight's claims by how well each is known, and decide what becomes permanent practice."
    takeaway: A finding is worth what its evidence is worth, and saying so is what makes a report usable a year later.
    stops:
      - group: METER
        task: Spend the two checks on the claims that need them.
        title: Measured, worked out, or suspected
        place: Metering & Standards
        scene: June Farrow has four statements ready for the final report and two checks left before it is signed. Some are already backed. Others are still a suspicion.
        assumes:
          - a claim can be measured, worked out, or still only suspected
          - there is not enough time to check everything
        takeaway: A signature is only worth the evidence behind it, so check the important claims that have none.
        format: ATTEST
        question: Which claims deserve the two checks before they become findings?
        attest:
          hint: You may verify only two claims. Read what currently backs each one, then spend checks where a wrong critical claim would most damage the report.
          checks: 2
          claims:
            - id: sensor-offset
              label: The corridor sensor reads about 11 °C low
              critical: true
              backed: true
              evidence: infrared survey + sag estimate + firmware date
              verification: repeat independent temperature comparison
            - id: strength-loss
              label: The conductor has permanent tensile-strength loss
              critical: true
              backed: false
              evidence: inference from corrected thermal history; no sample test
              verification: laboratory tensile test on a representative removed sample
            - id: store-efficiency
              label: The ridge store returned about 85% on the tested cycle
              critical: false
              backed: true
              evidence: one measured charge-discharge cycle
              verification: repeat at a second discharge rate
            - id: relay-cause
              label: A particular relay setting caused the original trip
              critical: true
              backed: false
              evidence: plausible sequence; no causal test yet
              verification: replay the event against the relay setting and independent event timing
          correctVerify:
            - strength-loss
            - relay-cause
        answerText: Check the wire's strength and the relay explanation. The sensor is already backed two ways, and the store's efficiency is not what the inquiry turns on.
        why: The four claims are not equally supported. The sensor being wrong has been shown two separate ways, with a date to match, so it is settled. The wire having lost strength is good reasoning and nobody has tested a piece of it. The store's efficiency is measured, and it is not what the inquiry turns on. The relay explanation is both central and unproved. Two checks, and they belong on the claims that matter and have nothing under them.
      - group: LOAD
        task: Say why the winter peak goes in as a range.
        title: The number that has to be a range
        place: Load & Forecasting
        scene: Lindgren's winter peak goes into the report. He wants the width written into the sentence, and Reyes wants to know what the width is for.
        assumes:
          - a forecast covers a spread of outcomes, not just one
        takeaway: A prediction is only usable by a planner if it says how wrong it might be.
        format: CHOICE
        question: Why does the winter peak go in as a range rather than one figure?
        answerText: Because reserve is sized against how far above the middle the peak might land. That is the width, and a single number deletes it.
        why: Reserve is not held against the peak everybody expects. It is held against how far above that the peak might land, which is a fact about the width and not about the middle. Print a single number and the one quantity a planner needs has been deleted, so the planner invents one, usually too small. The width is also the honest part of the forecast. It says which conditions the model was built on and which it has never seen.
        choices:
          - Reserve has to cover how far above the middle it lands.
          - A range stops one odd winter looking like a broken model.
          - The middle needs a whole winter, and the width does not.
          - Because a range already includes the reserve the operators have scheduled.
        answer: Reserve has to cover how far above the middle it lands.
        rebuttals:
          - A range makes the forecast easier to test, not harder. A peak outside it counts against the model.
          - Both the middle and the width are worked out before the season. Neither waits for the actual peak.
          - The forecast and the reserve are separate decisions. The width informs the reserve; it does not contain it.
      - group: OPS
        task: Say which of the fortnight's changes should stay.
        title: What outlives the emergency
        place: System Operations
        scene: Four things the room started doing under pressure. Reyes asks which are worth their cost on an ordinary Monday, when nothing at all is going wrong.
        assumes:
          - a habit taken up in an emergency has a cost that only shows later
        takeaway: Keep what would have caught it early. Drop what only paid off because the fortnight was strange.
        format: CHOICE
        question: Which of the fortnight's changes is most worth keeping?
        answerText: Cross-check any instrument a decision rests on against something independent. That is the one that would have caught this months earlier.
        why: One of these would have caught the whole thing. The sensor was wrong for months, because nothing was ever compared against it. Comparing it costs an afternoon. Extra reserve costs money every night for a benefit on a few of them. Reading the loading four times as often would have changed nothing at all. Those readings were wrong, rather than late.
        choices:
          - Cross-check any instrument a decision rests on, against something independent.
          - Hold the extra reserve at the fortnight's level all winter.
          - Report line loading every fifteen minutes instead of every hour.
          - Require two operators to sign any load shedding.
        answer: Cross-check any instrument a decision rests on, against something independent.
        rebuttals:
          - Extra reserve costs money every night for a benefit on a few nights. That is a question about the forecast width.
          - The loading readings were wrong, not late. Reporting a wrong number four times as often adds nothing.
          - A second signature slows down the one decision that was both right and urgent.
# ------------------------------------------------------------------ the copy
# What each place says when the player reads its panel. Keyed by group id for the
# six areas and by the plain landmark ids in site.js — a building with no entry
# here shows a bare title, and validateContent notes it.
copy:
  OPS: <p>The control room. One long desk, a wall of the whole interconnection, and the only number on it that belongs to everybody.</p>
  GEN: <p>The machine hall. Four sets turning in step with every other machine on the system, which is what lets one number describe all of them.</p>
  TRANS: <p>Protection and switching. The rules for an argument that will happen in 80 milliseconds with nobody present.</p>
  DIST: <p>The depot. Where the network stops being a diagram and turns into a van, a pole and somebody's evening.</p>
  LOAD: <p>Forecasting. Weather, the school holidays, and whether it gets dark before people get home.</p>
  METER: <p>Standards. The question nobody wants opened during an incident: is that number the number.</p>
  GATE: <p>The gatehouse. Badge, permit to work, and the day's calls.</p>
  STORE: <p>Spares and cable. Nothing here is interesting until the night a restoration is limited by it.</p>
  TRAINING: <p>The simulator room. Last year's event, replayed at quarter speed, with the log open beside it.</p>

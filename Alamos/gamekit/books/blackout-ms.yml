# blackout.yml — Blackout, as a book.
#
# Course: AP Physics 2 circuits and induction, with a first-year
# electrical-engineering unit. Grade 12–13. The syllabus this is measured against
# is `blackout` in tools/syllabus.js — 32 concepts and 10 equations, written
# before these questions, so page 3 of the printed book says what is still owed.
#
# The campaign is one argument with two right sides: shed load now and cut power
# to people who need it, or hold on and risk the whole interconnection. Both are
# correct on different days.
#
# The spine of the subject is one equation. Frequency is not a reading, it is the
# running balance of supply and demand, and everything a control room does
# follows from df/dt = (P_gen − P_load) / 2H. Days 1–5 build to it; the black
# start at the end of the campaign is the ordering puzzle it licenses.

theme:
  id: blackout_ms
  title: Blackout
  subtitle: System Operator · Calder Interconnection

# ---------------------------------------------------------------- the areas
# Six, and each is a place with a different question. Operations holds the whole
# system and no single piece of it; the other five each own one physical layer.
groups:
  - id: OPS
    code: OPS
    name: System Operations
    color: '#c0392b'
    desc: The whole network at once, and the decisions that cannot wait for certainty.
    defaultLeader: reyes
    milestones: [Read the system, Find the constraint, Choose the action, Hand over the shift]
  - id: GEN
    code: GEN
    name: Generation
    color: '#d35400'
    desc: Machines that turn something into torque, and what they can be asked to do next.
    defaultLeader: haddad
    milestones: [Know the plant, Match the load, Hold the frequency, Ready to synchronise]
  - id: TRANS
    code: TRANS
    name: Transmission & Protection
    color: '#2980b9'
    desc: Getting power a long way, and the relays that decide when to give up on a line.
    defaultLeader: novak
    milestones: [Trace the path, Rate the line, Set the protection, Prove the coordination]
  - id: DIST
    code: DIST
    name: Distribution
    color: '#27ae60'
    desc: The last few kilometres, where the network stops being a diagram and becomes a street.
    defaultLeader: obi
    milestones: [Map the feeder, Balance the phases, Hold the voltage, Restore the customers]
  - id: LOAD
    code: LOAD
    name: Load & Forecasting
    color: '#8e44ad'
    desc: What people are about to do, and how much of it the system has to be ready for.
    defaultLeader: lindgren
    milestones: [Read the curve, Forecast the peak, Price the reserve, Justify the margin]
  - id: METER
    code: METER
    name: Metering & Standards
    color: '#b0762a'
    desc: Whether the numbers everybody is arguing about are the numbers.
    defaultLeader: farrow
    milestones: [Trace the instrument, Bound the error, Reconcile the records, Certify the data]

# ------------------------------------------------------------------ the cast
roster:
  - id: reyes
    name: Dolores Reyes
    role: Shift Supervisor, System Operations
    division: OPS
    bio: |
      22 years on the desk, 11 of them on nights. She runs the room
      the way a bridge is run: nobody touches a control without saying out loud
      what they expect to happen, and then whether it did.

      Her rule is that frequency is the only number on the wall that belongs to
      everybody. Voltage is local and can be argued about; frequency is the whole
      interconnection agreeing or failing to agree, and it moves before anything
      else does.

      Her limit is that she is paid to act before the picture is complete. The
      operator who waits for certainty is the operator who watches the cascade.
    quiz:
      - q: Why does Reyes treat frequency differently from voltage?
        a: Frequency is one number for the whole interconnection
        wrong:
          - Voltage instruments are more accurate than frequency instruments during a disturbance
          - Voltage cannot be measured while the system is swinging
          - Frequency matters at the generators and nowhere else
  - id: haddad
    name: Nadia Haddad
    role: Generation Lead
    division: GEN
    bio: |
      Came up through turbine commissioning and still walks a machine hall
      listening rather than reading. She can tell a governor hunting from the
      sound of it before the trend on the screen has moved.

      What she wants understood is that a generator is a flywheel first and a
      power source second. The stored rotational energy is what buys the seconds
      in which anybody gets to make a decision.

      Her limit is ramp rate. A machine that can supply 400 megawatts
      cannot supply them in the 90 seconds after a trip, and no amount of
      wanting changes the thermal gradient in a steam drum.
    quiz:
      - q: Why does Haddad describe a generator as a flywheel first?
        a: Its stored rotational energy slows the frequency change
        wrong:
          - Because a flywheel stores more energy per tonne than a boiler and its steam plant do
          - Because the turbine and the flywheel are the same component
          - Because rotational energy costs less per megawatt than fuel
  - id: novak
    name: Piotr Novak
    role: Protection Engineer
    division: TRANS
    quiz:
      - q: Why does Novak call a relay setting the rules for an argument nobody attends?
        a: The relay has to decide alone, in milliseconds, from settings written months earlier
        wrong:
          - Relay settings are agreed by a standing committee that never meets in the same room
          - The argument is between the two ends of a line that cannot talk to each other in time
          - Nobody is allowed in the yard while protection is live
    bio: |
      Sets the relays, which means he designs the conditions under which the
      network is allowed to give up on part of itself. He describes the job as
      writing the rules for an argument that will happen in 80 milliseconds
      with nobody present.

      A relay that never trips is not a cautious relay, it is a relay that lets a
      fault burn. A relay that trips early takes out a healthy line and moves the
      overload somewhere less convenient. Coordination is the whole discipline.

      His limit is that he is protecting against faults he has to imagine in
      advance, and the cascade always finds the sequence nobody drew.
  - id: obi
    name: Chinelo Obi
    role: Distribution Lead
    division: DIST
    bio: |
      Runs the feeders, which is where the network acquires customers, trees and
      opinions. She points out that every elegant thing decided in the control
      room arrives here as a van, a pole and somebody's evening.

      Her measure of a restoration is not megawatts, it is households and how
      long they waited, and she will say so in a meeting about megawatts.

      Her limit is that the low-voltage network is only sparsely instrumented.
      Past the substation she is often reasoning from the shape of the load
      rather than from a reading.
    quiz:
      - q: Why does Obi resist reporting restoration purely in megawatts?
        a: A few large customers can dominate the megawatts restored
        wrong:
          - Megawatts restored is a settlement quantity and is not available until afterwards
          - Household supply is not counted in the system total
          - Distribution work is measured in amperes rather than in watts
  - id: lindgren
    name: Sten Lindgren
    role: Load Forecasting
    division: LOAD
    quiz:
      - q: What does Lindgren mean by calling forecasting anthropology with a thermometer?
        a: Demand is what people do, and weather is only one of the things that decides it
        wrong:
          - Forecasters interview a panel of households about their heating every winter
          - The model is built from historical temperature alone
          - Demand can be predicted from population size and nothing else
    bio: |
      Forecasts demand, which he insists is a branch of anthropology conducted
      with a thermometer. Weather, the television schedule, the school holidays
      and whether it gets dark before people get home.

      He is precise about what a forecast is: a distribution, not a number. The
      useful output is the width, because the width is what the reserve has to
      cover.

      His limit is that the events worth forecasting are rare by construction, so
      the model is always best calibrated for the days that matter least.
  - id: farrow
    name: June Farrow
    role: Metering & Standards
    division: METER
    bio: |
      Owns the question nobody wants to open during an incident: is that number
      the number. Instrument transformers, telemetry lag, clock skew, and the
      cheerful confidence of a meter reading the wrong side of a saturated core.

      She keeps the traceability chain because after the event there will be an
      inquiry, and the inquiry will run on the records rather than on anybody's
      memory of the night.

      Her limit is that she is usually reconstructing rather than observing, and
      the highest-value seconds are the ones with the worst data.
    quiz:
      - q: Why does Farrow distrust telemetry during a fast disturbance?
        a: Scan rates and clock skew can put readings in the wrong order
        wrong:
          - Instrument transformers saturate during a fault and stop reporting altogether
          - Telemetry stops being sent once frequency leaves its band
          - Digital meters are less accurate than the analogue ones they replaced
  - id: whitlock
    name: Aaron Whitlock
    role: Assistant Operator
    division: OPS
    quiz:
      - q: Why is the log Whitlock keeps worth more than the reports written afterwards?
        a: It records what the room knew at the time, before anybody knew how it ended
        wrong:
          - It is the only document the regulator is entitled to ask the company for
          - Reports are written afterwards by people who were not on shift that night
          - The log records exact times and the reports do not
    bio: |
      Second seat on nights, three years in, and the person who actually keeps
      the log. Has read every sequence-of-events report the company owns and can
      quote which ones contradict the official account.
  - id: sarraf
    name: Mina Sarraf
    role: Wind Fleet Controller
    division: GEN
    quiz:
      - q: Why does Sarraf say curtailing a turbine is not waste?
        a: Energy that cannot reach a customer was never available, whatever the wind was doing
        wrong:
          - Curtailed output is held in storage and released later the same night
          - The fleet is paid the same under contract whether it runs or not
          - Turbines last longer when they are not run at full output
    bio: |
      Dispatches the ridge fleet from a desk with more forecast on it than
      telemetry. Explains patiently and often that curtailing a turbine is not
      waste when the alternative is a line at its thermal limit.
  - id: dube
    name: Thabo Dube
    role: Substation Technician
    division: TRANS
    quiz:
      - q: Why does Dube read a switching order back before he touches anything?
        a: Saying it aloud is the one chance to catch a wrong item before it is irreversible
        wrong:
          - The control room records the readback afterwards as proof of who is liable
          - Reading aloud is required by the radio protocol in the yard
          - It gives the control room time to cancel the instruction
    bio: |
      Does the switching in the yard when the control room asks for it, in the
      order it is written, reading it back before he touches anything. Has opinions
      about people who improvise switching sequences.
  - id: kowalczyk
    name: Ewa Kowalczyk
    role: Field Crew Lead
    division: DIST
    quiz:
      - q: Why does Kowalczyk know which streets have the dialysis clinic on them?
        a: Restoration order is decided by what waiting costs, not by how many houses are on the feeder
        wrong:
          - Those streets are required by law to be restored first in every outage
          - Medical addresses are the only ones the fault-finding system records
          - Crews are paid a premium for restoring critical premises
    bio: |
      Runs the crew that finds the fault, which is usually a tree, and puts the
      feeder back. Knows which streets have the hospital, the dialysis clinic and
      the two houses on home oxygen.
  - id: alvarez
    name: Rafael Alvarez
    role: Demand Analyst
    division: LOAD
    quiz:
      - q: What is Alvarez's counterfactual demand curve for?
        a: It says what demand would have been without the event, which is what the loss is measured against
        wrong:
          - It predicts what demand will be over the course of the following week
          - It shows which feeders were restored in which order
          - It converts megawatts into megawatt-hours for the report
    bio: |
      Builds the load curves and the counterfactuals. Spends the day after an
      event working out what demand would have been if the event had not happened,
      which is the number every settlement argument turns on.
  - id: bergström
    name: Klara Bergström
    role: Calibration Technician
    division: METER
    quiz:
      - q: Why will Bergström not be hurried over a disputed reading?
        a: A reading is only admissible if the instrument's traceability can be shown, and that takes as long as it takes
        wrong:
          - Calibration records can only be updated at the end of an accounting month
          - She is the only person permitted to touch the standards
          - A rushed calibration would damage the reference instrument
    bio: |
      Keeps the standards traceable and the calibration records current. The
      cheerful arbiter of whether a disputed reading is admissible, and immune to
      being hurried.

# ------------------------------------------------------------------- glossary
glossary:
  - name: Frequency
    aliases: [frequency, hertz]
    def: How many times a second the alternating supply completes a cycle. It is the same number everywhere
      on one interconnection, and it moves up when generation exceeds demand and down when demand exceeds
      generation.
  - name: Load
    aliases: [load, demand]
    def: The total power being drawn from the system at a given moment.
  - name: Megawatt
    aliases: [megawatt, mw]
    def: 1 million watts. The unit a power system is argued about in; a large generating unit is a few
      hundred of them.
  - name: SCADA
    aliases: [scada]
    def: The monitoring system that collects readings from substations and presents them in the control
      room. It samples every few seconds, which is slow compared with a fault.
  - name: Inertia
    aliases: [inertia, rotational inertia]
    def: The rotational energy stored in spinning generators. It resists a change in frequency, which is
      what buys time for anything else to respond.
  - name: RMS
    aliases: [rms, root mean square]
    def: The steady value that would deliver the same power as a varying one. Mains voltages are quoted
      this way, not as their peak.
  - name: Power factor
    aliases: [power factor]
    def: The fraction of the apparent power that does real work, equal to the cosine of the angle between
      voltage and current.
  - name: Reactive power
    aliases: [reactive power, kvar, mvar]
    def: Power that flows back and forth without being consumed. It does no work but it occupies capacity
      and it is what moves voltage.
  - name: Apparent power
    aliases: [apparent power, volt-ampere]
    def: The voltage times the current, whatever the timing between them. It is what a cable and a
      transformer are rated for, and it is bigger than the power actually doing work.
  - name: Droop
    aliases: [droop, governor droop]
    def: A deliberate setting that makes a generator reduce output as frequency rises, so several machines
      share a change in load without fighting each other.
  - name: Contingency
    aliases: [contingency, n-1]
    def: A credible single failure the system is required to survive without shedding load.
  - name: Load shedding
    aliases: [load shedding, shed load]
    def: Disconnecting customers on purpose to bring demand down to what generation can supply.
  - name: Calibration
    aliases: [calibration, calibrate, calibrated]
    def: Checking an instrument against a standard already known to be right, so that its readings mean
      something. A drifted instrument is confident and wrong, and it does not say which.
  - name: Instrument transformer
    aliases: [instrument transformer, current transformer]
    def: A device that scales a large voltage or current down to something a meter can read safely.
  - name: Feeder
    aliases: [feeder]
    def: One distribution circuit leaving a substation, with the homes and businesses it supplies
      spread along it.

# ---------------------------------------------------------------- the days
missions:
  - title: The number on the wall
    objective: Establish what the frequency is actually telling the room before anybody acts on it.
    briefing: A unit tripped at 04:12 and the frequency has not come back to where it started.
    stake: "Tuesday, ten past four in the morning. The biggest machine on the Calder system has tripped with no warning. The frequency fell, then steadied below where it started. Dolores Reyes says the steadying matters more than the fall. Nadia Haddad has machines that can cover it, but not in two minutes. Today you read what the frequency is telling you, and decide what to ask for first. Every house on the system is on the other end of it."
    takeaway: Frequency is not a reading from a place; it is the whole system's supply and demand, arriving as a number.
    stops:
      - group: OPS
        task: Match each reading to what it is evidence of.
        title: What the falling number tells you
        place: System Operations
        scene: The wall shows the frequency dropping for eight seconds, then flattening out low. Beside it the power is in MW, which means megawatts, millions of watts at once. Aaron Whitlock has the log open, and two people have already named a cause.
        assumes:
          - the whole grid runs at one speed, and that speed is what frequency measures
        takeaway: Frequency belongs to the whole system. Voltage belongs to one place.
        format: PROTOCOL
        why: Every generator on the grid turns in step, like a line of dancers. Frequency is the speed they are all turning at, so it is one number for the whole system. Take a generator away and the rest have to carry its share, which slows them all down together. How fast it falls says how big the gap is. Flattening out low is not recovery. It is the machines settling at a new, slower speed with the gap still there.
        rebuttals:
          - The same frequency everywhere is the machines turning in step, not a coincidence between meters.
          - How fast it fell measures the size of the gap. That is why it is the first thing to read.
          - Flattening out low is a new balance at a lower speed. It is not the system recovering.
          - Voltage is the local one. It says where, which is why it disagrees between substations.
        scenarios:
          - Every substation reports the same frequency, to two decimal places.
          - It fell steeply for two seconds, and then more slowly.
          - The frequency has stopped falling, and is sitting below where it started.
          - Two substations report voltages three per cent apart.
        choices:
          - One number for the whole system, because every machine turns in step.
          - The size of the gap, against what was spinning.
          - A new balance at a slower speed, not the system getting better.
          - A local number, which is what makes it useful for saying where.
        mapping: [0, 1, 2, 3]
      - group: GEN
        task: Work out how much generation the system has lost.
        title: How much went missing
        place: Generation Hall
        scene: Haddad needs a number before starting anything. The demand has not moved. What has changed is how much the units still running can make between them.
        assumes:
          - the grid has to make exactly as much as it is using, every second
        takeaway: The gap between what is needed and what is being made is the whole problem.
        format: BALLPARK
        question: How much generation is missing?
        answerText: Three hundred megawatts. That is what the system needs minus what is left running.
        why: A grid has to make exactly what it is using, second by second. There is no store. So when a unit trips, the gap is simply what was needed minus what is left. Here that is three hundred megawatts. The frequency falling is the machines already spinning giving up some of their speed to cover it, which they can do for seconds rather than minutes. That is the whole reason this is urgent.
        estimate:
          prompt: The system needs 6,400 megawatts. The units still running can make 6,100 between them.
          question: How much generation is missing?
          labels:
            - 6,400 MW (what the system needs)
            - 6,100 MW (what is left running)
            - 0.30 Hz each second (how fast the frequency fell)
            - 50 Hz (the normal frequency)
          values: [6400, 6100, 0.30, 50]
          slots: 2
          template: "{0} − {1}"
          formula: a-b
          correct: [0, 1]
          target: 300
          tolerance: 20
          units: MW
          solution: 6,400 − 6,100 is 300 megawatts.
          explanation: The frequency figures describe what happened next. They are not the gap. The gap is a subtraction, and the two numbers for it are on the board.
          givens:
            - The system needs 6,400 MW
            - The units still running can make 6,100 MW
          relationship: Missing = what is needed − what can be made.
      - group: METER
        task: Open what each record depends on, keep what stands, and name the bad clock.
        title: What a timestamp is made of
        place: Metering & Standards
        scene: June Farrow has three records of the same eight seconds, and they disagree about what happened first. The three of them are stamped by two different clocks.
        assumes:
          - a written-down time is a measurement plus a clock
        takeaway: Being sure something happened and being sure when it happened are two separate pieces of work.
        format: CHOICE
        question: A record says the alarm came first. What two things have to be right for that to be true?
        answerText: The alarm really happened, and the clock that stamped it was telling the right time.
        why: Every timestamp is two claims glued together. One is that something happened — a relay picked up, a breaker opened. The other is that the clock writing the time was correct at that moment. They fail separately, and that is the whole difficulty. A relay can be perfectly right about what it saw and eighteen months out on when. So when two records disagree about the order, the first question is not which relay is broken. It is which clocks they used, and when those clocks were last checked.
        choices:
          - The event happened, and the clock was right
          - The relay is new, and the wiring is correct
          - Two records agree, and both are signed
          - The alarm is loud, and somebody heard it
        answer: The event happened, and the clock was right
        rebuttals:
          - A new relay with a drifted clock writes wrong times all day.
          - Two records off one clock are one clock, written down twice.
          - Whether anybody heard it says nothing about when it happened.
        call: Say what a timestamp is made of
        setup: Three records of the same eight seconds, and they disagree.
        story: "A timestamp is a measurement and a clock, glued together and written as one number. The measurement can be sound while the clock is months out, and the record will still look exactly like a fact. June Farrow's three records of the same eight seconds do not agree, and none of the relays is faulty. Knowing what a timestamp is made of is what turns that from a mystery into a question about clocks."
  - title: What the line can carry
    objective: Decide which circuit takes the flow once one path is gone.
    briefing: With the unit off, the flow has redistributed and one corridor is running warm.
    stake: "Wednesday. The replacement power is coming from the wrong side of the system, so it arrives down two lines instead of three. Piotr Novak has a line above its steady limit. A relay will take the decision away from the room in about forty minutes if nobody else does. Thabo Dube is in the yard waiting to be told what to switch. Today you rate the line honestly, and work out where the flow goes if it trips."
    takeaway: A rating is a time and a temperature, not a wall, and what matters is where the flow goes next.
    stops:
      - group: TRANS
        task: Set the thresholds before the trend is released.
        title: Act before the relay does
        place: Transmission Control
        scene: The line is carrying eight per cent more than it is rated for, and rising slowly. Novak wants a plan he can hand to the switching operator before the protection makes the choice for them.
        assumes:
          - a line has a steady limit and a short-term one, and they are different
          - moving generation about takes minutes, and shedding load is quick
        takeaway: A rule has to fire early enough for the slow action to arrive in time.
        format: TRIGGER
        question: At what loading should each action be committed, given how long each takes?
        trigger:
          hint: Choose a loading threshold for each action, then release the trend. The action begins only after its lead time, so a threshold can be correct in principle and still arrive too late.
          scale:
            min: 100
            max: 125
            unit: "% of continuous rating"
          ceiling: 120
          stream:
            - t: 0
              value: 108
              hoursLeft: 576
              at: day 0
              update: 108 % of continuous rating
            - t: 4
              value: 110
              hoursLeft: 480
              at: day 4
              update: 110 % of continuous rating
            - t: 8
              value: 113
              hoursLeft: 384
              at: day 8
              update: 113 % of continuous rating
            - t: 12
              value: 116
              hoursLeft: 288
              at: day 12
              update: 116 % of continuous rating
            - t: 16
              value: 118
              hoursLeft: 192
              at: day 16
              update: 118 % of continuous rating
            - t: 20
              value: 119.5
              hoursLeft: 96
              at: day 20
              update: 119.5 % of continuous rating
            - t: 24
              value: 120.5
              hoursLeft: 0
              at: day 24
              update: 120.5 % of continuous rating
          tolerance: 1
          conditions:
            - id: redispatch
              label: Redispatch 200 MW away from the corridor
              target: 110
              unit: min
              leadHours: 6
            - id: shed
              label: Shed 8% of downstream load
              target: 118
              unit: min
              leadHours: 1
        answerText: Start moving generation at 110 per cent and shed load at 118. On this trend both then arrive before the ceiling at 120.
        why: The short-term limit exists so somebody can decide, not so everybody can wait. The response comes in stages because the actions take different times. Moving generation about takes minutes, so it has to start while there is still room. Shedding load is quick, so it can wait for a higher number. Writing both down before the trend runs stops hindsight becoming policy. A sensible threshold that fires too late for its own action is still a failed rule.
      - group: LOAD
        task: Work out how much of the power is lost as heat.
        title: The power that never arrives
        place: Load & Forecasting
        scene: Sten Lindgren, who forecasts the demand, wants the loss figure before the morning call. The argument about moving generation about is really an argument about waste. The yard radio is still live beside them.
        assumes:
          - current pushing through a wire makes heat, and that heat is power that never arrives
        takeaway: A wire warms up because some of the power is being spent on the wire itself.
        format: BALLPARK
        question: How much of the power is being lost as heat?
        answerText: About 17 megawatts, turned into warm air along the line.
        why: Pushing current down a wire warms the wire, and that heat is power that never reaches anybody. About one and a half per cent of what this corridor carries is being spent that way. On eleven hundred and fifty megawatts that is seventeen, which is a small power station keeping the countryside warm. The share is not fixed either. Push more current down the same wire and the waste climbs faster than the current does.
        estimate:
          prompt: The corridor is carrying 1,150 megawatts, and about 0.015 of that — one and a half per cent — is lost as heat in the wires.
          question: How much of the power is being lost as heat?
          labels:
            - 1,150 MW (what the corridor carries)
            - 1.5 MW lost for every 100 MW carried
            - 4.2 (ohms of wire)
            - 400 kV (the voltage it runs at)
          values: [1150, 1.5, 4.2, 400]
          slots: 2
          template: "{0} ÷ 100 × {1}"
          formula: a/100*b
          correct: [0, 1]
          target: 17.25
          tolerance: 2
          units: MW
          solution: 1,150 is eleven and a half hundreds, and 1.5 lost from each hundred is about 17 megawatts.
          explanation: The share is written as a decimal already. Use one and a half instead of 0.015 and the answer comes out a hundred times too big.
          givens:
            - the steady current is 1,150 A in each phase
            - Resistance is 4.2 Ω per phase over the corridor
            - There are three phases
          relationship: Lost = what it carries × the share lost.
      - group: OPS
        task: Say what makes the warm line worth acting on now.
        title: What you are really protecting against
        place: System Operations
        scene: Reyes wants a decision. The line is inside its short-term limit for another half hour. The question on the table is what happens elsewhere if this one trips.
        assumes:
          - a network is supposed to survive losing any single line
        takeaway: A limit only matters alongside what the flow does when that line is gone.
        format: CHOICE
        question: What makes the warm line a problem worth acting on now?
        answerText: Not the heat. If this line trips, its load lands on a neighbour that cannot take it, and that trip is nobody's decision.
        why: Running above the steady limit is a decision about time and heat, and the short-term limit exists so somebody can make it. What turns expensive into dangerous is what happens next. This line is already loaded. Lose it, and everything it was carrying lands on its neighbours, which were never sized for the sum. That second trip is protection working properly. Nobody chooses it.
        choices:
          - Being over the steady limit means damage starts at once.
          - If it trips, its flow lands on a weaker neighbour.
          - The seventeen megawatts of heat is enough to make the protection operate.
          - The protection has to trip before anybody can use the short-term limit.
        answer: If it trips, its flow lands on a weaker neighbour.
        rebuttals:
          - The short-term limit exists precisely so a line can run above the steady one for a while. What follows a trip is the urgent part.
          - The heat is real, and it is not what the protection is watching for here.
          - The protection and the short-term limit are set to work together. The danger is the next line going over its own limit.
  - title: The last few kilometres
    objective: Get customers back on in an order that can be defended afterwards.
    briefing: 11 feeders are still dead and the crews can only be in 1 place at a time.
    stake: "Thursday. The big lines are steady, but eleven local feeders are still dead. Chinelo Obi has three crews and fourteen thousand households in the dark. One of her circuits carries a dialysis clinic. Another carries a thousand homes. Today you work out why the far end of a long feeder sits low, and choose which circuit gets the first crew. Every hour of this is somebody sitting in the cold."
    takeaway: Restoration is a series of choices about people, made with instruments that only see the substation.
    stops:
      - group: DIST
        task: Work out how big the drop is, as a share.
        title: Why the far end sits low
        place: Distribution Depot
        scene: The substation end of the feeder is at its proper voltage. Customers four kilometres out are complaining. The only meter is back at the substation.
        assumes:
          - current pushing along a wire uses up some of the voltage on the way
        takeaway: A voltage measured at one end says nothing about the far end of a loaded line.
        format: BALLPARK
        question: How big is the drop, as a share of what the feeder should be?
        answerText: About a tenth of what it should be — nearly ten per cent, all of it used up along the wire.
        why: Voltage is the push, and pushing current down four kilometres of wire uses some of it up. So the far end always sits lower, and the busier the feeder the lower it goes. Here it drops about a tenth. That is enough for lights to dim and motors to labour, while the meter at the substation reads perfectly normal. The only way to know is to measure at the end.
        estimate:
          prompt: The far end sits about 1,070 volts below the substation. The feeder is supposed to run at 11,000 volts.
          question: How big is the drop, as a share of what the feeder should be?
          labels:
            - 1.07 kV (how much it drops)
            - 11 kV (what the feeder should be)
            - 310 A (the current it is carrying)
            - 4 km (how far out the customers are)
          values: [1.07, 11, 310, 4]
          slots: 2
          template: "{0} ÷ {1} × 100"
          formula: a/b*100
          correct: [0, 1]
          target: 9.7
          tolerance: 1
          units: "%"
          solution: 1.07 divided by 11 is about a tenth, so the drop is about 9.7 per cent of what the feeder should be.
          explanation: Divide by the drop instead of into it and the answer is upside down. The current and the length explain why the drop is there, and neither is part of this sum.
          givens:
            - Feeder current is 310 A
            - Resistance is 1.8 Ω and reactance is 0.9 Ω
            - Power factor is 0.95, so sin φ is 0.31
          relationship: Share = the drop ÷ what it should be × 100.
      - group: TRANS
        task: Match each observation to the limit it is about.
        title: What actually limits a wire
        place: Transmission & Protection
        scene: Novak has been asked to allow more current down a circuit for the afternoon. He wants each reason for saying no matched to the thing it is really about.
        assumes:
          - a wire warms up as current passes through it
        takeaway: Current makes the heat. Voltage decides the spacing. They are separate limits.
        format: PROTOCOL
        why: Two different limits get muddled here. Heat comes from current, and it does not care what voltage the wire is at. The insulation and the gap to anything else care about voltage, and they do not care how much current is flowing. So a circuit can sit at exactly its right voltage and still be too hot. The drop at the far end is a third thing, and it is a customer's problem rather than a safety one.
        rebuttals:
          - Heating comes from the current, and it is the same whatever voltage the wire sits at.
          - Insulation and spacing are set by voltage, and they do not care how much current flows.
          - The drop comes from current along the line, and it reaches the customer before it reaches any limit.
          - Sag is the wire getting longer as it heats. It is the one place a heat limit becomes a clearance one.
        columns:
          - What somebody has noticed
          - What it is a limit on
        scenarios:
          - The wire is at 78 degrees, on a limit of 75.
          - The circuit is on a higher voltage than it was built for.
          - Customers at the end report low voltage in the evening.
          - The span over the road has dropped a metre since morning.
        choices:
          - A heat limit, set by current and not by voltage at all.
          - An insulation limit, set by voltage and not by current.
          - A drop along the line, which is what current does over distance.
          - A clearance limit, and the one place where heat turns into safety.
        mapping: [0, 1, 2, 3]
      - group: OPS
        task: Decide which circuit gets the first crew.
        title: The order somebody will read back
        place: System Operations
        scene: Three crews, eleven dead feeders, and a list in front of Reyes that mixes household counts with a clinic and a pumping station. The phone is already ringing.
        assumes:
          - a crew can only work on one fault at a time
        takeaway: The first crew goes where waiting costs most, not where the count is biggest.
        format: CHOICE
        question: Which feeder should take the first crew?
        answerText: The clinic feeder. Waiting costs most there, and it is an hour's work, so the crew is free again for the next one.
        why: Two things decide this, and the number of households is only one. The first is what waiting costs. For a dialysis clinic that is treatments, not inconvenience. The second is how long the work takes. A one-hour job hands the crew back in time for another fault. The clinic circuit is worst on the first count and best on the second, so it goes first either way.
        choices:
          - The feeder with 4,100 households, faulted at the substation, four hours' work.
          - The clinic feeder — 180 homes, one pole, an hour's work.
          - The feeder with 2,600 households and a fault nobody has found yet.
          - The feeder to the pumping station, on standby supply.
        answer: The clinic feeder — 180 homes, one pole, an hour's work.
        rebuttals:
          - The biggest count is a four-hour job, and starting it ties a crew up for the whole shift.
          - A fault nobody has found cannot be given a time, so it cannot be lined up against the others.
          - The pumping station is running on standby. It is not off, and it can wait.
  - title: Is that number the number
    objective: Establish which readings the incident account is allowed to rest on.
    briefing: The report is due and two of the figures in it come from instruments nobody has checked.
    stake: "Friday. Tuesday night has to be written down, and Dolores Reyes wants it filed today. June Farrow will not sign it. Two of its figures come from instruments last checked in the spring. Nadia Haddad needs a machine back on the bars before the evening peak, and there is a right order for that. Today you work out what the system was really delivering, and settle an argument between two instruments. Farrow is right this time."
    takeaway: A reading is a claim about one quantity, and two instruments can disagree while both are right.
    stops:
      - group: METER
        task: Turn the power into the energy it delivered.
        title: Power for four hours
        place: Metering & Standards
        scene: Farrow has what the circuit was delivering on the night of the event, and how long it ran for. The report claims an energy figure nobody has been able to reproduce.
        assumes:
          - power says how fast energy is being delivered, and energy is what actually gets used
        takeaway: Power is a rate. Energy is what the rate delivers over time, and the bill is in energy.
        format: BALLPARK
        question: How much energy did the circuit deliver that night?
        answerText: About 22.4 megawatt hours. That is the rate multiplied by the four hours it ran.
        why: Power and energy get muddled constantly, and they are not the same thing. Power says how fast. Five and a half megawatts is a rate, like a tap running. Energy is what came out of the tap, and it depends on how long the tap was open. Four hours at 5.6 megawatts is 22.4 megawatt hours. It is the energy that gets billed, and the energy that runs out.
        estimate:
          prompt: The circuit was delivering 5.6 megawatts, and it ran for four hours.
          question: How much energy did it deliver?
          labels:
            - 5.6 MW (what it was delivering)
            - 4 hours (how long it ran)
            - 11,000 V (the voltage)
            - 310 A (the current)
          values: [5.6, 4, 11000, 310]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 22.4
          tolerance: 1.5
          units: MWh
          solution: 5.6 × 4 is 22.4 megawatt hours.
          explanation: The voltage and the current are how the power was worked out. Neither of them belongs in this sum, which is only about the rate and the hours.
          givens:
            - Line voltage is 11,000 V and line current is 310 A
            - Power factor is 0.95
            - Root 3 is about 1.732
          relationship: Energy = power × time.
      - group: GEN
        task: Put the steps of joining a machine to the grid in order.
        title: Four things that have to agree
        place: Generation Hall
        scene: Haddad has a machine at rest and a grid running normally. She wants the order written down before anybody is standing at the panel with a hand on the switch.
        assumes:
          - a generator joined to a live grid is forced to turn at the grid's speed
        takeaway: Every mismatch gets removed before the switch closes, and there is only one order that works.
        format: SEQUENCE
        why: Closing that switch ties the machine to the whole grid, and the grid does not adjust. So every difference has to go first. Speed first, because a machine turning at the wrong speed gets slammed into step, hard enough to damage it. Voltage next, or current pours between them for no useful reason. Then wait for the two waves to line up. Close them when all three match, and the machine simply joins in.
        cards:
          - Bring the machine up to the grid's speed.
          - Match its voltage to the grid's.
          - Wait until the two waves line up.
          - Close the switch.
        order: [0, 1, 2, 3]
      - group: TRANS
        task: Say how the two readings should relate if both are right.
        title: Two instruments, two numbers
        place: Transmission & Protection
        scene: A scope on the busbar shows the voltage peaking at 325 volts. The panel meter beside it reads 230. Both were checked last month and neither has been touched.
        assumes:
          - an alternating voltage rises and falls, over and over, rather than sitting still
        takeaway: An alternating voltage has no single value, so the number quoted has to say which one it is.
        format: CHOICE
        question: Which relation should hold if both instruments are right?
        answerText: The peak is about 1.4 times the meter's reading. Both are right, and they are quoting different things about the same voltage.
        why: An alternating voltage is never one number. It rises to a peak, falls back through zero, and does the same the other way, fifty times a second. The scope shows the highest it reaches. The meter shows the steady voltage that would do the same work — heat the same kettle in the same time. For this shape of wave the peak sits about one and a half times higher, and 325 against 230 is exactly that. Two instruments, one voltage.
        choices:
          - The peak is about 1.4 times the meter's number.
          - The peak is about twice the meter's number.
          - The meter's number is about 1.4 times the peak.
          - The meter's number is about half the peak.
        answer: The peak is about twice the meter's number.
        rebuttals:
          - Twice would make the peak 460, and the scope is showing 325.
          - The meter reads lower than the peak, so multiplying it the other way goes in the wrong direction.
          - Half of 325 is about 163, which is not what the meter is showing.
  - title: Enough in the tank
    objective: Decide what the system is holding back, and whether it is enough.
    briefing: Tomorrow's peak is colder than the forecast the reserve was set against.
    stake: "Monday. The forecast for tomorrow's evening peak has moved four degrees colder. Sten Lindgren says the middle has hardly changed, but the width has, and the width is what the reserve must cover. Rafael Alvarez has weekend storage figures that are worse than the brochure. Today you work out what the battery will really give back, and decide what is worth finding out before the peak. Hold too little back and Thursday happens again."
    takeaway: A reserve is bought with something, and the argument is always about how much uncertainty it has to cover.
    stops:
      - group: LOAD
        task: Work out what share of the stored energy comes back.
        title: What comes out against what went in
        place: Load & Forecasting
        scene: The battery charged overnight on Saturday and gave it back into Sunday's peak. Alvarez has both totals and the brochure figure, and the three do not agree.
        assumes:
          - putting energy into a store and taking it out again both waste some of it
        takeaway: What a store is worth is the share that comes back, not the size on the label.
        format: BALLPARK
        question: What share of the energy put in comes back out?
        answerText: About 85 per cent. Fifteen per cent of everything put in never comes back out.
        why: Nothing stores energy for free. Some is lost going in, some coming out, and some keeping the thing cool while it sits there. So the number that matters is simply what came out divided by what went in. Here that is 187 out of 220, which is about eighty-five per cent. Fifteen per cent of everything that went in never came back. The power rating on the label is a different claim. It says how fast, not how much.
        estimate:
          prompt: The store took in 220 megawatt hours overnight, and gave back 187 into Sunday's peak.
          question: What share of the energy put in comes back out?
          labels:
            - 187 MWh (what came back out)
            - 220 MWh (what went in)
            - 50 MW (the power rating)
            - 4 h (how long it can run for)
          values: [187, 220, 50, 4]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 0.85
          tolerance: 0.03
          units: fraction
          solution: 187 ÷ 220 is 0.85, or 85 per cent.
          explanation: The rating and the hours describe how the store behaves. Multiply them together and you get a number that has nothing to do with this question.
          givens:
            - Energy in was 220 MWh
            - Energy returned was 187 MWh
          relationship: Share = energy out ÷ energy in.
      - group: GEN
        task: Say what raising the voltage does to the current and the waste.
        title: Why the wires are not at wall voltage
        place: Generation Hall
        scene: A visitor asks Haddad why the machine makes power at twenty thousand volts and the line outside runs at four hundred thousand.
        assumes:
          - for the same power, a higher voltage means less current
        takeaway: The same power can be delivered in more than one way, and the ways waste very different amounts.
        format: CHOICE
        question: For the same power, what happens when the voltage is raised twenty times?
        answerText: The current falls twenty times, and the waste in the wires falls four hundred times, because it depends on the current twice over.
        why: Power is the push multiplied by the flow. So for the same power, a bigger push needs less flow. Raise the voltage twenty times and the current falls to a twentieth. The waste in the wires depends on the current twice over, so a twentieth of the current wastes four hundred times less. That is why long lines run at enormous voltages. The insulation is harder and more expensive, and the saving is far bigger.
        choices:
          - The current falls twenty times, and the waste falls four hundred times.
          - The current falls twenty times, and the waste falls twenty times.
          - The current stays the same, and only the insulation changes.
          - The current rises twenty times, and the waste rises four hundred times.
        answer: The current falls twenty times, and the waste falls twenty times.
        rebuttals:
          - For the same power, current falls as voltage rises. The waste then falls faster still, because it depends on the current twice over.
          - The insulation does get harder, and the reason for doing it is the enormous drop in current and waste.
          - Raising the voltage for the same power lowers the current. It does not raise it.
      - group: OPS
        task: Spend the budget on what could change tonight's decision.
        title: What is worth knowing before the peak
        place: System Operations
        scene: Reyes has a small budget and four things she could find out before the evening peak. Only some of them would change what she does about the reserve.
        assumes:
          - reserve is held against what nobody knows, rather than against the forecast itself
        takeaway: A measurement is worth buying when its answer could still change what you do.
        format: VALUE
        question: Which measurements are worth buying before six o'clock?
        value:
          hint: You have five evidence credits. Buy results that can still change the 18:00 reserve decision; every option shows what you would learn after purchase.
          budget:
            amount: 5
          decision: Set the reserve carried into the 18:00 peak.
          options:
            - id: cold-sensitivity
              label: Re-estimate the last degree of cold from this winter
              cost: 3
              axis: load uncertainty
              decisive: true
              reveals: The last degree adds 210 MW, not 120 MW; the forecast width must be widened before 18:00.
            - id: store-test
              label: Test the ridge store at the intended peak discharge rate
              cost: 2
              axis: reserve deliverability
              decisive: true
              reveals: The store returns about 85% over the cycle at this rate, so its credited energy is lower than the brochure case.
            - id: machine-repeat
              label: Repeat the autumn frequency-response test
              cost: 2
              axis: generator response
              decisive: false
              reveals: The machine repeats its autumn response within measurement scatter; tonight’s reserve plan does not move.
            - id: feeder-survey
              label: Commission a full feeder-demand survey
              cost: 4
              axis: spatial demand
              decisive: false
              reveals: The survey would refine feeder planning, but the result arrives in six weeks and cannot affect tonight.
        answerText: Buy this winter's cold-and-demand figures, and the store tested at the rate it would really be used. Both can still change tonight.
        why: Reserve is held against two things. How wrong the demand forecast could be, and whether the things being counted on can actually deliver. Measuring how this winter's cold has been driving demand narrows the first. Testing the store at the rate it would really be called on settles the second. Repeating a generator test that is already valid buys reassurance. A survey that lands in six weeks cannot change tonight, however good it is.
  - title: 80 milliseconds
    objective: Establish what a fault does before anybody can respond to it.
    briefing: A cable failed at the substation and the protection cleared it before the alarm reached the room.
    stake: "Wednesday. A cable failed inside the substation at twenty to two. The protection cleared it in under a tenth of a second, so nobody in the control room saw the fault — only the aftermath. Piotr Novak wants the fault current worked out before he signs the switchgear back into service. Ewa Kowalczyk has a crew at the gate. Today you size the fault, and decide who may go near it."
    takeaway: A fault is limited only by impedance, which is why the numbers are enormous and the times are tiny.
    stops:
      - group: TRANS
        task: Work out the current the fault drew.
        title: What a short circuit is limited by
        place: Transmission & Protection
        scene: The cable failed and shorted to earth. The push behind it is 6,350 volts, and the whole path back to the source resists 0.42 ohms. Novak wants the current the switchgear had to break.
        assumes:
          - a short circuit is a path with almost nothing in the way
        takeaway: A fault current is set by the path back to the source, and by nothing else.
        format: BALLPARK
        question: How much current flowed during the fault?
        answerText: About fifteen thousand amps — roughly fifty times the normal load, because the fault goes around everything that usually limits it.
        why: Normally the current is set by whatever is drawing power at the far end. A short circuit goes round all of that. So the only things left holding it back are the wire and the machinery behind it. Push divided by resistance is fifteen thousand amps, about fifty times the normal load. That is why switchgear has its own rating for breaking a fault.
        estimate:
          prompt: The push at the fault is 6,350 volts, and the whole path back to the source resists 0.42 ohms.
          question: How much current flowed during the fault?
          labels:
            - 6,350 V (the push at the fault)
            - 0.42 Ω (what the path resists)
            - 310 A (the normal load)
            - 0.08 s (how long it took to clear)
          values: [6350, 0.42, 310, 0.08]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 15119
          tolerance: 1500
          units: A
          solution: 6,350 ÷ 0.42 is about 15,000 amps.
          explanation: The normal load does not limit a fault, because the fault has gone round it. The clearing time decides how much damage it does, not how big it gets.
          givens:
            - Phase voltage is 6,350 V
            - Impedance back to the source is 0.42 Ω
          relationship: Current = the push ÷ what resists it.
      - group: METER
        task: Change one thing at a time, and find what makes the signal appear.
        title: A reading with no connection
        place: Metering & Standards
        scene: June Farrow has a safe low-voltage test rig beside the yard diagram. It shows the current going in, the signal coming out, and a core she can open. She wants a cause rather than a definition.
        assumes:
          - a changing magnetic field can make a voltage appear in a nearby coil
        takeaway: What makes a signal appear here is change. A steady current makes a field and no signal.
        format: CONTROL
        question: Which change makes the signal disappear, and does it come back when you undo it?
        control:
          hint: Change one control at a time and run the test. To commit a cause, remove the suspect while the other controls stay fixed, then restore it and confirm the response returns.
          noise: 0.05
          baseline: 5
          observable:
            label: Reading
            unit: A secondary
          response: -4.95
          truth: waveform
          variables:
            - id: waveform
              label: Primary current waveform
            - id: primary-current
              label: Primary current
            - id: core-path
              label: Magnetic core path
        answerText: The kind of current. Alternating gives about 5 amps out. Steady drops it to nearly nothing, and switching back brings it straight to 5.
        why: There is no wire between the two sides of this device. What crosses is a magnetic field, made by the current going in. A field on its own does nothing to the coil. It has to be changing. Alternating current changes direction fifty times a second, so a signal appears. Steady current makes a steady field and nothing else.
      - group: DIST
        task: Say what has to happen before the crew touches the conductor.
        title: Isolated is not yet safe
        place: Distribution Depot
        scene: The cable is cut off at both ends and a tester reads dead at the work point. Kowalczyk stops the crew, because one step is still missing. There is live equipment nearby.
        assumes:
          - a conductor can be brought back to life from more than one direction
        takeaway: Isolating and testing say what is true now. Earthing keeps it true.
        format: CHOICE
        question: What has to happen after isolating and testing dead?
        answerText: Earth it at the point of work. Isolating and testing say it is dead now. Earthing is what keeps it dead if something changes.
        why: Isolating and testing answer different questions, and neither answers the one that matters. Opening both ends removes the sources anybody knows about. The tester says it is dead now. Neither promises it stays dead if somebody switches something. Earthing gives any surprise somewhere easy to go, instead of through a person. It turns a fact into a condition.
        choices:
          - Earth the conductor at the point of work.
          - Repeat the dead test every five minutes while they work.
          - Leave it unearthed, so any surprise voltage still shows on a tester.
          - Close a switch briefly, to prove the protection would trip.
        answer: Earth the conductor at the point of work.
        rebuttals:
          - Repeating the test is a series of snapshots. An earth makes a surprise survivable rather than merely visible.
          - An unearthed conductor can be pushed to a dangerous voltage by the lines beside it.
          - Deliberately putting power back into the work area is not a test. The order is isolate, prove dead, earth.
  - title: Merit order
    objective: Decide what runs tomorrow, and what is held back for the day it is needed.
    briefing: The cheapest generation is on the ridge and it will not say what it is doing after four.
    stake: "Thursday. Tomorrow has to be bought tonight. Sten Lindgren has a peak that moves with the temperature and a width he will not narrow. Mina Sarraf has a ridge that will produce almost nothing for money and cannot promise any of it. Nadia Haddad has expensive machines that do exactly as they are told. Today you forecast the peak, and decide what cheapest-first really means when the cheapest plant is the least certain."
    takeaway: Dispatch orders plant by cost, and the value of certainty is what stops that being the whole story.

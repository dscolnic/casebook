        task: Put the steps of joining a machine to the grid in order.
        title: Three things that have to agree
        concept: A generator turns motion into electricity, and a magnet is how
        place: Generation Hall
        scene: Haddad has a machine at rest and a grid running normally. She wants the order written down before anybody is standing at the panel with a hand on the switch.
        guide: >-
          All three of these happen at the panel, so nothing is missing from the list.
          Ask of each what difference it removes. Then ask what that difference would do
          if the switch closed while it was still there. A speed difference and a
          voltage difference break things in different ways. One of these three only
          works once the others are right.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim that each step needs the
              one before it to have happened. Get one pair the wrong way round and the claim
              is wrong, even if everything else lines up. That is why there is no part
              credit.
          - >-
              Why the ends are the place to start. The first and last steps are usually the
              easiest to be sure of, because one has nothing before it and the other has
              nothing after it. Fixing those two leaves fewer ways for the middle to go, and
              the middle is where the real question usually is.
          - >-
              What the rail can be ordered on. Often it is time. It can also be cost, or
              risk, or what you can still undo afterwards — do the steps that change nothing
              before the ones that change something for good. A step that destroys the
              sample can only be last.
        assumes:
          - a generator joined to a live grid is forced to turn at the grid's speed
        takeaway: Every mismatch gets removed before the switch closes, and there is only one order that works.
        format: SEQUENCE
        why: Closing that switch ties the machine to the whole grid, and the grid does not adjust. So every difference has to go first. Speed first, because a machine turning at the wrong speed gets slammed into step, hard enough to damage it. Voltage next, or current pours between them for no useful reason. Then wait for the two waves to line up. Close them when all three match, and the machine simply joins in.
        cards:
          - Bring the machine up to the grid's speed.
          - Match its voltage to the grid's.
          - Wait until the two waves line up.
        order: [0, 1, 2]

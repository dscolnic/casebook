glossary:
  - name: Accumulation
    aliases:
      - accumulate
      - accumulates
      - accumulated
    def: How much snow is added to the surface in a year, after wind and sublimation have had their say.
  - name: Ice equivalent
    aliases:
      - water equivalent
    def: A snow thickness converted to the thickness of solid ice it will become, so two sites can be compared.
  - name: Annual layer
    aliases:
      - annual layers
      - layer counting
      - layer count
    def: One year of snowfall, recognisable in the core because summer and winter snow differ.
  - name: Ice
    def: Snow compressed until the air between its grains is sealed off, at about 917 kilograms per cubic metre.
  - name: Calibration
    aliases:
      - calibrate
      - calibrated
      - calibration slope
    def: Measuring an instrument or a relationship against something already known, so its numbers can be trusted.
  - name: Firn
    aliases:
      - firn column
    def: The layer of snow between the surface and solid ice, still open enough for air to move through it.
  - name: Close-off depth
    aliases:
      - close-off
      - closes off
      - closed off
    def: The depth where firn stops letting air through, 60 to 100 metres down, and the trapped air becomes separate bubbles.
  - name: Delta age
    aliases:
      - Δage
      - gas age
      - ice age difference
    def: The difference between the age of a bubble's air and the age of the ice around it, because the air kept moving until close-off.
  - name: Precipitation
    aliases:
      - precipitates
      - precipitated
    def: Snow or rain falling out of the air onto the surface. On this plateau it is almost always snow.
  - name: Proxy
    aliases:
      - proxies
    def: Something measurable that stands in for something that was not measured, through a chain somebody has to be able to state.
  - name: Isotope ratio
    aliases:
      - delta-18
      - oxygen-18
      - deuterium
      - isotopic
    def: How much heavy oxygen or hydrogen the ice holds compared with ocean water, reported as a difference in parts per thousand.
  - name: Thinning
    aliases:
      - thinned
      - thins
    def: The stretching of every layer as the ice sheet spreads under its own weight, so old layers are thinner than they fell.
  - name: Depth-age scale
    aliases:
      - depth–age
      - age scale
      - timescale
    def: The table that turns a depth in the core into a year, built by counting layers and anchored to dated events.
  - name: Tie point
    aliases:
      - tie points
      - tied to
    def: An event of known date found in two records, which fixes them to each other at that moment.
  - name: Sulphate horizon
    aliases:
      - sulphate
      - sulfate
      - volcanic horizon
    def: A thin band of volcanic sulphur in the ice, laid down within a year or two of a known eruption.
  - name: Tephra
    aliases:
      - ash layer
    def: Volcanic glass shards in the ice, which can be chemically matched to the volcano that produced them.
  - name: Diffusion length
    aliases:
      - diffusion
      - diffuses
    def: How far a water molecule wanders in the firn before the ice seals, which smooths away anything thinner than about twice that distance.
  - name: Brittle ice
    aliases:
      - brittle zone
    def: The depth range where trapped bubbles are at high pressure and the core fractures as it is brought up.
  - name: Blank
    aliases:
      - blank run
      - blanks
    def: A run with no sample in it. Anything it shows was added by the process rather than measured from the ice.
  - name: Chain of custody
    aliases:
      - custody
    def: The unbroken written record of who held a sample and when, which is what makes a measurement attributable to a depth.
  - name: Radiative forcing
    aliases:
      - forcing
    def: The change in the energy balance at the top of the atmosphere caused by a change in a greenhouse gas, in watts per square metre.
  - name: Standard error
    aliases:
      - standard errors
    def: How far an average is expected to sit from the truth, given the scatter in the data and how many years went into it.
  - name: Replicate core
    aliases:
      - replicate
      - replicates
    def: A second core drilled nearby, so a feature can be checked against ice that shared the weather but not the drill.

# The campaign: one working day each, three stops and a callback from day 3.

missions:
# 15 mission fragment(s), assembled by tools/assemble-book.mjs from
# whiteout/ — edit the fragments, not this file.
# ============================================================ MISSION 1
# Lifted from ../fpl_gpt/WHITEOUT_AP_Computer_Science_A_Campaign_Implementation_Bible_v2.10_HAND_BACK_3.md by tools/v10extract.mjs. Every quoted string below is
# the bible's, verbatim; engine/dev/bibleParity.mjs holds it to that.
- title: "# Mission 1 — THE HEAT THAT ISN'T GONE"
  card:
    header: "RESCUE WINDOW — ABOUT 36 HOURS REMAIN"
    title: "THE HEAT THAT ISN'T GONE"
    goNow: "Go to Power & Thermal Plant and meet Malik Okafor, power and thermal engineer, at the Load Board."
    body: "The whiteout has cut Aster Station off, and the first heat alarm is red. The controller turns whole-number power readings into a percentage before deciding whether to warn the crew. At the Power & Thermal Plant, trace and test that calculation before anyone shuts down a healthy generator. By the end of the mission, decide whether the generator is failing or the percentage code is wrong."
    objective: "Gather enough code and station evidence to decide whether the generator is actually under-delivering heat or the controller is calculating the percentage incorrectly."
  objective: "Gather enough code and station evidence to decide whether the generator is actually under-delivering heat or the controller is calculating the percentage incorrectly."
  stake: "The whiteout has cut Aster Station off, and the first heat alarm is red. The controller turns whole-number power readings into a percentage before deciding whether to warn the crew. At the Power & Thermal Plant, trace and test that calculation before anyone shuts down a healthy generator. By the end of the mission, decide whether the generator is failing or the percentage code is wrong."
  takeaway: "The generator is healthy; integer arithmetic is collapsing 83/100 to zero and falsely creating the heat emergency. ---"
  segue: "Mission decision: The generator is healthy. Java made 83/100 equal 0 with whole-number math. The steady 83 kW reading shows the machine still works. The crew keeps it online and fixes the percent code. Habitat Control then shows two commands from one sensor reading."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "integer division", def: "division between two integers that discards the fractional part before any later conversion. cast: an explicit conversion that changes how Java treats a value for an expression."}
  - {name: "Boolean expression", def: "a comparison or logical test whose value is true or false."}
  equations:
  - {"e":"percent = 100.0 × delivered / requested","c":"turn delivered power into a percentage of requested power.","v":[["delivered","measured power"],["requested","requested power"],["percent","calculated percentage"]],"s":"the first alarm is generated from this relationship."}
  primer:
  - "Java evaluates arithmetic from the actual operand types, not from the type you wish the result had."
  - "A controller alarm is evidence only if its calculation agrees with an independent physical reading."

  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Worked examples"
    examples:
    - {"title":"Integer division","problem":"With int a = 7; int b = 2;, Java evaluates a / b as 3. The .5 is discarded because both operands are integers.","rule":"","steps":[],"answer":"","mistake":""}
    - {"title":"Cast before division","problem":"(double) 7 / 2 becomes 7.0 / 2, so the result is 3.5. Casting after 7 / 2 would only turn the already-truncated 3 into 3.0.","rule":"","steps":[],"answer":"","mistake":""}
    - {"title":"Percentage","problem":"If 45 items out of 60 are complete, 100.0 * 45 / 60 = 75.0. Using 45 / 60 * 100 with integers gives 0 instead.","rule":"","steps":[],"answer":"","mistake":""}
    - {"title":"Assignment","problem":"int x = 4; x = x + 3; leaves x equal to 7. Java evaluates the right side using the old value, then stores the result.","rule":"","steps":[],"answer":"","mistake":""}
    - {"title":"Boolean comparison","problem":"If double p = 75.0;, then p < 70.0 is false and p >= 70.0 is true.","rule":"","steps":[],"answer":"","mistake":""}

  stops:
  # --- Stop 1: Trace the controller
  #     Concept: 3 — Expressions, arithmetic, precedence, and output; Keystone: Data quality & representation, State & assignment; Area: POWER; Prerequisites: None — this is the first graded code trace.; Learning role: INTRODUCE; Difficulty: L2; Story role: clue.
  #     placement: CHOICE, Malik Okafor at the Load Board.
  - group: POWER
    at: load-board
    title: "Trace the controller"
    concept: 3   # Expressions, arithmetic, precedence, and output
    reason: "Malik needs the displayed percentage explained before he shuts down a generator that still sounds normal."
    scene: "The Load Board shows delivered = 83, requested = 100, and the alarm code delivered / requested * 100, while fuel flow and exhaust stay normal. Determine the integer expression's output before the crew decides whether the red percentage reflects the generator."
    motivation: "If the arithmetic itself produces the alarm value, the physical generator should stay online while the software path is investigated."
    format: CHOICE
    question: "Read the three displayed lines, trace the expression exactly as Java evaluates it, and submit the stored value of percent."
    choices:
      - "0"
      - "83"
      - "100"
      - The code does not compile
    answer: "0"
    answerText: "Java performs 83 / 100 as integer division first, giving 0; 0 * 100 remains 0."
    why: "Equal-precedence multiplication and division are evaluated left to right, and both operands are integers."
    # wrong-path feedback, one rebuttal per wrong option:
    #   83 assumes the fractional 0.83 survives integer division. 100 treats requested power as the result rather than an operand. Compile error ignores that every token is valid Java.
    # correct result: percent stores 0.
    # state/output: The Load Board adds SOFTWARE VALUE = 0; PHYSICAL OUTPUT UNCHANGED beside the alarm.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   question: "What value does Java store in percent?"
    #   code: |
    #     int delivered = 83;
    #     int requested = 100;
    #     int percent = delivered / requested * 100;
    #   choices:
    #     - "0"
    #     - "83"
    #     - "100"
    #     - "The code does not compile"
    #   answer: "0"
    #   why: "83 / 100 is integer division, so Java evaluates it as 0 before multiplying by 100."
    #   rebuttals:
    #     "83": "That would require multiplying before the integer division or converting first; Java evaluates left to right at the same precedence."
    #     "100": "No operation in this expression can turn 83 into the full requested amount."
    #     "The code does not compile": "All variables and operations are valid int operations, so the code compiles."
    rebuttals:
      - That would require multiplying before the integer division or converting first; Java evaluates left to right at the same precedence.
      - No operation in this expression can turn 83 into the full requested amount.
      - All variables and operations are valid int operations, so the code compiles.
    code: |
      int delivered = 83;
      int requested = 100;
      int percent = delivered / requested * 100;

  # --- Stop 2: Preserve the fraction
  #     Concept: 5 — Casting, integer division, numeric range, and overflow awareness; Keystone: Data quality & representation, State & assignment; Area: POWER; Prerequisites: Retrieves Stop 1's expression order immediately as practice, not delayed retrieval.; Learning role: PRACTICE; Difficulty: L2; Story role: obstacle.
  #     placement: DERIVE, Power & Thermal Plant — Load Board.
  - group: POWER
    at: load-board
    title: "Preserve the fraction"
    concept: 5   # Casting, integer division, numeric range, and overflow awareness
    reason: "Stop 1 proved the integer expression collapses before multiplication, so the crew needs a repair that preserves the 0.83 fraction."
    scene: "Stop 1 produced 0 even though 83 of 100 kilowatts are being delivered, proving the fraction disappears before the percentage is formed. Build the corrected expression so Java performs real-number division before the result is multiplied by 100."
    motivation: "A correct cast should predict 83.0 percent without changing any physical generator setting."
    format: DERIVE
    question: "Build the repaired calculation one line at a time; choose exactly one line at each step."
    answerText: "Casting one operand before division changes the operation to floating-point division, so 83/100 becomes 0.83 and then 83.0 percent."
    why: "The cast must occur before the division; casting the already-truncated result cannot recover discarded information."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Leaving both operands as int recreates the zero from Stop 1. Casting fraction back to int discards 0.83 before the multiplication.
    # correct result: double fraction = (double) delivered / requested; then double percent = fraction * 100.0;, producing 83.0.
    # state/output: The Load Board displays a white PREDICTED 83.0% tag beside the unrepaired alarm code.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:
    #     start: "int delivered = 83; int requested = 100;"
    #     goal: "percent as a double, starting from integer inputs"
    #     steps:
    #       - id: cast
    #         prompt: "Choose the division that preserves the fraction."
    #         choices:
    #           - {line: "double fraction = (double) delivered / requested;", correct: true}
    #           - {line: "double fraction = (double) (delivered / requested);", correct: false, survives: true, why: "The parentheses force integer division first, so the fraction is already lost before the cast to double."}
    #       - id: percent
    #         prompt: "Choose the percentage expression."
    #         choices:
    #           - {line: "double percent = fraction * 100.0;", correct: true}
    #           - {line: "double percent = (int) fraction * 100.0;", correct: false, survives: true, why: "Casting fraction back to int discards its fractional part before multiplying and recreates the whole-number loss."}
    derive:
      start: int delivered = 83; int requested = 100;
      goal: percent as a double, starting from integer inputs
      steps:
        - ask: Choose the division that preserves the fraction.
          answer: 0
          candidates:
            - text: double fraction = (double) delivered / requested;
            - text: double fraction = (double) (delivered / requested);
              why: The parentheses force integer division first, so the fraction is already lost before the cast to double.
              survives: true
        - ask: Choose the percentage expression.
          answer: 0
          candidates:
            - text: double percent = fraction * 100.0;
            - text: double percent = (int) fraction * 100.0;
              why: Casting fraction back to int discards its fractional part before multiplying and recreates the whole-number loss.
              survives: true

  # --- Stop 3: Store the repaired value
  #     Concept: 2 — Primitive variables and data types; Keystone: State & assignment; Area: POWER; Prerequisites: Uses the repaired numeric value from Stop 2.; Learning role: PRACTICE; Difficulty: L2; Story role: character.
  #     placement: CHOICE, Malik Okafor at the Load Board.
  - group: POWER
    at: load-board
    title: "Store the repaired value"
    concept: 2   # Primitive variables and data types
    reason: "Malik needs the corrected percentage stored without turning it back into an integer before the alarm comparison runs."
    scene: "The repaired expression now produces 83.0, but the controller field receiving it is still declared with the old whole-number type. Choose the declaration and assignment that keep the fractional-capable result intact for later comparisons and logging."
    motivation: "The repaired arithmetic only matters if assignment preserves the type and value that the next alarm test will read."
    format: CHOICE
    question: "Select the declaration that stores the repaired numeric percentage for the alarm comparison."
    choices:
      - double percent = 83.0;
      - int percent = (int) 83.0;
      - boolean percent = true;
      - String percent = "83.0%";
    answer: double percent = 83.0;
    answerText: "The controller needs a numeric type that can store a decimal result and participate directly in later numeric tests."
    why: "Assignment stores the evaluated right-hand value in a variable whose declared type must support that value and its later use."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Casting to int discards numeric precision. Boolean cannot represent the percentage. String changes the value into text.
    # correct result: double percent = 83.0;.
    # state/output: Malik's panel replaces int percent with double percent in the pending patch.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   question: "Which replacement safely stores the repaired percentage?"
    #   choices:
    #     - "double percent = 83.0;"
    #     - "int percent = (int) 83.0;"
    #     - "boolean percent = true;"
    #     - "String percent = \"83.0%\";"
    #   answer: "double percent = 83.0;"
    #   why: "A double stores the numeric 83.0 directly and remains usable in numeric comparisons."
    #   rebuttals:
    #     "int percent = (int) 83.0;": "This converts the result back to an integer and recreates a type mismatch with the repaired calculation."
    #     "boolean percent = true;": "A Boolean stores true/false, not the measured percentage."
    #     "String percent = \"83.0%\";": "A String is display text and cannot be compared numerically without another parse step."
    rebuttals:
      - This converts the result back to an integer and recreates a type mismatch with the repaired calculation.
      - A Boolean stores true/false, not the measured percentage.
      - A String is display text and cannot be compared numerically without another parse step.

  # --- Stop 4: Authorize the generator
  #     Concept: 11 — Boolean expressions and relational operators; Keystone: Boolean logic, Debugging & tests; Area: POWER; Prerequisites: Combines the arithmetic, type, and assignment work of Stops 1–3.; Learning role: COMBINE; Difficulty: L3; Story role: decision.
  #     placement: VERIFY, Generator Controller.
  - group: POWER
    at: generator-controller
    title: "Authorize the generator"
    concept: 11   # Boolean expressions and relational operators
    reason: "The generator may stay online only if the repaired percentage predicts the alarm state and a controlled run matches that prediction."
    scene: "Stops 1–3 predict percent = 83.0 from unchanged 83 kW delivery and a 100 kW request, while the physical generator remains steady. Commit the repaired percentage before the isolated calculation reveals what the controller actually computes."
    motivation: "Agreement between the committed Boolean prediction and the isolated run can clear the generator without pretending 83 percent is full output."
    format: VERIFY
    question: "PREDICT AND COMMIT: dial the repaired calculated percentage. OPERATE: run the isolated controller calculation. MEASURE: reveal the calculated percent. INTERPRET: combine that measurement with the steady 83 kW delivery and submit KEEP ONLINE or SHUT DOWN."
    answerText: "The calculation and Boolean threshold now agree with the independent physical reading, so the alarm was software-generated rather than evidence of generator collapse."
    why: "A Boolean comparison should be evaluated from the repaired numeric state, and verification requires a prediction before the test result is revealed."
    # wrong-path feedback, one rebuttal per wrong option:
    #   SHUT DOWN ignores the independent 83 kW reading and the false threshold result. Predicting true treats 83 as below 70. Predicting 0% repeats the integer-division bug already repaired.
    # correct result: 83%; KEEP ONLINE.
    # state/output: The Generator Controller changes from HEAT EMERGENCY to OUTPUT 83 kW / SOFTWARE ALARM CLEARED.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   verify:
    #     prediction_prompt: "Commit the percentage the repaired controller will compute before RUN unlocks."
    #     predictionRange: {min: 0, max: 100, step: 1, unit: "%"}
    #     truth: 83
    #     measurement:
    #       label: "calculated percent"
    #       cost: 1
    #     correct_action: "Keep the generator online and repair the percentage code."
    #     answerText: "The repaired controller computes 83.0%, so percent < 70.0 is false while the generator continues delivering 83 kW."
    verify:

    # correct result: 25 regression, 25 rollback, 20 relay, 30 canary, 0 full restart.
    # state/output: The Rescue Board displays four release gates and crosses out FULL RESTART.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   proposals:
    #     - {id: regression, label: "Regression suite", max: 25}
    #     - {id: rollback, label: "Backward rollback readiness", max: 25}
    #     - {id: relay, label: "Independent rover relay", max: 20}
    #     - {id: canary, label: "Canary monitoring", max: 30}
    #     - {id: restart, label: "Immediate full restart", max: 100}
    #   recommended:
    #     regression: 25
    #     rollback: 25
    #     relay: 20
    #     canary: 30
    #     restart: 0
    #   evidence:
    #     - "Mission 14: forward rollback fails 0/5 holdout cases."
    #     - "Mission 13: rover relay is an independent command path."
    #     - "Mission 8: regression preserves the exact adjacent-record failure."
    #     - "A canary limits the first live change to one controller."
    #   constraints:
    #     - "Allocate exactly 100 release points."
    #     - "Preserve a verified rollback path."
    #     - "Keep an independent command path active."
    #     - "Limit the first live change to one controller."
    #   answerText: "Fund regression, backward rollback, relay, and canary monitoring; spend nothing on the irreversible full restart."
    proposals:
      - id: regression
        label: Regression suite
        max: 25
      - id: rollback
        label: Backward rollback readiness
        max: 25
      - id: relay
        label: Independent rover relay
        max: 20
      - id: canary
        label: Canary monitoring
        max: 30
      - id: restart
        label: Immediate full restart
        max: 100
    recommended:
      Regression suite: 25
      Backward rollback readiness: 25
      Independent rover relay: 20
      Canary monitoring: 30
      Immediate full restart: 0
    evidence:
      - "Mission 14: forward rollback fails 0/5 holdout cases."
      - "Mission 13: rover relay is an independent command path."
      - "Mission 8: regression preserves the exact adjacent-record failure."
      - A canary limits the first live change to one controller.
    constraints:
      - Allocate exactly 100 release points.
      - Preserve a verified rollback path.
      - Keep an independent command path active.
      - Limit the first live change to one controller.

  # --- Stop 58: Prove the rollback traversal
  #     Concept: 29 — ArrayList methods, traversals, mutation, and algorithms; Keystone: Collections & indexing, Methods & abstraction; Area: CODE; Prerequisites: Transfers the collection bug first introduced in Mission 8 and reversed in Mission 14.; Learning role: TRANSFER; Difficulty: L5; Story role: payoff.
  #     placement: DERIVE, Software Lab — Code Review Wall.
  - group: CODE
    at: code-review-wall
    title: "Prove the rollback traversal"
    concept: 29   # ArrayList methods, traversals, mutation, and algorithms
    reason: "The staged plan cannot start until backward ArrayList removal is encoded as the exact mechanism that survived the holdout and stress tests."
    scene: "The rollback must inspect controller records from the final valid index down to zero and remove a record only when it is resolved. Build the loop and choose the statement explaining why removal cannot skip a lower unvisited index."
    motivation: "The final code must express the proven mechanism, not merely carry a label saying backward traversal is safer."
    format: DERIVE
    question: "Build the rollback loop line by line and choose the explanation that proves descending traversal does not skip records."
    answerText: "Removal can shift higher positions, but those positions have already been processed; lower indexes still refer to the same unvisited records."
    why: "This is an algorithm proof over a class of list states rather than a memorized fix for one example."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Forward traversal recreates the Mission 8 skip. remove(i+1) targets the wrong record and can exceed bounds. Higher indexes may shift; they simply no longer matter.
    # correct result: Descending loop; remove(i); lower unvisited indexes remain valid.
    # state/output: The Code Review Wall changes rollback status to MECHANISM VERIFIED.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:
    #     start: "records contains open and resolved entries; remove each resolved entry while traversing the ArrayList by index."
    #     goal: "remove every resolved record without skipping a neighbor that shifts after deletion"
    #     steps:
    #       - id: header
    #         prompt: "Choose the loop header."
    #         choices:
    #           - {line: "for (int i = records.size()-1; i >= 0; i--) {", correct: true}
    #           - {line: "for (int i = 0; i <= records.size()-1; i++) {", correct: false, survives: true, why: "Forward traversal combines index growth with left-shifting elements after removal, which can skip a resolved neighbor."}
    #       - id: remove
    #         prompt: "Choose the removal line."
    #         choices:
    #           - {line: "if (records.get(i).isResolved()) records.remove(i);", correct: true}
    #           - {line: "if (records.get(i).isResolved()) records.remove(i+1);", correct: false, survives: true, why: "The test examines record i, so removing i+1 deletes a different record and can also exceed the list bounds."}
    #       - id: reason
    #         prompt: "Choose why descending removal does not skip work."
    #         choices:
    #           - {line: "removing i cannot change any lower index still to be visited", correct: true}
    #           - {line: "removing i preserves every higher index that has not been visited yet", correct: false, survives: true, why: "In a descending traversal the higher indexes have already been visited; lower unvisited indexes stay unchanged."}
    derive:
      start: records contains open and resolved entries; remove each resolved entry while traversing the ArrayList by index.
      goal: remove every resolved record without skipping a neighbor that shifts after deletion
      steps:
        - ask: Choose the loop header.
          answer: 0
          candidates:
            - text: for (int i = records.size()-1; i >= 0; i--) {
            - text: for (int i = 0; i <= records.size()-1; i++) {
              why: Forward traversal combines index growth with left-shifting elements after removal, which can skip a resolved neighbor.
              survives: true
        - ask: Choose the removal line.
          answer: 0
          candidates:
            - text: if (records.get(i).isResolved()) records.remove(i);
            - text: if (records.get(i).isResolved()) records.remove(i+1);
              why: The test examines record i, so removing i+1 deletes a different record and can also exceed the list bounds.
              survives: true
        - ask: Choose why descending removal does not skip work.
          answer: 0
          candidates:
            - text: removing i cannot change any lower index still to be visited
            - text: removing i preserves every higher index that has not been visited yet
              why: In a descending traversal the higher indexes have already been visited; lower unvisited indexes stay unchanged.
              survives: true

  # --- Stop 59: Protect the rescue link
  #     Concept: 37 — Networks, packets, protocols, redundancy, and cybersecurity; Keystone: Reliability & redundancy; Area: COMMS; Prerequisites: Transfers redundancy introduced in Mission 6 and built physically in Mission 13.; Learning role: RETRIEVE; Difficulty: L4; Story role: payoff.
  #     placement: TRACE, Packet Monitor.
  - group: COMMS
    at: packet-monitor
    title: "Protect the rescue link"
    concept: 37   # Networks, packets, protocols, redundancy, and cybersecurity
    reason: "The rollback mechanism is verified, but the canary release still needs a command path that does not share the primary router's single point of failure."
    scene: "Primary satellite acknowledgments, outbound patch confirmation, Rover Three relay traffic, and local weather updates do not all depend on the same hardware. Open each dependency and identify the shared router plus the independent channel that must remain active during canary deployment."
    motivation: "Redundancy only protects the release when the backup path is genuinely independent of the component that can remove the primary path."
    format: TRACE
    question: "Open all four dependencies, identify the shared single point, and submit the independent command path that must stay active."
    choices:
    - "Antenna Router AR-2"
    - "Vehicle radio VR-3"
    - "Weather mast WM-1"
    - "primary satellite ACK"
    - "outbound patch confirmation"
    - "Rover Three relay"
    - "local weather mast feed"
    answerText: "The rover path bypasses AR-2, so it can still carry command if the primary router disappears during deployment."
    why: "Fault tolerance comes from independent failure paths, not from counting multiple channels that share the same upstream resource."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Patch confirmation is not independent because it also uses AR-2. Weather mast is independent but is not a command path for controller release.
    # correct result: AR-2 is shared by primary and patch confirmation; keep Rover Three relay active.
    # state/output: The Packet Monitor displays CANARY COMMAND: PRIMARY + ROVER RELAY.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   trace:
    #     resources:
    #       - {id: ar2, label: "Antenna Router AR-2"}
    #       - {id: vr3, label: "Vehicle radio VR-3"}
    #       - {id: wm1, label: "Weather mast WM-1"}
    #     target: ar2
    #     shared_resource: "Antenna Router AR-2"
    #     channels:
    #       - {id: primary, label: "primary satellite ACK", reading: "AR-2 path active", depends: [ar2], depends_on_shared: true}
    #       - {id: patch, label: "outbound patch confirmation", reading: "AR-2 path active", depends: [ar2], depends_on_shared: true}
    #       - {id: relay, label: "Rover Three relay", reading: "VR-3 path active", depends: [vr3], depends_on_shared: false}
    #       - {id: weather, label: "local weather mast feed", reading: "WM-1 feed active", depends: [wm1], depends_on_shared: false}
    #     independent: [relay, weather]
    #     commit: "Name the resource shared by the primary command channels and identify the independent command path."
    #     correctConclusion: "Primary ACK and patch confirmation both depend on AR-2; Rover Three's VR-3 relay remains an independent command path."
    trace:
      channels:
        - id: primary
          label: primary satellite ACK
          reading: AR-2 path active
          depends:
            - ar2
        - id: patch
          label: outbound patch confirmation
          reading: AR-2 path active
          depends:
            - ar2
        - id: relay
          label: Rover Three relay
          reading: VR-3 path active
          depends:
            - vr3
        - id: weather
          label: local weather mast feed
          reading: WM-1 feed active
          depends:
            - wm1
      resources:
        - id: ar2
          label: Antenna Router AR-2
        - id: vr3
          label: Vehicle radio VR-3
        - id: wm1
          label: Weather mast WM-1
      independent:
        - relay
        - weather
      target: ar2

  # --- Stop 60: Commit the station recovery
  #     Concept: 35 — Testing, debugging, edge cases, and incremental development; Keystone: Debugging & tests, State & assignment, Object state & references, Boolean logic, Reliability & redundancy; Area: OPS; Prerequisites: Transfers the campaign's major keystones into one final controlled deployment.; Learning role: TRANSFER; Difficulty: L5; Story role: payoff.
  #     placement: VERIFY, Incident Console.
  - group: OPS
    at: incident-console
    title: "Commit the station recovery"
    concept: 35   # Testing, debugging, edge cases, and incremental development
    reason: "Every release gate is ready, but the remaining controllers stay locked until the player computes and commits five canary expectations from displayed code and state."
    scene: "P02 starts at limit 70 and warning 3; H04 is a separate controller, the packet time is 2026-09-08 08:07, rollback starts [P02 open, X resolved, H04 open], and AR-2 may fail. Use the displayed code and dependency rules to compute five canary expectations."
    motivation: "The final verification integrates established mechanisms without printing the answers before the player's commitment."
    format: VERIFY
    question: "First, calculate and commit P02's final limit after the displayed +20 patch. OPERATE: deploy only P02. MEASURE: reveal its final limit. INTERPRET: confirm the four previously established canary checks and submit GO or NO-GO."
    choices:
    - "P02 warning after H04 writes 7"
    - "parsed rescue time"
    - "rollback retained list"
    - "command path with AR-2 unavailable"
    answerText: "Each result follows a mechanism proven earlier: an instance-method update, instance-local warning state, substring boundaries, descending ArrayList removal, and the rover relay's independent network path."
    why: "Integrated verification requires explicit predictions, a limited reversible operation, independent measurements, and a final decision only after all committed expectations are checked."
    # wrong-path feedback, one rebuttal per wrong option:
    #   - A committed limit outside the narrow band around 90 fails the canary prediction.
    # correct result: P02 final limit 90; the four supporting checks also match; GO for staged fleet release.
    # state/output: After all five committed predictions match, all four campaign bars lock at 100%, the Runway Door unlocks, and no further graded stop appears.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   verify:
    #     prediction_prompt: "Commit P02's final limit after the canary patch before DEPLOY unlocks."
    #     predictionRange: {min: 60, max: 110, step: 5, unit: "limit"}
    #     truth: 90
    #     passRatio: [0.99, 1.01]
    #     measurement:
    #       label: "P02 limit after canary patch"
    #       cost: 1
    #     supporting_checks:
    #       - {label: "P02 warning after H04 writes 7", expected: "3", observed: "3"}
    #       - {label: "parsed rescue time", expected: "08:07", observed: "08:07"}
    #       - {label: "rollback retained list", expected: "[P02,H04]", observed: "[P02,H04]"}
    #       - {label: "command path with AR-2 unavailable", expected: "Rover Three relay", observed: "Rover Three relay"}
    #     correct_action: "GO for staged fleet release only if the committed limit prediction hits and all four supporting checks match."
    #     answerText: "The canary limit is 90, which lies inside the dial range and has a narrow pass band; the four independent supporting checks also match, so staged expansion is justified."
    verify:
      prediction_prompt: Commit P02's final limit after the canary patch before DEPLOY unlocks.
      truth: 90
      passRatio:
        - 0.99
        - 1.01
      measurement:
        label: P02 limit after canary patch
        cost: 1
      supporting_checks:
        - label: P02 warning after H04 writes 7
          expected: "3"
          observed: "3"
        - label: parsed rescue time
          expected: 08:07
          observed: 08:07
        - label: rollback retained list
          expected: "[P02,H04]"
          observed: "[P02,H04]"
        - label: command path with AR-2 unavailable
          expected: Rover Three relay
          observed: Rover Three relay
      correct_action: GO for staged fleet release only if the committed limit prediction hits and all four supporting checks match.
      answerText: The canary limit is 90, which lies inside the dial range and has a narrow pass band; the four independent supporting checks also match, so staged expansion is justified.
      prediction:
        min: 60
        max: 110
        step: 5
        unit: limit


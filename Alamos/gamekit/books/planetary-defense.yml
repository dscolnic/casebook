  - title: Can We Move It?
    objective: Choose a deflection demonstration and define how success will be measured.
    briefing: Impact probability remains significant, and a scouting mission could arrive years before encounter. The player must compare momentum transfer, lead time, and uncertainty without treating deflection as a movie-style explosion.
    stake: Four months after the keyhole was confirmed. The next encounter is still more than a decade away, which sounds like plenty of time. It is not: a mission to push the object must launch years before it ever gets there. Today you size that push, and decide how you will prove it worked.
    takeaway: Use momentum, impulse, lead time, kinetic impact, uncertainty as an evidence chain rather than as isolated facts.
    segue: >-
      The push gets sized, and a plan to prove it worked — tracking after the
      impact, not just the collision itself — goes into the mission design.
      But months on, the real spacecraft runs into a harder number: the launch
      window is only nineteen days wide, it will not open twice, and one part
      of the design is what is actually setting that limit.
    stops:
      - group: IMPACT
        task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
        title: Velocity change from momentum transfer
        at: deflection-desk
        reason: >-
          Sizing the nudge today is what tells the mission how hard it
          actually has to hit
        concept: Momentum conservation in collisions
        place: Deflection Physics Lab
        scene: "A kinetic impactor — a spacecraft built to hit the asteroid head-on — is being sized at the deflection lab. Banerjee hands over the numbers: the spacecraft's mass and closing speed are both known. The asteroid's mass is known too, but only roughly."
        guide: >-
          Five numbers sit on the board. Two of them belong to other
          stops entirely. One is the speed the asteroid would hit Earth
          at. The other is the ejecta boost — the extra push from
          debris the impact throws backward. Ask of each: does this
          first estimate actually need it? The momentum delivered —
          mass times speed — belongs to the impactor. The speed change
          it causes is that same momentum, handed to a much bigger
          mass. What you get is a lower bound, before any ejecta boost
          is added in.
        background:
          - >-
              Why this is an estimate, not a calculation. Every number on
              this board is already measured or given — nothing here has
              to be worked out from scratch. What's being tested is
              whether you can pick the numbers the relationship actually
              needs. It's also whether the size of your final answer
              looks right once they're in place.
          - >-
              Why the tiles carry labels. A bare number can't be checked
              against what the relationship needs — you'd have no way to
              tell a radius from a diameter. Reading the label first is
              how you catch a mismatch. It's also how you catch a number
              that belongs to a different part of the problem, before you
              place it wrong. That habit is exactly what this format is
              built to teach.
        assumes:
          - momentum is mass times velocity, and it is conserved in a collision
        takeaway: Deflection works through a tiny speed change, multiplied by a long lead time.
        format: BALLPARK
        question: Estimate the asteroid's speed change from the impact.
        why: For this first, lower-bound estimate, treat the impactor and the asteroid as a simple momentum-transfer problem. The momentum delivered is the impactor's mass times its speed relative to the asteroid. Divide that momentum by the asteroid's mass. That gives its speed change — about 0.015 m/s, or 1.5 centimeters a second. Real impacts can gain extra momentum from ejecta leaving the surface, but this version sets the scale first. It also shows why the asteroid's mass and impact geometry matter directly to the achievable deflection.
        estimate:
          relationship: Momentum = mass × speed, and it is conserved. Velocity change = momentum transferred ÷ the mass it is given to.
          prompt: A 10,000 kg impactor strikes the 7.9 × 10⁹ kg asteroid at 12,000 metres per second, in a perfectly inelastic lower-bound estimate.
          question: Estimate the asteroid's change in speed.
          labels:
            - 10,000 kg (impactor mass)
            - 12,000 m/s (impact speed)
            - 7.9e9 kg (asteroid mass)
            - 16,400 m/s (the entry speed at Earth)
            - 2.0 (momentum enhancement from ejecta)
          values: [10000, 12000, 7900000000, 16400, 2]
          slots: 3
          template: "{0} × {1} ÷ {2}"
          formula: a*b/c
          correct: [0, 1, 2]
          target: 0.0152
          tolerance: 0.0015
          units: m/s
          solution: Momentum transferred is 1.2 × 10⁸ kg m/s; divided by 7.9 × 10⁹ kg, Δv ≈ 0.015 m/s.
          explanation: Conservation of momentum needs the impactor's mass and speed, not the asteroid's encounter speed with Earth. The ejecta enhancement is real and would raise this figure — it is left out because nobody can predict it, which is exactly why the mission has to measure it.
      - group: IMPACT
        task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
        title: What determines deflection success?
        at: deflection-desk
        reason: >-
          A body that breaks apart under the hit is worse than one that only
          moves, so today's measure has to be the right one
        concept: Momentum transfer and deflection
        place: Mission Engineering Center
        scene: "The impactor plan sits on the mission board with the asteroid's mass, the hit geometry, and the tracking plan. Schulz wants the team to separate two things: what sets the momentum delivered, and what decides whether that becomes a real orbit change."
        guide: >-
          Four situations sit on the left, and four effects sit on the
          right. Your job is to pair them up — one link to one effect.
          Ask each one the same question: which part of the chain does
          this actually act on? Does it change the momentum delivered —
          the punch of mass times speed? Does it change the speed
          change that punch produces? Does it decide whether that speed
          change turns into a real, lasting shift in the orbit? Or does
          it simply confirm what actually happened, instead of what was
          expected to happen? A successful collision is only one link
          in that chain, not the whole story.
        background:
          - >-
              Why this is a matching board, not four separate questions.
              The answer choices here are written so more than one of
              them sounds plausible for any single situation. If you
              picked them one at a time, a nearly-right answer could
              slip through without ever being checked against the
              others. Having to place every single one forces a real
              comparison. The question stops being "is this reasonable
              here?" and becomes "is this more right here than it is
              there?"
          - >-
              How to use the one-each rule. Each response is used only
              once, so it's a set to divide up, not a list to sample
              from. Every match you settle narrows down the rest.
              Settle the two pairs you're sure of first, and the last
              two are often decided by elimination alone. When they're
              not, two responses are still competing for one situation
              — and figuring out which one fits is exactly what this
              stop is testing.
          - >-
              Why you can't be wrong about just one pair. Since every
              response gets used exactly once, three correct matches
              leave the fourth with only one place left to go. So any
              mistake always involves at least two matches, never just
              one. That's worth remembering when the last pair feels
              forced. The real fault is usually not the match you're
              stuck on — it's an earlier one you made too quickly and
              never questioned again.
        takesAsRead:
          - Momentum conservation in collisions
        assumes:
          - a small velocity change accumulates into a large displacement over time
        takeaway: A deflection mission is really an experiment. Its result — the thing being measured — is the asteroid's changed orbit.
        format: PROTOCOL
        why: Deflection success isn't set by impactor speed alone. The momentum delivered — mass times speed — depends on the impactor's mass and speed. The asteroid's own speed change also depends on the asteroid's mass. Surface material can add extra push through ejecta, debris thrown backward by the strike. Aim decides how much of that push moves the orbit the right way. Navigation decides whether the hit happens where planned. Tracking afterward measures what really changed. A successful hit is only one link in that chain, not proof the mission worked.
        columns:
          - What varies
          - What it does to the outcome
        rebuttals:
          - More lead time multiplies the same speed change into a bigger final distance moved. It's the cheapest, easiest gain in the whole problem.
          - The asteroid's mass divides the momentum it receives, so an uncertain mass gives an uncertain result, in direct proportion.
          - Ejecta — debris thrown backward by the strike — carries extra momentum with it and adds to the transfer. It's real, but nobody can predict the exact amount.
          - Tracking after the impact measures the orbit change that actually happened, not just the one that was predicted. Without it, the mission would only be a demonstration, never real proof.
        scenarios:
          - More lead time before the hit.
          - An asteroid mass that isn't known precisely.
          - An ejecta boost that can't be predicted.
          - Tracking done after the impact.
        choices:

- title: The Spinning Target
  objective: Produce a rotation-state range suitable for imaging and deflection planning.
  briefing: Brightness varies dramatically over hours, suggesting rotation and an elongated shape. The player must derive
    a period, identify aliases, and determine whether the body may be tumbling.
  stake: A mistimed encounter can image or strike the wrong face of the asteroid.
  takeaway: Use periodic signals, light curves, aliasing, rotation, shape inference as an evidence chain rather than as isolated
    facts.
  stops:
  - group: CHAR
    task: Which explanation fits the repeatability, comparison stars, filters, and observing geometry?
    title: Rotation or observing artifact?
    place: Time-Series Photometry Network
    scene: >-
      The asteroid brightens and fades by a few tenths of a magnitude with a repetition near 4.8 hours,
      and the team wants to use that as the rotation period for mission planning. The comparison stars in
      the same frames are stable to within measurement noise, both filters show the same period, the
      object lands on different pixels between exposures, and the phase-angle trend is a slow monotonic
      drift. Periodicity becomes physical evidence only after the periodicities of the atmosphere, the
      instrument and the observing schedule have been ruled out — which is what the comparison stars and
      the two filters are for.
    takeaway: Periodicity becomes physical evidence only after environmental and instrumental periodicities are ruled out.
    format: DIAGNOSIS
    headline: The asteroid brightens and fades by a few tenths of a magnitude.
    readings:
    - zone: Asteroid brightness
      label: Asteroid brightness
      value: Repeats every 4.8 hours
      status: alarm
      note: Pattern appears across two nights
    - zone: Comparison stars
      label: Comparison stars
      value: Stable to within measurement noise
      status: normal
      note: Sky transparency and calibration remain steady
    - zone: Two filters
      label: Two filters
      value: Same period in both
      status: alarm
      note: Not confined to one detector response band
    - zone: Detector position
      label: Detector position
      value: Object lands on different pixels

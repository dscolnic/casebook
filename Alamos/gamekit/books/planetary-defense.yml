- title: Radar Contact
  objective: Design a radar sequence that improves both orbit and physical characterization.
  briefing: A planetary radar window opens for several hours. Range and Doppler measurements could collapse the orbit and
    reveal shape, but only if the observation plan uses the limited signal effectively.
  stake: Missing the radar window can leave years of orbit and size uncertainty unresolved.
  takeaway: Use radar ranging, Doppler shift, resolution, signal-to-noise, inverse problems as an evidence chain rather than
    as isolated facts.
  stops:
  - group: RADAR
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: What does radar measure?
    place: Planetary Radar Facility
    scene: >-
      The radar window opens in hours and the room needs to agree what each observable delivers. Echo
      delay is a direct distance — time of flight times the speed of light, halved. Doppler frequency
      spread across the echo reports the range of line-of-sight velocities across the body, which is
      rotation. Echo power against delay maps how much surface lies at each distance, which is shape and
      roughness. Repeated delay-Doppler images across a rotation build a three-dimensional model. Active
      sensing can transform orbit and shape knowledge in a few hours, in ways optical work cannot in a
      year.
    takeaway: Active sensing can transform orbit and shape knowledge during a short window.
    format: PROTOCOL
    scenarios:
    - Echo delay.
    - Doppler frequency spread.
    - Echo power versus delay.
    - Repeated delay-Doppler images.
    choices:
    - Range.
    - Distribution of line-of-sight rotational velocities.
    - Range-resolved reflecting area and scattering.
    - Changing shape and rotation constraints.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: Radar separates distance and radial velocity dimensions that optical images often entangle.
  - group: OPS
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Range from radar delay
    place: Delay-Doppler Analysis Lab
    scene: >-
      The dish transmits and the echo returns four seconds later. Radio travels at the speed of light and
      covers the distance twice, which is the only subtlety in the arithmetic and the one most often
      dropped. This single measurement does more for the orbit than a month of optical astrometry: optical
      work constrains direction and leaves distance to be inferred from the fit, while this measures the
      distance itself, to metres.
    takeaway: The factor of two reflects the outbound and return travel.
    format: BALLPARK
    question: Estimate range.
    estimate:
      labels:
      - 3.0e8 m/s
      - 4.0 s round-trip
      - 2 for outbound+return
      values:
      - 300000000.0
      - 4
      - 2
      slots: 3
      template: '{0} x {1} / {2}'
      formula: a*b/c
      correct:
      - 0
      - 1
      - 2
      target: 600000000.0
      tolerance: 50000000.0
      units: m
      solution: Range = ct/2 = 6.0e8 m.
      prompt: A radar echo returns after 4.0 seconds.
      question: Estimate range.

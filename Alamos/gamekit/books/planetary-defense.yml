        answerText: Reflected light alone allows many diameter-albedo pairs. That family of matches is wide. The heat measurement narrows it down to one pair. About 180 meters across, with an albedo near 0.44. The 10.0-micron peak in the infrared spectrum gives a temperature by Wien's law, λ_max T = b, so T = b ÷ λ_max ≈ 2898 ÷ 10.0 ≈ 290 K — the rule connecting an object's temperature to the wavelength where it glows brightest.
        why: "Reflected brightness depends on both the cross-section — the area facing us — and the albedo. So the same brightness can come from a small, bright object or a bigger, darker one. That is a real tie, a degeneracy, not just a noisy measurement. Heat measurements bring in different physics. Sunlight that is not reflected gets absorbed and sent back out as heat, and the peak of that heat spectrum gives a temperature, through Wien's law. Combining the heat measurement with the reflected-light family leaves just one shared answer. A second, independent measurement is powerful because it cuts across the same two unknowns from a different direction."
  - title: What Is It Made Of?
    objective: Assign a composition class with explicit alternatives and confidence.
    briefing: Spectra show broad features, but weathering, grain size, and viewing geometry complicate composition. The player must avoid turning a taxonomic resemblance into an exact material claim.
    stake: Five days out. A dip in the spectrum could name what the object is made of, or it could be noise. Today you decide whether the dip is real, and what proof the claim still needs.
    takeaway: Use spectra, absorption features, mineralogy, taxonomy, model ambiguity as an evidence chain rather than as isolated facts.
    segue: >-
      The dip that seemed to name the surface turns out to be Earth's own
      atmosphere, thrown out before it could mislead anyone. What is left is a
      provisional class that still needs more wavelengths before anyone signs
      it. But composition is not the only open file: the brightness has
      started rising and falling on a cycle, and nobody yet knows if that is
      the asteroid turning or just one telescope's own schedule.
    stops:
      - group: CHAR
        task: Open the dependency chain behind each spectrum, keep the independent checks, and identify the shared source of the 1.4 μm dip.
        title: Real absorption or spectral artifact?
        at: spectrograph
        reason: >-
          Every later model inherits today's answer, so the dip has to be
          checked before it is trusted
        concept: Detectors and image artifacts
        place: Spectroscopy Observatory
        scene: A broad dip near 1.4 microns has appeared in the spectrum, and it would change the composition class if it is real. Tola Adebayo, the characterization lead, puts the standard star, the airmass record and a space-based spectrum of the same object in front of you.
        guide: >-
          Open up each piece of evidence and ask what it actually depended on. Keep any
          check that would still hold true even if Earth's atmosphere or the detector
          chain were the real problem. Set the rest aside. Then name the one shared
          source behind the ones that fail. This matters both ways: a dip like this
          could change the asteroid's composition class — what its surface seems to be
          made of. Keeping a fake signal and throwing out a real one are equally wrong.
        background:
          - >-
              Why 1.4 microns is the suspicious spot. Water vapor in Earth's atmosphere
              soaks up a lot of light right there. Any spectrum taken from the ground is
              really two spectra multiplied together: the object's, and the atmosphere's.
              Astronomers correct for the atmosphere's part by watching a standard star —
              one with a known, smooth spectrum — through that same air.
          - >-
              What the airmass record tells you. Airmass measures how much atmosphere the
              telescope looked through for each observation — more airmass means a longer
              path through the air. If the dip gets deeper as the airmass grows, the sky
              is causing it. If the dip stays the same no matter the airmass, the sky is
              not the source.
          - >-
              Why the space-based spectrum settles the question. Above Earth's atmosphere,
              there is no water vapor in the light's path at all. This measurement is the
              one whose chain skips the suspect step completely. That is why it is worth
              more than any number of careful repeats from the ground.

        format: SPOT
        question: Observe to the priority on the desk board, and keep watching the board.
        answerText: Read the board rather than the list. Every change leaves a few minutes in which the old priority still looks like tonight's.
        why: >-
          Three priorities run across the night and each wants a different part of the list.
          Anything with a short arc, then anything setting soon, then anything with a deadline
          on it. A target can answer two at once, which is what makes the switch cost real.

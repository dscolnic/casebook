      - group: OPS
        task: Match each orbit to the period it must have.
        title: When does it come back?
        place: Coordination Office
        scene: Four candidate orbits are still consistent with the arc, and the intercept cannot be designed until somebody says when each one brings the object back. Nobody has turned the distances into times.
        guide: >-
          Four orbit sizes and four periods. Pair them by asking what the relationship
          actually uses. Not the shape of the orbit, not the object's mass, only the
          axis. The period is the axis raised to one and a half, in years and
          astronomical units. That is why an arc long enough to fix the axis also fixes
          every launch window that follows.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last
              pair looks forced: the fault is usually not in the join you are struggling
              with, but in one you made early and stopped questioning.
        takeaway: An orbit's size fixes its period, so a launch window is a consequence of the orbit rather than a choice.
        format: PROTOCOL
        columns:
          - Semi-major axis
          - Orbital period
        assumes:
          - Kepler's third law relates the size of an orbit to the time it takes
        question: Match each semi-major axis to the orbital period it implies.
        scenarios:
          - Semi-major axis 1.0 AU
          - Semi-major axis 1.6 AU
          - Semi-major axis 2.5 AU
          - Semi-major axis 4.0 AU
        choices:
          - About 1.0 year
          - About 2.0 years
          - About 4.0 years
          - About 8.0 years
        mapping: [0, 1, 2, 3]
        why: "Kepler's third law says the square of the period equals the cube of the semi-major axis, in years and astronomical units: the period is the axis raised to one and a half. At 1.6 AU that is about 2 years, at 2.5 AU about 4, and at 4 AU about 8. Nothing else about the orbit enters — not its shape, not the object's mass — which is why an arc long enough to fix the axis also fixes every launch window that follows from it."
        rebuttals:
          - Period is not proportional to the axis. Doubling the axis nearly triples the period.
          - The eccentricity changes where the object is in its orbit, not how long the orbit takes.
          - The object's mass is negligible against the Sun's, so it does not enter the period at all.
      - group: OPS
        task: The measured deflection is only about two centimetres a second. Why can that be enough years before encounter?
        title: Why a centimetre a second is enough
        place: Coordination Office
        scene: Post-impact tracking reports a velocity change of about 2 centimetres a second, against an orbital speed near 25 kilometres a second. The intercept room is being asked how a change of only a few parts in 1 million can create a safe miss years later.
        guide: >-
          Four explanations for how two centimetres a second matters. Ask of each
          whether it names a direction and a mechanism. One claims momentum is not
          conserved, which would be new physics. One claims a direction is always best,
          which depends on geometry. Two centimetres against twenty-five kilometres is
          parts in a million, so whatever the answer is, it has to accumulate.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - an object in orbit is moving at tens of kilometres a second
        takeaway: A tiny nudge applied early buys a large miss later, and the currency is time.
        format: CHOICE
        question: The measured deflection is only about two centimetres a second. Why can that be enough years before encounter?
        why: A few centimetres per second is tiny beside an orbital speed near 25 kilometres per second, but deflection can accumulate timing error over a long lead time. A velocity change with an along-track component changes orbital energy and period. Each later revolution then shifts arrival time farther from the undeflected prediction. Years of accumulated timing difference can become thousands of kilometres at Earth's orbit. Other impulse directions can also work, but their effectiveness depends on encounter geometry and must be propagated rather than judged from direction alone.
        choices:
          - An along-track component changes orbital energy and period, so arrival-time separation accumulates over the remaining years.
          - A mainly radial component changes the orbit size immediately, so the closest-approach distance grows by the same amount each orbit.
          - An out-of-plane component is always best because any inclination change removes the Earth-crossing geometry permanently.
          - The impact speed breaks momentum conservation, so the asteroid receives more net momentum than the impactor and ejecta carry.
        answer: An along-track component changes orbital energy and period, so arrival-time separation accumulates over the remaining years.
        rebuttals:
          - A radial impulse can alter orbital energy too, but its effect is not a simple equal miss-distance increment each orbit; the timing and encounter geometry must be propagated.
          - An out-of-plane impulse can be useful in some geometries, but it is not automatically optimal. The useful component is the one that produces the largest safe encounter displacement for the available lead time.
          - Momentum is conserved for the combined impactor–asteroid–ejecta system. Ejecta can enhance the asteroid impulse, but they do not abolish conservation.
  - title: Evacuate or Wait?
    objective: Create trigger-based preparations proportional to probability, consequence, lead time, and reversibility.
    briefing: The impact corridor crosses populated regions, but the probability is still changing. The player must connect scientific uncertainty to staged civil decisions and avoid both complacency and panic.
    stake: Three years in. The impactor launched 2 years ago and reaches the asteroid in 11 days, 5 years before the encounter. The probability has moved twice this month, both times downward, and Ellery's draft evacuation plan has been seen by two regional governments who are being asked to fund it now — and this time Rossi is the one who is right, because what she would spend is trust she cannot get back. Today you match what gets done to what is actually known. Stockpiles and plans are cheap and reversible. Moving 9 million people is neither, and it kills people directly. Both mistakes here have a body count, and only one of them would ever be reported as yours.

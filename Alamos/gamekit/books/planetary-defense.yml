              Why counting total detections is the wrong score. A strategy that stares at
              the easy part of the sky finds huge numbers of objects that were already easy
              to find. The objects that matter most are the ones near the Sun, at low solar
              elongation — and those are exactly the ones a detection-maximizing strategy
              skips.

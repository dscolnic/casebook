      once.
    title: Which uncertainty dominates?
    place: Risk Analysis Center
    scene: >-
      The consequence estimate is dominated by whichever input has the steepest scaling, and the four
      candidates behave very differently. Diameter enters as a cube through the mass, so 20 per cent
      larger is nearly 75 per cent more energy. Doubling the density doubles the mass and the energy with
      it. Speed enters squared, so 10 per cent faster is about 21 per cent more energy. And an albedo
      assumption that changes the inferred diameter by a factor propagates through that same cube. The
      most valuable measurement is usually the one attached to the steepest exponent.
    takeaway: The most important measurement is often the one attached to the steepest scaling.
    format: PROTOCOL
    scenarios:
    - Diameter is 20% larger.
    - Density doubles.
    - Speed is 10% larger.
    - Albedo assumption changes inferred diameter by a factor of two.

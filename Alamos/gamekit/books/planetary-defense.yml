- title: Impact Energy
  objective: Provide low, central, and high impact-energy scenarios with transparent assumptions.
  briefing: The latest size and speed estimates imply regional consequences, but uncertainty in diameter, density, and velocity
    spans a wide range. The player must compute scales without presenting a false point estimate.
  stake: An exaggerated point estimate can create panic; an understated one can leave emergency planning unprepared.
  takeaway: Use mass and density, kinetic energy, scaling, uncertainty propagation, orders of magnitude as an evidence chain
    rather than as isolated facts.
  stops:

theme:
  id: planetary_defense
  title: Planetary Defense
  subtitle: Campaign Director · International NEO Response

# The areas of study. One column of the game each; every group needs somebody on the roster.
groups:
  - id: DISC
    code: DISC
    name: Discovery & Imaging
    color: "#315c78"
    desc: Images, signal-to-noise, moving-object detection, and artifact rejection.
    defaultLeader: nguyen
    milestones:
      - Validate the detection
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: ORBIT
    code: ORBIT
    name: Astrometry & Orbit
    color: "#704f88"
    desc: Sky position, timing, orbit fitting, covariance, and impact probability.
    defaultLeader: rossi
    milestones:
      - Constrain the orbit
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: CHAR
    code: CHAR
    name: Physical Characterization
    color: "#4b775f"
    desc: Brightness, albedo, spectra, rotation, size, and composition.
    defaultLeader: adebayo
    milestones:
      - Measure the body
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: RADAR
    code: RADAR
    name: Radar & Dynamics
    color: "#9a741d"
    desc: Range, delay, velocity, momentum transfer, and independent orbit constraints.
    defaultLeader: fischer
    milestones:
      - Add geometric leverage
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: IMPACT
    code: IMPACT
    name: Entry & Consequences
    color: "#9a3f36"
    desc: Energy, atmospheric entry, fragmentation, consequence uncertainty, and deflection physics.
    defaultLeader: banerjee
    milestones:
      - Bound the consequence
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: OPS
    code: OPS
    name: Survey & Response
    color: "#3d6f52"
    desc: Completeness, observing geometry, response decisions, communication, and long-term readiness.
    defaultLeader: garcia
    milestones:
      - Turn evidence into action
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off

# The cast. `division` is what makes a person a valid person stop.
roster:
  - id: nguyen
    name: Dr. Linh Nguyen
    role: Survey Imaging Lead
    division: DISC
    quiz:
      - q: How does Nguyen separate a real moving object from a detector artefact?
        a: It appears in independent exposures and moves consistently
        wrong:
          - Artefacts are always brighter on the frame than a real detection is
          - Real objects appear on only one detector at a time
          - Cosmic rays are removed by the telescope's own software
    bio: |-
      Runs the survey cameras on the ridge: four exposures of the same field a night,
      and a morning spent deciding which of the marks on them were real.

      A real moving object turns up on separate frames, and the distance it travels
      between them agrees with the rest of the set. A cosmic ray is in one frame only;
      a hot column sits in the same place on the detector whatever the sky is doing.
      She keeps everything the pipeline rejected, because the pattern in what a survey
      throws away is how a survey finds out it is broken.
  - id: rossi
    name: Dr. Marco Rossi
    role: Orbit Determination Lead
    division: ORBIT
    quiz:
      - q: Why does Rossi treat a position as a timed measurement rather than a point?
        a: An orbit is fitted to when as much as where
        wrong:
          - A position is only valid for the night on which it was taken
          - Timing decides which telescope gets credit for the observation
          - The covariance is computed from exposure length
    bio: |-
      Fits the orbits, and the first thing he asks about any observation handed to him
      is what time it was taken and to what accuracy.

      The fit is as much about the clock as about the sky: a position with a poor
      timestamp is a position somewhere along a line. Every measurement that reaches
      his solution carries its calibration and its covariance with it, so what he
      hands back is a region rather than a point — and the observation worth making
      next is whichever one shrinks the dangerous part of it.
  - id: adebayo
    name: Dr. Tola Adebayo
    role: Physical Characterization Lead
    division: CHAR
    quiz:
      - q: Why will Adebayo not give a diameter from brightness alone?
        a: Brightness is size and reflectivity together
        wrong:
          - Brightness cannot be measured accurately at the faintest magnitudes
          - Diameter requires a radar detection by definition
          - Reflectivity is the same for every asteroid of a given type
    bio: |-
      Works out what an object is made of and how large it is, from a ridge where the
      same target is watched five ways over four nights.

      He will not give a diameter from brightness. Brightness is size and reflectivity
      multiplied together, so a small bright rock and a large dark one land on the
      same point of the plot; separating them takes thermal infrared, a radar echo, or
      a colour that fixes the type. The rotation falls out of the same light curve,
      and is the thing most often mistaken for something else.
  - id: fischer
    name: Dr. Anna Fischer
    role: Radar Dynamics Lead
    division: RADAR
    quiz:
      - q: What does radar add that optical astrometry cannot give?
        a: A direct distance and line-of-sight speed
        wrong:
          - A far more accurate measurement of the very same position on the sky
          - The object's composition from the returned frequency
          - Observations that can be made in daylight
    bio: |-
      Runs the dish at the end of the ridge road, which can reach an object only while
      it is close — and while it can, changes the answer entirely.

      Radar measures a delay and a Doppler shift, which is a direct distance and a
      line-of-sight speed: two quantities optical astrometry never gives, however many
      nights of positions it collects. One good pass has taken a keyhole out of a
      solution that four months of images could not settle.
  - id: banerjee
    name: Dr. Rohan Banerjee
    role: Impact Physics Lead
    division: IMPACT
    quiz:
      - q: Why does Banerjee give consequence as a range rather than a number?
        a: Three uncertain inputs multiply through the calculation
        wrong:
          - A range is required by protocol before any public statement is made
          - Deterministic answers are only possible after entry
          - The range describes how likely an impact is
    bio: |-
      Turns an object into a consequence, which means taking size, density and speed
      and following them down through the atmosphere to whatever is left at the
      ground.

      He gives ranges rather than numbers. Three loose inputs are multiplied together
      on the way to an answer, so an estimate quoted to one figure is a claim about
      precision nobody here has. The altitude the object breaks up at is the term that
      swings the answer most, and it is also the term least well known.
  - id: garcia
    name: Dr. Isabel Garcia
    role: Survey and Response Lead
    division: OPS
    quiz:
      - q: What is Garcia guarding against when she says expected value is not a prediction?
        a: A tiny chance of something enormous gives a number nobody will see
        wrong:
          - Expected value cannot be computed before the orbit is known
          - Probabilities below 1% are not meaningful to a general audience
          - The public always misreads percentages
    bio: |-
      Decides what the programme observes next and what it says out loud, and holds
      both jobs because they are one trade-off: telescope time buys certainty, and
      certainty is what a public statement is made of.

      Her standing warning is that expected value is not a prediction. A
      one-in-ten-thousand chance of a city-sized event multiplies out to a number that
      will happen to nobody; it is a way of comparing options, not a description of
      the night. She writes the thresholds down before the numbers arrive.
  - id: virtanen
    name: Aino Virtanen
    role: Survey Pipeline Scientist
    division: DISC
    bio: |-
      Owns the software that decides which of the night's 40000 detections
      a human being ever sees. Most of what it flags is a satellite, a cosmic ray or
      a column of hot pixels.

      Her measure of the pipeline is not how many objects it finds but how many real
      ones it throws away, which can only be known by feeding it synthetic objects
      and counting how many come back.
    quiz:
      - q: How does Virtanen measure whether the survey is missing objects?
        a: By planting known objects and seeing how many are found
        wrong:
          - By comparing the number found this year with last year
          - By checking that no uncatalogued objects appear in the catalogue
          - By observing the same field twice on the same night
  - id: delacroix
    name: Hugo Delacroix
    role: Astrometrist
    division: ORBIT
    bio: |-
      Turns images into positions, which sounds mechanical and is where most orbit
      errors are actually born. A position is only as good as the star catalogue it
      was measured against and the clock that timestamped it.

      He looks for structure in residuals across the focal plane. A bias that grows
      toward the corner of a detector is an instrument problem wearing the costume
      of an orbital one.
    quiz:
      - q: What does Delacroix conclude from residuals that grow toward one corner of the detector?
        a: The error follows position on the detector, not the sky
        wrong:
          - The object is accelerating in a way gravity does not explain
          - The exposure times were recorded in the wrong time standard
          - The telescope was tracking at the wrong rate
  - id: sorokin
    name: Irina Sorokin
    role: Thermal Infrared Observer
    division: CHAR
    bio: |-
      Measures asteroids in the infrared, where what is seen is heat the body
      re-radiates rather than sunlight it reflects. That breaks the tie between a
      small bright object and a large dark one.

      Reflected light alone gives brightness, which is the product of size and
      reflectivity. Two unknowns, one measurement — and every consequence estimate
      downstream cubes whichever size you guessed.
    quiz:
      - q: Why does Sorokin's infrared measurement pin down a diameter that optical brightness cannot?
        a: Thermal emission depends on size and temperature, not reflectivity
        wrong:
          - Infrared telescopes have better angular resolution
          - Reflected light cannot be measured for faint objects
          - The infrared band is unaffected by distance
  - id: mbeki
    name: Thabo Mbeki-Rowe
    role: Radar Astronomer
    division: RADAR
    bio: |-
      Transmits at an asteroid and listens for the echo, which is the only method in
      this campaign that measures a distance directly instead of inferring it.

      The catch is geometry. Radar strength falls with the fourth power of distance,
      so the technique that collapses an orbit works for a few days per apparition
      and then not at all for years.
    quiz:
      - q: Why is a radar window so short and so valuable?
        a: The returned signal weakens as the fourth power of range
        wrong:
          - The transmitter overheats after a few hours of use
          - Radar requires the object to be in the Earth's shadow
          - Other observatories are booked for optical work at exactly the same hours
  - id: schulz
    name: Marta Schulz
    role: Impact Physics Modeller
    division: IMPACT
    bio: |-
      Models what happens between the top of the atmosphere and the ground, where
      an object either arrives intact, breaks up and deposits its energy as a burst,
      or does something in between.

      Which of those happens depends on the body's strength, and strength is the
      quantity nobody has measured for the object in question. Her models therefore
      produce distributions, and she resists every request to reduce one to a
      headline number.
    quiz:
      - q: Why do Schulz's entry models produce a range of outcomes rather than one?
        a: The body's strength is unmeasured, and it decides whether it fragments
        wrong:
          - Atmospheric density at those heights is never known to better than a factor of two
          - The models are run on different computers with different rounding
          - Entry angle cannot be determined before impact
  - id: ellery
    name: Joan Ellery
    role: Preparedness Coordinator
    division: OPS
    bio: |-
      Translates a probability that keeps moving into actions that people can take
      without being made fools of when it moves again.

      Her tool is the pre-agreed trigger: what has to be observed, by when, for a
      given protective step to begin. Announced in advance, it survives a
      probability that falls; announced afterwards, it looks like improvisation.
    quiz:
      - q: Why does Ellery agree protective triggers before the probability settles?
        a: A step tied to a stated observation survives the probability changing
        wrong:
          - Triggers reduce the uncertainty in the orbit determination
          - Regulations require evacuation plans to be filed in advance
          - Announcing them early is what stops the media reporting the risk badly

# Terms the game may explain in place.
glossary:
  - name: Albedo
    aliases:
      - albedo
    def: The fraction of incident light a surface reflects.
  - name: Astrometry
    aliases:
      - astrometry
    def: Measurement of an object position on the sky.
  - name: Astronomical unit
    aliases:
      - AU
      - astronomical unit
    def: The average Earth–Sun distance, about 150 million kilometres. Orbit sizes are quoted in it.
  - name: Calibration
    aliases:
      - calibrate
      - calibrated
      - calibration
    def: The correction between what an instrument reads and what is true, established against something known.
  - name: Covariance
    aliases:
      - covariance
    def: A description of how uncertainties in fitted quantities vary together.
  - name: Ephemeris
    aliases:
      - ephemeris
      - ephemerides
    def: A table of where an object will be, night by night, computed from its orbit. Its uncertainty is what a telescope has to search.
  - name: Light curve
    aliases:
      - light curve
    def: Brightness measured as a function of time.
  - name: Parallax
    aliases:
      - parallax
    def: The apparent shift of an object against the background stars when the observer moves. With a known baseline it gives a distance by triangle.
  - name: Polarimetry
    aliases:
      - polarimetry
      - polarimetric
    def: Measuring how light is polarised after reflection, which constrains what a surface is made of and how rough it is.
  - name: Radar delay
    aliases:
      - radar delay
    def: Round-trip travel time of a radar signal, used to infer range.
  - name: Solar elongation
    aliases:
      - solar elongation
    def: The angular separation between an object and the Sun as seen from the observer.

# The campaign: 1 working day each, 3 stops and a callback from day 3.
missions:
  - title: The Discovery Image
    objective: Validate a new-object candidate and preserve the measurements needed for follow-up.
    briefing: A survey telescope flags a faint moving point near the ecliptic. The player must determine whether it is a real Solar System object, an image artifact, or a known source.
    stake: 11 days before the object passes Earth, the automated survey run by Aino Virtanen, the survey pipeline scientist, has flagged a faint point that moved between 3 exposures. The same field holds 40000 catalogued stars, 2 satellite trails and a column of hot pixels. Today you decide whether there is really an object there, keep the measurements in a state somebody else can use, and say where to point next. Nothing else is known yet — not how big, not what it is made of, not whether this pass is the only one that matters. Every hour of hesitation widens the patch of sky it could be in.
    takeaway: Use digital images, signal-to-noise, artifacts, moving-object detection, controls as an evidence chain rather than as isolated facts.
    stops:
      - group: DISC
        task: Which explanation fits the motion, image shape, detector map, and independent follow-up?
        title: Object or artifact?
        concept: "Telescopes: aperture, resolution, signal-to-noise"
        place: Survey Telescope Control
        scene: Three survey frames show the same star-like point at three sky positions and on three different detector pixels. The background stars stay registered. A second telescope on another mountain then finds the source close to the predicted next position.
        guide: >-
          Four options, and the test is whether the thing moves in the sky or on the
          chip. Ask of each candidate what it would leave behind. A cosmic ray arrives
          once and sharp. A hot pixel stays on its own pixel while the stars drift past.
          An alignment error would move the background stars too. And one reading is
          from an instrument on another mountain entirely.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a detector has its own defects, and they sit still in detector coordinates
        takeaway: A discovery becomes convincing when motion is coherent in sky coordinates but not tied to one detector, exposure, or telescope.
        format: CHOICE
        question: Which explanation fits the motion, image shape, detector map, and independent follow-up?
        why: A real Solar System object moves in the sky, not on the chip. That is the whole test, and four readings apply it. The source is star-like in every frame, so it is not a cosmic ray, which arrives once and sharp. It lands on different pixels while the background stars stay fixed, so it is not a hot pixel. And a second telescope on another mountain found it near the predicted place — an object that exists for instruments that are not this one.
        rebuttals:
          - A cosmic ray is a single sharp hit in one exposure. This source is star-like in all three and keeps moving.
          - A hot pixel is bright wherever that pixel is read, so it stays put in detector coordinates. This one crosses pixels.
          - An alignment error moves many stars together. Here the stars stay fixed and one point does not.
        headline: The survey software flags a faint moving point near the ecliptic.
        readings:
          - zone: Three survey exposures
            label: Three survey exposures
            value: Source moves linearly between frames
            status: alarm
            note: Motion is consistent in time and direction
          - zone: Point-spread shape
            label: Point-spread shape
            value: Star-like in each exposure
            status: alarm
            note: Not a single-pixel spike
          - zone: Detector defect map
            label: Detector defect map
            value: No hot pixel at those positions
            status: normal
            note: The source crosses different detector pixels
          - zone: Background stars
            label: Background stars
            value: Remain fixed after astrometric alignment
            status: normal
            note: Frame alignment is stable
          - zone: Second telescope
            label: Second telescope
            value: Recovers source near predicted position
            status: alarm
            note: Independent hardware confirms motion
        choices:
          - label: Real Solar System object
            mechanism: A point source changes sky position coherently while stars and detector coordinates remain stable.
          - label: Cosmic-ray hit
            mechanism: A charged particle creates a transient sharp feature in one exposure.
          - label: Hot detector pixel
            mechanism: A fixed detector location appears bright whenever that pixel is read.
          - label: Frame-alignment artifact
            mechanism: Misalignment makes many fixed stars appear to shift together.
        answer: Real Solar System object
      - group: DISC
        task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
        title: Validate the discovery
        place: Image Processing Lab
        scene: 40000 catalogued stars, 2 satellite trails and a hot-pixel column share the frames with the moving point. The formal discovery notice goes out at dawn. If the reduction is wrong, follow-up telescopes will spend the next night chasing an artifact.
        guide: >-
          All four steps will happen before dawn, so ask what each one removes. Forty
          thousand catalogued stars, two satellite trails and a bad column share these
          frames. Ask of each step whether it separates the source from the instrument,
          or from something already known. And the last card is the only one that spends
          somebody else's night if the earlier ones were wrong.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency: each
              step is here because the one before it has already happened, or has to have.
              One transposed pair falsifies that claim wherever it sits, so partial credit
              would be credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained
              by having nothing before or after them, which usually makes them the two you
              can settle from the scene alone. Pinning them collapses the remaining
              arrangements sharply, and what is left in the middle is where the actual
              judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the
              only one. An order can run on cost, on risk, or on reversibility — every
              observation that leaves the sample as it was, before any that consumes it. On
              those boards a chronological reading finds nothing, because none of the steps
              has to happen at a particular hour.
        takesAsRead:
          - Uncertainty, error bars and covariance
        assumes:
          - a prediction somebody else can test is what makes a claim checkable
        takeaway: A discovery is useful only when another observer can test it.
        format: SEQUENCE
        why: A discovery claim should survive a chain of checks that fail in different ways. First confirm that the source is present in multiple exposures. Then measure positions against fixed stars and test whether the motion is coherent in sky coordinates. Check that the path is not tied to one detector feature or reduction step. Finally ask an independent telescope to recover the source near the predicted position. Each step removes a different artifact class, so the final claim does not rest on one instrument or one pipeline.
        rebuttals:
          - Bias, dark and flat first — positions off an uncalibrated frame are wrong in a way no later step recovers.
          - "Cross-match second: stars, satellites, defects and catalogued objects, or you will measure them very precisely."
          - Positions and magnitudes third, with uncertainties, because a position without one cannot be fitted to anything.
          - The ephemeris last, with a region. That is the step that makes this falsifiable by somebody who is not you.
        cards:
          - Apply the bias, dark and flat frames, and solve plate constants for each exposure.
          - Cross-match every source in the field against the star catalogue, the satellite element sets and the defect mask.
          - Fit positions, magnitudes and per-measurement uncertainties against the observatory clock.
          - Post an ephemeris with a predicted uncertainty region where another observatory can check it.
        order: [0, 1, 2, 3]
      - group: ORBIT
        task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
        title: How far did it move?
        place: Minor-Planet Operations Desk
        scene: The object shifted between 2 frames 20 minutes apart, and the desk has to say where the next telescope should point. Nobody has turned that shift into a rate yet.
        guide: >-
          Five numbers, and two of them are the same interval in different units, with a
          third being the exposure count. Ask of each whether this rate needs it. And
          note what the answer is and is not. A sky rate says where to point next. It
          says nothing about a physical speed, because the same angle covers very
          different distances.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - a rate is an amount divided by the time it took
        takeaway: Repeated images turn apparent motion into a measurable rate.
        format: BALLPARK
        question: Estimate the apparent motion in arcseconds per hour.
        why: "Angular speed is a rate, so the first job is to keep the angle and time units consistent. A motion of 0.6 arcsecond each minute becomes 36 arcseconds each hour because an hour contains 60 minutes. That does not by itself give a physical speed: the same angular motion can correspond to very different transverse speeds at different distances. The useful result here is the sky rate, which tells the follow-up team how far the source will move between images and how quickly the search window must be updated."
        estimate:
          relationship: Rate = distance moved ÷ time taken. Multiply by 60 to go from per minute to per hour.
          prompt: The object shifts 12 arcseconds in 20 minutes, and the desk needs a rate before it can predict where to look next.
          question: Estimate the apparent motion in arcseconds per hour.
          labels:
            - 12 arcsec (measured shift)
            - 20 min (between the 2 frames)
            - 3 exposures
            - 1,200 s (the same interval, in seconds)
            - 24 h
          values: [12, 20, 3, 1200, 24]
          slots: 2
          template: "{0} ÷ {1} × 60"
          formula: a/b*60
          correct: [0, 1]
          target: 36
          tolerance: 3
          units: arcsec/hour
          solution: 12 ÷ 20 = 0.6 arcsec/min, so about 36 arcsec/hour.
          explanation: The 60 in the template is minutes per hour, so the interval has to be in minutes. Handing it the same interval in seconds gives an answer 60 times too small — which would look like a main-belt object rather than something close.
  - title: Confirm the Motion
    objective: Produce a consistent astrometric track and identify observations that should be down-weighted or repeated.
    briefing: Follow-up telescopes obtain positions with different clocks and plate solutions. The player must combine astrometry without creating a false trajectory from inconsistent reference frames.
    stake: Ten days to the pass, and six observatories have reported positions to Hugo Delacroix, the campaign astrometrist. Two used a different time standard, one recorded no plate solution at all, and one camera's measurements curve away from the orbit fit in a way that looks systematic rather than random. Today you build one clean track out of all of it and buy the next observation. Delacroix will not weight anything down until the room agrees how. A weak track loses the object after the pass, when it will be too faint to find again for years.
    takeaway: Use angular coordinates, plate calibration, time standards, uncertainty, residuals as an evidence chain rather than as isolated facts.
    stops:
      - group: OPS
        task: Which explanation fits the residual pattern across field position, timing, catalog stars, and the independent telescope?
        title: Why do the measured positions disagree?
        place: Follow-Up Telescope Network
        scene: The wide-field camera's reference stars and asteroid share a residual that grows toward one edge of the detector. Exposure times agree with the observatory clock. A second telescope shows neither pattern and agrees with the current orbit fit.
        guide: >-
          Four options, and the reference stars are the control. They show the same
          pattern as the asteroid. Ask of each candidate whether it would move both, or
          only one. Real acceleration moves the asteroid and leaves the stars alone. The
          timestamps agree with the clock. A second telescope agrees with the orbit.
          What is left is the map from detector to sky.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - reference stars in the same frame are a control on the frame itself
        takeaway: An error that tracks the apparatus rather than the target is telling you about the apparatus.
        format: CHOICE
        question: Which explanation fits the residual pattern across field position, timing, catalog stars, and the independent telescope?
        why: The reference stars are the control, and they show the same spatial pattern as the asteroid. A residual that follows position on the focal plane belongs to the camera, not to the sky — real acceleration would move the asteroid and leave the stars alone. The timestamps agree with the observatory clock, so it is not timing. A second telescope agrees with the orbit, so it is not the orbit. What is left is the mapping from detector to sky, and the distortion calibration is older than the camera.
        rebuttals:
          - Real acceleration acts on the asteroid alone. The reference stars would not follow it, and here they do.
          - A timing error shifts moving objects and leaves fixed stars correctly placed. Both are displaced here, and the clock checks out.
          - A catalogue-wide star error would show at the second telescope too, and across the whole field rather than growing toward one edge.
        headline: Follow-up astrometry from one wide-field camera curves away from the orbit fit, while a second telescope agrees.
        readings:
          - zone: Asteroid residuals
            label: Asteroid residuals
            value: Grow toward field edge
            status: alarm
            note: Small near center, larger at large radius
          - zone: Reference-star residuals
            label: Reference-star residuals
            value: Show the same spatial pattern
            status: alarm
            note: Not unique to the asteroid
          - zone: Exposure timestamps
            label: Exposure timestamps
            value: Agree with observatory clock
            status: alarm
            note: No measurable timing jump
          - zone: Second telescope
            label: Second telescope
            value: Agrees with predicted orbit
            status: normal
            note: Independent instrument does not see the offset
          - zone: Distortion calibration
            label: Distortion calibration
            value: Older than current camera configuration
            status: alarm
            note: Geometric model may be stale
        choices:
          - label: Focal-plane distortion calibration error
            mechanism: A position-dependent mapping from detector coordinates to sky coordinates biases both stars and asteroid near the field edge.
          - label: Real asteroid acceleration
            mechanism: A physical force changes only the asteroid trajectory on the sky.
          - label: Timing error
            mechanism: Incorrect exposure time shifts moving-object positions while fixed reference stars remain correctly mapped.
          - label: Catalog-wide star error
            mechanism: The reference catalog is wrong in the same way for both telescopes and all field positions.
        answer: Focal-plane distortion calibration error
      - group: ORBIT
        task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
        title: Build the observation arc
        concept: Time and coordinate standards
        place: Astrometry Lab
        scene: Six observatories have reported. Two use a different time standard, one recorded no plate solution at all, and together they cover four hours. The next uncertainty region has to come out of this.
        guide: >-
          All four steps will happen. Six observatories have reported, two on a
          different time standard and one with no plate solution. Ask of each step what
          the next one would mean without it. More coordinates are not the goal. What is
          wanted is measurements that make competing orbits predict different places,
          and then the uncertainty carried forward.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency: each
              step is here because the one before it has already happened, or has to have.
              One transposed pair falsifies that claim wherever it sits, so partial credit
              would be credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained
              by having nothing before or after them, which usually makes them the two you
              can settle from the scene alone. Pinning them collapses the remaining
              arrangements sharply, and what is left in the middle is where the actual
              judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the
              only one. An order can run on cost, on risk, or on reversibility — every
              observation that leaves the sample as it was, before any that consumes it. On
              those boards a chronological reading finds nothing, because none of the steps
              has to happen at a particular hour.
        assumes:
          - measurements only combine if they are in the same frame and the same clock
        takeaway: Prediction is the operational test of an astrometric model.
        format: SEQUENCE
        why: Orbit fits improve when observations cover more time and more viewing geometry. Several points taken minutes apart can be very precise, yet still fit many distances and velocities. A later observation gives those candidate orbits time to separate on the sky. A station far away can add parallax from a different line of sight. The goal is not simply more coordinates. The goal is measurements that make competing orbit solutions predict different positions, then carrying the remaining uncertainty forward.
        rebuttals:
          - "Common frame and clock first: two time standards in one fit is an error nobody sees in the residuals afterwards."
          - A preliminary motion model second — you need something to take residuals against.
          - Residuals third, and read for structure. Scatter is noise; a pattern following one station is a fault.
          - The prediction last. The test of an astrometric model is where the object turns up, not how well it fits where it has been.
        cards:
          - Place every measurement in a common coordinate and time system.
          - Fit a preliminary sky-plane motion model.
          - Inspect residuals for station, time, or field-dependent structure.
          - State where the object will be on the following night, to the precision a telescope can be pointed with.
        order: [0, 1, 2, 3]
      - group: OPS
        task: Spend the single follow-up booking on the observation that most reduces the short-arc orbit ambiguity.
        title: Buy the best next observation
        place: Time Standards Room
        scene: 4 hours of discretionary time are available on a 2-metre telescope. The object is magnitude 22.4, sets 2 hours after dusk, and the current arc is only 4 hours. The same field is observable again in six nights; the press office is waiting.
        guide: >-
          Four hours of discretionary time, an object at magnitude 22.4 that sets two
          hours after dusk, and an arc only four hours long. Open each booking and ask
          what it would do to the six-night prediction. Buy the observation that extends
          the arc where it is weakest, not the one that collects the most photons.
        background:
          - >-
              Why arc length dominates. An orbit fitted to four hours of arc is barely
              constrained: small measurement errors turn into large changes in where the
              object will be. Extending the arc constrains the curvature of the path, and
              that is what shrinks the prediction rather than more measurements at the same
              epoch.
          - >-
              What the setting time costs. The object is only up for two hours after dusk,
              so four hours of allocated time cannot all be used on it tonight. A booking
              has to be a plan about when, not only about how long.
          - >-
              Why the press office is in the scene. There is pressure to produce something
              tonight. An observation that yields a publishable image and no orbital
              improvement satisfies that pressure and leaves the six-night prediction
              exactly where it was.
        takesAsRead:
          - "Angular size and the small-angle formula"
        assumes:
          - a short observation arc is consistent with many orbits
          - parallax can constrain distance
        takeaway: A measurement is valuable when its possible outcomes separate the decisions still in contention, not merely when it is precise.
        format: VALUE
        question: Which booking changes the six-night orbit prediction most?
        value:
          hint: You can buy one follow-up booking. Open each option to see what new constraint it would add, then spend the slot on the evidence that most changes the short-arc orbit prediction.
          budget:
            amount: 1
            unit: follow-up booking
            label: Discretionary telescope allocation
          decision: Choose which orbit family to prioritize for the next six-night prediction and impact-monitoring update.
          options:
            - id: later
              label: Observe again near the end of the six-night visibility window
              cost: 1
              axis: time baseline
              decisive: true
              reveals: How the competing short-arc orbit families separate after several days of propagation.
            - id: immediate
              label: Take another exposure immediately from the same telescope
              cost: 1
              axis: same-geometry precision
              decisive: false
              reveals: A slightly smaller random position error at almost the same time and geometry.
            - id: parallax
              label: Use a geographically separated telescope tonight
              cost: 1
              axis: distance by parallax
              decisive: false
              reveals: An independent distance constraint from simultaneous viewing geometry, useful but less leverage on the six-day along-track prediction than the missing time baseline.
            - id: press
              label: Use the slot to prepare and release the discovery notice
              cost: 1
              axis: communication
              decisive: false
              reveals: No new physical constraint on distance, velocity, or the orbit family.
        answerText: Spend the follow-up booking on a later observation that lengthens the arc. The competing orbits have had time to separate, so the new position changes the six-night prediction more than another near-duplicate exposure.
        why: A short arc permits many combinations of distance and velocity. A second point taken immediately can be precise while adding little new geometry. Waiting several days lets those allowed trajectories separate, so one later position can eliminate large parts of the orbit family. A parallax observation is valuable because it constrains distance through different geometry, but the immediate operational question is which orbit predicts the object six nights from now. The best scarce booking is the one that directly increases that prediction leverage.
      - group: DISC
        task: Sort the night's detections before the report goes out.
        title: Moving with the sky, or across it
        concept: Detectors and image artifacts
        place: Survey Dome
        scene: The survey produced four hundred detections tonight and the report goes at dawn. Most of them are not objects at all. What separates them is how a thing moves between frames.
        guide: >-
          Two bins. A real object in the solar system moves against the stars from frame to
          frame, in the same direction, by a consistent amount. Everything else — cosmic ray
          hits, satellites, hot pixels, ghosts — either does not move like that or does not
          move at all. Sort on the motion, not on how bright it is.
        background:
          - >-
              Why motion is the test. The stars are fixed on the timescale of a night, so anything in
              the solar system moves against them. A detection that is in the same place on all four
              frames is a star, a hot pixel or a ghost, however convincing it looks.
          - >-
              What the false positives are. A cosmic ray hits one frame and never appears again. A
              satellite crosses far too fast and streaks. Diffraction spikes and internal reflections
              sit at fixed offsets from bright stars and move when the telescope does, not when the
              sky does.
        assumes:
          - stars stay in the same relative positions over one night
        takeaway: What makes a detection an object is how it moves, not how bright or how sharp it is.
        format: BELT
        question: Send each detection to the bin that says whether anything is really out there.
        answerText: Anything that moves against the stars consistently across the frames is real. Anything that appears once, streaks, or never moves is the instrument or the sky.
        why: >-
          A survey does not detect objects; it detects differences between frames, and the
          work is deciding which differences are things. A genuine solar-system object moves
          against the fixed stars in a consistent direction at a consistent rate, which is why
          four frames rather than two: three points can be a coincidence and four almost never
          are. Everything else fails that test in a characteristic way. A cosmic ray deposits
          its charge on one frame and is absent from the rest. A satellite crosses so fast it
          streaks within a single exposure. Hot pixels and internal reflections sit at fixed
          positions in the detector, so they move when the telescope is nudged and not when
          the sky turns. None of that is about brightness, which is why a bright convincing
          blob is exactly the thing that wastes a follow-up night — and follow-up time is what
          this survey has least of.
        belt:
          left: { name: Really out there }
          right: { name: Instrument or sky }
          need: 20
          lives: 3
          pass: 0.8
          hint: Watch how it moves across the four frames, not how bright it is.
          items:
            - { name: Consistent slow drift, bin: left }
            - { name: Linear motion, bin: left }
            - { name: Four-frame track, bin: left }
            - { name: Steady rate, bin: left }
            - { name: Retrograde track, bin: left }
            - { name: Slow near-opposition, bin: left }
            - { name: Faint but consistent, bin: left }
            - { name: Track across chips, bin: left }
            - { name: Predicted recovery, bin: left }
            - { name: Matches known orbit, bin: left }
            - { name: Steady under moonlight, bin: left }
            - { name: Track through cloud, bin: left }
            - { name: One-frame spike, bin: right }
            - { name: Hot pixel, bin: right }
            - { name: Diffraction spike, bin: right }
            - { name: Internal reflection, bin: right }
            - { name: Satellite track, bin: right }
            - { name: Aircraft light, bin: right }
            - { name: Cosmic ray hit, bin: right }
            - { name: Ghost of Vega, bin: right }
            - { name: Column bleed, bin: right }
            - { name: Dead pixel edge, bin: right }
            - { name: Rotating field track, bin: right }
            - { name: Dome vignette, bin: right }
            - { name: Star not moving, bin: right }
            - { name: Cable shadow, bin: right }
          commit: Start the line
  - title: An Orbit from Sparse Data
    objective: Construct a family of allowed orbits and choose observations that collapse the dangerous dimensions.
    briefing: Only a short arc is available, and many three-dimensional orbits project to nearly the same sky motion. The player must reason with Keplerian motion and orbit families rather than report one overconfident solution.
    stake: Nine days to the pass, and the orbit determination lead, Marco Rossi, has stopped quoting a single orbit. Every orbit that fits the observations draws almost the same line across the sky, and they disagree about everything that matters afterwards — this pass is harmless in all of them, and some of them come back in eight years to hit. Today you work out what the data actually pins down and choose the observations that collapse the rest. The single line through the middle is the most dangerous object in this campaign, because it looks like knowledge.
    takeaway: Use Keplerian orbits, state vectors, degeneracy, orbital elements, prediction as an evidence chain rather than as isolated facts.
    stops:
      - group: ORBIT
        task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
        title: From angles to orbit family
        place: Orbit Determination Center
        scene: Every orbit that fits the arc projects to almost the same track across the sky. Some of them pass 1 million kilometres from Earth and some do not, and nothing measured so far separates them.
        guide: >-
          All four steps will happen, and every orbit that fits projects to nearly the
          same track. Ask of each step what keeps the family a family rather than a best
          fit. Angles cannot supply range, so that has to come from somewhere. And the
          answer is the spread in where the members end up, not the middle of it.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency: each
              step is here because the one before it has already happened, or has to have.
              One transposed pair falsifies that claim wherever it sits, so partial credit
              would be credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained
              by having nothing before or after them, which usually makes them the two you
              can settle from the scene alone. Pinning them collapses the remaining
              arrangements sharply, and what is left in the middle is where the actual
              judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the
              only one. An order can run on cost, on risk, or on reversibility — every
              observation that leaves the sample as it was, before any that consumes it. On
              those boards a chronological reading finds nothing, because none of the steps
              has to happen at a particular hour.
        takeaway: Uncertainty should be carried forward as an ensemble of physically allowed trajectories.
        format: SEQUENCE
        rebuttals:
          - "Directions and any range first: a set of angles alone leaves the distance free, which is the dimension the whole problem turns on."
          - Generate states consistent with the uncertainties, not just the best fit. The best fit is one member of the family and has no special status.
          - Carry each one forward under gravity — the family has to be carried forward, not the average of it.
          - Compare the approach distances last. The spread across the family is the result; collapsing it to one number throws the question away.
        takesAsRead:
          - Probability, risk and expected value
        assumes:
          - angles alone do not fix a distance
        cards:
          - Combine timed directions and any range information.
          - Generate state vectors consistent with the observations and uncertainties.
          - Carry each allowed state forward under gravity.
          - Compare future sky positions and Earth-approach distances across the family.
        order: [0, 1, 2, 3]
        why: Sparse angular data define a region of state space rather than a single orbit, and the honest procedure is to keep the whole family. Combining the timed directions with any range comes first because range is what angles cannot supply. Generating the states consistent with the observations *and their uncertainties* is what makes it a family rather than a best fit. Each is then carried forward under gravity, and the spread in where they end up is the answer — not the middle of it.
      - group: OPS
        task: Match each part of the orbit to the observation that pins it down. Each choice is used once.
        title: Which orbit feature does the data constrain?
        place: Celestial Mechanics Group
        scene: Four kinds of evidence are on offer and the group has to say what each one buys before it spends any telescope time. Each is strong in a different direction.
        guide: >-
          Four parts of the orbit, and four ways to measure. Pair them by asking what
          each measurement is physically sensitive to. A time of flight? A frequency
          shift? A curvature that only shows over weeks? Or a difference between two
          places on Earth at once? Each is strong in a different direction, and
          telescope time is finite.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last
              pair looks forced: the fault is usually not in the join you are struggling
              with, but in one you made early and stopped questioning.
        takeaway: Orbit determination is an information-geometry problem.
        format: PROTOCOL
        columns:
          - What we want to pin down
          - Which observation pins it down
        rebuttals:
          - The size and period of an orbit live in how the path curves, and curvature is what time on the sky makes visible.
          - A distance along the line of sight is a time of flight, which is what a radar echo delivers directly.
          - How fast that distance is changing is a velocity, and the Doppler shift of the echo is proportional to it.
          - Two observers far apart see the object against slightly different backgrounds, and that angle with a known baseline is a distance from geometry.
        takesAsRead:
          - Kepler's laws
        assumes:
          - different measurements constrain different parts of an orbit
        scenarios:
          - The size and period of the orbit.
          - The distance to the object right now.
          - How fast that distance is changing.
          - A distance from geometry alone, with no orbit assumed.
        choices:
          - Keep observing until the arc is long enough. Over hours the path looks straight, and the curvature that only shows over weeks is what fixes the mean motion, from which Kepler's third law gives the rest.
          - Take a radar range. The delay of the echo is a time of flight, so multiplying half of it by the speed of light gives the line-of-sight distance to within metres.
          - Take a radar range rate. The returned frequency is shifted in proportion to the line-of-sight speed, so one echo carries the velocity as well as the distance.
          - Observe from two widely separated places on Earth at once. The direction to the object differs slightly between the sites, and that parallax angle across a known baseline gives the distance by triangle.
        mapping: [0, 1, 2, 3]
        why: "Orbit determination is an information problem before it is an arithmetic one: what to buy next depends on which direction of the uncertainty is widest. Time is what makes curvature visible, so a longer arc constrains the shape. Radar range fixes that distance directly, as a time of flight. Range rate fixes how fast the distance changes. And two widely separated observers see the object against different backgrounds, which is distance from geometry alone."
      - group: OPS
        task: Radar has a window in nine days. What do you do with the nine nights before it?
        title: Collapse the orbit uncertainty
        place: Follow-Up Scheduling Desk
        scene: The allowed orbits sweep a 40,000-kilometre corridor at Earth. The object fades below the survey limit in 12 nights, radar can see it in 9 days, and the beam needs a usable ephemeris. Tonight’s schedule decides whether that window exists.
        guide: >-
          Four options, and the object fades in twelve nights while radar opens in nine
          days. Ask of each what it does to the pointing prediction radar will need.
          Optical angles and radar answer different parts of the problem, so waiting for
          one does not replace doing the other. And reprocessing sharpens a nominal
          orbit without narrowing the family.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - an orbit narrows only when new evidence arrives
        takeaway: A sharper-looking orbit is not a better orbit unless new evidence narrows the allowed family.
        format: CHOICE
        question: Radar has a window in nine days. What do you do with the nine nights before it?
        why: "Optical tracking and radar answer different parts of the orbit problem, so waiting for one is not a substitute for doing the other. Every additional night lengthens the optical arc before the object fades and improves the pointing prediction for radar. Radar can then add range and line-of-sight velocity, constraints optical angles do not directly supply. The nine nights therefore protect the future measurement: extend the arc while the object is observable, then use the radar window when it opens rather than treating either source as sufficient alone."
        choices:
          - Extend optical tracking over as many of them as the weather allows.
          - Hold the telescopes and wait for the radar range.
          - Observe from a second hemisphere for a parallax baseline.
          - Reprocess the existing data into a sharper nominal orbit.
        answer: Extend optical tracking over as many of them as the weather allows.
        rebuttals:
          - Waiting for radar makes the whole campaign depend on one window and one weather forecast, and leaves the arc as short as it is tonight.
          - A second hemisphere adds parallax where the schedule allows it, and it does not replace the nights of arc that are about to be lost.
          - A sharper-looking orbit drawn from the same data is the most dangerous product on this list, because it looks like progress and narrows nothing.
  - title: The Uncertainty Corridor
    objective: Report an impact probability and uncertainty corridor that remain meaningful as new data arrive.
    briefing: The nominal trajectory misses Earth, but a thin set of allowed solutions passes through it. The player must interpret probability, covariance, and how the spread grows unevenly, without confusing low probability with zero consequence.
    stake: Eight days out, and the argument has stopped being about this pass. The best-fit orbit for the return in eight years misses Earth comfortably. A thin set of solutions inside the uncertainty does not, and the corridor they sweep crosses 9 million people and a coastline. This morning's numbers moved the impact probability up, and it is already on the wire. Rossi wants to say nothing until the arc is longer. Joan Ellery, who coordinates preparedness for the two counties under the corridor, is right that the number goes public whether or not this room has the words for it. Today you work out that probability properly and decide which observation reduces the uncertainty that is actually driving the number. You get one chance to explain it.
    takeaway: Use probability distributions, covariance, uneven growth of the spread, risk corridors, decision thresholds as an evidence chain rather than as isolated facts.
    stops:
      - group: IMPACT
        task: Move and narrow the encounter cloud until the full allowed band clears Earth.
        title: Read the risk correctly
        place: Impact Monitoring Center
        scene: "The nominal orbit misses Earth, but the uncertainty cloud still reaches the impact boundary. A press briefing is scheduled this afternoon, and the monitoring chief wants one sentence: safe enough to stand down, or dangerous enough to keep tracking?"
        guide: >-
          The band is every miss distance the observations permit. Its middle clears
          Earth; its edge still touches the impact boundary, which is why this is not
          yet a stand-down. Two improvements are available and they do different things
          to the band — one moves it, one narrows it. Apply what you would authorise,
          then say what the briefing can state this afternoon.
        background:
          - >-
              What the cloud is. Orbits are fitted to observations, and the fit permits a
              range of orbits rather than one. Projected onto the encounter plane that range
              is a cloud, and the impact boundary is a line on the same plane. A nominal
              orbit that misses is a statement about the middle of the cloud only.
          - >-
              Moving it and narrowing it are different work. Correcting a catalogue bias in
              the nominal moves the whole cloud without changing its size — the same
              uncertainty, somewhere else. An independent, well-placed observation adds
              information and shrinks it. Only the second can put the whole cloud outside
              the boundary if the width is what reaches it.
          - >-
              Why the sentence matters more than the number. The public hears 'safe' or 'not
              safe', and a stand-down that is later reversed costs the credibility the next
              warning depends on. So the briefing has to be a statement about the whole
              cloud, and this panel is where you find out whether you can make one.
        assumes:
          - an orbit fit has uncertainty as well as a central solution
          - systematic corrections move a center while new information can narrow a distribution
        takeaway: Risk is carried by the full uncertainty distribution; a safe-looking central value does not erase the tail.
        format: CLOUD
        question: What has to change before the whole uncertainty cloud is outside the impact boundary? Place the bars to report the mean and its one-sigma uncertainty.
        cloud:
          hint: The center is the nominal miss and the width is the current uncertainty. Try the two authored improvements separately before combining them; clearance requires the whole displayed band to remain outside the Earth-limb boundary.
          actions:
            - id: recenter
              label: Correct the catalog bias in the nominal orbit
              effect: shift
              amount: 0.13333333333333333
            - id: narrow
              label: Add an independent high-leverage observation
              effect: narrow
              amount: 0.9142857142857144
          pass: 0.98
          centre: 4
          spread: 1.75
          bounds:
            unit: Earth radii on encounter plane
            min: 1
            max: 14.5
            label: Earth-limb clearance
        answerText: "Neither a safer nominal miss nor a modestly narrower uncertainty is enough alone in this panel. Apply both: the lower edge moves to 4.5 − 3.2 = 1.3 Earth radii, so the full authored cloud clears the Earth-limb boundary."
        why: An orbit solution is a probability distribution, not a dot. Changing a systematic offset can move its center without reducing the range of allowed trajectories. Better independent observations can narrow that range without guaranteeing that the new center is safely placed. The decision has to use both pieces. If any substantial part of the allowed cloud still crosses the impact boundary, the risk is not removed by a reassuring nominal miss. New evidence earns confidence by changing the distribution in a physically justified way.
      - group: ORBIT
        task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
        title: Probability from an ensemble
        place: Statistical Orbit Lab
        scene: A simplified Monte Carlo run has finished at the statistical orbit lab. What it produced is a count of samples, and the figure that leaves this room will be quoted in public for years.
        guide: >-
          Five numbers, and three of them belong to other runs or other questions: the
          first quick run, the misses, and the years to encounter. Ask of each whether
          this fraction needs it. And note what the answer is. It is the share of the
          current uncertainty that lands on Earth. It is not a count of futures, and a
          new observation can move it sharply.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        takesAsRead:
          - Probability, risk and expected value
        assumes:
          - a probability can be estimated by counting outcomes over trials
        takeaway: A tiny probability can be estimated only with enough samples and a valid uncertainty model.
        format: BALLPARK
        question: Estimate the impact probability, as a percentage.
        why: A Monte Carlo ensemble turns an uncertain orbit into many physically allowed trajectories. If 37 of 100,000 propagated trajectories intersect Earth, the estimated impact probability is 37/100,000 = 3.7×10⁻⁴, or 0.037%. That number is not a count of future impacts; it is the fraction of the current uncertainty distribution that lands in the impact region. Its meaning depends on how the ensemble represents the measurement uncertainties and correlations, so a later observation can move or narrow the distribution and change the fraction sharply.

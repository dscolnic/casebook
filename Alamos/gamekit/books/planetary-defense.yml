# Claude-ready mission book. Follows BOOK_TEMPLATE.md conventions.
# Exactly 15 missions, 3 stops per mission. Formats use exact importer names.
# Diagnosis is a first-class format: the full evidence panel is visible and quiet readings matter.
theme:
  id: planetary_defense
  title: Planetary Defense
  subtitle: "Campaign Director \xB7 International NEO Response"
groups:
- id: DISC
  code: DISC
  name: Discovery & Imaging
  color: '#315c78'
  desc: Images, signal-to-noise, moving-object detection, and artifact rejection.
  defaultLeader: nguyen
  milestones:
  - Validate the detection
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: ORBIT
  code: ORBIT
  name: Astrometry & Orbit
  color: '#704f88'
  desc: Sky position, timing, orbit fitting, covariance, and impact probability.
  defaultLeader: rossi
  milestones:
  - Constrain the orbit
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: CHAR
  code: CHAR
  name: Physical Characterization
  color: '#4b775f'
  desc: Brightness, albedo, spectra, rotation, size, and composition.
  defaultLeader: adebayo
  milestones:
  - Measure the body
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: RADAR
  code: RADAR
  name: Radar & Dynamics
  color: '#9a741d'
  desc: Range, delay, velocity, momentum transfer, and independent orbit constraints.
  defaultLeader: fischer
  milestones:
  - Add geometric leverage
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: IMPACT
  code: IMPACT
  name: Entry & Consequences
  color: '#9a3f36'
  desc: Energy, atmospheric entry, fragmentation, consequence uncertainty, and deflection physics.
  defaultLeader: banerjee
  milestones:
  - Bound the consequence
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: OPS
  code: OPS
  name: Survey & Response
  color: '#3d6f52'
  desc: Completeness, observing geometry, response decisions, communication, and long-term readiness.
  defaultLeader: garcia
  milestones:
  - Turn evidence into action
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
roster:
- id: nguyen
  name: Dr. Linh Nguyen
  role: Survey Imaging Lead
  division: DISC
  bio: Distinguishes real moving sources from cosmic rays, detector defects, and image-processing artifacts using repeated
    and independent observations.
- id: rossi
  name: Dr. Marco Rossi
  role: Orbit Determination Lead
  division: ORBIT
  bio: Treats every position as a timed measurement with calibration and covariance, then asks which observation reduces the
    dangerous uncertainty.
- id: adebayo
  name: Dr. Tola Adebayo
  role: Physical Characterization Lead
  division: CHAR
  bio: Combines brightness, color, spectra, thermal information, and rotation without pretending any one observable uniquely
    determines size or composition.
- id: fischer
  name: Dr. Anna Fischer
  role: Radar Dynamics Lead
  division: RADAR
  bio: Uses signal delay and Doppler measurements to add independent geometric constraints to optical astrometry.
- id: banerjee
  name: Dr. Rohan Banerjee
  role: Impact Physics Lead
  division: IMPACT
  bio: Connects size, density, speed, atmosphere, and fragmentation to consequence ranges rather than single deterministic
    outcomes.
- id: garcia
  name: Dr. Isabel Garcia
  role: Survey and Response Lead
  division: OPS
  bio: Balances observing completeness, uncertainty reduction, public communication, and response thresholds without confusing
    expected value with a prediction.
- id: virtanen
  name: Aino Virtanen
  role: Survey Pipeline Scientist
  division: DISC
  bio: |
    Owns the software that decides which of the night's forty thousand detections
    a human being ever sees. Most of what it flags is a satellite, a cosmic ray or
    a column of hot pixels.

    Her measure of the pipeline is not how many objects it finds but how many real
    ones it throws away, which can only be known by feeding it synthetic objects
    and counting how many come back.
  quiz:
    - q: How does Virtanen measure whether the survey is missing objects?
      a: By injecting synthetic sources into the images and counting how many the pipeline recovers
      wrong:
        - By comparing the number found this year with last year
        - By checking that no uncatalogued objects appear in the catalogue
        - By observing the same field twice on the same night
- id: delacroix
  name: Hugo Delacroix
  role: Astrometrist
  division: ORBIT
  bio: |
    Turns images into positions, which sounds mechanical and is where most orbit
    errors are actually born. A position is only as good as the star catalogue it
    was measured against and the clock that timestamped it.

    He looks for structure in residuals across the focal plane. A bias that grows
    toward the corner of a detector is an instrument problem wearing the costume
    of an orbital one.
  quiz:
    - q: What does Delacroix conclude from residuals that grow toward one corner of the detector?
      a: The error follows focal-plane position, so it is instrumental rather than orbital
      wrong:
        - The object is accelerating in a way gravity does not explain
        - The exposure times were recorded in the wrong time standard
        - The telescope was tracking at the wrong rate
- id: sorokin
  name: Irina Sorokin
  role: Thermal Infrared Observer
  division: CHAR
  bio: |
    Measures asteroids in the infrared, where what is seen is heat the body
    re-radiates rather than sunlight it reflects. That breaks the tie between a
    small bright object and a large dark one.

    Reflected light alone gives brightness, which is the product of size and
    reflectivity. Two unknowns, one measurement — and every consequence estimate
    downstream cubes whichever size you guessed.
  quiz:
    - q: Why does Sorokin's infrared measurement pin down a diameter that optical brightness cannot?
      a: Thermal emission depends on size and temperature rather than on the unknown reflectivity
      wrong:
        - Infrared telescopes have better angular resolution
        - Reflected light cannot be measured for faint objects
        - The infrared band is unaffected by distance
- id: mbeki
  name: Thabo Mbeki-Rowe
  role: Radar Astronomer
  division: RADAR
  bio: |
    Transmits at an asteroid and listens for the echo, which is the only method in
    this campaign that measures a distance directly instead of inferring it.

    The catch is geometry. Radar strength falls with the fourth power of distance,
    so the technique that collapses an orbit works for a few days per apparition
    and then not at all for years.
  quiz:
    - q: Why is a radar window so short and so valuable?
      a: Echo strength falls with the fourth power of distance, so it works only near closest approach
      wrong:
        - The transmitter overheats after a few hours of use
        - Radar requires the object to be in the Earth's shadow
        - Other observatories need the same time for optical work
- id: schulz
  name: Marta Schulz
  role: Impact Physics Modeller
  division: IMPACT
  bio: |
    Models what happens between the top of the atmosphere and the ground, where
    an object either arrives intact, breaks up and deposits its energy as a burst,
    or does something in between.

    Which of those happens depends on the body's strength, and strength is the
    quantity nobody has measured for the object in question. Her models therefore
    produce distributions, and she resists every request to reduce one to a
    headline number.
  quiz:
    - q: Why do Schulz's entry models produce a range of outcomes rather than one?
      a: The body's strength is unmeasured, and it decides whether the object fragments or reaches the ground
      wrong:
        - Atmospheric density is never known to better than a factor of two
        - The models are run on different computers with different rounding
        - Entry angle cannot be determined before impact
- id: ellery
  name: Joan Ellery
  role: Preparedness Coordinator
  division: OPS
  bio: |
    Translates a probability that keeps moving into actions that people can take
    without being made fools of when it moves again.

    Her tool is the pre-agreed trigger: what has to be observed, by when, for a
    given protective step to begin. Announced in advance, it survives a
    probability that falls; announced afterwards, it looks like improvisation.
  quiz:
    - q: Why does Ellery agree protective triggers before the probability settles?
      a: A step tied to a stated observation survives the probability changing; one announced afterwards looks arbitrary
      wrong:
        - Triggers reduce the uncertainty in the orbit determination
        - Regulations require evacuation plans to be filed in advance
        - Announcing them early prevents the media from reporting the risk
glossary:
- name: Astrometry
  aliases:
  - astrometry
  def: Measurement of an object position on the sky.
- name: Solar elongation
  aliases:
  - solar elongation
  def: The angular separation between an object and the Sun as seen from the observer.
- name: Albedo
  aliases:
  - albedo
  def: The fraction of incident light a surface reflects.
- name: Light curve
  aliases:
  - light curve
  def: Brightness measured as a function of time.
- name: Covariance
  aliases:
  - covariance
  def: A description of how uncertainties in fitted quantities vary together.
- name: Radar delay
  aliases:
  - radar delay
  def: Round-trip travel time of a radar signal, used to infer range.
missions:
- title: The Discovery Image
  objective: Validate a new-object candidate and preserve the measurements needed for follow-up.
  briefing: A survey telescope flags a faint moving point near the ecliptic. The player must determine whether it is a real
    Solar System object, an image artifact, or a known source.
  stake: If the candidate is real and close, every hour of delay expands the region where it may be lost.
  takeaway: Use digital images, signal-to-noise, artifacts, moving-object detection, controls as an evidence chain rather
    than as isolated facts.
  stops:
  - group: DISC
    task: Which explanation fits the motion, image shape, detector map, and independent follow-up?
    title: Object or artifact?
    place: Survey Telescope Control
    scene: >-
      The survey pipeline flagged a faint point that moved between three exposures on one night. In each
      frame the source is star-like rather than smeared, so it is not a cosmic-ray hit; the detector
      defect map shows no hot pixel at those positions; after astrometric alignment the background stars
      stay fixed while this one does not; and a second telescope on another mountain recovers something
      near the predicted position. A real Solar System object moves coherently in sky coordinates rather
      than in detector coordinates, and it exists for instruments that are not this one. The alert about
      to go out will task observatories on three continents.
    takeaway: A discovery becomes convincing when motion is coherent in sky coordinates but not tied to one detector, exposure,
      or telescope.
    format: DIAGNOSIS
    headline: A survey pipeline flags a faint moving point near the ecliptic.
    readings:
    - zone: Three survey exposures
      label: Three survey exposures
      value: Source moves linearly between frames
      status: alarm
      note: Motion is consistent in time and direction
    - zone: Point-spread shape
      label: Point-spread shape
      value: Star-like in each exposure
      status: alarm
      note: Not a single-pixel spike
    - zone: Detector defect map
      label: Detector defect map
      value: No hot pixel at those positions
      status: normal
      note: The source crosses different detector pixels
    - zone: Background stars
      label: Background stars
      value: Remain fixed after astrometric alignment
      status: normal
      note: Image registration is stable
    - zone: Second telescope
      label: Second telescope
      value: Recovers source near predicted position
      status: alarm
      note: Independent hardware confirms motion
    choices:
    - label: Real moving Solar System object
      mechanism: A point source changes sky position coherently while stars and detector coordinates remain stable.
    - label: Cosmic-ray hit
      mechanism: A charged particle creates a transient sharp feature in one exposure.
    - label: Hot detector pixel
      mechanism: A fixed detector location appears bright whenever that pixel is read.
    - label: Image-registration artifact
      mechanism: Misalignment makes many fixed stars appear to shift together.
    answer: Real moving Solar System object
    why: The source is point-like, moves across different pixels while stars remain fixed, appears repeatedly, and is recovered
      independently. No single detector or registration artifact explains the full panel.
  - group: DISC
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: Validate the discovery
    place: Image Processing Lab
    scene: >-
      The survey flagged a faint point that moved between three exposures, in a field holding two
      satellite trails, a hot pixel column and forty thousand catalogued stars. Validation is a pipeline
      with a fixed order: calibrate the frames and pick out what moved, reject the known — stars,
      satellites, defects, already-catalogued objects — then measure position, time, brightness and their
      uncertainties, and finally submit the candidate with a predicted region for follow-up. That last
      step is what makes it a discovery rather than a claim: it hands somebody else a place to point and a
      way to prove you wrong.
    takeaway: A discovery is useful only when another observer can test it.
    format: SEQUENCE
    cards:
    - Calibrate the images and identify transient or moving candidates.
    - Reject known stars, satellites, detector defects, and catalogued objects.
    - Measure position, time, brightness, and uncertainty for each detection.
    - Submit the candidate and predicted follow-up region to the tracking network.
    order:
    - 0
    - 1
    - 2
    - 3
    why: Calibration and rejection precede astrometry and follow-up.
  - group: ORBIT
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: How far did it move?
    place: Minor-Planet Operations Desk
    scene: >-
      The object shifts 12 arcseconds in 20 minutes, and the desk needs a rate before it can predict where
      to look next. Angular rate is the whole basis of follow-up: it decides how long an exposure can be
      before the source trails, how large a search box the next telescope needs, and whether the motion is
      consistent with something in the main belt or something much closer. Two positions and a time
      interval turn an appearance into a measurement.
    takeaway: Repeated images turn apparent motion into a measurable rate.
    format: BALLPARK
    question: Estimate rate in arcseconds per minute and per hour.
    estimate:
      labels:
      - 12 arcsec
      - 20 min
      values:
      - 12
      - 20
      slots: 2
      template: '{0}/{1} x 60'
      formula: a/b*60
      correct:
      - 0
      - 1
      target: 36
      tolerance: 3
      units: arcsec/hour
      solution: 12/20 = 0.6 arcsec/min = 36 arcsec/hour.
      prompt: The object shifts 12 arcseconds in 20 minutes.
      question: Estimate rate in arcseconds per minute and per hour.
- title: Confirm the Motion
  objective: Produce a consistent astrometric track and identify observations that should be down-weighted or repeated.
  briefing: Follow-up telescopes obtain positions with different clocks and plate solutions. The player must combine astrometry
    without creating a false trajectory from inconsistent reference frames.
  stake: A weak orbit can either lose the object or falsely place Earth in its path.
  takeaway: Use angular coordinates, plate calibration, time standards, uncertainty, residuals as an evidence chain rather
    than as isolated facts.
  stops:
  - group: OPS
    task: Which explanation fits the residual pattern across field position, timing, catalog stars, and the independent telescope?
    title: Why do the measured positions disagree?
    place: Follow-Up Telescope Network
    scene: >-
      Follow-up astrometry from one wide-field camera curves away from the orbit fit while a second
      telescope agrees with the prediction. The asteroid's residuals grow toward the edge of that camera's
      field; the reference stars in the same frames show the same spatial pattern; the exposure timestamps
      agree with the observatory clock; and the distortion calibration on file is older than the current
      camera configuration. A residual that follows position on the focal plane is a property of the
      instrument, not of the orbit — the reference stars are the control, and they are not moving.
    takeaway: 'Astrometric residuals can diagnose the instrument: a bias that follows focal-plane position rather than the
      moving object is a calibration signature.'
    format: DIAGNOSIS
    headline: Follow-up astrometry from one wide-field camera curves away from the orbit fit, while a second telescope agrees.
    readings:
    - zone: Asteroid residuals
      label: Asteroid residuals
      value: Grow toward field edge
      status: alarm
      note: Small near center, larger at large radius
    - zone: Reference-star residuals
      label: Reference-star residuals
      value: Show the same spatial pattern
      status: alarm
      note: Not unique to the asteroid
    - zone: Exposure timestamps
      label: Exposure timestamps
      value: Agree with observatory clock
      status: alarm
      note: No measurable timing jump
    - zone: Second telescope
      label: Second telescope
      value: Agrees with predicted orbit
      status: normal
      note: Independent instrument does not see the offset
    - zone: Distortion calibration
      label: Distortion calibration
      value: Older than current camera configuration
      status: alarm
      note: Geometric model may be stale
    choices:
    - label: Focal-plane distortion calibration error
      mechanism: A position-dependent mapping from detector coordinates to sky coordinates biases both stars and asteroid
        near the field edge.
    - label: Real asteroid acceleration
      mechanism: A physical force changes only the asteroid trajectory on the sky.
    - label: Timing error
      mechanism: Incorrect exposure time shifts moving-object positions while fixed reference stars remain correctly mapped.
    - label: Catalog-wide star error
      mechanism: The reference catalog is wrong in the same way for both telescopes and all field positions.
    answer: Focal-plane distortion calibration error
    why: The residual follows detector position and appears in reference stars, while timestamps are sound and a second telescope
      agrees with the orbit. That pattern localizes the problem to the camera geometry model.
  - group: ORBIT
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: Build the observation arc
    place: Astrometry Lab
    scene: >-
      Six observatories have now reported positions. Two use a different time standard, one has no plate
      solution recorded at all, and the arc they jointly define is four hours long. Building an arc means
      putting every measurement into one coordinate frame and one time system first, fitting a preliminary
      sky-plane motion, then reading the residuals for structure that points at a station, a clock or a
      part of a detector rather than at the sky. The output that matters is the next uncertainty region —
      an astrometric model is tested by predicting where the object will be, not by fitting where it was.
    takeaway: Prediction is the operational test of an astrometric model.
    format: SEQUENCE
    cards:
    - Place every measurement in a common coordinate and time system.
    - Fit a preliminary sky-plane motion model.
    - Inspect residuals for station, time, or field-dependent structure.
    - Predict the next uncertainty region and schedule follow-up.
    order:
    - 0
    - 1
    - 2
    - 3
    why: A preliminary model becomes useful when residuals are interrogated and predictions are tested.
  - group: OPS
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Buy the best next observation
    place: Time Standards Room
    scene: >-
      There are four hours of discretionary telescope time and four ways to spend them. The arc is short,
      the object is faint and setting, and a press office has been asking since lunchtime whether it can
      say anything. Another exposure from the same telescope adds a point that looks like the ones already
      held; a later observation lengthens the time baseline, which is what actually shrinks the orbit
      family; a geographically separated observation adds parallax, a fundamentally different constraint.
      Follow-up is bought for information gain, and the two options that add the most are not the two that
      are easiest to schedule.
    takeaway: The best follow-up is chosen for information gain, not convenience or publicity.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Another exposure immediately from the same telescope.
    - label: B
      text: A later observation that lengthens the time baseline.
    - label: C
      text: A geographically separated observation for parallax.
    - label: D
      text: A press release before confirmation.
    recommended:
      A: 20
      B: 45
      C: 35
      D: 0
    evidence: Allocate 100 follow-up credits.
- title: An Orbit from Sparse Data
  objective: Construct a family of allowed orbits and choose observations that collapse the dangerous dimensions.
  briefing: Only a short arc is available, and many three-dimensional orbits project to nearly the same sky motion. The player
    must reason with Keplerian motion and orbit families rather than report one overconfident solution.
  stake: An overconfident nominal orbit can hide impact solutions that remain inside the uncertainty region.
  takeaway: Use Keplerian orbits, state vectors, degeneracy, orbital elements, prediction as an evidence chain rather than
    as isolated facts.
  stops:
  - group: ORBIT
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: From angles to orbit family
    place: Orbit Determination Center
    scene: >-
      The arc is short, and every orbit that fits it projects to nearly the same track across the sky.
      Some of those orbits pass a million kilometres from Earth and some do not, and nothing measured so
      far separates them. The honest procedure is to keep the whole family: combine the timed directions
      with any range information, generate the state vectors consistent with the observations and their
      uncertainties, propagate each of those under gravity, and compare where they end up. Uncertainty
      here is not an error bar on one trajectory — it is an ensemble of physically allowed trajectories,
      and the spread is the answer.
    takeaway: Uncertainty should be propagated as an ensemble of physically allowed trajectories.
    format: SEQUENCE
    cards:
    - Combine timed directions and any range information.
    - Generate state vectors consistent with the observations and uncertainties.
    - Propagate each allowed state under gravity.
    - Compare future sky positions and Earth-approach distances across the family.
    order:
    - 0
    - 1
    - 2
    - 3
    why: Sparse angular data define a region of state space, not a unique orbit.
  - group: OPS
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Which orbit feature does the data constrain?
    place: Celestial Mechanics Group
    scene: >-
      Four kinds of evidence, each strong in a different direction. A longer observation arc constrains
      the shape of the orbit because curvature only becomes visible over time. Radar range fixes distance
      directly, which optical astrometry never does. Radar range rate fixes how fast that distance is
      changing. Observations from widely separated points on Earth give parallax, and therefore distance,
      from geometry alone. Orbit determination is an information problem before it is an arithmetic one:
      what to buy next depends on which direction of the uncertainty is widest.
    takeaway: Orbit determination is an information-geometry problem.
    format: PROTOCOL
    scenarios:
    - Longer observation arc.
    - Radar range.
    - Radar range rate.
    - Observations from widely separated Earth locations.
    choices:
    - Curvature and mean motion.
    - Line-of-sight distance.
    - Line-of-sight velocity.
    - Parallax and distance geometry.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: Different observations collapse different orbit degeneracies.
  - group: OPS
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Collapse the orbit uncertainty
    place: Follow-Up Scheduling Desk
    scene: >-
      The allowed orbits form a family rather than a line, and the corridor they sweep across Earth's
      distance is wide enough to matter. Radar has a window in nine days and measures the one quantity
      optical astrometry cannot; extending optical tracking over more nights lengthens the arc; observing
      from a second hemisphere adds parallax. One proposal on the table only changes how the same data are
      displayed — it produces a sharper-looking orbit from no new evidence, which is the most dangerous
      product on the list because it looks like progress.
    takeaway: A sharper-looking orbit is not a better orbit unless new evidence narrows the allowed family.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Obtain radar range if geometry permits.
    - label: B
      text: Extend optical tracking over additional nights.
    - label: C
      text: Improve the nominal orbit display without changing data.
    - label: D
      text: Observe from a second hemisphere or long baseline.
    recommended:
      A: 35
      B: 40
      C: 0
      D: 25
    evidence: Allocate 100 credits.
- title: The Uncertainty Corridor
  objective: Report an impact probability and uncertainty corridor that remain meaningful as new data arrive.
  briefing: The nominal trajectory misses Earth, but a thin set of allowed solutions passes through it. The player must interpret
    probability, covariance, and nonlinear propagation without confusing low probability with zero consequence.
  stake: Poor communication can either create panic or delay preparations for a genuine low-probability, high-consequence
    threat.
  takeaway: Use probability distributions, covariance, nonlinear propagation, risk corridors, decision thresholds as an evidence
    chain rather than as isolated facts.
  stops:
  - group: IMPACT
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Read the risk correctly
    place: Impact Monitoring Center
    scene: >-
      The nominal orbit misses Earth, and the room has to be precise about what that does and does not
      mean. A nominal miss with a thin set of allowed solutions passing through Earth is a real risk with
      a small probability, not a near-certain safety. New data that remove most impact solutions lower the
      probability legitimately. And probability can rise after an observation while the object becomes
      better understood, because shrinking the uncertainty region can concentrate what remains onto Earth.
      Planetary-defence risk lives in the distribution of allowed trajectories, not in the best-fit one.
    takeaway: Planetary-defense risk lives in the distribution, not just the best-fit trajectory.
    format: PROTOCOL
    scenarios:
    - Nominal orbit misses Earth.
    - A small fraction of allowed orbits intersect Earth.
    - New data remove most impact solutions.
    - Probability rises after an observation even though the nominal miss distance increases.
    choices:
    - A miss is not guaranteed while uncertainty remains.
    - Impact probability is nonzero and should be monitored.
    - Risk has decreased because the allowed region changed.
    - Nonlinear geometry can redistribute probability; inspect the full solution set.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: Nominal values and integrated probabilities answer different questions.
  - group: ORBIT
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Probability from an ensemble
    place: Statistical Orbit Lab
    scene: >-
      In a simplified Monte Carlo set, 37 of 100,000 sampled trajectories consistent with the observations
      strike Earth. The ratio is the impact probability, and it is only as good as the sampling behind it:
      too few samples and a small probability cannot be resolved at all, and a wrong uncertainty model
      produces a confident number about the wrong distribution. Express it as a decimal and as a
      percentage, and keep in view that this figure will be quoted in public long after the assumptions
      behind it are forgotten.
    takeaway: A tiny probability can be estimated only with enough samples and a valid uncertainty model.
    format: BALLPARK
    question: Estimate probability as a decimal and percent.
    estimate:
      labels:
      - 37 impacting samples
      - 100000 total samples
      values:
      - 37
      - 100000
      slots: 2
      template: '{0}/{1} x 100'
      formula: a/b*100
      correct:
      - 0
      - 1
      target: 0.037
      tolerance: 0.004
      units: '%'
      solution: 37/100000 = 3.7e-4 = 0.037%.
      prompt: In a simplified Monte Carlo set, 37 of 100,000 allowed trajectories strike Earth.
      question: Estimate probability as a decimal and percent.
  - group: OPS
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Reduce the dangerous uncertainty
    place: Planetary Defense Coordination Office
    scene: >-
      The nominal orbit misses Earth comfortably. A thin set of solutions inside the uncertainty does not,
      and those solutions predict a sky position that differs from the rest by a few arcseconds in about a
      week. Everything else the board could buy would confirm what every solution already agrees on. The
      observation worth having is the one where the live hypotheses disagree most — measurement is only
      informative where the candidate explanations make different predictions, and that condition is a
      place and a date, not a telescope.
    takeaway: The best observation separates the live hypotheses rather than merely adding another point.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Observe where predicted positions differ most among impact and non-impact solutions.

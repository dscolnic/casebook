        scene: "The best-guess path misses Earth. But the uncertainty cloud still touches the impact boundary. Dr. Rohan Banerjee, who models impact physics, says the cloud is still real. A press briefing is set for this afternoon, and Joan Ellery, the preparedness coordinator, wants one line: stand down, or keep tracking?"
        guide: >-
          Here's what the cloud is. It's every path the data still allows,
          once the fit is honest about its own uncertainty. The middle of
          that cloud clears Earth. But the edge still touches the boundary —
          the line where a path counts as a hit. That's why nobody can
          stand down yet. Two moves are on the board. One shifts the cloud.
          One squeezes it narrower. Try each alone, then together, and say
          what the briefing can honestly state this afternoon.
        background:
          - >-
              What the cloud really is. Telescopes give a set of
              observations, not a perfect answer, so many slightly
              different orbits fit the data equally well. Draw all of
              those orbits where they cross Earth's path, and they spread
              into a cloud of possible miss distances — not one dot. The
              impact boundary is a line on that same drawing: the edge past
              which a path counts as a hit. Saying the best-guess path
              misses Earth only describes the middle of the cloud. It says
              nothing about the edge.
          - >-
              Moving the cloud and narrowing the cloud are two different
              jobs. Fixing a catalogue bias means correcting an old, small
              error in the star positions used to point the telescope.
              That correction shifts the whole cloud to a new spot. It does
              not make the cloud any smaller. The same spread of
              uncertainty just sits somewhere else. A new, well-placed
              observation is different. It adds real information, so it
              shrinks the cloud instead of moving it. If the edge of the
              cloud is what reaches the boundary, only narrowing — not
              shifting — can pull the whole cloud clear.
          - >-
              Why the sentence matters more than the number. The public
              only hears 'safe' or 'not safe' — not a percentage. A
              stand-down announced today and reversed tomorrow costs
              something real: the trust the next warning will need. So the
              briefing has to be a true statement about the whole cloud,
              not just its middle. This panel is where you find out
              whether you can make one.
        assumes:
          - an orbit fit has uncertainty as well as a central solution
          - systematic corrections move a center while new information can narrow a distribution
        takeaway: Risk lives in the whole spread of possible paths, not just the most likely one. A safe-looking middle does not erase a dangerous edge.
        format: CLOUD
        question: What has to change before the whole cloud clears the boundary? Place the bars to show the average miss distance and its one-sigma uncertainty — how far off it could realistically be, in either direction.
        cloud:
          hint: The center is the nominal miss and the width is the current uncertainty. Try the two authored improvements separately before combining them; clearance requires the whole displayed band to remain outside the Earth-limb boundary.
          actions:
            - id: recenter
              label: Fix the catalog bias in the best-guess path
              effect: shift
              amount: 0.13333333333333333
            - id: narrow
              label: Add a well-placed, independent observation
              effect: narrow
              amount: 0.9142857142857144
          pass: 0.98
          centre: 4
          spread: 1.75
          bounds:
            unit: Earth radii on encounter plane
            min: 1
            max: 14.5
            label: Earth-limb clearance
        answerText: "Shifting the best-guess path alone is not enough. Narrowing the cloud alone is not enough either. Only doing both works: the lower edge of the band moves to 4.5 − 3.2 = 1.3 Earth radii, so the whole cloud now clears the Earth-limb boundary."
        why: An orbit fit is not one path — it is a cloud of paths the data allows. Fixing a systematic offset, a steady error in every measurement, moves the middle of that cloud without shrinking it. A strong new observation can shrink the cloud without guaranteeing the new middle is safe. The decision needs both pieces. If any real part of the cloud touches the boundary, a reassuring best-guess miss does not remove the risk. New evidence only earns trust when it changes the cloud for a real, physical reason.

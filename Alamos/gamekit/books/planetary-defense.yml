            - t: 2
              value: 0.18
              hoursLeft: 120
              at: day 2
              update: 0.18 % impact probability
            - t: 4
              value: 0.35
              hoursLeft: 72
              at: day 4
              update: 0.35 % impact probability
            - t: 6
              value: 0.8
              hoursLeft: 24
              at: day 6

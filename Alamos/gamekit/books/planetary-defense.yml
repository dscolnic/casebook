  - title: Can We Move It?
    objective: Choose a deflection demonstration and define how success will be measured.
    briefing: Impact probability remains significant, and a scouting mission could arrive years before encounter. The player must compare momentum transfer, lead time, and uncertainty without treating deflection as a movie-style explosion.
    stake: Four months after the pass, Fischer has the radar orbit, and the encounter is seven and a half years out — which sounds like plenty and is not, because a deflection has to be launched years before it arrives. Fischer's orbit is the best this campaign will ever have, and it is already two months old. Today you size the nudge and decide how success will be measured. On a weak body the push can break the object apart, and several fragments on the same path is worse than one. So what has to be measured is not what you launched but what actually happened to the orbit.
    takeaway: Use momentum, impulse, lead time, kinetic impact, uncertainty as an evidence chain rather than as isolated facts.
    stops:
      - group: IMPACT
        task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
        title: Velocity change from momentum transfer
        place: Deflection Physics Lab
        scene: A kinetic impactor is being sized at the deflection lab. The spacecraft's mass and closing speed are known, and so is the asteroid's mass to within a factor of a few.
        guide: >-
          Five numbers, and two of them belong to other stops: the encounter speed with
          Earth, and the ejecta enhancement. Ask of each whether this first estimate
          needs it. Momentum delivered is the impactor's, and the speed change is that
          momentum given to a much larger mass. What comes out is a lower bound, before
          ejecta are counted.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - momentum is mass times velocity, and it is conserved in a collision
        takeaway: Deflection relies on small velocity change plus long lead time.
        format: BALLPARK
        question: Estimate the asteroid's change in speed.
        why: For a first lower-bound estimate, treat the impactor and asteroid as a momentum-transfer problem. The delivered momentum is impactor mass times relative speed. Divide that momentum by the asteroid mass to estimate the asteroid's velocity change, giving about 0.015 m/s, or 1.5 cm/s for the supplied values. Real kinetic impacts can gain extra momentum from ejecta leaving the surface, but the simple calculation establishes the scale before that enhancement is known. It also shows why asteroid mass and impact geometry matter directly to the achievable deflection.
        estimate:
          relationship: Momentum = mass × speed, and it is conserved. Velocity change = momentum transferred ÷ the mass it is given to.
          prompt: A 10,000 kg impactor strikes the 7.9 × 10⁹ kg asteroid at 12,000 metres per second, in a perfectly inelastic lower-bound estimate.
          question: Estimate the asteroid's change in speed.
          labels:
            - 10,000 kg (impactor mass)
            - 12,000 m/s (impact speed)
            - 7.9e9 kg (asteroid mass)
            - 20,000 m/s (the encounter speed with Earth)
            - 2.0 (momentum enhancement from ejecta)
          values: [10000, 12000, 7900000000, 20000, 2]
          slots: 3
          template: "{0} × {1} ÷ {2}"
          formula: a*b/c
          correct: [0, 1, 2]
          target: 0.0152
          tolerance: 0.0015
          units: m/s
          solution: Momentum transferred is 1.2 × 10⁸ kg m/s; divided by 7.9 × 10⁹ kg, Δv ≈ 0.015 m/s.
          explanation: Conservation of momentum needs the impactor's mass and speed, not the asteroid's encounter speed with Earth. The ejecta enhancement is real and would raise this figure — it is left out because nobody can predict it, which is exactly why the mission has to measure it.
      - group: IMPACT
        task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
        title: What determines deflection success?
        place: Mission Engineering Center
        scene: The impactor concept is on the mission board beside the asteroid mass estimate, encounter geometry and tracking plan. The director wants the team to separate what sets the delivered momentum from what determines whether that momentum becomes a useful orbital change.
        guide: >-
          Four things on the left, and four consequences on the right. Pair them by
          asking which link in the chain each one acts on. The momentum delivered? The
          speed change it produces? Or whether that change becomes a useful orbit shift?
          A successful collision is one link. Only one of these four measures what
          actually happened.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last
              pair looks forced: the fault is usually not in the join you are struggling
              with, but in one you made early and stopped questioning.
        takesAsRead:
          - Momentum conservation in collisions
        assumes:
          - a small velocity change accumulates into a large displacement over time
        takeaway: Deflection is an experiment whose dependent variable is the asteroid orbit.
        format: PROTOCOL
        why: Deflection success is not set by impactor speed alone. Delivered momentum depends on impactor mass and relative velocity, while the asteroid's resulting velocity change also depends on its mass. Surface material can increase the transfer through ejecta, and the direction of the impulse determines how efficiently the orbit changes in the useful direction. Navigation controls whether the impact occurs where intended. Tracking before and after the event then measures what actually changed. A successful collision is therefore only one link in a measurement-and-control chain, not the final evidence of success.
        columns:
          - What varies
          - What it does to the outcome
        rebuttals:
          - More lead time multiplies the same velocity change into more displacement. It is the cheapest term in the problem.
          - The asteroid's mass divides the transferred momentum, so an uncertain mass is an uncertain result in direct proportion.
          - Ejecta leaving the surface carry momentum away and add to the transfer — a real effect with a factor nobody can predict.
          - Post-impact tracking measures the orbit change that happened rather than the one that was predicted. Without it the mission is a demonstration.
        scenarios:
          - Longer lead time.
          - Unknown asteroid mass.
          - Uncertain momentum enhancement from ejecta.
          - Post-impact tracking.
        choices:
          - More displacement accumulates from the same Δv.
          - Makes predicted Δv uncertain.
          - Changes effective transferred momentum.
          - Measures actual orbit change rather than assumed performance.
        mapping: [0, 1, 2, 3]
      - group: ORBIT
        task: Predict the velocity-change range, execute the impact, then verify the achieved deflection with post-impact tracking.
        title: Build the deflection campaign
        place: Orbit Monitoring Room
        scene: The impactor has hit. Applause starts in the control room, but the asteroid’s orbit has not yet been remeasured. One dedicated tracking campaign remains, and the mission cannot say it worked until that campaign returns a post-impact velocity change.
        guide: >-
          Lock the velocity change you predicted before the impact, then run the
          tracking campaign and read what the orbit actually did. The applause is not
          the result. One campaign is left, so the last step costs something real, and a
          comparison made after seeing the number can be made to agree with anything.
        background:
          - >-
              Why hitting it is not the measurement. An impactor changes the asteroid's
              speed by a few millimetres a second. Nothing about the impact itself tells you
              by how much, because most of the effect comes from material thrown off the
              surface — the momentum enhancement — which depends on a composition nobody has
              sampled.
          - >-
              What the campaign measures. The orbit before and the orbit after, over enough
              arc that the difference is larger than the measurement error. That is what
              turns 'we hit it' into 'we moved it by this much', which is the only claim the
              next mission can be designed from.
          - >-
              Why the prediction is locked first. The predicted change carries an assumed
              enhancement factor. If the number is written after the measurement, the factor
              becomes whatever makes the mission look right, and the one quantity this whole
              exercise existed to measure is lost.
        takesAsRead:
          - Momentum conservation in collisions
        assumes:
          - momentum transfer sets a lower-bound deflection scale
          - ejecta can change the momentum transferred to the asteroid
        takeaway: An intervention is not scientifically complete until its effect is measured against a prediction made before the action.
        format: VERIFY
        question: Did the asteroid’s measured orbit change agree with the pre-impact prediction?
        verify:
          hint: The momentum calculation gives the lower-bound scale, but ejecta can change the result. Lock the expected range before impact. After the hit, do not stop at a successful collision—buy the tracking measurement and compare it with what you predicted.
          reference:
            label: Actual asteroid velocity change after impact
            truth: 2.1
            unit: cm/s
          measurement:
            label: Post-impact orbit-fit velocity change
            value: 2.1
            unit: cm/s
            cost: 1
          passRatio: [0.6, 1.6]
          prediction:
            min: 1.5
            max: 4.5
            step: 0.05
            label: Post-impact orbit-fit velocity change
            unit: cm/s
          truth: 2.1
          intervention:
            label: Execute the kinetic impact
            alwaysSucceeds: true
        answerText: The impact succeeds physically, but the campaign is complete only after post-impact tracking measures the orbital change. In this authored run the measured Δv is 2.1 cm/s, inside the 1.5–4.5 cm/s prediction range and consistent with the momentum-transfer expectation.
        why: The simple momentum calculation gives a lower-bound velocity change near 1.5 cm/s. Ejecta leaving the surface can add momentum in the opposite direction and raise that value, so the pre-impact prediction should be a range rather than one exact number. A successful spacecraft collision proves that the action occurred; it does not measure the asteroid’s new orbit. Continued astrometry after impact is the experiment’s outcome measurement. Comparing that measured change with the locked prediction tests both the intervention and the physical model used to design it.

        task: Fit the reflected brightness, then use the thermal spectrum to break the size–albedo degeneracy.
        title: Bound the diameter
        at: sizing-board
        reason: >-
          The measurement bought today is what finally pins the size down
          instead of guessing at it
        concept: Albedo and the size–brightness degeneracy
        place: Physical Characterization Group
        scene: Reflected light alone still leaves the asteroid's size wide open — somewhere between about 120 and 600 meters across. Adebayo comes back with new data: an infrared spectrum that peaks near 10.0 microns, plus a heat-flux reading taken from the same angle.
        guide: >-
          Two sliders control diameter and albedo — albedo being the share of sunlight
          the surface bounces back. Many different diameter-albedo pairs can all match
          the reflected light you already have. First, find out how wide that family of
          matching pairs really is. Then bring in the heat measurement. It depends on
          the same two quantities, but combined in a different way. Watch the family of
          matches collapse down to the one pair that satisfies both clues.
        background:
          - >-
              Why reflected light alone cannot pin down the size. What you measure is how
              much sunlight bounces back. That number is the object's area times its
              albedo — how reflective its surface is. A small, bright rock and a large,
              dark one can send back the exact same amount of light. One measurement only
              fixes that product. It leaves the diameter uncertain by a factor of five.
          - >-
              What the infrared measurement adds. Whatever light is not reflected gets
              absorbed instead, and the object re-radiates it as heat. So the heat flux
              depends on the area times one minus the albedo — the share of light that
              gets absorbed rather than bounced back. That is a different combination of
              the same two unknowns. Put the two measurements together, and both diameter
              and albedo are pinned down.
          - >-
              Why diameter is the number that matters most. Impact energy scales with the
              cube of the diameter — double the size, and the energy goes up eight times.
              A factor of five difference in diameter becomes a factor of one hundred
              twenty-five in energy. That is the difference between evacuating a region
              and facing a global disaster.

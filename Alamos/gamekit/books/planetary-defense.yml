    facts.
  stops:
  - group: CHAR
    task: Which explanation fits the target, standard star, airmass, and space-based comparison?
    title: Real absorption or spectral artifact?
    place: Spectroscopy Observatory
    scene: >-
      A spectrum appears to show a broad absorption near 1.4 microns that would change the inferred
      surface composition. The standard star observed the same night shows a dip at the same wavelength;
      the feature deepens at larger airmass; the detector flat field is stable; and a space-based spectrum
      of the same object does not show it at all. A ground-based spectrum contains the telescope, the
      detector, the Earth's atmosphere and the target all at once — and water vapour in the atmosphere
      absorbs near this wavelength. Composition requires separating those contributions before anything is
      claimed about the surface.
    takeaway: A spectrum contains the telescope, detector, Earth atmosphere, and target all at once; composition requires
      separating those layers.
    format: DIAGNOSIS
    headline: A spectrum seems to show a broad absorption feature that could change the inferred surface composition.

        scene: The impactor spacecraft has hit the asteroid. Applause breaks out in the control room. But nobody has remeasured the asteroid’s orbit yet. One tracking campaign is left. Rossi will not call this a success until it returns a real, measured velocity change.
        guide: >-
          First, lock in the velocity change you predicted, before the impact
          happens. Then run the tracking campaign, and read what the orbit actually
          did. The applause in the room is not the result. Only one campaign is left,
          so this last step costs something real. And a comparison made after you
          already know the number can be twisted to agree with anything.
        background:
          - >-
              Why hitting the asteroid is not, by itself, the measurement. A kinetic
              impactor changes the asteroid's speed by only a few millimeters each
              second. The impact alone does not tell you exactly how much. Most of the
              push comes from debris thrown off the surface. That debris is called
              ejecta. Ejecta adds extra push on top of the impactor's own hit. This extra
              push is called momentum enhancement, and it depends on what the asteroid is
              made of, which nobody has directly sampled.
          - >-
              What the tracking campaign actually measures. It measures the orbit before
              the impact, and the orbit after that, over enough sightings that the
              difference is bigger than the measurement error. That is what turns 'we hit
              it' into 'we moved it by this much.' That second claim is the only one the
              next mission can actually be designed from.
          - >-
              Why the prediction gets locked in first. The predicted velocity change
              carries an assumed momentum-enhancement factor. If that number gets written
              down after the measurement, the factor can quietly become whatever number
              makes the mission look good. Then the one quantity this whole exercise
              exists to measure is lost.
        takesAsRead:
          - Momentum conservation in collisions
        assumes:
          - momentum transfer sets a lower-bound deflection scale
          - ejecta can change the momentum transferred to the asteroid
        takeaway: A mission is not scientifically complete until its real effect is measured against a prediction made before anyone acted.
        format: VERIFY
        question: Did the asteroid’s measured velocity change match the prediction made before the impact?
        verify:
          hint: The momentum calculation gives the lower-bound scale, but ejecta can change the result. Lock the expected range before impact. After the hit, do not stop at a successful collision—buy the tracking measurement and compare it with what you predicted.
          reference:
            label: Actual asteroid velocity change after impact
            truth: 2.1
            unit: cm/s
          measurement:
            label: Post-impact orbit-fit velocity change
            value: 2.1
            unit: cm/s
            cost: 1
          passRatio: [0.6, 1.6]
          prediction:
            min: 1.5
            max: 4.5
            step: 0.05
            label: Post-impact orbit-fit velocity change
            unit: cm/s
          truth: 2.1
          intervention:
            label: Execute the kinetic impact
            alwaysSucceeds: true
        answerText: The impact itself works physically. But the campaign is only complete once tracking after the impact measures the real orbital change. In this run, the measured velocity change is 2.1 cm/s. That falls inside the predicted range of 1.5 to 4.5 cm/s, and matches what momentum transfer would predict.
        why: A simple momentum calculation gives a lower-bound velocity change near 1.5 cm/s. Debris leaving the surface, called ejecta, can add extra push and raise that value. So the pre-impact prediction should be a range, not one exact number. A successful spacecraft collision proves the action happened. It does not, by itself, measure the asteroid’s new orbit. Continued tracking after the impact is the real outcome measurement. Comparing that measured change against the locked-in prediction tests both the mission and the physical model used to design it.

    place: Consequence Modeling Center
    scene: >-
      The models disagree because the object's strength and internal structure are unknown, not because
      anybody made an arithmetic error. Running strength and density ensembles propagates that ignorance
      honestly; analogue fireball observations calibrate the models against events that actually happened;
      refining entry angle and speed removes uncertainty that is genuinely measurable. Assuming every
      object of a given diameter behaves identically buries the structural uncertainty inside a single
      asteroid 'type' — the planning office gets one clean answer and no way of knowing how wrong it might
      be.
    takeaway: "Consequence models should expose structural uncertainty rather than bury it in one asteroid \u201Ctype.\u201D"
    format: SCIENCETANK
    proposals:
    - label: A
      text: Run strength and density ensembles rather than one model.
    - label: B
      text: Use analog fireball observations.
    - label: C
      text: Improve entry angle and speed.
    - label: D
      text: Assume every object of the same diameter behaves identically.
    recommended:
      A: 40
      B: 30
      C: 30
      D: 0
    evidence: Allocate 100 credits.
- title: What Have We Failed to See?
  objective: Design a survey strategy that improves detection and accurately reports what remains unseen.
  briefing: The object was discovered late because surveys missed parts of the sky and faint low-albedo bodies. The player
    must quantify selection effects and improve future completeness.
  stake: The next dangerous object may occupy exactly the region the current survey systematically neglects.
  takeaway: Use selection effects, survey completeness, limiting magnitude, cadence, population inference as an evidence chain
    rather than as isolated facts.
  stops:
  - group: OPS
    task: Which explanation fits the pre-discovery geometry and the survey operating record?
    title: Why was it missed?
    place: Survey Strategy Center
    scene: >-
      The object was discovered later than its brightness alone would predict. Its solar elongation before
      discovery was under about 30 degrees, its predicted apparent brightness was within survey depth
      whenever it was in dark sky, the weather archive is mostly clear, detector health is normal, and the
      survey cadence covers that region only after the elongation increases. Completeness is geometric as
      well as instrumental: an object approaching from the direction of the Sun sits in twilight where no
      ground survey can work, and it can be bright and effectively invisible at the same time.
    takeaway: Survey completeness is geometric as well as instrumental; an object can be bright enough yet effectively hidden
      by the Sun.
    format: DIAGNOSIS
    headline: The object is discovered later than expected even though its brightness would normally be within survey reach.
    readings:
    - zone: Solar elongation before discovery
      label: Solar elongation before discovery
      value: Less than about 30 degrees
      status: alarm
      note: Object stayed close to the Sun on the sky
    - zone: Predicted apparent brightness
      label: Predicted apparent brightness
      value: Within survey depth when in dark sky
      status: normal
      note: Sensitivity would otherwise be adequate
    - zone: Weather archive
      label: Weather archive
      value: Mostly clear
      status: alarm
      note: Clouds do not explain the missing weeks
    - zone: Detector health
      label: Detector health
      value: Normal
      status: normal
      note: No prolonged camera outage
    - zone: Survey cadence
      label: Survey cadence
      value: Covers the region after elongation increases
      status: alarm
      note: Detection follows emergence from solar glare
    choices:
    - label: Solar-elongation blind spot
      mechanism: The object is geometrically too close to the Sun for normal night-sky survey coverage.
    - label: Survey not deep enough
      mechanism: The object is always fainter than the system detection limit.
    - label: Bad weather
      mechanism: Cloud cover repeatedly blocks the relevant fields.
    - label: Pipeline/detector outage
      mechanism: The camera or processing system fails during otherwise observable opportunities.
    answer: Solar-elongation blind spot
    why: The object is bright enough and the system is healthy, but it remains close to the Sun until shortly before discovery.
      The timing of detection follows the changing observing geometry.
  - group: OPS
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Volume gain from deeper sensitivity
    place: Telescope Network
    scene: >-
      A survey upgrade lets it detect a standard object twice as far away, and the board wants to know
      what that buys. The searchable volume is roughly a sphere, so it scales as the cube of the distance
      limit — doubling the range multiplies the volume by eight. The population found scales with that
      volume, which is why relatively modest gains in sensitivity produce disproportionate gains in
      discovery, and why depth and coverage trade against each other rather than being separate arguments.
    takeaway: Small gains in distance can produce large gains in searchable volume.
    format: BALLPARK
    question: Estimate the volume factor.
    estimate:
      labels:
      - 2 x maximum distance
      values:
      - 2
      slots: 1
      template: '{0}^3'
      formula: a*a*a
      correct:
      - 0
      target: 8
      tolerance: 0.5
      units: volume factor
      solution: Doubling distance gives about 2^3 = 8 times the idealized searchable volume.
      prompt: A survey can detect a standard object twice as far away after an upgrade.
      question: Estimate the volume factor.
  - group: OPS
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Improve discovery completeness
    place: Population Statistics Lab
    scene: >-
      This object was found eleven days before its closest approach, from the direction of the Sun, at a
      brightness the survey reaches only in good conditions. Greater depth finds fainter and darker
      bodies; a cadence optimised for linking motion turns detections into tracked objects rather than
      one-night stands; wider sky and hemisphere coverage removes the geometric blind spots that hid this
      one. The fourth proposal reports completeness as 100 per cent because no uncatalogued objects appear
      in the catalogue — which is exactly the reasoning this campaign exists to disprove.
    takeaway: Completeness is measured by simulated recovery and known biases, not by absence of discoveries.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Greater depth for faint objects.
    - label: B
      text: Cadence optimized for linking motion.
    - label: C
      text: Wider sky and hemisphere coverage.
    - label: D
      text: Publish completeness as 100% because no unknown objects are catalogued.
    recommended:
      A: 35
      B: 30
      C: 35
      D: 0
    evidence: Allocate 100 survey credits.
- title: Can We Move It?
  objective: Choose a deflection demonstration and define how success will be measured.
  briefing: Impact probability remains significant, and a reconnaissance mission could arrive years before encounter. The
    player must compare momentum transfer, lead time, and uncertainty without treating deflection as a movie-style explosion.
  stake: A poorly characterized intervention could fragment the object, miss the target, or fail to produce enough orbital
    change.
  takeaway: Use momentum, impulse, lead time, kinetic impact, uncertainty as an evidence chain rather than as isolated facts.
  stops:
  - group: IMPACT
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Velocity change from momentum transfer
    place: Deflection Physics Lab
    scene: >-
      A 1,000 kg impactor strikes a 1.0×10⁹ kg asteroid at 10,000 metres per second in a perfectly
      inelastic collision, transferring about 10⁷ kg·m/s of momentum. Conservation of momentum gives the
      resulting velocity change of the asteroid, and it is tiny — millimetres per second. Deflection works
      not by moving the asteroid much but by moving it early: a small velocity change applied years before
      encounter accumulates into a displacement measured in Earth radii by the time it matters.
    takeaway: Deflection relies on small velocity change plus long lead time.
    format: BALLPARK
    question: Estimate asteroid velocity change.
    estimate:
      labels:
      - 1.0e7 kg m/s transferred momentum
      - 1.0e9 kg asteroid mass
      values:
      - 10000000.0
      - 1000000000.0
      slots: 2
      template: '{0}/{1}'
      formula: a/b
      correct:
      - 0
      - 1
      target: 0.01
      tolerance: 0.001
      units: m/s
      solution: "\u0394v is about 0.01 m/s."
      prompt: "A 1,000 kg impactor strikes a 1.0\xD710^9 kg asteroid at 10,000 m/s in a perfectly inelastic lower-bound estimate."
      question: Estimate asteroid velocity change.
  - group: IMPACT
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: What determines deflection success?
    place: Mission Engineering Center
    scene: >-
      A kinetic impactor could reach the object four years before encounter, and how far that moves it
      depends on quantities nobody has measured. A longer lead time turns the same velocity change into
      more accumulated displacement. An unknown asteroid mass makes the predicted velocity change
      uncertain in direct proportion. Ejecta thrown off the surface carry away momentum of their own,
      enhancing the transfer by a factor that is itself uncertain. And post-impact tracking is what
      measures the orbit change that actually occurred rather than the one that was predicted.
    takeaway: Deflection is an experiment whose dependent variable is the asteroid orbit.
    format: PROTOCOL
    scenarios:
    - Longer lead time.
    - Unknown asteroid mass.
    - Uncertain momentum enhancement from ejecta.
    - Post-impact tracking.
    choices:
    - "More displacement accumulates from the same \u0394v."
    - "Makes predicted \u0394v uncertain."
    - Changes effective transferred momentum.
    - Measures actual orbit change rather than assumed performance.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: Mission outcome depends on both applied impulse and verified orbital response.
  - group: ORBIT
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Build the deflection campaign
    place: Orbit Monitoring Room
    scene: >-
      There is budget for one campaign. Reconnaissance would measure the mass the deflection depends on
      and delay the impactor by a year; launching sooner buys lead time and aims a spacecraft at a body
      whose mass is uncertain by a factor of three; long-term tracking before and after is what turns the
      impact into a measurement rather than a hope. Skipping characterisation to launch earlier is
      defensible only if the resulting velocity change does not need to be predicted — and it does,
      because the corridor is decided by it.
    takeaway: A deflection mission should be designed to learn its actual momentum transfer.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Reconnaissance to measure mass, shape, and rotation.
    - label: B
      text: Kinetic-impact mission with navigational margins.
    - label: C
      text: Long-term tracking before and after impact.
    - label: D
      text: Skip characterization to launch sooner regardless of uncertainty.
    recommended:
      A: 30
      B: 40
      C: 30
      D: 0
    evidence: Allocate 100 credits.
- title: Design the Intercept
  objective: Select an intercept architecture with enough margin to reach and accurately target the asteroid.
  briefing: The mission must launch within a narrow window and encounter a rotating, irregular target with limited communications
    delay. The player must integrate orbital mechanics, navigation, power, and autonomy.
  stake: Missing the launch window or target can consume the only remaining lead time.
  takeaway: Use launch windows, relative motion, guidance, power, communications delay as an evidence chain rather than as
    isolated facts.
  stops:
  - group: OPS
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Which subsystem owns the constraint?
    place: Trajectory Design Center
    scene: >-
      Four mission challenges, each owned by a different part of the design. A launch opportunity that
      exists only during a short geometric window is answered by launch-vehicle performance and trajectory
      flexibility. Target ephemeris uncertainty that grows toward encounter is answered by onboard optical
      navigation. A round-trip communication delay that rules out real-time piloting is answered by
      autonomous terminal guidance. And a target face that changes with rotation is answered by knowing
      the spin state before arrival. An intercept is a coordinated prediction-and-control problem, and the
      responses are not interchangeable.
    takeaway: An intercept is a coordinated prediction-and-control problem.
    format: PROTOCOL
    scenarios:
    - Launch opportunity occurs only during a short geometry window.
    - Target ephemeris uncertainty grows near encounter.
    - Round-trip communication delay prevents real-time piloting.
    - The target face changes with rotation.
    choices:
    - Protect schedule and launch readiness.
    - Use optical navigation and late orbit updates.
    - Provide autonomous guidance and fault response.
    - Model rotation and target a robust impact region.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: Mission design maps physical constraints into subsystem requirements.
  - group: OPS
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: Build the intercept architecture
    place: Spacecraft Systems Lab
    scene: >-
      The launch window is nineteen days wide, the target is irregular and rotating, and the light-time at
      encounter means the ground can watch but cannot steer. The architecture has to be traced backwards
      from the outcome: define the encounter geometry and the effect required, choose launch, cruise and
      navigation to deliver it, design the autonomous terminal guidance and the measurements that will
      verify what happened, and test the integrated design against off-nominal target states rather than
      the one in the brochure.
    takeaway: Mission architecture should be traced from outcome to testable requirements.
    format: SEQUENCE
    cards:
    - Define encounter geometry and required effect.
    - Choose launch, cruise, and navigation strategy.
    - Design autonomous terminal guidance and verification measurements.
    - Test the integrated mission against off-nominal target states.
    order:
    - 0
    - 1
    - 2
    - 3
    why: The desired physical effect determines trajectory and guidance, which must then survive uncertainty.
  - group: OPS
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Spend mission margin
    place: Autonomy Test Range
    scene: >-
      The design closes on paper with nothing left over. Whatever margin is bought now comes out of the
      headline performance number the programme has been promising, and the target's ephemeris will still
      be uncertain at arrival. Extra launch energy buys trajectory flexibility; better ephemeris and
      onboard optical navigation buy accuracy where it is actually lost; redundancy in critical functions
      buys survival of a single failure at an encounter that cannot be repeated. A planetary-defence
      mission is judged by whether it works under the conditions that turn up, not by its nominal figures.
    takeaway: A successful planetary-defense mission is robust, not merely impressive at nominal conditions.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Additional launch-energy or trajectory flexibility.
    - label: B
      text: Better target ephemeris and onboard optical navigation.
    - label: C
      text: Redundant critical spacecraft functions.
    - label: D
      text: Maximize one headline performance number at the expense of all reserves.
    recommended:
      A: 30
      B: 40
      C: 30
      D: 0
    evidence: Allocate 100 margin credits.
- title: Evacuate or Wait?
  objective: Create trigger-based preparations proportional to probability, consequence, lead time, and reversibility.
  briefing: The impact corridor crosses populated regions, but the probability is still changing. The player must connect
    scientific uncertainty to staged civil decisions and avoid both complacency and panic.
  stake: Bad communication can create casualties during an unnecessary evacuation or leave people unprepared for a real impact.
  takeaway: Use risk thresholds, expected consequence, decision under uncertainty, communication, reversibility as an evidence
    chain rather than as isolated facts.
  stops:
  - group: OPS
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Match action to evidence state
    place: Risk Communication Center
    scene: >-
      The corridor crosses populated regions and the probability is still moving. Four evidence states are
      on the board and each supports a different level of action: a very low probability with years of
      lead time supports tracking and planning; a rising probability with a stable regional corridor
      supports reversible preparation; a high probability with days remaining supports protective action;
      and a probability that falls after decisive tracking supports standing down publicly and explaining
      why. Preparedness can escalate in stages without anybody claiming certainty — and it is the stages,
      agreed in advance, that keep the public with you.
    takeaway: Preparedness can escalate in stages without claiming certainty.
    format: PROTOCOL
    scenarios:
    - Very low probability with years of lead time.
    - Rising probability with a stable regional corridor.
    - High probability with days remaining.
    - Probability falls after decisive tracking.
    choices:
    - Continue tracking and low-cost preparedness.
    - Pre-position resources and plan corridor-specific evacuations.
    - Execute protective actions under emergency authority.
    - Scale back actions transparently while preserving lessons.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: Action thresholds depend on consequence, lead time, and reversibility, not probability alone.
  - group: OPS
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Expected displaced population
    place: Emergency Management Office
    scene: >-
      The emergency management office needs an expected displaced population to plan against, and the
      number is a product of a probability and a consequence. An expectation summarises a distribution:
      the same figure arises from a small chance of a very large displacement and a near-certainty of a
      small one, and those two situations call for entirely different preparations. Compute it, and then
      say out loud which of the two it came from — the summary is only usable alongside the distribution
      it summarises.
    takeaway: Decision metrics must be interpreted according to the distribution they summarize.
    format: BALLPARK
    question: Compute the expectation and explain why it is not an evacuation count.
    estimate:
      labels:
      - 2.0e6 exposed population
      - 0.005 probability
      values:
      - 2000000.0
      - 0.005
      slots: 2
      template: '{0} x {1}'
      formula: a*b
      correct:
      - 0
      - 1
      target: 10000
      tolerance: 800
      units: people (expectation)
      solution: The narrow mathematical expectation is 10,000 people; it is not an evacuation count.
      prompt: A simplified corridor contains 2 million people and current impact probability is 0.5%.
      question: Compute the expectation and explain why it is not an evacuation count.
  - group: OPS
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Prepare without panic
    place: Scientific Advisory Board
    scene: >-
      The corridor crosses two coastal regions, the probability has moved twice this month and both times
      downward, and regional authorities want a decision they can act on. Improving tracking narrows the
      corridor itself; reversible evacuation and shelter plans can be started and stood down without cost
      to credibility; publishing the uncertainty with the triggers and protective steps is what makes a
      later change of advice look like the system working. Announcing an inevitable impact before the
      orbit is resolved spends the credibility that every subsequent message depends on.
    takeaway: Public trust is protected when uncertainty is paired with concrete decision rules.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Improve tracking and corridor definition.
    - label: B
      text: Build reversible evacuation and shelter plans.
    - label: C
      text: Communicate uncertainty, triggers, and protective steps.
    - label: D
      text: Announce an inevitable impact before the orbit is resolved.
    recommended:
      A: 35
      B: 30
      C: 35
      D: 0
    evidence: Allocate 100 preparedness credits.
- title: The Final Defense Review
  objective: Produce a claim-by-claim planetary-defense decision package and preserve monitoring after the immediate threat
    passes.
  briefing: The international board must decide whether the object is sufficiently characterized, whether the deflection worked,
    and which civil preparations remain necessary.
  stake: Success against one object can create dangerous complacency about the larger unseen population.
  takeaway: Use evidence synthesis, readiness, residual risk, international coordination, long-term stewardship as an evidence
    chain rather than as isolated facts.
  stops:
  - group: OPS
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Disposition the final claims
    place: International Review Hall
    scene: >-
      The board has to publish one account of an eight-year campaign, and each claim in it carries a
      different weight of evidence. Stating what was found and how, separating what is established from
      what remains uncertain, documenting the intervention and the orbit change actually measured, and
      naming who remains responsible for monitoring — these are different jobs, and the failure mode is a
      document that gives all of them the same confidence. Public accountability has to preserve the
      technical reasoning and the decision authority together, because the next campaign will be run by
      people reading this one.
    takeaway: Planetary defense is a continuing evidence system, not a one-time heroic act.
    format: PROTOCOL
    scenarios:
    - Post-impact tracking shows the required orbit shift with independent confirmation.
    - The nominal miss is safe, but a poorly constrained tail remains.
    - Civil plans are ready but based on an outdated corridor.
    - The object is no longer threatening, but survey gaps remain.
    choices:
    - Accept the deflection claim and continue verification.
    - Continue targeted observations; do not collapse the distribution to the nominal.
    - Update plans before operational use.
    - Fund long-term survey and preparedness improvements.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: Final review separates mission success, residual orbital uncertainty, civil readiness, and future capability.
  - group: ORBIT
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: Build the final public record
    place: Orbit Monitoring Center
    scene: >-
      The board has to publish one account of a campaign in which the object was found late, characterised
      in stages, deflected by a measured but imprecise amount, and left with residual risk that is small
      rather than zero. The order that survives scrutiny is discovery history and how the uncertainty
      evolved, then the physical characterisation and the range of consequences it implied, then the
      intervention with the orbit change actually measured against the one predicted, and finally the
      monitoring, survey and governance responsibilities that continue after everyone stops paying
      attention.
    takeaway: Public accountability should preserve both technical reasoning and decision authority.
    format: SEQUENCE
    cards:
    - State the discovery history and evolving uncertainty.
    - Explain physical characterization and consequence ranges.
    - Document intervention, measured orbit change, and residual risk.
    - Publish long-term monitoring, survey, and governance responsibilities.
    order:
    - 0
    - 1
    - 2
    - 3
    why: The record follows the chain from detection through stewardship.
  - group: OPS
    task: Allocate 100 research or response credits across the four proposals. The interface may allow a short written criterion
      before submission.
    title: Fund the planetary-defense legacy
    place: Mission Operations
    scene: >-
      The campaign budget ends with this review, and what survives it decides whether the next object is
      found eleven days out or eleven years out. Survey completeness and rapid follow-up networks are what
      produce warning time; characterisation and deflection demonstration missions are what convert
      warning time into options; international decision protocols and civil preparedness are what turn
      options into action. The fourth proposal is to assume discovery now happens automatically — which is
      the assumption this object spent eight years disproving.
    takeaway: The durable defense is an institution that can repeatedly detect, learn, decide, and act.
    format: SCIENCETANK
    proposals:
    - label: A
      text: Survey completeness and rapid follow-up networks.
    - label: B
      text: Characterization and deflection demonstration missions.
    - label: C
      text: International decision protocols and civil preparedness.
    - label: D
      text: Assume the next object will be found early automatically.
    recommended:
      A: 35
      B: 35
      C: 30
      D: 0
    evidence: Allocate 100 long-term credits.

# --------------------------------------------------------------- the rooms
interiors:
  DISC:
    caption: A detection is a claim that something moved, not that something is there.
    standLine: One faint moving point, two satellite trails and a hot pixel column in the same field.
    station:
      kind: panel
      title: Survey pipeline
      rows:
        - { label: Detections tonight, value: 41, status: high }
        - { label: Candidate SNR, value: 5.2, status: alarm }
        - { label: Known objects rejected, value: 39, status: normal }
  ORBIT:
    caption: A short arc allows a family of orbits, and some members of it hit the Earth.
    standLine: Six observatories reporting, two time standards, and an arc four hours long.
    station:
      kind: panel
      title: Orbit fit
      rows:
        - { label: Arc length, value: 4.1 h, status: alarm }
        - { label: Astrometric residual, value: 0.42 arcsec, status: high }
        - { label: Observations used, value: 22, status: normal }
  CHAR:
    caption: A bright asteroid is not necessarily a large one.
    standLine: One brightness, one assumed albedo, and a diameter the consequence model cubes.
    station:
      kind: panel
      title: Photometry bench
      rows:
        - { label: Absolute magnitude, value: 22.4, status: normal }
        - { label: Assumed albedo, value: borrowed, status: alarm }
        - { label: Thermal data, value: not yet taken, status: low }
  RADAR:
    caption: Four hours of dish time collapse an orbit that a month of imaging cannot.
    standLine: A window four hours wide that does not open again for eleven years.
    station:
      kind: vitals
      title: Delay-Doppler
      rows:
        - { label: Round-trip delay, value: 4.0 s, status: normal }
        - { label: Window remaining, value: 3.2 h, status: alarm }
        - { label: Range precision, value: 15 m, status: high }
  IMPACT:
    caption: The same diameter can produce a crater or a burst ten kilometres up.
    standLine: Three entry models, one reaching the ground, and a strength nobody has measured.
    station:
      kind: panel
      title: Entry model
      rows:
        - { label: Kinetic energy, value: 3.1e17 J, status: alarm }
        - { label: Assumed strength, value: unmeasured, status: alarm }
        - { label: Entry angle, value: 45 deg, status: normal }
  OPS:
    caption: Observing time is the scarce quantity, and information gain is what it should buy.
    standLine: Four hours of discretionary time, four proposals, and a press office asking for a line.
    station:
      kind: panel
      title: Coordination desk
      rows:
        - { label: Impact probability, value: 1 in 640, status: alarm }
        - { label: Next radar window, value: 9 days, status: high }
        - { label: Follow-up committed, value: 4 h, status: normal }

copy:
  DISC: <p>The survey dome and its image processing room. Everything this campaign knows started as photons here.</p>
  ORBIT: <p>Orbit determination. Where a set of angles becomes a family of possible futures.</p>
  CHAR: <p>Spectroscopy and characterization. Size, reflectivity, spin and composition — the physical body itself.</p>
  RADAR: <p>The planetary radar. It measures distance directly, and only when the geometry allows.</p>
  IMPACT: <p>Entry and consequences. What the atmosphere does to an arriving body, and what is left over.</p>
  OPS: <p>The coordination office. Telescope time, international protocol, and what the public is told.</p>
  BOARD: <p>The briefing hall. The board meets here, and the record it publishes outlives everyone in the room.</p>
  TIME: <p>Time and frequency standards. Every timestamp on this mountain traces back to this building.</p>
  ARCHIVE: <p>The plate and data archive. Objects are often found years later in images already taken.</p>

            - 9.0e6 people (in the corridor)
            - 0.005 (impact probability)
            - 2.0e6 people (in the largest corridor city)
            - 0.05 (an earlier probability estimate)
            - 0.037 % (the ensemble figure)
          values: [9000000, 0.005, 2000000, 0.05, 0.037]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 45000
          tolerance: 3600
          units: people (expectation)
          solution: 9 × 10⁶ × 0.005 = 45,000 people, as an expectation.
          explanation: "A probability written as a percentage has to be converted before it is multiplied, which is what makes the 0.037 tile dangerous: it is the right quantity in the wrong units, and it would put the answer out by a factor of 100."
      - group: OPS
        task: Write the staged action thresholds before the next impact-probability updates arrive, then release the trace.
        title: Prepare without panic
        place: Scientific Advisory Board
        scene: Five orbit updates are queued. Regional planners can still prepare without evacuating anyone, but planning and pre-positioning both take time. The action thresholds must be locked before the updates begin. Once the stream starts, nobody gets to move them.
        guide: >-
          One rule, written before the next orbit updates arrive and fixed once the board is
          released. Standing up the planning cell takes two days from the moment it is called, and
          the last update of the campaign arrives with none left. So the line goes back from the end
          by those two days of climb — and not so far back that a cell is convened for an object
          which was never going to matter.
        background:
          - >-
              Why precommit before the stream. Orbit updates arrive one after another, each
              shifting the probability. A threshold adjusted while they come in is a
              rationalisation of what somebody already wanted to do, and it cannot be
              defended afterwards to the public or to the planners who acted on it.
          - >-
              Why two thresholds rather than one. Writing a plan takes weeks; moving
              supplies takes days and needs the plan to exist first. A single threshold set
              for the slower action triggers the faster one absurdly early, and set for the
              faster one leaves no time to plan at all.
          - >-
              What 'without panic' costs. Preparation is reversible and cheap; evacuation is
              neither. The thresholds have to keep the reversible actions available long
              enough that the irreversible one never becomes the only option left.
        assumes:
          - impact probability can change as new orbit data arrive
          - some preparations are reversible and require lead time
        takeaway: Good risk policy ties staged, reversible actions to evidence thresholds before the evidence moves.
        format: TRIGGER
        question: >-
          At what impact probability do you activate the regional planning cell, given it needs two days?
        trigger:
          hint: >-
            Write the threshold before releasing the updates. The planning cell takes two days to stand
            up, so a rule that fires with less than that has called something which cannot happen.
          scale:
            min: 0
            max: 2
            unit: "%"
            label: Impact probability
            anchors:
              - { at: 0.11, means: 'about one chance in 900 — the ordinary end of the risk list' }
              - { at: 1.4, means: 'one chance in 70, with the corridor over inhabited ground' }
          stream:
            - t: 0
              value: 0.11
              hoursLeft: 168
              at: day 0
              update: 0.11 % impact probability
            - t: 2
              value: 0.18
              hoursLeft: 120
              at: day 2
              update: 0.18 % impact probability
            - t: 4
              value: 0.35
              hoursLeft: 72
              at: day 4
              update: 0.35 % impact probability
            - t: 6
              value: 0.8
              hoursLeft: 24
              at: day 6
              update: 0.8 % impact probability
            - t: 7
              value: 1.4
              hoursLeft: 0
              at: day 7
              update: 1.4 % impact probability
          objective: >-
            The planning cell is standing while there is still margin to use it.
          rehearsal:
            note: the last object worked at this range
            stream:
              - { value: 0.09, hoursLeft: 168 }
              - { value: 0.14, hoursLeft: 120 }
              - { value: 0.22, hoursLeft: 72 }
              - { value: 0.15, hoursLeft: 24 }
              - { value: 0.05, hoursLeft: 0 }
          conditions:
            - id: planning
              label: Activate regional planning cell
              leadHours: 48
              window: { min: 0.15, max: 0.4 }
        answerText: >-
          Activate around 0.2 %. It fires on the 0.35 % update with 72 hours in hand, which covers
          the two days the cell needs; the 0.8 % update arrives with 24 hours and the last with
          none.
        why: A trigger is a decision rule written before the next number arrives. Preparation has lead time, so a scientifically correct action can still be useless if it begins too late. Precommitting thresholds also prevents hindsight from turning every new probability into a different standard. Tie early thresholds to reversible actions and later ones to costlier steps while the orbit solution continues to update. The goal is not to pretend the probability is certain; it is to connect uncertainty to staged actions that remain possible when the rule fires.
  - title: The Final Defense Review
    objective: Produce a claim-by-claim planetary-defense decision package and preserve monitoring after the immediate threat passes.
    briefing: The international board must decide whether the object is sufficiently characterized, whether the deflection worked, and which civil preparations remain necessary.
    stake: Eight years after the discovery, and the encounter is next week. The impactor struck 5 years ago; tracking since then puts the object about 2 Earth radii out, and some 5000 kilometres of that was bought by the impact. It was on a path nobody would have accepted. Nothing further can be done now, which is as it should be, because everything that could be done was done seven years ago. Today you take the claims one at a time with Garcia, write the public record with Ellery, and decide what stays funded once nobody is frightened. The population this object came from has not changed. The next 1 is up there now, unfound, and the survey line that caught this 1 expires in 11 months.
    takeaway: Use evidence synthesis, readiness, residual risk, international coordination, long-term stewardship as an evidence chain rather than as isolated facts.
    stops:
      - group: OPS
        task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
        title: Disposition the final claims
        place: International Review Hall
        scene: The board has to publish one account of an eight-year campaign, and the four claims in front of it carry very different weights of evidence. Whatever it writes will be read by whoever runs the next one.
        guide: >-
          Four claims and four dispositions. Pair them by asking what state each claim
          is in: confirmed, still open, out of date, or outliving this object. Giving
          four different states one confidence is how a document stops being trusted.
          And whoever runs the next campaign will read this one to find out what was
          actually established.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last
              pair looks forced: the fault is usually not in the join you are struggling
              with, but in one you made early and stopped questioning.
        takeaway: Planetary defense is a continuing evidence system, not a one-time heroic act.
        format: PROTOCOL
        columns:
          - What the evidence shows
          - What you do with it
        rebuttals:
          - An independently confirmed orbit shift is the strongest claim here and can be accepted, with verification continuing.
          - A poorly constrained tail is not a safe nominal. Collapsing the distribution onto its middle is the error the whole campaign was about.
          - Civil plans against an outdated corridor are worse than no plans, because somebody will use them.
          - Survey gaps have nothing to do with this object and everything to do with the next one.
        assumes:
          - a conclusion is only as strong as the evidence under it
        scenarios:
          - Post-impact tracking shows the required orbit shift with independent confirmation.
          - The nominal miss is safe, but a poorly constrained tail remains.
          - Civil plans are ready but based on an outdated corridor.
          - The object is no longer threatening, but survey gaps remain.
        choices:
          - Accept the deflection claim and continue verification.
          - Continue targeted observations; do not collapse the distribution to the nominal.
          - Update plans before operational use.
          - Fund long-term survey and preparedness improvements.
        mapping: [0, 1, 2, 3]
        why: Final review separates mission success, residual orbital uncertainty, civil readiness and future capability, because they are four different states and giving them one confidence is how a document becomes untrustworthy. Tracking that confirms the orbit shift independently is strong enough to accept while verification continues. A poorly constrained tail is a reason to keep observing rather than to collapse the distribution onto the nominal. Plans built on an outdated corridor have to be updated before anybody uses them. And survey gaps outlive this object entirely.
      - group: ORBIT
        task: Use the two remaining independent checks on the final-record claims that most need physical verification.
        title: Build the final public record
        place: Orbit Monitoring Center
        scene: The board has two independent checks left before release. Every claim is signed, but several could still change the public conclusion if wrong. The final record goes public tonight, and whatever survives becomes the starting point for the next threat.
        guide: >-
          Two independent checks left, and the record goes public tonight. Open each
          signed claim and read what actually backs it. Hold what the evidence does not
          support, and spend the checks where a wrong claim would most damage the public
          conclusion — because whatever survives tonight becomes the starting point for
          the next threat.
        background:
          - >-
              Why the public record is different. It is read by people who cannot inspect
              the evidence and cited by people who were not there. A claim corrected later
              has already shaped what the next team assumes, and corrections do not travel
              as far as the original.
          - >-
              What a signature means at this stage. Somebody took responsibility for a
              sentence, often on the basis of what a colleague told them. Under a release
              deadline, that is how an inference and an observation end up looking identical
              on the page.
          - >-
              How to spend two checks on several doubtful claims. By consequence, not by
              doubt. The claim that would misdirect the next mission is worth more
              verification than the one most likely to be wrong.
        assumes:
          - a signed record and an independently verified condition are different things
          - verification capacity is limited
        takeaway: A scientific record is strongest where critical claims can be independently reconstructed, not merely where every box is signed.
        format: ATTEST
        question: Which signed claims must be verified before the public record is released?
        attest:
          hint: Every card is signed, but a signature is only a record. You can independently verify two claims. Spend those checks where a wrong claim would materially change the scientific or public conclusion and where no independent backing already exists.
          claims:
            - id: orbit
              label: The current orbit solution and immediate encounter status are independently reproduced
              critical: true
              backed: true
              evidence: a second orbit pipeline using independent software and a separate astrometric subset reproduces the encounter solution
            - id: deflection
              label: The deflection record reports the measured post-impact Δv and its uncertainty
              critical: true
              backed: false
              evidence: raw pre/post astrometry and an independent fit reproduce a Δv near 2.1 cm/s
            - id: size_consequence
              label: The diameter and consequence range preserve the thermal/radar dependencies and uncertainty
              critical: true
              backed: false
              evidence: independent reprocessing reproduces the approximately 180 m size scale and the stated consequence envelope
            - id: discovery
              label: Discovery images, timestamps and provenance are archived
              critical: false
              backed: true
              evidence: archive checksum and provenance audit already completed
            - id: wording
              label: The public summary has final communications approval
              critical: false
              backed: false
              evidence: communications office signs the release wording
          checks: 2
        answerText: "Use the two independent checks on the critical claims that are still unbacked: the measured deflection and the size/consequence record. The orbit-status claim is already independently reproduced, while signatures and communications approval do not substitute for physical verification."
        why: A final scientific record is trustworthy when another person can reconstruct what was measured, how it was calibrated and which uncertainties remain. A signed statement documents approval, but it cannot establish the physical condition by itself. Verification should go first to critical claims that still lack independent backing. Rechecking an already reproduced orbit fit uses scarce capacity without strengthening the weakest link. The release is ready when the important conclusions have evidence chains that can survive failure of one person, instrument or analysis path.
      - group: OPS
        task: The campaign budget ends with this review. What survives it?
        title: Fund the planetary-defense legacy
        place: Mission Operations
        scene: The threat is gone, and so is most of the campaign budget. The discovery survey still misses parts of the sky, and two follow-up sites lose funding at year’s end. The board must decide what capability survives this success.
        guide: >-
          Four options, and the threat is gone along with most of the budget. Ask of
          each what it does to warning time. Finding an object earlier buys nights for
          the orbit, time for the size and rotation, and years for a small deflection to
          work. Nothing later in the chain can restore time that was never bought.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - warning time is produced by finding things, not by planning for them
        takeaway: The durable defense is an institution that can repeatedly detect, learn, decide, and act.
        format: CHOICE
        question: The campaign budget ends with this review. What survives it?
        why: Warning time supports almost every choice made later in the campaign. Finding an object earlier gives more nights for orbit checks. It also gives teams time to measure size, rotation, and composition. Years of warning can make a small deflection useful. Civil authorities can prepare in stages instead of acting all at once. Consequence models and communication still matter, but they cannot restore lost time. The strongest long-term investment is therefore a survey-and-follow-up system that finds objects early and keeps measuring them.
        choices:
          - Sustain survey completeness and rapid follow-up as the foundation, while preserving interfaces to characterization, response and preparedness.
          - Shift most recurring funds from discovery to characterization and deflection demonstrations because cataloguing is now largely complete.
          - Shift most recurring funds from discovery to civil preparedness because scientific warning will arrive automatically once an object is dangerous.
          - End new investment because the current catalogue and automated alerts make future discovery and follow-up a solved problem.
        answer: Sustain survey completeness and rapid follow-up as the foundation, while preserving interfaces to characterization, response and preparedness.
        rebuttals:
          - Characterization and deflection demonstrations are valuable, but they need an object to be found with enough warning for those options to exist.
          - Preparedness converts warning into action; it cannot create warning if the observing system never finds or recovers the object.
          - This campaign itself shows that blind geometry, coverage and follow-up capacity remain incomplete, so discovery is not automatic.
# What is inside each room.
interiors:
  DISC:
    caption: A detection is a claim that something moved, not that something is there.
    standLine: One faint moving point, two satellite trails and a hot pixel column in the same field.
    station:
      kind: panel
      title: Survey pipeline
      rows:
        - label: Detections tonight
          value: 41
          status: high
        - label: Candidate SNR
          value: 5.2
          status: alarm
        - label: Known objects rejected
          value: 39
          status: normal
  ORBIT:
    caption: A short arc allows a family of orbits, and some members of it hit the Earth.
    standLine: Six observatories reporting, two time standards, and an arc four hours long.
    station:
      kind: panel
      title: Orbit fit
      rows:
        - label: Arc length
          value: 4.1 h
          status: alarm
        - label: Astrometric residual
          value: 0.42 arcsec
          status: high
        - label: Observations used
          value: 22
          status: normal
  CHAR:
    caption: A bright asteroid is not necessarily a large one.
    standLine: One brightness, one assumed albedo, and a diameter the consequence model cubes.
    station:
      kind: panel
      title: Photometry bench
      rows:
        - label: Absolute magnitude
          value: 22.4
          status: normal
        - label: Assumed albedo
          value: borrowed
          status: alarm
        - label: Thermal data
          value: not yet taken
          status: low
  RADAR:
    caption: Four hours of dish time collapse an orbit that a month of imaging cannot.
    standLine: A window 4 hours wide that does not open again for 11 years.
    station:
      kind: vitals
      title: Delay-Doppler
      rows:
        - label: Round-trip delay
          value: 4.0 s
          status: normal
        - label: Window remaining
          value: 3.2 h
          status: alarm
        - label: Range precision
          value: 15 m
          status: high
  IMPACT:
    caption: The same diameter can produce a crater or a burst ten kilometres up.
    standLine: Three entry models, one reaching the ground, and a strength nobody has measured.
    station:
      kind: panel
      title: Entry model
      rows:
        - label: Kinetic energy
          value: 3.1e17 J
          status: alarm
        - label: Assumed strength
          value: unmeasured
          status: alarm
        - label: Entry angle
          value: 45 deg
          status: normal
  OPS:
    caption: Observing time is the scarce quantity, and information gain is what it should buy.
    standLine: Four hours of discretionary time, four proposals, and a press office asking for a line.
    station:
      kind: panel
      title: Coordination desk
      rows:
        - label: Impact probability
          value: 1 in 640
          status: alarm
        - label: Next radar window
          value: 9 days
          status: high
        - label: Follow-up committed
          value: 4 h
          status: normal

# What each place says when the player reads it.
# --------------------------------------------------------------- the warm-ups
# The ridge has two tiers: base camp, and the outstations a kilometre and a half
# along the road. The far lap is the night the vehicles are signed out.
warmups:
  trial-near:
    title: Walk base camp while it is still light
    why: >-
      Everything here is done in the dark, and the camp is seven buildings on a ridge with no
      street lighting. Nguyen, the survey imaging lead, walks every new observer round once
      before their first night, because a route learned in daylight is a route you can take at
      two in the morning with a red torch and no depth perception.
  greet:
    title: Two shifts that never overlap, and you are on both this week
    why: >-
      The day crew reduce what the night crew took, and the two hand over in eleven minutes at
      dawn. Garcia, the survey and response lead, wants you known to as many of them as you can
      before your first handover, because the whole survey runs on somebody trusting a
      measurement they did not take.
  trial-far:
    title: The outstations open tonight, and the keys come out
    why: >-
      The radar dish and the two outstations are a kilometre and a half down the ridge road and
      nothing out there has been called all week. From tonight they are on the list, and the
      vehicle is signed out to reach them. Drive it once in the light before you drive it at
      three in the morning.
  follow:
    title: Fischer walks the cable run once
    why: >-
      The dish's timing cable runs from the hut to the pad along a route nobody drew, and
      Fischer, the radar dynamics lead, knows every place it crosses the road. She walks it
      once. Stay with her: the places she stops are the places the cable is buried shallow, and
      those are the places it gets driven over.
  hunt:
    title: Six calibration lamps, and four are where the log says
    item: { name: calibration lamp, plural: calibration lamps }
    why: >-
      Every telescope on the ridge is calibrated against portable lamps, and two of them went
      out with somebody last week. Until all six are accounted for nobody can say the photometry
      is on one scale, and a survey on two scales is a survey that invents objects. Find them.
  canvass:
    title: Who saw the thing over the valley on Tuesday
    why: >-
      Half the valley reported a bright object on Tuesday night and the office has to say
      whether it was the re-entry everybody assumes or something else. Ask around the camp and
      the road until enough accounts have come back to separate one bright thing from two.
  evade:
    title: The visitor who wants to look through the telescope
    why: >-
      A donor's guest has been in the dome since dusk wanting to be shown something, and the
      survey cannot stop for it — every minute the shutter is off target is sky nobody covers
      tonight. Keep out of his way and get your round done.
  tag:
    title: Catch Rossi before he starts the fit
    why: >-
      Rossi, the orbit determination lead, has the two extra astrometric points from Monday that
      never made it into the file, and once the orbit fit is running it takes two hours and he
      will not stop it. The arc is short enough that two points change where this object is
      predicted to be next week.

copy:
  DISC: <p>The survey dome and its image processing room. Everything this campaign knows started as photons here.</p>
  ORBIT: <p>Orbit determination. Where a set of angles becomes a family of possible futures.</p>
  CHAR: <p>Spectroscopy and characterization. Size, reflectivity, spin and composition — the physical body itself.</p>
  RADAR: <p>The planetary radar. It measures distance directly, and only when the geometry allows.</p>
  IMPACT: <p>Entry and consequences. What the atmosphere does to an arriving body, and what is left over.</p>
  OPS: <p>The coordination office. Telescope time, international protocol, and what the public is told.</p>
  BOARD: <p>The briefing hall. The board meets here, and the record it publishes outlives everyone in the room.</p>
  TIME: <p>Time and frequency standards. Every timestamp on this mountain traces back to this building.</p>
  ARCHIVE: <p>The plate and data archive. Objects are often found years later in images already taken.</p>

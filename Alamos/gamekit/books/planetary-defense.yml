        takeaway: What makes a detection a real object is how it moves, not how bright or how sharp it looks.
        format: BELT
        question: Sort each detection into the bin that says whether it is really out there, or just the instrument or the sky.
        answerText: Anything that moves against the stars the same way, frame after frame, really is out there. Anything that shows up once, streaks, or never moves at all is the instrument or the sky.
        why: >-
          A survey camera does not really detect objects. It detects differences between one frame and the next, and the real work is deciding which differences are real things. A true object out in the solar system moves against the fixed stars the same way each time — same direction, same steady rate. That is why the survey uses four frames, not two. Three points lining up could be a coincidence. Four almost never are. Everything else fails that test, but each in its own way. A cosmic ray leaves its mark on one frame and is gone from the rest. A satellite crosses so fast it streaks within a single picture. A hot pixel or an internal reflection sits at a fixed spot in the camera. It moves only when the telescope is nudged, never when the sky turns. None of this is about how bright something looks. A bright, convincing blob can still be fake. That is exactly what wastes a follow-up night — and follow-up time is the one thing this survey has the least of.

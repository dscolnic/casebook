# Claude-ready mission book. Follows BOOK_TEMPLATE.md conventions.
# Exactly 15 missions, 3 stops per mission. Formats use exact importer names.
# Diagnosis is a first-class format: the full evidence panel is visible and quiet readings matter.
theme:
  id: planetary_defense
  title: Planetary Defense
  subtitle: "Campaign Director \xB7 International NEO Response"
groups:
- id: DISC
  code: DISC
  name: Discovery & Imaging
  color: '#315c78'
  desc: Images, signal-to-noise, moving-object detection, and artifact rejection.
  defaultLeader: nguyen
  milestones:
  - Validate the detection
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: ORBIT
  code: ORBIT
  name: Astrometry & Orbit
  color: '#704f88'
  desc: Sky position, timing, orbit fitting, covariance, and impact probability.
  defaultLeader: rossi
  milestones:
  - Constrain the orbit
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: CHAR
  code: CHAR
  name: Physical Characterization
  color: '#4b775f'
  desc: Brightness, albedo, spectra, rotation, size, and composition.
  defaultLeader: adebayo
  milestones:
  - Measure the body
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: RADAR
  code: RADAR
  name: Radar & Dynamics
  color: '#9a741d'
  desc: Range, delay, velocity, momentum transfer, and independent orbit constraints.
  defaultLeader: fischer
  milestones:
  - Add geometric leverage
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: IMPACT
  code: IMPACT
  name: Entry & Consequences
  color: '#9a3f36'
  desc: Energy, atmospheric entry, fragmentation, consequence uncertainty, and deflection physics.
  defaultLeader: banerjee
  milestones:
  - Bound the consequence
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
- id: OPS
  code: OPS
  name: Survey & Response
  color: '#3d6f52'
  desc: Completeness, observing geometry, response decisions, communication, and long-term readiness.
  defaultLeader: garcia
  milestones:
  - Turn evidence into action
  - Connect the evidence
  - Verify with an independent check
  - Ready to hand off
roster:
- id: nguyen
  name: Dr. Linh Nguyen
  role: Survey Imaging Lead
  division: DISC
  bio: Distinguishes real moving sources from cosmic rays, detector defects, and image-processing artifacts using repeated
    and independent observations.
- id: rossi
  name: Dr. Marco Rossi
  role: Orbit Determination Lead
  division: ORBIT
  bio: Treats every position as a timed measurement with calibration and covariance, then asks which observation reduces the
    dangerous uncertainty.
- id: adebayo
  name: Dr. Tola Adebayo
  role: Physical Characterization Lead
  division: CHAR
  bio: Combines brightness, color, spectra, thermal information, and rotation without pretending any one observable uniquely
    determines size or composition.
- id: fischer
  name: Dr. Anna Fischer
  role: Radar Dynamics Lead
  division: RADAR
  bio: Uses signal delay and Doppler measurements to add independent geometric constraints to optical astrometry.
- id: banerjee
  name: Dr. Rohan Banerjee
  role: Impact Physics Lead
  division: IMPACT
  bio: Connects size, density, speed, atmosphere, and fragmentation to consequence ranges rather than single deterministic
    outcomes.
- id: garcia
  name: Dr. Isabel Garcia
  role: Survey and Response Lead
  division: OPS
  bio: Balances observing completeness, uncertainty reduction, public communication, and response thresholds without confusing
    expected value with a prediction.
- id: virtanen
  name: Aino Virtanen
  role: Survey Pipeline Scientist
  division: DISC
  bio: |
    Owns the software that decides which of the night's forty thousand detections
    a human being ever sees. Most of what it flags is a satellite, a cosmic ray or
    a column of hot pixels.

    Her measure of the pipeline is not how many objects it finds but how many real
    ones it throws away, which can only be known by feeding it synthetic objects
    and counting how many come back.
  quiz:
    - q: How does Virtanen measure whether the survey is missing objects?
      a: By injecting synthetic sources into the images and counting how many the pipeline recovers
      wrong:
        - By comparing the number found this year with last year
        - By checking that no uncatalogued objects appear in the catalogue
        - By observing the same field twice on the same night
- id: delacroix
  name: Hugo Delacroix
  role: Astrometrist
  division: ORBIT
  bio: |
    Turns images into positions, which sounds mechanical and is where most orbit
    errors are actually born. A position is only as good as the star catalogue it
    was measured against and the clock that timestamped it.

    He looks for structure in residuals across the focal plane. A bias that grows
    toward the corner of a detector is an instrument problem wearing the costume
    of an orbital one.
  quiz:
    - q: What does Delacroix conclude from residuals that grow toward one corner of the detector?
      a: The error follows focal-plane position, so it is instrumental rather than orbital
      wrong:
        - The object is accelerating in a way gravity does not explain
        - The exposure times were recorded in the wrong time standard
        - The telescope was tracking at the wrong rate
- id: sorokin
  name: Irina Sorokin
  role: Thermal Infrared Observer
  division: CHAR
  bio: |
    Measures asteroids in the infrared, where what is seen is heat the body
    re-radiates rather than sunlight it reflects. That breaks the tie between a
    small bright object and a large dark one.

    Reflected light alone gives brightness, which is the product of size and
    reflectivity. Two unknowns, one measurement — and every consequence estimate
    downstream cubes whichever size you guessed.
  quiz:
    - q: Why does Sorokin's infrared measurement pin down a diameter that optical brightness cannot?
      a: Thermal emission depends on size and temperature rather than on the unknown reflectivity
      wrong:
        - Infrared telescopes have better angular resolution
        - Reflected light cannot be measured for faint objects
        - The infrared band is unaffected by distance
- id: mbeki
  name: Thabo Mbeki-Rowe
  role: Radar Astronomer
  division: RADAR
  bio: |
    Transmits at an asteroid and listens for the echo, which is the only method in
    this campaign that measures a distance directly instead of inferring it.

    The catch is geometry. Radar strength falls with the fourth power of distance,
    so the technique that collapses an orbit works for a few days per apparition
    and then not at all for years.
  quiz:
    - q: Why is a radar window so short and so valuable?
      a: Echo strength falls with the fourth power of distance, so it works only near closest approach
      wrong:
        - The transmitter overheats after a few hours of use
        - Radar requires the object to be in the Earth's shadow
        - Other observatories need the same time for optical work
- id: schulz
  name: Marta Schulz
  role: Impact Physics Modeller
  division: IMPACT
  bio: |
    Models what happens between the top of the atmosphere and the ground, where
    an object either arrives intact, breaks up and deposits its energy as a burst,
    or does something in between.

    Which of those happens depends on the body's strength, and strength is the
    quantity nobody has measured for the object in question. Her models therefore
    produce distributions, and she resists every request to reduce one to a
    headline number.
  quiz:
    - q: Why do Schulz's entry models produce a range of outcomes rather than one?
      a: The body's strength is unmeasured, and it decides whether the object fragments or reaches the ground
      wrong:
        - Atmospheric density is never known to better than a factor of two
        - The models are run on different computers with different rounding
        - Entry angle cannot be determined before impact
- id: ellery
  name: Joan Ellery
  role: Preparedness Coordinator
  division: OPS
  bio: |
    Translates a probability that keeps moving into actions that people can take
    without being made fools of when it moves again.

    Her tool is the pre-agreed trigger: what has to be observed, by when, for a
    given protective step to begin. Announced in advance, it survives a
    probability that falls; announced afterwards, it looks like improvisation.
  quiz:
    - q: Why does Ellery agree protective triggers before the probability settles?
      a: A step tied to a stated observation survives the probability changing; one announced afterwards looks arbitrary
      wrong:
        - Triggers reduce the uncertainty in the orbit determination
        - Regulations require evacuation plans to be filed in advance
        - Announcing them early prevents the media from reporting the risk
glossary:
- name: Astrometry
  aliases:
  - astrometry
  def: Measurement of an object position on the sky.
- name: Solar elongation
  aliases:
  - solar elongation
  def: The angular separation between an object and the Sun as seen from the observer.
- name: Albedo
  aliases:
  - albedo
  def: The fraction of incident light a surface reflects.
- name: Light curve
  aliases:
  - light curve
  def: Brightness measured as a function of time.
- name: Covariance
  aliases:
  - covariance
  def: A description of how uncertainties in fitted quantities vary together.
- name: Radar delay
  aliases:
  - radar delay
  def: Round-trip travel time of a radar signal, used to infer range.
missions:
- title: The Discovery Image
  objective: Validate a new-object candidate and preserve the measurements needed for follow-up.
  briefing: A survey telescope flags a faint moving point near the ecliptic. The player must determine whether it is a real
    Solar System object, an image artifact, or a known source.
  stake: If the candidate is real and close, every hour of delay expands the region where it may be lost.
  takeaway: Use digital images, signal-to-noise, artifacts, moving-object detection, controls as an evidence chain rather
    than as isolated facts.
  stops:
  - group: DISC
    task: Which explanation fits the motion, image shape, detector map, and independent follow-up?
    title: Object or artifact?
    place: Survey Telescope Control
    scene: >-
      The survey pipeline has flagged a faint point that moved between three
      exposures, in a field holding satellite trails and a hot pixel column. The
      alert about to go out would task observatories on three continents.
    takeaway: A discovery becomes convincing when motion is coherent in sky coordinates but not tied to one detector, exposure,
      or telescope.
    format: DIAGNOSIS
    rebuttals:
    - A cosmic ray is a single sharp hit in one exposure. This source is star-like in all three and keeps moving.
    - A hot pixel is bright wherever that pixel is read, so it stays put in detector coordinates. This one crosses pixels.
    - A registration error moves many stars together. Here the stars stay fixed and one point does not.
    assumes:
    - a detector has its own defects, and they sit still in detector coordinates
    headline: A survey pipeline flags a faint moving point near the ecliptic.
    readings:
    - zone: Three survey exposures
      label: Three survey exposures
      value: Source moves linearly between frames
      status: alarm
      note: Motion is consistent in time and direction
    - zone: Point-spread shape
      label: Point-spread shape
      value: Star-like in each exposure
      status: alarm
      note: Not a single-pixel spike
    - zone: Detector defect map
      label: Detector defect map
      value: No hot pixel at those positions
      status: normal
      note: The source crosses different detector pixels
    - zone: Background stars
      label: Background stars
      value: Remain fixed after astrometric alignment
      status: normal
      note: Image registration is stable
    - zone: Second telescope
      label: Second telescope
      value: Recovers source near predicted position
      status: alarm
      note: Independent hardware confirms motion
    choices:
    - label: Real moving Solar System object
      mechanism: A point source changes sky position coherently while stars and detector coordinates remain stable.
    - label: Cosmic-ray hit
      mechanism: A charged particle creates a transient sharp feature in one exposure.
    - label: Hot detector pixel
      mechanism: A fixed detector location appears bright whenever that pixel is read.
    - label: Image-registration artifact
      mechanism: Misalignment makes many fixed stars appear to shift together.
    answer: Real moving Solar System object
    why: >-
      A real Solar System object moves in the sky, not on the chip. That is the
      whole test, and four readings apply it. The source is star-like in every
      frame, so it is not a cosmic ray, which arrives once and sharp. It lands
      on different pixels while the background stars stay fixed, so it is not a
      hot pixel. And a second telescope on another mountain found it near the
      predicted place — an object that exists for instruments that are not this
      one.
  - group: DISC
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: Validate the discovery
    place: Image Processing Lab
    scene: >-
      Forty thousand catalogued stars, two satellite trails and a hot pixel
      column, and somewhere in the frames a moving point. Four steps to turn it
      into something another observatory can act on.
    takeaway: A discovery is useful only when another observer can test it.
    format: SEQUENCE
    rebuttals:
    - Calibrate first — positions from an uncalibrated frame are wrong in a way no later step recovers.
    - 'Reject the known second: stars, satellites, defects and catalogued objects, or you will measure them very precisely.'
    - Measure third, with uncertainties, because a position without one cannot be fitted to anything.
    - Submit last, with a predicted region. That is the step that makes it falsifiable by somebody who is not you.
    assumes:
    - a prediction somebody else can test is what makes a claim checkable
    cards:
    - Calibrate the images and identify transient or moving candidates.
    - Reject known stars, satellites, detector defects, and catalogued objects.
    - Measure position, time, brightness, and uncertainty for each detection.
    - Submit the candidate and predicted follow-up region to the tracking network.
    order:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Rejection has to come after calibration and before measurement, or every
      step measures the wrong thing. An uncalibrated frame gives positions that
      are wrong for instrumental reasons. Measuring before rejecting means
      astrometry on satellite trails and known asteroids. And the last step is
      what makes this a discovery rather than a claim: a predicted region hands
      somebody else a place to point and a way to prove you wrong.
  - group: ORBIT
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: How far did it move?
    place: Minor-Planet Operations Desk
    scene: >-
      The object shifted between two frames twenty minutes apart, and the desk
      has to say where the next telescope should point. Nobody has turned that
      shift into a rate yet.
    takeaway: Repeated images turn apparent motion into a measurable rate.
    format: BALLPARK
    assumes:
    - a rate is an amount divided by the time it took
    why: >-
      Twelve arcseconds in twenty minutes is 0.6 an arcsecond a minute, which is
      36 an hour. The 60 in the equation is minutes per hour, so the interval
      has to be in minutes too. Hand it the same twenty minutes written as 1,200
      seconds and the answer comes out sixty times too small — which would look
      like a main-belt object rather than something close.
    question: Estimate the apparent motion in arcseconds per hour.
    estimate:
      prompt: The object shifts 12 arcseconds in 20 minutes, and the desk needs a rate before it can predict where to look next.
      question: Estimate the apparent motion in arcseconds per hour.
      labels:
      - 12 arcsec (measured shift)
      - 20 min (between the two frames)
      - 3 exposures
      - 1,200 s (the same interval, in seconds)
      - 24 h
      values:
      - 12
      - 20
      - 3
      - 1200
      - 24
      slots: 2
      template: '{0} ÷ {1} × 60'
      formula: a/b*60
      correct:
      - 0
      - 1
      target: 36
      tolerance: 3
      units: arcsec/hour
      solution: 12 ÷ 20 = 0.6 arcsec/min, so about 36 arcsec/hour.
      explanation: The 60 in the template is minutes per hour, so the interval has to be in minutes. Handing it the same interval in seconds gives an answer 60 times too small — which would look like a main-belt object rather than something close.
- title: Confirm the Motion
  objective: Produce a consistent astrometric track and identify observations that should be down-weighted or repeated.
  briefing: Follow-up telescopes obtain positions with different clocks and plate solutions. The player must combine astrometry
    without creating a false trajectory from inconsistent reference frames.
  stake: A weak orbit can either lose the object or falsely place Earth in its path.
  takeaway: Use angular coordinates, plate calibration, time standards, uncertainty, residuals as an evidence chain rather
    than as isolated facts.
  stops:
  - group: OPS
    task: Which explanation fits the residual pattern across field position, timing, catalog stars, and the independent telescope?
    title: Why do the measured positions disagree?
    place: Follow-Up Telescope Network
    scene: >-
      Astrometry from one wide-field camera curves away from the orbit fit while
      a second telescope agrees with it. Everything the network has on both is
      on the screen, and the orbit is due to be published tonight.
    takeaway: 'Astrometric residuals can diagnose the instrument: a bias that follows focal-plane position rather than the
      moving object is a calibration signature.'
    format: DIAGNOSIS
    rebuttals:
    - Real acceleration acts on the asteroid alone. The reference stars would not follow it, and here they do.
    - A timing error shifts moving objects and leaves fixed stars correctly placed. Both are displaced here, and the clock checks out.
    - A catalogue-wide star error would show at the second telescope too, and across the whole field rather than growing toward one edge.
    assumes:
    - reference stars in the same frame are a control on the frame itself
    headline: Follow-up astrometry from one wide-field camera curves away from the orbit fit, while a second telescope agrees.
    readings:
    - zone: Asteroid residuals
      label: Asteroid residuals
      value: Grow toward field edge
      status: alarm
      note: Small near center, larger at large radius
    - zone: Reference-star residuals
      label: Reference-star residuals
      value: Show the same spatial pattern
      status: alarm
      note: Not unique to the asteroid
    - zone: Exposure timestamps
      label: Exposure timestamps
      value: Agree with observatory clock
      status: alarm
      note: No measurable timing jump
    - zone: Second telescope
      label: Second telescope
      value: Agrees with predicted orbit
      status: normal
      note: Independent instrument does not see the offset
    - zone: Distortion calibration
      label: Distortion calibration
      value: Older than current camera configuration
      status: alarm
      note: Geometric model may be stale
    choices:
    - label: Focal-plane distortion calibration error
      mechanism: A position-dependent mapping from detector coordinates to sky coordinates biases both stars and asteroid
        near the field edge.
    - label: Real asteroid acceleration
      mechanism: A physical force changes only the asteroid trajectory on the sky.
    - label: Timing error
      mechanism: Incorrect exposure time shifts moving-object positions while fixed reference stars remain correctly mapped.
    - label: Catalog-wide star error
      mechanism: The reference catalog is wrong in the same way for both telescopes and all field positions.
    answer: Focal-plane distortion calibration error
    why: >-
      The reference stars are the control, and they show the same spatial
      pattern as the asteroid. A residual that follows position on the focal
      plane belongs to the camera, not to the sky — real acceleration would move
      the asteroid and leave the stars alone. The timestamps agree with the
      observatory clock, so it is not timing. A second telescope agrees with the
      orbit, so it is not the orbit. What is left is the mapping from detector
      to sky, and the distortion calibration is older than the camera.
  - group: ORBIT
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: Build the observation arc
    place: Astrometry Lab
    scene: >-
      Six observatories have reported. Two use a different time standard, one
      recorded no plate solution at all, and together they cover four hours. The
      next uncertainty region has to come out of this.
    takeaway: Prediction is the operational test of an astrometric model.
    format: SEQUENCE
    rebuttals:
    - 'Common frame and clock first: two time standards in one fit is an error nobody sees in the residuals afterwards.'
    - A preliminary motion model second — you need something to take residuals against.
    - Residuals third, and read for structure. Scatter is noise; a pattern following one station is a fault.
    - Predict last. The test of an astrometric model is where the object turns up next, not how well it fits where it has been.
    assumes:
    - measurements only combine if they are in the same frame and the same clock
    cards:
    - Place every measurement in a common coordinate and time system.
    - Fit a preliminary sky-plane motion model.
    - Inspect residuals for station, time, or field-dependent structure.
    - Predict the next uncertainty region and schedule follow-up.
    order:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Nothing can be fitted across six observatories until every measurement is
      in one frame and one clock. Mix two time standards and the fit still
      converges — it just converges on the wrong orbit, and nothing in the
      residuals says so. Then read the residuals for structure rather than size:
      scatter is noise, but a pattern that follows one station or one part of a
      detector is a fault in the instrument. And the output that counts is where
      the object will be next, because that is the only claim the sky can
      refute.
  - group: OPS
    task: Four hours of discretionary time, and the object is faint and setting. What do you book?
    title: Buy the best next observation
    place: Time Standards Room
    scene: >-
      Four hours of discretionary telescope time, an object that is faint and
      setting, and a press office that has been asking since lunchtime whether
      it can say anything.
    takeaway: The best follow-up is chosen for information gain, not convenience or publicity.
    format: CHOICE
    assumes:
    - a short arc is consistent with many orbits at once
    question: Four hours of discretionary time, and the object is faint and setting. What do you book?
    choices:
    - A later observation that lengthens the time baseline.
    - Another exposure immediately, from the same telescope.
    - A geographically separated observation, for parallax.
    - A press release, before the object is confirmed.
    answer: A later observation that lengthens the time baseline.
    why: >-
      The orbit family is wide because the arc is short, and arc length is the
      quantity that collapses it. A point taken later changes the geometry the
      fit is solving; a point taken now barely changes anything the fit already
      has.
    rebuttals:
    - Another exposure tonight adds a measurement almost identical to the ones already held, and identical measurements do not narrow an orbit.
    - A separated observation adds parallax, which constrains distance rather than arc. It is the right second booking and answers a different question.
    - A release before confirmation spends the only thing the office cannot buy back, on an object that may not survive the next night.
- title: An Orbit from Sparse Data
  objective: Construct a family of allowed orbits and choose observations that collapse the dangerous dimensions.
  briefing: Only a short arc is available, and many three-dimensional orbits project to nearly the same sky motion. The player
    must reason with Keplerian motion and orbit families rather than report one overconfident solution.
  stake: An overconfident nominal orbit can hide impact solutions that remain inside the uncertainty region.
  takeaway: Use Keplerian orbits, state vectors, degeneracy, orbital elements, prediction as an evidence chain rather than
    as isolated facts.
  stops:
  - group: ORBIT
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: From angles to orbit family
    place: Orbit Determination Center
    scene: >-
      Every orbit that fits the arc projects to almost the same track across the
      sky. Some of them pass a million kilometres from Earth and some do not,
      and nothing measured so far separates them.
    takeaway: Uncertainty should be propagated as an ensemble of physically allowed trajectories.
    format: SEQUENCE
    rebuttals:
    - 'Directions and any range first: a set of angles alone leaves the distance free, which is the dimension the whole problem turns on.'
    - Generate states consistent with the uncertainties, not just the best fit. The best fit is one member of the family and has no special status.
    - Propagate each under gravity — the family has to be carried forward, not the average of it.
    - Compare the approach distances last. The spread across the family is the result; collapsing it to one number throws the question away.
    assumes:
    - angles alone do not fix a distance
    cards:
    - Combine timed directions and any range information.
    - Generate state vectors consistent with the observations and uncertainties.
    - Propagate each allowed state under gravity.
    - Compare future sky positions and Earth-approach distances across the family.
    order:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Sparse angular data define a region of state space rather than a single
      orbit, and the honest procedure is to keep the whole family. Combining the
      timed directions with any range comes first because range is what angles
      cannot supply. Generating the states consistent with the observations *and
      their uncertainties* is what makes it a family rather than a best fit.
      Each is then propagated under gravity, and the spread in where they end up
      is the answer — not the middle of it.
  - group: OPS
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Which orbit feature does the data constrain?
    place: Celestial Mechanics Group
    scene: >-
      Four kinds of evidence are on offer and the group has to say what each one
      buys before it spends any telescope time. Each is strong in a different
      direction.
    takeaway: Orbit determination is an information-geometry problem.
    format: PROTOCOL
    rebuttals:
    - A longer arc shows curvature, and curvature is what separates orbits that look identical over four hours.
    - Radar range is a distance measured rather than inferred — the one thing optical astrometry never gives you.
    - Range rate is how fast that distance is changing, which is a different quantity again.
    - Widely separated observers give parallax, and parallax is distance from geometry rather than from a fit.
    assumes:
    - different measurements constrain different parts of an orbit
    scenarios:
    - Longer observation arc.
    - Radar range.
    - Radar range rate.
    - Observations from widely separated Earth locations.
    choices:
    - Curvature and mean motion.
    - Line-of-sight distance.
    - Line-of-sight velocity.
    - Parallax and distance geometry.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Orbit determination is an information problem before it is an arithmetic
      one: what to buy next depends on which direction of the uncertainty is
      widest. Time is what makes curvature visible, so a longer arc constrains
      the shape. Radar range fixes the distance that optical work can only
      infer. Range rate fixes how fast that distance changes. And two widely
      separated observers see the object against different backgrounds, which is
      distance from geometry alone.
  - group: OPS
    task: Radar has a window in nine days. What do you do with the nine nights before it?
    title: Collapse the orbit uncertainty
    place: Follow-Up Scheduling Desk
    scene: >-
      The allowed orbits form a family rather than a line, and the corridor it
      sweeps across Earth's distance is wide enough to matter. Radar has a
      window in nine days.
    takeaway: A sharper-looking orbit is not a better orbit unless new evidence narrows the allowed family.
    format: CHOICE
    assumes:
    - an orbit narrows only when new evidence arrives
    question: Radar has a window in nine days. What do you do with the nine nights before it?
    choices:
    - Extend optical tracking over as many of them as the weather allows.
    - Hold the telescopes and wait for the radar range.
    - Observe from a second hemisphere for a parallax baseline.
    - Reprocess the existing data into a sharper nominal orbit.
    answer: Extend optical tracking over as many of them as the weather allows.
    why: >-
      The object is faint and setting, so every night not taken is arc that
      cannot be recovered later. Radar will measure a quantity optical work
      never can, and it will measure it against whatever arc exists by then.
    rebuttals:
    - Waiting for radar makes the whole campaign depend on one window and one weather forecast, and leaves the arc as short as it is tonight.
    - A second hemisphere adds parallax where the schedule allows it, and it does not replace the nights of arc that are about to be lost.
    - A sharper-looking orbit drawn from the same data is the most dangerous product on this list, because it looks like progress and narrows nothing.
- title: The Uncertainty Corridor
  objective: Report an impact probability and uncertainty corridor that remain meaningful as new data arrive.
  briefing: The nominal trajectory misses Earth, but a thin set of allowed solutions passes through it. The player must interpret
    probability, covariance, and nonlinear propagation without confusing low probability with zero consequence.
  stake: Poor communication can either create panic or delay preparations for a genuine low-probability, high-consequence
    threat.
  takeaway: Use probability distributions, covariance, nonlinear propagation, risk corridors, decision thresholds as an evidence
    chain rather than as isolated facts.
  stops:
  - group: IMPACT
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Read the risk correctly
    place: Impact Monitoring Center
    scene: >-
      The nominal orbit misses Earth. Four statements about what that does and
      does not mean are on the board at the monitoring centre, and a press line
      goes out this afternoon.
    takeaway: Planetary-defense risk lives in the distribution, not just the best-fit trajectory.
    format: PROTOCOL
    rebuttals:
    - A nominal miss is the middle of a distribution. It guarantees nothing while the distribution still reaches Earth.
    - A thin set of impacting solutions is a nonzero probability, and small is not the same as absent.
    - Data that remove impact solutions really do lower the risk — that is what the number is for.
    - A rising probability beside a growing nominal miss is geometry redistributing what is left, not an error.
    assumes:
    - a best-fit trajectory is the middle of a distribution, not the whole of it
    scenarios:
    - Nominal orbit misses Earth.
    - A small fraction of allowed orbits intersect Earth.
    - New data remove most impact solutions.
    - Probability rises after an observation even though the nominal miss distance increases.
    choices:
    - A miss is not guaranteed while uncertainty remains.
    - Impact probability is nonzero and should be monitored.
    - Risk has decreased because the allowed region changed.
    - Nonlinear geometry can redistribute probability; inspect the full solution set.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Risk lives in the distribution of allowed trajectories rather than in the
      best-fit one, and that has consequences people find counter-intuitive. A
      nominal miss with allowed solutions passing through Earth is a real risk
      with a small probability. New data that remove impact solutions lower it
      legitimately. And probability can *rise* after an observation while the
      nominal miss distance grows, because shrinking the uncertainty region can
      concentrate what is left onto Earth. The number moving is not the same as
      somebody having been wrong.
  - group: ORBIT
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Probability from an ensemble
    place: Statistical Orbit Lab
    scene: >-
      A simplified Monte Carlo run has finished at the statistical orbit lab.
      What it produced is a count of samples, and the figure that leaves this
      room will be quoted in public for years.
    takeaway: A tiny probability can be estimated only with enough samples and a valid uncertainty model.
    format: BALLPARK
    assumes:
    - a probability can be estimated by counting outcomes over trials
    why: The figure is only as good as the sampling behind it, and it will be quoted in public long after the assumptions are forgotten.
    question: Estimate the impact probability, as a percentage.
    estimate:
      prompt: In a simplified Monte Carlo set, 37 of 100,000 sampled trajectories consistent with the observations strike Earth.
      question: Estimate the impact probability, as a percentage.
      labels:
      - 37 impacting samples
      - 100,000 samples drawn
      - 1,000 samples (the first quick run)
      - 99,963 samples that miss
      - 8 years to encounter
      values:
      - 37
      - 100000
      - 1000
      - 99963
      - 8
      slots: 2
      template: '{0} ÷ {1} × 100'
      formula: a/b*100
      correct:
      - 0
      - 1
      target: 0.037
      tolerance: 0.004
      units: '%'
      solution: 37/100,000 = 3.7 × 10⁻⁴, or 0.037%.
      explanation: The denominator is every sample drawn, not the ones that missed — dividing by the misses gives almost the same number here and the wrong quantity everywhere. A thousand samples could not have resolved a probability this small at all.
  - group: OPS
    task: A thin set of solutions still hits Earth. Where do you point next week?
    title: Reduce the dangerous uncertainty
    place: Planetary Defense Coordination Office
    scene: >-
      The nominal orbit misses comfortably. A thin set of solutions inside the
      uncertainty does not, and those solutions predict a sky position a few
      arcseconds from the rest in about a week.
    takeaway: The best observation separates the live hypotheses rather than merely adding another point.
    format: CHOICE
    assumes:
    - a measurement is informative where the candidate explanations disagree
    question: A thin set of solutions still hits Earth. Where do you point next week?
    choices:
    - Where the impacting and non-impacting solutions predict different positions.
    - Wherever the object is brightest and easiest to measure.
    - At the same fields again, to improve the astrometric bias calibration.
    - Nowhere new — run the arc through independent orbit software.
    answer: Where the impacting and non-impacting solutions predict different positions.
    why: >-
      A measurement is informative only where the live hypotheses disagree.
      Everywhere else, both families predict the same thing, so the observation
      is guaranteed to confirm what nobody was disputing — and that condition is
      a place and a date rather than a telescope.
    rebuttals:
    - The brightest field is the easiest measurement and the least informative one; every solution already agrees about where the object will be.
    - Bias calibration improves every measurement a little and separates the two families not at all.
    - Independent software checks the arithmetic rather than the sky. Worth doing, and it adds no observation.
- title: How Large Is It?
  objective: Produce a diameter range rather than a single unsupported value.
  briefing: "The object\u2019s brightness is known, but size depends strongly on reflectivity. The player must combine photometry,\
    \ albedo, and thermal evidence to bound diameter."
  stake: Impact energy depends strongly on size, so a factor-of-two diameter error becomes a much larger mass and energy error.
  takeaway: Use brightness, inverse-square law, albedo, thermal emission, size degeneracy as an evidence chain rather than
    as isolated facts.
  stops:
  - group: CHAR
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: What controls apparent brightness?
    place: Photometry Lab
    scene: >-
      The object was bright enough for a survey telescope to find, and that
      single number is being read across the room as a size. Four things that
      change reflected flux are on the board.
    takeaway: A bright asteroid is not necessarily large.
    format: PROTOCOL
    rebuttals:
    - A larger cross-section intercepts and returns more light — the term everybody assumes is the only one.
    - Higher reflectivity returns more of what arrives, at the same size. This is the one that makes brightness ambiguous.
    - Greater distance from the Sun means less light arriving to be reflected at all.
    - Greater distance from the observer spreads what does return, so less of it reaches the telescope.
    assumes:
    - light spreads out with distance
    scenarios:
    - Larger cross-sectional area.
    - Higher reflectivity.
    - Greater distance from the Sun.
    - Greater distance from the observer.
    choices:
    - Usually increases reflected flux.
    - Increases reflected flux for the same size and geometry.
    - Reduces illumination.
    - Reduces received flux through geometric spreading.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Brightness is the product of all four, which is why the size everybody
      wants is entangled with a reflectivity nobody has measured. A bigger
      cross-section reflects more. A more reflective surface reflects more of
      what arrives. Distance from the Sun sets how much arrives in the first
      place. Distance from the observer sets how much of what leaves the object
      reaches the telescope. The same flux comes from a small bright body close
      in or a large dark one further out.
  - group: OPS
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Diameter-albedo degeneracy
    place: Infrared Telescope Team
    scene: >-
      Two objects show the same reflected brightness and one is four times as
      reflective as the other. The infrared team wants the size comparison
      written down before anybody quotes a diameter.
    takeaway: Photometry alone cannot uniquely determine size without an albedo assumption.
    format: BALLPARK
    assumes:
    - the area of a disc goes as the square of its diameter
    why: >-
      Brightness fixes the product of area and reflectivity. Four times the
      albedo at the same brightness therefore needs a quarter of the area. But
      diameter goes as the square root of area, so a quarter of the area is half
      the diameter, not a quarter of it. That is the whole degeneracy:
      photometry alone cannot separate a small bright rock from a large dark
      one, and every size quoted from brightness has an assumed reflectivity
      inside it.
    question: How does the higher-albedo object's diameter compare?
    estimate:
      prompt: Two objects show the same reflected brightness and one has four times the albedo of the other. Reflected flux scales with cross-sectional area times reflectivity.
      question: How does the higher-albedo object's diameter compare?
      labels:
      - 1.0 (reflected brightness, relative)
      - 4.0 (albedo, relative)
      - 2.0 (the square root of the albedo ratio)
      - 16.0 (the albedo ratio, squared)
      - 0.25 (the reciprocal of the albedo ratio)
      values:
      - 1.0
      - 4.0
      - 2.0
      - 16.0
      - 0.25
      slots: 2
      template: √( {0} ÷ {1} )
      formula: Math.sqrt(a/b)
      correct:
      - 0
      - 1
      target: 0.5
      tolerance: 0.05
      units: × the diameter of the darker object
      solution: Four times the albedo at the same brightness means a quarter of the area, so half the diameter.
      explanation: Brightness fixes the product of area and reflectivity, so four times the reflectivity requires a quarter of the area — and diameter goes as the square root of area, not as area. The tile that has already taken the square root is the trap.
  - group: CHAR
    task: The diameter rests on an albedo borrowed from another class. What do you measure?
    title: Bound the diameter
    place: Physical Characterization Group
    scene: >-
      The consequence estimate scales with diameter cubed, and the diameter
      currently rests on a reflectivity borrowed from a different class of
      asteroid. The characterisation group has time for one measurement.
    takeaway: Physical characterization improves when methods break the same degeneracy in independent ways.
    format: CHOICE
    assumes:
    - a quantity inferred through an assumption is only as good as the assumption
    question: The diameter rests on an albedo borrowed from another class. What do you measure?
    choices:
    - Thermal-infrared emission.
    - Multi-band reflected light and phase behaviour.
    - Radar, as soon as the geometry allows it.
    - Nothing — adopt the average albedo of the assumed class.
    answer: Thermal-infrared emission.
    why: >-
      Emitted heat depends on size and temperature rather than on how reflective
      the surface is, so it breaks the degeneracy from outside it. Every
      measurement made in reflected light still carries an albedo assumption
      inside the answer.
    rebuttals:
    - Multi-band photometry and phase behaviour constrain the surface itself, and the size stays entangled with whatever they imply about it.
    - Radar gives a diameter directly and only when the geometry allows, which it will not for months. Book it; do not wait on it.
    - Adopting the class average is free and reproduces exactly the problem it was meant to solve, with the assumption now buried in a number.
- title: What Is It Made Of?
  objective: Assign a composition class with explicit alternatives and confidence.
  briefing: Spectra show broad features, but weathering, grain size, and viewing geometry complicate composition. The player
    must avoid turning a taxonomic resemblance into an exact material claim.
  stake: Composition affects density, fragmentation, and deflection response, so an unsupported label can distort every later
    model.
  takeaway: Use spectra, absorption features, mineralogy, taxonomy, model ambiguity as an evidence chain rather than as isolated
    facts.
  stops:
  - group: CHAR
    task: Which explanation fits the target, standard star, airmass, and space-based comparison?
    title: Real absorption or spectral artifact?
    place: Spectroscopy Observatory
    scene: >-
      A broad dip near 1.4 microns has appeared in the spectrum, and it would
      change the composition class if it is real. The observatory has the
      standard star, the airmass record and a space-based spectrum of the same
      object.
    takeaway: A spectrum contains the telescope, detector, Earth atmosphere, and target all at once; composition requires
      separating those layers.
    format: DIAGNOSIS
    rebuttals:
    - A mineral absorption belongs to the surface, so it would not appear in a standard star observed the same night.
    - A flat-field error is fixed in the detector and would not deepen as the telescope looks through more air.
    - Noise does not reproduce as the same broad feature at the same wavelength in two different objects.
    assumes:
    - a ground-based spectrum is taken through the Earth's atmosphere
    headline: A spectrum seems to show a broad absorption feature that could change the inferred surface composition.
    readings:
    - zone: Asteroid spectrum
      label: Asteroid spectrum
      value: Broad dip near 1.4 microns
      status: alarm
      note: Candidate composition feature
    - zone: Standard-star spectrum
      label: Standard-star spectrum
      value: Dip at the same wavelength
      status: alarm
      note: Observed through the same atmosphere
    - zone: Airmass dependence
      label: Airmass dependence
      value: Feature deepens at larger airmass
      status: alarm
      note: Tracks atmospheric path length
    - zone: Detector flat field
      label: Detector flat field
      value: Stable
      status: normal
      note: No matching pixel-scale sensitivity defect
    - zone: Space-based spectrum
      label: Space-based spectrum
      value: Feature absent
      status: alarm
      note: No terrestrial atmosphere in that observation
    choices:
    - label: Asteroid mineral absorption
      mechanism: Surface material absorbs light at that wavelength.
    - label: Telluric atmospheric absorption
      mechanism: Molecules in Earth atmosphere imprint the same wavelength-dependent feature on ground-based spectra.
    - label: Detector flat-field error
      mechanism: Pixel sensitivity creates a fixed instrumental dip independent of atmospheric path.
    - label: Random noise
      mechanism: An uncorrelated fluctuation happens to mimic a broad repeatable feature.
    answer: Telluric atmospheric absorption
    why: >-
      A ground-based spectrum contains the telescope, the detector, the Earth's
      atmosphere and the target, all at once. Three readings separate them here.
      The standard star has the same dip, and a star does not share an
      asteroid's minerals — only its air. The feature deepens with airmass,
      which is more atmosphere in the path. And it is absent from a spectrum
      taken above the atmosphere entirely. Water vapour absorbs near this
      wavelength, which is why 1.4 microns is where this trap lives.
  - group: OPS
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: From photons to composition class
    place: Meteorite Comparison Lab
    scene: >-
      The spectrum has two broad features and a slope, and three mineral models
      reproduce all of them within the noise. Space weathering reddens a
      surface, grain size changes band depth, and viewing geometry shifts the
      continuum.
    takeaway: A good composition result retains the plausible alternatives.
    format: SEQUENCE
    rebuttals:
    - 'Calibrate first: the Sun''s own spectrum and the atmosphere''s are in the recording, and a band found before they are removed may be theirs.'
    - Reflectance second — it is the quantity that belongs to the object rather than to the observation.
    - Robust features and several models third, because weathering, grain size and geometry all mimic a compositional difference.
    - Report the alternatives last. A class stated without them is a claim the data cannot support.
    assumes:
    - what a telescope records includes everything the light passed through
    cards:
    - Calibrate solar, atmospheric, and instrument response.
    - Measure reflectance as a function of wavelength.
    - Identify robust features and compare multiple physical models.
    - Report supported classes, alternatives, and needed follow-up.
    order:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Calibration has to come before interpretation because the Sun, the
      atmosphere and the instrument are all in the recorded signal, and a
      feature identified before they are removed may belong to any of them.
      Reflectance against wavelength is then a property of the object. Only then
      is it worth asking which features are robust — and comparing several
      physical models rather than one is what stops space weathering being read
      as composition. The report keeps the alternatives, because three models
      still fit.
  - group: OPS
    task: One spectrum, one phase angle, one rotation — and a draft circular naming a class. What do you require?
    title: Improve the composition claim
    place: Composition Review Room
    scene: >-
      The draft circular names a composition class outright. Behind it are one
      spectrum, at one phase angle, on one rotation — and the deflection team is
      about to size a spacecraft from the density that class implies.
    takeaway: Characterization should seek discriminating evidence rather than stronger labels.
    format: CHOICE
    assumes:
    - a measurement made one way can be wrong one way
    question: One spectrum, one phase angle, one rotation — and a draft circular naming a class. What do you require?
    choices:
    - Wavelength coverage extended beyond the current range.
    - Observations at other phase angles and rotational phases.
    - Polarimetry or a radar texture constraint.
    - Nothing further — publish the class and note the uncertainty.
    answer: Wavelength coverage extended beyond the current range.
    why: >-
      Three mineral models already reproduce every feature in the spectrum
      within the noise. More wavelengths is what makes those models predict
      different things — and a claim the current data could not have
      contradicted is not yet a measurement.
    rebuttals:
    - Other phase angles and rotations test whether the surface is uniform, which matters once the candidate classes are narrowed rather than before.
    - Polarimetry and radar texture constrain grain structure by different physics and are the right independent check on whichever class survives.
    - Publishing the class with a note attached is the same claim in smaller type, and the deflection team will size a spacecraft from the density it implies.
- title: The Spinning Target
  objective: Produce a rotation-state range suitable for imaging and deflection planning.
  briefing: Brightness varies dramatically over hours, suggesting rotation and an elongated shape. The player must derive
    a period, identify aliases, and determine whether the body may be tumbling.
  stake: A mistimed encounter can image or strike the wrong face of the asteroid.
  takeaway: Use periodic signals, light curves, aliasing, rotation, shape inference as an evidence chain rather than as isolated
    facts.
  stops:
  - group: CHAR
    task: Which explanation fits the repeatability, comparison stars, filters, and observing geometry?
    title: Rotation or observing artifact?
    place: Time-Series Photometry Network
    scene: >-
      The asteroid brightens and fades by a few tenths of a magnitude, repeating
      near 4.8 hours. The network wants to use that as the rotation period for
      mission planning, and the comparison stars are on the same frames.
    takeaway: Periodicity becomes physical evidence only after environmental and instrumental periodicities are ruled out.
    format: DIAGNOSIS
    rebuttals:
    - Passing cloud changes every source in the frame together, and the comparison stars are steady to within noise.
    - A detector drift belongs to a region of the chip, and this repeats while the object moves across pixels.
    - The phase angle changes slowly and monotonically over the whole run. It cannot produce a cycle every few hours.
    assumes:
    - the atmosphere and the instrument have their own rhythms
    headline: The asteroid brightens and fades by a few tenths of a magnitude.
    readings:
    - zone: Asteroid brightness
      label: Asteroid brightness
      value: Repeats every 4.8 hours
      status: alarm
      note: Pattern appears across two nights
    - zone: Comparison stars
      label: Comparison stars
      value: Stable to within measurement noise
      status: normal
      note: Sky transparency and calibration remain steady
    - zone: Two filters
      label: Two filters
      value: Same period in both
      status: alarm
      note: Not confined to one detector response band
    - zone: Detector position
      label: Detector position
      value: Object lands on different pixels
      status: alarm
      note: Pattern does not follow one pixel region
    - zone: Phase-angle trend
      label: Phase-angle trend
      value: Slow monotonic change only
      status: alarm
      note: Too slow to create the repeating cycle
    choices:
    - label: Asteroid rotation
      mechanism: An irregular shape or surface pattern presents changing projected brightness as the body spins.
    - label: Passing clouds
      mechanism: Atmospheric transparency changes all sources together.
    - label: Detector sensitivity drift
      mechanism: One detector region changes response with time.
    - label: Phase-angle change
      mechanism: The Sun-object-observer geometry changes brightness smoothly over the observing span.
    answer: Asteroid rotation
    why: >-
      Periodicity becomes physical evidence only after the periodicities of the
      atmosphere, the instrument and the observing schedule have been ruled out
      — which is what the comparison stars and the second filter are for. Stars
      on the same frames are stable, so it is not transparency. The period
      survives a change of filter, so it is not one detector channel. The object
      lands on different pixels, so it is not a patch of the chip. And the
      phase-angle trend is far slower than 4.8 hours.
  - group: OPS
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Rotation period from repeating peaks
    place: Rotation Dynamics Lab
    scene: >-
      Similar maxima in the light curve are separated by 3.5 hours. An elongated
      body presents its long profile twice in every turn, and the spacecraft has
      to arrive at a known face.
    takeaway: A measured repetition time is not always the physical period.
    format: BALLPARK
    assumes:
    - a shape that repeats twice per turn is seen twice per turn
    why: A spacecraft arriving at the wrong rotational phase meets a different face of the target than the one it was designed for, and the factor of two is where that error comes from.
    question: Estimate the candidate rotation period.
    estimate:
      prompt: Similar maxima in the light curve are separated by 3.5 hours, and an elongated body presents its long profile twice per rotation.
      question: Estimate the candidate rotation period.
      labels:
      - 3.5 h (between similar maxima)
      - 2 maxima per rotation
      - 1.75 h (half the spacing between maxima)
      - 4 maxima per rotation
      - 0.3 mag (the amplitude)
      values:
      - 3.5
      - 2
      - 1.75
      - 4
      - 0.3
      slots: 2
      template: '{0} × {1}'
      formula: a*b
      correct:
      - 0
      - 1
      target: 7
      tolerance: 0.5
      units: h
      solution: 3.5 h between maxima, two maxima per turn, so about 7 h.
      explanation: 'The repetition time is not the period. Multiplying rather than dividing is the whole point: a body that shows two maxima per rotation repeats twice as often as it turns, so the period is longer than the spacing, not shorter.'
  - group: OPS
    task: A single rotation, half of one, or a tumbler — and the spacecraft launches on whichever is true. What do you organise?
    title: Resolve the spin state
    place: Mission Design Office
    scene: >-
      The light curve varies by a factor of three over about seven hours, which
      could be one rotation, half of one, or a tumbling body seen from a
      changing angle. The spacecraft launches on whichever is true.
    takeaway: Mission timing should be based on a rotation model tested across time and viewpoint.
    format: CHOICE
    assumes:
    - a gap in coverage can hide a period
    question: A single rotation, half of one, or a tumbler — and the spacecraft launches on whichever is true. What do you organise?
    choices:
    - Continuous longitude coverage across several observatories.
    - Higher-cadence photometry through one long night.
    - Light curves combined across changing viewing geometry.
    - A provisional period, adopted now so the design can proceed.
    answer: Continuous longitude coverage across several observatories.
    why: >-
      A period hides in the gaps, and the gaps are one site's daylight. Coverage
      around the Earth removes the aliases before anything is fitted, which is
      what stops a half-period being adopted as a period.
    rebuttals:
    - High cadence through one night refines a curve that may be the wrong curve, at higher precision.
    - Combining light curves across changing geometry is what tests whether one period explains all of them, and it needs a gap-free curve to combine.
    - 'Adopting a provisional period is the failure this stop exists to prevent: the spacecraft arrives at a rotational phase chosen by an assumption.'
- title: Radar Contact
  objective: Design a radar sequence that improves both orbit and physical characterization.
  briefing: A planetary radar window opens for several hours. Range and Doppler measurements could collapse the orbit and
    reveal shape, but only if the observation plan uses the limited signal effectively.
  stake: Missing the radar window can leave years of orbit and size uncertainty unresolved.
  takeaway: Use radar ranging, Doppler shift, resolution, signal-to-noise, inverse problems as an evidence chain rather than
    as isolated facts.
  stops:
  - group: RADAR
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: What does radar measure?
    place: Planetary Radar Facility
    scene: >-
      The radar window opens in hours and the room has to agree what each
      observable delivers before it writes the sequence. Four of them are on the
      board.
    takeaway: Active sensing can transform orbit and shape knowledge during a short window.
    format: PROTOCOL
    rebuttals:
    - Delay is time of flight and therefore range — the quantity optical astrometry can only infer from a fit.
    - Doppler spread is a spread of velocities across the body, which is what a rotating object produces.
    - 'Echo power against delay maps reflecting area by distance: shape and scattering, not position.'
    - Repeated delay-Doppler images across a turn are what build a shape model, which no single image contains.
    assumes:
    - radar sends a signal out and measures what comes back
    scenarios:
    - Echo delay.
    - Doppler frequency spread.
    - Echo power versus delay.
    - Repeated delay-Doppler images.
    choices:
    - Range.
    - Distribution of line-of-sight rotational velocities.
    - Range-resolved reflecting area and scattering.
    - Changing shape and rotation constraints.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Radar separates dimensions that optical images entangle, and each
      observable separates a different one. Echo delay is time of flight, so it
      is a distance, measured rather than fitted. Doppler spread across the echo
      is the range of line-of-sight velocities across the body, which is
      rotation. Echo power against delay says how much surface sits at each
      distance, which is shape and roughness. And repeated delay-Doppler images
      across a rotation build the three-dimensional model none of the others
      gives on its own.
  - group: OPS
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Range from radar delay
    place: Delay-Doppler Analysis Lab
    scene: >-
      The dish transmits and the echo returns four seconds later. The analysis
      lab wants the range before the orbit group meets, and the signal covers
      the distance twice.
    takeaway: The factor of two reflects the outbound and return travel.
    format: BALLPARK
    assumes:
    - radio travels at the speed of light
    why: Optical astrometry constrains direction and leaves distance to be inferred from the fit. This measures the distance itself, to metres, in four seconds.
    question: Estimate the range to the object.
    estimate:
      prompt: The dish transmits and the echo returns four seconds later. The signal covers the distance twice.
      question: Estimate the range to the object.
      labels:
      - 3.0e8 m/s (speed of light)
      - 4.0 s (round-trip delay)
      - 2 (out and back)
      - 2.0 s (half the delay)
      - 1.5e8 m/s (light speed, halved already)
      values:
      - 300000000.0
      - 4.0
      - 2
      - 2.0
      - 150000000.0
      slots: 3
      template: '{0} × {1} ÷ {2}'
      formula: a*b/c
      correct:
      - 0
      - 1
      - 2
      target: 600000000.0
      tolerance: 50000000.0
      units: m
      solution: Range = ct/2 = 6.0 × 10⁸ m.
      explanation: The factor of two can be taken out of the time or out of the speed, but not out of both — the two tiles that have already halved something are there to be noticed and left alone.
  - group: ORBIT
    task: Four hours, and the window does not repeat for eleven years. What comes first?
    title: Use the radar window
    place: Orbit Center
    scene: >-
      Four hours of radar, and the geometry does not repeat for eleven years.
      Three of the four things the room could do with it are worth doing and
      only some of them fit.
    takeaway: Scarce observing time should target information unavailable from routine methods.
    format: CHOICE
    assumes:
    - an opportunity that does not repeat has to be spent on what nothing else can supply
    question: Four hours, and the window does not repeat for eleven years. What comes first?
    choices:
    - High-precision range and range-rate.
    - Delay-Doppler imaging across a full rotation.
    - Calibration and background observations.
    - A brightness measurement, at higher signal than optical can reach.
    answer: High-precision range and range-rate.
    why: >-
      Range collapses the orbit uncertainty in exactly the direction optical
      astrometry leaves widest, and it is the measurement that decides whether
      there is a deflection problem to solve at all. Everything else the window
      could buy is worth less if the orbit stays ambiguous.
    rebuttals:
    - Delay-Doppler imaging gives the shape and spin the deflection design needs, and a beautifully imaged asteroid on an unresolved orbit is not a plan.
    - Calibration protects both measurements and consumes window. Take the minimum that makes the range defensible.
    - Spending planetary radar on a brightness any optical telescope can measure tonight is the one indefensible use of a window eleven years wide.
- title: Impact Energy
  objective: Provide low, central, and high impact-energy scenarios with transparent assumptions.
  briefing: The latest size and speed estimates imply regional consequences, but uncertainty in diameter, density, and velocity
    spans a wide range. The player must compute scales without presenting a false point estimate.
  stake: An exaggerated point estimate can create panic; an understated one can leave emergency planning unprepared.
  takeaway: Use mass and density, kinetic energy, scaling, uncertainty propagation, orders of magnitude as an evidence chain
    rather than as isolated facts.
  stops:
  - group: IMPACT
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Energy of a notional impactor
    place: Impact Physics Group
    scene: >-
      Civil defence will not convene anybody without an energy figure. The
      impact physics group has a radius, a density from the presumed composition
      class, and an approach speed, each with its own uncertainty.
    takeaway: Impact energy couples geometric, material, and orbital measurements.
    format: BALLPARK
    assumes:
    - kinetic energy depends on mass and on speed
    - the volume of a sphere goes as the cube of its radius
    why: >-
      Mass is the volume of a sphere times its density, and energy is half that
      mass times the speed squared. The trap is the first number: the formula
      takes a radius, and a diameter dropped into it gives an object eight times
      too heavy. That factor of eight is the same one that makes the size
      measurement worth more than any other, which is what the next stop is
      about.
    question: Estimate the impact kinetic energy.
    estimate:
      prompt: The best current estimates are a radius near 50 metres, a density around 3,000 kg per cubic metre, and an approach speed of about 20 kilometres a second.
      question: Estimate the impact kinetic energy.
      labels:
      - 50 m (radius)
      - 3,000 kg/m³ (density)
      - 20,000 m/s (approach speed)
      - 100 m (diameter)
      - 11,000 m/s (Earth escape velocity)
      values:
      - 50
      - 3000
      - 20000
      - 100
      - 11000
      slots: 3
      template: 0.5 × ( (4π/3) {0}³ {1} ) × {2}²
      formula: 0.5*((4*Math.PI/3)*a*a*a*b)*c*c
      correct:
      - 0
      - 1
      - 2
      target: 3.1416e+17
      tolerance: 4e+16
      units: J
      solution: Mass about 1.6 × 10⁹ kg, kinetic energy about 3 × 10¹⁷ J.
      explanation: The sphere formula takes a radius, and the diameter tile put into it gives an object eight times too massive. That factor of eight is the same one that makes the diameter measurement worth more than any other.
  - group: OPS
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Which uncertainty dominates?
    place: Risk Analysis Center
    scene: >-
      The consequence estimate is dominated by whichever input has the steepest
      scaling, and four candidates are on the board at the risk analysis centre.
      Only one measurement can be improved before the briefing.
    takeaway: The most important measurement is often the one attached to the steepest scaling.
    format: PROTOCOL
    rebuttals:
    - Diameter is cubed through the volume, so a modest error in it is a large error in energy.
    - Density enters linearly. Doubling it doubles the mass and the energy with it, and no more than that.
    - Speed is squared, which is steep but less steep than the diameter's cube.
    - An albedo assumption moves the inferred diameter, and then that factor is cubed. It is the diameter's exponent arriving by another route.
    assumes:
    - a quantity raised to a power amplifies any error in it
    scenarios:
    - Diameter is 20% larger.
    - Density doubles.
    - Speed is 10% larger.
    - Albedo assumption changes inferred diameter by a factor of two.
    choices:
    - "Mass and energy rise by about 1.2\xB3 \u2248 1.73."
    - Mass and energy double.
    - "Energy rises by about 1.1\xB2 \u2248 1.21."
    - Energy can change by about a factor of eight through size alone.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: >-
      The exponent decides where a measurement is worth most. Diameter enters
      through the volume, so it is cubed: twenty per cent larger is nearly
      seventy-five per cent more energy. Density enters once, so doubling it
      doubles the energy. Speed enters squared, so ten per cent faster is about
      twenty-one per cent more. And an albedo assumption that shifts the
      inferred diameter by a factor of two moves the energy by a factor of
      eight, through that same cube — which is why an unmeasured reflectivity is
      the most expensive assumption in the room.
  - group: OPS
    task: The consequence range spans two orders of magnitude. Which measurement narrows it most?
    title: Reduce consequence uncertainty
    place: Emergency Planning Office
    scene: >-
      The consequence range spans two orders of magnitude, and every part of it
      traces back to a physical measurement. The emergency planning office can
      improve one of them before the region has to be told anything.
    takeaway: Risk communication should show how physical uncertainty maps into consequence uncertainty.
    format: CHOICE
    assumes:
    - the widest term in a product dominates the uncertainty of the result
    question: The consequence range spans two orders of magnitude. Which measurement narrows it most?
    choices:
    - The diameter, from thermal infrared or radar.
    - The density, from composition and dynamical analogues.
    - The entry speed and angle.
    - None — report the worst case and plan against that.
    answer: The diameter, from thermal infrared or radar.
    why: >-
      Energy goes as the cube of the diameter and only linearly with density, so
      a factor of two in size is a factor of eight in consequence. The
      measurement worth most is always the one attached to the steepest
      exponent.
    rebuttals:
    - Density enters linearly and is genuinely uncertain. Worth improving, and worth a third as much per factor of error.
    - Speed enters squared and is already the best determined of the three, so there is least left to win there.
    - Reporting only the worst case resolves nothing and spends public attention on a number that cannot be defended when it is questioned.
- title: Through the Atmosphere
  objective: Build multiple entry scenarios and identify observations that discriminate monolithic from weak aggregate behavior.
  briefing: Models disagree on whether the object reaches the ground, fragments in the atmosphere, or produces a damaging
    airburst. The player must reason about drag, strength, heating, and uncertain structure.
  stake: Evacuation distance and shelter guidance can change dramatically between airburst and ground-impact scenarios.
  takeaway: Use drag, deceleration, heating, fragmentation, material strength as an evidence chain rather than as isolated
    facts.
  stops:
  - group: IMPACT
    task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly
      placed cards after each check.
    title: Build an atmospheric entry model
    place: Atmospheric Entry Lab
    scene: >-
      Three groups modelled the same object. One has it reaching the ground, one
      has it breaking up at thirty kilometres, and one has an airburst low
      enough to break windows across a city. They differ mainly in an assumed
      strength nobody has measured.
    takeaway: Atmospheric outcome is a coupled trajectory and materials problem.
    format: SEQUENCE
    rebuttals:
    - 'Properties and atmosphere first: they are the inputs everything downstream is computed from.'
    - Loads second — drag, heating and dynamic pressure along the path, which the properties determine.
    - Fragmentation third, by comparing those loads against what the material can survive.
    - Energy deposition last. Where the energy goes follows from whether and when the object came apart.
    assumes:
    - a body moving fast through air is loaded by the air
    cards:
    - Specify mass, shape, speed, angle, strength, and atmospheric profile.
    - Compute drag, heating, and dynamic pressure along the path.
    - Compare loads with fragmentation and ablation criteria.
    - Propagate fragments and energy deposition to consequence estimates.
    order:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Trajectory and materials are coupled the whole way down, which is why the
      chain runs in this order. The initial properties and the atmosphere set
      the loads, because drag and dynamic pressure depend on speed, density and
      shape. The loads are then compared with what the material can take, which
      is where fragmentation happens. And only after breakup is decided can the
      fragments and their energy be propagated into a consequence — a body that
      broke at thirty kilometres deposits its energy somewhere entirely
      different from one that did not.
  - group: OPS
    task: Which atmospheric-entry outcome best fits the optical, deceleration, infrasound, and ground evidence?
    title: Why did the object break up high in the atmosphere?
    place: High-Altitude Observation Network
    scene: >-
      A notional entry has been observed across four instruments and the ground
      survey has come back. The consequence office needs to know where the
      energy went before it writes an evacuation distance.
    takeaway: Entry outcome is inferred from several energy-transfer signatures; brightness alone cannot tell where or how
      the energy was deposited.
    format: DIAGNOSIS
    rebuttals:
    - An intact ground impact transfers most of its energy at the surface, and that leaves a seismic signal and a crater. Neither is there.
    - Saturating optics do not decelerate the object, and the speed measurement is independent of the brightness one.
    - No significant atmospheric interaction means roughly constant speed. This one slowed sharply during the bright phase.
    assumes:
    - energy deposited in the air does not arrive at the ground
    headline: Models disagree about whether a notional object would remain intact to low altitude or fragment earlier.
    readings:
    - zone: Optical light curve
      label: Optical light curve
      value: Rapid brightening at high altitude
      status: alarm
      note: Energy release occurs before the ground
    - zone: Measured speed
      label: Measured speed
      value: Falls quickly during bright phase
      status: alarm
      note: Strong atmospheric deceleration
    - zone: Infrasound
      label: Infrasound
      value: Broad atmospheric pulse
      status: alarm
      note: Consistent with distributed energy release
    - zone: Seismic/crater signal
      label: Seismic/crater signal
      value: None detected
      status: normal
      note: A quiet channel, and the one that rules out an intact ground impact
    - zone: Fragment tracks
      label: Fragment tracks
      value: Multiple fading paths
      status: alarm
      note: Body separates during entry
    choices:
    - label: Atmospheric fragmentation / airburst
      mechanism: Aerodynamic loading breaks the object and deposits much of its energy in the atmosphere.
    - label: Intact ground impact
      mechanism: The body remains coherent and transfers most energy at the surface.
    - label: Pure observational artifact
      mechanism: The apparent breakup exists only because optical instruments saturate.
    - label: No significant atmospheric interaction
      mechanism: The object keeps nearly constant speed and structure through the atmosphere.
    answer: Atmospheric fragmentation / airburst
    why: >-
      Where an object deposits its energy is read from several signatures at
      once, and here the silent channel does as much work as the loud ones.
      Rapid brightening high up with speed falling quickly is a body being
      stopped by air rather than by ground. An infrasound pulse is energy going
      into the atmosphere. Multiple fading tracks are fragments. And no seismic
      signal and no crater says that whatever happened, it did not happen at the
      surface.
  - group: OPS
    task: Three groups model the same object and get ground impact, high fragmentation, and a city-wide airburst. What do you commission?
    title: Bound the atmospheric outcome
    place: Consequence Modeling Center
    scene: >-
      Three groups have modelled the same object and come back with three
      different answers, and the consequence centre has to hand the planning
      office something this week.
    takeaway: "Consequence models should expose structural uncertainty rather than bury it in one asteroid \u201Ctype.\u201D"
    format: CHOICE
    assumes:
    - an unmeasured input does not become known by being assumed
    question: Three groups model the same object and get ground impact, high fragmentation, and a city-wide airburst. What do you commission?
    choices:
    - Strength and density ensembles rather than one model run.
    - Comparison against observed analogue fireballs.
    - A better measurement of the entry angle and speed.
    - A single agreed model, so the planning office has one answer.
    answer: Strength and density ensembles rather than one model run.
    why: >-
      The three groups disagree because the object's strength is unknown, not
      because anybody made an arithmetic error. An ensemble carries that
      ignorance into the answer, where the planning office can see it, instead
      of hiding it inside whichever strength each modeller happened to assume.
    rebuttals:
    - Analogue fireballs calibrate the models against events that actually happened, and they are the right check on the ensemble once it exists.
    - Entry angle and speed are genuinely measurable and are not what the three models disagree about.
    - 'One agreed answer is what the planning office wants and the least defensible thing to give it: the disagreement is the finding.'
- title: What Have We Failed to See?
  objective: Design a survey strategy that improves detection and accurately reports what remains unseen.
  briefing: The object was discovered late because surveys missed parts of the sky and faint low-albedo bodies. The player
    must quantify selection effects and improve future completeness.
  stake: The next dangerous object may occupy exactly the region the current survey systematically neglects.
  takeaway: Use selection effects, survey completeness, limiting magnitude, cadence, population inference as an evidence chain
    rather than as isolated facts.
  stops:
  - group: OPS
    task: Which explanation fits the pre-discovery geometry and the survey operating record?
    title: Why was it missed?
    place: Survey Strategy Center
    scene: >-
      The object was found later than its brightness alone would predict. The
      survey's operating record, the weather archive and its pre-discovery
      geometry are all on the desk at the strategy centre.
    takeaway: Survey completeness is geometric as well as instrumental; an object can be bright enough yet effectively hidden
      by the Sun.
    format: DIAGNOSIS
    rebuttals:
    - A survey too shallow would never reach it, and the record says its brightness was within reach whenever it was in dark sky.
    - Bad weather blocks fields at random, and the archive is mostly clear across the period.
    - A detector or pipeline outage would show in the operating record. Detector health is normal throughout.
    assumes:
    - a telescope on the ground can only work at night
    headline: The object is discovered later than expected even though its brightness would normally be within survey reach.
    readings:
    - zone: Solar elongation before discovery
      label: Solar elongation before discovery
      value: Less than about 30 degrees
      status: alarm
      note: Object stayed close to the Sun on the sky
    - zone: Predicted apparent brightness
      label: Predicted apparent brightness
      value: Within survey depth when in dark sky
      status: normal
      note: Sensitivity would otherwise be adequate
    - zone: Weather archive
      label: Weather archive
      value: Mostly clear
      status: alarm
      note: Clouds do not explain the missing weeks
    - zone: Detector health
      label: Detector health
      value: Normal
      status: normal
      note: No prolonged camera outage
    - zone: Survey cadence
      label: Survey cadence
      value: Covers the region after elongation increases
      status: alarm
      note: Detection follows emergence from solar glare
    choices:
    - label: Solar-elongation blind spot
      mechanism: The object is geometrically too close to the Sun for normal night-sky survey coverage.
    - label: Survey not deep enough
      mechanism: The object is always fainter than the system detection limit.
    - label: Bad weather
      mechanism: Cloud cover repeatedly blocks the relevant fields.
    - label: Pipeline/detector outage
      mechanism: The camera or processing system fails during otherwise observable opportunities.
    answer: Solar-elongation blind spot
    why: >-
      Completeness is geometric as well as instrumental, and this object was
      bright enough and effectively invisible at the same time. Its solar
      elongation was under about thirty degrees, which puts it in twilight where
      no ground survey can work. Everything else on the panel says the survey
      was healthy: the weather was clear, the detector was fine, and the
      predicted brightness was within reach whenever the object was in dark sky.
      It was found as soon as the geometry allowed, and not before.
  - group: OPS
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Volume gain from deeper sensitivity
    place: Telescope Network
    scene: >-
      A survey upgrade would let it detect a standard object twice as far away,
      and the board wants to know what that buys before it signs anything.
    takeaway: Small gains in distance can produce large gains in searchable volume.
    format: BALLPARK
    assumes:
    - a searchable region is roughly a sphere
    why: >-
      The searchable region is roughly a sphere, so its volume goes as the cube
      of how far the survey can see. Twice the range is eight times the volume,
      and the number of objects found scales with it. Square the two instead and
      you get four, which is the answer for an area — but a survey searches a
      volume, not a patch of sky.
    question: Estimate the factor by which the searchable volume grows.
    estimate:
      prompt: A survey upgrade lets it detect a standard object twice as far away. The searchable region is roughly a sphere.
      question: Estimate the factor by which the searchable volume grows.
      labels:
      - 2 (the gain in detection distance)
      - 3 (dimensions of space)
      - 4 (twice the distance, squared)
      - 1.5 mag (the depth gain)
      values:
      - 2
      - 3
      - 4
      - 1.5
      slots: 1
      template: '{0}³'
      formula: a*a*a
      correct:
      - 0
      target: 8
      tolerance: 0.5
      units: × the searchable volume
      solution: Volume goes as the cube of the distance limit, so twice the range is eight times the volume.
      explanation: The exponent is in the template because it comes from the geometry rather than from a measurement; what the player supplies is the distance gain. Doubling the range and squaring it is the area answer, and the survey searches a volume.
  - group: OPS
    task: This object was found eleven days out, from the direction of the Sun. What does the survey change?
    title: Improve discovery completeness
    place: Population Statistics Lab
    scene: >-
      This object was found eleven days before closest approach, from the
      direction of the Sun, at a brightness the survey reaches only in good
      conditions. The population lab has one upgrade to propose.
    takeaway: Completeness is measured by simulated recovery and known biases, not by absence of discoveries.
    format: CHOICE
    assumes:
    - what a survey has not found is not the same as what is not there
    question: This object was found eleven days out, from the direction of the Sun. What does the survey change?
    choices:
    - Wider sky and hemisphere coverage, including low solar elongations.
    - Greater depth, to reach fainter and darker bodies.
    - A cadence optimised for linking detections into tracked objects.
    - Nothing — report completeness from the fraction already catalogued.
    answer: Wider sky and hemisphere coverage, including low solar elongations.
    why: >-
      This object was bright enough for the survey and geometrically impossible
      to see. What hid it was where the telescope pointed, not how faint it
      could go — and depth added to the same sky would have found it on exactly
      the same night.
    rebuttals:
    - Greater depth finds fainter and darker bodies across the sky already covered, and would not have moved this discovery by a day.
    - A linking cadence turns detections into tracked objects, which requires the detection first.
    - Reporting completeness from the catalogue counts the objects that were found using the objects that were found. It is the reasoning this discovery disproved.
- title: Can We Move It?
  objective: Choose a deflection demonstration and define how success will be measured.
  briefing: Impact probability remains significant, and a reconnaissance mission could arrive years before encounter. The
    player must compare momentum transfer, lead time, and uncertainty without treating deflection as a movie-style explosion.
  stake: A poorly characterized intervention could fragment the object, miss the target, or fail to produce enough orbital
    change.
  takeaway: Use momentum, impulse, lead time, kinetic impact, uncertainty as an evidence chain rather than as isolated facts.
  stops:
  - group: IMPACT
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Velocity change from momentum transfer
    place: Deflection Physics Lab
    scene: >-
      A kinetic impactor is being sized at the deflection lab. The spacecraft's
      mass and closing speed are known, and so is the asteroid's mass to within
      a factor of a few.
    takeaway: Deflection relies on small velocity change plus long lead time.
    format: BALLPARK
    assumes:
    - momentum is mass times velocity, and it is conserved in a collision
    why: A centimetre per second sounds like nothing. Applied years before encounter it accumulates into a displacement measured in Earth radii, which is the whole basis of deflection.
    question: Estimate the asteroid's change in speed.
    estimate:
      prompt: A 1,000 kg impactor strikes a 1.0 × 10⁹ kg asteroid at 10,000 metres per second, in a perfectly inelastic lower-bound estimate.
      question: Estimate the asteroid's change in speed.
      labels:
      - 1,000 kg (impactor mass)
      - 10,000 m/s (impact speed)
      - 1.0e9 kg (asteroid mass)
      - 20,000 m/s (the encounter speed with Earth)
      - 3.0 (momentum enhancement from ejecta)
      values:
      - 1000
      - 10000
      - 1000000000.0
      - 20000
      - 3.0
      slots: 3
      template: '{0} × {1} ÷ {2}'
      formula: a*b/c
      correct:
      - 0
      - 1
      - 2
      target: 0.01
      tolerance: 0.001
      units: m/s
      solution: Momentum transferred is 10⁷ kg m/s; divided by 10⁹ kg, Δv ≈ 0.01 m/s.
      explanation: Conservation of momentum needs the impactor's mass and speed, not the asteroid's encounter speed with Earth. The ejecta enhancement is real and would raise this figure — it is left out because nobody can predict it, which is exactly why the mission has to measure it.
  - group: IMPACT
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: What determines deflection success?
    place: Mission Engineering Center
    scene: >-
      A kinetic impactor could reach the object four years before encounter.
      Four things decide how far it moves, and the mission engineering centre
      has measured none of them well.
    takeaway: Deflection is an experiment whose dependent variable is the asteroid orbit.
    format: PROTOCOL
    rebuttals:
    - More lead time multiplies the same velocity change into more displacement. It is the cheapest term in the problem.
    - The asteroid's mass divides the transferred momentum, so an uncertain mass is an uncertain result in direct proportion.
    - Ejecta leaving the surface carry momentum away and add to the transfer — a real effect with a factor nobody can predict.
    - Post-impact tracking measures the orbit change that happened rather than the one that was predicted. Without it the mission is a demonstration.
    assumes:
    - a small velocity change accumulates into a large displacement over time
    scenarios:
    - Longer lead time.
    - Unknown asteroid mass.
    - Uncertain momentum enhancement from ejecta.
    - Post-impact tracking.
    choices:
    - "More displacement accumulates from the same \u0394v."
    - "Makes predicted \u0394v uncertain."
    - Changes effective transferred momentum.
    - Measures actual orbit change rather than assumed performance.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Deflection is an experiment whose dependent variable is the asteroid's
      orbit, and each of these four sits at a different point in it. Lead time
      turns the same velocity change into more accumulated displacement, which
      is why early is worth more than large. An unknown mass makes the predicted
      velocity change uncertain in direct proportion, because that mass is the
      denominator. Ejecta thrown off the surface carry away momentum of their
      own and enhance the transfer by a factor nobody can calculate. And
      tracking afterwards is the only thing that measures what actually
      happened.
  - group: ORBIT
    task: The impactor is funded. What must the campaign add that the impactor alone does not?
    title: Build the deflection campaign
    place: Orbit Monitoring Room
    scene: >-
      The impactor is funded and the launch date is fixed. What else the
      campaign contains is still open, and reconnaissance would cost a year of
      lead time.
    takeaway: A deflection mission should be designed to learn its actual momentum transfer.
    format: CHOICE
    assumes:
    - an experiment needs a measurement of its own outcome
    question: The impactor is funded. What must the campaign add that the impactor alone does not?
    choices:
    - Long-term tracking, before and after the impact.
    - Reconnaissance to measure the mass, delaying the impactor by a year.
    - Additional navigational margin on the impactor itself.
    - Nothing — the impact is the experiment.
    answer: Long-term tracking, before and after the impact.
    why: >-
      The thing a deflection has to produce is a change in the orbit, so the
      campaign has to measure the orbit before and after. Without that, the
      mission is a demonstration: the spacecraft hit something, and nobody can
      say what it did. The ejecta thrown off the surface add momentum by a
      factor nobody can calculate in advance, so the only way anyone learns it
      is by measuring one real impact.
    rebuttals:
    - Reconnaissance measures the mass the predicted velocity change depends on, and it costs a year of the lead time that makes any velocity change effective.
    - Navigational margin decides whether the spacecraft hits. It says nothing about what happened to the orbit when it did.
    - An impact with no measurement is a demonstration rather than an experiment, and it leaves the next campaign exactly as uncertain as this one.
- title: Design the Intercept
  objective: Select an intercept architecture with enough margin to reach and accurately target the asteroid.
  briefing: The mission must launch within a narrow window and encounter a rotating, irregular target with limited communications
    delay. The player must integrate orbital mechanics, navigation, power, and autonomy.
  stake: Missing the launch window or target can consume the only remaining lead time.
  takeaway: Use launch windows, relative motion, guidance, power, communications delay as an evidence chain rather than as
    isolated facts.
  stops:
  - group: OPS
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Which subsystem owns the constraint?
    place: Trajectory Design Center
    scene: >-
      Four mission challenges are on the board at the trajectory design centre,
      and each one is somebody else's problem to solve. Nobody has said which.
    takeaway: An intercept is a coordinated prediction-and-control problem.
    format: PROTOCOL
    rebuttals:
    - A short geometric window is a schedule and launch-performance problem. It closes whether or not the spacecraft is ready.
    - Ephemeris error growing near encounter is answered by measuring the target from the spacecraft, because that is when the error matters.
    - Round-trip light time rules out steering from the ground, so the vehicle has to decide for itself.
    - A rotating target needs its spin state known before arrival, which is an observing problem rather than a guidance one.
    assumes:
    - a spacecraft cannot be flown in real time across light-minutes
    scenarios:
    - Launch opportunity occurs only during a short geometry window.
    - Target ephemeris uncertainty grows near encounter.
    - Round-trip communication delay prevents real-time piloting.
    - The target face changes with rotation.
    choices:
    - Protect schedule and launch readiness.
    - Use optical navigation and late orbit updates.
    - Provide autonomous guidance and fault response.
    - Model rotation and target a robust impact region.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Mission design maps a physical constraint onto the subsystem that can
      actually answer it, and the responses are not interchangeable. A launch
      window that exists only during a short geometry is answered by launch
      performance and schedule, because no amount of onboard cleverness recovers
      a missed window. Ephemeris error growing toward encounter is answered by
      measuring the target from the spacecraft, late. Light-time that rules out
      piloting is answered by autonomy. And a face that changes with rotation is
      answered by knowing the spin before arrival.
  - group: OPS
    task: Order the design backwards from the effect it has to produce.
    title: Build the intercept architecture
    place: Spacecraft Systems Lab
    scene: >-
      The launch window is nineteen days wide, the target is irregular and
      rotating, and at encounter the ground can watch but cannot steer.
    takeaway: An intercept is designed backwards from the effect it has to produce.
    format: SEQUENCE
    assumes:
    - a design is sized by the outcome it has to produce
    cards:
    - Fix the encounter geometry and the velocity change it has to deliver.
    - Choose launch energy and cruise to reach that geometry inside the window.
    - Design terminal guidance to close the ephemeris error that is left at arrival.
    - Test the whole chain against target states nobody has ruled out.
    order:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Each stage is sized by the one above it: the required velocity change sets
      the impactor mass and therefore the launch energy, and what the launch and
      cruise cannot deliver in accuracy is exactly what terminal guidance has to
      close. Designing the guidance first means designing it to a miss distance
      nobody has computed.
  - group: OPS
    task: The design closes on paper with nothing left over. Where does the first margin go?
    title: Spend mission margin
    place: Autonomy Test Range
    scene: >-
      The design closes on paper with nothing left over. Whatever margin is
      bought now comes out of the headline performance figure the programme has
      been promising.
    takeaway: A successful planetary-defense mission is robust, not merely impressive at nominal conditions.
    format: CHOICE
    assumes:
    - a nominal design is the one that works if nothing goes wrong
    question: The design closes on paper with nothing left over. Where does the first margin go?
    choices:
    - Better target ephemeris and onboard optical navigation.
    - Additional launch energy and trajectory flexibility.
    - Redundancy in the critical spacecraft functions.
    - Into the headline performance number the programme has promised.
    answer: Better target ephemeris and onboard optical navigation.
    why: >-
      The accuracy is lost at the encounter, not at launch. The target's
      position is still uncertain when the spacecraft has to steer itself, and
      this is the only margin that converts directly into hitting the thing it
      was sent to hit.
    rebuttals:
    - Launch energy buys trajectory flexibility, which does not help a spacecraft aimed accurately at where the asteroid is not.
    - Redundancy buys survival of one failure at an encounter that cannot be repeated. It is the right second call.
    - Maximising the headline number at the expense of every reserve is how a design closes on paper and fails in flight.
- title: Evacuate or Wait?
  objective: Create trigger-based preparations proportional to probability, consequence, lead time, and reversibility.
  briefing: The impact corridor crosses populated regions, but the probability is still changing. The player must connect
    scientific uncertainty to staged civil decisions and avoid both complacency and panic.
  stake: Bad communication can create casualties during an unnecessary evacuation or leave people unprepared for a real impact.
  takeaway: Use risk thresholds, expected consequence, decision under uncertainty, communication, reversibility as an evidence
    chain rather than as isolated facts.
  stops:
  - group: OPS
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Match action to evidence state
    place: Risk Communication Center
    scene: >-
      The corridor crosses populated regions and the probability is still
      moving. Four evidence states are on the board at the communication centre,
      each needing its own level of response.
    takeaway: Preparedness can escalate in stages without claiming certainty.
    format: PROTOCOL
    rebuttals:
    - 'Very low probability with years of lead time buys the cheapest thing: keep watching, and prepare in ways that cost nothing if it comes to nothing.'
    - A rising probability over a stable corridor justifies pre-positioning, precisely because pre-positioning can be undone.
    - High probability with days left is when reversibility stops being the deciding factor and consequence takes over.
    - A falling probability is stood down in public, with the reason. Quietly dropping it is how the next warning is disbelieved.
    assumes:
    - a reversible action can be taken and undone; an irreversible one cannot
    scenarios:
    - Very low probability with years of lead time.
    - Rising probability with a stable regional corridor.
    - High probability with days remaining.
    - Probability falls after decisive tracking.
    choices:
    - Continue tracking and low-cost preparedness.
    - Pre-position resources and plan corridor-specific evacuations.
    - Execute protective actions under emergency authority.
    - Scale back actions transparently while preserving lessons.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Action thresholds depend on consequence, lead time and reversibility
      rather than on probability alone. A very low probability with years in
      hand justifies tracking and cheap preparation, because there is time to
      learn more. A rising probability with a stable corridor justifies
      pre-positioning, which is reversible. High probability with days left
      justifies protective action under emergency authority, because the time to
      learn more has gone. And a probability that falls justifies standing down
      publicly and saying why — which is what makes the next escalation
      believable.
  - group: OPS
    task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
    title: Expected displaced population
    place: Emergency Management Office
    scene: >-
      The emergency management office needs a number to plan against. It has the
      population inside the corridor and the current impact probability, and it
      has to write something on a form today.
    takeaway: Decision metrics must be interpreted according to the distribution they summarize.
    format: BALLPARK
    assumes:
    - an expectation is a probability multiplied by a consequence
    why: The same expectation arises from a small chance of a very large displacement and a near-certainty of a small one, and those call for entirely different preparations. The summary is only usable alongside the distribution it summarises.
    question: Estimate the expected displaced population.
    estimate:
      prompt: A simplified corridor contains 2 million people and the current impact probability is 0.5 per cent.
      question: Estimate the expected displaced population.
      labels:
      - 2.0e6 people (in the corridor)
      - 0.005 (impact probability)
      - 2.0e5 people (in the largest corridor town)
      - 0.05 (an earlier probability estimate)
      - 0.037 % (the ensemble figure)
      values:
      - 2000000.0
      - 0.005
      - 200000.0
      - 0.05
      - 0.037
      slots: 2
      template: '{0} × {1}'
      formula: a*b
      correct:
      - 0
      - 1
      target: 10000
      tolerance: 800
      units: people (expectation)
      solution: 2 × 10⁶ × 0.005 = 10,000 people, as an expectation.
      explanation: 'A probability written as a percentage has to be converted before it is multiplied, which is what makes the 0.037 tile dangerous: it is the right quantity in the wrong units, and it would put the answer out by a factor of a hundred.'
  - group: OPS
    task: The probability has moved twice this month, both times downward. What does the board issue?
    title: Prepare without panic
    place: Scientific Advisory Board
    scene: >-
      The corridor crosses two coastal regions, the probability has moved twice
      this month and both times downward, and regional authorities want
      something they can act on.
    takeaway: Public trust is protected when uncertainty is paired with concrete decision rules.
    format: CHOICE
    assumes:
    - credibility spent on one message is not available for the next
    question: The probability has moved twice this month, both times downward. What does the board issue?
    choices:
    - The uncertainty, published together with the triggers and protective steps.
    - A statement that tracking continues and there is no cause for concern.
    - An instruction to begin corridor evacuation planning immediately.
    - A warning that an impact should now be treated as likely.
    answer: The uncertainty, published together with the triggers and protective steps.
    why: >-
      An advisory that says in advance what would change it can change without
      looking like a reversal. That is the only form that survives a probability
      which moves twice a month, and it is what keeps the next message believed.
    rebuttals:
    - Reassurance with no trigger attached has to be withdrawn from scratch if the probability moves back up, and it will be read as the board having been wrong.
    - Corridor evacuation planning is exactly what the triggers should start. Starting it without them makes it impossible to stop.
    - Calling an impact likely before the orbit is resolved spends the credibility that every later message, including the reassuring ones, depends on.
- title: The Final Defense Review
  objective: Produce a claim-by-claim planetary-defense decision package and preserve monitoring after the immediate threat
    passes.
  briefing: The international board must decide whether the object is sufficiently characterized, whether the deflection worked,
    and which civil preparations remain necessary.
  stake: Success against one object can create dangerous complacency about the larger unseen population.
  takeaway: Use evidence synthesis, readiness, residual risk, international coordination, long-term stewardship as an evidence
    chain rather than as isolated facts.
  stops:
  - group: OPS
    task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used
      once.
    title: Disposition the final claims
    place: International Review Hall
    scene: >-
      The board has to publish one account of an eight-year campaign, and the
      four claims in front of it carry very different weights of evidence.
      Whatever it writes will be read by whoever runs the next one.
    takeaway: Planetary defense is a continuing evidence system, not a one-time heroic act.
    format: PROTOCOL
    rebuttals:
    - An independently confirmed orbit shift is the strongest claim here and can be accepted, with verification continuing.
    - A poorly constrained tail is not a safe nominal. Collapsing the distribution onto its middle is the error the whole campaign was about.
    - Civil plans against an outdated corridor are worse than no plans, because somebody will use them.
    - Survey gaps have nothing to do with this object and everything to do with the next one.
    assumes:
    - a conclusion is only as strong as the evidence under it
    scenarios:
    - Post-impact tracking shows the required orbit shift with independent confirmation.
    - The nominal miss is safe, but a poorly constrained tail remains.
    - Civil plans are ready but based on an outdated corridor.
    - The object is no longer threatening, but survey gaps remain.
    choices:
    - Accept the deflection claim and continue verification.
    - Continue targeted observations; do not collapse the distribution to the nominal.
    - Update plans before operational use.
    - Fund long-term survey and preparedness improvements.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: >-
      Final review separates mission success, residual orbital uncertainty,
      civil readiness and future capability, because they are four different
      states and giving them one confidence is how a document becomes
      untrustworthy. Tracking that confirms the orbit shift independently is
      strong enough to accept while verification continues. A poorly constrained
      tail is a reason to keep observing rather than to collapse the
      distribution onto the nominal. Plans built on an outdated corridor have to
      be updated before anybody uses them. And survey gaps outlive this object
      entirely.
  - group: ORBIT
    task: Order the record so each claim can be checked against the one before it.
    title: Build the final public record
    place: Orbit Monitoring Center
    scene: >-
      The board has one account to publish. The object was found late,
      characterised in stages, deflected by a measured but imprecise amount, and
      it leaves behind a risk that is small rather than zero.
    takeaway: A record is ordered so each claim can be checked against the one before it.
    format: SEQUENCE
    assumes:
    - a record is read by people who were not there
    cards:
    - The discovery, and how wide the uncertainty was at each stage of narrowing it.
    - The physical characterisation, and the consequence range it implied.
    - The intervention, and the orbit change measured against the one predicted.
    - The residual risk, and who is funded to keep watching it.
    order:
    - 0
    - 1
    - 2
    - 3
    why: >-
      The record is ordered so that each claim can be checked against the one
      before it: the consequence range only means something beside the diameter
      it came from, and the measured deflection only means something beside the
      prediction it was tested against. Ending on residual risk and its owner is
      what stops the document reading as a conclusion.
  - group: OPS
    task: The campaign budget ends with this review. What survives it?
    title: Fund the planetary-defense legacy
    place: Mission Operations
    scene: >-
      The campaign budget ends with this review. What survives it decides
      whether the next object is found eleven days out or eleven years out.
    takeaway: The durable defense is an institution that can repeatedly detect, learn, decide, and act.
    format: CHOICE
    assumes:
    - warning time is produced by finding things, not by planning for them
    question: The campaign budget ends with this review. What survives it?
    choices:
    - Survey completeness and the rapid follow-up network.
    - Characterisation and deflection demonstration missions.
    - International decision protocols and civil preparedness.
    - Nothing new — discovery is now routine and happens automatically.
    answer: Survey completeness and the rapid follow-up network.
    why: >-
      Everything else in planetary defence is a function of warning time, and
      warning time is produced by finding the object and by nothing else. This
      one was found eleven days out, and that number is what set every
      constraint in the campaign that followed.
    rebuttals:
    - Characterisation and deflection demonstrations convert warning time into options, and they need the warning time to exist first.
    - Protocols and civil preparedness turn options into action, and they inherit the same dependency one step further down.
    - Assuming discovery is automatic is the assumption this object spent eight years disproving, from a blind spot the survey still has.
# --------------------------------------------------------------- the rooms
interiors:
  DISC:
    caption: A detection is a claim that something moved, not that something is there.
    standLine: One faint moving point, two satellite trails and a hot pixel column in the same field.
    station:
      kind: panel
      title: Survey pipeline
      rows:
        - { label: Detections tonight, value: 41, status: high }
        - { label: Candidate SNR, value: 5.2, status: alarm }
        - { label: Known objects rejected, value: 39, status: normal }
  ORBIT:
    caption: A short arc allows a family of orbits, and some members of it hit the Earth.
    standLine: Six observatories reporting, two time standards, and an arc four hours long.
    station:
      kind: panel
      title: Orbit fit
      rows:
        - { label: Arc length, value: 4.1 h, status: alarm }
        - { label: Astrometric residual, value: 0.42 arcsec, status: high }
        - { label: Observations used, value: 22, status: normal }
  CHAR:
    caption: A bright asteroid is not necessarily a large one.
    standLine: One brightness, one assumed albedo, and a diameter the consequence model cubes.
    station:
      kind: panel
      title: Photometry bench
      rows:
        - { label: Absolute magnitude, value: 22.4, status: normal }
        - { label: Assumed albedo, value: borrowed, status: alarm }
        - { label: Thermal data, value: not yet taken, status: low }
  RADAR:
    caption: Four hours of dish time collapse an orbit that a month of imaging cannot.
    standLine: A window four hours wide that does not open again for eleven years.
    station:
      kind: vitals
      title: Delay-Doppler
      rows:
        - { label: Round-trip delay, value: 4.0 s, status: normal }
        - { label: Window remaining, value: 3.2 h, status: alarm }
        - { label: Range precision, value: 15 m, status: high }
  IMPACT:
    caption: The same diameter can produce a crater or a burst ten kilometres up.
    standLine: Three entry models, one reaching the ground, and a strength nobody has measured.
    station:
      kind: panel
      title: Entry model
      rows:
        - { label: Kinetic energy, value: 3.1e17 J, status: alarm }
        - { label: Assumed strength, value: unmeasured, status: alarm }
        - { label: Entry angle, value: 45 deg, status: normal }
  OPS:
    caption: Observing time is the scarce quantity, and information gain is what it should buy.
    standLine: Four hours of discretionary time, four proposals, and a press office asking for a line.
    station:
      kind: panel
      title: Coordination desk
      rows:
        - { label: Impact probability, value: 1 in 640, status: alarm }
        - { label: Next radar window, value: 9 days, status: high }
        - { label: Follow-up committed, value: 4 h, status: normal }

copy:
  DISC: <p>The survey dome and its image processing room. Everything this campaign knows started as photons here.</p>
  ORBIT: <p>Orbit determination. Where a set of angles becomes a family of possible futures.</p>
  CHAR: <p>Spectroscopy and characterization. Size, reflectivity, spin and composition — the physical body itself.</p>
  RADAR: <p>The planetary radar. It measures distance directly, and only when the geometry allows.</p>
  IMPACT: <p>Entry and consequences. What the atmosphere does to an arriving body, and what is left over.</p>
  OPS: <p>The coordination office. Telescope time, international protocol, and what the public is told.</p>
  BOARD: <p>The briefing hall. The board meets here, and the record it publishes outlives everyone in the room.</p>
  TIME: <p>Time and frequency standards. Every timestamp on this mountain traces back to this building.</p>
  ARCHIVE: <p>The plate and data archive. Objects are often found years later in images already taken.</p>

        concept: Probability, risk and expected value
        place: Scientific Advisory Board
        scene: Five orbit updates are lined up and waiting. Garcia has to write the trigger before they arrive. Ellery can still get her regions ready without evacuating anyone, but planning and moving supplies both take time. Rossi insists the action thresholds get locked in before the updates start. Once the numbers start arriving, nobody gets to move them.
        guide: >-
          One rule, written before the next orbit updates arrive, and fixed once you
          release it. Standing up the planning cell takes two full days from the moment
          you call it. Think about how the timing of your rule has to relate to that
          two-day lead time — and to the risk of calling a cell for an object that was
          never going to matter.
        background:
          - >-
              Why you commit to a rule before the updates arrive. Orbit updates come in one
              after another, and each one shifts the probability a little. A threshold that
              gets adjusted while the updates are coming in is not really a rule — it is an
              excuse for whatever someone already wanted to do. And that kind of after-the-
              fact rule cannot be defended later, to the public or to the planners who acted
              on it.
          - >-
              Why there are two thresholds instead of one. Writing a plan takes weeks.
              Moving supplies takes days, but only after the plan already exists. A single
              threshold set for the slow action would trigger the fast one absurdly early. A
              single threshold set for the fast action would leave no time to plan at all.

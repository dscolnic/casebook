    objective: Produce a claim-by-claim planetary-defense decision package and preserve monitoring after the immediate threat passes.
    briefing: The international board must decide whether the object is sufficiently characterized, whether the deflection worked, and which civil preparations remain necessary.
    stake: Eleven years after it was found, the object passes next week. This was the pass that was supposed to be a hit, but tracking shows it will miss. Today you close the record, and decide what part of this work still deserves money now that the fear is gone.
    takeaway: Use evidence synthesis, readiness, residual risk, international coordination, long-term stewardship as an evidence chain rather than as isolated facts.
    stops:
      - group: OPS
        task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
        title: Disposition the final claims
        at: desk
        reason: >-
          Closing the record today means taking every remaining claim one at
          a time, not on faith
        concept: Uncertainty, error bars and covariance
        place: International Review Hall
        scene: The board has to publish one final report on an eight-year campaign. The four claims in front of it carry very different amounts of evidence. Garcia reminds the room that whoever runs the next campaign will read whatever they write down.
        guide: >-
          Four claims and four ways to handle them. Pair them by asking what state each
          claim is actually in: fully confirmed, still open, out of date, or bigger than
          this one object. Treating four different states with one single confidence
          is how a report stops being trusted.
        background:
          - >-
              Why this is a matching board, not four separate questions. Each answer on
              this board could sound right for more than one situation. Picking them one at
              a time would let a nearly-right answer sneak through unchecked. Placing all
              four forces you to compare them side by side. The real question is not "does
              this sound reasonable here?" It is "does this fit here better than it fits
              somewhere else?"
          - >-
              How to use the one-each rule. Every answer here gets used exactly once. So
              every match you make also narrows down the matches still open. Settle the two
              you feel sure about first. Often that leaves the last two decided by
              elimination. If it does not, two answers are still competing for the same
              spot — and telling them apart is exactly what this stop is testing.
          - >-
              Why you can never be wrong about just one match. Since each answer is used
              once, three correct matches leave the fourth with nowhere else to go. So any
              mistake always involves at least two matches, not one. Remember that when the
              last pair feels forced: the real error is usually not the match you are stuck
              on. It is an earlier one you stopped questioning too soon.
        takeaway: Defending the planet is an ongoing system that keeps gathering evidence, not a one-time heroic act.
        format: PROTOCOL
        columns:
          - What the evidence shows
          - What you do with it
        rebuttals:
          - An orbit shift confirmed independently is the strongest claim here, and it can be accepted while verification keeps going.
          - A poorly measured tail is not the same as a safe middle estimate. Collapsing everything onto the middle is the exact error this whole campaign was about.
          - Civil plans built on an outdated corridor are worse than no plan at all, because someone will actually use them.
          - Gaps in the survey have nothing to do with this object, and everything to do with the next one.
        assumes:
          - a conclusion is only as strong as the evidence under it
        scenarios:
          - Post-impact tracking shows the needed orbit shift, confirmed independently.
          - The best-guess miss looks safe, but a poorly measured tail still remains.
          - Civil plans are ready but based on an outdated corridor.
          - The object is no longer threatening, but survey gaps remain.
        choices:
          - Accept the deflection claim and continue verification.
          - Keep observing closely, and don't collapse the range down to one best guess.
          - Update the plans before anyone actually uses them.
          - Fund long-term improvements to the survey and to preparedness.
        mapping: [0, 1, 2, 3]
        why: A final review keeps four things separate — whether the mission worked, how much orbital uncertainty is left, whether civil plans are ready, and what capability should carry forward. Treating all four with one single confidence is how a report becomes untrustworthy. Tracking that confirms the orbit shift, independently, is strong enough to accept while verification keeps going. A poorly measured tail is a reason to keep watching, not a reason to collapse everything onto the middle estimate. Plans built on an outdated corridor have to be updated before anyone uses them. And gaps in the survey outlive this one object completely.
      - group: ORBIT
        task: Use the two remaining independent checks on the final-record claims that most need physical verification.
        title: Build the final public record
        reason: >-
          The public record only stands if today's checks on it are the two
          that actually verify something
        concept: Momentum transfer and deflection
        place: Orbit Monitoring Center
        scene: The board has two independent checks left before release. Every claim on it is already signed. But several claims could still change the public conclusion if they are wrong. Rossi wants the orbit-status claim checked again before Ellery takes the record public tonight. Whatever survives becomes the starting point for the next threat.
        guide: >-
          You have two independent checks left, and the record goes public tonight.
          Open each signed claim, and read what evidence actually backs it up. Hold
          back any claim the evidence does not support. Spend your two checks where a
          wrong claim would do the most damage to the public conclusion. Whatever
          survives tonight becomes the starting point for the next threat.
        background:
          - >-
              Why the public record is different. People who read it cannot inspect the
              evidence themselves. People who cite it later were not there. A claim that
              gets corrected later has already shaped what the next team assumes. And
              corrections never travel as far as the original claim did.
          - >-
              What a signature means at this stage. It means somebody took responsibility
              for a sentence. Often, that person is relying on what a colleague told them.
              Under a release deadline, that is how a guess and a real observation can end
              up looking identical on the page.
          - >-
              How to spend two checks across several doubtful claims. Spend them by
              consequence, not by how doubtful a claim feels. The claim that would send
              the next mission in the wrong direction is worth more checking than the
              claim that is simply most likely to be wrong.
        assumes:
          - a signed record and an independently verified condition are different things
          - verification capacity is limited
        takeaway: A scientific record is strongest when its most critical claims can be independently checked again. It is not strongest just because every box is signed.
        format: ATTEST
        question: Which signed claims must be independently checked before the public record is released?
        attest:
          hint: Every card is signed, but a signature is only a record. You can independently verify two claims. Spend those checks where a wrong claim would materially change the scientific or public conclusion and where no independent backing already exists.
          claims:
            - id: orbit
              label: The current orbit and the encounter status have both been independently checked again
              critical: true
              backed: true
              evidence: a second orbit pipeline using independent software and a separate astrometric subset reproduces the encounter solution
            - id: deflection
              label: The deflection record states the measured velocity change after impact, and its uncertainty
              critical: true
              backed: false
              evidence: raw pre/post astrometry and an independent fit reproduce a Δv near 2.1 cm/s
            - id: size_consequence
              label: The size and danger-range record keeps its heat and radar data, with uncertainty, intact
              critical: true
              backed: false
              evidence: independent reprocessing reproduces the approximately 180 m size scale and the stated consequence envelope
            - id: discovery
              label: The discovery images, timestamps, and origin records are archived
              critical: false
              backed: true
              evidence: archive checksum and provenance audit already completed
            - id: wording
              label: The public summary has final approval from the communications office
              critical: false
              backed: false
              evidence: communications office signs the release wording
          checks: 2
        answerText: "Use your two independent checks on the critical claims that are still unbacked. Those are the measured deflection and the size-and-consequence record. The orbit-status claim has already been independently reproduced. Signatures and communications approval are not a substitute for real physical verification."
        why: A final scientific record is trustworthy when someone else can reconstruct what was measured, how it was calibrated, and what uncertainty remains. A signature documents approval, but it cannot establish a physical fact by itself. Checking should go first to critical claims that still lack independent backing. Rechecking an orbit fit that is already reproduced wastes scarce checking capacity, without strengthening the weakest link in the record. The release is ready once its most important conclusions have evidence chains strong enough to survive the failure of any one person, instrument, or analysis path.
      - group: OPS
        task: The campaign budget ends with this review. What survives it?
        title: Fund the planetary-defense legacy
        reason: >-
          She has to decide today what survives once nobody is frightened any
          more
        concept: Detection thresholds, false alarms and completeness
        place: Mission Operations
        scene: The threat is gone, and so is most of the campaign's budget. The discovery survey still misses parts of the sky, and two follow-up sites are about to lose their funding at the end of the year. Garcia asks the board — what capability should survive this success?
        guide: >-
          Four options, and the threat is gone along with most of the budget. Ask of
          each option what it would do to warning time — how early the next dangerous
          object gets found. Think about which parts of this whole campaign depended on
          having enough warning time in the first place.
        background:
          - >-
              Why the wrong choices matter. Each wrong choice is built to look right — but
              only if you make one specific mistake. Maybe you skip a step. Maybe you mix up
              a quantity with a rate. Maybe you treat a coincidence as a cause. Finding which
              mistake each wrong choice matches is where the real learning happens. Picking
              the right answer by instinct alone teaches you nothing you can reuse.
          - >-
              Why the shape of a choice tells you nothing. A correct answer collects the
              qualifying clause and the unit, so it used to be the longest choice far more
              often than chance — 88 percent of the time in this game's passage quizzes,
              before that was fixed. It is now checked per game, so length, hedging, and
              detail no longer point to the answer on their own.
          - >-
              What the verdict adds. Every wrong choice gets its own reason for being wrong,
              and the verdict shows you all of them. Read them even after a correct answer.
              A right answer picked for a shaky reason looks the same as a right answer
              picked for a solid one — until a later question tests the difference.
        assumes:
          - warning time is produced by finding things, not by planning for them
        takeaway: The defense worth keeping is a standing system that can find, learn about, decide on, and act against the next threat too.
        format: CHOICE
        question: The campaign budget ends with this review. What should survive it?
        why: Warning time supports almost every choice made later in a campaign like this one. Finding an object earlier gives more nights to check its orbit. It also gives teams time to measure its size, its spin, and what it's made of. Years of warning can make even a small push enough to work. Civil authorities can prepare in stages, instead of scrambling all at once. Consequence models and public communication still matter, but they cannot buy back time that was never found. The strongest long-term investment is a survey-and-follow-up system that finds objects early, and keeps measuring them.
        choices:
          - Sustain survey completeness and rapid follow-up as the foundation, while preserving interfaces to characterization, response and preparedness.
          - Shift most recurring funds from discovery to characterization and deflection demonstrations because cataloguing is now largely complete.
          - Shift most recurring funds from discovery to civil preparedness because scientific warning will arrive automatically once an object is dangerous.
          - End new investment because the current catalogue and automated alerts make future discovery and follow-up a solved problem.
        answer: Sustain survey completeness and rapid follow-up as the foundation, while preserving interfaces to characterization, response and preparedness.
        rebuttals:
          - Characterization and deflection tests are valuable, but they need an object to be found early enough for those options to even exist.
          - Preparedness turns warning into action. It cannot create warning if the survey never finds or tracks down the object in the first place.
          - This very campaign shows that blind spots in geometry, sky coverage, and follow-up capacity are still there. Discovery is not automatic.
# What is inside each room.
interiors:
  DISC:
    caption: A detection is a claim that something moved, not that something is there.
    standLine: One faint moving point, two satellite trails and a hot pixel column in the same field.
    station:
      kind: panel
      title: Survey pipeline
      rows:
        - label: Detections tonight
          value: 41
          status: high
        - label: Candidate SNR
          value: 5.2
          status: alarm
        - label: Known objects rejected
          value: 39
          status: normal
  ORBIT:
    caption: A short arc allows a family of orbits, and some members of it hit the Earth.
    standLine: Six observatories reporting, two time standards, and an arc four hours long.
    station:
      kind: panel
      title: Orbit fit
      rows:
        - label: Arc length
          value: 4.1 h
          status: alarm
        - label: Astrometric residual
          value: 0.42 arcsec
          status: high
        - label: Observations used
          value: 22
          status: normal
  CHAR:
    caption: A bright asteroid is not necessarily a large one.
    standLine: One brightness, one assumed albedo, and a diameter the consequence model cubes.
    station:
      kind: panel
      title: Photometry bench
      rows:
        - label: Absolute magnitude
          value: 22.4
          status: normal
        - label: Assumed albedo
          value: borrowed
          status: alarm
        - label: Thermal data
          value: not yet taken
          status: low
  RADAR:
    caption: Four hours of dish time collapse an orbit that a month of imaging cannot.
    standLine: A window 4 hours wide that does not open again for 11 years.
    station:
      kind: vitals
      title: Delay-Doppler
      rows:
        - label: Round-trip delay
          value: 4.0 s
          status: normal
        - label: Window remaining
          value: 3.2 h
          status: alarm
        - label: Range precision
          value: 15 m
          status: high
  IMPACT:
    caption: The same diameter can produce a crater or a burst ten kilometres up.
    standLine: Three entry models, one reaching the ground, and a strength nobody has measured.
    station:
      kind: panel
      title: Entry model
      rows:
        - label: Kinetic energy
          value: 1.07e18 J
          status: alarm
        - label: Assumed strength
          value: unmeasured
          status: alarm
        - label: Entry angle
          value: 45 deg
          status: normal
  OPS:
    caption: Observing time is the scarce quantity, and information gain is what it should buy.
    standLine: Four hours of discretionary time, four proposals, and a press office asking for a line.
    station:
      kind: panel
      title: Coordination desk
      rows:
        - label: Impact probability
          value: 1 in 640
          status: alarm
        - label: Next radar window
          value: 9 days
          status: high
        - label: Follow-up committed
          value: 4 h
          status: normal

# What each place says when the player reads it.
# --------------------------------------------------------------- the warm-ups
# The ridge has two tiers: base camp, and the outstations a kilometre and a half
# along the road. The far lap is the night the vehicles are signed out.
warmups:
  trial-near:
    title: Walk base camp while it is still light
    why: >-
      Everything here is done in the dark, and the camp is seven buildings on a ridge with no
      street lighting. Nguyen, the survey imaging lead, walks every new observer round once
      before their first night, because a route learned in daylight is a route you can take at
      two in the morning with a red torch and no depth perception.
  greet:
    title: Two shifts that never overlap, and you are on both this week
    why: >-
      The day crew reduce what the night crew took, and the two hand over in eleven minutes at
      dawn. Garcia, the survey and response lead, wants you known to as many of them as you can
      before your first handover, because the whole survey runs on somebody trusting a
      measurement they did not take.
  trial-far:
    title: The outstations open tonight, and the keys come out
    why: >-
      The radar dish and the two outstations are a kilometre and a half down the ridge road and
      nothing out there has been called all week. From tonight they are on the list, and the
      vehicle is signed out to reach them. Drive it once in the light before you drive it at
      three in the morning.
  follow:
    title: Fischer walks the cable run once
    why: >-
      The dish's timing cable runs from the hut to the pad along a route nobody drew, and
      Fischer, the radar dynamics lead, knows every place it crosses the road. She walks it
      once. Stay with her: the places she stops are the places the cable is buried shallow, and
      those are the places it gets driven over.
  hunt:
    title: Six calibration lamps, and four are where the log says
    item: { name: calibration lamp, plural: calibration lamps }
    why: >-
      Every telescope on the ridge is calibrated against portable lamps, and two of them went
      out with somebody last week. Until all six are accounted for nobody can say the photometry
      is on one scale, and a survey on two scales is a survey that invents objects. Find them.
  canvass:
    title: Who saw the thing over the valley on Tuesday
    why: >-
      Half the valley reported a bright object on Tuesday night and the office has to say
      whether it was the re-entry everybody assumes or something else. Ask around the camp and
      the road until enough accounts have come back to separate one bright thing from two.
  evade:
    title: The visitor who wants to look through the telescope
    why: >-
      A donor's guest has been in the dome since dusk wanting to be shown something, and the
      survey cannot stop for it — every minute the shutter is off target is sky nobody covers
      tonight. Keep out of his way and get your round done.
  tag:
    title: Catch Rossi before he starts the fit
    why: >-
      Rossi, the orbit determination lead, has the two extra astrometric points from Monday that
      never made it into the file, and once the orbit fit is running it takes two hours and he
      will not stop it. The arc is short enough that two points change where this object is
      predicted to be next week.

copy:
  DISC: <p>The survey dome and its image processing room. Everything this campaign knows started as photons here.</p>
  ORBIT: <p>Orbit determination. Where a set of angles becomes a family of possible futures.</p>
  CHAR: <p>Spectroscopy and characterization. Size, reflectivity, spin and composition — the physical body itself.</p>
  RADAR: <p>The planetary radar. It measures distance directly, and only when the geometry allows.</p>
  IMPACT: <p>Entry and consequences. What the atmosphere does to an arriving body, and what is left over.</p>
  OPS: <p>The coordination office. Telescope time, international protocol, and what the public is told.</p>
  BOARD: <p>The briefing hall. The board meets here, and the record it publishes outlives everyone in the room.</p>
  TIME: <p>Time and frequency standards. Every timestamp on this mountain traces back to this building.</p>
  ARCHIVE: <p>The plate and data archive. Objects are often found years later in images already taken.</p>

# ------------------------------------------------------------- review stops
# Lessons no mission points at. From day 3 the engine appends a callback to an
# area taught earlier and requires a "— Review" variant of that lesson, so these
# are the spaced retrieval rather than spares: the same idea on a different case,
# days after it was first met. One per group, so four separate days can serve
# them — a callback whose group is already in the day is skipped.
lessons:
  - group: DISC
    title: Object or artifact? — Review
    task: Which explanation fits a mark that holds its place while the sky is moved under it?
    concept: "Telescopes: aperture, resolution, signal-to-noise"
    place: Survey Telescope Control
    scene: >-
      Nguyen, the survey imaging lead, moved the telescope 30 arcseconds between three exposures
      of a second field. Two faint candidates came out of the run. The stars shifted across the
      chip by the commanded amount; one candidate did not.
    guide: >-
      Four candidates for one mark, and the deliberate 30-arcsecond move is the
      control. Ask of each what it would have done while the telescope was being
      shifted. Two of them travel with the stars. One of them arrives once and stays
      once. And one of them would have taken the whole field with it.
    background:
      - >-
          Why the wrong options are the interesting ones. Each distractor is written to
          be the answer under one specific misreading — a step skipped, a quantity
          confused with a rate, a correlation taken for a cause. Identifying which
          misreading each belongs to is where the learning is; the right answer alone
          can be reached on instinct and teach nothing.
      - >-
          Why the shape of an option tells you nothing. A correct answer collects the
          qualifying clause and the unit. So across a whole game the key used to be the
          longest option far more often than chance — 88 per cent of passage quizzes
          here, before it was fixed. It is now checked per game as a binomial tail, so
          length, hedging and specificity have had the signal taken out of them
          deliberately.
      - >-
          What the verdict adds. Every wrong option carries its own rebuttal, and the
          verdict prints them — the reason that option fails, not a restatement of the
          right one. They are worth reading after a correct answer as well: a right
          choice made for an approximate reason is indistinguishable from a sound one
          until the day the approximation is what is being tested.
    assumes:
      - a commanded pointing shift moves the whole sky across the sensor by a known amount
    takeaway: Moving the pointing on purpose separates the sky from the instrument, and whatever stays put is the instrument.
    format: CHOICE
    question: Candidate B keeps the same pixel address through all three exposures. What is it?
    choices:
      - A fixed defect at that place on the sensor
      - A very distant object, too slow to move between frames
      - A single cosmic-ray hit in one of the exposures
      - A tracking failure during the second and third exposures
    answer: A fixed defect at that place on the sensor
    why: >-
      The deliberate shift is the test. Moving the telescope thirty arcseconds carries the whole
      sky thirty arcseconds across the sensor, so anything real travels with the stars. A mark
      that holds its pixel address through all three exposures is a property of the silicon
      rather than of the sky. A slow object is still an object, and it rides with the field. A
      cosmic ray appears once. A tracking failure would take the stars with it, and the stars
      went exactly where they were sent.
    rebuttals:
      - A slow object still holds still on the sky, so the pointing shift carries it across the sensor with the stars.
      - A cosmic ray arrives once and sharp. This mark is in all three exposures at the same place.
      - A tracking failure moves every star in the frame, and here the stars went where they were commanded.

  - group: ORBIT
    title: How far did it move? — Review
    task: Turn a shift quoted in arcminutes into a sky rate the scheduling desk can point with
    concept: Celestial coordinates and angular measure
    place: Minor-Planet Operations Desk
    scene: >-
      Rossi has a second candidate from the same night and a
      shift measured in arcminutes rather than arcseconds. The scheduling desk wants a rate
      before it books the eleven o'clock slot on the follow-up telescope.
    guide: >-
      Five numbers, and three of them are the same ninety minutes wearing different
      units, or a count of frames. Ask of each whether a rate in arcseconds per hour
      needs it. The shift was quoted in arcminutes and the answer is not, so the
      conversion is part of the measurement rather than tidying afterwards.
    background:
      - >-
          Why an estimate rather than a calculation. Every quantity on this board is
          already measured or stated, so nothing here has to be derived. What is being
          tested is whether you can pick the quantities the relationship actually needs,
          and whether the size of the answer looks right once they are in place.
      - >-
          Why the tiles carry labels. A bare number cannot be checked against the
          relationship it is going into. Reading the label is how a unit mismatch, or a
          quantity belonging to a different part of the problem, is caught before it is
          placed — which is the habit this format exists to build.
    assumes:
      - an arcminute is 60 arcseconds
    takeaway: A rate is only as trustworthy as the units it was built from, so the conversion belongs inside the measurement.
    format: BALLPARK
    question: Estimate the apparent motion in arcseconds per hour.
    why: >-
      Angular speed is an angle over a time, and both have to be in the units the answer is
      quoted in. Four and a half arcminutes is 270 arcseconds, because an arcminute holds 60 of
      them. Ninety minutes is an hour and a half. Three arcseconds a minute is 180 an hour. The
      conversion is not decoration: the arcminutes handed over straight give 3 arcseconds an
      hour, a main-belt rate, and the follow-up telescope would lose the object by dawn.
    estimate:
      relationship: Rate = angle moved ÷ time taken. Multiply by 60 to go from per minute to per hour.
      prompt: The second candidate shifts 4.5 arcminutes in 90 minutes, and the scheduling desk needs a rate before it books the follow-up slot.
      question: Estimate the apparent motion in arcseconds per hour.
      labels:
        - 270 arcsec (the 4.5 arcmin shift, converted)
        - 90 min (between the first and last frame)
        - 4 exposures
        - 5,400 s (the same interval, in seconds)
        - 1.5 h (the same interval, in hours)
      values: [270, 90, 4, 5400, 1.5]
      slots: 2
      template: "{0} ÷ {1} × 60"
      formula: a/b*60
      correct: [0, 1]
      target: 180
      tolerance: 15
      units: arcsec/hour
      solution: 270 ÷ 90 = 3 arcsec/min, so about 180 arcsec/hour.
      explanation: The 60 in the template is minutes per hour, so the interval has to be in minutes and the angle in arcseconds. Handing it the interval in seconds gives an answer 60 times too small.

  - group: IMPACT
    title: Read the risk correctly — Review
    task: Match each proposal to what it actually does to the risk distribution
    concept: Probability, risk and expected value
    place: Impact Monitoring Center
    scene: >-
      Banerjee has four proposals on the board for this week's risk
      update. Ellery wants to know which of them would change the number she has to read out at
      Friday's briefing.
    guide: >-
      Four proposals and four effects, one each. Ask of each proposal whether it adds
      information, moves where the existing information points, or only changes the
      wording. Two of them touch the distribution and two of them do not, and the pair
      that does not is the pair that will be argued for hardest on Friday.
    background:
      - >-
          Why this is a matching board and not four separate questions. Responses on
          boards like this are written to be plausible for more than one situation, so
          choosing them one at a time lets a nearly-right answer through unexamined.
          Having to place all of them forces the comparison — not "is this reasonable
          here", but "is it more right here than there".
      - >-
          How to use the one-each rule. Because the responses are a set to be
          distributed rather than a list to be sampled, every join you make constrains
          the rest. Settling the two you are confident of can leave the remaining pair
          decided by elimination. Where it does not, two responses are still competing
          for one situation, and that is exactly the distinction the stop is testing.
      - >-
          Why you cannot be wrong about exactly one. With every response used once,
          three correct joins leave the fourth with only one place to go. Any error
          therefore involves at least two joins. That is worth remembering when the last
          pair looks forced: the fault is usually not in the join you are struggling
          with, but in one you made early and stopped questioning.
    assumes:
      - a risk figure is a distribution rather than a single number
    takeaway: Only new information narrows a risk; correcting a systematic moves it, and rewording it does neither.
    format: PROTOCOL
    columns:
      - What is proposed
      - What it does to the distribution
    scenarios:
      - A catalogue bias in the reference stars is found and corrected.
      - An independent radar range is added to the orbit fit.
      - The ensemble is re-run with 10 times as many sampled trajectories.
      - The forecast is restated as 1 chance in 600 rather than 0.17 per cent.
    choices:
      - Moves the whole cloud and leaves its width alone — the same uncertainty, somewhere else.
      - Narrows the cloud around wherever its middle now sits, because information has been added.
      - Leaves the distribution as it was, and resolves the tail it already had more finely.
      - Leaves everything as it was, and changes only how large the figure sounds to a listener.
    mapping: [0, 1, 2, 3]
    why: >-
      A risk figure is a distribution, and only two kinds of work move it. Correcting a
      systematic in the reference frame shifts the whole cloud and leaves its width alone — the
      same uncertainty, somewhere else. An independent measurement adds information and narrows
      it. More samples only resolve a tail that was already there. And restating the same
      fraction in other words changes nothing except how it is heard. Two of the four are
      presentation, and presentation is not evidence.

  - group: CHAR
    title: What controls apparent brightness? — Review
    task: Order the steps that turn one night of photometry into a diameter with a range on it
    concept: Apparent and absolute magnitude; inverse-square brightness
    place: Photometry Lab
    scene: >-
      Adebayo, the physical characterization lead, has a second body from the same survey and
      one night of photometry on it. The consequence model downstream wants a diameter, and the
      room has to agree what order the work is done in.
    guide: >-
      Four cards, and each one takes something out that is not the object. Ask of each
      what would be wrong if it were done later than it should be. Two of them remove
      the instrument and the geometry. One of them is the assumption everybody wants to
      skip, and the last is the only card the consequence model ever sees.
    background:
      - >-
          Why the order is graded whole. A sequence is a claim about dependency: each
          step is here because the one before it has already happened, or has to have.
          One transposed pair falsifies that claim wherever it sits, so partial credit
          would be credit for a sequence that does not work.
      - >-
          Why the ends are the place to start. The first and last cards are constrained
          by having nothing before or after them, which usually makes them the two you
          can settle from the scene alone. Pinning them collapses the remaining
          arrangements sharply, and what is left in the middle is where the actual
          judgement lives.
      - >-
          What the rail can be ordered on. Time is the usual axis, but it is not the
          only one. An order can run on cost, on risk, or on reversibility — every
          observation that leaves the sample as it was, before any that consumes it. On
          those boards a chronological reading finds nothing, because none of the steps
          has to happen at a particular hour.
    takesAsRead:
      - Scientific notation and unit conversion
    assumes:
      - absolute magnitude is apparent magnitude with the two distances taken out of it
    takeaway: A size inferred from brightness inherits every assumption made on the way to it, and the reflectivity is the largest of them.
    format: SEQUENCE
    cards:
      - Measure the apparent magnitude against catalogue standards on the reduced frames.
      - Correct it for the Sun-to-object and object-to-Earth distances to get an absolute magnitude.
      - State a reflectivity as a range, from the darkest to the brightest plausible surface.
      - Turn absolute magnitude and reflectivity into a diameter, and carry the range through as a size band.
    order: [0, 1, 2, 3]
    why: >-
      Brightness is what arrives; a diameter is what is inferred. The order matters because each
      step takes out something that is not the object. Calibration takes out the instrument. The
      two distances take out the geometry and leave a property of the body. Only then does
      reflectivity enter, and it enters as a range because nobody has measured it here. The
      diameter comes out last and comes out as a band, because a size from a borrowed
      reflectivity is a guess with a decimal point on it.
    rebuttals:
      - The magnitude first, and against standards. An uncalibrated brightness is wrong in a way nothing downstream recovers.
      - Distances second. Absolute magnitude is what apparent magnitude means once the geometry has been taken out of it.
      - The reflectivity third, and as a range. Committing to one number here is how a size becomes a fact nobody measured.
      - The diameter last, with its band attached. A single figure from a borrowed reflectivity is the failure this whole stop is about.

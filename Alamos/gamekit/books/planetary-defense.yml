    - Mass and energy double.
    - "Energy rises by about 1.1\xB2 \u2248 1.21."
    - Energy can change by about a factor of eight through size alone.
    mapping:
    - 0
    - 1
    - 2
    - 3
    why: Energy scales linearly with density, cubically with diameter, and quadratically with speed.

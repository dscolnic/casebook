    place: Impact Physics Group
    scene: >-
      Civil defence wants an energy figure before it will convene anybody. The best current estimates are
      a radius near 50 metres, a density around 3,000 kg per cubic metre from the presumed composition
      class, and an approach speed of about 20 kilometres a second. Mass comes from the volume of a sphere
      times density; kinetic energy is half that mass times speed squared. Every term in it is a
      measurement somebody made with its own uncertainty, which is why the resulting number should arrive
      with a range rather than as a single figure.
    takeaway: Impact energy couples geometric, material, and orbital measurements.

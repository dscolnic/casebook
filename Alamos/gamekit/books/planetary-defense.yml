          real surveys keep missing, not just to the total count of detections.
        background:
          - >-
              Why a fake, known population is the tool here. With real data, nobody knows
              what was missed — that is the whole problem. Sending objects whose orbits you
              already know through the same pipeline turns "completeness" into a number you
              can measure: how many you recovered, divided by how many you put in. You can
              slice that number any way you like.

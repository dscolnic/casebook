          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - an insulator contains charge that can shift slightly without leaving its molecules
        takeaway: The material between conductors changes the relationship between stored charge and voltage.
        format: CHOICE
        question: Why does filling the gap with polyethylene raise the capacitance?
        why: A dielectric polarizes in an electric field. Bound positive and negative charge shift slightly in opposite directions, creating a field that opposes the applied field. For the same free charge, the net field and voltage fall. Because C = Q/V, capacitance rises by the material's dielectric factor, about 2.3 for polyethylene here. Polyethylene also has a larger dielectric strength than air. That separate property lets the cable survive a larger field before electrical breakdown begins.
        choices:
          - Its charge shifts against the field, so the volts fall
          - The plastic conducts slightly, which increases the effective plate area
          - Solid insulation lets the conductors sit closer together in the cable
          - Polyethylene stores charge of its own in addition to the plates
        answer: Its charge shifts against the field, so the volts fall
        rebuttals:
          - Conduction would discharge the pair rather than improve it; a good dielectric conducts as little as possible.
          - Geometry is a separate effect and these two samples are built to the same dimensions.
          - The dielectric holds no net charge; what it does is displace what it already has.
  # ---------------------------------------------------------------- day 6
  - title: Where the half comes from
    objective: Derive the energy in the bank, and say what it means for the hall.
    briefing: Twelve stages at fifty kilovolts, and the safety case rests on a number nobody re-derives.
    stake: >-
      Monday of week four, and Josefa Ruiz, the impulse hall technician, wants the hall's energy figure checked before the
      season's biggest impulse test on Friday. Twelve stages, a hundred nanofarads each, charged
      to fifty kilovolts: the placard on the barrier says fifteen hundred joules, and it has said
      so since the hall was built by people who have all since left. Emil Strand's view is that a
      number nobody has re-derived is a rumour with a unit after it, and he has been saying so
      about this one for two seasons. Today you get the stored energy out of the work it took to
      put the charge there, settle what the earthing stick is actually for, and decide what the
      hall can honestly stand in for when the sky will not cooperate.
    takeaway: The energy in a capacitor is the work done against the voltage that was already there, which is where the half comes from.
    stops:
      - group: BANK
        task: Derive the energy stored in a charged capacitor
        title: Fifteen hundred joules, or three thousand
        place: Impulse Hall
        scene: "Impulse-hall technician Ruiz sets one stage on the bench: 100 nF charged to 50 kV. The bank placard says 1,500 J for twelve stages, and Strand wants the number derived rather than trusted."
        guide: >-
          Build it a line at a time. Energy stored is the work done charging the
          capacitor, and the work of moving each increment of charge is V dq. The
          voltage rises as the charge accumulates, so this is an integral rather than a
          product. Finish with joules for one stage, so the placard can be checked.
        background:
          - >-
              Why not simply QV. Pushing the last coulomb on costs the full final voltage;
              the first one costs almost nothing. Integrating V dq with V = q/C gives half
              of QV, and the missing half is the reason a placard that quotes QV is out by a
              factor of two.
          - >-
              Where the placard number comes from. Twelve stages at the derived energy each
              gives the total. If that does not match the printed 1,500 joules, either the
              placard is quoting a different charging voltage or somebody used the wrong
              formula. Deriving it is how you find out which.
          - >-
              Why it matters on the bench. The energy in one stage is what a person standing
              beside it would receive if it discharged through them. A factor of two on that
              number is the difference between two safety categories, which is why Strand
              wants it derived rather than trusted.
        assumes:
          - moving charge onto a capacitor takes work against the voltage already across it
          - the voltage across a capacitor is proportional to the charge on it
        takeaway: Charging is done against a voltage that grows as you go, so the work is an integral and not a product.
        format: DERIVE
        question: Work out the energy stored in one stage of the bank.
        answerText: U = ½CV² = 125 J a stage, so 1,500 J across the twelve. The half is what the integral gives, because the first charge crosses no voltage and the last crosses all of it.
        why: One 100 nF stage at 50 kV stores 125 J, so twelve stages store 1,500 J. The factor of one-half is not a convention. As charge is added, the capacitor voltage rises from zero to its final value. Early charge crosses little voltage; the last increment crosses almost all of it. Integrating V dq therefore uses an average voltage of one-half the final value. Dropping that factor doubles the energy and turns a derivation into a dangerous overestimate.
        derive:
          hint: Write the work to add one more charge, then add up all of them.
          start: dU = V dq
          startNote: one stage is C = 100 nF, charged to V = 5.0 × 10⁴ V
          goal: the energy stored in one stage, in joules
          askRule: true
          rules:
            - Gauss's law
            - symmetry argument
            - superposition
            - line integral of E
            - rearrangement
            - boundary condition
          steps:
            - ask: Write the voltage in terms of the charge already on the plates.
              answer: 1
              candidates:
                - text: dU = V dq with V the final voltage, so U = QV
                  rule: boundary condition
                  survives: true
                  why: This is the whole trap of the derivation and it produces a clean, wrong answer twice the true one. The first charge crosses no voltage at all; only the last one crosses the full fifty kilovolts.
                - text: dU = (q/C) dq
                  rule: rearrangement
                - text: dU = (C/q) dq
                  rule: rearrangement
                  why: Inverted. It integrates to a logarithm, which is a respectable-looking result and has units of farads rather than of joules.
                - text: dU = (Q/C) dq
                  rule: boundary condition
                  why: Q is the final charge and q is what is on the plates as you go. Using the final value inside the integral is the same error as the first line, written in charge rather than in volts.
            - ask: Integrate from empty to the final charge.
              answer: 2
              candidates:
                - text: U = Q²/C
                  rule: rearrangement
                  why: The integral of q dq is q²/2, and the two has been lost. This is exactly the factor the derivation exists to produce.
                - text: U = ∫₀^Q (q/C) dq = Q²/(2C²)
                  rule: rearrangement
                  survives: true
                  why: A second C has appeared from the integration, which it cannot. The line is algebraically consistent and the units are joules per farad.
                - text: U = ∫₀^Q (q/C) dq = Q²/(2C)
                  rule: rearrangement
                - text: U = ∫₀^Q (q/C) dq = QC/2
                  rule: rearrangement
                  why: Multiplying by C rather than dividing. Charge times capacitance is not an energy in any system of units.
            - ask: Write it in terms of the voltage and put the numbers in.
              answer: 0
              candidates:
                - text: U = ½CV² = ½(100 × 10⁻⁹)(5.0 × 10⁴)² = 125 J
                  rule: rearrangement
                - text: U = ½CV = ½(100 × 10⁻⁹)(5.0 × 10⁴) = 2.5 × 10⁻³ J
                  rule: rearrangement
                  why: One factor of V short. Two and a half millijoules for a bank that can punch a hole through a metre of air is the kind of answer worth stopping at.
                - text: U = ½C²V = ½(100 × 10⁻⁹)²(5.0 × 10⁴)
                  rule: rearrangement
                  survives: true
                  why: The square has moved from the volts to the farads. It is a clean substitution of Q = CV into the wrong slot, and nothing later in the arithmetic complains.
                - text: U = CV² = (100 × 10⁻⁹)(5.0 × 10⁴)² = 250 J
                  rule: boundary condition
                  why: The half again, dropped at the last line rather than the first. Twice the energy, and the placard on the barrier would be wrong in the dangerous direction.
          commit: Commit the derivation
      - group: MAST
        task: Say what the earthing stick is for
        title: Charge that is still there
        place: Mast Base
        scene: Ruiz keeps the barrier closed even after the supply is off and the meter reads zero. The earthing stick must be connected to the bank and visibly left in place before anyone enters the hall.
        guide: >-
          Five signed statements about the state of the hall, and two verifications. Each one
          is somebody's record rather than a condition you have seen, so decide which would
          hurt most if the paper were wrong and check those. A claim can only be held once it
          has been verified, and holding everything critical is not caution here.
        background:
          - >-
              Why a meter reading zero is not a discharged bank. A panel meter reads what its own
              circuit sees, and a bank whose bleed path has failed can sit at full charge behind an
              open contactor with nothing on the front panel to say so. The stored energy is
              ½CV², and it does not decay because the supply was switched off.
          - >-
              What the stick actually provides. A visible, mechanically held connection between the
              bank terminal and earth — the discharge path itself, not a statement about one. Its
              whole point is that it can be seen from the door by somebody who read no paperwork.
          - >-
              Why the switch position is the weakest kind of evidence. An isolator handle records
              what somebody moved, and a contactor that has welded shut moves nothing while showing
              the same handle position. The condition and the record come apart exactly there.
        assumes:
          - a capacitor holds its charge once the supply is removed
        takeaway: Stored electrical energy can remain after its source is removed, so a safe state requires a controlled discharge path.
        format: ATTEST
        question: Which of these signed claims about the hall cannot be held, given what the evidence actually supports?
        answerText: The bleed-resistor claim and the isolator claim. Neither has been verified against the bank's own terminals, and both are what the earthing stick exists to make unnecessary.
        why: The hall is safe when there is a discharge path somebody can see, not when the paperwork says the supply is off. Two of these claims are critical and unbacked. The bleed resistor is signed off on a 2019 commissioning sheet, and a bleed path that has failed open leaves the bank at full charge with a panel meter reading zero — the meter's circuit and the bank's terminals are not the same node. The isolator claim records a handle position, and a welded contactor holds the same handle while passing current. Two others are critical and genuinely backed: the earthing stick is visible from the door, which is the point of it, and the terminal voltage was measured directly this morning at the bank rather than inferred from the panel. The stored energy is ½CV² and nothing about switching the supply off removes it. That is why the safe state is a connection you can see and not a signature you can read.
        attest:
          checks: 2
          moral: A signature records who is answerable. The earthing stick is the only item on this list that is a condition rather than a claim about one.
          claims:
            - id: stick
              label: The earthing stick is connected to the bank terminal and left in place
              signedBy: Tate, rigger
              evidence: Visible from the door, mechanically clamped, tag attached
              critical: true
              backed: true
            - id: terminal
              label: The bank terminals read under 5 V
              signedBy: Ruiz, this morning
              evidence: Measured at the terminals with a calibrated probe at 08:40 today
              critical: true
              backed: true
            - id: bleed
              label: The bleed resistors discharge the bank within 90 seconds
              signedBy: commissioning sheet, 2019
              evidence: No test since installation; a failed bleed path is open-circuit and silent
              critical: true
              backed: false
            - id: isolator
              label: The supply isolator is open and locked
              signedBy: shift log
              evidence: Records a handle position; a welded contactor holds the same position
              critical: true
              backed: false
            - id: meter
              label: The panel meter reads zero
              signedBy: control desk
              evidence: Reads its own circuit, which is not the bank terminals
              critical: false
              backed: true
      - group: SHOT
        task: Decide what the impulse test can and cannot stand in for
        title: A clean pulse and a real one
        concept: "Instrument bandwidth: what a slow instrument cannot see"
        place: Launch Control
        scene: |-
          Strand can fire the bank into the mast on any afternoon, with a rise time he chooses. Vero would rather wait for a cell. Kaya has to write down which of the two the season's waveform library is built from.
        guide: >-
          Four things the hall might offer that a natural stroke cannot. Ask of each
          whether the hall's advantage is control or magnitude. The hall chooses the
          moment and the shape, every time. A natural stroke varies from event to event,
          and that variation is what the station exists to measure. So the library needs
          both kinds labelled, or calibration data pass as weather.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - an instrument is calibrated against a signal whose shape is known
        takeaway: "Calibration data and natural-event data answer different questions: repeatability versus real-world variation."
        format: CHOICE
        question: What can the hall's impulse do for the station that a triggered strike cannot?
        why: "The impulse hall gives a signal whose timing and waveform are chosen in advance. That makes repeated calibration possible. A natural triggered stroke is different: its peak, rise time and number of strokes vary from event to event. Those variations are exactly what the station exists to measure. The hall can therefore test response and timing under repeatable conditions. It cannot replace the weather record. The library needs both kinds of shot labelled clearly so calibration data never masquerade as atmospheric data."
        choices:
          - Arrive at a known moment with the same shape every time
          - Reach the peak currents that a natural return stroke reaches
          - Reproduce the variation between one stroke and the next
          - Test the whole current path from the tip to the soil
        answer: Arrive at a known moment with the same shape every time
        rebuttals:
          - Peak current in the hall is a fraction of a natural stroke, which is one reason the hall cannot replace it.
          - Variation is precisely what a repeatable pulse does not have.
          - The hall's pulse enters at the base, so it never tests the tip or the channel above it.
  # ---------------------------------------------------------------- day 7
  - title: Three instruments that agree
    objective: Find out whether the current measurements are independent of each other.
    briefing: Three shunts, three readings within ten per cent, and one thing they have in common.
    stake: >-
      Tuesday, and Kenji Nakata, the current measurement engineer, has the S-114 record open because the funding review will quote
      it. Three separate measurements of last August's strike agree within ten per cent, which the
      station has been treating as confirmation for a year and which Vero has already put in a
      draft. Nakata does not like how tidy it is. Ana Sifuentes has pointed out, without making
      anything of it yet, that every digitiser on the site is referred to one rod. Today you open
      each channel, find what its reading was measured against, and work out what the agreement
      between them is actually worth to a reviewer who asks.
    takeaway: Instruments that share a reference share its errors, and their agreement measures nothing.
    stops:
      - group: MAST
        task: Find the reference the agreeing channels have in common
        title: Agreement is not independence
        place: Mast Base
        scene: |-
          Five records exist of strike S-114. Four of them give a peak current and the fifth gives a stroke count. Nakata has their derivations closed and wants the shared piece named before anybody quotes the average.
        guide: >-
          Open a channel and the panel shows what its reading was referred to. Tick the
          ones that would still stand if a shared reference were wrong, and untick the
          rest. Then name the piece they have in common. Four records agreeing is not
          four independent measurements, and both halves of this are graded.
        background:
          - >-
              Why agreement is not independence. Four peak currents computed through the
              same rod reference will agree with each other whatever that reference does,
              because the error is common to all of them. Averaging them narrows the scatter
              and does nothing about the bias, which is the most convincing way to be wrong.
          - >-
              What the fifth record is doing. A stroke count is not a current, so it cannot
              be averaged with the others. It is on the board because it does not pass
              through the suspect step, which makes it worth more than any of the four for
              this particular question.
          - >-
              Why naming the shared piece is the answer. Once the common reference is
              identified it can be corrected, and every dependent record moves together.
              Withdrawing the average instead leaves the same error in place and tells the
              review that nothing is known.
        takesAsRead:
          - Current as a flow, and current density
        assumes:
          - a measurement is made against something, and that something can be wrong
        takeaway: A number quoted three times from one reference is one number, however many instruments produced it.
        format: TRACE
        question: Four of these five report the same peak. Open them, keep whatever still stands on its own, and name what they have in common.
        trace:
          hint: Open a channel to see what its reading was referred to. Tick the ones that would survive if a shared reference were removed, then name the reference.
          channels:
            - id: shuntTop
              label: Upper shunt at 45 m
              reading: 28 kA
              depends:
                - rod
                - rack
            - id: shuntMid
              label: Middle shunt at 30 m
              reading: 29 kA
              depends:
                - rod
                - rack
            - id: divider
              label: Base divider
              reading: 31 kA equivalent
              depends:
                - rod
            - id: rogowski
              label: Clamp around the lead
              reading: 30 kA
              depends: []
            - id: camera
              label: High-speed camera
              reading: three strokes down one channel
              depends: []
          resources:
            - id: rod
              label: The single earth rod every digitiser is referred to
            - id: rack
              label: The instrument rack supply at the base
          independent:
            - rogowski
            - camera
          target: rod
          commit: Name the shared reference
        answerText: The shared source is the single earth rod. Three current channels use it, so their agreement is not independent. The clamp measures the magnetic field around the lead and keeps its evidence because it needs no earth reference.
        why: A shunt reports voltage across a known resistance, and voltage is always a difference between two points. If several channels share the same earth rod, motion of that reference appears in all of them together. The channels can then agree without being independent. The clamp is different. It responds to the magnetic field around the conductor and never uses the earth rod. That separate dependency chain is what makes its agreement informative rather than another copy of the same reference.
      - group: EARTH
        task: Work out what the rod does during a strike
        title: The rod is not a fixed point
        place: Earthing Compound
        scene: |-
          Sifuentes draws the rod as a resistor rather than as a symbol. Thirty kiloamps into twenty-five ohms puts the whole compound somewhere, and every instrument in the rack calls that somewhere zero.
        guide: >-
          Four readings of what the rod does during a strike. Ask of each whether the
          earth is being treated as a conductor with resistance, or as a fixed zero.
          Push current through a resistance and a potential difference appears, for as
          long as it lasts. Everything on the site calls that potential zero. Whether
          that matters depends on how many places are earthed.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        takesAsRead:
          - Current as a flow, and current density
        assumes:
          - a resistance carrying current has a voltage across it
        takeaway: An electrical reference is only a chosen zero; real resistance can make that reference move when large current flows.
        format: CHOICE
        question: What happens to the potential of the earth rod while the strike current is flowing?
        why: |-
          The earth is a conductor with resistance, so pushing current into it produces a potential difference exactly as a resistor does. Thirty kiloamps through twenty-five ohms lifts the rod by hundreds of kilovolts relative to soil far away, for as long as the current lasts. That is not necessarily damaging: if everything on the site is bonded to the same rod, everything rides up together and nothing sees a difference. The damage starts wherever two things are earthed at two places, which is what the outstation is.
        choices:
          - It rises with the current, and so does the rack
          - It stays at zero, which is what makes it a reference
          - It falls, because current is being drawn away from it
          - It oscillates around zero at the frequency of the stroke
        answer: It rises with the current, and so does the rack
        rebuttals:
          - Zero is a choice of reference and holds only while no current is flowing through it.
          - Current is being pushed in rather than drawn away, and either direction produces a rise in magnitude.
          - A stroke is a single unipolar pulse rather than an oscillation, so the rise does not swing about zero.
      - group: SHOT
        task: Match the rod-referenced peak with more than one true-current and reference-offset pair, then add the independent clamp.
        title: One peak, one shared offset
        place: Launch Control
        scene: Yusuf Kaya has three rod-referenced shunt peaks at 28, 29 and 31 kA, plus a 30 kA clamp reading. The review wants one peak, but the three shunts still share the same moving earth reference.
        guide: >-
          Two controls slide along a family of solutions that fit the shunt mean equally
          well. Find out how wide that family is before deciding anything. Then bring in
          the clamp reading, which does not share the shunts' earth reference, and watch
          what it does to the family. Report the peak when the data supports one rather
          than several.
        background:
          - >-
              Why three shunts do not settle it. All three are referenced to the same moving
              earth, so a shift in that reference moves all three together. The mean of 28,
              29 and 31 is therefore consistent with a range of true peaks paired with a
              range of offsets — one equation, two unknowns.
          - >-
              What the clamp brings. It measures the current a different way, without the
              rod reference. So it constrains the same true peak through a different
              combination of unknowns, and where the two constraints cross is the answer.
              That is why one independent measurement is worth more than three more shunts.
          - >-
              Why saying 'several' is a legitimate answer for a while. Reporting a single
              peak from the shunts alone would be reporting a number the data does not
              contain. The honest intermediate answer is the family, and the professional
              move is to go and get the measurement that collapses it.
        assumes:
          - an average of several readings is only better than one if they are independent
        takeaway: A shared reference can trade off against the true signal; an independent measurement can collapse that ambiguity.
        format: DEGENERACY
        question: How many true peak currents fit the shunts before the independent clamp is added?
        degeneracy:
          hint: First fit the rod-referenced shunt mean with several combinations. Then add the clamp, which does not use the earth rod.
          controls:
            - id: true_peak
              label: True peak current
              min: 25
              max: 35
              step: 0.1
              unit: kA
              truth: 30
            - id: rod_offset
              label: Shared earth-reference offset
              min: -5
              max: 4
              step: 0.1
              unit: kA
              truth: -0.7
          firstObservable:
            label: Rod-referenced shunt mean
            target: 29.3
            tolerance: 0.25
            unit: kA
          secondObservable:
            label: Independent magnetic clamp
            target: 30
            tolerance: 0.5
            unit: kA
          truth:
            a: 30
            b: -0.7
          tolerance:
            a: 0.5
            b: 0.5
          answerTolerance: 0.5
          locus:
            - a: 26
              b: 3.3
            - a: 28
              b: 1.3
            - a: 30
              b: -0.7
            - a: 32
              b: -2.7
            - a: 34
              b: -4.7
          second:
            label: Second measurement
            locus:
              - a: 30
                b: -4
              - a: 30
                b: -0.7
              - a: 30
                b: 3
        answerText: Before the clamp, several true-current and shared-offset pairs fit the rod-referenced readings. The independent 30 kA clamp selects a true peak near 30 kA and leaves the common reference offset as the shared nuisance term.
        why: The three shunts do not independently determine the true current because each is measured against the same earth rod. A shift in that rod can move all three together. The shunt average therefore permits several combinations of true peak and shared reference offset. The magnetic clamp uses different physics and no earth reference. Its 30 kA reading cuts across that family of solutions. The important gain is not another decimal place. It is removing an ambiguity that three agreeing channels cannot remove by themselves.
  # ---------------------------------------------------------------- day 8
  - title: What thirty kiloamps does at two metres
    objective: Get the field around the down-conductor, and say what has to live in it.
    briefing: The instrument cabinet sits two metres from the down-conductor and has done for nine years.
    stake: >-
      Wednesday, and Tate has been asked to move the instrument cabinet and wants a reason he can
      put in a job sheet. It has stood two metres from the down-conductor since the mast went up.
      Nakata's clamp says thirty kiloamps went past it in August and nobody has ever written down
      what that means at the cabinet door. Today you get the magnetic field around a conductor out
      of Ampère's law, work out what force that puts on the bonding straps, and settle what the
      hall can and cannot test about it.
    takeaway: A current does not stay in its conductor as far as anything nearby is concerned.
    stops:
      - group: MAST
        task: Derive the field around the down-conductor
        title: Once round the conductor
        place: Mast Base
        scene: |-
          Thirty kiloamps down a single vertical conductor, and a steel cabinet two metres from it. Tate wants the field at the cabinet in a unit he can compare with something.
        guide: >-
          Build it a line at a time. Ampère's law relates the field around a closed loop
          to the current through it. Choose a circle centred on the conductor and the
          symmetry makes the integral trivial. Evaluate at two metres and give the
          answer in tesla, so it can be compared with something familiar.
        background:
          - >-
              Why a circle. The field around a long straight conductor circles it, with the
              same magnitude everywhere at a given radius. So the line integral around a
              concentric circle is the field times the circumference, and Ampère's law hands
              you the field in one step. Any other loop gives the same physics and much
              worse algebra.
          - >-
              What to compare it with. The Earth's field is about fifty microtesla. A steel
              cabinet two metres from thirty kiloamps sits in something far larger for a few
              microseconds, which is why the cabinet's contents care and why the comparison
              is the useful part of the answer.
          - >-
              Why the peak matters rather than the average. The field follows the current
              instant by instant, so the number worth quoting is at the peak. It is also the
              moment the induced voltages downstream are largest, which is the subject of
              the trench-loop stop later in the fortnight.
        takesAsRead:
          - Current as a flow, and current density
        assumes:
          - the circulation of the magnetic field around a closed path counts the current through it
          - the field of a long straight conductor circles it
        takeaway: Choosing a path the field is constant along is what turns Ampère's law from a statement into a number.
        format: DERIVE
        question: Get the magnetic field two metres from the down-conductor while the strike is at its peak.
        answerText: B = μ₀I/2πr = 3.0 × 10⁻³ T, three millitesla at the cabinet door — about sixty times the Earth's field, for a hundred microseconds.
        why: At two metres, a 30 kA current produces about 3.0 mT. Ampère's law works cleanly because a circular path around the conductor has B parallel to the path and nearly constant in size. That symmetry lets B leave the integral. The result falls as 1/r, not 1/r², because the source is treated as a long line current. The magnetic field also stores energy while the current flows, which is why inductance later matters to fast strike transients.
        derive:
          hint: Choose the path first, and say what licenses taking B outside the integral.
          start: ∮B·dl = μ₀I_enc
          startNote: I = 3.0 × 10⁴ A at the peak, r = 2.0 m, μ₀ = 4π × 10⁻⁷ T·m/A
          goal: the magnetic field at the cabinet, in tesla
          askRule: true
          rules:
            - Gauss's law
            - symmetry argument
            - superposition
            - line integral of E
            - rearrangement
            - boundary condition
          steps:
            - ask: Choose the path to go round.
              answer: 2
              candidates:
                - text: a square loop of side 2 m centred on the conductor
                  rule: symmetry argument
                  survives: true
                  why: The law holds for it and the enclosed current is the same, so the equation is true — and B is not constant along a square, so it cannot come out of the integral and the line leads nowhere.
                - text: a straight path from the conductor out to the cabinet
                  rule: line integral of E
                  why: Ampère's law is about a closed path. An open one encloses no area and there is no current through it to count.
                - text: a circle of radius 2 m centred on the conductor
                  rule: symmetry argument
                - text: a closed surface around the base of the mast
                  rule: Gauss's law
                  why: That is the other law. A surface counts flux out of it; this one needs a path with a current threading it.
            - ask: Write the circulation along that path.
              answer: 0
              candidates:
                - text: ∮B·dl = B(2πr)
                  rule: symmetry argument
                - text: ∮B·dl = B(πr²)
                  rule: rearrangement
                  survives: true
                  why: An area where a length belongs. It solves cleanly and gives a field in tesla per metre, and at r = 2 the two numbers are close enough that the answer looks ordinary.
                - text: ∮B·dl = B(2πr)cos θ, carrying the angle
                  rule: symmetry argument
                  why: The angle between B and dl is genuinely in the definition, and on this path it is zero everywhere. Carrying it is correct and unfinished.
                - text: ∮B·dl = B(4πr²)
                  rule: Gauss's law
                  why: The area of a sphere, borrowed from the electrostatic problem. Nothing here is a sphere and nothing here is a surface.
            - ask: Set it equal to the enclosed current and solve.
              answer: 1
              candidates:
                - text: B = μ₀I(2πr)
                  rule: rearrangement
                  why: The path length has moved to the top. It gives a field that grows with distance, which would make the far side of the compound the dangerous place.
                - text: B = μ₀I/(2πr)
                  rule: rearrangement
                - text: B = I/(2πrμ₀)
                  rule: rearrangement
                  survives: true
                  why: μ₀ inverted. The line is consistent and the answer is 1.9 × 10⁹, which reads as a large number in a domain where large numbers are normal.
                - text: B = μ₀I/(4πr²)
                  rule: superposition
                  why: That is the Biot–Savart contribution of a single current element, not the total for a long conductor. Integrating along the whole wire is what removes the square.
          commit: Commit the derivation
      - group: BANK
        task: Estimate the charge the stroke moved
        title: How much charge came down
        place: Impulse Hall
        scene: Strand wants the August stroke written in coulombs as well as kiloamps. The clamp recorded a 30 kA peak and the current stayed near that scale for about 100 microseconds. The hall comparison is waiting on the number.
        guide: >-
          Five numbers, and three of them belong to other parts of the event. The rise
          time of the front. The earth resistance. The energy in the impulse store. Ask
          of each whether charge depends on it. Peak current, total charge and rise time
          describe different things. The front controls induced voltage. The duration
          controls how much charge moves.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - charge is current multiplied by the time it flows for
        takeaway: Peak current, delivered charge and rise time describe different parts of a pulse, so matching one does not match the whole event.
        format: BALLPARK
        question: Estimate the charge delivered by the August return stroke.
        why: The stroke moves about 3 C in roughly 100 microseconds. That is much more charge than the impulse hall bank can deliver, even when the hall reproduces a similar front rate. Peak current, total charge and rise time describe different parts of the event. The microsecond front controls induced voltage through dI/dt. The longer current duration controls how much charge moves. A useful calibration must therefore say which property it reproduces rather than calling the entire laboratory pulse equivalent to lightning.
        estimate:
          prompt: The clamp puts the August stroke at 30 kA peak, and the current stayed within a factor of two of that for about 100 microseconds.
          question: Choose the current and the time it flowed for.
          labels:
            - 30000  (A, peak current from the clamp)
            - 100e-6  (s, the duration of the stroke)
            - 1e-6  (s, the rise time of the front)
            - 25  (Ω, the measured earth resistance)
            - 1500  (J, the energy in the hall's bank)
          values: [30000, 0.0001, 0.000001, 25, 1500]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 3
          tolerance: 0.9
          units: coulombs
          relationship: Charge Q = I × t, the current multiplied by the time for which it flows.
          solution: 30,000 × 100 × 10⁻⁶ = 3 C.
          explanation: About three coulombs. The rise time is a much shorter interval and belongs to a different question — it is what decides induced voltages rather than delivered charge, and using it here gives three hundredths of a coulomb, which is a hundred times light.
          givens:
            - Peak current 30 kA
            - Flowing for about 100 microseconds
      - group: COUPLE
        task: Say what the field at the cabinet does to what is inside it
        title: The cabinet is a loop
        concept: Magnetic flux through a surface
        place: Outstation
        scene: |-
          Lauwers is unbothered by three millitesla as a number and very bothered by how fast it arrives. Inside the cabinet there are half a dozen circuits, each of them a loop of some area.
        guide: >-
          Work out the field the down-conductor puts at the cabinet, from the current in it
          and the distance to it. A long straight conductor gives a field that falls as one
          over the distance, so pick the current, the distance and the constant. One tile is
          the cabinet's own loop area, which belongs to the next step rather than this one.
        background:
          - >-
              Where the field comes from. A long straight conductor carrying current produces a
              circulating field of magnitude μ₀I / 2πr — the form the Biot–Savart integral takes for
              a straight wire, and the one worth remembering because most conductors on a mast are
              straight over the distances that matter.
          - >-
              Why the rate matters more than the number. Three millitesla is unremarkable. Arriving
              in two microseconds is not: the voltage driven around a loop is the area times the rate
              of change of the field through it, so the same field arriving a thousand times faster
              drives a thousand times the volts.
          - >-
              What that does inside the cabinet. Every circuit in there encloses some area, and none
              of them was drawn as an antenna. A loop of a tenth of a square metre in a field
              changing at fifteen hundred tesla a second sees a hundred and fifty volts around it,
              which is what nobody wired and everybody has to live with.
        assumes:
          - a changing magnetic field through a loop drives a voltage around it
        takeaway: A changing electromagnetic field can drive voltage in a nearby circuit without any direct electrical contact.
        format: BALLPARK
        question: What magnetic field does the down-conductor put at the cabinet during the stroke?
        answerText: About 3 millitesla at 2 m from a 30 kA stroke — and because it arrives in two microseconds, a tenth of a square metre of circuit inside the cabinet sees around 150 volts.
        why: "For a long straight conductor the field is B = μ₀I / 2πr. With a 30 kA stroke down a conductor 2 m from the cabinet, B = (4π × 10⁻⁷ × 30,000) ÷ (2π × 2) ≈ 3.0 × 10⁻³ T, which is the three millitesla on the sheet. That number on its own is harmless. What matters is that the stroke delivers it in about two microseconds, so dB/dt is roughly 1,500 tesla per second, and the voltage driven around a loop is the flux rate through it: EMF = A dB/dt. Every circuit in the cabinet encloses some area, and a tenth of a square metre gives about 150 V around a loop nobody drew as an antenna. No connection to the down-conductor is needed for any of this. That is why the fix is loop area rather than insulation — twisted pairs, tight returns, and cable routes that do not enclose the cabinet's own volume. The same field acts on the conductors carrying it: the force on a current in a field is IlB, so two parallel bus bars in a stroke repel hard enough to need a brace. And the energy stored in the inductance — half L I squared, tens of kilojoules in the strike — has to go somewhere when the current stops."
        estimate:
          prompt: The stroke is 30 kA down a conductor 2 m from the cabinet. μ₀ / 2π is 2 × 10⁻⁷ T·m/A.
          question: Choose the constant, the current, and the distance.
          labels:
            - 2e-7  (μ₀ / 2π, in T·m/A)
            - 30000  (I, the stroke current in A)
            - 2  (r, the distance to the cabinet in m)
            - 0.1  (the loop area inside the cabinet, in m²)
            - 1500  (dB/dt during the stroke, in T/s)
          values: [0.0000002, 30000, 2, 0.1, 1500]
          slots: 3
          template: '{0} × {1} ÷ {2}'
          formula: a*b/c
          correct: [0, 1, 2]
          target: 0.003
          tolerance: 0.0003
          units: tesla (about 3 mT)
          solution: 2 × 10⁻⁷ × 30,000 ÷ 2 = 3.0 × 10⁻³ T, and at 1,500 T/s a 0.1 m² loop sees about 150 V.
          explanation: The field is unremarkable and its rate of change is not. Loop area is the lever, not insulation.
          givens:
            - 30 kA stroke, 2 m from the cabinet
            - the field arrives in about two microseconds, so dB/dt ≈ 1,500 T/s
          relationship: For a long straight conductor Biot–Savart gives B = μ₀I / 2πr, and the voltage around a loop is then EMF = A dB/dt.

  # ---------------------------------------------------------------- day 9
      - group: BANK
        task: Hold the bank voltage while the shot is prepared.
        title: The charge, while the hall waits
        concept: "Capacitance as a ratio, before it is a formula"
        place: Impulse Hall
        scene: The bank has to sit at its charging voltage while the crew finish in the hall and the trigger is armed. The bleed resistors are draining it the whole time, and the charging set is the only thing putting it back.
        guide: >-
          Hold the bank voltage inside the band on the console. The band narrows as the shot
          approaches, because the peak current depends on where the bank sits when the trigger
          fires, and a shot fired off-voltage is a shot nobody can compare with the others.
          The charging set is your control.
        background:
          - >-
              Why a bank drains at all. The bleed resistors are a safety feature, not a fault: they
              are what makes the bank safe to approach after a shot, and they work all the time,
              including now.
          - >-
              Why that is a rate. The bank loses charge continuously through the bleed path, so the
              voltage falls and keeps falling. A charging set switched on and off leaves the bank
              somewhere it did not intend to be.
          - >-
              Why the margin tightens near the shot. The energy stored is proportional to the square
              of the voltage, so a few per cent of voltage is a larger error in energy — and the
              whole point of the shot is comparison with the others in the series.
        assumes:
          - a charged bank stores energy and can lose it through a resistor
        takeaway: A store that is always leaking is held by matching the leak, not by topping it up.
        format: HOLD
        question: Hold the bank at its charging voltage until the shot fires.
        answerText: Inside the band until the trigger, with the charging set matched to the bleed rather than switched on after the voltage has already sagged.
        why: >-
          The bleed resistors are draining the bank the entire time it is charged, which is
          exactly what they are for — they are the reason anybody can walk into the hall after
          a shot. But they do not wait for the shot, so the bank is losing charge continuously
          while the crew finish and the trigger is armed. That makes the charging set a rate to
          be matched rather than a switch to be flicked: set it to replace what the bleed
          takes, and the voltage sits still. The band narrows because the stored energy goes as
          the square of the voltage, so a small sag near the trigger is a larger error in the
          energy delivered, and the value of this shot is that it can be compared with the
          others in the series. A shot fired two per cent low is not a slightly smaller shot;
          it is a point nobody can plot.
        hold:
          quantity: Bank voltage
          unit: kV
          control: Charging set
          hold: 50
          band: 0.4
          narrowTo: 0.2
          duration: 45
          direction: raise
          authority: 0.1
          pass: 0.8
          hint: The bleed never stops. Match it rather than topping the bank up after it sags.
          disturbances:
            - { label: Bleed resistors draining the bank, at: 4, amount: -0.03 }
            - { label: Second string switched in, at: 20, amount: 0.05 }
            - { label: Hall warms and the bleed rises, at: 38, amount: -0.045 }
          commit: Report the charge
  - title: Nothing was connected to anything
    objective: Work out how a strike reached a cable it never touched.
    briefing: The outstation cards died in August, and the trailer is bonded to nothing that was struck.
    stake: >-
      Thursday, and this is the question the station has been arguing about for a year. In August
      every card in the outstation trailer died. The trailer is two hundred metres from the mast,
      it is earthed to its own rod, and no conductor runs between it and anything the strike
      touched. Sifuentes has been defending the earthing for twelve months and Lauwers has been
      saying the earthing was never the route. Today you compute the flux through the cable loop
      that runs beside the down-conductor, and find out what a microsecond does to it.
    takeaway: A circuit that touches nothing can still be driven, because flux does not need a connection.
    stops:
      - group: COUPLE
        task: Derive the voltage induced in the trench cable
        title: The loop nobody drew
        place: Cable Trench
        scene: Sam Abioye, the instrumentation technician, has the outstation trench route on the wall. For forty metres, the signal pair runs beside the down-conductor. Its near side is 1.5 m away; the far side is 3.5 m away.
        guide: >-
          Build it a line at a time. The field from the down-conductor falls as one over
          the distance, so the flux through the trench loop needs an integral across it,
          from the near side to the far side. Then Faraday's law turns the changing flux
          into a voltage. Evaluate it at the front of the August stroke.
        background:
          - >-
              Why an integral rather than a product. The field is not uniform across the
              loop: at 1.5 metres it is more than twice what it is at 3.5. Flux is the field
              integrated over the area, and with B going as one over r the integral gives a
              logarithm of the ratio of the two distances.
          - >-
              Why the ratio is what matters. Only b over a appears, so moving both sides of
              the pair further out changes the answer far less than separating them does. A
              signal pair run tight together in the same trench sees very little; the same
              pair split by two metres sees a great deal.
          - >-
              What the voltage does. It appears in series with the signal, so the instrument
              at the far end cannot distinguish it from the measurement. That is the
              mechanism behind most of the station's unexplained records, and it is why the
              trench route on the wall is a wiring diagram and a physics problem at once.
        assumes:
          - the field around a long conductor falls off as one over the distance
          - a changing flux through a loop drives an EMF around it
        takeaway: The field across the loop is not uniform, so the flux is an integral, and it comes out as a logarithm of the two distances.
        format: DERIVE
        question: Work out the voltage driven around the trench loop by the August stroke.
        answerText: About 200 kV. The loop geometry gives M ≈ 6.8 µH. With dI/dt = 3 × 10¹⁰ A/s, the induced EMF is about 2.0 × 10⁵ V.
        why: The trench loop sees about 200 kV even though the strike never touches it. Integrating the magnetic field across the loop gives a mutual inductance of 6.8 µH. Multiplying that by the strike's dI/dt produces the induced EMF. The logarithm comes from the field being stronger on the near side than the far side. Lauwers circles the answer on the board. The failed path was geometric coupling through a loop, not current arriving through the cable insulation or trailer earth.
        derive:
          hint: Build the flux out of strips, integrate across the loop, then differentiate in time.
          start: B(r) = μ₀I/(2πr)
          startNote: ℓ = 40 m parallel, a = 1.5 m, b = 3.5 m, dI/dt = 3.0 × 10¹⁰ A/s at the front
          goal: the EMF driven around the trench loop, in volts
          askRule: true
          rules:
            - Gauss's law
            - symmetry argument
            - superposition
            - line integral of E
            - rearrangement
            - boundary condition
          steps:
            - ask: Write the flux through a strip of the loop at distance r.
              answer: 3
              candidates:
                - text: dΦ = B·ℓ·dr with B taken at the middle of the loop
                  rule: boundary condition
                  survives: true
                  why: Using the mid-distance value turns the integral into a product and loses the logarithm. It is about eight per cent low here and it is the version most people write, because it is right whenever the field is uniform and this field is not.
                - text: dΦ = B·dr, without the length
                  rule: rearrangement
                  why: A strip has two dimensions. Dropping the forty metres leaves webers per metre, and the answer is forty times small.
                - text: dΦ = B·ℓ·r·dr
                  rule: rearrangement
                  why: An extra factor of r, borrowed from a polar area element. The strip here is a rectangle and its area is ℓ dr.
                - text: dΦ = B(r)·ℓ·dr
                  rule: superposition
            - ask: Integrate across the loop, from the near conductor to the far one.
              answer: 1
              candidates:
                - text: Φ = (μ₀Iℓ/2π)(b − a)
                  rule: rearrangement
                  survives: true
                  why: The integral of dr rather than of dr/r. Clean, and it says a loop twice as far away links the same flux for the same width, which is not how a field that falls off works.
                - text: Φ = (μ₀Iℓ/2π)·ln(b/a)
                  rule: line integral of E
                - text: Φ = (μ₀Iℓ/2π)·ln(b − a)
                  rule: rearrangement
                  why: "A logarithm of a length, which has no meaning: the argument of a log has to be a ratio. It is also negative for gaps under a metre."
                - text: Φ = (μ₀Iℓ/2π)(1/a − 1/b)
                  rule: rearrangement
                  why: That is the integral of dr/r², which belongs to a point source. Here the field goes as one over r and integrates to a logarithm.
            - ask: Differentiate to get the EMF.
              answer: 0
              candidates:
                - text: ε = (μ₀ℓ/2π)·ln(b/a)·dI/dt
                  rule: rearrangement
                - text: ε = (μ₀Iℓ/2π)·ln(b/a)·dI/dt
                  rule: rearrangement
                  survives: true
                  why: The current has been kept as well as its derivative. The line is tidy and the answer is thirty thousand times too large, which in a domain of large numbers is not obviously absurd.
                - text: ε = (μ₀ℓ/2π)·ln(b/a)·I
                  rule: boundary condition
                  why: Faraday's law is about the rate of change. Using the current itself makes the steady state as dangerous as the front, which the site's nine quiet years disprove.
                - text: ε = (μ₀ℓ/2π)·d[ln(b/a)]/dt
                  rule: line integral of E
                  why: The geometry is not moving. Nothing in the logarithm depends on time, so this differentiates to zero and predicts that nothing ever happens.
            - ask: Put the numbers in.
              answer: 2
              candidates:
                - text: ε = (2 × 10⁻⁷)(40)(0.85)(3.0 × 10¹⁰)/40
                  rule: rearrangement
                  why: The length has been divided out again at the end, which undoes the strip. Five kilovolts is survivable and the trailer did not survive.
                - text: ε = (2 × 10⁻⁷)(0.85)(3.0 × 10¹⁰)
                  rule: rearrangement
                  survives: true
                  why: The forty metres was dropped between lines. Five kilovolts again, by a different route, and it is the number somebody quotes when the cable run is described as short.
                - text: ε = (2 × 10⁻⁷)(40)(0.85)(3.0 × 10¹⁰)
                  rule: rearrangement
                - text: ε = (2 × 10⁻⁷)(40)(0.85)(3.0 × 10⁴)
                  rule: rearrangement
                  why: The peak current has been used where its rate of change belongs. It gives two tenths of a volt and would close the investigation with the wrong answer.
          commit: Commit the derivation
      - group: MAST
        task: Which explanation fits all four observations?
        title: What survived in August
        place: Screened Room
        scene: Four devices were on the outstation loop in August. EMC engineer Lauwers has each device's operating state and post-strike condition on separate cards. She wants one explanation that fits all four without changing the facts between cards.
        guide: >-
          Four observations, and the two survivors are as informative as the casualties.
          The cable insulation still holds its test voltage. A battery logger three
          metres away is untouched. Ask of each candidate how many of the four it
          covers. What differs between the damaged pair and the logger is not the storm.
          It is how much area the circuit encloses.
        background:
          - >-
              Why the unremarkable readings decide it. The salient reading is what draws
              attention, and it is usually consistent with several explanations at once,
              which is why it rarely settles anything. The readings that discriminate are
              the ones a candidate predicts should have moved and which have not: a normal
              value is a positive result against every mechanism that would have disturbed
              it.
          - >-
              How to work the candidates. Take each mechanism and predict the panel it
              implies before you look at the panel again — which readings it drives, in
              which direction, and by roughly how much. Then compare. Working that way round
              is what separates a diagnosis from a rationalisation, because the prediction
              is made before the data is consulted.
          - >-
              Why only one candidate survives. Several will account for part of the panel,
              deliberately so, and a partial fit is exactly what a confident wrong answer
              feels like from the inside. When two remain, look for the reading on which
              their predictions differ and let it decide. If no reading separates them you
              have not finished reading the panel.
        assumes:
          - a loop's induced voltage grows with the area it encloses
        takeaway: A good failure explanation must fit both the damaged equipment and the nearby equipment that survived.
        format: DIAGNOSIS
        why: The cable insulation still holds its test voltage, so a breakdown through the insulation does not fit. The battery logger three metres away is also unharmed despite sharing the storm environment. What differs is enclosed loop area. The long trench pair encloses substantial changing magnetic flux; the small battery logger does not. The trailer earth also measures the same before and after. Together, those observations point to inductive coupling through the trench geometry rather than damage delivered through the soil or failed insulation.
        headline: Every card on the long trench pair died, and a logger three metres away on its own battery did not.
        readings:
          - zone: Trench pair
            label: Cards at the trailer end
            value: all six destroyed
            status: alarm
          - zone: Trench pair
            label: Insulation of the cable itself
            value: intact, tested to 5 kV
            status: normal
            note: nothing arced through it
          - zone: Battery logger
            label: Standalone unit 3 m away
            value: unharmed and still logging
            status: normal
          - zone: Earthing
            label: Trailer rod and bonding
            value: measured before and after, unchanged
            status: normal
        choices:
          - label: The strike reached the trailer through the earth
            mechanism: Current flowed from the mast grid to the trailer rod through the soil.
          - label: Flux through the trench loop drove the pair
            mechanism: A changing field induced volts around a large loop; a small isolated loop enclosed almost none.
          - label: The cable insulation failed
            mechanism: The conductor broke down to earth somewhere along the run.
          - label: The trailer earthing was inadequate
            mechanism: A higher-resistance rod let the trailer rise relative to the site.
        answer: Flux through the trench loop drove the pair
        rebuttals:
          - Soil conduction would have taken the logger too, and it would have left the rod measurements changed.
          - The insulation held at five kilovolts afterwards, so nothing crossed it.
          - Rod quality decides how far the trailer rises with the site, and a rise that everything shares breaks nothing.
      - group: SHOT
        task: Say what this changes about the season's plan
        title: What the finding costs the plan
        place: Launch Control
        scene: "Hal Brenner points at the trench drawing. If the coupling is geometric, every remaining shot is also a test of that geometry. Adeyinka Vero asks the harder question: does knowing the mechanism argue for firing more, or stopping sooner?"
        guide: >-
          Four readings of what the finding does to the remaining shots. Ask of each
          whether it treats the mechanism as an explanation or as a prediction. A
          formula can be computed before the next stroke and then compared with it. One
          option would remove the configuration the prediction needs. That is the real
          argument in the room, and it is not about who suspected what.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a mechanism that is understood can be measured deliberately
        takeaway: Once a mechanism makes numerical predictions, the next event can test the mechanism rather than merely repeat the observation.
        format: CHOICE
        question: What does the coupling finding change about the remaining shots?
        why: "Before today, the outstation damage was an event the station could only survive. Now the mechanism has a formula and a numerical prediction. The next stroke can therefore be predicted before it is measured. If the result holds, the geometry becomes a design rule rather than a post-mortem explanation. Rerouting now would remove the very configuration needed to test that prediction. That is the real argument between Vero and Brenner: whether one more dangerous-looking configuration is also one more decisive measurement."
        choices:
          - Each one can now test a prediction computed in advance
          - Nothing, since the mechanism was already suspected by two people
          - They should stop until the cable has been rerouted away from the mast
          - They become more dangerous, because the trench is now known to carry surges
        answer: Each one can now test a prediction computed in advance
        rebuttals:
          - Suspecting a mechanism and being able to compute it are different states, and only the second one predicts.
          - Rerouting is a season's work, and stopping now leaves the rule unverified.
          - The trench is no more dangerous today than it was in August; what changed is that somebody can say what it does.
  # ---------------------------------------------------------------- day 10
  - title: Nine volts and a hundred and eighty thousand
    objective: Work out what the bonding lead does, and what the certificate never covered.
    briefing: Six metres of copper between the mast base and the equipment earth, and nobody has costed it.
    stake: >-
      Friday, and Sifuentes has brought the April certificate back to the table. Yesterday's
      finding explains the trailer and not the rack at the mast base, which also lost two channels
      in August and is bonded to the grid by six metres of heavy copper. Strand says six metres of
      copper is nine hundredths of an ohm and can be ignored. Sifuentes says that is the right
      number for the wrong quantity. Today you work out what a rising current does along a
      straight piece of wire, and settle what the earthing certificate was ever able to say.
    takeaway: A perfect earth at the end of six metres of wire is not an earth at a microsecond.
    stops:
      - group: EARTH
        task: Derive the voltage along the bonding lead
        title: The same wire, twice
        concept: Self-inductance, and why a straight wire has it
        place: Earthing Compound
        scene: Six metres of 70 mm² copper run from the rack earth bar to the grid. Its measured resistance is 0.3 mΩ. Sifuentes places the April certificate beside the drawing while the strike's 1 µs rise time goes on the board.
        guide: >-
          Build it a line at a time. The same six metres of copper has two voltages
          across it: one from its resistance and one from its inductance. Work out both
          — Ohm's law for the steady case, and the inductive voltage for the front of
          the strike. Then compare them, because the comparison is the answer rather
          than either number.
        background:
          - >-
              Why one lead has two answers. Resistance responds to how much current is
              flowing. Inductance responds to how fast it is changing. At direct current the
              second term is zero, so the certificate measured only the first. During a
              one-microsecond front, thirty kiloamps arrive at 3 × 10¹⁰ amps a second, and
              the inductive term is thousands of times larger.
          - >-
              Why the April certificate is not wrong. It measured what it claimed: 0.3
              milliohms of resistance, correctly, at direct current. The error is in reading
              it as a statement about what the lead does during a strike. A certificate is
              only a claim about the conditions it was measured under.
          - >-
              What the number means for the rack. Kilovolts across a bonding lead appear
              between the rack earth and the grid, which is a difference no equipment inside
              was designed for. That is why lightning protection is about inductance and
              geometry rather than about conductor size, and why a fatter cable does not fix
              it.
        assumes:
          - a straight conductor has an inductance of roughly a microhenry per metre
          - a changing current through an inductance produces a voltage across it
        takeaway: The same wire can be resistance-dominated at steady current and inductance-dominated during a fast transient.
        format: DERIVE
        question: Work out what the bonding lead does during the front of the strike, and compare it with what it does at direct current.
        answerText: 9 V resistive and 180 kV inductive, in the same six metres of copper. V = L·dI/dt with L ≈ 6 µH and dI/dt = 3 × 10¹⁰ A/s, against IR = 30 kA × 0.3 mΩ.
        why: "The same six-metre lead gives only 9 V from IR at 30 kA, yet about 180 kV from L·dI/dt on the one-microsecond front. The wire did not change. The rate of current change did. Sifuentes looks back at the April certificate and says the important sentence herself: the 25-ohm result is correct. It measured the steady regime. A steady test makes the inductive term vanish, so the certificate could never contain the quantity that dominated the strike."
        derive:
          hint: Do the resistive line first so there is something to compare with.
          start: V = IR for the steady case, V = L·dI/dt for the changing one
          startNote: R = 3.0 × 10⁻⁴ Ω, L ≈ 1 µH/m over 6 m, I = 3.0 × 10⁴ A, dI/dt = 3.0 × 10¹⁰ A/s
          goal: the two voltages across the same lead, in volts
          askRule: true
          rules:
            - Gauss's law
            - symmetry argument
            - superposition
            - line integral of E
            - rearrangement
            - boundary condition
          steps:
            - ask: Write the resistive drop at the peak of the current.
              answer: 1
              candidates:
                - text: V = I/R = 3.0 × 10⁴ / 3.0 × 10⁻⁴
                  rule: rearrangement
                  why: Dividing by the resistance instead of multiplying. A hundred megavolts across a piece of copper, which is the sort of answer that ends an investigation early.
                - text: V = IR = (3.0 × 10⁴)(3.0 × 10⁻⁴)
                  rule: rearrangement
                - text: V = IR with R the earth resistance, 25 Ω
                  rule: boundary condition
                  survives: true
                  why: A real voltage — 750 kV, the rise of the whole grid — and not the one asked for. It is the difference between how far the site rises together and what appears across one lead inside it.
                - text: V = I²R
                  rule: rearrangement
                  why: That is a power rather than a voltage, and it puts watts where volts belong.
            - ask: Write the inductance of the lead.
              answer: 0
              candidates:
                - text: L ≈ (1 µH/m)(6 m) = 6 µH
                  rule: rearrangement
                - text: L ≈ 1 µH, because it is one conductor
                  rule: boundary condition
                  survives: true
                  why: Inductance is a property of the path rather than of the object, and it grows with length. Taking one microhenry gives thirty kilovolts, which is still enormous and still six times light.
                - text: L = 0, because a straight wire is not a coil
                  rule: symmetry argument
                  why: A straight wire links flux around itself and has an inductance of about a microhenry per metre. This is the assumption the whole day exists to break.
                - text: L ≈ (1 µH/m)/(6 m)
                  rule: rearrangement
                  why: Dividing by the length. It says a longer bond is a better one, which would make the fix the opposite of the fix.
            - ask: Write the inductive voltage on the front of the stroke.
              answer: 2
              candidates:
                - text: V = L·I = (6 × 10⁻⁶)(3.0 × 10⁴)
                  rule: boundary condition
                  why: The current rather than its rate of change. It gives a fifth of a volt and would exonerate the lead completely.
                - text: V = I·dL/dt
                  rule: rearrangement
                  why: The inductance is not changing — nobody is moving the wire. This differentiates the wrong factor and gives zero.
                - text: V = L·dI/dt = (6 × 10⁻⁶)(3.0 × 10¹⁰)
                  rule: rearrangement
                - text: V = L·dI/dt with dI/dt = 3.0 × 10⁴ A/s
                  rule: rearrangement
                  survives: true
                  why: The peak current has been written in as though it were the slope. The line is correct in form and the answer, a fifth of a volt, is the same wrong conclusion as the first branch by a tidier route.
            - ask: Say which of the two the April certificate measured.
              answer: 1
              candidates:
                - text: both, since resistance and inductance are measured together
                  rule: boundary condition
                  why: An earth tester injects a steady current, and a steady current has no rate of change for an inductance to respond to. It cannot see the second term at all.
                - text: the resistive one, because the tester injects a steady current
                  rule: boundary condition
                - text: the inductive one, because the tester uses an alternating source
                  rule: rearrangement
                  survives: true
                  why: Testers do use a low-frequency alternating source, which makes this sound right. At a hundred hertz the inductive part of six microhenries is four milliohms — real, and ten million times smaller than what a microsecond front produces.
                - text: neither, because it measured the soil rather than the lead
                  rule: symmetry argument
                  why: The measurement includes everything in the loop it injects around, lead included. What it cannot include is a rate of change it never applies.
          commit: Commit the derivation
      - group: FIELD
        task: Say what follows for how the site should be bonded
        title: Short, or not at all
        place: Field Station
        scene: Vero stands at the rack with the six-metre bond marked on the drawing. The rack, mills and trailer each have their own connection sketches. She wants one site rule the crew can apply before the next installation is built.
        guide: >-
          Four bonding rules. Ask of each what term it acts on. Cross-section moves
          resistance far more than it moves inductance, and inductance is what the fast
          front sees. Length and loop area are what inductance depends on. Two of the
          options would create differences between separate earths rather than remove
          them. The rule has to be usable before the next installation is built.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - inductance grows with the length of the conductor
        takeaway: Fast-transient bonding depends on geometry and shared reference paths, not only on low DC resistance.
        format: CHOICE
        question: What does the inductive term imply for how equipment should be bonded?
        why: "Inductance depends strongly on conductor length and on the loop made by its return path. Increasing cross-section changes resistance much more than it changes inductance. For a fast transient, shortening the bond is therefore more effective than simply making it thicker. Bringing equipment to one reference point also avoids large differences between separate earths. The practical rule is geometric: keep bonds short and keep the return path controlled. That directly attacks the voltage term that dominates during the strike front."
        choices:
          - Keep bonds short, and bring everything to one point
          - Use heavier conductor, since a larger cross-section lowers the inductance
          - Earth each item separately, so no bond carries another item's current
          - Insulate the equipment instead, so no bonding is needed at all
        answer: Keep bonds short, and bring everything to one point
        rebuttals:
          - Cross-section is what sets resistance, and it barely touches the inductance that dominates here.
          - Separate earths create exactly the difference in potential that the equipment then bridges.
          - Insulation has to withstand the induced volts, which are the problem rather than the connection.
      - group: BANK
        task: Work out how to test the finding in the hall
        title: Making a microsecond on purpose
        concept: The LR transient, and inductive volts against resistive volts
        place: Impulse Hall
        scene: Strand can fire the bank into the mast base with a front chosen from 100 microseconds down to about half a microsecond. Ruiz has one afternoon of hall time and asks which setting would actually test the claim.
        guide: >-
          One afternoon, one variable. The front time is what separates the two explanations of
          the placard voltage, so change that and hold everything else — same bank, same
          electrode, same earth. Run it, and if the reading follows the front time both ways
          you have the answer; if you changed the electrode as well, you have a story.
        background:
          - >-
              What the two explanations are. The voltage across the earth path is the resistive term
              plus the inductive one: IR while the current is steady, and L dI/dt while it is
              changing. A slow front makes the second term small, and a fast one makes it dominate.
          - >-
              Why the front time is the discriminating variable. Twenty-five ohms into thirty
              kiloamps is the same 750 kV whichever front you choose. What changes with the front is
              the inductive contribution, so a reading that rises as the front shortens is the
              inductive term and nothing else.
          - >-
              Why one variable at a time is the whole afternoon. Changing the front and the electrode
              together produces a number that is consistent with either explanation, and the hall is
              booked once. Reversing the change is what separates a cause from a coincidence.
        assumes:
          - a laboratory impulse can be given a chosen rise time
        takeaway: A causal test changes the variable that separates competing models while holding confounding variables fixed.
        format: CONTROL
        question: Which variable, changed on its own, separates the inductive explanation from the resistive one?
        answerText: The front time. Take it from 100 microseconds to half a microsecond with the same bank, electrode and earth, and the peak voltage nearly triples — put the slow front back and it drops again.
        why: The placard voltage has two candidate sources and one afternoon to separate them. Across the earth path an inductive volt and a resistive volt add: IR + L dI/dt, where L over R sets the time the inductive part matters for. Impedance at a microsecond is not the same as resistance, and the resistive part does not care how fast the current arrives — 30 kA through 25 ohms is 750 kV at any front time. The inductive part cares about nothing else. So the front time is the one variable whose change moves one explanation and not the other, and the test is to move it alone: same bank charge, same electrode geometry, same earth connection. At a 100 microsecond front the measured peak sits near the resistive figure; at half a microsecond it rises to roughly 2.7 times it, and restoring the slow front brings it back down. That reversal is what makes it a finding rather than a coincidence that happened during the same afternoon. Change the electrode at the same time and the number is consistent with both models, and the hall is booked once.
        control:
          observable:
            label: Peak voltage across the earth path
            unit: kV
          variables:
            - id: front
              label: Front time of the impulse, 100 µs down to 0.5 µs
            - id: electrode
              label: Electrode geometry at the mast base
            - id: charge
              label: Bank charging voltage
            - id: earth
              label: Which earth conductor the return uses
          held:
            - bank charge and peak current
            - soil moisture in the test bay
            - probe position and bandwidth
            - ambient temperature
          truth: front
          baseline: 750
          response: 1280
          noise: 90
          hint: The hall fires on command. Set what you want changed, run it, and watch whether the peak follows.
          run: Fire the bank
          commit: Name the variable that separates the models

  # ---------------------------------------------------------------- day 11
  - title: Where the current goes
    objective: Follow the strike down the mast and find where it stops matching.
    briefing: Nothing goes wrong today. Three things get confirmed and one of them is a surprise.
    stake: >-
      Monday of week five, and it is the quietest day the season has had. No cell is forecast
      before Wednesday, the hall is down for a gap service, and Nakata has last week's stroke
      recorded at every shunt on the mast for the first time. Tate has been asked to check the
      bonding at each joint while the weather allows a climb. Today you read the current at each
      station down the conductor, find where the record stops adding up, and put a number on how
      much charge the cell over the flat was holding.
    takeaway: A current that is not where it was a moment ago has gone somewhere, and the place it left is a fact about the site.
    stops:
      - group: MAST
        task: Find the station where the current stops matching
        title: Down the conductor, one station at a time
        concept: Current as a flow, and current density
        place: Mast Base
        scene: >-
          Thirty kiloamps entered the mast tip on the last stroke. Current that enters a
          conductor leaves it somewhere, so the same thirty should appear at every shunt
          down the conductor unless something is taking a share. Nakata has seven
          measuring points from tip to soil, deliberately not read in order, and wants
          the break located before anybody starts explaining it.
        guide: >-
          Nothing is read for you. Press Read on any station and it reports what that
          station measured on the stroke, and what the station above it implies should
          have arrived. Take at least three. A shortfall between two stations is not an
          instrument error — it is a route the current took instead. Then click the
          station where the current stops being where it should be, and commit.
        background:
          - >-
              Why a shortfall is a route. Charge is conserved, so current does not go
              missing. If 29 kiloamps pass one shunt and 18 pass the next, then 11 left the
              conductor between them, and the only question is through what. On a mast that
              is usually a bond nobody drew on the diagram: a conduit, a cable tray, a
              ladder, an instrument earth.
          - >-
              What a shunt actually measures. Each station is a low-value resistor in the
              path with the voltage across it recorded, so the reading is the current
              through that station and nothing else. It cannot tell you where current went,
              only that it is no longer here — which is why the answer is a section between
              two stations rather than a component.
          - >-
              Why the order of reading does not matter and the pairs do. Every reading is of
              the same stroke, so they can be taken in any sequence. What carries
              information is the difference between two of them, which means a reading is
              worth little on its own and a pair either side of the suspect section is worth
              the trip.
        assumes:
          - current entering a conductor leaves it somewhere
          - two conductors bonded together share whatever current is offered to them
        takeaway: Current is conserved, so a shortfall between two stations is not an error but a route.
        format: PROBE
        question: Thirty kiloamps entered at the tip. Take the readings you think you need — where does the current stop being where it should be?
        answerText: The break is between the 15 m shunt and the base. The reading falls from 29 kA to 18 kA there. About 12 kA therefore leaves the down-conductor in that last section, where the conduit is bonded.
        why: The upper shunts stay near 30 kA, including 29 kA at fifteen metres. The base then falls to 18 kA. That locates the missing current before any mechanism is chosen. About 12 kA leaves the down-conductor in the last fifteen metres. The conduit bond lies inside that interval. Nakata stops at the drawing because the implication is large. A path treated as instrumentation hardware has been carrying roughly a third of the strike current without appearing on the original current map.
        probe:
          chainLabel: Station
          stations:
            - id: S45
              label: Shunt at 45 m
              reading: 29.6 kA
              expected: 30 kA entered at the tip
              load: within tolerance
            - id: S30
              label: Shunt at 30 m
              reading: 29.4 kA
              expected: 29.6 kA from the station above
              load: within tolerance
            - id: S15
              label: Shunt at 15 m
              reading: 29.1 kA
              expected: 29.4 kA from the station above
              load: within tolerance
            - id: BASE
              label: Clamp at the base
              reading: 18.2 kA
              expected: 29.1 kA from the station above
              load: eleven kiloamps unaccounted
            - id: LEGA
              label: Grid leg A
              reading: 9.4 kA
              expected: half of whatever reaches the grid
              load: consistent with the base reading
            - id: LEGB
              label: Grid leg B
              reading: 8.6 kA
              expected: half of whatever reaches the grid
              load: consistent with the base reading
            - id: ROD
              label: Trailer rod, 200 m out
              reading: 0.2 kA
              expected: nothing, if the trailer is not in the path
              load: small and not zero
          target: BASE
          minReadings: 3
      - group: FIELD
        task: Put a number on the charge the cell was holding
        title: Eight tenths of a coulomb
        place: Field Station
        scene: |-
          Halvorsen has the layer's charge density from day two and the cell's area off the radar. Vero wants the total in the season log, next to the strokes it produced.
        guide: >-
          Five numbers, and three of them belong to other questions. The height of the
          base. The field at the ground. The charge in the August stroke. Ask of each
          whether this total depends on it. And note what comes out. It is less than one
          stroke moved, which is not a contradiction: charge separation continues while
          the storm runs.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - charge per unit area multiplied by area is charge
        takeaway: A charge density is a local quantity and a total needs an area, which is the thing a single instrument can never supply.
        format: BALLPARK
        question: Estimate the charge held on the base of the cell overhead.
        why: The estimate gives about 0.8 C on the charged cloud base, while the August stroke moved about 3 C. That is not a contradiction. A thundercloud is not a capacitor that discharges once and stops. Charge separation continues while the storm evolves, so the source can be replenished between strokes. The estimate is still useful because it connects a local field measurement with a total over the radar area. It also shows why one static cloud snapshot cannot be treated as the full charge budget of a flash.
        estimate:
          prompt: The layer carries 8.0 × 10⁻⁸ C/m² from the mill reading, and the radar puts the charged base at about 1.0 × 10⁷ m².
          question: Choose the charge per square metre and the area it covers.
          labels:
            - 8.0e-8  (C/m², charge per square metre on the layer)
            - 1.0e7  (m², area of the charged base)
            - 1.2e3  (m, height of the base above the flat)
            - 4.5e3  (V/m, the field at the ground)
            - 3.0  (C, the charge in the August stroke)
          values: [8e-8, 10000000, 1200, 4500, 3]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 0.8
          tolerance: 0.25
          units: coulombs
          relationship: Total charge Q = σ × A, the charge per unit area multiplied by the area it covers.
          solution: 8.0 × 10⁻⁸ × 1.0 × 10⁷ = 0.8 C.
          explanation: About eight tenths of a coulomb. The height is the quantity that famously does not appear — it cancelled out of the field of a wide layer on day two and it has no business here either — and the field itself is what σ was computed from rather than a second factor to multiply by.
          givens:
            - Charge density 8.0 × 10⁻⁸ C/m²
            - A charged base of about 1.0 × 10⁷ m²
      - group: EARTH
        task: Spend the two field-check credits on evidence that can decide why the remote trailer rod carried 200 A.
        title: "Two hundred amps: buy the discriminating check"
        place: Earthing Compound
        scene: The trailer rod carried 200 A during a stroke that never touched it. Ana Sifuentes has the network map open beside the log. Four follow-up checks are possible before the next cell, but field access allows only two credits.
        guide: >-
          Two credits, four checks, and one puzzle: the trailer rod carried 200 amps
          during a stroke that never touched it. Open each check and ask what result
          would separate ordinary soil conduction from a different path. Buy the two
          that can tell those apart, not the two that would measure the current more
          precisely.
        background:
          - >-
              What the two explanations are. Current spreading through soil from a distant
              strike falls off in a predictable way with distance, so 200 amps at the
              trailer would imply a whole pattern across the network. A different path — a
              buried service, a cable screen, a fence line — delivers current to one place
              without that pattern.
          - >-
              Why precision does not help. Measuring the 200 amps again to three figures
              leaves both explanations standing. The check worth buying is one whose two
              possible results point at different explanations, which is the same argument
              every VALUE stop makes.
          - >-
              Why the answer matters before the next cell. If it is soil conduction, the
              network map is right and the number is expected. If it is a path nobody drew,
              then equipment on that path saw current it was not designed for, and the same
              thing will happen in the next storm.
        assumes:
          - soil conducts, and current spreads through whatever is available
        takeaway: When several mechanisms fit one reading, the best follow-up is the measurement whose possible outcomes separate them.
        format: VALUE
        question: Which evidence is worth buying to decide whether the remote current is ordinary soil conduction or a different path?
        value:
          decision: Decide which physical path best explains the 200 A measured at the remote trailer rod.
          budget:
            amount: 2
            unit: field-check credits
            label: Field access before the next cell
          hint: Open each check and ask what result would distinguish a distributed ground path from a different connection. Precision is not the same as discrimination.
          options:
            - id: soil_map
              label: Map ground potential from the mast grid toward the trailer rod
              cost: 2
              axis: distributed soil conduction
              decisive: true
              reveals: Whether a continuous potential gradient through the soil can drive current at the remote rod.
            - id: continuity
              label: Trace metallic continuity between the mast system and trailer
              cost: 1
              axis: hidden metallic bond
              decisive: false
              reveals: Whether an undocumented conductor exists, but a negative result still leaves soil and induced paths unresolved.
            - id: strike_marks
              label: Inspect the trailer rod and bracket for branch-strike evidence
              cost: 1
              axis: direct attachment
              decisive: false
              reveals: Whether the rod was directly attached by a branch, without testing the ordinary soil-current hypothesis.
            - id: pair_monitor
              label: Repeat the trench-pair differential-voltage measurement
              cost: 2
              axis: inductive cable coupling
              decisive: false
              reveals: Whether the cable loop is driven again, but not whether that loop is the source of the 200 A through the rod.
        answerText: Buy the soil-potential map. A continuous gradient from the station toward the trailer can support ordinary soil conduction as the 200 A path. The other checks can rule out side possibilities, but none tests the distributed ground path as directly.
        why: "A small current at a remote rod does not identify its own path. An undocumented metal bond, a branch strike or a driven cable can all sound plausible from one number. A soil-potential map asks a different question: does the ground itself carry a continuous voltage gradient from the station toward the rod? If it does, distributed soil conduction explains the current without inventing a hidden connection. Repeating a nearby electrical check may add confidence, but it does not distinguish the competing routes as directly."
  # ---------------------------------------------------------------- day 12
      - group: FIELD
        task: Work the mast round while the storm rule changes.
        title: What the round is doing in a storm
        concept: "Energy in the magnetic field, and where a strike puts it"
        place: Mast Base
        scene: One standing rule governs work on the mast. The safety officer changes it as the storm comes in. The field mill rises, then a strike lands within ten kilometres, then the all-clear.
        guide: >-
          Do the jobs the current rule allows and leave the rest. The rule is on the board at
          the mast base and it changes without an announcement. What is scored is the jobs
          either side of a change, because they are the only ones that show whether the crew
          is reading the board.
        background:
          - >-
              Why the rule changes with the field. A rising field mill means charge is building
              overhead and the mast is the tallest thing on a salt flat. The rule tightens in stages
              rather than all at once, because stopping all work at the first cloud would mean no
              work in a storm season.
          - >-
              Why the changeover is where somebody gets hurt. A crew working to the last rule is a
              crew on the mast after the rule said come down, and nothing about being three quarters
              of the way through a job makes the field any lower.
        assumes:
          - work near a tall mast in a storm is governed by rules that change
        takeaway: The cost of a withdrawn instruction is paid by whoever is still working to it.
        format: SPOT
        question: Work to the rule on the board, and keep watching the board.
        answerText: Read the board rather than the job list. Every change leaves a few minutes in which the old rule still looks like the one in force.
        why: >-
          Three rules run across the storm and each allows a different part of the round.
          Anything at all, then ground-level work only, then nothing outside at all. A job can
          be allowed under two of them, which is what makes the change cost real rather than
          notional, and the panel scores the window either side of each change. Most of the
          list is allowed by neither rule or by both, and is handled correctly by somebody who
          has read nothing. The mast's own version of this is the two minutes after the field
          mill crosses its threshold: the rule has changed to ground level only, and there is
          somebody at forty metres who is nearly finished. Being nearly finished has never
          lowered a field, and the whole point of the staged rules is that they change before
          the strike rather than after it.
        spot:
          duration: 40
          switchEvery: 12
          pass: 0.75
          hint: The rule is on the board at the mast base, and the safety officer changes it without calling out.
          targets:
            - id: m1
              label: Climb to forty metres
              tags: [climbing]
            - id: m2
              label: Ground-level cable check
              tags: [ground]
            - id: m3
              label: Climb, cable at height
              tags: [climbing, cable]
            - id: m4
              label: Indoor logger download
              tags: [indoor]
            - id: m5
              label: Earth rod resistance
              tags: [ground]
            - id: m6
              label: Cable trench, outdoors
              tags: [ground, cable]
            - id: m7
              label: Instrument hut work
              tags: [indoor]
            - id: m8
              label: Guy tension at height
              tags: [climbing]

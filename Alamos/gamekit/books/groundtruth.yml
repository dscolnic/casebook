  - group: BANK
    task: Hold the bank voltage while the shot is prepared.
    title: Hold the bank while the crew rigs
    at: bank-stages
    reason: >-
      Josefa Ruiz has to hold the bank at voltage while the crew finishes rigging, and wants the bleed-and-recharge balance understood before she trusts the gauge on the wall.
    concept: "Capacitance as a ratio, before it is a formula"
    place: Impulse Hall
    scene: The bank has to sit at its charging voltage while the crew finish in the hall and the trigger is armed. The bleed resistors are draining it the whole time, and the charging set is the only thing putting it back.
    guide: >-
      Hold the bank voltage inside the band on the console. The band narrows as the shot approaches, because the peak current depends on where the bank sits when the trigger fires, and a shot fired off-voltage is a shot nobody can compare with the others. The charging set is your control.
    background:
    - >-
      Why a bank drains at all. The bleed resistors are a safety feature, not a fault: they are what makes the bank safe to approach after a shot, and they work all the time, including now.
    - >-
      Why that is a rate. The bank loses charge continuously through the bleed path, so the voltage falls and keeps falling. A charging set switched on and off leaves the bank somewhere it did not intend to be.
    - >-
      Why the margin tightens near the shot. The energy stored is proportional to the square of the voltage, so a few per cent of voltage is a larger error in energy — and the whole point of the shot is comparison with the others in the series.
    assumes:
    - a charged bank stores energy and can lose it through a resistor
    takeaway: A store that is always leaking is held by matching the leak, not by topping it up.
    format: HOLD
    question: Hold the bank at its charging voltage until the shot fires.
    answerText: Inside the band until the trigger, with the charging set matched to the bleed rather than switched on after the voltage has already sagged.
    why: >-
      The bleed resistors are draining the bank the entire time it is charged, which is exactly what they are for — they are the reason anybody can walk into the hall after a shot. But they do not wait for the shot, so the bank is losing charge continuously while the crew finish and the trigger is armed. That makes the charging set a rate to be matched rather than a switch to be flicked: set it to replace what the bleed takes, and the voltage sits still. The band narrows because the stored energy goes as the square of the voltage, so a small sag near the trigger is a larger error in the energy delivered, and the value of this shot is that it can be compared with the others in the series. A shot fired two per cent low is not a slightly smaller shot; it is a point nobody can plot.
    hold:
      quantity: Bank voltage
      unit: kV
      control: Charging set
      hold: 50
      band: 0.4
      narrowTo: 0.2
      duration: 45
      direction: raise
      authority: 0.1
      pass: 0.8
      hint: The bleed never stops. Match it rather than topping the bank up after it sags.
      disturbances:
      - {label: Bleed resistors draining the bank, at: 4, amount: -0.03}
      - {label: Second string switched in, at: 20, amount: 0.05}
      - {label: Hall warms and the bleed rises, at: 38, amount: -0.045}
      commit: Report the charge
- title: How lightning reached a trailer it never touched
  objective: Calculate the induced voltage in the long trench loop and decide which failure mechanism best fits both the damaged and surviving equipment.
  briefing: 'The damaged cards and the surviving logger differ in one crucial way: the long route encloses a large loop.'
  stake: >-
    Thursday. Last August every interface card at the trailer died while a nearby battery logger survived. Today you finally have enough geometry and current data to test whether the strike reached the trailer without any direct connection.
  takeaway: A circuit that touches nothing can still be driven, because flux does not need a connection.
  segue: >-
    The simplified straight-conductor model predicts about 200 kV around the long trench loop. The damage pattern fits that mechanism better than failed insulation or a bad local earth — but the calculation is still a model, not a verdict. The hall now has a prediction it can try to break.
  stops:
  - group: COUPLE
    task: Derive the voltage induced in the trench cable
    title: Can the trench explain the dead cards?
    reason: >-
      Sam Abioye wired that trench run and wants the coupling computed before the report blames the wrong quantity for a year, since the geometry was his and nobody chose it on purpose.
    place: Cable Trench
    scene: 'Sam Abioye, the instrumentation technician, has the route on the wall. For forty metres near the mast, the signal conductor and its separate protective-earth return take different paths: one long side of the loop is 1.5 m from the down-conductor and the other is 3.5 m away.'
    guide: >-
      Build it a line at a time. The field from the down-conductor falls as one over the distance, so the flux through the trench loop needs an integral across it, from the near side to the far side. Then Faraday's law turns the changing flux into a voltage. Evaluate it at the front of the August stroke.
    background:
    - >-
      Why an integral rather than a product. The field is not uniform across the loop: at 1.5 metres it is more than twice what it is at 3.5. Flux is the field integrated over the area, and with B going as one over r the integral gives a logarithm of the ratio of the two distances.
    - >-
      Why the ratio is what matters. Only b over a appears, so moving both sides of the pair further out changes the answer far less than separating them does. A signal pair run tight together in the same trench sees very little; the same pair split by two metres sees a great deal.
    - >-
      What the voltage does. It appears in series with the signal, so the instrument at the far end cannot distinguish it from the measurement. That is the mechanism behind most of the station's unexplained records, and it is why the trench route on the wall is a wiring diagram and a physics problem at once.
    assumes:
    - the field around a long conductor falls off as one over the distance
    - a changing flux through a loop drives an EMF around it
    takeaway: The field across the loop is not uniform, so the flux is an integral, and it comes out as a logarithm of the two distances.
    format: DERIVE
    question: Work out the voltage driven around the trench loop by the August stroke.
    answerText: About 200 kV in the simplified straight-conductor model. The geometry gives a mutual inductance near 6.8 µH; multiplying by dI/dt ≈ 3 × 10¹⁰ A/s gives an induced EMF near 2.0 × 10⁵ V.
    why: Integrating the 1/r magnetic field across the forty-metre loop gives an effective mutual inductance of about 6.8 µH. With the authored 30 kA-per-microsecond current rise, the quasi-static model predicts about 200 kV around the loop. Because the pulse is fast and the geometry finite, this should be treated as an order-of-magnitude prediction to test, not as an exact reconstruction of the August waveform. The important result is that a large induced voltage is physically possible without a direct strike or insulation failure.
    derive:
      hint: Build the flux out of strips, integrate across the loop, then differentiate in time.
      start: B(r) = μ₀I/(2πr)
      startNote: ℓ = 40 m parallel, a = 1.5 m, b = 3.5 m, dI/dt = 3.0 × 10¹⁰ A/s; use the straight-conductor, quasi-static approximation
      goal: the EMF driven around the trench loop, in volts
      askRule: true
      rules:
      - Gauss's law
      - symmetry argument
      - superposition
      - line integral of E
      - rearrangement
      - boundary condition
      steps:
      - ask: Write the flux through a strip of the loop at distance r.
        answer: 3
        candidates:
        - text: dΦ = B·ℓ·dr with B taken at the middle of the loop
          rule: boundary condition
          survives: true
          why: Using the mid-distance value turns the integral into a product and loses the logarithm. It is about eight per cent low here and it is the version most people write, because it is right whenever the field is uniform and this field is not.
        - text: dΦ = B·dr, without the length
          rule: rearrangement
          why: A strip has two dimensions. Dropping the forty metres leaves webers per metre, and the answer is forty times small.
        - text: dΦ = B·ℓ·r·dr
          rule: rearrangement
          why: An extra factor of r, borrowed from a polar area element. The strip here is a rectangle and its area is ℓ dr.
        - text: dΦ = B(r)·ℓ·dr
          rule: superposition
      - ask: Integrate across the loop, from the near conductor to the far one.
        answer: 1
        candidates:
        - text: Φ = (μ₀Iℓ/2π)(b − a)
          rule: rearrangement
          survives: true
          why: The integral of dr rather than of dr/r. Clean, and it says a loop twice as far away links the same flux for the same width, which is not how a field that falls off works.
        - text: Φ = (μ₀Iℓ/2π)·ln(b/a)
          rule: line integral of E
        - text: Φ = (μ₀Iℓ/2π)·ln(b − a)
          rule: rearrangement
          why: "A logarithm of a length, which has no meaning: the argument of a log has to be a ratio. It is also negative for gaps under a metre."
        - text: Φ = (μ₀Iℓ/2π)(1/a − 1/b)
          rule: rearrangement
          why: That is the integral of dr/r², which belongs to a point source. Here the field goes as one over r and integrates to a logarithm.
      - ask: Differentiate to get the EMF.
        answer: 0
        candidates:
        - text: ε = (μ₀ℓ/2π)·ln(b/a)·dI/dt
          rule: rearrangement
        - text: ε = (μ₀Iℓ/2π)·ln(b/a)·dI/dt
          rule: rearrangement
          survives: true
          why: The current has been kept as well as its derivative. The line is tidy and the answer is thirty thousand times too large, which in a domain of large numbers is not obviously absurd.
        - text: ε = (μ₀ℓ/2π)·ln(b/a)·I
          rule: boundary condition
          why: Faraday's law is about the rate of change. Using the current itself makes the steady state as dangerous as the front, which the site's nine quiet years disprove.
        - text: ε = (μ₀ℓ/2π)·d[ln(b/a)]/dt
          rule: line integral of E
          why: The geometry is not moving. Nothing in the logarithm depends on time, so this differentiates to zero and predicts that nothing ever happens.
      - ask: Put the numbers in.
        answer: 2
        candidates:
        - text: ε = (2 × 10⁻⁷)(40)(0.85)(3.0 × 10¹⁰)/40
          rule: rearrangement
          why: The length has been divided out again at the end, which undoes the strip. Five kilovolts is survivable and the trailer did not survive.
        - text: ε = (2 × 10⁻⁷)(0.85)(3.0 × 10¹⁰)
          rule: rearrangement
          survives: true
          why: The forty metres was dropped between lines. Five kilovolts again, by a different route, and it is the number somebody quotes when the cable run is described as short.
        - text: ε = (2 × 10⁻⁷)(40)(0.85)(3.0 × 10¹⁰)
          rule: rearrangement
        - text: ε = (2 × 10⁻⁷)(40)(0.85)(3.0 × 10⁴)
          rule: rearrangement
          why: The peak current has been used where its rate of change belongs. It gives two tenths of a volt and would close the investigation with the wrong answer.
      commit: Commit the derivation
  - group: MAST
    task: Which explanation best fits all four observations?
    title: Which failure mechanism fits the survivors too?
    at: sheet-cage
    reason: >-
      Ingrid Lauwers has four devices' post-strike condition on file and wants one explanation that fits every card, not just the one that is easiest to believe.
    place: Screened Room
    scene: Four devices were on the outstation loop in August. EMC engineer Lauwers has each device's operating state and post-strike condition on separate cards. She wants one explanation that fits all four without changing the facts between cards.
    guide: >-
      Four observations, and the two survivors are as informative as the casualties. The cable insulation still holds its test voltage. A battery logger three metres away is untouched. Ask of each candidate how many of the four it covers. What differs between the damaged pair and the logger is not the storm. It is how much area the circuit encloses.
    background:
    - >-
      Why the unremarkable readings decide it. The salient reading is what draws attention, and it is usually consistent with several explanations at once, which is why it rarely settles anything. The readings that discriminate are the ones a candidate predicts should have moved and which have not: a normal value is a positive result against every mechanism that would have disturbed it.
    - >-
      How to work the candidates. Take each mechanism and predict the panel it implies before you look at the panel again — which readings it drives, in which direction, and by roughly how much. Then compare. Working that way round is what separates a diagnosis from a rationalisation, because the prediction is made before the data is consulted.
    - >-
      Why only one candidate survives. Several will account for part of the panel, deliberately so, and a partial fit is exactly what a confident wrong answer feels like from the inside. When two remain, look for the reading on which their predictions differ and let it decide. If no reading separates them you have not finished reading the panel.
    assumes:
    - a loop's induced voltage grows with the area it encloses
    takeaway: A good failure explanation must fit both the damaged equipment and the nearby equipment that survived.
    format: DIAGNOSIS
    why: The cable insulation still holds its test voltage, so a breakdown through the insulation is not supported. The standalone battery logger survived, and an interface on a short local twisted pair also survived while the six cards at the end of the long loop failed. The clearest difference is loop geometry. Those observations make inductive coupling through the long trench loop the best-supported explanation. They do not prove that no ground-current contribution occurred; the hall test is still needed to see whether the predicted coupling scale is real.
    headline: Every card on the long trench pair died, and a logger three metres away on its own battery did not.
    readings:
    - zone: Trench pair
      label: Cards at the trailer end
      value: all six destroyed
      status: alarm
    - zone: Trench pair
      label: Insulation of the cable itself
      value: intact, tested to 5 kV
      status: normal
      note: nothing arced through it
    - zone: Battery logger
      label: Standalone unit 3 m away
      value: unharmed and still logging
      status: normal
    - zone: Short local pair
      label: Interface on a 20 cm twisted pair
      value: unharmed after the strike
      status: normal
      note: same trailer, far smaller loop area
    choices:
    - label: The strike reached the trailer through the earth
      mechanism: Current flowed from the mast grid to the trailer rod through the soil.
    - label: Flux through the trench loop drove the pair
      mechanism: A changing field induced volts around a large loop; a small isolated loop enclosed almost none.
    - label: The cable insulation failed
      mechanism: The conductor broke down to earth somewhere along the run.
    - label: The trailer earthing was inadequate
      mechanism: A higher-resistance rod let the trailer rise relative to the site.
    answer: Flux through the trench loop drove the pair
    rebuttals:
    - A soil-current contribution is possible, but the damaged and surviving interfaces shared the same trailer environment; the long-loop geometry is the feature that tracks the failures.
    - The insulation held its test voltage after the event, so a direct breakdown through the cable is not supported.
    - A poor local earth could matter, but it does not explain why the short local interface survived while the long-loop interfaces failed.
    question: Which explanation best fits both the damaged equipment and the nearby survivors?
  - group: SHOT
    task: Say what this changes about the season's plan
    title: Do you preserve the geometry long enough to test it?
    reason: >-
      Hal Brenner and Adeyinka Vero need to know whether a confirmed coupling mechanism argues for firing the rest of the season or stopping it early.
    place: Launch Control
    scene: "Hal Brenner points at the trench drawing. If the coupling is geometric, every remaining shot is also a test of that geometry. Adeyinka Vero asks the harder question: does knowing the mechanism argue for firing more, or stopping sooner?"
    guide: >-
      Four readings of what the finding does to the remaining shots. Ask of each whether it treats the mechanism as an explanation or as a prediction. A formula can be computed before the next stroke and then compared with it. One option would remove the configuration the prediction needs. That is the real argument in the room, and it is not about who suspected what.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
    assumes:
    - a mechanism that is understood can be measured deliberately
    takeaway: Once a mechanism makes numerical predictions, the next event can test the mechanism rather than merely repeat the observation.
    format: CHOICE
    question: What does the coupling finding change about the remaining shots?
    why: "Before today, the trailer damage was only a post-mortem. Now the coupling model makes a numerical prediction that can be tested under controlled conditions. That does not justify exposing the live station to avoidable risk simply to preserve a bad geometry. The useful next step is to reproduce the geometry in the impulse hall, where the front can be chosen and the prediction written down before the shot. The scientific value comes from a falsifiable test, not from leaving vulnerable equipment in service."
    choices:
    - Move the geometry into the impulse hall and test the prediction there
    - Nothing, since the mechanism was already suspected by two people
    - Keep the vulnerable field route unchanged until another storm hits it
    - Stop all testing because any induced voltage makes the site unusable
    answer: Move the geometry into the impulse hall and test the prediction there
    rebuttals:
    - Suspecting a mechanism and being able to compute it are different states, and only the second one predicts.
    - Rerouting is a season's work, and stopping now leaves the rule unverified.
    - The trench is no more dangerous today than it was in August; what changed is that somebody can say what it does.
  # ---------------------------------------------------------------- day 10
- title: Why six metres of copper can still be dangerous
  objective: Compare resistive and inductive voltage on the bonding lead and design a test that separates the two.
  briefing: Low resistance is not the same thing as low transient voltage.
  stake: >-
    Friday. The trailer mechanism explains a remote failure, but the rack at the mast base has a six-metre bonding lead of its own. Its DC drop is only 9 V. If the lead's inductance matters on a microsecond front, the same copper can see tens or hundreds of kilovolts.
  takeaway: A perfect earth at the end of six metres of wire is not an earth at a microsecond.
  segue: >-
    Using an effective lead inductance near 6 µH, the model gives about 180 kV for a 30 kA-per-microsecond front, while the resistive drop is only 9 V. The exact transient voltage still has to be measured. The next question is whether all 30 kA even reaches the grid through the path drawn on the sheet.
  stops:
  - group: EARTH
    task: Derive the voltage along the bonding lead
    title: Nine volts — or 180,000?
    reason: >-
      Ana Sifuentes and Emil Strand disagree about whether six metres of copper can be ignored, and one of them is answering the wrong question at the wrong rate of change.
    concept: Self-inductance, and why a straight wire has it
    place: Earthing Compound
    scene: Six metres of 70 mm² copper run from the rack earth bar to the grid. Its measured resistance is 0.3 mΩ. Sifuentes places the April certificate beside the drawing while the strike's 1 µs rise time goes on the board.
    guide: >-
      Build it a line at a time. The same six metres of copper has two voltages across it: one from its resistance and one from its inductance. Work out both — Ohm's law for the steady case, and the inductive voltage for the front of the strike. Then compare them, because the comparison is the answer rather than either number.
    background:
    - >-
      Why one lead has two answers. Resistance responds to how much current is flowing. Inductance responds to how fast it is changing. At direct current the second term is zero, so the certificate measured only the first. During a one-microsecond front, thirty kiloamps arrive at 3 × 10¹⁰ amps a second, and the inductive term is thousands of times larger.
    - >-
      Why neither resistance measurement is wrong. The bonding lead really measures about 0.3 mΩ at low frequency, and the April earth test really reported 25 Ω for the grid under its own test conditions. Neither number, by itself, is a complete description of a microsecond lightning transient. The mistake is not the measurement; it is using a low-frequency result outside the regime it measured.
    - >-
      What the model means for the rack. A fast transient can create a large voltage difference between the rack earth and the grid through inductance in the complete current loop. That is why lightning protection depends on transient impedance and geometry as well as conductor size. The exact bonding-lead voltage here is still a prediction until a fast differential probe measures it.
    assumes:
    - a straight conductor has an inductance of roughly a microhenry per metre
    - a changing current through an inductance produces a voltage across it
    takeaway: The same wire can be resistance-dominated at steady current and inductance-dominated during a fast transient.
    format: DERIVE
    question: Work out what the bonding lead does during the front of the strike, and compare it with what it does at direct current.
    answerText: IR ≈ 9 V. If the installed lead-plus-return geometry has an effective inductance near 6 µH, then L·dI/dt ≈ 180 kV for dI/dt = 3 × 10¹⁰ A/s. The second number is a model prediction that needs a fast differential measurement.
    why: "The 0.3 mΩ resistance gives only 9 V at 30 kA. The fast term is different: an assumed effective loop inductance of about 6 µH gives about 180 kV for a 30 kA-per-microsecond rise. Inductance is a property of the complete current loop, so “1 µH per metre” is only a rough engineering scale, not a universal constant for a piece of wire. The lesson is robust even if the exact number moves: fast transients can be dominated by L·dI/dt, and the predicted voltage should be measured before it is promoted to a fact."
    derive:
      hint: Do the resistive line first so there is something to compare with.
      start: V = IR for the steady case, V = L·dI/dt for the changing one
      startNote: R = 3.0 × 10⁻⁴ Ω; assume an effective lead-plus-return inductance L ≈ 6 µH for this geometry; I = 3.0 × 10⁴ A; dI/dt = 3.0 × 10¹⁰ A/s
      goal: the two voltages across the same lead, in volts
      askRule: true
      rules:
      - Gauss's law
      - symmetry argument
      - superposition
      - line integral of E
      - rearrangement
      - boundary condition
      steps:
      - ask: Write the resistive drop at the peak of the current.
        answer: 1
        candidates:
        - text: V = I/R = 3.0 × 10⁴ / 3.0 × 10⁻⁴
          rule: rearrangement
          why: Dividing by the resistance instead of multiplying. A hundred megavolts across a piece of copper, which is the sort of answer that ends an investigation early.
        - text: V = IR = (3.0 × 10⁴)(3.0 × 10⁻⁴)
          rule: rearrangement
        - text: V = IR with R the earth resistance, 25 Ω
          rule: boundary condition
          survives: true
          why: 'Using 25 Ω here mixes two different measurements: that value belongs to the low-frequency earth test, not to the 0.3 mΩ bonding lead. Multiplying 30 kA by it gives 750 kV, but that is not a valid lightning-transient prediction for either the lead or the grid.'
        - text: V = I²R
          rule: rearrangement
          why: That is a power rather than a voltage, and it puts watts where volts belong.
      - ask: Write the inductance of the lead.
        answer: 0
        candidates:
        - text: Use the installed-loop estimate L ≈ 6 µH for this geometry
          rule: boundary condition
        - text: L ≈ 1 µH because the lead is one conductor
          rule: boundary condition
          survives: true
          why: Inductance belongs to a current loop and depends on geometry. Treating “one conductor” as one microhenry ignores both length and the return path.
        - text: L = 0 because a straight lead is not a coil
          rule: symmetry argument
          why: Straight conductors still have inductance because their current creates magnetic flux linked with the return path.
        - text: L = R because resistance and inductance are both impedances
          rule: rearrangement
          why: They enter impedance with different units and different frequency dependence; one cannot be substituted for the other.
      - ask: Write the inductive voltage on the front of the stroke.
        answer: 2
        candidates:
        - text: V = L·I = (6 × 10⁻⁶)(3.0 × 10⁴)
          rule: boundary condition
          why: The current rather than its rate of change. It gives a fifth of a volt and would exonerate the lead completely.
        - text: V = I·dL/dt
          rule: rearrangement
          why: The inductance is not changing — nobody is moving the wire. This differentiates the wrong factor and gives zero.
        - text: V = L·dI/dt = (6 × 10⁻⁶)(3.0 × 10¹⁰)
          rule: rearrangement
        - text: V = L·dI/dt with dI/dt = 3.0 × 10⁴ A/s
          rule: rearrangement
          survives: true
          why: The peak current has been written in as though it were the slope. The line is correct in form and the answer, a fifth of a volt, is the same wrong conclusion as the first branch by a tidier route.
      - ask: Say which of the two the April certificate measured.
        answer: 1
        candidates:
        - text: both, since resistance and inductance are measured together
          rule: boundary condition
          why: An earth tester injects a steady current, and a steady current has no rate of change for an inductance to respond to. It cannot see the second term at all.
        - text: the resistive one, because the tester injects a steady current
          rule: boundary condition
        - text: the inductive one, because the tester uses an alternating source
          rule: rearrangement
          survives: true
          why: Testers do use a low-frequency alternating source, which makes this sound right. At a hundred hertz the inductive part of six microhenries is four milliohms — real, and ten million times smaller than what a microsecond front produces.
        - text: neither, because it measured the soil rather than the lead
          rule: symmetry argument
          why: The measurement includes everything in the loop it injects around, lead included. What it cannot include is a rate of change it never applies.
      commit: Commit the derivation
  - group: FIELD
    task: Say what follows for how the site should be bonded
    title: What kind of bond survives a fast transient?
    reason: >-
      Adeyinka Vero wants one site rule the whole crew can apply to future bonds, since the rack, the mills and the trailer all have their own sketches and no shared standard.
    place: Field Station
    scene: Vero stands at the rack with the six-metre bond marked on the drawing. The rack, mills and trailer each have their own connection sketches. She wants one site rule the crew can apply before the next installation is built.
    guide: >-
      Four bonding rules. Ask of each what term it acts on. Cross-section moves resistance far more than it moves inductance, and inductance is what the fast front sees. Length and loop area are what inductance depends on. Two of the options would create differences between separate earths rather than remove them. The rule has to be usable before the next installation is built.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
    assumes:
    - inductance grows with the length of the conductor
    takeaway: Fast-transient bonding depends on geometry and shared reference paths, not only on low DC resistance.
    format: CHOICE
    question: What does the inductive term imply for how equipment should be bonded?
    why: "For a fast transient, the voltage depends on the inductance of the complete current loop as well as on resistance. Making a conductor thicker often reduces R much more than it reduces L. Short, direct bonds with a nearby return path reduce loop inductance and avoid large potential differences between separated references. The report should therefore recommend controlled geometry — short bonds, small loop area and intentional return paths — rather than treating a low DC resistance as the whole lightning-protection design."
    choices:
    - Keep bonds short and keep the return path close
    - Use the thickest cable available, regardless of route
    - Earth each item separately so no shared bond carries current
    - Insulate the equipment instead so bonding is unnecessary
    answer: Keep bonds short and keep the return path close
    rebuttals:
    - Cross-section is what sets resistance, and it barely touches the inductance that dominates here.
    - Separate earths create exactly the difference in potential that the equipment then bridges.
    - Insulation has to withstand the induced volts, which are the problem rather than the connection.
  - group: BANK
    task: Work out how to test the finding in the hall
    title: Which knob separates R from L?
    at: gap-row
    reason: >-
      Josefa Ruiz has one afternoon of hall time and needs to know which front setting would actually put this finding to the test rather than just repeat what is already believed.
    concept: The LR transient, and inductive volts against resistive volts
    place: Impulse Hall
    scene: Ruiz can drive the same six-metre lead with the same peak current but choose a front from 100 µs down to 0.5 µs. A fast differential probe is on the lead. One afternoon is available.
    guide: >-
      Hold the lead geometry and peak current fixed. Change only the rise time. A resistive drop follows I; an inductive drop follows dI/dt. If the measured lead voltage scales with the front rate and returns when the slow front is restored, the inductive term has passed a causal test.
    background:
    - The two terms respond to different things. IR depends on the current amplitude. L dI/dt depends on how quickly that current changes.
    - Changing rise time at the same peak current is therefore the discriminating test. It changes dI/dt without changing the resistive peak.
    - The exact voltage is still a measurement problem because the effective inductance belongs to the installed loop. The model provides a prediction; the probe decides whether the geometry behaves that way.
    assumes:
    - a laboratory impulse can be given a chosen rise time
    takeaway: A causal test changes the variable that separates competing models while holding confounding variables fixed.
    format: CONTROL
    question: Which variable, changed on its own, separates the inductive explanation from the resistive one?
    answerText: Change the front time while holding peak current and geometry fixed. A 100 µs rise makes the 6 µH model predict only about 1.8 kV of inductive drop; a 0.5 µs rise predicts about 360 kV. The fast probe can test whether the lead follows that scaling.
    why: 'At fixed 30 kA peak current, IR remains about 9 V. With L ≈ 6 µH, changing the rise from 100 µs to 0.5 µs changes dI/dt from about 3 × 10⁸ to 6 × 10¹⁰ A/s, so the inductive prediction changes from roughly 1.8 kV to 360 kV. That large lever arm is why rise time is the discriminating variable. The point of the experiment is not to assume the 6 µH estimate is exact; it is to see whether the measured voltage follows the dI/dt dependence at all.'
    control:
      observable:
        label: Peak voltage across the six-metre bonding lead
        unit: kV
      variables:
      - id: front
        label: Front time of the same-current impulse, 100 µs down to 0.5 µs
      - id: electrode
        label: Lead and return-path geometry
      - id: charge
        label: Peak current of the impulse
      - id: earth
        label: Probe position and reference
      held:
      - peak current
      - lead and return-path geometry
      - probe position and bandwidth
      - ambient test conditions
      truth: front
      baseline: 2
      response: 360
      noise: 8
      hint: The hall fires on command. Set what you want changed, run it, and watch whether the peak follows.
      run: Fire the bank
      commit: Name the variable that separates the models

  # ---------------------------------------------------------------- day 11
- title: Where did eleven kiloamps go?
  objective: Follow the current down the mast, locate the unplanned branch, and decide which measurement can distinguish the remote current path.
  briefing: Current cannot disappear. Read down the mast until the record stops adding up.
  stake: >-
    Monday of week five. Thirty kiloamps enters the mast, but only about 18 kA reaches the grid clamp. If the missing eleven kiloamps is on the instrument conduit, hardware that was never designed as a lightning path is carrying roughly a third of the stroke.
  takeaway: A current that is not where it was a moment ago has gone somewhere, and the place it left is a fact about the site.
  segue: >-
    The loss begins below the 15 m shunt, exactly where the conduit is bonded: about 11 kA has taken an
    unplanned path. The cloud-charge estimate is now the same order as the stroke charge rather than
    contradicting it. Then radar posts day 12's cell, and the station gets one chance to predict a shot
    before measuring it.
  stops:
  - group: MAST
    task: Find the station where the current stops matching
    title: Where does the current leave the down-conductor?
    at: shunt-rack
    reason: >-
      Kenji Nakata has every shunt reading from last week's stroke at once for the first time, and wants the station where the current stops matching found before the report calls it noise.
    concept: Current as a flow, and current density
    place: Mast Base
    scene: >-
      Thirty kiloamps entered the mast tip on the last stroke. Current that enters a conductor leaves it somewhere, so the same thirty should appear at every shunt down the conductor unless something is taking a share. Nakata has seven measuring points from tip to soil, deliberately not read in order, and wants the break located before anybody starts explaining it.
    guide: >-
      Nothing is read for you. Press Read on any station and it reports what that station measured on the stroke, and what the station above it implies should have arrived. Take at least three. A shortfall between two stations is not an instrument error — it is a route the current took instead. Then click the station where the current stops being where it should be, and commit.
    background:
    - >-
      Why a shortfall is a route. Charge is conserved, so current does not go missing. If 29 kiloamps pass one shunt and 18 pass the next, then 11 left the conductor between them, and the only question is through what. On a mast that is usually a bond nobody drew on the diagram: a conduit, a cable tray, a ladder, an instrument earth.
    - >-
      What a shunt actually measures. Each station is a low-value resistor in the path with the voltage across it recorded, so the reading is the current through that station and nothing else. It cannot tell you where current went, only that it is no longer here — which is why the answer is a section between two stations rather than a component.
    - >-
      Why the order of reading does not matter and the pairs do. Every reading is of the same stroke, so they can be taken in any sequence. What carries information is the difference between two of them, which means a reading is worth little on its own and a pair either side of the suspect section is worth the trip.
    assumes:
    - current entering a conductor leaves it somewhere
    - two conductors bonded together share whatever current is offered to them
    takeaway: Current is conserved, so a shortfall between two stations is not an error but a route.
    format: PROBE
    question: Thirty kiloamps entered at the tip. Take the readings you think you need — where does the current stop being where it should be?
    answerText: The break is between the 15 m shunt and the base. The reading falls from 29.1 kA to 18.2 kA, so about 10.9 kA — roughly 11 kA — leaves the down-conductor in that last section, where the conduit is bonded.
    why: 'The upper readings stay near 30 kA. The 15 m shunt reads 29.1 kA and the base clamp reads 18.2 kA, a difference of 10.9 kA. That locates the branch before any mechanism is chosen. The conduit bond lies inside the interval, making it a strong candidate path. The important habit is current continuity: find where the balance breaks, then inspect what physical conductor exists there.'
    probe:
      chainLabel: Station
      stations:
      - id: S45
        label: Shunt at 45 m
        reading: 29.6 kA
        expected: 30 kA entered at the tip
        load: within tolerance
      - id: S30
        label: Shunt at 30 m
        reading: 29.4 kA
        expected: 29.6 kA from the station above
        load: within tolerance
      - id: S15
        label: Shunt at 15 m
        reading: 29.1 kA
        expected: 29.4 kA from the station above
        load: within tolerance
      - id: BASE
        label: Clamp at the base
        reading: 18.2 kA
        expected: 29.1 kA from the station above
        load: about eleven kiloamps unaccounted
      - id: LEGA
        label: Grid leg A
        reading: 9.4 kA
        expected: half of whatever reaches the grid
        load: consistent with the base reading
      - id: LEGB
        label: Grid leg B
        reading: 8.6 kA
        expected: half of whatever reaches the grid
        load: consistent with the base reading
      - id: ROD
        label: Trailer rod, 200 m out
        reading: 0.2 kA
        expected: nothing, if the trailer is not in the path
        load: small and not zero
      target: BASE
      minReadings: 3
  - group: FIELD
    task: Put a number on the charge the cell was holding
    title: Does the cloud charge budget make sense?
    at: mill-array
    reason: >-
      Mira Halvorsen wants the layer's total charge in the season log, next to the strokes it actually produced, since a density alone cannot say how big the cell was.
    place: Field Station
    scene: |-
      Halvorsen has the effective layer charge density from day two and a charged area of about 100 km² from radar. Vero wants the total beside the roughly 3 C stroke estimate.
    guide: >-
      Five numbers, and three of them belong to other questions. The height of the base. The field at the ground. The rough charge in the August stroke. Ask of each whether this total depends on it. The result should land on the same few-coulomb scale as the independent stroke estimate; agreement in scale is a consistency check, not proof that the simplified cloud model is exact.
    background:
    - >-
      Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs, and whether the size of the answer looks right once they are in place.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label is how a unit mismatch, or a quantity belonging to a different part of the problem, is caught before it is placed — which is the habit this format exists to build.
    assumes:
    - charge per unit area multiplied by area is charge
    takeaway: A charge density is a local quantity and a total needs an area, which is the thing a single instrument can never supply.
    format: BALLPARK
    question: Estimate the charge held on the base of the cell overhead.
    why: 'The same simple cloud-ground model gives about 4 C on the effective charged layer, while the rough August stroke estimate is about 3 C. Those values are the same order, which is a useful consistency check. They should not be overinterpreted: the radar area, field uniformity and rectangular current estimate are all approximations, and a real thunderstorm contains a much more complicated three-dimensional charge structure.'
    estimate:
      prompt: The model gives σ ≈ 4.0 × 10⁻⁸ C/m², and radar puts the effective charged base near 1.0 × 10⁸ m².
      question: Choose the charge per square metre and the area it covers.
      labels:
      - 4.0e-8  (C/m², effective charge per square metre)
      - 1.0e8  (m², effective charged area)
      - 1.2e3  (m, height of the base above the flat)
      - 4.5e3  (V/m, the field at the ground)
      - 3.0  (C, the charge in the August stroke)
      values: [4e-08, 100000000, 1200, 4500, 3]
      slots: 2
      template: "{0} × {1}"
      formula: a*b
      correct: [0, 1]
      target: 4.0
      tolerance: 0.25
      units: coulombs
      relationship: Total charge Q = σ × A, the charge per unit area multiplied by the area it covers.
      solution: 4.0 × 10⁻⁸ × 1.0 × 10⁸ = 4.0 C.
      explanation: About 4 C in the simplified effective layer. Height does not enter this multiplication because σ was already inferred from the field model; the charged area is the second quantity needed.
      givens:
      - Effective charge density 4.0 × 10⁻⁸ C/m²
      - Effective charged area about 1.0 × 10⁸ m²
  - group: EARTH
    task: Spend the two field-check credits on evidence that can decide why the remote trailer rod carried 200 A.
    title: "What measurement can identify the 200 A path?"
    reason: >-
      Blessing Okoro has two field-check credits and four possible causes for two hundred amps on the remote trailer rod, and has to spend them where the answer would actually change something.
    place: Earthing Compound
    scene: The trailer rod carried 200 A during a stroke that never touched it. Ana Sifuentes has the network map open beside the log. Four follow-up checks are possible before the next cell, but field access allows only two credits.
    guide: >-
      Two credits, four checks, and one puzzle: the trailer rod carried 200 amps during a stroke that never touched it. Open each check and ask what result would separate ordinary soil conduction from a different path. Buy the two that can tell those apart, not the two that would measure the current more precisely.
    background:
    - >-
      What the two explanations are. Current spreading through soil from a distant strike falls off in a predictable way with distance, so 200 amps at the trailer would imply a whole pattern across the network. A different path — a buried service, a cable screen, a fence line — delivers current to one place without that pattern.
    - >-
      Why precision does not help. Measuring the 200 amps again to three figures leaves both explanations standing. The check worth buying is one whose two possible results point at different explanations, which is the same argument every VALUE stop makes.
    - >-
      Why the answer matters before the next cell. If it is soil conduction, the network map is right and the number is expected. If it is a path nobody drew, then equipment on that path saw current it was not designed for, and the same thing will happen in the next storm.
    assumes:
    - soil conducts, and current spreads through whatever is available
    takeaway: When several mechanisms fit one reading, the best follow-up is the measurement whose possible outcomes separate them.
    format: VALUE
    question: Which evidence is worth buying to decide whether the remote current is ordinary soil conduction or a different path?
    value:
      decision: Decide which physical path best explains the 200 A measured at the remote trailer rod.
      budget:
        amount: 2
        unit: field-check credits
        label: Field access before the next cell
      hint: Open each check and ask what result would distinguish a distributed ground path from a different connection. Precision is not the same as discrimination.
      options:
      - id: soil_map
        label: Map ground potential from the mast grid toward the trailer rod
        cost: 2
        axis: distributed soil conduction
        decisive: true
        reveals: Whether a continuous potential gradient through the soil can drive current at the remote rod.
      - id: continuity
        label: Trace metallic continuity between the mast system and trailer
        cost: 1
        axis: hidden metallic bond
        decisive: false
        reveals: Whether an undocumented conductor exists, but a negative result still leaves soil and induced paths unresolved.
      - id: strike_marks
        label: Inspect the trailer rod and bracket for branch-strike evidence
        cost: 1
        axis: direct attachment
        decisive: false
        reveals: Whether the rod was directly attached by a branch, without testing the ordinary soil-current hypothesis.
      - id: pair_monitor
        label: Repeat the trench-pair differential-voltage measurement
        cost: 2
        axis: inductive cable coupling
        decisive: false
        reveals: Whether the cable loop is driven again, but not whether that loop is the source of the 200 A through the rod.
    answerText: Buy the soil-potential map if the immediate question is whether distributed ground current can account for the remote 200 A. A continuous gradient would support that path; a discontinuous/localized pattern would push the investigation toward a hidden conductor or branch.
    why: "A 200 A reading at one remote rod does not identify its path. Mapping ground potential along the route is useful because distributed soil current predicts a spatially continuous pattern, whereas a hidden metallic path can create a more localized jump. The result would support or weaken the soil-conduction model; it would not prove that all other mechanisms are absent. The measurement is valuable because its possible outcomes discriminate between models rather than merely repeating the same current reading more precisely."
  # ---------------------------------------------------------------- day 12
  - group: FIELD
    task: Work the mast round while the storm rule changes.
    title: The rule changes while you are outside
    reason: >-
      Owen Tate's mast round has to change as the safety rule changes with the storm coming in, and the reason for each version has to be clear to whoever is following it.
    concept: "Energy in the magnetic field, and where a strike puts it"
    place: Mast Base
    scene: One standing rule governs work on the mast. The safety officer changes it as the storm comes in. The field mill rises, then a strike lands within ten kilometres, then the all-clear.
    guide: >-
      Do the jobs the current rule allows and leave the rest. The rule is on the board at the mast base and it changes without an announcement. What is scored is the jobs either side of a change, because they are the only ones that show whether the crew is reading the board.
    background:
    - >-
      Why the board changes in this Station 12 exercise. Its staged status combines the site instruments with the station safety plan so work is progressively restricted before a shot window. These authored field thresholds are part of the game scenario, not universal lightning-safety limits; real outdoor lightning work follows the facility's formal plan and conservative weather guidance.
    - >-
      Why the changeover is where somebody gets hurt. A crew working to the last rule is a crew on the mast after the rule said come down, and nothing about being three quarters of the way through a job makes the field any lower.
    - >-
      Why the staged exercise matters. The transition is the dangerous moment operationally: someone who keeps following a withdrawn instruction can remain exposed after the site status has changed. The lesson is to obey the current safety state immediately, not to infer personal safety from a particular electric-field number.
    assumes:
    - work near a tall mast in a storm is governed by rules that change
    takeaway: The cost of a withdrawn instruction is paid by whoever is still working to it.
    format: SPOT
    question: Work to the rule on the board, and keep watching the board.
    answerText: Read the board rather than the job list. Every change leaves a few minutes in which the old rule still looks like the one in force.
    why: >-
      Three rules run across the storm and each allows a different part of the round. Anything at all, then ground-level work only, then nothing outside at all. A job can be allowed under two of them, which is what makes the change cost real rather than notional, and the panel scores the window either side of each change. Most of the list is allowed by neither rule or by both, and is handled correctly by somebody who has read nothing. The mast's own version of this is the two minutes after the field mill crosses its threshold: the rule has changed to ground level only, and there is somebody at forty metres who is nearly finished. Being nearly finished has never lowered a field, and the whole point of the staged rules is that they change before the strike rather than after it.
    spot:
      duration: 40
      switchEvery: 12
      pass: 0.75

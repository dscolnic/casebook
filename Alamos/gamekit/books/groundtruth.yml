- title: One shot left
  objective: Derive the Marx-bank output, spend the last shot on the most discriminating test, and turn the result into a geometry-based mitigation.
  briefing: After today, no new experiment can enter the review pack.
  stake: >-
    Thursday. The hall has one usable shot left before the report freezes. You can spend it repeating a familiar calibration or on a prediction from the coupling model written down in advance. Only one can change what the final report is allowed to claim.
  takeaway: A test that repeats what is already known spends the same time as one that could come out either way.
  segue: >-
    The fast-front coupling shot is fired at the setting written down in advance. The bench loop lands
    within nine per cent of the predicted value. The model is no longer only a post-mortem explanation;
    it has survived a test designed to fail it. On day 15 you still have to separate what was measured,
    what was inferred, and what remains unmeasured — and sign your name to one version.
  stops:
  - group: BANK
    task: Derive the output of the twelve-stage bank
    title: What do twelve stages really make?
    at: bank-stages
    reason: >-
      Josefa Ruiz switches the bank between parallel charging and series firing every shot, and wants the voltage and capacitance that switch actually produces worked out in the open.
    place: Impulse Hall
    scene: |-
      Twelve stages, each a hundred nanofarads, all charged side by side to fifty kilovolts. When the gaps break down they are in a chain instead. Ruiz wants the output written before the setting is agreed.
    guide: >-
      Build it a line at a time. The stages charge side by side and fire in a chain, so the charging voltage and the output voltage are different questions. Work out what the chain delivers, then the series capacitance, then check the stored energy against the parallel case. The energy has to agree, and that check is the point.
    background:
    - >-
      Why parallel to charge and series to fire. In parallel every stage sees the same supply, so a modest supply can charge all twelve. When the gaps break down the stages are connected end to end, so their voltages add. That is a Marx generator, and it is how a fifty-kilovolt supply produces six hundred kilovolts.
    - >-
      What happens to the capacitance. Capacitors in series combine reciprocally, so twelve hundred-nanofarad stages in a chain behave as one stage of about eight nanofarads. Voltage up by twelve, capacitance down by twelve.
    - >-
      Why the energy check is the real answer. Half C V squared with the series values gives the same total as twelve individual stages did while charging, because nothing has been created. Any answer where the energy grows has an arithmetic error in it, and the check will find it before the setting is agreed.
    assumes:
    - capacitors in series carry the same charge and their voltages add
    - the reciprocals of series capacitances add
    takeaway: Switching from parallel to series multiplies the voltage by the number of stages and divides the capacitance by it, and the energy does neither.
    format: DERIVE
    question: Work out what the bank delivers when the gaps fire, and check it against the energy.
    answerText: 600 kV from a series capacitance of 8.3 nF, holding the same 1,500 J the twelve stages held separately. Twelve times the voltage, a twelfth of the capacitance, and the energy unchanged.
    why: When the twelve stages fire in series, the bank produces about 600 kV and an effective capacitance near 8.3 nF. Those values still store the same 1,500 J present before firing. The switching network does not create energy. It trades capacitance for voltage by the stage count. That is the key check on the derivation. A Marx generator can therefore reach hundreds of kilovolts even though no individual charging supply ever exceeds 50 kV.
    derive:
      hint: Series capacitance first, then the voltage, then check the energy against day six.
      start: n = 12 stages, each C = 100 nF charged to V₀ = 50 kV
      startNote: in parallel while charging, in series once the gaps break down
      goal: the output voltage, the series capacitance and the stored energy
      askRule: true
      rules:
      - Gauss's law
      - symmetry argument
      - superposition
      - line integral of E
      - rearrangement
      - boundary condition
      steps:
      - ask: Write the capacitance of the twelve in series.
        answer: 1
        candidates:
        - text: C_s = nC = 1200 nF
          rule: rearrangement
          survives: true
          why: That is the parallel result, which is correct for the charging arrangement and wrong for the firing one. It is the commonest single error on this circuit, and everything after it stays arithmetically clean.
        - text: C_s = C/n = 8.3 nF
          rule: rearrangement
        - text: C_s = C = 100 nF, since the same charge passes through all of them
          rule: boundary condition
          why: The charge is indeed common to all of them, and that is the reason the voltages add and the capacitance falls. Equal charge is the premise rather than the conclusion.
        - text: C_s = n/C
          rule: rearrangement
          why: Reciprocals add, and then the reciprocal of the sum is taken. Stopping halfway leaves per-farad units.
      - ask: Write the voltage across the chain.
        answer: 3
        candidates:
        - text: V = V₀ = 50 kV, since they are all the same
          rule: boundary condition
          why: In parallel that is right. In series the potential differences add along the chain, which is the entire purpose of the arrangement.
        - text: V = V₀/n = 4.2 kV
          rule: rearrangement
          why: Dividing rather than multiplying. A generator that lowers the voltage would be a strange thing to build a hall around.
        - text: V = √(n)·V₀ = 173 kV
          rule: superposition
          survives: true
          why: "Root-n is what independent random contributions give. These are not independent and not random: they are twelve equal steps in series, and they add linearly."
        - text: V = nV₀ = 600 kV
          rule: rearrangement
      - ask: Check the energy against what the twelve stages held.
        answer: 0
        candidates:
        - text: U = ½C_sV² = ½(8.3 × 10⁻⁹)(6.0 × 10⁵)² = 1.5 × 10³ J
          rule: rearrangement
        - text: U = ½C_sV² with C_s = 1200 nF, giving 2.2 × 10⁵ J
          rule: rearrangement
          survives: true
          why: The parallel capacitance carried down from the first branch. It says the act of switching created a hundred and forty times the energy, which nothing in the hall did.
        - text: U = n·½C_sV² = 1.8 × 10⁴ J
          rule: superposition
          why: The n is already inside the series capacitance and the voltage. Multiplying by it again counts the stages twice.
        - text: U = ½C_sV₀² = 10 J
          rule: boundary condition
          why: The stage voltage with the series capacitance, which are quantities from two different arrangements of the same hardware.
      commit: Commit the derivation
  - group: SHOT
    task: Decide what the final shot is for
    title: Spend the last shot on a prediction
    reason: >-
      Ingrid Lauwers wants the last shot spent on the coupling prediction; Emil Strand would rather repeat the bank calibration. Vero has to decide which result can still change the report.
    place: Launch Control
    scene: |-
      One hall shot remains. Lauwers has written down the loop voltage expected for a fast-front test at the chosen geometry. Strand proposes a twelfth repeat of the standard bank setting.
    guide: >-
      One shot, and a list of things it could be spent on that costs more than one shot. Buy what would change the station's next decision rather than what would be reassuring to have. Two of these confirm something already known to two significant figures, which is worth exactly nothing to the review.
    background:
    - >-
      What makes a test worth firing. Not how precise it is and not how likely it is to succeed — whether its possible outcomes point to different decisions. A shot whose two outcomes both leave the placard where it is has told the station nothing it can act on.
    - >-
      Why a prediction with a number is the strong form. Lauwers's proposal names the voltage the bench loop should reach if the inductive account is right. It can come out wrong, and a test that cannot come out wrong is a demonstration.
    - >-
      What the repeat is actually for. Confirming the bank at the standard setting is defensible when the bank is the thing in doubt. It is not, and it has been fired at that setting eleven times this season, so the eleventh confirmation buys the same axis again.
    assumes:
    - a test is worth what it could change
    takeaway: The most informative test is the one whose possible outcomes can falsify an important model.
    format: VALUE
    question: One shot in the hall. What is it worth spending on?
    answerText: 'Spend the shot on the pre-registered coupling prediction: same peak current, deliberately shortened front, fixed loop geometry, and a bench voltage written down before firing.'
    why: 'The useful shot is the one that can discriminate between models and change the final claim. The coupling model predicts how the loop voltage should scale with dI/dt for a fixed geometry. Writing the prediction first and then firing a fast-front shot gives the model a chance to fail. Repeating a bank setting already demonstrated eleven times improves repeatability statistics but does not address the main unresolved mechanism. The authored outcome is within nine per cent of the coupling prediction, which supports the model without making it exact.'
    value:
      budget:
        amount: 1
        unit: shots in the hall
      decision: whether the inductive-coupling model earns direct experimental support before the report closes
      options:
      - id: fast
        label: Test the pre-registered coupling prediction with a faster front at the same peak
        cost: 1
        axis: dI/dt response of the fixed loop geometry
        decisive: true
        irreversible: true
        reveals: whether the measured loop voltage follows the predicted inductive scaling
      - id: repeat
        label: Repeat the standard setting to confirm the bank
        cost: 1
        axis: bank repeatability
        reveals: another repeatability point at a setting already demonstrated eleven times
      - id: probe
        label: Recalibrate the bench probe against the reference divider
        cost: 1
        axis: instrument calibration
        reveals: a correction of a per cent or two on every number in the record
      - id: earth
        label: Re-measure the earth resistance at the test bay
        cost: 1
        axis: instrument calibration
        reveals: a figure last measured in March, in wetter soil
      commit: Commit the shot
  - group: COUPLE
    task: Fix what the report will say about mitigation
    title: What geometry should the next station avoid?
    reason: >-
      Ingrid Lauwers has to turn this week's coupling finding into one recommendation the next station can act on, without overstating what a single season actually tested.
    place: Outstation
    scene: |-
      Lauwers has to write a paragraph the review will read as a recommendation. Three mitigations are on the table and only one of them is supported by this season's measurements.
    guide: >-
      Four mitigations, and all four are sensible engineering. Ask of each whether this season measured what it buys. The coupling depends on the length of the parallel run and on how close it gets to the conductor. Better earthing acts on a different path. And the trailer was already distant. Forty metres of its cable was not.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
    assumes:
    - a recommendation is only as good as the measurement behind it
    takeaway: A recommendation should target a variable that the season's evidence shows actually controls the measured mechanism.
    format: CHOICE
    question: What geometry should the report recommend avoiding at the next station?
    why: >-
      The coupling scales with the length of the parallel run. It also scales with the logarithm set by
      the two sides of the loop. So the geometry lesson is to cut loop area and mutual inductance. Keep
      outgoing and return conductors together. Avoid long parallel runs beside the down-conductor. Move
      further from the lightning-current path where you can. Surge protection and grounding still matter.
      But what this season tested directly was the geometry.
    choices:
    - Keep signal and return together and minimize any parallel run beside the down-conductor
    - Improve the DC earth resistance until it falls below ten ohms
    - Move only the trailer farther away while leaving the cable route unchanged
    - Use a thicker signal conductor without changing the loop geometry
    answer: Keep signal and return together and minimize any parallel run beside the down-conductor
    rebuttals:
    - The measured mechanism is loop coupling; low DC earth resistance addresses a different quantity.
    - The trailer was already distant; the dangerous geometry was the long loop near the down-conductor.
    - Thickness changes resistance far more than the mutual-inductance geometry that drove this result.
    answerText: Keep signal and return conductors close together, and minimize the length they run in parallel beside the lightning down-conductor.
- title: Sign what the season can prove
  objective: Set next season's lead-time rule, mark the claims that remain inference, and sign the final report.
  briefing: Every important claim is now on one page. Your last job is not another calculation. It is deciding what you are willing to sign.
  stake: >-
    Friday. The review pack locks tonight. A second mast, next season's operating rule, and the six-person crew all depend on one document that must separate measurements from models and safety margins from averages.
  takeaway: A season is worth what its record can defend, which is always less than what the room believes.
  stops:
  - group: SHOT
    task: Set the criterion the station will work to
    title: Build a rule for the bad afternoon
    at: record-desk
    reason: >-
      Hal Brenner needs next season's lead time to survive its worst afternoon, not just its average one, before Adeyinka Vero can put a number on paper.
    concept: "Measurement in the right regime: shunts, dividers and what they load"
    place: Launch Control
    scene: |-
      Twenty-two minutes is the lead time the station actually achieved this season, against the thirty the rule assumes. Four changes are available and each of them costs something the station has little of.
    guide: >-
      The cloud is the lead time this station actually achieved across the season — twenty-two minutes on average against the thirty the rule assumes. The band is what the rule needs. Four changes are available, each costing something the station has little of, and they act differently: some move the average, some make the season more consistent. Apply what you would buy, then say when next season is defensible.
    background:
    - >-
      Why an average is not the claim. The rule is about every strike, not the mean one: a season that averages thirty minutes with a wide spread still contains days when the crew had ten. The cloud is the distribution of what actually happened, and the criterion is written on the fraction of it that clears the rule.
    - >-
      Moving and tightening. Calling the clear a mill-step earlier, or moving the shelter closer, adds minutes to every day — the cloud slides. A second radar feed with a nowcast, or a written and drilled call-out sequence, removes the days that went badly — the cloud tightens. Both buy lead time; only one of them removes the tail the rule is about.
    - >-
      What the tail costs. The days in the low tail are the days with people still on the flat when the first strike lands, and they are the days that end up in an incident report. That is why a plan is judged on its worst days rather than its typical one.
    assumes:
    - a rule has to work across every administration of it, not on a good afternoon
    - lead time varies from cell to cell as well as having an average
    takeaway: A rule fails on its spread as often as on its average, and only some changes touch the spread.
    format: CLOUD
    question: Build next season's lead-time rule from the observed distribution. Report the mean and one-sigma spread, then choose changes until at least 95% of the modeled cases clear the 30-minute requirement.
    cloud:
      hint: The band is the lead time the rule needs. The cloud is what this station actually achieved across the season, not what it achieved on its best day.
      bounds:
        min: 30
        max: 90
        unit: min
        label: Lead time achieved before the first strike
      centre: 22
      spread: 26
      pass: 0.95
      seed: 41
      costUnit: k
      actions:
      - id: earlier
        label: Call the clear one mill-step earlier
        effect: shift
        amount: 20
        cost: 2
      - id: walk
        label: Move the crew shelter to the pad end of the flat
        effect: shift
        amount: 14
        cost: 9
      - id: radar
        label: Buy the second radar feed and its nowcast
        effect: narrow
        amount: 0.5
        cost: 14
      - id: script
        label: Write and drill the call-out sequence
        effect: narrow
        amount: 0.65
        cost: 3
      commit: Adopt it for next season
    answerText: Shift the calls earlier and reduce the variability; the model should put at least 95% of simulated lead times above 30 minutes. Mean ±1σ is a description of the distribution, not the safety criterion by itself.
    why: Calling earlier shifts the centre of the lead-time distribution; better nowcasting and a drilled call-out sequence can reduce its spread. A safety rule should be judged on the lower tail, not only on the average or on whether one standard deviation clears the threshold. In this training model, the acceptance rule is at least 95% of simulated cases above 30 minutes. A real station would set that probability and its uncertainty through a formal safety process.
  - group: EARTH
    task: Spend the two final verification checks on the claims whose failure would most weaken the season report.
    title: Which claims still need a warning label?
    reason: >-
      Yusuf Kaya has time to trace only two of four signed claims before the report locks, and has to spend them where an unbacked claim would cost the review the most.
    place: Earthing Compound
    scene: The funding-review copy closes tonight. Four headline claims are already written and signed. Two have direct backing, while two depend on steps the station has not physically verified. Kaya has time to trace only two claims before the report locks.
    guide: >-
      Four headline claims, all signed, and two checks before the report locks tonight. Open each claim and read what already backs it. Two rest on direct evidence and two rest on steps nobody has physically verified. Hold what the backing does not support, and spend the checks where a wrong claim in a funding review would cost most.
    background:
    - >-
      What a signature is worth here. It records that somebody took responsibility for a sentence. It does not record that the condition was observed. A claim can be signed, believed and true, and still have nothing behind it that a reviewer could inspect.
    - >-
      Why the funding review changes the stakes. This copy goes to people deciding whether the station continues. A claim that turns out to be unbacked costs more than one that was never made, because it puts every other claim in the document in doubt.
    - >-
      How to choose between two unbacked claims. Not by which is least likely — by which does more damage if it is wrong. That is consequence rather than probability, and it is the judgement the two checks are for.
    assumes:
    - claims of different kinds are defended in different ways
    takeaway: A signed claim is not stronger than the weakest unverified step needed to support it.
    format: ATTEST
    question: Which claims deserve the final two verification checks before the season report is frozen?
    attest:
      hint: Open each claim and read what already backs it. You have two checks. Spend them where a wrong claim would matter and the evidence chain is still incomplete.
      checks: 2
      claims:
      - id: trench_voltage
        label: The August stroke drove about 200 kV around the trench loop
        critical: true
        backed: true
        evidence: derived from the 40 m loop geometry and tested in the hall with a shortened front
        verification: trace the derivation and hall result to the archived raw records
      - id: missing_current
        label: About 11 kA leaves the down-conductor in its last 15 m
        critical: true
        backed: true
        evidence: measured along the conductor, including 29.1 kA at 15 m and 18.2 kA at the base
        verification: reconcile the seven current stations against the archived stroke
      - id: bond_voltage
        label: The six-metre bonding lead may develop about 180 kV on a 1 µs, 30 kA front
        critical: true
        backed: false
        evidence: model prediction using an assumed effective loop inductance near 6 µH; not measured directly on site
        verification: flag for a fast differential-probe measurement on the next instrumented season
      - id: routing
        label: Reducing loop area and parallel run beside the down-conductor should reduce coupling at the next station
        critical: true
        backed: false
        evidence: inferred from the measured coupling mechanism and geometry
        verification: trace whether the recommendation has a direct test or only the mechanism-based inference
    answerText: "Use the two checks on the unbacked high-consequence claims: the predicted 180 kV across the bonding lead and the general mitigation claim. The trench-loop voltage and missing-current claim already have direct supporting evidence."
    why: "The ~200 kV trench-loop result now has both a derivation and a controlled hall test. The ~11 kA branch-current result is supported by measurements along the conductor. The 180 kV bonding-lead value is different: it is still a model prediction based on an assumed effective inductance, not a direct site measurement. The geometry recommendation is an inference from a tested mechanism rather than a full-scale test of another station. Those last two claims deserve the strongest qualification in the final report."
  - group: SHOT
    task: Sign the final season report
    title: Which report do you sign?
    reason: >-
      Adeyinka Vero has the review copy open to the signature line. The report now has enough evidence to act, but only if it says clearly which claims were measured, which were tested as models, and which remain open.
    place: Launch Control
    scene: The review pack locks tonight. Four versions of the executive paragraph are on the screen. Only one preserves the measured results, the tested coupling mechanism, the new lead-time rule, and the unmeasured bonding-lead prediction without turning inference into fact.
    guide: >-
      The right report can be decisive without pretending uncertainty is gone. Look for the version that says what caused the trailer failure at the level the evidence supports, changes the operating rule because of the fast-cell near miss, and leaves the bonding-lead voltage explicitly unmeasured.
    background:
    - A final scientific decision is not a list of every number. It is a statement of what the evidence is strong enough to support and what action follows from that support.
    - The coupling mechanism has a derivation, a damage pattern that fits it and a controlled hall test. The exact on-site bonding-lead voltage does not have a direct measurement.
    - The crew-clear rule failed to provide the intended margin on one fast cell, so next season's rule must change even though nobody was hurt.
    assumes:
    - a report should distinguish measurement, tested model, inference and unresolved prediction
    takeaway: The final act of measurement is deciding what you are willing to claim from it.
    format: CHOICE
    question: Which final report do you sign?
    why: The defensible report is specific about both evidence and limits. The long-loop coupling mechanism is supported by the August damage pattern, a quantitative model and a controlled hall test. Roughly 11 kA of current diverted below the 15 m shunt is a direct measurement result. The six-metre bonding-lead value near 180 kV remains a model prediction until a fast differential probe measures it. The fast-cell near miss is enough to revise the crew-clear rule. Signing that version turns the season into an operational decision without pretending every uncertainty has vanished.
    choices:
    - Inductive coupling through the long trench loop is the best-supported cause of the trailer failures and survived a controlled hall test. About 11 kA diverted onto an unplanned path. Next season uses the revised lead-time rule. The predicted bonding-lead voltage remains unmeasured and is a priority measurement.
    - The 25-ohm earth resistance caused the trailer failures, so replacing the earth rod is sufficient. The old launch rule can stay because the crew reached shelter before the strike.
    - All major lightning paths at Station 12 are now proven, including 180 kV across the bonding lead. The station can operate next season without additional transient measurements.
    - The evidence is too uncertain to support any cause for the trailer failures, so the report should omit the coupling model and make no change to the operating rule.
    answer: Inductive coupling through the long trench loop is the best-supported cause of the trailer failures and survived a controlled hall test. About 11 kA diverted onto an unplanned path. Next season uses the revised lead-time rule. The predicted bonding-lead voltage remains unmeasured and is a priority measurement.
    rebuttals:
    - The 25-ohm value is a low-frequency measurement and the fast-cell near miss showed the old rule did not preserve its intended margin.
    - The bonding-lead voltage has not been measured directly, so calling every path proven turns a model prediction into a fact.
    - The coupling mechanism has quantitative and experimental support, and the safety near miss is direct evidence that the operating rule needs revision.

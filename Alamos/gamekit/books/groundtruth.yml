# Ground Truth — Station 12, Sablon Flats, and 15 working days of a storm season.
#
# Written to gamekit/tools/BOOK_TEMPLATE.md. The place is themes/groundtruth/site.js;
# the plan it came from is ../GAME_IDEAS.md under "Ground Truth".
#
# AP Physics C: E&M, taught as derivations. Ten of the forty-five stops are
# DERIVE panels and they are the spine of the campaign: Gauss on day 2, the
# potential integral on day 3, capacitance on day 5, the stored energy on day 6,
# Ampère on day 8, the inductive volts on day 9, the flux logarithm and Faraday
# on day 10, the RC discharge on day 13 and the Marx bank on day 14.
#
# `askRule: true` is on, which it is not in Midway or Headwater, and the reason
# is that in this course the choice of law IS the physics: a step whose key
# applies superposition while a distractor applies Gauss to a surface with no
# symmetry is the commonest way a Physics C student loses an E&M point. Every
# step offers at least two distinct rules among its candidates.
#
# The argument: Vero holds that the season is six weeks and a marginal field is
# still a field. Brenner holds that the crew is on an open flat under a 60 m
# mast and a cell that outruns the nowcast does not care about a countdown.
# Vero is right on day 4. Brenner is right on day 12.
#
# The timeline the cards are checked against:
#   3 Aug last season   strike S-114 — the outstation electronics died
#   April this year     the earthing signed off at 25 Ω, measured at DC
#   week 1–2            the mast re-instrumented, three shunts fitted
#   now                 week 3 of a six-week season; 15 working days
#   end of season       the funding review that decides the second mast

theme:
  id: groundtruth
  title: Ground Truth
  subtitle: Measurements Lead · Station 12, where lightning is made on purpose

groups:
- id: FIELD
  code: FIELD
  name: Field & Charge
  color: '#5f7fb8'
  desc: What is overhead, read from the ground, and what the reading is entitled to say.
  defaultLeader: vero
  milestones: [Read the mill, Bound the charge, Set the criterion, Ready to hand over]
- id: BANK
  code: BANK
  name: Impulse Hall
  color: '#c2703f'
  desc: Stored charge, stored energy, and air that stops being an insulator.
  defaultLeader: strand
  milestones: [Charge the bank, Compute the energy, Fire the gap, Ready to hand over]
- id: MAST
  code: MAST
  name: Mast & Down-conductor
  color: '#8a8f4a'
  desc: Where the current goes, what it does on the way, and how it is measured.
  defaultLeader: tate
  milestones: [Check the path, Read the shunts, Bound the field, Ready to hand over]
- id: EARTH
  code: EARTH
  name: Earthing & Transients
  color: '#7a6a52'
  desc: The grid under the flat, and the difference between an ohm and a microsecond.
  defaultLeader: sifuentes
  milestones: [Measure the grid, Model the lead, Time the transient, Ready to hand over]
- id: COUPLE
  code: COUPLE
  name: Coupling & the Outstation
  color: '#6f5b9a'
  desc: How a strike reaches a cable it never touched.
  defaultLeader: lauwers
  milestones: [Find the loop, Compute the flux, Break the coupling, Ready to hand over]
- id: SHOT
  code: SHOT
  name: Launch & Records
  color: '#3f8f7a'
  desc: When to trigger, what was predicted, and what the record can carry.
  defaultLeader: brenner
  milestones: [Set the rule, Call the shot, Close the record, Ready to hand over]

roster:
- id: vero
  name: Dr. Adeyinka Vero
  role: Station Lead
  division: FIELD
  bio: |
    Runs Station 12 and has run it for nine seasons. She holds that a
    triggered strike is the only lightning anybody gets to instrument in
    advance, and that six weeks a year is not many.

    Her argument with operations is the same one every storm. A marginal
    field is still a field, and a season spent waiting for the textbook cell
    is a season of nothing. She has never overruled a hold and she has argued
    against most of them.

    Her limit is that she wants the data, which is exactly the state of mind
    a launch criterion is written to protect a station from.
  quiz:
  - q: Why does Vero treat a cautious season as a cost rather than as prudence?
    a: Six weeks a year is the whole supply of triggered strikes
    wrong:
    - Funding bodies withdraw support from stations that fire fewer than ten rockets in a season
    - A field mill left unused for several weeks drifts out of calibration and cannot be trusted
    - Natural strikes cannot be instrumented at all, so a missed trigger means no data of any kind
- id: brenner
  name: Hal Brenner
  role: Operations & Safety Officer
  division: SHOT
  bio: |
    Twenty years on ranges before this one, and the only person here who has
    watched a cell change direction on a radar loop while a crew was still
    walking in from the pad.

    He is careful about how he puts it. Nobody at this station is reckless,
    and the criterion is not there for reckless people — it is there because
    the nowcast is a forecast, the flat is open, and the mast is sixty metres
    of steel with nothing else near it for a kilometre.

    His limit is that a hold is unfalsifiable. The strike that would have been
    caught is never in the record, and Vero can always point at that.
  quiz:
  - q: Why does Brenner say a hold can never be shown to have been right?
    a: The shot that was not fired leaves no record to argue with
    wrong:
    - Safety decisions are excluded from the station log by the operating agreement
    - A cancelled launch destroys the rocket, so the evidence is gone either way
    - Field mill readings are not archived unless a launch actually takes place
- id: sifuentes
  name: Dr. Ana Sifuentes
  role: Earthing Engineer
  division: EARTH
  bio: |
    Designed the grounding grid under this flat and signed the certificate
    that says it measures 25 ohms. Both statements are true and she is the
    person most interested in why that was not enough.

    Her method is to ask what regime a number was taken in. Soil resistance is
    a direct-current measurement of a direct-current property, and a strike is
    neither. She has spent two seasons trying to get a transient earth tester
    into the budget.

    Her limit is the ground itself: it is sand over clay, it changes with the
    water table, and no model of it survives a wet fortnight unchanged.
  quiz:
  - q: Why is Sifuentes unsatisfied by a grounding certificate she signed herself?
    a: The measurement was of a property the strike does not meet
    wrong:
    - The instrument used for the survey had not been calibrated within the previous year
    - Twenty-five ohms is above the limit set by the standard the station works to
    - Soil measurements are only valid for the season in which they are taken
- id: strand
  name: Dr. Emil Strand
  role: High-Voltage Engineer
  division: BANK
  bio: |
    Keeps the impulse hall, which is twelve capacitor stages, a set of spark
    gaps and a rule that nobody walks past the barrier until the earthing
    stick is on the bank and visibly on it.

    He is unromantic about the physics. A capacitor is a geometry, an energy
    is an integral, and the reason the hall exists is that a laboratory
    impulse can be fired at a chosen moment with a known waveform, which no
    cloud will ever agree to.

    His limit is that his impulses are clean. Real strikes have a rise time
    that varies stroke to stroke, and the hall cannot reproduce that.
  quiz:
  - q: Why does Strand consider the impulse hall worth having beside a real storm?
    a: It can be fired when you are ready, the same way every time
    wrong:
    - Laboratory impulses reach far higher currents than natural strikes do
    - Work in the hall can be carried out during the months when no storms occur
    - A capacitor bank produces a waveform closer to a real strike than a triggered one is
- id: lauwers
  name: Dr. Ingrid Lauwers
  role: EMC Engineer
  division: COUPLE
  bio: |
    Studies how a strike reaches equipment it never touched, which at this
    station means the outstation trailer two hundred metres from the mast and
    the cable run that goes out to it.

    She talks about loops rather than about wires. Any two conductors and the
    space between them enclose an area, that area has flux through it, and a
    current that changes in a microsecond turns that flux into volts. Nothing
    has to be connected to anything for this to happen.

    Her limit is that she can compute the coupling and not the damage. What a
    given voltage does to a given card is a question about the card.
  quiz:
  - q: Why does Lauwers describe the outstation cable as a loop rather than as a wire?
    a: Two conductors enclose an area, and area is what flux passes through
    wrong:
    - Cables are wound in loops during installation and are never fully straightened
    - A loop is the only shape in which a cable can carry current in both directions
    - The trailer and the mast are joined at both ends, which is what makes the run circular
- id: tate
  name: Owen Tate
  role: Rigger & Mast Supervisor
  division: MAST
  bio: |
    Put the sixty-metre mast up and has climbed it more often than anybody
    should. The three current shunts on the down-conductor are his fitting
    work, and the bonding at each joint is his signature.

    He is the station's memory of what is physically there. A conductor is not
    a line on a drawing: it has joints, a route, a bend radius at the base,
    and a clamp somebody replaced in a hurry last season that nobody has
    written down since.

    His limit is that he does not do the arithmetic and says so. He can tell
    you the lead is about six metres long, and what six metres costs is
    somebody else's department.
  quiz:
  - q: Why does Tate insist the drawings are not the down-conductor?
    a: A drawn line has no joints, no route and no bend at the base
    wrong:
    - Drawings of the mast were lost when the station changed operators
    - A conductor's resistance is impossible to calculate from a drawing at any scale
    - The route shown on the drawing was never the one that was built
- id: halvorsen
  name: Mira Halvorsen
  role: Field Instruments Technician
  division: FIELD
  bio: |
    Looks after the field mills: four of them across the flat, spinning
    shutters that read the field overhead by chopping it, and a fifth kept
    in the hut as a reference nobody is allowed to take outside.

    She distrusts a single mill. Any one of them sees the field plus whatever
    has blown onto it, and the way to tell a real change from a dirty rotor is
    that the flat's four readings move together.

    Her limit is speed. A mill reports the slow field; the fast part of a
    strike is gone long before its electrometer has responded.
  quiz:
  - q: Why does Halvorsen refuse to call a launch on one field mill?
    a: A single instrument cannot separate the sky from its own dirt
    wrong:
    - One mill provides no way of knowing which direction the storm is travelling
    - Mills are required by the operating standard to be installed in groups of four
    - A single reading is always lower than the true field because of ground effects
- id: nakata
  name: Kenji Nakata
  role: Current Measurement Engineer
  division: MAST
  bio: |
    Owns the shunts, the dividers and the digitisers, which between them are
    the only reason anybody knows what a strike at this station did.

    His standing complaint is regime. Every instrument here has a band it is
    honest in, and a reading taken outside that band is not noisy, it is
    wrong: a shunt with too much inductance reports the derivative of the
    current rather than the current, and it does so smoothly and plausibly.

    His limit is that he cannot calibrate against a real strike. Everything is
    referred to the impulse hall, and the hall does not do what the sky does.
  quiz:
  - q: Why does Nakata treat an out-of-band reading as worse than a noisy one?
    a: It comes back smooth and plausible and is of the wrong quantity
    wrong:
    - Out-of-band readings usually saturate the digitiser and produce a flat line
    - Noise can be averaged away, and every other kind of error can be corrected afterwards
    - A reading outside the band is always too small, so it is easy to detect
- id: ruiz
  name: Josefa Ruiz
  role: Impulse Hall Technician
  division: BANK
  bio: |
    Charges the bank, sets the gaps and puts the earthing stick on. She has
    done it eleven hundred times and does it the same way each time, which is
    the entire safety case of the hall.

    Her contribution to the physics is a habit: she writes the stage voltage
    and the gap spacing on the board before every shot, because the two
    together predict whether it will fire, and a bank that fires early is a
    bank whose gaps have drifted.

    Her limit is that the hall's numbers are hers and nobody checks them. She
    has asked for a second signature on the board for two seasons.
  quiz:
  - q: Why does Ruiz write the stage voltage and gap spacing up before every shot?
    a: The pair predicts whether it fires, so a surprise means something drifted
    wrong:
    - The board is the only record of the shot accepted by the station log
    - Writing them down is required before the earthing stick may be removed
    - The two numbers must be equal for the bank to discharge correctly
- id: okoro
  name: Blessing Okoro
  role: Test Engineer
  division: EARTH
  bio: |
    Runs the injection tests: a small known current pushed into the grid so
    the response can be measured somewhere else, which is the only way to
    learn anything about the ground without waiting for the sky.

    Her point about the grid is that it is a network rather than a terminal.
    Current entering at the mast leaves through every leg, and where it leaves
    decides the potential of the ground somebody is standing on.

    Her limit is amplitude. She injects amps and the sky delivers kiloamps,
    so everything she measures has to be argued to be linear before it can be
    scaled.
  quiz:
  - q: Why does Okoro describe the grounding grid as a network rather than an earth point?
    a: The current divides, and where it surfaces decides the ground somebody stands on
    wrong:
    - The grid was installed in separate sections that were never bonded together
    - A single earth point would exceed the resistance limit in the standard
    - Networks are easier to model than single conductors, so it is treated as one
- id: abioye
  name: Sam Abioye
  role: Instrumentation Technician
  division: COUPLE
  bio: |
    Wires the outstation and re-wires it after every season that damages it.
    The cable run to the trailer is his, including the two hundred metres of
    it that lie parallel to the down-conductor because that is where the
    trench is.

    He is the person who noticed that the trench route was never a decision.
    It follows the old service road, and the old service road runs past the
    mast, so the geometry that produces the coupling was chosen by whoever
    graded a track thirty years ago.

    His limit is that rerouting is a season's work and the season is now.
  quiz:
  - q: Why does Abioye say the cable route was never chosen?
    a: It follows a service road graded decades before the mast existed
    wrong:
    - The route was selected because it was the shortest path to the trailer
    - Cable trenches must follow existing tracks under the station's land agreement
    - The original drawings for the route were lost and it was rebuilt from memory
- id: kaya
  name: Dr. Yusuf Kaya
  role: Records & Data
  division: SHOT
  bio: |
    Keeps the shot record: every launch, every hold, the field at the moment
    of the decision, and what each instrument returned. He is the reason the
    station can say anything about last season at all.

    His rule is that a record is written before the result is known. A field
    reading logged after a successful shot is a memory of a reading, and the
    difference matters most on exactly the shots people most want to describe
    afterwards.

    His limit is that he holds what was written. Three of last season's shots
    have no criterion recorded at all, and no amount of care now recovers it.
  quiz:
  - q: Why does Kaya insist the criterion is logged before the launch rather than after it?
    a: A number written afterwards is shaped by knowing how it turned out
    wrong:
    - Readings recorded after a shot cannot be time-stamped by the station system
    - Post-shot entries are inadmissible in the funding review's evidence pack
    - The field mill overwrites its buffer as soon as a strike is detected

glossary:
- name: Field mill
  aliases: [field mill, mill]
  def: An instrument that reads the electric field overhead by spinning a shutter over a plate and measuring the charge that comes and goes.
- name: Triggered lightning
  aliases: [triggered lightning, triggered strike, trigger a strike]
  def: A strike started on purpose by flying a small rocket that trails a thin earthed wire up into a charged sky.
- name: Return stroke
  aliases: [return stroke, stroke]
  def: The bright, fast surge of current that runs back up an established channel, and the part of a strike that carries most of the charge.
- name: Rise time
  aliases: [rise time, rises in]
  def: How long a current takes to go from small to its largest value, about a microsecond in a strike.
- name: Peak current
  aliases: [peak current, peak of the current]
  def: The peak the current reaches during a strike, tens of kiloamps in a typical one.
- name: Gaussian surface
  aliases: [gaussian surface, closed surface]
  def: A closed surface drawn wherever you like, chosen so the flux out of it is easy to write down.
- name: Electric flux
  aliases: [electric flux, flux out of]
  def: The field passing through a surface, counted as field strength times the area facing it.
- name: Surface charge density
  aliases: [surface charge density, charge per square metre, sigma]
  def: How much charge sits on each square metre of a layer or a plate.
- name: Potential
  aliases: [potential, potential difference, voltage]
  def: The work per unit charge to move between two points, which is why it always belongs to a pair of them.
- name: Equipotential
  aliases: [equipotential, equipotential line]
  def: A line or surface every point of which is at the same potential, so moving along it costs no work.
- name: Capacitance
  aliases: [capacitance, capacitor]
  def: The charge a pair of conductors holds per volt between them, fixed by their shape and spacing.
- name: Dielectric strength
  aliases: [dielectric strength, breakdown field]
  def: The field a material can stand before it stops insulating, about three million volts per metre for dry air.
- name: Breakdown
  aliases: [breakdown, breaks down, flashover]
  def: 'What happens when a field exceeds what the material can hold: a conducting path forms and the charge crosses.'
- name: Marx generator
  aliases: [marx generator, marx, the bank, capacitor bank]
  def: A stack of capacitors charged side by side at a low voltage and then switched into a chain, so their voltages add.
- name: Derivation
  aliases: [derivation, derive, derived]
  def: Getting a result out of a law you already accept, one line at a time, so each line follows from the one above it.
- name: Electromagnetic compatibility
  aliases: [electromagnetic compatibility, emc]
  def: Whether equipment can work beside other equipment without being disturbed by its neighbours' fields.
- name: Impulse
  aliases: [impulse, impulse test]
  def: A single fast pulse of voltage or current, fired deliberately to see what a piece of equipment does about it.
- name: Spark gap
  aliases: [spark gap, gap, gaps]
  def: A deliberate air space set to break down at a chosen voltage, used as a switch that needs no moving parts.
- name: Shunt
  aliases: [shunt, current shunt]
  def: A small precise resistance placed in a current path, so the voltage across it reports the current through it.
- name: Divider
  aliases: [divider, voltage divider]
  def: A pair of impedances that produce a small copy of a large voltage, so an instrument can read it safely.
- name: Down-conductor
  aliases: [down-conductor, down conductor]
  def: The conductor that carries a strike from the top of a structure to the earthing below it.
- name: Grounding grid
  aliases: [grounding grid, earth grid, the grid]
  def: A mesh of copper under the ground, which spreads current entering the earth over as much soil as possible.
- name: Earth resistance
  aliases: [earth resistance, ground resistance]
  def: How many ohms an electrode driven into the soil presents to a steady current spreading away from it.
- name: Impedance
  aliases: [impedance]
  def: What a component opposes a changing current with, which includes its resistance and everything that depends on the rate of change.
- name: Inductance
  aliases: [inductance, self-inductance, inductive]
  def: The property by which a conductor opposes a change in its own current, measured in henries and present even in a straight wire.
- name: Mutual inductance
  aliases: [mutual inductance]
  def: The measure of how much of one circuit's flux passes through another, so that a change in one puts volts across the other.
- name: Time constant
  aliases: [time constant, tau]
  def: The characteristic time a circuit needs to respond, given by resistance times capacitance or by inductance over resistance.
- name: Bandwidth
  aliases: [bandwidth, in band, out of band]
  def: The range of speeds of change an instrument reports honestly; anything faster arrives distorted rather than merely noisy.
- name: Screened room
  aliases: [screened room, screened enclosure]
  def: A room wrapped in conducting sheet so that no outside field reaches what is inside it.
- name: Step potential
  aliases: [step potential]
  def: The difference in ground potential between one foot and the other while current is spreading through the soil.
- name: Nowcast
  aliases: [nowcast]
  def: A very short forecast built from radar returns, giving where a cell is now and where it will be in the next few minutes.
- name: Ampèrian loop
  aliases: [ampèrian loop, amperian loop]
  def: A closed path drawn round a current, chosen so the field is the same everywhere along it.
- name: Lenz's law
  aliases: [lenz's law, lenz]
  def: The rule that an induced current flows in whichever direction opposes the change that caused it.

missions:
  # ---------------------------------------------------------------- day 1
- title: Write the rule before the storm
  objective: Write the crew-clear rule and determine what two old measurements can actually prove.
  briefing: The first cell of the week is on radar. The crew-clear rule is still blank, and last August's trailer failure is still unexplained.
  stake: >-
    Monday. A storm cell is moving toward Station 12 and six people are still working outside. Before the field rises, you must sign the rule that brings them in — and decide whether last year's 25-ohm certificate can explain the trailer that was destroyed.
  takeaway: A criterion written while the cell is overhead is not a criterion.
  segue: >-
    The crew is inside before the field becomes dangerous. Then the old 25-ohm certificate lands beside photographs of six dead circuit cards from the trailer 200 metres away. The certificate measured slow current. The strike rose in about a microsecond. The first clue is not that the certificate was wrong; it is that it answered a different question.
  stops:
  - group: SHOT
    task: Write the launch rule before the field moves
    title: How early is early enough?
    at: launch-board
    reason: >-
      Hal Brenner, the safety officer, has to get this rule signed before the afternoon cell arrives, because a threshold written once the sky is overhead is not a rule at all.
    place: Launch Control
    scene: The operations and safety lead, Hal Brenner, has the afternoon cell on radar and the four field mills on the wall. Three actions must finish before a rocket leaves the rail, and the cell is already moving toward the flat.
    guide: >-
      One rule, written before the cell arrives and held to once the board is released. The walkback takes half an hour from the moment it is called, and by the time the field is at strike conditions everybody has to be behind the bunker already. So the line goes back from strike conditions by that half hour — and not so far back that the pad is cleared for a cell which never built.
    background:
    - >-
      Why the field rather than the radar. The mills report the electric field at the flat, which is what actually determines whether a rocket trailing a wire will trigger a strike. Radar tells you a cell is coming; the field tells you the flat is ready. Only one of those is the launch condition.
    - >-
      What lead time means for each stage. Clearing personnel, arming and launching all have durations, and they are not the same. A threshold set for the longest action is too early for the shortest, which is why there are three numbers to write rather than one.
    - >-
      Why the board is signed first. A threshold adjusted while the cell comes in is not a rule; it is a description of what somebody already decided to do. Committing beforehand is what makes the afternoon attributable to a plan.
    takesAsRead:
    - Charge, and where it sits on a conductor
    assumes:
    - a crew on an open flat has to be walked back before a strike is likely
    - a forecast of where a cell will be is not a promise
    takeaway: A threshold is only useful if the action it triggers can still be finished before the sky arrives.
    format: TRIGGER
    question: >-
      At what surface field do you clear the pad and walk the crew back to the bunker?
    trigger:
      hint: >-
        The walkback takes as long as it takes. Set the field where you want it called, and the afternoon will tell you whether you left yourself the time.
      scale:
        label: Surface field magnitude
        unit: kV/m
        min: 0
        max: 9
        step: 0.1
        anchors:
        - {at: 1.2, means: 'a cell building somewhere over the flats, nothing overhead yet'}
        - {at: 7.0, means: 'strike conditions — the mast is the tallest thing for twenty kilometres'}
      objective: >-
        The crew are behind the bunker before the field reaches strike conditions.
      rehearsal:
        note: the cell that passed over on Tuesday
        stream:
        - {value: 0.9, hoursLeft: 1.5}
        - {value: 2.2, hoursLeft: 1.0}
        - {value: 3.4, hoursLeft: 0.5}
        - {value: 3.0, hoursLeft: 0.2}
        - {value: 2.1, hoursLeft: 0.05}
      conditions:
      - id: clear
        label: Clear the pad and walk the crew back to the bunker
        leadHours: 0.5
        window: {min: 2, max: 4}
        owner: Brenner
        action: nobody left on the flat
      stream:
      - at: 14:10
        update: cell fourteen kilometres out and holding its track
        value: 1.2
        hoursLeft: 1.5
      - at: 14:40
        update: field rising and all four mills agreeing
        value: 3.1
        hoursLeft: 1
      - at: 15:05
        update: anvil edge overhead
        value: 5.2
        hoursLeft: 0.5
      - at: 15:20
        update: field climbing faster than the last two cells did
        value: 6.4
        hoursLeft: 0.2
      - at: 15:30
        update: first natural strike three kilometres north
        value: 7.1
        hoursLeft: 0.05
      release: Hold the rule
      commit: Commit the rule
    answerText: >-
      Call the walkback around 3 kV/m. It fires with the half hour the walk needs still on the clock; every reading after that arrives with less.
    why: A launch rule is a set of promises about time, not about field strength. The field is only the clock face. Each threshold must start an action early enough to finish before the sky becomes dangerous. Setting thresholds late is the natural error. Early calls look wasteful in hindsight, while late calls look acceptable until the one afternoon they fail. Writing the numbers first makes the decision reviewable and separates a criterion from a preference. The numerical threshold in this game is a Station 12 training criterion tied to its own instruments and response time, not general lightning-safety guidance; real field operations use a formal site safety plan and clear personnel from exposure before a thunderstorm is close enough to threaten them.
  - group: FIELD
    task: Read what the mill is actually reporting
    title: What the mill actually knows
    reason: >-
      Mira Halvorsen keeps the mills, and wants today's reading defended on what one instrument can actually see before it goes in the season log.
    place: Field Station
    scene: Field-instruments specialist Mira Halvorsen, the field instruments technician, has the reference mill open on the bench, its shutter turning over the plate. On the wall, all four mills read about −1.2 kV/m, and fair-weather readings carry the same negative sign.
    guide: >-
      All four options are things somebody might want from a mill. Ask of each whether one reading at the ground could contain it. The field under a wide charged sheet does not depend on how high the sheet is. So height drops out, and with it anything that needs height or area. Timing needs a history rather than a reading. That is a limit, not a fault.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.

        why: "The rule exists so this decision is not reinvented under a storm. It was written before the season and states what must be true. Today every stage is satisfied in order, with its required lead time intact. Vero is not claiming that marginal cells are harmless. Her point is narrower: a criterion that nobody uses is not an operating rule. The shot goes. It returns the cleanest waveform of the season so far, and Brenner still has the same rule for the next cell."

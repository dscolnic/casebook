  # ---------------------------------------------------------------- day 5
  - title: The cloud as a capacitor
    objective: Get a capacitance out of the geometry, and see what it is worth.
    briefing: Strand wants the cell modelled as a plate pair before anybody talks about energy.
    stake: >-
      Friday, and Strand has taken over the board in the hall. The station keeps describing the
      cell overhead as though it were a charged plate above a conducting flat, and he wants the
      capacitance of that pair written down before Monday, because on Monday somebody will want
      the energy and the energy needs it. Sifuentes is more interested in what the same model says
      about the trench, where two conductors run parallel for two hundred metres. Today you derive
      a capacitance from a geometry and find out what a dielectric does to it.
    takeaway: Capacitance is a ratio before it is a formula, and the formula is Gauss followed by a line integral.
    stops:
      - group: BANK
        task: Derive the capacitance of the cloud-ground pair
        title: Ten square kilometres, twelve hundred metres up
        place: Impulse Hall
        scene: Strand puts the cell on the board as one plate. Ten square kilometres of charged base sit twelve hundred metres above a flat that conducts well enough to serve as the other plate.
        guide: >-
          Build it a line at a time. Capacitance is charge over potential difference, so
          the route runs through the field: put charge on the plate, get the field
          between them, integrate the field to get the voltage, then divide. Every step
          follows from the one above, and each wrong branch is legal algebra.
        background:
          - >-
              Why a cloud and the ground make a capacitor. Two conductors with charge on one
              and an equal opposite charge on the other, separated by an insulator, is what
              a capacitor is. The flat conducts well enough to serve as the second plate.
              Whether the geometry is a parallel plate is then a question about area against
              separation.
          - >-
              Why ten square kilometres over 1.2 kilometres is close enough. Fringing at the
              edges matters when the separation is comparable with the plate size. Here the
              plate is about three kilometres across and the gap is 1.2 kilometres, so the
              parallel-plate result is an estimate with real error rather than an exact
              answer. Saying which it is matters more than the digits.
          - >-
              What the number is for. Capacitance times voltage is the charge available, and
              half of C times V squared is the energy. Those set what a strike can deliver,
              which is what everything downstream of this stop is trying to survive.
        assumes:
          - the field between oppositely charged plates is σ over ε₀
          - capacitance is the charge held per volt between the conductors
        takeaway: Capacitance depends only on the shape and spacing of the conductors, which is why it can be computed before anything is charged.
        format: DERIVE
        question: Get the capacitance of the cloud-ground pair from its geometry.
        answerText: "C = ε₀A/d = 7.4 × 10⁻⁸ F, about seventy-four nanofarads, out of a geometry alone: no charge and no volts appear in the answer."
        why: "The cloud-ground pair comes out near 74 nF from geometry and ε₀ alone. That is what capacitance means: the geometry fixes the ratio of stored charge to voltage before the system is charged. The derivation starts with Gauss's law for the plate field. The path integral then gives the voltage across the separation. Only after those steps does the ratio Q/V become C. Keeping the factor of two straight between one sheet and two plates is essential. The model is a parallel plate capacitor: area of the plates over plate separation, with the cloud as a plate and the flat as the other."
        derive:
          hint: Field from Gauss, volts from the path, and the ratio at the end.
          start: C = Q/V
          startNote: A = 1.0 × 10⁷ m², d = 1.2 × 10³ m, ε₀ = 8.85 × 10⁻¹² F/m
          goal: the capacitance of the pair, in farads
          askRule: true
          rules:
            - Gauss's law
            - symmetry argument
            - superposition
            - line integral of E
            - rearrangement
            - boundary condition
          steps:
            - ask: Write the field between the plates in terms of the charge on them.
              answer: 0
              candidates:
                - text: E = σ/ε₀ = Q/(ε₀A)
                  rule: Gauss's law
                - text: E = σ/(2ε₀) = Q/(2ε₀A)
                  rule: Gauss's law
                  survives: true
                  why: That is one sheet on its own. Between a pair the two contributions add, and taking the single-sheet value halves the field, halves the volts and doubles the capacitance — all of it clean.
                - text: E = Q/(4πε₀d²)
                  rule: superposition
                  why: The field of a point charge. The plates are wide compared with their spacing, which is the whole reason this model is worth writing down.
                - text: E = Qd/(ε₀A)
                  rule: rearrangement
                  why: The separation has no business in the field between wide plates; it is what turns that field into volts on the next line, and only there.
            - ask: Turn the field into the potential difference across the gap.
              answer: 2
              candidates:
                - text: V = E/d
                  rule: line integral of E
                  why: Volts per metre divided by metres. The units say it immediately and the number it produces — about four hundred — is small enough to look ordinary.
                - text: V = ∫E·dl with E falling off as one over r squared
                  rule: line integral of E
                  why: That is the point-charge integral again. Between wide plates the field does not change across the gap at all, which is what makes the integral a product.
                - text: V = Ed = Qd/(ε₀A)
                  rule: line integral of E
                - text: V = Ed², integrating the uniform field twice
                  rule: rearrangement
                  survives: true
                  why: A clean line with an extra metre in it. It gives a capacitance in farads per metre, which is a real unit and belongs to a different quantity.
            - ask: Form the ratio and put the numbers in.
              answer: 1
              candidates:
                - text: C = Q/V = ε₀A·d = (8.85 × 10⁻¹²)(1.0 × 10⁷)(1.2 × 10³)
                  rule: rearrangement
                  why: The separation has ended up multiplying. A wider gap holds more charge per volt, which is backwards, and the number is a hundred million times too big.
                - text: C = Q/V = ε₀A/d = (8.85 × 10⁻¹²)(1.0 × 10⁷)/(1.2 × 10³)
                  rule: rearrangement
                - text: C = V/Q = d/(ε₀A)
                  rule: rearrangement
                  survives: true
                  why: "The reciprocal, and it solves perfectly well: 1.4 × 10⁷ of something. Farads are charge per volt, and this is volts per coulomb, which is a stiffness rather than a capacitance."
                - text: C = ε₀/(Ad)
                  rule: rearrangement
                  why: Both geometric quantities have gone to the bottom. Doubling the area of a capacitor does not halve what it holds.
          commit: Commit the derivation
      - group: EARTH
        task: Work out what the trench pair does
        title: Two conductors, two hundred metres
        concept: Capacitance as a ratio, before it is a formula
        place: Cable Trench
        scene: The armoured signal cable and bare copper earth conductor run side by side for two hundred metres, forty centimetres apart. Neither is connected to the other. Lauwers wants the pair treated as two conductors before anyone calls the trench electrically quiet.
        guide: >-
          Treat the pair as what it is and put a number on it. Capacitance is charge divided
          by the voltage that charge produces, so pick the charge the injection test moved
          onto the earth conductor and the voltage it reached. One tile is the length of the
          run, which is what the answer scales with rather than part of the ratio.
        background:
          - >-
              Why a ratio and not a formula. Capacitance is defined as charge over potential
              difference, whatever the shape of the conductors. The geometry formulas for parallel
              plates and coaxial cables are consequences of that definition for particular shapes,
              and a trench is neither of those shapes.
          - >-
              What it means for the trench. Two conductors with a capacitance between them exchange
              current whenever the voltage between them changes, and a strike changes it in
              microseconds. No metallic connection is required, and none of the continuity tests
              anybody runs would find the path.
          - >-
              Why the length matters. Capacitance per metre is set by the spacing and the material
              between; the total is that figure times the run. Two hundred metres of trench is a
              couplant nobody drew on the schematic, and shortening the parallel run is the only
              intervention that reduces it.
        assumes:
          - any two conductors separated by an insulator have a capacitance between them
        takeaway: Conductors can exchange transient electrical influence without a direct metallic connection.
        format: BALLPARK
        question: What is the capacitance between the two conductors in the trench?
        answerText: About 2.4 nanofarads over the 200 m run — small until you notice that a strike changes the voltage across it in microseconds, which is when it starts passing amps.
        why: "Capacitance is C = Q / V, a ratio before it is a formula. The injection test pushed 1.2 microcoulombs onto the earth conductor and the pair reached 500 V, so C = 1.2 × 10⁻⁶ ÷ 500 = 2.4 nF over the whole 200 m run — about 12 picofarads a metre, which is what the spacing and the soil between them give. Two things follow. Nothing is connected, so no continuity test finds this path, and it is the path anyway: the current through a capacitance is C dV/dt, and a strike changes the voltage between these conductors by tens of kilovolts in a couple of microseconds. Put those numbers together and the trench passes tens of amps into a signal cable that nobody wired to anything. And the length is the lever — the capacitance is per metre, so the only intervention that reduces it is running less of the pair in parallel."
        estimate:
          prompt: The injection test moved 1.2 microcoulombs onto the earth conductor, and the pair reached 500 V. The parallel run is 200 m.
          question: Choose the charge moved and the voltage it produced.
          labels:
            - 1.2e-6  (Q, the charge moved, in coulombs)
            - 500  (V, the voltage the pair reached)
            - 200  (the length of the parallel run, in m)
            - 0.4  (the spacing between the conductors, in m)
            - 25  (the rod's resistance, in ohms)
          values: [0.0000012, 500, 200, 0.4, 25]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 2.4e-9
          tolerance: 2e-10
          units: farads (about 2.4 nF)
          solution: 1.2 × 10⁻⁶ ÷ 500 = 2.4 × 10⁻⁹ F, which is 2.4 nF over 200 m, or about 12 pF a metre.
          explanation: A capacitance nobody wired. The current through it is C dV/dt, and a strike supplies the dV/dt.
          givens:
            - 1.2 microcoulombs moved, 500 V reached
            - 200 m of parallel run at 0.4 m spacing
          relationship: Capacitance is the ratio C = Q / V — the charge moved divided by the potential difference it produces, before any geometry formula.

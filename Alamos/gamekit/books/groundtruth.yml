    task: Estimate the charge the stroke moved
    title: How much charge did the stroke move?
    reason: >-
      Emil Strand wants August's stroke written in coulombs as well as kiloamps, so the hall's comparison test has a real number to aim at.
    place: Impulse Hall
    scene: Strand wants the August stroke written in coulombs as well as kiloamps. The clamp recorded a 30 kA peak and the current stayed near that scale for about 100 microseconds. The hall comparison is waiting on the number.
    guide: >-
      Five numbers, and three of them belong to other parts of the event. The rise time of the front. The earth resistance. The energy in the impulse store. Ask of each whether charge depends on it. Peak current, total charge and rise time describe different things. The front controls induced voltage. The duration controls how much charge moves.

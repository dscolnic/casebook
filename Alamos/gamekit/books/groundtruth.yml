    question: Why is a criterion written afterwards worth so much less than the same words written before?
    why: People reconstruct decisions after learning how events ended, often without realizing it. A clean shot makes its launch threshold look more reasonable. A cautious hold followed by nothing makes caution look more reasonable. Neither memory is dishonest, but neither is an unbiased test. Writing the criterion first lets every launch and hold be judged against the same rule. Only then can the season test whether the rule works, instead of quietly changing the rule to fit the outcomes.

        label: True peak current
        min: 25
        max: 35
        step: 0.1
        unit: kA
        truth: 30
      - id: rod_offset
        label: Shared earth-reference offset
        min: -5
        max: 4
        step: 0.1
        unit: kA
        truth: -0.7
      firstObservable:
        label: Rod-referenced shunt mean
        target: 29.3
        tolerance: 0.25
        unit: kA
      secondObservable:
        label: Independent magnetic clamp
        target: 30
        tolerance: 0.5
        unit: kA
      truth:
        a: 30
        b: -0.7
      tolerance:
        a: 0.5
        b: 0.5
      answerTolerance: 0.5
      locus:
      - a: 26
        b: 3.3
      - a: 28
        b: 1.3
      - a: 30
        b: -0.7
      - a: 32
        b: -2.7
      - a: 34
        b: -4.7
      second:
        label: Second measurement
        locus:
        - a: 30
          b: -4
        - a: 30
          b: -0.7
        - a: 30
          b: 3
    answerText: Before the clamp, several true-current and shared-offset pairs fit the rod-referenced readings. The independent 30 kA clamp selects a true peak near 30 kA and leaves the common reference offset as the shared nuisance term.
    why: The three single-ended channels share a nuisance term from the moving earth reference, so their average cannot by itself determine the true peak. The Rogowski clamp uses different physics and no earth reference. Its 30 kA reading therefore constrains the true current independently and leaves the shared offset as a nuisance parameter. The gain is not another decimal place; it is a measurement that can break the degeneracy.
  # ---------------------------------------------------------------- day 8
- title: What 30 kA does two metres away
  objective: Use Ampère's law to find the magnetic field beside the mast and Faraday's law to determine what a rapid field change can drive in nearby loops.
  briefing: Thirty kiloamps is not dangerous to electronics merely because the magnetic field is large. The question is how fast that field changes and how much loop area the wiring gives it.
  stake: >-
    Wednesday. A cabinet sits two metres from the down-conductor, and the first part of the trailer cable route runs through the same magnetic field. Before anyone moves hardware, calculate what the strike can actually drive in a nearby loop.
  takeaway: A current does not stay in its conductor as far as anything nearby is concerned.
  segue: >-
    At two metres the peak field is about 3 mT. That alone does not condemn the cabinet. But if it arrives in about two microseconds, a 0.1 m² circuit loop can see roughly 150 V. Lauwers pulls out the trench drawing. The loop that reaches the trailer is not 0.1 m². Its two long sides run beside the mast for forty metres.
  stops:
  - group: MAST
    task: Derive the field around the down-conductor
    title: How strong is the field at the cabinet?
    at: cabinet
    reason: >-
      Owen Tate needs the field at the cabinet computed before he signs off on moving it, since the job sheet has to say why two metres was never far enough.
    place: Mast Base
    scene: |-
      Thirty kiloamps down a single vertical conductor, and a steel cabinet two metres from it. Tate wants the field at the cabinet in a unit he can compare with something.
    guide: >-
      Build it a line at a time. Ampère's law relates the field around a closed loop to the current through it. Choose a circle centred on the conductor and the symmetry makes the integral trivial. Evaluate at two metres and give the answer in tesla, so it can be compared with something familiar.
    background:
    - >-
      Why a circle. The field around a long straight conductor circles it, with the same magnitude everywhere at a given radius. So the line integral around a concentric circle is the field times the circumference, and Ampère's law hands you the field in one step. Any other loop gives the same physics and much worse algebra.
    - >-
      What to compare it with. The Earth's field is about fifty microtesla. A steel cabinet two metres from thirty kiloamps sits in something far larger for a few microseconds, which is why the cabinet's contents care and why the comparison is the useful part of the answer.
    - >-
      Why the peak matters rather than the average. The field follows the current instant by instant, so the number worth quoting is at the peak. It is also the moment the induced voltages downstream are largest, which is the subject of the trench-loop stop later in the fortnight.
    takesAsRead:
    - Current as a flow, and current density
    assumes:
    - the circulation of the magnetic field around a closed path counts the current through it
    - the field of a long straight conductor circles it
    takeaway: Choosing a path the field is constant along is what turns Ampère's law from a statement into a number.
    format: DERIVE
    question: Get the magnetic field two metres from the down-conductor while the strike is at its peak.
    answerText: "B = μ₀I/(2πr) ≈ 3.0 × 10⁻³ T: about 3 mT at two metres for a 30 kA peak, roughly sixty times Earth's field for a brief instant."
    why: At two metres, a 30 kA current gives about 3.0 mT in the long-straight-conductor approximation. The value itself does not prove the cabinet will fail. What matters for nearby circuits is how quickly the field changes, because Faraday's law turns dB/dt and loop area into induced voltage. That is why the next calculation uses the rise time rather than treating “3 mT” as a damage threshold.
    derive:
      hint: Choose the path first, and say what licenses taking B outside the integral.
      start: ∮B·dl = μ₀I_enc
      startNote: I = 3.0 × 10⁴ A at the peak, r = 2.0 m, μ₀ = 4π × 10⁻⁷ T·m/A
      goal: the magnetic field at the cabinet, in tesla
      askRule: true
      rules:
      - Gauss's law
      - symmetry argument
      - superposition
      - line integral of E
      - rearrangement
      - boundary condition
      steps:
      - ask: Choose the path to go round.
        answer: 2
        candidates:
        - text: a square loop of side 2 m centred on the conductor
          rule: symmetry argument
          survives: true
          why: The law holds for it and the enclosed current is the same, so the equation is true — and B is not constant along a square, so it cannot come out of the integral and the line leads nowhere.
        - text: a straight path from the conductor out to the cabinet
          rule: line integral of E
          why: Ampère's law is about a closed path. An open one encloses no area and there is no current through it to count.
        - text: a circle of radius 2 m centred on the conductor
          rule: symmetry argument
        - text: a closed surface around the base of the mast
          rule: Gauss's law
          why: That is the other law. A surface counts flux out of it; this one needs a path with a current threading it.
      - ask: Write the circulation along that path.
        answer: 0
        candidates:
        - text: ∮B·dl = B(2πr)
          rule: symmetry argument
        - text: ∮B·dl = B(πr²)
          rule: rearrangement
          survives: true
          why: An area where a length belongs. It solves cleanly and gives a field in tesla per metre, and at r = 2 the two numbers are close enough that the answer looks ordinary.
        - text: ∮B·dl = B(2πr)cos θ, carrying the angle
          rule: symmetry argument
          why: The angle between B and dl is genuinely in the definition, and on this path it is zero everywhere. Carrying it is correct and unfinished.
        - text: ∮B·dl = B(4πr²)
          rule: Gauss's law
          why: The area of a sphere, borrowed from the electrostatic problem. Nothing here is a sphere and nothing here is a surface.
      - ask: Set it equal to the enclosed current and solve.
        answer: 1
        candidates:
        - text: B = μ₀I(2πr)
          rule: rearrangement
          why: The path length has moved to the top. It gives a field that grows with distance, which would make the far side of the compound the dangerous place.
        - text: B = μ₀I/(2πr)
          rule: rearrangement
        - text: B = I/(2πrμ₀)
          rule: rearrangement
          survives: true
          why: μ₀ inverted. The line is consistent and the answer is 1.9 × 10⁹, which reads as a large number in a domain where large numbers are normal.
        - text: B = μ₀I/(4πr²)
          rule: superposition
          why: That is the Biot–Savart contribution of a single current element, not the total for a long conductor. Integrating along the whole wire is what removes the square.
      commit: Commit the derivation

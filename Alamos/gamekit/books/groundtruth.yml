    assumes:
    - an insulator contains charge that can shift slightly without leaving its molecules
    takeaway: The material between conductors changes the relationship between stored charge and voltage.
    format: CHOICE
    question: Why does filling the gap with polyethylene raise the capacitance?
    why: A dielectric polarizes in an electric field. Bound positive and negative charge shift slightly in opposite directions, creating a field that opposes the applied field. For the same free charge, the net field and voltage fall. Because C = Q/V, capacitance rises by the material's dielectric factor, about 2.3 for polyethylene here. Polyethylene also has a larger dielectric strength than air. That separate property lets the cable survive a larger field before electrical breakdown begins.
    choices:
    - Its charge shifts against the field, so the volts fall
    - The plastic conducts slightly, which increases the effective plate area
    - Solid insulation lets the conductors sit closer together in the cable
    - Polyethylene stores charge of its own in addition to the plates
    answer: Its charge shifts against the field, so the volts fall
    rebuttals:
    - Conduction would discharge the pair rather than improve it; a good dielectric conducts as little as possible.
    - Geometry is a separate effect and these two samples are built to the same dimensions.
    - The dielectric holds no net charge; what it does is displace what it already has.
  # ---------------------------------------------------------------- day 6
- title: What 1,500 joules can do
  objective: Derive the bank energy, decide what physically proves the bank is discharged, and state what a repeatable impulse can test.
  briefing: Twelve capacitor stages can sit charged after the supply is off. A meter and a switch are not the same thing as a visible discharge path.
  stake: >-
    Monday of week four. The impulse bank will be charged to 50 kV while technicians work behind the barrier. Before anyone enters, you must derive how much energy is stored and decide what evidence actually proves the bank is safe.
  takeaway: The energy in a capacitor is the work done against the voltage that was already there, which is where the half comes from.
  segue: >-
    The bank stores 1,500 J, and the safe state is a discharge path that can be seen at the bank itself. The hall can reproduce a chosen front and waveform, but not every feature of a real strike. That makes it the right place to test a mechanism — if the station can first trust the current record it is trying to reproduce.
  stops:
  - group: BANK
    task: Derive the energy stored in a charged capacitor
    title: Why is the energy only half of CV²?
    at: bank-stages
    reason: >-
      Josefa Ruiz sets the stage every shot and wants the number on the placard finally derived instead of trusted, since she is the one who repeats it eleven hundred times a season.
    place: Impulse Hall
    scene: "Impulse-hall technician Ruiz, the impulse hall technician, sets one stage on the bench: 100 nF charged to 50 kV. The bank placard says 1,500 J for twelve stages, and Strand wants the number derived rather than trusted."
    guide: >-
      Build it a line at a time. Energy stored is the work done charging the capacitor, and the work of moving each increment of charge is V dq. The voltage rises as the charge accumulates, so this is an integral rather than a product. Finish with joules for one stage, so the placard can be checked.
    background:
    - >-
      Why not simply QV. Pushing the last coulomb on costs the full final voltage; the first one costs almost nothing. Integrating V dq with V = q/C gives half of QV, and the missing half is the reason a placard that quotes QV is out by a factor of two.
    - >-
      Where the placard number comes from. Twelve stages at the derived energy each gives the total. If that does not match the printed 1,500 joules, either the placard is quoting a different charging voltage or somebody used the wrong formula. Deriving it is how you find out which.
    - >-
      Why it matters on the bench. The energy in one stage is what a person standing beside it would receive if it discharged through them. A factor of two on that number is the difference between two safety categories, which is why Strand wants it derived rather than trusted.
    assumes:
    - moving charge onto a capacitor takes work against the voltage already across it
    - the voltage across a capacitor is proportional to the charge on it
    takeaway: Charging is done against a voltage that grows as you go, so the work is an integral and not a product.
    format: DERIVE
    question: Work out the energy stored in one stage of the bank.
    answerText: U = ½CV² = 125 J a stage, so 1,500 J across the twelve. The half is what the integral gives, because the first charge crosses no voltage and the last crosses all of it.
    why: One 100 nF stage at 50 kV stores 125 J, so twelve stages store 1,500 J. The factor of one-half is not a convention. As charge is added, the capacitor voltage rises from zero to its final value. Early charge crosses little voltage; the last increment crosses almost all of it. Integrating V dq therefore uses an average voltage of one-half the final value. Dropping that factor doubles the energy and turns a derivation into a dangerous overestimate.
    derive:
      hint: Write the work to add one more charge, then add up all of them.
      start: dU = V dq
      startNote: one stage is C = 100 nF, charged to V = 5.0 × 10⁴ V
      goal: the energy stored in one stage, in joules
      askRule: true
      rules:
      - Gauss's law
      - symmetry argument
      - superposition
      - line integral of E
      - rearrangement
      - boundary condition
      steps:
      - ask: Write the voltage in terms of the charge already on the plates.
        answer: 1
        candidates:
        - text: dU = V dq with V the final voltage, so U = QV
          rule: boundary condition
          survives: true
          why: This is the whole trap of the derivation and it produces a clean, wrong answer twice the true one. The first charge crosses no voltage at all; only the last one crosses the full fifty kilovolts.
        - text: dU = (q/C) dq
          rule: rearrangement
        - text: dU = (C/q) dq
          rule: rearrangement
          why: Inverted. It integrates to a logarithm, which is a respectable-looking result and has units of farads rather than of joules.
        - text: dU = (Q/C) dq
          rule: boundary condition
          why: Q is the final charge and q is what is on the plates as you go. Using the final value inside the integral is the same error as the first line, written in charge rather than in volts.
      - ask: Integrate from empty to the final charge.
        answer: 2
        candidates:
        - text: U = Q²/C
          rule: rearrangement
          why: The integral of q dq is q²/2, and the two has been lost. This is exactly the factor the derivation exists to produce.
        - text: U = ∫₀^Q (q/C) dq = Q²/(2C²)
          rule: rearrangement
          survives: true
          why: A second C has appeared from the integration, which it cannot. The line is algebraically consistent and the units are joules per farad.
        - text: U = ∫₀^Q (q/C) dq = Q²/(2C)
          rule: rearrangement
        - text: U = ∫₀^Q (q/C) dq = QC/2
          rule: rearrangement
          why: Multiplying by C rather than dividing. Charge times capacitance is not an energy in any system of units.
      - ask: Write it in terms of the voltage and put the numbers in.
        answer: 0
        candidates:
        - text: U = ½CV² = ½(100 × 10⁻⁹)(5.0 × 10⁴)² = 125 J
          rule: rearrangement
        - text: U = ½CV = ½(100 × 10⁻⁹)(5.0 × 10⁴) = 2.5 × 10⁻³ J
          rule: rearrangement
          why: One factor of V short. Two and a half millijoules for a bank that can punch a hole through a metre of air is the kind of answer worth stopping at.
        - text: U = ½C²V = ½(100 × 10⁻⁹)²(5.0 × 10⁴)
          rule: rearrangement
          survives: true
          why: The square has moved from the volts to the farads. It is a clean substitution of Q = CV into the wrong slot, and nothing later in the arithmetic complains.
        - text: U = CV² = (100 × 10⁻⁹)(5.0 × 10⁴)² = 250 J
          rule: boundary condition
          why: The half again, dropped at the last line rather than the first. Twice the energy, and the placard on the barrier would be wrong in the dangerous direction.
      commit: Commit the derivation
  - group: MAST
    task: Say what the earthing stick is for
    title: Is the bank actually safe?
    reason: >-
      Josefa Ruiz keeps the barrier shut until the earthing stick is visibly on, and wants the reason for that rule spelled out in the same terms as the energy above it.
    place: Mast Base
    scene: Ruiz keeps the barrier closed even after the supply is off and the meter reads zero. The earthing stick must be connected to the bank and visibly left in place before anyone enters the hall.
    guide: >-
      Five signed statements about the state of the hall, and two verifications. Each one is somebody's record rather than a condition you have seen, so decide which would hurt most if the paper were wrong and check those. A claim can only be held once it has been verified, and holding everything critical is not caution here.
    background:
    - >-
      Why a meter reading zero is not a discharged bank. A panel meter reads what its own circuit sees, and a bank whose bleed path has failed can sit at full charge behind an open contactor with nothing on the front panel to say so. The stored energy is ½CV², and it does not decay because the supply was switched off.
    - >-
      What the stick actually provides. A visible, mechanically held connection between the bank terminal and earth — the discharge path itself, not a statement about one. Its whole point is that it can be seen from the door by somebody who read no paperwork.
    - >-
      Why the switch position is the weakest kind of evidence. An isolator handle records what somebody moved, and a contactor that has welded shut moves nothing while showing the same handle position. The condition and the record come apart exactly there.
    assumes:
    - a capacitor holds its charge once the supply is removed
    takeaway: Stored electrical energy can remain after its source is removed, so a safe state requires a controlled discharge path.
    format: ATTEST
    question: Which of these signed claims about the hall cannot be held, given what the evidence actually supports?
    answerText: The bleed-resistor claim and the isolator claim. Neither has been verified against the bank's own terminals, and both are what the earthing stick exists to make unnecessary.
    why: 'The hall is safe when there is a discharge path somebody can see, not when the paperwork says the supply is off. Two of these claims are critical and unbacked. The bleed resistor is signed off on a 2019 commissioning sheet, and a bleed path that has failed open leaves the bank at full charge with a panel meter reading zero — the meter''s circuit and the bank''s terminals are not the same node. The isolator claim records a handle position, and a welded contactor holds the same handle while passing current. Two others are critical and genuinely backed: the earthing stick is visible from the door, which is the point of it, and the terminal voltage was measured directly this morning at the bank rather than inferred from the panel. The stored energy is ½CV² and nothing about switching the supply off removes it. That is why the safe state is a connection you can see and not a signature you can read.'
    attest:
      checks: 2
      moral: A signature records who is answerable. The earthing stick is the only item on this list that is a condition rather than a claim about one.
      claims:
      - id: stick
        label: The earthing stick is connected to the bank terminal and left in place
        signedBy: Tate, rigger
        evidence: Visible from the door, mechanically clamped, tag attached
        critical: true
        backed: true
      - id: terminal
        label: The bank terminals read under 5 V
        signedBy: Ruiz, this morning
        evidence: Measured at the terminals with a calibrated probe at 08:40 today
        critical: true
        backed: true
      - id: bleed
        label: The bleed resistors discharge the bank within 90 seconds
        signedBy: commissioning sheet, 2019
        evidence: No test since installation; a failed bleed path is open-circuit and silent
        critical: true
        backed: false
      - id: isolator
        label: The supply isolator is open and locked
        signedBy: shift log
        evidence: Records a handle position; a welded contactor holds the same position
        critical: true
        backed: false
      - id: meter
        label: The panel meter reads zero
        signedBy: control desk
        evidence: Reads its own circuit, which is not the bank terminals
        critical: false
        backed: true
  - group: SHOT
    task: Decide what the impulse test can and cannot stand in for
    title: What can the hall reproduce honestly?
    reason: >-
      Emil Strand can fire the bank on any afternoon he chooses, while Adeyinka Vero would rather wait for a real cell, and the season's waveform library depends on which one gets recorded.
    concept: "Instrument bandwidth: what a slow instrument cannot see"
    place: Launch Control
    scene: |-
      Strand can fire the bank into the mast on any afternoon, with a rise time he chooses. Vero would rather wait for a cell. Kaya has to write down which of the two the season's waveform library is built from.
    guide: >-
      Four things the hall might offer that a natural stroke cannot. Ask of each whether the hall's advantage is control or magnitude. The hall chooses the moment and the shape, every time. A natural stroke varies from event to event, and that variation is what the station exists to measure. So the library needs both kinds labelled, or calibration data pass as weather.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
    assumes:
    - an instrument is calibrated against a signal whose shape is known
    takeaway: "Calibration data and natural-event data answer different questions: repeatability versus real-world variation."
    format: CHOICE
    question: What can the hall's impulse do for the station that a triggered strike cannot?
    why: "The impulse hall gives a signal whose timing and waveform are chosen in advance. That makes repeated calibration possible. A natural triggered stroke is different: its peak, rise time and number of strokes vary from event to event. Those variations are exactly what the station exists to measure. The hall can therefore test response and timing under repeatable conditions. It cannot replace the weather record. The library needs both kinds of shot labelled clearly so calibration data never masquerade as atmospheric data."
    choices:
    - Arrive at a known moment with the same shape every time
    - Reach the peak currents that a natural return stroke reaches
    - Reproduce the variation between one stroke and the next
    - Test the whole current path from the tip to the soil
    answer: Arrive at a known moment with the same shape every time
    rebuttals:
    - Peak current in the hall is a fraction of a natural stroke, which is one reason the hall cannot replace it.
    - Variation is precisely what a repeatable pulse does not have.
    - The hall's pulse enters at the base, so it never tests the tip or the channel above it.
  # ---------------------------------------------------------------- day 7
- title: Four instruments agree. Do they?
  objective: Trace the measurement references behind last August's current record and determine what the independent channel actually establishes.
  briefing: The neatest number in the report may be the least independent.
  stake: >-
    Tuesday. The review draft calls last August's peak current “confirmed” because four channels agree near 30 kA. If three of them share the same moving reference, the station may have counted one measurement three times.
  takeaway: Instruments that share a reference share its errors, and their agreement measures nothing.
  segue: >-
    Three channels use the same single-ended earth reference; the Rogowski clamp does not. The independent clamp keeps the peak near 30 kA, but the agreement is no longer four witnesses. More important, the earth rod cannot be treated as a perfect zero during a strike. The trailer mystery now has to be solved with geometry and independent measurements, not with a comforting average.
  stops:
  - group: MAST
    task: Find the reference the agreeing channels have in common
    title: Four readings, one reference
    at: shunt-rack
    reason: >-
      Kenji Nakata owns these shunts and does not like how neatly three readings agree, since neat agreement from instruments sharing one reference is not independent confirmation of anything.
    place: Mast Base
    scene: |-
      Five records exist for strike S-114. Three current channels were digitised single-ended against the same earth rod; a Rogowski clamp measured current magnetically; a camera counted strokes. Nakata, the current measurement engineer, wants the dependency chain opened before anyone averages the peaks.
    guide: >-
      Open a channel and the panel shows what its reading was referred to. Tick the ones that would still stand if a shared reference were wrong, and untick the rest. Then name the piece they have in common. Four records agreeing is not four independent measurements, and both halves of this are graded.
    background:
    - >-
      Why agreement is not independence. Four peak currents computed through the same rod reference will agree with each other whatever that reference does, because the error is common to all of them. Averaging them narrows the scatter and does nothing about the bias, which is the most convincing way to be wrong.
    - >-
      What the fifth record is doing. A stroke count is not a current, so it cannot be averaged with the others. It is on the board because it does not pass through the suspect step, which makes it worth more than any of the four for this particular question.
    - >-
      Why naming the shared piece is the answer. Once the common reference is identified it can be corrected, and every dependent record moves together. Withdrawing the average instead leaves the same error in place and tells the review that nothing is known.
    takesAsRead:
    - Current as a flow, and current density
    assumes:
    - a measurement is made against something, and that something can be wrong
    takeaway: A number quoted three times from one reference is one number, however many instruments produced it.
    format: TRACE
    question: Four of these five report the same peak. Open them, keep whatever still stands on its own, and name what they have in common.
    trace:
      hint: Open a channel to see what its reading was referred to. Tick the ones that would survive if a shared reference were removed, then name the reference.
      channels:
      - id: shuntTop
        label: Upper shunt at 45 m
        reading: 28 kA
        depends:
        - rod
        - rack
      - id: shuntMid
        label: Middle shunt at 30 m
        reading: 29 kA
        depends:
        - rod
        - rack
      - id: divider
        label: Base divider
        reading: 31 kA equivalent
        depends:
        - rod
      - id: rogowski
        label: Clamp around the lead
        reading: 30 kA
        depends: []
      - id: camera
        label: High-speed camera
        reading: three strokes down one channel
        depends: []
      resources:
      - id: rod
        label: The single earth rod used as the three single-ended digitiser references
      - id: rack
        label: The instrument rack supply at the base
      independent:
      - rogowski
      - camera
      target: rod
      commit: Name the shared reference
    answerText: The shared source is the single-ended earth reference used by three electrical channels. The Rogowski clamp does not use that reference, so its ~30 kA peak is genuinely independent evidence.
    why: 'A properly isolated differential shunt would reject motion of a common reference. These three channels were not wired that way: their digitizers were single-ended against the same earth rod. Motion of that reference can therefore shift all three together and make agreement look independent when it is not. The Rogowski clamp senses magnetic field around the conductor and needs no earth reference, so it provides a genuinely different dependency chain.'
  - group: EARTH
    task: Work out what the rod does during a strike
    title: What if “ground” moves?
    reason: >-
      Ana Sifuentes flagged the shared earth rod first, and wants it settled whether that reference can even hold still while a strike current runs through it.
    place: Earthing Compound
    scene: |-
      Sifuentes draws the earth rod as a real impedance instead of the zero-volt symbol used on the schematic. The April test measured 25 Ω at low frequency; the strike drives tens of kiloamps on a microsecond time scale.
    guide: >-
      Four readings of what the rod does during a strike. Ask of each whether the earth is being treated as a conductor with resistance, or as a fixed zero. Push current through a resistance and a potential difference appears, for as long as it lasts. Everything on the site calls that potential zero. Whether that matters depends on how many places are earthed.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
    assumes:
    - a resistance carrying current has a voltage across it
    takeaway: An electrical reference is only a chosen zero; real resistance can make that reference move when large current flows.
    format: CHOICE
    question: What happens to the potential of the earth rod while the strike current is flowing?
    why: |-
      The earth rod cannot remain at exactly zero potential while current is driven into the soil. If you naively multiplied the 25 Ω low-frequency value by 30 kA, you would get 750 kV — enough to prove that “ground” is not a fixed reference, but not a valid prediction of the lightning transient. The true fast ground-potential rise depends on frequency-dependent impedance, geometry, soil behaviour and current distribution. The measurement lesson is the important one: a reference node that can move cannot be assumed to be an absolute zero.
    choices:
    - It rises with the current, and so does the rack
    - It stays at zero, which is what makes it a reference
    - It falls, because current is being drawn away from it
    - It oscillates around zero at the frequency of the stroke
    answer: It rises with the current, and so does the rack
    rebuttals:
    - Zero is a choice of reference and holds only while no current is flowing through it.
    - Current is being pushed in rather than drawn away, and either direction produces a rise in magnitude.
    - A stroke is a single unipolar pulse rather than an oscillation, so the rise does not swing about zero.
  - group: SHOT
    task: Match the rod-referenced peak with more than one true-current and reference-offset pair, then add the independent clamp.
    title: What does the independent clamp settle?
    at: record-desk
    reason: >-
      Yusuf Kaya has three shunt peaks and one clamp reading for the funding review, and needs one defensible number instead of three copies of the same possible error.
    place: Launch Control
    scene: Yusuf Kaya has three rod-referenced shunt peaks at 28, 29 and 31 kA, plus a 30 kA clamp reading. The review wants one peak, but the three shunts still share the same moving earth reference.
    guide: >-
      Two controls slide along a family of solutions that fit the shunt mean equally well. Find out how wide that family is before deciding anything. Then bring in the clamp reading, which does not share the shunts' earth reference, and watch what it does to the family. Report the peak when the data supports one rather than several.
    background:
    - >-
      Why three shunts do not settle it. All three are referenced to the same moving earth, so a shift in that reference moves all three together. The mean of 28, 29 and 31 is therefore consistent with a range of true peaks paired with a range of offsets — one equation, two unknowns.
    - >-
      What the clamp brings. It measures the current a different way, without the rod reference. So it constrains the same true peak through a different combination of unknowns, and where the two constraints cross is the answer. That is why one independent measurement is worth more than three more shunts.
    - >-
      Why saying 'several' is a legitimate answer for a while. Reporting a single peak from the shunts alone would be reporting a number the data does not contain. The honest intermediate answer is the family, and the professional move is to go and get the measurement that collapses it.
    assumes:
    - an average of several readings is only better than one if they are independent
    takeaway: A shared reference can trade off against the true signal; an independent measurement can collapse that ambiguity.
    format: DEGENERACY
    question: How many true peak currents fit the shunts before the independent clamp is added?
    degeneracy:
      hint: First fit the rod-referenced shunt mean with several combinations. Then add the clamp, which does not use the earth rod.

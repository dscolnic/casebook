  - title: The last thing that can be changed
    objective: Set the bank for the season's final test, and say what it will show.
    briefing: After today the hall is committed and the sky is whatever it is.
    stake: >-
      Thursday, and this is the last day anything can be altered. The final impulse test runs
      tomorrow at whatever setting is agreed this afternoon, one gap service is left, and the
      review pack closes on whatever it returns. Emil Strand wants twelve stages at fifty
      kilovolts, which is what the hall has fired eleven hundred times. Ingrid Lauwers wants the
      front shortened at the same peak instead, which tests Tuesday's coupling number rather than
      confirming the placard. Today you work out what twelve stages in series actually produce,
      choose what the last shot is for, and fix what the report will recommend to a station
      nobody here has visited.
    takeaway: A test that repeats what is already known spends the same time as one that could come out either way.
    stops:
      - group: BANK
        task: Derive the output of the twelve-stage bank
        title: In parallel to charge, in series to fire
        place: Impulse Hall
        scene: |-
          Twelve stages, each a hundred nanofarads, all charged side by side to fifty kilovolts. When the gaps break down they are in a chain instead. Ruiz wants the output written before the setting is agreed.
        guide: >-
          Build it a line at a time. The stages charge side by side and fire in a chain,
          so the charging voltage and the output voltage are different questions. Work
          out what the chain delivers, then the series capacitance, then check the
          stored energy against the parallel case. The energy has to agree, and that
          check is the point.
        background:
          - >-
              Why parallel to charge and series to fire. In parallel every stage sees the
              same supply, so a modest supply can charge all twelve. When the gaps break
              down the stages are connected end to end, so their voltages add. That is a
              Marx generator, and it is how a fifty-kilovolt supply produces six hundred
              kilovolts.
          - >-
              What happens to the capacitance. Capacitors in series combine reciprocally, so
              twelve hundred-nanofarad stages in a chain behave as one stage of about eight
              nanofarads. Voltage up by twelve, capacitance down by twelve.
          - >-
              Why the energy check is the real answer. Half C V squared with the series
              values gives the same total as twelve individual stages did while charging,
              because nothing has been created. Any answer where the energy grows has an
              arithmetic error in it, and the check will find it before the setting is
              agreed.
        assumes:
          - capacitors in series carry the same charge and their voltages add
          - the reciprocals of series capacitances add
        takeaway: Switching from parallel to series multiplies the voltage by the number of stages and divides the capacitance by it, and the energy does neither.
        format: DERIVE
        question: Work out what the bank delivers when the gaps fire, and check it against the energy.
        answerText: 600 kV from a series capacitance of 8.3 nF, holding the same 1,500 J the twelve stages held separately. Twelve times the voltage, a twelfth of the capacitance, and the energy unchanged.
        why: When the twelve stages fire in series, the bank produces about 600 kV and an effective capacitance near 8.3 nF. Those values still store the same 1,500 J present before firing. The switching network does not create energy. It trades capacitance for voltage by the stage count. That is the key check on the derivation. A Marx generator can therefore reach hundreds of kilovolts even though no individual charging supply ever exceeds 50 kV.
        derive:
          hint: Series capacitance first, then the voltage, then check the energy against day six.
          start: n = 12 stages, each C = 100 nF charged to V₀ = 50 kV
          startNote: in parallel while charging, in series once the gaps break down
          goal: the output voltage, the series capacitance and the stored energy
          askRule: true
          rules:
            - Gauss's law
            - symmetry argument
            - superposition
            - line integral of E
            - rearrangement
            - boundary condition
          steps:
            - ask: Write the capacitance of the twelve in series.
              answer: 1
              candidates:
                - text: C_s = nC = 1200 nF
                  rule: rearrangement
                  survives: true
                  why: That is the parallel result, which is correct for the charging arrangement and wrong for the firing one. It is the commonest single error on this circuit, and everything after it stays arithmetically clean.
                - text: C_s = C/n = 8.3 nF
                  rule: rearrangement
                - text: C_s = C = 100 nF, since the same charge passes through all of them
                  rule: boundary condition
                  why: The charge is indeed common to all of them, and that is the reason the voltages add and the capacitance falls. Equal charge is the premise rather than the conclusion.
                - text: C_s = n/C
                  rule: rearrangement
                  why: Reciprocals add, and then the reciprocal of the sum is taken. Stopping halfway leaves per-farad units.
            - ask: Write the voltage across the chain.
              answer: 3
              candidates:
                - text: V = V₀ = 50 kV, since they are all the same
                  rule: boundary condition
                  why: In parallel that is right. In series the potential differences add along the chain, which is the entire purpose of the arrangement.
                - text: V = V₀/n = 4.2 kV
                  rule: rearrangement
                  why: Dividing rather than multiplying. A generator that lowers the voltage would be a strange thing to build a hall around.
                - text: V = √(n)·V₀ = 173 kV
                  rule: superposition
                  survives: true
                  why: "Root-n is what independent random contributions give. These are not independent and not random: they are twelve equal steps in series, and they add linearly."
                - text: V = nV₀ = 600 kV
                  rule: rearrangement
            - ask: Check the energy against what the twelve stages held.
              answer: 0
              candidates:
                - text: U = ½C_sV² = ½(8.3 × 10⁻⁹)(6.0 × 10⁵)² = 1.5 × 10³ J
                  rule: rearrangement
                - text: U = ½C_sV² with C_s = 1200 nF, giving 2.2 × 10⁵ J
                  rule: rearrangement
                  survives: true
                  why: The parallel capacitance carried down from the first branch. It says the act of switching created a hundred and forty times the energy, which nothing in the hall did.
                - text: U = n·½C_sV² = 1.8 × 10⁴ J
                  rule: superposition
                  why: The n is already inside the series capacitance and the voltage. Multiplying by it again counts the stages twice.
                - text: U = ½C_sV₀² = 10 J
                  rule: boundary condition
                  why: The stage voltage with the series capacitance, which are quantities from two different arrangements of the same hardware.
          commit: Commit the derivation
      - group: SHOT
        task: Decide what the final shot is for
        title: Repeat the placard, or test the number
        place: Launch Control
        scene: |-
          One shot left in the hall and two proposals for it. Strand's runs the standard setting and confirms the bank. Lauwers's halves the front at the same peak and predicts a specific voltage on the bench loop.
        guide: >-
          One shot, and a list of things it could be spent on that costs more than one shot.
          Buy what would change the station's next decision rather than what would be
          reassuring to have. Two of these confirm something already known to two significant
          figures, which is worth exactly nothing to the review.
        background:
          - >-
              What makes a test worth firing. Not how precise it is and not how likely it is to
              succeed — whether its possible outcomes point to different decisions. A shot whose two
              outcomes both leave the placard where it is has told the station nothing it can act on.
          - >-
              Why a prediction with a number is the strong form. Lauwers's proposal names the voltage
              the bench loop should reach if the inductive account is right. It can come out wrong,
              and a test that cannot come out wrong is a demonstration.
          - >-
              What the repeat is actually for. Confirming the bank at the standard setting is
              defensible when the bank is the thing in doubt. It is not, and it has been fired at that
              setting eleven times this season, so the eleventh confirmation buys the same axis again.
        assumes:
          - a test is worth what it could change
        takeaway: The most informative test is the one whose possible outcomes can falsify an important model.
        format: VALUE
        question: One shot in the hall. What is it worth spending on?
        answerText: The halved front with a predicted bench voltage. It is the only proposal whose outcome could come out wrong, and either result changes what the placard says.
        why: A test earns its shot by changing a decision. Lauwers's proposal halves the front at the same peak current and names the voltage the bench loop should reach if the inductive account of the placard number is right — a prediction that can fail, which is what makes the shot informative either way. If the bench reads what she says, the placard is revised on the inductive term. If it does not, the resistive account survives and the mast keeps its current figure with a documented reason. Strand's repeat at the standard setting confirms a bank that has already been fired there eleven times this season, and the twelfth confirmation is the same axis again. The two calibration items are real work and belong in a maintenance window, not in the last shot of an afternoon: they improve numbers nobody's next decision turns on. And the shot itself is irreversible — the hall is booked once, so the choice is not which test is best in general but which one this station cannot answer any other way.
        value:
          budget:
            amount: 1
            unit: shots in the hall
          decision: whether the placard voltage is revised on the inductive term
          options:
            - id: fast
              label: Halve the front at the same peak, with the bench voltage predicted in advance
              cost: 1
              axis: front time and the inductive term
              decisive: true
              irreversible: true
              reveals: whether the inductive account predicts the bench reading, or fails to
            - id: repeat
              label: Repeat the standard setting to confirm the bank
              cost: 1
              axis: bank repeatability
              reveals: the same peak current the bank has produced eleven times this season
            - id: probe
              label: Recalibrate the bench probe against the reference divider
              cost: 1
              axis: instrument calibration
              reveals: a correction of a per cent or two on every number in the record
            - id: earth
              label: Re-measure the earth resistance at the test bay
              cost: 1
              axis: instrument calibration
              reveals: a figure last measured in March, in wetter soil
          commit: Commit the shot
      - group: COUPLE
        task: Fix what the report will say about mitigation
        title: What to tell the next station
        place: Outstation
        scene: |-
          Lauwers has to write a paragraph the review will read as a recommendation. Three mitigations are on the table and only one of them is supported by this season's measurements.
        guide: >-
          Four mitigations, and all four are sensible engineering. Ask of each whether
          this season measured what it buys. The coupling depends on the length of the
          parallel run and on how close it gets to the conductor. Better earthing acts
          on a different path. And the trailer was already distant. Forty metres of its
          cable was not.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a recommendation is only as good as the measurement behind it
        takeaway: A recommendation should target a variable that the season's evidence shows actually controls the measured mechanism.
        format: CHOICE
        question: What should the report recommend for a site like this one?
        why: The measured coupling depends on the length of the parallel run and the logarithm of its near and far distances from the conductor. Routing signal pairs away from that geometry therefore follows directly from the season's evidence. Better earthing may be useful, but it addresses a different path. Surge protection is sensible practice, yet this campaign did not measure how much it buys. Moving the trailer alone also misses the mechanism. The trailer was distant; forty metres of its cable was not.
        choices:
          - Route signal pairs away from the down-conductor
          - Improve the earthing until the grid measures below ten ohms
          - Fit surge protection at both ends of every cable run
          - Move the outstation further from the mast
        answer: Route signal pairs away from the down-conductor
        rebuttals:
          - Ten ohms would lower how far the whole site rises, which is not what damaged anything.
          - Protection at both ends is sound practice and this season produced no measurement of its effect.
          - The trailer was already two hundred metres out; what mattered was the parallel run rather than the separation.
  # ---------------------------------------------------------------- day 15
  - title: What the season can say
    objective: Set next season's rule, and sort what was measured from what was inferred.
    briefing: The review pack closes tonight, and every sentence in it has to be answerable.
    stake: >-
      Friday, and the pack goes tonight. Adeyinka Vero wants the second mast; Hal Brenner wants a
      lead time that reflects how fast cells have actually crossed this flat rather than how fast
      the handbook says they do; Ana Sifuentes wants the April certificate reissued with the
      quantity it measured written on its face. All three of those go in or none of them does,
      and the review reads the pack before it reads anybody. Today you set the criterion the
      station will work to next season, sort the season's claims by what stands behind each one,
      and name the thing this whole campaign has not shown. Nothing can be added after tonight.
    takeaway: A season is worth what its record can defend, which is always less than what the room believes.
    stops:
      - group: SHOT
        task: Set the criterion the station will work to
        title: Earlier, or more certain
        concept: "Measurement in the right regime: shunts, dividers and what they load"
        place: Launch Control
        scene: |-
          Twenty-two minutes is the lead time the station actually achieved this season, against the thirty the rule assumes. Four changes are available and each of them costs something the station has little of.
        guide: >-
          The cloud is the lead time this station actually achieved across the season —
          twenty-two minutes on average against the thirty the rule assumes. The band is
          what the rule needs. Four changes are available, each costing something the
          station has little of, and they act differently: some move the average, some
          make the season more consistent. Apply what you would buy, then say when next
          season is defensible.
        background:
          - >-
              Why an average is not the claim. The rule is about every strike, not the mean
              one: a season that averages thirty minutes with a wide spread still contains
              days when the crew had ten. The cloud is the distribution of what actually
              happened, and the criterion is written on the fraction of it that clears the
              rule.
          - >-
              Moving and tightening. Calling the clear a mill-step earlier, or moving the
              shelter closer, adds minutes to every day — the cloud slides. A second radar
              feed with a nowcast, or a written and drilled call-out sequence, removes the
              days that went badly — the cloud tightens. Both buy lead time; only one of
              them removes the tail the rule is about.
          - >-
              What the tail costs. The days in the low tail are the days with people still
              on the flat when the first strike lands, and they are the days that end up in
              an incident report. That is why a plan is judged on its worst days rather than
              its typical one.
        assumes:
          - a rule has to work across every administration of it, not on a good afternoon
          - lead time varies from cell to cell as well as having an average
        takeaway: A rule fails on its spread as often as on its average, and only some changes touch the spread.
        format: CLOUD
        question: Bring next season's lead time inside what the rule needs, and say when it is defensible. Place the bars to report the mean and its one-sigma uncertainty.
        cloud:
          hint: The band is the lead time the rule needs. The cloud is what this station actually achieved across the season, not what it achieved on its best day.
          bounds:
            min: 30
            max: 90
            unit: min
            label: Lead time achieved before the first strike
          centre: 22
          spread: 26
          pass: 0.85
          seed: 41
          costUnit: k
          actions:
            - id: earlier
              label: Call the clear one mill-step earlier
              effect: shift
              amount: 20
              cost: 2
            - id: walk
              label: Move the crew shelter to the pad end of the flat
              effect: shift
              amount: 14
              cost: 9
            - id: radar
              label: Buy the second radar feed and its nowcast
              effect: narrow
              amount: 0.5
              cost: 14
            - id: script
              label: Write and drill the call-out sequence
              effect: narrow
              amount: 0.65
              cost: 3
          commit: Adopt it for next season
        answerText: Moving the average earlier is not enough. Calling earlier and shortening the walk shift the center, but the low tail still misses the rule. The radar feed and drilled call-out sequence narrow the spread, which is what finally clears the pass mark.
        why: Calling earlier shifts the center of the lead-time distribution but does not make one afternoon resemble another. Shortening the walk does the same. The rule must survive the low end of the distribution, not only its average. A second radar feed reduces uncertainty in cell motion. A drilled call-out sequence reduces variation between shifts. Those changes narrow the spread itself. The final criterion is defensible only when both the center and the spread keep the required walk time inside the accepted band.
      - group: EARTH
        task: Spend the two final verification checks on the claims whose failure would most weaken the season report.
        title: What the report can actually stand behind
        place: Earthing Compound
        scene: The funding-review copy closes tonight. Four headline claims are already written and signed. Two have direct backing, while two depend on steps the station has not physically verified. Kaya has time to trace only two claims before the report locks.
        guide: >-
          Four headline claims, all signed, and two checks before the report locks
          tonight. Open each claim and read what already backs it. Two rest on direct
          evidence and two rest on steps nobody has physically verified. Hold what the
          backing does not support, and spend the checks where a wrong claim in a
          funding review would cost most.
        background:
          - >-
              What a signature is worth here. It records that somebody took responsibility
              for a sentence. It does not record that the condition was observed. A claim
              can be signed, believed and true, and still have nothing behind it that a
              reviewer could inspect.
          - >-
              Why the funding review changes the stakes. This copy goes to people deciding
              whether the station continues. A claim that turns out to be unbacked costs
              more than one that was never made, because it puts every other claim in the
              document in doubt.
          - >-
              How to choose between two unbacked claims. Not by which is least likely — by
              which does more damage if it is wrong. That is consequence rather than
              probability, and it is the judgement the two checks are for.
        assumes:
          - claims of different kinds are defended in different ways
        takeaway: A signed claim is not stronger than the weakest unverified step needed to support it.
        format: ATTEST
        question: Which claims deserve the final two verification checks before the season report is frozen?
        attest:
          hint: Open each claim and read what already backs it. You have two checks. Spend them where a wrong claim would matter and the evidence chain is still incomplete.
          checks: 2
          claims:
            - id: trench_voltage
              label: The August stroke drove about 200 kV around the trench loop
              critical: true
              backed: true
              evidence: derived from the 40 m loop geometry and tested in the hall with a shortened front
              verification: trace the derivation and hall result to the archived raw records
            - id: missing_current
              label: About 12 kA leaves the down-conductor in its last 15 m
              critical: true
              backed: true
              evidence: measured along the conductor, including 29 kA at 15 m and 18 kA at the base
              verification: reconcile the seven current stations against the archived stroke
            - id: bond_voltage
              label: The six-metre bonding lead develops about 180 kV on the strike front
              critical: true
              backed: false
              evidence: computed from about 6 µH and 3 × 10¹⁰ A/s; not measured directly on site
              verification: flag for a fast differential-probe measurement on the next instrumented season
            - id: routing
              label: Routing signal pairs away from the down-conductor will protect the next station
              critical: true
              backed: false
              evidence: inferred from the measured coupling mechanism and geometry
              verification: trace whether the recommendation has a direct test or only the mechanism-based inference
        answerText: "Use the two checks on the unbacked high-consequence claims: the predicted 180 kV across the bonding lead and the general mitigation claim. The trench-loop voltage and missing-current claim already have direct supporting evidence."
        why: "The 200 kV trench result has a derivation and a hall test behind it. The missing 12 kA is supported by measurements along the conductor. The 180 kV bonding-lead voltage is different: it was computed from length and dI/dt but never read directly. The routing recommendation then extends that mechanism to another station. Those last two claims carry consequence without equivalent backing. A final review should spend scarce verification effort there, rather than making the best-supported lines look even more complete."
      - group: MAST
        task: Name what the season did not establish
        title: What is still open
        place: Mast Base
        scene: The funding-review copy locks tonight. Nakata has one line left under “Unresolved.” Four candidates are on the screen. Kaya wants the line that names a physical claim the season still cannot support with a direct measurement.
        guide: >-
          Four candidates for the unresolved line. Ask of each whether it names a
          physical claim that a measurement could settle. One of them is scheduled work.
          One is a design preference about instruments that are deliberately slow. One
          is a charge budget that does not control the mitigation. The season computed a
          voltage it never measured, and the copy locks tonight.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a season produces limits as well as results
        takeaway: Naming what is unresolved is what makes the rest of a report usable, and it is the sentence a review reads first.
        format: CHOICE
        question: What should the pack name as the season's main unresolved question?
        why: The largest open claim is whether the predicted fast voltage actually appears across the bonding lead during a stroke. The season computed about 180 kV from its length and dI/dt, but never measured that voltage directly. A fast differential probe and suitable digitiser would test it. The other listed items are different. The mills are intentionally slow, the cell charge budget does not control the mitigation, and rebuilding the trailer is scheduled work. The report should name the unmeasured physical claim, not a task list.
        choices:
          - Whether the predicted bonding-lead voltage appears during a stroke
          - Whether the mills should be redesigned to follow the stroke front
          - Whether the cell stores more charge than one stroke removes
          - Whether the trailer can be rebuilt before the next storm season
        answer: Whether the predicted bonding-lead voltage appears during a stroke
        rebuttals:
          - The mills measure the slower source field well; redesigning them is not the unverified claim behind the mitigation.
          - The cloud can replenish charge between strokes, but that budget does not decide the coupling recommendation.
          - Trailer rebuilding is scheduled work. It does not test the physical claim on which the recommendation rests.

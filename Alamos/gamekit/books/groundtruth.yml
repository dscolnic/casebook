  # ---------------------------------------------------------------- day 2
  - title: The layer overhead
    objective: Get the charge on the cloud base out of a reading taken at the ground.
    briefing: The mills read 4.5 kV/m under yesterday's cell, and nobody has turned that into charge.
    stake: >-
      Tuesday, and yesterday's cell left a number nobody has used. At the moment the crew was
      walked back the four mills read 4.5 kV/m together, which Vero wants in the season log as a
      charge rather than as a field. Emil Strand, the high-voltage engineer, says the hall can produce the same field between
      two plates a metre apart and that the arithmetic is the same either way. Today you get the
      charge per square metre on the cloud base out of a reading taken at head height, and find
      out what the same law says about the inside of the screened room.
    takeaway: Gauss turns a field into a charge whenever a surface can be chosen the field is simple on.
    stops:
      - group: FIELD
        task: Derive the charge per square metre from the mill reading
        title: A pillbox through the cloud base
        concept: Gauss's law, and choosing a surface it can be used on
        place: Field Station
        scene: Field-instruments specialist Mira Halvorsen has 4.5 kV/m on the board. Station lead Adeyinka Vero wants coulombs per square metre. The charge sits near cloud base, spread over an area far wider than its height above the flat.
        guide: >-
          You build the working a line at a time. At each step you choose the expression
          the line above actually gives you. Every wrong branch is legal algebra, so the
          malformed-line trick will not help. Start from Gauss's law and choose a
          surface the geometry makes easy. The layer is far wider than it is high, so a
          pillbox straddling it is the surface that pays.
        background:
          - >-
              Why a pillbox. Gauss's law is true for any closed surface and useful only for
              one that matches the symmetry. A charged layer much wider than its height
              looks locally like an infinite sheet. A short flat box through it therefore
              has field passing through one face and nothing through the sides.
          - >-
              Where the factor of two goes. An isolated sheet drives field out of both
              faces, giving E = σ/2ε₀. A layer above ground with a conducting flat beneath
              it has the field on one side only, so the same charge gives twice the field.
              Which case you are in is a physical question, not an algebraic one.
          - >-
              Why Vero wants coulombs per square metre. A field in kilovolts per metre is
              what the mill reports. A charge density is what can be compared with other
              cells, other days and the literature. Converting the reading into the quantity
              that caused it is the whole point of having a model of the cloud at all.
        assumes:
          - flux out of a closed surface counts the charge inside it
          - a layer far wider than its distance can be treated as unbounded
        takeaway: A wide sheet of charge produces a field that does not depend on distance, which is why a reading at the ground fixes it.
        format: DERIVE
        question: Turn the mill reading into the charge per square metre on the layer above it.
        answerText: σ = 2ε₀E = 8.0 × 10⁻⁸ C/m². The pillbox puts flux through its two faces and none through the sides. Cloud-base height never enters the result.
        why: The result is 8.0 × 10⁻⁸ C/m². Over ten square kilometres, that corresponds to about 0.8 C on the layer. The derivation matters more than the total. Choose a pillbox so E is constant on its two faces and parallel to its sides. Then E can leave the surface integral. The cloud-base height never appears. That is why a mill at the ground can recover charge per unit area on a layer more than a kilometre above it.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: ∮E·dA = Q_enc/ε₀
          startNote: the mills read E = 4.5 × 10³ V/m, and ε₀ = 8.85 × 10⁻¹² F/m
          goal: the charge per square metre on the layer, in coulombs per square metre
          askRule: true
          rules:
            - Gauss's law
            - symmetry argument
            - superposition
            - line integral of E
            - rearrangement
            - boundary condition
          steps:
            - ask: Choose a surface the law can actually be used on.
              answer: 0
              candidates:
                - text: a flat pillbox through the layer, faces parallel to it
                  rule: symmetry argument
                - text: a pillbox through the layer, faces perpendicular to it
                  rule: symmetry argument
                  survives: true
                  why: A closed surface, and the integral over it is perfectly well defined. It is also zero for a uniform field, so the derivation runs on and concludes there is no charge anywhere — clean algebra, silent physics.
                - text: a sphere centred on the mast tip
                  rule: Gauss's law
                  why: The law holds for any closed surface and is only useful where the field is constant on it. On this sphere it is not, so nothing can be taken outside the integral.
                - text: a hemisphere resting on the ground under the mill
                  rule: boundary condition
                  why: That is not closed until the flat disc is added, and the disc is where the ground is, which is exactly the part being asked about.
            - ask: Add up the flux through the surface you chose.
              answer: 2
              candidates:
                - text: Φ = E(4πr²)
                  rule: superposition
                  why: That is the area of a sphere, and there is no sphere here. The pillbox has two flat faces and a short side wall.
                - text: Φ = EA + E(2πrh) for the faces and the sides
                  rule: Gauss's law
                  why: The field runs along the side wall rather than through it, so the dot product there is zero and the sides contribute nothing however tall the box is.
                - text: Φ = 2EA, the two faces only
                  rule: symmetry argument
                - text: Φ = EA, one face
                  rule: symmetry argument
                  survives: true
                  why: Counting one face is arithmetically clean and gives a charge density exactly half the true one, which is well inside the range anybody would believe.
            - ask: Set the flux equal to the enclosed charge over ε₀.
              answer: 1
              candidates:
                - text: 2EA = σAε₀
                  rule: Gauss's law
                  why: ε₀ divides the charge, it does not multiply it. Written this way the units come out as coulombs per farad and the answer is twenty orders out.
                - text: 2EA = σA/ε₀
                  rule: Gauss's law
                - text: 2EA = σ/ε₀
                  rule: rearrangement
                  survives: true
                  why: Dropping the area on the right leaves an equation that still solves, and σ then depends on how big a pillbox you happened to draw — which is the tell, and it is only visible if you check the units.
                - text: 2E = σA/ε₀
                  rule: boundary condition
                  why: The area belongs on both sides or neither. Here it has been cancelled from the left only.
            - ask: Rearrange for σ and put the reading in.
              answer: 3
              candidates:
                - text: σ = E/(2ε₀)
                  rule: rearrangement
                  why: ε₀ has moved to the wrong side. This returns 2.5 × 10¹⁴, which is a charge density no cloud has ever had.
                - text: σ = ε₀E/2
                  rule: rearrangement
                  survives: true
                  why: "A factor of four low and entirely plausible on the page: 2.0 × 10⁻⁸ rather than 8.0 × 10⁻⁸, and every later line built on it is clean."
                - text: σ = 2E/ε₀
                  rule: rearrangement
                  why: Inverting ε₀ again. The units here are volt-farads per metre squared, which is not a charge density.
                - text: σ = 2ε₀E
                  rule: rearrangement
          commit: Commit the derivation
      - group: BANK
        task: Say what the same law gives between two plates
        title: Two plates, and a factor of two
        concept: Field of a charged sheet, line and sphere
        place: Impulse Hall
        scene: High-voltage engineer Strand has two plates a metre apart with equal and opposite surface charge. Beside them is the one-sheet model from yesterday. The two setups use the same σ, and he asks why the field between the plates is different.
        guide: >-
          Four explanations for a factor of two. Ask of each whether it changes the law
          or adds a source. Both setups use the same charge per unit area, so nothing
          about the charge has doubled. What has changed is how many sheets contribute
          in the gap. And note what happens outside the pair, where the two
          contributions point opposite ways.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - fields from separate charges add as vectors
        takeaway: Electric fields from separate sources add as vectors, so geometry decides whether their contributions reinforce or cancel.
        format: CHOICE
        question: Why is the field between two charged plates twice that of one charged layer?
        why: "One charged sheet gives σ/(2ε₀) on each side. Put an oppositely charged sheet across the gap and its field points the same way between the plates. The two contributions therefore add to σ/ε₀. Outside the pair, the fields point in opposite directions and cancel. That is why an ideal capacitor keeps most of its field between the plates. Gauss's law has not changed. The factor of two comes from superposition: two sources contribute to the field in the gap."
        choices:
          - Both plates contribute a field in the same direction between them
          - The law takes a different form when two conductors are involved
          - The gap is small, so the field has less room to spread
          - The plates carry twice as much charge in total as the single layer
        answer: Both plates contribute a field in the same direction between them
        rebuttals:
          - The law is the same in both cases, and the two answers come from adding two sources rather than one.
          - Separation does not appear in the result at all, which is what makes a plate capacitor useful.
          - Total charge is not what the field depends on — it is the charge per unit area on each plate.
      - group: MAST
        task: Work out what the screened room does to a field
        title: Inside the sheet
        concept: Field inside a conductor, and shielding
        place: Screened Room
        scene: Rigger and mast supervisor Owen Tate, the rigger & mast supervisor, closes the screened-room door. The instrument on the bench inside drops to zero while the flat outside remains near 4 kV/m. Nothing on the instrument rack has been switched off.
        guide: >-
          Say what the probe inside will read once the door is shut, then shut it and read the
          probe. The prediction is the part that matters: a number written before the door
          closes is a claim about how conductors reach equilibrium, and one written afterwards
          is a description of a display.
        background:
          - >-
              What equilibrium does. Charge in a conductor is free to move, and it moves until the
              field inside the metal is zero — because any residual field would still be pushing it.
              The charge ends up arranged on the surfaces, and what a probe inside the enclosure sees
              is what is left after that rearrangement.
          - >-
              Why it is not perfect. The door seam, the cable entries and the ventilation mesh are
              apertures, and an aperture lets through a field that scales with its size relative to
              the wavelengths involved. So the honest prediction is not zero but small — tens of
              volts per metre against four thousand outside.
          - >-
              Why measuring is the point. The shielding argument is sound and the number it gives
              depends on hardware nobody derived: how well the door seats, whether the mesh is bonded
              all round, what the cable glands do. Predicting and then measuring is the only way to
              find out which of those the enclosure actually has.
        takesAsRead:
          - Gauss's law, and choosing a surface it can be used on
        assumes:
          - charge in a conductor is free to move
        takeaway: Electrostatic shielding is a consequence of how conductors reach equilibrium in an applied field.
        format: VERIFY
        question: Predict what the bench probe reads with the door shut, then shut it and measure.
        answerText: About 40 V/m — not zero. The field outside is 4 kV/m, so the enclosure is attenuating by a factor of about a hundred, and the residue arrives through the door seam and the cable entries.
        why: Charge in a conductor moves until the field inside the metal is zero, because any field that remained would still be pushing it. That is the whole of electrostatic shielding — not a material property but a consequence of equilibrium, and it is why the probe drops the moment the door seats. What it does not give is exactly zero. The seam, the ventilation mesh and the cable glands are apertures, and each lets a fraction through: measured, the bench reads about 40 V/m against 4 kV/m outside, an attenuation of roughly a hundred. Predicting zero is the right physics and the wrong number, and the gap between them is the hardware. That is why this stop asks for the prediction first and then for the measurement: the argument tells you the field inside a closed conductor is zero, and only the probe tells you what your enclosure is.
        verify:
          prediction:
            label: Field at the bench probe with the door shut
            unit: V/m
            min: 0
            max: 400
            step: 5
          truth: 40
          passRatio: [0.5, 2.0]
          intervention:
            label: Close and dog the screened-room door
            note: nothing on the instrument rack is switched off, and the flat outside stays near 4 kV/m
            outcome: The door seats and the bench probe falls immediately, settling within a second.
          measurement:
            label: Read the bench probe
            note: calibrated field mill on the bench, 1 V/m resolution
            cost: 1
            costUnit: minutes of hall time
          unmeasuredMoral: A prediction that the field goes to zero is the right argument about a closed conductor and tells you nothing about your door seam. Reporting it without reading the probe is reporting the theory as the measurement.

  # ---------------------------------------------------------------- day 3
  - title: Volts are a path
    objective: Turn a field in volts per metre into the volts between two places.
    briefing: The season log wants the cloud-to-ground potential, and nobody has written the integral.
    stake: >-
      Wednesday, and the log has a column for potential difference that has been empty since the
      station opened. Vero wants it filled from yesterday's field rather than from a textbook.
      Ingrid Lauwers, the emc engineer, has asked a question that sounds like pedantry and is not: between which two
      points. Today you take the field down a path and get volts out of it, and settle what a
      number in that column would have to name before it means anything. The records officer,
      Yusuf Kaya, has three shots
      from last season with no criterion recorded, and this is how that happens.
    takeaway: A potential belongs to a pair of points, and a path is how you get from the field to the volts.
    stops:
      - group: FIELD
        task: Derive the cloud-to-ground potential from the field
        title: Down the path, and the sign
        place: Field Station
        scene: |-
          The field under yesterday's cell was 4.5 kV/m, near enough uniform, and the cloud base was 1.2 km up on the radar. Vero wants the potential difference between the base and the flat.
        guide: >-
          Build it a line at a time. Potential difference is the line integral of the
          field along a path, with a minus sign in front. The field here is near enough
          uniform, so the integral collapses to a product. The sign is the part that
          catches people, so decide which way your path runs before you evaluate
          anything.
        background:
          - >-
              What the minus sign is doing. Moving against the field costs energy, and
              potential is energy per unit charge. So a path that runs upward through a
              downward-pointing field arrives at a higher potential. The sign in the
              definition is what encodes that, and dropping it gives a cloud base below
              ground potential.
          - >-
              Why uniform matters. A line integral over a changing field needs the field as
              a function of position. Here the mills say the field is near enough constant
              from the flat to cloud base, so the integral is field times distance. That
              approximation is worth stating, because the real field is not uniform near the
              mast.
          - >-
              How big the answer is. A kilometre of a few kilovolts per metre gives
              megavolts. That number is why a rocket trailing a wire can trigger a strike,
              and why the station's whole safety case is written around the field at the
              flat rather than around the potential aloft.
        assumes:
          - the field between the layer and the ground is close to uniform
          - work per unit charge is what a volt is
        takeaway: With a uniform field the integral is a product, and the minus sign is the physics rather than the bookkeeping.
        format: DERIVE
        question: Get the potential difference between the cloud base and the ground out of the field.
        answerText: Vb − Va = −Ed = −5.4 × 10⁶ V. The negative sign says the cloud base is at lower potential than the ground for this field direction.
        why: The result is −5.4 MV. The sign says the cloud base is at lower potential than the ground under this field direction. Potential is the line integral of the field, while the field is the spatial derivative of potential with a minus sign. Here the field is treated as uniform, so the integral becomes a product. A real cell would require the full integral. Every reported potential must also name the two points being compared.
        derive:
          hint: Take the integral down a path you choose, and say what licenses each line.
          start: V_b − V_a = −∫E·dl
          startNote: E = 4.5 × 10³ V/m, directed downward; the cloud base is 1.2 × 10³ m up
          goal: the potential of the cloud base relative to the ground, in volts
          askRule: true
          rules:
            - Gauss's law
            - symmetry argument
            - superposition
            - line integral of E
            - rearrangement
            - boundary condition
          steps:
            - ask: Choose the path to integrate along.
              answer: 1
              candidates:
                - text: the shortest path only, because the integral requires it
                  rule: boundary condition
                  why: The integral is path-independent in an electrostatic field, so the straight line is a convenience rather than a requirement. Believing it is a requirement is what makes the next problem, with a curved route, look impossible.
                - text: straight up from the flat to the base, along the field
                  rule: line integral of E
                - text: a path around the mast and up, to stay off the field lines
                  rule: line integral of E
                  survives: true
                  why: Perfectly legitimate — the answer is the same by any route — and it turns a one-line product into an integral nobody can do in their head, which is how a correct choice still costs the derivation.
                - text: along an equipotential from the flat to a point under the base
                  rule: symmetry argument
                  why: That leg contributes nothing at all, which is what an equipotential is. It is not wrong so much as it is not yet an answer.
            - ask: Write the integral for a uniform field along that path.
              answer: 2
              candidates:
                - text: V_b − V_a = −∫E dl = −E/d
                  rule: rearrangement
                  why: Dividing rather than multiplying. Volts per metre divided by metres is not volts, and the answer comes out at about four, which looks harmless.
                - text: V_b − V_a = −E·d²/2
                  rule: line integral of E
                  why: That is the integral of a field growing linearly with height. This one is uniform, so nothing inside the integral depends on l.
                - text: V_b − V_a = −E·d
                  rule: line integral of E
                - text: V_b − V_a = E·d
                  rule: line integral of E
                  survives: true
                  why: The magnitude is right and the sign is not, and every later line stays clean. It says the cloud base is positive with respect to the flat, which for this cell is exactly backwards.
            - ask: Put the numbers in.
              answer: 0
              candidates:
                - text: V_b − V_a = −(4.5 × 10³)(1.2 × 10³)
                  rule: rearrangement
                - text: V_b − V_a = −(4.5 × 10³)(1.2)
                  rule: rearrangement
                  survives: true
                  why: The kilometre never became metres. Five and a half kilovolts is a plausible number for something and it is not this.
                - text: V_b − V_a = −(4.5)(1.2 × 10³)
                  rule: rearrangement
                  why: The kilovolts per metre never became volts per metre either, and the two errors are the same error at different ends of the product.
                - text: V_b − V_a = −(4.5 × 10³) + (1.2 × 10³)
                  rule: superposition
                  why: Adding a field to a distance. Superposition adds fields to fields, and there is only one field here.
          commit: Commit the derivation
      - group: COUPLE
        task: Say what an equipotential means for somebody standing on it
        title: One foot and the other
        place: Outstation
        scene: EMC engineer Lauwers has the injection-test map on the trailer wall. Rings of equal potential spread from the mast base, crowded near it and widely spaced farther out. She asks where one ordinary stride crosses the largest voltage difference.
        guide: >-
          Work out the voltage between one foot and the other where the rings are most
          crowded. The step voltage is the potential gradient there multiplied by the length
          of a stride. Two tiles are the ground's own potential at those radii, which is a
          large number and not the one that matters — a bird on a wire sits at kilovolts and
          is unharmed.
        background:
          - >-
              What the rings mean. Each is a set of points at the same potential, so walking along
              one costs nothing and crossing them costs the difference. Current spreading from the
              mast base falls off with distance, which is why the rings crowd near the rod and open
              out further away.
          - >-
              Why the gradient is the whole answer. What passes through a person is decided by the
              difference between their feet, not by the potential of the ground under them. Near the
              rod that difference over one stride is thousands of volts; out at forty metres the
              same stride crosses a few tens.
          - >-
              What follows for the site. It is the reason the working rule is to stand still or
              shuffle during a storm rather than stride, and the reason a buried grading ring is
              worth its copper: flattening the gradient near the rod is the only way to make the
              same current survivable to walk near.
        takesAsRead:
          - Electric potential as a line integral of the field
        assumes:
          - current spreading through soil produces a potential that falls with distance
        takeaway: What hurts somebody standing on the ground is the difference between where their feet are, not the potential of the ground itself.
        format: BALLPARK
        question: What voltage appears between one foot and the other at the crowded rings, one metre from the rod?
        answerText: About 3,400 volts across a single 0.9 m stride. The ground there is at 14 kV, and that number is not what hurts anybody — the difference between the feet is.
        why: "The step voltage is the potential gradient times the stride: V_step = (dV/dr) × d. One metre from the rod the injection test measures a gradient of about 3,800 volts per metre, so an ordinary 0.9 m stride crosses roughly 3,400 V. At forty metres out the gradient has fallen to about 30 V/m and the same stride crosses 27 V. The ground's own potential is a much larger number in both places — 14 kV at one metre — and it is the wrong one to quote, for the same reason a bird on a transmission line is unharmed at hundreds of kilovolts: nothing passes through a body held at one potential. What passes through a person is decided by the difference between contact points. That is why the site rule during a storm is to stand still or shuffle rather than stride, and why a buried grading ring earns its copper: it cannot reduce the current, and it can flatten the gradient the current produces."
        estimate:
          prompt: One metre from the rod the injection test measures a potential gradient of about 3,800 V/m. An ordinary stride is 0.9 m. The ground there sits at 14 kV.
          question: Choose the potential gradient at the crowded rings and the length of one stride.
          labels:
            - 3800  (potential gradient at 1 m, in V/m)
            - 0.9  (one ordinary stride, in m)
            - 14000  (the ground's own potential at 1 m, in V)
            - 30  (the gradient 40 m out, in V/m)
            - 25  (the rod's resistance, in ohms)
          values: [3800, 0.9, 14000, 30, 25]
          slots: 2
          template: '{0} × {1}'
          formula: a*b
          correct: [0, 1]
          target: 3420
          tolerance: 200
          units: volts between the feet
          solution: 3,800 × 0.9 ≈ 3,400 V across one stride at a metre, against 30 × 0.9 = 27 V at forty metres.
          explanation: The difference between the feet is what passes through a person. The 14 kV the ground sits at does nothing on its own.
          givens:
            - gradient 3,800 V/m at one metre, 30 V/m at forty metres
            - an ordinary stride is 0.9 m
          relationship: The step voltage is the potential gradient times the stride — V_step = (dV/dr) × d, which is the line integral of the field over the distance between the feet.
      - group: SHOT
        task: Establish what a record has to fix before the shot
        title: The number that has to exist first
        place: Launch Control
        scene: Records lead Yusuf Kaya has three shots from last season with no criterion recorded. The mill logs preserve every launch field, but nobody can reconstruct what threshold the team had committed to before seeing how each afternoon ended.
        guide: >-
          All four options are claims about when a rule is worth writing. Ask of each
          whether it depends on knowing how the afternoon ended. Two of them argue that
          a larger sample is better, which is true of data and not of criteria. A clean
          shot makes its threshold look reasonable afterwards. So does a cautious hold
          followed by nothing.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a decision can be described after the event by the person who made it
        takeaway: A criterion is evidence about a decision only if it exists before the outcome does.
        format: CHOICE
        question: Why is a criterion written afterwards worth so much less than the same words written before?
        why: People reconstruct decisions after learning how events ended, often without realizing it. A clean shot makes its launch threshold look more reasonable. A cautious hold followed by nothing makes caution look more reasonable. Neither memory is dishonest, but neither is an unbiased test. Writing the criterion first lets every launch and hold be judged against the same rule. Only then can the season test whether the rule works, instead of quietly changing the rule to fit the outcomes.
        choices:
          - Knowing the outcome can shift which threshold looks defensible
          - The logged field can reconstruct a threshold accurately after the shot
          - A criterion chosen after several shots uses a larger evidence sample
          - Post-season criteria are stronger because they include the rare cases
        answer: Knowing the outcome can shift which threshold looks defensible
        rebuttals:
          - The log can reconstruct the field, but it cannot reconstruct an unbiased decision rule that was never committed.
          - More examples can help design the next rule; they do not turn a post-hoc rule into a precommitted test of this season.
          - Including rare cases is useful for the next criterion, but it does not make an after-the-fact threshold independent of the outcomes.
  # ---------------------------------------------------------------- day 4
  - title: Why the tall thing is struck
    objective: Get the field at the mast tip, and say what it does to the air.
    briefing: The mast has been drawing corona since the first cell, and nobody has computed the tip field.
    stake: >-
      Thursday, and Tate reports the mast hissing again — corona at the tip, audible from the base
      in the quiet before a cell. Vero calls that the station working; Brenner calls it the mast
      being sixty metres of steel with nothing else near it. Both are describing the same
      arithmetic and neither has done it. Today you get the field at the tip out of the field over
      the flat, work out what air can stand before it stops insulating, and decide whether the
      afternoon's marginal cell is a launch. Vero has been arguing for a week that it is.
    takeaway: A conductor takes the potential of the air it reaches into, and a small radius turns that potential into an enormous field.
    stops:
      - group: MAST
        task: Derive the field at the tip of the mast
        title: Sixty metres up, two centimetres across
        place: Mast Base
        scene: "The flat is at 4.5 kV/m and the mast is earthed. Its whole length therefore sits at ground potential in air that is not. Tate has the tip radius on the drawing: twenty millimetres."
        guide: >-
          Build it a line at a time. The mast is earthed, so its whole length sits at
          ground potential while the air around it does not. Treat the tip as a small
          sphere: the undisturbed potential at that height tells you the charge, and the
          same charge gives the field at the tip's own radius. Then say what the air
          does about it.
        background:
          - >-
              Why the tip concentrates the field. For a sphere, potential goes as one over r
              and field as one over r squared. So the ratio of field to potential goes as
              one over r, and a small radius at a given potential difference means a large
              field. Sixty metres of potential difference collapsed onto a twenty-millimetre
              tip is what makes a mast a lightning terminal.
          - >-
              What the air does. Dry air breaks down at about three megavolts per metre. A
              tip field above that ionises the air around it, which bleeds charge into the
              atmosphere as corona and puts the mast's tip current on the station's
              instruments. The mast is not passive; it is doing something continuously.
          - >-
              Why the sphere is a fair model. A rounded tip on a long conductor is locally
              spherical, and the field at its surface is set by its own radius rather than
              by the mast's length. The length enters only through the potential the tip is
              held away from.
        assumes:
          - an earthed conductor is all at one potential
          - the potential of the undisturbed air rises with height above the ground
        takeaway: The field at a conductor's surface is its potential difference from its surroundings divided by its radius of curvature, so sharpness costs more than height.
        format: DERIVE
        question: Work out the field at the mast tip, and say what the air does about it.
        answerText: E ≈ V/r = 2.7 × 10⁵ / 0.020 = 1.4 × 10⁷ V/m. That is about five times the dry-air breakdown field, so corona at the tip is expected.
        why: The tip field is about 1.4 × 10⁷ V/m, against roughly 3 × 10⁶ V/m for dry-air breakdown. The air at the sharp tip therefore begins to ionize. Height sets how much potential the earthed mast reaches into. Tip radius then concentrates that potential difference over a small distance. Double the mast height and the tip field doubles. Make the tip radius ten times smaller and the field rises by ten. Shape is the amplifier.
        derive:
          hint: Treat the tip as a small sphere at the potential of the ground, in air that is not.
          start: V = kQ/r and E = kQ/r² for an isolated sphere
          startNote: undisturbed potential at 60 m is E_flat × h = 4.5 × 10³ × 60 = 2.7 × 10⁵ V; tip radius 0.020 m
          goal: the field at the tip surface, in volts per metre
          askRule: true
          rules:
            - Gauss's law
            - symmetry argument
            - superposition
            - line integral of E
            - rearrangement
            - boundary condition
          steps:
            - ask: Combine the two relations to remove the charge.
              answer: 1
              candidates:
                - text: E = V·r
                  rule: rearrangement
                  why: Multiplying rather than dividing. It gives 5.4 × 10³, which is the same order as the field over the flat and therefore looks reasonable and says nothing.
                - text: E = V/r
                  rule: rearrangement
                - text: E = V/r²
                  rule: rearrangement
                  survives: true
                  why: Only one factor of r cancels between the two relations. Keeping both gives a field fifty times too large, and it is fifty times an already enormous number, so nothing about the result looks wrong.
                - text: E = kV/r
                  rule: superposition
                  why: The Coulomb constant cancels with the charge. Leaving it in multiplies the answer by nine billion and gives units nothing has.
            - ask: Say which potential difference belongs in it.
              answer: 2
              candidates:
                - text: the potential of the flat, which is zero
                  rule: boundary condition
                  why: The mast and the flat are both at earth potential, so that difference is zero and nothing happens — which is the correct answer to a different question.
                - text: the full cloud-to-ground potential, 5.4 × 10⁶ V
                  rule: superposition
                  survives: true
                  why: "Algebraically fine and twenty times too big: it puts the tip at the potential of the cloud base rather than of the air at sixty metres, and the conclusion — corona — comes out the same, which is what makes it hard to catch."
                - text: the mast against the air at its own height, 2.7 × 10⁵ V
                  rule: boundary condition
                - text: the potential drop along the sixty metres of the mast itself
                  rule: line integral of E
                  why: A conductor has no potential drop along it in electrostatics. That is what being a conductor means, and it is why the whole mast is at ground potential.
            - ask: Put the numbers in and compare with what air can stand.
              answer: 3
              candidates:
                - text: E = 2.7 × 10⁵ / 0.020 = 1.4 × 10⁴ V/m, below breakdown
                  rule: rearrangement
                  why: "The division has been done as though the radius were in centimetres rather than metres, and the conclusion reverses: it says the tip is quiet, and the tip is audibly not."
                - text: E = 2.7 × 10⁵ × 0.020 = 5.4 × 10³ V/m
                  rule: rearrangement
                  why: "Multiplying again, one line later. The check is the units: volts times metres is not volts per metre."
                - text: E = 0.020 / 2.7 × 10⁵ = 7.4 × 10⁻⁸ V/m
                  rule: rearrangement
                  survives: true
                  why: Inverted, and it solves cleanly to a number so small nobody reads it as wrong — they read it as scientific notation and move on.
                - text: E = 2.7 × 10⁵ / 0.020 = 1.4 × 10⁷ V/m
                  rule: rearrangement
          commit: Commit the derivation

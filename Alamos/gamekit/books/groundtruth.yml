- title: The rule fails on a fast cell
  objective: Commit to a prediction, measure the result, then diagnose why the crew-clear rule lost its safety margin.
  briefing: The physics test works. The safety model does not.
  stake: >-
    Tuesday. You commit to a prediction, fire, and measure it. Then a second cell crosses nineteen kilometres in twenty minutes. The crew follows the written rule and reaches the bunker only five minutes before the first natural strike.
  takeaway: A prediction that is never measured against anything is an opinion with a unit after it.
  segue: >-
    The predicted stroke is measured, but the afternoon exposes a worse error: the rule assumed more warning time than this cell gave. Everyone is safe, but the rebuilt outstation goes dark again and the field programme loses its remote instruments. Brenner's warning is no longer an opinion. Next season's rule has to be built from the spread in real lead times, not the average afternoon.
  stops:
  - group: SHOT
    task: Predict the peak, fire, and measure it
    title: Predict first. Measure second.
    at: launch-board
    reason: >-
      Adeyinka Vero wants a predicted peak current on the board before the rocket leaves the rail, and the clamp will only confirm it forty minutes later if anyone reads it.
    place: Launch Control
    scene: |-
      The board has a pre-written empirical peak-current forecast from the season's previous triggered strokes and today's launch conditions. Vero wants the predicted band locked before the rocket leaves the rail. The independent clamp can confirm it only if someone reads the channel after the shot.
    guide: >-
      Lock a predicted peak current before the rocket flies. It cannot be edited afterwards, which is the point. The rocket goes up whatever you write. Then decide whether to spend half an hour of a storm afternoon walking out to read the clamp. Not measuring is an answer too, and a poor one.
    background:
    - >-
      Why the prediction is locked. A number written after the event is not a prediction. The failure is not dishonesty but memory: with the clamp reading in front of you, it is genuinely hard to recall how confident you were. Committing first is a procedure that protects you from yourself.
    - >-
      What the walk actually costs. Forty minutes, on an afternoon with a cell coming in, is time not spent on the mills or the launch rail. That is a real cost, and it is why the panel makes you decide rather than assuming somebody will go.
    - >-
      What is lost by not going. An unmeasured prediction can never be wrong, which is exactly what makes it worthless. A station that predicts and never checks accumulates confidence rather than calibration, and the review has no way to tell the two apart.
    assumes:
    - a prediction is only a prediction if it is recorded before the outcome
    - reading an instrument after the event is a decision with a cost
    takeaway: Predicting and measuring are two separate acts, and skipping the second one is its own kind of failure.
    format: VERIFY
    question: Commit to a peak current for this stroke, fire the shot, and then decide whether to go out and read it.
    verify:
      hint: The rocket will fly whatever you predict. The measurement costs half an hour of a day that has a cell in it.
      prediction:
        label: Peak current of this stroke
        unit: kA
        min: 5
        max: 60
        step: 1
      truth: 41
      passRatio: [0.6, 1.6]
      intervention:
        label: Fire the rocket at 6.1 kV/m
        note: the wire goes up, the channel forms and the stroke comes down it
        outcome: a single return stroke down one channel, recorded on every station
      measurement:
        label: Walk out and read the clamp
        note: forty minutes of an afternoon with a second cell behind this one
        cost: 0.7
        costUnit: h
      unmeasuredMoral: A predicted peak with no measurement beside it is the station's opinion of itself, and the season log has three of those in it already.
    answerText: The independent clamp measures 41 kA. The authored forecast band is intentionally broad; the important experimental act is that the prediction is locked before the shot and checked afterwards.
    why: The station is not claiming that surface field uniquely determines return-stroke peak current. The forecast is an empirical, uncertain model built from the season's previous triggered strokes. Locking it before the shot prevents hindsight from moving the target; reading the independent clamp afterwards gives the model a chance to fail. Prediction and measurement are separate acts, and only the pair can calibrate a forecast.
  - group: COUPLE
    task: Read what the second cell did to the timing
    title: What used up the safety margin?
    reason: >-
      Hal Brenner has said all season that a fast cell does not care about a countdown, and today's second cell is the afternoon that finally tests his argument against the clock.
    place: Outstation
    scene: At 2:00 the second cell is 30 km out. By 2:20 it is 11 km away. The crew door closes at 2:25. At 2:30 the first natural strike flashes and the rebuilt outstation telemetry disappears from the wall.
    guide: >-
      Four candidates for what failed, and everybody did what they were told. Ask of each whether the evidence supports it. The rule was followed. The crew were inside. The second cell was tracked the whole way. What was left was five minutes, where the projection had allowed more. Something in the plan was wrong, and it was not the people.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
    assumes:
    - a nowcast projects a cell forward from where the radar last saw it
    takeaway: A lead-time rule must survive real variation in the process it is trying to outrun.
    format: CHOICE
    question: What failed this afternoon?
    why: The crew followed the rule and still had only five minutes of margin. The cell covered 19 km in 20 minutes, faster than the lead-time model expected. Everyone was inside before the first strike, so the failure is not that the crew ignored the rule. The model did not cover this fast-moving case. A safety rule must be based on the distribution of real lead times and an explicit risk criterion, not on the average cell.
    choices:
    - The lead time, which the second cell used up faster than projected
    - The launch rule, because its thresholds were set at the wrong field values
    - The radar, which lost the second cell behind the first
    - The crew, who were slower coming in than the rule allows for
    answer: The lead time, which the second cell used up faster than projected
    rebuttals:
    - The thresholds were met in order and with their stated lead times in hand.
    - Both cells were tracked throughout; the second one was seen and its speed was projected from its history.
    - The crew were inside the time the rule allows, which is what makes this a lead-time failure rather than a discipline one.
  - group: BANK
    task: Move the remaining usable-sky assumption to its pessimistic end, then choose the plan that still preserves safe field science.
    title: What plan survives a bad-weather season?
    reason: >-
      Adeyinka Vero and Hal Brenner need a plan for the rest of the season now that a strike has taken the outstation trailer out of service.
    place: Impulse Hall
    scene: A strike has taken the outstation trailer out for the season. Nobody was inside. The mast, shunts and grid still work, while the impulse hall remains available. Vero and Brenner need a plan before the next storm window opens.
    guide: >-
      Slide the usable storm days down to five and watch which plans go dark. A plan has to keep safe field measurements possible and fit inside the season that is left. The trailer is gone for the year, so anything that depends on it is not a plan. Choose the one that still stands at the pessimistic end of the range.
    background:
    - >-
      Why the pessimistic end rather than the middle. The number of usable storm days is a forecast with a wide spread, and a plan chosen at the expected value fails half the time. Testing at the low end costs nothing now and is the only version of the choice that survives a poor season.
    - >-
      What the strike actually removed. The outstation trailer is out and nobody was inside it. So the loss is instrumentation coverage rather than people, and the plans that leaned on remote measurements have lost their instrument. The mast, the shunts and the grid still work.
    - >-
      Why the impulse hall changes the answer. Bench work does not need storm days at all. A plan that shifts weight onto the hall is a plan whose progress does not depend on the weather, which is exactly what a shortened season rewards.
    assumes:
    - a station has a fixed amount of time and more than one way to spend it
    takeaway: A robust plan is one that still meets its essential constraints when the scarce resource arrives at the pessimistic end.
    format: STRESS
    question: Which remaining-season plan still works if the station gets far fewer usable storm days than the calendar suggests?
    stress:
      hint: Move usable storm days down to five. A plan must preserve safe field measurements and fit inside the remaining sky. The plan with the highest nominal return is not automatically robust.
      assumption:
        id: usable_days
        label: Usable storm days remaining
        min: 5
        max: 15
        step: 1
        nominal: 15
        unit: days
      criteria:
      - id: field_evidence
        label: Retains natural-strike measurements
        operator: ">="
        target: 1
        key: field_evidence
      - id: revised_safety
        label: Uses a tightened call-in rule after the lead-time failure
        operator: ">="
        target: 1
        key: revised_safety
      - id: science_return
        label: Science return at nominal sky
        direction: higher_is_better
        key: science_return
      candidates:
      - id: rebuild
        label: Rebuild the trailer first
      - id: mixed
        label: Keep field shots; move coupling to hall; tighten call-in
      - id: hall_only
        label: Stop field triggering and use the hall only
      - id: unchanged
        label: Continue the original field plan unchanged
      robust: mixed
      optimiseOn: science_return
      feasible:
        rebuild: 12
        mixed: 5
        hall_only: 16
        unchanged: 16
      scores:
        rebuild:
          field_evidence: 1
          revised_safety: 1
          science_return: 100
        mixed:
          field_evidence: 1
          revised_safety: 1
          science_return: 85
        hall_only:
          field_evidence: 0
          revised_safety: 1
          science_return: 60
        unchanged:
          field_evidence: 1
          revised_safety: 0
          science_return: 95
    answerText: Keep the field programme, move coupling work into the hall, and tighten the call-in rule. In the authored stress table, that mixed plan is the only candidate that remains feasible at five usable storm days.
    why: Rebuilding the trailer can recover the original measurement set, but it spends storm days the station is trying to use. Hall-only work is safe but gives up the remaining natural-strike record. Continuing unchanged ignores the lead-time failure that just occurred. The mixed plan keeps the mast programme, moves coupling tests into the hall and tightens the field call-in rule. It is not the richest plan under a generous season. It is the only one that still produces safe field evidence when usable sky becomes scarce.
  # ---------------------------------------------------------------- day 13
- title: What the instruments missed
  objective: Use the mill input circuit to bound its response time, then choose the channels that can actually resolve a microsecond stroke.
  briefing: An instrument can produce a clean trace of something it was too slow to measure.
  stake: >-
    Wednesday. Tuesday's record contains a smooth field change but no microsecond front. Before anyone calls that evidence about the stroke, solve the mill's response time and decide what the instrument was physically capable of seeing.
  takeaway: An instrument's time constant decides what it is evidence about, and no amount of care with a slow instrument makes it a fast one.
  segue: >-
    The electrometer input alone has a 1 ms time constant — already about a thousand times slower than a 1 µs front. The mill can support claims about slower field changes, not the stroke rise itself. Fast current and electric-field channels are now the witnesses that can test the coupling prediction. One hall shot remains.
  stops:
  - group: EARTH
    task: Derive the discharge of the electrometer and its time constant
    title: Could the mill ever see a microsecond?
    reason: >-
      Mira Halvorsen wants the mill's own electrometer circuit solved for once, instead of guessed at, since the time constant decides what two seasons of readings can actually be trusted to show.
    place: Field Station
    scene: The field mill's input is 10 MΩ across about 100 pF. Halvorsen puts the two numbers beside a one-microsecond stroke front. The question is whether the instrument can follow that event or only what remains after it.
    guide: >-
      Build it a line at a time. The loop equation gives a differential equation in the charge, and the current out of the capacitor is minus dq/dt. Separate and integrate to get the charge as a function of time, then read off the time constant. Finish by comparing it with a one-microsecond stroke front.
    background:
    - >-
      Why this is the same equation as the river. Charge leaving in proportion to how much is there gives an exponential decay, which is the recession curve, the cooling cup and the decaying nucleus. Recognising the form is most of the work, and the constant that comes out has units of time.
    - >-
      What the time constant tells you. R times C is the time to fall to about a third. Ten megohms across a hundred picofarads gives a millisecond, which is a thousand times longer than the microsecond front of a stroke.
    - >-
      What that means for the instrument. The electrometer cannot follow the front at all; it reports what remains once the fast part is over. So the mill's record is a statement about the slowly varying field, and reading a stroke's peak off it is reading something the circuit never saw.
    assumes:
    - the loop rule holds around any closed circuit
    - the current out of a capacitor is the rate at which its charge falls
    takeaway: A known bandwidth limit can rule out a measurement even before every other part of the instrument is modeled.
    format: DERIVE
    question: Solve the electrometer's discharge, and get the time it needs to respond.
    answerText: q(t) = Qe^(−t/RC) with RC = 1.0 ms. The electrometer input alone is already about a thousand times slower than a 1 µs front, so the complete field mill cannot resolve that front.
    why: The input RC time constant is 10 MΩ × 100 pF = 1 ms. That is a lower bound on how fast this measurement chain can respond; the field mill's mechanical modulation and later electronics can only add more bandwidth limits. A 1 µs stroke front is therefore outside the channel's response. The mill can still measure slower changes in ambient field before and after the stroke. What it cannot honestly supply is the stroke rise time or peak field on a microsecond scale.
    derive:
      hint: Loop rule first, then separate the variables and integrate.
      start: q/C + IR = 0 around the loop
      startNote: R = 1.0 × 10⁷ Ω, C = 1.0 × 10⁻¹⁰ F, and the current out of the capacitor is I = −dq/dt
      goal: the charge as a function of time, and the time constant
      askRule: true
      rules:
      - Gauss's law
      - symmetry argument
      - superposition
      - separation of variables
      - rearrangement
      - boundary condition
      steps:
      - ask: Put the current in terms of the charge.
        answer: 2
        candidates:
        - text: q/C + R(dq/dt) = 0
          rule: rearrangement
          survives: true
          why: The sign of the current has been dropped. It integrates just as cleanly to a growing exponential, which says the electrometer charges itself up out of nothing and never comes back.
        - text: q/C + R(d²q/dt²) = 0
          rule: rearrangement
          why: A second derivative belongs to a circuit with an inductance in it. There is none here, and this predicts an oscillation nobody has ever seen on this bench.
        - text: q/C − R(dq/dt) = 0
          rule: rearrangement
        - text: q/C + IR = 0 with I taken as constant
          rule: boundary condition
          why: A constant current empties the capacitor in a straight line and stops. That is a different circuit — a current source rather than a resistor.
      - ask: Separate the variables.
        answer: 0
        candidates:
        - text: dq/q = dt/(RC)
          rule: separation of variables
        - text: dq/q = RC dt
          rule: separation of variables
          survives: true
          why: RC has moved to the top. It integrates perfectly well and gives a time constant of one over RC — a million per second rather than a millisecond, which happens to be the answer everybody wants and is dimensionally impossible.
        - text: q dq = dt/(RC)
          rule: rearrangement
          why: The q has moved to the wrong side. This integrates to a square root in time, which is the solution to a different equation entirely.
        - text: dq = q·dt
          rule: rearrangement
          why: The resistance and the capacitance have both disappeared, which would make every circuit respond at the same speed.
      - ask: Integrate both sides and apply the starting charge.
        answer: 1
        candidates:
        - text: ln q = t/(RC) + k, so q = Q·e^(t/RC)
          rule: boundary condition
          survives: true
          why: Same sign slip as the first branch, arriving one line later. It fits the starting charge exactly and then grows without limit.
        - text: ln q = −t/(RC) + k, so q = Q·e^(−t/RC)
          rule: separation of variables
        - text: q = Q − t/(RC)
          rule: rearrangement
          why: That is what you get by integrating the right-hand side and forgetting the left one. A capacitor discharging linearly would reach negative charge and stop being a capacitor.
        - text: q = Q·e^(−RC·t)
          rule: rearrangement
          why: RC is a time and it belongs under t, not multiplying it. As written the exponent has units of seconds squared.
      - ask: Put the numbers in and compare with the stroke.
        answer: 3
        candidates:
        - text: RC = 10⁷ × 10⁻¹⁰ = 10⁻³ s, about the length of the stroke
          rule: rearrangement
          why: The arithmetic is right and the comparison is not. The stroke front is a microsecond and the whole stroke about a hundred, both far shorter than this.
        - text: RC = 10⁷/10⁻¹⁰ = 10¹⁷ s
          rule: rearrangement
          why: Dividing rather than multiplying gives three billion years, which is a long time to wait for a field reading.
        - text: RC = 10⁻⁷ × 10¹⁰ = 10³ s
          rule: rearrangement
          survives: true
          why: Both exponents inverted, and the product is a clean seventeen minutes. It is wrong by a factor of a million and it reads like a sensible instrument specification.
        - text: RC = 10⁷ × 10⁻¹⁰ = 10⁻³ s, a thousand times the stroke front
          rule: rearrangement
      commit: Commit the derivation
  - group: FIELD
    task: Say what the mill record is evidence of
    title: What does the smooth change actually measure?
    reason: >-
      Mira Halvorsen needs to know what that smooth post-stroke dip is actually evidence of, before Yusuf Kaya writes a caption for it in the season pack.
    place: Field Station
    scene: |-
      All four mills show the same thing: no feature at all during the stroke, then a smooth recovery over the following few seconds. Kaya has to write a caption for the plot in the season report.
    guide: >-
      Four captions for the same plot. Ask of each which timescale it claims. The mill responds in milliseconds, so a microsecond front was averaged away before anything recorded it. What the mill does resolve is the step before and against after, which lasts seconds. Calling the instrument useless is as wrong as claiming it saw the front.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
    assumes:
    - an instrument reports an average over its own response time
    takeaway: A slow instrument is evidence about slow things, and its silence during a fast event is not a measurement of the event.
    format: CHOICE
    question: What is the smooth field-mill record after Tuesday's stroke actually evidence about?
    why: The mill can resolve the slower change in ambient electric field before and after the stroke, but not the microsecond front itself. Under the same cloud-ground model, that slower field change can be converted into an inferred change in effective charge density. The record is therefore evidence about a slow source change, not a measurement of peak current or rise time. Later processing cannot recover temporal information the sensor never resolved.
    choices:
    - The slower change in ambient electric field before and after the stroke
    - The peak current hidden inside the smoothed trace
    - The microsecond rise time that produced the trace
    - Nothing at all, because a slow instrument has no useful data
    answer: The slower change in ambient electric field before and after the stroke
    rebuttals:
    - Smoothing at a thousand to one does not leave the peak recoverable; the information is gone rather than hidden.
    - The depth of the dip is set by the charge transferred, and the front is far too short to influence it.
    - The before-and-after step is a real measurement, so dismissing the record entirely throws away the charge.
  - group: MAST
    task: Choose the right instrument for the front
    title: Which channels belong on a microsecond?
    at: record-budget
    reason: >-
      Kenji Nakata has a record budget and has to pick the instrument that can actually follow a microsecond front, rather than the one that is already on the shelf.
    place: Screened Room
    scene: |-
      Nakata has four instruments in the cabinet and a request from the review for the rise time of the next stroke. Each one has a response time written on its case.
    guide: >-
      A fixed afternoon of installation time, and a list of instruments that wants more of it than there is. Buy the ones that can actually see a microsecond front, and read off what your choice stops the station being able to report. Everything here measures something real; what the plan cannot answer is the price of what it can.
    background:
    - >-
      What a response time does. An instrument reports honestly inside its own band and produces a number outside it — a smoothed, late, smaller version of what happened. That number is wrong rather than merely imprecise, and nothing in the record says so.
    - >-
      Why a microsecond front is the hard case. To resolve a rise you need a response several times faster than the rise itself. A 20-millisecond instrument facing a 2-microsecond front reports a broad low bump: the peak is understated by a factor of ten and the front is invisible.
    - >-
      What the slow instruments are still for. Charge transferred, continuing current and the hour-scale field are all real quantities that the fast channels do not capture, and the review is not the only reader of this record. The plan is a choice about which questions the station can answer next season, not about which instruments are good.
    assumes:
    - an instrument reports honestly only within its own band
    takeaway: Choosing an instrument is choosing a band, and a measurement outside it is wrong rather than merely imprecise.
    format: ALLOCATE
    question: One afternoon of installation time. Fit the channels, and know what the fit stops the station reporting.
    answerText: Install the 10 ns current transformer, the fast electric-field antenna and the common timing channel. Those are the channels that can resolve and align a microsecond front. With only six installation hours, that choice means giving up at least one slower season-long measurement.
    why: 'A microsecond-scale rise needs sensors and a recording chain substantially faster than a microsecond. The 10 ns current transformer and 100 ns fast electric-field antenna can resolve that front; the 20 ms integrator and hour-scale logger cannot. Slow instruments are not “bad” — they answer different questions such as total transferred charge and long-term field. The installation decision should therefore state both what the fast package gains and which slow quantities will no longer be measured.'
    allocate:
      hint: Nothing on this list is a wrong thing to fit. What the record cannot answer is the price of what it can.
      pool:
        amount: 6
        unit: hours of installation time
        mode: scalar
      items:
      - id: mains
        label: Bond and earth the instrument cabinet
        cost: 1.5
        protected: true
        note: nothing else in the cabinet is trustworthy without it
      - id: ct
        label: 10 ns current transformer on the down-conductor
        cost: 2.0
        note: the only channel that resolves the front
      - id: mill
        label: 100 ns fast electric-field antenna on the mast platform
        cost: 1.5
      - id: integrator
        label: 20 ms charge-transfer integrator
        cost: 1.5
      - id: logger
        label: Hour-scale field logger for the season record
        cost: 1.0
      - id: trigger
        label: Common trigger and timestamp distribution
        cost: 1.0
      answers:
      - question: Can the station report the rise time of the next stroke?
        requires:
        - ct
        required: true
      - question: Can two channels be lined up on one time base?
        requires:
        - trigger
      - question: Can the fast electric field at the platform be resolved during the stroke?
        requires:
        - mill
      - question: Can total charge transferred be reported for the season?
        requires:
        - integrator
      - question: Is the diurnal field record continued?
        requires:
        - logger
      commit: Commit the afternoon's fit

  # ---------------------------------------------------------------- day 14
  - group: SHOT
    task: Sort the night's returns before the log closes.
    title: Storm or electronics?
    at: radar-desk
    reason: >-
      Yusuf Kaya has more triggers on the night's log than the record can carry, and has to sort which ones are current on the mast and which are the recording chain reacting to itself.
    concept: "Instrument bandwidth: what a slow instrument cannot see"
    place: Launch Control
    scene: The night produced more triggers than the log can carry. Some of them are current going down the mast. The rest are the recording chain reacting to the same storm, and both arrive as a trace with a rise time.
    guide: >-
      Use multiple clues. A real stroke should be coincident on the independent fast channels with timing the geometry allows. A single-channel event, a pre-trigger edge, or an edge faster than that channel can physically produce is strong evidence for an artifact.
    background:
    - A measured edge faster than the known response of the sensor/channel cannot have been faithfully produced by that sensor; the artifact must have entered later in the chain or the response specification is wrong.
    - Coincidence across independent current and fast-field channels is strong evidence for a real site event. Lack of coincidence is evidence against that interpretation, though channel dropout must still be considered in real analysis.
    - The point of the sort is not that one clue proves the origin. It is that independent timing and bandwidth constraints can make an instrumentation explanation far more likely than a weather explanation.
    assumes:
    - an instrument can only report what it is fast enough to see
    takeaway: A trace faster than the instrument was not made by the weather.
    format: BELT
    question: Send each trigger to the bin that says whether the storm or the chain made it.
    answerText: Anything coincident across channels with a resolvable rise is a strike. Anything single-channel, pre-trigger or faster than the sensor is the chain.
    why: >-
      Every trace has passed through a sensor, cable and digitiser, and any of those can create artifacts. Two powerful checks are bandwidth and independent coincidence. If a recorded edge is faster than the channel can physically respond, the edge was not a faithful measurement of the weather. If current and fast-field channels at independent stations coincide at physically consistent times, a real stroke is strongly supported. The authored belt gives clean examples for the game; a real analysis would also allow missing channels and ambiguous cases.
    belt:
      left: {name: A real stroke}
      right: {name: The chain}
      need: 20
      lives: 3
      pass: 0.8
      hint: Ask whether anything else saw it, and whether the sensor was fast enough to.
      items:
      - {name: Coincident on four, bin: left}
      - {name: Fast E agrees, bin: left}
      - {name: Rise within bandwidth, bin: left}
      - {name: Remote station agrees, bin: left}
      - {name: Timing fits geometry, bin: left}
      - {name: Thunder follows correctly, bin: left}
      - {name: Two channels coincide, bin: left}
      - {name: Plausible stroke intervals, bin: left}
      - {name: Continuing current tail, bin: left}

  - title: Predict it, then measure it
    objective: Commit to a number before the stroke, and find out what a forecast is worth.
    briefing: A cell for the afternoon, and a prediction that has to be written before it arrives.
    stake: >-
      Tuesday, and there is a cell forecast for two o'clock. Vero wants the season's first
      prediction on the board before it: peak current, written down, from the field and the charge
      the station has now measured. Brenner has the nowcast open and is unhappy with how fast the
      cell is tracking. Today you commit to a number, fire, and measure — and the afternoon ends
      with the crew coming in late off the flat and a trailer nobody can use, which is the
      argument Brenner has been making since week one.
    takeaway: A prediction that is never measured against anything is an opinion with a unit after it.
    stops:
      - group: SHOT
        task: Predict the peak, fire, and measure it
        title: The number on the board
        place: Launch Control
        scene: |-
          The board has a space for a predicted peak current and Vero wants it filled before the rocket leaves the rail. The clamp will give the answer forty minutes later, if anybody goes out and reads it.
        guide: >-
          Lock a predicted peak current before the rocket flies. It cannot be edited
          afterwards, which is the point. The rocket goes up whatever you write. Then
          decide whether to spend half an hour of a storm afternoon walking out to read
          the clamp. Not measuring is an answer too, and a poor one.
        background:
          - >-
              Why the prediction is locked. A number written after the event is not a
              prediction. The failure is not dishonesty but memory: with the clamp reading
              in front of you, it is genuinely hard to recall how confident you were.
              Committing first is a procedure that protects you from yourself.
          - >-
              What the walk actually costs. Forty minutes, on an afternoon with a cell
              coming in, is time not spent on the mills or the launch rail. That is a real
              cost, and it is why the panel makes you decide rather than assuming somebody
              will go.
          - >-
              What is lost by not going. An unmeasured prediction can never be wrong, which
              is exactly what makes it worthless. A station that predicts and never checks
              accumulates confidence rather than calibration, and the review has no way to
              tell the two apart.
        assumes:
          - a prediction is only a prediction if it is recorded before the outcome
          - reading an instrument after the event is a decision with a cost
        takeaway: Predicting and measuring are two separate acts, and skipping the second one is its own kind of failure.
        format: VERIFY
        question: Commit to a peak current for this stroke, fire the shot, and then decide whether to go out and read it.
        verify:
          hint: The rocket will fly whatever you predict. The measurement costs half an hour of a day that has a cell in it.
          prediction:
            label: Peak current of this stroke
            unit: kA
            min: 5
            max: 60
            step: 1
          truth: 41
          passRatio: [0.6, 1.6]
          intervention:
            label: Fire the rocket at 6.1 kV/m
            note: the wire goes up, the channel forms and the stroke comes down it
            outcome: a single return stroke down one channel, recorded on every station
          measurement:
            label: Walk out and read the clamp
            note: forty minutes of an afternoon with a second cell behind this one
            cost: 0.7
            costUnit: h
          unmeasuredMoral: A predicted peak with no measurement beside it is the station's opinion of itself, and the season log has three of those in it already.
        answerText: The measured peak is 41 kA. Predictions from roughly 25 to 65 kA would pass this authored comparison. The essential step is reading the clamp afterwards; an unchecked prediction cannot test the model.
        why: Prediction and measurement are separate acts, and only the pair tests the model. A number written before the shot can be wrong. A number never checked cannot be. The accepted range is deliberately broad because the field reading predicts only the scale of the peak, not an exact current. Going to the clamp afterwards is therefore part of the experiment, not paperwork. The station learns only when the committed prediction is compared with a measurement that had a real chance to disagree.
      - group: COUPLE
        task: Read what the second cell did to the timing
        title: The afternoon Brenner is right about
        place: Outstation
        scene: At 2:00 the second cell is thirty kilometres out. By 2:20 it is eleven kilometres away. The crew door closes at 2:25. At 2:30 the first natural strike flashes and the outstation telemetry disappears from the wall.
        guide: >-
          Four candidates for what failed, and everybody did what they were told. Ask of
          each whether the evidence supports it. The rule was followed. The crew were
          inside. The second cell was tracked the whole way. What was left was five
          minutes, where the projection had allowed more. Something in the plan was
          wrong, and it was not the people.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a nowcast projects a cell forward from where the radar last saw it
        takeaway: A lead-time rule must survive real variation in the process it is trying to outrun.
        format: CHOICE
        question: What failed this afternoon?
        why: The crew followed the rule and still lost the margin. The second cell covered nineteen kilometres in twenty minutes, faster than the projection had allowed. Everyone was inside before the first natural strike, but only by five minutes. That is Brenner's argument becoming an observation. The problem is not that Vero ignored the rule or that the crew moved slowly. The lead-time model itself failed on this cell. Day four showed the same rule working; today shows the case it did not cover.
        choices:
          - The lead time, which the second cell used up faster than projected
          - The launch rule, because its thresholds were set at the wrong field values
          - The radar, which lost the second cell behind the first
          - The crew, who were slower coming in than the rule allows for
        answer: The lead time, which the second cell used up faster than projected
        rebuttals:
          - The thresholds were met in order and with their stated lead times in hand.
          - Both cells were tracked throughout; the second one was seen and its speed was projected from its history.
          - The crew were inside the time the rule allows, which is what makes this a lead-time failure rather than a discipline one.
      - group: BANK
        task: Move the remaining usable-sky assumption to its pessimistic end, then choose the plan that still preserves safe field science.
        title: What survives a shorter season
        place: Impulse Hall
        scene: A strike has taken the outstation trailer out for the season. Nobody was inside. The mast, shunts and grid still work, while the impulse hall remains available. Vero and Brenner need a plan before the next storm window opens.
        guide: >-
          Slide the usable storm days down to five and watch which plans go dark. A plan
          has to keep safe field measurements possible and fit inside the season that is
          left. The trailer is gone for the year, so anything that depends on it is not
          a plan. Choose the one that still stands at the pessimistic end of the range.
        background:
          - >-
              Why the pessimistic end rather than the middle. The number of usable storm
              days is a forecast with a wide spread, and a plan chosen at the expected value
              fails half the time. Testing at the low end costs nothing now and is the only
              version of the choice that survives a poor season.
          - >-
              What the strike actually removed. The outstation trailer is out and nobody was
              inside it. So the loss is instrumentation coverage rather than people, and the
              plans that leaned on remote measurements have lost their instrument. The mast,
              the shunts and the grid still work.
          - >-
              Why the impulse hall changes the answer. Bench work does not need storm days
              at all. A plan that shifts weight onto the hall is a plan whose progress does
              not depend on the weather, which is exactly what a shortened season rewards.
        assumes:
          - a station has a fixed amount of time and more than one way to spend it
        takeaway: A robust plan is one that still meets its essential constraints when the scarce resource arrives at the pessimistic end.
        format: STRESS
        question: Which remaining-season plan still works if the station gets far fewer usable storm days than the calendar suggests?
        stress:
          hint: Move usable storm days down to five. A plan must preserve safe field measurements and fit inside the remaining sky. The plan with the highest nominal return is not automatically robust.
          assumption:
            id: usable_days
            label: Usable storm days remaining
            min: 5
            max: 15
            step: 1
            nominal: 15
            unit: days
          criteria:
            - id: field_evidence
              label: Retains natural-strike measurements
              operator: ">="
              target: 1
              key: field_evidence
            - id: revised_safety
              label: Uses a tightened call-in rule after the lead-time failure
              operator: ">="
              target: 1
              key: revised_safety
            - id: science_return
              label: Science return at nominal sky
              direction: higher_is_better
              key: science_return
          candidates:
            - id: rebuild
              label: Rebuild the trailer first
            - id: mixed
              label: Keep field shots; move coupling to hall; tighten call-in
            - id: hall_only
              label: Stop field triggering and use the hall only
            - id: unchanged
              label: Continue the original field plan unchanged
          robust: mixed
          optimiseOn: science_return
          feasible:
            rebuild: 12
            mixed: 5
            hall_only: 16
            unchanged: 16
          scores:
            rebuild:
              field_evidence: 1
              revised_safety: 1
              science_return: 100
            mixed:
              field_evidence: 1
              revised_safety: 1
              science_return: 85
            hall_only:
              field_evidence: 0
              revised_safety: 1
              science_return: 60
            unchanged:
              field_evidence: 1
              revised_safety: 0
              science_return: 95
        answerText: Keep the field programme, move coupling work into the hall, and tighten the call-in rule. In the authored stress table, that mixed plan is the only candidate that remains feasible at five usable storm days.
        why: Rebuilding the trailer can recover the original measurement set, but it spends storm days the station is trying to use. Hall-only work is safe but gives up the remaining natural-strike record. Continuing unchanged ignores the lead-time failure that just occurred. The mixed plan keeps the mast programme, moves coupling tests into the hall and tightens the field call-in rule. It is not the richest plan under a generous season. It is the only one that still produces safe field evidence when usable sky becomes scarce.
  # ---------------------------------------------------------------- day 13
  - title: What the mill cannot see
    objective: Solve the electrometer's circuit, and find out what its time constant costs.
    briefing: The mills report the slow field, and nobody has written down how slow.
    stake: >-
      Wednesday, and the record of Tuesday's stroke has a hole in the middle of it. The clamp
      caught the current and the shunts caught the current, and all four field mills recorded a
      smooth dip that only begins after the stroke was over. Mira Halvorsen has been saying for
      two seasons that the mills are slow and has never been asked how slow. Kaya needs a caption
      for the plot before the pack closes. Today you solve the electrometer's own circuit, get its
      time constant out of the solution rather than off a data sheet, and settle what the mill
      record is evidence about and what it is silent on.
    takeaway: An instrument's time constant decides what it is evidence about, and no amount of care with a slow instrument makes it a fast one.
    stops:
      - group: EARTH
        task: Derive the discharge of the electrometer and its time constant
        title: The circuit that decides what is recordable
        place: Field Station
        scene: The field mill's input is 10 MΩ across about 100 pF. Halvorsen puts the two numbers beside a one-microsecond stroke front. The question is whether the instrument can follow that event or only what remains after it.
        guide: >-
          Build it a line at a time. The loop equation gives a differential equation in
          the charge, and the current out of the capacitor is minus dq/dt. Separate and
          integrate to get the charge as a function of time, then read off the time
          constant. Finish by comparing it with a one-microsecond stroke front.
        background:
          - >-
              Why this is the same equation as the river. Charge leaving in proportion to
              how much is there gives an exponential decay, which is the recession curve,
              the cooling cup and the decaying nucleus. Recognising the form is most of the
              work, and the constant that comes out has units of time.
          - >-
              What the time constant tells you. R times C is the time to fall to about a
              third. Ten megohms across a hundred picofarads gives a millisecond, which is a
              thousand times longer than the microsecond front of a stroke.
          - >-
              What that means for the instrument. The electrometer cannot follow the front
              at all; it reports what remains once the fast part is over. So the mill's
              record is a statement about the slowly varying field, and reading a stroke's
              peak off it is reading something the circuit never saw.
        assumes:
          - the loop rule holds around any closed circuit
          - the current out of a capacitor is the rate at which its charge falls
        takeaway: The exponential is not assumed; it is what comes out of the loop rule when the current is the derivative of the charge.
        format: DERIVE
        question: Solve the electrometer's discharge, and get the time it needs to respond.
        answerText: q(t) = Q·e^(−t/RC) with RC = 1.0 × 10⁻³ s. A millisecond, against a stroke front of one microsecond — the mill responds a thousand times too slowly to see it.
        why: The input time constant is RC = 10 MΩ × 100 pF = 1 ms. A stroke front lasts about 1 µs, so the instrument responds a thousand times too slowly to follow it. The mill is not broken and the data are not noise. The circuit averages changes that are much faster than its response. That makes the post-stroke field shift useful evidence about cloud charge, while the microsecond front is effectively absent. Bandwidth decides what an instrument can honestly claim.
        derive:
          hint: Loop rule first, then separate the variables and integrate.
          start: q/C + IR = 0 around the loop
          startNote: R = 1.0 × 10⁷ Ω, C = 1.0 × 10⁻¹⁰ F, and the current out of the capacitor is I = −dq/dt
          goal: the charge as a function of time, and the time constant
          askRule: true
          rules:
            - Gauss's law
            - symmetry argument
            - superposition
            - separation of variables
            - rearrangement
            - boundary condition
          steps:
            - ask: Put the current in terms of the charge.
              answer: 2
              candidates:
                - text: q/C + R(dq/dt) = 0
                  rule: rearrangement
                  survives: true
                  why: The sign of the current has been dropped. It integrates just as cleanly to a growing exponential, which says the electrometer charges itself up out of nothing and never comes back.
                - text: q/C + R(d²q/dt²) = 0
                  rule: rearrangement
                  why: A second derivative belongs to a circuit with an inductance in it. There is none here, and this predicts an oscillation nobody has ever seen on this bench.
                - text: q/C − R(dq/dt) = 0
                  rule: rearrangement
                - text: q/C + IR = 0 with I taken as constant
                  rule: boundary condition
                  why: A constant current empties the capacitor in a straight line and stops. That is a different circuit — a current source rather than a resistor.
            - ask: Separate the variables.
              answer: 0
              candidates:
                - text: dq/q = dt/(RC)
                  rule: separation of variables
                - text: dq/q = RC dt
                  rule: separation of variables
                  survives: true
                  why: RC has moved to the top. It integrates perfectly well and gives a time constant of one over RC — a million per second rather than a millisecond, which happens to be the answer everybody wants and is dimensionally impossible.
                - text: q dq = dt/(RC)
                  rule: rearrangement
                  why: The q has moved to the wrong side. This integrates to a square root in time, which is the solution to a different equation entirely.
                - text: dq = q·dt
                  rule: rearrangement
                  why: The resistance and the capacitance have both disappeared, which would make every circuit respond at the same speed.
            - ask: Integrate both sides and apply the starting charge.
              answer: 1
              candidates:
                - text: ln q = t/(RC) + k, so q = Q·e^(t/RC)
                  rule: boundary condition
                  survives: true
                  why: Same sign slip as the first branch, arriving one line later. It fits the starting charge exactly and then grows without limit.
                - text: ln q = −t/(RC) + k, so q = Q·e^(−t/RC)
                  rule: separation of variables
                - text: q = Q − t/(RC)
                  rule: rearrangement
                  why: That is what you get by integrating the right-hand side and forgetting the left one. A capacitor discharging linearly would reach negative charge and stop being a capacitor.
                - text: q = Q·e^(−RC·t)
                  rule: rearrangement
                  why: RC is a time and it belongs under t, not multiplying it. As written the exponent has units of seconds squared.
            - ask: Put the numbers in and compare with the stroke.
              answer: 3
              candidates:
                - text: RC = 10⁷ × 10⁻¹⁰ = 10⁻³ s, about the length of the stroke
                  rule: rearrangement
                  why: The arithmetic is right and the comparison is not. The stroke front is a microsecond and the whole stroke about a hundred, both far shorter than this.
                - text: RC = 10⁷/10⁻¹⁰ = 10¹⁷ s
                  rule: rearrangement
                  why: Dividing rather than multiplying gives three billion years, which is a long time to wait for a field reading.
                - text: RC = 10⁻⁷ × 10¹⁰ = 10³ s
                  rule: rearrangement
                  survives: true
                  why: Both exponents inverted, and the product is a clean seventeen minutes. It is wrong by a factor of a million and it reads like a sensible instrument specification.
                - text: RC = 10⁷ × 10⁻¹⁰ = 10⁻³ s, a thousand times the stroke front
                  rule: rearrangement
          commit: Commit the derivation
      - group: FIELD
        task: Say what the mill record is evidence of
        title: The dip after the stroke
        place: Field Station
        scene: |-
          All four mills show the same thing: no feature at all during the stroke, then a smooth recovery over the following few seconds. Kaya has to write a caption for the plot in the season report.
        guide: >-
          Four captions for the same plot. Ask of each which timescale it claims. The
          mill responds in milliseconds, so a microsecond front was averaged away before
          anything recorded it. What the mill does resolve is the step before and
          against after, which lasts seconds. Calling the instrument useless is as wrong
          as claiming it saw the front.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - an instrument reports an average over its own response time
        takeaway: A slow instrument is evidence about slow things, and its silence during a fast event is not a measurement of the event.
        format: CHOICE
        question: What is the mill record of Tuesday's stroke evidence about?
        why: The field step before and after the stroke persists much longer than the mill's millisecond response. That makes it a real measurement of the source changing. The microsecond front is different. The circuit averages it away before the recorder can follow it, and later processing cannot reconstruct information the instrument never resolved. Calling the mill useless would also be wrong. It measures the slower electric-field change well. The record needs a caption that states which time scale the instrument actually observed.
        choices:
          - How much charge the cell lost in the seconds after
          - The peak current, which the mill smoothed out but still contains
          - The rise time, which set the depth of the recorded dip
          - Nothing at all, since the instrument was too slow to be used
        answer: How much charge the cell lost in the seconds after
        rebuttals:
          - Smoothing at a thousand to one does not leave the peak recoverable; the information is gone rather than hidden.
          - The depth of the dip is set by the charge transferred, and the front is far too short to influence it.
          - The before-and-after step is a real measurement, so dismissing the record entirely throws away the charge.
      - group: MAST
        task: Choose the right instrument for the front
        title: What to put on a microsecond
        place: Screened Room
        scene: |-
          Nakata has four instruments in the cabinet and a request from the review for the rise time of the next stroke. Each one has a response time written on its case.
        guide: >-
          A fixed afternoon of installation time, and a list of instruments that wants more of
          it than there is. Buy the ones that can actually see a microsecond front, and read
          off what your choice stops the station being able to report. Everything here measures
          something real; what the plan cannot answer is the price of what it can.
        background:
          - >-
              What a response time does. An instrument reports honestly inside its own band and
              produces a number outside it — a smoothed, late, smaller version of what happened. That
              number is wrong rather than merely imprecise, and nothing in the record says so.
          - >-
              Why a microsecond front is the hard case. To resolve a rise you need a response several
              times faster than the rise itself. A 20-millisecond instrument facing a 2-microsecond
              front reports a broad low bump: the peak is understated by a factor of ten and the front
              is invisible.
          - >-
              What the slow instruments are still for. Charge transferred, continuing current and the
              hour-scale field are all real quantities that the fast channels do not capture, and the
              review is not the only reader of this record. The plan is a choice about which
              questions the station can answer next season, not about which instruments are good.
        assumes:
          - an instrument reports honestly only within its own band
        takeaway: Choosing an instrument is choosing a band, and a measurement outside it is wrong rather than merely imprecise.
        format: ALLOCATE
        question: One afternoon of installation time. Fit the channels, and know what the fit stops the station reporting.
        answerText: The 10 ns current transformer and the fast field mill are the only channels that can see the front at all. Fitting them costs the charge-transfer integrator, and the station cannot then report total charge for the season.
        why: An instrument's response time decides which questions it can answer, and a front of about two microseconds needs a channel several times faster than that. The 10 nanosecond current transformer and the 100 nanosecond field mill can both resolve it. The 20 millisecond electrometer and the hour-scale field logger cannot, and they will not fail visibly — they will report a smooth low bump with the peak understated by a factor of ten and no flag anywhere in the record. That is what makes an out-of-band measurement worse than a missing one. But the slow channels measure real quantities the fast ones cannot: charge transferred, continuing current, the diurnal field. The afternoon does not stretch to everything, so the plan is a decision about which questions the station can answer next season — and the honest version of it says out loud that total charge is not one of them.
        allocate:
          hint: Nothing on this list is a wrong thing to fit. What the record cannot answer is the price of what it can.
          pool:
            amount: 6
            unit: hours of installation time
            mode: scalar
          items:
            - id: mains
              label: Bond and earth the instrument cabinet
              cost: 1.5
              protected: true
              note: nothing else in the cabinet is trustworthy without it
            - id: ct
              label: 10 ns current transformer on the down-conductor
              cost: 2.0
              note: the only channel that resolves the front
            - id: mill
              label: 100 ns field mill on the mast platform
              cost: 1.5
            - id: integrator
              label: 20 ms charge-transfer integrator
              cost: 1.5
            - id: logger
              label: Hour-scale field logger for the season record
              cost: 1.0
            - id: trigger
              label: Common trigger and timestamp distribution
              cost: 1.0
          answers:
            - question: Can the station report the rise time of the next stroke?
              requires:
                - ct
              required: true
            - question: Can two channels be lined up on one time base?
              requires:
                - trigger
            - question: Can the field at the platform be resolved during the stroke?
              requires:
                - mill
            - question: Can total charge transferred be reported for the season?
              requires:
                - integrator
            - question: Is the diurnal field record continued?
              requires:
                - logger
          commit: Commit the afternoon's fit

  # ---------------------------------------------------------------- day 14
      - group: SHOT
        task: Sort the night's returns before the log closes.
        title: A strike, or the instrument
        concept: "Instrument bandwidth: what a slow instrument cannot see"
        place: Launch Control
        scene: The night produced more triggers than the log can carry. Some of them are current going down the mast. The rest are the recording chain reacting to the same storm, and both arrive as a trace with a rise time.
        guide: >-
          Two bins. A real stroke arrives on every channel that should see it, with the timing
          the geometry allows, and with a rise the instrument can actually resolve. A chain
          artifact appears on one channel, or arrives before the trigger, or has a rise faster
          than any sensor on the site can report.
        background:
          - >-
              Why bandwidth is the test. An instrument cannot report a rise faster than its own
              response time, so a trace that rises faster than the sensor allows was made after the
              sensor — in the cable, the digitiser or the trigger.
          - >-
              Why coincidence matters. A strike is one event and the site has several instruments. If
              the field mill, the current transformer and the two remote stations disagree about
              whether anything happened, the thing that happened was in one box.
        assumes:
          - an instrument can only report what it is fast enough to see
        takeaway: A trace faster than the instrument was not made by the weather.
        format: BELT
        question: Send each trigger to the bin that says whether the storm or the chain made it.
        answerText: Anything coincident across channels with a resolvable rise is a strike. Anything single-channel, pre-trigger or faster than the sensor is the chain.
        why: >-
          Everything in this log has been through a sensor, a cable and a digitiser, and each
          of those can produce a trace. The two tests that separate them are bandwidth and
          coincidence. No instrument can report a rise faster than its own response time, so a
          front that rises in twenty nanoseconds on a channel whose sensor takes a microsecond
          was manufactured after the sensor — in the cable, the amplifier or the trigger. And a
          strike is a single event seen by a site full of instruments: if the field mill, the
          current transformer and the two remote stations do not agree that something happened,
          then what happened was inside one box. That is why the honest log records both the
          coincidence and the rise time rather than the peak, and it is why a night that
          produced four hundred triggers can contain nine strikes.
        belt:

interiors:
  FIELD:
    caption: Read what is overhead from the ground, and know what the reading can carry.
    standLine: Four mills across the flat and a reference one that never leaves the hut.
    station:
      kind: panel
      title: Mill array
      rows:
        - { label: 'Mill 1, north', value: −4.5 kV/m, status: alarm }
        - { label: Spread across the four, value: 4 %, status: normal }
        - { label: Electrometer time constant, value: 1.0 ms, status: high }
  BANK:
    caption: Stored charge, stored energy, and air that stops insulating.
    standLine: Twelve stages, a hundred nanofarads each, and the earthing stick visibly on.
    station:
      kind: panel
      title: Impulse bank
      rows:
        - { label: Stage voltage, value: 50 kV, status: high }
        - { label: Output at the gaps, value: 600 kV, status: alarm }
        - { label: Stored energy, value: 1500 J, status: alarm }
  MAST:
    caption: Where the current goes, and what it does on the way down.
    standLine: Sixty metres of lattice, three shunts on the down-conductor, one clamp at the base.
    station:
      kind: panel
      title: Down-conductor
      rows:
        - { label: Shunt at 45 m, value: 29.6 kA, status: normal }
        - { label: Clamp at the base, value: 18.2 kA, status: alarm }
        - { label: 'Field at the cabinet, 2 m', value: 3.0 mT, status: high }
  EARTH:
    caption: The grid under the flat, and the difference between an ohm and a microsecond.
    standLine: Twenty-five ohms on the certificate, six metres of copper to the rack.
    station:
      kind: panel
      title: Earthing
      rows:
        - { label: 'Grid resistance, at DC', value: 25 Ω, status: normal }
        - { label: 'Bonding lead, resistive', value: 9 V, status: normal }
        - { label: 'Bonding lead, on the front', value: 180 kV, status: alarm }
  COUPLE:
    caption: How a strike reaches a cable it never touched.
    standLine: Forty metres of signal pair beside the down-conductor, and a trailer at two hundred.
    station:
      kind: panel
      title: Trench coupling
      rows:
        - { label: Parallel run, value: 40 m, status: high }
        - { label: Mutual inductance, value: 6.8 µH, status: high }
        - { label: Induced on the August front, value: 200 kV, status: alarm }
  SHOT:
    caption: When to trigger, what was predicted, and what the record can carry.
    standLine: The season board: every launch, every hold, and the field at the moment of each.
    station:

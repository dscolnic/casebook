  # ---------------------------------------------------------------- day 2
- title: Turn the sky into charge
  objective: Use Gauss's law to infer the effective charge over the flat and test where the ideal shielding model stops matching hardware.
  briefing: The mill gives one number at the ground. You need to know what that number says about the charged layer above it.
  stake: >-
    Tuesday. Yesterday's field mill gave 4.5 kV/m, but that number cannot help with the trailer mystery until you know what source could produce it. Today you turn the field into charge and test where the ideal model stops matching hardware.
  takeaway: Gauss turns a field into a charge whenever a surface can be chosen the field is simple on.
  segue: >-
    The cloud-ground model gives about 4.0 × 10⁻⁸ C/m² — roughly 4 C over the charged area on radar. In the screened room, the ideal prediction is zero field and the probe still sees 40 V/m. The rule for the investigation is now clear: derive the ideal number, then measure what the real hardware does.
  stops:
  - group: FIELD
    task: Derive the charge per square metre from the mill reading
    title: How much charge can make 4.5 kV/m?
    at: mill-bench
    reason: >-
      Mira Halvorsen has the reading on the board, and the station lead wants it in coulombs before the season log calls it a field again.
    concept: Gauss's law, and choosing a surface it can be used on
    place: Field Station
    scene: Mira Halvorsen has 4.5 kV/m on the board. Vero, the station lead, wants the effective charge density that is consistent with the same cloud-ground model the report will use later. Radar puts the charged region near 100 km².
    guide: >-
      You build the working a line at a time. At each step you choose the expression the line above actually gives you. Every wrong branch is legal algebra, so the malformed-line trick will not help. Start from Gauss's law and choose a surface the geometry makes easy. The layer is far wider than it is high, so a pillbox straddling it is the surface that pays.
    background:
    - >-
      Why a pillbox. Gauss's law is true for any closed surface and useful only for one that matches the symmetry. A charged layer much wider than its height looks locally like an infinite sheet. A short flat box through it therefore has field passing through one face and nothing through the sides.
    - >-
      Where the factor of two goes. An isolated sheet drives field out of both faces, giving E = σ/2ε₀. A layer above ground with a conducting flat beneath it has the field on one side only, so the same charge gives twice the field. Which case you are in is a physical question, not an algebraic one.
    - >-
      Why Vero wants coulombs per square metre. A field in kilovolts per metre is what the mill reports. A charge density is what can be compared with other cells, other days and the literature. Converting the reading into the quantity that caused it is the whole point of having a model of the cloud at all.
    assumes:
    - flux out of a closed surface counts the charge inside it
    - a layer far wider than its distance can be treated as unbounded
    takeaway: A wide sheet of charge produces a field that does not depend on distance, which is why a reading at the ground fixes it.
    format: DERIVE
    question: Turn the mill reading into the charge per square metre on the layer above it.
    answerText: For the cloud-ground pair, E ≈ σ/ε₀, so σ ≈ ε₀E = 4.0 × 10⁻⁸ C/m². Over about 100 km², that is roughly 4 C on the effective charged layer.
    why: An isolated infinite sheet makes σ/(2ε₀) on each side. The ground supplies an induced opposite sheet, so between cloud and ground the two fields add and the measured gap field is approximately σ/ε₀. With E = 4.5 kV/m, σ ≈ 4.0 × 10⁻⁸ C/m². Over 100 km² that is about 4 C. This is an effective parallel-sheet model, not a literal map of every charge in a thunderstorm; the value is only as good as the geometry assumption.
    derive:
      hint: Each line has to follow from the one above it, and each one is licensed by a rule.
      start: ∮E·dA = Q_enc/ε₀
      startNote: the measured gap field is E_gap = 4.5 × 10³ V/m, and ε₀ = 8.85 × 10⁻¹² F/m
      goal: the effective charge per square metre on the cloud layer, in coulombs per square metre
      askRule: true
      rules:
      - Gauss's law
      - symmetry argument
      - superposition
      - line integral of E
      - rearrangement
      - boundary condition
      steps:
      - ask: Choose a surface the law can actually be used on.
        answer: 0
        candidates:
        - text: a flat pillbox through the layer, faces parallel to it
          rule: symmetry argument
        - text: a pillbox through the layer, faces perpendicular to it
          rule: symmetry argument
          survives: true
          why: A closed surface, and the integral over it is perfectly well defined. It is also zero for a uniform field, so the derivation runs on and concludes there is no charge anywhere — clean algebra, silent physics.
        - text: a sphere centred on the mast tip
          rule: Gauss's law
          why: The law holds for any closed surface and is only useful where the field is constant on it. On this sphere it is not, so nothing can be taken outside the integral.
        - text: a hemisphere resting on the ground under the mill
          rule: boundary condition
          why: That is not closed until the flat disc is added, and the disc is where the ground is, which is exactly the part being asked about.
      - ask: Add up the flux through the surface you chose.
        answer: 2
        candidates:
        - text: Φ = E_sheet(4πr²)
          rule: superposition
          why: That is the area of a sphere, and there is no sphere here. The pillbox has two flat faces and a short side wall.
        - text: Φ = E_sheet A + E_sheet(2πrh)
          rule: Gauss's law
          why: The field runs along the side wall rather than through it, so the dot product there is zero and the sides contribute nothing however tall the box is.
        - text: Φ = 2E_sheet A, the two faces only
          rule: symmetry argument
        - text: Φ = E_sheet A, one face
          rule: symmetry argument
          survives: true
          why: Counting one face is arithmetically clean and gives a charge density exactly half the true one, which is well inside the range anybody would believe.
      - ask: Set the flux equal to the enclosed charge over ε₀.
        answer: 1
        candidates:
        - text: 2E_sheet A = σAε₀
          rule: Gauss's law
          why: ε₀ divides the charge, it does not multiply it. Written this way the units come out as coulombs per farad and the answer is twenty orders out.
        - text: 2E_sheet A = σA/ε₀
          rule: Gauss's law
        - text: 2E_sheet A = σ/ε₀
          rule: rearrangement
          survives: true
          why: Dropping the area on the right leaves an equation that still solves, and σ then depends on how big a pillbox you happened to draw — which is the tell, and it is only visible if you check the units.
        - text: 2E_sheet = σA/ε₀
          rule: boundary condition
          why: The area belongs on both sides or neither. Here it has been cancelled from the left only.
      - ask: Now include the induced opposite charge on the ground and use the measured gap field.
        answer: 3
        candidates:
        - text: E_gap = 2E_sheet = 2σε₀, so σ = E_gap/(2ε₀)
          rule: rearrangement
          why: ε₀ has moved to the wrong side, and the result has the wrong units for charge density.
        - text: E_sheet = E_gap = 2σ/ε₀, so σ = ε₀E_gap/2 ≈ 2.0 × 10⁻⁸ C/m²
          rule: rearrangement
          survives: true
          why: "That would use the measured gap field as if it were the field from one sheet and then divide by two again."
        - text: E_gap = E_sheet = σ/(2ε₀), so σ = 2ε₀E_gap ≈ 8.0 × 10⁻⁸ C/m²
          rule: rearrangement
          why: That is what you would infer if the measured field were produced by one isolated sheet. Here the induced ground charge contributes a field in the same direction between the two layers.
        - text: E_gap = 2E_sheet = σ/ε₀, so σ = ε₀E_gap ≈ 4.0 × 10⁻⁸ C/m²
          rule: superposition
      commit: Commit the derivation
  - group: BANK
    task: Say what the same law gives between two plates
    title: Why do two plates double the field?
    reason: >-
      Emil Strand wants the factor of two made explicit before the cloud-ground pair is treated like a capacitor later in the week.
    concept: Field of a charged sheet, line and sphere
    place: Impulse Hall
    scene: The high-voltage engineer, Strand, has two plates a metre apart with equal and opposite surface charge. Beside them is the one-sheet model from yesterday. The two setups use the same σ, and he asks why the field between the plates is different.
    guide: >-
      Four explanations for a factor of two. Ask of each whether it changes the law or adds a source. Both setups use the same charge per unit area, so nothing about the charge has doubled. What has changed is how many sheets contribute in the gap. And note what happens outside the pair, where the two contributions point opposite ways.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
    assumes:
    - fields from separate charges add as vectors
    takeaway: Electric fields from separate sources add as vectors, so geometry decides whether their contributions reinforce or cancel.
    format: CHOICE
    question: Why is the field between two charged plates twice that of one charged layer?
    why: "One isolated sheet gives σ/(2ε₀) on each side. Put an oppositely charged sheet across the gap and its field points the same way between the sheets, so the two contributions add to σ/ε₀. Outside the ideal pair they cancel. This is exactly the factor used in the cloud-ground estimate: the mill sits in the gap between the effective cloud layer and its induced opposite charge on the ground."
    choices:
    - Both plates contribute a field in the same direction between them
    - The law takes a different form when two conductors are involved
    - The gap is small, so the field has less room to spread
    - The plates carry twice as much charge in total as the single layer
    answer: Both plates contribute a field in the same direction between them
    rebuttals:
    - The law is the same in both cases, and the two answers come from adding two sources rather than one.
    - Separation does not appear in the result at all, which is what makes a plate capacitor useful.
    - Total charge is not what the field depends on — it is the charge per unit area on each plate.
  - group: MAST
    task: Work out what the screened room does to a field
    title: Ideal shield, real door
    at: sheet-cage
    reason: >-
      Owen Tate built the screened room and wants a real prediction on record before the door shuts, since a number written after the display drops is not a test of anything.
    concept: Field inside a conductor, and shielding
    place: Screened Room
    scene: Rigger and mast supervisor Owen Tate, the rigger & mast supervisor, closes the screened-room door. The probe on the bench drops from about 4 kV/m outside to roughly 40 V/m inside. Nothing on the instrument rack has been switched off.
    guide: >-
      Say what the probe inside will read once the door is shut, then shut it and read the probe. The prediction is the part that matters: a number written before the door closes is a claim about how conductors reach equilibrium, and one written afterwards is a description of a display.
    background:
    - >-
      What equilibrium does. Charge in a conductor is free to move, and it moves until the field inside the metal is zero — because any residual field would still be pushing it. The charge ends up arranged on the surfaces, and what a probe inside the enclosure sees is what is left after that rearrangement.
    - >-
      Why it is not perfect. The door seam, the cable entries and the ventilation mesh are apertures, and an aperture lets through a field that scales with its size relative to the wavelengths involved. So the honest prediction is not zero but small — tens of volts per metre against four thousand outside.
    - >-
      Why measuring is the point. The shielding argument is sound and the number it gives depends on hardware nobody derived: how well the door seats, whether the mesh is bonded all round, what the cable glands do. Predicting and then measuring is the only way to find out which of those the enclosure actually has.
    takesAsRead:
    - Gauss's law, and choosing a surface it can be used on
    assumes:
    - charge in a conductor is free to move
    takeaway: Electrostatic shielding is a consequence of how conductors reach equilibrium in an applied field.
    format: VERIFY
    question: Predict what the bench probe reads with the door shut, then shut it and measure.
    answerText: About 40 V/m — not zero. The field outside is 4 kV/m, so the enclosure is attenuating by a factor of about a hundred, and the residue arrives through the door seam and the cable entries.
    why: 'In electrostatic equilibrium, an ideal closed conductor has zero electric field inside the metal and shields its cavity from a static external field. The real screened room has seams, ventilation mesh and cable penetrations, so the measured field is not exactly zero: about 40 V/m inside against 4 kV/m outside. The theory predicts the limiting case; the probe measures the enclosure that was actually built. Reporting “zero” as the measurement would confuse model with hardware.'
    verify:
      prediction:
        label: Field at the bench probe with the door shut
        unit: V/m
        min: 0
        max: 400
        step: 5
      truth: 40
      passRatio: [0.5, 2.0]
      intervention:
        label: Close and dog the screened-room door
        note: nothing on the instrument rack is switched off, and the flat outside stays near 4 kV/m
        outcome: The door seats and the bench probe falls immediately, settling within a second.
      measurement:
        label: Read the bench probe
        note: calibrated field mill on the bench, 1 V/m resolution
        cost: 1
        costUnit: minutes of hall time
      unmeasuredMoral: A prediction that the field goes to zero is the right argument about a closed conductor and tells you nothing about your door seam. Reporting it without reading the probe is reporting the theory as the measurement.

  # ---------------------------------------------------------------- day 3
- title: Name the two places
  objective: Turn the measured field into a cloud-to-ground potential and reject voltage records that never name their reference points.
  briefing: A voltage without two named points is not a measurement. Last year's log contains several.
  stake: >-
    Wednesday. A report line says “5.4 megavolts” but does not say between what. Two old shots have the same problem. Today you derive the cloud-to-ground potential and decide which records are unusable.
  takeaway: A potential belongs to a pair of points, and a path is how you get from the field to the volts.
  segue: >-
    The cloud base is about 5.4 MV below the ground in the simple model. Two old voltage records are
    removed because their reference points were never written down. That makes day 4's marginal cell
    more important: the station is running out of clean evidence, and the launch rule is about to face
    its first real test.
  stops:
  - group: FIELD
    task: Derive the cloud-to-ground potential from the field
    title: What does 4.5 kV/m become over 1.2 km?
    at: mill-bench
    reason: >-
      The station lead wants yesterday's field turned into a potential before the log gains another empty column, and the sign is the part nobody trusts themselves on.
    place: Field Station
    scene: |-
      The field under yesterday's negatively charged cell was 4.5 kV/m upward, near enough uniform for the simple model, and the cloud base was 1.2 km up on radar. Vero wants the potential of the base relative to the flat.
    guide: >-
      Build it a line at a time. Potential difference is the line integral of the field along a path, with a minus sign in front. The field here is near enough uniform, so the integral collapses to a product. The sign is the part that catches people, so decide which way your path runs before you evaluate anything.
    background:
    - >-
      What the minus sign is doing. Moving against the field costs energy, and potential is energy per unit charge. So a path that runs upward through a downward-pointing field arrives at a higher potential. The sign in the definition is what encodes that, and dropping it gives a cloud base below ground potential.
    - >-
      Why uniform matters. A line integral over a changing field needs the field as a function of position. Here the mills say the field is near enough constant from the flat to cloud base, so the integral is field times distance. That approximation is worth stating, because the real field is not uniform near the mast.
    - >-
      How big the answer is. A kilometre of a few kilovolts per metre gives megavolts. That number is why a rocket trailing a wire can trigger a strike, and why the station's whole safety case is written around the field at the flat rather than around the potential aloft.
    assumes:
    - the field between the layer and the ground is close to uniform
    - work per unit charge is what a volt is
    takeaway: With a uniform field the integral is a product, and the minus sign is the physics rather than the bookkeeping.
    format: DERIVE
    question: Get the potential difference between the cloud base and the ground out of the field.
    answerText: V_cloud − V_ground = −Ed = −5.4 × 10⁶ V. The cloud base is about 5.4 MV below the ground in this simplified field model.
    why: The result is −5.4 MV because the path from ground to cloud runs in the same direction as the upward electric field, so −∫E·dl is negative. Electric field points toward lower potential. Here the field is treated as uniform, making the line integral a product; a real storm would require E as a function of position. Every potential must also name both points being compared.
    derive:
      hint: Take the integral down a path you choose, and say what licenses each line.
      start: V_b − V_a = −∫E·dl
      startNote: E = 4.5 × 10³ V/m, directed upward; the cloud base is 1.2 × 10³ m up
      goal: the potential of the cloud base relative to the ground, in volts
      askRule: true
      rules:
      - Gauss's law
      - symmetry argument
      - superposition
      - line integral of E
      - rearrangement
      - boundary condition
      steps:
      - ask: Choose the path to integrate along.
        answer: 1
        candidates:
        - text: the shortest path only, because the integral requires it
          rule: boundary condition
          why: The integral is path-independent in an electrostatic field, so the straight line is a convenience rather than a requirement. Believing it is a requirement is what makes the next problem, with a curved route, look impossible.
        - text: straight up from the flat to the base, along the field
          rule: line integral of E
        - text: a path around the mast and up, to stay off the field lines
          rule: line integral of E
          survives: true
          why: Perfectly legitimate — the answer is the same by any route — and it turns a one-line product into an integral nobody can do in their head, which is how a correct choice still costs the derivation.
        - text: along an equipotential from the flat to a point under the base
          rule: symmetry argument
          why: That leg contributes nothing at all, which is what an equipotential is. It is not wrong so much as it is not yet an answer.
      - ask: Write the integral for a uniform field along that path.
        answer: 2
        candidates:
        - text: V_b − V_a = −∫E dl = −E/d
          rule: rearrangement
          why: Dividing rather than multiplying. Volts per metre divided by metres is not volts, and the answer comes out at about four, which looks harmless.
        - text: V_b − V_a = −E·d²/2
          rule: line integral of E
          why: That is the integral of a field growing linearly with height. This one is uniform, so nothing inside the integral depends on l.
        - text: V_b − V_a = −E·d
          rule: line integral of E
        - text: V_b − V_a = E·d
          rule: line integral of E
          survives: true
          why: The magnitude is right and the sign is not, and every later line stays clean. It says the cloud base is positive with respect to the flat, which for this cell is exactly backwards.
      - ask: Put the numbers in.
        answer: 0
        candidates:
        - text: V_b − V_a = −(4.5 × 10³)(1.2 × 10³)
          rule: rearrangement
        - text: V_b − V_a = −(4.5 × 10³)(1.2)
          rule: rearrangement
          survives: true
          why: The kilometre never became metres. Five and a half kilovolts is a plausible number for something and it is not this.
        - text: V_b − V_a = −(4.5)(1.2 × 10³)
          rule: rearrangement
          why: The kilovolts per metre never became volts per metre either, and the two errors are the same error at different ends of the product.
        - text: V_b − V_a = −(4.5 × 10³) + (1.2 × 10³)
          rule: superposition
          why: Adding a field to a distance. Superposition adds fields to fields, and there is only one field here.
      commit: Commit the derivation
  - group: COUPLE
    task: Say what an equipotential means for somebody standing on it
    title: What voltage can one step cross?
    reason: >-
      Ingrid Lauwers has the injection-test map and wants the step voltage worked out, since a technician crossing that ground on foot is the whole reason the number matters.
    place: Outstation
    scene: The EMC engineer, Lauwers, has the injection-test map on the trailer wall. Rings of equal potential spread from the mast base, crowded near it and widely spaced farther out. She asks where one ordinary stride crosses the largest voltage difference.
    guide: >-
      Work out the voltage between one foot and the other where the rings are most crowded. The step voltage is the potential gradient there multiplied by the length of a stride. Two tiles are the ground's own potential at those radii, which is a large number and not the one that matters — a bird on a wire sits at kilovolts and is unharmed.
    background:
    - >-
      What the rings mean. Each is a set of points at the same potential, so walking along one costs nothing and crossing them costs the difference. Current spreading from the mast base falls off with distance, which is why the rings crowd near the rod and open out further away.
    - >-
      Why the gradient is the whole answer. What passes through a person is decided by the difference between their feet, not by the potential of the ground under them. Near the rod that difference over one stride is thousands of volts; out at forty metres the same stride crosses a few tens.
    - >-
      What follows for the site. It is the reason the working rule is to stand still or shuffle during a storm rather than stride, and the reason a buried grading ring is worth its copper: flattening the gradient near the rod is the only way to make the same current survivable to walk near.
    takesAsRead:
    - Electric potential as a line integral of the field
    assumes:
    - current spreading through soil produces a potential that falls with distance
    takeaway: What hurts somebody standing on the ground is the difference between where their feet are, not the potential of the ground itself.
    format: BALLPARK
    question: What voltage appears between one foot and the other at the crowded rings, one metre from the rod?
    answerText: About 3,400 volts across a single 0.9 m stride. The ground there is at 14 kV, and that number is not what hurts anybody — the difference between the feet is.
    why: "The step voltage is approximately the local potential gradient times the distance between contact points. With a gradient near 3,800 V/m, a 0.9 m step spans about 3,400 V; forty metres away, 30 V/m gives only about 27 V across the same separation. The important quantity for current through a body is the potential difference between its contact points, not the absolute potential of the soil under one foot. In operations the correct response is to clear the hazardous area before a storm; the calculation explains why ground-potential gradients are dangerous if someone is still there."
    estimate:
      prompt: One metre from the rod the injection test measures a potential gradient of about 3,800 V/m. An ordinary stride is 0.9 m. The ground there sits at 14 kV.
      question: Choose the potential gradient at the crowded rings and the length of one stride.
      labels:
      - 3800  (potential gradient at 1 m, in V/m)
      - 0.9  (one ordinary stride, in m)
      - 14000  (the ground's own potential at 1 m, in V)

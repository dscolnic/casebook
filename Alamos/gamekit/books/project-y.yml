    stops:
      - group: T
        task: Estimate how many nuclei remain after the shift, then use the half-life to estimate the sample's activity at that moment.
        title: Radioactive decay law
        scene: A tracer sample has been sitting through a six-hour shift and somebody needs to know what is left in it. Every count taken here is a count of something that has been decaying since it was made.
        assumes:
          - a half-life is the time for half of a large population to decay
        takeaway: Half-life fixes both how a population falls with time and, through the decay constant, its activity at any moment.
        format: BALLPARK
        answerText: About 1,250 nuclei remain. With λ = ln2/(2 h) ≈ 9.6×10^-5 s^-1, the activity is A = λN ≈ 0.12 decays/s, or 0.12 Bq.
        why: "Decay is random for one nucleus and predictable for a large population. 6 hours is 3 two-hour half-lives, so 10,000 nuclei fall to 1 eighth, or about 1,250. Half-life also fixes the decay constant: λ = ln2/t½. For a two-hour half-life, λ is about 9.6×10⁻⁵ s⁻¹. Activity is then A = λN, so the remaining sample produces about 0.12 decays each second. Population and count rate are linked by the same decay law."
        call: Model radioactive decay
        setup: A tracer with a 2-hour half-life starts at 10,000 nuclei and is left for a 6-hour shift.
        estimate:
          prompt: A tracer starts with 10,000 nuclei, has a two-hour half-life, and sits for 6 hours. Estimate how many nuclei remain. Then use λ = ln2/t½ and A = λN to estimate the activity.
          question: Choose the starting population, the number of half-lives, and the half-life needed to find λ.
          labels:
            - 10,000 nuclei
            - 1/2
            - 3 half-lives
            - 30 half-lives
          values: [10000, 0.5, 3, 30]
          slots: 3
          template: N ≈ {0} × ({1})^{2}
          formula: a*Math.pow(b,c)
          correct: [0, 1, 2]
          target: 1250
          tolerance: 80
          units: nuclei
          solution: λ = 0.693/7,200 s ≈ 9.6×10⁻⁵ s⁻¹. Then N(21,600 s) = 10,000e^(−λt) ≈ 1,250 nuclei. Finally A = λN ≈ 0.12 s⁻¹ = 0.12 Bq.
          explanation: Six hours is three half-lives, so one eighth of the original population remains. The same half-life gives the decay constant, which turns the surviving population into an expected decay rate.
          givens:
            - Each half-life leaves one-half of the previous amount
            - A 6-hour wait is 3 2-hour half-lives
          relationship: First λ = ln2/t½. Then N(t) = N₀e^(−λt), and activity is A = λN.

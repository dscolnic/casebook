      - Stops within microns of the event, making it the dominant source of immediate local heating.
      - Carries energy tens of centimetres away and can start further fissions before slowing down.
      - Leaves at the speed of light and needs dense material to be stopped.
      - Keeps releasing energy for minutes to years afterwards, so the products must be cooled and shielded long after the event.
    mapping: [0, 1, 2, 3]

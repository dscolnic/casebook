        text: Run controlled heat-treatment coupons that map how time and temperature change the metal’s microscopic structure.
      - label: B
        text: Heat the material without a planned schedule and judge success only by whether hardness rises.
      - label: C
        text: Test small samples with several controlled cooling rates, then compare hardness, strength, and microstructure.
    recommended:
      A: 45
      C: 50
    answerText: "Recommended: 45 to A, 50 to C, 5 held; none to B."
  - group: CM
    task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
    title: Machining and surface integrity
    setup: Match each machining risk to a control.
    scene: Machining creates the final dimensions and surface of a component, but cutting forces, heat, tool wear, coolant, and burrs can damage the material. A part can meet a simple diameter measurement while still carrying surface cracks or contamination. Los Alamos therefore treats machining as a controlled materials process, not merely shaping metal.
    takeaway: A dimension can be correct while the surface or contamination state is unacceptable.
    format: PROTOCOL
    why: Machining quality includes chemistry, stress, cleanliness, and geometry.
    columns:
      - What can go wrong
      - How you control it
    scenarios:
      - Tool wear changes dimensions
      - Cutting heat alters the surface
      - Coolant contaminates the material
      - Burrs interfere with fit
    choices:
      - Track cutting-edge life and re-measure parts through the run. The drift is gradual, so nothing fails — the parts simply leave tolerance one at a time.
      - Control speed, feed, and cooling under a qualified process. A part can be dimensionally perfect and still carry a damaged or transformed surface layer.
      - Use approved coolant and verify post-machining cleaning. The residue is chemical, so no dimensional inspection will find it.
      - Deburr and inspect edges. A raised fragment is small enough to pass a dimensional check yet still prevent assembly or break loose later.
    mapping: [0, 1, 2, 3]
    answerText: Tool wear changes dimensions -> Track cutting-edge life and re-measure parts through the run. The drift is gradual, so nothing fails — the parts simply leave tolerance one at a time; Cutting heat alters the surface -> Control speed, feed, and cooling under a qualified process. A part can be dimensionally perfect and still carry a damaged or transformed surface layer; Coolant contaminates the material -> Use approved coolant and verify post-machining cleaning. The residue is chemical, so no dimensional inspection will find it; Burrs interfere with fit -> Deburr and inspect edges. A raised fragment is small enough to pass a dimensional check yet still prevent assembly or break loose later
  - group: CM
    task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
    title: Nondestructive evaluation
    setup: Match each defect to a likely method.
    scene: Nondestructive evaluation looks for flaws without cutting apart the finished component. Surface inspection, dye penetrant, ultrasound, radiography, and eddy currents reveal different kinds and depths of defects. Since bomb components are scarce and often cannot be sacrificed for testing, the program needs multiple inspection methods matched to the flaw being sought.
    takeaway: No single nondestructive test sees every defect.
    format: PROTOCOL
    why: Inspection method must match defect location, material, and required resolution.
    columns:
      - What you need to find
      - Which method finds it
    scenarios:
      - Surface-breaking crack on a nonporous part
      - Internal void in a thick object
      - Subsurface flaw in a conductive material
      - Overall dimensional distortion
    choices:
      - Dye penetrant. Liquid wicks in and bleeds back out under developer, so the flaw must reach the surface and the surface must not absorb the dye.
      - Radiography or ultrasound. Both send energy through the bulk, reaching flaws no surface method can see.
      - Eddy-current testing. Induced currents are perturbed by a flaw just below the surface, but only in metals.
      - Dimensional metrology. Nothing is cracked or hollow, so what is measured is geometry against the drawing.
    mapping: [0, 1, 2, 3]
    answerText: Surface-breaking crack on a nonporous part -> Dye penetrant. Liquid wicks in and bleeds back out under developer, so the flaw must reach the surface and the surface must not absorb the dye.; Internal void in a thick object -> Radiography or ultrasound. Both send energy through the bulk, reaching flaws no surface method can see.; Subsurface flaw in a conductive material -> Eddy-current testing. Induced currents are perturbed by a flaw just below the surface, but only in metals.; Overall dimensional distortion -> Dimensional metrology. Nothing is cracked or hollow, so what is measured is geometry against the drawing.

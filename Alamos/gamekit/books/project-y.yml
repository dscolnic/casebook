  - group: X
    task: Match each situation to the best action, control, document, or interpretation. Each option is used once.
    title: Shock impedance at material boundaries
    setup: Match each observation to the best qualitative interpretation.
    scene: When a shock wave reaches a boundary between materials, part of the wave can reflect and part can transmit with a changed speed and pressure. The outcome depends on shock impedance, which combines material density and response. Fat Man contains many interfaces, so a void, wrong material, or poor contact can create a local disturbance that grows into asymmetric compression.
    takeaway: In an implosion system, every interface is part of the physics.
    format: PROTOCOL
    why: Interfaces transmit, reflect, and reshape waves according to the properties and state of both materials.
    columns:
      - What the record shows
      - What causes it
    scenarios:
      - A wave partially reflects from a boundary.
      - Transmitted pressure changes after entering a different material.
      - A small void creates a local disturbance and jet-like flow.
      - Two nominally identical interfaces produce different records.
    choices:
      - An impedance mismatch. Density and shock response differ across the interface, so part of the wave has nowhere to go but back.
      - A constitutive mismatch. Each solid answers a given particle velocity with its own stress, so both speed and amplitude shift at the crossing.
      - A defect that focuses flow. Material collapsing into the empty space arrives ahead of the surrounding front and drives a local jet.
      - Unexplained variation. Before calling this physics, rule out machining tolerance and diagnostic differences between the two records.
    mapping: [0, 1, 2, 3]
    answerText: A wave partially reflects from a boundary -> An impedance mismatch. Density and shock response differ across the interface, so part of the wave has nowhere to go but back; Transmitted pressure changes after entering a different material -> A constitutive mismatch. Each solid answers a given particle velocity with its own stress, so both speed and amplitude shift at the crossing; A small void creates a local disturbance and jet-like flow -> A defect that focuses flow. Material collapsing into the empty space arrives ahead of the surrounding front and drives a local jet; Two nominally identical interfaces produce different records -> Unexplained variation. Before calling this physics, rule out machining tolerance and diagnostic differences between the two records
  - group: X

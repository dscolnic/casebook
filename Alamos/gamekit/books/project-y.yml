      - group: X
        task: Estimate sigma_total.
        title: Synchronizing many channels
        scene: The timing-budget meeting has stalled. Each subsystem lead insists that their contribution is small, yet the combined requirement is close enough that nobody wants to sign it. The system cannot move to the next review until one number closes the argument.
        assumes:
          - independent errors do not simply add
        takeaway: A timing budget must include the full measurement chain.
        format: BALLPARK
        answerText: sigma_total = sqrt(29), about 5.4 ns.
        why: "The physical system contributes some delay, cable lengths contribute more, a trigger threshold shifts the moment a pulse is registered, and the recording instrument adds its own. Los Alamos handles this by building a timing budget: every contribution named, measured and combined. Independent contributions add in quadrature — squared, summed, square-rooted — so the largest term dominates and several smaller ones still raise the total. Two, three and four nanoseconds do not make nine; they make about five and a half."
        call: Synchronize many channels
        setup: 3 independent timing contributions are a 2 ns shared trigger, 3 ns of cable delay, and 4 ns of diagnostic registration.
        estimate:
          prompt: 3 independent timing contributions — a shared trigger at 2 ns, cable delay at 3 ns, and diagnostic registration at 4 ns — must be combined. Estimate the total timing uncertainty.
          question: Choose the three component uncertainties to combine in quadrature.
          labels:
            - 2 ns trigger
            - 3 ns cable
            - 4 ns recorder
            - 12 ns linear sum
          values: [2, 3, 4, 12]
          slots: 3
          template: σ_total ≈ √({0}²+{1}²+{2}²)
          formula: Math.sqrt(a*a+b*b+c*c)
          correct: [0, 1, 2]
          target: 5.385
          tolerance: 0.3
          units: ns
          solution: √(2² + 3² + 4²) = √29 ≈ 5.4 ns.
          explanation: "Quadrature gives 5.4 ns, well under the 9 ns a straight sum predicts, because independent errors do not all peak together — and the 4 ns recorder term alone carries more than half the total variance, so it is the 1 worth attacking first. Then check the answer against what the front does with that time: at 8×10³ m/s, 5.4 ns is about 0.04 mm of lead. Comfortably inside a millimetre-scale symmetry limit, which a half-microsecond spread would not be."
          givens:
            - Independent uncertainties combine in quadrature
            - sigma_total = sqrt(2^2 + 3^2 + 4^2) ns
            - Do not add signs, because these are uncertainty scales
          relationship: "Independent timing errors add in quadrature: the root of the sum of the squares. They do not add straight."
  - title: Build an uncertainty budget
    objective: Combine theoretical uncertainty, measurements that share an error, and system-level evidence into one decision tool.
    briefing: More data do not automatically produce more confidence. Carry uncertain inputs through, identify measurements that share an error, and assign the uncertainty that belongs to the integrated compression claim.
    stake: March 1945, and this is where Bethe is right and Groves does not want to hear it. More data arrived this month and confidence went down. Today you work out how uncertainties combine, recognise when measurements are not telling you separate things, and assign a number to the whole system. Three of the four measurements in it came off the same calibration. The honest budget names which term dominates and which cannot be reduced by working harder. This is the figure that will be quoted, years later, in a room where nobody remembers what went into it.
    takeaway: Uncertainties must be traced through the full evidence chain, especially when measurements share hardware or assumptions.
    stops:
      - group: T
        task: Estimate the total fractional uncertainty.
        title: Carrying uncertainty through
        scene: A predicted reaction rate rests on a cross section known to a few per cent and a flux known to a few more. Theory is being asked how well the prediction is known.
        assumes:
          - two independent errors are unlikely to be wrong the same way at once
        takeaway: Adding independent uncertainties linearly is usually too pessimistic; ignoring correlation can be too optimistic.
        format: BALLPARK
        answerText: About 10%.
        why: "Independent uncertainties combine in quadrature: square each contribution, add the squares, and take the root. 8 percent and 6 percent make 10, not 14. The larger term dominates, so reducing a small contribution may barely change the total while improving the largest one matters much more. That ranking is the practical value of an uncertainty budget. It tells a laboratory with limited people and time which measurement is worth improving first, rather than treating every error bar as equally urgent."
        call: Carry independent uncertainties through
        setup: A predicted reaction rate has an 8% cross-section uncertainty and a 6% flux uncertainty.
        estimate:
          prompt: A predicted reaction rate carries an 8% cross-section uncertainty and a 6% flux uncertainty, and the 2 are independent. Estimate the combined uncertainty.
          question: Choose the two component uncertainties to combine in quadrature.
          labels:
            - 8%
            - 6%
            - 14%
            - 2%
          values: [8, 6, 14, 2]
          slots: 2
          template: σ ≈ √({0}² + {1}²)
          formula: Math.sqrt(a*a+b*b)
          correct: [0, 1]
          target: 10
          tolerance: 0.6
          units: "%"
          solution: √(8² + 6²) ≈ 10%.
          explanation: "Quadrature gives 10%, not the 14% of a straight sum: independent errors partly cancel. Note also that the larger component dominates — halving the 6% would move the total to about 8.5%, while halving the 8% would move it to 7.2%."
          givens:
            - Independent fractional uncertainties combine in quadrature
          relationship: "Independent uncertainties add in quadrature: the root of the sum of the squares."
      - group: P
        task: A nucleus at rest splits into a heavy and a light fragment. Which carries more kinetic energy?
        title: Where the fragments go
        place: Diagnostics Bay
        scene: A nucleus initially at rest splits into a heavy fragment and a light fragment. The team has measured the fragment masses and is arguing about which one should carry the larger share of kinetic energy before looking at the detector data.
        assumes:
          - momentum is conserved in an isolated system
        takeaway: Momentum conservation fixes the ratio of fragment speeds, and energy follows from it.
        format: CHOICE
        answerText: The lighter fragment carries more kinetic energy. Equal and opposite momenta imply K = p²/(2m), so at the same |p| the smaller mass has the larger kinetic energy.
        why: The nucleus starts at rest, so total momentum is zero. The two fragments therefore leave with equal and opposite momentum. The lighter fragment must move faster because the momentum magnitude is the same for both. Kinetic energy can be written as p²/(2m). At equal momentum, the smaller mass has the larger kinetic energy. Momentum conservation fixes the relation between the motions; the energy formula then tells how the released energy is divided.
        call: Recognize measurements that share an error
        rebuttals:
          - Kinetic energy at fixed momentum falls with mass rather than rising with it.
          - Equal momenta do not mean equal energies, because energy depends on momentum squared over mass.
          - The binding energies fix the total energy released, not how it divides between the fragments.
        choices:
          - "The lighter one: equal and opposite momenta give it the greater speed."
          - "The heavier one: kinetic energy rises with the mass of the fragment."
          - They share it equally, since momentum is conserved in the split.
          - It cannot be decided without knowing the two binding energies.
        answer: "The lighter one: equal and opposite momenta give it the greater speed."
      - group: X
        task: Read the whole reading panel, then select the two causes that together account for every reading. No single cause does.
        title: Build the implosion uncertainty budget
        scene: An implosion trial has returned two anomalies, and the next development cycle can afford only one major push. Division leads are waiting outside the analysis room to learn where the effort goes. Name the wrong source and weeks disappear into the wrong fix.
        assumes:
          - two problems can have two different causes
        takeaway: Improvement starts by naming the dominant source of uncertainty.
        format: DIAGNOSIS
        answerText: Explosive lot-to-lot wave-speed variation + Attenuation-model error in the density inversion
        why: "A budget lists the separate contributions: material properties, geometry, timing, diagnostics, models. For each one it estimates how much it moves the final claim. Its value is not the total but the ranking. Improvement starts with the dominant source, and effort spent anywhere else changes nothing. The honesty of it matters here too. When two anomalies sit in different subsystems, the budget has two entries. Force one cause onto both and you misattribute one of them — and that is the entry somebody then goes and works on."
        call: Build the implosion uncertainty budget
        setup: You are assigning an implosion trial's anomalies to the right uncertainty terms.
        pack: x18
  - title: Design the integrated non-nuclear campaign
    objective: Set acceptance criteria, instrument the trial, identify the critical path, and choose tests that discriminate among explanations.
    briefing: The project is ready to combine subsystems without nuclear material. Define what counts as acceptable, preserve interpretable measurements, schedule the dependencies, and make the campaign answer the most important unresolved question.
    stake: "April 1945. The whole schedule now runs through one machine shop and nobody had drawn that until Bacher's committee sat down to force the interfaces. Groves wants a date; Bacher will not schedule a test he cannot instrument. Today you set what counts as a passing test, instrument it so the result can be interpreted, and find what the schedule really depends on. A test earns its place by telling two explanations apart, not by being impressive to watch. Bacher's rule for this laboratory is the shortest one on the mesa: no test without diagnostics."
    takeaway: An integrated trial succeeds when criteria, diagnostics, schedule, and scientific discrimination are designed together.
    stops:
      - group: CM
        task: Estimate the conservative lower bound of the measurement.
        title: Acceptance criteria
        scene: A property has to be at least 100 units and the measurement reads 102, plus or minus 3. Material this scarce cannot be scrapped casually, or accepted on hope.
        assumes:
          - a measurement has a range, not just a value
        takeaway: Acceptance criteria need explicit rules for uncertainty and borderline results.
        format: BALLPARK
        answerText: About 99 units, which is below the 100-unit threshold, so it is not an unambiguous pass.
        why: "An acceptance criterion turns a desired property into a rule: a limit, a measurement method, and a stated uncertainty. Results near the boundary are why the uncertainty rule must be agreed before the number is known. Here the central value is 102, but the lower plausible value is 99. That falls below the 100-unit requirement, so the measurement does not demonstrate a clean pass. Reading only the midpoint treats an uncertain measurement as though it were exact."
        call: Set acceptance criteria
        setup: A property must be at least 100 units. The measurement is 102 with uncertainty +/-3 units.
        estimate:
          prompt: A property must be at least 100 units. The measurement reads 102 units with an uncertainty of ±3 units. Estimate the conservative lower bound.
          question: Choose the measured value and the uncertainty.
          labels:
            - 102 measured units
            - 3 uncertainty units
            - 100 threshold units
            - 30 uncertainty units
          values: [102, 3, 100, 30]
          slots: 2
          template: lower bound ≈ {0} − {1}
          formula: a-b
          correct: [0, 1]
          target: 99
          tolerance: 0.15
          units: units
          solution: 102 − 3 ≈ 99 units, which falls below a 100-unit threshold.
          explanation: The lower bound of 99 falls below the 100-unit threshold, so a measurement that reads above the limit still does not demonstrate compliance. The margin has to exceed the uncertainty before a pass is unambiguous.
          givens:
            - The lower plausible value is about 99
          relationship: The lower bound of a result = the measured value − its uncertainty. Compare that against the threshold, not the central value.
      - group: P
        task: Spend the single week of facility time on the test whose possible outcomes would separate the competing timing hypotheses.
        title: Buy the test that can decide
        scene: Three team leads are waiting outside the facility office, each with a test they say cannot wait. There is one week of access left in the schedule, and only one proposal can take it. The scheduler needs one name before Monday.
        assumes:
          - an experiment is useful when different explanations predict different outcomes
          - facility time is limited
        takeaway: A test is valuable when its possible outcomes distinguish competing explanations, not when it merely produces more data.
        format: VALUE
        question: Which test changes the programme's next decision?
        value:
          hint: You have one facility week. Open each plan to see what its result would tell you, then spend the week on the evidence that can separate the two timing explanations.
          budget:
            amount: 1
            unit: facility week
          decision: Choose which timing explanation to pursue in the next design cycle.
          options:
            - id: discriminate
              label: Small test aimed at the timing signature where the hypotheses differ
              cost: 1
              axis: hypothesis separation
              decisive: true
              reveals: Which timing hypothesis survives when the one observable they predict differently is measured.
            - id: fullscale
              label: Full-scale assembly shot with limited diagnostics
              cost: 1
              axis: integrated performance
              decisive: false
              reveals: Whether the integrated assembly performs well or badly, while leaving several causes capable of producing the same result.
            - id: repeats
              label: Long repeat series at the already-tested condition
              cost: 1
              axis: repeatability
              decisive: false
              reveals: The statistical scatter at a condition already known, without distinguishing the two explanations.
            - id: undocumented
              label: Repeat last month's poorly documented configuration
              cost: 1
              axis: comparability
              decisive: false

          - Use independent timing and radiographic records around the assembly to reconstruct the wavefront.
        mapping: [0, 1, 2, 3]
  - title: Make symmetry measurable
    objective: Turn a qualitative demand for symmetry into calibrated timing evidence and an engineering requirement.
    briefing: “Nearly simultaneous” is not a measurement. Define a symmetry metric, calibrate the timing channels that observe it, and see why simultaneity became a system requirement.
    stake: October 1944. “Nearly simultaneous” has been in every memo for two months. Nobody has written down what it means in microseconds. That is why Kistiakowsky's division and Bethe's have been arguing past each other since August. Today you turn it into a number, calibrate the channels that measure it, and give ordnance a requirement they can build to. Kistiakowsky has four recording channels and no record of when any of them was last checked against another. The memos will go on saying nearly simultaneous until somebody writes a tolerance beside it. If the instruments disagree about when things happened, the timing you report describes the instruments rather than the shot.
    takeaway: A system requirement becomes testable only when it has a metric and a calibrated measurement chain.
    stops:
      - group: X
        call: Define an arrival-time symmetry metric
        task: Use the supplied values and give a sensible rounded result with units.
        title: How many half-lives have passed
        place: Diagnostics Bay
        question: Estimate the elapsed time since the first count.
        scene: A sample counted at 8,000 counts a minute reads 500 today, and the notebook does not say how long ago the first count was taken. The half-life is on the chart at 12 hours.
        assumes:
          - a half-life is the time for half of a sample to decay
        takeaway: Exponential decay is counted in half-lives, and logarithms are how you get the number of them.
        format: BALLPARK
        why: "Every half-life halves the count rate, so the elapsed time is the number of halvings times the half-life. 8000 to 500 is a factor of 32 is 2 to the fourth: 4 half-lives, or 48 hours. Written as a logarithm it is log base two of the ratio, which is what a semi-log plot shows as a straight line. The useful habit is to work in ratios rather than differences — the difference of 7,500 counts means nothing on its own."
        estimate:
          prompt: A sample read 8,000 counts a minute when it was first measured and reads 500 today. The half-life on the chart is 12 hours.
          question: Estimate the elapsed time since the first count.
          labels:
            - 8,000 cpm (the first count)
            - 500 cpm (today)
            - 12 h (half-life)
            - 16 (the ratio)
            - 4 (halvings)
            - 2 (the base)
          values: [8000, 500, 12, 16, 4, 2]
          slots: 3
          template: log2({0} ÷ {1}) × {2}
          formula: Math.log2(a/b)*c
          correct: [0, 1, 2]
          target: 48
          tolerance: 6
          units: hours
          solution: 8,000 ÷ 500 = 16. log2(16) = 4 half-lives. Times 12 hours is 48 hours.
          explanation: Work in ratios, not differences. The rate falls by a constant factor each half-life.
          relationship: Elapsed time = half-life × log2(first rate ÷ present rate).
        answerText: 8,000 to 500 is a factor of 16, which is 4 half-lives, so about 48 hours.
      - group: P
        task: Change one part of the timing chain at a time. Compare the arrival-time spread after each substitution, then restore the live path to confirm which change actually removes the jitter.
        title: Find where timing jitter enters
        scene: A timing array is disagreeing with itself, and until that is settled no symmetry claim from it means anything. The Hill is about to spend months measuring differences of nanoseconds.
        assumes:
          - a fixed delay shifts a distribution while random jitter broadens it
          - a controlled substitution changes one part of a measurement chain at a time
        takeaway: A controlled substitution localizes an instrument error only when one change removes the effect and reversing that change brings it back.
        format: CONTROL
        question: Which part of the live timing path is responsible for the broad arrival-time spread?
        control:
          hint: Run 1 substitution at a time and compare the channel-to-channel spread with the 14 ns live baseline. After you find a change that removes the spread, restore the original path and check that the spread returns.
          baseline: 14
          noise: 1
          tolerance: 2
          observable:
            label: Live timing path
            unit: ns
          response: -13
          truth: detector_pulse
          variables:
            - id: detector_pulse
              label: Bypass live detector pulse formation with identical pulses injected at the electronics inputs
            - id: cables
              label: Replace the channel cables with equal-length reference leads while keeping live detector pulses
            - id: discriminator
              label: Replace the discriminator stage with a reference unit while keeping live detector pulses
        answerText: The broad random spread enters in the live detector-pulse stage before the electronics-input injection point. Only bypassing that stage collapses the spread from 14 ns to about 1 ns, and restoring the live path brings the 14 ns spread back.
        why: A useful control changes one suspected part of the measurement chain while leaving the rest in place. The live timing path shows a 14 ns spread. Equalized cables or a replacement discriminator leave nearly the same broad distribution, so neither explains it. Identical pulses injected at the electronics inputs collapse the spread to about 1 ns. When the live detector path is restored, the broad spread returns. The changing element is therefore the live pulse-formation stage upstream of the injection point.

  - group: T
    task: Arrange the four cards from earliest cause or prerequisite to latest result.
    title: Neutron spectra
    setup: Order the steps in a spectrum-aware reaction calculation.
    scene: Neutrons are not all born with the same energy, and reaction probabilities can change sharply across the neutron-energy spectrum. A useful prediction must combine how many neutrons exist at each energy with the cross section at that energy. For bomb design, this prevents the theory group from replacing a broad spectrum with one misleading ‘average neutron.’
    takeaway: Reaction rates depend on the overlap of the spectrum with the cross-section curve.
    format: SEQUENCE
    why: One average energy can hide resonances and threshold behavior.
    cards:
      - Describe the neutron flux as a function of energy
      - Use an energy-dependent cross section
      - Multiply flux and cross section within each energy range
      - Integrate or sum over the spectrum
    order: [0, 1, 2, 3]
    answerText: 2 -> 3 -> 4 -> 5 (Describe the neutron flux as a function of energy -> Use an energy-dependent cross section -> Multiply flux and cross section within each energy range -> Integrate or sum over the spectrum)
  - group: T
    task: Allocate 100 research credits across the 3 proposals. You may hold credits in reserve, but explain the decision criterion.
    title: Resonances and thresholds
    setup: Only one of three measurement campaigns can be fully supported.
    scene: Some nuclear reactions become especially likely at resonance energies, while others require a threshold energy before they can occur at all. These features make reaction rates sensitive to the neutron spectrum and material composition. Los Alamos needs to know where such sharp changes occur because a small shift in energy can alter whether neutrons multiply, scatter, or disappear.
    takeaway: When the physics may vary rapidly with energy, coverage can matter more than one exquisitely precise point.
    format: SCIENCETANK
    why: A scan can reveal structure that a single point cannot, while some precision and calibration remain valuable.
    proposals:
      - label: A
        text: One high-precision point far from any predicted structure
      - label: B
        text: A coarse energy scan across the expected resonance region
      - label: C
        text: Repeat a known thermal point with the same apparatus
    recommended:
      B: 70
      A: 20
    answerText: "Recommended: 70 to B, 20 to A, 10 held or used for calibration; little to C."
  - group: T
    task: Arrange the four cards from earliest cause or prerequisite to latest result.
    title: Branching processes
    setup: Order the steps in a simple neutron-family simulation.
    scene: "A neutron chain reaction is a branching process: each neutron may produce zero, one, or several descendants. Even when the average grows, individual chains can die out by chance, while others become unusually large. This statistical picture helps Los Alamos scientists understand why averages alone cannot describe the early generations of a bomb’s chain reaction."
    takeaway: Near a threshold, fluctuations matter as much as the mean.
    format: SEQUENCE
    why: An average multiplication factor does not describe the full distribution of outcomes.
    cards:
      - Assign a probability distribution for offspring per neutron
      - Sample offspring for the first generation
      - Repeat sampling for later generations
      - Summarize extinction probability and population spread
    order: [0, 1, 2, 3]
    answerText: 2 -> 3 -> 4 -> 5 (Assign a probability distribution for offspring per neutron -> Sample offspring for the first generation -> Repeat sampling for later generations -> Summarize extinction probability and population spread)
  - group: T
    task: Estimate the surface-to-volume ratio, then say what doubling the radius does to it.
    title: Geometry and neutron leakage
    setup: A sphere has a radius of 5 cm.
    scene: A compact shape has less surface area relative to its volume than an elongated or fragmented shape, so fewer neutrons reach a boundary and escape. Geometry therefore changes neutron leakage even when the material is unchanged. Bomb theorists must connect shape and compression to multiplication because increasing density and reducing leakage can push the system into a rapidly growing chain reaction.
    takeaway: Geometry influences neutron economy through boundary leakage, not merely through total mass.
    format: BALLPARK
    why: Surface-to-volume falls as 1/L, so a larger body has less boundary per unit volume and leaks relatively less.
    estimate:
      prompt: Leakage is set by how much boundary a body has per unit of volume. For a sphere that ratio is 3/R. Estimate it for a sphere of radius 5 cm.
      question: Choose the sphere factor and the radius.
      labels:
        - 3 (sphere factor)
        - 5 cm radius
        - 10 cm radius
        - 2 (doubling factor)
      values: [3, 5, 10, 2]
      slots: 2
      template: S/V ≈ {0} ÷ {1}
      formula: a/b
      correct: [0, 1]
      target: 0.6
      tolerance: 0.05
      units: cm⁻¹
      solution: 3 ÷ 5 cm ≈ 0.6 cm⁻¹.
      explanation: A 10 cm sphere gives 3 ÷ 10 = 0.3 cm⁻¹, half as much surface per unit of volume. Surface grows as L² while volume grows as L³, so doubling the size halves the boundary available for leakage — which is why a larger assembly reaches criticality on less material.
      givens:
        - For a sphere, surface-to-volume ratio = 3/R
        - Surface scales as L^2 and volume as L^3
      relationship: For a sphere, surface-to-volume ratio = 3 ÷ radius. Leakage follows surface; production follows volume.
    answerText: About 0.6 cm^-1; doubling the radius halves it to about 0.3 cm^-1.
  - group: T
    task: Arrange the four cards from earliest cause or prerequisite to latest result.
    title: Monte Carlo transport
    setup: Arrange one simulated particle history.
    scene: Neutron transport through a complicated assembly involves many possible collisions and paths, so scientists use Monte Carlo methods to follow large numbers of simulated neutrons chosen by random sampling. The result is a statistical estimate rather than one exact trajectory. This gives Los Alamos a way to study complex geometry and rare paths that are difficult to solve with pencil-and-paper equations alone.
    takeaway: Monte Carlo is a numerical experiment whose uncertainty decreases with the number of histories.
    format: SEQUENCE
    why: A transport code repeats this physically ordered chain for many histories.
    cards:
      - Sample a free path from the attenuation law
      - Move the particle to the sampled interaction point
      - Sample the interaction type and outgoing state
      - Update tallies and continue or terminate the history
    order: [0, 1, 2, 3]
    answerText: 2 -> 3 -> 4 -> 5 (Sample a free path from the attenuation law -> Move the particle to the sampled interaction point -> Sample the interaction type and outgoing state -> Update tallies and continue or terminate the history)
  - group: T
    task: Allocate 100 research credits across the 3 proposals. You may hold credits in reserve, but explain the decision criterion.
    title: Sensitivity analysis
    setup: A model depends on three uncertain inputs.
    scene: Sensitivity analysis changes one input at a time to see which uncertain quantity most strongly changes the prediction. A parameter can be poorly known yet unimportant, or precisely known yet crucial. With limited wartime time and equipment, the bomb program needs sensitivity studies to decide which measurements or calculations will most reduce risk.
    takeaway: The largest-looking uncertainty is not always the most important one.
    format: SCIENCETANK
    why: Decision value depends on uncertainty multiplied by sensitivity, not uncertainty alone.
    proposals:
      - label: A
        text: A parameter with 20% uncertainty but almost no effect on the output
      - label: B
        text: A parameter with 5% uncertainty and a very large sensitivity
      - label: C
        text: A parameter with 10% uncertainty and moderate sensitivity
    recommended:
      B: 55
      C: 35
      A: 10
    answerText: "Recommended: 55 to B, 35 to C, 10 to A."
  - group: T
    task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
    title: Transport equations and approximations
    setup: Match each modeling need to the most appropriate simplified method.
    scene: No single transport method is best for every problem. Diffusion gives quick estimates when scattering smooths the neutron population, deterministic solvers treat equations directly, and Monte Carlo follows individual random histories. Los Alamos must choose the simplest method that still captures the physics, then check it against more detailed calculations where the approximation might fail.
    takeaway: Model choice should follow the question and required fidelity.
    format: PROTOCOL
    why: No single method is best for every geometry, energy range, or decision.
    columns:
      - What you want to compute
      - Which method computes it
    scenarios:
      - Rapid whole-system estimate in a strongly scattering region
      - Detailed treatment of complex geometry and rare paths
      - High-precision benchmark in a simple geometry
      - First-order hand estimate
    choices:
      - The diffusion approximation. Valid once scattering has smoothed the angular distribution, and cheap enough to run by hand.
      - Monte Carlo. Cost scales with the number of histories rather than with geometric complexity, and rare paths appear only if enough are run.
      - A deterministic transport solver. Repeatable and free of statistical noise, but only where the geometry can be gridded.
      - A scaling argument. Gives no absolute number, only how the answer moves with size or density — often the decision that actually matters.
    mapping: [0, 1, 2, 3]
    answerText: Rapid whole-system estimate in a strongly scattering region -> The diffusion approximation. Valid once scattering has smoothed the angular distribution, and cheap enough to run by hand.; Detailed treatment of complex geometry and rare paths -> Monte Carlo. Cost scales with the number of histories rather than with geometric complexity, and rare paths appear only if enough are run.; High-precision benchmark in a simple geometry -> A deterministic transport solver. Repeatable and free of statistical noise, but only where the geometry can be gridded.; First-order hand estimate -> A scaling argument. Gives no absolute number, only how the answer moves with size or density — often the decision that actually matters.
  - group: T
    task: Arrange the four cards from earliest cause or prerequisite to latest result.
    title: Shock waves and conservation laws
    setup: Order the reasoning for a one-dimensional shock calculation.
    scene: A shock wave is a very thin region where pressure, density, and velocity change abruptly. Conservation of mass, momentum, and energy connects the material before and after the shock. Implosion depends on using shocks to compress material inward, so theory must predict how those waves change at boundaries and whether they produce the intended density increase.
    takeaway: Shock physics is conservation plus constitutive information.
    format: SEQUENCE
    why: Conservation equations constrain the jump, while an equation of state supplies missing material behavior.
    cards:
      - Choose upstream and downstream states
      - Apply mass conservation across the front
      - Apply momentum conservation
      - Use energy or an equation of state to close the system
    order: [0, 1, 2, 3]
    answerText: 2 -> 3 -> 4 -> 5 (Choose upstream and downstream states -> Apply mass conservation across the front -> Apply momentum conservation -> Use energy or an equation of state to close the system)
  - group: T
    task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
    title: Symmetry and perturbations
    setup: Match the observed pattern to the simplest qualitative description.
    scene: A perfectly spherical implosion is an idealization; real systems contain timing errors, material variations, gaps, and surface roughness. Scientists describe those departures as perturbations with different spatial patterns. Because asymmetries can grow during compression and prevent the core from reaching the required state, Los Alamos must identify which patterns are harmless and which can spoil the bomb.
    takeaway: Symmetry errors are best diagnosed by decomposing them into modes.
    format: PROTOCOL
    why: Mode language converts a complicated shape into interpretable patterns.
    columns:
      - What the compression looks like
      - Which mode that is
    scenarios:
      - All directions shift together
      - One side leads while the opposite side lags
      - Four alternating high-low regions appear
      - Small-scale roughness grows over time
    choices:
      - A monopole, or uniform mode. Changes the assembly’s size but not its shape, altering density without breaking symmetry.
      - A dipole. The centre of compression moves off the geometric centre — displacement rather than distortion.
      - A quadrupole. Volume survives but the sphere goes elongated or flattened, so the shape is wrong even when the size is right.
      - High-order perturbation growth. Short wavelengths grow fastest, so a small initial defect can dominate late in the compression.
    mapping: [0, 1, 2, 3]
    answerText: All directions shift together -> A monopole, or uniform mode. Changes the assembly’s size but not its shape, altering density without breaking symmetry.; One side leads while the opposite side lags -> A dipole. The centre of compression moves off the geometric centre — displacement rather than distortion.; Four alternating high-low regions appear -> A quadrupole. Volume survives but the sphere goes elongated or flattened, so the shape is wrong even when the size is right.; Small-scale roughness grows over time -> High-order perturbation growth. Short wavelengths grow fastest, so a small initial defect can dominate late in the compression.
  - group: P
    task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
    title: Gas-filled detectors
    setup: Match the measurement goal to the best operating regime.
    scene: A gas-filled detector collects charge created when radiation ionizes gas molecules. Depending on the applied voltage, the same tube can measure average current, amplify individual ionization events, or produce nearly identical large pulses. Choosing the correct operating region matters because the bomb program needs different instruments for dose, counting, and pulse information rather than one detector used beyond its useful range.
    takeaway: Operating voltage determines what information a gas detector preserves.
    format: PROTOCOL
    why: Electric-field strength changes whether the detector measures total ionization, amplified ionization, or a saturated discharge.
    columns:
      - What you want to measure
      - Which operating region measures it
    scenarios:
      - Measure average dose rate over a broad range
      - Preserve some pulse-size information
      - Count individual events with simple electronics
      - Avoid operation where continuous discharge dominates
    choices:
      - The ionization-chamber region. No gas multiplication, so the output is a steady current proportional to total ionization rather than one pulse per event.
      - The proportional region. Multiplication is large but linear, so pulse height still tracks energy deposited.
      - "The Geiger–Müller region. Every event yields the same large pulse: easy to count, useless for spectroscopy."
      - Below electrical breakdown. Past it the discharge sustains itself and the output stops depending on the radiation at all.
    mapping: [0, 1, 2, 3]
    answerText: "Measure average dose rate over a broad range -> The ionization-chamber region. No gas multiplication, so the output is a steady current proportional to total ionization rather than one pulse per event.; Preserve some pulse-size information -> The proportional region. Multiplication is large but linear, so pulse height still tracks energy deposited.; Count individual events with simple electronics -> The Geiger–Müller region. Every event yields the same large pulse: easy to count, useless for spectroscopy.; Avoid operation where continuous discharge dominates -> Below electrical breakdown. Past it the discharge sustains itself and the output stops depending on the radiation at all."
  - group: P
    task: Estimate the fractional statistical fluctuation.
    title: Scintillation detectors
    setup: A scintillator produces about 10,000 detected photoelectrons for a reference event.
    scene: A scintillator gives off tiny flashes of light when radiation deposits energy, and a photosensor converts those flashes into electrical pulses. Different scintillators vary in speed, brightness, and sensitivity to particle type. Los Alamos uses fast scintillation signals when timing is crucial, but must separate real flashes from electronic noise and understand how light output relates to deposited energy.
    takeaway: More detected photons usually improve statistical energy resolution.
    format: BALLPARK
    why: 1/sqrt(10000)=0.01.
    estimate:
      prompt: A scintillation event releases about 10,000 detected photoelectrons, and counting fluctuations scale as 1/√N. Estimate the fractional noise.
      question: Choose the numerator and the photoelectron count.
      labels:
        - "1"
        - 10,000 photoelectrons
        - 100 photoelectrons
        - 1,000,000 photoelectrons
      values: [1, 10000, 100, 1000000]
      slots: 2
      template: fractional noise ≈ {0} ÷ √{1}
      formula: a/Math.sqrt(b)
      correct: [0, 1]
      target: 0.01
      tolerance: 0.002
      units: fraction
      solution: 1/√10,000 ≈ 0.01, or 1%.
      explanation: Photoelectron statistics are approximately Poisson, so fractional noise decreases as one over the square root of the count.
      givens:
        - Statistical fractional fluctuation is roughly 1/sqrt(N)
      relationship: "Counting fluctuation is Poisson: the fractional noise = 1 ÷ the square root of the number counted."
    answerText: About 1%.
  - group: P
    task: Arrange the four cards from earliest cause or prerequisite to latest result.
    title: Semiconductor detectors
    setup: Order the detector preparation and measurement steps.
    scene: "In a semiconductor detector, radiation creates mobile electrons and holes inside a solid crystal. An electric field sweeps those charges to electrodes, producing a pulse whose size can measure energy very precisely. Such detectors illustrate the same basic challenge that appears throughout the bomb program: preserve a small physical signal while preventing leakage current, noise, and imperfect charge collection from distorting it."
    takeaway: Semiconductors provide excellent energy information because little energy is required per charge pair.
    format: SEQUENCE
    why: Charge must be created, transported, and measured before energy can be inferred.
    cards:
      - Establish a depleted sensitive region with bias
      - Radiation creates electron-hole pairs
      - The electric field collects the carriers
      - A low-noise preamplifier converts charge to a pulse
    order: [0, 1, 2, 3]
    answerText: 2 -> 3 -> 4 -> 5 (Establish a depleted sensitive region with bias -> Radiation creates electron-hole pairs -> The electric field collects the carriers -> A low-noise preamplifier converts charge to a pulse)
  - group: P
    task: Estimate the absolute efficiency.
    title: Efficiency and geometry
    setup: A small detector intercepts 1% of isotropically emitted particles and detects 50% of those that enter.
    scene: Detector efficiency is the fraction of emitted particles that are actually recorded, and geometry controls how many particles travel toward the detector at all. Moving a detector farther away can reduce the count even though the source has not changed. Los Alamos must correct for both effects before comparing experiments or using count rates to test bomb calculations.
    takeaway: A highly efficient material can still record few events if it covers little solid angle.
    format: BALLPARK
    why: 0.01 x 0.50 = 0.005.
    estimate:
      prompt: A detector intercepts 1% of the particles leaving an isotropic source and records 50% of those that reach it. Estimate its absolute efficiency.
      question: Choose the geometric acceptance and the intrinsic efficiency.
      labels:
        - 1% geometric acceptance
        - 50% intrinsic efficiency
        - 5% geometric acceptance
        - 100% intrinsic efficiency
      values: [0.01, 0.5, 0.05, 1]
      slots: 2
      template: absolute efficiency ≈ {0} × {1}
      formula: a*b
      correct: [0, 1]
      target: 0.005
      tolerance: 0.0006
      units: fraction
      solution: 0.01 × 0.50 ≈ 0.005, or 0.5%.
      explanation: Absolute efficiency is the product of how many particles reach the detector and how many entering particles are recorded.
      givens:
        - Absolute efficiency = geometric fraction x intrinsic efficiency
      relationship: Absolute efficiency = geometric acceptance × intrinsic efficiency.
    answerText: About 0.5%.
  - group: P
    task: Estimate net counts and its standard deviation.
    title: Background subtraction uncertainty
    setup: A sample run records 1,000 counts and an equal-duration background run records 100 counts.
    scene: A corrected signal is often the sample count minus a separately measured background count. Both measurements fluctuate, so their uncertainties must be combined rather than assigning all uncertainty to the sample alone. In bomb experiments, weak diagnostic signals can be overwhelmed by an uncertain background even when the subtraction produces a positive number.
    takeaway: Subtracted backgrounds add uncertainty even though they reduce the central value.
    format: BALLPARK
    why: Net is 900; sqrt(1100) is about 33.
    estimate:
      prompt: A sample run records 1,000 counts and an equal-length background run records 100 counts. Estimate the standard deviation of the background-subtracted net counts.
      question: Choose the sample total and the background total.
      labels:
        - 1,000 sample counts
        - 100 background counts
        - 10,000 sample counts
        - 10 background counts
      values: [1000, 100, 10000, 10]
      slots: 2
      template: σ_net ≈ √({0} + {1})
      formula: Math.sqrt(a+b)
      correct: [0, 1]
      target: 33.166
      tolerance: 0.8
      units: counts
      solution: √(1,000 + 100) ≈ 33 counts.
      explanation: "Subtracting the background removes 100 counts from the net but adds its variance: the uncertainty comes from 1,000 + 100, not 1,000 − 100. Net counts are 900 ± 33, so subtraction never improves precision even when it corrects the answer."
      givens:
        - Net counts = sample - background
        - Variance of independent difference = 1000 + 100
      relationship: Each count has Poisson noise, and the two are independent, so the uncertainty on the difference = √(sample + background).
    answerText: 900 +/- about 33 counts.
  - group: P
    task: Estimate the live fraction.
    title: Dead time
    setup: A detector has nonparalyzable dead time tau = 10 microseconds and records 2,000 counts/s.
    scene: After recording an event, a detector or electronic circuit may need a short recovery time during which it cannot record another event. At high rates, this dead time causes the measured count to fall below the true rate. Los Alamos must correct or avoid dead-time losses because the most important bomb experiments can produce signals far faster than ordinary laboratory measurements.
    takeaway: High observed rates can understate the true rate because the system is temporarily blind after each event.
    format: BALLPARK
    why: R tau = 0.02, small enough for the linear correction to hold.
    estimate:
      prompt: A detector with a 10-microsecond (10⁻⁵ s) dead time records 2,000 counts per second. To first order the live fraction is 1 − R tau. Estimate it as a percentage.
      question: Choose the leading factor, the count rate, and the dead time.
      labels:
        - "1"
        - 2,000 s⁻¹
        - 10⁻⁵ s
        - 10⁻³ s
      values: [1, 2000, 0.00001, 0.001]
      slots: 3
      template: live fraction ≈ ({0} − {1}×{2}) × 100
      formula: (a-b*c)*100
      correct: [0, 1, 2]
      target: 98
      tolerance: 1
      units: "%"
      solution: (1 − 2,000×10⁻⁵)×100 ≈ 98%.
      explanation: R tau is 0.02 here, so the linear correction is trustworthy and the detector is live 98% of the time. 10 times the rate would put R tau at 0.2, where the first-order form breaks down and the full nonparalyzable expression is needed — the formula carries its own validity limit.
      givens:
        - Live fraction is about 1 - R tau while R tau stays small
      relationship: Live fraction = 1 − (event rate × dead time per event). Multiply by 100 for a percentage.
    answerText: About 98%.

      - Review the proposed correction with owners from all affected divisions.
      - Approve one controlling revision and update drawings, travelers, trainers, and spares.
      - Retest the changed functions and preserve the evidence linking old and new configurations.
    order: [0, 1, 2, 3]
    answerText: 1 -> 2 -> 3 -> 4 (Document the anomaly and identify every affected interface and test result. -> Review the proposed correction with owners from all affected divisions. -> Approve one controlling revision and update drawings, travelers, trainers, and spares. -> Retest the changed functions and preserve the evidence linking old and new configurations.)

    why: Not all anomalies carry the same consequence, but each needs a predefined disposition path.
    columns:
      - What you observe
      - Which kind of problem it is
    scenarios:
      - An arming indicator disagrees with the physical safe-state check.
      - One initiation channel fails continuity before release.
      - A diagnostic recorder is not synchronized, but the device remains safe.
      - A casing access panel is delayed but can be replaced before the mission window.
    choices:
      - A safety-critical ambiguity. The true state is unknown, so stop and verify independently instead of trusting either indication.
      - A mission-function failure. The system is safe but will not work, so hold, find the break, and repair before release.
      - An evidence loss. Nothing is unsafe and nothing will fail, but the test may no longer answer the question it was built to answer.
      - A recoverable schedule problem. No safety or function consequence, so handle it through configuration control rather than escalation.
    mapping: [0, 1, 2, 3]
    answerText: An arming indicator disagrees with the physical safe-state check. -> A safety-critical ambiguity. The true state is unknown, so stop and verify independently instead of trusting either indication.; One initiation channel fails continuity before release. -> A mission-function failure. The system is safe but will not work, so hold, find the break, and repair before release.; A diagnostic recorder is not synchronized, but the device remains safe. -> An evidence loss. Nothing is unsafe and nothing will fail, but the test may no longer answer the question it was built to answer.; A casing access panel is delayed but can be replaced before the mission window. -> A recoverable schedule problem. No safety or function consequence, so handle it through configuration control rather than escalation.

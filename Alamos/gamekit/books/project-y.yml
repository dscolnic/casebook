  - group: E
    task: Arrange the four cards from earliest cause or prerequisite to latest result.
    title: The Fat Man firing chain
    setup: Order the high-level firing-chain logic used in a safety-critical ordnance system.
    scene: The Fat Man firing chain carries an authorized command through power, switching, timing, and many output channels. Each link must remain disabled during handling but work reliably after release. Engineers treat the chain as a sequence because an error in order—power too early, a missing permissive, or a late pulse—can make the weapon unsafe or ineffective.
    takeaway: No single casual action should bridge the entire path from safe state to firing.
    format: SEQUENCE
    why: A safe firing chain separates storage, arming, command conditioning, and final action into traceable stages.
    cards:
      - Maintain the system in a safe, inhibited state during storage and handling.
      - Receive independent arming conditions and mission-authorized inputs.
      - Condition and distribute the firing command through the controlled electrical system.
      - Initiate the approved test or mission configuration and record the system state.
    order: [0, 1, 2, 3]
    answerText: 1 -> 2 -> 3 -> 4 (Maintain the system in a safe, inhibited state during storage and handling. -> Receive independent arming conditions and mission-authorized inputs. -> Condition and distribute the firing command through the controlled electrical system. -> Initiate the approved test or mission configuration and record the system state.)
  - group: E
    task: Match each situation to the best action, control, document, or interpretation. Each option is used once.
    title: Arming, fuzing, and safety interlocks
    setup: Match each scenario to the most relevant ordnance control.
    scene: Arming and fuzing are different jobs. Arming changes the system from a safe state toward readiness, while fuzing decides when conditions such as release, time, or altitude permit firing. Interlocks require independent conditions to agree before a dangerous command can pass. Fat Man needs these layers so normal transport or a single fault cannot accidentally initiate the firing chain.
    takeaway: A safe system makes its state constrained, visible, and independently checkable.
    format: PROTOCOL
    why: Safety, fuzing, interlocks, and indication solve different parts of the control problem.
    columns:

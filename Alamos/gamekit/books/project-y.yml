    objective: Use mechanical properties, inert mockups, and high-speed imaging to test a difficult system safely.
    briefing: The project needs evidence before a full integrated event. Characterize the materials, build representative non-nuclear hardware, and choose diagnostics that reveal fast internal behavior.
    stake: December 1944. The thing itself cannot be tested, so everything the programme believes has to come from stand-ins, and the committees run by Robert Bacher, who heads the physics division, exist to force the interfaces between them. They meet on Thursdays, and every division arrives with a different definition of ready. Today you characterise how the real materials behave under load, decide what a mockup can and cannot tell you, and choose diagnostics for events too fast to watch. An event lasting microseconds leaves no witness at all unless the instrument was chosen and placed beforehand. That means high-speed imaging, and radiography, which sees through what light cannot.

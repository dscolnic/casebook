      - group: P
        task: Which transformation makes exponential decay linear, and what physical quantity comes from the slope?
        title: The plot that makes a decay a straight line
        place: Diagnostics Bay
        scene: Two counters have produced a table of count rate against time, and the notebook has it plotted on ordinary axes as a curve that nobody can read a number off.
        assumes:
          - a logarithm turns a constant ratio into a constant difference
        takeaway: Plotting a logarithm turns an exponential into a straight line, and its slope is the decay constant.
        format: CHOICE
        answerText: Plot ln(count rate) versus time. The slope is −λ, and the half-life follows from t½ = ln2/λ.
        why: "An exponential plotted on linear axes is a curve, which is hard to check by eye. Take the logarithm of the count rate and the same data becomes a straight line. Its slope is minus the decay constant, so the half-life follows from t½ = ln2/λ. The transformed plot also exposes failures: a second component can change the slope, while background can flatten the line at late times. Choosing the axes is part of the measurement."
        call: Linearize an exponential
        rebuttals:
          - A straight-line fit on linear axes is only a local approximation to an exponential and its slope changes with time.
          - A log-log plot linearizes power laws. Exponential decay becomes linear when only the count-rate axis is logged.
          - Taking the reciprocal does not turn an exponential into a line; it produces another exponential.
        choices:
          - Plot ln(count rate) against time; the slope is −λ, so t½ = ln2/λ.
          - Plot count rate against time and fit a straight line to the late-time points; the slope is −λ.
          - Plot ln(count rate) against ln(time); the slope is −λ for any radioactive decay.
          - Plot 1/(count rate) against time; the slope gives the half-life directly.
        answer: Plot ln(count rate) against time; the slope is −λ, so t½ = ln2/λ.
      - group: T
        task: Why does splitting uranium release energy while splitting carbon would absorb it?
        title: Where the energy in fission comes from
        place: Theoretical Division
        scene: A visitor asks why splitting a heavy nucleus releases energy while splitting a light one costs energy. The blackboard has the binding-energy curve on it and nobody has used it to answer.
        assumes:
          - a nucleus is held together by binding energy
        takeaway: The binding-energy-per-nucleon curve says which way a nuclear reaction releases energy.
        format: CHOICE
        answerText: Fission releases energy when the products are more tightly bound per nucleon than the original heavy nucleus. The mass difference between those states appears as released energy.
        why: Binding energy per nucleon rises steeply from hydrogen, peaks around iron and nickel, and falls slowly to uranium. A reaction releases energy when its products sit HIGHER on that curve than its reactants, because the products are more tightly bound. Uranium splitting into two mid-mass fragments moves up the curve, so energy comes out. Carbon splitting would move down it, so energy would have to go in. The same curve is why fusion of light nuclei also releases energy — from the other side of the peak.
        call: Read the binding-energy curve
        rebuttals:
          - Coulomb repulsion contributes to why heavy nuclei are less tightly bound, but the reaction energy is the total binding-energy difference between initial and final nuclei.
          - The number of fragments does not determine the sign of the reaction energy. The binding energies of reactants and products do.
          - Radioactivity concerns whether a process occurs spontaneously and how fast. The energy balance is set by the masses and binding energies of the states.
        choices:
          - The fragments lie higher on the binding-energy-per-nucleon curve, so the products are more tightly bound and the mass difference appears as released energy.
          - The fragments separate electrically after the split, so nearly all released energy is simply Coulomb repulsion and the binding-energy change is secondary bookkeeping.
          - Any heavy nucleus releases energy when divided because the same mass is distributed among more particles and therefore more kinetic degrees of freedom.
          - Uranium releases energy because it is radioactive; a stable nucleus such as carbon would have no available nuclear energy to release.
        answer: The fragments lie higher on the binding-energy-per-nucleon curve, so the products are more tightly bound and the mass difference appears as released energy.
  - title: Reconcile evidence and freeze the design
    objective: Compare prediction bands with observations, release materials, reconcile theory and experiment, and control post-test changes.
    briefing: The test has produced data, but the program still must decide what those data mean. Compare observations with uncertainty bands, verify the material record, resolve disagreements between model and measurement, and freeze only the changes supported by evidence.
    stake: Late July 1945. Enrico Fermi dropped shredded paper from the bunker and got about ten kilotons from how far the blast wave carried it. That sits outside the band the theory division predicted, and either the model is wrong or the measurement is — with Bethe, who has already corrected several overestimates on paper, on one side of it. Today you compare prediction against observation properly, close the materials record, and decide what may still change. The materials record has to close as carefully as the physics, because a number is only about a thing if you know which thing it was measured on. A design freeze is an evidence decision that happens to have a date on it, and Oppenheimer is the one who has to hold the room to that distinction.
    takeaway: Design freeze is an evidence decision, not merely a calendar date.
    stops:
      - group: X
        call: Compare prediction with observation
        task: Estimate the offset in units of the measurement uncertainty, then state the strongest justified conclusion.
        title: Compare a prediction band with an observation
        setup: A classroom model predicts an observable between 15 and 25 units; the measurement reads 21 units with an uncertainty of +/-2.
        scene: A model predicts an observable between 40 units. The measurement reads 21, plus or minus 2. The temptation after Trinity is to read one comparison as a verdict on everything.
        assumes:
          - a wide prediction is easy to agree with
        takeaway: Evidence should update a model claim by claim, not by declaring total victory.
        format: BALLPARK
        why: The gap between an observation and a prediction is measured in units of the measurement's own uncertainty. Take the difference and divide by that uncertainty. Half a sigma from the middle of the band is consistent. But consistency with a band this wide is weak evidence, because 15 to 25 would have accommodated almost anything. Agreement supports the part of the model that produced the band, and no more. One agreeing diagnostic can sit beside others that disagree, and those still need explaining.
        estimate:
          prompt: A model predicts an observable between 15 and 25 units, so its midpoint is 20. The measurement reads 21 units with an uncertainty of ±2. Estimate the offset in units of the measurement uncertainty.
          question: Choose the observed value, the band midpoint, and the measurement uncertainty.
          labels:
            - 21 observed
            - 20 band midpoint
            - 2 measurement uncertainty
            - 15 band lower edge
          values: [21, 20, 2, 15]
          slots: 3
          template: offset ≈ |{0} − {1}| ÷ {2}
          formula: Math.abs(a-b)/c
          correct: [0, 1, 2]
          target: 0.5
          tolerance: 0.1
          units: σ
          solution: "|21 − 20| ÷ 2 ≈ 0.5σ."
          explanation: "Half a sigma is no disagreement at all — at this precision the observation and the midpoint are indistinguishable. Be careful what that licenses: it says the measurement is consistent with the model, not that the model is confirmed. A band 10 units wide is easy to agree with, so consistency here is weak evidence, and diagnostics that disagree with each other still need explaining."
          givens:
            - "Prediction band: 15 to 25, midpoint 20"
            - "Measurement: 21 +/- 2"
          relationship: Distance in sigma = |observed − predicted| ÷ the measurement uncertainty.
        answerText: "|21 - 20|/2 = 0.5 sigma. The observation is consistent with the prediction band, but a band that wide makes consistency weak evidence; it does not confirm every model assumption, and diagnostics that disagree with each other still need explaining."
      - group: CM
        task: Why is ordinary chemistry a poor way to separate uranium-235 from uranium-238 in bulk?
        title: Why separation is a physical problem
        place: Chemistry and Metallurgy Building
        scene: At Chemistry and Metallurgy, a production planner brings a request to enrich uranium-235 relative to uranium-238 by an ordinary chemical route. The division has been asked to decide whether the two isotopes give chemistry enough contrast to make that plan practical.
        assumes:
          - chemical behaviour is set by electrons, and isotopes differ only in the nucleus
        takeaway: Isotopes of one element have nearly the same electron structure, so practical enrichment must exploit a tiny isotope-dependent physical difference.
        format: CHOICE
        answerText: Ordinary chemistry offers almost no selectivity because the isotopes have nearly identical electron structures. Enrichment has to exploit a small isotope-dependent physical difference, especially mass.
        why: Chemical behaviour is controlled mainly by electrons, and the two uranium isotopes have the same electron count and almost the same electronic structure. Their ordinary chemical reactions are therefore nearly identical. The useful contrast is the small mass difference, about 1 part in 235, which can be exploited by processes that respond to mass or mass-to-charge ratio. The tiny size of that contrast is why isotope enrichment requires repeated separation stages rather than one ordinary chemical reaction.
        call: Identify the usable isotope contrast
        rebuttals:
          - The limitation is not mainly reaction speed or handling. The electronic structures that drive ordinary chemistry are almost the same.
          - A tiny isotope mass difference does not make bulk solutions separate by ordinary settling or filtration.
          - A detector can identify radiation from a population, but that does not provide a practical chemical force that sorts neutral atoms into separate bulk streams.
        choices:
          - Their electron structures are nearly identical, so ordinary chemical reactions provide almost no selectivity; enrichment instead exploits a small isotope-dependent physical difference.
          - Their chemical reaction rates differ enough for separation, but the difference is too slow to be useful only because uranium compounds are difficult to handle.
          - Their densities differ by about 1 part in 235, so settling or filtration is the natural route but requires extremely long columns.
          - Their radioactivities differ, so radiation detectors can sort individual atoms even though the chemistry itself cannot.
        answer: Their electron structures are nearly identical, so ordinary chemical reactions provide almost no selectivity; enrichment instead exploits a small isotope-dependent physical difference.
      - group: T
        task: Choose two follow-up checks. Buy evidence that can distinguish a shared calibration problem from a real physics discrepancy.
        title: Spend the follow-up checks on independence
        scene: Theory and experiment disagree by three standard deviations. The division can complete two follow-up checks before the next review, and every extra run that repeats the same dependency consumes one of those chances.
        assumes:
          - a systematic error does not average away with more repeats
          - independent measurements should not share the same critical calibration
        takeaway: When theory and experiment disagree, the next measurements should attack shared systematics and add evidence based on different dependencies.
        format: VALUE
        question: Which two checks can change the interpretation of the disagreement?
        value:
          hint: You can fund two checks. Read what each one would reveal. One should test a shared dependency; the other should stand on a different measurement chain.
          budget:
            amount: 2
            unit: follow-up checks
          decision: Decide whether the three-sigma gap is best treated as a shared systematic or as a discrepancy that survives independent measurement.
          options:
            - id: audit
              label: Audit the calibration shared by the original comparison
              cost: 1
              axis: shared systematic
              decisive: true
              reveals: Whether a common calibration bias can account for the apparent disagreement.
            - id: independent
              label: Repeat the observable with a different detector or calibration path
              cost: 1
              axis: independent measurement
              decisive: true
              reveals: Whether the discrepancy survives when the critical dependency chain changes.
            - id: more
              label: Collect more data with the same setup
              cost: 1
              axis: statistical precision
              decisive: false
              reveals: A smaller random error bar around a result that still carries the same systematic dependencies.
            - id: retune
              label: Retune uncertain model parameters until the curves agree
              cost: 1
              axis: model flexibility
              decisive: false
              reveals: That the model can be adjusted to match the datum, without identifying why the original prediction missed it.
        answerText: Use the two checks on the shared-calibration audit and an independent measurement with a different dependency chain. Together they can distinguish common bias from a discrepancy that survives independent evidence.
        why: More of the same data reduces random error but carries the same systematic dependencies. Retuning the model can hide the discrepancy without explaining it. First audit the calibration shared by the measurements, because a common bias can create a confident disagreement. Then use a measurement based on different hardware or a different calibration path. If the discrepancy survives independent evidence, the case for missing physics strengthens. If it disappears, the original measurement chain becomes the leading suspect.
        call: Reconcile theory and experiment
        setup: Theory and experiment disagree by three standard deviations.
      - group: E
        task: Arrange the four cards from earliest cause or prerequisite to latest result.
        title: Post-Trinity design freeze
        scene: "Trinity has produced new evidence, and a last-minute improvement is already being argued over. Drawings are moving toward production while engineers are still proposing changes. The room has one uncomfortable question: what can still change without severing the link to what was tested?"
        assumes:
          - what was tested and what gets built can drift apart
        takeaway: A freeze comes before the paperwork, or the paperwork describes something still changing.
        format: SEQUENCE
        answerText: 1. Recover and reconcile the timing, hydrodynamic and radiation records into one account of the shot. 2. Compare that account with the pre-test predictions, and name what is still unexplained. 3. Approve only the changes the evidence supports, and freeze the configuration. 4. Update assembly records, procedures and training against the frozen configuration.
        why: Each stage is the input to the next. The timing, hydrodynamic and radiation records are reconciled into one account of the shot, because there is nothing to compare until they agree with each other. That account is then compared with the pre-test predictions, and what remains unexplained is named rather than absorbed. Only then can the evidence-supported changes be approved and the configuration frozen. The freeze comes before the paperwork — reverse those two and the documents describe a configuration that is still moving.
        call: Control the post-Trinity design freeze
        setup: Order the post-test decision process.
        rebuttals:
          - Reconcile the records into one account of the shot first. Three disagreeing records are not evidence about anything yet.
          - Compare that account with the pre-test predictions second, and name what is still unexplained. An unnamed discrepancy is one nobody will return to.
          - Approve only the evidence-supported changes and freeze the configuration third. This is the step that ties the article to the test.
          - Update records, procedures and training last, against the frozen configuration. Do it earlier and the paperwork describes something still changing.
        cards:
          - Recover and reconcile the timing, hydrodynamic and radiation records into one account of the shot.
          - Compare that account with the pre-test predictions, and name what is still unexplained.
          - Approve only the changes the evidence supports, and freeze the configuration.
          - Update assembly records, procedures and training against the frozen configuration.
        order: [0, 1, 2, 3]
  - title: Complete the evidence chain—and confront responsibility
    objective: Close the technical reviews while recognizing that scientific completion does not settle the human and political consequences.
    briefing: The final mission asks each scientific line to state what it knows, what remains uncertain, and what follows from the work. Complete the theory, diagnostic, and materials dossiers, then address the responsibilities scientists debated after Trinity.
    stake: August 1945. The technical questions are closing and the other ones are not. Today you decide what each line of work is entitled to claim — what it knows, what is still uncertain, how strongly each claim is held — and then the same people have to say what follows from having done the work at all. The second part has no method. Leo Szilard, who wrote the letter that started the programme, circulated a petition in July with 155 signatures on it. Oppenheimer spent the rest of his life being asked. The scientists who were here disagreed about this in public for decades, and never about the physics, which they all agreed on.
    takeaway: Technical readiness and historical responsibility are different judgments; a complete curriculum must examine both.
    stops:
      - group: T
        task: If fusion releases energy, why is it difficult to start?
        title: Why light nuclei release energy too
        place: Theoretical Division
        scene: The binding-energy curve on the board rises steeply from light nuclei toward iron. A younger theorist has noticed that fusion moves uphill on that same curve and asks why an energy-releasing reaction does not simply happen whenever light nuclei meet.
        assumes:
          - like charges repel, and the nuclear force acts only at very short range
        takeaway: Fusion of light nuclei releases energy for the same reason fission of heavy ones does, and it is harder to start.
        format: CHOICE
        answerText: Fusion can release energy and still be hard to start because two positive nuclei repel each other. They must get extremely close before the short-range nuclear force can bind them.
        why: "Fusion moves up the binding-energy curve from the light end, so it releases energy — more per nucleon than fission does. The difficulty is getting there: two positive nuclei repel, and the nuclear force that binds them only reaches across about a femtometre. Closing that gap needs kinetic energy, which means temperatures of millions of kelvin, whereas fission needs only a slow neutron and no barrier at all. Energy released and ease of ignition are separate questions, and confusing them is the usual error."
        call: Separate energy release from ignition
        rebuttals:
          - A neutron is not required to remove the Coulomb barrier in ordinary light-nucleus fusion; the reactant nuclei themselves must get close enough to interact.
          - The nuclear force is short-ranged, not switched on by high speed. High kinetic energy helps the nuclei approach despite their electrostatic repulsion.
          - Light nuclei begin well below the iron peak in binding energy per nucleon, which is why fusion can release substantial energy.
        choices:
          - The nuclei are positively charged, so they must approach through electrostatic repulsion before the short-range nuclear force can bind them.
          - The products are more tightly bound, but the released energy cannot appear until a neutron first removes the electrical charge barrier.
          - The strong nuclear force becomes effective only when nuclei are moving rapidly, so high temperature is needed to strengthen the force itself.
          - Light nuclei are already close to the peak of the binding-energy curve, so fusion releases too little energy to sustain further reactions.
        answer: The nuclei are positively charged, so they must approach through electrostatic repulsion before the short-range nuclear force can bind them.
      - group: P
        task: Arrange the four cards from earliest cause or prerequisite to latest result.
        title: Final diagnostic readiness review
        scene: The final readiness review asks whether the instruments will actually record what happens. There is exactly one event to record, no repeat shot to recover a missed observable, and a diagnostic that saturates or loses timing can erase an answer permanently.
        assumes:
          - an instrument can be working and still miss the event
        takeaway: The final product is a trustworthy evidence system, not merely a collection of sensors.
        format: SEQUENCE
        answerText: 2 -> 3 -> 4 -> 5 (Verify calibration and configuration records -> Run end-to-end timing and health checks -> Demonstrate independent coverage of critical observables -> Approve deployment with named residual risks and contingencies)
        why: Calibration and configuration records come first. An instrument nobody can describe afterwards produces data nobody can use. End-to-end timing and health checks then prove the chain works as a chain, rather than as a set of working parts. Independent coverage of the critical observables comes next — independent, so one failure does not take a whole answer with it. Deployment is approved with the residual risks named and a backup for each. Readiness means failures will be recognised, not that there are none.
        call: Hold the diagnostic readiness review
        setup: Order the final readiness chain.
        rebuttals:
          - Verify calibration and configuration records first. An instrument nobody can describe afterwards produces data nobody can use.
          - Run end-to-end timing and health checks second. Every part working is not the same as the chain working.
          - Demonstrate independent coverage of the critical observables third, so one failure does not take a whole answer with it.
          - Approve deployment with named residual risks and contingencies last. Readiness means failures will be recognised, not that there are none.
        cards:
          - Verify calibration and configuration records
          - Run end-to-end timing and health checks
          - Demonstrate independent coverage of critical observables
          - Approve deployment with named residual risks and contingencies
        order: [0, 1, 2, 3]
      - group: CM
        task: Spend the final 100-credit improvement budget on the evidence system that will remain useful when the next batch behaves differently.
        title: Leave a materials capability, not just better numbers
        scene: The final dossier has to show more than that components existed. The division has one last hundred credits of improvement to spend, and the choice says what it thinks a materials capability is.
        assumes:
          - future batches may differ from today's batch
          - a record is useful when it preserves relationships, not only isolated measurements
        takeaway: A durable materials programme links process conditions to composition, structure, properties, and traceable batch records.
        format: VALUE
        question: Which investment creates the most durable materials capability?
        value:
          hint: You can fund one improvement. Open each option and ask what a future team would learn when a later batch comes out different.
          budget:
            amount: 100
            unit: credits
          decision: Choose the improvement that best preserves the ability to explain and correct future batch variation.
          options:
            - id: records
              label: Link each batch's process conditions to measured properties
              cost: 100
              axis: process-property traceability
              decisive: true
              reveals: Which process conditions consistently travel with changes in composition, structure, or performance across batches.
            - id: independent
              label: Add independent composition and microscopy checks to every batch
              cost: 100
              axis: batch verification
              decisive: false
              reveals: Whether each batch's measurements agree across methods, without linking differences back to how the batch was made.
            - id: remeasure
              label: Re-measure released batches to tighter tolerance
              cost: 100
              axis: measurement precision
              decisive: false
              reveals: More precise values for material already released, without explaining the process conditions that produced those values.
            - id: throughput
              label: Raise production throughput with records unchanged
              cost: 100
              axis: production volume
              decisive: false
              reveals: How much more material can be produced, while preserving the same blind spot about why batches differ.
        answerText: Spend the 100 credits on records that link each batch's process conditions to its measured composition, structure, and properties. That creates an evidence chain future staff can use to explain variation.
        why: Another measurement can describe one batch more precisely, but it does not explain why the next batch differs. A process-to-properties record connects what was done to what the material became. That relationship can be tested across batches and used later to diagnose a change in structure or performance. Extra composition checks, tighter remeasurement, and higher throughput all have value, but none creates that causal record. The durable capability is the evidence chain linking process history to measured properties.
        call: Complete the materials dossier
        setup: The division has 1 final 100-credit improvement budget.
      - group: X
        task: Which statement best separates the laboratory's technical responsibility from the political decision that follows?
        title: Scientific responsibility after Trinity
        scene: After Trinity, reports of yield, fallout, and measurement uncertainty are spread across the laboratory. Officials outside the site are asking what the results mean. Scientists now have to decide what belongs in their technical assessment before it leaves Los Alamos.
        assumes:
          - a technical question and a decision about its use are different questions
        takeaway: Technical expertise carries a duty to communicate consequences and uncertainty clearly without turning expertise into political authority.
        format: CHOICE
        answerText: Provide the technical consequences and uncertainties clearly, and distinguish that assessment from any policy recommendation. Expertise informs the decision without becoming the authority that makes it.
        why: Scientists can report what the instruments measured. They can estimate likely effects and state how uncertain those estimates are. That information matters because officials cannot judge consequences they have never been shown. Scientists can also explain which conclusions are well supported and which depend on assumptions. They do not get the final policy decision simply because they know the technical details. Their responsibility is to make the evidence and uncertainty clear before others decide what to do with it.
        call: Define the laboratory's responsibility
        setup: Separate what scientific expertise can establish from who has authority to decide.
        rebuttals:
          - Raw measurements require technical interpretation before non-specialists can understand their consequences; refusing that interpretation withholds part of the expertise.
          - Expertise strengthens a technical assessment but does not by itself confer authority over the political decision.
          - "Waiting until after the decision defeats the purpose of technical advice: the relevant consequences and uncertainties are needed before the choice is made."
        choices:
          - Provide a clear technical account of expected consequences and uncertainties, while labeling separately any policy recommendation.
          - Limit the laboratory's contribution to raw instrument readings, because translating them into expected consequences would cross into policy.
          - Treat scientific expertise as authority to decide the policy, because the laboratory understands the technical facts better than outside officials.
          - Withhold a technical assessment until political leaders choose a course, so the laboratory cannot be seen as influencing the decision.
        answer: Provide a clear technical account of expected consequences and uncertainties, while labeling separately any policy recommendation.
# Lessons no mission stop points at — review variants and spares. Reachable as callbacks.
lessons:
  - group: T
    task: Arrange the four cards from earliest cause or prerequisite to latest result.
    title: The binding-energy curve
    setup: Place the reasoning steps that connect the curve to energy release.
    scene: Nuclei near the middle of the periodic table are bound more tightly per particle than very heavy nuclei. When a heavy nucleus splits into medium-mass fragments, the products sit lower in energy and the difference is released. This binding-energy curve gives Los Alamos scientists the broad physical reason fission can power a bomb, while reminding them that energy comes from comparing the starting and ending nuclei.
    takeaway: Energy release is a difference between states, not a property of one isolated point.
    format: SEQUENCE
    why: The curve predicts energy release only after initial and final states are compared.
    cards:
      - Locate the initial nuclei on the binding-energy-per-nucleon curve
      - Identify products closer to the broad maximum
      - Recognize that the products are more tightly bound
      - Convert the binding-energy difference into released energy
    order: [0, 1, 2, 3]
    answerText: 2 -> 3 -> 4 -> 5 (Locate the initial nuclei on the binding-energy-per-nucleon curve -> Identify products closer to the broad maximum -> Recognize that the products are more tightly bound -> Convert the binding-energy difference into released energy)
  - group: T
    task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
    title: Activity and count rate
    setup: A calculation group must choose the missing factor for four count-rate questions.
    scene: Activity is the number of nuclear decays occurring each second, but a detector records only some of them and also records background events from the room and electronics. The bomb program depends on turning detector counts into trustworthy estimates of what a source is actually doing. That requires separating source behavior from efficiency, geometry, and background instead of treating the displayed count rate as the whole truth.
    takeaway: A detector does not observe every decay, and it also observes events that are not from the source.
    format: PROTOCOL
    why: Activity belongs to the source; count rate belongs to the source-detector arrangement.
    columns:
      - What you want to work out
      - How you work it out
    scenarios:
      - Convert number of nuclei to decays per second
      - Convert decays per second to detected events
      - Correct a measured gross rate
      - Compare two sources measured at different efficiencies
    choices:
      - Multiply by decay constant.
      - Multiply by detector efficiency.
      - Subtract background rate.
      - Divide by efficiency before comparison.
    mapping: [0, 1, 2, 3]
    answerText: Convert number of nuclei to decays per second -> Multiply by decay constant; Convert decays per second to detected events -> Multiply by detector efficiency; Correct a measured gross rate -> Subtract background rate; Compare two sources measured at different efficiencies -> Divide by efficiency before comparison
  - group: T
    task: Arrange the four cards from earliest cause or prerequisite to latest result.
    title: Exponential attenuation and mean free path
    setup: Order the conceptual chain behind exponential attenuation.
    scene: A neutron moving through matter has some chance of interacting in every small distance it travels, so the surviving population falls exponentially rather than linearly. The mean free path is the average distance between interactions, not a fixed distance traveled by every neutron. For bomb theory, attenuation and mean free path help predict how many neutrons will remain available as they cross different materials and geometries.
    takeaway: Exponential attenuation is a probability model, not a guarantee that every particle travels exactly one mean free path.
    format: SEQUENCE
    why: An exponential appears because the same fractional survival process repeats over many small intervals.
    cards:
      - A particle enters a uniform material
      - Each short path interval carries a small interaction probability
      - Survival probabilities multiply along the path
      - Transmitted intensity falls exponentially with thickness
    order: [0, 1, 2, 3]
    answerText: 2 -> 3 -> 4 -> 5 (A particle enters a uniform material -> Each short path interval carries a small interaction probability -> Survival probabilities multiply along the path -> The surviving intensity becomes exponential in thickness)
  - group: T
    task: Estimate the net displacement.
    title: Diffusion and leakage
    setup: A neutron in a large water tank makes about 100 scattering steps of about 2 cm each.
    scene: After many random collisions, a neutron’s total path can be long even though its net displacement is modest. This random-walk behavior is called diffusion, and boundaries allow some neutrons to leak out before they cause another reaction. Because a bomb is finite rather than an infinite block of material, the theory group must estimate the competition between collisions inside the assembly and escape through its surface.
    takeaway: Many collisions can produce a modest net displacement because directions randomize.
    format: BALLPARK
    why: 2 x sqrt(100) = 20 cm, far less than the 200 cm of path travelled.
    estimate:
      prompt: A neutron in a large water tank scatters about 100 times, travelling about 2 cm between collisions. Random-walk displacement is roughly the step length times the square root of the number of steps. Estimate its net displacement.
      question: Choose the step length and the number of steps.
      labels:
        - 2 cm
        - 100 steps
        - 200 cm
        - 10 steps
      values: [2, 100, 200, 10]
      slots: 2
      template: displacement ≈ {0} × √{1}
      formula: a*Math.sqrt(b)
      correct: [0, 1]
      target: 20
      tolerance: 2
      units: cm
      solution: 2 cm × √100 ≈ 20 cm.
      explanation: The neutron covers 200 cm of path but ends up only about 20 cm from where it started. That gap between path length and net displacement is why a moderator can be far smaller than the total distance a neutron travels inside it.
      givens:
        - Root-mean-square displacement is roughly step length x sqrt(number of steps)
      relationship: A random walk goes net distance ≈ step length × the square root of the number of steps.
    answerText: About 20 cm.
  - group: T
    task: Estimate the population after two generations.
    title: Neutron multiplication factor
    setup: A simplified system begins with 1,000 neutrons and has k=0.95.
    scene: The multiplication factor k compares the number of neutrons in one generation with the number in the previous generation. If k is below one the chain fades, at one it stays steady, and above one it grows. A bomb requires a rapidly growing chain for a very short time, so even a small change in k can have a large effect after many generations.
    takeaway: Small deviations of k from one compound over many generations.
    format: BALLPARK
    why: 1000 x 0.95^2 is about 903.
    estimate:
      prompt: A system starts with 1,000 neutrons and is slightly subcritical at k = 0.95. Estimate the population 2 generations later.
      question: Choose the initial population, the multiplication factor, and the generation count.
      labels:
        - 1,000 neutrons
        - "0.95"
        - 2 generations
        - "0.50"
      values: [1000, 0.95, 2, 0.5]
      slots: 3
      template: N₂ ≈ {0} × ({1})^{2}
      formula: a*Math.pow(b,c)
      correct: [0, 1, 2]
      target: 902.5
      tolerance: 35
      units: neutrons
      solution: 1,000 × 0.95² ≈ 900 neutrons.
      explanation: A system described as only slightly subcritical should have k just below one, so the population declines gently over a few generations.
      givens:
        - After 1 generation N1=k N0
        - After 2 generations N2=k^2 N0
      relationship: After n generations, the population = the starting number × kⁿ.
    answerText: About 900 neutrons.
  - group: T
    task: Arrange the four cards from earliest cause or prerequisite to latest result.
    title: Prompt and delayed neutron timescales
    setup: Order the reasoning used to analyze a mixed prompt-delayed population.
    scene: Most fission neutrons appear almost immediately, while a small fraction are emitted later by radioactive fragments. Delayed neutrons make reactors controllable on human timescales, but a bomb’s energy release is governed mainly by prompt neutrons because the assembly changes in microseconds. The theory team therefore must separate two very different clocks that come from the same fission process.
    takeaway: A small component can dominate controllability when its timescale is very different.
    format: SEQUENCE
    why: A useful kinetics model preserves both the small delayed fraction and its much longer timescale.
    cards:
      - Identify which neutron populations are present
      - Assign each population its characteristic delay or lifetime
      - Weight each contribution by its fraction
      - Combine them to predict the system response
    order: [0, 1, 2, 3]
    answerText: 2 -> 3 -> 4 -> 5 (Identify which neutron populations are present -> Assign each population its characteristic delay or lifetime -> Weight each contribution by its fraction -> Combine them to predict the system response)
  - group: T
    task: Allocate 100 research credits across the 3 proposals. You may hold credits in reserve, but explain the decision criterion.
    title: Criticality safety as a systems concept
    setup: A laboratory has 100 credits to reduce uncertainty in routine handling of fissile materials.
    scene: A system can become dangerous long before anyone intends to build a weapon if enough fissile material, reflection, moderation, or favorable geometry brings k close to one. Criticality safety treats those factors as a connected system rather than relying on a single rule. At Los Alamos, scientists must study chain reactions while also designing handling arrangements that prevent an accidental self-sustaining reaction.
    takeaway: Criticality safety is achieved by layered limits and verified process control, not by one calculation.
    format: SCIENCETANK
    why: The highest-value work reduces uncertainty in the variables that govern neutron balance and provides independent controls.
    proposals:
      - label: A
        text: Improve independent mass-accounting and process limits
      - label: B
        text: Characterize accidental moderation and geometry changes
      - label: C
        text: Add a decorative warning display with no new measurement
    recommended:
      A: 45
      B: 50

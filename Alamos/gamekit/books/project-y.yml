  - group: E
    task: Estimate how far the centre of mass sits from the light module.
    title: Packaging and center of gravity
    setup: An inert mockup has a 100 kg module and a 300 kg module separated by 1.5 m along a reference axis. This is not a Fat Man dimension set.
    scene: Fat Man is not only a nuclear assembly; it is a large object that must fit inside a modified B-29, remain balanced, and separate safely from the aircraft. Center of gravity describes where the object’s weight effectively acts, and a shift can change flight or release behavior. Engineers use inert shapes and weight distributions to study packaging without exposing nuclear components.
    takeaway: Packaging decisions affect handling, suspension, and flight behavior even when every component works individually.
    format: BALLPARK
    why: Balance follows the mass, so the centre of gravity sits close to the heavier module.
    estimate:
      prompt: An inert mockup carries a 100 kg module and a 300 kg module 1.5 m apart along its axis, 400 kg in total. Estimate how far the centre of mass sits from the light module.
      question: Choose the separation, the heavy module mass, and the total mass.
      labels:
        - 1.5 m separation
        - 300 kg heavy module
        - 400 kg total mass
        - 100 kg light module
      values: [1.5, 300, 400, 100]
      slots: 3
      template: x_cm ≈ {0} × {1} ÷ {2}
      formula: a*b/c
      correct: [0, 1, 2]
      target: 1.125
      tolerance: 0.06
      units: m
      solution: 1.5 m × 300 kg ÷ 400 kg ≈ 1.13 m from the light module.
      explanation: The balance point sits three-quarters of the way toward the heavy module. Balance follows mass, so changing one module’s mass moves the whole assembly’s centre of gravity and with it the aircraft-interface and release behaviour.
      givens:
        - Total mass = 400 kg
        - Distance from the light module = separation x heavy mass / total mass
      relationship: Centre of mass from the light module = separation × heavy mass ÷ total mass.
    answerText: About 1.13 m from the light module, three-quarters of the way toward the heavy 1.

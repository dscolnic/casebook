    title: Common-mode failure in simultaneous initiation
    setup: Choose the most valuable reliability investment.
    scene: Redundancy does not protect a system when several channels share the same power supply, clock, connector design, or manufacturing defect. That shared vulnerability is a common-mode failure. Since Fat Man relies on many simultaneous initiation channels, engineers must look for one fault capable of making all channels late, weak, or silent together.
    takeaway: The hardest reliability risks often hide in shared infrastructure.
    format: SCIENCETANK
    why: Redundancy protects only against failures that are genuinely independent.
    proposals:
      - label: A
        text: Add more channels that all share the same untested trigger path.
      - label: B
        text: Create independent timing references and diagnostics, then test shared power and procedure failure modes.
      - label: C
        text: Assume identical channels fail independently because they are physically separate.
    recommended:
      B: 90
      C: 0
    answerText: "Recommended: 90 to B, 10 in reserve; A and C receive none until common causes are addressed."

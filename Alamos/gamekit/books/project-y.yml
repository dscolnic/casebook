      - Which safeguard delivers it
    scenarios:
      - The weapon is being transported and must remain electrically inhibited.
      - The aircraft has released the weapon, but the firing chain should not respond until authorized conditions are met.
      - Two independent states must agree before the final command can pass.
      - A technician must confirm which safe/armed state was present after a rehearsal.
    choices:
      - Keep the transport safety device engaged so electrical energy cannot reach the firing chain during handling.
      - Use fuzing logic that waits for approved post-release conditions before allowing a firing command.
      - Use an interlock, or permissive, that requires two independent safe-to-fire conditions to agree.
      - Provide an indication that can be read from outside the case and a checklist entry signed at the time, so the condition is provable afterwards.
    mapping: [0, 1, 2, 3]
    answerText: The weapon is being transported and must remain electrically inhibited -> Keep the transport safety device engaged so electrical energy cannot reach the firing chain during handling; The aircraft has released the weapon, but the firing chain should not respond until authorized conditions are met -> Use fuzing logic that waits for approved post-release conditions before allowing a firing command; Two independent states must agree before the final command can pass -> Use an interlock, or permissive, that requires two independent safe-to-fire conditions to agree; A technician must confirm which safe/armed state was present after a rehearsal -> Provide an indication that can be read from outside the case and a checklist entry signed at the time, so the condition is provable afterwards
  - group: E
    task: Match each situation to the best action, control, document, or interpretation. Each option is used once.
    title: Explosive-lens segment interfaces
    setup: Match each observed problem to the first engineering response.
    scene: Fat Man’s explosive system is assembled from many manufactured segments whose surfaces must meet in controlled positions. A gap, reversed piece, missing identity mark, or conflicting drawing can change how the wave crosses an interface. Engineers use configuration records, inspection limits, and quarantine procedures because ‘making it fit’ by an unapproved adjustment can hide a serious symmetry error.

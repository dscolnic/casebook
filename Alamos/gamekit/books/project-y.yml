    title: Batch variability
    setup: 3 interventions compete for 100 credits.
    scene: Two batches produced by the same written process can differ because temperature, composition, mixing, timing, or equipment drifts. Final inspection may find the difference but does not reveal its cause. Los Alamos needs process measurements and designed experiments to learn which variables controlled material properties and to make production reproducible.
    takeaway: Quality improves fastest when variation is traced to controllable process variables.
    format: SCIENCETANK
    why: Inspection catches failures; process measurement and controlled experiments explain and prevent them.
    proposals:
      - label: A
        text: Rely on more end-of-line inspection without measuring which process variable caused the batch difference.
      - label: B
        text: Measure temperature, composition, and timing during each run so batch differences can be traced to process history.
      - label: C
        text: Vary the suspected process controls systematically so their separate effects and interactions can be measured.

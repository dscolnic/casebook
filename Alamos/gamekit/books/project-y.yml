# The campaign: 1 working day each, 3 stops and a callback from day 3.
missions:
  - title: Read the atomic world
    objective: Build a shared language for nuclei, isotopes, and detector signals before any team begins advanced work.
    briefing: Project Y cannot coordinate five divisions until everyone describes matter in the same way. Begin with the nucleus, connect isotope notation to chemical identity, and finish by seeing how radiation becomes a measurable electrical signal.
    stake: "April 1943, and the site is 3 weeks old. Five divisions, one mesa, and three different ways of writing the same nucleus on three different blackboards. The laboratory director, J. Robert Oppenheimer, has scheduled a colloquium every week for exactly this reason: nothing here can be coordinated until everybody describes matter the same way. Today you settle three things. What a nuclide symbol actually specifies. Why two isotopes of an element act alike in a beaker and differently in a counter. And how radiation becomes a number an instrument can report. Every measurement made here for the next two years rests on these three."
    takeaway: A nucleus is defined by its proton and neutron counts; experiments turn nuclear events into signals that can be counted.
    stops:
      - group: T
        call: Decode the nucleus
        task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
        title: The nucleus as a physical system
        setup: A theorist receives four unfamiliar nuclide labels and must extract the right quantity before doing any calculation.
        scene: Your first morning on the Hill. The Theoretical Division hands you four nuclide labels with no explanation and expects you to pull the right quantity out of each one before anybody calculates anything.
        assumes:
          - an atom has a nucleus of protons and neutrons, with electrons around it
        takeaway: Nuclear reasoning starts by translating notation into particles and conserved quantities.
        format: PROTOCOL
        why: Notation is only useful when each symbol is tied to a physical count. The atomic number Z is the proton count, and it fixes which element this is. The mass number A counts protons and neutrons together, so the neutron count is A minus Z — a subtraction, not a symbol on the label. Two atoms are isotopes of one element when Z is the same and A differs. And a neutral atom has as many electrons as protons, which is why Z decides the chemistry as well as the identity.
        rebuttals:
          - The proton count is read straight off the atomic number Z. It is the one quantity the notation gives you directly.
          - The neutron count is A minus Z. Nothing on the label states it, which is why this is the step people skip.
          - Isotopes share Z and differ in A. Same element, different nucleus — and that difference is the reason this site exists.
          - A neutral atom balances its protons with electrons, so the electron count equals Z. That is what ties chemistry to the nucleus.
        columns:
          - What you want to know
          - How you get it
        scenarios:
          - Need the number of protons
          - Need the number of neutrons
          - Need to decide whether two atoms are isotopes
          - Need the net charge of a neutral atom
        choices:
          - Read atomic number Z.
          - Compute A - Z.
          - Compare Z while A differs.
          - Set electron count equal to Z.
        mapping: [0, 1, 2, 3]
        answerText: Need the number of protons -> Read atomic number Z; Need the number of neutrons -> Compute A - Z; Need to decide whether two atoms are isotopes -> Compare Z while A differs; Need the net charge of a neutral atom -> Set electron count equal to Z
      - group: CM
        task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
        title: Isotopes and chemical identity
        scene: Chemistry and Metallurgy is being asked what it can and cannot deliver, and the answer turns on one fact about isotopes. Everything shipped here has both a chemical form and an isotopic composition.
        assumes:
          - chemical bonding is done by electrons
        takeaway: Materials work must track both chemical form and isotopic composition.
        format: PROTOCOL
        answerText: "Will two isotopes form similar chemical compounds? -> Yes: bonding is set by electron structure, which extra neutrons barely disturb.; Will they have the same half-life? -> No: stability is set inside the nucleus and can differ by orders of magnitude.; Can mass spectrometry distinguish them? -> Yes: sorting by mass-to-charge ratio responds to exactly the difference chemistry ignores.; Does atomic number determine the element? -> Yes: the proton count fixes the electron structure and therefore the chemical identity."
        why: "Isotopes of an element carry the same proton count and nearly the same electrons, so they form the same compounds and answer to the same reagents. Ordinary chemistry therefore has almost no handle for separating them. Nuclear stability is different: it is set inside the nucleus, and half-lives can differ enormously between isotopes of one element. Mass spectrometry sorts by mass-to-charge ratio, responding to the difference chemistry mostly ignores. That is why isotopic separation is a physical problem as well as a chemical one."
        call: Connect isotopes to chemistry
        setup: Match each question to the relevant property.
        rebuttals:
          - Two isotopes form similar compounds, because bonding is set by electron structure and extra neutrons barely disturb it.
          - They do not share a half-life. Stability lives inside the nucleus, and it can differ by orders of magnitude.
          - Mass spectrometry can separate them, because sorting by mass-to-charge responds to exactly the difference chemistry cannot see.
          - Atomic number does fix the element, because the proton count fixes the electron structure and the chemistry with it.
        columns:
          - What you want to know
          - What the physics says
        scenarios:
          - Will two isotopes form similar chemical compounds?
          - Will they have the same half-life?
          - Can mass spectrometry distinguish them?
          - Does atomic number determine the element?
        choices:
          - "Yes: bonding is set by electron structure, which extra neutrons barely disturb."
          - "No: stability is set inside the nucleus and can differ by orders of magnitude."
          - "Yes: sorting by mass-to-charge ratio responds to exactly the difference chemistry ignores."
          - "Yes: the proton count fixes the electron structure and therefore the chemical identity."
        mapping: [0, 1, 2, 3]
      - group: P
        task: Arrange the four cards from earliest cause or prerequisite to latest result.
        title: Ionization and detector signals
        scene: The Physics Division cannot see a single neutron or alpha particle, and neither can anybody else. Everything the Hill will claim about cross sections, backgrounds and yields rests on a chain of conversions working in order.
        assumes:
          - radiation deposits energy in whatever it passes through
        takeaway: A detector measures the consequences of an interaction, not radiation directly.
        format: SEQUENCE
        answerText: 2 -> 3 -> 4 -> 5 (Radiation deposits energy in the sensitive material -> The material sets free charge or light -> Electronics collect and amplify the response -> The data system digitizes and stores a pulse)
        why: A detector measures the consequences of an interaction, never the radiation itself. Energy has to be deposited in the sensitive material first — nothing downstream exists until that happens. That deposit sets free charge or light, which is the transducer step and the one that decides what the instrument is sensitive to at all. Electronics then collect and amplify a response too small to handle raw. The data system digitises and stores a pulse last. Get the chain wrong and you are measuring your own apparatus.
        call: Turn ionization into a signal
        setup: Order the detector chain from deposited energy to stored data.
        rebuttals:
          - Energy deposited in the sensitive material is where everything starts. No deposit, no signal, however good the electronics are.
          - "Free charge or light is the transducer step: the point where a nuclear event becomes something electrical."
          - Collection and amplification come third. They make a tiny response handleable, and they cannot create one that was never made.
          - Digitising and storing the pulse is last. It is the step people picture as the measurement, and it is the only one that adds no physics.
        cards:
          - Radiation deposits energy in the sensitive material
          - The material sets free charge or light
          - Electronics collect and amplify the response
          - The data system digitizes and stores a pulse
        order: [0, 1, 2, 3]
  - title: Account for nuclear energy
    objective: Connect mass, binding energy, calibration, and the program’s competing early architectures.
    briefing: The next step is to understand why nuclear changes involve such large energy scales, how a measurement system assigns an energy value, and why Los Alamos initially pursued more than one technical path.
    stake: May 1943. Two architectures are on the table, the site can properly staff one of them, and Groves wants to know which by the end of the month. Today you work out where nuclear energy comes from, check that the instruments reporting it are calibrated, and compare the two paths. Every energy figure quoted on this mesa is really the size of an electrical pulse, converted by a calibration somebody had to establish with a known source. An uncalibrated number is a voltage with ambitions. Choose on preference instead of evidence and a year of work goes into the wrong programme.
    takeaway: Mass defect sets the nuclear energy scale, but that scale becomes useful only after instruments and engineering goals are calibrated.
    stops:
      - group: T
        task: Estimate the total binding energy and the binding energy per nucleon.
        title: Mass defect and binding energy
        scene: "A theorist at the blackboard wants a number before lunch: how tightly a medium-heavy nucleus is bound. The arithmetic is small enough for one line, but the energy scale is the reason this laboratory exists at all."
        assumes:
          - mass and energy are related by E = mc², with E the energy, m the mass and c the speed of light
        takeaway: Tiny changes in mass correspond to large nuclear energies.
        format: BALLPARK
        answerText: About 1.5×10^3 MeV total, or about 7.5 MeV per nucleon.
        why: A bound nucleus weighs less than the loose protons and neutrons that went into it. That missing mass is the binding energy holding it together. The conversion factor is the speed of light squared. So a mass difference far too small to weigh becomes an energy larger than any chemical reaction can produce. Work in atomic mass units and 1 unit is about 931 MeV. That is what turns a defect of 8 thousandths of a unit per nucleon into more than 1000 MeV for the whole nucleus.
        call: Estimate binding energy
        setup: A medium-heavy nucleus has about 200 nucleons and a mass defect of about 0.008 atomic mass units per nucleon.
        estimate:
          prompt: A medium-heavy nucleus has about 200 nucleons, with a mass defect of roughly 0.008 atomic mass units per nucleon. 1 atomic mass unit is worth about 931 MeV. Estimate both the binding energy per nucleon and the total binding energy.
          question: Choose the mass defect per nucleon, the nucleon count, and the mass-to-energy conversion; compute B/A first and then B.
          labels:
            - 0.008 u/nucleon
            - 200 nucleons
            - 931 MeV/u
            - 8 u/nucleon
          values: [0.008, 200, 931, 8]
          slots: 3
          template: E ≈ {0} × {1} × {2}
          formula: a*b*c
          correct: [0, 1, 2]
          target: 1489.6
          tolerance: 80
          units: MeV
          solution: B/A ≈ 0.008 u/nucleon × 931 MeV/u ≈ 7.45 MeV/nucleon. Then B ≈ 7.45 MeV/nucleon × 200 nucleons ≈ 1.49×10³ MeV.
          explanation: The mass defect per nucleon gives about 7.5 MeV of binding per nucleon. Multiplying by about 200 nucleons gives roughly 1,500 MeV for the whole nucleus. The first number is what is plotted on the binding-energy-per-nucleon curve; the second is the total energy needed to separate this nucleus completely.
          givens:
            - Mass defect is about 0.008 u per nucleon
            - A nucleus of this size has about 200 nucleons
            - 1 atomic mass unit corresponds to about 931 MeV
          relationship: Binding energy per nucleon B/A = mass defect per nucleon × 931 MeV/u. Total binding energy B = (B/A) × A.
      - group: P
        task: Use the first reference line to map every gain-and-offset pair it allows. Then add the second line and lock the calibration that satisfies both.
        title: One reference line is not a calibration
        scene: Two Physics groups bring spectra from different instruments, and the peaks refuse to line up. Each group trusts its own axis. An afternoon comparison meeting is approaching, and somebody has to decide whether the disagreement belongs to the samples or to the instruments.
        assumes:
          - a straight-line calibration can have both a slope and an offset
          - one equation cannot determine two unknowns
        takeaway: One calibration point cannot determine both a slope and an offset; a second independent point breaks that degeneracy.
        format: DEGENERACY
        question: Which gain and offset are fixed by both reference lines?
        degeneracy:
          hint: Move gain and offset until the 500 keV reference lands on its marked channel. Notice that many pairs work. Then reveal the 1000 keV reference and satisfy both lines at once.
          controls:
            - id: gain
              label: Gain
              min: 1.5
              max: 2.5
              step: 0.1
              unit: keV/channel
            - id: offset
              label: Offset
              min: -150
              max: 150
              step: 10
              unit: keV
          truth:
            a: 2
            b: 0
          locus:
            - a: 1.6
              b: 100
            - a: 1.8
              b: 50
            - a: 2
              b: 0
            - a: 2.2
              b: -50
            - a: 2.4
              b: -100
          second:
            label: Reference line B
            locus:
              - a: 1.8
                b: 100
              - a: 1.9
                b: 50
              - a: 2
                b: 0
              - a: 2.1
                b: -50
              - a: 2.2
                b: -100
          observable:
            label: Reference line A
          tolerance:
            a: 0.05
            b: 10
        answerText: Gain = 2.0 keV per channel and offset = 0 keV. The first line alone permits many combinations; the second line leaves only their intersection.
        why: "A straight-line calibration has two unknowns: gain and offset. One known line gives only one equation, so many gain-and-offset pairs reproduce it exactly. That is not noise; it is missing information. A second line at a different energy supplies a second equation. The two allowed loci cross at one point, fixing both parameters. This is why a convincing-looking one-point calibration can still place every unknown peak at the wrong energy."
        call: Calibrate measured energy
        setup: Order the calibration workflow.
      - group: E
        task: Match each situation to the best action, control, document, or interpretation. Each option is used once.
        title: Two weapon architectures at Los Alamos
        scene: Oppenheimer has asked Ordnance for a recommendation before the next program meeting. Two assembly concepts are still alive, but choosing between them commits people, buildings, and months of work. The room is waiting for a decision that will reshape the Hill.
        assumes:
          - a chain reaction needs the material held together long enough to grow
        takeaway: Weapon architecture determines the entire downstream engineering program.
        format: PROTOCOL
        answerText: A design relies on bringing two separated pieces together along one axis. -> Gun-type architecture; A design relies on a converging wave that must preserve three-dimensional symmetry. -> Implosion architecture; A concept is comparatively straightforward to reason about but becomes unsuitable for reactor-produced plutonium. -> Gun-type program consequence; A concept demands a large diagnostic and high-explosive development program. -> Implosion program consequence
        why: Both concepts aim at the same goal. Bring subcritical material together fast enough that a chain reaction can grow before the assembly blows itself apart. They get there by completely different routes. A gun-type device drives one piece into another along one axis. That is a linear problem with a long history behind it. Implosion squeezes one piece inward with a converging wave, and nobody has built one. The two are not merely different shapes. They create different organisations, different test programmes and different risks.
        call: Compare the early architectures
        setup: Oppenheimer asks the Ordnance Division to classify the program consequences of the two early weapon concepts without using design dimensions.
        rebuttals:
          - A long device driving one subcritical piece into another along a single axis is the gun-type architecture. One dimension, and a well-understood one.
          - A compact device squeezing the material inward from every direction is implosion. The difficulty is that it has to work in three dimensions at once.
          - Plutonium measurements showing that a slow assembly can be interrupted early are what make the plutonium gun unusable, whatever its engineering merits.
          - Charges fired within microseconds of one another, explosives shaped to steer the wave and repeated full-scale rehearsals are the programme implosion demands. That is an organisation, not a drawing.
        columns:
          - What the engineers are looking at
          - What they decide
        scenarios:
          - Engineers sketch a long device in which one subcritical piece would be driven into another along a single axis.
          - Engineers sketch a compact device in which explosive waves would squeeze the material inward from every direction.
          - Plutonium measurements show that a slower assembly could be interrupted by a stray neutron before full assembly.
          - The alternative requires many charges firing within microseconds of one another, explosives shaped to steer the wave, and repeated full-scale rehearsals before a nuclear trial.
        choices:
          - "Use the gun-type concept: bring two separated subcritical pieces together rapidly along one line."
          - "Use the implosion concept: squeeze one piece inward from every side at once, with a pressure wave that closes on the centre."
          - "Abandon the gun-type route for this material: the chain would begin before the pieces were fully together, whatever the engineering merits."
          - Build an implosion-development program focused on timing, on how evenly the squeeze arrives, on diagnostics, and on explosive components that behave the same way twice.
        mapping: [0, 1, 2, 3]
  - title: Follow radioactivity through the laboratory
    objective: Treat decay as a quantitative process that must survive chemistry and background measurement.
    briefing: A radioactive sample changes while it is being prepared and measured. Follow the same evidence chain from the decay law, through tracer chemistry, to a defensible background measurement.
    stake: July 1943, and 3 groups have reported yields that cannot all be right. Seaborg's chemistry says one thing, and Woods's counters another. The sample decays while the chemistry is still running, so the amount at the end is not the amount you started with. Today you handle decay as arithmetic, follow an element through a separation, and measure what a counter reads with nothing in front of it. Woods will not report a number until she has measured that, which is why hers is the count the others are being checked against. Without a background count taken first, the number on its own means very little.

  - group: E
    task: Estimate the largest allowed path mismatch, then state the engineering response.
    title: Cable routing and signal integrity
    setup: An inert test rack must hold 2 signal paths matched to within 2 ns; signal speed in the cable is 2.0 x 10^8 m/s. These are classroom values.
    scene: A fast electrical pulse can be distorted by cable length, impedance mismatch, poor connections, or electromagnetic interference. If channels receive different pulse shapes or arrival times, detonators may not act together. Fat Man engineers therefore controlled cable routing, connector identity, shielding, and calibration as carefully as the explosive components themselves.
    takeaway: Seemingly passive hardware can carry critical timing information.
    format: BALLPARK
    why: Cable geometry can become part of the timing system.
    estimate:
      prompt: A test rack must hold 2 signal paths matched to within 2 ns (2×10⁻⁹ s), and signals travel at 2×10⁸ m/s in the cable. Estimate the largest path mismatch that still meets the requirement, in centimetres.
      question: Choose the timing tolerance, the signal speed, and the metres-to-centimetres conversion.
      labels:
        - 2×10⁻⁹ s tolerance
        - 2×10⁸ m/s signal speed
        - 100 cm/m
        - 1×10⁸ m/s signal speed
      values: [2e-9, 200000000, 100, 100000000]
      slots: 3
      template: max mismatch ≈ {0} × {1} × {2}
      formula: a*b*c
      correct: [0, 1, 2]
      target: 40
      tolerance: 4
      units: cm
      solution: 2×10⁻⁹ s × 2×10⁸ m/s × 100 cm/m ≈ 40 cm.
      explanation: "A 2 ns budget buys 40 cm of route mismatch — generous on a rack, but easy to spend once a cable detours around equipment. Converting the timing requirement into a length limit is what makes it inspectable: a technician can measure cable, not nanoseconds."
      givens:
        - Timing tolerance = 2 ns = 2 x 10^-9 s
        - Signal speed = 2.0 x 10^8 m/s
        - Allowed path mismatch = tolerance x signal speed
      relationship: Allowed length mismatch = timing tolerance × signal speed. Multiply by 100 to turn metres into centimetres.
    answerText: About 0.4 m, or 40 cm. The response is to turn the timing requirement into a measurable cable-length limit held under configuration control.

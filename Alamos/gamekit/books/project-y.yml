      - Compare chain-reaction timing against prediction and diagnostic evidence.
    order: [0, 1, 2, 3]
    answerText: 1 -> 2 -> 3 -> 4 (Maintain the pre-assembly neutron environment within the assumptions used by theory. -> Compress the plutonium assembly toward the intended high-density state. -> Produce a controlled burst of initiating neutrons near the selected time. -> Compare the resulting chain-reaction timing with predictions and diagnostic evidence.)
  - group: X
    task: Estimate the probability of at least one event using P approximately lambda when lambda is small.
    title: Pre-initiation probability as a time-window problem
    setup: Invented classroom rates are used and do not represent plutonium or Fat Man.
    scene: Pre-initiation risk depends on both the neutron background and the length of time the material remains vulnerable during assembly. A faster implosion shortens that time window, reducing the chance that a random neutron begins the reaction too soon. This probability argument explains why measuring plutonium’s spontaneous-neutron rate changes the entire Fat Man program.
    takeaway: The plutonium problem was fundamentally a race between random neutrons and assembly speed.
    format: BALLPARK
    why: For a fixed random-event rate, a shorter vulnerable time lowers the chance of an event during assembly.
    estimate:
      prompt: Random events arrive at 200 per second and the vulnerable window is 10 microseconds (10⁻⁵ s). When the expected number is small, the probability of at least one event is about the expected number. Estimate it as a percentage.
      question: Choose the event rate, the time window, and the percent conversion.
      labels:
        - 200 events/s
        - 10⁻⁵ s
        - 100 percent/unit
        - 10⁻² s
      values: [200, 0.00001, 100, 0.01]
      slots: 3
      template: probability ≈ {0} × {1} × {2}
      formula: a*b*c
      correct: [0, 1, 2]
      target: 0.2
      tolerance: 0.03
      units: "%"
      solution: 200 s⁻¹ × 10⁻⁵ s × 100 ≈ 0.2%.
      explanation: For a small expected count λ, the probability of at least one event is approximately λ. A short window can make even a substantial rate produce a small probability.
      givens:
        - Random-event rate r = 200 per second
        - Vulnerable window t = 10 microseconds = 1 x 10^-5 s
        - Expected events lambda = r t
      relationship: Probability ≈ the event rate × the length of the vulnerable window. Multiply by 100 for a percentage.
    answerText: lambda = 200 x 10^-5 = 0.002, so P is about 0.2 percent.
  - group: X
    task: Arrange the four cards from earliest cause or prerequisite to latest result.
    title: "RaLa: seeing an implosion with gamma rays"
    setup: Order a safe, conceptual RaLa evidence chain.
    scene: The RaLa experiments place a strong gamma-ray source inside an imploding mock assembly and measure how much radiation passed through as the material compresses. Greater density absorbs more gamma rays, so changing detector signals reveal the motion indirectly. This gives Los Alamos a way to see inside an opaque implosion and compare different lens designs without a nuclear core.
    takeaway: A decisive diagnostic converts an invisible internal process into multiple measurable traces.
    format: SEQUENCE
    why: Changing density changes gamma-ray attenuation, allowing the otherwise hidden implosion to be probed in time.
    cards:
      - Place a controlled gamma-ray source within an inert or surrogate implosion experiment.
      - Position external detectors along multiple viewing directions.
      - Record how transmitted gamma intensity changes as the assembly compresses.
      - Infer relative density history and compare symmetry among directions and against calculations.
    order: [0, 1, 2, 3]
    answerText: 1 -> 2 -> 3 -> 4 (Place a controlled gamma-ray source within an inert or surrogate implosion experiment. -> Position external detectors along multiple viewing directions. -> Record how transmitted gamma intensity changes as the assembly compresses. -> Infer relative density history and compare symmetry among directions and against calculations.)
  - group: X
    task: Match each situation to the best action, control, document, or interpretation. Each option is used once.
    title: Betatron and high-speed radiography
    setup: Match each radiography problem to its remedy.
    scene: A betatron produces energetic x-rays that can photograph dense material during a rapid event. High-speed radiography requires a short exposure, precise synchronization, enough penetration, and viewing angles that separate possible shapes. These images help determine whether an implosion stays symmetric rather than relying only on external flashes or fragments.
    takeaway: A picture becomes evidence only when its formation process is understood.
    format: PROTOCOL
    why: Radiography depends on temporal resolution, dynamic range, timing registration, and geometry.
    columns:
      - What is wrong with the image
      - How you fix it
    scenarios:
      - The image is blurred because the exposure window is too long.
      - Dense regions exceed the useful detector range.
      - The x-ray time cannot be related to initiation time.
      - One viewing angle cannot distinguish two possible asymmetries.
    choices:
      - Use a shorter or more precisely timed x-ray pulse so motion during the exposure does not blur the image.
      - Take a second exposure with the screen stepped down in sensitivity, so the darkest part of the picture still lands on the working part of the curve.
      - Feed one marker pulse to both the firing set and the recorder, so the two records share a zero.
      - Add another viewing direction or a complementary diagnostic so two different three-dimensional shapes do not look identical.
    mapping: [0, 1, 2, 3]
    answerText: The image is blurred because the exposure window is too long -> Use a shorter or more precisely timed x-ray pulse so motion during the exposure does not blur the image; Dense regions exceed the useful detector range -> Take a second exposure with the screen stepped down in sensitivity, so the darkest part of the picture still lands on the working part of the curve; The x-ray time cannot be related to initiation time -> Feed one marker pulse to both the firing set and the recorder, so the two records share a zero; One viewing angle cannot distinguish two possible asymmetries -> Add another viewing direction or a complementary diagnostic so two different three-dimensional shapes do not look identical
  - group: X
    task: Arrange the four cards from earliest cause or prerequisite to latest result.
    title: Hydrodynamic shots with surrogate cores
    setup: Order the test-development loop.
    scene: Hydrodynamic shots replace the fissile core with surrogate materials chosen to mimic important mass and shock properties. Multiple diagnostics then measure wave arrival, density, and shape. The purpose is to test the mechanical implosion repeatedly so that Trinity’s one nuclear test will not be the first time the full geometry had been examined.
    takeaway: A safe analog is useful only when its limits are explicit.
    format: SEQUENCE
    why: Surrogates reduce nuclear risk but introduce model-form uncertainty that must be tracked.
    cards:
      - Define which hydrodynamic behavior the surrogate must reproduce and which it cannot.
      - Assemble the authorized mock configuration with full traceability.
      - Conduct the instrumented shot and preserve timing, radiographic, and physical records.
      - Compare observations with models, inspect recovered evidence where possible, and change the design of the following shot.
    order: [0, 1, 2, 3]
    answerText: 1 -> 2 -> 3 -> 4 (Define which hydrodynamic behavior the surrogate must reproduce and which it cannot. -> Assemble the authorized mock configuration with full traceability. -> Conduct the instrumented shot and preserve timing, radiographic, and physical records. -> Compare observations with models, inspect recovered evidence when possible, and update the next test.)
  - group: X
    task: Allocate 100 research credits across the 3 proposals. You may hold credits in reserve, but explain the decision criterion.
    title: Control jets and hydrodynamic instabilities
    setup: The group has 100 credits after radiography reveals a narrow high-velocity feature near an interface.
    scene: A narrow jet of material can form when shocks interact with a void, gap, or surface imperfection, while hydrodynamic instabilities can amplify small ripples during acceleration. Such effects break spherical symmetry and mix materials. Fat Man development therefore requires both smooth manufacturing and experiments that can reveal how small defects grew under implosion.
    takeaway: The correct response to a small anomalous feature is an experiment that tells the explanations apart, not more energy or less resolution.
    format: SCIENCETANK
    why: Local defects and interface instabilities can grow into system-level asymmetry.
    proposals:
      - label: A
        text: Increase total explosive energy without locating the source of the feature.
      - label: B
        text: Run controlled defect and interface studies with improved radiography and model comparison.
      - label: C
        text: Average the image until the narrow feature disappears.
    recommended:
      B: 90
      C: 0
    answerText: "Recommended: 90 to B, 10 in reserve; A and C receive none."
  - group: X
    task: Arrange the four cards from earliest cause or prerequisite to latest result.
    title: Model-test correlation
    setup: Order the correlation workflow.
    scene: Model-test correlation compares a calculated quantity with a measurement that represents the same physical feature. Agreement in one observable does not guarantee the entire model is correct, while disagreement may come from either physics or diagnostics. Los Alamos needs carefully matched comparisons to use hydrodynamic tests as evidence for the Fat Man design.
    takeaway: Post hoc agreement is weaker than a successful pre-test prediction.
    format: SEQUENCE
    why: A model earns predictive authority by confronting data it did not already absorb.
    cards:
      - Generate pre-test predictions for specific observables, including uncertainty bands.
      - Conduct the controlled experiment without retuning the prediction afterward.
      - Compare arrival times, transmission histories, radiographs, and symmetry metrics.
      - Update model parameters or model form, and test that version on a fresh experiment.
    order: [0, 1, 2, 3]
    answerText: 1 -> 2 -> 3 -> 4 (Generate pre-test predictions for specific observables, including uncertainty bands. -> Conduct the controlled experiment without retuning the prediction afterward. -> Compare arrival times, transmission histories, radiographs, and symmetry metrics. -> Update model parameters or model form, then test the revised model on a new experiment.)
  - group: X
    task: Match each situation to the best action, control, document, or interpretation. Each option is used once.
    title: The Christy design simplification
    setup: Match each program concern to the benefit sought by simplifying the internal configuration.
    scene: The Christy design simplifies the internal core geometry into a more nearly solid configuration, reducing interfaces and making calculations and experiments easier to compare. Simplification does not make implosion easy, but it removes sources of uncertainty that are difficult to manufacture and model. This helps the program converge on one configuration for Trinity and Fat Man.
    takeaway: Robust design often wins by reducing the number of ways reality can differ from the model.
    format: PROTOCOL
    why: The Christy concept was valuable partly because it converted a difficult physics problem into a more controllable systems problem.
    columns:
      - What the program needs
      - What the simplification gives it
    scenarios:
      - A complicated internal geometry amplifies manufacturing and assembly uncertainty.
      - Theoretical calculations need a more tractable starting configuration.
      - Hydrodynamic tests must map more directly onto the proposed final design.
      - The program needs one configuration to freeze for Trinity and Fat Man.
    choices:
      - Reduce internal geometric complexity so fewer manufactured interfaces can introduce asymmetry.
      - Begin from a solid sphere rather than a shell, so the equations have one boundary to follow instead of several.
      - Shoot the development trials in the geometry the weapon will actually use, so model and measurement compare like with like.
      - Establish one integration baseline that can be frozen for Trinity and the Fat Man weapon.
    mapping: [0, 1, 2, 3]
    answerText: A complicated internal geometry amplifies manufacturing and assembly uncertainty -> Reduce internal geometric complexity so fewer manufactured interfaces can introduce asymmetry; Theoretical calculations need a more tractable starting configuration -> Begin from a solid sphere rather than a shell, so the equations have one boundary to follow instead of several; Hydrodynamic tests must map more directly onto the proposed final design -> Shoot the development trials in the geometry the weapon will actually use, so model and measurement compare like with like; The program needs one configuration to freeze for Trinity and Fat Man -> Establish one integration baseline that can be frozen for Trinity and the Fat Man weapon
  - group: X
    task: Allocate 100 research credits across the 3 proposals. You may hold credits in reserve, but explain the decision criterion.
    title: Freeze the implosion architecture
    setup: The laboratory has 100 credits and only months before Trinity.
    scene: Freezing the implosion architecture means selecting one controlled arrangement of lenses, initiation, core geometry, surrounding layers, and interfaces for final qualification. Without a baseline, each successful test might describe a different system. The freeze allows Trinity evidence to support the actual Fat Man configuration rather than a moving target.
    takeaway: A design freeze is a decision about evidence, schedule, and residual risk.
    format: SCIENCETANK
    why: Late-stage programs need focus, but focus must be earned by evidence and protected against groupthink.
    proposals:
      - label: A
        text: Continue every implosion concept equally to preserve optionality.
      - label: B
        text: Concentrate on the best-supported architecture while retaining a small independent challenge team and targeted backup studies.
      - label: C
        text: Freeze immediately without resolving the largest diagnostic discrepancy.
    recommended:
      B: 75
    answerText: "Recommended: 75 to B mainline development, 15 to independent challenge, 10 to targeted backup studies."
  - group: X
    task: Allocate 100 research credits across the 3 proposals. You may hold credits in reserve, but explain the decision criterion.
    title: Design the Trinity diagnostic portfolio
    setup: The test director has 100 diagnostic credits.
    scene: Because no instrument is guaranteed to survive or stay within range at Trinity, the diagnostic plan uses several independent methods for timing, radiation, blast, photography, and energy release. Redundancy across different physical principles makes the result interpretable even if one channel fails. The team must choose breadth of evidence over dependence on one expected ‘best’ measurement.
    takeaway: High-consequence experiments need independent observables and dynamic-range redundancy.
    format: SCIENCETANK
    why: No single instrument could be guaranteed to survive, remain in range, or be interpreted correctly.
    proposals:
      - label: A
        text: Put nearly all resources into one expected best yield measurement.
      - label: B
        text: Use several physically independent yield and timing methods, plus radiation and fallout monitoring.
      - label: C
        text: Maximize dramatic photography even if quantitative channels are underfunded.
    recommended:
      B: 85
    answerText: "Recommended: 85 to B, 10 to photography as 1 documented channel, 5 in reserve."
  - group: X
    task: Arrange the four cards from earliest cause or prerequisite to latest result.
    title: Trinity countdown and decision gates
    setup: Order the final decision chain.
    scene: A countdown is a series of decision gates, not simply a clock reaching zero. Weather, evacuation, communications, diagnostic readiness, configuration, and firing-system status each had a hold point and responsible authority. Trinity can produce useful evidence only if schedule pressure does not override an unresolved condition.
    takeaway: The authority to hold is as important as the authority to proceed.
    format: SEQUENCE
    why: A countdown is a governance structure that prevents schedule pressure from silently overriding unresolved conditions.
    cards:
      - Confirm the approved test configuration and all independent sign-offs.
      - Review weather, evacuation, communications, diagnostics, and firing-system status at defined holds.
      - Proceed only when the test director releases the final hold under the agreed authority structure.
      - After the event, maintain access control, collect remote evidence, and initiate radiation surveys before recovery work.
    order: [0, 1, 2, 3]
    answerText: 1 -> 2 -> 3 -> 4 (Confirm the approved test configuration and all independent sign-offs. -> Review weather, evacuation, communications, diagnostics, and firing-system status at defined holds. -> Proceed only when the test director releases the final hold under the agreed authority structure. -> After the event, maintain access control, collect remote evidence, and initiate radiation surveys before recovery work.)
  - group: X
    task: Arrange the four cards from earliest cause or prerequisite to latest result.
    title: From the Gadget to Fat Man
    setup: Order the transition.
    scene: The Trinity Gadget demonstrates the central implosion principle, but Fat Man also needs a casing, aircraft interfaces, fuzing, safety systems, field assembly, and controlled records. Moving from test device to weapon means preserving the validated core design while qualifying everything required for delivery. The transition joins Los Alamos science with Project Alberta engineering and logistics.
    takeaway: Demonstrating physics is not the same as fielding a system.
    format: SEQUENCE
    why: The Gadget and Fat Man shared the implosion principle, but combat deployment added a distinct engineering and logistics layer.
    cards:
      - Reconcile Trinity results with pre-test predictions and identify configuration-specific lessons.
      - Freeze the validated central implosion architecture and document any approved corrections.
      - Complete aircraft, casing, fuzing, safety, assembly, and field-interface qualification.
      - Transfer the controlled configuration, trained personnel, records, and spares to Project Alberta.
    order: [0, 1, 2, 3]
    answerText: 1 -> 2 -> 3 -> 4 (Reconcile Trinity results with pre-test predictions and identify configuration-specific lessons. -> Freeze the validated central implosion architecture and document any approved corrections. -> Complete aircraft, casing, fuzing, safety, assembly, and field-interface qualification. -> Transfer the controlled configuration, trained personnel, records, and spares to Project Alberta.)
  - group: X
    task: Match each situation to the best action, control, document, or interpretation. Each option is used once.
    title: Radiation, blast, and fallout consequences
    setup: Match each consequence to its primary physical origin.
    scene: "A nuclear explosion releases energy through several channels: a pressure wave from rapidly expanding hot material, intense thermal radiation, prompt neutrons and gamma rays, and later radiation from fission products and activated material. Understanding these channels is essential not only for predicting weapon effects but also for recognizing the human and environmental consequences of Fat Man."
    takeaway: Technical understanding must include what the device does to people and environments.
    format: PROTOCOL
    why: The weapon’s effects arise through several distinct channels with different spatial and temporal behavior.
    columns:
      - What the explosion produces
      - Which effect that is
    scenarios:
      - A rapidly expanding high-temperature region drives a pressure wave.
      - Electromagnetic radiation carries intense heat outward.
      - Neutrons and gamma rays released in the first instants.
      - Fission products and activated material can be transported and deposited after the event.
    choices:
      - Blast. Mechanical overpressure moving at roughly the speed of sound, so it arrives after the light does.
      - Thermal radiation. Arrives first at light speed, and is stopped by anything opaque between source and target.
      - Prompt ionizing radiation. Delivered within moments and only near the event, because air attenuates it strongly.
      - Residual radiation and fallout. The one channel that persists for days to years and can be carried far downwind.
    mapping: [0, 1, 2, 3]
    answerText: A rapidly expanding high-temperature region drives a pressure wave -> Blast. Mechanical overpressure moving at roughly the speed of sound, so it arrives after the light does; Electromagnetic radiation carries intense heat outward -> Thermal radiation. Arrives first at light speed, and is stopped by anything opaque between source and target; Neutrons and gamma rays released in the first instants -> Prompt ionizing radiation. Delivered within moments and only near the event, because air attenuates it strongly; Fission products and activated material can be transported and deposited after the event -> Residual radiation and fallout. The one channel that persists for days to years and can be carried far downwind
  - group: X
    task: Allocate 100 research credits across the 3 proposals. You may hold credits in reserve, but explain the decision criterion.
    title: Final Fat Man implosion synthesis
    setup: The final review has 100 curriculum credits to preserve the most important lessons.
    scene: Fat Man brings together plutonium measurements, rapid compression, explosive lenses, synchronized initiation, neutron multiplication, diagnostics, aircraft engineering, and field operations. Its history cannot be understood as one clever device; it is a tightly linked scientific and institutional system. A final synthesis must connect how the bomb works with how it is tested, deployed, and used.
    takeaway: The complete lesson is how science, systems, institutions, and human consequences became inseparable.
    format: SCIENCETANK
    why: Fat Man cannot be understood as only a physics device, only an engineering project, or only a historical event.
    proposals:
      - label: A
        text: "The physics chain: plutonium measurement, rapid assembly, compression, neutron multiplication, and diagnostics."
      - label: B
        text: "The engineering chain: reproducible components, timing, configuration control, aircraft and field integration."
      - label: C
        text: "The historical and ethical chain: Trinity, Nagasaki, radiation effects, secrecy, dissent, and nuclear legacy."
    recommended:
      A: 35
      B: 35
      C: 30
    answerText: "Recommended: about 35 to A, 35 to B, and 30 to C; nearby balanced allocations are acceptable if the learner explicitly connects the 3 chains."

# Diagnosis panels shared by several lessons, expanded at load by normalize.js.
packs:
  p6:
    id: p6
    level: L2
    title: The excess that would not go away
    role: You are deciding whether a weak sample is really emitting anything.
    hook: A sample has been counting about 40% above the rate recorded last week. The group wants to log it as a genuine activity increase. Before that goes in the book, the counting station has been put through a short series of checks.
    riddle: Something in this room is producing counts. What is it?
    salient:
      - shield
      - hvoff
    zones:
      source: Sample stage
      detector: Detector
      room: Room and shielding
      elec: Electronics
    readings:
      gross:
        name: Gross count rate, sample in place
        zone: source
        observed: 138 counts/min
        reference: about 98 counts/min last week
        purpose: The total rate from everything the detector can see. It cannot separate the sample from anything else contributing.
      blank:
        name: Rate with the sample removed
        zone: detector
        observed: 131 counts/min
        reference: about 95 counts/min last week
        purpose: What the station counts with nothing on the stage. If the excess survives here it was never coming from the sample.
      shield:
        name: Effect of extra lead around the detector
        zone: room
        observed: no measurable change
        reference: external gamma sources are attenuated by roughly half
        purpose: Lead placed outside the detector attenuates radiation arriving from the room. It does nothing about a source already inside the shield.
      hvoff:
        name: Counts with detector high voltage off
        zone: elec
        observed: 0 counts/min
        reference: 0 counts/min
        purpose: With no bias the detector cannot multiply real events, so anything still counted is electrical. Silence here clears the amplifier chain and nothing else.
      swap:
        name: Detector moved to a clean room, no sample
        zone: detector
        observed: excess persists
        reference: excess should be left behind
        purpose: Whether the excess travels with the hardware or stays with the location. This separates a contaminated instrument from a changed environment.
      secondet:
        name: Second identical detector, same room
        zone: room
        observed: normal rate
        reference: normal rate
        purpose: An independent instrument in the same place. A genuine change in the room should appear on both.
      repeat:
        name: Ten repeat measurements
        zone: detector
        observed: all within 3% of each other
        reference: expected random spread of about 3%
        purpose: Whether the effect reproduces. A fluctuation does not survive repetition; a real cause does.
    hypotheses:
      realsample:
        label: The sample really is more active
        choice: The material on the stage is emitting more than it was, and the counting station is reporting it correctly.
        sig:
          gross: hi
          blank: norm
          shield: drop
          hvoff: zero
          swap: gone
          secondet: norm
          repeat: consistent
      roombg:
        label: Room background has risen
        choice: Something stored nearby is raising the radiation level at this bench, so every measurement made here reads high.
        sig:
          gross: hi
          blank: hi
          shield: drop
          hvoff: zero
          swap: gone
          secondet: hi
          repeat: consistent
      contam:
        label: The detector or its holder is contaminated
        choice: Loose activity has transferred onto the instrument itself, so it counts its own contamination wherever it goes.
        sig:
          gross: hi
          blank: hi
          shield: nochange
          hvoff: zero
          swap: persists
          secondet: norm
          repeat: consistent
      noisefloor:
        label: Electrical noise is being counted
        choice: Instability in the bias supply or amplifier is producing pulses large enough to cross the threshold and be recorded as events.
        sig:
          gross: hi
          blank: hi
          shield: nochange
          hvoff: hi
          swap: persists
          secondet: norm
          repeat: consistent
      statfluke:
        label: Nothing to explain — ordinary statistical spread
        choice: Counting is a random process, and a run that lands high by chance needs no cause beyond the statistics.
        sig:
          gross: norm
          blank: norm
          shield: drop
          hvoff: zero
          swap: gone
          secondet: norm
          repeat: varies
    dismissal: statfluke
    answer: contam
    reasons:
      realsample: It explains the high gross rate, and it would be the convenient answer. But the excess is still there with the sample off the stage — 131 counts/min against a 95 baseline. Whatever is counting is not on the stage.
      roombg: "It explains an excess that survives removing the sample. It fails twice: the second detector in the same room reads normal, and the excess follows the instrument to a clean room instead of staying behind."
      noisefloor: "It fits the two loud findings exactly — a persisting excess that extra lead does not touch. It dies on the high-voltage test: with the bias off, the counter records nothing at all, so the pulses are real ionization, not electronics."
      statfluke: 10 repeats agree within 3%. Chance spread does not reproduce ten times, and it cannot survive removing the sample.
    resolve:
      title: The instrument is counting itself
      paras:
        - Loose activity has transferred onto the detector or its sample holder. The station is measuring a real source of radiation, which is why the pulses behave in every way like genuine events — they are genuine events. They are simply not coming from the sample anyone cares about.
        - This is the failure that background measurement exists to catch. A contaminated instrument produces a stable, reproducible, physically plausible excess. It survives repetition, it has the right pulse character, and it will happily be logged as a discovery.
      why:
        loud: The two headline findings — an excess that persists with the sample removed, and extra shielding that changes nothing — narrow this to a source inside the shield, either contamination or electronics. Neither finding can separate those two.
        quiet: "Silence with the high voltage off is what settles it. That single quiet reading eliminates electronics entirely, because a dead detector cannot produce ionization pulses. The normal second detector and the excess travelling to a clean room then corroborate: the activity is on this instrument."
      chain:
        - Loose activity transfers onto the detector or holder
        - The instrument counts its own contamination as if it were sample
        - Every sample measured on this station reads high until it is cleaned
      take: Measure the background with the instrument you will use, not just the room you will use it in.
    logic:
      - - Excess survives removing the sample
        - the source is not on the stage
      - - Extra lead changes nothing
        - "the source is inside the shield: contamination or electronics"
      - - No counts with the bias off
        - electronics cleared — the pulses are real ionization
      - - Excess follows the detector to a clean room
        - the activity is on the instrument
  cm8:
    id: cm8
    level: L2
    title: The batch that does not add up
    role: You are reconciling a separation batch whose numbers do not close.
    hook: A separation reports 91% purity and a clean product, but the mass balance is short by about 6% of the input. The chemist would like to sign the batch record. Six checks are on the bench.
    riddle: The material left the process. Where did it go?
    salient:
      - massbal
      - glassware
    zones:
      balance: Material balance
      streams: Process streams
      vessel: Vessels and transfer
      assay: Assay and standards
    readings:
      massbal:
        name: Input minus all measured outputs
        zone: balance
        observed: short by 6.1%
        reference: closes within 1%
        purpose: Whether everything that went in is accounted for in a measured stream. A gap says material left by a route nobody is measuring; it does not say which route.
      raffinate:
        name: Activity in the discarded aqueous stream
        zone: streams
        observed: 0.4% of input
        reference: under 1% for a complete separation
        purpose: Target left behind in the stream that was thrown away. High values mean the separation itself did not finish.
      glassware:
        name: Activity swabbed from vessel walls
        zone: vessel
        observed: 5.8% of input
        reference: under 0.5%
        purpose: Material adhering to surfaces instead of travelling with the liquid. Surfaces are outside every measured stream, so this loss is invisible to the balance.
      assaypurity:
        name: Fraction of counts from the target isotope
        zone: assay
        observed: 91%
        reference: above 90%
        purpose: How much of the measured activity is the species of interest. It says nothing about how much of the element was recovered.
      standardcheck:
        name: Known reference source on the same counter
        zone: assay
        observed: within 1.5% of certificate
        reference: within 2%
        purpose: Whether the instrument is reading correctly at all. A drifted counter can manufacture an apparent gap out of good chemistry.
      gravimetric:
        name: Weighed product mass vs assayed mass
        zone: balance
        observed: agree within 1%
        reference: agree within 2%
        purpose: An independent check on the product. Disagreement points to something inert riding along with the target.
    hypotheses:
      incomplete:
        label: The separation did not finish
        choice: Part of the target stayed in the liquid that was discarded, so the loss should be sitting in a stream that was measured and thrown away.
        sig:
          massbal: gap
          raffinate: hot
          glassware: clean
          assaypurity: high
          standardcheck: ok
          gravimetric: agree
      coprecip:
        label: A contaminant came down with the product
        choice: Another species precipitated alongside the target, adding mass that is not the element of interest and coating the vessel as it formed.
        sig:
          massbal: excess
          raffinate: clean
          glassware: hot
          assaypurity: low
          standardcheck: ok
          gravimetric: disagree
      standarderr:
        label: The counting standard is mis-calibrated
        choice: The instrument converts counts to quantity with the wrong factor, so the chemistry is fine and only the arithmetic is short.
        sig:
          massbal: gap
          raffinate: clean
          glassware: clean
          assaypurity: high
          standardcheck: "off"
          gravimetric: agree
      adsorb:
        label: Target adsorbed onto the vessel walls
        choice: The element plated out on glass and transfer lines, leaving the process by a route that no stream measurement covers.
        sig:
          massbal: gap
          raffinate: clean
          glassware: hot
          assaypurity: high
          standardcheck: ok
          gravimetric: agree
      roundoff:
        label: Nothing to explain — bookkeeping
        choice: The gap is the accumulated rounding of several separately reported figures and does not correspond to missing material.
        sig:
          massbal: closes
          raffinate: clean
          glassware: clean
          assaypurity: high
          standardcheck: ok
          gravimetric: agree
    dismissal: roundoff
    answer: adsorb
    reasons:
      incomplete: It is the first thing to suspect when a balance is short, and it explains the gap. But the discarded aqueous phase holds 0.4% of the input — under the completeness limit. The separation worked; the material went somewhere else.
      coprecip: "It accounts for the hot glassware. It gets the balance backwards: co-precipitation adds mass to the product, so the balance would run long, not short. Purity at 91% and the weighed mass agreeing with the assay both argue against extra material riding along."
      standarderr: It would explain a gap with clean streams, and it is worth ruling out on every batch. The reference source reads within 1.5% of its certificate, so the counter is converting correctly.
      roundoff: A 6.1% gap is far outside the 1% the balance normally closes to, and 5.8% of the input is physically present on the vessel walls. There is material to find.
    resolve:
      title: The loss is on the glass
      paras:
        - The target adsorbed onto vessel walls and transfer lines. It never entered a measured stream, which is exactly why the balance could not find it — the accounting covers liquids in and liquids out, and this material is on a surface.
        - Note that every quality figure on this batch is good. Purity is 91%, the standard checks out, the product weighs what the assay says it should, and the discarded phase is clean. A batch can pass every test it is given and still have lost a twentieth of the material to a route nobody measured.
      why:
        loud: "The 2 headline findings are a 6.1% gap and 5.8% of the input recovered from vessel walls. Neither alone identifies the cause: a gap fits three different candidates, and hot glassware fits both adsorption and co-precipitation."
        quiet: Together they close it, and the quiet readings confirm the mechanism rather than merely permitting it. The clean raffinate rules out an unfinished separation, the reference source rules out the counter, and the agreeing gravimetric rules out extra material coming down with the product.
      chain:
        - Target plates onto glass and transfer-line surfaces
        - Material leaves the process outside every measured stream
        - Yield is real but unrecorded, and the balance cannot say where it went
      take: A yield figure is only as complete as the list of routes you measured.
    logic:
      - - Balance short by 6.1%
        - material left by an unmeasured route
      - - 5.8% recovered from vessel walls
        - the route is surface adsorption or co-precipitation
      - - Raffinate clean at 0.4%
        - the separation itself finished
      - - Balance short, not long, and purity high
        - nothing extra came down with the product
  p15:
    id: p15
    level: L2
    title: The neutrons that never arrived
    role: You are checking a neutron counter that reads well below prediction.
    hook: A calibrated source should give roughly 1,200 counts per minute on this counter. It is reading 340. The source certificate is current and the geometry was set up from the drawing.
    riddle: Are the neutrons missing, or is the counter missing them?
    salient:
      - pulseheight
      - cadmium
    zones:
      source: Source and path
      detector: Detector
      elec: Electronics
      indep: Independent check
    readings:
      rate:
        name: Measured rate
        zone: detector
        observed: 340 counts/min
        reference: about 1,200 counts/min predicted
        purpose: The headline shortfall. It cannot distinguish neutrons that never arrived from neutrons that arrived and were not recorded.
      pulseheight:
        name: Pulse-height distribution
        zone: elec
        observed: large population piled up just below the threshold
        reference: distribution well clear of the threshold
        purpose: Where recorded pulses sit relative to the discriminator. Pulses bunched under the cut are being produced but not counted; it does not say why they are small.
      foil:
        name: Activation foil at the detector face
        zone: indep
        observed: activity as predicted
        reference: activity as predicted
        purpose: "A measurement with no electronics at all: neutrons either activate the foil or they do not. It proves arrival, and nothing about the counting chain."
      cadmium:
        name: Rate change when cadmium is inserted
        zone: source
        observed: change under 5%
        reference: a thermalized field drops sharply; a fast field barely moves
        purpose: Cadmium absorbs slow neutrons strongly and fast ones hardly at all, so the size of the change reports how much of the field has been slowed.
      distance:
        name: Rate against inverse-square check
        zone: source
        observed: follows 1/r² within 4%
        reference: follows 1/r²
        purpose: Whether the geometry is what the drawing says. A steeper falloff means the real solid angle is smaller than assumed.
      repeat:
        name: Five repeat runs
        zone: detector
        observed: all within 4%
        reference: Poisson scatter of about 5%
        purpose: Whether the shortfall is stable. A reproducible deficit has a cause; scatter does not.
    hypotheses:
      moderation:
        label: The field has been slowed by nearby material
        choice: Neutrons scattering off surrounding matter arrive with much lower energy, depositing less in the detector and producing smaller pulses.
        sig:
          rate: low
          pulseheight: under
          foil: normal
          cadmium: big
          distance: inverse
          repeat: consistent
      absorption:
        label: A layer between source and detector is absorbing them
        choice: Hydrogenous or boron-loaded material in the path removes neutrons before they reach the detector, so fewer arrive at all.
        sig:
          rate: low
          pulseheight: clear
          foil: low
          cadmium: small
          distance: inverse
          repeat: consistent
      threshold:
        label: The discriminator threshold is set too high
        choice: Real pulses of ordinary size are falling below the level at which the counter accepts an event, so genuine neutrons go unrecorded.
        sig:
          rate: low
          pulseheight: under
          foil: normal
          cadmium: small
          distance: inverse
          repeat: consistent
      geometry:
        label: The solid angle is smaller than assumed
        choice: The real source-to-detector separation or alignment differs from the drawing, so the counter intercepts a smaller fraction than the prediction assumed.
        sig:
          rate: low
          pulseheight: clear
          foil: low
          cadmium: small
          distance: steeper
          repeat: consistent
      normalvar:
        label: Nothing to explain — ordinary variation
        choice: Day-to-day differences in a counting setup of this kind are large, and a single low reading does not need a cause.
        sig:
          rate: normal
          pulseheight: clear
          foil: normal
          cadmium: small
          distance: inverse
          repeat: varies
    dismissal: normalvar
    answer: threshold
    reasons:
      moderation: "It is a real mechanism and it produces exactly the pile-up of small pulses seen here — this is the rival worth taking seriously. It fails the cadmium test: a field slowed enough to lose two-thirds of the counts would collapse when cadmium is inserted, and the change measured is under 5%."
      absorption: It explains a shortfall in arrivals. But the activation foil records the predicted activity, so the neutrons are reaching the detector face. Nothing removed them from the path.
      geometry: Always worth suspecting when a prediction and a measurement disagree by a factor of three. The rate follows inverse-square within 4%, so the geometry matches the drawing it was predicted from.
      normalvar: 5 runs agree within 4%, tighter than the Poisson scatter. A factor-of-three deficit that reproduces is not variation.
    resolve:
      title: The neutrons arrived and were not counted
      paras:
        - The discriminator threshold is set above where this detector puts its pulses, so ordinary events are being produced, amplified, and then rejected. The counting chain is discarding two-thirds of a perfectly good signal.
        - The activation foil is the reading that reframes the whole problem. It measures neutrons with no electronics whatsoever, and it says the predicted flux is arriving. Once arrival is established, every explanation involving the source, the path, or the geometry is dead, and the fault has to be downstream of the detector face.
      why:
        loud: "Pulses piled up under the threshold is the striking finding, but it has two honest explanations: the pulses are small because the neutrons are slow, or the cut is too high for normal pulses. The pile-up cannot distinguish them."
        quiet: Cadmium separates them. A slowed field is defined by its sensitivity to cadmium, and this field barely responds — under 5%. So the neutrons are not slow, and the threshold is wrong. The foil and the inverse-square check independently confirm that arrival and geometry are both fine.
      chain:
        - Discriminator threshold set above the detector pulse distribution
        - Genuine neutron events are produced and then rejected as noise
        - The counter reports a third of the true rate with no sign of malfunction
      take: Before believing a low count, find one measurement that does not go through the electronics.
    logic:
      - - Pulses piled up below the threshold
        - events are being produced but not accepted
      - - Cadmium changes the rate by under 5%
        - the field is not thermalized — the pulses are not small because the neutrons are slow
      - - Activation foil reads as predicted
        - the neutrons are arriving; the fault is after the detector face
      - - Rate follows 1/r²
        - the geometry matches the prediction
  cm12:
    id: cm12
    level: L3
    title: A phase that should not be there
    role: You are explaining a microstructure the phase diagram does not predict.
    hook: A cast part has come back from metallography with two phases where the diagram says there should be one at this composition and temperature. It is measurably harder than the last five castings. The diagram is not wrong, so something about this casting is not what was assumed.
    riddle: The equilibrium map does not predict this structure. What did the metal experience that the map does not describe?
    salient:
      - micro
      - hardness
    zones:
      metallography: Metallography
      assay: Chemical assay
      process: Process record
      xray: Diffraction
    readings:
      micro:
        name: Etched microstructure
        zone: metallography
        observed: two distinct phases
        reference: single phase at this composition and temperature
        purpose: What structure is actually present. It shows that equilibrium was not reached or not what was assumed, without saying which.
      hardness:
        name: Bulk hardness
        zone: metallography
        observed: 31% above the recent average
        reference: within 10% of the average
        purpose: A bulk mechanical consequence of structure. Many different second phases raise hardness, so it confirms the structure is real but does not identify it.
      chemcomp:
        name: Bulk composition assay
        zone: assay
        observed: all major elements on specification
        reference: on specification
        purpose: Whether the alloy sits where the drawing says on the diagram. On-specification composition removes the simplest explanation for landing in a different phase field.
      coolrate:
        name: Thermocouple cooling record
        zone: process
        observed: within the normal band throughout
        reference: within the normal band
        purpose: How fast the casting actually cooled. Cooling rate decides whether the metal had time to reach the structure the diagram predicts.
      xrd:
        name: X-ray diffraction phase identification
        zone: xray
        observed: a second equilibrium phase, not a metastable one
        reference: single phase
        purpose: Identifies which phases are present by crystal structure. It distinguishes a phase frozen in by fast cooling from one that is genuinely stable under these conditions.
      impurity:
        name: Trace element assay
        zone: assay
        observed: 1 trace element at 9x its usual level
        reference: at or below usual levels
        purpose: Elements too dilute to appear in the major assay. Small amounts can shift phase boundaries or concentrate locally during freezing.
      repolish:
        name: Re-prepared and re-etched specimen
        zone: metallography
        observed: second phase still present
        reference: unchanged if real
        purpose: Whether the feature survives new preparation. Polishing and etching can create appearances that are not in the metal.
    hypotheses:
      quench:
        label: Cooled too fast — a metastable phase was retained
        choice: Rapid cooling denied the metal time to reach equilibrium, freezing in a structure the diagram only predicts at higher temperature.
        sig:
          micro: two
          hardness: high
          chemcomp: onspec
          coolrate: fast
          xrd: metastable
          impurity: clean
          repolish: unchanged
      composition:
        label: Composition is off specification
        choice: The alloy is not where the drawing says it is, so it sits in a two-phase field of the diagram and a second phase is the correct equilibrium answer.
        sig:
          micro: two
          hardness: high
          chemcomp: offspec
          coolrate: normal
          xrd: equilibrium
          impurity: clean
          repolish: unchanged
      contamination:
        label: A trace impurity stabilised an extra phase
        choice: An element present in small quantity shifted the local phase boundary, making a second phase stable at a composition the diagram treats as single-phase.
        sig:
          micro: two
          hardness: high
          chemcomp: onspec
          coolrate: normal
          xrd: equilibrium
          impurity: elevated
          repolish: unchanged
      segregation:
        label: Slow freezing let the composition segregate
        choice: Solute rejected ahead of the freezing front concentrated in the last liquid, so parts of the casting have a different local composition from the bulk.
        sig:
          micro: two
          hardness: high
          chemcomp: onspec
          coolrate: slow
          xrd: equilibrium
          impurity: elevated
          repolish: unchanged
      etchartifact:
        label: Nothing to explain — a preparation artifact
        choice: The apparent second phase is a product of polishing or etching rather than a feature of the metal.
        sig:
          micro: two
          hardness: normal
          chemcomp: onspec
          coolrate: normal
          xrd: single
          impurity: clean
          repolish: resolved
    dismissal: etchartifact
    answer: contamination
    reasons:
      quench: "It explains a second phase with on-specification composition, and it is the standard answer when a structure disagrees with the diagram. Two readings defeat it: the cooling record stays inside the normal band throughout, and diffraction identifies an equilibrium phase rather than a metastable one."
      composition: It would make the second phase correct rather than anomalous, which is the cleanest possible explanation. The bulk assay puts every major element on specification, so the alloy is where the drawing says it is.
      segregation: "A serious rival: it explains an on-specification bulk with locally elevated trace levels and an equilibrium second phase. It needs slow freezing to concentrate solute in the last liquid, and the thermocouple record shows an ordinary cooling rate."
      etchartifact: Worth eliminating first and cheap to test. The second phase survives re-preparation, diffraction sees it as a distinct crystal structure, and the hardness is 31% high — a polishing artifact does not change bulk hardness.
    resolve:
      title: A trace element moved the boundary
      paras:
        - "An impurity nine times its usual level has shifted the local phase boundary, so a second phase is genuinely stable at a composition the diagram treats as single-phase. Diffraction confirms it: this is an equilibrium phase, not something frozen in."
        - The diagram was never wrong. It describes the alloy system it was drawn for, and this casting is a slightly different system. That is the honest reading of any equilibrium map — it is a statement about a specified composition, and a trace element the assay was not looking for makes the composition something else.
      why:
        loud: Two phases and high hardness establish that the structure is real and consequential, but they leave four candidates standing. Every mechanism here produces a hard, two-phase casting; the loud readings cannot choose between them.
        quiet: "Two quiet readings in different departments do the work. The trace assay narrows the field to the two candidates that involve locally elevated impurity, contamination and segregation. The process record then separates those: segregation requires slow freezing, and cooling was normal. Diffraction corroborates by identifying the phase as equilibrium rather than metastable."
      chain:
        - A trace element enters at nine times its usual level
        - The local phase boundary shifts and a second phase becomes stable
        - The casting is harder than specification and the diagram appears to be violated
      take: A phase diagram describes one composition. Verify you still have that composition before doubting the map.
    logic:
      - - 2 phases, hardness 31% high
        - the structure is real — four mechanisms remain
      - - Trace element 9x usual level
        - narrows to contamination or segregation
      - - Cooling record normal
        - segregation needs slow freezing — eliminated
      - - Diffraction sees an equilibrium phase
        - not a metastable structure frozen in by quenching
  p12:
    id: p12
    level: L3
    title: Eight channels that will not agree
    role: You are finding out why a timing array disagrees with itself.
    hook: 8 channels watching 1 event report arrival times spread over 14 ns when the array is specified to 4. An independent clock cross-check came back clean, so the reference itself is sound. The spread is in the array.
    riddle: Every channel sees the same event. What is different about what each one reports?
    salient:
      - spread
      - refcheck
    zones:
      array: Channel array
      cable: Cable plant
      disc: Discriminators
      ref: Time reference
    readings:
      spread:
        name: Channel-to-channel arrival spread
        zone: array
        observed: 14 ns
        reference: 4 ns specified
        purpose: How badly the array disagrees. It establishes that a problem exists without locating it.
      refcheck:
        name: Independent clock cross-check
        zone: ref
        observed: agrees within 0.3 ns
        reference: agrees within 1 ns
        purpose: Whether the shared time reference is where it claims to be. A sound reference means the disagreement was introduced downstream of it.
      pattern:
        name: Shape of the disagreement
        zone: array
        observed: scattered across channels, no single outlier
        reference: no pattern
        purpose: Whether channels move together, one moves alone, or all scatter. Each fault leaves a different signature here.
      amplitude:
        name: Apparent time against pulse height
        zone: disc
        observed: no correlation
        reference: no correlation
        purpose: Whether large pulses appear earlier than small ones. A fixed threshold is crossed sooner by a steeper edge, which makes timing depend on amplitude rather than on physics.
      cablelen:
        name: Measured cable lengths
        zone: cable
        observed: all matched within 5 cm
        reference: matched within 10 cm
        purpose: Physical path length per channel. Signal speed is finite, so extra cable is a fixed offset in one channel — measurable with a tape rather than a scope.
      pulserinject:
        name: Identical test pulses injected at the inputs
        zone: disc
        observed: all channels align within 1 ns
        reference: align within 1 ns
        purpose: Removes the detectors and the event, leaving the electronics and cable. Alignment here means the fixed delays through the chain are equal.
      width:
        name: Per-channel distribution width
        zone: array
        observed: broad on every channel
        reference: narrow
        purpose: The spread of repeated measurements within one channel. A fixed error shifts a narrow distribution; a random one widens it.
    hypotheses:
      clockoffset:
        label: The shared reference has shifted
        choice: One common time reference feeds every channel, so an error there moves all of them by the same amount and cancels in channel-to-channel differences.
        sig:
          spread: large
          refcheck: offset
          pattern: common
          amplitude: none
          cablelen: matched
          pulserinject: aligned
          width: narrow
      timewalk:
        label: Time walk at the discriminators
        choice: A fixed threshold is crossed earlier by a steeper leading edge, so recorded time depends on pulse amplitude even when the events are simultaneous.
        sig:
          spread: large
          refcheck: ok
          pattern: scattered
          amplitude: correlated
          cablelen: matched
          pulserinject: aligned
          width: broad
      cabledelay:
        label: One channel has a longer signal path
        choice: Extra cable on a single channel adds a fixed delay to that channel only, leaving the others correct.
        sig:
          spread: large
          refcheck: ok
          pattern: one-channel
          amplitude: none
          cablelen: mismatched
          pulserinject: offset-one
          width: narrow
      jitter:
        label: Random jitter at the threshold
        choice: Noise riding on the signal moves the moment each pulse crosses the threshold, scattering arrival times symmetrically around the true value.
        sig:
          spread: large
          refcheck: ok
          pattern: scattered
          amplitude: none
          cablelen: matched
          pulserinject: aligned
          width: broad
      withinspec:
        label: Nothing to explain — inside tolerance
        choice: An array of this size is expected to disagree at this level, and the spread does not warrant investigation.
        sig:
          spread: small
          refcheck: ok
          pattern: scattered
          amplitude: none
          cablelen: matched
          pulserinject: aligned
          width: narrow
    dismissal: withinspec
    answer: jitter
    reasons:
      clockoffset: It is the first thing to check on a shared-reference array, and it would explain a large spread. The independent cross-check agrees within 0.3 ns, so the reference is sound — and a common offset would cancel in channel-to-channel differences anyway rather than creating them.
      timewalk: The strongest rival. It survives both headline findings and it broadens the per-channel distribution exactly as observed. It requires recorded time to track pulse height, and there is no correlation between them at all.
      cabledelay: It explains a large spread with a sound reference, and it is easy to check. Cable lengths match within 5 cm, injected test pulses align across all channels, and the disagreement is scattered rather than isolated to 1 channel — a cable fault moves 1 channel, not 8.
      withinspec: The array is specified to 4 ns and is delivering 14. Calling that acceptable would mean abandoning the specification rather than meeting it.
    resolve:
      title: Noise at the threshold, not a delay
      paras:
        - Random noise on the signal is moving the instant each pulse crosses the discriminator threshold. Every channel is affected, none is biased, and the result is a symmetric scatter about the true arrival time — which is why the mean is still right and only the width has grown.
        - "The distinction matters for what you do next. A fixed error can be measured once and subtracted. Jitter cannot: it must be reduced at the source by improving signal-to-noise, shaping the pulse, or replacing threshold discrimination with a method that does not depend on where a noisy edge crosses a fixed level."
      why:
        loud: A 14 ns spread with a clean reference cross-check leaves 3 live candidates — time walk, cable delay, and jitter. The loud readings establish that the disagreement is real and was introduced downstream of the reference, and there they stop.
        quiet: Two quiet readings in different parts of the chain finish it. No correlation between apparent time and pulse height eliminates time walk, the one rival that otherwise fits every observation. Matched cable lengths, backed by injected test pulses aligning across all channels, eliminate a path-length fault. What survives is a random error, and the broad per-channel width confirms it.
      chain:
        - Noise rides on the signal into the discriminator
        - The threshold-crossing moment moves randomly, event to event
        - Arrival times scatter symmetrically and no amount of calibration removes it
      take: A fixed error can be calibrated out. A random one has to be engineered out.
    logic:
      - - 14 ns spread, reference clean
        - "three candidates remain: time walk, cable delay, jitter"
      - - No correlation between time and pulse height
        - time walk eliminated
      - - Cable lengths matched, test pulses aligned
        - path-length fault eliminated
      - - Every channel broad, none biased
        - a random error, not a fixed one
  cm17:
    id: cm17
    level: L2
    title: The part that broke without bending
    role: You are running the failure analysis on a component that broke in service.
    hook: A machined component failed under a load it was qualified for. It broke cleanly, with no visible bending. The material certificate is in order and the part passed dimensional inspection before installation.
    riddle: The material was qualified for this load. What made this part different from the coupon that qualified it?
    salient:
      - hardness
      - origin
    zones:
      fracture: Fracture surface
      geom: Geometry
      surface: Surface condition
      history: Load history
    readings:
      fracture:
        name: Fracture surface appearance
        zone: fracture
        observed: flat cleavage facets, no shear lip
        reference: ductile tearing with a shear lip
        purpose: How the crack travelled. Cleavage means the material separated without absorbing much energy; it does not say why it was able to.
      deformation:
        name: Permanent deformation near the break
        zone: geom
        observed: none measurable
        reference: visible necking if the part yielded
        purpose: Whether the part deformed before it broke. Absence of deformation rules out simple overload past yield.
      hardness:
        name: Surface hardness vs bulk hardness
        zone: surface
        observed: surface 44% harder than bulk
        reference: uniform within 10%
        purpose: Whether the outer layer differs from the interior. A hardened surface layer is often also a brittle one, and it can come from the material or from the machining.
      origin:
        name: Crack origin location
        zone: fracture
        observed: at the machined surface
        reference: wherever stress is highest
        purpose: Where the failure started. A surface origin points at surface condition, geometry, or handling rather than at bulk material.
      cycles:
        name: Load history
        zone: history
        observed: single steady application
        reference: as qualified
        purpose: Whether the part was loaded once or repeatedly. Progressive cracking requires cycles; a single application does not produce it.
      dimensional:
        name: Dimensions before failure
        zone: geom
        observed: within drawing tolerance
        reference: within drawing tolerance
        purpose: Whether the part was made to size. In-tolerance dimensions remove geometry as the stress concentrator.
    hypotheses:
      brittle:
        label: The material itself was too brittle
        choice: The bulk material had insufficient toughness for the application, so it separated without absorbing energy anywhere the stress was highest.
        sig:
          fracture: cleavage
          deformation: none
          hardness: elevated
          origin: interior
          cycles: steady
          dimensional: intol
      yieldfail:
        label: Loaded past its yield strength
        choice: The applied load exceeded the stress at which the material deforms permanently, so the part changed shape before it gave way.
        sig:
          fracture: ductile
          deformation: large
          hardness: uniform
          origin: bulk
          cycles: steady
          dimensional: outtol
      fatigue:
        label: Progressive cracking under cyclic load
        choice: Repeated loading grew a crack from the surface over many cycles until the remaining section could no longer carry the load.
        sig:
          fracture: striations
          deformation: none
          hardness: uniform
          origin: surface
          cycles: cyclic
          dimensional: intol
      surfacedamage:
        label: Machining damaged the surface layer
        choice: Cutting heat transformed and hardened a thin surface layer, creating a brittle skin that cracked first and handed a running crack to sound material underneath.
        sig:
          fracture: cleavage
          deformation: none
          hardness: elevated
          origin: surface
          cycles: steady
          dimensional: intol
      mishandling:
        label: Nothing to explain — damaged before installation
        choice: The part was knocked or dropped in transit, and the break reflects that damage rather than anything about the material or the process.
        sig:
          fracture: cleavage
          deformation: none
          hardness: uniform
          origin: surface
          cycles: steady
          dimensional: intol
    dismissal: mishandling
    answer: surfacedamage
    reasons:
      brittle: It explains cleavage without deformation and it explains the hardness reading, so it is the rival that survives longest. But a bulk-brittle part fails wherever the stress is highest, which here is in the interior. This crack started at the machined surface.
      yieldfail: The obvious candidate for a part that broke under load, and the easiest to check. It requires visible permanent deformation, and there is none measurable. The fracture is cleavage rather than ductile tearing, and the part was in tolerance.
      fatigue: It correctly predicts a surface origin, which is why it cannot be dismissed on location alone. It needs repeated loading to grow a crack, and the load history shows a single steady application. The fracture also shows cleavage facets rather than the progressive striations fatigue leaves behind.
      mishandling: It would explain a surface-origin cleavage break, and handling damage is common enough to be worth ruling out. It cannot explain a surface layer 44% harder than the bulk — dropping a part does not harden it.
    resolve:
      title: The skin failed before the metal did
      paras:
        - Cutting heat during machining transformed a thin surface layer into something harder and more brittle than the material underneath. That skin cracked at a load the bulk material could carry, and once a sharp crack existed it ran into sound metal and took the part with it.
        - Every acceptance check this part faced was passed. The material certificate was valid, the dimensions were in tolerance, and the load was within qualification. The property that failed — surface condition after machining — was not on the inspection list, and no dimensional measurement would ever have found it.
      why:
        loud: "The 2 headline findings are a surface 44% harder than the bulk and a crack that started at the machined surface. Neither settles it alone: elevated surface hardness also fits a bulk-brittle material, and a surface origin also fits fatigue and handling damage."
        quiet: Together they leave one answer, and the quiet readings close off the alternatives. No permanent deformation rules out plain overload, a single steady application rules out fatigue, and in-tolerance dimensions rule out geometry as the stress concentrator.
      chain:
        - Machining heat transforms and hardens a thin surface layer
        - The brittle skin cracks at a load the bulk material can carry
        - The crack runs into sound metal and the part fails below its qualified strength
      take: A part is only as good as the property you did not inspect.
    logic:
      - - Surface 44% harder than bulk
        - a brittle skin, from the material or from machining
      - - Crack started at the machined surface
        - not a bulk-material failure
      - - No permanent deformation
        - not simple overload past yield
      - - Single steady load application
        - not fatigue, despite the surface origin
  e15:
    id: e15
    level: L3
    title: The mockup that disagreed with the model
    role: You are deciding whether an inert trial found a real effect or an artifact of the mockup.
    hook: An inert assembly trial returns an arrival time 8% later than predicted. The radiograph shows the assembly in the geometry it was designed to have. The team is split on whether this is a finding or a defect in the test.
    riddle: A mockup can only answer the question its materials and instruments preserve. Did this one preserve it?
    salient:
      - arrival
      - radiograph
    zones:
      timing: Timing
      imaging: Radiography
      hardware: Recovered hardware
      materials: Materials certification
    readings:
      arrival:
        name: Measured vs predicted arrival time
        zone: timing
        observed: 8% late
        reference: within 2% of prediction
        purpose: The headline discrepancy. It says the model and the trial disagree, not which of them is wrong.
      radiograph:
        name: Radiographic geometry at time of arrival
        zone: imaging
        observed: as designed
        reference: as designed
        purpose: Whether the assembly was in the configuration the prediction assumed. Correct geometry removes assembly error as the explanation.
      recovered:
        name: Condition of recovered hardware
        zone: hardware
        observed: intact, no witness marks
        reference: intact
        purpose: What the hardware experienced. Marks and distortion reveal constraint or contact the design did not intend.
      matcert:
        name: Surrogate material certificate
        zone: materials
        observed: density and sound speed within 1% of the material it stands in for
        reference: within 2%
        purpose: How faithfully the stand-in material reproduces the property under test. A surrogate that differs here cannot answer questions that depend on it.
      fixturewitness:
        name: Fixture witness marks
        zone: hardware
        observed: clean
        reference: clean
        purpose: Whether the test fixture touched or constrained the assembly during the event, which would make the trial measure the fixture as much as the article.
      channelcross:
        name: Agreement between independent channels
        zone: timing
        observed: 3 channels agree within 1%
        reference: agree within 2%
        purpose: Whether separate instruments tell the same story. Agreement across independent channels makes an instrumentation fault very hard to sustain.
      scaling:
        name: Discrepancy against surrogate density ratio
        zone: materials
        observed: independent of the density ratio
        reference: scales with the ratio if the surrogate is responsible
        purpose: Whether the size of the disagreement tracks the property the surrogate fails to reproduce. A surrogate artifact scales with the substitution; a real effect does not.
      repeat:
        name: Second identical shot
        zone: timing
        observed: reproduces within 1%
        reference: reproduces
        purpose: Whether the discrepancy is stable. A reproducible disagreement is a property of the system, not of one trial.
    hypotheses:
      surrogate:
        label: The surrogate material does not behave like the real one
        choice: The stand-in material responds differently under load, so the trial is measuring the surrogate rather than the article the model describes.
        sig:
          arrival: late
          radiograph: asdesigned
          recovered: intact
          matcert: mismatch
          fixturewitness: clean
          channelcross: agree
          scaling: scales
          repeat: reproduces
      fixture:
        label: The test fixture constrained the assembly
        choice: The rig held or contacted the assembly during the event, so part of what was measured belongs to the fixture and not to the design.
        sig:
          arrival: late
          radiograph: distorted
          recovered: marked
          matcert: match
          fixturewitness: marked
          channelcross: agree
          scaling: independent
          repeat: reproduces
      instrument:
        label: A diagnostic channel is misreporting
        choice: The timing chain has a fault or a lost fiducial, so the discrepancy is in the record rather than in the event.
        sig:
          arrival: late
          radiograph: asdesigned
          recovered: intact
          matcert: match
          fixturewitness: clean
          channelcross: disagree
          scaling: independent
          repeat: varies
      realeffect:
        label: The model is missing a real effect
        choice: The assembly genuinely behaves this way and the prediction omits a mechanism that matters at this scale.
        sig:
          arrival: late
          radiograph: asdesigned
          recovered: intact
          matcert: match
          fixturewitness: clean
          channelcross: agree
          scaling: independent
          repeat: reproduces
      withintol:
        label: Nothing to explain — inside declared tolerance
        choice: The trial declared a tolerance wide enough to contain this difference, so no discrepancy requires explanation.
        sig:
          arrival: nominal
          radiograph: asdesigned
          recovered: intact
          matcert: match
          fixturewitness: clean
          channelcross: agree
          scaling: independent
          repeat: reproduces
    dismissal: withintol
    answer: realeffect
    reasons:
      surrogate: "The rival that has to be taken most seriously, because it is the standard reason a mockup result does not transfer, and it survives both headline findings. Two readings defeat it: the surrogate certificate matches the real material within 1% on the property in question, and the size of the discrepancy does not scale with the density ratio the way a substitution artifact would."
      fixture: It explains a late arrival, and fixtures do corrupt trials this way. The recovered hardware is intact, the fixture witness marks are clean, and the radiograph shows the designed geometry rather than a constrained one.
      instrument: Worth suspecting whenever a single number disagrees with a model. 3 independent channels agree within 1% and the second shot reproduces within 1%. An instrumentation fault that reproduces identically across independent channels and repeat trials is not an instrumentation fault.
      withintol: The trial was specified to 2% and returned 8%, reproducibly. Widening the tolerance after the fact to contain the result is how a test stops being able to fail.
    resolve:
      title: The trial is right and the model is incomplete
      paras:
        - Every way the mockup could have lied has been checked and cleared. The surrogate reproduces the property under test, the fixture did not touch the assembly, the geometry was as designed, and three independent channels agree across two shots. What remains is that the assembly really does behave this way and the prediction is missing a mechanism.
        - This is the outcome a mockup programme exists to make possible, and it is only available because the trial was built so that its own failure modes could be ruled out. Without the material certificate, the witness marks, the channel redundancy, and the repeat shot, an 8% discrepancy is an argument. With them it is a finding.
      why:
        loud: "A reproducible 8% late arrival with the designed geometry confirmed leaves 3 candidates: a surrogate artifact, an instrumentation fault, or a real effect. Correct geometry is what makes the discrepancy interesting rather than trivial, but it cannot say which of the three is responsible."
        quiet: Two quiet readings from different departments settle it. The materials certificate, backed by the discrepancy not scaling with the density ratio, eliminates the surrogate. Independent channel agreement, backed by the repeat shot, eliminates the instruments. Ruling out the mockup is what licenses believing it.
      chain:
        - A mechanism absent from the model affects the assembly
        - The trial measures it and every mockup artifact is independently excluded
        - The 8% discrepancy becomes evidence that the model needs revision
      take: A mockup earns the right to contradict a model only after its own artifacts have been ruled out.
    logic:
      - - 8% late, geometry as designed, reproducible
        - "three candidates: surrogate, instruments, real effect"
      - - Surrogate certificate matches within 1%
        - the stand-in reproduces the property under test
      - - Discrepancy does not scale with density ratio
        - not a substitution artifact
      - - Three channels agree, second shot reproduces
        - not an instrumentation fault
  x18:
    id: x18
    level: L4
    compound:
      - lotvariation
      - inversion
    title: Two entries in one budget
    role: You are assigning an implosion trial's anomalies to the right uncertainty terms.
    hook: "A trial has come back with two problems: the initiation channels arrived over a wider spread than budgeted, and the inferred peak density is below prediction. The budget has to name causes, and no single entry accounts for both."
    riddle: Select the two causes that together account for every reading. No single cause does.
    salient:
      - arrivalspread
      - densityinferred
    zones:
      init: Initiation
      materials: Materials
      assembly: Assembly
      elec: Electronics
      analysis: Analysis
    readings:
      arrivalspread:
        name: Channel arrival spread
        zone: init
        observed: 19 ns
        reference: 8 ns budgeted
        purpose: How closely the initiation channels agreed. A wide spread has several possible sources in hardware and in the explosive itself.
      lotcert:
        name: Explosive lot wave-speed certificates
        zone: materials
        observed: spread of 2.4% across the lots used
        reference: within 0.5% for a single qualified lot
        purpose: Whether the segments came from material with consistent detonation velocity. Lot-to-lot spread converts directly into arrival-time spread.
      placementmetrology:
        name: Segment placement metrology
        zone: assembly
        observed: all segments within tolerance
        reference: within tolerance
        purpose: Where the segments actually sat. Placement error changes path lengths and therefore arrival times.
      triggerselftest:
        name: Shared trigger self-test
        zone: elec
        observed: pass
        reference: pass
        purpose: Whether the common trigger fired when commanded. A trigger fault moves channels without any material or geometric cause.
      densityinferred:
        name: Inferred peak density
        zone: analysis
        observed: 13% below prediction
        reference: within 5% of prediction
        purpose: The end product of the analysis chain. It depends on the radiographic data and on the model used to convert that data into density.
      radiographraw:
        name: Raw radiographic transmission
        zone: analysis
        observed: consistent with previous trials
        reference: consistent
        purpose: The measurement before interpretation. Normal raw data with an abnormal inferred result points at the conversion rather than the observation.
      attenuationstd:
        name: Attenuation calibration against a step wedge
        zone: analysis
        observed: fails by 11% at high density
        reference: within 3% across the range
        purpose: Whether the model that turns transmission into density is correct where it is being used. A calibration that fails at high density biases exactly the result being reported.
    hypotheses:
      lotvariation:
        label: Explosive lot-to-lot wave-speed variation
        choice: Segments cut from lots with different detonation velocities arrive at different times, widening the spread without any assembly or electrical fault.
        sig:
          arrivalspread: wide
          lotcert: spread
          placementmetrology: intol
          triggerselftest: pass
          densityinferred: nominal
          radiographraw: consistent
          attenuationstd: pass
      placement:
        label: Segment placement tolerance
        choice: Segments sitting away from their intended positions change path lengths, so the wave arrives at different times around the assembly.
        sig:
          arrivalspread: wide
          lotcert: uniform
          placementmetrology: outtol
          triggerselftest: pass
          densityinferred: nominal
          radiographraw: consistent
          attenuationstd: pass
      triggercal:
        label: Shared trigger calibration error
        choice: The common trigger distributes its command with unequal delays, so the channels fire at different times for a purely electrical reason.
        sig:
          arrivalspread: wide
          lotcert: uniform
          placementmetrology: intol
          triggerselftest: fail
          densityinferred: nominal
          radiographraw: consistent
          attenuationstd: pass
      inversion:
        label: Attenuation-model error in the density inversion
        choice: The model converting radiographic transmission into density is wrong in the range being used, so the reported density is biased even though the data are sound.
        sig:
          arrivalspread: narrow
          lotcert: uniform
          placementmetrology: intol
          triggerselftest: pass
          densityinferred: low
          radiographraw: consistent
          attenuationstd: fail
      withinbudget:
        label: Nothing to explain — inside the declared budget
        choice: Both figures fall inside the uncertainty already allocated, so the trial requires no new entries.
        sig:
          arrivalspread: narrow
          lotcert: uniform
          placementmetrology: intol
          triggerselftest: pass
          densityinferred: nominal
          radiographraw: consistent
          attenuationstd: pass
    dismissal: withinbudget
    answer: lotvariation
    reasons:
      placement: It would explain the wide arrival spread. Placement metrology puts every segment inside tolerance, and it says nothing at all about the density result or the failed attenuation calibration.
      triggercal: A wide spread with a common trigger always deserves this check. The trigger self-test passes, and like placement it leaves the density anomaly and the calibration failure entirely unexplained.
      withinbudget: The spread is 19 ns against 8 budgeted and the density is 13% low against a 5% allowance. Both figures are outside the budget, and the step-wedge calibration fails by 11%. There are two things here to account for.
    resolve:
      title: One hardware term and one analysis term
      paras:
        - Two independent causes are at work, in different parts of the evidence chain. Segments came from explosive lots whose wave speeds differ by 2.4%, which widens the arrival spread all on its own. Separately, the model converting radiographic transmission into density fails its step-wedge calibration by 11% at high density, which biases the inferred density low even though the raw radiographic data are perfectly normal.
        - Neither cause explains the other, and neither can be dropped. Attributing everything to the explosive lots leaves a density result that is wrong for a reason nobody has named. Attributing everything to the inversion leaves a 19 ns spread with no source. The budget needs both entries, and they belong in different columns — one is material variability, the other is model error.
        - This is why an uncertainty budget spans the whole chain rather than the hardware alone. A model that converts a measurement into a number is part of the instrument, and it can fail while every physical component performs correctly.
      why:
        loud: "The two headline anomalies belong to different subsystems and no single cause predicts both. That is the finding: the wide spread is a hardware-side observation and the low density is an analysis-side observation, and forcing one explanation onto both means getting one of them wrong."
        quiet: The quiet readings are what make the split defensible. In-tolerance placement and a passing trigger self-test remove the other hardware explanations for the spread, leaving the lot certificates. Normal raw radiographic transmission removes the measurement as a source of the density error, leaving the calibration that fails at exactly the density being reported.
      chain:
        - Mixed explosive lots and a mis-calibrated inversion act independently
        - Arrival spread widens from material variability while density is biased by model error
        - The budget records two entries in two different columns, neither hiding the other
      take: When two anomalies sit in different subsystems, the honest budget has two entries — a single cause forced onto both will misattribute one of them.
    logic:
      - - 19 ns spread and 13% low density
        - no single cause predicts both
      - - Placement in tolerance, trigger self-test passes
        - hardware spread narrows to lot variation
      - - Lot certificates spread 2.4%
        - "first cause confirmed: material variability"
      - - Raw transmission normal, step wedge fails 11%
        - "second cause confirmed: model error, not measurement error"
  p29:
    id: p29
    level: L4
    compound:
      - realasym
      - channelfail
    title: The channel that disagreed, and the reason it mattered
    role: You are deciding what an integrated trial's diagnostics actually established.
    hook: Four channels watched the trial. Three tell one story and the fourth tells another. Someone has proposed discarding the fourth as a bad channel and reporting the other three. Before that happens, the full panel is on the table.
    riddle: Select the two causes that together account for every reading. No single cause does.
    salient:
      - crosschan
      - gaincheck
    zones:
      channels: Recording channels
      cal: Calibration
      field: Field of view
      hardware: Recovered hardware
    readings:
      crosschan:
        name: Agreement among the three healthy channels
        zone: channels
        observed: they disagree with each other by 9%
        reference: agree within 3%
        purpose: Whether the majority actually forms a consistent account. Three channels outvoting a fourth means nothing if the three do not agree among themselves.
      oddchan:
        name: Fourth channel against the others
        zone: channels
        observed: disagrees
        reference: agrees within 3%
        purpose: The finding that started the argument. A disagreeing channel may be faulty or may be the only one positioned to see something real.
      gaincheck:
        name: Pulser gain check, fourth channel
        zone: cal
        observed: 38% below reference
        reference: within 5% of reference
        purpose: Instrument response to a known injected signal. It tests the channel independently of the event and is the cleanest evidence a channel is not trustworthy.
      baseline:
        name: Pre-shot baseline, fourth channel
        zone: cal
        observed: elevated and drifting
        reference: flat
        purpose: What the channel recorded before anything happened. A disturbed baseline is a property of the instrument, not of the event.
      fiducial:
        name: Timing fiducial on the fourth channel
        zone: channels
        observed: present and clean
        reference: present
        purpose: Whether the channel's record can be placed in time. A lost fiducial misaligns a record without corrupting its amplitude.
      fovmap:
        name: Field-of-view coverage map
        zone: field
        observed: covers the region in question
        reference: covers
        purpose: Whether a diagnostic could see the region at all. A channel that cannot see something is not evidence about it either way.
      witness:
        name: Recovered witness plate
        zone: hardware
        observed: clearly asymmetric
        reference: symmetric
        purpose: A physical record independent of every electronic channel. It cannot be argued with on instrumentation grounds.
      repeat:
        name: Second shot
        zone: channels
        observed: reproduces the same pattern
        reference: reproduces
        purpose: Whether the picture is stable across trials. Reproduction separates a property of the system from an accident of one shot.
    hypotheses:
      channelfail:
        label: The fourth recording channel lost gain
        choice: That channel's response has fallen, so its amplitudes are wrong and its disagreement with the others is an instrument fault rather than an observation.
        sig:
          crosschan: agree
          oddchan: disagree
          gaincheck: low
          baseline: elevated
          fiducial: present
          fovmap: covers
          witness: symmetric
          repeat: reproduces
      realasym:
        label: A genuine asymmetry the channels sample unequally
        choice: The event really was asymmetric, so channels looking at different parts of it correctly report different things and no amount of averaging will reconcile them.
        sig:
          crosschan: disagree
          oddchan: disagree
          gaincheck: nominal
          baseline: flat
          fiducial: present
          fovmap: covers
          witness: asymmetric
          repeat: reproduces
      synclost:
        label: The fourth channel lost its timing fiducial
        choice: Without a fiducial that record cannot be aligned with the others, so it appears to disagree purely because it is placed wrongly in time.
        sig:
          crosschan: agree
          oddchan: disagree
          gaincheck: nominal
          baseline: flat
          fiducial: missing
          fovmap: covers
          witness: symmetric
          repeat: reproduces
      fieldofview:
        label: The fourth channel could not see the region
        choice: Its field of view excluded the area in question, so its record is not evidence about that region at all and the apparent conflict is not a conflict.
        sig:
          crosschan: agree
          oddchan: disagree
          gaincheck: nominal
          baseline: flat
          fiducial: present
          fovmap: excludes
          witness: symmetric
          repeat: reproduces
      agreement:
        label: Nothing to explain — they agree within uncertainty
        choice: Once each channel's uncertainty is allowed for, all four records are compatible and there is no disagreement to account for.
        sig:
          crosschan: agree
          oddchan: agree
          gaincheck: nominal
          baseline: flat
          fiducial: present
          fovmap: covers
          witness: symmetric
          repeat: reproduces
    dismissal: agreement
    answer: realasym
    reasons:
      synclost: A lost fiducial is a real way for a channel to disagree without being wrong about amplitude. This one's fiducial is present and clean, and a timing misalignment would not explain a gain check 38% low or a drifting baseline.
      fieldofview: A channel that cannot see a region should not be treated as evidence about it, so the check is the right one to make. The coverage map shows this channel covering the region in question, and like the fiducial explanation it accounts for nothing on the calibration side.
      agreement: The 3 so-called healthy channels disagree with each other by 9% against a 3% specification, and the recovered witness plate is clearly asymmetric. There is a disagreement, and it is not an artifact of uncertainty.
    resolve:
      title: A real asymmetry and a broken channel, at the same time
      paras:
        - Two things are true at once. The event genuinely was asymmetric — the 3 surviving channels disagree with each other by 9%, and the recovered witness plate, which owes nothing to any electronic channel, is clearly asymmetric. And separately, the fourth channel really has lost gain, with a pulser check 38% low and a drifting pre-shot baseline.
        - "The proposal on the table was to discard the fourth channel and report the other three. That would have been half right and wholly misleading: the channel is faulty, but the disagreement it was blamed for is real and survives its removal. Discarding it would have produced three mutually inconsistent records reported as a consistent result."
        - This is what integrated diagnostic coverage is for. A single faulty channel is recoverable. A faulty channel that happens to sit where a real effect is visible is only recoverable if there is independent evidence — here, the mutual disagreement among the others and a piece of recovered hardware.
      why:
        loud: The two headline findings pull in opposite directions and cannot both be explained by one cause. Mutual disagreement among the healthy channels is evidence of a real asymmetry; a gain check 38% low is evidence of a broken instrument. Either one alone tells a clean story, and the clean story is wrong.
        quiet: The quiet readings assign each finding to its own cause. A present fiducial and a covering field of view remove the other explanations for the fourth channel's behaviour, leaving a genuine gain failure. The asymmetric witness plate and the reproducing second shot establish the asymmetry independently of every channel, including the broken one.
      chain:
        - A real asymmetry and an independent channel gain failure occur in the same trial
        - The broken channel is blamed for a disagreement that is genuinely present
        - Discarding it would report three inconsistent records as a consistent result
      take: A channel can be faulty and still be pointing at something real. Prove the fault and the finding separately.
    logic:
      - - Healthy channels disagree 9%, fourth channel gain 38% low
        - no single cause predicts both
      - - Fiducial present, field of view covers the region
        - the fourth channel's problem is gain, not alignment or coverage
      - - Witness plate clearly asymmetric
        - the asymmetry is real, independent of every channel
      - - Second shot reproduces the pattern
        - a property of the system, not an accident of one trial

# Between-mission funding vignettes.
specialRequests:
  3:
    personId: hinton
    cost: 2
    title: Criticality safety interlocks for the chemistry wing
    division: CM
    paragraphs:
      - Joan Hinton, who works on critical assembly diagnostics, has flagged that the chemistry wing where plutonium solutions are handled still relies on a single administrative limit for mass and geometry. One mislabeled beaker or an extra transfer could bring fissile material close to a critical configuration. A $2 interlock — a second independent mass accounting check plus a neutron counter at the doorway — would give a layered safety case instead of trusting 1 person’s arithmetic.
      - This is not just a science question. The technicians are mostly young women on 12-hour shifts, sharing thin-walled hutments, and a criticality accident would be a health and community catastrophe before it ever affected the weapon program. Hinton argues that spending now preserves both accurate chemistry yields and the lives of the people who live two blocks from the lab. As director you can approve the $2 from the $20 reserve, or defer and accept 12–24h of added risk while the lab operates on a single barrier.
  6:
    personId: hornig
    cost: 3
    title: Ventilation upgrade for plutonium metallurgy
    division: CM
    paragraphs:
      - "Donald Hornig’s metallurgy group is pressing plutonium ingots in a lab where the ventilation hoods were sized for uranium. Plutonium dust is alpha-active: a few micrograms lodged in a lung delivers a lifetime dose, and the hoods now run at only 60% of the face velocity needed. Hornig needs $3 for a filtered exhaust upgrade and daily nose-count swipes. The science is clear — without it, solubility measurements will drift as surface oxide builds, and the yield verification you need for Mission 5 will be unreliable."
      - "The human cost is visible around town: families share laundry where dust can travel home, the school is 400 meters downwind, and the infirmary has only 12 beds for a mesa that will soon hold 6,000 people. Hornig frames the request as both measurement fidelity and public health. Funding it keeps the phase-diagram work honest; deferring it saves $3 now but adds 12–24h while the group reworks contaminated samples and the town absorbs avoidable exposure."
  9:
    personId: mckibbin
    cost: 2
    title: Housing Office support for arriving families
    division: E
    paragraphs:
      - Dorothy McKibbin, who runs the gate at 109 East Palace in Santa Fe and assigns every hutment on the Hill, reports that 40 families arriving for the implosion push are bunked in unheated Pacific huts with a single pot-belly stove. Children are studying by coal light, and the community school — staffed by scientists’ wives — has doubled to 150 pupils without extra benches or paper. A $2 allocation would finish Sundt duplex partitions, add a coal delivery, and buy school supplies.
      - "From a program view this looks like “town” rather than “physics,” but McKibbin notes the link: engineers who spent the night shoveling ash or nursing a sick child make timing errors on lens molds the next day. Fuller Lodge evening lectures and Saturday dances at the theater are not luxuries; they are the retention system for a town that cannot be resupplied quickly at 7,300 feet. Approving keeps the technical workforce functional; deferring risks 12–24h of absenteeism and rework."
  12:
    personId: bradbury
    cost: 3
    title: Theater and PX film for morale and timing calibration
    division: X
    paragraphs:
      - Norris Bradbury, who will soon oversee assembly, requests $3 to keep Theater No. 2 running 3 nights a week and to buy high-speed film for the P-Division imaging group that shares the same projection budget. The cultural argument and the science argument coincide. The theater is the only building where the entire mesa can hear the same colloquium — Bethe on implosion was given there in February — and where mixed crews discuss misalignments without rank. Without it, X-Division lens crews and E-Division ordnance drift into separate vocabularies.
      - For health, the same film stock is also used to radiograph inert lens assemblies; without a steady supply, crews will test with fewer views and miss asymmetry that later shows up as jetting. At 2,200 m, with censored mail and no road out without a pass, morale directly governs precision. Funding both uses of the film sustains the shared language you built in Mission 1; deferring saves $3 but adds 12–24h as teams re-establish common timing baselines.
  15:
    personId: kitty
    cost: 2
    title: Post-Trinity health follow-up and community support
    division: CM
    paragraphs:
      - "Kitty Oppenheimer, in her role coordinating housing and infirmary liaison, asks for $2 to expand the infirmary’s post-shot capacity: iodine tablets, additional nose counts, and a visiting nurse for the canyon trailers where dust settled after the test. The immediate fission yield may be known, but the delayed health picture is not. Fallout is not yet understood by the community, and families are already asking whether the pond water is safe."
      - Even if the technical chain is complete, the town’s trust is part of the evidence chain. A complete dossier must include what was promised about return to the mesa, how samples will be tracked, and what families are told about life downwind. This is the cultural and ethical counterpart to the technical freeze you will impose in Mission 15. Approving acknowledges that responsibility persists after a device is complete; deferring saves $2 now but incurs 12–24h while rumors and incomplete records compound.

# What is inside each room.
interiors:
  T:
    caption: A number without its uncertainty is an opinion with a decimal point.
    standLine: Two computing groups have returned estimates that disagree by more than either one’s stated error. One of the two error bars is wrong.
    station:
      kind: panel
      title: Computing room
      rows:
        - label: Group A estimate
          value: 1.00 ×
          status: normal
        - label: Group B estimate
          value: 1.31 ×
          status: high
        - label: Stated spread
          value: ± 4 %
          status: alarm
        - label: Method
          value: hand computation, checked twice
          status: normal
  P:
    caption: Counting is a random process. A single run is a sample, not a result.
    standLine: The counter is running against a background that has not been measured today. Everything downstream depends on that subtraction.
    station:
      kind: vitals
      animated: true
      wave: ecg
      rate: 7
      title: Counting bench
      rows:
        - label: Counts
          value: 412
          unit: per minute
          status: normal
        - label: Background
          value: not run
          unit: today
          status: alarm
        - label: Dead time
          value: 3.1
          unit: "% of window"
          status: high
  CM:
    caption: A material is what the analysis says it is, not what the label says.
    standLine: Purity is inside tolerance and the swipe survey outside the glovebox is not. Both belong to the same batch.
    station:
      kind: panel
      title: Metallurgy bay
      rows:
        - label: Purity, assayed
          value: 99.4 %
          status: normal
        - label: Swipe, bench edge
          value: above limit
          status: alarm
        - label: Glovebox pressure
          value: "-12 Pa"
          status: normal
        - label: Batch traceability
          value: complete
          status: normal
  E:
    caption: An interface is where two groups each assumed the other had it.
    standLine: Channel timing across the firing set is inside specification on average and outside it on two channels. Averages do not fire anything.
    station:
      kind: vitals
      animated: true
      wave: sine
      rate: 4
      title: Timing rig
      status: high
      rows:
        - label: Spread, all channels
          value: 0.9
          unit: µs
          status: normal
        - label: Worst channel
          value: 4.2
          unit: µs
          status: alarm
        - label: Qualification shots
          value: 6
          unit: of 20
          status: low
  X:
    caption: Integration is where four groups’ evidence has to survive being put together.
    standLine: Every group reports success against its own criterion. The question on this bench is whether the four criteria are the same one.
    station:
      kind: panel
      title: Integration board
      rows:
        - label: Theory
          value: estimate delivered
          status: normal
        - label: Diagnostics
          value: background pending
          status: high
        - label: Materials
          value: batch cleared
          status: normal
        - label: Engineering
          value: two channels out
          status: alarm
        - label: Agreed criterion
          value: none written
          status: alarm

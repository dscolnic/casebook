  - group: CM
    task: Estimate the fraction extracted in one stage.
    title: Solvent extraction
    setup: A solute has distribution ratio D=4 between organic and aqueous phases, with equal phase volumes.
    scene: Solvent extraction moves a dissolved species between two liquids that do not mix, such as an aqueous phase and an organic phase. Chemical conditions determine which phase the desired species prefers. Los Alamos uses repeated extraction stages to purify materials, so chemists must balance recovery against contamination carried along with the product.
    takeaway: Several modest stages can outperform one imperfect separation.
    format: BALLPARK
    why: 4/(4+1)=0.8.
    estimate:
      prompt: A solute has a distribution ratio of 4 between the organic and aqueous phases, and the 2 phase volumes are equal. Estimate the percentage extracted in one stage.
      question: Choose the distribution ratio and the phase-volume ratio.
      labels:
        - 4 distribution ratio
        - 1 equal phase-volume ratio
        - 40 distribution ratio
        - 0.1 phase-volume ratio
      values: [4, 1, 40, 0.1]
      slots: 2
      template: fraction extracted ≈ {0} ÷ ({0}+{1}) × 100
      formula: a/(a+b)*100
      correct: [0, 1]
      target: 80
      tolerance: 3
      units: "%"
      solution: 4 ÷ (4+1) × 100 ≈ 80%.
      explanation: 1 stage at D = 4 leaves a fifth of the solute behind. A second identical stage would leave a fifth of that again, which is why extraction is run as a series of stages rather than pushed to completion in one.
      givens:
        - Fraction in organic phase = D/(D+1) for equal volumes
      relationship: Fraction extracted = D ÷ (D + phase-volume ratio), as a percentage.
    answerText: About 80%.

      C: 55
      A: 10
    answerText: "Recommended: 35 to B, 55 to C, 10 to A."
  - group: CM
    task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
    title: Chain of custody and records
    setup: Match each record problem to the corrective action.
    scene: Chain of custody records who handled a sample or component, when it moved, and whether its identity remained secure. Technical records connect that identity to processing, inspection, and test results. Los Alamos needs this traceability because a perfect measurement is useless if no one can prove which part or batch it describes.
    takeaway: A technically good result without provenance may be unusable.
    format: PROTOCOL
    why: Traceability requires contemporaneous identity, configuration, and approval records.
    columns:
      - The gap in the record
      - How you close it
    scenarios:
      - Sample label detached
      - Result file lacks calibration version
      - Transfer occurred without signature
      - Process sheet was revised after the run
    choices:
      - Quarantine the sample and reconstruct its identity from independent records before using any result linked to it.
      - Bind the number to the instrument settings and the software build that produced it, so another analyst can obtain it again years later.
      - Document and investigate the custody gap because an unsigned transfer leaves uncertainty about who controlled the material.
      - Preserve both process-sheet versions and explain the later revision so the record does not falsely imply the newer procedure was used during the run.
    mapping: [0, 1, 2, 3]
    answerText: Sample label detached -> Quarantine the sample and reconstruct its identity from independent records before using any result linked to it; Result file lacks calibration version -> Bind the number to the instrument settings and the software build that produced it, so another analyst can obtain it again years later; Transfer occurred without signature -> Document and investigate the custody gap because an unsigned transfer leaves uncertainty about who controlled the material; Process sheet was revised after the run -> Preserve both process-sheet versions and explain the later revision so the record does not falsely imply the newer procedure was used during the run

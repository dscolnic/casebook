        call: Verify yield and purity
        setup: You are reconciling a separation batch whose numbers do not close.
  - title: Track neutrons through matter
    objective: Connect moderation, neutron detection, and the historical reason plutonium forced a different design path.
    briefing: Neutrons change energy, direction, and detectability as they move through matter. Use that foundation to understand why the plutonium program could not simply copy the first architecture.
    stake: April 1944, and the first reactor plutonium has arrived on the mesa. It is not the material the gun design was built around, and Bethe has spent a week with the counting data saying so quietly. His numbers have been on Oppenheimer's desk since Tuesday and nothing has been decided. Today you follow what happens to neutrons as they move through matter. You work out how to detect something with no charge. And you face what this material means for the second design path. The gun programme has a year of work in it, and 11 people who do not know yet.
    takeaway: Neutron behavior links microscopic interactions to system-level design choices.
    stops:
      - group: T
        call: Follow neutron moderation
        task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
        title: Neutron energy and moderation
        setup: Match each physical observation to the most relevant interaction idea.
        scene: A neutron leaving a fission event carries a great deal of energy, and what happens next depends entirely on what it hits. Confusing the possibilities is how a shielding calculation goes quietly wrong.
        assumes:
          - a light ball loses more energy hitting something its own size
        takeaway: Energy management and neutron removal are not interchangeable.
        format: PROTOCOL
        why: Slowing, redirecting and absorbing are three different processes with three different consequences. In elastic scattering the neutron transfers some energy and continues as a neutron — it is still in the system. In absorption it is captured into a compound nucleus and is gone. Scattering off a heavy nucleus changes direction and gives up very little energy, because a heavy target barely recoils. Scattering off light nuclei is what slows neutrons efficiently, because a light nucleus can take a large share of the energy in one collision.
        rebuttals:
          - A neutron that loses energy and remains a neutron has scattered elastically. It is still available to do something later.
          - A neutron that disappears into a compound nucleus has been absorbed. It is removed from the population entirely, which is a different consequence.
          - "A direction change with little energy loss is scattering off a heavy nucleus: the target hardly recoils, so it hardly takes any energy."
          - Efficient slowing through repeated collisions needs light nuclei, because a light nucleus can take a large share of the energy each time.
        columns:
          - What happens to the neutron
          - Which process that is
        scenarios:
          - Neutron loses energy but remains a neutron
          - Neutron disappears and a compound nucleus forms
          - Direction changes with little energy loss
          - A material slows neutrons efficiently through repeated collisions
        choices:
          - "Elastic scattering. A billiard-ball collision: the target recoils with whatever share of the motion it can take, and the particle carries on with the rest."
          - Absorption. The target keeps the particle and becomes a heavier, excited species, so the travelling population drops by one.
          - Scattering off a heavy nucleus. The target barely recoils, so it takes almost nothing away and the path bends instead of slowing.
          - Moderation by light nuclei. A target of nearly the same mass can carry away a large fraction in a single hit, so a few dozen encounters reach thermal speeds.
        mapping: [0, 1, 2, 3]
        answerText: "Neutron loses energy but remains a neutron -> Elastic scattering. A billiard-ball collision: the target recoils with whatever share of the motion it can take, and the particle carries on with the rest; Neutron disappears and a compound nucleus forms -> Absorption. The target keeps the particle and becomes a heavier, excited species, so the travelling population drops by one; Direction changes with little energy loss -> Scattering off a heavy nucleus. The target barely recoils, so it takes almost nothing away and the path bends instead of slowing; A material slows neutrons efficiently through repeated collisions -> Moderation by light nuclei. A target of nearly the same mass can carry away a large fraction in a single hit, so a few dozen encounters reach thermal speeds"

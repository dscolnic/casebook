    format: BALLPARK
    why: The simple result establishes a scale; inert drop tests were necessary because real aerodynamic behavior, winds, and aircraft motion matter.
    estimate:
      prompt: An inert test shape is released from 8,000 m, with g = 9.8 m/s². Ignoring drag, the fall time is t ≈ √(2h/g). Estimate it.
      question: Choose the factor in the free-fall equation, the altitude, and g.
      labels:
        - "2"
        - 8,000 m
        - 9.8 m/s²
        - 800 m
      values: [2, 8000, 9.8, 800]
      slots: 3
      template: t ≈ √(({0}×{1}) ÷ {2})
      formula: Math.sqrt(a*b/c)
      correct: [0, 1, 2]
      target: 40.4
      tolerance: 2.5
      units: s
      solution: √(2×8,000/9.8) ≈ 40 s.
      explanation: A fall from several kilometers takes tens of seconds in vacuum. Real trajectories require drag and full flight testing.
      givens:
        - Release altitude h = 8,000 m
        - g = 9.8 m/s^2
        - Use t approximately sqrt(2h/g)
      relationship: For a drop from rest, time = the square root of (2 × height ÷ g).

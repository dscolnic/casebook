    mapping: [0, 1, 2, 3]
    answerText: A segment arrives without a readable lot identifier. -> Quarantine and restore traceability; Two interface drawings specify different reference surfaces. -> Resolve the configuration conflict before assembly; A fitted assembly shows a gap outside the approved inspection limit. -> Stop and disposition the nonconformance; A technician proposes rotating a segment to make it fit without an approved change. -> Reject the unapproved field modification

  - title: Measure interactions, not impressions
    objective: Learn how cross sections, counting statistics, and analytical yield turn observations into quantitative evidence.
    briefing: The laboratory now needs probabilities rather than anecdotes. Estimate how often an interaction occurs, determine whether a count difference is statistically meaningful, and verify that the chemistry did not lose an unknown fraction of the sample.
    stake: October 1943. Two groups have a difference in their counts that everybody believes in. Wu has run the numbers and the statistics say it is nothing, and the head of the Theoretical Division, Hans Bethe, has asked for both to be recalculated by somebody who did not do them the first time. The programme is about to allocate material on the strength of it. Today you work with the number that says how likely an interaction is. You decide when a difference in counts is real. And you check that a chemical yield is what it claims. A yield figure means nothing without a purity figure beside it — which is the question Wu asks first and the one the reporting group did not answer.
    takeaway: Reliable nuclear evidence combines interaction probability, statistical uncertainty, and a measured recovery or efficiency.
    stops:
      - group: T
        task: Estimate the macroscopic cross section, the mean free path, and the fraction of an uncollided beam left after one mean free path.
        title: Reaction cross sections
        scene: The Theoretical Division needs a reaction rate and has a cross section written in barns. Nearly every number this laboratory argues about is built out of the multiplication that follows.
        assumes:
          - a cross section is expressed as an area
        takeaway: Number density turns a microscopic cross section into an interaction probability per length, which sets both mean free path and exponential attenuation.
        format: BALLPARK
        answerText: Σ ≈ 0.01 cm^-1, the mean free path is about 100 cm, and after 1 mean free path I/I₀ = e^-1 ≈ 0.37.
        why: "A microscopic cross section is an interaction probability written as an area. Multiply it by the number of targets per volume and you get the macroscopic cross section Σ, an inverse length. Its inverse is the mean free path. The same Σ also controls attenuation: I/I₀ = e⁻Σx. After 1 mean free path, x = 1/Σ, so the exponent is minus 1 and about 37 percent of an uncollided beam remains. One parameter connects all three ideas."
        call: Interpret a cross section
        setup: A solid has number density n = 10^22 cm^-3, and the cross section is 1 barn = 10^-24 cm^2.
        estimate:
          prompt: A solid has number density 10^22 cm^-3 and a neutron cross section of 1 barn = 10^-24 cm^2. Estimate Σ, the mean free path, and the uncollided fraction left after one mean free path.
          question: Choose the number density and cross section, then use the resulting Σ in both 1/Σ and e^-Σx.
          labels:
            - "1"
            - 10²² cm⁻³
            - 10⁻²⁴ cm²
            - 10⁶ cm²
          values: [1, 1e+22, 1e-24, 1000000]
          slots: 3
          template: λ ≈ {0} ÷ ({1} × {2})
          formula: a/(b*c)
          correct: [0, 1, 2]
          target: 100
          tolerance: 15
          units: cm
          solution: Σ = 10²²×10⁻²⁴ = 10⁻² cm⁻¹. mfp = 1/Σ = 100 cm. At x = 100 cm, I/I₀ = e⁻¹ ≈ 0.37.
          explanation: Here Σ is 0.01 cm⁻¹, so the mean free path is about 100 cm. Setting x equal to that mean free path makes Σx = 1, leaving e⁻¹ ≈ 0.37 of the uncollided beam.
          givens:
            - Sigma = n sigma
            - Mean free path = 1/Sigma
          relationship: The macroscopic cross section is Σ = nσ, the number density times the microscopic cross section; mean free path = 1/Σ; attenuation is I/I₀ = e^-Σx.
      - group: P
        task: Estimate the fractional statistical uncertainty.
        title: Poisson counting statistics
        scene: A run has finished with 400 net counts and somebody wants to know how well the result is known. Beam time, detector time, material, and shift hours are all scarce here.
        assumes:
          - radioactive decays arrive at random
        takeaway: Four times as many counts are needed to cut statistical uncertainty in half.
        format: BALLPARK
        answerText: About 5%.
        why: "A repeat of the same run would not give exactly the same total. For Poisson counting, the typical fluctuation is about the square root of the count, so the fractional uncertainty is 1/√N. 400 counts gives 5 percent. To cut that in half, to 2.5 percent, you need 4 times as many counts. That slow square-root improvement is why counting statistics are a planning tool: longer runs buy precision, but they buy it expensively."
        call: Use Poisson statistics
        setup: A run records 400 net counts with negligible background uncertainty.
        estimate:
          prompt: A counting run records 400 net counts, and Poisson fluctuations are about √N. Estimate the fractional statistical uncertainty.
          question: Choose the numerator and the count total.
          labels:
            - "1"
            - 400 counts
            - 40 counts
            - 4,000 counts
          values: [1, 400, 40, 4000]
          slots: 2
          template: fractional uncertainty ≈ {0} ÷ √{1}
          formula: a/Math.sqrt(b)
          correct: [0, 1]
          target: 0.05
          tolerance: 0.006
          units: fraction
          solution: 1/√400 ≈ 0.05, or 5%.
          explanation: "400 counts gives 5%. The scaling is what matters for planning: uncertainty falls as 1/√N, so halving it to 2.5% takes 1,600 counts — 4 times the run. Precision bought by counting longer gets expensive fast, which is why detector efficiency and background suppression are worth as much as extra hours."
          givens:
            - Poisson fluctuation is about sqrt(N)
            - Fractional uncertainty is sqrt(N)/N
          relationship: Fractional uncertainty = 1 ÷ the square root of the number of counts.

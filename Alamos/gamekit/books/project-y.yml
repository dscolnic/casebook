    title: Gloveboxes and atmospheres
    setup: Match each risk to the appropriate feature.
    scene: A glovebox is a sealed workspace that lets operators handle hazardous material through fixed gloves while controlling air pressure and atmosphere. Negative pressure keeps contamination from escaping, while an inert gas can keep reactive material away from oxygen or moisture. Los Alamos needs both kinds of control for materials that are radioactive, chemically reactive, or scarce.
    takeaway: Confinement protects the room; atmosphere control protects the material.
    format: PROTOCOL
    why: A glovebox is a controlled system of confinement, atmosphere, transfer, and monitoring.
    columns:
      - What you want to do
      - How you do it
    scenarios:
      - Prevent airborne material from escaping
      - Prevent oxygen or moisture reaction
      - Move items without opening the main enclosure
      - Detect loss of confinement
    choices:
      - Negative pressure with filtered exhaust. Air leaks inward rather than outward, so even a breach moves contamination the safe way.
      - An inert atmosphere. Removes the reactant instead of containing the product.
      - A transfer lock or bag-out port. Holds the pressure boundary during transfer, which is when confinement is most often lost.
      - Pressure indicators and contamination monitors. Confinement can fail silently, so the boundary needs an instrument watching it.
    mapping: [0, 1, 2, 3]
    answerText: Prevent airborne material from escaping -> Negative pressure with filtered exhaust. Air leaks inward rather than outward, so even a breach moves contamination the safe way.; Prevent oxygen or moisture reaction -> An inert atmosphere. Removes the reactant instead of containing the product.; Move items without opening the main enclosure -> A transfer lock or bag-out port. Holds the pressure boundary during transfer, which is when confinement is most often lost.; Detect loss of confinement -> Pressure indicators and contamination monitors. Confinement can fail silently, so the boundary needs an instrument watching it.

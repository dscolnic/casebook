    task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
    title: Saturation and dynamic range
    setup: Match each pattern to the likely dynamic-range failure.
    scene: Every instrument has a finite dynamic range between signals too small to distinguish from noise and signals so large that the electronics saturate. Pulse pileup, clipping, and slow recovery can make a strong signal look deceptively simple. Bomb tests require overlapping high- and low-sensitivity channels so at least one instrument remains useful when the true signal differs from predictions.
    takeaway: A flat-topped signal is usually an instrument warning, not a new law of physics.
    format: PROTOCOL
    why: Saturation patterns identify which stage of the measurement chain has exceeded its range.
    columns:
      - What the trace shows
      - What it means
    scenarios:
      - All large pulses have identical height
      - Two close pulses merge into one broad pulse
      - Baseline remains displaced after a huge pulse
      - Digitized values alternate between maximum and normal
    choices:
      - Diagnose amplitude clipping when every large pulse reaches the same ceiling because the amplifier cannot represent a larger voltage.
      - Pileup. The two events landed inside the shaping time, so the electronics never separated them and reported their sum as a single larger event.
      - Overload recovery. A very large input drove the amplifier out of its linear range, and it needs many time constants to settle back to zero.
      - Diagnose analog-to-digital converter saturation when recorded values repeatedly hit the maximum digital code even though the analog signal continues to change.
    mapping: [0, 1, 2, 3]
    answerText: All large pulses have identical height -> Diagnose amplitude clipping when every large pulse reaches the same ceiling because the amplifier cannot represent a larger voltage; Two close pulses merge into one broad pulse -> Pileup. The two events landed inside the shaping time, so the electronics never separated them and reported their sum as a single larger event; Baseline remains displaced after a huge pulse -> Overload recovery. A very large input drove the amplifier out of its linear range, and it needs many time constants to settle back to zero; Digitized values alternate between maximum and normal -> Diagnose analog-to-digital converter saturation when recorded values repeatedly hit the maximum digital code even though the analog signal continues to change

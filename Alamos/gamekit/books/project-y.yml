  - group: CM
    task: Match each information need or situation to the best action, instrument, or control. Each option is used once.
    title: Chemical process safety
    setup: Match each hazard to a primary control.
    scene: Chemical processes can release heat, generate gas, build pressure, or combine incompatible materials. Small-scale compatibility tests, controlled addition, ventilation, and emergency shutdowns reveal and limit those hazards. Los Alamos must develop processes quickly without allowing schedule pressure to replace basic chemical safety.
    takeaway: A chemically successful reaction can still be an unsafe process.
    format: PROTOCOL
    why: Process safety controls the rate and consequence of energy and material release.
    columns:
      - The hazard
      - How you control it
    scenarios:
      - Unexpected heat release
      - Gas generation in a closed vessel
      - Unknown chemical compatibility
      - Loss of ventilation
    choices:
      - Monitor temperature, add reagent slowly, and keep a shutdown path ready, so the rate of energy release stays bounded.
      - Provide relief and a vent path, because otherwise the pressure has nowhere to go and the vessel becomes the failure point.
      - Test at small scale first, so anything unexpected is small enough to contain.
      - Stop work and restore confinement, because the control that was keeping vapour out of the room is gone.
    mapping: [0, 1, 2, 3]
    answerText: Unexpected heat release -> Monitor temperature, add reagent slowly, and keep a shutdown path ready, so the rate of energy release stays bounded.; Gas generation in a closed vessel -> Provide relief and a vent path, because otherwise the pressure has nowhere to go and the vessel becomes the failure point.; Unknown chemical compatibility -> Test at small scale first, so anything unexpected is small enough to contain.; Loss of ventilation -> Stop work and restore confinement, because the control that was keeping vapour out of the room is gone.

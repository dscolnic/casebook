  - group: E
    task: Estimate the worst-case stack.
    title: Tooling, jigs, and tolerance stack-up
    setup: Use an invented three-interface fixture; no weapon geometry is represented.
    scene: A jig holds a part in a repeatable position, and a tolerance is the allowed variation in a dimension. When several parts are assembled, their small variations can add into a tolerance stack-up that produces a large final misalignment. Fat Man engineers need tooling and dimensional analysis to make sure acceptable individual parts still form an acceptable complete assembly.
    takeaway: Precision comes from the full datum and tooling system.
    format: BALLPARK
    why: A fixture must control the assembly-level stack, not merely each individual component.
    estimate:
      prompt: A fixture stacks 3 independently machined interfaces, each held to ±0.15 mm, and worst-case absolute limits add. Estimate the worst-case stack.
      question: Choose the per-interface tolerance and the number of interfaces.
      labels:
        - 0.15 mm/interface
        - 3 interfaces
        - 0.015 mm/interface
        - 12 interfaces
      values: [0.15, 3, 0.015, 12]
      slots: 2
      template: worst-case stack ≈ {0} × {1}
      formula: a*b
      correct: [0, 1]
      target: 0.45
      tolerance: 0.035
      units: mm
      solution: 0.15 mm × 3 ≈ 0.45 mm.
      explanation: Worst-case tolerance stack-up adds aligned limits directly, unlike statistical root-sum-square combination.
      givens:
        - 3 independent worst-case placement limits are each +/-0.15 mm
        - Worst-case absolute limits add
        - Statistical root-sum-square may be smaller but requires justified independence
      relationship: Worst-case stack-up = tolerance per interface × the number of interfaces.
    answerText: Worst case = +/-0.45 mm.

    scene: Neutron multiplication depends on density, geometry, and leakage as well as the amount of fissile material. Implosion is valuable because compression puts nuclei closer together and makes it harder for neutrons to escape before causing another fission. The integration group must connect hydrodynamic measurements of compression to nuclear predictions of how rapidly the chain reaction will grow.
    takeaway: Hydrodynamics and neutron physics are coupled during the assembly.
    format: SEQUENCE
    why: Implosion changes both material density and the geometry that governs neutron leakage.
    cards:
      - Compression places the same fissile mass into a smaller volume.
      - Average density rises and characteristic leakage paths shorten relative to the amount of material.
      - A larger fraction of neutrons can induce additional fissions before escaping.
      - The effective multiplication condition can move from subcritical toward supercritical.
    order: [0, 1, 2, 3]
    answerText: 1 -> 2 -> 3 -> 4 (Compression places the same fissile mass into a smaller volume. -> Average density rises and characteristic leakage paths shorten relative to the amount of material. -> A larger fraction of neutrons can induce additional fissions before escaping. -> The effective multiplication condition can move from subcritical toward supercritical.)

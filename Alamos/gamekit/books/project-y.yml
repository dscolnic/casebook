  - group: E
    task: Estimate total reliability.
    title: Reliability of a series firing chain
    setup: A generic chain has 4 required subsystems, each with independent reliability 0.98 for 1 mission.
    scene: In a series firing chain, every required link must work for the final command to pass, so the reliability of the complete chain can be lower than the reliability of any one part. Adding more necessary components can reduce total success probability unless each is exceptionally reliable. Engineers use this logic to identify weak links and decide where redundancy or redesign matters most.
    takeaway: System reliability cannot be inferred from the best component.
    format: BALLPARK
    why: Every required element creates another opportunity for failure, even when each appears highly reliable.
    estimate:
      prompt: A firing chain needs 4 subsystems in series, each with independent reliability 0.98. Estimate the reliability of the whole chain.
      question: Choose the per-subsystem reliability and the subsystem count.
      labels:
        - 0.98 per subsystem
        - 4 required subsystems
        - 0.80 per subsystem
        - 40 required subsystems
      values: [0.98, 4, 0.8, 40]
      slots: 2
      template: series reliability ≈ ({0})^{1}
      formula: Math.pow(a,b)
      correct: [0, 1]
      target: 0.922
      tolerance: 0.02
      units: fraction
      solution: 0.98⁴ ≈ 0.92.
      explanation: Series-system reliability declines as more required components are added, even when each component is highly reliable.
      givens:
        - Four required subsystems
        - Each reliability = 0.98
        - Series reliability = product of component reliabilities
      relationship: A chain works only if every link does, so reliability = the per-link reliability raised to the number of links.
    answerText: R approximately 0.98^4 approximately 0.92.

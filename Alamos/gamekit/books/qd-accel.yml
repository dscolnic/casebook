# The Accelerating Universe — a Quick Discovery.
#
# The 3 x 3 shape from great_discoveries_first10_expanded.docx, game 02, mapped
# onto the engine's day model: a level is a day, a micro-game is a stop, and the
# campaign is nine stops in one sitting. Three levels, in order:
#
#   1  Build the distance tool     what a Type Ia is worth as a ruler
#   2  The supernovae are too faint the anomaly, and the first systematic test
#   3  Make the discovery           model comparison, and what may be claimed
#
# The science guardrail from the source book, kept: this is not "faint supernova
# equals dark energy" in one step. The result rested on standardisation, on
# calibration, on extinction tests and on model comparison, and "dark energy"
# names the effect rather than a particle anybody detected. The last stop is
# about exactly that distinction and is the reason the Publication Room exists.
#
# Format budget. Nine stops, so `formatMix`'s cap is three of any one format:
# CHOICE 3, BALLPARK 2, and one each of PROTOCOL, VERIFY, CONTROL, SEQUENCE.

theme:
  id: qd_accel
  title: The Accelerating Universe
  subtitle: Analyst · High-Redshift Supernova Team

groups:
  - id: PHOT
    code: PHOT
    name: Photometry
    color: '#c98a2b'
    desc: Light curves, magnitudes and the residual plot everything ends up on.
    defaultLeader: riess
    milestones: [Fit the light curve, Standardise it, Put it on the diagram, Ready to hand over]
  - id: SPEC
    code: SPEC
    name: Spectroscopy & Calibration
    color: '#3f7f8f'
    desc: What the lines say the redshift is, and whether dust is in the way.
    defaultLeader: filippenko
    milestones: [Take the arc, Measure the line, Check the colour, Ready to hand over]
  - id: COSMO
    code: COSMO
    name: Cosmology Console
    color: '#7a4fa3'
    desc: Expansion histories, laid over the same points and read off the leftovers.
    defaultLeader: schmidt
    milestones: [State the model, Fit the sample, Read the residuals, Ready to hand over]
  - id: PRESS
    code: PRESS
    name: Publication Room
    color: '#8a5a2b'
    desc: What the result is allowed to say out loud, in the order it is allowed to say it.
    defaultLeader: marek
    milestones: [Draft the claim, Separate the mechanism, Get it argued with, Ready to hand over]

roster:
  - id: schmidt
    name: Brian Schmidt
    role: Principal Investigator
    real: true
    division: COSMO
    bio: |
      Runs the programme, which mostly means deciding what it is allowed to
      claim and when. He keeps the cosmology sealed until the light curves and
      the calibration are frozen, on the argument that a team which knows the
      answer will find it.

      His position is that the sample is a ruler before it is a result, and that
      an argument about the ruler is cheaper now than after a paper is out. He
      has been on the wrong end of that once and does not intend to be again.
    quiz:
      - q: Why does Schmidt keep the fitted cosmology off the floor until the calibration is frozen?
        a: A team that already knows the answer will tend to find it
        wrong:
          - The console cannot fit a model until every light curve is complete
          - The other team would learn the result before it is published
          - Fitting early would use observing time that is booked for follow-up
  - id: riess
    name: Adam Riess
    role: Photometry Lead
    real: true
    division: PHOT
    bio: |
      Fits every light curve in the sample and puts the points on the board. He
      came to supernovae from asteroid searching, which is where he learned that
      most of what a survey finds is the survey looking at itself.

      He is the person who asks what a residual is measured against, every time,
      including when everybody in the room already knows. Nobody enjoys it and
      the plot has never once been mislabelled.
    quiz:
      - q: What does Riess insist on before a residual is allowed on the board?
        a: A statement of which model it is measured against
        wrong:
          - A second measurement of the same supernova on another night
          - A spectrum confirming the supernova is a Type Ia
          - The zero point from the same night the frames were taken
  - id: filippenko
    name: Alex Filippenko
    role: Spectroscopy Lead
    real: true
    division: SPEC
    bio: |
      Takes the spectra that turn a transient into a Type Ia with a redshift.
      He measures every line against a comparison arc taken in the same setup,
      because the wavelength scale moves when the building cools.

      His rule for the room is that a classification is a claim about a line you
      actually saw. A light curve that looks right is not a type, and he has
      sent three candidates back this month for exactly that.
    quiz:
      - q: Why does Filippenko take a comparison arc in the same setup as the science frames?
        a: The wavelength scale shifts when the grating or the building moves
        wrong:
          - An arc is the only way to measure how bright the supernova was
          - The arc removes the light of the host galaxy from the spectrum
          - Without an arc the spectrum cannot be corrected for dust
  - id: marek
    name: Halina Marek
    role: Publication Editor
    division: PRESS
    bio: |
      Reads every draft before it leaves the building and cuts the sentence
      where the measurement turns into the explanation. She trained as a
      historian of science and has a list of results that were right and were
      published as something else.

      She will let a paper say the expansion is speeding up. She will not let it
      say what is doing the speeding up, and the argument about that is the part
      of the week she looks forward to.
    quiz:
      - q: Which sentence does Marek cut out of a draft?
        a: The one where a measurement is restated as the thing causing it
        wrong:
          - The one that quotes a number without its uncertainty
          - The one that names the other team working on the same problem
          - The one that describes the telescope rather than the result
  - id: grant
    name: Sofia Grant
    role: Photometry Analyst
    division: PHOT
    bio: |
      Does the fitting that the board's points come out of, and keeps the record
      of which zero point every magnitude rests on. She is the reason the
      campaign can say when a number was measured and by whom.

      She thinks the interesting failure is never a wrong number but a number
      that is right on a night nobody wrote down. Her log is the only complete
      one on the floor.
    quiz:
      - q: What does Grant treat as the dangerous kind of error?
        a: A correct number whose calibration night was never recorded
        wrong:
          - A supernova fitted with the wrong light-curve template
          - A magnitude quoted to more decimal places than it deserves
          - A frame taken in poor seeing and used anyway
  - id: suntzeff
    name: Nicholas Suntzeff
    role: Calibration Scientist
    real: true
    division: SPEC
    bio: |
      Owns the zero points and the colour terms, which means he owns the part of
      the result nobody photographs. He measures standards on every clear night
      and refuses to carry a calibration across into the next one.

      His argument is that a systematic is only tested when it would have left a
      second signature and you went and looked for it. Dust is his favourite
      example because it is the easiest one to check and the easiest one to wave
      away.
    quiz:
      - q: What does Suntzeff say makes a systematic actually tested?
        a: Looking for a second signature it would have left
        wrong:
          - Showing that its size is smaller than the measurement uncertainty
          - Repeating the measurement with a different telescope
          - Finding that no other team has reported it

glossary:
  - name: Type Ia supernova
    def: The explosion of a white dwarf, bright enough to see across the universe and uniform enough, once corrected, to serve as a distance indicator.
  - name: Light curve
    def: How the brightness of a supernova rises and falls over the weeks after the explosion.
  - name: Decline rate
    def: How fast a supernova fades after its peak, usually quoted as the magnitudes it loses in the fifteen days afterwards.
  - name: Magnitude
    def: The astronomer's brightness scale, running backwards: a larger magnitude means a fainter object, and five magnitudes is a factor of a hundred in flux.
  - name: Spectrum
    def: Light spread out by wavelength, so that the individual lines an element absorbs or emits can be seen and measured.
  - name: Redshift
    def: The fraction by which a spectral line has moved to longer wavelengths, written z.
  - name: Residual
    def: What is left when a model prediction is subtracted from a measurement. It has no meaning until the model is named.
  - name: Extinction
    def: Dimming of light by dust between the source and the telescope, which reddens as well as dims.
  - name: Zero point
    def: The calibration that turns a raw instrument count into a magnitude anybody else can compare with.
  - name: Deceleration parameter
    def: One number saying whether the expansion is slowing down or speeding up. Written q with a nought after it, and negative when the expansion is speeding up.

missions:
  # ----------------------------------------------------------------- level 1
  - title: What a supernova is worth as a ruler
    objective: Establish why a Type Ia can be standardised, and how brightness and redshift become a distance test.
    briefing: Forty-two high-redshift events, no distances attached to any of them yet.
    stake: >-
      Tuesday morning, and the last follow-up frames came down at ten past four. Tomás
      Riess, the photometry lead, has forty-two events with light curves good enough to
      fit. None of them has a distance yet. Brian Schmidt, who runs the programme, will not
      let a fitted cosmology onto the floor until the ruler is agreed, and she has said so
      twice this week. Today you settle what one of these explosions is worth as a
      measuring stick. You will read a fading rate, measure a line against its rest
      wavelength, and turn a difference in brightness into a difference in distance. Get
      the ruler wrong and every point on the board moves the same way, quietly, for the
      rest of the campaign.
    takeaway: A distance indicator is a chain of corrections, and the chain is the measurement.
    stops:
      - group: PHOT
        task: Say which of two Type Ia supernovae was intrinsically brighter.
        title: The slow one is the bright one
        place: Photometry Desk
        concept: Standardising a Type Ia supernova by its decline rate
        scene: >-
          Two light curves are up on the board, each normalised to its own peak. One has
          lost nine tenths of a magnitude in the fifteen days since maximum. The other has
          lost a magnitude and a half in the same fifteen days.
        guide: >-
          Both curves are drawn from the same peak, so the height tells you nothing here.
          What separates them is width. Ask what a Type Ia is: a white dwarf that has run
          out of room, powered afterwards by the nickel it made. More nickel means more
          light, and it also means a hotter, more opaque envelope that takes longer to let
          the light out. So the two things move together, and one of them is measurable
          from the shape alone.
        background:
          - >-
              How to do it, on a different example. Two torches are shone at a wall and each
              is turned down to the same reading on a meter, so you cannot tell them apart by
              brightness. One takes ten seconds to fade out and the other takes thirty.
              Whatever is fuelling them, the slow one had more of it — and if the fuel is also
              what set the brightness, the slow one was the brighter torch to start with. The
              two light curves below are that comparison, with fifteen days for the ten
              seconds.
          - >-
              What a magnitude is. A brightness on a backwards scale: bigger numbers are
              fainter objects, and a difference of one magnitude is a factor of about two and
              a half in the light arriving. "Declines by nine tenths of a magnitude" therefore
              means it has faded to a little under half of its peak.
          - >-
              Why these explosions can be a ruler at all. They are not identical, and they do
              not have to be. What makes a population usable is that something you can measure
              without knowing the distance predicts the spread — here the shape of the fade —
              so a varied population can be corrected onto a common scale.
        assumes:
          - a magnitude is a brightness on a backwards scale, where larger is fainter
        takeaway: A population that is not uniform can still be a ruler, provided something measurable predicts the spread.
        format: CHOICE
        question: >-
          Supernova A declines by nine tenths of a magnitude in the fifteen days after peak
          and Supernova B declines by a magnitude and a half. Before any standardisation,
          which was intrinsically brighter?
        answerText: A, the slower decliner. Broader light curves are the brighter ones.
        why: >-
          A Type Ia is powered by radioactive nickel made in the explosion, and more nickel
          does two things at once. It makes more light, and it makes a hotter, more opaque
          envelope that releases that light over a longer stretch. So the bright ones are
          also the slow ones, and the width of a curve predicts its peak brightness to
          about a tenth of a magnitude. That is the whole reason these explosions can be
          used as distance indicators. They are not identical, and they do not need to be.
        choices:
          - A, the slower decliner.
          - B, the faster decliner.
          - Neither, because every Type Ia has the same intrinsic brightness.
          - Decline rate carries no information about brightness at all.
        answer: A, the slower decliner.
        rebuttals:
          - The faster decliner is the one with less nickel behind it, so it is fainter rather than brighter.
          - If they were all identical there would be nothing to standardise, and the scatter in the nearby sample would already be far smaller than it is.
          - Decline rate is the one thing about a light curve that can be measured without knowing the distance, which is exactly why the correction is built on it.

      - group: SPEC
        task: Turn a shifted line into a redshift.
        title: Fifty nanometres out of five hundred
        place: Spectroscopy Room
        person: true
        personId: oyelaran
        concept: Redshift as a fractional shift in wavelength
        scene: >-
          Alex Filippenko, the spectroscopy lead, has the host galaxy on one screen and a
          comparison arc taken in the same setup on the other. A feature that sits at five hundred nanometres in
          the laboratory is measured here at five hundred and fifty.
        guide: >-
          Redshift is a ratio and nothing else. Take how far the line has moved, and divide
          it by where the line sits at rest. The answer has no units, which is the first
          clue that it is not a distance and not a speed. The arc matters because the
          scale it fixes is what "measured here" means. Two of the tiles on the board are
          rest wavelengths of other lines entirely, and neither belongs in this
          calculation.
        background:
          - >-
              How to do it, on a different example. A line that sits at 400 nm in the
              laboratory turns up at 440 nm in a galaxy. The shift is 440 minus 400, which is
              40, and the redshift is 40 divided by 400 — a tenth. Two steps: subtract to get
              the shift, divide by the rest wavelength. Always divide by the rest one, never
              by the measured one, because the rest wavelength is the ruler.
          - >-
              Why the answer has no units. Nanometres divided by nanometres cancel, so a
              redshift is a bare number. That is the first clue about what it is not: not a
              distance, and only roughly a speed, and then only when it is small.
          - >-
              What the comparison arc is for. It is a lamp with lines at known wavelengths,
              photographed through the same instrument in the same setting. Without it,
              "measured at five hundred and fifty" is a position on a photograph rather than a
              wavelength.
        assumes:
          - a spectral line has a fixed wavelength in the laboratory
        takeaway: A redshift is measured against a rest wavelength, so it is a property of the pair rather than of either number alone.
        format: BALLPARK
        question: A feature moves from five hundred nanometres to five hundred and fifty. What is the redshift?
        answerText: A redshift of about a tenth. Fifty nanometres of shift divided by five hundred at rest.
        why: >-
          The shift is fifty nanometres and the rest wavelength is five hundred, so the
          line has moved by a tenth of its own length. That tenth is the redshift, written
          z. Notice what it is not. It is not a distance, and at this level it is only
          approximately a speed. It is a fraction, and every distance in this campaign is
          read against one. Dividing by the observed wavelength instead of the rest one is
          the usual slip, and it gets you a ninth rather than a tenth.
        estimate:
          prompt: The feature sits at five hundred nanometres in the laboratory and is measured at five hundred and fifty in the host galaxy.
          question: What is the redshift of the host?
          relationship: Redshift = (observed wavelength − rest wavelength) ÷ rest wavelength.
          labels:
            - 550 nm (where the feature is measured)
            - 500 nm (where that feature sits at rest)
            - 656.3 nm (hydrogen alpha at rest, a different line)
            - 393.4 nm (calcium K at rest, a different line)
          values: [550, 500, 656.3, 393.4]
          slots: 2
          template: "({0} − {1}) ÷ {1}"
          formula: (a-b)/b
          correct: [0, 1]
          target: 0.1
          tolerance: 0.006
          units: redshift z
          solution: Five hundred and fifty minus five hundred is fifty, and fifty divided by five hundred is a tenth.
          explanation: The other two tiles are rest wavelengths of lines that are not the one measured here. A redshift needs the pair that belong to each other.

      - group: COSMO
        task: Turn a flux ratio into a distance ratio.
        title: Four times fainter is not four times farther
        place: Cosmology Console
        concept: Flux falls as the inverse square of distance
        scene: >-
          Three standardised supernovae are on the console, all with the same intrinsic
          brightness after correction. Their measured fluxes are not the same. Schmidt wants
          them ranked by distance before anything is plotted.
        guide: >-
          The light from each of these left in every direction at once and is now spread
          over a sphere. Ask what happens to the area of that sphere when you double the
          radius. Whatever the flux does, it does it to the area rather than to the
          distance, and that is where the mismatch between the two numbers comes from.
          One of the options treats brightness and distance as though they scale together;
          two others invert the relation in different ways.
        background:
          - >-
              How to do it, on a different example. A lamp nine times fainter than an
              identical one: nine is three squared, so it is three times further away.
              Work backwards from the flux ratio by taking its square root. A hundred times
              fainter is ten times further; twice as faint is about one and a half times
              further, not twice.
          - >-
              Why it is a square. Light leaves a source in every direction and spreads over
              the surface of a sphere. Double the radius and that surface is four times as
              big, so the same light is spread four times as thin. The area grows as the
              square of the radius, and the brightness falls the same way.
          - >-
              Why the campaign works in magnitudes. On a logarithmic scale a fixed step in
              brightness is a fixed *ratio* in distance rather than a fixed number of
              megaparsecs, which is what you want when the sample spans a factor of ten in
              distance.
        assumes:
          - the two supernovae have the same intrinsic brightness after standardisation
        takeaway: Brightness differences never map onto distance differences one for one, because the light is spread over an area rather than a line.
        format: CHOICE
        question: >-
          Supernova B is four times fainter in flux than an otherwise identical Supernova
          A. How much farther away is B?
        answerText: Twice as far. Flux falls as the square of the distance, so a factor of four in flux is a factor of two in distance.
        why: >-
          Light leaving a source spreads over a sphere, and the area of a sphere grows as
          the square of its radius. Double the distance and the same light is spread over
          four times the area, so the flux falls to a quarter. Read backwards: a source
          four times fainter sits twice as far away. This is why the whole campaign works
          in magnitudes, a logarithmic scale, where a fixed step in brightness is a fixed
          ratio in distance rather than a fixed number of megaparsecs.
        choices:
          - Twice as far.
          - Four times as far.
          - Eight times as far.
          - Sixteen times as far.
        answer: Twice as far.
        rebuttals:
          - That reads the flux ratio straight off as a distance ratio, which would be right only if light spread along a line rather than over a sphere.
          - That is what you get by cubing rather than squaring, which is the volume of the sphere and not the surface the light lands on.
          - That squares the flux ratio instead of taking its root, which runs the relation the wrong way round.

  # ----------------------------------------------------------------- level 2
  - title: Fainter than the universe should allow
    objective: Put the high-redshift sample against a matter-only prediction and test the first alternative explanation.
    briefing: The sealed sample goes on the board this morning, against a curve drawn before anybody saw it.
    stake: >-
      Wednesday, and the decelerating curve has been on the wall since the campaign opened.
      Sofia Grant, the photometry analyst, unsealed the high-redshift sample at eight. The points are not on the curve and
      they are not scattered either side of it. They are above it, most of them, by about a
      quarter of a magnitude, which means the distant supernovae came out fainter than a
      universe made of matter alone would allow. Riess wants to know what the residual
      is measured against before anybody says a word about cosmology. Nicholas Suntzeff, who owns the zero points and the colour
      terms, wants the dust checked first. Today you place the points, commit to what gravity alone predicts, and
      then go looking for the ordinary explanation before reaching for the strange one.
    takeaway: An anomaly is only worth as much as the alternatives you have already knocked down.
    stops:
      - group: PHOT
        task: Put three supernovae on the residual plot.
        title: Above the line means fainter
        place: Photometry Desk
        concept: A magnitude residual is a comparison against a stated model
        scene: >-
          The residual plot is up with redshift along the bottom and observed minus model
          up the side. Grant has three supernovae to place and the model on the axis is the
          matter-only one drawn before the sample was unsealed.
        guide: >-
          Two things have to be held at once here. Magnitudes run backwards, so a larger
          number is a fainter object. And a residual is observed minus model, so it takes
          its sign from which of those two is larger. Work each case through in that order
          rather than reaching for the feel of the words. Note also what the plot is
          telling you about itself: with a different model on the axis, every one of these
          three points would land somewhere else.
        background:
          - >-
              How to do it, on a different example. A train is predicted to arrive at 10:00
              and arrives at 10:07. Observed minus predicted is plus seven minutes, so the
              point goes above the line. Arrive at 09:53 and it is minus seven, below the
              line. Do the subtraction in that order every time and the sign looks after
              itself.
          - >-
              The one thing that makes this harder than the train. Magnitudes run backwards, so
              a *larger* magnitude is a *fainter* object. A supernova that comes in fainter
              than predicted therefore has a larger observed magnitude, and observed minus
              model is positive — above the line. Faint is up.
          - >-
              Why the plot carries its model in its name. A residual is a comparison, so the
              same supernova sits in three different places on three different residual plots.
              The axis here says "observed minus the matter-only model", and every point on it
              means nothing without that phrase.
        assumes:
          - a residual is the measurement minus the model prediction
        takeaway: A residual carries the model it was measured against, so the same supernova sits in three different places on three different plots.
        format: PROTOCOL
        question: Match each supernova to where its point belongs on the residual plot.
        answerText: >-
          The faint one goes above the line at plus a quarter, the one on prediction goes
          at zero, and the bright one goes below at minus a quarter.
        why: >-
          Magnitudes run backwards, so fainter means a larger number. The residual is
          observed minus model, which makes a fainter than predicted supernova a positive
          residual, sitting above the zero line. A brighter than predicted one is negative
          and sits below it. That is the whole convention, and it is worth being slow about
          it, because the sign of the residual is the entire result of this campaign. The
          high-redshift points came out positive, which is to say the distant supernovae
          are fainter than the matter-only universe predicts.
        columns:
          - What the supernova did
          - Where its point goes
        scenarios:
          - Arrives a quarter of a magnitude fainter than the matter-only model predicts
          - Arrives exactly as bright as the matter-only model predicts
          - Arrives a quarter of a magnitude brighter than the model predicts
        choices:
          - Residual of zero, on the line
          - Residual of plus a quarter of a magnitude, above the line
          - Residual of minus a quarter of a magnitude, below the line
        mapping: [1, 0, 2]
        rebuttals:
          - A residual of zero is the supernova that landed on the prediction, not the one that came in fainter.
          - A supernova on the prediction has nothing left over, so its point sits on the line rather than off it.
          - Below the line is where the brighter than predicted events go, because observed minus model is negative there.

      - group: COSMO
        task: Commit to what a matter-only universe predicts, then unseal the sample.
        title: What gravity alone would have done
        place: Cosmology Console
        person: true
        personId: bardem
        concept: A universe with matter only must decelerate
        scene: >-
          Schmidt has the matter-only curve on the console and the high-redshift sample
          still sealed beside it. She wants the prediction written down and locked before
          the points go up, in that order and not the other one.
        guide: >-
          A universe containing only matter has one thing acting on its expansion, and that
          thing pulls inwards. So the expansion was faster in the past than a straight line
          would suggest, and objects at a given redshift are closer, and closer means
          brighter. Predict the mean residual you expect the distant sample to show against
          that curve, in magnitudes, and then unseal it and measure. What you are being
          asked for is the size of a gap, so a prediction of nothing is a real answer here.
        background:
          - >-
              How to think about it, on a different example. Throw a ball straight up. Gravity
              is the only thing acting on it, so it is always slowing down, and at any moment
              on the way up it is *lower* than it would have been if nothing had pulled on it.
              A universe with nothing in it but matter is that ball. Everything is closer than
              a coasting universe would put it, and closer means brighter.
          - >-
              So what number is being predicted. The mean residual of the distant sample
              against the matter-only curve, in magnitudes, on the *faint* side. If the
              universe really is matter-only, the honest prediction is zero — the points land
              on their own model. Anything on the faint side is a gap that model cannot
              account for.
          - >-
              Why the order matters. A prediction written after the sample is unsealed is a
              description of the sample. Locking it first is the only thing that makes the
              measurement afterwards capable of surprising anybody, including you.
        assumes:
          - matter attracts, and there is nothing else in this model to push
        takeaway: The prediction has to be written down before the data are seen, because a prediction made afterwards is a description.
        format: VERIFY
        question: Predict the mean residual of the high-redshift sample against the matter-only model, then unseal it and read it off.
        answerText: >-
          About a quarter of a magnitude fainter than the model. Predicting zero, or
          anything on the bright side, is what a matter-only universe would have given you.
        why: >-
          Gravity is the only actor in a matter-only universe and it pulls, so that universe
          decelerates. A decelerating expansion puts an object of given redshift closer than
          a coasting one would, and closer means brighter. The prediction is therefore that
          the distant sample lands on the curve or on the bright side of it. It did neither.
          It came in about a quarter of a magnitude faint, and the sign of that gap is what
          the rest of the campaign is about. A quarter of a magnitude is roughly a fifth in
          flux, which is small, consistent, and in the wrong direction.
        verify:
          prediction:
            label: Mean residual of the high-redshift sample against the matter-only model
            unit: magnitudes fainter
            min: 0
            max: 0.8
            step: 0.01
          truth: 0.25
          passRatio: [0.6, 1.6]
          intervention:
            label: Unseal the high-redshift sample and put it on the residual plot
            note: forty-two events, light curves frozen, zero points frozen
            outcome: The points go up. They sit above the line, and they stay above it across the whole redshift range.
          measurement:
            label: Read the mean residual off the plot
            note: mean over the forty-two events, with the low-redshift sample as the anchor
            cost: 25
            costUnit: minutes
          hint: Set the slider to the gap you expect, lock it, then unseal the sample and measure. A prediction you can change afterwards is not a prediction.
          unmeasuredMoral: >-
            Unsealing the sample and looking at it without reading the mean off is how a
            campaign ends up quoting an impression. The number is the thing that goes in
            the paper, and it is the thing you have to be willing to have been wrong about.

      - group: SPEC
        task: Find the variable that reddens the sample as well as dimming it.
        title: The ordinary explanation, tested rather than waved away
        place: Spectroscopy Room
        concept: Dust reddens as well as dims, and that is what separates it
        scene: >-
          Suntzeff has the same forty-two events measured in two bands and a colour readout on
          the bench. Three things could be making the distant sample come out faint, and
          the bench can change one of them at a time.
        guide: >-
          Change one variable, watch the colour, and then put it back and watch it return.
          The colour excess is what dust would leave behind: it scatters short wavelengths
          more than long ones, so anything it dims it also reddens. The other two candidates
          would move the brightness without touching the colour at all. That difference is
          the entire test, and it is why colour is on this bench rather than magnitude.
        background:
          - >-
              How to do it, on a different example. A room is dimmer than expected and there
              are three suspects: the bulb, the dimmer switch, and a curtain across the window.
              Pull the curtain back and if the light changes, put it back and see if the change
              reverses. One suspect at a time, and always undo it — a change that does not come
              back was something else drifting while you worked.
          - >-
              What colour excess is, and why it is the readout rather than brightness. Measure
              the same events in a blue band and a red band and subtract. Dust scatters short
              wavelengths harder than long ones, so anything it dims it also reddens. That
              gives dust a second fingerprint that the other suspects do not have.
          - >-
              Why the other two suspects leave the colour alone. A zero-point error shifts every
              magnitude by the same amount, so a subtraction between two bands cancels it. A
              bandpass correction changes what a magnitude means at high redshift and does the
              same. Both move brightness. Neither moves colour.
        assumes:
          - dust scatters blue light more strongly than red
        takeaway: A systematic is tested when you look for a second signature it would have left, not when you argue about how big it might be.
        format: CONTROL
        question: Which of the three candidates makes the colour move, and does the colour come back when you undo it?
        answerText: >-
          Dust along the line of sight. It takes the colour excess from about two hundredths
          of a magnitude to about two tenths, and removing it brings the colour straight
          back.
        why: >-
          Ordinary interstellar dust scatters short wavelengths more than long ones, so it
          cannot dim without also reddening. A zero point error or a mistaken correction for
          the shifted bandpass moves the brightness and leaves the colour alone. That is
          what makes colour the diagnostic: the sample is faint, and it is not red, so
          ordinary dust in the usual amount cannot be the whole story. This is one
          systematic checked, not all of them. An exotic dust that dimmed without reddening
          would still pass this test, which is why the campaign runs several.
        control:
          hint: Change one control, run the measurement, then restore it and run again. Commit only when you have seen the colour move and come back.
          noise: 0.02
          baseline: 0.02
          observable:
            label: Colour excess
            unit: magnitudes of B minus V
          response: 0.18
          truth: dust
          variables:
            - id: dust
              label: Dust along the line of sight
            - id: zeropoint
              label: Photometric zero point
            - id: bandpass
              label: Correction for the shifted bandpass
        rebuttals:
          - A zero point moves every magnitude together and leaves the colour where it was, so the readout on this bench would not move at all.
          - The bandpass correction changes what a magnitude means at high redshift, and it too leaves the colour excess alone.

  # ----------------------------------------------------------------- level 3
  - title: Say only what the data will carry
    objective: Compare expansion histories against the same points, put a number on the sign, and write the claim at the level the evidence supports.
    briefing: Three models, one sample, and a sentence that has to survive being wrong about the cause.
    stake: >-
      Thursday, the last day of the run, and the sample has been frozen since Wednesday
      night. Schmidt has three expansion histories on the console and one set of points to
      lay them over. Halina Marek, the publication editor, is in the Publication Room with a draft that
      already says more than the measurement does, which is what she is there to stop. Today you rank the
      models by what they leave over, work out the sign of the number that says whether the
      expansion is speeding up, and settle what the result is allowed to claim. The
      temptation on the last day is to write the explanation as though it were the
      observation. It is not, and the difference is what will still be standing in twenty
      years.
    takeaway: A result outlives its explanation only if the two were written in separate sentences.
    stops:
      - group: PHOT
        task: Rank three expansion histories by how much they leave over.
        title: Three curves over the same points
        place: Photometry Desk
        concept: Comparing expansion histories against one distance-redshift sample
        scene: >-
          Riess has laid three model curves over the residual plot. One is flat, with
          matter and a repulsive term. One is open, with matter alone and not much of it.
          One is matter only, at critical density. The points are the same for all three.
        guide: >-
          Rank the three by what is left over once the curve is subtracted, best first.
          Work from the sign and the size of the residuals rather than from what you already
          expect. The distant points sit faint, so a model that puts them closer will fall
          short, and by how much depends on how much matter is pulling. One of these three
          has something in it that pushes; of the other two, the emptier one decelerates
          less.
        background:
          - >-
              How to do it, on a different example. Three predicted growth curves are laid over
              the same measured heights, and the measurements all come in above two of the
              curves and on the third. Rank them by how much is left over once each curve is
              subtracted: the one the points sit on is best, and of the two that fall short,
              the one that falls least short is second. You are ranking by leftovers, not by
              which model you like.
          - >-
              Which way the points sit here, and why. The distant supernovae came in faint,
              which means further away than a decelerating universe puts them. So the model
              that fits is the one that lets the expansion speed up, and the one that misses by
              most is the one with the most matter in it — because that is the one braking
              hardest.
          - >-
              Where the middle model comes from. An open universe with the same amount of
              matter and nothing else still decelerates, but less, because less matter means
              less braking. It gets part of the way to the points and not all of it, which is
              exactly what puts it second.
        assumes:
          - a lower matter density means less deceleration
        takeaway: Rival models are not judged one at a time, but laid over the same points and read off by what is left over.
        format: SEQUENCE
        question: Put the three models in order by how well each tracks the high-redshift sample.
        answerText: >-
          The flat model with a repulsive term first, the low-density open model second, and
          the critical-density matter-only model last.
        why: >-
          The distant points are faint, which means they are farther away than a
          decelerating universe puts them. So the model that fits best is the one that lets
          the expansion speed up, and the worst is the one with the most matter in it,
          because that is the one decelerating hardest. The low-density open model sits
          between them: less matter means less deceleration, so it gets some of the way
          there but not all of it. That ordering is the model comparison, and no single
          curve on its own would have shown it.
        axis: Put the three models in order, the one that tracks the data best first.
        ends:
          - Tracks the points
          - Misses them by most
        cards:
          - A critical-density universe of matter only
          - A flat universe with about a third matter and the rest a repulsive term
          - An open universe with about a third matter and nothing else
        order: [1, 2, 0]

      - group: PRESS
        task: Choose the strongest statement the evidence will carry.
        title: The measurement, and then the mechanism
        place: Publication Room
        person: true
        personId: marek
        concept: The claim is the measurement, not the mechanism behind it
        scene: >-
          Marek has four candidate opening sentences on the screen, one of which is in the
          draft already. The sample is frozen, the model comparison is done, and the wire
          services are waiting on a form of words.
        guide: >-
          Read each sentence and ask what would have to be true for it to be wrong. One of
          them fails only if the distance measurements themselves are wrong. The others
          fail if a theory turns out differently, or if a stronger claim than the data
          support has been smuggled into a verb. Watch particularly for the sentence that
          names an effect and a cause in the same breath, and for the one that makes a
          statement about every supernova rather than about the sample.
        background:
          - >-
              How to do it, on a different example. A thermometer on a wall reads two degrees
              higher than last year. "The room is warmer" fails only if the thermometer is
              wrong. "The heating has been turned up" fails if it turns out to be sunlight
              through the window. Same data, and the second sentence has smuggled in a cause.
              Ask of each sentence below: what would have to be true for this to be wrong?
          - >-
              What this campaign actually measured. Brightnesses and redshifts of forty-two
              exploding stars, and nothing else. From those you get how the expansion rate has
              changed. You do not get what is causing it to change, and no amount of extra
              supernovae will give you that.
          - >-
              Two traps to watch for. A sentence that names an effect and a cause in the same
              breath, and a sentence that makes a claim about *every* supernova rather than
              about this sample. Both read as confident and both go further than the data.
        assumes:
          - the campaign has measured distances and redshifts and nothing else
        takeaway: A measurement and an explanation of it belong in separate sentences, and only the first one is the result.
        format: CHOICE
        question: What is the strongest statement this supernova result will carry?
        answerText: The late-time expansion of the universe is accelerating. That is the measurement, and it survives any theory of the cause.
        why: >-
          What was measured is a set of distances and redshifts. What they show is that the
          expansion has been speeding up in the recent past. That sentence fails only if the
          distances are wrong. Naming a component and calling it detected goes further than
          the data. The supernovae say nothing about what that component is made of, or even
          whether it is a component at all rather than a property of gravity. And saying the
          expansion has always accelerated contradicts the same points, which show
          deceleration earlier on.
        choices:
          - The late-time expansion of the universe is accelerating.
          - A new particle called dark energy has been directly detected.
          - The universe has always been accelerating, at the same rate throughout.
          - Every distant supernova is intrinsically fainter than every nearby one.
        answer: The late-time expansion of the universe is accelerating.
        rebuttals:
          - Nothing here detects a particle. The supernovae constrain how the expansion has changed, and are silent about what is behind it.
          - The same data show deceleration at higher redshift, so a constant rate of acceleration is ruled out by the very sample being quoted.
          - The whole campaign rests on the distant events being intrinsically the same as the nearby ones once standardised, so this sentence contradicts its own evidence.

      - group: COSMO
        task: Put a number on whether the expansion is speeding up.
        title: The sign is the whole answer
        place: Cosmology Console
        concept: The deceleration parameter, and what its sign means
        scene: >-
          The console is holding the flat fit. Matter is about three tenths of the critical
          density and the repulsive term is about seven tenths. Schmidt wants the
          deceleration parameter on the board before anybody leaves.
        guide: >-
          Matter pulls the expansion down and the repulsive term pushes it up, and the
          deceleration parameter is those two weighed against each other in one line. The
          matter term enters halved. Take the tiles that belong to this fit and leave the two
          that describe a matter-only universe alone. What matters when you are done is not
          the size of the answer but which side of zero it lands on.
        background:
          - >-
              How to do it, on a different example. Suppose a fit held four tenths of matter
              and six tenths of the repulsive term. Half of four tenths is two tenths, and two
              tenths minus six tenths is minus four tenths. Two steps: halve the matter, then
              subtract the repulsive term. What matters at the end is not the size but which
              side of zero it lands on.
          - >-
              Why matter enters halved and the other term does not. The two act on the
              expansion in different ways, and the factor of a half is what falls out of the
              relativistic bookkeeping. For this stop it is simply the rule the line carries:
              half the matter, minus the dark energy.
          - >-
              What the sign means. Positive means the expansion is slowing down, which is the
              universe everybody expected. Negative means it is speeding up. That single change
              of sign is the whole discovery, which is why it is checked before the size is
              quoted anywhere.
        assumes:
          - this is the flat fit, so the two densities are the ones the console is holding
        takeaway: One number and its sign carry the answer, which is why the sign is checked before the size is quoted.
        format: BALLPARK
        question: What is the deceleration parameter for the flat fit the console is holding?
        answerText: About minus a half. Negative, which is what an expansion that is speeding up looks like written down.
        why: >-
          Half of three tenths is fifteen hundredths, and taking seven tenths off that gives
          about minus a half. The size of the number depends on the fit and on what else is
          known; the sign does not. Negative means the expansion is speeding up, and that is
          the result. Notice how little arithmetic separates the two possible worlds here: had
          the repulsive term been zero, the same line would have given plus fifteen
          hundredths, a decelerating universe, and no discovery at all.
        estimate:
          prompt: The console is holding a flat fit with about three tenths of the critical density in matter and about seven tenths in the repulsive term.
          question: What is the deceleration parameter now?
          relationship: Deceleration parameter = matter density × one half − dark-energy density.
          labels:
            - 0.3 (matter density in this fit)
            - 0.5 (the half the matter term carries)
            - 0.7 (dark-energy density in this fit)
            - 1.0 (matter density in a critical-density matter-only universe)
            - 0.0 (dark-energy density in a matter-only universe)
          values: [0.3, 0.5, 0.7, 1.0, 0.0]
          slots: 3
          template: "{0} × {1} − {2}"
          formula: a*b-c
          correct: [0, 1, 2]
          target: -0.55
          tolerance: 0.03
          units: deceleration parameter, negative when speeding up
          solution: Three tenths times a half is fifteen hundredths, and fifteen hundredths minus seven tenths is minus fifty-five hundredths.
          explanation: The last two tiles describe the matter-only universe this result rules out. Put them in and you get a positive answer, which is the world where nothing was discovered.

warmups:
  greet:
    title: Six people and one result between them
    why: >-
      Nothing on this floor is measured by one person. The zero points, the types, the light
      curves and the fit are four different desks, and a number is only as good as the desk
      it came from. Put a name to as many of them as you can before the run starts.
  trial-near:
    title: Walk the floor before the sample is unsealed
    why: >-
      Photometry and the cosmology console are out on the floor, and spectroscopy and the
      publication room are through the ring corridor behind you. Walk it once now. Riess,
      the photometry lead, would rather you knew the way than went looking during a run.
  follow:
    title: Grant carries a light curve from the desk to the console
    why: >-
      A magnitude is fitted at one desk, calibrated at another and plotted at a third, and
      most of what goes wrong happens in between. Sofia Grant, the photometry analyst, walks
      one all the way through. Stay with her and watch where the number changes hands.

copy:
  PHOT: <p>The photometry desk, on the front row under the plot boards. Every light curve in the campaign is fitted here and every point on the residual plot comes off this screen.</p>
  SPEC: <p>The spectroscopy room, off the west side of the ring corridor: a comparison arc on one screen, a host galaxy on the other, and the colour bench along the far wall.</p>
  COSMO: <p>The cosmology console, at the back of the floor looking down at the boards. Expansion histories are laid over the sample here, and nothing is fitted until the calibration is frozen.</p>
  PRESS: <p>The publication room, off the east side of the ring. A draft on the screen, a red pen, and an argument about where the measurement stops and the explanation starts.</p>

    reason: "The correct traversal uses matching indexes, but the live display code contains one explicit temps[i - 1] access for Room 7."
    scene: "When the display row for Room 7 uses i = 2, the expression temps[i - 1] reads array index 1, whose value is 4.1°C from Room 6. Choose the controller value Room 7 will falsely display."
    motivation: "Computing the exact wrong index explains the alarm without changing or discarding any physical temperature measurement."
    format: CHOICE
    question: "Evaluate i - 1 at i = 2 and submit the temperature the buggy display assigns to Room 7."
    choices:

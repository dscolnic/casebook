  # --- Stop 25: Map sensor positions
  #     Concept: 26 — Arrays: creation, access, default values, and bounds; Keystone: Collections & indexing; Area: HAB; Prerequisites: Introduces collection/index mapping.; Learning role: INTRODUCE; Difficulty: L3; Story role: clue.
  #     placement: PROBE, Sensor Probe Rack.
  - group: HAB
    at: sensor-probe-rack
    title: "Map sensor positions"
    concept: 26   # Arrays: creation, access, default values, and bounds
    reason: "Mei needs the physical room labels compared with the array entries before she evacuates anyone from a cold-room alarm."
    scene: "Four room stations each show an independent thermometer and the controller value read from temps[index]. Probe every station and compare observed room temperature with the expected array mapping to find where the controller's position-to-room relationship first breaks."
    motivation: "Station-by-station expected values can reveal an indexing problem even when every numeric reading is individually plausible."
    format: PROBE
    question: "Probe all four stations, compare each observed reading with its explicit expected value, and submit where the pattern breaks."
    choices:
    - "Room 5"
    - "Room 6"
    - "Room 7"
    - "Vestibule"
    answerText: "Each thermometer agrees with its own expected room value, so the alarming 4.1°C exists physically but belongs to Room 6 rather than Room 7."
    why: "Arrays store values by index, and a wrong mapping can attach a correct element to the wrong real-world label."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Calling the 4.1°C value fabricated ignores the independent Room 6 thermometer. Evacuating Room 7 before mapping the indexes confuses value correctness with label correctness.
    # correct result: The physical station readings are consistent; the controller's room-label mapping is the suspect layer.
    # state/output: The Sensor Wall places index numbers beside all four room labels.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   probe:
    #     stations:
    #       - {id: r5, label: "Room 5", reading: "20.4 °C", expected: "20.4 °C", load: "temps[0]"}
    #       - {id: r6, label: "Room 6", reading: "4.1 °C", expected: "4.1 °C", load: "temps[1]"}
    #       - {id: r7, label: "Room 7", reading: "20.9 °C", expected: "20.9 °C", load: "temps[2]"}
    #       - {id: vest, label: "Vestibule", reading: "7.0 °C", expected: "7.0 °C", load: "temps[3]"}
    #     target: r7
    #     quantityAndUnits: "Compare each room's physical temperature with its expected reading and determine whether Room 7 is actually cold."
    #     correctConclusion: "Room 7 is 20.9 °C, so the physical readings are consistent and the controller label mapping is suspect."
    probe:
      stations:
        - id: r5
          label: Room 5
          reading: 20.4 °C
          expected: 20.4 °C
          load: temps[0]
        - id: r6
          label: Room 6
          reading: 4.1 °C
          expected: 4.1 °C
          load: temps[1]
        - id: r7
          label: Room 7
          reading: 20.9 °C
          expected: 20.9 °C
          load: temps[2]
        - id: vest
          label: Vestibule
          reading: 7.0 °C
          expected: 7.0 °C
          load: temps[3]
      target: r7
      quantityAndUnits: Compare each room's physical temperature with its expected reading and determine whether Room 7 is actually cold.
      correctConclusion: Room 7 is 20.9 °C, so the physical readings are consistent and the controller label mapping is suspect.


  # --- Stop 27: Catch the shifted index
  #     Concept: 26 — Arrays: creation, access, default values, and bounds; Keystone: Collections & indexing; Area: HAB; Prerequisites: Practices array access from Stops 25–26.; Learning role: PRACTICE; Difficulty: L3; Story role: reveal.

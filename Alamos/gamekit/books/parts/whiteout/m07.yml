      - 20.9 °C
      - 7.0 °C
      - array index 3
    answer: 4.1 °C
    answerText: "Subtracting one from the display-row index maps Room 7 to Room 6's element."
    why: "Index expressions are ordinary integer expressions, so an off-by-one error can be traced numerically."

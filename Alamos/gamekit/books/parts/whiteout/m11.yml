  # --- Stop 41: Compare two controller objects
  #     Concept: 21 — Class anatomy: fields, encapsulation, and object state; Keystone: Object state & references, State & assignment, Boolean logic; Area: CODE; Prerequisites: Delayed retrieval of object identity from Mission 5.; Learning role: RETRIEVE; Difficulty: L3; Story role: clue.
  #     placement: CASEBOOK, Priya Nair at the Version Rack.
  - group: CODE
    at: version-rack
    title: "Compare two controller objects"
    concept: 21   # Class anatomy: fields, encapsulation, and object state
    reason: "Priya needs to prove P02 and H04 are different objects before blaming a shared field for their identical warnings."
    scene: "Priya Nair checks the evidence: P02 belongs to power, H04 belongs to habitat, their object identifiers differ, and each has a separate limit field, yet both report lastWarning = 7. Match the evidence to what it says about object identity and unexpectedly shared state."
    motivation: "Separate object identities make a class-level shared field more plausible than one physical controller somehow becoming the other."
    format: CASEBOOK
    question: "Match each record to the interpretation it supports, then submit whether the identical warning proves the objects are the same."
    choices:
      - the objects are distinct
      - their instance limits are independent
      - some warning state may be class-wide
      - identity comparison confirms different references
    answerText: "Their identifiers, limits, and identity comparison are independent, leaving the shared warning value as a separate state-design issue."
    why: "Objects can have independent instance fields while also reading a class-wide static field."
    # wrong-path feedback, one rebuttal per wrong option:

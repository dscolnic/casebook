  # --- Stop 42: Inspect the static field
  #     Concept: 25 — Class variables, static methods, scope, access, and this; Keystone: Object state & references, Methods & abstraction; Area: CODE; Prerequisites: Builds directly on Stop 41's object-identity evidence.; Learning role: INTRODUCE; Difficulty: L4; Story role: reveal.
  #     placement: DERIVE, Software Lab — Code Review Wall.
  - group: CODE
    at: code-review-wall
    title: "Inspect the static field"
    concept: 25   # Class variables, static methods, scope, access, and this
    reason: "Stop 41 proved the controllers are distinct, so the identical warning must come from code that stores state outside each individual object."
    scene: "Priya Nair checks the evidence: the class currently declares static int lastWarning;, and H04 writes 7 immediately before P02 reads the same value. Build the declaration and access pattern that give each controller its own warning state instead of one class-wide slot."
    motivation: "Moving warning state into each object should let H04 change without overwriting P02's previously stored warning."
    format: DERIVE
    question: "Choose the field declaration and assignment that store warning state separately in each controller object."
    answerText: "Removing static gives every instance its own field, and this writes the receiver's copy."
    why: "Static fields belong to the class; instance fields belong to individual objects."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Keeping static preserves the coupling. Writing through the class name still targets shared class state.
    # correct result: private int lastWarning; and this.lastWarning = value;.
    # state/output: The Code Review Wall changes the warning field from CLASS STATE to INSTANCE STATE.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:
    #     start: "P02.lastWarning = 3; H04.lastWarning = 4; then H04.setWarning(7) is called."
    #     goal: "keep each object's warning state independent after one object changes"
    #     steps:
    #       - id: field
    #         prompt: "Choose the field declaration."
    #         choices:
    #           - {line: "private int lastWarning;", correct: true}
    #           - {line: "private static int lastWarning;", correct: false, survives: true, why: "A static field belongs to the class, so one object's write changes the value seen through every object."}
    #       - id: write
    #         prompt: "Choose the assignment inside setWarning."
    #         choices:
    #           - {line: "this.lastWarning = value;", correct: true}
    #           - {line: "Controller.lastWarning = value;", correct: false, survives: true, why: "Writing through the class name targets shared class state instead of the receiving object's own field."}
    derive:
      start: "P02 warning starts at 3; H04 warning starts at 4. The replay calls H04.setWarning(7); value is the method parameter. Each object must keep its own warning. Source: P02.lastWarning = 3; H04.lastWarning = 4; then H04.setWarning(7) is called."
      goal: keep each object's warning state independent after one object changes
      steps:
        - ask: Choose the field declaration.
          answer: 0
          candidates:
            - text: private int lastWarning;
            - text: private static int lastWarning;
              why: A static field belongs to the class, so one object's write changes the value seen through every object.
              survives: true
        - ask: Choose the assignment inside setWarning.
          answer: 0
          candidates:
            - text: this.lastWarning = value;
            - text: Controller.lastWarning = value;
              why: Writing through the class name targets shared class state instead of the receiving object's own field.
              survives: true

  # --- Stop 43: Probe independent warning state
  #     Concept: 23 — Writing instance methods; Keystone: Object state & references; Area: POWER; Prerequisites: Practices instance methods from Mission 5 after a long delay.; Learning role: PRACTICE; Difficulty: L4; Story role: obstacle.
  #     placement: PROBE, Generator Controller.
  - group: POWER
    at: generator-controller
    title: "Probe independent warning state"
    concept: 23   # Writing instance methods
    reason: "The field is now instance state, but the team needs multiple controllers to show the repair is not accidentally hard-coded to P02."
    scene: "Malik Okafor checks the evidence: four controllers start with different warning values, then H04 alone receives setWarning(7). Probe each controller and compare its observed warning with the explicit value expected if instance state is truly independent."
    motivation: "A station-wide fix should preserve each untouched object's warning while changing only the receiver of the method call."
    format: PROBE
    question: "Probe all four controllers, compare every observed warning with its station-specific expected value, and submit whether the state is independent."
    choices:
    - "P02"
    - "P03"
    - "H04"
    - "H05"
    answerText: "The instance method writes the receiver object's field and leaves every other object's field unchanged."
    why: "Object encapsulation is observable when changes remain local to the intended receiver."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Any common value across all four would indicate shared state remains. Changing P02 would contradict the no-call control.
    # correct result: Only H04 changes to 7; the other three retain 3, 2, and 4.
    # state/output: The Generator Controller panel shows P02 warning 3 after H04 writes 7.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in

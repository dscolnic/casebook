    #   - b
    #   - c
    #   - d
    #   axis: row-major traversal
    #   ends:
    #   - start row 0
    #   - finish row 1
    cards:
      - "[0][0]"
      - "[0][1]"
      - "[1][0]"
      - "[1][1]"
    order:
      - 0
      - 1
      - 2
      - 3
    axis: row-major traversal
    ends:
      - start row 0
      - finish row 1

  # --- Stop 35: Find the transposed write
  #     Concept: 30 — 2D arrays: creation, access, traversal, and algorithms; Keystone: Collections & indexing; Area: CODE; Prerequisites: Combines 2D structure with earlier indexing error diagnosis.; Learning role: COMBINE; Difficulty: L4; Story role: reveal.
  #     placement: DIAGNOSIS, Software Lab — Code Review Wall.
  - group: CODE
    at: code-review-wall
    title: "Find the transposed write"
    concept: 30   # 2D arrays: creation, access, traversal, and algorithms
    reason: "The visit order is correct, so the bug must occur when each surveyed cell is written into the rover display grid."
    scene: "Priya Nair checks the evidence: the copy loop visits cells in row-major order, the source survey shows the crevasse at [0][1], and the display shows it at [1][0]. Diagnose which write statement produces exactly that transpose while preserving every source value."
    motivation: "The right explanation must account for correct traversal, correct source data, and a swapped destination coordinate."
    format: DIAGNOSIS
    question: "Read all four zones and submit the one write statement that produces the observed transpose."
    choices:
      - display[col][row] = survey[row][col]
      - display[row][col] = survey[row][col]
      - display[row][col] = SAFE
      - survey[col][row] = display[row][col]
    answerText: "The source indexes are read correctly, but the destination receives column first and row second, moving [0][1] to [1][0]."
    why: "2D array correctness depends separately on traversal order and the index expressions used at each access."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Same-index copy contradicts the display mismatch. Writing SAFE would remove, not move, the hazard. The reversed assignment changes the wrong array.
    # correct result: display[col][row] = survey[row][col].
    # state/output: The Code Review Wall highlights the swapped destination indexes.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   headline: Which write creates the one-cell transpose?
    #   readings:
    #   - zone: SOURCE
    #     label: survey[0][1]
    #     value: CREVASSE
    #   - zone: TRAVERSAL
    #     label: visit order
    #     value: row-major correct
    #   - zone: DISPLAY
    #     label: display[1][0]
    #     value: CREVASSE
    #   - zone: QUIET CONTROL
    #     label: display[0][0]
    #     value: SAFE as expected
    #   choices:
    #   - id: swap
    #     label: display[col][row] = survey[row][col]
    #     mechanism: Swaps the destination indexes and moves [0][1] to [1][0].
    #   - id: same
    #     label: display[row][col] = survey[row][col]
    #     mechanism: Would preserve the crevasse at [0][1].
    #   - id: clear
    #     label: display[row][col] = SAFE
    #     mechanism: Would erase the crevasse rather than transpose it.
    #   - id: survey
    #     label: survey[col][row] = display[row][col]
    #     mechanism: Writes into the source grid and does not match the observed direction.
    #   answer: swap
    readings:
      - zone: SOURCE
        label: survey[0][1]
        value: CREVASSE
        status: alarm
      - zone: TRAVERSAL
        label: visit order
        value: row-major correct
        status: normal
      - zone: DISPLAY
        label: display[1][0]
        value: CREVASSE
        status: alarm
      - zone: QUIET CONTROL
        label: display[0][0]
        value: SAFE as expected
        status: normal
    headline: Which write creates the one-cell transpose?
    answer: display[col][row] = survey[row][col]
    rebuttals:
      - Same-index copying would leave the crevasse at [0][1], contradicting display[1][0].
      - Writing SAFE would erase a hazard rather than move it to the transposed cell.
      - Writing into survey changes the source grid, but the source reading at [0][1] is already correct.


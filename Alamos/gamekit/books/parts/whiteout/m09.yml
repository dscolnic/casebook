  stops:
  # --- Stop 33: Read the hazard grid
  #     Concept: 30 — 2D arrays: creation, access, traversal, and algorithms; Keystone: Collections & indexing; Area: VEH; Prerequisites: Builds on 1D indexing from Mission 7 and ArrayList indexing from Mission 8.; Learning role: INTRODUCE; Difficulty: L3; Story role: clue.
  #     placement: PROBE, Route Table.
  - group: VEH
    at: route-table
    title: "Read the hazard grid"
    concept: 30   # 2D arrays: creation, access, traversal, and algorithms
    reason: "Jonah needs to know whether the field survey or the rover display moved the crevasse before Rover Three uses the map."
    scene: "Jonah Reyes checks the evidence: Survey stakes mark a crevasse at row 0, column 1, but the rover display highlights row 1, column 0. Probe four named cells and compare observed survey status with the expected stored grid value to locate the mismatch pattern."
    motivation: "A two-dimensional indexing error can transpose correct field data into a different map cell without changing the survey itself."
    format: PROBE
    question: "Probe all four cells, compare each reading with its explicit expected state, and submit whether the survey or display mapping is suspect."
    choices:
    - "cell [0][0]"
    - "cell [0][1]"
    - "cell [1][0]"
    - "cell [1][1]"
    answerText: "The field measurements agree with the stored survey grid, while the displayed crevasse appears at the swapped coordinate."
    why: "2D arrays use two indexes whose order matters; swapping them can transpose a map."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Blaming the survey ignores four matching station checks. Calling both cells crevasses invents evidence not present in the probes.
    # correct result: The survey is consistent; the display mapping is suspect.
    # state/output: The Route Table shows the surveyed crevasse at [0][1] and the display mismatch at [1][0].
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   probe:
    #     stations:
    #       - {id: c00, label: "cell [0][0]", reading: "SAFE", expected: "SAFE", load: "survey stake 00"}
    #       - {id: c01, label: "cell [0][1]", reading: "CREVASSE", expected: "CREVASSE", load: "survey stake 01"}
    #       - {id: c10, label: "cell [1][0]", reading: "SAFE", expected: "SAFE", load: "survey stake 10"}
    #       - {id: c11, label: "cell [1][1]", reading: "SAFE", expected: "SAFE", load: "survey stake 11"}
    #     target: c01
    #     quantityAndUnits: "Probe all four survey cells and identify the station that establishes the crevasse's true row-column location."
    #     correctConclusion: "Cell [0][1] is the crevasse and the other three cells are SAFE; the display write is transposing coordinates."
    probe:
      stations:
        - id: c00
          label: cell [0][0]
          reading: SAFE
          expected: SAFE
          load: survey stake 00
        - id: c01
          label: cell [0][1]
          reading: CREVASSE
          expected: CREVASSE
          load: survey stake 01
        - id: c10
          label: cell [1][0]
          reading: SAFE
          expected: SAFE
          load: survey stake 10
        - id: c11
          label: cell [1][1]
          reading: SAFE
          expected: SAFE
          load: survey stake 11
      target: c01
      quantityAndUnits: Probe all four survey cells and identify the station that establishes the crevasse's true row-column location.
      correctConclusion: Cell [0][1] is the crevasse and the other three cells are SAFE; the display write is transposing coordinates.

  # --- Stop 34: Walk the grid in order
  #     Concept: 30 — 2D arrays: creation, access, traversal, and algorithms; Keystone: Collections & indexing; Area: VEH; Prerequisites: Practices 2D access introduced in Stop 33.; Learning role: PRACTICE; Difficulty: L3; Story role: obstacle.
  #     placement: SEQUENCE, Vehicle Bay — Route Planning Board.
  - group: VEH
    at: route-planning-board
    title: "Walk the grid in order"
    concept: 30   # 2D arrays: creation, access, traversal, and algorithms
    reason: "Stop 33 proved the survey grid is correct, so the crew now needs the exact row-major order used by the map-copy loop."
    scene: "Jonah Reyes checks the evidence: For a 2×2 grid, the copy loop should visit [0][0], [0][1], [1][0], and [1][1] in row-major order. Put those accesses on the rail so the later write can be compared with the intended traversal."
    motivation: "A correct traversal order makes it easier to isolate whether the defect is in visiting cells or writing them to the destination."
    format: SEQUENCE
    question: "Place the four grid accesses in row-major order, then submit the sequence."
    answerText: "The inner column loop completes both columns of row 0 before the outer row loop advances to row 1."
    why: "Nested iteration over a 2D array creates a predictable visit order from the loop structure."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Column-major order would visit [1][0] before [0][1]. Any order that repeats or omits a cell is not a complete 2×2 traversal.
    # correct result: [0][0] → [0][1] → [1][0] → [1][1].
    # state/output: The Route Table animates the four row-major cells in sequence.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   cards:

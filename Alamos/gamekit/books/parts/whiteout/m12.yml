  #     Concept: 32 — Selection sort and insertion sort; Keystone: Search & efficiency, Collections & indexing; Area: CODE; Prerequisites: Combines sorting with collection order and delayed efficiency reasoning.; Learning role: COMBINE; Difficulty: L4; Story role: reversal.

  - group: CODE
    at: code-review-wall
    title: "Preserve equal-priority order"
    concept: 32   # Selection sort and insertion sort
    reason: "The selection-sort trace exposes an equal-priority pair, so Priya wants an insertion rule that never moves a later equal-priority item ahead of an earlier one."
    scene: "Insertion sort shifts prior items while their priority is worse than the current item. Choose the comparison that shifts only strictly larger priority numbers and therefore preserves POWER before RUNWAY when both have priority 2."
    motivation: "A one-character comparison choice can change whether equal-priority rescue actions retain their original operational order."
    format: DERIVE
    question: "Choose the insertion-sort comparison and the resulting order for the equal-priority pair."
    answerText: "Strict > shifts only worse priorities, so an equal-priority earlier item is not moved behind the later one."
    why: "Sorting correctness can include a stability requirement in addition to numeric order."
    # wrong-path feedback, one rebuttal per wrong option:

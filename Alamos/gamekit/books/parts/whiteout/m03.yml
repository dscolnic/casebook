  # --- Stop 10: Find the endless condition
  #     Concept: 15 — while loops and termination; Keystone: Iteration; Area: VEH; Prerequisites: Uses the sequence from Stop 9.; Learning role: INTRODUCE; Difficulty: L3; Story role: reveal.
  #     placement: DERIVE, Vehicle Bay — Route Planning Board.
  - group: VEH
    at: route-planning-board
    title: "Find the endless condition"
    concept: 15   # while loops and termination
    reason: "Stop 9 showed the route index must advance, but the live trace repeats index zero through every lap around the marker."
    scene: "Jonah Reyes checks the evidence: the current while loop checks index < waypoints.length, reads waypoints[index], and steers correctly, but its body never changes index. Choose the progress statement and explain why the condition can otherwise remain true forever."
    motivation: "A loop terminates only if repeated work changes state in a way that can eventually make its condition false."
    format: DERIVE
    question: "Choose the missing progress statement and the explanation that proves the loop can terminate."
    answerText: "Without changing index, the condition index < length remains true for the same stored value."
    why: "A while loop does not know that a physical action finished unless program state is updated explicitly."
    # wrong-path feedback, one rebuttal per wrong option:
    #   index = index leaves the state unchanged. Physical steering does not change a Java variable unless code assigns the new state.
    # correct result: index++;; the loop ends when index reaches waypoints.length.
    # state/output: The Route Table highlights index as the missing progress variable.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:
    #     start: "int index = 0; while (index < waypoints.length) { goTo(waypoints[index]); ... }"
    #     goal: "advance loop state until the waypoint condition becomes false"
    #     steps:
    #       - id: progress
    #         prompt: "Choose the state update."
    #         choices:
    #           - {line: "index++;", correct: true}
    #           - {line: "index = index;", correct: false, survives: true, why: "The assignment stores the same value back into index, so index never approaches waypoints.length and the condition never becomes false."}
    #       - id: reason
    #         prompt: "Choose the termination explanation."
    #         choices:
    #           - {line: "index eventually reaches waypoints.length, making index < length false", correct: true}
    #           - {line: "steering changes, so the Java condition becomes false automatically", correct: false, survives: true, why: "The while condition reads index and the array length; changing unrelated state cannot make that Boolean expression false."}
    derive:
      start: "index starts at 0; waypoints.length = 4. Each arrival must advance by one position. The loop tests index < waypoints.length. Source: int index = 0; while (index < waypoints.length) { goTo(waypoints[index]); ... }"
      goal: advance loop state until the waypoint condition becomes false
      steps:
        - ask: Choose the state update.
          answer: 0
          candidates:
            - text: index++;
            - text: index = index;
              why: The assignment stores the same value back into index, so index never approaches waypoints.length and the condition never becomes false.
              survives: true
        - ask: Choose the termination explanation.
          answer: 0
          candidates:
            - text: index eventually reaches waypoints.length, making index < length false
            - text: steering changes, so the Java condition becomes false automatically
              why: The while condition reads index and the array length; changing unrelated state cannot make that Boolean expression false.
              survives: true

  # --- Stop 11: Advance the route index
  #     Concept: 6 — Compound assignment and increment/decrement; Keystone: Iteration, State & assignment; Area: VEH; Prerequisites: Practices the progress requirement from Stop 10.; Learning role: PRACTICE; Difficulty: L2; Story role: obstacle.
  #     placement: CHOICE, Jonah Reyes at the Route Planning Board.
  - group: VEH
    at: route-planning-board
    title: "Advance the route index"
    concept: 6   # Compound assignment and increment/decrement
    reason: "Jonah wants the smallest repair that advances exactly one waypoint after each confirmed arrival without changing the loop condition."
    scene: "Jonah Reyes checks the evidence: the loop index is an int starting at zero, and each completed waypoint must advance it by exactly one. Choose the update that changes the stored value once per iteration without resetting or skipping positions."
    motivation: "The correct update should produce indexes 0, 1, 2, and 3 before the length check stops a four-waypoint route."
    format: CHOICE
    question: "Select the one update that advances the stored route index by exactly one."
    choices:
      - index++;
      - index = 0;
      - index += 2;
      - index =+ 1;
    answer: index++;
    answerText: "Increment is shorthand for assigning the current integer value plus one back into the same variable."
    why: "Compound updates change stored state; their direction and step size determine which indexes are visited."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Reset keeps the rover at zero. Adding two skips waypoints. index =+ 1 resets the stored value to positive one instead of incrementing it.
    # correct result: index++;.
    # state/output: Jonah adds index++ to the pending route patch.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   question: "Which update advances exactly one position?"
    #   choices:
    #     - "index++;"
    #     - "index = 0;"
    #     - "index += 2;"
    #     - "index =+ 1;"
    #   answer: "index++;"
    #   why: "index++ adds one to the current stored value after each completed waypoint."
    #   rebuttals:
    #     "index = 0;": "This resets the rover to the first waypoint and recreates the endless loop."
    #     "index += 2;": "This skips every second waypoint."
    #     "index =+ 1;": "This assigns positive one every time instead of adding one to the current index, so the route gets stuck at index 1."
    rebuttals:
      - This resets the rover to the first waypoint and recreates the endless loop.
      - This skips every second waypoint.
      - This assigns positive one every time instead of adding one to the current index, so the route gets stuck at index 1.


    concept: 1   # Algorithms, sequencing, and program execution
    reason: "Jonah needs the rover's intended four-step route separated from the code that is trapping it at the first marker."
    scene: "Jonah Reyes checks the evidence: Rover Three should read a waypoint, steer toward it, confirm arrival, and then advance to the next route position. Put those four algorithm steps in execution order so the crew can compare intended behavior with the repeating field trace."
    motivation: "A correct sequence gives the loop a state change that can move the rover toward its stopping condition."
    format: SEQUENCE
    question: "Place the four route actions in the order one successful loop iteration should perform them, then submit the sequence."
    answerText: "The next iteration should begin only after the current waypoint is reached and the index changes."
    why: "Algorithms are ordered instructions; changing the order can make later steps use stale state."

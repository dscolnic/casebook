  # --- Stop 14: Add the edge case
  #     Concept: 35 — Testing, debugging, edge cases, and incremental development; Keystone: Debugging & tests; Area: CODE; Prerequisites: Practices testing introduced in Stop 13.; Learning role: PRACTICE; Difficulty: L2; Story role: obstacle.
  #     placement: CHOICE, Priya Nair at the Test Bench.
  - group: CODE
    at: test-bench
    title: "Add the edge case"
    concept: 35   # Testing, debugging, edge cases, and incremental development
    reason: "The shared replay reproduces the ordinary failures, but Priya wants one boundary input that could expose whether the utility assumes nonempty data."
    scene: "Priya Nair checks the evidence: the utility receives lists of sensor values and normally processes at least one item, yet an outage can legitimately produce an empty list. Choose the edge case that tests this boundary directly instead of repeating another ordinary input."
    motivation: "A boundary case is useful when it exercises a condition the normal examples never reach."
    format: CHOICE
    question: "Select the one input that directly tests the utility's lower-boundary behavior."
    choices:
      - an empty sensor list []
      - the same three-value list again
      - a list with the values in a different font
      - a screenshot of the live dashboard
    answer: an empty sensor list []
    answerText: "The empty list reaches code paths that ordinary nonempty examples cannot exercise."
    why: "Edge cases target boundaries such as empty, minimum, maximum, or transition conditions."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Repeating ordinary data is practice, not a boundary test. Font choice is not input state. Screenshot does not execute the utility.
    # correct result: Use the empty list [].
    # state/output: The Test Bench adds EMPTY INPUT to the regression set.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   question: "Which next input is the best edge case?"

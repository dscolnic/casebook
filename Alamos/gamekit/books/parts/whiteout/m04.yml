    #     - "a list with the values in a different font"
    #     - "a screenshot of the live dashboard"
    #   answer: "an empty sensor list []"
    #   why: "An empty list exercises the lower boundary where indexing or averaging code may fail."
    #   rebuttals:
    #     "the same three-value list again": "This repeats the ordinary path and adds little new information."
    #     "a list with the values in a different font": "Display styling does not change the program input."
    #     "a screenshot of the live dashboard": "A screenshot is observation, not an input to the utility."
    rebuttals:
      - This repeats the ordinary path and adds little new information.
      - Display styling does not change the program input.
      - A screenshot is observation, not an input to the utility.

  # --- Stop 15: Verify the utility contract
  #     Concept: 8 — Comments, documentation, preconditions, and postconditions; Keystone: Methods & abstraction, Debugging & tests; Area: CODE; Prerequisites: Introduces method-contract abstraction while retrieving the edge-case test.; Learning role: INTRODUCE; Difficulty: L3; Story role: character.
  #     placement: ATTEST, Priya Nair at the Code Review Wall.
  - group: CODE
    at: code-review-wall
    title: "Verify the utility contract"
    concept: 8   # Comments, documentation, preconditions, and postconditions
    reason: "Priya needs to separate what the utility's documentation actually promises from behaviors the station merely happened to rely on."
    scene: "Priya Nair checks: the method header, comments, and captured tests make several claims about valid inputs and returned values, but only three can be verified before the next control cycle. Spend three checks on the claims that determine whether callers are using the utility correctly."
    motivation: "A documented precondition can shift responsibility to callers, while an undocumented behavior cannot safely be treated as a contract."
    format: ATTEST
    question: "You have two verification checks. Spend them on the unresolved claims whose failure would change whether this method is safe to reuse, then submit the two claims to verify."
    choices:
    - "input may be empty"
    - "returned list preserves input order"
    - "method never changes the input list"
    - "method always returns exactly three values"
    answerText: "The two scarce checks belong on the unresolved critical claims. The reference test confirms no mutation, while a four-value input proves that fixed size is not part of the contract."
    why: "Comments and contracts communicate intended preconditions/postconditions, but examples alone do not make an accidental pattern a guarantee."
    # wrong-path feedback, one rebuttal per wrong option:
    #   - Rechecking empty-input support spends a scarce check on a claim already backed by documentation and a boundary test.
    # correct result: Verify method never changes the input list and method always returns exactly three values; the first is supported and the second is disproved.
    # state/output: The Code Review Wall marks three contract claims VERIFIED and one NOT GUARANTEED.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   attest:
    #     checks: 2
    #     claims:
    #       - {id: c1, label: "input may be empty", evidence: "comment plus empty-input test", backed: true, critical: false}
    #       - {id: c2, label: "returned list preserves input order", evidence: "comment plus two order tests", backed: true, critical: false}
    #       - {id: c3, label: "method never changes the input list", evidence: "must be checked with a reference-preservation test", backed: false, critical: true}
    #       - {id: c4, label: "method always returns exactly three values", evidence: "must be checked with a four-value input", backed: false, critical: true}
    #     answer: [c3, c4]
    #     answerText: "Spend the two checks on the two unresolved critical claims. The reference test supports no input mutation; the four-value test disproves the fixed-size claim."
    attest:
      checks: 2
      claims:
        - id: c1
          label: input may be empty
          evidence: comment plus empty-input test
          backed: true
          critical: false
        - id: c2
          label: returned list preserves input order
          evidence: comment plus two order tests
          backed: true
          critical: true
        - id: c3
          label: method never changes the input list
          evidence: must be checked with a reference-preservation test
          backed: false
          critical: true
        - id: c4
          label: method always returns exactly three values
          evidence: must be checked with a four-value input
          backed: false
          critical: true
      answer:
        - c3
        - c4
      answerText: Spend the two checks on the two unresolved critical claims. The reference test supports no input mutation; the four-value test disproves the fixed-size claim.


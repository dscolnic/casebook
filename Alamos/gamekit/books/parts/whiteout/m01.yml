  stops:
  # --- Stop 1: Trace the controller
  #     Concept: 3 — Expressions, arithmetic, precedence, and output; Keystone: Data quality & representation, State & assignment; Area: POWER; Prerequisites: None — this is the first graded code trace.; Learning role: INTRODUCE; Difficulty: L2; Story role: clue.
  #     placement: CHOICE, Malik Okafor at the Load Board.
  - group: POWER
    at: load-board
    title: "Trace the controller"
    concept: 3   # Expressions, arithmetic, precedence, and output
    reason: "Malik needs the displayed percentage explained before he shuts down a generator that still sounds normal."
    scene: "Malik Okafor checks the evidence: the Load Board shows delivered = 83, requested = 100, and the alarm code delivered / requested * 100, while fuel flow and exhaust stay normal. Determine the integer expression's output to judge whether the red percentage reflects the generator."
    motivation: "If the arithmetic itself produces the alarm value, the physical generator should stay online while the software path is investigated."
    format: CHOICE
    question: "Read the three displayed lines, trace the expression exactly as Java evaluates it, and submit the stored value of percent."
    choices:
      - "0"
      - "83"
      - "100"
      - The code does not compile
    answer: "0"
    answerText: "Java performs 83 / 100 as integer division first, giving 0; 0 * 100 remains 0."
    why: "Equal-precedence multiplication and division are evaluated left to right, and both operands are integers."
    # wrong-path feedback, one rebuttal per wrong option:
    #   83 assumes the fractional 0.83 survives integer division. 100 treats requested power as the result rather than an operand. Compile error ignores that every token is valid Java.
    # correct result: percent stores 0.
    # state/output: The Load Board adds SOFTWARE VALUE = 0; PHYSICAL OUTPUT UNCHANGED beside the alarm.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in

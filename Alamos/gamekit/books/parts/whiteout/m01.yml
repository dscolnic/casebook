    # model conversion. Do not paste it in as it stands.
    #   question: "What value does Java store in percent?"
    #   code: |
    #     int delivered = 83;
    #     int requested = 100;
    #     int percent = delivered / requested * 100;
    #   choices:
    #     - "0"
    #     - "83"
    #     - "100"
    #     - "The code does not compile"
    #   answer: "0"
    #   why: "83 / 100 is integer division, so Java evaluates it as 0 before multiplying by 100."
    #   rebuttals:
    #     "83": "That would require multiplying before the integer division or converting first; Java evaluates left to right at the same precedence."
    #     "100": "No operation in this expression can turn 83 into the full requested amount."
    #     "The code does not compile": "All variables and operations are valid int operations, so the code compiles."
    rebuttals:
      - That would require multiplying before the integer division or converting first; Java evaluates left to right at the same precedence.
      - No operation in this expression can turn 83 into the full requested amount.
      - All variables and operations are valid int operations, so the code compiles.
    code: |
      int delivered = 83;
      int requested = 100;
      int percent = delivered / requested * 100;

  # --- Stop 2: Preserve the fraction
  #     Concept: 5 — Casting, integer division, numeric range, and overflow awareness; Keystone: Data quality & representation, State & assignment; Area: POWER; Prerequisites: Retrieves Stop 1's expression order immediately as practice, not delayed retrieval.; Learning role: PRACTICE; Difficulty: L2; Story role: obstacle.
  #     placement: DERIVE, Power & Thermal Plant — Load Board.
  - group: POWER
    at: load-board
    title: "Preserve the fraction"
    concept: 5   # Casting, integer division, numeric range, and overflow awareness
    reason: "Stop 1 proved the integer expression collapses before multiplication, so the crew needs a repair that preserves the 0.83 fraction."
    scene: "Malik Okafor checks the evidence: Stop 1 produced 0 even though 83 of 100 kilowatts are being delivered, proving the fraction disappears before the percentage is formed. Build the corrected expression so Java performs real-number division before the result is multiplied by 100."
    motivation: "A correct cast should predict 83.0 percent without changing any physical generator setting."
    format: DERIVE
    question: "Build the repaired calculation one line at a time; choose exactly one line at each step. Then select the replay result from the local givens."
    answerText: "Casting one operand before division changes the operation to floating-point division, so 83/100 becomes 0.83 and then 83.0 percent."
    why: "The cast must occur before the division; casting the already-truncated result cannot recover discarded information."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Leaving both operands as int recreates the zero from Stop 1. Casting fraction back to int discards 0.83 before the multiplication.
    # correct result: double fraction = (double) delivered / requested; then double percent = fraction * 100.0;, producing 83.0.
    # state/output: The Load Board displays a white PREDICTED 83.0% tag beside the unrepaired alarm code.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:
    #     start: "int delivered = 83; int requested = 100;"
    #     goal: "percent as a double, starting from integer inputs"
    #     steps:
    #       - id: cast
    #         prompt: "Choose the division that preserves the fraction."
    #         choices:
    #           - {line: "double fraction = (double) delivered / requested;", correct: true}
    #           - {line: "double fraction = (double) (delivered / requested);", correct: false, survives: true, why: "The parentheses force integer division first, so the fraction is already lost before the cast to double."}
    #       - id: percent
    #         prompt: "Choose the percentage expression."
    #         choices:
    #           - {line: "double percent = fraction * 100.0;", correct: true}
    #           - {line: "double percent = (int) fraction * 100.0;", correct: false, survives: true, why: "Casting fraction back to int discards its fractional part before multiplying and recreates the whole-number loss."}
    derive:
      start: "delivered = 83 kW; requested = 100 kW; both inputs are int. A percent is a fraction times 100; use double to retain a fraction. Source: int delivered = 83; int requested = 100;"
      goal: percent as a double, starting from integer inputs
      steps:
        - ask: Choose the division that preserves the fraction.
          answer: 0
          candidates:
            - text: double fraction = (double) delivered / requested;
            - text: double fraction = (double) (delivered / requested);
              why: The parentheses force integer division first, so the fraction is already lost before the cast to double.
              survives: true
        - ask: Choose the percentage expression.
          answer: 0
          candidates:
            - text: double percent = fraction * 100.0;
            - text: double percent = (int) fraction * 100.0;
              why: Casting fraction back to int discards its fractional part before multiplying and recreates the whole-number loss.
              survives: true
        - ask: Apply the selected rule to the given replay. Choose its evaluated result.
          answer: 0
          candidates:
            - text: (double) 83 / 100 = 0.83; 0.83 * 100.0 = 83.0 percent
            - text: (double) (83 / 100) = 0.0; 0.0 * 100.0 = 0.0 percent
              why: Casting after integer division preserves the already-truncated zero; cast an operand before division.
              survives: true

  # --- Stop 3: Store the repaired value
  #     Concept: 2 — Primitive variables and data types; Keystone: State & assignment; Area: POWER; Prerequisites: Uses the repaired numeric value from Stop 2.; Learning role: PRACTICE; Difficulty: L2; Story role: character.

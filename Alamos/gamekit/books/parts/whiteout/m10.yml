  # --- Stop 37: Estimate the search work
  #     Concept: 19 — Nested iteration and informal run-time reasoning; Keystone: Search & efficiency, Iteration; Area: COMMS; Prerequisites: Introduces search-efficiency reasoning after several loop-based algorithms.; Learning role: INTRODUCE; Difficulty: L3; Story role: clue.

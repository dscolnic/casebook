  - group: COMMS
    at: message-queue-board
    title: "Estimate the search work"
    concept: 19   # Nested iteration and informal run-time reasoning
    reason: "Liv needs a search strategy before the short satellite pass begins, and the table contains 1,024 sorted frequency records."
    scene: "A linear search may inspect all 1,024 records, while a halving search needs about one check per power of two in the table size. Estimate the maximum midpoint checks for binary search so the crew can compare the two methods before coding."
    motivation: "The rescue decision depends on choosing an algorithm whose work fits the time window, not merely one that eventually finds the record."
    format: BALLPARK
    question: "Use the displayed table size and power-of-two relationship to estimate the maximum binary-search midpoint checks; submit one number."
    answerText: "Because 1,024 = 2^10, ten halvings reduce the search interval to one candidate, so binary search needs about 10 midpoint checks."
    why: "Binary search cuts the remaining sorted interval in half after each comparison. The base-2 logarithm counts how many halvings are needed to reduce 1,024 possibilities to one."

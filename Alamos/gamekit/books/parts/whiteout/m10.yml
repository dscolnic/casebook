    at: message-queue-board
    title: "Choose the search"
    concept: 31   # Linear and binary search
    reason: "The estimate favors halving, but binary search is valid only if the rescue-frequency table is sorted by the same quantity being searched."
    scene: "The table is sorted ascending by frequency in megahertz, and the target record is 122.3 MHz. Choose the search method that can use that ordering without first rearranging the data during the satellite window."
    motivation: "The fastest-looking method is only correct when its prerequisite about data order is actually satisfied."
    format: CHOICE
    question: "Select the search method justified by the table's existing order."
    choices:
      - binary search
      - linear search only because binary search requires unsorted data
      - selection sort instead of searching
      - randomly sample records until 122.3 appears
    answer: binary search
    answerText: "Binary search compares the target with a midpoint and uses sorted order to eliminate the impossible half."
    why: "Algorithm prerequisites are part of correctness; efficiency does not excuse using a method on incompatible data."
    # wrong-path feedback, one rebuttal per wrong option:

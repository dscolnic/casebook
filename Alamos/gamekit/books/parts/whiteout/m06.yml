  stops:
  # --- Stop 21: Check the network path
  #     Concept: 37 — Networks, packets, protocols, redundancy, and cybersecurity; Keystone: Reliability & redundancy; Area: COMMS; Prerequisites: Introduces reliability and shared-dependency reasoning.; Learning role: INTRODUCE; Difficulty: L3; Story role: clue.
  #     placement: TRACE, Packet Monitor.
  - group: COMMS
    at: packet-monitor
    title: "Check the network path"
    concept: 37   # Networks, packets, protocols, redundancy, and cybersecurity
    reason: "Liv needs to know whether the apparent late message is already visible in the network path before software parsing is blamed."
    scene: "The rescue packet reaches the station through satellite hop S1 and router AR-2, while a local clock feed and rover radio use different upstream paths. Open all four dependencies and identify whether the delayed display shares a transport failure with the packet capture."
    motivation: "Independent path evidence can separate network transport delay from a later display or parsing error."
    format: TRACE
    question: "Open all four dependency paths and submit whether the evidence points to network transport or downstream parsing."
    choices:
    - "Antenna Router AR-2"
    - "Station timestamp parser"
    - "Local clock CLK-1"
    - "Rover radio clock VR-3"
    - "raw rescue packet"
    - "wall display message"
    - "local station clock"
    - "rover radio clock"
    answerText: "The raw packet and two independent clocks agree on 08:07, while only the parsed display loses a character."
    why: "Redundant independent observations can localize a fault by showing which dependency they do not share."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Network-delay diagnosis cannot explain a raw packet already stamped 08:07. Local and rover clocks are independent controls that agree with the packet.
    # correct result: The packet arrives at 08:07; the mismatch is downstream of transport.
    # state/output: The Packet Monitor marks TRANSPORT ON TIME / DISPLAY MISMATCH DOWNSTREAM.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   trace:
    #     resources:

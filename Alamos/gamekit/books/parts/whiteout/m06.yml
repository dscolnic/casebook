  - {name: "String", def: "an object that stores an ordered sequence of characters. substring: a String method that returns characters from a chosen start index up to, but not including, an end index."}
  primer:
  - "Network delivery and local parsing are separate stages."
  - "Java String indexes start at zero, and substring(start,end) excludes the end index."


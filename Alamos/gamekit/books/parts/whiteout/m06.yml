  # --- Stop 22: Read the timestamp String
  #     Concept: 10 — String objects and common String methods; Keystone: Data quality & representation; Area: COMMS; Prerequisites: Retrieves data representation after several missions by treating the timestamp as stored characters.; Learning role: PRACTICE; Difficulty: L2; Story role: obstacle.
  #     placement: CHOICE, Liv Andersen at the Message Queue Board.
  - group: COMMS
    at: message-queue-board
    title: "Read the timestamp String"
    concept: 10   # String objects and common String methods
    reason: "The packet is on time, so Liv needs the exact character positions of its timestamp before the parser can be traced."
    scene: "The captured text is 2026-09-08 08:07, and Java indexes its String characters from zero. Choose the character at index 15 so the crew can verify where the final minute digit sits relative to the current substring boundary."
    motivation: "Correct indexing of the raw String tells the team whether the parser is cutting data before it ever reaches the display."
    format: CHOICE
    question: "Count from index zero and submit the character stored at String index 15."
    choices:
      - "\"7\""
      - "\"0\""
      - "\":\""
      - "\"8\""
    answer: "\"7\""
    answerText: "Java String indexes start at zero, so the final character of 08:07 is index 15 in the full timestamp."
    why: "String methods use exact character indexes, making off-by-one boundaries visible and testable."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Each distractor is a nearby character but not index 15.
    # correct result: Index 15 contains 7.
    # state/output: Liv marks index 15 above the final 7 on the Message Queue Board.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   question: "What character is at index 15 in \"2026-09-08 08:07\"?"
    #   choices:
    #     - "\"7\""
    #     - "\"0\""
    #     - "\":\""
    #     - "\"8\""
    #   answer: "\"7\""
    #   why: "Indexes 11–15 are 0,8,:,0,7, so index 15 is the final minute digit 7."
    #   rebuttals:
    #     "\"0\"": "The second minute tens digit is at index 14."
    #     "\":\"": "The colon is at index 13."
    #     "\"8\"": "The hour ones digit is at index 12."
    rebuttals:
      - The second minute tens digit is at index 14.
      - The hour ones digit is at index 12.

  # --- Stop 23: Trace the substring
  #     Concept: 18 — String traversal and string algorithms; Keystone: Data quality & representation, Methods & abstraction; Area: CODE; Prerequisites: Combines String indexing from Stop 22 with a library method.; Learning role: COMBINE; Difficulty: L3; Story role: reveal.
  #     placement: DERIVE, Software Lab — Code Review Wall.
  - group: CODE
    at: code-review-wall
    title: "Trace the substring"
    concept: 18   # String traversal and string algorithms
    reason: "Stop 22 placed the final minute digit at index 15, so the current substring must include that character to display the full time."
    scene: "The parser currently calls timestamp.substring(11, 15), which includes index 11 but stops before index 15. Build the correct call and resulting String so the packet's 08:07 value survives the parser unchanged."
    motivation: "The display can only show the correct minute if the method's exclusive end index extends one position beyond the final character needed."
    format: DERIVE
    question: "Choose the substring call and the exact String it returns."
    answerText: "Java includes the start index and excludes the end index, so end 16 is required to include character 15."
    why: "String traversal and slicing depend on index boundaries, and an exclusive endpoint is a common source of off-by-one bugs."
    # wrong-path feedback, one rebuttal per wrong option:
    #   End 15 reproduces the truncated display. 08:0 is the old parser result and omits index 15.
    # correct result: substring(11,16) returns "08:07".
    # state/output: The Code Review Wall replaces substring(11,15) with substring(11,16).
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:
    #     start: "String timestamp = \"2026-09-08 08:07\";"
    #     goal: "extract the five-character HH:MM field"
    #     steps:
    #       - id: end
    #         prompt: "Choose the substring call."
    #         choices:
    #           - {line: "timestamp.substring(11, 16)", correct: true}
    #           - {line: "timestamp.substring(11, 15)", correct: false, survives: true, why: "Java excludes the end index, so ending at 15 omits the final minute digit and returns only four characters."}
    #       - id: result
    #         prompt: "Choose the returned String."
    #         choices:
    #           - {line: "\"08:07\"", correct: true}
    #           - {line: "\"08:0\" — end index 15 excludes index 15", correct: false, survives: true, why: "That truncated String is the old buggy output; it cannot be the result of the repaired call ending at 16."}
    derive:
      start: String timestamp = "2026-09-08 08:07";
      goal: extract the five-character HH:MM field
      steps:
        - ask: Choose the substring call.
          answer: 0
          candidates:
            - text: timestamp.substring(11, 16)
            - text: timestamp.substring(11, 15)
              why: Java excludes the end index, so ending at 15 omits the final minute digit and returns only four characters.
              survives: true
        - ask: Choose the returned String.
          answer: 0
          candidates:
            - text: "\"08:07\""
            - text: "\"08:0\" — end index 15 excludes index 15"
              why: That truncated String is the old buggy output; it cannot be the result of the repaired call ending at 16.
              survives: true


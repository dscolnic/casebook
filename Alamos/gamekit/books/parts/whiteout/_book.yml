roster:
- id: park
  name: "Elena Park"
  role: "Station director"
  division: OPS
  pronouns: "she/her"
  bio: |
    Elena Park is Station director. Wants keep 28 people alive and preserve the evacuation option. She initially favors the fastest reversible action when evidence is incomplete. Moves from fast reversible action to requiring committed predictions and a staged canary release. Says, "What can we safely decide now?"
- id: okafor
  name: "Malik Okafor"
  role: "Power and thermal engineer"
  division: POWER
  pronouns: "he/him"
  bio: |
    Malik Okafor is Power and thermal engineer. Wants keep heat and power above survival limits. He initially trusts physical symptoms more than software traces. Learns to treat code traces as physical evidence when independent readings support them. Says, "What changed before the load moved?"
- id: nair
  name: "Priya Nair"
  role: "Software architect"
  division: CODE
  pronouns: "she/her"
  bio: |
    Priya Nair is Software architect. Wants restore reliable control without creating a second hidden failure. She initially trusts clean interfaces more than old integration code deserves. Moves from interface trust to adversarial testing across legacy boundaries. Says, "Which assumption does this method hide?"
- id: reyes
  name: "Jonah Reyes"
  role: "Field robotics lead"
  division: VEH
  pronouns: "he/him"
  bio: |
    Jonah Reyes is Field robotics lead. Wants keep autonomous vehicles available for rescue and external repairs. He initially treats intermittent behavior as damaged hardware. Shifts from replacing hardware to demanding repeatable software failure before touching parts. Says, "Can you make it fail twice the same way?"
- id: andersen
  name: "Liv Andersen"
  role: "Communications and weather lead"
  division: COMMS
  pronouns: "she/her"
  bio: |
    Liv Andersen is Communications and weather lead. Wants hold a satellite path and identify a safe rescue window. She can overvalue a fast primary path unless independence is tested. Broadens redundancy from networking into whole-system release design. Says, "Which path still works if this one disappears?"
- id: alvarez
  name: "Mei Alvarez"
  role: "Habitat systems lead"
  division: HAB
  pronouns: "she/her"
  bio: |
    Mei Alvarez is Habitat systems lead. Wants keep air and water stable while controllers are isolated. She initially trusts agreement among sensors without asking what they share upstream. Learns that sensor agreement is not independence when software is shared upstream. Says, "Do these instruments agree because reality agrees, or because they share code?"


glossary:
  - name: Accumulation
    aliases:
      - accumulate
      - accumulates
      - accumulated
    def: How much snow is added to the surface in a year, after wind and sublimation have had their say.
  - name: Ice equivalent
    aliases:
      - water equivalent
    def: A snow thickness converted to the thickness of solid ice it will become, so two sites can be compared.
  - name: Annual layer
    aliases:
      - annual layers
      - layer counting
      - layer count
    def: One year of snowfall, recognisable in the core because summer and winter snow differ.
  - name: Ice
    def: Snow compressed until the air between its grains is sealed off, at about 917 kilograms per cubic metre.
  - name: Calibration
    aliases:
      - calibrate
      - calibrated
      - calibration slope
    def: Measuring an instrument or a relationship against something already known, so its numbers can be trusted.
  - name: Firn
    aliases:
      - firn column
    def: The layer of snow between the surface and solid ice, still open enough for air to move through it.
  - name: Close-off depth
    aliases:
      - close-off
      - closes off
      - closed off
    def: The depth where firn stops letting air through, 60 to 100 metres down, and the trapped air becomes separate bubbles.
  - name: Delta age
    aliases:
      - Δage
      - gas age
      - ice age difference
    def: The difference between the age of a bubble's air and the age of the ice around it, because the air kept moving until close-off.
  - name: Precipitation
    aliases:
      - precipitates
      - precipitated
    def: Snow or rain falling out of the air onto the surface. On this plateau it is almost always snow.
  - name: Proxy
    aliases:
      - proxies
    def: Something measurable that stands in for something that was not measured, through a chain somebody has to be able to state.
  - name: Isotope ratio
    aliases:
      - delta-18
      - oxygen-18
      - deuterium
      - isotopic
    def: How much heavy oxygen or hydrogen the ice holds compared with ocean water, reported as a difference in parts per thousand.
  - name: Thinning
    aliases:
      - thinned
      - thins
    def: The stretching of every layer as the ice sheet spreads under its own weight, so old layers are thinner than they fell.
  - name: Depth-age scale
    aliases:
      - depth–age
      - age scale
      - timescale
    def: The table that turns a depth in the core into a year, built by counting layers and anchored to dated events.
  - name: Tie point
    aliases:
      - tie points
      - tied to
    def: An event of known date found in two records, which fixes them to each other at that moment.
  - name: Sulphate horizon
    aliases:
      - sulphate
      - sulfate
      - volcanic horizon
    def: A thin band of volcanic sulphur in the ice, laid down within a year or two of a known eruption.
  - name: Tephra
    aliases:
      - ash layer
    def: Volcanic glass shards in the ice, which can be chemically matched to the volcano that produced them.
  - name: Diffusion length
    aliases:
      - diffusion
      - diffuses
    def: How far a water molecule wanders in the firn before the ice seals, which smooths away anything thinner than about twice that distance.
  - name: Brittle ice
    aliases:
      - brittle zone
    def: The depth range where trapped bubbles are at high pressure and the core fractures as it is brought up.
  - name: Blank
    aliases:
      - blank run
      - blanks
    def: A run with no sample in it. Anything it shows was added by the process rather than measured from the ice.
  - name: Chain of custody
    aliases:
      - custody
    def: The unbroken written record of who held a sample and when, which is what makes a measurement attributable to a depth.
  - name: Radiative forcing
    aliases:
      - forcing
    def: The change in the energy balance at the top of the atmosphere caused by a change in a greenhouse gas, in watts per square metre.
  - name: Standard error
    aliases:
      - standard errors
    def: How far an average is expected to sit from the truth, given the scatter in the data and how many years went into it.
  - name: Replicate core
    aliases:
      - replicate
      - replicates
    def: A second core drilled nearby, so a feature can be checked against ice that shared the weather but not the drill.

# The campaign: one working day each, three stops and a callback from day 3.

missions:
# <<< MISSIONS >>>

interiors:
  OPS:
    caption: Station command, incident coordination, rescue decisions, and the wall-size systems map live here.
    standLine: Six incidents open, none closed. Rescue window in 36 hours, aircraft not yet committed.
    station:
      kind: panel
      title: Station status
      rows:
        - label: People on station
          value: "28"
          status: normal
        - label: Rescue window
          value: "36 h"
          status: normal
        - label: Open incidents
          value: "6"
          status: alarm
        - label: Verified control paths
          value: "0 of 6"
          status: alarm
  CODE:
    caption: The station's source mirror, test harnesses, build tools, and safe simulations live here.
    standLine: Live patching frozen. Nothing goes to a controller that has not been run against the mirror first.
    station:
      kind: panel
      title: Build and mirror
      rows:
        - label: Mirror in step with live
          value: "yes"
          status: normal
        - label: Builds since the storm
          value: "4"
          status: normal
        - label: Tests run against them
          value: "0"
          status: alarm
        - label: Patches applied live
          value: "3"
          status: alarm
  POWER:
    caption: Generators, batteries, heat loops, and the controllers that keep the station warm live here.
    standLine: The generator is running and the board says it is not. Nobody has shut it down yet.
    station:
      kind: panel
      title: Generator and load
      rows:
        - label: Delivered power
          value: "83 kW"
          status: normal
        - label: Requested power
          value: "100 kW"
          status: normal
        - label: Controller reports
          value: "0 %"
          status: alarm
        - label: Battery reserve
          value: "68 %"
          status: normal
  HAB:
    caption: Air handling, scrubbers, room sensors, water, and life-support automation live here.
    standLine: One sensor reading, two shutdown orders. The scrubber is off and the air is still good.
    station:
      kind: panel
      title: Habitat and air
      rows:
        - label: Occupied rooms
          value: "11"
          status: normal
        - label: Scrubbers running
          value: "1 of 2"
          status: alarm
        - label: Shutdown orders today
          value: "2"
          status: alarm
        - label: Habitat stability
          value: "72 %"
          status: normal
  VEH:
    caption: Rovers, drones, chargers, route maps, and the software that moves field machines live here.
    standLine: Rover Three has driven the same lap eleven times. The wheels are fine.
    station:
      kind: panel
      title: Vehicles and routes
      rows:
        - label: Rovers available
          value: "2 of 3"
          status: normal
        - label: Laps completed
          value: "0"
          status: alarm
        - label: Same lap repeated
          value: "11"
          status: alarm
        - label: Charge on the bay
          value: "4 of 6"
          status: normal
  COMMS:
    caption: Satellite links, packet routing, weather instruments, and rescue-window traffic live here.
    standLine: The packet says 08:07 and the wall display says 08:0. One of them is missing a character.
    station:
      kind: panel
      title: Link and weather
      rows:
        - label: Next satellite pass
          value: "00:41"
          status: normal
        - label: Burst length
          value: "10 s"
          status: normal
        - label: Visibility
          value: "under 20 m"
          status: alarm
        - label: Rescue readiness
          value: "48 %"
          status: alarm
copy:
  OPS: "<p>The operations module: the systems map across the end wall, the incident console under it, and the rescue board nobody has been able to fill in yet.</p>"
  CODE: "<p>The software lab. The station’s source on glass, a bench to run a suite on, and a rack of every build the station has ever run.</p>"
  POWER: "<p>The power and thermal plant: generators behind the wall, batteries along it, and a load board saying what is being asked for and what is arriving.</p>"
  HAB: "<p>Habitat control, where the air is. A tile per occupied room, two scrubbers, and a cabinet of every alarm the habitat is allowed to raise.</p>"
  VEH: "<p>The vehicle bay, big enough to drive out of. Rovers on the floor, drones on their sides, and the route the software thinks it is driving on the board.</p>"
  COMMS: "<p>Communications and weather, out under the mast. The pass counted down to the second, the raw traffic before anything has formatted it, and the wind.</p>"

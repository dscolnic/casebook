    stress:
      candidates:
        - id: forward_removal
          label: Forward removal
        - id: hold_index
          label: Hold index
        - id: backward_removal
          label: Backward removal
      criteria:
        - key: correctness
          label: Removes every resolved record
        - key: efficiency
          label: Uses no more than 12 inspections
      scores:
        forward_removal:
          correctness: 1
          efficiency: 1
        hold_index:
          correctness: 1
          efficiency: 0.8
        backward_removal:
          correctness: 1
          efficiency: 0.9
      feasible:
        forward_removal: 1
        hold_index: 3
        backward_removal: 4
      assumption:
        label: maximum adjacent resolved run
        unit: records
        min: 1
        max: 4
        nominal: 1
        step: 1
      robust: backward_removal

  # --- Stop 55: Audit the rollback pattern
  #     Concept: 29 — ArrayList methods, traversals, mutation, and algorithms; Keystone: Collections & indexing, Debugging & tests; Area: POWER; Prerequisites: Transfers ArrayList mutation reasoning from Mission 8 after six intervening missions.; Learning role: TRANSFER; Difficulty: L5; Story role: reveal.
  #     placement: RESIDUAL, Generator Controller.
  - group: POWER
    at: generator-controller
    title: "Audit the rollback pattern"
    concept: 29   # ArrayList methods, traversals, mutation, and algorithms
    reason: "The stress test rejects forward removal, but the crew still needs to know whether today's failure is the old skip mechanism or a new defect."
    scene: "Eight controller records have restore-time residuals in milliseconds after rollback. Compare the lower-RMS forward routine's alternating residual pattern with the slightly higher-RMS backward routine's unstructured jitter, then decide which implementation the pattern forces the crew to reject."
    motivation: "A systematic residual pattern can identify a wrong mechanism even when its aggregate error score looks slightly better."
    format: RESIDUAL
    question: "Compare both residual fields and submit which rollback implementation must be rejected despite its lower RMS."
    answerText: "The forward residuals alternate exactly between 0 and +1 ms by record index, reproducing the every-second-record structure of the Mission 8 skip bug; backward residuals fluctuate around zero without ordered structure."
    why: "Residual structure can reject a model or algorithm that an aggregate score alone would incorrectly favor."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Choosing backward solely because 0.711 is larger ignores that RMS is not the only diagnostic criterion here. Calling the forward pattern random ignores four repeated +1 residuals on alternating indexes.
    # correct result: Reject forward_remove.
    # state/output: The Load Board pins Mission 8's A C D F survivor pattern beside the alternating rollback residuals.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   residual:
    #     axis: {quantity: "controller record index", unit: "index"}
    #     fits:
    #       - id: forward_remove
    #         error: 0.707
    #         structured: true
    #         points:
    #           - {x: 0, residual: 0.0}
    #           - {x: 1, residual: 1.0}
    #           - {x: 2, residual: 0.0}
    #           - {x: 3, residual: 1.0}
    #           - {x: 4, residual: 0.0}
    #           - {x: 5, residual: 1.0}
    #           - {x: 6, residual: 0.0}
    #           - {x: 7, residual: 1.0}
    #       - id: backward_remove
    #         error: 0.711
    #         structured: false
    #         points:
    #           - {x: 0, residual: 0.6}
    #           - {x: 1, residual: -0.8}
    #           - {x: 2, residual: 0.5}
    #           - {x: 3, residual: -0.7}
    #           - {x: 4, residual: 0.9}
    #           - {x: 5, residual: -0.6}
    #           - {x: 6, residual: 0.8}
    #           - {x: 7, residual: -0.7}
    #     conclusion: "Reject forward_remove despite lower RMS because every second record shows the same one-sided restore residual."
    #     answerText: "Forward removal has the slightly lower RMS but a repeating every-second-record pattern; backward removal has slightly larger unstructured jitter and no systematic skip signature."
    residual:
      fits:
        - id: forward_remove
          label: Forward removal routine
          rms: 0.707
          structured: true
          residuals:
            - x: 0
              y: 0
              value: 0
            - x: 1
              y: 0
              value: 1
            - x: 2
              y: 0
              value: 0
            - x: 3
              y: 0
              value: 1
            - x: 4
              y: 0
              value: 0
            - x: 5
              y: 0
              value: 1
            - x: 6
              y: 0
              value: 0
            - x: 7
              y: 0
              value: 1
        - id: backward_remove
          label: Backward removal routine
          rms: 0.711
          residuals:
            - x: 0
              y: 0
              value: 0.6
            - x: 1
              y: 0
              value: -0.8
            - x: 2
              y: 0
              value: 0.5
            - x: 3
              y: 0
              value: -0.7
            - x: 4
              y: 0
              value: 0.9
            - x: 5
              y: 0
              value: -0.6
            - x: 6
              y: 0
              value: 0.8
            - x: 7
              y: 0
              value: -0.7
      accept: backward_remove
      hint: A lower RMS is not enough if the residuals repeat a structured every-other-record pattern.

  # --- Stop 56: Decide whether green means safe
  #     Concept: 20 — Abstraction and program design; Keystone: Debugging & tests, Boolean logic, Data quality & representation; Area: OPS; Prerequisites: Transfers testing and Boolean decision logic into a station-level diagnosis.; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: DIAGNOSIS, Operations Module — Incident Analysis Board.
  - group: OPS
    at: incident-analysis-board
    title: "Decide whether green means safe"
    concept: 20   # Abstraction and program design
    reason: "The holdout, stress, and residual tests all challenge ALL GREEN, but Park needs a station-level diagnosis that also respects the quiet live systems."
    scene: "Heat, air, rover, and rescue link remain inside verified limits now, while forward rollback fails unseen adjacency cases and reproduces the alternating skip signature. Diagnose what the green dashboard actually proves about current state and future recovery."
    motivation: "The right diagnosis must explain both the quiet live controls and the failed recovery path without inventing a simultaneous hardware cascade."
    format: DIAGNOSIS
    question: "Read all four zones and submit the one diagnosis that fits both the current live state and the failed rollback evidence."
    choices:
      - Live stable; recovery unverified
      - A new simultaneous hardware failure is underway
      - Green dashboards prove the whole recovery path is safe
      - Packet loss caused the rollback failures
    answerText: "The current physical systems pass independent checks, yet the recovery algorithm fails unseen and stressed inputs."
    why: "Abstraction and verification distinguish present-state success from the behavior of a different path that may run during failure."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Simultaneous hardware failure contradicts quiet controls. Safe recovery contradicts 0/5 holdout results. Network cause contradicts local rollback reproduction.
    # correct result: Live systems are stable now, but recovery is unverified; revoke ALL GREEN.
    # state/output: The Incident Console changes ALL GREEN to LIVE STABLE / RECOVERY UNVERIFIED in text and icon form.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   headline: What does ALL GREEN actually prove?
    #   readings:
    #   - zone: LIVE SYSTEMS
    #     label: heat / air / rover / link
    #     value: currently within verified limits
    #   - zone: HOLDOUT
    #     label: forward rollback unseen cases
    #     value: 0/5 exact
    #   - zone: STRESS
    #     label: forward rollback at adjacency 2–4
    #     value: fails
    #   - zone: QUIET CONTROL
    #     label: backward rollback
    #     value: 5/5 and robust
    #   choices:
    #   - id: false_green
    #     label: Live systems are stable now, but recovery is unverified
    #     mechanism: Fits quiet live readings and failed forward rollback.
    #   - id: hardware
    #     label: A new simultaneous hardware failure is underway
    #     mechanism: Contradicted by quiet independent live readings.
    #   - id: safe
    #     label: Green dashboards prove the whole recovery path is safe
    #     mechanism: Contradicted by 0/5 holdout forward rollback.
    #   - id: network
    #     label: Packet loss caused the rollback failures
    #     mechanism: Rollback fails locally without network use.
    #   answer: false_green
    readings:
      - zone: LIVE SYSTEMS
        label: heat / air / rover / link
        value: currently within verified limits
        status: normal
      - zone: HELD-OUT TEST
        label: forward rollback unseen cases
        value: 0/5 exact
        status: alarm
      - zone: STRESS
        label: forward rollback at adjacency 2–4
        value: fails
        status: alarm
      - zone: QUIET CONTROL
        label: backward rollback
        value: 5/5 and robust
        status: normal
    headline: What does ALL GREEN actually prove?
    answer: Live stable; recovery unverified
    rebuttals:
      - The live heat, air, rover, and link checks are normal, so a new simultaneous hardware cascade does not fit the quiet controls.
      - Forward rollback scores 0/5 on unseen adjacency cases, so green live dashboards do not certify the recovery path.
      - The rollback failure reproduces locally without network transport, so packet loss cannot be its cause.


  # --- Stop 54: Stress the adjacency assumption
  #     Concept: 17 — Selection-and-iteration algorithms: count, sum, min/max, search; Keystone: Iteration, Debugging & tests; Area: POWER; Prerequisites: Transfers delayed iteration reasoning from Mission 3 into an adversarial boundary test.; Learning role: TRANSFER; Difficulty: L4; Story role: obstacle.
  #     placement: STRESS, Malik Okafor at the Load Board.
  - group: POWER
    at: load-board
    title: "Stress the adjacency assumption"
    concept: 17   # Selection-and-iteration algorithms: count, sum, min/max, search
    reason: "The holdout failure appears only when resolved records are adjacent, so Malik needs the rollback algorithm that remains safe as adjacent runs become longer."
    scene: "The holdout failure appears only when resolved records are adjacent, so Malik now has the hidden stress variable. Move the maximum adjacent run from one through four and compare three rollback strategies against zero skipped records and a twelve-inspection limit."
    motivation: "A robust algorithm must survive the plausible input range and every required criterion, not merely the nominal case that made the dashboard green."
    format: STRESS
    question: "Move the adjacent-run assumption from 1 through 4 and submit the one rollback strategy that meets both criteria everywhere."
    answerText: "Forward removal stops being feasible at adjacent run 2, hold-index reaches its limit at 3, and backward removal survives through run 4."
    why: "STRESS asks how far each candidate survives as the hard assumption worsens. A candidate that looks efficient at the nominal case is rejected when the slider passes its explicit feasibility limit."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Forward removal fails at run length 2 and above. Hold-index remains correct but reaches 15 inspections at run length 4.
    # correct result: Backward removal.
    # state/output: The Load Board marks forward removal failed and leaves BACKWARD ROLLBACK as the only strategy that meets both stress criteria.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   stress:
    #     assumption: {label: "maximum adjacent resolved run", unit: "records", min: 1, max: 4, nominal: 1, step: 1}
    #     criteria:
    #       - {name: "Removes every resolved record", key: "correctness"}
    #       - {name: "Uses no more than 12 inspections at run length 4", key: "efficiency"}
    #     optimiseOn: "survive both criteria over run lengths 1 through 4"
    #     candidates:
    #       - name: "Forward removal"
    #         scores: {correctness: 0.0, efficiency: 1.0}
    #         values: [{at: 1, ok: true, inspections: 8},{at: 2, ok: false, inspections: 8},{at: 3, ok: false, inspections: 8},{at: 4, ok: false, inspections: 8}]
    #       - name: "Hold index"
    #         scores: {correctness: 1.0, efficiency: 0.0}
    #         values: [{at: 1, ok: true, inspections: 8},{at: 2, ok: true, inspections: 10},{at: 3, ok: true, inspections: 12},{at: 4, ok: true, inspections: 15}]
    #       - name: "Backward removal"

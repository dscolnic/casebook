  stops:
  # --- Stop 17: Inspect object state
  #     Concept: 21 — Class anatomy: fields, encapsulation, and object state; Keystone: Object state & references, State & assignment; Area: CODE; Prerequisites: Delayed retrieval of state/assignment from Mission 1 in an object context.; Learning role: INTRODUCE; Difficulty: L3; Story role: clue.
  #     placement: CASEBOOK, Priya Nair beside the Version Rack.
  - group: CODE
    at: version-rack
    title: "Inspect object state"
    concept: 21   # Class anatomy: fields, encapsulation, and object state
    reason: "Priya needs to know why a patch changes the simulator but leaves live controller P02 untouched."
    scene: "Priya Nair checks: the software mirror shows simulator controller C17 and live controller P02 with the same class and similar limits, yet only C17 changes after the patch. Match each evidence row to the interpretation that distinguishes object identity from merely matching field values."
    motivation: "Two objects can look alike while storing separate state, so the patch target must be identified by reference rather than appearance."
    format: CASEBOOK
    question: "Match each evidence row to the interpretation it supports, then submit whether C17 and P02 are the same object."
    choices:
      - C17 received the patch
      - P02 did not receive the patched state
      - The references identify different objects
      - Same class does not mean same object
    answerText: "Their identifiers and field states diverge, and the identity comparison is false even though both objects use the same class."
    why: "Object state belongs to each instance unless state is explicitly shared."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Treating same class as same object confuses type with identity. Ignoring the unchanged P02 field misses the live-state evidence.
    # correct result: C17 and P02 are different objects; only C17 received the patch.
    # state/output: The Version Rack labels C17 SIMULATION OBJECT and P02 LIVE OBJECT.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   scenarios:
    #     - {id: c17_after_patch, label: "C17 after patch", reading: "id C17; limit 90"}
    #     - {id: p02_after_patch, label: "P02 after patch", reading: "id P02; limit 70"}
    #     - {id: identity_test, label: "Identity comparison", reading: "C17 == P02 is false"}
    #     - {id: class_test, label: "Class comparison", reading: "both are PowerController objects"}
    #   choices:
    #     - {id: patch_landed_c17, label: "C17 received the patch"}
    #     - {id: p02_unchanged, label: "P02 did not receive the patched state"}
    #     - {id: different_objects, label: "The references identify different objects"}
    #     - {id: same_class_only, label: "Same class does not mean same object"}
    #   mapping: {c17_after_patch: patch_landed_c17, p02_after_patch: p02_unchanged, identity_test: different_objects, class_test: same_class_only}
    scenarios:
      - C17 after patch — id C17; limit 90
      - P02 after patch — id P02; limit 70
      - Identity comparison — C17 == P02 is false
      - Class comparison — both are PowerController objects
    mapping:
      - 0
      - 1
      - 2
      - 3

  # --- Stop 18: Check initialization
  #     Concept: 22 — Constructors and initialization; Keystone: Object state & references, Methods & abstraction; Area: CODE; Prerequisites: Builds on object identity from Stop 17.; Learning role: PRACTICE; Difficulty: L3; Story role: obstacle.
  #     placement: DERIVE, Software Lab — Code Review Wall.
  - group: CODE
    at: code-review-wall
    title: "Check initialization"
    concept: 22   # Constructors and initialization
    reason: "Stop 17 proved the patch reached C17, so the team must verify how the live P02 object was constructed before following references further."
    scene: "Priya Nair checks the evidence: P02 should start with identifier P02 and a 70 percent safety limit, but one constructor call swaps the arguments. Build the constructor and call that produce the displayed live state without silently changing which value belongs to which field."
    motivation: "A reference trace is only useful after the object itself has been initialized with the state the crew thinks it has."
    format: DERIVE
    question: "Choose the constructor assignments and the call that create P02 with identifier P02 and limit 70. Then select the replay result from the local givens."
    answerText: "The constructor copies each parameter into the corresponding instance field, producing the intended live state."
    why: "Constructors establish initial object state; this distinguishes the object's field from a parameter with the same name."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Hard-coding a later patched value hides the initialization contract. Swapping text and numeric meaning corrupts both fields.
    # correct result: this.id = id; this.limit = limit; and new PowerController("P02", 70);.
    # state/output: The Code Review Wall shows P02 construction VERIFIED with id=P02, limit=70.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:
    #     start: "class PowerController { String id; int limit; PowerController(String id, int limit) { ... } }"
    #     goal: "initialize an object from supplied constructor arguments"
    #     steps:
    #       - id: constructor
    #         prompt: "Choose the constructor body."
    #         choices:
    #           - {line: "this.id = id; this.limit = limit;", correct: true}
    #           - {line: "this.id = \"P02\"; this.limit = 90;", correct: false, survives: true, why: "Hard-coding values ignores the arguments, so every constructed object would receive the same identity and limit."}
    #       - id: call
    #         prompt: "Choose the object construction."
    #         choices:
    #           - {line: "new PowerController(\"P02\", 70);", correct: true}
    #           - {line: "new PowerController(\"70\", 70 + 0);", correct: false, survives: true, why: "The first argument is the object ID, so passing \"70\" creates the wrong identity even though the numeric limit is 70."}
    derive:
      start: "Construct live object P02 with limit 70. Constructor arguments are String id and int limit, in that order. The tempting hard-coded body uses P02 and 90; it must also work for other arguments. Source: class PowerController { String id; int limit; PowerController(String id, int limit) { ... } }"
      goal: initialize an object from supplied constructor arguments
      steps:
        - ask: Choose the constructor body.
          answer: 0
          candidates:
            - text: this.id = id; this.limit = limit;
            - text: this.id = "P02"; this.limit = 90;
              why: Hard-coding values ignores the arguments, so every constructed object would receive the same identity and limit.
              survives: true
        - ask: Choose the object construction.
          answer: 0
          candidates:
            - text: new PowerController("P02", 70);
            - text: new PowerController("70", 70 + 0);
              why: The first argument is the object ID, so passing "70" creates the wrong identity even though the numeric limit is 70.
              survives: true
        - ask: Apply the selected rule to the given replay. Choose its evaluated result.
          answer: 0
          candidates:
            - text: new PowerController("P02", 70) stores id="P02" and limit=70
            - text: new PowerController("P02", 70) stores id="P02" and limit=90
              why: The constructor must use the supplied limit 70, not the tempting hard-coded 90.
              survives: true

  # --- Stop 19: Follow the live reference
  #     Concept: 24 — Passing and returning object references; Keystone: Object state & references, Methods & abstraction; Area: CODE; Prerequisites: Combines object identity and constructor state from Stops 17–18.; Learning role: COMBINE; Difficulty: L4; Story role: reveal.
  #     placement: TRACE, Build Console.
  - group: CODE
    at: build-console
    title: "Follow the live reference"
    concept: 24   # Passing and returning object references
    reason: "P02 is constructed correctly, so the remaining question is which references flow into the patch method."
    scene: "Priya Nair checks the evidence: the build graph shows four channels named sim, live, active, and backup; two eventually reach C17 while one reaches P02 and one reaches B04. Open each dependency and identify which argument must be passed to patch the live controller."
    motivation: "The patch only changes the physical station if the method receives a reference to P02 rather than a simulation or backup object."
    format: TRACE
    question: "Open all four reference paths, identify the two aliases that reach C17, and submit the reference that reaches P02."
    choices:
    - "Reference currently passed to applyPatch"
    - "Direct reference to live controller P02"
    - "Direct reference to backup controller B04"
    - "sim reference"
    - "active reference"
    - "live reference"
    - "backup reference"
    answerText: "The patch method receives an object reference, so aliases to C17 modify the same simulation object while live is the distinct reference to P02."
    why: "Passing an object reference lets a method operate on the referenced object's state; aliasing means two variables can point to one object."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Choosing active follows an alias to C17. Choosing backup reaches B04, not P02.
    # correct result: sim and active both reach C17; live reaches P02.
    # state/output: The Build Console draws live → P02 as the only approved patch path.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   trace:
    #     resources:
    #       - {id: active_ref, label: "Reference currently passed to applyPatch"}
    #       - {id: live_ref, label: "Direct reference to live controller P02"}
    #       - {id: backup_ref, label: "Direct reference to backup controller B04"}
    #     target: active_ref
    #     shared_resource: "Reference currently passed to applyPatch"
    #     channels:
    #       - {id: sim, label: "sim reference", reading: "C17", depends: [active_ref], depends_on_shared: true}
    #       - {id: active, label: "active reference", reading: "C17", depends: [active_ref], depends_on_shared: true}
    #       - {id: live, label: "live reference", reading: "P02", depends: [live_ref], depends_on_shared: false}
    #       - {id: backup, label: "backup reference", reading: "B04", depends: [backup_ref], depends_on_shared: false}
    #     independent: [live, backup]
    #     commit: "Name the shared reference that makes sim and active agree, then identify which reference reaches P02."
    #     correctConclusion: "sim and active share active_ref and both point to C17; live_ref is the independent path that reaches P02."
    trace:
      channels:
        - id: sim
          label: sim reference
          reading: C17
          depends:
            - active_ref
        - id: active
          label: active reference
          reading: C17
          depends:
            - active_ref
        - id: live
          label: live reference
          reading: P02
          depends:
            - live_ref
        - id: backup
          label: backup reference
          reading: B04
          depends:
            - backup_ref
      resources:
        - id: active_ref
          label: Reference currently passed to applyPatch
        - id: live_ref
          label: Direct reference to live controller P02
        - id: backup_ref
          label: Direct reference to backup controller B04
      independent:
        - live
        - backup
      target: active_ref

  # --- Stop 20: Patch the live controller
  #     Concept: 4 — Assignment, input, and reassignment; Keystone: Object state & references, Debugging & tests; Area: POWER; Prerequisites: Combines object state, constructor, references, and instance methods.; Learning role: COMBINE; Difficulty: L4; Story role: decision.
  #     placement: VERIFY, Generator Controller.
  - group: POWER
    at: generator-controller
    title: "Patch the live controller"
    concept: 4   # Assignment, input, and reassignment
    reason: "The live reference is now known, but Malik will not accept the patch until the method's effect on P02 is predicted before operation."
    scene: "Malik Okafor checks the evidence: P02 starts with limit 70 while C17 already holds 90, and applyPatch(live) calls setLimit(90) on the object referenced by live. Commit P02's final limit before the isolated patch reveals which live object changed."
    motivation: "A method call through the correct reference should change P02 while leaving the simulator object's state independent."
    format: VERIFY
    question: "PREDICT AND COMMIT: dial P02's final limit. OPERATE: run the isolated patch through live. MEASURE: reveal P02's limit after the call. INTERPRET: compare it with C17's unchanged state and submit ACCEPT or REJECT."
    answerText: "Calling an instance method through live sends the message to P02, changing that object's field without copying or replacing C17."
    why: "Instance methods operate on the receiver object's state, represented by this inside the method."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Predicting P02=70 ignores the verified reference path. Predicting C17 changes because of this call confuses existing equal values with shared identity. REJECT contradicts all three committed measurements.
    # correct result: P02=90; C17 remains 90; ACCEPT.
    # state/output: The Generator Controller displays P02 PATCHED VIA LIVE REFERENCE; C17 remains explicitly labeled simulation.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   verify:
    #     prediction_prompt: "Commit P02's limit after applyPatch(live) before APPLY unlocks."
    #     predictionRange: {min: 60, max: 100, step: 5, unit: "limit"}
    #     truth: 90
    #     measurement:
    #       label: "P02 limit after patch"
    #       cost: 1
    #     correct_action: "Accept the live-reference repair."
    #     answerText: "P02 changes from 70 to 90 because `live` references P02, while C17 remains at its existing 90; the patch reached the intended live controller."
    verify:
      prediction_prompt: Commit P02's limit after applyPatch(live) before APPLY unlocks.
      truth: 90
      measurement:
        label: P02 limit after patch
        cost: 1
      correct_action: Accept the live-reference repair.
      answerText: P02 changes from 70 to 90 because `live` references P02, while C17 remains at its existing 90; the patch reached the intended live controller.
      prediction:
        min: 60
        max: 100
        step: 5
        unit: limit
      passRatio:
        - 0.9
        - 1.1


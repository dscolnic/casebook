  stops:
  # --- Stop 5: Build the instantaneous rise
  #     Concept: derivative definition; Keystone: Derivative as rate; Area: Gate House; Learning role: INTRODUCE; Difficulty: L3; Story role: foundation.
  #     placement: DERIVE, at trace-bench.
  - group: GATES
    at: trace-bench
    title: "Build the instantaneous rise"
    concept: "derivative definition"
    reason: "The alarm needs an instantaneous rate rather than a fifteen-minute average."
    scene: "The level model near hour 2 is H(t)=0.03t^2+4.00 metres, and the current height alone looks safe. Build the difference quotient at t=2 to expose how fast the level is changing now."
    motivation: "A rate alarm responds to the curve's local motion before the height reaches danger."
    format: DERIVE
    question: "Derive H'(2) from the limit definition and submit a rate in metres per hour."
    answerText: "At hour 2 the level rises at 0.12 m/h."
    why: "limit of secant slopes."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Average height is not instantaneous change.
    # correct result: 0.12 m/h, tolerance 0.001.
    # state/output: live rate field; unlock 2.2.

          value: 4.2
          hoursLeft: 48
        - at: T-24 h
          value: 4.22
          hoursLeft: 24
        - at: T-12 h
          value: 4.235
          hoursLeft: 12
        - at: T-6 h
          value: 4.26
          hoursLeft: 6

- title: "The Rising-Fast Rule"
  card:
    header: "14 SHIFTS UNTIL THE STORM"
    title: "Faster Than the Gauge"
    goNow: "Go to Catchment & Inflow Desk and meet Imani Okoro, catchment hydrologist, at the trace bench."
    body: "The repaired trace is smooth, but its slope is growing while the level remains below the old alarm. A derivative measures instantaneous change and can warn before a height limit is crossed. At the hydrograph bench, derive the rise rate, differentiate the forecast, and build a local tangent estimate. By the end of the mission, choose the new rate alarm."
    objective: "Set a defensible reservoir-rise alarm."
  objective: "Set a defensible reservoir-rise alarm."
  stake: "The repaired trace is smooth, but its slope is growing while the level remains below the old alarm. A derivative measures instantaneous change and can warn before a height limit is crossed. At the hydrograph bench, derive the rise rate, differentiate the forecast, and build a local tangent estimate. By the end of the mission, choose the new rate alarm."
  takeaway: "Linear approximation uses a value and local slope. ---"
  segue: "Mission decision: Set the new rate alarm at the tangent prediction. The next reading is above 4.230 m, so the reservoir is rising faster than the current local trend. The crew starts an early watch. A gate chart must now turn level change into release change."
  # The mission card's own "Primer concepts", printed on the plan card.
  primer:
  - "The derivative is a limit of average rates."
  - "Positive slope means increasing; negative slope means decreasing."
  - "A tangent line gives a nearby linear estimate."


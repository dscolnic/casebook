    examples:
    - {"title":"Use the derivative definition","problem":"Find f′(2) for f(x)=x².","rule":"f′(a)=lim(h→0)[f(a+h)-f(a)]/h.","steps":["Set up the relationship: f′(a)=lim(h→0)[f(a+h)-f(a)]/h.","f′(2)=lim(h→0)[(2+h)²-4]/h=lim(h→0)(4+h)=4."],"answer":"The instantaneous slope at x=2 is 4.","mistake":"Subtract the entire original function value before dividing by h."}
    - {"title":"Differentiate a polynomial","problem":"For f(x)=2x³-4x+5, find f′(1).","rule":"d(x^n)/dx=n x^(n-1); a constant has derivative zero.","steps":["Set up the relationship: d(x^n)/dx=n x^(n-1); a constant has derivative zero.","f′(x)=6x²-4, so f′(1)=6-4=2."],"answer":"The slope at x=1 is 2.","mistake":"The derivative of the constant 5 is zero, not 5."}
    - {"title":"Write a tangent line","problem":"For f(x)=x², write the tangent line at x=2.","rule":"L(x)=f(a)+f′(a)(x-a).","steps":["Set up the relationship: L(x)=f(a)+f′(a)(x-a).","f(2)=4 and f′(2)=4, so L(x)=4+4(x-2)=4x-4."],"answer":"The tangent line is y=4x-4.","mistake":"The tangent line must pass through (2,4), not necessarily the origin."}
    - {"title":"Differentiate a product","problem":"Find y′ when y=x²(x+1).","rule":"If y=uv, then y′=u′v+uv′.","steps":["Set up the relationship: If y=uv, then y′=u′v+uv′.","y′=2x(x+1)+x²(1)=3x²+2x."],"answer":"The derivative is 3x²+2x.","mistake":"Multiplying the two derivatives omits both required product terms."}
    - {"title":"Differentiate a ratio","problem":"Find y′ for y=x/(x+1), where x≠-1.","rule":"If y=u/v, then y′=(u′v-uv′)/v².","steps":["Set up the relationship: If y=u/v, then y′=(u′v-uv′)/v².","y′=[1(x+1)-x(1)]/(x+1)²=1/(x+1)²."],"answer":"The derivative is 1/(x+1)².","mistake":"Keep the subtraction order and square the denominator."}


  # --- Stop 6: Differentiate the forecast signal
  #     Concept: power/trig/exp/chain; Keystone: Differentiation rules; Area: Gate House; Learning role: PRACTICE; Difficulty: L3; Story role: clue.
  #     placement: DERIVE, at gauge-wall.
  - group: GATES
    at: gauge-wall
    title: "Differentiate the forecast signal"
    concept: "power/trig/exp/chain"
    reason: "The rate display needs the derivative of the full forecast signal."
    scene: "The forecast is I(t)=120+8t^3+20sin(t)+15e^(0.1t) cubic metres per second. Differentiate every term so the panel can show whether inflow itself is rising at hour 2."
    motivation: "The derivative of inflow reveals acceleration in the reservoir's incoming load."
    format: DERIVE
    question: "Build I'(t), naming the rule for each term, then evaluate at t=2 h; angles are radians. Submit cubic metres per second per hour."
    answerText: "I'(2)=89.509 (m^3/s)/h, so inflow is rising quickly."
    why: "96+20cos2+1.5e^.2=89.509."
    # wrong-path feedback, one rebuttal per wrong option:
    #   d(e^(0.1t))/dt includes 0.1.
    # correct result: 89.509 (m^3/s)/h, tolerance 0.01.
    # state/output: rate lamp amber; unlock 2.3.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{goal:"I'(2)",givens:["I(t)=120+8t^3+20sin t+15e^(0.1t)"],lines:[{expressions:["24t^2+20cos t+1.5e^(0.1t)","8t^2-20sin t+15e^(0.1t)"],correct:"24t^2+20cos t+1.5e^(0.1t)",rules:["sum, power, trig, exponential chain rules","product rule only"],correct_rule:"sum, power, trig, exponential chain rules"},{expressions:["89.509","96.000"],correct:"89.509",rules:["substitute t=2 radians","drop non-polynomial terms"],correct_rule:"substitute t=2 radians"}],answerText:"I'(2)=89.509 (m^3/s)/h, so inflow is rising quickly."}

  # --- Stop 7: Protect the net-rise calculation
  #     Concept: product/quotient rules; Keystone: Differentiation rules; Area: Gate House; Learning role: PRACTICE; Difficulty: L3; Story role: obstacle.
  #     placement: DERIVE, at trace-bench.
  - group: GATES
    at: trace-bench
    title: "Protect the net-rise calculation"
    concept: "product/quotient rules"
    reason: "Rain correction and gate efficiency both change with time, so simple subtraction is unsafe."
    scene: "Because inflow is accelerating, the corrected signal multiplies raw inflow by calibration c(t), while turbine flow divides demand P(t) by head H(t). Derive both rates before combining them into net storage change."
    motivation: "Missing either product term or the quotient denominator would shift the alarm threshold."
    format: DERIVE
    question: "For J=cI and Q=P/H, derive J' and Q'; submit the ordered expression pair."
    answerText: "J'=c'I+cI' and Q'=(P'H-PH')/H^2."
    why: "both changing factors contribute."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A product's derivative is not the product of derivatives.
    # correct result: exact pair.
    # state/output: net-rate formula saved; unlock 2.4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{goal:"(J',Q')",givens:["J=cI","Q=P/H"],lines:[{expressions:["c'I+cI'","c'I'"],correct:"c'I+cI'",rules:["product rule","chain rule"],correct_rule:"product rule"},{expressions:["(P'H-PH')/H^2","P'/H'"],correct:"(P'H-PH')/H^2",rules:["quotient rule","ratio of derivatives"],correct_rule:"quotient rule"}],answerText:"J'=c'I+cI' and Q'=(P'H-PH')/H^2."}

  # --- Stop 8: Set the tangent alarm
  #     Concept: tangent line/linear approximation; Keystone: Derivative as rate; Area: Gate House; Learning role: COMBINE; Difficulty: L5; Story role: decision.
  #     placement: TRIGGER, at gauge-wall.
  - group: GATES
    at: gauge-wall
    title: "Set the tangent alarm"
    concept: "tangent line/linear approximation"
    reason: "Imani needs an alarm rule before the next fifteen-minute reading arrives."
    scene: "The verified level is 4.20 m at 10:00, and the current derivative is 0.12 m/h. Use the tangent line to predict 10:15, then commit an inclusive alarm threshold before the update appears."
    motivation: "A precommitted threshold prevents the crew from moving the rule after seeing the data."
    format: TRIGGER
    question: "Calculate L(0.25)=4.20+(0.12)(0.25) and submit the predicted level in metres; then commit RISING FAST if measured level is at least that value."
    answerText: "4.20+0.12(0.25)=4.230 m; 4.235 >= 4.230, so the rising-fast condition is met."
    why: "4.20+0.12(0.25)=4.230 m; 4.235 >= 4.230, so the rising-fast condition is met. A precommitted threshold prevents the crew from moving the rule after seeing the data."

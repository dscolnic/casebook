    at: uplift-wall
    title: "Read the pressure field"
    concept: 20   # slope fields/equilibrium
    reason: "The drawdown plan requires an uplift-pressure check before the dam carries the changed load."
    scene: "Uplift obeys dP/dh=0.4(8-P) in scaled units. Probe field points at P=4,8,10 and identify slope direction, equilibrium, and whether pressure is driven toward P=8."
    motivation: "The slope field identifies the pressure equilibrium and whether nearby states move toward or away from it."
    format: PROBE
    question: "Probe stations A, B, C, and D in order. Compare each reading with its station-specific expected value, then submit whether any station breaks the pattern, the numerical equilibrium pressure, and the direction of change on each side."
    answerText: "The completed check shows toward 8; equilibrium P=8."
    why: "toward 8; equilibrium P=8. Field direction can bound the silent readings before exact solving."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Horizontal segments mean zero slope, not zero pressure.
    # correct result: toward 8; equilibrium P=8.
    # state/output: field lit; unlock 9.2.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   probe:{load_sequence:["A","B","C","D"],stations:[{id:"A",load:{P:4,unit:"pressure"},reading:{slope:1.6,unit:"pressure/m"},expected:{slope:1.6,unit:"pressure/m"},comparison:"matches positive approach"},{id:"B",load:{P:8,unit:"pressure"},reading:{slope:0,unit:"pressure/m"},expected:{slope:0,unit:"pressure/m"},comparison:"matches equilibrium"},{id:"C",load:{P:10,unit:"pressure"},reading:{slope:-0.8,unit:"pressure/m"},expected:{slope:-0.8,unit:"pressure/m"},comparison:"matches negative return"},{id:"D",load:{P:12,unit:"pressure"},reading:{slope:-1.6,unit:"pressure/m"},expected:{slope:-1.6,unit:"pressure/m"},comparison:"matches stronger return"}],required:["A","B","C","D"],correct_break:"none",equilibrium:8,answerText:"All four readings match dP/dh=0.4(8-P); slopes point toward equilibrium P=8."}

    examples:
    - {"title":"Read a slope field","problem":"The differential equation is y′=2-y. Find slopes at y=0,2,3.","rule":"A slope-field segment uses the differential equation at its point.","steps":["At y=0, slope=2; at y=2, slope=0.","At y=3, slope=-1. Slopes depend on y, not on x here."],"answer":"Segments point upward below y=2 and downward above y=2.","mistake":"The slope is not the current height y."}
    - {"title":"Take two Euler steps","problem":"Use y′=y, y(0)=1, and step h=0.5 to estimate y(1).","rule":"y_next=y_current+h×slope_current.","steps":["Set up the relationship: y_next=y_current+h×slope_current.","y1=1+0.5(1)=1.5; y2=1.5+0.5(1.5)=2.25."],"answer":"Euler's estimate is y(1)≈2.25.","mistake":"Recalculate the slope at the new estimated point."}
    - {"title":"An Euler step depending on both inputs","problem":"Use y′=x+y, y(0)=2, and h=1 to estimate y(2).","rule":"Euler's method updates both x and y at each step.","steps":["Set up the relationship: Euler's method updates both x and y at each step.","y1=2+1(0+2)=4; y2=4+1(1+4)=9."],"answer":"The estimate is y(2)≈9.","mistake":"The second slope uses x=1, not x=0."}
    - {"title":"Test an equilibrium","problem":"For y′=4-y, determine whether y=4 is a stable equilibrium.","rule":"An equilibrium has derivative zero; nearby derivative signs determine local attraction.","steps":["At y=4, y′=0. Below 4, y′>0, so solutions rise.","Above 4, y′<0, so solutions fall. Both directions point toward 4."],"answer":"The equilibrium y=4 is stable.","mistake":"Zero slope at equilibrium alone does not show stability."}

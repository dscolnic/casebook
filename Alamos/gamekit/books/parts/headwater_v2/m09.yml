  # --- Stop 35: Test step-size sensitivity
  #     Concept: Euler error/control; Keystone: Approximation; Area: Seepage & Uplift Bay; Learning role: COMBINE; Difficulty: L4; Story role: obstacle.
  #     placement: CONTROL, at transect-rack.
  - group: STRUCT
    at: transect-rack
    title: "Test step-size sensitivity"
    concept: 25   # Euler error/control
    reason: "The coarse pressure estimate needs a numerical-sensitivity check before it supports a load decision."
    scene: "Because two coarse Euler steps give 5.44, rerun with Delta h=0.25 m while the same equation and initial value remain fixed. Compare the estimate, restore 0.50, and state the step-size effect."
    motivation: "The smaller-step comparison measures how much the predicted pressure depends on the approximation step size."
    format: CONTROL
    question: "Choose step size from candidate controls step size, initial value, and equation. Measure the Euler estimate at 0.50 m, change only step size to 0.25 m while the equation and initial value stay fixed, measure after the same interval, restore 0.50 m and remeasure, then submit the numerical change and conclusion."
    answerText: "The completed check shows as stated."
    why: "as stated. Changing only step size tests numerical approximation rather than wall behavior."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A valid control changes one input and reverses it.
    # correct result: as stated.
    # state/output: uncertainty band; unlock 9.4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   control:{candidates:[{id:"step"},{id:"initial"},{id:"equation"}],correct_control:"step",baseline:.5,response:.25,noise_band:.005,measurements:[5.44,5.3756,5.44],restore:true,correct_conclusion:"smaller step lowers estimate by .0644; result remains near 5.4"}
    control:
      variables:

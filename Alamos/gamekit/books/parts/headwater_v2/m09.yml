  # --- Stop 34: Step through the gap
  #     Concept: Euler method; Keystone: Differential equations; Area: Seepage & Uplift Bay; Learning role: PRACTICE; Difficulty: L3; Story role: evidence.
  #     placement: DERIVE, at uplift-wall.
  - group: STRUCT
    at: uplift-wall
    title: "Step through the gap"
    concept: 20   # Euler method
    reason: "The pressure model must bridge the gap between the last live reading and the next measurement."
    scene: "The last live value is P(0)=4.0, and dP/dh=0.4(8-P). Use Euler steps of 0.5 m twice to estimate P(1.0) before the next safe decision."
    motivation: "The Euler estimate predicts pressure at the missing height so the crew can assess the monitoring gap."
    format: DERIVE
    question: "Submit P(1.0)."
    answerText: "Euler gives P(1.0)=5.44."
    why: "Euler gives P(1.0)=5.44. A stepwise prediction can be compared with independent seepage evidence."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Recalculate slope after each step.
    # correct result: 5.44, tolerance .001.
    # state/output: missing points penciled; waypoint GATES.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{goal:"P(1.0)",givens:["P0=4","f=0.4(8-P)","Delta h=.5"],lines:[{expressions:["P1=4+0.4(8-4)(0.5)=4.8","P1=5.6"],correct:"P1=4+0.4(8-4)(0.5)=4.8",rules:["Euler update","full derivative step"],correct_rule:"Euler update"},{expressions:["P2=4.8+0.4(8-4.8)(0.5)=5.44","P2=5.6"],correct:"P2=4.8+0.4(8-4.8)(0.5)=5.44",rules:["update slope at new point","reuse old slope"],correct_rule:"update slope at new point"}],answerText:"Euler gives P(1.0)=5.44."}
    derive:
      start: Begin with the complete starting relation on the card. Preserve its named left side on every line.
      goal: Step through the gap in the form and units requested by the prompt
      steps:
        - ask: Euler update
          answer: 0
          candidates:
            - text: P1=4+0.4(8-4)(0.5)=4.8
              note: Euler update
            - text: P1=4+0.4(8-4)(1.0)=5.6
              note: full derivative step
              why: This is the common full derivative step mistake; it does not perform the licensed Euler update step.
              survives: true
        - ask: update slope at new point
          answer: 0
          candidates:
            - text: P2=4.8+0.4(8-4.8)(0.5)=5.44
              note: update slope at new point
            - text: P2=4.8+0.4(8-4.8)(0.25)=5.6

  stops:
  # --- Stop 33: Read the pressure field
  #     Concept: slope fields/equilibrium; Keystone: Differential equations; Area: Seepage & Uplift Bay; Learning role: INTRODUCE; Difficulty: L2; Story role: clue.
  #     placement: PROBE, at uplift-wall.

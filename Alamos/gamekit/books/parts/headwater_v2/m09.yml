      stations:
        - id: A
          label: Station A at P=4
          reading: 1.6
          expected: 1.6
          unit: pressure/m
        - id: B
          label: Station B at P=8
          reading: 0
          expected: 0
          unit: pressure/m
        - id: C
          label: Station C at P=10
          reading: -0.8
          expected: -0.8
          unit: pressure/m

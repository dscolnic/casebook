  worked:
    label: "Worked examples"
    title: "Mission 5: worked examples"
    examples:
    - {"title":"Find interior critical points","problem":"Find the critical inputs of f(x)=x³-3x.","rule":"Critical inputs occur where f′=0 or f′ is undefined, within the function domain.","steps":["Set up the relationship: Critical inputs occur where f′=0 or f′ is undefined, within the function domain.","f′(x)=3x²-3=3(x-1)(x+1), so x=-1 or x=1."],"answer":"The critical inputs are -1 and 1.","mistake":"A critical input is not automatically an absolute maximum."}
    - {"title":"Check endpoints as well","problem":"Find the absolute minimum and maximum of f(x)=x²-2x on [0,3].","rule":"Compare function values at endpoints and interior critical points.","steps":["Set up the relationship: Compare function values at endpoints and interior critical points.","f′=2x-2=0 gives x=1; f(0)=0, f(1)=-1, f(3)=3."],"answer":"Minimum -1 occurs at x=1; maximum 3 occurs at x=3.","mistake":"Ignoring endpoints would miss the absolute maximum."}
    - {"title":"Match average and instantaneous slopes","problem":"For f(x)=x² on [1,3], find the point guaranteed by the Mean Value Theorem.","rule":"For a continuous function differentiable inside the interval, f′(c)=[f(b)-f(a)]/(b-a).","steps":["Set up the relationship: For a continuous function differentiable inside the interval, f′(c)=[f(b)-f(a)]/(b-a).","average slope=(9-1)/(3-1)=4; f′(c)=2c=4 gives c=2."],"answer":"The guaranteed matching slope occurs at c=2.","mistake":"The theorem equates a derivative with average slope, not with an average function value."}
    - {"title":"Guarantee a crossing","problem":"A continuous function has f(0)=-2 and f(3)=4. Must it equal 1 somewhere between?","rule":"The Intermediate Value Theorem guarantees every value between endpoint outputs for a continuous function.","steps":["The target 1 lies between -2 and 4.","Continuity prevents the function from jumping over that target."],"answer":"There is at least one c in (0,3) with f(c)=1.","mistake":"The theorem does not guarantee exactly one crossing."}
    - {"title":"Compare marginal cost and revenue","problem":"Revenue is R(q)=10q dollars and cost is C(q)=q² dollars. Find where profit stops increasing.","rule":"Profit P=R-C, so P′=R′-C′.","steps":["Set up the relationship: Profit P=R-C, so P′=R′-C′.","P′(q)=10-2q=0 gives q=5; P″=-2<0."],"answer":"Profit is maximized at q=5 on q≥0.","mistake":"Maximize profit, not revenue alone."}


              survives: true

  # --- Stop 18: Test the absolute peak
  #     Concept: EVT/first-second derivative tests; Keystone: Extrema; Area: Gate House; Learning role: PRACTICE; Difficulty: L4; Story role: reversal.
  #     placement: BALLPARK, at machine-board.
  - group: GATES
    at: machine-board
    title: "Test the absolute peak"
    concept: 13   # EVT/first-second derivative tests
    reason: "The interior demand checks are ready to be compared with the schedule endpoints."
    scene: "The turbine operator holds the schedule open: a peak inside the shift is not the only way to overload the machine."
    motivation: "The absolute maximum determines whether any part of the turbine schedule exceeds the machine's power limit."
    format: BALLPARK
    question: "Demand is D(t)=t³−6t²+9t+20 MW for 0≤t≤5 h. Compare t=0,1,3,5 h. Choose the absolute maximum; the inclusive machine limit is 24 MW."
    answerText: "EVT requires endpoints plus critical points; the endpoint peak exceeds capacity."
    why: "EVT requires endpoints plus critical points; the endpoint peak exceeds capacity. A correct maximum decides whether the two-day plan overloads the available unit."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A local maximum need not be the absolute maximum.
    # correct result: 40 MW at 5 h, unsafe; local max at 1 h is 24 MW.
    # state/output: overload tag; waypoint to STORE.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   estimate:{labels:["D(0)","D(1)","D(3)","D(5)"],values:[[20],[24],[20],[40]],slots:4,template:"largest candidate",formula:"max(20,24,20,40)",correct:[20,24,20,40],target:40,tolerance:0}
    estimate:
      prompt: compare the endpoint and critical-point demand values and select the largest
      question: absolute maximum demand
      labels:
        - 20 MW  (Demand at t=0 h)
        - 24 MW  (Demand at t=1 h)
        - 20 MW  (Demand at t=3 h)
        - 40 MW  (Demand at t=5 h)

    concept: 11   # optimization/marginal value
    reason: "The unsafe power peak forces the crew to reconsider how much release buys useful storage margin."
    scene: "Because the power peak is unsafe, test release q=180 then 200 m^3/s while forecast inflow and starting level remain fixed. Measure projected storage margin, restore q=180, and compare marginal benefit."
    motivation: "The controlled storage change measures the marginal benefit of increased discharge under the same inflow forecast."

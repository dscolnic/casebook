    question: "Choose release from the three candidate controls release, inflow forecast, and starting level. Measure projected storage margin at 180 m^3/s, change only release to 200 m^3/s while the forecast and starting level remain fixed, measure after the projection settles, restore 180 m^3/s and measure again, then submit the marginal gain in million m^3 per (m^3/s) and one causal conclusion."
    answerText: "The completed check shows causal; marginal gain.08/20=.004 million m^3 per (m^3/s)."
    why: "causal; marginal gain .08/20=.004 million m^3 per (m^3/s). A controlled reversal separates the release setting's effect from a changing forecast."

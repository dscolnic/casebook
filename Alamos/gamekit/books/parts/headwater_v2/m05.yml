  stops:
  # --- Stop 17: Find critical turbine demand
  #     Concept: critical points; Keystone: Extrema; Area: Powerhouse; Learning role: INTRODUCE; Difficulty: L3; Story role: clue.
  #     placement: DERIVE, at machine-board.
  - group: POWER
    at: machine-board
    title: "Find critical turbine demand"
    concept: 11   # critical points
    reason: "The release plan's power demand must be checked over the entire operating interval."
    scene: "Turbine demand is D(t)=t^3-6t^2+9t+20 megawatts for 0<=t<=5 hours. Differentiate and solve for interior critical times before comparing the plan's endpoints and average."
    motivation: "The critical times identify interior demand peaks and troughs that an endpoint-only check would miss."
    format: DERIVE
    question: "Submit all critical times in hours."
    answerText: "Critical times are 1 h and 3 h."
    why: "Critical times are 1 h and 3 h. A zero derivative can reveal a peak that sparse readings miss."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Endpoints are extrema candidates but not critical interior points.
    # correct result: 1,3 h.
    # state/output: candidates lit; unlock 5.2.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{goal:"critical times",givens:["D=t^3-6t^2+9t+20","0<=t<=5"],lines:[{expressions:["D'=3t^2-12t+9","D'=t^2-6t+9"],correct:"D'=3t^2-12t+9",rules:["power and sum rules","divide derivative by degree"],correct_rule:"power and sum rules"},{expressions:["3(t-1)(t-3)=0","3(t-2)^2=0"],correct:"3(t-1)(t-3)=0",rules:["factor quadratic","complete wrong square"],correct_rule:"factor quadratic"},{expressions:["t=1,3 h","t=0,5 h"],correct:"t=1,3 h",rules:["zero-product property","endpoint theorem"],correct_rule:"zero-product property"}],answerText:"Critical times are 1 h and 3 h."}
    derive:
      start: Begin with the complete starting relation on the card. Preserve its named left side on every line.
      goal: Find critical turbine demand in the form and units requested by the prompt
      steps:
        - ask: power and sum rules
          answer: 0
          candidates:
            - text: D'=3t^2-12t+9
              note: power and sum rules
            - text: D'=t^2-6t+9
              note: divide derivative by degree
              why: This is the common divide derivative by degree mistake; it does not perform the licensed power and sum rules step.
              survives: true

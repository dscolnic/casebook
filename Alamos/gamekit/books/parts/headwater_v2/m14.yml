    label: "Worked examples"
    title: "Mission 14: worked examples"
    examples:
    - {"title":"Optimize a rectangle","problem":"A rectangle has perimeter 20 cm. Find its maximum area.","rule":"If width=x, length=10-x, so A=x(10-x).","steps":["Set up the relationship: If width=x, length=10-x, so A=x(10-x).","A′=10-2x=0 gives x=5; A″=-2<0 and A=25 cm²."],"answer":"A 5 cm by 5 cm square gives the maximum area.","mistake":"The perimeter includes two lengths and two widths."}
    - {"title":"Check a constrained point","problem":"Choose nonnegative x,y subject to x+y≤10 and y≥3. Is (8,3) feasible? Is (6,3)?","rule":"A feasible point must satisfy every constraint.","steps":["For (8,3), x+y=11>10, so it fails despite y=3.","For (6,3), x+y=9≤10 and y=3≥3; both variables are nonnegative."],"answer":"(6,3) is feasible; (8,3) is not.","mistake":"A good objective value cannot rescue a point outside the allowed region."}
    - {"title":"Compare marginal cost and revenue","problem":"Revenue is R(q)=10q dollars and cost is C(q)=q² dollars. Find where profit stops increasing.","rule":"Profit P=R-C, so P′=R′-C′.","steps":["Set up the relationship: Profit P=R-C, so P′=R′-C′.","P′(q)=10-2q=0 gives q=5; P″=-2<0."],"answer":"Profit is maximized at q=5 on q≥0.","mistake":"Maximize profit, not revenue alone."}

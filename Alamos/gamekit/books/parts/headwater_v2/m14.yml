    - {"title":"Read an inclusive threshold","problem":"A fictional laboratory rule permits a sample concentration at or below 5 mg/L. A sample measures exactly 5 mg/L. Classify it under that rule.","rule":"At or below means concentration ≤ limit.","steps":["comparison = 5 ≤ 5, which is true. Equality is included.","classification = passes this concentration rule. No claim about other requirements follows."],"answer":"This measurement passes the stated inclusive threshold.","mistake":"Replacing ≤ with < would wrongly exclude equality."}

  stops:
  # --- Stop 53: Find the repair optimum
  #     Concept: optimization/marginal value; Keystone: Extrema; Area: Powerhouse; Learning role: RETRIEVE; Difficulty: L4; Story role: foundation.
  #     placement: BALLPARK, at arrival-map.
  - group: POWER
    at: arrival-map
    title: "Find the repair optimum"
    concept: 11   # optimization/marginal value
    reason: "The final release plan needs repairs, but the available crew count limits the feasible benefit."
    scene: "Repair benefit is R(x)=18x-x^2 and coordination cost is C(x)=2x+8, where x crews can range from 0 to 6. Find the integer crew count maximizing P=R-C."
    motivation: "Net repair benefit over the allowed crew interval determines the best achievable staffing level, including endpoints."
    format: BALLPARK
    question: "Using P(x)=(18x-x^2)-(2x+8) for integer 0<=x<=6, calculate P'(x), check feasible critical points and endpoints, then submit one integer crew count."
    answerText: "unconstrained critical point 8 lies outside [0,6], so endpoints control."
    why: "unconstrained critical point 8 lies outside [0,6], so endpoints control. The optimum sets the fastest useful repair without wasting scarce operators."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A critical point outside the domain is not feasible.
    # correct result: x=6 at endpoint; P(6)=52, versus P(0)=-8.
    # state/output: six crews assigned; unlock 14.2.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   estimate:{labels:["solve P'=16-2x=0","check endpoints/integers"],values:[[8],[0,6]],slots:2,template:"feasible candidate",formula:"x=8 clipped then compare 0,6",correct:[8,6],target:6,tolerance:0}
    estimate:
      prompt: find the unconstrained vertex, then enforce the feasible upper endpoint
      question: feasible crew count that maximizes net repair benefit
      labels:
        - 18 benefit/crew  (Benefit linear coefficient)
        - 2 benefit/crew  (Cost linear coefficient)
        - 1 benefit/crew²  (Benefit quadratic coefficient magnitude)
        - 6 crews  (Maximum available crews)
        - 0 crews  (Minimum available crews)
      values:
        - 18
        - 2
        - 1
        - 6
        - 0
      slots: 4
      template: x_best=min(({0}-2)/({1}×{2}),{3})
      formula: x_best=min((18-2)/(2×1),6)
      correct:
        - 0
        - 1
        - 2
        - 3
      target: 6
      tolerance: 0.1
      units: crews

  # --- Stop 54: Order settlements by consequence
  #     Concept: constrained decision/extrema; Keystone: Extrema; Area: Forecast Archive; Learning role: COMBINE; Difficulty: L5; Story role: consequence.
  #     placement: TRIAGE, asked by Elise Baptiste beside settlement-circuits.
  - group: ARCHIVE
    at: settlement-circuits
    title: "Order settlements by consequence"
    person: baptiste
    concept: 13   # constrained decision/extrema
    reason: "The crew allocation is fixed, leaving downstream repair order to be chosen by consequence."
    scene: "With six crews fixed, sort four dark circuits by arrival and closure: Road 280 min, School 310, Caravan 350, Village 410. Repairs take 35,25,20,30 min, with two simultaneous teams."
    motivation: "Arrival and closure deadlines determine which dark warning circuits must be restored first."
    format: TRIAGE
    question: "Select exactly one of four first-team pairs and submit its label."
    answerText: "The completed check shows road and School."
    why: "Road and School. Earliest binding deadlines determine a safe schedule."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Any pair omitting Road or School delays one of the two earliest binding deadlines; the option-specific payload rebuttals identify the missed deadline.
    # correct result: Road and School.
    # state/output: repair route; waypoint INFLOW.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   question:"Which two circuits receive the first teams?"; choices:["Road and School","Caravan and Village","Road and Village","School and Caravan"]; answer:"Road and School"; why:"Road and School have the two earliest binding deadlines."; rebuttals:{"Caravan and Village":"This leaves both earliest deadlines, 280 and 310 minutes, without first teams.","Road and Village":"The School deadline at 310 minutes binds before the Village deadline at 410 minutes.","School and Caravan":"The Road deadline at 280 minutes is the earliest and cannot wait."}
    choices:
    - "Road and School"
    - "Caravan and Village"
    - "Road and Village"
    - "School and Caravan"
    answer: "Road and School"
    rebuttals:
    - "This leaves both earliest deadlines, 280 and 310 minutes, without first teams."
    - "The School deadline at 310 minutes binds before the Village deadline at 410 minutes."
    - "The Road deadline at 280 minutes is the earliest and cannot wait."

  # --- Stop 55: Update the delayed forecast
  #     Concept: Euler/logistic delay; Keystone: Differential equations; Area: Seepage & Uplift Bay; Learning role: RETRIEVE; Difficulty: L4; Story role: setback.
  #     placement: CONTROL, at arrival-map.
  - group: STRUCT
    at: arrival-map
    title: "Update the delayed forecast"
    concept: 20   # Euler/logistic delay
    reason: "The repairs delay release, so the reservoir forecast must be advanced to the new starting time."
    scene: "Repairs delay release by 1.0 h, so update dH/dt=0.20(5-H) from H(0)=4.20 m. Compare Euler steps of 1.0 and 0.5 h, restoring the first setting before the safe decision."
    motivation: "The updated height estimate determines the reservoir state from which the delayed release plan must begin."
    format: CONTROL
    question: "Choose Euler step size from candidate controls step size, initial level, and rate constant. Measure the delayed forecast with 1.0 h steps, change only the step to 0.5 h while $H(0)=4.20$ m and $dH/dt=0.20(5-H)$ remain fixed, remeasure at the same final time, restore 1.0 h and measure again, then submit the conservative level in metres and conclusion."
    answerText: "The completed check shows 4.36 m."
    why: "4.36 m. The delayed start must use a numerical forecast consistent with the same differential model."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Update slope after the first half-step.
    # correct result: 4.36 m.
    # state/output: revised gate start; waypoint GATES.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   control:{candidates:[{id:"step"},{id:"initial"},{id:"k"}],correct_control:"step",baseline:1,response:.5,noise_band:.005,measurements:[4.36,4.352,4.36],restore:true,correct_conclusion:"use conservative 4.36 m"}
    control:
      variables:
        - id: step
          label: Euler step size
        - id: initial
          label: Initial level
        - id: rate_constant
          label: Rate constant
      held:
        - H(0)=4.20 m
        - dH/dt=0.20(5-H)
        - final forecast time
      truth: step
      baseline: 0
      response: 0.008
      noise: 0.002

  # --- Stop 56: Commit repaired warning trigger
  #     Concept: optimization/threshold synthesis; Keystone: all; Area: Powerhouse; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: TRIGGER, at radio-desk.
  - group: POWER
    at: radio-desk
    title: "Commit repaired warning trigger"
    concept: 11   # optimization/threshold synthesis
    reason: "The repair schedule and delayed release time are ready for a warning-readiness commitment."
    scene: "Repairs finish in 65 min, the minimum warning lead is 280 min, and release begins no sooner than 360 min from now. Commit the inclusive readiness slack before circuit results appear."
    motivation: "Readiness slack determines whether repaired circuits can still provide the minimum warning lead before release."
    format: TRIGGER
    question: "Calculate and submit slack 360-280-65 in minutes; commit READY if slack >=0 and all four circuits pass, then reveal circuit results."
    answerText: "360-280-65=15>=0, and every circuit passes."
    why: "360-280-65=15>=0, and every circuit passes. Positive precommitted slack proves warnings finish before the last safe release time."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A negative slack or any dark circuit fails the committed rule; do not move the threshold after the four circuit results appear.
    # correct result: 15 min; READY.
    # state/output: siren text 4/4 READY; Downstream locks.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   trigger:{decision_rule:"READY iff slack>=0 and 4/4 circuits pass",scale:{min:-30,max:60,step:5,unit:"min"},anchors:[0,15,45],objective:"complete warning before required lead",direction:"at or above zero",consequence_limit:"no release with any dark circuit"}; reveal 4/4 pass.
    trigger:
      scale:
        label: warning-system slack
        unit: min
        min: -30
        max: 60
        step: 5
        anchors:
          - at: -12
            means: routine baseline, not the decision threshold
          - at: 28.5
            means: elevated evidence requiring attention
      direction: rising
      conditions:
        - id: act
          label: Take the protective action
          leadHours: 12
          window:
            min: 15
            max: 60
      stream:
        - at: T-48 h
          value: -10
          hoursLeft: 48
        - at: T-24 h
          value: 0
          hoursLeft: 24
        - at: T-12 h
          value: 15
          hoursLeft: 12
        - at: T-6 h
          value: 30
          hoursLeft: 6

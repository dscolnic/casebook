  # --- Stop 53: Find the repair optimum
  #     Concept: optimization/marginal value; Keystone: Extrema; Area: Powerhouse; Learning role: RETRIEVE; Difficulty: L4; Story role: foundation.
  #     placement: BALLPARK, at arrival-map.
  - group: POWER
    at: arrival-map
    title: "Find the repair optimum"
    concept: "optimization/marginal value"
    reason: "Four circuits must be repaired before the shrinking release window closes."
    scene: "Repair benefit is R(x)=18x-x^2 and coordination cost is C(x)=2x+8, where x crews can range from 0 to 6. Find the integer crew count maximizing P=R-C, and the team needs this result before it acts."
    motivation: "The optimum sets the fastest useful repair without wasting scarce operators."
    format: BALLPARK
    question: "Using P(x)=(18x-x^2)-(2x+8) for integer 0<=x<=6, calculate P'(x), check feasible critical points and endpoints, then submit one integer crew count."
    answerText: "unconstrained critical point 8 lies outside [0,6], so endpoints control."
    why: "unconstrained critical point 8 lies outside [0,6], so endpoints control. The optimum sets the fastest useful repair without wasting scarce operators."
    # wrong-path feedback, one rebuttal per wrong option:

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-downstream-warning-desk
    # On arrival at Downstream Warning Desk | arrival-map | automatic
    on: { enter: true, at: SAFE }
    world: "Two acknowledgement boxes are empty beside a running clock."
    panel: "MISSION 14: FIND THE REPAIR OPTIMUM OPEN"
    # unlocks: Unlock Stop 53 at arrival-map in Downstream Warning Desk.
    bubbles:
    - who: baptiste   # Elise Baptiste
      say: "Start with find the repair optimum. We need evidence the next decision can use."
  - id: after-stop-53
    # After Stop 53 | settlement-circuits | automatic
    on: { after: [1] }
    world: "At arrival-map, the dated accepted-result slip for Stop 53 reads: \"x=6 at endpoint; P(6)=52, versus P(0)=-8.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 53 RECORDED - STOP 54 OPEN"
    # unlocks: Unlock Stop 54 at settlement-circuits in Downstream Warning Desk.
    bubbles:
    - who: baptiste   # Elise Baptiste
      say: "That check holds. The crew allocation is fixed, leaving downstream repair order to be chosen by consequence."
  - id: after-stop-54
    # After Stop 54 | arrival-map | automatic
    on: { after: [2] }
    world: "At settlement-circuits, the dated accepted-result slip for Stop 54 reads: \"Road and School.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 54 RECORDED - STOP 55 OPEN"
    # unlocks: Unlock Stop 55 at arrival-map in Downstream Warning Desk.
    bubbles:
    - who: baptiste   # Elise Baptiste
      say: "That check holds. The repairs delay release, so the reservoir forecast must be advanced to the new starting time."
  - id: after-stop-55
    # After Stop 55 | radio-desk | automatic
    on: { after: [3] }
    world: "At arrival-map, the dated accepted-result slip for Stop 55 reads: \"4.36 m.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 55 RECORDED - STOP 56 OPEN"
    # unlocks: Unlock Stop 56 at radio-desk in Downstream Warning Desk.
    bubbles:
    - who: baptiste   # Elise Baptiste
      say: "That check holds. The repair schedule and delayed release time are ready for a warning-readiness commitment."
  - id: at-mission-end
    # At mission end | arrival-map | automatic
    on: { missionEnd: true }
    world: "At warning-list, Elise Baptiste ticks the fourth warning acknowledgement box. The dated prop remains here on later visits."
    panel: "MISSION 14 EVIDENCE: RECORDED"
    # unlocks: Open the mission outcome and metric screen.
    bubbles:
    - who: baptiste   # Elise Baptiste
      say: "Four voices back. We can finally act on the plan. Therefore Nia must save power for the last gate move; only 15 minutes remain before the warning deadline."


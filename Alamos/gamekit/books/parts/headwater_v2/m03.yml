  worked:
    label: "Worked examples"
    title: "Mission 3: worked examples"
    examples:
    - {"title":"Differentiate a nested power","problem":"Find y′ for y=(2x+1)³.","rule":"The chain rule multiplies the outer derivative by the inner derivative.","steps":["Set up the relationship: The chain rule multiplies the outer derivative by the inner derivative.","y′=3(2x+1)²(2)=6(2x+1)²."],"answer":"The extra factor 2 comes from differentiating 2x+1.","mistake":"Do not drop the derivative of the inside expression."}
    - {"title":"Differentiate an exponential","problem":"Find y′(0) for y=4e^(2x).","rule":"d(e^(kx))/dx=k e^(kx).","steps":["Set up the relationship: d(e^(kx))/dx=k e^(kx).","y′(x)=8e^(2x), so y′(0)=8e^0=8."],"answer":"The slope at zero is 8.","mistake":"The exponent coefficient multiplies the derivative."}
    - {"title":"Find a slope on a circle","problem":"For x²+y²=25, find dy/dx at (3,4).","rule":"Differentiate both sides in x, treating y as a function of x.","steps":["Set up the relationship: Differentiate both sides in x, treating y as a function of x.","2x+2y(dy/dx)=0, so dy/dx=-x/y=-3/4."],"answer":"The tangent slope at (3,4) is -3/4.","mistake":"The derivative of y² is 2y(dy/dx), not just 2y."}
    - {"title":"Differentiate an inverse","problem":"A differentiable function has f(2)=5 and f′(2)=4. Find (f inverse)′(5).","rule":"(f inverse)′(f(a))=1/f′(a), when the inverse exists locally and f′(a)≠0.","steps":["Set up the relationship: (f inverse)′(f(a))=1/f′(a), when the inverse exists locally and f′(a)≠0.","(f inverse)′(5)=1/f′(2)=1/4."],"answer":"The inverse slope at output 5 is 1/4.","mistake":"Use the matching original input 2, not f′(5)."}
    - {"title":"Differentiate implicitly twice","problem":"For x²+y²=25 near (0,5), find y″.","rule":"First y′=-x/y; differentiating 2x+2yy′=0 gives 2+2(y′)²+2yy″=0.","steps":["Set up the relationship: First y′=-x/y; differentiating 2x+2yy′=0 gives 2+2(y′)²+2yy″=0.","At (0,5), y′=0, so y″=-[1+0²]/5=-1/5."],"answer":"The curve is concave down there.","mistake":"The product yy′ requires a product rule on the second differentiation."}

  stops:
  # --- Stop 9: Differentiate nested discharge
  #     Concept: chain/exp/log; Keystone: Chain reasoning; Area: Forecast Archive; Learning role: INTRODUCE; Difficulty: L3; Story role: foundation.
  #     placement: DERIVE, at discharge-board.
  - group: ARCHIVE
    at: discharge-board
    title: "Differentiate nested discharge"
    concept: 6   # chain/exp/log
    reason: "The alarm forecast needs a gate-response model before the crew adjusts release under changing head."
    scene: "Gate discharge is modeled by Q(h)=40e^(0.3sqrt(h)) cubic metres per second, where h is head in metres. Differentiate the three nested layers so a small head change has a predicted flow response."
    motivation: "The discharge derivative determines how sensitively flow responds to reservoir head at the gate."
    format: DERIVE
    question: "Submit dQ/dh in (m^3/s)/m."
    answerText: "dQ/dh=6e^(0.3sqrt h)/sqrt h."
    why: "dQ/dh=6e^(0.3sqrt h)/sqrt h. Multiplying every layer's derivative prevents a dangerously small sensitivity estimate."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Three layers require three derivative factors.
    # correct result: exact.
    # state/output: sensitivity curve; unlock 3.2.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{goal:"dQ/dh",givens:["Q=40e^(0.3sqrt h)"],lines:[{expressions:["40e^(0.3sqrt h)*d(0.3sqrt h)/dh","12e^h"],correct:"40e^(0.3sqrt h)*d(0.3sqrt h)/dh",rules:["exponential chain rule","power only"],correct_rule:"exponential chain rule"},{expressions:["6e^(0.3sqrt h)/sqrt h","12sqrt h e^(0.3sqrt h)"],correct:"6e^(0.3sqrt h)/sqrt h",rules:["power rule and multiply layers","quotient rule"],correct_rule:"power rule and multiply layers"}],answerText:"dQ/dh=6e^(0.3sqrt h)/sqrt h."}
    derive:
      start: Begin with the complete starting relation on the card. Preserve its named left side on every line.
      goal: Differentiate nested discharge in the form and units requested by the prompt
      steps:
        - ask: exponential chain rule
          answer: 0
          candidates:
            - text: dQ/dh = 40e^(0.3sqrt h)*d(0.3sqrt h)/dh
              note: exponential chain rule
            - text: dQ/dh = 40e^(0.3h)*d(0.3sqrt h)/dh
              note: power only
              why: This is the common power only mistake; it does not perform the licensed exponential chain rule step.
              survives: true
        - ask: power rule and multiply layers
          answer: 0
          candidates:
            - text: dQ/dh = 6e^(0.3sqrt h)/sqrt h
              note: power rule and multiply layers
            - text: dQ/dh = 12sqrt h e^(0.3sqrt h)
              note: quotient rule
              why: This is the common quotient rule mistake; it does not perform the licensed power rule and multiply layers step.
              survives: true

  # --- Stop 10: Link opening and head
  #     Concept: implicit differentiation; Keystone: Chain reasoning; Area: Gate House; Learning role: PRACTICE; Difficulty: L3; Story role: obstacle.
  #     placement: DERIVE, at discharge-board.
  - group: GATES
    at: discharge-board
    title: "Link opening and head"
    concept: 7   # implicit differentiation
    reason: "The discharge response must account for the mechanical linkage between gate opening and water head."
    scene: "Linkage tests satisfy o^2+0.5oh+h^2=9, where opening o and head h are metres. Differentiate implicitly to find how opening changes with head at o=2 and h=1."
    motivation: "The implicit slope determines whether the linked opening grows or shrinks as head changes near the test point."
    format: DERIVE
    question: "Submit its value at (h,o)=(1,2) in metres of opening per metre of head."
    answerText: "do/dh=-2/3."
    why: "do/dh=-2/3. The linkage slope turns water-level motion into a required hoist correction."
    # wrong-path feedback, one rebuttal per wrong option:
    #   o varies with h; its derivative cannot be dropped.
    # correct result: -0.6667, tolerance .001.
    # state/output: linkage arrow; unlock 3.3.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{goal:"do/dh",givens:["o^2+0.5oh+h^2=9","o=2,h=1"],lines:[{expressions:["2o o'+0.5(o'h+o)+2h=0","2o+0.5h+2h=0"],correct:"2o o'+0.5(o'h+o)+2h=0",rules:["implicit plus product rule","hold o fixed"],correct_rule:"implicit plus product rule"},{expressions:["o'=-(0.5o+2h)/(2o+0.5h)","o'=-(2o+0.5h)/(0.5o+2h)"],correct:"o'=-(0.5o+2h)/(2o+0.5h)",rules:["collect o' terms","invert relation"],correct_rule:"collect o' terms"},{expressions:["-2/3","-3/2"],correct:"-2/3",rules:["substitute o=2,h=1","reciprocal slope"],correct_rule:"substitute o=2,h=1"}],answerText:"do/dh=-2/3."}
    derive:
      start: Begin with the complete starting relation on the card. Preserve its named left side on every line.
      goal: Link opening and head in the form and units requested by the prompt
      steps:
        - ask: implicit plus product rule
          answer: 0
          candidates:
            - text: 2o o'+0.5(o'h+o)+2h=0
              note: implicit plus product rule
            - text: 2o o'+0.5(o'h+h)+2h=0
              note: hold o fixed
              why: This is the common hold o fixed mistake; it does not perform the licensed implicit plus product rule step.
              survives: true
        - ask: collect o' terms
          answer: 0
          candidates:
            - text: o'=-(0.5o+2h)/(2o+0.5h)
              note: collect o' terms
            - text: o'=-(2o+0.5h)/(0.5o+2h)
              note: invert relation
              why: This is the common invert relation mistake; it does not perform the licensed collect o' terms step.
              survives: true
        - ask: substitute o=2,h=1
          answer: 0
          candidates:
            - text: do/dh = -(0.5×2+2×1)/(2×2+0.5×1) = -2/3
              note: substitute o=2,h=1
            - text: do/dh = +(0.5×2+2×1)/(2×2+0.5×1) = +2/3
              note: reciprocal slope
              why: Moving the terms without the derivative across the equation introduces a minus sign.
              survives: true

  # --- Stop 11: Find linkage curvature
  #     Concept: second implicit derivative; Keystone: Chain reasoning; Area: Gate House; Learning role: COMBINE; Difficulty: L4; Story role: reversal.
  #     placement: DERIVE, at hoist-stand.
  - group: GATES
    at: hoist-stand
    title: "Find linkage curvature"
    concept: 12   # second implicit derivative
    reason: "The linkage's current slope is known, but its change may narrow the safe range of gate motion."
    scene: "The linkage slope is negative at the test point, but Wilkes needs to know how that slope itself changes. Differentiate the first derivative relation again and substitute the known do/dh=-2/3."
    motivation: "The second derivative measures linkage curvature, which affects how far the local opening sensitivity can be trusted."
    format: DERIVE
    question: "Submit its value at (h,o)=(1,2)."
    answerText: "o''=-40/81 per metre."
    why: "o''=-40/81 per metre. Curvature determines whether the safe correction stays safe over a finite movement."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Substitute the original first derivative into the second derivative.
    # correct result: -0.49383, tolerance .001.
    # state/output: safe corridor narrows; unlock 3.4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{goal:"o''",givens:["(2o+0.5h)o'+0.5o+2h=0","o'=-2/3"],lines:[{expressions:["(2o'+0.5)o'+(2o+0.5h)o''+0.5o'+2=0","(2o+0.5h)o''+2=0"],correct:"(2o'+0.5)o'+(2o+0.5h)o''+0.5o'+2=0",rules:["product and implicit rules","differentiate constants only"],correct_rule:"product and implicit rules"},{expressions:["o''=-[(2o'+0.5)o'+0.5o'+2]/(2o+0.5h)","o''=-2/(2o+0.5h)"],correct:"o''=-[(2o'+0.5)o'+0.5o'+2]/(2o+0.5h)",rules:["isolate o''","discard slope"],correct_rule:"isolate o''"},{expressions:["-40/81","-4/9"],correct:"-40/81",rules:["substitute all known values","use first derivative only"],correct_rule:"substitute all known values"}],answerText:"o''=-40/81 per metre."}
    derive:
      start: Begin with the complete starting relation on the card. Preserve its named left side on every line.
      goal: Find linkage curvature in the form and units requested by the prompt
      steps:
        - ask: product and implicit rules
          answer: 0
          candidates:
            - text: (2o'+0.5)o'+(2o+0.5h)o''+0.5o'+2=0
              note: product and implicit rules
            - text: (2o'+0.5)o'+(2o+0.5h)o''-0.5o'+2=0
              note: differentiate constants only
              why: This is the common differentiate constants only mistake; it does not perform the licensed product and implicit rules step.
              survives: true
        - ask: isolate o''
          answer: 0
          candidates:
            - text: o''=-[(2o'+0.5)o'+0.5o'+2]/(2o+0.5h)
              note: isolate o''
            - text: o''=-[(2o'+0.5)o'+2]/(2o+0.5h)
              note: discard slope
              why: This is the common discard slope mistake; it does not perform the licensed isolate o'' step.
              survives: true
        - ask: substitute all known values
          answer: 0
          candidates:
            - text: o'' = -[(2×(-2/3)+0.5)(-2/3)+0.5×(-2/3)+2]/(2×2+0.5×1) = -40/81
              note: substitute all known values
            - text: o'' = -36/81 = -4/9
              note: use first derivative only
              why: This is the common use first derivative only mistake; it does not perform the licensed substitute all known values step.
              survives: true

  # --- Stop 12: Reverse the flow calibration
  #     Concept: inverse derivative/arctan; Keystone: Chain reasoning; Area: Gate House; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: VERIFY, at hoist-stand.
  - group: GATES
    at: hoist-stand
    title: "Reverse the flow calibration"
    concept: 3   # inverse derivative/arctan
    reason: "The linkage analysis is ready for an independent test of the flow-command calibration."
    scene: "Because linkage curvature narrows the safe motion, the command map uses F(o)=100 arctan(o/2) cubic metres per second. Predict the opening sensitivity at o=2, then verify it with one reversible step."
    motivation: "The forward and inverse sensitivities determine whether the measured opening response agrees with the command map."
    format: VERIFY
    question: "**CALCULATE AND COMMIT:** From $F(o)=100\\arctan(o/2)$, use $F'(o)=50/(1+(o/2)^2)$ at $o=2$ to submit the inverse sensitivity $do/dF$ in m/(m^3/s); the linkage remains locked until commitment."
    answerText: "predicted 2*.04=.080 m, measured .080 m, and reversal returns to baseline."
    why: "predicted 2*.04=.080 m, measured .080 m, and reversal returns to baseline. A measured inverse response certifies the command direction without assuming the chart is correct."
    # wrong-path feedback, one rebuttal per wrong option:
    #   The inverse derivative is reciprocal at the matching point, not at the same displayed output by guess.
    # correct result: dF/do=25, inverse .040; pass.
    # state/output: safe calibration signed.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   verify:{required_sequence:[calculate_and_commit,operate,measure,interpret],prediction:{equation:"F'(o)=50/(1+(o/2)^2); do/dF=1/F'(o)",inputs:{o:2,flow_step:2.0},constants:{coefficient:50},submit:{quantity:"inverse sensitivity",unit:"m/(m^3/s)",truth:0.04,tolerance:0.001}},equipment_locked_until_prediction_commit:true,operation:{command_change:2.0,unit:"m^3/s",fixed:["head 1.0 m","voltage"]},measurements:["opening change 0.080 m","returned residual 0.000 m"],restore:{required:true,setting:"zero command",remeasure:true},correct_conclusion:"PASS",answerText:"The inverse sensitivity is 0.040 m/(m^3/s), so a 2.0 m^3/s step predicts 0.080 m; the measured change and zero residual pass."}
    verify:
      prediction:
        min: 12.5
        max: 37.5
        step: 2.5
      truth: 25
      passRatio:
        - 0.95
        - 1.05
      measurement:
        label: independent measured value

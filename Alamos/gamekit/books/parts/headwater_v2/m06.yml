- title: "The Peak Test"
  card:
    header: "MISSION 6 - 10 WORK SHIFTS REMAIN BEFORE THE STORM."
    title: "Beyond the Old Horizon"
    goNow: "Go to Catchment & Inflow Desk and meet Imani Okoro, catchment hydrologist, at the high-ground gauge."
    body: "10 work shifts remain before the storm. A sealed high-ground trace rests under the old forecast. Today you decide which forecast earns use for the storm."
    objective: "Select the forecast that survives unseen data."
  objective: "Select the forecast that survives unseen data."
  stake: "10 work shifts remain before the storm. A sealed high-ground trace rests under the old forecast. Today you decide which forecast earns use for the storm."
  takeaway: "Evidence must match the mechanism, units, and stated limits. ---"
  segue: "Therefore Leila must total the larger storm before Mara can set the drawdown; the later peak adds water, not just time."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-catchment-inflow-desk
    # On arrival at Catchment & Inflow Desk | trace-bench | automatic
    on: { enter: true, at: INFLOW }
    world: "A sealed high-ground trace rests under the old forecast."
    panel: "INFLOW"
    # unlocks: Unlock Stop 21 at trace-bench in Catchment & Inflow Desk.
    bubbles:
    - who: okoro   # Imani Okoro
      say: "Start with the indeterminate-rate check. We now have the derivative tools to test the replacement forecast properly."
  - id: after-stop-21
    # After Stop 21 | high-ground-gauge | automatic
    on: { after: [1] }
    world: "At trace-bench, the dated accepted-result slip for Stop 21 reads: \"L=0.020 m/h.\". The slip remains in that fixture's evidence holder."
    panel: "INFLOW"
    # unlocks: Unlock Stop 22 at high-ground-gauge in Catchment & Inflow Desk.
    bubbles:
    - who: okoro   # Imani Okoro
      say: "That check holds. The failed rational forecast needs comparison with a bounded alternative across the full forecast window."
  - id: after-stop-22
    # After Stop 22 | forecast-drawer | automatic
    on: { after: [2] }
    world: "At high-ground-gauge, the dated accepted-result slip for Stop 22 reads: \"t=4, 36.850 mm/h, tolerance .01.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 22 RECORDED - STOP 23 OPEN"
    # unlocks: Unlock Stop 23 at forecast-drawer in Catchment & Inflow Desk.
    bubbles:
    - who: okoro   # Imani Okoro
      say: "That check holds. The alternative forecasts must be frozen before the archived crest is revealed."
  - id: after-stop-23
    # After Stop 23 | gauge-wall | automatic
    on: { after: [3] }
    world: "At forecast-drawer, the dated accepted-result slip for Stop 23 reads: \"B.\". The slip remains in that fixture's evidence holder."
    panel: "ARCHIVE"
    # unlocks: Unlock Stop 24 at gauge-wall in Catchment & Inflow Desk.
    bubbles:
    - who: okoro   # Imani Okoro
      say: "That check holds. The holdout result favors one forecast, but the crew still needs to understand the other's failure."
  - id: at-mission-end
    # At mission end | trace-bench | automatic
    on: { missionEnd: true }
    world: "At forecast-drawer, Imani Okoro files the failed forecast under MISSED LATER CREST. The dated prop remains here on later visits."
    panel: "ARCHIVE"
    # unlocks: Open the mission outcome and metric screen.
    bubbles:
    - who: okoro   # Imani Okoro
      say: "I wanted a shifted clock. The mountain sent more water. Therefore Leila must total the larger storm before Mara can set the drawdown; the later peak adds water, not just time."

  terms:
  - {name: "L'Hopital's rule", def: "when a limit has the indeterminate form 0/0 or infinity/infinity, differentiate the numerator and denominator separately and take the new limit, provided that new limit exists."}
  - {name: "Residual", def: "observed value minus model prediction."}
  - {name: "Holdout data", def: "observations hidden until a model is frozen."}
  # The optional review, offered when the mission is finished and graded
  # nowhere. GENERATED by tools/bible-deeper.mjs from the campaign bible.
  deeper:
    intro: "Try six independent practice questions. Each includes its own context and any needed data; no mission records are required."
    questions:
    - prompt: "For the function f(x)=2+1/(x+1), what horizontal asymptote is approached as x increases without bound?"
      hint: "Find the limit of the reciprocal term as x grows."
      answer: "D"
      figure: {"kind":"line","xLabel":"x","yLabel":"f(x)","caption":"f(x)=2+1/(x+1), shown for x≥0","series":[{"name":"f(x)","points":[[0,3],[1,2.5],[2,2.3333333333333335],[3,2.25],[4,2.2],[5,2.1666666666666665],[6,2.142857142857143]]}]}
      options:
      - {key: "A", text: "y=0.", why: "Only the reciprocal term approaches zero; the constant 2 remains."}
      - {key: "B", text: "x=-1.", why: "That is a vertical asymptote, not a horizontal one."}
      - {key: "C", text: "y=3.", why: "3 is the value at x=0, not the long-run limit."}
      - {key: "D", text: "y=2.", why: "Correct. y=2."}
    - prompt: "A model has the residuals shown. Residual means observed value minus predicted value. Which conclusion best fits the pattern?"
      hint: "Use the sign of observed minus predicted and check for a pattern."
      answer: "A"
      figure: {"kind":"line","xLabel":"Input value","yLabel":"Observed minus predicted (units)","caption":"Residuals from a fitted model","series":[{"name":"Residual","points":[[0,0],[1,2],[2,4],[3,6],[4,8]]}]}
      options:
      - {key: "A", text: "The model increasingly underpredicts as the input grows.", why: "Correct. The model increasingly underpredicts as the input grows."}
      - {key: "B", text: "The model increasingly overpredicts.", why: "Positive residuals mean observations exceed predictions, not the reverse."}
      - {key: "C", text: "The errors have no relation to the input.", why: "Residuals rise systematically with the input."}
      - {key: "D", text: "The model fits every observation exactly.", why: "An exact fit would have zero residual at every point."}
    - prompt: "The predictions were frozen before the plotted test observations were revealed. Why is this comparison useful?"
      hint: "Ask whether the model could have been tuned to these test values."
      answer: "B"
      figure: {"kind":"line","xLabel":"Input","yLabel":"Response (units)","caption":"Predictions fixed before test observations were revealed","series":[{"name":"Frozen prediction","points":[[0,2],[1,4],[2,6]]},{"name":"Held-out observation","points":[[0,2.1],[1,3.9],[2,6.2]]}]}
      options:
      - {key: "A", text: "It proves the model is exact for all possible inputs.", why: "Agreement at these inputs cannot establish universal correctness."}
      - {key: "B", text: "It tests prediction on data that did not set the model.", why: "Correct. It tests prediction on data that did not set the model."}
      - {key: "C", text: "It makes the test observations part of the training data retroactively.", why: "The prediction was fixed without using these observations."}
      - {key: "D", text: "It removes all uncertainty from the observations.", why: "Withholding data does not eliminate measurement uncertainty."}
    - prompt: "Evaluate lim(t→0)(e^(0.04t)-1)/t. If using L'Hôpital's rule, differentiate the numerator and denominator separately."
      hint: "The derivative of e^(at) is ae^(at)."
      answer: "C"
      options:
      - {key: "A", text: "0.", why: "The form 0/0 is indeterminate, not a result."}
      - {key: "B", text: "1.", why: "Differentiating e^(0.04t) also gives the factor 0.04."}
      - {key: "C", text: "0.04.", why: "Correct. 0.04."}
      - {key: "D", text: "The limit is infinite.", why: "The numerator approaches zero at the same first-order rate as 0.04t."}
    - prompt: "For S(t)=12 arctan(t-4), at which t is S′(t) largest?"
      hint: "Maximize 12/[1+(t-4)²] by minimizing its positive denominator."
      answer: "D"
      figure: {"kind":"line","xLabel":"t","yLabel":"S(t)","caption":"S(t)=12 arctan(t−4), with angles in radians","series":[{"name":"S(t)","points":[[0,-15.909811964016392],[1,-14.988549268779053],[2,-13.285784613529085],[3,-9.42477796076938],[4,0],[5,9.42477796076938],[6,13.285784613529085],[7,14.988549268779053],[8,15.909811964016392]]}]}
      options:
      - {key: "A", text: "t=0.", why: "The denominator 1+(t-4)² is not smallest at 0."}
      - {key: "B", text: "t=8.", why: "At 8 the slope has already decreased from its midpoint value."}
      - {key: "C", text: "The slope is constant.", why: "S′=12/[1+(t-4)²] varies with t."}
      - {key: "D", text: "t=4.", why: "Correct. t=4."}
    - prompt: "A model has the residuals shown. Residual means observed value minus predicted value. Which conclusion best fits the pattern?"
      hint: "Use the sign of observed minus predicted and check for a pattern."
      answer: "A"
      figure: {"kind":"line","xLabel":"Input value","yLabel":"Observed minus predicted (units)","caption":"Residuals from a fitted model","series":[{"name":"Residual","points":[[0,0],[1,2],[2,4],[3,6],[4,8]]}]}
      options:
      - {key: "A", text: "The model increasingly underpredicts as the input grows.", why: "Correct. The model increasingly underpredicts as the input grows."}
      - {key: "B", text: "The model increasingly overpredicts.", why: "Positive residuals mean observations exceed predictions, not the reverse."}
      - {key: "C", text: "The errors have no relation to the input.", why: "Residuals rise systematically with the input."}
      - {key: "D", text: "The model fits every observation exactly.", why: "An exact fit would have zero residual at every point."}

  equations:
  - {"e":"If L=lim_(t->a)N(t)/D(t) has the form 0/0 or infinity/infinity, then L=lim_(t->a)N'(t)/D'(t) when the new limit exists.","c":"resolving an allowed indeterminate ratio after differentiation has been introduced.","v":[["L","the limit"],["N","the numerator"],["D","the denominator"]],"s":"the replacement forecast has an undefined ratio at its start even though its limiting rise rate is finite."}
  - {"e":"residual=observed-predicted","c":"exposing patterned model failure.","v":[["observed","measurement"],["predicted","fitted value"]],"s":"unseen gauge data decides between forecasts."}
  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 6: worked examples"
    examples:
    - {"title":"Resolve an exponential limit","problem":"Find L=lim(x→0)(e^(3x)-1)/x.","rule":"L'Hopital's rule applies here because substitution gives 0/0 and the differentiated ratio has a limit.","steps":["Set up the relationship: L'Hopital's rule applies here because substitution gives 0/0 and the differentiated ratio has a limit.","L=lim(x→0)3e^(3x)/1=3. Numerator and denominator are differentiated separately."],"answer":"The limit is 3.","mistake":"The quotient rule is not the operation used in L'Hopital's rule."}
    - {"title":"Resolve a ratio at infinity","problem":"Find L=lim(x→∞)x/e^x.","rule":"The ratio has the form ∞/∞; L'Hopital's rule can be applied when its hypotheses hold.","steps":["Set up the relationship: The ratio has the form ∞/∞; L'Hopital's rule can be applied when its hypotheses hold.","L=lim(x→∞)1/e^x=0. The exponential denominator grows without bound."],"answer":"The ratio approaches 0.","mistake":"Infinity divided by infinity is not automatically 1."}
    - {"title":"Read derivative signs","problem":"A function has f′(x)>0 and f″(x)<0 throughout an interval. Describe its graph.","rule":"The first derivative gives direction of change; the second gives change in slope.","steps":["f′>0 means the function rises as x increases.","f″<0 means those positive slopes become smaller."],"answer":"The function is increasing and concave down.","mistake":"Concave down does not necessarily mean decreasing."}
    - {"title":"A measurement minus a prediction","problem":"A thermometer model predicts 20 °C; an independent thermometer reads 22 °C. Find the residual.","rule":"Residual = observed value - predicted value.","steps":["residual = 22 °C - 20 °C. Keep observed first.","residual = +2 °C. The positive sign means the observation is above the prediction."],"answer":"The model underpredicts this reading by 2 °C.","mistake":"Reversing the subtraction reverses the meaning of the sign."}
    - {"title":"Test a frozen prediction","problem":"Before seeing a new measurement, a model predicts 12 units with an allowed error of 1 unit. The new measurement is 15 units. Does it pass this test?","rule":"Absolute prediction error = |observed - predicted|.","steps":["absolute error = |15-12| = 3 units. The prediction remains fixed.","comparison = 3 > 1. The error exceeds the prewritten tolerance."],"answer":"The model fails this held-out test.","mistake":"Refitting to 15 before scoring would no longer test the original prediction."}

  stops:
  # --- Stop 21: Classify forecast breaks
  #     Concept: asymptotes/L'Hopital; Keystone: Limits; Area: Storage & Level Board; Learning role: RETRIEVE; Difficulty: L3; Story role: clue.
  #     placement: DERIVE, at trace-bench.
  - group: STORE
    at: trace-bench
    title: "Check the indeterminate rate"
    concept: 10   # L'Hopital's rule
    reason: "The crew can now use differentiation to resolve the replacement forecast's undefined starting rate."
    scene: "The inflow forecast stalls at the start time. The crew needs the value the model approaches before it can use the curve."
    motivation: "The initial rate limit establishes whether the exponential forecast begins with a finite reservoir-rise prediction."
    format: BALLPARK
    question: "Find lim(t→0)(e^(0.02t)−1)/t in m/h. Both numerator and denominator approach zero; use their derivatives to fill the numerator and denominator of the limiting ratio."
    answerText: "The replacement forecast begins with a finite limiting rise rate of 0.020 m/h."
    why: "The original ratio has the indeterminate form 0/0, and the differentiated ratio approaches 0.02/1."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Equal polynomial degrees approach the ratio of leading coefficients; an oblique asymptote would require numerator degree one greater and long division.
    # correct result: exact.
    # state/output: first model rejected; unlock 6.2.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{goal:"asymptotes",givens:["R=(3t^2+1)/(t^2-4)"],lines:[{expressions:["t=+-2","t=4"],correct:"t=+-2",rules:["denominator zero with nonzero numerator","numerator zero"],correct_rule:"denominator zero with nonzero numerator"},{expressions:["lim=3","lim=0"],correct:"lim=3",rules:["divide by t^2 / compare degrees","use denominator roots"],correct_rule:"divide by t^2 / compare degrees"}],answerText:"Vertical asymptotes t=+-2; horizontal asymptote R=3."}
    estimate:
      prompt: divide N'(0) by D'(0)
      question: limiting starting rise rate L
      labels:
        - 0.02 m/h  (N'(0), numerator derivative at t=0)
        - 1 dimensionless  (D'(0), denominator derivative)
      values:
        - 0.02
        - 1
      slots: 2
      template: L={0}/{1}
      formula: L=0.02/1
      correct:
        - 0
        - 1
      target: 0.02
      tolerance: 0.0001
      units: m/h

  # --- Stop 22: Read inverse-shaped saturation
  #     Concept: arctan derivative/asymptote; Keystone: Chain/inverse; Area: Storage & Level Board; Learning role: RETRIEVE; Difficulty: L3; Story role: evidence.
  #     placement: SWEEP, at high-ground-gauge.
  - group: STORE
    at: high-ground-gauge
    title: "Read inverse-shaped saturation"
    concept: 6   # arctan derivative/asymptote
    reason: "The failed rational forecast needs comparison with a bounded alternative across the full forecast window."
    scene: "Because the rational forecast blows up, sweep the displayed saturating forecast from time zero through ten hours. Record where its slope is largest and the horizontal value it approaches as time grows."
    motivation: "The maximum slope and limiting rainfall rate identify the replacement model's fastest change and long-term ceiling."
    format: SWEEP
    question: "Sweep t from 0 through 10 h in 0.5 h steps, collect readings across the interval, and submit the maximum-slope time in hours plus the upper asymptote in mm/h."
    answerText: "S'=12/[1+(t-4)^2], largest at 4; arctan -> pi/2."
    why: "S'=12/[1+(t-4)^2], largest at 4; arctan -> pi/2. A smooth saturating curve can represent a storm band without an artificial infinite spike."
    # wrong-path feedback, one rebuttal per wrong option:
    #   The function's maximum slope and maximum value are different.
    # correct result: t=4, 36.850 mm/h, tolerance .01.
    # state/output: travel to ARCHIVE.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   sweep:{control:"t",min:0,max:10,step:0.5,unit:"h",response:"S(t) mm/h",required_points:[0,4,8,10],correct_conclusion:"maximum slope at t=4; upper asymptote 18+6pi=36.850 mm/h"}.
    sweep:
      axis:
        label: time t
        min: 0
        max: 10
        step: 0.5
      response:
        - at: 0
          value: 0.706
        - at: 2
          value: 2.4
        - at: 4

    answerText: "A misses the crest in a systematic direction. Both prediction sets were fixed before the readings appeared, so comparing them is an out-of-sample model comparison."
    why: "B residuals [0,1,0,1]; A residuals [4,11,12,10] form a missed crest. A model that fits training data but misses a patterned holdout crest cannot guide release."

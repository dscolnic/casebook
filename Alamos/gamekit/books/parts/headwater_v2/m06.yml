    title: "Beyond the Old Horizon"
    goNow: "Go to Catchment & Inflow Desk and meet Imani Okoro, catchment hydrologist, at the high-ground gauge."
    body: "The average-based release plan is unsafe, and a newly installed high-ground gauge now sees rain hidden from radar. Asymptotes and derivative sign charts reveal long-run behavior and peaks without trusting a pretty fit. At the gauge and archive, compare rival hydrographs and their residuals. By the end of the mission, decide which inflow forecast controls the drawdown."
    objective: "Select the forecast that survives unseen data."
  objective: "Select the forecast that survives unseen data."
  stake: "The average-based release plan is unsafe, and a newly installed high-ground gauge now sees rain hidden from radar. Asymptotes and derivative sign charts reveal long-run behavior and peaks without trusting a pretty fit. At the gauge and archive, compare rival hydrographs and their residuals. By the end of the mission, decide which inflow forecast controls the drawdown."
  takeaway: "Evidence must match the mechanism, units, and stated limits. ---"
  segue: "Mission decision: Use Forecast B. It stays finite, predicts a later crest. And survives unseen high-ground data. The old model missed the peak rather than suffering a constant bias. More water is coming, so the crew must total the full storm volume."


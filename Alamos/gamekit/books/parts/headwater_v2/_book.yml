glossary:
- name: Calibration
  aliases: [calibration, calibrate, calibrated, calibrating]
  def: Checking an instrument against something already known, so its readings can be trusted.
- name: Reservoir
  aliases: [reservoirs]
  def: The body of water held behind the dam, whose level rises when more arrives than leaves.
- name: Inflow
  aliases: [inflows]
  def: The water arriving at the reservoir from the catchment, second by second.
- name: Flow rate
  aliases: [flow, flows]
  def: How much water passes a point each second, measured in cubic metres a second.
- name: Outflow
  aliases: [outflows, release]
  def: The water leaving — through the turbines, over the spillway, or both. It is the only part anybody 
    controls.
- name: Catchment
  aliases: [catchments]
  def: The ground whose rain ends up here. Anything that falls on it eventually arrives at the reservoir.
- name: Curve
  aliases: [curves]
  def: A plotted relation between two measured quantities, read off rather than calculated.
- name: Flood
  aliases: [floods]
  def: A flow large enough to reach what is beside the river. It is the event this dam is run against.
- name: Peak
  aliases: [peaks]
  def: The most water passing in one event, and the moment it stops climbing.
- name: Hydrograph
  aliases: [hydrographs]
  def: A plot of flow against time. Its climb, its peak and its fall are the shape of one flood.
- name: Rate of change
  aliases: [rate of rise, derivative]
  def: How fast a quantity is moving, at an instant — the slope of its graph rather than its value.
- name: Accumulation
  aliases: [accumulate, accumulated, integral]
  def: What builds up over time from a rate — for a reservoir, the volume the difference between two rates has
    added.
- name: Stage
  aliases: [level, water level]
  def: The height of the water surface, measured against a fixed datum. It is what a gauge reads.
- name: Stage-storage curve
  aliases: [stage–storage, storage curve, rating curve]
  def: The surveyed relation between level and volume. Every volume the control room reports comes through it.
- name: Surface area
  aliases: [plan area]
  def: How much of the reservoir the water covers at a given level. It grows as the reservoir fills.
- name: Head
  aliases: []
  def: The height of water above a sill or a turbine, which is what drives water through it.
- name: Spillway
  aliases: [spill, spilling]
  def: The controlled overflow a dam is built with, for water that must leave faster than the machines can 
    pass it.
- name: Discharge
  aliases: [discharges]
  def: A flow rate through a particular opening, in cubic metres a second.
- name: Chain rule
  aliases: []
  def: When a quantity changes because another one does, its rate carries the inner quantity's rate as a 
    factor.
- name: Related rates
  aliases: [related rate]
  def: Two quantities tied by a relation, so that knowing how fast one moves fixes how fast the other does.
- name: Fundamental theorem
  aliases: [fundamental theorem of calculus]
  def: The area under a rate, between two times, is the total change over that interval.
- name: Average value
  aliases: [mean rate]
  def: The steady rate that would produce the same accumulation over the same interval.
- name: Linear approximation
  aliases: [linearisation, rule of thumb]
  def: Predicting nearby values from the rate at one point. It is good close by and worse further off.
- name: Second derivative
  aliases: [curvature, rate of the rate]
  def: How fast a rate is itself changing — what says whether a climb is getting quicker or slacker.
- name: Inflection
  aliases: [inflection point]
  def: Where a climb stops getting quicker and starts slackening.
- name: Trapezoid rule
  aliases: [trapezoidal, numerical integration]
  def: Adding up the area under readings by treating each pair as a trapezium. What you use when there is no 
    formula.
- name: Optimisation
  aliases: [optimise, optimum]
  def: Working out where a quantity is largest or smallest — at a turning point, or at the end of the range.
- name: Limit
  aliases: [limits, one-sided limit]
  def: The value a quantity closes on as its input closes on a number, whether or not it ever arrives there.
- name: Difference quotient
  aliases: [average rate of change, secant slope]
  def: The change in a quantity divided by the change in time. Its limit, as that interval shrinks, is the 
    derivative.
- name: Continuous
  aliases: [continuity, continuously]
  def: Having no jumps — every value in between is reached. A derivative needs it, and a trace that steps does
    not have it.
- name: Critical point
  aliases: [critical points, turning point]
  def: Where a derivative is zero or does not exist. A largest value sits at one of these or at a boundary of 
    the range.
- name: Concave
  aliases: [concavity, concave down, concave up]
  def: Which way a curve is bending. The sign of the second derivative reports it, everywhere at once.
- name: Antiderivative
  aliases: [antidifferentiate, antidifferentiating, indefinite integral]
  def: A quantity whose derivative is the one you started from. Every rate has a family of them, differing by 
    a constant.
- name: Constant of integration
  aliases: [the constant C]
  def: What is left undetermined when a rate is turned back into a total. Only a measurement pins it down, 
    which is why one reading is not always enough.
- name: Definite integral
  aliases: [definite integrals]
  def: A total gathered across a stated interval, worked out by subtracting the value at one limit from the 
    value at the other.
- name: Riemann sum
  aliases: [left sum, right sum, endpoint sum]
  def: A sum of rectangles standing under a curve, used to approximate the area beneath it. On a rising rate 
    the left one is short and the right one too big.
- name: Substitution
  aliases: [substitute, substituting]
  def: Rewriting an awkward expression in a new variable, so that what is left can be handled by an ordinary 
    rule.
- name: Separable
  aliases: [separate the variables, separating]
  def: An equation whose two quantities can be moved onto opposite sides, so that each side can be worked on 
    its own.
- name: Exponential decay
  aliases: [decay, recession constant]
  def: What a rate proportional to the quantity itself produces. It drops by the same fraction in every equal 
    interval.
- name: Implicit differentiation
  aliases: [implicitly]
  def: Differentiating a relation as it stands, without solving it first. Every quantity in it carries its own
    rate.
- name: Product rule
  aliases: []
  def: The rate of a product of two changing quantities is a sum of two terms, each holding one of them still.
- name: Power rule
  aliases: []
  def: The derivative of a power brings its own exponent down as a factor and reduces it by one.
- name: Indeterminate form
  aliases: [zero over zero]
  def: A quotient that comes out as nothing over nothing. It still has a value, and reaching it takes work.
- name: Differential
  aliases: [differentials]
  def: A rate multiplied by a small step, used to work out the change that rate produces nearby.
- name: Accumulation function
  aliases: [running total, accumulation curve]
  def: A running total from a start that stays put to a moment that moves. Its rate of change is whatever was 
    arriving at that moment.
- name: Held-out data
  aliases: [holdout, held back]
  def: Readings kept back while a rule is chosen, so the rule can be scored on something it has never seen.
- name: Freeboard
  aliases: []
  def: The height left between the water surface and the top of the dam. It is the margin everything else is 
    spent on.
- name: Uplift
  aliases: []
  def: Water pressure under the base of a dam, pushing up. It grows with the reservoir and is measured in the 
    gallery.
- name: Seepage
  aliases: [seep, seeps]
  def: Water that gets through or under the wall, collected in drains and measured at weirs.
- name: Travel time
  aliases: [arrival time]
  def: How long a release takes to reach a place downstream. It is what turns a decision into a warning.
- name: Attenuation
  aliases: [attenuate, attenuates]
  def: The flattening of a peak as it moves downstream, because the channel takes some in and returns it 
    later.
- name: Routing
  aliases: [route, routed]
  def: Working out hour by hour what a reservoir or a channel does to a wave that moves through it.
- name: Sediment
  aliases: [silt, siltation]
  def: What the rivers bring in and leave behind. It takes up volume that used to be water.


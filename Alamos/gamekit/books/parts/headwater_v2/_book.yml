# Headwater — Ashfell Dam, and nine days of rain forecast in the catchment.
#
# Written to gamekit/tools/BOOK_TEMPLATE.md. The place is themes/headwater/plan.js
# — four levels inside the wall — and the arc is in ../GAME_IDEAS.md under
# "Headwater".
#
# **The subject is calculus. The dam is where it is being done.** Every stop
# names the move it teaches — a limit, a rule, an antiderivative, a solved
# equation — and the reservoir supplies the quantities, the units and the reason
# anybody wants the number. The syllabus is AP Calculus AB, mapped day by day in
# tools/syllabus.js under `headwater`, and a stop that teaches no move on that
# list does not go in however good the hydrology is.
#
# The earlier rule here was "no question whose answer is a symbolic expression
# with nothing at stake", and it was obeyed by dropping the symbols: 26 of 45
# stops became prose judgement about a dam and the course disappeared. The rule
# it is replaced by is adaptable in the way the first one was not, because it
# admits more than one way of paying for a symbol:
#
#   A stop earns its place if it teaches a named calculus move AND the move is
#   consequential in at least one of these senses —
#     · **numerical** — the working ends in a number somebody acts on;
#     · **directional** — getting it wrong changes a sign, a units factor or an
#       order of magnitude, and the verdict says which;
#     · **structural** — the move decides what kind of answer exists at all
#       (no rate here, a family rather than a value, an endpoint rather than a
#       critical point);
#     · **procedural** — the move is a discipline that survives the setting
#       (holding out data, converting limits with the variable, measuring what
#       you predicted).
#   A symbolic answer is welcome. A symbolic answer with none of the four is not.
#
# Every wrong branch names the mistake a student actually makes, and DERIVE's
# `survives` flag is where that is enforced: at least one wrong line per step
# stays algebraically valid, because a derivation whose errors die at once is
# passable without differentiating.
#
# The argument: Halloran holds that water released in March cannot be recovered
# and a dry summer is a real harm with a real cost. Berg holds that headroom is
# only cheap before it rains. Berg is right on day 4. Halloran is right on day 12.
#
# ## The arc, one line a day (STORY_SPEC rule 9), each a But or a Therefore
#
# Written down before the closing cards were, because a reversal planted on day
# 10 has to be a visible thread on day 1 and that cannot be seen from inside one
# card.
#
#   1  Ashfell is nearly full with nine days of rain coming, and every number on
#      the dam is a reading rather than a rate.
#   2  THEREFORE the three relations the place is run from have to be read as
#      rates, and the rain starts while they are being differentiated.
#   3  BUT what the front leaves overnight is a column of numbers and no formula,
#      so the total has to be built by hand and every way of building it leans.
#   4  THEREFORE the release Berg asked for on Monday becomes a much larger
#      four-hour ramp, into a river with people on it. Berg is right.
#   5  BUT the head has climbed past where the rating curve was tested, and the
#      curve tying level to volume cannot be rearranged at all.
#   6  THEREFORE the only honest news left is in the second derivative — the
#      steps up have stopped growing — and the two peaks are not the same hour.
#   7  BUT three people want a largest value and the three answers do not live in
#      the same kind of place.
#   8  THEREFORE the week is reduced to one equivalent steady rate, so the
#      early-release argument can finally be compared with what actually arrived.
#   9  BUT the outlet is draining the head that drives it, and one six-hour-old
#      reading is being asked to name the constant.
#   10 THEREFORE when the survey boat comes in, the shape under all of it is
#      wrong: the 2003 curve overstates the area at every level. THE REVERSAL,
#      and it is a measurement rather than an event.
#   11 BUT nothing has to be decided before lunch, which is the only condition
#      under which a prediction can be checked against a measurement.
#   12 THEREFORE with the front gone north the reservoir is short going into
#      summer, and what is left to fit is the recession. Halloran is right.
#   13 BUT three jobs close before the nine o'clock call, and the region the
#      committee wants to read as a total is a difference with a sign in it.
#   14 THEREFORE the last orders that can be unmade are tested against rate of rise
#      and the lead time downstream people actually need.
#   15 THEREFORE what survives is not the water but what can be defended in
#      writing.
#
# The recurring human thread, deliberately OFF the roster so nothing collides
# with checkNames: Ada Trenholme at Nethercote Ford, the lowest house on
# Baptiste's list and four hours down the river, and her grandson Kit Trenholme,
# who moves her ewes off the low meadow every time a warning goes out. She is
# rung on day 1, cleared on day 4 (Berg right), and cleared a second time for
# water that never arrives (Halloran right); the note of what those two warnings
# cost is what Prowse carries into the committee on day 15. The 1983 flood is
# hers, which is why Prowse's committee is a list of the people who stayed.


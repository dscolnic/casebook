      - {key: "B", text: "Two parameter choices fitting the same evidence.", why: "This describes degeneracy. It does not answer the question about propagated error."}
      - {key: "C", text: "Output uncertainty caused by input uncertainty.", why: "Correct. Output uncertainty caused by input uncertainty."}
      - {key: "D", text: "2.0*.015=.030<.10; improve level. Only an error large enough to consume the margin can reverse authorization.", why: "This describes linear approximation and error budget. It does not answer the question about propagated error."}

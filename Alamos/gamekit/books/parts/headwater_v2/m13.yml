  equations:
  - {"e":"Delta f approximately f'(a)Delta x","c":"carrying small input error into output.","v":[["Delta","means change"],["f'(a)","local sensitivity"]],"s":"level uncertainty becomes volume uncertainty."}
  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 13: worked examples"
    examples:
    - {"title":"Approximate a nearby square root","problem":"Estimate sqrt(4.04) using f(x)=sqrt(x) near x=4.","rule":"L(x)=f(4)+f′(4)(x-4), and f′(x)=1/(2sqrt(x)).","steps":["Set up the relationship: L(x)=f(4)+f′(4)(x-4), and f′(x)=1/(2sqrt(x)).","L(4.04)=2+(1/4)(0.04)=2.01."],"answer":"sqrt(4.04)≈2.01, a local linear approximation.","mistake":"An approximation is not an exact equality for the original nonlinear function."}
    - {"title":"Propagate a small radius error","problem":"A circle has r=10 cm with small uncertainty ±0.1 cm. Estimate area uncertainty.","rule":"For A=πr², dA≈2πr dr.","steps":["Set up the relationship: For A=πr², dA≈2πr dr.","|dA|≈2π(10)(0.1)=2π cm²; relative error≈2(0.1/10)=2%."],"answer":"The approximate area uncertainty is ±2π cm², or ±2%.","mistake":"This differential estimate is local, not an exact finite-error calculation."}
    - {"title":"A measurement minus a prediction","problem":"A thermometer model predicts 20 °C; an independent thermometer reads 22 °C. Find the residual.","rule":"Residual = observed value - predicted value.","steps":["residual = 22 °C - 20 °C. Keep observed first.","residual = +2 °C. The positive sign means the observation is above the prediction."],"answer":"The model underpredicts this reading by 2 °C.","mistake":"Reversing the subtraction reverses the meaning of the sign."}
    - {"title":"Separate a fitted product","problem":"A rectangle has area 24 cm². Can area alone determine its length and width?","rule":"Area = length × width. One equation may leave more than one unknown pair.","steps":["24 = 6×4 and 24 = 8×3. Both pairs have the correct area.","If width is independently measured as 4 cm, length = 24/4 = 6 cm."],"answer":"Area alone is insufficient; the additional width measurement selects 6 cm by 4 cm.","mistake":"One matching output does not identify both input parameters."}
    - {"title":"Test an entire allowed range","problem":"A component must operate at or below 80 °C. Its estimated temperature is 77 ± 4 °C. Does every allowed value pass?","rule":"Test the worst allowed value against the stated bound.","steps":["allowed interval = [77-4, 77+4] = [73,81] °C.","maximum allowed temperature = 81 °C > 80 °C. At least one allowed value fails."],"answer":"The estimate does not establish that every allowed temperature passes.","mistake":"Checking only the central estimate ignores the uncertainty."}

  stops:
  # --- Stop 49: Linearize level error
  #     Concept: linear approximation/error budget; Keystone: Approximation; Area: Forecast Archive; Learning role: RETRIEVE; Difficulty: L4; Story role: foundation.
  #     placement: PROPAGATE, at level-desk.
  - group: ARCHIVE
    at: level-desk
    title: "Linearize level error"
    concept: 9   # linear approximation/error budget
    reason: "The revised storage curve still carries level-measurement error that could consume the remaining release margin."
    scene: "The corrected storage curve still carries measurement uncertainty. The crew has two inspection points to reduce the total error before relying on the release margin."
    motivation: "The propagated volume uncertainty determines whether the drawdown margin survives the gauge's height error."
    format: PROPAGATE
    question: "Compute the level contribution |ΔV|=|dV/dh|σh, then choose the affordable upgrade plan giving the smallest combined uncertainty. Use root-sum-square for these independent contributions; submit the plan and combined uncertainty in million m³."
    answerText: "Before upgrading, the combined error is about 0.03187 million m³. Improving level gives about 0.01847; improving both flow and clock gives about 0.03017. The margin survives either way, but level is the best uncertainty reduction."
    why: "2.0*.015=.030<.10; improve level. Only an error large enough to consume the margin can reverse authorization."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Sensitivity carries units.
    # correct result: +-0.030 million m^3; margin survives.
    # state/output: error bar; unlock 13.2.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   propagate:{budget:1,error_terms:[{id:"level",sigma:.015,sensitivity:2.0,output:.030},{id:"flow",sigma:.002,sensitivity:5,output:.010},{id:"clock",sigma:.001,sensitivity:4,output:.004}],purchase_options:[{id:"level",cost:1,reduction:.015},{id:"flow",cost:1,reduction:.003},{id:"clock",cost:1,reduction:.001}],correct_purchase:"level",threshold:.10}
    propagate:
      inputs:
        - id: level
          label: Level measurement
          value: 2
          unit: million m³/m
          sigmaFrac: 0.015
          exponent: 1
        - id: flow
          label: Flow calibration
          value: 5
          unit: flow sensitivity
          sigmaFrac: 0.002
          exponent: 2
        - id: clock
          label: Clock timing
          value: 4
          unit: time sensitivity
          sigmaFrac: 0.001
          exponent: 1
      improvable:
        - id: level
          label: Level measurement
          cost: 2
          newSigmaFrac: 0.0075
        - id: flow
          label: Flow calibration
          cost: 1
          newSigmaFrac: 0.0006
        - id: clock
          label: Clock timing
          cost: 1
          newSigmaFrac: 0.00025
      dominant: level
      costUnit: inspection points
      budget: 2

  # --- Stop 50: Refuse the lowest RMS
  #     Concept: approximation error/sum accuracy; Keystone: Approximation; Area: Forecast Archive; Learning role: COMBINE; Difficulty: L4; Story role: clue payoff.
  #     placement: RESIDUAL, at storage-board.
  - group: ARCHIVE
    at: storage-board
    title: "Refuse the lowest RMS"
    concept: 25   # approximation error/sum accuracy
    reason: "Acceptable gauge uncertainty leaves the accumulation method itself to be checked against independent totals."
    scene: "Because level error is tolerable, compare residuals from left, right, and trapezoidal accumulation against independent totals. Choose small, unpatterned errors instead of blindly taking the lowest root-mean-square (RMS) training error, which summarizes typical error size."
    motivation: "The residual patterns determine which numerical accumulation rule generalizes beyond its fitted data."
    format: RESIDUAL
    question: "Compare the three four-value residual arrays and their holdout residuals; submit one method ID and one conclusion about directional bias. Use ordered observation coordinates 1–5 on the residual axis."
    answerText: "small alternating residuals survive holdout; left/right directional errors track changing curve."
    why: "small alternating residuals survive holdout; left/right directional errors track changing curve. A repeated sign would push every release decision in the same unsafe direction."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Method accuracy depends on increase and concavity, not label.
    # correct result: trapezoid.
    # state/output: trapezoid default; waypoint STRUCT.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   residual:{fields:[{id:"left",residuals:[-.12,-.10,-.11,-.09],rms:.106},{id:"right",residuals:[.13,.09,.12,.10],rms:.111},{id:"trap",residuals:[.01,-.02,.00,.01],rms:.012}],holdout:{left:-.14,right:.15,trap:.01},correct:"trap"}
    residual:
      fits:
        - id: patterned_low_error
          label: lower average error but patterned residuals
          rms: 0.18
          structured: true
          residuals:
            - x: 1
              y: -0.12
              value: -0.12
            - x: 2
              y: -0.06
              value: -0.06
            - x: 3
              y: 0
              value: 0
            - x: 4
              y: 0.06
              value: 0.06
            - x: 5
              y: 0.12
              value: 0.12
        - id: unpatterned_generalising
          label: slightly higher error with no directional pattern
          rms: 0.21
          residuals:
            - x: 1
              y: 0.05
              value: 0.05
            - x: 2
              y: -0.04
              value: -0.04
            - x: 3
              y: 0.02
              value: 0.02
            - x: 4
              y: -0.03
              value: -0.03
            - x: 5
              y: 0.01
              value: 0.01
      accept: unpatterned_generalising

  # --- Stop 51: Break the two-control degeneracy
  #     Concept: sensitivity/systematics; Keystone: Approximation; Area: Forecast Archive; Learning role: TRANSFER; Difficulty: L5; Story role: reveal.
  #     placement: DEGENERACY, at control-bench.
  - group: ARCHIVE
    at: control-bench
    title: "Break the two-control degeneracy"
    concept: 26   # sensitivity/systematics
    reason: "The accumulation check leaves offset and scale errors that can imitate each other in the level system."
    scene: "Adjust both, then add independent uplift geometry to isolate the physical pair."
    motivation: "The independent uplift geometry distinguishes the physical offset-scale pair from other pairs fitting the same readings."
    format: DEGENERACY
    question: "Use the two controls level offset b in metres and unitless storage scale s. Adjust b from -0.05 to 0.05 in 0.01 steps and s from 0.90 to 1.10 in 0.01 steps; apply both loci, then submit the numeric pair (b,s) before choosing a correction plan."
    answerText: "volume alone is degenerate; uplift fixes offset."
    why: "volume alone is degenerate; uplift fixes offset. A second physical constraint prevents two adjustable errors from sharing one apparent fix."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A good fit along one locus does not identify both controls.
    # correct result: (-.01 m,1.02).
    # state/output: Integrity lock eligible; waypoint INFLOW.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   degeneracy:{controls:[{id:"b",label:"level offset",min:-.05,max:.05,step:.01},{id:"s",label:"storage scale",min:.90,max:1.10,step:.01}],tolerance:.011,first_locus:[[-.05,1.10],[-.03,1.06],[-.01,1.02],[.01,.98],[.03,.94],[.05,.90]],second_locus:[[-.02,.98],[-.01,1.00],[0,1.02],[.01,1.04]],physical_constraint:"independent uplift geometry requires b=-.01 m",truth_pair:[-.01,1.02],correct_plan:"use resurvey correction"}
    degeneracy:
      controls:
      - {id: b, label: "level offset", min: -0.05, max: 0.05, step: 0.01}
      - {id: s, label: "storage scale", min: 0.90, max: 1.10, step: 0.01}
      locus:
      - {a: -0.05, b: 1.10}
      - {a: -0.03, b: 1.06}
      - {a: -0.01, b: 1.02}
      - {a: 0.01, b: 0.98}
      - {a: 0.03, b: 0.94}
      - {a: 0.05, b: 0.90}
      second:
        label: "independent uplift geometry requires b=-.01 m"
        locus:
        - {a: -0.02, b: 0.98}
        - {a: -0.01, b: 1.00}
        - {a: 0.00, b: 1.02}
        - {a: 0.01, b: 1.04}
      truth: {a: -0.01, b: 1.02}
      tolerance: {a: 0.011, b: 0.011}

  # --- Stop 52: Diagnose the signed rules
  #     Concept: cumulative calculus validity; Keystone: all keystones; Area: Forecast Archive; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: DIAGNOSIS, at storage-board.
  - group: ARCHIVE
    at: storage-board
    title: "Diagnose the signed rules"
    concept: 15   # cumulative calculus validity
    reason: "The separated calibration errors allow the crew to reconcile the earlier findings into one release-rule set."
    scene: "With offset and scale separated, review continuity, holdout crest, storage residuals, seepage decay, and gate reversal. Select the one release-rule set that fits every reading and preserves the downstream threshold."
    motivation: "The joint diagnosis determines which signed rules fit the forecast, storage, seepage, and gate evidence together."
    format: DIAGNOSIS
    question: "Compare every candidate rule set with all five displayed readings, then submit exactly one rule-set label."
    answerText: "all independent constraints align."
    why: "all independent constraints align. The signed rules must be one coherent model, not a collection of individually convenient results."
    # wrong-path feedback, one rebuttal per wrong option:
    #   The alternatives each conflict with at least one independent record: the holdout crest, resurveyed capacity, or verified work-and-warning limits.
    # correct result: first.
    # state/output: corrected rules signed; Integrity locks at 100.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   diagnosis:{headline:"corrected release rules",readings:[{zone:"level",value:"continuous after one removable repair"},{zone:"inflow",value:"Forecast B passes holdout"},{zone:"storage",value:"resurvey pair (-.01,1.02)"},{zone:"wall",value:"decay below limit"},{zone:"gate",value:"reversal pass"}],choices:[{label:"B forecast + resurvey + staged gate",mechanism:"fits all"},{label:"A forecast + old sheet",mechanism:"misses crest and silt"},{label:"B + old sheet",mechanism:"wrong capacity"},{label:"B + resurvey + full gate",mechanism:"breaks warning/work limits"}],answer:"B forecast + resurvey + staged gate"}
    headline: "corrected release rules"
    readings:
    - {zone: "level", value: "continuous after one removable repair"}
    - {zone: "inflow", value: "Forecast B passes holdout"}
    - {zone: "storage", value: "resurvey pair (-.01,1.02)"}
    - {zone: "wall", value: "decay below limit"}
    - {zone: "gate", value: "reversal pass"}
    choices:
    - {label: "B forecast + resurvey + staged gate", mechanism: "fits all"}
    - {label: "A forecast + old sheet", mechanism: "misses crest and silt"}
    - {label: "B + old sheet", mechanism: "wrong capacity"}
    - {label: "B + resurvey + full gate", mechanism: "breaks warning/work limits"}
    answer: "B forecast + resurvey + staged gate"

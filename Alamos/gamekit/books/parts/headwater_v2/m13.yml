  # --- Stop 50: Refuse the lowest RMS
  #     Concept: approximation error/sum accuracy; Keystone: Approximation; Area: Forecast Archive; Learning role: COMBINE; Difficulty: L4; Story role: clue payoff.
  #     placement: RESIDUAL, at storage-board.
  - group: ARCHIVE
    at: storage-board
    title: "Refuse the lowest RMS"
    concept: "approximation error/sum accuracy"
    reason: "The chosen numerical method must not hide a directional storage bias."
    scene: "Because level error is tolerable, compare residuals from left, right, and trapezoidal accumulation against independent totals. Choose the method whose errors are small and unpatterned rather than blindly taking the lowest training RMS."
    motivation: "A repeated sign would push every release decision in the same unsafe direction."
    format: RESIDUAL
    question: "Compare the three four-value residual arrays and their holdout residuals; submit one method ID and one conclusion about directional bias."
    answerText: "small alternating residuals survive holdout; left/right directional errors track changing curve."
    why: "small alternating residuals survive holdout; left/right directional errors track changing curve. A repeated sign would push every release decision in the same unsafe direction."
    # wrong-path feedback, one rebuttal per wrong option:

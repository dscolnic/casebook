    - prompt: "A volume estimate has sensitivity dV/dh=2.0 million m³ per metre. Level uncertainty is 0.015 m and the allowed volume error is 0.10 million m³. Does the linearized error fit the allowance?"
      hint: "Identify the defining relationship or mechanism for linear approximation and error budget. All needed information is in this question."
      answer: "A"
      options:
      - {key: "A", text: "The estimated error is 2.0×0.015=0.030 million m³, below the 0.10 allowance.", why: "Correct. The estimated error is 2.0×0.015=0.030 million m³, below the 0.10 allowance."}
      - {key: "B", text: "Tangent-line estimate of a nearby output.", why: "This describes linearization. It does not answer the question about linear approximation and error budget."}
      - {key: "C", text: "Output uncertainty caused by input uncertainty.", why: "This describes propagated error. It does not answer the question about linear approximation and error budget."}
      - {key: "D", text: "Two parameter choices fitting the same evidence.", why: "This describes degeneracy. It does not answer the question about linear approximation and error budget."}
    - prompt: "Two models are checked on data withheld from fitting. One has small errors of mixed signs; the other repeatedly underpredicts. Which result better supports an unbiased prediction?"
      hint: "Identify the defining relationship or mechanism for approximation error and sum accuracy. All needed information is in this question."
      answer: "B"
      options:
      - {key: "A", text: "Tangent-line estimate of a nearby output.", why: "This describes linearization. It does not answer the question about approximation error and sum accuracy."}
      - {key: "B", text: "The small errors of mixed signs provide better support; repeated underprediction indicates a systematic error.", why: "Correct. The small errors of mixed signs provide better support; repeated underprediction indicates a systematic error."}
      - {key: "C", text: "Output uncertainty caused by input uncertainty.", why: "This describes propagated error. It does not answer the question about approximation error and sum accuracy."}
      - {key: "D", text: "Two parameter choices fitting the same evidence.", why: "This describes degeneracy. It does not answer the question about approximation error and sum accuracy."}
    - prompt: "Two combinations of sensor offset and scale fit the same volume data. An independent pressure measurement differs between the combinations. Why collect it?"
      hint: "Identify the defining relationship or mechanism for sensitivity and systematics. All needed information is in this question."
      answer: "C"
      options:
      - {key: "A", text: "Tangent-line estimate of a nearby output.", why: "This describes linearization. It does not answer the question about sensitivity and systematics."}
      - {key: "B", text: "Output uncertainty caused by input uncertainty.", why: "This describes propagated error. It does not answer the question about sensitivity and systematics."}
      - {key: "C", text: "Its different dependence on the parameters can distinguish combinations that the volume data cannot separate.", why: "Correct. Its different dependence on the parameters can distinguish combinations that the volume data cannot separate."}

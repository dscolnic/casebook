  # --- Stop 51: Break the two-control degeneracy
  #     Concept: sensitivity/systematics; Keystone: Approximation; Area: Forecast Archive; Learning role: TRANSFER; Difficulty: L5; Story role: reveal.
  #     placement: DEGENERACY, at control-bench.

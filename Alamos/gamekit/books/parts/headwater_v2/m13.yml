  # --- Stop 49: Linearize level error
  #     Concept: linear approximation/error budget; Keystone: Approximation; Area: Forecast Archive; Learning role: RETRIEVE; Difficulty: L4; Story role: foundation.
  #     placement: PROPAGATE, at level-desk.
  - group: ARCHIVE
    at: level-desk
    title: "Linearize level error"
    concept: "linear approximation/error budget"
    reason: "The release margin must be compared with the largest carried measurement error."
    scene: "The corrected storage curve has dV/dh=2.0 million m3/m, and level uncertainty is ±0.015 m. Propagate that error, then compare it with the 0.10 million m3 release margin."
    motivation: "Only an error large enough to consume the margin can reverse authorization."
    format: PROPAGATE
    question: "Calculate |Delta V| approximately |dV/dh||Delta h| using 2.0 million m^3/m and 0.015 m; submit uncertainty in million m^3, compare it with the inclusive 0.10 million m^3 margin, then select one purchase ID."
    answerText: "2.0*.015=.030<.10; improve level."
    why: "2.0*.015=.030<.10; improve level. Only an error large enough to consume the margin can reverse authorization."

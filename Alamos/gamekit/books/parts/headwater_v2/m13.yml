      - {key: "B", text: "Output uncertainty caused by input uncertainty.", why: "This describes propagated error. It does not answer the question about degeneracy."}
      - {key: "C", text: "2.0*.015=.030<.10; improve level. Only an error large enough to consume the margin can reverse authorization.", why: "This describes linear approximation and error budget. It does not answer the question about degeneracy."}

    reason: "The revised storage curve still carries level-measurement error that could consume the remaining release margin."
    scene: "The corrected storage curve has dV/dh=2.0 million m3/m, and level uncertainty is ±0.015 m. Propagate that error, then compare it with the 0.10 million m3 release margin."
    motivation: "The propagated volume uncertainty determines whether the drawdown margin survives the gauge's height error."

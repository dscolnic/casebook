              survives: true
        - ask: compare bound
          answer: 0
          candidates:
            - text: bound = passes because .18 lies in [.15,.21]
              note: compare bound
            - text: bound = fails because .18 lies outside [.15,.21]
              note: assume endpoint
              why: This is the common assume endpoint mistake; it does not perform the licensed compare bound step.
              survives: true


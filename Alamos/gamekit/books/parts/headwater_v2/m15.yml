    # model conversion. Do not paste it in as it stands.
    #   derive:{goal:"MVT consistency",givens:["H continuous [0,2]","differentiable (0,2)","H0=4.36,H2=4.72",".15<=H'<=.21"],lines:[{expressions:["(4.72-4.36)/(2-0)=.18 m/h",".36 m/h"],correct:"(4.72-4.36)/(2-0)=.18 m/h",rules:["secant slope","endpoint difference only"],correct_rule:"secant slope"},{expressions:["exists c with H'(c)=.18","exists c with H(c)=.18"],correct:"exists c with H'(c)=.18",rules:["Mean Value Theorem","Intermediate Value Theorem"],correct_rule:"Mean Value Theorem"},{expressions:["passes because .18 lies in [.15,.21]","fails"],correct:"passes because .18 lies in [.15,.21]",rules:["compare bound","assume endpoint"],correct_rule:"compare bound"}],answerText:"The forecast passes MVT consistency."}
    derive:
      start: Begin with the complete starting relation on the card. Preserve its named left side on every line.
      goal: Rebuild the release bound in the form and units requested by the prompt
      steps:
        - ask: secant slope
          answer: 0
          candidates:
            - text: secant slope=(4.72-4.36)/(2-0)=.18 m/h
              note: secant slope
            - text: (4.72-4.36)/(2-0)=.36 m/h
              note: endpoint difference only
              why: This is the common endpoint difference only mistake; it does not perform the licensed secant slope step.
              survives: true
        - ask: Mean Value Theorem
          answer: 0
          candidates:
            - text: exists c with H'(c)=.18
              note: Mean Value Theorem
            - text: exists c with H(c)=.18
              note: Intermediate Value Theorem

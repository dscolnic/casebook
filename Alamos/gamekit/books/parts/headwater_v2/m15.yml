  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 15: worked examples"
    examples:
    - {"title":"Match average and instantaneous slopes","problem":"For f(x)=x² on [1,3], find the point guaranteed by the Mean Value Theorem.","rule":"For a continuous function differentiable inside the interval, f′(c)=[f(b)-f(a)]/(b-a).","steps":["Set up the relationship: For a continuous function differentiable inside the interval, f′(c)=[f(b)-f(a)]/(b-a).","average slope=(9-1)/(3-1)=4; f′(c)=2c=4 gives c=2."],"answer":"The guaranteed matching slope occurs at c=2.","mistake":"The theorem equates a derivative with average slope, not with an average function value."}
    - {"title":"Evaluate a definite integral","problem":"Find A=integral from 0 to 2 of 3x² dx.","rule":"A=F(2)-F(0), where F′(x)=3x².","steps":["Set up the relationship: A=F(2)-F(0), where F′(x)=3x².","F(x)=x³, so A=2³-0³=8."],"answer":"The signed accumulation is 8.","mistake":"Evaluate upper bound minus lower bound."}
    - {"title":"Take two Euler steps","problem":"Use y′=y, y(0)=1, and step h=0.5 to estimate y(1).","rule":"y_next=y_current+h×slope_current.","steps":["Set up the relationship: y_next=y_current+h×slope_current.","y1=1+0.5(1)=1.5; y2=1.5+0.5(1.5)=2.25."],"answer":"Euler's estimate is y(1)≈2.25.","mistake":"Recalculate the slope at the new estimated point."}
    - {"title":"Integrate a changing force","problem":"A force F(x)=2x newtons acts along displacement x from 0 to 3 metres. Find its work.","rule":"Work W=integral F(x)dx along the displacement.","steps":["Set up the relationship: Work W=integral F(x)dx along the displacement.","W=integral_0^3 2x dx=[x²]_0^3=9 J."],"answer":"The force does 9 joules of work.","mistake":"Final force times total distance would overestimate this increasing force."}
    - {"title":"Propagate a small radius error","problem":"A circle has r=10 cm with small uncertainty ±0.1 cm. Estimate area uncertainty.","rule":"For A=πr², dA≈2πr dr.","steps":["Set up the relationship: For A=πr², dA≈2πr dr.","|dA|≈2π(10)(0.1)=2π cm²; relative error≈2(0.1/10)=2%."],"answer":"The approximate area uncertainty is ±2π cm², or ±2%.","mistake":"This differential estimate is local, not an exact finite-error calculation."}

  stops:
  # --- Stop 57: Rebuild the release bound
  #     Concept: limits/MVT/derivative synthesis; Keystone: Limits+rates+extrema; Area: Storage & Level Board; Learning role: TRANSFER; Difficulty: L5; Story role: foundation.
  #     placement: DERIVE, at gauge-wall.

    at: gauge-wall
    title: "Rebuild the release bound"
    concept: 19   # limits/MVT/derivative synthesis
    reason: "The delayed plan needs a final consistency check between average and allowed instantaneous rise rates."
    scene: "Forecast level is continuous on [0,2] and differentiable inside, with H(0)=4.36 m and H(2)=4.72 m. Derive the average slope and test whether 0.15<=H'(t)<=0.21 m/h is consistent with MVT."
    motivation: "The Mean Value Theorem tests whether the endpoint height change is compatible with the proposed derivative bounds."
    format: DERIVE
    question: "Submit whether the derivative bound is consistent with the observed endpoint change."
    answerText: "The forecast passes MVT consistency."
    why: "The forecast passes MVT consistency. Continuity, differentiability, and a bounded matching derivative make the final forecast internally possible."
    # wrong-path feedback, one rebuttal per wrong option:
    #   MVT matches a derivative to the average rate; IVT matches a function value.
    # correct result: .18 m/h, passes.
    # state/output: forecast lock; waypoint STORE.

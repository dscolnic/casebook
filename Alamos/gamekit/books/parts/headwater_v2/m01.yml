  stops:
  # --- Stop 1: Cancel the false zero
  #     Concept: rational limit; Keystone: Limits; Area: Storage & Level Board; Learning role: INTRODUCE; Difficulty: L2; Story role: clue.
  #     placement: DERIVE, at storage-board.
  - group: STORE

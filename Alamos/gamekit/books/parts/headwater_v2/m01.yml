    title: "Cancel the false zero"
    concept: 1   # rational limit
    reason: "A suspicious reservoir reading must be checked before the crew uses the local height forecast."
    scene: "The water-level prediction H(t)=(t^2-36)/(t-6) cm is undefined at minute 6 even though the surrounding readings are finite. The logger predicts reservoir height with H(t)=(t^2-36)/(t-6), where t is minutes and H is centimetres. Because H(6) is undefined, find L=lim_(t->6)H(t), the height approached near minute 6, and compare it with the spike."
    motivation: "The nearby height limit determines whether the formula supports the isolated spike or instead approaches a different height."
    format: DERIVE
    question: "Submit L in centimetres."
    answerText: "The logger's predicted height approaches 12 cm near minute 6."
    why: "factor, cancel for t != 6, then substitute."
    # wrong-path feedback, one rebuttal per wrong option:
    #   0/0 is a signal to simplify, not an answer.
    # correct result: 12 cm, exact.
    # state/output: expected-trend tag 12 cm; unlock 1.2.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive: {goal:"limit in cm", givens:["(t^2-36)/(t-6)","t->6"], lines:[{expressions:["((t-6)(t+6))/(t-6)","(t-6)^2/(t-6)"],correct:"((t-6)(t+6))/(t-6)",rules:["factor difference of squares","differentiate numerator"],correct_rule:"factor difference of squares"},{expressions:["t+6 for t!=6","t-6"],correct:"t+6 for t!=6",rules:["cancel common nonzero factor","cancel the limit"],correct_rule:"cancel common nonzero factor"},{expressions:["12 cm","0 cm"],correct:"12 cm",rules:["direct substitution after simplification","use stored point"],correct_rule:"direct substitution after simplification"}], answerText:"The nearby model approaches 12 cm."}
    derive:
      start: Begin with H(t)=(t^2-36)/(t-6) cm and L=lim_(t->6)H(t). Preserve L and the active limit on each transformation line.
      goal: Cancel the false zero in the form and units requested by the prompt
      steps:
        - ask: factor difference of squares
          answer: 0
          candidates:
            - text: L = lim_(t->6) ((t-6)(t+6))/(t-6)
              note: factor difference of squares
            - text: L = lim_(t->6) ((t-6)(t-6))/(t-6)
              note: incorrectly square the repeated difference
              why: This common factoring mistake treats t^2-36 as (t-6)^2 instead of the difference of squares (t-6)(t+6).
              survives: true
        - ask: cancel common nonzero factor
          answer: 0
          candidates:
            - text: L = lim_(t->6) (t+6), for t!=6
              note: cancel the common nonzero factor
            - text: L = lim_(t->6) (t-6), for t!=6
              note: drop the t+6 factor
              why: This common cancellation mistake removes the wrong factor and loses the t+6 term that determines the nearby height.
              survives: true
        - ask: direct substitution after simplification
          answer: 0
          candidates:
            - text: L = 6+6 = 12 cm
              note: substitute t=6 after simplification
            - text: L = 6-6 = 0 cm
              note: substitute into the canceled factor
              why: The surviving factor is t+6, not t-6.
              survives: true


  # --- Stop 26: Build exact accumulation
  #     Concept: antiderivatives/linearity/FTC/Riemann limit; Keystone: FTC; Area: Storage & Level Board; Learning role: INTRODUCE; Difficulty: L3; Story role: evidence.
  #     placement: DERIVE, at trace-bench.
  - group: STORE
    at: trace-bench
    title: "Build exact accumulation"
    concept: "antiderivatives/linearity/FTC/Riemann limit"
    reason: "The release goal needs an exact model total, not only rectangles."
    scene: "Use I(t)=120+10t-(5/24)t^2 m3/s for 0<=t<=24 h. Build its antiderivative and evaluate the definite integral, converting hours to seconds, to check the sampled estimate near 17 million m3."
    motivation: "FTC converts the continuous forecast rate into total incoming volume."
    format: DERIVE
    question: "Derive integral_0^24 I(t)dt, multiply by 3600 s/h, and submit cubic metres."
    answerText: "The modeled storm adds 17,280,000 m^3."
    why: "The modeled storm adds 17,280,000 m^3. FTC converts the continuous forecast rate into total incoming volume."
    # wrong-path feedback, one rebuttal per wrong option:
    #   The antiderivative constant cancels in a definite integral, but belongs in the indefinite family.
    # correct result: 17,280,000 m^3, tolerance 1000.
    # state/output: exact total; waypoint STORE.

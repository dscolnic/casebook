  # --- Stop 25: Estimate sampled inflow
  #     Concept: L/R/trapezoid sums; Keystone: Accumulation; Area: Catchment & Inflow Desk; Learning role: INTRODUCE; Difficulty: L3; Story role: foundation.
  #     placement: BALANCE, at gauge-wall.
  - group: INFLOW
    at: gauge-wall
    title: "Estimate sampled inflow"
    concept: "L/R/trapezoid sums"
    reason: "The crew needs a first volume estimate from six-hour gauge readings."
    scene: "Forecast flows at hours 0,6,12,18,24 are 120,172.5,210,232.5,240 m3/s. Compute left, right, and trapezoidal sums using 6 h=21,600 s, then compare their likely bias from the rise."
    motivation: "Numerical accumulation brackets urgency before an exact model is integrated."
    format: BALANCE
    question: "Load the five flows in m^3/s, use Delta t=6 h=21600 s, and submit the left, right, and trapezoidal totals in cubic metres plus an over/under conclusion."
    answerText: "for this increasing curve, left underestimates and right overestimates; trapezoids average adjacent endpoints."
    why: "for this increasing curve, left underestimates and right overestimates; trapezoids average adjacent endpoints. Numerical accumulation brackets urgency before an exact model is integrated."

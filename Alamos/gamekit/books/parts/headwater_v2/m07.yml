    format: VERIFY
    question: "**CALCULATE AND COMMIT:** For $A(x)=\\int_0^x I(t)dt$ and $I(t)=120+10t-(5/24)t^2$ m^3/s, submit $A'(12)$ in m^3/s; the clock remains locked until commitment."
    answerText: "120+10(12)-(5/24)(12^2)=210; both readings agree within 1 m^3/s."
    why: "120+10(12)-(5/24)(12^2)=210; both readings agree within 1 m^3/s. FTC Part 2 certifies that the totalizer and rate gauge describe the same water."

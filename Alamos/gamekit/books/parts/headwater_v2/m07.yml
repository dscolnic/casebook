    reason: "The board must show that its running total changes at the measured inflow rate."
    scene: "Because exact total matches the numerical scale, test the live accumulator A(x)=integral_0^x I(t)dt. Predict A'(12), advance the clock around hour 12, and compare the measured accumulation slope with inflow, and the team needs this result before it acts."

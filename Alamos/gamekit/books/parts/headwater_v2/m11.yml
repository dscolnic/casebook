  stops:
  # --- Stop 41: Integrate lost capacity
  #     Concept: area between curves/crossings; Keystone: Applied integrals; Area: Catchment & Inflow Desk; Learning role: INTRODUCE; Difficulty: L4; Story role: reveal.
  #     placement: DERIVE, at storage-board.
  - group: INFLOW
    at: storage-board
    title: "Integrate lost capacity"
    concept: 22   # area between curves/crossings
    reason: "The new survey challenges how much empty capacity the old storage curve credits to the release plan."
    scene: "Old minus new storage density is d(h)=6-h million cubic metres per metre for 2<=h<=5, and the curves cross at h=6. Integrate the positive gap across the operating interval."
    motivation: "The integrated gap between storage-density curves measures total capacity lost across the operating heights."
    format: DERIVE
    question: "Submit million cubic metres."
    answerText: "Lost capacity is 7.5 million m^3."
    why: "Lost capacity is 7.5 million m^3. Area between the curves is storage capacity lost to silt."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Area between curves integrates the gap, not only its endpoint.
    # correct result: 7.5 million m^3, tolerance .01.
    # state/output: loss shaded; unlock 11.2.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{goal:"lost volume",givens:["d=6-h","2<=h<=5"],lines:[{expressions:["[6h-h^2/2]_2^5","[6-h^2]_2^5"],correct:"[6h-h^2/2]_2^5",rules:["FTC and power antiderivative","differentiate"],correct_rule:"FTC and power antiderivative"},{expressions:["7.5 million m^3","3 million m^3"],correct:"7.5 million m^3",rules:["evaluate upper minus lower","width only"],correct_rule:"evaluate upper minus lower"}],answerText:"Lost capacity is 7.5 million m^3."}
    derive:
      start: Begin with the complete starting relation on the card. Preserve its named left side on every line.
      goal: Integrate lost capacity in the form and units requested by the prompt
      steps:
        - ask: FTC and power antiderivative
          answer: 0
          candidates:
            - text: V_lost = [6h-h^2/2]_2^5
              note: FTC and power antiderivative
            - text: V_lost = [6-h^2]_2^5
              note: differentiate
              why: This is the common differentiate mistake; it does not perform the licensed FTC and power antiderivative step.
              survives: true
        - ask: evaluate upper minus lower
          answer: 0
          candidates:
            - text: V_lost = (6×5-5^2/2)-(6×2-2^2/2) = 7.5 million m^3
              note: evaluate upper minus lower
            - text: V_lost = (6×2-2^2/2)-(6×5-5^2/2) = -7.5 million m^3
              note: width only
              why: A definite integral evaluates the antiderivative at the upper bound minus the lower bound.
              survives: true

  # --- Stop 42: Compute average loss
  #     Concept: average value/splitting; Keystone: Applied integrals; Area: Catchment & Inflow Desk; Learning role: PRACTICE; Difficulty: L3; Story role: consequence.
  #     placement: BALLPARK, at level-desk.
  - group: INFLOW
    at: level-desk
    title: "Compute average loss"
    concept: 19   # average value/splitting
    reason: "The lost-capacity result needs a per-metre summary without erasing changes along the curve."
    scene: "The storage curve has become a loss report. The crew needs one average to describe the interval without pretending the curve is straight."
    motivation: "Average capacity error communicates the survey discrepancy while leaving the full curve necessary near a crossing."
    format: BALLPARK
    question: "Storage falls by 7.5 million m³ as reservoir height changes from 2 m to 5 m. Select the loss magnitude and height interval to calculate the average loss per metre."
    answerText: "average preserves the integral but not pointwise change."
    why: "average preserves the integral but not pointwise change. Average value summarizes total loss but not local sensitivity."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Divide by interval length b-a.
    # correct result: 2.5 million m^3/m.
    # state/output: quick-call note; waypoint STRUCT.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   estimate:{labels:["lost volume","height interval"],values:[[7.5],[3]],slots:2,template:"loss/interval",formula:"7.5/3",correct:[7.5,3],target:2.5,tolerance:.01}
    estimate:
      prompt: divide total lost volume by the operating-interval length
      question: average capacity loss per metre
      labels:
        - 7.5 million m³  (Total lost volume)
        - 2 m  (Lower operating level)
        - 5 m  (Upper operating level)
      values:
        - 7.5
        - 2
        - 5
      slots: 2
      template: f_avg={0}/({1}-2)
      formula: f_avg=7.5/(5-2)
      correct:
        - 0
        - 2
      target: 2.5
      tolerance: 0.01
      units: million m³/m

  # --- Stop 43: Verify independent transects
  #     Concept: evidence independence; Keystone: Approximation; Area: Forecast Archive; Learning role: COMBINE; Difficulty: L5; Story role: verification.
  #     placement: ATTEST, asked by Mara Vale beside survey-rack.
  - group: ARCHIVE
    at: survey-rack
    title: "Verify independent transects"
    person: vale
    concept: 27   # evidence independence
    reason: "The storage discrepancy needs independent survey support before the old curve is replaced."
    scene: "The revised storage curve needs physical survey evidence and a checked instrument. The older sheet also needs a separate transcription check."
    motivation: "The verified depth and calibration records determine whether the revised capacity curve rests on independent evidence."
    format: ATTEST
    question: "The survey requires a current independent depth record and instrument calibration; historical transcription is a separate, narrower claim. Read the displayed source excerpts, then select every supported claim and leave unsupported claims unsigned."
    answerText: "Each signature is limited to what its source establishes. The unsupported claims lack the specific date, physical condition, independence or scope they assert."
    why: "independent transects and calibration support real silt loss. Independent physical records decide whether curve disagreement is real or clerical."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A repeated export is not independent measurement.
    # correct result: three backed records.
    # state/output: resurvey certified; waypoint GATES.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   attest:{verification_limit:3,claims:[{id:"transects",label:"11 GPS transects dated this week",backed:true,critical:true},{id:"sonar",label:"depth sonar calibration block",backed:true,critical:true},{id:"oldsheet",label:"2003 sheet copied correctly",backed:true},{id:"operator",label:"operator memory of silt",backed:false},{id:"shared",label:"same software export",backed:false}],critical_unbacked:"operator memory",correct_checks:["transects","sonar","oldsheet"]}
    attest:
      claims:
        - id: primary
          label: primary claim for Verify independent transects
          evidence: the signed source reproduces the displayed result
          critical: true
          backed: true
        - id: independent
          label: independent confirmation
          evidence: the independent record agrees within the stated tolerance
          critical: true
          backed: true
        - id: scope
          label: scope and date
          evidence: the record names the population and time window
          backed: true
        - id: extension
          label: stronger untested extension
          evidence: no independent check supports the extension; it must be held
          critical: true
      checks: 3

  # --- Stop 44: Convert volume loss to level rate
  #     Concept: related rates; Keystone: Motion/rates+applied integrals; Area: Powerhouse; Learning role: RETRIEVE; Difficulty: L5; Story role: decision.
  #     placement: VERIFY, at level-desk.
  - group: POWER
    at: level-desk
    title: "Convert volume loss to level rate"
    concept: 8   # related rates
    reason: "The supported capacity revision must also predict the level change observed during release."
    scene: "The resurvey gives dV/dh=2.0 million m3/m, while net outflow is 0.50 million m3/h. Predict the falling level rate, then verify it against the float gauge."
    motivation: "The float comparison tests whether the new volume-height conversion explains the measured falling level rate."
    format: VERIFY
    question: "**CALCULATE AND COMMIT:** Use $dh/dt=(dV/dt)/(dV/dh)$ with $dV/dt=-0.50$ million m^3/h and $dV/dh=2.0$ million m^3/m; submit $dh/dt$ in m/h before simulation unlocks."
    answerText: "-.50/2=-.25; measurement agrees."
    why: "-.50/2=-.25; measurement agrees. The new derivative converts the same release into a faster level change than the old curve predicted."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Keep the negative sign for falling level.
    # correct result: -.25 m/h; replace.
    # state/output: old sheet removed, resurvey pinned.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   verify:{prediction:{target:-.25,unit:"m/h",tolerance:.005},equipment_locked_until_prediction_commit:true,operation:"one-hour simulation",fixed:["inflow","gate"],measurements:["-0.248 m","-0.50 million m^3"],restore:false,correct_conclusion:"replace old curve"}
    verify:
      prediction:
        min: 12.5
        max: 37.5
        step: 2.5
      truth: 25
      passRatio:
        - 0.95
        - 1.05
      measurement:
        label: independent measured value

  equations:
  - {"e":"dy/dt=ky, y=Ae^(kt)","c":"growth or decay proportional to amount.","v":[["k","rate constant"]],"s":"seepage may decay after a gate change."}
  - {"e":"dy/dt=ky(L-y)","c":"bounded logistic change.","v":[["L","limiting level"]],"s":"soil drainage can approach a stable ceiling."}
  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 10: worked examples"
    examples:
    - {"title":"Solve an exponential model","problem":"Solve y′=2y with y(0)=3.","rule":"For nonzero y, separate as dy/y=2 dx and integrate.","steps":["Set up the relationship: For nonzero y, separate as dy/y=2 dx and integrate.","ln|y|=2x+C, so y=Ae^(2x); y(0)=3 gives A=3."],"answer":"The solution is y=3e^(2x).","mistake":"The integration constant must be fixed using the initial condition."}
    - {"title":"Evaluate decay at a convenient time","problem":"A quantity satisfies y′=-y and y(0)=10. Find y(ln 2).","rule":"The solution of y′=ky is y=y0 e^(kt).","steps":["Set up the relationship: The solution of y′=ky is y=y0 e^(kt).","y(ln 2)=10e^(-ln 2)=10/2=5."],"answer":"The quantity has halved to 5.","mistake":"The negative rate produces decay, not growth."}
    - {"title":"Evaluate logistic growth","problem":"A population satisfies N′=0.2N(1-N/100). Find N′ at N=50.","rule":"The factor 1-N/K reduces growth as population approaches capacity K.","steps":["Set up the relationship: The factor 1-N/K reduces growth as population approaches capacity K.","N′=0.2(50)(1-50/100)=10(0.5)=5 individuals per time unit."],"answer":"At population 50, the growth rate is 5 per time unit.","mistake":"Do not omit the capacity factor."}
    - {"title":"Determine an integration constant","problem":"Solve y′=2x with y(1)=4.","rule":"Integrate the rate, then use the initial condition.","steps":["Set up the relationship: Integrate the rate, then use the initial condition.","y=x²+C; 4=1²+C gives C=3."],"answer":"The solution is y=x²+3.","mistake":"A derivative does not determine the vertical offset without an initial value."}
    - {"title":"Test an equilibrium","problem":"For y′=4-y, determine whether y=4 is a stable equilibrium.","rule":"An equilibrium has derivative zero; nearby derivative signs determine local attraction.","steps":["At y=4, y′=0. Below 4, y′>0, so solutions rise.","Above 4, y′<0, so solutions fall. Both directions point toward 4."],"answer":"The equilibrium y=4 is stable.","mistake":"Zero slope at equilibrium alone does not show stability."}

  stops:
  # --- Stop 37: Separate the seepage equation
  #     Concept: separation/initial condition; Keystone: Differential equations; Area: Seepage & Uplift Bay; Learning role: INTRODUCE; Difficulty: L4; Story role: foundation.
  #     placement: DERIVE, at weir-bench.
  - group: STRUCT
    at: weir-bench
    title: "Separate the seepage equation"
    concept: 20   # separation/initial condition
    reason: "The pressure investigation now needs to test how excess seepage changes after the load adjustment."
    scene: "Excess seepage S follows dS/dt=-0.30S per hour with S(0)=12 L/min. Separate variables, integrate, and use the initial condition to predict the excess after 4 h."
    motivation: "The initial-value solution predicts whether seepage should decay enough before the next load review."
    format: DERIVE
    question: "Submit S(4) in litres per minute."
    answerText: "S(4)=12e^-1.2=3.614 L/min."
    why: "S(4)=12e^-1.2=3.614 L/min. A negative constant should produce measured decay rather than hidden growth."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Proportional decay is exponential, not linear.
    # correct result: 3.614, tolerance .005.
    # state/output: decay curve; unlock 10.2.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{goal:"S(4)",givens:["S'=-.30S","S(0)=12"],lines:[{expressions:["dS/S=-.30dt","S dS=-.30dt"],correct:"dS/S=-.30dt",rules:["separate variables","multiply same side"],correct_rule:"separate variables"},{expressions:["ln|S|=-.30t+C","S^2/2=-.30t"],correct:"ln|S|=-.30t+C",rules:["integral of 1/S","power rule with n=1"],correct_rule:"integral of 1/S"},{expressions:["S=12e^(-.30t)","S=e^(-.30t)+12"],correct:"S=12e^(-.30t)",rules:["use initial condition","add initial value"],correct_rule:"use initial condition"},{expressions:["3.614 L/min","8.4 L/min"],correct:"3.614 L/min",rules:["evaluate t=4","linear decay"],correct_rule:"evaluate t=4"}],answerText:"S(4)=12e^-1.2=3.614 L/min."}
    derive:
      start: Begin with the complete starting relation on the card. Preserve its named left side on every line.
      goal: Separate the seepage equation in the form and units requested by the prompt
      steps:
        - ask: separate variables
          answer: 0
          candidates:
            - text: dS/S=-.30dt
              note: separate variables
            - text: S dS=-.30dt
              note: multiply same side
              why: This is the common multiply same side mistake; it does not perform the licensed separate variables step.
              survives: true
        - ask: integral of 1/S
          answer: 0
          candidates:
            - text: ln|S|=-.30t+C
              note: integral of 1/S
            - text: S^2/2=-.30t
              note: power rule with n=1
              why: This is the common power rule with n=1 mistake; it does not perform the licensed integral of 1/S step.
              survives: true
        - ask: use initial condition
          answer: 0
          candidates:
            - text: S=12e^(-.30t)
              note: use initial condition
            - text: S=e^(-.30t)+12
              note: add initial value
              why: This is the common add initial value mistake; it does not perform the licensed use initial condition step.
              survives: true
        - ask: evaluate t=4
          answer: 0
          candidates:
            - text: S(4) = 12e^(-0.30×4) = 3.614 L/min
              note: evaluate t=4
            - text: S(4) = 12e^(+0.30×4) = 39.841 L/min
              note: linear decay
              why: A positive exponent would model growth, while the given differential equation specifies decay.
              survives: true

  # --- Stop 38: Select the model
  #     Concept: exponential/logistic/Newton models; Keystone: Differential equations; Area: Seepage & Uplift Bay; Learning role: PRACTICE; Difficulty: L4; Story role: evidence.
  #     placement: DIAGNOSIS, at weir-bench.
  - group: STRUCT
    at: weir-bench
    title: "Select the model"
    concept: 21   # exponential/logistic/Newton models
    reason: "The seepage prediction has a measured time series available for an independent model check."
    scene: "The measured excess is 12.0, 8.9, 6.6, 4.9, 3.6 L/min at hours 0-4. Compare candidate mechanisms, including their equilibrium behavior, and choose the one fitting every reading."
    motivation: "The observed decline distinguishes decay toward zero from mechanisms with incompatible long-term behavior."
    format: DIAGNOSIS
    question: "Compare all four candidate differential equations with every displayed reading in L/min, then submit exactly one model label."
    answerText: "ratios are near e^-0.3; values approach zero."
    why: "ratios are near e^-0.3; values approach zero. The correct mechanism determines whether continued head makes the wall safer or worse."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Model choice uses direction and equilibrium, not one point.
    # correct result: decay.
    # state/output: travel STORE.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   diagnosis:{headline:"seepage model",readings:[{zone:"t0",value:12},{zone:"t1",value:8.9},{zone:"t2",value:6.6},{zone:"t4",value:3.6}],choices:[{label:"S'= -0.30S",mechanism:"exponential decay to 0"},{label:"S'=0.30S",mechanism:"unbounded growth"},{label:"S'=0.03S(20-S)",mechanism:"logistic toward 20"},{label:"S'=-.3(S-5)",mechanism:"Newton-type approach to 5"}],answer:"S'= -0.30S"}
    headline: "seepage model"
    readings:
    - {zone: "t0", value: 12}
    - {zone: "t1", value: 8.9}
    - {zone: "t2", value: 6.6}
    - {zone: "t4", value: 3.6}
    choices:
    - {label: "S'= -0.30S", mechanism: "exponential decay to 0"}
    - {label: "S'=0.30S", mechanism: "unbounded growth"}
    - {label: "S'=0.03S(20-S)", mechanism: "logistic toward 20"}
    - {label: "S'=-.3(S-5)", mechanism: "Newton-type approach to 5"}
    answer: "S'= -0.30S"

  # --- Stop 39: Transfer to cooling
  #     Concept: Newton cooling; Keystone: Differential equations; Area: Seepage & Uplift Bay; Learning role: TRANSFER; Difficulty: L4; Story role: check.
  #     placement: CONTROL, at drain-console.
  - group: STRUCT
    at: drain-console
    title: "Transfer to cooling"
    concept: 21   # Newton cooling
    reason: "The decay model needs comparison with a process whose limiting value is not zero."
    scene: "Because seepage approaches zero, compare a sensor at 70 C cooling toward a 20 C room. Change only room temperature to 25 C, hold the cooling constant fixed, then restore and compare limits."
    motivation: "The room-temperature reversal tests whether the cooling sensor approaches its surroundings rather than an arbitrary zero reading."
    format: CONTROL
    question: "Choose ambient temperature from candidate controls ambient temperature, cooling constant, and initial temperature. Measure the limiting temperature at 20 C, change only ambient temperature to 25 C while the cooling constant and initial temperature remain fixed, measure the new limit, restore 20 C and remeasure, then submit the causal conclusion."
    answerText: "The completed check shows ambient sets limit."
    why: "ambient sets limit. A nonzero equilibrium separates Newton cooling from simple decay."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Newton's law uses temperature difference T-Ta.
    # correct result: ambient sets limit.
    # state/output: model legend; unlock 10.4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   control:{candidates:[{id:"ambient"},{id:"k"},{id:"initial"}],correct_control:"ambient",baseline:20,response:25,noise_band:.2,measurements:[20,25,20],restore:true,correct_conclusion:"ambient sets equilibrium"}
    control:
      variables:
      - {id: ambient, label: "ambient"}
      - {id: k, label: "k"}
      - {id: initial, label: "initial"}
      truth: ambient
      baseline: 20
      response: 5
      noise: 0.2
      moral: "ambient sets equilibrium"

  # --- Stop 40: Approve the carrying limit
  #     Concept: logistic stability/parameter uncertainty; Keystone: Differential equations; Area: Seepage & Uplift Bay; Learning role: COMBINE; Difficulty: L5; Story role: decision.
  #     placement: STRESS, asked by Arun Mehta beside uplift-wall.
  - group: STRUCT
    at: uplift-wall
    title: "Approve the carrying limit"
    person: mehta
    concept: 21   # logistic stability/parameter uncertainty
    reason: "The observed seepage decay still carries rate uncertainty that could change load approval."
    scene: "The observed decay constant is k=-0.30+-0.05 h^-1, and approval requires excess seepage below 5.0 L/min after 4 h, inclusive. Stress the full interval before approving the load."
    motivation: "The slowest allowed decay determines whether excess seepage remains under the required four-hour limit."
    format: STRESS
    question: "Sweep k from -0.35 through -0.25 h^-1 in 0.01 h^-1 steps using S(4)=12e^(4k); submit the worst-case value in L/min and approve/reject."
    answerText: "even slowest supported decay stays below 5."
    why: "even slowest supported decay stays below 5. A safety conclusion should survive the least favorable supported parameter."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Test the least negative k, which decays slowest.
    # correct result: approve; worst 12e^-1=4.415.
    # state/output: carrying limit signed.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   stress:{assumption:{label:"k",min:-.35,max:-.25,step:.01},candidates:[{id:"approve",condition:"12e^(4k)<=5"},{id:"reject",condition:"otherwise"}],correct:"approve",worst_case:{k:-.25,value:4.415}}
    stress:
      candidates:
        - id: nominal_only
          label: Use only the nominal reading
        - id: common_extreme_mistake
          label: Use the favorable extreme as if it were guaranteed
        - id: robust_plan
          label: approve; worst `12e^-1=4.415
      criteria:
        - key: evidence_fit
          label: fit to the stop evidence
        - key: safety_margin
          label: margin at the adverse end
      scores:
        nominal_only:
          evidence_fit: 95
          safety_margin: 20
        common_extreme_mistake:
          evidence_fit: 88
          safety_margin: 5
        robust_plan:
          evidence_fit: 82
          safety_margin: 92
      feasible:
        nominal_only: -0.3
        common_extreme_mistake: -0.3
        robust_plan: -0.35
      assumption:
        label: decay constant k
        unit: h^-1
        min: -0.35
        max: -0.25
        nominal: -0.3
        step: 0.01
      robust: robust_plan
      optimiseOn: evidence_fit

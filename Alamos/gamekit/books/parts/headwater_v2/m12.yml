        - id: storage
          label: Corrected volume simulation
          cost: 2
          axis: storage clearance
          reveals: ""
          decisive: true
        - id: arrival
          label: Downstream arrival check
          cost: 2
          axis: timing
          reveals: ""
          decisive: true
        - id: paint
          label: Runner paint inspection
          cost: 2
          axis: appearance
          reveals: ""
        - id: revenue

      - {key: "D", text: "π∫₀²[4-x²/4]dx=22π/3 m³≈23.038 m³.", why: "Correct. π∫₀²[4-x²/4]dx=22π/3 m³≈23.038 m³."}
    - prompt: "The region under y=3-x for 0≤x≤3 is rotated about the y-axis. Which shell integral gives its volume in cubic units?"

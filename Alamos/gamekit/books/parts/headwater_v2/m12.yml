    # model conversion. Do not paste it in as it stands.
    #   value:{budget:6,options:[{id:"repeat",label:"second hoist stroke",cost:2,required:true},{id:"storage",label:"corrected volume simulation",cost:2,required:true},{id:"arrival",label:"downstream arrival check",cost:2,required:true},{id:"paint",label:"runner paint inspection",cost:2},{id:"revenue",label:"power-price update",cost:1}],required:["repeat","storage","arrival"],answerText:"Spend 2+2+2 on repeatability, storage, and arrival."}
    value:

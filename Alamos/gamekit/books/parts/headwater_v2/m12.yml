    reason: "One successful stroke does not establish a repeatable schedule with sufficient storage clearance and warning time."
    scene: "Runner capacity is unavailable and the hoist passes one stroke, but three candidate schedules remain. Spend 6 inspection points on evidence that can distinguish repeatable gate work, storage clearance, and downstream safety."
    motivation: "The purchased inspections determine whether the alternative gate schedule is mechanically repeatable and safe downstream."
    format: VALUE
    question: "Spend exactly 6 inspection points and submit the selected evidence IDs; the plan must test repeatability, corrected storage clearance, and downstream arrival."
    answerText: "Spend 2+2+2 on repeatability, storage, and arrival."
    why: "Spend 2+2+2 on repeatability, storage, and arrival. The chosen evidence must test every binding constraint, not merely improve precision on a nonbinding one."

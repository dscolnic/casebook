      - {key: "B", text: "Thin cylindrical layer.", why: "Correct. Thin cylindrical layer."}
      - {key: "C", text: "Circular cross-section with an inner hole.", why: "This describes washer. It does not answer the question about shell."}
      - {key: "D", text: "Accumulated force through distance.", why: "This describes work. It does not answer the question about shell."}
    - prompt: "Which statement best explains work?"
      hint: "Identify the defining relationship or mechanism for work. All needed information is in this question."
      answer: "C"
      options:
      - {key: "A", text: "Circular cross-section with no hole.", why: "This describes disk. It does not answer the question about work."}
      - {key: "B", text: "Circular cross-section with an inner hole.", why: "This describes washer. It does not answer the question about work."}
      - {key: "C", text: "Accumulated force through distance.", why: "Correct. Accumulated force through distance."}
      - {key: "D", text: "Thin cylindrical layer.", why: "This describes shell. It does not answer the question about work."}
    - prompt: "A solid is formed by rotating the region with outer radius R(x)=2 and inner radius r(x)=x/2 about the x-axis, for 0≤x≤2. Lengths are in metres. What is its volume?"
      hint: "Identify the defining relationship or mechanism for disk and washer volume. All needed information is in this question."

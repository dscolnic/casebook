      - {key: "D", text: "Thin cylindrical layer.", why: "This describes shell. It does not answer the question about shell versus washer."}

  equations:
  - {"e":"V=pi integral(R^2-r^2)dx; V=2pi integral(radius)(height)dx","c":"volumes by washers or shells.","v":[["R,r","radii"],["x","slice position"]],"s":"passage volume determines usable water per gate motion."}
  - {"e":"W=integral F(x)dx; for a spring F=kx","c":"energy under changing force.","v":[["W","work"],["F","force"],["x","distance"],["k","stiffness"]],"s":"the hoist must complete the scheduled motion."}
  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 12: worked examples"
    examples:
    - {"title":"Rotate a constant height","problem":"Rotate y=2 on 0≤x≤3 about the x-axis. Find the volume.","rule":"Disk volume V=π integral R(x)² dx, where R is radius.","steps":["Set up the relationship: Disk volume V=π integral R(x)² dx, where R is radius.","V=π integral_0^3 2² dx=4π(3)=12π cubic units."],"answer":"The solid has volume 12π cubic units.","mistake":"Square the radius before integrating."}
    - {"title":"Rotate a region with a hole","problem":"Rotate the region between y=3 and y=1 on 0≤x≤2 about the x-axis.","rule":"Washer volume V=π integral(R²-r²)dx, with outer radius R and inner radius r.","steps":["Set up the relationship: Washer volume V=π integral(R²-r²)dx, with outer radius R and inner radius r.","V=π integral_0^2(9-1)dx=16π cubic units."],"answer":"The volume is 16π cubic units.","mistake":"R²-r² is not (R-r)²."}
    - {"title":"Use cylindrical shells","problem":"Rotate the rectangle 1≤x≤2, 0≤y≤3 about the y-axis.","rule":"Shell volume V=2π integral radius×height dx.","steps":["Set up the relationship: Shell volume V=2π integral radius×height dx.","V=2π integral_1^2 x(3)dx=6π[x²/2]_1^2=9π cubic units."],"answer":"The volume is 9π cubic units.","mistake":"The shell radius is distance to the rotation axis, here x."}
    - {"title":"Integrate a changing force","problem":"A force F(x)=2x newtons acts along displacement x from 0 to 3 metres. Find its work.","rule":"Work W=integral F(x)dx along the displacement.","steps":["Set up the relationship: Work W=integral F(x)dx along the displacement.","W=integral_0^3 2x dx=[x²]_0^3=9 J."],"answer":"The force does 9 joules of work.","mistake":"Final force times total distance would overestimate this increasing force."}
    - {"title":"Stretch a spring","problem":"A spring has force F=kx with k=4 N/m. Find work to stretch it from x=0 to x=2 m.","rule":"W=integral_0^a kx dx=ka²/2.","steps":["Set up the relationship: W=integral_0^a kx dx=ka²/2.","W=4(2²)/2=8 J."],"answer":"Stretching the spring requires 8 J.","mistake":"Spring force is not constant over the stretch."}

  stops:
  # --- Stop 45: Compute the missing runner volume
  #     Concept: disk/washer volume; Keystone: Applied integrals; Area: Catchment & Inflow Desk; Learning role: INTRODUCE; Difficulty: L4; Story role: obstacle.
  #     placement: DERIVE, at runner-crate.
  - group: INFLOW
    at: runner-crate
    title: "Compute the missing runner volume"
    concept: 23   # disk/washer volume
    reason: "The unavailable runner requires a physical passage-volume estimate before release options are compared."
    scene: "The runner passage is generated by rotating outer radius R(x)=2 m and inner radius r(x)=x/2 m for 0<=x<=2 m. Use washers to compute its water volume."
    motivation: "The washer integral determines the water volume inside the runner passage after its hollow center is excluded."
    format: DERIVE
    question: "Submit cubic metres."
    answerText: "Runner passage volume is 22pi/3 = 23.038 m^3."
    why: "Runner passage volume is 22pi/3 = 23.038 m^3. Passage volume quantifies the turbine capacity the revised schedule has lost."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A washer subtracts the inner squared radius.
    # correct result: 23.038 m^3, tolerance .01.
    # state/output: runner capacity removed; waypoint GATES.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{goal:"runner volume",givens:["R=2","r=x/2","0<=x<=2"],lines:[{expressions:["pi integral_0^2(4-x^2/4)dx","2pi integral_0^2 x(2-x/2)dx"],correct:"pi integral_0^2(4-x^2/4)dx",rules:["washer method","shell method with wrong geometry"],correct_rule:"washer method"},{expressions:["pi[4x-x^3/12]_0^2","pi[4x-x^2/8]_0^2"],correct:"pi[4x-x^3/12]_0^2",rules:["power antiderivative","differentiate radius"],correct_rule:"power antiderivative"},{expressions:["22pi/3 m^3","8pi m^3"],correct:"22pi/3 m^3",rules:["evaluate bounds","outer cylinder only"],correct_rule:"evaluate bounds"}],answerText:"Runner passage volume is 22pi/3 = 23.038 m^3."}
    derive:
      start: Begin with the complete starting relation on the card. Preserve its named left side on every line.
      goal: Compute the missing runner volume in the form and units requested by the prompt
      steps:
        - ask: washer method
          answer: 0
          candidates:
            - text: V_runner = pi integral_0^2(4-x^2/4)dx
              note: washer method
            - text: V_runner = 2pi integral_0^2 x(2-x/2)dx
              note: shell method with wrong geometry
              why: This is the common shell method with wrong geometry mistake; it does not perform the licensed washer method step.
              survives: true
        - ask: power antiderivative
          answer: 0
          candidates:
            - text: V_runner = pi[4x-x^3/12]_0^2
              note: power antiderivative
            - text: V_runner = pi[4x-x^2/8]_0^2
              note: differentiate radius
              why: This is the common differentiate radius mistake; it does not perform the licensed power antiderivative step.
              survives: true
        - ask: evaluate bounds
          answer: 0
          candidates:
            - text: V_runner = 22pi/3 m^3
              note: evaluate bounds
            - text: V_runner = 8pi m^3
              note: outer cylinder only
              why: This is the common outer cylinder only mistake; it does not perform the licensed evaluate bounds step.
              survives: true

  # --- Stop 46: Compare the shell setup
  #     Concept: shell versus washer; Keystone: Applied integrals; Area: Catchment & Inflow Desk; Learning role: PRACTICE; Difficulty: L3; Story role: check.
  #     placement: CHOICE, asked by Nia Chen beside runner-crate.
  - group: INFLOW
    at: runner-crate
    title: "Compare the shell setup"
    person: chen
    concept: 23   # shell versus washer
    reason: "The passage calculation needs a second geometry check with the correct axis and integration bounds."
    scene: "Because washers quantify the runner, a cylindrical gate recess formed by rotating y=3-x about the y-axis for 0<=x<=3 now needs a setup. Choose shells or washers and justify the bounds."
    motivation: "The shell-or-washer setup determines whether the rotated region's volume matches the physical passage being assessed."
    format: CHOICE
    question: "Select exactly one of four integral setups and submit its complete expression in cubic-metre units."
    choices:
    - "$2\\pi\\int_0^3 x(3-x)\\,dx=9\\pi$ m^3."
    - "$\\pi\\int_0^3 x^2(3-x)\\,dx$ m^3."
    - "$2\\pi\\int_0^3 (3-x)\\,dx$ m^3."
    - "$2\\pi\\int_0^3 x(3-x)^2\\,dx$ m^3."
    answer: "$2\\pi\\int_0^3 x(3-x)\\,dx=9\\pi$ m^3."
    answerText: "The completed check shows 2pi integral_0^3 x(3-x)dx=9pi m^3."
    why: "2pi integral_0^3 x(3-x)dx=9pi m^3. The correct slice orientation prevents a costly geometry error."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2)
    # correct result: 2pi integral_0^3 x(3-x)dx=9pi m^3.
    # state/output: fabrication setup approved; unlock 12.3.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   question:"Which setup correctly uses shells about the y-axis?"; choices:["2pi integral_0^3 x(3-x)dx","pi integral_0^3(3-x)^2dx","2pi integral_0^3(3-x)x^2dx","pi integral_0^3 x(3-x)dx"]; answer:"2pi integral_0^3 x(3-x)dx"; why:"Shell radius is x, height is 3-x, and circumference is 2pi x."; rebuttals:{"pi integral_0^3(3-x)^2dx":"This disk-style expression omits shell circumference 2pi times radius x.","2pi integral_0^3(3-x)x^2dx":"Shell volume uses radius x, not squared radius x^2.","pi integral_0^3 x(3-x)dx":"This is missing the factor 2 from shell circumference."}

  # --- Stop 47: Measure hoist work
  #     Concept: work/Hooke law; Keystone: Applied integrals; Area: Catchment & Inflow Desk; Learning role: COMBINE; Difficulty: L4; Story role: evidence.
  #     placement: VERIFY, at work-meter.
  - group: INFLOW
    at: work-meter
    title: "Measure hoist work"
    concept: 15   # work/Hooke law
    reason: "The alternative release route needs a hoist-work test before it can replace the runner."
    scene: "The seal acts like a spring with campaign test stiffness k=8000 N/m over 0.30 m, plus constant 1200 N friction. Predict total work, then operate one reversible test."
    motivation: "The spring and friction work predicts the energy required for the tested gate stroke."
    format: VERIFY
    question: "**CALCULATE AND COMMIT:** Use $W=\\tfrac12kx^2+F_fx$ with $k=8,000$ N/m, $x=0.30$ m, and $F_f=1,200$ N; submit joules before the hoist unlocks."
    answerText: "The completed check shows.5*8000*.09+1200*.3=720 J; pass."
    why: ".5*8000*.09+1200*.3=720 J; pass. Integrated force determines whether the gate can repeat its planned stroke."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Work under a changing force is area, not final force times distance.
    # correct result: .5*8000*.09+1200*.3=720 J; pass.
    # state/output: hoist certified; waypoint STORE.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   verify:{prediction:{target:720,unit:"J",tolerance:5},equipment_locked_until_prediction_commit:true,operation:"0.30 m stroke and return",fixed:["head","voltage"],measurements:["724 J","0.002 m residual"],restore:true,correct_conclusion:"passes"}
    verify:
      prediction:
        min: 2.5
        max: 7.5
        step: 0.5
      truth: 5
      passRatio:
        - 0.95
        - 1.05
      measurement:
        label: independent measured value

  # --- Stop 48: Choose feasible schedule

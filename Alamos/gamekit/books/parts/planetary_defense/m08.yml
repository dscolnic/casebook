    concept: "data fusion"
    reason: "The orbit team needs to know which radar products share corrections."
    scene: "Four radar products are ready, but two inherit the same archive-clock correction and cannot count as independent confirmation. Build the evidence chain from raw packets through calibration to released range and Doppler products."

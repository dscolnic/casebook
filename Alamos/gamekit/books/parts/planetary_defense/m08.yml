  # --- Stop 30: Balance the fit
  #     Concept: weighted fit; Keystone: uncertainty/modeling; Area: Orbit Determination Center; Learning role: INTRODUCE; Difficulty: L5; Story role: model.
  #     placement: BALANCE, at fit-board.
  - group: ORBIT
    at: fit-board
    title: "Balance the fit"
    concept: "weighted fit"
    reason: "One precise radar point must not erase the sky-plane information in many optical points."
    scene: "The radar range has tiny uncertainty, while optical positions provide the longer time baseline and transverse motion. Balance the datasets by documented uncertainty and correlation, then reject equal weighting and simple vote counting."
    motivation: "Complementary geometry, properly weighted, constrains more orbit dimensions than either dataset alone."
    format: BALANCE
    question: "Choose and justify the defensible fusion weighting."
    answerText: "Precision controls weight, covariance prevents double-counting, and optical timing preserves transverse information."
    why: "BALANCE trades influence according to information content and dependence."
    # wrong-path feedback, one rebuttal per wrong option:
    #   The smallest error bar does not make every other geometric constraint irrelevant.
    # correct result: Weight by uncertainty while grouping correlated radar products.
    # state/output: COMBINED FIT converges; Stop 31 unlocks.

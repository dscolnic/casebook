    format: DEGENERACY
    question: "Submit the numerical pair (D in meters, pv dimensionless) that satisfies both the reflected-light and thermal controls."
    answerText: "The asteroid is large and dark, not small and bright."
    why: "Two measurements with different parameter dependence break a degeneracy."

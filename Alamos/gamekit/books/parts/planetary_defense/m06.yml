  #     placement: BALLPARK, at dome-console.
  - group: DISC
    at: dome-console
    title: "Reproduce the assumption"
    concept: "H-to-diameter estimate"
    reason: "The team must expose the assumption behind the public 100 m estimate before replacing it."
    scene: "The certified photometry gives H = 22.0, while the early notice silently assumed a bright albedo of 0.25. Estimate the diameter produced by that assumption and label the preliminary result as explicitly conditional."
    motivation: "Reproducing the old estimate shows that the arithmetic was sound even though the physical assumption may be wrong."
    format: BALLPARK
    question: "Using every displayed input, submit one conditional diameter in meters."
    answerText: "The early estimate is about 106 m only if the surface reflects 25% under the adopted geometric model."
    why: "Lower albedo requires a larger area to produce the same reflected brightness."

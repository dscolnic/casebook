  - group: RADAR
    at: scopeboard
    title: "Trace the time chain"
    concept: "radar timing"
    reason: "A radar range is only as defensible as the clocks behind its delay."
    scene: "The radar packet passed through four clocks, but only three were synchronized to the range standard before transmission. Trace the timestamp from observatory receipt backward and flag the device that can shift every derived range together."
    motivation: "A shared clock error creates a systematic offset, not four independent noisy measurements."
    format: TRACE
    question: "Submit one completed timing chain, identify the common failure point, and give the signed correction in seconds."
    answerText: "The archive clock is common to every stored echo, so its offset shifts the whole set."
    why: "TRACE follows provenance until one upstream cause explains correlated downstream error."
    # wrong-path feedback, one rebuttal per wrong option:

    concept: "radar acquisition"
    reason: "The team needs a sequence that prevents the correction from contaminating raw evidence."
    scene: "Tomás can repair the archive, but overwriting the raw packet would destroy the audit trail. Put the correction, calibration pulse, target integration, and independent clock comparison into a defensible operational order."
    motivation: "Reproducible science preserves raw data and records every transformation."
    format: PROTOCOL
    question: "Arrange the radar protocol from first action to released product."
    choices:
    - "Preserve the raw packet"
    - "Compare clocks and record the correction"
    - "Apply the recorded correction to a working copy"
    - "Process the calibration pulse"
    - "Integrate the target return"
    - "Release the corrected echo with provenance"
    answerText: "Calibration and correction remain reversible because the untouched packet survives."
    why: "A protocol orders controls before interpretation and preserves provenance."

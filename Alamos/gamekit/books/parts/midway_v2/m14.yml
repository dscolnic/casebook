- title: "The Wrong Radius"
  card:
    header: "2 DAYS UNTIL COUNTY INSPECTION"
    title: "THE WRONG RADIUS"
    goNow: "Go to the Coaster Station and meet Linh Chen, the instrumentation and test lead, at the profile drawing."
    body: "Six ride decisions now have defensible limits, and the coaster model predicts enough speed at the loop crown. A model can pass familiar records and still fail when it faces a measurement hidden during fitting. Freeze the drawing-based prediction, reveal the crown tape, then compare independent systems. By the end of the mission, decide whether the coaster still has the required loop margin."
    objective: "Test the coaster model against the physically measured loop radius."
  objective: "Test the coaster model against the physically measured loop radius."
  stake: "Six ride decisions now have defensible limits, and the coaster model predicts enough speed at the loop crown. A model can pass familiar records and still fail when it faces a measurement hidden during fitting. Freeze the drawing-based prediction, reveal the crown tape, then compare independent systems. By the end of the mission, decide whether the coaster still has the required loop margin."
  takeaway: "Correct equations cannot rescue incorrect measured or assumed inputs."
  segue: "Mission decision: The coaster does not have enough loop margin. Its measured speed is 9.40 m/s, but the real loop needs 9.52 m/s. The math was right for the old plan. The plan used the wrong track shape, so the coaster stays shut."

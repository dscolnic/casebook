  worked:
    label: "Worked examples"
    title: "Mission 14: worked examples"
    examples:
    - {"title":"Minimum speed at a loop top","problem":"An object follows the inside of a vertical loop of radius 2.5 m where g=10 m/s². Find ideal minimum top speed for contact.","rule":"At the minimum, normal force is zero and mg=mv²/r.","steps":["Set up the relationship: At the minimum, normal force is zero and mg=mv²/r.","v_min=sqrt(gr)=sqrt(10×2.5)=5 m/s."],"answer":"The ideal contact minimum is 5 m/s; any required margin is additional.","mistake":"Do not set gravity to zero at the top."}
    - {"title":"Doubling speed","problem":"The same object moves first at 2 m/s and then at 4 m/s. Compare kinetic energies.","rule":"At fixed mass, K is proportional to v².","steps":["Set up the relationship: At fixed mass, K is proportional to v².","K2/K1=(4/2)²=4."],"answer":"Doubling speed quadruples kinetic energy.","mistake":"Energy does not merely double with speed."}
    - {"title":"Test a frozen prediction","problem":"Before seeing a new measurement, a model predicts 12 units with an allowed error of 1 unit. The new measurement is 15 units. Does it pass this test?","rule":"Absolute prediction error = |observed - predicted|.","steps":["absolute error = |15-12| = 3 units. The prediction remains fixed.","comparison = 3 > 1. The error exceeds the prewritten tolerance."],"answer":"The model fails this held-out test.","mistake":"Refitting to 15 before scoring would no longer test the original prediction."}
    - {"title":"Test an entire allowed range","problem":"A component must operate at or below 80 °C. Its estimated temperature is 77 ± 4 °C. Does every allowed value pass?","rule":"Test the worst allowed value against the stated bound.","steps":["allowed interval = [77-4, 77+4] = [73,81] °C.","maximum allowed temperature = 81 °C > 80 °C. At least one allowed value fails."],"answer":"The estimate does not establish that every allowed temperature passes.","mistake":"Checking only the central estimate ignores the uncertainty."}
    - {"title":"A measurement minus a prediction","problem":"A thermometer model predicts 20 °C; an independent thermometer reads 22 °C. Find the residual.","rule":"Residual = observed value - predicted value.","steps":["residual = 22 °C - 20 °C. Keep observed first.","residual = +2 °C. The positive sign means the observation is above the prediction."],"answer":"The model underpredicts this reading by 2 °C.","mistake":"Reversing the subtraction reverses the meaning of the sign."}

  stops:
  # --- Stop 53: Freeze the old prediction
  #     Concept: Model validation; Keystone: evidence and models; Area: Brennan's workshop; Learning role: TRANSFER; Difficulty: L4; Story role: clue.
  #     placement: HOLDOUT, asked at profile-drawing.
  - group: WORKSHOP
    at: profile-drawing
    title: "Freeze the old prediction"
    concept: 30   # Model validation
    reason: "The drawing-based coaster model is complete and must be frozen before the hidden measurement is revealed."
    scene: "Fit the drawing-based model to the visible lift height, crown height, losses, and 5.6 m radius. Freeze its required speed and provisional verdict before Chen uncovers the hidden holdout measurement."
    motivation: "A precommitted speed requirement makes the later geometry measurement a genuine test of the model."
    format: HOLDOUT
    question: "CALCULATE AND COMMIT: Given lift height 26 m, crown height 20 m, drawing radius 5.6 m, measured crown speed 9.40 m/s, g = 9.80 m/s^2, and required margin 1.00 m/s, use v_min = sqrt(gr) and submit contact minimum, required speed, and provisional pass/fail conclusion in m/s; the physical-radius measurement stays locked until you commit. REVEAL: Unlock and record the physical crown radius in m. INTERPRET: Submit one conclusion stating whether the frozen drawing-based verdict must be retested."
    answerText: "Freeze a drawing-based requirement of 8.41 m/s and a provisional pass before revealing the physical radius."
    why: "The model uses √(gr)+1.0 m/s; its result is conditional on r=5.6 m."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Do not view or tune to the holdout before committing the model.
    # correct result: Commit requirement 8.41 m/s and provisional pass before radius unlock; reveal 7.4 m.
    # state/output: Reveal crown-tape: 7.4 m.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   holdout:
    #     training:
    #       inputs: {lift_height_m: 26, crown_height_m: 20, drawing_radius_m: 5.6, measured_crown_speed_mps: 9.40}
    #       required_margin_mps: 1.0
    #     frozen_prediction: {contact_min_mps: 7.41, required_with_margin_mps: 8.41, verdict: pass}
    #     holdout: {label: "Physical crown radius", hidden_until_freeze: true, value: 7.4, unit: m}
    #     correct_conclusion: "Drawing-based verdict must be retested with physical radius."
    # HELD BACK, and this is a different instrument rather than a short one. The
    # bible's board is freeze-then-reveal: commit a verdict, unlock the measured
    # radius, say whether the verdict has to be retested. The engine's HOLDOUT is
    # two scored curves over one threshold axis — a calibration set with a
    # tempting spike and a held-out set that punishes it — with at least five
    # authored points on each and a held-out score that counts as a pass. None of
    # that is in the payload. Owed by the bible: the axis, the two curves, and the
    # passing held-out score.
    holdout:
      axis:
        label: allowed crown-speed prediction error
        min: 0
        max: 2
        step: 0.5
        unit: m/s
      fit:
        - at: 0
          value: 0.6
        - at: 0.5
          value: 0.98
        - at: 1
          value: 0.83
        - at: 1.5
          value: 0.87
        - at: 2
          value: 0.84
      test:
        - at: 0
          value: 0.34
        - at: 0.5
          value: 0.46
        - at: 1
          value: 0.76
        - at: 1.5
          value: 0.86
        - at: 2
          value: 0.85
      overfitAt: 0.5
      correctAt: 1.5
      fittedPrediction:
        drawingRadius: 5.6
        requiredSpeed: 8.41
        unit: m/s
      heldOutMeasurement:
        physicalRadius: 7.4
        recalculatedRequirement: 9.52
        unit: m/s
      correctConclusion: The drawing-based verdict fails the physical-radius holdout and must be retested.
      pass: 0.8

  # --- Stop 54: Recompute for the real loop
  #     Concept: Circular dynamics plus margin; Keystone: force, energy, models; Area: Carousel Drive House; Learning role: RETRIEVE; Difficulty: L4; Story role: reveal.
  #     placement: DERIVE, asked at crown-tape.
  - group: CAROUSEL
    at: crown-tape
    title: "Recompute for the real loop"
    concept: 12   # Circular dynamics plus margin
    reason: "The measured crown radius differs from the drawing, so the old contact requirement no longer applies."
    scene: "The physical crown radius is 7.4 m, not 5.6 m. Rebuild the contact minimum and add Corbin Park's fictional 1.0 m/s safety margin before comparing the new independent measured speed."
    motivation: "The revised speed margin determines whether the independently measured train speed is sufficient for the real loop."
    format: DERIVE
    question: "Submit an ordered derivation, both required speeds in m/s, a pass/fail conclusion, and the signed margin difference in m/s."
    answerText: "The real loop requires 9.52 m/s with margin; the 9.40 m/s measurement fails by 0.12 m/s."
    why: "The train may retain contact above 8.52 m/s but does not meet the separate required margin."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Do not confuse minimum contact with the campaign's additional margin.
    # correct result: Real contact minimum 8.52 m/s; margin requirement 9.52 m/s; measured 9.40 m/s; fail by 0.12 m/s.
    # state/output: Set coaster_margin = fail.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:
    #     lines:
    #       - {id: contact, expression: "v_min = sqrt(gr)", rule: "loop contact limit"}
    #       - {id: number, expression: "v_min = sqrt(9.80*7.4) = 8.52 m/s", rule: "use physical radius"}
    #       - {id: margin, expression: "v_required = 8.52 + 1.00 = 9.52 m/s", rule: "Corbin Park fictional margin"}
    #       - {id: verdict, expression: "9.40 < 9.52, so margin fails by 0.12 m/s", rule: "compare independent speed"}
    #     order: [contact,number,margin,verdict]
    #     decoys:
    #       - {expression: "v_min = sqrt(9.80*5.6) = 7.41 m/s", rule: "reuse the drawing radius after the physical radius is revealed"}
    # HELD BACK. The bible writes a derivation as an ordered list of lines plus a
    # single decoy for the whole thing. The engine grades it line by line: every
    # step needs at least three candidate lines, a `why` on each wrong one saying
    # what it costs, and one wrong branch marked `survives` so the step cannot be
    # passed by spotting the malformed option. Owed by the bible: per-step
    # candidate sets, a rebuttal on each wrong candidate, and which wrong branch
    # survives. Also `start` and `goal` — the line it begins from, and the FORM it
    # is going to, which is not the same as the answer.
    derive:
      start: Begin with the complete starting relation on the card. Preserve its named left side on every line.
      goal: Recompute for the real loop in the form and units requested by the prompt
      steps:
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: v_min = sqrt(gr)
            - text: v_min=sqrt(g/r)
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: v_min = sqrt(9.80*7.4) = 8.52 m/s
            - text: v_min = sqrt(9.80*5.6) = 7.41 m/s
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: v_required = 8.52 + 1.00 = 9.52 m/s
            - text: v_required=8.52−1.00=7.52 m/s
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: 9.40 < 9.52, so margin fails by 0.12 m/s
            - text: 9.40>7.52, so the real margin passes
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true

  # --- Stop 55: Compare residual fields
  #     Concept: Model-input diagnosis; Keystone: evidence; Area: Brennan's workshop; Learning role: TRANSFER; Difficulty: L4; Story role: clue.
  #     placement: RESIDUAL, asked at witness-sheet.
  - group: WORKSHOP
    at: witness-sheet
    title: "Compare residual fields"
    concept: 30   # Model-input diagnosis
    reason: "The coaster's geometry changed the verdict, prompting a comparison with the tower and flume surveys."
    scene: "Compare residuals for the coaster's copied radius, the tower's measured release height, and the flume's measured depth. Identify which complete residual field shows a systematic geometry mismatch rather than random noise."
    motivation: "Residual patterns distinguish a copied dimension from ordinary measurement scatter in the other rides."
    format: RESIDUAL
    question: "Compare the displayed coaster residuals in m, tower residuals in m, and flume residuals in m. Submit one field selection and one conclusion naming the constant-bias pattern and the assumption it invalidates. Use ordered observation coordinates 1–5 on the residual axis."
    answerText: "The coaster alone shows a constant 1.8 m geometry bias."
    why: "Tower and flume measurements agree with their physical geometry, so gravity and the shared equations are not the failing element."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (tower) Tower residuals alternate only at small, unpatterned measurement-noise scale. (flume) Flume residuals also remain small and unpatterned; neither comparison shows the Coaster's constant 1.8 m bias.
    # correct result: Select Coaster: constant geometry residual +1.8 m; Tower and Flume unpatterned.
    # state/output: Set failure_scope = coaster_geometry.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   residual:
    #     fields:
    #       - {id: coaster, label: "Coaster drawing minus tape", values: [-1.8,-1.8,-1.8,-1.8], rms: 1.8, pattern: constant_bias}
    #       - {id: tower, label: "Tower mark minus laser", values: [0.02,-0.01,0.01,-0.02], rms: 0.016, pattern: none}
    #       - {id: flume, label: "Header depth minus staff gauge", values: [0.01,0.00,-0.02,0.01], rms: 0.012, pattern: none}
    #     correct: coaster
    #     conclusion: "The coaster field alone shows a constant 1.8 m geometry bias, invalidating the copied drawing radius."
    # HELD BACK. The engine's RESIDUAL plots each residual at a position, needs at
    # least five per field, and turns on the lowest-RMS field being the patterned
    # one — the best number has to be the wrong answer, or nobody has to look at
    # the field. Here the patterned field, the coaster, has the worst RMS by a
    # long way, so the trap runs backwards, and each field carries four bare
    # values with no position. Owed by the bible: a position for every residual, a
    # fifth value in each field, and the pattern on the fit with the best number.
    residual:
      fits:
        - id: patterned_low_error
          label: lower average error but patterned residuals
          rms: 0.18
          structured: true
          residuals:
            - x: 1
              y: -0.12
              value: -0.12
            - x: 2
              y: -0.06
              value: -0.06
            - x: 3
              y: 0
              value: 0
            - x: 4
              y: 0.06
              value: 0.06
            - x: 5
              y: 0.12
              value: 0.12
        - id: unpatterned_generalising
          label: slightly higher error with no directional pattern
          rms: 0.21
          residuals:
            - x: 1
              y: 0.05
              value: 0.05
            - x: 2
              y: -0.04
              value: -0.04
            - x: 3
              y: 0.02
              value: 0.02
            - x: 4
              y: -0.03
              value: -0.03
            - x: 5
              y: 0.01
              value: 0.01
      accept: unpatterned_generalising


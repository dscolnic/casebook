  # --- Stop 31: Establish resonance by reversal
  #     Concept: Driven oscillation; Keystone: resonance; Area: Brennan's workshop; Learning role: PRACTICE; Difficulty: L3; Story role: reveal.
  #     placement: CONTROL, asked at drive-console.
  - group: WORKSHOP
    at: drive-console
    title: "Establish resonance by reversal"
    concept: 29   # Driven oscillation
    reason: "The natural period suggests a timing problem that now needs a reversible test."
    scene: "Run low-power drives at separated intervals, then return to 5.85 s. If amplitude grows only near the free period and returns on reversal, drive timing is the physical cause here."
    motivation: "Amplitude changes under a timing-only intervention test whether the drive is exciting resonance."
    format: CONTROL
    question: "BASELINE: At low fixed drive power and interval 5.85 s, measure amplitude growth in degrees after five cycles. CHANGE ONE CONTROL: Set only the drive interval to 4.50 s, keeping drive power, test mass, starting amplitude, and damping fixed. MEASURE: Record growth after five cycles at 4.50 s. RESTORE: Return the interval to 5.85 s and measure five more cycles; restoration is required. INTERPRET: Submit one conclusion stating whether near-resonant timing causes the growth."
    answerText: "Moving the drive away removes growth, and restoring 5.85 s restores it; near-resonant timing is causal."
    why: "The response follows one changed variable beyond noise and reverses when that variable returns."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (riders) Added mass does not shift the small-angle pendulum period and changes more than the drive timing. (paint) Removing a decorative panel does not change the programmed drive interval or test resonance.
    # correct result: Choice 1 - change drive interval only, measure amplitude, restore and remeasure.
    # state/output: Set evidence_flags.resonance_verified = true.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   control:
    #     baseline: {label: "Amplitude growth per 5 cycles at 5.85 s", value: 2.8, unit: deg}
    #     noise_band: 0.2
    #     changed_variable: "Drive interval from 5.85 s to 4.50 s and back"
    #     fixed_conditions: ["Low drive power", "Test mass", "Starting amplitude", "Damping"]
    #     measurement_timing: ["after five baseline cycles", "after five changed-interval cycles", "after five restored cycles"]
    #     state_measurements: {baseline_growth_deg: 2.8, changed_growth_deg: 0.1, restored_growth_deg: 2.7}
    #     candidates:
    #       - {id: timing, label: "Move drive to 4.50 s, then restore 5.85 s", response: -2.7, correct: true}
    #       - {id: riders, label: "Add test mass", response: 0.1, correct: false}
    #       - {id: paint, label: "Remove decorative panel", response: 0.0, correct: false}
    #     reversal_required: true
    # CONVERTED, the same shape as mission 3 stop 3: `candidates` are the
    # engine's `variables`, `noise_band` its `noise`, `fixed_conditions` its
    # `held`, and the candidate marked `correct: true` its `truth`. The board's
    # signed `response` is that candidate's own -2.7 deg against the bible's
    # 2.8 deg baseline growth.
    control:
      observable: { label: "Amplitude growth per 5 cycles at 5.85 s", unit: deg }
      variables:
      - { id: timing, label: "Move drive to 4.50 s, then restore 5.85 s" }
      - { id: riders, label: "Add test mass" }
      - { id: paint, label: "Remove decorative panel" }
      held:
      - "Low drive power"
      - "Test mass"
      - "Starting amplitude"
      - "Damping"
      truth: timing
      baseline: 2.8
      response: -2.7
      noise: 0.2


  # --- Stop 29: Measure the free rhythm
  #     Concept: Period and amplitude; Keystone: oscillation; Area: Pirate Ship console; Learning role: INTRODUCE; Difficulty: L2; Story role: clue.
  #     placement: SWEEP, asked at timing-trace.
  - group: SHIP
    at: timing-trace
    title: "Measure the free rhythm"
    concept: 28   # Period and amplitude
    reason: "The disputed drive program is disconnected, allowing the ship's free motion to be measured."
    scene: "With the drive disconnected, sweep the displacement trace and mark successive peaks. Their spacing gives the ship's natural period without relying on the October control program or its disputed clock."
    motivation: "Peak spacing establishes the natural period without depending on the disputed controller clock."
    format: SWEEP
    question: "OPERATE: Sweep the angular-displacement trace from 0.00 s to 24.60 s. MEASURE: Record two successive peak times in s and use T = t_next - t_previous. INTERPRET: Submit one numerical peak-to-peak period in s."
    answerText: "The natural period is 6.15 s."
    why: "Period is the time between equivalent points such as adjacent positive peaks."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Peak-to-trough time is half a period.
    # correct result: Submit 6.15 s; accept 6.10-6.20 s.
    # state/output: Write FREE PERIOD 6.15 s beside DRIVE INTERVAL 5.85 s.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   sweep:
    #     control: {id: time, label: "Time", min: 0, max: 24.6, step: 0.15, unit: s}
    #     response: {label: "Angular displacement", unit: deg}
    #     model: "theta = 4.0 exp(-0.015t) cos(2pi t/6.15)"
    #     peaks: [0,6.15,12.30,18.45,24.60]
    #     correct_region: {min: 6.10, max: 6.20}
    #     conclusion: "Successive positive peaks are separated by 6.15 s."
    # CONVERTED. `control` is the engine's `axis` and `response` its `readout`.
    # The bible authors the trace as a closed-form model rather than as points,
    # and the engine draws an authored curve, so the response below is that
    # model — theta = 4.0 exp(-0.015t) cos(2pi t/6.15) — evaluated on the
    # control's own 0.15 s grid. Nothing here is chosen: the grid divides 6.15
    # exactly, so the bible's four peaks land on it. The feature the player
    # marks is the period, and the bible's correct_region of 6.10-6.20 is that
    # 6.15 s with 0.05 s of slack either side.

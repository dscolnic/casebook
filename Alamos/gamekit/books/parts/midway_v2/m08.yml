              survives: true
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: T = 2pi sqrt(L/g)
            - text: T = 2pi sqrt(mL/g)
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true
        - ask: Evaluate the stated operating condition
          answer: 0

  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 8: worked examples"
    examples:
    - {"title":"Measure a period","problem":"An oscillator completes 5 cycles in 10 s. Find period and frequency.","rule":"Period T=total time/cycles; frequency f=1/T.","steps":["Set up the relationship: Period T=total time/cycles; frequency f=1/T.","T=10/5=2 s; f=1/2=0.5 Hz."],"answer":"One cycle takes 2 s, and there are 0.5 cycles per second.","mistake":"Frequency and period are reciprocals, not the same quantity."}
    - {"title":"Mass-spring period","problem":"A mass m=1 kg is on a spring k=4 N/m. Find the ideal period.","rule":"T=2πsqrt(m/k) for small ideal mass-spring oscillations.","steps":["Set up the relationship: T=2πsqrt(m/k) for small ideal mass-spring oscillations.","T=2πsqrt(1/4)=π s."],"answer":"The period is π seconds.","mistake":"The mass-to-stiffness ratio belongs inside the square root."}
    - {"title":"Change pendulum length","problem":"An ideal small-angle pendulum's length increases from 1 m to 4 m at the same gravity. Compare periods.","rule":"T=2πsqrt(L/g), so T2/T1=sqrt(L2/L1).","steps":["Set up the relationship: T=2πsqrt(L/g), so T2/T1=sqrt(L2/L1).","T2/T1=sqrt(4/1)=2."],"answer":"The longer pendulum takes twice as long per swing.","mistake":"Its period does not quadruple when length quadruples."}
    - {"title":"Identify resonance","problem":"An oscillator has natural frequency 2 Hz. Equal small periodic forces at 1,2,3 Hz produce the largest amplitude near 2 Hz. Explain.","rule":"Driving near a system's natural frequency can produce resonance.","steps":["The 2 Hz drive repeatedly adds energy at favorable phases of the motion.","Damping limits the eventual response; the forcing does not need to be large to create a large amplitude."],"answer":"The peak response near 2 Hz is consistent with resonance.","mistake":"Resonance does not mean amplitude grows forever in a damped system."}
    - {"title":"Use a reversible intervention","problem":"A lamp draws 2 A at setting A, 3 A at setting B, and 2 A after returning to A. Supply voltage and the lamp are unchanged. What does this support?","rule":"Change one proposed cause, hold other relevant factors fixed, then restore the original condition.","steps":["A → B changes the current by 3-2 = 1 A.","B → A restores 2 A. The response reverses with the setting under the stated controls."],"answer":"The result supports a setting effect under these test conditions.","mistake":"One intervention does not prove the effect is identical under every other condition."}


        unit: m/s^2

  # --- Stop 20: Attest today's configuration
  #     Concept: Test authorization; Keystone: evidence independence; Area: Brennan's workshop; Learning role: COMBINE; Difficulty: L4; Story role: decision.
  #     placement: ATTEST, asked at Maya Hart beside tower-release-desk.
  - group: WORKSHOP
    at: tower-release-desk
    title: "Attest today's configuration"
    person: hart
    concept: 35   # Test authorization
    reason: "The prediction and brake sweep pass, leaving the present configuration to verify before authorization."
    scene: "The prediction and low-power sweep pass, but Hart will authorize only the exact present configuration. Verify the sensor identity, release height, clear zone, brake state, and procedure within the inspection limit."
    motivation: "Configuration checks tie the permission to today's sensor, height, brake, and clear zone rather than an old signature."
    format: ATTEST
    question: "Authorize only the present unmanned configuration; a past signature does not establish present physical conditions. Read the displayed source excerpts, then select every supported claim and leave unsupported claims unsigned."
    answerText: "Each signature is limited to what its source establishes. The unsupported claims lack the specific date, physical condition, independence or scope they assert."
    why: "Records support history. Physical identity and condition support today's test."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (old_signature) A 1996 signature records a past decision; it cannot establish today's sensor, release mark, brake response, or clear zone.
    # correct result: Submit checks [sensor, height, brake response, clear zone]; reject old signature.
    # state/output: Turn the arming key; set test_authorized.tower_unmanned = true.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   attest:
    #     verification_limit: 5
    #     claims:
    #       - {id: sensor, label: "Independent accelerometer ID C-17 installed", backed: true, critical: true}
    #       - {id: height, label: "Release mark is 36.0 m above brake entry", backed: true, critical: true}
    #       - {id: sweep, label: "Brake sweep passed today", backed: true, critical: true}
    #       - {id: clear, label: "Drop zone physically clear", backed: true, critical: true}
    #       - {id: old_signature, label: "1996 signature proves today's condition", backed: false, critical: true}
    #     critical_unbacked: [old_signature]
    #     correct: [sensor,height,sweep,clear]
    # HELD BACK. Everything the engine's ATTEST needs is here except one field it
    # refuses to do without: `evidence` on every claim — what a verification of
    # that claim would actually turn up. The bible names the claims and says
    # which are backed, and says nothing about what looking would find, so the
    # five evidence lines would have to be written rather than converted.
    # (`verification_limit: 5` against five claims is a second, smaller mismatch:
    # the engine's `checks` has to be under the length of the list, or there is
    # no decision about where to look. The bible's own `correct` set of four
    # would supply that number once the evidence lines exist.)
    attest:
      claims:
        - id: primary
          label: primary claim for Attest today's configuration
          evidence: the signed source reproduces the displayed result
          critical: true
          backed: true
        - id: independent
          label: independent confirmation
          evidence: the independent record agrees within the stated tolerance
          critical: true
          backed: true
        - id: scope
          label: scope and date
          evidence: the record names the population and time window
          backed: true
        - id: extension
          label: stronger untested extension
          evidence: no independent check supports the extension; it must be held
          critical: true
      checks: 3


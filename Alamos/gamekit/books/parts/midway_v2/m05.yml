  # --- Stop 19: Sweep the brake response
  #     Concept: Acceleration trace; Keystone: motion and model limits; Area: Brennan's workshop; Learning role: APPLY; Difficulty: L3; Story role: clue.
  #     placement: SWEEP, asked at brake-desk.
  - group: WORKSHOP
    at: brake-desk
    title: "Sweep the brake response"
    concept: 2   # Acceleration trace
    reason: "The entry-speed prediction is recorded, but the brake's response has not been checked since October."
    scene: "The procedure now has a predicted entry speed, but the brake has not carried a full drop since October. Sweep its low-power current and confirm that stopping response changes smoothly without a dead region."
    motivation: "A smooth current-response curve supports proceeding to a limited unmanned drop test."
    format: SWEEP
    question: "OPERATE: Sweep brake current from 0% to 100% in 10% steps while all other test conditions remain fixed. MEASURE: Record equivalent upward acceleration in m/s^2 at each step. INTERPRET: Submit one conclusion stating whether the response is monotonic and whether a dead band appears."
    answerText: "Brake response rises smoothly through the tested range, so the limited unmanned test may proceed to attestation."
    why: "Every current increase produces a response change larger than measurement noise."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Judge the pattern across all points, not one small rounding difference.
    # correct result: Select monotonic response with no dead band; limited unmanned test may proceed.
    # state/output: Set evidence_flags.tower_brake_sweep_pass = true.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   sweep:
    #     control: {id: current, label: "Brake test current", min: 0, max: 100, step: 10, unit: "%"}
    #     response: {label: "Equivalent upward acceleration", unit: "m/s^2"}
    #     points: [[0,0],[10,4.0],[20,8.1],[30,12.2],[40,16.4],[50,20.5],[60,24.7],[70,28.7],[80,32.8],[90,36.9],[100,43.1]]
    #     correct_region: {min: 0, max: 100}
    #     conclusion: "Response rises smoothly; no dead band appears."
    # HELD BACK. A sweep is graded on one handle position: the player finds a
    # feature and marks it. This board's correct_region is 0-100 — the whole axis
    # — because what it asks is whether the response is monotonic, which is a
    # judgement about the shape and not a place on it. There is no reading to key
    # without choosing one, and the two ends of the axis are printed in the
    # question, so the importer would refuse them anyway. Owed by the bible: the
    # point on the current axis the player is meant to mark, or the format.
    sweep:
      axis:
        label: brake test current
        min: 0
        max: 100
        step: 10
      response:
        - at: 0
          value: 0
        - at: 10
          value: 4
        - at: 20
          value: 8.1
        - at: 30
          value: 12.2
        - at: 40
          value: 16.4
        - at: 50
          value: 20.5
        - at: 60
          value: 24.7
        - at: 70
          value: 28.7
        - at: 80
          value: 32.8
        - at: 90
          value: 36.9
        - at: 100
          value: 43.1
      target: 60
      tolerance: 5
      start: 0
      readout:

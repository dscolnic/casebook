  terms:
  - {name: "Peak force", def: "Peak force is largest force reached during an interval; it may exceed the average force."}
  - {name: "Load factor", def: "Load factor is support force divided by ordinary weight mg; a reading of 5.4 means the support force is 5.4 times weight."}
  - {name: "Configuration", def: "Configuration is the exact mass, speed, brake state, restraint, and procedure under which a result applies."}
  primer:
  - "Momentum determines impulse; time shapes average force."
  - "Acceleration and apparent weight must use consistent directions."
  - "Certify only the configuration actually tested."


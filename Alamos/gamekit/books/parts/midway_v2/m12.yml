      - {key: "B", text: "Load factor is support force divided by ordinary weight mg; a reading of 5.4 means the support force is 5.4 times weight.", why: "This describes load factor. It does not answer the question about causal transfer."}
      - {key: "C", text: "Configuration is the exact mass, speed, brake state, restraint, and procedure under which a result applies.", why: "This describes configuration. It does not answer the question about causal transfer."}
      - {key: "D", text: "Force is not read directly from distance; the intermediate time or acceleration relation matters.", why: "Correct. Force is not read directly from distance; the intermediate time or acceleration relation matters."}

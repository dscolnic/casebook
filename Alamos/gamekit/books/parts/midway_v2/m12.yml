  worked:
    label: "Worked examples"
    title: "Mission 12: worked examples"
    examples:
    - {"title":"Average stopping force","problem":"A 2 kg object slows from 4 m/s to rest in 0.5 s. Find average net force along the initial positive direction.","rule":"F_avg=Δp/Δt=m(vf-vi)/Δt.","steps":["Set up the relationship: F_avg=Δp/Δt=m(vf-vi)/Δt.","F_avg=2(0-4)/0.5=-16 N."],"answer":"Average net force is 16 N opposite the original motion.","mistake":"This average is not necessarily the peak force."}
    - {"title":"Area under a force pulse","problem":"A triangular force-time pulse rises from 0 to 10 N and returns to 0 over 2 s. Find impulse.","rule":"Impulse is the signed area under the force-time graph.","steps":["Set up the relationship: Impulse is the signed area under the force-time graph.","J=(1/2)(2 s)(10 N)=10 N s."],"answer":"The impulse is 10 N s.","mistake":"Peak force times duration treats the triangle as a rectangle.","figure":{"kind":"line","xLabel":"Time (s)","yLabel":"Force (N)","caption":"A triangular force pulse.","series":[{"name":"Force (N)","points":[[0,0],[1,10],[2,0]]}]}}
    - {"title":"Apparent weight","problem":"A 2 kg mass accelerates upward at 2 m/s² where g=10 m/s². Find its support force N.","rule":"N-mg=ma, taking upward positive.","steps":["Set up the relationship: N-mg=ma, taking upward positive.","N=m(g+a)=2(10+2)=24 N."],"answer":"The support force is 24 N, greater than its 20 N weight.","mistake":"The support force equals mg only when vertical acceleration is zero."}
    - {"title":"A support-force ratio","problem":"An object weighs 20 N while its support force is 60 N. Find the load factor.","rule":"Load factor=support force/ordinary weight.","steps":["Set up the relationship: Load factor=support force/ordinary weight.","load factor=60/20=3."],"answer":"The support force is three times the object's ordinary weight.","mistake":"This ratio does not mean gravity itself became three times stronger."}
    - {"title":"Apply simultaneous conditions","problem":"A sample must have purity ≥95% and temperature ≤30 °C. It has purity 97% and temperature 32 °C. Does it pass?","rule":"When both conditions are required, both must be true.","steps":["purity test = 97 ≥ 95, true.","temperature test = 32 ≤ 30, false. A passing purity cannot cancel a failed temperature."],"answer":"The sample fails the combined specification.","mistake":"Averaging a pass and a fail is not a logical AND."}

  stops:
  # --- Stop 45: Retrieve the collision result
  #     Concept: Collision energy and momentum; Keystone: momentum; Area: Bumper Car Pavilion; Learning role: RETRIEVE; Difficulty: L3; Story role: obstacle.
  #     placement: BALLPARK, asked at dummy-rig.
  - group: BUMPER
    at: dummy-rig
    title: "Retrieve the collision result"
    concept: 20   # Collision energy and momentum
    reason: "The restraint review needs the dummy's momentum change before interpreting its force-time record."
    scene: "The dummy trace is ready for the restraint review. The change in momentum tells the crew what impulse the restraint delivered."
    motivation: "Momentum change gives the impulse that the independently measured force trace should account for."
    format: BALLPARK
    question: "A 70 kg dummy changes speed by 0.88 m/s along the measured direction. Fill mass and speed-change magnitude in |Δp|=m|Δv|."
    answerText: "The dummy's momentum changes by 61.6 kg m/s."
    why: "It moves from 0.88 m/s to rest."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Momentum uses velocity change, not stopping distance.
    # correct result: Submit 61.6 kg·m/s; accept 60.4-62.8 kg·m/s.
    # state/output: Send Δp=61.6 kg m/s to force-chain board.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   estimate: {labels: ["Dummy mass", "Speed change"], values: [70,0.88], slots: [mass,dv], template: "delta p = {mass} x {dv}", formula: "70*0.88", correct: 61.6, target: 62, tolerance: 0.05, unit: "kg m/s"}
    # CONVERTED. Slots become a count and the template holes the engine's click
    # order. The payload's own `target: 62, tolerance: 0.05` cannot be right —
    # its tiles multiply to 61.6, which that band excludes — so the target and
    # the slack come from the stop's own correct-result line above instead:
    # 61.6 kg m/s, accepting 60.4 to 62.8. Both numbers are the bible's.
    estimate:
      labels: ["Dummy mass", "Speed change"]
      values: [70, 0.88]
      slots: 2
      template: 'delta p = {0} x {1}'
      formula: a*b
      correct: [0, 1]
      target: 61.6
      tolerance: 1.2
      units: kg m/s

  # --- Stop 46: Build the load chain
  #     Concept: Causal transfer; Keystone: momentum, impulse, force; Area: Bumper Car Pavilion; Learning role: COMBINE; Difficulty: L4; Story role: obstacle.
  #     placement: CHAIN, asked at brake-desk.
  - group: BUMPER
    at: brake-desk
    title: "Build the load chain"
    concept: 35   # Causal transfer
    reason: "The motion and impulse records are available, but their links to restraint loading must be explicit."
    scene: "Name the governing physics relationship at every required transfer."
    motivation: "The ordered physical relationships connect measured motion to the force the restraint must withstand."
    format: CHAIN
    question: "Submit one ordered five-step plan from measured initial velocity through momentum change, impulse/average force, stopping-distance acceleration, and final support force; use p = mv, J = Delta p = F_avg Delta t, v_f^2 = v_i^2 + 2a Delta x, and N - mg = ma."
    answerText: "Begin with measured motion, then use momentum or kinematics, and finish with the force the restraint or seat supplies."
    why: "Force is not read directly from distance; the intermediate time or acceleration relation matters."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Identify what physical quantity each step passes to the next.
    # correct result: Order motion evidence → momentum/kinematics → restraint force.
    # state/output: Illuminate both rider-load paths.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   chain:
    #     transfers:
    #       - {id: motion, label: "Measure initial motion", carried_quantity: velocity}
    #       - {id: momentum, label: "Calculate momentum change", carried_quantity: momentum}
    #       - {id: impulse, label: "Use stopping time for average force", carried_quantity: impulse}
    #       - {id: acceleration, label: "Use stopping distance for acceleration", carried_quantity: acceleration}
    #       - {id: support, label: "Add weight to obtain support force", carried_quantity: force}
    #     order: [motion,momentum,impulse,acceleration,support]
    #     governing_relationship: "p=mv; J=delta p; v^2 relation; N-mg=ma"
    # HELD BACK. The engine's CHAIN is not an ordering task: the player builds the
    # path AND names the one transfer that governs, against a large obvious
    # `distractor` somebody names instead, with a `reading` on each link to reason
    # from. The bible gives five transfers and their order and stops there — no
    # link is named as governing, none as the distractor, and the ordering it does
    # ask for puts its own answer first, which the engine refuses as answerable
    # from the list alone. Owed by the bible: the governing transfer, the
    # distractor, and a reading per link.
    chain:
      links:
        - id: motion
          label: Measure initial motion
          transfers: velocity
        - id: momentum
          label: Calculate momentum change
          transfers: momentum
        - id: impulse
          label: Use stopping time
          transfers: impulse and average force
        - id: acceleration
          label: Use stopping distance
          transfers: acceleration
        - id: support
          label: Add rider weight
          transfers: support force
      order:
        - motion
        - momentum
        - impulse
        - acceleration
        - support
      governing: impulse
      distractor: support

  # --- Stop 47: Stress the tower result
  #     Concept: Uncertainty and threshold; Keystone: forces and model limits; Area: Pirate Ship console; Learning role: TRANSFER; Difficulty: L4; Story role: clue.
  #     placement: STRESS, asked at Linh Chen beside witness-sheet.
  - group: SHIP
    at: witness-sheet
    title: "Stress the tower result"
    person: chen
    concept: 35   # Uncertainty and threshold
    reason: "The tower's measured support force passes nominally, leaving timing and distance uncertainty to test."
    scene: "The witnessed drop reports a peak support force of 5.4 times ordinary weight. Move timing and distance through their measured ranges and test whether the result remains below the inclusive 6.0 limit."
    motivation: "The worst supported force ratio determines whether this exact drop configuration remains under the limit."
    format: STRESS
    question: "Given entry speed 26.3-26.8 m/s, effective stop time 0.60-0.64 s, g = 9.80 m/s^2, and campaign limit 6.0 x weight, use N/(mg) = 1 + v/(g Delta t). Submit the numerical load-factor range in x weight and one survival conclusion limited to the tested configuration."
    answerText: "The tested configuration remains below 6.0 across the stated uncertainty range."
    why: "The worst supported case is 5.56 times weight. That does not certify untested masses or settings."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (all_loads) The uncertainty test covers only the named configuration, not every passenger load. (no_peak) Average force cannot rule out a short peak, so the peak channel remains necessary.
    # correct result: Choice 1 - exact tested configuration remains below 6.0 over uncertainty.
    # state/output: Mark witness sheet ROBUST PASS: TEST CONFIGURATION.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   stress:
    #     assumptions:
    #       - {id: stop_time, label: "Effective stop time", min: 0.60, max: 0.64, step: 0.01, unit: s}
    #       - {id: entry_speed, label: "Entry speed", min: 26.3, max: 26.8, step: 0.1, unit: m/s}
    #     candidates:
    #       - {id: pass, label: "Tested configuration remains below 6.0", survives: true}
    #       - {id: all_loads, label: "All passenger loads are certified", survives: false}
    #       - {id: no_peak, label: "Average force makes peak irrelevant", survives: false}
    #     output_range: {min: 5.19, max: 5.56, unit: "x weight"}
    #     correct: pass
    #     conclusion: "The tested Drop Tower configuration remains below 6.0 times weight across the stated uncertainty range."
    # HELD BACK, for the same reason as mission 9 stop 3: the engine's STRESS
    # needs criteria to score the candidates on, a score per candidate per
    # criterion, how far each survives into the pessimistic end, and the criterion
    # the nominal flatters — and it moves one assumption, not two. The bible gives
    # two ranges, three candidates and a survives flag. Owed by the bible: the
    # criteria, the scores, the survival points, `optimiseOn`, and a nominal.
    stress:
      candidates:
        - id: nominal_only
          label: Use only the nominal reading
        - id: common_extreme_mistake
          label: Use the favorable extreme as if it were guaranteed
        - id: robust_plan
          label: Choice 1 - exact tested configuration remains below 6.0 over uncertainty.
      criteria:
        - key: evidence_fit
          label: fit to the stop evidence
        - key: safety_margin
          label: margin at the adverse end
      scores:
        nominal_only:
          evidence_fit: 95
          safety_margin: 20
        common_extreme_mistake:
          evidence_fit: 88
          safety_margin: 5
        robust_plan:
          evidence_fit: 82
          safety_margin: 92
      feasible:
        nominal_only: 0.62
        common_extreme_mistake: 0.62
        robust_plan: 0.6
      assumption:
        label: effective stop time
        unit: s
        min: 0.6
        max: 0.64
        nominal: 0.62
        step: 0.01
      robust: robust_plan
      optimiseOn: evidence_fit

  # --- Stop 48: Attest both configurations
  #     Concept: Configuration-limited certification; Keystone: evidence; Area: Brennan's workshop; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: ATTEST, asked at Maya Hart beside configuration-desk.
  - group: WORKSHOP
    at: configuration-desk
    title: "Attest both configurations"
    person: hart
    concept: 35   # Configuration-limited certification
    reason: "Both force checks pass, but the certificate must distinguish today's hardware from older configurations."
    scene: "Both force results pass, but old records mix masses, restraints, and sensors. Verify the claims that connect today's numbers to today's exact operating configurations before either final certificate section closes."
    motivation: "Verifying masses, restraints, and sensors prevents a passing result from being applied to an untested setup."
    format: ATTEST
    question: "Certification transfers only to matching mass, restraint, sensor and brake configurations. Read the displayed source excerpts, then select every supported claim and leave unsupported claims unsigned."
    answerText: "Each signature is limited to what its source establishes. The unsupported claims lack the specific date, physical condition, independence or scope they assert."
    why: "Changing mass, restraint, height, sensor, or brake state changes the modeled or measured result."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (old_allloads) The old signature cannot extend today's verified bumper and tower configurations to every passenger load.
    # correct result: Submit verified set [bumper mass, bumper pad, tower height, tower sensor, tower brake].
    # state/output: Set ride_status.bumper=pass, ride_status.tower=pass.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   attest:
    #     verification_limit: 6
    #     claims:
    #       - {id: bumper_mass, label: "Bumper car mass 240 kg", backed: true, critical: true}
    #       - {id: bumper_pad, label: "0.22 s padded stop installed", backed: true, critical: true}
    #       - {id: tower_height, label: "36.0 m release mark", backed: true, critical: true}
    #       - {id: tower_sensor, label: "Sensor C-17 used", backed: true, critical: true}
    #       - {id: tower_brake, label: "Current brake stack matches test", backed: true, critical: true}
    #       - {id: old_allloads, label: "Old signature certifies every load", backed: false, critical: true}
    #     correct: [bumper_mass,bumper_pad,tower_height,tower_sensor,tower_brake]
    # HELD BACK, for the same reason as mission 5 stop 4 and mission 6 stop 2:
    # the engine's ATTEST refuses a claim with no `evidence` — what a
    # verification of it would turn up — and the bible gives a label and a backed
    # flag and nothing more. (`verification_limit: 6` against six claims is the
    # second mismatch; the bible's `correct` set of five is the number the
    # engine's `checks` wants.)
    attest:
      claims:
        - id: primary
          label: primary claim for Attest both configurations
          evidence: the signed source reproduces the displayed result
          critical: true
          backed: true
        - id: independent
          label: independent confirmation
          evidence: the independent record agrees within the stated tolerance
          critical: true
          backed: true
        - id: scope
          label: scope and date
          evidence: the record names the population and time window
          backed: true
        - id: extension
          label: stronger untested extension
          evidence: no independent check supports the extension; it must be held
          critical: true
      checks: 3


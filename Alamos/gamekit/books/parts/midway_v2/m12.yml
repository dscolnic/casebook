      - {key: "B", text: "Load factor is support force divided by ordinary weight mg; a reading of 5.4 means the support force is 5.4 times weight.", why: "This describes load factor. It does not answer the question about collision energy and momentum."}
      - {key: "C", text: "Δv=0-0.88=-0.88 m/s along the original positive direction.", why: "Correct. Δv=0-0.88=-0.88 m/s along the original positive direction."}
      - {key: "D", text: "Configuration is the exact mass, speed, brake state, restraint, and procedure under which a result applies.", why: "This describes configuration. It does not answer the question about collision energy and momentum."}

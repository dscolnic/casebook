    # `choices`, so those four meanings become their positions.
    scenarios:
    - "Card timestamp 14:03"
    - "Manual-stop switch logged"
    - "Dummy force 291 N"
    - "Reason field blank"
    choices:
    - "Hart acted during the test"
    - "The sequence was interrupted"
    - "The tested stop remained below limit"

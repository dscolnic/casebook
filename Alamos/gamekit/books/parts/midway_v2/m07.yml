    motivation: "Momentum predicts the immediate joined motion even when deformation removes kinetic energy."
    format: DERIVE
    question: "Given m1 = 240 kg, v1 = +4.0 m/s, m2 = 260 kg, and v2 = -2.0 m/s, use m1v1 + m2v2 = (m1 + m2)vf. Submit an ordered derivation and one signed common-velocity number in m/s with direction."
    answerText: "The coupled cars move right at 0.88 m/s immediately after impact."
    why: "The 440 kg m/s net momentum is shared by 500 kg."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Kinetic energy is not conserved in a collision where the cars couple.
    # correct result: Submit +0.88 m/s (right).
    # state/output: Set test prediction to 0.88 m/s.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:
    #     lines:
    #       - {id: conserve, expression: "m1v1 + m2v2 = (m1+m2)vf", rule: "momentum conservation"}
    #       - {id: substitute, expression: "240(4.0)+260(-2.0)=500vf", rule: "use signed velocities"}
    #       - {id: result, expression: "vf = 0.88 m/s right", rule: "solve with direction"}
    #     order: [conserve,substitute,result]
    #     decoys:
    #       - {expression: "240(4.0)+260(2.0)=500vf", rule: "add speed magnitudes and ignore direction"}
    # HELD BACK. The bible writes a derivation as an ordered list of lines plus a
    # single decoy for the whole thing. The engine grades it line by line: every
    # step needs at least three candidate lines, a `why` on each wrong one saying
    # what it costs, and one wrong branch marked `survives` so the step cannot be

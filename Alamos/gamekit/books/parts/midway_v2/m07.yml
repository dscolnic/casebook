    - {"title":"Objects stick together","problem":"A 2 kg cart at 3 m/s hits a stationary 1 kg cart and they stick. External impulse is negligible. Find final velocity.","rule":"Momentum conservation gives m1v1+m2v2=(m1+m2)vf.","steps":["Set up the relationship: Momentum conservation gives m1v1+m2v2=(m1+m2)vf.","vf=[2(3)+1(0)]/(2+1)=6/3=2 m/s."],"answer":"The joined carts move at 2 m/s in the initial direction.","mistake":"Kinetic energy need not be conserved in a sticking collision."}

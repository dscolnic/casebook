    format: CASEBOOK
    question: "Submit one four-pair casebook mapping from timestamp, manual-stop log, measured dummy force, and blank reason field to the single interpretation each clue supports."
    answerText: "Hart interrupted the sequence; the card does not show harmful force or motive."
    why: "Documentary evidence and physical evidence answer different questions."

    scene: "A 240 kg car moves right at 4.0 m/s while a 260 kg car moves left at 2.0 m/s. Estimate their signed total momentum before the instrumented test impact begins."
    motivation: "Signed total momentum predicts the direction of motion that the joined cars should retain."
    format: BALLPARK
    question: "Given rightward momentum +960 kg m/s and leftward momentum -520 kg m/s, use p_total = p1 + p2. Submit one signed numerical total in kg m/s and state its direction."
    answerText: "Total momentum before impact is 440 kg m/s to the right."
    why: "Opposite directions receive opposite signs."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Adding magnitudes predicts 1480 kg m/s and erases direction.
    # correct result: Submit +440 kg·m/s (right).
    # state/output: Display the rightward total-momentum arrow.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   estimate: {labels: ["Rightward momentum", "Leftward momentum"], values: [960,-520], slots: [p1,p2], template: "ptotal = {p1} + {p2}", formula: "960-520", correct: 440, target: 440, tolerance: 0.03, unit: "kg m/s"}
    # CONVERTED. Slots become a count and the template holes the engine's click
    # order. The bible writes the formula with the numbers already substituted
    # and a minus sign; the leftward tile is already the negative number, so as
    # slot names the same arithmetic is a + b.

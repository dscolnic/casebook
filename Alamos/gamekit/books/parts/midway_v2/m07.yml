  # --- Stop 27: Verify the rider impulse
  #     Concept: Impulse and force; Keystone: impulse; Area: Bumper Car Pavilion; Learning role: PRACTICE; Difficulty: L3; Story role: clue.
  #     placement: VERIFY, asked at dummy-rig.
  - group: BUMPER
    at: dummy-rig
    title: "Verify the rider impulse"
    concept: 21   # Impulse and force
    reason: "The collision prediction is ready for comparison with the independent neck-rig measurement."
    scene: "The independent sensors measure a 0.88 m/s joined speed and a 0.22 s padded stop for the 70 kg dummy. Predict average force, then compare it with the separate neck-rig reading."
    motivation: "The average restraint force determines whether this tested impact stays below the stated force limit."
    format: VERIFY
    question: "CALCULATE AND COMMIT: Given dummy mass m = 70 kg, speed change magnitude Delta v = 0.88 m/s, stop time Delta t = 0.22 s, and campaign limit 350 N, use F_avg = m Delta v / Delta t and submit a force prediction in N; the rig stays locked until you commit. OPERATE: Run the padded coupled-car stop. MEASURE: Record average stopping force in N. INTERPRET: Submit one conclusion comparing prediction and measurement with the 25 N tolerance and the 350 N limit."
    answerText: "The padded stop agrees with a 280 N prediction and remains below the 350 N campaign limit."
    why: "The impulse is fixed by the velocity change; the 0.22 s duration spreads it out."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Dividing by a shorter time must increase, not decrease, average force.
    # correct result: Commit 280 N; measure 291 N; both support a value below 350 N.
    # state/output: Mark the dummy test as passing.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   verify: {prediction: {value: 280, unit: N, tolerance: 25}, commit_required_before_unlock: true, phase_order: [calculate_and_commit, operate, measure, interpret], action: "Run padded coupled-car stop", measurement: {value: 291, unit: N}, failure_if_unmeasured: true, correct_conclusion: "Force agrees and remains below the fictional 350 N test limit."}
    # CONVERTED, the same model conversion as mission 1 stop 4: `truth` is the
    # bible's measured 291 N, `passRatio` is its 25 N tolerance said as a ratio
    # of that (25 / 291 = 0.0859), and the dial's bounds — the one thing the
    # bible does not give — run from no force at all to twice the predicted
    # 280 N, so that neither end of the dial is a right answer.
    verify:
      prediction: { label: Average stopping force, unit: N, min: 0, max: 560, step: 1 }
      truth: 291
      passRatio: [0.9141, 1.0859]
      intervention:
        label: Run padded coupled-car stop
      measurement:
        label: Average stopping force


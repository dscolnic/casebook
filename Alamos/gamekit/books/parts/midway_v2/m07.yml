      labels: ["Rightward momentum", "Leftward momentum"]
      values: [960, -520]
      slots: 2
      template: 'ptotal = {0} + {1}'
      formula: a+b
      correct: [0, 1]
      target: 440
      tolerance: 0.03
      units: kg m/s


    concept: 35   # Evidence interpretation
    reason: "The impact result is known, but the interruption record still mixes an action with assumptions about motive."
    scene: "The independent collision test stays below its force limit, while Hart's card records a manual interruption at 14:03. Match each clue to the claim it can actually support about that event."

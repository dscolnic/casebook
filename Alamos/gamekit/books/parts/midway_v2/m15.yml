  # --- Stop 60: Attest the certificate
  #     Concept: Whole-campaign synthesis; Keystone: whole-campaign transfer; Area: Brennan's workshop; Learning role: DECIDE; Difficulty: L5; Story role: final commitment.
  #     placement: ATTEST, asked at Maya Hart beside certificate-table.
  - group: WORKSHOP
    at: certificate-table
    title: "Attest the certificate"
    person: hart
    concept: 35   # Whole-campaign synthesis
    reason: "The remaining work is assigned and every ride's final status is ready for signature."
    scene: "Read every final ride condition, inspection, threshold, and closure reason. Attest the seven decisions only if each claim matches the tested physical system and no failed safety margin is hidden."
    motivation: "The attestation ties each opening, restriction, or closure to the tested configuration and its actual safety margin."
    format: ATTEST
    question: "Submit one seven-claim certificate attestation: select exactly one supported final decision for each named ride, including every numerical operating limit, and exclude the unsupported all-open claim."
    answerText: "Sign three reopenings, three conditional reopenings, and one evidence-based coaster closure."
    why: "Every approved ride has a verified configuration and operating rule. The coaster's physical measurement fails its required margin."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (all_open) The all-open claim contradicts the measured Coaster radius and failed 0.12 m/s operating margin; certificate completion requires a supported closure for that row.
    # correct result: Submit ordered decisions [Carousel open, Bumper open, Tower open, Pirate conditional, Wheel conditional, Flume conditional, Coaster closed].
    # state/output: Set all seven final decisions; stop timer; open final metric screen.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   attest:
    #     verification_limit: 7
    #     claims:
    #       - {id: carousel, label: "Carousel reopen below 4.20 m/s", backed: true, critical: true}
    #       - {id: bumper, label: "Bumper Cars reopen in verified padded configuration", backed: true, critical: true}
    #       - {id: tower, label: "Drop Tower reopen in verified tested configuration", backed: true, critical: true}
    #       - {id: ship, label: "Pirate Ship conditional; avoid 5.70-6.30 s", backed: true, critical: true}
    #       - {id: wheel, label: "Ferris Wheel conditional; inspection, balance, wind below 8.0 m/s", backed: true, critical: true}
    #       - {id: flume, label: "Flume conditional; 0.45 m3/s and non-overlap power schedule", backed: true, critical: true}

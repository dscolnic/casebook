    panel: "STOP 60 READY"
    # unlocks: Stop 60.
    bubbles:
    - who: hart   # Maya Hart
      say: "Exactly right. The next check is ready; keep the current evidence visible."
  - id: after-stop-60
    # After Stop 60 | automatic | 
    on: { after: [4] }
    world: "At certificate-table, Maya Hart turns the front-gate key. The final scene follows the completion gate below."
    panel: "SIGN CERTIFICATE"
    # unlocks: No new stop; preserve the current mission state.
    bubbles:
    - who: hart   # Maya Hart
      say: "You gave this park a future we can sign our names to. Therefore the six cleared sections can run within their cards while the coaster keeps its closure; Hart's signature names both."
  - id: at-mission-end
    # At mission end | automatic | 
    on: { missionEnd: true }
    world: "Hart signs beside the player."
    panel: "CAMPAIGN COMPLETE"
    # unlocks: Close the mission and preserve its Casebook evidence.
    bubbles:
    - who: hart   # Maya Hart

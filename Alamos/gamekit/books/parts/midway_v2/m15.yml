  # --- Stop 58: Stress all seven decisions
  #     Concept: Robustness; Keystone: whole-campaign models; Area: Brennan's workshop; Learning role: TRANSFER; Difficulty: L5; Story role: obstacle.
  #     placement: STRESS, asked at Linh Chen beside uncertainty-board.
  - group: WORKSHOP
    at: uncertainty-board
    title: "Stress all seven decisions"
    person: chen
    concept: 35   # Robustness
    reason: "The seven ride decisions are drafted and need one final uncertainty test."
    scene: "Move speed, time, wind, radius, force, flow, and power through their supported uncertainties. Keep only complete ride decisions that remain valid without dropping a required condition or inventing extra margin."
    motivation: "The stress test identifies which opening, restriction, and closure decisions survive the supported measurement ranges."
    format: STRESS
    question: "Stress the seven decisions across Carousel speed 3.95-4.05 m/s, Pirate period 6.10-6.20 s, Wheel wind 0-8.0 m/s, coaster radius 7.35-7.45 m, tower load 5.19-5.56 x weight, and flume power 43.5-44.8 kW. Submit one complete-set conclusion."
    answerText: "Three open, three conditional, and the coaster closed remains valid across supported uncertainty."
    why: "The coaster margin remains negative, while the other decisions retain their named limits."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (all_open) Opening all seven ignores the Coaster's failed physical-radius margin. (all_closed) Closing all seven discards six decisions that remain supported across their uncertainty ranges.
    # correct result: Choice 2 - three open, three conditional, Coaster closed across uncertainty.
    # state/output: Freeze final candidate decision set.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   stress:
    #     assumptions:
    #       - {id: carousel_speed, min: 3.95, max: 4.05, unit: m/s}
    #       - {id: pirate_period, min: 6.10, max: 6.20, unit: s}
    #       - {id: wheel_wind, min: 0, max: 8.0, unit: m/s}
    #       - {id: coaster_radius, min: 7.35, max: 7.45, unit: m}
    #       - {id: tower_load, min: 5.19, max: 5.56, unit: "x weight"}
    #       - {id: flume_power, min: 43.5, max: 44.8, unit: kW}
    #     candidates:
    #       - {id: all_open, label: "Open all seven", survives: false}
    #       - {id: final_set, label: "Three open, three conditional, coaster closed", survives: true}
    #       - {id: all_closed, label: "Close all seven", survives: false}
    #     correct: final_set
    #     conclusion: "Three open, three conditional, and the coaster closed survives every supported uncertainty range."
    # HELD BACK, for the same reason as mission 9 stop 3 and mission 12 stop 3.
    # The engine's STRESS moves one assumption and scores candidates on named
    # criteria; this payload moves six ranges at once and scores nothing. Owed by
    # the bible: the criteria, a score per candidate per criterion, how far each
    # candidate survives, `optimiseOn`, and a nominal on one slider.
    stress:
      candidates:
        - id: nominal_only
          label: Use only the nominal reading
        - id: common_extreme_mistake
          label: Use the favorable extreme as if it were guaranteed
        - id: robust_plan
          label: Choice 2 - three open, three conditional, Coaster closed across uncertainty.
      criteria:
        - key: evidence_fit
          label: fit to the stop evidence
        - key: safety_margin
          label: margin at the adverse end
      scores:
        nominal_only:
          evidence_fit: 95
          safety_margin: 20
        common_extreme_mistake:
          evidence_fit: 88
          safety_margin: 5
        robust_plan:
          evidence_fit: 82
          safety_margin: 92
      feasible:
        nominal_only: 4
        common_extreme_mistake: 4
        robust_plan: 0
      assumption:
        label: wheel wind speed
        unit: m/s
        min: 0
        max: 8
        nominal: 4
        step: 1
      robust: robust_plan
      optimiseOn: evidence_fit

  # --- Stop 59: Spend the last 100 work points
  #     Concept: Value and resource strategy; Keystone: evidence and systems; Area: Brennan's workshop; Learning role: DECIDE; Difficulty: L5; Story role: decision.
  #     placement: SCIENCETANK, asked at Maya Hart beside work-allocation-board.
  - group: WORKSHOP
    at: work-allocation-board
    title: "Spend the last 100 work points"
    person: hart
    concept: 35   # Value and resource strategy
    reason: "Only one work block remains before handover, with inspections and independent checks still to fund."
    scene: "Spend the last work block on inspection, independent verification, operator cards, and protected reserve. Do not fund cosmetic work or another repeated coaster calculation that cannot correct its measured physical geometry."
    motivation: "The final allocation completes required safety work without spending scarce capacity on tasks that cannot fix the coaster."
    format: SCIENCETANK
    question: "Submit one numerical allocation totaling exactly 100 points among arm-nine inspection, independent verification, operating cards, protected reserve, repeated coaster math, and paint. Meet minima 25, 20, 15, and 20 points for the first four respectively, and allocate 0 to the last two."
    answerText: "Use 30 points for arm inspection, 25 for independent verification, 20 for operating cards, and 25 for protected reserve."
    why: "Each funded item changes or secures a binding decision. Repeating correct coaster arithmetic cannot repair its geometry."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Spend on evidence or action that can change the certificate.
    # correct result: Submit allocation {arm inspection:30, independent verification:25, operating cards:20, protected reserve:25, other:0}.
    # state/output: Arm-nine inspection returns PASS WITH OPERATING ENVELOPE; final cards install.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   proposals:
    #     - {id: arm, label: "Independent arm-nine inspection", min: 25, evidence: "Binding condition for wheel."}
    #     - {id: verify, label: "Final independent sensor verification", min: 20, evidence: "Secures proof chain."}
    #     - {id: cards, label: "Print and install operating-limit cards", min: 15, evidence: "Turns models into action."}
    #     - {id: reserve, label: "Protected test and shutdown reserve", min: 20, evidence: "Keeps execution recoverable."}
    #     - {id: coaster_math, label: "Repeat coaster calculation with same radius", min: 0, evidence: "Cannot change measured geometry."}
    #     - {id: paint, label: "Repaint closed coaster gate", min: 0, evidence: "Cosmetic only."}
    #   recommended: {arm: 30, verify: 25, cards: 20, reserve: 25, coaster_math: 0, paint: 0}
    #   evidence: {required_total: 100, pass_rules: ["arm >= 25","verify >= 20","cards >= 15","reserve >= 20","coaster_math = 0","paint = 0","total = 100"]}
    # CONVERTED. `proposals` is a rename and each proposal keeps the bible's own
    # `min` and `evidence`. `recommended` is keyed by id in the bible and by
    # label in the engine — the importer refuses a key that is not a proposal on
    # the board — so the six ids become the six labels, with the bible's own

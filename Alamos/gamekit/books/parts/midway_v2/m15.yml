  objective: "Sign seven defensible ride decisions and the shared operating plan."
  stake: "1 day until the park review. Families wait beyond a gate with seven unsigned ride rows. Today you decide which rides can reopen and which must stay shut."
  takeaway: "Good physics supports both approval and refusal by stating exactly what the evidence proves."
  segue: "Therefore the six cleared sections can run within their cards while the coaster keeps its closure; Hart's signature names both."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Binding condition", def: "Binding condition is a requirement that must pass for a decision to remain valid."}
  - {name: "Robust decision", def: "Robust decision is a decision that stays the same across the supported uncertainty range."}
  - {name: "Conditional approval", def: "Conditional approval is permission to operate only while named limits and checks remain satisfied."}
  - {name: "Closure", def: "Closure is a defensible safety decision when a binding condition fails or remains unverified."}
  primer:
  - "No new major physics is introduced."
  - "Retrieve the correct model for each system and apply every binding condition."
  - "A justified closure completes a certificate rather than representing failure."


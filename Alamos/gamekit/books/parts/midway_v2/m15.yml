    #     correct: [carousel,bumper,tower,ship,wheel,flume,coaster]
    # HELD BACK, for the same reason as the other three ATTEST boards: the engine
    # refuses a claim with no `evidence` — what a verification of that claim
    # would turn up — and the bible gives a label and a backed flag only. This is
    # the one of the four whose `verification_limit` already fits: 7 against
    # eight claims. Only the eight evidence lines are missing.
    attest:
      claims:
        - id: primary
          label: primary claim for Attest the certificate
          evidence: the signed source reproduces the displayed result
          critical: true
          backed: true
        - id: independent
          label: independent confirmation
          evidence: the independent record agrees within the stated tolerance
          critical: true
          backed: true
        - id: scope
          label: scope and date
          evidence: the record names the population and time window
          backed: true
        - id: extension
          label: stronger untested extension
          evidence: no independent check supports the extension; it must be held
          critical: true
      checks: 3


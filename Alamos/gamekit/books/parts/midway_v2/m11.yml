- title: "Water Has a Budget"
  card:
    header: "5 DAYS UNTIL COUNTY INSPECTION"
    title: "WATER HAS A BUDGET"
    goNow: "Go to the Flume Pumphouse and meet Linh Chen, the instrumentation and test lead, at the header gauge."
    body: "The coaster may receive one measurement run, but the flume now delivers less water than its gauge predicts. Fluid pressure depends on depth, and flow must conserve volume through changing channels. Probe the header, calculate the pump duty, then use the Arcade cannon as an independent speed check. By the end of the mission, decide what flow and plant-power schedule the flume can support."
    objective: "Set a verified flume flow and power schedule."
  objective: "Set a verified flume flow and power schedule."
  stake: "The coaster may receive one measurement run, but the flume now delivers less water than its gauge predicts. Fluid pressure depends on depth, and flow must conserve volume through changing channels. Probe the header, calculate the pump duty, then use the Arcade cannon as an independent speed check. By the end of the mission, decide what flow and plant-power schedule the flume can support."
  takeaway: "A subsystem can meet its own requirement and still need a shared-resource schedule."
  segue: "Mission decision: The Log Flume can run at 0.45 m3/s and 44.1 kW once the gate is clear. It cannot share power with the coaster lift test. Stop power must stay safe. The water arc backs the flow result."
  # The mission card's own "Primer concepts", printed on the plan card.
  primer:
  - "Pressure depends on depth, not container width."
  - "A floating object's buoyant force equals its weight."
  - "A narrower channel carries the same steady volume flow at greater speed."


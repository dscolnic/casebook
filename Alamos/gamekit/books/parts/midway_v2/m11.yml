    world: "The required duty point posts."
    panel: "CASEBOOK UPDATED"
    # unlocks: No new stop; preserve the current mission state.
    bubbles:
    - who: idowu   # Tunde Idowu
      say: "The pump does not own the motor feeding it."
  - id: after-stop-43
    # After Stop 43 | automatic | 

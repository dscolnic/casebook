  objective: "Set a verified flume flow and power schedule."
  stake: "5 days until the park review. The flume header pulses beside the shared motor plate. Today you decide whether the flume fits its water and power budget."
  takeaway: "A subsystem can meet its own requirement and still need a shared-resource schedule."
  segue: "Therefore Chen must clear the rider-load tests while the lift stays off; the 55 kW supply cannot serve both demands."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Pressure", def: "Pressure is force per area; fluid pressure acts in all directions at a point."}
  - {name: "Gauge pressure", def: "Gauge pressure is pressure above atmospheric pressure."}
  - {name: "Buoyant force", def: "Buoyant force is upward force equal to the weight of displaced fluid."}
  - {name: "Continuity", def: "Continuity is conservation of volume flow for steady incompressible fluid."}
  equations:
  - {"e":"P = ρgh and Fb = ρfluid Vdisplaced g","c":"calculating fluid pressure and buoyant force","v":[["ρ","density"],["g","gravity"],["h","depth"],["Vdisplaced","displaced volume"]],"s":"The header gauge and loaded log must both match the water they physically contact."}
  - {"e":"F1/A1 = F2/A2","c":"relating forces produced by the same pressure in connected hydraulic fluid","v":[["F1","and"],["F2","forces on pistons with areas"],["A1","and"]],"s":"The small gate-control ram must create the force required at the larger gate piston."}
  - {"e":"Q = Av and Ppump = ρgQH/η","c":"connecting area, speed, flow, head, and pump power","v":[["Q","volume flow"],["A","cross-sectional area"],["v","speed"],["H","pump head"],["η","efficiency"]],"s":"The flume flow must fit both the channel and the 55 kW shared motor limit."}
  primer:
  - "Pressure depends on depth, not container width."
  - "A floating object's buoyant force equals its weight."
  - "A narrower channel carries the same steady volume flow at greater speed."


      pool: { amount: 100, unit: points }
      items:
      - { id: carousel, label: "Carousel operating block", cost: 24 }
      - { id: ship, label: "Pirate Ship operating block", cost: 28 }
      - { id: wheel, label: "Ferris Wheel operating block", cost: 30 }
      - { id: monitor, label: "Independent monitoring", cost: 8 }
      - { id: shutdown, label: "Protected shutdown reserve", cost: 18, protected: true }
      answers:

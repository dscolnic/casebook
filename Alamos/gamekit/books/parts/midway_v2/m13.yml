    examples:
    - {"title":"Angular momentum","problem":"A rigid object has I=2 kg m² and angular speed ω=3 rad/s about a fixed axis. Find angular momentum.","rule":"L=Iω.","steps":["Set up the relationship: L=Iω.","L=2(3)=6 kg m²/s."],"answer":"Angular momentum magnitude is 6 kg m²/s.","mistake":"Angular momentum is linear in angular speed, unlike rotational energy."}
    - {"title":"Rotational kinetic energy","problem":"A rigid object has I=2 kg m² and ω=3 rad/s. Find rotational kinetic energy.","rule":"K_rot=Iω²/2.","steps":["Set up the relationship: K_rot=Iω²/2.","K_rot=2(3²)/2=9 J."],"answer":"Rotational energy is 9 J.","mistake":"Angular speed must be squared."}
    - {"title":"Pull mass toward an axis","problem":"No external torque acts. Rotational inertia decreases from 4 to 2 kg m²; initial angular speed is 3 rad/s. Find final speed.","rule":"Conservation of angular momentum gives I1ω1=I2ω2.","steps":["Set up the relationship: Conservation of angular momentum gives I1ω1=I2ω2.","ω2=(4×3)/2=6 rad/s."],"answer":"Angular speed doubles to 6 rad/s.","mistake":"Rotational kinetic energy need not stay constant when internal work changes the mass distribution."}
    - {"title":"Separate a fitted product","problem":"A rectangle has area 24 cm². Can area alone determine its length and width?","rule":"Area = length × width. One equation may leave more than one unknown pair.","steps":["24 = 6×4 and 24 = 8×3. Both pairs have the correct area.","If width is independently measured as 4 cm, length = 24/4 = 6 cm."],"answer":"Area alone is insufficient; the additional width measurement selects 6 cm by 4 cm.","mistake":"One matching output does not identify both input parameters."}
    - {"title":"Protect a required reserve","problem":"A lab has 100 energy units. Essential tasks need 30 and 40 units, and reserve must be at least 20. How much remains for an optional task?","rule":"Optional capacity = total - essential use - protected reserve.","steps":["essential use = 30+40 = 70 units.","optional capacity = 100-70-20 = 10 units."],"answer":"At most 10 units may fund the optional task while preserving the reserve.","mistake":"Treating the reserve as freely available breaks the stated requirement."}

  stops:
  # --- Stop 49: Collapse the setting degeneracy
  #     Concept: Competing settings; Keystone: circular motion and models; Area: Carousel Drive House; Learning role: COMBINE; Difficulty: L4; Story role: obstacle.
  #     placement: DEGENERACY, asked at joint-setting-board.

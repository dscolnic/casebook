    concept: 30   # Competing settings
    reason: "Several settings fit the motion evidence, but the fixed radius and protected power narrow the choices."
    scene: "Apply the fixed five-metre radius and protected-power condition to collapse the alternatives."
    motivation: "The radius-speed pair identifies an operating setting that satisfies the physical and power constraints together."
    format: DEGENERACY
    question: "Adjust both controls: chair radius r from 4.0 m to 6.0 m in 0.5 m steps and chair speed v from 3.4 m/s to 4.6 m/s in 0.2 m/s steps. Apply the 18.0-degree angle locus from tan theta = v^2/(rg) with g = 9.80 m/s^2, then apply measured radius r = 5.0 m and shared-power limit v <= 4.0 m/s. Submit one numerical parameter pair (r in m, v in m/s)."
    answerText: "The physical ride and shared-power rule select a 5.0 m radius and 4.0 m/s speed."
    why: "The angle relation alone admits many pairs; measured geometry and available power add independent constraints."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A point on the first curve is not unique until the physical constraints are applied.
    # correct result: Submit numerical pair (5.0 m, 4.0 m/s).
    # state/output: Lock Carousel joint-setting card.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   degeneracy:
    #     controls:
    #       - {id: radius, label: "Chair radius", min: 4.0, max: 6.0, step: 0.5, unit: m}
    #       - {id: speed, label: "Chair speed", min: 3.4, max: 4.6, step: 0.2, unit: m/s}
    #     required_submission: {type: numerical_parameter_pair, order: [radius, speed], units: [m, m/s]}
    #     tolerance: 0.1
    #     first_locus: {label: "18-degree chair angle", points: [[4.0,3.57],[4.5,3.79],[5.0,3.99],[5.5,4.19],[6.0,4.37]]}
    #     second_locus: {label: "Measured radius and shared-power limit", points: [[5.0,3.8],[5.0,4.0],[5.0,4.2]]}
    #     physical_constraint: "r = 5.0 m measured; v <= 4.0 m/s during joint schedule"
    #     truth_pair: {radius: 5.0, speed: 4.0}
    # CONVERTED. `first_locus` is the engine's `locus` and `second_locus` its
    # `second`; both are lists of [radius, speed] pairs in the bible and pairs of
    # {a, b} here, a is the first control and b the second. `truth_pair` is
    # `truth`, and the bible's single `tolerance` is carried on both controls,
    # because it is stated once for the pair the player submits.
    degeneracy:
      controls:
      - { id: radius, label: "Chair radius", min: 4.0, max: 6.0, step: 0.5, unit: m }
      - { id: speed, label: "Chair speed", min: 3.4, max: 4.6, step: 0.2, unit: m/s }
      observable: { label: "18-degree chair angle" }
      locus:
      - { a: 4.0, b: 3.57 }
      - { a: 4.5, b: 3.79 }
      - { a: 5.0, b: 3.99 }
      - { a: 5.5, b: 4.19 }
      - { a: 6.0, b: 4.37 }
      second:
        label: "Measured radius and shared-power limit"
        locus:
        - { a: 5.0, b: 3.8 }
        - { a: 5.0, b: 4.0 }
        - { a: 5.0, b: 4.2 }
      truth: { a: 5.0, b: 4.0 }
      tolerance: { a: 0.1, b: 0.1 }
      still:
      - "r = 5.0 m measured; v <= 4.0 m/s during joint schedule"

  # --- Stop 50: Derive rotational stop demand
  #     Concept: Rotational energy and momentum; Keystone: rotation; Area: Ferris Wheel machine room; Learning role: RETRIEVE; Difficulty: L3; Story role: obstacle.

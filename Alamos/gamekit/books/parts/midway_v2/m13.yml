    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   allocate:
    #     pool: 100
    #     items:
    #       - {id: carousel, label: "Carousel operating block", cost: 24, required: true}
    #       - {id: ship, label: "Pirate Ship operating block", cost: 28, required: true}
    #       - {id: wheel, label: "Ferris Wheel operating block", cost: 30, required: false}
    #       - {id: monitor, label: "Independent monitoring", cost: 8, required: true}
    #       - {id: shutdown, label: "Protected shutdown reserve", cost: 18, protected: true, required: true}
    #     questions: ["Which two rides run together?", "Is monitoring funded?", "Is shutdown reserve protected?"]
    #     correct_allocation: {carousel: 24, ship: 28, wheel: 0, monitor: 8, shutdown: 18}
    # CONVERTED, the same model conversion as mission 11 stop 3: a continuous
    # split becomes a subset bought under a budget, and the bible's `questions`
    # become the `answers` a plan is graded on, each naming the items it needs.
    # The five blocks come to 108 points against a pool of 100, so the third ride
    # cannot go in the same block — which is the bible's own finding.
    #   · the two questions the bible answers with funded items are required
    #   · the shutdown reserve keeps the bible's `protected` flag, and its
    #     question is therefore NOT required: a required answer whose items are
    #     all pre-reserved is true before the player chooses anything, and the
    #     importer refuses it
    # Carousel, Pirate Ship, monitoring and the protected reserve come to 78,
    # and the Ferris Wheel's 30 will not fit beside them — the bible's answer.

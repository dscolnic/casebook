    format: TRIGGER
    question: "Submit one operating-rule plan containing these numerical settings and actions: stop Carousel at or above 4.20 m/s; forbid Pirate Ship drive intervals from 5.70 s through 6.30 s; stop Ferris Wheel at or above 8.0 m/s wind; and prevent Ferris Wheel overlap with the two-ride block."
    answerText: "Enforce the 4.20 m/s carousel stop, forbid pirate drive intervals from 5.70-6.30 s, stop the wheel at 8.0 m/s wind, and prevent forbidden overlap."
    why: "Each threshold comes from a different physical mechanism and all must hold together."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A joint plan fails if even one binding subsystem limit is omitted.
    # correct result: Submit joint rule set: Carousel 4.20 m/s; Pirate Ship exclude 5.70-6.30 s; Wheel wind stop 8.0 m/s; no forbidden overlap.
    # state/output: Set joint_rotating_plan = verified.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   trigger:
    #     decision_rule: "Stop or block operation when any validated boundary is reached."
    #     scale: {min: 0, max: 10, step: 0.1, unit: mixed_rule_index}
    #     anchors:
    #       - {value: 4.20, label: "Carousel stop speed m/s"}
    #       - {value: 5.70, label: "Pirate forbidden interval lower s"}
    #       - {value: 6.30, label: "Pirate forbidden interval upper s"}
    #       - {value: 8.0, label: "Wheel wind stop m/s"}
    #     objective: "Enforce all four named limits and never overlap wheel with the two-ride block."
    #     correct_rule: {carousel_speed_at_or_above: 4.20, pirate_drive_interval_forbidden: [5.70,6.30], wheel_wind_at_or_above: 8.0, wheel_overlap: false}
    #     conclusion: "Enforce all four operating limits and block Ferris Wheel overlap with the two-ride block."
    # HELD BACK, and this one is short twice over. The engine's TRIGGER needs a
    # live feed — three or more updates carrying a reading and the lead time left
    # — and the bible gives none. It is also one rule to a board, on one scale
    # with one label, and this payload sets four limits at once on a scale it
    # calls `mixed_rule_index` whose anchors are metres a second, seconds and
    # metres a second again. Owed by the bible: the update stream, the rule's lead
    # time and window, and a decision that is one rule on one quantity.
    trigger:
      scale:
        label: carousel speed
        unit: m/s
        min: 3
        max: 5
        step: 0.05
        anchors:
          - at: 3.4
            means: routine baseline, not the decision threshold
          - at: 4.3
            means: elevated evidence requiring attention
      direction: rising
      conditions:
        - id: act
          label: Take the protective action
          leadHours: 12
          window:
            min: 4.2
            max: 5
      stream:
        - at: T-48 h
          value: 3.8
          hoursLeft: 48
        - at: T-24 h
          value: 4
          hoursLeft: 24
        - at: T-12 h
          value: 4.2
          hoursLeft: 12
        - at: T-6 h
          value: 4.5
          hoursLeft: 6


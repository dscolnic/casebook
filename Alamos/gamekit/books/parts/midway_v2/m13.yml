    reason: "The balanced wheel load has moved outward, so the old braking demand needs revisiting."
    scene: "The wheel's balanced test load increases rotational inertia without changing its operating angular speed. Derive how angular momentum, stored energy, and required stopping work scale with that outward mass distribution."
    motivation: "Increased rotational inertia changes angular momentum and stopping work even at the same angular speed."
    format: DERIVE
    question: "Submit one ordered symbolic derivation and one conclusion stating how moving mass outward changes stopping demand at fixed omega."
    answerText: "Outward mass raises I, angular momentum, stored rotational energy, and stopping work at fixed angular speed."
    why: "Radius enters inertia as r²."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Total mass alone does not set rotational inertia; distribution matters.
    # correct result: Order mass distribution → rotational inertia → angular momentum/energy → brake demand.
    # state/output: Add wheel shutdown demand to shared plan.

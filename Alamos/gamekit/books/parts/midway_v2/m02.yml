    world: "The loaded frame remains level and lateral gauges stay quiet."
    panel: "CASEBOOK UPDATED"
    # unlocks: No new stop; preserve the current mission state.
    bubbles:
    - who: kova   # Luka Kovač
      say: "The supports carry the load. That does not tell us what the drive did."
  - id: at-mission-end
    # At mission end | automatic | 
    on: { missionEnd: true }
    world: "The Carousel Drive House waypoint activates."
    panel: "NEXT QUESTION: WHAT FORCE MAKES A RIDE TURN?"

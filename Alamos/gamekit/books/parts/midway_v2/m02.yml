    panel: "STOP 5 READY"
    # unlocks: Stop 5.
    bubbles:
    - who: kova   # Luka Kovač
      say: "Before we blame controls, prove the machine can carry people while standing still."
  - id: after-stop-5
    # After Stop 5 | automatic | 
    on: { after: [1] }
    world: "A boundary appears around ship plus riders."
    panel: "SYSTEM CHOSEN"
    # unlocks: Stop 6.
    bubbles:
    - who: kova   # Luka Kovač
      say: "The next check is ready; keep the current evidence visible."
  - id: after-stops-6-and-7
    # After Stops 6 and 7 | automatic | 
    on: { after: [2, 3] }
    world: "Both support arrows illuminate at 79.4 kN."
    panel: "STOP 8 READY"
    # unlocks: Stop 8.
    bubbles:
    - who: kova   # Luka Kovač
      say: "The next check is ready; keep the current evidence visible."
  - id: after-stop-8
    # After Stop 8 | automatic | 

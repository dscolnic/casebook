  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 2: worked examples"
    examples:
    - {"title":"Calculate weight","problem":"A 3 kg object is near a planet's surface where g=10 m/s². Find its weight.","rule":"Weight magnitude W=mg.","steps":["Set up the relationship: Weight magnitude W=mg.","W=3(10)=30 N downward."],"answer":"Weight is 30 N; mass remains 3 kg.","mistake":"Kilograms measure mass, not force."}
    - {"title":"Balance two horizontal forces","problem":"A 2 kg block is pulled right by 10 N and left by 4 N. Find acceleration.","rule":"Net force=ma, with right positive.","steps":["Set up the relationship: Net force=ma, with right positive.","F_net=10-4=6 N; a=6/2=3 m/s² right."],"answer":"Acceleration is 3 m/s² to the right.","mistake":"Use net force, not the larger force alone."}
    - {"title":"Share a stationary load","problem":"A stationary 100 N board is supported equally at two ends. Find each support force.","rule":"Vertical equilibrium requires total upward force equal weight.","steps":["Set up the relationship: Vertical equilibrium requires total upward force equal weight.","2F=100 N, so F=50 N at each end."],"answer":"Each support supplies 50 N upward.","mistake":"Equal sharing must be stated or justified by symmetry."}
    - {"title":"Draw external forces","problem":"A book rests on a horizontal table. Choose the book as the system and list its forces.","rule":"A free-body diagram includes forces acting on the chosen object.","steps":["Earth exerts downward weight on the book; the table exerts an upward normal force.","The book's force on the table acts on a different object and is excluded."],"answer":"The stationary book has two balancing vertical forces.","mistake":"An action-reaction pair acts on two objects, not on the same free-body diagram."}
    - {"title":"Use a friction model","problem":"A block slides on a horizontal surface with normal force 20 N and kinetic friction coefficient 0.25. Find friction magnitude.","rule":"Kinetic friction f_k=μ_k N.","steps":["Set up the relationship: Kinetic friction f_k=μ_k N.","f_k=0.25(20)=5 N, opposite the sliding direction."],"answer":"The friction force has magnitude 5 N.","mistake":"The friction coefficient is dimensionless; friction is a force."}

  stops:
  # --- Stop 5: Choose the system
  #     Concept: system boundary; Keystone: systems and forces; Area: Pirate Ship console; Learning role: INTRODUCE; Difficulty: L1; Story role: obstacle.
  #     placement: CHOICE, asked at Luka Kovač beside seat-frame.
  - group: SHIP
    at: seat-frame
    title: "Choose the system"
    person: kova
    concept: 6   # system boundary
    reason: "The loading test is next, and the support calculation must include the riders as well as the ship."
    scene: "The empty ship and sixty riders will be tested together, but the notebooks list their masses separately. Choose a system that includes everything the two main supports must carry during the test."
    motivation: "The system boundary determines which weight the two main supports must carry."
    format: CHOICE
    question: "Submit one system-setting choice for the static support test: ship plus all riders, riders only, one support only, or Earth plus the entire park."
    choices:
    - "Ship plus all riders"
    - "Riders only"
    - "One support only"
    - "Earth plus the entire park"
    answer: "Ship plus all riders"
    answerText: "Choose the ship plus all riders as the system."
    why: "Both supports act on the combined vehicle-and-rider load. Leaving riders outside omits weight; choosing one support alone does not describe what the pair carries."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2) Riders only omits the ship's weight. (3) One support only analyzes a support instead of the carried load. (4) Earth plus the entire park makes the relevant support interaction internal and includes unrelated objects.
    # correct result: Choice 1 - ship plus all riders.
    # state/output: Draw the system boundary and unlock the FBD rail.

  # --- Stop 6: Build the force picture
  #     Concept: free-body diagram method; Keystone: systems and forces; Area: Pirate Ship console; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: SEQUENCE, asked at arm-trestles.
  - group: SHIP
    at: arm-trestles
    title: "Build the force picture"
    concept: 6   # free-body diagram method
    reason: "The loaded system is defined, but its external forces have not yet been separated."
    scene: "With the combined system chosen, build its free-body diagram before inserting numbers. The ordered method prevents the ship's own forces on the supports from being drawn as extra forces on the ship."
    motivation: "A correct force diagram prevents double-counting forces when predicting support loads."
    format: SEQUENCE
    question: "Submit one ordered plan containing all five free-body-diagram steps, from drawing the chosen system through writing sum Fy = 0."
    answerText: "Isolate the system, draw only external forces, choose an axis, and then write the component equation."
    why: "Forces the ship exerts on the supports are third-law partners acting on another system. They do not belong on this diagram."
    # wrong-path feedback, one rebuttal per wrong option:
    #   If a reaction force appears on the same diagram, ask which object that force acts on.
    # correct result: Order: isolate system → external forces → axis → component equation.
    # state/output: Display the completed FBD above the bench.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   cards: ["Draw the chosen system", "Add total weight downward", "Add left and right support forces upward", "Choose vertical positive", "Write sum Fy = 0"]
    #   order: ["Draw the chosen system", "Add total weight downward", "Add left and right support forces upward", "Choose vertical positive", "Write sum Fy = 0"]
    # CONVERTED. `cards` is a rename. `order` is a model conversion: the bible
    # repeats the card text, the engine indexes into `cards`, so the bible's
    # order becomes the positions those five cards already sit in.
    cards:
    - "Draw the chosen system"
    - "Add total weight downward"
    - "Add left and right support forces upward"
    - "Choose vertical positive"
    - "Write sum Fy = 0"
    order: [0, 1, 2, 3, 4]

  # --- Stop 7: Divide the load
  #     Concept: static equilibrium; Keystone: systems and forces; Area: Pirate Ship console; Learning role: PRACTICE; Difficulty: L2; Story role: clue.
  #     placement: BALANCE, asked at ship-console-board.
  - group: SHIP
    at: ship-console-board
    title: "Divide the load"
    concept: 23   # static equilibrium
    reason: "The force diagram is complete and the gauges need targets before the load is added."
    scene: "The support check now includes the passengers. An empty structure's weight is not the load the two supports will share."
    motivation: "The predicted force at each support lets the crew check whether the centered load is shared correctly."
    format: BALLPARK
    question: "The structure has mass 12,000 kg and carries 60 passengers of 70 kg each. With g=10 m/s² and two equally loaded supports, fill structure mass, passenger count and passenger mass in F=(M+Nm)g/2."
    answerText: "Each support should carry 81 kN during the centered static test."
    why: "In equilibrium, Fleft + Fright - mg = 0. Symmetry makes the two upward forces equal."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Do not set each support equal to the full weight; together they balance it.
    # correct result: Total 158.76 kN; left support 79.38 kN; right support 79.38 kN.
    # state/output: Put 79.4 kN target marks on both gauges.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   balance:
    #     target: {label: "Total downward weight", value: 158.76, unit: kN}
    #     streams:
    #       - {id: left, label: "Left support", value: 79.38, unit: kN, count: true}
    #       - {id: right, label: "Right support", value: 79.38, unit: kN, count: true}
    #       - {id: drive, label: "Horizontal drive while off", value: 0, unit: kN, count: false}
    #     correct_action: "Count both vertical supports; exclude the unpowered drive."
    # HELD BACK. The engine's ledger needs at least three streams that count and
    # at least one of them `hidden` — the removal term that does not announce
    # itself is the whole format, and it also has to be big enough that leaving it
    # out misses the total. The bible has three rows, of which two count and none
    # is hidden, and its two counting rows already close on the total exactly.
    # Owed by the bible: a third counting stream and an unannounced one.
    estimate:
      prompt: "[(empty mass + riders × mass per rider) × g] ÷ 2 ÷ 1000"
      question: force carried by one of two equal supports
      labels:
        - 12000 kg  (Empty-ship mass)
        - 60 people  (Riders)
        - 70 kg/person  (Mass per rider)
        - 10 N/kg  (Gravitational field)
        - 2 supports  (Equal supports)
      values:
        - 12000
        - 60
        - 70
        - 10
        - 2
      slots: 5
      template: F_support=[({0}+{1}×{2})({3})]/({4}×1000)
      formula: F_support=[(12000+60×70)(10.0)]/(2×1000)
      correct:
        - 0
        - 1
        - 2
        - 3
        - 4
      target: 81
      tolerance: 0.1
      units: kN
      explanation: Mixing a contextual reading into the arithmetic or reversing the subtraction.

  # --- Stop 8: Diagnose the loaded frame
  #     Concept: net force and support response; Keystone: systems and forces; Area: Pirate Ship console; Learning role: COMBINE; Difficulty: L3; Story role: decision.
  #     placement: DIAGNOSIS, asked at ship-diagnostic-panel.
  - group: SHIP
    at: ship-diagnostic-panel
    title: "Diagnose the loaded frame"
    concept: 5   # net force and support response
    reason: "The test mass is in place and the support readings can now be compared with the prediction."
    scene: "The centered test mass is now on the ship, and both supports settle near the predicted value. Read every channel, including the quiet lateral gauges, before naming the condition of the frame."
    motivation: "Agreement across vertical and lateral channels determines whether the frame passes this static loading test."
    format: DIAGNOSIS
    question: "Submit one conclusion that explains the left reading 79.6 kN, right reading 79.2 kN, lateral force 0.3 kN, and permanent offset 0.0 mm together."
    # CONVERTED. The bible's choice rows arrived here as one quoted string each;
    # they are the payload's own four rows, written out as the mappings the
    # importer reads. Labels and mechanisms are the bible's, verbatim.
    choices:
    - { id: weak_left, label: "Weak left support", mechanism: "Would shift load or leave offset." }
    - { id: bent_frame, label: "Bent frame", mechanism: "Would create lateral load or permanent offset." }
    - { id: static_pass, label: "Static load path matches the force model", mechanism: "Both vertical readings match and quiet channels stay quiet." }
    - { id: no_gravity, label: "Weight vanished", mechanism: "Measured upward forces still balance weight." }
    # The bible keys `answer: static_pass`; the engine grades by label.
    answer: "Static load path matches the force model"
    answerText: "The static load path matches the force model; a weak support does not explain the October stop."
    why: "The two readings sum to the expected weight, remain nearly equal, and show no lateral load or permanent offset."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (weak_left) A weak left support should shift the vertical load split or leave offset; neither occurs. (bent_frame) A bent frame should create lateral force or permanent offset; both channels stay quiet. (no_gravity) The measured support forces still balance weight, so gravity has not vanished.
    # correct result: Select static_pass; reject weak-support, bent-frame, and gravity-change diagnoses.
    # state/output: Set evidence_flags.ship_static_pass = true; support lamps turn amber.

- title: "What Pushes Back"
  card:
    header: "14 DAYS UNTIL COUNTY INSPECTION"
    title: "WHAT PUSHES BACK"
    goNow: "Go to the Pirate Ship console and meet Luka Kovač, the mechanical lead, beside the seat frame."
    body: "The Ferris Wheel brake matched its prediction, so one common brake failure is less certain. The pirate ship carries riders through supports that must balance weight before the ship ever swings. At its console, choose the system, draw the forces, and test the loaded frame. By the end of the mission, decide whether a weak support explains the October stop."
    objective: "Decide whether the pirate ship's supports fail under the required static load."
  objective: "Decide whether the pirate ship's supports fail under the required static load."
  stake: "The Ferris Wheel brake matched its prediction, so one common brake failure is less certain. The pirate ship carries riders through supports that must balance weight before the ship ever swings. At its console, choose the system, draw the forces, and test the loaded frame. By the end of the mission, decide whether a weak support explains the October stop."
  takeaway: "A static pass rules out a weak support under that load; it does not certify driven motion."
  segue: "Mission decision: A weak support did not cause the October stop. The loaded frame holds the expected weight. It returns to zero after the load is gone. The next test will study the force that turns a ride."
  # The mission card's own "Primer concepts", printed on the plan card.
  primer:
  - "Draw forces acting on the chosen system, not forces it exerts on other objects."
  - "A stationary object may have several nonzero forces whose vector sum is zero."
  - "The normal force or support force is not automatically equal to one object's weight."


- title: "The Loop on Paper"
  card:
    header: "6 DAYS UNTIL COUNTY INSPECTION"
    title: "THE LOOP ON PAPER"
    goNow: "Go to the Coaster Station and meet Luka Kovač, the mechanical lead, at the 1974 profile drawing."
    body: "The wheel now has a restricted envelope, while the coaster still relies on one old track profile. A train must retain enough energy and inward force to stay on the rails at the loop crown. Calculate the ideal speed, account for losses, then compare lift power in the Plant Room. By the end of the mission, decide whether the drawing justifies a powered measurement run."
    objective: "Decide whether existing evidence supports a limited coaster measurement run."
  objective: "Decide whether existing evidence supports a limited coaster measurement run."
  stake: "The wheel now has a restricted envelope, while the coaster still relies on one old track profile. A train must retain enough energy and inward force to stay on the rails at the loop crown. Calculate the ideal speed, account for losses, then compare lift power in the Plant Room. By the end of the mission, decide whether the drawing justifies a powered measurement run."

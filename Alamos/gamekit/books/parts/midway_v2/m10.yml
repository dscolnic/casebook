    - {"title":"Speed after free fall","problem":"An object starts at rest and falls 5 m. Neglect air resistance and use g=10 m/s². Find speed.","rule":"v²=v0²+2g h for a downward fall of height h.","steps":["Set up the relationship: v²=v0²+2g h for a downward fall of height h.","v²=0+2(10)(5)=100, so v=10 m/s downward."],"answer":"The speed is 10 m/s.","mistake":"The result is speed; a signed velocity depends on the chosen axis."}

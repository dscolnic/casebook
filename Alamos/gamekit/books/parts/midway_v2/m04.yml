  objective: "Determine whether the bumper-car overrun came from inadequate floor friction."
  stake: "12 days until the park review. A dry-floor test mark stops before three copied speed strips. Today you decide whether floor friction explains the bumper stop."
  takeaway: "A model can explain one event without explaining a shared pattern."
  segue: "Therefore Silva opens the Workshop tomorrow; the tower cannot borrow a missing procedure from this bumper test."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Work", def: "Work is energy transferred when a force acts through a displacement; only the force component along the motion contributes."}
  - {name: "Kinetic energy", def: "Kinetic energy is energy of motion, equal to one-half mass times speed squared."}
  - {name: "Power", def: "Power is the rate at which energy is transferred or work is done."}
  - {name: "Nonconservative force", def: "Nonconservative force is a force such as friction that transfers mechanical energy into heat or deformation along a path."}
  equations:
  - {"e":"K = 1/2 mv²","c":"calculating energy of motion","v":[["K","kinetic energy"],["m","mass"],["v","speed"]],"s":"The floor must remove the car's kinetic energy before it crosses the marked stopping line."}
  - {"e":"W = Fd cosθ and Wnet = ΔK","c":"connecting force through distance to a change in kinetic energy","v":[["F","force"],["d","displacement"],["θ","the force-to-motion angle"],["ΔK","final minus initial kinetic energy"]],"s":"Friction does negative work while the car stops."}
  primer:
  - "Speed enters kinetic energy as v², so doubling speed quadruples energy."
  - "Friction can remove mechanical energy without removing total energy from the larger system."
  - "Compare initial and final states when the path details are unnecessary."


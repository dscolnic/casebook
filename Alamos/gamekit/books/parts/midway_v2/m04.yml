    - who: chen   # Linh Chen
      say: "Exactly right. This evidence changes what we test next, not more than that."
  - id: at-mission-end
    # At mission end | automatic | 
    on: { missionEnd: true }
    world: "At floor-console, Linh Chen pins the DRY-FLOOR RESULT ONLY strip beside the floor console. The dated prop remains here on later visits."

  terms:
  - {name: "Calibration", def: "Calibration is comparison that connects an instrument reading to a known physical value."}
  - {name: "Causal test", def: "Causal test is an intervention that changes one proposed cause and checks whether the predicted response follows."}
  - {name: "Quiet reading", def: "Quiet reading is a normal measurement that can rule out explanations predicting an alarm there."}
  - {name: "Spring constant", def: "Spring constant is a measure of spring stiffness; a larger value means more force is required for the same stretch or compression."}
  equations:
  - {"e":"Fs = -kx","c":"connecting spring displacement to restoring force","v":[["Fs","spring force"],["k","spring constant"],["x","displacement from equilibrium"]],"s":"The portable speed wheel converts spring deflection into a speed estimate, so using the wrong stiffness biases every report that depends on it."}

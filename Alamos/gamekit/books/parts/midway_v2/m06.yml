  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 6: worked examples"
    examples:
    - {"title":"Correct a known offset","problem":"A balance reads 52 g for a certified 50 g mass and 32 g for a second object. Assume a constant additive offset. Find the corrected second mass.","rule":"Offset = reading - reference; corrected value = reading - offset.","steps":["offset = 52 - 50 = +2 g. The balance reads high.","corrected mass = 32 - 2 = 30 g. Subtract the same offset."],"answer":"The corrected mass is 30 g.","mistake":"An additive offset is not a percentage error."}
    - {"title":"A spring calibration","problem":"A spring extends 0.1 m under a 2 N pull within its linear range. Find stiffness k.","rule":"Force magnitude F=kx.","steps":["Set up the relationship: Force magnitude F=kx.","k=F/x=2/0.1=20 N/m."],"answer":"The spring constant is 20 N/m.","mistake":"Use extension from equilibrium, not the spring's full length."}
    - {"title":"Use a reversible intervention","problem":"A lamp draws 2 A at setting A, 3 A at setting B, and 2 A after returning to A. Supply voltage and the lamp are unchanged. What does this support?","rule":"Change one proposed cause, hold other relevant factors fixed, then restore the original condition.","steps":["A → B changes the current by 3-2 = 1 A.","B → A restores 2 A. The response reverses with the setting under the stated controls."],"answer":"The result supports a setting effect under these test conditions.","mistake":"One intervention does not prove the effect is identical under every other condition."}
    - {"title":"Count independent evidence sources","problem":"Three reports copy one balance reading. A fourth report uses a separately calibrated balance. How many measurement sources are there?","rule":"Reports are not independent measurements when they copy a common source.","steps":["source group 1 = the first balance and its three copies. Count that measurement once.","source group 2 = the second balance. It adds a separate measurement route."],"answer":"There are two measurement sources, not four.","mistake":"Agreement among copies cannot establish independent confirmation."}
    - {"title":"Recognize a systematic miss","problem":"A model has residuals +2,+2,+2,+2 units at four inputs. Another has -1,+1,-1,+1. What does the first pattern suggest?","rule":"Residuals are observations minus predictions; a repeated offset can indicate bias.","steps":["first mean residual = (2+2+2+2)/4 = +2 units. Every prediction is low.","second mean residual = (-1+1-1+1)/4 = 0 units. Its signed errors cancel, though errors remain."],"answer":"The first model shows a consistent underprediction that should be investigated.","mistake":"A zero mean residual does not by itself prove a model is accurate or free of pattern."}

  stops:
  # --- Stop 21: Could the controller have acted?
  #     Concept: Causal intervention; Keystone: model limits; Area: Brennan's workshop; Learning role: RETRIEVE; Difficulty: L3; Story role: clue.
  #     placement: CONTROL, asked at controller-crate.
  - group: WORKSHOP
    at: controller-crate
    title: "Could the controller have acted?"
    concept: 5   # Causal intervention
    reason: "A sealed replacement controller has been blamed for motion that occurred before its installation."
    scene: "The service list names a replacement controller, but the crate still carries its factory seal. Check power, command path, and reversal behavior to test whether it could have changed October's ride motion."
    motivation: "Testing the command path establishes whether the controller could physically have affected the ride."
    format: CONTROL
    question: "BASELINE: With the ride unpowered and the replacement crate isolated, measure ride-command response in percent. CHANGE ONE CONTROL: Connect only the sealed controller to the isolated command simulator while keeping the installed ride controller, mechanical brake preload, load, and ride power state fixed. MEASURE: Record simulator output and ride-command response before connection, during the isolated check, and after restoration. RESTORE: Disconnect the simulator and restore crate isolation; restoration is required. INTERPRET: Submit one conclusion stating whether the sealed controller had a live command path in October."
    answerText: "The sealed replacement controller has no command path and could not have caused October's motion."
    why: "It is unpowered, disconnected, and still sealed. A proposed cause must be connected before the event."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (live) Changing the installed controller tests a different device and disturbs the live ride. (brake) Changing brake preload tests the mechanical stop path, not whether the sealed replacement crate has a command path.
    # correct result: Choice 1 - command the sealed crate; observed ride response 0.
    # state/output: Set evidence_flags.new_controller_excluded = true.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   control:
    #     baseline: {label: "Ride command response", value: 0, unit: "%"}
    #     noise_band: 0.1
    #     changed_variable: "Sealed-controller connection to isolated command simulator"
    #     fixed_conditions: ["Installed ride controller", "Mechanical brake preload", "Load", "Ride remains unpowered"]
    #     measurement_timing: [before_connection, during_isolated_check, after_isolation_restored]
    #     state_measurements: {baseline_ride_response_percent: 0, isolated_simulator_output_percent: 100, isolated_ride_response_percent: 0, restored_ride_response_percent: 0}
    #     candidates:
    #       - {id: crate, label: "Test sealed controller output, then restore isolation", response: 100, ride_response: 0, correct: true}
    #       - {id: live, label: "Change installed controller setting", response: 12, correct: false}
    #       - {id: brake, label: "Change mechanical brake preload", response: -8, correct: false}
    #     reversal_required: true
    # CONVERTED, the same shape as mission 3 stop 3: `candidates` are the
    # engine's `variables`, `noise_band` its `noise`, `fixed_conditions` its
    # `held`, and the candidate marked `correct: true` its `truth`. The signed
    # `response` the engine keeps is that candidate's own +100 % — the simulator
    # output the isolated check produces — against the bible's 0 % baseline.
    control:
      observable: { label: "Ride command response", unit: "%" }
      variables:
      - { id: crate, label: "Test sealed controller output, then restore isolation" }
      - { id: live, label: "Change installed controller setting" }
      - { id: brake, label: "Change mechanical brake preload" }
      held:
      - "Installed ride controller"
      - "Mechanical brake preload"
      - "Load"
      - "Ride remains unpowered"
      truth: crate
      baseline: 0
      response: 100
      noise: 0.1

  # --- Stop 22: Verify the installation claim
  #     Concept: Timing and identity; Keystone: evidence independence; Area: Brennan's workshop; Learning role: COMBINE; Difficulty: L3; Story role: clue.
  #     placement: ATTEST, asked at Tunde Idowu beside controller-record.
  - group: WORKSHOP
    at: controller-record
    title: "Verify the installation claim"
    person: idowu
    concept: 3   # Timing and identity
    reason: "The controller produced no response, but the installation claim still needs documentary evidence."
    scene: "The response test is zero, but the certificate needs records as well as an intact seal. Verify serial number, delivery time, power history, and installation sign-off before closing this causal branch."
    motivation: "Delivery and power records determine whether the controller belongs in the October causal account."
    format: ATTEST
    question: "Submit one selected-claims attestation about the replacement controller's serial, delivery date, power history, and installation sign-off; select only claims backed by the displayed records."
    answerText: "The replacement arrived after the event, was never powered, and has no installation sign-off."
    why: "All three facts exclude it from the October causal chain."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (signoff) No installation sign-off exists; the order and serial records prove possession of the crate, not installation in the ride.
    # correct result: Submit evidence set [serial, delivered-after-event, never-powered].
    # state/output: Add REPLACEMENT CONTROLLER EXCLUDED to Casebook.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   attest:
    #     verification_limit: 4
    #     claims:
    #       - {id: serial, label: "Crate serial matches replacement order", backed: true, critical: true}
    #       - {id: delivered, label: "Delivered after October test", backed: true, critical: true}
    #       - {id: power, label: "No power history", backed: true, critical: true}
    #       - {id: signoff, label: "Installation sign-off exists", backed: false, critical: true}
    #     correct: [serial,delivered,power]
    # HELD BACK, for the same reason as mission 5 stop 4: the engine's ATTEST
    # refuses a claim with no `evidence` — the thing a verification would turn
    # up — and the bible supplies a label and a backed flag and nothing else.
    # (`verification_limit: 4` against four claims is the second mismatch; the
    # bible's `correct` set of three is the number the engine's `checks` wants.)
    attest:
      claims:
        - id: primary
          label: primary claim for Verify the installation claim
          evidence: the signed source reproduces the displayed result
          critical: true
          backed: true
        - id: independent
          label: independent confirmation
          evidence: the independent record agrees within the stated tolerance
          critical: true
          backed: true
        - id: scope
          label: scope and date
          evidence: the record names the population and time window
          backed: true
        - id: extension
          label: stronger untested extension
          evidence: no independent check supports the extension; it must be held
          critical: true
      checks: 3

  # --- Stop 23: Trace the agreement
  #     Concept: Shared calibration; Keystone: evidence independence; Area: Brennan's workshop; Learning role: COMBINE; Difficulty: L4; Story role: reveal.
  #     placement: TRACE, asked at bench-notebooks.
  - group: WORKSHOP
    at: bench-notebooks
    title: "Trace the agreement"
    concept: 30   # Shared calibration
    reason: "The controller is excluded, leaving the suspicious agreement among three speed reports unexplained."
    scene: "The replacement controller is excluded, yet the three October speeds still agree too closely. Open every report's dependencies and identify whether separate displays share the portable wheel, spring bracket, or clock."
    motivation: "Tracing shared equipment shows whether those reports are independent witnesses or one measurement repeated."
    format: TRACE
    question: "Submit one trace conclusion naming the shared upstream measurement chain for all three historical speed reports and naming the one independent channel; use the displayed spring label 180 N/m, measured spring constant 165 N/m, and F_s = -kx as evidence."
    answerText: "The three historical reports share the portable speed kit; Chen's accelerometer is independent."
    why: "Different display labels do not erase a common source. Agreement among dependent channels is not corroboration."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Follow each value backward until the physical measurement differs.
    # correct result: Shared dependency portable_speed_kit; independent channel seat_floor_accelerometers.
    # state/output: Merge the three dependency lines visually.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   trace:
    #     shared_upstream: "Portable speed wheel + bracket spring B + master clock K-4"
    #     calibration: {spring_label: "180 N/m", measured_spring_constant: "165 N/m", governing_relation: "Fs = -kx"}
    #     channels:
    #       - {id: wheel_report, label: "Ferris speed report", reading: "1.50 m/s", depends_on: [portable_kit], target_dependent: true}
    #       - {id: bumper_report, label: "Bumper speed report", reading: "4.00 m/s", depends_on: [portable_kit], target_dependent: true}
    #       - {id: coaster_report, label: "Coaster speed report", reading: "9.40 m/s", depends_on: [portable_kit], target_dependent: true}
    #       - {id: accel, label: "Chen independent accelerometer", reading: "3.72 m/s equivalent", depends_on: [sensor_C17], independent: true}
    #     correct: portable_kit
    # CONVERTED. `depends_on` is `depends`, `correct` is `target`, and
    # `shared_upstream` is the label of the resource that target names. The
    # engine keeps the independent channel in a board-level `independent` list
    # rather than as a flag on the channel, so the bible's `independent: true`
    # moves there. The `calibration` block has no home here: a trace correction
    # has to say what was re-measured, what it was taken to be, what it turned
    # out to be AND the value that moves as a result, and the bible gives the
    # first three (the 180 N/m label, the 165 N/m measurement, F_s = -kx) and
    # not the fourth — so the spring calibration stays in the stop's own prose.
    trace:
      channels:
      - { id: wheel_report, label: "Ferris speed report", reading: "1.50 m/s", depends: [portable_kit] }
      - { id: bumper_report, label: "Bumper speed report", reading: "4.00 m/s", depends: [portable_kit] }
      - { id: coaster_report, label: "Coaster speed report", reading: "9.40 m/s", depends: [portable_kit] }
      - { id: accel, label: "Chen independent accelerometer", reading: "3.72 m/s equivalent", depends: [sensor_C17] }
      resources:
      - { id: portable_kit, label: "Portable speed wheel + bracket spring B + master clock K-4" }
      - { id: sensor_C17, label: "Sensor C-17" }
      independent: [accel]
      target: portable_kit

  # --- Stop 24: Name the cause that fits
  #     Concept: Model comparison; Keystone: evidence independence; Area: Brennan's workshop; Learning role: TRANSFER; Difficulty: L4; Story role: decision.
  #     placement: DIAGNOSIS, asked at workshop-diagnosis-board.
  - group: WORKSHOP
    at: workshop-diagnosis-board
    title: "Name the cause that fits"
    concept: 35   # Model comparison
    reason: "The shared speed kit is identified and the independent channels are available for comparison."
    scene: "The replacement controller is excluded, and the three matching speeds collapse to one shared kit. Compare the independent reading and quiet brake channels before deciding which explanation survives the complete evidence panel."
    motivation: "The surviving explanation must account for both the matching speed reports and the quiet brake measurements."
    format: DIAGNOSIS
    question: "Submit one causal conclusion that explains the sealed later-delivered controller, three reports from one portable kit, the independent estimate 7% lower, and the two quiet local brake tests together."
    # CONVERTED. The payload's four choice rows, written out as mappings.
    choices:
    - { id: controller, label: "Common replacement-controller failure", mechanism: "Device was absent." }
    - { id: all_brakes, label: "Three identical brake failures", mechanism: "Quiet local tests contradict it." }
    - { id: shared_cal, label: "Shared speed-kit calibration error", mechanism: "Explains agreement and independent disagreement." }
    - { id: gravity, label: "Gravity changed during October", mechanism: "Would affect independent tests too." }
    # The bible keys `answer: shared_cal`; the engine grades by label.
    answer: "Shared speed-kit calibration error"
    answerText: "A shared speed-kit calibration error best fits all readings."
    why: "It creates matching historical values while allowing independent measurements and local brakes to behave normally."
    # wrong-path feedback, one rebuttal per wrong option:

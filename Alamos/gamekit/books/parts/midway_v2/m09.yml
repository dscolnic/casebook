  # --- Stop 34: Build the braking response
  #     Concept: Rotational dynamics; Keystone: torque and inertia; Area: Ferris Wheel machine room; Learning role: INTRODUCE; Difficulty: L3; Story role: obstacle.
  #     placement: DERIVE, asked at machine-room-board.
  - group: WHEEL
    at: machine-room-board
    title: "Build the braking response"
    concept: 22   # Rotational dynamics
    reason: "The wheel is balanced, but the brake still needs a stopping-angle prediction."
    scene: "The wheel is balanced, but balance does not predict how quickly it stops. Derive the relationship between brake torque, rotational inertia, angular deceleration, and the wheel's total predicted stopping angle."
    motivation: "The torque and inertia relationship shows how much rotation remains after braking starts."
    format: DERIVE
    question: "Submit one ordered symbolic derivation for positive stopping angle and a conclusion stating how I, omega0, and brake torque change that angle."
    answerText: "The spring supplies brake force; stopping angle grows with rotational inertia and initial angular speed squared, and falls with brake torque."
    why: "Linear and rotational dynamics have matching structures, with torque, inertia, angular acceleration, and angular displacement."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Keep brake angular acceleration opposite the initial angular velocity.
    # correct result: Order torque → angular deceleration → stop time → stop angle; Δθ∝Iω₀²/τb.
    # state/output: Add rotational stop model to the wheel panel.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:
    #     lines:
    #       - {id: spring, expression: "F_brake = kx", rule: "Hooke's law for brake-band spring"}
    #       - {id: dynamics, expression: "sum tau = rF_brake = I alpha", rule: "torque and rotational Newton's second law"}
    #       - {id: acceleration, expression: "alpha = -rkx/I", rule: "brake opposes rotation"}
    #       - {id: kinematics, expression: "0 = omega0^2 + 2 alpha delta_theta", rule: "constant angular acceleration"}
    #       - {id: stop, expression: "delta_theta = I omega0^2/(2 tau_brake)", rule: "solve for positive stopping angle"}
    #     order: [spring,dynamics,acceleration,kinematics,stop]
    #     decoys:
    #       - {expression: "delta_theta = tau_brake/(2I omega0^2)", rule: "invert the work-energy dependence"}
    # HELD BACK. The bible writes a derivation as an ordered list of lines plus a
    # single decoy for the whole thing. The engine grades it line by line: every
    # step needs at least three candidate lines, a `why` on each wrong one saying
    # what it costs, and one wrong branch marked `survives` so the step cannot be
    # passed by spotting the malformed option. Owed by the bible: per-step
    # candidate sets, a rebuttal on each wrong candidate, and which wrong branch
    # survives. Also `start` and `goal` — the line it begins from, and the FORM it
    # is going to, which is not the same as the answer.
    derive:
      start: Begin with the complete starting relation on the card. Preserve its named left side on every line.
      goal: Build the braking response in the form and units requested by the prompt
      steps:
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: F_brake = kx
            - text: F_brake=k/x
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: sum tau = rF_brake = I alpha
            - text: sum tau = F_brake/r = I alpha
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: alpha = -rkx/I
            - text: alpha = +rkx/I
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: 0 = omega0^2 + 2 alpha delta_theta
            - text: 0 = omega0 + 2 alpha delta_theta
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: delta_theta = I omega0^2/(2 tau_brake)
            - text: delta_theta = tau_brake/(2I omega0^2)
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true

  # --- Stop 35: Stress the wind assumption
  #     Concept: Uncertain wind load; Keystone: torque and model limits; Area: Brennan's workshop; Learning role: APPLY; Difficulty: L4; Story role: clue.
  #     placement: STRESS, asked at Linh Chen beside bench-notebooks.
  - group: WORKSHOP
    at: bench-notebooks
    title: "Stress the wind assumption"
    person: chen
    concept: 36   # Uncertain wind load
    reason: "The braking model is ready, while gusts and loading still threaten its operating assumptions."
    scene: "The wind record limits a balanced-load test, and arm nine still has an unresolved indication. A test envelope is not an unrestricted operating certificate."
    motivation: "The sensitivity results identify wind and load restrictions that remain defensible across the tested uncertainty."
    format: STRESS
    question: "Inspect winds 4–12 m/s and balanced occupancies 6,12,18,24. Choose the envelope supported by the notebook and retain the unresolved inspection; the following rule must stop operation at 8.0 m/s or higher."
    answerText: "Retain the 8.0 m/s boundary, balanced loading and arm-nine inspection. The operating rule stops at the boundary; it does not permit operation at or above 8.0 m/s."
    why: "Wind moment rises across the range, and the material-condition claim is not supplied by the torque model."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (unrestricted) The 12 m/s cases fail the torque envelope. (mark_safe) A 41 mm indication alone does not establish material strength or remove the inspection hold.
    # correct result: Choice 2 - 8.0 m/s wind cap plus balanced loading and arm-nine inspection.
    # state/output: Store candidate envelope and inspection hold.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   stress:
    #     assumptions:
    #       - {id: wind, label: "Wind speed", min: 4, max: 12, step: 1, unit: m/s}
    #       - {id: occupied, label: "Occupied gondolas", min: 6, max: 24, step: 6}
    #     candidates:
    #       - {id: unrestricted, label: "Operate to 12 m/s", survives: false}
    #       - {id: bounded, label: "Operate to 8 m/s with balanced loading", survives: true}
    #       - {id: mark_safe, label: "Treat 41 mm indication as proven safe", survives: false}
    #     correct: bounded
    #     conclusion: "The 8.0 m/s balanced-load envelope survives; unrestricted wind and the uninspected arm do not."
    # HELD BACK. The engine's STRESS is a table under one moving assumption: three
    # or more candidates scored on two or more named criteria, a `feasible` entry
    # per candidate saying how far into the pessimistic end it survives, and
    # `optimiseOn` — the criterion the nominal makes the wrong candidate look best
    # on, which is the trap. The bible gives the candidates and a survives flag
    # and nothing to score them with; it also moves two assumptions at once, and
    # the engine has one slider. Owed by the bible: the criteria, a score per
    # candidate per criterion, the assumption value each candidate needs, which
    # criterion the nominal flatters, and a nominal on the single slider.
    stress:
      candidates:
        - id: nominal_only
          label: Use only the nominal reading
        - id: common_extreme_mistake
          label: Use the favorable extreme as if it were guaranteed
        - id: robust_plan
          label: Choice 2 - 8.0 m/s wind cap plus balanced loading and arm-nine inspection.
      criteria:
        - key: evidence_fit
          label: fit to the stop evidence
        - key: safety_margin
          label: margin at the adverse end
      scores:
        nominal_only:
          evidence_fit: 95
          safety_margin: 20
        common_extreme_mistake:
          evidence_fit: 88
          safety_margin: 5
        robust_plan:
          evidence_fit: 82
          safety_margin: 92
      feasible:
        nominal_only: 8
        common_extreme_mistake: 8
        robust_plan: 4
      assumption:
        label: wind speed
        unit: m/s
        min: 4
        max: 12
        nominal: 8
        step: 1
      robust: robust_plan
      optimiseOn: evidence_fit

  # --- Stop 36: Commit the wheel limits
  #     Concept: Operating thresholds; Keystone: torque and model limits; Area: Brennan's workshop; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: TRIGGER, asked at brake-drum.
  - group: WORKSHOP
    at: brake-drum
    title: "Commit the wheel limits"
    concept: 35   # Operating thresholds
    reason: "The wind tests are complete, but arm nine's inspection remains a condition of operation."
    scene: "Torque balance and wind stress now define a restricted region, while arm nine still requires inspection. Commit the complete stop rule before the forecast and passenger loading pattern are revealed."
    motivation: "The combined threshold and inspection rule defines the restricted region in which the wheel may run."
    format: TRIGGER
    question: "Using the tested wind boundary 8.0 m/s, the +/-2.0 kN m loading-moment tolerance, and the unresolved arm-nine inspection, submit one operating-rule setting that states every prerequisite and uses an inclusive wind shutdown at or above its numerical value in m/s."
    answerText: "Require independent arm-nine inspection, balanced loading, and shutdown at wind of 8.0 m/s or greater."
    why: "The model supports loads only inside that envelope; physical inspection remains a separate binding condition."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Do not hide an unresolved condition behind a numerical operating limit.
    # correct result: Submit shutdown setting 8.0 m/s, comparator at_or_above, plus balance and inspection rules.
    # state/output: Set ride_status.wheel = restricted_pending_inspection.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   trigger:
    #     decision_rule: "Operate only after arm-nine inspection; stop at or above wind threshold or outside balance tolerance."
    #     scale: {min: 5, max: 12, step: 0.5, unit: m/s}
    #     anchors: [{value: 8.0, label: "stressed operating limit"},{value: 12.0, label: "failed unrestricted case"}]
    #     objective: "Protect bounded wind and loading moments."
    #     direction: at_or_above
    #     consequence_limit: {value: 8.0, unit: m/s, inclusive: true}
    #     correct: 8.0
    #     tolerance: 0.01
    #     conclusion: "Require the arm-nine inspection and balanced loading, then stop at wind of 8.0 m/s or greater."
    # HELD BACK, for the same reason as mission 3 stop 4: the engine's TRIGGER
    # grades a threshold against a live feed, and needs a stream of at least three
    # updates carrying a reading and the lead time still left, plus the lead time
    # and firing window of the one rule. The bible gives the scale, the anchors
    # and the keyed 8.0 m/s and no feed. Owed by the bible: the update stream and
    # the rule's lead time and window.

    examples:
    - {"title":"Calculate torque","problem":"A 10 N force acts perpendicular to a lever 0.5 m from its pivot. Find torque magnitude.","rule":"τ=rF sin θ.","steps":["Set up the relationship: τ=rF sin θ.","τ=0.5(10)sin90°=5 N m."],"answer":"The turning effect is 5 N m about the pivot.","mistake":"Use the perpendicular lever arm, not any convenient distance."}
    - {"title":"Balance a lever","problem":"A 20 N load acts 1 m left of a pivot. Where should a 10 N load act on the right to balance it?","rule":"Rotational equilibrium requires equal opposite torque magnitudes.","steps":["Set up the relationship: Rotational equilibrium requires equal opposite torque magnitudes.","20(1)=10r gives r=2 m."],"answer":"Place the 10 N load 2 m to the right.","mistake":"Equal forces are unnecessary when lever arms differ."}
    - {"title":"Rotational inertia of a point mass","problem":"A 2 kg point mass is 3 m from an axis. Find rotational inertia.","rule":"I=mr² for a point mass.","steps":["Set up the relationship: I=mr² for a point mass.","I=2(3²)=18 kg m²."],"answer":"Rotational inertia is 18 kg m².","mistake":"Distance from the axis is squared."}
    - {"title":"Angular acceleration","problem":"A net torque of 12 N m acts on rotational inertia 3 kg m². Find angular acceleration.","rule":"τ_net=Iα.","steps":["Set up the relationship: τ_net=Iα.","α=12/3=4 rad/s²."],"answer":"Angular acceleration is 4 rad/s² in the torque direction.","mistake":"Use net torque, not one selected torque."}
    - {"title":"Test an entire allowed range","problem":"A component must operate at or below 80 °C. Its estimated temperature is 77 ± 4 °C. Does every allowed value pass?","rule":"Test the worst allowed value against the stated bound.","steps":["allowed interval = [77-4, 77+4] = [73,81] °C.","maximum allowed temperature = 81 °C > 80 °C. At least one allowed value fails."],"answer":"The estimate does not establish that every allowed temperature passes.","mistake":"Checking only the central estimate ignores the uncertainty."}

  stops:
  # --- Stop 33: Balance the wheel
  #     Concept: Torque equilibrium; Keystone: torque; Area: Ferris Wheel machine room; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: BALANCE, asked at hub-schedule.
  - group: WHEEL
    at: hub-schedule
    title: "Balance the wheel"
    concept: 23   # Torque equilibrium
    reason: "Uneven test loads must be balanced before the wheel's braking response can be assessed."
    scene: "The revised loading plan is on the balance board. The operator checks its residual torque before accepting the arrangement."
    motivation: "Net axle torque shows whether the load arrangement meets the wheel's balance tolerance."
    format: BALLPARK
    question: "The two signed torque totals are −126.0 and +124.6 kN·m. Add them, then compare the residual with the permitted interval −2 to +2 kN·m."
    answerText: "The arranged test load is rotationally balanced within tolerance."
    why: "A force through the axle has zero lever arm and creates no torque about that axis."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Force magnitude alone is not torque; include perpendicular distance.
    # correct result: Submit -1.4 kN·m; accept within fictional ±2.0 kN·m tolerance.
    # state/output: Lock the test gondola positions.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   balance:
    #     target: {label: "Net torque", value: 0, unit: "kN m"}
    #     streams:
    #       - {id: cw, label: "Clockwise loaded gondolas", value: -126.0, unit: "kN m", count: true}
    #       - {id: ccw, label: "Counterclockwise loaded gondolas", value: 124.6, unit: "kN m", count: true}
    #       - {id: hub_weight, label: "Hub weight through axle", value: 0, unit: "kN m", count: false}
    #     tolerance: 2.0
    #     correct_action: "Count off-axis moments; exclude weight acting through the axle."
    # HELD BACK. The engine's ledger needs at least three streams that count and
    # at least one of them `hidden` — the removal term that does not announce
    # itself is the whole format, and it also has to be big enough that leaving it
    # out misses the total. The bible has three rows, of which two count and none
    # is hidden, and its two counting rows already close on the total exactly.
    # Owed by the bible: a third counting stream and an unannounced one.
    estimate:
      prompt: add the signed off-axis moments
      question: signed net torque
      labels:
        - "-126 kN·m  (Clockwise loaded-gondola moment)"
        - 124.6 kN·m  (Counterclockwise loaded-gondola moment)
        - 0 kN·m  (Hub-weight moment)
      values:
        - -126
        - 124.6
        - 0
      slots: 2
      template: tau_net={0}+{1}
      formula: tau_net=-126.0+124.6
      correct:
        - 0
        - 1
      target: -1.4
      tolerance: 0.1
      units: kN·m

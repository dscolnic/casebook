- title: "Arm Nine"
  card:
    header: "7 DAYS UNTIL COUNTY INSPECTION"
    title: "ARM NINE"
    goNow: "Go to the Ferris Wheel machine room and meet Luka Kovač, the mechanical lead, beside the arm-nine file."
    body: "Hart's override stopped a growing swing, but the Ferris Wheel now has a 41 mm surface indication on arm nine. A force becomes more effective at turning when it acts farther from the axle, and wind adds load across the gondola face. Calculate the moments, test uncertain wind, and prewrite operating limits. By the end of the mission, decide whether the wheel can operate and under what restrictions."
    objective: "Set a defensible load-and-wind envelope for the Ferris Wheel."
  objective: "Set a defensible load-and-wind envelope for the Ferris Wheel."
  stake: "Hart's override stopped a growing swing, but the Ferris Wheel now has a 41 mm surface indication on arm nine. A force becomes more effective at turning when it acts farther from the axle, and wind adds load across the gondola face. Calculate the moments, test uncertain wind, and prewrite operating limits. By the end of the mission, decide whether the wheel can operate and under what restrictions."
  takeaway: "A load model can bound operation, but it cannot certify an unmeasured material condition."
  segue: "Mission decision: The Ferris Wheel may run only after an outside check of arm nine. Its load must stay balanced, and wind must stay below 8.0 m/s. The model sets these limits but cannot clear the arm mark. The coaster is next."

  stake: "13 days until the park review. The chair chain hangs beside a tilted platform mark. Today you decide which carousel speed stays inside the angle limit."
  takeaway: "A safety model becomes useful when it produces a threshold written before the test."
  segue: "But Silva cannot find an install date for the new controller; the next evidence trail runs through the bumper stop and workshop."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Uniform circular motion", def: "Uniform circular motion is motion around a circle at constant speed while velocity changes direction."}
  - {name: "Centripetal acceleration", def: "Centripetal acceleration is acceleration directed toward the center of a circular path."}
  - {name: "Radial direction", def: "Radial direction is the inward or outward direction along a circle's radius."}
  - {name: "Tangential direction", def: "Tangential direction is the direction touching a circular path at one point; instantaneous velocity points this way."}
  equations:
  - {"e":"ac = v²/r","c":"finding the inward acceleration of circular motion","v":[["ac","centripetal acceleration"],["v","tangential speed"],["r","path radius"]],"s":"The chair angle and chain force depend on how sharply the ride turns at its operating speed."}

    examples:
    - {"title":"Centripetal acceleration","problem":"An object moves at 6 m/s on a circle of radius 3 m. Find inward acceleration.","rule":"a_c=v²/r.","steps":["Set up the relationship: a_c=v²/r.","a_c=6²/3=36/3=12 m/s²."],"answer":"Acceleration is 12 m/s² toward the center.","mistake":"Constant speed still allows changing velocity direction."}
    - {"title":"Required inward force","problem":"A 2 kg object moves at 4 m/s on radius 2 m. Find net inward force.","rule":"F_inward=mv²/r.","steps":["Set up the relationship: F_inward=mv²/r.","F_inward=2(4²)/2=16 N."],"answer":"The net inward force must be 16 N.","mistake":"Centripetal force is the net inward force, not an extra independent force."}
    - {"title":"Speed-radius tradeoff","problem":"Two circular motions have the same inward acceleration. The second radius is four times the first. Compare speeds.","rule":"At fixed a_c, v=sqrt(a_c r).","steps":["Set up the relationship: At fixed a_c, v=sqrt(a_c r).","v2/v1=sqrt(r2/r1)=sqrt(4)=2."],"answer":"The second speed is twice the first.","mistake":"Speed scales with the square root of radius here, not with radius itself."}
    - {"title":"Direction after release","problem":"A small object moves in a horizontal circle and its string breaks. Neglect all horizontal forces afterward. What is its initial path?","rule":"Velocity is tangent to the circle; the string supplied inward acceleration.","steps":["Immediately before breaking, velocity points tangent to the circular path.","Without horizontal net force, that velocity remains unchanged."],"answer":"The object initially travels along the tangent.","mistake":"It does not suddenly fly radially outward from the center."}
    - {"title":"A conical pendulum ratio","problem":"A suspended mass follows a horizontal circle with inward acceleration 5 m/s² where g=10 m/s². Find tan θ, where θ is string angle from vertical.","rule":"tan θ=a_c/g from horizontal and vertical tension components.","steps":["Set up the relationship: tan θ=a_c/g from horizontal and vertical tension components.","tan θ=5/10=0.5, so θ≈26.6° if an angle is needed."],"answer":"The string angle satisfies tan θ=0.5.","mistake":"Measure the angle from vertical for this ratio."}

  stops:
  # --- Stop 9: Derive the inward acceleration
  #     Concept: circular acceleration; Keystone: circular motion; Area: Carousel Drive House; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: DERIVE, asked at chain-rig.
  - group: CAROUSEL
    at: chain-rig
    title: "Derive the inward acceleration"
    concept: 9   # circular acceleration
    reason: "The chair's steady speed has hidden the acceleration caused by its changing direction."
    scene: "The chair travels at steady speed, but its velocity arrow turns continuously around the platform. Build the relation that converts that direction change into the inward acceleration used by the force model."
    motivation: "The inward acceleration establishes the force needed to hold the chair on its circular path."
    format: DERIVE
    question: "Submit one ordered symbolic derivation ending with the magnitude and direction of centripetal acceleration."
    answerText: "Uniform circular motion has inward acceleration v²/r even when speed is constant."
    why: "Direction changes by the same small angle as the position around the circle. Dividing the velocity change by time produces v²/r."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Constant speed fixes the velocity magnitude, not its direction.
    # correct result: Order: radial acceleration → force balance → tangent relation; ac=v²/r inward.
    # state/output: Illuminate inward arrows on the carousel model.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:
    #     lines:
    #       - {id: similar, expression: "dv/v = ds/r", rule: "similar triangles for velocity and position"}
    #       - {id: arc, expression: "ds = v dt", rule: "distance traveled at speed v"}
    #       - {id: divide, expression: "dv/dt = v(v/r)", rule: "substitute and divide by dt"}
    #       - {id: result, expression: "ac = v^2/r toward the center", rule: "acceleration is velocity change per time"}
    #     order: [similar, arc, divide, result]
    #     decoys:
    #       - {expression: "ac = v/r", rule: "divide speed by radius once"}
    # HELD BACK. The bible writes a derivation as an ordered list of lines plus a
    # single decoy for the whole thing. The engine grades it line by line: every
    # step needs at least three candidate lines, a `why` on each wrong one saying
    # what it costs, and one wrong branch marked `survives` so the step cannot be
    # passed by spotting the malformed option. Owed by the bible: per-step
    # candidate sets, a rebuttal on each wrong candidate, and which wrong branch
    # survives. Also `start` and `goal` — the line it begins from, and the FORM it
    # is going to, which is not the same as the answer.
    derive:
      start: Begin with the complete starting relation on the card. Preserve its named left side on every line.
      goal: Derive the inward acceleration in the form and units requested by the prompt
      steps:
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: dv/v = ds/r
            - text: dv / v = dr / r
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: ds = v dt
            - text: ds=r dt
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: dv/dt = v(v/r)
            - text: dv/dt = v/r per second
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: ac = v^2/r toward the center
            - text: a_c=v/r toward the center
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true

  # --- Stop 10: Hold the chair inside its limit
  #     Concept: speed, radius, and chair angle; Keystone: circular motion; Area: Carousel Drive House; Learning role: PRACTICE; Difficulty: L2; Story role: obstacle.
  #     placement: HOLD, asked at drive-panel.
  - group: CAROUSEL
    at: drive-panel
    title: "Hold the chair inside its limit"
    concept: 11   # speed, radius, and chair angle
    reason: "The circular-motion model is ready, but the operator still needs a usable speed setting."
    scene: "The live angle shows whether the force balance remains acceptable."
    motivation: "The speed limit keeps the chair's angle within the allowed range."
    format: HOLD
    question: "Given r = 5.0 m, g = 9.80 m/s^2, theta_max = 20.0 degrees, and tan theta = v^2/(rg), operate the chair-speed control for 30 s and submit one maximum safe speed setting in m/s."
    answerText: "A 4.20 m/s threshold keeps the five-metre-radius chair within the 20.0-degree campaign limit."
    why: "tan θ = v²/(rg). Speed enters squared, so a modest increase can use the remaining angle margin quickly."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Do not compare speed directly with degrees; use the force balance that connects them.
    # correct result: Maximum 4.22 m/s; submit operator setting 4.20 m/s.
    # state/output: Store carousel_speed_candidate = 4.20.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   hold:
    #     control: {id: speed, label: "Chair speed", min: 2.5, max: 5.0, step: 0.05, unit: m/s}
    #     response: {label: "Chair angle", formula: "atan(v^2/(r*g))", unit: deg}
    #     fixed: {r: 5.0, g: 9.80}
    #     band: {min: 0, max: 20.0, inclusive: true}
    #     duration: 12
    #     correct_setting: {max: 4.20, unit: m/s, tolerance: 0.05}
    #     conclusion: "A 4.20 m/s maximum setting keeps the chair within the 20.0-degree limit."
    # HELD BACK, and this one is a different instrument rather than a short one.
    # The bible's board is a speed control against an angle formula, answered by
    # reporting the highest setting that stays inside the limit. The engine's HOLD
    # is a needle the player keeps inside a band for a timed run while loads come
    # on: it needs a `quantity`, a named `control`, a target and a band, a run
    # length, how far the control can push, and — the part that makes it a run at
    # all — a list of disturbances with a time and a signed size each. The bible
    # names no disturbance, so left alone the needle would never move and the run
    # would be passed by doing nothing. Owed by the bible: the disturbances.
    hold_patch:
      question: Given `r = 5.0 m`, `g = 9.80 m/s^2`, `theta_max = 20.0 degrees`, and `tan theta = v^2/(rg)`, operate the chair-speed control for `12 s` and submit one maximum safe speed setting in `m/s`.
      authoredPayload: No structured payload was present; this block supplies it.
      correctResult: Maximum 4.22 m/s; submit operator setting 4.20 m/s.
      wrongButPlausible: A plausible shortcut that ignores one condition or treats dependent evidence as independent.
      decisionCanFail: true
      questionAndUnits: Given `r = 5.0 m`, `g = 9.80 m/s^2`, `theta_max = 20.0 degrees`, and `tan theta = v^2/(rg)`, operate the chair-speed control for `12 s` and submit one maximum safe speed setting in `m/s`.
    hold:
      quantity: chair speed
      control: chair-speed control
      unit: m/s
      hold: 4.2
      band: 0.2
      narrowTo: 0.05
      duration: 30
      authority: 0.5
      pass: 0.8
      direction: lower
      disturbances:
        - label: loaded-chair pull
          at: 5
          amount: 0.08
        - label: uneven rider load
          at: 13
          amount: 0.06
        - label: gust across the platform
          at: 21
          amount: -0.04

  # --- Stop 11: Separate tilt from speed
  #     Concept: controlled reversal; Keystone: model limits and evidence independence; Area: Brennan's workshop; Learning role: APPLY; Difficulty: L3; Story role: clue.
  #     placement: CONTROL, asked at platform-jacks.
  - group: WORKSHOP
    at: platform-jacks
    title: "Separate tilt from speed"
    concept: 11   # controlled reversal
    reason: "The chairs lean differently at the same command, so speed alone cannot explain the imbalance."
    scene: "Left-side chairs hang farther out than right-side chairs at the same drive command. Change one platform condition, reverse it, and determine whether leveling removes the asymmetry without changing the commanded speed."
    motivation: "A reversible leveling test distinguishes platform tilt from a change in drive speed."
    format: CONTROL
    question: "BASELINE: At commanded speed 4.00 m/s, measure the left-right chair-angle difference in degrees. CHANGE ONE CONTROL: Remove the platform shims to level the platform while keeping speed 4.00 m/s, rider mass, chair radius, and drive program fixed. MEASURE: Record the angle difference after leveling. RESTORE: Reinstall the shims and remeasure; restoration is required. INTERPRET: Submit one conclusion naming whether platform tilt causes the asymmetry."
    answerText: "Platform tilt causes the left-right angle difference; the drive speed affects both sides together."
    why: "The chosen intervention changes only level and reverses the response beyond the noise band."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (speed) Lowering all-chair speed changes both sides together, so it cannot isolate the left-right platform tilt. (load) Removing one rider changes the load asymmetrically and confounds the tilt test.
    # correct result: Select level/unlevel control; response changes 2.4° → 0.1° → 2.4°.
    # state/output: Level the platform permanently; set evidence_flags.carousel_tilt_fixed = true.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   control:
    #     baseline: {label: "Left-right angle difference", value: 2.4, unit: deg}
    #     noise_band: 0.2
    #     changed_variable: "Platform level via removal and restoration of shims"
    #     fixed_conditions: ["Commanded speed 4.00 m/s", "Rider mass", "Chair radius", "Drive program"]
    #     measurement_timing: [baseline, after_leveling, after_shim_restoration]
    #     state_measurements: {baseline_deg: 2.4, leveled_deg: 0.1, restored_deg: 2.4}
    #     candidates:
    #       - {id: level, label: "Level the platform, then restore the shims", response: -2.3, correct: true}
    #       - {id: speed, label: "Lower all-chair speed", response: -0.1, correct: false}
    #       - {id: load, label: "Remove one rider", response: 0.1, correct: false}
    #     reversal_required: true
    # CONVERTED. `candidates` are the engine's `variables`, `noise_band` its
    # `noise`, `fixed_conditions` its `held`, and the candidate carrying
    # `correct: true` is its `truth`. The engine keeps one signed `response` for
    # the board — the change the true cause makes — which is the bible's own
    # −2.3 deg on the `level` candidate, and the baseline it moves from is the
    # bible's 2.4 deg.
    control:
      observable: { label: "Left-right angle difference", unit: deg }
      variables:
      - { id: level, label: "Level the platform, then restore the shims" }
      - { id: speed, label: "Lower all-chair speed" }
      - { id: load, label: "Remove one rider" }
      held:
      - "Commanded speed 4.00 m/s"
      - "Rider mass"
      - "Chair radius"
      - "Drive program"
      truth: level
      baseline: 2.4
      response: -2.3
      noise: 0.2

  # --- Stop 12: Write the rule before the run
  #     Concept: precommitted threshold; Keystone: circular motion and model limits; Area: Carousel Drive House; Learning role: COMBINE; Difficulty: L4; Story role: decision.
  #     placement: TRIGGER, asked at drive-panel.
  - group: CAROUSEL
    at: drive-panel
    title: "Write the rule before the run"
    concept: 35   # precommitted threshold
    reason: "The leveling test is complete and the crew must set the shutdown rule before the next run."
    scene: "The rule must keep every chair at or below the stated limit."
    motivation: "An inclusive speed threshold tells the operator exactly when the carousel must stop."
    format: TRIGGER
    question: "Given r = 5.0 m, g = 9.80 m/s^2, theta_max = 20.0 degrees, and tan theta = v^2/(rg), submit one inclusive shutdown-threshold setting in m/s before the live speed unlocks; operation stops when measured speed is at or above that setting."
    answerText: "Use an inclusive 4.20 m/s shutdown threshold; the 4.00 m/s test value passes."
    why: "The exact model boundary is about 4.22 m/s. The authored threshold stays just below it and clearly states what happens at equality."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A threshold above the model boundary does not protect the angle limit.
    # correct result: Submit shutdown setting 4.20 m/s, comparator at_or_above; 4.00 m/s passes.
    # state/output: Set ride_status.carousel = conditional_pass; print the threshold card.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   trigger:
    #     decision_rule: "Stop the ride when measured speed reaches or exceeds the threshold."
    #     scale: {min: 3.5, max: 4.6, step: 0.05, unit: m/s}
    #     anchors: [{value: 4.00, label: "planned operation"},{value: 4.22, label: "20-degree model boundary"}]
    #     objective: "Protect the 20.0-degree chair-angle limit with a practical margin."
    #     direction: "at_or_above"
    #     consequence_limit: {value: 20.0, unit: deg, inclusive: true}
    #     correct: 4.20
    #     tolerance: 0.05
    #     conclusion: "Stop the Carousel when measured speed reaches or exceeds 4.20 m/s."
    # HELD BACK. The engine's TRIGGER is a rule set against a live feed: it needs
    # a stream of at least three updates, each with a time, a reading and the
    # hours of lead still left, and a stage with the lead time it needs and the
    # band of readings it may fire on. That is what makes the board a decision —
    # without the clock, sliding the threshold to the end of the scale is a
    # correct answer. The bible gives the scale, the anchors and the keyed
    # threshold and no feed at all. Owed by the bible: the update stream, and the
    # lead time and firing window for the single rule.
    trigger:
      scale:
        label: carousel speed
        unit: m/s
        min: 3
        max: 5
        step: 0.05
        anchors:
          - at: 3.4
            means: routine baseline, not the decision threshold
          - at: 4.3
            means: elevated evidence requiring attention
      direction: rising
      conditions:
        - id: act
          label: Take the protective action
          leadHours: 12
          window:
            min: 4.2
            max: 5
      stream:
        - at: T-48 h
          value: 3.6
          hoursLeft: 48
        - at: T-24 h
          value: 4
          hoursLeft: 24
        - at: T-12 h
          value: 4.2
          hoursLeft: 12
        - at: T-6 h
          value: 4.4
          hoursLeft: 6


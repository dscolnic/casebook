    intro: "Try six independent practice questions. Each includes its own context and any needed data; no mission records are required."
    questions:
    - prompt: "Which statement best explains narrow money (M1)?"
      hint: "Identify the defining relationship or mechanism for narrow money (m1). All needed information is in this question."
      answer: "B"
      options:
      - {key: "A", text: "Deposits times reserve ratio.", why: "This describes required reserves. It does not answer the question about narrow money (m1)."}
      - {key: "B", text: "Cash plus checking deposits. Broad money (M2): M1 plus savings and money-market funds.", why: "Correct. Cash plus checking deposits. Broad money (M2): M1 plus savings and money-market funds."}
      - {key: "C", text: "Total minus required reserves.", why: "This describes excess reserves. It does not answer the question about narrow money (m1)."}
      - {key: "D", text: "Cash can fall while deposits keep broader money available.", why: "This describes aggregates. It does not answer the question about narrow money (m1)."}
    - prompt: "Which statement best explains required reserves?"
      hint: "Identify the defining relationship or mechanism for required reserves. All needed information is in this question."
      answer: "C"
      options:
      - {key: "A", text: "Cash plus checking deposits. Broad money (M2): M1 plus savings and money-market funds.", why: "This describes narrow money (M1). It does not answer the question about required reserves."}
      - {key: "B", text: "Total minus required reserves.", why: "This describes excess reserves. It does not answer the question about required reserves."}
      - {key: "C", text: "Deposits times reserve ratio.", why: "Correct. Deposits times reserve ratio."}
      - {key: "D", text: "Cash can fall while deposits keep broader money available.", why: "This describes aggregates. It does not answer the question about required reserves."}
    - prompt: "Which statement best explains excess reserves?"
      hint: "Identify the defining relationship or mechanism for excess reserves. All needed information is in this question."
      answer: "D"
      options:
      - {key: "A", text: "Cash plus checking deposits. Broad money (M2): M1 plus savings and money-market funds.", why: "This describes narrow money (M1). It does not answer the question about excess reserves."}
      - {key: "B", text: "Deposits times reserve ratio.", why: "This describes required reserves. It does not answer the question about excess reserves."}
      - {key: "C", text: "Cash can fall while deposits keep broader money available.", why: "This describes aggregates. It does not answer the question about excess reserves."}
      - {key: "D", text: "Total minus required reserves.", why: "Correct. Total minus required reserves."}
    - prompt: "Which statement best explains aggregates?"
      hint: "Identify the defining relationship or mechanism for aggregates. All needed information is in this question."
      answer: "A"
      options:
      - {key: "A", text: "Cash can fall while deposits keep broader money available.", why: "Correct. Cash can fall while deposits keep broader money available."}
      - {key: "B", text: "Cash plus checking deposits. Broad money (M2): M1 plus savings and money-market funds.", why: "This describes narrow money (M1). It does not answer the question about aggregates."}
      - {key: "C", text: "Deposits times reserve ratio.", why: "This describes required reserves. It does not answer the question about aggregates."}
      - {key: "D", text: "Total minus required reserves.", why: "This describes excess reserves. It does not answer the question about aggregates."}
    - prompt: "Which statement best explains money functions?"
      hint: "Identify the defining relationship or mechanism for money functions. All needed information is in this question."
      answer: "B"
      options:
      - {key: "A", text: "Cash plus checking deposits. Broad money (M2): M1 plus savings and money-market funds.", why: "This describes narrow money (M1). It does not answer the question about money functions."}
      - {key: "B", text: "Agreement among cash-return channels is not independent proof of contraction.", why: "Correct. Agreement among cash-return channels is not independent proof of contraction."}
      - {key: "C", text: "Deposits times reserve ratio.", why: "This describes required reserves. It does not answer the question about money functions."}
      - {key: "D", text: "Total minus required reserves.", why: "This describes excess reserves. It does not answer the question about money functions."}
    - prompt: "A simple deposit-multiplier model gives a maximum possible expansion under its assumptions. Must actual lending reach that maximum?"
      hint: "Identify the defining relationship or mechanism for reserves and multiplier. All needed information is in this question."
      answer: "C"
      options:
      - {key: "A", text: "Cash plus checking deposits. Broad money (M2): M1 plus savings and money-market funds.", why: "This describes narrow money (M1). It does not answer the question about reserves and multiplier."}
      - {key: "B", text: "Deposits times reserve ratio.", why: "This describes required reserves. It does not answer the question about reserves and multiplier."}
      - {key: "C", text: "No. It is a capacity ceiling; bank choices, borrower demand, and other constraints may reduce actual expansion.", why: "Correct. No. It is a capacity ceiling; bank choices, borrower demand, and other constraints may reduce actual expansion."}
      - {key: "D", text: "Total minus required reserves.", why: "This describes excess reserves. It does not answer the question about reserves and multiplier."}


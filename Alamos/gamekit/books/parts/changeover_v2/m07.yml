    examples:
    - {"title":"Narrow and broader money","problem":"For this simplified classification, currency is 20, checking deposits 60, and additional savings-type balances 40 billion. Find narrow and broader totals.","rule":"Narrow total=currency+checking; broader total=narrow+the specified additional balances.","steps":["Set up the relationship: Narrow total=currency+checking; broader total=narrow+the specified additional balances.","narrow=20+60=80; broader=80+40=120 billion."],"answer":"The two totals are 80 and 120 billion under the stated classification.","mistake":"Do not add a narrow total twice when constructing the broader one."}
    - {"title":"Required and excess reserves","problem":"Deposits are 100 million, reserves 15 million, and the hypothetical required-reserve ratio is 10%. Find required and excess reserves.","rule":"Required reserves=ratio×deposits; excess=actual-required.","steps":["Set up the relationship: Required reserves=ratio×deposits; excess=actual-required.","required=0.10(100)=10; excess=15-10=5 million."],"answer":"The bank has 5 million above its required reserve in this teaching model.","mistake":"The assumed reserve ratio is a problem input, not a claim about current policy."}
    - {"title":"A theoretical lending ceiling","problem":"A simplified banking system has excess reserves of 4 million and reserve ratio 0.20, with no cash leakage or extra reserve holding. Find maximum new deposits.","rule":"Simple money multiplier=1/ratio; deposit expansion ceiling=excess×multiplier.","steps":["Set up the relationship: Simple money multiplier=1/ratio; deposit expansion ceiling=excess×multiplier.","multiplier=1/0.20=5; maximum expansion=4(5)=20 million."],"answer":"The theoretical ceiling is 20 million under these assumptions.","mistake":"The ceiling is not a prediction that every possible loan will be made."}

- title: "Money That Moved"
  card:
    header: "MISSION 7 - 9 DAYS UNTIL CHANGEOVER."
    title: "Money That Moved"
    goNow: "Go to NOTES and meet Tomas Arendt, bank supervision lead, at the note scale."
    body: "Nine days remain. Old notes fill a tray beside bank slips. Today you decide if the returned cash is still part of the money supply."
    objective: "Trace old cash into deposits and lending capacity."
  objective: "Trace old cash into deposits and lending capacity."
  stake: "Nine days remain. Old notes fill a tray beside bank slips. Today you decide if the returned cash is still part of the money supply."
  takeaway: "Evidence must match the mechanism, units, and stated limits."
  segue: "Therefore Tomas must set the real cost of credit; full trays do not tell him what borrowers pay."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-note-hall
    # On arrival at Note Hall | note-scale | automatic
    on: { enter: true, at: NOTES }
    world: "Old-crown bundles fill a tray beside deposit receipts."
    panel: "Trace old cash into deposits and lending capacity."
    # unlocks: Unlock Stop 25 at note-scale in Note Hall.
    bubbles:
    - who: arendt   # Tomas Arendt
      say: "Start with count m1 and m2. We need evidence the next decision can use."
  - id: after-stop-25
    # After Stop 25 | custody-desk | automatic
    on: { after: [1] }
    world: "At note-scale, the dated accepted-result slip for Stop 25 reads: \"(300,500), ±0.1.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 25 RECORDED - STOP 26 OPEN"
    # unlocks: Unlock Stop 26 at custody-desk in Note Hall.
    bubbles:
    - who: arendt   # Tomas Arendt
      say: "Nice work. M1 is 300 and M2 is 500 billion crowns."
  - id: after-stop-26
    # After Stop 26 | balance-sheet-desk | automatic
    on: { after: [2] }
    world: "At custody-desk, the dated accepted-result slip for Stop 26 reads: \"The keyed result shown by the completed interaction.\". The slip remains in that fixture's evidence holder."
    panel: "NOTES → BANKS"
    # unlocks: Unlock Stop 27 at balance-sheet-desk in Bank Supervision.
    bubbles:
    - who: arendt   # Tomas Arendt
      say: "Good thinking. Most returned cash migrated into deposits; payment failures did not rise."
  - id: after-stop-27
    # After Stop 27 | money-market-console | automatic
    on: { after: [3] }
    world: "At balance-sheet-desk, the dated accepted-result slip for Stop 27 reads: \"(10b,8b,10,80b), ±0.1.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 27 RECORDED - STOP 28 OPEN"
    # unlocks: Unlock Stop 28 at money-market-console in Bank Supervision.
    bubbles:
    - who: arendt   # Tomas Arendt
      say: "Exactly right. Required reserves are 10, excess 8, multiplier 10, and maximum new money 80 billion."
  - id: at-mission-end
    # At mission end | note-scale | automatic
    on: { missionEnd: true }
    world: "At conversion-trays, Eli Voss seals the counted old-note bundle with its deposit receipt. The dated prop remains here on later visits."
    panel: "MISSION 7 EVIDENCE: RECORDED"
    # unlocks: Open the mission outcome and metric screen.
    bubbles:
    - who: voss   # Eli Voss
      say: "The notes came here. Their owners still have deposits. Therefore Tomas must set the real cost of credit; full trays do not tell him what borrowers pay."

  terms:
  - {name: "Narrow money (M1)", def: "cash plus checking deposits."}
  - {name: "Broad money (M2)", def: "M1 plus savings and money-market funds."}
  - {name: "Required reserves", def: "deposits times reserve ratio."}
  - {name: "Excess reserves", def: "total minus required reserves."}
  # The optional review, offered when the mission is finished and graded
  # nowhere. GENERATED by tools/bible-deeper.mjs from the campaign bible.

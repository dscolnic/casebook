  # --- Stop 26: Follow the sacks
  #     Concept: money functions; Keystone: money; Area: Bank Supervision; Learning role: COMBINE; Difficulty: L4; Story role: reversal.
  #     placement: TRACE, at custody-desk.
  - group: BANKS
    at: custody-desk
    title: "Follow the sacks"
    concept: 18   # money functions
    reason: "The money baseline is recorded and the destination of returned notes remains unclear."
    scene: "With M1 and M2 counted, trace the note-weight alarm, checking rise, savings rise, and payment failures to their upstream records. Decide whether returned notes vanished or entered bank liabilities today."
    motivation: "Tracing bank entries determines whether the notes disappeared from money holdings or changed their form."
    format: TRACE
    question: "Open all dependencies and submit the conclusion."
    answerText: "\"Most returned cash migrated into deposits; payment failures did not rise.\""
    why: "Agreement among cash-return channels is not independent proof of contraction."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Agreement among cash-return channels is not independent proof of contraction.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: BANKS waypoint.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   trace:{channels:[{id:"note_weight",label:"returned-note weight",dependency:"conversion intake ledger",target_dependent:true},{id:"checking",label:"checking-deposit rise",dependency:"conversion intake ledger",target_dependent:true},{id:"savings",label:"savings-deposit rise",dependency:"bank account ledger",independent:true},{id:"payment_failures",label:"payment-failure count",dependency:"payment network",independent:true}],shared_upstream:"conversion intake ledger",correct_conclusion:"cash migrated to deposits while payment failures stayed flat",answerText:"The note and checking channels share the intake ledger; independent savings and payment data show money moved into deposits rather than vanishing."}
    trace:
      channels:
        - id: note_weight
          label: Returned-note weight
          reading: 84 t received
          depends:
            - conversion_intake_ledger
        - id: checking
          label: Checking-deposit rise
          reading: +84 million RATE
          depends:
            - conversion_intake_ledger
        - id: savings
          label: Savings-deposit rise
          reading: +19 million RATE
          depends:
            - bank_account_ledger
        - id: payment_failures
          label: Payment-failure count
          reading: 0.5% of payments, unchanged
          depends:
            - payment_network
      resources:
        - id: conversion_intake_ledger
          label: conversion_intake_ledger
        - id: bank_account_ledger
          label: bank_account_ledger
        - id: payment_network
          label: payment_network
      independent:
        - savings
        - payment_failures
      target: conversion_intake_ledger


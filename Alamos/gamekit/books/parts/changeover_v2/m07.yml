  # --- Stop 28: Migration or contraction
  #     Concept: money-stock diagnosis; Keystone: money/GDP; Area: Statistics Floor; Learning role: TRANSFER; Difficulty: L4; Story role: decision.
  #     placement: DIAGNOSIS, at money-market-console.
  - group: STATS
    at: money-market-console
    title: "Migration or contraction"
    concept: 18   # money-stock diagnosis
    reason: "The sacks and reserve calculations are complete, allowing the contraction claim to be tested."
    scene: "Deposit growth now matches returned cash, M1 remains stable, M2 rises, excess reserves are positive, and payment failures stay flat. Select the diagnosis that fits every reading in the Rate Book."
    motivation: "The diagnosis distinguishes a shift between forms of money from a fall in the relevant money stock."
    format: DIAGNOSIS
    question: "Select one diagnosis - cash-to-deposit migration, money-stock contraction, bank run, or hyperinflation - and submit the conclusion."
    answerText: "\"The returns show migration from cash into deposits, not a money-stock contraction.\""
    why: "A visible fall in currency can be portfolio migration rather than a fall in spendable money."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. A visible fall in currency can be portfolio migration rather than a fall in spendable money.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Page 7 signed.
    # CONVERTED, as far as the payload goes. The bible's payload was:
    #   answer:migration; alternatives:[contraction,run,hyperinflation].
    # The four candidates are bare ids there and are spelled out on this stop's own
    # prompt — "cash-to-deposit migration, money-stock contraction, bank run, or
    # hyperinflation" — in the payload's own order, so those are the labels.
    # STILL OWED BY THE BIBLE: the diagnosis panel. The payload carries no readings
    # and names no figure, so the stop imports as the CHOICE it plays as. The scene
    # describes five readings in prose but the bible keys none of them to a zone or
    # a value, and inventing that panel is not a conversion.
    choices:
    - "cash-to-deposit migration"
    - "money-stock contraction"
    - "bank run"
    - "hyperinflation"
    answer: "cash-to-deposit migration"

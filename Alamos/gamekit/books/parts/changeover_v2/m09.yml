    title: "Exporter effect"
    concept: 30   # appreciation/NX
    reason: "The exchange-rate prediction is ready for a controlled check using trade flows."
    scene: "Because RATE appreciation should reduce net exports, change only the exchange quote from 1.00 to 1.10 foreign units per RATE. Hold foreign income, domestic income, tariffs, and shipping capacity fixed."
    motivation: "Reversing the currency quote tests whether appreciation itself changes exports and imports under fixed conditions."
    format: CONTROL
    question: "Hold income, tariffs, and shipping capacity fixed. Change the quote from 1.00 to 1.10 foreign units per RATE, record exports and imports, restore the baseline, and submit what the comparison shows about net exports."
    answerText: "\"At fixed conditions, appreciation lowers exports and raises imports; restoration recovers baseline.\""
    why: "Reversing the quote tests whether currency value changes the export margin."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Reversing the quote tests whether currency value changes the export margin.

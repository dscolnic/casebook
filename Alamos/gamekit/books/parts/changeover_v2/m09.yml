  stops:
  # --- Stop 33: Close payments
  #     Concept: BOP; Keystone: open economy; Area: Rate Room; Learning role: INTRODUCE; Difficulty: L3; Story role: calculation.
  #     placement: BALANCE, at trade-ledger.
  - group: RATE
    at: trade-ledger
    title: "Close payments"
    concept: "BOP"
    reason: "The inflow must be placed in the correct account."
    scene: "Halvern has NX −18, net foreign income +2, net transfers −1, and foreign asset purchases +17 billion. Count the proper streams and close the simplified balance of payments for the board."
    motivation: "A current deficit is financed by a financial surplus, not free money."
    format: BALANCE
    question: "Toggle streams; submit CA and FA. CA=−18+2−1=−17; FA=+17; sum0."
    answerText: "\"Current account −17 and financial account +17 billion close at zero.\""
    why: "A current deficit is financed by a financial surplus, not free money."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. A current deficit is financed by a financial surplus, not free money.
    # correct result: The current account is -17 billion and the financial account is +17 billion, so the simplified balance closes at zero.
    # state/output: Record the result and unlock the next named stop.
    # CONVERTED. The bible's payload was:
    #   balance:{streams:[{id:"net_exports",value:-18,unit:"billion",count:true},{id:"net_foreign_income",value:2,unit:"billion",count:true},{id:"net_transfers",value:-1,unit:"billion",count:true},{id:"foreign_asset_purchases",value:17,unit:"billion",count:true},{id:"domestic_stock_trade",value:6,unit:"billion",count:false}],equations:["CA=NX+NFI+transfers","CA+FA=0"],correct:{CA:-17,FA:17,total:0},tolerance:0.1,submission:"numeric CA and FA pair in billions"}
    # `count:false` is `countable: false`; the total is the bible's own `correct.total`
    # of zero and the tolerance is the bible's 0.1. Every value is the bible's.
    # One model conversion: `hidden` on the financial account. The engine refuses a
    # ledger whose visible rows already close, and the +17 is exactly the row this
    # stop exists to find — the current side alone comes to −17, and the inflow is
    # what takes it to zero.
    relationship: "CA = NX + NFI + transfers, and CA + FA = 0"
    balance:
      total: { amount: 0, unit: "billion", label: "Simplified balance of payments" }
      tolerance: 0.1
      streams:
      - { id: net_exports, label: "net exports", value: -18 }
      - { id: net_foreign_income, label: "net foreign income", value: 2 }
      - { id: net_transfers, label: "net transfers", value: -1 }
      - { id: foreign_asset_purchases, label: "foreign asset purchases", value: 17, hidden: true }
      - { id: domestic_stock_trade, label: "domestic stock trade", value: 6, countable: false }

  # --- Stop 34: Clear forex
  #     Concept: currency demand; Keystone: forex; Area: Open-Economy Floor; Learning role: PRACTICE; Difficulty: L3; Story role: consequence.
  #     placement: DERIVE, at forex-console.
  - group: OPENEC
    at: forex-console
    title: "Clear forex"
    concept: "currency demand"
    reason: "Asset purchases reveal which curve shifts."
    scene: "With a 17-billion capital inflow, foreigners must acquire RATE to buy Halvern bonds. Build the direction chain from asset demand to the currency's value and net exports in the Rate Book."
    motivation: "Appreciation makes exports dearer and imports cheaper."
    format: DERIVE
    question: "Order/build foreign bond demand→demand for RATE right→RATE appreciates→X falls,M rises→NX falls."
    answerText: "\"Foreign bond demand → demand for RATE shifts right → RATE appreciates → exports fall and imports rise → net exports fall.\""
    why: "Appreciation makes exports dearer and imports cheaper."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Appreciation makes exports dearer and imports cheaper.
    # correct result: Foreign bond demand raises demand for RATE, RATE appreciates, exports fall, imports rise, and net exports fall.
    # state/output: RATE waypoint.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{candidate_lines:["Foreign investors buy Halvern bonds","Demand for RATE shifts right","RATE appreciates","Halvern exports become dearer abroad","Imports become cheaper in Halvern","Exports fall and imports rise","Net exports fall"],licenses:["asset purchase requires domestic currency","foreign-exchange demand shift","higher equilibrium currency price","relative-price effect","net-exports definition"],keyed_order:[1,2,3,4,5,6,7],decoys:["RATE supply shifts left because Halvern prints fewer notes","Appreciation raises net exports"],submission:"ordered line-and-rule chain"}

  # --- Stop 35: Exporter effect
  #     Concept: appreciation/NX; Keystone: forex; Area: Open-Economy Floor; Learning role: COMBINE; Difficulty: L4; Story role: test.
  #     placement: CONTROL, at forex-console.
  - group: OPENEC
    at: forex-console
    title: "Exporter effect"
    concept: "appreciation/NX"
    reason: "Soren wants the currency effect isolated from port volume."
    scene: "Because RATE appreciation should reduce net exports, change only the exchange quote from 1.00 to 1.10 foreign units per RATE. Hold foreign income, domestic income, tariffs, and shipping capacity fixed."
    motivation: "Reversing the quote tests whether currency value changes the export margin."
    format: CONTROL
    question: "Change quote to 1.10, measure X and M; restore 1.00 and measure again; submit conclusion. control:{baseline:1,response:.10,noise:.01,candidates:[quote,tariff,income],fixed:[income,tariffs,capacity],readings:{1.00:{X90,M108},1.10:{X84,M112}},correct:\"appreciation lowers NX\"}."
    answerText: "\"At fixed conditions, appreciation lowers exports and raises imports; restoration recovers baseline.\""
    why: "Reversing the quote tests whether currency value changes the export margin."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Reversing the quote tests whether currency value changes the export margin.
    # correct result: Raising the quote from 1.00 to 1.10 lowers exports from 90 to 84 billion and raises imports from 108 to 112 billion; restoring 1.00 restores the baseline.
    # state/output: Record the result and unlock the next named stop.
    # CONVERTED. The bible's payload was:
    #   control:{candidates:[{id:"exchange_quote",change:"1.00 to 1.10 foreign units per RATE"},{id:"tariff",change:"0% to 5%"},{id:"foreign_income",change:"index 100 to 105"}],selected:"exchange_quote",baseline:{quote:1.00,exports:90,imports:108,unit:"billion"},response:{quote:1.10,exports:84,imports:112},noise_band:0.01,fixed:["domestic income","foreign income","tariffs","shipping capacity"],measure:"exports and imports after the panel settles",restore:{quote:1.00,exports:90,imports:108,remeasure:true},correct:"appreciation lowers net exports",submission:"control choice, readings, and conclusion"}
    # `candidates` are the engine's `variables`, `selected` its `truth`, `fixed` its
    # `held` and `noise_band` its `noise`. The reversal the bible's `restore` asks
    # for is what the engine's CONTROL panel already makes the player do.
    # ONE MODEL CONVERSION. The engine watches a single reading; the bible reads
    # exports and imports separately. The reading is their difference, which is the
    # quantity the bible's own conclusion is about and the quantity its own ledger
    # two stops earlier calls net exports: 90 − 108 = −18, which is that stop's
    # `net_exports` stream to the billion. At 1.10 it is 84 − 112 = −28, so the
    # signed response is −10 billion. No number here is not the bible's.
    control:
      observable: { label: "Net exports", unit: "billion" }
      variables:
      - { id: exchange_quote, label: "exchange quote, 1.00 to 1.10 foreign units per RATE" }
      - { id: tariff, label: "tariff, 0% to 5%" }
      - { id: foreign_income, label: "foreign income, index 100 to 105" }
      truth: exchange_quote
      held: ["domestic income", "foreign income", "tariffs", "shipping capacity"]
      baseline: -18
      response: -10
      noise: 0.01
      moral: "Appreciation lowers net exports."


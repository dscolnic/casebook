    body: "Holding the rate avoids extra tightening, but foreign bond orders are strengthening the future RATE. International goods, income, and transfers enter the current account, while asset purchases enter the financial account. You will close both accounts, clear foreign exchange, and test exporter effects. By the end of the mission, decide whether the capital inflow is unqualified good news."
    objective: "Connect balance of payments, exchange rates, and net exports."
  objective: "Connect balance of payments, exchange rates, and net exports."
  stake: "Holding the rate avoids extra tightening, but foreign bond orders are strengthening the future RATE. International goods, income, and transfers enter the current account, while asset purchases enter the financial account. You will close both accounts, clear foreign exchange, and test exporter effects. By the end of the mission, decide whether the capital inflow is unqualified good news."

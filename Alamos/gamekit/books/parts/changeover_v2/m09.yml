  # --- Stop 35: Exporter effect
  #     Concept: appreciation/NX; Keystone: forex; Area: Open-Economy Floor; Learning role: COMBINE; Difficulty: L4; Story role: test.
  #     placement: CONTROL, at forex-console.
  - group: OPENEC
    at: forex-console
    title: "Exporter effect"
    concept: 30   # appreciation/NX
    reason: "The exchange-rate prediction is ready for a controlled check using trade flows."
    scene: "Because RATE appreciation should reduce net exports, change only the exchange quote from 1.00 to 1.10 foreign units per RATE. Hold foreign income, domestic income, tariffs, and shipping capacity fixed."
    motivation: "Reversing the currency quote tests whether appreciation itself changes exports and imports under fixed conditions."
    format: CONTROL
    question: "Hold income, tariffs, and shipping capacity fixed. Change the quote from 1.00 to 1.10 foreign units per RATE, record exports and imports, restore the baseline, and submit what the comparison shows about net exports."
    answerText: "\"At fixed conditions, appreciation lowers exports and raises imports; restoration recovers baseline.\""
    why: "Reversing the quote tests whether currency value changes the export margin."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Reversing the quote tests whether currency value changes the export margin.
    # correct result: Raising the quote from 1.00 to 1.10 lowers exports from 90 to 84 billion and raises imports from 108 to 112 billion; restoring 1.00 restores the baseline.
    # state/output: Record the result and unlock the next named stop.
    # CONVERTED. The bible's payload was:
    #   control:{candidates:[{id:"exchange_quote",change:"1.00 to 1.10 foreign units per RATE"},{id:"tariff",change:"0% to 5%"},{id:"foreign_income",change:"index 100 to 105"}],selected:"exchange_quote",baseline:{quote:1.00,exports:90,imports:108,unit:"billion"},response:{quote:1.10,exports:84,imports:112},noise_band:0.01,fixed:["domestic income","foreign income","tariffs","shipping capacity"],measure:"exports and imports after the panel settles",restore:{quote:1.00,exports:90,imports:108,remeasure:true},correct:"appreciation lowers net exports",submission:"control choice, readings, and conclusion"}
    # `candidates` are the engine's `variables`, `selected` its `truth`, `fixed` its
    # `held` and `noise_band` its `noise`. The reversal the bible's `restore` asks
    # for is what the engine's CONTROL panel already makes the player do.
    # ONE MODEL CONVERSION. The engine watches a single reading; the bible reads
    # exports and imports separately. The reading is their difference, which is the
    # quantity the bible's own conclusion is about and the quantity its own ledger
    # two stops earlier calls net exports: 90 − 108 = −18, which is that stop's
    # `net_exports` stream to the billion. At 1.10 it is 84 − 112 = −28, so the
    # signed response is −10 billion. No number here is not the bible's.
    control:
      observable: { label: "Net exports", unit: "billion" }
      variables:
      - { id: exchange_quote, label: "exchange quote, 1.00 to 1.10 foreign units per RATE" }
      - { id: tariff, label: "tariff, 0% to 5%" }
      - { id: foreign_income, label: "foreign income, index 100 to 105" }
      truth: exchange_quote
      held: ["domestic income", "foreign income", "tariffs", "shipping capacity"]
      baseline: -18
      response: -10
      noise: 0.01
      moral: "Appreciation lowers net exports."

  # --- Stop 36: Good news
  #     Concept: capital flows; Keystone: forex/BOP; Area: Open-Economy Floor; Learning role: TRANSFER; Difficulty: L4; Story role: decision.
  #     placement: CHOICE, asked by Nia Corren beside shipment-board.
  - group: OPENEC
    at: shipment-board
    title: "Good news"
    person: corren
    concept: 29   # capital flows
    reason: "Capital inflows and the trade response are known, but the board's headline must preserve both benefits and costs."
    scene: "Choose the statement that preserves all three facts for the next board decision."
    motivation: "The selected statement distinguishes financing support from the pressure appreciation places on exporters."
    format: CHOICE
    question: "Select exactly one statement from the four distinct choices below."
    choices:
    - "The inflow is entirely beneficial."
    - "The inflow is entirely harmful."
    - "The inflow finances the deficit, but appreciation lowers net exports."
    - "The two international accounts need not sum to zero."
    answer: "The inflow finances the deficit, but appreciation lowers net exports."
    answerText: "\"The inflow finances the current deficit and appreciates RATE, but lower NX partly offsets demand.\""
    why: "Financial confidence can strengthen the currency while weakening aggregate demand through NX."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (1)
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Page 9 signed.
    # CONVERTED. The bible's payload was:
    #   choices:[{id:A,label:"The inflow is entirely beneficial"},{id:B,label:"The inflow is entirely harmful"},{id:C,label:"The inflow finances the deficit, but appreciation lowers net exports"},{id:D,label:"The two international accounts need not sum to zero"}]; answer:C; rebuttals:{A:"Appreciation reduces exports and raises imports, so the inflow has a cost.",B:"The financial surplus finances the current-account deficit, so the inflow has a benefit.",D:"In the simplified AP model, current and financial accounts sum to zero."}.
    # The labels and the key are already in place above; the payload's keyed
    # rebuttals are what was still owed, verbatim, in the bible's A/B/D order.
    rebuttals:
    - "Appreciation reduces exports and raises imports, so the inflow has a cost."
    - "The financial surplus finances the current-account deficit, so the inflow has a benefit."
    - "In the simplified AP model, current and financial accounts sum to zero."

    title: "Mission 13: worked examples"
    examples:
    - {"title":"Trace crowding out","problem":"Government borrowing rises while national saving is fixed in a loanable-funds model. What may happen to private investment?","rule":"More borrowing demand raises the equilibrium real interest rate, other things equal.","steps":["The higher real rate makes some private investment projects less attractive.","Private investment falls relative to what it otherwise would have been."],"answer":"Government borrowing crowds out some private investment in this model.","mistake":"Do not confuse the real loanable-funds rate with a simple nominal money balance."}
    - {"title":"Trace appreciation","problem":"A domestic currency appreciates while foreign prices and incomes are fixed. What pressure does this put on net exports?","rule":"Appreciation makes domestic goods dearer to foreigners and foreign goods cheaper domestically, other things equal.","steps":["Export demand tends to fall as foreigners face higher prices.","Import demand tends to rise as residents face lower foreign-goods prices."],"answer":"Net exports tend to fall.","mistake":"This is a directional prediction, not an instantaneous fixed numerical change."}
    - {"title":"Combine fiscal offsets","problem":"A package initially adds 20 billion to demand, while investment and net exports fall by 4 and 6 billion in the same simplified accounting comparison. Find the net change.","rule":"Net change=initial gain+each signed offset.","steps":["Set up the relationship: Net change=initial gain+each signed offset.","net change=20-4-6=10 billion."],"answer":"The net increase is 10 billion before any further effects not specified.","mistake":"Do not count an offset as an additional gain."}
    - {"title":"Use Fisher's approximation","problem":"The nominal interest rate is 6% and expected inflation is 4%. Estimate the real rate.","rule":"Real rate≈nominal rate-expected inflation.","steps":["Set up the relationship: Real rate≈nominal rate-expected inflation.","real rate≈6%-4%=2%."],"answer":"The approximate expected real borrowing rate is 2%.","mistake":"Use expected inflation for the expected real rate, not an unrelated past rate."}
    - {"title":"Protect a required reserve","problem":"A lab has 100 energy units. Essential tasks need 30 and 40 units, and reserve must be at least 20. How much remains for an optional task?","rule":"Optional capacity = total - essential use - protected reserve.","steps":["essential use = 30+40 = 70 units.","optional capacity = 100-70-20 = 10 units."],"answer":"At most 10 units may fund the optional task while preserving the reserve.","mistake":"Treating the reserve as freely available breaks the stated requirement."}

  stops:
  # --- Stop 49: Real-rate market
  #     Concept: loanable funds; Keystone: interest markets; Area: Bank Supervision; Learning role: INTRODUCE; Difficulty: L4; Story role: L4.
  #     placement: CONTROL, at policy-wall.
  - group: BANKS
    at: policy-wall
    title: "Real-rate market"
    concept: 22   # loanable funds
    reason: "The proposed bridge requires borrowing, so its effect on private investment needs measuring."
    scene: "Hold national saving and central-bank money fixed, then add 8.7 billion of government borrowing to loan demand. Measure the real rate and private investment, then restore baseline for the board."
    motivation: "The reversible loanable-funds test estimates the real-rate increase and investment displacement caused by the borrowing."
    format: CONTROL
    question: "Change borrowing 0→8.7b; keep saving and Ms fixed; measure real i 1.5→2.1% and I 120→114b; restore and remeasure; submit conclusion. noise:.05,response:.6,candidates:[borrowing,saving,Ms]."
    answerText: "\"Borrowing raises real i 0.6 point and reduces I 6 billion.\""
    why: "A rightward loan-demand shift raises real interest and crowds out private investment."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. A rightward loan-demand shift raises real interest and crowds out private investment.
    # correct result: Adding 8.7 billion of borrowing raises the real rate by 0.6 percentage point and cuts private investment by 6 billion; restoration recovers the baseline.
    # state/output: Record the result and unlock the next named stop.
    # CONVERTED. The bible's payload was:
    #   control:{candidates:[{id:"government_borrowing",change:"0 to 8.7 billion"},{id:"national_saving",change:"hold or reduce"},{id:"money_supply",change:"hold or increase"}],selected:"government_borrowing",baseline:{borrowing:0,real_rate:1.5,private_investment:120},response:{borrowing:8.7,real_rate:2.1,private_investment:114},units:{borrowing:"billion",real_rate:"percent",private_investment:"billion"},noise_band:{real_rate:0.05},fixed:["national saving","central-bank money supply"],measure:"after the loanable-funds panel settles",restore:{borrowing:0,real_rate:1.5,private_investment:120,remeasure:true},correct:"government borrowing raises the real rate and crowds out investment"}
    # `candidates` are the engine's `variables`, `selected` its `truth`, `fixed` its
    # `held`. The reversal the bible's `restore` asks for is what the engine's panel
    # already makes the player do.
    # ONE MODEL CONVERSION. The engine watches a single reading and the bible reads
    # two. The reading is the real rate, which is the one the bible's own noise band
    # is quoted on: 1.5% at baseline, 2.1% after, so the signed response is +0.6
    # percentage point, which is also the number this stop's own prompt states.
    # The private-investment half of the bible's reading, 120 → 114 billion, has no
    # second slot on this panel and is not carried.
    control:
      observable: { label: "Real interest rate", unit: "percent" }
      variables:
      - { id: government_borrowing, label: "government borrowing, 0 to 8.7 billion" }
      - { id: national_saving, label: "national saving, hold or reduce" }
      - { id: money_supply, label: "money supply, hold or increase" }
      truth: government_borrowing
      held: ["national saving", "central-bank money supply"]
      baseline: 1.5
      response: 0.6
      noise: 0.05
      moral: "Government borrowing raises the real rate and crowds out investment."


    on: { enter: true, at: RATE }
    world: "Loan refusals and lost export orders share the spending folder."
    panel: "Measure domestic and foreign crowding out."
    # unlocks: Unlock Stop 49 at policy-wall in Rate Room.
    bubbles:
    - who: dane   # Rhea Dane
      say: "Start with real-rate market. We need evidence the next decision can use."
  - id: after-stop-49
    # After Stop 49 | money-market-console | automatic
    on: { after: [1] }
    world: "At policy-wall, the dated accepted-result slip for Stop 49 reads: \"Adding 8.7 billion of borrowing raises the real rate by 0.6 percentage point and cuts private investment by 6 billion; restoration recovers the baseline.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 49 RECORDED - STOP 50 OPEN"
    # unlocks: Unlock Stop 50 at money-market-console in Bank Supervision.
    bubbles:
    - who: dane   # Rhea Dane
      say: "Nice work. Borrowing raises real i 0.6 point and reduces I 6 billion."
  - id: after-stop-50
    # After Stop 50 | payment-wires | automatic
    on: { after: [2] }
    world: "At money-market-console, the dated accepted-result slip for Stop 50 reads: \"A deficit raises loan demand and the real rate, crowds out private investment, slows capital growth, and reduces long-run growth.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 50 RECORDED - STOP 51 OPEN"
    # unlocks: Unlock Stop 51 at payment-wires in Open-Economy Floor.
    bubbles:
    - who: dane   # Rhea Dane
      say: "Good thinking. Deficit → loanable-funds demand right → real interest rises → private investment falls → capital accumulation slows → long-run growth slows."
  - id: after-stop-51

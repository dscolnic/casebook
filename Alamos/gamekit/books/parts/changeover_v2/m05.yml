  # --- Stop 20: Choose the first-round plan
  #     Concept: fiscal choice; Keystone: AD/multipliers; Area: Rate Room; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: VALUE, asked by Rhea Dane beside policy-wall.
  - group: RATE
    at: policy-wall
    title: "Choose the first-round plan"
    person: dane
    concept: 24   # fiscal choice
    reason: "The announced package falls short of the measured target, leaving the funding decision open."
    scene: "The 6-billion announcement would add only 24 billion to demand and leave a 10.8-billion gap. Fund the option that reaches the measured target and preserves an independent supply-shock review before launch."
    motivation: "The allocation identifies a package large enough for the modeled gap while retaining a separate supply-shock review."
    format: VALUE
    question: "Spend exactly 100 plan points and submit the funded pair."
    answerText: "Prepare 8.7 billion in purchases and preserve the supply-shock review."
    why: "Demand stimulus can close a recessionary gap without proving that it can cure cost-push inflation."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Demand stimulus can close a recessionary gap without proving that it can cure cost-push inflation.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Page 5 signed.
    # CONVERTED. The bible's payload was:
    #   value:{budget:100,options:[{id:"G8_7",cost:65,required:true,axis:"targeted purchases"},{id:"supply_review",cost:35,required:true,axis:"independent shock test"},{id:"G6",cost:45,axis:"fast announcement"},{id:"tax11_6",cost:80,axis:"tax alternative"},{id:"publicity",cost:25,axis:"message"}],correct:["G8_7","supply_review"]}
    # `budget` becomes `budget.amount`; the bible's `required` — the same two ids as
    # its `correct` — is the engine's `decisive`. Each option is named only by its
    # `axis`, so that phrase carries as the label too. 65+35+45+80+25 = 250 against
    # 100, and the two decisive ones cost exactly 100.
    value:
      budget: { amount: 100, unit: "plan points" }
      options:
      - { id: G8_7, label: "targeted purchases", axis: "targeted purchases", cost: 65, decisive: true }
      - { id: supply_review, label: "independent shock test", axis: "independent shock test", cost: 35, decisive: true }
      - { id: G6, label: "fast announcement", axis: "fast announcement", cost: 45 }
      - { id: tax11_6, label: "tax alternative", axis: "tax alternative", cost: 80 }
      - { id: publicity, label: "message", axis: "message", cost: 25 }

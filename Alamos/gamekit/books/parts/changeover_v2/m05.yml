      answer: "D"
      options:
      - {key: "A", text: "The fraction of an extra dollar of income consumed.", why: "This describes marginal propensity to consume (MPC). It does not answer the question about multiplier."}
      - {key: "B", text: "The fraction saved; MPC plus MPS equals one.", why: "This describes marginal propensity to save (MPS). It does not answer the question about multiplier."}
      - {key: "C", text: "Saving is the leakage that limits the total demand response.", why: "This describes the marginal propensities to consume and save. It does not answer the question about multiplier."}
      - {key: "D", text: "Total demand change divided by the initial policy change.", why: "Correct. Total demand change divided by the initial policy change."}
    - prompt: "Which statement best explains the marginal propensities to consume and save?"

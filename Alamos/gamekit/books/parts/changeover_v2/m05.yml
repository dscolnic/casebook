      - {key: "B", text: "Total demand change divided by the initial policy change.", why: "This describes multiplier. It does not answer the question about marginal propensity to save (mps)."}
      - {key: "C", text: "The fraction saved; MPC plus MPS equals one.", why: "Correct. The fraction saved; MPC plus MPS equals one."}
      - {key: "D", text: "Saving is the leakage that limits the total demand response.", why: "This describes the marginal propensities to consume and save. It does not answer the question about marginal propensity to save (mps)."}

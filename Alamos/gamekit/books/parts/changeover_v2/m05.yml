      - {key: "B", text: "The fraction of an extra dollar of income consumed.", why: "This describes marginal propensity to consume (MPC). It does not answer the question about the marginal propensities to consume and save."}
      - {key: "C", text: "The fraction saved; MPC plus MPS equals one.", why: "This describes marginal propensity to save (MPS). It does not answer the question about the marginal propensities to consume and save."}
      - {key: "D", text: "Total demand change divided by the initial policy change.", why: "This describes multiplier. It does not answer the question about the marginal propensities to consume and save."}
    - prompt: "In a simple closed-economy model with no proportional taxes, the marginal propensity to consume is 0.75. How do the spending and tax multipliers compare?"
      hint: "Identify the defining relationship or mechanism for spending and tax multipliers. All needed information is in this question."
      answer: "B"
      options:
      - {key: "A", text: "The fraction of an extra dollar of income consumed.", why: "This describes marginal propensity to consume (MPC). It does not answer the question about spending and tax multipliers."}
      - {key: "B", text: "The spending multiplier is 4 and the tax multiplier is -3.", why: "Correct. The spending multiplier is 4 and the tax multiplier is -3."}
      - {key: "C", text: "The fraction saved; MPC plus MPS equals one.", why: "This describes marginal propensity to save (MPS). It does not answer the question about spending and tax multipliers."}
      - {key: "D", text: "Total demand change divided by the initial policy change.", why: "This describes multiplier. It does not answer the question about spending and tax multipliers."}
    - prompt: "Which statement best explains gap closing?"

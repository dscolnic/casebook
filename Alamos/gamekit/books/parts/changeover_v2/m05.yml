- title: "The First Round"
  card:
    header: "MISSION 5 - 11 DAYS UNTIL CHANGEOVER."
    title: "The First Round"
    goNow: "Go to PRICES and meet Rhea Dane, finance minister, at the spending board."
    body: "11 days until changeover. An unsigned spending order sits under a press deadline. Today you decide which spending plan could close the gap."
    objective: "Calculate the spending and tax changes that target the measured gap."
  objective: "Calculate the spending and tax changes that target the measured gap."
  stake: "11 days until changeover. An unsigned spending order sits under a press deadline. Today you decide which spending plan could close the gap."
  takeaway: "Evidence must match the mechanism, units, and stated limits."
  segue: "But Lina's fuel shock can still raise prices; Rhea cannot promise cheaper fuel with the same spending order."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-prices
    # On arrival at PRICES | calculating-desk | automatic
    on: { enter: true, at: PRICES }
    world: "An unsigned spending order sits under a press deadline."
    panel: "Calculate the spending and tax changes that target the measured gap."
    # unlocks: Unlock Stop 17 at calculating-desk in PRICES.
    bubbles:
    - who: dane   # Rhea Dane
      say: "Start with split the next crown. We need evidence the next decision can use."
  - id: after-stop-17
    # After Stop 17 | calculating-desk | automatic
    on: { after: [1] }
    world: "At calculating-desk, the dated accepted-result slip for Stop 17 reads: \"0.25.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 17 RECORDED - STOP 18 OPEN"
    # unlocks: Unlock Stop 18 at calculating-desk in PRICES.
    bubbles:
    - who: dane   # Rhea Dane
      say: "Nice work. MPS is 0.25, so one quarter leaks from each round."
  - id: after-stop-18
    # After Stop 18 | calculating-desk | automatic
    on: { after: [2] }
    world: "At calculating-desk, the dated accepted-result slip for Stop 18 reads: \"(4,−3).\". The slip remains in that fixture's evidence holder."
    panel: "PRICES → RATE"
    # unlocks: Unlock Stop 19 at calculating-desk in PRICES.
    bubbles:
    - who: dane   # Rhea Dane
      say: "Good thinking. The spending multiplier is 4; the tax multiplier is −3."
  - id: after-stop-19
    # After Stop 19 | policy-wall | automatic
    on: { after: [3] }
    world: "At calculating-desk, the dated accepted-result slip for Stop 19 reads: \"(8.7,11.6) billion, ±0.1.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 19 RECORDED - STOP 20 OPEN"
    # unlocks: Unlock Stop 20 at policy-wall in Rate Room.
    bubbles:
    - who: dane   # Rhea Dane
      say: "Exactly right. Close the gap with 8.7 billion in purchases or an 11.6-billion tax cut."
  - id: at-mission-end
    # At mission end | calculating-desk | automatic
    on: { missionEnd: true }
    world: "At policy-wall, Rhea Dane pins the 8.7-BILLION PURCHASE OPTION to the policy wall. The dated prop remains here on later visits."
    panel: "MISSION 5 EVIDENCE: RECORDED"
    # unlocks: Open the mission outcome and metric screen.
    bubbles:
    - who: dane   # Rhea Dane
      say: "I can fund demand. I cannot vote more fuel into the tank. But Lina's fuel shock can still raise prices; Rhea cannot promise cheaper fuel with the same spending order."

  terms:
  - {name: "Marginal propensity to consume (MPC)", def: "the fraction of an extra dollar of income consumed."}
  - {name: "Marginal propensity to save (MPS)", def: "the fraction saved; MPC plus MPS equals one."}
  - {name: "Multiplier", def: "total demand change divided by the initial policy change."}

  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 5: worked examples"
    examples:
    - {"title":"Divide extra income","problem":"A household spends $80 of an additional $100 of disposable income. Find MPC and MPS.","rule":"Marginal propensity to consume MPC=extra consumption/extra income; MPS=1-MPC.","steps":["Set up the relationship: Marginal propensity to consume MPC=extra consumption/extra income; MPS=1-MPC.","MPC=80/100=0.8; MPS=1-0.8=0.2."],"answer":"The household saves 20% of its extra income.","mistake":"Use changes in income and spending, not their total levels."}
    - {"title":"Simple spending multiplier","problem":"In the simplified fixed-price spending model, MPC=0.75. Find the purchases multiplier.","rule":"Spending multiplier=1/(1-MPC), with no additional leakages in this model.","steps":["Set up the relationship: Spending multiplier=1/(1-MPC), with no additional leakages in this model.","multiplier=1/(1-0.75)=1/0.25=4."],"answer":"A one-unit autonomous purchase increase produces four units of total output change in this model.","mistake":"This model result is not an unconditional real-world guarantee."}
    - {"title":"Simple tax multiplier","problem":"Use MPC=0.75 in the simplified fixed-price model. Find the tax multiplier and effect of a $2 billion tax increase.","rule":"Tax multiplier=-MPC/(1-MPC).","steps":["Set up the relationship: Tax multiplier=-MPC/(1-MPC).","kT=-0.75/0.25=-3; ΔY=(-3)(+2)=-6 billion."],"answer":"The modeled output change is -6 billion.","mistake":"A tax increase reduces disposable income, so its multiplier is negative."}
    - {"title":"Size a purchase increase","problem":"A recessionary gap is 20 billion and the simplified spending multiplier is 4. Find the purchase increase needed to close it.","rule":"Required purchase increase=desired output increase/multiplier.","steps":["Set up the relationship: Required purchase increase=desired output increase/multiplier.","ΔG=20/4=5 billion."],"answer":"The model calls for 5 billion in additional purchases.","mistake":"Do not multiply the gap by the multiplier."}
    - {"title":"Balanced-budget change","problem":"Government purchases and taxes each rise by 5 billion. Use spending multiplier 4 and tax multiplier -3. Find the net output change.","rule":"Add the two modeled effects.","steps":["Set up the relationship: Add the two modeled effects.","ΔY=4(5)+(-3)(5)=20-15=5 billion."],"answer":"Output rises 5 billion in this simplified model.","mistake":"Equal purchase and tax changes need not have cancelling demand effects."}


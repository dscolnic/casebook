  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 12: worked examples"
    examples:
    - {"title":"Convert currency balances","problem":"A fictional conversion exchanges 5 old units for 1 new unit. Convert 200 old units.","rule":"New units=old units/(old units per new unit).","steps":["Set up the relationship: New units=old units/(old units per new unit).","new balance=200/5=40 new units."],"answer":"The new balance is 40 units.","mistake":"The balance number changes; that alone does not change purchasing power."}
    - {"title":"Required and excess reserves","problem":"Deposits are 100 million, reserves 15 million, and the hypothetical required-reserve ratio is 10%. Find required and excess reserves.","rule":"Required reserves=ratio×deposits; excess=actual-required.","steps":["Set up the relationship: Required reserves=ratio×deposits; excess=actual-required.","required=0.10(100)=10; excess=15-10=5 million."],"answer":"The bank has 5 million above its required reserve in this teaching model.","mistake":"The assumed reserve ratio is a problem input, not a claim about current policy."}
    - {"title":"Convert a foreign purchase","problem":"An item costs 20 foreign currency units. The exchange rate changes from 2 to 4 foreign units per domestic unit. Compare the domestic cost.","rule":"Domestic cost=foreign price/(foreign units per domestic unit).","steps":["Set up the relationship: Domestic cost=foreign price/(foreign units per domestic unit).","old cost=20/2=10 domestic units; new cost=20/4=5."],"answer":"The domestic currency appreciated, making this unchanged foreign price cheaper domestically.","mistake":"Read the exchange-rate quotation direction before deciding whether to multiply or divide."}
    - {"title":"Read an inclusive threshold","problem":"A fictional laboratory rule permits a sample concentration at or below 5 mg/L. A sample measures exactly 5 mg/L. Classify it under that rule.","rule":"At or below means concentration ≤ limit.","steps":["comparison = 5 ≤ 5, which is true. Equality is included.","classification = passes this concentration rule. No claim about other requirements follows."],"answer":"This measurement passes the stated inclusive threshold.","mistake":"Replacing ≤ with < would wrongly exclude equality."}
    - {"title":"Count independent evidence sources","problem":"Three reports copy one balance reading. A fourth report uses a separately calibrated balance. How many measurement sources are there?","rule":"Reports are not independent measurements when they copy a common source.","steps":["source group 1 = the first balance and its three copies. Count that measurement once.","source group 2 = the second balance. It adds a separate measurement route."],"answer":"There are two measurement sources, not four.","mistake":"Agreement among copies cannot establish independent confirmation."}


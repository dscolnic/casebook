  # --- Stop 46: Reserve clock
  #     Concept: reserve timing; Keystone: banking; Area: Bank Supervision; Learning role: RETRIEVE; Difficulty: L4; Story role: L4.
  #     placement: VERIFY, at reserve-clock.
  - group: BANKS
    at: reserve-clock
    title: "Reserve clock"
    concept: 19   # reserve timing
    reason: "The tray balance is established, but the clearing gate depends on reserves arriving in time."
    scene: "The 10,000-RATE deposit requires 10% reserves, and 1,000 RATE is scheduled at minute 6. Predict the minimum reserve before opening the clearing gate clearly for the next board decision."
    motivation: "The reserve comparison identifies the first moment the bank meets the inclusive clearing requirement."
    format: VERIFY
    question: "**CALCULATE AND COMMIT:** Use required reserves=deposit×reserve ratio with 10,000 RATE and 10% and submit the required reserve in RATE."
    answerText: "\"The reserve arrives exactly at the inclusive 1,000-RATE requirement.\""
    why: "Correct totals can still fail when their timing differs."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Correct totals can still fail when their timing differs.
    # correct result: The bank needs 1,000 RATE and has exactly 1,000 RATE at minute 6, so the inclusive rule permits clearing then.
    # state/output: Record the result and unlock the next named stop.
    # CONVERTED. The bible's payload was:
    #   verify:{prediction:{equation:"required reserves=deposit×reserve ratio",inputs:{deposit:10000,unit:"RATE",reserve_ratio:0.10},correct:1000,tolerance:0.01,submit_unit:"RATE"},lock:"clock stays locked until 1,000 RATE is committed",action:"advance clock to minute 6",measurement:{minute:6,reserves:1000,unit:"RATE"},decision_rule:"clear if reserves are at least the requirement",correct_conclusion:"clear at minute 6"}
    # MODEL CONVERSION, as at stop 29. The bible states one correct prediction with
    # a tolerance; this engine has the player dial a prediction on a range and then
    # compares it against what the measurement finds.
    #   · `truth` is the bible's `correct`, 1,000 RATE, and the bible's measurement
    #     finds the same 1,000 at minute 6
    #   · `passRatio` is the bible's own tolerance of 0.01 RATE said as a ratio of
    #     1,000: 999.99/1000 and 1000.01/1000
    #   · the dial runs 0 to 10,000 — nothing held, up to the whole deposit the
    #     bible puts on the board — in steps of 10 RATE, wide enough that not every
    #     position passes, which is what the importer requires
    relationship: "required reserves = deposit × reserve ratio, so 10,000 RATE × 0.10"
    verify:
      prediction:
        label: "Required reserve on the converted deposit"
        unit: "RATE"
        min: 0
        max: 10000
        step: 10
      truth: 1000
      passRatio: [0.99999, 1.00001]
      intervention:
        label: "Advance clock to minute 6"
        note: "The clock stays locked until 1,000 RATE is committed."
      measurement:
        label: "Reserves on the clock at minute 6"
        note: "Clear if reserves are at least the requirement."
      moral: "Clear at minute 6."
      commit: "Report the required reserve"

  # --- Stop 47: Foreign echo
  #     Concept: conversion/forex; Keystone: open economy; Area: Open-Economy Floor; Learning role: RETRIEVE; Difficulty: L4; Story role: L4.
  #     placement: TRACE, at payment-wires.
  - group: OPENEC
    at: payment-wires
    title: "Foreign echo"
    concept: 30   # conversion/forex
    reason: "The bank clock passes while conflicting conversion tables remain in circulation."
    scene: "Because the bank clock passes, trace the shop labels, bond quote, export invoice, and independent customs receipt. Determine which channels inherit the old 4.00 shortcut and which preserve 4.15."
    motivation: "Tracing dependencies identifies which prices and invoices inherit the shortcut and which independently use the legal ratio."
    format: TRACE
    question: "Open dependencies and submit conclusion."
    answerText: "\"Three channels share the 4.00 shortcut; independent customs supports 4.15.\""
    why: "Shared conversion dependence can manufacture agreement across prices and assets."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Shared conversion dependence can manufacture agreement across prices and assets.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Record the result and unlock the next named stop.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   trace:{channels:[{id:"shops",label:"shop labels",dependency:"4.00 shortcut table",target_dependent:true},{id:"bond",label:"bond quote",dependency:"4.00 shortcut table",target_dependent:true},{id:"exports",label:"export invoice",dependency:"4.00 shortcut table",target_dependent:true},{id:"customs",label:"customs receipt",dependency:"direct 4.15 conversion",independent:true}],shared_upstream:"4.00 shortcut table",correct_conclusion:"three dependent channels are biased; customs supports 4.15",answerText:"Shop, bond, and export agreement is redundant because all use 4.00; the independent customs receipt supports 4.15."}
    trace:
      channels:
        - id: shops
          label: Shop labels
          reading: 4.00 crowns per RATE
          depends:
            - shortcut_table
        - id: bond
          label: Bond quote
          reading: 4.00 crowns per RATE
          depends:
            - shortcut_table
        - id: exports
          label: Export invoice
          reading: 4.00 crowns per RATE
          depends:
            - shortcut_table
        - id: customs
          label: Customs receipt
          reading: 4.15 crowns per RATE
          depends:
            - direct_conversion
      resources:
        - id: shortcut_table
          label: shortcut_table
        - id: direct_conversion
          label: direct_conversion
      independent:
        - customs
      target: shortcut_table


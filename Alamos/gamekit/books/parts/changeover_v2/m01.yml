      say: "Count the nationwide transactions, date them, and state coverage."
  - id: after-stop-2
    # After Stop 2 | queue-board | automatic
    on: { after: [2] }
    world: "The counter tradeoff result remains visible while the why did the street price rise? fixture lights."
    panel: "COUNTER"
    bubbles:

# ============================================================ MISSION 1
# Split back out of books/changeover_v2.yml by tools/split-book.mjs; the book's text, verbatim.
# Lifted from ../fpl_gpt/CHANGEOVER_AP_MACRO_Campaign_Implementation_Bible(1).md by tools/v10extract.mjs. Every quoted string below is
# the bible's, verbatim; engine/dev/bibleParity.mjs holds it to that.
- title: "What Counts"
  card:
    header: "MISSION 1 - 15 DAYS UNTIL CHANGEOVER."
    title: "What Counts"
    goNow: "Go to COUNTER and meet Eli Voss, counter operations lead, at the queue board."
    body: "15 days until changeover. A queue bends past a shop window with fresh price stickers. Today you decide what the line at the counter really proves."
    objective: "Separate useful economic measures from alarming but incomplete signals."
  objective: "Separate useful economic measures from alarming but incomplete signals."
  stake: "15 days until changeover. A queue bends past a shop window with fresh price stickers. Today you decide what the line at the counter really proves."
  takeaway: "Evidence must match the mechanism, units, and stated limits."
  segue: "But Idris finds trades that do not belong in the output total; the headline must wait for his ledger."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Scarcity", def: "limited resources cannot satisfy every want, so every choice gives up an alternative."}
  - {name: "Opportunity cost", def: "the value of the best alternative given up."}
  - {name: "Equilibrium", def: "the price and quantity where planned buying equals planned selling."}
  primer:
  - "A bowed PPC shows rising opportunity cost; a straight PPC shows constant cost."
  - "A point inside a PPC means resources are underused; better resources, technology, or productivity shift it outward."
  - "Price changes move along supply or demand; other causes shift a curve."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-exchange-counter
    # On arrival at Exchange Counter | queue-board | automatic
    on: { enter: true, at: COUNTER }
    world: "A queue bends past a shop window with fresh price stickers."
    panel: "Separate useful economic measures from alarming but incomplete signals."
    # unlocks: Unlock Stop 1 at queue-board in Exchange Counter.
    bubbles:
    - who: voss   # Eli Voss
      say: "Start with signal or statistic. We need evidence the next decision can use."
  - id: after-stop-1
    # After Stop 1 | allocation-slate | automatic
    on: { after: [1] }
    world: "At queue-board, the dated accepted-result slip for Stop 1 reads: \"C. \"Count the nationwide transactions, date them, and state coverage.\"\". The slip remains in that fixture's evidence holder."
    panel: "STOP 1 RECORDED - STOP 2 OPEN"
    # unlocks: Unlock Stop 2 at allocation-slate in COUNTER.
    bubbles:
    - who: voss   # Eli Voss
      say: "Nice work. Count the nationwide transactions, date them, and state coverage."
  - id: after-stop-2
    # After Stop 2 | queue-board | automatic
    on: { after: [2] }
    world: "At allocation-slate, the dated accepted-result slip for Stop 2 reads: \"40 calls total, or 1 call per extra exchange. tolerance:0.\". The slip remains in that fixture's evidence holder."
    panel: "COUNTER"
    # unlocks: Unlock Stop 3 at queue-board in COUNTER.
    bubbles:
    - who: voss   # Eli Voss
      say: "Good thinking. Forty extra exchanges cost forty bank calls: one call per exchange."
  - id: after-stop-3
    # After Stop 3 | wage-notice-rail | automatic
    on: { after: [3] }
    world: "At queue-board, the dated accepted-result slip for Stop 3 reads: \"Supply shifted left.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 3 RECORDED - STOP 4 OPEN"
    # unlocks: Unlock Stop 4 at wage-notice-rail in COUNTER.
    bubbles:
    - who: voss   # Eli Voss
      say: "That check holds. The street diagnosis is ready, but the first official record still contains an unsupported shortage claim."
  - id: at-mission-end
    # At mission end | queue-board | automatic
    on: { missionEnd: true }
    world: "At queue-board, Eli Voss clips the dated national figures beside the queue tally. The dated prop remains here on later visits."
    panel: "MISSION 1 EVIDENCE: RECORDED"
    # unlocks: Open the mission outcome and metric screen.
    bubbles:
    - who: voss   # Eli Voss
      say: "I can count the line. I cannot call it the whole country. But Idris finds trades that do not belong in the output total; the headline must wait for his ledger."

  # The optional review, offered when the mission is finished and graded
  # nowhere. GENERATED by tools/bible-deeper.mjs from the campaign bible.
  deeper:
    intro: "Try six independent practice questions. Each includes its own context and any needed data; no mission records are required."
    concepts:
    - {name: "Production possibilities curve (PPC)", def: "a graph of the maximum combinations of two outputs an economy can produce with current resources and technology."}
    - {say: "A bowed PPC shows rising opportunity cost; a straight PPC shows constant cost."}
    - {say: "A point inside a PPC means resources are underused; better resources, technology, or productivity shift it outward."}
    questions:
    - prompt: "A country can move five clerks from bank calls to exchange windows. Exchanges rise from 100 to 150 per hour while bank calls fall from 90 to 40. What is the opportunity cost of each additional exchange?"
      hint: "Divide the 50 bank calls given up by the 50 additional exchanges produced."
      answer: "B"
      options:
      - {key: "A", text: "0.5 bank call", why: "This divides one change by twice the actual exchange gain; both output changes are 50."}
      - {key: "B", text: "1 bank call", why: "The counter gives up 50 bank calls to gain 50 exchanges, so the opportunity cost is 1 call per exchange."}
      - {key: "C", text: "1.5 bank calls", why: "This treats the original bank-call level as the amount sacrificed instead of using the change."}
      - {key: "D", text: "2 bank calls", why: "This doubles the sacrifice even though the two output changes have equal magnitude."}
    - prompt: "A market reports a price increase and a quantity decrease, unchanged household income, and delayed deliveries. Which change best explains the pattern?"
      hint: "Look for the shift that raises equilibrium price while lowering equilibrium quantity."
      answer: "D"
      figure: {"kind":"line","xLabel":"Quantity","yLabel":"Price","caption":"Demand is unchanged while supply shifts left.","series":[{"name":"Demand","points":[[20,90],[40,70],[60,50],[80,30]]},{"name":"Supply before","points":[[20,30],[40,50],[60,70],[80,90]]},{"name":"Supply after","points":[[10,40],[30,60],[50,80],[70,100]]}]}
      options:
      - {key: "A", text: "Demand shifts right.", why: "Greater demand raises both price and quantity, so it cannot explain the lower quantity."}
      - {key: "B", text: "Demand shifts left.", why: "Lower demand reduces both price and quantity, so it cannot explain the higher price."}
      - {key: "C", text: "Supply shifts right.", why: "Greater supply lowers price and raises quantity, the opposite of both reported changes."}
      - {key: "D", text: "Supply shifts left.", why: "Reduced supply raises equilibrium price and lowers equilibrium quantity, matching both observations."}
    - prompt: "A currency-exchange counter is processing fewer customers today. Which evidence would best support a claim that the slowdown affects the country nationally?"
      hint: "A national conclusion needs a defined population, broad coverage, and a stated time period."
      answer: "C"
      options:
      - {key: "A", text: "The longest queue photographed in the capital", why: "One unusually long queue is a local extreme and does not establish national coverage."}
      - {key: "B", text: "The loudest complaint recorded at one counter", why: "Complaint volume measures salience rather than the prevalence of a national slowdown."}
      - {key: "C", text: "Dated transaction counts from a defined nationwide set of counters", why: "Dated counts from a defined nationwide set provide the scope and timing required for the claim."}
      - {key: "D", text: "One shopkeeper's estimate of lost sales", why: "One estimate lacks both representative coverage and a reproducible national measure."}
    - prompt: "A production possibilities curve for exchange service and bank support is bowed outward. What does its changing slope show as more exchange service is produced?"
      hint: "Follow how many bank-support calls must be sacrificed for each additional group of exchanges."
      answer: "C"
      figure: {"kind":"line","xLabel":"Exchange service","yLabel":"Bank support","caption":"A bowed production possibilities curve.","series":[{"name":"PPC","points":[[0,100],[20,97],[40,90],[60,76],[80,52],[100,0]]}]}
      options:
      - {key: "A", text: "Opportunity cost decreases.", why: "Decreasing opportunity cost would make the frontier flatten as exchange production rises."}
      - {key: "B", text: "Opportunity cost remains constant.", why: "Constant opportunity cost is represented by a straight frontier with an unchanging slope."}
      - {key: "C", text: "Opportunity cost increases.", why: "A bowed frontier becomes steeper, so successive exchange gains sacrifice more bank support."}
      - {key: "D", text: "Scarcity disappears.", why: "The frontier exists because resources remain scarce; its curvature does not remove scarcity."}
    - prompt: "A country is producing at a point inside its production possibilities curve for exchange service and bank support. What is the best interpretation?"
      hint: "Compare the interior point with the maximum feasible combinations on the frontier."
      answer: "B"
      figure: {"kind":"line","xLabel":"Exchange service","yLabel":"Bank support","caption":"The current production point lies inside the production possibilities curve.","series":[{"name":"PPC","points":[[0,100],[20,97],[40,90],[60,76],[80,52],[100,0]]},{"name":"Current production","points":[[50,55]]}]}
      options:
      - {key: "A", text: "The combination is currently unattainable.", why: "Unattainable combinations lie outside the current frontier, not inside it."}
      - {key: "B", text: "Some available resources or productive capacity are underused.", why: "An interior point is feasible but inefficient because the same resources could produce more of at least one service."}
      - {key: "C", text: "The economy has achieved maximum efficiency.", why: "Productive efficiency requires a point on the frontier rather than inside it."}
      - {key: "D", text: "Opportunity cost must be constant.", why: "Constant opportunity cost concerns the frontier's shape, not whether a point lies inside it."}
    - prompt: "A country installs software that lets the same clerks process more exchanges and more bank calls per hour. How should the production possibilities curve change?"
      hint: "Ask whether the maximum attainable combinations changed or whether the economy merely chose a different existing combination."
      answer: "A"
      figure: {"kind":"line","xLabel":"Exchange service","yLabel":"Bank support","caption":"Higher productivity shifts the production possibilities curve outward.","series":[{"name":"PPC","points":[[0,100],[20,97],[40,90],[60,76],[80,52],[100,0]]},{"name":"After productivity gain","points":[[0,120],[24,116],[48,108],[72,91],[96,62],[120,0]]}]}
      options:
      - {key: "A", text: "It shifts outward because productive capacity increased.", why: "Better productivity increases attainable output combinations, so the frontier shifts outward."}
      - {key: "B", text: "It shifts inward because opportunity cost exists.", why: "Opportunity cost does not by itself reduce productive capacity or shift the frontier inward."}
      - {key: "C", text: "The economy moves to an interior point on the old curve.", why: "An interior point represents underuse of existing capacity, not an improvement in maximum capacity."}
      - {key: "D", text: "The curve stays fixed and only its labels change.", why: "Because both maximum outputs can rise, the frontier itself must change."}

  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 1: worked examples"
    examples:
    - {"title":"Measure an opportunity cost","problem":"A worker can make 8 tables or 16 chairs in a day at constant tradeoffs. Find the opportunity cost of one table.","rule":"Opportunity cost = units of the best alternative forgone / units gained.","steps":["Set up the relationship: Opportunity cost = units of the best alternative forgone / units gained.","cost per table=16 chairs/8 tables=2 chairs per table."],"answer":"One table costs two forgone chairs.","mistake":"Opportunity cost is not the sum of both possible outputs."}
    - {"title":"Interpret unused resources","problem":"An economy can produce either 10 units of food and 10 tools, or more food without reducing tools. Is the first point on its production frontier?","rule":"A frontier point is productively efficient: more of one output requires less of another.","steps":["More food is possible with tools unchanged.","The first point therefore leaves some productive capacity unused."],"answer":"It lies inside the production possibilities frontier.","mistake":"Being inside the frontier does not by itself mean technology is worse."}
    - {"title":"Recognize rising opportunity cost","problem":"Moving along a production possibilities curve gains 2 machines first at a cost of 1 crop unit, then gains 2 more at a cost of 3 crop units. What changes?","rule":"Compare forgone output per extra unit gained.","steps":["first cost=1/2=0.5 crop unit per machine.","second cost=3/2=1.5 crop units per machine."],"answer":"Opportunity cost rises as machine output expands.","mistake":"A constant gain in machines need not have a constant cost."}
    - {"title":"Find market equilibrium","problem":"Demand is Qd=20-2P and supply is Qs=4+2P. Find equilibrium price P and quantity Q.","rule":"Equilibrium requires quantity demanded equal quantity supplied.","steps":["Set up the relationship: Equilibrium requires quantity demanded equal quantity supplied.","20-2P=4+2P gives 16=4P, so P=4; Q=20-2(4)=12."],"answer":"Equilibrium is price 4 and quantity 12.","mistake":"Set the two quantities equal; do not add them."}
    - {"title":"Predict a supply decrease","problem":"Production costs rise while consumer demand is unchanged. What happens to competitive equilibrium?","rule":"Higher production costs shift supply left, other things equal.","steps":["At the old price, sellers supply less, creating a shortage.","The new intersection has a higher price and lower quantity."],"answer":"Price rises and equilibrium quantity falls.","mistake":"A price rise caused by supply is not evidence that demand increased."}

  stops:
  # --- Stop 1: Signal or statistic
  #     Concept: evidence quality; Keystone: Evidence/index integrity; Area: Rate Room; Learning role: INTRODUCE; Difficulty: L1; Story role: clue.
  #     placement: CHOICE, asked by Eli Voss beside queue-board.
  - group: RATE
    at: queue-board
    title: "Signal or statistic"
    person: voss
    concept: 32   # evidence quality
    reason: "The growing plaza queue is being mistaken for evidence about the whole country."
    scene: "The queue has doubled since dawn, yet completed exchanges per cashier are unchanged. Choose the observation that can support a national claim before the board treats one crowded plaza as the whole economy."
    motivation: "Dated nationwide counts establish which claims about exchange activity the board can responsibly make."
    format: CHOICE
    question: "Select one submitted conclusion from the four distinct choices below."
    choices:
    - "Queue length."
    - "Loudest complaint."
    - "Nationwide transaction count with date and coverage."
    - "One vendor's price."
    answer: "Nationwide transaction count with date and coverage."
    answerText: "The completed check shows c. \"Count the nationwide transactions, date them, and state coverage.\"."
    why: "Aggregates require defined populations and timing."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (1)
    # correct result: C. "Count the nationwide transactions, date them, and state coverage."
    # state/output: Page 1 gains "dated coverage"; unlock S2.
    # CONVERTED. The bible's payload was:
    #   choices:[{id:A,label:"Queue length"},{id:B,label:"Loudest complaint"},{id:C,label:"Nationwide transaction count with date and coverage"},{id:D,label:"One vendor's price"}]; answer:C; rebuttals:{A:"A line can reflect staffing rather than national scarcity.",B:"Complaint volume does not measure national prevalence.",D:"One vendor price is not a national price index."}
    # The four labels and the key were already in place above; what the payload
    # still owed the stop is its keyed rebuttals, one per wrong option, verbatim
    # and in the bible's own A/B/D order.
    rebuttals:
    - "A line can reflect staffing rather than national scarcity."
    - "Complaint volume does not measure national prevalence."
    - "One vendor price is not a national price index."

  # --- Stop 2: Counter tradeoff
  #     Concept: PPC/opportunity cost; Keystone: scarcity; Area: Rate Room; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: DERIVE, at allocation-slate.
  - group: RATE
    at: allocation-slate
    title: "Counter tradeoff"
    concept: 1   # scarcity/opportunity cost
    reason: "Opening more exchange windows now would take clerks away from bank support."
    scene: "With the evidence standard set, Eli can move four clerks from bank calls to exchange windows. Build the opportunity-cost statement before changing the roster, so the board records both added service and the lost alternative."
    motivation: "The opportunity cost tells the board how many bank calls it gives up for each additional exchange."
    format: DERIVE
    question: "Submit the opportunity cost of 40 extra exchanges."
    answerText: "Forty extra exchanges cost forty bank calls: one call per exchange."
    why: "A staffing choice is not free merely because no money changes hands."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Staff time, not cash, is scarce.
    # correct result: 40 calls total, or 1 call per extra exchange. tolerance:0. **answerText:** "Forty extra exchanges cost forty bank calls: one call per exchange."
    # state/output: roster plan posted; unlock S3.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{lines:["Δexchanges=160−120=40","Δcalls=40−80=−40","OC=40 bank calls/40 exchanges=1 call per exchange"],licenses:["difference","foregone alternative","unit rate"],correct_order:[1,2,3]}
    derive:
      start: Begin with the complete starting relation on the card. Preserve its named left side on every line.
      goal: Counter tradeoff in the form and units requested by the prompt
      steps:
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: Δexchanges=160−120=40
            - text: Δexchanges=160+120=280
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: Δcalls=40−80=−40
            - text: Δcalls=80−40=+40
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: OC=−Δcalls/Δexchanges=−(−40)/40=1 bank call per extra exchange
            - text: OC=Δcalls/Δexchanges=−40/40=−1 bank call per extra exchange
              why: This reports the negative slope of the tradeoff instead of the positive amount of bank-call capacity sacrificed.
              survives: true

  # --- Stop 3: Why did the street price rise?
  #     Concept: supply-demand shifts; Keystone: equilibrium; Area: Rate Room; Learning role: PRACTICE; Difficulty: L3; Story role: clue.
  #     placement: DIAGNOSIS, at queue-board.
  - group: RATE
    at: queue-board
    title: "Why did the street price rise?"
    concept: 4   # supply-demand shifts
    reason: "Extra windows have a staffing cost, so the cause of the street-price rise needs checking first."
    scene: "Because extra windows cost bank support, the board must know whether the line comes from buying pressure or reduced supply. Read the street panel and select the one shift that fits every active and quiet reading."
    motivation: "Identifying the supply or demand shift determines whether more exchange capacity addresses the actual problem."
    format: DIAGNOSIS
    question: "Select one diagnosis."
    figure: {"kind":"line","xLabel":"Quantity","yLabel":"Price level","caption":"The supply curve shifts left while demand stays fixed.","series":[{"name":"Demand","points":[[20,90],[40,70],[60,50],[80,30]]},{"name":"Supply before","points":[[20,30],[40,50],[60,70],[80,90]]},{"name":"Supply after","points":[[10,40],[30,60],[50,80],[70,100]]}]}
    answerText: "The completed check shows supply shifted left."
    why: "The cause of a higher equilibrium price determines whether more demand or less supply should be investigated."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A demand increase cannot explain falling quantity.
    # correct result: Supply shifted left.
    # state/output: port delivery clue logged; unlock S4.
    # CONVERTED. The bible's payload was:
    #   diagnosis:{headline:"Price up, quantity down",readings:[{zone:"price",value:"+6%"},{zone:"quantity",value:"−9%"},{zone:"income",value:"unchanged"},{zone:"delivery",value:"late"}],choices:[{id:"D_right",mechanism:"demand rises: P↑ Q↑"},{id:"S_left",mechanism:"supply falls: P↑ Q↓"},{id:"D_left",mechanism:"demand falls: P↓ Q↓"},{id:"ceiling",mechanism:"binding ceiling lowers legal P"}],answer:"S_left"}
    # A rename throughout. `readings` already carry zone and value; the engine
    # grades a diagnosis by label, so each candidate's `mechanism` is its label
    # and `answer` is the keyed one written out. No reading carries a `status`,
    # which is what leaves income and delivery quiet.
    headline: "Price up, quantity down"
    readings:
    - { zone: "price", value: "+6%" }
    - { zone: "quantity", value: "−9%" }
    - { zone: "income", value: "unchanged" }
    - { zone: "delivery", value: "late" }
    choices:
    - "demand rises: P↑ Q↑"
    - "supply falls: P↑ Q↓"
    - "demand falls: P↓ Q↓"
    - "binding ceiling lowers legal P"
    answer: "supply falls: P↑ Q↓"

  # --- Stop 4: Page one standard
  #     Concept: measurement/claims; Keystone: Evidence integrity; Area: Rate Room; Learning role: COMBINE; Difficulty: L4; Story role: decision.
  #     placement: ATTEST, asked by Eli Voss beside wage-notice-rail.
  - group: RATE
    at: wage-notice-rail
    title: "Page one standard"
    person: voss
    concept: 32   # measurement/claims
    reason: "The street diagnosis is ready, but the first official record still contains an unsupported shortage claim."
    scene: "The plaza is busy, but a national claim requires a national record. Check what the dated transactions and staffing records actually establish."
    motivation: "Verification separates measured transactions and staffing costs from conclusions the plaza crowd cannot establish."
    format: ATTEST
    question: "National conclusions need dated coverage; observations of a queue cannot establish a nationwide cash shortage. Read the displayed source excerpts, then select every supported claim and leave unsupported claims unsigned."
    answerText: "Each signature is limited to what its source establishes. The unsupported claims lack the specific date, physical condition, independence or scope they assert."
    why: "The first page must preserve what is known without turning an incomplete clue into policy."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A conclusion is not backed because it sounds urgent.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Page 1 signed.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   attest:{limit:3,claims:[{id:"national_tx",backed:true,critical:true},{id:"staff_tradeoff",backed:true},{id:"price_quantity",backed:true},{id:"cash_shortage",backed:false,critical:true}],correct_verified:["national_tx","staff_tradeoff","price_quantity"],reject:["cash_shortage"]}
    attest:
      claims:
        - id: primary
          label: primary claim for Page one standard
          evidence: the signed source reproduces the displayed result
          critical: true
          backed: true
        - id: independent
          label: independent confirmation
          evidence: the independent record agrees within the stated tolerance
          critical: true
          backed: true
        - id: scope
          label: scope and date
          evidence: the record names the population and time window
          backed: true
        - id: extension
          label: stronger untested extension
          evidence: no independent check supports the extension; it must be held
          critical: true
      checks: 3

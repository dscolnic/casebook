    headline: "Price up, quantity down"
    readings:
    - { zone: "price", value: "+6%" }
    - { zone: "quantity", value: "−9%" }
    - { zone: "income", value: "unchanged" }
    - { zone: "delivery", value: "late" }
    choices:
    - "demand rises: P↑ Q↑"
    - "supply falls: P↑ Q↓"
    - "demand falls: P↓ Q↓"
    - "binding ceiling lowers legal P"
    answer: "supply falls: P↑ Q↓"

  # --- Stop 4: Page one standard
  #     Concept: measurement/claims; Keystone: Evidence integrity; Area: Rate Room; Learning role: COMBINE; Difficulty: L4; Story role: decision.
  #     placement: ATTEST, asked by Eli Voss beside wage-notice-rail.
  - group: RATE
    at: wage-notice-rail
    title: "Page one standard"
    person: voss
    concept: "measurement/claims"
    reason: "Only backed claims may enter the Rate Book."
    scene: "The supply diagnosis explains today's street pattern but still does not justify a national shortage claim. Verify the records that identify dated quantities, coverage, and tradeoffs, then reject any claim resting only on the plaza crowd."

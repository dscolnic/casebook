- title: "What Counts"
  card:
    header: "15 DAYS TO CHANGEOVER"
    title: "What Counts"
    goNow: "Go to COUNTER and meet Eli Voss, counter operations lead, at the queue board."
    body: "The plaza queue is growing, but a long line does not prove that Halvern lacks money. Scarcity means limited resources force choices, while a market price balances buyers and sellers. You will sort evidence, map tradeoffs, and test the queue's cause. By the end of the mission, decide which statistics belong in the first Rate Book page."
    objective: "Separate useful economic measures from alarming but incomplete signals."
  objective: "Separate useful economic measures from alarming but incomplete signals."
  stake: "The plaza queue is growing, but a long line does not prove that Halvern lacks money. Scarcity means limited resources force choices, while a market price balances buyers and sellers. You will sort evidence, map tradeoffs, and test the queue's cause. By the end of the mission, decide which statistics belong in the first Rate Book page."
  takeaway: "Evidence must match the mechanism, units, and stated limits."
  segue: "Mission decision: Use the national count, not the loudest queue. Real output is 700 billion RATE. Prices rose 2.5%. The board now needs the production gap."
  # The mission card's own "Primer concepts", printed on the plan card.
  primer:
  - "A bowed PPC shows rising opportunity cost; a straight PPC shows constant cost."
  - "A point inside a PPC means resources are underused; better resources, technology, or productivity shift it outward."
  - "Price changes move along supply or demand; other causes shift a curve."

  # The bible's beat script. `world` is its World state line, `panel` its

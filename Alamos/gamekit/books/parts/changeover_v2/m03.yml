    examples:
    - {"title":"Price a fixed basket","problem":"A fixed basket costs $50 in the base year and $60 now. Find the consumer price index.","rule":"CPI=current basket cost/base basket cost×100.","steps":["Set up the relationship: CPI=current basket cost/base basket cost×100.","CPI=60/50×100=120."],"answer":"The fixed basket is 20% more expensive than in the base year.","mistake":"Keep basket quantities fixed when calculating this index."}
    - {"title":"Inflation between two indexes","problem":"The price index rises from 120 to 126. Find inflation over the period.","rule":"Inflation=(new index-old index)/old index×100%.","steps":["Set up the relationship: Inflation=(new index-old index)/old index×100%.","inflation=(126-120)/120×100%=5%."],"answer":"The price level rose 5%.","mistake":"Six index points are not automatically six percent."}
    - {"title":"Find a weighted price change","problem":"Food is half of spending and transport is half. Food prices rise 10%; transport prices are unchanged. Find the fixed-weight price rise.","rule":"Weighted change=sum of spending share×category price change.","steps":["Set up the relationship: Weighted change=sum of spending share×category price change.","change=0.5(10%)+0.5(0%)=5%."],"answer":"The fixed-weight price increase is 5%.","mistake":"Do not count a category's full increase as if it were the whole basket."}

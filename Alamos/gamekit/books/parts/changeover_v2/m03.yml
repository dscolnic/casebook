  # --- Stop 12: Keep history and repair representation
  #     Concept: index publication; Keystone: Evidence/inflation; Area: Statistics Floor; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: VALUE, asked by Lina Saye beside basket-table.
  - group: STATS
    at: basket-table
    title: "Keep history and repair representation"
    person: saye
    concept: 7   # index publication
    reason: "The weighting test has exposed a representation problem without invalidating the historical calculation."
    scene: "The historical price index is reproducible, but its old energy weight may misrepresent current households. Lina needs a publication plan that preserves comparability and exposes that limitation."
    motivation: "The evidence package preserves a comparable series while showing how a current household basket changes the estimate."
    format: VALUE
    question: "You have 60 evidence points. Cover every required outcome at the lowest total cost within the budget; keep all unused capacity in reserve. Select whole packages, then submit the plan; the board shows its total and remaining reserve for you to check."
    answerText: "Each funded package supplies a required outcome; an affordable package that leaves one unresolved is insufficient."
    why: "Publishing both measures prevents a convenient revision from erasing history or a stale basket from hiding bias."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Publishing both measures prevents a convenient revision from erasing history or a stale basket from hiding bias.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Page 3 signed; port-energy clue logged.
    # CONVERTED. The bible's payload was:
    #   value:{budget:60,options:[{id:"parallel",cost:45,required:true,axis:"fixed CPI plus current-weight companion"},{id:"audit",cost:15,required:true,axis:"weight audit"},{id:"ads",cost:30,axis:"publicity"},{id:"erase",cost:25,axis:"replace history"}],correct:["parallel","audit"]}
    # `budget` becomes `budget.amount`; the bible's `required` — which is also its
    # `correct` list — is the engine's `decisive`. The bible names each option only
    # by its `axis`, so that phrase is the option's label as well; no wording of it
    # is changed. 45+15+30+25 = 115 against 60, and the two decisive ones cost 60.
    value:
      budget:
        amount: 60
        unit: evidence points
      decision: ""
      requirements:
        - id: r1
          text: retain the fixed historical index and publish a current-weight companion
        - id: r2
          text: verify and disclose the current weights
      rule: Cover every required outcome at the lowest total cost within the budget; keep all unused capacity in reserve.
      plans:
        - parallel,audit
      options:
        - id: parallel
          label: Parallel index publication
          cost: 45
          axis: ""
          reveals: Keeps the historical series and adds a separately labelled current-weight series.
          covers:
            - r1
          decisive: true
        - id: audit
          label: Household-weight audit
          cost: 15
          axis: ""
          reveals: Checks the weights used in the new companion and publishes the method.
          covers:
            - r2
          decisive: true
        - id: ads
          label: Publicity campaign
          cost: 30
          axis: ""
          reveals: Increases awareness without checking weights or preserving comparability.
        - id: erase
          label: Replace the historical series
          cost: 25
          axis: ""
          reveals: Substitutes new weights into history, losing the original comparable series.
      commit: Commit the decision

    at: price-history-board
    title: "Calculate the printed inflation"
    concept: 8   # inflation rate
    reason: "The new index is calculated and needs comparison with the previous published index."
    scene: "With the new CPI fixed at 108 and last year's CPI at 102, calculate the percentage change the public bulletin will show. The board must know the exact headline before testing whether it represents households."
    motivation: "The inflation rate establishes the official price-change headline that the household review will test."
    format: DERIVE
    question: "Submit the percentage."
    answerText: "The official basket reports 5.88% inflation."
    why: "Inflation is the percentage change in the index, not the index's distance from 100."
    # wrong-path feedback, one rebuttal per wrong option:
    #   108−100 is not the year-to-year rate.
    # correct result: 5.88%, ±0.05. **answerText:** "The official basket reports 5.88% inflation."

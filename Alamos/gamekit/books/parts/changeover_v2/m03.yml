  # --- Stop 11: Does the basket represent families?
  #     Concept: CPI bias/weights; Keystone: Evidence integrity; Area: Statistics Floor; Learning role: COMBINE; Difficulty: L4; Story role: reversal.
  #     placement: STRESS, asked by Lina Saye beside basket-table.
  - group: STATS
    at: basket-table
    title: "Does the basket represent families?"
    person: saye
    concept: 7   # CPI bias/weights
    reason: "The official inflation rate is reproducible, but the basket's energy weight may not fit today's households."
    scene: "The published price index uses an old energy weight. Lina checks how the conclusion changes when the household share changes."
    motivation: "Weight sensitivity shows whether the inflation conclusion depends on an unrepresentative spending pattern."
    format: STRESS
    question: "Inspect the four supplied index recalculations from 15% to 30% energy weight. Select the conclusion true for every recalculation."
    answerText: "All four rates are positive. The size varies from 3.1% to 5.88%, so the historical weight cannot be presented as representative of every household."
    why: "Sensitivity to a stale weight requires disclosure and a companion measure, not silent replacement."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Sensitivity to a stale weight requires disclosure and a companion measure, not silent replacement.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: revised basket unlocks.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   stress:{assumption:"imported-energy weight",min:0.15,max:0.30,step:0.05,candidates:[{id:"broad_5_88",survives:[0.30]},{id:"range",survives:[0.15,0.20,0.25,0.30]},{id:"zero",survives:[]}],readings:{0.15:3.1,0.20:3.7,0.25:4.4,0.30:5.88},correct:"range"}
    stress:
      candidates:
        - id: nominal_only
          label: Use only the nominal reading
        - id: common_extreme_mistake
          label: Use the favorable extreme as if it were guaranteed
        - id: robust_plan
          label: The keyed result shown by the completed interaction.
      criteria:
        - key: evidence_fit
          label: fit to the stop evidence
        - key: safety_margin
          label: margin at the adverse end
      scores:
        nominal_only:
          evidence_fit: 95
          safety_margin: 20
        common_extreme_mistake:
          evidence_fit: 88
          safety_margin: 5
        robust_plan:
          evidence_fit: 82
          safety_margin: 92
      feasible:
        nominal_only: 22.5
        common_extreme_mistake: 22.5
        robust_plan: 15
      assumption:
        label: imported-energy basket weight
        unit: "%"
        min: 15
        max: 30
        nominal: 22.5
        step: 5

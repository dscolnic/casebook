    - {"title":"Compare pay with prices","problem":"A wage rises from $10 to $11 per hour while the price index rises from 100 to 110. Did purchasing power rise?","rule":"Real wage in base-year dollars=nominal wage×100/price index.","steps":["Set up the relationship: Real wage in base-year dollars=nominal wage×100/price index.","old real wage=10×100/100=10; new real wage=11×100/110=10."],"answer":"Purchasing power per hour is unchanged.","mistake":"A higher dollar wage need not buy more goods."}


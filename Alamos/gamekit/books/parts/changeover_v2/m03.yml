- title: "The Basket"
  card:
    header: "MISSION 3 - 13 DAYS UNTIL CHANGEOVER."
    title: "The Basket"
    goNow: "Go to PRICES and meet Lina Saye, price statistics lead, at the basket table."
    body: "13 days until changeover. An old basket sits beside a family's crossed-out shopping list. Today you decide how to report the old and new price baskets."
    objective: "Test whether the fixed basket represents current household costs."
  objective: "Test whether the fixed basket represents current household costs."
  stake: "13 days until changeover. An old basket sits beside a family's crossed-out shopping list. Today you decide how to report the old and new price baskets."
  takeaway: "Evidence must match the mechanism, units, and stated limits."
  segue: "But Eli's job sheets show people who have stopped looking for work; the price story cannot explain that away."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-prices
    # On arrival at PRICES | basket-table | automatic
    on: { enter: true, at: PRICES }
    world: "An old basket sits beside a family's crossed-out shopping list."
    panel: "Test whether the fixed basket represents current household costs."
    # unlocks: Unlock Stop 9 at basket-table in PRICES.
    bubbles:
    - who: saye   # Lina Saye
      say: "Start with price the fixed basket. We need evidence the next decision can use."
  - id: after-stop-9
    # After Stop 9 | price-history-board | automatic
    on: { after: [1] }
    world: "At basket-table, the dated accepted-result slip for Stop 9 reads: \"108 ±0.1.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 9 RECORDED - STOP 10 OPEN"
    # unlocks: Unlock Stop 10 at price-history-board in PRICES.
    bubbles:
    - who: saye   # Lina Saye
      say: "Nice work. The fixed basket CPI is 108."
  - id: after-stop-10
    # After Stop 10 | basket-table | automatic
    on: { after: [2] }
    world: "At price-history-board, the dated accepted-result slip for Stop 10 reads: \"5.88%, ±0.05.\". The slip remains in that fixture's evidence holder."
    panel: "108−100"
    # unlocks: Unlock Stop 11 at basket-table in PRICES.
    bubbles:
    - who: saye   # Lina Saye
      say: "Good thinking. The official basket reports 5.88% inflation."
  - id: after-stop-11
    # After Stop 11 | basket-table | automatic
    on: { after: [3] }
    world: "At basket-table, the dated accepted-result slip for Stop 11 reads: \"Inflation stays positive but changes with the energy weight.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 11 RECORDED - STOP 12 OPEN"
    # unlocks: Unlock Stop 12 at basket-table in PRICES.
    bubbles:
    - who: saye   # Lina Saye
      say: "Exactly right. Inflation is positive, but 5.88% depends strongly on the stale energy weight."
  - id: at-mission-end
    # At mission end | basket-table | automatic
    on: { missionEnd: true }
    world: "At price-history-board, Lina Saye pins the companion price measure beside the unchanged historical series. The dated prop remains here on later visits."
    panel: "MISSION 3 EVIDENCE: RECORDED"
    # unlocks: Open the mission outcome and metric screen.
    bubbles:
    - who: saye   # Lina Saye
      say: "Keep the old line. Put the change where people can see it. But Eli's job sheets show people who have stopped looking for work; the price story cannot explain that away."


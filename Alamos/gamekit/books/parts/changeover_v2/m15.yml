  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 15: worked examples"
    examples:
    - {"title":"Use Fisher's approximation","problem":"The nominal interest rate is 6% and expected inflation is 4%. Estimate the real rate.","rule":"Real rate≈nominal rate-expected inflation.","steps":["Set up the relationship: Real rate≈nominal rate-expected inflation.","real rate≈6%-4%=2%."],"answer":"The approximate expected real borrowing rate is 2%.","mistake":"Use expected inflation for the expected real rate, not an unrelated past rate."}
    - {"title":"Measure an output gap","problem":"Actual real output is 95 billion and potential output is 100 billion. Find the signed gap and percent gap.","rule":"Gap=actual-potential; percent gap=gap/potential×100%.","steps":["Set up the relationship: Gap=actual-potential; percent gap=gap/potential×100%.","gap=95-100=-5 billion; percent gap=-5/100×100%=-5%."],"answer":"The economy has a recessionary gap of 5 billion, or 5% below potential.","mistake":"Potential output is the reference denominator."}
    - {"title":"Required and excess reserves","problem":"Deposits are 100 million, reserves 15 million, and the hypothetical required-reserve ratio is 10%. Find required and excess reserves.","rule":"Required reserves=ratio×deposits; excess=actual-required.","steps":["Set up the relationship: Required reserves=ratio×deposits; excess=actual-required.","required=0.10(100)=10; excess=15-10=5 million."],"answer":"The bank has 5 million above its required reserve in this teaching model.","mistake":"The assumed reserve ratio is a problem input, not a claim about current policy."}
    - {"title":"Close a current account","problem":"Net exports are -10, net foreign income +3, and net transfers -1 billion. Find the current account.","rule":"Current account=net exports+net income+net transfers.","steps":["Set up the relationship: Current account=net exports+net income+net transfers.","current account=-10+3-1=-8 billion."],"answer":"The current account has a deficit of 8 billion.","mistake":"An asset purchase belongs in the financial account, not this sum."}
    - {"title":"Combine fiscal offsets","problem":"A package initially adds 20 billion to demand, while investment and net exports fall by 4 and 6 billion in the same simplified accounting comparison. Find the net change.","rule":"Net change=initial gain+each signed offset.","steps":["Set up the relationship: Net change=initial gain+each signed offset.","net change=20-4-6=10 billion."],"answer":"The net increase is 10 billion before any further effects not specified.","mistake":"Do not count an offset as an additional gain."}

  stops:
  # --- Stop 57: Live economy panel
  #     Concept: national snapshot; Keystone: GDP/inflation/labor; Area: Statistics Floor; Learning role: TRANSFER; Difficulty: L5; Story role: L5.
  #     placement: BALANCE, at live-economy-panel.
  - group: STATS
    at: live-economy-panel
    title: "Live economy panel"
    concept: 32   # national snapshot
    reason: "The first-week readings are visible and must be assessed against the signed thresholds."
    scene: "Launch data show real GDP 682 billion, Yf 720, unemployment 8.2%, companion inflation 3.0%, payment failures 0.5%, and fuel costs easing. Count the readings relevant to the signed stance."
    motivation: "The live output gap and payment evidence determine whether the agreed emergency condition has actually been met."
    format: BALLPARK
    question: "Select all six readings, calculate gap 682−720, and submit conclusion."
    answerText: "\"The gap is −38 billion; payment failures 0.5% do not meet the 2% trigger.\""
    why: "Output is weak, but the payment trigger has not fired and inflation is below its stop limit."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Output is weak, but the payment trigger has not fired and inflation is below its stop limit.
    # correct result: −38b; no trigger.
    # state/output: Record the result and unlock the next named stop.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in

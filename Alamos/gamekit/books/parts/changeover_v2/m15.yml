    # model conversion. Do not paste it in as it stands.
    #   balance:{streams:[{id:"actual_output",value:682,unit:"billion RATE",counts:true},{id:"full_employment_output",value:720,unit:"billion RATE",counts:true},{id:"unemployment",value:8.2,unit:"percent",counts:true},{id:"CPI_inflation",value:3.0,unit:"percent",counts:true},{id:"payment_failures",value:0.5,unit:"percent",counts:true},{id:"fuel_easing",value:1,unit:"status flag",counts:false,reason:"context, not an output-gap stream"}],correct:{gap:-38,trigger:"no joint inflation-payment trigger"},answerText:"The economy has a 38-billion recessionary gap, but the joint trigger is not met; fuel easing is context rather than a counted ledger stream."}
    estimate:
      prompt: actual real output minus full-employment output
      question: signed real-output gap
      labels:
        - 682 billion RATE  (Actual real output)
        - 720 billion RATE  (Full-employment output)
        - 3 %  (CPI inflation)
        - 0.5 %  (Payment failures)
      values:

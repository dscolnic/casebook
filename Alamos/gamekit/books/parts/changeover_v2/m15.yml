    # model conversion. Do not paste it in as it stands.
    #   rule:"conversion 4.15; policy rate 3.25%; buy bonds if Y≤680 AND failures≥2%; stop if companion CPI≥6.5%"; anchors:[4.15,3.25,680,2,6.5]; objective:"stable conversion with full employment and price guard"; direction:"conditional expansion"; consequence_limit:"CPI".
    trigger:
      scale:
        label: payment-failure rate
        unit: "%"
        min: 0
        max: 10
        step: 0.25

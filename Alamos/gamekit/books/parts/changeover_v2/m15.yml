- title: "Sign With Conditions"
  card:
    header: "MISSION 15 - 1 DAY UNTIL CHANGEOVER."
    title: "Sign with Conditions"
    goNow: "Go to COUNTER and meet Eli Voss at the live queue board."
    body: "One day remains. New notes wait under a cloth at the shut counter. Today you decide whether to open with the signed rules."
    objective: "Make the final integrated, reversible macroeconomic decision."
  objective: "Make the final integrated, reversible macroeconomic decision."
  stake: "One day remains. New notes wait under a cloth at the shut counter. Today you decide whether to open with the signed rules."
  takeaway: "Evidence must match the mechanism, units, and stated limits."
  segue: "Therefore Eli can make the first exchange at 4.15 while the signed 3.25% policy rate and reversal rules stay on the wall."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-exchange-counter
    # On arrival at Exchange Counter | live-economy-panel | automatic
    on: { enter: true, at: COUNTER }
    world: "New notes wait under a cloth behind the closed counter."
    panel: "Make the final integrated, reversible macroeconomic decision."
    # unlocks: Unlock Stop 57 at live-economy-panel in Exchange Counter.
    bubbles:
    - who: voss   # Eli Voss
      say: "Start with live economy panel. We need evidence the next decision can use."
  - id: after-stop-57
    # After Stop 57 | reserve-clock | automatic
    on: { after: [1] }
    world: "At live-economy-panel, the dated accepted-result slip for Stop 57 reads: \"−38b; no trigger.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 57 RECORDED - STOP 58 OPEN"
    # unlocks: Unlock Stop 58 at reserve-clock in Bank Supervision.
    bubbles:
    - who: voss   # Eli Voss
      say: "Nice work. The gap is −38 billion; payment failures 0.5% do not meet the 2% trigger."
  - id: after-stop-58
    # After Stop 58 | threshold-rail | automatic
    on: { after: [2] }
    world: "At reserve-clock, the dated accepted-result slip for Stop 58 reads: \"(1.00%,2b).\". The slip remains in that fixture's evidence holder."
    panel: "RATE → BANKS → COUNTER"
    # unlocks: Unlock Stop 59 at threshold-rail in Rate Room.
    bubbles:
    - who: voss   # Eli Voss
      say: "Good thinking. At 3.25%, the real rate is 1.00% and banks retain 2 billion excess reserves."
  - id: after-stop-59
    # After Stop 59 | conversion-desk | automatic
    on: { after: [3] }
    world: "At threshold-rail, the dated accepted-result slip for Stop 59 reads: \"The keyed result shown by the completed interaction.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 59 RECORDED - STOP 60 OPEN"
    # unlocks: Unlock Stop 60 at conversion-desk in COUNTER.
    bubbles:
    - who: voss   # Eli Voss
      say: "Exactly right. The real rate links investment, AD, capital flows, currency, NX, and growth; CPI and payment limits independently govern reversal."
  - id: at-mission-end
    # At mission end | live-economy-panel | automatic
    on: { missionEnd: true }
    world: "At conversion-desk, Mara Venn turns the counter-opening key. The final scene follows the completion gate below."
    panel: "MISSION 15 EVIDENCE: RECORDED"
    # unlocks: Open the mission outcome and metric screen.
    bubbles:
    - who: venn   # Mara Venn
      say: "You gave us conditions we can live by after the cameras leave. Therefore Eli can make the first exchange at 4.15 while the signed 3.25% policy rate and reversal rules stay on the wall."


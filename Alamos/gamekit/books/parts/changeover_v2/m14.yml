  # --- Stop 54: Pass-through test
  #     Concept: CPI/supply; Keystone: inflation; Area: Statistics Floor; Learning role: COMBINE; Difficulty: L4; Story role: L4.
  #     placement: VERIFY, at price-history-board.
  - group: STATS
    at: price-history-board
    title: "Pass-through test"
    concept: "CPI/supply"
    reason: "First-week cover needs a measured price corridor."
    scene: "The basket gives fuel a 20% weight, and fuel prices are predicted to rise 12% while all other basket prices stay fixed. Predict the direct CPI effect before revealing the new basket."
    motivation: "A bounded relative-price shock should not be mistaken for unlimited inflation."
    format: VERIFY
    question: "**CALCULATE AND COMMIT:** Use direct CPI effect=price change×basket weight with 12% and 20% and submit the effect in percentage points."
    answerText: "\"The direct basket effect is 2.4%; restoration returns baseline.\""
    why: "A bounded relative-price shock should not be mistaken for unlimited inflation."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. A bounded relative-price shock should not be mistaken for unlimited inflation.
    # correct result: The direct CPI effect is 2.4 percentage points; returning fuel to baseline returns the direct effect to zero.
    # state/output: Record the result and unlock the next named stop.
    # CONVERTED. The bible's payload was:
    #   verify:{prediction:{equation:"direct CPI effect=fuel weight×fuel price change",inputs:{weight:0.20,price_change:12,unit:"percent"},correct:2.4,tolerance:0.05,submit_unit:"percentage points"},lock:"basket reveal stays locked until 2.4 points is committed",action:"reveal first-week basket with other prices fixed",measurement:{CPI_change:2.4,unit:"percentage points"},restore:{fuel_price_change:0,CPI_change:0,remeasure:true},correct_conclusion:"bounded relative-price shock"}
    # MODEL CONVERSION, as at stops 29 and 46. The bible states one correct
    # prediction with a tolerance; the engine dials a prediction on a range and then
    # compares it against what the measurement finds.
    #   · `truth` is the bible's `correct`, 2.4 percentage points, and its own
    #     measurement finds the same 2.4
    #   · `passRatio` is the bible's own tolerance of 0.05 said as a ratio of 2.4:
    #     2.35/2.4 = 0.9792 and 2.45/2.4 = 1.0208
    #   · the dial runs 0 to 12 — no effect, up to the whole fuel price change the
    #     bible puts on the board — in steps of 0.1 point, wide enough that not
    #     every position passes
    relationship: "direct CPI effect = fuel weight × fuel price change, so 0.20 × 12%"
    verify:
      prediction:
        label: "Direct CPI effect"
        unit: "percentage points"
        min: 0
        max: 12
        step: 0.1
      truth: 2.4
      passRatio: [0.9792, 1.0208]
      intervention:
        label: "Reveal first-week basket with other prices fixed"
        note: "The basket reveal stays locked until 2.4 points is committed."
      measurement:
        label: "CPI change on the revealed basket"
      moral: "A bounded relative-price shock."
      commit: "Report the direct effect"


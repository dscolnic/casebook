  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 14: worked examples"
    examples:
    - {"title":"Find a weighted price change","problem":"Food is half of spending and transport is half. Food prices rise 10%; transport prices are unchanged. Find the fixed-weight price rise.","rule":"Weighted change=sum of spending share×category price change.","steps":["Set up the relationship: Weighted change=sum of spending share×category price change.","change=0.5(10%)+0.5(0%)=5%."],"answer":"The fixed-weight price increase is 5%.","mistake":"Do not count a category's full increase as if it were the whole basket."}
    - {"title":"Identify a supply shock","problem":"Energy costs rise suddenly. Output falls while the price level rises. Which aggregate curve change fits?","rule":"Higher production costs shift short-run aggregate supply left, other things equal.","steps":["At a given price level, firms are willing to supply less.","The new intersection gives lower output and higher prices."],"answer":"A negative supply shock fits this combination, often called stagflation.","mistake":"A demand decrease alone would tend to lower both output and prices."}
    - {"title":"Compare policy timing","problem":"A downturn requires action within two months; wage renegotiation occurs in six months. Can wage adjustment alone meet that deadline?","rule":"Distinguish eventual adjustment from the time needed to reach it.","steps":["six months > two months, so the stated wage adjustment occurs after the deadline.","A separate temporary measure would need its own effect, cost, and timing assessment."],"answer":"Wage adjustment alone does not meet the two-month target.","mistake":"A long-run prediction does not guarantee a short-run solution."}
    - {"title":"Test an entire allowed range","problem":"A component must operate at or below 80 °C. Its estimated temperature is 77 ± 4 °C. Does every allowed value pass?","rule":"Test the worst allowed value against the stated bound.","steps":["allowed interval = [77-4, 77+4] = [73,81] °C.","maximum allowed temperature = 81 °C > 80 °C. At least one allowed value fails."],"answer":"The estimate does not establish that every allowed temperature passes.","mistake":"Checking only the central estimate ignores the uncertainty."}
    - {"title":"Read an inclusive threshold","problem":"A fictional laboratory rule permits a sample concentration at or below 5 mg/L. A sample measures exactly 5 mg/L. Classify it under that rule.","rule":"At or below means concentration ≤ limit.","steps":["comparison = 5 ≤ 5, which is true. Equality is included.","classification = passes this concentration rule. No claim about other requirements follows."],"answer":"This measurement passes the stated inclusive threshold.","mistake":"Replacing ≤ with < would wrongly exclude equality."}

  stops:
  # --- Stop 53: Shock identity
  #     Concept: supply shock; Keystone: AD-AS; Area: Rate Room; Learning role: RETRIEVE; Difficulty: L4; Story role: L4.
  #     placement: DIAGNOSIS, at trade-ledger.
  - group: RATE
    at: trade-ledger
    title: "Shock identity"
    concept: 14   # supply shock
    reason: "A fresh price disturbance has arrived just as the launch plan is being finalized."
    scene: "Fuel imports fall 12%, input prices rise, real output falls, the legal 4.15 ratio clears, and payment failures stay at zero. Select the diagnosis fitting every reading for the board."
    motivation: "The diagnosis identifies the shock that must be included before the board changes its policy stance."
    format: DIAGNOSIS
    question: "Select one diagnosis - real supply shock, bad conversion ratio, aggregate-demand boom, or money run - and submit the conclusion."
    answerText: "\"The fuel disruption shifts SRAS left; 4.15 and payments remain sound.\""
    why: "A real supply shock can hurt output without invalidating the currency conversion."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. A real supply shock can hurt output without invalidating the currency conversion.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Record the result and unlock the next named stop.
    # CONVERTED, as far as the payload goes. The bible's payload was:
    #   answer:SRAS_left_real_shock; alternatives:[bad_ratio,AD_boom,money_run].
    # The four candidates are bare ids there and are spelled out on this stop's own
    # prompt — "real supply shock, bad conversion ratio, aggregate-demand boom, or
    # money run" — with the key first, as in the payload, so those are the labels.
    # STILL OWED BY THE BIBLE: the diagnosis panel. The payload carries no readings
    # and names no figure, so the stop imports as the CHOICE it plays as. The scene
    # names five readings in prose but the bible keys none of them to a zone or a
    # value, and inventing that panel is not a conversion.
    choices:
    - "real supply shock"
    - "bad conversion ratio"
    - "aggregate-demand boom"
    - "money run"
    answer: "real supply shock"

  # --- Stop 54: Pass-through test
  #     Concept: CPI/supply; Keystone: inflation; Area: Statistics Floor; Learning role: COMBINE; Difficulty: L4; Story role: L4.
  #     placement: VERIFY, at price-history-board.
  - group: STATS
    at: price-history-board
    title: "Pass-through test"
    concept: 17   # CPI/supply
    reason: "The fuel shock is identified and its direct effect on the household basket needs a prediction."
    scene: "The basket gives fuel a 20% weight, and fuel prices are predicted to rise 12% while all other basket prices stay fixed. The consumer price index (CPI) tracks the cost of the fixed household basket, and fuel carries 20% of its weight. Predict the direct CPI effect of a 12% fuel-price increase before revealing the updated basket."
    motivation: "The weighted price effect separates fuel's direct contribution from any wider changes in the inflation rate."
    format: VERIFY
    question: "**CALCULATE AND COMMIT:** Use direct CPI effect=price change×basket weight with 12% and 20% and submit the effect in percentage points."
    answerText: "\"The direct basket effect is 2.4%; restoration returns baseline.\""
    why: "A bounded relative-price shock should not be mistaken for unlimited inflation."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. A bounded relative-price shock should not be mistaken for unlimited inflation.
    # correct result: The direct CPI effect is 2.4 percentage points; returning fuel to baseline returns the direct effect to zero.
    # state/output: Record the result and unlock the next named stop.
    # CONVERTED. The bible's payload was:
    #   verify:{prediction:{equation:"direct CPI effect=fuel weight×fuel price change",inputs:{weight:0.20,price_change:12,unit:"percent"},correct:2.4,tolerance:0.05,submit_unit:"percentage points"},lock:"basket reveal stays locked until 2.4 points is committed",action:"reveal first-week basket with other prices fixed",measurement:{CPI_change:2.4,unit:"percentage points"},restore:{fuel_price_change:0,CPI_change:0,remeasure:true},correct_conclusion:"bounded relative-price shock"}
    # MODEL CONVERSION, as at stops 29 and 46. The bible states one correct
    # prediction with a tolerance; the engine dials a prediction on a range and then
    # compares it against what the measurement finds.
    #   · `truth` is the bible's `correct`, 2.4 percentage points, and its own
    #     measurement finds the same 2.4
    #   · `passRatio` is the bible's own tolerance of 0.05 said as a ratio of 2.4:
    #     2.35/2.4 = 0.9792 and 2.45/2.4 = 1.0208
    #   · the dial runs 0 to 12 — no effect, up to the whole fuel price change the
    #     bible puts on the board — in steps of 0.1 point, wide enough that not
    #     every position passes
    relationship: "direct CPI effect = fuel weight × fuel price change, so 0.20 × 12%"
    verify:
      prediction:
        label: "Direct CPI effect"
        unit: "percentage points"
        min: 0
        max: 12
        step: 0.1
      truth: 2.4
      passRatio: [0.9792, 1.0208]
      intervention:
        label: "Reveal first-week basket with other prices fixed"
        note: "The basket reveal stays locked until 2.4 points is committed."
      measurement:
        label: "CPI change on the revealed basket"
      moral: "A bounded relative-price shock."
      commit: "Report the direct effect"

  # --- Stop 55: Full model stress
  #     Concept: integrated policy; Keystone: all keystones; Area: Rate Room; Learning role: TRANSFER; Difficulty: L5; Story role: L5.
  #     placement: STRESS, asked by Nia Corren beside forecast-table.
  - group: RATE
    at: forecast-table
    title: "Full model stress"
    person: corren
    concept: 24   # integrated policy
    reason: "The fuel estimate is ready and the full plan must withstand the combined disturbances."
    scene: "Because the direct price effect is bounded, stress delay, unconditional easing, and conversion-plus-cover across fuel shocks of 8%, 12%, and 16%. Submit the plan that preserves payments and limits the output loss."
    motivation: "The model stress test selects a response that keeps payments working while limiting the output loss."
    format: STRESS
    question: "Inspect three settings and submit one plan."
    answerText: "\"Proceed at 4.15 with temporary first-week cover.\""
    why: "Robust policy preserves the sound ratio while treating the separate real shock."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Robust policy preserves the sound ratio while treating the separate real shock.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Record the result and unlock the next named stop.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   range:8..16 step4; candidates:[delay,unconditional_ease,conversion_cover]; correct:conversion_cover.
    stress:
      candidates:
        - id: nominal_only
          label: Use only the nominal reading
        - id: common_extreme_mistake
          label: Use the favorable extreme as if it were guaranteed
        - id: robust_plan
          label: The keyed result shown by the completed interaction.
      criteria:
        - key: evidence_fit
          label: fit to the stop evidence
        - key: safety_margin
          label: margin at the adverse end
      scores:
        nominal_only:
          evidence_fit: 95
          safety_margin: 20
        common_extreme_mistake:
          evidence_fit: 88
          safety_margin: 5
        robust_plan:
          evidence_fit: 82
          safety_margin: 92
      feasible:
        nominal_only: 12
        common_extreme_mistake: 12
        robust_plan: 8
      assumption:
        label: conversion pressure
        unit: index points
        min: 8
        max: 16
        nominal: 12
        step: 4
      robust: robust_plan
      optimiseOn: evidence_fit

  # --- Stop 56: Write thresholds first
  #     Concept: conditional policy; Keystone: policy lag; Area: Rate Room; Learning role: COMBINE; Difficulty: L5; Story role: decision.
  #     placement: TRIGGER, at threshold-rail.
  - group: RATE
    at: threshold-rail
    title: "Write thresholds first"
    concept: 26   # conditional policy
    reason: "The robust plan is chosen, but emergency action still needs rules written before the first-week data arrive."
    scene: "The robust plan proceeds, but emergency bond buying must not activate from one noisy price print. Write output and payment thresholds before the sealed first-week update appears in the Rate Book."
    motivation: "Precommitted output and payment thresholds prevent a noisy price reading from triggering an improvised intervention."
    format: TRIGGER
    question: "Enter all three numeric thresholds, submit the rule, then reveal the sealed update; expected response is a trigger plan."
    answerText: "\"Proceed with cover; buy bonds only at the joint output/payment trigger and stop at the CPI limit.\""
    why: "Precommitment makes intervention reversible and evidence-based."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Precommitment makes intervention reversible and evidence-based.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Page 14; READINESS locks.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   rule:"Buy bonds only if real-output nowcast ≤680b AND payment failures ≥2%; stop if CPI companion ≥6.5%"; scale:{min:0,max:10,anchors:[680,2,6.5]}; objective:"protect output/payments"; direction:"buy bonds"; consequence_limit:"CPI 6.5".
    trigger:
      scale:
        label: payment-failure rate
        unit: "%"
        min: 0
        max: 10
        step: 0.25
        anchors:
          - at: 1.5
            means: routine baseline, not the decision threshold
          - at: 6.5
            means: elevated evidence requiring attention
      direction: rising
      conditions:
        - id: act
          label: Take the protective action
          leadHours: 12
          window:
            min: 2
            max: 10
      stream:
        - at: T-48 h
          value: 0.8
          hoursLeft: 48
        - at: T-24 h
          value: 1.4
          hoursLeft: 24
        - at: T-12 h
          value: 2
          hoursLeft: 12
        - at: T-6 h
          value: 2.6
          hoursLeft: 6

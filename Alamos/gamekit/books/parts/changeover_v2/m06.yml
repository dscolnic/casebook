# ============================================================ MISSION 6
# Split back out of books/changeover_v2.yml by tools/split-book.mjs; the book's text, verbatim.
# Lifted from ../fpl_gpt/CHANGEOVER_AP_MACRO_Campaign_Implementation_Bible(1).md by tools/v10extract.mjs. Every quoted string below is
# the bible's, verbatim; engine/dev/bibleParity.mjs holds it to that.
- title: "Two Shifts"
  card:
    header: "MISSION 6 - 10 DAYS UNTIL CHANGEOVER."
    title: "Two Shifts"
    goNow: "Go to PRICES and meet Lina Saye, price statistics lead, at the AD-AS wall."
    body: "10 days until changeover. Two red pins pull the wall's price and output tracks apart. Today you decide how policy should treat weak demand and dear fuel."
    objective: "Separate weak demand from cost-push inflation."
  objective: "Separate weak demand from cost-push inflation."
  stake: "10 days until changeover. Two red pins pull the wall's price and output tracks apart. Today you decide how policy should treat weak demand and dear fuel."
  takeaway: "Evidence must match the mechanism, units, and stated limits."
  segue: "But Tomas hears that returned banknotes mean money has vanished; the Note Hall must show where it went."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-prices
    # On arrival at PRICES | ad-as-wall | automatic
    on: { enter: true, at: PRICES }
    world: "Two red pins pull the wall's price and output tracks apart."
    panel: "Separate weak demand from cost-push inflation."
    # unlocks: Unlock Stop 21 at ad-as-wall in PRICES.
    bubbles:
    - who: saye   # Lina Saye
      say: "Start with why ad slopes down. We need evidence the next decision can use."
  - id: after-stop-21
    # After Stop 21 | ad-as-wall | automatic
    on: { after: [1] }
    world: "At ad-as-wall, the dated accepted-result slip for Stop 21 reads: \"The keyed result shown by the completed interaction.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 21 RECORDED - STOP 22 OPEN"
    # unlocks: Unlock Stop 22 at ad-as-wall in Statistics Floor.
    bubbles:
    - who: saye   # Lina Saye
      say: "Nice work. Lower prices raise real wealth, reduce money demand and interest, and can depreciate the currency, increasing C, I, and NX."
  - id: after-stop-22
    # After Stop 22 | gap-calculator | automatic
    on: { after: [2] }
    world: "At ad-as-wall, the dated accepted-result slip for Stop 22 reads: \"The keyed result shown by the completed interaction.\". The slip remains in that fixture's evidence holder."
    panel: "PRICES → RATE"
    # unlocks: Unlock Stop 23 at gap-calculator in Rate Room.
    bubbles:
    - who: saye   # Lina Saye
      say: "Good thinking. The imported-energy shock shifts SRAS left."
  - id: after-stop-23
    # After Stop 23 | ad-as-wall | automatic
    on: { after: [3] }
    world: "At gap-calculator, the dated accepted-result slip for Stop 23 reads: \"The keyed result shown by the completed interaction.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 23 RECORDED - STOP 24 OPEN"
    # unlocks: Unlock Stop 24 at ad-as-wall in PRICES.
    bubbles:
    - who: saye   # Lina Saye
      say: "Exactly right. Halvern has a recessionary gap plus an adverse supply shock."
  - id: at-mission-end
    # At mission end | ad-as-wall | automatic
    on: { missionEnd: true }
    world: "At ad-as-wall, Rhea Dane pins the separate demand and supply responses to the model wall. The dated prop remains here on later visits."
    panel: "MISSION 6 EVIDENCE: RECORDED"
    # unlocks: Open the mission outcome and metric screen.
    bubbles:
    - who: dane   # Rhea Dane
      say: "One lever cannot undo both shifts. But Tomas hears that returned banknotes mean money has vanished; the Note Hall must show where it went."

  terms:
  - {name: "Net exports (NX)", def: "exports minus imports."}
  - {name: "Aggregate demand (AD)", def: "consumption plus investment plus government purchases plus net exports (C+I+G+NX) at each price level."}
  - {name: "Short-run aggregate supply (SRAS)", def: "short-run production supplied at each price level."}
  - {name: "Stagflation", def: "higher prices with lower output."}
  # The optional review, offered when the mission is finished and graded
  # nowhere. GENERATED by tools/bible-deeper.mjs from the campaign bible.
  deeper:
    intro: "Try six independent practice questions. Each includes its own context and any needed data; no mission records are required."
    concepts:
    - {name: "Long-run aggregate supply (LRAS)", def: "full-employment output, vertical at Yf."}
    questions:
    - prompt: "Which statement best explains long-run aggregate supply (LRAS)?"
      hint: "Identify the defining relationship or mechanism for long-run aggregate supply (lras). All needed information is in this question."
      answer: "D"
      figure: {"kind":"line","xLabel":"Real output","yLabel":"Price level","caption":"Long-run aggregate supply at potential output.","series":[{"name":"LRAS","points":[[75,20],[75,100]]}]}
      options:
      - {key: "A", text: "Exports minus imports.", why: "This describes net exports (NX). It does not answer the question about long-run aggregate supply (lras)."}
      - {key: "B", text: "Consumption plus investment plus government purchases plus net exports (C+I+G+NX) at each price level.", why: "This describes aggregate demand (AD). It does not answer the question about long-run aggregate supply (lras)."}
      - {key: "C", text: "Short-run production supplied at each price level.", why: "This describes short-run aggregate supply (SRAS). It does not answer the question about long-run aggregate supply (lras)."}
      - {key: "D", text: "Full-employment output, vertical at Yf.", why: "Correct. Full-employment output, vertical at Yf."}
    - prompt: "Exports are 90 billion and imports are 110 billion currency units. What are net exports?"
      hint: "Identify the defining relationship or mechanism for net exports (nx). All needed information is in this question."
      answer: "A"
      figure: {"kind":"bars","xLabel":"Category","yLabel":"Billions of currency units","caption":"Trade during one year","bars":[{"name":"Exports","value":90},{"name":"Imports","value":110}]}
      options:
      - {key: "A", text: "-20 billion currency units.", why: "Correct. -20 billion currency units."}
      - {key: "B", text: "200 billion.", why: "Net exports subtract imports from exports; they do not add them."}
      - {key: "C", text: "20 billion.", why: "Imports exceed exports, so the balance is negative."}
      - {key: "D", text: "90 billion.", why: "This omits imports."}
    - prompt: "Which statement best explains aggregate demand (AD)?"
      hint: "Identify the defining relationship or mechanism for aggregate demand (ad). All needed information is in this question."
      answer: "B"
      figure: {"kind":"line","xLabel":"Real output","yLabel":"Price level","caption":"Aggregate demand slopes downward.","series":[{"name":"AD","points":[[20,95],[40,80],[60,64],[80,49],[100,35]]}]}
      options:
      - {key: "A", text: "Full-employment output, vertical at Yf.", why: "This describes long-run aggregate supply (LRAS). It does not answer the question about aggregate demand (ad)."}
      - {key: "B", text: "Consumption plus investment plus government purchases plus net exports (C+I+G+NX) at each price level.", why: "Correct. Consumption plus investment plus government purchases plus net exports (C+I+G+NX) at each price level."}
      - {key: "C", text: "Exports minus imports.", why: "This describes net exports (NX). It does not answer the question about aggregate demand (ad)."}
      - {key: "D", text: "Short-run production supplied at each price level.", why: "This describes short-run aggregate supply (SRAS). It does not answer the question about aggregate demand (ad)."}
    - prompt: "Which statement best explains short-run aggregate supply (SRAS)?"
      hint: "Identify the defining relationship or mechanism for short-run aggregate supply (sras). All needed information is in this question."
      answer: "C"
      figure: {"kind":"line","xLabel":"Real output","yLabel":"Price level","caption":"An adverse supply shock shifts short-run aggregate supply left.","series":[{"name":"Before","points":[[25,35],[45,48],[65,63],[85,82]]},{"name":"After shock","points":[[15,48],[35,61],[55,76],[75,95]]}]}
      options:
      - {key: "A", text: "Full-employment output, vertical at Yf.", why: "This describes long-run aggregate supply (LRAS). It does not answer the question about short-run aggregate supply (sras)."}
      - {key: "B", text: "Exports minus imports.", why: "This describes net exports (NX). It does not answer the question about short-run aggregate supply (sras)."}
      - {key: "C", text: "Short-run production supplied at each price level.", why: "Correct. Short-run production supplied at each price level."}
      - {key: "D", text: "Consumption plus investment plus government purchases plus net exports (C+I+G+NX) at each price level.", why: "This describes aggregate demand (AD). It does not answer the question about short-run aggregate supply (sras)."}
    - prompt: "Which statement best explains stagflation?"
      hint: "Identify the defining relationship or mechanism for stagflation. All needed information is in this question."
      answer: "D"
      figure: {"kind":"line","xLabel":"Real output","yLabel":"Price level","caption":"An adverse supply shock shifts short-run aggregate supply left.","series":[{"name":"Before","points":[[25,35],[45,48],[65,63],[85,82]]},{"name":"After shock","points":[[15,48],[35,61],[55,76],[75,95]]}]}
      options:
      - {key: "A", text: "Full-employment output, vertical at Yf.", why: "This describes long-run aggregate supply (LRAS). It does not answer the question about stagflation."}
      - {key: "B", text: "Exports minus imports.", why: "This describes net exports (NX). It does not answer the question about stagflation."}
      - {key: "C", text: "Consumption plus investment plus government purchases plus net exports (C+I+G+NX) at each price level.", why: "This describes aggregate demand (AD). It does not answer the question about stagflation."}
      - {key: "D", text: "Higher prices with lower output.", why: "Correct. Higher prices with lower output."}
    - prompt: "Which statement best explains the slope of aggregate demand?"
      hint: "Identify the defining relationship or mechanism for the slope of aggregate demand. All needed information is in this question."
      answer: "A"
      figure: {"kind":"line","xLabel":"Real output","yLabel":"Price level","caption":"Aggregate demand slopes downward.","series":[{"name":"AD","points":[[20,95],[40,80],[60,64],[80,49],[100,35]]}]}
      options:
      - {key: "A", text: "A price-level change moves along AD; spending conditions shift AD.", why: "Correct. A price-level change moves along AD; spending conditions shift AD."}
      - {key: "B", text: "Full-employment output, vertical at Yf.", why: "This describes long-run aggregate supply (LRAS). It does not answer the question about the slope of aggregate demand."}
      - {key: "C", text: "Exports minus imports.", why: "This describes net exports (NX). It does not answer the question about the slope of aggregate demand."}
      - {key: "D", text: "Consumption plus investment plus government purchases plus net exports (C+I+G+NX) at each price level.", why: "This describes aggregate demand (AD). It does not answer the question about the slope of aggregate demand."}

  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 6: worked examples"
    examples:
    - {"title":"Movement along aggregate demand","problem":"Only the price level falls; government purchases, taxes, and other demand determinants are unchanged. Is this a shift of aggregate demand?","rule":"A change in the vertical-axis price level produces movement along a given aggregate-demand curve.","steps":["The economy moves to a larger quantity of output demanded along that curve.","No independent demand determinant was changed to shift the curve itself."],"answer":"This is movement along aggregate demand.","mistake":"Do not draw a new curve solely because its own axis variable changed."}
    - {"title":"Identify a supply shock","problem":"Energy costs rise suddenly. Output falls while the price level rises. Which aggregate curve change fits?","rule":"Higher production costs shift short-run aggregate supply left, other things equal.","steps":["At a given price level, firms are willing to supply less.","The new intersection gives lower output and higher prices."],"answer":"A negative supply shock fits this combination, often called stagflation.","mistake":"A demand decrease alone would tend to lower both output and prices."}
    - {"title":"Predict a supply decrease","problem":"Production costs rise while consumer demand is unchanged. What happens to competitive equilibrium?","rule":"Higher production costs shift supply left, other things equal.","steps":["At the old price, sellers supply less, creating a shortage.","The new intersection has a higher price and lower quantity."],"answer":"Price rises and equilibrium quantity falls.","mistake":"A price rise caused by supply is not evidence that demand increased."}
    - {"title":"Measure an output gap","problem":"Actual real output is 95 billion and potential output is 100 billion. Find the signed gap and percent gap.","rule":"Gap=actual-potential; percent gap=gap/potential×100%.","steps":["Set up the relationship: Gap=actual-potential; percent gap=gap/potential×100%.","gap=95-100=-5 billion; percent gap=-5/100×100%=-5%."],"answer":"The economy has a recessionary gap of 5 billion, or 5% below potential.","mistake":"Potential output is the reference denominator."}
    - {"title":"Add final expenditures","problem":"An economy has consumption C=60, investment I=20, government purchases G=15, exports X=10 and imports M=5, all in billions. Find GDP.","rule":"Gross domestic product GDP=C+I+G+(X-M).","steps":["Set up the relationship: Gross domestic product GDP=C+I+G+(X-M).","net exports=10-5=5; GDP=60+20+15+5=100 billion."],"answer":"GDP is 100 billion.","mistake":"Imports are subtracted to remove foreign production already included in spending."}

  stops:
  # --- Stop 21: Why AD slopes down
  #     Concept: AD slope; Keystone: AD; Area: Rate Room; Learning role: INTRODUCE; Difficulty: L2; Story role: foundation.
  #     placement: CHOICE, asked by Lina Saye beside ad-as-wall.
  - group: RATE
    at: ad-as-wall
    title: "Why AD slopes down"
    person: saye
    concept: 13   # AD slope
    reason: "The policy wall needs a baseline price-level response before staff diagnose a new shock."
    scene: "The price level falls while taxes, government purchases, and foreign conditions stay fixed. Identify the three channels that increase quantity demanded before moving any curve on the policy wall today."
    motivation: "The demand channels explain movement along aggregate demand without inventing a shift in the curve."
    format: CHOICE
    question: "Select exactly one explanation from the four distinct choices below."
    figure: {"kind":"line","xLabel":"Real output","yLabel":"Price level","caption":"Aggregate demand slopes downward.","series":[{"name":"AD","points":[[20,95],[40,80],[60,64],[80,49],[100,35]]}]}
    choices:
    - "Wealth, interest-rate, and exchange-rate effects."
    - "Higher taxes."
    - "Higher productivity."
    - "Higher wages."
    answer: "Wealth, interest-rate, and exchange-rate effects."
    answerText: "\"Lower prices raise real wealth, reduce money demand and interest, and can depreciate the currency, increasing C, I, and NX.\""
    why: "A price-level change moves along AD; spending conditions shift AD."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2)
    # correct result: The keyed result shown by the completed interaction.
    # state/output: slope labels appear.
    # CONVERTED. The bible's payload was:
    #   choices:[{id:A,label:"wealth, interest-rate, and exchange-rate effects"},{id:B,label:"higher taxes"},{id:C,label:"higher productivity"},{id:D,label:"higher wages"}]; answer:A; rebuttals:{B:"Higher taxes shift AD left; they do not explain its downward slope.",C:"Higher productivity shifts aggregate supply; it does not create movement along AD.",D:"Higher wages change costs and SRAS; they are not one of the three AD slope effects."}.
    # The labels and the key are already in place above; the payload's keyed
    # rebuttals are what was still owed, verbatim, in the bible's B/C/D order.
    rebuttals:
    - "Higher taxes shift AD left; they do not explain its downward slope."
    - "Higher productivity shifts aggregate supply; it does not create movement along AD."
    - "Higher wages change costs and SRAS; they are not one of the three AD slope effects."

  # --- Stop 22: Diagnose the shock
  #     Concept: SRAS shifters; Keystone: AD-AS; Area: Rate Room; Learning role: COMBINE; Difficulty: L4; Story role: Twist 1.
  #     placement: DIAGNOSIS, at ad-as-wall.
  - group: RATE
    at: ad-as-wall
    title: "Diagnose the shock"
    concept: 14   # SRAS shifters
    reason: "New price and output readings have arrived and must be compared with the baseline model."
    scene: "With AD behavior fixed, the panel shows price level up, real output down, oil input cost up 18%, and government purchases unchanged. Select the curve change that fits every reading."
    motivation: "The selected curve shift determines whether the shock comes from demand or production costs."
    format: DIAGNOSIS
    question: "Select one diagnosis and submit the curve change: AD right, AD left, SRAS right, or SRAS left."
    figure: {"kind":"line","xLabel":"Real output","yLabel":"Price level","caption":"An adverse supply shock shifts short-run aggregate supply left.","series":[{"name":"Before","points":[[25,35],[45,48],[65,63],[85,82]]},{"name":"After shock","points":[[15,48],[35,61],[55,76],[75,95]]}]}
    answerText: "\"The imported-energy shock shifts SRAS left.\""
    why: "A leftward SRAS shift explains stagflation without inventing a demand boom."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. A leftward SRAS shift explains stagflation without inventing a demand boom.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: RATE unlocks.
    # CONVERTED. The bible's payload was:
    #   readings:[PL↑,Y↓,oil↑18%,G flat]; choices:[AD_right,AD_left,SRAS_right,SRAS_left]; answer:SRAS_left.
    # Two model conversions and no new content. Each reading is one string in the
    # bible and a zone plus a value in the engine, so each is split at its own
    # arrow or quantity. The four candidates are bare ids in the payload and are
    # spelled out on this stop's own prompt — "AD right, AD left, SRAS right, or
    # SRAS left" — so those are the labels, and the grade compares labels.
    readings:
    - { zone: "PL", value: "↑" }
    - { zone: "Y", value: "↓" }
    - { zone: "oil", value: "↑18%" }
    - { zone: "G", value: "flat" }
    choices:
    - "AD right"
    - "AD left"
    - "SRAS right"
    - "SRAS left"
    answer: "SRAS left"

  # --- Stop 23: Place both gaps
  #     Concept: equilibrium/gaps; Keystone: AD-AS; Area: Rate Room; Learning role: RETRIEVE; Difficulty: L4; Story role: synthesis.
  #     placement: BALANCE, at gap-calculator.
  - group: RATE
    at: gap-calculator
    title: "Place both gaps"
    concept: 12   # equilibrium/gaps
    reason: "The shock diagnosis must now be reconciled with the already measured output shortfall."
    scene: "Because SRAS moved left, current output is 685.2 while Yf remains 720.0 billion, and the price level is elevated. Close the model with one recessionary gap and one supply shock."
    motivation: "Locating both effects prevents a recessionary gap and a supply disturbance from being treated as the same problem."
    format: BALLPARK
    question: "Toggle relevant readings and submit the model conclusion."
    answerText: "\"Halvern has a recessionary gap plus an adverse supply shock.\""
    why: "One graph can show why lowering inflation and unemployment together is difficult."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. One graph can show why lowering inflation and unemployment together is difficult.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Record the result and unlock the next named stop.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   balance:{streams:[{id:"actual_output",value:685.2,unit:"billion RATE",counts:true},{id:"full_employment_output",value:720.0,unit:"billion RATE",counts:true},{id:"oil_cost_index",value:18,unit:"index points",counts:true},{id:"nominal_output",value:740,unit:"billion RATE",counts:false,reason:"price-level contaminated nominal measure"}],correct:{output_gap:-34.8,shock:"adverse supply shock"},answerText:"Real output is 34.8 billion below full employment while the oil-cost reading identifies an adverse supply shock; nominal output does not count in the real gap."}
    estimate:
      prompt: actual real output minus full-employment output
      question: signed real-output gap
      labels:
        - 685.2 billion RATE  (Actual real output)
        - 720 billion RATE  (Full-employment output)
        - 18 index points  (Oil-cost change)
      values:
        - 685.2
        - 720
        - 18
      slots: 1
      template: output gap={0}-720.0
      formula: output gap=685.2-720.0
      correct:
        - 0
      target: -34.8
      tolerance: 0.1
      units: billion RATE
      explanation: Mixing a contextual reading into the arithmetic or reversing the subtraction.

  # --- Stop 24: Aim fiscal policy
  #     Concept: fiscal dilemma; Keystone: fiscal/AD-AS; Area: Rate Room; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: STRESS, asked by Lina Saye beside ad-as-wall.
  - group: RATE
    at: ad-as-wall
    title: "Aim fiscal policy"
    person: saye
    concept: 24   # fiscal dilemma
    reason: "Weak demand and cost pressure coexist, so the proposed package needs testing across oil-price outcomes."
    scene: "The model now contains weak demand and cost-push inflation at once. Stress the 8.7-billion package across oil-cost changes from 0% through 18%, then submit the claim that survives every case."
    motivation: "The stress test identifies what fiscal expansion can support without promising to eliminate a supply-driven price rise."
    format: STRESS
    question: "Inspect all four settings and submit one surviving conclusion."
    answerText: "\"Use fiscal policy to close the demand gap, not to promise lower supply-driven prices.\""
    why: "Fiscal expansion raises AD; it does not shift damaged SRAS right."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Fiscal expansion raises AD; it does not shift damaged SRAS right.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Page 6 signed.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   assumption:oil shock 0..18 step6; candidates:[closes_demand_gap survives all,lowers_prices survives none,cures_supply survives none]; correct:closes_demand_gap.
    stress:
      candidates:
        - id: nominal_only
          label: Use only the nominal reading
        - id: common_extreme_mistake
          label: Use the favorable extreme as if it were guaranteed
        - id: robust_plan
          label: The keyed result shown by the completed interaction.
      criteria:
        - key: evidence_fit
          label: fit to the stop evidence
        - key: safety_margin
          label: margin at the adverse end
      scores:
        nominal_only:
          evidence_fit: 95
          safety_margin: 20
        common_extreme_mistake:
          evidence_fit: 88
          safety_margin: 5
        robust_plan:
          evidence_fit: 82
          safety_margin: 92
      feasible:
        nominal_only: 9
        common_extreme_mistake: 9
        robust_plan: 0
      assumption:
        label: oil shock
        unit: index points
        min: 0
        max: 18
        nominal: 9
        step: 6
      robust: robust_plan
      optimiseOn: evidence_fit

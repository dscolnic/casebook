  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 11: worked examples"
    examples:
    - {"title":"Measure a stabilizer effect","problem":"Market income falls 10 billion, taxes automatically fall 2 billion, and transfers rise 1 billion. Find the change in disposable income.","rule":"Disposable income change=market income change-tax change+transfer change.","steps":["Set up the relationship: Disposable income change=market income change-tax change+transfer change.","ΔYD=-10-(-2)+1=-7 billion."],"answer":"Disposable income falls 7 billion, less than the original 10-billion shock.","mistake":"A tax decrease is subtracted as a negative change."}
    - {"title":"Compare policy timing","problem":"A downturn requires action within two months; wage renegotiation occurs in six months. Can wage adjustment alone meet that deadline?","rule":"Distinguish eventual adjustment from the time needed to reach it.","steps":["six months > two months, so the stated wage adjustment occurs after the deadline.","A separate temporary measure would need its own effect, cost, and timing assessment."],"answer":"Wage adjustment alone does not meet the two-month target.","mistake":"A long-run prediction does not guarantee a short-run solution."}
    - {"title":"Calculate real growth","problem":"Real output rises from 100 to 105 billion. Find the growth rate.","rule":"Growth rate=(new-old)/old×100%.","steps":["Set up the relationship: Growth rate=(new-old)/old×100%.","growth=(105-100)/100×100%=5%."],"answer":"Real output grew 5%.","mistake":"Use the old value as the denominator."}
    - {"title":"Measure an output gap","problem":"Actual real output is 95 billion and potential output is 100 billion. Find the signed gap and percent gap.","rule":"Gap=actual-potential; percent gap=gap/potential×100%.","steps":["Set up the relationship: Gap=actual-potential; percent gap=gap/potential×100%.","gap=95-100=-5 billion; percent gap=-5/100×100%=-5%."],"answer":"The economy has a recessionary gap of 5 billion, or 5% below potential.","mistake":"Potential output is the reference denominator."}
    - {"title":"Protect a required reserve","problem":"A lab has 100 energy units. Essential tasks need 30 and 40 units, and reserve must be at least 20. How much remains for an optional task?","rule":"Optional capacity = total - essential use - protected reserve.","steps":["essential use = 30+40 = 70 units.","optional capacity = 100-70-20 = 10 units."],"answer":"At most 10 units may fund the optional task while preserving the reserve.","mistake":"Treating the reserve as freely available breaks the stated requirement."}

  stops:
  # --- Stop 41: Adjustment order
  #     Concept: self-correction; Keystone: AD-AS; Area: Rate Room; Learning role: INTRODUCE; Difficulty: L3; Story role: clue.
  #     placement: SEQUENCE, at queue-board.
  - group: RATE
    at: queue-board
    title: "Adjustment order"
    concept: 12   # self-correction
    reason: "Currency launch is five days away, while wage contracts reset much later."
    scene: "Wage contracts reset in six weeks, but conversion begins in five days. Order the recessionary self-correction chain and mark which step misses the deadline clearly in the Rate Book for review."
    motivation: "The adjustment sequence reveals whether self-correction can arrive in time to protect the launch."
    format: SEQUENCE
    question: "Order and mark."
    answerText: "\"Self-correction returns Y to Yf, but wage adjustment starts after launch.\""
    why: "A correct long-run mechanism can still be too slow for a short-run emergency."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. A correct long-run mechanism can still be too slow for a short-run emergency.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Record the result and unlock the next named stop.
    # CONVERTED. The bible's payload was:
    #   cards:[unemployment high,wage growth slows,input costs fall,SRAS right,Y returns Yf]; order:same; deadline_step:wage reset.
    # A rename and an index: "order:same" is the cards as written, which the engine
    # states as the permutation 0..4. Every card is the bible's own wording.
    # `deadline_step` has no home in SEQUENCE — the engine orders cards and does not
    # mark one of them — so the "mark which step misses the deadline" half of this
    # stop is not carried. Left to the bible rather than invented.
    cards:
    - "unemployment high"
    - "wage growth slows"
    - "input costs fall"
    - "SRAS right"
    - "Y returns Yf"
    order: [0, 1, 2, 3, 4]


  # --- Stop 44: Wait or bridge
  #     Concept: stabilization timing; Keystone: fiscal/growth; Area: Statistics Floor; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: VALUE, asked by Eli Voss beside allocation-slate.
  - group: STATS
    at: allocation-slate
    title: "Wait or bridge"
    person: voss
    concept: 26   # stabilization timing
    reason: "The timing and funding checks are complete and the board must choose the response's duration."
    scene: "Support is needed before wage adjustment can close the temporary gap. Eli needs an exit rule so a bridge does not become an indefinite commitment."
    motivation: "The choice determines whether support bridges the launch delay without becoming an unjustified permanent commitment."
    format: VALUE
    question: "You have 80 plan points. Cover every required outcome at the lowest total cost within the budget; keep all unused capacity in reserve. Select whole packages, then submit the plan; the board shows its total and remaining reserve for you to check."
    answerText: "Each funded package supplies a required outcome; an affordable package that leaves one unresolved is insufficient."
    why: "Temporary support can span a lag without becoming a permanent demand expansion."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Temporary support can span a lag without becoming a permanent demand expansion.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Page 11.
    # CONVERTED. The bible's payload was:
    #   value:{budget:80,options:[{id:"temporary_bridge",axis:"short-run demand support",cost:50,required:true},{id:"sunset_review",axis:"automatic exit discipline",cost:30,required:true},{id:"permanent_stimulus",axis:"permanent demand expansion",cost:80,required:false},{id:"wait",axis:"no immediate support",cost:0,required:false}],total_available_cost:160,correct_purchase:["temporary_bridge","sunset_review"],answerText:"Buy the temporary bridge and sunset review for 80; permanent stimulus outlasts the gap and waiting leaves the lag unaddressed."}
    # `budget` becomes `budget.amount`; `correct_purchase` — the same two ids the
    # bible marks `required` — is the engine's `decisive`. Each option is named only
    # by its `axis`, so that phrase carries as the label too. 50+30+80+0 = 160, the
    # bible's own `total_available_cost`, against 80; the two decisive ones cost 80.
    value:
      budget: { amount: 80 }
      options:
      - { id: temporary_bridge, label: "short-run demand support", axis: "short-run demand support", cost: 50, decisive: true }
      - { id: sunset_review, label: "automatic exit discipline", axis: "automatic exit discipline", cost: 30, decisive: true }
      - { id: permanent_stimulus, label: "permanent demand expansion", axis: "permanent demand expansion", cost: 80 }
      - { id: wait, label: "no immediate support", axis: "no immediate support", cost: 0 }

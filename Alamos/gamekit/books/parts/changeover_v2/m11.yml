- title: "Too Late By Itself"
  card:
    header: "MISSION 11 - 5 DAYS UNTIL CHANGEOVER."
    title: "Too Late by Itself"
    goNow: "Go to COUNTER and meet Eli Voss at the wage notices."
    body: "Five days remain. The wage deal will not change for six weeks. Today you decide which short-term help can arrive in time."
    objective: "Compare market adjustment with a temporary policy bridge."
  objective: "Compare market adjustment with a temporary policy bridge."
  stake: "Five days remain. The wage deal will not change for six weeks. Today you decide which short-term help can arrive in time."
  takeaway: "Evidence must match the mechanism, units, and stated limits."
  segue: "But Tomas's reserve clock exposes a timing condition for 4.15; the conversion must work at the hour cash is due."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-exchange-counter
    # On arrival at Exchange Counter | queue-board | automatic
    on: { enter: true, at: COUNTER }
    world: "A wage contract's six-week date extends past changeover day."
    panel: "Compare market adjustment with a temporary policy bridge."
    # unlocks: Unlock Stop 41 at queue-board in Exchange Counter.
    bubbles:
    - who: voss   # Eli Voss
      say: "Start with adjustment order. We need evidence the next decision can use."
  - id: after-stop-41
    # After Stop 41 | ad-as-wall | automatic
    on: { after: [1] }
    world: "At queue-board, the dated accepted-result slip for Stop 41 reads: \"The keyed result shown by the completed interaction.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 41 RECORDED - STOP 42 OPEN"
    # unlocks: Unlock Stop 42 at ad-as-wall in Statistics Floor.
    bubbles:
    - who: voss   # Eli Voss
      say: "Nice work. Self-correction returns Y to Yf, but wage adjustment starts after launch."
  - id: after-stop-42
    # After Stop 42 | forecast-table | automatic
    on: { after: [2] }
    world: "At ad-as-wall, the dated accepted-result slip for Stop 42 reads: \"−7b ±0.1.\". The slip remains in that fixture's evidence holder."
    panel: "COUNTER → PRICES → RATE"
    # unlocks: Unlock Stop 43 at forecast-table in Rate Room.
    bubbles:
    - who: voss   # Eli Voss
      say: "Good thinking. Automatic stabilizers shrink the loss from 10 to 7 billion."
  - id: after-stop-43
    # After Stop 43 | allocation-slate | automatic
    on: { after: [3] }
    world: "At forecast-table, the dated accepted-result slip for Stop 43 reads: \"Clearing, training, port repair and reserve funded within 100 points.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 43 RECORDED - STOP 44 OPEN"
    # unlocks: Unlock Stop 44 at allocation-slate in COUNTER.
    bubbles:
    - who: voss   # Eli Voss
      say: "Exactly right. Fund clearing, training, port repair, and reserve."
  - id: at-mission-end
    # At mission end | queue-board | automatic
    on: { missionEnd: true }
    world: "At threshold-rail, Rhea Dane clips the temporary bridge and expiry rule onto the threshold rail. The dated prop remains here on later visits."
    panel: "MISSION 11 EVIDENCE: RECORDED"
    # unlocks: Open the mission outcome and metric screen.
    bubbles:
    - who: dane   # Rhea Dane
      say: "Then write the end of the bridge before its first payment. But Tomas's reserve clock exposes a timing condition for 4.15; the conversion must work at the hour cash is due."


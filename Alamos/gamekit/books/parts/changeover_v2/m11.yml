  #     Concept: growth resources; Keystone: growth; Area: Statistics Floor; Learning role: COMBINE; Difficulty: L5; Story role: decision input.
  #     placement: ALLOCATE, at forecast-table.
  - group: STATS
    at: forecast-table
    title: "Protect growth engines"
    concept: 15   # growth resources
    reason: "Stabilizers reduce the immediate shock, leaving a limited fund for the temporary response."
    scene: "The temporary response still needs payments to clear while people and the port recover capacity. The fund cannot cover every proposal."
    motivation: "The allocation protects household clearing while retaining training and port capacity needed for future output."
    format: ALLOCATE
    question: "You have 100 bridge-fund points. Cover every required outcome and allocate the whole budget. Select whole packages, then submit the plan; the board shows its total and remaining reserve for you to check."
    answerText: "Each funded package supplies a required outcome; an affordable package that leaves one unresolved is insufficient."
    why: "Human capital, physical capital, and technology shift productive capacity; publicity does not."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Human capital, physical capital, and technology shift productive capacity; publicity does not.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Record the result and unlock the next named stop.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   allocate:{pool:100,items:[{id:"clearing",label:"payment clearing",cost:30,required:true},{id:"training",label:"worker training",cost:25,required:true},{id:"port",label:"port repair",cost:25,required:true},{id:"reserve",label:"protected contingency reserve",cost:20,required:true,protected:true},{id:"publicity",label:"confidence publicity",cost:20,required:false}],questions:[{id:"payments",text:"Does the plan keep clearing operational?",required:true},{id:"growth",text:"Does it fund training and port capacity?",required:true},{id:"reserve",text:"Does it preserve the restart reserve?",required:true}],correct_allocation:{clearing:30,training:25,port:25,reserve:20},answerText:"Spend all 100 on clearing, training, port repair, and the protected reserve; publicity would crowd out a required growth or safety item."}

  stops:
  # --- Stop 37: Move or shift
  #     Concept: Phillips curves; Keystone: long-run consequences; Area: Statistics Floor; Learning role: INTRODUCE; Difficulty: L2; Story role: foundation.
  #     placement: CHOICE, asked by Mara Venn beside policy-wall.
  - group: STATS
    at: policy-wall
    title: "Move or shift"
    person: venn
    concept: 27   # Phillips curves
    reason: "The latest inflation and unemployment pattern must be explained before demand is blamed again."
    scene: "Identify the change that fits this pattern before blaming excess demand today."
    motivation: "Distinguishing a movement from a shifted relationship identifies whether the observed tradeoff itself has changed."
    format: CHOICE
    question: "Select exactly one change from the four distinct choices below."
    figure: {"kind":"line","xLabel":"Quantity of RATE","yLabel":"Crowns per RATE","caption":"A change in foreign demand shifts the currency-demand curve.","series":[{"name":"Demand before","points":[[20,7],[40,5.5],[60,4],[80,2.5]]},{"name":"Demand after","points":[[35,7],[55,5.5],[75,4],[95,2.5]]}]}
    choices:
    - "Move upward along the existing SRPC."
    - "Move downward along the existing SRPC."
    - "Shift the SRPC right."
    - "Shift the LRPC left."
    answer: "Shift the SRPC right."
    answerText: "\"The supply shock shifts SRPC right.\""
    why: "Adverse supply shifts SRPC right; AD changes move along it."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (1)
    # correct result: The keyed result shown by the completed interaction.

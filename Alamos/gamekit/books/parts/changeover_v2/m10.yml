    motivation: "The quantity-theory estimate relates money and real-output growth to the inflation rate the board should expect."
    format: DERIVE
    question: "Submit the long-run inflation estimate."
    answerText: "\"Estimated long-run inflation is 2%, far below the temporary 5.88% basket print.\""
    why: "Money growth above real growth sets long-run inflation when velocity is stable."
    # wrong-path feedback, one rebuttal per wrong option:

- title: "The Temporary Tradeoff"
  card:
    header: "MISSION 10 - 6 DAYS UNTIL CHANGEOVER."
    title: "The Temporary Tradeoff"
    goNow: "Go to RATE and meet Mara Venn at the Phillips wall."
    body: "6 days until changeover. The long money-growth strip lies beneath today's fuel alert. Today you decide whether a short price shock warrants tighter policy."
    objective: "Separate a short-run shock from long-run inflation policy."
  objective: "Separate a short-run shock from long-run inflation policy."
  stake: "6 days until changeover. The long money-growth strip lies beneath today's fuel alert. Today you decide whether a short price shock warrants tighter policy."
  takeaway: "Evidence must match the mechanism, units, and stated limits."
  segue: "But Eli's wage contracts cannot reset for six weeks; self-correction may arrive after the families need help."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-rate
    # On arrival at RATE | policy-wall | automatic
    on: { enter: true, at: RATE }
    world: "The long money-growth strip lies beneath today's fuel alert."
    panel: "Separate a short-run shock from long-run inflation policy."
    # unlocks: Unlock Stop 37 at policy-wall in RATE.
    bubbles:
    - who: venn   # Mara Venn
      say: "Start with move or shift. We need evidence the next decision can use."
  - id: after-stop-37
    # After Stop 37 | gap-calculator | automatic
    on: { after: [1] }
    world: "At policy-wall, the dated accepted-result slip for Stop 37 reads: \"The keyed result shown by the completed interaction.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 37 RECORDED - STOP 38 OPEN"
    # unlocks: Unlock Stop 38 at gap-calculator in Rate Room.
    bubbles:
    - who: venn   # Mara Venn
      say: "Nice work. The supply shock shifts SRPC right."
  - id: after-stop-38
    # After Stop 38 | price-history-board | automatic
    on: { after: [2] }
    world: "At gap-calculator, the dated accepted-result slip for Stop 38 reads: \"The quantity equation gives estimated long-run inflation of 2%.\". The slip remains in that fixture's evidence holder."
    panel: "RATE → PRICES"
    # unlocks: Unlock Stop 39 at price-history-board in Statistics Floor.
    bubbles:
    - who: venn   # Mara Venn
      say: "Good thinking. Estimated long-run inflation is 2%, far below the temporary 5.88% basket print."
  - id: after-stop-39
    # After Stop 39 | forecast-table | automatic
    on: { after: [3] }
    world: "At price-history-board, the dated accepted-result slip for Stop 39 reads: \"The temporary model has lower held-out forecast error.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 39 RECORDED - STOP 40 OPEN"
    # unlocks: Unlock Stop 40 at forecast-table in RATE.
    bubbles:
    - who: venn   # Mara Venn
      say: "Exactly right. The temporary-supply model predicts the holdout; persistent monetary inflation does not."
  - id: at-mission-end
    # At mission end | policy-wall | automatic
    on: { missionEnd: true }
    world: "At price-history-board, Lina Saye pins the 2% LONG-RUN INFLATION estimate beside the shock record. The dated prop remains here on later visits."
    panel: "MISSION 10 EVIDENCE: RECORDED"
    # unlocks: Open the mission outcome and metric screen.
    bubbles:
    - who: saye   # Lina Saye
      say: "A sharp rise today does not draw the whole future line. But Eli's wage contracts cannot reset for six weeks; self-correction may arrive after the families need help."

  terms:
  - {name: "Short-run Phillips curve (SRPC)", def: "short-run inverse inflation-unemployment relation."}
  - {name: "Long-run Phillips curve (LRPC)", def: "vertical curve at the natural rate."}
  - {name: "Money neutrality", def: "long-run money changes alter prices, not real output."}
  - {name: "Quantity theory of money", def: "the relation M×V=P×Y, which connects the money supply and velocity to the price level and real output."}

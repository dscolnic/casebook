  # --- Stop 39: Test unseen prices
  #     Concept: temporary vs persistent inflation; Keystone: evidence; Area: Statistics Floor; Learning role: RETRIEVE; Difficulty: L4; Story role: evidence.
  #     placement: HOLDOUT, at price-history-board.
  - group: STATS
    at: price-history-board
    title: "Test unseen prices"
    concept: 8   # temporary vs persistent inflation
    reason: "Two price models fit the visible months and need a test they have not already seen."
    scene: "Both inflation models have fixed forecasts for the next two months. Freeze them before opening the withheld readings."
    motivation: "Frozen predictions allow the later months to distinguish forecasting performance from fitting past observations."
    format: HOLDOUT
    question: "Commit the supplied forecasts, reveal months five and six, then select the model with smaller mean absolute error. Forecast accuracy alone does not prove the cause of inflation."
    answerText: "The temporary model predicts the withheld observations more closely. Retain it provisionally; this two-observation comparison is not a causal proof."
    why: "Unseen normalization can reject a permanent-inflation story."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Unseen normalization can reject a permanent-inflation story.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Record the result and unlock the next named stop.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   train:[2.0,2.1,5.9,5.2]; models:[persistent5.5,temporary_to2]; holdout:[3.2,2.4]; correct:temporary_to2.
    holdout:
      axis:
        label: allowed monthly inflation prediction error
        min: 0
        max: 2
        step: 0.5
        unit: percentage points
      fit:
        - at: 0
          value: 0.55
        - at: 0.5
          value: 0.98
        - at: 1
          value: 0.84
        - at: 1.5
          value: 0.87
        - at: 2
          value: 0.83
      test:
        - at: 0
          value: 0.38
        - at: 0.5
          value: 0.44
        - at: 1
          value: 0.76
        - at: 1.5
          value: 0.86
        - at: 2
          value: 0.84
      overfitAt: 0.5
      correctAt: 1.5
      models:
        - id: persistent
          prediction: 5.5
          unit: "%"
        - id: temporary_supply
          prediction: 2
          unit: "%"
      heldOutReadings:
        - 3.2
        - 2.4
      correctChoice: temporary_supply
      correctConclusion: The temporary-supply model predicts the decline toward 2%; the persistent 5.5% model does not.
      pass: 0.8

  # --- Stop 40: Tighten forever
  #     Concept: policy horizon; Keystone: Phillips/neutrality; Area: Statistics Floor; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: STRESS, asked by Mara Venn beside forecast-table.
  - group: STATS
    at: forecast-table
    title: "Tighten forever"
    person: venn
    concept: 25   # policy horizon
    reason: "The unseen-price test is complete, but a permanent tightening commitment still faces uncertainty."
    scene: "The withheld prices favor a temporary shock, while inflation expectations remain uncertain. The board's policy requires review before making a permanent commitment."
    motivation: "Comparing permanent and conditional responses shows which policy remains justified across the tested inflation range."
    format: STRESS
    question: "Inspect expectations from 1.8% to 2.4% in 0.2-point steps. Choose the plan that keeps monitoring active, permits reversal and does not claim that these expectations establish a permanent inflation shock."
    answerText: "A monitored conditional stance meets all three published requirements throughout the stated expectations range. This is a decision under the board's policy, not an unstated numerical welfare optimum."
    why: "Long-run neutrality does not make short-run output losses disappear."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Long-run neutrality does not make short-run output losses disappear.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Page 10 signed.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   range:1.8..2.4 step.2; candidates:[permanent tighten,ignore,conditional]; correct:conditional.
    stress:
      candidates:
        - id: nominal_only
          label: Use only the nominal reading
        - id: common_extreme_mistake
          label: Use the favorable extreme as if it were guaranteed
        - id: robust_plan
          label: The keyed result shown by the completed interaction.
      criteria:
        - key: evidence_fit
          label: fit to the stop evidence
        - key: safety_margin
          label: margin at the adverse end
      scores:
        nominal_only:
          evidence_fit: 95
          safety_margin: 20
        common_extreme_mistake:
          evidence_fit: 88
          safety_margin: 5
        robust_plan:
          evidence_fit: 82
          safety_margin: 92
      feasible:
        nominal_only: 2.1
        common_extreme_mistake: 2.1
        robust_plan: 1.8
      assumption:
        label: inflation persistence
        unit: years
        min: 1.8
        max: 2.4
        nominal: 2.1
        step: 0.2
      robust: robust_plan
      optimiseOn: evidence_fit

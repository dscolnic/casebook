- title: "Jobs Behind The Number"
  card:
    header: "MISSION 4 - 12 DAYS UNTIL CHANGEOVER."
    title: "Jobs Behind the Number"
    goNow: "Go to COUNTER and meet Eli Voss, counter operations lead, at the labor board."
    body: "12 days until changeover. A job notice curls over an empty search card. Today you decide whether the job figures call for action."
    objective: "Diagnose labor-market weakness without losing excluded workers."
  objective: "Diagnose labor-market weakness without losing excluded workers."
  stake: "12 days until changeover. A job notice curls over an empty search card. Today you decide whether the job figures call for action."
  takeaway: "Evidence must match the mechanism, units, and stated limits."
  segue: "Therefore Rhea must price a spending plan for the 34.8-billion gap; calling this normal churn costs jobs."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-counter
    # On arrival at COUNTER | wage-notice-rail | automatic
    on: { enter: true, at: COUNTER }
    world: "A job notice curls over an empty search card."
    panel: "Diagnose labor-market weakness without losing excluded workers."
    # unlocks: Unlock Stop 13 at wage-notice-rail in COUNTER.
    bubbles:
    - who: voss   # Eli Voss
      say: "Start with rebuild the denominator. We need evidence the next decision can use."
  - id: after-stop-13
    # After Stop 13 | queue-board | automatic
    on: { after: [1] }
    world: "At wage-notice-rail, the dated accepted-result slip for Stop 13 reads: \"LF 10.0m and 8.0%, ±0.1.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 13 RECORDED - STOP 14 OPEN"
    # unlocks: Unlock Stop 14 at queue-board in COUNTER.
    bubbles:
    - who: voss   # Eli Voss
      say: "Nice work. The labor force is 10.0 million and unemployment is 8.0%; 0.5 million discouraged workers remain outside."
  - id: after-stop-14
    # After Stop 14 | allocation-slate | automatic
    on: { after: [2] }
    world: "At queue-board, the dated accepted-result slip for Stop 14 reads: \"The keyed result shown by the completed interaction.\". The slip remains in that fixture's evidence holder."
    panel: "COUNTER"
    # unlocks: Unlock Stop 15 at allocation-slate in COUNTER.
    bubbles:
    - who: voss   # Eli Voss
      say: "Good thinking. Frictional and structural form the natural rate; recession layoffs are cyclical."
  - id: after-stop-15
    # After Stop 15 | wage-notice-rail | automatic
    on: { after: [3] }
    world: "At allocation-slate, the dated accepted-result slip for Stop 15 reads: \"−34.8 billion, recessionary, ±0.1.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 15 RECORDED - STOP 16 OPEN"
    # unlocks: Unlock Stop 16 at wage-notice-rail in COUNTER.
    bubbles:
    - who: voss   # Eli Voss
      say: "Exactly right. Halvern has a 34.8-billion recessionary gap."
  - id: at-mission-end
    # At mission end | wage-notice-rail | automatic
    on: { missionEnd: true }
    world: "At wage-notice-rail, Eli Voss clips the participation warning to the wage rail. The dated prop remains here on later visits."
    panel: "MISSION 4 EVIDENCE: RECORDED"
    # unlocks: Open the mission outcome and metric screen.
    bubbles:
    - who: voss   # Eli Voss
      say: "That blank card is a person the rate stopped counting. Therefore Rhea must price a spending plan for the 34.8-billion gap; calling this normal churn costs jobs."

  terms:
  - {name: "Labor force", def: "employed people plus unemployed people actively seeking work."}
  - {name: "Discouraged worker", def: "a person who wants work but stopped searching and is outside the labor force."}
  - {name: "Natural unemployment", def: "frictional plus structural unemployment."}
  - {name: "Recessionary gap", def: "real output below full-employment output."}
  # The optional review, offered when the mission is finished and graded
  # nowhere. GENERATED by tools/bible-deeper.mjs from the campaign bible.
  deeper:
    intro: "Try six independent practice questions. Each includes its own context and any needed data; no mission records are required."
    questions:
    - prompt: "Which statement best explains labor force?"
      hint: "Identify the defining relationship or mechanism for labor force. All needed information is in this question."
      answer: "D"
      options:
      - {key: "A", text: "A person who wants work but stopped searching and is outside the labor force.", why: "This describes discouraged worker. It does not answer the question about labor force."}
      - {key: "B", text: "Frictional plus structural unemployment.", why: "This describes natural unemployment. It does not answer the question about labor force."}
      - {key: "C", text: "Real output below full-employment output.", why: "This describes recessionary gap. It does not answer the question about labor force."}
      - {key: "D", text: "Employed people plus unemployed people actively seeking work.", why: "Correct. Employed people plus unemployed people actively seeking work."}
    - prompt: "Which statement best explains discouraged worker?"
      hint: "Identify the defining relationship or mechanism for discouraged worker. All needed information is in this question."
      answer: "A"
      options:
      - {key: "A", text: "A person who wants work but stopped searching and is outside the labor force.", why: "Correct. A person who wants work but stopped searching and is outside the labor force."}
      - {key: "B", text: "Employed people plus unemployed people actively seeking work.", why: "This describes labor force. It does not answer the question about discouraged worker."}
      - {key: "C", text: "Frictional plus structural unemployment.", why: "This describes natural unemployment. It does not answer the question about discouraged worker."}
      - {key: "D", text: "Real output below full-employment output.", why: "This describes recessionary gap. It does not answer the question about discouraged worker."}
    - prompt: "Which statement best explains natural unemployment?"
      hint: "Identify the defining relationship or mechanism for natural unemployment. All needed information is in this question."
      answer: "B"
      options:
      - {key: "A", text: "Employed people plus unemployed people actively seeking work.", why: "This describes labor force. It does not answer the question about natural unemployment."}
      - {key: "B", text: "Frictional plus structural unemployment.", why: "Correct. Frictional plus structural unemployment."}
      - {key: "C", text: "A person who wants work but stopped searching and is outside the labor force.", why: "This describes discouraged worker. It does not answer the question about natural unemployment."}
      - {key: "D", text: "Real output below full-employment output.", why: "This describes recessionary gap. It does not answer the question about natural unemployment."}
    - prompt: "Which statement best explains recessionary gap?"
      hint: "Identify the defining relationship or mechanism for recessionary gap. All needed information is in this question."
      answer: "C"
      options:
      - {key: "A", text: "Employed people plus unemployed people actively seeking work.", why: "This describes labor force. It does not answer the question about recessionary gap."}
      - {key: "B", text: "A person who wants work but stopped searching and is outside the labor force.", why: "This describes discouraged worker. It does not answer the question about recessionary gap."}
      - {key: "C", text: "Real output below full-employment output.", why: "Correct. Real output below full-employment output."}
      - {key: "D", text: "Frictional plus structural unemployment.", why: "This describes natural unemployment. It does not answer the question about recessionary gap."}
    - prompt: "Which statement best explains unemployment rate?"
      hint: "Identify the defining relationship or mechanism for unemployment rate. All needed information is in this question."
      answer: "D"

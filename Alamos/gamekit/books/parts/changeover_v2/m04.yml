      - {key: "A", text: "Employed people plus unemployed people actively seeking work.", why: "This describes labor force. It does not answer the question about unemployment rate."}
      - {key: "B", text: "A person who wants work but stopped searching and is outside the labor force.", why: "This describes discouraged worker. It does not answer the question about unemployment rate."}
      - {key: "C", text: "Frictional plus structural unemployment.", why: "This describes natural unemployment. It does not answer the question about unemployment rate."}
      - {key: "D", text: "Excluding discouraged workers follows the definition but can hide worsening conditions when read alone.", why: "Correct. Excluding discouraged workers follows the definition but can hide worsening conditions when read alone."}
    - prompt: "Which statement best explains unemployment types?"
      hint: "Identify the defining relationship or mechanism for unemployment types. All needed information is in this question."
      answer: "A"
      options:
      - {key: "A", text: "Only cyclical unemployment signals output below its demand-supported potential.", why: "Correct. Only cyclical unemployment signals output below its demand-supported potential."}
      - {key: "B", text: "Employed people plus unemployed people actively seeking work.", why: "This describes labor force. It does not answer the question about unemployment types."}
      - {key: "C", text: "A person who wants work but stopped searching and is outside the labor force.", why: "This describes discouraged worker. It does not answer the question about unemployment types."}
      - {key: "D", text: "Frictional plus structural unemployment.", why: "This describes natural unemployment. It does not answer the question about unemployment types."}

  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 4: worked examples"
    examples:
    - {"title":"Calculate unemployment","problem":"There are 90 employed people, 10 active job seekers, and 5 people who stopped looking. Find the official unemployment rate.","rule":"Labor force=employed+active unemployed; unemployment rate=active unemployed/labor force.","steps":["Set up the relationship: Labor force=employed+active unemployed; unemployment rate=active unemployed/labor force.","labor force=90+10=100; rate=10/100=10%."],"answer":"The unemployment rate is 10%; the five discouraged workers are outside this denominator.","mistake":"People who stopped looking still matter, but are not counted as active unemployed."}
    - {"title":"Find labor-force participation","problem":"A working-age population has 200 people and a labor force of 120. Find participation.","rule":"Participation rate=labor force/working-age population×100%.","steps":["Set up the relationship: Participation rate=labor force/working-age population×100%.","participation=120/200×100%=60%."],"answer":"Sixty percent are working or actively seeking work.","mistake":"Participation and unemployment use different denominators."}
    - {"title":"Measure an output gap","problem":"Actual real output is 95 billion and potential output is 100 billion. Find the signed gap and percent gap.","rule":"Gap=actual-potential; percent gap=gap/potential×100%.","steps":["Set up the relationship: Gap=actual-potential; percent gap=gap/potential×100%.","gap=95-100=-5 billion; percent gap=-5/100×100%=-5%."],"answer":"The economy has a recessionary gap of 5 billion, or 5% below potential.","mistake":"Potential output is the reference denominator."}
    - {"title":"Separate unemployment causes","problem":"One person is searching between jobs; another lost work because a skill became obsolete; a third was laid off when total spending fell. Classify them.","rule":"Frictional means job search; structural means mismatch; cyclical means weak aggregate demand.","steps":["The job search is frictional; the obsolete skill is structural.","The spending-related layoff is cyclical."],"answer":"Only the third is directly explained by the downturn in overall demand.","mistake":"Full employment does not mean zero frictional or structural unemployment."}
    - {"title":"Calculate real growth","problem":"Real output rises from 100 to 105 billion. Find the growth rate.","rule":"Growth rate=(new-old)/old×100%.","steps":["Set up the relationship: Growth rate=(new-old)/old×100%.","growth=(105-100)/100×100%=5%."],"answer":"Real output grew 5%.","mistake":"Use the old value as the denominator."}

  stops:
  # --- Stop 13: Rebuild the denominator
  #     Concept: unemployment rate; Keystone: labor/output gap; Area: Statistics Floor; Learning role: INTRODUCE; Difficulty: L2; Story role: clue.
  #     placement: DERIVE, at wage-notice-rail.
  - group: STATS
    at: wage-notice-rail
    title: "Rebuild the denominator"
    concept: 10   # unemployment rate
    reason: "The employment report mixes active job seekers with people who have stopped looking."
    scene: "Halvern has 9.2 million employed people, 0.8 million active job seekers, and 0.5 million discouraged workers. Build the labor force and unemployment rate before comparing this month with the prior report."
    motivation: "The labor-force denominator determines the official unemployment rate and makes the excluded group visible."
    format: DERIVE
    question: "Submit unemployment rate using active seekers only."
    answerText: "The labor force is 10.0 million and unemployment is 8.0%; 0.5 million discouraged workers remain outside."
    why: "Excluding discouraged workers follows the definition but can hide worsening conditions when read alone."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Excluding discouraged workers follows the definition but can hide worsening conditions when read alone.
    # correct result: LF 10.0m and 8.0%, ±0.1. **answerText:** "The labor force is 10.0 million and unemployment is 8.0%; 0.5 million discouraged workers remain outside."
    # state/output: S2.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{lines:["LF=9.2+0.8=10.0 million","u=0.8/10.0×100%","u=8.0%"],licenses:["labor-force definition","rate definition","evaluation"],correct_order:[1,2,3]}
    derive:
      start: Begin with the complete starting relation on the card. Preserve its named left side on every line.
      goal: Rebuild the denominator in the form and units requested by the prompt
      steps:
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: LF=9.2+0.8=10.0 million
            - text: LF=9.2 million employed only
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: u=0.8/10.0×100%
            - text: u=0.8/9.2×100%
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: u=8.0%
            - text: u=0.08%
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true

  # --- Stop 14: Name the causes
  #     Concept: unemployment types; Keystone: labor gap; Area: Statistics Floor; Learning role: PRACTICE; Difficulty: L2; Story role: character.
  #     placement: CHOICE, asked by Eli Voss beside queue-board.
  - group: STATS
    at: queue-board
    title: "Name the causes"
    person: voss
    concept: 11   # unemployment types
    reason: "The unemployment rate is established, but the records point to several different causes."
    scene: "With unemployment at 8.0%, records show short job searches, obsolete dock skills, and layoffs from falling orders. Select the statement that correctly separates natural unemployment from the part caused by weak demand."
    motivation: "Separating search, skill mismatch, and demand-related layoffs determines which unemployment policy could address."
    format: CHOICE
    question: "Select one submitted conclusion from the four distinct choices below."
    choices:
    - "All three types are natural."
    - "Frictional and structural unemployment are natural; layoffs from falling demand are cyclical."
    - "Structural unemployment is cyclical."
    - "Full employment means zero unemployment."
    answer: "Frictional and structural unemployment are natural; layoffs from falling demand are cyclical."
    answerText: "Frictional and structural form the natural rate; recession layoffs are cyclical."
    why: "Only cyclical unemployment signals output below its demand-supported potential."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (1)
    # correct result: The keyed result shown by the completed interaction.
    # state/output: S3.
    # CONVERTED. The bible's payload was:
    #   choices:[{id:A,label:"All three types are natural"},{id:B,label:"Frictional and structural are natural; demand layoffs are cyclical"},{id:C,label:"Structural unemployment is cyclical"},{id:D,label:"Full employment means zero unemployment"}]; answer:B; rebuttals:{A:"Layoffs caused by weak aggregate demand are cyclical, not natural.",C:"A skill mismatch is structural unemployment, which belongs to the natural rate.",D:"Frictional and structural unemployment remain even at full employment."} **answerText:** "Frictional and structural form the natural rate; recession layoffs are cyclical."
    # The four labels and the key are already in place above; the payload's keyed
    # rebuttals are what was still owed, verbatim, in the bible's A/C/D order.
    rebuttals:
    - "Layoffs caused by weak aggregate demand are cyclical, not natural."
    - "A skill mismatch is structural unemployment, which belongs to the natural rate."
    - "Frictional and structural unemployment remain even at full employment."

  # --- Stop 15: Place the output gap
  #     Concept: output gap; Keystone: labor/GDP; Area: Statistics Floor; Learning role: COMBINE; Difficulty: L3; Story role: reversal.
  #     placement: DERIVE, at allocation-slate.
  - group: STATS
    at: allocation-slate
    title: "Place the output gap"
    concept: 12   # output gap
    reason: "The labor evidence suggests weak demand and now needs an output comparison."
    scene: "Because layoffs are cyclical, compare actual real GDP of 685.2 billion with full-employment output of 720.0 billion base-year crowns. Calculate the signed gap and label its type before policy staff move upstairs."
    motivation: "The signed output gap measures the shortfall from potential production used to size a response."
    format: DERIVE
    question: "Submit billion crowns and label."
    answerText: "Halvern has a 34.8-billion recessionary gap."
    why: "A negative actual-minus-potential gap connects weak demand to excess unemployment."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. A negative actual-minus-potential gap connects weak demand to excess unemployment.
    # correct result: −34.8 billion, recessionary, ±0.1. **answerText:** "Halvern has a 34.8-billion recessionary gap."
    # state/output: S4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{lines:["gap=685.2−720.0","gap=−34.8 billion","negative ⇒ recessionary"],licenses:["definition","arithmetic","Y<Yf rule"],correct_order:[1,2,3]}
    derive:
      start: Begin with the complete starting relation on the card. Preserve its named left side on every line.
      goal: Place the output gap in the form and units requested by the prompt
      steps:
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: gap=685.2−720.0
            - text: gap=720.0−685.2
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: gap=−34.8 billion
            - text: gap=+34.8 billion
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: gap classification=recessionary because gap<0
            - text: gap classification=inflationary even though gap<0
              why: "This common mistake reverses the labels: actual output below potential is a recessionary gap, not an inflationary gap."
              survives: true

  # --- Stop 16: Transition or warning
  #     Concept: business cycle diagnosis; Keystone: labor/GDP/inflation; Area: Statistics Floor; Learning role: TRANSFER; Difficulty: L4; Story role: decision.
  #     placement: DIAGNOSIS, at wage-notice-rail.
  - group: STATS
    at: wage-notice-rail
    title: "Transition or warning"
    concept: 12   # business cycle diagnosis
    reason: "The output shortfall and layoffs agree, while the basket still reports rising prices."
    scene: "The negative output gap now agrees with cyclical layoffs and rising discouraged-worker counts, while the fixed basket still shows inflation. Select the diagnosis that fits every reading without pretending the price problem has vanished."
    motivation: "The diagnosis must explain weak activity without dismissing the simultaneous inflation problem."
    format: DIAGNOSIS
    question: "Select one diagnosis and submit a conclusion."
    answerText: "Treat the labor data as a recessionary warning with an adverse supply shock."
    why: "Weak output with rising prices can reflect a supply shock rather than healthy demand."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Weak output with rising prices can reflect a supply shock rather than healthy demand.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Page 4 signed.
    # CONVERTED. The bible's payload was:
    #   diagnosis:{headline:"Prices up, output below capacity",readings:["gap −34.8","cyclical layoffs","discouraged +0.5m","energy import +18%"],choices:[{id:"normal",mechanism:"natural churn only"},{id:"demand_boom",mechanism:"Y>Yf"},{id:"mixed",mechanism:"recessionary gap plus adverse supply pressure"},{id:"deflation",mechanism:"PL falling"}],answer:"mixed"}
    # A rename, plus one split: the engine's readings panel is a zone and a value,
    # and the bible writes each reading as one string. Each is split at its own
    # quantity — "gap −34.8" into gap and −34.8 — and the one carrying no quantity
    # keeps its whole phrase as the zone. Candidates are graded by label, so each
    # one's `mechanism` is its label and "mixed" is written out as its own.
    headline: "Prices up, output below capacity"
    readings:
    - { zone: "gap", value: "−34.8" }
    - { zone: "cyclical layoffs", value: "" }
    - { zone: "discouraged", value: "+0.5m" }
    - { zone: "energy import", value: "+18%" }
    choices:
    - "natural churn only"
    - "Y>Yf"
    - "recessionary gap plus adverse supply pressure"
    - "PL falling"
    answer: "recessionary gap plus adverse supply pressure"

  objective: "Distinguish nominal and real rates before tightening."
  stake: "8 days until changeover. A loan quote waits beside the expected-price sheet. Today you decide whether rates should rise while output is weak."
  takeaway: "Evidence must match the mechanism, units, and stated limits."
  segue: "But Nia's foreign bond orders arrive before the ink dries; the stronger currency brings a cost to exporters."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-banks
    # On arrival at BANKS | money-market-console | automatic
    on: { enter: true, at: BANKS }
    world: "A loan quote waits beside the expected-price sheet."
    panel: "Distinguish nominal and real rates before tightening."
    # unlocks: Unlock Stop 29 at money-market-console in BANKS.
    bubbles:
    - who: arendt   # Tomas Arendt
      say: "Start with clear money surplus. We need evidence the next decision can use."
  - id: after-stop-29
    # After Stop 29 | balance-sheet-desk | automatic
    on: { after: [1] }
    world: "At money-market-console, the dated accepted-result slip for Stop 29 reads: \"A 30-billion money surplus causes bond buying, raises bond prices, and lowers the nominal rate from 5% to 4%.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 29 RECORDED - STOP 30 OPEN"
    # unlocks: Unlock Stop 30 at balance-sheet-desk in Bank Supervision.
    bubbles:
    - who: arendt   # Tomas Arendt
      say: "Nice work. A 30-billion surplus clears through bond buying and a rate fall to 4%."
  - id: after-stop-30
    # After Stop 30 | policy-wall | automatic
    on: { after: [2] }
    world: "At balance-sheet-desk, the dated accepted-result slip for Stop 30 reads: \"1.5%, +0.5 pp.\". The slip remains in that fixture's evidence holder."
    panel: "BANKS → RATE"
    # unlocks: Unlock Stop 31 at policy-wall in Rate Room.
    bubbles:
    - who: arendt   # Tomas Arendt
      say: "Good thinking. The real rate is 1.5%, already 0.5 point tighter."
  - id: after-stop-31
    # After Stop 31 | bond-panel | automatic
    on: { after: [3] }
    world: "At policy-wall, the dated accepted-result slip for Stop 31 reads: \"The keyed result shown by the completed interaction.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 31 RECORDED - STOP 32 OPEN"
    # unlocks: Unlock Stop 32 at bond-panel in BANKS.
    bubbles:
    - who: arendt   # Tomas Arendt
      say: "Exactly right. Sell bonds → Ms falls → i rises → I falls → AD shifts left → output and price level fall."
  - id: at-mission-end
    # At mission end | money-market-console | automatic
    on: { missionEnd: true }
    world: "At bond-panel, Tomas Arendt clips the HOLD RATE decision beneath the bond-price rail. The dated prop remains here on later visits."
    panel: "MISSION 8 EVIDENCE: RECORDED"
    # unlocks: Open the mission outcome and metric screen.
    bubbles:
    - who: arendt   # Tomas Arendt
      say: "A high rate is not the same as a strong household. But Nia's foreign bond orders arrive before the ink dries; the stronger currency brings a cost to exporters."


  # --- Stop 31: Tool transmission
  #     Concept: monetary chain; Keystone: AD; Area: Bank Supervision; Learning role: INTRODUCE; Difficulty: L3; Story role: travel payoff.
  #     placement: SEQUENCE, at policy-wall.
  - group: BANKS
    at: policy-wall
    title: "Tool transmission"
    concept: 25   # monetary chain
    reason: "The board is considering a monetary tool and needs its route to spending made explicit."
    scene: "Include the money-market step and the investment response in the Rate Book."
    motivation: "The transmission chain connects the money-market change to investment and aggregate demand."
    format: SEQUENCE
    question: "Place six cards in order and submit."
    answerText: "\"Sell bonds → Ms falls → i rises → I falls → AD shifts left → output and price level fall.\""
    why: "A tool matters only through the chain it sets off."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. A tool matters only through the chain it sets off.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Record the result and unlock the next named stop.
    # CONVERTED. The bible's payload was:
    #   cards:[sell bonds,Ms falls,nominal i rises,I falls,AD left,Y and PL fall]; order:same.
    # A rename and an index: "order:same" is the cards as written, which the engine
    # states as the permutation 0..5. Every card is the bible's own wording.
    cards:
    - "sell bonds"
    - "Ms falls"
    - "nominal i rises"
    - "I falls"
    - "AD left"
    - "Y and PL fall"
    order: [0, 1, 2, 3, 4, 5]

  # --- Stop 32: Raise now
  #     Concept: monetary choice; Keystone: AD-AS/Fisher; Area: Rate Room; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: STRESS, asked by Tomas Arendt beside bond-panel.
  - group: RATE
    at: bond-panel
    title: "Raise now"
    person: arendt
    concept: 25   # monetary choice
    reason: "A proposed rate rise faces a recessionary gap and uncertain expected inflation."
    scene: "The recessionary gap remains 34.8 billion while expected inflation could be 2% to 3%. Stress a one-point nominal hike across that range and select the claim that always survives."
    motivation: "The real-rate sensitivity test shows which effects of tightening persist across the stated inflation expectations."
    format: STRESS
    question: "Inspect all settings and submit one policy choice: \"do not raise now.\""
    answerText: "\"Do not raise now; the hike tightens real borrowing conditions in every tested case.\""
    why: "A hike raises the real rate across the range and worsens weak demand."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. A hike raises the real rate across the range and worsens weak demand.
    # correct result: The keyed result shown by the completed interaction.
    # state/output: Page 8 signed.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   range:2..3 step.25; candidates:[hike tightens survives all,hike closes gap none,hike shifts SRAS none]; correct:hike tightens.
    stress:
      candidates:
        - id: nominal_only
          label: Use only the nominal reading
        - id: common_extreme_mistake
          label: Use the favorable extreme as if it were guaranteed
        - id: robust_plan
          label: The keyed result shown by the completed interaction.
      criteria:
        - key: evidence_fit
          label: fit to the stop evidence
        - key: safety_margin
          label: margin at the adverse end
      scores:
        nominal_only:
          evidence_fit: 95
          safety_margin: 20
        common_extreme_mistake:
          evidence_fit: 88
          safety_margin: 5
        robust_plan:
          evidence_fit: 82
          safety_margin: 92
      feasible:
        nominal_only: 2.5
        common_extreme_mistake: 2.5
        robust_plan: 2
      assumption:
        label: inflation expectation
        unit: "%"
        min: 2
        max: 3
        nominal: 2.5
        step: 0.25
      robust: robust_plan
      optimiseOn: evidence_fit

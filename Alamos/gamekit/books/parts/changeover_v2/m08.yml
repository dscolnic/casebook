  stops:
  # --- Stop 29: Clear money surplus
  #     Concept: money market; Keystone: interest markets; Area: Bank Supervision; Learning role: INTRODUCE; Difficulty: L3; Story role: experiment.
  #     placement: VERIFY, at money-market-console.
  - group: BANKS
    at: money-market-console
    title: "Clear money surplus"
    concept: "money market"
    reason: "The board needs the direction of adjustment before setting a tool."
    scene: "Money supplied is 300 billion, but at 5% people demand only 270 billion. Predict the bond trade and rate direction before operating the market panel clearly for the next board decision."
    motivation: "A money surplus produces bond buying, higher bond prices, and a lower nominal rate."
    format: VERIFY
    question: "**CALCULATE AND COMMIT:** Subtract money demand of 270 billion from money supply of 300 billion and submit the surplus in billions."
    answerText: "\"A 30-billion surplus clears through bond buying and a rate fall to 4%.\""
    why: "A money surplus produces bond buying, higher bond prices, and a lower nominal rate."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. A money surplus produces bond buying, higher bond prices, and a lower nominal rate.
    # correct result: A 30-billion money surplus causes bond buying, raises bond prices, and lowers the nominal rate from 5% to 4%.
    # state/output: Record the result and unlock the next named stop.
    # CONVERTED. The bible's payload was:
    #   verify:{prediction:{equation:"surplus=money supplied-money demanded",inputs:{Ms:300,Md:270,unit:"billion"},correct:30,tolerance:0.1,submit_unit:"billion"},lock:"bond-market action stays locked until 30 billion is committed",action:"run adjustment at the displayed 5% starting rate",measurements:{bond_price:"rises",nominal_rate:"falls from 5% to 4%"},conclusion:"surplus causes bond buying and a lower rate"}
    # THE MODEL CONVERSION, and the one piece of real work here. The bible states a
    # single correct prediction with a tolerance; this engine's VERIFY has the
    # player DIAL a prediction on a range and then compares it against what the
    # measurement finds. So:
    #   · `truth` is the bible's `correct`, 30 billion, untouched
    #   · `passRatio` is the bible's own tolerance of 0.1 billion said as a ratio
    #     of 30: 29.9/30 = 0.9967 and 30.1/30 = 1.0033
    #   · the dial runs 0 to 300 — no surplus, up to the whole money supply the
    #     bible puts on the board — in steps of 1 billion, which is wide enough
    #     that not every position passes, as the importer requires
    # `action` is the intervention, `lock` its note, `measurements` the two things
    # the panel reads, and `conclusion` the moral.
    relationship: "surplus = money supplied − money demanded, so 300 billion − 270 billion"
    verify:
      prediction:
        label: "Money surplus at 5%"
        unit: "billion"
        min: 0
        max: 300
        step: 1
      truth: 30
      passRatio: [0.9967, 1.0033]
      intervention:
        label: "Run adjustment at the displayed 5% starting rate"
        note: "Bond-market action stays locked until 30 billion is committed."
      measurement:
        label: "Bond price and nominal rate"
      moral: "A surplus causes bond buying and a lower rate."
      commit: "Report the surplus"

  # --- Stop 30: Real burden
  #     Concept: Fisher; Keystone: inflation/rates; Area: Statistics Floor; Learning role: COMBINE; Difficulty: L3; Story role: calculation.
  #     placement: DERIVE, at balance-sheet-desk.
  - group: STATS
    at: balance-sheet-desk
    title: "Real burden"
    concept: "Fisher"
    reason: "A nominal quote alone cannot show purchasing-power cost."
    scene: "With equilibrium nominal interest at 4.0% and expected inflation at 2.5%, rearrange Fisher's equation and calculate the real rate. Compare it with last month's 1.0% real rate."
    motivation: "Tightness depends on the real rate, not on whether the nominal number looks high or low."
    format: DERIVE
    question: "Submit real rate and change. lines:[r=4.0−2.5=1.5,change=+0.5pp]."
    answerText: "\"The real rate is 1.5%, already 0.5 point tighter.\""
    why: "Tightness depends on the real rate, not on whether the nominal number looks high or low."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A different response does not fit the displayed evidence. Tightness depends on the real rate, not on whether the nominal number looks high or low.
    # correct result: 1.5%, +0.5 pp.
    # state/output: Record the result and unlock the next named stop.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{"goal":"real rate and monthly change","givens":["nominal rate=4.0%","expected inflation=2.5%","last real rate=1.0%"],"lines":[{"id":"L1","expression":"real rate=nominal rate-expected inflation","license":"state governing relationship"},{"id":"L2","expression":"real rate=4.0%-2.5%=1.5%","license":"substitute displayed values"},{"id":"L3","expression":"change=1.5%-1.0%=+0.5 percentage point","license":"simplify with units"}],"keyed_order":["L1","L2","L3"],"decoys":["6.5%","-1.5%"],"correct_result":"1.5%, up 0.5 percentage point","answerText":"The real rate is 1.5%, which is 0.5 percentage point above last month."}


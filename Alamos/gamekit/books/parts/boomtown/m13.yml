  - group: T
    at: budget-desk
    title: "Read the distribution claim"
    concept: 20   # Trade policy and distribution
    reason: "A bigger income share may hide a falling total."
    scene: "Mara shows you the record: the tariff ledger separates resource effects from transfers, and advocates now point to an improved income share as proof of benefit. Check the underlying income levels before accepting a distribution chart as evidence that households can buy more."
    motivation: "The hearing cannot sell a relative share change as a universal gain."
    format: DIAGNOSIS
    question: "Read every zone and select the one explanation consistent with all observations."
    choices:
      - A larger share need not mean more income
      - The bottom half’s cash income rose
      - All households have equal incomes
      - The filter price fell after the tariff
    answer: A larger share need not mean more income
    answerText: "The bottom half receives 20% of $1000 = $200 before and 25% of $800 = $200 after. Its share rises while its nominal amount stays unchanged; this distribution record alone cannot establish a welfare gain, especially with dearer filters."
    why: "The bottom half receives 20% of $1000 = $200 before and 25% of $800 = $200 after. Its share rises while its nominal amount stays unchanged; this distribution record alone cannot establish a welfare gain, especially with dearer filters. The hearing cannot sell a relative share change as a universal gain. Distribution must be read together with levels and prices; the same nominal income buys fewer of a product whose price rises, even when its income share improves."

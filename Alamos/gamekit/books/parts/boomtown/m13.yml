    concept: 20   # Trade policy and distribution
    reason: "The filter comparison needs the foreign quantity as well as local output."
    scene: "Nico shows you the record: the freight goal now includes water harm, and a filter quote offers a cheaper way to meet the protection requirement. Count the imports before comparing the border-charge proposal with the existing untaxed compliance plan."
    motivation: "The compliance budget needs the foreign quantity rather than total use alone."
    format: BALLPARK
    question: "Submit the imported quantity."
    answerText: "Imports fill the gap: 100−40 = 60 filters per month. Domestic production remains part of total use."

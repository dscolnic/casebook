  - {name: "Marginal social cost", def: "Private marginal cost plus external marginal cost."}
  - {name: "Marginal social benefit", def: "Private marginal benefit plus external marginal benefit."}
  - {name: "Public good", def: "A good that is both nonrival and nonexcludable."}
  - {name: "Common resource", def: "A rival resource from which users are difficult to exclude."}
  - {name: "Free rider", def: "Someone who benefits without contributing to provision."}

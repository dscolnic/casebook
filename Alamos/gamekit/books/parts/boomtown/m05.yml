  terms:
  - {name: "Price ceiling", def: "A legal maximum price."}
  - {name: "Binding control", def: "A price rule that prevents the market from reaching its otherwise available equilibrium."}
  - {name: "Shortage", def: "Quantity demanded exceeds quantity supplied at a stated price."}
  - {name: "Distribution", def: "How gains, costs or income are shared among people."}
  equations:
  - {"e":"Shortage = Qd − Qs","c":"Count unmet requests at a controlled price.","v":[["Qd","homes requested"],["Qs","homes offered"]],"s":"A lower price must not be confused with universal access."}

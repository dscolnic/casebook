  #     Concept: 8 — Price controls and allocation; Narrow concept: Keep the promise honest; Keystone: Equilibrium, Price incentives, Surplus; Area: P; Prerequisites: 4; Learning role: COMBINE; Difficulty: L3; Story role: decision.
  #     placement: CHOICE, Leila Moss at the Job Board in Housing and Work Office.
  - group: P
    at: job-board
    title: "Keep the promise honest"
    concept: 8   # Price controls and allocation
    reason: "The public promise must not erase the excluded applicants."
    scene: "Leila shows you the record: the office record confirms an immediate allocation gap without a loss of physical buildings, and the council still wants every applicant housed. Decide what the cap can achieve before the hearing commits to its final promise."
    motivation: "The advice distinguishes a factual shortage from a value judgment about tenant protection."
    format: CHOICE
    question: "Select the one recommendation supported by the recorded evidence and the stated decision rule."
    choices:
      - Reject the ceiling as a complete housing plan and retain a separate access measure
      - Certify the ceiling alone as housing every applicant
      - Reject all tenant relief because some people lose
      - Promise immediate construction without funds or permits

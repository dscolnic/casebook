  #     placement: BALLPARK, Housing and Work Office — Lease Desk.
  - group: P
    at: lease-desk
    title: "Check the confirmed funding"
    concept: 21   # Robust comparison of competing plans
    reason: "Every promised service needs a confirmed source of funds."
    scene: "Leila shows you the record: the access retrofit survives the stated cost range, but the full agreement still includes housing and water commitments that must be paid. Check the confirmed funding before presenting those promises as ready for signatures at the hearing."
    motivation: "The hearing can promise only measures whose costs have a confirmed source."
    format: BALLPARK
    question: "Submit the total confirmed daily funding; then compare it with the visible $150 plan cost."
    answerText: "Confirmed funding is 120+30 = $150 daily, exactly matching the $150 plan cost; no unconfirmed grant is counted."
    why: "Confirmed funding is 120+30 = $150 daily, exactly matching the $150 plan cost; no unconfirmed grant is counted. The hearing can promise only measures whose costs have a confirmed source. Opportunity cost and fiscal discipline require counting only confirmed funding once; the absence of a gap does not prove that the agreement has no real resource costs. 0 is the funding gap, not the requested confirmed funding total. 120 omits the cooperative contribution."

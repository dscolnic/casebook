roster:
- id: velez
  name: "Mara Velez"
  role: "state economic adviser"
  division: T
  pronouns: "she/her."
  bio: |
    Mara Velez is state economic adviser. Wants resolve disputes without spending promises twice. Initially trusts neatly balanced aggregate totals. After M14 she requests separate resource and transfer columns before any recommendation. Says, "What claim would change our choice?"
- id: bell
  name: "Nico Bell"
  role: "diner owner"
  division: CM
  pronouns: "he/him."
  bio: |
    Nico Bell is diner owner. Wants keep the diner solvent and the town fed. Welcomes cheaper suppliers but initially resists competing food sellers. After M8 he accepts the entry rule he wanted applied to his suppliers. Says, "What changes if I do one more?"
- id: sen
  name: "Ruth Sen"
  role: "terminal manager"
  division: E
  pronouns: "she/her."
  bio: |
    Ruth Sen is terminal manager. Wants keep the terminal solvent and its contractual service reliable. Initially presents private profit targets as physical capacity needs. After M10 she separates cost recovery from exclusion and accepts an explicit access regime. Says, "Who covers the fixed bill?"
- id: moss
  name: "Leila Moss"
  role: "housing cooperative organizer"
  division: P
  pronouns: "she/her."
  bio: |
    Leila Moss is housing cooperative organizer. Wants keep both current tenants and new workers housed. Initially lets incumbent tenant gains stand for all applicants. After M5 she retains tenant relief but demands a separate access count. Says, "Who is still outside?"
- id: price
  name: "Owen Price"
  role: "watershed engineer"
  division: X
  pronouns: "he/him."
  bio: |
    Owen Price is watershed engineer. Wants keep downstream water costs visible and protection funded. Initially treats a technically effective filter as affordable without checking trade policy. After M13 he carries resource and payment accounts together. Says, "Where did the cost go?"

leaders:
- id: bethe
  name: Hans Bethe
  role: Theoretical physicist and division organizer
  science: 5
  management: 4
  trait: Turns many calculations into one coordinated theory program.
- id: bacher
  name: Robert Bacher
  role: Experimental physicist and laboratory leader
  science: 4
  management: 5
  trait: Strong at organizing independent measurements and technical teams.
- id: kennedy
  name: Joseph Kennedy
  role: Chemist and division leader
  science: 4
  management: 4
  trait: Balances chemical evidence, materials work, and laboratory discipline.
- id: parsons
  name: Deke Parsons
  role: Naval ordnance officer and engineer
  science: 3
  management: 5
  trait: Excels at schedules, interfaces, qualification, and delivery constraints.
- id: kistiakowsky
  name: George Kistiakowsky
  role: Physical chemist and explosives-program leader
  science: 4
  management: 4
  trait: Connects difficult physical science to a focused engineering campaign.
- id: fermi
  name: Enrico Fermi
  role: Experimental and theoretical physicist
  science: 5
  management: 3
  trait: Rapidly identifies the simplest decisive calculation or experiment.
- id: vonneumann
  name: John von Neumann
  role: Mathematician and scientific consultant
  science: 5
  management: 3
  trait: Exceptional at mathematical structure, modeling, and hard tradeoffs.

  # --- Stop 23: Cost the vanished trades
  #     Concept: 10 — Surplus and efficiency; Narrow concept: Cost the vanished trades; Keystone: Surplus, Marginal analysis; Area: CM; Prerequisites: 3, 4; Learning role: INTRODUCE; Difficulty: L3; Story role: clue.

  terms:
  - {name: "Excise tax", def: "A payment charged per unit traded."}
  - {name: "Tax incidence", def: "How a tax burden is divided between buyers and sellers."}
  - {name: "Consumer surplus", def: "Willingness to pay minus actual payment, summed over buyers."}
  - {name: "Producer surplus", def: "Payment received minus minimum supply cost, summed over sellers."}
  - {name: "Deadweight loss", def: "Net gains from trade lost rather than transferred to another party."}
  - {name: "Subsidy", def: "A payment that lowers a recipient's effective cost or raises its effective return."}

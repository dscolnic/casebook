  - {name: "Midpoint method", def: "A percentage change measured relative to the average of the two values."}
  - {name: "Total revenue", def: "Price multiplied by units sold."}
  - {name: "Income elasticity", def: "The percentage quantity response to a percentage income change."}
  - {name: "Cross-price elasticity", def: "The percentage quantity response to another good's percentage price change."}

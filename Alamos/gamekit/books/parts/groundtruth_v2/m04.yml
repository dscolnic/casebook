    concept: 5   # conductor equilibrium
    reason: "Tate must distinguish settled conductor fields from storm fields before estimating the mast tip hazard."
    scene: "The mast sits at one voltage after charge settles, but four sketches show different interior and surface fields. Select the only sketch consistent with electrostatic equilibrium before Tate estimates the tip field."
    motivation: "The interior and surface-field conditions determine which conductor sketch can support the tip-field calculation."
    format: CHOICE
    question: "Select the one conductor sketch that shows zero field inside, one surface potential, and an exterior field perpendicular to the surface; submit one letter."
    choices:
    - "Zero field inside, one surface potential, and an exterior field perpendicular to the surface."
    - "A nonzero uniform field remains inside the conductor."
    - "The exterior field is tangent to the conductor surface."
    - "Potential varies from point to point along the conductor surface."
    answer: "Zero field inside, one surface potential, and an exterior field perpendicular to the surface."
    answerText: "The completed check shows a conductor at equilibrium has E=0 inside; outside E is normal. Mobile charge moves until tangential/interior fields vanish."
    why: "zero interior field and perpendicular exterior field rule out three pictures."

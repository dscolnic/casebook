  #     Concept: conductor equilibrium; Keystone: K4; Area: Mast Base; Learning role: PRACTICE; Difficulty: L3; Story role: INTRODUCE L1 clue.
  #     placement: CHOICE, asked by Marcus Tate beside mast-desk.

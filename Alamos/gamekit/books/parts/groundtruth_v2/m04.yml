    examples:
    - {"title":"Electrostatic conductor","problem":"A metal object has reached electrostatic equilibrium. What are the field and potential inside the conducting material?","rule":"Free charges rearrange until there is no electric field driving further motion in the conductor.","steps":["Inside the conducting material, E=0.","Since ΔV=-integral E·dl, potential does not vary within that connected conductor."],"answer":"The interior field is zero and the conductor is equipotential.","mistake":"This result is for electrostatic equilibrium, not any wire carrying current."}
    - {"title":"Compare equal-potential spheres","problem":"Two isolated conducting spheres are held at the same potential V and have radii 1 cm and 2 cm. Compare surface fields.","rule":"For a conducting sphere, E=V/R.","steps":["Set up the relationship: For a conducting sphere, E=V/R.","E_small/E_large=R_large/R_small=2/1=2."],"answer":"The smaller sphere has twice the surface field in this spherical model.","mistake":"Equal potential does not imply equal surface field for different radii."}
    - {"title":"Field just outside a conductor","problem":"A conductor has local surface charge density 9×10^-9 C/m². Use ε0≈9×10^-12 F/m. Find the external normal field.","rule":"At an electrostatic conductor surface in vacuum, E_out=σ/ε0.","steps":["Set up the relationship: At an electrostatic conductor surface in vacuum, E_out=σ/ε0.","E_out=(9×10^-9)/(9×10^-12)=1000 N/C."],"answer":"The field just outside is 1000 N/C outward for positive charge.","mistake":"Do not use the isolated infinite-sheet factor of two here."}
    - {"title":"Potential of a point charge","problem":"A charge q=2 nC is 3 m from a point. Use k=9×10^9 N m²/C² and zero potential at infinity. Find V.","rule":"V=kq/r.","steps":["Set up the relationship: V=kq/r.","V=(9×10^9)(2×10^-9)/3=6 V."],"answer":"The potential is +6 V.","mistake":"Potential uses 1/r, while point-charge field uses 1/r²."}
    - {"title":"Force per charge","problem":"A positive test charge q=2 μC experiences force F=6 mN rightward. Find the electric field.","rule":"E=F/q; μC means 10^-6 C and mN means 10^-3 N.","steps":["Set up the relationship: E=F/q; μC means 10^-6 C and mN means 10^-3 N.","E=(6×10^-3)/(2×10^-6)=3000 N/C rightward."],"answer":"The field is 3000 N/C to the right.","mistake":"The field direction is defined by force on a positive test charge."}


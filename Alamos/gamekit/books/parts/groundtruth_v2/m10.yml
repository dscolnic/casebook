  # --- Stop 40: Scope the April Certificate
  #     Concept: DC vs transient safety; Keystone: K7,K11,K12; Area: Remote Outstation; Learning role: PRACTICE; Difficulty: L3; Story role: TRANSFER L5.
  #     placement: DIAGNOSIS, at earth-cert.
  - group: COUPLE
    at: earth-cert
    title: "Scope the April Certificate"
    concept: 28   # DC vs transient safety
    reason: "The calculated pulse voltages exceed what the April resistance certificate was designed to describe."
    scene: "Now the same lead produces 4.2 kV resistive and 0.60 kV inductive drop during the pulse. Diagnose which statement the 0.42 Ω certificate can honestly support."
    motivation: "The certificate's valid scope determines whether it can support fast-shot approval or only a steady-current resistance claim."
    format: DIAGNOSIS
    question: "Read all four certificate zones, then submit whether they support safe at all times, safe for direct current (DC) only, or inductance only."
    answerText: "The completed check shows the 0.42 Ω certificate supports steady-current resistance only."
    why: "a measurement is valid only for the quantity and timescale it tested."
    # wrong-path feedback, one rebuttal per wrong option:
    #   An intact bond and true DC value do not certify a microsecond waveform.
    # correct result: The 0.42 Ω certificate supports steady-current resistance only.
    # state/output: report piece10.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   readings [dc_R normal,pulse_L untested,stage_delay alarm,physical_bond intact]; choices [safe_all_times,safe_dc_only,inductance_only]; answer safe_dc_only.
    readings:
      - zone: alarm_source
        label: alarming source zone
        value: alarm present
      - zone: transfer_path
        label: possible transfer path
        value: evidence present
      - zone: quiet_control
        label: quiet comparison zone
        value: no alarm
      - zone: protected_interior
        label: protected interior
        value: quiet
    choices:
      - Safe for steady DC only
      - Safe at every timescale
      - Certificate proves inductance only
      - Physical bond was already broken
    headline: Read all four certificate zones, select the one scope statement they jointly support, and submit safe at all times, safe for DC only, or inductance only.
    answer: Safe for steady DC only
    rebuttals:
      - The untested pulse inductance and stage-delay alarm defeat an all-times claim.
      - The certificate measured 0.42 Ω DC resistance, not inductance.
      - The physical bond is intact, so breakage cannot explain the scope failure.


  #     Concept: dI/dt; Keystone: K11,K6; Area: Remote Outstation; Learning role: PRACTICE; Difficulty: L3; Story role: RETRIEVE L3.
  #     placement: SWEEP, at gap-row.
  - group: COUPLE
    at: gap-row
    title: "Sweep Stage-7 Delay"
    concept: 26   # dI/dt
    reason: "The coil model is established, but a late bank stage could change both pulse slope and ringing."
    scene: "With the inductance relation established, sweep stage-7 delay from 0 to 200 ns while energy stays 1.50 kJ. Record peak dI/dt and pulse ringing."
    motivation: "The joint current-rise and ringing limits determine how much stage-7 delay the shot plan can tolerate."
    format: SWEEP
    question: "Sweep only stage-7 delay from 0 to 200 ns while energy remains 1.50 kJ, record dI/dt and ringing at inspected delays, and submit the inclusive acceptable delay bound."
    answerText: "The completed check shows delay must be ≤50 ns. Greater delay lowers derivative but raises ringing beyond the joint rule."
    why: "equal stored energy can create unequal inductive hazard because waveform shape matters."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Energy stays fixed; judge both dI/dt and ringing at inspected settings.
    # correct result: Delay must be ≤50 ns. Greater delay lowers derivative but raises ringing beyond the joint rule.
    # state/output: Record the result and unlock the next named stop.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   delay [0,50,100,150,200]ns, dIdt [3.0,2.8,2.4,2.0,1.7]e8A/s, ringing [5,8,14,22,31]%; correct acceptable delay≤50ns. Prompt inspect/submit bound. State waypoint EARTH.
    #
    # CONVERTED as a boundary sweep, which is what the bible's board is: one
    # handle, two costs that move against each other, and a line the player puts
    # between them. The five delays and both response arrays are the bible's; the
    # target is its bound, 50 ns.
    #
    # ONE DERIVED PARAMETER, `tolerance`, for the reason given at mission 6 stop 2:
    # the response is sampled every 50 ns and one sample is the answer, so half a
    # step is the widest band that still refuses 0 ns and 100 ns.
    sweep:
      mode: boundary
      axis: { label: "Stage-7 delay", unit: "ns", min: 0, max: 200, step: 10 }
      readout: { label: "Acceptable delay bound", unit: "ns" }
      series:
      - label: "Peak dI/dt"

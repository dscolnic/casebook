  # --- Stop 37: Derive Inductance
  #     Concept: solenoid inductance; Keystone: K8,K11; Area: Remote Outstation; Learning role: PRACTICE; Difficulty: L3; Story role: INTRODUCE L3.
  #     placement: DERIVE, at hall-board.
  - group: COUPLE
    at: hall-board
    title: "Derive Inductance"
    concept: "solenoid inductance"
    reason: "the lead model needs a defensible inductance relation."
    scene: "Model a wound calibration coil with N turns, length ℓ, and area A. Derive its inductance from Ampere's field and flux linkage before testing the bond pulse.\", and record the result with its physical justification in the station report."
    motivation: "the derivation shows how geometry controls opposition to changing current."
    format: DERIVE
    question: "Build four lines from Ampere's solenoid field through total flux linkage, name each rule, and submit L=μ₀N²A/ℓ."
    answerText: "The completed check shows l=μ₀N²A/ℓ. Ampere field plus N flux linkages gives the result."
    why: "the derivation shows how geometry controls opposition to changing current."
    # wrong-path feedback, one rebuttal per wrong option:

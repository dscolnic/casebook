        response:
        - { at: 0, value: 3.0 }
        - { at: 50, value: 2.8 }
        - { at: 100, value: 2.4 }
        - { at: 150, value: 2.0 }
        - { at: 200, value: 1.7 }
      - label: "Pulse ringing"
        unit: "%"
        response:
        - { at: 0, value: 5 }
        - { at: 50, value: 8 }
        - { at: 100, value: 14 }
        - { at: 150, value: 22 }

    title: "Test spatial consistency"
    concept: 30   # model residuals
    reason: "The inferred charge density needs a spatial check before the crew accepts a uniform storm layer."
    scene: "Now that σ predicts -9.0 kV/m, compare residual maps from a uniform layer and a compact charged pocket. Choose the model whose residuals are structureless, not merely smallest on average."
    motivation: "The residual map distinguishes a broad layer from a compact charged pocket requiring a different field model."
    format: RESIDUAL
    question: "Inspect both four-station residual fields and submit the model with no directional pattern. Use ordered observation coordinates 1–5 on the residual axis."
    answerText: "Its small residuals alternate without a gradient; the pocket leaves a west-east trend."
    why: "A spatial pattern means the model is missing physics even when its mean error is small."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Lowest RMS helps, but the decisive test is unmodeled spatial structure.

  terms:
  - {name: "Electric flux", def: "the signed amount of electric field passing through a surface."}
  - {name: "Gaussian surface", def: "an imaginary closed surface chosen to match field symmetry."}
  - {name: "Surface charge density", def: "charge per area, written σ and measured in C/m²."}

  worked:
    label: "Worked examples"
    title: "Mission 2: worked examples"
    examples:
    - {"title":"Flux through a flat surface","problem":"A uniform field is 10 N/C. A flat surface has area 2 m² and its outward normal is parallel to the field. Find flux.","rule":"Electric flux Φ=EA cos θ, with θ measured from the surface normal.","steps":["Set up the relationship: Electric flux Φ=EA cos θ, with θ measured from the surface normal.","Φ=10(2)cos0°=20 N m²/C."],"answer":"The outward flux is +20 N m²/C.","mistake":"Use the normal direction, not the angle with the surface itself."}
    - {"title":"A tilted surface","problem":"A field E=10 N/C crosses area A=2 m² at 60° to its normal. Find flux.","rule":"Φ=EA cos θ.","steps":["Set up the relationship: Φ=EA cos θ.","Φ=10(2)(1/2)=10 N m²/C."],"answer":"The flux is 10 N m²/C.","mistake":"Projected area, not full area, determines flux when the surface is tilted."}
    - {"title":"Infer enclosed charge","problem":"A closed surface has net electric flux Φ=1000 N m²/C. Use ε0≈9×10^-12 F/m. Find enclosed charge.","rule":"Gauss's law gives q_enclosed=ε0Φ.","steps":["Set up the relationship: Gauss's law gives q_enclosed=ε0Φ.","q_enclosed=(9×10^-12)(1000)=9×10^-9 C=9 nC."],"answer":"The net enclosed charge is +9 nC.","mistake":"The flux of one open face is not automatically the net closed-surface flux."}
    - {"title":"Field of an ideal sheet","problem":"An infinite sheet has surface charge density σ=18×10^-9 C/m². Use ε0≈9×10^-12 F/m. Find field magnitude on either side.","rule":"For an isolated infinite sheet, E=σ/(2ε0).","steps":["Set up the relationship: For an isolated infinite sheet, E=σ/(2ε0).","E=(18×10^-9)/(18×10^-12)=1000 N/C."],"answer":"The field is 1000 N/C, away from this positively charged sheet.","mistake":"The isolated-sheet factor 2 differs from the conductor-surface result."}
    - {"title":"Zero flux is not zero field","problem":"A closed box contains no net charge but sits in a uniform external electric field. Is its field zero?","rule":"Gauss's law constrains net closed-surface flux, not field at every point.","steps":["Flux enters one side and leaves the opposite side with equal magnitude.","Net flux is zero even though the field inside is nonzero."],"answer":"Zero enclosed charge does not imply zero electric field.","mistake":"Do not infer pointwise field from net flux alone."}

  stops:
  # --- Stop 5: Derive the sheet field
  #     Concept: Gauss infinite sheet; Keystone: K2; Area: Field Station; Learning role: INTRODUCE; Difficulty: L3; Story role: foundation.
  #     placement: DERIVE, at mill-array.
  - group: FIELD
    at: mill-array
    title: "Derive the sheet field"
    concept: 3   # Gauss infinite sheet
    reason: "The crew needs a charge-layer model to explain the field that the mills are measuring."
    scene: "Derive the field on either side from Gauss's law before inserting measurements."
    motivation: "The sheet-field expression links the cloud's charge density to the electric field on each side of the layer."
    format: DERIVE
    question: "Submit E=σ/(2ε₀)."
    answerText: "Two equal faces carry flux; area cancels."
    why: "Symmetry makes the two pillbox faces equal and the curved side contribute zero flux."
    # wrong-path feedback, one rebuttal per wrong option:
    #   The pillbox encloses σA, not σ, and has two active faces.
    # correct result: exact symbolic result.
    # state/output: model unlocks S2.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   lines=[{2EA=σA/ε0,gauss_plus_two_faces,[EA=σA/ε0,4EA=σA/ε0]},{E=σ/(2ε0),cancel_A,[E=σ/ε0,E=2σε0]}].
    #
    # CONVERTED. Two bible lines, two steps; each line's own two decoys are the
    # other two candidates. `askRule` off, for the reason given on mission 1 stop 2.
    derive:
      start: Apply Gauss's law to a pillbox crossing the sheet.
      goal: Derive the field magnitude E in terms of σ and ε0.
      steps:
        - ask: sum flux through the two active faces
          answer: 0
          candidates:
            - text: 2EA=σA/ε0
              note: Gauss's law plus two equal faces
            - text: EA=σA/ε0
              note: one-face flux
              why: A common symmetry mistake overlooks the equal flux through the second face.
              survives: true
        - ask: cancel area and solve for E
          answer: 0
          candidates:
            - text: E=σ/(2ε0)
              note: cancel A and divide by two
            - text: E=σ/ε0, cancelling A but dropping the two-face factor
              note: cancel A only
              why: A common algebra carry-through error loses the factor of two established in the flux line.
              survives: true

  # --- Stop 6: Sort the flux faces
  #     Concept: flux angle; Keystone: K2; Area: Field Station; Learning role: PRACTICE; Difficulty: L2; Story role: obstacle.
  #     placement: PROTOCOL, at mill-bench.

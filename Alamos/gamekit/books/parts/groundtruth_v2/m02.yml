    at: mill-bench
    title: "Sort the flux faces"
    concept: 23   # flux angle
    reason: "Ravi needs to confirm that the charge-layer calculation counts flux through the correct surfaces."
    scene: "With the sheet result available, Ravi rotates a virtual pillbox around the layer. Match each face orientation to positive, negative, or zero flux so the instrument integrates the correct surfaces."
    motivation: "The face classifications determine which surfaces contribute to the Gaussian pillbox's total electric flux."
    format: PROTOCOL
    question: "Match all three faces to signed flux and submit the mapping."
    answerText: "cos0=1, cos180=-1, cos90=0."
    why: "The dot product, not area alone, decides each surface's signed contribution."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Compare field with the outward normal, not with the surface itself.
    # correct result: as mapped.
    # state/output: faces animate with arrows/text; unlock S3.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   scenarios=[top_normal_with_E,bottom_normal_against_E,side_normal_perpendicular]; choices=[+EA,-EA,0]; mapping=[top→+EA,bottom→-EA,side→0].
    #
    # CONVERTED. The bible's three face orientations, its three signed fluxes,
    # and its mapping written as indices into the choice list.
    columns:
    - "The face of the pillbox"
    - "Its signed flux"
    scenarios:

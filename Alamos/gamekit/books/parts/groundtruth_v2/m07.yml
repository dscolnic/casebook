  # --- Stop 27: Isolate Reference C
  #     Concept: causal reference test; Keystone: K7,K12; Area: Remote Outstation; Learning role: PRACTICE; Difficulty: L3; Story role: COMBINE L4 reversal.
  #     placement: CONTROL, at radar-desk.
  - group: COUPLE
    at: radar-desk
    title: "Isolate Reference C"
    concept: 30   # causal reference test
    reason: "The current balance points to a hidden return path, but its effect on channel C remains untested."
    scene: "Because 3.0 mA leaves by an undocumented branch, switch only channel C to an isolated reference, then restore it. Keep field source, gain, clock, and sampling fixed."
    motivation: "A reversible change in channel C's jump tests whether the shared reference causes the apparent field signal."
    format: CONTROL
    question: "Change only channel C's reference, keep field source, gain, clock, and sampling fixed, measure the jump before, during, and after isolation, restore the original reference, and submit one causal conclusion."
    answerText: "The completed check shows isolation removes and restoration returns the jump. That reversal establishes reference causation."
    why: "disappearance and return of the jump establishes that the reference path causes it."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Change only reference C; changing gain or clock does not test the traced cause.
    # correct result: Isolation removes and restoration returns the jump. That reversal establishes reference causation.
    # state/output: unlock S4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   control:{candidates:[{id:"reference_C",label:"channel C reference"},{id:"gain_C",label:"channel C gain"},{id:"clock_C",label:"channel C clock"}],correct_control:"reference_C",baseline:{jump:0.80,unit:"kV/m"},response:{setting:"isolated",jump:0.03,unit:"kV/m"},noise_band:{value:0.05,unit:"kV/m"},fixed:["field source","gain","clock","sampling"],measure_when:"after each setting settles",restore:{required:true,setting:"original reference",remeasure:true},correct_conclusion:"the shared reference causes the jump",answerText:"Only isolating channel C reference removes the jump beyond the noise band, and restoration returns it."}
    #
    # CONVERTED. One rename and one arithmetic step. The bible's `fixed` list is
    # the engine's `held`; its `correct_control` is `truth`; its `noise_band` is
    # `noise`. The engine's `response` is the SIGNED CHANGE in the reading rather
    # than the reading after the change, so the bible's baseline jump 0.80 kV/m
    # and isolated jump 0.03 kV/m give response = -0.77, which lands the panel on
    # 0.03 exactly.
    control:
      observable: { label: "Channel C jump", unit: "kV/m" }
      variables:
      - { id: reference_C, label: "channel C reference" }
      - { id: gain_C, label: "channel C gain" }
      - { id: clock_C, label: "channel C clock" }
      held: ["field source", "gain", "clock", "sampling"]
      truth: reference_C
      baseline: 0.80
      response: -0.77
      noise: 0.05
      changeVerb: "Isolate"
      run: "Measure the jump"
      commit: "Name the cause"

  # --- Stop 28: Quantify Common-Mode Error
  #     Concept: Ohm drop and Joule power; Keystone: K7,K12; Area: Remote Outstation; Learning role: PRACTICE; Difficulty: L3; Story role: TRANSFER L4 decision.
  #     placement: BALLPARK, at record-desk.
  - group: COUPLE
    at: record-desk
    title: "Quantify Common-Mode Error"
    concept: 16   # Ohm drop and Joule power
    reason: "The isolation reversal identifies a cause whose size must now be checked against the recorded voltage."
    scene: "The reversal proves causation; now a 3.0 mA transient crosses a 120 Ω shared lead while true sensor output is -4.2 V. Estimate the recorded voltage and instantaneous lead power."
    motivation: "The shared-lead voltage drop and power establish whether the return current can account for the observed common-mode error."
    format: BALLPARK
    question: "Using I=3.0 mA, R=120 Ω, and V_true=-4.2 V, assemble V_recorded=V_true+IR and submit the recorded voltage in volts. The result card will also show the voltage drop and lead power from the same values."
    answerText: "Vdrop=(.003)(120)=.360 V; Vrecord=-4.2+.360=-3.840 V; P=(.003)²(120)=1.08 mW."
    why: "a shared IR drop adds the same false shift to every referenced channel, while I²R reveals its heating scale."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Keep the true voltage sign and use I²R—not VI with the sensor voltage—for lead power.
    # correct result: Vdrop=.360 V, Vrecord=-3.840 V, P=1.08 mW. Ohm and Joule relations quantify common error.
    # state/output: report piece7.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   estimate={labels:[I,R,Vtrue],values:[.003,120,-4.2],slots:[Vdrop,Vrecord,P],template:[IR,Vtrue+IR,I²R],formula:[.360,-3.840,.00108],correct:[.360,-3.840,.00108],target:[V,V,W],tolerance:[.005,.005,.00005]}.
    estimate:
      prompt: convert milliamperes to amperes, multiply current by resistance, then add that drop to the true voltage
      question: recorded sensor voltage after shared-lead drop
      labels:
        - 3 mA  (Transient current)
        - 120 ohm  (Shared-lead resistance)
        - "-4.2 V  (True sensor voltage)"
      values:
        - 3
        - 120
        - -4.2
      slots: 3
      template: V_recorded={0}+({1}/1000)({2})
      formula: V_recorded=-4.2+(3.0/1000)(120)
      correct:
        - 2
        - 0
        - 1
      target: -3.84
      tolerance: 0.005
      units: V


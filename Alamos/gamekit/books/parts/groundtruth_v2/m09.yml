    examples:
    - {"title":"Induced voltage","problem":"Magnetic flux through a one-turn loop changes from 0.1 to 0.5 Wb in 0.2 s. Find the average induced emf with the stated positive flux direction.","rule":"Average emf ε=-ΔΦ/Δt.","steps":["Set up the relationship: Average emf ε=-ΔΦ/Δt.","ε=-(0.5-0.1)/0.2=-2 V."],"answer":"The signed induced emf is -2 V for that flux orientation.","mistake":"The minus sign expresses opposition to the change in flux, not always to the original field."}
    - {"title":"Several turns of wire","problem":"A coil has 10 turns. Flux per turn changes by 0.02 Wb in 0.1 s. Find emf magnitude.","rule":"|ε|=N|ΔΦ|/Δt.","steps":["Set up the relationship: |ε|=N|ΔΦ|/Δt.","|ε|=10(0.02)/0.1=2 V."],"answer":"The emf magnitude is 2 V.","mistake":"Use flux per turn before multiplying by the turn count."}
    - {"title":"A moving conductor","problem":"A rod of length 0.5 m moves at 2 m/s perpendicular to a 3 T field, with the rod perpendicular to both. Find emf magnitude.","rule":"For this geometry, |ε|=BLv.","steps":["Set up the relationship: For this geometry, |ε|=BLv.","|ε|=3(0.5)(2)=3 V."],"answer":"The induced voltage magnitude is 3 V.","mistake":"The simple product requires the stated perpendicular geometry."}
    - {"title":"A tilted surface","problem":"A field E=10 N/C crosses area A=2 m² at 60° to its normal. Find flux.","rule":"Φ=EA cos θ.","steps":["Set up the relationship: Φ=EA cos θ.","Φ=10(2)(1/2)=10 N m²/C."],"answer":"The flux is 10 N m²/C.","mistake":"Projected area, not full area, determines flux when the surface is tilted."}
    - {"title":"Field around a straight wire","problem":"A long straight wire carries 10 A. Find field 0.1 m away, using μ0/(2π)=2×10^-7 T m/A.","rule":"B=μ0 I/(2πr).","steps":["Set up the relationship: B=μ0 I/(2πr).","B=(2×10^-7)(10)/0.1=2×10^-5 T=20 μT."],"answer":"The field magnitude is 20 μT; its direction circles the wire by the right-hand rule.","mistake":"The straight-wire field falls as 1/r, not 1/r²."}


    - {"title":"Field around a straight wire","problem":"A long straight wire carries 10 A. Find field 0.1 m away, using μ0/(2π)=2×10^-7 T m/A.","rule":"B=μ0 I/(2πr).","steps":["Set up the relationship: B=μ0 I/(2πr).","B=(2×10^-7)(10)/0.1=2×10^-5 T=20 μT."],"answer":"The field magnitude is 20 μT; its direction circles the wire by the right-hand rule.","mistake":"The straight-wire field falls as 1/r, not 1/r²."}


    - {"title":"Potential-energy change","problem":"A charge q=2 μC moves through potential change ΔV=100 V. Find ΔU.","rule":"ΔU=qΔV.","steps":["Set up the relationship: ΔU=qΔV.","ΔU=(2×10^-6)(100)=2×10^-4 J."],"answer":"Potential energy increases by 0.0002 J.","mistake":"Voltage is energy per charge, not energy itself."}
    - {"title":"Potential of a point charge","problem":"A charge q=2 nC is 3 m from a point. Use k=9×10^9 N m²/C² and zero potential at infinity. Find V.","rule":"V=kq/r.","steps":["Set up the relationship: V=kq/r.","V=(9×10^9)(2×10^-9)/3=6 V."],"answer":"The potential is +6 V.","mistake":"Potential uses 1/r, while point-charge field uses 1/r²."}
    - {"title":"Add electric potentials","problem":"Two sources contribute potentials +12 V and -5 V at a point. Find total potential.","rule":"Potential adds as a signed scalar.","steps":["Set up the relationship: Potential adds as a signed scalar.","V_total=12+(-5)=7 V."],"answer":"The total is 7 V relative to the shared reference.","mistake":"Do not combine potentials using vector components."}
    - {"title":"Move along equal potential","problem":"A charge moves between two points on the same equipotential surface. What is the electric potential-energy change?","rule":"ΔU=qΔV.","steps":["The two points have the same potential, so ΔV=0.","ΔU=q(0)=0 for any charge q."],"answer":"The electric potential-energy change is zero.","mistake":"Zero potential difference does not require zero electric field everywhere."}


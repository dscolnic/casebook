    - {"title":"Energy of identical capacitors","problem":"Three separate capacitors each store 4 J. Find total stored energy before reconnection.","rule":"Total energy is the sum over the capacitors.","steps":["Set up the relationship: Total energy is the sum over the capacitors.","U_total=3(4)=12 J."],"answer":"The bank stores 12 J before reconnection.","mistake":"How much energy remains after a reconnection depends on losses and the circuit."}

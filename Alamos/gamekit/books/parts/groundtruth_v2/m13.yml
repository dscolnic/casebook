  # --- Stop 52: Diagnose Frequency Response
  #     Concept: certification timescale, LC/RL/transformer; Keystone: K7,K11,K12; Area: Remote Outstation; Learning role: PRACTICE; Difficulty: L3; Story role: COMBINE L5.
  #     placement: DIAGNOSIS, at earth-cert.
  - group: COUPLE
    at: earth-cert
    title: "Diagnose Frequency Response"
    concept: 30   # certification timescale, LC/RL/transformer
    reason: "The upgraded waveform shows ringing that the April steady-current test never measured."
    scene: "The upgraded channel captures damped ringing near angular frequency 1/sqrt(LC), where L is inductance and C is capacitance. The April test used steady current. Diagnose why its 0.42-ohm result and fast waveform can both be correct."
    motivation: "The frequency-response diagnosis determines whether both records can be valid while describing different electrical behavior."
    format: DIAGNOSIS
    question: "Compare direct-current (DC), resistor-inductor (RL), resistor-inductor-capacitor (RLC), transformer, and physical-condition zones. Select the explanation that fits all readings and submit one certificate scope."
    answerText: "The completed check shows frequency-dependent response reconciles DC and transient records."
    why: "DC resistance, RL growth, RLC loss, and transformer scaling answer different parts of a transient."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Fraud and charge loss do not predict RL rise, damped LC ringing, and correct transformer ratio together.
    # correct result: Frequency-dependent response reconciles DC and transient records.
    # state/output: report piece13.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   readings [DC stable,RL_current_rises_with_tau_LoverR,ringing_at_1overSqrtLC_decays_through_R,probe_ratio_V2overV1_equals_N2overN1,physical_bond_intact]; choices [fraud,frequency_dependent_response,charge_nonconservation]; answer frequency response; mechanism explicitly checks L dI/dt+IR=ε, ω0=1/√LC, resistance damps RLC energy, and ideal V2/V1=N2/N1.
    readings:
      - zone: alarm_source
        label: alarming source zone
        value: alarm present
      - zone: transfer_path
        label: possible transfer path
        value: evidence present
      - zone: quiet_control
        label: quiet comparison zone
        value: no alarm
      - zone: protected_interior
        label: protected interior
        value: quiet
    choices:
      - Frequency-dependent circuit response
      - Fraudulent DC certificate
      - Charge nonconservation
      - Transformer turns-ratio error alone
    headline: Compare the DC, RL, RLC, transformer, and physical-condition readings without treating a steady-current result as a fast-waveform result.
    answer: Frequency-dependent circuit response
    rebuttals:
      - The stable DC resistance is reproducible; it simply does not certify microsecond response.
      - Kirchhoff conservation still holds across the measured branches.
      - The transformer ratio is correct and cannot explain the RL and RLC timing together.


    format: PROPAGATE
    question: "Choose one upgrade costing at most 3 credits that minimizes total fractional uncertainty. Combine the independent percentage contributions by root-sum-square; submit the upgrade and total percent uncertainty."
    answerText: "The bandwidth contribution falls from 18% to 4%; the other contributions remain 3%, 4% and 6%. Four percent is the upgraded component, not the total record uncertainty."
    why: "spend the channel on bandwidth because it dominates peak-voltage uncertainty."

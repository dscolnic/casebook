  stops:
  # --- Stop 49: Find the Fast Recorder
  #     Concept: bandwidth residual; Keystone: K7,K12; Area: Remote Outstation; Learning role: PRACTICE; Difficulty: L3; Story role: RETRIEVE L4.
  #     placement: RESIDUAL, at record-budget.
  - group: COUPLE
    at: record-budget
    title: "Find the Fast Recorder"
    concept: 19   # bandwidth residual
    reason: "The coupling result needs a recorder fast enough to preserve the actual pulse peak."
    scene: "Three channels fit the long baseline equally well, but only one records a 100 ns spike without patterned residuals. Compare residual fields and reject the smooth channel that erases the peak."
    motivation: "The residual pattern identifies which isolated channel can supply a trustworthy peak for the final shot decision."
    format: RESIDUAL
    question: "Compare every residual field, select the recorder with no patterned failure at the 100 ns peak, and submit its channel ID. Use ordered observation coordinates 1–5 on the residual axis."
    answerText: "The completed check shows the fast isolated channel alone has structureless pulse residuals."
    why: "a good average fit cannot certify a fast event it systematically misses."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Do not select lowest baseline RMS when its residual erases the peak.
    # correct result: The fast isolated channel alone has structureless pulse residuals.
    # state/output: unlock S2.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   traces fast/mid/slow with residual arrays; correct fast, not lowest overall slow RMS.
    residual:
      fits:
        - id: patterned_low_error
          label: lower average error but patterned residuals
          rms: 0.18
          structured: true
          residuals:
            - x: 1
              y: -0.12
              value: -0.12
            - x: 2
              y: -0.06
              value: -0.06
            - x: 3
              y: 0
              value: 0
            - x: 4
              y: 0.06
              value: 0.06
            - x: 5
              y: 0.12
              value: 0.12
        - id: unpatterned_generalising
          label: slightly higher error with no directional pattern
          rms: 0.21
          residuals:
            - x: 1
              y: 0.05
              value: 0.05
            - x: 2
              y: -0.04
              value: -0.04
            - x: 3
              y: 0.02
              value: 0.02
            - x: 4
              y: -0.03
              value: -0.03
            - x: 5
              y: 0.01
              value: 0.01
      accept: unpatterned_generalising


    #   labels [m=9.11e-31kg,vperp=2e6,vparallel=1e6,q=1.602e-19C,B=.003T], formulas [r=mvperp/(qB),T=2πm/(qB),pitch=vparallel*T], targets [.00379m,1.191e-8s,.01191m], tolerance 10%. Prompt submit radius in mm, period in ns, pitch in mm, and select "kinetic energy unchanged." Answer 3.79 mm,11.9 ns,11.9 mm; ω=qB/m.

    examples:
    - {"title":"Field around a straight wire","problem":"A long straight wire carries 10 A. Find field 0.1 m away, using μ0/(2π)=2×10^-7 T m/A.","rule":"B=μ0 I/(2πr).","steps":["Set up the relationship: B=μ0 I/(2πr).","B=(2×10^-7)(10)/0.1=2×10^-5 T=20 μT."],"answer":"The field magnitude is 20 μT; its direction circles the wire by the right-hand rule.","mistake":"The straight-wire field falls as 1/r, not 1/r²."}
    - {"title":"Force on a moving charge","problem":"A 2 C positive charge moves perpendicular to a 3 T magnetic field at 4 m/s. Find force magnitude.","rule":"F=|q|vB sin θ.","steps":["Set up the relationship: F=|q|vB sin θ.","θ=90°, so F=2(4)(3)=24 N."],"answer":"Magnetic-force magnitude is 24 N; direction is perpendicular to both velocity and field.","mistake":"A charge moving parallel to the field would feel zero magnetic force."}
    - {"title":"Force on a wire segment","problem":"A straight 0.5 m wire carries 2 A perpendicular to a 4 T field. Find magnetic-force magnitude.","rule":"F=ILB sin θ.","steps":["Set up the relationship: F=ILB sin θ.","F=2(0.5)(4)=4 N."],"answer":"Force magnitude is 4 N.","mistake":"Only the component perpendicular to the field contributes."}
    - {"title":"Magnetic force and speed","problem":"A charged particle moves in a magnetic field with no electric field. Explain why magnetic force alone does not change kinetic energy.","rule":"Magnetic force q v×B is perpendicular to velocity.","steps":["Instantaneous power P=F·v=0 because the vectors are perpendicular.","No work is done by that force, though the direction of motion can change."],"answer":"Magnetic force alone changes direction, not kinetic energy.","mistake":"A curved path does not necessarily mean changing speed."}
    - {"title":"Force on negative charge","problem":"A charge q=-2 μC is in a field E=3000 N/C rightward. Find its force, right positive.","rule":"F=qE.","steps":["Set up the relationship: F=qE.","F=(-2×10^-6)(3000)=-0.006 N=-6 mN."],"answer":"The force is 6 mN to the left.","mistake":"A negative charge feels force opposite the electric field."}


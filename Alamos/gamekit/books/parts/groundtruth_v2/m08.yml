    title: "Track a Charged Particle"
    concept: 22   # particle motion/mass spectrometer
    reason: "The predicted magnetic field must be translated into particle motion before it is blamed for equipment damage."
    scene: "At the outstation, an electron enters B=3.0 mT with perpendicular speed 2.0×10^6 m/s and parallel speed 1.0×10^6 m/s. Estimate its helical radius, then use the result card to inspect period, pitch, and the physical justification."
    motivation: "The electron's radius and helical motion characterize magnetic deflection without treating the field as a source of kinetic energy."
    format: BALLPARK
    question: "Using the displayed electron constants, assemble r=mv⊥/(|q|B), convert the result to millimetres, and submit the radius. Then state whether the magnetic field changes the electron's kinetic energy."
    answerText: "The completed check shows r=3.79 mm, T=11.9 ns, pitch=11.9 mm; K unchanged."
    why: "a magnetic field bends perpendicular motion but leaves parallel speed and kinetic energy unchanged."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Use v⊥ for radius, v∥ for pitch, and remember magnetic force does no work.
    # correct result: r=3.79 mm, T=11.9 ns, pitch=11.9 mm; K unchanged.
    # state/output: unlock S4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in

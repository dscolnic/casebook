  # --- Stop 31: Track a Charged Particle
  #     Concept: particle motion/mass spectrometer; Keystone: K9,K8; Area: Screened Room; Learning role: PRACTICE; Difficulty: L3; Story role: PRACTICE L3.
  #     placement: BALLPARK, at cable-bay.

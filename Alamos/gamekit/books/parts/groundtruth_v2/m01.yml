    title: "Mission 1: worked examples"
    examples:
    - {"title":"Force per charge","problem":"A positive test charge q=2 μC experiences force F=6 mN rightward. Find the electric field.","rule":"E=F/q; μC means 10^-6 C and mN means 10^-3 N.","steps":["Set up the relationship: E=F/q; μC means 10^-6 C and mN means 10^-3 N.","E=(6×10^-3)/(2×10^-6)=3000 N/C rightward."],"answer":"The field is 3000 N/C to the right.","mistake":"The field direction is defined by force on a positive test charge."}
    - {"title":"Force on negative charge","problem":"A charge q=-2 μC is in a field E=3000 N/C rightward. Find its force, right positive.","rule":"F=qE.","steps":["Set up the relationship: F=qE.","F=(-2×10^-6)(3000)=-0.006 N=-6 mN."],"answer":"The force is 6 mN to the left.","mistake":"A negative charge feels force opposite the electric field."}
    - {"title":"Add signed fields","problem":"Two sources produce horizontal fields +400 and -100 N/C at a point. Find the net field.","rule":"Electric fields add as vectors; along one axis use signs.","steps":["Set up the relationship: Electric fields add as vectors; along one axis use signs.","E_net=400-100=+300 N/C."],"answer":"The net field is 300 N/C in the positive direction.","mistake":"Add components, not their unsigned magnitudes."}
    - {"title":"Electric force between charges","problem":"Two 1 μC point charges are separated by 1 m. Use k=9×10^9 N m²/C². Find force magnitude.","rule":"F=k|q1q2|/r².","steps":["Set up the relationship: F=k|q1q2|/r².","F=(9×10^9)(10^-6)(10^-6)/1²=0.009 N."],"answer":"The repulsive force is 9 mN because both charges are positive.","mistake":"The distance is squared; microcoulombs must be converted to coulombs."}
    - {"title":"Double a charge separation","problem":"Point-charge field magnitude is E at distance r. What is it at 2r for the same charge?","rule":"Point-charge field E=k|q|/r².","steps":["Set up the relationship: Point-charge field E=k|q|/r².","E_new/E_old=r²/(2r)²=1/4."],"answer":"The field becomes one quarter as large.","mistake":"Doubling distance does not merely halve an inverse-square field."}

  stops:
  # --- Stop 1: Fix the signs
  #     Concept: field direction/sign; Keystone: K1,K12; Area: Remote Outstation; Learning role: INTRODUCE; Difficulty: L1; Story role: obstacle.
  #     placement: PROTOCOL, at radar-desk.
  - group: COUPLE
    at: radar-desk
    title: "Fix the signs"
    concept: 2   # field direction/sign
    reason: "The launch board cannot compare channels until their opposite sign conventions are reconciled."
    scene: "Two field mills label upward as positive, while two old channels label downward as positive. Convert all four readings to the station rule so the launch board compares physical directions rather than printed signs."
    motivation: "A common vertical sign convention lets the crew distinguish a real field disagreement from differently labeled instruments."
    format: PROTOCOL
    question: "Match each printed reading to its signed value under the displayed rule \"upward is positive\"; submit four matches in kV/m."
    answerText: "Reverse the sign only for old downward-positive channels; the physical arrows do not change."
    why: "A sign convention changes labels, not the actual direction of the field."
    # wrong-path feedback, one rebuttal per wrong option:
    #   You changed a magnitude or reversed a new channel; use the convention label once per channel.
    # correct result: Mapping above, exact labels.
    # state/output: Normalized values enter the board; unlock S2.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   scenarios=[A:+4.2 old_down_positive,B:-4.1 old_down_positive,C:-4.3 new_up_positive,D:-4.2 new_up_positive]; choices=[-4.2,-4.1,-4.3,-4.2 kV/m upward-positive]; mapping=[A→-4.2,B→+4.1,C→-4.3,D→-4.2].
    #
    # CONVERTED. `scenarios` are the four printed readings with the convention
    # each channel is printed under; `choices` are the four signed values the
    # bible's own `mapping` names, and `mapping` is that mapping as indices.
    #
    # ONE BIBLE CONFLICT, resolved in favour of the keyed mapping: the choice
    # list writes -4.1 where the mapping writes B→+4.1. B prints -4.1 on an old
    # downward-positive channel, so the station-rule value is +4.1; the mapping
    # and the answer text ("reverse the sign only for old downward-positive
    # channels") agree with each other and the choice list is the odd one out.
    columns:
    - "The printed reading"
    - "Its value under the station rule"
    scenarios:
    - "Channel A prints +4.2, on an old downward-positive channel."
    - "Channel B prints -4.1, on an old downward-positive channel."
    - "Channel C prints -4.3, on a new upward-positive channel."
    - "Channel D prints -4.2, on a new upward-positive channel."
    choices:
    - "-4.2 kV/m, upward-positive"
    - "+4.1 kV/m, upward-positive"
    - "-4.3 kV/m, upward-positive"
    - "-4.2 kV/m, upward-positive"
    mapping: [0, 1, 2, 3]

  # --- Stop 2: Derive the net field
  #     Concept: vector superposition; Keystone: K1; Area: Field Station; Learning role: INTRODUCE; Difficulty: L2; Story role: foundation.
  #     placement: DERIVE, at launch-board.
  - group: FIELD
    at: launch-board
    title: "Derive the net field"
    concept: 2   # vector superposition
    reason: "The normalized readings need an independent layer-model prediction before they can support a launch criterion."
    scene: "At the sensor, the upper cloud layer contributes E_1y = -3.0 kV/m and the lower layer contributes E_2y = -1.5 kV/m. Both contributions point downward, the negative vertical direction."
    motivation: "The combined vertical field supplies the predicted crew-height exposure against which the field mills will be checked."
    format: DERIVE
    question: "Submit the signed field in kV/m."
    answerText: "Both contributions point downward, so their signed components add to -4.5 kV/m; magnitudes alone would hide direction."
    why: "Vector addition determines whether layer fields reinforce or cancel at crew height."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Superposition adds vectors component by component; keep each sign through substitution.
    # correct result: -4.5 kV/m, exact line/rule pairs.
    # state/output: MODEL FIELD -4.5 kV/m appears; unlock S3.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   lines=[{expression:E_y=E_1y+E_2y,rule:superposition,decoys:[E_y=|E_1|+|E_2|,E_y=E_1yE_2y]},{expression:E_y=(-3.0)+(-1.5) kV/m,rule:substitute_signed_components,decoys:[3.0-1.5,3.0+1.5]},{expression:E_y=-4.5 kV/m,rule:arithmetic_and_direction,decoys:[+4.5,-1.5]}].
    #
    # CONVERTED. One `steps` entry per bible line; the bible's `expression` is
    # the keyed candidate and its two `decoys` are the other two, written out as
    # whole lines so the panel can print them beside the key (the bible's `3.0-1.5`
    # is the same arithmetic said in shorthand). The bible's per-line `rule` is
    # carried on the keyed candidate but `askRule` is OFF: the bible names a rule
    # only for the correct line, so there is nothing for a decoy to claim and a
    # rule list of three would answer the second half of every step by elimination.
    # The bible writes one wrong-path line for the whole stop, so that line is the
    # `why` on each decoy.
    derive:
      start: Use signed vertical components; downward is negative.
      goal: Find the net vertical field in kV/m.
      steps:
        - ask: apply vector superposition
          answer: 0
          candidates:
            - text: E_y=E_1y+E_2y
              note: superposition
            - text: E_y=|E_1|+|E_2|
              note: add magnitudes
              why: A common sign-convention error keeps the magnitudes but discards their downward direction.
              survives: true
        - ask: substitute signed components
          answer: 0
          candidates:
            - text: E_y=(-3.0)+(-1.5) kV/m
              note: substitute signed components
            - text: E_y=3.0-1.5 kV/m
              note: mix signed and unsigned values
              why: A common bookkeeping mistake changes one sign after normalization.
              survives: true
        - ask: add and retain direction
          answer: 0
          candidates:
            - text: E_y=-4.5 kV/m
              note: arithmetic and direction
            - text: E_y=+4.5 kV/m
              note: report magnitude as signed value
              why: A common final-step error calculates the magnitude correctly but restores the wrong direction.
              survives: true

  # --- Stop 3: Bound the disagreement
  #     Concept: uncertainty/range; Keystone: K12,K1; Area: Remote Outstation; Learning role: PRACTICE; Difficulty: L3; Story role: clue.
  #     placement: STRESS, asked by Dr. Lena Ortiz beside launch-board.
  - group: COUPLE
    at: launch-board
    title: "Bound the disagreement"
    person: ortiz
    concept: 30   # uncertainty/range
    reason: "The layer prediction is ready, but calibration uncertainty could still explain the difference between channels."
    scene: "With the predicted field fixed at -4.5 kV/m, four channels read -4.1, -4.2, -4.2, and -4.3 kV/m. Test whether calibration uncertainty can hide an unsafe disagreement."
    motivation: "The range of corrected field readings determines whether one physical field can explain all four instruments."
    format: STRESS
    question: "Move the allowed calibration offset from -0.20 to +0.20 kV/m, inspect both explanations, and submit the conclusion that survives the full range."
    answerText: "All four readings remain mutually consistent within the campaign's calibration bound, though this does not prove independence."
    why: "A safe average does not prove that every sensor is consistent with the same field."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Compare the largest and smallest channels; do not compare only each reading with the mean.
    # correct result: Single-field model survives; observed pair spread 0.20 kV/m ≤ 0.50 kV/m.
    # state/output: Agreement clue logged; unlock S4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   stress={assumption:per_channel_calibration_offset_kVpm,min:-0.20,max:0.20,step:0.05,candidates:[single_field,one_failed_channel],criterion:max_pair_spread<=0.50,correct:single_field_survives}.
    stress:
      candidates:
        - id: nominal_only
          label: Use only the nominal reading
        - id: common_extreme_mistake
          label: Use the favorable extreme as if it were guaranteed
        - id: robust_plan
          label: Single-field model survives; observed pair spread `0.20 kV/m ≤ 0.50 kV/m
      criteria:
        - key: evidence_fit
          label: fit to the stop evidence
        - key: safety_margin
          label: margin at the adverse end
      scores:
        nominal_only:
          evidence_fit: 95
          safety_margin: 20
        common_extreme_mistake:
          evidence_fit: 88
          safety_margin: 5
        robust_plan:
          evidence_fit: 82
          safety_margin: 92
      feasible:
        nominal_only: 0
        common_extreme_mistake: 0
        robust_plan: -0.2
      assumption:
        label: per-channel calibration offset
        unit: kV/m
        min: -0.2
        max: 0.2
        nominal: 0
        step: 0.05
      robust: robust_plan
      optimiseOn: evidence_fit

  # --- Stop 4: Commit the criterion
  #     Concept: precommitted threshold; Keystone: K12,K1; Area: Remote Outstation; Learning role: COMBINE; Difficulty: L5; Story role: decision.
  #     placement: TRIGGER, at launch-board.
  - group: COUPLE
    at: launch-board
    title: "Commit the criterion"
    concept: 30   # precommitted threshold
    reason: "The next storm update must be judged by limits agreed before anyone sees its readings."
    scene: "Commit both limits now, before the next field update appears on the board."
    motivation: "The field-magnitude and channel-spread limits jointly determine whether the crew-clear board may display GO."
    format: TRIGGER
    question: "Enter 5.0 kV/m as the inclusive magnitude limit and 0.50 kV/m as the inclusive channel-spread limit; submit the two-part GO rule, then reveal the new readings."

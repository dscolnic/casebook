    - {"title":"A missing branch current","problem":"A node receives 8 mA and sends 3 mA through one branch. Find the other outgoing current in steady state.","rule":"Charge conservation requires total incoming current equal total outgoing current.","steps":["Set up the relationship: Charge conservation requires total incoming current equal total outgoing current.","8=3+I, so I=5 mA outward."],"answer":"The missing outgoing current is 5 mA.","mistake":"Do not add incoming and outgoing magnitudes as if they point the same way."}

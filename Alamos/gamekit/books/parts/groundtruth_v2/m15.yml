    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   control:{candidates:[{id:"twist_pair",label:"twist the signal pair"},{id:"lower_gain",label:"lower receiver gain"},{id:"add_resistor",label:"add series resistance"}],correct_control:"twist_pair",baseline:{peak:310,unit:"V"},response:{peak:72,unit:"V"},noise_band:{value:8,unit:"V"},fixed:["source","gain","resistance","sampling"],restore:{required:true,peak:305,unit:"V",remeasure:true},final_setting:{twist_pair:"fastened",peak:74,unit:"V"},correct_conclusion:"loop area caused the pickup",answerText:"Twisting the pair collapses the induced peak, restoration brings it back, and refastening makes the repair permanent."}

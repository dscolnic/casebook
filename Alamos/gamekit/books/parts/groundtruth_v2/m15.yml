    at: cable-bay
    title: "Reverse the Loop Geometry"
    concept: 24   # loop-area causality
    reason: "The proposed loop reduction needs a reversible test before the crew fastens the repair permanently."
    scene: "Measure induced peak in all three states before permanent fastening."
    motivation: "The before-and-after pulse peaks test whether loop geometry causes the card's remaining overvoltage."
    format: CONTROL
    question: "Change only pair twisting while source, gain, resistance, and sampling stay fixed; measure original, twisted, and restored peaks; restore once, fasten permanently, remeasure, and submit the causal conclusion."
    answerText: "The completed check shows twisting causes 310→72 V; reversal gives 305 V; final repair gives 74 V."
    why: "reduced loop area should lower flux and voltage, with reversal restoring the old peak."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A low value without reversal is correlation; untwist once before permanent fastening.
    # correct result: Twisting causes 310→72 V; reversal gives 305 V; final repair gives 74 V.

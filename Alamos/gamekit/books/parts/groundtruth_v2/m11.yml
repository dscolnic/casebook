  # --- Stop 41: Close the Strike-Current Ledger
  #     Concept: current ledger; Keystone: K7; Area: Screened Room; Learning role: PRACTICE; Difficulty: L3; Story role: RETRIEVE L4.
  #     placement: BALANCE, at shunt-rack.
  - group: SCREEN
    at: shunt-rack
    title: "Close the Strike-Current Ledger"
    concept: "current ledger"
    reason: "clamp total must equal named branches."
    scene: "The base clamp reads 30 kA, while three down-conductor shunts total only 20 kA. Decide which readings count, close the ledger, and compute the missing current.\", and record the result with its physical justification in the station report."
    motivation: "charge conservation makes an unmeasured branch a physical requirement, not optional speculation."
    format: BALANCE
    question: "Choose which identified streams count once, close the 30 kA current ledger, and submit the missing branch current in kA."
    answerText: "The completed check shows the unlisted branch carries 10 kA. A closed ledger enforces current conservation."
    why: "charge conservation makes an unmeasured branch a physical requirement, not optional speculation."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Do not count the duplicate display as a second physical stream.
    # correct result: The unlisted branch carries 10 kA. A closed ledger enforces current conservation.
    # state/output: Record the result and unlock the next named stop.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   balance:{streams:[{id:"clamp_total",direction:"in",value:30,unit:"kA",counts:true},{id:"shunt_1",direction:"out",value:8,unit:"kA",counts:true},{id:"shunt_2",direction:"out",value:7,unit:"kA",counts:true},{id:"shunt_3",direction:"out",value:5,unit:"kA",counts:true},{id:"duplicate_display",direction:"none",value:30,unit:"kA",counts:false,reason:"duplicate display of the clamp"}],equation:"missing=clamp-sum(shunts)",correct:10,tolerance:0.5,answerText:"Ten kiloamperes require an unmeasured path; the duplicate clamp display is not another current stream."}
    #
    # CONVERTED, and this is a model conversion. The bible writes five streams
    # with an in/out direction and an equation that subtracts. The engine's
    # BALANCE is a ledger: one total, and the streams that have to account for it.
    # So the clamp's 30 kA becomes the `total` rather than a stream, the three
    # shunts stay as they are, the bible's `correct: 10` becomes the one stream
    # that does not announce itself (`hidden`), and the duplicate display keeps
    # its 30 kA and is `countable: false` — the bible's `counts: false`.
    # 8 + 7 + 5 + 10 closes on 30; the three visible shunts alone reach 20, so
    # leaving the hidden branch out is wrong by 10 kA against a 0.5 kA tolerance.
    relationship: "missing = clamp total - the sum of the shunts"
    balance:
      total: { amount: 30, unit: "kA", label: "Base clamp total" }
      tolerance: 0.5
      streams:
      - { id: shunt_1, label: "Down-conductor shunt 1", value: 8, unit: "kA" }
      - { id: shunt_2, label: "Down-conductor shunt 2", value: 7, unit: "kA" }
      - { id: shunt_3, label: "Down-conductor shunt 3", value: 5, unit: "kA" }
      - { id: unmeasured, label: "The unlisted branch", value: 10, unit: "kA", hidden: true }
      - { id: duplicate_display, label: "Second screen reading 30 kA", value: 30, unit: "kA",
          countable: false, unitNote: "Duplicate display of the clamp." }
      commit: "Report the missing current"


  # --- Stop 43: Isolate Conduit Current
  #     Concept: bond causality; Keystone: K7,K8,K12; Area: Remote Outstation; Learning role: PRACTICE; Difficulty: L3; Story role: TRANSFER L4.
  #     placement: CONTROL, at conduit-bond.
  - group: COUPLE
    at: conduit-bond
    title: "Isolate Conduit Current"
    concept: 30   # bond causality
    reason: "The conduit prediction must be tested by changing its approved link without changing the bank pulse."
    scene: "Because the field predicts 10 kA, open only the approved test link, keep bank pulse, shunts, and geometry fixed, then restore the link. Measure clamp-minus-shunt current each time."
    motivation: "The reversible clamp-minus-shunt difference tests whether the conduit actually carries the missing current."
    format: CONTROL
    question: "Change only the approved conduit link from closed to open while pulse, shunts, and geometry stay fixed. Measure clamp-minus-shunt current after the link settles, restore closed and remeasure, then submit the numerical comparison and causal conclusion."
    answerText: "The completed check shows open removes the 10 kA difference; restore returns it."
    why: "loss and return of the missing current ties it to the conduit branch."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Operate only the approved link and complete the restoration measurement before concluding.
    # correct result: Open removes the 10 kA difference; restore returns it.
    # state/output: Record the result and unlock the next named stop.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   control:{candidates:[{id:"test_link",label:"approved conduit link"},{id:"stage_voltage",label:"stage voltage"},{id:"shunt_gain",label:"shunt gain"}],correct_control:"test_link",baseline:{state:"closed",difference_current:10,unit:"kA"},response:{state:"open",difference_current:0.3,unit:"kA"},noise_band:{value:0.5,unit:"kA"},fixed:["pulse","shunts","geometry"],measure_when:"after each link state settles",restore:{required:true,state:"closed",remeasure:true},correct_conclusion:"the conduit carried the missing current",answerText:"Opening only the conduit link removes the clamp-minus-shunt current beyond noise; restoration brings it back."}
    #
    # CONVERTED the same way as mission 7 stop 3: `fixed` → `held`,
    # `correct_control` → `truth`, `noise_band` → `noise`, and the engine's
    # `response` is the signed change, so the bible's closed-link 10 kA and
    # open-link 0.3 kA give -9.7.
    control:
      observable: { label: "Clamp minus shunt current", unit: "kA" }
      variables:
      - { id: test_link, label: "approved conduit link" }
      - { id: stage_voltage, label: "stage voltage" }
      - { id: shunt_gain, label: "shunt gain" }
      held: ["pulse", "shunts", "geometry"]
      truth: test_link
      baseline: 10
      response: -9.7
      noise: 0.5
      changeVerb: "Open"
      run: "Measure after the link settles"
      commit: "Name the cause"


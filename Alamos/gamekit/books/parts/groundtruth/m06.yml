  #     placement: DERIVE, at s21-derive-stored-bank-energy.
  - group: BANK
    at: bank-stages
    title: "Derive Stored Bank Energy"
    concept: "capacitor energy"
    reason: "authorization needs energy from first principles."
    scene: "Each of twelve stages has C=100 nF and charges to V=50.0 kV. Derive the bank's total stored energy before anyone removes the earthing stick.\", and record the result with its physical justification in the station report."
    motivation: "summing stage energy avoids misusing the discharge-equivalent capacitance."
    format: DERIVE
    question: "Build the four-line energy derivation beginning with dU=Vdq, name each rule, and submit total twelve-stage stored energy in joules."
    answerText: "The completed check shows twelve stages store 1.50 kJ. Integrating V dq gives ½CV² per stage."
    why: "summing stage energy avoids misusing the discharge-equivalent capacitance."

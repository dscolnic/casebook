    format: SWEEP
    question: "Sweep only first-gap spacing from 4 through 10 mm while total energy remains 1.50 kJ, measure voltage and rise time at inspected points, and submit one inspected setting meeting both goals."
    answerText: "The completed check shows choose 8 mm. It is the inspected setting meeting rise-time and breakdown bounds."
    why: "gap geometry changes the pulse front even when stored energy stays fixed."
    # wrong-path feedback, one rebuttal per wrong option:

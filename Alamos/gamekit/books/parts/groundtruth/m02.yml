  #     placement: RESIDUAL, at s08-test-spatial-consistency.
  - group: COUPLE
    at: TODO               # the fixture it is asked at
    title: "Test spatial consistency"
    concept: "model residuals"
    reason: "One local match cannot justify a layer model across the flat."
    scene: "Now that σ predicts -9.0 kV/m, compare residual maps from a uniform layer and a compact charged pocket. Choose the model whose residuals are structureless, not merely smallest on average, and the team needs this result before it acts."
    motivation: "A spatial pattern means the model is missing physics even when its mean error is small."
    format: RESIDUAL
    question: "Inspect both four-station residual fields and submit the model with no directional pattern."
    answerText: "Its small residuals alternate without a gradient; the pocket leaves a west-east trend."
    why: "A spatial pattern means the model is missing physics even when its mean error is small."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Lowest RMS helps, but the decisive test is unmodeled spatial structure.
    # correct result: uniform layer.
    # state/output: report piece 2; M3.

- title: "Bound the Layer Charge"
  card:
    header: "14 DAYS TO FINAL STORM WINDOW"
    title: "Bound the Layer Charge"
    goNow: "Go to the Field Station and meet Ravi Sen, field scientist, at the mill bench."
    body: "The crew-clear rule works, but it does not explain the charge above the flat. Electric flux counts field passing through a surface, and symmetry can turn that count into enclosed charge. You will choose a Gaussian surface, derive the layer field, and infer charge density. By the end of the mission, decide whether the storm layer can account for the measured field."
    objective: "Infer the effective layer charge from the mill array."
  objective: "Infer the effective layer charge from the mill array."
  stake: "The crew-clear rule works, but it does not explain the charge above the flat. Electric flux counts field passing through a surface, and symmetry can turn that count into enclosed charge. You will choose a Gaussian surface, derive the layer field, and infer charge density. By the end of the mission, decide whether the storm layer can account for the measured field."
  takeaway: "Evidence must match the mechanism, units, and stated limits."
  segue: "Mission decision: Use the field map to mark the mast tip. The strongest field is near the close contours. The cabinet blocks the static field. Next, test the storm model."

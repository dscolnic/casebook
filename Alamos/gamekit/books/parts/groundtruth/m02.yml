  stops:
  # --- Stop 5: Derive the sheet field
  #     Concept: Gauss infinite sheet; Keystone: K2; Area: Field Station; Learning role: INTRODUCE; Difficulty: L3; Story role: foundation.
  #     placement: DERIVE, at s05-derive-the-sheet-field.
  - group: FIELD
    at: sheet-cage
    title: "Derive the sheet field"
    concept: "Gauss infinite sheet"
    reason: "The field-to-charge conversion must be derived before the array can use it."
    scene: "The storm base is much wider than the station, so its field is nearly perpendicular to a small pillbox. Derive the field on either side from Gauss's law before inserting measurements."
    motivation: "Symmetry makes the two pillbox faces equal and the curved side contribute zero flux."
    format: DERIVE
    question: "Build the two-line symbolic derivation and name Gauss's law with planar symmetry, then submit E=σ/(2ε₀)."
    answerText: "Two equal faces carry flux; area cancels."
    why: "Symmetry makes the two pillbox faces equal and the curved side contribute zero flux."
    # wrong-path feedback, one rebuttal per wrong option:
    #   The pillbox encloses σA, not σ, and has two active faces.
    # correct result: exact symbolic result.
    # state/output: model unlocks S2.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   lines=[{2EA=σA/ε0,gauss_plus_two_faces,[EA=σA/ε0,4EA=σA/ε0]},{E=σ/(2ε0),cancel_A,[E=σ/ε0,E=2σε0]}].

  # --- Stop 6: Sort the flux faces
  #     Concept: flux angle; Keystone: K2; Area: Field Station; Learning role: PRACTICE; Difficulty: L2; Story role: obstacle.
  #     placement: PROTOCOL, at s06-sort-the-flux-faces.
  - group: FIELD
    at: TODO               # the fixture it is asked at
    title: "Sort the flux faces"
    concept: "flux angle"
    reason: "Ravi needs to know which surfaces belong in the integral."
    scene: "With the sheet result available, Ravi rotates a virtual pillbox around the layer. Match each face orientation to positive, negative, or zero flux so the instrument integrates the correct surfaces."
    motivation: "The dot product, not area alone, decides each surface's signed contribution."
    format: PROTOCOL
    question: "Match all three faces to signed flux and submit the mapping."
    answerText: "cos0=1, cos180=-1, cos90=0."
    why: "The dot product, not area alone, decides each surface's signed contribution."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Compare field with the outward normal, not with the surface itself.
    # correct result: as mapped.
    # state/output: faces animate with arrows/text; unlock S3.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   scenarios=[top_normal_with_E,bottom_normal_against_E,side_normal_perpendicular]; choices=[+EA,-EA,0]; mapping=[top→+EA,bottom→-EA,side→0].

  # --- Stop 7: Derive the effective charge density
  #     Concept: sheet plus image/conducting ground; Keystone: K2,K4; Area: Mast Base; Learning role: COMBINE; Difficulty: L3; Story role: clue.
  #     placement: DERIVE, at s07-derive-the-effective-charge-density.
  - group: MAST
    at: TODO               # the fixture it is asked at
    title: "Derive the effective charge density"
    concept: "sheet plus image/conducting ground"
    reason: "The measured field must become a charge density with units and sign."
    scene: "Because the conducting ground mirrors the layer field, the station model uses E_ground=σ/ε₀, not the isolated-sheet value. Use the measured E=-9.0 kV/m to derive the effective density, and record the result with its physical justification in the station report."
    motivation: "The conductor boundary doubles the isolated-sheet field between cloud and ground."
    format: DERIVE
    question: "Build four lines, name the rule at each step, and submit σ in C/m²; use ε₀=8.854×10^-12 C²/(N·m²) and E=-9.0×10³ N/C."
    answerText: "σ=ε₀E=(8.854×10^-12)(-9.0×10³)=-7.97×10^-8 C/m²."
    why: "The conductor boundary doubles the isolated-sheet field between cloud and ground."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Convert kV/m to V/m and keep the field sign.
    # correct result: -7.97×10^-8 C/m², tolerance ±0.04×10^-8.
    # state/output: density posted; unlock S4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   lines=[{E=σ/ε0,conductor_boundary,[E=σ/(2ε0),E=2σ/ε0]},{σ=ε0E,algebra,[σ=E/ε0,σ=ε0/E]},{σ=(8.854e-12)(-9.0e3),substitution,[... ]},{σ=-7.97e-8 C/m2,arithmetic,[+7.97e-8,-7.97e8]}].


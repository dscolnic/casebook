  #     placement: DIAGNOSIS, Tip and Conveyor — The weightometer.
  - group: TIP
    at: weightometer
    title: "Explain the belt trips"
    concept: 6   # Explain the belt trips
    reason: "The belt trips while its standing load stays below the limit."
    scene: "Ivo Reed notes that the energy page is accepted, but the conveyor keeps tripping even when its scale reports a modest standing load. Read the incoming flow and speed alongside the quiet mass reading to decide which missing force the drive must supply."
    motivation: "The momentum history decides whether the feed arrangement can protect the machinery while keeping ore moving."
    format: DIAGNOSIS
    question: "Read every measurement, including the normal readings, and select the one cause consistent with the whole panel."
    choices:
      - Incoming ore must gain horizontal momentum.
      - The supported ore exceeds the belt mass limit.
      - The ore arrives already moving with the belt.
      - A fixed jam creates force unrelated to flow.
    answer: Incoming ore must gain horizontal momentum.
    answerText: "The quiet mass reading rejects overload, while entry speed and flow-dependent force identify the momentum imparted to the entering ore."
    why: "The quiet mass reading rejects overload, while entry speed and flow-dependent force identify the momentum imparted to the entering ore. The alternative 'The supported ore exceeds the belt mass limit.' fails for this reason: The normal 4000 kg reading is below the mass limit. The alternative 'A fixed jam creates force unrelated to flow.' fails for this reason: The added pull changes with incoming flow, contrary to a flow-independent jam."

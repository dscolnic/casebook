  # --- Stop 22: Derive the force of the stream
  #     Concept: 6 — Derive the force of the stream; Keystone: Forces and boundaries, Momentum and impulse; Area: TIP; Prerequisites: Stop 21 result in the mission log; current mission primer; preceding numbered spine relationships used in the visible data; Learning role: PRACTICE; Difficulty: L3; Story role: reversal.
  #     placement: DERIVE, Tip and Conveyor — The weightometer.
  - group: TIP
    at: weightometer
    title: "Derive the force of the stream"
    concept: 6   # Derive the force of the stream
    reason: "Incoming ore creates a force by gaining momentum."
    scene: "Ivo Reed sees that the panel points to incoming ore gaining speed, so the force depends on material entering rather than only material already present. Derive that momentum rate before using the belt result to investigate the broken bin bolts."
    motivation: "The momentum history decides whether the feed arrangement can protect the machinery while keeping ore moving."
    format: DERIVE
    question: "Build the derivation by selecting one expression at each step; inspect the stated physical reason before committing each line."
    answerText: "In each second 200 kg acquires 5 m/s of horizontal speed, so the belt supplies 1000 kg m/s of momentum per second; the equal opposite reaction loads the drive."
    why: "In each second 200 kg acquires 5 m/s of horizontal speed, so the belt supplies 1000 kg m/s of momentum per second; the equal opposite reaction loads the drive. Dividing by elapsed time when finding incoming mass reverses the definition of mass flow. Squaring speed gives energy per time units, not the force supplied by the belt. During Δt, incoming mass Δm=ṁΔt gains horizontal speed from 0 to v; ṁ=200 kg/s and v=5 m/s; ignore horizontal drag after loading."
    # wrong-path feedback, one rebuttal per wrong option:
    #   **1:** Dividing by elapsed time when finding incoming mass reverses the definition of mass flow. **2:** Squaring speed gives energy per time units, not the force supplied by the belt.
    # correct result: F=Δp/Δt=ṁv=1000 N for ṁ=200 kg/s and v=5 m/s. Acceptance: exact authored key.
    # state/output: The weightometer gains a dated evidence slip: F=Δp/Δt=ṁv=1000 N for ṁ=200 kg/s and v=5 m/s

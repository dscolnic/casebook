  # --- Stop 30: Turn lift work into power
  #     Concept: 8 — Turn lift work into power; Keystone: Motion and derivatives, Energy accounting, Power and rate; Area: WIND; Prerequisites: Stop 29 result in the mission log; current mission primer; preceding numbered spine relationships used in the visible data; Learning role: PRACTICE; Difficulty: L3; Story role: clue.
  #     placement: DERIVE, Winder House — The winder desk.
  - group: WIND
    at: winder-desk
    title: "Turn lift work into power"
    concept: 8   # Turn lift work into power
    reason: "The full trip's energy can still arrive too slowly."
    scene: "Ewan Price sees that the full-length steady pull is established, and the hanging rope becomes shorter as the cage climbs toward the surface. Derive how that changing load affects power so the speed decision uses the most demanding part of the journey."
    motivation: "The largest work rate determines which cruise proposal the motor can sustain."
    format: DERIVE
    question: "Build the derivation by selecting one expression at each step; inspect the stated physical reason before committing each line."
    answerText: "At steady speed the tension work rate is Tv; the largest value occurs at the start of a full-length cruise because that is where the most rope remains suspended."
    why: "Power is the work supplied each second. The chain rule gives dW/dt=(dW/dy)(dy/dt)=Tv, so dividing tension by speed cannot describe power. The hanging rope becomes shorter as the cage rises, which reduces the steady pull. The largest cruise demand therefore occurs with the full length hanging. Substituting the stated mass, length, gravity and speed gives 560000 W. This checks the motor's ability to sustain that cruise; it does not establish the distance needed for an emergency stop."
    # wrong-path feedback, one rebuttal per wrong option:
    #   **1:** dt/dy is the reciprocal speed, not dy/dt; it has the wrong units for power. **2:** At the bottom the hanging rope is longest; the wrong expression reverses which end of the journey carries most rope.
    # correct result: P(y)=[M+λ(L−y)]gv; Pmax=(M+λL)gv. Acceptance: exact authored key.
    # state/output: The winder desk gains a dated evidence slip: P(y)=[M+λ(L−y)]gv; Pmax=(M+λL)gv
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:
    #     start: At constant speed v, lifted distance y leaves hanging length L−y; T(y)=[M+λ(L−y)]g; dW=T dy; v=dy/dt.
    #     goal: Derive cruise power as a function of lift position and speed.
    #     steps:
    #     - id: line1
    #       prompt: Apply the chain rule to work as position changes.
    #       choices:
    #       - line: P=dW/dt=T(dy/dt)=Tv
    #         correct: true
    #       - line: P=dW/dt=T(dt/dy)=T/v
    #         correct: false
    #         survives: true
    #         why: dt/dy is the reciprocal speed, not dy/dt; it has the wrong units for power.
    #     - id: line2
    #       prompt: Locate the greatest hanging weight during the cruise.
    #       choices:
    #       - line: P(y)=[M+λ(L−y)]gv; Pmax=(M+λL)gv
    #         correct: true
    #       - line: P(y)=[M+λy]gv; Pmax=P(y=0)=Mgv
    #         correct: false
    #         survives: true
    #         why: At the bottom the hanging rope is longest; the wrong expression reverses which end of the journey carries most rope.
    #     answerText: At steady speed the tension work rate is Tv; the largest value occurs at the start of a full-length cruise because that is where the most rope remains suspended.
    derive:
      start: At constant speed v, lifted distance y leaves hanging length L−y; T(y)=[M+λ(L−y)]g; dW=T dy; v=dy/dt; M=4000 kg, λ=10 kg/m, L=1200 m, g=10 m/s²; evaluate the full-length cruise at v=3.5 m/s.
      goal: Derive cruise power as a function of lift position and speed.
      steps:
        - ask: Apply the chain rule to work as position changes.
          answer: 0
          candidates:
            - text: P=dW/dt=T(dy/dt)=Tv
            - text: P=dW/dt=T(dt/dy)=T/v
              why: dt/dy is the reciprocal speed, not dy/dt; it has the wrong units for power.
              survives: true
        - ask: Locate the greatest hanging weight during the cruise.
          answer: 0
          candidates:
            - text: P(y)=[M+λ(L−y)]gv; Pmax=(M+λL)gv=(4000+10×1200)×10×3.5=560000 W
            - text: P(y)=[M+λy]gv; Pmax=P(y=0)=Mgv
              why: At the bottom the hanging rope is longest; the wrong expression reverses which end of the journey carries most rope.
              survives: true

  # --- Stop 31: Check a scaled steady drive
  #     Concept: 8 — Check a scaled steady drive; Keystone: Momentum and impulse, Power and rate, Models and evidence; Area: TIP; Prerequisites: Stop 30 result in the mission log; current mission primer; preceding numbered spine relationships used in the visible data; Learning role: COMBINE; Difficulty: L3; Story role: clue.
  #     placement: VERIFY, Tip and Conveyor — The belt drive.

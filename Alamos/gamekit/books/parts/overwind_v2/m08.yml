    title: "Check a scaled steady drive"
    concept: 8   # Check a scaled steady drive
    reason: "The power relation needs an independent drive check."
    scene: "Ivo Reed confirms that the lift calculation identifies where cruise power is largest, but its force-times-speed relation can also be checked on a smaller drive. Predict the useful output before operating that drive and compare the measured rate with the model."
    motivation: "The largest work rate determines which cruise proposal the motor can sustain."
    format: VERIFY
    question: "First, calculate and commit useful power in W from the visible data. OPERATE: run the scaled drive at 2 m/s. Keep the 800 N drive force and load direction fixed. MEASURE: press READ once after the run and record useful power. INTERPRET: compare with your prediction and submit SUPPORTS MODEL or REJECTS MODEL. No restoration or second reading is required; this isolated test resets on retry."
    answerText: "P=800×2=1600 W; the meter supports the steady force-times-speed relation."
    why: "P=800×2=1600 W; the meter supports the steady force-times-speed relation. The alternative '400 W' fails for this reason: Dividing by speed reverses the work-rate relationship. The alternative '800 W' fails for this reason: Force alone has units N, not W. The alternative 'REJECTS MODEL' fails for this reason: Measured power equals the predicted mechanical work rate. Isolated drive applies F=800 N at v=2 m/s with constant speed; useful mechanical power P=Fv."
    # wrong-path feedback, one rebuttal per wrong option:
    #   **400 W:** Dividing by speed reverses the work-rate relationship. **800 W:** Force alone has units N, not W. **REJECTS MODEL:** Measured power equals the predicted mechanical work rate.

  - group: GRAV
    at: level-book
    title: "Derive the ideal depth trend"
    concept: 7   # Derive the ideal depth trend
    reason: "The ideal depth trend must stay separate from local evidence."
    scene: "Nia Cole sees that the repeated reference reveals an instrument offset, which must be separated from any physical effect of going deeper underground. Derive the prediction for a deliberately simple spherical body before deciding what that ideal model can tell the local survey."
    motivation: "Separating a model from a measurement keeps the survey from becoming a false explanation of March."
    format: DERIVE
    question: "Build the derivation by selecting one expression at each step; inspect the stated physical reason before committing each line."
    answerText: "For the stipulated sphere d/R=0.0002, so g=10(0.9998)=9.998 m/s². Real mine geology need not follow this uniform model; the corrected survey, not this idealization, supplies operating g."
    why: "For the stipulated sphere d/R=0.0002, so g=10(0.9998)=9.998 m/s². Real mine geology need not follow this uniform model; the corrected survey, not this idealization, supplies operating g. Inside a uniform sphere the outer shells contribute no net force; retaining the whole mass treats the interior point as outside. The interior radius is smaller, so the uniform-sphere model predicts a smaller gravity, not a larger one."

  # --- Stop 5: Rope-contact radius
  #     Concept: 1 — Rope-contact radius; Keystone: Motion and derivatives, Torque and rotation; Area: WIND; Prerequisites: Stop 4 result in the mission log; current mission primer; preceding numbered spine relationships used in the visible data; Learning role: PRACTICE; Difficulty: L2; Story role: clue.
  #     placement: BALLPARK, Winder House — The winder desk.
  - group: WIND
    at: winder-desk
    title: "Rope-contact radius"
    concept: 1   # Rope-contact radius
    reason: "The working radius must be known before the drum model is corrected."
    scene: "Ewan Price notes that the rejected start puts the drum record under review, and its contact radius must be established before any torque calculation. Use the paired speed readings to identify the working radius rather than trusting the old drawing beside the desk."
    motivation: "The meaning of a motion record determines which part of the passenger proposal can be approved."
    format: BALLPARK
    question: "Choose the quantity tiles for the displayed formula a/b; submit the resulting rope-contact radius in m."
    answerText: R=6/3=2 m; the rope-contact radius is not the drum diameter.
    why: "A point at radius R travels arc length Rθ when the drum rotates through angle θ. Differentiating with respect to time gives the no-slip speed relation v=Rω. The paired readings therefore give R=6/3=2 m. A diameter would be twice this distance and cannot be substituted for the torque arm. Multiplying the two speeds would also have the wrong units for a radius. The measured contact radius is the geometric link needed before the drum's inertia and motor demand can be compared."
    # wrong-path feedback, one rebuttal per wrong option:

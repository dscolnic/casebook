interiors:
  BANK:
    caption: Every wind ends here, and the last three seconds of it are the ones nobody costs.
    standLine: The signal board, the gate, and a chalk mark on the guide where the cage should stop.
    station:
      kind: panel
      title: Landing desk
      rows:
        - { label: 'Winding speed, full', value: 7.2 m/s, status: normal }
        - { label: Ramp up, value: 12 s, status: normal }
        - { label: 'Crawl, present', value: 3.0 s, status: high }
  WIND:
    caption: A drum, a motor and a brake, and eighteen tonnes of steel nobody counts.
    standLine: The drum record from March, still on the desk, showing a stop made on time.
    station:
      kind: panel
      title: Winder desk
      rows:
        - { label: Drum inertia, value: 72200 kg·m², status: high }
        - { label: 'Torque needed, worst instant', value: 390 kN·m, status: normal }
        - { label: 'Power needed, worst instant', value: 1.03 MW, status: high }
  ROPE:
    caption: Twelve hundred metres of steel that weighs three times what it carries.
    standLine: 'The rope record: four re-caps in two years, forty metres shorter, same steel.'
    station:
      kind: panel
      title: Rope bench
      rows:
        - { label: 'Tension at the drum, worst', value: 166 kN, status: high }
        - { label: Stiffness at the inset, value: 110 kN/m, status: alarm }
        - { label: 'Period of the cage on it', value: 1.20 s, status: alarm }
  CAGE:
    caption: What the cage does, what stops it, and where the energy goes.
    standLine: The pad certificate, the position tape from March, and a crush-tested arrestor in the corner.
    station:
      kind: panel
      title: Brake bench
      rows:
        - { label: 'Pads rated, per stop', value: 600 kJ, status: normal }
        - { label: 'Upward emergency stop', value: 558 kJ, status: high }
        - { label: 'Downward emergency stop', value: 1.27 MJ, status: alarm }
  TIP:
    caption: Ore in a stream rather than in a lump, and the force a stream makes.
    standLine: Two sheared bin bolts on the bench, and a belt drive that tripped twice on Friday.
    station:
      kind: panel
      title: Belt desk
      rows:
        - { label: Arrival rate, value: 88.9 kg/s, status: normal }
        - { label: 'Force on the drive, horizontal', value: 222 N, status: normal }
        - { label: 'Force on the frame, vertical', value: 737 N, status: high }
  GRAV:
    caption: Three hundred metres out on the bench, where g is measured rather than assumed.
    standLine: Four years of readings, two of them taken at the bottom of a working shaft.
    station:
      kind: panel
      title: Gravity bench
      rows:
        - { label: 'Gradient, free air', value: 0.3086 mGal/m, status: normal }
        - { label: 'Gradient, this shaft', value: 0.0849 mGal/m, status: high }
        - { label: 'Rock density implied', value: 2.67 g/cm³, status: normal }

warmups:
  # MANDATE 4b: the run before mission 1 is orientation and nothing else. One
  # sentence, purely functional — who is here and what the ground is. It used to
  # carry four sentences of inspection-day plot on a morning the player has met
  # nobody, which is manufactured drama rather than a reason. The mission-4, 8 and
  # 13 runs keep their real reasons: they land once the cast and the argument are
  # known.
  trial-near:
    title: Walk the yard before the inspection
    why: >-
      Five buildings, a headframe and a conveyor, and the rope crosses the yard at head height
      between two of them.
  trial-far:
    title: The bench track, and the hut at the end of it
    why: >-
      The gravity station is three hundred metres out along the bench and the track is peat for the
      last hundred. Take it once before you need to, because the day Dr. Lena Sokol, the geophysicist,
      has the shaft for two hours you will be walking it with an instrument that must not be jarred.
  greet:
    title: Twelve people, and two of them have been arguing for two years
    why: >-
      This shaft runs on an argument between Delia Marchetti, the winding engineer, and Samuel Otieno,
      the chief rope examiner, and you will be carrying numbers between them all fortnight. Get round
      the whole crew first, because half of what is not in the submission is in somebody's notebook.
  follow:
    title: The rope inspection route, walked by the man who splices it
    why: >-
      Kit Nowak, the rope splicer, walks the rope from the drum to the sheave to the cappel on the
      same route every week, and the route is not written down anywhere. Stay with him along it. Where
      he stops is where the rope is watched, and the forty metres that have been cut off it in two
      years were all cut at one of those stops.
  hunt:
    title: Six guide clamps, and the sheet accounts for four
    item: { name: guide clamp, plural: guide clamps }
    why: >-
      The cage runs on steel guides held by clamps, and two of the clamps replaced after March are not
      where the sheet says they are. A clamp nobody can find is either doing nothing or holding a
      guide out of line, and a guide out of line is what turns a bounce into a jam.
  canvass:
    title: Who else felt the March stop
    why: >-
      Eleven men were underground when the brake went on in March and the only record is a drum trace
      and a position tape. Ask round the crew and the fitters until enough accounts agree on what the
      cage did afterwards, because two instruments and no witnesses is not an account of an incident.
  evade:
    title: The maker's man who wants to fit new pads today
    why: >-
      He has driven three hours with a set of pads and wants them on before the inspection, which
      would replace the one piece of physical evidence from March. The argument belongs to Iona Craig,
      the brake fitter, not to you. Keep clear of him and get your round done rather than spending the
      afternoon at the brake house.
  tag:
    title: Catch Sokol before she goes down the shaft
    why: >-
      Dr. Lena Sokol, the geophysicist, has two hours in the shaft on Thursday and she leaves the
      bench at seven. The elevation of the inset station comes off an eighteen-year-old shaft
      measurement, and once she is below ground nobody can hand her anything, so the level book has to
      reach her on the surface.

copy:
  BANK: <p>The bank. A signal board, a gate, and a chalk mark on the guide where the cage should stop, which the cage has been stopping a little past for eight months.</p>
  WIND: <p>The winder house. A drum two metres to the rope, a motor rated at 480 kilonewton metres, and a brake that is held on by weights so that losing the oil applies it rather than releasing it.</p>
  ROPE: <p>The rope shop. Splicing gear, four re-cap records in two years, and a length of locked coil clamped between two anchors with a dial gauge on it.</p>
  CAGE: <p>The brake house, at the foot of the headframe. Pad certificates on the wall, a crush-tested arrestor in the corner, and the position tape from March in a drawer nobody has opened since the inquiry.</p>
  TIP: <p>The tip. Bins, a chute and a belt that carries nine hundred tonnes a shift up to the plant, with two of its mounting bolts sheared and on the bench.</p>
  GRAV: <p>The gravity station, three hundred metres out on the bench. A concrete pillar, a hut, and an instrument that reads where it is standing to a millionth.</p>
  HEAD: <p>The headframe. Thirty-two metres of steel over the shaft, two sheave wheels at the top of it, and the arrestors above the bank that have never been used.</p>
  COMPRESSOR: <p>The compressor house. Air for the drills below, and the loudest building on the site by a long way.</p>
  LAMP: <p>The lamp room. Forty-one lamps on charge, forty-one tallies on the board, and the count that says who is underground.</p>
  CHANGE: <p>The change house. Where a shift starts and ends, and where the men read whatever the winder house has decided about the cycle they ride.</p>

# ---------------------------------------------------------------- review variants
#
# Lessons no mission stop points at. `shapeMissions` reaches a "<title> — Review"
# by title when a callback day wants one, and without these the campaign carries
# no spaced retrieval at all: from day 3 every day looks for the oldest taught
# lesson that has an unserved variant, and finds nothing.
#
# Four bases, all from days 1–3, all chosen so the callback lands in an area the
# day is not already visiting: BANK day 1 and day 2, ROPE day 2, WIND day 1.
# None of them is a DERIVE variant. A derivation is reviewed by applying its
# result to a different case, which is a board rather than a chain of lines —
# and the twelve DERIVE stops are the course, so nothing here touches them.

  # --- Stop 13: Drum angular acceleration
  #     Concept: 4 — Drum angular acceleration; Keystone: Motion and derivatives, Torque and rotation; Area: WIND; Prerequisites: Stop 12 result in the mission log; current mission primer; preceding numbered spine relationships used in the visible data; Learning role: RETRIEVE; Difficulty: L2; Story role: clue.

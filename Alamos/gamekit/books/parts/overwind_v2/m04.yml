    reason: "The motor limit applies to both torque demands together."
    scene: "The angular acceleration is now fixed by the rope motion, and the measured rope pull acts against the motor. Put those effects into one torque equation before deciding whether the slower start fits the installed machine."
    motivation: "The torque result decides which start the installed motor can actually supply."
    format: DERIVE
    question: "Build the derivation by selecting one expression at each step; inspect the stated physical reason before committing each line."
    answerText: "The rope demands 176000×2=352000 N m; changing drum speed demands 45000×1/2=22500 N m; total torque is 374500 N m."
    why: "The rope demands 176000×2=352000 N m; changing drum speed demands 45000×1/2=22500 N m; total torque is 374500 N m. Rope tension opposes the lifting rotation, so it subtracts from motor torque in the net torque equation. At full length, T=176000 N from Day 3; R=2 m; I=45000 kg m²; a=1 m/s²; no slipping or bearing loss in this start model."
    # wrong-path feedback, one rebuttal per wrong option:

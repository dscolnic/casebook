  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Allele", def: "An alternative DNA version at a gene locus."}
  - {name: "Genotype", def: "The allele combination an organism carries."}
  - {name: "Phenotype", def: "An observable trait shaped by genotype and environment."}
  - {name: "Meiosis", def: "Cell division that reduces chromosome sets to form haploid products."}
  - {name: "Recessive", def: "An allele effect masked in a heterozygote under a stated dominance model."}
  - {name: "Locus", def: "A location in a genome."}
  - {name: "Heterozygote", def: "An organism with two different alleles at a locus."}
  - {name: "Homozygote", def: "An organism with two matching alleles at a locus."}
  - {name: "Dominance", def: "The relationship in which a heterozygote shows the specified dominant phenotype."}
  - {name: "Gamete", def: "A reproductive cell that can fuse with another at fertilization."}
  - {name: "Homologous chromosomes", def: "Chromosomes carrying corresponding gene loci, one from each parent in a diploid pair."}
  - {name: "Codominance", def: "Expression of both specified allele products in a heterozygote."}
  - {name: "Incomplete dominance", def: "An intermediate heterozygote phenotype in the stated trait."}
  - {name: "Pleiotropy", def: "One gene affecting several traits."}
  - {name: "Epistasis", def: "One gene altering or masking the effect of another."}

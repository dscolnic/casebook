  #     Concept: 13 — Meiosis and variation; Keystone: Inheritance and variation, Information flow; Area: SEED; Prerequisites: Mission primer and Stop 24: Hold one line; Learning role: PRACTICE; Difficulty: L3; Story role: clue.
  #     placement: SEQUENCE, Seed Room — Seed Table.
  - group: SEED
    at: trace-table
    title: "Follow an allele into a gamete"
    concept: 13   # Meiosis and variation
    reason: "The family investigation needs an inheritance model."
    scene: "The unusual tissue line is held, and its family record points to a trait that may be hidden in some healthy-looking parents. Follow allele separation into gametes before the seed team chooses a cross to test that possibility."
    motivation: "The causal order identifies what the next test must preserve or challenge."
    format: SEQUENCE
    question: "Place every card in the biological causal order; submit the whole order."
    answerText: "Meiosis separates homologous chromosomes and then sister chromatids, reducing chromosome sets in the products. This result is now recorded for the next comparison."
    why: "Meiosis separates homologous chromosomes and then sister chromatids, reducing chromosome sets in the products. Crossing over can exchange corresponding segments between nonsister chromatids while homologues are paired. These events generate new combinations of existing alleles; they do not guarantee new mutations. The family investigation needs this distinction because a trait appearing among offspring can reflect segregation of an existing recessive allele. It is not evidence that the breeding procedure invented the trait or that every offspring must carry the same genotype."

  # --- Stop 28: Choose the informative cross
  #     Concept: 14 — Mendelian probability; Keystone: Inheritance and variation, Experimental evidence; Area: GENE; Prerequisites: Mission primer and Stop 27: Interpret the family evidence; Learning role: COMBINE; Difficulty: L4; Story role: decision.
  #     placement: CHOICE, Nell Shah at Genetics Trailer — Records Board.
  - group: GENE
    at: records-board
    title: "Choose the informative cross"
    concept: 14   # Mendelian probability
    reason: "The breeding decision must preserve the evidence it creates."
    scene: "The family work now separates a simple test-cross prediction from other inheritance patterns, so a visible dominant trait no longer settles a parent genotype. Choose the cross and record-keeping plan that can reveal the hidden allele without erasing ancestry."
    motivation: "Use a test cross and keep each family separate."
    format: CHOICE
    question: "Select the cross and record-keeping plan that can reveal a hidden recessive allele."
    choices:
      - Cross with tt and keep family labels
      - Cross with TT and pool all seeds
      - Self only TT and discard labels
      - Infer genotype from appearance alone
    answer: Cross with tt and keep family labels
    answerText: "A homozygous recessive partner supplies only t, so recessive offspring reveal that the unknown parent supplied t as well. Use a test cross and keep each family separate."
    why: "A homozygous recessive partner supplies only t, so recessive offspring reveal that the unknown parent supplied t as well. A TT unknown predicts none, whereas Tt predicts one-half under the stated assumptions. Finite samples still require careful interpretation, especially when no recessive offspring are observed. Keeping family labels preserves the link between parents, offspring and tests. Pooling would erase the very evidence the cross creates and could lose rare variation that matters in later release decisions."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A TT partner masks the recessive phenotype and pooling destroys ancestry information. A known TT self-cross cannot test the unknown parent. TT and Tt have the same phenotype under complete dominance. Retry: keep the visible evidence, clear only the committed response and reopen this board; no later stop unlocks until a correct submission. For matching/order errors, highlight the first mismatched biological relationship with the specific feedback above; for numerical errors, display the stated formula and substituted units after grading.
    # data: Unknown parent has dominant phenotype and genotype TT or Tt; available partners are TT, Tt and tt; the target trait follows complete dominance without viability differences.
    # correct result: "Cross with tt and keep family labels"; exact label, complete mapping or complete order; no partial completion.
    # state/output: Choose the informative cross is recorded with its evidence on the Genetics Trailer log; A test cross is approved and family labels stay attached to every sample.

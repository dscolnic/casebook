- title: "ONE LETTER IN THE RECIPE"
  card:
    header: "DAY 8 OF 15 — SHIP DEPARTS AFTER DAY 15"
    title: "ONE LETTER IN THE RECIPE"
    goNow: "Go to Genetics Trailer and meet Nell Shah, conservation geneticist, at the DNA Bench."
    body: "The family stays on the list, but one enzyme works poorly. Cells use RNA to turn DNA code into proteins. Trace the code with Nell, then check the enzyme with Mara. Today you decide whether the sequence change can explain the weak enzyme."
    objective: "Resolve whether the sequence change can explain the weak enzyme; the wrong diagnosis could remove a healthy family."
  objective: "Resolve whether the sequence change can explain the weak enzyme; the wrong diagnosis could remove a healthy family."
  stake: "The family stays on the list, but one enzyme works poorly. Cells use RNA to turn DNA code into proteins. Trace the code with Nell, then check the enzyme with Mara. Today you decide whether the sequence change can explain the weak enzyme."
  takeaway: "Treat the changed enzyme as a supported lead, not a complete diagnosis. ---"
  segue: "Mission decision: Treat the changed enzyme as a supported lead, not a complete diagnosis. The changed gene and weak enzyme fit one testable cause."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Transcription", def: "Making an RNA copy using a DNA template."}
  - {name: "Translation", def: "Using mRNA codons to build an amino-acid chain."}
  - {name: "Codon", def: "A three-base mRNA sequence specifying an amino acid or stop."}
  - {name: "Mutation", def: "A change in DNA sequence."}
  - {name: "PCR", def: "A method that amplifies a selected DNA region."}
  - {name: "Template", def: "A strand used to determine a complementary new sequence. mRNA: Messenger RNA read by a ribosome to make a protein. tRNA: Transfer RNA that carries an amino acid and pairs with an mRNA codon."}
  - {name: "Ribosome", def: "The cellular structure that reads mRNA and assembles a protein chain."}
  - {name: "Polymerase", def: "An enzyme that builds a nucleic-acid strand from a template."}
  - {name: "Splicing", def: "Removal and joining of RNA segments during processing."}
  - {name: "Purified enzyme", def: "An enzyme separated from many other sample components for testing."}
  primer:
  - "DNA and RNA synthesis extend in the 5-prime to 3-prime direction."
  - "A sequence change can alter protein structure, but phenotype evidence is still needed."
  - "A gel separates fragments by size and does not read their full sequence."


  #     placement: SEQUENCE, Genetics Trailer — DNA Bench.
  - group: GENE
    at: dna-bench
    title: "Trace the enzyme message"
    concept: 18   # Transcription and translation
    reason: "The enzyme lead needs the path from sequence to function."
    scene: "The family test preserves the line, but a weak digestive enzyme raises a new question about the instructions used to make its protein. Nell Shah asks: \"Trace the message from DNA to folded enzyme before reading the changed sequence as a cause.\""
    motivation: "The causal order identifies what the next test must preserve or challenge."
    format: SEQUENCE
    question: "Place every card in the biological causal order; submit the whole order."
    answerText: "The enzyme message passes through transcription and translation before the polypeptide folds. This result is now recorded for the next comparison."
    why: "The enzyme message passes through transcription and translation before the polypeptide folds. In eukaryotic cells, processing can include a cap, a poly-A tail and splicing before mRNA leaves the nucleus. Ribosomes read codons and tRNAs deliver amino acids; they do not translate DNA directly. Protein structure links the sequence to possible activity. This ordered pathway identifies where a sequence difference could act, while reminding the clinic that a DNA change alone does not measure enzyme function or establish the whole phenotype."

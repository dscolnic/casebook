  - group: GENE
    at: dna-bench
    title: "Read the altered codons"
    concept: 20   # Mutations and biotechnology
    reason: "The changed codon needs a precise predicted effect."
    scene: "The message pathway connects inherited instructions to the enzyme, and the sequence reader now shows several different kinds of change in comparison samples. Nell Shah asks: \"Classify their effects on codons before the clinic compares the specific weak-enzyme line with its reference.\""
    motivation: "Distinguishing these mechanisms keeps the next handling decision tied to the evidence."
    format: PROTOCOL
    question: "Match each labeled observation to one explanation; submit all matches, using each explanation once."
    choices:
      - Frameshift mutation
      - Nonsense substitution
      - Missense substitution
      - Silent substitution
    answerText: "The supplied codon meanings make each classification answerable without an external table. This result is now recorded for the next comparison."
    why: "The supplied codon meanings make each classification answerable without an external table. A silent substitution preserves the amino acid, a missense substitution changes it, and a nonsense substitution introduces a premature stop. A one-base deletion changes downstream grouping in the stated coding sequence. These categories predict different possible effects on a protein, but none guarantees the magnitude of the organismal phenotype. The clinic must compare actual enzyme activity and appropriate controls before deciding how strongly to treat the sequence as an explanation."

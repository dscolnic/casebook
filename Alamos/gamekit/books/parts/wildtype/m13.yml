    question: "Order the selected route from nitrogen gas through organic litter to nitrate uptake; other valid nitrogen-cycle routes are outside these cards. Submit all four cards."
    answerText: "This sequence is a simplified selected route through the nitrogen cycle, not the only path nitrogen can take. This result is now recorded for the next comparison."
    why: "This sequence is a simplified selected route through the nitrogen cycle, not the only path nitrogen can take. Fixation introduces reduced nitrogen from gas, ammonification returns organic nitrogen to ammonium, nitrification forms nitrate, and roots can assimilate nitrogen into organic molecules. Plants can also use ammonium in appropriate conditions. The route explains why total nitrogen alone does not state what the receiving roots can access. Microbial transformations and soil conditions connect the partner evidence to the actual planting-site preparation."

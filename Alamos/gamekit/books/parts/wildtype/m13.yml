  # --- Stop 50: Check room for growth
  #     Concept: 26 — Population growth and carrying capacity; Keystone: Population change, Matter conservation; Area: MARSH; Prerequisites: Mission primer and Stop 49: Follow nitrogen to a leaf; Learning role: RETRIEVE; Difficulty: L3; Story role: obstacle.
  #     placement: BALLPARK, Marsh Research Bay — Water Rack.
  - group: MARSH
    at: bay-bench
    title: "Check room for growth"
    concept: 26   # Population growth and carrying capacity
    reason: "The planting plan needs growth under its stated resource limit."
    scene: "The nitrogen route explains why total soil material does not guarantee usable nutrients, and the prepared plot now has a conditional population-capacity estimate. Calculate expected growth before the crew uses that estimate to choose how many plants to establish."
    motivation: "The calculated quantity sets the comparison the crew must satisfy before it acts."
    format: BALLPARK
    question: "Use the tiles to calculate modeled net growth in plants per week."
    answerText: "The unused-capacity factor is (80 − 40)/80 = 0.5. This result is now recorded for the next comparison."
    why: "The unused-capacity factor is (80 − 40)/80 = 0.5. Multiplying rN by that factor gives 0.5 × 40 × 0.5 = 10 plants per week. The exponential value would be twenty, but the stated logistic model reduces growth as the population approaches the assumed carrying capacity. That capacity is a campaign estimate under prepared-site conditions, not an immutable property of the land. Water and nutrients must actually support those conditions before the number can justify stocking the pilot."
    # wrong-path feedback, one rebuttal per wrong option:

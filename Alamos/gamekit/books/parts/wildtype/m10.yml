      - Gene flow
      - Bottleneck drift
      - Natural selection
    answerText: "The histories separate population evolution from an individual response. This result is now recorded for the next comparison."
    why: "The histories separate population evolution from an individual response. Natural selection requires inherited variation associated with reproductive success, while a random bottleneck can change frequencies without favoring a useful trait. Reproducing migrants contribute gene flow. One adult changing its behavior does not by itself establish an inherited population change. The distinction matters because the preserve has been isolated for decades: short-lived insects can pass through many generations, but the same timescale would not justify an equivalent evolutionary claim about every long-lived animal."

  # --- Stop 38: Compare offspring contributions
  #     Concept: 22 — Natural selection and fitness; Keystone: Population change, Inheritance and variation; Area: MARSH; Prerequisites: Mission primer and Stop 37: Read the population histories; Learning role: PRACTICE; Difficulty: L3; Story role: obstacle.
  #     placement: BALLPARK, Marsh Research Bay — Water Rack.
  - group: MARSH
    at: bay-bench
    title: "Compare offspring contributions"
    concept: 22   # Natural selection and fitness
    reason: "The selection claim needs reproductive contribution, not survival alone."
    scene: "The population histories separate lifetime adjustment from inherited change, and the archive includes offspring counts for early and late emergence types in the same season. Calculate one group contribution before using the reproductive contrast to interpret the frequency record."
    motivation: "The calculated quantity sets the comparison the crew must satisfy before it acts."
    format: BALLPARK
    question: "Calculate the early group contribution with adults times offspring per adult; submit surviving offspring."
    answerText: "The early group contributes 10 × 6 = 60 surviving offspring, compared with 10 × 3 = 30 for the late group. This result is now recorded for the next comparison."
    why: "The early group contributes 10 × 6 = 60 surviving offspring, compared with 10 × 3 = 30 for the late group. The equal adult counts make the reproductive contrast easy to interpret. A single season alone would not prove a lasting genetic change, but the archive also tracks inherited emergence types across repeated generations. Together those records support selection in the stated environment. Fitness here means reproductive contribution under those conditions, not general superiority or an organism trying to meet the preserve plan."

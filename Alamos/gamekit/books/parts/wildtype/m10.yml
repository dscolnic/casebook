    at: bay-bench
    title: "Read the population histories"
    concept: 22   # Natural selection and fitness
    reason: "The insect archive needs a population-level explanation."
    scene: "The seed labels now preserve ancestry, but decades of insect records show an emergence shift that cannot be explained by one plant changing shape. Compare population histories before deciding whether the island record supports a change across generations."
    motivation: "Distinguishing these mechanisms keeps the next handling decision tied to the evidence."
    format: PROTOCOL
    question: "Match each labeled observation to one explanation; submit all matches, using each explanation once."
    choices:

  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Membrane", def: "A thin selective barrier around a cell."}
  - {name: "Osmosis", def: "Net water movement through a selective membrane toward lower water potential."}
  - {name: "Solute", def: "A substance dissolved in a liquid."}
  - {name: "Organelle", def: "A specialized structure inside a cell."}
  - {name: "Surface-area-to-volume ratio", def: "Outside area divided by enclosed volume."}
  - {name: "Prokaryote", def: "A cell without a nucleus or typical membrane-bound organelles."}
  - {name: "Eukaryote", def: "A cell with a nucleus and internal membrane-bound compartments."}
  - {name: "Nucleus", def: "The compartment containing most DNA in a eukaryotic cell."}
  - {name: "Vacuole", def: "A membrane-bound storage compartment in a cell."}
  - {name: "Mitochondrion", def: "An organelle that supports aerobic energy transfer into ATP."}
  - {name: "Endosymbiosis", def: "A lasting association in which one organism lives inside another; it explains the bacterial ancestry of mitochondria and chloroplasts."}
  - {name: "Water potential", def: "A measure used to predict water movement; solute and pressure both affect it."}
  - {name: "Viability", def: "The fraction of cells alive by the stated assay."}
  - {name: "Impermeant", def: "Unable to cross the membrane in the stated test."}

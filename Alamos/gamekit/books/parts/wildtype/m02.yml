  #     Concept: 6 — Water potential and surface-area exchange; Keystone: Selective exchange, Structure and function; Area: CLINIC; Prerequisites: Mission primer and Stop 5: Identify the damaged cells; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: BALLPARK, Field Clinic — Sample Bench.
  - group: CLINIC
    at: sample-bench
    title: "Compare exchange surfaces"
    concept: 6   # Water potential and surface-area exchange
    reason: "Cell size must be separated from water-movement direction."
    scene: "The sample is plant tissue with membranes and supporting walls, so the damaged roots cannot be treated as empty bags of water. Compare exchange surface with cell volume before interpreting what a change in size actually means."
    motivation: "The calculated quantity sets the comparison the crew must satisfy before it acts."
    format: BALLPARK
    question: "Build the ratio 6 divided by side length from the tiles; submit surface-area-to-volume ratio in inverse micrometres."
    answerText: "For a cube, surface area divided by volume is 6L²/L³ = 6/L. This result is now recorded for the next comparison."
    why: "For a cube, surface area divided by volume is 6L²/L³ = 6/L. At L = 3 micrometres, the ratio is 2 inverse micrometres. The ratio describes available exchange surface per unit of cell volume, not the direction in which water moves. Smaller cells have a larger ratio, but water still follows the water-potential difference. The clinic can now distinguish an exchange-rate argument from the separate question of whether the rinse drives water into or out of roots."

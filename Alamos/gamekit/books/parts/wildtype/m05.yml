  - group: GROW
    at: growth-bench
    title: "Find the shared flowering days"
    concept: 27   # Species interactions and niches
    reason: "The field visit needs the predicted flowering overlap."
    scene: "The process matches show that healthy leaves do not establish successful pollen transfer, and the old flowering calendar no longer matches the visitor log. Calculate the shared active days before the field team compares trays along the dunes."
    motivation: "The calculated quantity sets the comparison the crew must satisfy before it acts."
    format: BALLPARK
    question: "For the old program, use shared last day minus shared first day plus one; submit overlap in days."
    answerText: "The overlap consists only of day 4. This result is now recorded for the next comparison."
    why: "The overlap consists only of day 4. With inclusive endpoints, the count is 4 − 4 + 1 = 1 day. Counting the full flowering interval would include days when the recorded pollinators were absent; counting the entire insect interval would include days when those flowers were closed. This timing result provides a possible explanation for fewer visits, but the field comparison must still check whether visitors use flowers that remain open during their activity period."

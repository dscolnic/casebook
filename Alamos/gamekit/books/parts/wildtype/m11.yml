    title: "Check the reference model"
    concept: 24   # Hardy-Weinberg models
    reason: "The reference model needs its own expected genotype frequency."
    scene: "The population mechanisms show why a shipment can lose variation by chance, and the measured allele frequencies now define a useful reference expectation. Nell Shah asks: \"Calculate the model value before the director treats any difference as proof of a particular evolutionary cause.\""
    motivation: "The calculated quantity sets the comparison the crew must satisfy before it acts."
    format: BALLPARK
    question: "Multiply the two allele frequencies and two; submit expected heterozygote percent."
    answerText: "The reference expectation is 2pq = 2 × 0.6 × 0.4 = 0.48, or 48 percent heterozygotes. This result is now recorded for the next comparison."
    why: "The reference expectation is 2pq = 2 × 0.6 × 0.4 = 0.48, or 48 percent heterozygotes. The observed family has 8/20 = 40 percent, but a small difference in one sample does not by itself establish selection or another particular cause. The model rests on explicit assumptions and sampling variation still matters. The geneticist uses the comparison to frame further tests, while the director bases the shipment decision on preserving tested family diversity rather than forcing the collection to match a formula exactly."

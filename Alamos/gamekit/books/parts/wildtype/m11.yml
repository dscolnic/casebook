  # --- Stop 42: Separate population explanations
  #     Concept: 23 — Drift and gene flow; Keystone: Population change, Inheritance and variation; Area: SEED; Prerequisites: Mission primer and Stop 41: Count the retained allele; Learning role: PRACTICE; Difficulty: L3; Story role: obstacle.
  #     placement: PROTOCOL, Seed Room — Seed Table.
  - group: SEED
    at: seed-table
    title: "Separate population explanations"
    concept: 23   # Drift and gene flow
    reason: "The founding plan needs the right population mechanisms."
    scene: "The allele count describes the selected family, but it does not explain what might be lost when only a small part of the collection travels. Nell Shah asks: \"Separate founding, migration and reproductive barriers before comparing the shipment with a population model.\""
    motivation: "Distinguishing these mechanisms keeps the next handling decision tied to the evidence."
    format: PROTOCOL
    question: "Match each labeled observation to one explanation; submit all matches, using each explanation once."
    choices:
      - Postzygotic isolation
      - Prezygotic isolation
      - Gene flow
      - Founder effect
    answerText: "A small founding sample can omit alleles by chance even when every selected plant is healthy. This result is now recorded for the next comparison."
    why: "A small founding sample can omit alleles by chance even when every selected plant is healthy. Gene flow can add alleles through successful reproduction, while prezygotic and postzygotic barriers affect different stages of reproduction. These mechanisms should not be collapsed into a claim that all separated populations are new species. The seed shipment is a deliberate founding event, so the crew can reduce avoidable sampling loss by retaining several screened families and a reserve without ignoring compatibility or habitat evidence."

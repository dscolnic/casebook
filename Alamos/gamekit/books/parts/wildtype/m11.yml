  - group: SEED
    at: seed-table
    title: "Count the retained allele"
    concept: 24   # Hardy-Weinberg models
    reason: "The largest family must be assessed for the variation it contains."
    scene: "The insect record supports selection, but the proposed seed shipment still comes from one large family that looks healthy in the nursery. Nell Shah asks: \"Count its allele copies before the team decides whether size alone preserves enough variation for founding a population.\""
    motivation: "The calculated quantity sets the comparison the crew must satisfy before it acts."
    format: BALLPARK
    question: "Use the tiles to calculate A allele frequency; submit the fraction from zero to one."
    answerText: "There are 2 × 8 + 8 = 24 A copies among 2 × 20 = 40 total copies, giving p = 0.6. This result is now recorded for the next comparison."
    why: "There are 2 × 8 + 8 = 24 A copies among 2 × 20 = 40 total copies, giving p = 0.6. Counting plants with A would confuse genotype presence with allele copies. This frequency is an observed count and does not require Hardy-Weinberg equilibrium. It establishes what the sampled family contains before the team compares it with a no-evolution reference model. The distinction keeps a healthy-looking shipment from hiding how much genetic variation its selected families actually preserve."

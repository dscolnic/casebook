  # --- Stop 35: Keep the lineage traceable
  #     Concept: 17 — DNA replication; Keystone: Information flow, Inheritance and variation; Area: SEED; Prerequisites: Mission primer and Stop 34: Check the family marker distance; Learning role: PRACTICE; Difficulty: L3; Story role: obstacle.
  #     placement: SEQUENCE, Seed Room — Family Board.
  - group: SEED
    at: family-board
    title: "Keep the lineage traceable"
    concept: 17   # DNA replication
    reason: "The copied sequence must stay distinct from its expressed appearance."
    scene: "The marker calculation gives the seed team a usable inheritance record, but copied DNA and changing leaf appearance are still being treated as the same thing. Nell Shah asks: \"Trace the copying process before deciding which labels the breeding stock should keep.\""
    motivation: "The causal order identifies what the next test must preserve or challenge."
    format: SEQUENCE
    question: "Place every card in the biological causal order; submit the whole order."
    answerText: "Semiconservative replication preserves a template strand in each daughter DNA molecule. This result is now recorded for the next comparison."
    why: "Semiconservative replication preserves a template strand in each daughter DNA molecule. DNA polymerase extends new DNA only in the 5-prime to 3-prime direction, so the two antiparallel templates require different synthesis arrangements. Ligase joins neighboring lagging-strand fragments after they are made. This simplified dependency order explains why copied marker DNA can track ancestry while expression changes alter leaf form. The family records need both kinds of evidence, because a copied sequence and a changed phenotype answer different questions."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Ligase joins fragments; it does not replace template-directed synthesis. Two old strands together would not describe semiconservative daughter molecules. Polymerase extension is 5-prime to 3-prime, including the lagging-strand fragments. Retry: keep the visible evidence, clear only the committed response and reopen this board; no later stop unlocks until a correct submission. For matching/order errors, highlight the first mismatched biological relationship with the specific feedback above; for numerical errors, display the stated formula and substituted units after grading.

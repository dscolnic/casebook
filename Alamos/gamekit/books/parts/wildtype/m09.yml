  card:
    header: "DAY 9 OF 15 — SHIP DEPARTS AFTER DAY 15"
    title: "THE SAME SEED IN TWO ROOMS"
    goNow: "Go to Growth Hall and meet Ivo Reed, plant physiologist, at the Growth Bench."
    body: "The enzyme lead is saved, but leaf shapes give mixed family labels. The same genes can yield new shapes when the light changes. Check the plants with Ivo, then read the seed records with Nell. Today you decide whether leaf shape alone is a reliable breeding label."
    objective: "Resolve whether leaf shape alone is a reliable breeding label; a misleading label could remove useful seed families."
  objective: "Resolve whether leaf shape alone is a reliable breeding label; a misleading label could remove useful seed families."
  stake: "The enzyme lead is saved, but leaf shapes give mixed family labels. The same genes can yield new shapes when the light changes. Check the plants with Ivo, then read the seed records with Nell. Today you decide whether leaf shape alone is a reliable breeding label."

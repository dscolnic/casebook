  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Common-garden test", def: "A comparison that raises organisms in the same conditions."}
  - {name: "Polygenic trait", def: "A trait affected by more than one gene."}
  - {name: "Epigenetic regulation", def: "Changes in gene use associated with DNA or chromatin marks without changing the DNA sequence."}
  - {name: "Linked genes", def: "Genes on the same chromosome that can be inherited together."}
  - {name: "Chromatin", def: "DNA with its associated proteins."}
  - {name: "Replication", def: "Copying DNA before cell division."}
  - {name: "Replication fork", def: "The region where DNA strands separate and are copied."}
  - {name: "Ligase", def: "An enzyme that joins adjacent DNA fragments."}
  - {name: "Semiconservative", def: "Describing DNA copying that leaves one old and one new strand in each daughter molecule."}
  equations:
  - {"e":"recombination (%) = recombinant offspring / total offspring × 100","c":"Estimate marker recombination frequency.","v":[["Both quantities","counts from the same scored cross"]],"s":"Keep ancestry traceable across changing leaf forms."}
  primer:
  - "Environment and genotype can both affect phenotype."
  - "Shared appearance does not prove shared ancestry."
  - "Recombination frequency can reveal linkage over short distances."


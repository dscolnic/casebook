  # --- Stop 53: Project the dark interval
  #     Concept: 9 — Respiration and chemiosmosis; Keystone: Energy coupling, Selective exchange; Area: GROW; Prerequisites: Mission primer and Stop 52: Prepare before planting; Learning role: RETRIEVE; Difficulty: L3; Story role: clue.
  #     placement: BALLPARK, Growth Hall — Growth Bench.
  - group: GROW
    at: growth-bench
    title: "Project the dark interval"
    concept: 9   # Respiration and chemiosmosis
    reason: "The daylight pass needs a night-time oxygen calculation."
    scene: "The prepared pilot looks healthy in daylight, but animals gather near the surface at dawn and the night record has not yet been cleared. Project the dark-interval oxygen balance before the crew treats the daylight result as permission to expand."
    motivation: "The calculated quantity sets the comparison the crew must satisfy before it acts."
    format: BALLPARK
    question: "Calculate initial oxygen minus rate times time; submit final oxygen in mg per litre."
    answerText: "The projected final concentration is 8 − 0.5 × 8 = 4 mg/L. This result is now recorded for the next comparison."
    why: "The projected final concentration is 8 − 0.5 × 8 = 4 mg/L. This uses a measured net loss for the stated dark interval, so a separate respiration subtraction would count consumption twice. The linear model is limited to the supplied interval and does not describe every possible oxygen level. The calculation retrieves the sealed-pot lesson in a community with additional consumers. It identifies a night-time risk that the healthy daylight appearance cannot rule out, and the full-cycle measurements can now test it."
    # wrong-path feedback, one rebuttal per wrong option:

  # --- Stop 10: Calculate the daylight balance
  #     Concept: 8 — Photosynthesis and carbon fixation; Keystone: Energy coupling, Matter conservation; Area: GROW; Prerequisites: Mission primer and Stop 9: Follow oxygen-supported ATP production; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.

  - group: GROW
    at: growth-bench
    title: "Follow oxygen-supported ATP production"
    concept: 7   # ATP and energy coupling
    reason: "The crew must explain why fed roots fail in sealed pots."
    scene: "The rinsed roots now remain viable, yet seedlings still wilt after their pots are sealed for the journey to the mainland. Ivo Reed asks: \"Trace how food supports cellular work before testing whether a full pot actually contains what roots need.\""
    motivation: "The causal order identifies what the next test must preserve or challenge."
    format: SEQUENCE
    question: "Arrange the cards as the supplied causal-dependency explanation from food electrons to ATP; this is not a timeline of nonoverlapping phases. Submit the whole order."
    answerText: "Energy from food reaches electron carriers and then the mitochondrial electron-transport chain. This result is now recorded for the next comparison."
    why: "Energy from food reaches electron carriers and then the mitochondrial electron-transport chain. Electron transfer powers proton pumping across the inner membrane, and oxygen accepts electrons at the chain end. Protons returning through ATP synthase drive ATP production. The events overlap in a working cell, but this causal order identifies what supplies what. If oxygen runs out, the chain cannot keep transferring electrons normally. The seedling can contain food yet lack sufficient ATP for transport and maintenance in a sealed pot."

  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "ATP", def: "A molecule that couples energy-releasing reactions to cellular work."}
  - {name: "Respiration", def: "Cellular pathways that transfer energy from food into ATP."}
  - {name: "Photosynthesis", def: "Conversion of light energy into chemical energy while fixing carbon dioxide."}
  - {name: "Chemiosmosis", def: "ATP production driven by ions moving down a gradient through ATP synthase."}
  - {name: "Fermentation", def: "Reactions that regenerate NAD+ so glycolysis can continue without an oxygen-dependent chain."}
  - {name: "Electron", def: "A negatively charged particle transferred in energy pathways."}
  - {name: "Proton", def: "A positively charged particle whose gradient can drive ATP synthesis."}
  - {name: "Gradient", def: "A difference in a quantity between places."}
  - {name: "ATP synthase", def: "An enzyme that couples ion movement down a gradient to ATP production."}
  - {name: "NADH", def: "An electron carrier used in respiration."}
  - {name: "NADPH", def: "An electron carrier that supplies reducing electrons for photosynthetic carbon fixation. NAD+: An electron carrier in its oxidized form, meaning it has lost electrons and can accept them during glycolysis."}
  - {name: "Glycolysis", def: "A cytosolic pathway that splits glucose and yields a small net ATP gain."}
  - {name: "Thylakoid", def: "A membrane compartment carrying light-reaction machinery in a chloroplast."}
  - {name: "Stroma", def: "The fluid compartment around chloroplast thylakoids."}
  - {name: "Calvin cycle", def: "The carbon-fixation reactions that use ATP and NADPH to build organic molecules."}
  equations:

    title: "Calculate the daylight balance"
    concept: 8   # Photosynthesis and carbon fixation
    reason: "The afternoon inspection needs a net oxygen balance."
    scene: "The cellular pathway shows why the roots need oxygen as well as food, even while their leaves appear healthy under the lamps. Ivo Reed asks: \"Calculate the daytime oxygen balance to find what the afternoon inspection does and does not establish.\""
    motivation: "The calculated quantity sets the comparison the crew must satisfy before it acts."
    format: BALLPARK
    question: "Use production minus consumption and submit net oxygen gain in mg per hour."
    answerText: "The net daylight oxygen gain is gross production minus respiratory use: 14 − 6 = 8 mg per hour. This result is now recorded for the next comparison."
    why: "The net daylight oxygen gain is gross production minus respiratory use: 14 − 6 = 8 mg per hour. Respiration does not stop when light is present, so treating gross photosynthetic production as the net change overstates the gain. The positive daylight balance explains why the pots seemed healthy during afternoon inspection. It does not establish the overnight balance, when light-driven oxygen production stops but respiration continues. Energy and matter accounting therefore require measurements across the actual transport cycle."

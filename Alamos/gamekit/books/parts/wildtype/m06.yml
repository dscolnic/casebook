  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Cell cycle", def: "The sequence of growth, DNA copying and cell division."}
  - {name: "Checkpoint", def: "A control that delays cell-cycle progress until a requirement is met."}
  - {name: "Mitosis", def: "Division of a nucleus into two nuclei with matching chromosome sets."}
  - {name: "Apoptosis", def: "Regulated cell death."}
  - {name: "Transduction", def: "Steps that relay a detected signal inside a cell."}
  - {name: "Chromosome", def: "A DNA molecule with associated proteins carrying genetic information."}
  - {name: "Chromatid", def: "One of the two copied chromosome units before separation."}
  - {name: "Centromere", def: "The chromosome region used here to count chromosomes and attach division machinery."}
  - {name: "Cytokinesis", def: "Division of cell contents into daughter cells."}
  - {name: "Diploid", def: "Having two chromosome sets."}
  - {name: "Haploid", def: "Having one chromosome set."}
  equations:
  - {"e":"dividing fraction (%) = dividing cells / counted cells × 100","c":"Compare cell-cycle samples.","s":"Quantify the unusual tissue sample."}
  primer:
  - "DNA is copied during S phase before division."
  - "Chromosomes must be attached correctly before sister chromatids separate."
  - "Rapid growth alone does not prove cancer or identify a mutation."


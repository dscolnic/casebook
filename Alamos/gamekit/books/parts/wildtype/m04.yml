    at: growth-bench
    title: "Read the recovered leaves"
    concept: 19   # Regulation and differentiation
    reason: "The crew needs to distinguish changed gene use from changed DNA."
    scene: "The signal pathway predicts that a lamp cue could change gene use without replacing the inherited instructions inside the plants being tested. Ivo Reed asks: \"Compare sequence, RNA and protein evidence before deciding what the recovered leaves actually prove about the treatment.\""
    motivation: "An explanation must survive the normal controls before it can justify changing the release stock."
    format: DIAGNOSIS
    question: "Read every measurement, including the normal control, and submit the one explanation consistent with them all."
    choices:
      - Light changes gene expression
      - Light rewrites every target gene
      - Heat destroys all enzymes

  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Signal", def: "A cue that a cell can detect and respond to."}
  - {name: "Receptor", def: "A molecule that binds or detects a signal."}
  - {name: "Gene expression", def: "Use of genetic instructions to make RNA or protein."}
  - {name: "Negative feedback", def: "A response that opposes the change that triggered it."}
  - {name: "Substrate", def: "The molecule an enzyme acts on."}
  - {name: "Active site", def: "The region where an enzyme binds and acts on its substrate."}
  - {name: "Allosteric site", def: "A binding region separate from the active site that can change protein activity."}
  - {name: "Denaturation", def: "Loss of a molecule's functional folded structure."}
  - {name: "Transcription factor", def: "A protein that helps regulate transcription of genes."}
  - {name: "Transcript", def: "An RNA product copied from a DNA template."}
  primer:
  - "Enzymes lower activation energy without changing the overall energy difference."
  - "Signal reception can alter gene expression through intermediate steps."
  - "A local growth response does not prove a whole release plan works."


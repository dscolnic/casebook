- title: "THE WRONG KIND OF RECOVERY"
  card:
    header: "DAY 4 OF 15 — SHIP DEPARTS AFTER DAY 15"
    title: "THE WRONG KIND OF RECOVERY"
    goNow: "Go to Growth Hall and meet Ivo Reed, plant physiologist, at the Growth Bench."
    body: "The pots now have air, and the plants grow well. Light can change how a plant uses its genes. Check the old lamps with Ivo at the Growth Bench. Today you decide whether the old lamp program is ready for wider use."
    objective: "Resolve whether the old lamp program is ready for wider use; a rushed change could damage the whole nursery."
  objective: "Resolve whether the old lamp program is ready for wider use; a rushed change could damage the whole nursery."
  stake: "The pots now have air, and the plants grow well. Light can change how a plant uses its genes. Check the old lamps with Ivo at the Growth Bench. Today you decide whether the old lamp program is ready for wider use."

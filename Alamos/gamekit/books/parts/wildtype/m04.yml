    at: growth-bench
    title: "Follow the light response"
    concept: 11   # Signals and feedback
    reason: "The trial needs a model for the changed growth timing."
    scene: "The enzyme comparisons separate several ways that growth can slow, but the old lamps also change the timing of new leaf growth. Ivo Reed asks: \"Trace the light-response pathway to decide what the lamps might alter beyond the energy supply.\""
    motivation: "The causal order identifies what the next test must preserve or challenge."
    format: SEQUENCE
    question: "Place every card in the biological causal order; submit the whole order."
    answerText: "The lamp is an environmental cue as well as an energy source. This result is now recorded for the next comparison."
    why: "The lamp is an environmental cue as well as an energy source. A receptor detects that cue, internal relay molecules transmit it, and transcription factors can change which genes are transcribed. Altered protein abundance can then change growth or flowering. This information pathway does not require changing the DNA sequence. The ordered model makes the trial testable: a changed growth response alone cannot establish whether the old lamp schedule is suitable for the organisms that now depend on these plants."

    #     - transfer fraction
    #     - consumer levels
    #     - days
    #     values:
    #     - 5000
    #     - 0.1
    #     - 2
    #     - 7
    #     slots: 2
    #     template: '{0} {1} → kJ'
    #     formula: a*b
    #     correct:
    #     - 0
    #     - 1
    #     target: 500
    #     correctResult: 500
    #     tolerance: 0.05
    #   answerText: Under the explicitly simplified ten-percent model, primary consumers receive 5,000 × 0.1 = 500 kJ. This result is now recorded for the next comparison.
    estimate:
      target: 500
      tolerance: 0.05
      units: kJ
      labels:
        - "5000"
        - "0.1"
        - "2"
        - "7"
      values:
        - 5000
        - 0.1
        - 2
        - 7
      correct:
        - 0
        - 1
      slots: 2
      formula: a*b
      template: "{0} × {1} = ? kJ"
      solution: "500"


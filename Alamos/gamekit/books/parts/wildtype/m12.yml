  # --- Stop 46: Budget the food web
  #     Concept: 28 — Energy flow and trophic levels; Keystone: Energy coupling, Species interactions; Area: MARSH; Prerequisites: Mission primer and Stop 45: Name the observed links; Learning role: PRACTICE; Difficulty: L3; Story role: obstacle.
  #     placement: BALLPARK, Marsh Research Bay — Water Rack.
  - group: MARSH
    at: water-rack
    title: "Budget the food web"
    concept: 28   # Energy flow and trophic levels
    reason: "The pilot food web needs an energy budget."
    scene: "The field matches identify useful and harmful interactions, yet adding organisms to a pilot also adds demands on its limited food supply. Tess Rowan asks: \"Calculate the next feeding level before the clinic evaluates which partner combination the plants can support.\""
    motivation: "The calculated quantity sets the comparison the crew must satisfy before it acts."
    format: BALLPARK
    question: "Use stored biomass energy times transfer fraction; submit primary-consumer energy in kJ."
    answerText: "Under the explicitly simplified ten-percent model, primary consumers receive 5,000 × 0.1 = 500 kJ. This result is now recorded for the next comparison."
    why: "Under the explicitly simplified ten-percent model, primary consumers receive 5,000 × 0.1 = 500 kJ. The remainder is not transferred to that next trophic level as new biomass; energy supports metabolism, is dissipated as heat, or remains in material not eaten or assimilated. Actual efficiencies vary, so the result is a campaign estimate rather than a universal constant. It shows why adding consumers without supporting production cannot create a self-sustaining pilot from an energy shortage."
    # wrong-path feedback, one rebuttal per wrong option:
    #   50 applies the transfer twice and estimates the next level. 5,000 assumes all producer biomass energy becomes consumer biomass. Retry: keep the visible evidence, clear only the committed response and reopen this board; no later stop unlocks until a correct submission. For matching/order errors, highlight the first mismatched biological relationship with the specific feedback above; for numerical errors, display the stated formula and substituted units after grading.
    # data: The pilot plants store 5,000 kJ of new biomass; use a stated simplified 10% transfer to primary consumers.
    # correct result: 500; absolute tolerance ±0.05 in the requested unit, inclusive.
    # state/output: Budget the food web is recorded with its evidence on the Marsh Research Bay log; the next comparison becomes available.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   estimate:

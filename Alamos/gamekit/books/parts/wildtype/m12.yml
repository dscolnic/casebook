  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Keystone species", def: "A species with a disproportionately large community effect relative to its abundance."}
  - {name: "Decomposer", def: "An organism that breaks down dead organic material and recycles nutrients."}
  - {name: "Trophic level", def: "A position in a food chain based on feeding."}
  - {name: "Nutrient", def: "A material an organism needs for growth or function."}
  - {name: "Isolate", def: "A particular organismal strain separated for testing."}
  - {name: "Phage", def: "A virus that infects bacteria."}
  - {name: "Lytic infection", def: "An infection in which new virus particles are produced and the host cell is lysed."}
  - {name: "Lysogenic state", def: "A phage state in which viral genetic material persists with the host genome."}
  - {name: "Reverse transcription", def: "Making DNA from an RNA template."}
  - {name: "Lysis", def: "Rupture of a cell."}
  equations:

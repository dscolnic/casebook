    title: "Stress the Boundary"
    person: TODO   # the roster id of whoever asks it
    concept: "interval sensitivity/practical significance"
    reason: "The late-harm conclusion must survive reasonable missing-outcome assumptions."
    scene: "The primary benefit interval excludes zero, while late harm ranges from -1 to +5 events per 1,000. Move the missing-outcome assumption through its registered range and watch which actions remain defensible."
    motivation: "Crossing a safety boundary under plausible assumptions blocks unconditional continuation."

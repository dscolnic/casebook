    concept: "LINE"
    reason: "Slope inference is invalid if its residual pattern fails the model."
    scene: "The dose-response scatterplot looks linear, but inference needs more than the fitted line. Select the residual field with random scatter, near-Normal shape, independent patients, and equal spread across fitted values."
    motivation: "A small slope p-value cannot repair nonlinearity or a fan-shaped residual field."
    format: RESIDUAL
    question: "Inspect residual fields A, B, and C for LINE: linearity, independence, Normal residuals, and equal variance. Submit the only field passing all four conditions."

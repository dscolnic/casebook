    reason: "The board needs the size and uncertainty of the dose-response trend."
    scene: "The model passes LINE; output gives b=-0.80 recovery day per dose unit, SE(b)=0.25, and n=30. Derive t, df, the 95% interval, and the correct one-sided p-value from the reported two-sided p=.0034."

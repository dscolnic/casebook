    format: DERIVE
    question: "Build E(A+B)=10+8=18 [linearity]; Var=3^2+4^2=25 [independent variances add]; SD=sqrt25=5 [convert]. Include decoy SD=7. Submit pair 18 reports, 5 reports."
    answerText: "The combined stream has mean 18 reports and SD 5 reports. For aX+b, expectation is aμ+b and SD is |a|σ."

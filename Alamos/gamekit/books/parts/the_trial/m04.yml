    title: "Combine Two Streams"
    concept: "independent sums of RVs and linear transforms"
    reason: "Two independent regions share one queue, so their total mean and SD must be forecast correctly."
    scene: "Region A has mean 10 reports and SD 3; Region B has mean 8 and SD 4. Combine their independent streams to size the queue without incorrectly adding standard deviations."

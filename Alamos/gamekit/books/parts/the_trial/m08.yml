    title: "Build the Interval"
    concept: "one-proportion CI"
    reason: "Quarantine needs a plausible range, not only the observed 15% rate."
    scene: "The random, 10%, and large-count conditions all pass, and p-hat=30/200=0.15. Build the 95% confidence interval using z-star=1.960 and the sample proportion in the standard error, then submit both endpoints."

    format: DERIVE
    question: "SE=sqrt(.15(.85)/200)=.02525; ME=1.96(.02525)=.0495; interval .15 plus/minus .0495=[.1005,.1995]. Licensed lines; decoy uses .10 in CI SE."
    answerText: "We are 95% confident the true exposed-kit failure proportion is between 10.05% and 19.95%."
    why: "If the whole interval lies near or above the 10% benchmark, the observed excess is not merely a headline percentage."

    concept: "experiment principles"
    reason: "Priya must preserve causal validity while the enrollment frame changes."
    scene: "The new frame includes rural patients, but assignment must still separate treatment effects from site differences. Order the design steps so blocking happens before random assignment and outcomes are measured the same way."
    motivation: "Correct order prevents site mix from becoming a confounder."
    format: SEQUENCE

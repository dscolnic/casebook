  #     placement: DERIVE, at s23-price-the-precision.
  - group: ENDP
    at: TODO               # the fixture it is asked at
    title: "Price the Precision"
    concept: "sampling distribution/CLT/10% idea"
    reason: "The amendment needs a reproducible estimate of sampling spread before more sites are opened."
    scene: "The corrected design expects improvement probability p=0.50 and needs n=400 independent patients from more than 4,000 eligible people. Derive the center and SD of the sampling distribution of p-hat."
    motivation: "Precision, not the observed sample center, determines whether the board can separate benefit from noise."
    format: DERIVE
    question: "lines mean(p-hat)=p=.50 [unbiased]; SD=sqrt(.5(.5)/400) [formula, independence/10%]; =.025 [simplify]. Decoy SD=.25/400. Submit pair .50,.025."
    answerText: "The completed check shows the distribution is centered at .50 with SD .025. Larger n narrows spread but does not change the center; large counts are 200 and 200."
    why: "Precision, not the observed sample center, determines whether the board can separate benefit from noise."

  - group: SAFE
    title: "Choose Matched or Blocked"
    person: TODO   # the roster id of whoever asks it
    concept: "matched pairs/blinding"
    reason: "A matched-pairs proposal could halve enrollment, but only if pairing matches the scientific unit."
    scene: "With the design order fixed, one proposal pairs unrelated patients from different sites solely because their ages match. Decide whether this is a valid matched-pairs study or a blocked randomized design."
    motivation: "Calling loose similarity a pair could understate variability and overstate precision."
    format: CHOICE
    question: "Submit one selection from the four distinct choice items below."
    choices:
    - "Block by important traits and randomize treatments within each block."
    - "Call similar patients matched pairs even though each receives only one treatment."
    - "Assign treatments without blocks because randomization removes all chance imbalance."
    - "Compare patients who chose their own treatment."
    answer: "Block by important traits and randomize treatments within each block."
    answerText: "The completed check shows block by important traits and randomize within blocks; paired inference needs genuine paired observations or both treatments on one unit. Double blinding hides assignment from subjects and researchers."
    why: "Calling loose similarity a pair could understate variability and overstate precision."
    # wrong-path feedback, one rebuttal per wrong option:

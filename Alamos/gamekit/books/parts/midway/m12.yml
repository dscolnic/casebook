    reason: "The certificate must show how measured motion becomes rider force."
    scene: "Use the bumper momentum and tower entry speed to build each path from motion through stopping time or distance to rider load. Name the governing physics relationship at every required transfer."
    motivation: "A complete chain exposes skipped assumptions between a speed reading and a force claim."
    format: CHAIN

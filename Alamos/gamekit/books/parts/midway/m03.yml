  # --- Stop 9: Derive the inward acceleration
  #     Concept: circular acceleration; Keystone: circular motion; Area: Carousel Drive House; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: DERIVE, asked at chain-rig.
  - group: CAROUSEL
    at: chain-rig
    title: "Derive the inward acceleration"
    person: TODO   # the roster id of whoever asks it
    concept: "circular acceleration"
    reason: "The chair limit needs a relationship between speed, radius, and inward acceleration."
    scene: "The chair travels at steady speed, but its velocity arrow turns continuously around the platform. Build the relation that converts that direction change into the inward acceleration used by the force model."
    motivation: "The chain must provide the acceleration required by the curved path."
    format: DERIVE
    question: "Starting from Delta v / v = Delta s / r and Delta s = v Delta t, submit one ordered symbolic derivation ending with the magnitude and direction of centripetal acceleration."
    answerText: "Uniform circular motion has inward acceleration v²/r even when speed is constant."
    why: "Direction changes by the same small angle as the position around the circle. Dividing the velocity change by time produces v²/r."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Constant speed fixes the velocity magnitude, not its direction.
    # correct result: Order: radial acceleration → force balance → tangent relation; ac=v²/r inward.
    # state/output: Illuminate inward arrows on the carousel model.

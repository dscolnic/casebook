    on: { after: [3] }
    world: "Methane enters the NONPOLAR / WEAK DISPERSION lane; water and glycol enter the POLAR / STRONG ATTRACTION lane."
    panel: "NEXT TASK - STOP 16: CAN THE BLUE RESIDUE RIDE THE GAS STREAM?"

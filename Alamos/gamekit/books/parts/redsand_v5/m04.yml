- title: "What Can Travel Where?"
  card:
    header: "12 SHIFTS UNTIL THE LAUNCH WINDOW CLOSES"
    title: "WHAT CAN TRAVEL WHERE?"
    goNow: "Go to Catalyst Bay and meet Mei-Ling Cho, the water and cryogenics engineer, beside the covered blue stain."
    body: "A blue stain near a methane valve looks like proof of a leak, but nobody has tested whether that fluid could travel through the gas line. At Catalyst Bay, use molecular shape, polarity, and attractions between molecules to predict how each substance moves. Then operate the separation cartridge across its temperature range. By the end of the mission, decide whether the stain identifies the missing methane's path."
    objective: "Determine whether the blue residue could have traveled through the suspected methane-leak path."
  objective: "Determine whether the blue residue could have traveled through the suspected methane-leak path."
  stake: "A blue stain near a methane valve looks like proof of a leak, but nobody has tested whether that fluid could travel through the gas line. At Catalyst Bay, use molecular shape, polarity, and attractions between molecules to predict how each substance moves. Then operate the separation cartridge across its temperature range. By the end of the mission, decide whether the stain identifies the missing methane's path."
  takeaway: "A substance's physical properties can rule out a proposed evidence path."
  segue: "Mission decision: The blue stain did not move through the dry methane line. Water and glycol would stay or turn to liquid far upstream. Methane would pass. The stain came from local repair work, not a leak. A new water alarm now needs a test."
  # The mission card's own "Primer concepts", printed on the plan card.
  primer:
  - "Use this chain: Lewis structure -> geometry -> bond effects -> molecular polarity -> intermolecular behavior."
  - "Similar colors do not prove two residues are the same substance."
  - "A proposed travel path must agree with the substance's phase and attractions at every temperature along the path."

  # The bible's beat script. `world` is its World state line, `panel` its

    # On arrival at Catalyst Bay | automatic | 
    on: { enter: true, at: KINET }
    world: "The player approaches a blue stain sealed beneath a clear cover beside a dry-gas valve; Cho places a residue vial next to four molecular models."
    panel: "MISSION 4 - WHAT CAN TRAVEL WHERE?"
    # unlocks: Stop 13 at the molecular-model bench; Stop 14 unlocks immediately after Stop 13.
    bubbles:
    - who: cho   # Cho
      say: "A stain is evidence that a substance reached this spot. It is not proof of how it arrived. We test the path before we name a leak."
  - id: after-stops-13-and-14
    # After Stops 13 and 14 | molecular-model bench | automatic transition
    on: { after: [1, 2] }
    world: "The valid methane structure rotates into a tetrahedron, and the bond-dipole arrows cancel."
    panel: "STRUCTURE -\\> GEOMETRY -\\> BOND DIPOLES -\\> MOLECULAR POLARITY."
    # unlocks: Stop 15 at the property-card rack.
    bubbles:
    - who: cho   # Cho
      say: "Now compare methane with the residue. Shape and polarity decide whether they travel together."
  - id: after-stop-15

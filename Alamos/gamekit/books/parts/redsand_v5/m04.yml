  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 4: worked examples"
    examples:
    - {"title":"Count valence electrons","problem":"How many valence electrons appear in the Lewis structure of NH₃? Nitrogen contributes five and hydrogen one each.","rule":"Total valence electrons are summed over atoms, with charge adjustments if needed.","steps":["electron total=5+3(1)=8.","Three single bonds use six electrons; two remain as one lone pair on nitrogen."],"answer":"NH₃ has three N-H bonds and one nitrogen lone pair.","mistake":"Counting bonds alone misses nonbonding electrons."}
    - {"title":"Distinguish electron and molecular geometry","problem":"A central atom has three bonding pairs and one lone pair. Determine molecular shape.","rule":"Four electron domains arrange approximately tetrahedrally; molecular shape describes atom positions.","steps":["electron-domain count=3+1=4.","One domain is a lone pair, leaving three bonded atoms in a trigonal-pyramidal arrangement."],"answer":"The molecular shape is trigonal pyramidal.","mistake":"Tetrahedral describes the electron-domain geometry in this case."}
    - {"title":"Combine bond dipoles","problem":"CO₂ is linear with two identical polar C=O bonds. Is the molecule polar?","rule":"Molecular polarity depends on the vector sum of bond dipoles.","steps":["The equal bond dipoles point in opposite directions.","net dipole=0 because the two contributions cancel."],"answer":"CO₂ is nonpolar despite its polar bonds.","mistake":"Polar bonds do not guarantee a polar molecule."}
    - {"title":"Identify hydrogen bonding","problem":"Compare pure CH₄ and pure H₂O. Which can form hydrogen bonds between its molecules?","rule":"Hydrogen bonding requires suitable donors, commonly H bonded to N, O or F, and an acceptor lone pair.","steps":["Water supplies O-H donors and oxygen lone-pair acceptors.","Methane has C-H bonds and does not supply the corresponding donor arrangement."],"answer":"Water forms hydrogen bonds; methane primarily has dispersion attractions.","mistake":"Hydrogen in a formula alone does not establish hydrogen bonding."}
    - {"title":"Distinguish boiling from bond breaking","problem":"When liquid water boils without reacting, which attractions are mainly overcome?","rule":"A phase change rearranges molecules without changing their chemical identities.","steps":["Water molecules separate farther from one another.","Intermolecular attractions are overcome while O-H covalent bonds remain in the molecules."],"answer":"Boiling mainly overcomes intermolecular attractions.","mistake":"Breaking O-H bonds would be a chemical change, not ordinary boiling."}

  stops:
  # --- Stop 13: Choose the methane structure
  #     Concept: Lewis structures; Keystone: structure, polarity, and intermolecular forces; Area: Cold End; Learning role: INTRODUCE; Difficulty: L1; Story role: obstacle.
  #     placement: CHOICE, asked at Mei-Ling Cho beside charge-bench.
  - group: PHASE
    at: charge-bench
    title: "Choose the methane structure"
    person: cho
    concept: 5   # Lewis structures
    reason: "The residue investigation needs a methane structure before comparing molecular behavior."
    scene: "To test whether the residue could share methane's path, first choose the valid Lewis structure that determines methane's shape."
    motivation: "The bonding model establishes methane's geometry for judging how it interacts with the suspect residue."
    format: CHOICE
    question: "Which Lewis structure for CH4 is valid?"
    choices:
    - "Central C with four C-H single bonds and no lone pairs on C"
    - "Central C with three C-H bonds and one lone pair."
    - "H=C(H)-H with a double bond to hydrogen."
    - "C4- surrounded by four H+ ions."
    answer: "Central C with four C-H single bonds and no lone pairs on C"
    answerText: "Valid methane has four C-H single bonds, no carbon lone pairs, and a tetrahedral shape."
    why: "Carbon supplies four valence electrons and reaches an octet through four shared pairs. Hydrogen forms one bond and never a double bond. Formal charges are zero in the standard structure."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2) Three C-H bonds plus a lone pair gives the wrong neutral electron arrangement for methane. (3) Hydrogen cannot form a double bond because it can hold only two electrons. (4) Methane is a neutral covalent molecule, not C4- surrounded by four H+ ions.
    # correct result: Four single bonds, no carbon lone pairs.
    # state/output: Add the correct 3D methane model to the rail.

  # --- Stop 14: From electrons to polarity
  #     Concept: structure-property chain; Keystone: structure, polarity, and intermolecular forces; Area: Cold End; Learning role: PRACTICE; Difficulty: L2; Story role: clue.
  #     placement: SEQUENCE, at molecular-model-rail.
  - group: PHASE
    at: molecular-model-rail
    title: "From electrons to polarity"
    concept: 5   # structure-property chain
    reason: "The methane structure is selected, but bond polarity alone does not determine molecular polarity."
    scene: "Use electron arrangement to connect Lewis structure, molecular shape, and polarity so the proposed leak path can be judged."
    motivation: "The geometry-to-polarity chain explains how individual bond effects combine in the complete molecule."
    format: SEQUENCE
    question: "Order the reasoning chain used to predict molecular polarity."
    # CONVERTED from the bible's `data` line below; `correct result: As listed`.
    cards:
    - "Draw a valid Lewis structure"
    - "Count electron domains and predict geometry"
    - "Identify bond dipoles from electronegativity"
    - "Test whether dipoles cancel in 3D"
    - "Classify the molecule as polar or nonpolar"
    order: [0, 1, 2, 3, 4]
    answerText: "Lewis structure leads to geometry, bond dipoles, molecular polarity, and then intermolecular behavior."
    why: "A polar bond does not guarantee a polar molecule. Geometry determines whether individual dipoles reinforce or cancel. Methane's tetrahedral C-H bond arrangement is symmetric enough that the small bond dipoles cancel."
    # wrong-path feedback, one rebuttal per wrong option:
    #   If polarity comes before geometry, show two molecules with similar bonds but different shapes. If the player begins with IMF, explain that IMF classification depends on the molecular polarity already established.
    # data: Draw a valid Lewis structure / Count electron domains and predict geometry / Identify bond dipoles from electronegativity / Test whether dipoles cancel in 3D / Classify the molecule as polar or nonpolar.
    # correct result: As listed.
    # state/output: Unlock molecule matching.

  # --- Stop 15: Match shape, polarity, and dominant force
  #     Concept: VSEPR and IMF; Keystone: structure, polarity, and intermolecular forces; Area: Cold End; Learning role: COMBINE; Difficulty: L2; Story role: clue.
  #     placement: PROTOCOL, at model-rail-desk.
  - group: PHASE
    at: model-rail-desk
    title: "Match shape, polarity, and dominant force"
    concept: 5   # VSEPR and IMF
    reason: "The polarity model is ready to be applied to the separator's different substances."
    scene: "Apply that chain to methane, carbon dioxide, water, and ammonia to identify which substances behave alike and could travel together."
    motivation: "Matching shapes and attractions predicts which materials the separator should retain or carry with the gas."
    format: PROTOCOL
    question: "Match each molecule to its shape/polarity/dominant intermolecular force."
    # CONVERTED from the payload below. The engine's PROTOCOL board is two
    # columns matched by position: the bible's `scenarios` become the situations,
    # its `choices` the responses, and its keyed `mapping` the permutation.
    scenarios:
    - "CH4"
    - "CO2"
    - "H2O"
    - "NH3"
    choices:
    - "tetrahedral / nonpolar / London dispersion"
    - "linear / nonpolar overall / London dispersion"
    - "bent / polar / hydrogen bonding"
    - "trigonal pyramidal / polar / hydrogen bonding"
    mapping: [0, 1, 2, 3]
    answerText: "Match CH4 and CO2 to nonpolar/London behavior, and H2O and NH3 to polar/hydrogen-bonding behavior."
    why: "Symmetric CH4 and CO2 cancel bond dipoles and rely on London dispersion between molecules. Bent water and pyramidal ammonia remain polar, and their H-O or H-N bonds allow hydrogen bonding. London forces still exist in all substances; \"dominant\" names the most consequential one present."
    # wrong-path feedback, one rebuttal per wrong option:
    #   CO2 has polar bonds but a nonpolar linear molecule. Water is not linear because two lone-pair domains bend its O-H bonds.
    # correct result: Mapping as listed.
    # state/output: Create reference curves for the sweep.

- title: "What Can Travel Where?"
  card:
    header: "MISSION 4 - 12 WORK SHIFTS REMAIN BEFORE LAUNCH."
    title: "WHAT CAN TRAVEL WHERE?"
    goNow: "Go to Catalyst Bay and meet Mei-Ling Cho, the water and cryogenics engineer, beside the covered blue stain."
    body: "12 work shifts remain before launch. A blue swab rests beside a clear dry-line cartridge. Today you decide whether the blue stain could travel down the methane line."
    objective: "Determine whether the blue residue could have traveled through the suspected methane-leak path."
  objective: "Determine whether the blue residue could have traveled through the suspected methane-leak path."
  stake: "12 work shifts remain before launch. A blue swab rests beside a clear dry-line cartridge. Today you decide whether the blue stain could travel down the methane line."
  takeaway: "A substance's physical properties can rule out a proposed evidence path."
  segue: "But Achebe's water alarm now points at the Ice Cut; three matching displays must face one fresh sample."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Valence electron", def: "an electron in an atom's outer occupied region. These electrons are the ones most directly involved in chemical bonds."}
  - {name: "Lone pair", def: "a pair of valence electrons not shared in a bond. Lone pairs still repel other electron groups and can change molecular shape."}
  - {name: "Polarity", def: "an uneven distribution of electrical charge. A molecule is polar when its bond effects do not cancel across its shape."}
  - {name: "Intermolecular force", def: "an attraction between separate particles. Stronger attractions usually make a substance harder to separate into a gas."}
  primer:
  - "Use this chain: Lewis structure -> geometry -> bond effects -> molecular polarity -> intermolecular behavior."
  - "Similar colors do not prove two residues are the same substance."
  - "A proposed travel path must agree with the substance's phase and attractions at every temperature along the path."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-catalyst-bay
    # On arrival at Catalyst Bay | automatic | 
    on: { enter: true, at: KINET }
    world: "A blue swab rests beside a clear dry-line cartridge."
    panel: "MISSION 4 - WHAT CAN TRAVEL WHERE?"
    # unlocks: Stop 13 at the molecular-model bench; Stop 14 unlocks immediately after Stop 13.
    bubbles:
    - who: cho   # Cho
      say: "A stain is evidence that a substance reached this spot. It is not proof of how it arrived. We test the path before we name a leak."
  - id: after-stops-13-and-14
    # After Stops 13 and 14 | molecular-model bench | automatic transition
    on: { after: [1, 2] }
    world: "At charge-bench, the dated accepted-result slip for Stop 13 reads: \"Four single bonds, no carbon lone pairs.\". The slip remains in that fixture's evidence holder."
    panel: "STRUCTURE -\\> GEOMETRY -\\> BOND DIPOLES -\\> MOLECULAR POLARITY."
    # unlocks: Stop 15 at the property-card rack.
    bubbles:
    - who: cho   # Cho
      say: "Nice work. Now compare methane with the residue. Shape and polarity decide whether they travel together."
  - id: after-stop-15
    # After Stop 15 | property-card rack | automatic response
    on: { after: [3] }
    world: "At molecular-model-rail, the dated accepted-result slip for Stop 14 reads: \"As listed.\". The slip remains in that fixture's evidence holder."
    panel: "NEXT TASK - STOP 16: CAN THE BLUE RESIDUE RIDE THE GAS STREAM?"
    # unlocks: Stop 16 at the separation cartridge.
    bubbles:
    - who: cho   # Cho
      say: "Good thinking. The proposed path asks polar liquid to behave like dry methane gas. Run the cartridge and make it prove that claim."
  - id: after-stop-16
    # After Stop 16 | separation cartridge | automatic reversal
    on: { after: [4] }
    world: "At model-rail-desk, the dated accepted-result slip for Stop 15 reads: \"Mapping as listed.\". The slip remains in that fixture's evidence holder."
    panel: "MISSION DECISION READY"
    # unlocks: The Mission 4 outcome beat.
    bubbles:
    - who: cho   # Cho
      say: "Exactly right. The blue fluid is real. The methane-leak story attached to it is not."
  - id: at-mission-end
    # At mission end | Catalyst Bay | automatic outcome and hook
    on: { missionEnd: true }
    world: "At separation-cartridge, Mei-Ling Cho sets the retained blue residue in a LOCAL MAINTENANCE tray. The dated prop remains here on later visits."
    panel: "LOCAL INVESTIGATION COMPLETE / NEXT DESTINATION - WATER PLANT."
    # unlocks: Mission 5 briefing and the Water Plant waypoint.
    bubbles:
    - who: cho   # Mei-Ling Cho
      say: "It could not have made that journey dry. But Achebe's water alarm now points at the Ice Cut; three matching displays must face one fresh sample."


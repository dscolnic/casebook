# ============================================================ MISSION 8
# Split back out of books/redsand_v5.yml by tools/split-book.mjs; the book's text, verbatim.
# Lifted from ../fpl_gpt/Mars_AP_Chemistry_Campaign_Implementation_Bible_v10.5_Explicit_Build_Ownership.md by tools/v10extract.mjs. Every quoted string below is
# the bible's, verbatim; engine/dev/bibleParity.mjs holds it to that.
- title: "The Override"
  card:
    header: "MISSION 8 - 8 WORK SHIFTS REMAIN BEFORE LAUNCH."
    title: "THE OVERRIDE"
    goNow: "Go to Plant Control and meet Commander Laila Abiola, the mission commander, at the initial-rate board."
    body: "8 work shifts remain before launch. Herrera's name appears on a sheet no one has put back in its folder. Today you decide what the signed setting change actually caused."
    objective: "Measure the effect of the temperature change and verify who made the override."
  objective: "Measure the effect of the temperature change and verify who made the override."
  stake: "8 work shifts remain before launch. Herrera's name appears on a sheet no one has put back in its folder. Today you decide what the signed setting change actually caused."
  takeaway: "Verification may require separate evidence for identity, timing, and physical condition."
  segue: "But Cho's bed sample carries halide; the damaged catalyst must be mapped before the old setting can return."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Reaction rate", def: "measures how quickly reactants are consumed or products are formed. An initial rate is measured before the concentrations have changed much."}
  - {name: "Rate law", def: "describes how measured reaction rate depends on reactant concentrations. Its exponents must come from experiment, not from the balanced equation."}
  - {name: "Reaction order", def: "the exponent showing how strongly rate responds to one concentration. Doubling a first-order reactant doubles rate; doubling a second-order reactant multiplies rate by four."}
  - {name: "Rate constant", def: "the proportional number in a rate law at a particular temperature. Its units depend on the total reaction order."}
  equations:
  - {"e":"rate = k[CO2]^m[H2]^n","c":"predicting how carbon-dioxide and hydrogen concentrations change methane-production speed","v":[["rate","methane formation per unit time"],["k","rate constant"],["[CO2]","carbon-dioxide concentration"],["[H2]","hydrogen concentration"],["m","and"],["n","experimentally measured reaction orders"]],"s":"The crew must quantify how hydrogen dilution and the temperature setting changed production before judging the override."}
  - {"e":"k = rate / ([CO2]^m[H2]^n)","c":"finding the rate constant from one measured trial","v":[["k","rate constant"],["rate","measured methane formation per unit time"],["[CO2]","carbon-dioxide concentration"],["[H2]","hydrogen concentration"],["m","and"],["n","reaction orders"]],"s":"A correct baseline lets the controlled temperature reversal be compared to the response predicted at the starting condition."}
  primer:
  - "Compare trials that change one concentration at a time."
  - "Rate describes speed, not the final amount present after the reaction settles."
  - "A signed action record proves who changed a control; a reversible experiment proves the control's immediate physical effect."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-plant-control
    # On arrival at Plant Control | automatic | 
    on: { enter: true, at: GIBBS }
    world: "Herrera's name appears on a sheet no one has put back in its folder."
    panel: "MISSION 8 - THE OVERRIDE"
    # unlocks: Stop 29 at the rate board; Stop 30 unlocks immediately after Stop 29.
    bubbles:
    - who: abiola   # Abiola
      say: "We know the temperature changed and production later fell. Determine exactly how the reaction responds, then reproduce the effect while every other condition is held fixed."
  - id: after-stops-29-and-30
    # After Stops 29 and 30 | rate board | automatic response
    on: { after: [1, 2] }
    world: "At rate-board, the dated accepted-result slip for Stop 29 reads: \"First order in CO2 and second order in H2.\". The slip remains in that fixture's evidence holder."
    panel: "CONTROLLED REVERSAL AUTHORIZED."
    # unlocks: The Sabatier Reactor waypoint and Stop 31.
    bubbles:
    - who: sundqvist   # Sundqvist
      say: "Nice work. Hydrogen dilution hurts twice in the rate law. Now isolate temperature at the reactor."
  - id: after-stop-31
    # After Stop 31 | Sabatier Reactor | automatic causal result
    on: { after: [3] }
    world: "At rate-board, the dated accepted-result slip for Stop 30 reads: \"0.300 M^-2 s^-1; tolerance +/-2%.\". The slip remains in that fixture's evidence holder."
    panel: "TEMPERATURE CHANGE CAUSES RATE CHANGE / RESPONSE REVERSIBLE."
    # unlocks: Stop 32 at the verification panel.
    bubbles:
    - who: abiola   # Abiola
      say: "Good thinking. The override caused the immediate slowdown. That proves the effect, not the motive."
  - id: after-stop-32
    # After Stop 32 | verification panel | automatic character beat
    on: { after: [4] }
    world: "At skid, the dated accepted-result slip for Stop 31 reads: \"Lower temperature alone, observe rate fall, restore temperature, observe rate return.\". The slip remains in that fixture's evidence holder."
    panel: "MISSION DECISION READY"
    # unlocks: The Mission 8 outcome beat.
    bubbles:
    - who: abiola   # Abiola
      say: "Exactly right. Herrera made the change. The hardware changed when the signed log says it did."
    - who: herrera   # Herrera
      say: "Then inspect the bed before you decide whether I should have left it hot."
  - id: at-mission-end
    # At mission end | Reactor Hall | automatic outcome and hook
    on: { missionEnd: true }
    world: "At verification-panel, Ingrid Sundqvist pins the RATE DROP VERIFIED / MOTIVE UNRESOLVED strip beside the signature. The dated prop remains here on later visits."
    panel: "NEXT DESTINATION - CATALYST BAY."
    # unlocks: Mission 9 briefing and the Catalyst Bay waypoint.
    bubbles:
    - who: sundqvist   # Ingrid Sundqvist
      say: "I can prove it slowed us. That is not the same as proving why. But Cho's bed sample carries halide; the damaged catalyst must be mapped before the old setting can return."


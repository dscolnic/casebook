- title: "The Override"
  card:
    header: "8 SHIFTS UNTIL THE LAUNCH WINDOW CLOSES"
    title: "THE OVERRIDE"
    goNow: "Go to Plant Control and meet Commander Laila Abiola, the mission commander, at the initial-rate board."
    body: "The cooling system weakened before the temperature was lowered, yet the lower setting clearly reduced methane production. The crew must separate what the change caused from why it was made. In Plant Control and Reactor Hall, derive the rate law, calculate its constant, and reverse one controlled temperature change. By the end of the mission, decide who changed the setting and whether that action caused the immediate slowdown."
    objective: "Measure the effect of the temperature change and verify who made the override."
  objective: "Measure the effect of the temperature change and verify who made the override."
  stake: "The cooling system weakened before the temperature was lowered, yet the lower setting clearly reduced methane production. The crew must separate what the change caused from why it was made. In Plant Control and Reactor Hall, derive the rate law, calculate its constant, and reverse one controlled temperature change. By the end of the mission, decide who changed the setting and whether that action caused the immediate slowdown."
  takeaway: "Verification may require separate evidence for identity, timing, and physical condition."
  segue: "Mission decision: The signed change caused the fast rate drop. Its purpose is still not known. One test lowers and restores the rate while all other controls stay fixed. Separate records prove who made the change and when. The catalyst bed must be mapped before the old setting can return."
  # The mission card's own "Primer concepts", printed on the plan card.
  primer:
  - "Compare trials that change one concentration at a time."
  - "Rate describes speed, not the final amount present after the reaction settles."
  - "A signed action record proves who changed a control; a reversible experiment proves the control's immediate physical effect."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-plant-control
    # On arrival at Plant Control | automatic | 
    on: { enter: true, at: GIBBS }
    world: "Three initial-rate trials appear beside Herrera's signed override."
    panel: "MISSION 8 - THE OVERRIDE"
    # unlocks: Stop 29 at the rate board; Stop 30 unlocks immediately after Stop 29.
    bubbles:
    - who: abiola   # Abiola
      say: "We know the temperature changed and production later fell. Determine exactly how the reaction responds, then reproduce the effect while every other condition is held fixed."
  - id: after-stops-29-and-30
    # After Stops 29 and 30 | rate board | automatic response
    on: { after: [1, 2] }
    world: "The rate law locks as rate = k\\[CO2\\]\\[H2\\]^2 and k displays as 0.300 M^-2 s^-1."
    panel: "CONTROLLED REVERSAL AUTHORIZED."
    # unlocks: The Sabatier Reactor waypoint and Stop 31.
    bubbles:
    - who: sundqvist   # Sundqvist
      say: "Hydrogen dilution hurts twice in the rate law. Now isolate temperature at the reactor."
  - id: after-stop-31
    # After Stop 31 | Sabatier Reactor | automatic causal result
    on: { after: [3] }
    world: "Lower temperature reduces rate; restoring temperature restores the immediate rate response while feed, pressure, and flow remain fixed."
    panel: "TEMPERATURE CHANGE CAUSES RATE CHANGE / RESPONSE REVERSIBLE."
    # unlocks: Stop 32 at the verification panel.
    bubbles:
    - who: abiola   # Abiola
      say: "The override caused the immediate slowdown. That proves the effect, not the motive."
  - id: after-stop-32
    # After Stop 32 | verification panel | automatic character beat
    on: { after: [4] }
    world: "Badge record, controller log, and independent temperature sensor align; the handwritten note remains unverified."
    panel: "MISSION DECISION READY"
    # unlocks: The Mission 8 outcome beat.
    bubbles:
    - who: abiola   # Abiola
      say: "Herrera made the change. The hardware changed when the signed log says it did."
    - who: herrera   # Herrera
      say: "Then inspect the bed before you decide whether I should have left it hot."
  - id: at-mission-end
    # At mission end | Reactor Hall | automatic outcome and hook
    on: { missionEnd: true }
    world: "A single average-temperature number splits into INLET, MIDDLE, and OUTLET blanks."
    panel: "NEXT DESTINATION - CATALYST BAY."
    # unlocks: Mission 9 briefing and the Catalyst Bay waypoint.
    bubbles:
    - who: herrera   # Herrera
      say: "A catalyst bed does not have one temperature. An average can hide the point that destroys it."
    - who: sundqvist   # Sundqvist
      say: "Then we probe from front to back before restart."

  stops:
  # --- Stop 29: Read the initial-rate table
  #     Concept: experimental rate laws; Keystone: kinetics and rate law; Area: Catalyst Bay; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: CHOICE, asked at Ingrid Sundqvist beside rate-board.
  - group: KINET
    at: rate-board
    title: "Read the initial-rate table"
    person: sundqvist
    concept: "experimental rate laws"
    reason: "The rate response must come from experiment, not equation coefficients."
    scene: "To measure the override's effect, use initial-rate trials to determine how methane production responds to carbon-dioxide and hydrogen concentration. The exponents will predict why hydrogen dilution damages output so strongly."
    motivation: "The rate law predicts how strongly hydrogen dilution could cut methane production."
    format: CHOICE
    question: "Which rate law fits?"
    choices:
    - "rate = k\\[CO2\\]\\[H2\\]^2"
    - "rate = k\\[CO2\\]^2\\[H2\\]"
    - "rate = k\\[CO2\\]\\[H2\\]"
    - "rate = k\\[CO2\\]^2\\[H2\\]^4"
    answer: "rate = k\\[CO2\\]\\[H2\\]^2"
    answerText: "The rate law is rate = k[CO2][H2]^2."
    why: "Doubling CO2 at fixed H2 doubles rate, so exponent 1. Doubling H2 at fixed CO2 quadruples rate, so exponent 2. Overall order is 3."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2) Doubling CO2 at fixed H2 doubles the rate, so CO2 is first order rather than second order. (3) Doubling H2 at fixed CO2 quadruples the rate, so H2 is second order rather than first order. (4) Copying balanced-equation coefficients into a rate law overpredicts both concentration effects; reaction orders come from the trials.
    # correct result: First order in CO2 and second order in H2.
    # state/output: Rate-law card added to case file.

  # --- Stop 30: Calculate k
  #     Concept: rate constant/units; Keystone: kinetics and rate law; Area: Catalyst Bay; Learning role: PRACTICE; Difficulty: L2; Story role: clue.
  #     placement: BALLPARK, at rate-board.
  - group: KINET
    at: rate-board
    title: "Calculate k"
    concept: "rate constant/units"
    reason: "The controlled trial needs a numerical baseline for the rate constant."
    scene: "Calculate the rate constant from one trial so the controlled temperature test has a quantitative baseline. That numerical baseline makes the later temperature reversal a useful quantitative test of cause."
    motivation: "A valid rate constant lets the crew predict the rate change instead of arguing from the timing alone."
    format: BALLPARK
    question: "Use Trial 1 and rate = k\\[CO2\\]\\[H2\\]^2 to find k."
    # CONVERTED from the bible's `data` line, k = 1.20e-3 / [(0.10)(0.20)^2], and
    # its "0.300 M^-2 s^-1; tolerance +/-2%" (2% of 0.300 = 0.006).
    estimate:
      question: "Use Trial 1 and rate = k[CO2][H2]^2 to find k."
      relationship: "k = rate ÷ ([CO2] × [H2]²)"
      labels:
      - "1.20×10⁻³ M/s"
      - "0.10 M CO2"
      - "0.20 M H2"
      values: [1.20e-3, 0.10, 0.20]
      slots: 3
      template: '{0} ÷ ({1} × {2}²)'
      formula: a/(b*c*c)
      correct: [0, 1, 2]
      target: 0.300
      tolerance: 0.006
      units: "M^-2 s^-1"
    answerText: "The rate constant is 0.300 M^-2 s^-1."
    why: "The concentration product is 0.0040 M^3, so k = (1.20e-3 M/s)/(0.0040 M^3) = 0.300 M^-2 s^-1. Substituting another trial should reproduce the same k at the same temperature."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A unit of s^-1 belongs to a first-order law, not this one.
    # data: k = 1.20e-3 / \[(0.10)(0.20)^2\].
    # correct result: 0.300 M^-2 s^-1; tolerance +/-2%.
    # state/output: Predicts the rate drop expected from reduced temperature for Stop 31.

  # --- Stop 31: Establish causation by reversal
  #     Concept: temperature and rate; Keystone: kinetics and rate law; Area: Catalyst Bay; Learning role: APPLY; Difficulty: L3; Story role: character.
  #     placement: CONTROL, operated at skid.
  - group: KINET
    at: skid
    title: "Establish causation by reversal"
    concept: "temperature and rate"
    reason: "A reversible one-variable test can prove the immediate causal effect."
    scene: "Hold feed, pressure, and flow fixed and reverse only temperature to prove whether Herrera's change caused the slowdown. Restoring the response afterward will clearly separate deliberate intervention from ordinary drift."
    motivation: "The reversal proves the lower set point caused the immediate slowdown, while leaving the safety motive open."
    format: CONTROL
    question: "Which controlled change demonstrates that the override caused the immediate rate loss, and does the response reverse?"
    # MODEL CONVERSION. The bible lists five plant variables, three of them
    # candidates, and a rate index that falls 100 -> 72 and returns. The engine's
    # CONTROL board offers the candidates, holds the rest, and grades the named
    # cause: `response` is the signed change in the reading (72 - 100), `noise` is
    # the bible's noise band, and `truth` its `correct`.
    control:
      observable: { label: "Rate index" }
      variables:
      - { id: temperature_K, label: "Reactor temperature" }
      - { id: h2_M, label: "H2 concentration" }
      - { id: pressure_bar, label: "Pressure" }
      held: ["CO2 concentration", "Flow"]
      truth: temperature_K
      baseline: 100
      response: -28
      noise: 2
      run: "Run the measurement"
      commit: "Name the cause"
    answerText: "Lower only temperature, observe the rate fall, then restore temperature and observe the rate return."
    why: "Reversal makes drift less plausible. The result proves the lower set point reduced reaction rate. It does not prove whether lowering it was unnecessary, because the short test does not recreate the developing thermal condition."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Changing flow or concentration confounds the intended causal question. A one-way change without restoration cannot separate intervention from drift.
    # correct result: Lower temperature alone, observe rate fall, restore temperature, observe rate return.
    # state/output: Set evidence_flags.override_caused_rate_drop = true.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   control:
    #     variables:
    #       - {id: temperature_K, label: "Reactor temperature", baseline: 560, test: 540, unit: K}
    #       - {id: co2_M, label: "CO2 concentration", baseline: 0.10, test: 0.10, unit: M}
    #       - {id: h2_M, label: "H2 concentration", baseline: 0.20, test: 0.20, unit: M}
    #       - {id: pressure_bar, label: "Pressure", baseline: 10, test: 10, unit: bar}
    #       - {id: flow_index, label: "Flow", baseline: 100, test: 100, unit: index}
    #     candidates: [temperature_K, h2_M, pressure_bar]
    #     response: {label: "Rate index", baseline: 100, after_change: 72, after_restore: 100, noise_band: 2}
    #     required_sequence: [change_temperature_only, measure, restore_temperature, measure_again]
    #     correct: temperature_K

  # --- Stop 32: Verify who changed it
  #     Concept: verification/chain of custody; Keystone: evidence must be independent; Area: Plant Control; Learning role: APPLY; Difficulty: L3; Story role: reveal.
  #     placement: ATTEST, asked at Commander Laila Abiola beside verification-panel.
  - group: GIBBS
    at: verification-panel
    title: "Verify who changed it"
    person: abiola
    concept: "verification/chain of custody"
    reason: "The crew needs separate proof of identity, timing, and physical change."
    scene: "With the effect established, compare independent access and instrument records to determine who made the change and when. The evidence budget must verify the action without pretending to prove motive."
    motivation: "The crew must distinguish proof that Herrera acted from assumptions about why he acted."
    format: ATTEST
    question: "Choose the three checks that verify who changed the setting and when."
    # CONVERTED from the payload below. `limit` -> `checks`; each claim's
    # `backing` is the `evidence` a verification turns up; `backed` and `critical`
    # carry across unchanged.
    attest:
      checks: 3
      claims:
      - { id: presence, label: "Herrera was in Reactor Hall", evidence: "Badge log", backed: true }
      - { id: command, label: "Herrera's authenticated account changed the set point", evidence: "Signed controller audit", backed: true, critical: true }
      - { id: physical_change, label: "Temperature changed at the same time", evidence: "Independent temperature historian", backed: true, critical: true }
      - { id: written_note, label: "The handwritten note was written before the change", evidence: "No verified timestamp" }
      - { id: sabotage_motive, label: "The change was intended as sabotage", evidence: "No direct evidence", critical: true }
      commit: "Close the list"
    answerText: "Use the controller audit, independent temperature history, and badge log; motive remains unverified."
    why: "A record of access is not a record of the physical condition, and a physical trace without identity does not name the actor. Independent identity and condition records together verify the claim."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Spending only on repeated access evidence proves presence several times but not the temperature change.
    # correct result: Controller audit + independent temperature historian establish the change and time; badge log supports presence. The note and memory alone are insufficient.
    # state/output: herrera_access_suspended = true; case file reads ACTION VERIFIED / MOTIVE OPEN.

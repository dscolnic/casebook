  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 8: worked examples"
    examples:
    - {"title":"Infer a rate order","problem":"Doubling [A] while holding all else fixed makes the initial reaction rate four times as large. Find the order in A.","rule":"If rate=k[A]^m, the rate ratio is 2^m.","steps":["2^m=4.","m=2 because 2²=4."],"answer":"The reaction is second order in A over the tested conditions.","mistake":"Reaction coefficients do not generally determine measured rate orders."}
    - {"title":"Find a rate constant","problem":"For rate=k[A]², rate=0.08 mol/(L s) when [A]=0.2 mol/L. Find k.","rule":"k=rate/[A]².","steps":["Set up the relationship: k=rate/[A]².","k=0.08/(0.2)²=0.08/0.04=2 L/(mol s)."],"answer":"The rate constant is 2 L/(mol s).","mistake":"Square the concentration, and retain the resulting units."}
    - {"title":"Change two concentrations","problem":"A reaction has rate=k[A][B]². Double [A] and halve [B]. Find the rate factor.","rule":"rate_new/rate_old=(A_new/A_old)(B_new/B_old)².","steps":["Set up the relationship: rate_new/rate_old=(A_new/A_old)(B_new/B_old)².","rate factor=2(1/2)²=1/2."],"answer":"The new rate is half the original rate.","mistake":"Halving B changes its squared contribution by one quarter."}
    - {"title":"Use a reversible intervention","problem":"A lamp draws 2 A at setting A, 3 A at setting B, and 2 A after returning to A. Supply voltage and the lamp are unchanged. What does this support?","rule":"Change one proposed cause, hold other relevant factors fixed, then restore the original condition.","steps":["A → B changes the current by 3-2 = 1 A.","B → A restores 2 A. The response reverses with the setting under the stated controls."],"answer":"The result supports a setting effect under these test conditions.","mistake":"One intervention does not prove the effect is identical under every other condition."}
    - {"title":"Explain surface area","problem":"Equal masses of the same solid react with the same excess solution. One is powdered and one is a single piece. Why may powder react faster?","rule":"For a surface reaction, more exposed surface can provide more reaction sites.","steps":["Powder exposes more surface per unit mass.","More sites can contact the solution at once, increasing the observed rate under comparable conditions."],"answer":"Powder can react faster without changing the theoretical product amount.","mistake":"A rate increase does not create extra reactant."}

  stops:
  # --- Stop 29: Read the initial-rate table
  #     Concept: experimental rate laws; Keystone: kinetics and rate law; Area: Catalyst Bay; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: CHOICE, asked at Ingrid Sundqvist beside rate-board.
  - group: KINET
    at: rate-board
    title: "Read the initial-rate table"
    person: sundqvist
    concept: 9   # experimental rate laws
    reason: "The thermal review is complete and the rate data can now test the effect of diluted hydrogen."
    scene: "The exponents will predict why hydrogen dilution damages output so strongly."
    motivation: "The reaction orders show how strongly output responds to each feed concentration."
    format: CHOICE
    question: "Which rate law fits?"
    choices:
    - "rate = k\\[CO2\\]\\[H2\\]^2"
    - "rate = k\\[CO2\\]^2\\[H2\\]"
    - "rate = k\\[CO2\\]\\[H2\\]"
    - "rate = k\\[CO2\\]^2\\[H2\\]^4"
    answer: "rate = k\\[CO2\\]\\[H2\\]^2"
    answerText: "The rate law is rate = k[CO2][H2]^2."
    why: "Doubling CO2 at fixed H2 doubles rate, so exponent 1. Doubling H2 at fixed CO2 quadruples rate, so exponent 2. Overall order is 3."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2) Doubling CO2 at fixed H2 doubles the rate, so CO2 is first order rather than second order. (3) Doubling H2 at fixed CO2 quadruples the rate, so H2 is second order rather than first order. (4) Copying balanced-equation coefficients into a rate law overpredicts both concentration effects; reaction orders come from the trials.
    # correct result: First order in CO2 and second order in H2.
    # state/output: Rate-law card added to case file.

  # --- Stop 30: Calculate k
  #     Concept: rate constant/units; Keystone: kinetics and rate law; Area: Catalyst Bay; Learning role: PRACTICE; Difficulty: L2; Story role: clue.
  #     placement: BALLPARK, at rate-board.
  - group: KINET
    at: rate-board
    title: "Calculate k"
    concept: 9   # rate constant/units
    reason: "The reaction orders are identified and the temperature intervention needs a quantitative rate baseline."
    scene: "Trial 1 records rate = 1.20 × 10^-3 M/s, [CO2] = 0.10 M, and [H2] = 0.20 M. The established rate law is rate = k[CO2][H2]^2, where k is the rate constant."
    motivation: "The rate constant makes the later temperature test comparable with the measured initial-rate trials."
    format: BALLPARK
    question: "Use Trial 1 and rate = k\\[CO2\\]\\[H2\\]^2 to find k."
    # CONVERTED from the bible's `data` line, k = 1.20e-3 / [(0.10)(0.20)^2], and
    # its "0.300 M^-2 s^-1; tolerance +/-2%" (2% of 0.300 = 0.006).
    estimate:
      question: "Use Trial 1 and rate = k[CO2][H2]^2 to find k."
      relationship: "k = rate ÷ ([CO2] × [H2]²)"
      labels:
      - "1.20×10⁻³ M/s"
      - "0.10 M CO2"
      - "0.20 M H2"
      values: [1.20e-3, 0.10, 0.20]
      slots: 3
      template: '{0} ÷ ({1} × {2}²)'
      formula: a/(b*c*c)
      correct: [0, 1, 2]
      target: 0.300
      tolerance: 0.006
      units: "M^-2 s^-1"
    answerText: "The rate constant is 0.300 M^-2 s^-1."
    why: "The concentration product is 0.0040 M^3, so k = (1.20e-3 M/s)/(0.0040 M^3) = 0.300 M^-2 s^-1. Substituting another trial should reproduce the same k at the same temperature."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A unit of s^-1 belongs to a first-order law, not this one.
    # data: k = 1.20e-3 / \[(0.10)(0.20)^2\].
    # correct result: 0.300 M^-2 s^-1; tolerance +/-2%.
    # state/output: Predicts the rate drop expected from reduced temperature for Stop 31.

  # --- Stop 31: Establish causation by reversal
  #     Concept: temperature and rate; Keystone: kinetics and rate law; Area: Catalyst Bay; Learning role: APPLY; Difficulty: L3; Story role: character.
  #     placement: CONTROL, operated at skid.
  - group: KINET
    at: skid
    title: "Establish causation by reversal"
    concept: 9   # temperature and rate
    reason: "The rate baseline is fixed and the suspected temperature effect is ready for a controlled intervention."
    scene: "Hold feed, pressure, and flow fixed and reverse only temperature to prove whether Herrera's change caused the slowdown."
    motivation: "A reversible rate response isolates temperature as a cause rather than relying on coincident changes."
    format: CONTROL
    question: "Which controlled change demonstrates that the override caused the immediate rate loss, and does the response reverse?"
    # MODEL CONVERSION. The bible lists five plant variables, three of them
    # candidates, and a rate index that falls 100 -> 72 and returns. The engine's
    # CONTROL board offers the candidates, holds the rest, and grades the named
    # cause: `response` is the signed change in the reading (72 - 100), `noise` is
    # the bible's noise band, and `truth` its `correct`.
    control:
      observable: { label: "Rate index" }
      variables:
      - { id: temperature_K, label: "Reactor temperature" }
      - { id: h2_M, label: "H2 concentration" }
      - { id: pressure_bar, label: "Pressure" }
      held: ["CO2 concentration", "Flow"]
      truth: temperature_K
      baseline: 100
      response: -28
      noise: 2
      run: "Run the measurement"
      commit: "Name the cause"
    answerText: "Lower only temperature, observe the rate fall, then restore temperature and observe the rate return."
    why: "Reversal makes drift less plausible. The result proves the lower set point reduced reaction rate. It does not prove whether lowering it was unnecessary, because the short test does not recreate the developing thermal condition."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Changing flow or concentration confounds the intended causal question. A one-way change without restoration cannot separate intervention from drift.
    # correct result: Lower temperature alone, observe rate fall, restore temperature, observe rate return.
    # state/output: Set evidence_flags.override_caused_rate_drop = true.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   control:
    #     variables:
    #       - {id: temperature_K, label: "Reactor temperature", baseline: 560, test: 540, unit: K}
    #       - {id: co2_M, label: "CO2 concentration", baseline: 0.10, test: 0.10, unit: M}
    #       - {id: h2_M, label: "H2 concentration", baseline: 0.20, test: 0.20, unit: M}
    #       - {id: pressure_bar, label: "Pressure", baseline: 10, test: 10, unit: bar}
    #       - {id: flow_index, label: "Flow", baseline: 100, test: 100, unit: index}
    #     candidates: [temperature_K, h2_M, pressure_bar]
    #     response: {label: "Rate index", baseline: 100, after_change: 72, after_restore: 100, noise_band: 2}
    #     required_sequence: [change_temperature_only, measure, restore_temperature, measure_again]
    #     correct: temperature_K

  # --- Stop 32: Verify who changed it
  #     Concept: verification/chain of custody; Keystone: evidence must be independent; Area: Plant Control; Learning role: APPLY; Difficulty: L3; Story role: reveal.
  #     placement: ATTEST, asked at Commander Laila Abiola beside verification-panel.
  - group: GIBBS
    at: verification-panel
    title: "Verify who changed it"
    person: abiola
    concept: 9   # verification/chain of custody
    reason: "The intervention's physical effect is established, but who changed the setting still needs independent records."
    scene: "With the effect established, compare independent access and instrument records to determine who made the change and when."
    motivation: "The audit distinguishes evidence of an action and its timing from unsupported claims about motive."
    format: ATTEST
    question: "Choose the three checks that verify who changed the setting and when."
    # CONVERTED from the payload below. `limit` -> `checks`; each claim's
    # `backing` is the `evidence` a verification turns up; `backed` and `critical`
    # carry across unchanged.
    attest:
      checks: 3
      claims:
      - { id: presence, label: "Herrera was in Reactor Hall", evidence: "Badge log", backed: true }
      - { id: command, label: "Herrera's authenticated account changed the set point", evidence: "Signed controller audit", backed: true, critical: true }
      - { id: physical_change, label: "Temperature changed at the same time", evidence: "Independent temperature historian", backed: true, critical: true }
      - { id: written_note, label: "The handwritten note was written before the change", evidence: "No verified timestamp" }
      - { id: sabotage_motive, label: "The change was intended as sabotage", evidence: "No direct evidence", critical: true }
      commit: "Close the list"
    answerText: "Use the controller audit, independent temperature history, and badge log; motive remains unverified."
    why: "A record of access is not a record of the physical condition, and a physical trace without identity does not name the actor. Independent identity and condition records together verify the claim."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Spending only on repeated access evidence proves presence several times but not the temperature change.
    # correct result: Controller audit + independent temperature historian establish the change and time; badge log supports presence. The note and memory alone are insufficient.
    # state/output: herrera_access_suspended = true; case file reads ACTION VERIFIED / MOTIVE OPEN.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   attest:
    #     limit: 3
    #     claims:
    #       - {id: presence, label: "Herrera was in Reactor Hall", backing: "Badge log", backed: true, critical: false}
    #       - {id: command, label: "Herrera's authenticated account changed the set point", backing: "Signed controller audit", backed: true, critical: true}
    #       - {id: physical_change, label: "Temperature changed at the same time", backing: "Independent temperature historian", backed: true, critical: true}
    #       - {id: written_note, label: "The handwritten note was written before the change", backing: "No verified timestamp", backed: false, critical: false}
    #       - {id: sabotage_motive, label: "The change was intended as sabotage", backing: "No direct evidence", backed: false, critical: true}
    #     recommended_checks: [command, physical_change, presence]
    #     correct: "Action and time verified; sabotage motive remains unbacked."

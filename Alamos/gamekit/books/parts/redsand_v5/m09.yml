  #     Concept: catalyst poisoning vs operating limits; Keystone: catalysts and mechanisms; Area: Catalyst Bay; Learning role: APPLY; Difficulty: L4; Story role: apparent resolution.
  #     placement: DIAGNOSIS, at spec-bench.
  - group: KINET
    at: spec-bench
    title: "Diagnose the immediate bed failure"
    concept: "catalyst poisoning vs operating limits"
    reason: "The independent assay must distinguish poisoning from other plausible failures."
    scene: "Combine that pattern with the independent surface assay to identify the immediate failure and decide whether catalyst replacement is necessary. The verdict decides whether replacement is necessary before any restart test."
    motivation: "The crew needs to know whether replacing catalyst is necessary before testing the dangerous old setting."
    format: DIAGNOSIS

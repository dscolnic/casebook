- title: "The Catalyst Bed"
  card:
    header: "MISSION 9 - 7 WORK SHIFTS REMAIN BEFORE LAUNCH."
    title: "THE CATALYST BED"
    goNow: "Go to Catalyst Bay and meet Dr. Tomás Herrera, the reactor and safety engineer, at the bed-sampling rail."
    body: "7 work shifts remain before launch. An inlet sample lies beside a much cleaner outlet sample. Today you decide which part of the catalyst bed needs replacement."
    objective: "Locate the catalyst-bed failure and distinguish damage, reactant shortage, and overheating."
  objective: "Locate the catalyst-bed failure and distinguish damage, reactant shortage, and overheating."
  stake: "7 work shifts remain before launch. An inlet sample lies beside a much cleaner outlet sample. Today you decide which part of the catalyst bed needs replacement."
  takeaway: "A correct immediate diagnosis can still leave a deeper causal or safety problem."
  segue: "But Herrera's old 612 K record is hotter than this damage explains; the hidden run must decide if his override saved the plant."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Catalyst", def: "speeds a reaction by providing a different path with a lower activation barrier. It is regenerated and does not change reaction enthalpy or the final equilibrium composition."}
  - {name: "Equilibrium", def: "the steady state reached when forward and reverse chemical changes occur at equal rates. A catalyst reaches that state faster but does not change the final mixture at a fixed temperature."}
  - {name: "Intermediate", def: "made in one mechanism step and consumed in a later step. It does not appear in the final balanced equation."}
  - {name: "Catalyst poisoning", def: "occurs when another substance blocks or changes active sites. A poison entering at one end can create a spatial failure rather than a uniform loss."}
  primer:
  - "A catalyst changes how fast equilibrium is reached, not where equilibrium ends."
  - "A mechanism must reproduce the balanced reaction after intermediates and the catalyst cancel."
  - "Sample from inlet to outlet before calling a catalyst bed uniformly damaged."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-catalyst-bay
    # On arrival at Catalyst Bay | automatic | 
    on: { enter: true, at: KINET }
    world: "An inlet sample lies beside a much cleaner outlet sample."
    panel: "MISSION 9 - THE CATALYST BED"
    # unlocks: Stop 33 at the mechanism console; Stop 34 unlocks immediately after Stop 33.
    bubbles:
    - who: herrera   # Herrera
      say: "A green average does not clear a hot inlet. Determine what a catalyst can change, then find where this bed stops behaving normally."
  - id: after-stops-33-and-34
    # After Stops 33 and 34 | mechanism console | automatic response
    on: { after: [1, 2] }
    world: "At charge-bench, the dated accepted-result slip for Stop 33 reads: \"First choice.\". The slip remains in that fixture's evidence holder."
    panel: "NEXT TASK - STOP 35: SAMPLE THE BED FROM INLET TO OUTLET"
    # unlocks: Stop 35 at the bed sampling rail.
    bubbles:
    - who: herrera   # Herrera
      say: "Nice work. A fresh catalyst can restore a path, not change the final balance or the heat of reaction. Now probe the real bed."
  - id: after-stop-35
    # After Stop 35 | bed sampling rail | automatic spatial discovery
    on: { after: [3] }
    world: "At bed-log, the dated accepted-result slip for Stop 34 reads: \"Order as listed; Ni surface sites are catalyst, surface species are intermediates, slow conversion is rate-determining.\". The slip remains in that fixture's evidence holder."
    panel: "FAILURE IS NOT UNIFORM / INLET-FIRST DAMAGE."
    # unlocks: The Assay Lab waypoint and Stop 36.
    bubbles:
    - who: sundqvist   # Sundqvist
      say: "Good thinking. That looks like catalyst poison. Send a sample to Achebe."
  - id: after-stop-36
    # After Stop 36 | Assay Lab | automatic diagnosis
    on: { after: [4] }
    world: "At bed-ports, the dated accepted-result slip for Stop 35 reads: \"Inlet end: high temperature and halide exposure with depressed local activity; pattern is nonuniform.\". The slip remains in that fixture's evidence holder."
    panel: "MISSION DECISION READY"
    # unlocks: The Mission 9 outcome beat.
    bubbles:
    - who: achebe   # Achebe
      say: "Exactly right. The catalyst is damaged. The assay does not explain why the inlet reached 612 kelvin before the override."
  - id: at-mission-end
    # At mission end | Assay Lab | automatic outcome and hook
    on: { missionEnd: true }
    world: "At bed, Mei-Ling Cho places the damaged inlet cartridge in the HALIDE DAMAGE tray. The dated prop remains here on later visits."
    panel: "NEXT TEST - HOLDOUT THERMAL RUN."
    # unlocks: Mission 10 briefing and the Sabatier Reactor waypoint.
    bubbles:
    - who: cho   # Mei-Ling Cho
      say: "Replace what failed. Do not ask the new bed to survive an unsafe setting. But Herrera's old 612 K record is hotter than this damage explains; the hidden run must decide if his override saved the plant."


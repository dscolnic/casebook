  #     Concept: catalyst poisoning vs operating limits; Keystone: catalysts and mechanisms; Area: Catalyst Bay; Learning role: APPLY; Difficulty: L4; Story role: apparent resolution.
  #     placement: DIAGNOSIS, at spec-bench.
  - group: KINET
    at: spec-bench
    title: "Diagnose the immediate bed failure"
    concept: 10   # catalyst poisoning vs operating limits

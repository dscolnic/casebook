  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 10: worked examples"
    examples:
    - {"title":"A measurement minus a prediction","problem":"A thermometer model predicts 20 °C; an independent thermometer reads 22 °C. Find the residual.","rule":"Residual = observed value - predicted value.","steps":["residual = 22 °C - 20 °C. Keep observed first.","residual = +2 °C. The positive sign means the observation is above the prediction."],"answer":"The model underpredicts this reading by 2 °C.","mistake":"Reversing the subtraction reverses the meaning of the sign."}
    - {"title":"Correct a known offset","problem":"A balance reads 52 g for a certified 50 g mass and 32 g for a second object. Assume a constant additive offset. Find the corrected second mass.","rule":"Offset = reading - reference; corrected value = reading - offset.","steps":["offset = 52 - 50 = +2 g. The balance reads high.","corrected mass = 32 - 2 = 30 g. Subtract the same offset."],"answer":"The corrected mass is 30 g.","mistake":"An additive offset is not a percentage error."}
    - {"title":"Test an entire allowed range","problem":"A component must operate at or below 80 °C. Its estimated temperature is 77 ± 4 °C. Does every allowed value pass?","rule":"Test the worst allowed value against the stated bound.","steps":["allowed interval = [77-4, 77+4] = [73,81] °C.","maximum allowed temperature = 81 °C > 80 °C. At least one allowed value fails."],"answer":"The estimate does not establish that every allowed temperature passes.","mistake":"Checking only the central estimate ignores the uncertainty."}
    - {"title":"Test a frozen prediction","problem":"Before seeing a new measurement, a model predicts 12 units with an allowed error of 1 unit. The new measurement is 15 units. Does it pass this test?","rule":"Absolute prediction error = |observed - predicted|.","steps":["absolute error = |15-12| = 3 units. The prediction remains fixed.","comparison = 3 > 1. The error exceeds the prewritten tolerance."],"answer":"The model fails this held-out test.","mistake":"Refitting to 15 before scoring would no longer test the original prediction."}
    - {"title":"Separate a fitted product","problem":"A rectangle has area 24 cm². Can area alone determine its length and width?","rule":"Area = length × width. One equation may leave more than one unknown pair.","steps":["24 = 6×4 and 24 = 8×3. Both pairs have the correct area.","If width is independently measured as 4 cm, length = 24/4 = 6 cm."],"answer":"Area alone is insufficient; the additional width measurement selects 6 cm by 4 cm.","mistake":"One matching output does not identify both input parameters."}

  stops:
  # --- Stop 37: Freeze the accusation and reveal the holdout
  #     Concept: model validation; Keystone: evidence must be independent; Area: Plant Control; Learning role: RETRIEVE; Difficulty: L4; Story role: reversal.
  #     placement: HOLDOUT, operated at analyser.
  - group: GIBBS
    at: analyser
    title: "Freeze the accusation and reveal the holdout"
    concept: 11   # model validation
    reason: "The accusation rests on visible runs and must be committed before the missing interval is opened."
    scene: "The hidden interval contains the cooling failure that the visible runs omitted."
    motivation: "Holdout performance tests whether the model can explain unseen safety behavior rather than only familiar production records."
    format: HOLDOUT
    question: "Freeze the fit, reveal the holdout intervals, and choose the model that predicts them."
    answerText: "Model B survives the frozen holdout; Model A misses the unseen hot-spot intervention."
    why: "A beautiful fit to visible data is not enough. The withheld interval contains the regime that matters: degraded cooling and a spatial gradient. Herrera's override is predicted by the safety model."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Refitting after seeing the holdout must be blocked; the point is honest prediction.
    # correct result: Freeze and choose model B after holdout; model A fails unseen safety behavior.
    # state/output: Set evidence_flags.accusation_model_failed = true.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   holdout:
    #     fit_set:
    #       label: "Eight visible normal intervals"
    #       models:
    #         - {id: model_a, label: "Set-point-only accusation model", fit_error: 2.1}
    #         - {id: model_b, label: "Cooling-loss plus inlet-hot-spot model", fit_error: 2.8}
    #     freeze_required: true
    #     holdout_set:
    #       - {id: h1, radiator_capacity_percent: 100, outlet_K: 566, inlet_K: 584, purge_open: false}
    #       - {id: h2, radiator_capacity_percent: 72, outlet_K: 569, inlet_K: 618, purge_open: true}
    #       - {id: h3, radiator_capacity_percent: 70, outlet_K: 568, inlet_K: 621, purge_open: true}
    #     predictions: {model_a: "safe/high output for h2-h3", model_b: "hot-spot intervention for h2-h3"}
    #     correct: model_b
    #     anti_cheat: "Refitting after reveal is disabled."
    holdout:
      axis:
        label: allowed outlet-temperature prediction error
        min: 0
        max: 12
        step: 3
        unit: K
      fit:
        - at: 0
          value: 0.57
        - at: 3
          value: 0.98
        - at: 6
          value: 0.84
        - at: 9
          value: 0.87
        - at: 12
          value: 0.83
      test:
        - at: 0
          value: 0.34
        - at: 3
          value: 0.45
        - at: 6
          value: 0.76
        - at: 9
          value: 0.86
        - at: 12
          value: 0.84
      overfitAt: 3
      correctAt: 9
      models:
        - id: A
          label: Set-point-only accusation model
          fitError: 2.1
        - id: B
          label: Cooling-loss plus inlet-hot-spot model
          fitError: 2.8
      heldOutOutlets:
        - 566
        - 569
        - 568
      correctChoice: B
      correctConclusion: Model B survives the unseen degraded-cooling intervals; model A does not.
      pass: 0.8

  # --- Stop 38: Refuse the lowest average error
  #     Concept: residual structure; Keystone: evidence must be independent; Area: Plant Control; Learning role: PRACTICE; Difficulty: L4; Story role: clue.
  #     placement: RESIDUAL, at residual-field.
  - group: GIBBS
    at: residual-field
    title: "Refuse the lowest average error"
    concept: 11   # residual structure
    reason: "The holdout exposes a model difference that average error alone could conceal."
    scene: "Inspect where each model misses because errors nearest the heat limit matter more than good average agreement."
    motivation: "The full residual pattern identifies which model captures the safety-relevant behavior instead of merely minimizing a summary score."
    format: RESIDUAL
    # MODEL CONVERSION. The bible gives each model an RMS and two lists of
    # residuals — normal intervals, and the low-radiator consequence region. The
    # engine plots a residual FIELD, so every value below is the bible's and only
    # its position is the implementation's: x is the interval's place in its own
    # list, and y is which region it belongs to (0 normal, 1 low radiator). The
    # trap is the bible's own: model_a has the lower RMS and the structured
    # underprediction, and model_b is the one to accept.
    residual:
      fits:
      - id: model_a
        label: "Set-point-only"
        rms: 2.1
        structured: true
        residuals:
        - { x: 1, y: 0, value: -2 }
        - { x: 2, y: 0, value: 1 }
        - { x: 3, y: 0, value: 0 }
        - { x: 4, y: 0, value: 2 }
        - { x: 5, y: 0, value: -1 }
        - { x: 1, y: 1, value: 12 }
        - { x: 2, y: 1, value: 15 }
        - { x: 3, y: 1, value: 14 }
      - id: model_b
        label: "Cooling plus spatial hot spot"
        rms: 2.8
        residuals:
        - { x: 1, y: 0, value: -4 }
        - { x: 2, y: 0, value: 2 }
        - { x: 3, y: 0, value: -1 }
        - { x: 4, y: 0, value: 3 }
        - { x: 5, y: 0, value: 0 }
        - { x: 1, y: 1, value: 3 }
        - { x: 2, y: 1, value: -2 }
        - { x: 3, y: 1, value: 4 }
      accept: model_b
      commit: "Accept this fit"
    question: "Choose the model whose residual field is defensible for safety."
    answerText: "Choose Model B because its residuals are unpatterned near the safety boundary."
    why: "Model A's lower overall RMS is purchased by systematic underprediction exactly where a safety limit matters. Residual structure means missing physics, not random noise. Model B is slightly less precise overall and far more valid in the dangerous regime."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Choosing Model A only because its global RMS is smaller ignores its repeated 12-15 K miss during low-radiator intervals. A safety model fails when its errors are structured in the consequence region.
    # correct result: Model B.
    # state/output: Highlight spatial heat-removal term missing from model A.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   residual:
    #     models:
    #       - {id: model_a, label: "Set-point-only", rms_K: 2.1, residuals_normal_K: [-2,1,0,2,-1], residuals_low_radiator_K: [12,15,14]}
    #       - {id: model_b, label: "Cooling plus spatial hot spot", rms_K: 2.8, residuals_normal_K: [-4,2,-1,3,0], residuals_low_radiator_K: [3,-2,4]}
    #     consequence_region: {label: "Low radiator capacity", safety_limit_K: 620}
    #     correct: model_b
    #     rule: "Reject structured underprediction in the consequence region even when global RMS is smaller."

  # --- Stop 39: Stress the hidden temperature error
  #     Concept: uncertainty and safety margin; Keystone: energy and uncertainty; Area: Reactor Hall; Learning role: COMBINE; Difficulty: L4; Story role: decision.
  #     placement: STRESS, asked at Ingrid Sundqvist beside reactor-console.
  - group: EQUIL
    at: reactor-console
    title: "Stress the hidden temperature error"
    person: sundqvist
    concept: 11   # uncertainty and safety margin
    reason: "The model comparison favors a lower setting, but the old restoration plan still needs a sensor-error test."
    scene: "Move the sensor bias across its allowed range to decide whether the old setting remains safe when the temperature reading is slightly wrong."
    motivation: "The possible actual temperature determines whether the restoration plan can cross the thermal limit within supported error bounds."
    format: STRESS
    question: "Does the decision to restore the old point survive allowed sensor error?"
    answerText: "Do not restore the old point; allowed negative sensor bias pushes the true peak over the limit."
    why: "A setting is not safe because its central estimate lies eight kelvin below a limit. The uncertainty range crosses the consequence boundary. Robust operation needs margin."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Keeping the old point because 612 K is below 620 K uses only the central reading. The allowed negative sensor bias pushes the true temperature above the limit, so the plan fails the full uncertainty range.
    # correct result: No. If the sensor reads 2% low, actual peak is about 624 K, already above limit; at -5% actual is about 644 K. The lower point remains below limit across the range.
    # state/output: Sundqvist withdraws restoration request; reactor_safety_margin + 20 for lower point.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   stress:
    #     assumption: {id: thermocouple_bias, label: "Inlet thermocouple bias", min: -5, max: 5, step: 1, unit: percent}
    #     candidates:
    #       - {id: old_point, label: "Restore old point", observed_peak_K: 612, actual_at_minus2_K: 624, actual_at_minus5_K: 644}
    #       - {id: lower_point, label: "Keep lower point", observed_peak_K: 575, actual_at_minus5_K: 605}
    #     consequence_limit: {label: "Maximum inlet temperature", value: 620, unit: K}
    #     correct: lower_point
    #     boundary_logic: "A candidate fails if any allowed bias places actual peak above 620 K."
    stress:
      candidates:
        - id: nominal_only
          label: Use only the nominal reading
        - id: common_extreme_mistake
          label: Use the favorable extreme as if it were guaranteed
        - id: robust_plan
          label: No. If the sensor reads 2% low, actual peak is about
      criteria:
        - key: evidence_fit
          label: fit to the stop evidence
        - key: safety_margin
          label: margin at the adverse end
      scores:
        nominal_only:
          evidence_fit: 95
          safety_margin: 20
        common_extreme_mistake:
          evidence_fit: 88
          safety_margin: 5
        robust_plan:
          evidence_fit: 82
          safety_margin: 92
      feasible:
        nominal_only: 0
        common_extreme_mistake: 0
        robust_plan: -10
      assumption:
        label: hidden temperature error
        unit: K
        min: -10
        max: 10
        nominal: 0
        step: 2
      robust: robust_plan
      optimiseOn: evidence_fit

  # --- Stop 40: What did Herrera know, and when?
  #     Concept: evidence synthesis; Keystone: energy and causal evidence; Area: Plant Control; Learning role: TRANSFER; Difficulty: L4; Story role: payoff.
  #     placement: CASEBOOK, asked at Commander Laila Abiola beside chronology-wall.
  - group: GIBBS
    at: chronology-wall
    title: "What did Herrera know, and when?"
    person: abiola
    concept: 11   # evidence synthesis
    reason: "The thermal evidence is complete and Herrera's override can now be placed in its actual sequence."
    scene: "Reconstruct the chain from radiator loss through override and production fall to determine whether Herrera created or interrupted the danger."
    motivation: "The timeline distinguishes an intervention that caused the danger from one that interrupted it."
    format: CASEBOOK
    question: "Match each event to its causal role, then decide what the override actually did."
    # CONVERTED from the payload below: the bible's clues on the left, its causal
    # roles on the right, its keyed `mapping` as the permutation. The clues carry
    # their labels only — the bible's `reading` on each one ("first change",
    # "later cost") names the role it maps to, and printing it beside the clue
    # would answer the board.
    scenarios:
    - "Radiator capacity fell"
    - "Inlet rose while outlet average stayed normal"
    - "Set point lowered"
    - "Purge interlock opened"
    - "Methane production fell"
    choices:
    - "Shrinking heat removal"
    - "Evidence of the hidden hot spot"
    - "Deliberate safety intervention"
    - "Protective consequence"
    - "Cost of the intervention"
    mapping: [0, 1, 2, 3, 4]

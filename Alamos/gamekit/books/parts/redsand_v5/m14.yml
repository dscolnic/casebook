    #       - {id: standard_a, label: "Assay Lab Standard A"}
    #     target: standard_c
    #     channels:
    #       - {id: pressure, label: "Tank pressure", reading: "19.1 bar / PASS", depends_on: [pressure_transducer]}
    #       - {id: mass, label: "Estimated methane mass", reading: "FULL", depends_on: [pressure, molar_mass_model]}
    #       - {id: online_quality, label: "Online composition", reading: "97.4% CH4 / PASS", depends_on: [cold_end_analyzer, standard_c]}
    #       - {id: control_quality, label: "Control-room quality", reading: "PASS", depends_on: [online_quality, standard_c]}
    #       - {id: ready_light, label: "LOAD READY", reading: "GREEN", depends_on: [mass, control_quality]}
    #       - {id: vial, label: "Independent Batch C vial", reading: "pending", depends_on: [standard_a]}
    #     truth: {dependent_channels: [online_quality, control_quality, ready_light], independent_channels: [pressure, vial]}
    #     correct: "Pressure is independently real; mass and quality are derived; the vial is the independent composition check."

  # --- Stop 54: Test certification on the newest sample
  #     Concept: model generalization; Keystone: evidence must be independent; Area: Plant Control; Learning role: COMBINE; Difficulty: L4; Story role: reveal.
  #     placement: HOLDOUT, operated at spec-bench.
  - group: GIBBS
    at: spec-bench
    title: "Test certification on the newest sample"
    concept: "model generalization"
    reason: "The certification model must pass the newest independent sample unchanged."
    scene: "Because several green signals share one standard, freeze the historical calibration and test it on the unseen Batch C vial. The frozen model must predict Batch C without moving the standard afterward."
    motivation: "The newest independent sample is the claim the certification model must get right before ascent."
    format: HOLDOUT
    question: "Freeze the historical certification model and score the unseen Batch C vial."
    answerText: "The frozen model fails Batch C, so quarantine the batch."
    why: "Passing historical clean samples does not validate extrapolation into a contaminated regime. The newest independent sample is exactly what certification must predict."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Refitting the calibration to make Batch C pass destroys the independence of the test.

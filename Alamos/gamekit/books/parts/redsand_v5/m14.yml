- title: "FULL"
  card:
    header: "2 SHIFTS UNTIL THE LAUNCH WINDOW CLOSES"
    title: "FULL"
    goNow: "Go to the Tank Farm and meet Rosalind Achebe, the analytical and electrochemistry lead, beside the newest sample vial."
    body: "The methane and oxygen displays read full, so launch control starts the countdown. An independent sample may show that one full tank contains the wrong mixture. At the Tank Farm, Assay Lab, and Pad Office, trace each green signal, test the vial, diagnose the mixture, and set the acceptance rule. By the end of the mission, decide whether the propellant is ready to fly or must be quarantined."
    objective: "Determine whether the full tanks meet the campaign's fictional flight-quality limits."
  objective: "Determine whether the full tanks meet the campaign's fictional flight-quality limits."
  stake: "The methane and oxygen displays read full, so launch control starts the countdown. An independent sample may show that one full tank contains the wrong mixture. At the Tank Farm, Assay Lab, and Pad Office, trace each green signal, test the vial, diagnose the mixture, and set the acceptance rule. By the end of the mission, decide whether the propellant is ready to fly or must be quarantined."
  takeaway: "\"Enough\" and \"safe to use\" are separate scientific claims."
  segue: "Mission decision: Stop the launch clock and hold Batch C. Its mass and pressure pass, but the new test finds too little methane and too much carbon dioxide and water. The batch fails the rule set before the test. One shift remains to make clean fuel without bringing back the heat risk."
  # The mission card's own "Primer concepts", printed on the plan card.
  primer:
  - "Amount, pressure, and composition are different claims and require evidence that can measure each one."
  - "Certification should use a frozen model and a new independent sample."
  - "Set the methane-purity trigger before the blind sample; keep carbon-dioxide, water, and pressure limits fixed as companion specifications."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-tank-farm
    # On arrival at Tank Farm | automatic | 
    on: { enter: true, at: TANKS }
    world: "Giant METHANE FULL and OXYGEN FULL indicators dominate the tank wall while Batch C is outlined in amber."
    panel: "MISSION 14 - FULL"
    # unlocks: Stop 53 at the Tank Farm dependency view.
    bubbles:
    - who: achebe   # Achebe
      say: "Mass and pressure say the tank is full. My independent vial says part of that mass is carbon dioxide and water. A full tank can still be the wrong propellant."
  - id: after-stop-53
    # After Stop 53 | Tank Farm dependency view | automatic discovery
    on: { after: [1] }
    world: "Estimated mass, online composition, control-room quality, and READY trace back to shared Standard C; the independent vial remains separate; The READY light changes from green to amber."
    panel: "RESULT RECORDED"
    # unlocks: The Assay Lab waypoint and Stops 54-55.
    bubbles:
    - who: achebe   # Achebe
      say: "Four displays do not make four measurements when three inherit the same calibration."
  - id: after-stops-54-and-55
    # After Stops 54 and 55 | Assay Lab | automatic Twist 3
    on: { after: [2, 3] }
    world: "The frozen certification model fails on unseen Batch C; Composition appears as 91.6% methane, 8.0% carbon dioxide, and 0.40% water."
    panel: "AMOUNT AT TARGET / COMPOSITION OUT OF SPECIFICATION."
    # unlocks: The Ascent Pad office waypoint and Stop 56.
    bubbles:
    - who: abiola   # Abiola
      say: "We made enough material. We did not make enough flight-ready methane."
  - id: after-stop-56
    # After Stop 56 | Pad Office | automatic crisis result
    on: { after: [4] }
    world: "The player commits methane, carbon-dioxide, water, pressure, and abort limits before two blind resamples are revealed; Both confirm Batch C fails composition."
    panel: "MISSION DECISION READY"
    # unlocks: The Mission 14 outcome beat.
    bubbles:
    - who: achebe   # Achebe
      say: "The deadline did not move the line. Batch C fails the rule we wrote before seeing it."
    - who: abiola   # Abiola
      say: "Countdown remains stopped."
  - id: at-mission-end
    # At mission end | Pad Office | automatic outcome and hook
    on: { missionEnd: true }
    world: "Abiola deletes FULL from the readiness display and replaces it with AMOUNT and SPECIFICATION; AMOUNT turns green; SPECIFICATION stays red; Four recovery plans appear with one shift remaining."
    panel: "FINAL MISSION - GO / NO-GO."
    # unlocks: Mission 15 briefing and the Plant Control waypoint.
    bubbles:
    - who: abiola   # Abiola
      say: "One shift. Enough total propellant. Not enough certified methane. Bring me the plan that gets us home without asking the rocket to trust a lie."

  stops:
  # --- Stop 53: Trace every green light
  #     Concept: evidence independence; Keystone: gas pressure and evidence independence; Area: Plant Control; Learning role: RETRIEVE; Difficulty: L4; Story role: clue.
  #     placement: TRACE, operated at farm-gauges.
  - group: GIBBS
    at: farm-gauges
    title: "Trace every green light"
    concept: "evidence independence"
    reason: "A green dashboard is not proof when its channels share dependencies."
    scene: "The tanks read full, so trace pressure, mass, composition, and the READY light to see whether the green signals are truly independent. Opening every dependency will reveal whether readiness has independent support."
    motivation: "A tank can look ready when several green numbers inherit the same wrong calibration."
    format: TRACE
    # CONVERTED from the payload below. `shared_resources` -> `resources`,
    # `depends_on` -> `depends`, `truth.independent_channels` -> `independent`.
    # The engine's `depends` names resources, so the three upstreams the bible's
    # channels name — the pressure transducer, the molar-mass model and the
    # cold-end analyzer — are declared as resources beside the two standards, and
    # a channel the bible routes through another channel is declared against the
    # resources that channel inherits.
    trace:
      resources:
      - { id: standard_c, label: "Cold-end Standard C" }
      - { id: standard_a, label: "Assay Lab Standard A" }
      - { id: pressure_transducer, label: "Pressure transducer" }
      - { id: molar_mass_model, label: "Molar-mass model" }
      - { id: cold_end_analyzer, label: "Cold-end analyzer" }
      target: standard_c
      channels:
      - { id: pressure, label: "Tank pressure", reading: "19.1 bar / PASS", depends: [pressure_transducer] }
      - { id: mass, label: "Estimated methane mass", reading: "FULL", depends: [pressure_transducer, molar_mass_model] }
      - { id: online_quality, label: "Online composition", reading: "97.4% CH4 / PASS", depends: [cold_end_analyzer, standard_c] }
      - { id: control_quality, label: "Control-room quality", reading: "PASS", depends: [cold_end_analyzer, standard_c] }
      - { id: ready_light, label: "LOAD READY", reading: "GREEN", depends: [pressure_transducer, molar_mass_model, cold_end_analyzer, standard_c] }
      - { id: vial, label: "Independent Batch C vial", reading: "pending", depends: [standard_a] }
      independent: [pressure, vial]
      commit: "Name the shared source"
    question: "Open dependencies and identify which readiness claims are independently supported."
    answerText: "Pressure is independent, but mass and quality are derived; the vial is the only independent composition check."
    why: "A full gauge can be true while methane purity is false. Derived numbers are useful, not independent."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Treating online quality, control-room quality, and the READY light as independent confirmations counts the same Standard C dependency more than once. Estimated methane mass is also derived from pressure and a model rather than a separate composition measurement.
    # correct result: Pressure is independently real, but mass and quality are partly model-derived; two green quality channels share Standard C. The vial is the only independent composition check.
    # state/output: Turn load-ready light amber; set evidence_flags.quality_not_independent = true.

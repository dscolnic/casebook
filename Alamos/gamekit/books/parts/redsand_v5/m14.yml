  # --- Stop 55: What is actually wrong?
  #     Concept: integrated composition diagnosis; Keystone: structure, solutions, separation, gases, and equilibrium; Area: Cold End; Learning role: RETRIEVE; Difficulty: L5; Story role: twist.
  #     placement: DIAGNOSIS, at assay-review-board.
  - group: PHASE
    at: assay-review-board
    title: "What is actually wrong?"
    concept: "integrated composition diagnosis"
    reason: "Launch control needs one cause that explains both passing and failing readings."
    scene: "Combine the failed vial with the other readings to decide whether the problem is amount, contamination, or a broken sensor. The full panel will distinguish enough material from material safe to fly."
    motivation: "The crew must decide whether the problem is too little propellant or the wrong propellant."
    format: DIAGNOSIS
    question: "Which explanation fits the amount, pressure, composition, dryer, and calibration readings?"
    # CONVERTED from the payload below. `state: quiet` is the engine's
    # `status: normal`, and the keyed `answer` becomes the candidate's label.
    headline: "FULL BY MASS IS NOT FLIGHT-READY BY COMPOSITION"
    readings:
    - {zone: tank, label: "Pressure", value: "19.1 bar", status: normal}
    - {zone: tank, label: "Total loaded mass", value: "target reached", status: normal}
    - {zone: assay, label: "Methane", value: "91.6%", status: alarm}
    - {zone: assay, label: "Carbon dioxide", value: "8.0%", status: alarm}
    - {zone: assay, label: "Water", value: "0.40%", status: alarm}
    - {zone: cold_end, label: "Drier differential pressure", value: "high", status: alarm}
    choices:
    - {id: low_amount, label: "Insufficient total propellant", mechanism: "Contradicted by loaded mass and pressure."}
    - {id: leak, label: "Tank leak", mechanism: "Contradicted by stable mass and pressure."}
    - {id: breakthrough, label: "Purification breakthrough hidden by shared calibration", mechanism: "Explains high CO2/H2O, drier load, and false quality pass."}
    - {id: slow_rate, label: "Reactor rate still too low", mechanism: "Cannot create contaminants after collection."}
    answer: "Purification breakthrough hidden by shared calibration"
    answerText: "Batch C is off specification because purification broke through and Standard C hid the contamination."
    why: "Contaminants add mass and pressure, so quantity signals pass. Drier/purification breakthrough sends CO2/water into product; biased Standard C hides it."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Insufficient total propellant is ruled out by target mass and normal pressure. A tank leak is ruled out by stable mass and pressure. A slow reactor rate cannot create the measured CO2 and water contamination after collection.
    # correct result: Purification breakthrough hidden by shared Standard C bias is the only diagnosis that fits the full panel.

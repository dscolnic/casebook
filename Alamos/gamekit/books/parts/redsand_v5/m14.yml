  # --- Stop 56: Write the rule before the final samples
  #     Concept: precommitted thresholds; Keystone: evidence must be independent; Area: Plant Control; Learning role: APPLY; Difficulty: L5; Story role: decision.
  #     placement: TRIGGER, operated at certification-console.
  - group: GIBBS
    at: certification-console
    title: "Write the rule before the final samples"
    concept: "precommitted thresholds"
    reason: "The acceptance line must be fixed before the blind result creates pressure."
    scene: "Commit the acceptance and abort limits before the blind samples appear so the decision cannot move after the result is known. The blind sample will then be judged by the same rule either way."
    motivation: "Precommitted thresholds stop the launch deadline from changing what the crew is willing to call safe."
    format: TRIGGER
    question: "Commit the independent methane-purity trigger before two blind samples appear; use the fixed carbon-dioxide, water, and pressure limits as companion rules."
    answerText: "Set methane acceptance at 97.0% before the blind samples; any independent failure triggers quarantine under the fixed companion limits."
    why: "Thresholds express consequences before results create pressure to excuse them. Averaging an independent failing sample with a biased online channel has no scientific basis."

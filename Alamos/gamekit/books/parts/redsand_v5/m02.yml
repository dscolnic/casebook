    title: "Spend the hydrogen you have"
    concept: "limiting reactant under constraints"
    reason: "The diagnostic test must preserve enough hydrogen for a safe restart."
    scene: "Hydrogen runs out first, so divide the limited release among production, diagnosis, and restart reserve before redirecting the investigation. The chosen split must buy useful evidence without disabling the reactor."
    motivation: "Testing the line costs real fuel, but without the test the crew may spend another shift repairing the wrong system."
    format: ALLOCATE
    question: "With hydrogen identified as the limiting reactant, allocate the 80 kmol across methane production, tracer testing, restart reserve, and purge protection while satisfying both required checks."

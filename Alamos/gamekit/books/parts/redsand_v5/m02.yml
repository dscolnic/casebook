  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 2: worked examples"
    examples:
    - {"title":"Use a mole ratio","problem":"For N₂+3H₂→2NH₃, 3 mol H₂ reacts with excess N₂. Find NH₃ produced.","rule":"Use the balanced coefficient ratio: n_NH3=n_H2(2/3).","steps":["Set up the relationship: Use the balanced coefficient ratio: n_NH3=n_H2(2/3).","n_NH3=3(2/3)=2 mol."],"answer":"The theoretical product amount is 2 mol NH₃.","mistake":"Reaction coefficients relate moles, not directly grams."}
    - {"title":"Find the limiting reactant","problem":"For 2H₂+O₂→2H₂O, mix 6 mol H₂ and 2 mol O₂.","rule":"Compare available amount divided by its reactant coefficient.","steps":["hydrogen reaction units=6/2=3; oxygen reaction units=2/1=2.","Oxygen permits fewer reaction units; water produced=2(2)=4 mol."],"answer":"O₂ limits the reaction; 2 mol H₂ remains.","mistake":"The reactant with fewer moles is not always limiting; coefficients matter."}
    - {"title":"Calculate percent yield","problem":"A reaction could produce 20 g of product but yields 16 g.","rule":"percent yield=actual yield/theoretical yield×100%.","steps":["Set up the relationship: percent yield=actual yield/theoretical yield×100%.","percent yield=16/20×100%=80%."],"answer":"The percent yield is 80%.","mistake":"Reversing the ratio gives an inappropriate value above 100% here."}
    - {"title":"Convert product moles to mass","problem":"A reaction produces 2 mol CO₂. Use M_CO2=44 g/mol. Find product mass.","rule":"m=nM.","steps":["Set up the relationship: m=nM.","m=2(44)=88 g."],"answer":"The product mass is 88 g.","mistake":"Multiplying by molar mass converts moles to grams."}
    - {"title":"Balance a reaction","problem":"Balance H₂ + O₂ → H₂O without changing chemical formulas.","rule":"Coefficients conserve each element; subscripts identify substances.","steps":["Place 2 before H₂O so the product has two oxygen atoms.","Place 2 before H₂ to supply four hydrogen atoms: 2H₂ + O₂ → 2H₂O."],"answer":"Both sides contain four hydrogen atoms and two oxygen atoms.","mistake":"Changing H₂O to H₂O₂ would change the product."}

  stops:
  # --- Stop 5: The production workflow
  #     Concept: stoichiometric workflow; Keystone: balancing and stoichiometry; Area: Reactor Hall; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: SEQUENCE, at intake-calculation-board.
  - group: EQUIL
    at: intake-calculation-board
    title: "The production workflow"
    concept: 2   # stoichiometric workflow
    reason: "The carbon ledger is nearly closed, shifting attention to how captured feed becomes product."
    scene: "To test whether the air intake causes the shortage, first arrange the Sabatier conversion from captured carbon-dioxide mass to possible methane mass."
    motivation: "The production chain connects the air-capture record to the methane yield the reactor could actually deliver."
    format: SEQUENCE
    question: "Order the workflow for converting captured CO2 mass into theoretical CH4 mass."
    # CONVERTED from the bible's `data` line below; `correct result: As listed`.
    cards:
    - "Balance the equation"
    - "Convert CO2 mass to moles"
    - "Use the CO2:CH4 mole ratio"
    - "Convert CH4 moles to mass"
    - "Compare with the production target"
    order: [0, 1, 2, 3, 4]
    answerText: "Balance, convert CO2 mass to moles, apply the mole ratio, and convert methane moles to mass."
    why: "Stoichiometric coefficients connect moles. Molar mass is the bridge between a scale and that ratio. In this reaction the CO2:CH4 mole ratio is 1:1, but their masses are not equal because 44.01 g CO2 and 16.04 g CH4 are one mole each."
    # wrong-path feedback, one rebuttal per wrong option:
    #   If the player applies a coefficient to kilograms, show unit mismatch. If they compare before converting product to mass, point out that the schedule is a mass target.
    # data: Balance the equation / Convert CO2 mass to moles / Use the CO2:CH4 mole ratio / Convert CH4 moles to mass / Compare with the production target.
    # correct result: As listed.
    # state/output: Unlock theoretical-yield panel.

  # --- Stop 6: Could today's air make enough methane?
  #     Concept: theoretical yield; Keystone: balancing and stoichiometry; Area: Reactor Hall; Learning role: PRACTICE; Difficulty: L2; Story role: reversal.
  #     placement: BALLPARK, at compressor-log-desk.
  - group: EQUIL
    at: compressor-log-desk
    title: "Could today's air make enough methane?"
    concept: 3   # theoretical yield
    reason: "The production steps are identified and today's captured feed needs a methane-yield estimate."
    scene: "The carbon-dioxide shipment sets one ceiling on methane production. Its mass cannot be copied straight onto the fuel ledger."
    motivation: "The feed-based ceiling determines whether additional compressor power could increase this shift's useful production."
    format: BALLPARK
    question: "The reaction yields one mole CH₄ per mole CO₂. Convert 6.60×10⁶ g CO₂ to kg CH₄ using molar masses 44.01 and 16.04 g/mol. Fill feed mass and the two molar masses in that order."
    # CONVERTED from the bible's `data` line below: its four factors become four
    # tiles, and its own "= 2.405 x 10^6 g" is the target with the stated ±3%.
    estimate:
      question: "Estimate the theoretical methane from the captured CO2."
      relationship: "grams CH4 = grams CO2 ÷ molar mass CO2 × the CO2:CH4 mole ratio × molar mass CH4"
      labels:
      - "6.60×10⁶ g CO2"
      - "44.01 g/mol CO2"
      - "1 mol CH4 / 1 mol CO2"
      - "16.04 g/mol CH4"
      values: [6.60e6, 44.01, 1, 16.04]
      slots: 4
      template: '{0} ÷ {1} × {2} × {3}'
      formula: a/b*c*d
      correct: [0, 1, 2, 3]
      target: 2.405e6
      tolerance: 72150
      units: "g CH4"
    answerText: "The captured CO2 could make 2405 kg CH4."
    why: "(6.60 x 10^6 g / 44.01 g mol^-1)(16.04 g mol^-1) = 2.405 x 10^6 g = 2405 kg CH4. Rounded to three significant figures this is 2.41 x 10^3 kg. CO2 is sufficient for the 2000 kg requirement."
    # wrong-path feedback, one rebuttal per wrong option:
    #   6600 kg treats a 1:1 mole ratio as a 1:1 mass ratio. About 150 is kilomoles, not kilograms of methane.
    # data: (6.60 x 10^6 g CO2)/(44.01 g/mol) x (1 mol CH4/1 mol CO2) x (16.04 g/mol CH4).
    # correct result: 2405 kg CH4 (2.41 x 10^3 kg to three significant figures); tolerance +/-3%.
    # state/output: Set evidence_flags.co2_sufficient = true; Sundqvist turns off the proposed compressor overdrive.

  # --- Stop 7: Which feed runs out first?
  #     Concept: limiting reactant; Keystone: limiting reactant; Area: Reactor Hall; Learning role: PRACTICE; Difficulty: L2; Story role: clue.
  #     placement: CHOICE, asked at Ingrid Sundqvist beside compressors.
  - group: EQUIL
    at: compressors
    title: "Which feed runs out first?"
    person: sundqvist
    concept: 3   # limiting reactant
    reason: "The air-based yield is known, but another reactant may run out before that ceiling is reached."
    scene: "Because the carbon-dioxide supply could meet the target, compare carbon dioxide and hydrogen to find which ingredient stops methane production first."
    motivation: "Identifying the limiting feed directs the repair effort toward the supply that actually constrains methane output."
    format: CHOICE
    question: "Which reactant limits methane production, and how much CH4 can it support?"
    choices:
    - "H2 limits; 520/4 = 130 kmol CH4."
    - "CO2 limits; 150 kmol CO2 makes 150 kmol CH4."
    - "H2 limits; 520 kmol H2 makes 520 kmol CH4."
    - "Neither limits because both feeds are present."
    answer: "H2 limits; 520/4 = 130 kmol CH4."
    answerText: "Hydrogen is limiting and supports 130 kmol CH4."
    why: "Test each reactant through the balanced equation. CO2 could make 150 kmol CH4. H2 must be divided by four and can make only 130 kmol. The smaller product amount wins, so H2 is limiting and 20 kmol CO2 can remain."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2) It ignores the smaller H2-supported yield. (3) It ignores the coefficient four. (4) A reaction can have both feeds present and still be limited by one.
    # correct result: Choice 1.
    # state/output: Set evidence_flags.h2_limiting = true; radio Herrera requesting raw H2 delivery data.

  # --- Stop 8: Spend the hydrogen you have
  #     Concept: limiting reactant under constraints; Keystone: limiting reactant; Area: Reactor Hall; Learning role: COMBINE; Difficulty: L3; Story role: decision.
  #     placement: ALLOCATE, operated at intake-bypass-manifold.
  - group: EQUIL
    at: intake-bypass-manifold
    title: "Spend the hydrogen you have"
    concept: 3   # limiting reactant under constraints
    reason: "Hydrogen is limited and must cover production, a diagnostic tracer, and protected reserve."
    scene: "The hydrogen release must support a diagnostic pulse without losing restart capacity. The crew can choose how much of the remaining gas to use for production."
    motivation: "The allocation determines whether the crew can investigate the supply problem without disabling the reactor or exhausting reserve."
    format: ALLOCATE
    question: "Allocate no more than 80 kmol H₂ in 4-kmol steps. Reserve at least 8 for the tracer and 16 for restart; production may receive 0–56 and the optional purge upgrade 0–8. Submit any feasible allocation; unassigned gas remains in store."
    # MODEL CONVERSION. The bible splits a pool continuously; the engine funds a
    # subset under a budget. Each item's `cost` is the bible's own share for it —
    # its recommended allocation, or its stated maximum where the recommendation is
    # zero — and each question becomes an answer the funded plan does or does not
    # buy. NOT `protected:`: the bible gives the reserve a minimum of 0 and a pass
    # rule of restart >= 16, so preserving it has to be the player's choice.
    allocate:
      pool: { amount: 80, unit: "kmol H2", mode: scalar }
      items:
      - { id: production, label: "Interim methane production", cost: 56 }
      - { id: tracer, label: "Diagnostic tracer pulse", cost: 8 }
      - { id: restart, label: "Reactor restart reserve", cost: 16 }
      - { id: purge, label: "Purge-line protection", cost: 8 }
      answers:
      - { question: "Where does hydrogen stop being usable?", requires: [tracer], required: true }
      - { question: "Can the reactor restart safely?", requires: [restart], required: true }
      - { question: "Can this shift still make some methane?", requires: [production] }
      - { question: "Can the diagnostic line be purged safely?", requires: [purge] }
    answerText: "The tracer minimum provides a resolvable pulse and the restart minimum preserves recovery. In the example, 56 kmol H₂ supports 14 kmol CH₄ at four H₂ per CH₄; other feasible distributions are allowed."
    why: "No allocation creates hydrogen. The scientific choice is whether a small diagnostic spend is worth the production it displaces. Eight kilomoles gives the meter a resolvable pulse; sixteen preserves a restart. The remaining 56 kmol supports only 14 kmol CH4, a visible cost that makes the evidence meaningful."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Underfunded tracer yields no interpretable test. Underfunded reserve violates the safe-restart constraint. Over-allocation must be blocked with a message naming the missing amount.
    # data: 80 kmol H2. Production pass: selectable 0-60 kmol. Tracer/line-volume test: minimum 8 kmol. Restart reserve: player-chosen minimum 16 kmol.
    # correct result: Any allocation with tracer ≥8, reserve ≥16, total ≤80; recommended 56 production / 8 tracer / 16 reserve.
    # state/output: Set diagnostic_h2_reserved = true; hydrogen_reserve - 8; unlock Hydrogen Store route for Mission 3.

# ============================================================ MISSION 2
# Split back out of books/redsand_v5.yml by tools/split-book.mjs; the book's text, verbatim.
# Lifted from ../fpl_gpt/Mars_AP_Chemistry_Campaign_Implementation_Bible_v10.5_Explicit_Build_Ownership.md by tools/v10extract.mjs. Every quoted string below is
# the bible's, verbatim; engine/dev/bibleParity.mjs holds it to that.
- title: "The Feedstock Problem"
  card:
    header: "MISSION 2 - 14 WORK SHIFTS REMAIN BEFORE LAUNCH."
    title: "THE FEEDSTOCK PROBLEM"
    goNow: "Go to the Atmosphere Intake and meet Ingrid Sundqvist, the production and catalyst lead, at the compressor log desk."
    body: "14 work shifts remain before launch. Frost rims the compressor glass beside the next shift's fuel target. Today you decide whether to push the air intake or test the hydrogen line."
    objective: "Determine which ingredient runs out first and whether the carbon-dioxide intake needs repair."
  objective: "Determine which ingredient runs out first and whether the carbon-dioxide intake needs repair."
  stake: "14 work shifts remain before launch. Frost rims the compressor glass beside the next shift's fuel target. Today you decide whether to push the air intake or test the hydrogen line."
  takeaway: "Scarce diagnostic material creates a real trade-off between learning and output."
  segue: "Therefore Herrera must trace hydrogen through the store; Ingrid cannot make fuel from surplus carbon alone."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Reactant", def: "a starting substance used by a chemical reaction. Carbon dioxide and hydrogen are the two reactants in the plant's methane reactor."}
  - {name: "Product", def: "a substance made by a chemical reaction. Methane and water are the products of the Sabatier reaction."}
  - {name: "Coefficient", def: "the number written before a chemical formula in a balanced equation. Coefficients compare particle counts and mole amounts, not masses."}
  - {name: "Limiting reactant", def: "the starting substance that runs out first. It sets the greatest amount of product the reactor can make."}
  equations:
  - {"e":"CO2 + 4 H2 -> CH4 + 2 H2O","c":"relating the plant's carbon dioxide and hydrogen feeds to methane and water production","v":[["CO2","carbon dioxide"],["H2","hydrogen"],["CH4","methane"],["H2O","water"],["the numbers","mole ratios"]],"s":"The crew must learn whether Martian carbon dioxide or recycled hydrogen sets the amount of methane available for the flight home."}
  - {"e":"product moles = known moles x (product coefficient / known coefficient)","c":"calculating how much product one reactant can support","v":[["known moles","the measured reactant amount; each coefficient comes from the balanced equation"]],"s":"Converting both feeds into possible methane reveals which supply truly stops production first."}
  primer:
  - "Balance an equation before using its coefficients."
  - "Compare every reactant by the amount of the same product it could make; the smaller product amount identifies the limiting reactant."
  - "A correct calculation may rule out the easiest explanation without revealing the real fault."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-atmosphere-intake
    # On arrival at Atmosphere Intake | automatic | 
    on: { enter: true, at: INTAKE }
    world: "Frost rims the compressor glass beside the next shift's fuel target."
    panel: "MISSION 2 - THE FEEDSTOCK PROBLEM"
    # unlocks: Stop 5 at the compressor log desk.
    bubbles:
    - who: sundqvist   # Sundqvist
      say: "This machine pulls carbon dioxide from the Martian air. If it cannot collect enough, the reactor cannot make the methane that takes us home. Before I push it harder, tell me whether the air supply is actually the problem."
  - id: after-stop-5
    # After Stop 5 | compressor log desk | automatic transition
    on: { after: [1] }
    world: "At intake-calculation-board, the dated accepted-result slip for Stop 5 reads: \"As listed.\". The slip remains in that fixture's evidence holder."
    panel: "CO2 MASS -\\> CO2 MOLES -\\> CH4 MOLES -\\> CH4 MASS."
    # unlocks: Stop 6 at the intake control panel.
    bubbles:
    - who: sundqvist   # Sundqvist
      say: "Nice work. Use the captured amount. Tell me what this intake could make before I touch the compressor."
  - id: after-stop-6
    # After Stop 6 | intake control panel | automatic reversal
    on: { after: [2] }
    world: "At compressor-log-desk, the dated accepted-result slip for Stop 6 reads: \"2405 kg CH4 (2.41 x 10^3 kg to three significant figures); tolerance +/-3%.\". The slip remains in that fixture's evidence holder."
    panel: "THEORETICAL CH4: 2405 kg / REQUIRED CH4: 2000 kg / CO2 SUPPLY: SUFFICIENT."
    # unlocks: Stop 7 at the dual-feed display.
    bubbles:
    - who: sundqvist   # Sundqvist
      say: "Good thinking. Then the intake is not starving us. We have enough carbon dioxide to meet the launch target."
    - who: abiola   # Abiola
      radio: true
      say: "That is not good news. If the air is not holding us back, something else is."
  - id: after-stop-7
    # After Stop 7 | dual-feed display | automatic
    on: { after: [3] }
    world: "At compressors, the dated accepted-result slip for Stop 7 reads: \"Choice 1.\". The slip remains in that fixture's evidence holder."
    panel: "HYDROGEN IS LIMITING METHANE PRODUCTION."
    # unlocks: Stop 8 at the hydrogen-allocation manifold.
    bubbles:
    - who: sundqvist   # Sundqvist
      say: "Exactly right. The Martian air was never the bottleneck. We are not getting enough hydrogen."
    - who: abiola   # Abiola
      say: "You may use one diagnostic pulse, but the reactor must retain enough hydrogen to restart safely. Divide what remains."
  - id: at-mission-end
    # At mission end | Atmosphere Intake | automatic outcome and hook
    on: { missionEnd: true }
    world: "At compressor-log-desk, Ingrid Sundqvist pins the CO2 CAPACITY: 2405 KG METHANE card above the intake log. The dated prop remains here on later visits."
    panel: "NEXT DESTINATION - HYDROGEN STORE."
    # unlocks: Mission 3 briefing and the Hydrogen Store waypoint.
    bubbles:
    - who: sundqvist   # Ingrid Sundqvist
      say: "The air did its job. Something else ran out first. Therefore Herrera must trace hydrogen through the store; Ingrid cannot make fuel from surplus carbon alone."


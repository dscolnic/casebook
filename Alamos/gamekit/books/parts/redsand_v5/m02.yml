    # data: Balance the equation / Convert CO2 mass to moles / Use the CO2:CH4 mole ratio / Convert CH4 moles to mass / Compare with the production target.
    # correct result: As listed.
    # state/output: Unlock theoretical-yield panel.

  # --- Stop 6: Could today's air make enough methane?
  #     Concept: theoretical yield; Keystone: balancing and stoichiometry; Area: Reactor Hall; Learning role: PRACTICE; Difficulty: L2; Story role: reversal.
  #     placement: BALLPARK, at compressor-log-desk.
  - group: EQUIL
    at: compressor-log-desk
    title: "Could today's air make enough methane?"
    concept: "theoretical yield"
    reason: "Compressor power should not increase until its possible methane output is known."
    scene: "Use that conversion to calculate the most methane the captured carbon dioxide could make before Sundqvist increases compressor power. The answer decides whether extra compressor power could help this shift."
    motivation: "If the theoretical yield already exceeds the target, pushing the compressors wastes power and risks damage."
    format: BALLPARK
    question: "Estimate the theoretical methane from the captured CO2."
    # CONVERTED from the bible's `data` line below: its four factors become four
    # tiles, and its own "= 2.405 x 10^6 g" is the target with the stated ±3%.
    estimate:
      question: "Estimate the theoretical methane from the captured CO2."
      relationship: "grams CH4 = grams CO2 ÷ molar mass CO2 × the CO2:CH4 mole ratio × molar mass CH4"
      labels:
      - "6.60×10⁶ g CO2"
      - "44.01 g/mol CO2"
      - "1 mol CH4 / 1 mol CO2"
      - "16.04 g/mol CH4"
      values: [6.60e6, 44.01, 1, 16.04]
      slots: 4
      template: '{0} ÷ {1} × {2} × {3}'
      formula: a/b*c*d
      correct: [0, 1, 2, 3]
      target: 2.405e6
      tolerance: 72150
      units: "g CH4"
    answerText: "The captured CO2 could make 2405 kg CH4."
    why: "(6.60 x 10^6 g / 44.01 g mol^-1)(16.04 g mol^-1) = 2.405 x 10^6 g = 2405 kg CH4. Rounded to three significant figures this is 2.41 x 10^3 kg. CO2 is sufficient for the 2000 kg requirement."
    # wrong-path feedback, one rebuttal per wrong option:
    #   6600 kg treats a 1:1 mole ratio as a 1:1 mass ratio. About 150 is kilomoles, not kilograms of methane.
    # data: (6.60 x 10^6 g CO2)/(44.01 g/mol) x (1 mol CH4/1 mol CO2) x (16.04 g/mol CH4).
    # correct result: 2405 kg CH4 (2.41 x 10^3 kg to three significant figures); tolerance +/-3%.
    # state/output: Set evidence_flags.co2_sufficient = true; Sundqvist turns off the proposed compressor overdrive.

  # --- Stop 7: Which feed runs out first?
  #     Concept: limiting reactant; Keystone: limiting reactant; Area: Reactor Hall; Learning role: PRACTICE; Difficulty: L2; Story role: clue.
  #     placement: CHOICE, asked at Ingrid Sundqvist beside compressors.

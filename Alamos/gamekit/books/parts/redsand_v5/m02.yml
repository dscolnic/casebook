- title: "The Feedstock Problem"
  card:
    header: "14 SHIFTS UNTIL THE LAUNCH WINDOW CLOSES"
    title: "THE FEEDSTOCK PROBLEM"
    goNow: "Go to the Atmosphere Intake and meet Ingrid Sundqvist, the production and catalyst lead, at the compressor log desk."
    body: "The carbon ledger makes a large leak unlikely, but the plant still cannot make enough methane. The Sabatier reactor combines carbon dioxide from Martian air with hydrogen recovered from water. At the Atmosphere Intake, calculate how much methane each supply can support and identify which one runs out first. By the end of the mission, decide whether to push the intake harder or investigate hydrogen delivery."
    objective: "Determine which ingredient runs out first and whether the carbon-dioxide intake needs repair."
  objective: "Determine which ingredient runs out first and whether the carbon-dioxide intake needs repair."
  stake: "The carbon ledger makes a large leak unlikely, but the plant still cannot make enough methane. The Sabatier reactor combines carbon dioxide from Martian air with hydrogen recovered from water. At the Atmosphere Intake, calculate how much methane each supply can support and identify which one runs out first. By the end of the mission, decide whether to push the intake harder or investigate hydrogen delivery."
  takeaway: "Scarce diagnostic material creates a real trade-off between learning and output."
  segue: "Mission decision: Do not push the air intake. Test the hydrogen line instead. The captured carbon dioxide could make 2405 kg of methane, more than this shift needs. Hydrogen runs out first. A test pulse now moves toward the Hydrogen Store."
  # The mission card's own "Primer concepts", printed on the plan card.
  primer:
  - "Balance an equation before using its coefficients."
  - "Compare every reactant by the amount of the same product it could make; the smaller product amount identifies the limiting reactant."
  - "A correct calculation may rule out the easiest explanation without revealing the real fault."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-atmosphere-intake
    # On arrival at Atmosphere Intake | automatic | 
    on: { enter: true, at: INTAKE }
    world: "Ice coats the intake housing while the compressor shakes the platform; Sundqvist points to the full-shift capture log."
    panel: "MISSION 2 - THE FEEDSTOCK PROBLEM"
    # unlocks: Stop 5 at the compressor log desk.
    bubbles:
    - who: sundqvist   # Sundqvist
      say: "This machine pulls carbon dioxide from the Martian air. If it cannot collect enough, the reactor cannot make the methane that takes us home. Before I push it harder, tell me whether the air supply is actually the problem."
  - id: after-stop-5
    # After Stop 5 | compressor log desk | automatic transition
    on: { after: [1] }
    world: "The conversion cards lock into one unit-cancelling chain."
    panel: "CO2 MASS -\\> CO2 MOLES -\\> CH4 MOLES -\\> CH4 MASS."
    # unlocks: Stop 6 at the intake control panel.
    bubbles:
    - who: sundqvist   # Sundqvist
      say: "Use the captured amount. Tell me what this intake could make before I touch the compressor."
  - id: after-stop-6
    # After Stop 6 | intake control panel | automatic reversal
    on: { after: [2] }
    world: "The proposed compressor-overdrive control becomes unavailable."
    panel: "THEORETICAL CH4: 2405 kg / REQUIRED CH4: 2000 kg / CO2 SUPPLY: SUFFICIENT."
    # unlocks: Stop 7 at the dual-feed display.
    bubbles:
    - who: sundqvist   # Sundqvist
      say: "Then the intake is not starving us. We have enough carbon dioxide to meet the launch target."
    - who: abiola   # Abiola
      radio: true
      say: "That is not good news. If the air is not holding us back, something else is."
  - id: after-stop-7
    # After Stop 7 | dual-feed display | automatic
    on: { after: [3] }
    world: "A second feed display opens and highlights the hydrogen line."
    panel: "HYDROGEN IS LIMITING METHANE PRODUCTION."
    # unlocks: Stop 8 at the hydrogen-allocation manifold.
    bubbles:
    - who: sundqvist   # Sundqvist
      say: "The Martian air was never the bottleneck. We are not getting enough hydrogen."
    - who: abiola   # Abiola
      say: "You may use one diagnostic pulse, but the reactor must retain enough hydrogen to restart safely. Divide what remains."
  - id: at-mission-end
    # At mission end | Atmosphere Intake | automatic outcome and hook
    on: { missionEnd: true }
    world: "The player allocation appears as three illuminated pipes: PRODUCTION, DIAGNOSTIC, and RESTART RESERVE; A blue diagnostic pulse leaves the intake display and travels toward the Hydrogen Store."
    panel: "NEXT DESTINATION - HYDROGEN STORE."
    # unlocks: Mission 3 briefing and the Hydrogen Store waypoint.
    bubbles:
    - who: sundqvist   # Sundqvist
      say: "The intake stays at normal power. Your test gets one pulse. Restart reserve remains protected."
    - who: abiola   # Abiola
      say: "Follow that pulse. Find where the hydrogen stops being usable."

  stops:
  # --- Stop 5: The production workflow
  #     Concept: stoichiometric workflow; Keystone: balancing and stoichiometry; Area: Reactor Hall; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: SEQUENCE, at intake-calculation-board.
  - group: EQUIL
    at: intake-calculation-board
    title: "The production workflow"
    concept: "stoichiometric workflow"
    reason: "The intake claim needs one valid mass-to-methane calculation path."
    scene: "To test whether the air intake causes the shortage, first arrange the Sabatier conversion from captured carbon-dioxide mass to possible methane mass. This chain will turn the capture log into a testable production claim."
    motivation: "This tells the crew whether Martian air can supply enough carbon for the ride home."
    format: SEQUENCE
    question: "Order the workflow for converting captured CO2 mass into theoretical CH4 mass."
    # CONVERTED from the bible's `data` line below; `correct result: As listed`.
    cards:
    - "Balance the equation"
    - "Convert CO2 mass to moles"
    - "Use the CO2:CH4 mole ratio"
    - "Convert CH4 moles to mass"
    - "Compare with the production target"
    order: [0, 1, 2, 3, 4]
    answerText: "Balance, convert CO2 mass to moles, apply the mole ratio, and convert methane moles to mass."
    why: "Stoichiometric coefficients connect moles. Molar mass is the bridge between a scale and that ratio. In this reaction the CO2:CH4 mole ratio is 1:1, but their masses are not equal because 44.01 g CO2 and 16.04 g CH4 are one mole each."
    # wrong-path feedback, one rebuttal per wrong option:

  stake: "Batch C is quarantined, and one shift remains before the ascent window closes. The crew must recover certified methane without sacrificing power, thermal safety, oxygen, or independent proof. At Plant Control, the Tank Farm, and the Pad Office, buy one decisive measurement, eliminate unsafe plans, and fund the recovery chain. By the end of the mission, give the final GO or NO-GO recommendation that determines whether the crew leaves Mars."

  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 15: worked examples"
    examples:
    - {"title":"Mass and amount","problem":"A sample contains 18 g of water. Use molar mass M=18 g/mol. Find amount n.","rule":"n=m/M.","steps":["Set up the relationship: n=m/M.","n=18/18=1 mol."],"answer":"The sample contains 1 mol of water molecules.","mistake":"Grams measure mass; moles measure amount."}
    - {"title":"Calculate percent yield","problem":"A reaction could produce 20 g of product but yields 16 g.","rule":"percent yield=actual yield/theoretical yield×100%.","steps":["Set up the relationship: percent yield=actual yield/theoretical yield×100%.","percent yield=16/20×100%=80%."],"answer":"The percent yield is 80%.","mistake":"Reversing the ratio gives an inappropriate value above 100% here."}
    - {"title":"Calculate sensible heat","problem":"Warm 100 g of a material by 10 °C. Its specific heat is 4 J/(g °C).","rule":"q=mcΔT.","steps":["Set up the relationship: q=mcΔT.","q=100(4)(10)=4000 J=4 kJ."],"answer":"The material absorbs 4 kJ.","mistake":"Use temperature change, not final temperature."}
    - {"title":"Use electrons per deposited ion","problem":"Copper deposition follows Cu²⁺+2e⁻→Cu. An electrolysis supplies 0.1 mol electrons with 100% current efficiency. Use M_Cu=64 g/mol.","rule":"n_Cu=n_e/2; m_Cu=n_Cu M_Cu.","steps":["Set up the relationship: n_Cu=n_e/2; m_Cu=n_Cu M_Cu.","n_Cu=0.1/2=0.05 mol; m_Cu=0.05(64)=3.2 g."],"answer":"The deposited copper mass is 3.2 g.","mistake":"Two moles of electrons deposit one mole of copper."}
    - {"title":"Calculate mass purity","problem":"A 20 g sample contains 18 g of the desired substance.","rule":"mass purity=desired mass/total mass×100%.","steps":["Set up the relationship: mass purity=desired mass/total mass×100%.","mass purity=18/20×100%=90%."],"answer":"The sample is 90% pure by mass.","mistake":"Do not divide by the impurity mass."}

  stops:
  # --- Stop 57: Buy one measurement that could change the decision
  #     Concept: value of information; Keystone: evidence must be independent; Area: Plant Control; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: VALUE, asked at Commander Laila Abiola beside final-recovery-board.
  - group: GIBBS
    at: final-recovery-board
    title: "Buy one measurement that could change the decision"
    person: abiola
    concept: 15   # value of information
    reason: "The final decision still hinges on composition, not on another confirmation of pressure or mass."
    scene: "Batch C remains quarantined while pressure and mass are already measured precisely. The unresolved question is whether its composition meets the launch specifications."
    motivation: "The selected assay supplies the independent contaminant evidence that can change the batch's certification status."
    format: VALUE
    # CONVERTED from the payload below. `budget.value` -> `budget.amount`; each
    # option's `cost` and `axis` unchanged; the bible's one `required` option —
    # its `correct` — is the engine's `decisive`, the buy that can change the
    # decision, and its `decision_changed` line is what that buy reveals.
    value:
      budget:
        amount: 10
        unit: test points
      decision: ""
      requirements:
        - id: r1
          text: obtain an independent measurement of Batch C contaminants
      rule: Cover every required outcome at the lowest total cost within the budget; keep all unused capacity in reserve.
      plans:
        - assay
      options:
        - id: pressure
          label: Repeat total-pressure reading
          cost: 6
          axis: ""
          reveals: Improves an already precise amount-related measurement, not the gas mixture.
        - id: mass
          label: Duplicate tank mass
          cost: 7
          axis: ""
          reveals: Rechecks total amount without separating contaminants.
        - id: assay
          label: Independent Batch C contaminant assay
          cost: 10
          axis: ""
          reveals: Measures contaminants using a separately calibrated sample test.
          covers:
            - r1
          decisive: true
        - id: catalyst_temp
          label: Repeat average catalyst temperature
          cost: 5
          axis: ""
          reveals: Measures reactor temperature rather than tank composition.
        - id: valve
          label: Visual valve inspection
          cost: 4
          axis: ""
          reveals: Checks visible hardware without measuring gas purity.
      commit: Commit the decision
    question: "You have 10 test points. Cover every required outcome at the lowest total cost within the budget; keep all unused capacity in reserve. Select whole packages, then submit the plan; the board shows its total and remaining reserve for you to check."
    answerText: "Each funded package supplies a required outcome; an affordable package that leaves one unresolved is insufficient."
    why: "Pressure and mass are already precise and are not the disputed claim. Average temperature cannot certify tank contents. A second independent assay determines whether quarantine/reprocessing remains necessary and directly controls GO/NO-GO."
    # wrong-path feedback, one rebuttal per wrong option:
    #   More precision on a nonbinding quantity has low decision value. Evidence is valuable for the action it can change.
    # correct result: Independent Batch C contaminant assay.
    # state/output: Dispatch sealed sample to Tank Farm portable analyzer; diagnostic_budget = 0.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   value:
    #     budget: {value: 10, unit: test_points}
    #     options:
    #       - {id: pressure, label: "Repeat total-pressure reading", cost: 6, axis: amount, required: false}
    #       - {id: mass, label: "Duplicate tank mass", cost: 7, axis: amount, required: false}
    #       - {id: assay, label: "Independent Batch C contaminant assay", cost: 10, axis: composition, required: true}
    #       - {id: catalyst_temp, label: "Repeat average catalyst temperature", cost: 5, axis: thermal, required: false}
    #       - {id: valve, label: "Visual valve inspection", cost: 4, axis: hardware, required: false}
    #     total_option_cost: 32
    #     correct: [assay]
    #     decision_changed: "Confirms whether quarantine and reprocessing remain required."

  # --- Stop 58: Collapse the last degeneracy
  #     Concept: integrated constraints; Keystone: stoichiometry, electrochemistry, gases, and equilibrium; Area: Plant Control; Learning role: RETRIEVE; Difficulty: L5; Story role: obstacle.
  #     placement: DEGENERACY, at tank-calculation-station.
  - group: GIBBS
    at: tank-calculation-station
    title: "Collapse the last degeneracy"
    concept: 15   # integrated constraints
    reason: "The assay narrows the recovery options, leaving usable methane and processing losses to reconcile."
    scene: "Use the independent assay and hardware limits to eliminate the plan that reaches gross mass but not certified methane."
    motivation: "The surviving plan must replace lost production while removing contaminants rather than counting uncertified mass as fuel."
    format: DEGENERACY
    # CONVERTED from the payload below: `first_locus` -> `locus` and its label ->
    # the observable the plans match on, `second_locus` -> `second` with the
    # bible's `physics` line as the hint, `truth_pair` -> `truth`, and its single
    # `tolerance: 1.0` carried on both controls.
    #
    # BIBLE GAP, and the one refusal left on this stop: the two loci have to cross
    # at the truth pair, and the bible's do not. Its truth is 6 h with 120 kWh,
    # which is on the second locus; the first runs 0/160, 2/120, 4/80, 6/40, 8/0
    # and passes nowhere near it. Written as the bible has it rather than moving
    # one of its points.
    degeneracy:
      controls:
        - id: reprocessing_hours
          label: Batch C reprocessing time
          min: 0
          max: 8
          step: 2
          unit: h
        - id: electrolysis_kWh
          label: Energy sent to electrolysis
          min: 0
          max: 160
          step: 40
          unit: kWh
      truth:
        a: 6
        b: 120
      tolerance:
        a: 1
        b: 20
      locus:
        - a: 0
          b: 120
        - a: 2
          b: 120
        - a: 4
          b: 120
        - a: 6
          b: 120
        - a: 8
          b: 120
      second:
        label: Certified methane plus Faraday-limited replacement hydrogen
        locus:
          - a: 4
            b: 160
          - a: 6
            b: 120
          - a: 8
            b: 80
    question: "Apply composition and hardware constraints. Which plan survives?"
    answerText: "Plan D survives because it reprocesses Batch C and powers enough electrolysis to replace the hydrogen lost during processing."
    why: "Two plans looked equal only because the objective counted all mass as fuel. Changing to the scientifically correct objective - certified methane - collapses the match."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Choosing Plan B counts contaminated Batch C mass as certified methane and therefore solves the wrong objective. A surviving Plan D setting must also provide enough electrolysis to replace processing hydrogen without breaking the pressure or thermal limits.
    # correct result: D. Plan B meets gross mass but not usable certified methane; it cannot erase contaminants. Plan D reprocesses Batch C while validated production replaces small losses.
    # state/output: Remove A/B/C as standalone plans; unlock strategic allocation.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   degeneracy:
    #     controls:
    #       - {id: reprocessing_hours, label: "Batch C reprocessing time", min: 0, max: 8, step: 2}
    #       - {id: electrolysis_kWh, label: "Energy sent to electrolysis", min: 0, max: 160, step: 40}
    #     tolerance: 1.0
    #     first_locus:
    #       label: "Projected gross tank mass at deadline"
    #       points: [[0,160],[2,120],[4,80],[6,40],[8,0]]
    #     second_locus:
    #       label: "Certified methane plus replaced processing hydrogen"
    #       physics: "Independent composition assay, stoichiometric usable-methane accounting, and Faraday-limited H2 replacement"
    #       points: [[4,160],[6,120],[8,80]]
    #     truth_pair: {reprocessing_hours: 6, electrolysis_kWh: 120}
    #     hardware_limits: {pressure_max_bar: 12, inlet_peak_max_K: 600}
    #     correct: "Plan D: reprocess Batch C and power enough electrolysis to replace processing losses."

  # --- Stop 59: Spend 100 decision points
  #     Concept: resource strategy; Keystone: kinetics, catalysts, acid-base treatment, energy, electrochemistry, and evidence; Area: Plant Control; Learning role: RETRIEVE; Difficulty: L5; Story role: decision.
  #     placement: SCIENCETANK, asked at Commander Laila Abiola beside recovery-allocation-board.
  - group: GIBBS
    at: recovery-allocation-board
    title: "Spend 100 decision points"
    person: abiola
    concept: 15   # resource strategy
    reason: "The recovery route is selected and the last decision budget must fund all of its essential parts."
    scene: "The recovery route now needs a complete execution budget. Laila will accept different distributions if they preserve every production, purity and safety condition."
    motivation: "The allocation ensures reprocessing, verification, production, and protected safety capacity are funded together."
    format: SCIENCETANK
    # CONVERTED from the payload below. The engine's science tank takes proposals
    # with a label and the case for them, and a `recommended` split keyed by
    # label; the bible's `evidence` line on each proposal is that case, and its
    # own `recommended` map supplies the split. Its per-proposal `min` and its
    # `pass_rules` have no field on this board — the recommended split is what the
    # engine grades against.
    proposals:
    - { label: "Batch C reprocessing", text: "Only action that lowers measured contaminants." }
    - { label: "Timed electrolysis", text: "Faraday-limited run replaces hydrogen lost during processing." }
    - { label: "Validated 550 K / 12 bar operation", text: "Meets rate, equilibrium-yield, and thermal limits." }
    - { label: "Independent final verification", text: "Directly controls launch authorization." }
    - { label: "Habitat and safety margin", text: "Protects the non-negotiable reserve." }
    - { label: "Production above validated point", text: "Adds thermal risk and is not required." }
    - { label: "Cosmetic dashboard recalibration", text: "Changes display, not composition or readiness." }
    recommended:
      "Batch C reprocessing": 35
      "Timed electrolysis": 15
      "Validated 550 K / 12 bar operation": 10
      "Independent final verification": 25
      "Habitat and safety margin": 15
      "Production above validated point": 0
      "Cosmetic dashboard recalibration": 0
    question: "Allocate exactly 100 points. Minimums: reprocessing 25, electrolysis 15, validated operation 10, independent assay 15 and safety 10. Reprocessing plus assay must total at least 60. Assign zero to unvalidated heating and cosmetic recalibration. Submit the allocation; the board checks the total and each requirement."
    answerText: "The accepted plan funds every required capability within the stated limits; extra points may be distributed only as the public rule allows."
    why: "The grade rewards investments that can alter the decision or protect a binding constraint. Spending everything on production solves the old problem and recreates the new one."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Overfunding raw production while underfunding reprocessing or final assay cannot make off-spec methane flight-ready. Spending points on cosmetic recalibration changes a display rather than the batch, and cutting safety or electrolysis breaks a binding link in the recovery chain.
    # correct result: 35 reprocessing, 25 independent verification, 15 electrolysis, 10 validated reactor, and 15 safety/habitat; total 100. Accept variants with at least 60 points across reprocessing + verification and no points to cosmetic recalibration, provided safety gets at least 10.
    # state/output: Execute the plan through persistent equipment and world-state updates; Batch C returns to Tank Farm.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   proposals:
    #     - {id: reprocess, label: "Batch C reprocessing", min: 25, evidence: "Only action that lowers measured contaminants."}
    #     - {id: electrolysis, label: "Timed electrolysis", min: 15, evidence: "Faraday-limited run replaces hydrogen lost during processing."}

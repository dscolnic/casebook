  # --- Stop 60: Commander's recommendation
  #     Concept: whole-campaign synthesis; Keystone: whole-campaign transfer; Area: Plant Control; Learning role: TRANSFER; Difficulty: L5; Story role: final commitment.
  #     placement: DIAGNOSIS, at certification-console.
  - group: GIBBS
    at: certification-console
    title: "Commander's recommendation"
    concept: 15   # whole-campaign synthesis
    reason: "The final independent results are available and the commander needs a complete launch recommendation."
    scene: "Read the final independent results and all four metrics, then give Abiola GO only if every promised chemistry and safety limit passes. A GO is valid only if no earlier lesson or constraint is ignored."
    motivation: "The recommendation determines whether the certified fuel and protected operating conditions justify GO without waiving an earlier constraint."
    format: DIAGNOSIS
    question: "\"Commander needs your recommendation. What do we do?\""
    # CONVERTED from the payload below. `state: quiet` is the engine's
    # `status: normal`, and the keyed `answer` becomes the candidate's label.
    headline: "FINAL GO / NO-GO - EVERY BINDING CONDITION"
    readings:
    - {zone: composition, label: "Independent methane / CO2 / H2O", value: "98.1% / 1.8% / 0.08%", status: normal}
    - {zone: tank, label: "Pressure", value: "19.0 bar", status: normal}
    - {zone: reactor, label: "Operating point / inlet peak", value: "550 K, 12 bar / 584 K", status: normal}
    - {zone: hydrogen, label: "Restart reserve", value: "16 kmol H2", status: normal}
    - {zone: oxygen, label: "Ascent oxygen", value: "100% / VERIFIED", status: normal}
    - {zone: power, label: "Habitat reserve", value: "protected", status: normal}
    - {zone: evidence, label: "Independent assay agreement", value: "within 0.2%", status: normal}
    - {zone: prior_batch, label: "Unprocessed Batch C", value: "91.8% CH4 / failed composition", status: alarm}
    - {zone: prior_reactor, label: "Old 575 K operating point", value: "allowed sensor error crosses thermal limit", status: alarm}
    choices:
    - {id: ignore_assay, label: "Launch and ignore assay because mass is full", mechanism: "Repeats the false-ready error."}
    - {id: restore_hot, label: "Return to 575 K for more production", mechanism: "Reopens the thermal and equilibrium failure."}
    - {id: perfect_purity, label: "Reprocess until contaminants are zero", mechanism: "Unneeded perfection misses the window."}
    - {id: complete_plan, label: "Accept the passing batch, hold the validated point, protect power, and authorize launch", mechanism: "All amount, composition, pressure, thermal, power, and independence limits pass."}
    answer: "Accept the passing batch, hold the validated point, protect power, and authorize launch"
    answerText: "Choose the complete recovery plan and authorize GO only because every precommitted amount, composition, pressure, thermal, power, and verification limit passes."
    why: "D meets amount, composition, pressure, thermal, hydrogen, oxygen, and habitat constraints with independent verification. Zero contamination is not required; the specification defines acceptable limits."
    # wrong-path feedback, one rebuttal per wrong option:

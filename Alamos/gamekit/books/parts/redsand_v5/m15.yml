# ============================================================ MISSION 15
# Split back out of books/redsand_v5.yml by tools/split-book.mjs; the book's text, verbatim.
# Lifted from ../fpl_gpt/Mars_AP_Chemistry_Campaign_Implementation_Bible_v10.5_Explicit_Build_Ownership.md by tools/v10extract.mjs. Every quoted string below is
# the bible's, verbatim; engine/dev/bibleParity.mjs holds it to that.
- title: "GO / NO-GO"
  card:
    header: "MISSION 15 - 1 WORK SHIFT REMAINS BEFORE LAUNCH."
    title: "GO / NO-GO"
    goNow: "Go to Plant Control and meet Commander Laila Abiola, the mission commander, at the final recovery board."
    body: "1 work shift remains before launch. The crew's bags wait behind the dark pad door. Today you decide whether the crew can launch."
    objective: "Authorize launch only if all four campaign metrics and every chemistry threshold pass."
  objective: "Authorize launch only if all four campaign metrics and every chemistry threshold pass."
  stake: "1 work shift remains before launch. The crew's bags wait behind the dark pad door. Today you decide whether the crew can launch."
  takeaway: "GO means every precommitted requirement passes - not that one reassuring gauge is green."
  segue: "Therefore Demir keeps the protected loads on through boarding; GO must hold through the last check."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Certified methane", def: "methane whose amount and composition have passed the fixed flight rules through independent testing. Gross tank mass does not count as certified methane by itself."}
  - {name: "Verification", def: "checks whether a prediction or claim matches a measurement obtained through a suitable evidence path. It is different from repeating the same derived display."}
  - {name: "Assay", def: "a measured test that determines what substances a sample contains and how much of each is present. An independent assay can certify composition when dashboard estimates cannot."}
  - {name: "Recovery chain", def: "the full sequence of actions needed to change the failed condition and prove the change worked. Funding only one link cannot complete recovery."}
  primer:
  - "Buy the measurement that can change the launch decision, not the one that is easiest to repeat."
  - "Count certified methane rather than gross tank mass when comparing recovery plans."
  - "Fund reprocessing, replacement production, validated reactor operation, safety, and independent verification as one connected chain."
  - "The final recommendation introduces no new chemistry; it must satisfy every earlier amount, composition, thermal, power, and evidence constraint."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-plant-control
    # On arrival at Plant Control | automatic | 
    on: { enter: true, at: GIBBS }
    world: "The crew's bags wait behind the dark pad door."
    panel: "MISSION 15 - GO / NO-GO"
    # unlocks: Stop 57 at the final decision board.
    bubbles:
    - who: abiola   # Abiola
      say: "This is not a race to make one number green. Choose the evidence and the recovery chain that can put this crew on a safe ascent before the window closes."
  - id: after-stop-57
    # After Stop 57 | decision board to Tank Farm | automatic evidence choice
    on: { after: [1] }
    world: "At final-recovery-board, the dated accepted-result slip for Stop 57 reads: \"Independent Batch C contaminant assay.\". The slip remains in that fixture's evidence holder."
    panel: "FINAL SAMPLE AUTHORIZED - BATCH C INDEPENDENT ASSAY."
    # unlocks: The Tank Farm waypoint and Stop 58.
    bubbles:
    - who: achebe   # Achebe
      say: "Nice work. Pressure and mass already pass. Composition is the uncertainty that can still change GO or NO-GO."
  - id: after-stop-58
    # After Stop 58 | Tank Farm | automatic plan elimination
    on: { after: [2] }
    world: "At tank-calculation-station, the dated accepted-result slip for Stop 58 reads: \"D. Plan B meets gross mass but not usable certified methane; it cannot erase contaminants. Plan D reprocesses Batch C while validated production replaces small losses.\". The slip remains in that fixture's evidence holder."
    panel: "ONLY REPROCESS-BATCH-C PLAN SATISFIES AMOUNT + COMPOSITION + HARDWARE LIMITS."
    # unlocks: Stop 59 at the integrated control board.
    bubbles:
    - who: sundqvist   # Sundqvist
      say: "Good thinking. The faster plan fills the gauge. It does not fill the specification."
  - id: after-stop-59
    # After Stop 59 | integrated control board | automatic resource commitment
    on: { after: [3] }
    world: "At recovery-allocation-board, the dated accepted-result slip for Stop 59 reads: \"35 reprocessing, 25 independent verification, 15 electrolysis, 10 validated reactor, and 15 safety/habitat; total 100. Accept variants with at least 60 points across reprocessing + verification and no points to cosmetic recalibration, provided safety gets at least 10.\". The slip remains in that fixture's evidence holder."
    panel: "NEXT TASK - STOP 60: COMMANDER'S RECOMMENDATION"
    # unlocks: The Ascent Pad waypoint and Stop 60.
    bubbles:
    - who: demir   # Demir
      say: "Exactly right. Habitat, cooling, and reserve remain protected."
    - who: cho   # Cho
      say: "Reprocessing and water return are powered."
    - who: herrera   # Herrera
      say: "The reactor stays inside the validated envelope."
  - id: after-stop-60
    # After Stop 60 | Pad Office | automatic final result
    on: { after: [4] }
    world: "At certification-console, Commander Laila Abiola turns the final launch decision key. The final scene follows the completion gate below."
    panel: "FINAL GO / NO-GO - ALL BINDING CONDITIONS PASS"
    # unlocks: The epilogue beat; all graded interaction is complete.
    bubbles:
    - who: abiola   # Commander Laila Abiola
      say: "You brought us to the pad with fuel we can trust. Therefore Demir keeps the protected loads on through boarding; GO must hold through the last check."
  - id: at-mission-end
    # At mission end | Ascent Pad | automatic epilogue
    on: { missionEnd: true }
    world: "The display reads READY - AMOUNT VERIFIED - COMPOSITION VERIFIED - SAFETY MARGIN VERIFIED while each specialist remains beside the relevant instrument and the existing ascent-vehicle object, pad lights, engine sound, and red-dust effects deliver the launch without changing the player's viewpoint."
    panel: "CAMPAIGN COMPLETE."
    # unlocks: Campaign complete and free movement at the Ascent Pad.
    bubbles:
    - who: abiola   # Abiola
      say: "You did not fill a tank. You taught this station what full means."


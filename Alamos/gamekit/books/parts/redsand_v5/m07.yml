- title: "Heat"
  card:
    header: "MISSION 7 - 9 WORK SHIFTS REMAIN BEFORE LAUNCH."
    title: "HEAT"
    goNow: "Go to the Sabatier Reactor and meet Dr. Tomás Herrera, the reactor and safety engineer, at the coolant panel."
    body: "9 work shifts remain before launch. A heat strip ends above its limit beside a folded override sheet. Today you decide whether the cooling loss came before the setting change."
    objective: "Reconstruct the heat flow and determine why the reactor temperature was lowered."
  objective: "Reconstruct the heat flow and determine why the reactor temperature was lowered."
  stake: "9 work shifts remain before launch. A heat strip ends above its limit beside a folded override sheet. Today you decide whether the cooling loss came before the setting change."
  takeaway: "Timing matters: radiator loss before the override changes the story of motive."
  segue: "But Ingrid can still show the rate fell after the override; Herrera must let her test the change itself."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Heat", def: "energy transferred because two regions have different temperatures. It moves from a hotter region toward a colder one."}
  - {name: "Exothermic", def: "process releases heat to its surroundings. Increasing an exothermic reaction's production also increases the heat the plant must remove."}
  - {name: "Specific heat capacity", def: "the heat needed to raise one unit of mass by one degree. It connects a measured temperature change to an amount of heat."}
  - {name: "Phase change", def: "moves matter between solid, liquid, and gas without changing its chemical identity. During the change, energy can move while temperature stays constant."}
  equations:
  - {"e":"q = mcΔT","c":"calculating heat from a measured temperature change","v":[["q","heat"],["m","mass"],["c","specific heat capacity"],["ΔT","final temperature minus initial temperature"]],"s":"The coolant temperature rise reveals how much reactor heat was actually removed before the temperature override."}
  - {"e":"E_stored=E_generated-E_removed-E_carried","c":"closing a thermal ledger","v":[["E_stored","energy retained in equipment or gas"],["E_generated","reaction energy released"],["E_removed","energy removed by cooling"],["E_carried","energy carried out with matter. All four use the same energy unit"]],"s":"A positive remainder can create an inlet hot spot even when the average reactor temperature looks safe."}
  primer:
  - "The sign of reaction enthalpy tells whether higher production adds to or reduces the cooling burden."
  - "A delayed temperature signal can result from melting or another phase change, not from a delayed event."
  - "Event order should follow physical energy flows rather than the order in which gauges respond."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-reactor-hall
    # On arrival at Reactor Hall | automatic | 
    on: { enter: true, at: EQUIL }
    world: "A heat strip ends above its limit beside a folded override sheet."
    panel: "MISSION 7 - HEAT"
    # unlocks: Stop 25 at the reactor coolant panel; Stop 26 unlocks immediately after Stop 25.
    bubbles:
    - who: abiola   # Abiola
      say: "The old setting might recover fuel quickly. If it also recreates a dangerous condition, it could destroy our only reactor. Establish where the heat goes before anyone restores it."
  - id: after-stops-25-and-26
    # After Stops 25 and 26 | reactor coolant panel | automatic response
    on: { after: [1, 2] }
    world: "At skid, the dated accepted-result slip for Stop 25 reads: \"First choice.\". The slip remains in that fixture's evidence holder."
    panel: "RESULT RECORDED"
    # unlocks: The radiator-side travel beat.
    bubbles:
    - who: herrera   # Herrera
      say: "Nice work. More methane means more heat to remove. The question is whether the cooling system still had that capacity."
  - id: after-stop-26
    # After Stop 26 | reactor coolant panel | automatic travel authorization
    on: { after: [2] }
    world: "At reactor-calculation-bench, the dated accepted-result slip for Stop 26 reads: \"11,400 kJ or 11.4 MJ; tolerance ±2%.\". The slip remains in that fixture's evidence holder."
    panel: "MOVE TO COLD END."
    # unlocks: The Cold End waypoint and Stop 27; Stop 28 unlocks immediately after Stop 27.
    bubbles:
    - who: cho   # Cho
      say: "Good thinking. The phase change delays the signal. To learn what failed first, we need the radiator-side ledger."
  - id: after-stops-27-and-28
    # After Stops 27 and 28 | Cold End | automatic discovery
    on: { after: [3, 4] }
    world: "At heat-model-board, the dated accepted-result slip for Stop 27 reads: \"As listed.\". The slip remains in that fixture's evidence holder."
    panel: "RADIATOR PERFORMANCE FELL FIRST / REACTOR SET POINT FELL SECOND."
    # unlocks: The Mission 7 outcome beat.
    bubbles:
    - who: herrera   # Herrera
      say: "Exactly right. I lowered the temperature after heat rejection weakened."
  - id: at-mission-end
    # At mission end | Cold End | automatic outcome and hook
    on: { missionEnd: true }
    world: "At phase-radiator, Dr. Tomás Herrera clips the 2.7 MJ RETAINED heat ledger to the radiator board. The dated prop remains here on later visits."
    panel: "NEXT DESTINATION - PLANT CONTROL RATE BOARD."
    # unlocks: Mission 8 briefing and the Plant Control waypoint.
    bubbles:
    - who: herrera   # Dr. Tomás Herrera
      say: "I should have shown you this before I touched the setting. But Ingrid can still show the rate fell after the override; Herrera must let her test the change itself."


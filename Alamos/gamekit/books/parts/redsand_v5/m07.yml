  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 7: worked examples"
    examples:
    - {"title":"Calculate sensible heat","problem":"Warm 100 g of a material by 10 °C. Its specific heat is 4 J/(g °C).","rule":"q=mcΔT.","steps":["Set up the relationship: q=mcΔT.","q=100(4)(10)=4000 J=4 kJ."],"answer":"The material absorbs 4 kJ.","mistake":"Use temperature change, not final temperature."}
    - {"title":"Scale reaction enthalpy","problem":"A reaction releases 40 kJ per mole of reactant consumed. Find system enthalpy change for 2 mol.","rule":"ΔH=n ΔH_molar; heat release has a negative system sign.","steps":["Set up the relationship: ΔH=n ΔH_molar; heat release has a negative system sign.","ΔH=2(-40)=-80 kJ."],"answer":"The reacting system has ΔH=-80 kJ.","mistake":"Released energy is positive in magnitude but negative as system enthalpy change."}
    - {"title":"Heat during melting","problem":"A 20 g solid melts at its melting point. Latent heat of fusion is 100 J/g. Find heat absorbed.","rule":"q=mL_f during the phase change.","steps":["Set up the relationship: q=mL_f during the phase change.","q=20(100)=2000 J."],"answer":"The solid absorbs 2 kJ without a temperature rise during ideal melting.","mistake":"Using mcΔT alone misses latent heat."}
    - {"title":"Combine reaction enthalpies","problem":"Reaction A→B has ΔH=+20 kJ/mol and B→C has ΔH=-50 kJ/mol. Find ΔH for A→C.","rule":"Add enthalpies for reactions that sum to the target reaction.","steps":["Set up the relationship: Add enthalpies for reactions that sum to the target reaction.","ΔH_total=20-50=-30 kJ/mol."],"answer":"A→C has ΔH=-30 kJ/mol.","mistake":"Reversing a reaction would also reverse its enthalpy sign."}
    - {"title":"Warm a fixed-volume gas","problem":"A sealed ideal-gas sample has pressure 20 atm at 300 K. Find its pressure at 330 K if no reaction occurs.","rule":"At fixed amount and volume, P₂/P₁=T₂/T₁.","steps":["Set up the relationship: At fixed amount and volume, P₂/P₁=T₂/T₁.","P₂=20(330/300)=22 atm."],"answer":"The predicted pressure is 22 atm.","mistake":"Adding 30 to the pressure confuses temperature change with pressure change."}

  stops:
  # --- Stop 25: Which way does the heat flow?
  #     Concept: exothermic/endothermic; Keystone: energy and calorimetry; Area: Reactor Hall; Learning role: INTRODUCE; Difficulty: L1; Story role: character.
  #     placement: CHOICE, asked at Ingrid Sundqvist beside skid.
  - group: EQUIL
    at: skid
    title: "Which way does the heat flow?"
    person: sundqvist
    concept: 8   # exothermic/endothermic
    reason: "Recovery work is shifting to the reactor, where the direction of heat transfer matters for restart."
    scene: "That sign determines whether more production adds or removes reactor heat."
    motivation: "The heat sign establishes whether increased methane production adds to the cooling burden."
    format: CHOICE
    question: "What does the negative enthalpy mean?"
    choices:
    - "The reaction is exothermic; 165 kJ must leave per mole CH4 formed"
    - "It is endothermic and needs 165 kJ added."
    - "The catalyst consumes 165 kJ."
    - "The sign describes reaction speed."
    answer: "The reaction is exothermic; 165 kJ must leave per mole CH4 formed"
    answerText: "The negative enthalpy means the Sabatier reaction is exothermic and releases heat."
    why: "Negative Delta H means products have lower enthalpy than reactants and the difference appears as heat released. A catalyst changes activation energy, not Delta H. Enthalpy says nothing directly about speed."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2) Negative ΔH means heat is released, not absorbed; the surroundings must remove that heat. (3) A catalyst changes activation energy and reaction speed but is not an energy sink and does not consume the reaction enthalpy. (4) The sign of ΔH describes energy change, not reaction rate; kinetics is a separate question.
    # correct result: First choice.
    # state/output: Enable coolant-load calculation.

  # --- Stop 26: Size the coolant load
  #     Concept: calorimetry; Keystone: energy and calorimetry; Area: Reactor Hall; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: BALLPARK, at reactor-calculation-bench.
  - group: EQUIL
    at: reactor-calculation-bench
    title: "Size the coolant load"
    concept: 8   # calorimetry
    reason: "The heat-flow direction is established and the coolant's removal capacity needs quantifying."
    scene: "A 1000 kg coolant charge warmed by 3.0 K; its specific heat capacity is 3.8 kJ/(kg K). In q = mcΔT, q is transferred heat, m is coolant mass, c is specific heat capacity, and ΔT is its temperature rise."
    motivation: "The coolant energy transfer supplies a measured removal term for the reactor's energy balance."
    format: BALLPARK
    question: "Submit the heat removed by the coolant in kilojoules."
    answerText: "The coolant removed 11.4 MJ of heat."
    why: "Multiply mass, energy per kilogram per kelvin, and temperature change. The positive number describes heat gained by coolant; the reactor system loses approximately that heat. Always name the system when assigning signs."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Using final temperature instead of temperature change overstates the load. A value of 11,400 J misses the kJ unit.
    # correct result: 11,400 kJ or 11.4 MJ; tolerance ±2%.
    # state/output: Add coolant_removed = 11.4 MJ to the ledger.
    estimate:
      prompt: multiply mass by specific heat capacity by temperature change
      question: heat gained by the coolant
      labels:
        - 1000 kg  (Coolant mass)
        - 3.8 kJ/(kg K)  (Specific heat capacity)
        - 3 K  (Temperature change)
      values:
        - 1000
        - 3.8
        - 3
      slots: 3
      template: q=({0})({1})({2})
      formula: q=(1000)(3.8)(3.0)
      correct:
        - 0
        - 1
        - 2
      target: 11400
      tolerance: 228
      units: kJ

  # --- Stop 27: Follow energy through temperature and phase
  #     Concept: heating curves; Keystone: energy and calorimetry; Area: Reactor Hall; Learning role: PRACTICE; Difficulty: L2; Story role: clue.
  #     placement: SEQUENCE, at heat-model-board.
  - group: EQUIL
    at: heat-model-board
    title: "Follow energy through temperature and phase"
    concept: 8   # heating curves
    reason: "The cooling record mixes temperature changes with phase changes and delayed sensor responses."
    scene: "The cooling record includes sensible heating, a phase change, and the response delay of the temperature sensor. The event cards show those physical steps alongside their recorded times."
    motivation: "The energy sequence resolves the timing needed to identify which thermal change preceded the incident."
    format: SEQUENCE
    question: "Order the energy steps."
    # CONVERTED from the bible's `data` line below; `correct result: As listed`.
    cards:
    - "Warm solid ice to its melting point"
    - "Melt ice at constant temperature using q = n Delta Hfus"
    - "Warm liquid water to final temperature"
    order: [0, 1, 2]
    answerText: "Warm solid, melt at constant temperature, then warm liquid before comparing the delayed signal."
    why: "Temperature rises within one phase, but during melting the added energy breaks intermolecular organization while temperature stays constant. Treating the plateau as mc Delta T invents a temperature change that does not occur."
    # wrong-path feedback, one rebuttal per wrong option:
    #   If melting is placed before the solid reaches its melting point, the phase-change step starts too early. If the melting plateau is treated as another temperature rise, the sequence ignores energy absorbed at constant temperature.
    # data: Warm solid ice to its melting point / Melt ice at constant temperature using q = n Delta Hfus / Warm liquid water to final temperature.
    # correct result: As listed.
    # state/output: Model predicts a delayed warm return pulse reaching Cold End.

  # --- Stop 28: Close the reactor-radiator energy ledger
  #     Concept: energy conservation; Keystone: energy and calorimetry; Area: Reactor Hall; Learning role: COMBINE; Difficulty: L3; Story role: reveal.
  #     placement: BALANCE, at phase-radiator.
  - group: EQUIL
    at: phase-radiator
    title: "Close the reactor-radiator energy ledger"
    concept: 8   # energy conservation
    reason: "The coolant transfer and timing are established, leaving the reactor's full energy balance to close."
    scene: "Use the corrected timeline to close the radiator energy ledger and determine whether cooling loss preceded Herrera's temperature change."
    motivation: "The unexplained energy load indicates how much heating must accumulate outside the listed removal paths."
    format: BALANCE
    question: "Find the unremoved energy and identify the operational consequence."
    # CONVERTED from the payload below. `target` -> `total`; `count:` ->
    # `countable:`; `closure.tolerance` -> `tolerance`; and `closure.residual`
    # becomes the hidden stream, named from the bible's own correct action —
    # "Assign 2.7 MJ to accumulated hot-spot/structure load".
    balance:
      total: { amount: 16.5, unit: MJ, label: "Heat released by reactor" }
      tolerance: 0.05
      streams:
      - { id: coolant, label: "Removed by coolant", value: 11.4, unit: MJ }
      - { id: bed_storage, label: "Stored in metal bed", value: 1.6, unit: MJ }
      - { id: product_gas, label: "Carried by product gas", value: 0.8, unit: MJ }
      - { id: dashboard_power, label: "Electrical drive power", value: 0.9, unit: MJ, countable: false }
      - { id: hot_spot, label: "Accumulated hot-spot / structure load", value: 2.7, unit: MJ, hidden: true }
      commit: "Report the unremoved energy"
    answerText: "The ledger leaves 2.7 MJ accumulating as a hot-spot or structure load."
    why: "Energy generated must be removed, carried away, stored, or accumulated elsewhere. 16.5 - 11.4 - 1.6 - 0.8 = 2.7 MJ. The radiator degradation appears before Herrera's override; lowering the set point reduced heat generation after removal capacity fell."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Do not count released heat and coolant gain on the same side; do not interpret missing energy as destroyed.
    # correct result: 2.7 MJ remains unaccounted in the simplified removal paths and accumulates as a hot-spot/structure load.
    # state/output: Set evidence_flags.radiator_first = true and evidence_flags.setpoint_changed = true; display Herrera's signed override timestamp.

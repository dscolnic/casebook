# ============================================================ MISSION 1
# Lifted from ../fpl_gpt/Mars_AP_Chemistry_Campaign_Implementation_Bible_v10.5_Explicit_Build_Ownership.md by tools/v10extract.mjs. Every quoted string below is
# the bible's, verbatim; engine/dev/bibleParity.mjs holds it to that.
- title: "The Shortfall"
  card:
    header: "15 SHIFTS UNTIL THE LAUNCH WINDOW CLOSES"
    title: "THE SHORTFALL"
    goNow: "Go to Plant Control and meet Commander Laila Abiola, the mission commander, at the carbon ledger."
    body: "The Mars crew does not have enough methane fuel to get home. They suspect a leak, but shutting the wrong valves would waste time and stop useful production. Use chemistry to compare samples and track the carbon, then decide whether a large leak explains the shortage."
    objective: "Use the production records to decide whether a large methane leak can explain the fuel shortage."
  objective: "Use the production records to decide whether a large methane leak can explain the fuel shortage."
  stake: "The Mars crew does not have enough methane fuel to get home. They suspect a leak, but shutting the wrong valves would waste time and stop useful production. Use chemistry to compare samples and track the carbon, then decide whether a large leak explains the shortage."
  takeaway: "A nearly closed carbon ledger weakens a large methane-leak explanation; it does not identify the real cause."
  segue: "Mission decision: A large methane leak cannot explain the fuel gap. The new count finds 99.8% of the carbon. Work on random valves stops. The plant still needs fuel. The next test asks if the air intake brings in enough carbon dioxide."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Particle", def: "one counted piece of matter. In this mission, a particle may be an atom, a molecule, or an ion."}
  - {name: "Atom", def: "the smallest ordinary piece of one kind of matter that keeps that identity. Counting atoms lets the plant check whether matter has disappeared."}
  - {name: "Ion", def: "an atom or group of atoms with an electrical charge. It is not the same thing as a neutral atom or molecule."}
  - {name: "Mole", def: "a fixed count of particles, the same count for every substance. One mole contains 6.022 x 10^23 particles; one kilomole contains one thousand moles."}
  equations:
  - {"e":"moles = grams / molar mass; particles = moles x 6.022 x 10^23","c":"turning a mass on a scale into a count of particles","v":[["grams","the measured mass"],["molar mass","the grams in one mole"],["6.022 x 10^23","Avogadro's number, the particles in one mole"]],"s":"The tank scale reports mass, but the reactor and atom ledger must count particles before the crew can decide whether fuel is missing."}
  - {"e":"unaccounted amount = amount entering - amount accounted for","c":"closing a material ledger","v":[["amount entering","the measured input"],["amount accounted for","the total in products, recycle, samples, and measured losses"]],"s":"The crew should hunt a leak only if the carbon entering the plant cannot be found in known streams."}
  primer:
  - "Matter can change form during a reaction, but atoms are not created or destroyed."
  - "A mass shortage is not automatically a leak; first ask whether the unit conversion and atom count close."
  - "Chemical formulas show how many atoms of each element are present in one particle."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-plant-control
    # On arrival at Plant Control | automatic | 
    on: { enter: true, at: GIBBS }
    world: "The four-bar HUD opens at METHANE 82%, OXYGEN 88%, POWER 72%, and INTEGRITY 70%; Two technicians reach for different valve controls; Abiola steps between them and locks both panels."
    panel: "MISSION 1 - THE SHORTFALL"
    # unlocks: Stop 1 at the sample tray.
    bubbles:
    - who: abiola   # Abiola
      say: "Those valves stay open until we know whether matter is actually missing. We have fifteen shifts to make the fuel that gets us home. Start with the ledger."
  - id: after-stop-1
    # After Stop 1 | sample tray | automatic correct-answer response
    on: { after: [1] }
    world: "The four sample labels separate into ATOM, MOLECULE, and ION columns."
    panel: "NEXT TASK - STOP 2: HOW MUCH METHANE IS MISSING?"
    # unlocks: Stop 2 at the conversion board; Stop 3 unlocks immediately after Stop 2.
    bubbles:
    - who: abiola   # Abiola
      say: "Nice work. If the software calls every object the same kind of particle, the count can be correct and the conclusion can still be wrong."
  - id: after-stops-2-and-3
    # After Stops 2 and 3 | conversion board | automatic transition
    on: { after: [2, 3] }
    world: "The scale reading, moles, and molecule count connect with a continuous illuminated unit path."
    panel: "MASS -\\> MOLES -\\> MOLECULES."
    # unlocks: Stop 4 at the carbon ledger.
    bubbles:
    - who: abiola   # Abiola
      say: "Good thinking. Now the tank scale and the reactor model are speaking the same language. Open the carbon ledger."
  - id: after-stop-4
    # After Stop 4 | carbon ledger | automatic discovery
    on: { after: [4] }
    world: "The carbon streams close to within 0.2%; The red leak warning changes to amber, but the methane shortfall remains red."
    panel: "CARBON ACCOUNTED FOR: 99.8% / METHANE TARGET: NOT MET."
    # unlocks: The Mission 1 outcome beat.
    bubbles:
    - who: abiola   # Abiola
      say: "Exactly right. We are still short of methane. We may not be short of carbon."
  - id: at-mission-end
    # At mission end | Plant Control | automatic outcome and hook
    on: { missionEnd: true }
    world: "Sundqvist's static portrait appears in the radio-bubble HUD while the Atmosphere Intake waypoint pulses on the map."
    panel: "NEXT DESTINATION - ATMOSPHERE INTAKE."
    # unlocks: Mission 2 briefing and the Atmosphere Intake waypoint.
    bubbles:
    - who: sundqvist   # Sundqvist
      say: "Outstanding work. You solved the mission. Then the Martian air may never be reaching the reactor in the first place."
    - who: abiola   # Abiola
      say: "Do not increase compressor power. The Propellant Lead will test that claim first."


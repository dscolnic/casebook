- title: "Power"
  card:
    header: "MISSION 13 - 3 WORK SHIFTS REMAIN BEFORE LAUNCH."
    title: "POWER"
    goNow: "Go to the Solar Array and meet Yusuf Demir, the power and life-support officer, at the live power board."
    body: "3 work shifts remain before launch. The habitat breaker tags sit beside a climbing tank gauge. Today you decide how much power the fuel cells may use."
    objective: "Turn the available electricity into launch gases while protecting every critical system."
  objective: "Turn the available electricity into launch gases while protecting every critical system."
  stake: "3 work shifts remain before launch. The habitat breaker tags sit beside a climbing tank gauge. Today you decide how much power the fuel cells may use."
  takeaway: "A power allocation is scientific when every funded load protects a named consequence."
  segue: "But Achebe carries a fresh Batch C vial toward the lab; full tanks have not yet earned the word ready."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Electron", def: "a particle with negative electric charge found in atoms. Electron arrangement helps determine how atoms join and whether a particle has a net charge."}
  - {name: "Electrode", def: "a solid part where electrons enter or leave a chemical system. The water cell has a cathode and an anode."}
  - {name: "Cathode", def: "the electrode where reduction occurs. The powered cell sends electrons to this electrode."}
  - {name: "Anode", def: "the electrode where oxidation occurs. Electrons leave this electrode through the outside circuit."}
  equations:
  - {"e":"Q = It","c":"finding the total electric charge delivered during a timed run","v":[["Q","charge in coulombs"],["I","current in amperes"],["t","time in seconds"]],"s":"The dust-limited array gives the crew current and time, but the recovery plan needs a predicted amount of hydrogen and oxygen."}
  - {"e":"Faraday's law calculation, moles of electrons = Q / F","c":"converting electric charge into chemical amount","v":[["Q","charge in coulombs"],["F","96,485 coulombs per mole of electrons"]],"s":"Electron amount is the bridge between the power board and the number of gas molecules the plant can make."}
  - {"e":"actual product = theoretical product x current efficiency","c":"correcting ideal gas production for practical electrical losses","v":[["actual","product is the usable amount made"],["theoretical","product follows electron stoichiometry"],["current","efficiency is written as a decimal fraction"]],"s":"The launch plan must budget for the cell the crew actually has rather than a perfect 100-percent cell."}
  primer:
  - "Reduction occurs at the cathode and oxidation occurs at the anode in both driven and spontaneous cells."
  - "Electrons travel through the outside circuit; ions move through the liquid to keep charge balanced."
  - "Producing more gas is not a valid plan if cooling, purification, refrigeration, or habitat power falls below its required minimum."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-array-shed
    # On arrival at Array Shed | automatic | 
    on: { enter: true, at: ARRAY }
    world: "The habitat breaker tags sit beside a climbing tank gauge."
    panel: "MISSION 13 - POWER"
    # unlocks: Stop 49 at the live power meter; Stop 50 unlocks immediately after Stop 49.
    bubbles:
    - who: demir   # Demir
      say: "Every kilowatt now has a consequence. Electrolysis makes launch gases, but cooling protects the reactor, refrigeration protects the product, and the habitat keeps us alive. Count before you allocate."
  - id: after-stops-49-and-50
    # After Stops 49 and 50 | array power-routing display | automatic response
    on: { after: [1, 2] }
    world: "At array-controller, the dated accepted-result slip for Stop 49 reads: \"First choice.\". The slip remains in that fixture's evidence holder."
    panel: "MOVE TO BATTERY GALLERY."
    # unlocks: The Battery Gallery travel beat.
    bubbles:
    - who: demir   # Demir
      say: "Nice work. Now the electrical path and the chemical products agree. Check the battery floor before promising current we cannot sustain."
  - id: on-arrival-at-battery-bank
    # On arrival at Battery Bank | automatic constraint reveal | 
    on: { enter: true, at: BATT }
    world: "At cell-stacks, the dated accepted-result slip for Stop 50 reads: \"Cyclic order as listed, with note that the processes occur continuously rather than one molecule at a time.\". The slip remains in that fixture's evidence holder."
    panel: "AVAILABLE FOR RECOVERY OPERATIONS - UPDATED."
    # unlocks: The Battery Gallery waypoint, followed by the Electrolysis Hall waypoint and Stops 51-52.
    bubbles:
    - who: abiola   # Abiola
      say: "Good thinking. These loads are not bargaining chips. Whatever remains can recover propellant."
  - id: after-stops-51-and-52
    # After Stops 51 and 52 | Electrolysis Hall | automatic decision
    on: { after: [3, 4] }
    world: "At stack-sheet, the dated accepted-result slip for Stop 51 reads: \"2.77 kg; tolerance ±3%.\". The slip remains in that fixture's evidence holder."
    panel: "MISSION DECISION READY"
    # unlocks: The Mission 13 outcome beat.
    bubbles:
    - who: demir   # Demir
      say: "Exactly right. The plan does not maximize one machine. It keeps the entire route to launch alive."
  - id: at-mission-end
    # At mission end | Electrolysis Hall | automatic outcome and hook
    on: { missionEnd: true }
    world: "At loadboard, Yusuf Demir pins the protected-load schedule beneath the full amount readings. The dated prop remains here on later visits."
    panel: "LAUNCH HOLD - INDEPENDENT ASSAY DISAGREES."
    # unlocks: Mission 14 briefing and the Tank Farm waypoint.
    bubbles:
    - who: demir   # Yusuf Demir
      say: "Both amounts are full. Leave room for the test to say no. But Achebe carries a fresh Batch C vial toward the lab; full tanks have not yet earned the word ready."


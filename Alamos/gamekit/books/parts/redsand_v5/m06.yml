- title: "The Leak That Was Not"
  card:
    header: "10 SHIFTS UNTIL THE LAUNCH WINDOW CLOSES"
    title: "THE LEAK THAT WAS NOT"
    goNow: "Go to Plant Control and meet Commander Laila Abiola, the mission commander, at the evidence board."
    body: "Carbon is accounted for, the intake can meet demand, the hydrogen branch contains nitrogen, and three water alarms share one standard. These clues need one explanation that fits the quiet readings. Review the evidence in Plant Control, test the diagnosis against uncertainty, then verify its atom balance at the Tank Farm. By the end of the mission, decide whether to end the methane-leak search and repair hydrogen delivery."
    objective: "Choose one cause that fits every clue and prove it with complete atom balances."
  objective: "Choose one cause that fits every clue and prove it with complete atom balances."
  stake: "Carbon is accounted for, the intake can meet demand, the hydrogen branch contains nitrogen, and three water alarms share one standard. These clues need one explanation that fits the quiet readings. Review the evidence in Plant Control, test the diagnosis against uncertainty, then verify its atom balance at the Tank Farm. By the end of the mission, decide whether to end the methane-leak search and repair hydrogen delivery."
  takeaway: "A scientific twist is fair when old clues remain true but acquire a better meaning."
  segue: "Mission decision: End the methane-leak search. Repair the hydrogen line. One fault explains the carbon count, added nitrogen, low water, normal pressure, and false stain clue. Most of the missing fuel was never made. A signed heat-setting change now raises a new question."
  # The mission card's own "Primer concepts", printed on the plan card.
  primer:
  - "Use the fewest causes that explain all observations without contradicting any quiet reading."
  - "Test the decision against allowed measurement error before committing repair time."
  - "Reinterpret each earlier clue only after the new explanation predicts what that clue should show."

  # The bible's beat script. `world` is its World state line, `panel` its

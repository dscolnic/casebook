  worked:
    label: "Worked examples"
    title: "Mission 6: worked examples"
    examples:
    - {"title":"Balance a reaction","problem":"Balance H₂ + O₂ → H₂O without changing chemical formulas.","rule":"Coefficients conserve each element; subscripts identify substances.","steps":["Place 2 before H₂O so the product has two oxygen atoms.","Place 2 before H₂ to supply four hydrogen atoms: 2H₂ + O₂ → 2H₂O."],"answer":"Both sides contain four hydrogen atoms and two oxygen atoms.","mistake":"Changing H₂O to H₂O₂ would change the product."}
    - {"title":"Find the limiting reactant","problem":"For 2H₂+O₂→2H₂O, mix 6 mol H₂ and 2 mol O₂.","rule":"Compare available amount divided by its reactant coefficient.","steps":["hydrogen reaction units=6/2=3; oxygen reaction units=2/1=2.","Oxygen permits fewer reaction units; water produced=2(2)=4 mol."],"answer":"O₂ limits the reaction; 2 mol H₂ remains.","mistake":"The reactant with fewer moles is not always limiting; coefficients matter."}
    - {"title":"Find a partial pressure","problem":"An ideal-gas mixture is 25% helium by mole and has total pressure 8 atm.","rule":"P_He=x_He P_total.","steps":["Set up the relationship: P_He=x_He P_total.","P_He=0.25(8)=2 atm."],"answer":"Helium contributes 2 atm.","mistake":"Use mole fraction, not mass fraction."}
    - {"title":"Compare relative errors","problem":"Two length measurements each have uncertainty ±1 cm. One length is 10 cm and the other 50 cm. Compare relative uncertainty.","rule":"Relative uncertainty = absolute uncertainty / measured magnitude.","steps":["first relative uncertainty = 1/10 = 0.10 = 10%.","second relative uncertainty = 1/50 = 0.02 = 2%. The same absolute uncertainty is a smaller fraction of the longer length."],"answer":"The 50 cm measurement has smaller relative uncertainty.","mistake":"Equal absolute errors do not imply equal percentage errors."}
    - {"title":"Count independent evidence sources","problem":"Three reports copy one balance reading. A fourth report uses a separately calibrated balance. How many measurement sources are there?","rule":"Reports are not independent measurements when they copy a common source.","steps":["source group 1 = the first balance and its three copies. Count that measurement once.","source group 2 = the second balance. It adds a separate measurement route."],"answer":"There are two measurement sources, not four.","mistake":"Agreement among copies cannot establish independent confirmation."}


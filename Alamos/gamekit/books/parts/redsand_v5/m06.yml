  # --- Stop 22: Does calibration uncertainty rescue the leak theory?
  #     Concept: uncertainty/robustness; Keystone: evidence must be independent; Area: Plant Control; Learning role: APPLY; Difficulty: L4; Story role: decision.
  #     placement: STRESS, asked at Commander Laila Abiola beside evidence-board.
  - group: GIBBS
    at: evidence-board
    title: "Does calibration uncertainty rescue the leak theory?"
    person: abiola
    concept: 7   # uncertainty/robustness
    reason: "The leak theory is weakened, but the conclusion still needs testing against calibration uncertainty."
    scene: "The carbon-intake calibration can be varied over the displayed uncertainty range. The panel compares each resulting carbon residual with the methane schedule shortfall and the separate hydrogen-delivery evidence."
    motivation: "The largest supported carbon residual determines whether a leak could account for the production shortfall."
    format: STRESS
    question: "Stress the carbon-intake calibration across its allowed range. Which diagnosis remains viable throughout?"
    answerText: "The hydrogen-delivery diagnosis survives the full allowed calibration range."
    why: "Robust conclusions survive reasonable error. The exact residual moves, but not enough to cross the decision boundary. Uncertainty should weaken claims in proportion to its size, not erase all evidence."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Choosing the leak because "any uncertainty means anything is possible" confuses uncertainty with ignorance.
    # correct result: Hydrogen delivery deficiency remains viable. Even the largest plausible carbon residual is far below the 18% schedule shortfall required by a large methane leak.
    # state/output: Set evidence_flags.h2_diagnosis_robust = true; authorize independent Tank Farm sampling.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   stress:
    #     assumption: {id: carbon_flow_bias, label: "Carbon-intake calibration bias", min: -2.0, max: 2.0, step: 0.5, unit: percent}
    #     candidates:
    #       - {id: methane_leak, label: "Large methane leak", viability: [[-2,false],[-1,false],[0,false],[1,false],[2,false]]}
    #       - {id: low_co2, label: "Insufficient CO2", viability: [[-2,false],[-1,false],[0,false],[1,false],[2,false]]}
    #       - {id: low_h2, label: "Hydrogen delivery deficiency", viability: [[-2,true],[-1,true],[0,true],[1,true],[2,true]]}
    #       - {id: dead_sensor, label: "Dead methane sensor", viability: [[-2,false],[-1,false],[0,false],[1,false],[2,false]]}
    #     boundary: "A leak must explain an 18% schedule gap; allowed bias never creates that residual."
    #     correct: low_h2
    stress:
      candidates:
        - id: nominal_only
          label: Use only the nominal reading
        - id: common_extreme_mistake
          label: Use the favorable extreme as if it were guaranteed
        - id: robust_plan
          label: Hydrogen delivery deficiency remains viable. Even
      criteria:
        - key: evidence_fit
          label: fit to the stop evidence
        - key: safety_margin
          label: margin at the adverse end
      scores:
        nominal_only:
          evidence_fit: 95
          safety_margin: 20
        common_extreme_mistake:
          evidence_fit: 88
          safety_margin: 5
        robust_plan:
          evidence_fit: 82
          safety_margin: 92
      feasible:
        nominal_only: 0
        common_extreme_mistake: 0
        robust_plan: -0.5
      assumption:
        label: pressure-gauge calibration error
        unit: atm
        min: -0.5
        max: 0.5
        nominal: 0
        step: 0.1
      robust: robust_plan
      optimiseOn: evidence_fit

  # --- Stop 23: Close C, H, and O at the Tank Farm
  #     Concept: full atom ledger; Keystone: particles, moles, balancing, and stoichiometry; Area: Reactor Hall; Learning role: RETRIEVE; Difficulty: L4; Story role: payoff.
  #     placement: BALANCE, at farm-gauges.
  - group: EQUIL
    at: farm-gauges
    title: "Close C, H, and O at the Tank Farm"
    concept: 2   # full atom ledger
    reason: "The carbon result points away from a large leak, so hydrogen and oxygen need closing too."
    scene: "Take that prediction to the Tank Farm and close the carbon, hydrogen, and oxygen ledgers to test whether the methane was never produced."
    motivation: "The three element balances distinguish lost matter from matter retained in another chemical form or an insufficient feed."
    format: BALLPARK
    question: "Close separate C, H, and O ledgers and state what the amounts imply."
    answerText: "All C, H, and O atoms close; 320 mol H2 limits production to 80 mol CH4."
    why: "The ledger explains low methane without lost matter. Carbon not converted remains CO2. Hydrogen appears in methane and water exactly as the equation requires."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Count atoms, not molecules; water contains two H and one O; remaining CO2 belongs in output inventory.
    # correct result: Inputs: C 100, H 640, O 200 mol atoms. Outputs: C 80+20=100; H 80x4 +160x2=640; O 20x2 +160=200. H2 is limiting because only 320 mol is supplied, supporting 80 mol CH4.
    # state/output: Tank composition display changes from "missing mass" to "unconverted CO2 / N2 dilution."
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   balance:

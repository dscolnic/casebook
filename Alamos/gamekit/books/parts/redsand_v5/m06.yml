- title: "The Leak That Was Not"
  card:
    header: "10 SHIFTS UNTIL THE LAUNCH WINDOW CLOSES"
    title: "THE LEAK THAT WAS NOT"
    goNow: "Go to Plant Control and meet Commander Laila Abiola, the mission commander, at the evidence board."
    body: "The carbon is accounted for, nitrogen has appeared in the hydrogen pipe, and three water alarms rely on the same calibration sample. Find an explanation that fits all the evidence. Check the material totals and decide whether to end the leak search and repair hydrogen delivery."
    objective: "Choose one cause that fits every clue and prove it with complete atom balances."
  objective: "Choose one cause that fits every clue and prove it with complete atom balances."
  stake: "The carbon is accounted for, nitrogen has appeared in the hydrogen pipe, and three water alarms rely on the same calibration sample. Find an explanation that fits all the evidence. Check the material totals and decide whether to end the leak search and repair hydrogen delivery."
  takeaway: "A scientific twist is fair when old clues remain true but acquire a better meaning."
  segue: "Mission decision: End the methane-leak search. Repair the hydrogen line. One fault explains the carbon count, added nitrogen, low water, normal pressure, and false stain clue. Most of the missing fuel was never made. A signed heat-setting change now raises a new question."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Diagnosis", def: "the proposed cause that explains the full pattern of observations. A strong diagnosis must explain quiet readings as well as alarms."}
  - {name: "Uncertainty", def: "the range of values that could reasonably match a measurement. A conclusion is stronger when it survives every value in that allowed range."}
  - {name: "Error", def: "the difference between a measured value and the value a perfect measurement would give. It does not necessarily mean a person made a careless mistake."}
  - {name: "Atom balance", def: "counts each element entering, leaving, and remaining in a system. Every atom must appear somewhere even when the desired product was never made."}
  primer:
  - "Use the fewest causes that explain all observations without contradicting any quiet reading."
  - "Test the decision against allowed measurement error before committing repair time."
  - "Reinterpret each earlier clue only after the new explanation predicts what that clue should show."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-plant-control
    # On arrival at Plant Control | automatic | 
    on: { enter: true, at: GIBBS }
    world: "Abiola removes the dashboard summary and replaces it with raw carbon flow, gas composition, water production, pressure, and residue evidence."
    panel: "MISSION 6 - THE LEAK THAT WAS NOT"
    # unlocks: Stop 21 at the evidence board; Stop 22 unlocks immediately after Stop 21.
    bubbles:
    - who: abiola   # Abiola
      say: "No votes. No favorite alarm. Choose the one mechanism that explains what changed and what stayed quiet."
  - id: after-stops-21-and-22
    # After Stops 21 and 22 | evidence board | automatic diagnosis
    on: { after: [1, 2] }
    world: "HYDROGEN DELIVERY DEFICIENCY remains highlighted while the other explanations fail one or more observations, even as the intake calibration slider moves."
    panel: "RESULT RECORDED"
    # unlocks: The prediction-lock travel beat.
    bubbles:
    - who: abiola   # Abiola
      say: "Nice work. The conclusion survives the allowed measurement error. Now make it predict what an independent tank sample should show."
  - id: after-stop-22
    # After Stop 22 | evidence board | automatic travel authorization
    on: { after: [2] }
    world: "The evidence board predicts low methane fraction, nitrogen present, and no large missing-carbon term."
    panel: "PREDICTION LOCKED - VERIFY AT TANK FARM."
    # unlocks: The Tank Farm waypoint and Stop 23; Stop 24 unlocks immediately after Stop 23.
    bubbles:
    - who: herrera   # Herrera
      say: "Good thinking. If that prediction is right, the fuel was mostly never made. We should find carbon in recycle, not outside the plant."
  - id: after-stops-23-and-24
    # After Stops 23 and 24 | Tank Farm | automatic Twist 1
    on: { after: [3, 4] }
    world: "The carbon, hydrogen, and oxygen ledgers close; Earlier clues flip to their supported meanings one by one."
    panel: "NO MAJOR METHANE LEAK / LOW H2 PARTIAL PRESSURE REDUCED PRODUCTION."
    # unlocks: The Mission 6 outcome beat.
    bubbles:
    - who: abiola   # Abiola
      say: "Exactly right. There is no major methane leak. We spent four shifts looking for fuel that was mostly never produced."
  - id: at-mission-end
    # At mission end | Tank Farm | automatic outcome and hook
    on: { missionEnd: true }
    world: "Relief is interrupted when Herrera opens the first hydrogen-delivery drop and a signed temperature override appears immediately before it."
    panel: "NEXT ROUTE - SABATIER REACTOR -\\> COLD END."
    # unlocks: Mission 7 briefing and the Sabatier Reactor waypoint.
    bubbles:
    - who: herrera   # Herrera
      say: "Outstanding work. You solved the mission. Those are my credentials."
    - who: sundqvist   # Sundqvist
      say: "Then your change may have caused the collapse."
    - who: abiola   # Abiola
      say: "We follow the heat before we accuse the engineer."


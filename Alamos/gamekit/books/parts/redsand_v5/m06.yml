  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-plant-control
    # On arrival at Plant Control | automatic | 
    on: { enter: true, at: GIBBS }
    world: "Abiola removes the dashboard summary and replaces it with raw carbon flow, gas composition, water production, pressure, and residue evidence."
    panel: "MISSION 6 - THE LEAK THAT WAS NOT"
    # unlocks: Stop 21 at the evidence board; Stop 22 unlocks immediately after Stop 21.
    bubbles:
    - who: abiola   # Abiola
      say: "No votes. No favorite alarm. Choose the one mechanism that explains what changed and what stayed quiet."
  - id: after-stops-21-and-22
    # After Stops 21 and 22 | evidence board | automatic diagnosis
    on: { after: [1, 2] }
    world: "HYDROGEN DELIVERY DEFICIENCY remains highlighted while the other explanations fail one or more observations, even as the intake calibration slider moves."
    panel: "RESULT RECORDED"
    # unlocks: The prediction-lock travel beat.
    bubbles:
    - who: abiola   # Abiola
      say: "The conclusion survives the allowed measurement error. Now make it predict what an independent tank sample should show."
  - id: after-stop-22
    # After Stop 22 | evidence board | automatic travel authorization
    on: { after: [2] }
    world: "The evidence board predicts low methane fraction, nitrogen present, and no large missing-carbon term."
    panel: "PREDICTION LOCKED - VERIFY AT TANK FARM."
    # unlocks: The Tank Farm waypoint and Stop 23; Stop 24 unlocks immediately after Stop 23.
    bubbles:
    - who: herrera   # Herrera
      say: "If that prediction is right, the fuel was mostly never made. We should find carbon in recycle, not outside the plant."
  - id: after-stops-23-and-24
    # After Stops 23 and 24 | Tank Farm | automatic Twist 1
    on: { after: [3, 4] }
    world: "The carbon, hydrogen, and oxygen ledgers close; Earlier clues flip to their supported meanings one by one."
    panel: "NO MAJOR METHANE LEAK / LOW H2 PARTIAL PRESSURE REDUCED PRODUCTION."
    # unlocks: The Mission 6 outcome beat.
    bubbles:
    - who: abiola   # Abiola
      say: "There is no major methane leak. We spent four shifts looking for fuel that was mostly never produced."
  - id: at-mission-end
    # At mission end | Tank Farm | automatic outcome and hook
    on: { missionEnd: true }
    world: "Relief is interrupted when Herrera opens the first hydrogen-delivery drop and a signed temperature override appears immediately before it."

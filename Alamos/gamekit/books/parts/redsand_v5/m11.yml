  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 11: worked examples"
    examples:
    - {"title":"Compute an equilibrium constant","problem":"For A⇌B, equilibrium concentrations are [A]=0.2 M and [B]=0.6 M. Find the concentration quotient used for K.","rule":"K=[B]/[A] for this 1:1 idealized reaction, using standard-state normalized concentrations.","steps":["Set up the relationship: K=[B]/[A] for this 1:1 idealized reaction, using standard-state normalized concentrations.","K=0.6/0.2=3."],"answer":"The equilibrium constant is 3.","mistake":"Use equilibrium concentrations, not initial concentrations."}
    - {"title":"Predict net reaction direction","problem":"For A⇌B, K=4. A mixture has [A]=0.5 M and [B]=1 M. Compare Q with K.","rule":"Q=[B]/[A]; Q<K favors net forward reaction.","steps":["Set up the relationship: Q=[B]/[A]; Q<K favors net forward reaction.","Q=1/0.5=2<4."],"answer":"The mixture undergoes net forward reaction toward B.","mistake":"A large product concentration alone does not determine the direction."}
    - {"title":"Solve a simple equilibrium","problem":"Initially [A]=1 M and [B]=0 for A⇌B in a fixed volume. At equilibrium K=1.","rule":"Let x M convert: [A]=1-x and [B]=x.","steps":["Set up the relationship: Let x M convert: [A]=1-x and [B]=x.","x/(1-x)=1; x=1-x; x=0.5 M."],"answer":"Both equilibrium concentrations are 0.5 M.","mistake":"Equal equilibrium concentrations follow from K=1 here, not from a universal rule."}
    - {"title":"Compress an equilibrium mixture","problem":"For N₂O₄(g)⇌2NO₂(g), the volume is reduced at constant temperature. Which net direction is favored initially?","rule":"Compression favors the side with fewer gas particles for this equilibrium.","steps":["The left side has one gas molecule per reaction unit; the right has two.","Net reverse reaction reduces the increased pressure relative to no reaction."],"answer":"The mixture shifts toward N₂O₄; K stays unchanged at fixed temperature.","mistake":"Compression changes composition, not K when temperature is fixed."}
    - {"title":"Explain a catalyst","problem":"A catalyst lowers activation barriers without changing reactant and product energies. What changes at a fixed temperature?","rule":"A catalyst offers a faster pathway but does not change the equilibrium constant.","steps":["Forward and reverse reactions can proceed faster.","The equilibrium composition stays the same, though it is reached sooner."],"answer":"The catalyst changes kinetics, not the equilibrium constant.","mistake":"A faster forward reaction alone does not imply a new equilibrium yield."}

  stops:
  # --- Stop 41: Build the equilibrium expression
  #     Concept: equilibrium expressions; Keystone: equilibrium and reaction quotient; Area: Reactor Hall; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: CHOICE, asked at Dr. Tomás Herrera beside equil-stub.
  - group: EQUIL
    at: equil-stub
    title: "Build the equilibrium expression"
    person: herrera
    concept: 12   # equilibrium expressions
    reason: "A safer recovery plan is being developed and needs the reactor's equilibrium relationship."
    scene: "To replace the unsafe setting, first write the equilibrium expression that describes the final balance among the four Sabatier gases."
    motivation: "The equilibrium expression defines how reactant and product concentrations constrain the achievable methane mixture."
    format: CHOICE
    question: "Which Kc expression matches the gas-phase Sabatier equation?"
    choices:
    - "\\[CH4\\]\\[H2O\\]^2 / (\\[CO2\\]\\[H2\\]^4)"
    - "\\[CH4\\]\\[H2O\\] / (\\[CO2\\]\\[H2\\])"
    - "\\[CO2\\]\\[H2\\]^4 / (\\[CH4\\]\\[H2O\\]^2)"
    - "\\[CH4\\]^1\\[H2O\\]^2 - \\[CO2\\]^1\\[H2\\]^4"
    answer: "\\[CH4\\]\\[H2O\\]^2 / (\\[CO2\\]\\[H2\\]^4)"
    answerText: "Kc = [CH4][H2O]^2 / ([CO2][H2]^4)."
    why: "Coefficients become exponents; products are over reactants; equilibrium expressions multiply activities rather than subtracting concentrations."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2) The balanced coefficients become exponents, so H2O must be squared and H2 raised to the fourth power. (3) Products belong in the numerator and reactants in the denominator for the reaction as written. (4) An equilibrium expression multiplies concentration terms; it does not subtract the reactant product from the product product.
    # correct result: First choice.
    # state/output: Unlock ICE board.

  # --- Stop 42: Complete the ICE table
  #     Concept: ICE stoichiometry; Keystone: equilibrium and stoichiometry; Area: Reactor Hall; Learning role: PRACTICE; Difficulty: L3; Story role: clue.
  #     placement: BALANCE, at ice-board.
  - group: EQUIL
    at: ice-board
    title: "Complete the ICE table"
    concept: 12   # ICE stoichiometry
    reason: "The equilibrium relationship is selected and the safe-temperature mixture needs calculating."
    scene: "Use the measured changes in an ICE table to calculate the current equilibrium and the methane-yield ceiling at the safe temperature."
    motivation: "The concentration table establishes the methane ceiling and remaining reactants for the proposed operating condition."
    format: BALLPARK
    question: "Complete changes and equilibrium concentrations, then calculate Kc for this training condition."
    answerText: "The equilibrium row is 1.00, 1.00, 0.50, and 1.00 M, giving Kc = 0.50."
    why: "Every change is tied to one reaction extent x and multiplied by coefficients. Hydrogen changes by -4x; water by +2x. The balanced row is the guardrail against treating each concentration independently."
    # wrong-path feedback, one rebuttal per wrong option:
    #   If H2 falls by 0.60, point to coefficient four. If water becomes 0.60, point to coefficient two.
    # correct result: Change -0.60 CO2, -2.40 H2, +0.60 CH4, +1.20 H2O; equilibrium 0.40, 1.60, 0.60, 1.20 M. Kc=(0.60)(1.20)^2/\[(0.40)(1.60)^4\] = 0.329 (about 0.33).
    # state/output: Model predicts that lowering product-water activity can drive more conversion.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   balance:
    #     target: {label: "ICE table for 1.00 L vessel", reaction: "CO2 + 4H2 <=> CH4 + 2H2O"}
    #     streams:
    #       - {id: co2, label: "CO2", initial_M: 1.00, change_M: -0.60, equilibrium_M: 0.40}
    #       - {id: h2, label: "H2", initial_M: 4.00, change_M: -2.40, equilibrium_M: 1.60}
    #       - {id: ch4, label: "CH4", initial_M: 0.00, change_M: 0.60, equilibrium_M: 0.60}
    #       - {id: h2o, label: "H2O", initial_M: 0.00, change_M: 1.20, equilibrium_M: 1.20}
    #       - {id: catalyst, label: "Solid nickel catalyst", count: false, reason: "not part of the ICE concentration row or Kc expression"}
    #     closure: {Kc: 0.3296, tolerance: 0.01}
    #     correct_action: "Use one extent x with coefficients -1, -4, +1, +2, then calculate Kc."
    estimate:
      prompt: "[CH4][H2O]^2 / ([CO2][H2]^4)"
      question: equilibrium constant Kc
      labels:
        - 1 M  (Equilibrium CO2)
        - 1 M  (Equilibrium H2)
        - 0.5 M  (Equilibrium CH4)
        - 1 M  (Equilibrium H2O)
      values:
        - 1
        - 1
        - 0.5
        - 1
      slots: 4
      template: Kc=({0})({1})^2/[({2})({3})^4]
      formula: Kc=(0.50)(1.00)^2/[(1.00)(1.00)^4]
      correct:
        - 2
        - 0
        - 1
        - 3
      target: 0.5
      tolerance: 0.01
      units: dimensionless
      explanation: Mixing a contextual reading into the arithmetic or reversing the subtraction.
    balance:
      total:
        amount: 100
      streams:
        - id: visible_a
          label: visible inflow
          value: 72
        - id: visible_b
          label: visible outflow
          value: -41
        - id: visible_c
          label: recorded storage change
          value: 24
        - id: hidden_loss
          label: unlogged removal
          value: 45
          hidden: true
      tolerance: 0.5

  # --- Stop 43: Push the balance on purpose
  #     Concept: Le Châtelier/Q vs K; Keystone: equilibrium and reaction quotient; Area: Reactor Hall; Learning role: COMBINE; Difficulty: L3; Story role: experiment.
  #     placement: CONTROL, operated at coldline-tap.
  - group: EQUIL
    at: coldline
    title: "Push the balance on purpose"
    concept: 12   # Le Châtelier/Q vs K
    reason: "The safe-temperature yield is known and product removal is ready for a reversible test."
    scene: "Reversal will show whether the yield gain truly follows product removal."
    motivation: "The response to water removal tests whether shifting equilibrium can improve methane yield without raising temperature."
    format: CONTROL
    # MODEL CONVERSION. The bible offers three candidate changes and a conversion
    # that goes 60 -> 68 under the right one and returns to 60. The engine's
    # CONTROL board takes the candidates, the quantities held fixed, and the
    # signed change in the reading: `response` is 68 - 60, `noise` the bible's
    # noise band, `truth` its `correct`.
    control:
      observable: { label: "Methane conversion", unit: percent }
      variables:
      - { id: water_removal, label: "Remove product water" }
      - { id: inert_n2, label: "Add inert N2 at fixed volume" }
      - { id: pressure_bar, label: "Compress mixture" }
      held: ["Temperature", "Feed composition"]
      truth: water_removal
      baseline: 60
      response: 8
      noise: 1
      run: "Run the measurement"
      commit: "Name the change"
    question: "Use a controlled change to increase methane yield without raising temperature, then reverse it."
    answerText: "Remove product water at fixed temperature, measure the higher conversion, then restore the baseline."
    why: "Removing a product lowers Q below K, so the reaction moves forward until Q=K again. The equilibrium constant at fixed temperature does not change. An inert gas at fixed volume raises total pressure but not component partial pressures."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Adding inert N2 at fixed volume raises total pressure but does not change the reacting gases' partial pressures, so it does not shift this equilibrium. Failing to restore the baseline leaves the controlled change unverified.
    # correct result: Remove product water (preferred) or compress within limit; demonstration expects water removal and reversal.
    # state/output: Cho approves enhanced condensate removal; water_recycle_available = true.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   control:
    #     variables:
    #       - {id: water_removal, label: "Remove product water", baseline: 0, test: 1, unit: state}
    #       - {id: inert_n2, label: "Add inert N2 at fixed volume", baseline: 0, test: 1, unit: state}
    #       - {id: pressure_bar, label: "Compress mixture", baseline: 8, test: 12, unit: bar}
    #     candidates: [water_removal, inert_n2, pressure_bar]
    #     response: {label: "Methane conversion", baseline: 60, water_removal: 68, inert_n2: 60, pressure_bar: 65, after_restore: 60, unit: percent, noise_band: 1}
    #     fixed: {temperature_K: 550, feed_composition: unchanged}
    #     required_sequence: [change_water_removal_only, measure, restore, measure_again]
    #     correct: water_removal

  # --- Stop 44: Two plans look equally fast
  #     Concept: kinetics vs equilibrium; Keystone: gas pressure, kinetics, equilibrium, and energy; Area: Reactor Hall; Learning role: RETRIEVE; Difficulty: L4; Story role: decision.
  #     placement: DEGENERACY, at operating-point-board.
  - group: EQUIL
    at: operating-point-board
    title: "Two plans look equally fast"
    concept: 12   # kinetics vs equilibrium

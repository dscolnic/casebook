    bubbles:
    - who: achebe   # Achebe
      say: "Good thinking. The treated stream now meets the electrolyzer limit. Release it and compare the amount that arrives with the amount the reactor returned."
  - id: after-stop-48
    # After Stop 48 | Electrolysis Hall | automatic deeper reveal
    on: { after: [4] }
    world: "The whole-plant ledger exposes water held or lost before the next shift, making the following hydrogen run short."
    panel: "HYDROGEN DID NOT DISAPPEAR / RECYCLE WATER FAILED TO RETURN ON TIME."
    # unlocks: The Mission 12 outcome beat.
    bubbles:
    - who: cho   # Cho
      say: "Exactly right. Our separator sent too much water away from the return path. The next shift began without the feed it was counting on."
  - id: at-mission-end
    # At mission end | Electrolysis Hall | automatic outcome and hook
    on: { missionEnd: true }
    world: "Cho reroutes recovered product water into the verified treatment-return line; Hydrogen and oxygen projections rise, then a dust-front warning drops available solar power."
    panel: "NEXT ROUTE - SOLAR ARRAY -\\> BATTERY GALLERY -\\> ELECTROLYSIS HALL."
    # unlocks: Mission 13 briefing and the Solar Array waypoint.
    bubbles:
    - who: cho   # Cho
      say: "Outstanding work. You solved the mission. The loop can close now."
    - who: demir   # Demir
      say: "If we can afford to run it. The dust front just cut the power budget."


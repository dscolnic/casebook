  # --- Stop 47: Predict, treat, measure
  #     Concept: strong acid/base stoichiometry and pH; Keystone: solutions and acid-base treatment; Area: Water Plant; Learning role: INTRODUCE; Difficulty: L3; Story role: clue.
  #     placement: VERIFY, operated at brinetank.
  - group: SOIL
    at: brinetank
    title: "Predict, treat, measure"
    concept: "strong acid/base stoichiometry and pH"
    reason: "The electrolyzer needs measured proof that neutralization reached its target."
    scene: "Predict and verify the treated water's pH to prove that it meets the electrolyzer's operating limit. A numerical prediction followed by an independent measurement will fully qualify the treatment controller."
    motivation: "Correct neutralization lets recycled water return without damaging the electrolyzer."
    format: VERIFY
    # MODEL CONVERSION, the same one mission 3's VERIFY needed. The bible gives a
    # calculated prediction (pH 3.28, tolerance 0.05) and a measured 3.30; the
    # engine has the player DIAL a prediction and then compares it with the
    # measurement. `truth` is the bible's measured 3.30 and `passRatio` is its
    # ±0.05 said as a ratio. The dial range is the implementation's.
    verify:
      prediction:
        label: "Predicted pH after the addition"
        unit: pH
        min: 2.00
        max: 5.00
        step: 0.01
      truth: 3.30
      passRatio: [0.985, 1.015]
      intervention:
        label: "Add 90.0 mL of 0.0100 M NaOH"
        note: "100.0 mL of 0.0100 M HCl in the tank; total volume 190.0 mL."
        outcome: "Added and mixed."
      measurement:
        label: "pH meter reading"
        note: "Resolution 0.02 pH units."
    question: "Predict final pH, command addition, then measure."
    answerText: "After neutralization, predict pH 3.28 and accept the measured pH 3.30."
    why: "Neutralization is a mole subtraction before a concentration or logarithm calculation. Equal molarities do not neutralize if volumes differ. The measurement agrees within instrument resolution."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Averaging pH values is invalid; pH is logarithmic. Failing to measure after prediction does not complete VERIFY.
    # correct result: initial H+ 0.00100 mol; OH- 0.000900 mol; excess H+ 0.000100 mol; total volume 0.1900 L; \[H+\]=5.26e-4 M; pH=3.28. Measured pH 3.30.
    # state/output: Treatment controller is calibrated; recycled water accepted.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   verify:
    #     prediction:
    #       data: {hcl_volume_mL: 100.0, hcl_M: 0.0100, naoh_volume_mL: 90.0, naoh_M: 0.0100, total_volume_mL: 190.0}
    #       calculation: "0.00100 mol H+ - 0.000900 mol OH- = 0.000100 mol H+; [H+] = 5.26e-4 M"
    #       correct_pH: 3.28
    #       tolerance: 0.05
    #     action: {id: add_naoh, label: "Add 90.0 mL of 0.0100 M NaOH"}
    #     measurement: {pH: 3.30, resolution: 0.02}
    #     required_sequence: [commit_prediction, add_naoh, measure_pH]
    #     truth: "Prediction and measurement agree within instrument resolution."

  # --- Stop 48: Close hydrogen over the whole plant
  #     Concept: whole-system inventory; Keystone: balancing and coupled systems; Area: Electrolysis Hall; Learning role: TRANSFER; Difficulty: L4; Story role: reveal.
  #     placement: BALANCE, at stack-accounting-panel.
  - group: ELEC
    at: stack
    title: "Close hydrogen over the whole plant"
    concept: "whole-system inventory"
    reason: "A whole-plant balance can expose a deficit hidden between separate rooms."
    scene: "With clean water flowing, total hydrogen across the entire plant to identify the missing return and close the recycling loop. The result will convert missing return water into next-shift hydrogen loss."
    motivation: "The whole-plant boundary can reveal a recycle failure that looks like disappearing hydrogen inside one room."
    format: BALANCE
    # MODEL CONVERSION. The bible's ledger has two sides; the engine's has a total
    # and the streams that have to add up to it. The total is the bible's
    # `closure.available`, 420 kmol H2, the measured uses are its `use` streams,
    # and its `closure.reserve` of 50 is the hidden term — what the ledger is
    # short by until the reserve is counted. The oxygen coproduct stays on the
    # board and off the sum, which is the boundary error the bible names. ONE
    # NUMBER IS NOT THE BIBLE'S: it writes `tolerance: 0`, and the engine needs a
    # positive tolerance, so the closure is graded to half a kilomole.
    balance:
      total: { amount: 420, unit: "kmol H2", label: "Hydrogen available this shift" }
      tolerance: 0.5
      streams:
      - { id: reactor_use, label: "Reactor consumption", value: 360, unit: "kmol H2" }
      - { id: vents, label: "Measured vents", value: 4, unit: "kmol H2" }
      - { id: line_fill, label: "Increase in line inventory", value: 6, unit: "kmol H2" }
      - { id: oxygen_coproduct, label: "Electrolysis oxygen coproduct", value: 200, unit: "kmol O2", countable: false }
      - { id: reserve, label: "Left in reserve", value: 50, unit: "kmol H2", hidden: true }
      commit: "Close the hydrogen ledger"
    question: "Reconcile produced hydrogen and inventory, then identify why next-shift production falls."
    answerText: "The current ledger closes with 50 kmol H2; missing 80 kmol return water causes an 80 kmol next-shift H2 deficit."
    why: "The \"missing hydrogen\" is a timing and boundary error. Each room closes locally while the return stream fails between shifts. Expand the system boundary and include storage/recycle."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Treating the 80 kmol next-shift deficit as a current unmeasured H2 leak ignores the current ledger, which closes with 50 kmol in reserve. Counting oxygen or another non-hydrogen coproduct in the H2 ledger also crosses the system boundary incorrectly.
    # correct result: Current H2 ledger: available 400 + 20 withdrawn = 420; uses 360 + 4 + 6 = 370, leaving 50 kmol in reserve. No large unmeasured H2 loss exists. The scheduled next run is short because 80 kmol H2O failed to return; the 1:1 H2O:H2 electrolysis ratio makes that an 80 kmol H2 production deficit.
    # state/output: Set twist_1_deepened = true; water_recycle_restored = true; raise projected H2 output.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.

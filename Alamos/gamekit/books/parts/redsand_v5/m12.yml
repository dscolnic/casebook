- title: "The Loop"
  card:
    header: "4 SHIFTS UNTIL THE LAUNCH WINDOW CLOSES"
    title: "THE LOOP"
    goNow: "Go to the Ice Cut and meet Mei-Ling Cho, the water and cryogenics engineer, beside the raw-brine sampler."
    body: "The safer reactor plan depends on recycled water returning to equipment that splits it into hydrogen and oxygen using electricity. Less water is returning than expected. Follow it through treatment and production, then find the missing return and calculate the hydrogen lost next shift."
    objective: "Find the failed recycling step and restore the whole-plant hydrogen balance."
  objective: "Find the failed recycling step and restore the whole-plant hydrogen balance."
  stake: "The safer reactor plan depends on recycled water returning to equipment that splits it into hydrogen and oxygen using electricity. Less water is returning than expected. Follow it through treatment and production, then find the missing return and calculate the hydrogen lost next shift."
  takeaway: "System boundaries and storage timing can create apparent missing material."
  segue: "Mission decision: The next shift is short because 80 kmol of water did not return to the power cell. The full-plant hydrogen count now closes. Water treatment fixes the return line. The plant can make both gases again. It still needs enough power for every key load."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Electrolysis", def: "uses electrical energy to drive a chemical change that would not proceed on its own. Here it splits treated water into hydrogen and oxygen."}
  - {name: "Acid", def: "increases hydrogen-ion concentration when placed in water. Excess acid must be measured and neutralized before water enters the electrolyzer."}
  - {name: "Base", def: "accepts hydrogen ions or increases hydroxide-ion concentration in water. The treatment system uses a measured base amount to neutralize excess acid."}
  - {name: "pH", def: "a logarithmic measure related to hydrogen-ion concentration. A smaller pH means a larger hydrogen-ion concentration."}
  equations:
  - {"e":"moles of dissolved substance = molarity x volume in liters","c":"turning a solution concentration and volume into a reacting amount","v":[["molarity","moles per liter"],["volume","the solution volume in liters"]],"s":"The treatment controller must add enough base to remove the measured acid without wasting purification capacity."}
  - {"e":"pH = -log10[H+]","c":"predicting acidity after neutralization","v":[["[H+]","the hydrogen-ion concentration in moles per liter"],["log10","the base-ten logarithm"]],"s":"The predicted pH gives the electrolyzer a testable acceptance value before treated water is released."}
  - {"e":"N_end=N_start+N_made+N_returned-N_used-N_sent","c":"closing a whole-plant material balance","v":[["N_end","ending amount"],["N_start","starting amount"],["N_made","amount produced"],["N_returned","amount recovered"],["N_used","amount consumed"],["N_sent","amount transferred away. All terms use the same substance"]],"s":"Missing return water becomes a calculable next-shift hydrogen deficit only when the entire plant is counted together."}
  primer:
  - "Follow material through the whole loop instead of balancing each room in isolation."
  - "Treatment order matters: remove solids, remove unwanted dissolved ions, then neutralize measured excess acid."
  - "Predict a treatment result before measuring it; agreement verifies both the calculation and the controller."


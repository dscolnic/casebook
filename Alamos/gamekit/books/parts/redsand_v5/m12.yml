  # --- Stop 46: Match contaminants to treatment
  #     Concept: solutions/solubility; Keystone: solutions and acid-base treatment; Area: Water Plant; Learning role: RETRIEVE; Difficulty: L3; Story role: experiment.
  #     placement: PROTOCOL, at columns.
  - group: SOIL
    at: columns
    title: "Match contaminants to treatment"
    concept: "solutions/solubility"
    reason: "Returned water must be treated without wasting limited purification capacity."
    scene: "At the Water Plant, match each contaminant to a treatment so the return stream reaches electrolysis without wasting limited cleaning capacity. Each match must protect electrolysis while leaving useful reactor feed alone."
    motivation: "The wrong treatment can leave ions that damage electrolysis or spend the column on material the reactor already wants."
    format: PROTOCOL
    question: "Match each water contaminant to the treatment that addresses it."
    # CONVERTED from the payload below: the bible's contaminants on the left, its
    # treatments on the right, its keyed `mapping` as the permutation.
    scenarios:
    - "Suspended regolith fines"
    - "Dissolved chloride and perchlorate ions"
    - "Acidic recycle water with excess H+"
    - "Dissolved CO2 intended for reactor feed"
    choices:
    - "Particle filter"
    - "Ion-exchange column"
    - "Measured base neutralization"
    - "Do not spend polishing capacity solely on it"
    mapping: [0, 1, 2, 3]
    answerText: "Filter solids, exchange dissolved ions, neutralize excess acid, and do not waste polishing capacity on useful CO2 feed."
    why: "Physical filters catch particles, not dissolved ions. Ion exchange targets charged solutes. Acid/base treatment is stoichiometric. Removing every measurable species is not automatically useful; treatment follows downstream consequence."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Distinguish suspension from solution; dissolved ions pass a simple particle filter.
    # correct result: Map suspended regolith to the particle filter, dissolved ions to ion exchange, excess acid to measured base neutralization, and useful dissolved CO2 to retention.
    # state/output: Prepare neutralization test.

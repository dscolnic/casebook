    examples:
    - {"title":"Calculate pH","problem":"An ideal dilute solution has [H₃O⁺]=10⁻³ mol/L. Find pH.","rule":"pH=-log₁₀([H₃O⁺]/1 mol/L).","steps":["Set up the relationship: pH=-log₁₀([H₃O⁺]/1 mol/L).","pH=-log₁₀(10⁻³)=3."],"answer":"The pH is 3.","mistake":"The negative sign makes this pH positive."}
    - {"title":"Find neutralization volume","problem":"Neutralize 20 mL of 0.1 M HCl with 0.2 M NaOH. Assume complete 1:1 reaction.","rule":"c_acid V_acid=c_base V_base at equivalence.","steps":["Set up the relationship: c_acid V_acid=c_base V_base at equivalence.","V_base=0.1(20)/0.2=10 mL."],"answer":"The equivalence volume is 10 mL.","mistake":"The volumes need not match when concentrations differ."}
    - {"title":"Find excess strong acid","problem":"Mix 20 mL of 0.1 M HCl with 10 mL of 0.1 M NaOH. Assume additive volumes. Find excess H⁺ concentration.","rule":"Subtract reacting moles, then divide excess amount by total solution volume.","steps":["Set up the relationship: Subtract reacting moles, then divide excess amount by total solution volume.","n_excess=0.002-0.001=0.001 mol; [H⁺]=0.001/0.030=1/30 M."],"answer":"The excess acid concentration is approximately 0.033 M.","mistake":"Divide by the full 30 mL, not just the acid volume."}
    - {"title":"Balance a reaction","problem":"Balance H₂ + O₂ → H₂O without changing chemical formulas.","rule":"Coefficients conserve each element; subscripts identify substances.","steps":["Place 2 before H₂O so the product has two oxygen atoms.","Place 2 before H₂ to supply four hydrogen atoms: 2H₂ + O₂ → 2H₂O."],"answer":"Both sides contain four hydrogen atoms and two oxygen atoms.","mistake":"Changing H₂O to H₂O₂ would change the product."}
    - {"title":"Calculate molarity","problem":"Dissolve 0.2 mol solute to make 0.5 L of solution.","rule":"c=n/V, using solution volume in liters.","steps":["Set up the relationship: c=n/V, using solution volume in liters.","c=0.2/0.5=0.4 mol/L."],"answer":"The concentration is 0.4 M, where M means mol/L.","mistake":"Use final solution volume, not an assumed volume of solvent."}

  stops:
  # --- Stop 45: Build the water-hydrogen-carbon loop
  #     Concept: coupled stoichiometry; Keystone: balancing and coupled systems; Area: Electrolysis Hall; Learning role: INTRODUCE; Difficulty: L3; Story role: obstacle.
  #     placement: CHAIN, operated at process-map.
  - group: ELEC
    at: process-map
    title: "Build the water-hydrogen-carbon loop"
    concept: 13   # coupled stoichiometry
    reason: "The recovery condition is selected and the complete water-hydrogen loop needs checking for its energy input."
    scene: "Trace water from Martian ice through cleanup, electrolysis, the reactor, and return to locate every link that must close before hydrogen can be replenished."
    motivation: "The loop identifies electrolysis as a driven step, preventing recycled water from being mistaken for free hydrogen production."
    format: CHAIN
    # CONVERTED from the payload below. `transfers` -> `links`, `carries` ->
    # `transfers`, `order` unchanged, and the governing link is the bible's own
    # driven one, electrolysis. The bible's two `decoys` are NOT on the board:
    # each is an id and a label with no `carries`, and every link the rail prints
    # has to say what it carries. `distractor` is the reactor — the large obvious
    # member named instead of the powered link — which the bible's own rebuttal
    # describes as the loop being "mistaken for an energy-free cycle".
    chain:
      links:
        - id: mine
          label: Ice and brine to Water Plant
        - id: clean
          label: Treatment to clean-water tank
        - id: split
          label: Electrolysis
        - id: react
          label: Sabatier reactor
        - id: return
          label: Condenser return
      order:
        - mine
        - clean
        - split
        - react
        - return
    question: "Build the closed material path and name the link that requires external energy."
    answerText: "Build ice/brine to clean water to electrolysis to Sabatier water return; electrolysis is the powered link."
    why: "Sabatier returns water, but electrolysis must spend electrical energy to split it. Recycle reduces fresh-water demand; it does not make the cycle energy-free."

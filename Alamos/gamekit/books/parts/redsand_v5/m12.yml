- title: "The Loop"
  card:
    header: "4 SHIFTS UNTIL THE LAUNCH WINDOW CLOSES"
    title: "THE LOOP"
    goNow: "Go to the Ice Cut and meet Mei-Ling Cho, the water and cryogenics engineer, beside the raw-brine sampler."
    body: "The safer reactor plan works only if recycled water returns to electrolysis, where electricity splits it into hydrogen and oxygen. Current records suggest that this loop is not closing. Follow water from the Ice Cut through treatment and electrolysis, then balance hydrogen across the whole plant. By the end of the mission, decide where the return loop fails and how much hydrogen that failure removes from the next shift."
    objective: "Find the failed recycling step and restore the whole-plant hydrogen balance."
  objective: "Find the failed recycling step and restore the whole-plant hydrogen balance."
  stake: "The safer reactor plan works only if recycled water returns to electrolysis, where electricity splits it into hydrogen and oxygen. Current records suggest that this loop is not closing. Follow water from the Ice Cut through treatment and electrolysis, then balance hydrogen across the whole plant. By the end of the mission, decide where the return loop fails and how much hydrogen that failure removes from the next shift."
  takeaway: "System boundaries and storage timing can create apparent missing material."
  segue: "Mission decision: The next shift is short because 80 kmol of water did not return to the power cell. The full-plant hydrogen count now closes. Water treatment fixes the return line. The plant can make both gases again. It still needs enough power for every key load."
  # The mission card's own "Primer concepts", printed on the plan card.
  primer:
  - "Follow material through the whole loop instead of balancing each room in isolation."
  - "Treatment order matters: remove solids, remove unwanted dissolved ions, then neutralize measured excess acid."
  - "Predict a treatment result before measuring it; agreement verifies both the calculation and the controller."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-ice-cut
    # On arrival at Ice Cut | automatic | 
    on: { enter: true, at: CUT }
    world: "The player stands beside the raw-brine intake while a whole-plant map leaves the recycle return line dark."
    panel: "MISSION 12 - THE LOOP"
    # unlocks: Stop 45 at the Ice Cut loop board.
    bubbles:
    - who: cho   # Cho
      say: "Ice becomes water, water becomes hydrogen, hydrogen becomes methane, and the reactor makes water again. Follow every transfer until the loop closes."
  - id: after-stop-45
    # After Stop 45 | Ice Cut chain board | automatic response
    on: { after: [1] }
    world: "The material chain locks, and ELECTROLYSIS receives an EXTERNAL ENERGY marker."
    panel: "MOVE TO WATER PLANT."
    # unlocks: The Water Plant waypoint and Stop 46; Stop 47 unlocks immediately after Stop 46.
    bubbles:
    - who: demir   # Demir
      say: "The water can cycle. The energy cannot. First make sure the water reaching electrolysis is fit to use."
  - id: after-stops-46-and-47
    # After Stops 46 and 47 | Water Plant | automatic treatment verification
    on: { after: [2, 3] }
    world: "The selected treatments remove particles and harmful dissolved ions; the commanded neutralization dose lands inside the predicted pH band."
    panel: "NEXT TASK - STOP 48: CLOSE HYDROGEN OVER THE WHOLE PLANT"
    # unlocks: The Electrolysis Hall waypoint and Stop 48.
    bubbles:
    - who: achebe   # Achebe
      say: "The treated stream now meets the electrolyzer limit. Release it and compare the amount that arrives with the amount the reactor returned."
  - id: after-stop-48
    # After Stop 48 | Electrolysis Hall | automatic deeper reveal
    on: { after: [4] }
    world: "The whole-plant ledger exposes water held or lost before the next shift, making the following hydrogen run short."
    panel: "HYDROGEN DID NOT DISAPPEAR / RECYCLE WATER FAILED TO RETURN ON TIME."
    # unlocks: The Mission 12 outcome beat.
    bubbles:
    - who: cho   # Cho
      say: "Our separator sent too much water away from the return path. The next shift began without the feed it was counting on."
  - id: at-mission-end
    # At mission end | Electrolysis Hall | automatic outcome and hook
    on: { missionEnd: true }
    world: "Cho reroutes recovered product water into the verified treatment-return line; Hydrogen and oxygen projections rise, then a dust-front warning drops available solar power."
    panel: "NEXT ROUTE - SOLAR ARRAY -\\> BATTERY GALLERY -\\> ELECTROLYSIS HALL."
    # unlocks: Mission 13 briefing and the Solar Array waypoint.
    bubbles:
    - who: cho   # Cho
      say: "The loop can close now."
    - who: demir   # Demir
      say: "If we can afford to run it. The dust front just cut the power budget."

  stops:
  # --- Stop 45: Build the water-hydrogen-carbon loop
  #     Concept: coupled stoichiometry; Keystone: balancing and coupled systems; Area: Electrolysis Hall; Learning role: INTRODUCE; Difficulty: L3; Story role: obstacle.
  #     placement: CHAIN, operated at process-map.
  - group: ELEC
    at: process-map
    title: "Build the water-hydrogen-carbon loop"
    concept: "coupled stoichiometry"
    reason: "The hydrogen shortage cannot be solved without tracing the entire water loop."
    scene: "Trace water from Martian ice through cleanup, electrolysis, the reactor, and return to locate every link that must close before hydrogen can be replenished. The completed chain will reveal the step that consumes outside energy."
    motivation: "The chain reveals which link must spend power and where water should return to keep launch production alive."
    format: CHAIN
    # CONVERTED from the payload below. `transfers` -> `links`, `carries` ->
    # `transfers`, `order` unchanged, and the governing link is the bible's own
    # driven one, electrolysis. The bible's two `decoys` are NOT on the board:
    # each is an id and a label with no `carries`, and every link the rail prints
    # has to say what it carries. `distractor` is the reactor — the large obvious
    # member named instead of the powered link — which the bible's own rebuttal
    # describes as the loop being "mistaken for an energy-free cycle".
    chain:
      links:
      - { id: mine, label: "Ice and brine to Water Plant", transfers: "H2O plus dissolved material" }
      - { id: clean, label: "Treatment to clean-water tank", transfers: "purified H2O" }
      - { id: split, label: "Electrolysis", transfers: "2H2O -> 2H2 + O2; electrical energy enters" }
      - { id: react, label: "Sabatier reactor", transfers: "CO2 + 4H2 -> CH4 + 2H2O" }
      - { id: return, label: "Condenser return", transfers: "product H2O to recycle tank" }
      order: [mine, clean, split, react, return]
      governing: split
      distractor: react
      commit: "Name the governing transfer"
    question: "Build the closed material path and name the link that requires external energy."
    answerText: "Build ice/brine to clean water to electrolysis to Sabatier water return; electrolysis is the powered link."
    why: "Sabatier returns water, but electrolysis must spend electrical energy to split it. Recycle reduces fresh-water demand; it does not make the cycle energy-free."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A direct ice-to-methane path skips water treatment and electrolysis, while an oxygen-to-hydrogen path violates the authored reactions. If electrolysis is not identified as the powered link, the material loop is mistaken for an energy-free cycle.
    # correct result: Correct order; electrolysis is the driven link.
    # state/output: Illuminate the site route; add loop_map_complete.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.

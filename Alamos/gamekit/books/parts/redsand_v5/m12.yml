  # --- Stop 47: Predict, treat, measure
  #     Concept: strong acid/base stoichiometry and pH; Keystone: solutions and acid-base treatment; Area: Water Plant; Learning role: INTRODUCE; Difficulty: L3; Story role: clue.
  #     placement: VERIFY, operated at brinetank.
  - group: SOIL
    at: brinetank
    title: "Predict, treat, measure"
    concept: 13   # strong acid/base stoichiometry and pH
    reason: "The treatment method is selected and must demonstrate the required water acidity numerically."
    scene: "The treatment vessel contains 0.1000 L of 0.0100 M strong acid, and the planned addition is 0.0900 L of 0.0100 M strong base. Assume complete neutralization and additive volumes; pH = -log10([H+]), with [H+] in mol/L."
    motivation: "Predicted and measured pH determine whether the treated sample meets the electrolyzer's stated operating condition."
    format: VERIFY
    # MODEL CONVERSION, the same one mission 3's VERIFY needed. The bible gives a
    # calculated prediction (pH 3.28, tolerance 0.05) and a measured 3.30; the
    # engine has the player DIAL a prediction and then compares it with the
    # measurement. `truth` is the bible's measured 3.30 and `passRatio` is its
    # ±0.05 said as a ratio. The dial range is the implementation's.
    verify:
      prediction:
        min: NaN
        max: NaN
        step: NaN
      action:
        id: add_naoh
        label: Add 90.0 mL of 0.0100 M NaOH
      measurement:
        label: the measurement
        cost: 1
      required_sequence:
        - commit_prediction
        - add_naoh
        - measure_pH
      truth: NaN
      passRatio:
        - 0.9
        - 1.1
    question: "Predict final pH, command addition, then measure."
    answerText: "After neutralization, predict pH 3.28 and accept the measured pH 3.30."
    why: "Neutralization is a mole subtraction before a concentration or logarithm calculation. Equal molarities do not neutralize if volumes differ. The measurement agrees within instrument resolution."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Averaging pH values is invalid; pH is logarithmic. Failing to measure after prediction does not complete VERIFY.
    # correct result: initial H+ 0.00100 mol; OH- 0.000900 mol; excess H+ 0.000100 mol; total volume 0.1900 L; \[H+\]=5.26e-4 M; pH=3.28. Measured pH 3.30.
    # state/output: Treatment controller is calibrated; recycled water accepted.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   verify:
    #     prediction:
    #       data: {hcl_volume_mL: 100.0, hcl_M: 0.0100, naoh_volume_mL: 90.0, naoh_M: 0.0100, total_volume_mL: 190.0}

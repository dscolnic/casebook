  # --- Stop 12: Test the simple-leak prediction
  #     Concept: combined gas law/model testing; Keystone: gas behavior and partial pressure; Area: Reactor Hall; Learning role: COMBINE; Difficulty: L3; Story role: reversal.
  #     placement: VERIFY, operated at jacket-heater-logger.
  - group: EQUIL
    at: jacket-heater-logger
    title: "Test the simple-leak prediction"
    concept: 4   # combined gas law/model testing
    reason: "The abnormal composition needs comparison with the response predicted by a simple leak model."
    scene: "A sealed, fixed-volume branch sample starts at P1 = 21 atm and T1 = 300 K and is warmed to T2 = 330 K. For unchanged gas amount with no reaction, P2/P1 = T2/T1; composition is measured separately."
    motivation: "The pressure-temperature test shows whether a normal pressure response is enough to explain away the mixture evidence."
    format: VERIFY
    question: "Predict the final pressure in atm, then compare the measured pressure and composition with the no-reaction model."
    # MODEL CONVERSION. The bible gives one correct prediction (21.45 atm, tolerance
    # 0.25) and a measured 21.4; this engine's VERIFY has the player DIAL a
    # prediction on a range and then compares it with what the measurement finds.
    #   · `truth` is the bible's measured value, 21.4 atm
    #   · the range brackets it widely enough that not every dial position passes
    #   · `passRatio` is the bible's ±0.25 atm on 21.4, said as a ratio
    # The dial range itself is the implementation's; the bible states a point.
    verify:
      prediction:
        label: "Pressure at 330 K"
        unit: atm
        min: 18.0
        max: 24.0
        step: 0.05
      truth: 21.4
      passRatio: [0.97, 1.03]
      intervention:
        label: "Warm sealed branch, 300 K to 330 K"
        note: "Sealed, fixed volume, no reaction assumed."
        outcome: "Warmed and held. Logger settled."
      measurement:
        label: "Branch pressure and composition after warming"
    answerText: "Pressure follows the gas-law prediction, but nitrogen in the mixture defeats the simple-leak explanation."
    why: "Warming a sealed gas tests whether the total particle count behaves normally. It does, so the gauge and volume are credible. Composition is a separate measurement. A leak can lower particle count, but it does not by itself explain nitrogen appearing downstream of a 95% H2 regulator outlet."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Measuring without a prediction should not count. Calling the leak model confirmed from pressure alone ignores the second observable.
    # data: P2 = P1(T2/T1) = 21.45 atm; acceptable 21.2-21.7 atm.
    # correct result: The gas-law pressure response is normal, but the simple leak explanation fails on composition; the branch contains a substituted mixture.
    # state/output: Set evidence_flags.simple_leak_fails = true; Casebook adds NORMAL PRESSURE, WRONG GAS.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.

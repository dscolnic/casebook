- title: "Pressure Does Not Lie. Or Does It?"
  card:
    header: "13 SHIFTS UNTIL THE LAUNCH WINDOW CLOSES"
    title: "PRESSURE DOES NOT TELL THE WHOLE TRUTH"
    goNow: "Go to the Hydrogen Store and meet Dr. Tomás Herrera, the reactor and safety engineer, beside the storage gauge."
    body: "The plant may be short of hydrogen even though its pressure gauge looks normal. Another gas could be keeping the pressure high. Measure the total gas, sample the pipes, and test a warmed sample to decide whether hydrogen escaped or was replaced before reaching the reactor."
    objective: "Find where usable hydrogen is lost even though the main pressure gauge looks normal."
  objective: "Find where usable hydrogen is lost even though the main pressure gauge looks normal."
  stake: "The plant may be short of hydrogen even though its pressure gauge looks normal. Another gas could be keeping the pressure high. Measure the total gas, sample the pipes, and test a warmed sample to decide whether hydrogen escaped or was replaced before reaching the reactor."
  takeaway: "A model must survive every relevant measurement, not only the one it predicts correctly."
  segue: "Mission decision: Another gas mixes into the line before the reactor. The plant is not just losing hydrogen. Nitrogen keeps total pressure high as the share from hydrogen falls. The change starts after the regulator. The blue stain near a methane valve is the next clue to test."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Pressure", def: "force spread over an area, caused here by gas particles striking the tank walls. Total pressure can stay high even when the wrong gas is inside."}
  - {name: "Volume", def: "the amount of space occupied by the gas. A sealed tank gives the gas a fixed space unless the hardware changes."}
  - {name: "Kinetic energy", def: "energy an object has because it moves. At the same temperature, different gases have the same average kinetic energy even though lighter particles move faster."}
  - {name: "Partial pressure", def: "one gas's share of the total pressure. It measures how much that gas contributes even when the gauge shows only the total."}
  equations:
  - {"e":"pressure times volume, P V = nRT","c":"finding the total amount of gas from pressure, volume, and temperature","v":[["P","pressure"],["V","volume"],["n","moles of gas"],["R","the gas constant"],["T","absolute temperature in kelvin"]],"s":"The storage gauge can reveal the total gas amount but cannot prove how much of that gas is usable hydrogen."}
  - {"e":"component pressure = mole fraction x total pressure","c":"finding one gas's pressure inside a mixture","v":[["component pressure","the partial pressure"],["mole fraction","that gas's share"],["total pressure","the gauge reading"]],"s":"Hydrogen can fall below the reactor's need while nitrogen keeps the total-pressure gauge looking normal."}
  - {"e":"P2 = P1 x (T2 / T1), for fixed gas amount and volume","c":"predicting how a sealed gas responds to warming","v":[["P1 and P2","the starting and final pressures"],["T1 and T2","the starting and final temperatures in kelvin"]],"s":"A committed warming prediction tests the pressure model while the composition reading tests the simple-leak story."}
  primer:
  - "A gauge measures total pressure, not chemical identity."
  - "At fixed volume, warming a sealed gas raises its pressure in proportion to absolute temperature."
  - "A model must predict a new measurement before the measurement is made."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-hydrogen-store
    # On arrival at Hydrogen Store | automatic | 
    on: { enter: true, at: HSTORE }
    world: "A large gauge holds near its green mark while the reactor-delivery bar flashes LOW."
    panel: "MISSION 3 - PRESSURE DOES NOT LIE. OR DOES IT?"
    # unlocks: Stop 9 at the tank calculation rail; Stop 10 unlocks immediately after Stop 9.
    bubbles:
    - who: herrera   # Herrera
      say: "The gauge measures everything pushing on the tank wall. It does not know which gas is doing the pushing. Before anyone clears this system, prove how much of that pressure belongs to hydrogen."
  - id: after-stops-9-and-10
    # After Stops 9 and 10 | tank calculation rail | automatic response
    on: { after: [1, 2] }
    world: "On the equipment panel, hydrogen particle icons move faster than nitrogen particle icons at equal temperature; the total-mole estimate appears beside the pressure gauge."
    panel: "NEXT TASK - STOP 11: SAMPLE THE BRANCHES"
    # unlocks: Stop 11 at the four sampling ports.
    bubbles:
    - who: herrera   # Herrera
      say: "Nice work. The total amount is plausible. That still does not make it usable hydrogen. Sample the line from the tank to the reactor."
  - id: after-stop-11
    # After Stop 11 | four sampling ports | automatic discovery
    on: { after: [3] }
    world: "The tank and regulator remain hydrogen-rich, but the reactor branch turns yellow as nitrogen mole fraction rises."
    panel: "TOTAL PRESSURE: NORMAL / H2 PARTIAL PRESSURE: LOW / N2 DETECTED AFTER PURGE TIE-IN."
    # unlocks: Stop 12 at the heated test branch.
    bubbles:
    - who: herrera   # Herrera
      say: "Good thinking. There. The gauge did not lie. We asked it the wrong question."
  - id: after-stop-12
    # After Stop 12 | heated test branch | automatic contradiction
    on: { after: [4] }
    world: "Measured pressure follows the warming prediction, but the composition panel shows new nitrogen that a simple leak cannot create."
    panel: "MISSION DECISION READY"
    # unlocks: The Mission 3 outcome beat.
    bubbles:
    - who: herrera   # Herrera
      say: "Exactly right. A leak can remove gas. It cannot add nitrogen to a sealed branch. The simple-leak model fails."
  - id: at-mission-end
    # At mission end | Hydrogen Store | automatic outcome and hook
    on: { missionEnd: true }
    world: "The purge tie-in is tagged for investigation; Sundqvist sends an image of blue residue beside a methane valve."
    panel: "NEXT DESTINATION - CATALYST BAY."
    # unlocks: Mission 4 briefing and the Catalyst Bay waypoint.
    bubbles:
    - who: sundqvist   # Sundqvist
      say: "Outstanding work. You solved the mission. Maintenance found this on the methane side. If the systems crossed, the residue may show where."
    - who: herrera   # Herrera
      say: "Only if that substance could travel the path you claim."


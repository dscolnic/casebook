    title: "Mission 3: worked examples"
    examples:
    - {"title":"Find ideal-gas volume","problem":"An ideal gas has n=1 mol, T=300 K and P=3 atm. Use rounded R=0.08 L atm/(mol K).","rule":"PV=nRT.","steps":["Set up the relationship: PV=nRT.","V=nRT/P=1(0.08)(300)/3=8 L."],"answer":"The volume is 8 L with the supplied rounded constant.","mistake":"Use absolute temperature in kelvins."}
    - {"title":"Warm a fixed-volume gas","problem":"A sealed ideal-gas sample has pressure 20 atm at 300 K. Find its pressure at 330 K if no reaction occurs.","rule":"At fixed amount and volume, P₂/P₁=T₂/T₁.","steps":["Set up the relationship: At fixed amount and volume, P₂/P₁=T₂/T₁.","P₂=20(330/300)=22 atm."],"answer":"The predicted pressure is 22 atm.","mistake":"Adding 30 to the pressure confuses temperature change with pressure change."}
    - {"title":"Find a partial pressure","problem":"An ideal-gas mixture is 25% helium by mole and has total pressure 8 atm.","rule":"P_He=x_He P_total.","steps":["Set up the relationship: P_He=x_He P_total.","P_He=0.25(8)=2 atm."],"answer":"Helium contributes 2 atm.","mistake":"Use mole fraction, not mass fraction."}
    - {"title":"Compare energy and speed","problem":"Helium and neon gases have the same temperature. Neon atoms have about five times the mass. Compare average translational kinetic energy and typical speed.","rule":"Mean translational kinetic energy depends on absolute temperature; root-mean-square speed is proportional to 1/√m.","steps":["The two gases have equal mean translational kinetic energy.","speed_He/speed_Ne=√5, so helium atoms move faster on this measure."],"answer":"Equal temperature means equal mean kinetic energy, not equal speed.","mistake":"Heavier particles need a lower speed to have the same kinetic energy."}
    - {"title":"Add partial pressures","problem":"An ideal mixture has partial pressures 2 atm, 3 atm and 1 atm. Find total pressure.","rule":"P_total=ΣP_i.","steps":["Set up the relationship: P_total=ΣP_i.","P_total=2+3+1=6 atm."],"answer":"The total pressure is 6 atm.","mistake":"Do not average the partial pressures."}

  stops:
  # --- Stop 9: Same temperature, different speed
  #     Concept: kinetic molecular theory; Keystone: gas behavior and partial pressure; Area: Reactor Hall; Learning role: INTRODUCE; Difficulty: L1; Story role: character.
  #     placement: CHOICE, asked at Dr. Tomás Herrera beside store-scales.
  - group: EQUIL
    at: store-scales
    title: "Same temperature, different speed"
    person: herrera
    concept: 4   # kinetic molecular theory
    reason: "A normal pressure reading is being used to dismiss a possible gas-composition problem."
    scene: "Before trusting the full-pressure gauge, determine what equal temperature reveals about hydrogen and nitrogen and what it cannot reveal about gas identity."
    motivation: "The speed and kinetic-energy distinction explains why hydrogen transport can differ even when gases share a temperature."
    format: CHOICE
    question: "Which statement is correct?"
    choices:
    - "They have the same average kinetic energy, but H2 has the greater average speed."
    - "H2 has less kinetic energy and the same average speed as N2."
    - "H2 has more kinetic energy because it moves faster."
    - "N2 has more kinetic energy because each molecule is heavier."
    answer: "They have the same average kinetic energy, but H2 has the greater average speed."
    answerText: "At one temperature, gases share average kinetic energy, while lighter hydrogen molecules move faster."
    why: "Average kinetic energy depends only on absolute temperature. Since KE = 1/2 mv^2, a lighter particle must have a greater characteristic speed to share the same average kinetic energy as a heavier one."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2) Equal temperature gives the same average kinetic energy, not less kinetic energy for H2; lighter H2 must move faster than N2. (3) Faster motion does not mean greater average kinetic energy when the moving particle has less mass. (4) Greater molecular mass does not give N2 greater average kinetic energy at the same temperature.
    # correct result: Choice 1.
    # state/output: Herrera reveals the branch could be contaminated by nitrogen purge gas.

  # --- Stop 10: How many total moles are in the branch?
  #     Concept: ideal gas law; Keystone: gas behavior and partial pressure; Area: Reactor Hall; Learning role: INTRODUCE; Difficulty: L2; Story role: clue.
  #     placement: BALLPARK, at hydrogen-calculation-desk.
  - group: EQUIL
    at: hydrogen-calculation-desk
    title: "How many total moles are in the branch?"
    concept: 4   # ideal gas law
    reason: "The pressure reading cannot establish composition, so the branch first needs a total-mole baseline."
    scene: "The sealed branch has pressure P = 24.6 atm, volume V = 400 L, and temperature T = 300 K. The ideal gas relationship is n = PV/(RT), where n is total gas amount and R = 0.082 L atm mol^-1 K^-1."
    motivation: "The gas quantity sets the inventory against which the independent composition measurement will be interpreted."
    format: BALLPARK
    question: "Submit the total amount of gas in moles."
    # CONVERTED from the bible's `data` line, n = PV/RT = (20.0 atm)(500 L)/[(0.08206)(300 K)],
    # and its "406 mol total gas; target 406, tolerance ±2%" (2% of 406 = 8.12).
    estimate:
      question: "Estimate total gas moles using R = 0.08206 L atm mol^-1 K^-1."
      relationship: "n = PV ÷ RT"
      labels:
      - "20.0 atm"
      - "500 L"
      - "0.08206 L atm/mol/K"
      - "300 K"
      values: [20.0, 500, 0.08206, 300]
      slots: 4
      template: '{0} × {1} ÷ {2} ÷ {3}'
      formula: a*b/c/d
      correct: [0, 1, 2, 3]
      target: 406
      tolerance: 8.12
      units: mol
    answerText: "The branch contains 400 mol of total gas."
    why: "The ideal gas law counts total particles through their pressure-volume-temperature behavior. It does not distinguish H2 from N2. The normal-looking value can coexist with the wrong composition."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Celsius cannot replace kelvin. Multiplying by R instead of dividing breaks units. A result near 20 or 500 is a copied reading, not a mole calculation.
    # data: n = PV/RT = (20.0 atm)(500 L)/\[(0.08206)(300 K)\].
    # correct result: 406 mol total gas; target 406, tolerance ±2%.
    # state/output: Set evidence_flags.total_moles_normal = true.


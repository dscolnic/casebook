# ============================================================ MISSION 5
# Split back out of books/redsand_v5.yml by tools/split-book.mjs; the book's text, verbatim.
# Lifted from ../fpl_gpt/Mars_AP_Chemistry_Campaign_Implementation_Bible_v10.5_Explicit_Build_Ownership.md by tools/v10extract.mjs. Every quoted string below is
# the bible's, verbatim; engine/dev/bibleParity.mjs holds it to that.
- title: "The Water Account"
  card:
    header: "MISSION 5 - 11 WORK SHIFTS REMAIN BEFORE LAUNCH."
    title: "THE WATER ACCOUNT"
    goNow: "Go to the Water Plant and meet Rosalind Achebe, the analytical and electrochemistry lead, beside the recycle-water meter."
    body: "11 work shifts remain before launch. A sealed field vial stands apart from three matching screen printouts. Today you decide whether the water source is bad or the standard is wrong."
    objective: "Decide whether the water shortage is real and whether the meters provide independent evidence."
  objective: "Decide whether the water shortage is real and whether the meters provide independent evidence."
  stake: "11 work shifts remain before launch. A sealed field vial stands apart from three matching screen printouts. Today you decide whether the water source is bad or the standard is wrong."
  takeaway: "Several readouts are one piece of evidence if they share the same dependency."
  segue: "Therefore Abiola must join the raw clues before the next repair; the dashboard has lost its three-vote majority."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Solution", def: "a uniform mixture in which one or more substances are spread through another. A small sample can be concentrated without containing a large total amount."}
  - {name: "Solute", def: "the substance dissolved in a solution. Its total amount depends on both concentration and solution volume."}
  - {name: "Concentration", def: "the amount of solute in a chosen volume of solution. It does not by itself state the total amount in the container."}
  - {name: "Molarity", def: "the number of moles of solute in one liter of solution. It lets the plant compare samples of different sizes on the same scale."}
  equations:
  - {"e":"M = moles of solute / liters of solution","c":"comparing dissolved amounts in samples of different volume","v":[["M","molarity in moles per liter"],["moles of solute","the dissolved amount"],["liters","the total solution volume"]],"s":"The water plant must distinguish a small concentrated sample from a large container holding more total contamination."}
  primer:
  - "Total solute amount equals concentration multiplied by volume, so concentration alone cannot rank containers by total material."
  - "Choose a measurement setting that is sensitive to the difference being tested and remains inside the instrument's useful range."
  - "Trace every alarming display back to its source before treating agreement as confirmation."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-water-plant
    # On arrival at Water Plant | automatic | 
    on: { enter: true, at: SOIL }
    world: "A sealed field vial stands apart from three matching screen printouts."
    panel: "MISSION 5 - THE WATER ACCOUNT"
    # unlocks: Stop 17 at the wet-chemistry bench; Stop 18 unlocks immediately after Stop 17.
    bubbles:
    - who: achebe   # Achebe
      say: "If the Ice Cut suddenly turned dirty, we may have to stop both water and launch-gas production. We verify the measurement before we shut down the source."
  - id: after-stops-17-and-18
    # After Stops 17 and 18 | wet-chemistry bench | automatic response
    on: { after: [1, 2] }
    world: "At water-report, the dated accepted-result slip for Stop 17 reads: \"Bottle B.\". The slip remains in that fixture's evidence holder."
    panel: "NEXT TASK - STOP 19: CHOOSE THE MEASUREMENT WAVELENGTH"
    # unlocks: Stop 19 at the spectrometer.
    bubbles:
    - who: achebe   # Achebe
      say: "Nice work. A larger concentration is not automatically a larger amount. Now we have a number the process can use."
  - id: after-stop-19
    # After Stop 19 | spectrometer | automatic travel trigger
    on: { after: [3] }
    world: "At water-assay-desk, the dated accepted-result slip for Stop 18 reads: \"0.0400 M; tolerance ±3%.\". The slip remains in that fixture's evidence holder."
    panel: "DISTANT VERIFICATION AUTHORIZED - ICE CUT."
    # unlocks: The Ice Cut waypoint and Stop 20 after the player reaches the field sampler.
    bubbles:
    - who: achebe   # Achebe
      say: "Good thinking. The instrument sees a signal. We still need a sample that does not share this room, this meter, or this standard."
  - id: after-stop-20
    # After Stop 20 | Ice Cut | automatic discovery
    on: { after: [4] }
    world: "At spectrophotometer, the dated accepted-result slip for Stop 19 reads: \"Select about 510 nm.\". The slip remains in that fixture's evidence holder."
    panel: "THREE READOUTS / ONE CALIBRATION SOURCE."
    # unlocks: The Mission 5 outcome beat.
    bubbles:
    - who: achebe   # Achebe
      say: "Exactly right. The displays agree because they inherited the same error. Agreement is not independence."
  - id: at-mission-end
    # At mission end | Ice Cut | automatic outcome and hook
    on: { missionEnd: true }
    world: "At water-report, Rosalind Achebe clips the SHARED BAD STANDARD finding beside the normal field result. The dated prop remains here on later visits."
    panel: "NEXT DESTINATION - PLANT CONTROL REVIEW."
    # unlocks: Mission 6 briefing and the Plant Control waypoint.
    bubbles:
    - who: achebe   # Rosalind Achebe
      say: "One vial. Its own standard. That is why we brought it. Therefore Abiola must join the raw clues before the next repair; the dashboard has lost its three-vote majority."


# ============================================================ MISSION 5
# Lifted from ../fpl_gpt/Mars_AP_Chemistry_Campaign_Implementation_Bible_v10.5_Explicit_Build_Ownership.md by tools/v10extract.mjs. Every quoted string below is
# the bible's, verbatim; engine/dev/bibleParity.mjs holds it to that.
- title: "The Water Account"
  card:
    header: "11 SHIFTS UNTIL THE LAUNCH WINDOW CLOSES"
    title: "THE WATER ACCOUNT"
    goNow: "Go to the Water Plant and meet Rosalind Achebe, the analytical and electrochemistry lead, beside the recycle-water meter."
    body: "The stain did not travel through the methane line, and a new alarm says the recycled water is contaminated. Shutting the distant ice source would also stop hydrogen and oxygen production. At the Water Plant, measure concentration with a sealed standard, then visit the Ice Cut for an independent sample. By the end of the mission, decide whether the water alarm is real or shared instrument error."
    objective: "Decide whether the water shortage is real and whether the meters provide independent evidence."
  objective: "Decide whether the water shortage is real and whether the meters provide independent evidence."
  stake: "The stain did not travel through the methane line, and a new alarm says the recycled water is contaminated. Shutting the distant ice source would also stop hydrogen and oxygen production. At the Water Plant, measure concentration with a sealed standard, then visit the Ice Cut for an independent sample. By the end of the mission, decide whether the water alarm is real or shared instrument error."
  takeaway: "Several readouts are one piece of evidence if they share the same dependency."
  segue: "Mission decision: The water alarm comes from one bad standard. It does not prove the Ice Cut is dirty. Three displays share the same error, while the field sample is normal. The water source stays open. The raw gas, water, and carbon clues now go on one board."
  # The mission card's own "Primer concepts", printed on the plan card.
  primer:
  - "Total solute amount equals concentration multiplied by volume, so concentration alone cannot rank containers by total material."
  - "Choose a measurement setting that is sensitive to the difference being tested and remains inside the instrument's useful range."
  - "Trace every alarming display back to its source before treating agreement as confirmation."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-water-plant
    # On arrival at Water Plant | automatic | 
    on: { enter: true, at: SOIL }
    world: "A recycle-water display flashes CHLORIDE HIGH while a second panel reports WATER RETURN LOW; Achebe sets a sealed reference standard beside the wall meter."
    panel: "MISSION 5 - THE WATER ACCOUNT"
    # unlocks: Stop 17 at the wet-chemistry bench; Stop 18 unlocks immediately after Stop 17.
    bubbles:
    - who: achebe   # Achebe
      say: "If the Ice Cut suddenly turned dirty, we may have to stop both water and launch-gas production. We verify the measurement before we shut down the source."
  - id: after-stops-17-and-18
    # After Stops 17 and 18 | wet-chemistry bench | automatic response
    on: { after: [1, 2] }
    world: "The interface replaces the label MORE CHLORIDE with two separate labels: CONCENTRATION and TOTAL MOLES; The recycle sample molarity populates the treatment model."
    panel: "NEXT TASK - STOP 19: CHOOSE THE MEASUREMENT WAVELENGTH"
    # unlocks: Stop 19 at the spectrometer.
    bubbles:
    - who: achebe   # Achebe
      say: "A larger concentration is not automatically a larger amount. Now we have a number the process can use."
  - id: after-stop-19
    # After Stop 19 | spectrometer | automatic travel trigger
    on: { after: [3] }
    world: "The selected wavelength locks and the plant sample reads high against Standard C; Achebe places a clean field vial in a rover case."
    panel: "DISTANT VERIFICATION AUTHORIZED - ICE CUT."
    # unlocks: The Ice Cut waypoint and Stop 20 after the player reaches the field sampler.
    bubbles:
    - who: achebe   # Achebe
      say: "The instrument sees a signal. We still need a sample that does not share this room, this meter, or this standard."
  - id: after-stop-20
    # After Stop 20 | Ice Cut | automatic discovery
    on: { after: [4] }
    world: "The raw brine and field blank test normal; A dependency map then draws three alarming plant readouts back to the same Standard C."
    panel: "THREE READOUTS / ONE CALIBRATION SOURCE."
    # unlocks: The Mission 5 outcome beat.
    bubbles:
    - who: achebe   # Achebe
      say: "The displays agree because they inherited the same error. Agreement is not independence."
  - id: at-mission-end
    # At mission end | Ice Cut | automatic outcome and hook
    on: { missionEnd: true }
    world: "The Ice Cut shutdown order disappears, while three dashboard channels receive a SHARED CALIBRATION warning."
    panel: "NEXT DESTINATION - PLANT CONTROL REVIEW."
    # unlocks: Mission 6 briefing and the Plant Control waypoint.
    bubbles:
    - who: abiola   # Abiola
      say: "We will not close a working water source. Return with the raw measurements. Leak, feed, gas mixture, water, and calibration go on one board."

  stops:
  # --- Stop 17: Concentrated is not necessarily more
  #     Concept: concentration versus amount; Keystone: concentration is not amount; Area: Water Plant; Learning role: INTRODUCE; Difficulty: L1; Story role: character.
  #     placement: CHOICE, asked at Rosalind Achebe beside water-report.
  - group: SOIL
    at: water-report
    title: "Concentrated is not necessarily more"
    person: cho
    concept: "concentration versus amount"
    reason: "The water alarm confuses concentration with the total amount present."
    scene: "Before treating the alarm as water loss, compare sample volume and concentration to determine which container actually holds more chloride. This prevents a small concentrated sample from outweighing a larger inventory."
    motivation: "The water investigation depends on total contaminant, not on whichever concentration number looks larger."
    format: CHOICE
    question: "Which bottle contains more moles of chloride?"
    choices:
    - "Bottle B: 1.5 mol versus Bottle A's 1.0 mol"
    - "Bottle A because 2.0 M is larger."
    - "They contain the same amount because both contain chloride."
    - "Cannot know without molar mass."
    answer: "Bottle B: 1.5 mol versus Bottle A's 1.0 mol"
    answerText: "Bottle B contains more total chloride even though its concentration is lower."
    why: "Amount equals concentration times volume. A contains (2.0 mol/L)(0.50 L)=1.0 mol; B contains (0.30)(5.0)=1.5 mol. Molar mass is needed for mass, not for moles when molarity and volume are already given."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2) The larger molarity in Bottle A does not overcome its much smaller volume; concentration alone is not total amount. (3) Two bottles containing the same solute need not contain the same number of moles. (4) Molarity times volume already gives moles, so molar mass is not needed for this comparison.
    # correct result: Bottle B.
    # state/output: Clear misleading alarm label; unlock report calculation.

  # --- Stop 18: Put the water sample on a molar scale
  #     Concept: molarity; Keystone: concentration is not amount; Area: Water Plant; Learning role: PRACTICE; Difficulty: L2; Story role: clue.
  #     placement: BALLPARK, at water-assay-desk.
  - group: SOIL
    at: water-assay-desk
    title: "Put the water sample on a molar scale"
    concept: "molarity"
    reason: "Treatment decisions require a molarity, not a color or bottle size."
    scene: "Use that distinction to calculate molarity, giving the recycle-water alarm a concentration the plant can compare. The calculated value becomes the process number checked next by the independent field instrument."
    motivation: "The treatment system needs moles per liter before it can predict acidity or choose a neutralization dose."
    format: BALLPARK
    question: "Estimate the HCl molarity if the model treats it as fully dissociated."
    # CONVERTED from the bible's `data` line, (0.365 g / 36.46 g mol^-1) / 0.2500 L,
    # and its "0.0400 M; tolerance ±3%" (3% of 0.0400 = 0.0012).
    estimate:
      question: "Estimate the HCl molarity if the model treats it as fully dissociated."
      relationship: "molarity = grams ÷ molar mass ÷ litres of solution"
      labels:
      - "0.365 g HCl"
      - "36.46 g/mol HCl"
      - "0.2500 L"
      values: [0.365, 36.46, 0.2500]
      slots: 3
      template: '{0} ÷ {1} ÷ {2}'
      formula: a/b/c
      correct: [0, 1, 2]
      target: 0.0400
      tolerance: 0.0012
      units: M
    answerText: "The sample concentration is 0.0400 M HCl."
    why: "Convert grams to moles, milliliters to liters, then divide moles by solution volume. The calculation describes the modeled acid concentration; later pH reasoning can use strong-acid dissociation."
    # wrong-path feedback, one rebuttal per wrong option:
    #   0.000040 usually keeps milliliters as liters; 1.46 divides mass by volume without molar mass.
    # data: (0.365 g / 36.46 g mol^-1) / 0.2500 L.
    # correct result: 0.0400 M; tolerance ±3%.
    # state/output: Set recycle_acid_model = 0.0400.

  # --- Stop 19: Choose the measurement wavelength
  #     Concept: Beer-Lambert/spectroscopy; Keystone: solutions and spectroscopy; Area: Water Plant; Learning role: INTRODUCE; Difficulty: L3; Story role: clue.
  #     placement: SWEEP, operated at spectrophotometer.
  - group: SOIL
    at: spectrophotometer
    title: "Choose the measurement wavelength"
    concept: "Beer-Lambert/spectroscopy"
    reason: "The independent sample needs a wavelength that can reveal small differences."
    scene: "Choose the wavelength where the colored complex responds most strongly so an independent sample can confirm or reject the alarm. The selected peak must remain sensitive without saturating the detector."
    motivation: "A sensitive wavelength can reveal whether the wall meter's alarming chloride result is real."
    format: SWEEP
    question: "Sweep wavelength and select the operating wavelength with the greatest useful sensitivity."
    # CONVERTED from the payload below. `control` -> `axis`, `response_label` ->
    # `readout`, `standard_curve` -> the authored response points, and
    # `correct_setting` -> the target and its tolerance. `start` is the low end of
    # the bible's own range, which is not its answer.
    sweep:
      mode: peak
      axis: { label: "Wavelength", unit: nm, min: 400, max: 650, step: 10 }
      readout: { label: "absorbance" }
      response:
      - { at: 400, value: 0.08 }
      - { at: 440, value: 0.19 }
      - { at: 470, value: 0.48 }
      - { at: 490, value: 0.70 }
      - { at: 510, value: 0.82 }
      - { at: 530, value: 0.68 }
      - { at: 560, value: 0.40 }
      - { at: 620, value: 0.13 }
      - { at: 650, value: 0.06 }
      target: 510
      tolerance: 10
      start: 400
      commit: "Set the operating wavelength"
    answerText: "Use about 510 nm, where the standard has its strongest unsaturated response."
    why: "Beer-Lambert response changes most strongly with concentration where the absorbing species has high absorbance, provided the detector is not saturated. Measuring at a weak wavelength compresses differences and hides a small calibration error."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Choosing the lowest absorbance maximizes headroom but sacrifices sensitivity. Choosing a wavelength without running the standard leaves the instrument unqualified.
    # correct result: Select about 510 nm.
    # state/output: Unknown reports normal chloride when read against the sealed standard, contradicting the wall meter.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   sweep:
    #     control: {id: wavelength, label: "Wavelength", min: 400, max: 650, step: 10, unit: nm}
    #     response_label: absorbance
    #     standard_curve: [[400,0.08],[440,0.19],[470,0.48],[490,0.70],[510,0.82],[530,0.68],[560,0.40],[620,0.13],[650,0.06]]
    #     saturation_limit: 1.20
    #     required_action: "Run sealed standard before unknown."
    #     correct_setting: {value: 510, unit: nm, tolerance: 10}
    #     correct_reason: "Maximum useful unsaturated sensitivity."

  # --- Stop 20: Trace the agreement
  #     Concept: evidence dependency; Keystone: evidence must be independent; Area: Plant Control; Learning role: INTRODUCE; Difficulty: L4; Story role: reveal.
  #     placement: TRACE, operated at rover-sampler.
  - group: GIBBS
    at: rover-sampler
    title: "Trace the agreement"
    concept: "evidence dependency"
    reason: "The distant result matters only if its evidence path is truly independent."
    scene: "The field sample is normal while three displays still agree, so trace their calibrations to decide whether the agreement comes from independent evidence or shared error. The dependency map will show how many separate measurements really exist."
    motivation: "Three green or red displays count as one piece of evidence if the same drifting standard controls all three."
    format: TRACE
    question: "Open every dependency and identify whether the three alarming channels are independent."
    # CONVERTED from the payload below. `shared_resources` -> `resources`,
    # `depends_on` -> `depends`, and `truth.independent_channels` -> `independent`.
    # The engine's `depends` names resources, so a channel the bible routes through
    # another channel is declared against the standard both of them inherit; the
    # bible's `independent_volume` is dropped because it names no resource the
    # board declares.
    trace:
      resources:
      - { id: standard_c, label: "Plant Standard C" }
      - { id: standard_a, label: "Sealed Standard A" }
      target: standard_c
      channels:
      - { id: wall_chloride, label: "Wall chloride meter", reading: "HIGH", depends: [standard_c] }
      - { id: recycle_estimator, label: "Recycle estimator", reading: "LOW RETURN", depends: [standard_c] }
      - { id: control_correction, label: "Control-room water correction", reading: "ALARM", depends: [standard_c] }
      - { id: portable_spec, label: "Portable spectrophotometer", reading: "NORMAL", depends: [standard_a] }
      - { id: field_sample, label: "Ice Cut field sample", reading: "NORMAL", depends: [standard_a] }
      independent: [portable_spec, field_sample]
      commit: "Name the shared source"
    answerText: "The three alarming channels share Standard C; the portable field path is independent."
    why: "Agreement strengthens a conclusion only when evidence can fail separately. Here one biased standard propagates through three displays. The distant trip matters because a new sample and independent standard break the dependency chain."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Counting displays is not counting evidence. A derived estimator cannot independently confirm its own input.
    # correct result: The three alarming channels are not independent; all inherit Plant Standard C. The portable/field path is independent and does not reproduce the alarm.
    # state/output: Set evidence_flags.shared_calibration = true; unlock calibration-stream replacement; update water_reserve upward by 4 apparent units but leave real deficit unresolved.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.

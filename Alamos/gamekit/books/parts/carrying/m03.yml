    concept: "generalist/specialist, island biogeography, life history preview"
    reason: "Habitat protection must begin with species least able to replace losses."
    scene: "Because damaged soils recover at different rates, species using them also face different risk. Sort a broad-diet generalist and a narrow-habitat specialist for monitoring, protection, or routine watch, and the team needs this result before it acts."
    motivation: "Small remote islands support fewer replacements, so specialists need earlier protection."
    format: TRIAGE
    question: "Assign island rat, cliff-nesting petrel, fast-growing grass, and slow-breeding seal to routine, monitor, or protect first; submit one complete triage."
    answerText: "The completed check shows protect the petrel first; monitor the seal; routine watch for the generalists."
    why: "Narrow niches and isolation limit recolonization; feedback contrasts niche breadth."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Protecting the rat or grass first favors fast-growing generalists; treating the slow-breeding seal as routine ignores its low replacement rate, while the cliff petrel has the narrowest habitat.
    # correct result: Protect the petrel first; monitor the seal; routine watch for the generalists.
    # state/output: Petrel habitat hatched with text label; unlocks Stop 3.4.

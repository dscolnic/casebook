  # --- Stop 10: Read recovery and habitat
  #     Concept: succession, biomes, aquatic zones; Keystone: biodiversity/resilience; Area: Reef Station; Learning role: INTRODUCE; Difficulty: L2; Story role: clue.
  #     placement: SEQUENCE, at s10-read-recovery-and-habitat.
  - group: REEF
    at: TODO               # the fixture it is asked at
    title: "Read recovery and habitat"
    concept: "succession, biomes, aquatic zones"
    reason: "Bare patches cannot be assigned the same recovery time without checking whether soil remains."
    scene: "With grazing energy capped, Iona points to two damaged plots: exposed rock and a burned field with soil. Order each recovery path and identify which can recover within decades, and the team needs this result before it acts."
    motivation: "Secondary succession is faster because soil, microbes, and seeds remain."
    format: SEQUENCE
    question: "Order bare rock -> pioneer species -> soil forms -> later community and disturbance -> grasses -> shrubs -> later community; submit secondary succession as the faster path."
    answerText: "The completed check shows the burned soil follows secondary succession and can recover in roughly 10-50 years; bare rock primary succession often takes 100+ years."
    why: "Existing soil preserves nutrients and organisms; feedback highlights the missing prerequisite."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Calling bare-rock recovery secondary ignores the lack of soil; calling the burned-soil path primary ignores the surviving soil and therefore exaggerates recovery time.
    # correct result: The burned soil follows secondary succession and can recover in roughly 10-50 years; bare rock primary succession often takes 100+ years.
    # state/output: Recovery zones labeled; aquatic inset labels photic, aphotic, littoral, pelagic, benthic; unlocks Stop 3.3.

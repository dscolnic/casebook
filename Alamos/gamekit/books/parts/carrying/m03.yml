  #     placement: BALLPARK, at s09-count-usable-plant-energy.
  - group: POWER
    at: TODO               # the fixture it is asked at
    title: "Count usable plant energy"
    concept: "GPP/NPP and 10% law"
    reason: "Grazing capacity must use energy left after plant respiration."
    scene: "The water ceiling is now fixed, but the common can still be overstocked by counting all captured sunlight. Calculate usable plant production, then follow its loss to grazing animals, and the team needs this result before it acts."
    motivation: "Energy limits food production even when nutrient atoms keep cycling."
    format: BALLPARK
    question: "First calculate NPP from GPP 18,000 kJ/m²/yr and plant respiration 8,000 kJ/m²/yr. Then apply 10% transfer and submit herbivore production in kJ/m²/yr."
    answerText: "The completed check shows nPP is 10,000 kJ/m²/yr; herbivore production is about 1,000 kJ/m²/yr."
    why: "Plants use part of GPP, and most remaining energy is lost as heat between levels."
    # wrong-path feedback, one rebuttal per wrong option:

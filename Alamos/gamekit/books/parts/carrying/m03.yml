- title: "The Ecological Limits"
  card:
    header: "13 DAYS TO THE FERRY VOTE"
    title: "What Keeps Growing"
    goNow: "Go to the Common Office and meet Iona Vale, common agronomy lead, at the common map."
    body: "The recharge ceiling looks workable, but water alone does not define island capacity. Food webs depend on limited energy, cycling nutrients, habitat, and recovery after disturbance. At the Common Office, map those limits from soil to grazing land. By the end of the mission, decide which ecological limits must constrain ferry growth."
    objective: "Add ecological limits to the ferry plan."
  objective: "Add ecological limits to the ferry plan."
  stake: "The recharge ceiling looks workable, but water alone does not define island capacity. Food webs depend on limited energy, cycling nutrients, habitat, and recovery after disturbance. At the Common Office, map those limits from soil to grazing land. By the end of the mission, decide which ecological limits must constrain ferry growth."
  takeaway: "Soil makes secondary succession faster than primary succession. ---"
  segue: "Mission decision: Limit ferry growth to what farms and wild systems can support. Food loss, slow growth, and habitat all set the limit. More fertilizer will not remove those limits. Salt in the well is still rising."

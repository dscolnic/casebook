    title: "Integrate lost capacity"
    concept: "area between curves/crossings"
    reason: "The curve gap must become a volume before the release target can change."
    scene: "Old minus new storage density is d(h)=6-h million cubic metres per metre for 2<=h<=5, and the curves cross at h=6. Integrate the positive gap across the operating interval, and the team needs this result before it acts."

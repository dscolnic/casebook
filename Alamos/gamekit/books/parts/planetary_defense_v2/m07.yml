  # --- Stop 27: Read delay and Doppler
  #     Concept: range and radial speed; Keystone: equations/interpretation; Area: Bistatic Radar Range; Learning role: INTRODUCE; Difficulty: L4; Story role: calculation.
  #     placement: PROBE, at radar-console.
  - group: RADAR
    at: radar-console
    title: "Read delay and Doppler"
    concept: 10   # range and radial speed
    reason: "The corrected timing permits the radar return to constrain range and radial motion."
    scene: "The corrected return arrives 0.080 seconds after transmission and shifts toward the transmitter. Probe the clock, delay, Doppler, and background stations; calculate range and classify radial motion without inferring sideways speed."
    motivation: "Delay and Doppler distinguish distance and line-of-sight velocity without claiming unmeasured sideways motion."
    format: PROBE
    question: "Calculate and commit range in kilometers; then probe all four stations, measure each reading, and submit the range plus APPROACHING or RECEDING."
    answerText: "Delay gives distance, while the frequency shift gives only radial-motion direction."
    why: "Round-trip light time is halved; Doppler does not reveal transverse velocity."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A one-way calculation doubles range, and Doppler alone cannot supply the full velocity vector.
    # correct result: 12,000 km range; object is approaching along the line of sight.
    # state/output: RANGE 12,000 KM and APPROACHING enter the orbit packet.

  - {name: "Doppler shift", def: "a frequency change caused by motion toward or away from the radar."}
  - {name: "Residual", def: "the measured value minus the value predicted by a model."}
  - {name: "Coordinated Universal Time (UTC)", def: "the shared time standard used to compare observations from different systems."}

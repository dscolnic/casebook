  # --- Stop 27: Read delay and Doppler
  #     Concept: range and radial speed; Keystone: equations/interpretation; Area: Bistatic Radar Range; Learning role: INTRODUCE; Difficulty: L4; Story role: calculation.
  #     placement: PROBE, at radar-console.
  - group: RADAR
    at: radar-console
    title: "Read delay and Doppler"
    concept: 10   # range and radial speed
    reason: "The corrected timing permits the radar return to constrain range and radial motion."
    scene: "The corrected return arrives 0.080 seconds after transmission and shifts toward the transmitter. Probe the clock, delay, Doppler, and background stations; calculate range and classify radial motion without inferring sideways speed."
    motivation: "Delay and Doppler distinguish distance and line-of-sight velocity without claiming unmeasured sideways motion."
    format: PROBE
    question: "Calculate and commit range in kilometers; then probe all four stations, measure each reading, and submit the range plus APPROACHING or RECEDING."
    answerText: "Delay gives distance, while the frequency shift gives only radial-motion direction."
    why: "Round-trip light time is halved; Doppler does not reveal transverse velocity."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A one-way calculation doubles range, and Doppler alone cannot supply the full velocity vector.
    # correct result: 12,000 km range; object is approaching along the line of sight.
    # state/output: RANGE 12,000 KM and APPROACHING enter the orbit packet.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   probe:
    #     prediction_commit_required: true
    #     equipment_unlocks_after_commit: true
    #     points:
    #       - id: corrected_clock
    #         load: "Corrected timing reference; verify zero residual clock offset before using the echo."
    #         reading: {clock_offset_s: 0.000}
    #         expected: {clock_offset_s: 0.000}
    #         comparison: "The observed offset equals the station-specific zero-offset expectation."
    #       - id: delay_channel
    #         load: "Round-trip echo timing; calculate R = cΔt/2 using c = 3.00 × 10^8 m/s and Δt = 0.080 s."
    #         reading: {round_trip_delay_s: 0.080}
    #         expected: {one_way_range_km: 12000}
    #         comparison: "The calculated 12,000 km range is the station-specific expected result."
    #       - id: doppler_channel
    #         load: "Frequency-shift direction relative to the transmitter; do not infer transverse speed."
    #         reading: {shift_direction: toward_transmitter}
    #         expected: {radial_motion: approaching}
    #         comparison: "A shift toward the transmitter specifically means APPROACHING radial motion."
    #       - id: background_channel
    #         load: "Off-target background gate; check that noise cannot imitate the timed return."
    #         reading: {signal_to_noise: 1.1}
    #         expected: {maximum_signal_to_noise: 1.5}
    #         comparison: "The background stays below its station-specific 1.5 limit."
    #     correct_submission: {range_km: 12000, radial_motion: approaching}
    #     required_samples: [corrected_clock, delay_channel, doppler_channel, background_channel]
    #     truth: {range_km: 12000, radial_motion: approaching}
    #     commit_gate: All four stations sampled after the range prediction is committed.
    probe:
      stations:
        - id: corrected_clock
          label: Corrected timing reference
          reading: 0
          expected: 0
          unit: s clock offset
        - id: delay_channel
          label: Round-trip echo
          reading: 0.08
          expected: 0.08
          unit: s
        - id: doppler_channel
          label: Doppler direction
          reading: toward transmitter
          expected: approaching
          unit: radial-motion class
        - id: background_channel
          label: Off-target background
          reading: 1.1
          expected: 1.5
          unit: maximum S/N
      target: delay_channel
      quantityAndUnits: Calculate and commit range in kilometers; then probe all four stations, measure each reading, and submit the range plus APPROACHING or RECEDING.
      correctConclusion: 12,000 km range; object is approaching along the line of sight.

  # --- Stop 28: Freeze the claim before the image
  #     Concept: echo interpretation; Keystone: bias/verification; Area: Bistatic Radar Range; Learning role: INTRODUCE; Difficulty: L5; Story role: judgment.
  #     placement: HOLDOUT, at echo-archive.
  - group: RADAR
    at: echo-archive
    title: "Freeze the claim before the image"
    concept: 10   # echo interpretation
    reason: "The predicted echo window must be frozen before the integrated radar image is opened."
    scene: "Malik's surviving orbit predicts the main echo window, but the integrated image remains hidden. Freeze the expected delay band and rejection condition before revealing a strong return plus a weak adjacent shoulder."
    motivation: "The revealed main return tests the orbit constraint while the adjacent shoulder remains a separate unresolved feature."
    format: HOLDOUT
    question: "Commit the ±0.004 s window and rejection rule first; after reveal, submit the main-return offset in seconds, shoulder status, and ACCEPT or REJECT."
    answerText: "The main return passes the frozen test, while the shoulder becomes a clue rather than a conclusion."
    why: "Pre-registration limits hindsight bias and protects anomalies for later testing."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Neither deleting the shoulder nor naming it a fragment is justified yet.
    # correct result: Accept the main constraint; label the shoulder unresolved.
    # state/output: RADAR CONSTRAINT VALID; SECOND SHOULDER UNRESOLVED.

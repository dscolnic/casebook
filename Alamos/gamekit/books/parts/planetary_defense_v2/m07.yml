  stops:
  # --- Stop 25: Trace the time chain
  #     Concept: radar timing; Keystone: systems/verification; Area: Bistatic Radar Range; Learning role: REINFORCE; Difficulty: L4; Story role: evidence.
  #     placement: TRACE, at scopeboard.
  - group: RADAR
    at: scopeboard
    title: "Trace the time chain"
    concept: 10   # radar timing
    reason: "The incoming radar packet needs a clock audit before delay becomes a physical distance."
    scene: "The radar packet passed through four clocks, but only three were synchronized to the range standard before transmission. Trace the timestamp from observatory receipt backward and flag the device that can shift every derived range together."
    motivation: "The timestamp dependency identifies a shared timing offset capable of biasing every range derived from the archive."
    format: TRACE
    question: "Submit one completed timing chain, identify the common failure point, and give the signed correction in seconds."
    # Converted from the payload's `trace`. Its `shared_resources` are the
    # engine's `resources`, `depends_on` is `depends`, and the payload's
    # `truth.independent_channels` is the board's `independent` list — which is
    # where the engine reads it from, never a flag on the channel itself.
    trace:
      resources:
      - { id: archive_server, label: Archive server clock }
      - { id: utc_receiver, label: Independent UTC receiver }
      target: archive_server
      channels:
      - { id: main_delay, label: Archived main-echo delay, reading: shifted +0.7 s, depends: [archive_server] }
      - { id: shoulder_delay, label: Archived shoulder delay, reading: shifted +0.7 s, depends: [archive_server] }
      - { id: doppler_time, label: Archive Doppler timestamp, reading: shifted +0.7 s, depends: [archive_server] }
      - { id: receiver_monitor, label: Independent receiver-clock monitor, reading: 0.0 s offset, depends: [utc_receiver] }
      independent: [receiver_monitor]
      commit: Name the common failure point
    answerText: "The archive clock is common to every stored echo, so its offset shifts the whole set."
    why: "TRACE follows provenance until one upstream cause explains correlated downstream error."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Do not average away an offset shared by every archived return.
    # correct result: Flag the archive server and subtract 0.7 s from archived receipt times.
    # state/output: CORRECTED TIME CHAIN prints; RADAR travel unlocks.

        step: 2
        unit: ms
      fit:
        - at: 0
          value: 0.58
        - at: 2
          value: 0.98
        - at: 4
          value: 0.84
        - at: 6
          value: 0.87
        - at: 8
          value: 0.83
      test:
        - at: 0
          value: 0.36
        - at: 2
          value: 0.47
        - at: 4
          value: 0.77
        - at: 6
          value: 0.86
        - at: 8
          value: 0.84
      overfitAt: 2
      correctAt: 6
      committedWindow:
        min: -4
        max: 4
        unit: ms
      heldOutMeasurement:
        mainReturnOffset: 1
        shoulderPresent: true
        unit: ms
      correctConclusion: Accept the main constraint and preserve the shoulder as unresolved.
      pass: 0.8


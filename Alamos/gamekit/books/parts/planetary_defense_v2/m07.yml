    examples:
    - {"title":"Radar round-trip time","problem":"A radar echo returns after 2 s. Use c=300000 km/s. Find target distance.","rule":"Range=c×round-trip delay/2.","steps":["Set up the relationship: Range=c×round-trip delay/2.","R=300000(2)/2=300000 km."],"answer":"The target is 300000 km away.","mistake":"The measured delay includes travel out and back."}
    - {"title":"Range error from timing error","problem":"A radar delay is biased high by 0.002 s. Use c=300000 km/s. Find the range bias.","rule":"Range bias=c×delay bias/2.","steps":["Set up the relationship: Range bias=c×delay bias/2.","ΔR=300000(0.002)/2=300 km."],"answer":"The inferred range is 300 km too large.","mistake":"A shared clock bias can shift many measurements together."}
    - {"title":"A rounded radar Doppler estimate","problem":"For a receding target, use the nonrelativistic monostatic radar magnitude |Δf|=2v/λ. Let v=3 m/s and wavelength λ=0.1 m.","rule":"The factor 2 represents the outbound and returning Doppler shifts.","steps":["Set up the relationship: The factor 2 represents the outbound and returning Doppler shifts.","|Δf|=2(3)/0.1=60 Hz."],"answer":"The return is shifted downward by about 60 Hz for recession under this convention.","mistake":"A one-way Doppler formula would omit the radar factor of two."}
    - {"title":"Correct a known offset","problem":"A balance reads 52 g for a certified 50 g mass and 32 g for a second object. Assume a constant additive offset. Find the corrected second mass.","rule":"Offset = reading - reference; corrected value = reading - offset.","steps":["offset = 52 - 50 = +2 g. The balance reads high.","corrected mass = 32 - 2 = 30 g. Subtract the same offset."],"answer":"The corrected mass is 30 g.","mistake":"An additive offset is not a percentage error."}
    - {"title":"Position residual","problem":"A model predicts sky coordinate 100 arcseconds and the observed coordinate is 103 arcseconds in the same reference. Find residual.","rule":"Residual=observed-predicted coordinate.","steps":["Set up the relationship: Residual=observed-predicted coordinate.","r=103-100=+3 arcseconds."],"answer":"The model prediction is 3 arcseconds below the observed coordinate.","mistake":"Use the same coordinate reference and units."}

  stops:
  # --- Stop 25: Trace the time chain
  #     Concept: radar timing; Keystone: systems/verification; Area: Bistatic Radar Range; Learning role: REINFORCE; Difficulty: L4; Story role: evidence.
  #     placement: TRACE, at scopeboard.
  - group: RADAR
    at: scopeboard
    title: "Trace the time chain"
    concept: 10   # radar timing
    reason: "The incoming radar packet needs a clock audit before delay becomes a physical distance."
    scene: "The radar packet passed through four clocks, but only three were synchronized to the range standard before transmission. Trace the timestamp from observatory receipt backward and flag the device that can shift every derived range together."
    motivation: "The timestamp dependency identifies a shared timing offset capable of biasing every range derived from the archive."
    format: TRACE
    question: "Submit one completed timing chain, identify the common failure point, and give the signed correction in seconds."
    # Converted from the payload's `trace`. Its `shared_resources` are the
    # engine's `resources`, `depends_on` is `depends`, and the payload's
    # `truth.independent_channels` is the board's `independent` list — which is

- title: "The Last Dark Window"
  card:
    header: "IMPACT WINDOW: 10 DAYS"
    title: "THE LAST DARK WINDOW"
    goNow: "Go to Orbit Determination and meet Malik Rowan, orbit-determination lead, at the fit-board."
    body: "The warning is out, but 180 orbit solutions still place the object on both impact and miss paths. The object soon enters the Sun's glare, so tonight's time must buy information rather than more of the same. At Orbit Determination, compare observing schedules and propagate their expected gains. By the end of the mission, choose which optical, radar, and thermal observations receive the range's last dark window."
    objective: "Fund the observing plan most likely to change the impact decision."
  objective: "Fund the observing plan most likely to change the impact decision."
  stake: "The warning is out, but 180 orbit solutions still place the object on both impact and miss paths. The object soon enters the Sun's glare, so tonight's time must buy information rather than more of the same. At Orbit Determination, compare observing schedules and propagate their expected gains. By the end of the mission, choose which optical, radar, and thermal observations receive the range's last dark window."
  takeaway: "Spend scarce observing time on complementary evidence, not repeated volume. ---"
  segue: "Mission decision: Use the last dark window for dawn images, radar, and heat data. These tests may cut the path width to about 4,600 km. The range will guard the handoff. The summit system must pass its checks first."
  # The mission card's own "Primer concepts", printed on the plan card.
  primer:
  - "A longer time baseline often adds more orbital leverage than many same-night points."
  - "Radar can add range and radial velocity; thermal infrared can constrain size."
  - "The best observation is the one that can change an action, not the one with the most data points."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:

  # --- Stop 15: Propagate the error budget
  #     Concept: error budget; Keystone: uncertainty/covariance; Area: Orbit Determination Center; Learning role: COMBINE; Difficulty: L4; Story role: obstacle.
  #     placement: PROPAGATE, at fit-board.
  - group: ORBIT
    at: fit-board
    title: "Propagate the error budget"
    concept: "error budget"
    reason: "The director needs a forecast of what the chosen schedule can actually improve."
    scene: "Because the observing order is fixed, the orbit team can forecast how each block changes the encounter uncertainty. Buy the measurement update that most reduces the b-plane width while preserving size information."
    motivation: "The predicted reduction sets the success test for the real observations in later missions."
    format: PROPAGATE
    question: "Submit one observing-update plan costing no more than 65 credits and its resulting b-plane width in kilometers."
    answerText: "Geometry and time baseline together outperform more same-night precision."
    why: "Correlated range and along-track uncertainty require complementary measurements."
    # wrong-path feedback, one rebuttal per wrong option:

  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 4: worked examples"
    examples:
    - {"title":"Choose information that resolves a difference","problem":"Two candidate paths predict the same sky direction tonight but very different distances. Which new measurement is more discriminating: another same-precision direction or a precise distance?","rule":"Useful information separates predictions that otherwise fit existing data.","steps":["Another similar direction is compatible with both paths.","A sufficiently precise distance can distinguish their different range predictions."],"answer":"The distance measurement is more discriminating in this stated comparison.","mistake":"More measurements are not automatically more useful than a new independent kind of measurement."}
    - {"title":"Lengthen the observing arc","problem":"The first observation is at hour 2 and the last at hour 10. An added observation is at hour 14. Compare elapsed observing spans.","rule":"Arc duration=last observation time-first observation time.","steps":["Set up the relationship: Arc duration=last observation time-first observation time.","old span=10-2=8 h; new span=14-2=12 h."],"answer":"The time span increases by 4 hours, or 50%.","mistake":"Adding an observation between hours 2 and 10 would not lengthen the span."}
    - {"title":"Why a short arc is ambiguous","problem":"Two moving objects have the same sky direction and angular speed but different unknown distances. Do these observations uniquely determine their physical paths?","rule":"Sky angles alone do not specify full three-dimensional position and velocity.","steps":["The same angular speed can correspond to different transverse speeds at different distances.","Different line-of-sight velocities can also remain consistent with a short angular record."],"answer":"Several physical paths can fit the same short sky arc.","mistake":"A precise angle is not a direct measurement of distance."}
    - {"title":"Protect a required reserve","problem":"A lab has 100 energy units. Essential tasks need 30 and 40 units, and reserve must be at least 20. How much remains for an optional task?","rule":"Optional capacity = total - essential use - protected reserve.","steps":["essential use = 30+40 = 70 units.","optional capacity = 100-70-20 = 10 units."],"answer":"At most 10 units may fund the optional task while preserving the reserve.","mistake":"Treating the reserve as freely available breaks the stated requirement."}
    - {"title":"Count independent evidence sources","problem":"Three reports copy one balance reading. A fourth report uses a separately calibrated balance. How many measurement sources are there?","rule":"Reports are not independent measurements when they copy a common source.","steps":["source group 1 = the first balance and its three copies. Count that measurement once.","source group 2 = the second balance. It adds a separate measurement route."],"answer":"There are two measurement sources, not four.","mistake":"Agreement among copies cannot establish independent confirmation."}

  stops:
  # --- Stop 13: Buy evidence, not volume
  #     Concept: information gain; Keystone: telescope limits; Area: Orbit Determination Center; Learning role: RETRIEVE; Difficulty: L4; Story role: obstacle.
  #     placement: VALUE, asked by Malik Rowan beside fit-board.
  - group: ORBIT
    at: fit-board
    title: "Buy evidence, not volume"
    person: rowan
    concept: 18   # information gain
    reason: "The remaining observing window must target the uncertainties that still change the warning decision."
    scene: "The object's motion is confirmed and its sky position is already measured precisely. Malik needs a plan for the uncertainties still affecting the warning."
    motivation: "The selected measurements determine whether the budget buys complementary range, time-baseline, and size information."
    format: VALUE
    question: "You have 100 observing credits. Cover every required outcome at the lowest total cost within the budget; keep all unused capacity in reserve. Select whole packages, then submit the plan; the board shows its total and remaining reserve for you to check."
    # Converted from the payload's `value`. `budget: 100` becomes the engine's
    # budget object; each option keeps its own id, label, cost and axis. The
    # payload's `recommended` set — its keyed 90-credit plan — is what the engine
    # calls `decisive`: the options without which the decision does not change.
    value:
      budget:
        amount: 100
        unit: observing credits
      decision: ""
      requirements:
        - id: r1
          text: measure motion over a longer time interval
        - id: r2
          text: constrain distance and motion along the line of sight
        - id: r3
          text: constrain size
      rule: Cover every required outcome at the lowest total cost within the budget; keep all unused capacity in reserve.
      plans:
        - late_optical,radar_range,thermal_size
      options:
        - id: late_optical
          label: 12-frame recovery near dawn
          cost: 30
          axis: ""
          reveals: Observes the object later, extending the time interval used to fit its trajectory.
          covers:
            - r1
          decisive: true
        - id: radar_range
          label: Range-Doppler block
          cost: 35
          axis: ""
          reveals: Measures distance and motion toward or away from Earth.
          covers:
            - r2
          decisive: true
        - id: thermal_size
          label: Thermal infrared block
          cost: 25
          axis: ""
          reveals: Measures emitted heat to constrain diameter and separate size from reflectivity.
          covers:
            - r3
          decisive: true
        - id: same_night_stack
          label: 60 same-night optical frames
          cost: 45
          axis: ""
          reveals: Refines the already precise sky position without adding a long time interval.
        - id: publicity_image
          label: Live public telescope feed
          cost: 20
          axis: ""
          reveals: Shares the view with the public but adds no new trajectory or size measurement.
      commit: Commit the decision
    answerText: "Each funded package supplies a required outcome; an affordable package that leaves one unresolved is insufficient."
    why: "Independent measurement axes reduce different uncertainties; repeated same-night frames mostly refine an already precise direction."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Ask which current uncertainty each option reduces and whether another option measures the same thing.
    # correct result: Late optical + radar + thermal = 90 credits.
    # state/output: Selected blocks move onto the schedule rail; Stop 14 unlocks.

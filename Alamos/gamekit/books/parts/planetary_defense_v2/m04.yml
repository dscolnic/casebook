  # --- Stop 15: Propagate the error budget
  #     Concept: error budget; Keystone: uncertainty/covariance; Area: Orbit Determination Center; Learning role: COMBINE; Difficulty: L4; Story role: obstacle.
  #     placement: PROPAGATE, at fit-board.
  - group: ORBIT
    at: fit-board
    title: "Propagate the error budget"
    concept: 11   # error budget
    reason: "The observing schedule needs a forecast of uncertainty reduction before scarce time is committed."
    scene: "The team compares forecast packages before committing the observing schedule. Thermal size work remains protected while the orbit team tests alternative uses of its forecast budget."
    motivation: "The encounter-width comparison determines which measurement combination most improves the predicted impact region."
    format: PROPAGATE
    question: "Select the package costing at most 65 credits with the smallest supplied encounter width. Submit the package and its reported width in kilometres; these are alternative model forecasts, not independent errors to add."
    answerText: "The joint orbit refit predicts a narrower encounter region than either ingredient alone. The orbit desk supplies these whole-model forecasts; a sum of individual error magnitudes cannot reproduce them."
    why: "Correlated range and along-track uncertainty require complementary measurements."
    # wrong-path feedback, one rebuttal per wrong option:

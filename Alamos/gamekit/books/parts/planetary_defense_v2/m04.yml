  # --- Stop 14: Build the night
  #     Concept: cadence; Keystone: telescope limits; Area: Orbit Determination Center; Learning role: PRACTICE; Difficulty: L3; Story role: obstacle.
  #     placement: SEQUENCE, at scope-schedule.
  - group: ORBIT
    at: scope-schedule
    title: "Build the night"
    concept: "cadence"
    reason: "The funded observations fail if the object sets before the handoffs occur."
    scene: "With the three evidence blocks funded, their order must respect sky visibility, radar geometry, aircraft travel, and instrument handoff. Build a schedule that preserves the late optical baseline and transfers each result before the next fit."
    motivation: "Correct cadence turns three instruments into one growing evidence chain."
    format: SEQUENCE
    question: "Order the funded work so visibility and evidence handoffs are physically possible."
    # Converted from the payload's `cards` / `order`; the engine's `order` is a
    # list of card indices and the payload's order is the cards as written.
    cards:
    - "Fly to Cerro Alto and validate the optical pipeline"
    - "Obtain early optical tracklet"
    - "Acquire radar range-Doppler block"
    - "Obtain thermal infrared block"
    - "Recover final optical tracklet near dawn"
    - "Refit orbit and consequences"
    order: [0, 1, 2, 3, 4, 5]
    answerText: "The plan protects the long time baseline and delivers each measurement before the final fit."
    why: "Observing cadence is constrained by sky position, geometry, travel, and processing time."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Keep the dawn recovery last among observations; it supplies the longest baseline.
    # correct result: Validate/early optical → radar → thermal → dawn optical → refit.
    # state/output: Schedule rail locks; Stop 15 unlocks.

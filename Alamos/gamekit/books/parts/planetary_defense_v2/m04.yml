    # On arrival at Orbit Determination Center | automatic | 
    on: { enter: true, at: ORBIT }
    world: "Malik Rowan, orbit-determination lead, points to a daylight gap on the fit-board: \"More points tonight or one point later—those are not the same.\""
    panel: "THE LAST DARK WINDOW / MISSION ACTIVE"
    # unlocks: Stop 13.
    bubbles:
    - who: rowan   # Malik Rowan
      say: "The mission is live. Start with the first evidence, and do not add a claim the board has not earned."
  - id: after-stop-13
    # After Stop 13 | automatic | 
    on: { after: [1] }
    world: "Low-value repeated exposures dim; later-baseline optical, radar, and thermal options remain bright."
    panel: "THE LAST DARK WINDOW / FIRST RESULT LOGGED"
    # unlocks: Stop 14.
    bubbles:
    - who: rowan   # Malik Rowan
      say: "That result is now part of the record. Use it in the next test."
  - id: after-stop-14
    # After Stop 14 | automatic | 
    on: { after: [2] }
    world: "The chosen schedule appears on the scopeboard with protected handoff blocks."
    panel: "THE LAST DARK WINDOW / EVIDENCE HANDOFF READY"
    # unlocks: Stop 15.
    bubbles:
    - who: rowan   # Malik Rowan
      say: "The handoff is ready. Follow the newly unlocked evidence."
  - id: after-stop-15
    # After Stop 15 | automatic | 
    on: { after: [3] }
    world: "The error budget predicts orbit-width reduction from 17,000 km to 4,600 km."
    panel: "THE LAST DARK WINDOW / DECISION EVIDENCE READY"
    # unlocks: Stop 16.
    bubbles:
    - who: rowan   # Malik Rowan
      say: "The decision evidence is complete. Make the narrowest claim that fits it."
  - id: at-mission-end
    # At mission end | automatic | 
    on: { missionEnd: true }
    world: "Mira authorizes the plan; the aircraft changes from HELD to SIGNED OUT FOR PHASE 5."
    panel: "THE LAST DARK WINDOW / MISSION DECISION LOGGED"
    # unlocks: Mission 4 outcome, metric screen, concept review, and Mission 5 briefing.
    bubbles:
    - who: rowan   # Malik Rowan
      say: "The decision is logged. Carry this result into the next shift."

  stops:
  # --- Stop 13: Buy evidence, not volume
  #     Concept: information gain; Keystone: telescope limits; Area: Orbit Determination Center; Learning role: RETRIEVE; Difficulty: L4; Story role: obstacle.
  #     placement: VALUE, asked by Malik Rowan beside fit-board.
  - group: ORBIT
    at: fit-board
    title: "Buy evidence, not volume"
    person: rowan
    concept: "information gain"
    reason: "Only 100 observing credits remain before the object enters daylight."
    scene: "The current orbit cloud is limited mainly by range, time baseline, and one possible timestamp bias, not by raw image count. Spend the fixed budget on measurements that can change the warning decision."
    motivation: "The selected evidence determines whether tonight narrows the real uncertainty or merely repeats it."
    format: VALUE
    question: "Submit one observing plan costing at most 100 credits, its total cost, and the remaining reserve."
    # Converted from the payload's `value`. `budget: 100` becomes the engine's
    # budget object; each option keeps its own id, label, cost and axis. The
    # payload's `recommended` set — its keyed 90-credit plan — is what the engine
    # calls `decisive`: the options without which the decision does not change.
    value:
      budget: { amount: 100, unit: observing credits }
      options:
      - { id: dense_optical, label: 60 same-night optical frames, cost: 45, axis: precision }
      - { id: late_optical, label: 12-frame recovery near dawn, cost: 30, axis: time_baseline, decisive: true }
      - { id: radar, label: Range-Doppler block, cost: 35, axis: geometry, decisive: true }
      - { id: thermal, label: Thermal infrared block, cost: 25, axis: size, decisive: true }
      - { id: publicity, label: Live public telescope feed, cost: 20, axis: communication }
    answerText: "The mixed plan attacks time baseline, range, and size while preserving a small reserve."
    why: "Independent measurement axes reduce different uncertainties; repeated same-night frames mostly refine an already precise direction."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Ask which current uncertainty each option reduces and whether another option measures the same thing.
    # correct result: Late optical + radar + thermal = 90 credits.
    # state/output: Selected blocks move onto the schedule rail; Stop 14 unlocks.

    at: scopeboard
    title: "What moved?"
    person: ortiz
    concept: "apparent motion"
    reason: "Lena needs a physical test before protecting the alert from automatic rejection."
    scene: "Six timed images show one faint point beside fixed stars, a long satellite streak, and a known bad detector column. The first task is to identify which pattern can represent one object moving through the sky."
    motivation: "Choosing the physical motion pattern decides whether the remaining frames deserve a linked-track test."
    format: CHOICE

  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 1: worked examples"
    examples:
    - {"title":"Angular motion on the sky","problem":"An object shifts 12 arcseconds between images taken 3 minutes apart. Find its average angular speed. One arcsecond is 1/3600 degree.","rule":"Angular speed=change in sky angle/elapsed time.","steps":["Set up the relationship: Angular speed=change in sky angle/elapsed time.","ω=12/3=4 arcseconds/minute."],"answer":"Its average angular speed is 4 arcseconds per minute.","mistake":"Angular speed alone does not specify physical speed without distance information."}
    - {"title":"Convert pixels to sky angle","problem":"An image scale is 2 arcseconds per pixel. An object shifts 5 pixels. Find angular displacement.","rule":"Angular displacement=pixel displacement×angular scale.","steps":["Set up the relationship: Angular displacement=pixel displacement×angular scale.","Δθ=5(2)=10 arcseconds."],"answer":"The sky displacement is 10 arcseconds.","mistake":"Pixels are detector distances, not angular units until a scale is supplied."}
    - {"title":"Separate detector and sky motion","problem":"Across images with a shifted camera pointing, a bright spot stays at the same detector pixel while the stars move. What does that suggest?","rule":"A detector defect stays tied to detector coordinates; a sky source follows the sky-to-detector mapping.","steps":["Changing pointing moves real sky positions across pixels.","The stationary detector spot does not follow that mapping."],"answer":"The pattern supports a detector artifact as a candidate explanation.","mistake":"This diagnostic needs the stated pointing change; one image alone is insufficient."}
    - {"title":"Predict a short motion track","problem":"At times 0,1,2 minutes, a dot is at x=2,5,8 pixels. Use constant image-plane velocity to predict x at 3 minutes.","rule":"x(t)=x0+vt for this short linear approximation.","steps":["Set up the relationship: x(t)=x0+vt for this short linear approximation.","v=(5-2)/1=3 pixels/min; x(3)=2+3(3)=11 pixels."],"answer":"The predicted position is 11 pixels.","mistake":"A short linear track is not a complete gravitational orbit."}
    - {"title":"Convert arcminutes","problem":"Two objects are separated by 3 arcminutes. Express the separation in arcseconds.","rule":"One arcminute equals 60 arcseconds.","steps":["Set up the relationship: One arcminute equals 60 arcseconds.","separation=3(60)=180 arcseconds."],"answer":"The angular separation is 180 arcseconds.","mistake":"Angular minutes are not elapsed-time minutes."}

  stops:
  # --- Stop 1: What moved?
  #     Concept: apparent motion; Keystone: measurement versus inference; Area: Survey Telescope; Learning role: INTRODUCE; Difficulty: L1; Story role: clue.
  #     placement: CHOICE, asked by Lena Ortiz beside scopeboard.
  - group: DISC
    at: scopeboard
    title: "What moved?"
    person: ortiz
    concept: 1   # apparent motion
    reason: "The alert cannot enter orbit analysis until the apparent moving point is distinguished from image artifacts."
    scene: "Six timed images show one faint point beside fixed stars, a long satellite streak, and a known bad detector column. The first task is to identify which pattern can represent one object moving through the sky."
    motivation: "Repeated motion relative to fixed stars determines whether the candidate deserves follow-up as a real sky source."
    format: CHOICE
    question: "Select the observation that is hardest for an artifact to imitate."
    choices:
    - "A point appears once on a known bad detector column."
    - "A point shifts smoothly across four timed frames while stars remain fixed."
    - "A straight bright streak crosses one exposure."
    - "Every star shifts by the same amount after image alignment."
    answer: "A point shifts smoothly across four timed frames while stars remain fixed."
    answerText: "The repeated point moves while the reference stars do not, so it can be one nearby object."
    why: "Differential motion across calibrated images is evidence for a moving source; one-frame features are not."
    # The payload's `rebuttals` map, keyed per wrong option, as the list the
    # verdict prints. Order follows `choices`; the keyed option has none.
    rebuttals:
    - "A detector-fixed feature stays tied to the same pixels and supplies no repeated sky path."
    - "A one-frame streak can be a satellite and does not reproduce the candidate's four timed point detections."
    - "Motion shared by the entire star field signals a registration error, not one nearby moving body."
    # wrong-path feedback, one rebuttal per wrong option:
    #   in the interaction block, keyed per option
    # correct result: Smooth motion in four frames against fixed stars.
    # state/output: Candidate frames gain a REAL-MOTION flag; Stop 2 unlocks.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   question: Which observation best supports a real nearby object?
    #   choices:
    #     - A point appears once on a known bad detector column.
    #     - A point shifts smoothly across four timed frames while stars remain fixed.
    #     - A straight bright streak crosses one exposure.
    #     - Every star shifts by the same amount after image alignment.
    #   answer: A point shifts smoothly across four timed frames while stars remain fixed.
    #   why: Differential motion repeated in calibrated frames supports one moving source without making an orbit or size claim.
    #   rebuttals:
    #     "A point appears once on a known bad detector column.": A detector-fixed feature stays tied to the same pixels and supplies no repeated sky path.
    #     "A straight bright streak crosses one exposure.": A one-frame streak can be a satellite and does not reproduce the candidate's four timed point detections.
    #     "Every star shifts by the same amount after image alignment.": Motion shared by the entire star field signals a registration error, not one nearby moving body.

  # --- Stop 2: Rebuild the discovery chain
  #     Concept: discovery pipeline; Keystone: telescope limits; Area: Survey Telescope; Learning role: PRACTICE; Difficulty: L2; Story role: obstacle.
  #     placement: SEQUENCE, at archive-bench.
  - group: DISC
    at: archive-bench
    title: "Rebuild the discovery chain"
    concept: 18   # discovery pipeline
    reason: "The apparent motion needs an auditable processing history before the discovery alert can be trusted."
    scene: "With physical motion identified, the team must prove that calibration and linking happened before the alert was issued. Rebuild the pipeline so a later reviewer can see where a false point would have entered."
    motivation: "The calibration and linking sequence identifies where a false detection could have entered the discovery chain."
    format: SEQUENCE
    question: "Put the discovery steps in the order needed to make the alert auditable."
    # Converted from the payload's `cards` / `order`. The engine's `order` is a
    # list of card indices, and the payload's order is the cards as written.
    cards:
    - "Calibrate detector and sky coordinates"
    - "Detect sources in each exposure"
    - "Link positions consistent with one moving object"
    - "Compare with known objects and artifact masks"
    - "Issue candidate alert for human review"
    order: [0, 1, 2, 3, 4]
    answerText: "The alert is meaningful because calibrated detections were linked before the candidate was promoted."
    why: "Linking before calibration or artifact checks can turn detector or alignment errors into false motion."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Begin with what converts pixels and timestamps into comparable sky measurements.
    # correct result: Calibration → detection → linking → catalog/artifact comparison → alert.
    # state/output: The pipeline path illuminates; the archive drawer and Stop 3 unlock.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   cards:
    #     - Calibrate detector and sky coordinates
    #     - Detect sources in each exposure
    #     - Link positions consistent with one moving object
    #     - Compare with known objects and artifact masks
    #     - Issue candidate alert for human review
    #   order:
    #     - Calibrate detector and sky coordinates
    #     - Detect sources in each exposure
    #     - Link positions consistent with one moving object
    #     - Compare with known objects and artifact masks
    #     - Issue candidate alert for human review

  # --- Stop 3: Explain every clue
  #     Concept: artifact rejection; Keystone: measurement versus inference; Area: Survey Telescope; Learning role: COMBINE; Difficulty: L3; Story role: clue.
  #     placement: CASEBOOK, asked by Lena Ortiz beside review-desk.
  - group: DISC
    at: review-desk
    title: "Explain every clue"
    person: ortiz
    concept: 6   # artifact rejection
    reason: "The processing order is established, leaving each suspicious image feature needing its own explanation."
    scene: "Because the pipeline is now ordered, each suspicious feature can be tied to a physical cause or left unresolved. Match the frame evidence to explanations before the director accepts the moving point as real."
    motivation: "The evidence matches determine whether known artifacts can explain the candidate's repeated motion or only separate features."
    format: CASEBOOK
    question: "Match each observation to the explanation that accounts for it without contradicting the others."
    # Converted from the payload's `scenarios` / `choices` / `mapping`. The
    # engine reads `mapping` as one choice label per scenario, in scenario order,
    # so the payload's keyed map (candidate / line / fixed_point / stars) becomes
    # the same four labels in the order the scenarios are listed.
    scenarios:
    - "Candidate shifts 18, 19, and 18 arcsec between clean frames."
    - "Bright line crosses only frame 3."
    - "Fixed bright point lies on detector column 1842 in every dark frame."
    - "All catalog stars align within 0.12 arcsec."
    choices:
    - "Smooth moving source"
    - "Satellite trail"
    - "Hot pixel"
    - "Successful image registration"
    mapping:
    - "Smooth moving source"
    - "Satellite trail"
    - "Hot pixel"
    - "Successful image registration"
    answerText: "Each artifact has its own signature, and none explains the candidate's repeated smooth motion."
    why: "A valid explanation must fit the relevant observation without breaking quiet evidence elsewhere."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Ask whether the feature stays on one detector location, crosses one exposure, or moves between sky coordinates.
    # correct result: Candidate→moving source; line→satellite; fixed point→hot pixel; stars→good registration.
    # state/output: Three false features receive labels; the candidate remains unmasked; Stop 4 unlocks.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   scenarios:
    #     - Candidate shifts 18, 19, and 18 arcsec between clean frames.
    #     - Bright line crosses only frame 3.
    #     - Fixed bright point lies on detector column 1842 in every dark frame.
    #     - All catalog stars align within 0.12 arcsec.
    #   choices:
    #     - Smooth moving source
    #     - Satellite trail
    #     - Hot pixel
    #     - Successful image registration
    #   mapping:
    #     candidate: Smooth moving source
    #     line: Satellite trail
    #     fixed_point: Hot pixel
    #     stars: Successful image registration

  # --- Stop 4: Certify only what is known
  #     Concept: claim verification; Keystone: thresholds and verification; Area: Coordination Office; Learning role: TRANSFER; Difficulty: L4; Story role: decision.
  #     placement: ATTEST, asked by Mira Chen beside delivery-desk.
  - group: OPS
    at: delivery-desk
    title: "Certify only what is known"
    person: chen
    concept: 18   # claim verification
    reason: "The discovery review is complete, but the director must not certify an orbit or size it has not measured."
    scene: "Verify the statements that are backed, and leave the tempting unsupported statements unsigned."
    motivation: "The signed claim set distinguishes verified detection from impact and size conclusions still awaiting evidence."
    format: ATTEST
    question: "Sign every claim the evidence supports and no claim that still depends on an assumption."
    answerText: "The range has a credible moving-object detection, not yet an impact prediction."
    why: "Scientific attestation separates direct evidence from model-dependent conclusions."
    # wrong-path feedback, one rebuttal per wrong option:
    #   If a statement requires distance, orbit, albedo, or an unaudited timestamp, it is not yet backed.
    # correct result: Sign motion and artifact rejection only.
    # state/output: Alert status becomes HUMAN-VERIFIED; ORBIT call unlocks; the timestamp CHECK tag persists.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   attest:
    #     verification_limit: 4
    #     claims:
    #       - {id: motion, text: The source moves smoothly in four calibrated frames, backed: true, critical: true}
    #       - {id: artifact, text: Known detector and satellite artifacts do not explain it, backed: true, critical: true}
    #       - {id: time, text: All timestamps are independently verified, backed: false, critical: true}
    #       - {id: impact, text: The object will strike Earth, backed: false, critical: true}
    #       - {id: size, text: The object is about 100 m wide, backed: false, critical: false}
    #     correct_claims: [motion, artifact]
    #     answerText: Certify a real moving source; do not certify its orbit, impact, size, or the one offset timestamp.
    attest:
      claims:
        - id: primary
          label: primary claim for Certify only what is known
          evidence: the signed source reproduces the displayed result
          critical: true
          backed: true
        - id: independent
          label: independent confirmation
          evidence: the independent record agrees within the stated tolerance
          critical: true
          backed: true
        - id: scope
          label: scope and date
          evidence: the record names the population and time window
          backed: true
        - id: extension
          label: stronger untested extension
          evidence: no independent check supports the extension; it must be held
          critical: true
      checks: 3


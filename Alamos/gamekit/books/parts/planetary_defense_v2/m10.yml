    - {"title":"Explain a repeating model mismatch","problem":"A spherical rotating-body model misses a repeated two-part brightness pattern also seen in an independent imaging measurement. What is a useful next model test?","rule":"Independent observations of the same pattern can motivate a more detailed shape model.","steps":["A two-part shape could predict a pattern the sphere cannot represent.","Fit it on existing data, then test its prediction on withheld observations."],"answer":"Test the more detailed model; the pattern alone is not proof that it is correct.","mistake":"Adding complexity must earn predictive improvement, not just a better description of old data."}
    - {"title":"Diameter and cross section","problem":"One sphere has twice another's diameter. Compare projected areas.","rule":"Projected area A=πD²/4.","steps":["Set up the relationship: Projected area A=πD²/4.","A2/A1=(D2/D1)²=2²=4."],"answer":"The larger sphere has four times the projected area.","mistake":"Area scales as diameter squared, not cubed."}
    - {"title":"Recognize a systematic miss","problem":"A model has residuals +2,+2,+2,+2 units at four inputs. Another has -1,+1,-1,+1. What does the first pattern suggest?","rule":"Residuals are observations minus predictions; a repeated offset can indicate bias.","steps":["first mean residual = (2+2+2+2)/4 = +2 units. Every prediction is low.","second mean residual = (-1+1-1+1)/4 = 0 units. Its signed errors cancel, though errors remain."],"answer":"The first model shows a consistent underprediction that should be investigated.","mistake":"A zero mean residual does not by itself prove a model is accurate or free of pattern."}

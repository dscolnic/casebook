    goNow: "Go to the Spectroscopy Dome and meet Sanaa Vale at the photometry bench, then compare her result with radar."
    body: "The single-body model predicts the overall light curve and main radar echo, yet structured residuals remain in both. A repeated mismatch across independent instruments usually points to missing physics. Compare competing shapes, test the radar frames, and diagnose only what both datasets require. By the end of the mission, you will decide whether the asteroid is one compact body or a weak two-lobed system."
    objective: "Decide whether the asteroid is one compact body or a weak two-lobed system."
  objective: "Decide whether the asteroid is one compact body or a weak two-lobed system."

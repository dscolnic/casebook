    at: deflection-desk
    title: "Stress the kinetic impactor"
    person: sen
    concept: "kinetic impactor"
    reason: "The best-case mission must be compared with the lower-bound requirement."
    scene: "Arjun offers a 1,000-kilogram impactor at 10 kilometers per second and grants an optimistic momentum enhancement of three. Compare delivered impulse with demand across the asteroid mass range and weaker enhancement."
    motivation: "Feasibility fails when an optimistic supply remains orders of magnitude below an optimistic demand."
    format: STRESS
    question: "Submit delivered impulse in newton-seconds, the minimum shortfall factor, and one conclusion: FEASIBLE or INFEASIBLE."
    answerText: "The proposed impactor supplies at most about one five-thousandth of nominal demand."
    why: "STRESS compares best-case capacity with worst-relevant requirements."

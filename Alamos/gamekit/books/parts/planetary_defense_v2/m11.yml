  # --- Stop 41: Carry the mass honestly
  #     Concept: mass range; Keystone: estimation/uncertainty; Area: Spectroscopy Dome; Learning role: REINFORCE; Difficulty: L4; Story role: calculation.
  #     placement: BALLPARK, at sizing-board.
  - group: CHAR
    at: sizing-board
    title: "Carry the mass honestly"
    concept: "mass range"
    reason: "Deflection feasibility depends on mass, not diameter alone."
    scene: "Use the 260-meter diameter and plausible rubble-pile densities from 1,200 to 2,400 kilograms per cubic meter in the campaign model. Estimate a mass range and preserve it through the intervention calculation."
    motivation: "A darker, denser, or larger body requires more momentum change for the same velocity change."
    format: BALLPARK
    question: "Submit the lower and upper asteroid mass bounds in kilograms."
    answerText: "The intervention test must succeed across this range, not only at the lightest convenient value."
    why: "BALLPARK carries parameter uncertainty into feasibility bounds."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Density multiplies volume; it cannot be omitted from momentum demand.
    # correct result: Roughly (1.1\times10^{10}) to (2.2\times10^{10}) kg.

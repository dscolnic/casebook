  worked:
    label: "Worked examples"
    title: "Mission 11: worked examples"
    examples:
    - {"title":"A small velocity change over time","problem":"In a straight-line approximation, a sideways speed change Δv=0.01 m/s persists for 10000 s. Find displacement.","rule":"Δx≈Δv×t for constant transverse velocity change.","steps":["Set up the relationship: Δx≈Δv×t for constant transverse velocity change.","Δx=0.01(10000)=100 m."],"answer":"The modeled transverse displacement is 100 m.","mistake":"This approximation omits full orbital dynamics and should not be treated as an exact orbit solution."}
    - {"title":"Impulse and velocity change","problem":"An object has mass 1000 kg. A net impulse of 100 N s acts along one direction. Find velocity change.","rule":"J=mΔv.","steps":["Set up the relationship: J=mΔv.","Δv=J/m=100/1000=0.1 m/s."],"answer":"The velocity changes by 0.1 m/s in the impulse direction.","mistake":"Divide impulse by mass, not multiply it."}
    - {"title":"A specified momentum enhancement","problem":"An incoming projectile carries momentum 20 N s. A toy collision model has enhancement factor β=2. Find delivered impulse.","rule":"J=β p_projectile for the specified model and direction.","steps":["Set up the relationship: J=β p_projectile for the specified model and direction.","J=2(20)=40 N s."],"answer":"The modeled delivered impulse is 40 N s.","mistake":"The enhancement factor must be supplied or supported by evidence; it is not universal."}
    - {"title":"Compare lead times","problem":"For the same desired 100 m displacement, compare constant transverse speed changes over 1000 s and 10000 s.","rule":"Required Δv=desired displacement/lead time.","steps":["Set up the relationship: Required Δv=desired displacement/lead time.","short-time Δv=100/1000=0.1 m/s; long-time Δv=100/10000=0.01 m/s."],"answer":"Ten times more lead time reduces the required change by ten in this approximation.","mistake":"Late action needs a larger change for the same accumulated displacement."}
    - {"title":"Mass of a simple sphere","problem":"A uniform sphere has radius 1 m and density 3 kg/m³ in a toy model. Find mass.","rule":"m=ρV=ρ(4πr³/3).","steps":["Set up the relationship: m=ρV=ρ(4πr³/3).","m=3(4π×1³/3)=4π kg≈12.6 kg."],"answer":"Mass is 4π kg in the stated toy model.","mistake":"Density multiplies volume, not projected area."}


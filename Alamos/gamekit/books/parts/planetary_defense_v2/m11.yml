  # --- Stop 41: Carry the mass honestly
  #     Concept: mass range; Keystone: estimation/uncertainty; Area: Spectroscopy Dome; Learning role: REINFORCE; Difficulty: L4; Story role: calculation.
  #     placement: BALLPARK, at sizing-board.
  - group: CHAR
    at: sizing-board
    title: "Carry the mass honestly"
    concept: 3   # mass range
    reason: "The complex body model leaves a mass range that intervention calculations must preserve."
    scene: "Use the 260-meter diameter and plausible rubble-pile densities from 1,200 to 2,400 kilograms per cubic meter in the campaign model. Estimate a mass range and preserve it through the intervention calculation."
    motivation: "The density-dependent mass interval establishes the range of momentum demand a proposed deflection must meet."
    format: BALLPARK
    question: "Submit the lower and upper asteroid mass bounds in kilograms."
    answerText: "The intervention test must succeed across this range, not only at the lightest convenient value."
    why: "BALLPARK carries parameter uncertainty into feasibility bounds."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Density multiplies volume; it cannot be omitted from momentum demand.
    # correct result: Roughly (1.1\times10^{10}) to (2.2\times10^{10}) kg.
    # state/output: MASS ENVELOPE transferred to IMPACT.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   estimate:
    #     labels: [radius, low-density mass, high-density mass]
    #     values:
    #       - ["D = 260 m", "r = D/2"]
    #       - ["ρlow = 1200 kg/m³", "m = (4/3)πr³ρ"]
    #       - ["ρhigh = 2400 kg/m³", "m = (4/3)πr³ρ"]
    #     slots: [radius_m, low_mass_kg, high_mass_kg]
    #     template: "m = (4/3)π(D/2)³ρ"
    #     formula: spherical mass range
    #     correct: ["130 m", "1.10 × 10^10 kg", "2.21 × 10^10 kg"]
    #     target: 1.66e10
    #     tolerance: 8 percent
    estimate:
      prompt: calculate spherical volume and multiply by the low density; the high bound is twice the result because the high density is twice the low density
      question: lower asteroid mass bound
      labels:
        - 130 m  (Asteroid radius)
        - 1200 kg/m³  (Low rubble-pile density)
        - 2400 kg/m³  (High rubble-pile density)
      values:
        - 130
        - 1200
        - 2400
      slots: 2
      template: m=(4/3)pi({0}^3)({1})
      formula: m=(4/3)pi(130^3)(1200)
      correct:
        - 0
        - 1
      target: 11040000000
      tolerance: 880000000
      units: kg

  # --- Stop 42: Derive the required impulse
  #     Concept: impulse requirement; Keystone: mechanics/derivation; Area: Entry & Consequences Lab; Learning role: INTRODUCE; Difficulty: L5; Story role: calculation.
  #     placement: DERIVE, at deflection-desk.
  - group: IMPACT
    at: deflection-desk
    title: "Derive the required impulse"
    concept: 15   # impulse requirement
    reason: "The remaining warning time must be translated into the velocity change needed to avoid the encounter."
    scene: "Grant the defender eight days of useful lead time and require 6,400 kilometers of accumulated displacement. Derive the velocity change and nominal impulse, treating the straight-line estimate as deliberately optimistic."
    motivation: "The optimistic displacement and impulse requirement provides a lower-demand benchmark for evaluating the proposed defender."
    format: DERIVE
    question: "Submit Δv in metres per second and J in newton-seconds."
    answerText: "Even the simplified lower bound is enormous for a launch-ready response."
    why: "DERIVE builds the requirement from displacement, time, and momentum definitions."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Eight days is seconds, and 6,400 kilometers is meters before division.
    # correct result: About 9.3 m/s and (1.5\times10^{11}) N·s.
    # state/output: REQUIRED IMPULSE posted.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:
    #     givens:
    #       miss_distance_m: 6.4e6
    #       warning_time_s: 691200
    #       asteroid_mass_kg: 1.66e10
    #     candidate_lines:
    #       - {id: line_1, expression: "Δv = Δx/t", license: constant transverse velocity change over the stated interval}
    #       - {id: line_2, expression: "Δv = (6.4 × 10^6 m)/(691200 s) = 9.26 m/s", license: substitute displayed values with SI units}
    #       - {id: line_3, expression: "J = mΔv", license: impulse equals change in momentum}
    #       - {id: line_4, expression: "J = (1.66 × 10^10 kg)(9.26 m/s) = 1.54 × 10^11 N·s", license: substitute the adopted mass}
    #     keyed_order: [line_1, line_2, line_3, line_4]
    #     decoys:
    #       - {id: decoy_multiply_time, expression: "Δv = Δx t", fails_because: displacement from a fixed velocity change is proportional to time, so solving for velocity requires division}
    #       - {id: decoy_divide_mass, expression: "J = Δv/m", fails_because: impulse equals mass times velocity change}
    #     correct: {delta_v_m_per_s: 9.26, impulse_Ns: 1.54e11}
    #     requested_units: [m/s, N·s]
    derive:
      start: Begin with the complete starting relation on the card. Preserve its named left side on every line.
      goal: Derive the required impulse in the form and units requested by the prompt
      steps:
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: Δv = Δx/t
            - text: Δv=Δx t
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: Δv = (6.4 × 10^6 m)/(691200 s) = 9.26 m/s
            - text: Δv = (6.4 × 10^6 m)(691200 s) = 4.42 × 10^12 m*s
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: J = mΔv
            - text: J=Δv/m
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."
              survives: true
        - ask: select the next licensed transformation
          answer: 0
          candidates:
            - text: J = (1.66 × 10^10 kg)(9.26 m/s) = 1.54 × 10^11 N·s
            - text: J = (9.26 m/s)/(1.66 × 10^10 kg) = 5.58 × 10^-10 m/(kg*s)
              why: "This is the common mistake for this step: it changes a sign, operation, unit, dependency, or governing rule used by the authored correct line."

  # --- Stop 44: Choose the useful action
  #     Concept: response portfolio; Keystone: decisions/value; Area: Emergency Management Office; Learning role: REINFORCE; Difficulty: L5; Story role: decision.
  #     placement: VALUE, asked by Arjun Sen beside scopeboard.
  - group: TOWN
    at: scopeboard
    title: "Choose the useful action"
    person: sen
    concept: 15   # response portfolio
    reason: "The intervention gap leaves the last budget needing an achievable harm-reduction objective."
    scene: "The last budget can fund a symbolic impactor, corridor observations, civil-defense preparation, or a public demonstration. Rank all four by expected harm reduction under the verified warning time and intervention gap."
    motivation: "The ranked uses determine whether money supports useful corridor observations and protection instead of an ineffective symbolic launch."
    format: VALUE
    question: "Spend at most 100 credits and choose the action portfolio with the greatest expected value."
    # Converted from the payload's `value`. Its `budget` object becomes the
    # engine's; each option keeps its own id, label, cost and axis, and its
    # `decision_value` line becomes what the option `reveals`. The payload's
    # keyed `correct` pair — corridor observations and civil defense, 100
    # credits together — is what the engine calls `decisive`.
    value:
      budget: { amount: 100, unit: response credits }
      decision: "Refines who is at risk while funding actions that can still reduce harm."
      options:
      - { id: symbolic_impactor, label: Launch symbolic impactor, cost: 80, axis: prevention, reveals: negligible decision value }
      - { id: corridor_observations, label: Fund corridor-refining observations, cost: 45, axis: location, reveals: high decision value, decisive: true }
      - { id: civil_defense, label: Begin reversible civil-defense preparation, cost: 55, axis: exposure, reveals: high decision value, decisive: true }
      - { id: public_demo, label: Fund a public technology demonstration, cost: 25, axis: communication, reveals: low decision value }
    answerText: "Refusing an impossible intervention protects the actions that can still reduce harm."
    why: "VALUE compares expected decision benefit and opportunity cost."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Hope is not added momentum, and a launch can consume the warning time it cannot overcome.
    # correct result: Fund corridor observations and civil-defense preparation; do not launch.
    # state/output: DEFLECTION BRANCH CLOSED; RESPONSE BRANCH EXPANDED.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   value:
    #     budget: {value: 100, unit: response_credits}

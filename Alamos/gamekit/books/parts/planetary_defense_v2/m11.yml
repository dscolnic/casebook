  # --- Stop 42: Derive the required impulse
  #     Concept: impulse requirement; Keystone: mechanics/derivation; Area: Entry & Consequences Lab; Learning role: INTRODUCE; Difficulty: L5; Story role: calculation.
  #     placement: DERIVE, at deflection-desk.
  - group: IMPACT
    at: deflection-desk
    title: "Derive the required impulse"
    concept: "impulse requirement"
    reason: "The team needs a transparent lower-bound demand before evaluating any mission concept."
    scene: "Grant the defender eight days of useful lead time and require 6,400 kilometers of accumulated displacement. Derive the velocity change and nominal impulse, treating the straight-line estimate as deliberately optimistic."
    motivation: "Short warning time forces a much larger velocity change than early interception."
    format: DERIVE
    question: "Submit two numerical results with units: minimum Δv in meters per second and nominal impulse J in newton-seconds."
    answerText: "Even the simplified lower bound is enormous for a launch-ready response."
    why: "DERIVE builds the requirement from displacement, time, and momentum definitions."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Eight days is seconds, and 6,400 kilometers is meters before division.
    # correct result: About 9.3 m/s and (1.5\times10^{11}) N·s.
    # state/output: REQUIRED IMPULSE posted.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:
    #     givens:
    #       miss_distance_m: 6.4e6
    #       warning_time_s: 691200
    #       asteroid_mass_kg: 1.66e10
    #     candidate_lines:
    #       - {id: line_1, expression: "Δv = Δx/t", license: constant transverse velocity change over the stated interval}
    #       - {id: line_2, expression: "Δv = (6.4 × 10^6 m)/(691200 s) = 9.26 m/s", license: substitute displayed values with SI units}
    #       - {id: line_3, expression: "J = mΔv", license: impulse equals change in momentum}
    #       - {id: line_4, expression: "J = (1.66 × 10^10 kg)(9.26 m/s) = 1.54 × 10^11 N·s", license: substitute the adopted mass}
    #     keyed_order: [line_1, line_2, line_3, line_4]
    #     decoys:
    #       - {id: decoy_multiply_time, expression: "Δv = Δx t", fails_because: displacement from a fixed velocity change is proportional to time, so solving for velocity requires division}
    #       - {id: decoy_divide_mass, expression: "J = Δv/m", fails_because: impulse equals mass times velocity change}
    #     correct: {delta_v_m_per_s: 9.26, impulse_Ns: 1.54e11}
    #     requested_units: [m/s, N·s]

  # --- Stop 43: Stress the kinetic impactor
  #     Concept: kinetic impactor; Keystone: feasibility/assumptions; Area: Entry & Consequences Lab; Learning role: INTRODUCE; Difficulty: L5; Story role: analysis.
  #     placement: STRESS, asked by Arjun Sen beside deflection-desk.

- title: "One Push"
  card:
    header: "IMPACT WINDOW: 4 DAYS"
    title: "ONE PUSH"
    goNow: "Go to the Spectroscopy Dome for the mass estimate, continue to the Consequences Lab, and deliver the feasibility result to Mira Chen at Coordination."
    body: "A small early velocity change can become a large later miss, but only when time remains for that separation to grow. With eleven days at discovery and fewer now, slogans about deflection may outrun physics. Estimate the needed impulse, compare a credible kinetic impactor, and stress the assumptions. By the end of the mission, you will decide whether to attempt space deflection or shift fully to consequence reduction."
    objective: "Decide whether space deflection is physically credible with the remaining warning time."
  objective: "Decide whether space deflection is physically credible with the remaining warning time."
  stake: "A small early velocity change can become a large later miss, but only when time remains for that separation to grow. With eleven days at discovery and fewer now, slogans about deflection may outrun physics. Estimate the needed impulse, compare a credible kinetic impactor, and stress the assumptions. By the end of the mission, you will decide whether to attempt space deflection or shift fully to consequence reduction."
  takeaway: "The scientifically brave answer can be no. ---"
  segue: "Mission decision: Do not try to push the body now. The best ready craft falls short by more than 3,300 times. Move all spare work to path checks and harm reduction."

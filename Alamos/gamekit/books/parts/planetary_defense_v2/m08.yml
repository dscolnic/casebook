  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 8: worked examples"
    examples:
    - {"title":"Combine independent estimates","problem":"Independent unbiased estimates are 10±1 and 14±2 units, with quoted independent Gaussian standard uncertainties. Find their inverse-variance weighted mean.","rule":"Weights are 1/σ²; weighted mean=sum(w x)/sum(w).","steps":["Set up the relationship: Weights are 1/σ²; weighted mean=sum(w x)/sum(w).","weights=1 and 1/4; mean=(10+14/4)/(1+1/4)=13.5/1.25=10.8."],"answer":"The weighted mean is 10.8 units, closer to the more precise estimate.","mistake":"Shared systematic errors invalidate treating the estimates as independent in this combination."}
    - {"title":"Correlated coordinate errors","problem":"Two estimated coordinates each change when the same image rotation is corrected. Can their errors be treated as independent automatically?","rule":"A common calibration parameter can correlate coordinate errors.","steps":["Changing that parameter moves both coordinates in a linked way.","A joint uncertainty description should retain that relationship instead of multiplying separate independent probabilities."],"answer":"Independence is not justified solely because the coordinates have different names.","mistake":"Ignoring covariance can distort the allowed region of positions."}
    - {"title":"Count collision-compatible paths","problem":"In a deliberately equally weighted toy sample of 100 possible paths, 8 cross a target. Estimate collision probability within this sample.","rule":"For equally weighted representative paths, probability estimate=hits/total.","steps":["Set up the relationship: For equally weighted representative paths, probability estimate=hits/total.","p=8/100=0.08=8%."],"answer":"The sample estimate is 8%, conditional on the model and equal weighting.","mistake":"Unweighted counting is invalid if the paths carry unequal probabilities."}
    - {"title":"Count independent evidence sources","problem":"Three reports copy one balance reading. A fourth report uses a separately calibrated balance. How many measurement sources are there?","rule":"Reports are not independent measurements when they copy a common source.","steps":["source group 1 = the first balance and its three copies. Count that measurement once.","source group 2 = the second balance. It adds a separate measurement route."],"answer":"There are two measurement sources, not four.","mistake":"Agreement among copies cannot establish independent confirmation."}
    - {"title":"A simple uncertainty interval","problem":"A coordinate estimate is 10 units with standard uncertainty σ=2 units. Give the center ±3σ interval.","rule":"The stated three-sigma interval is estimate ±3×standard uncertainty.","steps":["Set up the relationship: The stated three-sigma interval is estimate ±3×standard uncertainty.","interval=[10-3(2),10+3(2)]=[4,16]."],"answer":"The interval is 4 to 16 units; a probability interpretation needs a distribution model.","mistake":"Three-sigma language alone does not prove a Gaussian error model."}

  stops:
  # --- Stop 29: Transfer the evidence chain
  #     Concept: data fusion; Keystone: provenance; Area: Orbit Determination Center; Learning role: REINFORCE; Difficulty: L4; Story role: evidence.
  #     placement: CHAIN, at radar-console.
  - group: ORBIT
    at: radar-console
    title: "Transfer the evidence chain"
    concept: 18   # data fusion
    reason: "The released radar products include shared corrections that could be mistaken for independent confirmations."
    scene: "Four radar products are ready, but two inherit the same archive-clock correction and cannot count as independent confirmation. Build the evidence chain from raw packets through calibration to released range and Doppler products."
    motivation: "The product dependencies determine which measurements supply new evidence and which carry the same timing uncertainty."
    format: CHAIN
    question: "Submit the completed evidence chain and name the correction shared by the range and Doppler products."
    answerText: "Shared correction C links two products even though their reported units differ."
    why: "CHAIN exposes dependency through transformations."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Different output columns do not guarantee independent error sources.
    # correct result: Mark A-products as correlated; preserve B-range as independent.
    # state/output: FUSION MANIFEST signed; travel to ORBIT.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   chain:
    #     transfers:
    #       - {id: raw_a, label: Raw packet A to correction C, carries: uncorrected echo samples and archive time}
    #       - {id: range_a, label: Correction C to range product A, carries: corrected round-trip delay}
    #       - {id: doppler_a, label: Correction C to Doppler product A, carries: corrected frequency shift and shared time provenance}
    #       - {id: raw_b, label: Raw packet B to clock B, carries: independent echo samples and time}
    #       - {id: range_b, label: Clock B to range product B, carries: independent round-trip delay}
    #       - {id: gain, label: Calibration pulse to gain model, carries: echo-power calibration}
    #     order: [raw_a, range_a, doppler_a, raw_b, range_b, gain]
    #     decoys:
    #       - {id: independent_a_products, label: Treat range A and Doppler A as independent}
    #       - {id: clock_b_to_a, label: Route packet A through independent clock B}
    #     governing_relationship: Range A and Doppler A share correction C; range B has an independent clock path.
    #     correct: [raw_a, range_a, doppler_a, raw_b, range_b, gain]
    chain:
      links:
        - id: raw_a
          label: Raw packet A to correction C
          transfers: uncorrected echo samples and archive time
        - id: range_a
          label: Correction C to range product A
          transfers: corrected round-trip delay
        - id: doppler_a
          label: Correction C to Doppler product A
          transfers: corrected frequency shift and shared time provenance
        - id: raw_b
          label: Raw packet B to clock B
          transfers: independent echo samples and time
        - id: range_b
          label: Clock B to range product B
          transfers: independent round-trip delay
        - id: gain
          label: Calibration pulse to gain model
          transfers: echo-power calibration
      order:
        - raw_a
        - range_a
        - doppler_a
        - raw_b
        - range_b
        - gain
      governing: range_a
      distractor: gain

  # --- Stop 30: Balance the fit
  #     Concept: weighted fit; Keystone: uncertainty/modeling; Area: Orbit Determination Center; Learning role: INTRODUCE; Difficulty: L5; Story role: model.
  #     placement: BALANCE, at fit-board.
  - group: ORBIT
    at: fit-board
    title: "Balance the fit"
    concept: 11   # weighted fit
    reason: "The orbit fit must combine precise radar range with the longer optical baseline without counting correlated products twice."
    scene: "The radar range has tiny uncertainty, while optical positions provide the longer time baseline and transverse motion. Balance the datasets by documented uncertainty and correlation, then reject equal weighting and simple vote counting."
    motivation: "Uncertainty-aware weighting determines how each dataset constrains the fitted trajectory rather than letting record count decide."
    format: BALLPARK
    question: "Optical position has uncertainty 2 units and the independent radar range has uncertainty 1 unit. Using inverse-variance weights and treating the two correlated radar products as one stream, submit the radar stream's normalized weight and justify the covariance grouping."
    answerText: "Precision controls weight, covariance prevents double-counting, and optical timing preserves transverse information."
    why: "BALANCE trades influence according to information content and dependence."
    # wrong-path feedback, one rebuttal per wrong option:
    #   The smallest error bar does not make every other geometric constraint irrelevant.
    # correct result: Weight by uncertainty while grouping correlated radar products.
    # state/output: COMBINED FIT converges; Stop 31 unlocks.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   balance:
    #     target: {label: Defensible fused orbit, value: one, unit: solution}
    #     streams:
    #       - {id: optical, label: Optical sky-plane positions, information: sky-plane position and long time baseline, correlation_group: optical_pipeline, count: true}
    #       - {id: radar_range, label: Independent radar range, information: line-of-sight distance, correlation_group: radar_clock, count: true}
    #       - {id: radar_doppler, label: Radar Doppler, information: radial motion, correlation_group: radar_clock, count: true}
    #       - {id: clock_diagnostic, label: Archive-clock diagnostic, information: provenance for radar products, correlation_group: radar_clock, count: false}
    #     candidates:
    #       - Equal weight per row
    #       - Radar only
    #       - Inverse-variance weighting with covariance groups
    #       - Majority vote by observatory
    #     correctChoice: Inverse-variance weighting with covariance groups
    #     rationale: Weight by documented uncertainty while preventing correlated products from being counted as independent.
    estimate:
      prompt: radar inverse variance divided by the sum of optical and radar inverse variances
      question: normalized weight of the independent radar stream
      labels:
        - 2 relative units  (Optical uncertainty)
        - 1 relative units  (Radar uncertainty)
      values:
        - 2
        - 1
      slots: 2
      template: w_radar=({0}/1^{1})/[(1/2^2)+(1/1^2)]
      formula: w_radar=(1/1^2)/[(1/2^2)+(1/1^2)]
      correct:
        - 1
        - 0
      target: 0.8
      tolerance: 0.02
      units: normalized likelihood weight
      explanation: Mixing a contextual reading into the arithmetic or reversing the subtraction.

  # --- Stop 31: Read the b-plane cloud
  #     Concept: encounter uncertainty; Keystone: probability/visualization; Area: Orbit Determination Center; Learning role: REINFORCE; Difficulty: L5; Story role: interpretation.
  #     placement: CLOUD, at astro-bench.
  - group: ORBIT
    at: astro-bench
    title: "Read the b-plane cloud"
    concept: 11   # encounter uncertainty
    reason: "The combined fit is ready to translate its encounter distribution into a planning probability."
    scene: "The combined trials form a narrow cloud crossing Earth's b-plane disk; 63 percent intersect the disk. Classify the remaining miss solutions and state what the cloud does and does not establish."
    motivation: "The impact and miss fractions determine whether impact is the leading case while preserving material uncertainty."
    format: CHOICE
    question: "Submit the impact and miss fractions in percent and one operational conclusion: IMPACT LEADING CASE or IMPACT CERTAIN."
    answerText: "Planning should intensify while observations continue to test both impact and miss solutions."
    why: "A probability cloud represents distributed uncertainty, not a single certain track."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A nominal trajectory cannot replace the ensemble that produced the probability.
    # correct result: Impact is the leading case at 63%, with a material 37% miss set.
    # state/output: IMPACT PROBABILITY 63%; corridor work unlocks.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   cloud:
    #     total_weighted_trials: 10000
    #     impact_trials: 6300
    #     miss_trials: 3700
    #     points:
    #       - {id: impact_set, setting: Earth intersection, reading: 6300 weighted trials}
    #       - {id: miss_set, setting: outside Earth, reading: 3700 weighted trials}
    #     equation: probability_percent = count / total_weighted_trials * 100
    #     expected: {impact_percent: 63, miss_percent: 37}
    #     correct_conclusion: impact_leading_case
    #     rejected_conclusion: impact_certain
    choices:
      - Impact is the leading case at 63%, with a material 37% miss set.
      - Treat the settings table as the conclusion without reading the pattern.
      - Claim a cause or trend stronger than the displayed readings support.
    answer: Impact is the leading case at 63%, with a material 37% miss set.
    rebuttals:
      - Settings are inputs; the measured cloud or pattern is the evidence.
      - The observations support the bounded conclusion, not the stronger claim.
    cloud:
      bounds: {}

  # --- Stop 32: Stress the planning sentence
  #     Concept: robust conclusion; Keystone: decisions/uncertainty; Area: Orbit Determination Center; Learning role: REINFORCE; Difficulty: L5; Story role: decision.
  #     placement: STRESS, asked by Malik Rowan beside fit-board.
  - group: ORBIT
    at: fit-board
    title: "Stress the planning sentence"
    person: rowan
    concept: 11   # robust conclusion
    reason: "The leading-case result needs testing against alternative error assumptions before preparations intensify."
    scene: "Malik reruns the fit with conservative optical errors, doubled radar errors, and each observatory removed once. Probabilities range from 55 to 69 percent, so test which proposed planning statement survives every run."
    motivation: "The probability range determines which planning statement remains defensible across all justified refits."
    format: STRESS
    question: "Submit the minimum and maximum probability in percent and one statement that survives every test."
    answerText: "Every justified run remains above 50%, but none removes location uncertainty."
    why: "Stress testing separates a stable decision from unstable precision."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Do not promote a robust majority into certainty or a fixed impact point.
    # correct result: State that impact is the leading case and preparation should intensify.
    # state/output: 63% CONDITIONAL UPDATE released.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   stress:
    #     assumption_runs:
    #       - {label: conservative optical errors, probability_percent: 55}
    #       - {label: doubled radar errors, probability_percent: 59}
    #       - {label: leave-one-observatory-out, probability_percent: [57, 69]}
    #     planning_boundary_percent: 50
    #     candidates:
    #       - Impact is certain
    #       - No action is needed
    #       - Impact remains the leading case and preparation should intensify
    #       - The exact corridor is fixed
    #     correctChoice: Impact remains the leading case and preparation should intensify
    #     correct_conclusion: impact_remains_leading_case_and_preparation_intensifies
    stress:
      candidates:
        - id: nominal_only
          label: Use only the nominal reading
        - id: common_extreme_mistake
          label: Use the favorable extreme as if it were guaranteed
        - id: robust_plan
          label: State that impact is the leading case and preparation should intensify.
      criteria:
        - key: evidence_fit
          label: fit to the stop evidence
        - key: safety_margin
          label: margin at the adverse end
      scores:
        nominal_only:
          evidence_fit: 95
          safety_margin: 20
        common_extreme_mistake:
          evidence_fit: 88
          safety_margin: 5
        robust_plan:
          evidence_fit: 82
          safety_margin: 92
      feasible:
        nominal_only: 4.5
        common_extreme_mistake: 4.5
        robust_plan: 1
      assumption:
        label: impact probability
        unit: "%"
        min: 1
        max: 8
        nominal: 4.5
        step: 1
      robust: robust_plan
      optimiseOn: evidence_fit


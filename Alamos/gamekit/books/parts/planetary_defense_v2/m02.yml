  stops:
  # --- Stop 5: Measure the sky rate
  #     Concept: angular rate; Keystone: angles/time; Area: Orbit Determination Center; Learning role: PRACTICE; Difficulty: L2; Story role: foundation.
  #     placement: BALLPARK, at astro-bench.
  - group: ORBIT
    at: astro-bench
    title: "Measure the sky rate"
    concept: "angular rate"
    reason: "The orbit solver needs a checked angular rate before it searches three-dimensional paths."
    scene: "The verified point moves 37 arcseconds during a 24-minute clean interval while the reference stars remain fixed. Estimate its hourly angular rate so the orbit search begins in the correct region."
    motivation: "A wrong rate would make the solver explore paths that never match the measured sky motion."
    format: BALLPARK
    question: "Using the displayed values, submit one angular rate ω in arcseconds per hour."
    # Converted from the payload's `estimate`. Each tile carries the payload's own
    # value beside the payload's own label, so the tile says what it is worth;
    # `slots` is the count of tiles the panel takes, `correct` their indices, and
    # `formula` the same arithmetic as the payload's template, in slot order.
    # `tolerance` is the payload's "10 percent" of 92.5 = 9.25, which is the
    # 83-102 arcsec/hour band the stop's own correct-result line states.
    estimate:
      prompt: "The verified point moves 37 arcseconds during a 24-minute clean interval."
      question: "Using the displayed values, submit one angular rate ω in arcseconds per hour."
      relationship: "rate = angular shift / time"
      labels:
      - "37 arcsec  (angular shift)"
      - "24 min  (elapsed time)"
      - "60 min/hour  (minutes per hour)"
      values: [37, 24, 60]
      slots: 3
      correct: [0, 1, 2]
      template: "{0} / {1} × {2}"
      formula: "a/b*c"
      target: 92.5
      tolerance: 9.25
      units: "arcsec/hour"
    answerText: "The object moves about 93 arcseconds per hour."
    why: "Rate is angular displacement divided by elapsed time, then scaled to one hour."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Keep arcseconds in the numerator and convert 24 minutes to a fraction of an hour.
    # correct result: 92.5 arcsec/hour; accept 83-102 arcsec/hour.
    # state/output: Rate enters the orbit solver; Stop 6 unlocks.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   estimate:
    #     labels: [angular shift, elapsed time, minutes per hour]
    #     values: [[37 arcsec], [24 min], [60 min/hour]]
    #     slots: [numerator, denominator, scale]
    #     template: 37 arcsec / 24 min × 60 min/hour
    #     formula: rate = angular shift / time
    #     target: 92.5
    #     correct: 93 arcsec/hour
    #     tolerance: 10 percent

  # --- Stop 6: Add geometric leverage
  #     Concept: distance constraint; Keystone: orbit geometry; Area: Orbit Determination Center; Learning role: INTRODUCE; Difficulty: L3; Story role: obstacle.
  #     placement: TRIANGULATE, at astro-bench.
  - group: ORBIT
    at: astro-bench
    title: "Add geometric leverage"
    concept: "distance constraint"
    reason: "Angular rate alone leaves nearby slow and distant fast trajectories mixed together."
    scene: "With the sky rate established, the solver still permits trajectories at very different distances and speeds. Switch in the separated-station observation and the exact observer locations to isolate the region where both sight lines cross."
    motivation: "The intersection adds distance information that one telescope direction cannot supply."
    format: TRIANGULATE
    question: "Activate the constraints and correction that provide a physical distance estimate."
    answerText: "Parallax places the object near 0.08 AU while preserving a family of velocities."
    why: "Separated observing sites view a nearby object from measurably different directions."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Brightness mixes distance, size, phase, and albedo; it is not a direct geometric range.
    # correct result: Use both sight lines, surveyed baseline, and station-position correction; range 0.071-0.089 AU.
    # state/output: Orbit family contracts to 240 solutions; Stop 7 unlocks.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   triangulate:
    #     constraints:
    #       - {id: alto, label: Cerro Alto line of sight, bearing_arcsec: 0.0, sigma_arcsec: 0.20}
    #       - {id: east, label: East station line of sight, bearing_arcsec: 1.7, sigma_arcsec: 0.25}
    #       - {id: baseline, label: Station separation, value_km: 1.31, systematic: 0.05}
    #     corrections:
    #       - {id: station_position, label: Apply surveyed station coordinates, correct: true}
    #       - {id: brightness, label: Use apparent brightness as direct range, correct: false}
    #     truth_region: 0.071 to 0.089 AU
    #     answerText: The two sight lines constrain the object to roughly 0.08 AU; brightness alone cannot.

  # --- Stop 7: Refuse the prettiest fit
  #     Concept: model adequacy; Keystone: astrometry/residuals; Area: Orbit Determination Center; Learning role: COMBINE; Difficulty: L4; Story role: reversal.
  #     placement: RESIDUAL, at fit-board.
  - group: ORBIT
    at: fit-board
    title: "Refuse the prettiest fit"
    concept: "model adequacy"
    reason: "Two orbit families survive, and the smallest RMS belongs to the one with a visible error pattern."
    scene: "Because distance has narrowed, only two candidate orbit families remain, with nearly identical average residuals. Compare their residual fields and reject the fit that hides a systematic curve behind a slightly smaller RMS."
    motivation: "The accepted residual pattern controls which future encounter family is propagated toward Earth."
    format: RESIDUAL
    question: "Choose the orbit family that is scientifically safer to propagate."
    answerText: "Keep Model B; Model A's residuals sweep from negative to positive and reveal missing curvature."
    why: "Random scatter can reflect measurement noise, while ordered residuals indicate model misspecification."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Do not rank only by RMS; inspect whether the sign and size change systematically with time.
    # correct result: Model B.
    # state/output: Model A is tagged REJECTED: PATTERNED; Stop 8 unlocks.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   residual:
    #     models:
    #       - id: A
    #         rms_arcsec: 0.18
    #         residuals_arcsec: [-0.24, -0.16, -0.05, 0.07, 0.15, 0.25]
    #       - id: B
    #         rms_arcsec: 0.21
    #         residuals_arcsec: [0.18, -0.22, 0.09, -0.19, 0.24, -0.11]
    #     correct_model: B
    #     correct_conclusion: keep_model_B_and_reject_patterned_model_A
    #     pattern_to_reject: monotonic curvature
    #     answerText: Model B has slightly larger RMS but random residuals; Model A is systematically wrong.

  # --- Stop 8: Propagate the allowed cloud
  #     Concept: impact probability; Keystone: uncertainty/covariance; Area: Orbit Determination Center; Learning role: INTRODUCE; Difficulty: L4; Story role: decision.
  #     placement: CLOUD, at fit-board.
  - group: ORBIT
    at: fit-board
    title: "Propagate the allowed cloud"
    concept: "impact probability"
    reason: "Continuous monitoring is justified only if a meaningful part of the allowed orbit cloud reaches Earth."
    scene: "With the biased fit removed, 240 weighted orbit solutions remain and the nominal path still misses Earth. Propagate the full cloud to the encounter date and measure how much probability intersects Earth's effective cross section."
    motivation: "The cloud, not the best-fit line, determines whether the object enters impact monitoring."
    format: CLOUD
    question: "Submit the weighted impact probability in percent and one conclusion: CONTINUOUS MONITORING or RELEASE FROM MONITORING."
    answerText: "The best-fit line misses, but 3.2% of the allowed probability reaches Earth."
    why: "Impact probability integrates the uncertainty distribution over Earth's effective collision region."

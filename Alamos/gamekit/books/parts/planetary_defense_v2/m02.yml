- title: "Six Points Are Not an Orbit"
  card:
    header: "IMPACT WINDOW: 10 DAYS, 18 HOURS"
    title: "SIX POINTS ARE NOT AN ORBIT"
    goNow: "Go to Orbit Determination and meet Malik Rowan, orbit-determination lead, at the astro-bench."
    body: "The last mission proved that the point is real, but six directions on the sky do not reveal one unique path. An orbit fit finds the trajectories that gravity can carry through every timed position. At Orbit Determination, estimate the motion, combine geometric constraints, and inspect the residual pattern. By the end of the mission, decide whether 2026 PDC belongs on continuous Earth-impact monitoring."
    objective: "Determine whether the allowed orbit family includes a credible Earth encounter."
  objective: "Determine whether the allowed orbit family includes a credible Earth encounter."
  stake: "The last mission proved that the point is real, but six directions on the sky do not reveal one unique path. An orbit fit finds the trajectories that gravity can carry through every timed position. At Orbit Determination, estimate the motion, combine geometric constraints, and inspect the residual pattern. By the end of the mission, decide whether 2026 PDC belongs on continuous Earth-impact monitoring."
  takeaway: "A nominal miss is not zero risk when uncertainty still reaches Earth. ---"
  segue: "Mission decision: Keep 2026 PDC on the Earth watch list. The best path misses Earth. Yet 3.2% of the allowed paths hit it. The team needs more data before it can act."
  # The mission card's own "Primer concepts", printed on the plan card.
  primer:
  - "A sky direction does not directly give distance."
  - "A short observing arc can fit many different three-dimensional orbits."
  - "Random residuals can be acceptable; a pattern can expose a wrong model."


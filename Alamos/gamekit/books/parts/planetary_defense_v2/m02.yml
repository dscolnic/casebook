    #     weighted_impact_fraction: 0.032
    #     correct_conclusion: continuous_monitoring
    #     answerText: 3.2% of the weighted allowed cloud impacts Earth, so continuous monitoring is warranted.
    choices:
      - Include all weighted solutions and focusing; 3.2%; continuous monitoring.
      - Treat the settings table as the conclusion without reading the pattern.
      - Claim a cause or trend stronger than the displayed readings support.
    answer: Include all weighted solutions and focusing; 3.2%; continuous monitoring.

  stops:
  # --- Stop 5: Measure the sky rate
  #     Concept: angular rate; Keystone: angles/time; Area: Orbit Determination Center; Learning role: PRACTICE; Difficulty: L2; Story role: foundation.
  #     placement: BALLPARK, at astro-bench.
  - group: ORBIT
    at: astro-bench
    title: "Measure the sky rate"
    concept: 1   # angular rate
    reason: "The verified detection needs a rate of sky motion to initialize the orbit search."
    scene: "The verified point moves 37 arcseconds during a 24-minute clean interval while the reference stars remain fixed. Estimate its hourly angular rate so the orbit search begins in the correct region."
    motivation: "The hourly angular rate constrains the search without pretending that angular motion alone establishes physical speed."
    format: BALLPARK
    question: "Using the displayed values, submit one angular rate ω in arcseconds per hour."
    # Converted from the payload's `estimate`. Each tile carries the payload's own
    # value beside the payload's own label, so the tile says what it is worth;
    # `slots` is the count of tiles the panel takes, `correct` their indices, and
    # `formula` the same arithmetic as the payload's template, in slot order.
    # `tolerance` is the payload's "10 percent" of 92.5 = 9.25, which is the
    # 83-102 arcsec/hour band the stop's own correct-result line states.
    estimate:
      prompt: "The verified point moves 37 arcseconds during a 24-minute clean interval."
      question: "Using the displayed values, submit one angular rate ω in arcseconds per hour."
      relationship: "rate = angular shift / time"
      labels:
      - "37 arcsec  (angular shift)"
      - "24 min  (elapsed time)"
      - "60 min/hour  (minutes per hour)"
      values: [37, 24, 60]
      slots: 3
      correct: [0, 1, 2]
      template: "{0} / {1} × {2}"
      formula: "a/b*c"
      target: 92.5
      tolerance: 9.25
      units: "arcsec/hour"
    answerText: "The object moves about 93 arcseconds per hour."
    why: "Rate is angular displacement divided by elapsed time, then scaled to one hour."
    # wrong-path feedback, one rebuttal per wrong option:

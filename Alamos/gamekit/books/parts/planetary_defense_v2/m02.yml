  # --- Stop 6: Add geometric leverage
  #     Concept: distance constraint; Keystone: orbit geometry; Area: Orbit Determination Center; Learning role: INTRODUCE; Difficulty: L3; Story role: obstacle.
  #     placement: TRIANGULATE, at astro-bench.
  - group: ORBIT
    at: astro-bench
    title: "Add geometric leverage"
    concept: 22   # distance constraint
    reason: "The measured sky rate still allows objects at different distances to fit the discovery images."
    scene: "With the sky rate established, the solver still permits trajectories at very different distances and speeds. Switch in the separated-station observation and the exact observer locations to isolate the region where both sight lines cross."
    motivation: "The separated-station geometry constrains physical range while leaving velocity uncertainty for later observations."
    format: CHOICE
    question: "Choose the constraint-and-range conclusion that provides a defensible physical distance estimate."
    answerText: "Parallax places the object near 0.08 AU while preserving a family of velocities."
    why: "Separated observing sites view a nearby object from measurably different directions."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Brightness mixes distance, size, phase, and albedo; it is not a direct geometric range.
    # correct result: Use both sight lines, surveyed baseline, and station-position correction; range 0.071-0.089 AU.
    # state/output: Orbit family contracts to 240 solutions; Stop 7 unlocks.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   triangulate:
    #     constraints:
    #       - {id: alto, label: Cerro Alto line of sight, bearing_arcsec: 0.0, sigma_arcsec: 0.20}
    #       - {id: east, label: East station line of sight, bearing_arcsec: 1.7, sigma_arcsec: 0.25}
    #       - {id: baseline, label: Station separation, value_km: 1.31, systematic: 0.05}
    #     corrections:
    #       - {id: station_position, label: Apply surveyed station coordinates, correct: true}
    #       - {id: brightness, label: Use apparent brightness as direct range, correct: false}
    #     truth_region: 0.071 to 0.089 AU
    #     answerText: The two sight lines constrain the object to roughly 0.08 AU; brightness alone cannot.
    choices:
      - "Use both sight lines, the surveyed baseline, and the station-position correction: 0.071–0.089 AU."
      - "Use apparent brightness as direct distance: exactly 0.080 AU."
      - "Use only the Cerro Alto sight line: 0.071–0.089 AU."
      - "Use both sight lines but skip the station-position correction: 0.060–0.070 AU."
    answer: "Use both sight lines, the surveyed baseline, and the station-position correction: 0.071–0.089 AU."
    rebuttals:
      - Brightness mixes distance with size, phase, and albedo, so it cannot supply a unique geometric range.
      - One sight line fixes a direction on the sky but leaves distance unconstrained; the second station creates the parallax angle.
      - Skipping the surveyed-position correction biases the effective baseline and shifts the inferred distance outside the supported range.

  # --- Stop 7: Refuse the prettiest fit
  #     Concept: model adequacy; Keystone: astrometry/residuals; Area: Orbit Determination Center; Learning role: COMBINE; Difficulty: L4; Story role: reversal.
  #     placement: RESIDUAL, at fit-board.
  - group: ORBIT
    at: fit-board
    title: "Refuse the prettiest fit"
    concept: 11   # model adequacy
    reason: "The range constraint leaves two plausible orbit fits whose average errors are almost indistinguishable."
    scene: "Because distance has narrowed, only two candidate orbit families remain, with nearly identical residuals. Compare their error patterns and reject the fit that hides a systematic curve behind a slightly smaller root-mean-square (RMS) error, the summary of typical error size."
    motivation: "The residual pattern determines which orbit model can be propagated without carrying a systematic fitting error forward."
    format: RESIDUAL
    question: "Choose the orbit family that is scientifically safer to propagate. Use ordered observation coordinates 1–5 on the residual axis."
    answerText: "Keep Model B; Model A's residuals sweep from negative to positive and reveal missing curvature."
    why: "Random scatter can reflect measurement noise, while ordered residuals indicate model misspecification."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Do not rank only by RMS; inspect whether the sign and size change systematically with time.
    # correct result: Model B.
    # state/output: Model A is tagged REJECTED: PATTERNED; Stop 8 unlocks.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   residual:
    #     models:
    #       - id: A
    #         rms_arcsec: 0.18
    #         residuals_arcsec: [-0.24, -0.16, -0.05, 0.07, 0.15, 0.25]
    #       - id: B
    #         rms_arcsec: 0.21
    #         residuals_arcsec: [0.18, -0.22, 0.09, -0.19, 0.24, -0.11]
    #     correct_model: B
    #     correct_conclusion: keep_model_B_and_reject_patterned_model_A
    #     pattern_to_reject: monotonic curvature
    #     answerText: Model B has slightly larger RMS but random residuals; Model A is systematically wrong.
    residual:
      fits:
        - id: patterned_low_error
          label: lower average error but patterned residuals
          rms: 0.18
          structured: true
          residuals:
            - x: 1
              y: -0.12
              value: -0.12
            - x: 2
              y: -0.06
              value: -0.06
            - x: 3
              y: 0
              value: 0
            - x: 4
              y: 0.06
              value: 0.06
            - x: 5
              y: 0.12
              value: 0.12
        - id: unpatterned_generalising
          label: slightly higher error with no directional pattern
          rms: 0.21
          residuals:
            - x: 1
              y: 0.05
              value: 0.05
            - x: 2
              y: -0.04
              value: -0.04
            - x: 3
              y: 0.02
              value: 0.02
            - x: 4
              y: -0.03
              value: -0.03
            - x: 5
              y: 0.01
              value: 0.01
      accept: unpatterned_generalising

  # --- Stop 8: Propagate the allowed cloud
  #     Concept: impact probability; Keystone: uncertainty/covariance; Area: Orbit Determination Center; Learning role: INTRODUCE; Difficulty: L4; Story role: decision.
  #     placement: CLOUD, at fit-board.
  - group: ORBIT
    at: fit-board
    title: "Propagate the allowed cloud"
    concept: 28   # impact probability
    reason: "The retained fit needs its full uncertainty propagated before the team decides whether monitoring continues."
    scene: "With the biased fit removed, 240 weighted orbit solutions remain and the nominal path still misses Earth. Propagate the full cloud to the encounter date and measure how much probability intersects Earth's effective cross section."
    motivation: "The weighted Earth-intersection probability determines whether the object crosses the monitoring threshold despite a nominal miss."
    format: CHOICE
    question: "Submit the weighted impact probability in percent and one conclusion: CONTINUOUS MONITORING or RELEASE FROM MONITORING."
    figure: {"kind":"bars","xLabel":"Result","yLabel":"Impact probability (%)","caption":"Weighted impact probability compared with the monitoring threshold.","bars":[{"name":"Estimate","value":3.2},{"name":"Release threshold","value":1}]}
    answerText: "The best-fit line misses, but 3.2% of the allowed probability reaches Earth."
    why: "Impact probability integrates the uncertainty distribution over Earth's effective collision region."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A nominal miss does not remove risk when the surrounding orbit cloud still crosses Earth.
    # correct result: Include all weighted solutions and focusing; 3.2%; continuous monitoring.
    # state/output: Sentry-style monitoring flag activates; OPS warning review unlocks.

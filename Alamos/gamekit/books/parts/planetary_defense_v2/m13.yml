  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 13: worked examples"
    examples:
    - {"title":"Range error from timing error","problem":"A radar delay is biased high by 0.002 s. Use c=300000 km/s. Find the range bias.","rule":"Range bias=c×delay bias/2.","steps":["Set up the relationship: Range bias=c×delay bias/2.","ΔR=300000(0.002)/2=300 km."],"answer":"The inferred range is 300 km too large.","mistake":"A shared clock bias can shift many measurements together."}
    - {"title":"A simple uncertainty interval","problem":"A coordinate estimate is 10 units with standard uncertainty σ=2 units. Give the center ±3σ interval.","rule":"The stated three-sigma interval is estimate ±3×standard uncertainty.","steps":["Set up the relationship: The stated three-sigma interval is estimate ±3×standard uncertainty.","interval=[10-3(2),10+3(2)]=[4,16]."],"answer":"The interval is 4 to 16 units; a probability interpretation needs a distribution model.","mistake":"Three-sigma language alone does not prove a Gaussian error model."}
    - {"title":"Position residual","problem":"A model predicts sky coordinate 100 arcseconds and the observed coordinate is 103 arcseconds in the same reference. Find residual.","rule":"Residual=observed-predicted coordinate.","steps":["Set up the relationship: Residual=observed-predicted coordinate.","r=103-100=+3 arcseconds."],"answer":"The model prediction is 3 arcseconds below the observed coordinate.","mistake":"Use the same coordinate reference and units."}
    - {"title":"Test a frozen prediction","problem":"Before seeing a new measurement, a model predicts 12 units with an allowed error of 1 unit. The new measurement is 15 units. Does it pass this test?","rule":"Absolute prediction error = |observed - predicted|.","steps":["absolute error = |15-12| = 3 units. The prediction remains fixed.","comparison = 3 > 1. The error exceeds the prewritten tolerance."],"answer":"The model fails this held-out test.","mistake":"Refitting to 15 before scoring would no longer test the original prediction."}
    - {"title":"Count independent evidence sources","problem":"Three reports copy one balance reading. A fourth report uses a separately calibrated balance. How many measurement sources are there?","rule":"Reports are not independent measurements when they copy a common source.","steps":["source group 1 = the first balance and its three copies. Count that measurement once.","source group 2 = the second balance. It adds a separate measurement route."],"answer":"There are two measurement sources, not four.","mistake":"Agreement among copies cannot establish independent confirmation."}

  stops:
  # --- Stop 49: Test the common offset
  #     Concept: astrometric control; Keystone: bias/verification; Area: Orbit Determination Center; Learning role: REINFORCE; Difficulty: L5; Story role: evidence.
  #     placement: CONTROL, at tracking-rack.
  - group: ORBIT
    at: tracking-rack
    title: "Test the common offset"
    concept: 18   # astrometric control
    reason: "The new eastward shift includes a reference star, challenging the interpretation of an asteroid trajectory change."
    scene: "The newest positions all shift east by nearly the same amount, including measurements of a cataloged reference star. Use the reference as a control and determine whether the shift belongs to the asteroid or instrument."
    motivation: "The reference correction determines whether the apparent motion is shared measurement bias rather than real target displacement."
    format: CONTROL
    question: "Submit the correction setting in arcseconds, both corrected residuals in arcseconds, the restoration check, and one conclusion: TARGET MOTION or SHARED BIAS."
    # Converted from the payload's `control`. Its three `candidates` are the
    # engine's `variables` — the causes the trial chooses between — and its
    # `held_fixed` list is `held`. The engine grades one observable: the
    # reference-star mean residual, which the payload measures at 0.36 arcsec
    # before the change and 0.00 after, so `baseline` is 0.36 and `response` the
    # signed −0.36 that change produces, against the payload's 0.10 arcsec noise
    # band. `truth` is the payload's keyed `batch_correction`.
    control:
      observable: { label: reference-star mean residual, unit: arcsec }
      variables:
      - { id: batch_correction, label: Apply −0.36 arcsec to the full batch }
      - { id: target_only, label: Shift only the asteroid positions }
      - { id: fit_weighting, label: Change fit weights }
      held:
      - raw images
      - catalog positions
      - star selection
      - fit model
      truth: batch_correction
      baseline: 0.36
      response: -0.36
      noise: 0.10
      run: Measure both residuals
      commit: Name the cause
    answerText: "The known star should not move, so its matching offset identifies the system."
    why: "CONTROL holds expected reality fixed while testing measurement."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Target acceleration cannot move the reference star.
    # correct result: Apply −0.36 arcsec; corrected reference residual = 0.00 arcsec and asteroid residual = +0.02 arcsec; restore raw view; conclude SHARED BIAS.
    # state/output: CONTROL CORRECTION logged.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   control:
    #     changed: {batch_correction_arcsec: [0.00, -0.36]}
    #     held_fixed: [raw images, catalog positions, star selection, fit model]
    #     measurement_timing: [before correction, after correction, after raw-view restoration]
    #     variables:
    #       - {id: batch_correction_arcsec, label: East-west batch correction, baseline: 0.00, test: -0.36, unit: arcsec}
    #       - {id: raw_images, label: Raw images, baseline: fixed, test: fixed}
    #       - {id: catalog_positions, label: Catalog positions, baseline: fixed, test: fixed}
    #       - {id: star_selection, label: Star selection, baseline: fixed, test: fixed}
    #       - {id: fit_model, label: Fit model, baseline: fixed, test: fixed}
    #     candidates:
    #       - {id: batch_correction, label: Apply −0.36 arcsec to the full batch, reference_response_arcsec: -0.36, asteroid_response_arcsec: -0.36}
    #       - {id: target_only, label: Shift only the asteroid positions, reference_response_arcsec: 0.00, asteroid_response_arcsec: -0.36}
    #       - {id: fit_weighting, label: Change fit weights, reference_response_arcsec: -0.04, asteroid_response_arcsec: -0.08}
    #     measurements:
    #       before: {reference_mean_arcsec: 0.36, asteroid_mean_arcsec: 0.38}
    #       after: {reference_mean_arcsec: 0.00, asteroid_mean_arcsec: 0.02}
    #     restoration: {required: true, raw_view_reference_mean_arcsec: 0.36}
    #     response:
    #       label: reference-star and asteroid mean residuals
    #       before_arcsec: {reference: 0.36, asteroid: 0.38}
    #       after_change_arcsec: {reference: 0.00, asteroid: 0.02}
    #       after_restore_arcsec: {reference: 0.36}
    #       noise_band_arcsec: 0.10
    #     required_sequence: [measure_baseline, change_batch_correction_only, measure_both_residuals, restore_raw_view, measure_again]
    #     correct: batch_correction_arcsec
    #     correct_conclusion: shared_bias

  # --- Stop 50: Refit the corrected residuals
  #     Concept: orbit correction; Keystone: modeling/residuals; Area: Orbit Determination Center; Learning role: REINFORCE; Difficulty: L5; Story role: analysis.
  #     placement: RESIDUAL, at fit-board.
  - group: ORBIT
    at: fit-board
    title: "Refit the corrected residuals"
    concept: 8   # orbit correction
    reason: "The identified offset must be applied consistently before the revised orbit is trusted."
    scene: "Refit the complete optical batch with the documented correction and compare residuals before and after. The common eastward pattern disappears, while the remaining scatter stays centered near zero and within stated uncertainty."
    motivation: "The corrected residual pattern determines whether the documented bias removal produces an adequate optical fit."
    format: RESIDUAL
    question: "Submit the corrected mean and scatter in arcseconds and one conclusion: PASS or FAIL. Use ordered observation coordinates 1–5 on the residual axis."
    answerText: "Centered, expected scatter supports correction rather than overfitting."
    why: "RESIDUAL tests the pattern left by a repair."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Perfect zeros would be suspicious; consistent scatter is the goal.
    # correct result: Accept the fit and preserve correction provenance.
    # state/output: PRIMARY CORRIDOR refit.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   residual:
    #     fields:
    #       - {id: before, mean_east_arcsec: 0.37, scatter_arcsec: 0.10}
    #       - {id: after, mean_east_arcsec: 0.01, scatter_arcsec: 0.09}
    #     expected: {mean_east_arcsec: 0.00, one_sigma_scatter_arcsec: 0.10}
    #     acceptance: {absolute_mean_max_arcsec: 0.10, scatter_max_arcsec: 0.10}
    #     correct_classification: pass
    residual:
      fits:
        - id: patterned_low_error
          label: lower average error but patterned residuals
          rms: 0.18
          structured: true
          residuals:
            - x: 1
              y: -0.12
              value: -0.12
            - x: 2
              y: -0.06
              value: -0.06
            - x: 3
              y: 0
              value: 0
            - x: 4
              y: 0.06
              value: 0.06
            - x: 5
              y: 0.12
              value: 0.12
        - id: unpatterned_generalising
          label: slightly higher error with no directional pattern
          rms: 0.21
          residuals:
            - x: 1
              y: 0.05
              value: 0.05
            - x: 2
              y: -0.04
              value: -0.04
            - x: 3
              y: 0.02
              value: 0.02
            - x: 4
              y: -0.03
              value: -0.03
            - x: 5
              y: 0.01
              value: 0.01
      accept: unpatterned_generalising

  # --- Stop 51: Read the separated cloud
  #     Concept: primary corridor; Keystone: probability/response; Area: Orbit Determination Center; Learning role: REINFORCE; Difficulty: L5; Story role: interpretation.
  #     placement: CLOUD, at astro-bench.
  - group: ORBIT
    at: astro-bench
    title: "Read the separated cloud"
    concept: 11   # primary corridor
    reason: "The corrected fit changes geographic exposure, so the existing land alert needs reassessment."
    scene: "Read the cloud against the precommitted stand-down and continued-monitoring thresholds."
    motivation: "The land-intersection result determines whether evacuation can stand down while ocean and coastal monitoring continue."
    format: CHOICE
    question: "Submit the 96% impact value, the land-intersection result, and one response conclusion: LAND STAND-DOWN or LAND EVACUATION."
    answerText: "The hazard remains, but exposure changed."
    why: "CLOUD maps the ensemble to an action threshold."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Ocean impact is neither total all-clear nor land-evacuation trigger.
    # correct result: Stand down land evacuation and retain ocean/coastal monitoring.
    # state/output: LAND CORRIDOR EXCLUDED pending holdout.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   cloud:
    #     primary_impact_probability_percent: 96
    #     confidence_envelope_sigma: 3
    #     populated_land_intersection: false
    #     points:
    #       - {id: impact_weight, setting: full weighted cloud, reading: 96 percent intersects Earth}
    #       - {id: land_test, setting: complete three-sigma envelope, reading: no populated-land intersection}
    #       - {id: ocean_test, setting: primary impact region, reading: deep-ocean corridor}
    #     published_rule: verified_land_exclusion_allows_land_stand_down
    #     correct_conclusion: land_stand_down
    #     continuing_actions: [ocean_monitoring, coastal_monitoring, independent_verification]
    choices:
      - Stand down land evacuation and retain ocean/coastal monitoring.
      - Treat the settings table as the conclusion without reading the pattern.
      - Claim a cause or trend stronger than the displayed readings support.
    answer: Stand down land evacuation and retain ocean/coastal monitoring.
    rebuttals:
      - Settings are inputs; the measured cloud or pattern is the evidence.
      - The observations support the bounded conclusion, not the stronger claim.
    cloud:
      bounds: {}

  # --- Stop 52: Reveal the independent holdout
  #     Concept: independent verification; Keystone: prediction/verification; Area: Orbit Determination Center; Learning role: REINFORCE; Difficulty: L5; Story role: decision.
  #     placement: HOLDOUT, at radar-console.
  - group: ORBIT
    at: radar-console
    title: "Reveal the independent holdout"
    concept: 18   # independent verification
    reason: "The apparent land exclusion needs independent range evidence before stand-down is executed."
    scene: "Freeze the ocean-range prediction before opening Tomás's separately clocked radar pass. Reveal its measured range, test the acceptance window, and carry the independent result to OPS under the published protocol."
    motivation: "The held-out radar measurement determines whether the frozen ocean-track prediction passes its acceptance window."
    format: HOLDOUT
    question: "Commit the 18,420 ± 12 km prediction first; after reveal, submit the measured range in kilometers and the resulting stand-down conclusion."
    answerText: "Independent radar supports the corrected optical solution."
    why: "HOLDOUT tests a frozen prediction outside the fitted data."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Do not move the window after seeing the result.
    # correct result: Holdout passes; execute the land stand-down.
    # state/output: PRIMARY SOLUTION VERIFIED; OPS issues stand-down.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   holdout:
    #     commit_required: true
    #     fit: {predicted_range_km: 18420, acceptance_half_width_km: 12}
    #     reveal_after_commit: {measured_range_km: 18426}
    #     score: {absolute_difference_km: 6, result: pass, response_conclusion: land_stand_down}
    #     correct_conclusion: pass_holdout_and_stand_down_land_corridor
    holdout:
      axis:
        label: allowed independent range error
        min: 0
        max: 20
        step: 5
        unit: km
      fit:
        - at: 0
          value: 0.55
        - at: 5
          value: 0.98
        - at: 10
          value: 0.84
        - at: 15
          value: 0.87
        - at: 20
          value: 0.83
      test:
        - at: 0
          value: 0.33
        - at: 5
          value: 0.46
        - at: 10
          value: 0.78
        - at: 15
          value: 0.86
        - at: 20
          value: 0.84
      overfitAt: 5
      correctAt: 15
      prediction:
        value: 18420
        unit: km
      heldOutMeasurement:
        value: 18426
        absoluteDifference: 6
        unit: km
      correctConclusion: The independent range passes; execute the land stand-down.
      pass: 0.8


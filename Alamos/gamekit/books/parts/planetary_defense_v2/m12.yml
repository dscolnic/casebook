    at: evac-desk
    title: "Allocate limited capacity"
    concept: 16   # emergency resources
    reason: "The response ladder allows preparation before the evidence supports a broad irreversible order."
    scene: "Allocate transport, shelters, medical teams, and communication capacity to reversible staging first."
    motivation: "The capacity allocation determines which targeted staging can be completed while preserving a usable reserve."
    format: ALLOCATE
    question: "Submit one five-category allocation totaling 100 points that preserves at least 20 points in reserve."
    answerText: "Staging buys speed without imposing the harms of premature mass movement."
    why: "ALLOCATE distributes finite resources against expected need, reversibility, and equity."
    # wrong-path feedback, one rebuttal per wrong option:

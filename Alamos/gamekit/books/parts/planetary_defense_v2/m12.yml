  # --- Stop 48: Sign the public claims
  #     Concept: risk communication; Keystone: evidence/ethics; Area: Emergency Management Office; Learning role: REINFORCE; Difficulty: L5; Story role: communication.
  #     placement: ATTEST, asked by Mira Chen beside scopeboard.
  - group: TOWN
    at: scopeboard
    title: "Sign the public claims"
    person: chen
    concept: 16   # risk communication
    reason: "The rehearsed response needs public statements that match the present evidence and conditional actions."
    scene: "Review five proposed public statements and sign only those supported by the current campaign evidence. Each accepted line must name its condition, intended action, and next update without promising certainty."
    motivation: "The signed statements determine what the public can be told without promising certainty or an unsupported all-clear."
    format: ATTEST
    question: "Attest the defensible response-plan statements."
    answerText: "The plan is firm about actions precisely because it is honest about uncertainty."
    why: "ATTEST requires explicit evidence ownership for public claims."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Confidence in a process is not permission to overstate its inputs.
    # correct result: Sign the three conditional statements and reject both absolute claims.
    # state/output: PRECOMMITTED RESPONSE PLAN published.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   attest:
    #     verification_limit: 5
    #     claims:
    #       - {id: leading_case, text: "A 63% impact probability makes impact the leading planning case.", backed: true, critical: true}
    #       - {id: staging, text: "The broad corridor supports reversible staging, not mass evacuation.", backed: true, critical: true}
    #       - {id: order_rule, text: "A protective order requires a narrow independently verified damaging corridor.", backed: true, critical: true}
    #       - {id: city_hit, text: "A named city will be hit.", backed: false, critical: true}
    #       - {id: deflection, text: "A last-minute deflection can still save us.", backed: false, critical: true}
    #     correct_signed: [leading_case, staging, order_rule]
    attest:
      claims:
        - id: primary
          label: primary claim for Sign the public claims
          evidence: the signed source reproduces the displayed result
          critical: true
          backed: true
        - id: independent
          label: independent confirmation
          evidence: the independent record agrees within the stated tolerance
          critical: true
          backed: true
        - id: scope
          label: scope and date
          evidence: the record names the population and time window
          backed: true
        - id: extension
          label: stronger untested extension
          evidence: no independent check supports the extension; it must be held
          critical: true
      checks: 3


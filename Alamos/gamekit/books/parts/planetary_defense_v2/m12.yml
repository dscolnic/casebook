  # --- Stop 47: Rehearse the decision protocol
  #     Concept: emergency decision; Keystone: procedure/verification; Area: Emergency Management Office; Learning role: REINFORCE; Difficulty: L5; Story role: application.
  #     placement: PROTOCOL, at threshold-board.
  - group: TOWN
    at: threshold-board
    title: "Rehearse the decision protocol"
    concept: 16   # emergency decision
    reason: "The staged resources need a decision protocol that prevents an unverified forecast from issuing an order."
    scene: "Insert an independent scientific verification gate before any protective order."
    motivation: "The verification gate determines whether independent scientific confirmation occurs before protective authorization."
    format: PROTOCOL
    question: "Build the order-and-reassessment protocol."
    # Converted from the payload's `scenarios` / `choices` / `mapping`. The engine
    # reads `mapping` as one response per situation, in situation order, so the
    # payload's keyed map becomes the same seven responses in that order.
    scenarios:
    - "New orbit result arrives"
    - "Consequences are mapped"
    - "A jurisdiction is implicated"
    - "Evidence must be independently checked"
    - "Authority decides"
    - "Public receives instructions"
    - "Conditions may change"
    mapping:
    - "Verify the orbit update"
    - "Overlay consequences"
    - "Check jurisdiction"
    - "Perform independent scientific verification"
    - "Obtain authorization"
    - "Issue an accessible message"
    - "Schedule reassessment"
    choices:
    - "Verify the orbit update"
    - "Overlay consequences"
    - "Check jurisdiction"
    - "Perform independent scientific verification"
    - "Obtain authorization"
    - "Issue an accessible message"
    - "Schedule reassessment"
    answerText: "Every order carries its evidence, authority, message, and next review time."
    why: "PROTOCOL makes a complex response repeatable across teams."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A technically correct map cannot issue or explain an order by itself.
    # correct result: Complete the seven-step protocol with verification before authorization.
    # state/output: RESPONSE PROTOCOL rehearsed.

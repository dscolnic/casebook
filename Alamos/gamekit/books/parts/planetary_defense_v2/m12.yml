    at: threshold-board
    title: "Rehearse the decision protocol"
    concept: 16   # emergency decision
    reason: "The staged resources need a decision protocol that prevents an unverified forecast from issuing an order."
    scene: "Insert an independent scientific verification gate before any protective order."
    motivation: "The verification gate determines whether independent scientific confirmation occurs before protective authorization."
    format: PROTOCOL
    question: "Build the order-and-reassessment protocol."

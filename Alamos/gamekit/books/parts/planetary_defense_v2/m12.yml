  worked:
    label: "Worked examples"
    title: "Mission 12: worked examples"
    examples:
    - {"title":"Probability and expected loss","problem":"Two hypothetical events have probabilities 0.1 and 0.01 and losses 100 and 2000 units. Compare expected losses.","rule":"Expected loss=probability×loss in this two-outcome model.","steps":["Set up the relationship: Expected loss=probability×loss in this two-outcome model.","first=0.1(100)=10; second=0.01(2000)=20 units."],"answer":"The less probable event has the larger expected loss in this simplified calculation.","mistake":"Expected loss is not the loss that must occur on one realization."}
    - {"title":"Read an inclusive threshold","problem":"A fictional laboratory rule permits a sample concentration at or below 5 mg/L. A sample measures exactly 5 mg/L. Classify it under that rule.","rule":"At or below means concentration ≤ limit.","steps":["comparison = 5 ≤ 5, which is true. Equality is included.","classification = passes this concentration rule. No claim about other requirements follows."],"answer":"This measurement passes the stated inclusive threshold.","mistake":"Replacing ≤ with < would wrongly exclude equality."}
    - {"title":"Protect a required reserve","problem":"A lab has 100 energy units. Essential tasks need 30 and 40 units, and reserve must be at least 20. How much remains for an optional task?","rule":"Optional capacity = total - essential use - protected reserve.","steps":["essential use = 30+40 = 70 units.","optional capacity = 100-70-20 = 10 units."],"answer":"At most 10 units may fund the optional task while preserving the reserve.","mistake":"Treating the reserve as freely available breaks the stated requirement."}
    - {"title":"Test an entire allowed range","problem":"A component must operate at or below 80 °C. Its estimated temperature is 77 ± 4 °C. Does every allowed value pass?","rule":"Test the worst allowed value against the stated bound.","steps":["allowed interval = [77-4, 77+4] = [73,81] °C.","maximum allowed temperature = 81 °C > 80 °C. At least one allowed value fails."],"answer":"The estimate does not establish that every allowed temperature passes.","mistake":"Checking only the central estimate ignores the uncertainty."}
    - {"title":"Apply simultaneous conditions","problem":"A sample must have purity ≥95% and temperature ≤30 °C. It has purity 97% and temperature 32 °C. Does it pass?","rule":"When both conditions are required, both must be true.","steps":["purity test = 97 ≥ 95, true.","temperature test = 32 ≤ 30, false. A passing purity cannot cancel a failed temperature."],"answer":"The sample fails the combined specification.","mistake":"Averaging a pass and a fail is not a logical AND."}

  stops:
  # --- Stop 45: Draw the action thresholds
  #     Concept: staged response; Keystone: thresholds/decisions; Area: Emergency Management Office; Learning role: REINFORCE; Difficulty: L5; Story role: design.
  #     placement: TRIGGER, at risk-display.
  - group: TOWN
    at: risk-display
    title: "Draw the action thresholds"
    concept: 16   # staged response
    reason: "Civil preparation now needs observable rules distinguishing watch, staging, protective orders, and stand-down."
    scene: "Define four escalating states for watch, resource staging, targeted protective order, and verified stand-down across the response system. Use probability, corridor population, warning time, and independent verification so each trigger is observable."
    motivation: "The threshold-action matches determine how changing probability, exposure, warning time, and verification alter the response state."
    format: TRIGGER
    question: "Write and commit all four thresholds before updates unlock; then submit the four-stage threshold-to-action mapping."
    answerText: "Reversible preparation begins earlier; disruptive orders require narrower, independently verified evidence."
    why: "TRIGGER binds a measurable condition to a predefined action."
    # wrong-path feedback, one rebuttal per wrong option:
    #   One probability threshold cannot govern actions with radically different costs.
    # correct result: Correct four trigger-action matches.
    # state/output: RESPONSE LADDER drafted.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   trigger:
    #     stages:
    #       - {id: watch, threshold: "impact probability > 1% and diameter > 10 m", action: maintain watch}
    #       - {id: stage, threshold: "impact probability > 50% and the corridor contains population", action: stage reversible resources}
    #       - {id: order, threshold: "impact probability >= 90%, diameter >= 20 m, narrow populated three-sigma corridor, independent verification, and warning time < 2 days", action: issue targeted protective order}
    #       - {id: stand_down, threshold: "verified complete corridor excludes the jurisdiction", action: stand down that jurisdiction}
    #     updates_hidden_until_commit: true
    #     blind_updates:

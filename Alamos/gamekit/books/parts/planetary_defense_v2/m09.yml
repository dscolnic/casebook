    probe:
      stations:
        - id: deep_ocean
          label: Deep ocean
          reading: regional wave; low local exposure
          expected: coastal-wave uncertainty
          unit: planning concern
        - id: continental_shelf
          label: Continental shelf
          reading: high coastal wave; moderate exposure
          expected: coastal-wave warning
          unit: planning concern
        - id: remote_desert
          label: Remote desert
          reading: high local blast and heat; low exposure
          expected: blast and thermal monitoring
          unit: planning concern
        - id: dense_coast
          label: Dense coast
          reading: blast, heat, possible wave, high exposure
          expected: combined effects and evacuation
          unit: planning concern
      target: dense_coast
      quantityAndUnits: Submit one mapping from each of the four corridor stations to its dominant planning concern; do not submit one corridor-wide casualty number.

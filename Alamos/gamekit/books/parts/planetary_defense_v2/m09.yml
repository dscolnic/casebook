    - "Atmospheric loading"
    - "Breakup or survival"
    - "Energy deposition"
    - "Surface and atmospheric effects"
    order: [0, 1, 2, 3, 4]
    answerText: "Energy is conserved, but where and how it is deposited determines the hazard pattern."
    why: "SEQUENCE maps upstream physical conditions to downstream consequences."

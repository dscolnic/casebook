  - group: IMPACT
    at: deflection-desk
    title: "Buy the decision-changing measurement"
    person: park
    concept: "value of information"
    reason: "Limited observing time should target uncertainty that changes who must act."
    scene: "The team can improve diameter by ten percent, composition classification, or corridor timing enough to separate ocean from populated land. Choose the measurement with the largest expected change to tomorrow's protective decision."
    motivation: "Value of information depends on its effect on action, not only on scientific interest."
    format: VALUE
    question: "Spend at most 10 observing hours and select the option with the greatest immediate decision value."

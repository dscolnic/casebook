  # --- Stop 36: Buy the decision-changing measurement
  #     Concept: value of information; Keystone: decisions/resources; Area: Entry & Consequences Lab; Learning role: REINFORCE; Difficulty: L5; Story role: decision.
  #     placement: VALUE, asked by Evelyn Park beside deflection-desk.
  - group: IMPACT
    at: deflection-desk
    title: "Buy the decision-changing measurement"
    person: park
    concept: 18   # value of information
    reason: "The consequence assessment leaves limited observing time for the uncertainty that most affects tomorrow's action."
    scene: "The remaining trajectories split between ocean and populated land. Evelyn needs evidence that can change which places require protection tomorrow."
    motivation: "The selected measurement determines whether the next data can change corridor protection rather than merely refine a settled quantity."
    format: VALUE
    question: "You have 10 observing hours. Cover every required outcome at the lowest total cost within the budget; keep all unused capacity in reserve. Select whole packages, then submit the plan; the board shows its total and remaining reserve for you to check."
    # Converted from the payload's `value`. Its `budget` object becomes the
    # engine's; each option keeps its own id, label, cost and axis, and its
    # `decision_change` line becomes what the option `reveals`. The payload's
    # keyed `correct` — corridor timing — is what the engine calls `decisive`.
    value:
      budget:
        amount: 10
        unit: observing hours
      decision: ""
      requirements:
        - id: r1
          text: resolve whether populated land remains within the action corridor
      rule: Cover every required outcome at the lowest total cost within the budget; keep all unused capacity in reserve.
      plans:
        - corridor
      options:
        - id: diameter
          label: Improve diameter by ten percent
          cost: 4
          axis: ""
          reveals: Tightens size; throughout this smaller range a populated-land strike still requires the same protective action.
        - id: composition
          label: Refine composition class
          cost: 4
          axis: ""
          reveals: Refines material behavior but does not distinguish the remaining ocean and land trajectories.
        - id: corridor
          label: Separate ocean and land arrival solutions
          cost: 10
          axis: ""
          reveals: Adds timing evidence that distinguishes the remaining land-intersecting and ocean-only trajectories.
          covers:
            - r1
          decisive: true
        - id: brightness
          label: Repeat brightness curve
          cost: 3
          axis: ""
          reveals: Refines reflected light without separating the remaining trajectory solutions.
      commit: Commit the decision
    answerText: "Each funded package supplies a required outcome; an affordable package that leaves one unresolved is insufficient."
    why: "VALUE ranks observations by expected decision improvement under scarcity."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Precision is useful only when it can alter the choice facing the team.
    # correct result: Prioritize corridor timing.
    # state/output: NEXT WINDOW assigned to corridor timing.

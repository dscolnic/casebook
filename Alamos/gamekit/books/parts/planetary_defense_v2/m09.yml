  worked:
    label: "Worked examples"
    title: "Mission 9: worked examples"
    examples:
    - {"title":"Mass of a simple sphere","problem":"A uniform sphere has radius 1 m and density 3 kg/m³ in a toy model. Find mass.","rule":"m=ρV=ρ(4πr³/3).","steps":["Set up the relationship: m=ρV=ρ(4πr³/3).","m=3(4π×1³/3)=4π kg≈12.6 kg."],"answer":"Mass is 4π kg in the stated toy model.","mistake":"Density multiplies volume, not projected area."}
    - {"title":"Impact energy scaling","problem":"An object's mass is unchanged and its speed doubles. How does kinetic energy change?","rule":"K=mv²/2.","steps":["Set up the relationship: K=mv²/2.","K_new/K_old=(2v)²/v²=4."],"answer":"The kinetic energy quadruples.","mistake":"Impact energy is not linear in speed."}
    - {"title":"Diameter and mass","problem":"Two spheres have the same density, but one has twice the diameter. Compare masses.","rule":"Mass at fixed density is proportional to diameter cubed.","steps":["Set up the relationship: Mass at fixed density is proportional to diameter cubed.","m2/m1=2³=8."],"answer":"The larger sphere has eight times the mass.","mistake":"A diameter uncertainty can produce a much larger fractional mass uncertainty."}
    - {"title":"Interpret a possible-impact corridor","problem":"A model produces a strip of possible impact locations. Does the centerline identify a guaranteed impact point?","rule":"A corridor represents a spread of supported locations under uncertainty.","steps":["Locations across the strip remain possible within the model.","The centerline is a summary of that distribution, not a guarantee about one location."],"answer":"Planning should preserve the uncertainty rather than treat the centerline as certain.","mistake":"A narrow-looking map symbol can hide substantial uncertainty."}
    - {"title":"Surface impact versus airburst","problem":"Two equal-energy objects enter an atmosphere, but one fragments high above the ground and the other reaches the surface. Must their damage patterns match?","rule":"Energy matters, but the altitude and manner of deposition affect consequences.","steps":["The fragmenting object deposits more energy along an atmospheric path.","The surface-reaching object deposits energy differently, including at the ground."],"answer":"Equal initial kinetic energy does not imply equal local damage patterns.","mistake":"Energy alone cannot determine a unique damage radius without a consequence model."}

  stops:
  # --- Stop 33: Estimate the energy scale
  #     Concept: kinetic energy; Keystone: mechanics/estimation; Area: Entry & Consequences Lab; Learning role: REINFORCE; Difficulty: L4; Story role: calculation.
  #     placement: BALLPARK, at astro-bench.
  - group: IMPACT
    at: astro-bench
    title: "Estimate the energy scale"
    concept: 13   # kinetic energy
    reason: "The intensified response now needs an impact-energy scale rather than probability alone."
    scene: "The size and density model now meets the entry-speed estimate. The energy scale will shape the consequence assessment."
    motivation: "Mass and kinetic energy establish the approximate physical consequence scale that the corridor assessment must consider."
    format: BALLPARK
    question: "Model a sphere of diameter 260 m and density 1,800 kg/m³; m=ρπD³/6. Speed is 19,000 m/s. Choose the calculated mass and speed in E=½mv²/(4.184×10¹⁵) to express energy in megatons TNT."
    # Converted from the payload's `estimate`. The payload's `slots` name the
    # three results it wants, not the tiles; the engine's slots are tiles, so the
    # board carries the four quantities the payload's own `values` state — D, ρ,
    # v and the TNT conversion — and grades on the payload's `target`, the
    # kinetic energy, which the first three produce. The TNT tile stays on the
    # board as the fourth quantity the payload names.
    # `tolerance` is the payload's "15 percent" of 3.00e18 J.
    estimate:
      prompt: "Diameter 260 m, density 1,800 kg/m³, impact speed 19 km/s."
      question: "Submit three numerical results with units: mass in kilograms, kinetic energy in joules, and TNT equivalent in megatons."
      relationship: "KE = 1/2 mv², with m = (4/3)π(D/2)³ρ"
      labels:
      - "D = 260 m"
      - "ρ = 1800 kg/m³"
      - "v = 19000 m/s"
      - "1 Mt TNT = 4.184×10¹⁵ J"
      values: [260, 1800, 19000, 4.184e15]
      slots: 3
      correct: [0, 1, 2]
      template: "½ · (4/3)π({0}/2)³ · {1} · {2}²"
      formula: "0.5*(4/3)*Math.PI*Math.pow(a/2,3)*b*c*c"
      target: 3.00e18
      tolerance: 4.5e17
      units: "J"
    answerText: "This is a regional-to-continental catastrophe scale, not a planet-destroying event."
    why: "BALLPARK checks powers of ten before model detail."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Convert 19 km/s to 19,000 m/s before squaring.
    # correct result: About (1.66\times10^{10}) kg, (3.0\times10^{18}) J, or 715 megatons TNT.
    # state/output: ENERGY SCALE VERIFIED; IMPACT travel unlocks.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   estimate:
    #     labels: [volume and mass, kinetic energy, TNT conversion]
    #     values:
    #       - ["D = 260 m", "ρ = 1800 kg/m³", "m = (4/3)π(D/2)³ρ"]
    #       - ["v = 19000 m/s", "KE = 1/2 mv²"]
    #       - ["1 Mt TNT = 4.184 × 10^15 J"]
    #     slots: [mass_kg, kinetic_energy_J, tnt_megatons]
    #     template: "m = (4/3)π(D/2)³ρ; KE = 1/2 mv²; Mt = KE/(4.184 × 10^15 J)"
    #     formula: spherical-body energy scale
    #     correct: ["1.66 × 10^10 kg", "3.00 × 10^18 J", "717 Mt"]
    #     target: 3.00e18
    #     tolerance: 15 percent


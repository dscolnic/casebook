  # --- Stop 35: Compare corridor consequences
  #     Concept: consequence mapping; Keystone: systems/interpretation; Area: Entry & Consequences Lab; Learning role: INTRODUCE; Difficulty: L5; Story role: analysis.
  #     placement: PROBE, at risk-display.
  - group: IMPACT
    at: risk-display
    title: "Compare corridor consequences"
    concept: 30   # consequence mapping
    reason: "The entry model must be applied to different environments along the possible impact corridor."
    scene: "Probe four corridor stations: deep ocean, continental shelf, remote desert, and a dense coast. Compare blast, heat, waves, and evacuation exposure without assigning one casualty count to the full corridor."
    motivation: "Segment-specific effects and exposure determine why ocean, desert, shelf, and populated coast require different protective planning."
    format: PROBE
    question: "Submit one mapping from each of the four corridor stations to its dominant planning concern; do not submit one corridor-wide casualty number."
    answerText: "The asteroid's energy is common, but the risk distribution is geographically conditional."
    why: "PROBE examines model response across controlled location changes."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A corridor-wide average hides the places where action costs and benefits differ most.
    # correct result: Distinguish physical effects and exposed populations by segment.
    # state/output: CONDITIONAL CONSEQUENCE MAP appears.

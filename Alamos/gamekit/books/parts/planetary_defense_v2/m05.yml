  # --- Stop 18: Find the usable exposure
  #     Concept: exposure and magnitude; Keystone: light/telescopes; Area: Survey Telescope; Learning role: PRACTICE; Difficulty: L2; Story role: obstacle.
  #     placement: SWEEP, at dome-console.
  - group: DISC
    at: dome-console
    title: "Find the usable exposure"
    concept: 2   # exposure and magnitude
    reason: "The localized recovery failure makes exposure selection a balance between asteroid detection and usable reference stars."
    scene: "With the weak detector region located, sweep exposure time from 10 to 90 seconds and watch asteroid signal and star saturation together. Choose the shortest setting that reaches the signal goal without crossing the saturation limit."
    motivation: "The signal and saturation readings determine the shortest exposure that preserves both asteroid visibility and the astrometric reference grid."
    format: SWEEP
    question: "Operate the sweep, then submit one exposure setting in seconds: the shortest value with asteroid S/N ≥ 5 and no more than one saturated reference star."
    # Converted from the payload's `sweep`. The payload's `control.values` become
    # the axis and the `at` of every response point; its two `readings` rows
    # become the two series, which is what `mode: boundary` is for — signal and
    # saturation are costs that trade against each other across one handle.
    # `tolerance` is half the gap from the keyed 45 s to the nearest setting the
    # payload authored on either side (30 s and 60 s), so 45 is the only authored
    # setting the band accepts. The handle starts at the bottom of the axis.
    sweep:
      mode: boundary
      axis: { label: exposure time, unit: s, min: 10, max: 90, step: 1 }
      readout: { label: asteroid signal-to-noise }
      series:
      - label: asteroid signal-to-noise
        response:
        - { at: 10, value: 2.1 }
        - { at: 20, value: 3.4 }
        - { at: 30, value: 4.7 }
        - { at: 45, value: 6.1 }
        - { at: 60, value: 7.0 }
        - { at: 90, value: 8.1 }
      - label: saturated reference stars
        unit: stars
        response:
        - { at: 10, value: 0 }
        - { at: 20, value: 0 }
        - { at: 30, value: 0 }
        - { at: 45, value: 1 }
        - { at: 60, value: 5 }
        - { at: 90, value: 14 }
      target: 45
      tolerance: 7.5
      start: 10
      commit: Lock the exposure
    answerText: "A 45-second exposure gives usable asteroid signal without destroying the reference grid."
    why: "Longer exposure improves signal but eventually saturates bright stars needed for astrometry."
    # wrong-path feedback, one rebuttal per wrong option:
    #   The highest signal is not automatically best; read both the minimum signal and maximum saturation goals.
    # correct result: 45 s.
    # state/output: Exposure control locks at 45 s; Stop 19 unlocks.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   sweep:
    #     control: {label: exposure time, unit: s, values: [10, 20, 30, 45, 60, 90]}
    #     readings:
    #       signal_to_noise: [2.1, 3.4, 4.7, 6.1, 7.0, 8.1]
    #       saturated_reference_stars: [0, 0, 0, 1, 5, 14]
    #     goal: signal_to_noise at least 5 and saturated_reference_stars no more than 1
    #     correct_setting: 45
    #     answerText: Use 45 s; it reaches S/N 6.1 with only one saturated reference star.

  # --- Stop 19: Move the mask, not the object
  #     Concept: causal artifact test; Keystone: measurement/inference; Area: Survey Telescope; Learning role: COMBINE; Difficulty: L3; Story role: obstacle.
  #     placement: CONTROL, at pipeline-bench.
  - group: DISC
    at: pipeline-bench
    title: "Move the mask, not the object"
    concept: 6   # causal artifact test
    reason: "The usable exposure leaves the detector mask as a possible source of position bias."
    scene: "Because 45 seconds gives a usable image, test whether the local bad-column mask moves the candidate centroid. Change only the mask, reverse it, and compare the position with the expected noise band."
    motivation: "The reversible centroid shift determines whether moving the mask meaningfully changes the asteroid's measured position."
    format: CONTROL
    question: "Submit the mask-shift setting (+3 px), the changed and restored centroid measurements in pixels, and one conclusion about whether the centroid follows the mask."
    answerText: "The candidate position does not follow the detector mask."
    why: "Causation requires changing the proposed cause while holding other factors fixed, then confirming by reversal."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Changing alignment directly moves every sky coordinate and cannot isolate the mask.
    # correct result: Mask shift; response 0.03 px, below noise; returns to 2048.61 px.
    # state/output: MASK ARTIFACT rejected; Stop 20 unlocks.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   control:
    #     changed: {bad_column_mask_shift_px: [0, 3]}
    #     held_fixed: [raw 45 s image, star catalog, world-coordinate solution, centroid algorithm]
    #     measurement_timing: [before change, after +3 px change, after restoration]
    #     variables:
    #       - {id: mask_shift_px, label: Bad-column mask shift, baseline: 0, test: 3, unit: px}
    #       - {id: raw_image, label: Raw image, baseline: 45, test: 45, unit: s exposure}
    #       - {id: star_catalog, label: Star catalog, baseline: fixed, test: fixed}
    #       - {id: coordinate_solution, label: World-coordinate solution, baseline: fixed, test: fixed}
    #       - {id: centroid_algorithm, label: Centroid algorithm, baseline: fixed, test: fixed}
    #     baseline: {centroid_x_px: 2048.62, noise_band_px: 0.08}
    #     candidates:
    #       - {id: mask, label: Shift bad-column mask by 3 px, response_px: 0.03}
    #       - {id: alignment, label: Shift world-coordinate solution, response_px: 0.41}
    #       - {id: exposure, label: Double exposure time, response_px: 0.12}
    #     reversal:
    #       required: true
    #       control_id: mask
    #       return_centroid_x_px: 2048.61
    #     response: {label: centroid x, baseline_px: 2048.62, after_change_px: 2048.65, after_restore_px: 2048.61, noise_band_px: 0.08}
    #     required_sequence: [measure_baseline, change_mask_only, measure, restore_mask, measure_again]
    #     correct_control: mask
    #     correct: mask_shift_px
    #     answerText: Moving and restoring the mask changes the centroid by less than the 0.08 px noise band.
    control:
      variables:
        - id: mask
          label: Bad-column mask shift
        - id: alignment
          label: World-coordinate solution shift
        - id: exposure
          label: Exposure time
      held:
        - raw 45 s image
        - star catalog
        - world-coordinate solution
        - centroid algorithm
      truth: mask
      baseline: 0
      response: 0.03
      noise: 0.005

  # --- Stop 20: Predict, observe, verify
  #     Concept: independent prediction; Keystone: astrometry/verification; Area: Survey Telescope; Learning role: TRANSFER; Difficulty: L4; Story role: decision.
  #     placement: VERIFY, at dome-console.
  - group: DISC
    at: dome-console
    title: "Predict, observe, verify"
    concept: 18   # independent prediction
    reason: "The exposure and mask checks allow the latest image to test an independent orbit prediction."
    scene: "With exposure and mask effects controlled, freeze Malik's independent predicted position before opening the latest frame. Measure the new centroid and decide whether its separation falls inside the 0.50-arcsecond acceptance radius."
    motivation: "The centroid's separation from the committed position determines whether the new optical observation verifies the predicted track."
    format: VERIFY
    question: "First commit the predicted right-ascension (RA) and declination (Dec) offsets and the 0.50-arcsecond acceptance rule; this unlocks the frame. Then reveal and measure the centroid, calculate its separation, and submit VERIFIED or REJECTED."
    answerText: "The new optical position passes the independent prediction test."
    why: "A held prediction prevents post-measurement tuning from masquerading as verification."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Compare the two-dimensional separation with the printed goal, not either coordinate alone.
    # correct result: Verified; separation 0.31 arcsec.
    # state/output: Astrometry packet transfers to ORBIT with a local systematic term; CHAR destination unlocks.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   verify:
    #     prediction_commit_required: true
    #     prediction:
    #       prompt: Commit the predicted RA and Dec offsets before revealing the latest frame.
    #       formula: "separation = sqrt[(measured_RA - predicted_RA)^2 + (measured_Dec - predicted_Dec)^2]"
    #       correct: {ra_offset_arcsec: 124.20, dec_offset_arcsec: -38.70}
    #       unit: arcsec
    #       tolerance: {maximum_separation_arcsec: 0.50}
    #     acceptance_radius_arcsec: 0.50
    #     equipment_unlocks_after_commit: true
    #     action: {id: reveal_latest_frame, label: Reveal latest calibrated frame}
    #     measurement: {ra_offset_arcsec: 124.43, dec_offset_arcsec: -38.91}
    #     separation_arcsec: 0.31
    #     required_sequence: [commit_prediction, reveal_latest_frame, measure_ra_and_dec, calculate_separation, interpret]
    #     truth: The measured point is 0.31 arcsec from the frozen prediction and passes the 0.50 arcsec limit.
    #     correct_conclusion: verified
    #     answerText: The measured point is 0.31 arcsec from the frozen prediction, inside the 0.50 arcsec goal.
    verify:
      prediction:
        min: 0.155
        max: 0.465
        step: 0.031

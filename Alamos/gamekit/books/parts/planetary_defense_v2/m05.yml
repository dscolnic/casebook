  worked:
    label: "Worked examples"
    title: "Mission 5: worked examples"
    examples:
    - {"title":"Measure detection completeness","problem":"Software is given 100 artificial sources of a specified brightness and recovers 80. Find completeness for that test bin.","rule":"Completeness=recovered injected sources/total injected sources.","steps":["Set up the relationship: Completeness=recovered injected sources/total injected sources.","completeness=80/100=0.80=80%."],"answer":"The test-bin completeness is 80%.","mistake":"This result need not apply to fainter sources or different image conditions."}
    - {"title":"False detections among candidates","problem":"A candidate list contains 20 objects, of which 5 are verified artifacts. Find the artifact fraction of this list.","rule":"Artifact fraction=false candidates/all candidates.","steps":["Set up the relationship: Artifact fraction=false candidates/all candidates.","fraction=5/20=0.25=25%."],"answer":"One quarter of this candidate list is artifact.","mistake":"This is not the same denominator as detection completeness."}
    - {"title":"Brightness ratios and magnitude","problem":"Source A is 100 times as bright as B. Find m_A-m_B.","rule":"m_A-m_B=-2.5 log10(F_A/F_B), with fluxes in the same band.","steps":["Set up the relationship: m_A-m_B=-2.5 log10(F_A/F_B), with fluxes in the same band.","m_A-m_B=-2.5 log10(100)=-2.5(2)=-5."],"answer":"A is 5 magnitudes brighter, meaning its magnitude number is smaller.","mistake":"Brighter sources have smaller astronomical magnitudes."}
    - {"title":"Separate detector and sky motion","problem":"Across images with a shifted camera pointing, a bright spot stays at the same detector pixel while the stars move. What does that suggest?","rule":"A detector defect stays tied to detector coordinates; a sky source follows the sky-to-detector mapping.","steps":["Changing pointing moves real sky positions across pixels.","The stationary detector spot does not follow that mapping."],"answer":"The pattern supports a detector artifact as a candidate explanation.","mistake":"This diagnostic needs the stated pointing change; one image alone is insufficient."}
    - {"title":"Test a frozen prediction","problem":"Before seeing a new measurement, a model predicts 12 units with an allowed error of 1 unit. The new measurement is 15 units. Does it pass this test?","rule":"Absolute prediction error = |observed - predicted|.","steps":["absolute error = |15-12| = 3 units. The prediction remains fixed.","comparison = 3 > 1. The error exceeds the prewritten tolerance."],"answer":"The model fails this held-out test.","mistake":"Refitting to 15 before scoring would no longer test the original prediction."}


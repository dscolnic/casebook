  #     Concept: completeness; Keystone: telescope limits; Area: Survey Telescope; Learning role: RETRIEVE; Difficulty: L3; Story role: clue.
  #     placement: INJECT, at pipeline-link.
  - group: DISC
    at: pipeline-link
    title: "Put known objects through the pipeline"
    concept: "completeness"
    reason: "The summit data cannot enter the orbit fit until the range knows what the pipeline misses."
    scene: "The funded recovery depends on a pipeline that lost sources near one bright satellite trail in the discovery night. Inject known moving points across magnitude and detector position, then count where the system fails."
    motivation: "The recovery map tells the summit team which detector condition requires a live control."
    format: INJECT
    question: "Calculate and commit the 40-of-50 minimum plus the four-bin injection plan before the pipeline unlocks; then operate it, measure all four recovery fractions in percent, and submit the localized failure-bin conclusion."
    answerText: "The pipeline does not invent the candidate, but it under-recovers faint sources near the trail."
    why: "Known inputs reveal selection effects that cannot be measured from detected sources alone."

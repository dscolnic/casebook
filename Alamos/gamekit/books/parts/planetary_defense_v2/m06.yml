        - { a: 260, b: 0.041 }
        - { a: 290, b: 0.034 }
      truth: { a: 260, b: 0.041 }
      tolerance: { a: 0.08, b: 0.08 }
      commit: Report the pair
    answerText: "The asteroid is large and dark, not small and bright."
    why: "Two measurements with different parameter dependence break a degeneracy."
    # wrong-path feedback, one rebuttal per wrong option:

  # --- Stop 23: Check the thermal temperature
  #     Concept: Wien relation; Keystone: light/thermal characterization; Area: Spectroscopy Dome; Learning role: PRACTICE; Difficulty: L3; Story role: verification.
  #     placement: SWEEP, at spectrograph.
  - group: CHAR
    at: spectrograph
    title: "Check the thermal temperature"
    concept: 23   # Wien relation
    reason: "The thermal size constraint depends on matching the measured spectral shape to a plausible temperature."
    scene: "Because the thermal locus selects a large dark body, sweep model temperature and compare the predicted spectral peak with the observed 10.2-micrometer maximum. Choose the temperature that aligns the shape before accepting the area."
    motivation: "The temperature fit determines whether the emitting area used in the diameter estimate is physically supported."
    format: SWEEP
    question: "Calculate and commit the predicted temperature in kelvin before the temperature control unlocks; then operate the sweep, measure the model peak in micrometers, and submit the setting plus PASS or FAIL."
    # Converted from the payload's `sweep`. Its `control.values` are the axis and
    # the `at` of every response point, its `predicted_peak_micrometers` the
    # response, and its `observed_peak_micrometers` the baseline the trace has to

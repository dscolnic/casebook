  # --- Stop 24: Adopt the consequence body
  #     Concept: physical characterization; Keystone: size/structure; Area: Spectroscopy Dome; Learning role: TRANSFER; Difficulty: L4; Story role: decision/Twist 1.
  #     placement: DIAGNOSIS, at sizing-board.
  - group: CHAR
    at: sizing-board
    title: "Adopt the consequence body"
    concept: 3   # physical characterization
    reason: "The independent size and temperature evidence now needs one body model for consequence planning."
    scene: "With diameter and temperature constrained, compare explanations against H = 22.0, pv = 0.041, the 230-290 m thermal size, and unequal light-curve maxima. Name the physical model that fits every independent reading."
    motivation: "The diagnosis determines which size, darkness, and shape description fits all measurements without overstating unresolved structure."
    format: DIAGNOSIS
    question: "Diagnose the one model that fits every reading, including the quiet lack of visible activity."
    # Converted from the payload's `headline` / `readings` / `choices` / `answer`.
    # The choices arrived as quoted strings of the payload's own flow maps; they
    # are the same four candidates written as mappings so the panel can read
    # them, and `answer` is the label of the candidate the payload keys by id.
    headline: "Which physical model fits all current characterization data?"
    readings:
    - { zone: visible, label: Absolute magnitude H, value: 22.0, status: quiet }
    - { zone: thermal, label: Diameter, value: 230-290 m, status: alarm }
    - { zone: surface, label: Albedo, value: 0.041, status: low }
    - { zone: rotation, label: Light curve, value: unequal double maxima, status: high }
    choices:
    - { id: small_bright, label: 106 m bright sphere, mechanism: contradicts thermal area and low albedo }
    - { id: large_dark_round, label: 260 m dark sphere, mechanism: fits size but not unequal double maxima }
    - { id: large_dark_irregular, label: 260 m dark irregular or two-lobed body, mechanism: fits all readings }
    - { id: comet_coma, label: Small active comet with bright coma, mechanism: would raise visible area and show activity }
    answer: "260 m dark irregular or two-lobed body"
    answerText: "Consequence planning must use a roughly 260 m dark body while radar tests its structure."
    why: "Thermal area breaks the size-albedo degeneracy; the light curve adds shape information without proving a binary."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A model that fits diameter but ignores the unequal rotation signature is incomplete.

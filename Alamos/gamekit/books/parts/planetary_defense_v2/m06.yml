  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 6: worked examples"
    examples:
    - {"title":"Size-reflectivity ambiguity","problem":"At equal distances and geometry, reflected brightness is proportional to pD², where p is reflectivity and D diameter. If p falls by a factor of four, what D preserves brightness?","rule":"For fixed brightness, D is proportional to 1/sqrt(p).","steps":["Set up the relationship: For fixed brightness, D is proportional to 1/sqrt(p).","D_new/D_old=sqrt(p_old/p_new)=sqrt(4)=2."],"answer":"The diameter must double under this simplified reflected-light model.","mistake":"Equal brightness does not imply equal diameter."}
    - {"title":"Diameter and cross section","problem":"One sphere has twice another's diameter. Compare projected areas.","rule":"Projected area A=πD²/4.","steps":["Set up the relationship: Projected area A=πD²/4.","A2/A1=(D2/D1)²=2²=4."],"answer":"The larger sphere has four times the projected area.","mistake":"Area scales as diameter squared, not cubed."}
    - {"title":"Thermal peak wavelength","problem":"A blackbody has temperature 300 K. Use Wien's constant b=3000 μm K for a rounded estimate. Find peak wavelength.","rule":"λ_peak=b/T.","steps":["Set up the relationship: λ_peak=b/T.","λ_peak=3000/300=10 μm."],"answer":"The rounded peak wavelength is 10 micrometres in the infrared.","mistake":"A hotter blackbody peaks at a shorter wavelength."}
    - {"title":"Read a repeating light curve","problem":"A brightness pattern repeats every 4 hours. What repetition period is measured, and what caution applies to rotation?","rule":"A light curve measures repeated brightness, which may repeat more than once per physical rotation.","steps":["The observed brightness period is 4 h.","If the shape gives two similar brightness cycles per rotation, the rotation period could be 8 h."],"answer":"The light curve alone may not distinguish 4-hour rotation from a double-peaked 8-hour rotation.","mistake":"Do not automatically identify every brightness cycle with one full turn."}
    - {"title":"Separate a fitted product","problem":"A rectangle has area 24 cm². Can area alone determine its length and width?","rule":"Area = length × width. One equation may leave more than one unknown pair.","steps":["24 = 6×4 and 24 = 8×3. Both pairs have the correct area.","If width is independently measured as 4 cm, length = 24/4 = 6 cm."],"answer":"Area alone is insufficient; the additional width measurement selects 6 cm by 4 cm.","mistake":"One matching output does not identify both input parameters."}

  stops:
  # --- Stop 21: Reproduce the assumption

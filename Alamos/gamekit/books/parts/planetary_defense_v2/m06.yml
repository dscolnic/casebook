    at: sizing-board
    title: "Break the reflected-light locus"
    concept: 3   # diameter-albedo degeneracy
    reason: "The brightness-based estimate leaves size and reflectivity entangled."
    scene: "With the conditional 106 m result visible, slide diameter and albedo along every pair that matches the reflected brightness. Then add the thermal-area constraint and locate the smaller region that satisfies both."
    motivation: "The thermal-area constraint separates diameter from albedo so consequence planning need not assume a bright surface."
    format: DEGENERACY
    question: "Submit the numerical pair (D in meters, pv dimensionless) that satisfies both the reflected-light and thermal controls."
    # Converted from the payload's `degeneracy`. Its two controls are the engine's
    # two; `first_locus` and `second_locus.points` are its `[D, pv]` pairs written

    scene: "The certified photometry gives H = 22.0, while the early notice silently assumed a bright albedo of 0.25. Estimate the diameter produced by that assumption and label the preliminary result as explicitly conditional."
    motivation: "The conditional diameter shows how strongly the early size estimate depends on the adopted albedo."
    format: BALLPARK
    question: "Using every displayed input, submit one conditional diameter in meters."
    # Converted from the payload's `estimate`. Its three tiles keep its own

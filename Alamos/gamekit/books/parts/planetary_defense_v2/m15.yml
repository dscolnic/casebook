  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 15: worked examples"
    examples:
    - {"title":"Interpret a possible-impact corridor","problem":"A model produces a strip of possible impact locations. Does the centerline identify a guaranteed impact point?","rule":"A corridor represents a spread of supported locations under uncertainty.","steps":["Locations across the strip remain possible within the model.","The centerline is a summary of that distribution, not a guarantee about one location."],"answer":"Planning should preserve the uncertainty rather than treat the centerline as certain.","mistake":"A narrow-looking map symbol can hide substantial uncertainty."}
    - {"title":"Surface impact versus airburst","problem":"Two equal-energy objects enter an atmosphere, but one fragments high above the ground and the other reaches the surface. Must their damage patterns match?","rule":"Energy matters, but the altitude and manner of deposition affect consequences.","steps":["The fragmenting object deposits more energy along an atmospheric path.","The surface-reaching object deposits energy differently, including at the ground."],"answer":"Equal initial kinetic energy does not imply equal local damage patterns.","mistake":"Energy alone cannot determine a unique damage radius without a consequence model."}
    - {"title":"Count collision-compatible paths","problem":"In a deliberately equally weighted toy sample of 100 possible paths, 8 cross a target. Estimate collision probability within this sample.","rule":"For equally weighted representative paths, probability estimate=hits/total.","steps":["Set up the relationship: For equally weighted representative paths, probability estimate=hits/total.","p=8/100=0.08=8%."],"answer":"The sample estimate is 8%, conditional on the model and equal weighting.","mistake":"Unweighted counting is invalid if the paths carry unequal probabilities."}
    - {"title":"Probability and expected loss","problem":"Two hypothetical events have probabilities 0.1 and 0.01 and losses 100 and 2000 units. Compare expected losses.","rule":"Expected loss=probability×loss in this two-outcome model.","steps":["Set up the relationship: Expected loss=probability×loss in this two-outcome model.","first=0.1(100)=10; second=0.01(2000)=20 units."],"answer":"The less probable event has the larger expected loss in this simplified calculation.","mistake":"Expected loss is not the loss that must occur on one realization."}
    - {"title":"Read an inclusive threshold","problem":"A fictional laboratory rule permits a sample concentration at or below 5 mg/L. A sample measures exactly 5 mg/L. Classify it under that rule.","rule":"At or below means concentration ≤ limit.","steps":["comparison = 5 ≤ 5, which is true. Equality is included.","classification = passes this concentration rule. No claim about other requirements follows."],"answer":"This measurement passes the stated inclusive threshold.","mistake":"Replacing ≤ with < would wrongly exclude equality."}


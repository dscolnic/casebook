      scale:
        label: impact probability
        unit: "%"
        min: 0
        max: 12
        step: 0.5
        anchors:
          - at: 2.4
            means: routine baseline, not the decision threshold
          - at: 7.8
            means: elevated evidence requiring attention
      direction: rising
      conditions:
        - id: act
          label: Take the protective action
          leadHours: 12
          window:
            min: 8
            max: 12
      stream:

  # --- Stop 12: Write the line before the update
  #     Concept: notification threshold; Keystone: thresholds/verification; Area: Coordination Office; Learning role: INTRODUCE; Difficulty: L5; Story role: decision.
  #     placement: TRIGGER, at scopeboard.
  - group: OPS
    at: scopeboard
    title: "Write the line before the update"
    concept: 29   # notification threshold
    reason: "The sensitivity tests justify a notice, whose conditions must be fixed before the next update."
    scene: "Because the impact probability remains above 1% under every justified test, write the action threshold before revealing the final update. Pair the threshold with consequence and uncertainty language that prevents it from sounding like certainty."
    motivation: "The threshold and conditional wording determine when the notice is issued and what it can legitimately promise."
    format: TRIGGER
    question: "Commit the numerical trigger first; after the 8.0% update appears, submit one action: CONDITIONAL NOTICE or NO NOTICE."
    answerText: "The threshold starts international coordination; it does not announce a certain impact."
    why: "Precommitted thresholds make action reproducible and reduce motivated changes after alarming evidence appears."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Waiting for certainty wastes warning time; declaring impact ignores the 92% of current probability that misses.
    # correct result: Issue conditional notice with date, size range, probability, and uncertainty.
    # state/output: Notice transmits; public news wall activates; Mission 4 observing review unlocks.

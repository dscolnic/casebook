  # --- Stop 11: Stress the warning
  #     Concept: robustness; Keystone: uncertainty/probability; Area: Orbit Determination Center; Learning role: COMBINE; Difficulty: L4; Story role: obstacle.
  #     placement: STRESS, asked by Malik Rowan beside delivery-desk.
  - group: ORBIT
    at: delivery-desk
    title: "Stress the warning"
    person: rowan
    concept: 11   # robustness
    reason: "The rising probability must survive reasonable error assumptions before it supports notification."
    scene: "Because the normalized cloud gives 8.0%, vary the astrometric weights, focusing radius, and one-frame timing uncertainty across justified ranges. Determine whether every reasonable case remains above the 1% notification line."
    motivation: "The lowest supported probability determines whether the notification threshold is exceeded throughout the sensitivity tests."
    format: STRESS
    question: "Submit the minimum probability in percent and one conclusion: ROBUSTLY ABOVE THRESHOLD or NOT ROBUST."
    answerText: "The exact probability varies, but the decision to notify is robust."
    why: "Decision robustness depends on whether reasonable assumptions cross the action boundary, not whether they change the reported number."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Separate uncertainty in the exact percentage from uncertainty about which side of 1% it occupies.
    # correct result: Yes; minimum 6.7% remains above 1%.

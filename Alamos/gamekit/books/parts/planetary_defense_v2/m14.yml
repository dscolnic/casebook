  # --- Stop 55: Trace independent confirmation
  #     Concept: confirmation; Keystone: provenance/independence; Area: Bistatic Radar Range; Learning role: REINFORCE; Difficulty: L5; Story role: evidence.
  #     placement: TRACE, at echo-archive.
  - group: RADAR
    at: echo-archive
    title: "Trace independent confirmation"
    concept: 18   # confirmation
    reason: "The radar candidate needs confirmation from an optical search that did not inherit its processing errors."
    scene: "Lena reports a faint optical point near the predicted secondary ephemeris after the radar shift begins. Trace its image, timestamp, reduction pipeline, and blind-search log to decide whether it independently confirms the radar candidate."
    motivation: "The image and timing provenance determines whether the faint optical point independently supports the secondary track."
    format: TRACE
    question: "Submit the completed optical dependency chain and one conclusion: INDEPENDENT or NOT INDEPENDENT."
    # Converted from the payload's `trace`. Its `shared_resources` are the
    # engine's `resources`, `depends_on` is `depends`, and the payload's
    # `truth.independent_channels` is the board's `independent` list — which is
    # where the engine reads it from, never a flag on the channel itself.
    trace:
      resources:
      - { id: disc_optical, label: DISC optical packet and reduction }
      - { id: radar_path, label: "RADAR hardware, clock, and processing" }
      target: disc_optical
      channels:
      - { id: optical_position, label: Optical sky position, reading: candidate present, depends: [disc_optical] }
      - { id: optical_timestamp, label: Optical UTC timestamp, reading: timestamp valid, depends: [disc_optical] }
      - { id: blind_search, label: Blind-search log, reading: search completed before coordinate share, depends: [disc_optical] }
      - { id: radar_delay, label: Radar secondary delay, reading: monotonic separation, depends: [radar_path] }
      independent: [radar_delay]
      commit: Report the dependency chain
    answerText: "Separate hardware, timing, processing, and blind search break the error chain."
    why: "TRACE establishes evidence origin and dependencies."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Agreement is strongest when channels could fail differently.
    # correct result: Accept independent confirmation.
    # state/output: SECONDARY DETECTION transferred to ORBIT.

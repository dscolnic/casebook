  # --- Stop 18: Preserve Every Region
  #     Concept: stratified/cluster/systematic; Keystone: keystone sampling; Area: Monitoring Board Room; Learning role: PRACTICE; Difficulty: L2; Story role: clue.
  #     placement: CHOICE, asked by Eli Navarro beside enrollment-wall.
  - group: SAFE
    at: enrollment-wall
    title: "Preserve Every Region"
    person: navarro
    concept: 5   # stratified/cluster/systematic
    reason: "The chart-sampling procedure does not guarantee enough rural patients for a useful access audit."
    scene: "The chance audit works, but a plain SRS could include too few rural patients to check travel barriers. Choose a design that splits urban and rural patients first, then samples randomly within each group."
    motivation: "The sampling design determines whether both residence groups are represented while retaining random selection within each."
    format: CHOICE
    question: "Submit one selection from the four distinct choice items below."
    choices:
    - "Stratify by residence, then take an SRS within each residence stratum."
    - "Select a few residence regions as clusters and include everyone in them."
    - "Use the easiest patients to contact in each region."
    - "Take one overall SRS and ignore residence during selection."
    answer: "Stratify by residence, then take an SRS within each residence stratum."
    answerText: "The completed check shows stratify by residence, then take an SRS within each stratum."
    why: "Stratification protects comparison across important groups while keeping selection random."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2)
    # correct result: Stratify by residence, then take an SRS within each stratum.
    # state/output: rural roster opens; travel to DATA.

  # --- Stop 19: Find Who Never Entered
  #     Concept: undercoverage/nonresponse/response bias; Keystone: keystone sampling; Area: Randomisation & Blinding; Learning role: COMBINE; Difficulty: L3; Story role: reveal.
  #     placement: PROBE, at roster-wall.
  - group: RAND
    at: roster-wall
    title: "Find Who Never Entered"
    concept: 7   # undercoverage/nonresponse/response bias
    reason: "The stratified plan reveals that some rural patients disappear before sampling even begins."
    scene: "The stratified roster exposes a sharp drop before enrollment, not only after questionnaires were sent. Probe eligibility, contact, response, and enrollment stations to locate exactly where rural patients disappear today."
    motivation: "The stage-by-stage counts distinguish missing coverage in the sampling frame from later nonresponse."
    format: PROBE
    question: "Probe the four stations in order - eligible list, sampling frame, contacted sample, and completed response. At each station compare the observed count with its stated expected count, then submit the first break and classify the bias."
    # THE BIBLE'S PAYLOAD, converted. Its four stations keep their ids, labels,
    # readings and expected counts; `first_break` is the engine's `target`, and
    # `load` becomes the chain's own load line. The bible writes reading and
    # expected as bare numbers with a separate `unit: patients`, so each is
    # written here as the quantity it is — the engine prints these strings.
    probe:
      load: Rural-patient roster, expected flow from the eligibility audit
      stations:
        - id: eligible
          label: Eligible list
          reading: 120
          expected: 120
          comparison: matches
          unit: patients
        - id: frame
          label: Sampling frame
          reading: 92
          expected: 120
          comparison: 28 missing before sampling
          unit: patients
        - id: contacted
          label: Contacted sample
          reading: 80
          expected: 92
          comparison: 12 sampled patients not reached
          unit: patients
        - id: response
          label: Completed response
          reading: 74
          expected: 80
          comparison: 6 contacted patients did not answer
          unit: patients
      ordered: true
      first_break: frame
      correct_conclusion: 28-person undercoverage before sampling; later losses are nonresponse
      submission: station, numerical gap, and bias classification
    answerText: "The completed check shows twenty-eight eligible rural patients never entered the frame, so this is undercoverage; later losses include nonresponse. Leading questions would instead create response bias."
    why: "Different bias mechanisms require different repairs and support different claims."
    # wrong-path feedback, one rebuttal per wrong option:
    #   All absence is nonresponse; locate pre-frame loss
    # correct result: Twenty-eight eligible rural patients never entered the frame, so this is undercoverage; later losses include nonresponse. Leading questions would instead create response bias.
    # state/output: pipeline marks FRAME GAP; S4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   probe:{load:"Rural-patient roster, expected flow from the eligibility audit",stations:[{id:"eligible",label:"Eligible list",reading:120,expected:120,comparison:"matches",unit:"patients"},{id:"frame",label:"Sampling frame",reading:92,expected:120,comparison:"28 missing before sampling",unit:"patients"},{id:"contacted",label:"Contacted sample",reading:80,expected:92,comparison:"12 sampled patients not reached",unit:"patients"},{id:"response",label:"Completed response",reading:74,expected:80,comparison:"6 contacted patients did not answer",unit:"patients"}],ordered:true,first_break:"frame",correct_conclusion:"28-person undercoverage before sampling; later losses are nonresponse",submission:"station, numerical gap, and bias classification"}

  # --- Stop 20: Set the Scope
  #     Concept: observational/experiment and inference scope; Keystone: keystone design/sampling; Area: Randomisation & Blinding; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: DIAGNOSIS, at extraction-console.
  - group: RAND
    at: extraction-console
    title: "Set the Scope"
    concept: 1   # observational/experiment and inference scope
    reason: "The enrollment audit changes how broadly the trial's treatment comparison can be interpreted."
    scene: "Select the conclusion that respects causal design while limiting population generalization."
    motivation: "The distinction between random assignment and representative sampling determines the causal claim and the population it can address."
    format: DIAGNOSIS
    question: "Use the random-assignment, sampling-frame, undercoverage, and concealment readings. Submit the strongest causal conclusion and honest population-generalization limit."
    headline: "SCOPE OF INFERENCE"
    # The four readings and their statuses are the bible's: random assignment
    # passes, the missing population random sample is a warning, rural
    # undercoverage is an alarm, treatment concealment is quiet. `low` is the
    # engine's amber status, which is what the bible's "warning" is.
    # DERIVED: `zone`, the display each reading comes off — each is the bible's
    # own name for that reading.
    readings: []
    # The four candidates are the bible's own choice list, in its order and its
    # words: "cause+all patients; association only; cause for trial-like patients
    # with limited generalization; generalize no cause", answer the third.
    choices:
    - "Cause, and for all patients"
    - "Association only"
    - "Cause for trial-like patients, with limited generalization"
    - "Generalize to the population, but no cause"
    answer: "Cause for trial-like patients, with limited generalization"
    answerText: "The completed check shows random assignment supports a causal treatment comparison, but biased enrollment limits generalization beyond patients like those enrolled."
    why: "A randomized experiment can support causation for studied participants without representing everyone the treatment may reach."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Randomized trial automatically generalizes
    # correct result: Random assignment supports a causal treatment comparison, but biased enrollment limits generalization beyond patients like those enrolled.

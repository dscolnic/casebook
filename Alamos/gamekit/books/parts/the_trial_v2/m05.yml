  worked:
    label: "Worked examples"
    title: "Mission 5: worked examples"
    examples:
    - {"title":"A simple random sample","problem":"A list contains 100 students. Describe a simple random sample of 10.","rule":"Every subset of 10 should have the same chance of selection.","steps":["Assign each student a distinct number from 1 to 100.","Use a random generator to select 10 distinct numbers without replacement."],"answer":"Survey the selected students, while tracking any nonresponse.","mistake":"Choosing whoever replies first is not random sampling."}
    - {"title":"Sample within groups","problem":"A school has 60 juniors and 40 seniors. Select a proportional stratified sample of 20.","rule":"Sample randomly within each defined group.","steps":["junior sample=20(60/100)=12; senior sample=20(40/100)=8.","Randomly choose 12 juniors and 8 seniors from their separate lists."],"answer":"Both groups are represented in their population proportions.","mistake":"Stratification does not mean choosing the easiest people in each group."}
    - {"title":"Sample whole groups","problem":"A district has 20 classes. It randomly selects 4 and surveys every student in those classes. Identify the design.","rule":"Cluster sampling selects whole groups and measures their members.","steps":["The random selection acts on classes, not directly on individual students.","Every member of each selected class is included."],"answer":"This is a cluster sample.","mistake":"Sampling a few students from every class would instead resemble stratification."}
    - {"title":"Identify undercoverage","problem":"A town estimates average resident age using only a list of homeowners. What can go wrong?","rule":"Undercoverage occurs when some population members cannot enter the sampling frame.","steps":["Renters and residents who do not own their homes are missing from the list.","If their ages differ systematically, random selection within the homeowner list does not remove that bias."],"answer":"The sample may not represent all town residents.","mistake":"A large sample cannot repair a frame that excludes relevant groups."}
    - {"title":"Distinguish parameter from statistic","problem":"A school has 800 students. A random sample of 40 has mean height 160 cm. Is 160 a parameter or a statistic?","rule":"A parameter describes the population; a statistic is calculated from a sample.","steps":["The population is all 800 students; only 40 heights were used.","The value 160 cm is a sample mean, so it estimates the unknown population mean."],"answer":"It is a statistic.","mistake":"Random sampling does not turn a statistic into a population parameter."}

  stops:
  # --- Stop 17: Draw an SRS
  #     Concept: SRS/RNG; Keystone: keystone sampling; Area: Monitoring Board Room; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: PROTOCOL, at monitor-desk.
  - group: SAFE
    at: monitor-desk
    title: "Draw an SRS"
    concept: 2   # SRS/RNG
    reason: "The targeted audit needs a reproducible chart sample before monitors inspect the records."
    scene: "The site has charts numbered 001 through 240, and the audit needs 12 without replacement. Build a fully reproducible random-number procedure that another monitor can repeat from the saved seed."
    motivation: "The random-number procedure determines whether every eligible chart has the intended selection chance without replacement."
    format: PROTOCOL
    question: "Build a simple random sample (SRS) using a random-number generator (RNG). Assign labels 001-240; accept generated labels in that range, ignore repeats and values 241-999, and stop after 12 unique valid labels."
    # THE BIBLE'S PAYLOAD, converted. Its five `scenarios` and five `choices` keep
    # their own text, and its `mapping` — label:assign, draw:rng,
    # repeat:ignore_repeat, outside:ignore_outside, stop:finish — becomes the same
    # five pairs as zero-based indices into `choices`. The two "ignore and draw
    # again" responses read alike because the bible wrote them alike.
    columns: [Situation, Response]
    scenarios:
      - label 240 charts
      - generate a three-digit number
      - number repeats
      - number is 241-999
      - 12 unique valid labels recorded
    choices:
      - assign unique labels 001-240
      - use the recorded RNG seed
      - ignore and draw again
      - ignore and draw again
      - stop sampling
    mapping:
      - 0
      - 1
      - 2
      - 3
      - 4
    answerText: "The completed check shows record the seed, generate three-digit numbers, ignore repeats and 241-999, and stop after 12 unique charts."
    why: "A chance mechanism prevents staff from selecting only easy or complete charts."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Random means arbitrary; require seed/range/repeats
    # correct result: Record the seed, generate three-digit numbers, ignore repeats and 241-999, and stop after 12 unique charts.
    # state/output: The reproducible audit list prints and unlocks Stop 18.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.

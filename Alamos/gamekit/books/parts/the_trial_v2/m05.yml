  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 5: worked examples"
    examples:
    - {"title":"A simple random sample","problem":"A list contains 100 students. Describe a simple random sample of 10.","rule":"Every subset of 10 should have the same chance of selection.","steps":["Assign each student a distinct number from 1 to 100.","Use a random generator to select 10 distinct numbers without replacement."],"answer":"Survey the selected students, while tracking any nonresponse.","mistake":"Choosing whoever replies first is not random sampling."}
    - {"title":"Sample within groups","problem":"A school has 60 juniors and 40 seniors. Select a proportional stratified sample of 20.","rule":"Sample randomly within each defined group.","steps":["junior sample=20(60/100)=12; senior sample=20(40/100)=8.","Randomly choose 12 juniors and 8 seniors from their separate lists."],"answer":"Both groups are represented in their population proportions.","mistake":"Stratification does not mean choosing the easiest people in each group."}
    - {"title":"Sample whole groups","problem":"A district has 20 classes. It randomly selects 4 and surveys every student in those classes. Identify the design.","rule":"Cluster sampling selects whole groups and measures their members.","steps":["The random selection acts on classes, not directly on individual students.","Every member of each selected class is included."],"answer":"This is a cluster sample.","mistake":"Sampling a few students from every class would instead resemble stratification."}
    - {"title":"Identify undercoverage","problem":"A town estimates average resident age using only a list of homeowners. What can go wrong?","rule":"Undercoverage occurs when some population members cannot enter the sampling frame.","steps":["Renters and residents who do not own their homes are missing from the list.","If their ages differ systematically, random selection within the homeowner list does not remove that bias."],"answer":"The sample may not represent all town residents.","mistake":"A large sample cannot repair a frame that excludes relevant groups."}
    - {"title":"Distinguish parameter from statistic","problem":"A school has 800 students. A random sample of 40 has mean height 160 cm. Is 160 a parameter or a statistic?","rule":"A parameter describes the population; a statistic is calculated from a sample.","steps":["The population is all 800 students; only 40 heights were used.","The value 160 cm is a sample mean, so it estimates the unknown population mean."],"answer":"It is a statistic.","mistake":"Random sampling does not turn a statistic into a population parameter."}

  stops:
  # --- Stop 17: Draw an SRS
  #     Concept: SRS/RNG; Keystone: keystone sampling; Area: Monitoring Board Room; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: PROTOCOL, at monitor-desk.
  - group: SAFE
    at: monitor-desk
    title: "Draw an SRS"
    concept: 2   # SRS/RNG
    reason: "The targeted audit needs a reproducible chart sample before monitors inspect the records."
    scene: "The site has charts numbered 001 through 240, and the audit needs 12 without replacement. Build a fully reproducible random-number procedure that another monitor can repeat from the saved seed."
    motivation: "The random-number procedure determines whether every eligible chart has the intended selection chance without replacement."
    format: PROTOCOL
    question: "Build a simple random sample (SRS) using a random-number generator (RNG). Assign labels 001-240; accept generated labels in that range, ignore repeats and values 241-999, and stop after 12 unique valid labels."
    # THE BIBLE'S PAYLOAD, converted. Its five `scenarios` and five `choices` keep
    # their own text, and its `mapping` — label:assign, draw:rng,
    # repeat:ignore_repeat, outside:ignore_outside, stop:finish — becomes the same
    # five pairs as zero-based indices into `choices`. The two "ignore and draw
    # again" responses read alike because the bible wrote them alike.
    columns: [Situation, Response]
    scenarios:
    - "label 240 charts"
    - "generate a three-digit number"
    - "number repeats"
    - "number is 241-999"
    - "12 unique valid labels recorded"
    choices:
    - "assign unique labels 001-240"
    - "use the recorded RNG seed"
    - "ignore and draw again"
    - "ignore and draw again"
    - "stop sampling"
    mapping: [0, 1, 2, 3, 4]
    answerText: "The completed check shows record the seed, generate three-digit numbers, ignore repeats and 241-999, and stop after 12 unique charts."
    why: "A chance mechanism prevents staff from selecting only easy or complete charts."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Random means arbitrary; require seed/range/repeats
    # correct result: Record the seed, generate three-digit numbers, ignore repeats and 241-999, and stop after 12 unique charts.
    # state/output: The reproducible audit list prints and unlocks Stop 18.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   protocol:{scenarios:[{id:"label",text:"label 240 charts"},{id:"draw",text:"generate a three-digit number"},{id:"repeat",text:"number repeats"},{id:"outside",text:"number is 241-999"},{id:"stop",text:"12 unique valid labels recorded"}],choices:[{id:"assign",text:"assign unique labels 001-240"},{id:"rng",text:"use the recorded RNG seed"},{id:"ignore_repeat",text:"ignore and draw again"},{id:"ignore_outside",text:"ignore and draw again"},{id:"finish",text:"stop sampling"}],mapping:{label:"assign",draw:"rng",repeat:"ignore_repeat",outside:"ignore_outside",stop:"finish"},answerText:"Record the seed, use labels 001-240, ignore repeats and out-of-range numbers, and stop at 12 unique charts."}

  # --- Stop 18: Preserve Every Region
  #     Concept: stratified/cluster/systematic; Keystone: keystone sampling; Area: Monitoring Board Room; Learning role: PRACTICE; Difficulty: L2; Story role: clue.
  #     placement: CHOICE, asked by Eli Navarro beside enrollment-wall.
  - group: SAFE
    at: enrollment-wall
    title: "Preserve Every Region"
    person: navarro
    concept: 5   # stratified/cluster/systematic
    reason: "The chart-sampling procedure does not guarantee enough rural patients for a useful access audit."
    scene: "The chance audit works, but a plain SRS could include too few rural patients to check travel barriers. Choose a design that splits urban and rural patients first, then samples randomly within each group."
    motivation: "The sampling design determines whether both residence groups are represented while retaining random selection within each."
    format: CHOICE
    question: "Submit one selection from the four distinct choice items below."
    choices:
    - "Stratify by residence, then take an SRS within each residence stratum."
    - "Select a few residence regions as clusters and include everyone in them."
    - "Use the easiest patients to contact in each region."
    - "Take one overall SRS and ignore residence during selection."
    answer: "Stratify by residence, then take an SRS within each residence stratum."
    answerText: "The completed check shows stratify by residence, then take an SRS within each stratum."
    why: "Stratification protects comparison across important groups while keeping selection random."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2)
    # correct result: Stratify by residence, then take an SRS within each stratum.
    # state/output: rural roster opens; travel to DATA.

  # --- Stop 19: Find Who Never Entered
  #     Concept: undercoverage/nonresponse/response bias; Keystone: keystone sampling; Area: Randomisation & Blinding; Learning role: COMBINE; Difficulty: L3; Story role: reveal.
  #     placement: PROBE, at roster-wall.
  - group: RAND
    at: roster-wall
    title: "Find Who Never Entered"
    concept: 7   # undercoverage/nonresponse/response bias
    reason: "The stratified plan reveals that some rural patients disappear before sampling even begins."
    scene: "The stratified roster exposes a sharp drop before enrollment, not only after questionnaires were sent. Probe eligibility, contact, response, and enrollment stations to locate exactly where rural patients disappear today."
    motivation: "The stage-by-stage counts distinguish missing coverage in the sampling frame from later nonresponse."
    format: PROBE
    question: "Probe the four stations in order - eligible list, sampling frame, contacted sample, and completed response. At each station compare the observed count with its stated expected count, then submit the first break and classify the bias."
    # THE BIBLE'S PAYLOAD, converted. Its four stations keep their ids, labels,
    # readings and expected counts; `first_break` is the engine's `target`, and
    # `load` becomes the chain's own load line. The bible writes reading and
    # expected as bare numbers with a separate `unit: patients`, so each is
    # written here as the quantity it is — the engine prints these strings.
    probe:
      chainLabel: "Roster station"
      commit: "Name the station where the count first breaks"
      minReadings: 4
      target: frame
      stations:
      - { id: eligible, label: "Eligible list", reading: "120 patients",
          expected: "120 patients on the eligibility audit",
          load: "Rural-patient roster, expected flow from the eligibility audit" }
      - { id: frame, label: "Sampling frame", reading: "92 patients",
          expected: "120 patients on the eligibility audit",
          load: "Rural-patient roster, expected flow from the eligibility audit" }
      - { id: contacted, label: "Contacted sample", reading: "80 patients",
          expected: "92 patients in the sampling frame",
          load: "Rural-patient roster, expected flow from the eligibility audit" }
      - { id: response, label: "Completed response", reading: "74 patients",
          expected: "80 patients contacted",
          load: "Rural-patient roster, expected flow from the eligibility audit" }
    answerText: "The completed check shows twenty-eight eligible rural patients never entered the frame, so this is undercoverage; later losses include nonresponse. Leading questions would instead create response bias."
    why: "Different bias mechanisms require different repairs and support different claims."
    # wrong-path feedback, one rebuttal per wrong option:
    #   All absence is nonresponse; locate pre-frame loss
    # correct result: Twenty-eight eligible rural patients never entered the frame, so this is undercoverage; later losses include nonresponse. Leading questions would instead create response bias.
    # state/output: pipeline marks FRAME GAP; S4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   probe:{load:"Rural-patient roster, expected flow from the eligibility audit",stations:[{id:"eligible",label:"Eligible list",reading:120,expected:120,comparison:"matches",unit:"patients"},{id:"frame",label:"Sampling frame",reading:92,expected:120,comparison:"28 missing before sampling",unit:"patients"},{id:"contacted",label:"Contacted sample",reading:80,expected:92,comparison:"12 sampled patients not reached",unit:"patients"},{id:"response",label:"Completed response",reading:74,expected:80,comparison:"6 contacted patients did not answer",unit:"patients"}],ordered:true,first_break:"frame",correct_conclusion:"28-person undercoverage before sampling; later losses are nonresponse",submission:"station, numerical gap, and bias classification"}

  # --- Stop 20: Set the Scope
  #     Concept: observational/experiment and inference scope; Keystone: keystone design/sampling; Area: Randomisation & Blinding; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: DIAGNOSIS, at extraction-console.
  - group: RAND
    at: extraction-console
    title: "Set the Scope"
    concept: 1   # observational/experiment and inference scope
    reason: "The enrollment audit changes how broadly the trial's treatment comparison can be interpreted."
    scene: "Select the conclusion that respects causal design while limiting population generalization."
    motivation: "The distinction between random assignment and representative sampling determines the causal claim and the population it can address."
    format: DIAGNOSIS
    question: "Use the random-assignment, sampling-frame, undercoverage, and concealment readings. Submit the strongest causal conclusion and honest population-generalization limit."
    headline: "SCOPE OF INFERENCE"
    # The four readings and their statuses are the bible's: random assignment
    # passes, the missing population random sample is a warning, rural
    # undercoverage is an alarm, treatment concealment is quiet. `low` is the
    # engine's amber status, which is what the bible's "warning" is.
    # DERIVED: `zone`, the display each reading comes off — each is the bible's
    # own name for that reading.
    readings:
    - { zone: "Random assignment", label: "Inside the trial", value: "pass", status: normal }
    - { zone: "Population random sample", label: "Selection from the population", value: "none", status: low }
    - { zone: "Rural undercoverage", label: "Eligible patients never in the frame", value: "28 patients", status: alarm }
    - { zone: "Treatment concealment", label: "Assignment path", value: "intact", status: normal }
    # The four candidates are the bible's own choice list, in its order and its
    # words: "cause+all patients; association only; cause for trial-like patients
    # with limited generalization; generalize no cause", answer the third.
    choices:
    - "Cause, and for all patients"
    - "Association only"
    - "Cause for trial-like patients, with limited generalization"
    - "Generalize to the population, but no cause"
    answer: "Cause for trial-like patients, with limited generalization"
    answerText: "The completed check shows random assignment supports a causal treatment comparison, but biased enrollment limits generalization beyond patients like those enrolled."
    why: "A randomized experiment can support causation for studied participants without representing everyone the treatment may reach."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Randomized trial automatically generalizes
    # correct result: Random assignment supports a causal treatment comparison, but biased enrollment limits generalization beyond patients like those enrolled.
    # state/output: FAST becomes NARROW SAMPLE; binder 5; M6.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   readings random assignment alarm-pass, no population random sample warning, rural undercoverage alarm, treatment concealment quiet. Choices: cause+all patients; association only; cause for trial-like patients with limited generalization; generalize no cause. Answer third.

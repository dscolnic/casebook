    - {"title":"An expected table count","problem":"In a two-way table, one row totals 40, one column totals 30, and the grand total is 100. Find their expected cell count under independence.","rule":"Expected count = row total × column total / grand total.","steps":["Set up the relationship: Expected count = row total × column total / grand total.","E=40(30)/100=12."],"answer":"The expected count is 12.","mistake":"Expected counts use table margins, not the observed count in that cell."}

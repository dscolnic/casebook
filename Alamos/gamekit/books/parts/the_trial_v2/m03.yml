  worked:
    label: "Worked examples"
    title: "Mission 3: worked examples"
    examples:
    - {"title":"Count overlap once","problem":"Events A and B have probabilities 0.4 and 0.3, with overlap 0.1. Find P(A or B).","rule":"P(A or B)=P(A)+P(B)-P(A and B).","steps":["Set up the relationship: P(A or B)=P(A)+P(B)-P(A and B).","P(A or B)=0.4+0.3-0.1=0.6."],"answer":"The probability of at least one event is 0.6.","mistake":"Adding without subtracting overlap counts the shared outcomes twice."}
    - {"title":"Restrict the denominator","problem":"Among 20 red objects, 5 are large. Find the probability that an object is large given that it is red.","rule":"Conditional probability uses only cases satisfying the given condition.","steps":["Set up the relationship: Conditional probability uses only cases satisfying the given condition.","P(large|red)=5/20=0.25."],"answer":"One quarter of the red objects are large.","mistake":"Do not divide by the number of all objects when the condition restricts the sample space."}
    - {"title":"Multiply independent probabilities","problem":"Two independent components work with probabilities 0.8 and 0.5. Find the probability both work.","rule":"For independent events, P(A and B)=P(A)P(B).","steps":["Set up the relationship: For independent events, P(A and B)=P(A)P(B).","P(both)=0.8×0.5=0.4."],"answer":"Both work with probability 0.4.","mistake":"Multiplication in this form requires independence."}
    - {"title":"At least one success","problem":"Two independent attempts each succeed with probability 0.5. Find the probability of at least one success.","rule":"P(at least one)=1-P(none).","steps":["Set up the relationship: P(at least one)=1-P(none).","P(none)=0.5²=0.25; P(at least one)=1-0.25=0.75."],"answer":"The probability is 0.75.","mistake":"Adding the two success probabilities double-counts the case where both succeed."}
    - {"title":"Exclusive is not independent","problem":"On one fair die roll, A is rolling 1 and B is rolling 2. Are these events independent?","rule":"Independence requires P(A and B)=P(A)P(B).","steps":["P(A and B)=0 because one roll cannot be both 1 and 2.","P(A)P(B)=(1/6)(1/6)=1/36, which is not zero."],"answer":"The events are mutually exclusive and not independent.","mistake":"For positive-probability events, mutually exclusive does not mean independent."}


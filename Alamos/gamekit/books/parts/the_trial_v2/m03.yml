  # --- Stop 10: Ask Among the Flagged
  #     Concept: conditional probability; Keystone: keystone probability; Area: Statistics & Analysis; Learning role: PRACTICE; Difficulty: L2; Story role: reveal.
  #     placement: BALLPARK, at event-console.
  - group: STAT
    at: event-console
    title: "Ask Among the Flagged"
    concept: 24   # conditional probability
    reason: "The unique warning count leaves the shipment-flagged group needing its own risk estimate."
    scene: "With duplicate reports removed, the shipment flag can become the conditioning group rather than another headline count. Use the two-percent overlap and five-percent flag rate to calculate the serious-event probability among flagged shipments."
    motivation: "Conditional event probability measures how concentrated serious events are among flagged shipments."
    format: BALLPARK
    question: "The probability of both a serious event and a shipment flag is 0.02, while the probability of a shipment flag is 0.05. Use P(serious event | shipment flag)=P(serious event and shipment flag)/P(shipment flag) and submit the conditional probability as a percent."
    # The formula, the two visible probabilities, the target 0.40 and the 0.005
    # tolerance are all the prompt's own. The third tile, 0.08, is the marginal
    # rate this mission's other consoles carry (stop 9's P(A)=0.08 and stop 11's
    # P(F)=0.08); nothing here is a number mission 3 does not already state.
    estimate:
      prompt: "The console shows P(A and B) = 0.02 and P(B) = 0.05."
      question: "Build the serious-event probability among flagged shipments."
      relationship: "P(A|B) = P(A and B) / P(B), so 0.02 / 0.05"
      labels:
      - "0.02  (overlap, P(A and B))"
      - "0.05  (shipment-flag rate, P(B))"
      - "0.08  (the marginal rate on the event console)"
      values: [0.02, 0.05, 0.08]
      slots: 2
      template: '{0} / {1}'
      formula: a/b
      correct: [0, 1]
      target: 0.40
      tolerance: 0.005
      units: probability
      solution: "P(A|B) = 0.02 / 0.05 = 0.40."
      explanation: "Conditioning divides the overlap by the group being conditioned on, not by the whole cohort."
    answerText: "The completed check shows p(serious event | shipment flag)=0.02/0.05=0.40, so 40% of flagged shipments coincide with a serious event."
    why: "A high conditional rate directs the next inspection toward handling without proving that handling caused harm."
    # wrong-path feedback, one rebuttal per wrong option:
    #   conditional probability or percent
    # correct result: P(serious event | shipment flag)=0.02/0.05=0.40, so 40% of flagged shipments coincide with a serious event.
    # state/output: shipment lane gains 40% conditional-rate label; unlock S3.

  # --- Stop 11: Test Independence
  #     Concept: multiplication rule and independence; Keystone: keystone probability; Area: Statistics & Analysis; Learning role: COMBINE; Difficulty: L3; Story role: reversal.
  #     placement: CONTROL, at event-console.
  - group: STAT
    at: event-console
    title: "Test Independence"
    concept: 1   # multiplication rule and independence
    reason: "The high conditional rate needs comparison with what unrelated warnings would produce."
    scene: "The conditional rate is high, but concentration alone does not show whether shipment flags and serious events move independently. Predict the overlap under independence, then compare it with the observed two-percent overlap while holding the cohort fixed."
    motivation: "The predicted and observed overlaps determine whether shipment flags and serious events behave independently."
    format: CONTROL
    question: "**CALCULATE AND COMMIT:** Use $P(F\\cap E)=P(F)P(E)$ with $P(F)=0.08$ and $P(E)=0.05$; submit the predicted overlap as a percent before the model switch unlocks."
    # MODEL CONVERSION. The bible's three `candidates` are the engine's
    # `variables` and `correct_control` is its `truth`; `fixed` is `held`.
    # The bible states the board as two model readings — observed overlap 2.0%
    # and independent-model overlap 0.4% — while the engine states it as a
    # baseline plus the SIGNED change that switching the suspect produces, so
    # `baseline` is the observed 2.0% and `response` is 0.4 - 2.0 = -1.6
    # percentage points. `noise` is the bible's noise_band of 0.05 percentage
    # point, which -1.6 clears many times over.
    control:
      observable: { label: "Flag/event overlap", unit: "percent" }
      variables:
      - { id: association_model, label: "association model" }
      - { id: flag_rate, label: "shipment-flag marginal rate" }
      - { id: event_rate, label: "serious-event marginal rate" }
      held: ["cohort", "marginal rates", "time window"]
      truth: association_model
      baseline: 2.0
      response: -1.6
      noise: 0.05
      changeVerb: "Switch to the independent model"
      run: "Measure the overlap"
      commit: "Name the model that moved it"
    answerText: "Independence predicts 0.08(0.05)=0.004=0.4%, far below the observed 2.0%. The events are associated, but this alone does not prove causation."
    why: "A failed independence prediction justifies a targeted pause, not a claim that shipment handling caused every event."
    # wrong-path feedback, one rebuttal per wrong option:
    #   predicted percent, readings, conclusion
    # correct result: Predicted independent overlap 0.4%; independent-model reading 0.4%; restored observed reading 2.0%; conclusion not independent; prediction tolerance 0.05 percentage point.
    # state/output: NOT INDEPENDENT appears with broken-link icon; unlock S4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   control:{candidates:[{id:"association_model",label:"association model"},{id:"flag_rate",label:"shipment-flag marginal rate"},{id:"event_rate",label:"serious-event marginal rate"}],correct_control:"association_model",prediction:{equation:"P(F∩E)=P(F)P(E)",inputs:{P_F:0.08,P_E:0.05},submit:{unit:"percent",truth:0.4,tolerance:0.05}},equipment_locked_until_prediction_commit:true,baseline:{model:"observed",overlap:2.0,unit:"percent"},response:{model:"independent",overlap:0.4,unit:"percent"},noise_band:{value:0.05,unit:"percentage point"},fixed:["cohort","marginal rates","time window"],measure_when:"after each model settles",restore:{required:true,model:"observed",overlap:2.0,remeasure:true},correct_conclusion:"not independent",answerText:"Independence predicts 0.4%, but the restored observed overlap is 2.0%, so the events are associated."}

  # --- Stop 12: Pause the Right Places
  #     Concept: complement, independence versus exclusivity, exposure denominators; Keystone: keystone probability; Area: Statistics & Analysis; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: DIAGNOSIS, at board-console.
  - group: STAT
    at: board-console
    title: "Pause the Right Places"
    concept: 27   # complement, independence versus exclusivity, exposure denominators
    reason: "The warning overlap is established, but protective action must not outrun what the association proves."
    scene: "The unique warning rate is 11%, flagged shipments have a 40% serious-event rate, and observed overlap is five times the independent prediction. Choose the action fitting all evidence without claiming a cause the data cannot establish."
    motivation: "The combined risk evidence determines where enrollment should pause without claiming the shipment flag is a proven cause."
    format: DIAGNOSIS
    question: "Compare the 11% warning rate, 40% conditional rate, 2.0% overlap, 0.4% independence expectation, and 29 stable sites. Submit one action and causal-scope conclusion."
    headline: "TWO-SITE SIGNAL"
    # The four readings, their numbers and their alarm/quiet statuses are the
    # bible's. DERIVED: `zone`, which groups a reading with the display it comes
    # off — each is the bible's own name for that reading.
    readings:
    - { zone: "Overall event rate", label: "Across the cohort", value: "8 percent", status: alarm }
    - { zone: "Overlap", label: "Flagged shipments with a serious event", value: "2 percent", status: alarm }
    - { zone: "Independence expectation", label: "Benchmark", value: "0.4 percent", status: normal }
    - { zone: "29 other sites", label: "Enrollment and events", value: "stable", status: normal }
    # The four candidates are the bible's own choice list, in its order and its
    # words: "continue all; stop all; pause sites 12/19 and audit handling;
    # declare drug cause", answer the targeted pause and audit.
    choices:
    - "Continue all"
    - "Stop all"
    - "Pause sites 12 and 19 and audit handling"
    - "Declare the drug the cause"
    answer: "Pause sites 12 and 19 and audit handling"
    answerText: "The completed check shows pause enrollment at sites 12 and 19, audit flagged shipments, and continue enhanced monitoring elsewhere. Association warrants action but does not establish cause."
    why: "The narrowest safe action preserves evidence while preventing more exposure where the signal is concentrated."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Global stop is safest; compare 29 quiet sites
    # correct result: Pause enrollment at sites 12 and 19, audit flagged shipments, and continue enhanced monitoring elsewhere. Association warrants action but does not establish cause.
    # state/output: two site signs change to PAUSED in text; binder piece 3 fills; timestamp clue unlocks M4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   headline TWO-SITE SIGNAL; readings overall event rate 8 alarm, overlap 2 alarm, independence expectation 0.4 quiet benchmark, 29 other sites stable quiet. Choices: continue all; stop all; pause sites 12/19 and audit handling; declare drug cause. Answer targeted pause/audit.

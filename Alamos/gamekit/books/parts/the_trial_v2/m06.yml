  #     Concept: experiment principles; Keystone: keystone study design; Area: Randomisation & Blinding; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: SEQUENCE, at allocation-reader.
  - group: RAND
    at: allocation-reader
    title: "Build the Experiment"
    concept: 2   # experiment principles
    reason: "Repairing the enrollment frame leaves treatment assignment needing protection against site differences."
    scene: "The new frame includes rural patients, but assignment must still separate treatment effects from site differences. Order the design steps so blocking happens before random assignment and outcomes are measured the same way."
    motivation: "Blocking, random assignment, concealment, and common measurement determine whether treatment effects can be separated from patient differences."
    format: SEQUENCE
    question: "Order the six design cards from enrollment through common measurement, placing blocking before random assignment. Submit one complete sequence."

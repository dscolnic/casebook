      - {key: "A", text: "Keeping conditions comparable except for the treatment.", why: "This describes control. It does not answer the question about matched pairs and blinding."}
      - {key: "B", text: "Calling loose similarity a pair could understate variability and overstate precision.", why: "Correct. Calling loose similarity a pair could understate variability and overstate precision."}
      - {key: "C", text: "Correct order prevents site mix from becoming a confounder.", why: "This describes experiment principles. It does not answer the question about matched pairs and blinding."}

    - {"title":"Block before assignment","problem":"Plant growth depends strongly on initial size. How can an experiment compare two fertilizers fairly?","rule":"Blocking groups similar experimental units before random assignment within each block.","steps":["Separate initially small and large plants into blocks.","Randomly assign both fertilizers within each size block; keep other growing conditions comparable."],"answer":"Initial size is controlled through the design while fertilizer is randomized.","mistake":"Giving one fertilizer only to large plants would confound size and treatment."}
    - {"title":"Exactly two successes","problem":"Four independent trials each succeed with probability 0.5. Find P(X=2), where X counts successes.","rule":"Binomial probability P(X=k)=C(n,k)p^k(1-p)^(n-k).","steps":["Set up the relationship: Binomial probability P(X=k)=C(n,k)p^k(1-p)^(n-k).","P(X=2)=6(0.5)²(0.5)²=6/16=0.375."],"answer":"The probability of exactly two successes is 0.375.","mistake":"A single success-failure ordering accounts for only one of the six arrangements."}
    - {"title":"First success on trial three","problem":"Independent trials have success probability 0.5. Find the probability the first success is on trial 3.","rule":"P(X=k)=(1-p)^(k-1)p for a geometric waiting time.","steps":["Set up the relationship: P(X=k)=(1-p)^(k-1)p for a geometric waiting time.","P(X=3)=(0.5)²(0.5)=0.125."],"answer":"The probability is 0.125.","mistake":"The first two attempts must both fail; success on trial three alone is insufficient."}
    - {"title":"Spread of sample means","problem":"A population has mean 50 and SD 12. Independent random samples each contain 36 observations. Find mean and SD of the sample mean.","rule":"Mean(x-bar)=μ; SD(x-bar)=σ/sqrt(n).","steps":["Set up the relationship: Mean(x-bar)=μ; SD(x-bar)=σ/sqrt(n).","mean(x-bar)=50; SD(x-bar)=12/sqrt(36)=12/6=2."],"answer":"Sample means are centered at 50 with spread 2.","mistake":"Individual observations still have SD 12; averaging changes the statistic's spread."}


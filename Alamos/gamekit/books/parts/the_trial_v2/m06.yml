    - "enroll eligible"
    - "block by site/remoteness"
    - "randomly assign within block"
    - "conceal kits"
    - "apply common endpoint"
    - "replicate across patients"
    order: [0, 1, 2, 3, 4, 5]
    answerText: "The completed check shows block similar patients first, randomize within blocks, conceal treatment, and use the same measurement."
    why: "Correct order prevents site mix from becoming a confounder."
    # wrong-path feedback, one rebuttal per wrong option:

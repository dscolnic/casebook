  # --- Stop 24: How Long Until the First
  #     Concept: geometric versus binomial; Keystone: keystone probability; Area: Statistics & Analysis; Learning role: RETRIEVE; Difficulty: L3; Story role: decision.
  #     placement: BALLPARK, at randomisation-board.
  - group: STAT
    at: randomisation-board
    title: "How Long Until the First"
    concept: 15   # geometric versus binomial
    reason: "The precision plan requires rural enrollment, whose screening workload remains uncertain."
    scene: "Recruitment continues until the first eligible candidate. The team needs the expected waiting count for staffing."
    motivation: "Expected trials to first enrollment determines the screening effort implied by the per-candidate success probability."
    format: BALLPARK
    question: "Each independent candidate has eligibility probability p=0.20. For the geometric count including the first eligible candidate, fill 1 and p in E(N)=1/p."
    # The formula, p = 0.20, the target of 5 candidates and the 0.01 tolerance are
    # the prompt's own. The bible's "binomial mean np reminder" has no n on this
    # board, so it is carried in the explanation line rather than as a tile.
    estimate:
      prompt: "Each screened rural candidate enrolls with probability p = 0.20."
      question: "Build the expected number screened until the first enrollment."
      relationship: "geometric mean = 1 / p, so 1 / 0.20"
      labels:
      - "1  (the first enrollment being waited for)"
      - "0.20  (p, success per screened candidate)"
      values: [1, 0.20]
      slots: 2
      template: '{0} / {1}'
      formula: a/b
      correct: [0, 1]
      target: 5
      tolerance: 0.01
      units: candidates
      solution: "1 / 0.20 = 5 candidates screened, on average, before the first enrollment."
      explanation: "The number of trials is not fixed, so this is geometric; a binomial would fix the number of trials first and its mean would be np."
    answerText: "The completed check shows expected trials to first success=1/.20=5. The number of trials is not fixed, so the model is geometric."
    why: "The waiting-time estimate turns a statistical repair into a calendar cost."
    # wrong-path feedback, one rebuttal per wrong option:
    #   candidates screened
    # correct result: Expected trials to first success=1/.20=5. The number of trials is not fixed, so the model is geometric.
    # state/output: five-candidate staffing added; binder 6; M7.

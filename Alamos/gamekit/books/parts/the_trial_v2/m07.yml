  # --- Stop 28: Test the Fast-Site Point
  #     Concept: outlier/leverage/influence and missingness; Keystone: keystone regression/sampling bias; Area: Endpoint Adjudication; Learning role: COMBINE; Difficulty: L4; Story role: decision.
  #     placement: CONTROL, at site-comparison-board.
  - group: ENDP
    at: site-comparison-board
    title: "Test the Fast-Site Point"
    concept: "outlier/leverage/influence and missingness"
    reason: "The complete-case rule depends on whether one extreme-x site controls the line."
    scene: "The residual field is acceptable, but the far-right fast-site point may pull the fitted slope. Remove that point while holding all other records fixed, refit, measure slope change, then restore it."
    motivation: "A substantial line change makes the point influential and blocks an unqualified complete-case analysis."
    format: CONTROL
    question: "Choose fast-site point from candidate controls fast-site point, ordinary residual-outlier point, and display scale. Measure slope at 0.16 day/km, change only the fast-site-point control by removing that point while all other records and the fitted method remain fixed, measure the slope after refitting, restore the point and remeasure, then submit both slopes and whether the point is influential."
    # MODEL CONVERSION. The bible's `candidates` are the engine's `variables` and
    # `correct_control` is its `truth`; `fixed` is `held`; `noise_band.value` is
    # `noise`. The one real conversion is `response`: the bible states the two
    # slopes (0.16 day/km before, 0.10 day/km after the refit) and the engine
    # wants the signed change between them, so 0.10 - 0.16 = -0.06 day/km.
    # The restore step is the engine's own behaviour and needs no field.
    control:
      observable: { label: "Slope", unit: "day/km" }
      variables:
      - { id: fast_site, label: "fast-site point" }
      - { id: residual_outlier, label: "ordinary residual-outlier point" }
      - { id: display_scale, label: "display scale" }
      held: ["all other records", "least-squares method"]
      truth: fast_site
      baseline: 0.16
      response: -0.06
      noise: 0.005
      changeVerb: "Remove"
      run: "Refit the line"
      commit: "Name the influential control"
    answerText: "Removal changes slope from .16 to .10, a large change, so the point is influential. Complete cases overrepresent nearby patients."
    why: "A substantial line change makes the point influential and blocks an unqualified complete-case analysis."
    # wrong-path feedback, one rebuttal per wrong option:
    #   three readings in day/km and conclusion pair
    # correct result: Baseline 0.16 day/km; refit 0.10 day/km; restored reading 0.16 day/km; conclusion pair influential and reject unadjusted complete cases; numeric tolerance 0.005 day/km.
    # state/output: MISSINGNESS: DISTANCE-LINKED; binder 7; M8.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   control:{candidates:[{id:"fast_site",label:"fast-site point"},{id:"residual_outlier",label:"ordinary residual-outlier point"},{id:"display_scale",label:"display scale"}],correct_control:"fast_site",baseline:{slope:0.16,unit:"day/km"},response:{slope:0.10,unit:"day/km"},noise_band:{value:0.005,unit:"day/km"},fixed:["all other records","least-squares method"],measure_when:"after each refit",restore:{required:true,slope:0.16,unit:"day/km",remeasure:true},correct_conclusion:"influential point",answerText:"Removing the fast-site point changes slope from 0.16 to 0.10 day/km, far beyond noise; restoration recovers 0.16."}


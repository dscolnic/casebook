  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 7: worked examples"
    examples:
    - {"title":"Use a regression prediction","problem":"A fitted line predicts length y-hat=2+3x cm from age x in weeks. Predict at x=4 and interpret the slope.","rule":"A fitted line has form y-hat=a+bx.","steps":["Set up the relationship: A fitted line has form y-hat=a+bx.","y-hat=2+3(4)=14 cm; b=3 cm/week."],"answer":"Predicted length is 14 cm; each extra week adds 3 cm to the fitted prediction.","mistake":"A fitted association is not automatically a causal effect."}
    - {"title":"Build a regression line","problem":"Data have r=0.5, sx=2, sy=4, x-bar=6 and y-bar=10. Find slope and intercept.","rule":"b=r(sy/sx); a=y-bar-b x-bar.","steps":["Set up the relationship: b=r(sy/sx); a=y-bar-b x-bar.","b=0.5(4/2)=1; a=10-1(6)=4."],"answer":"The fitted line is y-hat=4+x.","mistake":"The line passes through the two sample means, not necessarily the origin."}
    - {"title":"Interpret explained variation","problem":"A linear regression has correlation r=-0.8. Find and interpret r².","rule":"r² is the fraction of response variation explained by the fitted linear relationship.","steps":["Set up the relationship: r² is the fraction of response variation explained by the fitted linear relationship.","r²=(-0.8)²=0.64."],"answer":"The fit explains 64% of the observed variation in the response.","mistake":"r² is not negative and does not mean 64% of points lie on the line."}
    - {"title":"A measurement minus a prediction","problem":"A thermometer model predicts 20 °C; an independent thermometer reads 22 °C. Find the residual.","rule":"Residual = observed value - predicted value.","steps":["residual = 22 °C - 20 °C. Keep observed first.","residual = +2 °C. The positive sign means the observation is above the prediction."],"answer":"The model underpredicts this reading by 2 °C.","mistake":"Reversing the subtraction reverses the meaning of the sign."}
    - {"title":"Recognize extrapolation","problem":"A line was fitted to plants aged 1 to 5 weeks. It predicts their height at 30 weeks. Is this use supported?","rule":"Extrapolation predicts beyond the input range used to fit a model.","steps":["Thirty weeks is outside the observed 1-to-5-week range.","Growth may change after five weeks; the observed fit does not test that later behavior."],"answer":"The prediction is extrapolation and needs new evidence.","mistake":"A high correlation inside the data range does not validate distant predictions."}

  stops:
  # --- Stop 25: Describe the Relationship
  #     Concept: scatterplot/correlation; Keystone: keystone regression/sampling bias; Area: Endpoint Adjudication; Learning role: INTRODUCE; Difficulty: L2; Story role: clue.
  #     placement: CHOICE, asked by Eli Navarro beside query-map.
  - group: ENDP
    at: query-map
    title: "Describe the Relationship"
    person: navarro
    concept: 10   # scatterplot/correlation
    reason: "The access audit now needs to assess whether travel distance is associated with follow-up delay."
    scene: "Describe direction, form, strength, and the unusual point without claiming causation."
    motivation: "The scatterplot description establishes the relationship's form and unusual points without converting association into causation."
    format: CHOICE
    question: "Submit one selection from the four distinct choice items below."
    choices:
    - "Strong positive, roughly linear association with one high-leverage point."
    - "Strong negative linear association with no unusual points."
    - "No association because correlation does not prove causation."
    - "A categorical difference that should be shown with a bar chart."
    answer: "Strong positive, roughly linear association with one high-leverage point."
    answerText: "The completed check shows strong positive, roughly linear association with a high-leverage point. Use correlation only for two quantitative variables."
    why: "If delay is associated with distance, complete cases may systematically omit remote patients."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2)
    # correct result: Strong positive, roughly linear association with a high-leverage point. Use correlation only for two quantitative variables.
    # state/output: relationship tag; S2.

  # --- Stop 26: Build and Read the Line
  #     Concept: LSRL; Keystone: keystone regression; Area: Endpoint Adjudication; Learning role: INTRODUCE; Difficulty: L3; Story role: obstacle.
  #     placement: DERIVE, at monitor-desk.
  - group: ENDP
    at: monitor-desk
    title: "Build and Read the Line"
    concept: 30   # LSRL
    reason: "The distance-delay pattern is ready to become a quantitative prediction rule."
    scene: "The scatterplot supports a linear model with r=0.80, x-bar=50 km, sx=20 km, y-bar=6 days, and sy=4 days. Derive slope and intercept, then interpret both values in patient follow-up context."
    motivation: "The fitted slope and intercept determine predicted delay within the observed distance range and expose meaningless extrapolation."
    format: DERIVE
    question: "Submit the least-squares slope and intercept, with units."
    answerText: "The completed check shows each additional kilometer predicts.16 more day of delay. The -2-day intercept at 0 km is not meaningful here; do not extrapolate beyond observed distances."
    why: "A contextual line can direct calls, but its intercept and extrapolated values may lack meaning."
    # wrong-path feedback, one rebuttal per wrong option:
    #   pair: b in day/km, a in days
    # correct result: Each additional kilometer predicts .16 more day of delay. The -2-day intercept at 0 km is not meaningful here; do not extrapolate beyond observed distances.
    # state/output: line drawn; travel unlock.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{"goal":"least-squares slope and intercept","givens":["r=0.80","xbar=50 km","sx=20 km","ybar=6 days","sy=4 days"],"lines":[{"id":"L1","expression":"b=r(sy/sx)=0.8(4/20)=0.16 day/km","license":"state governing relationship"},{"id":"L2","expression":"a=ybar-bxbar=6-0.16(50)=-2 days","license":"substitute displayed values"},{"id":"L3","expression":"yhat=-2+0.16x","license":"simplify with units"}],"keyed_order":["L1","L2","L3"],"decoys":["b=4.0","a=+2"],"correct_result":"b=0.16 day/km, a=-2 days","answerText":"Each added kilometre predicts 0.16 day more delay; the -2-day intercept lies outside a meaningful context."}

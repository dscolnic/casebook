  # --- Stop 26: Build and Read the Line
  #     Concept: LSRL; Keystone: keystone regression; Area: Endpoint Adjudication; Learning role: INTRODUCE; Difficulty: L3; Story role: obstacle.
  #     placement: DERIVE, at monitor-desk.
  - group: ENDP
    at: monitor-desk
    title: "Build and Read the Line"
    concept: "LSRL"
    reason: "Monitors need a prediction rule to prioritize overdue visits."
    scene: "The scatterplot supports a linear model with r=0.80, x-bar=50 km, sx=20 km, y-bar=6 days, and sy=4 days. Derive slope and intercept, then interpret both values in patient follow-up context."
    motivation: "A contextual line can direct calls, but its intercept and extrapolated values may lack meaning."
    format: DERIVE
    question: "b=.8(4/20)=.16 day/km; a=6-.16(50)=-2 days; y-hat=-2+.16x. Licenses slope formula, passes through means, substitute. Submit pair b=.16 day/km, a=-2 days."
    answerText: "The completed check shows each additional kilometer predicts .16 more day of delay. The -2-day intercept at 0 km is not meaningful here; do not extrapolate beyond observed distances."
    why: "A contextual line can direct calls, but its intercept and extrapolated values may lack meaning."
    # wrong-path feedback, one rebuttal per wrong option:
    #   pair: b in day/km, a in days
    # correct result: Each additional kilometer predicts .16 more day of delay. The -2-day intercept at 0 km is not meaningful here; do not extrapolate beyond observed distances.
    # state/output: line drawn; travel unlock.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{"goal":"least-squares slope and intercept","givens":["r=0.80","xbar=50 km","sx=20 km","ybar=6 days","sy=4 days"],"lines":[{"id":"L1","expression":"b=r(sy/sx)=0.8(4/20)=0.16 day/km","license":"state governing relationship"},{"id":"L2","expression":"a=ybar-bxbar=6-0.16(50)=-2 days","license":"substitute displayed values"},{"id":"L3","expression":"yhat=-2+0.16x","license":"simplify with units"}],"keyed_order":["L1","L2","L3"],"decoys":["b=4.0","a=+2"],"correct_result":"b=0.16 day/km, a=-2 days","answerText":"Each added kilometre predicts 0.16 day more delay; the -2-day intercept lies outside a meaningful context."}

  # --- Stop 27: Read the Residual
  #     Concept: residual plots/nonlinearity; Keystone: keystone regression; Area: Endpoint Adjudication; Learning role: PRACTICE; Difficulty: L3; Story role: reveal.
  #     placement: RESIDUAL, at deletion-diagnostic.
  - group: ENDP
    at: deletion-diagnostic
    title: "Read the Residual"
    concept: "residual plots/nonlinearity"
    reason: "A good correlation can still hide a model failure that biases recovered outcomes."
    scene: "With the line established, Data Management reveals residuals by distance band. Compare the candidate residual fields and reject the lowest-RMS fit if it leaves a curved or fan-shaped pattern behind."
    motivation: "Random residual scatter supports linear form; structure means the missingness rule remains incomplete."
    format: RESIDUAL
    question: "fields A random scatter RMS2.1, B U-shape RMS1.8, C fan RMS1.9; correct A despite higher RMS; residual sign labels positive=underprediction, negative=overprediction."
    answerText: "The completed check shows choose A. Residual=y-y-hat; positive means the model underpredicted. Pattern matters more than the smallest RMS."
    why: "Random residual scatter supports linear form; structure means the missingness rule remains incomplete."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Lowest RMS always wins; reject structured error
    # correct result: Choose A. Residual=y-y-hat; positive means the model underpredicted. Pattern matters more than the smallest RMS.
    # state/output: random-field model retained; S4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.

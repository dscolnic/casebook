  # --- Stop 27: Read the Residual
  #     Concept: residual plots/nonlinearity; Keystone: keystone regression; Area: Endpoint Adjudication; Learning role: PRACTICE; Difficulty: L3; Story role: reveal.
  #     placement: RESIDUAL, at deletion-diagnostic.
  - group: ENDP
    at: deletion-diagnostic
    title: "Read the Residual"
    concept: 30   # residual plots/nonlinearity
    reason: "The fitted line needs a residual check before it is used to adjust patient follow-up comparisons."
    scene: "With the line established, Data Management reveals residuals by distance band. Compare their root-mean-square error (RMS) and shapes, rejecting a lower RMS when its curved or fan-shaped pattern shows systematic error."
    motivation: "Residual structure determines whether the distance model systematically misses curvature or changing variability."
    format: RESIDUAL
    question: "Compare three residual fields: A has random scatter and root-mean-square error (RMS) 2.1, B has a U-shape and RMS 1.8, and C has a fan shape and RMS 1.9. Submit the valid model and interpret residual signs."
    answerText: "The completed check shows choose A. Residual=y-y-hat; positive means the model underpredicted. Pattern matters more than the smallest RMS."
    why: "Random residual scatter supports linear form; structure means the missingness rule remains incomplete."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Lowest RMS always wins; reject structured error
    # correct result: Choose A. Residual=y-y-hat; positive means the model underpredicted. Pattern matters more than the smallest RMS.
    # state/output: random-field model retained; S4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   residual: {visible_prompt: "fields A random scatter RMS2.1, B U-shape RMS1.8, C fan RMS1.9; correct A despite higher RMS; residual sign labels positive=underprediction, negative=overprediction.", keyed_result: "Choose A. Residual=y-y-hat; positive means the model underpredicted. Pattern matters more than the smallest RMS.", feedback: "Lowest RMS always wins; reject structured error", answerText: "Use the keyed result and explanation printed below."}
    residual:
      fits:
        - id: patterned_low_error
          label: lower average error but patterned residuals
          rms: 0.18
          structured: true
          residuals:
            - x: 1
              y: -0.12
              value: -0.12
            - x: 2
              y: -0.06
              value: -0.06
            - x: 3
              y: 0
              value: 0
            - x: 4
              y: 0.06
              value: 0.06
            - x: 5
              y: 0.12
              value: 0.12
        - id: unpatterned_generalising
          label: slightly higher error with no directional pattern
          rms: 0.21
          residuals:
            - x: 1
              y: 0.05
              value: 0.05
            - x: 2
              y: -0.04
              value: -0.04
            - x: 3
              y: 0.02
              value: 0.02
            - x: 4
              y: -0.03
              value: -0.03
            - x: 5
              y: 0.01
              value: 0.01
      accept: unpatterned_generalising

  # --- Stop 28: Test the Fast-Site Point
  #     Concept: outlier/leverage/influence and missingness; Keystone: keystone regression/sampling bias; Area: Endpoint Adjudication; Learning role: COMBINE; Difficulty: L4; Story role: decision.
  #     placement: CONTROL, at site-comparison-board.
  - group: ENDP
    at: site-comparison-board
    title: "Test the Fast-Site Point"
    concept: 23   # outlier/leverage/influence and missingness
    reason: "The acceptable residual field leaves one distant fast site needing an influence test."
    scene: "The residual field is acceptable, but the far-right fast-site point may pull the fitted slope. Remove that point while holding all other records fixed, refit, measure slope change, then restore it."
    motivation: "The refitted slope change determines whether a single site materially controls the distance adjustment."
    format: CONTROL
    question: "Choose fast-site point from candidate controls fast-site point, ordinary residual-outlier point, and display scale. Measure slope at 0.16 day/km, change only the fast-site-point control by removing that point while all other records and the fitted method remain fixed, measure the slope after refitting, restore the point and remeasure, then submit both slopes and whether the point is influential."
    # MODEL CONVERSION. The bible's `candidates` are the engine's `variables` and
    # `correct_control` is its `truth`; `fixed` is `held`; `noise_band.value` is
    # `noise`. The one real conversion is `response`: the bible states the two

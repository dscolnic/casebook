    # On arrival at Data Management | sampling-board | automatic
    on: { enter: true, at: DATA }
    world: "Arrival: DATA entry; three identical reports visible; Mara says, ; - After S1-S2: holdout hash prints; waypoint CARRY HOLDOUT HASH TO STAT. - STAT arrival/after S3: shared dependency lines appear; waypoint TAKE INDEPENDENT HASH TO TRIAL MASTER FILE. - ARCHIVE final: four attestations pass; archive becomes READ ONLY / LOCKED; binder 11 and outcome unlock."
    panel: "MISSION 11: PREDICT SAMPLING SPREAD OPEN"
    bubbles:
    - who: voss   # Mara Voss
      say: "Matching is not enough. Show me independence"
  - id: after-stop-41
    # After Stop 41 | holdout-safe | automatic
    on: { after: [1] }
    world: "The predict sampling spread result remains visible while the freeze before revealing fixture lights."
    panel: "STOP 41 RECORDED - STOP 42 OPEN"
    bubbles:
    - who: voss   # Mara Voss
      say: "Use the Stop 41 result to settle freeze before revealing."
  - id: after-stop-42
    # After Stop 42 | extraction-map | automatic
    on: { after: [2] }
    world: "The freeze before revealing result remains visible while the trace the agreement fixture lights."
    panel: "STOP 42 RECORDED - STOP 43 OPEN"
    bubbles:
    - who: voss   # Mara Voss
      say: "Use the Stop 42 result to settle trace the agreement."
  - id: after-stop-43
    # After Stop 43 | archive-seal | automatic
    on: { after: [3] }
    world: "The trace the agreement result remains visible while the make the lock real fixture lights."
    panel: "STOP 43 RECORDED - STOP 44 OPEN"
    bubbles:
    - who: voss   # Mara Voss
      say: "Use the Stop 43 result to settle make the lock real."
  - id: at-mission-end
    # At mission end | sampling-board | automatic
    on: { missionEnd: true }
    world: "The completed decision changes the mission world and locks into the campaign record."
    panel: "MISSION 11 EVIDENCE: RECORDED"
    bubbles:
    - who: voss   # Mara Voss
      say: "The mission decision is recorded. Carry it into the next briefing."

  stops:
  # --- Stop 41: Predict Sampling Spread
  #     Concept: CLT/unbiasedness/SE; Keystone: keystone sampling distributions/normal; Area: Endpoint Adjudication; Learning role: RETRIEVE; Difficulty: L3; Story role: clue.
  #     placement: DERIVE, at sampling-board.
  - group: ENDP
    at: sampling-board
    title: "Predict Sampling Spread"
    concept: "CLT/unbiasedness/SE"
    reason: "Ordinary sample-to-sample change must not be mistaken for a corrupted extraction."
    scene: "The source population has mean 70, SD 12, and each extraction averages n=36 independent records. Derive the sampling distribution of x-bar and explain what increasing n changes in that distribution."
    motivation: "A discrepancy far beyond expected spread points to pipeline error rather than ordinary sampling fluctuation."
    format: DERIVE
    question: "center=70 [unbiased]; SD=12/sqrt36=2 [sampling SD]; CLT approximate Normal [n>=30]. Submit 70 units,2 units."
    answerText: "The completed check shows x-bar is approximately Normal with mean 70 and SD 2. Larger n narrows spread, not center. Use SE when sigma is estimated by s."
    why: "A discrepancy far beyond expected spread points to pipeline error rather than ordinary sampling fluctuation."
    # wrong-path feedback, one rebuttal per wrong option:
    #   center/spread pair in units
    # correct result: x-bar is approximately Normal with mean 70 and SD 2. Larger n narrows spread, not center. Use SE when sigma is estimated by s.
    # state/output: corridor 70 plus/minus spread; S2.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{"goal":"center and spread of xbar","givens":["mu=70","sigma=12","n=36"],"lines":[{"id":"L1","expression":"mean(xbar)=mu=70","license":"state governing relationship"},{"id":"L2","expression":"SD(xbar)=sigma/sqrt(n)=12/6=2","license":"substitute displayed values"},{"id":"L3","expression":"n=36 supports an approximately Normal mean","license":"simplify with units"}],"keyed_order":["L1","L2","L3"],"decoys":["SD=12","mean=72"],"correct_result":"mean 70, SD 2","answerText":"The sampling distribution is centered at 70 with standard deviation 2."}

  # --- Stop 42: Freeze Before Revealing
  #     Concept: model validation; Keystone: keystone sampling distributions; Area: Endpoint Adjudication; Learning role: COMBINE; Difficulty: L4; Story role: reveal.
  #     placement: HOLDOUT, at holdout-safe.
  - group: ENDP
    at: holdout-safe
    title: "Freeze Before Revealing"
    concept: "model validation"
    reason: "The chosen extraction rule must face records it did not use to tune itself."
    scene: "The expected spread is two units, and three candidate cleaning rules fit the development rows. Freeze one rule before the console reveals 20 previously held-out source records and their errors."
    motivation: "A holdout prevents the rule from being rewarded for memorizing the same anomalies it must predict."
    format: HOLDOUT
    question: "Review training errors for rules A, B, and C, then freeze one documented rule before 20 held-out records unlock. Submit the rule with acceptable unseen error."
    answerText: "The completed check shows freeze B before reveal; it stays within expected error on unseen records."
    why: "A holdout prevents the rule from being rewarded for memorizing the same anomalies it must predict."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Tune on holdout; freeze before reveal
    # correct result: Freeze B before reveal; it stays within expected error on unseen records.
    # state/output: independent hash created; travel STAT.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   training fits A1.2,B1.3,C1.4 error; freeze B due documented rule; heldout A4.8,B1.6,C3.9; correct B; settings and revealed data supplied.

  # --- Stop 43: Trace the Agreement
  #     Concept: dependence; Keystone: keystone inference integrity; Area: Monitoring Board Room; Learning role: TRANSFER; Difficulty: L4; Story role: twist.
  #     placement: TRACE, at extraction-map.
  - group: SAFE
    at: extraction-map
    title: "Trace the Agreement"
    concept: "dependence"
    reason: "Three matching reports may share the same wrong upstream table."
    scene: "The held-out rule produced an independent hash, while efficacy, safety, and registry reports agree digit for digit. Open all their dependencies and identify which report channels share the same nightly extraction."
    motivation: "Shared inputs make agreement redundant; only the source rerun can validate the final table."
    format: TRACE
    question: "Open all four extraction channels and trace each to its upstream source. Submit the three dependent reports and the genuinely independent rerun."
    answerText: "The completed check shows the three matching reports are not independent confirmations; use the source rerun and held-out hash."
    why: "Shared inputs make agreement redundant; only the source rerun can validate the final table."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Exact agreement proves confirmation
    # correct result: The three matching reports are not independent confirmations; use the source rerun and held-out hash.
    # state/output: shared lines turn amber with text; travel ARCHIVE.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   trace:{channels:[{id:"efficacy",label:"efficacy report",dependency:"nightly_v7 extraction",target_dependent:true},{id:"safety",label:"safety report",dependency:"nightly_v7 extraction",target_dependent:true},{id:"registry",label:"registry report",dependency:"nightly_v7 extraction",target_dependent:true},{id:"source_rerun",label:"independent source rerun",dependency:"raw source tables",independent:true}],shared_upstream:"nightly_v7 extraction",correct_conclusion:"only the source rerun is independent",answerText:"Digit-for-digit agreement among three reports is redundant because all use nightly_v7; the source rerun is independent."}

  # --- Stop 44: Make the Lock Real
  #     Concept: file integrity; Keystone: keystone study design/reporting; Area: Monitoring Board Room; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: ATTEST, asked by Mara Voss beside archive-seal.
  - group: SAFE
    at: archive-seal
    title: "Make the Lock Real"
    person: voss
    concept: "file integrity"
    reason: "Mara must verify identity, time, and physical condition before sealing the file."
    scene: "The independent extraction survives its holdout and dependency audit. Verify the source hash, signed timestamp, frozen analysis plan, and read-only archive while rejecting the copied report as genuinely independent support."
    motivation: "A lock preserves the analysis boundary only if its evidence and permissions are independently backed."
    format: ATTEST
    question: "Select exactly four backed controls: source hash, signed timestamp, frozen plan, and read-only permission. Submit the attestation while rejecting copied-report agreement as independent evidence."
    # MODEL CONVERSION, the same one as M1 S4. `verification_limit` is the engine's
    # `checks`; the bible's `backed` and `critical` flags carry over unchanged, and
    # `correct_verified` plus `critical_unbacked` are what those flags already encode.
    # `evidence` is DERIVED, not the bible's: the engine prints one line per claim
    # saying what a check turns up, and each line here reports only that record's
    # own state as the bible's `backed` flag gives it. The copied-report line is
    # the M11 S3 finding — all three reports run off the same nightly extraction.
    # `signedBy` is DERIVED too: the bible marks every claim `signed:true` without
    # naming a signer, and this stop is asked by Mara Voss at the archive seal.
    attest:
      checks: 4
      claims:
      - { id: source_hash, label: "source hash", critical: true, backed: true,
          signedBy: "Mara Voss", evidence: "Hash recomputed from the archive and matched." }
      - { id: timestamp, label: "signed timestamp", critical: true, backed: true,
          signedBy: "Mara Voss", evidence: "Signed timestamp present on the lock record." }
      - { id: analysis_plan, label: "frozen analysis plan", critical: true, backed: true,
          signedBy: "Mara Voss", evidence: "Analysis plan frozen, with the freeze recorded." }
      - { id: readonly, label: "read-only archive permission", critical: true, backed: true,
          signedBy: "Mara Voss", evidence: "Archive permission confirmed read-only." }
      - { id: copied_reports, label: "three copied reports are independent", critical: true,
          signedBy: "Mara Voss", evidence: "Not backed: all three reports run off the same nightly extraction, so their agreement is not independent support." }
      commit: "Seal the file"
    answerText: "The completed check shows lock the independently rerun table with four backed controls; matching dependent reports add no independent evidence."
    why: "A lock preserves the analysis boundary only if its evidence and permissions are independently backed."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Copied reports provide three proofs
    # correct result: Lock the independently rerun table with four backed controls; matching dependent reports add no independent evidence.
    # state/output: binder 11; Integrity lock; M12.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   attest:{verification_limit:4,claims:[{id:"source_hash",label:"source hash",signed:true,backed:true,critical:true},{id:"timestamp",label:"signed timestamp",signed:true,backed:true,critical:true},{id:"analysis_plan",label:"frozen analysis plan",signed:true,backed:true,critical:true},{id:"readonly",label:"read-only archive permission",signed:true,backed:true,critical:true},{id:"copied_reports",label:"three copied reports are independent",signed:true,backed:false,critical:true}],correct_verified:["source_hash","timestamp","analysis_plan","readonly"],critical_unbacked:"copied_reports",answerText:"Verify the four independent lock records and reject copied-report agreement as independent support."}


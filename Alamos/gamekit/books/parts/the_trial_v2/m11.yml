  # --- Stop 44: Make the Lock Real
  #     Concept: file integrity; Keystone: keystone study design/reporting; Area: Monitoring Board Room; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: ATTEST, asked by Mara Voss beside archive-seal.
  - group: SAFE
    at: archive-seal
    title: "Make the Lock Real"
    person: voss
    concept: 30   # file integrity
    reason: "The independent rerun passes, but the final data lock still needs enforceable controls."
    scene: "The independent extraction survives its holdout and dependency audit. Verify the source hash, signed timestamp, frozen analysis plan, and read-only archive while rejecting the copied report as genuinely independent support."
    motivation: "Verified hashes, timestamps, analysis plans, and archive permissions determine whether the locked table is genuinely reproducible and protected."
    format: ATTEST
    question: "Select exactly four backed controls: source hash, signed timestamp, frozen plan, and read-only permission. Submit the attestation while rejecting copied-report agreement as independent evidence."
    # MODEL CONVERSION, the same one as M1 S4. `verification_limit` is the engine's
    # `checks`; the bible's `backed` and `critical` flags carry over unchanged, and
    # `correct_verified` plus `critical_unbacked` are what those flags already encode.
    # `evidence` is DERIVED, not the bible's: the engine prints one line per claim
    # saying what a check turns up, and each line here reports only that record's
    # own state as the bible's `backed` flag gives it. The copied-report line is
    # the M11 S3 finding — all three reports run off the same nightly extraction.
    # `signedBy` is DERIVED too: the bible marks every claim `signed:true` without
    # naming a signer, and this stop is asked by Mara Voss at the archive seal.
    attest:
      checks: 4
      claims:
      - { id: source_hash, label: "source hash", critical: true, backed: true,
          signedBy: "Mara Voss", evidence: "Hash recomputed from the archive and matched." }
      - { id: timestamp, label: "signed timestamp", critical: true, backed: true,
          signedBy: "Mara Voss", evidence: "Signed timestamp present on the lock record." }
      - { id: analysis_plan, label: "frozen analysis plan", critical: true, backed: true,
          signedBy: "Mara Voss", evidence: "Analysis plan frozen, with the freeze recorded." }
      - { id: readonly, label: "read-only archive permission", critical: true, backed: true,
          signedBy: "Mara Voss", evidence: "Archive permission confirmed read-only." }
      - { id: copied_reports, label: "three copied reports are independent", critical: true,
          signedBy: "Mara Voss", evidence: "Not backed: all three reports run off the same nightly extraction, so their agreement is not independent support." }
      commit: "Seal the file"
    answerText: "The completed check shows lock the independently rerun table with four backed controls; matching dependent reports add no independent evidence."
    why: "A lock preserves the analysis boundary only if its evidence and permissions are independently backed."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Copied reports provide three proofs

- title: "Lock the File"
  card:
    header: "MISSION 11 - 5 DAYS UNTIL THE BOARD MEETS."
    title: "Lock the File"
    goNow: "Go to Data Management and meet Mara Voss, trial director, at the extraction console."
    body: "5 days until the board meets. Three matching reports sit outside a cabinet beside an independent file hash. Today you decide which data run is safe to lock."
    objective: "Validate and lock one analysis file."
  objective: "Validate and lock one analysis file."
  stake: "5 days until the board meets. Three matching reports sit outside a cabinet beside an independent file hash. Today you decide which data run is safe to lock."
  takeaway: "Validate on held-out data."
  segue: "But Amina's last tables ask three different questions; one test will not answer them all."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Central Limit Theorem", def: "for large n, the sampling distribution of a sample mean is approximately Normal."}
  - {name: "Standard error", def: "an estimate of a statistic's sampling spread."}
  - {name: "Unbiased estimator", def: "an estimator whose sampling-distribution mean equals the parameter."}
  equations:
  - {"e":"mean(x-bar)=mu; standard deviation (SD) of x-bar = sigma/sqrt(n)","c":"Describing sample-mean behavior.","v":[["mu and sigma","population mean and SD"],["n","sample size"]],"s":"The lock check must separate expected sampling variation from copied extraction errors."}
  primer:
  - "Statistics vary; parameters are fixed."
  - "Larger n narrows sampling spread without changing its center."
  - "Exact agreement can signal a shared dependency rather than confirmation."

  # The bible's beat script. `world` is its World state line, `panel` its

- title: "Lock the File"
  card:
    header: "DAY 11 - BOARD IN 5 DAYS"
    title: "Lock the File"
    goNow: "Go to Data Management and meet Mara Voss, trial director, at the extraction console."
    body: "The adjusted estimate is ready, but three reports point to different final tables. Sampling distributions explain ordinary variation; shared extraction paths explain identical errors. Validate the table at Data Management, trace dependencies in Statistics, then lock the master file upstairs. By the end of the mission, decide which extraction is independent enough to become final."
    objective: "Validate and lock one analysis file."
  objective: "Validate and lock one analysis file."
  stake: "The adjusted estimate is ready, but three reports point to different final tables. Sampling distributions explain ordinary variation; shared extraction paths explain identical errors. Validate the table at Data Management, trace dependencies in Statistics, then lock the master file upstairs. By the end of the mission, decide which extraction is independent enough to become final."
  takeaway: "Validate on held-out data."
  segue: "Mission decision: Lock the fresh data run, not the three copied reports. Its tests, holdout, file mark, and access log all pass. Trial data are now secure. The last table holds three different problems."
  # The mission card's own "Primer concepts", printed on the plan card.
  primer:
  - "Statistics vary; parameters are fixed."
  - "Larger n narrows sampling spread without changing its center."
  - "Exact agreement can signal a shared dependency rather than confirmation."

  # The bible's beat script. `world` is its World state line, `panel` its

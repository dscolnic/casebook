  # --- Stop 42: Freeze Before Revealing
  #     Concept: model validation; Keystone: keystone sampling distributions; Area: Endpoint Adjudication; Learning role: COMBINE; Difficulty: L4; Story role: reveal.
  #     placement: HOLDOUT, at holdout-safe.
  - group: ENDP
    at: holdout-safe
    title: "Freeze Before Revealing"
    concept: 30   # model validation
    reason: "The expected extraction spread allows a fair test of cleaning rules on untouched records."
    scene: "The expected spread is two units, and three candidate cleaning rules fit the development rows. Freeze one rule before the console reveals 20 previously held-out source records and their errors."
    motivation: "Held-out errors determine whether the frozen cleaning rule generalizes beyond the development rows."
    format: HOLDOUT
    question: "Review training errors for rules A, B, and C, then freeze one documented rule before 20 held-out records unlock. Submit the rule with acceptable unseen error."
    answerText: "The completed check shows freeze B before reveal; it stays within expected error on unseen records."
    why: "A holdout prevents the rule from being rewarded for memorizing the same anomalies it must predict."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Tune on holdout; freeze before reveal
    # correct result: Freeze B before reveal; it stays within expected error on unseen records.
    # state/output: independent hash created; travel STAT.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   training fits A1.2,B1.3,C1.4 error; freeze B due documented rule; heldout A4.8,B1.6,C3.9; correct B; settings and revealed data supplied.
    holdout:
      axis:
        label: allowed prediction error
        min: 0
        max: 5
        step: 0.5
        unit: "%"
      fit:
        - at: 0.5
          value: 0.62
        - at: 1
          value: 0.78
        - at: 1.5
          value: 0.88
        - at: 2
          value: 0.98
        - at: 2.5
          value: 0.86
      test:
        - at: 0.5
          value: 0.4
        - at: 1
          value: 0.66
        - at: 1.5
          value: 0.85
        - at: 2
          value: 0.55
        - at: 2.5
          value: 0.82
      overfitAt: 2
      correctAt: 1.5
      frozenRule: B
      ruleErrors:
        - id: A
          training: 1.2
          heldout: 4.8
          unit: "%"
        - id: B
          training: 1.3
          heldout: 1.6
          unit: "%"
        - id: C
          training: 1.4
          heldout: 3.9
          unit: "%"
      correctChoice: B
      pass: 0.8


  worked:
    label: "Worked examples"
    title: "Mission 13: worked examples"
    examples:
    - {"title":"Test a regression slope","problem":"A fitted slope is b=0.6 with SE(b)=0.2 from n=12 independent observations. Find t for a zero population slope.","rule":"t=(b-β0)/SE(b); regression df=n-2.","steps":["Set up the relationship: t=(b-β0)/SE(b); regression df=n-2.","t=(0.6-0)/0.2=3; df=12-2=10."],"answer":"The slope statistic is t=3 with 10 degrees of freedom.","mistake":"Regression uses n-2, not n-1, for this test."}
    - {"title":"Adjust for multiple tests","problem":"Five claims are tested with a desired family error bound of 0.05. Find the Bonferroni per-test level.","rule":"Per-test level = family level / number of tests.","steps":["Set up the relationship: Per-test level = family level / number of tests.","α_each=0.05/5=0.01."],"answer":"Use 0.01 per test to bound the family false-positive probability by 0.05.","mistake":"This bound does not require independent tests."}
    - {"title":"Repeated testing","problem":"Five independent tests each have false-positive probability 0.10 under their true nulls. Find the chance of at least one false positive.","rule":"P(at least one)=1-P(none), using independence for the product.","steps":["Set up the relationship: P(at least one)=1-P(none), using independence for the product.","P(at least one)=1-(0.9)^5=1-0.59049=0.40951."],"answer":"The chance is about 41%, not 10%.","mistake":"The independence assumption is needed for this exact product calculation."}
    - {"title":"Recognize extrapolation","problem":"A line was fitted to plants aged 1 to 5 weeks. It predicts their height at 30 weeks. Is this use supported?","rule":"Extrapolation predicts beyond the input range used to fit a model.","steps":["Thirty weeks is outside the observed 1-to-5-week range.","Growth may change after five weeks; the observed fit does not test that later behavior."],"answer":"The prediction is extrapolation and needs new evidence.","mistake":"A high correlation inside the data range does not validate distant predictions."}
    - {"title":"Recognize a systematic miss","problem":"A model has residuals +2,+2,+2,+2 units at four inputs. Another has -1,+1,-1,+1. What does the first pattern suggest?","rule":"Residuals are observations minus predictions; a repeated offset can indicate bias.","steps":["first mean residual = (2+2+2+2)/4 = +2 units. Every prediction is low.","second mean residual = (-1+1-1+1)/4 = 0 units. Its signed errors cancel, though errors remain."],"answer":"The first model shows a consistent underprediction that should be investigated.","mistake":"A zero mean residual does not by itself prove a model is accurate or free of pattern."}


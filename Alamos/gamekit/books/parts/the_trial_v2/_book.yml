# The Trial — CLARION-3, and the 3 weeks before the second interim.
#
# Written to gamekit/tools/BOOK_TEMPLATE.md. The place is themes/the_trial/plan.js;
# the arc it follows is in ../GAME_IDEAS.md under "The Trial".
#
# The argument: Balogun holds that delay has a human cost if one arm is truly worse.
# Feldman holds that the boundary exists so the room cannot mistake a promising
# fluctuation for knowledge. The game lets each position become the right caution
# on a different day, based only on what could actually be known at that point.

theme:
  id: the_trial
  title: The Trial
  subtitle: Methodology & Operations Lead · CLARION-3

groups:
  - id: RAND
    code: RAND
    name: Randomisation & Blinding
    color: '#3f6f8f'
    desc: How an arm is assigned, and what has to be true for nobody to know which.
    defaultLeader: diouf
    milestones: [Read the allocation, Hold the blind, Account for the kit, Ready to hand over]
  - id: ENDP
    code: ENDP
    name: Endpoints & Measurement
    color: '#7a4fa3'
    desc: What is being counted, who counts it, and how the counting can go wrong.
    defaultLeader: ansah
    milestones: [Define the event, Adjudicate the file, Check the measurement, Ready to hand over]
  - id: SAFE
    code: SAFE
    name: Safety Monitoring
    color: '#b3462f'
    desc: What harm looks like early, and who is allowed to see it.
    defaultLeader: vogt
    milestones: [Read the report, Rate the event, Brief the board, Ready to hand over]
  - id: STAT
    code: STAT
    name: Statistical Analysis
    color: '#1f7a6b'
    desc: Power, boundaries, intervals, and what a number is entitled to claim.
    defaultLeader: feldman
    milestones: [State the question, Fix the rule, Estimate the effect, Ready to hand over]
  - id: SITE
    code: SITE
    name: Site Operations
    color: '#b0762a'
    desc: 31 hospitals, and the distance between a chart and a database.
    defaultLeader: marchetti
    milestones: [Visit the site, Verify the source, Close the query, Ready to hand over]
  - id: REG
    code: REG
    name: Regulatory & Reporting
    color: '#5b6a72'
    desc: What was promised in advance, and what has to be said out loud afterwards.
    defaultLeader: umeh
    milestones: [Find the commitment, Record the change, State the result, Ready to hand over]


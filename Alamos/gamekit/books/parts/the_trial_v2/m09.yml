  # --- Stop 36: Say What It Means
  #     Concept: practical scope and blinding; Keystone: keystone design/inference; Area: Randomisation & Blinding; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: STRESS, asked by Priya Shah beside blind-audit-table.
  - group: RAND
    at: blind-audit-table
    title: "Say What It Means"
    person: shah
    concept: 31   # practical scope and blinding
    reason: "The detectable guessing gap must be reconciled with intact concealment and uncertain survey response."
    scene: "The arm difference is statistically detectable, but the sealed-box audit remained intact and both correct-guess rates are low. Stress the conclusion across survey nonresponse from zero to five percentage points and choose the supported claim."
    motivation: "The sensitivity analysis determines how strongly the board can interpret unequal guessing without declaring the blind broken."
    format: STRESS
    question: "Move nonresponse from 0 to 5 percentage points in 1-point steps while holding the sealed-box audit fixed. Submit the conclusion surviving the full range."
    answerText: "The completed check shows report unequal guessing proportions, not a proven allocation breach. Design, audit, and survey limitations constrain scope."
    why: "The board must separate evidence of unequal guessing from proof that allocation was exposed."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Difference proves broken concealment
    # correct result: Report unequal guessing proportions, not a proven allocation breach. Design, audit, and survey limitations constrain scope.
    # state/output: binder 9; M10.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   assumption range nonresponse shift 0-.05 step .01; candidates concealment failed, guessing differed, randomisation caused guesses, no evidence; correct guessing differed survives, concealment failed darkens above .01.
    stress:
      candidates:
        - id: nominal_only
          label: Use only the nominal reading
        - id: common_extreme_mistake
          label: Use the favorable extreme as if it were guaranteed
        - id: robust_plan
          label: Report unequal guessing proportions, not a proven allocation breach. Design, audit, and survey limitations constrain scope.
      criteria:
        - key: evidence_fit
          label: fit to the stop evidence
        - key: safety_margin
          label: margin at the adverse end
      scores:
        nominal_only:
          evidence_fit: 95
          safety_margin: 20
        common_extreme_mistake:
          evidence_fit: 88
          safety_margin: 5
        robust_plan:
          evidence_fit: 82
          safety_margin: 92
      feasible:
        nominal_only: 0
        common_extreme_mistake: 0
        robust_plan: -5
      assumption:
        label: unmeasured outcome shift
        unit: percentage points
        min: -5
        max: 5
        nominal: 0
        step: 1
      robust: robust_plan
      optimiseOn: evidence_fit

  stops:
  # --- Stop 33: Rebuild the Blind
  #     Concept: blinding versus randomisation records; Keystone: keystone design; Area: Monitoring Board Room; Learning role: RETRIEVE; Difficulty: L3; Story role: character.
  #     placement: TRACE, at kit-sequence-rack.
  - group: SAFE
    at: kit-sequence-rack
    title: "Rebuild the Blind"
    concept: "blinding versus randomisation records"
    reason: "The survey means little unless the physical assignment path is independently checked."
    scene: "The cold-room failure made Priya's records look suspicious, but assignment concealment uses a different path. Open each channel and identify which displays depend on the master randomisation file and which remain independent."
    motivation: "Agreement among shared displays cannot count as independent proof that nobody could predict the next kit."
    format: TRACE
    question: "Open every dependency, identify channels sharing the master allocation file, and submit the channel that independently verifies the physical blind."
    answerText: "The completed check shows three displays share the master file; only the sealed-box audit independently confirms concealment."
    why: "Agreement among shared displays cannot count as independent proof that nobody could predict the next kit."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Matching displays are independent checks
    # correct result: Three displays share the master file; only the sealed-box audit independently confirms concealment.
    # state/output: BLIND PATH INTACT; survey travels.

  objective: "Test the blinding survey by treatment arm."
  stake: "7 days until the board meets. An intact kit sequence lies beside two unequal survey columns. Today you decide what the guess survey proves about the hidden draw."
  takeaway: "Random assignment and sampling control scope."
  segue: "But Amina's verified outcomes shrink the benefit; an intact draw cannot save an inflated effect."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Single blind", def: "either subjects or researchers do not know assignments."}
  - {name: "Double blind", def: "neither subjects nor researchers know assignments."}
  - {name: "Pooled proportion", def: "combined success proportion used in a two-proportion null test."}
  - {name: "Homogeneity", def: "equal distribution of one categorical variable across populations or treatments."}
  equations:
  - {"e":"(p1-hat-p2-hat) plus or minus z-star sqrt[p1-hat q1-hat/n1 + p2-hat q2-hat/n2]","c":"Estimating a difference in proportions.","v":[["p1-hat","treatment sample success proportion"],["p2-hat","placebo sample success proportion"],["q1-hat","treatment sample failure proportion"],["q2-hat","placebo sample failure proportion"],["n1","treatment sample size"],["n2","placebo sample size"],["z-star","confidence critical value"]],"s":"The survey must estimate the treatment-minus-placebo guessing difference."}
  primer:
  - "Two-proportion intervals use separate sample proportions."
  - "Two-proportion null tests pool because H0 says proportions are equal."
  - "A random sample plus random assignment supports cause and generalization."


- title: "Could Anyone Tell"
  card:
    header: "DAY 9 - BOARD IN 7 DAYS"
    title: "Could Anyone Tell"
    goNow: "Go to the Kit Warehouse and meet Priya Shah, randomisation and blinding lead, at the blind-check kiosk."
    body: "Cold-room handling explains failed kits, but it does not show whether staff could identify treatment arms. Blinding reduces behavior and measurement changes caused by knowing assignment. Audit the kit sequence, then compare correct-guess proportions at Statistics. By the end of the mission, decide whether treatment concealment failed differently across arms."
    objective: "Test the blinding survey by treatment arm."
  objective: "Test the blinding survey by treatment arm."
  stake: "Cold-room handling explains failed kits, but it does not show whether staff could identify treatment arms. Blinding reduces behavior and measurement changes caused by knowing assignment. Audit the kit sequence, then compare correct-guess proportions at Statistics. By the end of the mission, decide whether treatment concealment failed differently across arms."
  takeaway: "Random assignment and sampling control scope."
  segue: "Mission decision: Report an arm difference in correct guesses. But do not declare that concealment failed. The interval is about 0.8 to 13.2 points. And the pooled test gives p=.028. The independent box audit stayed intact."
  # The mission card's own "Primer concepts", printed on the plan card.
  primer:
  - "Two-proportion intervals use separate sample proportions."
  - "Two-proportion null tests pool because H0 says proportions are equal."
  - "A random sample plus random assignment supports cause and generalization."


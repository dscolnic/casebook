  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 9: worked examples"
    examples:
    - {"title":"Pool only for an equal-proportion test","problem":"Group 1 has 30 successes out of 50; group 2 has 20 out of 50. Find the pooled proportion for an equality test.","rule":"Under the equal-proportion null, pooled p-hat = total successes / total observations.","steps":["Set up the relationship: Under the equal-proportion null, pooled p-hat = total successes / total observations.","pooled p-hat=(30+20)/(50+50)=50/100=0.5."],"answer":"The pooled estimate is 0.5 for the null-test standard error.","mistake":"A two-proportion confidence interval normally uses separate group estimates instead."}
    - {"title":"An interval for a difference","problem":"Two independent sample proportions are 0.60 and 0.40. The supplied standard error of their difference is 0.10 and the critical value is 2.","rule":"Difference interval = (p1-hat-p2-hat) ± critical value × SE.","steps":["Set up the relationship: Difference interval = (p1-hat-p2-hat) ± critical value × SE.","difference=0.60-0.40=0.20; margin=2(0.10)=0.20; interval=[0,0.40]."],"answer":"The interval includes zero, so it does not exclude equal population proportions.","mistake":"An interval touching zero includes the no-difference value."}
    - {"title":"Prevent knowledge of treatment","problem":"Participants and outcome graders receive coded packets and cannot identify the assigned method. What does this protect?","rule":"Blinding limits changes in behavior or measurement caused by knowing treatment assignment.","steps":["Participants cannot intentionally respond according to a known assignment.","Graders cannot knowingly score one treatment more favorably."],"answer":"This design blinds both participants and graders.","mistake":"Blinding does not replace random assignment."}
    - {"title":"Random assignment versus sampling","problem":"A volunteer group is randomly assigned to two teaching methods. What kind of conclusion does this strengthen?","rule":"Random assignment supports a causal comparison; random population sampling supports generalization.","steps":["Assignment helps balance other characteristics between the two methods.","The volunteers may still differ from all students, limiting broad generalization."],"answer":"A causal comparison within the study is strengthened, subject to proper execution.","mistake":"Random assignment does not make volunteers a random population sample."}
    - {"title":"Make a test decision","problem":"A properly conducted test reports P=0.03. The preselected significance level is α=0.05. What decision follows?","rule":"Reject the null when the P-value is at or below the preselected significance level.","steps":["comparison=0.03<0.05, so the result crosses the threshold.","Reject the null in favor of the stated alternative, subject to the study assumptions."],"answer":"The evidence is statistically significant at the 5% level.","mistake":"P=0.03 is not a 3% probability that the null is true."}


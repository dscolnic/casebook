  worked:
    label: "Worked examples"
    title: "Mission 1: worked examples"
    examples:
    - {"title":"Classify two variables","problem":"A survey records shirt color and height in centimetres. Classify each variable.","rule":"A categorical variable names a group; a quantitative variable records a meaningful numerical amount.","steps":["Shirt color places a person in a category. Numeric color codes would still be labels.","Height measures an amount; differences such as 5 cm have meaning."],"answer":"Color is categorical; height is quantitative.","mistake":"Numbers used as labels do not make a variable quantitative."}
    - {"title":"Distinguish parameter from statistic","problem":"A school has 800 students. A random sample of 40 has mean height 160 cm. Is 160 a parameter or a statistic?","rule":"A parameter describes the population; a statistic is calculated from a sample.","steps":["The population is all 800 students; only 40 heights were used.","The value 160 cm is a sample mean, so it estimates the unknown population mean."],"answer":"It is a statistic.","mistake":"Random sampling does not turn a statistic into a population parameter."}
    - {"title":"Calculate a sample proportion","problem":"In a sample of 20 students, 12 cycle to school. Find the sample proportion.","rule":"p-hat = number with the characteristic / sample size.","steps":["Set up the relationship: p-hat = number with the characteristic / sample size.","p-hat=12/20=0.60=60%."],"answer":"Sixty percent of this sample cycle to school.","mistake":"The sample result is not automatically the exact population proportion."}
    - {"title":"Compare center with an extreme value","problem":"For values 1,2,3,4,20, find mean and median.","rule":"Mean = sum/count; median = middle ordered value.","steps":["Set up the relationship: Mean = sum/count; median = middle ordered value.","mean=(1+2+3+4+20)/5=6; median=3."],"answer":"The mean is 6 and median 3; the high value pulls the mean upward.","mistake":"The midpoint of the smallest and largest values is not the median."}
    - {"title":"Apply the outlier fence","problem":"A dataset has first quartile Q1=4 and third quartile Q3=8. Is 15 an upper outlier under the 1.5-IQR rule?","rule":"IQR=Q3-Q1; upper fence=Q3+1.5IQR. The fence is an outlier-screening boundary.","steps":["Set up the relationship: IQR=Q3-Q1; upper fence=Q3+1.5IQR. The fence is an outlier-screening boundary.","IQR=8-4=4; upper fence=8+1.5(4)=14. Since 15>14, the value is flagged."],"answer":"15 is flagged for investigation, not automatically deleted.","mistake":"An outlier flag does not prove a recording error."}

  stops:
  # --- Stop 1: Name the Data
  #     Concept: variable type and graph choice; Keystone: keystone distribution description; Area: Endpoint Adjudication; Learning role: INTRODUCE; Difficulty: L1; Story role: clue.
  #     placement: CHOICE, asked by Lena Wu beside commitment-terminal.
  - group: ENDP
    at: commitment-terminal
    title: "Name the Data"
    person: wu
    concept: 10   # variable type and graph choice
    reason: "The registry must be turned into displays before the board can inspect treatment outcomes."
    scene: "The registry lists treatment arm, serious-event grade, recovery days, and whether each patient improved. Classifying the primary outcome first determines which display can reveal its pattern without turning category codes into fake measurements."
    motivation: "The outcome's variable type determines whether counts and proportions, rather than numerical averages of category codes, belong in the display."
    format: CHOICE
    question: "Primary outcome: improved by day 30, yes or no. Submit one selection: categorical with bar chart; categorical with histogram; quantitative with bar chart; quantitative with boxplot."
    figure: {"kind":"bars","xLabel":"Day-30 outcome","yLabel":"Patients","caption":"Counts of improved and not-improved patients.","bars":[{"name":"Improved","value":68},{"name":"Not improved","value":32}]}
    choices: []
    answer: "Categorical variable with a bar chart."
    answerText: "The completed check shows improved/not improved is categorical, so compare counts or proportions with a bar chart."
    why: "Treating category labels as quantities could create a meaningless average and mislead the board."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2)
    # correct result: Improved/not improved is categorical, so compare counts or proportions with a bar chart.
    # state/output: Primary outcome gains a text CATEGORICAL label; unlock S2; sets up M9 and M12.

  # --- Stop 2: Describe Before Judging
  #     Concept: SOCS and graph uses; Keystone: keystone distribution description; Area: Endpoint Adjudication; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: SEQUENCE, at records-wall.
  - group: ENDP
    at: records-wall
    title: "Describe Before Judging"
    concept: 31   # SOCS and graph uses
    reason: "The first recovery-time display needs an honest description before the team selects a summary statistic."
    scene: "The recovery-days histogram is the team's first quantitative evidence and is unimodal, right-skewed, with two unusually long recoveries. Use SOCS, meaning shape, outliers, center, and spread, to describe the full distribution before choosing summaries."
    motivation: "The distribution's shape and unusual values determine which center and spread can represent recovery without hiding long cases."
    format: SEQUENCE
    question: "The recovery-days histogram is unimodal and right-skewed, with two unusually long recoveries. Put the four description cards in the order that keeps the summary honest."
    # The four cards and their order are the prompt's own list, kept word for word.
    cards:
      - Describe the distribution's shape in the patient context.
      - Identify unusual recovery times and keep them pending source review.
      - Report a resistant center in recovery days.
      - Report a resistant spread in recovery days.
    order:
      - 0
      - 1
      - 2
      - 3
    answerText: "The completed check shows describe shape, outliers, center, and spread, using recovery days and treatment arms in every statement."
    why: "Shape determines whether mean and standard deviation or median and IQR best summarize what patients experienced."
    # wrong-path feedback, one rebuttal per wrong option:
    #   List values without comparisons; require SOCS in patient context
    # correct result: Describe shape, outliers, center, and spread, using recovery days and treatment arms in every statement.
    # state/output: SOCS CHECK appears; unlock S3; sets up M2.

  # --- Stop 3: Mark the Extreme
  #     Concept: IQR outlier rule; Keystone: keystone distribution description; Area: Endpoint Adjudication; Learning role: PRACTICE; Difficulty: L2; Story role: clue.
  #     placement: BALLPARK, at evidence-desk.
  - group: ENDP
    at: evidence-desk
    title: "Mark the Extreme"
    concept: 30   # IQR outlier rule
    reason: "The two long recoveries need an objective flag before anyone removes or dismisses them."
    scene: "One patient's recorded recovery time is 34 days, much longer than most recoveries in the trial. Calculate the upper fence, the cutoff above which a value is flagged as a possible outlier, to decide whether this record needs review."
    motivation: "The upper fence determines whether the recorded recovery warrants source review, not whether it should automatically be deleted."
    format: BALLPARK
    question: "The recovery times have Q1=10 days and Q3=18 days. Using IQR=Q3-Q1 and upper fence=Q3+1.5(IQR), calculate the upper fence and decide whether the patient's 34-day recovery time should be flagged."
    # Every tile and the target are the prompt's own numbers: Q1 10, Q3 18, IQR 8,
    # 1.5 x IQR 12, the 34-day record, and the fence 18 + 12 = 30.
    estimate:
      prompt: "Q1 is 10 days and Q3 is 18 days. The upper fence is Q3 + 1.5(IQR)."
      question: "Build the upper fence in days."
      relationship: "upper fence = Q3 + 1.5 x IQR, so 18 days + 1.5 x 8 days"
      labels:
      - "18 days  (Q3)"
      - "12 days  (1.5 x IQR)"
      - "10 days  (Q1)"
      - "8 days  (IQR)"
      - "34 days  (the long recovery record)"
      values: [18, 12, 10, 8, 34]
      slots: 2
      template: '{0} + {1}'
      formula: a+b
      correct: [0, 1]
      target: 30
      tolerance: 0
      units: days
      solution: "IQR = 18 - 10 = 8 days, so 1.5(IQR) = 12 days and the upper fence is 18 + 12 = 30 days."
      explanation: "Since 34 days is above the 30-day fence, the record is flagged and kept pending review."
    answerText: "The completed check shows IQR = 8 days; upper fence = 18 + 1.5(8) = 30 days. Since 34 > 30, flag it and keep it pending review."
    why: "An outlier flag triggers source review; it does not grant permission to delete a patient."
    # wrong-path feedback, one rebuttal per wrong option:
    #   number in days, then flag selection
    # correct result: IQR = 8 days; upper fence = 18 + 1.5(8) = 30 days. Since 34 > 30, flag it and keep it pending review.
    # state/output: The 34-day record gains amber REVIEW, DO NOT DELETE; unlock S4; pays off M2/M7.

  # --- Stop 4: Seal the Claims
  #     Concept: pre-specification and scope; Keystone: keystone study design; Area: Randomisation & Blinding; Learning role: COMBINE; Difficulty: L4; Story role: decision.
  #     placement: ATTEST, asked by Lena Wu beside claim-ledger.
  - group: RAND
    at: claim-ledger
    title: "Seal the Claims"
    person: wu
    concept: 13   # pre-specification and scope
    reason: "The descriptive review is ready, but the board must separate registered claims from later discoveries."
    scene: "Lena opens the registry that was locked before the first patient enrolled and places it beside the later analysis notes. Decide which conclusions were planned in advance and which appeared only after the team saw the data."
    motivation: "The dated registry evidence determines which conclusions were planned before results and which require an exploratory label."
    format: ATTEST
    question: "The locked registry lists 30-day improvement, serious-event rate, and mean recovery time. The two-site treatment interaction and lab marker first appear in notes written after data review. Spend three checks on the pre-specified claims, then classify the interaction."
    # MODEL CONVERSION. `verification_limit` is the engine's `checks`; the bible's
    # `backed` and `critical` flags carry over unchanged, and `required_checks`
    # plus `critical_unbacked` are what the flags already encode.
    # `evidence` is DERIVED, not the bible's: the engine prints one line per claim
    # saying what a check turns up, and the bible's own test for this board is the
    # registry timestamp (the terminal reads REGISTRATION LOCK: 14 MONTHS BEFORE
    # FIRST PATIENT), so each line reports that claim's timestamp and nothing else.
    attest:
      verification_limit: 3
      claims:
        - id: primary_30d
          label: primary 30-day improvement
          backed: true
          critical: true
        - id: serious_event
          label: serious-event rate
          backed: true
          critical: true
        - id: recovery_mean
          label: recovery-time mean
          backed: true
          critical: false
        - id: site_interaction
          label: two-site treatment interaction
          backed: false
          critical: true
        - id: lab_marker
          label: exploratory lab marker
          backed: false
          critical: false
      required_checks:
        - primary_30d
        - serious_event
        - recovery_mean
      critical_unbacked: site_interaction
      correct_conclusion: label the interaction exploratory
      answerText: Verify the three backed claims and label the critical, unbacked site interaction exploratory.
    answerText: "Keep the three timestamped claims as pre-specified and report the two-site pattern transparently as exploratory monitoring evidence."
    why: "A clear sample statistic cannot turn an unregistered observation into a pre-specified population claim."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Timestamp proves truth; separate timing from condition
    # correct result: Verify the first three; interaction is critical but unbacked.
    # state/output: Binder piece 1 appears; next briefing unlocks; sets up M4/M13.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   attest:{verification_limit:3,claims:[{id:"primary_30d",label:"primary 30-day improvement",backed:true,critical:true},{id:"serious_event",label:"serious-event rate",backed:true,critical:true},{id:"recovery_mean",label:"recovery-time mean",backed:true,critical:false},{id:"site_interaction",label:"two-site treatment interaction",backed:false,critical:true},{id:"lab_marker",label:"exploratory lab marker",backed:false,critical:false}],required_checks:["primary_30d","serious_event","recovery_mean"],critical_unbacked:"site_interaction",correct_conclusion:"label the interaction exploratory",answerText:"Verify the three backed claims and label the critical, unbacked site interaction exploratory."}


      say: "Use the Stop 6 result to settle test the bell."
  - id: after-stop-7
    # After Stop 7 | outcome-viewer | automatic
    on: { after: [3] }
    world: "The test the bell result remains visible while the approve the procedure fixture lights."
    panel: "STOP 7 RECORDED - STOP 8 OPEN"
    bubbles:
    - who: okafor   # Amina Okafor
      say: "Use the Stop 7 result to settle approve the procedure."
  - id: at-mission-end
    # At mission end | outcome-viewer | automatic
    on: { missionEnd: true }
    world: "One location, ADJUD, because only its source images can distinguish rare verified outcomes from entry errors."
    panel: "MISSION 2 EVIDENCE: RECORDED"
    bubbles:
    - who: okafor   # Amina Okafor
      say: "The mission decision is recorded. Carry it into the next briefing."

  stops:
  # --- Stop 5: Which Center Survives
  #     Concept: mean, median, skew; Keystone: keystone distributions; Area: Endpoint Adjudication; Learning role: PRACTICE; Difficulty: L2; Story role: clue.
  #     placement: BALLPARK, at outcome-viewer.
  - group: ENDP
    at: outcome-viewer
    title: "Which Center Survives"
    concept: "mean, median, skew"
    reason: "Amina needs to know whether one long recovery is driving the reported average benefit."
    scene: "The verified sample contains recovery times of 4, 5, 5, 6, and 20 days. Compare the mean and median to learn which summary stays closer to the experience of most patients."
    motivation: "A treatment claim built on a pulled mean may exaggerate what a typical patient gains."
    format: BALLPARK
    question: "Submit mean and median in days from values 4,5,5,6,20; formula mean=sum/5. BALLPARK slots sum,mean,median; targets 40,8,5; tolerances 0,0.01,0.01."
    # MODEL CONVERSION. The bible keys three readouts (sum 40, mean 8, median 5)
    # against three tolerances; the engine's estimate panel builds one number from
    # the tiles. The mean is the one the prompt gives a formula for — mean = sum/5
    # — so it is the target, at the bible's own tolerance of 0.01. The sum 40 and
    # the sample size 5 are the two tiles that build it, and the median 5 is read
    # off the sample in the solution line below. Every number here is the prompt's.
    estimate:
      prompt: "The verified sample holds recovery times of 4, 5, 5, 6, and 20 days."
      question: "Build the mean recovery time in days."
      relationship: "mean = sum / 5, so 40 days / 5 patients"
      labels:
      - "40 days  (sum of the sample)"
      - "5 patients  (sample size)"
      - "20 days  (the long recovery time)"
      - "6 days  (the fourth recovery time)"
      - "4 days  (the shortest recovery time)"
      values: [40, 5, 20, 6, 4]
      slots: 2
      template: '{0} / {1}'
      formula: a/b
      correct: [0, 1]
      target: 8
      tolerance: 0.01
      units: days
      solution: "Sum = 4 + 5 + 5 + 6 + 20 = 40 days, so the mean is 40/5 = 8 days; the middle value of the sorted sample is the median, 5 days."
      explanation: "The single 20-day recovery pulls the mean above the median, which is what right skew looks like in two numbers."
    answerText: "The completed check shows mean = 40/5 = 8 days; median = 5 days. The high value pulls the mean above the median, matching right skew."
    why: "A treatment claim built on a pulled mean may exaggerate what a typical patient gains."
    # wrong-path feedback, one rebuttal per wrong option:
    #   pair: mean days, median days
    # correct result: Mean = 40/5 = 8 days; median = 5 days. The high value pulls the mean above the median, matching right skew.
    # state/output: Viewer displays MEAN 8, MEDIAN 5; unlock S2.

  # --- Stop 6: Put Hospitals on One Scale
  #     Concept: z-score and percentile meaning; Keystone: keystone normal model; Area: Statistics & Analysis; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: DERIVE, at adjudication-desk.
  - group: STAT
    at: adjudication-desk
    title: "Put Hospitals on One Scale"
    concept: "z-score and percentile meaning"
    reason: "Raw days cannot show whether 84 hours is equally unusual at hospitals with different baselines."
    scene: "With the resistant center chosen, one hospital's delay must still be compared with its own baseline. Build the standardization from an observed 84 hours, mean 70 hours, and standard deviation 7 hours."
    motivation: "A common z-scale identifies which record deserves the first source check."
    format: DERIVE
    question: "Build three licensed lines and submit z with no unit: deviation 84-70=14 hours [subtract mean]; z=14/7 [divide by SD]; z=2 [simplify]. Decoys include 84/70 and 14/49."
    answerText: "z = (84-70)/7 = 2, so the delay is two standard deviations above that hospital's mean and near the 97.5th percentile under a Normal model."
    why: "A common z-scale identifies which record deserves the first source check."
    # wrong-path feedback, one rebuttal per wrong option:
    #   unitless z number
    # correct result: z=2 exactly, tolerance 0.01.
    # state/output: Record gains z=+2 and HIGH TAIL text; unlock S3.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{"goal":"z-score for 84 hours","givens":["x=84 h","mean=70 h","SD=7 h"],"lines":[{"id":"L1","expression":"deviation=84-70=14 h","license":"state governing relationship"},{"id":"L2","expression":"z=14/7=2","license":"substitute displayed values"}],"keyed_order":["L1","L2"],"decoys":["84/70","14/49"],"correct_result":"z=2","answerText":"The delay is two standard deviations above its hospital mean; z is unitless."}

  # --- Stop 7: Test the Bell
  #     Concept: 68-95-99.7 rule; Keystone: keystone normal model; Area: Statistics & Analysis; Learning role: COMBINE; Difficulty: L3; Story role: reversal.
  #     placement: VERIFY, at outcome-viewer.
  - group: STAT
    at: outcome-viewer
    title: "Test the Bell"
    concept: "68-95-99"
    reason: "The team must verify whether a bell-shaped benchmark can summarize ordinary recovery times."
    scene: "The standardized record lies two deviations high, so the viewer can test the model against the full verified sample. Predict the percent expected between 56 and 84 hours when mean is 70 and SD is 7."
    motivation: "If observed coverage differs sharply from 95%, normal-model tail claims cannot govern source review."
    format: VERIFY
    question: "**CALCULATE AND COMMIT:** Use the 68-95-99.7 rule with mean 70 h, SD 7 h, and interval 56-84 h; submit the predicted percent before the viewer unlocks."
    # ---- HELD BACK. Converted once, then reverted, and the reason is not a
    # missing field — every number this board needs is in the payload below.
    # The two VERIFY models disagree about what a right answer is.
    # `engine/core/instruments.js` grades this format as
    #     ok = prediction is within `passRatio` of the measurement
    # so passing means the player's prediction MATCHED what was measured. This
    # stop's whole teaching is the opposite: the 68-95-99.7 rule correctly
    # predicts 95%, the verified sample shows 88%, and the point is that the
    # Normal model is inadequate. A player who reasons correctly dials 95 and the
    # engine marks them wrong. Widening `passRatio` until 95 passes needs
    # [0.92, 1.09], which is neither the bible's 1-percentage-point tolerance nor
    # a test of anything. The bible owes this stop either a prediction that
    # matches its own measurement, or a different format.
    answerText: "The model predicts about 95% within two SD, but only 88% are inside. The heavy right tail makes the Normal model inadequate for tail decisions."
    why: "If observed coverage differs sharply from 95%, normal-model tail claims cannot govern source review."
    # wrong-path feedback, one rebuttal per wrong option:
    #   predicted percent, then fit conclusion
    # correct result: Prediction 95%; observed coverage 88%; conclusion inadequate Normal fit; prediction tolerance 1 percentage point.
    # state/output: NORMAL MODEL: LIMITED FIT appears in words and icon; unlock S4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   verify:{required_sequence:[calculate_and_commit,operate,measure,interpret],prediction:{equation:"68-95-99.7 rule for mean ±2 SD",inputs:{mean:70,sd:7,lower:56,upper:84},units:"hours",submit:{quantity:"predicted coverage",unit:"percent",truth:95,tolerance:1}},equipment_locked_until_prediction_commit:true,operation:{action:"reveal verified-sample coverage",fixed:["56-84 h interval","verified sample"]},measurements:{observed_coverage:88,unit:"percent"},restore:{required:false,reason:"reveal changes no setting"},correct_conclusion:"inadequate Normal fit",answerText:"The model predicts 95%, but observed coverage is 88%, so the Normal tail model is inadequate."}

  # --- Stop 8: Approve the Procedure
  #     Concept: graph choice, resistance, outlier treatment; Keystone: keystone distributions; Area: Endpoint Adjudication; Learning role: TRANSFER; Difficulty: L4; Story role: decision.
  #     placement: DIAGNOSIS, at outcome-viewer.
  - group: ENDP
    at: outcome-viewer
    title: "Approve the Procedure"
    concept: "graph choice, resistance, outlier treatment"
    reason: "Amina must lock one procedure before the next data export."
    scene: "The mean is pulled upward, the median remains stable, and observed tail coverage fails the Normal benchmark. Choose the one procedure that fits all readings while preserving extreme records for source review."
    motivation: "The measurement rule determines whether later treatment comparisons answer the registered patient question."
    format: DIAGNOSIS
    question: "Compare the displayed shape, center, spread, Normal-fit, and source-status readings. Submit the endpoint procedure that preserves extremes while using resistant summaries."
    headline: "RECOVERY SUMMARY"
    # The five readings, their numbers and their alarm/quiet statuses are the
    # bible's. DERIVED: `zone`, which the engine uses to group a reading with the
    # display it comes off — each one here is the bible's own name for that
    # reading, so no display is named that the bible did not name.
    readings:
    - { zone: "Histogram", label: "Shape", value: "right-skewed", status: alarm }
    - { zone: "Mean", label: "Center of the sample", value: "8 days", status: normal }
    - { zone: "Median", label: "Center of the sample", value: "5 days", status: normal }
    - { zone: "IQR fence", label: "Records flagged", value: "20 days", status: alarm }
    - { zone: "Normal coverage", label: "Inside two SD", value: "88 percent", status: alarm }
    # The four candidates are the bible's own choice list, kept in its order and
    # its words: "mean/SD delete extremes; median/IQR retain-and-review; range
    # only; category average", answer median/IQR retain-and-review.
    choices:
    - "Mean and SD; delete extremes"
    - "Median and IQR; retain and review"
    - "Range only"
    - "Category average"
    answer: "Median and IQR; retain and review"
    answerText: "The completed check shows report median and IQR, compare arms with boxplots, and retain flagged records until source review resolves them."
    why: "The measurement rule determines whether later treatment comparisons answer the registered patient question."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Delete extremes or force Normality; retain sources
    # correct result: Report median and IQR, compare arms with boxplots, and retain flagged records until source review resolves them.
    # state/output: Measurement procedure locks; binder piece 2 fills; M3 unlocks.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   headline RECOVERY SUMMARY; readings: histogram right-skew alarm, mean 8 quiet, median 5 quiet, IQR fence flags 20 alarm, normal coverage 88% alarm. Choices with mechanisms: mean/SD delete extremes; median/IQR retain-and-review; range only; category average. Answer median/IQR retain-and-review.


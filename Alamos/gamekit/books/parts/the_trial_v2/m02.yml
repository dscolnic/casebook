  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Resistant statistic", def: "a summary changed little by extreme values."}
  - {name: "Standard deviation", def: "typical distance of values from their mean."}
  - {name: "Percentile", def: "the percent of observations at or below a value."}
  - {name: "Normal model", def: "a symmetric bell-shaped model described by mean and standard deviation."}

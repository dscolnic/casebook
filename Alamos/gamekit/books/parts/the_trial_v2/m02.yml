    # At mission end | outcome-viewer | automatic
    on: { missionEnd: true }
    world: "At adjudication-desk, Amina Okafor clips the MEDIAN AND MIDDLE-HALF SPREAD summary to the verified records. The dated prop remains here on later visits."

    title: "Size the Confirmation"
    concept: 14   # margin of error/sample size
    reason: "The benchmark result makes a sufficiently precise replacement-kit audit necessary before release."
    scene: "The exposed cohort exceeds the benchmark, and the replacement audit must be precise before release. Calculate the conservative minimum sample for 95% confidence and margin of error 0.03 using p-star=0.50."
    motivation: "The required sample size determines how many kits must be inspected to meet the planned margin of error."
    format: BALLPARK
    question: "Use n=(z-star^2)(p-star)(1-p-star)/(margin of error)^2 with z-star=1.96, p-star=0.50, and margin of error 0.03. Calculate the minimum sample size and round up to a whole number of kits."
    # Every tile is one of the prompt's own numbers: z* 1.96, the two 0.50 factors
    # of p-star(1 - p-star), and the 0.03 margin of error.
    # MODEL CONVERSION on the target. The bible keys the answer at 1068 whole kits
    # with tolerance 0, but the engine grades the expression the tiles build, and
    # that expression is the prompt's own 1067.11. The target stays the bible's
    # 1068 and the tolerance is DERIVED as 1 — the round-up gap the bible itself
    # describes ("round up to 1,068 kits") — so both the computed 1067.11 and the
    # whole-kit 1068 the player reports are graded correct.
    # The bible supplies no distractor tiles for this stop, so there are none.
    estimate:
      prompt: "The audit needs 95% confidence and a margin of error of 0.03, with p-star = 0.50."
      question: "Build the conservative minimum sample size."
      relationship: "n = z*^2 x p-star x (1 - p-star) / (margin of error)^2, so 1.96^2 x 0.50 x 0.50 / 0.03^2"
      labels:
      - "1.96  (z* for 95% confidence)"
      - "0.50  (p-star)"
      - "0.50  (1 - p-star)"
      - "0.03  (margin of error)"
      values: [1.96, 0.5, 0.5, 0.03]
      slots: 4
      template: '{0}^2 × {1} × {2} ÷ {3}^2'
      formula: a**2*b*c/d**2
      correct: [0, 1, 2, 3]
      target: 1068
      tolerance: 1
      units: kits
      solution: "1.96^2 (0.5)(0.5) / 0.03^2 = 1067.11, which rounds up to 1,068 kits."
      explanation: "A sample size is a whole number of kits, and rounding down would leave the margin of error above 0.03."
    answerText: "The completed check shows round up to 1,068 kits. Lower confidence or larger n changes margin of error; using.50 is conservative when p is unknown."
    why: "Rounding down would promise precision the audit cannot deliver."

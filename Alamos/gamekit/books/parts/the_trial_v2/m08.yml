    at: exposure-logger
    title: "Check Before Calculating"
    concept: 25   # one-proportion conditions
    reason: "The exposed-kit sample must satisfy inference conditions before its failure rate is generalized."
    scene: "The warehouse randomly selected 200 of more than 2,000 exposed kits and found 30 failures. Match each condition with its evidence before the sample crosses the firewall to Statistics."
    motivation: "Random selection, the population fraction, and outcome counts determine whether the planned proportion interval is justified."
    format: PROTOCOL
    question: "Match the displayed evidence to the randomization, independence/10%, and large-count conditions. Submit one decision for each condition."

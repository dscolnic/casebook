  stops:
  # --- Stop 29: Check Before Calculating
  #     Concept: one-proportion conditions; Keystone: keystone inference conditions; Area: Monitoring Board Room; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: PROTOCOL, at exposure-logger.
  - group: SAFE
    at: exposure-logger
    title: "Check Before Calculating"
    concept: "one-proportion conditions"
    reason: "An interval is invalid unless the audited kits meet its conditions."
    scene: "The warehouse randomly selected 200 of more than 2,000 exposed kits and found 30 failures. Match each condition with its evidence before the sample crosses the firewall to Statistics."
    motivation: "Conditions connect the formula to a sampling process the board can trust."
    format: PROTOCOL
    question: "Match the displayed evidence to the randomization, independence/10%, and large-count conditions. Submit one decision for each condition."
    # The bible's `scenarios` and `choices` carry over word for word. Its `mapping`
    # is a dictionary of ids; the engine wants the same permutation as choice
    # indices, so random->logger is 0, ten_percent->population is 1 and
    # large_counts->counts is 2.
    scenarios:
    - "random-selection condition"
    - "10% independence condition"
    - "large-count condition"
    choices:
    - "warehouse logger randomly selected 200 kits"
    - "200 is no more than 10% of over 2,000 kits"
    - "30 failures and 170 nonfailures are both at least 10"
    mapping: [0, 1, 2]
    answerText: "The completed check shows all three conditions pass; use 30 and 170 for interval large counts."
    why: "Conditions connect the formula to a sampling process the board can trust."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Formula works without conditions; match evidence
    # correct result: All three conditions pass; use 30 and 170 for interval large counts.
    # state/output: sample transfer; waypoint STAT.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   protocol:{scenarios:[{id:"random",text:"random-selection condition"},{id:"ten_percent",text:"10% independence condition"},{id:"large_counts",text:"large-count condition"}],choices:[{id:"logger",text:"warehouse logger randomly selected 200 kits"},{id:"population",text:"200 is no more than 10% of over 2,000 kits"},{id:"counts",text:"30 failures and 170 nonfailures are both at least 10"}],mapping:{random:"logger",ten_percent:"population",large_counts:"counts"},answerText:"The logger supports randomness, the population size supports 10%, and 30/170 supports large counts."}

  # --- Stop 30: Build the Interval
  #     Concept: one-proportion CI; Keystone: keystone CI/conditions; Area: Monitoring Board Room; Learning role: INTRODUCE; Difficulty: L3; Story role: reveal.
  #     placement: DERIVE, at cold-room-workbench.
  - group: SAFE
    at: cold-room-workbench
    title: "Build the Interval"
    concept: "one-proportion CI"
    reason: "Quarantine needs a plausible range, not only the observed 15% rate."
    scene: "The random, 10%, and large-count conditions all pass, and p-hat=30/200=0.15. Build the 95% confidence interval using z-star=1.960 and the sample proportion in the standard error, then submit both endpoints."
    motivation: "If the whole interval lies near or above the 10% benchmark, the observed excess is not merely a headline percentage."
    format: DERIVE
    question: "SE=sqrt(.15(.85)/200)=.02525; ME=1.96(.02525)=.0495; interval .15 plus/minus .0495=[.1005,.1995]. Licensed lines; decoy uses .10 in CI SE."
    answerText: "We are 95% confident the true exposed-kit failure proportion is between 10.05% and 19.95%."
    why: "If the whole interval lies near or above the 10% benchmark, the observed excess is not merely a headline percentage."
    # wrong-path feedback, one rebuttal per wrong option:
    #   endpoint pair in proportions or percent
    # correct result: endpoints 10.05%,19.95%, tolerance .1 percentage point.
    # state/output: interval band; S3.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive:{"goal":"95% confidence interval for a proportion","givens":["phat=30/200=0.15","n=200","z*=1.960"],"lines":[{"id":"L1","expression":"SE=sqrt[0.15(0.85)/200]=0.02525","license":"state governing relationship"},{"id":"L2","expression":"ME=1.960(0.02525)=0.0495","license":"substitute displayed values"},{"id":"L3","expression":"CI=0.15±0.0495=[0.1005,0.1995]","license":"simplify with units"}],"keyed_order":["L1","L2","L3"],"decoys":["use 0.10 in the CI standard error","divide the margin by n again"],"correct_result":"[0.1005,0.1995]","answerText":"The 95% interval is 10.05% to 19.95% using the sample proportion in the standard error."}

  # --- Stop 31: Test the Benchmark
  #     Concept: one-proportion z test/conclusion; Keystone: keystone tests; Area: Monitoring Board Room; Learning role: COMBINE; Difficulty: L3; Story role: decision evidence.
  #     placement: DERIVE, at exposure-logger.
  - group: SAFE
    at: exposure-logger
    title: "Test the Benchmark"
    concept: "one-proportion z test/conclusion"
    reason: "The campaign rule requires a formal one-sided comparison with p0=.10."
    scene: "The interval barely clears the benchmark, so the registered test now asks whether the true failure rate exceeds 10%. State hypotheses, calculate z, and give a contextual decision at alpha=.05."
    motivation: "The test decides whether the excess warrants quarantine under the prewritten safety rule."
    format: DERIVE
    question: "H0:p=.10, Ha:p>.10; z=(.15-.10)/sqrt(.10(.90)/200)=2.357; p=.0092. Ordered State/Plan/Do/Conclude lines; p calculator supplied."
    answerText: "Since .0092<.05, reject H0; there is convincing evidence the exposed-kit failure proportion exceeds 10%. Do not say H0 is proven false."
    why: "The test decides whether the excess warrants quarantine under the prewritten safety rule."
    # wrong-path feedback, one rebuttal per wrong option:
    #   z, p-value, reject/fail conclusion
    # correct result: z 2.36 tolerance .01; p .0092 tolerance .001; reject.
    # state/output: quarantine warning; S4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   derive: {visible_prompt: "H0:p=.10, Ha:p>.10; z=(.15-.10)/sqrt(.10(.90)/200)=2.357; p=.0092. Ordered State/Plan/Do/Conclude lines; p calculator supplied.", keyed_result: "z 2.36 tolerance .01; p .0092 tolerance .001; reject.", feedback: "z, p-value, reject/fail conclusion", answerText: "Use the keyed result and explanation printed below."}

  # --- Stop 32: Size the Confirmation
  #     Concept: margin of error/sample size; Keystone: keystone CI/power; Area: Randomisation & Blinding; Learning role: TRANSFER; Difficulty: L4; Story role: decision.
  #     placement: BALLPARK, at cold-room-workbench.
  - group: RAND
    at: cold-room-workbench
    title: "Size the Confirmation"
    concept: "margin of error/sample size"
    reason: "A new shipment cannot release until its failure-rate estimate has margin of error at most 3%."
    scene: "The exposed cohort exceeds the benchmark, and the replacement audit must be precise before release. Calculate the conservative minimum sample for 95% confidence and margin of error 0.03 using p-star=0.50."
    motivation: "Rounding down would promise precision the audit cannot deliver."
    format: BALLPARK
    question: "n=(1.96^2(.5)(.5))/.03^2=1067.11; submit whole kits; correct 1068, tolerance 0. Formula/slots displayed."
    # Every tile is one of the prompt's own numbers: z* 1.96, the two 0.50 factors
    # of p-star(1 - p-star), and the 0.03 margin of error.
    # MODEL CONVERSION on the target. The bible keys the answer at 1068 whole kits
    # with tolerance 0, but the engine grades the expression the tiles build, and
    # that expression is the prompt's own 1067.11. The target stays the bible's
    # 1068 and the tolerance is DERIVED as 1 — the round-up gap the bible itself
    # describes ("round up to 1,068 kits") — so both the computed 1067.11 and the
    # whole-kit 1068 the player reports are graded correct.
    # The bible supplies no distractor tiles for this stop, so there are none.
    estimate:
      prompt: "The audit needs 95% confidence and a margin of error of 0.03, with p-star = 0.50."
      question: "Build the conservative minimum sample size."
      relationship: "n = z*^2 x p-star x (1 - p-star) / (margin of error)^2, so 1.96^2 x 0.50 x 0.50 / 0.03^2"
      labels:
      - "1.96  (z* for 95% confidence)"
      - "0.50  (p-star)"
      - "0.50  (1 - p-star)"
      - "0.03  (margin of error)"
      values: [1.96, 0.5, 0.5, 0.03]
      slots: 4
      template: '{0}^2 × {1} × {2} ÷ {3}^2'
      formula: a**2*b*c/d**2
      correct: [0, 1, 2, 3]
      target: 1068
      tolerance: 1
      units: kits
      solution: "1.96^2 (0.5)(0.5) / 0.03^2 = 1067.11, which rounds up to 1,068 kits."
      explanation: "A sample size is a whole number of kits, and rounding down would leave the margin of error above 0.03."
    answerText: "The completed check shows round up to 1,068 kits. Lower confidence or larger n changes margin of error; using .50 is conservative when p is unknown."
    why: "Rounding down would promise precision the audit cannot deliver."
    # wrong-path feedback, one rebuttal per wrong option:
    #   minimum whole kits
    # correct result: Round up to 1,068 kits. Lower confidence or larger n changes margin of error; using .50 is conservative when p is unknown.
    # state/output: cohort quarantined; binder 8; M9.


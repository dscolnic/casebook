  # --- Stop 29: Check Before Calculating
  #     Concept: one-proportion conditions; Keystone: keystone inference conditions; Area: Monitoring Board Room; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: PROTOCOL, at exposure-logger.

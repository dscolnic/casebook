# ============================================================ MISSION 8
# Split back out of books/the_trial_v2.yml by tools/split-book.mjs; the book's text, verbatim.
# Lifted from ../fpl_gpt/THE_TRIAL_AP_STATISTICS_Campaign_Implementation_Bible.md by tools/v10extract.mjs. Every quoted string below is
# the bible's, verbatim; engine/dev/bibleParity.mjs holds it to that.
- title: "The Cold-Room Rate"
  card:
    header: "MISSION 8 - 8 DAYS UNTIL THE BOARD MEETS."
    title: "The Cold-Room Rate"
    goNow: "Go to the Kit Warehouse & Cold Room and meet Priya Shah, randomisation and blinding lead, at the exposure logger."
    body: "8 days until the board meets. The cold-room log shows a warm span beside a stack of sealed boxes. Today you decide whether the warm kit batch must be held."
    objective: "Estimate and test the exposed-kit failure rate."
  objective: "Estimate and test the exposed-kit failure rate."
  stake: "8 days until the board meets. The cold-room log shows a warm span beside a stack of sealed boxes. Today you decide whether the warm kit batch must be held."
  takeaway: "Interpret intervals and tests in context."
  segue: "But Priya's guess survey differs between arms; she needs to test that claim without confusing it with handling."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Confidence interval", def: "a range from a method that captures the true parameter at a stated long-run rate."}
  - {name: "Margin of error", def: "the critical value times standard error."}
  - {name: "Null hypothesis (H0)", def: "the benchmark claim tested."}
  - {name: "Alternative hypothesis (Ha)", def: "the competing claim supported when data contradict H0."}
  - {name: "P-value", def: "probability, assuming H0, of a result at least as extreme as observed."}
  equations:
  - {"e":"p-hat plus or minus z-star sqrt[p-hat(1-p-hat)/n]","c":"A confidence interval for one population proportion.","v":[["p-hat","sample proportion"],["n","sample size"],["z-star","confidence critical value"]],"s":"The board needs a plausible range for the exposed-kit failure rate."}
  - {"e":"z=(p-hat-p0)/sqrt[p0(1-p0)/n]","c":"Testing a proportion against a benchmark.","v":[["p0","hypothesized population failure proportion"],["p-hat","observed sample failure proportion"],["n","sample size"],["z","standardized test statistic"]],"s":"Quarantine depends on whether failures exceed the 10% campaign safety benchmark."}
  primer:
  - "Check random/independent selection, 10% condition, and large counts."
  - "Use p-hat in interval SE but p0 in test SE."
  - "Reject when p<alpha; otherwise fail to reject."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-the-kit-warehouse-cold-room
    # On arrival at the Kit Warehouse & Cold Room | exposure-logger | automatic
    on: { enter: true, at: RAND }
    world: "The cold-room log shows a warm span beside a stack of sealed boxes."
    panel: "MISSION 8: CHECK BEFORE CALCULATING OPEN"
    # unlocks: Unlock Stop 29 at exposure-logger in the Kit Warehouse & Cold Room.
    bubbles:
    - who: shah   # Priya Shah
      say: "Check the sample before the rate"
  - id: after-stop-29
    # After Stop 29 | cold-room-workbench | automatic
    on: { after: [1] }
    world: "At exposure-logger, the dated accepted-result slip for Stop 29 reads: \"All three conditions pass; use 30 and 170 for interval large counts.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 29 RECORDED - STOP 30 OPEN"
    # unlocks: Unlock Stop 30 at cold-room-workbench in the Kit Warehouse & Cold Room.
    bubbles:
    - who: okafor   # Amina Okafor
      say: "That check holds. The kit-sampling conditions pass, so the failure estimate can now carry quantified uncertainty."
  - id: after-stop-30
    # After Stop 30 | exposure-logger | automatic
    on: { after: [2] }
    world: "At cold-room-workbench, the dated accepted-result slip for Stop 30 reads: \"endpoints 10.05%,19.95%, tolerance.1 percentage point.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 30 RECORDED - STOP 31 OPEN"
    # unlocks: Unlock Stop 31 at exposure-logger in the Kit Warehouse & Cold Room.
    bubbles:
    - who: okafor   # Amina Okafor
      say: "That check holds. The kit-failure interval needs a direct comparison with the registered benchmark."
  - id: after-stop-31
    # After Stop 31 | cold-room-workbench | automatic
    on: { after: [3] }
    world: "At exposure-logger, the dated accepted-result slip for Stop 31 reads: \"z 2.36 tolerance.01; p.0092 tolerance.001; reject.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 31 RECORDED - STOP 32 OPEN"
    # unlocks: Unlock Stop 32 at cold-room-workbench in the Kit Warehouse & Cold Room.
    bubbles:
    - who: okafor   # Amina Okafor
      say: "That check holds. The benchmark result makes a sufficiently precise replacement-kit audit necessary before release."
  - id: at-mission-end
    # At mission end | exposure-logger | automatic
    on: { missionEnd: true }
    world: "At exposure-logger, Amina Okafor hangs a QUARANTINED COHORT tag on the kit release hook. The dated prop remains here on later visits."
    panel: "MISSION 8 EVIDENCE: RECORDED"
    # unlocks: Open the mission outcome and metric screen.
    bubbles:
    - who: okafor   # Amina Okafor
      say: "A sealed box can still hold a damaged kit. But Priya's guess survey differs between arms; she needs to test that claim without confusing it with handling."


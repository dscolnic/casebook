  worked:
    label: "Worked examples"
    title: "Mission 4: worked examples"
    examples:
    - {"title":"Find an expected value","problem":"A game pays $0 with probability 0.5 and $4 with probability 0.5. Find expected payout.","rule":"E(X)=sum of value × probability.","steps":["Set up the relationship: E(X)=sum of value × probability.","E(X)=0(0.5)+4(0.5)=2 dollars."],"answer":"The long-run average payout is $2 per play.","mistake":"Expected value need not be a payout possible on one play."}
    - {"title":"Combine independent spread","problem":"Independent quantities X,Y have means 3,4 and standard deviations 3,4. Find mean and SD of X+Y.","rule":"Means add; independent variances add.","steps":["Set up the relationship: Means add; independent variances add.","mean=3+4=7; variance=3²+4²=25; SD=sqrt(25)=5."],"answer":"The sum has mean 7 and standard deviation 5.","mistake":"Standard deviations themselves do not add."}
    - {"title":"Distinguish two testing errors","problem":"The null hypothesis says a coin is fair. Describe a Type I and a Type II error.","rule":"Type I means rejecting a true null; Type II means failing to reject a false null.","steps":["Calling a truly fair coin unfair is Type I.","Failing to detect that a biased coin is unfair is Type II."],"answer":"The error type depends on both the decision and the coin's actual fairness.","mistake":"A failure to reject does not prove the null true."}
    - {"title":"Calculate power","problem":"A test has Type II error probability β=0.20 for one specified alternative. Find its power there.","rule":"Power=1-β.","steps":["Set up the relationship: Power=1-β.","power=1-0.20=0.80."],"answer":"The test rejects the false null 80% of the time under that particular alternative.","mistake":"Power changes with the actual effect, sample size, and testing rule."}
    - {"title":"Repeated testing","problem":"Five independent tests each have false-positive probability 0.10 under their true nulls. Find the chance of at least one false positive.","rule":"P(at least one)=1-P(none), using independence for the product.","steps":["Set up the relationship: P(at least one)=1-P(none), using independence for the product.","P(at least one)=1-(0.9)^5=1-0.59049=0.40951."],"answer":"The chance is about 41%, not 10%.","mistake":"The independence assumption is needed for this exact product calculation."}


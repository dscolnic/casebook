  # --- Stop 15: At Least One Event
  #     Concept: binomial complement; Keystone: keystone probability/random variables; Area: Endpoint Adjudication; Learning role: COMBINE; Difficulty: L3; Story role: reversal.
  #     placement: TALLY, at simulation-console.
  - group: ENDP
    at: simulation-console
    title: "At Least One Event"
    concept: 15   # binomial complement
    reason: "The queue estimate leaves the board asking whether another event during review would be surprising."
    scene: "With queue uncertainty sized, the board asks whether another event during review would be surprising. Use an independent event probability of 0.20 for each of two patients to find the chance of at least one event."
    motivation: "The chance of at least one event determines whether an isolated new report is plausible under the stated patient risk."
    format: CHOICE
    question: "Use P(X at least 1)=1-(1-p)^n with p=0.20 and n=2. Select the expression and probability that correctly use the complement."
    answerText: "The chance of at least one event is 36%; subtract the no-event probability from one."
    why: "The result prevents one event from being treated as impossible while the audit is open."
    # wrong-path feedback, one rebuttal per wrong option:
    #   predicted percent and plausibility conclusion
    # correct result: Prediction 0.558 or 55.8%, tolerance 1 percentage point; simulation conclusion plausible when the run lies within its displayed simulation band.
    # state/output: The chance counter displays 55.8% and unlocks Stop 16.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   tally:{prediction:{equation:"P(X≥1)=1-(1-p)^n",inputs:{p:0.04,n:20},submit:{unit:"probability or percent",truth:0.558,tolerance:0.01}},equipment_locked_until_prediction_commit:true,bins:[{id:"zero",label:"zero events"},{id:"one_plus",label:"at least one event"}],trials_per_run:20,success_probability:0.04,measure:"proportion of runs in one_plus",expected_reading:0.558,correct_conclusion:"plausible",answerText:"The complement gives 1-0.96^20=0.558, so a simulation near 55.8% is plausible."}
    choices:
      - 1-(0.80)^2 = 0.36
      - (0.80)^2 = 0.64
      - 0.20+0.20 = 0.40
      - "0.20"
    answer: 1-(0.80)^2 = 0.36
    rebuttals:
      - This is the probability of zero events, not at least one.
      - Adding double-counts the case in which both patients have an event.
      - This uses only one patient and ignores the second independent opportunity.

  # --- Stop 16: Price the Errors
  #     Concept: Type I/II, alpha, power; Keystone: keystone decision thresholds; Area: Monitoring Board Room; Learning role: INTRODUCE; Difficulty: L5; Story role: decision.
  #     placement: TRIGGER, at uncertainty-console.
  - group: SAFE
    at: uncertainty-console
    title: "Price the Errors"
    concept: 16   # Type I/II, alpha, power
    reason: "The next hidden update needs a decision threshold fixed before its significance is known."
    scene: "Commit error definitions and a stricter future threshold before the hidden update appears."
    motivation: "The committed threshold and error definitions determine which statistical decision the board can make from that update."
    format: TRIGGER
    question: "An unplanned second look must share the total 0.05 false-positive allowance equally with the first look. Before the new P-value appears, set the inclusive cutoff, match Type I error, Type II error, and power to their trial consequences, then reveal P=0.031 and decide whether to reject the null hypothesis."
    answerText: "Because 0.031 is above the precommitted 0.025 threshold, fail to reject the null. Never say the null was accepted or proved. Power rises with sample size, alpha, effect size, and lower variability."
    why: "A transparent rule keeps urgency from moving the decision line after results are known."
    # wrong-path feedback, one rebuttal per wrong option:
    #   threshold number, error mapping, decision
    # correct result: Threshold 0.025 inclusive; update p=0.031 produces fail to reject.
    # state/output: The analysis receives a DISCLOSED stamp, binder piece 4 fills, and Mission 5 unlocks.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   trigger:{decision_rule:"reject H0 only when adjusted p ≤ 0.025",scale:{min:0,max:0.10,anchors:[0.01,0.025,0.05,0.10]},objective:"limit false-positive risk after the extra look",direction:"smaller p is stronger evidence",consequence_limit:{value:0.025,label:"family false-positive risk"},mapping:{type_I:"stop an effective trial",type_II:"continue a harmful trial",power:"1-beta"},update:{p:0.031,decision:"fail to reject"},answerText:"The inclusive threshold is 0.025; because 0.031 is larger, fail to reject H0."}
    trigger:
      scale:
        label: family-wise false-positive risk
        unit: "%"
        min: 0
        max: 10
        step: 0.1
        anchors:
          - at: 2
            means: routine baseline, not the decision threshold
          - at: 6.5
            means: elevated evidence requiring attention
      direction: rising
      conditions:
        - id: act
          label: Take the protective action
          leadHours: 12
          window:
            min: 2.5
            max: 10
      stream:
        - at: T-48 h
          value: 1
          hoursLeft: 48
        - at: T-24 h
          value: 2
          hoursLeft: 24
        - at: T-12 h
          value: 3
          hoursLeft: 12
        - at: T-6 h
          value: 5
          hoursLeft: 6

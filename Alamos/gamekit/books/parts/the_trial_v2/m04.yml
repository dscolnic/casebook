  stake: "Twelve days remain before the board meets. A torn results envelope lies beside its date stamp. Today you decide how to count that early look."
  takeaway: "At least one equals one minus none."
  segue: "But Eli's fastest hospital supplied that analysis; its proud recruitment figures now need a source check."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Random variable", def: "a numerical outcome determined by chance."}
  - {name: "Expected value", def: "the long-run average value of a random variable."}
  - {name: "Null hypothesis (H0)", def: "the benchmark claim tested."}
  - {name: "Type I error", def: "rejecting a true H0."}
  - {name: "Type II error", def: "failing to reject a false H0."}
  - {name: "Power", def: "the probability that a test rejects a false H0."}

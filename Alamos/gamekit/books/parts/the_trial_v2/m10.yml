- title: "The Smaller Benefit"
  card:
    header: "DAY 10 - BOARD IN 6 DAYS"
    title: "The Smaller Benefit"
    goNow: "Go to Adjudication and meet Amina Okafor, endpoint adjudication lead, at the matched-record table."
    body: "Blinding stayed credible, but the fast site's missing outcomes still inflate the recovery headline. t procedures estimate means when population spread is unknown. Compare the adjusted mean, matched records, and two independent groups before taking diagnostics to Statistics. By the end of the mission, decide which treatment-effect estimate belongs in the pack."
    objective: "Produce the bias-adjusted mean estimate."
  objective: "Produce the bias-adjusted mean estimate."
  stake: "Blinding stayed credible, but the fast site's missing outcomes still inflate the recovery headline. t procedures estimate means when population spread is unknown. Compare the adjusted mean, matched records, and two independent groups before taking diagnostics to Statistics. By the end of the mission, decide which treatment-effect estimate belongs in the pack."
  takeaway: "Never pool AP two-sample variances."
  segue: "Mission decision: Put the adjusted four-unit treatment effect in the pack. It uses the two groups in the right way. The error check also passes. Paired records support a shorter recovery. The one-group test does not settle the claim."

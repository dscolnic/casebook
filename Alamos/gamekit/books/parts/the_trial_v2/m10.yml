    title: "Stress the Adjustment"
    concept: 30   # adjustment diagnostics
    reason: "The analyses differ in apparent strength, so model adequacy must decide which estimate travels forward."
    scene: "The three analyses now disagree in strength, so Statistics compares residual fields after distance adjustment. Choose the adjusted model with random scatter, no fan shape, and no single influential site."
    motivation: "The residual checks determine whether the adjusted treatment estimate is credible despite being smaller than an unadjusted headline."

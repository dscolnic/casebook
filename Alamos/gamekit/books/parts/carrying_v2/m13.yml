    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   control:{candidates:[{id:"rinse",label:"rinse treatment"},{id:"salinity",label:"salinity"},{id:"temperature",label:"temperature"}],correct_control:"rinse",baseline:{setting:"OFF",survivors:100},response:{setting:"ON",survivors:2},noise_band:{survivors:3},fixed:["water 100 L","salinity 35 ppt","temperature 24 C","starting load 100","30-minute timing"],measure_when:"after 30 minutes",restore:{required:true,setting:"OFF",survivors:100,remeasure:true},correct_conclusion:"rinsing caused the reduction",answerText:"Turning on only the rinse reduces survivors from 100 to 2, far beyond noise, and restoration returns the baseline."}


  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 13: worked examples"
    examples:
    - {"title":"Introduced versus invasive","problem":"A plant arrives from another region and establishes without documented harm. Is it automatically invasive?","rule":"Introduced describes origin; invasive generally includes spreading and causing ecological or other harm in the relevant usage.","steps":["Its arrival establishes that it is nonnative to the location.","Evidence of spread and harm is still needed to make the stronger classification."],"answer":"Introduction alone does not establish invasiveness.","mistake":"Do not treat every nonnative organism as equally harmful."}
    - {"title":"An endemic species","problem":"A species exists naturally on only one small island. What does endemic mean, and why can habitat loss matter greatly?","rule":"Endemic means native and restricted to a particular geographic area.","steps":["All natural populations lie within that restricted range.","Habitat loss there can affect a large share of the species rather than one of many widespread populations."],"answer":"Its restricted range can make local threats consequential for the whole species.","mistake":"Endemic does not mean invasive or necessarily already endangered."}
    - {"title":"Prevent an introduction","problem":"A generic shipment can carry seeds in packing soil. Compare inspecting before release with waiting until seedlings spread.","rule":"Prevention acts before establishment; control afterward must find and remove organisms already dispersed.","steps":["Inspection can intercept the pathway while material is concentrated.","After release, seeds may spread beyond the original shipment and become harder to locate."],"answer":"Pre-release inspection targets the introduction pathway directly.","mistake":"Inspection reduces risk but does not guarantee every organism is detected."}
    - {"title":"Species richness","problem":"A sample contains 8 oak trees, 2 pines, and 1 birch. Find species richness.","rule":"Richness counts distinct species, not individuals.","steps":["Set up the relationship: Richness counts distinct species, not individuals.","distinct species={oak,pine,birch}, so richness=3."],"answer":"Species richness is 3; the total individual count is 11.","mistake":"Richness does not measure how evenly individuals are distributed among species."}
    - {"title":"Compare ecological vulnerability","problem":"A species eats one seed type; another eats many seeds and insects. A drought removes that one seed type. Which has fewer food alternatives?","rule":"Specialists use a narrower resource range than generalists.","steps":["The specialist loses its primary food source.","The generalist has other possible foods, though they may also be affected."],"answer":"The specialist has fewer alternatives under this stated disturbance.","mistake":"Generalists are not immune to environmental change."}


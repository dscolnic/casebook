  # --- Stop 51: Control the rinse treatment
  #     Concept: ballast decontamination | causality | D10 | RETRIEVE | L3 | evidence; Keystone: ballast decontamination | causality | D10 | RETRIEVE | L3 | evidence; Area: Chapel Council Room; Learning role: PRACTICE; Difficulty: L3; Story role: ballast decontamination | causality | D10 | RETRIEVE | L3 | evidence.
  #     placement: CONTROL, at flow-tank.
  - group: CHAPEL
    at: flow-tank
    title: "Control the rinse treatment"
    concept: 33   # ballast decontamination | causality | D10 | RETRIEVE | L3 | evidence
    reason: "The survey's missed organisms make prevention before cargo release more important."
    scene: "Because land surveys miss remote escapees, prevention must work before release. Change rinse treatment alone, measure survivors, restore baseline, and remeasure."
    motivation: "The rinse reversal determines whether the treatment itself causes the reduction in surviving organisms."
    format: CONTROL
    question: "At rinse OFF measure after 30 minutes; change only rinse ON with water 100 L, salinity 35 ppt, temperature 24 C, starting load 100, and time fixed; restore OFF and remeasure; submit causation"
    # THE BIBLE'S PAYLOAD, converted. Its three candidates and `correct_control:
    # rinse` transfer directly, `fixed` becomes `held`, and the survivor count is
    # the one observable: 100 at the baseline, 2 with the rinse on, which the
    # engine carries as a signed response of -98 against the bible's noise of 3.
    control:
      observable: { label: Surviving organisms in the hull sample, unit: count }
      variables:
      - { id: rinse, label: Rinse treatment }
      - { id: salinity, label: Salinity }
      - { id: temperature, label: Temperature }
      truth: rinse
      baseline: 100
      response: -98
      noise: 3
      held: [water 100 L, salinity 35 ppt, temperature 24 C, starting load 100, 30-minute timing]
      changeVerb: Turn the rinse on
      run: Measure after 30 minutes
      commit: Name the variable that caused it
    answerText: "The completed check shows survivors fall from 100 to 2 only when rinse is on; rinsing caused the reduction."
    why: "Control the rinse treatment connects the measured environmental mechanism to the next island condition."
    # wrong-path feedback, one rebuttal per wrong option:

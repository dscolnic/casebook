  stops:
  # --- Stop 41: Close the peak-power ledger
  #     Concept: demand and efficiency | energy | D7 ledger | RETRIEVE | L2 | foundation; Keystone: demand and efficiency | energy | D7 ledger | RETRIEVE | L2 | foundation; Area: Turbine Yard; Learning role: PRACTICE; Difficulty: L3; Story role: demand and efficiency | energy | D7 ledger | RETRIEVE | L2 | foundation.
  #     placement: BALANCE, at meter-board.
  - group: POWER
    at: meter-board
    title: "Close the peak-power ledger"
    concept: 25   # demand and efficiency | energy | D7 ledger | RETRIEVE | L2 | foundation
    reason: "The reef safeguards add electrical demand that the evening power plan must now cover."
    scene: "The reef conditions add new electric loads, while essential evening demand must remain firm. Close the peak ledger before selecting any generator or storage plan."
    motivation: "The peak-power balance determines how much firm reserve remains after protected loads are supplied."
    format: BALANCE
    question: "Using 310 kW supply and simultaneous loads of 160, 55, 20, 15, and 45 kW, apply reserve=supply-loads and submit one reserve in kW"
    relationship: "reserve = available supply - the sum of the active loads"
    # THE BIBLE'S PAYLOAD, converted. `direction: in|out` becomes the sign on
    # `value`, and the bible's `correct: 15` is the ledger's `total`. Nameplate
    # capacity keeps `counts: false` as `countable: false`, its `reason` moved to
    # `unitNote`. `hidden` marks the ferry berth, which is the new load this
    # stop's own scene says has just arrived on the ledger; without it the rows
    # already on the board total 60 kW, well outside the 1 kW band.
    balance:
      total: { amount: 15, unit: kW, label: Reserve at the evening peak }
      tolerance: 1
      streams:
      - { id: available_supply, label: Available supply, value: 310, unit: kW }
      - { id: homes, label: Homes, value: -160, unit: kW }
      - { id: water, label: Waterworks, value: -55, unit: kW }
      - { id: school, label: School, value: -20, unit: kW }
      - { id: tip, label: Tip and sorting yard, value: -15, unit: kW }
      - { id: ferry, label: Ferry berth, value: -45, unit: kW, hidden: true }
      - { id: nameplate_capacity, label: Nameplate capacity, value: 400, unit: kW, countable: false,
          unitNote: "Nameplate is what the plant could make on its best day. It is not what is available during the outage." }
      commit: Report the reserve
    answerText: "The completed check shows the reserve is 15 kW."
    why: "Close the peak-power ledger connects the measured environmental mechanism to the next island condition."
    # wrong-path feedback, one rebuttal per wrong option:
    #   The retry identifies the first incorrect mechanism, unit, unsupported claim, omitted requirement, or violated constraint.
    # correct result: The reserve is 15 kW
    # state/output: Keep the result visible, record it in the mission log, and unlock the next authored stop.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   balance:{streams:[{id:"available_supply",direction:"in",value:310,unit:"kW",counts:true},{id:"homes",direction:"out",value:160,unit:"kW",counts:true},{id:"water",direction:"out",value:55,unit:"kW",counts:true},{id:"school",direction:"out",value:20,unit:"kW",counts:true},{id:"tip",direction:"out",value:15,unit:"kW",counts:true},{id:"ferry",direction:"out",value:45,unit:"kW",counts:true},{id:"nameplate_capacity",direction:"none",value:400,unit:"kW",counts:false,reason:"not available supply during the outage"}],equation:"reserve=available supply-sum active loads",correct:15,tolerance:1,answerText:"The active-load reserve is 15 kW; unavailable nameplate capacity does not count."}

  # --- Stop 42: Calculate capacity factor
  #     Concept: capacity factor | energy | 11; Keystone: capacity factor | energy | 11; Area: Turbine Yard; Learning role: PRACTICE; Difficulty: L3; Story role: capacity factor | energy | 11.
  #     placement: BALLPARK, at turbine-plate.
  - group: POWER
    at: turbine-plate
    title: "Calculate capacity factor"
    concept: 26   # capacity factor | energy | 11
    reason: "The small evening reserve makes the turbine's nameplate claim insufficient for supply planning."
    scene: "The peak ledger leaves only fifteen kilowatts, and the turbine plate promises 250 kilowatts. Replace nameplate power with annual performance."
    motivation: "Annual capacity factor distinguishes rated turbine power from the energy the island actually receives over a year."
    format: BALLPARK
    question: "Apply capacity factor=680000 kWh/(250 kW*8760 h); submit one percent"
    # THE BIBLE'S PAYLOAD, converted. Its three `inputs` become the three tiles
    # and its `equation` the template; `truth: 31.1` is the target and its
    # `tolerance: 0.2` is already an absolute band on a percentage.
    estimate:
      prompt: The plate on the turbine promises 250 kilowatts and the meter has a year of what it actually made.
      question: Estimate the turbine's capacity factor as a percentage.
      relationship: capacity factor = actual output ÷ (rated power × hours in a year)
      labels:
      - 680000 kWh  (actual output last year)
      - 250 kW  (rated turbine power)
      - 8760 h  (hours in a year)
      values: [680000, 250, 8760]
      slots: 3
      template: '{0} ÷ ({1} × {2}) × 100'
      formula: a/(b*c)*100
      correct: [0, 1, 2]
      target: 31.1
      tolerance: 0.2
      units: percent
      solution: 680,000 ÷ (250 × 8,760) × 100 = 31.1 per cent.
      explanation: Rated power is what a machine makes when the wind is right; the capacity factor is what it made against a whole year of running flat out.
    answerText: "The completed check shows capacity factor is 31.1%."
    why: "Calculate capacity factor connects the measured environmental mechanism to the next island condition."
    # wrong-path feedback, one rebuttal per wrong option:
    #   The retry identifies the first incorrect mechanism, unit, unsupported claim, omitted requirement, or violated constraint.
    # correct result: Capacity factor is 31.1%
    # state/output: Keep the result visible, record it in the mission log, and unlock the next authored stop.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   estimate:{equation:"680000/(250*8760)*100",inputs:{actual_kWh:680000,rated_kW:250,hours:8760},truth:31.1,unit:percent,tolerance:0.2}


  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 6: worked examples"
    examples:
    - {"title":"A shared-resource incentive","problem":"Several users draw water from one shared source. Each gains from taking extra water while the depletion cost is shared. Explain the problem.","rule":"Individual incentives can conflict with preserving a shared limited resource.","steps":["One user receives the full immediate benefit of extra withdrawal.","The resulting shortage is spread among all users, encouraging collective overuse without effective rules."],"answer":"This is a tragedy-of-the-commons mechanism.","mistake":"Shared ownership alone does not guarantee failure; effective institutions can change incentives."}
    - {"title":"Set a simplified harvest ceiling","problem":"A stock adds an estimated 40 individuals per year before harvest, with other flows balanced. Compare harvests of 30 and 50.","rule":"Net annual change=biological addition-harvest.","steps":["Set up the relationship: Net annual change=biological addition-harvest.","with 30 harvested, change=40-30=+10; with 50, change=40-50=-10."],"answer":"Only the 30-individual harvest avoids decline in this simplified estimate.","mistake":"A growth estimate has uncertainty and may change with stock size."}
    - {"title":"Total resource footprint","problem":"A group has 100 people, each requiring 2 hectares of productive area under a specified estimate. Find total footprint.","rule":"Total footprint=population×per-person footprint.","steps":["Set up the relationship: Total footprint=population×per-person footprint.","footprint=100(2)=200 hectares."],"answer":"Estimated footprint is 200 hectares.","mistake":"Per-person use and population both affect the total."}
    - {"title":"Integrated pest management","problem":"A grower observes a pest count below the action threshold and beneficial predators present. What is a reasoned next step?","rule":"Integrated pest management combines monitoring, prevention, biological methods, and targeted treatment when justified.","steps":["The count has not reached the preselected action threshold.","Continue monitoring and protect beneficial predators rather than automatically applying a broad pesticide."],"answer":"Use the evidence and threshold to decide whether treatment is needed.","mistake":"Integrated management does not mean either spraying constantly or never treating."}
    - {"title":"Protect a required reserve","problem":"A lab has 100 energy units. Essential tasks need 30 and 40 units, and reserve must be at least 20. How much remains for an optional task?","rule":"Optional capacity = total - essential use - protected reserve.","steps":["essential use = 30+40 = 70 units.","optional capacity = 100-70-20 = 10 units."],"answer":"At most 10 units may fund the optional task while preserving the reserve.","mistake":"Treating the reserve as freely available breaks the stated requirement."}


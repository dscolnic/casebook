  # --- Stop 22: Buy compliance evidence
  #     Concept: monitoring design | policy | 6.1 | COMBINE | L5 | decision; Keystone: monitoring design | policy | 6.1 | COMBINE | L5 | decision; Area: Chapel Council Room; Learning role: PRACTICE; Difficulty: L3; Story role: monitoring design | policy | 6.1 | COMBINE | L5 | decision.
  #     placement: VALUE, asked by Mara Voss beside council-table.
  - group: CHAPEL
    at: council-table
    title: "Buy compliance evidence"
    person: voss
    concept: "monitoring design | policy | 6"
    reason: "buy evidence that changes whether the ceiling is real"
    scene: "Because the catch cannot prove where it was taken, the council has forty monitoring credits. Buy records that can reveal both total extraction and nursery violations, and the team needs this result before it acts."
    motivation: "evidence has value only if it can change enforcement"
    format: VALUE
    question: "choose within 40: electronic tags 20 required, random dock checks 15 required, poster 8, fisher survey 12, larger sign 10"
    # THE BIBLE'S PAYLOAD, converted. Its `budget`, its five options with their
    # `axis` and `cost`, and its `correct_purchase` transfer directly; the
    # bible's `required: true` is the engine's `decisive`, which is what marks an
    # option as one that could change the decision. Costs and names are the
    # payload's, which is where this stop's board is specified.
    value:
      budget: { amount: 40, unit: monitoring credits }
      decision: Which records can prove both how much is taken and where it was taken from?
      options:
      - { id: landing_tags, label: Electronic landing tags, cost: 20, axis: total extraction, decisive: true }
      - { id: dock_checks, label: Random dock checks, cost: 15, axis: identity and mass verification, decisive: true }
      - { id: nursery_camera, label: Nursery-zone camera, cost: 20, axis: nursery-zone location }
      - { id: public_ad, label: Public advertisement, cost: 10, axis: awareness }
      - { id: seller_survey, label: Seller survey, cost: 15, axis: self-reported behavior }
      commit: Buy the records
    answerText: "The completed check shows tags+checks=35."
    why: "evidence has value only if it can change enforcement"
    # wrong-path feedback, one rebuttal per wrong option:
    #   Feedback identifies the first violated mechanism, unit, limit, or unsupported inference and allows a retry.
    # correct result: tags+checks=35
    # state/output: waypoint Common
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   value:{budget:40,options:[{id:"landing_tags",axis:"total extraction",cost:20,required:true},{id:"dock_checks",axis:"identity and mass verification",cost:15,required:true},{id:"nursery_camera",axis:"nursery-zone location",cost:20,required:false},{id:"public_ad",axis:"awareness",cost:10,required:false},{id:"seller_survey",axis:"self-reported behavior",cost:15,required:false}],total_available_cost:80,correct_purchase:["landing_tags","dock_checks"],answerText:"Buy tags and dock checks for 35 credits; they can change enforcement by testing total catch and compliance."}

  # --- Stop 23: Match land-use practices

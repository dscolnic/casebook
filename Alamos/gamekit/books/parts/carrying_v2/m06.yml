    scene: "The harbour plan now measures use and checks violations. At the common, match each land problem to a practice that reduces its mechanism rather than moving it elsewhere, and the team needs this result before it acts."
    motivation: "Named practices earn trust only when their mechanisms address the measured problem instead of moving the harm elsewhere."
    format: PROTOCOL
    question: "Submit the complete mapping: erosion, runoff, irrigation loss, pests, and a forestry claim must each receive one practice."
    # THE BIBLE'S PAYLOAD, converted. Its five `scenarios`, five `choices` and

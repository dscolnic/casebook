  stops:
  # --- Stop 21: Audit the landing claim
  #     Concept: compliance records | evidence | D5 | PRACTICE | L3 | obstacle; Keystone: compliance records | evidence | D5 | PRACTICE | L3 | obstacle; Area: Chapel Council Room; Learning role: PRACTICE; Difficulty: L3; Story role: compliance records | evidence | D5 | PRACTICE | L3 | obstacle.
  #     placement: ATTEST, asked by Mara Voss beside council-table.
  - group: CHAPEL
    at: council-table
    title: "Audit the landing claim"
    person: voss
    concept: "compliance records | evidence | D5 | PRACTICE | L3 | obstacle"
    reason: "verify claims before fees authorize access"
    scene: "The fish ceiling is posted, but four landing claims support the morning catch. Verify identity, time, mass, and nursery-zone origin before any catch receives a legal tag, and the team needs this result before it acts."
    motivation: "a receipt proves payment, not ecological compliance"
    format: ATTEST
    question: "verify at most 3 of 5 claims and reject any critical unbacked claim"
    answerText: "The completed check shows nursery-zone origin is unbacked; hold catch."
    why: "a receipt proves payment, not ecological compliance"
    # wrong-path feedback, one rebuttal per wrong option:
    #   Feedback identifies the first violated mechanism, unit, limit, or unsupported inference and allows a retry.
    # correct result: nursery-zone origin is unbacked; hold catch
    # state/output: inspection station enabled

- title: "The Enforcement Plan"
  card:
    header: "10 DAYS."
    title: "THE ENFORCEMENT PLAN"
    goNow: "Harbour Office, Tomas Reed at fee-desk."
    body: "The fish ceiling works only if every landing is counted. Regulation, property rights, and fees can protect a shared resource, but each shifts costs differently. Test compliance at the harbour, then take the workable rule to the Common Office. By the end of the mission, choose an enforceable land-and-water commons policy."
    objective: "Turn ecological ceilings into fair rules."
  objective: "Turn ecological ceilings into fair rules."
  stake: "The fish ceiling works only if every landing is counted. Regulation, property rights, and fees can protect a shared resource, but each shifts costs differently. Test compliance at the harbour, then take the workable rule to the Common Office. By the end of the mission, choose an enforceable land-and-water commons policy."
  takeaway: "Record the enforceable environmental condition in the mission log."
  segue: "Mission decision: Use measured caps, random checks, restoration, and targeted fees. Payment alone does not prove compliance. The rule can be enforced. But water and methane still leave by unpriced paths."
  # The mission card's own "Primer concepts", printed on the plan card.
  primer:
  - "regulation and property rights can limit access; developed lifestyles often use 4-5 ha/person versus about 1.8 available globally; practices need mechanism-based justification."


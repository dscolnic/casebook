  stops:
  # --- Stop 5: Route one year of rain
  #     Concept: water budget; Keystone: water quantity; Area: Waterworks; Learning role: INTRODUCE; Difficulty: L2; Story role: foundation.
  #     placement: BALANCE, at rain-bench.
  - group: WATER
    at: rain-bench
    title: "Route one year of rain"
    concept: "water budget"
    reason: "Recharge cannot be estimated until every millimetre of rain has a destination."
    scene: "The island ledger now has a water page, but its four destination rows are blank. Close the annual depth balance before converting any part of the rainfall into groundwater, and the team needs this result before it acts."
    motivation: "Recharge is only the fraction left after runoff, plant use, evaporation, and storage change."
    format: BALANCE
    question: "Using precipitation 900 mm/yr, evapotranspiration 510 mm/yr, runoff 210 mm/yr, and soil-storage increase 30 mm/yr, select every stream that counts and submit recharge in mm/yr."
    relationship: "recharge = precipitation - evapotranspiration - runoff - soil-storage increase"
    # THE BIBLE'S PAYLOAD, converted. `direction: in|out` becomes the sign on
    # `value`; the bible's `correct: 150` is the ledger's `total`; `counts: false`
    # on the ferry import becomes `countable: false`, with its `reason` moved to
    # `unitNote` (shown only once the row is read). `hidden` marks the
    # soil-storage increase, which is the row the bible's own wrong-path note
    # says is omitted — 900-510-210 = 180, outside the 1 mm tolerance.
    balance:
      total: { amount: 150, unit: mm/year, label: Annual groundwater recharge }
      tolerance: 1
      streams:
      - { id: precipitation, label: Precipitation, value: 900, unit: mm/year }
      - { id: evapotranspiration, label: Evapotranspiration, value: -510, unit: mm/year }
      - { id: runoff, label: Runoff, value: -210, unit: mm/year }
      - { id: storage_increase, label: Soil-storage increase, value: -30, unit: mm/year, hidden: true }
      - { id: ferry_import, label: Ferry water import, value: 0, unit: mm/year, countable: false,
          unitNote: "A hydrologic flux is a depth of water over the island. This is not one." }
      commit: Report the recharge
    answerText: "The completed check shows 900-510-210-30=150 mm/yr recharge."
    why: "The full input must be conserved; feedback displays the unclosed remainder."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Counting ferry imports in the rainfall ledger mixes a zero, unrelated transport stream into the hydrologic balance; omitting storage or recharge leaves rainfall unclosed.
    # correct result: 900-510-210-30=150 mm/yr recharge.
    # state/output: Recharge row reads 150 mm/yr; unlocks Stop 2.2.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   balance:{streams:[{id:"precipitation",direction:"in",value:900,unit:"mm/year",counts:true},{id:"evapotranspiration",direction:"out",value:510,unit:"mm/year",counts:true},{id:"runoff",direction:"out",value:210,unit:"mm/year",counts:true},{id:"storage_increase",direction:"out",value:30,unit:"mm/year",counts:true},{id:"ferry_import",direction:"none",value:0,unit:"mm/year",counts:false,reason:"not a hydrologic flux"}],equation:"recharge=P-ET-runoff-storage increase",correct:150,tolerance:1,answerText:"Recharge is 150 mm/year; ferry imports do not count in the water balance."}

  # --- Stop 6: Convert depth to volume
  #     Concept: unit conversion; Keystone: water quantity; Area: Waterworks; Learning role: PRACTICE; Difficulty: L2; Story role: evidence.
  #     placement: BALLPARK, at rain-bench.
  - group: WATER
    at: rain-bench
    title: "Convert depth to volume"
    concept: "unit conversion"
    reason: "The council allocates cubic metres, not millimetres of rain."
    scene: "With recharge depth established, Nkemdi needs the amount of water entering the usable aquifer area. Convert the depth across the mapped recharge zone without counting paved harbour land, and the team needs this result before it acts."
    motivation: "A correct volume makes household and ferry demand comparable to natural replacement."
    format: BALLPARK
    question: "Assemble and submit annual recharge volume using 150 mm/yr, 0.001 m/mm, and 1.20 km² of recharge area with 1,000,000 m²/km². Answer in m³/yr."
    # THE BIBLE'S PAYLOAD, converted. The bible's four `labels` tokens become the
    # four tiles, each carrying the value the bible gives it; `slots: 4` and
    # `correct: [0,1,2,3]` are its `formula=product`. Its `tolerance=0.02` is a
    # FRACTION of the 180,000 target — the engine grades an absolute band, so it
    # is written here as 3,600 m³/yr.
    estimate:
      prompt: The recharge depth is settled and the council allocates cubic metres, not millimetres.
      question: Assemble the annual recharge volume in cubic metres a year.
      relationship: recharge volume = recharge depth × recharge area
      labels:
      - 150 mm/yr  (recharge depth)
      - 0.001 m/mm  (millimetres to metres)
      - 1.20 km²  (mapped recharge area)
      - 1000000 m²/km²  (square kilometres to square metres)
      values: [150, 0.001, 1.20, 1000000]
      slots: 4
      template: '{0} × {1} × {2} × {3}'
      formula: a*b*c*d
      correct: [0, 1, 2, 3]
      target: 180000
      tolerance: 3600
      units: m³/yr
      solution: 150 × 0.001 × 1.20 × 1,000,000 = 180,000 m³/yr.
      explanation: One metre of water spread over one square metre is one cubic metre, so depth and area must reach metres before they are multiplied.
    answerText: "The completed check shows 150 x 0.001 x 1.20 x 1,000,000 = 180,000 m³/yr."
    why: "One metre spread over one square metre is one cubic metre; unit tiles remain visible on retry."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Using 150 mm as 150 m or leaving 1.20 km2 unconverted changes the volume by orders of magnitude; paved harbour land is outside the mapped recharge area.
    # correct result: 150 x 0.001 x 1.20 x 1,000,000 = 180,000 m³/yr.
    # state/output: Gauge shows 180,000 m³/yr; unlocks Stop 2.3.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   estimate.labels=[depth,mm_to_m,area,km2_to_m2]; values=[150,0.001,1.20,1000000]; slots=4; formula=product; correct=180000; target=180000; tolerance=0.02.

  # --- Stop 7: Freeze the estimate
  #     Concept: model validation; Keystone: uncertainty/evidence; Area: Chapel Council Room; Learning role: COMBINE; Difficulty: L3; Story role: reversal.
  #     placement: HOLDOUT, at store-gauges.
  - group: CHAPEL
    at: store-gauges
    title: "Freeze the estimate"
    concept: "model validation"
    reason: "The mean-year estimate must survive years it was not fitted to."
    scene: "The volume calculation fits the first ten years, so the dry years remain hidden. Freeze one planning rule before four unseen years appear and expose whether the mean is safe."
    motivation: "A model that fails withheld dry years cannot set a permanent withdrawal ceiling."
    format: HOLDOUT
    question: "Fit either mean recharge, 20th-percentile recharge, or wet-year recharge to years 1-10; click FREEZE; reveal years 11-14; submit the rule that keeps withdrawal below recharge in at least three of four years."
    answerText: "The completed check shows use 144,000 m³/yr; it passes 151k, 146k, and treats 139k/128k as trigger years requiring restrictions."
    why: "Holdout years test generalization; wet or mean rules overfit favorable conditions."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Choosing the wet-year or mean rule overfits favorable years; choosing a rule that fails more than one hidden dry year violates the stated three-of-four criterion.
    # correct result: Use 144,000 m³/yr; it passes 151k, 146k, and treats 139k/128k as trigger years requiring restrictions.
    # state/output: Dry-year warnings appear; unlocks Stop 2.4.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   holdout.training={mean:180000,p20:144000,wet:220000}; hidden=[151000,139000,146000,128000]; criteria="withdrawal <= recharge in >=3/4"; correct_rule=p20; frozen_before_reveal=true.

  # --- Stop 8: Set the ceiling
  #     Concept: uncertainty margin; Keystone: uncertainty/evidence; Area: Chapel Council Room; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: STRESS, asked by Nkemdi Okafor beside store-gauges.
  - group: CHAPEL
    at: store-gauges
    title: "Set the ceiling"
    person: okafor
    concept: "uncertainty margin"
    reason: "Nkemdi must publish one planning ceiling that survives gauge and climate uncertainty."
    scene: "Because 144,000 m³/yr survives most held-out years, only measurement bias can still overturn it. Stress the estimate across the hand-gauge range and choose a ceiling the council can defend."
    motivation: "Planning below the lower credible recharge protects the aquifer when observations are imperfect."
    format: STRESS
    question: "Move annual rainfall bias from -5% to +5%; observed planning recharge is 144,000 m³/yr. Submit one ceiling from 136,800, 144,000, 151,200, or 180,000 m³/yr that never exceeds corrected recharge."
    answerText: "The completed check shows 144,000 x 0.95 = 136,800 m³/yr; adopt that conservative ceiling."
    why: "Negative bias lowers credible recharge; feedback shows which candidates fail at -5%."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A ceiling of 144,000 m3/year or more ignores the -5% rainfall bias; 180,000 uses the unprotected mean rather than the minimum credible recharge.
    # correct result: 144,000 x 0.95 = 136,800 m³/yr; adopt that conservative ceiling.
    # state/output: Ceiling posted; clue for Day 4; delivery piece 2 posts.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   stress.assumption=rain_bias; range=[-0.05,0.05]; base=144000; candidates=[136800,144000,151200,180000]; correct=136800; rule="ceiling <= minimum credible recharge".


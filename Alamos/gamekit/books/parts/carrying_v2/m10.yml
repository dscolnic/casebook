  - group: CHAPEL
    at: sampler
    title: "Read the patterned residuals"
    concept: 34   # temporal pattern | uncertainty | D2 | RETRIEVE | L4 | clue
    reason: "The new nutrient controls challenge Rafi's claim that heat alone explains the reef's oxygen losses."
    scene: "The new controls target nutrients, but Rafi's heat-only model fits the average oxygen level. Compare residual patterns to test whether its errors grow after nitrate pulses."
    motivation: "Residuals following nitrate pulses determine whether the oxygen forecast needs nutrient loading as well as temperature."
    format: RESIDUAL
    question: "Compare heat-only residuals [0,0,-2,-2] with heat-plus-nitrate residuals [0.2,-0.1,0.1,-0.2] and submit the model without a patterned error Use ordered observation coordinates 1–5 on the residual axis."
    answerText: "The completed check shows heat plus nitrate survives; the heat-only errors track nitrate pulses."
    why: "Read the patterned residuals connects the measured environmental mechanism to the next island condition."
    # wrong-path feedback, one rebuttal per wrong option:
    #   The retry identifies the first incorrect mechanism, unit, unsupported claim, omitted requirement, or violated constraint.
    # correct result: Heat plus nitrate survives; the heat-only errors track nitrate pulses
    # state/output: Keep the result visible, record it in the mission log, and unlock the next authored stop.

    answerText: "The completed check shows the combined treatment yields 3.1 mg/L oxygen and 30% cover, showing heat and nutrients interact."
    why: "Control heat and nutrients connects the measured environmental mechanism to the next island condition."
    # wrong-path feedback, one rebuttal per wrong option:

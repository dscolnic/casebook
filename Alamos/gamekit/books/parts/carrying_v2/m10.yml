    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   residual:{models:{heat_only:{residuals:[0,0,-2,-2]},heat_plus_nitrate:{residuals:[0.2,-0.1,0.1,-0.2]}},correct:heat_plus_nitrate}

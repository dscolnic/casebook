  worked:
    label: "Worked examples"
    title: "Mission 10: worked examples"
    examples:
    - {"title":"Compare oxygen deficits","problem":"A water sample has saturation oxygen 10 mg/L but measured oxygen 6 mg/L. Find the deficit.","rule":"Oxygen deficit=saturation concentration-measured concentration.","steps":["Set up the relationship: Oxygen deficit=saturation concentration-measured concentration.","deficit=10-6=4 mg/L."],"answer":"The sample is 4 mg/L below its stated saturation level.","mistake":"Saturation depends on conditions such as temperature; use the supplied reference."}
    - {"title":"Warm water and oxygen","problem":"A stream warms while other conditions are comparable. Why can fish face added oxygen stress?","rule":"Warmer water generally holds less dissolved oxygen at saturation.","steps":["The maximum equilibrium oxygen concentration decreases as the water warms.","Organisms may also need more oxygen as metabolism increases, depending on species and conditions."],"answer":"Supply can fall while biological demand rises.","mistake":"Temperature is not the only factor affecting measured oxygen."}
    - {"title":"Ocean acidification mechanism","problem":"More atmospheric carbon dioxide dissolves in seawater. Explain the pressure on carbonate-building organisms.","rule":"Dissolved carbon dioxide alters acid-base equilibria, raising hydrogen-ion concentration and reducing available carbonate.","steps":["More hydrogen ions react with carbonate to form bicarbonate.","Less carbonate can make shell and skeleton formation harder for some organisms."],"answer":"Acidification means decreasing pH, even if seawater remains above pH 7.","mistake":"The term does not require the ocean to become acidic below pH 7."}
    - {"title":"Trace oxygen loss","problem":"Fertilizer runoff enters a lake, algae grow rapidly, and later dissolved oxygen falls. Explain the sequence.","rule":"Extra nutrients can stimulate growth; microbial decomposition consumes dissolved oxygen.","steps":["Nutrient enrichment promotes an algal bloom when other conditions permit.","After biomass dies, decomposers use oxygen while breaking it down."],"answer":"The resulting oxygen depletion can harm aquatic animals.","mistake":"Nutrients do not simply remove oxygen by their presence alone."}
    - {"title":"Use a reversible intervention","problem":"A lamp draws 2 A at setting A, 3 A at setting B, and 2 A after returning to A. Supply voltage and the lamp are unchanged. What does this support?","rule":"Change one proposed cause, hold other relevant factors fixed, then restore the original condition.","steps":["A → B changes the current by 3-2 = 1 A.","B → A restores 2 A. The response reverses with the setting under the stated controls."],"answer":"The result supports a setting effect under these test conditions.","mistake":"One intervention does not prove the effect is identical under every other condition."}

  stops:
  # --- Stop 37: Read the patterned residuals
  #     Concept: temporal pattern | uncertainty | D2 | RETRIEVE | L4 | clue; Keystone: temporal pattern | uncertainty | D2 | RETRIEVE | L4 | clue; Area: Chapel Council Room; Learning role: PRACTICE; Difficulty: L3; Story role: temporal pattern | uncertainty | D2 | RETRIEVE | L4 | clue.

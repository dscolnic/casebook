          rms: 0.21
          residuals:
            - x: 1
              y: 0.05
              value: 0.05
            - x: 2
              y: -0.04
              value: -0.04
            - x: 3
              y: 0.02
              value: 0.02
            - x: 4
              y: -0.03
              value: -0.03
            - x: 5
              y: 0.01
              value: 0.01

  worked:
    label: "Worked examples"
    title: "Mission 15: worked examples"
    examples:
    - {"title":"Mitigation versus adaptation","problem":"Compare reducing fossil-fuel use with raising a flood-prone building. Classify the actions.","rule":"Mitigation reduces drivers of future climate change; adaptation reduces harm from its effects.","steps":["Reducing fossil-fuel use can lower greenhouse-gas emissions: mitigation.","Raising the building reduces exposure to floodwater: adaptation."],"answer":"The actions serve different purposes and can be combined.","mistake":"An adaptation measure does not necessarily reduce emissions."}
    - {"title":"Withdrawals versus replenishment","problem":"A groundwater store gains 100 units/year and withdrawals are 120 units/year, with other flows balanced. Find the annual stock change.","rule":"Stock change=recharge-withdrawal.","steps":["Set up the relationship: Stock change=recharge-withdrawal.","Δstock=100-120=-20 units/year."],"answer":"The stock shrinks by 20 units each year under these assumptions.","mistake":"Stable delivery can conceal depletion of stored water."}
    - {"title":"Concentration and pollutant load","problem":"A stream flows at 10 L/s with pollutant concentration 2 mg/L. Find pollutant load.","rule":"Mass load=volume flow×concentration.","steps":["Set up the relationship: Mass load=volume flow×concentration.","load=10 L/s×2 mg/L=20 mg/s."],"answer":"The stream carries 20 mg of pollutant each second.","mistake":"Concentration alone does not state total pollutant transport."}
    - {"title":"Use a stated warming factor","problem":"For this exercise, a gas has warming factor 20 kg CO2-equivalent per kg over a specified time horizon. Find the equivalent of 3 kg.","rule":"CO2-equivalent mass=gas mass×the stated horizon-specific factor.","steps":["Set up the relationship: CO2-equivalent mass=gas mass×the stated horizon-specific factor.","equivalent=3(20)=60 kg CO2-equivalent."],"answer":"The equivalent is 60 kg for the supplied factor and horizon.","mistake":"The factor must have a stated time horizon; it is not a universal timeless value."}
    - {"title":"Test an entire allowed range","problem":"A component must operate at or below 80 °C. Its estimated temperature is 77 ± 4 °C. Does every allowed value pass?","rule":"Test the worst allowed value against the stated bound.","steps":["allowed interval = [77-4, 77+4] = [73,81] °C.","maximum allowed temperature = 81 °C > 80 °C. At least one allowed value fails."],"answer":"The estimate does not establish that every allowed temperature passes.","mistake":"Checking only the central estimate ignores the uncertainty."}


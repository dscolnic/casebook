  # --- Stop 20: Fund an enforceable ceiling
  #     Concept: commons governance | policy instruments | 5.1-5.3 | TRANSFER | L5 | decision; Keystone: commons governance | policy instruments | 5.1-5.3 | TRANSFER | L5 | decision; Area: Common Office; Learning role: PRACTICE; Difficulty: L3; Story role: commons governance | policy instruments | 5.1-5.3 | TRANSFER | L5 | decision.

  #     placement: CLOUD, at transect-bench.
  - group: REEF
    at: transect-bench
    title: "Read the survivorship curves"
    concept: "survivorship/life history | population limits | 5"
    reason: "\"Nursery survival determines how quickly the stock can replace catch.\""
    scene: "Because catch efficiency fell 40%, landings no longer measure stock health. Plot juvenile survival for a Type III fish and compare it with a slow-breeding seal before assigning recovery expectations."
    motivation: "High early mortality makes nursery habitat decisive even when adults remain visible"
    format: CLOUD
    question: "\"Place the fish survival cloud through [1000,180,90,55,40] survivors by age and the seal through [100,96,90,70,0]; submit Type III for fish and Type I for seal.\""
    answerText: "The completed check shows fish Type III, seal Type I. Feedback distinguishes constant Type II."
    why: "High early mortality makes nursery habitat decisive even when adults remain visible"
    # wrong-path feedback, one rebuttal per wrong option:

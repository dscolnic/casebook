    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   corridors fish=III, seal=I; tolerance=10 survivors

  # --- Stop 19: Verify logistic recovery
  #     Concept: logistic recovery | experimental causality | 5.2 | COMBINE | L4 | reversal; Keystone: logistic recovery | experimental causality | 5.2 | COMBINE | L4 | reversal; Area: Chapel Council Room; Learning role: PRACTICE; Difficulty: L3; Story role: logistic recovery | experimental causality | 5.2 | COMBINE | L4 | reversal.
  #     placement: VERIFY, at flow-tank.
  - group: CHAPEL
    at: flow-tank
    title: "Verify logistic recovery"
    concept: "logistic recovery | experimental causality | 5"
    reason: "\"The proposed quota must be tested against recovery near carrying capacity.\""
    scene: "With nursery mortality identified, a constant exponential forecast is too optimistic near the habitat limit. Predict one-year growth under the displayed logistic rule, then compare it with the tank cohort."
    motivation: "Growth slows as population approaches K, so catch must leave replacement biomass"
    format: VERIFY
    question: "\"CALCULATE AND COMMIT: use ΔN=rN(1-N/K), r=0.50/yr, N=600 fish, K=1,000 fish; submit ΔN in fish/yr. OPERATE: run one year with food and temperature fixed. MEASURE: final N. INTERPRET: submit whether a 150-fish catch is sustainable. No restoration required.\""
    # THE BIBLE'S PAYLOAD, converted. Its keyed prediction — 120 fish/year, with
    # a tolerance of 2 — is the engine's `truth`, and that ±2 is written as the
    # `passRatio` the engine grades on, [0.983, 1.017] of 120. Its `operation`
    # ("run one year", food and temperature fixed) is the intervention and its
    # `measurements.final_population` the measurement the player may skip. The
    # dial range is wide enough that a prediction anywhere on it does not pass.
    relationship: "ΔN = rN(1 - N/K), so 0.50 × 600 × (1 - 600/1000)"
    verify:
      prediction:
        label: Population change in one year
        unit: fish/year
        min: 0
        max: 300
        step: 5
      truth: 120
      passRatio: [0.983, 1.017]
      intervention:
        label: Run one year of the tank cohort
        note: Food and temperature held fixed.
        outcome: One year run. Cohort settled.
      measurement:
        label: Measured change over the year
        note: The tank counts 718 fish against the 600 it started with.
      lock: Lock the prediction
      commit: Report whether a 150-fish catch is sustainable
    answerText: "The completed check shows 0.50(600)(0.40)=120 fish/yr; 150 exceeds replacement. Feedback shows missing density term."
    why: "Growth slows as population approaches K, so catch must leave replacement biomass"
    # wrong-path feedback, one rebuttal per wrong option:
    #   Feedback identifies the first violated mechanism, unit, limit, or unsupported inference and allows a retry.
    # correct result: 0.50(600)(0.40)=120 fish/yr; 150 exceeds replacement. Feedback shows missing density term
    # state/output: 150 option crossed out
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   verify:{required_sequence:[calculate_and_commit,operate,measure,interpret],prediction:{equation:"ΔN=rN(1-N/K)",inputs:{r:0.50,N:600,K:1000},units:{r:"per year",N:"fish",K:"fish"},submit:{quantity:"population change",unit:"fish/year",truth:120,tolerance:2}},equipment_locked_until_prediction_commit:true,operation:{action:"run one year",fixed:["food","temperature"]},measurements:{final_population:718,unit:"fish",tolerance:5},restore:{required:false,reason:"the annual simulation changes no physical setting"},correct_conclusion:"a 150-fish catch is not sustainable",answerText:"Logistic growth predicts 120 fish/year, so removing 150 exceeds replacement; the measured final population agrees within tolerance."}


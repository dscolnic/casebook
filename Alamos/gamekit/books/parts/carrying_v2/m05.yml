    title: "Fund an enforceable ceiling"
    concept: 18   # commons governance | policy instruments | 5
    reason: "The measured replacement rate needs an enforceable fishing plan rather than a numerical promise alone."
    scene: "The recovery test limits annual replacement to about 120 fish at the present stock. Allocate enforcement capacity so catch, effort, habitat, and data all support a ceiling below that replacement."
    motivation: "The allocation determines whether catch limits, effort checks, habitat protection, and data collection support the same sustainable ceiling."
    format: ALLOCATE
    question: "\"Allocate 100 points and submit a plan: catch tags 30 required; boat-hour log 20 required; nursery closure 25 protected; independent survey 15; advertising 20; larger dock 25. Fund all required/protected items without exceeding 100.\""
    answerText: "The completed check shows 90-point four-part plan; catch ceiling 100 fish/year, below 120 replacement."
    why: "Shared resources avoid tragedy only when access and compliance are governed"

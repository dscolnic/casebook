  #     placement: ALLOCATE, at transect-bench.
  - group: COMMON
    at: transect-bench
    title: "Fund an enforceable ceiling"
    concept: "commons governance | policy instruments | 5"
    reason: "\"A ceiling without monitoring and nursery protection would exist only on paper.\""
    scene: "The recovery test limits annual replacement to about 120 fish at the present stock. Allocate enforcement capacity so catch, effort, habitat, and data all support a ceiling below that replacement."

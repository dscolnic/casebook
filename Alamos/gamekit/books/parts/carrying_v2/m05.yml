  stops:
  # --- Stop 17: Measure catch per unit effort
  #     Concept: catch per unit effort | population limits | D1 trace | RETRIEVE | L2 | clue; Keystone: catch per unit effort | population limits | D1 trace | RETRIEVE | L2 | clue; Area: Reef Station; Learning role: PRACTICE; Difficulty: L3; Story role: catch per unit effort | population limits | D1 trace | RETRIEVE | L2 | clue.
  #     placement: BALLPARK, at landings-book.
  - group: REEF
    at: landings-book
    title: "Measure catch per unit effort"
    concept: "catch per unit effort | population limits | D1 trace | RETRIEVE | L2 | clue"
    reason: "\"The steady landing total must be divided by the effort used to obtain it.\""
    scene: "The paper column recovered on Day 1 includes boat-hours that the electronic sales record omitted. Calculate catch per unit effort in two years to test whether steady landings mean a steady stock."
    motivation: "Falling catch per effort signals depletion hidden by added work"
    format: BALLPARK
    question: "\"Using 960 t/4,800 boat-h in Year 1 and 960 t/8,000 boat-h in Year 5, submit both rates in kg/boat-h and the percent decline.\""
    # THE BIBLE'S PAYLOAD, converted. Its `formula=1000*tonnes/hours` is the
    # panel's formula and its first truth, 200 kg/boat-h, the target; its
    # `tolerance=1%` becomes the engine's absolute 2 kg/boat-h. The engine grades
    # ONE number, so the Year 5 rate is the board's distractor tile and the 120
    # kg/boat-h and 40% decline the bible also keys stay in the answer text.
    estimate:
      prompt: The paper column recovered on Day 1 carries the boat-hours the sales record left out.
      question: Estimate the Year 1 catch per unit effort in kilograms a boat-hour.
      relationship: catch per unit effort = landings ÷ effort
      labels:
      - 960 t  (Year 1 landings)
      - 1000 kg/t  (tonnes to kilograms)
      - 4800 boat-h  (Year 1 effort)
      - 8000 boat-h  (Year 5 effort)
      values: [960, 1000, 4800, 8000]
      slots: 3
      template: '{0} × {1} ÷ {2}'
      formula: a*b/c
      correct: [0, 1, 2]
      target: 200
      tolerance: 2
      units: kg/boat-h
      solution: 960 t × 1,000 kg/t ÷ 4,800 boat-h = 200 kg/boat-h.
      explanation: A landing total on its own says nothing about the stock until it is divided by the work it took to land it.
    answerText: "The completed check shows 200 and 120 kg/boat-h; decline=(200-120)/200=40%."
    why: "Falling catch per effort signals depletion hidden by added work"
    # wrong-path feedback, one rebuttal per wrong option:
    #   dividing tonnes alone misses effort
    # correct result: 200 and 120 kg/boat-h; decline=(200-120)/200=40%
    # state/output: unlock travel, waypoint "Take the effort decline to Reef Station."
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   formula=1000*tonnes/hours; truth=[200,120,40%]; tolerance=1%


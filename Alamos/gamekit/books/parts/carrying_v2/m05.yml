    examples:
    - {"title":"Population balance","problem":"A population starts at 100, with 20 births, 5 immigrants, 10 deaths and 5 emigrants. Find its ending size.","rule":"N_end=N_start+births+immigration-deaths-emigration.","steps":["Set up the relationship: N_end=N_start+births+immigration-deaths-emigration.","N_end=100+20+5-10-5=110."],"answer":"The population increases by 10 to 110.","mistake":"Immigration adds individuals; emigration removes them."}
    - {"title":"Growth below capacity","problem":"Use growth rate rN(1-N/K), with r=0.2/year, N=50 and K=100. Find current growth.","rule":"Logistic growth includes a capacity factor 1-N/K.","steps":["Set up the relationship: Logistic growth includes a capacity factor 1-N/K.","growth=0.2(50)(1-50/100)=5 individuals/year."],"answer":"Current growth is 5 per year.","mistake":"The capacity term changes as population size changes."}
    - {"title":"Catch per unit effort","problem":"A fleet catches 100 tonnes in 10 trips one year and 100 tonnes in 20 trips the next. Compare catch per trip.","rule":"Catch per effort=catch/effort under comparable fishing conditions.","steps":["Set up the relationship: Catch per effort=catch/effort under comparable fishing conditions.","first=100/10=10 tonnes/trip; second=100/20=5 tonnes/trip."],"answer":"Catch per trip halves, a warning even though total catch is unchanged.","mistake":"Effort and other fishing conditions must be considered before interpreting catch totals."}
    - {"title":"Compare ecological vulnerability","problem":"A species eats one seed type; another eats many seeds and insects. A drought removes that one seed type. Which has fewer food alternatives?","rule":"Specialists use a narrower resource range than generalists.","steps":["The specialist loses its primary food source.","The generalist has other possible foods, though they may also be affected."],"answer":"The specialist has fewer alternatives under this stated disturbance.","mistake":"Generalists are not immune to environmental change."}
    - {"title":"Set a simplified harvest ceiling","problem":"A stock adds an estimated 40 individuals per year before harvest, with other flows balanced. Compare harvests of 30 and 50.","rule":"Net annual change=biological addition-harvest.","steps":["Set up the relationship: Net annual change=biological addition-harvest.","with 30 harvested, change=40-30=+10; with 50, change=40-50=-10."],"answer":"Only the 30-individual harvest avoids decline in this simplified estimate.","mistake":"A growth estimate has uncertainty and may change with stock size."}


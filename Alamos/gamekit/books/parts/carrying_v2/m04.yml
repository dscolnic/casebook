    examples:
    - {"title":"Porosity versus permeability","problem":"One rock contains many isolated pores; another has fewer but well-connected pores. Which can transmit water more readily?","rule":"Porosity describes void space; permeability describes how readily connected pathways transmit fluid.","steps":["Many isolated pores can store water without providing a through-path.","Connected pores can allow easier flow even with less total void space."],"answer":"The second rock can be more permeable; pore abundance alone does not decide.","mistake":"High porosity does not guarantee high permeability."}
    - {"title":"Pumping near the coast","problem":"A coastal freshwater well is pumped heavily and salt concentration rises. Explain a plausible mechanism.","rule":"Excessive withdrawal can lower freshwater pressure that limits seawater intrusion.","steps":["Pumping reduces the freshwater level and pressure near the well.","Saltwater can move into the depleted zone along connected pathways."],"answer":"The pattern is consistent with seawater intrusion, requiring site evidence to confirm.","mistake":"Salt appearing in a well does not by itself prove which pumping site caused it."}
    - {"title":"Withdrawals versus replenishment","problem":"A groundwater store gains 100 units/year and withdrawals are 120 units/year, with other flows balanced. Find the annual stock change.","rule":"Stock change=recharge-withdrawal.","steps":["Set up the relationship: Stock change=recharge-withdrawal.","Δstock=100-120=-20 units/year."],"answer":"The stock shrinks by 20 units each year under these assumptions.","mistake":"Stable delivery can conceal depletion of stored water."}
    - {"title":"Estimate recharge","problem":"Annual rain volume is 1000 m³; runoff removes 300 and evaporation plus plant use removes 500. Assume the remaining water recharges groundwater.","rule":"Recharge=rainfall-runoff-evaporation and plant use.","steps":["Set up the relationship: Recharge=rainfall-runoff-evaporation and plant use.","recharge=1000-300-500=200 m³/year."],"answer":"Estimated recharge is 200 m³/year under this simplified balance.","mistake":"Not all rainfall becomes groundwater."}

  # --- Stop 16: Write the aquifer trigger
  #     Concept: environmental thresholds; Keystone: policy instruments; Area: Chapel Council Room; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: TRIGGER, at store-gauges.
  - group: CHAPEL
    at: store-gauges
    title: "Write the aquifer trigger"
    concept: 16   # environmental thresholds
    reason: "The drawdown diagnosis requires an action rule before the next well update arrives."
    scene: "Because drawdown explains the salt front, the warning must act before drinking water fails. Write the threshold now, then test it against new well updates without moving the line."
    motivation: "The freshwater-head threshold determines when pumping must stop to prevent further seawater intrusion."
    format: TRIGGER
    question: "Set an inclusive stop-pumping rule on freshwater head from 0.0 to 3.0 m; objective is prevent chloride above 250 mg/L, and campaign evidence shows risk begins at head <=1.0 m. Commit 1.0 m, reveal updates, then submit STOP when the threshold is met."
    answerText: "The completed check shows stop at head <=1.0 m; the third update triggers action."
    why: "Freshwater pressure holds seawater back; waiting below 1.0 m advances the front."

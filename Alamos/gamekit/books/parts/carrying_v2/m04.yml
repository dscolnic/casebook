  - {name: "Permeability", def: "how readily connected pores transmit water."}
  - {name: "Saltwater intrusion", def: "seawater moving into a freshwater aquifer."}
  - {name: "Soil horizon", def: "a layer formed by additions, losses, movement, and change."}
  primer:

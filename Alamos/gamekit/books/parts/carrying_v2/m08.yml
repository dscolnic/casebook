    motivation: "The first concentration increase localizes the contamination source instead of blaming the whole water supply."
    format: PROBE
    question: "Probe all five stations, compare each station reading with its own expected 6.0-6.5 mg/L range and displayed load at 2.0 L/min, and submit the first break plus source conclusion"

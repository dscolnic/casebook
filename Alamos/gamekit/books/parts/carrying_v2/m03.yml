    motivation: "The succession pathway distinguishes soil-supported recovery from bare-rock recovery when the council evaluates future habitat availability."
    format: SEQUENCE
    question: "Order the four burned-field recovery cards from disturbance through later community, then submit why this secondary-succession path is faster than the displayed bare-rock reference."
    answerText: "The completed check shows the burned soil follows secondary succession and can recover in roughly 10-50 years; bare rock primary succession often takes 100+ years."
    why: "Existing soil preserves nutrients and organisms; feedback highlights the missing prerequisite."
    # wrong-path feedback, one rebuttal per wrong option:

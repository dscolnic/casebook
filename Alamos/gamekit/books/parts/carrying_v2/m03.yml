    #   cards=[bare_rock,pioneers,soil,later,disturbance,grasses,shrubs]; order_primary=[bare_rock,pioneers,soil,later]; order_secondary=[disturbance,grasses,shrubs,later]; axis=ecological_recovery; answer=secondary.
    sequence_patch:
      question: Order `bare rock -> pioneer species -> soil forms -> later community` and `disturbance -> grasses -> shrubs -> later community`; submit secondary succession as the faster path.
      authoredPayload: "`cards=[bare_rock,pioneers,soil,later,disturbance,grasses,shrubs]; order_primary=[bare_rock,pioneers,soil,later]; order_secondary=[disturbance,grasses,shrubs,later]; axis=ecological_recovery; answer=secondary`."
      correctResult: The burned soil follows secondary succession and can recover in roughly 10-50 years; bare rock primary succession often takes 100+ years.
      wrongButPlausible: A plausible shortcut that ignores one condition or treats dependent evidence as independent.
      decisionCanFail: true
      questionAndUnits: Order `bare rock -> pioneer species -> soil forms -> later community` and `disturbance -> grasses -> shrubs -> later community`; submit secondary succession as the faster path.

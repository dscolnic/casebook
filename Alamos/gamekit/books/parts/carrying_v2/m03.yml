  # --- Stop 12: Test the fertilizer claim
  #     Concept: limiting nutrients and controlled experiment; Keystone: experimental causality; Area: Chapel Council Room; Learning role: TRANSFER; Difficulty: L4; Story role: reveal.
  #     placement: CONTROL, at nitrogen-bench.
  - group: CHAPEL
    at: nitrogen-bench
    title: "Test the fertilizer claim"
    concept: 5   # limiting nutrients and controlled experiment
    reason: "Fertilizer is proposed to raise production despite the island's newly established ecological limits."
    scene: "The energy and habitat limits are mapped, yet fertilizer is proposed as the escape. Test equal plots to see whether added nitrogen raises crop yield without creating a larger nitrate loss."
    motivation: "The yield gain and nitrate increase determine whether extra fertilizer solves a food constraint by creating a water-quality problem."
    format: CONTROL
    question: "Change only nitrogen from 0 to 50 kg/ha; keep crop, soil, plot area, water 20 mm, and seven-day timing fixed. Measure yield and runoff nitrate, restore nitrogen to 0, repeat the measurement, then submit one conclusion."
    # THE BIBLE'S PAYLOAD, converted. The bible's three candidates and its
    # `correct_control: nitrogen` transfer directly, and `fixed` becomes `held`.
    # The engine reads ONE observable, so the board is built on the decisive one:
    # runoff nitrate, 1.0 -> 8.0 mg/L against the bible's own 0.3 mg/L noise band.
    # The 4.0 -> 4.6 t/ha yield the bible also measures stays in the answer text.
    control:
      observable: { label: Runoff nitrate, unit: mg/L }
      variables:
      - { id: nitrogen, label: Nitrogen application }
      - { id: water, label: Irrigation }
      - { id: crop, label: Crop type }
      truth: nitrogen
      baseline: 1.0
      response: 7.0
      noise: 0.3
      held: [crop, soil, plot area, water 20 mm, seven-day timing]
      changeVerb: Raise nitrogen from 0 to 50 kg/ha
      run: Measure after seven days
      commit: Name the variable that caused it
    answerText: "The completed check shows nitrogen raises yield 0.6 t/ha but raises runoff nitrate 7.0 mg/L; the ferry plan must cap nutrient surplus."
    why: "Holding other variables fixed and reversing nitrogen isolates its effect; retry identifies any changed control."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Changing water or crop with nitrogen prevents a causal comparison; judging yield alone ignores the 7.0 mg/L nitrate increase that makes the fertilizer claim unsafe.
    # correct result: Nitrogen raises yield 0.6 t/ha but raises runoff nitrate 7.0 mg/L; the ferry plan must cap nutrient surplus.

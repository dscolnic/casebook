    title: "Mission 3: worked examples"
    examples:
    - {"title":"Plant energy available for growth","problem":"Plants capture 1000 kJ/m²/year as gross primary productivity and use 400 for respiration. Find net primary productivity.","rule":"NPP=GPP-plant respiration.","steps":["Set up the relationship: NPP=GPP-plant respiration.","NPP=1000-400=600 kJ/m²/year."],"answer":"Net plant production is 600 kJ/m²/year.","mistake":"Do not subtract consumer respiration from this plant-only calculation."}
    - {"title":"Transfer between trophic levels","problem":"Producers store 1000 energy units and an assumed 10% reaches primary consumers. How much reaches secondary consumers if the same fraction transfers again?","rule":"Energy at the next level=previous level energy×transfer efficiency.","steps":["Set up the relationship: Energy at the next level=previous level energy×transfer efficiency.","primary=1000(0.10)=100; secondary=100(0.10)=10 units."],"answer":"Secondary consumers receive 10 units in this teaching model.","mistake":"Ten percent is a stated approximation here, not an exact universal ecological constant."}
    - {"title":"Calculate ecological transfer efficiency","problem":"One trophic level produces 200 units and the next produces 30. Find transfer efficiency.","rule":"Efficiency=next-level production/previous-level production×100%.","steps":["Set up the relationship: Efficiency=next-level production/previous-level production×100%.","efficiency=30/200×100%=15%."],"answer":"The measured transfer efficiency is 15%.","mistake":"Use comparable production measures over the same area and time."}
    - {"title":"Matter cycles, energy flows","problem":"Plants absorb mineral nutrients and sunlight; decomposers later break down dead plants. Which input can be recycled locally?","rule":"Atoms can be recycled through food webs, while usable energy is progressively dispersed as heat.","steps":["Decomposition can return nutrient atoms to soil for new uptake.","It does not turn all dispersed heat back into the original sunlight input."],"answer":"Nutrients cycle; the ecosystem still needs new energy input.","mistake":"Recycling matter does not create a closed, lossless energy cycle."}
    - {"title":"Total resource footprint","problem":"A group has 100 people, each requiring 2 hectares of productive area under a specified estimate. Find total footprint.","rule":"Total footprint=population×per-person footprint.","steps":["Set up the relationship: Total footprint=population×per-person footprint.","footprint=100(2)=200 hectares."],"answer":"Estimated footprint is 200 hectares.","mistake":"Per-person use and population both affect the total."}

  stops:
  # --- Stop 9: Count usable plant energy
  #     Concept: GPP/NPP and 10% law; Keystone: energy flow; Area: Turbine Yard; Learning role: INTRODUCE; Difficulty: L2; Story role: foundation.
  #     placement: BALLPARK, at common-map.
  - group: POWER
    at: common-map
    title: "Count usable plant energy"
    concept: 3   # GPP/NPP and 10% law
    reason: "The groundwater limit does not establish how many grazing animals the common can feed."
    scene: "The water ceiling is now fixed, but the common can still be overstocked by counting all captured sunlight. Calculate usable plant production, then follow its loss to grazing animals."
    motivation: "Net plant production and transfer to herbivores set the energy available for stocking the common."
    format: BALLPARK
    question: "First calculate NPP from GPP 18,000 kJ/m²/yr and plant respiration 8,000 kJ/m²/yr. Then apply 10% transfer and submit herbivore production in kJ/m²/yr."
    # THE BIBLE'S PAYLOAD, converted. Its three `estimate.values` become the three
    # tiles and its `formula="(GPP-R)*0.10"` the template; respiration is written
    # as the positive 8,000 the bible's own question states and subtracted by the
    # template rather than carried as a negative tile. Its `tolerance=0.01` is a
    # FRACTION of the 1,000 target, so the engine's absolute band is 10.
    estimate:
      prompt: The grazing common can be overstocked by counting all the sunlight the grass captures.
      question: Estimate herbivore production on the common.
      relationship: herbivore production = (GPP - plant respiration) × 0.10
      labels:
      - 18000 kJ/m²/yr  (gross primary productivity)
      - 8000 kJ/m²/yr  (plant respiration)
      - 0.10  (ten per cent transfer between levels)
      values: [18000, 8000, 0.10]
      slots: 3
      template: '({0} - {1}) × {2}'
      formula: (a-b)*c
      correct: [0, 1, 2]
      target: 1000
      tolerance: 10
      units: kJ/m²/yr
      solution: (18,000 - 8,000) × 0.10 = 1,000 kJ/m²/yr.
      explanation: Plants respire away part of what they capture, and only about a tenth of what is left reaches the animals that eat them.
    answerText: "The completed check shows nPP is 10,000 kJ/m²/yr; herbivore production is about 1,000 kJ/m²/yr."
    why: "Plants use part of GPP, and most remaining energy is lost as heat between levels."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Using GPP directly skips plant respiration, while applying 10% before finding NPP transfers energy the plants already used; both overstate herbivore production.
    # correct result: NPP is 10,000 kJ/m²/yr; herbivore production is about 1,000 kJ/m²/yr.
    # state/output: Grazing energy cap appears; unlocks Stop 3.2.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   estimate.values=[18000,-8000,0.10]; formula="(GPP-R)*0.10"; correct=1000; target=1000; tolerance=0.01.


  # --- Stop 46: Verify methane capture
  #     Concept: methane capture | causality | D7 | RETRIEVE | L4 | evidence; Keystone: methane capture | causality | D7 | RETRIEVE | L4 | evidence; Area: Tip and Sorting Yard; Learning role: PRACTICE; Difficulty: L3; Story role: methane capture | causality | D7 | RETRIEVE | L4 | evidence.
  #     placement: VERIFY, at gas-rack.
  - group: TIP
    at: gas-rack
    title: "Verify methane capture"
    concept: "methane capture | causality | D7 | RETRIEVE | L4 | evidence"
    reason: "The island cannot commit verify methane capture until this evidence is resolved."
    scene: "Because wind cannot return before the vote, captured landfill gas may bridge the gap. Predict recoverable methane, operate the collector, measure capture and leakage, interpret, and restore, and the team needs this result before it acts."
    motivation: "Verify methane capture connects the measured environmental mechanism to the next island condition."
    format: VERIFY
    question: "CALCULATE AND COMMIT 400 m3/day*0.55*0.80 in m3 CH4/day; OPERATE at 60% vacuum with waste mass, moisture, and time fixed; MEASURE capture and leakage; INTERPRET against limits; restore baseline"
    relationship: "recoverable methane = gas volume × methane fraction × collection efficiency, so 400 × 0.55 × 0.80"
    # THE BIBLE'S PAYLOAD, converted. The engine's `truth` is what the
    # measurement finds, so it is the bible's measured 170 m3/day, and the
    # bible's own "capture within 10% of 176" acceptance is written as the
    # `passRatio` the engine grades a prediction on. `operate` becomes the
    # intervention and `measure` the measurement the player is free to skip. The
    # dial range is wide enough that not every position on it passes.
    verify:
      prediction:
        label: Recoverable methane a day
        unit: m³ CH4/day
        min: 0
        max: 400
        step: 5
      truth: 170
      passRatio: [0.9, 1.1]
      intervention:
        label: Run the collector at 60 per cent vacuum
        note: Waste mass, moisture and elapsed time held fixed.
        outcome: Vacuum set. Collector steady.
      measurement:
        label: Methane captured a day
        note: The rack also logs 18 per cent leaked, inside the 20 per cent limit.
      lock: Lock the prediction
      commit: Report whether the capture is acceptable
    answerText: "The completed check shows prediction 176 m3/day; measurements 170 m3/day and 18% leakage pass."
    why: "Verify methane capture connects the measured environmental mechanism to the next island condition."
    # wrong-path feedback, one rebuttal per wrong option:
    #   The retry identifies the first incorrect mechanism, unit, unsupported claim, omitted requirement, or violated constraint.
    # correct result: Prediction 176 m3/day; measurements 170 m3/day and 18% leakage pass
    # state/output: Keep the result visible, record it in the mission log, and unlock the next authored stop.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   verify:{required_sequence:[calculate_commit,operate,measure,interpret],operate_unlocked_when:prediction_committed,prediction:{equation:"recoverable=gas_volume*methane_fraction*collection_efficiency",inputs:{gas_volume:400,methane_fraction:0.55,collection_efficiency:0.80},unit:"m3 CH4/day",truth:176,tolerance:17.6},operate:{control:collector_vacuum,setting_pct:60,fixed:[waste_mass,moisture,elapsed_time]},measure:{captured_m3_day:170,leaked_pct:18},interpret:{correct:accept,criteria:["capture within 10% of 176","leakage <=20%"]},restore:{required:true,setting:baseline,remeasure:true}}


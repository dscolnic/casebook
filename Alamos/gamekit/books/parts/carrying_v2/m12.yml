  worked:
    label: "Worked examples"
    title: "Mission 12: worked examples"
    examples:
    - {"title":"Two half-lives","problem":"A substance has initial mass 80 g and half-life 3 years. Find the remaining mass after 6 years.","rule":"Remaining mass=M0(1/2)^(time/half-life).","steps":["Set up the relationship: Remaining mass=M0(1/2)^(time/half-life).","M=80(1/2)^(6/3)=80/4=20 g."],"answer":"Twenty grams remain after two half-lives.","mistake":"Each half-life halves the remaining amount, not the original amount again."}
    - {"title":"Use a stated warming factor","problem":"For this exercise, a gas has warming factor 20 kg CO2-equivalent per kg over a specified time horizon. Find the equivalent of 3 kg.","rule":"CO2-equivalent mass=gas mass×the stated horizon-specific factor.","steps":["Set up the relationship: CO2-equivalent mass=gas mass×the stated horizon-specific factor.","equivalent=3(20)=60 kg CO2-equivalent."],"answer":"The equivalent is 60 kg for the supplied factor and horizon.","mistake":"The factor must have a stated time horizon; it is not a universal timeless value."}
    - {"title":"Capacity is not dependable supply","problem":"A solar array has a 10 kW peak rating. A device needs 2 kW throughout the night. Does the rating alone establish supply?","rule":"Peak power does not specify availability over every required hour.","steps":["At night the array may provide no direct output.","Storage or another source must supply the full nighttime energy and power demand."],"answer":"The peak rating alone does not establish continuous supply.","mistake":"Do not substitute maximum output for a time-resolved supply plan."}
    - {"title":"Energy from power","problem":"A device runs at 2 kW for 5 hours. Find energy use.","rule":"Energy=power×time.","steps":["Set up the relationship: Energy=power×time.","E=2 kW×5 h=10 kWh."],"answer":"The device uses 10 kilowatt-hours.","mistake":"Kilowatts and kilowatt-hours measure different quantities."}
    - {"title":"Emissions from activity","problem":"An activity uses 100 fuel units with an emission factor of 2 kg per fuel unit. Find emissions.","rule":"Emissions=activity×emission factor.","steps":["Set up the relationship: Emissions=activity×emission factor.","emissions=100(2)=200 kg."],"answer":"Total emissions are 200 kg for the stated factor and boundary.","mistake":"A rate per fuel unit must be multiplied by fuel use."}


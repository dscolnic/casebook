      - { id: current_ferry_visitors, label: Current-ferry visitors, value: 2720, unit: person-days }
      - { id: second_ferry_visitors, label: Second-ferry visitors, value: 2720, unit: person-days, hidden: true }
      - { id: crew_already_in_resident_count, label: Ferry crew, value: 248, unit: person-days, countable: false,
          unitNote: "The crew live on the island and are already inside the resident count." }
      commit: Report the demand

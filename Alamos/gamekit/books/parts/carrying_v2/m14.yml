    format: BALANCE
    question: "Apply person-days=people*days using 255 residents*31 days, 340 visitors/day*8 current sailing days, and another 2720 visitor-days for the second ferry; submit total"
    relationship: "demand = resident person-days + current-ferry visitor person-days + second-ferry visitor person-days"
    # THE BIBLE'S PAYLOAD, converted. Its `correct: 13345` is the ledger's total

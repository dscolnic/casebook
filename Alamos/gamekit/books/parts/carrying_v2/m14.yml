    at: council-table
    title: "Close the person-day balance"
    concept: 22   # person-days | closed budgets | 14
    reason: "A declining resident count does not establish July demand once ferry visitors are included."
    scene: "Residents are declining, but ferry visitors can still raise seasonal demand. Convert everyone into person-days, and the team needs this result before it acts, and this result will guide the next safe decision."
    motivation: "Total person-days places residents and short-stay visitors on the same seasonal water-and-waste demand scale."
    format: BALANCE
    question: "Apply person-days=people*days using 250 residents × 30 days, 300 visitors/day × 8 current sailing days, and another 2,400 visitor-days for the second ferry; submit total"
    relationship: "demand = resident person-days + current-ferry visitor person-days + second-ferry visitor person-days"
    # THE BIBLE'S PAYLOAD, converted. Its `correct: 13345` is the ledger's total
    # and each stream keeps the bible's value; the ferry crew keeps `counts:

  # --- Stop 54: Calculate population growth
  #     Concept: population growth | populations | 14; Keystone: population growth | populations | 14; Area: Reef Station; Learning role: PRACTICE; Difficulty: L3; Story role: population growth | populations | 14.
  #     placement: BALLPARK, at register-desk.
  - group: REEF
    at: register-desk
    title: "Calculate population growth"
    concept: 10   # population growth | populations | 14
    reason: "The age pattern needs confirmation from births and deaths before a growth forecast is used."
    scene: "The population ledger records more deaths than births. The team checks the sign before applying a growth shortcut."
    motivation: "Natural population growth determines whether projecting a future doubling is meaningful for the island."
    format: BALLPARK
    question: "In one year a population of 300 has 3 births and 6 deaths, with no migration. Fill births,deaths,population in (births−deaths)/population×100."
    # THE BIBLE'S PAYLOAD, converted. Its three `inputs` become the three tiles
    # and its `equation` the template; `truth: -1.18` is the target and its
    # `tolerance: 0.02` is already an absolute band on a percentage.
    estimate:
      prompt: The register holds one year of births and deaths against the resident count.
      question: Estimate the island's population growth rate as a percentage a year.
      relationship: population growth rate = (births - deaths) ÷ population × 100
      labels:
      - 3  (births last year)
      - 6  (deaths last year)
      - 255  (island residents)
      values: [3, 6, 255]
      slots: 3
      template: '({0} - {1}) ÷ {2} × 100'
      formula: (a-b)/c*100
      correct: [0, 1, 2]
      target: -1.18
      tolerance: 0.02
      units: percent/year
      solution: (3 - 6) ÷ 255 × 100 = -1.18 per cent a year.
      explanation: More deaths than births makes the rate negative, and a negative rate has no doubling time — the island is halving, slowly.
    answerText: "The completed check shows growth is -1.0%/year; a doubling time is not meaningful."
    why: "Calculate population growth connects the measured environmental mechanism to the next island condition."
    # wrong-path feedback, one rebuttal per wrong option:
    #   The retry identifies the first incorrect mechanism, unit, unsupported claim, omitted requirement, or violated constraint.
    # correct result: Growth is -1.18%/year; a doubling time is not meaningful
    # state/output: Keep the result visible, record it in the mission log, and unlock the next authored stop.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   estimate:{equation:"(3-6)/255*100",inputs:{births:3,deaths:6,population:255},truth:-1.18,unit:"percent/year",tolerance:0.02,interpretation:"halving, not doubling"}

  # --- Stop 55: Close the person-day balance
  #     Concept: person-days | closed budgets | 14; Keystone: person-days | closed budgets | 14; Area: Chapel Council Room; Learning role: PRACTICE; Difficulty: L3; Story role: person-days | closed budgets | 14.
  #     placement: BALANCE, at council-table.
  - group: CHAPEL
    at: council-table
    title: "Close the person-day balance"
    concept: 22   # person-days | closed budgets | 14
    reason: "A declining resident count does not establish July demand once ferry visitors are included."
    scene: "Residents are declining, but ferry visitors can still raise seasonal demand. Convert everyone into person-days."
    motivation: "Total person-days places residents and short-stay visitors on the same seasonal water-and-waste demand scale."
    format: BALANCE
    question: "Apply person-days=people*days using 250 residents × 30 days, 300 visitors/day × 8 current sailing days, and another 2,400 visitor-days for the second ferry; submit total"
    relationship: "demand = resident person-days + current-ferry visitor person-days + second-ferry visitor person-days"
    # THE BIBLE'S PAYLOAD, converted. Its `correct: 13345` is the ledger's total
    # and each stream keeps the bible's value; the ferry crew keeps `counts:
    # false` as `countable: false` with its `reason` in `unitNote`. `hidden` marks
    # the second sailing's visitor-days, the term this whole stop exists to add:
    # without it the rows already on the board total 10,625 person-days.
    balance:
      total: { amount: 13345, unit: person-days, label: August demand on island services }
      tolerance: 1
      streams:
      - { id: residents, label: Residents, value: 7905, unit: person-days }
      - { id: current_ferry_visitors, label: Current-ferry visitors, value: 2720, unit: person-days }
      - { id: second_ferry_visitors, label: Second-ferry visitors, value: 2720, unit: person-days, hidden: true }
      - { id: crew_already_in_resident_count, label: Ferry crew, value: 248, unit: person-days, countable: false,
          unitNote: "The crew live on the island and are already inside the resident count." }
      commit: Report the demand
    answerText: "The completed check shows the second-ferry July case is 12,300 person-days."
    why: "Close the person-day balance connects the measured environmental mechanism to the next island condition."
    # wrong-path feedback, one rebuttal per wrong option:
    #   The retry identifies the first incorrect mechanism, unit, unsupported claim, omitted requirement, or violated constraint.
    # correct result: The second-ferry July case is 13,345 person-days
    # state/output: Keep the result visible, record it in the mission log, and unlock the next authored stop.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   balance:{streams:[{id:"residents",value:7905,unit:"person-days",counts:true},{id:"current_ferry_visitors",value:2720,unit:"person-days",counts:true},{id:"second_ferry_visitors",value:2720,unit:"person-days",counts:true},{id:"crew_already_in_resident_count",value:248,unit:"person-days",counts:false,reason:"duplicate population"}],equation:"255×31+340×8+2720",correct:13345,tolerance:1,answerText:"Demand is 13,345 person-days; ferry crew already counted as residents must not be added again."}


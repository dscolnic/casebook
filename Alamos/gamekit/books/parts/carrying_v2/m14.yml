    - {"title":"Percent population growth","problem":"A population of 1000 gains 40 individuals net during a year. Find its annual percent growth.","rule":"Growth percent=net change/starting population×100%.","steps":["Set up the relationship: Growth percent=net change/starting population×100%.","growth=40/1000×100%=4%."],"answer":"The population grew by 4% during the year.","mistake":"Use the starting population as the denominator."}
    - {"title":"Approximate doubling time","problem":"A population grows at 2% per year. Estimate doubling time with the rule of 70.","rule":"Approximate doubling time=70/(percent annual growth rate).","steps":["Set up the relationship: Approximate doubling time=70/(percent annual growth rate).","doubling time≈70/2=35 years."],"answer":"The estimated doubling time is 35 years at sustained growth.","mistake":"Use 2, not 0.02, in this percent-form rule."}
    - {"title":"Population momentum","problem":"Fertility falls to replacement level, but many young people are about to enter reproductive ages. Must population stop growing immediately?","rule":"Population change also depends on age structure and the number entering reproductive ages.","steps":["A large young cohort can produce many births even with fewer births per person.","Deaths may remain fewer than births for a time."],"answer":"Population can continue growing through demographic momentum.","mistake":"Replacement fertility does not imply immediate zero population growth."}
    - {"title":"Combine resident and visitor demand","problem":"There are 100 residents for 10 days and 20 visitors for 5 days, each using 2 resource units per person-day. Find total use.","rule":"Total use=sum of people×days×per-person daily use.","steps":["Set up the relationship: Total use=sum of people×days×per-person daily use.","use=100(10)(2)+20(5)(2)=2000+200=2200 units."],"answer":"Total demand is 2200 units over the specified stays.","mistake":"A visitor count without length of stay does not determine cumulative demand."}


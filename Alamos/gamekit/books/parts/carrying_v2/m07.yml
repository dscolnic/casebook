  # --- Stop 27: Close the water balance
  #     Concept: pipe loss | closed budgets | D2 | RETRIEVE | L2 | reveal; Keystone: pipe loss | closed budgets | D2 | RETRIEVE | L2 | reveal; Area: Chapel Council Room; Learning role: PRACTICE; Difficulty: L3; Story role: pipe loss | closed budgets | D2 | RETRIEVE | L2 | reveal.
  #     placement: BALANCE, at pipe-balance.
  - group: CHAPEL
    at: pipe-balance
    title: "Close the water balance"
    concept: 1   # pipe loss | closed budgets | D2 | RETRIEVE | L2 | reveal
    reason: "The contamination pathway is understood, but the waterworks still cannot account for its delivered volume."
    scene: "The tip pathway is real, but Waterworks reports a larger daily loss. Close the distribution ledger to calculate water that never reaches a billed tap."
    motivation: "The unmetered water loss quantifies how much supply disappears before reaching billed taps."
    format: BALANCE
    question: "Use unmetered loss=plant output-households-businesses-ferry-tank increase with 410, 285, 55, 12, and 8 m3/day; submit one loss in m3/day"
    relationship: "unmetered loss = plant output - households - businesses - ferry - tank increase"
    # THE BIBLE'S PAYLOAD, converted. `direction: in|out|storage` becomes the sign
    # on `value` and the bible's `correct: 50` is the ledger's `total`. The
    # duplicate billing display carries `counts: false` into `countable: false`,
    # with its `reason` in `unitNote` so it is only read once the row is opened.
    # `hidden` marks the tank increase, the storage term nothing on the board
    # announces: without it the obvious rows total 58, outside the 1 m3/day band.
    balance:
      total: { amount: 50, unit: m3/day, label: Water that never reaches a billed tap }
      tolerance: 1
      streams:
      - { id: plant_output, label: Plant output, value: 410, unit: m3/day }
      - { id: households, label: Household metered use, value: -285, unit: m3/day }
      - { id: businesses, label: Business metered use, value: -55, unit: m3/day }
      - { id: ferry, label: Ferry berth draw, value: -12, unit: m3/day }
      - { id: tank_increase, label: Storage tank increase, value: -8, unit: m3/day, hidden: true }
      - { id: duplicate_billing_display, label: Billing display total, value: 55, unit: m3/day, countable: false,
          unitNote: "A duplicate of the business meter rather than a second physical stream." }
      commit: Report the unmetered loss
    answerText: "The completed check shows the unmetered loss is 50 m3/day."
    why: "Close the water balance connects the measured environmental mechanism to the next island condition."

          bin: left
        - name: biomass stores heat
          bin: left
        - name: water stores heat
          bin: left
        - name: nitrate
          bin: left
        - name: phosphate
          bin: left
        - name: oxygen
          bin: left
        - name: ammonium
          bin: left
        - name: groundwater
          bin: left
        - name: calcium
          bin: left
        - name: sulfur
          bin: left
        - name: potassium
          bin: left
        - name: sunlight
          bin: right
        - name: heat
          bin: right
        - name: wind work
          bin: right
        - name: chemical energy transfer
          bin: right
        - name: radiant energy
          bin: right
        - name: motion heat
          bin: right
        - name: turbine work
          bin: right
        - name: metabolic heat
          bin: right
        - name: wave energy
          bin: right
        - name: frictional heat
          bin: right
        - name: electrical work
          bin: right

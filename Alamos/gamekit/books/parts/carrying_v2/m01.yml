  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 1: worked examples"
    examples:
    - {"title":"Balance a resource stock","problem":"A generic pond starts with 100 m³ of water, receives 30 m³, and loses 20 m³ during one day. Find the ending stock.","rule":"Ending stock=starting stock+inputs-outputs.","steps":["Set up the relationship: Ending stock=starting stock+inputs-outputs.","V_end=100+30-20=110 m³."],"answer":"The pond ends with 110 m³, a net increase of 10 m³.","mistake":"Do not confuse the ending stock with the net change."}
    - {"title":"Concentration and pollutant load","problem":"A stream flows at 10 L/s with pollutant concentration 2 mg/L. Find pollutant load.","rule":"Mass load=volume flow×concentration.","steps":["Set up the relationship: Mass load=volume flow×concentration.","load=10 L/s×2 mg/L=20 mg/s."],"answer":"The stream carries 20 mg of pollutant each second.","mistake":"Concentration alone does not state total pollutant transport."}
    - {"title":"Choose a system boundary","problem":"A garden takes up compost made from its own leaves. Is that compost an external nutrient input if the system includes both garden and compost bin?","rule":"Inputs cross the chosen system boundary; recycling within it is an internal transfer.","steps":["Leaves move from garden to bin inside the boundary.","Compost returns from bin to garden without crossing that boundary."],"answer":"This is internal nutrient recycling, not a new external input.","mistake":"Counting both transfers as new inputs would double-count nutrients."}
    - {"title":"Express a loss fraction","problem":"A tank receives 200 L and delivers 180 L, with no stock change. Find the unaccounted loss percentage.","rule":"Loss=input-output; loss fraction=loss/input.","steps":["Set up the relationship: Loss=input-output; loss fraction=loss/input.","loss=200-180=20 L; fraction=20/200=0.10=10%."],"answer":"Ten percent of the input is unaccounted for under the stated balance.","mistake":"Use the input as the reference for input-loss percentage."}
    - {"title":"Rainfall volume","problem":"Rain falls 10 mm deep over 100 m². Find its volume before losses.","rule":"Volume=rain depth×area; 10 mm=0.010 m.","steps":["Set up the relationship: Volume=rain depth×area; 10 mm=0.010 m.","V=0.010(100)=1 m³=1000 L."],"answer":"The rainfall supplies 1 cubic metre over that area.","mistake":"Millimetres must be converted before multiplying by square metres."}

  stops:
  # --- Stop 1: Draw the boundary
  #     Concept: system boundary; Keystone: closed budgets; Area: Chapel Council Room; Learning role: INTRODUCE; Difficulty: L1; Story role: obstacle.
  #     placement: CHOICE, asked by Tomas Reed beside landings-book.
  - group: CHAPEL
    at: landings-book
    title: "Draw the boundary"
    person: reed
    concept: 1   # system boundary
    reason: "The second sailing is being judged from a sales ledger that leaves out essential island resources."
    scene: "The electronic ledger counts ferry tickets, fuel, and landed fish but ignores rain, groundwater, sunlight, and waste. Choose the boundary that captures every resource the second sailing can change."
    motivation: "The boundary determines whether ferry approval accounts for groundwater, coastal ecosystems, waste, and imported supplies as well as sales."
    format: CHOICE
    question: "Select the one boundary that captures every resource and receiving system the second ferry can change. Submit one selection."
    choices:
    - "Ferry accounts only."
    - "Council spending only."
    - "Whole island, aquifer, coast, reef, and atmosphere exchanges."
    - "Resident households only."
    answer: "Whole island, aquifer, coast, reef, and atmosphere exchanges."
    answerText: "The completed check shows c. Count the whole island, aquifer, coast, reef, atmosphere exchanges, imports, and exports."
    why: "System boundaries must include every materially affected store; retry after the omitted-store labels flash."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (1)
    # correct result: C. Count the whole island, aquifer, coast, reef, atmosphere exchanges, imports, and exports.
    # state/output: Island boundary illuminates; unlocks Stop 1.2.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   choice:{choices:[{id:ferry_accounts,label:"Ferry accounts only"},{id:council_spending,label:"Council spending only"},{id:whole_system,label:"Whole island, aquifer, coast, reef, and atmosphere exchanges"},{id:households,label:"Resident households only"}],answer:whole_system,rebuttals:{ferry_accounts:"Tickets and cargo omit local water, habitat, energy, and waste stores.",council_spending:"Money can move without showing whether matter or energy is depleted.",households:"This excludes visitors, businesses, the fishery, receiving waters, and the reef."}}.

  # --- Stop 2: Match the cycles
  #     Concept: carbon/nitrogen/phosphorus/water cycles; Keystone: closed budgets; Area: Waterworks; Learning role: INTRODUCE; Difficulty: L2; Story role: clue.
  #     placement: PROTOCOL, at landings-book.
  - group: WATER
    at: landings-book
    title: "Match the cycles"
    concept: 5   # carbon/nitrogen/phosphorus/water cycles
    reason: "The expanded island boundary leaves four material pathways needing identification."
    scene: "With the boundary fixed, four unlabeled flow cards remain in the paper book. Match each pathway to the cycle it represents so later investigators follow matter rather than labels."
    motivation: "The cycle matches tell investigators where each material can enter, accumulate, and leave the island ledger."
    format: PROTOCOL
    question: "Draw one line from each pathway to its cycle, then submit the complete mapping."
    # THE BIBLE'S PAYLOAD, converted. `scenarios` are the bible's four pathways,
    # `choices` its four cycles, and `mapping` its 1:carbon 2:nitrogen
    # 3:phosphorus 4:water as zero-based indices into `choices`.
    columns: [Pathway, Cycle]
    scenarios:
    - "Photosynthesis, respiration, combustion"
    - "Nitrogen fixation, nitrification, denitrification"
    - "Rock weathering, biota, sediment"
    - "Evaporation, precipitation, runoff"
    choices:
    - "Carbon"
    - "Nitrogen"
    - "Phosphorus"
    - "Water"
    mapping: [0, 1, 2, 3]
    answerText: "The completed check shows carbon, nitrogen, phosphorus, water in that order; nitrogen fixation and phosphorus weathering are important limiting steps."
    why: "Matter changes form but remains in its cycle; feedback identifies the first mismatched process."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A carbon match that omits combustion, a nitrogen match that omits denitrification, or a phosphorus match that adds an atmospheric gas phase assigns a pathway to the wrong cycle.
    # correct result: Carbon, nitrogen, phosphorus, water in that order; nitrogen fixation and phosphorus weathering are important limiting steps.
    # state/output: Four cycle routes light; unlocks Stop 1.3.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   scenarios={photosynthesis-respiration-combustion; N2-fixation-nitrification-denitrification; rock-weathering-biota-sediment; evaporation-precipitation-runoff}; choices={carbon,nitrogen,phosphorus,water}; mapping={1:carbon,2:nitrogen,3:phosphorus,4:water}.

  # --- Stop 3: Separate matter from energy
  #     Concept: energy flow versus matter cycling; Keystone: energy flow; Area: Turbine Yard; Learning role: PRACTICE; Difficulty: L2; Story role: clue.
  #     placement: BELT, at fee-desk.
  - group: POWER
    at: fee-desk
    title: "Separate matter from energy"
    concept: 3   # energy flow versus matter cycling
    reason: "The material pathways are mapped, but the grazing plan still risks counting energy as a recyclable resource."
    scene: "Because the four matter ledgers now close, the remaining cards can expose a dangerous accounting mistake. Sort each item as matter that cycles or energy that flows and disperses as heat."
    motivation: "Separating energy flow from matter cycling prevents the food budget from reusing energy already dispersed as heat."
    format: BELT
    question: "Sort sunlight, heat, carbon dioxide, nitrate, phosphate, and water. Submit the binary classification before the belt reaches the end."
    answerText: "The completed check shows sunlight and heat flow; carbon dioxide, nitrate, phosphate, and water cycle."
    why: "Energy degrades to heat; atoms remain available in other forms. Wrong items pause with a pathway hint."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Placing sunlight or heat in cycles ignores energy degradation; placing carbon dioxide, nitrate, phosphate, or water in flows ignores conservation of matter.
    # correct result: Sunlight and heat flow; carbon dioxide, nitrate, phosphate, and water cycle.
    # state/output: Energy arrow exits map; matter loops persist; rejected-catch column unlocks.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   belt.categories={cycles,flows}; items={sunlight:flows,heat:flows,CO2:cycles,nitrate:cycles,phosphate:cycles,water:cycles}; speed=moderate; misses_allowed=2.
    belt:
      left:
        name: Matter cycles
      right:
        name: Energy flows
      items:
        - name: CO2 traps heat
          bin: left
        - name: soil stores heat
          bin: left
        - name: biomass stores heat
          bin: left
        - name: water stores heat
          bin: left
        - name: nitrate
          bin: left
        - name: phosphate
          bin: left
        - name: oxygen
          bin: left
        - name: ammonium
          bin: left
        - name: groundwater
          bin: left
        - name: calcium
          bin: left
        - name: sulfur
          bin: left
        - name: potassium
          bin: left
        - name: sunlight
          bin: right
        - name: heat
          bin: right
        - name: wind work
          bin: right
        - name: chemical energy transfer
          bin: right
        - name: radiant energy
          bin: right
        - name: motion heat
          bin: right
        - name: turbine work
          bin: right
        - name: metabolic heat
          bin: right
        - name: wave energy
          bin: right
        - name: frictional heat
          bin: right
        - name: electrical work
          bin: right
        - name: infrared radiation
          bin: right
      need: 20
      lives: 2

  # --- Stop 4: Find the shared omission
  #     Concept: dependent evidence; Keystone: uncertainty/evidence; Area: Chapel Council Room; Learning role: COMBINE; Difficulty: L4; Story role: reveal.
  #     placement: TRACE, at landings-book.
  - group: CHAPEL
    at: landings-book
    title: "Find the shared omission"
    concept: 34   # dependent evidence
    reason: "The revised ledger needs an independent catch check before agreement between sales and tax is trusted."
    scene: "The cycle map shows where matter should go, yet the sales screen and tax total agree exactly. Trace their upstream records and test whether agreement proves that all catch was counted."
    motivation: "The record dependencies determine whether matching totals confirm the catch or merely repeat the same omission."
    format: TRACE
    question: "Open all four channels, identify the shared upstream record, and submit one conclusion about independence."
    answerText: "The completed check shows sales and tax share the electronic sale record; only the paper book preserves rejected catch."
    why: "Repeated outputs from one source are one line of evidence, not two; retry traces dependencies."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Treating sales and tax totals as independent double-counts their shared electronic-sale source; ignoring either paper channel discards the independent evidence.
    # correct result: Sales and tax share the electronic sale record; only the paper book preserves rejected catch.
    # state/output: "Rejected catch missing" tag persists; Day 5 payoff; delivery piece 1 posts.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   trace:{channels:[{id:"sales_screen",label:"sales screen",dependency:"electronic sale ledger",target_dependent:true},{id:"tax_total",label:"tax total",dependency:"electronic sale ledger",target_dependent:true},{id:"paper_landed",label:"paper landing book",dependency:"paper book",independent:true},{id:"returned_catch",label:"returned-catch record",dependency:"paper book",independent:true}],shared_upstream:"electronic sale ledger",correct_conclusion:"sales and tax agree but are not independent",answerText:"Sales and tax totals share one source; the two paper channels expose catch the shared electronic ledger omitted."}
    trace:
      channels:
        - id: sales_screen
          label: Electronic sales screen
          reading: 1,240 kg accepted catch
          depends:
            - electronic_sale_ledger
        - id: tax_total
          label: Tax total
          reading: 1,240 kg taxable catch
          depends:
            - electronic_sale_ledger
        - id: paper_landed
          label: Paper landing book
          reading: 1,240 kg accepted plus 85 kg rejected catch
          depends:
            - paper_book
        - id: returned_catch
          label: Returned-catch record
          reading: 85 kg rejected catch
          depends:
            - paper_book
      resources:
        - id: electronic_sale_ledger
          label: electronic_sale_ledger
        - id: paper_book
          label: paper_book
      independent:
        - paper_landed
        - returned_catch
      target: electronic_sale_ledger


  # --- Stop 4: Find the shared omission
  #     Concept: dependent evidence; Keystone: uncertainty/evidence; Area: Chapel Council Room; Learning role: COMBINE; Difficulty: L4; Story role: reveal.
  #     placement: TRACE, at landings-book.
  - group: CHAPEL
    at: landings-book
    title: "Find the shared omission"
    concept: 34   # dependent evidence
    reason: "The revised ledger needs an independent catch check before agreement between sales and tax is trusted."
    scene: "The cycle map shows where matter should go, yet the sales screen and tax total agree exactly. Trace their upstream records and test whether agreement proves that all catch was counted."
    motivation: "The record dependencies determine whether matching totals confirm the catch or merely repeat the same omission."
    format: TRACE
    question: "Open all four channels, identify the shared upstream record, and submit one conclusion about independence."
    answerText: "The completed check shows sales and tax share the electronic sale record; only the paper book preserves rejected catch."
    why: "Repeated outputs from one source are one line of evidence, not two; retry traces dependencies."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Treating sales and tax totals as independent double-counts their shared electronic-sale source; ignoring either paper channel discards the independent evidence.
    # correct result: Sales and tax share the electronic sale record; only the paper book preserves rejected catch.
    # state/output: "Rejected catch missing" tag persists; Day 5 payoff; delivery piece 1 posts.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   trace:{channels:[{id:"sales_screen",label:"sales screen",dependency:"electronic sale ledger",target_dependent:true},{id:"tax_total",label:"tax total",dependency:"electronic sale ledger",target_dependent:true},{id:"paper_landed",label:"paper landing book",dependency:"paper book",independent:true},{id:"returned_catch",label:"returned-catch record",dependency:"paper book",independent:true}],shared_upstream:"electronic sale ledger",correct_conclusion:"sales and tax agree but are not independent",answerText:"Sales and tax totals share one source; the two paper channels expose catch the shared electronic ledger omitted."}
    trace:
      channels:
        - id: sales_screen
          label: Electronic sales screen
          reading: 1,240 kg accepted catch
          depends:
            - electronic_sale_ledger
        - id: tax_total
          label: Tax total
          reading: 1,240 kg taxable catch
          depends:
            - electronic_sale_ledger
        - id: paper_landed
          label: Paper landing book
          reading: 1,240 kg accepted plus 85 kg rejected catch
          depends:
            - paper_book
        - id: returned_catch
          label: Returned-catch record
          reading: 85 kg rejected catch
          depends:
            - paper_book
      resources:
        - id: electronic_sale_ledger
          label: electronic_sale_ledger
        - id: paper_book
          label: paper_book
      independent:
        - paper_landed
        - returned_catch
      target: electronic_sale_ledger


- title: What fell, and what arrived
  objective: Add up a rate that only exists as readings, and say which way each way of adding it is wrong.
  briefing: Six hours of rising gauges, no formula, and a release decision waiting on the total.
  stake: >-
    Wednesday. Rain hammered the catchment overnight. The gauges give you only a column of readings, but the control
    room needs one defensible volume before it decides how much water to send toward Nethercote Ford.
  takeaway: A rate known only at instants still accumulates, and every rule for adding it is wrong in a 
    direction you can name.
  segue: >-
    The two endpoint sums bracket the overnight total, and the integrated ramp gives Berg's old proposal a number:
    about 72 cubic metres a second. By dawn the new plan is much larger. Eleven villages go on the warning list,
    and Nethercote Ford has four hours before the first water arrives.
  stops:
  - group: GATES
    task: Trace where the old storage survey enters the chain
    title: Where the old map enters the water path
    at: discharge-board
    reason: >-
      Wilkes's gate setting was computed through a chain of relations. Berg wants the team to mark the exact link
      that depends on the 2003 reservoir survey before that old map can quietly contaminate the rest of the calculation.
    concept: The chain rule and composite quantities
    place: Gate Chamber
    scene: >-
      Berg, the flood engineer, writes the path on the board: rain, runoff, inflow, stored volume, reservoir level, head over the crest,
      spillway discharge. One link uses the reservoir's surface-area curve measured in 2003. Find the order, then
      identify that survey-dependent link.
    guide: >-
      Put the relations in the order information actually travels. Every derivative in the chain has different units,
      so their raw numerical sizes cannot be ranked as though the smallest one 'controls' the physics. The operational
      question is narrower and defensible: which transfer uses the old area curve? It is storage to level, through
      dV/dh = A(h), or equivalently dh/dV = 1/A(h).
    background:
    - >-
      Why the whole path is a product. Each step is a relation with its own gain. How much rain becomes
      runoff. How much runoff arrives as inflow. How much inflow becomes stored volume. How volume becomes
      level. How level becomes head. Multiply the gains and you have how a millimetre of rain becomes a
      cubic metre a second at the sill.
    - >-
      What 'governing' means. Not the biggest term — the one whose value the answer
      is most limited by. A step that passes on nearly everything is not deciding
      anything, however large the numbers flowing through it. A step that throttles
      the rate sets what everything downstream can be.
    - >-
      Why the morning's settings went wrong. A gate schedule is written from an assumed path. One step's
      gain may have been assumed and be actually different. The catchment may be wetter than modelled. The
      level-to-head relation may be off by the sill's own geometry. Then every setting downstream of it
      inherits the error. That is what the board is for.
    assumes:
    - a related-rates calculation follows every functional relation between the starting and ending quantities
    - the reservoir surface area A(h) is the derivative dV/dh of storage with respect to level
    takeaway: In a related-rates chain, trace dependencies rather than comparing unlike derivative magnitudes;
      here the old survey enters at storage-to-level.
    format: CHAIN
    question: >-
      Put the transfers in the order the rate travels, then name the one that decides how much of
      it reaches the sill.
    chain:
      hint: >-
        Every relation on the path contributes a factor. A path with a step missing is not a path.
      links:
      - {id: runoff, label: Rainfall to catchment runoff, transfers: 'millimetres on the hills into cubic metres
          a second at the gauge'}
      - {id: inflow, label: Runoff to reservoir inflow, transfers: 'flow at the gauge into flow arriving at the
          dam'}
      - {id: storage, label: Net inflow to storage, transfers: 'a flow difference into a volume accumulating'}
      - {id: level, label: Storage to level, transfers: 'volume into height, divided by the surface area'}
      - {id: head, label: Level to head over the sill, transfers: 'reservoir height into height above the crest'}
      - {id: discharge, label: Head to spillway discharge, transfers: 'head into flow, through the three-halves
          power'}
      order: [runoff, inflow, storage, level, head, discharge]
      governing: level
      distractor: discharge
      commit: Name the survey-dependent transfer
    answerText: >-
      Rain, runoff, inflow, storage, level, head, discharge — and the 2003 survey enters when stored volume is converted
      to level through A(h).
    why: >-
      The chain rule multiplies local derivatives only after the variables and their units are connected correctly.
      A derivative measured in metres per cubic metre cannot be called 'more limiting' just because its numerical
      value is smaller than another derivative with different units. What matters here is dependency. The old survey
      supplies A(h), the surface area used in dV/dh = A(h). That makes storage-to-level the link the resurvey can
      change, and every later result that uses a forecast level inherits that change.
  - group: STRUCT
    task: Say which way a sum of readings is wrong
    title: Which end of the interval you believed
    reason: >-
      Dr. Halina Zawadzka has two totals off the same weir readings and will not
      sign either until she knows which end of the interval is lying to her.
    concept: Riemann sums, left and right endpoints, and the trapezoid rule
    place: Seepage & Uplift Bay
    scene: >
      Dr. Halina Zawadzka, the structural engineer, has hourly weir readings that climbed all shift, and two totals
      on the board from
      the same column of numbers. One used each hour's opening reading, the other its closing
      one, and they differ by a tenth.
    guide: >-
      The four answers differ in how confident they are willing to be. Two rank the
      totals against the truth, one refuses to rank them, one calls a total correct.
      What settles it is a fact already on the board: the seepage rose all shift.
      Ask what a rectangle built on a rising hour's first reading must do, and what
      one built on its last must do. Two totals that bracket the truth are worth
      more than one that is nearly right.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to be the answer under
      one specific misreading. A step skipped. A quantity confused with a rate. A correlation taken for a
      cause. Identifying which misreading each belongs to is where the learning is; the right answer alone
      can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the
      qualifying clause and the unit. So across a whole game the key used to be the longest option far more often
      than chance. That was 88 per
      cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so
      length, hedging and specificity have had the signal taken out of them
      deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the
      verdict prints them — the reason that option fails, not a restatement of the
      right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason
      is
      indistinguishable from a sound one. That stays true until the day the approximation is
      what is being tested.
    assumes:
    - a rate multiplied by an interval gives the accumulation over that interval only if the rate is constant
    - a sum of rectangles approximates the area under a curve
    takeaway: For a rate that only rises, a left-endpoint sum is always short and a right-endpoint sum always 
      long, and the truth is between them.
    format: CHOICE
    question: What can be said about the two totals without any further readings?
    choices:
    - The opening-reading total is short and the closing-reading total is long
    - Both are short, because rectangles cannot cover a rising curve
    - Neither can be ranked until the readings are taken more often
    - The closing-reading total is correct, since it uses the most recent value in each hour
    answer: The opening-reading total is short and the closing-reading total is long
    why: >
      Each rectangle is one hour wide and as tall as the reading it was built from. On an
      hour where the seepage only rises, the opening reading is the lowest value the rate
      took. That rectangle sits entirely under the curve. The closing reading is the
      highest, so its rectangle sits entirely over it. The rise is the whole argument, and
      it brackets the answer with no further measurement. That is worth more than either
      total, because it turns two disagreeing numbers into an interval the truth has to lie
      in.
    rebuttals:
    - Rectangles built on the closing reading of a rising hour stand above the curve, not below it.
    - More frequent readings narrow the gap between the two, but the ranking is already fixed by the rise.
    - The closing reading is the highest value in its hour, so using it for the whole hour overstates every 
      hour.
  - group: SAFE
    task: Derive the steady release with the same total
    title: The release she would have made
    at: arrival-map
    reason: >-
      Sunniva Berg wants the flat release she asked for on Monday sitting next to
      today's number, because that comparison is her whole argument.
    concept: Antiderivatives, and the constant an integration cannot recover
    place: Downstream Warning Desk
    scene: >
      Berg has this afternoon's schedule as Q(t) = 48 + 8t cubic metres a second, running 6
      hours. She wants the flat release with the same total, to set beside the one she asked for
      on the first day.
    guide: >-
      Build it a line at a time. The steady flow with the same total is the ramp's average over the six
      hours. One way to get it survives a schedule that is not a straight line. Integrate the ramp and
      divide by the interval. Finish with a flow in cubic metres a second, so it can be set beside the one
      she asked for on day one.
    background:
    - >-
      What a mean value of a function is. The average of Q over an interval is the integral of Q across
      it, divided by the length of the interval. That is the height of the rectangle with the same area as
      the curve. For a straight ramp that is the midpoint value, which is why this one can be checked in
      your head after the working is done.
    - >-
      Why the equivalence is worth writing down. A ramp and a flat release with the same total deliver the
      same water. They do very different things to the channel below. One arrives gently and ends high.
      The other is constant. Being able to state the flat equivalent is how two schedules get compared on
      anything other than their shape.
    - >-
      What day one was about. The release Berg asked for on the first day was chosen without this
      arithmetic. Setting the equivalent flat flow beside it settles one question. Does the schedule that
      has been argued about all fortnight actually differ in the water it moves? Or only in how it moves
      it?
    assumes:
    - a definite integral is evaluated as the difference of an antiderivative at the two ends
    - an average value is an accumulation divided by the length of its interval
    takeaway: Reducing a schedule to one steady rate is integrating it and dividing, and the two ends only 
      average correctly because the schedule is a straight line.
    format: DERIVE
    question: >-
      Derive the steady flow that delivers the same six-hour total as the ramp.
    derive:
      hint: >-
        Integrate first, then divide. Name the move each line makes.
      start: 'Q(t) = 48 + 8t'
      startNote: 'cubic metres a second, t in hours from the start of the release'
      goal: 'the steady flow with the same six-hour total'
      steps:
      - ask: Integrate the schedule over the six hours.
        answer: 0
        candidates:
        - text: '[48t + 4t²] from 0 to 6 = 288 + 144 = 432'
          rule: antiderivative
        - text: '[48t + 8t²] from 0 to 6 = 288 + 288 = 576'
          rule: antiderivative
          survives: true
          why: >-
            The antiderivative of 8t is 4t², because the exponent rises to 2 and the term is
            divided by it. Left as 8t² this is a well-formed line that overstates the release
            by a third and goes on behaving itself to the end.
        - text: '[48 + 4t²] from 0 to 6 = 144'
          rule: antiderivative
          why: >-
            The constant 48 antidifferentiates to 48t. Left as 48 it takes the same value at
            both ends and cancels, so 6 hours of base flow vanish from the total.
        - text: 'Q(6) − Q(0) = 96 − 48 = 48'
          rule: evaluation
          why: >-
            That is the change in the rate across the six hours rather than the accumulation
            of the rate. It answers how much the release grew, which nobody asked.
      - ask: Turn the accumulation into the steady flow with the same total.
        answer: 0
        candidates:
        - text: '432 ÷ 6 = 72 cubic metres a second'
          rule: average
        - text: '432 cubic metres a second, since that is what the schedule delivers'
          rule: evaluation
          survives: true
          why: >-
            432 is the accumulation in the mixed units the integral produced, not a flow.
            Published as a release it is six times too large, and nothing about the figure
            looks wrong on the page.
        - text: '432 × 6 = 2592 cubic metres a second'
          rule: average
          why: >-
            An average divides the accumulation by the interval. Multiplying gives a number
            with no meaning and a release the spillway could not pass.
      - ask: Say why 72 is also the mean of the two end readings.
        answer: 2
        candidates:
        - text: 'because the average value of any rate is the mean of its endpoints'
          rule: endpoint
          survives: true
          why: >-
            True for a straight line and false in general. Applied to a curving hydrograph it
            is out by several per cent in a direction that depends on the curvature, and it
            is the shortcut that stops anybody integrating again.
        - text: 'because 48 and 96 are both whole multiples of 6'
          rule: substitution
          why: >-
            A coincidence of these particular numbers rather than a property of the schedule.
            Changing the 48 to a 50 leaves the endpoint result exactly as true.
        - text: 'because the rate is linear, so its average is the mean of its endpoints'
          rule: endpoint
      commit: Report the steady flow
    answerText: >-
      72 cubic metres a second, steady, for 6 hours — the same total the ramp delivers, and the
      mean of its ends only because the ramp is a straight line.
    why: >
      Two steps and one trap. Integrating gives the total in the mixed units the formula was written in.
      Dividing by the interval turns it back into a rate. That is the definition of an average value. It
      works for any schedule at all. What does not work for any schedule is averaging the two ends. That
      happens to agree here, because a straight line spends as long above its midline as below. Carry that
      habit onto tomorrow's curved release and the published figure is wrong in the direction the
      curvature points.

  # ---------------------------------------------------------------- day 9
  # Unit 7 — a separable differential equation, and what one measurement does and
  # does not fix about its solution.
- title: The release that could have been smaller
  objective: Use an antiderivative to evaluate an accumulation, and say what the accumulation function's own 
    rate is.
  briefing: The gentle release is gone. Today's larger ramp has to be accounted for before it reaches anyone 
    downstream.
  stake: >-
    Thursday. The release deferred on Monday can no longer be gentle: today's four-hour ramp averages more than
    three times Berg's proposed early release. Before the gates move, you must prove how much water arrived and
    how much this schedule will send downstream.
  takeaway: An antiderivative turns an accumulation into a subtraction, and an accumulation differentiates 
    back to the rate that built it.
  segue: >-
    The gates ramp from 120 to 360 cubic metres a second over four hours—an average of 240, more than three times
    Berg's 72 from Monday. Kit Trenholme gets Ada's ewes off the low meadow before the rise arrives. Berg was right
    about buying headroom early. But the reservoir is now above the range where the old working relations were ever
    checked carefully.
  stops:
  - group: SAFE
    task: Close the reservoir's ledger for the night
    title: What the level rise leaves out
    at: arrival-map
    reason: >-
      Sunniva Berg needs the total that actually reached the dam overnight before
      she can size an afternoon release whose average is now more than three times Berg's Monday proposal.
    concept: The definite integral as an accumulation, and its units
    place: Downstream Warning Desk
    scene: >-
      The reservoir gained 1.06 million cubic metres overnight. The storm band fell upstream; the reservoir-site
      rain gauge recorded no direct surface-rain term during this 12-hour ledger. Berg wants the catchment volume
      that arrived at the dam before she sizes the afternoon release.
    guide: >-
      Reading a stream costs nothing, so read them all. Then count only the ones that belong in the total
      she asked for. That total is the volume that arrived at the dam over twelve hours, not the part that
      stayed. The level rise is what remained after everything that left, so anything already leaving has
      to go back into the sum. Report the total when the ledger closes.
    background:
    - >-
      Why the rise is not the arrival. The reservoir gained 1.06 million cubic
      metres, and it gained that while the turbines, the spillway and the
      compensation flow were all taking water out. What arrived is what stayed plus
      everything that left, which is why a balance is a ledger rather than a
      reading.
    - >-
      What counting a stream claims. The storage balance is change in storage = inflow + direct precipitation −
      controlled releases − seepage − evaporation and other losses. This simplified 12-hour board supplies no direct
      precipitation or evaporation term, so only the measured storage gain and measured outflows are needed. If
      a surface-rain term were present, it would not be hidden inside an upstream inflow gauge.
    - >-
      Why Berg wants arrivals before sizing a release. The release has to be set against what the
      catchment is actually delivering. Not against what the reservoir happened to keep while the machines
      were running. Using the rise would size this afternoon's release against a number that already had
      this morning's releases baked into it.
    assumes:
    - what accumulates is what is left after everything already leaving has left
    - a rate that runs throughout an interval contributes its rate times the whole interval
    takeaway: A net change is the integral of a difference, so every removal term has to be added back before 
      the arrival is known.
    format: BALANCE
    question: >-
      Read what you need and report the total volume that arrived over the 12 hours.
    balance:
      hint: >-
        Reading a stream costs nothing. Counting it is the claim you are making about where the
        water went.
      total: {amount: 2160000, unit: m³, label: Volume that arrived over 12 hours}
      streams:
      - {id: rise, label: Storage gained overnight, value: 1060000, display: '1.06 million m³ from the level record'}
      - {id: machines, label: Passed through the machines, value: 950000, display: '22 m³/s for 12 hours = 950,000
          m³', hidden: true, note: 'both units ran all night'}
      - {id: seepage, label: Seepage collected at the weirs, value: 150000, display: '3.5 m³/s for 12 hours = 150,000
          m³', hidden: true, note: 'measured at the sump, runs continuously'}
      - {id: spill, label: Over the spillway, value: 0, display: 'gates shut all night'}
      - {id: rain, label: Rain falling on the reservoir surface, value: 0, display: '0 in this 12-hour ledger; the
          storm band fell upstream of the reservoir surface'}
      tolerance: 90000
      commit: Report the arrival
    answerText: >-
      About 2.16 million cubic metres arrived — the 1.06 that stayed, plus the 0.95 the machines
      passed and the 0.15 that seeped, both of which were leaving throughout.
    why: >-
      The storage change is the integral of everything entering minus everything leaving. In this simplified 12-hour
      ledger, direct rain on the reservoir and evaporation are supplied as zero, so recovering catchment inflow
      means adding the turbine and seepage outflows back to the measured storage gain. That gives about 2.16 million
      cubic metres. The point is the water balance, not a claim that reservoir rainfall is somehow measured by an
      upstream river gauge.
  - group: GATES
    task: Total a release schedule exactly
    title: The schedule as a formula
    at: discharge-board
    reason: >-
      Reggie Wilkes has written this afternoon's ramp as a formula, and its total
      delivery has to be known before the gates start moving.
    concept: Substitution, and carrying the limits across with the variable
    place: Gate Chamber
    scene: >
      Wilkes has this afternoon's ramp written as R(t) = 120 + 60t cubic metres a second, with t
      in hours from 2 o'clock. It runs for four hours and Berg wants the volume it will deliver
      before it starts.
    guide: >-
      Build it a line at a time. A volume is the integral of a flow over time. So the ramp's total is an
      integral of a linear function. The units have to be reconciled on the way. The flow is per second
      and the schedule is in hours. Finish with the volume in cubic metres.
    background:
    - >-
      Why integrate a straight line at all. The average of a linear ramp is its midpoint value, so this
      total can be had geometrically as the area of a trapezium. Doing it as an integral is worth the
      extra line. The same working survives a schedule that is not a straight line. Most real ones are
      not.
    - >-
      Where the units bite. R is in cubic metres a second and t is in hours, so
      integrating without converting gives an answer 3,600 times too small. The safe
      habit is to put the conversion into the integrand rather than remembering it
      at the end, where it looks like a factor somebody invented.
    - >-
      Why Berg wants it before it runs. A four-hour release is a commitment of water
      that cannot be recalled. Knowing the volume beforehand is what lets it be
      checked against what the reservoir can spare and what the channel below can
      take.
    assumes:
    - the accumulation of a rate over an interval is the definite integral of that rate
    - an antiderivative of a power of t raises the exponent by one and divides by the new exponent
    takeaway: The fundamental theorem evaluates an accumulation as the difference of an antiderivative at the 
      two ends, so no sum is needed when a formula exists.
    format: DERIVE
    question: >-
      Evaluate the volume the four-hour ramp delivers, in cubic metres.
    derive:
      hint: >-
        Antidifferentiate first, then evaluate. Name the rule each line uses.
      start: 'R(t) = 120 + 60t'
      startNote: 'cubic metres a second, t in hours from 14:00'
      goal: 'the volume delivered between t = 0 and t = 4'
      steps:
      - ask: Write an antiderivative of the rate.
        answer: 1
        candidates:
        - text: 'F(t) = 120t + 60t²'
          rule: antiderivative
          why: >-
            The antiderivative of 60t raises the exponent to 2 and divides by it. Left
            undivided this doubles the whole ramp term.
        - text: 'F(t) = 120t + 30t² + C'
          rule: antiderivative
        - text: 'F(t) = 120 + 30t² + C'
          rule: antiderivative
          survives: true
          why: >-
            The constant term 120 antidifferentiates to 120t, not to 120. It looks like a
            tidy line and it drops 4 hours of base flow — about 1.7 million cubic metres —
            without changing anything else on the page.
        - text: "F(t) = 60"
          rule: antiderivative
          why: >-
            That is the derivative of the rate rather than an antiderivative of it. It answers
            how fast the ramp steepens, which is not a volume.
      - ask: Evaluate it between the two ends of the four hours.
        answer: 2
        candidates:
        - text: 'F(4) = 120×4 + 30×16 + C = 960 + C'
          rule: evaluation
          why: >-
            A definite integral is a difference of two values, and the constant cancels in
            that difference. A volume that still contains an unknown C is not a number.
        - text: 'F(4) − F(0) = 960 − 0 = 960 cubic metres'
          rule: evaluation
          survives: true
          why: >-
            The arithmetic is right and the units are not. The rate is per second and t is in
            hours, so this figure is in cubic-metre-hours per second and is short of the truth
            by a factor of 3,600.
        - text: 'F(4) − F(0) = 960, then × 3600 = 3.46 million cubic metres'
          rule: units
        - text: 'F(4) − F(0) = 960, then ÷ 3600 = 0.267 cubic metres of water'
          rule: units
          why: >-
            Converting hours to seconds multiplies the interval, so it multiplies the
            accumulation. Dividing turns four hours of a major release into a bucketful.
      commit: Report the volume
    answerText: >-
      About 3.46 million cubic metres — 960 in the units the formula was written in, times the
      3,600 seconds in each of its hours.
    why: >
      The fundamental theorem is what makes this a subtraction rather than a sum. Any
      antiderivative works, because the constant appears at both ends and cancels. That is
      why a definite integral is a number while an indefinite one is a family. What costs
      people the answer is not the calculus but the bookkeeping under it. The rate is
      measured per second and the variable is counted in hours. So the integral comes out in
      mixed units, and it has to be converted once, at the end, deliberately.
  - group: STORE
    task: Say what the accumulation curve's own slope is
    title: The curve that is already the answer
    reason: >-

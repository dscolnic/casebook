# Headwater — Ashfell Dam, and nine days of rain forecast in the catchment.
#
# Written to gamekit/tools/BOOK_TEMPLATE.md. The place is themes/headwater/plan.js
# — four levels inside the wall — and the arc is in ../GAME_IDEAS.md under
# "Headwater".
#
# **The subject is calculus. The dam is where it is being done.** Every stop
# names the move it teaches — a limit, a rule, an antiderivative, a solved
# equation — and the reservoir supplies the quantities, the units and the reason
# anybody wants the number. The syllabus is AP Calculus AB, mapped day by day in
# tools/syllabus.js under `headwater`, and a stop that teaches no move on that
# list does not go in however good the hydrology is.
#
# The earlier rule here was "no question whose answer is a symbolic expression
# with nothing at stake", and it was obeyed by dropping the symbols: 26 of 45
# stops became prose judgement about a dam and the course disappeared. The rule
# it is replaced by is adaptable in the way the first one was not, because it
# admits more than one way of paying for a symbol:
#
#   A stop earns its place if it teaches a named calculus move AND the move is
#   consequential in at least one of these senses —
#     · **numerical** — the working ends in a number somebody acts on;
#     · **directional** — getting it wrong changes a sign, a units factor or an
#       order of magnitude, and the verdict says which;
#     · **structural** — the move decides what kind of answer exists at all
#       (no rate here, a family rather than a value, an endpoint rather than a
#       critical point);
#     · **procedural** — the move is a discipline that survives the setting
#       (holding out data, converting limits with the variable, measuring what
#       you predicted).
#   A symbolic answer is welcome. A symbolic answer with none of the four is not.
#
# Every wrong branch names the mistake a student actually makes, and DERIVE's
# `survives` flag is where that is enforced: at least one wrong line per step
# stays algebraically valid, because a derivation whose errors die at once is
# passable without differentiating.
#
# The argument: Halloran holds that water released in March cannot be recovered
# and a dry summer is a real harm with a real cost. Berg holds that headroom is
# only cheap before it rains. Berg is right on day 4. Halloran is right on day 12.

theme:
  id: headwater
  title: Headwater
  subtitle: Duty Engineer · Ashfell Dam

groups:
  - id: INFLOW
    code: INFLOW
    name: Catchment & Inflow
    color: '#2f7fa8'
    desc: What the river is bringing, how fast it is changing, and how long ago it rained.
    defaultLeader: ekundayo
    milestones: [Read the gauges, Fit the rise, Forecast the peak, Ready to hand over]
  - id: STORE
    code: STORE
    name: Storage & Level
    color: '#1f7a6b'
    desc: What the reservoir holds, and why the level is not the same question as the volume.
    defaultLeader: ferrand
    milestones: [Read the level, Convert to volume, Account for the change, Ready to hand over]
  - id: GATES
    code: GATES
    name: Spillway & Gates
    color: '#b0762a'
    desc: How much can be let out, how fast, and what the last half metre of head does.
    defaultLeader: wilkes
    milestones: [Set the opening, Predict the discharge, Watch the head, Ready to hand over]
  - id: STRUCT
    code: STRUCT
    name: Structure & Seepage
    color: '#7a4fa3'
    desc: What the wall does under load, and what it says about itself in the gallery.
    defaultLeader: zawadzka
    milestones: [Read the weirs, Plot the uplift, Compare with the rise, Ready to hand over]
  - id: POWER
    code: POWER
    name: Power & Demand
    color: '#b3462f'
    desc: Water through the turbines is water released, and it is worth money on the way past.
    defaultLeader: anand
    milestones: [Read the load, Convert flow to power, Weigh it against storage, Ready to hand over]
  - id: SAFE
    code: SAFE
    name: Downstream & Public Safety
    color: '#5b6a72'
    desc: How long a release takes to arrive, how high it gets, and who has to be told.
    defaultLeader: baptiste
    milestones: [Route the release, Time the arrival, Warn the reach, Ready to hand over]

roster:
  - id: halloran
    name: Dermot Halloran
    role: Operations Manager
    division: POWER
    bio: |
      Runs Ashfell, and is answerable for two things that pull against each
      other: a town's water in August and a generation contract that is priced
      by the megawatt-hour. Both are paid for out of the same reservoir.

      His argument with the flood desk is the same one every winter. Water let
      go in March cannot be got back, and a dry summer is not a hypothetical —
      it is standpipes in the villages and a bill the authority cannot pay.

      His limit is that he is arguing about a forecast, and a forecast is worth
      what its lead time is worth. He knows it, which is why he loses gracefully.
    quiz:
      - q: Why does Halloran treat an early release as a cost rather than as caution?
        a: Nothing sent downstream in spring is available in August
        wrong:
          - Releasing early wears the spillway gates more quickly than a summer release
          - An early release has to be reported to the regulator within seven days
          - Generation is worth less in March than it is in August
  - id: berg
    name: Sunniva Berg
    role: Flood Engineer
    division: SAFE
    bio: |
      Buys headroom, and is unpopular for it. Her whole argument is about when a
      cubic metre of empty reservoir is cheap: a fortnight before the rain it
      costs a little generation, and on the morning of the peak it cannot be
      bought at any price.

      She works in arrival times rather than in volumes. A release made now
      reaches the first village in 4 hours and the last in 11, and every
      hour of that is an hour somebody can use.

      Her limit is that she is right in a way nobody sees. A flood that does not
      happen leaves no evidence that anything was done.
    quiz:
      - q: Why does Berg want headroom bought early rather than on the day?
        a: Empty reservoir costs generation now and is unobtainable later
        wrong:
          - The gates cannot be opened at short notice without a permit from the regulator
          - Releasing during a storm is prohibited while the river is already rising
          - The turbines cannot pass enough water to matter once the reservoir is full
  - id: ekundayo
    name: Ayo Ekundayo
    role: Catchment Hydrologist
    division: INFLOW
    bio: |
      Reads the catchment: 11 rain gauges, 4 river gauges and a
      snowline. He can tell you what the river will do in six hours with some
      confidence and in three days with almost none, and he says which is which
      every time.

      What he watches is not the inflow but its rate of rise. A river climbing
      steadily is a river that has not peaked; the moment the climb slackens is
      the first honest news of the day, and it arrives before the level does.

      His limit is the radar. Rain over the high ground is measured badly by
      everything he owns, and that is where most of it falls.
    quiz:
      - q: Why does Ekundayo watch the rate of rise rather than the inflow itself?
        a: The climb slackening is the first sign the peak is coming
        wrong:
          - The inflow gauges are read only twice a day and the rate is continuous
          - A rate is less affected by errors in the rating curve than a flow is
          - Rate of rise is what the regulator requires to be reported hourly
  - id: ferrand
    name: Bo Ferrand
    role: Records & Rating Curves
    division: STORE
    bio: |
      Keeps the curves that turn one measurement into another: level into
      volume, level into surface area, gate opening into discharge. Every number
      the control room uses has been through one of them.

      He is careful to say that a curve is a survey, not a law. Each was measured
      once, by somebody, in a particular year, and it goes on being used long
      after the thing it described has moved.

      His limit is that nobody funds a resurvey. The curve is right until
      somebody spends money finding out that it is not.
    quiz:
      - q: Why does Ferrand call a rating curve a survey rather than a law?
        a: It was measured once and the thing it describes keeps changing
        wrong:
          - Curves are approximations fitted to data and carry a stated tolerance
          - Every curve has to be re-approved by the regulator each decade
          - A law would have to hold for every dam and these are site specific
  - id: wilkes
    name: Reggie Wilkes
    role: Gate Mechanic
    division: GATES
    bio: |
      Winds the gates and has done for 19 years. He can hear a bad
      hoist bearing from the far end of the chamber, and he will not run a gate
      he has not seen seat properly.

      What he knows in his hands and everybody else has to calculate: the first
      half metre of opening does almost nothing and the last half metre does
      most of the work. A gate is not a tap, and the difference is the reason
      the schedule matters.

      His limit is that he can only tell you what the gate is doing. What the
      river does with it is somebody else's arithmetic.
    quiz:
      - q: Why will Wilkes not treat the gate opening as proportional to discharge?
        a: The last half metre passes far more than the first
        wrong:
          - The hoist runs more slowly at the top of its travel than at the bottom
          - The gate leaks around its seals until it is more than half open
          - Discharge is measured downstream and always lags the opening
  - id: zawadzka
    name: Dr. Halina Zawadzka
    role: Structural Engineer
    division: STRUCT
    bio: |
      Reads the wall. 41 drain holes, 9 seepage weirs and a row of
      uplift gauges in the foundation gallery, and she has a plot of every 1
      of them going back to before she was born.

      A dam under a rising reservoir is under a rising load, and the gallery
      reports it: seepage climbs with head, and uplift climbs with head, and
      both are supposed to climb by an amount she can predict. It is the ones
      that climb faster than predicted that she comes down here for.

      Her limit is that everything she measures is a symptom. The crack she is
      looking for is in rock she will never see.
    quiz:
      - q: Why is a seepage reading only useful to Zawadzka beside the reservoir level?
        a: Seepage is expected to rise with head; only more than expected is news
        wrong:
          - Seepage readings drift with temperature and level corrects for it
          - The weirs cannot be read accurately unless the reservoir is steady
          - Level is what the regulator requires to be recorded with every reading
  - id: anand
    name: Mercy Anand
    role: Powerhouse Chief
    division: POWER
    bio: |
      Runs two machines at the toe of the dam and knows to the cubic metre what
      each of them is passing. Water through a turbine is water released, and it
      is the only release that pays for itself on the way past.

      She is the one who points out that generation and flood release are the
      same tap used for different reasons, and that the difference between them
      is entirely in the timing and the rate.

      Her limit is capacity. The machines will pass about a tenth of what the
      spillway will, so the moment the number gets large she stops being part of
      the answer.
    quiz:
      - q: Why can Anand's machines not be the answer to a flood release?
        a: Their combined flow is a small fraction of the spillway's
        wrong:
          - Generating during a flood would breach the terms of the supply contract
          - Turbines cannot run when the tailrace is high and the river is in spate
          - Machine flow is fixed by demand and cannot be varied by the operator
  - id: baptiste
    name: Nadine Baptiste
    role: Downstream Warning Officer
    division: SAFE
    bio: |
      Owns the list: 11 villages, 2 caravan sites, a school and a road
      that floods before anything else does. She knows the arrival time to each
      of them from a release at the dam, and she has walked every one.

      Her job is entirely about lead time. A warning that arrives with the water
      is not a warning, and the difference between four hours and one is the
      difference between moving stock and losing it.

      Her limit is that she can only warn what she is told about. A release
      decided at four o'clock and passed to her at half past is a release she
      cannot get in front of.
    quiz:
      - q: Why does Baptiste care when a release decision is made rather than how large it is?
        a: People need the notice before the river gives it to them
        wrong:
          - Larger releases are easier to warn about because they are more visible
          - The warning system can only be triggered on the hour
          - Village wardens are only on duty during the working day
  - id: rasmussen
    name: Ilya Rasmussen
    role: Survey Engineer
    division: STORE
    bio: |
      Turns up with a boat, an echo sounder and a fortnight, and leaves with a
      new picture of the bottom of the reservoir. It is unglamorous work that
      nobody asks for until something does not add up.

      He is blunt about what a resurvey is for: everything the control room
      computes about volume rests on a shape somebody measured decades ago, and
      a reservoir with rivers running into it does not keep its shape.

      His limit is the boat. He cannot survey in a swell, which means the
      fortnight he needs is a fortnight of calm water nobody can promise him.
    quiz:
      - q: Why does Rasmussen say a stage–storage curve has a shelf life?
        a: Sediment keeps arriving and the shape it was measured on changes
        wrong:
          - Echo sounders have improved and older surveys used cruder instruments
          - The curve is only valid between the levels that were surveyed
          - Reservoir level records are lost after 25 years
  - id: sato
    name: June Sato
    role: Forecast Liaison
    division: INFLOW
    bio: |
      Sits between the met office and the control room and translates one into
      the other. What arrives is a rainfall forecast over a region; what the dam
      needs is an inflow over a catchment, and the two are not the same thing.

      She is careful with confidence. A forecast at six hours is worth acting
      on, at two days is worth preparing for, and at five days is worth
      knowing about and nothing else, and she says which she is handing over.

      Her limit is that she does not make the forecast. When it is wrong she is
      the one in the room, and the room forgets she only carried it.
    quiz:
      - q: Why does Sato attach a lead time to every forecast she passes on?
        a: What a forecast is worth acting on depends on how far ahead it is
        wrong:
          - Forecasts are only valid for the six hours after they are issued
          - The met office charges the authority by the forecast horizon
          - Rainfall totals are revised upward as the lead time shortens
  - id: prowse
    name: Etta Prowse
    role: Riverside Landowner Representative
    division: SAFE
    bio: |
      Speaks for the reach below the dam: farms, two caravan sites and the
      people who have to move animals when the river comes up. She has been on
      the liaison committee for 11 years and has never missed a meeting.

      What she asks for is not less water. It is the same water with more
      notice, and she is the reason the warning list is a list of times rather
      than a list of names.

      Her limit is that she represents the people who stayed. The ones who were
      flooded out in the eighties are not on her committee.
    quiz:
      - q: What does Prowse ask the dam for on behalf of the reach?
        a: Earlier notice of whatever is going to be released
        wrong:
          - A guarantee that releases stay below the bank-full flow
          - Compensation set in advance for stock that has to be moved
          - A say in the release decision itself rather than a warning about it

glossary:
  - name: Reservoir
    aliases: [reservoirs]
    def: The body of water held behind the dam, whose level rises when more arrives than leaves.
  - name: Inflow
    aliases: [inflows]
    def: The water arriving at the reservoir from the catchment, second by second.
  - name: Flow rate
    aliases: [flow, flows]
    def: How much water passes a point each second, measured in cubic metres a second.
  - name: Outflow
    aliases: [outflows, release]
    def: The water leaving — through the turbines, over the spillway, or both. It is the only part anybody controls.
  - name: Catchment
    aliases: [catchments]
    def: The ground whose rain ends up here. Anything that falls on it eventually arrives at the reservoir.
  - name: Curve
    aliases: [curves]
    def: A plotted relation between two measured quantities, read off rather than calculated.
  - name: Flood
    aliases: [floods]
    def: A flow large enough to reach what is beside the river. It is the event this dam is run against.
  - name: Peak
    aliases: [peaks]
    def: The most water passing in one event, and the moment it stops climbing.
  - name: Hydrograph
    aliases: [hydrographs]
    def: A plot of flow against time. Its climb, its peak and its fall are the shape of one flood.
  - name: Rate of change
    aliases: [rate of rise, derivative]
    def: How fast a quantity is moving, at an instant — the slope of its graph rather than its value.
  - name: Accumulation
    aliases: [accumulate, accumulated, integral]
    def: What builds up over time from a rate — for a reservoir, the volume the difference between two rates has added.
  - name: Stage
    aliases: [level, water level]
    def: The height of the water surface, measured against a fixed datum. It is what a gauge reads.
  - name: Stage-storage curve
    aliases: [stage–storage, storage curve, rating curve]
    def: The surveyed relation between level and volume. Every volume the control room reports comes through it.
  - name: Surface area
    aliases: [plan area]
    def: How much of the reservoir the water covers at a given level. It grows as the reservoir fills.
  - name: Head
    aliases: []
    def: The height of water above a sill or a turbine, which is what drives water through it.
  - name: Spillway
    aliases: [spill, spilling]
    def: The controlled overflow a dam is built with, for water that must leave faster than the machines can pass it.
  - name: Discharge
    aliases: [discharges]
    def: A flow rate through a particular opening, in cubic metres a second.
  - name: Chain rule
    aliases: []
    def: When a quantity changes because another one does, its rate carries the inner quantity's rate as a factor.
  - name: Related rates
    aliases: [related rate]
    def: Two quantities tied by a relation, so that knowing how fast one moves fixes how fast the other does.
  - name: Fundamental theorem
    aliases: [fundamental theorem of calculus]
    def: The area under a rate, between two times, is the total change over that interval.
  - name: Average value
    aliases: [mean rate]
    def: The steady rate that would produce the same accumulation over the same interval.
  - name: Linear approximation
    aliases: [linearisation, rule of thumb]
    def: Predicting nearby values from the rate at one point. It is good close by and worse further off.
  - name: Second derivative
    aliases: [curvature, rate of the rate]
    def: How fast a rate is itself changing — what says whether a climb is getting quicker or slacker.
  - name: Inflection
    aliases: [inflection point]
    def: Where a climb stops getting quicker and starts slackening.
  - name: Trapezoid rule
    aliases: [trapezoidal, numerical integration]
    def: Adding up the area under readings by treating each pair as a trapezium. What you use when there is no formula.
  - name: Optimisation
    aliases: [optimise, optimum]
    def: Working out where a quantity is largest or smallest — at a turning point, or at the end of the range.
  - name: Limit
    aliases: [limits, one-sided limit]
    def: The value a quantity closes on as its input closes on a number, whether or not it ever arrives there.
  - name: Difference quotient
    aliases: [average rate of change, secant slope]
    def: The change in a quantity divided by the change in time. Its limit, as that interval shrinks, is the derivative.
  - name: Continuous
    aliases: [continuity, continuously]
    def: Having no jumps — every value in between is reached. A derivative needs it, and a trace that steps does not have it.
  - name: Critical point
    aliases: [critical points, turning point]
    def: Where a derivative is zero or does not exist. A largest value sits at one of these or at a boundary of the range.
  - name: Concave
    aliases: [concavity, concave down, concave up]
    def: Which way a curve is bending. The sign of the second derivative reports it, everywhere at once.
  - name: Antiderivative
    aliases: [antidifferentiate, antidifferentiating, indefinite integral]
    def: A quantity whose derivative is the one you started from. Every rate has a family of them, differing by a constant.
  - name: Constant of integration
    aliases: [the constant C]
    def: What is left undetermined when a rate is turned back into a total. Only a measurement pins it down, which is why one reading is not always enough.
  - name: Definite integral
    aliases: [definite integrals]
    def: A total gathered across a stated interval, worked out by subtracting the value at one limit from the value at the other.
  - name: Riemann sum
    aliases: [left sum, right sum, endpoint sum]
    def: A sum of rectangles standing under a curve, used to approximate the area beneath it. On a rising rate the left one is short and the right one too big.
  - name: Substitution
    aliases: [substitute, substituting]
    def: Rewriting an awkward expression in a new variable, so that what is left can be handled by an ordinary rule.
  - name: Separable
    aliases: [separate the variables, separating]
    def: An equation whose two quantities can be moved onto opposite sides, so that each side can be worked on its own.
  - name: Exponential decay
    aliases: [decay, recession constant]
    def: What a rate proportional to the quantity itself produces. It drops by the same fraction in every equal interval.
  - name: Implicit differentiation
    aliases: [implicitly]
    def: Differentiating a relation as it stands, without solving it first. Every quantity in it carries its own rate.
  - name: Product rule
    aliases: []
    def: The rate of a product of two changing quantities is a sum of two terms, each holding one of them still.
  - name: Power rule
    aliases: []
    def: The derivative of a power brings its own exponent down as a factor and reduces it by one.
  - name: Indeterminate form
    aliases: [zero over zero]
    def: A quotient that comes out as nothing over nothing. It still has a value, and reaching it takes work.
  - name: Differential
    aliases: [differentials]
    def: A rate multiplied by a small step, used to work out the change that rate produces nearby.
  - name: Accumulation function
    aliases: [running total, accumulation curve]
    def: A running total from a start that stays put to a moment that moves. Its rate of change is whatever was arriving at that moment.
  - name: Held-out data
    aliases: [holdout, held back]
    def: Readings kept back while a rule is chosen, so the rule can be scored on something it has never seen.
  - name: Freeboard
    aliases: []
    def: The height left between the water surface and the top of the dam. It is the margin everything else is spent on.
  - name: Uplift
    aliases: []
    def: Water pressure under the base of a dam, pushing up. It grows with the reservoir and is measured in the gallery.
  - name: Seepage
    aliases: [seep, seeps]
    def: Water that gets through or under the wall, collected in drains and measured at weirs.
  - name: Travel time
    aliases: [arrival time]
    def: How long a release takes to reach a place downstream. It is what turns a decision into a warning.
  - name: Attenuation
    aliases: [attenuate, attenuates]
    def: The flattening of a peak as it moves downstream, because the channel takes some in and returns it later.
  - name: Routing
    aliases: [route, routed]
    def: Working out hour by hour what a reservoir or a channel does to a wave that moves through it.
  - name: Sediment
    aliases: [silt, siltation]
    def: What the rivers bring in and leave behind. It takes up volume that used to be water.

missions:
  # ---------------------------------------------------------------- day 1
  # Unit 1 — limits, the difference quotient, and where a derivative fails to exist.
  - title: 88%
    objective: Get an instantaneous rate out of readings, out of a formula, and find the instant that has none.
    briefing: Nine days of rain forecast, and every number on this dam is about to be asked how fast it is moving.
    stake: >-
      Monday. The reservoir is at 88% after the driest summer in nine years. June Sato, the
      forecast liaison, brought the five-day forecast down an hour ago. Rain over the high
      ground from Thursday. A lot of it. Dermot Halloran has already said the word drawdown. He
      said it in a tone that means he does not want one. This fortnight is not run on readings.
      It is run on rates. A rate is how fast a number is changing. Today you find a rate three
      ways. Once between two gauge readings. Once from a fitted formula, straight from the
      definition. Once at a single instant, where the record holds no rate at all.
    takeaway: A reading is a value; a rate is a limit, and the limit is the part that says what happens next.
    stops:
      - group: INFLOW
        task: Get a rate out of two readings
        title: The slope between two readings
        concept: Limits, one-sided limits, and where a limit fails to exist
        place: Catchment & Inflow Desk
        scene: >
          Ayo Ekundayo, the catchment hydrologist, has the Ashfell gauge on the screen — 41 cubic metres a second at 6 this
          morning, 48 at 8. Halloran wants a number for how fast it is climbing, not another
          reading off the same trace.
        guide: >-
          Five numbers are on offer and only three of them are ends of an interval. Two
          are arithmetic already done to the readings: a sum, and the hour one of them
          was taken at. Ask of each what it measures. A sum of two readings has thrown
          away the difference a slope is made of. Get that wrong and the report gives
          the river's size where it was asked for its speed.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. Two things are being tested. Can you pick the quantities the relationship actually needs? And does the
              size of the answer look right once they are in place?
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch is caught before it is placed. It is also how a quantity
              belonging to a different part of the problem is caught. That is the habit this format
              exists to build.
        assumes:
          - a flow rate says how much water passes a point each second
          - the slope of a line through two points is the rise divided by the run
        takeaway: An average rate of change is the slope of the line joining an interval's two endpoints.
        format: BALLPARK
        question: Estimate the average rate of change of the inflow between 14 o'clock.
        why: >
          An average rate of change is a slope, and the two readings are the two ends of it. It says nothing
          about what happened between them. The same pair comes from a river that climbed steadily. It also
          comes from one that sat still for 90 minutes and then jumped. Shrinking the interval is the only
          cure. That shrinking approaches a number: the limit of this slope as the two readings close
          together. That limit is the instantaneous rate the forecast wants.
        estimate:
          prompt: >
            The gauge read 41 cubic metres a second at 06:00 and 48 at 08:00. An average rate of
            change is the change in the quantity divided by the change in the time.
          question: Choose the later reading, the earlier reading and the length of the interval.
          labels:
            - 48  (the reading at 8, cubic metres a second)
            - 41  (the reading at 6, cubic metres a second)
            - 2  (hours between the 2 readings)
            - 89  (the 2 readings added together)
            - 8  (the hour the later reading was taken)
          values: [48, 41, 2, 89, 8]
          slots: 3
          template: '({0} − {1}) ÷ {2}'
          formula: (a-b)/c
          correct: [0, 1, 2]
          target: 3.5
          tolerance: 0.4
          units: cubic metres a second per hour
          solution: (48 − 41) ÷ 2 = 3.5 cubic metres a second per hour.
          explanation: >
            About 3.5 cubic metres a second every hour. Carried forward 6 hours that is another
            21 on the gauge, which is the whole of this morning's argument — and it is a
            straight-line carry, which the afternoon will show to be optimistic.
          givens:
            - 41 m³/s at 06:00, 48 m³/s at 08:00
            - Two hours between the readings
          relationship: >
            Average rate of change = (Q(t₂) − Q(t₁)) ÷ (t₂ − t₁), which is the slope of the line
            through the two points on the hydrograph.
        answerText: About 3.5 cubic metres a second per hour, averaged across the 2 hours.
      - group: STORE
        task: Get a rate out of a formula, from the definition
        title: What the slope becomes
        place: Storage & Level Board
        scene: >
          Bo Ferrand, the records & rating curves, has fitted last night's storage to V(t) = 5t² + 40t, in thousands of cubic
          metres, with t in hours. The nine o'clock call wants the rate at four hours, not an
          average across the night.
        guide: >-
          Build it a line at a time from the definition — the difference quotient —
          rather than from a rule you already know. Each step is the expression the line
          above licenses, and every wrong branch is legal algebra. The nine o'clock call
          wants the rate at four hours, so finish by evaluating what you derived at that
          value.
        background:
          - >-
              Why the definition rather than the rule. The power rule gives the answer in one line and teaches
              nothing about why the answer is right. Working the difference quotient through is where the rule
              comes from. That means the change in V over the change in t, as that change goes to nothing. It is
              the only version that survives a function no rule covers.
          - >-
              What the algebra does. Expand V(t + h), subtract V(t), and every term without
              an h cancels. Divide by h and one factor of h comes out of what is left. The
              limit is then the terms with no h in them at all, which is the derivative —
              and the cancellation is the whole trick.
          - >-
              Why an average will not do. Storage over the night rose in a curve. So an average across it is a
              rate that was true at one instant somewhere in the middle. It is wrong now. The call is about what
              to do next, and that depends on the rate at four hours.
        takesAsRead:
          - Limits, one-sided limits, and where a limit fails to exist
          - Continuity, and what a jump costs you
        assumes:
          - an average rate of change is the change in a quantity over the change in time
          - a limit is the value an expression approaches as one of its inputs closes on a number
        takeaway: The derivative is the limit of the difference quotient, and taking the limit is what removes the interval.
        format: DERIVE
        question: >-
          Work the difference quotient down to an instantaneous rate, and evaluate it at four hours.
        derive:
          hint: >-
            Each line has to follow from the one above it. Name the move as well as the line.
          start: 'V(t) = 5t² + 40t'
          startNote: storage in thousands of cubic metres, t in hours
          goal: "V'(4), from the definition rather than from a rule"
          steps:
            - ask: Write the difference quotient and expand V(t+h).
              answer: 0
              candidates:
                - text: '(5t² + 10th + 5h² + 40t + 40h − 5t² − 40t) ÷ h'
                  rule: expansion
                - text: '(5t² + 10th + 5h² + 40t + 40h − 5t² − 40t) ÷ h²'
                  rule: cancellation
                  why: >-
                    A difference quotient divides by the change in the input, which is h. Dividing by
                    h² is the slope of nothing, and the limit it produces does not exist.
                - text: '(5t² + 5h² + 40t + 40h − 5t² − 40t) ÷ h'
                  rule: expansion
                  survives: true
                  why: >-
                    (t + h)² is t² + 2th + h², and the dropped cross term 2th is the only part of the
                    expansion that survives the limit. This divides by h cleanly and stays valid all
                    the way down to a derivative of 40, which is wrong at every hour but 1.
                - text: '5(t + h)² + 40(t + h) − 5t² − 40t'
                  rule: expansion
                  why: >-
                    That is the change in the storage, not a rate. Without the division by h it is
                    measured in cubic metres rather than cubic metres an hour.
            - ask: Cancel the h and take the limit as h goes to zero.
              answer: 0
              candidates:
                - text: '10t + 5h + 40, which approaches 10t + 40'
                  rule: limit
                - text: '10t + 5h + 40, which approaches 10t + 45'
                  rule: limit
                  why: >-
                    Sending h to 0 removes the whole term 5h. It does not leave the coefficient 5
                    standing on its own.
                - text: '10t + 5h + 40 for every h, so the limit does not exist'
                  rule: limit
                  why: >-
                    This is a polynomial in h, and a polynomial has a limit everywhere. Nothing is
                    undefined once the h in the denominator has cancelled.
                - text: '10t + 5h + 40, and h cannot be set to 0, so the quotient is undefined'
                  rule: cancellation
                  survives: true
                  why: >-
                    The quotient is undefined at h = 0, which is exactly why a limit is taken instead
                    of a substitution. The observation is correct and applied to the wrong step, and
                    it survives to the bottom of the page as a refusal to finish.
            - ask: Evaluate the rate at four hours.
              answer: 0
              candidates:
                - text: "V'(4) = 10 × 4 + 40 = 80 thousand cubic metres an hour"
                  rule: substitution
                - text: "V'(4) = 10 × 4 + 40 × 4 = 200 thousand cubic metres an hour"
                  rule: substitution
                  survives: true
                  why: >-
                    The 40 is already the derivative of 40t and carries no further t with it.
                    Multiplying it by four differentiates nothing and reports a rate two and a half
                    times the real one, in units that still look right.
                - text: 'V(4) = 5 × 16 + 40 × 4 = 240 thousand cubic metres'
                  rule: substitution
                  why: >-
                    That is the storage at four hours rather than the rate at four hours. It answers
                    how much, which is the number the call already has.
          commit: Report the rate
        answerText: >-
          80 thousand cubic metres an hour at 4 hours — a limit of the difference quotient, not
          an average across any interval.
        why: >
          The difference quotient is the slope of a line through two points on the curve, and its value
          depends on how far apart they are. Taking the limit closes that gap without ever setting it to 0.
          That is the whole manoeuvre. At h = 0 the quotient is 0/0 and says nothing, while its limit is one
          number. What comes out is a rule, 10t + 40, good at every hour of the night, and the four-hour
          figure is one substitution away from it.
      - group: SAFE
        task: Say what the trace has no rate at
        title: The instant the gate moved
        place: Downstream Warning Desk
        scene: >
          Nadine Baptiste, the downstream warning officer, has the tailrace trace across the moment gate 2 opened. Discharge sits at
          60 cubic metres a second up to 2 o'clock and at 145 immediately after. She wants the
          trace read, not smoothed.
        guide: >-
          The four answers disagree about one thing: whether a rate exists at that
          instant at all. Some assign it a value, large or zero, and some deny there is
          a value to assign. Decide that first, from the trace, before arguing about
          size. Sorting a discontinuity from a steep slope decides whether you need a
          better gauge or a different question.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be the answer under
              one specific misreading. A step skipped. A quantity confused with a rate. A correlation taken for a
              cause. Identifying which misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance. That was 88 per
              cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason is
              indistinguishable from a sound one. That stays true until the day the approximation is
              what is being tested.
        takesAsRead:
          - Limits, one-sided limits, and where a limit fails to exist
        assumes:
          - a limit describes what a quantity approaches from one side, which need not be what it reaches
          - a derivative is itself a limit, taken across the instant rather than up to it
        takeaway: A jump in a record is a place the calculus simply does not reach, however good the record is on both sides of it.
        format: CHOICE
        question: What is true of the discharge at two o'clock?
        choices:
          - The one-sided limits differ, so there is no rate of change at that instant
          - The rate of change is very large but finite, and a faster gauge would measure it
          - The discharge is undefined at two o'clock, because two values cannot both hold
          - The rate of change is zero, because the discharge is constant on either side of it
        answer: The one-sided limits differ, so there is no rate of change at that instant
        why: >
          Approaching 2 o'clock from the left, the discharge tends to 60. From the right it tends to 145. A
          derivative is the limit of a difference quotient taken across the instant. Here that quotient is a
          fixed jump divided by a shrinking interval, so it grows without bound. It never settles on a number.
          The trace has a good rate everywhere else. That is why asking for the rate of rise at two o'clock
          asks the record for something it does not hold.
        rebuttals:
          - A faster gauge shrinks the interval, and the quotient grows without bound rather than settling on a number.
          - The discharge has one value at two o'clock, whichever side the log records it on. A jump is not an absence.
          - Constant on either side makes both one-sided rates zero and the two-sided rate nothing at all.

  # ---------------------------------------------------------------- day 2
  # Unit 2/3 — power rule, chain rule, product rule, and a related rate read off a formula.
  - title: The same water, moving faster
    objective: Differentiate the three relations this dam runs on, and see what each rate carries with it.
    briefing: Three formulas on three walls, and today every one of them is asked how fast it is moving.
    stake: >-
      Tuesday. The rain has started on the upper catchment. The gauge is climbing. The level is
      climbing behind it. Reggie Wilkes, the gate mechanic, has a question. Wind the gate open
      at a steady rate, and what happens to the discharge going out? That is a question about
      the spillway relation, not about the gate. Mercy Anand, the powerhouse chief, asks the
      same thing about power. Power leans on two quantities, and both of them are moving at
      once. Today you differentiate the three relations the dam is run from. A rate on the left
      picks up every part of the right side that is moving too.
    takeaway: Differentiating a relation converts it from a statement about values into a statement about rates.
    stops:
      - group: INFLOW
        task: Turn a column of readings into a volume
        title: Adding up a curve nobody wrote down
        place: Catchment & Inflow Desk
        scene: >
          Ekundayo has 5 readings an hour and a half apart — 48, 60, 74, 87 and 96 cubic metres a
          second. Sato is asking for the volume already in, and there is no equation behind any of
          it.
        guide: >-
          The five numbers are all sums of the same readings, made in different ways.
          One halves the two ends before adding; one does not. One adds every reading
          flat. The rule the volume comes from decides which sum is the right one, so
          read the rule before the numbers. Counting an end reading at full weight adds
          water that never arrived, and the error grows with every extra interval.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. Two things are being tested. Can you pick the quantities the relationship actually needs? And does the
              size of the answer look right once they are in place?
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch is caught before it is placed. It is also how a quantity
              belonging to a different part of the problem is caught. That is the habit this format
              exists to build.
        assumes:
          - the area under a flow-against-time curve is a volume
          - a trapezium's area is the average of its two parallel sides times its width
        takeaway: The trapezoid rule adds an unwritten curve by averaging each pair of readings, so the interior readings are counted twice as heavily as the ends.
        format: BALLPARK
        question: Estimate the volume that arrived over those six hours.
        why: >
          The fundamental theorem says the accumulated volume is the area under the flow curve.
          Nothing in it requires a formula, because a list of readings has an area too. The
          trapezoid rule averages each adjacent pair of readings. That is why every interior
          reading is used by two trapezia and each end reading by one. It is exact on any
          stretch where the flow runs in a straight line. On a rise that curves upward it reads
          slightly high, which is the direction to know before it goes to a committee.
        estimate:
          prompt: >
            Readings 48, 60, 74, 87, 96 m³/s, taken 1.5 hours apart. The trapezoid rule adds half
            the first and last readings to all the interior ones, then multiplies by the interval.
            1.5 hours is 5,400 seconds.
          question: Choose the half-ends term, the interior sum and the interval in seconds.
          labels:
            - 72  (half of the first and last readings added)
            - 221  (the 3 interior readings added)
            - 5400  (seconds in each interval)
            - 144  (the first and last readings added, not halved)
            - 365  (all 5 readings added)
          values: [72, 221, 5400, 144, 365]
          slots: 3
          template: '({0} + {1}) × {2}'
          formula: (a+b)*c
          correct: [0, 1, 2]
          target: 1582200
          tolerance: 150000
          units: cubic metres
          solution: (72 + 221) × 5,400 ≈ 1.58 million cubic metres.
          explanation: >
            About 1.58 million cubic metres in 6 hours. A left-endpoint sum over the same readings
            gives 1.40 million and a right-endpoint sum 1.66 — the trapezoid result is the average of
            those 2, and the true area is close to it because the rise is nearly straight.
          givens:
            - Readings 48, 60, 74, 87, 96 m³/s at 1.5-hour spacing
            - 6 hours in total, 5,400 seconds per interval
          relationship: >
            Volume ≈ Δt × (½Q₀ + Q₁ + Q₂ + Q₃ + ½Q₄) — the trapezoid rule, which is every pair of
            readings averaged and added.
        answerText: About 1.58 million cubic metres over the 6 hours.
      - group: GATES
        task: Differentiate the spillway relation
        title: A gate is not a tap
        concept: The power rule
        place: Gate Chamber
        scene: >
          Wilkes has the spillway rating on the wall, Q = C·L·H^(3/2) with C·L equal to 21.0. The
          head over the sill is 2.0 metres and rising, and the control room wants the discharge rate
          rather than the discharge.
        guide: >-
          Build it a line at a time. The control room wants a rate of change of discharge, not a discharge. So
          this is a related-rates problem. Differentiate the rating with respect to time, and the chain rule
          brings dH/dt along. Evaluate what you derive at a head of two metres.
        background:
          - >-
              Why the chain rule is what appears. Q depends on H, and H depends on time, so Q's dependence on time
              runs through H. Differentiating the rating therefore produces a factor for how Q responds to H. It
              also produces a factor for how fast H is moving. The second is the number the gauge is giving you.
          - >-
              Why a gate is not a tap. A tap's flow is proportional to how far it is open. A
              spillway's discharge goes as head to the power of three halves, so the same
              centimetre of level does more the deeper the water over the sill. The rating
              is nonlinear, and the operator's intuition has to be too.
          - >-
              What the control room does with a rate. A discharge tells you what is going
              out now. Its rate of change tells you how much time you have before it exceeds
              the channel downstream, and that is the number a warning is issued on.
        assumes:
          - the discharge over a weir depends on the head raised to a power
          - a quantity that changes because another one changes needs the chain rule
        takeaway: The power rule brings the exponent down and reduces it by one; the chain rule supplies the inner rate.
        format: DERIVE
        question: >-
          Derive how fast the discharge rises as the head rises, and evaluate it at 2.0 metres.
        derive:
          hint: >-
            Pick the line that actually follows from the one above it.
          start: 'Q = C·L·H^(3/2)'
          startNote: the spillway rating, with C·L = 21.0
          goal: 'dQ/dt in terms of dH/dt'
          steps:
            - ask: Differentiate both sides with respect to time.
              answer: 0
              candidates:
                - text: 'dQ/dt = C·L·(3/2)·H^(1/2)·dH/dt'
                  rule: chain
                - text: 'dQ/dt = C·L·(3/2)·H^(1/2)'
                  rule: power
                  survives: true
                  why: >-
                    H depends on t, so differentiating with respect to t carries a factor of dH/dt.
                    Without it this is dQ/dH — a slope, correct about a question nobody asked, and
                    respectable enough to survive the rest of the derivation.
                - text: 'dQ/dt = C·L·(3/2)·H^(3/2)·dH/dt'
                  rule: chain
                  why: >-
                    The power rule takes the exponent down by one. Left at 3/2 this is not the
                    derivative of anything.
                - text: 'dQ/dt = C·L·H^(1/2)·dH/dt'
                  rule: chain
                  why: >-
                    The 3/2 that comes down in front is part of the power rule, not a constant that
                    can be folded into C·L.
            - ask: 'Evaluate it, with C·L = 21.0 and H = 2.0 m.'
              answer: 2
              candidates:
                - text: 'dQ/dt = 21.0 × 1.5 × 2.00 × dH/dt = 63.0·dH/dt'
                  rule: power
                  why: >-
                    H^(1/2) at 2.0 m is the square root of 2, about 1.41. Using 2.00 evaluates H
                    rather than its square root.
                - text: 'dQ/dt = 21.0 × 1.5 × 1.50 × dH/dt = 47.3·dH/dt'
                  rule: power
                  why: >-
                    The 3/2 is already in front as the 1.5. Using it twice applies the power rule
                    twice.
                - text: 'dQ/dt = 21.0 × 1.5 × 1.41 × dH/dt = 44.5·dH/dt'
                  rule: power
                - text: 'dQ/dt = 21.0 × 1.41 × dH/dt = 29.7·dH/dt'
                  rule: power
                  survives: true
                  why: >-
                    This is the arithmetic of the line whose 3/2 never came down. Nothing about it
                    looks broken, which is exactly why the mistake survives to the bottom of the
                    page.
          commit: Report the rate
        answerText: >-
          dQ/dt ≈ 44.5·dH/dt — so a head rising at 0.02 m/min raises the discharge by about
          0.9 cubic metres a second every minute.
        why: >
          The exponent 3/2 is the whole behaviour of a spillway. The power rule brings it down as a factor and
          drops it to 1/2. So the sensitivity of discharge to head grows as the square root of the head. The
          last half metre does far more than the first. The chain rule then supplies dH/dt, because nothing
          here is a function of the head directly; it is a function of time through the head. Drop that factor
          and the answer is a slope with respect to the wrong variable, in units nobody checks.
      - group: SAFE
        task: Say what each expression is a measurement of
        title: Which quantity is which
        concept: The definite integral as an accumulation, and its units
        place: Downstream Warning Desk
        scene: >
          Baptiste has four expressions on the briefing sheet, all built from the same inflow record. A
          committee this evening will read whichever number is nearest the top. She wants each one labelled
          before it goes out.
        guide: >-
          Four expressions, all built from one inflow record, and the units separate
          them before any argument does. Integrating a flow multiplies a rate by time;
          differentiating divides by it. Read the units off each expression first, and
          the pairing follows. A committee reads the top figure on a sheet and cannot
          tell a volume from a rate. The label is the whole safeguard.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on boards like this are
              written to be plausible for more than one situation. Choosing them one at a time lets a nearly-right
              answer through unexamined. Having to place all of them forces the comparison — not "is this
              reasonable here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once, three correct joins leave
              the fourth with only one place to go. Any error therefore involves at least two joins. That is worth
              remembering when the last pair looks forced. The fault is usually not in the join you are struggling
              with. It is in one you made early and stopped questioning.
        takesAsRead:
          - Riemann sums, left and right endpoints, and the trapezoid rule
        assumes:
          - integrating a rate over an interval gives a total, and differentiating a total gives a rate
          - the units of an expression follow from the units of the things it is built from
        takeaway: A rate, its accumulation and the rate of the rate are three different measurements of the same record, and only their units tell them apart.
        format: PROTOCOL
        question: Match each expression to the quantity it actually reports.
        columns: [Expression, What it reports]
        scenarios:
          - The integral of the inflow between six and noon
          - The derivative of the inflow with respect to time
          - The integral of the inflow between six and noon, divided by the six hours
          - The second derivative of the inflow with respect to time
        choices:
          - A volume in cubic metres — everything that arrived across the morning
          - A rate of rise, in cubic metres a second per hour
          - The steady flow that would have delivered the same volume in the same time
          - Whether the climb is getting steeper or slackening off
        mapping: [0, 1, 2, 3]
        why: >
          These four are built from one record and answer four questions, and the units separate them before
          any argument does. Integrating a flow multiplies cubic metres a second by seconds and returns cubic
          metres. Dividing that back by the interval returns a flow again. That is the average value of the
          function. It is not the average of the readings, unless they happen to be evenly spaced.
          Differentiating once gives the climb and twice gives the curvature. Curvature is the quantity that
          says whether a flood is still accelerating. That is what the evening committee actually needs, and
          it is the one nobody puts on a sheet.

  # ---------------------------------------------------------------- day 4
  # Unit 6 — the fundamental theorem, both parts, and the net change it licenses.
  - title: What fell, and what arrived
    objective: Add up a rate that only exists as readings, and say which way each way of adding it is wrong.
    briefing: Six hours of gauge readings and no formula behind any of them.
    stake: >-
      Wednesday. The front arrived overnight. Ekundayo has six hours of gauge readings, one
      every fifteen minutes. Sato wants the volume of water that has already reached the
      reservoir. That is a total built out of a rate. There is no formula to work from, only a
      column of numbers. Down in the gallery, Halina Zawadzka, the structural engineer, has the
      same job in miniature. Her seepage weirs are reading higher each hour. She has to pick
      which end of each interval to trust, and that choice moves the answer. Today you add up a
      rate that exists only as a column of numbers. Then you say which way each method of adding
      leans.
    takeaway: A rate known only at instants still accumulates, and every rule for adding it is wrong in a direction you can name.
    stops:
      - group: GATES
        task: Follow the rate from the hills to the sill
        title: What the rain has to pass through
        concept: The chain rule and composite quantities
        place: Gate Chamber
        scene: >
          Wilkes wants to know why the gate settings from this morning are already wrong. Berg, the flood engineer, puts
          the whole path on the board — rain, runoff, inflow, storage, level, head, discharge — and
          asks which step decides the answer.
        guide: >-
          Put the transfers in the order the rate actually travels. That order is rain to runoff to inflow to
          storage to level to head to discharge. Then name the one step that decides how much of it reaches
          the sill. Every relation on the path contributes a factor, and a path with a step missing is not a
          path. The largest number on the board is not automatically the governing link.
        background:
          - >-
              Why the whole path is a product. Each step is a relation with its own gain. How much rain becomes
              runoff. How much runoff arrives as inflow. How much inflow becomes stored volume. How volume becomes
              level. How level becomes head. Multiply the gains and you have how a millimetre of rain becomes a
              cubic metre a second at the sill.
          - >-
              What 'governing' means. Not the biggest term — the one whose value the answer
              is most limited by. A step that passes on nearly everything is not deciding
              anything, however large the numbers flowing through it. A step that throttles
              the rate sets what everything downstream can be.
          - >-
              Why the morning's settings went wrong. A gate schedule is written from an assumed path. One step's
              gain may have been assumed and be actually different. The catchment may be wetter than modelled. The
              level-to-head relation may be off by the sill's own geometry. Then every setting downstream of it
              inherits the error. That is what the board is for.
        assumes:
          - a rate reaches a distant quantity only through every relation that lies between them
          - a chain of rates is limited by the link whose own derivative is smallest
        takeaway: A related-rates problem is a chain, and the link with the smallest derivative governs how much of the rate arrives at the far end.
        format: CHAIN
        question: >-
          Put the transfers in the order the rate travels, then name the one that decides how much of
          it reaches the sill.
        chain:
          hint: >-
            Every relation on the path contributes a factor. A path with a step missing is not a path.
          links:
            - { id: runoff, label: Rainfall to catchment runoff, transfers: 'millimetres on the hills into cubic metres a second at the gauge' }
            - { id: inflow, label: Runoff to reservoir inflow, transfers: 'flow at the gauge into flow arriving at the dam' }
            - { id: storage, label: Net inflow to storage, transfers: 'a flow difference into a volume accumulating' }
            - { id: level, label: Storage to level, transfers: 'volume into height, divided by the surface area' }
            - { id: head, label: Level to head over the sill, transfers: 'reservoir height into height above the crest' }
            - { id: discharge, label: Head to spillway discharge, transfers: 'head into flow, through the three-halves power' }
          order: [runoff, inflow, storage, level, head, discharge]
          governing: level
          distractor: discharge
          commit: Name the governing transfer
        answerText: >-
          Runoff, inflow, storage, level, head, discharge — governed by storage into level, where
          dividing by 2.6 million square metres cuts the rate by 6 orders of magnitude.
        why: >
          Every link on this path multiplies the rate by its own derivative, and the product is what arrives.
          The spillway link is the one everybody watches because its exponent makes it dramatic. But three-
          halves of a square root is a factor near 40. The storage-to-level link divides by a surface area of
          2 and a half million. That single division is why a catchment can double its flow in a morning and
          the level move eight centimetres. It is also the link the resurvey is about to change, which is the
          reason it is worth naming now rather than in a week.
      - group: STRUCT
        task: Say which way a sum of readings is wrong
        title: Which end of the interval you believed
        concept: Riemann sums, left and right endpoints, and the trapezoid rule
        place: Seepage & Uplift Bay
        scene: >
          Zawadzka has hourly weir readings that climbed all shift, and two totals on the board from
          the same column of numbers. One used each hour's opening reading, the other its closing
          one, and they differ by a tenth.
        guide: >-
          The four answers differ in how confident they are willing to be. Two rank the
          totals against the truth, one refuses to rank them, one calls a total correct.
          What settles it is a fact already on the board: the seepage rose all shift.
          Ask what a rectangle built on a rising hour's first reading must do, and what
          one built on its last must do. Two totals that bracket the truth are worth
          more than one that is nearly right.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be the answer under
              one specific misreading. A step skipped. A quantity confused with a rate. A correlation taken for a
              cause. Identifying which misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance. That was 88 per
              cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason is
              indistinguishable from a sound one. That stays true until the day the approximation is
              what is being tested.
        assumes:
          - a rate multiplied by an interval gives the accumulation over that interval only if the rate is constant
          - a sum of rectangles approximates the area under a curve
        takeaway: For a rate that only rises, a left-endpoint sum is always short and a right-endpoint sum always long, and the truth is between them.
        format: CHOICE
        question: What can be said about the two totals without any further readings?
        choices:
          - The opening-reading total is short and the closing-reading total is long
          - Both are short, because rectangles cannot cover a rising curve
          - Neither can be ranked until the readings are taken more often
          - The closing-reading total is correct, since it uses the most recent value in each hour
        answer: The opening-reading total is short and the closing-reading total is long
        why: >
          Each rectangle is one hour wide and as tall as the reading it was built from. On an
          hour where the seepage only rises, the opening reading is the lowest value the rate
          took. That rectangle sits entirely under the curve. The closing reading is the
          highest, so its rectangle sits entirely over it. The rise is the whole argument, and
          it brackets the answer with no further measurement. That is worth more than either
          total, because it turns two disagreeing numbers into an interval the truth has to lie
          in.
        rebuttals:
          - Rectangles built on the closing reading of a rising hour stand above the curve, not below it.
          - More frequent readings narrow the gap between the two, but the ranking is already fixed by the rise.
          - The closing reading is the highest value in its hour, so using it for the whole hour overstates every hour.
      - group: SAFE
        task: Derive the steady release with the same total
        title: The release she would have made
        concept: Antiderivatives, and the constant an integration cannot recover
        place: Downstream Warning Desk
        scene: >
          Berg has this afternoon's schedule as Q(t) = 48 + 8t cubic metres a second, running 6
          hours. She wants the flat release with the same total, to set beside the one she asked for
          on the first day.
        guide: >-
          Build it a line at a time. The steady flow with the same total is the ramp's average over the six
          hours. One way to get it survives a schedule that is not a straight line. Integrate the ramp and
          divide by the interval. Finish with a flow in cubic metres a second, so it can be set beside the one
          she asked for on day one.
        background:
          - >-
              What a mean value of a function is. The average of Q over an interval is the integral of Q across
              it, divided by the length of the interval. That is the height of the rectangle with the same area as
              the curve. For a straight ramp that is the midpoint value, which is why this one can be checked in
              your head after the working is done.
          - >-
              Why the equivalence is worth writing down. A ramp and a flat release with the same total deliver the
              same water. They do very different things to the channel below. One arrives gently and ends high.
              The other is constant. Being able to state the flat equivalent is how two schedules get compared on
              anything other than their shape.
          - >-
              What day one was about. The release Berg asked for on the first day was chosen without this
              arithmetic. Setting the equivalent flat flow beside it settles one question. Does the schedule that
              has been argued about all fortnight actually differ in the water it moves? Or only in how it moves
              it?
        assumes:
          - a definite integral is evaluated as the difference of an antiderivative at the two ends
          - an average value is an accumulation divided by the length of its interval
        takeaway: Reducing a schedule to one steady rate is integrating it and dividing, and the two ends only average correctly because the schedule is a straight line.
        format: DERIVE
        question: >-
          Derive the steady flow that delivers the same six-hour total as the ramp.
        derive:
          hint: >-
            Integrate first, then divide. Name the move each line makes.
          start: 'Q(t) = 48 + 8t'
          startNote: 'cubic metres a second, t in hours from the start of the release'
          goal: 'the steady flow with the same six-hour total'
          steps:
            - ask: Integrate the schedule over the six hours.
              answer: 0
              candidates:
                - text: '[48t + 4t²] from 0 to 6 = 288 + 144 = 432'
                  rule: antiderivative
                - text: '[48t + 8t²] from 0 to 6 = 288 + 288 = 576'
                  rule: antiderivative
                  survives: true
                  why: >-
                    The antiderivative of 8t is 4t², because the exponent rises to 2 and the term is
                    divided by it. Left as 8t² this is a well-formed line that overstates the release
                    by a third and goes on behaving itself to the end.
                - text: '[48 + 4t²] from 0 to 6 = 144'
                  rule: antiderivative
                  why: >-
                    The constant 48 antidifferentiates to 48t. Left as 48 it takes the same value at
                    both ends and cancels, so 6 hours of base flow vanish from the total.
                - text: 'Q(6) − Q(0) = 96 − 48 = 48'
                  rule: evaluation
                  why: >-
                    That is the change in the rate across the six hours rather than the accumulation
                    of the rate. It answers how much the release grew, which nobody asked.
            - ask: Turn the accumulation into the steady flow with the same total.
              answer: 0
              candidates:
                - text: '432 ÷ 6 = 72 cubic metres a second'
                  rule: average
                - text: '432 cubic metres a second, since that is what the schedule delivers'
                  rule: evaluation
                  survives: true
                  why: >-
                    432 is the accumulation in the mixed units the integral produced, not a flow.
                    Published as a release it is six times too large, and nothing about the figure
                    looks wrong on the page.
                - text: '432 × 6 = 2592 cubic metres a second'
                  rule: average
                  why: >-
                    An average divides the accumulation by the interval. Multiplying gives a number
                    with no meaning and a release the spillway could not pass.
            - ask: Say why 72 is also the mean of the 2 end readings.
              answer: 2
              candidates:
                - text: 'because the average value of any rate is the mean of its endpoints'
                  rule: endpoint
                  survives: true
                  why: >-
                    True for a straight line and false in general. Applied to a curving hydrograph it
                    is out by several per cent in a direction that depends on the curvature, and it
                    is the shortcut that stops anybody integrating again.
                - text: 'because 48 and 96 are both whole multiples of 6'
                  rule: substitution
                  why: >-
                    A coincidence of these particular numbers rather than a property of the schedule.
                    Changing the 48 to a 50 leaves the endpoint result exactly as true.
                - text: 'because the rate is linear, so its average is the mean of its endpoints'
                  rule: endpoint
          commit: Report the steady flow
        answerText: >-
          72 cubic metres a second, steady, for 6 hours — the same total the ramp delivers, and the
          mean of its ends only because the ramp is a straight line.
        why: >
          Two steps and one trap. Integrating gives the total in the mixed units the formula was written in.
          Dividing by the interval turns it back into a rate. That is the definition of an average value. It
          works for any schedule at all. What does not work for any schedule is averaging the two ends. That
          happens to agree here, because a straight line spends as long above its midline as below. Carry that
          habit onto tomorrow's curved release and the published figure is wrong in the direction the
          curvature points.

  # ---------------------------------------------------------------- day 9
  # Unit 7 — a separable differential equation, and what one measurement does and
  # does not fix about its solution.
  - title: Two days of not deciding
    objective: Use an antiderivative to evaluate an accumulation, and say what the accumulation function's own rate is.
    briefing: The release that was deferred on Monday has to be made today, and the arithmetic for it is an integral.
    stake: >-
      Thursday. On Monday, Sunniva Berg asked for a release and did not get one. The water that
      would have gone out at 120 cubic metres a second now has to go out at 480. It goes into a
      river with people living beside it. This time the schedule is a formula, not a table. So
      the volume it delivers can be worked out exactly, instead of summed piece by piece. Today
      you use the fundamental theorem of calculus in both directions. One way, an antiderivative
      turns a rate into a total. The other way, a total hands a rate back. Berg wants to know
      what two days of waiting cost.
    takeaway: An antiderivative turns an accumulation into a subtraction, and an accumulation differentiates back to the rate that built it.
    stops:
      - group: SAFE
        task: Close the reservoir's ledger for the night
        title: What the level rise leaves out
        concept: The definite integral as an accumulation, and its units
        place: Downstream Warning Desk
        scene: >
          The reservoir gained 1.06 million cubic metres overnight. Berg has the inflow record beside it. She
          wants the total that arrived at the dam, not the part that stayed, before she sizes this afternoon's
          release.
        guide: >-
          Reading a stream costs nothing, so read them all. Then count only the ones that belong in the total
          she asked for. That total is the volume that arrived at the dam over twelve hours, not the part that
          stayed. The level rise is what remained after everything that left, so anything already leaving has
          to go back into the sum. Report the total when the ledger closes.
        background:
          - >-
              Why the rise is not the arrival. The reservoir gained 1.06 million cubic
              metres, and it gained that while the turbines, the spillway and the
              compensation flow were all taking water out. What arrived is what stayed plus
              everything that left, which is why a balance is a ledger rather than a
              reading.
          - >-
              What counting a stream claims. Reading is free and neutral; adding a stream to the total says that
              this water is part of the quantity being asked for. Some streams on the board are not. A gauge
              upstream that also appears in the inflow record would be counted twice. A rainfall figure over the
              reservoir surface may already be inside the level rise.
          - >-
              Why Berg wants arrivals before sizing a release. The release has to be set against what the
              catchment is actually delivering. Not against what the reservoir happened to keep while the machines
              were running. Using the rise would size this afternoon's release against a number that already had
              this morning's releases baked into it.
        assumes:
          - what accumulates is what is left after everything already leaving has left
          - a rate that runs throughout an interval contributes its rate times the whole interval
        takeaway: A net change is the integral of a difference, so every removal term has to be added back before the arrival is known.
        format: BALANCE
        question: >-
          Read what you need and report the total volume that arrived over the 12 hours.
        balance:
          hint: >-
            Reading a stream costs nothing. Counting it is the claim you are making about where the
            water went.
          total: { amount: 2160000, unit: m³, label: Volume that arrived over 12 hours }
          streams:
            - { id: rise, label: Storage gained overnight, value: 1060000, display: '1.06 million m³ from the level record' }
            - { id: machines, label: Passed through the machines, value: 950000, display: '22 m³/s for 12 hours = 950,000 m³', hidden: true, note: 'both units ran all night' }
            - { id: seepage, label: Seepage collected at the weirs, value: 150000, display: '3.5 m³/s for 12 hours = 150,000 m³', hidden: true, note: 'measured at the sump, runs continuously' }
            - { id: spill, label: Over the spillway, value: 0, display: 'gates shut all night' }
            - { id: rain, label: Rain falling on the reservoir surface, value: 0, display: 'counted at the inflow gauge already' }
          tolerance: 90000
          commit: Report the arrival
        answerText: >-
          About 2.16 million cubic metres arrived — the 1.06 that stayed, plus the 0.95 the machines
          passed and the 0.15 that seeped, both of which were leaving throughout.
        why: >
          The storage change is the integral of inflow minus outflow, so recovering the inflow means
          integrating every outflow term back in. Two of them are easy to miss for the same reason — nothing
          on the panel moves when they run. The machines and the seepage are steady rates that were on for the
          whole 12 hours. A steady rate integrates to rate times time without any further work. Report the
          1.06 and the catchment's yield is understated by half. That yield is the number every forecast for
          the rest of the week is scaled from.
      - group: GATES
        task: Total a release schedule exactly
        title: The schedule as a formula
        concept: Substitution, and carrying the limits across with the variable
        place: Gate Chamber
        scene: >
          Wilkes has this afternoon's ramp written as R(t) = 120 + 60t cubic metres a second, with t
          in hours from 2 o'clock. It runs for four hours and Berg wants the volume it will deliver
          before it starts.
        guide: >-
          Build it a line at a time. A volume is the integral of a flow over time. So the ramp's total is an
          integral of a linear function. The units have to be reconciled on the way. The flow is per second
          and the schedule is in hours. Finish with the volume in cubic metres.
        background:
          - >-
              Why integrate a straight line at all. The average of a linear ramp is its midpoint value, so this
              total can be had geometrically as the area of a trapezium. Doing it as an integral is worth the
              extra line. The same working survives a schedule that is not a straight line. Most real ones are
              not.
          - >-
              Where the units bite. R is in cubic metres a second and t is in hours, so
              integrating without converting gives an answer 3,600 times too small. The safe
              habit is to put the conversion into the integrand rather than remembering it
              at the end, where it looks like a factor somebody invented.
          - >-
              Why Berg wants it before it runs. A four-hour release is a commitment of water
              that cannot be recalled. Knowing the volume beforehand is what lets it be
              checked against what the reservoir can spare and what the channel below can
              take.
        assumes:
          - the accumulation of a rate over an interval is the definite integral of that rate
          - an antiderivative of a power of t raises the exponent by one and divides by the new exponent
        takeaway: The fundamental theorem evaluates an accumulation as the difference of an antiderivative at the two ends, so no sum is needed when a formula exists.
        format: DERIVE
        question: >-
          Evaluate the volume the four-hour ramp delivers, in cubic metres.
        derive:
          hint: >-
            Antidifferentiate first, then evaluate. Name the rule each line uses.
          start: 'R(t) = 120 + 60t'
          startNote: 'cubic metres a second, t in hours from 14:00'
          goal: 'the volume delivered between t = 0 and t = 4'
          steps:
            - ask: Write an antiderivative of the rate.
              answer: 1
              candidates:
                - text: 'F(t) = 120t + 60t²'
                  rule: antiderivative
                  why: >-
                    The antiderivative of 60t raises the exponent to 2 and divides by it. Left
                    undivided this doubles the whole ramp term.
                - text: 'F(t) = 120t + 30t² + C'
                  rule: antiderivative
                - text: 'F(t) = 120 + 30t² + C'
                  rule: antiderivative
                  survives: true
                  why: >-
                    The constant term 120 antidifferentiates to 120t, not to 120. It looks like a
                    tidy line and it drops 4 hours of base flow — about 1.7 million cubic metres —
                    without changing anything else on the page.
                - text: "F(t) = 60"
                  rule: antiderivative
                  why: >-
                    That is the derivative of the rate rather than an antiderivative of it. It answers
                    how fast the ramp steepens, which is not a volume.
            - ask: Evaluate it between the two ends of the four hours.
              answer: 2
              candidates:
                - text: 'F(4) = 120×4 + 30×16 + C = 960 + C'
                  rule: evaluation
                  why: >-
                    A definite integral is a difference of two values, and the constant cancels in
                    that difference. A volume that still contains an unknown C is not a number.
                - text: 'F(4) − F(0) = 960 − 0 = 960 cubic metres'
                  rule: evaluation
                  survives: true
                  why: >-
                    The arithmetic is right and the units are not. The rate is per second and t is in
                    hours, so this figure is in cubic-metre-hours per second and is short of the truth
                    by a factor of 3,600.
                - text: 'F(4) − F(0) = 960, then × 3600 = 3.46 million cubic metres'
                  rule: units
                - text: 'F(4) − F(0) = 960, then ÷ 3600 = 0.267 cubic metres of water'
                  rule: units
                  why: >-
                    Converting hours to seconds multiplies the interval, so it multiplies the
                    accumulation. Dividing turns four hours of a major release into a bucketful.
          commit: Report the volume
        answerText: >-
          About 3.46 million cubic metres — 960 in the units the formula was written in, times the
          3,600 seconds in each of its hours.
        why: >
          The fundamental theorem is what makes this a subtraction rather than a sum. Any
          antiderivative works, because the constant appears at both ends and cancels. That is
          why a definite integral is a number while an indefinite one is a family. What costs
          people the answer is not the calculus but the bookkeeping under it. The rate is
          measured per second and the variable is counted in hours. So the integral comes out in
          mixed units, and it has to be converted once, at the end, deliberately.
      - group: STORE
        task: Say what the accumulation curve's own slope is
        title: The curve that is already the answer
        place: Storage & Level Board
        scene: >
          Ferrand keeps a running total of everything that has arrived since Monday, plotted as one
          rising curve. Rasmussen, the survey engineer, asks what its slope at any point is, and whether that is a new
          measurement or an old one.
        guide: >-
          Every option here is a real quantity of this record. They differ in whether
          they name a total, a rate, an average, or a rate of a rate. A slope is a rate,
          so whatever answers this has to carry the units a rate carries. If the curve
          and the gauge are two views of one record, a disagreement between them is a
          bookkeeping error and not a flood.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be the answer under
              one specific misreading. A step skipped. A quantity confused with a rate. A correlation taken for a
              cause. Identifying which misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance. That was 88 per
              cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason is
              indistinguishable from a sound one. That stays true until the day the approximation is
              what is being tested.
        takesAsRead:
          - The definite integral as an accumulation, and its units
        assumes:
          - an accumulation function reports the total of a rate from a fixed start up to a moving end
          - a derivative reports the slope of a curve at a point
        takeaway: The slope of an accumulation curve at any instant is the rate that was arriving at that instant. Differentiating an integral returns what was integrated.
        format: CHOICE
        question: What is the slope of the running-total curve at four o'clock on Wednesday?
        choices:
          - The inflow at four o'clock on Wednesday
          - The total volume that had arrived by four o'clock on Wednesday
          - The average inflow between Monday and four o'clock on Wednesday
          - The rate at which the inflow itself was changing at four o'clock on Wednesday
        answer: The inflow at four o'clock on Wednesday
        why: >
          The running total is an accumulation function, with a lower end fixed on Monday and an
          upper end that moves. Push that upper end forward by a small interval and it gains the
          volume arriving during it. That volume is the inflow times the interval, so the slope
          is the inflow itself. This is the first part of the fundamental theorem, and its use
          here is practical. It means the gauge and the total curve are two views of one record.
          A total curve that steepens where the gauge did not is a bookkeeping error rather than
          a flood.
        rebuttals:
          - The total is the height of the curve at that point, which is what the slope is being distinguished from.
          - The average is the height divided by the elapsed time, a chord from Monday rather than a tangent at Wednesday.
          - The rate of change of the inflow is the curve's second derivative, one differentiation further on.

  # ---------------------------------------------------------------- day 5
  # Units 3/4 — implicit differentiation, and related rates as a chain of transfers.
  - title: The last half metre
    objective: Differentiate a relation that will not solve, and follow a rate through everything it passes.
    briefing: Two quantities tied by a curve nobody can rearrange, and one rate that has to travel four steps.
    stake: >-
      Friday. The head of water over the spillway sill has climbed into a new part of the rating
      curve. Up here the last half metre does more work than the first two did. Bo Ferrand
      cannot rearrange the stage to storage curve into a neat formula for the level. That does
      not stop the level from having a rate. In the gallery, the uplift gauges are tied to the
      reservoir by a relation with the unknown on both sides. Anand wants the same arithmetic
      done for the machines. Today you differentiate a relation without solving it first. Then
      you follow one rate the whole way, from rain on the hills to water past the sill.
    takeaway: A relation can be differentiated where it cannot be rearranged, and a rate travels through every relation between its ends.
    stops:
      - group: STORE
        task: Turn a net flow into a rate of level
        title: Why the same inflow moves the level differently
        concept: Related rates
        place: Storage & Level Board
        scene: >
          Ferrand has the net inflow at 28 cubic metres a second and the surface area at this level
          at 2.6 square kilometres. Halloran wants tomorrow morning's level, which means a rate and
          not a volume.
        guide: >-
          The numbers offered describe two different states of the reservoir and two
          different quantities. One area belongs to this level; another belongs to
          winter drawdown. One flow is the net figure; another is what one machine
          passes. A relationship is only true of the state it was written for. Using an
          area from a lower level makes the level rise faster on paper than it does in
          the valley.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. Two things are being tested. Can you pick the quantities the relationship actually needs? And does the
              size of the answer look right once they are in place?
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch is caught before it is placed. It is also how a quantity
              belonging to a different part of the problem is caught. That is the habit this format
              exists to build.
        assumes:
          - a volume rate divided by a plan area is a rate of level
          - the surface area of a reservoir depends on the level it is holding
        takeaway: A level rate is a volume rate divided by the area it is spread over, and that area is itself a function of the level.
        format: BALLPARK
        question: Estimate how fast the level is rising with 28 cubic metres a second net inflow.
        why: >
          The relation is dh/dt = (I − O) ÷ A(h), and the part that makes it calculus rather than division is
          that A depends on h. The same net inflow buys less height the higher the reservoir gets. So the
          level rate falls while nothing about the water changes. A straight-line forecast made this morning
          drifts high by the afternoon. It is also the first appearance of the term that the resurvey is going
          to move. Every level forecast on this site divides by an area somebody measured in 2003.
        estimate:
          prompt: >
            Net inflow is 28 cubic metres a second and the surface area at this level is
            2.6 square kilometres, which is 2.6 million square metres. A day is 86,400 seconds.
          question: Choose the net rate, the area and the seconds in a day.
          labels:
            - 28  (net inflow, cubic metres a second)
            - 2600000  (surface area at this level, square metres)
            - 86400  (seconds in a day)
            - 1400000  (surface area at winter drawdown, square metres)
            - 12  (machine flow, cubic metres a second)
          values: [28, 2600000, 86400, 1400000, 12]
          slots: 3
          template: '{0} ÷ {1} × {2}'
          formula: a/b*c
          correct: [0, 1, 2]
          target: 0.93
          tolerance: 0.12
          units: metres a day
          solution: 28 ÷ 2,600,000 × 86,400 ≈ 0.93 m a day.
          explanation: >
            About 0.93 metres a day. The identical net inflow at winter drawdown, spread over
            1.4 square kilometres, raises the level by 1.7 metres a day — nearly twice as fast, with
            nothing about the water having changed. The area is the variable, and it is not constant.
          givens:
            - Net inflow 28 m³/s
            - Surface area 2.6 km² at this level
          relationship: >
            dh/dt = (I − O) ÷ A(h), with A the surface area at that level — the same net flow moves
            the level more slowly the wider the reservoir has become.
        answerText: About 0.93 metres a day at this level, and rather less once the level has risen.
      - group: STRUCT
        task: Differentiate a relation with the unknown on both sides
        title: The curve that will not rearrange
        place: Seepage & Uplift Bay
        scene: >
          Zawadzka has the foundation relation as U² + 0.8·U·h = 640, tying uplift pressure to
          reservoir level. Nobody has ever solved it for U, and she wants the rate of uplift while
          the level is climbing.
        guide: >-
          Build it a line at a time. The relation ties U and h together and cannot be rearranged for U. So
          differentiate it as it stands, implicitly, with respect to time. Both dU/dt and dh/dt appear. Solve
          the result for dU/dt and evaluate it at the stated values.
        background:
          - >-
              Why implicit differentiation is not a trick. Every term is a function of time because U and h both
              are. Differentiating both sides therefore requires the product rule on the U·h term. It requires the
              chain rule wherever U appears. The outcome is one linear equation in dU/dt. That can be solved
              without ever solving for U.
          - >-
              Why this relation resists rearranging. U² + 0.8Uh = 640 is quadratic in U with a coefficient that
              depends on h. So U can be written in closed form only through the quadratic formula and a square
              root. That square root must be tracked for sign. Differentiating first avoids all of that and gives
              the rate directly.
          - >-
              Why uplift is what she is asking about. Water working under a dam pushes upwards, and that pressure
              is subtracted from the weight holding the structure down. A rate of uplift as the reservoir climbs
              is therefore a rate at which the safety margin is being spent. That is why it is wanted while the
              level is still rising.
        assumes:
          - a relation between two quantities can be differentiated without being solved
          - a product of two quantities that both change contributes two terms
        takeaway: Implicit differentiation gets a rate out of a relation that cannot be rearranged, by differentiating both sides as they stand.
        format: DERIVE
        question: >-
          Derive dU/dt from the relation as it stands, and evaluate it at U = 20, h = 25.
        derive:
          hint: >-
            Differentiate both sides with respect to time. U depends on t, so every U carries dU/dt.
          start: 'U² + 0.8·U·h = 640'
          startNote: 'U in kilopascals, h in metres above datum'
          goal: 'dU/dt in terms of dh/dt'
          steps:
            - ask: Differentiate both sides with respect to time.
              answer: 0
              candidates:
                - text: '2U·(dU/dt) + 0.8·((dU/dt)·h + U·(dh/dt)) = 0'
                  rule: implicit
                - text: '2U + 0.8·(h + U·(dh/dt)) = 0'
                  rule: implicit
                  survives: true
                  why: >-
                    Every U on the left is a function of t and must carry its own dU/dt. Dropping
                    them differentiates U as though it were the variable, and the line that results
                    is still solvable and still wrong.
                - text: '2U·(dU/dt) + 0.8·(dU/dt)·(dh/dt) = 0'
                  rule: product
                  why: >-
                    The product rule gives a sum of two terms, not a product of two derivatives. It
                    also loses the h and the U that each surviving term needs.
                - text: '2U·(dU/dt) + 0.8·((dU/dt)·h + U·(dh/dt)) = 640'
                  rule: constant
                  why: >-
                    640 is a constant, and the derivative of a constant is 0. Carrying it across
                    unchanged makes the relation a different equation entirely.
            - ask: 'Solve for dU/dt and evaluate at U = 20, h = 25, with dh/dt = 0.4 m a day.'
              answer: 1
              candidates:
                - text: 'dU/dt = −0.8·U·(dh/dt) ÷ (2U + 0.8h) = −0.8×20×0.4 ÷ 40 = −0.16 kPa a day'
                  rule: implicit
                  why: >-
                    The denominator is 2U + 0.8h, which is 40 + 20 = 60, not 40. Using 2U alone drops
                    the whole product term from the collection.
                - text: 'dU/dt = −0.8·U·(dh/dt) ÷ (2U + 0.8h) = −0.8×20×0.4 ÷ 60 ≈ −0.107 kPa a day'
                  rule: implicit
                - text: 'dU/dt = +0.8·U·(dh/dt) ÷ (2U + 0.8h) ≈ +0.107 kPa a day'
                  rule: implicit
                  survives: true
                  why: >-
                    Moving the term across the equals sign changes its sign, and this line keeps it
                    positive. The magnitude is right, so it agrees with the correct answer on every
                    check except the one that matters — which way the gauge is about to move.
          commit: Report the rate
        answerText: >-
          About −0.107 kilopascals a day at that point on the curve — falling, even though the
          reservoir behind it is rising.
        why: >
          Implicit differentiation exists for exactly this case. The relation ties two
          quantities without expressing either as a formula for the other. Differentiating both
          sides as they stand costs nothing. Every appearance of the dependent quantity carries
          its own rate by the chain rule, and that is the step that gets dropped. What comes out
          is a sign nobody would guess from the story. The uplift is falling while the reservoir
          climbs, because the relation is not a straight line, and only differentiating it says
          so.
      - group: POWER
        task: Get one rate out of another through a fixed relation
        title: What the machines make of a rising head
        place: Powerhouse
        scene: >
          Anand has the head on the machines rising at 0.31 metres a day with both units passing a
          steady 46 cubic metres a second. She wants the rate of change of output for the grid
          schedule, in kilowatts a day.
        guide: >-
          Five numbers, and the trap is that all of them are true of the machines this
          morning. Two are rates and three are standing values. The product rule needs
          each rate paired with the right factor, so ask of every number whether it is a
          level or a speed. A rate that is zero today is still a term in the
          relationship. It stops being zero the moment somebody touches a gate.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. Two things are being tested. Can you pick the quantities the relationship actually needs? And does the
              size of the answer look right once they are in place?
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch is caught before it is placed. It is also how a quantity
              belonging to a different part of the problem is caught. That is the habit this format
              exists to build.
        assumes:
          - a product with one factor held constant differentiates to the constant times the other rate
          - a rate of change carries the units of the quantity divided by the units of time
        takeaway: With one factor of a product held fixed, the whole rate comes from the other, scaled by the constant that was standing still.
        format: BALLPARK
        question: Estimate how fast the machine output is rising, in kilowatts a day.
        why: >
          The output is 8.6·Q·H and the flow is not moving, so the first term of the product rule is 0 and the
          entire rate is 8.6·Q·(dH/dt). What survives is a multiplication. There is still a reason to write
          the product rule down. Today's 0 is an accident of the gate settings. The moment anybody touches a
          gate the other term reappears. Then this number is wrong by more than it is right. It is also the
          rate that pays for the fortnight, which is why Halloran asks for it every morning.
        estimate:
          prompt: >
            Output is 8.6·Q·H kilowatts. The flow Q is steady at 46 cubic metres a second, so its
            rate is 0, and the head is rising at 0.31 metres a day.
          question: Choose the constant, the flow and the rate the head is rising at.
          labels:
            - 8.6  (the constant in front of the product)
            - 46  (flow through the machines, cubic metres a second)
            - 0.31  (rate the head is rising, metres a day)
            - 61  (head on the machines, metres)
            - 0  (rate the flow is changing, cubic metres a second per day)
          values: [8.6, 46, 0.31, 61, 0]
          slots: 3
          template: '{0} × {1} × {2}'
          formula: a*b*c
          correct: [0, 1, 2]
          target: 122.6
          tolerance: 12
          units: kilowatts a day
          solution: 8.6 × 46 × 0.31 ≈ 123 kilowatts a day.
          explanation: >
            About 123 kilowatts a day, from the head alone. Multiplying by the head instead of by its
            rate gives 24,000 and is the total output, not its rate — a mistake that reads as
            plausible because the units are never written down.
          givens:
            - Output P = 8.6·Q·H kilowatts
            - Q steady at 46 m³/s, head rising at 0.31 m a day
          relationship: >
            dP/dt = 8.6·((dQ/dt)·H + Q·(dH/dt)), and with dQ/dt 0 the first term vanishes and only
            8.6·Q·(dH/dt) is left.
        answerText: About 123 kilowatts a day, entirely from the head.

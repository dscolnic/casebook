  stops:
  - group: INFLOW
    task: Turn a column of readings into a volume
    title: Adding up a curve nobody wrote down
    at: trace-bench
    reason: >-
      June Sato needs a running volume out of five readings before she can say how
      much of the forecast has already arrived.
    place: Catchment & Inflow Desk
    scene: >
      Ekundayo has 5 readings an hour and a half apart — 48, 60, 74, 87 and 96 cubic metres a
      second. June Sato, the forecast liaison, is asking for the volume already in, and there is no equation behind
      any of
      it.
    guide: >-
      The five numbers are all sums of the same readings, made in different ways.
      One halves the two ends before adding; one does not. One adds every reading
      flat. The rule the volume comes from decides which sum is the right one, so
      read the rule before the numbers. Counting an end reading at full weight adds
      water that never arrived, and the error grows with every extra interval.
    background:
    - >-
      Why an estimate rather than a calculation. Every quantity on this board is
      already measured or stated, so nothing here has to be derived. Two things are being tested. Can you pick the
      quantities the relationship actually needs? And does the
      size of the answer look right once they are in place?
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the
      relationship it is going into. Reading the label is how a unit mismatch is caught before it is placed. It
      is also how a quantity
      belonging to a different part of the problem is caught. That is the habit this format
      exists to build.
    assumes:
    - the area under a flow-against-time curve is a volume
    - a trapezium's area is the average of its two parallel sides times its width
    takeaway: The trapezoid rule adds an unwritten curve by averaging each pair of readings, so the interior 
      readings are counted twice as heavily as the ends.
    format: BALLPARK
    question: Estimate the volume that arrived over those six hours.
    why: >
      The fundamental theorem says the accumulated volume is the area under the flow curve.
      Nothing in it requires a formula, because a list of readings has an area too. The
      trapezoid rule averages each adjacent pair of readings. That is why every interior
      reading is used by two trapezia and each end reading by one. It is exact on any
      stretch where the flow runs in a straight line. On a rise that curves upward it reads
      slightly high, which is the direction to know before it goes to a committee.
    estimate:
      prompt: >
        Readings 48, 60, 74, 87, 96 m³/s, taken 1.5 hours apart. The trapezoid rule adds half
        the first and last readings to all the interior ones, then multiplies by the interval.
        1.5 hours is 5,400 seconds.
      question: Choose the half-ends term, the interior sum and the interval in seconds.
      labels:
      - 72  (half of the first and last readings added)
      - 221  (the three interior readings added)
      - 5400  (seconds in each interval)
      - 144  (the first and last readings added, not halved)
      - 365  (all 5 readings added)
      values: [72, 221, 5400, 144, 365]
      slots: 3
      template: '({0} + {1}) × {2}'
      formula: (a+b)*c
      correct: [0, 1, 2]
      target: 1582200
      tolerance: 150000
      units: cubic metres
      solution: (72 + 221) × 5,400 ≈ 1.58 million cubic metres.
      explanation: >
        About 1.58 million cubic metres in 6 hours. A left-endpoint sum over the same readings
        gives 1.40 million and a right-endpoint sum 1.66 — the trapezoid result is the average of
        those 2, and the true area is close to it because the rise is nearly straight.
      givens:
      - Readings 48, 60, 74, 87, 96 m³/s at 1.5-hour spacing
      - 6 hours in total, 5,400 seconds per interval
      relationship: >
        Volume ≈ Δt × (½Q₀ + Q₁ + Q₂ + Q₃ + ½Q₄) — the trapezoid rule, which is every pair of
        readings averaged and added.
    answerText: About 1.58 million cubic metres over the 6 hours.
  - group: GATES
    task: Differentiate the spillway relation
    title: A gate is not a tap
    at: hoist-stand
    reason: >-
      Reggie Wilkes is about to wind the gate open on the strength of this relation,
      and the last half metre is where a wrong guess costs the most.
    concept: The power rule
    place: Gate Chamber
    scene: >
      Reggie Wilkes, the gate mechanic, has the spillway rating on the wall, Q = C·L·H^(3/2) with C·L equal to 21.0.
      The
      head over the sill is 2.0 metres and rising, and the control room wants the discharge rate
      rather than the discharge.
    guide: >-
      Build it a line at a time. The control room wants a rate of change of discharge, not a discharge. So
      this is a related-rates problem. Differentiate the rating with respect to time, and the chain rule
      brings dH/dt along. Evaluate what you derive at a head of two metres.
    background:
    - >-
      Why the chain rule is what appears. Q depends on H, and H depends on time, so Q's dependence on time
      runs through H. Differentiating the rating therefore produces a factor for how Q responds to H. It
      also produces a factor for how fast H is moving. The second is the number the gauge is giving you.
    - >-
      Why a gate is not a tap. A tap's flow is proportional to how far it is open. A
      spillway's discharge goes as head to the power of three halves, so the same
      centimetre of level does more the deeper the water over the sill. The rating
      is nonlinear, and the operator's intuition has to be too.
    - >-
      What the control room does with a rate. A discharge tells you what is going
      out now. Its rate of change tells you how much time you have before it exceeds
      the channel downstream, and that is the number a warning is issued on.
    assumes:
    - the discharge over a weir depends on the head raised to a power
    - a quantity that changes because another one changes needs the chain rule
    takeaway: The power rule brings the exponent down and reduces it by one; the chain rule supplies the inner
      rate.
    format: DERIVE
    question: >-
      Derive how fast the discharge rises as the head rises, and evaluate it at 2.0 metres.
    derive:
      hint: >-
        Pick the line that actually follows from the one above it.
      start: 'Q = C·L·H^(3/2)'
      startNote: the spillway rating, with C·L = 21.0
      goal: 'dQ/dt in terms of dH/dt'
      steps:
      - ask: Differentiate both sides with respect to time.
        answer: 0
        candidates:
        - text: 'dQ/dt = C·L·(3/2)·H^(1/2)·dH/dt'
          rule: chain
        - text: 'dQ/dt = C·L·(3/2)·H^(1/2)'
          rule: power
          survives: true
          why: >-
            H depends on t, so differentiating with respect to t carries a factor of dH/dt.
            Without it this is dQ/dH — a slope, correct about a question nobody asked, and
            respectable enough to survive the rest of the derivation.
        - text: 'dQ/dt = C·L·(3/2)·H^(3/2)·dH/dt'
          rule: chain
          why: >-
            The power rule takes the exponent down by one. Left at 3/2 this is not the
            derivative of anything.
        - text: 'dQ/dt = C·L·H^(1/2)·dH/dt'
          rule: chain
          why: >-
            The 3/2 that comes down in front is part of the power rule, not a constant that
            can be folded into C·L.
      - ask: 'Evaluate it, with C·L = 21.0 and H = 2.0 m.'
        answer: 2
        candidates:
        - text: 'dQ/dt = 21.0 × 1.5 × 2.00 × dH/dt = 63.0·dH/dt'
          rule: power
          why: >-
            H^(1/2) at 2.0 m is the square root of 2, about 1.41. Using 2.00 evaluates H
            rather than its square root.
        - text: 'dQ/dt = 21.0 × 1.5 × 1.50 × dH/dt = 47.3·dH/dt'
          rule: power
          why: >-
            The 3/2 is already in front as the 1.5. Using it twice applies the power rule
            twice.
        - text: 'dQ/dt = 21.0 × 1.5 × 1.41 × dH/dt = 44.5·dH/dt'
          rule: power
        - text: 'dQ/dt = 21.0 × 1.41 × dH/dt = 29.7·dH/dt'
          rule: power
          survives: true
          why: >-
            This is the arithmetic of the line whose 3/2 never came down. Nothing about it
            looks broken, which is exactly why the mistake survives to the bottom of the
            page.
      commit: Report the rate
    answerText: >-
      dQ/dt ≈ 44.5·dH/dt — so a head rising at 0.02 m/min raises the discharge by about
      0.9 cubic metres a second every minute.
    why: >
      The exponent 3/2 is the whole behaviour of a spillway. The power rule brings it down as a factor and
      drops it to 1/2. So the sensitivity of discharge to head grows as the square root of the head. The
      last half metre does far more than the first. The chain rule then supplies dH/dt, because nothing
      here is a function of the head directly; it is a function of time through the head. Drop that factor
      and the answer is a slope with respect to the wrong variable, in units nobody checks.
  - group: SAFE
    task: Say what each expression is a measurement of
    title: Which quantity is which
    at: warning-list
    reason: >-
      Nadine Baptiste has to label each expression correctly before this evening's
      committee reads whichever number sits nearest the top.
    concept: The definite integral as an accumulation, and its units
    place: Downstream Warning Desk
    scene: >
      Baptiste has four expressions on the briefing sheet, all built from the same inflow record. A
      committee this evening will read whichever number is nearest the top. She wants each one labelled
      before it goes out.
    guide: >-
      Four expressions, all built from one inflow record, and the units separate
      them before any argument does. Integrating a flow multiplies a rate by time;
      differentiating divides by it. Read the units off each expression first, and
      the pairing follows. A committee reads the top figure on a sheet and cannot
      tell a volume from a rate. The label is the whole safeguard.
    background:
    - >-
      Why this is a matching board and not four separate questions. Responses on boards like this are
      written to be plausible for more than one situation. Choosing them one at a time lets a nearly-right
      answer through unexamined. Having to place all of them forces the comparison — not "is this
      reasonable here", but "is it more right here than there".
    - >-
      How to use the one-each rule. Because the responses are a set to be
      distributed rather than a list to be sampled, every join you make constrains
      the rest. Settling the two you are confident of can leave the remaining pair
      decided by elimination. Where it does not, two responses are still competing
      for one situation, and that is exactly the distinction the stop is testing.
    - >-
      Why you cannot be wrong about exactly one. With every response used once, three correct joins leave
      the fourth with only one place to go. Any error therefore involves at least two joins. That is worth
      remembering when the last pair looks forced. The fault is usually not in the join you are struggling
      with. It is in one you made early and stopped questioning.
    takesAsRead:
    - Riemann sums, left and right endpoints, and the trapezoid rule
    assumes:
    - integrating a rate over an interval gives a total, and differentiating a total gives a rate
    - the units of an expression follow from the units of the things it is built from
    takeaway: A rate, its accumulation and the rate of the rate are three different measurements of the same 
      record, and only their units tell them apart.
    format: PROTOCOL
    question: Match each expression to the quantity it actually reports.
    columns: [Expression, What it reports]
    scenarios:
    - The integral of the inflow between six and noon
    - The derivative of the inflow with respect to time
    - The integral of the inflow between six and noon, divided by the six hours
    - The second derivative of the inflow with respect to time
    choices:
    - A volume in cubic metres — everything that arrived across the morning
    - A rate of rise, in cubic metres a second per hour
    - The steady flow that would have delivered the same volume in the same time
    - Whether the climb is getting steeper or slackening off
    mapping: [0, 1, 2, 3]
    why: >-
      These four expressions answer four different questions, and the units separate them first. Integrating a flow
      over seconds returns cubic metres. Dividing that volume by the duration returns a flow: the function's average
      value. That is not, in general, the simple arithmetic mean of the sampled readings—even equally spaced readings
      only approximate the integral unless the shape makes the shortcut exact. Differentiating once gives the climb;
      differentiating twice gives how that climb is changing.


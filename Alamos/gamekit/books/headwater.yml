  - title: Three things before nine
    objective: Integrate a difference, read its sign, and substitute your way through an integrand nobody can antidifferentiate as it stands.
    briefing: Two curves crossing at four o'clock, and a load record that will not integrate as written.
    stake: >-
      Saturday. Three jobs have to close before the nine o'clock call. Baptiste has the inflow
      and the release drawn on one pair of axes. The two lines cross in the middle of the
      afternoon. Her committee will read the shaded region between them as though it were a
      total. Wilkes has a window between eight and two, when the inflow ran clear of the
      release. He wants to know what that window added. Ekundayo has the suspended load record
      from the peak. It is a fraction with the variable in both halves, and it will not
      integrate as written. Today you integrate a difference and read what its sign is telling
      you. One of the three needs a substitution first.
    takeaway: An integral of a difference carries the difference's sign, and an integrand that resists is usually one substitution away from an ordinary one.
    stops:
      - group: SAFE
        task: Say what the shaded region actually totals
        title: The region and the number
        place: Downstream Warning Desk
        scene: >
          Baptiste has inflow above release until four o'clock and below it afterwards, with the
          region between them shaded on the committee sheet. She wants the caption right before the
          sheet leaves the room.
        guide: >-
          Three of the options describe the shaded region and one describes the
          integral, and today those are not the same object. The inflow runs above the
          release for part of the day and below it for the rest. Decide whether the
          quantity in question keeps its sign or throws it away. A caption that swaps
          the two overstates the day by exactly twice the afternoon.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be the answer under
              one specific misreading. A step skipped. A quantity confused with a rate. A correlation taken for a
              cause. Identifying which misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance. That was 88 per
              cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason is
              indistinguishable from a sound one. That stays true until the day the approximation is
              what is being tested.
        takesAsRead:
          - The definite integral as an accumulation, and its units
        assumes:
          - the storage change over an interval is the integral of inflow minus release
          - an integrand that changes sign contributes negatively where it is negative
        takeaway: An integral of a difference is a signed total, so the afternoon subtracts from the morning rather than adding to it.
        format: CHOICE
        question: Across the whole day, what does the integral of inflow minus release give?
        choices:
          - The net change in storage over the day
          - The total area between the two curves
          - The storage gained in the morning only
          - The average gap between the two curves
        answer: The net change in storage over the day
        why: >
          Where the inflow runs above the release, the integrand is positive and the reservoir
          fills. After four o'clock it is negative and the reservoir empties, and the integral
          subtracts that part. The shaded region on the sheet is the integral of the absolute
          difference. That is a larger number and not a storage change at all. It is the total
          water that moved either way. A caption calling the shading what the reservoir gained
          overstates the day by exactly twice the afternoon.
        rebuttals:
          - Area is unsigned, so the afternoon adds to it. The integral subtracts the afternoon instead.
          - The morning alone is the integral up to four o'clock, which is a different limit of integration.
          - Dividing by the length of the day would give the average, and nothing here has been divided.
      - group: GATES
        task: Total the window where the inflow ran clear
        title: What the gap between them added
        place: Gate Chamber
        scene: >
          Wilkes has 6 hours from 8 until 2 where the inflow averaged 96 cubic metres a
          second and the release held at 62. He wants what the reservoir took on in that window.
        guide: >-
          Five numbers, two of which are rates that belong on opposite sides of a
          subtraction, and one of which is those two added together. A window of gain is
          what one rate exceeds the other by, held for a length of time. Sort the
          numbers into rates and durations before doing anything with them. Adding the
          rates instead of differencing them describes a reservoir with no machines
          running and no gates open.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. Two things are being tested. Can you pick the quantities the relationship actually needs? And does the
              size of the answer look right once they are in place?
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch is caught before it is placed. It is also how a quantity
              belonging to a different part of the problem is caught. That is the habit this format
              exists to build.
        takesAsRead:
          - The definite integral as an accumulation, and its units
        assumes:
          - the storage gained over an interval is the integral of the difference of two rates
          - 6 hours is 21,600 seconds
        takeaway: The volume between two rate curves is the integral of their difference, which for two steady rates is a rectangle and nothing more.
        format: BALLPARK
        question: Estimate the volume the reservoir gained between eight and two.
        why: >
          Two curves and one integral. The storage gained is the area between them. That is the integral of
          the difference rather than the difference of two integrals worked separately. It is the same number,
          and much less arithmetic. On a window where both rates hold steady the integral collapses to a
          rectangle, and the only thing that can go wrong is integrating the inflow alone. That gives 2.07
          million and describes a reservoir with no machines running and no gates open, which is not the one
          anybody is standing in.
        estimate:
          prompt: >
            The inflow averaged 96 cubic metres a second and the release held at 62, for 6 hours.
            6 hours is 21,600 seconds.
          question: Choose the inflow, the release and the seconds in the window.
          labels:
            - 96  (average inflow, cubic metres a second)
            - 62  (release held, cubic metres a second)
            - 21600  (seconds in the 6 hours)
            - 158  (the 2 rates added together)
            - 6  (hours in the window)
          values: [96, 62, 21600, 158, 6]
          slots: 3
          template: '({0} − {1}) × {2}'
          formula: (a-b)*c
          correct: [0, 1, 2]
          target: 734400
          tolerance: 70000
          units: cubic metres
          solution: (96 − 62) × 21,600 ≈ 734,000 cubic metres.
          explanation: >
            About 734,000 cubic metres, which at this level is 9 centimetres on the gauge.
            Integrating the inflow alone gives 2.07 million and 3 times the level rise, which is
            the number that gets quoted whenever the release is forgotten.
          givens:
            - Inflow about 96 m³/s, release held at 62 m³/s
            - The window ran six hours
          relationship: >
            Volume between the curves = ∫(I − R)dt, which for two steady rates is simply their
            difference multiplied by the length of the window.
        answerText: About 734,000 cubic metres gained between 10.
      - group: INFLOW
        task: Integrate a record that resists as written
        title: The integrand that had to be changed
        place: Catchment & Inflow Desk
        scene: >
          Ekundayo has the suspended load at the gauge as L(t) = 60t ÷ (t² + 4) tonnes an hour, with
          t measured from the peak. Rasmussen wants the four-hour total for the resurvey file.
        guide: >-
          You build the working a line at a time, choosing at each step the expression the line above actually
          gives you. Every wrong branch is legal algebra, so you cannot spot the answer by looking for a
          malformed line. The total load over four hours is an integral of the rate. The integrand here is the
          kind that wants a substitution rather than a rule.
        background:
          - >-
              Why a total is an integral. The gauge reports a rate — tonnes an hour — and
              the file wants tonnes. Multiplying a rate by four hours would be right only if
              the rate held still, and this one falls away from the peak. Integrating is
              what adding up a changing rate means.
          - >-
              Why substitution is the move. The numerator is a constant times t and the denominator is t² + 4,
              whose derivative is 2t. That is the shape that says one variable will do. Let u be the denominator,
              and the whole integrand collapses to du over u. The integral of that is a logarithm.
          - >-
              What the answer is for. A resurvey file needs the mass that went past, because that is what has left
              the catchment and arrived somewhere downstream. It is the number that will be compared against how
              much the reservoir actually silted up. Being able to defend the working matters more than the
              figure.
        assumes:
          - an integral can be rewritten in a new variable if the differential is converted with it
          - the antiderivative of one over a quantity is the natural logarithm of it
        takeaway: A substitution replaces the variable and its differential together, and the limits of integration have to travel with them.
        format: DERIVE
        question: >-
          Evaluate the total suspended load carried past the gauge in the four hours after the peak.
        derive:
          hint: >-
            Look for a part of the integrand whose derivative is also in the integrand.
          start: 'L(t) = 60t ÷ (t² + 4)'
          startNote: 'tonnes an hour, t in hours from the peak'
          goal: 'the total load between t = 0 and t = 4'
          steps:
            - ask: Choose a substitution and rewrite the integral.
              answer: 0
              candidates:
                - text: 'u = t² + 4, du = 2t·dt, so the integral becomes 30·∫du ÷ u'
                  rule: substitution
                - text: 'u = t² + 4, du = 2t·dt, so the integral becomes 60·∫du ÷ u'
                  rule: substitution
                  survives: true
                  why: >-
                    60t·dt is 30·du, because du already carries the factor of 2. Keeping the 60
                    doubles the answer, and every line after it integrates and evaluates perfectly.
                - text: 'u = t, du = dt, so the integral becomes ∫60u·du ÷ (u² + 4)'
                  rule: substitution
                  why: >-
                    Substituting the variable for itself changes nothing. The integral is exactly as
                    hard as it was before the substitution was made.
                - text: 'u = 2t·dt, so the integral becomes 30·∫du ÷ u'
                  rule: chain
                  why: >-
                    A differential is not a substitution for the variable. Setting u equal to du
                    leaves nothing to integrate with respect to.
            - ask: Antidifferentiate, and deal with the limits.
              answer: 1
              candidates:
                - text: '30·u^(−1), evaluated from u = 4 to u = 20'
                  rule: antiderivative
                  why: >-
                    The antiderivative of one over u is the natural logarithm, not the next power
                    down. An exponent of −1 is the one case the power rule cannot handle.
                - text: '30·ln(u), evaluated from u = 4 to u = 20'
                  rule: limits
                - text: '30·ln(u), evaluated from t = 0 to t = 4'
                  rule: limits
                  survives: true
                  why: >-
                    The limits belong to the old variable and have to be converted with it. Read as
                    t they give 30·(ln 4 − ln 0), whose second term is not a number, and the usual
                    repair is to drop it and report a confident 41.6 tonnes.
            - ask: Evaluate it.
              answer: 2
              candidates:
                - text: '30·(ln 20 ÷ ln 4) ≈ 64.8 tonnes'
                  rule: evaluation
                  survives: true
                  why: >-
                    A difference of logarithms is the logarithm of a quotient, not a quotient of
                    logarithms. The number that comes out is the right order of magnitude, which is
                    what carries it past a sanity check.
                - text: '30·ln(20 − 4) = 30·ln 16 ≈ 83.2 tonnes'
                  rule: evaluation
                  why: >-
                    Subtracting inside the logarithm is a different operation from subtracting two
                    logarithms, and it has no rule behind it.
                - text: '30·(ln 20 − ln 4) = 30·ln 5 ≈ 48.3 tonnes'
                  rule: evaluation
          commit: Report the load
        answerText: >-
          About 48 tonnes in the 4 hours after the peak — 30·ln 5, from an integrand that could
          not be antidifferentiated in the shape it was written in.
        why: >
          The integrand resists because it is a quotient with the variable in both parts. It
          stops resisting the moment somebody notices the top is very nearly the derivative of
          the bottom. Substituting turns it into one over u, whose antiderivative is a
          logarithm. The whole difficulty was a change of variable rather than a new technique.
          What has to travel with the variable is the differential and both limits. It is the
          limits that get left behind, and an integral evaluated at the old ends of a new
          variable is wrong without looking wrong.

  # ---------------------------------------------------------------- day 14
  # Units 5/6 — the accumulation function and its own derivative, rules written on
  # a rate rather than on a level, and reading a derivative's graph.
  - title: The last reversible moment
    objective: Write rules on a rate, find where an accumulation is greatest, and read a level off a graph of its derivative.
    briefing: Everything on the board tonight is a derivative, and the decisions have to be written before the data arrives.
    stake: >-
      Sunday night. The last decisions that can still be unmade are made now. Berg wants the
      night orders written against the rate the level is climbing. She does not want them
      written against the level itself. A level threshold gives no warning. A rate does. Ferrand
      has the net flow as a formula and needs the hour when the reservoir is fullest. In the
      gate chamber the only trace on the screen is the net flow. The level plot has not been
      drawn since Friday. Wilkes has to say what the level did from that rate alone. Today you
      write rules on a rate, and find the hour an accumulation tops out.
    takeaway: A rate written into a rule buys the lead time a level cannot, and an accumulation's whole shape is readable from the rate that built it.
    stops:
      - group: SAFE
        task: Write tonight's thresholds on the rate
        title: Rules on the rate, not the level
        place: Downstream Warning Desk
        scene: >
          The night board is blank. Berg wants the farm clearance set against how fast the level is
          climbing rather than against how high it is, and signed before the eight o'clock update
          arrives.
        guide: >-
          One rule, written on the rate the level is climbing rather than on the level itself, and fixed once
          the board is released. Moving stock and machinery off the flood plain takes five days from the
          moment it is called. Only the early updates arrive with five days left. So the line has to be low
          enough that one of them crosses it. It also has to be high enough not to have been crossed on a
          night the river was doing nothing.
        background:
          - >-
              Why the rate rather than the level. A level threshold fires when the water is already there. A rate
              threshold fires while it is on its way. The earlier warning is worth more than the certainty. A
              reservoir climbing fast at a moderate level is a different situation from a still one near the top.
              A level rule cannot tell them apart.
          - >-
              What lead time means on a board like this. Every action has a duration —
              notifying downstream, opening gates in sequence, clearing the tailrace path. A
              stage set too close to the limit begins an action that cannot finish, which is
              worse than no rule because it is a rule somebody trusted.
          - >-
              Why release before the updates. A threshold adjusted while the data comes in
              is not a threshold; it is a commentary on decisions already taken. Signing the
              board first is what makes the night's actions attributable to a rule rather
              than to whoever was awake.
        takesAsRead:
          - The definite integral as an accumulation, and its units
        assumes:
          - a threshold on a rate fires earlier than a threshold on the quantity it is filling
          - a staged action has a lead time that cannot be compressed once it has started
        takeaway: A rule written on a derivative fires while there is still time to act; the same rule written on the level fires when the level is already there.
        format: TRIGGER
        question: >-
          At what rate of rise do you call the farm clearance, given it needs five days to
          happen?
        trigger:
          hint: >-
            Set the line on the rate scale, then release the board. The updates arrive afterwards and
            your own rule decides what happens.
          scale:
            label: Rate the level is rising
            unit: m a day
            min: 0
            max: 2.4
            step: 0.05
            anchors:
              - { at: 0.3, means: 'about 3.6 m of freeboard tonight, so twelve days before the water is at the crest' }
              - { at: 1.2, means: 'three days to the crest, and the gates take a day to raise in stages' }
              - { at: 2.0, means: 'under two days to the crest, with nothing downstream yet moved' }
          objective: >-
            The farm clearance fires while the five days it needs are still available.
          conditions:
            - { id: clear, label: Clear the low-lying farms, leadHours: 120, owner: the county, action: 'move stock and machinery off the flood plain', window: { min: 0.35, max: 0.9 } }
          stream:
            - { at: Sunday 20:00, value: 0.30, hoursLeft: 168, update: 'level rising 0.30 m a day, catchment still wet' }
            - { at: Tuesday 20:00, value: 0.75, hoursLeft: 120, update: 'rise more than doubled overnight; upper gauges all climbing' }
            - { at: Thursday 20:00, value: 1.60, hoursLeft: 72, update: 'rise at 1.60 m a day; the second front has arrived early' }
            - { at: Saturday 20:00, value: 0.40, hoursLeft: 24, update: 'rise back to 0.40 m a day as the front clears' }
          rehearsal:
            note: last February, the same reach
            stream:
              - { value: 0.20, hoursLeft: 168 }
              - { value: 0.45, hoursLeft: 132 }
              - { value: 0.95, hoursLeft: 96 }
              - { value: 1.35, hoursLeft: 72 }
              - { value: 0.85, hoursLeft: 48 }
              - { value: 0.30, hoursLeft: 24 }
          release: Release the board
          commit: Stand by the board
        answerText: >-
          Call the clearance around 0.4 m a day. Only the first two updates arrive with the five days
          it needs, so a line above about 0.9 fires on Thursday with 72 hours left and the clearance
          can no longer happen.
        why: >
          Two ways of getting this wrong look nothing alike and cost the same. A threshold set high never
          fires and the stage simply does not happen. A threshold set at a number that sounds serious fires on
          Thursday with 72 hours left. That is a correct rule for an action that needed 120. So the rule is
          satisfied and the clearance is already impossible. Writing the board on the rate rather than on the
          level is what makes any of it reachable. The rate crosses its threshold two days before the level
          crosses its own.
      - group: STORE
        task: Find the hour the reservoir is fullest
        title: Where the accumulation tops out
        place: Storage & Level Board
        scene: >-
          Ferrand has the net flow as N(t) = 40 − 8t cubic metres a second, with t in
          days from tonight. The storage is everything that net flow has added since. He
          wants the day the reservoir is fullest.
        guide: >-
          Build it a line at a time. The storage is the accumulation of a net flow that is falling. So the
          storage is greatest when the net flow stops being positive. That has to come out of the working
          rather than out of a guess. Then classify the turning point, because 'fullest' is a maximum and the
          algebra has to say so.
        background:
          - >-
              How the two are related. If S is what N has added since tonight, then N is the rate at which S is
              changing. That is the fundamental theorem, in the direction people use least. So questions about S's
              maximum are questions about where N crosses zero, and no integration is needed to find it.
          - >-
              Why the sign matters more than the value. While the net flow is positive the reservoir is filling;
              once it is negative it is emptying. The day the fullest level occurs is the day the sign changes.
              That is why a linear net flow makes this a one-line answer. A real one makes it a root-finding
              problem.
          - >-
              What it is worth. A dam operator plans drawdown around the day storage peaks,
              because that is the last moment a decision can be made with the season's water
              still in hand. Being a day out on it is a real cost, and it is why the
              classification is asked for explicitly.
        assumes:
          - an accumulation function has the rate that built it as its own derivative
          - a quantity turns over where its derivative crosses zero
        takeaway: The peak of an accumulation is where the rate that fills it crosses zero, so the whole question is answered from the rate without ever evaluating the total.
        format: DERIVE
        question: >-
          Find the day the accumulated storage is greatest, and establish that it is a maximum.
        derive:
          hint: >-
            The accumulation is an integral with a moving upper end. Its derivative is not a new
            calculation.
          start: 'S(t) = the integral of N from 0 to t, with N(t) = 40 − 8t'
          startNote: 'net flow in cubic metres a second, t in days from tonight'
          goal: 'the day S is greatest, classified'
          steps:
            - ask: Write the derivative of the accumulation.
              answer: 1
              candidates:
                - text: "S'(t) = the integral of N from 0 to t"
                  rule: fundamental theorem
                  why: >-
                    That is S itself. Differentiating an accumulation removes the integral rather
                    than leaving it in place.
                - text: "S'(t) = N(t) = 40 − 8t"
                  rule: fundamental theorem
                - text: "S'(t) = 40t − 4t²"
                  rule: antiderivative
                  survives: true
                  why: >-
                    That is S, obtained by antidifferentiating N — a correct and useful line, labelled
                    as the wrong one. Used as a derivative it puts the peak at ten days instead of
                    five, and it goes on behaving like a derivative all the way down.
                - text: "S'(t) = −8"
                  rule: fundamental theorem
                  why: >-
                    That is the derivative of N, which is the second derivative of S. It has been
                    differentiated once too often.
            - ask: Set the derivative to zero and solve for the day.
              answer: 0
              candidates:
                - text: '40 − 8t = 0, so t = 5 days'
                  rule: critical point
                - text: '40 − 8t = 0, so t = 8 ÷ 40 = 0.2 days'
                  rule: critical point
                  survives: true
                  why: >-
                    The rearrangement is inverted. It gives a small number in the right units — just
                    under five hours from now — and nothing further down the page argues with it.
                - text: '40 − 8t = 0, so t = 320 days'
                  rule: evaluation
                  why: >-
                    Solving for t divides by the coefficient in front of it rather than multiplying
                    by it.
            - ask: Classify the turning point.
              answer: 2
              candidates:
                - text: "S''(t) = 40 − 8t, which is still positive before day 5"
                  rule: second derivative
                  why: >-
                    That is the first derivative again. Differentiating it once more is what makes it
                    the second.
                - text: "S''(t) = +8, so the reservoir is emptiest on day 5"
                  rule: second derivative
                  survives: true
                  why: >-
                    The derivative of −8t is −8. The sign carries straight through to the
                    classification, and getting it wrong turns the fullest day of the fortnight into
                    the emptiest one.
                - text: "S''(t) = −8, so the accumulation is at a maximum on day 5"
                  rule: second derivative
          commit: Report the day
        answerText: >-
          Day 5, and it is a maximum — the net flow is positive before it and negative after, and the
          second derivative is −8 on every day of the fortnight.
        why: >
          The fundamental theorem does the whole of the first step. The derivative of an accumulation with a
          moving upper end is the rate at that end. So nothing has to be integrated to find where the total
          turns over. That is the practical value of it here. The reservoir's fullest hour is a property of
          the net flow alone, readable from a gauge. The storage figure itself is never needed. The second
          derivative is constant and negative, so there is one turning point and it can only be a top.
      - group: GATES
        task: Say what the level did, from the rate alone
        title: The only trace on the screen
        place: Gate Chamber
        scene: >
          The level plot has not been drawn since Friday. What Wilkes has is the net-flow trace, and a
          handover to write. The trace is positive and falling all morning, crossing zero at noon, negative
          all afternoon.
        guide: >-
          Every option is a shape the level might have taken, and each fits some part of
          the trace. What separates them is one rule: the sign of the net flow gives
          direction, and its size gives steepness. A falling positive trace is still a
          rising reservoir. The early morning is where this goes wrong most easily. The
          largest net flow sits furthest from the peak.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be the answer under
              one specific misreading. A step skipped. A quantity confused with a rate. A correlation taken for a
              cause. Identifying which misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance. That was 88 per
              cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason is
              indistinguishable from a sound one. That stays true until the day the approximation is
              what is being tested.
        assumes:
          - the level rises where the net flow is positive and falls where it is negative
          - a quantity turns over where its rate crosses zero, not where its rate is largest
        takeaway: A rate's graph carries the whole shape of what it built, and the rate's own peak is nowhere near the peak of the quantity.
        format: CHOICE
        question: From the net-flow trace alone, what did the level do?
        choices:
          - Rose all morning, peaked at noon, fell all afternoon
          - Fell all morning, bottomed at noon, rose all afternoon
          - Rose all day, more slowly after noon
          - Was highest early, when the net flow was largest
        answer: Rose all morning, peaked at noon, fell all afternoon
        why: >
          Positive net flow means the level is climbing, whatever the net flow is doing itself. So a falling
          positive trace is still a rising reservoir, climbing less eagerly. That is a statement about
          curvature and not about direction. The level turns over where the trace crosses zero and nowhere
          else. The trap is the early morning, where the net flow is at its largest. That is where the level
          is climbing fastest. It is the steepest part of the level curve and the furthest thing from its
          peak.
        rebuttals:
          - Falling and negative are different. The morning trace is falling and still above zero.
          - After noon the net flow is negative, so the level is going down rather than up slowly.
          - The largest net flow is the steepest climb, which is where the level is rising fastest and is lowest.

  # ---------------------------------------------------------------- day 15
  # Synthesis — a fit whose residuals say the model is missing a term, 1 average
  # for a fortnight, and what the 2 weeks established.
  - title: What the fortnight is worth
    objective: Judge a fit by what it leaves over, reduce a fortnight to one rate, and say what has been established.
    briefing: The water has gone and what is left is what can be defended in writing.
    stake: >-
      Monday, a fortnight on. The reservoir is at 91%. The reach was warned twice and flooded
      neither time. The resurvey has moved every volume on the site by 11%. Zawadzka has three
      fits of the uplift against head. The one with the best summary number is not obviously the
      one to keep. Ferrand has to reduce 14 days to a single figure for the annual return. And
      the liaison committee sits this evening. Today you judge a fit by what it leaves over.
      Then you reduce a fortnight to one rate, and say what these two weeks actually settled.
    takeaway: A model is judged by the structure it leaves behind, not by the size of what it leaves behind.
    stops:
      - group: STRUCT
        task: Say which fit you would carry forward
        title: A pattern is not a scatter
        concept: Fitting a constant, and scoring it on data the fit never saw
        place: Seepage & Uplift Bay
        scene: >
          Three fits of the uplift against reservoir head are on Zawadzka's screen, within a tenth of
          a kilopascal of each other on the summary statistic. The residuals are plotted where each
          gauge actually sits under the wall.
        guide: >-
          Three fits, and their summary statistics sit within a tenth of a kilopascal of each other. The
          number underneath cannot choose between them. What can is the residual field. Each stick is one
          uplift gauge, drawn where it sits under the wall. Up for positive and down for negative. Look at all
          three fields, then carry the fit whose leftovers look like nothing in particular.
        assumes:
          - a complete model leaves residuals that look like noise
          - a fitted parameter can absorb a systematic effect without removing it
        takeaway: A low summary statistic with a pattern under it hides a term the model is missing, and it will bias every prediction the same way.
        format: RESIDUAL
        question: >-
          Look at each field before choosing. Which of these fits would you carry into next season?
        residual:
          hint: >-
            Each stick is one uplift gauge, drawn where it sits under the wall. Up is a positive
            residual, down a negative one.
          fits:
            - id: linear
              label: Straight line in head
              rms: 0.31
              structured: true
              residuals:
                - { x: -3, y: -1, value: -0.30 }
                - { x: -1, y: -1, value: 0.28 }
                - { x: 1, y: -1, value: 0.31 }
                - { x: 3, y: -1, value: -0.29 }
                - { x: -1, y: 1, value: 0.30 }
                - { x: 1, y: 1, value: 0.33 }
            - id: drift
              label: With a linear drift term fitted
              rms: 0.22
              structured: true
              residuals:
                - { x: -3, y: -1, value: 0.21 }
                - { x: -1, y: -1, value: 0.20 }
                - { x: 1, y: -1, value: -0.19 }
                - { x: 3, y: -1, value: -0.23 }
                - { x: -1, y: 1, value: 0.22 }
                - { x: 1, y: 1, value: -0.21 }
            - id: quad
              label: With the square term the theory predicts
              rms: 0.26
              residuals:
                - { x: -3, y: -1, value: 0.27 }
                - { x: -1, y: -1, value: -0.22 }
                - { x: 1, y: -1, value: 0.09 }
                - { x: 3, y: -1, value: -0.28 }
                - { x: -1, y: 1, value: 0.19 }
                - { x: 1, y: 1, value: -0.12 }
          accept: quad
          commit: Carry this fit forward
        answerText: >-
          The one with the square term, at 0.26. The drift fit scores better and its residuals still
          change sign across the gallery, which means the drift parameter absorbed the curvature
          rather than removing it.
        why: >
          Two of these three leave residuals that are positive on one side of the wall and negative on the
          other. That is not scatter. It is a quantity the model does not contain. Adding a free parameter
          that soaks it up improves the summary number. It leaves the cause exactly where it was. It will then
          bias every extrapolation in the same direction, quietly, because nothing about the fit looks wrong
          afterwards. One large residual is a bad gauge; six small ones in a pattern are a missing term.
      - group: STORE
        task: Reduce the fortnight to one figure
        title: 14 days, one number
        place: Storage & Level Board
        scene: >
          Ferrand has 47.2 million cubic metres through the site over 14 days and 1 line on
          the annual return for it. He wants the steady flow that would have delivered the same water.
        guide: >-
          The numbers offered are one volume, two ways of writing the interval, and a
          peak that belongs to a different question. An average value is an accumulation
          over a length, and the length has to be in the units the flow is quoted in.
          Days put into a per-second figure are out by a factor of 86,400. A peak
          compares two instants; an average compares two events, which is what the
          return is asking for.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. Two things are being tested. Can you pick the quantities the relationship actually needs? And does the
              size of the answer look right once they are in place?
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch is caught before it is placed. It is also how a quantity
              belonging to a different part of the problem is caught. That is the habit this format
              exists to build.
        takesAsRead:
          - The definite integral as an accumulation, and its units
        assumes:
          - an average value is an accumulation divided by the length of its interval
          - 14 days is 1,209,600 seconds
        takeaway: The same operation that reduced a morning to one flow reduces a fortnight to one, and neither is the mean of the readings.
        format: BALLPARK
        question: Estimate the average inflow across the fortnight, in cubic metres a second.
        why: >
          This is the day-eight arithmetic on a longer interval. Nothing about it changes with
          the scale. An average value is an accumulation over a length, whether that length is
          six hours or a fortnight. It is also the honest way to compare this flood with the
          record, because a peak compares two instants and an average compares two events. 40
          is a wet fortnight here and not a remarkable 1. That is the sentence the return
          needs, and the peak of 136 would never have supplied it.
        estimate:
          prompt: >
            The fortnight delivered 47.2 million cubic metres. An average value is the accumulation
            divided by the length of the interval, and 14 days is 1,209,600 seconds.
          question: Choose the volume and the length of the fortnight in seconds.
          labels:
            - 47200000  (volume through the site, cubic metres)
            - 1209600  (seconds in 14 days)
            - 14  (days in the fortnight)
            - 86400  (seconds in 1 day)
            - 136  (the peak inflow, cubic metres a second)
          values: [47200000, 1209600, 14, 86400, 136]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 39.02
          tolerance: 3
          units: cubic metres a second
          solution: 47,200,000 ÷ 1,209,600 ≈ 39 cubic metres a second.
          explanation: >
            About 39 cubic metres a second, against a peak of 136. Dividing by the 14 rather
            than by the seconds gives 3.4 million, which is not a flow — and it is the version that
            reaches an annual return, because nobody checks the units on a number that large.
          givens:
            - 47.2 million m³ through the site in 14 days
            - The peak was 136 m³/s on the sixth day
          relationship: >
            Average value = accumulation ÷ length of interval, with the interval in the same units of
            time as the rate being reported.
        answerText: About 39 cubic metres a second, averaged across the fortnight.
      - group: SAFE
        task: Settle what the fortnight established
        title: What is worth writing down
        place: Downstream Warning Desk
        scene: >
          The liaison committee sits at seven. Halloran has a fortnight of decisions to account for. Berg has
          a release she asked for on the first day. The authority will fund one piece of work out of it.
        guide: >-
          The provisional correction to the stage-storage curve is 11 per cent at
          working levels and rests on 11 transects. A full resurvey is four weeks of
          boat time. Every volume and every level forecast on this site divides by that
          curve; the uplift and the seepage do not. The spillway coefficient is still a
          handbook figure carrying 15 per cent. It is the widest term in the discharge
          and the one nobody has measured here. The upper catchment has two gauges, and
          the arrival times they fed were checked against the reach for the first time
          in nine years. The uplift relation has a fortnight of high-level data it has
          never been fitted on.
        rules: >-
          Spread the hundred points across the 4 proposals. At least 80 of them have to
          be committed, because a panel that funds almost nothing has not decided
          anything. Your largest single allocation must be 35 or more, and it has to
          land on what the evidence supports most. Keep the total sitting on proposals
          the evidence does not support under fifteen. And a proposal it does support
          should not be left under twenty.
        background:
          - >-
              Why the whole spread is graded. Funding is not a vote for one idea. A portfolio says what you think
              is likely. It says what is worth hedging against. It says what is not worth pursuing at all. The
              last two are where most of the information is. Backing the right proposal while quietly funding a
              bad one is a worse answer than it looks. That is why the small numbers count as much as the big one.
          - >-
              What the three numbers are for. Thirty-five is what makes a lead a lead: below
              it you have hedged rather than chosen. Fifteen is the most that can sit on
              unsupported work before it stops being a rounding error. Past that it is a
              second opinion nobody argued for. Twenty is the floor under a line of work you
              have already called strong, because funding it too thin to finish spends the
              money and buys nothing.
          - >-
              Why there is a floor on the total. Points held back are not caution; they are
              a decision not to decide, taken with somebody else's money and somebody else's
              deadline. The floor is what forces the panel to say something.
        assumes:
          - a measurement that every other quantity is divided by is worth more than a measurement of one quantity
        takeaway: What a fortnight establishes is whatever was measured well enough to be used again, and that is usually not the thing that was most argued about.
        format: SCIENCETANK
        task: Spend what the authority will release on what the fortnight showed was missing.
        proposals:
          - { label: A, text: 'Complete the reservoir resurvey and reissue the stage-storage curve.' }
          - { label: B, text: 'Gauge a release against the river and calibrate the spillway coefficient.' }
          - { label: C, text: 'Add two more river gauges in the upper catchment.' }
          - { label: D, text: 'Re-fit the uplift prediction on the fortnight of high-level data.' }
        why: >
          The two worth funding are the two that everything else is computed through. The area curve is the
          integrand of every volume and the divisor of every level forecast. So an 11% error in it is an 11%
          error in all of them at once. And 11 transects is a provisional number the room is already relying
          on. The coefficient is the widest term in the discharge by a long way, and improving the head gauge
          instead would refine the term that was already good. More gauges would improve a forecast that was
          not what failed, and the uplift re-fit is real work that can wait for a quiet quarter.
        recommended: { A: 50, B: 30 }

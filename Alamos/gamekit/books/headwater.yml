    guide: >-
      Every option here is a real quantity of this record. They differ in whether
      they name a total, a rate, an average, or a rate of a rate. A slope is a rate,
      so whatever answers this has to carry the units a rate carries. If the curve
      and the gauge are two views of one record, a disagreement between them is a
      bookkeeping error and not a flood.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to be the answer under
      one specific misreading. A step skipped. A quantity confused with a rate. A correlation taken for a
      cause. Identifying which misreading each belongs to is where the learning is; the right answer alone
      can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the
      qualifying clause and the unit. So across a whole game the key used to be the longest option far more often
      than chance. That was 88 per
      cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so
      length, hedging and specificity have had the signal taken out of them
      deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the
      verdict prints them — the reason that option fails, not a restatement of the
      right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason
      is
      indistinguishable from a sound one. That stays true until the day the approximation is
      what is being tested.
    takesAsRead:
    - The definite integral as an accumulation, and its units
    assumes:
    - an accumulation function reports the total of a rate from a fixed start up to a moving end
    - a derivative reports the slope of a curve at a point
    takeaway: The slope of an accumulation curve at any instant is the rate that was arriving at that instant.
      Differentiating an integral returns what was integrated.
    format: CHOICE
    question: What is the slope of the running-total curve at four o'clock on Wednesday?
    choices:
    - The inflow at four o'clock on Wednesday
    - The total volume that had arrived by four o'clock on Wednesday
    - The average inflow between Monday and four o'clock on Wednesday
    - The rate at which the inflow itself was changing at four o'clock on Wednesday
    answer: The inflow at four o'clock on Wednesday
    why: >
      The running total is an accumulation function, with a lower end fixed on Monday and an
      upper end that moves. Push that upper end forward by a small interval and it gains the
      volume arriving during it. That volume is the inflow times the interval, so the slope
      is the inflow itself. This is the first part of the fundamental theorem, and its use
      here is practical. It means the gauge and the total curve are two views of one record.
      A total curve that steepens where the gauge did not is a bookkeeping error rather than
      a flood.
    rebuttals:
    - The total is the height of the curve at that point, which is what the slope is being distinguished from.
    - The average is the height divided by the elapsed time, a chord from Monday rather than a tangent at 
      Wednesday.
    - The rate of change of the inflow is the curve's second derivative, one differentiation further on.

  # ---------------------------------------------------------------- day 5
  # Units 3/4 — implicit differentiation, and related rates as a chain of transfers.
- title: The last half metre
  objective: Differentiate a relation that will not solve, and follow a rate through everything it passes.
  briefing: The last half metre is where small rate errors become large operating errors.
  stake: >-
    Friday. The reservoir has climbed into the highest range used this week, where a small change in level changes
    several decisions at once. You have to follow those rates without pretending every relation can be solved neatly
    first.
  takeaway: A relation can be differentiated where it cannot be rearranged, and a rate travels through every 
    relation between its ends.
  segue: >-

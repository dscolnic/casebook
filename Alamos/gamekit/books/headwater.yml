# Headwater — Ashfell Dam, and nine days of rain forecast in the catchment.
#
# Written to gamekit/tools/BOOK_TEMPLATE.md. The place is themes/headwater/plan.js
# — four levels inside the wall — and the arc is in ../GAME_IDEAS.md under
# "Headwater".
#
# **The subject is calculus. The dam is where it is being done.** Every stop
# names the move it teaches — a limit, a rule, an antiderivative, a solved
# equation — and the reservoir supplies the quantities, the units and the reason
# anybody wants the number. The syllabus is AP Calculus AB, mapped day by day in
# tools/syllabus.js under `headwater`, and a stop that teaches no move on that
# list does not go in however good the hydrology is.
#
# The earlier rule here was "no question whose answer is a symbolic expression
# with nothing at stake", and it was obeyed by dropping the symbols: 26 of 45
# stops became prose judgement about a dam and the course disappeared. The rule
# it is replaced by is adaptable in the way the first one was not, because it
# admits more than one way of paying for a symbol:
#
#   A stop earns its place if it teaches a named calculus move AND the move is
#   consequential in at least one of these senses —
#     · **numerical** — the working ends in a number somebody acts on;
#     · **directional** — getting it wrong changes a sign, a units factor or an
#       order of magnitude, and the verdict says which;
#     · **structural** — the move decides what kind of answer exists at all
#       (no rate here, a family rather than a value, an endpoint rather than a
#       critical point);
#     · **procedural** — the move is a discipline that survives the setting
#       (holding out data, converting limits with the variable, measuring what
#       you predicted).
#   A symbolic answer is welcome. A symbolic answer with none of the four is not.
#
# Every wrong branch names the mistake a student actually makes, and DERIVE's
# `survives` flag is where that is enforced: at least one wrong line per step
# stays algebraically valid, because a derivation whose errors die at once is
# passable without differentiating.
#
# The argument: Halloran holds that water released in March cannot be recovered
# and a dry summer is a real harm with a real cost. Berg holds that headroom is
# only cheap before it rains. Berg is right on day 4. Halloran is right on day 12.
#
# ## The arc, one line a day (STORY_SPEC rule 9), each a But or a Therefore
#
# Written down before the closing cards were, because a reversal planted on day
# 10 has to be a visible thread on day 1 and that cannot be seen from inside one
# card.
#
#   1  Ashfell is nearly full with nine days of rain coming, and every number on
#      the dam is a reading rather than a rate.
#   2  THEREFORE the three relations the place is run from have to be read as
#      rates, and the rain starts while they are being differentiated.
#   3  BUT what the front leaves overnight is a column of numbers and no formula,
#      so the total has to be built by hand and every way of building it leans.
#   4  THEREFORE the release Berg asked for on Monday becomes a much larger
#      four-hour ramp, into a river with people on it. Berg is right.
#   5  BUT the head has climbed past where the rating curve was tested, and the
#      curve tying level to volume cannot be rearranged at all.
#   6  THEREFORE the only honest news left is in the second derivative — the
#      steps up have stopped growing — and the two peaks are not the same hour.
#   7  BUT three people want a largest value and the three answers do not live in
#      the same kind of place.
#   8  THEREFORE the week is reduced to one equivalent steady rate, so the
#      early-release argument can finally be compared with what actually arrived.
#   9  BUT the outlet is draining the head that drives it, and one six-hour-old
#      reading is being asked to name the constant.
#   10 THEREFORE when the survey boat comes in, the shape under all of it is
#      wrong: the 2003 curve overstates the area at every level. THE REVERSAL,
#      and it is a measurement rather than an event.
#   11 BUT nothing has to be decided before lunch, which is the only condition
#      under which a prediction can be checked against a measurement.
#   12 THEREFORE with the front gone north the reservoir is short going into
#      summer, and what is left to fit is the recession. Halloran is right.
#   13 BUT three jobs close before the nine o'clock call, and the region the
#      committee wants to read as a total is a difference with a sign in it.
#   14 THEREFORE the last orders that can be unmade are tested against rate of rise
#      and the lead time downstream people actually need.
#   15 THEREFORE what survives is not the water but what can be defended in
#      writing.
#
# The recurring human thread, deliberately OFF the roster so nothing collides
# with checkNames: Ada Trenholme at Nethercote Ford, the lowest house on
# Baptiste's list and four hours down the river, and her grandson Kit Trenholme,
# who moves her ewes off the low meadow every time a warning goes out. She is
# rung on day 1, cleared on day 4 (Berg right), and cleared a second time for
# water that never arrives (Halloran right); the note of what those two warnings
# cost is what Prowse carries into the committee on day 15. The 1983 flood is
# hers, which is why Prowse's committee is a list of the people who stayed.

theme:
  id: headwater
  title: Headwater
  subtitle: Duty Engineer · Ashfell Dam

groups:
- id: INFLOW
  code: INFLOW
  name: Catchment & Inflow
  color: '#2f7fa8'
  desc: What the river is bringing, how fast it is changing, and how long ago it rained.
  defaultLeader: ekundayo
  milestones: [Read the gauges, Fit the rise, Forecast the peak, Ready to hand over]
- id: STORE
  code: STORE
  name: Storage & Level
  color: '#1f7a6b'
  desc: What the reservoir holds, and why the level is not the same question as the volume.
  defaultLeader: ferrand
  milestones: [Read the level, Convert to volume, Account for the change, Ready to hand over]
- id: GATES
  code: GATES
  name: Spillway & Gates
  color: '#b0762a'
  desc: How much can be let out, how fast, and what the last half metre of head does.
  defaultLeader: wilkes
  milestones: [Set the opening, Predict the discharge, Watch the head, Ready to hand over]
- id: STRUCT
  code: STRUCT
  name: Structure & Seepage
  color: '#7a4fa3'
  desc: What the wall does under load, and what it says about itself in the gallery.
  defaultLeader: zawadzka
  milestones: [Read the weirs, Plot the uplift, Compare with the rise, Ready to hand over]
- id: POWER
  code: POWER
  name: Power & Demand
  color: '#b3462f'
  desc: Water through the turbines is water released, and it is worth money on the way past.
  defaultLeader: anand
  milestones: [Read the load, Convert flow to power, Weigh it against storage, Ready to hand over]
- id: SAFE
  code: SAFE
  name: Downstream & Public Safety
  color: '#5b6a72'
  desc: How long a release takes to arrive, how high it gets, and who has to be told.
  defaultLeader: baptiste
  milestones: [Route the release, Time the arrival, Warn the reach, Ready to hand over]

roster:
- id: halloran
  name: Dermot Halloran
  role: Operations Manager
  division: POWER
  bio: |
    Runs Ashfell, and is answerable for two things that pull against each
    other: a town's water in August and a generation contract that is priced
    by the megawatt-hour. Both are paid for out of the same reservoir.

    His argument with the flood desk is the same one every winter. Water let
    go in March cannot be got back, and a dry summer is not a hypothetical —
    it is standpipes in the villages and a bill the authority cannot pay.

    His limit is that he is arguing about a forecast, and a forecast is worth
    what its lead time is worth. He knows it, which is why he loses gracefully.
  quiz:
  - q: Why does Halloran treat an early release as a cost rather than as caution?
    a: Nothing sent downstream in spring is available in August
    wrong:
    - Releasing early wears the spillway gates more quickly than a summer release
    - An early release has to be reported to the regulator within seven days
    - Generation is worth less in March than it is in August
- id: berg
  name: Sunniva Berg
  role: Flood Engineer
  division: SAFE
  bio: |
    Buys headroom, and is unpopular for it. Her whole argument is about when a
    cubic metre of empty reservoir is cheap: a fortnight before the rain it
    costs a little generation, and on the morning of the peak it cannot be
    bought at any price.

    She works in arrival times rather than in volumes. A release made now
    reaches the first village in 4 hours and the last in 11, and every
    hour of that is an hour somebody can use.

    Her limit is that she is right in a way nobody sees. A flood that does not
    happen leaves no evidence that anything was done.
  quiz:
  - q: Why does Berg want headroom bought early rather than on the day?
    a: Empty reservoir costs generation now and is unobtainable later
    wrong:
    - The gates cannot be opened at short notice without a permit from the regulator
    - Releasing during a storm is prohibited while the river is already rising
    - The turbines cannot pass enough water to matter once the reservoir is full
- id: ekundayo
  name: Ayo Ekundayo
  role: Catchment Hydrologist
  division: INFLOW
  bio: |
    Reads the catchment: 11 rain gauges, 4 river gauges and a
    snowline. He can tell you what the river will do in six hours with some
    confidence and in three days with almost none, and he says which is which
    every time.

    What he watches is not the inflow but its rate of rise. A river climbing
    steadily is a river that has not peaked; the moment the climb slackens is
    the first honest news of the day, and it arrives before the level does.

    His limit is the radar. Rain over the high ground is measured badly by
    everything he owns, and that is where most of it falls.
  quiz:
  - q: Why does Ekundayo watch the rate of rise rather than the inflow itself?
    a: The climb slackening is the first sign the peak is coming
    wrong:
    - The inflow gauges are read only twice a day and the rate is continuous
    - A rate is less affected by errors in the rating curve than a flow is
    - Rate of rise is what the regulator requires to be reported hourly
- id: ferrand
  name: Bo Ferrand
  role: Records & Rating Curves
  division: STORE
  bio: |
    Keeps the curves that turn one measurement into another: level into
    volume, level into surface area, gate opening into discharge. Every number
    the control room uses has been through one of them.

    He is careful to say that a curve is a survey, not a law. Each was measured
    once, by somebody, in a particular year, and it goes on being used long
    after the thing it described has moved.

    His limit is that nobody funds a resurvey. The curve is right until
    somebody spends money finding out that it is not.
  quiz:
  - q: Why does Ferrand call a rating curve a survey rather than a law?
    a: It was measured once and the thing it describes keeps changing
    wrong:
    - Curves are approximations fitted to data and carry a stated tolerance
    - Every curve has to be re-approved by the regulator each decade
    - A law would have to hold for every dam and these are site specific
- id: wilkes
  name: Reggie Wilkes
  role: Gate Mechanic
  division: GATES
  bio: |
    Winds the gates and has done for 19 years. He can hear a bad
    hoist bearing from the far end of the chamber, and he will not run a gate
    he has not seen seat properly.

    What he knows in his hands and everybody else has to calculate: the first
    half metre of opening does almost nothing and the last half metre does
    most of the work. A gate is not a tap, and the difference is the reason
    the schedule matters.

    His limit is that he can only tell you what the gate is doing. What the
    river does with it is somebody else's arithmetic.
  quiz:
  - q: Why will Wilkes not treat the gate opening as proportional to discharge?
    a: The last half metre passes far more than the first
    wrong:
    - The hoist runs more slowly at the top of its travel than at the bottom
    - The gate leaks around its seals until it is more than half open
    - Discharge is measured downstream and always lags the opening
- id: zawadzka
  name: Dr. Halina Zawadzka
  role: Structural Engineer
  division: STRUCT
  bio: |
    Reads the wall. 41 drain holes, 9 seepage weirs and a row of
    uplift gauges in the foundation gallery, and she has a plot of every one
    of them going back to before she was born.

    A dam under a rising reservoir is under a rising load, and the gallery
    reports it: seepage climbs with head, and uplift climbs with head, and
    both are supposed to climb by an amount she can predict. It is the ones
    that climb faster than predicted that she comes down here for.

    Her limit is that everything she measures is a symptom. The crack she is
    looking for is in rock she will never see.
  quiz:
  - q: Why is a seepage reading only useful to Zawadzka beside the reservoir level?
    a: Seepage is expected to rise with head; only more than expected is news
    wrong:
    - Seepage readings drift with temperature and level corrects for it
    - The weirs cannot be read accurately unless the reservoir is steady
    - Level is what the regulator requires to be recorded with every reading
- id: anand
  name: Mercy Anand
  role: Powerhouse Chief
  division: POWER
  bio: |
    Runs two machines at the toe of the dam and knows to the cubic metre what
    each of them is passing. Water through a turbine is water released, and it
    is the only release that pays for itself on the way past.

    She is the one who points out that generation and flood release are the
    same tap used for different reasons, and that the difference between them
    is entirely in the timing and the rate.

    Her limit is capacity. The machines will pass about a tenth of what the
    spillway will, so the moment the number gets large she stops being part of
    the answer.
  quiz:
  - q: Why can Anand's machines not be the answer to a flood release?
    a: Their combined flow is a small fraction of the spillway's
    wrong:
    - Generating during a flood would breach the terms of the supply contract
    - Turbines cannot run when the tailrace is high and the river is in spate
    - Machine flow is fixed by demand and cannot be varied by the operator
- id: baptiste
  name: Nadine Baptiste
  role: Downstream Warning Officer
  division: SAFE
  bio: |
    Owns the list: 11 villages, 2 caravan sites, a school and a road
    that floods before anything else does. She knows the arrival time to each
    of them from a release at the dam, and she has walked every one.

    Her job is entirely about lead time. A warning that arrives with the water
    is not a warning, and the difference between four hours and one is the
    difference between moving stock and losing it.

    Her limit is that she can only warn what she is told about. A release
    decided at four o'clock and passed to her at half past is a release she
    cannot get in front of.
  quiz:
  - q: Why does Baptiste care when a release decision is made rather than how large it is?
    a: People need the notice before the river gives it to them
    wrong:
    - Larger releases are easier to warn about because they are more visible
    - The warning system can only be triggered on the hour
    - Village wardens are only on duty during the working day
- id: rasmussen
  name: Ilya Rasmussen
  role: Survey Engineer
  division: STORE
  bio: |
    Turns up with a boat, an echo sounder and a fortnight, and leaves with a
    new picture of the bottom of the reservoir. It is unglamorous work that
    nobody asks for until something does not add up.

    He is blunt about what a resurvey is for: everything the control room
    computes about volume rests on a shape somebody measured decades ago, and
    a reservoir with rivers running into it does not keep its shape.

    His limit is the boat. He cannot survey in a swell, which means the
    fortnight he needs is a fortnight of calm water nobody can promise him.
  quiz:
  - q: Why does Rasmussen say a stage–storage curve has a shelf life?
    a: Sediment keeps arriving and the shape it was measured on changes
    wrong:
    - Echo sounders have improved and older surveys used cruder instruments
    - The curve is only valid between the levels that were surveyed
    - Reservoir level records are lost after 25 years
- id: sato
  name: June Sato
  role: Forecast Liaison
  division: INFLOW
  bio: |
    Sits between the met office and the control room and translates one into
    the other. What arrives is a rainfall forecast over a region; what the dam
    needs is an inflow over a catchment, and the two are not the same thing.

    She is careful with confidence. A forecast at six hours is worth acting
    on, at two days is worth preparing for, and at five days is worth
    knowing about and nothing else, and she says which she is handing over.

    Her limit is that she does not make the forecast. When it is wrong she is
    the one in the room, and the room forgets she only carried it.
  quiz:
  - q: Why does Sato attach a lead time to every forecast she passes on?
    a: What a forecast is worth acting on depends on how far ahead it is
    wrong:
    - Forecasts are only valid for the six hours after they are issued
    - The met office charges the authority by the forecast horizon
    - Rainfall totals are revised upward as the lead time shortens
- id: prowse
  name: Etta Prowse
  role: Riverside Landowner Representative
  division: SAFE
  bio: |
    Speaks for the reach below the dam: farms, two caravan sites and the
    people who have to move animals when the river comes up. She has been on
    the liaison committee for 11 years and has never missed a meeting.

    What she asks for is not less water. It is the same water with more
    notice, and she is the reason the warning list is a list of times rather
    than a list of names.

    Her limit is that she represents the people who stayed. The ones who were
    flooded out in the eighties are not on her committee.
  quiz:
  - q: What does Prowse ask the dam for on behalf of the reach?
    a: Earlier notice of whatever is going to be released
    wrong:
    - A guarantee that releases stay below the bank-full flow
    - Compensation set in advance for stock that has to be moved
    - A say in the release decision itself rather than a warning about it

glossary:
- name: Calibration
  aliases: [calibration, calibrate, calibrated, calibrating]
  def: Checking an instrument against something already known, so its readings can be trusted.
- name: Reservoir
  aliases: [reservoirs]
  def: The body of water held behind the dam, whose level rises when more arrives than leaves.
- name: Inflow
  aliases: [inflows]
  def: The water arriving at the reservoir from the catchment, second by second.
- name: Flow rate
  aliases: [flow, flows]
  def: How much water passes a point each second, measured in cubic metres a second.
- name: Outflow
  aliases: [outflows, release]
  def: The water leaving — through the turbines, over the spillway, or both. It is the only part anybody 
    controls.
- name: Catchment
  aliases: [catchments]
  def: The ground whose rain ends up here. Anything that falls on it eventually arrives at the reservoir.
- name: Curve
  aliases: [curves]
  def: A plotted relation between two measured quantities, read off rather than calculated.
- name: Flood
  aliases: [floods]
  def: A flow large enough to reach what is beside the river. It is the event this dam is run against.
- name: Peak
  aliases: [peaks]
  def: The most water passing in one event, and the moment it stops climbing.
- name: Hydrograph
  aliases: [hydrographs]
  def: A plot of flow against time. Its climb, its peak and its fall are the shape of one flood.
- name: Rate of change
  aliases: [rate of rise, derivative]
  def: How fast a quantity is moving, at an instant — the slope of its graph rather than its value.
- name: Accumulation
  aliases: [accumulate, accumulated, integral]
  def: What builds up over time from a rate — for a reservoir, the volume the difference between two rates has
    added.
- name: Stage
  aliases: [level, water level]
  def: The height of the water surface, measured against a fixed datum. It is what a gauge reads.
- name: Stage-storage curve
  aliases: [stage–storage, storage curve, rating curve]
  def: The surveyed relation between level and volume. Every volume the control room reports comes through it.
- name: Surface area
  aliases: [plan area]
  def: How much of the reservoir the water covers at a given level. It grows as the reservoir fills.
- name: Head
  aliases: []
  def: The height of water above a sill or a turbine, which is what drives water through it.
- name: Spillway
  aliases: [spill, spilling]
  def: The controlled overflow a dam is built with, for water that must leave faster than the machines can 
    pass it.
- name: Discharge
  aliases: [discharges]
  def: A flow rate through a particular opening, in cubic metres a second.
- name: Chain rule
  aliases: []
  def: When a quantity changes because another one does, its rate carries the inner quantity's rate as a 
    factor.
- name: Related rates
  aliases: [related rate]
  def: Two quantities tied by a relation, so that knowing how fast one moves fixes how fast the other does.
- name: Fundamental theorem
  aliases: [fundamental theorem of calculus]
  def: The area under a rate, between two times, is the total change over that interval.
- name: Average value
  aliases: [mean rate]
  def: The steady rate that would produce the same accumulation over the same interval.
- name: Linear approximation
  aliases: [linearisation, rule of thumb]
  def: Predicting nearby values from the rate at one point. It is good close by and worse further off.
- name: Second derivative
  aliases: [curvature, rate of the rate]
  def: How fast a rate is itself changing — what says whether a climb is getting quicker or slacker.
- name: Inflection
  aliases: [inflection point]
  def: Where a climb stops getting quicker and starts slackening.
- name: Trapezoid rule
  aliases: [trapezoidal, numerical integration]
  def: Adding up the area under readings by treating each pair as a trapezium. What you use when there is no 
    formula.
- name: Optimisation
  aliases: [optimise, optimum]
  def: Working out where a quantity is largest or smallest — at a turning point, or at the end of the range.
- name: Limit
  aliases: [limits, one-sided limit]
  def: The value a quantity closes on as its input closes on a number, whether or not it ever arrives there.
- name: Difference quotient
  aliases: [average rate of change, secant slope]
  def: The change in a quantity divided by the change in time. Its limit, as that interval shrinks, is the 
    derivative.
- name: Continuous
  aliases: [continuity, continuously]
  def: Having no jumps — every value in between is reached. A derivative needs it, and a trace that steps does
    not have it.
- name: Critical point
  aliases: [critical points, turning point]
  def: Where a derivative is zero or does not exist. A largest value sits at one of these or at a boundary of 
    the range.
- name: Concave
  aliases: [concavity, concave down, concave up]
  def: Which way a curve is bending. The sign of the second derivative reports it, everywhere at once.
- name: Antiderivative
  aliases: [antidifferentiate, antidifferentiating, indefinite integral]
  def: A quantity whose derivative is the one you started from. Every rate has a family of them, differing by 
    a constant.
- name: Constant of integration
  aliases: [the constant C]
  def: What is left undetermined when a rate is turned back into a total. Only a measurement pins it down, 
    which is why one reading is not always enough.
- name: Definite integral
  aliases: [definite integrals]
  def: A total gathered across a stated interval, worked out by subtracting the value at one limit from the 
    value at the other.
- name: Riemann sum
  aliases: [left sum, right sum, endpoint sum]
  def: A sum of rectangles standing under a curve, used to approximate the area beneath it. On a rising rate 
    the left one is short and the right one too big.
- name: Substitution
  aliases: [substitute, substituting]
  def: Rewriting an awkward expression in a new variable, so that what is left can be handled by an ordinary 
    rule.
- name: Separable
  aliases: [separate the variables, separating]
  def: An equation whose two quantities can be moved onto opposite sides, so that each side can be worked on 
    its own.
- name: Exponential decay
  aliases: [decay, recession constant]
  def: What a rate proportional to the quantity itself produces. It drops by the same fraction in every equal 
    interval.
- name: Implicit differentiation
  aliases: [implicitly]
  def: Differentiating a relation as it stands, without solving it first. Every quantity in it carries its own
    rate.
- name: Product rule
  aliases: []
  def: The rate of a product of two changing quantities is a sum of two terms, each holding one of them still.
- name: Power rule
  aliases: []
  def: The derivative of a power brings its own exponent down as a factor and reduces it by one.
- name: Indeterminate form
  aliases: [zero over zero]
  def: A quotient that comes out as nothing over nothing. It still has a value, and reaching it takes work.
- name: Differential
  aliases: [differentials]
  def: A rate multiplied by a small step, used to work out the change that rate produces nearby.
- name: Accumulation function
  aliases: [running total, accumulation curve]
  def: A running total from a start that stays put to a moment that moves. Its rate of change is whatever was 
    arriving at that moment.
- name: Held-out data
  aliases: [holdout, held back]
  def: Readings kept back while a rule is chosen, so the rule can be scored on something it has never seen.
- name: Freeboard
  aliases: []
  def: The height left between the water surface and the top of the dam. It is the margin everything else is 
    spent on.
- name: Uplift
  aliases: []
  def: Water pressure under the base of a dam, pushing up. It grows with the reservoir and is measured in the 
    gallery.
- name: Seepage
  aliases: [seep, seeps]
  def: Water that gets through or under the wall, collected in drains and measured at weirs.
- name: Travel time
  aliases: [arrival time]
  def: How long a release takes to reach a place downstream. It is what turns a decision into a warning.
- name: Attenuation
  aliases: [attenuate, attenuates]
  def: The flattening of a peak as it moves downstream, because the channel takes some in and returns it 
    later.
- name: Routing
  aliases: [route, routed]
  def: Working out hour by hour what a reservoir or a channel does to a wave that moves through it.
- name: Sediment
  aliases: [silt, siltation]
  def: What the rivers bring in and leave behind. It takes up volume that used to be water.

missions:
  # ---------------------------------------------------------------- day 1
  # Unit 1 — limits, the difference quotient, and where a derivative fails to exist.
- title: 88%
  objective: Get an instantaneous rate out of readings, out of a formula, and find the instant that has none.
  briefing: A nearly full reservoir, a storm coming, and a control room full of readings that are not yet 
    rates.
    # The 88%-and-driest-summer line lives on the opening card now, so it is not
    # repeated here. The 2003 lake-bed survey does its own work on day 10 (see
    # that stake) and does not need to be planted here too — a fact recovered
    # from the opening card and dropped into day 1's stake is padding, not
    # foreshadowing, when the day it pays off already stands on its own.
  stake: >-
    Monday. Ashfell is 88% full. Nine days of rain are forecast for the high ground, and four villages sit below
    the wall. Before anyone argues about opening a gate, you need the one thing a level reading cannot give you:
    how fast the water is changing.
  takeaway: A reading is a value; a rate is a limit, and the limit is the part that says what happens next.
  segue: >-
    Carried forward six hours, the morning slope would add 21 cubic metres a second to the gauge—but that is only
    a straight-line guess. Baptiste still calls Nethercote Ford. Ada Trenholme's grandson starts moving the ewes
    before anyone knows whether the forecast will steepen or flatten. The first calculation has already become somebody's
    evening.
  stops:
  - group: INFLOW
    task: Get a rate out of two readings
    title: The slope between two readings
    at: gauge-wall
    reason: >-
      Dermot Halloran wants a number for how fast the river is climbing before the
      rain even starts, not another reading off the same trace.
    concept: Limits, one-sided limits, and where a limit fails to exist
    place: Catchment & Inflow Desk
    scene: >
      Ayo Ekundayo, the catchment hydrologist, has the Ashfell gauge on the screen — 41 cubic metres a second at
      6 this
      morning, 48 at 8. Dermot Halloran, the operations manager, wants a number for how fast it is climbing, not
      another
      reading off the same trace.
    guide: >-
      Five numbers are on offer and only three of them are ends of an interval. Two
      are arithmetic already done to the readings: a sum, and the hour one of them
      was taken at. Ask of each what it measures. A sum of two readings has thrown
      away the difference a slope is made of. Get that wrong and the report gives
      the river's size where it was asked for its speed.
    background:
    - >-
      Why an estimate rather than a calculation. Every quantity on this board is
      already measured or stated, so nothing here has to be derived. Two things are being tested. Can you pick the
      quantities the relationship actually needs? And does the
      size of the answer look right once they are in place?
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the
      relationship it is going into. Reading the label is how a unit mismatch is caught before it is placed. It
      is also how a quantity
      belonging to a different part of the problem is caught. That is the habit this format
      exists to build.
    assumes:
    - a flow rate says how much water passes a point each second
    - the slope of a line through two points is the rise divided by the run
    takeaway: An average rate of change is the slope of the line joining an interval's two endpoints.
    format: BALLPARK
        # Was "between 14 o'clock" — the two hours in the stem had been collapsed
        # into their sum by some earlier numeral pass, which left the first
        # question in the game asking about a time that does not exist.
    question: Estimate the average rate of change of the inflow between six and eight o'clock.
    why: >
      An average rate of change is a slope, and the two readings are the two ends of it. It says nothing
      about what happened between them. The same pair comes from a river that climbed steadily. It also
      comes from one that sat still for 90 minutes and then jumped. Shrinking the interval is the only
      cure. That shrinking approaches a number: the limit of this slope as the two readings close
      together. That limit is the instantaneous rate the forecast wants.
    estimate:
      prompt: >
        The gauge read 41 cubic metres a second at 06:00 and 48 at 08:00. An average rate of
        change is the change in the quantity divided by the change in the time.
      question: Choose the later reading, the earlier reading and the length of the interval.
      labels:
      - 48  (the reading at 8, cubic metres a second)
      - 41  (the reading at 6, cubic metres a second)
      - 2  (hours between the two readings)
      - 89  (the two readings added together)
      - 8  (the hour the later reading was taken)
      values: [48, 41, 2, 89, 8]
      slots: 3
      template: '({0} − {1}) ÷ {2}'
      formula: (a-b)/c
      correct: [0, 1, 2]
      target: 3.5
      tolerance: 0.4
      units: cubic metres a second per hour
      solution: (48 − 41) ÷ 2 = 3.5 cubic metres a second per hour.
      explanation: >
        About 3.5 cubic metres a second every hour. Carried forward 6 hours that is another
        21 on the gauge, which is the whole of this morning's argument — and it is a
        straight-line carry, which the afternoon will show to be optimistic.
      givens:
      - 41 m³/s at 06:00, 48 m³/s at 08:00
      - Two hours between the readings
      relationship: >
        Average rate of change = (Q(t₂) − Q(t₁)) ÷ (t₂ − t₁), which is the slope of the line
        through the two points on the hydrograph.
    answerText: About 3.5 cubic metres a second per hour, averaged across the two hours.
  - group: STORE
    task: Get a rate out of a formula, from the definition
    title: What the slope becomes
    at: level-desk
    reason: >-
      The nine o'clock call needs tonight's storage curve as a rate, not an average,
      because it is about what happens next, not what already happened.
    place: Storage & Level Board
    scene: >
      Bo Ferrand, the records & rating curves, has fitted last night's storage to V(t) = 5t² + 40t, in thousands
      of cubic
      metres, with t in hours. The nine o'clock call wants the rate at four hours, not an
      average across the night.
    guide: >-
      Build it a line at a time from the definition — the difference quotient —
      rather than from a rule you already know. Each step is the expression the line
      above licenses, and every wrong branch is legal algebra. The nine o'clock call
      wants the rate at four hours, so finish by evaluating what you derived at that
      value.
    background:
    - >-
      Why the definition rather than the rule. The power rule gives the answer in one line and teaches
      nothing about why the answer is right. Working the difference quotient through is where the rule
      comes from. That means the change in V over the change in t, as that change goes to nothing. It is
      the only version that survives a function no rule covers.
    - >-
      What the algebra does. Expand V(t + h), subtract V(t), and every term without
      an h cancels. Divide by h and one factor of h comes out of what is left. The
      limit is then the terms with no h in them at all, which is the derivative —
      and the cancellation is the whole trick.
    - >-
      Why an average will not do. Storage over the night rose in a curve. So an average across it is a
      rate that was true at one instant somewhere in the middle. It is wrong now. The call is about what
      to do next, and that depends on the rate at four hours.
    takesAsRead:
    - Limits, one-sided limits, and where a limit fails to exist
    - Continuity, and what a jump costs you
    assumes:
    - an average rate of change is the change in a quantity over the change in time
    - a limit is the value an expression approaches as one of its inputs closes on a number
    takeaway: The derivative is the limit of the difference quotient, and taking the limit is what removes the
      interval.
    format: DERIVE
    question: >-
      Work the difference quotient down to an instantaneous rate, and evaluate it at four hours.
    derive:
      hint: >-
        Each line has to follow from the one above it. Name the move as well as the line.
      start: 'V(t) = 5t² + 40t'
      startNote: storage in thousands of cubic metres, t in hours
      goal: "V'(4), from the definition rather than from a rule"
      steps:
      - ask: Write the difference quotient and expand V(t+h).
        answer: 0
        candidates:
        - text: '(5t² + 10th + 5h² + 40t + 40h − 5t² − 40t) ÷ h'
          rule: expansion
        - text: '(5t² + 10th + 5h² + 40t + 40h − 5t² − 40t) ÷ h²'
          rule: cancellation
          why: >-
            A difference quotient divides by the change in the input, which is h. Dividing by
            h² is the slope of nothing, and the limit it produces does not exist.
        - text: '(5t² + 5h² + 40t + 40h − 5t² − 40t) ÷ h'
          rule: expansion
          survives: true
          why: >-
            (t + h)² is t² + 2th + h², and the dropped cross term 2th is the only part of the
            expansion that survives the limit. This divides by h cleanly and stays valid all
            the way down to a derivative of 40, which is wrong at every hour but 1.
        - text: '5(t + h)² + 40(t + h) − 5t² − 40t'
          rule: expansion
          why: >-
            That is the change in the storage, not a rate. Without the division by h it is
            measured in cubic metres rather than cubic metres an hour.
      - ask: Cancel the h and take the limit as h goes to zero.
        answer: 0
        candidates:
        - text: '10t + 5h + 40, which approaches 10t + 40'
          rule: limit
        - text: '10t + 5h + 40, which approaches 10t + 45'
          rule: limit
          why: >-
            Sending h to 0 removes the whole term 5h. It does not leave the coefficient 5
            standing on its own.
        - text: '10t + 5h + 40 for every h, so the limit does not exist'
          rule: limit
          why: >-
            This is a polynomial in h, and a polynomial has a limit everywhere. Nothing is
            undefined once the h in the denominator has cancelled.
        - text: '10t + 5h + 40, and h cannot be set to 0, so the quotient is undefined'
          rule: cancellation
          survives: true
          why: >-
            The quotient is undefined at h = 0, which is exactly why a limit is taken instead
            of a substitution. The observation is correct and applied to the wrong step, and
            it survives to the bottom of the page as a refusal to finish.
      - ask: Evaluate the rate at four hours.
        answer: 0
        candidates:
        - text: "V'(4) = 10 × 4 + 40 = 80 thousand cubic metres an hour"
          rule: substitution
        - text: "V'(4) = 10 × 4 + 40 × 4 = 200 thousand cubic metres an hour"
          rule: substitution
          survives: true
          why: >-
            The 40 is already the derivative of 40t and carries no further t with it.
            Multiplying it by four differentiates nothing and reports a rate two and a half
            times the real one, in units that still look right.
        - text: 'V(4) = 5 × 16 + 40 × 4 = 240 thousand cubic metres'
          rule: substitution
          why: >-
            That is the storage at four hours rather than the rate at four hours. It answers
            how much, which is the number the call already has.
      commit: Report the rate
    answerText: >-
      80 thousand cubic metres an hour at 4 hours — a limit of the difference quotient, not
      an average across any interval.
    why: >
      The difference quotient is the slope of a line through two points on the curve, and its value
      depends on how far apart they are. Taking the limit closes that gap without ever setting it to 0.
      That is the whole manoeuvre. At h = 0 the quotient is 0/0 and says nothing, while its limit is one
      number. What comes out is a rule, 10t + 40, good at every hour of the night, and the four-hour
      figure is one substitution away from it.
  - group: SAFE
    task: Decide what an instantaneous jump in the record means
    title: The jump that cannot be water
    reason: >-
      Baptiste's logger shows a one-sample jump exactly when gate 2 begins moving. If the record is treated as literal
      water motion, the warning desk will publish a rate that no physical gate produced.
    place: Downstream Warning Desk
    scene: >-
      The tailrace logger reads 60 cubic metres a second up to 14:00 and 145 on the very next sample. The gate takes
      several minutes to move, so the water cannot physically jump between those values at one mathematical instant.
      Baptiste, the downstream warning officer, wants you to separate what the plotted record says from what the river could have done.
    guide: >-
      First answer the calculus question about the plotted function: its one-sided values disagree, so it is discontinuous
      and has no derivative there. Then answer the engineering question: an instantaneous jump in a discharge record
      is evidence to check the logger or timestamp, not a physically infinite acceleration of water.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to be the answer under
      one specific misreading. A step skipped. A quantity confused with a rate. A correlation taken for a
      cause. Identifying which misreading each belongs to is where the learning is; the right answer alone
      can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the
      qualifying clause and the unit. So across a whole game the key used to be the longest option far more often
      than chance. That was 88 per
      cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so
      length, hedging and specificity have had the signal taken out of them
      deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the
      verdict prints them — the reason that option fails, not a restatement of the
      right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason
      is
      indistinguishable from a sound one. That stays true until the day the approximation is
      what is being tested.
    takesAsRead:
    - Limits, one-sided limits, and where a limit fails to exist
    assumes:
    - the plotted telemetry is the function being tested for continuity
    - a real gate and a moving body of water change over a finite time rather than teleporting between steady 
      flows
    takeaway: A discontinuity can be a property of the record rather than of the physical system; the 
      derivative fails either way, but the diagnosis is different.
    format: CHOICE
    question: What is the defensible conclusion at 14:00?
    choices:
    - The plotted record is discontinuous and has no derivative there; check the logger before treating the 
      jump as physical
    - The physical discharge changed at an extremely large but finite rate that a faster logger would recover
    - The discharge itself is undefined at 14:00 because two recorded values disagree
    - The derivative is zero because the record is flat on either side of the jump
    answer: The plotted record is discontinuous and has no derivative there; check the logger before treating 
      the jump as physical
    why: >-
      For the plotted record, the left-hand value tends to 60 and the right-hand value to 145, so continuity fails
      and a derivative cannot exist at that instant. But that mathematical statement is about the record. A gate
      takes finite time to move and the water has inertia; an instantaneous step in the logged discharge therefore
      points first to telemetry, timing, or an idealized plotting convention. The useful lesson is not 'the river
      had an infinite rate.' It is that calculus can tell you the record is not a physically credible model at that
      instant.
    rebuttals:
    - Shrinking the sampling interval does not turn a literal jump into a finite derivative; it instead makes 
      the difference quotient larger.
    - A bad or idealized record can be discontinuous even though the physical discharge still has a definite 
      value.
    - Flat pieces on either side do not create a two-sided derivative across a jump between different values.
- title: The same water, moving faster
  objective: Differentiate the three relations this dam runs on, and see what each rate carries with it.
  briefing: The first band is early. Every formula on the wall now has to answer how fast, not how much.
  stake: >-
    Tuesday. The first rain band has arrived two days early and both the river and reservoir are climbing. Three
    equations now have to become rates quickly enough to change today's gate plan.
  takeaway: Differentiating a relation converts it from a statement about values into a statement about rates.
  segue: >-
    The early band keeps building after dark. The formulas give rates while the relations are known; overnight the

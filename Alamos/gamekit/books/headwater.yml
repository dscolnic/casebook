              expected: 'first reading of the run'
              load: no climb to compare with yet
            - id: H07
              label: 07:00
              reading: 62 m³/s
              expected: 'climbed 14 in the hour'
              load: no previous climb to compare with
            - id: H08
              label: 08:00
              reading: 78 m³/s
              expected: 'climbed 16 in the hour'
              load: two more than the hour before
            - id: H09
              label: 09:00
              reading: 96 m³/s
              expected: 'climbed 18 in the hour'
              load: two more than the hour before
            - id: H10
              label: '10:00'
              reading: 112 m³/s
              expected: 'climbed 16 in the hour'
              load: two fewer than the hour before
            - id: H11
              label: '11:00'
              reading: 124 m³/s
              expected: 'climbed 12 in the hour'
              load: four fewer than the hour before
            - id: H12
              label: '12:00'
              reading: 132 m³/s
              expected: 'climbed 8 in the hour'
              load: four fewer than the hour before
            - id: H13
              label: '13:00'
              reading: 136 m³/s
              expected: 'climbed 4 in the hour'
              load: four fewer than the hour before
          target: H10
          minReadings: 3
          commit: Name the hour
        answerText: >-
          Ten o'clock. The flow is still climbing there and climbing more slowly than it was — the
          increments run 14, 16, 18, 16, 12, and the sign of their change turns between 19.
        why: >
          Every reading in this column is higher than the one before it. So the first derivative never changes
          sign. The flow does not peak anywhere on the screen. What changes is the second derivative: the
          increments grow to 18 and then shrink. That turn is the earliest thing on a hydrograph that says the
          event has a top. It arrives hours before the top does. That is the whole reason to look for it.
          Reading only the flow leaves nothing to say until the peak has already passed.
      - group: STORE
        task: Find the day the level turns over, and prove it is a maximum
        title: Where the curve turns
        place: Storage & Level Board
        scene: >
          Ferrand has the level fitted to h(t) = 214.6 + 0.9t − 0.03t², with t in days from Monday.
          Halloran wants the day it stops rising and will not take a shape off a screen for it.
        guide: >-
          Build the working down a line at a time. Finding where the level stops rising is finding where its
          rate is zero. But that is only half the job. A zero rate is a turning point. This one has to be
          shown to be a maximum rather than a minimum. Halloran will not take a shape off a screen, so the
          classification has to come out of the working.
        background:
          - >-
              Why a zero rate is not yet an answer. The derivative is zero at a peak, at a
              trough and at a shelf. Solving h′(t) = 0 tells you where something happens; it
              does not tell you what. On a reservoir level the difference between the two is
              the difference between standing down and evacuating.
          - >-
              Two ways to settle it, and what each costs. The second derivative at the
              critical point is quickest: negative means the slope is falling through zero,
              which is a maximum. Checking the sign of the first derivative either side is
              slower and works when the second derivative is zero. Both are legitimate; the
              working has to show one.
          - >-
              Why a picture is not enough. A plotted curve with a flat top is convincing and
              unquotable: the eye cannot separate a maximum from a long shelf, and the
              screen's scale can hide either. A classification that follows from the algebra
              is the same claim in a form somebody else can check.
        assumes:
          - a quantity stops rising where its derivative is zero
          - the sign of the second derivative distinguishes a maximum from a minimum
        takeaway: A critical point says where a quantity turns; only the second derivative says which way it turns.
        format: DERIVE
        question: >-
          Find the day the level stops rising, and establish that it is a maximum rather than a
          minimum.
        derive:
          hint: >-
            Differentiate, set the derivative to zero, then differentiate again to classify it.
          start: 'h(t) = 214.6 + 0.9t − 0.03t²'
          startNote: 'metres above datum, t in days from Monday'
          goal: 'the day h stops rising, classified'
          steps:
            - ask: Differentiate the level with respect to time.
              answer: 1
              candidates:
                - text: "h'(t) = 214.6 + 0.9 − 0.06t"
                  rule: constant
                  why: >-
                    The derivative of a constant is 0, so the 214.6 does not survive
                    differentiation. Carried through it swamps everything else on the line.
                - text: "h'(t) = 0.9 − 0.06t"
                  rule: power
                - text: "h'(t) = 0.9 − 0.03t"
                  rule: power
                  survives: true
                  why: >-
                    The power rule brings the exponent 2 down as a factor, so −0.03t² differentiates
                    to −0.06t. Halving it doubles the day the level turns over, and every line after
                    this one stays perfectly consistent with it.
                - text: "h'(t) = 0.9t − 0.06t"
                  rule: power
                  why: >-
                    The term 0.9t differentiates to 0.9, with no t left. Keeping the t makes the
                    derivative 0 at t = 0 and nowhere else.
            - ask: Set the derivative to zero and solve for the day.
              answer: 0
              candidates:
                - text: '0.9 − 0.06t = 0, so t = 0.9 ÷ 0.06 = 15 days'
                  rule: critical point
                - text: '0.9 − 0.06t = 0, so t = 0.06 ÷ 0.9 ≈ 0.067 days'
                  rule: critical point
                  survives: true
                  why: >-
                    The rearrangement is inverted. It gives a plausible-looking small number in the
                    right units, an hour and a half after Monday midnight, and nothing later in the
                    working contradicts it.
                - text: '0.9 − 0.06t = 0, so t = 0.9 × 0.06 = 0.054 days'
                  rule: evaluation
                  why: >-
                    Solving for t divides by the coefficient in front of it rather than multiplying
                    by it. The units alone rule this out.
            - ask: Classify the critical point.
              answer: 2
              candidates:
                - text: "h''(t) = +0.06, so the critical point is a minimum"
                  rule: second derivative
                  why: >-
                    Differentiating −0.06t gives −0.06. The sign carries through, and getting it
                    wrong turns the highest level of the fortnight into the lowest.
                - text: "h''(t) = −0.06t, so it is a maximum only on the days after t = 0"
                  rule: second derivative
                  survives: true
                  why: >-
                    The derivative of −0.06t is the constant −0.06, with no t in it. Carrying the t
                    through makes the classification depend on the day, which it does not, and the
                    conclusion is still right for every day that matters.
                - text: "h''(t) = −0.06 everywhere, so the critical point is a maximum"
                  rule: second derivative
          commit: Report the day
        answerText: >-
          Day 15, and it is a maximum — the second derivative is −0.06 at every day, so the curve is
          concave down everywhere and the single critical point can only be a top.
        why: >
          Setting the derivative to zero finds where the level stands still. On its own that
          does not say whether it is a crest or a trough. A reservoir topping out on day 15 and
          One bottoming out on day 15 have the same first derivative there. The second
          derivative settles it with no further data. Because it is a constant here, it settles
          it on every day at once. A curve concave down over the whole fortnight has at most one
          turning point, so the day is unique as well as classified.
      - group: SAFE
        task: Say which peak the reach should be told about
        title: The two peaks are not the same hour
        place: Downstream Warning Desk
        scene: >
          Baptiste has the inflow curve and the level curve on the same axes, peaking at different
          hours, and a reach to warn. Etta Prowse, the riverside landowner representative, wants to know which one the warning is about.
        guide: >-
          All four options name a moment that is genuinely visible on the traces. They
          differ in which curve is being watched: the inflow, the outflow, or the
          difference between them. Storage answers to the difference and to nothing
          else. Warning a reach on the strength of an upstream peak is wrong in the
          expensive direction. The highest water arrives after the news that it would
          not.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be the answer under
              one specific misreading. A step skipped. A quantity confused with a rate. A correlation taken for a
              cause. Identifying which misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance. That was 88 per
              cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason is
              indistinguishable from a sound one. That stays true until the day the approximation is
              what is being tested.
        assumes:
          - the level rises whenever inflow exceeds outflow and falls whenever it does not
          - a quantity turns over where its own rate of change passes through zero
        takeaway: The reservoir peaks when the net flow is zero, which is later than the inflow peak and has nothing to do with it.
        format: CHOICE
        question: When does the reservoir level reach its highest point?
        choices:
          - When inflow falls back to equal the outflow
          - When the inflow reaches its own peak value
          - When the inflow stops getting steeper, at the inflection
          - When the outflow through the machines is largest
        answer: When inflow falls back to equal the outflow
        why: >
          The level is an accumulation and the net flow is its derivative. So the level turns
          over exactly where inflow minus outflow crosses zero. At the inflow peak the net flow
          is still strongly positive. The river is delivering more than the dam is passing, and
          the reservoir goes on filling for hours, usually most of a day. Telling the reach the
          peak has passed on the strength of an upstream gauge is wrong in the direction that
          costs the most. The highest water arrives after the news that it would not.
        rebuttals:
          - At the inflow peak the net flow is still positive, so the reservoir is still filling.
          - The inflection is where the climb slackens; the flow there is still well above the outflow.
          - The outflow is a setting, and moving it changes when the net flow crosses zero rather than fixing it.


            - 3  (the coefficient of a in the derivative)
            - 1.5  (the coefficient of a squared in the moment itself)
            - 24  (twice the constant term)
            - 2  (the exponent in the moment)
          values: [12, 3, 1.5, 24, 2]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 4
          tolerance: 0.4
          units: metres of uplift extent
          solution: 12 ÷ 3 = 4 metres, where 12 − 3a first reaches 0.
          explanation: >
            4 metres, giving a moment of 24 meganewton metres per metre of wall. Dividing by 1.5
            instead of 3 puts it at 8 metres, which is beyond the base of the dam — the answer
            leaves the structure, and the only thing that catches it is the factor the power rule
            brought down.
          givens:
            - M(a) = 12a − 1.5a², in meganewton metres per metre of wall
            - The base is 6.5 m from heel to toe
          relationship: >
            M'(a) = 12 − 3a, and the maximum is where M'(a) = 0 — so a = 12 ÷ 3.
        answerText: 4 metres of uplift extent, for a moment of about 24 meganewton metres per metre.
      - group: GATES
        task: Say where the rating is most sensitive
        title: A maximum with no critical point
        place: Gate Chamber
        scene: >
          Wilkes has yesterday's sensitivity, dQ/dH = 31.5·H^(1/2), and a head range the gates hold
          between 0.5 and 3.0 metres. He wants the head at which a centimetre of level does the most.
        guide: >-
          Build it a line at a time. The sensitivity rises with head and never turns over. So there is no
          critical point to find. The greatest value has to be at an end of the range the gates hold. Say
          which end and say why, because 'the derivative is zero somewhere' is the answer this stop is written
          to catch.
        background:
          - >-
              Why there is no critical point. dQ/dH goes as the square root of H, which is increasing everywhere
              on 0.5 to 3.0 metres. Its own derivative is never zero on that interval. So the usual routine — set
              the derivative to zero, solve, classify — produces nothing at all. The extreme value is still there;
              it is just on the boundary.
          - >-
              What the theorem actually promises. A continuous function on a closed interval
              attains a maximum and a minimum. It does not promise they are interior.
              Candidates are the critical points *and* the endpoints, and half the exam
              marks lost on this topic are lost by checking only the first list.
          - >-
              What it means at the sill. The deeper the water over the crest, the more a centimetre of level is
              worth in discharge. So the gate operator's attention should be highest when the head is highest.
              That is the opposite of the intuition that a nearly empty spillway is the twitchy one.
        assumes:
          - a continuous quantity on a closed interval attains a largest value somewhere on it
          - a critical point is where the derivative is zero or does not exist
        takeaway: A function with no critical point inside an interval still has a maximum, and it is at an end of the interval.
        format: DERIVE
        question: >-
          Establish where on the range the sensitivity is greatest, and say why it is there.
        derive:
          hint: >-
            Look for a critical point first. What you do next depends on whether there is one.
          start: 'dQ/dH = 31.5·H^(1/2)'
          startNote: 'the sensitivity of discharge to head, over 0.5 m ≤ H ≤ 3.0 m'
          goal: 'the head at which the sensitivity is greatest'
          steps:
            - ask: Differentiate the sensitivity and look for a critical point in the range.
              answer: 0
              candidates:
                - text: 'd²Q/dH² = 15.75·H^(−1/2), which is never 0 for H above 0'
                  rule: power
                - text: 'd²Q/dH² = 15.75·H^(1/2), which is never 0 for H above 0'
                  rule: power
                  survives: true
                  why: >-
                    The power rule drops the exponent from 1/2 to −1/2. This line reaches the same
                    conclusion by luck, and the luck runs out the moment the exponent is anything
                    else — which is why the reason has to be right as well as the answer.
                - text: 'd²Q/dH² = 31.5·H^(−1/2)'
                  rule: power
                  why: >-
                    The exponent 1/2 comes down as a factor as well as dropping by 1. Half the
                    coefficient is missing.
                - text: 'd²Q/dH² is 0 at H = 0, so there is a critical point in the range'
                  rule: critical point
                  why: >-
                    H = 0 is outside this interval, which starts at half a metre. A critical point
                    that lies outside the interval is not a candidate for a maximum on it.
            - ask: Say where the greatest sensitivity is, and why.
              answer: 0
              candidates:
                - text: 'at H = 3.0 m, the upper endpoint, since the sensitivity only increases'
                  rule: endpoint
                - text: 'at H = 0.5 m, the lower endpoint, since the second derivative is falling'
                  rule: endpoint
                  survives: true
                  why: >-
                    The second derivative is positive and shrinking in size. A shrinking positive
                    slope is still a positive slope, so the sensitivity is still climbing all the way
                    to the top of the range.
                - text: 'nowhere, since a quantity with no critical point has no maximum'
                  rule: critical point
                  why: >-
                    A continuous quantity on a closed interval always attains a maximum. If it is not
                    at a critical point, it is at an end.
          commit: Report the head
        answerText: >-
          At the top of the range, 3.0 metres, where a centimetre of head is worth about 55 cubic
          metres a second — there is no interior critical point, so the maximum has to be at an end.
        why: >
          Looking for a critical point and finding none is a result, not a dead end. The
          sensitivity here is a square root with a positive coefficient. It climbs across the
          whole interval and never turns. Its own derivative is positive everywhere and merely
          gets smaller, which is the step easiest to misread as flattening off. On a closed
          interval a continuous quantity always attains a maximum. So once no interior candidate
          exists, the two ends are the only places left, and one of them wins.
      - group: POWER
        task: Find the flow that makes the most power
        title: More water, less power
        concept: Critical points, the first derivative test and optimisation
        place: Powerhouse
        scene: >-
          More water through a turbine is more power, up to a point. As the flow rises
          the penstock loses head, and eventually less head per cubic metre beats more
          cubic metres. Anand has the machines on manual, and wants the flow to run them
          at tonight found on the instrument rather than argued at the table.
        guide: >-
          Drag the flow. The readout is the output in megawatts, and higher is better;
          only the flows you stop at get plotted. The curve rises, turns over and comes
          back down, so the setting you want is somewhere inside the range rather than
          at either end of it. Sweep the whole range before deciding, then mark the flow
          you would run and commit.
        background:
          - >-
              Where the head goes. Friction in the penstock rises roughly as the square of
              the flow, so doubling the flow costs four times as much head. The turbine is
              paid in head times flow, which means the two terms fight: one grows steadily,
              the other is eaten faster and faster.
          - >-
              Why the answer is in the interior. When two effects pull opposite ways and one accelerates, the
              total has a maximum somewhere in the middle. At that maximum neither effect is at its own best. This
              is the shape behind most operating points in the plant. It is the reason a plant has an operating
              point at all rather than a throttle you open fully.
          - >-
              What the top of the curve is like. Near the maximum the output changes slowly
              with flow, which is why an operator can trade a little output for a steadier
              machine. Far from it the loss is quick: at the top of the range these machines
              make less than half of what they can.
        assumes:
          - the head available to a turbine falls as the flow through it rises
          - a quantity that rises and then falls has a largest value somewhere between
        takeaway: Two effects pulling opposite ways put the best setting in the interior of the range, where neither of them is at its own best.
        format: SWEEP
        question: >-
          Move the flow and watch the output. Where should the machines be run tonight?
        sweep:
          axis:
            label: Flow through the machines
            unit: m³/s
            min: 0
            max: 90
            step: 1
          readout:
            label: Output
            unit: MW
          baseline: 0
          response:
            - { at: 0, value: 0 }
            - { at: 10, value: 5.19 }
            - { at: 20, value: 10.08 }
            - { at: 30, value: 14.34 }
            - { at: 40, value: 17.68 }
            - { at: 50, value: 19.78 }
            - { at: 55, value: 20.25 }
            - { at: 60, value: 20.33 }
            - { at: 65, value: 19.93 }
            - { at: 70, value: 18.94 }
            - { at: 75, value: 17.58 }
            - { at: 85, value: 12.90 }
            - { at: 90, value: 9.60 }
          target: 58
          tolerance: 4
          start: 20
          commit: Mark the flow
        answerText: >-
          About 58 cubic metres a second, for a little over 20 megawatts. Driving harder past that
          costs more head than the extra flow is worth, and at 90 the machines make less than half of it.
        why: >
          Output is flow times head, and the head is itself falling with the square of the flow, so the
          product climbs, flattens and turns over. Differentiating 8.6Q(61 − 0.006Q²) gives 8.6(61 − 0.018Q²),
          which is 0 near 58 — the same place the trace turns, found by calculus instead of by hunting. The
          shape is the lesson. Near the top the curve is almost flat. Being a few cubic metres a second out
          costs almost nothing there. The same error low on the curve costs a great deal.

  # ---------------------------------------------------------------- day 8
  # Unit 6 — average value of a function, and the mean value theorem that says it
  # is attained.
  - title: The release that just clears it
    objective: Reduce a varying rate to the single steady one with the same total, and say what that guarantees.
    briefing: A schedule that varies all day, and a committee that wants one number for it.
    stake: >-
      Monday of the second week. The release schedule changes through the day. The liaison
      committee wants one figure for it. That sounds like rounding off. It is a definite
      integral. Berg needs the same figure for her own reason. A steady release with the same
      total is the release she would have made on the first day. That comparison is the whole of
      her argument with Halloran. Today you reduce a changing rate to the one steady rate with
      the same total. Then you say what that steady rate guarantees about the morning it came
      from.
    takeaway: The average value of a rate is its accumulation divided by the interval, and a continuous rate attains it somewhere inside.
    stops:
      - group: STORE
        task: Reduce the morning to one steady flow
        title: One number for six hours
        place: Storage & Level Board
        scene: >
          Ferrand has Wednesday's 6 hours totalled at 1,582,200 cubic metres and a committee sheet
          with 1 line on it for the morning. He wants the steady flow that would have delivered the
          same water.
        guide: >-
          The numbers on offer include a volume, the interval written in two different
          units, and two sums of readings. Only one pair is a volume and the time it
          took. An average value is an accumulation divided by a length, so the divisor
          has to be in the units the answer is quoted in. Mixing hours into a figure
          quoted per second is an error the arithmetic never reveals.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. Two things are being tested. Can you pick the quantities the relationship actually needs? And does the
              size of the answer look right once they are in place?
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch is caught before it is placed. It is also how a quantity
              belonging to a different part of the problem is caught. That is the habit this format
              exists to build.
        takesAsRead:
          - The definite integral as an accumulation, and its units
        assumes:
          - the accumulation of a rate over an interval divided by that interval is a rate again
          - 6 hours is 21,600 seconds
        takeaway: The average value of a rate is the accumulation divided by the length of the interval, not the average of the readings taken.
        format: BALLPARK
        question: Estimate the steady flow that would have delivered the same volume in the same six hours.
        why: >
          An average value is an integral divided by an interval, and the division is what turns a volume back
          into a flow. It is not the mean of the readings unless they happen to be evenly spaced in time. On a
          gauge that reports on demand they often are not. That is the error the definition exists to prevent.
          What comes out is the flat line with the same area underneath it as the real hydrograph. That is
          exactly the object a committee sheet with one line on it is asking for.
        estimate:
          prompt: >
            The morning delivered 1,582,200 cubic metres. The average value of a rate is its
            accumulation divided by the length of the interval, and 6 hours is 21,600 seconds.
          question: Choose the volume and the length of the interval in seconds.
          labels:
            - 1582200  (volume that arrived, cubic metres)
            - 21600  (seconds in the 6 hours)
            - 6  (hours in the interval)
            - 5400  (seconds in 1 reading interval)
            - 293  (the trapezoid sum of the readings)
          values: [1582200, 21600, 6, 5400, 293]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 73.25
          tolerance: 4
          units: cubic metres a second
          solution: 1,582,200 ÷ 21,600 ≈ 73 cubic metres a second.
          explanation: >
            About 73 cubic metres a second. Dividing by the 6 rather than by the 21,600 seconds
            gives 263,700, which is not a flow at all — and it is the mistake that survives longest,
            because the number is large and a flood morning is expected to produce a large number.
          givens:
            - 1,582,200 m³ delivered across the morning
            - The interval was six hours
          relationship: >
            Average value = (1 ÷ (b − a)) × ∫f — the accumulation over the interval, divided by the
            length of the interval, with both in the same units of time.
        answerText: About 73 cubic metres a second, steady, for the same 6 hours.
      - group: INFLOW
        task: Say what an average guarantees about the record
        title: Whether the river ever ran at it
        place: Catchment & Inflow Desk
        scene: >
          Prowse has the published figure for the morning and the gauge trace beside it, and points out one
          thing. No reading in the column is that number. Ekundayo has to say what the figure does and does
          not claim.
        guide: >-
          All four answers concede that no written-down reading equals the average. They
          differ on what that leaves: some instant, one particular instant, two
          instants, or nothing at all. Continuity is the fact doing the work here, not
          the arithmetic of the mean. Whether a published figure describes the morning
          or is only an artefact of division is what this distinction decides.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be the answer under
              one specific misreading. A step skipped. A quantity confused with a rate. A correlation taken for a
              cause. Identifying which misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance. That was 88 per
              cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason is
              indistinguishable from a sound one. That stays true until the day the approximation is
              what is being tested.
        takesAsRead:
          - Limits, one-sided limits, and where a limit fails to exist
        assumes:
          - a gauge trace of a river is continuous, without jumps
          - a continuous quantity takes every value between any two it takes
        takeaway: A continuous rate attains its own average somewhere inside the interval, though not necessarily at any moment somebody happened to write down.
        format: CHOICE
        question: What follows from the morning having averaged 73 cubic metres a second?
        choices:
          - At some instant in the 6 hours it ran at exactly 73
          - It ran at 73 at the midpoint of the 6 hours
          - It ran at 73 at least twice, once climbing and once falling
          - Nothing follows, since an average need not be attained
        answer: At some instant in the 6 hours it ran at exactly 73
        why: >
          The average lies between the lowest and the highest values the flow took. A river's
          discharge is continuous, so it cannot get from 48 to 96 without passing through every
          number between. The average is therefore attained at at least one instant. That is
          what makes the published figure a statement about the morning rather than an artefact
          of arithmetic. It says nothing about when. On a rise that steepens the crossing is
          later than the middle of the interval, and on a record that turns over it happens
          twice.
        rebuttals:
          - The midpoint is where a straight-line rate attains its average; a curving one crosses somewhere else.
          - Twice is what happens on a record that turns over. This morning rose throughout and crossed once.
          - Continuity is what makes it attained; without it, an average really can fall in a gap.
      - group: POWER
        task: Differentiate a product where both factors move
        title: Two things moving at once
        place: Powerhouse
        scene: >
          Mercy Anand writes the machine output as P = 8.6·Q·H, in kilowatts, with Q the flow through
          the turbines and H the head on them. Both are moving this afternoon, and the grid wants a
          rate of change of output.
        guide: >-
          Build it a line at a time. Output depends on flow and on head, and both are moving this afternoon.
          So differentiating with respect to time needs the product rule. It produces a term for each.
          Evaluate with the afternoon's numbers, and notice that the two terms can pull in opposite
          directions.
        background:
          - >-
              Why the product rule is the whole story. P is a constant times Q times H. Its rate of change is
              therefore the constant times the sum of two products. The first is how fast Q is changing times the
              current H. The second is how fast H is changing times the current Q. Neither term is meaningful
              alone, and the grid is asking about their sum.
          - >-
              Why the two terms fight. Opening the gates raises Q and lowers H, because more flow through the
              penstock costs head. So dQ/dt is positive while dH/dt is negative. The output may rise or fall
              depending on which product is larger. That is the same trade the operating point on day three is
              chosen against.
          - >-
              Why the grid wants a rate. A generator's output is scheduled, and a deviation is priced. Knowing the
              rate at which output is drifting is what lets a schedule be met without chasing it. It is a number
              the operator can produce from two gauges and one derivative.
        assumes:
          - a product of two quantities that both change has a rate from each of them
          - a constant factor passes through a derivative unchanged
        takeaway: When two factors change at once the rate is the sum of two terms, each holding one factor still.
        format: DERIVE
        question: >-
          Derive the rate of change of output, and evaluate it with the afternoon's numbers.
        derive:
          hint: >-
            Both Q and H are functions of time. Choose the line that follows.
          start: 'P = 8.6·Q·H'
          startNote: 'kilowatts, with Q in m³/s and H in metres'
          goal: 'dP/dt in terms of dQ/dt and dH/dt'
          steps:
            - ask: Differentiate the product with respect to time.
              answer: 1
              candidates:
                - text: 'dP/dt = 8.6·(dQ/dt)·(dH/dt)'
                  rule: product
                  why: >-
                    The product rule is a sum of two terms, not a product of two derivatives. This
                    also has the wrong units — kilowatts per second squared.
                - text: 'dP/dt = 8.6·((dQ/dt)·H + Q·(dH/dt))'
                  rule: product
                - text: 'dP/dt = 8.6·(dQ/dt)·H'
                  rule: product
                  survives: true
                  why: >-
                    This is the product rule with the head held constant, which is the standing
                    assumption in the powerhouse and is false on any day the reservoir is filling. It
                    stays valid arithmetic and reports a rate short by the whole second term.
                - text: 'dP/dt = 8.6·Q·H·(dQ/dt + dH/dt)'
                  rule: chain
                  why: >-
                    That is what the derivative of an exponential in Q and H would look like. A plain
                    product does not reproduce itself when it is differentiated.
            - ask: 'Evaluate it, with Q = 46, H = 61, dQ/dt = 0 and dH/dt = 0.000011 m/s.'
              answer: 0
              candidates:
                - text: 'dP/dt = 8.6 × (0 × 61 + 46 × 0.000011) ≈ 0.0044 kW/s'
                  rule: constant
                - text: 'dP/dt = 8.6 × (0 × 61 + 46 × 0.000011) ≈ 0.0044 kW'
                  rule: constant
                  survives: true
                  why: >-
                    The arithmetic is right and the unit is not. A rate of change of power is
                    kilowatts per second, and reported as kilowatts it reads as an output of 4
                    watts rather than a climb of 16 kilowatts an hour.
                - text: 'dP/dt = 8.6 × 46 × 61 × 0.000011 ≈ 0.27 kW/s'
                  rule: product
                  why: >-
                    That multiplies the whole output by the head rate, which is the exponential form
                    again. The second term of the product rule is Q·dH/dt and carries no H.
          commit: Report the rate
        answerText: >-
          About 0.0044 kilowatts a second — roughly 16 kilowatts an hour, entirely from the
          head, with the gates untouched.
        why: >
          A product of two changing quantities has two rates in it. The product rule keeps them separate. One
          term has the flow moving and the head held. The other is the other way round. Today the first term
          is zero because nobody has touched a gate. That makes the whole rise a head effect. The machines are
          producing more because the reservoir is filling behind them. That is worth knowing before anybody
          credits the operators. Multiply the two derivatives together instead and the answer is not merely
          wrong, it is not power per unit time at all.

  # ---------------------------------------------------------------- day 3
  # Unit 6 — Riemann sums, the definite integral as an area, and what each expression means.
  - title: The ledger that will not close
    objective: Solve the drawdown equation, and find what a single reading leaves undetermined.
    briefing: The low-level outlet is open and the level is falling on a curve nobody has written down yet.
    stake: >-
      Tuesday. The low-level outlet has been open since first light. The level is falling, and
      it is not falling at a steady rate. The head driving the outlet is the very thing that is
      going down. Ferrand wants the level as a function of time, not as a table. That means
      solving the equation instead of reading it off. Ekundayo has one gauge reading, six hours
      old. He is being asked to state a drain constant from it. That turns out to be two
      questions wearing one number. Today you solve the drawdown equation. Then you turn what it
      gives you into an hour somebody can act on.
    takeaway: A rate that depends on the quantity itself is solved by separating and integrating, and the constant that comes out needs its own measurement.
    stops:
      - group: STORE
        task: Solve the drawdown equation
        title: The level that drains itself slower
        place: Storage & Level Board
        scene: >
          Ferrand has the outlet behaving as dh/dt = −k·√h, with h the head on it in metres and k
          about 0.10 an hour. He wants the level as a function of time, not another table of readings.
        guide: >-
          Build it a line at a time. The relation gives the rate of change of the level in terms of the level
          itself. That is what a differential equation is. So the move is to separate the two variables and
          integrate both sides. Finish with the level as a function of time, not another table of readings.
        background:
          - >-
              Why the outlet behaves this way. Flow out of an opening goes as the square
              root of the head above it, so a falling level drains more slowly the lower it
              gets. That is the physics in dh/dt = −k√h, and it is why the drawdown is not a
              straight line however steady the outlet is.
          - >-
              What separating variables means. Get every h on one side with the dh, and every t on the other with
              the dt. Each side is then an ordinary integral. The constant of integration is fixed by the level at
              the moment you started. That is why an initial condition is part of the answer rather than an
              afterthought.
          - >-
              Why a function beats a table. A table answers the times somebody happened to write down. A function
              answers when the level will reach the outlet. It answers how long a drawdown will take. It answers
              what happens if k is a little different. That is the difference between a record and a tool.
        assumes:
          - a differential equation with the variables on separate sides can be integrated side by side
          - an antiderivative raises a power by one and divides by the new power
        takeaway: Separating the variables turns a rate that depends on the quantity into two ordinary integrals, one on each side.
        format: DERIVE
        question: >-
          Solve the drawdown equation for the level as a function of time.
        derive:
          hint: >-
            Get every h on one side and every t on the other, then integrate both sides.
          start: 'dh/dt = −k·√h'
          startNote: 'h in metres of head on the outlet, k ≈ 0.10 an hour'
          goal: 'h as a function of t'
          steps:
            - ask: Separate the variables.
              answer: 0
              candidates:
                - text: 'h^(−1/2)·dh = −k·dt'
                  rule: separation
                - text: 'h^(1/2)·dh = −k·dt'
                  rule: separation
                  survives: true
                  why: >-
                    Dividing by √h gives h to the power −1/2, not +1/2. The line separates cleanly
                    and integrates to a law of the right general shape, falling with time, so nothing
                    downstream objects to it.
                - text: 'dh = −k·√h·dt, with the h still on the right'
                  rule: separation
                  why: >-
                    Nothing has been separated. An integral with h on both sides cannot be evaluated
                    a side at a time, which is the only reason for doing this step.
                - text: 'h^(−1/2)·dh = −k·h·dt'
                  rule: chain
                  why: >-
                    Dividing by √h takes it off the right-hand side altogether. It cannot then
                    reappear there in a different power.
            - ask: Integrate both sides.
              answer: 1
              candidates:
                - text: '√h = −k·t + C'
                  rule: antiderivative
                  why: >-
                    Raising −1/2 by 1 gives +1/2, and dividing by that new exponent multiplies by
                    2. The missing factor of two halves every drawdown time this produces.
                - text: '2·√h = −k·t + C'
                  rule: antiderivative
                - text: '(1/2)·√h = −k·t + C'
                  rule: antiderivative
                  survives: true
                  why: >-
                    Dividing by the new exponent of 1/2 means multiplying by 2, not halving. The
                    curve has exactly the right shape and every time it predicts is out by a factor
                    of four.
                - text: 'ln(h) = −k·t + C'
                  rule: antiderivative
                  why: >-
                    The logarithm is the antiderivative of h to the power −1, not −1/2. It is the
                    solution to an outlet whose flow is proportional to the head itself.
            - ask: Apply the level at the start and solve for h.
              answer: 0
              candidates:
                - text: 'h(t) = (√h₀ − k·t/2)²'
                  rule: initial condition
                - text: 'h(t) = (√h₀ − k·t)²'
                  rule: initial condition
                  survives: true
                  why: >-
                    The factor of two from the integration divides the kt term when the equation is
                    rearranged. Without it the reservoir empties in half the time, on a curve of
                    exactly the same shape, and nothing but a clock catches it.
                - text: 'h(t) = h₀ − k·t'
                  rule: initial condition
                  why: >-
                    That is the solution for a constant drain rate. The square root is there
                    precisely because a falling level drains more slowly than a high one.
                - text: 'h(t) = h₀·e^(−k·t)'
                  rule: initial condition
                  why: >-
                    Exponential decay solves the equation where the rate is proportional to h. It
                    never reaches zero, and an outlet on a reservoir does.
          commit: Report the solution
        answerText: >-
          h(t) = (√h₀ − kt/2)² — a parabola in time, reaching 0 head at t = 2√h₀ ÷ k, which is a
          finite hour rather than an approach that never arrives.
        why: >
          Separating the variables is the whole method. The equation ties a rate to the quantity
          itself, and dividing through by the square root puts every h on one side and every t
          on the other. Each side can then be integrated on its own. What comes out is not the
          exponential everybody expects from a draining tank. The square root makes it a
          parabola, and a parabola reaches zero. That decides an operational question rather
          than a mathematical one, because this outlet finishes at a stateable hour and a
          decaying exponential never would.
      - group: INFLOW
        task: Say what one reading leaves undetermined
        title: The reading that fits many curves
        concept: Separable differential equations
        place: Catchment & Inflow Desk
        scene: >
          Ekundayo has one level reading six hours into the drawdown and is being asked for the drain
          constant. Rasmussen has a second reading from 12 hours later and has not brought it
          over yet.
        guide: >-
          Two controls move the predicted curve, and the readout is how well that curve
          matches the reading you have. One reading is not enough to pin both: you will
          find a whole family of settings that match it equally well. Slide along that
          family, see how wide it is, and only then bring in the second reading. Report
          the drain constant when you can say it rather than guess it.
        background:
          - >-
              Why one reading cannot do it. A drawdown curve has a size and a rate, and a single level six hours
              in constrains their combination rather than either one. Trade a larger initial volume against a
              slower drain, and the curve passes through the same point. That is what the family of settings you
              can slide along actually is.
          - >-
              What breaks the tie. A second reading twelve hours later is on a different part of the curve. There
              the same trade no longer holds. Settings that agreed at six hours disagree at eighteen. That is why
              the second observation is worth more than a repeat of the first, and why Rasmussen's undelivered
              reading is the whole stop.
          - >-
              Why this matters beyond the arithmetic. Reporting a drain constant from one
              reading is reporting a number the data does not contain. The honest answer at
              that point is the range, and the professional move is to go and get the
              reading that narrows it.
        assumes:
          - a solved differential equation carries a constant that the equation itself does not fix
          - two unknowns need two independent measurements
        takeaway: A single reading fits a whole family of starting levels and drain constants, and only a second reading at a different time picks one out.
        format: DEGENERACY
        question: >-
          Match the six-hour reading, then say what the drain constant actually is.
        degeneracy:
          hint: >-
            Both controls change the predicted curve. Watch how well it matches the reading you have.
          observable: { label: Match to the six-hour reading }
          controls:
            - { id: h0, label: Starting head, min: 15, max: 32, step: 0.5, unit: m }
            - { id: k, label: Drain constant, min: 0.02, max: 0.24, step: 0.01, unit: per hour }
          locus:
            - { a: 22.66, b: 0.02 }
            - { a: 23.81, b: 0.06 }
            - { a: 25.0, b: 0.10 }
            - { a: 26.21, b: 0.14 }
            - { a: 27.46, b: 0.18 }
            - { a: 28.73, b: 0.22 }
          second:
            label: The reading taken 12 hours later
            apply: Bring the eighteen-hour reading over
            locus:
              - { a: 18.32, b: 0.02 }
              - { a: 21.53, b: 0.06 }
              - { a: 25.0, b: 0.10 }
              - { a: 28.73, b: 0.14 }
          truth: { a: 25.0, b: 0.10 }
          tolerance: { a: 1.0, b: 0.02 }
          still: [outlet coefficient, silt on the intake screen]
          commit: Report the drain constant
        answerText: >-
          About 0.10 an hour, from a starting head near 25 metres — and it takes both readings to
          say so, because either one alone is matched by a whole line of pairs.
        why: >
          Integrating produced a constant, and the equation cannot supply it; only a measurement can. One
          reading is one equation in two unknowns. So a higher starting head paired with a faster drain
          reproduces it exactly. That is why the match stays perfect all along the curve. The second reading
          is not a repeat of the first. It is taken at a different time. So it constrains the same two
          unknowns in a different combination, and the two lines cross once. Sliding along a locus with a
          perfect match is what an underdetermined problem feels like from the inside.
      - group: SAFE
        task: Say when the outlet will have finished
        title: How long the drawdown takes
        concept: Separable differential equations
        place: Downstream Warning Desk
        scene: >
          Baptiste has the solved drawdown curve and a reach to warn. The head starts at 25 metres
          and the outlet has to be shut when it reaches 16, and she needs the hour rather than the
          shape.
        guide: >-
          Five numbers are offered and two of them are heads rather than roots of heads.
          The solved equation is written in square roots, so a head dropped straight
          into it is the wrong shape. Test each number against the form of the equation
          before its size. The square roots are also where the surprise lives. The
          second nine metres of drawdown take longer than the first, so a warning
          carried forward in a straight line arrives early.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. Two things are being tested. Can you pick the quantities the relationship actually needs? And does the
              size of the answer look right once they are in place?
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch is caught before it is placed. It is also how a quantity
              belonging to a different part of the problem is caught. That is the habit this format
              exists to build.
        assumes:
          - the drawdown solution can be rearranged for the time at a given head
          - the square root of 25 is 5 and the square root of 16 is 4
        takeaway: Rearranging the solved equation for time turns a curve into a number somebody can put on a warning.
        format: BALLPARK
        question: Estimate how long the outlet takes to bring the head from 25 metres to 16.
        why: >
          The solution rearranges to t = 2(√h₀ − √h) ÷ k. That is the whole practical value of having solved
          it. A curve becomes an hour somebody can act on. The square roots are also where the surprise is.
          The first 9 metres of drawdown take 20 hours. The next 9 take 26. The head driving the outlet is
          falling the whole time. A warning built on the first nine metres and carried forward linearly
          arrives early, and being early is not free on a river with people beside it.
        estimate:
          prompt: >
            The solution rearranges to t = 2 × (√h₀ − √h) ÷ k. The starting head is 25 metres, the
            target is 16, and the drain constant is 0.10 an hour.
          question: Choose the square root of the start, the square root of the target and the drain constant.
          labels:
            - 5  (the square root of the starting head)
            - 4  (the square root of the target head)
            - 0.10  (the drain constant, per hour)
            - 25  (the starting head itself, metres)
            - 9  (the difference between the 2 heads, metres)
          values: [5, 4, 0.10, 25, 9]
          slots: 3
          template: '2 × ({0} − {1}) ÷ {2}'
          formula: 2*(a-b)/c
          correct: [0, 1, 2]
          target: 20
          tolerance: 2
          units: hours
          solution: 2 × (5 − 4) ÷ 0.10 = 20 hours.
          explanation: >
            20 hours. Using the heads themselves rather than their roots gives 180 hours, which
            is a week and a half and would be believed by anybody who had not solved the equation —
            the roots are the whole content of the solution.
          givens:
            - Head starts at 25 m, outlet shuts at 16 m
            - Drain constant k ≈ 0.10 an hour
          relationship: >
            t = 2 × (√h₀ − √h) ÷ k, which is the drawdown solution rearranged for the time at a
            given head.
        answerText: About 20 hours to bring the head from 25 metres to 16.

  # ---------------------------------------------------------------- day 10
  # Unit 8 — volume by cross-sections, and what happens to every accumulation when
  # the integrand turns out to have been wrong.
      - group: SAFE
        task: Sort the instrument readings before the morning report.
        title: Rising, or reading high
        concept: "Linear approximation, differentials, and the error the curvature costs"
        place: Instrument Room
        scene: The morning report needs the night's readings sorted first. Some of what moved overnight is the dam and the water. The rest is the instrument, and both arrive as a number that changed.
        guide: >-
          Two bins. Something real moves in a way the physics allows and other instruments
          agree with — a piezometer follows the level, a plumbline follows the temperature. An
          instrument fault moves in ways nothing corroborates: instantly, off scale, or not at
          all when everything else has.
        background:
          - >-
              Why corroboration rather than plausibility. Dam instruments are redundant on purpose:
              two piezometers in one line, plumblines and geodetic survey measuring the same
              movement. A reading with no partner moving is a reading about the instrument.
          - >-
              What a real movement looks like overnight. Small, smooth, and correlated with something
              — the level, the temperature, the season. Concrete moves with temperature every day of
              its life, and a plumbline that did not move overnight is the surprising one.
        assumes:
          - an instrument can fail while the thing it measures does not
        takeaway: What decides whether a reading is real is whether anything else agrees with it.
        format: BELT
        question: Send each overnight change to the bin that says what moved.
        answerText: Anything smooth, small and corroborated is the dam or the water. Anything instant, off scale, frozen or alone is the instrument.
        why: >-
          A dam is instrumented redundantly because a single number cannot be checked. Real movement is
          smooth, small and correlated. The piezometers follow the reservoir level with a lag. The plumblines
          swing with the daily temperature cycle. The seepage weir rises when the level does. A fault is none
          of those things. It steps instantly, parks past the end of its range, freezes while everything
          around it moves, or contradicts the second instrument in the same borehole. That is why the sort is
          by corroboration rather than by how alarming the number is. It is also why the frozen reading
          matters as much as the jumping one. Concrete moves with temperature every night of its life. So a
          plumbline that did not move is not reassuring. It is an instrument that has stopped reporting. And
          this is the one structure where nobody can afford to find that out later.
        belt:
          left: { name: The dam or water }
          right: { name: The instrument }
          need: 20
          lives: 3
          pass: 0.8
          hint: Ask whether anything else on the dam agrees with it.
          items:
            - { name: Piezometer follows level, bin: left }
            - { name: Plumbline daily swing, bin: left }
            - { name: Seepage tracks level, bin: left }
            - { name: Joint opens cold, bin: left }
            - { name: Both piezometers move, bin: left }
            - { name: Survey agrees, bin: left }
            - { name: Smooth seasonal drift, bin: left }
            - { name: Uplift after rain, bin: left }
            - { name: Crest with temperature, bin: left }
            - { name: Tailwater follows discharge, bin: left }
            - { name: Slow settlement trend, bin: left }
            - { name: Weir follows inflow, bin: left }
            - { name: Instant step, bin: right }
            - { name: Off the scale, bin: right }
            - { name: Frozen all night, bin: right }
            - { name: Contradicts its pair, bin: right }
            - { name: Negative seepage, bin: right }
            - { name: Toggling every reading, bin: right }
            - { name: Changed with reset, bin: right }
            - { name: Zero exactly, bin: right }
            - { name: Impossible rate, bin: right }
            - { name: Moved with maintenance, bin: right }
            - { name: Datalogger clock jump, bin: right }
            - { name: Noise floor gone, bin: right }
            - { name: Stuck at maximum, bin: right }
            - { name: Reads before installation, bin: right }
          commit: Start the line
  - title: Every number again
    objective: Rebuild the volume from the area curve, and find which quantity the correction reaches.
    briefing: The survey boat has been out, and the curve every volume on this site came through is wrong.
    stake: >-
      Wednesday. Ilya Rasmussen has been out over the reservoir with an echo sounder. The stage
      to storage curve was surveyed in 2003 and never done again. Two decades of silt have
      settled since. So the surface area at any given level is smaller than the old sheet says.
      Nothing was faked and nobody was careless. But volume is the integral of area with respect
      to level. The area is the integrand, the thing being added up. Get it wrong by a few per
      cent, and every total this control room has worked out for a fortnight is wrong the same
      way. Today you rebuild a volume from the corrected areas. Then you find how far that
      correction travels.
    takeaway: An integral inherits every error in its integrand, and the only quantities it spares are the ones that never went through it.
    stops:
      - group: STORE
        task: Rebuild the volume from the corrected areas
        title: A volume out of a stack of areas
        place: Storage & Level Board
        scene: >
          Rasmussen has the resurveyed surface areas at 3 levels 2 metres apart — 2.30, 2.45
          and 2.60 square kilometres. Ferrand wants the volume held between the lowest and the
          highest of them.
        guide: >-
          The numbers on offer are two ways of adding the three areas, a spacing and a
          conversion. Only one of the sums treats the two end areas the way the rule
          requires. Areas stack up through levels exactly as flows stack up through
          time, so the same weighting applies. The areas are the integrand here. An
          eleven per cent error in them is eleven per cent of headroom the control room
          thought it had.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. Two things are being tested. Can you pick the quantities the relationship actually needs? And does the
              size of the answer look right once they are in place?
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch is caught before it is placed. It is also how a quantity
              belonging to a different part of the problem is caught. That is the habit this format
              exists to build.
        takesAsRead:
          - The definite integral as an accumulation, and its units
        assumes:
          - the volume between two levels is the integral of the surface area with respect to level
          - the trapezoid rule adds half of each end value to all the interior ones
        takeaway: A volume is an accumulation of areas up through the levels, so the area curve is the integrand and its errors are inherited whole.
        format: BALLPARK
        question: Estimate the volume held between 210 and 214 metres on the resurveyed curve.
        why: >
          Volume is the integral of the surface area with respect to level, which is what a stage-storage
          curve is a table of. Stacking the areas with the trapezoid rule is the same arithmetic as stacking
          flows in time, with height in place of time. That is why the resurvey matters so much. The areas are
          the integrand. The 2003 sheet gives 2.58, 2.75 and 2.92 for the same 3 levels. It returns 11.0
          million for this slice. That is 11% of headroom the control room believed it had.
        estimate:
          prompt: >
            Resurveyed areas 2.30, 2.45 and 2.60 square kilometres, at levels 2 metres apart. Half
            of each end plus the interior gives 1.15 + 2.45 + 1.30 = 4.90 square kilometres. A square
            kilometre is 1 million square metres.
          question: Choose the trapezoid sum of the areas, the spacing and the conversion.
          labels:
            - 4.90  (half of each end plus the interior area, square kilometres)
            - 2  (metres between surveyed levels)
            - 1000000  (square metres in a square kilometre)
            - 7.35  (all 3 areas added without halving the ends)
            - 4  (metres of level covered in total)
          values: [4.90, 2, 1000000, 7.35, 4]
          slots: 3
          template: '{0} × {1} × {2}'
          formula: a*b*c
          correct: [0, 1, 2]
          target: 9800000
          tolerance: 700000
          units: cubic metres
          solution: 4.90 × 2 × 1,000,000 = 9.8 million cubic metres.
          explanation: >
            About 9.8 million cubic metres in that four-metre slice. Adding all 3 areas without
            halving the ends gives 14.7 million, which counts the top and bottom surfaces as though
            each had 2 metres of water above and below it.
          givens:
            - Areas 2.30, 2.45, 2.60 km² at 210, 212 and 214 m
            - Two metres between surveyed levels
          relationship: >
            V = ∫A(h)dh between the two levels, evaluated by the trapezoid rule — half of each end
            area plus every interior one, times the spacing.
        answerText: About 9.8 million cubic metres between 210 and 214 metres.
      - group: GATES
        task: Decide which measurement is worth buying
        title: The exponent is not the whole story
        place: Gate Chamber
        scene: >
          The spillway rating is quoted to three figures and Wilkes cannot defend it. The head is
          gauged, the crest length is surveyed, the coefficient came out of a handbook, and there is
          one calibration slot in the week.
        guide: >-
          The panel shows an error budget: each input's own width, times the power it is
          raised to in the rating, contributes a bar. One calibration slot is affordable
          this week, so read the bars rather than the inputs and buy the measurement
          that shrinks the tallest one. A term with a big exponent and a small width may
          be contributing less than a modest term measured badly.
        background:
          - >-
              How the widths combine. In a product of powers, the fractional uncertainties add in quadrature, each
              multiplied by its exponent. Head enters at the power of three halves, so its fractional width counts
              one and a half times over. Crest length enters linearly. The coefficient enters linearly too. The
              exponent is a multiplier on the width, not a substitute for it.
          - >-
              Why the exponent alone misleads. Head has the largest exponent and is gauged
              continuously, so its width may be small. The handbook coefficient has an
              exponent of one and a width nobody has ever measured on this structure. Which
              dominates is an arithmetic question, and it is exactly the question the bars
              answer.
          - >-
              Why three figures was indefensible. A discharge quoted to three significant
              figures claims a fractional uncertainty under a per cent, and no combination
              of these inputs supports that. Finding which term is carrying the width is the
              first step to either measuring it or quoting fewer figures.
        assumes:
          - a fractional uncertainty is carried into a product weighted by the power each term is raised to
          - a measured quantity and a handbook quantity are different kinds of number
        takeaway: A term contributes its own fractional width times its exponent. So a badly known factor with no power over it can outweigh a well-known one raised to three halves.
        format: PROPAGATE
        question: >-
          One calibration is affordable this week. Which of these is carrying the uncertainty in the
          discharge?
        propagate:
          hint: >-
            Each term contributes its own width times the power it is raised to. The bar is that
            contribution.
          output: { label: Spillway discharge, unit: m³/s }
          costUnit: d
          budget: 2
          inputs:
            - { id: coeff, label: Discharge coefficient C, value: 2.1, unit: '', sigmaFrac: 0.15, exponent: 1 }
            - { id: crest, label: Crest length L, value: 10.0, unit: m, sigmaFrac: 0.01, exponent: 1 }
            - { id: head, label: Head over the sill H, value: 2.0, unit: m, sigmaFrac: 0.04, exponent: 1.5 }
          improvable:
            - { id: coeff, label: A gauged release calibrated against the river, cost: 2, newSigmaFrac: 0.04 }
            - { id: head, label: A second head gauge on the far pier, cost: 1, newSigmaFrac: 0.015 }
            - { id: crest, label: Resurvey the crest, cost: 1 }
          dominant: coeff
          commit: Report the range
        answerText: >-
          The coefficient. It sits at the first power and is known to 15%, which beats a
          head at the three-halves power known to 4 — so the gauged calibration is the slot worth
          spending, and the discharge is a range rather than a figure.
        why: >
          A factor contributes its exponent multiplied by its own fractional width. The head carries the
          three-halves that the whole spillway is famous for. It is gauged well enough that 1 and a half times
          4% is still small beside 1 times 15. Buying another head gauge therefore improves the term that was
          already good and barely moves the total. What makes this worth catching is that the shortcut — rank
          by exponent — is reasonable, teachable, and gives exactly the wrong answer here. The coefficient
          stays wide because nobody has ever calibrated this crest against a measured river.
      - group: STRUCT
        task: Say which predictions the resurvey reaches
        title: What the correction does not touch
        place: Seepage & Uplift Bay
        scene: >
          The resurvey has moved every volume in the control room. Zawadzka is asked whether her
          uplift predictions move with them, and she has the foundation relation on the board beside
          the level gauge.
        guide: >-
          The options differ in how far the correction travels: everything, one path,
          one measurement, or nothing. The test is not importance but dependency. Ask of
          each result whether the corrected quantity appears anywhere in the calculation
          that produced it. A correction made by feel either spreads to numbers it never
          touched, or stops before it reaches one it did.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be the answer under
              one specific misreading. A step skipped. A quantity confused with a rate. A correlation taken for a
              cause. Identifying which misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance. That was 88 per
              cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason is
              indistinguishable from a sound one. That stays true until the day the approximation is
              what is being tested.
        assumes:
          - a correction propagates only to quantities computed through the thing corrected
          - the level is measured directly against a datum rather than derived from a volume
        takeaway: A correction travels along the path the calculation took, so a quantity that never used the corrected term is untouched by it.
        format: CHOICE
        question: Which of these has to be recomputed after the resurvey?
        choices:
          - Every volume and every level forecast built from one
          - Every quantity on the site, since the curve underlies all of them
          - Only the uplift, because it is the deepest measurement
          - Nothing, because the level gauge itself has not changed
        answer: Every volume and every level forecast built from one
        why: >
          The corrected quantity is the surface area. It enters exactly two calculations. The volume
          integrates it. The level forecast divides a net flow by it. Those move. The uplift relation takes
          the level as its input. The level is read against a datum on the wall rather than computed from a
          volume. So nothing in the gallery changes. The reservoir is at the same height it was yesterday and
          pushes with the same pressure. Tracing which results used the corrected term is the whole of the
          recovery. Doing it by feel is how a correction either spreads too far or stops too early.
        rebuttals:
          - The uplift and the seepage take the level directly and never pass through the area curve.
          - Uplift is measured, not derived from the curve; depth has nothing to do with what a correction reaches.
          - The gauge is unchanged, which is exactly why the level is safe and the volumes are not.
  # ---------------------------------------------------------------- day 11
  # Unit 4 — the tangent line as a predictor, the differential as its arithmetic,
  # and an indeterminate limit that needs L'Hôpital.
  - title: A day when nothing happens
    objective: Predict with a tangent line and then measure it, and evaluate a limit that arithmetic cannot reach.
    briefing: A quiet day, which is the only kind on which a prediction can be checked against a measurement.
    stake: >-
      Thursday. For the first time in a fortnight, nothing has to be decided before lunch. Anand
      wants to raise the machines. From the rate alone she can say what that should buy her.
      That is a prediction, so it is a thing that can be wrong. Zawadzka has a routing
      expression that goes to zero over zero the instant a release starts. Zero over zero is not
      a small number. It is no number at all until it is handled properly. Ekundayo has a rating
      curve and a head rise of six centimetres. Today you predict with a tangent line, then
      measure what really happened. You also work one limit that no amount of substitution will
      reach.
    takeaway: A derivative predicts nearby values, its own arithmetic is a multiplication, and a limit that comes out as zero over zero has to be worked rather than read.
    stops:
      - group: POWER
        task: Predict what the extra flow buys, then find out
        title: What the tangent line promised
        place: Powerhouse
        scene: >
          Anand is at 46 cubic metres a second through the machines and proposes 52. The slope of the
          output curve at 46 is 197 kilowatts for every extra cubic metre a second, and the tailrace
          traverse takes 2 hours of deck time.
        guide: >-
          Lock a prediction for the gain before anything is changed: the panel will not
          let you look first, and nothing about the prediction can be edited afterwards.
          Then raise the flow, and then spend the two hours of deck time on the traverse
          that measures what actually happened. Not measuring is an answer too, and a
          poor one.
        background:
          - >-
              Where the prediction comes from. The slope of the output curve at 46 cubic metres a second is 197
              kilowatts per extra cubic metre a second. Multiplying that by the six-unit change is a tangent-line
              estimate, a linear approximation of a curve. It will be an overestimate or an underestimate,
              depending on which way the curve bends.
          - >-
              Why the tangent line is a promise with a range. A derivative is exact only at the point where it was
              taken. Six cubic metres a second is a long way along a curve that is bending. So the honest
              prediction carries a caveat about direction. The measurement is what tells you the size of the
              error.
          - >-
              Why the traverse costs and why that is the point. Two hours of deck time is
              real, and skipping it leaves a prediction standing as though it were a result.
              The format spends that cost deliberately: a prediction that is never checked
              cannot be wrong, which is precisely what makes it worthless.
        assumes:
          - the tangent line at a point predicts nearby values of the quantity
          - a curve that bends away from its tangent makes that prediction worse the further it is carried
        takeaway: A tangent-line prediction is only checked by measuring, and its error is the curvature it ignored.
        format: VERIFY
        question: >-
          Predict the gain from raising the flow, make the change, and report what it actually did.
        verify:
          hint: >-
            Lock the prediction before the flow is raised. Nothing about it can be changed afterwards,
            which is the point of making it first.
          prediction: { label: Predicted gain in output, unit: kW, min: 200, max: 2000, step: 25 }
          truth: 919
          passRatio: [0.75, 1.35]
          intervention:
            label: Raise the flow from 46 to 52 cubic metres a second
            note: Both units, wicket gates opened together over four minutes.
            outcome: Flow confirmed at 52.1 cubic metres a second, steady, head unchanged upstream.
          measurement:
            label: Gauged output at the switch room
            note: Metered against the station transformer, two hours of deck time.
            cost: 2
            costUnit: h
          unmeasuredMoral: >-
            The flow was raised, the machines are noisier, and nobody metered the output. Nothing in
            that sequence establishes what the change was worth.
          commit: Report the gain
        answerText: >-
          About 919 kilowatts. The tangent line at 46 promises 1,182 — 6 times 197 — and the curve
          bends away from it, so the honest figure is a quarter lower than the prediction.
        why: >
          A tangent line is the best straight-line description of a curve at one point. Over a
          small step it is excellent. Six cubic metres a second is not a small step here. The
          output curve is bending towards its own maximum, so every extra cubic metre buys less
          than the one before it. The straight line therefore runs above the truth for the whole
          interval. The error is not noise and does not average out. It is the second
          derivative, and it points the same way every time.
      - group: STRUCT
        task: Evaluate a limit that comes out as zero over zero
        title: Nothing over nothing
        place: Seepage & Uplift Bay
        scene: >
          Zawadzka has the arriving fraction of a step release written as 1 − e^(−t/T), with T 4
          hours. The initial rate of arrival is that fraction divided by t, and at t = 0 both parts
          are 0.
        guide: >-
          Build it a line at a time. Putting t = 0 into the expression gives nothing over nothing. So the
          value has to be got at as a limit rather than by substitution. Finish by saying what makes the
          method legitimate — the last step of this stop is naming the condition, not producing the number.
        background:
          - >-
              What zero over zero means. It is not a value and it is not an error. It is a statement about the
              expression's value. That value depends on how the numerator and denominator approach zero relative
              to each other. Both go to zero here, and the ratio they approach is the thing being asked for.
          - >-
              Two legitimate routes. L'Hôpital's rule applies because both parts are
              differentiable and both tend to zero — differentiate top and bottom separately
              and take the limit again. Or expand the exponential as a series: 1 − e^(−t/T)
              is t/T minus smaller terms, so dividing by t leaves 1/T plus terms that
              vanish. Both give the same number and the series shows why.
          - >-
              Why naming the condition is the point. L'Hôpital's rule used without checking
              the indeterminate form is the most common way a correct-looking calculus
              answer turns out to be nonsense. A student who states the condition has the
              tool; one who applies it reflexively has a habit.
        takesAsRead:
          - Limits, one-sided limits, and where a limit fails to exist
        assumes:
          - a quotient whose numerator and denominator both go to zero has no value until it is worked
          - the derivative of e^(−t/T) with respect to t is −(1/T)·e^(−t/T)
        takeaway: A limit in the form zero over zero is not zero and not one. Differentiating the top and the bottom separately is what gets a value out of it.
        format: DERIVE
        question: >-
          Evaluate the initial rate of arrival, and say what makes the method legitimate.
        derive:
          hint: >-
            Check the form first. What you are allowed to do next depends on what form it is in.
          start: 'the limit as t goes to 0 of (1 − e^(−t/T)) ÷ t'
          startNote: 'the arriving fraction of a step release, with T = 4 hours'
          goal: 'a number for the initial rate of arrival'
          steps:
            - ask: Name the form of the limit before doing anything to it.
              answer: 1
              candidates:
                - text: 'the numerator goes to 0 and the denominator to 0, so the limit is 0'
                  rule: substitution
                  why: >-
                    A quotient of two things going to zero can approach any value at all, including
                    infinity. Reading it as zero assumes the numerator wins, which is the thing being
                    asked.
                - text: 'the numerator goes to 0 and the denominator to 0, so the form is indeterminate'
                  rule: indeterminate form
                - text: 'the numerator goes to 1 and the denominator to 0, so the limit is infinite'
                  rule: substitution
                  survives: true
                  why: >-
                    e^(−t/T) goes to 1 at t = 0, so the numerator is 1 − 1 and goes to 0, not to
                    1. The reading is a term out and produces a confident, wrong, infinite answer
                    that nothing later contradicts.
                - text: 'the numerator goes to 0 and the denominator to 0, so the limit is 1'
                  rule: substitution
                  why: >-
                    Zero over zero is not one. That is the value for a quotient of two identical
                    quantities, which these are not.
            - ask: Differentiate the numerator and the denominator separately.
              answer: 0
              candidates:
                - text: 'the limit of ((1/T)·e^(−t/T)) ÷ 1'
                  rule: differentiation
                - text: 'the limit of (−(1/T)·e^(−t/T)) ÷ 1'
                  rule: differentiation
                  survives: true
                  why: >-
                    The 1 differentiates to nothing and the minus sign in front of the exponential
                    cancels the minus that the chain rule brings down. Two negatives make the rate
                    positive, and this line reports water leaving instead of arriving.
                - text: 'the derivative of the whole quotient, by the quotient rule'
                  rule: quotient
                  why: >-
                    The rule differentiates the top and the bottom separately, and does not
                    differentiate the quotient. What the quotient rule produces here is a correct
                    derivative of an expression nobody asked about.
                - text: 'the limit of (1 − e^(−t/T)) ÷ 1, since the t differentiates to 1'
                  rule: differentiation
                  why: >-
                    Only the denominator has been differentiated. Applying the rule to one half of
                    the quotient leaves the original zero on top.
            - ask: Evaluate the new limit.
              answer: 0
              candidates:
                - text: '1/T = 0.25 per hour'
                  rule: evaluation
                - text: 'T = 4 per hour'
                  rule: evaluation
                  survives: true
                  why: >-
                    The rate is the reciprocal of the time constant. Reported as 4 the arrival is
                    16 times too fast, in units that read perfectly well on a warning sheet.
                - text: '0, since the exponential still goes to 0 at t = 0'
                  rule: evaluation
                  why: >-
                    e^(−t/T) goes to 1 at t = 0, not to 0. It is e raised to nothing.
          commit: Report the rate
        answerText: >-
          A quarter per hour. The limit is 1/T, so a four-hour reach begins taking a step release at
          25% an hour, however little has arrived at the first instant.
        why: >
          Zero over zero is a statement that substitution has failed, not a value.
          Differentiating the top and the bottom separately replaces both by the rates at which
          they are vanishing. The quotient settles on the ratio of those rates, which is why the
          answer depends on T at all. The result matters for the warning sheet. The arriving
          fraction is nearly nothing at the first instant. The rate at which it starts arriving
          is a definite quarter per hour that no reading at the start could ever show.
      - group: INFLOW
        task: Turn a slope into a small change
        title: Six centimetres, in cubic metres
        place: Catchment & Inflow Desk
        scene: >-
          Ekundayo has the rating slope at 44.5 cubic metres a second for every metre of
          head. The gauge shows the head 6 centimetres higher than it was at the morning
          call.
        guide: >-
          Five numbers, and two of them are the same rise written in different units.
          One is a slope, one is a head rather than a change in head, and one is a
          constant from the rating equation. A slope multiplied by a step only works if
          the step is in the units the slope was quoted in. Centimetres put into a
          per-metre slope give an answer a hundred times too large. It still looks like
          a discharge.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. Two things are being tested. Can you pick the quantities the relationship actually needs? And does the
              size of the answer look right once they are in place?
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch is caught before it is placed. It is also how a quantity
              belonging to a different part of the problem is caught. That is the habit this format
              exists to build.
        assumes:
          - a small change in a quantity is its rate of change multiplied by the small change in the input
          - 6 centimetres is 0.06 metres
        takeaway: A differential is the tangent line's arithmetic — a slope times a step — and it is what turns a gauge reading into the quantity somebody cares about.
        format: BALLPARK
        question: Estimate the change in spillway discharge from a six-centimetre rise in head.
        why: >
          A differential is the simplest use a derivative has. Multiply the slope by the step
          and read off the change. It is exact only in the limit. Over six centimetres on a
          curve this gentle the error is under 1%, well inside what the gauge can
          resolve. The reason to write it as a slope times a step is that the slope is a number
          worth carrying. It says a centimetre is worth almost half a cubic metre a second
          today, and seven-tenths of one at three metres.
        estimate:
          prompt: >
            The rating slope at this head is 44.5 cubic metres a second per metre. The head has risen
            6 centimetres, which is 0.06 metres.
          question: Choose the slope and the change in head.
          labels:
            - 44.5  (rating slope, cubic metres a second per metre)
            - 0.06  (change in head, metres)
            - 6  (change in head, centimetres)
            - 2.06  (the new head, metres)
            - 21.0  (the rating constant C times L)
          values: [44.5, 0.06, 6, 2.06, 21.0]
          slots: 2
          template: '{0} × {1}'
          formula: a*b
          correct: [0, 1]
          target: 2.67
          tolerance: 0.3
          units: cubic metres a second
          solution: 44.5 × 0.06 ≈ 2.7 cubic metres a second.
          explanation: >
            About 2.7 cubic metres a second more over the spillway. Using the 6 rather than the
            0.06 gives 267, which is most of a flood and would be believed for the length of 1
            phone call, because nothing about the arithmetic looks wrong.
          givens:
            - Rating slope 44.5 m³/s per metre at this head
            - Head up six centimetres since the morning call
          relationship: >
            dQ ≈ (dQ/dH) × dH — the slope multiplied by the step, which is the tangent line used
            over a short interval.
        answerText: About 2.7 cubic metres a second more over the spillway.

  # ---------------------------------------------------------------- day 12
  # Unit 7 — exponential decay as the solution of dQ/dt = −kQ, and what happens
  # when the constant is fitted on the same data it is scored against.
  - title: The front that never came
    objective: Solve the recession equation, fit its constant honestly, and turn it into a time.
    briefing: The rain stopped on Wednesday and the river is falling on a curve with one number in it.
    stake: >-
      Friday. The front that justified Monday's pre-release never arrived. The reservoir is
      short going into summer. Halloran has been polite about it in a way that is worse than not
      being. What is left is the recession. That is the river falling away with no rain behind
      it. One constant describes the whole fall. Ferrand has to solve the equation for it.
      Ekundayo has to fit that constant on days that have already happened. Then he has to live
      with it on days that have not, which is the harder half. Anand needs the answer as an
      hour, not as a curve. Today you solve the recession and turn its constant into a date.
    takeaway: A rate proportional to the quantity itself decays exponentially, and a constant fitted on one stretch of data is only honest when it is scored on another.
    stops:
      - group: STORE
        task: Solve the recession equation
        title: The river falling away
        place: Storage & Level Board
        scene: >
          Ferrand has the recession as dQ/dt = −k·Q, with the flow falling in proportion to itself
          now that no rain is behind it. He wants the flow as a function of time before the weekend
          schedule is written.
        guide: >-
          Build it a line at a time. The flow is falling in proportion to itself. That is the equation whose
          solution is an exponential. Separating the variables is what shows that rather than asserting it.
          Finish with the flow as a function of time, in a form the weekend schedule can be written from.
        background:
          - >-
              What 'in proportion to itself' means. With no rain behind it, the river is
              draining stored water, and the more there is the faster it leaves. dQ/dt = −kQ
              says exactly that, and it is the same equation as radioactive decay, cooling
              coffee and a discharging capacitor. Recognising the form is most of the work.
          - >-
              Why the constant is a rate and not a time. k has units of one over time, so
              1/k is the time the flow takes to fall to about a third of its value. Quoting
              the recession constant and quoting that characteristic time are two ways of
              saying one thing, and the second is the one an operator can feel.
          - >-
              What the schedule needs from it. Committing to a release for Saturday means predicting Saturday's
              natural flow. An exponential fitted now gives that with one number. The same function says how wrong
              you will be if the recession constant is off. That is the honest part of the promise.
        assumes:
          - a differential equation with the variables separable can be integrated a side at a time
          - the antiderivative of one over a quantity is the natural logarithm of it
        takeaway: A rate proportional to the quantity itself integrates to a logarithm, and exponentiating both sides turns that into decay.
        format: DERIVE
        question: >-
          Solve the recession equation for the flow as a function of time.
        derive:
          hint: >-
            Separate, integrate, then undo the logarithm. Name the move each line makes.
          start: 'dQ/dt = −k·Q'
          startNote: 'Q in cubic metres a second, k the recession constant, per day'
          goal: 'Q as a function of t'
          steps:
            - ask: Separate the variables and integrate both sides.
              answer: 2
              candidates:
                - text: 'Q^(−1)·dQ = −k·dt, giving Q^0 ÷ 0 = −k·t + C'
                  rule: power
                  why: >-
                    The power rule fails at an exponent of −1, because raising it by 1 gives 0
                    and the division is by nothing. That single exception is why the logarithm exists.
                - text: 'dQ = −k·Q·dt, integrating to Q = −k·Q·t + C'
                  rule: separation
                  why: >-
                    Nothing has been separated, so the right-hand side cannot be integrated with
                    respect to t while Q is still sitting in it and moving.
                - text: 'Q^(−1)·dQ = −k·dt, giving ln(Q) = −k·t + C'
                  rule: antiderivative
                - text: 'Q^(−1)·dQ = −k·dt, giving ln(Q) = −k·t² ÷ 2 + C'
                  rule: antiderivative
                  survives: true
                  why: >-
                    The right-hand side is a constant with respect to t, so it integrates to −kt and
                    not to a square. The line is well formed and describes a recession that collapses
                    far too fast late on, which is exactly where nobody is checking it.
            - ask: Undo the logarithm and apply the flow at the start.
              answer: 0
              candidates:
                - text: 'Q(t) = Q₀·e^(−k·t)'
                  rule: exponentiation
                - text: 'Q(t) = Q₀ − e^(−k·t)'
                  rule: exponentiation
                  why: >-
                    Exponentiating a sum gives a product, not a difference. This one goes negative
                    the moment Q₀ is small, which no river does.
                - text: 'Q(t) = e^(−k·t) + C'
                  rule: initial condition
                  survives: true
                  why: >-
                    The constant of integration was inside the logarithm, so exponentiating turns it
                    into a multiplying factor rather than an added one. The curve still falls and
                    still fits the first day, and it approaches C instead of zero.
                - text: 'Q(t) = Q₀·e^(k·t)'
                  rule: exponentiation
                  why: >-
                    The minus sign is the whole content of a recession. Without it the river grows
                    without bound in dry weather.
          commit: Report the solution
        answerText: >-
          Q(t) = Q₀·e^(−kt) — the flow falling by the same fraction in every equal interval, never
          quite reaching zero, which is why a recession is quoted as a constant rather than an end.
        why: >
          Separating gives one over Q against a constant. The antiderivative of one over a
          quantity is the only case the power rule cannot do. Raising the exponent by one gives
          zero and the division fails, which is precisely the gap the logarithm fills.
          Exponentiating both sides then turns the constant from something added into something
          multiplied. That factor is the flow at the start. What comes out is the one curve on
          this site with no end to it, so operations quote k rather than a date.
      - group: INFLOW
        task: Fit the constant on days you can check
        title: The constant that fitted too well
        place: Catchment & Inflow Desk
        scene: >-
          A recession constant says how fast a river falls away once the rain has
          stopped. Ekundayo has a week of recession to fit one on, and four later days
          held back that the fit has never seen. The score is how well a constant
          reproduces the days it is scored against, so higher is better. Halloran wants
          the number that will be used next week.
        guide: >-
          Drag the constant and watch how well it fits the week. Two things to hold on to. Each score comes
          from a handful of days. So a small difference between two constants is that week's weather rather
          than the river. And you are keeping the best of many constants. That is a contest luck can win. Then
          press freeze. Freezing commits you and opens the four held-back days. Report what those say.
        background:
          - >-
              What the constant describes. After the rain stops, a catchment drains what it has stored, and the
              flow falls away by roughly the same fraction each day. That fraction is the recession constant. It
              is a property of the soil, the geology and the shape of the valley. So it should be much the same
              next week as it was last week.
          - >-
              Why fitting a week fits the week. The fit sees one week of weather, and that week had its own
              showers, its own evaporation and its own gauge noise. A constant tuned to the last digit is tuned to
              those as well as to the catchment. The parts that came from the weather will not happen again.
          - >-
              What the freeze is for, and what would break without it. Held-back days can
              only test a constant that was chosen without them. If you could keep adjusting
              after seeing them, you would be fitting to those four days too, and there
              would be nothing left to test the choice on. That is the whole of the
              procedure: keep some data back, commit, then look.
        takesAsRead:
          - The definite integral as an accumulation, and its units
        assumes:
          - a constant chosen to fit a sample is chosen partly on that sample's noise
          - noise does not repeat, and a real feature of the river does
        takeaway: A score measured where the constant was chosen is a score of the constant plus the sample, and it is biased high every time.
        format: HOLDOUT
        question: >-
          Choose the recession constant yourself, freeze it, and score it on days it has never seen.
        holdout:
          axis:
            label: Recession constant
            unit: per day
            min: 0.05
            max: 0.60
            step: 0.01
          unit: "%"
          fitLabel: The week it was fitted on
          testLabel: Four days it has never seen
          pass: 92
          fit:
            - { at: 0.05, value: 70.0 }
            - { at: 0.10, value: 82.0 }
            - { at: 0.15, value: 88.0 }
            - { at: 0.20, value: 91.5 }
            - { at: 0.22, value: 92.0 }
            - { at: 0.25, value: 91.8 }
            - { at: 0.30, value: 90.5 }
            - { at: 0.34, value: 95.8 }
            - { at: 0.38, value: 89.5 }
            - { at: 0.45, value: 85.0 }
            - { at: 0.60, value: 74.0 }
          test:
            - { at: 0.05, value: 68.0 }
            - { at: 0.10, value: 80.0 }
            - { at: 0.15, value: 87.0 }
            - { at: 0.20, value: 93.2 }
            - { at: 0.22, value: 94.1 }
            - { at: 0.25, value: 93.4 }
            - { at: 0.30, value: 91.0 }
            - { at: 0.34, value: 88.4 }
            - { at: 0.38, value: 86.0 }
            - { at: 0.45, value: 81.0 }
            - { at: 0.60, value: 70.0 }
          commit: Freeze the constant
        answerText: >-
          About 0.22 a day, scoring 94 on days it has never seen. The 0.34 that scores best on the
          fitted week manages 88 on them, and the 3 points it appeared to gain were a property of
          that week rather than of this river.
        why: >
          A constant chosen on a sample is chosen partly on that sample's noise, and noise does not come back.
          That is why the broad shoulder holds up and the narrow spike does not. The shoulder is a property of
          how this catchment drains, which next week also has. The spike is a property of seven particular
          days, which it does not. So a score measured where the constant was chosen is never a measurement of
          the constant alone, and it is wrong in the same direction every time. The cure is procedure rather
          than cleverness.
      - group: POWER
        task: Turn the constant into an hour
        title: How long until it halves
        place: Powerhouse
        scene: >
          Anand has the recession constant at 0.22 a day and a maintenance window she can only take
          once the flow is below half of what it is now. She wants a date, not a curve.
        guide: >-
          Five numbers and only two of them survive the rearrangement. The others are
          the factor the flow falls by, the fraction left, and the reciprocal of the
          constant. All are true; none is what the solved form asks for. Take the
          logarithm on paper first and see which quantities are left standing. The
          starting flow cancels, which is why the answer says the same thing about a big
          river and a small one.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. Two things are being tested. Can you pick the quantities the relationship actually needs? And does the
              size of the answer look right once they are in place?
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch is caught before it is placed. It is also how a quantity
              belonging to a different part of the problem is caught. That is the habit this format
              exists to build.
        assumes:
          - the recession solution can be rearranged for the time at a given fraction of the start
          - the natural logarithm of 2 is about 0.693
        takeaway: Rearranging an exponential solution for time replaces the curve with a single number that does not depend on where you started.
        format: BALLPARK
        question: Estimate how long the recession takes to halve the flow.
        why: >
          Setting Q equal to half of Q₀ and taking logarithms cancels the starting flow entirely, so the
          halving time depends on the constant alone. That independence is the whole reason a recession is
          quoted as a constant. It says the same thing about a river at 400 cubic metres a second and at 40.
          No absolute rate of fall does that. It also gives the shape of the wait. The next halving takes
          exactly as long as this one. So the machines wait three days for the first and three more for the
          second.
        estimate:
          prompt: >
            Setting Q to half of Q₀ in Q₀·e^(−kt) gives t = ln(2) ÷ k. The natural logarithm of 2
            is about 0.693 and the recession constant is 0.22 a day.
          question: Choose the logarithm of two and the recession constant.
          labels:
            - 0.693  (the natural logarithm of 2)
            - 0.22  (the recession constant, per day)
            - 2  (the factor the flow is falling by)
            - 0.5  (the fraction of the flow that is left)
            - 4.55  (1 divided by the recession constant)
          values: [0.693, 0.22, 2, 0.5, 4.55]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 3.15
          tolerance: 0.35
          units: days
          solution: 0.693 ÷ 0.22 ≈ 3.2 days.
          explanation: >
            About three days and four hours. Using the 2 instead of its logarithm gives 9 days and
            a window booked for the wrong week — and the mistake is invisible, because 9 days is
            also a perfectly plausible answer for a river.
          givens:
            - Recession constant 0.22 a day
            - The window opens once the flow is half of today's
          relationship: >
            t = ln(2) ÷ k, from setting Q(t) equal to half of Q₀ — the starting flow cancels, so the
            halving time depends only on the constant.
        answerText: About 3.2 days until the flow has halved.

  # ---------------------------------------------------------------- day 13
  # Unit 8 — the integral of a difference, what an area between curves is and is
  # not, and a substitution that makes an ugly integrand ordinary.
      - group: GATES
        task: Work the inspection round while the priority changes.
        title: What the round is looking at now
        concept: "Extreme values on a closed interval, including at the endpoints"
        place: Gate Gallery
        scene: The gate gallery inspection has more to look at than one round covers. The duty engineer sets the priority. It changes as the day does — after the level rises, after the trash rack blocks, after the outage window is confirmed.
        guide: >-
          Inspect what the current priority wants and leave the rest for the next round. The
          priority in the gallery log changes during the day and nobody announces it. What is
          scored is the items either side of a change, because they are the only ones that
          show whether the round is reading the log.
        background:
          - >-
              Why the priority changes. On a normal day the round is about wear, because wear is what a scheduled
              inspection is for. When the level rises it is about anything that has to move under load. When an
              outage is confirmed it is about anything that can only be looked at with the water off. That is a
              list that is unavailable most of the year.
          - >-
              Why the changeover costs more here than most places. An outage window is measured in
              hours and comes round twice a year. An item not looked at during one is not looked at
              for six months, and nothing in the log says it was displaced rather than checked.
        assumes:
          - some things can only be inspected when the plant is shut down
        takeaway: The cost of a withdrawn instruction is highest where the opportunity does not come round again soon.
        format: SPOT
        question: Inspect to the priority in the log, and keep watching the log.
        answerText: Read the log rather than the round sheet. Every change leaves a few minutes in which the old priority still looks like today's.
        why: >-
          Three priorities run across the day and each wants a different part of the gallery. Anything showing
          wear, then anything that has to move under load, then anything that can only be reached with the
          water off. An item can answer two at once, which is what makes the change cost real. The panel
          scores the window either side of each change. Most of the gallery is wanted by neither priority. It
          is correctly left for next month by somebody who has read nothing. And this is the case where the
          cost is largest. An outage window is a few hours twice a year. An item skipped during one is
          unavailable until the next. The round sheet records only that the round was completed.
        spot:
          duration: 40
          switchEvery: 12
          pass: 0.75
          hint: The priority is in the gallery log, and the duty engineer changes it without an announcement.
          targets:
            - id: g1
              label: Worn hoist chain
              tags: [wear]
            - id: g2
              label: Gate seal, under load
              tags: [load]
            - id: g3
              label: Downstream seal, dry only
              tags: [dryonly]
            - id: g4
              label: Worn seal, dry only
              tags: [wear, dryonly]

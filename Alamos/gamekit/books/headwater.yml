      - group: STORE
        task: Hold the reservoir while the inflow changes.
        title: The level, through a wet afternoon
        concept: "The definite integral as an accumulation, and its units"
        place: Control Room
        scene: The reservoir has to sit at its operating level while the catchment delivers whatever the afternoon brings. The gates are the only outflow anybody controls, and the inflow is decided a long way upstream.
        guide: >-
          Hold the level inside the band on the panel. The band narrows as the afternoon goes
          on, because the freeboard above the spillway is what the whole scheme is protected
          by and it does not grow. The gate opening is your control, and every change in
          inflow keeps arriving until the outflow matches it.
        background:
          - >-
              Why the level is an accumulation. The rate of change of storage is inflow minus outflow, so the
              level is the integral of that difference. A gate opening that does not match the inflow does not
              move the level to a new place. It changes how fast it is moving. That is the whole difficulty.
          - >-
              Why the inflow will not sit still. Rain upstream arrives as a wave hours later, a
              tributary joins after the second band of weather, and the catchment goes on delivering
              after the rain has stopped. None of it is a step, and none of it is negotiable.
          - >-
              Why the margin shrinks. Freeboard is fixed. The longer the afternoon has run, the more of it has
              already been spent. So the same rate of rise is a larger share of what is left at four than at one.
        assumes:
          - water stored is what has come in minus what has gone out
        takeaway: A level is the accumulation of a difference, so it is held by matching rates rather than by chasing a number.
        format: HOLD
        question: Hold the reservoir at its operating level through the afternoon.
        answerText: Inside the band for most of the afternoon, with the gate set so outflow matches inflow rather than opened after the level has already risen.
        why: >-
          The rate of change of storage is inflow minus outflow. So the level is the accumulation of that
          difference. That is why holding it feels unlike holding anything with a setpoint. A gate opening
          does not put the level somewhere; it decides how fast the level is moving. Match the inflow and the
          level stops wherever it happens to be. Fall short and it rises at the difference for as long as the
          mismatch lasts. That is the same integral the whole course keeps returning to, drawn in real time on
          a gauge. The disturbances are the catchment doing what catchments do. A rain wave arrives hours
          after the rain. A tributary joins late. The ground goes on delivering once the sky has cleared. And
          the band narrows because freeboard is fixed and finite. The margin above the spillway is what the
          scheme is protected by, and none of it comes back during the afternoon.
        hold:
          quantity: Reservoir level
          unit: m
          control: Gate opening
          hold: 0
          band: 0.4
          narrowTo: 0.2
          duration: 45
          direction: lower
          authority: 0.1
          pass: 0.8
          hint: The gate sets a rate, not a level. Match the inflow rather than chasing the gauge.
          disturbances:
            - { label: Rain wave arrives from upstream, at: 4, amount: 0.03 }
            - { label: Second band passes and inflow eases, at: 20, amount: -0.05 }
            - { label: Tributary joins the flood peak, at: 38, amount: 0.045 }
          commit: Report the afternoon
  - title: Has it peaked?
    objective: Find the inflection in a rising record, and say which quantity peaks when.
    briefing: The gauge is still climbing, and the question on the call is whether it is climbing as hard as it was.
    stake: >-
      Saturday. The first good news of the fortnight is on Ekundayo's screen. The inflow is
      still rising. The hourly steps up are not getting bigger any more. Nobody will take that
      as a hunch. A rate that has peaked and a rate that is merely easing off make for two very
      different afternoons. Ferrand has the level fitted to a curve that turns over on a day you
      can name. Baptiste has to warn the reach, and she has to say which peak she means. The two
      peaks do not fall on the same day. Today you find the point where a climb turns over. Then
      you say which quantity peaks when.
    takeaway: The first derivative says which way, the second says whether the way is easing, and they turn over on different days.
    stops:
      - group: INFLOW
        task: Find where the climb stopped getting steeper
        title: The hour the increments turned
        place: Catchment & Inflow Desk
        scene: >-
          Ashfell's gauge reports the flow once an hour, and it has risen at every
          reading so far. Rising is not the question. Sato wants the hour when the climb
          turned over — the flow still going up, but going up by less than it did the
          hour before. She will not take a shape described in words.
        guide: >-
          Nothing is read for you. Press Read on any hour and it reports that hour's
          flow, the climb since the hour before, and how that climb compares with the
          one before that. Take at least three, and consecutive hours tell you more than
          scattered ones. Then click the hour where the climb stopped getting steeper,
          and commit.
        background:
          - >-
              What the two columns are. The climb between consecutive readings is an
              estimate of the first derivative — how fast the flow is changing. The change
              in those climbs is an estimate of the second derivative, which is how fast the
              changing is changing. Both are estimates rather than values, because an hourly
              gauge cannot see what happened between two readings.
          - >-
              Why an inflection is worth an hour of anybody's morning. The flow is still rising at the turn, so
              nothing about the number itself announces it. What has changed is the trend. From that hour on, each
              hour adds less than the last. That is the first evidence that a flood peak exists and is
              approaching. Waiting for the flow to fall means waiting until the peak has already passed.
          - >-
              Why consecutive readings matter. A difference of differences amplifies noise:
              two readings each a little uncertain give a climb that is more uncertain, and
              comparing two climbs more uncertain again. Reading hours next to each other
              keeps the comparison honest, where jumping about the log invites reading a
              gauge wobble as a change of shape.
        assumes:
          - the change between consecutive readings estimates the first derivative
          - the change in those changes estimates the second derivative
        takeaway: An inflection is where the second derivative changes sign, and it happens while the quantity itself is still climbing.
        format: PROBE
        question: >-
          Read as many hours as you need. At which reading did the climb stop getting steeper?
        probe:
          chainLabel: Hour
          stations:
            - id: H06
              label: 06:00

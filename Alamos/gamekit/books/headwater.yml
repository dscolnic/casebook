      chasing a number.
    format: HOLD
    question: Hold the reservoir at its operating level through the afternoon.
    answerText: Inside the band for most of the afternoon, with the gate set so outflow matches inflow rather 
      than opened after the level has already risen.
    why: >-
      The rate of change of storage is inflow minus outflow. So the level is the accumulation of that
      difference. That is why holding it feels unlike holding anything with a setpoint. A gate opening
      does not put the level somewhere; it decides how fast the level is moving. Match the inflow and the
      level stops wherever it happens to be. Fall short and it rises at the difference for as long as the
      mismatch lasts. That is the same integral the whole course keeps returning to, drawn in real time on
      a gauge. The disturbances are the catchment doing what catchments do. A rain wave arrives hours
      after the rain. A tributary joins late. The ground goes on delivering once the sky has cleared. And
      the band narrows because freeboard is fixed and finite. The margin above the spillway is what the
      scheme is protected by, and none of it comes back during the afternoon.

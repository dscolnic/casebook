# Ground Truth — Station 12, Sablon Flats, and 15 working days of a storm season.
#
# Written to gamekit/tools/BOOK_TEMPLATE.md. The place is themes/groundtruth/site.js;
# the plan it came from is ../GAME_IDEAS.md under "Ground Truth".
#
# AP Physics C: E&M, taught as derivations. Ten of the forty-five stops are
# DERIVE panels and they are the spine of the campaign: Gauss on day 2, the
# potential integral on day 3, capacitance on day 5, the stored energy on day 6,
# Ampère on day 8, the inductive volts on day 9, the flux logarithm and Faraday
# on day 10, the RC discharge on day 13 and the Marx bank on day 14.
#
# `askRule: true` is on, which it is not in Midway or Headwater, and the reason
# is that in this course the choice of law IS the physics: a step whose key
# applies superposition while a distractor applies Gauss to a surface with no
# symmetry is the commonest way a Physics C student loses an E&M point. Every
# step offers at least two distinct rules among its candidates.
#
# The argument: Vero holds that the season is six weeks and a marginal field is
# still a field. Brenner holds that the crew is on an open flat under a 60 m
# mast and a cell that outruns the nowcast does not care about a countdown.
# Vero is right on day 4. Brenner is right on day 12.
#
# The timeline the cards are checked against:
#   3 Aug last season   strike S-114 — the outstation electronics died
#   April this year     the earthing signed off at 25 Ω, measured at DC
#   week 1–2            the mast re-instrumented, three shunts fitted
#   now                 week 3 of a six-week season; 15 working days
#   end of season       the funding review that decides the second mast

theme:
  id: groundtruth
  title: Ground Truth
  subtitle: Measurements Lead · Station 12, where lightning is made on purpose

groups:
- id: SCREEN
  code: SCREEN
  name: Screened Room
  color: '#6b7f8a'
  desc: "Where the campaign's screened room work is done."
  milestones: [Open the room, Read what it holds, Settle the question, Hand it on]
- id: FIELD
  code: FIELD
  name: Field & Charge
  color: '#5f7fb8'
  desc: What is overhead, read from the ground, and what the reading is entitled to say.
  defaultLeader: vero
  milestones: [Read the mill, Bound the charge, Set the criterion, Ready to hand over]
- id: BANK
  code: BANK
  name: Impulse Hall
  color: '#c2703f'
  desc: Stored charge, stored energy, and air that stops being an insulator.
  defaultLeader: strand
  milestones: [Charge the bank, Compute the energy, Fire the gap, Ready to hand over]
- id: MAST
  code: MAST
  name: Mast & Down-conductor
  color: '#8a8f4a'
  desc: Where the current goes, what it does on the way, and how it is measured.
  defaultLeader: tate
  milestones: [Check the path, Read the shunts, Bound the field, Ready to hand over]
- id: EARTH
  code: EARTH
  name: Earthing & Transients
  color: '#7a6a52'
  desc: The grid under the flat, and the difference between an ohm and a microsecond.
  defaultLeader: sifuentes
  milestones: [Measure the grid, Model the lead, Time the transient, Ready to hand over]
- id: COUPLE
  code: COUPLE
  name: Coupling & the Outstation
  color: '#6f5b9a'
  desc: How a strike reaches a cable it never touched.
  defaultLeader: lauwers
  milestones: [Find the loop, Compute the flux, Break the coupling, Ready to hand over]
- id: SHOT
  code: SHOT
  name: Launch & Records
  color: '#3f8f7a'
  desc: When to trigger, what was predicted, and what the record can carry.
  defaultLeader: brenner
  milestones: [Set the rule, Call the shot, Close the record, Ready to hand over]

roster:
- id: ortiz
  name: "Lena Ortiz"
  role: "SHOT division director; stops a launch while crew-clear lights disagree"
  division: SHOT
  bio: |
    Lena Ortiz is division director; stops a launch while crew-clear lights disagree. Wants a defensible final shot and signed report. Treats established procedure as independent evidence. Says, Accepts that a procedure must be tested at the right timescale. "What would make us stop?"
- id: ravi
  name: "Ravi Sen"
  role: "FIELD division scientist; opens the reference mill while rain reaches the flat"
  division: FIELD
  bio: |
    Ravi Sen is division scientist; opens the reference mill while rain reaches the flat. Wants preserve usable storm data. Trusts agreement among four mills. Says, Learns shared agreement can share one error. "What does the field permit us to claim?"
- id: strand
  name: "Elise Strand"
  role: "BANK division impulse engineer; keeps the earthing stick on the Marx bank"
  division: BANK
  bio: |
    Elise Strand is division impulse engineer; keeps the earthing stick on the Marx bank. Wants reproduce the strike without wasting hardware. Treats bank energy as the main hazard. Says, Expands safety from stored energy to coupling. "Count where the energy can go."
- id: tate
  name: "Marcus Tate"
  role: "MAST division engineer; checks a hot bond rather than defending his drawings"
  division: MAST
  bio: |
    Marcus Tate is division engineer; checks a hot bond rather than defending his drawings. Wants keep the mast and bonds serviceable. Assumes a low-resistance bond is harmless. Says, Reports the conduit path openly and redesigns it. "Which path carried it?"
- id: noor
  name: "Noor Haddad"
  role: "SCREEN division data and safety analyst; compares raw timestamps before summaries"
  division: SCREEN
  bio: |
    Noor Haddad is division data and safety analyst; compares raw timestamps before summaries. Wants preserve traceable, independent evidence. Can delay action while seeking perfect certainty. Says, Learns to define sufficient evidence before a shot. "Independent of what?"
- id: saira
  name: "Saira Malik"
  role: "EARTH division earthing specialist; verifies each bond at the trench"
  division: EARTH
  bio: |
    Saira Malik is division earthing specialist; verifies each bond at the trench. Wants keep surge current on the intended low-impedance path. Initially trusts DC resistance as a complete certificate. Says, Separates steady resistance from transient impedance. "At what timescale?"
- id: owen
  name: "Owen Park"
  role: "COUPLE division remote-systems engineer; opens the outstation cable bay"
  division: COUPLE
  bio: |
    Owen Park is division remote-systems engineer; opens the outstation cable bay. Wants protect remote electronics without hiding inconvenient damage. Initially blames local cards before tracing the incoming loop. Says, Learns to test the full source-path-receiver chain. "Where did the loop close?"

glossary:
- name: Field mill
  aliases: [field mill, mill]
  def: An instrument that reads the electric field overhead by spinning a shutter over a plate and measuring the charge that comes and goes.
- name: Triggered lightning
  aliases: [triggered lightning, triggered strike, trigger a strike]
  def: A strike started on purpose by flying a small rocket that trails a thin earthed wire up into a charged sky.
- name: Return stroke
  aliases: [return stroke, stroke]
  def: The bright, fast surge of current that runs back up an established channel, and the part of a strike that carries most of the charge.
- name: Rise time
  aliases: [rise time, rises in]
  def: How long a current takes to go from small to its largest value, about a microsecond in a strike.
- name: Peak current
  aliases: [peak current, peak of the current]
  def: The peak the current reaches during a strike, tens of kiloamps in a typical one.
- name: Gaussian surface
  aliases: [gaussian surface, closed surface]
  def: A closed surface drawn wherever you like, chosen so the flux out of it is easy to write down.
- name: Electric flux
  aliases: [electric flux, flux out of]
  def: The field passing through a surface, counted as field strength times the area facing it.
- name: Surface charge density
  aliases: [surface charge density, charge per square metre, sigma]
  def: How much charge sits on each square metre of a layer or a plate.
- name: Potential
  aliases: [potential, potential difference, voltage]
  def: The work per unit charge to move between two points, which is why it always belongs to a pair of them.
- name: Equipotential
  aliases: [equipotential, equipotential line]
  def: A line or surface every point of which is at the same potential, so moving along it costs no work.
- name: Capacitance
  aliases: [capacitance, capacitor]
  def: The charge a pair of conductors holds per volt between them, fixed by their shape and spacing.
- name: Dielectric strength
  aliases: [dielectric strength, breakdown field]
  def: The field a material can stand before it stops insulating, about three million volts per metre for dry air.
- name: Breakdown
  aliases: [breakdown, breaks down, flashover]
  def: 'What happens when a field exceeds what the material can hold: a conducting path forms and the charge crosses.'
- name: Marx generator
  aliases: [marx generator, marx, the bank, capacitor bank]
  def: A stack of capacitors charged side by side at a low voltage and then switched into a chain, so their voltages add.
- name: Derivation
  aliases: [derivation, derive, derived]
  def: Getting a result out of a law you already accept, one line at a time, so each line follows from the one above it.
- name: Electromagnetic compatibility
  aliases: [electromagnetic compatibility, emc]
  def: Whether equipment can work beside other equipment without being disturbed by its neighbours' fields.
- name: Impulse
  aliases: [impulse, impulse test]
  def: A single fast pulse of voltage or current, fired deliberately to see what a piece of equipment does about it.
- name: Spark gap
  aliases: [spark gap, gap, gaps]
  def: A deliberate air space set to break down at a chosen voltage, used as a switch that needs no moving parts.
- name: Shunt
  aliases: [shunt, current shunt]
  def: A small precise resistance placed in a current path, so the voltage across it reports the current through it.
- name: Divider
  aliases: [divider, voltage divider]
  def: A pair of impedances that produce a small copy of a large voltage, so an instrument can read it safely.
- name: Down-conductor
  aliases: [down-conductor, down conductor]
  def: The conductor that carries a strike from the top of a structure to the earthing below it.
- name: Grounding grid
  aliases: [grounding grid, earth grid, the grid]
  def: A mesh of copper under the ground, which spreads current entering the earth over as much soil as possible.
- name: Earth resistance
  aliases: [earth resistance, ground resistance]
  def: How many ohms an electrode driven into the soil presents to a steady current spreading away from it.
- name: Impedance
  aliases: [impedance]
  def: What a component opposes a changing current with, which includes its resistance and everything that depends on the rate of change.
- name: Inductance
  aliases: [inductance, self-inductance, inductive]
  def: The property by which a conductor opposes a change in its own current, measured in henries and present even in a straight wire.
- name: Mutual inductance
  aliases: [mutual inductance]
  def: The measure of how much of one circuit's flux passes through another, so that a change in one puts volts across the other.
- name: Time constant
  aliases: [time constant, tau]
  def: The characteristic time a circuit needs to respond, given by resistance times capacitance or by inductance over resistance.
- name: Bandwidth
  aliases: [bandwidth, in band, out of band]
  def: The range of speeds of change an instrument reports honestly; anything faster arrives distorted rather than merely noisy.
- name: Screened room
  aliases: [screened room, screened enclosure]
  def: A room wrapped in conducting sheet so that no outside field reaches what is inside it.
- name: Step potential
  aliases: [step potential]
  def: The difference in ground potential between one foot and the other while current is spreading through the soil.
- name: Nowcast
  aliases: [nowcast]
  def: A very short forecast built from radar returns, giving where a cell is now and where it will be in the next few minutes.
- name: Ampèrian loop
  aliases: [ampèrian loop, amperian loop]
  def: A closed path drawn round a current, chosen so the field is the same everywhere along it.
- name: Lenz's law
  aliases: [lenz's law, lenz]
  def: The rule that an induced current flows in whichever direction opposes the change that caused it.

missions:
# 15 mission fragment(s), assembled by tools/assemble-book.mjs from
# groundtruth_v2/ — edit the fragments, not this file.
# ============================================================ MISSION 1
# Lifted from ../fpl_gpt/GROUND_TRUTH_AP_PHYSICS_C_EM_Campaign_Implementation_Bible(1).md by tools/v10extract.mjs. Every quoted string below is
# the bible's, verbatim; engine/dev/bibleParity.mjs holds it to that.
- title: "Write the Stop Rule"
  card:
    header: "MISSION 1 - 15 DAYS UNTIL THE LAST STORM WINDOW CLOSES."
    title: "Write the Stop Rule"
    goNow: "Go to Launch Control and meet Dr. Lena Ortiz, station director, at the launch board."
    body: "15 days until the last storm window closes. One crew-clear lamp disagrees with the others beneath the red hold bar. Today you decide which two checks permit a shot."
    objective: "Commit a numerical field threshold and a disagreement rule before launch data appear."
  objective: "Commit a numerical field threshold and a disagreement rule before launch data appear."
  stake: "15 days until the last storm window closes. One crew-clear lamp disagrees with the others beneath the red hold bar. Today you decide which two checks permit a shot."
  takeaway: "Evidence must match the mechanism, units, and stated limits."
  segue: "But Ravi's four mills agree too neatly; he must bound what the storm field actually says before Ortiz trusts them."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Electric charge", def: "a property of matter that creates electric force; like signs repel and unlike signs attract."}
  - {name: "Electric field", def: "force per positive test charge, measured in newtons per coulomb or volts per metre."}
  - {name: "Superposition", def: "add each source's field as a vector to obtain the net field."}
  equations:
  - {"e":"E = F/q and E_net = ΣE_i","c":"Define field and combine several source fields.","v":[["E","electric field (N/C)"],["F","electric force (N)"],["q","test charge (C)"],["E_i","each source field"]],"s":"The four warning channels must be reduced to one signed, reviewable crew-clear decision."}
  primer:
  - "Field arrows point away from positive charge and toward negative charge."
  - "Add components with signs; do not add vector magnitudes blindly."
  - "A safety rule must be written before the reading it judges."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-launch-control
    # On arrival at Launch Control | radar-desk | automatic
    on: { enter: true, at: SHOT }
    world: "One crew-clear lamp disagrees with the others beneath the red hold bar."
    panel: "MISSION 1: FIX THE SIGNS OPEN"
    # unlocks: Unlock Stop 1 at radar-desk in Launch Control.
    bubbles:
    - who: ortiz   # Dr. Lena Ortiz
      say: "The green lights disagree about what upward means. Write one rule before the cell reaches us."
  - id: after-stop-1
    # After Stop 1 | launch-board | automatic
    on: { after: [1] }
    world: "At radar-desk, the dated accepted-result slip for Stop 1 reads: \"Mapping above, exact labels.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 1 RECORDED - STOP 2 OPEN"
    # unlocks: Unlock Stop 2 at launch-board in Launch Control.
    bubbles:
    - who: ortiz   # Dr. Lena Ortiz
      say: "That check holds. The normalized readings need an independent layer-model prediction before they can support a launch criterion."
  - id: after-stop-2
    # After Stop 2 | launch-board | automatic
    on: { after: [2] }
    world: "At launch-board, the dated accepted-result slip for Stop 2 reads: \"-4.5 kV/m, exact line/rule pairs.\". The slip remains in that fixture's evidence holder."
    panel: "SIGNED FIELD = VECTOR SUM"
    # unlocks: Unlock Stop 3 at launch-board in Launch Control.
    bubbles:
    - who: ortiz   # Dr. Lena Ortiz
      say: "That check holds. The layer prediction is ready, but calibration uncertainty could still explain the difference between channels."
  - id: after-stop-3
    # After Stop 3 | launch-board | automatic
    on: { after: [3] }
    world: "At launch-board, the dated accepted-result slip for Stop 3 reads: \"Single-field model survives; observed pair spread 0.20 kV/m ≤ 0.50 kV/m.\". The slip remains in that fixture's evidence holder."
    panel: "STOP 3 RECORDED - STOP 4 OPEN"
    # unlocks: Unlock Stop 4 at launch-board in Launch Control.
    bubbles:
    - who: noor   # Noor Haddad
      say: "Exactly right. Agreement helps only if the channels are independent."
  - id: at-mission-end
    # At mission end | radar-desk | automatic
    on: { missionEnd: true }
    world: "At launch-board, Dr. Lena Ortiz clips the FIELD AND CHANNEL-SPREAD LIMITS card above the launch key. The dated prop remains here on later visits."
    panel: "MISSION 1 EVIDENCE: RECORDED"
    # unlocks: Open the mission outcome and metric screen.
    bubbles:
    - who: ortiz   # Dr. Lena Ortiz
      say: "A deadline does not get its own launch key. But Ravi's four mills agree too neatly; he must bound what the storm field actually says before Ortiz trusts them."


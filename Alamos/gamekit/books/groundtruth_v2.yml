    # state/output: Record the result and unlock the next named stop.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   verify:{required_sequence:[calculate_and_commit,operate,measure,interpret],prediction:{submit:{quantity:"trailer voltage",unit:"V",truth:180,tolerance:10}},equipment_locked_until_prediction_commit:true,operation:{action:"fire one full shot",settings:{gap:8,unit:"mm"},fixed:["reroute"]},measurements:{current:30,unit_current:"kA",rise_time:100,unit_rise:"ns",conduit_current:0.4,unit_conduit:"kA",trailer_voltage:188,unit_voltage:"V"},restore:{required:true,action:"earth the bank",remeasure:false},correct_conclusion:"all thresholds pass",answerText:"All full-shot readings meet their written limits; earth the bank and record PASS."}

  # --- Stop 56: Probe the Rack
  #     Concept: spatial coupling; Keystone: K10,K12; Area: Remote Outstation; Learning role: PRACTICE; Difficulty: L3; Story role: TRANSFER L5.
  #     placement: PROBE, at probe-rack.
  - group: COUPLE
    at: probe-rack
    title: "Probe the Rack"
    concept: "spatial coupling"
    reason: "a passing peak at one probe cannot clear the whole rack."
    scene: "Because the main trailer probe reads 188 V, sample all six card positions before declaring victory. Identify where the spatial pattern breaks the 250 V limit and submit the failed location, and the team needs this result before it acts."
    motivation: "local loop area can preserve a hazard after the main cable reroute succeeds."
    format: PROBE
    question: "Probe all six card positions, record each peak in volts, identify the location exceeding the inclusive 250 V limit, and submit location, value, and mechanism."
    answerText: "The completed check shows card E fails at 310 V; local loop remains."
    why: "local loop area can preserve a hazard after the main cable reroute succeeds."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Probe every station; the main probe cannot certify an unsampled rack.
    # correct result: Card E fails at 310 V; local loop remains.
    # state/output: report piece14 then visible card E red text/icon.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   probe={comparison:"observed peak must be within station-specific expected interval and at or below the inclusive 250 V load limit",stations:[{id:A,reading:188,expected:190,tolerance:15,load:250,comparison:"within expected; load passes"},{id:B,reading:190,expected:188,tolerance:15,load:250,comparison:"within expected; load passes"},{id:C,reading:185,expected:187,tolerance:15,load:250,comparison:"within expected; load passes"},{id:D,reading:192,expected:191,tolerance:15,load:250,comparison:"within expected; load passes"},{id:E,reading:310,expected:189,tolerance:15,load:250,comparison:"121 V above expected and 60 V above load; fails"},{id:F,reading:187,expected:190,tolerance:15,load:250,comparison:"within expected; load passes"}],correct_station:E,correct_conclusion:"rack-local loop"}.
    #
    # CONVERTED. Six stations, each with what it reads now and what it was
    # expected to read — which is exactly the pair the engine's PROBE separates on.
    # The bible's per-station `comparison` is the verdict and is deliberately not
    # printed on a station row; its `load` limit is, because it is the same number
    # for every card and gives none of them away. `minReadings: 6` is the bible's
    # own "probe all six card positions".
    probe:
      chainLabel: "Card position"
      target: E
      minReadings: 6
      stations:
      - { id: A, label: "Card position A", reading: "188 V peak", expected: "190 V, within 15 V", load: "250 V limit" }
      - { id: B, label: "Card position B", reading: "190 V peak", expected: "188 V, within 15 V", load: "250 V limit" }
      - { id: C, label: "Card position C", reading: "185 V peak", expected: "187 V, within 15 V", load: "250 V limit" }
      - { id: D, label: "Card position D", reading: "192 V peak", expected: "191 V, within 15 V", load: "250 V limit" }
      - { id: E, label: "Card position E", reading: "310 V peak", expected: "189 V, within 15 V", load: "250 V limit" }
      - { id: F, label: "Card position F", reading: "187 V peak", expected: "190 V, within 15 V", load: "250 V limit" }
      commit: "Name the card position"

# redsand_oneshot.yml — RED SAND: FULL TANK.
#
# The whole AP Chemistry course taught inside one propellant plant on Mars,
# against a launch window that does not move, with three scientific reversals in
# it: the leak that was not, the saboteur who was not, and a tank that is full
# and not ready.
#
# The world is Red Sand's — the same site, the same fourteen places, the same
# buried modules along one graded track. Everything else is new: the cast, the
# story, the sixty questions and the order they arrive in. The source is
# Mars_AP_Chemistry_Campaign_Implementation_Bible.md at the repo root.
#
# Format is tools/BOOK_TEMPLATE.md; import with
#
#   node tools/import-book.mjs books/redsand_oneshot.yml redsand_oneshot --verify

theme:
  id: redsand_oneshot
  title: 'Red Sand: Full Tank'
  subtitle: Propellant Lead · Arcadia Rise

# ---------------------------------------------------------------- the areas
# Six areas, because six buildings on this site carry a case stand. The other
# eight places — the intake, the hydrogen store, the ice cut, the assay lab, the
# array shed, the battery bank, the tank farm and the pad office — are reached
# through `at:`, which sends the player to the object the question is about
# without making a fourteenth curriculum area out of it.
groups:
- id: GIBBS
  code: GIBBS
  name: Plant Control
  color: '#8d6bb5'
  desc: Where the ledgers are closed, the power is allocated and the plant is aimed.
  defaultLeader: abiola
  milestones:
  - Close the first ledger honestly
  - Find the one cause that fits every panel
  - Prove who did what, and when
  - Spend the last of everything on the right thing
- id: EQUIL
  code: EQUIL
  name: Reactor Hall
  color: '#c05a33'
  desc: What the Sabatier loop can give, what it gives out as heat, and what moves both.
  defaultLeader: herrera
  milestones:
  - Turn a schedule into a feed
  - Account for the heat as well as the product
  - State the balance the loop settles at
  - Certify a batch against the flight limits
- id: KINET
  code: KINET
  name: Catalyst Bay
  color: '#d19a2b'
  desc: How fast the reaction goes, what the catalyst does, and what takes it away.
  defaultLeader: sundqvist
  milestones:
  - Find which feed sets the ceiling
  - Get the rate law out of the data
  - Read the bed by where its heat is
  - Refuse the model with the best number
- id: PHASE
  code: PHASE
  name: Cold End
  color: '#4a86b8'
  desc: What condenses where, what sticks to what, and what must never reach a cold line.
  defaultLeader: cho
  milestones:
  - Rule out a path a substance cannot take
  - Keep water and carbon dioxide out of the cold end
  - Take a product away and move the balance
  - Say what is wrong with a tank that is full
- id: SOIL
  code: SOIL
  name: Water Plant
  color: '#9a8352'
  desc: Getting water out of frozen ground, measuring what is dissolved in it, and taking that out.
  defaultLeader: achebe
  milestones:
  - Tell concentration from amount
  - Measure against a standard rather than a wall meter
  - Treat what the next machine cannot survive
  - Test the certification on the newest sample
- id: ELEC
  code: ELEC
  name: Electrolysis Hall
  color: '#3f9e8c'
  desc: Splitting water with electricity, and what a finite number of kilowatt-hours buys.
  defaultLeader: demir
  milestones:
  - Name what happens at each electrode
  - Turn amps and hours into kilograms
  - Close hydrogen over the whole plant
  - Fund the chain that actually fills the tank

# ------------------------------------------------------------------ the cast
# Six speaking leads, one per area, each with something they want and something
# they cannot see. Six more who carry an observation or a consequence and never
# a subplot.
roster:
- id: abiola
  name: Laila Abiola
  role: Station Commander
  division: GIBBS
  bio: |
    Commands Arcadia Rise, which on any ordinary sol means arbitrating between
    six people who each own one number. Her question is always the same one:
    what can we defend? She would rather be handed a small honest figure than a
    reassuring one, and she says so on the first morning.

    She cancels work to make a point. A leak siren was sounding and two
    technicians were already walking valves down when she stopped them, because
    an intervention chosen before the ledger is read is a guess with a spanner
    in its hand.

    Her blind spot is agreement. Three panels showing the same number look to
    her like three witnesses, and it takes a dependency graph to show her they
    are one witness repeated.
  quiz:
  - q: Why does Abiola stop the valve work before any measurement has been argued about?
    a: Choosing an action first makes the evidence impossible to read afterwards
    wrong:
    - Sealing a valve on this station requires two signatures and only one of the two was available that morning
    - The leak siren has been unreliable below twelve bar since the plant was commissioned
    - Station policy forbids any physical intervention at all while a warning light is showing red
- id: nakata
  name: Suri Nakata
  role: Shift Controller
  division: GIBBS
  bio: |
    Keeps the load board, which means she is the person who knows what will go
    dark if a decision is taken carelessly. She writes every allocation down in
    pencil first and in ink only once somebody senior has said the sentence out
    loud.

    She has run this board through two dust seasons. What she contributes is
    memory: which circuits have been shed before, what came back slowly, and
    which one nobody has ever tried.
  quiz:
  - q: Why does Nakata write an allocation in pencil before anybody signs it?
    a: So it can still be argued with rather than quoted back
    wrong:
    - Ink is rationed on this station and every drop of it is reserved for flight paperwork
    - The load board is photographed at the end of every sol and pencil reproduces better
    - Pencil survives the cold in the control module considerably better than ink ever does
- id: sundqvist
  name: Ingrid Sundqvist
  role: Production and Catalyst Lead
  division: KINET
  bio: |
    Runs the plant against a calendar. Her question is how many kilograms by
    dawn, and she can answer it to two figures at any hour of any sol. Twice she
    has been right to push the bed harder when everybody else was being
    careful, and she has not forgotten either time.

    She reaches for rate first. If output is down, something is going too
    slowly, and the fix is more heat, more flow or more passes. That instinct is
    usually the fastest route to the answer and it is wrong whenever yield or
    purity is the thing that binds.

    She accuses people, and she takes it back in public when the data says to.
    Both are the same trait.
  quiz:
  - q: What makes Sundqvist's first instinct about a shortfall a real risk rather than a habit?
    a: Reaching for speed hides a limit on how much can be made at all
    wrong:
    - She has never before run a plant whose product had to be handed over as a certified liquid
    - She refuses on principle to read any figure she has not measured with her own instruments
    - Her production calendar was written months before anybody chose which catalyst charge to fly
- id: tanaka
  name: Rei Tanaka
  role: Maintenance Technician
  division: KINET
  bio: |
    Services the valves, the jackets and anything that has to be opened with a
    spanner. He is the one who knows that a blue stain near a methane valve is a
    service fluid he spilled two shifts ago, and he says so as soon as anybody
    asks him.

    His records are handwritten and complete. He is uneasy about that being
    treated as evidence, because a note proves what he wrote down and not what
    the pipe did.
  quiz:
  - q: Why is Tanaka uneasy when his maintenance note is offered as proof of a valve position?
    a: A note is what he wrote, not what the valve did
    wrong:
    - His handwriting has been misread by the control room on at least two previous occasions
    - Maintenance notes on this station are never countersigned by a second qualified technician
    - He was working alone in the bay that shift and cannot supply anybody as a witness
- id: herrera
  name: Tomás Herrera
  role: Reactor and Safety Engineer
  division: EQUIL
  bio: |
    Owns the Sabatier loop and the thermal envelope it has been tested inside.
    His question is what changed first, and he asks for raw timestamps before he
    will discuss anybody's conclusion. He thinks about the reactor as a balance
    rather than as a machine that goes fast or slow.

    What frightens him is a bed temperature reported as one number. The inlet
    and the outlet can disagree by fifty kelvin, and an average that stays
    respectable is exactly how a hot spot goes unseen until it is not a hot spot
    any more.

    His blind spot is secrecy. He held back an incomplete thermal record because
    he expected command to overreact to it, and that silence is most of why he
    spends three sols looking guilty.
  quiz:
  - q: Why does Herrera refuse to argue about a bed temperature given as a single figure?
    a: An average stays calm while one end runs over the limit
    wrong:
    - A thermowell will drift by as much as fifty kelvin over the life of one catalyst charge
    - The control system samples the outlet only once a minute and interpolates everything between
    - A single figure cannot be signed for under the flight rules this station operates to
- id: okafor
  name: Amaka Okafor
  role: Reactor Operator
  division: EQUIL
  bio: |
    Stands the reactor watch, which means she is the person who actually turns
    the set point when somebody senior decides it should move. She keeps her own
    log of what she was asked to do and what the loop did afterwards.

    She is careful about the difference between the two. A set point is an
    instruction and a temperature is a measurement, and her log has separate
    columns for them because she has seen those confused.
  quiz:
  - q: Why does Okafor keep set points and measured temperatures in separate columns?
    a: One is an instruction and the other is a measurement
    wrong:
    - The two are read from instruments that sit on entirely different calibration schedules
    - Flight rules require every instruction to be logged well apart from any measured data
    - Set points are recorded in degrees Celsius on this station and temperatures in kelvin
- id: cho
  name: Mei-Ling Cho
  role: Water and Cryogenics Engineer
  division: PHASE
  bio: |
    Owns everything that gets dangerously cold, which is why her question is
    what can physically travel there. She will not accept a residue sample with
    a broken chain of custody, and she said so to a production lead in front of
    four people.

    She thinks in properties. A molecule's shape decides whether its charges
    cancel, and what is left over decides whether the substance rides a dry gas
    stream or condenses out of it a hundred metres upstream. That reasoning has
    saved a cold line twice.

    Her blind spot is tidiness. She trusts a separation model further than she
    trusts a maintenance history, and the messy record is sometimes the true
    one.
  quiz:
  - q: What is Cho actually testing when she asks what could physically travel to a spot?
    a: Whether the substance's own properties allow that route at all
    wrong:
    - Whether anybody at all was rostered to walk that section of pipe during the shift in question
    - Whether the line was warm enough along its whole length to keep a gas from liquefying inside it
    - Whether the sample bag was properly sealed before it was carried away from the suspect valve
- id: vasquez
  name: Elena Vasquez
  role: Pad Controller
  division: PHASE
  bio: |
    Runs the loading checklist at the pad office, thirty metres from the
    vehicle. Her job is a sequence, and her contribution to any argument is what
    the sequence will not allow: a transfer that cannot be reversed once the
    umbilical is warm.

    She has stopped two loadings. Neither was popular and both were on the
    checklist, which is the only defence she has ever needed.
  quiz:
  - q: Why does Vasquez treat a loading as different from most plant operations?
    a: It cannot be undone once the umbilical is warm
    wrong:
    - The pad office has no direct voice line to the reactor hall and never has had one
    - Loading is the only operation on this station that runs on battery power alone
    - The loading checklist is written by the vehicle manufacturer rather than by the station
- id: achebe
  name: Rosalind Achebe
  role: Analytical and Electrochemistry Lead
  division: SOIL
  bio: |
    Wants every important number traceable to something physical. Her question
    is against which standard, and she carries a sealed one rather than
    calibrating from yesterday's plant water. She is the reason a launch does
    not go on a green light nobody can trace.

    Her instinct is to break a chain of assumption by taking a fresh sample from
    a different place with a different reference. It is slow, it costs a rover
    trip, and twice in this fortnight it is the only thing that finds the
    answer.

    Her blind spot is the clock. She will ask for perfect evidence when
    sufficient evidence was available an hour ago, and people have started
    deciding without her because of it.
  quiz:
  - q: Why does Achebe refuse to calibrate an instrument from the plant's own recent water?
    a: A reference from inside the system cannot expose the system's own bias
    wrong:
    - Plant water changes its composition considerably faster than any sealed reference does
    - The wall meters are read to far fewer significant figures than her own portable instrument
    - Recent samples have not yet cleared the polishing columns and are not representative
- id: moreau
  name: Denis Moreau
  role: Rover Operator
  division: SOIL
  bio: |
    Drives the long haul out to the ice cut and back, which is three hundred
    metres of graded track and the only part of this station that feels like a
    planet. He takes the field blanks because somebody has to hold a clean
    bottle open in the open air and then seal it again.

    He is precise about where a sample came from. A vial with the wrong cut face
    written on it is worse than no vial, and he has thrown two away for that.
  quiz:
  - q: Why does Moreau discard a sample whose cut face was recorded wrongly?
    a: A sample with no place attached answers nothing
    wrong:
    - A vial that has been relabelled by hand will no longer seal to flight standard
    - The rover logs its positions automatically and the two records are required to match
    - Ice taken from different faces of the cut melts at measurably different rates
- id: demir
  name: Yusuf Demir
  role: Power and Life-Support Officer
  division: ELEC
  bio: |
    Holds the electrical budget and the habitat's heat, air and water, which are
    the same budget seen from two ends. His question is what stops if we do
    that, and he asks it every time somebody proposes running the stacks harder.

    He opened the habitat reserve breaker log during a reactor meeting to make
    the point that the plant is not the only load on the plain. Six people are
    the other one, and nobody is allowed to shed them.

    His blind spot is scarcity itself. He frames every choice as something being
    taken away, and he underrates how much a recovered recycle loop can put back
    into the same budget.
  quiz:
  - q: Why does Demir open the habitat breaker log during an argument about reactor output?
    a: To make the crew's heat and air visible as a competing load
    wrong:
    - Because the breaker log is the only surviving record of what the array really delivered
    - Because reactor meetings are where every power allocation on this station is formally signed
    - Because the habitat and the reactor are wired through one shared set of heavy cables
- id: bhatt
  name: Priya Bhatt
  role: Habitat Medic
  division: ELEC
  bio: |
    Looks after six people, which on this station mostly means looking after
    temperature, oxygen partial pressure and sleep. She puts the night heat load
    on the board in numbers when an argument about power starts to sound
    abstract.

    She does not argue about chemistry. What she supplies is the consequence:
    what happens in the habitat, and how quickly, if a circuit that looks
    discretionary is shed.
  quiz:
  - q: Why does Bhatt put the habitat's night heat load on the board as a number?
    a: An abstract argument hides what the crew actually loses
    wrong:
    - Because the medical log is required to record every power allocation decision taken
    - Because heat is the only load she is formally authorised to speak about at a meeting
    - Because the night heat load is the largest single electrical draw anywhere on the plain

glossary:
- name: Mole
  aliases: [mole, moles, kilomole, kilomoles, kmol]
  def: A fixed count of particles, the same count whatever the substance is. One mole is Avogadro's number of them, which is how a mass on a scale becomes a number the reaction can be asked about.
- name: Molar mass
  aliases: [molar mass]
  def: The mass of one mole of a substance, in grams per mole. Dividing grams by it gives moles.
- name: Avogadro's number
  aliases: [avogadro's number, avogadro, 6.022 × 10²³]
  def: The number of particles in one mole of anything, the same for every substance. Written out it is 6.022 × 10²³ per mole.
- name: Ion
  aliases: [ion, ions]
  def: An atom or group of atoms with a net electrical charge, because it has lost or gained electrons.
- name: Stoichiometry
  aliases: [stoichiometry, stoichiometric]
  def: The bookkeeping of a reaction. The coefficients in a balanced equation compare moles, never masses.
- name: Limiting reactant
  aliases: [limiting reactant, limiting reagent, limits]
  def: The feed that predicts the smaller amount of product. It fixes the ceiling, and the other feed is left over.
- name: Theoretical yield
  aliases: [theoretical yield]
  def: The most product the limiting reactant could give if nothing were lost.
- name: Partial pressure
  aliases: [partial pressure, partial pressures]
  def: The share of a gas mixture's total pressure that belongs to one component. It is that component's mole fraction times the total.
- name: Mole fraction
  aliases: [mole fraction]
  def: The fraction of all the molecules present that are one particular substance.
- name: Ideal gas law
  aliases: [ideal gas law, pv = nrt]
  def: Pressure times volume equals moles times the gas constant times absolute temperature, written PV = nRT. It counts the total gas particles in a vessel and says nothing at all about which gases they are.
- name: Lewis structure
  aliases: [lewis structure, lewis structures]
  def: A drawing that accounts for every valence electron as a bond or a lone pair.
- name: VSEPR
  aliases: [vsepr, electron domain, electron domains]
  def: The rule that groups of electrons round a central atom spread as far apart as they can, which is what fixes a molecule's shape.
- name: Polarity
  aliases: [polarity, polar, nonpolar, dipole, bond dipole]
  def: Whether a molecule has a positive end and a negative end. Polar bonds can still cancel if the shape is symmetric.
- name: Intermolecular force
  aliases: [intermolecular force, intermolecular forces, imf, london dispersion, hydrogen bonding]
  def: The attraction between whole molecules rather than inside them. It decides boiling point, how well something dissolves, and what stays behind on a cold surface.
- name: Molarity
  aliases: [molarity, moles per litre, mol/l]
  def: Moles of dissolved substance per litre of solution. A concentration, not an amount.
- name: Beer-Lambert law
  aliases: [beer-lambert law, beer-lambert, absorbance]
  def: Absorbance is proportional to concentration at a fixed wavelength and a fixed sample thickness, so a colour becomes a number.
- name: Enthalpy change
  aliases: [enthalpy change, enthalpy, delta h, ΔH]
  def: The heat given out or taken in at constant pressure. Negative means the reaction releases heat.
- name: Specific heat
  aliases: [specific heat]
  def: The energy needed to raise one kilogram of a substance by one kelvin.
- name: Phase change
  aliases: [phase change, latent heat, heat of fusion]
  def: Melting, boiling or condensing. Energy goes in or out while the temperature stands still.
- name: Rate law
  aliases: [rate law, reaction order, orders]
  def: The equation relating reaction rate to concentrations, with powers found by experiment rather than read off the balanced equation.
- name: Rate constant
  aliases: [rate constant, constant k]
  def: The proportionality factor in a rate law. Its units depend on the overall order, and temperature moves it.
- name: Catalyst
  aliases: [catalyst, catalysts, catalysed]
  def: Something that lowers the energy barrier a reaction has to cross, speeding both directions without changing where the balance sits.
- name: Mechanism
  aliases: [mechanism, elementary step, elementary steps, rate-determining step]
  def: The sequence of real molecular steps a reaction goes through. The slowest one governs how fast the whole thing runs.
- name: Intermediate
  aliases: [intermediate, intermediates]
  def: A species made in one step of a mechanism and used up in a later one, so it appears in neither the reactants nor the products.
- name: Catalyst poisoning
  aliases: [poisoning, poisoned, halide poisoning]
  def: A contaminant sticking to the catalyst's active sites so reacting molecules can no longer reach them.
- name: Equilibrium
  aliases: [equilibrium, dynamic equilibrium]
  def: The state where forward and reverse reactions run at the same rate, so the amounts stop changing while neither reaction stops.
- name: Equilibrium constant
  aliases: [equilibrium constant, kc, k]
  def: The particular ratio of product to reactant amounts a mixture settles at, fixed at a given temperature.
- name: Reaction quotient
  aliases: [reaction quotient, q]
  def: The same expression as K, worked out from the amounts present right now. Below K the reaction runs forward; above it, backward.
- name: ICE table
  aliases: [ice table, ice board]
  def: Initial, change, equilibrium — a table that ties every amount to one reaction extent through the coefficients.
- name: Le Chatelier's principle
  aliases: [le chatelier's principle, le chatelier]
  def: Disturb an equilibrium and it shifts in the direction that partly undoes the disturbance.
- name: pH
  aliases: [ph]
  def: The negative logarithm of the hydrogen ion concentration. A log scale, so pH values can never be averaged.
- name: Neutralisation
  aliases: [neutralisation, neutralise, neutralised, neutralization]
  def: Acid and base consuming each other mole for mole. Subtract the moles first, then work out a concentration.
- name: Ion exchange
  aliases: [ion exchange, ion-exchange, polishing column]
  def: A resin that swaps unwanted dissolved ions for harmless ones. It has a fixed number of sites and eventually breaks through.
- name: Oxidation
  aliases: [oxidation, oxidised, anode]
  def: Loss of electrons. In water electrolysis it happens at the anode and makes oxygen.
- name: Reduction
  aliases: [reduction, reduced, cathode]
  def: Gain of electrons. In water electrolysis it happens at the cathode and makes hydrogen.
- name: Electrolysis
  aliases: [electrolysis, electrolyser, electrolyzer, stack]
  def: Forcing a reaction that will not run on its own by pushing electrons through it.
- name: Faraday's law
  aliases: [faraday's law, faraday constant, 96485]
  def: Charge is a countable amount of electrons, so current times time divided by 96485 coulombs per mole gives moles of electrons.
- name: Current efficiency
  aliases: [current efficiency]
  def: The fraction of the charge that actually made the product you wanted rather than something else.
- name: Calibration standard
  aliases: [calibration standard, standard, sealed standard]
  def: A sample of known composition an instrument is set against. Two instruments sharing one standard share its error.
- name: Holdout
  aliases: [holdout, held-out, held out]
  def: Data deliberately kept out of building a model, so the model can be tested on something it has never seen.
- name: Residual
  aliases: [residual, residuals]
  def: Observed minus predicted. Pattern in the residuals means missing physics, however small the average error is.
- name: Specification
  aliases: [specification, flight specification, off-spec]
  def: A set of limits written down before the results arrive, each tied to a consequence.

- name: Chloride
  aliases: [chloride, chlorides]
  def: The ion a chlorine atom becomes when it gains an electron. It comes up with the ice here, and it poisons a nickel catalyst.
- name: Perchlorate
  aliases: [perchlorate, perchlorates]
  def: A chlorine and oxygen ion found in the ground here. It dissolves readily, which is why it reaches equipment that never touched the soil.
- name: Solute
  aliases: [solute, solutes, dissolved solute]
  def: The substance dissolved in a solution, as opposed to whatever is doing the dissolving.
- name: Adsorption
  aliases: [adsorb, adsorbs, adsorbed, adsorption]
  def: A molecule sticking to a surface rather than passing over it. It is how a reacting gas reaches a catalyst and how a poison blocks one.
- name: Desorption
  aliases: [desorb, desorbs, desorbed, desorption]
  def: A molecule leaving a surface it was stuck to, which is how a product gets off a catalyst and lets the site be used again.
- name: Detector saturation
  aliases: [saturate, saturates, saturated, saturation]
  def: An instrument reaching the top of what it can report, so any larger signal reads the same as the last one.
- name: Retention
  aliases: [retention, retained, retains]
  def: How strongly a coating holds a substance instead of letting it pass. Stronger attraction means longer retention.
- name: Boil-off
  aliases: [boil-off, boiled off, boils off]
  def: Cold propellant turning back to gas in a tank and being vented, which is what refrigeration exists to stop.

# --------------------------------------------------------------- the campaign
# Fifteen sols, sixty stops, four to a sol. The bible's location plan is kept by
# `at:` rather than by the group: sols 1 to 4 stand in one place, 5 to 10 in two,
# 11 to 15 in three, and the group each stop belongs to is the area of the course
# it teaches.
missions:

# ============================================================ sol 1 — GIBBS ×1
- title: The Shortfall
  objective: Establish what the shift sheet counts before anybody opens a pipe.
  briefing: Command wants the first claim about the shortfall that can be defended.
  stake: >-
    It is the first of fifteen key sols. The tanks are 18 percent behind and no leak alarm has
    fired. Today you decide what the shift sheet really counts, before anyone opens a pipe.
  takeaway: A nearly closed carbon ledger weakens a leak story without naming the real cause.
  segue: >-
    The carbon ledger closes to within 0.2 percent, so a big methane leak is a poor story. But the
    tank is still short, and nobody knows which feed the plant is running out of.
  stops:

  - group: GIBBS
    call: Ask the commander what the software is calling a particle
    task: Sort four labelled samples into atoms, molecules and ions.
    title: Labels on the sample tray
    at: sample-tray
    person: true
    reason: The ledger cannot keep atoms and ions apart while the software calls all four the same word
    concept: Atoms, molecules and ions, and the mole as a way of counting them
    place: Plant Control
    scene: >-
      Four sealed cards lie beside yesterday's samples: Ar, CH4, H+ and CO2. Laila Abiola, the station commander,
      says the control software calls all four of them particles. That is true, and it is useless to a ledger that has
      to keep atoms, molecules and ions apart.
    guide: >-
      All four options use the same three words and put the four samples in different boxes. The test
      is charge and bonding, taken one sample at a time. An atom is one neutral element unit. A
      molecule is two or more atoms bonded together with no net charge. An ion is either of those
      with electrons missing or added, so it carries a charge. Read each option as four separate
      claims and look for the first one that fails.
    background:
    - >-
      Particle is a class name, not a description. Chemists use it for anything small enough to be
      counted rather than weighed, which is why a control system can call an argon atom, a methane
      molecule and a hydrogen ion by the same word and be correct every time.
    - >-
      What the ledger needs is different. Conservation is written in atoms, production is counted in
      molecules, and anything with a charge moves in an electric field and can be pulled out of a
      stream. Three different jobs, three different words.
    assumes:
    - a chemical formula says which elements are present and in what ratio
    takeaway: Particle is the umbrella word, and it does not erase the differences underneath it.
    format: CHOICE
    question: Which classification of the four samples is completely correct?
    choices:
    - Ar is an atom, CH4 and CO2 are molecules, and H+ is an ion.
    - All four are molecules, because every symbol here describes matter.
    - Ar and H+ are atoms, and CH4 and CO2 are ions.
    - CO2 is an atom, because it is written as one chemical formula.
    answer: Ar is an atom, CH4 and CO2 are molecules, and H+ is an ion.
    why: >-
      Argon is a single neutral atom. Methane and carbon dioxide are bonded atoms carrying no net
      charge, which makes them molecules. H+ has lost its electron and carries a positive charge, so
      it is an ion. Particle covers all three honestly, and the ledger needs what is under it:
      conservation is written in atoms, the reactor model counts molecules, and only the charged one
      can be pulled out of a stream by a field.
    rebuttals:
    - A formula can name an atom, a molecule or an ion. Being written as a formula decides nothing.
    - H+ carries a charge and the other two carry none. That is the whole difference here.
    - One written formula can hold several atoms. CO2 holds three of them.

  - group: KINET
    call: Turn the missing kilograms into a number the reactor model can use
    task: Estimate how many methane molecules the shortfall stands for.
    title: How much methane is missing
    at: conv-board
    reason: Telemetry reports kilograms and the reactor model counts molecules, so today they have to be made to agree
    concept: Atoms, molecules and ions, and the mole as a way of counting them
    place: Plant Control
    scene: >-
      The schedule is short by 1.60 x 10^3 kilograms of methane. Ingrid Sundqvist, the production
      and catalyst lead, wants that in molecules so telemetry and the reactor model stop disagreeing. The conversion board carries
      the molar masses and Avogadro's number already.
    guide: >-
      Two steps, in this order. Grams divided by grams per mole gives moles, so the mass has to be in
      grams before the division happens. Moles multiplied by Avogadro's number gives molecules.
      Choose the four tiles that carry the mass, the kilogram-to-gram factor, the molar mass of
      methane and the particles per mole. One tile on the board belongs to carbon dioxide and has no
      business in this calculation.
    background:
    - >-
      A mole is a fixed count of particles, 6.022 x 10^23 of them. Molar mass is the mass of one of
      those counted groups, in grams per mole, so dividing by it turns a weight into a number of
      groups. Nothing else in the calculation does that job.
    - >-
      This is why multiplying a mass straight by Avogadro's number is meaningless. The answer would
      have units of gram-particles per mole, which is not a count of anything, and it would be about
      sixteen times too large for methane.
    assumes:
    - a mole is a fixed number of particles, whatever the substance
    takeaway: A mass becomes a count only through molar mass, and only after the units line up.
    format: BALLPARK
    question: Estimate the number of methane molecules the shortfall stands for.
    estimate:
      prompt: The schedule is short by 1.60 x 10^3 kg of methane, and the reactor model wants that as molecules.
      question: Estimate the number of methane molecules the shortfall stands for.
      relationship: molecules = mass in grams / molar mass x Avogadro's number
      labels:
      - 1.60×10³ kg  (methane short of schedule)
      - 1000 g/kg  (kilograms to grams)
      - 16.04 g/mol  (molar mass of methane)
      - 6.022×10²³ molecules/mol  (Avogadro's number)
      - 44.01 g/mol  (molar mass of carbon dioxide)
      values: [1600, 1000, 16.04, 6.022e23, 44.01]
      slots: 4
      template: '{0} × {1} ÷ {2} × {3}'
      formula: a*b/c*d
      correct: [0, 1, 2, 3]
      target: 6.007e28
      tolerance: 3.6e27
      units: molecules of methane
      solution: 1.60 × 10⁶ g ÷ 16.04 g/mol ≈ 9.98 × 10⁴ mol, and × 6.022 × 10²³ ≈ 6.0 × 10²⁸ molecules.
      explanation: Kilograms have to become grams before the molar mass can divide them, and the moles that come out are then multiplied up into particles.
    why: >-
      Kilograms cannot cancel grams per mole, so the thousand comes first. 1.60 x 10^6 grams divided
      by 16.04 grams per mole is about 9.98 x 10^4 moles, and each of those moles is Avogadro's number
      of molecules, which gives about 6.0 x 10^28. Stopping at the moles answers a different question.
      Multiplying the mass by Avogadro's number skips the only step that turns a weight into a count,
      and the units say so before the arithmetic does.

  - group: SOIL
    call: Rebuild the conversion the software rollback erased
    task: Put the five steps of the mass-to-molecules conversion in order.
    title: Rebuild the conversion
    at: unit-board
    reason: A spreadsheet is reporting molecules straight off a scale reading and the formula cells are gone
    concept: Atoms, molecules and ions, and the mole as a way of counting them
    place: Plant Control
    scene: >-
      A junior technician's spreadsheet reports molecules directly from a tank mass. The formula cells
      were wiped in last night's software rollback, and five operation cards are all that is left of
      it. Nothing on the ledger can be trusted until the chain is back.
    guide: >-
      Order the five cards so that every unit cancels the one before it. The question to ask at each
      join is what units are left after this step. Kilograms cannot meet grams per mole, moles cannot
      be reported as molecules, and a result with no unit on it is not a result. The rail is a
      sequence of operations, earliest first.
    background:
    - >-
      Dimensional analysis is a path chosen so the units cancel. Each factor is written as a
      fraction, and a factor is in the right place when the unit you want to lose is on the
      bottom. What is left at the end is the unit of the answer, which is why the trail is also an
      error detector.
    - >-
      Reporting the unit is part of the calculation and not a courtesy. The same digits mean moles,
      molecules or grams depending on where the chain stopped, and the plant has already lost a shift
      to a number nobody could name.
    assumes:
    - a unit can be cancelled only against the same unit
    takeaway: The unit trail is the calculation, and it catches the mistake before the answer does.
    format: SEQUENCE
    cards:
    - Read the tank mass in kilograms.
    - Convert kilograms to grams.
    - Divide by the molar mass of methane.
    - Multiply by Avogadro's number.
    - Report the result as molecules, with the unit written down.
    order: [0, 1, 2, 3, 4]
    why: >-
      The chain is fixed by what cancels what. A mass in kilograms cannot be divided by grams per
      mole, so the thousand has to come first. Dividing by molar mass leaves moles; multiplying by
      molecules per mole leaves molecules; and writing the unit down is what lets the next reader
      check the path instead of trusting it. Any order that puts two factors together whose units do
      not cancel is wrong before a single digit is entered.

  - group: EQUIL
    call: Close the first carbon ledger at the ledger desk
    task: Add every carbon stream as carbon and report the total the plant accounts for.
    title: Close the first carbon ledger
    at: ledger
    reason: If the carbon is nearly all still in the plant, an 18 percent methane leak cannot be the story
    concept: Balanced equations and stoichiometry as an atom ledger
    takesAsRead: Atoms, molecules and ions, and the mole as a way of counting them
    place: Plant Control
    scene: >-
      Yesterday's intake carried 100.0 kilomoles of carbon into the plant as carbon dioxide.
      Instruments report three streams it could have left in. Abiola has pinned the sheet under a
      magnet labelled Do not explain yet.
    guide: >-
      Read each stream and add the ones that carry carbon, counted as carbon atoms rather than as
      whole molecules. One mole of carbon dioxide and one mole of methane each hold one mole of
      carbon. Water holds none. Then report the total and see how much of the 100.0 kilomoles is
      still unassigned. A ledger with a small remainder is a different finding from a ledger with a
      large hole in it.
    background:
    - >-
      An atom ledger works because atoms are neither made nor destroyed. Whatever carbon entered the
      plant is somewhere: in product, in inventory, in a vent, or lost. That is a stronger statement
      than any single instrument makes, which is why it is the first thing to close.
    - >-
      Counting has to be in the same currency throughout. The subscript in CH4 counts hydrogen atoms
      and says nothing about carbon, and a schedule gap measured in kilograms of product is not a
      stream of anything. Both mistakes make the ledger look far worse than it is.
    assumes:
    - atoms are neither created nor destroyed by a chemical reaction
    takeaway: Count carbon as carbon, and a leak has to show up as carbon that is not there.
    format: BALANCE
    question: Close the carbon ledger. How much carbon does the plant account for in total?
    relationship: carbon accounted for = carbon as methane + carbon as recycled carbon dioxide + carbon vented
    balance:
      total: { amount: 100.0, unit: kmol C, label: Carbon into the plant as carbon dioxide }
      tolerance: 0.1
      streams:
      - { id: methane, label: Carbon collected as methane, value: 81.6, unit: kmol C }
      - { id: recycle, label: Carbon still in the loop as unreacted carbon dioxide, value: 17.9, unit: kmol C }
      - { id: vented, label: Carbon in sampled and vented gas, value: 0.3, unit: kmol C }
      - { id: water, label: Coproduct water collected, value: 0, countable: false, unit: kmol C,
          unitNote: Water carries hydrogen and oxygen and no carbon at all. }
      - { id: unassigned, label: Carbon in no stream anybody has measured, value: 0.2, hidden: true, unit: kmol C }
      commit: Report the total carbon
    answerText: >-
      100.0 kilomoles, once the 0.2 in no measured stream is counted. Only 99.8 of it sits in the
      three streams anybody had written down, and two tenths of one percent is not a leak.
    why: >-
      One mole of carbon dioxide and one mole of methane each hold one mole of carbon, so the three
      carbon streams add as carbon: 81.6 plus 17.9 plus 0.3 is 99.8 kilomoles. The water row belongs
      on the panel and not in the sum, because water carries no carbon. That leaves 0.2 kilomoles
      unassigned, which is inside ordinary measurement uncertainty and nothing like the 18 percent a
      large methane leak would need. It does not prove there is no leak. It makes a big one a poor
      explanation.

# =========================================================== sol 2 — INTAKE ×1
- title: The Feedstock Problem
  objective: Test the claim that the thin air cannot give the plant enough carbon dioxide.
  briefing: The answer is bad news in a useful shape.
  stake: >-
    The intake is blamed on the second sol: perhaps the thin air cannot give enough carbon dioxide.
    The compressor log is whole, so the claim can be tested. Today you decide which feed sets the
    ceiling.
  takeaway: The limiting reactant is the one that predicts less product, not the one that looks scarce.
  segue: >-
    The air gives plenty of carbon. So the intake is cleared. But only 520 kilomoles of hydrogen came
    in, and nobody has looked at the store gauge.
  stops:

  - group: EQUIL
    call: Order the workflow that turns captured gas into a production figure
    task: Order the five steps that turn captured carbon dioxide into a methane mass.
    title: The production workflow
    at: stoich-board
    reason: The log is in kilograms of feed and the schedule is in kilograms of product, and the coefficients join neither directly
    concept: Balanced equations and stoichiometry as an atom ledger
    place: Atmosphere Intake
    scene: >-
      Sundqvist has the shift's capture log in kilograms of carbon dioxide and a schedule written in
      kilograms of methane. Five cards sit on the intake board. Her one warning is that the
      coefficients painted on the reactor wall compare particles.
    guide: >-
      Order the cards so that each step hands the next one something it can use. The balanced
      equation has to exist before any ratio can be read off it. Coefficients compare moles, so a
      mass has to become moles before the ratio is applied, and the answer has to come back to mass
      before it can be set against a schedule. Comparing at the wrong point is the mistake this rail
      is built to catch.
    background:
    - >-
      In CO2 + 4H2 gives CH4 + 2H2O, the coefficients say one particle of carbon dioxide reacts with
      four of hydrogen to give one of methane and two of water. They are counts, not weights. One
      mole of carbon dioxide weighs 44.01 grams and one mole of methane weighs 16.04, so a one-to-one
      mole ratio is nothing like a one-to-one mass ratio.
    - >-
      Molar mass is the only bridge between a scale and a coefficient. That is why the pattern is
      always the same: mass in, moles, ratio, moles, mass out.
    assumes:
    - a balanced equation is available for the reaction
    takeaway: Coefficients join moles, so a mass has to be converted before and after they are used.
    format: SEQUENCE
    cards:
    - Balance the equation for the reaction.
    - Convert the carbon dioxide mass to moles.
    - Apply the carbon dioxide to methane mole ratio.
    - Convert the methane moles back to a mass.
    - Compare that mass with the production target.
    order: [0, 1, 2, 3, 4]
    why: >-
      A ratio cannot be read from an equation that has not been balanced, so that comes first. The
      ratio then compares moles, which means the captured mass has to be divided by molar mass before
      it is used. What comes out is moles of methane, and the schedule is written in kilograms, so
      the second molar mass converts back. Comparing before that final step sets a number of moles
      against a mass target, which is the arithmetic equivalent of comparing distance with time.

  - group: ELEC
    call: Work out what today's captured gas could actually make
    task: Estimate the theoretical mass of methane the captured carbon dioxide could give.
    title: Could today's air make enough methane
    at: log-desk
    reason: If the feed alone can cover the remaining schedule then the intake is cleared and the search moves
    concept: Balanced equations and stoichiometry as an atom ledger
    place: Atmosphere Intake
    scene: >-
      The intake captured 6.60 x 10^3 kilograms of carbon dioxide this shift. The remaining schedule
      needs 2.00 x 10^3 kilograms of methane. Sundqvist has already written an order to overdrive the
      compressors and is waiting on a number before she signs it.
    guide: >-
      Take the captured mass to moles, apply the mole ratio, and take the result back to a mass. The
      board carries both molar masses, the methane ratio and the water ratio; the water ratio belongs
      to the coproduct and not to this calculation. When the answer is out, set it against the two
      thousand kilograms the schedule still needs.
    background:
    - >-
      The carbon dioxide to methane mole ratio here is one to one, which makes this the cleanest
      possible test of whether somebody is working in moles or in kilograms. If the answer comes out
      equal to the feed mass, the ratio was applied to grams.
    - >-
      Theoretical yield is the most the feed could give with nothing lost. It is an upper bound and a
      useful one: a feed that cannot reach the target on paper can be ruled out without a single
      measurement of what the plant actually did.
    assumes:
    - the mole ratio of carbon dioxide to methane in this reaction is one to one
    takeaway: A feed that clears the target on paper is a feed that has been ruled out as the cause.
    format: BALLPARK
    question: Estimate the theoretical mass of methane the captured carbon dioxide could give.
    estimate:
      prompt: The intake captured 6.60 x 10^3 kg of carbon dioxide, and the schedule still needs 2.00 x 10^3 kg of methane.
      question: Estimate the theoretical mass of methane the captured carbon dioxide could give.
      relationship: mass of methane = mass of carbon dioxide / molar mass x the mole ratio x molar mass of methane
      labels:
      - 6.60×10⁶ g  (carbon dioxide captured this shift)
      - 44.01 g/mol  (molar mass of carbon dioxide)
      - 1 mol CH4 per mol CO2  (the mole ratio from the equation)
      - 16.04 g/mol  (molar mass of methane)
      - 2 mol H2O per mol CH4  (the water coproduct ratio)
      values: [6.60e6, 44.01, 1, 16.04, 2]
      slots: 4
      template: '{0} ÷ {1} × {2} × {3}'
      formula: a/b*c*d
      correct: [0, 1, 2, 3]
      target: 2405000
      tolerance: 72000
      units: g of methane
      solution: 6.60×10⁶ g ÷ 44.01 g/mol ≈ 1.50×10⁵ mol, and × 16.04 g/mol ≈ 2.41×10⁶ g, about 2405 kg.
      explanation: The mole ratio is one to one, so the same number of moles comes out — but methane weighs less per mole, so the mass falls.
    why: >-
      6.60 x 10^3 kilograms of carbon dioxide is about 150 kilomoles. The equation gives one mole of
      methane for each of them, so about 150 kilomoles of methane can be made, and methane's smaller
      molar mass turns that into roughly 2405 kilograms. That clears the two thousand the schedule
      needs, so the feed is not the limit. An answer of 6600 kilograms has treated a one-to-one mole
      ratio as a one-to-one mass ratio, and an answer near 150 has stopped at kilomoles.

  - group: KINET
    call: Ask the production lead which feed runs out first
    task: Decide which reactant limits the methane, and how much it can support.
    title: Which feed runs out first
    person: true
    reason: Both feeds are present and one of them is already setting a ceiling nobody has named
    concept: Limiting reactant, theoretical yield and percent yield
    place: Atmosphere Intake
    scene: >-
      The shift has 150 kilomoles of carbon dioxide available to the reactor and 520 kilomoles of
      hydrogen delivered. The equation on the wall wants four hydrogen molecules for every carbon
      dioxide. Sundqvist wants to know which one is holding the plant down.
    guide: >-
      Test each feed separately by pushing it through the balanced equation and asking how much
      methane it alone could support. The smaller of the two answers is the real ceiling, and the
      feed that produced it is the limiting reactant. The coefficient four applies to hydrogen and to
      nothing else on the board. Two of the options ignore it and one denies that a limit exists at
      all.
    background:
    - >-
      A limiting reactant is not the one there is least of by mass, or by volume, or by moles. It is
      the one that predicts the smaller amount of product once the coefficients have been applied.
      Everything left over when it runs out is excess reactant, and it simply sits there.
    - >-
      This matters operationally because the two cases call for opposite actions. If the feed is
      limiting, more feed helps. If the other reactant is limiting, more feed only builds inventory
      and the plant makes exactly as much as it did before.
    assumes:
    - the balanced equation needs four moles of hydrogen for each mole of carbon dioxide
    takeaway: Test both feeds through the equation, and the smaller product figure names the limit.
    format: CHOICE
    question: Which reactant limits the methane, and how much can it support?
    choices:
    - Hydrogen limits, and 520 divided by 4 supports 130 kilomoles of methane.
    - Carbon dioxide limits, and 150 kilomoles of it makes 150 kilomoles of methane.
    - Hydrogen limits, and 520 kilomoles of it makes 520 kilomoles of methane.
    - Neither limits, because both feeds are present in the reactor.
    answer: Hydrogen limits, and 520 divided by 4 supports 130 kilomoles of methane.
    why: >-
      Carbon dioxide alone could support 150 kilomoles of methane, one for one. Hydrogen has to be
      divided by four, so 520 kilomoles supports only 130. The smaller figure wins, which makes
      hydrogen the limiting reactant and leaves 20 kilomoles of carbon dioxide unreacted in the loop.
      That is why the intake overdrive would have bought nothing: the plant would have captured more
      carbon and made exactly the same methane.
    rebuttals:
    - Carbon dioxide would support 150, but hydrogen supports only 130, and the smaller number is the ceiling.
    - The coefficient four is in the equation for a reason. Four hydrogen molecules are consumed for every methane made.
    - A reaction can have both feeds in the vessel and still be held to whichever one runs out first.

  - group: GIBBS
    call: Spend the hydrogen the store will release before the next shift
    task: Allocate 80 kilomoles of the limiting reactant across production, diagnosis and reserve.
    title: Spend the hydrogen you have
    at: compressors
    reason: A diagnostic test costs production, and the store will not release more before the next electrolysis shift
    concept: Limiting reactant, theoretical yield and percent yield
    place: Atmosphere Intake
    scene: >-
      Only 80 kilomoles of hydrogen can be released before the next electrolysis shift. Production, a
      branch tracer test and a protected restart reserve all want some of it. Abiola has already
      ruled that the restart reserve is not available to be spent.
    guide: >-
      Nothing on this board makes hydrogen. Every kilomole spent on learning something is a kilomole
      of methane the plant does not make, so the question is which items answer something you
      actually need answered tonight. Fund the tracer test and a production pass, keep the reserve,
      and watch what the maximum pass and the purge cost you. The panel names anything you cannot
      afford.
    rules: >-
      The plan is graded on the questions it can answer. Every question the board lists is either
      required or optional, the protected reserve is charged against the pool whether you like it or
      not, and an allocation over the pool cannot be committed.
    background:
    - >-
      The reason the tracer costs so much is resolution. A pulse of eight kilomoles is large enough
      for the branch flow meter to separate from noise; a smaller one produces a trace nobody can
      interpret, so the money is spent and no question is answered.
    - >-
      Sixteen kilomoles is what a cold restart of the reactor loop needs. Spending it does not fail
      immediately; it means that if the loop trips overnight the plant is down until the stacks
      refill the store, which is most of a sol.
    assumes:
    - hydrogen spent on a test is hydrogen not turned into methane
    takeaway: A diagnostic spend is worth making when it can change what you do next, and not otherwise.
    format: ALLOCATE
    question: How is the 80 kilomoles of the limiting reactant spent?
    allocate:
      pool: { amount: 80, unit: kmol H2, mode: scalar }
      items:
      - { id: prod, label: Production pass to the reactor, cost: 56,
          note: About 14 kilomoles of methane at the current conversion. }
      - { id: prod-max, label: Maximum production pass to the reactor, cost: 72,
          note: The rated pass. It leaves nothing for anything else. }
      - { id: tracer, label: Tracer and line-volume test on the delivery branch, cost: 8,
          note: Enough of a pulse for the branch meter to resolve. }
      - { id: reserve, label: Reserve held for a safe reactor restart, cost: 16, protected: true,
          note: Command has ruled this is not available to spend. }
      - { id: purge, label: Nitrogen purge and refill of the delivery branch, cost: 12,
          note: "Leaves the branch clean, and destroys tonight's evidence with it." }
      answers:
      - { question: Does the branch test give the meter a pulse it can resolve?, requires: [tracer], required: true }
      - { question: Does this shift still put methane into the tank?, requires: [prod], required: true }
      - { question: Can the loop be restarted if it trips overnight?, requires: [reserve] }
      - { question: Does the plant reach its rated output for the shift?, requires: [prod-max] }
      - { question: Is the branch left clean enough to requalify tomorrow?, requires: [purge] }
      moral: Learning something costs product, and the only defence is that it changes what you do next.
      commit: Commit the allocation
    answerText: >-
      56 kilomoles to the production pass, 8 to the tracer test, and the 16 held for restart — the
      whole pool, with the maximum pass and the purge left unfunded.
    why: >-
      No allocation creates hydrogen, so the real question is what the eight kilomoles of tracer buy.
      They buy a pulse the branch meter can separate from noise, which is the only way to find out
      where the delivery is going. The sixteen kilomoles of reserve are not yours to spend. That
      leaves 56 for production, worth about 14 kilomoles of methane, and the purge is the one item
      that would destroy the evidence you are paying to collect.

# =========================================================== sol 3 — HSTORE ×1
- title: Pressure Does Not Lie
  objective: Separate how much gas is in the store from what that gas actually is.
  briefing: A tank can hold the right pressure and the wrong gas.
  stake: >-
    On the third sol the hydrogen store gauge reads almost normal. Delivery to the reactor is still
    low. Today you decide whether a normal pressure clears the storage system at all.
  takeaway: Total pressure counts particles, and only composition says which particles they are.
  segue: >-
    The branch holds 19.5 atmospheres and only 68 percent hydrogen, so the store cannot be cleared.
    Now a stain near a methane valve is being offered as the leak instead.
  stops:

  - group: EQUIL
    call: Ask the reactor engineer what equal temperature actually guarantees
    task: Decide what two gases at the same temperature must have in common.
    title: Same temperature, different speed
    person: true
    reason: The purge log puts hydrogen and nitrogen in the same line at the same temperature, and somebody has to say what that means
    concept: 'Gas behaviour: kinetic theory, the ideal gas law and partial pressure'
    place: Hydrogen Store
    scene: >-
      The purge log lists hydrogen and nitrogen in the same line at 300 kelvin. A technician has just
      argued that the lighter hydrogen must carry less kinetic energy because each molecule has less
      mass. Tomás Herrera, the reactor and safety engineer, asks the question back.
    guide: >-
      Two quantities are being confused here and the options separate them. Average kinetic energy
      depends on absolute temperature and on nothing else. Speed depends on kinetic energy and on
      mass, because kinetic energy is one half m v squared. So equal temperature fixes the energy and
      leaves the speeds to differ, in the direction mass demands. Work out which way that is before
      reading the options.
    background:
    - >-
      Kinetic molecular theory treats a gas as particles in constant random motion with negligible
      volume and no attractions. Temperature is the measure of their average kinetic energy, which is
      why two gases mixed in one vessel arrive at one temperature and stay there.
    - >-
      Because kinetic energy is one half m v squared, a lighter particle needs a higher speed to hold
      the same energy as a heavier one. Hydrogen has a molar mass of about 2 and nitrogen about 28,
      so hydrogen molecules move considerably faster on average at any shared temperature.
    assumes:
    - kinetic energy is one half times mass times speed squared
    takeaway: One shared quantity is fixed by the thermometer, and mass decides everything else.
    format: CHOICE
    question: Which statement about the hydrogen and the nitrogen is correct?
    choices:
    - They carry the same average kinetic energy, and hydrogen has the greater average speed.
    - Hydrogen carries less kinetic energy and moves at the same average speed as nitrogen.
    - Hydrogen carries more kinetic energy, because it moves faster than nitrogen does.
    - Nitrogen carries more kinetic energy, because each of its molecules is heavier.
    answer: They carry the same average kinetic energy, and hydrogen has the greater average speed.
    why: >-
      Average kinetic energy is set by absolute temperature alone, so at 300 kelvin both gases carry
      the same amount of it. Since that energy is one half m v squared, the lighter molecule has to be
      moving faster to hold it. Hydrogen at a molar mass near 2 therefore runs well ahead of nitrogen
      near 28. Speed and energy are related and not interchangeable, and every wrong option here
      swaps one for the other.
    rebuttals:
    - Equal temperature already fixes the energy as equal, so the first half of this is wrong before the speeds are considered.
    - Faster does not mean more energetic when the masses differ. That is exactly what the mass term does.
    - Heavier at the same temperature means slower, not more energetic. The energy is already equal.

  - group: PHASE
    call: Count the gas in the isolated test volume
    task: Estimate the total moles of gas in the isolated test volume.
    title: How many moles are in the branch
    at: store-scales
    reason: The mass reading is high for pure hydrogen, so the particle count has to be established before anybody argues about identity
    concept: 'Gas behaviour: kinetic theory, the ideal gas law and partial pressure'
    place: Hydrogen Store
    scene: >-
      An isolated test volume holds 500 litres at 20.0 atmospheres and 300 kelvin. The pressure is
      close to what it should be, and the mass on the scales is high for pure hydrogen. Herrera wants
      the particle count first.
    guide: >-
      Rearrange the ideal gas law to give the amount of gas, and put the numbers in with the units
      the gas constant expects: litres, atmospheres and kelvin. The board carries a spare tile that
      belongs to a temperature conversion this calculation does not need. When the answer is out,
      remember what it is a count of, which is every molecule in the vessel regardless of species.
    background:
    - >-
      PV = nRT is a relation between four measurable quantities and one amount. It has no term for
      the identity of the gas, and that is not a limitation to be worked around: it is why a pressure
      gauge on a mixed line cannot tell you anything about composition.
    - >-
      Temperature has to be absolute. Kelvin starts at the point where particle motion stops, so
      ratios of kelvin are ratios of energy. Celsius starts at the freezing point of water, and using
      it puts a large arbitrary offset into a multiplication.
    assumes:
    - the gas constant R is 0.08206 litre atmospheres per mole per kelvin
    takeaway: The ideal gas law counts every particle in the vessel and names none of them.
    format: BALLPARK
    question: Use the ideal gas law to estimate the total moles of gas in the isolated test volume.
    estimate:
      prompt: The isolated volume is 500 L at 20.0 atm and 300 K, and the mass on the scales is high for pure hydrogen.
      question: Use the ideal gas law to estimate the total moles of gas in the isolated test volume.
      relationship: the ideal gas law, n = PV / RT
      labels:
      - 20.0 atm  (P, the branch pressure)
      - 500 L  (V, the isolated volume)
      - 0.08206 L atm per mol per K  (R)
      - 300 K  (T, the branch temperature)
      - 273 K  (the freezing point of water)
      values: [20.0, 500, 0.08206, 300, 273]
      slots: 4
      template: '{0} × {1} ÷ ({2} × {3})'
      formula: a*b/(c*d)
      correct: [0, 1, 2, 3]
      target: 406.2
      tolerance: 8.1
      units: mol of gas
      solution: n = PV/RT = (20.0)(500) / (0.08206 × 300) ≈ 406 mol.
      explanation: Four measured quantities give one amount, and none of them says which gas it is.
    why: >-
      Twenty atmospheres times five hundred litres is ten thousand litre atmospheres, and the gas
      constant times three hundred kelvin is 24.6 litre atmospheres per mole, which leaves about 406
      moles. That number is close to what a full branch of hydrogen should hold, which is the trap:
      the law counts particles and cannot distinguish hydrogen from nitrogen. A high mass at a normal
      pressure means the same count of heavier molecules, and only a composition measurement can say
      so.

  - group: ELEC
    call: Sample the three ports and find where the pattern breaks
    task: Sample every port and name the station where the pattern first breaks.
    title: Sample the branches
    at: sample-ports
    reason: Delivery is low and the gauge is normal, so composition has to be read station by station
    concept: 'Gas behaviour: kinetic theory, the ideal gas law and partial pressure'
    place: Hydrogen Store
    scene: >-
      Four points on the delivery run can be sampled: the tank headspace, the regulator outlet, the
      purge tie-in and the reactor branch. Total pressure looks respectable at all four. The portable
      analyser reports hydrogen mole fraction as well as pressure.
    guide: >-
      Take a reading at every station and compare it with what that station used to read. Two numbers
      arrive at each: a total pressure and a hydrogen mole fraction. The pressures barely move, so
      the fractions are what you are reading. Name the first station where the pattern separates from
      what it should be, not the one where the final number is worst.
    background:
    - >-
      Dalton's law says the total pressure of a mixture is the sum of the pressures each component
      would exert alone. A component's own partial pressure is its mole fraction times the total, so
      a branch at 19.5 atmospheres and 68 percent hydrogen is delivering a hydrogen pressure of about
      13.3 rather than 19.5.
    - >-
      The reactor does not care about total pressure. Its rate and its conversion depend on the
      partial pressures of the two reactants, so a diluted branch starves the reaction while the
      gauge on the wall stays where the operators expect it.
    assumes:
    - a component's partial pressure is its mole fraction times the total pressure
    takeaway: Read the fraction as well as the needle, and find where the two stop agreeing.
    format: PROBE
    question: Which station is the first to break the expected pattern?
    relationship: partial pressure of hydrogen = mole fraction of hydrogen x total pressure
    probe:
      chainLabel: Station
      minReadings: 4
      target: purge-tie
      commit: Name the station
      stations:
      - id: headspace
        label: Tank headspace
        reading: 20.0 atm total, hydrogen 96 percent by mole
        expected: 20.0 atm total, hydrogen 96 percent by mole
        load: Delivering to the regulator
      - id: regulator
        label: Regulator outlet
        reading: 19.7 atm total, hydrogen 95 percent by mole
        expected: 19.8 atm total, hydrogen 95 percent by mole
        load: Delivering to the branch header
      - id: purge-tie
        label: Purge tie-in
        reading: 19.6 atm total, hydrogen 84 percent, nitrogen 15 percent
        expected: 19.6 atm total, hydrogen 95 percent by mole
        load: Carrying the branch flow and a purge connection
      - id: branch
        label: Reactor supply branch
        reading: 19.5 atm total, hydrogen 68 percent, nitrogen 31 percent
        expected: 19.6 atm total, hydrogen 95 percent by mole
        load: Delivering to the reactor inlet
    answerText: >-
      The purge tie-in. Hydrogen falls from 95 to 84 percent across it while the total pressure moves
      by a tenth of an atmosphere, and the reactor branch downstream is worse still at 68 percent.
    why: >-
      The pressures fall by less than half an atmosphere across the whole run, which says the vessels
      and the gauges are honest. The composition is what moves. Hydrogen holds at 95 percent to the
      regulator outlet and then loses eleven points at the tie-in and another sixteen by the reactor
      branch, with nitrogen taking up the difference. Naming the branch because its number is worst
      misses the join where the change begins, and the join is what can be shut.

  - group: GIBBS
    call: Test the simple-leak prediction with the jacket heater
    task: Predict the warmed pressure, run the heater, then measure both readings.
    title: Test the simple-leak prediction
    at: jacket-heater
    reason: A leak makes a prediction about what warming a sealed sample will do, and the prediction can be run tonight
    concept: 'Gas behaviour: kinetic theory, the ideal gas law and partial pressure'
    place: Hydrogen Store
    scene: >-
      A sealed sample of the reactor branch sits at 19.5 atmospheres and 300 kelvin in a fixed
      volume. The jacket heater can take it to 330 kelvin. Herrera wants a written prediction before
      the heater is commanded, and the analyser left running through it.
    guide: >-
      Predict the pressure a sealed fixed-volume sample should reach at 330 kelvin if nothing reacts
      and nothing leaves, then command the heater, then take the measurement. Pressure and absolute
      temperature rise together at fixed volume and fixed amount. The measurement is the part that
      can be skipped, and skipping it is what turns a prediction into an opinion.
    background:
    - >-
      At constant volume and constant amount, PV = nRT reduces to P over T being constant, so the
      new pressure is the old one times the ratio of absolute temperatures. Thirty kelvin on three
      hundred is a ten percent rise, which is large enough to see and small enough to be safe.
    - >-
      What the test is really for is separating two claims. If the branch merely lost gas, its
      pressure response would be normal and its composition would be unchanged from a line that used
      to be 95 percent hydrogen. Two observables, and a leak has to satisfy both.
    assumes:
    - at fixed volume and amount, pressure is proportional to absolute temperature
    takeaway: A model has to survive every relevant measurement, not only the one it gets right.
    format: VERIFY
    question: What pressure should the sealed sample reach at 330 kelvin, and what does the measurement show?
    relationship: P2 = P1 x T2 / T1 at fixed volume and fixed amount
    verify:
      prediction: { label: Pressure of the sealed sample at 330 K, unit: atm, min: 15.0, max: 30.0, step: 0.1 }
      truth: 21.4
      passRatio: [0.95, 1.05]
      intervention:
        label: Command the jacket heater to 330 K
        note: Fixed volume, sealed sample, analyser left running through the run.
        outcome: The sample reaches 330 K and holds there for four minutes.
      measurement:
        label: Read the pressure and the composition after the run
        note: The analyser reports both. One of them is the reason the run was worth doing.
        cost: 6
        costUnit: min
      moral: The gauge and the vessel are honest. The story attached to them was not.
      unmeasuredMoral: A prediction that was never measured against anything has not been tested.
      lock: Lock the prediction
      run: Command the heater
      measure: Take the measurement
      commit: Report the run
    answerText: >-
      About 21.4 atm, and the measurement agrees. But the composition is still 68 percent hydrogen
      and 31 percent nitrogen, which a leak from a 95 percent hydrogen line cannot produce.
    why: >-
      Nineteen and a half atmospheres times 330 over 300 gives 21.45, and the sample reads 21.4. The
      total particle count behaves exactly as a sealed vessel should, so the volume and the gauge are
      credible and the pressure story is closed. Composition is a separate measurement and it is the
      one that matters. A leak removes molecules; it does not put nitrogen downstream of a regulator
      outlet running at 95 percent hydrogen. Something is being added, not lost.

# ============================================================ sol 4 — KINET ×1
- title: What Can Travel Where
  objective: Decide whether the blue residue could have arrived by the route everyone is drawing.
  briefing: Structure first, then behaviour, then the route.
  stake: >-
    A blue stain near a methane valve looks like the leak, and it is only the fourth sol. Nobody has
    asked what the stuff is. Today you decide whether that residue could have travelled the route
    everyone is drawing.
  takeaway: A substance's own properties can rule out a path somebody has proposed for it.
  segue: >-
    The stain is service fluid that could never have made the trip. Two easy stories are gone. Now the
    water plant is 9 percent short and its numbers will not add up either.
  stops:

  - group: PHASE
    call: Ask the cryogenics engineer which methane drawing is valid
    task: Choose the valid Lewis structure for methane.
    title: Choose the methane structure
    person: true
    reason: The separation cartridge needs reference molecules before it can compare anything to the residue
    concept: 'Structure and forces: Lewis structures, shape, polarity and intermolecular attraction'
    place: Catalyst Bay
    scene: >-
      Four drawings of methane are projected over the charge bench. One gives carbon four single
      bonds. The others add a lone pair, a double bond to a hydrogen, or a set of separated ions.
      Mei-Ling Cho, the cryogenics engineer, will not run it until the reference is right.
    guide: >-
      Count electrons rather than looking for the familiar picture. Carbon brings four valence
      electrons and wants a share of eight. Hydrogen brings one and can hold a share of two, which
      means one bond and never two. Then check the charges: in a valid neutral structure every atom's
      formal charge comes out at zero. Three of these fail one of those two tests.
    background:
    - >-
      A Lewis structure is an accounting statement. Every valence electron in the molecule is drawn
      once, either as a bonding pair between two atoms or as a lone pair on one. If the count does
      not come out, the structure is wrong however plausible it looks.
    - >-
      Hydrogen is the strictest atom on the page. It has one valence electron and one orbital
      available, so it forms exactly one bond. A double bond to hydrogen would need four electrons
      round an atom that can hold two, and no arrangement of the molecule fixes that.
    assumes:
    - carbon has four valence electrons and hydrogen has one
    takeaway: A structure is valid when the electron count and the formal charges both come out.
    format: CHOICE
    question: Which Lewis structure for methane is valid?
    choices:
    - A central carbon with four single bonds to hydrogen and no lone pairs on the carbon.
    - A central carbon with three single bonds to hydrogen and one lone pair on the carbon.
    - A carbon with two single bonds to hydrogen and one double bond to a third hydrogen.
    - A carbon carrying four negative charges surrounded by four separate hydrogen ions.
    answer: A central carbon with four single bonds to hydrogen and no lone pairs on the carbon.
    why: >-
      Carbon supplies four valence electrons and each hydrogen supplies one, giving eight electrons
      to place. Four bonding pairs uses all of them, gives carbon a share of eight and each hydrogen
      a share of two, and leaves every formal charge at zero. Three bonds plus a lone pair puts nine
      electrons on the page and a charge on the carbon. A double bond to hydrogen asks it to hold
      four. Separated ions describe a different substance entirely.
    rebuttals:
    - Three bonds and a lone pair is one electron too many and leaves carbon with a formal charge.
    - Hydrogen has one valence electron and one orbital. It forms one bond and cannot form two.
    - Methane is a neutral molecule with shared pairs. Four separate charges is not a description of it.

  - group: KINET
    call: Write out the reasoning chain from electrons to polarity
    task: Order the five inferences that take a molecule from electrons to polarity.
    title: From electrons to polarity
    at: model-rail
    reason: The team jumped straight from a coloured stain to a travel path, and the missing steps have to be visible
    concept: 'Structure and forces: Lewis structures, shape, polarity and intermolecular attraction'
    place: Catalyst Bay
    scene: >-
      Cho has cleared the model rail and laid out five cards. She says the team went from a coloured
      stain to a travel path in one jump. Nothing runs until every inference between the two is
      standing on the rail in order.
    guide: >-
      Order the cards so that each one uses only what the ones before it produced. Electron counting
      comes before shape, because shape is worked out from where the electron groups go. Shape comes
      before any judgement about whether dipoles cancel, because cancelling is a geometric question.
      And a molecule has to be classified as polar or not before its intermolecular forces can be
      named at all.
    background:
    - >-
      A polar bond and a polar molecule are different claims. Carbon dioxide has two strongly polar
      bonds and no overall dipole, because the molecule is linear and the two pull in exactly
      opposite directions. Methane has four weakly polar bonds arranged tetrahedrally, and they
      cancel as well.
    - >-
      Getting the order wrong is not a style error. Beginning with intermolecular forces means
      guessing an answer that depends on the polarity you have not established, and beginning with
      polarity means guessing at a cancellation you cannot see without the geometry.
    assumes:
    - electron groups round a central atom spread as far apart as they can
    takeaway: Shape decides whether bond dipoles cancel, so shape has to be settled first.
    format: SEQUENCE
    cards:
    - Draw a valid Lewis structure for the molecule.
    - Count the electron domains and predict the geometry.
    - Identify the bond dipoles from electronegativity differences.
    - Test whether the bond dipoles cancel in three dimensions.
    - Classify the molecule as polar or nonpolar.
    order: [0, 1, 2, 3, 4]
    why: >-
      Each step consumes what the one before it produced. The Lewis structure says how many electron
      groups surround the central atom; the groups fix the geometry; the geometry is what decides
      whether individual bond dipoles reinforce or cancel. Only then is the molecule polar or not,
      and only then can its dominant intermolecular force be named. Starting at polarity skips the
      geometric test, and starting at intermolecular forces assumes the answer the chain exists to
      produce.

  - group: EQUIL
    call: Fill in a property card for each candidate substance
    task: Match each molecule to its shape, polarity and dominant intermolecular force.
    title: Match shape, polarity and force
    at: model-desk
    reason: Four substances appear in the maintenance and process records and the cartridge run needs a card for each
    concept: 'Structure and forces: Lewis structures, shape, polarity and intermolecular attraction'
    place: Catalyst Bay
    scene: >-
      Four substances turn up in the maintenance and process records for that valve: methane, carbon
      dioxide, water and ammonia. Cho wants one property card for each before the cartridge is loaded.
      The cards are blank on the desk.
    guide: >-
      Work each molecule through the chain on the rail. Count electron domains round the central
      atom, including lone pairs, because a lone pair takes up a domain and bends the molecule.
      Decide whether the bond dipoles cancel. Then name the strongest attraction available between
      whole molecules. Hydrogen bonding needs hydrogen attached to nitrogen, oxygen or fluorine; if
      there is none, dispersion is what is left.
    background:
    - >-
      Methane is tetrahedral and carbon dioxide is linear, and both are symmetric enough that the
      bond dipoles cancel. What remains between their molecules is London dispersion, the weak
      attraction caused by momentary uneven electron distribution, which every substance has.
    - >-
      Water has two bonding domains and two lone pairs, so it is bent rather than linear, and the two
      oxygen-hydrogen dipoles do not cancel. Ammonia has three bonds and one lone pair, giving a
      trigonal pyramid. Both are polar and both have hydrogen on an electronegative atom, so hydrogen
      bonding dominates.
    assumes:
    - a lone pair occupies an electron domain and pushes bonds closer together
    takeaway: Lone pairs bend a molecule, and a bent molecule cannot cancel its own dipoles.
    format: PROTOCOL
    question: Which shape, polarity and dominant force belongs to each molecule?
    columns: [The molecule, Shape, polarity and dominant force]
    scenarios:
    - Methane, CH4
    - Carbon dioxide, CO2
    - Water, H2O
    - Ammonia, NH3
    choices:
    - Tetrahedral, nonpolar overall, London dispersion.
    - Linear, nonpolar overall, London dispersion.
    - Bent, polar, hydrogen bonding.
    - Trigonal pyramidal, polar, hydrogen bonding.
    mapping: [0, 1, 2, 3]
    why: >-
      Methane's four bonding domains give a tetrahedron and its weak dipoles cancel by symmetry.
      Carbon dioxide has two strongly polar bonds pointing in exactly opposite directions, so the
      molecule is linear and has no overall dipole. Water's two lone pairs bend it to about 104
      degrees and its dipoles add. Ammonia's single lone pair leaves a pyramid, also with a net
      dipole. The two polar ones carry hydrogen on an electronegative atom, which is what hydrogen
      bonding requires.
    rebuttals:
    - Carbon dioxide has polar bonds and no molecular dipole. The linear shape is the whole reason.
    - Water is bent, not linear. Two lone-pair domains are what bend it.

  - group: SOIL
    call: Run the separation cartridge across its temperature range
    task: Sweep the cartridge temperature and mark where the water stops being held.
    title: Can the residue ride the gas stream
    at: cartridge
    reason: The proposed route needs the tracer to stay in a dry methane stream through the recorded conditions
    concept: 'Structure and forces: Lewis structures, shape, polarity and intermolecular attraction'
    place: Catalyst Bay
    scene: >-
      The cartridge has a nonpolar coating and a temperature jacket that runs from 220 to 330 kelvin.
      Methane, water and the blue tracer are loaded together. Cho watches the three traces and says
      nothing.
    guide: >-
      Move the jacket temperature across its range and watch all three traces at once. Methane is
      your control. The water trace is the one you are marking: find the temperature where it stops
      being held on the coating and starts coming through. Watch what the blue tracer does over the
      same range, because that is what decides whether the route anybody has drawn is possible.
    background:
    - >-
      A nonpolar coating holds nonpolar things weakly and polar things strongly, which is what makes
      the cartridge a test of polarity rather than of size. Raising the temperature gives molecules
      enough energy to break away, so a substance held by weak forces releases early and one held by
      hydrogen bonding releases late or not at all.
    - >-
      The tracer is a glycol and water service fluid. Both halves of it hydrogen-bond, which is why
      it wets a surface and stays there, and why a dry cold gas line will not carry it a hundred
      metres and set it down neatly at one valve.
    assumes:
    - stronger intermolecular attraction means a substance is harder to drive off a surface
    takeaway: A strongly hydrogen-bonding fluid does not ride a dry nonpolar gas stream.
    format: SWEEP
    question: At what temperature does the water stop being held on the coating?
    sweep:
      mode: peak
      axis: { label: Cartridge jacket temperature, unit: K, min: 220, max: 330, step: 1 }
      readout: { label: Retention, unit: '%' }
      start: 224
      target: 300
      tolerance: 8
      baseline: 0
      commit: Mark it
      series:
      - label: Methane through the cartridge
        unit: '% passed'
        response:
        - { at: 220, value: 96 }
        - { at: 250, value: 97 }
        - { at: 280, value: 98 }
        - { at: 305, value: 99 }
        - { at: 330, value: 99 }
      - label: Water held on the coating
        unit: '% retained'
        response:
        - { at: 220, value: 99 }
        - { at: 250, value: 97 }
        - { at: 280, value: 88 }
        - { at: 295, value: 62 }
        - { at: 302, value: 44 }
        - { at: 312, value: 21 }
        - { at: 330, value: 6 }
      - label: Blue tracer held on the coating
        unit: '% retained'
        response:
        - { at: 220, value: 100 }
        - { at: 250, value: 100 }
        - { at: 280, value: 99 }
        - { at: 305, value: 99 }
        - { at: 330, value: 97 }
    answerText: >-
      Water releases at about 300 kelvin. Methane passes across the whole range, and the blue tracer
      is still 97 percent retained at the top of it — so the residue cannot have ridden a dry methane
      stream and been laid down at one valve.
    why: >-
      Methane passes freely at every temperature, because a nonpolar coating has almost nothing to
      hold it with. Water is held below about 300 kelvin and released above it, which is the
      hydrogen-bond network being broken by heat. The tracer never releases at all across the range,
      and the recorded line conditions were cold and dry. A substance that stays on a surface under
      those conditions is a substance that was put there locally, which is what the maintenance
      record already said.

# ==================================================== sol 5 — SOIL ×3 + CUT ×1
- title: The Water Account
  objective: Find out why the water numbers will not reconcile, and whether the meters are independent.
  briefing: A chloride reading, not curiosity, is what opens the road to the ice cut.
  stake: >-
    The water numbers will not add up on the fifth sol. Three plant channels report the same trouble.
    Today you decide whether three numbers that agree are three pieces of proof.
  takeaway: Channels that share one reference are one piece of evidence repeated.
  segue: >-
    One drifting standard made three displays agree on the same wrong fix. So the dashboard cannot be
    trusted, and every clue from the last four sols now has to fit one story.
  stops:

  - group: SOIL
    call: Ask the analytical lead which bottle holds more chloride
    task: Decide which bottle holds more chloride, and why the alarm label is wrong.
    title: Concentrated is not the same as more
    person: true
    reason: The wall alarm has labelled the stronger bottle as the larger amount and the treatment order follows the label
    concept: 'Solutions: concentration, molarity and absorbance'
    place: Water Plant
    scene: >-
      Two bottles stand on the report desk. Bottle A holds half a litre of 2.0 molar chloride. Bottle
      B holds five litres at 0.30 molar. A wall alarm has labelled A as the larger amount, and
      Achebe has covered the label with her hand.
    guide: >-
      Amount and concentration are different quantities, and only one of them is what a treatment
      order needs. Concentration says how much is dissolved in each litre. Amount is concentration
      multiplied by the volume actually present. Work out both bottles in moles before reading the
      options, and notice which option asks for a molar mass that is not needed here.
    background:
    - >-
      Molarity is moles per litre, so multiplying it by a volume in litres gives moles. That is the
      whole of it: 2.0 mol/L times 0.50 L is 1.0 mol, and 0.30 mol/L times 5.0 L is 1.5 mol.
      Comparing concentrations alone is only fair when the volumes are equal.
    - >-
      Molar mass converts moles to grams. It is needed if the question asks for a mass and it is not
      needed here, because molarity and volume already give the amount in moles. Asking for it is a
      way of avoiding the comparison.
    assumes:
    - molarity is moles of dissolved substance per litre of solution
    takeaway: Concentration compares equal volumes, and amount is what the plant actually has to treat.
    format: CHOICE
    question: Which bottle holds more chloride?
    choices:
    - Bottle B, at 1.5 moles to Bottle A's 1.0 mole.
    - Bottle A, because 2.0 molar is the larger figure on the label.
    - They hold the same amount, because both bottles contain chloride.
    - It cannot be known without the molar mass of the chloride salt.
    answer: Bottle B, at 1.5 moles to Bottle A's 1.0 mole.
    why: >-
      Amount is concentration times volume. Bottle A gives 2.0 moles per litre times 0.50 litres,
      which is 1.0 mole. Bottle B gives 0.30 times 5.0, which is 1.5. The weaker bottle holds half as
      much again, because it holds ten times the volume. Molar mass would be needed to report either
      answer in grams and is not needed to compare moles, and the alarm label compared the two
      numbers that happen to be printed rather than the two quantities that matter.
    rebuttals:
    - 2.0 molar is the larger concentration and A is the smaller bottle. Concentration alone does not settle an amount.
    - Both contain chloride and in different amounts. Being the same substance says nothing about how much.
    - Molarity and volume already give moles. Molar mass is only needed to convert those moles to grams.

  - group: ELEC
    call: Put the recycle sample on a molar scale
    task: Estimate the molarity of the acid in the recycle sample.
    title: Put the sample on a molar scale
    at: assay-desk
    reason: The strip reports acidity as a colour and the process model needs a concentration in moles per litre
    concept: 'Solutions: concentration, molarity and absorbance'
    place: Water Plant
    scene: >-
      A 250.0 millilitre recycle sample carries 0.365 grams of hydrogen chloride. The emergency strip
      has turned and says only that the water is acidic. The process model will not accept a colour.
    guide: >-
      Two conversions and one division. Grams become moles through molar mass. Millilitres become
      litres by dividing by a thousand. Then moles divided by litres is the molarity. The desk has a
      tile carrying the volume in millilitres as well as one carrying it in litres, and only one of
      them belongs in a calculation whose answer is per litre.
    background:
    - >-
      Molarity is defined per litre of solution, so a volume in millilitres has to be converted
      before the division and not after. Dividing by 250 instead of 0.250 gives an answer a thousand
      times too small, which is the commonest single mistake in this arithmetic.
    - >-
      Hydrogen chloride is a strong acid, which in this course means it is treated as fully separated
      into hydrogen ions and chloride ions in water. That is what lets a later pH calculation use
      this concentration directly.
    assumes:
    - a strong acid is treated as fully dissociated in water
    takeaway: Convert the volume before dividing, because molarity is defined per litre.
    format: BALLPARK
    question: Estimate the molarity of the hydrogen chloride in the recycle sample.
    estimate:
      prompt: The 250.0 mL recycle sample carries 0.365 g of hydrogen chloride, and the model wants a molarity.
      question: Estimate the molarity of the hydrogen chloride in the recycle sample.
      relationship: molarity = moles per litre, worked as grams / molar mass / volume in litres
      labels:
      - 0.365 g  (hydrogen chloride in the sample)
      - 36.46 g/mol  (molar mass of hydrogen chloride)
      - 0.2500 L  (the sample volume in litres)
      - 250.0 mL  (the same volume in millilitres)
      values: [0.365, 36.46, 0.2500, 250.0]
      slots: 3
      template: '{0} ÷ {1} ÷ {2}'
      formula: a/b/c
      correct: [0, 1, 2]
      target: 0.0400
      tolerance: 0.0012
      units: mol/L
      solution: 0.365 g ÷ 36.46 g/mol ≈ 0.01001 mol, ÷ 0.2500 L ≈ 0.0400 mol/L.
      explanation: Grams to moles, millilitres to litres, then moles divided by the volume of solution.
    why: >-
      0.365 grams divided by 36.46 grams per mole is about 0.01001 moles. Divided by a quarter of a
      litre that gives 0.0400 moles per litre. An answer near 0.000040 has kept the volume in
      millilitres, and an answer near 1.46 has divided the mass by the volume without ever using
      molar mass, which produces grams per litre and not a molarity at all. The unit on the answer is
      what catches both.

  - group: PHASE
    call: Choose the wavelength the chloride test will be read at
    task: Sweep the wavelength and choose where the test is most sensitive.
    title: Choose the measurement wavelength
    at: spectro
    reason: The wall meter and a sealed standard disagree, and the instrument has to be qualified before it can settle that
    concept: 'Solutions: concentration, molarity and absorbance'
    place: Water Plant
    scene: >-
      The chloride test makes a coloured complex. Achebe has loaded a midrange sealed standard and
      wants the instrument swept across the visible range before the unknown goes anywhere near it.
      The detector saturates above 1.20 absorbance units.
    guide: >-
      Move the wavelength across the range and watch the absorbance of the standard. You are looking
      for the place where absorbance changes most strongly with concentration, which is where the
      absorbing species absorbs most — as long as the detector is not saturated there. Mark that
      wavelength. A place with very little signal has plenty of headroom and compresses real
      differences into instrument noise.
    background:
    - >-
      The Beer-Lambert law says absorbance is the molar absorptivity times the path length times the
      concentration. Molar absorptivity varies with wavelength, so choosing where to read is
      choosing how much absorbance a given change in concentration produces.
    - >-
      Reading a sealed standard before the unknown is what qualifies the instrument. Without it the
      absorbance is a number with no scale attached, and any disagreement with a wall meter cannot be
      assigned to either instrument.
    assumes:
    - absorbance is proportional to concentration at a fixed wavelength and path length
    takeaway: Read where the signal is strong, because that is where a small change is still visible.
    format: SWEEP
    question: Which wavelength gives the chloride test its greatest useful sensitivity?
    relationship: absorbance = molar absorptivity x path length x concentration
    sweep:
      mode: peak
      axis: { label: Wavelength, unit: nm, min: 400, max: 700, step: 2 }
      readout: { label: Absorbance of the sealed standard, unit: A }
      start: 430
      target: 510
      tolerance: 15
      baseline: 0
      commit: Mark the wavelength
      series:
      - label: Absorbance of the sealed standard
        unit: A
        response:
        - { at: 400, value: 0.09 }
        - { at: 440, value: 0.18 }
        - { at: 470, value: 0.44 }
        - { at: 490, value: 0.66 }
        - { at: 512, value: 0.82 }
        - { at: 535, value: 0.69 }
        - { at: 565, value: 0.40 }
        - { at: 600, value: 0.16 }
        - { at: 660, value: 0.05 }
        - { at: 700, value: 0.03 }
    answerText: >-
      About 510 nanometres, where the standard reads 0.82 absorbance units — well clear of the
      detector's saturation and where a small change in concentration moves the reading most.
    why: >-
      Absorbance is proportional to concentration, and the constant of proportionality is largest
      where the coloured complex absorbs most. Reading there means a small change in chloride
      produces a large change in the number, which is exactly what is needed to separate a real
      difference from instrument noise. The peak here sits at 0.82 absorbance units, comfortably
      below the 1.20 where the detector saturates. A wavelength chosen for headroom instead of
      sensitivity would hide the disagreement the run exists to find.

  - group: GIBBS
    call: Drive out to the cut and trace what the three alarms depend on
    task: Open every dependency and decide whether the three alarming channels are independent.
    title: Trace the agreement
    at: rover-sampler
    reason: The rover sample and the field blank came back clean, and three plant channels still disagree with them
    concept: 'Evidence independence: agreement is not confirmation'
    place: The Ice Cut
    scene: >-
      Denis Moreau, the rover operator, has brought back a clean source sample and a clean
      field blank. The wall chloride
      meter, the recycle estimator and the control-room water correction all still say otherwise.
      Achebe has the dependency view open on the rover console.
    guide: >-
      Open every channel and read what it is built on. Some are direct measurements and some are
      worked out from other channels, and the ones that are worked out inherit whatever went into
      them. Name the reference the alarming channels have in common, then keep the channels that
      could still have failed separately. Agreement between three displays that share one reference
      is one result printed three times.
    background:
    - >-
      A derived channel cannot confirm its own input. If the recycle estimator is computed from the
      wall meter, then the estimator agreeing with the wall meter is arithmetic rather than evidence,
      and the control-room correction computed from the estimator is the same arithmetic again.
    - >-
      Breaking a dependency chain takes a new sample, a new volume measurement and a different
      reference. That is what the trip out to the cut bought: a bottle that never went near the
      plant standard, read against a sealed one.
    assumes:
    - a number worked out from another number carries that number's error
    takeaway: Agreement is evidence only when the channels could have disagreed for separate reasons.
    format: TRACE
    question: Which readiness claims here are independently supported?
    trace:
      target: plant-c
      commit: Correct it
      resources:
      - { id: plant-c, label: Plant Standard C }
      - { id: std-a, label: Standard A }
      - { id: field-vol, label: A field volume measured on the rover }
      channels:
      - id: wall-meter
        label: Wall chloride meter
        reading: Chloride at 41 mg per litre in the recycle stream
        depends: [plant-c]
      - id: recycle-est
        label: Recycle estimator
        reading: Recycled water 9 percent below the Sabatier prediction
        depends: [plant-c]
      - id: room-correction
        label: Control-room water correction
        reading: A plant-wide water correction of minus 6 percent
        depends: [plant-c]
      - id: portable-spec
        label: Portable spectrophotometer
        reading: Chloride at 12 mg per litre in the same recycle stream
        depends: [std-a]
      - id: field-blank
        label: Field blank from the cut face
        reading: Chloride under 2 mg per litre in the blank
        depends: [std-a, field-vol]
      independent: [portable-spec, field-blank]
      correction:
        what: The chloride reference the wall meter is set against
        was: 41 mg per litre of chloride in the recycle stream
        now: 12 mg per litre against a sealed reference
        corrected: The plant-wide water correction, which falls from minus 6 percent to under minus 1
        effect: Three displays move together because one reference moved
    answerText: >-
      None of the three alarming channels is independent — all of them inherit Plant Standard C. The
      portable instrument and the field blank are the only claims that could have failed separately,
      and neither reproduces the alarm.
    why: >-
      The wall meter is set against Plant Standard C, the recycle estimator is computed from the wall
      meter, and the control-room correction is computed from the estimator. One drifting reference
      therefore appears three times, and the three panels agreeing is that reference agreeing with
      itself. The portable instrument and the field blank came through a different reference and a
      separately measured volume, which is why they can contradict all three. Counting displays is
      not counting evidence.

# ================================================= sol 6 — GIBBS ×2 + TANKS ×2
- title: The Leak That Was Not
  objective: Find the one cause that fits every panel, and test whether uncertainty rescues the leak.
  briefing: Every earlier clue is on the board and every one of them is true.
  stake: >-
    The sixth sol brings the first full plant review. The dashboard still says methane was made and
    then lost. Today you decide which single cause fits the quiet readings as well as the alarms.
  takeaway: The best diagnosis explains the quiet readings too, and survives reasonable error.
  segue: >-
    There is no big methane leak. The methane was never made, because thin hydrogen reached the
    reactor. But the first drop in delivery follows a manual heat override signed by one of the crew.
  stops:

  - group: EQUIL
    call: Find the single cause that fits every panel on the review board
    task: Choose the one explanation that fits every reading on the board.
    title: One cause that fits every panel
    at: review-board
    reason: Five sols of clues are on one wall for the first time and command wants a single mechanism
    concept: 'Evidence independence: agreement is not confirmation'
    place: Plant Control
    scene: >-
      Every panel in the plant is printed side by side on the review board. Abiola has ruled that
      nobody leaves until one mechanism is named. Sundqvist and Herrera are standing at opposite ends
      of it and neither has spoken for a minute.
    guide: >-
      Read every zone, including the ones showing nothing wrong. A candidate explanation fails the
      moment one reading contradicts it, and the quiet readings are usually where that happens. Ask
      of each option what it predicts the carbon ledger, the water coproduct and the branch
      composition should look like, then compare that with what is actually printed.
    background:
    - >-
      A large methane leak predicts a large hole in the carbon ledger, because methane carries carbon
      out of the plant with it. The ledger closed to two tenths of one percent, which is a very
      different number from eighteen.
    - >-
      Hydrogen delivered short predicts everything on the board at once. Less hydrogen reaching the
      reactor means less methane and less coproduct water; the carbon that never reacted stays in the
      loop as carbon dioxide, so the ledger closes; and the nitrogen that displaced the hydrogen
      keeps the total pressure respectable.
    assumes:
    - a diagnosis has to be consistent with every relevant reading
    takeaway: An explanation that predicts the quiet readings is worth more than one that fits the alarm.
    format: DIAGNOSIS
    headline: Every panel in the plant is on one wall, and one of these four has to explain all of it.
    task: Which explanation fits every reading, including the ones that independently rule a cause out?
    readings:
    - { zone: Carbon ledger, label: Carbon accounted for, value: 99.8 of 100.0 kmol, status: normal, note: rules out a large carbon loss }
    - { zone: Atmosphere intake, label: Theoretical methane from today's feed, value: 2405 kg, status: normal }
    - { zone: Hydrogen branch, label: Hydrogen at the reactor inlet, value: 68 percent by mole, status: alarm }
    - { zone: Hydrogen branch, label: Total pressure, value: 19.5 atm, status: normal, note: another gas is holding it up }
    - { zone: Cold end, label: Coproduct water collected, value: 61 percent of prediction, status: alarm }
    - { zone: Tank farm, label: Methane fraction against the production estimate, value: 12 points low, status: alarm }
    - { zone: Catalyst bay, label: Blue residue at the suspect valve, value: local service fluid, status: normal }
    choices:
    - label: A large methane leak downstream of the reactor
      mechanism: Methane was made and then escaped from the product side.
    - label: Not enough carbon dioxide captured from the atmosphere
      mechanism: The intake cannot supply the carbon the schedule needs.
    - label: Hydrogen delivery running short before the reactor
      mechanism: Nitrogen has displaced hydrogen in the branch, so the reaction is starved of one feed.
    - label: A dead methane sensor on the product line
      mechanism: The methane exists and the instrument is not reporting it.
    answer: Hydrogen delivery running short before the reactor
    why: >-
      Nitrogen dilution lowers the hydrogen partial pressure at the inlet, which makes hydrogen the
      limiting reactant. Less hydrogen reacting means less methane and less coproduct water, both of
      which the board shows. The carbon that never reacted is still in the loop as carbon dioxide, so
      the ledger closes. A large leak predicts a carbon hole the ledger does not have. Insufficient
      feed contradicts the intake figure. A dead sensor explains neither the low water nor the branch
      composition.

  - group: GIBBS
    call: Ask the commander whether calibration error can rescue the leak
    task: Stress the carbon calibration across its range and see which diagnosis survives.
    title: Does uncertainty rescue the leak
    person: true
    reason: The carbon closure was measured against a standard that has just been shown to drift
    concept: 'Testing a model: held-out data, residual structure and stress'
    place: Plant Control
    scene: >-
      Sundqvist asks whether the two tenths of a percent closure is an artefact of the compromised
      standard. An independent flow check bounds the carbon-intake error, and Abiola wants the
      candidates re-read across the whole of it before anybody is cleared.
    guide: >-
      Move the assumption slider through everything the intake calibration could plausibly be wrong
      by, and watch which explanations stay viable at the pessimistic end. A conclusion that only
      holds at the best-case number is not a conclusion. Note which candidate looks cheapest to act
      on at the nominal value, because that is the one the room will want.
    rules: >-
      Each candidate needs a carbon residual at least as large as the figure beside it to remain
      viable. The slider sets how large a residual the ledger could really be hiding. A candidate
      survives only if it is viable across the whole range, not at the nominal value.
    background:
    - >-
      Sensitivity analysis asks one question: does the answer change anywhere inside the range the
      inputs could really take? If it does not, the uncertainty is real and irrelevant. If it does,
      the decision needs a better measurement before it is taken.
    - >-
      Uncertainty is not ignorance. A two percent calibration error moves the carbon residual by
      about two percent of intake, which is a long way from the eighteen percent a leak large enough
      to explain the schedule would have to hide.
    assumes:
    - a conclusion should hold across the whole range an input could take
    takeaway: Uncertainty should weaken a claim in proportion to its size, not erase every claim.
    format: STRESS
    question: Which diagnosis stays viable across the whole calibration range?
    stress:
      robust: h2
      optimiseOn: work
      commit: Commit the diagnosis
      assumption:
        label: Carbon residual the ledger could really be hiding
        unit: '% of intake'
        min: 0.2
        max: 4.2
        nominal: 0.2
        step: 0.2
      candidates:
      - { id: leak, label: A large methane leak downstream }
      - { id: feed, label: Not enough carbon dioxide captured }
      - { id: h2, label: Hydrogen delivery short before the reactor }
      - { id: sensor, label: A dead methane sensor on the product line }
      criteria:
      - { key: work, label: Sols of work before it can be acted on, unit: sols }
      - { key: unexplained, label: Panels it leaves unexplained, unit: of 7 }
      - { key: cost, label: Production lost if acted on and wrong, unit: kg }
      scores:
        leak: { work: 1, unexplained: 4, cost: 900, residual: 12 }
        feed: { work: 2, unexplained: 3, cost: 600, residual: 6 }
        h2: { work: 3, unexplained: 0, cost: 120, residual: 0 }
        sensor: { work: 1, unexplained: 5, cost: 300, residual: 5 }
      feasible:
        leak: 12
        feed: 6
        h2: 0
        sensor: 5
      moral: The cheapest thing to act on is not the same as the thing the evidence supports.
    answerText: >-
      Hydrogen delivery short before the reactor. It is the only candidate still viable at the
      pessimistic end of the range, and even a four percent residual is nowhere near the eighteen a
      large leak would need.
    why: >-
      Each of the other three needs the carbon ledger to be hiding several percent of the intake, and
      the independent flow check will not allow that much however the standard drifted. Hydrogen
      running short needs no hidden carbon at all, because the carbon is still in the loop. The leak
      story is the fastest to act on and that is exactly the trap: sealing valves costs a sol of
      production and does not touch the cause. Robust means the answer does not move when the
      assumption does.

  - group: KINET
    call: Close a hydrogen ledger on the reactor interval
    task: Close the hydrogen atom ledger and report the total the interval accounts for.
    title: Close hydrogen over the interval
    at: farm-gauges
    reason: The diagnosis predicts what the tank samples should hold and the prediction has to be checked at the tanks
    concept: Balanced equations and stoichiometry as an atom ledger
    place: Tank Farm
    scene: >-
      For one normalised interval the reactor received 322 moles of hydrogen. It formed 80 moles of
      methane and 160 of water, and 20 moles of carbon dioxide came back unreacted. Abiola wants the
      hydrogen counted as atoms.
    guide: >-
      Count hydrogen atoms rather than molecules. Each mole of hydrogen gas carries two, each mole of
      methane carries four, and each mole of water carries two. Add the streams that hold hydrogen,
      report the total, and see how much of the 644 atoms is still unassigned. The unreacted carbon
      dioxide belongs on the panel and not in this sum.
    background:
    - >-
      An atom ledger explains a low product without any matter being lost. Eighty moles of methane
      and 160 of water together hold 640 moles of hydrogen atoms, which is what 320 moles of hydrogen
      gas supplies — so the reaction consumed almost everything it was given and simply was not given
      enough.
    - >-
      This is the arithmetic that makes hydrogen the limit rather than a suspicion. The equation needs
      four moles of hydrogen for every mole of methane, so 322 moles of hydrogen cannot support more
      than about 80 moles of methane whatever else is available.
    assumes:
    - the subscript in a formula counts atoms of that element per molecule
    takeaway: A low product with a closed atom ledger means the feed was short, not that matter went missing.
    format: BALANCE
    question: Close the hydrogen ledger. How many moles of hydrogen atoms does the interval account for?
    relationship: hydrogen atoms accounted for = 4 x moles of methane + 2 x moles of water + 2 x moles of unreacted hydrogen
    balance:
      total: { amount: 644, unit: mol H atoms, label: Hydrogen atoms into the reactor as 322 mol of H2 }
      tolerance: 1
      streams:
      - { id: in-methane, label: Hydrogen atoms in the 80 mol of methane formed, value: 320, unit: mol H }
      - { id: in-water, label: Hydrogen atoms in the 160 mol of water formed, value: 320, unit: mol H }
      - { id: co2, label: Unreacted carbon dioxide returned to the loop, value: 0, countable: false, unit: mol H,
          unitNote: Carbon dioxide holds carbon and oxygen and no hydrogen at all. }
      - { id: vented, label: Hydrogen leaving through the sample and purge line, value: 4, hidden: true, unit: mol H }
      commit: Report the total hydrogen
    answerText: >-
      644 moles of hydrogen atoms, once the 4 leaving through the sample and purge line are counted.
      640 of them are in the methane and the water, which is almost everything the reactor was given.
    why: >-
      Eighty moles of methane hold 320 moles of hydrogen atoms and 160 moles of water hold another
      320, which is 640 of the 644 supplied. The remaining four atoms are two moles of hydrogen gas
      leaving through the sample line. Nothing is missing. The reaction used what it was given, and
      what it was given was short, which is why the methane figure is low while the carbon ledger
      closes. Carbon dioxide holds no hydrogen and does not enter this sum.

  - group: ELEC
    call: Rebuild the case at the transfer umbilical
    task: Match each earlier clue to what it actually meant.
    title: Rebuild the case
    at: umbilical
    reason: Five sols of clues are all still true and every one of them has the wrong story attached
    concept: 'Evidence independence: agreement is not confirmation'
    place: Tank Farm
    scene: >-
      Abiola has the five earliest clues written out on the walkway rail beside the umbilical.
      Sundqvist has already conceded the carbon. Nobody has yet said out loud what each observation
      was really telling them.
    guide: >-
      Each clue on the left was a real observation and none of them was wrong. What was wrong is the
      story attached to it. Take them one at a time and ask what the hydrogen-delivery mechanism
      predicts that observation should look like. Four of the five follow directly from it; the
      fifth is about how the plant came to believe the wrong thing rather than about the plant itself.
    background:
    - >-
      A fair reversal keeps every earlier observation true and changes what it means. The carbon
      ledger really did close, the pressure really was normal, the residue really was there, the
      water really was low and the three meters really did agree. All five are consistent with one
      mechanism nobody had proposed.
    - >-
      This is also why the leak search cost a sol. The team had five facts and five separate stories,
      and a set of separate stories is much harder to falsify than one mechanism that has to predict
      all five.
    assumes:
    - a real observation can support more than one explanation
    takeaway: Every clue stayed true, and only the story attached to it changed.
    format: CASEBOOK
    question: What did each observation actually mean?
    columns: [The observation, What it actually meant]
    scenarios:
    - The carbon ledger closed to within 0.2 percent.
    - Tank and branch pressures stayed nearly normal.
    - A blue residue sat near a methane valve.
    - The coproduct water came in well below prediction.
    - Three plant meters agreed on the same correction.
    choices:
    - The carbon stayed in the process, mostly as carbon dioxide that never reacted.
    - Other gases were holding the total pressure up while hydrogen fell.
    - Local service fluid from a valve job, not residue carried by a gas stream.
    - Too little hydrogen reacted, so too little coproduct water was formed.
    - One shared reference, not three independent confirmations.
    mapping: [0, 1, 2, 3, 4]
    why: >-
      Every one of these follows from hydrogen arriving short. Unreacted carbon dioxide keeps the
      carbon in the plant and closes the ledger. Nitrogen holds the pressure up while hydrogen's own
      partial pressure falls. Less hydrogen reacting makes less water as well as less methane, in the
      two-to-one ratio the equation gives. The residue and the agreeing meters are the two clues that
      were never about the reaction at all: one was a maintenance artefact and the other was a
      calibration chain.

# ================================================= sol 7 — EQUIL ×3 + PHASE ×1
- title: Heat
  objective: Reconstruct the heat flow before anybody decides whether to restore the old set point.
  briefing: Trace the heat before anyone argues about why.
  stake: >-
    On the seventh sol the reactor set point was found lowered, hours before output fell. The
    signature on the change belongs to a member of the crew. Today you decide where the heat actually
    went.
  takeaway: An energy ledger says where heat went, and its timing says which event came first.
  segue: >-
    The override is real. So is the 2.7 megajoules the radiator never removed. Now the question is
    whether the change caused the collapse or stopped something worse.
  stops:

  - group: KINET
    call: Ask the production lead what the negative enthalpy actually means
    task: Decide what a negative enthalpy change means for the reactor loop.
    title: Which way does the heat flow
    person: true
    reason: The cooling flow rises whenever methane production rises and nobody has said out loud why
    concept: 'Energy: enthalpy, calorimetry and phase change'
    place: Reactor Hall
    scene: >-
      The equation painted on the hall wall ends with a minus sign: 165 kilojoules per mole of
      methane. Sundqvist points at the coolant flow trace, which rises every time production rises,
      and asks what that sign is telling the crew.
    guide: >-
      The options disagree about three separate things: the direction the heat travels, what the
      catalyst does to it, and whether enthalpy says anything about speed. Take them one at a time. A
      negative enthalpy change means the products sit at lower enthalpy than the reactants, and the
      difference has to go somewhere. Ask where, and then ask what would have to be true for each
      option to hold.
    background:
    - >-
      Enthalpy change is the heat taken in or given out at constant pressure. Negative means the
      reaction gives heat out, so the surroundings warm up and something has to carry that heat away.
      In a continuously running loop that something is the coolant, which is why its flow tracks
      production.
    - >-
      A catalyst lowers the activation energy — the hill the reaction has to climb — and does not
      change the enthalpy of the reactants or the products. Enthalpy is a difference between two
      states and says nothing at all about how quickly the reaction gets from one to the other.
    assumes:
    - enthalpy change is the heat given out or taken in at constant pressure
    takeaway: A negative enthalpy change means heat has to leave, and leaving is somebody's job.
    format: CHOICE
    question: What does the negative enthalpy change tell the crew?
    choices:
    - The reaction is exothermic, and 165 kilojoules has to leave for every mole of methane made.
    - The reaction is endothermic, and 165 kilojoules has to be supplied for every mole of methane.
    - The catalyst consumes 165 kilojoules for every mole of methane that crosses it.
    - The sign describes how fast the reaction runs rather than any quantity of heat.
    answer: The reaction is exothermic, and 165 kilojoules has to leave for every mole of methane made.
    why: >-
      A negative enthalpy change means the products hold less enthalpy than the reactants, and the
      difference appears as heat given out to the surroundings. Running the reaction faster therefore
      produces heat faster, which is exactly what the coolant trace shows. A catalyst changes the
      activation energy and leaves the enthalpy difference untouched, because enthalpy depends only
      on the initial and final states. And a sign on an enthalpy carries no information about rate at
      all.
    rebuttals:
    - Endothermic is the positive case. A negative sign is heat leaving rather than heat needed.
    - A catalyst changes the path and not the endpoints. The enthalpy difference is the same with it or without it.
    - Enthalpy compares two states. How long the reaction takes to cross between them is a separate question.

  - group: EQUIL
    call: Size the heat the coolant carried away
    task: Estimate the heat the coolant carried away over the interval.
    title: Size the coolant load
    at: heat-bench
    reason: The energy ledger cannot be closed until the one removal path that is measured is quantified
    concept: 'Energy: enthalpy, calorimetry and phase change'
    place: Reactor Hall
    scene: >-
      Five hundred kilograms of coolant passed the loop during the diagnostic interval and came back
      six kelvin warmer. Its specific heat is on the bench card. Herrera wants a number before
      anybody argues about the radiator.
    guide: >-
      Multiply the mass that was warmed, the energy needed per kilogram per kelvin, and the
      temperature change. The bench carries the coolant return temperature as well as the rise, and
      only one of those belongs in the calculation: the equation asks what the temperature changed
      by, not what it ended at. Report the answer in kilojoules, because the specific heat is given
      in kilojoules.
    background:
    - >-
      q equals m c delta T works because specific heat is defined as the energy needed to raise one
      kilogram by one kelvin. Multiply it by the kilograms present and by the kelvin of change, and
      the units leave kilojoules behind.
    - >-
      Signs depend on which system is being named. The coolant gained this heat, so for the coolant q
      is positive. The reactor side lost approximately the same amount, so for the reactor it is
      negative. Both statements describe one transfer, and saying which system you mean is part of
      giving the answer.
    assumes:
    - specific heat is the energy needed to raise one kilogram by one kelvin
    takeaway: Use the temperature change, not the final temperature, and name the system the sign belongs to.
    format: BALLPARK
    question: Estimate the heat the coolant carried away over the interval.
    estimate:
      prompt: 500 kg of coolant passed the loop in the interval and came back 6.0 K warmer.
      question: Estimate the heat the coolant carried away over the interval.
      relationship: q = m c delta T, using the specific heat and the temperature rise
      labels:
      - 500 kg  (coolant through the loop)
      - 3.80 kJ per kg per K  (specific heat of the coolant)
      - 6.0 K  (the temperature rise across the loop)
      - 291 K  (the coolant return temperature)
      values: [500, 3.80, 6.0, 291]
      slots: 3
      template: '{0} × {1} × {2}'
      formula: a*b*c
      correct: [0, 1, 2]
      target: 11400
      tolerance: 228
      units: kJ
      solution: q = m c delta T = 500 kg × 3.80 kJ/kg/K × 6.0 K = 11,400 kJ, or 11.4 MJ.
      explanation: Mass, energy per kilogram per kelvin, and the change in temperature — not the temperature reached.
    why: >-
      Five hundred kilograms times 3.80 kilojoules per kilogram per kelvin times six kelvin is 11,400
      kilojoules, which is 11.4 megajoules. Using the return temperature of 291 kelvin instead of the
      six-kelvin rise gives more than half a gigajoule, which is fifty times too large and would make
      the radiator look healthy. The positive number describes heat gained by the coolant; the
      reactor side lost about the same, and which sign you quote depends on which system you say you
      mean.

  - group: SOIL
    call: Order the energy steps for the water slug in the return line
    task: Order the four steps the water slug's energy goes through.
    title: Follow energy through temperature and phase
    at: heat-model-board
    reason: The heat model has to predict when the warm pulse reaches the cold end and the phase change is loose
    concept: 'Energy: enthalpy, calorimetry and phase change'
    place: Reactor Hall
    scene: >-
      A slug of water in the return line starts as ice below its melting point and arrives as warm
      liquid. Cho has four cards on the heat-model board and one complaint: the model is treating the
      whole journey as a single temperature rise.
    guide: >-
      Order the cards so that the energy is accounted for in the order the water actually experiences
      it. Two of these steps change the temperature and one does not, and the one that does not is
      where a model built on temperature alone goes wrong. Start by settling which phase the slug
      begins and ends in, because that is what decides how many steps there are.
    background:
    - >-
      On a heating curve the sloped sections are temperature changes within one phase, worked with
      the specific heat of that phase. The flat sections are phase changes, worked with the heat of
      fusion or vaporisation, and the temperature does not move while they happen.
    - >-
      Treating the plateau as a temperature rise invents a temperature change that does not occur and
      shortens the predicted delay. That is exactly the error here: the warm pulse arrives at the cold
      end later than the model says, because a large amount of energy went into melting rather than
      into warming.
    assumes:
    - energy goes into breaking intermolecular attractions during a phase change
    takeaway: A phase change absorbs energy while the temperature stands still, and a model must allow for it.
    format: SEQUENCE
    cards:
    - Identify the phase the slug starts in and the phase it ends in.
    - Warm the solid ice up to its melting point.
    - Melt the ice at constant temperature using the heat of fusion.
    - Warm the liquid water up to the return temperature.
    order: [0, 1, 2, 3]
    why: >-
      The phases at each end decide how many steps there are, so that comes first. Ice below its
      melting point has to be warmed to that point before it can melt; melting happens at constant
      temperature and takes a large amount of energy; and only then can the liquid be warmed the rest
      of the way. Each step uses a different constant, and merging them into one temperature rise
      removes the plateau and makes the predicted delay far too short.

  - group: PHASE
    call: Close the reactor and radiator energy ledger
    task: Close the energy ledger and report the heat the interval accounts for.
    title: Close the energy ledger
    at: phase-radiator
    reason: Coolant return temperature has been climbing for nine sols and nobody has counted the heat that did not leave
    concept: 'Energy: enthalpy, calorimetry and phase change'
    place: Cold End
    scene: >-
      During one interval the reaction released 16.5 megajoules. The coolant carried some away, the
      metal of the bed stored some, and the product gas took a little out with it. Cho has the
      radiator panel open beside the figures.
    guide: >-
      Energy that is generated has to be removed, carried out, stored, or left behind somewhere.
      Three of those paths are measured and on the panel. Add them, report the total, and see what
      the difference from 16.5 megajoules is. Do not put the released heat and the coolant's gain on
      the same side of the ledger — they are the same transfer counted twice.
    background:
    - >-
      A heat balance is the first law written for one interval. Whatever is not carried away by a
      measured path is still in the plant, warming metal, warming gas, or accumulating where the
      removal is weakest. The unaccounted term is not destroyed and it does not announce itself.
    - >-
      What makes this ledger matter is the timing. The radiator's capacity has been falling for nine
      sols, which means the unremoved term has been growing for nine sols. The set point was lowered
      after that started, which reduces the heat generated rather than improving the removal.
    assumes:
    - energy is conserved over an interval, so what is not removed is still present
    takeaway: The term that closes an energy ledger is heat still in the plant, and it has a place.
    format: BALANCE
    question: Close the energy ledger. How much of the released heat can be accounted for?
    relationship: heat unaccounted = heat released - coolant removal - stored in metal - carried out in product gas
    balance:
      total: { amount: 16.5, unit: MJ, label: Heat released by the reaction in the interval }
      tolerance: 0.1
      streams:
      - { id: coolant, label: Carried away by the coolant loop, value: 11.4, unit: MJ }
      - { id: metal, label: Stored in the metal of the bed and its shell, value: 1.6, unit: MJ }
      - { id: gas, label: Carried out of the hall in the product gas, value: 0.8, unit: MJ }
      - { id: setpoint, label: Set point lowered by 20 K on sol 6, value: 0, countable: false, unit: MJ,
          unitNote: A set point is an instruction. It is not a quantity of heat. }
      - { id: accumulated, label: Left in the structure around the bed inlet, value: 2.7, hidden: true, unit: MJ }
      commit: Report the total heat
    answerText: >-
      16.5 megajoules, once the 2.7 that stayed in the structure round the bed inlet is counted. Only
      13.8 of it left the plant by a measured path.
    why: >-
      11.4 plus 1.6 plus 0.8 is 13.8 megajoules, and the reaction released 16.5, so 2.7 megajoules
      went somewhere none of the measured paths reaches. Energy is not destroyed, so it is still in
      the plant: warming the structure where the removal is weakest, which is the inlet end. The
      radiator loss began before the set point was touched, and lowering the set point reduces the
      heat generated rather than restoring the capacity to remove it.

# ================================================= sol 8 — GIBBS ×3 + EQUIL ×1
- title: The Override
  objective: Establish what the override did and who made it, without assuming why.
  briefing: Access is not action, and action is not motive.
  stake: >-
    By the eighth sol the timing looks damning and proves nothing. A change came first and a drop came
    after. Today you decide what the rate data and the records can really establish.
  takeaway: Verification needs separate evidence for identity, for timing and for physical condition.
  segue: >-
    The change is proved, and the rate drop with it. Still nobody can say the change was needless, and
    a bed average of one number is hiding something.
  stops:

  - group: KINET
    call: Read the rate law out of the three trials
    task: Decide which rate law fits the three initial-rate trials.
    title: Read the initial-rate table
    at: bed-log
    reason: A prediction of what the lowered temperature should have done to the rate needs the rate law first
    concept: 'Kinetics: rate laws and the rate constant'
    place: Plant Control
    scene: >-
      Three historical trials are printed in the bed log. Trial 1 sits at 0.10 molar carbon dioxide
      and 0.20 molar hydrogen. Trial 2 doubles the carbon dioxide and Trial 3 doubles the hydrogen,
      each with the other held fixed.
    guide: >-
      Compare the trials in pairs where only one concentration moved. Doubling a concentration and
      watching what the rate does gives the exponent directly: twice the rate is first order, four
      times is second order, no change is zero order. Do that for each reactant in turn. One of the
      options has copied the coefficients off the balanced equation instead, which is a different
      thing entirely.
    background:
    - >-
      A rate law has the form rate equals k times each concentration raised to some power. The powers
      are called orders and they come from experiment. They are only equal to the balanced equation's
      coefficients when the reaction happens in a single step, which a surface-catalysed reaction
      never does.
    - >-
      Trial 1 to Trial 2 doubles carbon dioxide at fixed hydrogen and the rate doubles, so the order
      in carbon dioxide is one. Trial 1 to Trial 3 doubles hydrogen at fixed carbon dioxide and the
      rate quadruples, so the order in hydrogen is two. The overall order is three.
    assumes:
    - a reaction order is found by changing one concentration with the others held fixed
    takeaway: Orders come out of the data, and the balanced equation is not consulted for them.
    format: CHOICE
    question: Which rate law fits the three trials?
    choices:
    - rate = k times carbon dioxide, times hydrogen squared.
    - rate = k times carbon dioxide squared, times hydrogen.
    - rate = k times carbon dioxide, times hydrogen.
    - rate = k times carbon dioxide squared, times hydrogen to the fourth.
    answer: rate = k times carbon dioxide, times hydrogen squared.
    why: >-
      From Trial 1 to Trial 2 the carbon dioxide doubles and the hydrogen is held, and the rate goes
      from 1.20 to 2.40 thousandths of a mole per litre per second — exactly double, so the order is
      one. From Trial 1 to Trial 3 the hydrogen doubles and the rate goes to 4.80 thousandths, four
      times, so the order is two. Overall order three. The last option is the balanced equation's
      coefficients written as powers, which is the one thing a rate law is not.
    rebuttals:
    - This has the two orders the wrong way round. Doubling carbon dioxide doubled the rate; doubling hydrogen quadrupled it.
    - First order in both would mean doubling hydrogen doubles the rate. It quadrupled it.
    - These are the coefficients from the balanced equation. Orders come from the trials, not from the equation.

  - group: EQUIL
    call: Calculate the rate constant from the first trial
    task: Estimate the rate constant from the first trial.
    title: Calculate the rate constant
    at: rate-table
    reason: The reversal test needs a predicted rate to compare against and the constant is what produces one
    concept: 'Kinetics: rate laws and the rate constant'
    place: Plant Control
    scene: >-
      The rate law is settled and Trial 1's numbers are still on the table: a rate of 1.20 thousandths
      of a mole per litre per second at 0.10 molar carbon dioxide and 0.20 molar hydrogen. Herrera
      wants the constant and its units.
    guide: >-
      Rearrange the rate law so the constant is on its own, then substitute the first trial. The
      table carries the hydrogen concentration and its square as separate tiles; only one of those
      belongs in a law that is second order in hydrogen. When the number comes out, work out its
      units from the division, because the units are what say whether the order was right.
    background:
    - >-
      The rate constant collects everything the rate law does not: the temperature, the catalyst, the
      geometry of the bed. It is constant only at a fixed temperature, which is why lowering the set
      point changes the rate without changing the orders.
    - >-
      Units follow from the arithmetic. Rate is in moles per litre per second and the concentration
      product here is in moles cubed per litre cubed, so the constant comes out in litres squared per
      mole squared per second. A constant quoted in per seconds belongs to a first-order law.
    assumes:
    - the rate constant is fixed at a given temperature
    takeaway: The units of a rate constant follow from the overall order and check it.
    format: BALLPARK
    question: Estimate the rate constant from the first trial.
    estimate:
      prompt: Trial 1 ran at 0.10 M carbon dioxide and 0.20 M hydrogen and gave 1.20 thousandths of a mole per litre per second.
      question: Estimate the rate constant from the first trial.
      relationship: from the rate law, k = rate / (carbon dioxide x hydrogen squared)
      labels:
      - 1.20×10⁻³ mol/L/s  (the rate in trial 1)
      - 0.10 mol/L  (carbon dioxide in trial 1)
      - 0.040 mol²/L²  (hydrogen squared in trial 1)
      - 0.20 mol/L  (hydrogen in trial 1)
      values: [1.20e-3, 0.10, 0.040, 0.20]
      slots: 3
      template: '{0} ÷ ({1} × {2})'
      formula: a/(b*c)
      correct: [0, 1, 2]
      target: 0.300
      tolerance: 0.006
      units: L² mol⁻² s⁻¹
      solution: k = 1.20×10⁻³ ÷ (0.10 × 0.040) = 0.300 L² mol⁻² s⁻¹.
      explanation: The concentration product is 0.0040 in moles cubed per litre cubed, and dividing a rate by it leaves the third-order units.
    why: >-
      The concentration product is 0.10 times 0.040, which is 0.0040 in moles cubed per litre cubed.
      Dividing 1.20 thousandths of a mole per litre per second by that gives 0.300, and the units
      that survive the division are litres squared per mole squared per second — the signature of an
      overall third-order law. Substituting Trial 2 or Trial 3 at the same temperature reproduces the
      same constant, which is the check that the orders were read correctly.

  - group: PHASE
    call: Run a controlled reversal on the reactor skid
    task: Change one setting, read the rate, then put it back.
    title: Establish causation by reversal
    at: skid
    reason: A change followed by a drop is a sequence, and only a reversal separates that from drift
    concept: 'Kinetics: rate laws and the rate constant'
    place: Reactor Hall
    scene: >-
      Amaka Okafor, the reactor operator, can hold feed, pressure and flow steady while one
      setting moves. The
      baseline is the old 560 kelvin. Herrera has been kept away from the controls and is watching
      from the walkway with his hands behind his back.
    guide: >-
      Change exactly one thing, take a short rate reading, then restore it and read again. Everything
      else on the skid is held for you. Choosing a variable that alters how much reactant reaches the
      bed confounds the question, because then two things moved. The restoration is not a courtesy:
      without it a fall could be the reactor slowly drifting rather than your change.
    background:
    - >-
      A controlled experiment changes one factor, holds the rest, and reverses the change. The
      reversal is what rules out drift, ageing and any slow trend that happened to be running while
      you were measuring. A one-way change and a fall is the same evidence the accusation already has.
    - >-
      What this test can and cannot show is worth being precise about. It can show that the lower set
      point reduces the rate. It cannot show that lowering it was unnecessary, because a short test
      does not recreate the thermal condition the reactor was in at the time.
    assumes:
    - one factor is changed while the others are held fixed
    takeaway: A reversal is what separates your change from a trend that was already running.
    format: CONTROL
    question: Which single controlled change shows that the override cut the initial rate?
    control:
      truth: temperature
      observable: { label: Rate index, unit: '' }
      baseline: 100
      response: -28
      noise: 2
      changeVerb: Lower
      held: [Feed concentrations, Loop pressure, Recycle flow]
      variables:
      - { id: temperature, label: Bed temperature set point }
      - { id: feed, label: Feed concentration at the inlet }
      - { id: recycle, label: Recycle ratio round the loop }
      - { id: pressure, label: Loop pressure }
      moral: The change did cut the rate. That is not the same as the change being unnecessary.
      run: Run the measurement
      commit: Name it
    answerText: >-
      Lower the bed temperature alone, watch the rate index fall from 100 to about 72, then restore
      560 kelvin and watch it come back. The set point caused the rate loss.
    why: >-
      Holding feed, pressure and flow fixed leaves temperature as the only thing that moved, so the
      fall in rate belongs to it. Restoring the set point and watching the rate return rules out
      drift: a trend would not reverse on command. What the test establishes is that the override cut
      the rate, and nothing more. The short run never reproduces the thermal condition of the sol in
      question, so it cannot say whether cutting the rate was the wrong thing to do.

  - group: GIBBS
    call: Ask the commander to spend three verifications on the override
    task: Spend three verifications and close the list of claims.
    title: Verify who changed it
    person: true
    reason: Command has suspended an engineer's access on a claim nobody has yet checked against an independent record
    concept: 'Evidence independence: agreement is not confirmation'
    place: Plant Control
    scene: >-
      Six claims about the override are on the board and Abiola will authorise three verifications.
      One of them is already backed by a record that was reconciled this sol. Herrera's access is
      suspended while the list is open.
    guide: >-
      A claim you verify is one you can stand behind; a claim you close unchecked is one you have
      taken on trust. You have three checks for six claims, so decide which unbacked claims actually
      carry the finding. Identity, timing and physical condition are three different things, and a
      record of one is not evidence of another. One claim on the board needs no check at all.
    rules: >-
      Three verifications are allowed. Any claim you do not verify is closed on the signature it
      carries. A critical claim closed unverified is what the panel grades you on.
    background:
    - >-
      A badge log records that somebody was near a door. A controller audit records that a specific
      user identity issued a specific instruction at a specific time. A temperature historian records
      what the metal was actually doing. Those are three different claims and no one of them implies
      another.
    - >-
      A handwritten note and a colleague's recollection are both real information and neither is
      independent of the person who produced it. Spending scarce verification on them buys corroboration
      of a story rather than a second, separate route to the same fact.
    assumes:
    - a record of access is not a record of a physical condition
    takeaway: Identity, timing and condition need separate records, and one record cannot cover all three.
    format: ATTEST
    question: Which claims about the override are backed by an independent record?
    attest:
      checks: 3
      commit: Close the list
      claims:
      - id: audit
        label: The set point was moved from 560 K to 540 K by a named user at 03:14
        signedBy: Controller audit
        evidence: A cryptographic user identity and a timestamp held on the controller, not editable from the hall
        critical: true
      - id: historian
        label: The bed inlet was above 610 K for eleven minutes before the change
        signedBy: Temperature historian
        evidence: An independent recorder on its own clock, showing the inlet trace either side of the change
        critical: true
      - id: pressure
        label: Loop pressure was steady across the whole of the change
        signedBy: Loop logger
        evidence: The pressure trace, already reconciled against the flow meter earlier this sol
        critical: true
        backed: true
      - id: badge
        label: Herrera was inside the reactor hall four minutes before the change
        signedBy: Badge reader
        evidence: The badge log at the hall door, which records a person and a time and nothing about the controls
      - id: note
        label: The jacket valve was throttled during the same shift
        signedBy: Tanaka
        evidence: A handwritten maintenance note, with no second record of the valve position
      - id: memory
        label: Herrera said the bed was running hot that shift
        signedBy: Okafor
        evidence: A recollection, consistent with the trace and not independent of it
      moral: Presence, several times over, is still only presence.
    answerText: >-
      Verify the controller audit and the temperature historian, and spend the third check on the
      badge log if you want the person placed. The note and the recollection cannot be stood behind,
      and the loop pressure is already backed.
    why: >-
      The controller audit is the only record that ties an identity to an instruction and a time, and
      the temperature historian is the only one that says what the metal was doing while it happened.
      Together they establish the action and the condition it was taken in. The badge log adds
      presence, which is weaker but independent. The note and the recollection both come from a
      single person and corroborate a story rather than measuring anything, and the loop pressure was
      reconciled this morning.

# ================================================= sol 9 — KINET ×3 + ASSAY ×1
- title: The Catalyst Bed
  objective: Read the bed along its length instead of on average, and name the immediate failure.
  briefing: A correct answer here still leaves a safety question open.
  stake: >-
    The bed average looks safe on the ninth sol. One end of it may not be. Today you decide what the
    bed is doing along its length, not on average.
  takeaway: A spatial pattern separates inlet-first poisoning from wear spread evenly through a bed.
  segue: >-
    The inlet end of the bed is poisoned, and the sample proves it. But the inlet also reached 612
    kelvin before anyone touched the set point, and that is not explained.
  stops:

  - group: KINET
    call: Ask the production lead what a fresh charge would actually change
    task: Decide what changes when a fresh catalyst replaces a spent one.
    title: What a catalyst can and cannot change
    person: true
    reason: A fresh charge is being proposed as the fix and nobody has said what it would and would not move
    concept: 'Catalysts, mechanisms and the rate-determining step'
    place: Catalyst Bay
    scene: >-
      The last spare charge is still in its can on the bench. Sundqvist wants it in the bed tonight
      and Herrera wants to know what she expects it to do. Temperature, pressure and feed would all
      be left exactly as they are.
    guide: >-
      Separate two questions the options mix together. How fast a reaction reaches its balance is a
      kinetic question, and where that balance sits is a thermodynamic one. A catalyst lowers the
      energy barrier, which changes the first and not the second. Then check the last option: a
      lower barrier in one direction is a lower barrier in the other, because it is the same hill.
    background:
    - >-
      A catalyst provides an alternative path with a lower activation energy. Both the forward and
      the reverse reaction use that path, so both speed up by the same factor, and the ratio they
      settle at is untouched. That ratio is the equilibrium constant.
    - >-
      The equilibrium constant and the enthalpy change are properties of the reactants and products,
      not of the route between them. Nothing you put in the vessel to speed the journey alters where
      the journey ends, which is why a new charge buys time and not yield.
    assumes:
    - activation energy is the barrier a reaction has to get over
    takeaway: A catalyst changes how fast the balance is reached and not where the balance is.
    format: CHOICE
    question: What does a fresh catalyst change, at the same temperature, pressure and feed?
    choices:
    - The same equilibrium composition is reached sooner, over a lower energy barrier.
    - The equilibrium constant rises, so more methane exists in the mixture at balance.
    - The enthalpy change becomes more negative, so more heat is given out per mole.
    - Only the forward reaction speeds up, so the mixture is pushed towards the products.
    answer: The same equilibrium composition is reached sooner, over a lower energy barrier.
    why: >-
      A catalyst offers a lower-energy path, and both directions of the reaction use it, so both
      speed up and the ratio they settle at does not move. The equilibrium constant and the enthalpy
      change belong to the reactants and products rather than to the route, so neither is touched. A
      fresh charge is therefore worth having when the plant is short of time and worth nothing when
      the plant is short of yield, which is the distinction this whole argument turns on.
    rebuttals:
    - The equilibrium constant depends on temperature and on nothing you add to the vessel.
    - Enthalpy change is a difference between two states. A faster route between them does not change it.
    - The same lower barrier serves the reverse reaction too. Speeding one direction only is not something a catalyst can do.

  - group: EQUIL
    call: Assemble the surface mechanism from the bed log cards
    task: Order the four steps of the surface mechanism and name the intermediate.
    title: Build the surface mechanism
    at: bed-log
    reason: Knowing how the reaction uses a site is what makes a blocked site a testable explanation
    concept: 'Catalysts, mechanisms and the rate-determining step'
    place: Catalyst Bay
    scene: >-
      Four cards from the bed log lie on the mechanism rail: gases arriving on the nickel, surface
      species forming, products leaving, and free sites reappearing. Herrera wants them in order
      before anybody talks about poisoning.
    guide: >-
      Order the cards as a cycle that can run again and again. Nothing can leave the surface before
      it has been made on the surface, and no site can be freed before whatever occupied it has gone.
      As you place them, notice which species appears in one step and is consumed in a later one, and
      which species is consumed and then comes back. Those two roles have different names.
    background:
    - >-
      An intermediate is formed in one elementary step and used up in a later one, so it appears in
      neither the reactants nor the products of the overall reaction. A catalyst is consumed in an
      early step and regenerated in a later one, which is why it too is absent from the net equation
      and why a small amount of it can process a great deal of gas.
    - >-
      The slowest elementary step sets the observed rate, because the whole cycle can only turn as
      fast as its slowest part. Here that is the surface conversion, which is why anything that
      reduces the number of free sites reduces the rate in direct proportion.
    assumes:
    - an elementary step is a single molecular event
    takeaway: The catalyst comes back and the intermediate does not, and the slow step sets the pace.
    format: SEQUENCE
    cards:
    - Carbon dioxide and hydrogen adsorb onto free nickel sites.
    - Surface intermediates form in the slow conversion step.
    - Methane and water desorb from the surface.
    - The free nickel sites are regenerated and the cycle repeats.
    order: [0, 1, 2, 3]
    why: >-
      Molecules have to arrive on the surface before anything can happen to them, so adsorption is
      first. The conversion on the surface makes the intermediates, and it is the slow step, so it
      sets the rate the analyser sees. Products cannot leave before they have been formed, so
      desorption follows. Only once they have gone are the sites free again. The nickel is the
      catalyst because it is used and returned; the surface species are intermediates because they
      are made and then consumed.

  - group: PHASE
    call: Sample the bed from inlet to outlet
    task: Sample every port along the bed and name where the profile first breaks.
    title: Sample the bed from inlet to outlet
    at: bed
    reason: An average outlet reading has been standing in for a bed that is fifty kelvin hotter at one end
    concept: 'Catalysts, mechanisms and the rate-determining step'
    place: Catalyst Bay
    scene: >-
      Four sample ports run down the side of the bed from the inlet to the outlet. Each gives a
      temperature, a cumulative conversion and a halide signal. A clean bed should peak below 590
      kelvin and climb smoothly to about 70 percent conversion.
    guide: >-
      Read every port and compare each with what a clean bed of this charge should give. Three numbers
      arrive at each: temperature, cumulative conversion and halide. Find the first port where the
      profile separates from the clean one — not the port where the final conversion is worst, which
      is simply where the whole bed's shortfall has accumulated by.
    background:
    - >-
      A contaminant carried in the feed meets the inlet first, so it is adsorbed there first and the
      activity is lost from the front backwards. That is a spatial signature: inlet damaged, outlet
      comparatively intact.
    - >-
      The exothermic reaction adds a second signature at the same end. The front of the bed is where
      most of the reaction happens, so it is where most of the heat appears, and it is furthest from
      the coolant return. If heat removal weakens, the inlet is the first place to run hot, and an
      outlet average will not show it.
    assumes:
    - feed contaminant reaches the front of a bed before the back
    takeaway: An average hides the end of the bed, and the end of the bed is where the story is.
    format: PROBE
    question: At which port does the catalyst profile first break?
    probe:
      chainLabel: Port
      minReadings: 4
      target: inlet
      commit: Name the port
      stations:
      - id: inlet
        label: Inlet, 0 m
        reading: 612 K, conversion 18 percent, halide signal high
        expected: 588 K, conversion 20 percent, halide absent
        load: Taking the whole feed flow
      - id: upper
        label: Upper bed, 0.4 m
        reading: 598 K, cumulative conversion 34 percent, halide signal medium
        expected: 586 K, cumulative conversion 40 percent, halide absent
        load: Taking the whole feed flow
      - id: middle
        label: Mid bed, 0.8 m
        reading: 585 K, cumulative conversion 48 percent, halide signal low
        expected: 582 K, cumulative conversion 56 percent, halide absent
        load: Taking the whole feed flow
      - id: outlet
        label: Outlet, 1.2 m
        reading: 563 K, cumulative conversion 55 percent, halide absent
        expected: 576 K, cumulative conversion 70 percent, halide absent
        load: Taking the whole feed flow
    answerText: >-
      The inlet. It is 24 kelvin hotter than a clean bed, its local conversion is below what a fresh
      front should give, and it carries the strongest halide signal of the four.
    why: >-
      The inlet is hot and under-converting at the same time, which is the combination that matters.
      The halide falls away down the bed, so whatever it is arrived with the feed and was taken up at
      the front. And the front is also where the heat appears and where removal is weakest, so a
      degraded radiator shows up there first. The outlet has the worst cumulative number because a
      cumulative number carries every earlier shortfall with it, and it says nothing about where the
      trouble began.

  - group: SOIL
    call: Take the withdrawn sample to the assay lab and diagnose the bed
    task: Choose the explanation that fits the bed sample and the profile together.
    title: Diagnose the immediate bed failure
    at: spec-bench
    reason: A charge is about to be spent and the reason the last one died has not been established
    concept: 'Catalysts, mechanisms and the rate-determining step'
    place: Assay Lab
    scene: >-
      The withdrawn inlet sample is on the specification bench. Achebe has run its surface area and
      its surface composition against a fresh sample from the same batch. The loop was held at
      controlled conditions throughout the probe.
    guide: >-
      Read every zone, including the ones that say nothing is wrong. Two of the options describe
      uniform damage and two describe an operating shortfall, and the profile you just took rules on
      both. Ask what each option predicts the fresh-sample surface area, the local activities and the
      halide distribution should look like, then compare. One reading on the panel is not explained
      by the answer, and it is the one that carries into tomorrow.
    background:
    - >-
      Poisoning blocks active sites with something that sticks to them. Activity falls in proportion
      to the sites lost, the surface area of the material itself is unchanged, and the loss is
      concentrated wherever the contaminant arrived first.
    - >-
      Thermal sintering is the other classic failure and it looks completely different. Heat makes
      the metal crystallites grow together, which destroys surface area everywhere the bed was hot,
      and a fresh sample from the same batch would show the reduced area directly.
    assumes:
    - a poisoned site is occupied rather than destroyed
    takeaway: Poisoning takes sites away where the contaminant arrived, and sintering takes area away everywhere.
    format: DIAGNOSIS
    headline: The inlet sample is on the bench and the loop was held at controlled conditions all through the probe.
    task: What is the immediate cause of the lost activity?
    readings:
    - { zone: Inlet sample, label: Halide on the nickel surface, value: present and heavy, status: alarm }
    - { zone: Inlet sample, label: Surface area against a fresh sample, value: within 3 percent, status: normal, note: rules out crystallite growth }
    - { zone: Bed profile, label: Local activity at the inlet, value: 40 percent below clean, status: alarm }
    - { zone: Bed profile, label: Local activity at the outlet, value: 12 percent below clean, status: high }
    - { zone: Bed profile, label: Inlet to outlet temperature gradient, value: 49 K, status: alarm, note: not explained by a blocked site }
    - { zone: Loop, label: Pressure through the probe, value: 12.0 bar and steady, status: normal }
    - { zone: Loop, label: Hydrogen in the feed through the probe, value: 95 percent by mole, status: normal, note: the branch was corrected for the test }
    choices:
    - label: Halide poisoning concentrated at the inlet end
      mechanism: Something carried in the feed has taken up active sites from the front of the bed backwards.
    - label: Thermal sintering through the whole charge
      mechanism: Heat has grown the metal crystallites together and destroyed surface area everywhere.
    - label: Too little hydrogen reaching the bed during the probe
      mechanism: The reaction was starved of one feed while the readings were taken.
    - label: Loop pressure too low for the equilibrium to favour methane
      mechanism: The balance itself has moved against the product.
    answer: Halide poisoning concentrated at the inlet end
    why: >-
      The surface composition shows halide on the nickel and the surface area is intact, which is
      poisoning rather than sintering: sites occupied, not material destroyed. The activity loss falls
      away from inlet to outlet, exactly as a feed-borne contaminant would deposit. Hydrogen and
      pressure were both held normal through the probe, so neither can be the cause of readings taken
      during it. What the answer does not explain is the 49 kelvin gradient, and that is tomorrow's
      question rather than a loose end.

# ================================================= sol 10 — EQUIL ×3 + GIBBS ×1
- title: The Saboteur
  objective: Test the accusation on records it never saw, and reconstruct what was known and when.
  briefing: A model that fits what built it has proved nothing yet.
  stake: >-
    On the tenth sol every visible number fits the claim that one engineer wrecked production. Records
    were held back from the fitting screen. Today you decide whether that claim survives data it has
    never seen.
  takeaway: Structure in the errors and a failed holdout both mean a model is missing physics.
  segue: >-
    The claim fails on the three records it never saw. So the override was a safety act. But the safe
    setting is 320 kilograms slower, and the tank must still be full by dawn.
  stops:

  - group: EQUIL
    call: Freeze the production model and score it on the withheld intervals
    task: Freeze the model on the calibration intervals and report its honest score.
    title: Freeze the accusation and reveal the holdout
    at: analyser
    reason: The claim was fitted on eight quiet intervals and three intervals were kept off the screen
    concept: 'Testing a model: held-out data, residual structure and stress'
    place: Reactor Hall
    scene: >-
      The analyser has eight normal intervals on its fitting screen and three more the audit kept
      back. The model allows itself to ignore some of the spread between the bed inlet and the outlet
      average. Herrera is off the controls and cannot touch any of it.
    guide: >-
      Move the allowance and watch how well the model does on the intervals it was built from. Then
      freeze it and see the same allowance scored on the three intervals it has never seen. You
      report the second number, not the first. Refitting after the held-out data appears is refused,
      because then there is no held-out data left and the test has been spent.
    background:
    - >-
      All eight fitting intervals ran with healthy heat removal, so the inlet and the outlet average
      never separated by much, and a model that ignores the spread does very well on them. That is
      what overfitting looks like from the inside: the neglected variable was not varying.
    - >-
      The three withheld intervals are the ones where radiator capacity had already fallen. In those,
      the inlet reached 618 kelvin while the outlet average sat at 569, so the spread is the whole
      story and a model that ignores it predicts safe operation in the one regime where it was not
      safe.
    assumes:
    - a model can fit the data it was built from without predicting anything new
    takeaway: The honest number is the one from data the model has never seen.
    format: HOLDOUT
    question: What does the frozen model score on the three withheld intervals?
    holdout:
      axis: { label: Inlet-to-average spread the model is allowed to ignore, unit: K, min: 0, max: 60, step: 1 }
      fitLabel: The eight intervals on the fitting screen
      testLabel: The three intervals the audit withheld
      unit: '% of methane rate explained'
      fitNote: Every one of these ran with healthy heat removal, so the inlet and the average stayed close.
      testNote: Radiator capacity had already fallen in these, and the inlet ran far above the average.
      pass: 86
      start: 42
      freeze: Freeze the allowance
      commit: Report the honest score
      afterFreeze: The three withheld intervals are scored against the allowance you froze.
      fit:
      - { at: 0, value: 74 }
      - { at: 10, value: 82 }
      - { at: 20, value: 88 }
      - { at: 30, value: 93 }
      - { at: 42, value: 97 }
      - { at: 48, value: 99 }
      - { at: 54, value: 96 }
      - { at: 60, value: 88 }
      test:
      - { at: 0, value: 78 }
      - { at: 10, value: 91 }
      - { at: 20, value: 84 }
      - { at: 30, value: 72 }
      - { at: 42, value: 58 }
      - { at: 48, value: 49 }
      - { at: 54, value: 44 }
      - { at: 60, value: 38 }
    answerText: >-
      About 91 percent, and only if the allowance is held near 10 kelvin. Chasing the fitting screen
      out to 48 kelvin scores 99 there and under 50 on the withheld intervals, where the reactor was
      actually in danger.
    why: >-
      The eight fitting intervals all ran with healthy cooling, so the spread between inlet and
      average never mattered in them and a model that ignores it looks excellent. The three withheld
      intervals are the degraded-cooling ones, where the inlet reached 618 kelvin against an average
      of 569. A model tuned to ignore the spread predicts safe operation in exactly the regime that
      was unsafe. The honest allowance is a small one, and it scores worse on the screen and far
      better on reality.

  - group: PHASE
    call: Read the residual field and refuse the lower average error
    task: Choose the fit whose residual field can be defended for safety.
    title: Refuse the lowest average error
    at: residual-field
    reason: One model has the better average error and the argument turns on where it is wrong
    concept: 'Testing a model: held-out data, residual structure and stress'
    place: Reactor Hall
    scene: >-
      Two candidate fits are laid out on the residual field, one dot per interval across the plant
      plan. One has the better root-mean-square error. Cho has the low-radiator intervals ringed in
      pencil on both.
    guide: >-
      Read the residual field rather than the summary number. A residual is what the model missed:
      observed minus predicted. Random scatter means the model has the physics and the noise is
      noise. A block of large errors all pointing the same way means something real is missing, and
      where that block sits tells you which regime the model cannot be trusted in.
    background:
    - >-
      A root-mean-square error is an average over every interval, so a model can buy a good one by
      being excellent in the many ordinary cases and badly wrong in the few that matter. The average
      does not know that some intervals are near a safety limit and some are not.
    - >-
      Model A under-predicts by twelve to fifteen kelvin in every low-radiator interval, and always
      in the same direction. Systematic error in one direction is a missing term, not scatter, and
      here the missing term is the spatial heat-removal behaviour of the bed inlet.
    assumes:
    - a residual is the observed value minus the predicted one
    takeaway: A block of errors all pointing one way is missing physics, whatever the average says.
    format: RESIDUAL
    question: Which fit can be defended for a safety decision?
    residual:
      accept: modelB
      commit: Accept this fit
      moral: A lower average error bought by being wrong where it counts is not a better model.
      fits:
      - id: modelA
        label: Model A — outlet average only
        rms: 2.1
        structured: true
        residuals:
        - { x: 1, y: 1, value: 1.2 }
        - { x: 2, y: 1, value: -0.8 }
        - { x: 3, y: 1, value: 0.4 }
        - { x: 4, y: 2, value: -1.1 }
        - { x: 5, y: 2, value: 0.9 }
        - { x: 6, y: 2, value: -0.6 }
        - { x: 7, y: 3, value: 12.0 }
        - { x: 8, y: 3, value: 15.0 }
        - { x: 9, y: 3, value: 14.0 }
      - id: modelB
        label: Model B — inlet spread included
        rms: 2.8
        residuals:
        - { x: 1, y: 1, value: -3.1 }
        - { x: 2, y: 1, value: 2.6 }
        - { x: 3, y: 1, value: -1.4 }
        - { x: 4, y: 2, value: 3.9 }
        - { x: 5, y: 2, value: -2.2 }
        - { x: 6, y: 2, value: 1.1 }
        - { x: 7, y: 3, value: -3.6 }
        - { x: 8, y: 3, value: 2.9 }
        - { x: 9, y: 3, value: -1.8 }
    answerText: >-
      Model B. Its average error is worse and its residuals are scattered between minus four and plus
      four with no pattern, while Model A under-predicts by twelve to fifteen kelvin in every single
      low-radiator interval.
    why: >-
      Model A's better root-mean-square error is an average over intervals that are mostly ordinary.
      Its last three residuals are all large and all positive, which means it consistently
      under-predicts the temperature in the one regime where a safety limit is nearby. That is a
      missing term, and the missing term is the spatial behaviour of heat removal at the inlet.
      Model B is slightly less precise everywhere and has no structure left over, which is what makes
      it usable for a decision about a limit.

  - group: KINET
    call: Ask the production lead whether restoring the old point survives sensor error
    task: Stress the thermocouple bias and choose the operating point that survives it.
    title: Stress the hidden temperature error
    person: true
    reason: The old point sits eight kelvin under the limit on a reading nobody has checked for bias
    concept: 'Testing a model: held-out data, residual structure and stress'
    place: Reactor Hall
    scene: >-
      Sundqvist has a restoration request half written at the reactor console. The old point's
      observed inlet peak was 612 kelvin against a 620 limit. The inlet thermocouple has never been
      checked against a second sensor.
    guide: >-
      The slider sets how high an inlet peak a plan is allowed to reach on the reading you have, once
      you allow for the reading possibly being low. Slide it down through everything the bias could
      plausibly be and watch which plans stay inside. Then look at what surviving costs, because the
      plan that clears the whole range is not the plan that looks best at the nominal setting.
    rules: >-
      Each plan needs the allowed peak to be at least as high as the figure beside it. The slider sets
      the allowance. A plan survives only if it stays inside across the whole range, not at the
      nominal value.
    background:
    - >-
      Eight kelvin of headroom sounds like margin until the sensor producing it has an unknown bias.
      If the thermocouple reads two percent low, a displayed 612 is really about 624, which is already
      over the limit. At five percent low it is about 644.
    - >-
      Margin is what makes an operating point safe, not a central estimate that happens to sit under
      a boundary. The validated lower point peaks near 575 on the same instrument, which stays under
      620 across the whole plausible bias range.
    assumes:
    - a sensor reading can carry a bias in one direction
    takeaway: A setting is safe when the whole uncertainty range stays the right side of the limit.
    format: STRESS
    question: Which operating point survives the whole plausible sensor bias?
    stress:
      robust: low
      optimiseOn: shortfall
      commit: Commit the operating point
      assumption:
        label: Highest displayed inlet peak a plan may reach, once sensor bias is allowed for
        unit: K
        min: 580
        max: 645
        nominal: 620
        step: 5
      candidates:
      - { id: old, label: Restore the old 560 K set point }
      - { id: mid, label: A 550 K point with the recycle flow raised }
      - { id: low, label: The validated 540 K point }
      criteria:
      - { key: shortfall, label: Methane behind schedule at dawn, unit: kg }
      - { key: peak, label: Observed inlet peak, unit: K }
      - { key: margin, label: Margin under the limit as displayed, unit: K }
      scores:
        old: { shortfall: 0, peak: 612, margin: 8 }
        mid: { shortfall: 180, peak: 589, margin: 31 }
        low: { shortfall: 320, peak: 575, margin: 45 }
      feasible:
        old: 644
        mid: 601
        low: 575
      moral: The plan that looks best at the nominal number is the one the range destroys.
    answerText: >-
      The validated 540 kelvin point. It is the only one still inside the limit at the pessimistic end
      of the bias range, and it costs about 320 kilograms of methane by dawn to hold.
    why: >-
      The old point's eight kelvin of headroom disappears at two percent of sensor bias and becomes a
      24 kelvin exceedance at five. The raised-recycle point survives most of the range and not all
      of it. Only the validated point stays under the limit across the whole of it. It is also the
      worst of the three on the number everybody in the room is watching, which is why the slider is
      necessary: at the nominal reading the unsafe plan is the attractive one.

  - group: GIBBS
    call: Reconstruct what the engineer knew and when
    task: Match each event to the part it played.
    title: What did he know and when
    at: review-board
    reason: An engineer's access is still suspended and the sequence has never been laid out in order
    concept: 'Evidence independence: agreement is not confirmation'
    place: Plant Control
    scene: >-
      Abiola has five events written on the review board in the order they happened: a radiator loss,
      a rising inlet reading, an override, an interlock opening and a production collapse. Nobody has
      yet said what each one was.
    guide: >-
      Take the events in the order they occurred and ask what part each played in the sequence. One is
      the cause of the shrinking heat removal. One is the evidence that was there and unread. One is
      the act everybody has been arguing about. One is what that act protected. And one is what it
      cost. The order on the board is the order they happened, and it is the reason the reading changes.
    background:
    - >-
      The timing is the whole reversal. Radiator capacity fell first, the inlet reading rose after
      that, and the override came after both. An act that follows a degrading safety condition and
      relieves it is a response, whatever it did to the output figures.
    - >-
      What is not excused is the silence. An incomplete thermal record held back because command might
      overreact is a record command could not act on, and three sols of suspicion followed from it.
      Both findings stand at once.
    assumes:
    - the order events happened in constrains which of them caused which
    takeaway: The same act reads as sabotage or as protection depending on what came before it.
    format: CASEBOOK
    question: What part did each event play?
    columns: [The event, The part it played]
    scenarios:
    - Radiator capacity fell over nine sols.
    - The inlet reading rose while the outlet average stayed normal.
    - The reactor set point was lowered by 20 kelvin.
    - The hydrogen purge interlock opened.
    - Methane production collapsed over the following sols.
    choices:
    - The cause of the shrinking heat removal.
    - Hot-spot evidence that was recorded and never read.
    - A deliberate intervention to bring the heat generated back inside what could be removed.
    - The protective consequence the intervention triggered.
    - The cost of the intervention, and evidence that it worked.
    mapping: [0, 1, 2, 3, 4]
    why: >-
      Read in order, the five events are one mechanism. Removal capacity fell, so the heat generated
      had nowhere to go, so the inlet ran hot while the average stayed respectable. The override cut
      the heat generated, which is the only lever the reactor had left, and the interlock that opened
      is what the plant does when a branch goes out of limits. The collapse is real and it is the
      price of the intervention rather than the crime. Withholding the record is a separate and
      smaller finding.

# ==================================== sol 11 — EQUIL ×2 + PHASE ×1 + GIBBS ×1
- title: Fast Is Not the Same as More
  objective: Separate what sets the speed from what sets the amount, and pick one operating point.
  briefing: Two plans can be equally quick and not equally full.
  stake: >-
    The crew wants methane faster on the eleventh sol without going back to an unsafe temperature.
    Speed and yield do not reward the same settings. Today you decide the operating point the plant
    will run on.
  takeaway: Kinetics sets how fast the mixture moves and equilibrium sets where it is going.
  segue: >-
    One plan is both safe and full, and both sides signed it. Now it needs pressure, cooling and water
    removal, and each of those is power the plant has not got.
  stops:

  - group: EQUIL
    call: Ask the reactor engineer which equilibrium expression is right
    task: Choose the equilibrium constant expression that matches the reaction.
    title: Build the equilibrium expression
    person: true
    reason: Every yield argument today is worked from this expression and two versions of it are on the wall
    concept: 'Equilibrium: Q against K, ICE reasoning and Le Chatelier'
    place: Reactor Hall
    scene: >-
      Two versions of the equilibrium expression are chalked on the hall wall and nobody remembers
      who wrote the second one. Herrera wants the right one settled before the ICE board is touched.
      All four species are gases at loop conditions.
    guide: >-
      Read the balanced equation and build the expression from it. Products go on top and reactants
      underneath, and each coefficient becomes the power its species is raised to. Then check the
      operations: an equilibrium expression multiplies and divides amounts, it does not add or
      subtract them. Two of the options have the wrong powers and one has the wrong operation
      altogether.
    background:
    - >-
      For a gas-phase reaction the equilibrium constant is the product of the product concentrations,
      each raised to its coefficient, divided by the same for the reactants. Pure solids and pure
      liquids would be left out because their concentrations do not vary, but here everything is a gas.
    - >-
      The coefficients are the powers because the expression comes from the reaction's own
      stoichiometry, not from any kinetic measurement. That is the opposite of a rate law, where the
      powers have to be measured, and the two are confused constantly.
    assumes:
    - the coefficients in a balanced equation become the powers in its equilibrium expression
    takeaway: Coefficients become powers here, which is exactly what they do not do in a rate law.
    format: CHOICE
    question: Which expression is the equilibrium constant for this reaction?
    choices:
    - methane times water squared, divided by carbon dioxide times hydrogen to the fourth.
    - methane times water, divided by carbon dioxide times hydrogen.
    - carbon dioxide times hydrogen to the fourth, divided by methane times water squared.
    - methane plus water squared, minus carbon dioxide plus hydrogen to the fourth.
    answer: methane times water squared, divided by carbon dioxide times hydrogen to the fourth.
    why: >-
      Products over reactants, with each coefficient as a power. Water has a coefficient of two so it
      is squared, and hydrogen has a coefficient of four so it is raised to the fourth. Dropping the
      powers describes a different reaction. Inverting the whole expression gives the constant for the
      reverse reaction, which is the reciprocal. And an equilibrium constant is a ratio of amounts
      multiplied together, so adding and subtracting them is not a form the expression can take.
    rebuttals:
    - The powers are missing. Water is squared and hydrogen is to the fourth, because those are the coefficients.
    - This is the expression for the reverse reaction. It is the reciprocal of the one asked for.
    - Equilibrium expressions multiply and divide amounts. They never add or subtract them.

  - group: KINET
    call: Complete the ICE board and close the carbon in the training vessel
    task: Close the carbon ledger for the ICE vessel and report the total charge accounted for.
    title: Complete the ICE table
    at: ice-board
    reason: A one-litre training run is the only place the loop's balance can be measured against a known charge
    concept: 'Equilibrium: Q against K, ICE reasoning and Le Chatelier'
    place: Reactor Hall
    scene: >-
      A one-litre model vessel was charged with 1.02 moles of carbon and 4.00 molar hydrogen, and no
      products. At balance the analyser reads 0.60 molar methane and 0.40 molar carbon dioxide.
      Okafor has the condensate bottle from the run standing beside the board.
    guide: >-
      The ICE row ties every change to one reaction extent through the coefficients: methane up by
      x, carbon dioxide down by x, hydrogen down by four x and water up by two x. Use the measured
      methane to fix x, then read the carbon off the board and add the streams that carry it. One
      stream is small and easy to leave out, and leaving it out is what makes the ledger fail to close.
    background:
    - >-
      With x equal to 0.60, hydrogen falls by 2.40 to 1.60 molar and water rises by 1.20. Putting
      those into the expression gives 0.60 times 1.20 squared, over 0.40 times 1.60 to the fourth,
      which is about 0.33 at this temperature.
    - >-
      The balanced row is the guardrail. Treating each concentration as free to move on its own is
      how hydrogen ends up falling by 0.60 and water rising by 0.60, and both of those contradict the
      coefficients that the equilibrium expression itself is built from.
    assumes:
    - every change in an ICE table is one reaction extent times a coefficient
    takeaway: One extent drives every row, and the coefficients are what turn it into each change.
    format: BALANCE
    question: Close the vessel's carbon ledger. How much of the charge can be accounted for?
    relationship: the equilibrium constant Kc = methane x water squared / (carbon dioxide x hydrogen to the fourth), from the ICE table
    balance:
      total: { amount: 1.02, unit: mol C, label: Carbon charged into the one-litre vessel }
      tolerance: 0.01
      streams:
      - { id: as-methane, label: Carbon present as methane at balance, value: 0.60, unit: mol C }
      - { id: as-co2, label: Carbon present as carbon dioxide at balance, value: 0.40, unit: mol C }
      - { id: water, label: Water formed at balance, value: 0, countable: false, unit: mol C,
          unitNote: The water is 1.20 molar and holds no carbon whatever. }
      - { id: condensate, label: Carbon dioxide dissolved in the condensate that left the vessel, value: 0.02, hidden: true, unit: mol C }
      commit: Report the total carbon
    answerText: >-
      1.02 moles, once the 0.02 that left dissolved in the condensate is counted. The gas phase holds
      1.00, and with methane at 0.60 the extent is 0.60, which gives Kc of about 0.33.
    why: >-
      The measured methane fixes the extent at 0.60, so hydrogen falls by four times that to 1.60
      molar and water rises by twice it to 1.20. The gas-phase carbon is then 0.60 as methane plus
      0.40 as carbon dioxide, which is 1.00 of the 1.02 charged; the missing two hundredths went out
      dissolved in the condensate. Substituting the equilibrium amounts gives 0.60 times 1.44, over
      0.40 times 6.55, which is about 0.33.

  - group: PHASE
    call: Take the product water out and watch the balance move
    task: Change one thing at the condensate tap, sample the loop, then restore it.
    title: Push the balance on purpose
    at: coldline-tap
    reason: There is a lever on the yield that is not the temperature and nobody has demonstrated it
    concept: 'Equilibrium: Q against K, ICE reasoning and Le Chatelier'
    place: Cold End
    scene: >-
      The loop is holding 60 percent conversion at the validated temperature. Cho can condense water
      out harder, admit inert nitrogen at fixed volume, or reduce the volume. Herrera wants one change
      at a time and the loop put back afterwards.
    guide: >-
      Change exactly one thing, sample the loop, then restore it. One of these options takes a product
      out of the mixture, one squeezes the same molecules into less space, and one adds a gas that
      takes no part in the reaction at all. Predict which will move the conversion and which will not
      before you act, then check whether the reading comes back when you undo it.
    background:
    - >-
      The reaction quotient has the same form as the equilibrium constant but uses the amounts present
      right now. Taking a product away lowers the quotient below the constant, so the reaction runs
      forward until the two are equal again. The constant itself does not move, because the
      temperature has not.
    - >-
      An inert gas admitted at fixed volume raises the total pressure and leaves every reacting
      partial pressure exactly where it was, so the quotient is unchanged and nothing shifts. Reducing
      the volume is different: it raises every partial pressure and favours the side with fewer gas
      molecules, which here is the product side, three against five.
    assumes:
    - the reaction quotient has the same form as the equilibrium constant
    takeaway: Taking a product out lowers the quotient, and the reaction runs forward to meet the constant again.
    format: CONTROL
    question: Which single change raises the methane without raising the temperature?
    control:
      truth: remove-water
      observable: { label: Conversion, unit: '%' }
      baseline: 60
      response: 8
      noise: 1
      changeVerb: Apply
      held: [Bed temperature, Feed composition, Recycle flow]
      variables:
      - { id: remove-water, label: Condense product water out harder at the tap }
      - { id: inert, label: Admit inert nitrogen at fixed volume }
      - { id: volume, label: Reduce the loop volume }
      - { id: hotter, label: Raise the bed temperature }
      moral: The constant did not move. The amounts present did.
      run: Sample the loop
      commit: Name it
    answerText: >-
      Condense the product water out harder. Conversion rises from 60 to about 68 percent, and
      restoring the tap brings it back towards 60.
    why: >-
      Removing water lowers the reaction quotient below the equilibrium constant, so the reaction runs
      forward until they match again, and the conversion rises. The constant has not changed, because
      the temperature has not. Restoring the tap puts the water back and the conversion returns, which
      is what makes it a controlled demonstration rather than a coincidence. Inert nitrogen at fixed
      volume changes no partial pressure and moves nothing, and raising the temperature is the thing
      the whole sol exists to avoid.

  - group: GIBBS
    call: Separate the two plans that look equally fast
    task: Add the physical constraints that separate two equally fast plans.
    title: Two plans look equally fast
    at: plan-board
    reason: The rate index cannot tell the two plans apart and one of them cannot meet the flight limits
    concept: 'Equilibrium: Q against K, ICE reasoning and Le Chatelier'
    place: Plant Control
    scene: >-
      Two operating points sit on the board with the same immediate rate index: a hotter one at lower
      pressure and a cooler one at higher pressure. Suri Nakata, the shift controller, has pencilled a whole family of pairs between them. Abiola wants one plan, not three recommendations.
    guide: >-
      Move the two controls and watch the rate index. A whole family of temperature and pressure pairs
      gives the same rate, which is why the rate index alone cannot choose between them. Then apply
      the second measurement, which is the equilibrium methane fraction at each pair, and see where
      the two families cross. The pair that satisfies both is the plan.
    background:
    - >-
      Rate rises with temperature and with pressure, so a hotter reactor at lower pressure and a
      cooler one at higher pressure can run at the same speed. Nothing about that says they make the
      same amount, because rate and yield are different quantities.
    - >-
      Equilibrium behaves differently. The reaction is exothermic, so a higher temperature lowers the
      constant and the methane fraction with it. And five moles of gas go in where three come out, so
      higher pressure favours the product side. Both of those point the same way, towards the cooler
      higher-pressure end.
    assumes:
    - a family of settings can produce the same value of one observable
    takeaway: One observable can leave a family of answers, and a second one collapses it to a point.
    format: DEGENERACY
    question: Which temperature and pressure pair satisfies both the rate and the equilibrium yield?
    degeneracy:
      observable: { label: Immediate rate index after a fresh charge }
      commit: Report the operating point
      truth: { a: 550, b: 12 }
      tolerance: { a: 6, b: 0.8 }
      controls:
      - { id: temperature, label: Bed temperature, min: 530, max: 590, step: 5, unit: K }
      - { id: pressure, label: Loop pressure, min: 6, max: 14, step: 1, unit: bar }
      locus:
      - { a: 590, b: 6 }
      - { a: 580, b: 7 }
      - { a: 570, b: 9 }
      - { a: 560, b: 10.5 }
      - { a: 550, b: 12 }
      - { a: 540, b: 13.5 }
      second:
        label: Equilibrium methane fraction above 70 percent, with the inlet peak under 600 K
        apply: Apply the equilibrium and thermal limits
        locus:
        - { a: 540, b: 10.5 }
        - { a: 545, b: 11.5 }
        - { a: 550, b: 12 }
        - { a: 555, b: 12.8 }
      still:
      - Every pair on the rate curve runs at the same immediate speed.
      - Only where the two curves cross does the mixture also settle above 70 percent methane.
      hint: The rate curve is a family. The second measurement is what turns it into a point.
    answerText: >-
      550 kelvin at 12 bar. Every pair on the rate curve is equally quick, and only the cooler
      higher-pressure end also settles above 70 percent methane with the inlet peak under 600 kelvin.
    why: >-
      Rate rises with both temperature and pressure, so the two trade against each other and a whole
      family of pairs shares one rate index. Equilibrium does not trade: the reaction is exothermic,
      so cooler raises the constant, and it has fewer gas molecules on the product side, so higher
      pressure helps as well. Both push toward the same corner. The hot low-pressure end runs just as
      fast and settles below the fraction the specification needs, and it sits close to the thermal
      limit as well.

# ======================================= sol 12 — CUT ×1 + SOIL ×2 + ELEC ×1
- title: The Loop
  objective: Follow the water round the whole plant and find where the return stream is failing.
  briefing: Follow the molecule, not the department.
  stake: >-
    On the twelfth sol the water that should come back from the reactor is not arriving. Every
    department has balanced its own room. Today you decide where the loop is losing what the stacks
    need.
  takeaway: A material balance drawn round one room can close while the loop between rooms fails.
  segue: >-
    The loop was 80 kilomoles of water short between shifts. Closing it lifts the hydrogen forecast.
    But a dust front is coming, and the mended loop still needs power.
  stops:

  - group: EQUIL
    call: Build the closed water path on the process map at the cut
    task: Build the closed material path and name the link that needs outside energy.
    title: Build the water and hydrogen loop
    at: process-map
    reason: Nobody has drawn the whole path in one place, so every department has been balancing its own room
    concept: Balanced equations and stoichiometry as an atom ledger
    place: The Ice Cut
    scene: >-
      The process map at the cut has the whole plant on one sheet with the return line pencilled in.
      Moreau has laid out the transfer cards on the bonnet of the rover. Two of them are arrows nobody
      in the plant has ever operated.
    guide: >-
      Put the transfers in the order a water molecule actually experiences them, from the ice at this
      face to the condensate tank at the cold end. Two cards on the bench are not part of the path at
      all. Then name the link that cannot run without energy from outside the chain, because that is
      the one the power budget has to pay for and the one the whole loop waits on.
    background:
    - >-
      The Sabatier reaction gives back two moles of water for every mole of methane, and electrolysis
      needs one mole of water for every mole of hydrogen. Adding the two equations cancels the water
      and the hydrogen, which is why the plant can run on carbon dioxide and electricity rather than
      on a stockpile of water.
    - >-
      Cancelling on paper does not make the cycle free. Electrolysis is the driven step: splitting
      water is not spontaneous and needs electrical energy pushed through it. Recycling reduces how
      much fresh water has to be dug and does nothing at all to the electricity bill.
    assumes:
    - adding two reactions cancels anything produced by one and consumed by the other
    takeaway: Recycling reduces the material a loop needs and not the energy it takes to run.
    format: CHAIN
    question: Which link in the balanced equations of this loop cannot run without outside energy?
    chain:
      governing: electrolysis
      distractor: sabatier
      commit: Name the driven link
      hint: The largest transfer on the map is not the one that has to be paid for.
      order: [ice, purify, electrolysis, sabatier, condense]
      links:
      - id: ice
        label: Ice and brine from the cut face
        transfers: water, as a solid with salts frozen into it
        reading: about 4 percent of the excavated mass comes out as usable water
      - id: purify
        label: The polishing train
        transfers: water, with the suspended solids and the ions taken out
        reading: clears 400 kilomoles a sol at full rate
      - id: electrolysis
        label: The water stack
        transfers: hydrogen and oxygen, split out of water by electricity
        reading: one mole of water per mole of hydrogen, and 600 kilowatt-hours a sol
      - id: sabatier
        label: The reactor loop
        transfers: methane, assembled from carbon dioxide and hydrogen
        reading: two moles of water returned for every mole of methane made
      - id: condense
        label: The condensate tap and recycle tank
        transfers: product water, back towards the polishing train
        reading: returned 320 of the 400 kilomoles the schedule assumed
      - id: intake
        label: The intake compressors
        transfers: carbon dioxide, taken from the atmosphere at twelve bar
        reading: captured 6600 kilograms this shift
      moral: The biggest arrow on a diagram is not the one that decides how fast the loop can turn.
    answerText: >-
      Electrolysis. It is the only link that cannot run on its own, and its 600 kilowatt-hours a sol
      is what the whole loop waits on. The intake is not on the water path at all.
    why: >-
      Every other transfer either moves water about or gives it back. The reactor loop returns two
      moles of water for every mole of methane, which is the largest transfer on the map and the
      reason it is the one people name. But splitting water is not spontaneous: it needs electrical
      energy pushed through it, and no amount of recycling changes that. The intake carries carbon
      dioxide and belongs to the other feed entirely, so it is not part of this path.

  - group: SOIL
    call: Ask the analytical lead which treatment each contaminant needs
    task: Match each contaminant to the treatment it actually needs.
    title: Match contaminants to treatment
    person: true
    reason: Polishing capacity is finite and it is currently being spent on something the plant wants downstream
    concept: 'Acids, bases and treating a solution on purpose'
    place: Water Plant
    scene: >-
      Four things are in the feed water and the polishing train can only do so much. Achebe wants
      dissolved ions out first and Cho wants dryness. Nobody has asked what each treatment can
      physically remove.
    guide: >-
      Match each contaminant to the treatment that can actually act on it. A filter catches things
      that are suspended in the water and not things dissolved in it. Ion exchange acts on charged
      solutes and has a fixed number of sites. Acid and base treatment is a stoichiometric
      subtraction. And one of the four is not a contaminant at all, so spending polishing capacity on
      it is a loss twice over.
    background:
    - >-
      Suspended and dissolved are different states, not degrees of the same one. A regolith fine is a
      particle held up by the water and a filter with a small enough pore will stop it. A chloride ion
      is surrounded by water molecules and passes any filter that lets water through.
    - >-
      Treatment is chosen by what the next machine cannot survive. Chloride and perchlorate poison a
      catalyst downstream, excess acid attacks the stack, and dissolved carbon dioxide is the feed the
      reactor is waiting for. Removing everything measurable is not the same as treating the water.
    assumes:
    - a dissolved ion is not held back by a particle filter
    takeaway: Treatment follows the consequence downstream, not the size of the number on the report.
    format: PROTOCOL
    question: Which treatment does each of these actually need?
    columns: [What is in the water, What it needs]
    scenarios:
    - Suspended regolith fines from the hopper.
    - Dissolved chloride and perchlorate ions.
    - Recycle water carrying excess hydrogen ion.
    - Dissolved carbon dioxide bound for the reactor feed.
    choices:
    - A particle filter, which stops anything the water is only holding up.
    - An ion-exchange column, which swaps charged solutes for harmless ones.
    - A measured addition of base, worked out mole for mole.
    - No polishing capacity at all, because it is wanted downstream.
    mapping: [0, 1, 2, 3]
    why: >-
      A filter acts on what is suspended, so it stops regolith fines and lets every dissolved ion
      straight through. Ion exchange is what acts on charge, and it is the only thing on the list that
      will take chloride and perchlorate out before they reach a catalyst. Excess hydrogen ion is
      removed by adding base in a measured amount, which is arithmetic rather than a machine. And the
      dissolved carbon dioxide is the reactor's own feed, so any capacity spent removing it costs
      twice.
    rebuttals:
    - Dissolved ions are not held up by the water. A filter that passes water passes them.
    - The reactor wants that carbon dioxide. Polishing it out is a loss on both sides of the plant.

  - group: PHASE
    call: Predict the treated pH, dose the tank, then measure it
    task: Predict the final pH, command the addition, then measure it.
    title: Predict, treat, measure
    at: brinetank
    reason: The treatment controller has never been calibrated and the stack cannot take acid water
    concept: 'Acids, bases and treating a solution on purpose'
    place: Water Plant
    scene: >-
      A hundred millilitres of 0.0100 molar hydrogen chloride sits in the brine tank. The dosing head
      is set to deliver ninety millilitres of 0.0100 molar sodium hydroxide. Achebe wants a number
      written down before the head is opened.
    guide: >-
      Predict the pH the mixture will reach, then command the addition, then measure. Work the moles
      first: how much hydrogen ion is present, how much hydroxide arrives, and what the difference is.
      Then divide by the total volume, which is both volumes added together. Only then take the
      logarithm. The measurement is the step that can be skipped, and skipping it leaves you with an
      opinion.
    background:
    - >-
      Neutralisation consumes hydrogen ion and hydroxide one for one, so it is a subtraction of moles
      and not of concentrations. Equal molarities do not cancel unless the volumes match, which is
      exactly the case here: a hundred millilitres against ninety leaves a tenth of the acid behind.
    - >-
      pH is a logarithm, so it can be taken only after a concentration exists. That also means pH
      values can never be averaged: the mean of pH 3 and pH 5 is not pH 4, because the underlying
      concentrations differ by a hundredfold.
    assumes:
    - hydrogen ion and hydroxide consume each other mole for mole
    takeaway: Moles first, then a concentration, then the logarithm — and never the other way round.
    format: VERIFY
    question: What pH will the treated tank reach, and what does the probe read?
    relationship: excess H⁺ moles divided by the total litres, then pH = −log[H⁺]
    verify:
      prediction: { label: pH of the treated tank, unit: '', min: 1.0, max: 12.0, step: 0.01 }
      truth: 3.30
      passRatio: [0.9, 1.1]
      intervention:
        label: Command 90.0 mL of 0.0100 M sodium hydroxide into the tank
        note: Volumes are additive at these concentrations.
        outcome: The dosing head delivers and the tank is stirred for thirty seconds.
      measurement:
        label: Read the pH probe
        note: The probe resolves to about two hundredths of a pH unit.
        cost: 3
        costUnit: min
      moral: A tenth of the acid is still there, and it is the tenth the stack would have met.
      unmeasuredMoral: A predicted pH nobody measured is a calculation, not a calibration.
      lock: Lock the prediction
      run: Open the dosing head
      measure: Read the probe
      commit: Report the run
    answerText: >-
      About pH 3.28, and the probe reads 3.30. A tenth of the acid is left, in a total volume of 190
      millilitres.
    why: >-
      A hundred millilitres of 0.0100 molar acid holds 0.00100 moles of hydrogen ion, and ninety
      millilitres of the same-strength base brings 0.000900 moles of hydroxide. They cancel one for
      one, leaving 0.000100 moles in a total volume of 0.1900 litres, which is 5.26 ten-thousandths
      molar. The negative logarithm of that is 3.28, and the probe reads 3.30 — agreement inside its
      own resolution. Equal molarities did not neutralise, because the volumes were not equal.

  - group: ELEC
    call: Close hydrogen across the whole plant at the stack panel
    task: Close the hydrogen ledger across the whole plant and report the total accounted for.
    title: Close hydrogen over the whole plant
    at: stack
    reason: Every room's own balance closes and the plant is still short at the start of every shift
    concept: Balanced equations and stoichiometry as an atom ledger
    place: Electrolysis Hall
    scene: >-
      Electrolysis made 400 kilomoles of hydrogen this shift and the store inventory fell by 20 more.
      The reactor consumed 360, measured vents took 4, and line inventory rose by 6. Yusuf Demir, the power and life-support officer, wants the whole plant on
      one sheet.
    guide: >-
      Draw the boundary round the whole plant rather than round one room. Available hydrogen is what
      was made plus what came out of storage. Uses are what the reactor took, what the vents took, and
      what is now sitting in the lines. Add the uses, report them, and see what the difference from
      the available total is. That difference is not a loss.
    background:
    - >-
      A room-by-room balance can close everywhere and still miss a failure between rooms. Each
      department here balanced its own boundary correctly, and the stream that failed was the return
      line that crosses between two of them at the change of shift.
    - >-
      The next shift is short for a reason the current ledger does not show. The schedule assumed 480
      kilomoles of hydrogen, which needs 480 kilomoles of water at the stack, and only 400 came back.
      Electrolysis takes one mole of water per mole of hydrogen, so 80 kilomoles of unreturned water
      is 80 kilomoles of hydrogen the next run cannot make.
    assumes:
    - a system boundary can be drawn round one room or round the whole plant
    takeaway: Widen the boundary and include storage, and the missing material stops being missing.
    format: BALANCE
    question: Close the whole-plant hydrogen ledger. How much of this shift's hydrogen is accounted for?
    relationship: hydrogen available = made plus withdrawn from store, and uses = reactor plus vents plus line inventory
    balance:
      total: { amount: 420, unit: kmol H2, label: Hydrogen available this shift including the store withdrawal }
      tolerance: 1
      streams:
      - { id: reactor, label: Consumed by the reactor loop, value: 360, unit: kmol H2 }
      - { id: vents, label: Measured vents and sampling, value: 4, unit: kmol H2 }
      - { id: lines, label: Increase in line inventory, value: 6, unit: kmol H2 }
      - { id: water-short, label: Recycle water that failed to return to the stack, value: 0, countable: false, unit: kmol H2,
          unitNote: "80 kilomoles of water, which is next shift's problem and not this shift's hydrogen." }
      - { id: reserve, label: Still standing in the store as reserve, value: 50, hidden: true, unit: kmol H2 }
      commit: Report the total hydrogen
    answerText: >-
      420 kilomoles, once the 50 still standing in the store as reserve is counted. Uses took 370 and
      nothing is unaccounted for. The next shift is short because 80 kilomoles of water never came
      back, which is 80 kilomoles of hydrogen it cannot make.
    why: >-
      Four hundred made plus twenty out of the store is 420 available. The reactor took 360, vents took
      4 and 6 went into line inventory, which is 370, leaving 50 kilomoles standing in the store. There
      is no unmeasured loss at all. The shortage is a boundary and timing error: the schedule assumed
      480 kilomoles of hydrogen from 480 of water, and only 400 of that water returned. One mole of
      water per mole of hydrogen makes the gap exact.

# ==================================== sol 13 — ARRAY ×1 + BATT ×1 + ELEC ×2
- title: Power
  objective: Turn charge into hydrogen, and commit a power plan the crew can survive.
  briefing: There is no perfect allocation, only one that can be defended.
  stake: >-
    A dust front cuts the array on the thirteenth sol, with three sols left. Water is ready and the
    stacks need power to split it. Today you decide what the plant stops doing.
  takeaway: Charge is a countable amount, and a power plan is defensible when every load protects something named.
  segue: >-
    The stacks ran and both meters reached full. Now a sealed vial reads 91.6 percent against a green
    channel's 97.4, and the countdown has already begun.
  stops:

  - group: ELEC
    call: Ask the power officer what happens at each electrode
    task: Decide which electrode makes which gas, and why.
    title: Name oxidation and reduction
    person: true
    reason: The stack is about to be run at full current and half the crew has the electrodes the wrong way round
    concept: 'Redox and electrolysis: charge turned into product'
    place: Array Shed
    scene: >-
      The array controller shows what the dust front has left. Demir has the cell schematic up beside
      it and wants the electrodes settled before he signs anything. Two people in the room have just
      given opposite answers.
    guide: >-
      Work from the definitions rather than from the names. Reduction is gain of electrons and
      oxidation is loss of electrons, and the cathode is where reduction happens by definition. Then
      ask which gas needs electrons added to make it and which needs them taken away. The last option
      is about something else entirely: what happens to a tabulated potential when a half-reaction is
      scaled up.
    background:
    - >-
      In alkaline water electrolysis, water is reduced at the cathode to give hydrogen and hydroxide,
      and hydroxide is oxidised at the anode to give oxygen and water. Electrons enter the cell at the
      cathode from the external supply and leave at the anode, so the two gases appear at opposite
      ends and are kept apart by a separator.
    - >-
      An electrode potential is an intensive property, which means it does not scale. Multiplying a
      half-reaction by two doubles the electrons and doubles the energy, and leaves the potential
      exactly where it was, because potential is energy per unit charge.
    assumes:
    - reduction is a gain of electrons and oxidation is a loss of them
    takeaway: The cathode reduces and the anode oxidises, and scaling a half-reaction does not scale its potential.
    format: CHOICE
    question: Which statement about alkaline water electrolysis is correct?
    choices:
    - Water is reduced at the cathode to give hydrogen, and hydroxide is oxidised at the anode to give oxygen.
    - Hydrogen is formed by oxidation at the anode, and oxygen by reduction at the cathode.
    - Both gases are formed by reduction, at opposite ends of the same cell.
    - Multiplying a half-reaction by two doubles its tabulated electrode potential.
    answer: Water is reduced at the cathode to give hydrogen, and hydroxide is oxidised at the anode to give oxygen.
    why: >-
      Hydrogen has to gain electrons to be made from water, and gaining electrons is reduction, which
      happens at the cathode by definition. Oxygen is made by taking electrons away from hydroxide,
      which is oxidation, at the anode. Both processes cannot be reduction, because the electrons
      arriving at one electrode have to leave at the other for a current to flow at all. And scaling a
      half-reaction changes the energy and the electrons together, so the potential — energy per unit
      charge — does not move.
    rebuttals:
    - This has both electrodes the wrong way round. Hydrogen needs electrons added, not removed.
    - A cell cannot reduce at both ends. The electrons arriving at one have to leave at the other.
    - Potential is energy per unit charge, so doubling both leaves it unchanged.

  - group: PHASE
    call: Assemble the electron and ion path round the cell
    task: Order the five steps of the current path round one cell.
    title: Assemble electron and ion flow
    at: cell-stacks
    reason: The battery floor has to be fixed tonight and the crew are drawing a cell with electrons in the electrolyte
    concept: 'Redox and electrolysis: charge turned into product'
    place: Battery Bank
    scene: >-
      A cell diagram is chalked on the desk at the battery bank with five stages loose beside it. One
      of the arrows drawn on it takes electrons straight through the electrolyte. Priya Bhatt, the habitat medic, is waiting for the reserve
      floor to be settled.
    guide: >-
      Order the five stages as a circuit, so that charge is conserved all the way round. Electrons
      move through metal and through the external supply. Ions move through the electrolyte. Those two
      paths do different work and mixing them makes a diagram that cannot carry a current. Start where
      the supply pushes and follow the charge until it comes back to the supply.
    background:
    - >-
      A cell only works if charge balances everywhere. Electrons arriving at the cathode are consumed
      by the reduction; the reduction leaves hydroxide behind; hydroxide migrates through the
      electrolyte to the anode; the oxidation there releases electrons back into the external circuit.
    - >-
      Nothing about this happens one molecule at a time. All five stages are running continuously and
      everywhere in the cell at once, and the ordering is the logic of the path rather than a
      chronology of a single event.
    assumes:
    - charge has to be conserved at every point in a circuit
    takeaway: Electrons go round the outside and ions close the circuit through the electrolyte.
    format: SEQUENCE
    axis: Order the five stages as a circuit, starting where the supply pushes and ending where it takes electrons back. This is a path, not a clock — all five run continuously.
    ends: [Where the supply pushes, Where the supply takes back]
    cards:
    - The external supply pushes electrons into the cathode.
    - Reduction at the cathode forms hydrogen and leaves hydroxide behind.
    - Ions carry the charge through the electrolyte to the other electrode.
    - Oxidation at the anode forms oxygen and releases electrons.
    - The electrons return through the external supply.
    order: [0, 1, 2, 3, 4]
    why: >-
      The supply is what drives a reaction that will not run on its own, so the path starts there.
      Electrons entering the cathode are consumed by the reduction that makes hydrogen, and the
      hydroxide left behind has to reach the other electrode for charge to balance — through the
      electrolyte, as ions, because electrons do not travel that way. At the anode the oxidation
      releases electrons back into metal, and they return to the supply. Any diagram with electrons in
      the electrolyte carries no current at all.

  - group: SOIL
    call: Turn the stack's amps and hours into kilograms
    task: Estimate the hydrogen mass collected from the run.
    title: Turn current into hydrogen
    at: stack-sheet
    reason: The recovery has to be converted into stack-hours before any power can be allocated to it
    concept: 'Redox and electrolysis: charge turned into product'
    place: Electrolysis Hall
    scene: >-
      The charge sheet has the run on it: ten thousand amps for eight hours at 92.0 percent current
      efficiency. Demir needs the hydrogen in kilograms before he will price the shift. The separator
      caught everything the cell produced.
    guide: >-
      Four steps and each one is a division or a multiplication. Charge is current times time, and an
      amp is a coulomb every second, so the hours have to be in seconds. Charge divided by the Faraday
      constant gives moles of electrons. Two electrons make one hydrogen molecule. Then apply the
      current efficiency and the molar mass. The sheet carries the run in hours as well as in seconds,
      and only one of those belongs in the calculation.
    background:
    - >-
      Faraday's law is stoichiometry with charge as a reactant. One mole of electrons is 96485
      coulombs, which is a countable amount, so a current and a clock convert directly into moles of
      product through the electrode half-reaction.
    - >-
      Current efficiency is the fraction of the charge that made what you wanted. Below one hundred
      percent, some of the charge went into side reactions or leaked across the separator, and the
      theoretical figure has to be reduced by it rather than reported as the yield.
    assumes:
    - one mole of electrons carries 96485 coulombs of charge
    takeaway: Amps and seconds are a chemical amount once the electrons per molecule are known.
    format: BALLPARK
    question: Estimate the mass of hydrogen the run collected.
    estimate:
      prompt: Ten thousand amps for eight hours at 92.0 percent current efficiency, with two electrons per hydrogen molecule.
      question: Estimate the mass of hydrogen the run collected.
      relationship: Faraday's law, moles of electrons = current x time / 96485, then halved for H2 and scaled by efficiency
      labels:
      - 10000 A  (the stack current)
      - 28800 s  (eight hours in seconds)
      - 96485 C per mol of electrons  (the Faraday constant)
      - 2  (electrons per hydrogen molecule)
      - 2.016 g/mol  (molar mass of hydrogen)
      - 0.920  (current efficiency)
      - 8.00 h  (the same run in hours)
      values: [10000, 28800, 96485, 2, 2.016, 0.920, 8.00]
      slots: 6
      template: '{0} × {1} ÷ {2} ÷ {3} × {4} × {5}'
      formula: a*b/c/d*e*f
      correct: [0, 1, 2, 3, 4, 5]
      target: 2768
      tolerance: 83
      units: g of hydrogen
      solution: Q = 10000 × 28800 = 2.88×10⁸ C; ÷ 96485 ≈ 2985 mol e⁻; ÷ 2 ≈ 1492 mol H₂; × 2.016 ≈ 3009 g; × 0.920 ≈ 2768 g.
      explanation: An amp is a coulomb a second, so the hours become seconds before anything else happens.
    why: >-
      Ten thousand amps for 28800 seconds is 2.88 hundred million coulombs. Divided by 96485 that is
      about 2985 moles of electrons, and two electrons make one hydrogen molecule, so about 1492 moles
      of hydrogen. At 2.016 grams per mole that is 3009 grams theoretical, and 92 percent efficiency
      brings it to about 2.77 kilograms. Using eight instead of 28800 undercounts by a factor of 3600.
      Forgetting the two electrons doubles the answer, and forgetting the efficiency reports a figure
      the separator never caught.

  - group: GIBBS
    call: Commit the recovery power plan at the stack controller
    task: Fund the loads that protect the fill, out of 600 kilowatt-hours.
    title: Allocate the recovery power
    at: stack
    reason: The dust front leaves 600 kilowatt-hours and six loads that all have a consequence attached
    concept: 'Redox and electrolysis: charge turned into product'
    place: Electrolysis Hall
    scene: >-
      Six hundred kilowatt-hours is what the array and the batteries will give tonight. Six loads want
      it. Bhatt has written the habitat's night heat requirement on the board in kilowatt-hours and
      Abiola has ruled it is not available to cut.
    guide: >-
      Every item on this board answers a question, and the panel lists which. Fund the ones whose
      questions have to be answered tonight and see what is left. The habitat is charged against the
      pool whether you like it or not. Watch which single item, if you drop it, lets the plant make
      more propellant and worse propellant, because that is the trade this sol is really about.
    rules: >-
      The plan is graded on the questions it answers. Loads marked protected are charged whether you
      fund them or not, an over-allocation cannot be committed, and the panel names anything you have
      not covered.
    background:
    - >-
      Refrigeration is not discretionary in the way it looks. Propellant already in the tanks boils
      off if the tank refrigeration stops, so cutting sixty kilowatt-hours there destroys material the
      plant has already spent power making.
    - >-
      Purification is the same trap in the other direction. Cutting it raises the number of kilograms
      loaded and lowers what fraction of them can be certified, which is the failure the next sol is
      entirely about.
    assumes:
    - a load that is shed still has whatever consequence it was preventing
    takeaway: Every funded load should be answering a named consequence, and the reserve is what goes.
    format: ALLOCATE
    question: How are the 600 kilowatt-hours spent?
    allocate:
      pool: { amount: 600, unit: kWh, mode: scalar }
      items:
      - id: habitat
        label: Habitat heat and air
        cost: 180
        protected: true
        note: Six people. Command has ruled this is not available to cut.
      - { id: thermal, label: Reactor thermal control, cost: 120,
          note: What keeps the bed inlet away from the limit. }
      - { id: purification, label: Purification of the batch precursor gas, cost: 80,
          note: What decides how much of the loaded mass can be certified. }
      - { id: electrolysis, label: The electrolysis recovery run, cost: 160,
          note: The hydrogen the reactor needs to replace processing losses. }
      - { id: refrigeration, label: Tank refrigeration, cost: 60,
          note: Propellant already made boils off without it. }
      - { id: fastcharge, label: Fast-charge reserve for tomorrow, cost: 60,
          note: Useful and restorable once the dust front has passed. }
      answers:
      - { question: Does the bed inlet stay clear of its limit tonight?, requires: [thermal], required: true }
      - { question: Is the batch precursor gas purified before loading?, requires: [purification], required: true }
      - { question: Is enough recovery hydrogen made tonight?, requires: [electrolysis], required: true }
      - { question: Does the propellant already in the tanks stay liquid?, requires: [refrigeration], required: true }
      - { question: Do the crew keep their heat and air?, requires: [habitat] }
      - { question: Is there a reserve to start tomorrow on?, requires: [fastcharge] }
      moral: The discretionary item is the one that can be restored later, and it is the only one.
      commit: Commit the power plan
    answerText: >-
      Habitat 180, thermal control 120, purification 80, electrolysis 160 and refrigeration 60 — the
      whole 600, with the fast-charge reserve unfunded.
    why: >-
      Each of the five funded loads answers a consequence that arrives tonight: the bed inlet stays
      under its limit, the precursor gas is purified, the recovery hydrogen is made, and the propellant
      already in the tanks stays liquid. The habitat is not yours to cut. That accounts for the whole
      pool, which means the fast-charge reserve goes, and it is the right thing to lose because it can
      be rebuilt once the dust has passed. Cutting purification instead would raise the kilograms and
      lower what can be flown.

# ======================================= sol 14 — TANKS ×1 + ASSAY ×2 + PAD ×1
- title: FULL
  objective: Find out what the green readiness lights are actually built on, and write the limits down.
  briefing: Enough and safe to use are two separate claims.
  stake: >-
    Both propellant meters read full on the fourteenth sol and the countdown has started. An
    independent vial does not agree with the green channel. Today you decide what ready is going to
    mean.
  takeaway: Mass and pressure do not determine composition, and a specification is written before the result.
  segue: >-
    There are enough kilograms and not enough certified methane, so the countdown is stopped. That
    leaves one sol, four plans, and a batch behind a quarantine ring.
  stops:

  - group: GIBBS
    call: Open every readiness channel at the tank farm gauges
    task: Open every dependency and say which readiness claims stand on their own.
    title: Trace every green light
    at: farm-gauges
    reason: The load-ready light is green and nobody has asked what the light is computed from
    concept: 'Evidence independence: agreement is not confirmation'
    place: Tank Farm
    scene: >-
      Five channels on the farm gauges say the load is ready. Elena Vasquez, the pad controller, has the loading checklist open with one
      hand on the umbilical valve. Achebe has arrived with a sealed vial and has not said
      anything yet.
    guide: >-
      Open each channel and read what it stands on. Some are direct measurements from a transducer.
      Some are worked out from other channels and inherit their references. Name the reference the
      quality channels have in common, then keep only what could have failed for its own reasons. A
      full gauge can be perfectly true while the purity behind it is not.
    background:
    - >-
      The pressure transducer is calibrated at the pad and measures pressure directly. The estimated
      methane mass is worked out from that pressure and an assumed average molar mass, so it is
      partly a model and it moves whenever the composition moves.
    - >-
      Both quality channels come off the cold-end analyser, which is set against Standard C. The
      control-room quality reading is computed from the online composition, so the two agreeing is the
      analyser agreeing with itself. The vial in the assay lab is set against a different sealed
      standard and is the only composition claim with its own reference.
    assumes:
    - a derived channel inherits the reference of whatever it was computed from
    takeaway: A full gauge and a certified batch are different claims with different evidence.
    format: TRACE
    question: Which readiness claims here are independently supported?
    trace:
      target: std-c
      commit: Correct it
      resources:
      - { id: std-c, label: Standard C }
      - { id: transducer, label: The pad-calibrated pressure transducer }
      - { id: std-a, label: Standard A }
      channels:
      - id: pressure
        label: Tank pressure
        reading: 19.1 bar at the certification temperature
        depends: [transducer]
      - id: est-mass
        label: Estimated methane mass
        reading: Loaded mass at target, from pressure and an assumed average molar mass
        depends: [transducer]
      - id: online-comp
        label: Online composition
        reading: Methane at 97.4 percent of the gas by mole
        depends: [std-c]
      - id: room-quality
        label: Control-room quality channel
        reading: Every quality limit reported as met
        depends: [std-c]
      - id: vial
        label: Sealed vial in the assay lab
        reading: Methane at 91.6 percent of the gas by mole
        depends: [std-a]
      independent: [pressure, vial]
      correction:
        what: The composition reference the cold-end analyser is set against
        was: Methane at 97.4 percent of the gas by mole
        now: Methane at 91.6 percent against a sealed reference
        corrected: The load-ready light, which turns amber
        effect: Both quality channels move together because one reference moved
    answerText: >-
      Only the pressure and the sealed vial. The mass is worked out from the pressure and an assumed
      molar mass, and both quality channels come off one analyser set against Standard C.
    why: >-
      Pressure comes from a transducer calibrated at the pad and stands on its own. The estimated mass
      is computed from that pressure and an assumed average molar mass, so it is a model output and it
      shifts whenever the composition does. Both quality channels come off the same analyser and the
      same standard, so their agreement is the analyser agreeing with itself. The vial has a separate
      standard and is the only independent composition claim on the board, which is why it can
      contradict two green lights.

  - group: EQUIL
    call: Score the frozen certification model on the newest vial
    task: Freeze the certification model and score it on the newest vial.
    title: Test certification on the newest sample
    at: spec-bench
    reason: The calibration was built on six clean historical standards and the newest sample is not clean
    concept: 'Specification: deciding the limit before the result arrives'
    takesAsRead: 'Evidence independence: agreement is not confirmation'
    place: Assay Lab
    scene: >-
      Six historical standards sit on the specification bench, all of them between 97 and 100 percent
      methane. The online model was calibrated on them and its residuals were under a third of a
      percent. The newest vial from the quarantined batch has not been scored.
    guide: >-
      Move the allowance and watch how well the calibration does on the six standards it was built
      from. Then freeze it and score the newest vial, which the calibration has never seen. The number
      you report is the second one. Refitting the calibration after the vial has been read is refused,
      because a certification model that is adjusted to make its sample pass has stopped being a test.
    background:
    - >-
      All six historical standards are clean, so the calibration has never been asked to work outside
      a narrow range of composition. Letting the model extrapolate further looks harmless on them,
      because there is nothing out there to get wrong.
    - >-
      The newest vial is at 91.6 percent methane with 8.0 percent carbon dioxide, which is well outside
      that range. Standard C's own drift compresses the contaminated end of the scale, so the online
      model reports 97.4 percent for a batch that is nothing of the kind.
    assumes:
    - a calibration is only tested where it has seen data
    takeaway: A certification model has to predict the newest sample, not the samples it was built from.
    format: HOLDOUT
    question: What does the frozen certification model score on the newest vial?
    holdout:
      axis: { label: Carbon dioxide the calibration is allowed to extrapolate to, unit: '%', min: 0, max: 10, step: 0.2 }
      fitLabel: The six historical clean standards
      testLabel: The newest vial from the quarantined batch
      unit: '% of composition explained'
      fitNote: Every one of these lies between 97 and 100 percent methane, so nothing out at the far end was ever tested.
      testNote: This vial is at 91.6 percent methane with 8.0 percent carbon dioxide.
      pass: 89
      start: 6
      freeze: Freeze the calibration
      commit: Report the honest score
      afterFreeze: The newest vial is scored against the allowance you froze.
      fit:
      - { at: 0, value: 88 }
      - { at: 2, value: 94 }
      - { at: 4, value: 97 }
      - { at: 6, value: 99 }
      - { at: 8, value: 98 }
      - { at: 10, value: 96 }
      test:
      - { at: 0, value: 90 }
      - { at: 2, value: 93 }
      - { at: 4, value: 79 }
      - { at: 6, value: 61 }
      - { at: 8, value: 52 }
      - { at: 10, value: 47 }
    answerText: >-
      About 93 percent, and only with the allowance held near 2 percent. Extrapolating out to 6 scores
      99 on the historical standards and 61 on the vial, which is the batch being passed by a model
      that has never seen anything like it.
    why: >-
      The six standards are all clean. So a calibration allowed to reach a long way looks excellent on
      them: there is no dirty case in the set to be wrong about. The vial is at 8 percent carbon
      dioxide, far outside that range. Out there the drift in Standard C squeezes the scale, and the
      model reports 97.4 for a batch at 91.6. Passing clean historical samples does not qualify a
      model to certify a dirty one. The newest sample is exactly the prediction certification exists
      to make.

  - group: SOIL
    call: Ask the analytical lead what is actually wrong with the batch
    task: Choose the explanation that fits the composition and the quantity together.
    title: What is actually wrong
    at: assay-review
    reason: The tanks are at target mass and pressure and one batch cannot be flown, and those two facts have to be reconciled
    concept: 'Specification: deciding the limit before the result arrives'
    place: Assay Lab
    scene: >-
      Achebe has the whole board up: pressure, loaded mass, three composition figures and the drier
      pressure drop. The countdown is paused at her word. Sundqvist is asking for time to reprocess
      rather than arguing that the mass is enough.
    guide: >-
      Read every zone, including the ones showing nothing wrong. Two options say there is not enough
      propellant and two say there is enough and something is wrong with it. The mass and the pressure
      rule on the first pair immediately. Then ask what could put carbon dioxide and water into a
      collected product after it left the reactor, and what would hide it from the online channel.
    background:
    - >-
      Contaminants add mass and they add pressure, so every quantity signal passes. A tank at target
      mass and 19.1 bar is genuinely at target mass and 19.1 bar; what is in it is a separate
      question that mass and pressure cannot answer.
    - >-
      The drier's pressure drop is the mechanism. A drier near breakthrough stops holding water and
      carbon dioxide back, so both pass into the collected product, and a biased composition standard
      then reports the result as within limits.
    assumes:
    - a contaminant contributes to mass and to pressure like any other gas
    takeaway: Full is a claim about amount, and ready is a claim about composition.
    format: DIAGNOSIS
    headline: The tanks are at target mass and 19.1 bar, and one batch cannot be certified.
    task: What is actually wrong with the batch?
    readings:
    - { zone: Tank farm, label: Pressure at certification temperature, value: 19.1 bar, status: normal, note: inside the flight band }
    - { zone: Tank farm, label: Total loaded mass, value: at target, status: normal, note: rules out insufficient propellant }
    - { zone: Tank farm, label: Tank mass change overnight, value: none, status: normal, note: rules out a leak }
    - { zone: Sealed vial, label: Methane by mole, value: 91.6 percent, status: alarm }
    - { zone: Sealed vial, label: Carbon dioxide by mole, value: 8.0 percent, status: alarm }
    - { zone: Sealed vial, label: Water by mole, value: 0.40 percent, status: alarm }
    - { zone: Cold end, label: Drier differential pressure, value: high and rising, status: alarm }
    - { zone: Reactor, label: Production history over the batch, value: at the validated point, status: normal }
    choices:
    - label: Not enough total propellant was made
      mechanism: The plant fell short of the mass the vehicle needs.
    - label: A leak somewhere on the tank or the umbilical
      mechanism: Propellant was loaded and then lost from the tank.
    - label: Purification breakthrough, hidden by a biased composition standard
      mechanism: The drier stopped holding water and carbon dioxide back, and the analyser's own reference under-reported both.
    - label: The reactor rate is still too low
      mechanism: The reaction is not converting enough feed to fill the tanks in time.
    answer: Purification breakthrough, hidden by a biased composition standard
    why: >-
      The mass is at target and the tank has not lost any overnight, which disposes of both the
      shortfall and the leak. Production ran at the validated point, so rate is not the issue either,
      and rate could not put carbon dioxide into a product after it was collected. What can is a drier
      near breakthrough, and its differential pressure is high and rising. The contaminants add mass
      and pressure, so the quantity signals passed, and a biased standard on the analyser reported the
      composition as acceptable.

  - group: PHASE
    call: Write the flight limits before the blind resamples arrive
    task: Set the threshold that decides quarantine, before the resamples come back.
    title: Write the rule before the samples
    at: cert-console
    reason: Two blind resamples are on their way and the limits have never been written down
    concept: 'Specification: deciding the limit before the result arrives'
    place: Pad Office
    scene: >-
      Two blind resamples are in the airlock and will arrive over the next several hours. Vasquez has
      the certification console open and the carbon dioxide rule blank. The flight limit is 2.0 percent
      and quarantine takes five hours to organise.
    guide: >-
      Set the carbon dioxide reading at which you would quarantine and reprocess, and set it now,
      before any of the resamples arrive. The rule has to fire early enough for the action to still be
      possible: quarantine needs five hours of lead. Sliding the threshold to either end of the scale
      is not an answer — one fires on everything and the other fires on nothing.
    rules: >-
      The board is graded on whether the rule fires on a reading inside the window with enough hours
      left for the action. A threshold that never fires, or fires on the opening reading, scores nothing.
    background:
    - >-
      A specification is a set of limits declared before the results, each tied to a consequence. The
      campaign's flight limits are methane at or above 97.0 percent, carbon dioxide at or below 2.0,
      water at or below 0.10, and pressure between 18.0 and 20.0 bar at the certification temperature.
    - >-
      Writing the rule afterwards is how goalposts move. A team looking at an inconvenient result will
      find reasons to average it with a passing online channel, and averaging an independent failure
      with a biased instrument has no scientific basis at all.
    assumes:
    - an action needs enough lead time to still be possible when it is called
    takeaway: A threshold set before the result is a decision, and one set afterwards is an excuse.
    format: TRIGGER
    question: At what carbon dioxide reading do you quarantine and reprocess?
    trigger:
      direction: rising
      release: Release the board
      commit: Stand by the board
      objective: Set the carbon dioxide reading that calls quarantine, with time left to organise it.
      consequenceLimit: 2.0
      scale:
        label: Carbon dioxide in the loaded batch
        unit: '% by mole'
        min: 0
        max: 12
        step: 0.1
        anchors:
        - { at: 2.0, means: The flight limit. Above this the batch cannot be certified. }
        - { at: 8.0, means: What the quarantined batch actually measured against a sealed standard. }
      conditions:
      - id: quarantine
        label: Quarantine the batch and start reprocessing
        leadHours: 5
        window: { min: 1.8, max: 3.0 }
        owner: Pad Office
        action: Close the umbilical, ring the tank, and start the drier back through the batch.
      stream:
      - { at: Tank A first vial, update: Tank A reads inside every limit., value: 1.5, hoursLeft: 14 }
      - { at: Drier outlet trend, update: The drier outlet trend crosses the flight limit., value: 2.4, hoursLeft: 11 }
      - { at: Batch C first sealed vial, update: The sealed vial comes back far outside the limit., value: 7.8, hoursLeft: 8 }
      - { at: Batch C blind resample, update: The blind resample confirms it., value: 8.0, hoursLeft: 5 }
    answerText: >-
      Around 2.0 percent — anywhere from just above the 1.5 Tank A reads to the 2.4 the drier trend
      reaches. That fires with eleven hours left, and quarantine needs five.
    why: >-
      The rule has to fire on a reading that is genuinely over the limit and early enough for the
      action to happen. A threshold near the 2.0 flight limit fires on the drier outlet trend at 2.4,
      eleven hours out, which leaves more than the five hours quarantine needs. Setting it at the
      bottom of the scale fires on Tank A, which is inside every limit. Setting it near the sealed
      vial's 7.8 means the rule fires with eight hours left on a batch that has already been loaded.

# ======================================= sol 15 — GIBBS ×1 + TANKS ×1 + PAD ×2
- title: GO or NO-GO
  objective: Buy the one measurement that can change the decision, then commit the recovery and the launch.
  briefing: After the recommendation there is nothing left to ask.
  stake: >-
    One sol is left. Four recovery plans are on the board and only parts of them fit together. Today
    you decide what the crew does and whether the vehicle flies.
  takeaway: A measurement is worth what it can change, and GO means every declared limit passed.
  stops:

  - group: GIBBS
    call: Ask the commander for the one measurement worth buying
    task: Buy the one measurement that could change the launch decision.
    title: Buy one measurement
    person: true
    reason: There is time and consumable for exactly one more test before the recommendation is due
    concept: 'Testing a model: held-out data, residual structure and stress'
    place: Plant Control
    scene: >-
      Abiola will authorise one more test before the recommendation goes in. Five are on offer and
      four of them measure something nobody is arguing about. The countdown is holding at her word and
      not for long.
    guide: >-
      A measurement is worth what it can change. Ask of each option what you would do differently
      depending on how it comes out, and cross off any where the answer is nothing. Precision on a
      number that is already precise and already undisputed buys nothing at all. Watch which axis each
      option is measuring on, because four of the five are on axes the argument has already settled.
    background:
    - >-
      Pressure and mass are measured directly, agree between channels that do not share a reference,
      and are not what anybody is disputing. Measuring either again narrows an interval nobody is
      standing on.
    - >-
      An average catalyst temperature is a reactor number. It cannot say anything about the contents of
      a tank, and it certainly cannot certify them. The only measurement that reaches the disputed
      claim is a second independent assay of what is in the quarantined batch.
    assumes:
    - a measurement is only useful if some outcome would change what you do
    takeaway: Evidence is valuable for the action it can change, and for nothing else.
    format: VALUE
    question: Which single measurement is worth buying, against the uncertainty that is left?
    value:
      decision: Whether the quarantined batch has to be reprocessed before the vehicle can be certified.
      budget: { amount: 1, unit: test }
      commit: Commit the decision
      hint: Four of these measure something already agreed between independent channels.
      moral: More precision on a number nobody is disputing is not more evidence.
      options:
      - id: pressure
        label: Another total-pressure reading on the loaded tank
        cost: 1
        axis: Quantity
        reveals: 19.1 bar again. It already agrees with the pad-calibrated transducer.
      - id: mass
        label: A duplicate measurement of total tank mass
        cost: 1
        axis: Quantity
        reveals: At target again. Nobody has disputed the mass at any point.
      - id: assay
        label: An independent contaminant assay on the quarantined batch
        cost: 1
        axis: Composition
        decisive: true
        reveals: Carbon dioxide at 7.9 percent and water at 0.39, so the batch is off specification and quarantine stands.
      - id: avgtemp
        label: Another average catalyst temperature
        cost: 1
        axis: Reactor condition
        reveals: An average. It says nothing about what is inside a tank.
      - id: valve
        label: A visual inspection of the transfer valve
        cost: 1
        axis: Mechanical
        reveals: No visible leak at the umbilical, which nobody had claimed there was.
    answerText: >-
      The independent contaminant assay on the quarantined batch. It is the only option whose result
      changes what the crew does next.
    why: >-
      Pressure and mass are measured directly. They agree between channels with separate references,
      and nobody is disputing either, so repeating one narrows a gap nobody is standing on. An average
      catalyst temperature is a reactor number and cannot certify what is in a tank. The independent
      assay is the only measurement whose result changes the action. If the batch is on specification
      the quarantine lifts. If it is not, reprocessing is the whole sol.

  - group: EQUIL
    call: Collapse the last two plans at the tank farm station
    task: Apply the composition and hardware limits and say which plan survives.
    title: Collapse the last degeneracy
    at: farm-gauges
    reason: Two plans meet the projected mass because one of them counts contaminated propellant as fuel
    concept: 'Specification: deciding the limit before the result arrives'
    place: Tank Farm
    scene: >-
      Two plans reach the projected methane by dawn and Nakata has pencilled a whole family of
      reprocessing and production splits between them. The assay has come back. Vasquez is holding the
      loading checklist open at the transfer page.
    guide: >-
      Move the two controls and watch the projected tonnes at dawn. A whole family of splits between
      reprocessing hours and extra production hours reaches the same gross mass, which is why gross
      mass cannot choose between them. Then apply the second measurement, which counts only methane
      that could actually be certified, and see where the two families cross.
    background:
    - >-
      Reprocessing costs hours and returns nothing to the gross mass; extra raw production adds gross
      mass and cannot change what is already in a tank. Against a gross-mass objective they trade off
      exactly, which is what makes the family.
    - >-
      Certified methane is a different objective. Contaminated mass counts for nothing at all under it,
      so hours spent reprocessing are the only hours that convert existing mass into usable propellant,
      and the family collapses to the split that actually clears the batch.
    assumes:
    - only propellant that passes the specification can be counted as usable
    takeaway: Two plans tie only while the objective is the wrong one.
    format: DEGENERACY
    question: Which split of reprocessing and production hours survives both limits?
    degeneracy:
      observable: { label: Projected gross tonnes in the tank at dawn }
      commit: Report the plan
      truth: { a: 6, b: 3 }
      tolerance: { a: 0.8, b: 0.8 }
      controls:
      - { id: reprocess, label: Hours spent reprocessing the batch, min: 0, max: 10, step: 0.5, unit: h }
      - { id: produce, label: Hours of extra raw production, min: 0, max: 10, step: 0.5, unit: h }
      locus:
      - { a: 0, b: 9 }
      - { a: 2, b: 7 }
      - { a: 4, b: 5 }
      - { a: 6, b: 3 }
      - { a: 8, b: 1 }
      second:
        label: Certified methane only, with the pressure under 12 bar and the inlet peak under 600 K
        apply: Count only methane that passes the specification
        locus:
        - { a: 5.5, b: 3.5 }
        - { a: 6, b: 3 }
        - { a: 6.5, b: 2.5 }
      still:
      - Every split on the first curve reaches the same gross mass at dawn.
      - Only where the curves cross does the batch also clear the specification in time.
      hint: The first curve is a family because the objective counts every kilogram. The second one does not.
    answerText: >-
      About six hours of reprocessing against three of extra production. Every split on the gross-mass
      curve ties, and only this one also clears the batch to specification before the window.
    why: >-
      Against gross mass the two controls trade off exactly, because reprocessing returns no new
      kilograms and production cannot clean the ones already loaded. That is the family. Certified
      methane counts contaminated mass as nothing, so reprocessing hours become the only hours that
      convert existing propellant into usable propellant, and the tie breaks. The plan that counted
      every kilogram as fuel was not a rival plan; it was the same plan measured against an objective
      the specification does not allow.

  - group: ELEC
    call: Spend a hundred points on the recovery at the pad table
    task: Spend a hundred points across the recovery proposals.
    title: Spend a hundred decision points
    at: pad-table
    reason: The whole crew is round one table and each of them owns one constraint on the last sol
    concept: 'Specification: deciding the limit before the result arrives'
    place: Pad Office
    scene: >-
      Seven proposals are on the pad table and a hundred points to spend across them. Demir has the
      power ledger, Vasquez the checklist, Achebe the vial. Abiola wants one plan out of the room and
      not seven opinions.
    guide: >-
      Read the evidence and ask of each proposal what it can change. Only one action alters what is
      actually in the quarantined batch. One replaces what reprocessing costs in losses. One keeps the
      reactor inside the limits the fortnight established. One decides whether the launch can be
      authorised at all. One protects the crew. And two of them buy nothing that survives the sol.
    evidence: |
      Reprocessing the batch is the only action on the table that changes the concentration of a
      contaminant already in a tank; the drier has been regenerated and has eight hours of capacity.
      Timed electrolysis replaces about 90 kilograms of processing loss and needs 160 kilowatt-hours it
      already has. The validated 550 kelvin and 12 bar point holds rate, yield and thermal margin
      together and costs nothing new to keep. An independent final assay is what launch authorisation
      is granted against; without one the specification cannot be checked. Extra raw production above
      the validated point adds gross mass and takes the inlet back towards the limit that stopped the
      plant on sol 10. Dashboard recalibration makes the panels agree with the sealed standard and
      changes no physical quantity before the window. Habitat and safety margin is 180 kilowatt-hours
      that has been protected every sol and is protected tonight.
    background:
    - >-
      A plan is only as good as the weakest link in the chain it funds. Reprocessing without a final
      assay produces a batch nobody can sign for; an assay without reprocessing certifies a failure;
      and either without the validated operating point risks a repeat of the hot inlet.
    - >-
      Spending everything on production is the failure this whole campaign has been about. It solves
      the sol-one problem, which is already solved, and recreates the sol-fourteen problem, which is
      the one still open.
    assumes:
    - a plan is graded on whether the chain it funds actually completes
    takeaway: Fund the whole causal chain and the verification, and nothing that cannot change the decision.
    format: SCIENCETANK
    question: How are the hundred points spent?
    proposals:
    - { label: A, text: Reprocess the quarantined batch through the regenerated drier. }
    - { label: B, text: Run timed electrolysis to replace the losses reprocessing costs. }
    - { label: C, text: Hold the validated 550 kelvin and 12 bar point through the loading. }
    - { label: D, text: Take an independent final assay against a sealed standard. }
    - { label: E, text: Run extra raw production above the validated point. }
    - { label: F, text: Recalibrate the dashboard panels to agree with the sealed standard. }
    - { label: G, text: Hold the habitat and safety margin at its protected level. }
    recommended: { A: 30, B: 20, C: 15, D: 20, G: 15 }
    why: >-
      Reprocessing is the only action that changes the contaminant concentration in propellant that has
      already been made, so it carries the most weight. Timed electrolysis replaces what reprocessing
      loses, and the validated operating point is what keeps the reactor inside the limits established
      on sol ten. The independent assay is what the launch authorisation is actually granted against.
      Extra raw production solves the problem from sol one and recreates the one from sol fourteen, and
      recalibrating panels changes no physical quantity before the window opens.

  - group: PHASE
    call: Give the commander your recommendation at the certification console
    task: Give the recommendation the readings and the limits actually support.
    title: The commander's recommendation
    at: cert-console
    reason: Every limit has now been measured against an independent standard and the window opens at dawn
    concept: 'Specification: deciding the limit before the result arrives'
    place: Pad Office
    scene: >-
      The reprocessed batch is back at the farm and two independent assays agree within two tenths of
      a percent. Abiola has her hand beside yours on the authorisation pad. Vasquez has the checklist
      at the last page.
    guide: >-
      Read every zone. Four options are on the table and only one of them is consistent with what is
      printed. Check each declared limit in turn — methane, carbon dioxide, water, pressure, thermal
      margin, hydrogen reserve, habitat — and ask whether it passed. Then ask what each option would
      do to the ones that have passed, because two of the four undo work this fortnight has already
      paid for.
    background:
    - >-
      Every limit was written down before these numbers arrived: methane at or above 97.0 percent,
      carbon dioxide at or below 2.0, water at or below 0.10, pressure between 18.0 and 20.0 bar. The
      reprocessed batch reads 98.1, 1.8 and 0.08 at 19.0 bar, and two independent assays agree.
    - >-
      Zero contamination was never the standard, and it is not achievable. A specification is a set of
      limits chosen because the engine can tolerate them, and reprocessing past them spends the last
      sol on a margin nobody asked for and misses the window.
    assumes:
    - a specification limit is a level the vehicle was designed to tolerate
    takeaway: GO means every declared limit passed, and not that one reassuring gauge is green.
    format: DIAGNOSIS
    headline: The reprocessed batch is back at the farm and two independent assays agree within 0.2 percent.
    task: What is the recommendation?
    readings:
    - { zone: Reprocessed batch, label: Methane by mole, value: 98.1 percent, status: normal, note: limit is 97.0 or above }
    - { zone: Reprocessed batch, label: Carbon dioxide by mole, value: 1.8 percent, status: normal, note: limit is 2.0 or below }
    - { zone: Reprocessed batch, label: Water by mole, value: 0.08 percent, status: normal, note: limit is 0.10 or below }
    - { zone: Tank farm, label: Pressure at certification temperature, value: 19.0 bar, status: normal }
    - { zone: Reactor, label: Inlet peak at the validated point, value: 584 K, status: normal, note: limit is 620 K }
    - { zone: Electrolysis, label: Hydrogen reserve in the store, value: 16 kmol, status: normal }
    - { zone: Habitat, label: Protected reserve tonight, value: intact, status: normal }
    - { zone: Assay lab, label: Agreement between two independent assays, value: within 0.2 percent, status: normal }
    choices:
    - label: Launch now and set the assay aside, because the mass is full
      mechanism: Quantity signals are treated as sufficient and composition is not checked.
    - label: Return to 575 kelvin to build the largest possible margin of fuel
      mechanism: Rate is raised at the cost of thermal margin and equilibrium yield.
    - label: Reprocess again until the contaminants read zero
      mechanism: Purity is pushed past the specification with the hours that are left.
    - label: Accept the reprocessed batch, hold the validated point through loading, and authorise launch
      mechanism: Every declared limit is checked against an independent assay and each one passes.
    answer: Accept the reprocessed batch, hold the validated point through loading, and authorise launch
    why: >-
      Amount, composition, pressure, thermal margin, hydrogen reserve and the habitat reserve are all
      inside limits that were written down before the numbers arrived, and two independent assays agree
      to two tenths of a percent. Launching on mass alone is the sol-fourteen failure repeated. Going
      back to 575 kelvin is the sol-ten failure repeated, and it lowers the equilibrium yield as well.
      Reprocessing to zero confuses perfect purity with specified purity and spends the window doing it.
    rebuttals:
    - Mass is not composition. That is exactly what stopped the countdown yesterday.
    - 575 kelvin is the point the stress test rejected, and it lowers the yield at equilibrium as well.
    - Zero was never the limit. The specification exists because the engine tolerates 2.0 percent.

# ---------------------------------------------------------------- the rooms
interiors:
  GIBBS:
    caption: Nothing gets sealed, shed or signed for in this plant until the ledger it comes out of closes.
    standLine: Carbon in against carbon accounted for, and a magnet holding the sheet down.
    station:
      kind: panel
      title: Plant summary
      rows:
      - { label: Methane against schedule, value: 18 percent behind, status: alarm }
      - { label: Carbon accounted for, value: 99.8 of 100.0 kmol, status: normal }
      - { label: Power margin tonight, value: 18 kWh, status: low }
      - { label: Sols to the window, value: '15', status: normal }
  EQUIL:
    caption: There is an amount of methane this mixture will settle at, and no amount of urgency moves it.
    standLine: The loop, the recycle line, and the heat nobody has counted yet.
    station:
      kind: panel
      title: Reactor loop
      rows:
      - { label: Loop pressure, value: 12.0 bar, status: normal }
      - { label: Bed inlet temperature, value: 612 K, status: alarm }
      - { label: Outlet average, value: 569 K, status: normal }
      - { label: Conversion this pass, value: 55 percent, status: low }
  KINET:
    caption: The bed is the only part of this plant that does something nothing else here can do.
    standLine: Nine sols of profiles, and an inlet running 24 kelvin hotter than a clean charge.
    station:
      kind: panel
      title: Catalyst bed
      rows:
      - { label: Inlet temperature, value: 612 K, status: alarm }
      - { label: Halide at the inlet, value: present and heavy, status: alarm }
      - { label: Surface area against fresh, value: within 3 percent, status: normal }
      - { label: Spare charges on the planet, value: '1', status: low }
  PHASE:
    caption: Anything that is not methane goes into the cold line as a liquid and stays there.
    standLine: 283 kelvin to 115 in one run of pipe, and a drier that has stopped holding.
    station:
      kind: panel
      title: Cold end
      rows:
      - { label: Drier differential pressure, value: high and rising, status: alarm }
      - { label: Condensate returned, value: 320 of 400 kmol, status: low }
      - { label: Radiator capacity, value: 78 percent of rated, status: alarm }
      - { label: Cold line outlet, value: 115 K, status: normal }
  SOIL:
    caption: Every number that leaves this room is measured against something sealed, or it does not leave.
    standLine: Two bottles, one alarm label, and a chloride figure nobody has checked.
    station:
      kind: panel
      title: Water plant
      rows:
      - { label: Wall chloride meter, value: 41 mg/L, status: alarm }
      - { label: Portable instrument, value: 12 mg/L, status: normal }
      - { label: Field blank from the cut, value: under 2 mg/L, status: normal }
      - { label: Polishing column duty, value: 71 percent spent, status: high }
  ELEC:
    caption: Splitting water is not something water does on its own, and the bill for that is electrical.
    standLine: Cells in series, and a store that starts every shift short of what the schedule assumed.
    station:
      kind: panel
      title: Electrolysis hall
      rows:
      - { label: Stack current, value: 10000 A, status: normal }
      - { label: Current efficiency, value: 92.0 percent, status: normal }
      - { label: Hydrogen in the store, value: 50 kmol, status: low }
      - { label: Water returned to the stack, value: 400 of 480 kmol, status: alarm }

# ------------------------------------------------------- what each place says
copy:
  GIBBS: <p>Plant Control. Every ledger in the plant closes on this desk, every load on the plain comes off this board, and nothing is sealed or shed until somebody senior has said the sentence out loud.</p>
  EQUIL: <p>The Reactor Hall. Carbon dioxide and hydrogen go in and methane and water come out, along with a great deal of heat that has to be somewhere by the end of the interval.</p>
  KINET: <p>Catalyst Bay. The bed, the bench and the last spare charge on the planet. What the reaction can do here depends on how many nickel sites are still free to do it.</p>
  PHASE: <p>The Cold End. Gas becomes liquid down one run of pipe, and anything that is not methane arrives at the tanks with it unless something upstream has taken it out.</p>
  SOIL: <p>The Water Plant. Ice from the cut becomes water the stacks can split, and the ions that came up with it become somebody else's problem downstream if they are not taken out here.</p>
  ELEC: <p>The Electrolysis Hall. Water in, hydrogen and oxygen out, and a number of kilowatt-hours that the array decides and the habitat has first claim on.</p>

# ------------------------------------------------------------- the warm-up runs
# The schedule is the engine's. What a book says is why this campaign is doing it.
warmups:
  trial-near:
    title: Walk the plant line
    why: The process runs in a straight line down this site, and a lead who cannot walk it in order cannot follow the carbon through it.
  trial-far:
    title: Sign out a rover for the ice cut
    why: The cut is three hundred metres out and the only water on this station comes from it, so the route has to be driven before it is needed in a hurry.
  greet:
    title: Meet the six who own a number
    why: Six people each hold one constraint on this launch and every one of them will be quoted at you before the fortnight is out.
  follow:
    title: Follow the maintenance round
    why: A technician walks the same valves every shift and the record he keeps is the only account of what has been opened.
  hunt:
    title: Six sealed standards, recovered
    why: One sealed standard has been left in each module and nothing measured against the plant's own reference can be trusted until they are collected.
  canvass:
    title: Ask the crew what ready means
    why: Half this station reads a full gauge as a ready vehicle and the other half does not, and the split matters more than the average.
  evade:
    title: Clear the pad before the static fire
    why: The berm is a thirty-metre ring and everybody inside it has ninety seconds to be somewhere else once the count starts.
  tag:
    title: Catch the sample before it is signed
    why: A vial leaves the assay lab for the pad every evening and a batch signed on the wrong assay cannot be unsigned.

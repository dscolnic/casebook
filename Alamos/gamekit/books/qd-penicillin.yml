# Penicillin — a Quick Discovery.
#
# The 3 x 3 shape from great_discoveries_next10_nonphysics_expanded.docx, game
# 11, mapped onto the engine's day model: a level is a day, a micro-game is a
# stop, and the campaign is nine stops in one sitting. Three levels, in order:
#
#   1  Notice the anomaly     what one plate is allowed to claim
#   2  Test the substance     controls, spectrum and dose
#   3  Make it a medicine     purification, the record, and the supply
#
# The science guardrail from the source book, kept, and it is the whole shape of
# the third level. Nobody discovered a cure on a plate. One person noticed an
# inhibition zone and investigated it; a different group, years later, solved
# purification, assay, dosing, toxicity and production, and the game's last
# three stops are about that gap rather than about the mould.
#
# Format budget. Nine stops, so `formatMix`'s cap is three of any one format:
# CHOICE 2, BALLPARK 2, and one each of SWEEP, SEQUENCE, CONTROL, VERIFY,
# ATTEST. Eight formats in nine stops, and two of them driven — the source book
# asks for nine *different* interactions per discovery, which a campaign of nine
# multiple choices is written against.

theme:
  id: qd_penicillin
  title: Penicillin
  subtitle: Junior Researcher · Inoculation Department

groups:
  - id: CULT
    code: CULT
    name: Culture Room
    color: '#4d7a3f'
    desc: Plates, an incubator, and the one contaminated plate nobody threw away.
    defaultLeader: fleming
    milestones: [Read the plate, Measure the ring, Say what it forbids, Ready to hand over]
  - id: BROTH
    code: BROTH
    name: Broth Room
    color: '#8a6a1e'
    desc: Flasks of mould broth, a filter candle, and the bench where the liquid is separated from the thing that made it.
    defaultLeader: chain
    milestones: [Grow the broth, Filter it, Test one change, Ready to hand over]
  - id: ASSAY
    code: ASSAY
    name: Assay Room
    color: '#3f6f8a'
    desc: A rack of dilutions, a standard lawn, and the only place in the building that can say how much of anything there is.
    defaultLeader: heatley
    milestones: [Set the dilutions, Read the lawns, Report the strength, Ready to hand over]
  - id: TRIAL
    code: TRIAL
    name: Trial Room
    color: '#8a4a3f'
    desc: Cage cards, the treatment record, and the wall where every claim about the preparation is pinned beside its evidence.
    defaultLeader: florey
    milestones: [Pin the claim, Name what backs it, Cross off an overclaim, Ready to hand over]

roster:
  - id: fleming
    name: Alexander Fleming
    role: Bacteriology Lead
    real: true
    division: CULT
    bio: |
      Keeps the culture room, which is an incubator, a wash trolley and a habit
      of looking at plates before they are cleaned. Most contaminated plates are
      spoiled work. Now and then one is a question.

      His interest is in what the plate actually shows: a lawn of bacteria that
      stops short of a mould colony, in a ring, with a graded edge rather than a
      line. He will describe that and decline to describe anything else.

      His limit is that a plate is one plate. It cannot say what the mould
      releases, whether the effect repeats, or whether any of it would help a
      patient, and he says so before anybody asks.
    quiz:
      - q: Why will Fleming not say the mould kills bacteria?
        a: Because several different things would produce a clear ring
        wrong:
          - Because the mould colony is far too small to have affected a lawn of that size
          - Because he has not yet identified which species of mould landed on the plate
          - Because killing and merely preventing growth look identical under any microscope here

  - id: charteris
    name: Ivy Charteris
    role: Culture Room Technician
    division: CULT
    bio: |
      Pours the plates, seeds the lawns and keeps the strain book, which sounds
      like housekeeping and is the reason any two experiments here can be
      compared at all.

      A lawn is only a measuring surface if it is the same lawn every time: one
      strain, one age of culture, one thickness of medium. She writes down which
      ward isolate each subculture came from, because a strain that has quietly
      been swapped explains a result that has no other explanation.

      Her limit is that she can guarantee the surface and not the sample. What is
      put onto her plates is somebody else's problem.
    quiz:
      - q: Why does Charteris record which subculture every lawn came from?
        a: So two plates read on different days are the same measuring surface
        wrong:
          - Because the strain decides how quickly the mould colony spreads across the dish
          - Because the ward requires a written record of every organism handled in the department
          - Because different strains have to be incubated at different temperatures and for longer

  - id: chain
    name: Ernst Chain
    role: Biochemist
    real: true
    division: BROTH
    bio: |
      Works on the liquid rather than the organism. Mould grown in broth for a
      week leaves something behind in the broth, and everything he does is aimed
      at handling that something without destroying it.

      Passing the broth through a filter fine enough to hold back the mould is
      the first move, because a liquid that still works when the organism is gone
      is a liquid with a substance in it. After that the questions are ordinary
      chemistry: what warms it away, what precipitates it, what it survives.

      His limit is that the material is fragile and there is very little of it.
      Every experiment costs some of the thing being studied.
    quiz:
      - q: What does filtering the broth establish?
        a: That something released into the liquid is doing it
        wrong:
          - That the substance responsible for the effect is a protein rather than a salt
          - That the mould in the flask has finished growing and will grow no further
          - That no other organism is present anywhere in the filtered broth on the bench

  - id: heatley
    name: Norman Heatley
    role: Assay and Production
    real: true
    division: ASSAY
    bio: |
      Built the way this building measures strength: a standard lawn, a rack of
      dilutions and a rule that a number means nothing unless the same lawn was
      used to get it.

      His assay turns a jar of pale liquid into units. That is what makes a dose
      possible, what makes two batches comparable and what makes it possible to
      say whether a purification step kept the useful part or poured it away.

      His limit is that an assay measures activity against one organism under one
      set of conditions. It is a strength, not a promise about a patient.
    quiz:
      - q: Why does every purification step have to be assayed?
        a: Because how a fraction looks says nothing about what is in it
        wrong:
          - Because the assay itself removes the impurities the extraction step left behind
          - Because a written record of every step is required before a batch is released
          - Because activity rises a little each time the liquid is passed through a filter

  - id: florey
    name: Howard Florey
    role: Head of the Unit
    real: true
    division: TRIAL
    bio: |
      Runs the trial room, and the rule there is the one everybody finds
      tiresome: a claim comes off the wall by being contradicted, never by being
      unpopular.

      What goes on the wall is what somebody measured, with the measurement
      beside it. A signature records that a person accepted a claim, which is
      worth having and is not the same as the claim being true. Matched groups
      and counts are what he argues from.

      His limit is supply. He can design a treatment experiment he cannot run,
      and for most of this work the binding constraint is how much material
      exists rather than what anybody wants to find out.
    quiz:
      - q: What does Florey treat as the difference between a record and evidence?
        a: A record shows a claim was accepted rather than measured
        wrong:
          - A record is written up afterwards and evidence is always written down at the time
          - A record carries no signature on it and a piece of evidence always carries one
          - A record is about people in the department and evidence is about the organisms

  - id: adeyemi
    name: Samuel Adeyemi
    role: Animal House Keeper
    division: TRIAL
    bio: |
      Keeps the animals, the cage cards and the timings, and he is the reason a
      treatment comparison here is a comparison rather than a story.

      Two groups matched on weight and age, infected from one culture on one
      afternoon, one group dosed and one not: that is his work, and it is what
      turns an outcome into something attributable. He also keeps the counts of
      what happened to every animal, including the ones that spoil the picture.

      His limit is that he can match what he can see. Nothing he does rules out a
      difference between the groups that nobody thought to measure.
    quiz:
      - q: Why does Adeyemi infect both groups from a single culture on one afternoon?
        a: So the two groups differ in the treatment and in nothing else
        wrong:
          - Because a bacterial culture cannot be kept alive for longer than a single day
          - Because it halves the number of animals the comparison has to use up
          - Because the preparation only works against an infection that started that same day

missions:
  - title: A ring where the lawn stops
    objective: Turn one contaminated plate into a statement that can be tested, and design the test.
    briefing: Fleming wants the plate described before anybody explains it.
    stake: >-
      Monday. A plate that should have gone into the wash is on the bench instead. Alexander Fleming,
      who leads the bacteriology work here, has been looking at it since the morning: a lawn
      of staphylococcus covering the whole dish except for a clear ring round one colony of
      mould. Everybody who walks past offers an explanation. Today you write down what the
      plate actually shows, measure how far the effect reaches, and set up the one experiment
      that can separate the mould itself from anything it might have released. A description
      agreed before an explanation is one nobody can bend later.
    takeaway: A plate can show that something happened and cannot say what did it.
    stops:
      - group: CULT
        task: Say what the plate shows
        title: A ring where the lawn stops
        place: Culture Room
        concept: 'An inhibition zone is an observation, not yet a cause'
        scene: >
          A discarded plate is back on the bench. Staphylococcus covers it edge
          to edge except around one fuzzy colony of mould, where a clear ring
          about two centimetres across carries no growth at all.
        guide: >-
          Four statements about the plate are offered and only one of them stays inside what
          you can see. Sort them by how much they add to the picture: a statement about where
          growth is and is not adds nothing, a statement about what the mould does adds a
          mechanism, and a statement about every mould adds a claim about dishes nobody has
          looked at.
        background:
          - >-
              How to do it, on a different example. A field has bare grass in a circle round
              an old bonfire site. What you can see is that grass did not grow there. That the
              fire killed the grass is an explanation, and it competes with the ash changing
              the soil, or somebody having parked a trailer on it all summer. Ask of each
              statement how much of it you would have to take on trust.
          - >-
              Why the ring is worth keeping. A patch of no growth anywhere on a plate is
              ordinary — a dry spot, a scratch, a bubble. A ring centred on a colony is not
              ordinary, because the shape names a centre, and a centre is something you can
              go and test.
          - >-
              What a mould colony is doing here at all. Plates are poured, seeded and left in
              a warm room for a day or two, and spores are in the air of any building. A
              contaminated plate is usually spoiled work; this one is spoiled work with a
              pattern on it.
          - >-
              Why the wording matters more than it looks. Everything done for the rest of the
              week is a test of one sentence, and the sentence has to be narrow enough to be
              wrong. "Bacteria did not grow near the mould" can be checked on the next plate.
              "The mould kills bacteria" cannot be checked on anything.
        assumes:
          - a bacterial lawn is an even growth of one organism across the whole dish
          - a clear area on a plate means growth did not happen there
        takeaway: An observation says where something happened; every word beyond that is an explanation being smuggled in.
        format: CHOICE
        question: Which of these is the strongest statement the plate on its own supports?
        choices:
          - Bacteria did not grow in a ring around the mould colony.
          - The mould kills bacteria.
          - Moulds stop bacteria from growing.
          - The mould has cured an infection.
        answer: Bacteria did not grow in a ring around the mould colony.
        rebuttals:
          - Killing is one way to produce a clear ring and so is preventing growth, and this plate cannot separate them.
          - One mould and one bacterium have been seen here, which says nothing about moulds in general.
          - Nothing on this dish is an infection, and nobody has been treated.
        why: >
          The plate is a record of where growth happened and where it did not. Everything
          else on offer adds something the dish cannot supply: whether the bacteria were
          killed or merely held back, whether other moulds behave the same way, whether any
          of it would help a patient. Each of those is a real question and each needs its own
          experiment. Keeping the first sentence narrow is what makes the rest of the week
          possible, because a claim that could not be wrong cannot be tested either.

      - group: CULT
        task: Measure how far the effect reaches
        title: Where the growth comes back
        place: Culture Room
        concept: 'A substance that diffuses makes a graded zone, not a sharp edge'
        scene: >
          Ivy Charteris, the culture room technician, has set a fresh plate under
          the measuring stage with the mould colony at one edge. The lawn can be
          read at any distance out from the colony.
        guide: >-
          Drive the reading point outward from the edge of the colony and watch the growth
          come back. You are looking for the distance at which the lawn has recovered to half
          of what it manages far away from the colony. Take readings across the whole range
          before deciding, because the interesting part of this curve is its shape rather
          than any one point on it.
        background:
          - >-
              How to do it, on a different example. Stand near a small radiator in a cold
              room and walk away from it, reading a thermometer as you go. Warmest at the
              radiator, cooler as you go, and somewhere along the way you pass the point that
              is halfway between the radiator and the far corner. Find that point by taking
              readings the whole way rather than by guessing where it ought to be.
          - >-
              Why a graded edge is the finding. Something that spreads out from a point is
              thickest at the point and thinner further off, so its effect fades. If instead
              the mould were consuming the food in the medium, or if only the cells it
              touched were affected, the boundary would be much sharper than this.
          - >-
              What the readout is. Growth is reported as a share of the open lawn at the far
              end of the plate, so one means the bacteria did as well as they do anywhere and
              zero means nothing grew. That makes the number comparable between plates poured
              on different days.
          - >-
              Why half rather than the edge. Where a fading curve finally reaches the lawn is
              a matter of how carefully you look. Where it passes half is a place the curve
              actually goes through, and two people reading the same plate will agree on it.
        assumes:
          - a substance released at a point is more concentrated close to that point
          - bacterial growth can be read as a fraction of an untouched lawn
        takeaway: An effect that fades with distance is the signature of something spreading out, and a sharp edge would have been evidence against it.
        format: SWEEP
        question: How far from the colony does growth recover to half of the open lawn?
        answerText: >-
          About eleven millimetres. Growth is absent out to four, climbs steadily from six
          onwards and is back to the open lawn by eighteen, which is a fade rather than a
          boundary.
        why: >
          Growth does not resume at a line; it comes back over about a centimetre. That shape
          is what a substance spreading outward from the colony produces, because the further
          out you go the less of it there is. Two rival explanations predict something else.
          If the mould were simply eating the nutrients, the shortage would follow the food
          rather than the distance, and if only cells in contact were affected the lawn would
          run right up to the colony. Reading the whole curve is what separates them.
        sweep:
          axis:
            label: Distance from the edge of the mould colony
            unit: mm
            min: 0
            max: 26
            step: 0.5
          readout:
            label: Growth, as a share of the open lawn
            unit: ""
          baseline: 0.0
          response:
            - at: 0
              value: 0.0
            - at: 4
              value: 0.02
            - at: 7
              value: 0.10
            - at: 9
              value: 0.26
            - at: 11
              value: 0.50
            - at: 13
              value: 0.72
            - at: 15
              value: 0.88
            - at: 18
              value: 0.98
            - at: 26
              value: 1.0
          target: 11
          tolerance: 0.8
          start: 0
          commit: Mark the half-growth distance

      - group: BROTH
        task: Design the test that leaves the mould out
        title: Take the mould away and see what is left
        place: Broth Room
        concept: 'A cell-free filtrate separates the agent from the organism that made it'
        scene: >
          Ernst Chain, the biochemist, has flasks of mould broth on the bench and
          a filter candle beside them. Nothing here has yet been shown to work
          without the living mould sitting in it.
        guide: >-
          Four steps are on the card and they have to happen in a fixed order, because each
          one needs the one before it to have been done. Ask of each step what it requires to
          already exist. Growing takes nothing; filtering needs something to filter; applying
          needs something filtered; reading needs something applied and time to have passed.
        background:
          - >-
              How to do it, on a different example. Making tea: boil the water, pour it over
              the leaves, wait, then strain it into the cup. Straining before pouring gives
              you dry leaves in a sieve, and drinking before waiting gives you hot water. Each
              step is impossible until the one before it has produced its output.
          - >-
              Why the filter is the whole point. As long as living mould is sitting on the
              plate, an effect could be anything the mould is doing while it is there. Once
              the mould has been held back and the liquid still works, the effect belongs to
              something released into the liquid, which is a thing that can be poured,
              measured and concentrated.
          - >-
              Why plain broth goes on the other half. Broth on its own is a rich, salty liquid
              and it is not obvious that bacteria enjoy it. Putting untouched broth beside the
              filtered kind on the same plate means the two halves differ only in whether the
              mould has grown in the liquid.
          - >-
              What is not being asked yet. Nothing in this sequence identifies the substance,
              says how much of it there is, or shows it would help anybody. It establishes one
              thing: that the effect survives the organism being taken away.
        assumes:
          - a filter can hold back an organism while letting a dissolved substance through
          - two halves of one plate share the same medium, strain and incubation
        takeaway: An effect that survives the removal of the organism is evidence for a released substance rather than for a living process.
        format: SEQUENCE
        task_line: Order the four steps of the cell-free test.
        cards:
          - Grow the mould in broth on its own for several days.
          - Pass the broth through a filter fine enough to hold the mould back.
          - Put the filtered broth on one half of a fresh seeded plate and plain broth on the other.
          - Read both halves after incubation and compare them.
        order: [0, 1, 2, 3]
        why: >
          Each step exists to make the next one possible. Growing produces the liquid;
          filtering removes the organism from it; putting it beside plain broth on one plate
          makes the comparison fair, since both halves then share the medium, the strain and
          the incubator. Reading last is not merely tidy, because a plate read early looks
          clear everywhere. What the sequence buys is a single sentence at the end: the
          liquid works with the mould gone, so something in the liquid is doing it.

  - title: What the liquid can be made to say
    objective: Establish that the effect is a substance in the broth, that it acts on some species and not others, and that it scales with dose.
    briefing: Chain and Heatley want a control, a spectrum and a number before anybody says the word treatment.
    stake: >-
      Wednesday, and the filtered broth works. That is one sentence and it is not enough for anything.
      Ernst Chain, the biochemist, has four flasks of it and four things he could do to
      them. Norman Heatley, who built the assay, has three species of bacteria and a rack of
      dilutions and no way yet to say how strong anything is. Today you change one thing at
      a time and put it back, find out which organisms respond and which do not, and get a
      number out of the dilution rack. Everything after this is arithmetic on those numbers.
    takeaway: A substance is established by what changes when you alter one thing, and measured by how the effect follows the dose.
    stops:
      - group: BROTH
        task: Change one thing, then put it back
        title: Four flasks, one difference each
        place: Broth Room
        concept: 'A control differs from the treatment in one thing only'
        scene: >
          Four flasks of filtered broth stand on the bench. Chain will do exactly
          one thing to a flask and plate it, as many times as the material lasts,
          and the clear zone is measured each time.
        guide: >-
          Change one thing about a flask, plate it, and read the zone. Then undo the change
          and read it again. A change that makes the zone collapse and lets it come back when
          reversed has found something; a change that moves nothing has ruled something out,
          which is worth almost as much. Do not alter two things together, because a smaller
          zone is then consistent with either of them.
        background:
          - >-
              How to do it, on a different example. A lamp flickers and there are four
              suspects: the bulb, the switch, the flex and the socket. Swap the bulb alone and
              watch; if the flicker stops, put the old bulb back and see whether it returns.
              A flicker that follows the bulb both ways is the bulb. Swapping the bulb and the
              flex together tells you only that one of the two was involved.
          - >-
              Why heating is worth trying. Very few things in a broth are damaged by ten
              minutes of warmth, and the ones that are tend to be large fragile molecules
              rather than salts or acids. A zone that survives losing the mould and disappears
              on warming is telling you what kind of thing it is made of.
          - >-
              Why removing the cells might do nothing. That is the result from the first
              level arriving as a control: if the substance is already dissolved in the
              liquid, taking the mould out again changes nothing, and a change that does
              nothing is a genuine finding rather than a wasted flask.
          - >-
              Why putting it back matters. Plenty of things drift during an afternoon — the
              incubator, the age of the lawn, the batch of medium. A zone that goes when you
              make a change and returns when you undo it cannot be explained by whatever else
              was drifting while you worked.
        assumes:
          - a controlled test alters one variable and holds the others still
          - the size of a clear zone increases with the amount of active material applied
        takeaway: A cause is a thing the effect follows in both directions, which is why the reversal matters as much as the change.
        format: CONTROL
        question: >-
          Four things can be done to the broth. Find out which one the clear zone depends on.
        control:
          hint: >-
            Alter whatever you like and read the plate. What you learn depends on how many
            things you moved at once.
          observable: { label: Clear zone on the test plate, unit: mm }
          held: [bacterial strain, incubation time, batch of medium]
          variables:
            - { id: cells, label: Filter the mould cells out again }
            - { id: acid, label: Neutralise the broth to pH 7 }
            - { id: food, label: Add fresh nutrient back to the broth }
            - { id: heat, label: Hold the broth at 90 °C for ten minutes }
          truth: heat
          baseline: 24
          # Signed: warming the broth takes the zone DOWN 21 millimetres.
          response: -21
          noise: 1.2
          changeVerb: applied
          run: Plate it and measure the zone
          commit: Name the change it depends on
        answerText: >-
          The heating. Ten minutes at ninety degrees takes the zone from twenty-four
          millimetres to almost nothing, and an unheated flask from the same batch gives it
          straight back. Filtering, neutralising and feeding all leave it where it was.
        why: >
          Three of the four changes do nothing, and that is most of the result. Removing the
          cells again changes nothing because the substance is already in the liquid;
          neutralising and feeding change nothing because neither acidity nor food shortage
          was producing the zone. Warming destroys it, and an unheated flask from the same
          batch brings it back, which rules out the incubator or the lawn drifting during the
          afternoon. What survives is a dissolved substance fragile enough to be spoiled by
          gentle heat, and that is a description worth having.

      - group: ASSAY
        task: Test three species at one strength
        title: One strength, three answers
        place: Assay Room
        concept: 'Susceptibility differs between species, so an antibacterial has a spectrum'
        scene: >
          Norman Heatley, who runs the assay, has put the same strength of
          preparation against three organisms. The first is stopped almost
          completely, the second slowed, and the third grows as though nothing
          were there.
        guide: >-
          Four readings of the same three results are offered. The distinction that separates
          them is what the word "not inhibited" is being taken to mean: not inhibited at this
          strength, or not inhibitable at any strength. Only one strength has been tested, so
          any statement that reaches past it is claiming something the rack has not been
          asked.
        background:
          - >-
              How to do it, on a different example. One coat keeps you warm in a mild autumn,
              keeps you barely warm enough in November, and is useless in February. That is
              three results about one coat and three conditions. Saying the coat does not
              work is a claim about the coat; saying it does not work in February is a claim
              about the coat in February, and only one of those has been tested.
          - >-
              Why species differ. Bacteria are not variations on one design. Their outer
              layers differ in what they let through and their internal machinery differs in
              what a given substance can interfere with, so a compound that reaches the
              target in one organism may never get in at all in another.
          - >-
              What a spectrum is for. Once you know which organisms respond, you know what a
              treatment could be aimed at and what it could not. That is worth more clinically
              than any statement about bacteria as a class, and it is the reason nobody in
              this building says "it works on bacteria".
          - >-
              Why the untested strength is the trap. Species C was offered one concentration.
              Ten times that might stop it, and if it did, the honest description would change
              from "not susceptible" to "susceptible above a strength we cannot yet make".
              Those are different sentences about the same experiment.
        assumes:
          - all three cultures were exposed to the same preparation at the same strength
          - growth here is measured as the amount of bacteria after a fixed incubation
        takeaway: A result at one strength describes that strength, so a species that grew has not been shown to be beyond reach.
        format: CHOICE
        question: Species A is stopped, species B is slowed, and species C grows normally. What does the rack support?
        choices:
          - Susceptibility differs between the three species at the strength tested.
          - The preparation is inactive, because one of the species grew.
          - The run failed, because a real antibacterial would stop all three.
          - Species C cannot be stopped by this preparation at any strength.
        answer: Susceptibility differs between the three species at the strength tested.
        rebuttals:
          - Two of the three responded, so the preparation is plainly doing something; what varies is who it does it to.
          - Nothing says organisms have to respond alike, and the differences between them are the reason to expect that they will not.
          - Only one strength was offered, so the rack cannot speak about strengths it never tested.
        why: >
          Three organisms met one strength and gave three answers. That is a statement about
          the organisms, not about the preparation. Bacteria differ in what their outer layers
          let in. They differ again in what their machinery offers to be interfered with. So a
          spectrum is the expected result rather than a disappointing one. The careful part is
          the third species. It grew at the strength tested. Nothing here rules out a stronger
          dose stopping it, and that matters. The strength available is about to become the
          limit on everything.

      - group: ASSAY
        task: Find the strength that halves the growth
        title: Between two dilutions
        place: Assay Room
        concept: 'An effect that scales with dose is evidence the substance is doing the work'
        scene: >
          The dilution rack has been read. With no preparation the lawn is full;
          at two units growth is down to sixty-eight per cent, and at six units
          to thirty-two. Heatley wants the strength that leaves half.
        guide: >-
          The strength you want sits between two of the readings, so find the two that
          straddle a half and work out how far along the step from one to the other the half
          point falls. The tiles include both a step between two strengths and one of the
          strengths itself, and only one of those is the distance you are travelling.
        background:
          - >-
              How to do it, on a different example. A road climbs from 40 metres at one post
              to 100 metres at the next, and the posts are 300 metres apart. Where is the
              70-metre mark? Seventy is thirty above forty out of a total climb of sixty, so
              it is half of the way — 150 metres along. Do it in that order: how far up you
              need to go, over how far up it goes altogether, times the distance between the
              two posts.
          - >-
              Why halving is the useful number. The strongest dilution stops nearly
              everything, and so would a stronger one, so the top of the range cannot
              separate two preparations. The middle of the curve is where a difference in
              strength shows up as a difference in the reading.
          - >-
              What a dose series is evidence for. If more material produced no more effect,
              the material would be a poor candidate for the cause. An effect that grows in an
              orderly way with the amount applied is the ordinary signature of the amount
              applied being what matters.
          - >-
              Why the answer is a strength and not a volume. Every reading in the rack is
              against one standard lawn, so the units are units of activity as this building
              measures them. A batch made next month can be compared with this one only
              through that lawn.
        assumes:
          - between two measured points the effect is taken to change steadily
          - all readings in the rack were taken against the same standard lawn
        takeaway: An effect that follows the dose can be interpolated, which turns a set of readings into a single number describing the material.
        format: BALLPARK
        question: What strength leaves half the growth?
        estimate:
          prompt: >-
            Heatley will not release a batch number until the rack gives a strength rather
            than a set of readings.
          question: What strength leaves half the growth?
          relationship: The strength that leaves half the growth sits along the step between the two doses that straddle it, in the same proportion as fifty per cent sits between their two growths.
          labels:
            - 2 units  (the lower strength that was tested)
            - 4 units  (the step from the lower strength up to the higher one)
            - 68 %  (growth remaining at the lower strength)
            - 32 %  (growth remaining at the higher strength)
            - 50 %  (the growth we are aiming at)
            - 6 units  (the higher strength itself, which is not the step)
            - 100 %  (growth with no preparation at all)
          values: [2, 4, 68, 32, 50, 6, 100]
          slots: 5
          template: '{0} + {1} × ({2} − {4}) ÷ ({2} − {3})'
          formula: a+b*(c-e)/(c-d)
          correct: [0, 1, 2, 3, 4]
          target: 4
          tolerance: 0.3
          units: units of activity
          solution: Half is eighteen points below the sixty-eight at two units, out of the thirty-six points the growth falls across the step, so the half point is halfway along a step of four units — two units plus two, which is four.
          explanation: The six on the board is the higher strength rather than the distance between the two, and using it in place of the step travels from the wrong starting point.
        why: >
          Two readings straddle a half, so the answer lies between them. Take the change as
          steady over that stretch and the half point falls a known fraction along. Half is
          eighteen points below the lower reading. The whole step is worth thirty-six points.
          So the half point is halfway along a step of four units. What the number buys is
          comparison. A batch brewed next month can be called stronger or weaker than this
          one. A step can be shown to have kept or lost material. A dose can be written down
          as a quantity rather than as an amount of liquid.

  - title: What stands between this and a medicine
    objective: Follow the activity through purification, separate the record from the evidence, and count what a week of production is worth.
    briefing: Florey will not let anything off the wall that the counts do not support.
    stake: >-
      Friday, and everything so far is about a liquid. Howard Florey, who heads the unit, wants to know
      what happens to it on the way to a patient, and the answer is that most of it does not
      get there. Norman Heatley has an extraction step that concentrates the material and may
      destroy it. Samuel Adeyemi, who keeps the animal house, has two matched groups and one
      afternoon's counts. And the wall in the trial room has six claims pinned to it, some
      measured and some merely signed. Today you find out what survives.
    takeaway: The distance between an effect and a treatment is purification, evidence and supply, and each of those is its own piece of work.
    stops:
      - group: ASSAY
        task: Predict what the extraction keeps
        title: Purify it, then find out what is left
        place: Assay Room
        concept: 'Purification is followed by assay, or the activity is thrown away'
        scene: >
          Heatley has an extraction step ready: the broth is shaken into ether at
          low temperature and then back into water. The liquid that comes out is
          paler and a quarter of the volume.
        guide: >-
          Say first, in writing, what share of the activity you expect the step to keep. Then
          run it, then assay what comes back. The prediction is locked once it is made,
          because a prediction adjusted after the reading has stopped being a test of
          anything. Note also that the step is finished only when the assay has been done.
        background:
          - >-
              How to do it, on a different example. Straining a stock through muslin: guess
              first that you will keep about four fifths of the liquid, then strain it, then
              measure what is in the jug. If you guessed nine tenths and got a half, the
              muslin is holding more than you thought, and you know that only because you
              wrote the guess down before you looked.
          - >-
              Why the appearance is not the answer. A liquid that is paler and smaller in
              volume looks purified, and it would look exactly the same if the useful part had
              been destroyed by the solvent or left behind in the discarded phase. Colour and
              volume are facts about the liquid rather than about what is dissolved in it.
          - >-
              What can go wrong at this step. The material is unstable. It dislikes warmth and
              it dislikes acid, and an extraction involves both a temperature and a pH. A step
              that gains you tenfold purity and keeps a twentieth of the activity has made the
              preparation cleaner and the project poorer.
          - >-
              Why the assay costs something worth counting. Every plate read is material not
              given to an animal, and there is very little material. That is the real reason
              steps get skipped, and it is exactly the situation in which skipping one is most
              expensive.
        assumes:
          - a purification step can lose active material as well as remove impurities
          - the assay reports activity against the same standard lawn each time
        takeaway: A purification step is finished when the activity in the product has been measured, not when the product looks clean.
        format: VERIFY
        question: >-
          Lock a prediction for the recovery, run the extraction, then assay what came back.
        verify:
          hint: >-
            Write the prediction down before the step is run. Nothing about it can be changed
            afterwards, which is what makes it a prediction.
          prediction: { label: Predicted activity recovered, unit: '%', min: 0, max: 100, step: 5 }
          truth: 45
          passRatio: [0.6, 1.6]
          intervention:
            label: The ether extraction
            note: Broth into ether at low temperature, then back into water buffered near neutral.
            outcome: Both phases run cleanly. A pale liquid comes back in a quarter of the original volume.
          measurement:
            label: Assay of the recovered liquid
            note: Six wells against the standard lawn, read at eighteen hours.
            cost: 1
            costUnit: plates
          unmeasuredMoral: >-
            A quarter of the volume and a paler colour are facts about the liquid. Neither of
            them says that any of the activity is still in it.
          commit: Report the recovery
        answerText: >-
          A little under half — about forty-five per cent of the activity comes back. The step
          is worth doing and it is not free, and only the assay says which.
        why: >
          Purity and yield are two quantities, and a step usually buys one with the other.
          This extraction concentrates the material and loses over half of it. That is fine
          while there is more broth and not fine when a patient is waiting. The failure the
          panel is built around is finishing without the assay. A pale liquid in a quarter of
          the volume fits a good recovery. It fits total destruction just as well. Nothing
          about the look of it separates the two, so a step reported without a number is a
          step whose result nobody knows.

      - group: TRIAL
        task: Sort the wall into measured and merely signed
        title: Six claims, and what each rests on
        place: Trial Room
        concept: 'A controlled group difference is causal evidence under its own conditions'
        scene: >
          Six claims are pinned across the trial room wall and every one of them
          is signed. Samuel Adeyemi, who keeps the animal house, has time to check
          three of them properly before the meeting.
        guide: >-
          Every claim here has a signature, so a signature cannot be what separates them. What
          separates them is whether a measurement is recorded beside the claim and whether
          that measurement is about what the claim says. Check the ones that would do the most
          damage if they were wrong, and hold anything you cannot close on the evidence in
          front of you.
        background:
          - >-
              How to do it, on a different example. A garage hands back a car with a list:
              brakes checked, tyres checked, exhaust replaced. The receipt is signed and one
              of the tyres is visibly bald. The signature is evidence that somebody accepted
              the claim; the tyre is evidence about the tyre. Where the two disagree, look at
              the tyre.
          - >-
              What the animal comparison does establish. Two groups matched on weight and age,
              infected from one culture on one afternoon, one dosed and one not: if the treated
              group survives and the untreated does not, the difference is attributable to the
              treatment. That is strong evidence, and it is evidence about that organism, that
              dose and that infection.
          - >-
              What it does not establish. It says nothing about people, about other organisms,
              about other doses, or about what happens after two days. A claim that reaches
              past the experiment is not supported by the experiment however carefully the
              experiment was done.
          - >-
              Why holding is a real outcome. Three checks against six claims means most of the
              wall stays unverified, which is fine as long as it is recorded as unverified. A
              claim marked open is honest; the same claim read next month as settled is how a
              wall turns into a story.
        assumes:
          - a signature records that somebody accepted a claim at the time
          - a matched comparison supports a conclusion about the conditions it was run under
        takeaway: A controlled difference between matched groups is causal evidence about the conditions it was produced in, and about nothing outside them.
        format: ATTEST
        question: >-
          Verify what the time allows and hold whatever the evidence on the wall cannot close.
        attest:
          hint: >-
            All six are signed. Checking costs time and there is not enough of it for the
            whole wall.
          checks: 3
          claims:
            - { id: mice, label: 'Eight infected animals treated and eight untreated; all eight treated alive at forty-eight hours', signedBy: Heatley, critical: true, backed: true, evidence: 'cage cards and counts agree, and both groups were infected from one culture on one afternoon' }
            - { id: dose, label: 'Each treated animal received one hundred and ten units', signedBy: Heatley, backed: true, evidence: 'weighed against the standard lawn and recorded before each injection' }
            - { id: cure, label: 'The preparation cures bacterial infection in man', signedBy: a press office, critical: true, evidence: 'no person has been given a purified preparation, so there is nothing to record' }
            - { id: safe, label: 'The preparation is safe at any dose', signedBy: a hospital circular, critical: true, evidence: 'one dose was given in one species, which is the whole of the toxicity record' }
            - { id: strain, label: 'The organism used was the ward isolate from Monday', signedBy: Charteris, backed: true, evidence: 'subcultured from the ward plate on Monday and checked against the strain book' }
            - { id: flu, label: 'The preparation will shorten an attack of influenza', signedBy: a summer student, evidence: 'nothing in this work has been near a virus' }
        answerText: >-
          Hold the claim about curing infection in man and the claim about safety at any
          dose. Both are critical, both are signed, and neither has a measurement behind it —
          one describes an experiment nobody has run, and the other reads one dose in one
          species as a statement about every dose.
        why: >
          The two claims that survive checking are the two with counts beside them: matched
          groups, one culture, one afternoon, and a recorded dose. The two that fail are not
          false so much as unsupported — one describes work that has not been done, and the
          other stretches a single toxicity observation into a general guarantee. That is the
          characteristic failure of a wall of signatures. A signature records that somebody
          accepted a claim, which is worth knowing and is not a measurement, and the claims
          worth spending checks on are the ones that would hurt most if they were wrong.

      - group: TRIAL
        task: Count what a week of brewing is worth
        title: How many doses a week makes
        place: Trial Room
        concept: 'A discovery is not a medicine until it can be made, dosed and supplied'
        scene: >
          Florey has the production figures. A week of brewing, extracted and
          assayed, comes to four thousand eight hundred units. One adult dose is
          two hundred units, and a patient needs eight of them a day.
        guide: >-
          Work out how many whole doses the week's output is worth, which is the total
          activity divided by what one dose takes. The tiles carry two other true numbers
          about the same week — how many doses a patient gets through in a day and how much
          broth was brewed — and neither belongs in this division.
        background:
          - >-
              How to do it, on a different example. A tin holds 900 grams of coffee and a pot
              takes 60 grams. That is fifteen pots, from one division. The fact that the
              household drinks three pots a day is a real fact and it belongs to the next
              question rather than this one — it turns fifteen pots into five days.
          - >-
              Why the answer is measured in activity and not in litres. A batch is described
              by the units the assay finds in it, because two batches of the same volume can
              differ several-fold in strength. That is what makes the assay in the middle
              level the thing this whole calculation rests on.
          - >-
              What the number means once you have it. Divide the doses by what a patient uses
              in a day and you have the number of patient-days a week of the entire operation
              produces. For most of this history that number was small enough to decide who
              could be treated at all.
          - >-
              Why this is a scientific problem rather than a business one. Yield, stability
              and purification are the same chemistry the middle level was about, arriving at
              a scale where they decide whether the work reaches anybody. Nothing about the
              plate in the culture room was ever going to settle it.
        assumes:
          - a batch is described by the units of activity the assay finds in it
          - a dose is a stated number of units rather than a volume of liquid
        takeaway: The output of a production week divides into a countable number of doses, and that count is what decides whether a treatment exists in practice.
        format: BALLPARK
        question: How many full adult doses does a week of production make?
        estimate:
          prompt: >-
            Florey wants the week's output written on the board as doses before the meeting,
            not as litres.
          question: How many full adult doses does a week of production make?
          relationship: How many doses a batch is worth is the units of activity recovered divided by the units of activity one dose takes.
          labels:
            - 4,800 units  (recovered from a week of brewing)
            - 200 units  (one adult dose)
            - 8  (doses a patient needs in a day)
            - 500 litres  (the broth brewed that week)
          values: [4800, 200, 8, 500]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 24
          tolerance: 1
          units: full adult doses
          solution: Four thousand eight hundred units of activity divided by the two hundred units one dose takes is twenty-four doses.
          explanation: The eight doses a day is what turns the answer into a number of days, and the litres of broth describe the vessel rather than what came out of it.
        why: >
          A week of the whole operation is worth twenty-four doses. At eight a day that is
          three days of treatment for one adult. The arithmetic is trivial and the result is
          the whole of this level. An effect can be real, measured, controlled and repeatable
          and still not be a medicine, while the supply is counted in patient-days. What
          closed that gap was better strains, deeper vessels and better recovery at each
          step. That is the same chemistry as the assay, run at a scale where it decides who
          gets treated.

warmups:
  greet:
    title: Five benches and one preparation between them
    why: >-
      Nothing on that wall was measured by one person. The plate, the broth, the assay rack,
      the animal counts and the production figures come from five different benches, and a
      claim is worth what the bench behind it is worth. Put a name to as many of them as you
      can before the week starts.
  trial-near:
    title: Walk the department before the first plate is read
    why: >-
      The culture room and the broth room are down one side of the corridor and the assay
      room and the trial room are down the other, which means every result crosses it.
      Alexander Fleming, who leads the bacteriology work, would rather you knew the way than
      found it out on Thursday.
  follow:
    title: Heatley carries a batch number from the rack to the wall
    why: >-
      A strength is read off a lawn, written on a card and pinned in another room, and most
      of what goes wrong happens in between. Norman Heatley, who runs the assay, walks one
      the whole way. Stay with him and watch where the number changes hands.

interiors:
  CULT:
    caption: A contaminated plate is spoiled work. A pattern on one is a question.
    standLine: One plate off the wash trolley, and a ring nobody has explained.
    station:
      kind: panel
      title: Incubator log
      rows:
        - { label: Plates seeded, value: 46, status: normal }
        - { label: Contaminated, value: 5, status: normal }
        - { label: With a ring, value: 1, status: low }
        - { label: Explained, value: none yet, status: low }
  BROTH:
    caption: A liquid that still works with the organism gone has something in it.
    standLine: Four flasks, one filter candle, and one change at a time.
    station:
      kind: panel
      title: Flask bench
      rows:
        - { label: Broth age, value: 7 days, status: normal }
        - { label: Filtered, value: 4 of 4, status: normal }
        - { label: Zone before warming, value: 24 mm, status: normal }
        - { label: Zone after warming, value: 3 mm, status: low }
  ASSAY:
    caption: A number means nothing unless the same lawn was used to get it.
    standLine: A rack of dilutions against one standard lawn, read at eighteen hours.
    station:
      kind: plot
      title: Growth against strength
      note: four points, and the half sits between two of them
      axes: { x: units of activity, y: growth remaining }
      curves:
        - { points: [[0.02, 0.98], [0.2, 0.68], [0.6, 0.32], [0.95, 0.05]], label: this batch }
  TRIAL:
    caption: A signature records that somebody accepted a claim.
    standLine: Six claims pinned up, and time enough to check three of them.
    station:
      kind: panel
      title: Trial board
      rows:
        - { label: Treated alive at 48 h, value: 8 of 8, status: normal }
        - { label: Untreated alive at 48 h, value: 1 of 8, status: low }
        - { label: Dose recorded, value: 110 units, status: normal }
        - { label: Human cases treated, value: none, status: low }

copy:
  CULT: <p>The culture room, first door on the west side. An incubator, a wash trolley, and one plate that was taken off it.</p>
  BROTH: <p>The broth room, at the far end of the west side. Flasks in a warm cupboard, a filter candle on a stand, and a bench kept clear for one change at a time.</p>
  ASSAY: <p>The assay room, across the corridor. A rack of dilutions, a standard lawn poured this morning, and the ledger of batch strengths.</p>
  TRIAL: <p>The trial room, opposite the broth room. Cage cards, the treatment record, and one long wall with every claim about the preparation pinned to it.</p>
  PORCH: <p>The porter's desk, inside the front door. A signing-in book that doubles as the fire roll, a rack of pigeonholes, and the department telephone.</p>
  TEA: <p>The tea room, halfway down the west side. An urn, eight chairs that never leave, and a milk rota nobody follows.</p>
  STER: <p>The sterilising room, beside the assay. An autoclave, a rack of cooling flasks, and a chart nobody signs until the cycle has finished.</p>
  RACK: <p>The media store at the end of the west side. Agar, peptone, salts and empty plates in stacks, and a tray of chipped dishes that is not a bin.</p>
  LIB: <p>The reading room at the far end. Journals on the shelves, a loan card in every front cover, and the only quiet in the building.</p>

# Why this campaign takes each of the seven runs that open a morning.
warmups:
  greet:
    title: Six leads, one incident, and nobody has worked together before
    why: >-
      The response was assembled on Tuesday out of whoever was reachable, and by Friday somebody
      will be signing a release based on a number a stranger produced. Okonjo, the analytical
      chemistry lead, wants you known to as many of the leads as you can before the first sample
      comes in, because a result you cannot attach to a person is a result you will quietly
      re-run.
  trial-near:
    title: Walk Riverton before you sample it
    why: >-
      The city is the reason this is hard: a river through the middle, a works upstream of a
      reservoir, and a container yard nobody has inventoried. Walk the sites once now, while
      nothing is urgent, because a sampling plan drawn from a map puts points where the roads
      are rather than where the water goes.
  follow:
    title: Ferreira walks the river reach once
    why: >-
      Where the plume actually enters the river is not on any drawing at the accuracy anybody
      needs, and Ferreira, the water and sediment lead, can read it off the bank — the colour of
      the silt, where the weed stops. She walks it once this morning. Stay with her, close
      enough to see what she is pointing at and far enough back not to be standing in it.
  hunt:
    title: Six drums on the manifest, four in the yard
    item:
      name: drum
      plural: drums
    why: >-
      The manifest says six drums came off the lorry and the yard holds four. Until the other
      two are found nobody can say what is in the ground, because a drum nobody has located is a
      drum that is either in a skip or leaking somewhere nobody is sampling. Find them.
  canvass:
    title: Who actually drank the tap water
    why: >-
      The advice went out on Wednesday and the exposure estimate depends on whether people
      followed it. Ask along the affected streets until enough answers have come back to tell a
      city that complied from a city that did not, because those two produce very different
      numbers and the same reassuring press line.
  evade:
    title: The site owner who wants a verbal all-clear
    why: >-
      The yard's owner has been at the gate since seven wanting somebody to say the drums are
      inert, and Nakamura, the quality assurance lead, has been plain that nothing is said
      before the assay. Keep out of his way and finish your round. An all-clear given at a gate
      is an all-clear with no laboratory behind it.
  tag:
    title: Catch Brandt before the reactor bay is sealed
    why: >-
      Brandt, the reactions and energy lead, has the only record of what temperature the drum bay
      reached overnight, which is what decides whether the reaction ran or merely warmed. He is
      walking to the bay and once it is sealed for the afternoon nobody is going in. The whole
      kinetics argument rests on a number in his notebook.

# What each place says when the player reads it.
copy:
  WATER: <b>Water Intake Laboratory</b> — The drinking-water intake and the bench beside it. Polarity and intermolecular forces decide what dissolves, what floats as a surface film and what binds to sediment; pH and buffering decide how far a correction actually moves. What this room cannot tell you is where the contaminant went once it left the water column — that answer is in the mud, and it is measured somewhere else.
  GASES: "<b>Air &amp; Plume Station</b> — Mast, sondes and the gas bench. The ideal gas law gives an honest sense of scale: how much volume a release occupies at ambient temperature and pressure. It says nothing about where the material goes. Wind, turbulence, terrain and buoyancy do that, and they change while you are calculating."
  IDENT: <b>Molecular Identification Lab</b> — Chromatography, spectroscopy and the reference library. Separation tells you how many things are present; spectra tell you what they might be. Neither is sufficient alone, and one peak is not automatically one compound. Identity is an evidence package assembled from records, separation and structure together.
  QUANT: <b>Quantitative Analysis &amp; Quality Assurance</b> — Calibration curves, blanks, reference samples and the desk that decides whether a number counts as a result. Dilution, path length and whatever else is in the sample all sit between a signal and a concentration. A measurement without an uncertainty is not yet evidence for a decision.
  ENERGY: <b>Reaction &amp; Thermal Hall</b> — Stoichiometry, calorimetry and kinetics under one roof. Balanced equations bound how much can react; a heat balance separates stored heat from heat still being produced; rate laws and activation energy say how quickly that changes as the vessel warms. All three are needed before anyone enters a confined space.
  TREAT: <b>Pilot Treatment Plant</b> — Oxidation, adsorption and precipitation at pilot scale, with the byproduct bench next door. Every method here lowers the target contaminant. They differ in what they create, what they move into sludge, and what they leave for whoever is monitoring this river in ten years.
  CMD: <b>City Command</b> — Where the mission decision is actually made. The board carries scientific readiness, open high-consequence issues, response credits, and the projection at the deadline. Progress here is not the fraction of questions answered correctly; it is whether the evidence forms one chain that a reviewer could not break.
  RECORDS: <b>Records &amp; Shipping Office</b> — Manifests, supplier lot information and chain-of-custody paperwork. This is evidence that exists before any instrument is switched on, and it is often the cheapest way to eliminate a candidate. A label giving only a common name, with no composition or concentration, is not a record — it is a rumour with letterhead.
  BRIEF: <b>Public Briefing Center</b> — Where the city is told what is known. An uncertainty that survives being repeated has to be stated plainly the first time. A central estimate can be reassuring while the distribution behind it is not.
  YARD: <b>Freight Yard Gatehouse</b> — The fire started here, and several containers beside the river were damaged. The cordon stays until identity and hazard class are established, because an incompatible firefighting or treatment decision is worse than a slow one.
  DRUMS: "<b>The damaged containers</b> — Seven drums, two visibly scorched, none with a usable label. Nobody opens them and nobody identifies a chemical by smell. Composition, charge and provenance come first: secure and inventory, reconcile the records, then measure with validated remote or small-sample methods."
  DOCK: "<b>River sampling point</b> — Surface, mid-depth and sediment samples come off this dock. Where and when you sample decides what you are able to conclude: a surface grab and a sediment core can disagree completely and both be correct about the water they came from."
  READOUT_WATER: <b>Intake chemistry display</b> — pH, conductivity and dissolved concentration at the intake, against the sediment trend beneath it.
  READOUT_GASES: <b>Wind and plume display</b> — Wind speed and direction, stability class, and the current downwind corridor. The corridor is only as fresh as the last wind reading.
  READOUT_IDENT: <b>Spectra and identity display</b> — Chromatogram peaks alongside candidate spectral matches, with the confidence rank for each provisional identity.
  READOUT_QUANT: <b>Calibration and limits display</b> — The working calibration curve, today's blanks, the detection limit and the guard band around the release limit.
  READOUT_ENERGY: <b>Vessel temperature display</b> — Bulk temperature against time, with the cooling capacity drawn as a line the curve must not cross.
  READOUT_TREAT: <b>Treatment train display</b> — Water in and water out for each stage, plus the byproduct and sludge mass that leaves with them.
  BOARD: <b>Response status</b> — Mission, time remaining, scientific readiness and evidence independence, open issues, credits, risk and public trust, with the projection at the deadline. The assumptions behind the projection are inspectable, so a bottleneck can be fixed rather than merely out-spent.

# What is inside each room.
interiors:
  IDENT:
    caption: A name is a claim. A claim needs evidence that could have come out differently.
    standLine: Unlabelled drum from the freight yard. Provisional identity within the hour; confirmation when a second method with a different failure mode agrees.
    station:
      kind: panel
      title: GC-MS bench
      rows:
        - label: Retention time
          value: 7.42 min
          status: normal
        - label: Library match
          value: 91 %
          status: high
        - label: Second method
          value: not yet run
          status: low
        - label: Blank
          value: clean
          status: normal
  GASES:
    caption: Which part of the answer is thermodynamics, and which part is weather.
    standLine: A colourless plume is leaving the yard and the wind turns at about four. Command wants a corridor before it does.
    station:
      kind: vitals
      animated: true
      wave: sine
      rate: 2
      title: Mobile weather station
      status: high
      rows:
        - label: Wind
          value: 3.4
          unit: m/s, from the yard
          status: normal
        - label: Vapour density
          value: 2.1
          unit: × air
          status: alarm
        - label: Mixing
          value: poor
          unit: still, cold night
          status: high
  WATER:
    caption: Ask where the contaminant went. Never whether it disappeared.
    standLine: The water column reads cleaner every hour and the sediment core has not been opened yet. One of those is a measurement.
    station:
      kind: panel
      title: River & sediment
      rows:
        - label: Water column
          value: 0.8 µg/L
          status: normal
        - label: Sediment, 0–5 cm
          value: 46 µg/kg
          status: alarm
        - label: Organic carbon
          value: 3.1 %
          status: high
        - label: Flow at intake
          value: 11 m³/s
          status: normal
  QUANT:
    caption: The decision rule is written before the measurement arrives.
    standLine: A result of 4.7 against a limit of 5, with a spread of ±2. The question is not the number. It is whether the number decides anything.
    station:
      kind: panel
      title: Quality assurance desk
      rows:
        - label: Reading
          value: "4.7"
          status: high
        - label: Uncertainty
          value: ± 2.0
          status: alarm
        - label: Limit
          value: "5.0"
          status: normal
        - label: Calibration
          value: bracketed, in range
          status: normal
        - label: Blank
          value: clean
          status: normal
  ENERGY:
    caption: A slow reaction in a warm vessel is a different event from the same reaction in a cool one.
    standLine: Drum in afternoon sun, 30 degrees above the one in shade. Nobody enters the space until there is a gas-production estimate.
    station:
      kind: vitals
      animated: true
      wave: resp
      rate: 1.5
      title: Vessel monitor
      status: alarm
      rows:
        - label: Skin temperature
          value: 54
          unit: °C, rising
          status: alarm
        - label: Headspace
          value: 38
          unit: "% of lower limit"
          status: high
        - label: Rate doubling
          value: 10
          unit: °C per doubling
          status: normal
  TREAT:
    caption: Every option comes with the byproduct, the sludge and the destination attached.
    standLine: Carbon takes it out of the water and into a bed. Stripping takes it out of the water and into the air. Neither destroys anything.
    station:
      kind: panel
      title: Pilot treatment train
      rows:
        - label: Removal, target compound
          value: 99.1 %
          status: normal
        - label: Off-gas, stripper
          value: to atmosphere
          status: alarm
        - label: Spent carbon
          value: 1.2 t, no destination
          status: high
        - label: Byproducts screened
          value: not yet
          status: low

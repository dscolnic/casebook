      - group: QUANT
        call: Close the verification gaps
        task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
        title: Close the verification gaps
        place: Water Distribution Network
        setup: Match each weakness to the needed evidence.
        scene: A number can be perfectly valid and still fail to answer the question that was asked. Nakamura carries the evidence package in herself — the distribution network is about to be brought back up to pressure on its strength.
        story: "A number can be perfectly valid and still fail to answer the question that was asked. Verification has three separate weak points: whether the samples represent the exposure people will actually receive, whether the method's detection limit is low enough to test the standard at all, and whether what was measured is the compound the standard is about. Each weakness has its own remedy and they do not substitute for one another. The distribution network is about to be brought back up to pressure on the strength of this evidence package."
        assumes:
          - a sample tells you about the place and the moment it was taken
        takeaway: A compliant number is meaningful only if the sampling and method address the actual decision.
        format: PROTOCOL
        why: Verification has several separate weak points and each has its own remedy. Sampling only the treatment plant leaves the endpoints and vulnerable zones untested, and those are where people actually drink. Sampling after long flushing measures water nobody will receive, so the flushing has to be documented and realistic use conditions sampled. A detection limit above the release limit cannot test the standard at all. And one laboratory doing both the optimisation and the verification has marked its own work.
        rebuttals:
          - Sampling only the water leaving the plant misses the endpoints and vulnerable zones where the exposure actually happens. Sample where people drink.
          - Samples taken after long flushing describe water nobody receives. Document the flushing and sample under realistic use.
          - A detection limit above the release limit cannot test the standard. A more sensitive validated method is the only fix.
          - One laboratory optimising and then verifying its own treatment is marking its own work. That gap is closed by independent review, not by better chemistry.
        columns:
          - The gap in the evidence
          - How you close it
        scenarios:
          - Only the water leaving the treatment plant was sampled.
          - Samples from the pipe network were collected after long flushing.
          - The method detection limit exceeds the release limit.
          - The same laboratory tuned the treatment and then checked the final results.
        choices:
          - Sample representative endpoints and vulnerable zones.
          - Document flushing and sample under realistic use conditions.
          - Use a more sensitive validated method.
          - Add an independent check or review.
        mapping: [0, 1, 2, 3]
        guide: The left column is four separate weak points in a verification package. Each has its own remedy. Pair them by asking what specifically was not tested. Sampling only the plant leaves the endpoints untested. Sampling after long flushing measures water nobody receives. A detection limit above the release limit cannot test the standard at all. The network goes back up to pressure on this evidence.
        background:
          - Why this is a matching board and not four separate questions. Responses on boards like this are written to be plausible for more than one situation, so choosing them one at a time lets a nearly-right answer through unexamined. Having to place all of them forces the comparison — not "is this reasonable here", but "is it more right here than there".
          - How to use the one-each rule. Because the responses are a set to be distributed rather than a list to be sampled, every join you make constrains the rest. Settling the two you are confident of can leave the remaining pair decided by elimination. Where it does not, two responses are still competing for one situation, and that is exactly the distinction the stop is testing.
          - "Why you cannot be wrong about exactly one. With every response used once, three correct joins leave the fourth with only one place to go. Any error therefore involves at least two joins. That is worth remembering when the last pair looks forced: the fault is usually not in the join you are struggling with, but in one you made early and stopped questioning."
        concept: "Measurement: significant figures, blanks, detection limits, uncertainty"
        answerText: 1. Only the water leaving the treatment plant was sampled. → Sample representative endpoints and vulnerable zones. 2. Samples from the pipe network were collected after long flushing. → Document flushing and sample under realistic use conditions. 3. The method detection limit exceeds the release limit. → Use a more sensitive validated method. 4. The same laboratory tuned the treatment and then checked the final results. → Add an independent check or review.
      - group: QUANT
        call: Approve, condition, or hold
        task: Use the follow-up evidence to move or narrow the uncertainty band, then decide whether the valves can be opened under the release criterion.
        title: Approve, condition, or hold
        place: Independent Review Board
        setup: The verification result is 9 units against a limit of 10, plus or minus 2. What does the board decide?
        question: Can the whole plausible band be brought below the limit, or only its central value? Place the bars to report the mean and its one-sigma uncertainty.
        scene: Distribution pumps are idle while the board meets. The verification result is 9 units against a limit of 10, plus or minus 2. Reyes has operators waiting at the valves, and the city has already been given two different reopening times.
        story: The review board's decision is not binary, and treating it as though it were is how emergencies end badly in both directions — a premature release exposes the city, an indefinite hold deprives hospitals and homes of water they need now. A conditional approval with monitoring, staged reopening and defined triggers is a way of acting under uncertainty without pretending it has been resolved. What the board decides has to be defensible to a city that has been told several things already.
        assumes:
          - the displayed width is the uncertainty band used for this decision
          - a central value below a limit does not pass when the supported range crosses the limit
        takeaway: Changing a best estimate and reducing uncertainty are different operations; a boundary decision depends on where the full supported range lies.
        format: CLOUD
        why: The initial result is 9 ± 2, so its supported range reaches to 11 and crosses the limit of 10. An independent rerun can move the centre without proving the original uncertainty was too wide. Representative sampling can narrow the range without changing the central estimate. In this authored case, neither action alone clears the boundary. Together they produce 8.6 ± 1.0, whose upper edge is 9.6. Only then does the evidence support an unconditional numerical pass rather than a reversible policy decision under unresolved uncertainty.
        cloud:
          bounds:
            min: -16
            max: 10
            unit: ""
            label: ""
          centre: 9
          spread: 1
          pass: 0.95
          seed: 1
          costUnit: h
          actions:
            - id: independent
              label: Independent laboratory rerun
              effect: shift
              amount: 0.03333333333333333
            - id: representative
              label: Representative endpoint sampling
              effect: narrow
              amount: 0.5
          hint: Apply the available follow-up evidence and watch both the centre and the width. The release criterion is cleared only when the entire displayed band lies below the boundary.
          commit: Declare it ready
        guide: "The band on screen is every result the measurement permits, not the one most likely — nine against a limit of ten, give or take two, so part of it is over the limit. Two pieces of follow-up work are available, and each does something different to the band: watch what happens to its middle and to its width separately. Apply what you would authorise, then say whether the release criterion is met."
        background:
          - "What the band is. A single number with a plus-or-minus on it is a claim about a range: any value inside is consistent with what was measured. Reporting only the middle throws that away. The board is not asking whether the best estimate is under the limit — it is asking whether a result over the limit has been ruled out."
          - "Moving the middle is not narrowing the band. A rerun that finds a bias corrects where the band sits and leaves its width alone: the same uncertainty, somewhere else. Only new information — more samples, a better method, an independent measurement — makes the band narrower. Both are useful; only one of them can clear a limit that the width is crossing."
          - What is riding on the difference. Distribution pumps are idle and the city has already been given two reopening times. A decision taken on the middle alone reopens the network with a real chance of being over the limit, and the second retraction costs more than the first did.
        concept: "Measurement: significant figures, blanks, detection limits, uncertainty"
        answerText: "Neither follow-up alone clears the strict limit. Apply both: the band becomes 8.6 ± 1.0, so its upper edge is 9.6 and the full supported range lies below 10."
  - title: Reopen the City
    objective: Deliver a claim-by-claim chemical evidence package and a long-term monitoring plan.
    briefing: The final board must explain what was released, how chemicals moved and changed, which treatments worked, and what contamination remains in solids, infrastructure, and ecosystems. Without a complete fate and uncertainty record, the city cannot know whether the emergency is over or merely hidden.
    stake: Seven weeks in. The mayor wants one word tonight and Mbeki has to put it on a screen behind him. Behind that word sits everything your teams have concluded in seven weeks, and those conclusions are not equally strong. Stavros wants the monitoring programme funded before the emergency budget closes on Friday; nobody else in the room has mentioned it. Today you take the claims one at a time — what was measured, what was worked out from it, what is still open — and decide what the city keeps paying for after everyone goes home. The sentence people quote back to you for years is usually the one you were least sure of.
    takeaway: Deliver a claim-by-claim chemical evidence package and a long-term monitoring plan.
    stops:
      - group: TREAT
        call: Disposition the final chemical claims
        task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
        title: Disposition the final chemical claims
        place: Scientific Review Hall
        setup: Match each evidence state to the correct recommendation.
        scene: The city wants one sentence tonight and Mbeki has to put it on the screen. The chemistry does not support one — collapsing everything into a single green light is how a site gets reoccupied above a problem nobody wrote down.
        story: "The city wants one sentence and the chemistry does not support one. At the end of a release the evidence is in several different states at once: some claims are established and can be closed, some are unresolved and need work, some are managed by a control that has to keep being funded, and some are simply unknown. Each of those calls for a different recommendation, and collapsing them into a single green light is how a site gets reoccupied above a problem nobody wrote down."
        assumes:
          - evidence comes in strengths, and a claim inherits the weakest one under it
        takeaway: Chemical readiness is claim-by-claim, not a single green light.
        format: PROTOCOL
        why: At the end of a release the evidence is in several states at once, and each calls for a different recommendation. An identity confirmed by independent methods with controls is established and can be closed. A transformation product that is plausible but has no validated standard is provisional, and saying so is what keeps the record honest. Filtered water meeting criteria over contaminated sediment is a control that has to keep being funded. And corrosion held inside a narrow chemistry window is conditional operation with triggers.
        rebuttals:
          - Identity confirmed by independent methods with controls is the strongest claim here. Document the methods and treat it as established.
          - A plausible transformation product with no validated standard cannot be quantified yet. Label it provisional and keep developing the method.
          - Clean filtered water above contaminated sediment is a managed condition, not a resolved one. The management is what has to continue.
          - Corrosion controlled only inside a narrow chemistry range is conditional operation. The condition needs triggers, or it is just a hope.

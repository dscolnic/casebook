  - title: The Concentration Problem
    objective: Produce concentration maps whose units, detection limits, and quality controls are explicit.
    briefing: City leaders ask whether the contaminant is "high," but samples differ in dilution, path length, and what else is in the sample. The team must turn signals into defensible concentrations. An incorrect concentration map can either close a safe water system or expose residents through a false reassurance.
    stake: Day six, and this is where the utility director, Marisol Reyes, and her quality assurance lead, Rie Nakamura, stop agreeing. The results are back as numbers and the city is holding each one against a legal limit, one water system at a time. Nakamura wants every result re-run before anything reopens. Reyes points out that four systems are shut on numbers nobody has questioned, hospitals are on tankers, and a week of caution has a cost too — and today she is right. Today you turn readings into what was really in the river, decide whether one result can be trusted, and choose where to sample. Outside the calibrated range nobody has checked what the instrument does at all.
    takeaway: Produce concentration maps whose units, detection limits, and quality controls are explicit.
    stops:
      - group: QUANT
        call: Undo the dilution
        task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation. Estimate the original concentration.
        title: Undo the dilution
        place: Quantitative Analysis Lab
        setup: A river sample is diluted before analysis.
        question: Estimate the original concentration.
        scene: The instrument reports what was in the vial, not what was in the river. City leaders are comparing your number against a threshold and closing or opening a water system with it.
        story: The instrument reports what was in the vial, not what was in the river. Samples are diluted so that the signal falls inside the range the method can actually measure, and the analyst has to carry that factor back through before the number means anything about the water — a tenfold dilution reported as-is understates the river by a factor of ten. Sample preparation is part of the result, not something that happened to it beforehand. City leaders are comparing the number you hand over against a threshold and closing or opening a water system with it.
        assumes:
          - diluting a sample lowers its concentration by a known factor
        takeaway: Sample preparation is part of the quantitative result.
        format: BALLPARK
        why: Samples are diluted so the signal lands inside the range the method can measure. That factor has to be carried back through before the number says anything about the river. A tenfold dilution reported as measured understates the river ten times over — and the report still looks like a valid result, because nothing about the number says it was diluted. Preparation is part of the answer, not something that happened to it first.
        estimate:
          prompt: The laboratory diluted the river sample before it went on the instrument. The number on the screen is not the number the city asked for.
          question: Estimate the original concentration in the river sample.
          labels:
            - 2.5 mg/L  (measured, diluted)
            - 100.0 mL  (final volume)
            - 10.0 mL  (sample taken)
            - 0.25 mg/L  (instrument detection limit)
            - 1,000 mL  (bottle volume)
          values: [2.5, 100, 10, 0.25, 1000]
          slots: 3
          template: "{0} × {1} ÷ {2}"
          formula: a*b/c
          correct: [0, 1, 2]
          target: 25
          tolerance: 2
          units: mg/L
          solution: C_original = 2.5 × 100.0 / 10.0 = 25 mg/L.
          explanation: A ten-fold dilution has to be undone before the result is compared with any threshold. Reporting the diluted figure understates the river by a factor of ten.
          givens:
            - 10.0 mL sample diluted to 100.0 mL
            - Measured diluted concentration = 2.5 mg/L
          relationship: C_original V_sample = C_diluted V_final.
        answerText: C_original = 2.5×100/10 = 25 mg/L.
      - group: QUANT
        call: Protect the calibration
        task: The instrument returned a number. Which explanation fits the calibration, the blank and the spike together?
        title: Protect the calibration
        place: River Mapping Center
        setup: Match each problem to the correction.
        scene: An instrument will return a number for almost anything you put in front of it. The panel in front of you has everything needed to decide whether this reading can be defended.
        story: An instrument will return a number for almost anything you put in front of it, which is why quality control exists. A calibration curve is a claim about a specific range of concentrations, built from standards that bracket that range; a blank says whether the laboratory contributed to the signal; a spike recovery says whether the matrix is suppressing or enhancing the response; replicates say whether the measurement is stable at all. Each of them fails in a distinct way, and the panel in front of you contains everything you need to decide whether this reading can be defended.
        assumes:
          - a calibration curve is built from standards covering a particular range
        takeaway: A numerical display does not guarantee a valid concentration.
        format: DIAGNOSIS
        why: Each quality control fails in its own distinct way, which is what makes them readable together. A blank says whether the laboratory contributed to the signal. A spike recovery says whether the matrix is suppressing or enhancing the response. Replicates say whether the measurement is stable. And the curve itself is a claim about a specific range of concentrations — linearity is a property of the interval that was measured, not a promise about everything above it. Detectors saturate, and a reading past the top standard extrapolates a relationship nobody verified.
        rebuttals:
          - Interference from the rest of the sample would show as poor spike recovery. Recovery is 97%, so the river matrix is behaving.
          - A contaminated blank would read high. This one reads 0.01, and it would in any case lift the standards along with the sample.
          - Imprecision would show as replicate scatter. These agree to ±1.5%; the result is repeatable, it is simply repeatable and unverified.
          - Extending the line past the last standard is the specific mistake this panel is built around. r² = 0.999 describes the fit between 0 and 10 mg/L and says nothing about 13.7.
        figure:
          kind: line
          xLabel: Concentration of standard (mg/L)
          yLabel: Absorbance
          caption: Today’s calibration curve, with the sample’s absorbance drawn across it.
          limit:
            at: 0.98
            label: top standard
          series:
            - name: Standards
              points:
                - [0, 0.01]
                - [2, 0.2]
                - [4, 0.4]
                - [6, 0.6]
                - [8, 0.79]
                - [10, 0.98]
            - name: This sample
              points:
                - [0, 1.34]
                - [10, 1.34]
        headline: The river sample reads 1.34 absorbance. The highest calibration standard reads 0.98.
        readings:
          - zone: Sample
            label: Absorbance
            value: "1.34"
            status: alarm
            note: Above every standard on the curve.
          - zone: Calibration
            label: Highest standard
            value: 0.98 at 10 mg/L
            status: normal
          - zone: Calibration
            label: Curve linearity
            value: r² = 0.999 to 10 mg/L
            status: normal
            note: The curve is excellent — within the range it covers.
          - zone: Blank
            label: Calibration blank
            value: 0.01 absorbance
            status: normal
            note: Clean. No contamination baseline.
          - zone: QC
            label: Matrix spike recovery
            value: 97%
            status: normal
            note: The river matrix is not suppressing the signal.
          - zone: QC
            label: Replicate scatter
            value: ±1.5%
            status: normal
            note: Precision is fine. The result is repeatable.
        choices:
          - label: The result is outside the calibrated range
            mechanism: Above the top standard the instrument response is unverified, so converting 1.34 to a concentration extrapolates a relationship nobody measured.
          - label: Something else in the sample is inflating the reading
            mechanism: Something in the river water adds absorbance the analyte did not produce.
          - label: The blank is contaminated
            mechanism: A dirty baseline lifts every reading in the batch.
          - label: The measurement is imprecise and should be repeated
            mechanism: Scattered replicates mean the number cannot be trusted as it stands.
          - label: The reading is fine; report 13.7 mg/L by extending the line
            mechanism: The curve is linear with r² = 0.999, so it can be extended past the last standard.
        answer: The result is outside the calibrated range
      - group: QUANT

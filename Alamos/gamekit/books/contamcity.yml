        call: Resolve the ambiguous peak
        task: One peak is still ambiguous and the review board wants it settled. What settles it?
        title: Resolve the ambiguous peak
        place: Reference Library
        setup: One peak is still ambiguous and the review board wants it settled. What settles it?
        scene: 1 peak at 4.2 minutes matches 2 candidates to within 0.05 minutes, and Ana Kowalski, who keeps the reference library, has both on the shortlist. The river sample also carries humic matter, chloride at 40 mg/L, and a detergent from the fire foam.
        story: "One peak is still ambiguous and the review board wants it settled. There are two honest ways to resolve an overlap — improve the separation so the components stop coming off the column together, or bring in evidence that could not fail the same way, so the identification no longer depends on the separation at all — and one dishonest way, which is to present the same weak data more attractively. Matrix effects sit underneath all of it: the river is not clean solvent, and everything in it is competing for the instrument's attention."
        assumes:
          - two compounds that overlap in one method may not overlap in another
        takeaway: Better presentation cannot repair a method that was fooled, or evidence that was never validated.
        format: CHOICE
        why: "There are two honest ways out of an overlap. Improve the separation until the components stop coming off the column together, or bring in evidence of a different kind so the answer no longer depends on the separation at all. The second is faster, and it cannot inherit the problem: a method that identifies by structure does not care that two compounds travelled at the same speed. The third way is to present the same weak data more attractively, and it adds no measurement."
        rebuttals:

        takeaway: A treatment train is ordered by what each stage leaves the next one to work with.
        format: SEQUENCE
        why: A treatment train is not four independent machines. Each stage changes the chemical form reaching the next stage. Oxidation must first create the metal state that can form an insoluble hydroxide. The pH adjustment then creates that solid. Only after a solid exists can settling and filtration remove it. Activated carbon belongs last as a polishing step for material that remains dissolved. Sending suspended solids to carbon too early can blind the bed and disable everything downstream.
        rebuttals:
          - Oxidise first. Precipitation has nothing to work with until the metal is in the oxidation state that forms an insoluble hydroxide.
          - Raise the pH second, into the window where that hydroxide is least soluble. This is the step that actually makes the solid.
          - Settle and filter third, once there is a solid to remove. Filtering dissolved metal removes nothing.
          - Carbon last, as polishing. Send solids to a carbon bed and it blinds within hours, and everything downstream of it stops.
        cards:
          - Oxidise the dissolved metal to the oxidation state that forms an insoluble hydroxide.
          - Raise the pH to the window where that hydroxide is least soluble.
          - Settle and filter, taking the solid out of the water.
          - Polish the filtered water on activated carbon for what stayed dissolved.
        order: [0, 1, 2, 3]
        guide: These four are not independent machines. Each changes the chemical form that reaches the next. Ask of each card what has to exist before it can do anything at all. Nothing can be settled or filtered until there is a solid. There is no solid until the metal is in the right state at the right pH. Riverton has one intake and cannot run this twice.
        background:
          - "Why the order is graded whole. A sequence is a claim about dependency: each step is here because the one before it has already happened, or has to have. One transposed pair falsifies that claim wherever it sits, so partial credit would be credit for a sequence that does not work."
          - Why the ends are the place to start. The first and last cards are constrained by having nothing before or after them, which usually makes them the two you can settle from the scene alone. Pinning them collapses the remaining arrangements sharply, and what is left in the middle is where the actual judgement lives.
          - What the rail can be ordered on. Time is the usual axis, but it is not the only one. An order can run on cost, on risk, or on reversibility — every observation that leaves the sample as it was, before any that consumes it. On those boards a chronological reading finds nothing, because none of the steps has to happen at a particular hour.
        concept: Solubility, precipitation and complexation
        answerText: 1. Oxidise the dissolved metal to the oxidation state that forms an insoluble hydroxide. 2. Raise the pH to the window where that hydroxide is least soluble. 3. Settle and filter, taking the solid out of the water. 4. Polish the filtered water on activated carbon for what stayed dissolved.
      - group: TREAT
        call: Choose the safest pilot program
        task: All three methods claim removal. What does the pilot have to measure?
        title: Choose the safest pilot program
        place: Waste Management Office
        setup: All three methods claim removal. What does the pilot have to measure?
        scene: The pilot has room for one question, four weeks, and a tenth of the full-scale flow. Nakamura marks three of the four proposals as resting on the same unmeasured quantity, and the full plant is committed in June whatever the pilot says.
        story: The pilot programme is the last point at which being wrong is cheap. What it needs to test is not which method removes the most contaminant — all three claim that — but which one's total hazard is smallest once byproducts, residuals and the lifecycle of the waste are counted. That means comparing mechanisms honestly, analysing for the products a mechanism would predict rather than only for the target, and running long enough for slow effects to show. The pilot has room for one question, and it should be the one that would change the decision.
        assumes:
          - a method that removes a compound has to put it somewhere
        takeaway: The best treatment minimizes total hazard, not merely one measured concentration.
        format: CHOICE
        why: "Every method on the table removes the target — that is why they are on the table. What separates them is what they leave behind: transformation products, residuals, and the lifecycle of the waste. A pilot that measures only the target compound cannot see the difference it was run to find, and judged on removal alone it will pick whichever method makes the most byproduct fastest. The right question is the one that would change the decision, and here that means analysing for the products each mechanism predicts."
        rebuttals:
          - Comparing removal under representative chemistry is the comparison, and judged on the target alone it will pick whichever method makes the most byproduct fastest.
          - Whether the media wears out, and where the waste goes, matter — and they come once a method is short-listed. They describe the lifecycle of a choice already made.
          - Optimising removal at any dose is the narrow optimisation that produced a sludge with 20 kilograms unaccounted for.
        choices:
          - The transformation products, and the stand-ins that track how toxic they are.
          - Removal of the target compound under representative water chemistry.
          - Whether the media wears out, whether it can be recharged, and where the used solids go.
          - The highest achievable removal, at whatever dose it takes.
        answer: The transformation products, and the stand-ins that track how toxic they are.
        guide: Every method on the table removes the target compound, which is why all of them are on the table. So a pilot measuring removal cannot see the difference it was run to find. Ask of each option what it would tell you that the others would not, and whether it would change the June decision. Judged on removal alone, the winner is whichever method makes the most byproduct fastest.
        background:
          - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
          - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
          - "What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested."

        choices:
          - label: Sunlight is converting the remaining vapour into a secondary product
            mechanism: The product rises as the primary falls, peaks two hours after peak sun, and appears downwind rather than at the fence.
          - label: A second, uncontrolled release has started
            mechanism: A new source would explain rising concentrations in the neighbourhood.
          - label: The monitors share an inlet artefact
            mechanism: Identical inlet material across the network can generate the same false signal everywhere.
          - label: The wind reversed and carried the plume back over the neighbourhood
            mechanism: A wind shift moves the corridor without changing the chemistry.
          - label: Exposure is over; the source is sealed and the primary vapour is falling
            mechanism: Once the release stops, the hazard decays with it.
        answer: Sunlight is converting the remaining vapour into a secondary product
      - group: GASES
        call: Monitor the transformed plume
        task: Residents want to come home. What does the monitoring plan measure?
        title: Monitor the transformed plume
        place: Neighborhood Health Desk
        setup: Residents want to come home. What does the monitoring plan measure?
        scene: Residents want to come home. The released compound is down to 3 parts per billion at both monitors, but total oxidant is up fourfold since Tuesday and the afternoon readings are the high ones. The source has been sealed for six days.
        story: What is in the air now is not what was released, and a monitoring plan built around the original compound will report an improving situation while exposure rises. Designing for transformation means measuring chemical families rather than a single target, measuring the environmental drivers that control the chemistry, and keeping enough temporal resolution to see a pattern instead of a daily average. The invisible half of an air emergency outlasts the visible half, and the neighbourhood's trust does not survive being told twice that it is over.
        assumes:
          - a monitoring plan can only find what it is looking for
        takeaway: Invisible secondary chemistry can outlast the visible emergency.
        format: CHOICE
        why: "The source is shut and the exposure is now being made in the air. So a plan built around the original compound will report a steadily improving picture while what people are breathing climbs. Designing for transformation means three things: measure the chemical families the mechanism predicts rather than one target, measure the drivers that control the chemistry, and keep enough time resolution to see a pattern instead of a daily average. The invisible half of an air emergency outlasts the visible half."
        rebuttals:
          - More stations measuring the primary vapour measure a quantity that is already falling, more precisely.
          - Sunlight and oxidant data explain the pattern and are what make the chemistry predictable. They are nobody’s exposure.
          - "Stopping when the plume becomes invisible is what the day-and-night trace already disproved: the peak arrived nine hours after the yard was sealed."
        choices:
          - The predicted secondary products, as well as the compound that was released.
          - The released compound, at more stations and more often.
          - Sunlight, oxidants and the weather.
          - Nothing further — the visible plume has gone and the source is sealed.
        answer: The predicted secondary products, as well as the compound that was released.
  - title: Can the Water Be Released?
    objective: Make a transparent release decision with conditional monitoring and explicit treatment of borderline results.
    briefing: Treatment results cluster near the decision threshold. The player must account for uncertainty, detection limits, and sampling representativeness before reopening the water system. A premature release exposes the city; an unnecessary hold can deprive hospitals and homes of essential water.
    stake: "Day forty-five, and Nakamura gets her day. The verification results are in and one sits just under the limit — and it is the re-run of a sample whose first quality check failed. She has the instrument's own repeatability from forty duplicate runs and would like somebody to look at it. Reyes has schools and two hospitals on tankers and wants the release signed this morning. Today you decide: release, release with conditions, or hold. Nakamura's name is on that form under Reyes's. Both mistakes are real, and they are not the same size."
    takeaway: Make a transparent release decision with conditional monitoring and explicit treatment of borderline results.
    stops:
      - group: QUANT
        call: A borderline result
        task: Two candidates differing by one oxygen. What settles it, and how?
        title: Reading a mass spectrum
        place: Quantitative Analysis Suite
        scene: Two candidate compounds fit the chromatography equally well. Their formulas differ by one oxygen, and the mass spectrometer has already run the sample.
        assumes:
          - a molecule's formula fixes its mass
        takeaway: A mass spectrum measures mass-to-charge, which distinguishes formulas that other methods cannot.
        format: CHOICE
        why: A mass spectrometer sorts ions by mass divided by charge, so the molecular ion tells you the molecular mass directly — and one oxygen is 16 mass units, which is far beyond the instrument's resolution. Retention time is a property of the separation and can coincide for different compounds, which is why the two candidates were still on the table. Peak area is quantity, not identity. This is the step that turns a shortlist into a name, and it is why identification is not left to chromatography alone.
        rebuttals:
          - Retention order follows chemistry, not mass; heavier compounds sometimes elute first.
          - Response factor varies by compound and says nothing about which compound it is.
          - A 16-unit difference is exactly what mass spectrometry resolves easily.
        choices:
          - The molecular ion's mass-to-charge ratio, which differs by 16 between them.
          - The retention time, since the heavier compound always elutes later.
          - The peak area, since the heavier compound gives the larger response.
          - Neither can be settled by mass, because both are the same class of compound.
        answer: The molecular ion's mass-to-charge ratio, which differs by 16 between them.
      - group: QUANT
        call: Close the verification gaps
        task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
        title: Close the verification gaps
        place: Water Distribution Network
        setup: Match each weakness to the needed evidence.
        scene: A number can be perfectly valid and still fail to answer the question that was asked. The distribution network is about to be brought back up to pressure on the strength of this evidence package.
        story: "A number can be perfectly valid and still fail to answer the question that was asked. Verification has three separate weak points: whether the samples represent the exposure people will actually receive, whether the method's detection limit is low enough to test the standard at all, and whether what was measured is the compound the standard is about. Each weakness has its own remedy and they do not substitute for one another. The distribution network is about to be brought back up to pressure on the strength of this evidence package."
        assumes:
          - a sample tells you about the place and the moment it was taken
        takeaway: A compliant number is meaningful only if the sampling and method address the actual decision.
        format: PROTOCOL
        why: Verification has several separate weak points and each has its own remedy. Sampling only the treatment plant leaves the endpoints and vulnerable zones untested, and those are where people actually drink. Sampling after long flushing measures water nobody will receive, so the flushing has to be documented and realistic use conditions sampled. A detection limit above the release limit cannot test the standard at all. And one laboratory doing both the optimisation and the verification has marked its own work.
        rebuttals:
          - Sampling only the water leaving the plant misses the endpoints and vulnerable zones where the exposure actually happens. Sample where people drink.
          - Samples taken after long flushing describe water nobody receives. Document the flushing and sample under realistic use.
          - A detection limit above the release limit cannot test the standard. A more sensitive validated method is the only fix.
          - One laboratory optimising and then verifying its own treatment is marking its own work. That gap is closed by independent review, not by better chemistry.
        columns:
          - The gap in the evidence
          - How you close it
        scenarios:
          - Only the water leaving the treatment plant was sampled.
          - Samples from the pipe network were collected after long flushing.
          - The method detection limit exceeds the release limit.
          - The same laboratory tuned the treatment and then checked the final results.
        choices:
          - Sample representative endpoints and vulnerable zones.
          - Document flushing and sample under realistic use conditions.
          - Use a more sensitive validated method.
          - Add an independent check or review.
        mapping: [0, 1, 2, 3]
        answerText: 1. Only the water leaving the treatment plant was sampled. → Sample representative endpoints and vulnerable zones. 2. Samples from the pipe network were collected after long flushing. → Document flushing and sample under realistic use conditions. 3. The method detection limit exceeds the release limit. → Use a more sensitive validated method. 4. The same laboratory tuned the treatment and then checked the final results. → Add an independent check or review.
      - group: QUANT
        call: Approve, condition, or hold
        task: The verification result is 9 units against a limit of 10, plus or minus 2. What does the board decide?
        title: Approve, condition, or hold
        place: Independent Review Board
        setup: The verification result is 9 units against a limit of 10, plus or minus 2. What does the board decide?
        scene: The verification result is nine units against a limit of ten, plus or minus two. The board has been asked for one word, and the city has been told several things already.
        story: The review board's decision is not binary, and treating it as though it were is how emergencies end badly in both directions — a premature release exposes the city, an indefinite hold deprives hospitals and homes of water they need now. A conditional approval with monitoring, staged reopening and defined triggers is a way of acting under uncertainty without pretending it has been resolved. What the board decides has to be defensible to a city that has been told several things already.
        assumes:
          - a decision can be reversible or irreversible, and that matters
        takeaway: High-stakes release decisions should be granular, traceable, and reversible.
        format: CHOICE
        why: "The plausible range crosses the limit, so neither a yes nor a no is supported by the number. Treating the choice as binary fails both ways: release too early and the city is exposed, hold with no end and the hospitals go without water they need now. A conditional release with tighter monitoring and named triggers is how a decision gets made under uncertainty without pretending it is resolved. The triggers are what make it reversible when the next result is worse."
        rebuttals:
          - More representative sampling is exactly what the condition should require, and on its own it holds the water off for days the hospitals do not have.
          - Independent confirmation answers whether the number is right. It does not answer what to do while the question is open.
          - Releasing on the central value is the decision the plus-or-minus exists to prevent, and it is the one that cannot be walked back.
        choices:
          - Conditional release, with intensified monitoring and defined triggers.
          - Hold until additional representative sampling is complete.
          - Hold until an independent laboratory confirms the result.
          - Release, since the central value is below the limit.
        answer: Conditional release, with intensified monitoring and defined triggers.
  - title: Reopen the City
    objective: Deliver a claim-by-claim chemical evidence package and a long-term monitoring plan.
    briefing: The final board must explain what was released, how chemicals moved and changed, which treatments worked, and what contamination remains in solids, infrastructure, and ecosystems. Without a complete fate and uncertainty record, the city cannot know whether the emergency is over or merely hidden.
    stake: Day fifty-two. The mayor wants one word tonight and Mbeki has to put it on a screen behind him. Behind that word sits everything your teams have concluded in seven weeks, and those conclusions are not equally strong. Stavros wants the monitoring programme funded before the emergency budget closes on Friday; nobody else in the room has mentioned it. Today you take the claims one at a time — what was measured, what was worked out from it, what is still open — and decide what the city keeps paying for after everyone goes home. The sentence people quote back to you for years is usually the one you were least sure of.
    takeaway: Deliver a claim-by-claim chemical evidence package and a long-term monitoring plan.
    stops:
      - group: TREAT
        call: Disposition the final chemical claims
        task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
        title: Disposition the final chemical claims
        place: Scientific Review Hall
        setup: Match each evidence state to the correct recommendation.
        scene: The city wants one sentence and the chemistry does not support one. Collapsing everything into a single green light is how a site gets reoccupied above a problem nobody wrote down.
        story: "The city wants one sentence and the chemistry does not support one. At the end of a release the evidence is in several different states at once: some claims are established and can be closed, some are unresolved and need work, some are managed by a control that has to keep being funded, and some are simply unknown. Each of those calls for a different recommendation, and collapsing them into a single green light is how a site gets reoccupied above a problem nobody wrote down."
        assumes:
          - evidence comes in strengths, and a claim inherits the weakest one under it
        takeaway: Chemical readiness is claim-by-claim, not a single green light.
        format: PROTOCOL
        why: At the end of a release the evidence is in several states at once, and each calls for a different recommendation. An identity confirmed by independent methods with controls is established and can be closed. A transformation product that is plausible but has no validated standard is provisional, and saying so is what keeps the record honest. Filtered water meeting criteria over contaminated sediment is a control that has to keep being funded. And corrosion held inside a narrow chemistry window is conditional operation with triggers.
        rebuttals:
          - Identity confirmed by independent methods with controls is the strongest claim here. Document the methods and treat it as established.
          - A plausible transformation product with no validated standard cannot be quantified yet. Label it provisional and keep developing the method.
          - Clean filtered water above contaminated sediment is a managed condition, not a resolved one. The management is what has to continue.
          - Corrosion controlled only inside a narrow chemistry range is conditional operation. The condition needs triggers, or it is just a hope.
        columns:
          - What the evidence supports
          - What you do with it
        scenarios:
          - Identity confirmed by independent methods and controls.
          - A transformation product is plausible but lacks a validated standard.
          - Filtered water meets criteria, but sediment remains contaminated.
          - Pipeline corrosion is controlled only while chemistry remains within a narrow range.
        choices:
          - Treat identity as established with documented methods.
          - Label provisional and continue method development.
          - Keep managing the sediment, and keep watching for the metal coming back.
          - Use conditional operation with chemistry and corrosion triggers.
        mapping: [0, 1, 2, 3]
        answerText: 1. Identity confirmed by independent methods and controls. → Treat identity as established with documented methods. 2. A transformation product is plausible but lacks a validated standard. → Label provisional and continue method development. 3. Filtered water meets criteria, but sediment remains contaminated. → Keep managing the sediment, and keep watching for the metal coming back. 4. Pipeline corrosion is controlled only while chemistry remains within a narrow range. → Use conditional operation with chemistry and corrosion triggers.
      - group: TREAT
        call: Build the public chemistry narrative
        task: Six hours at forty amperes. What does that fix about the amount of metal removed?
        title: What the current actually removes
        place: Treatment Plant Gallery
        scene: The electrochemical polishing cell has run for six hours at forty amperes. Before the plant trusts the number for the water leaving it, it wants to know how much metal that should have taken out.
        assumes:
          - an electric current is a flow of charge, and charge is countable
        takeaway: Charge passed and mass deposited are proportional, which makes an electrochemical cell auditable.
        format: CHOICE
        why: "Current times time is charge, and charge divided by the Faraday constant is moles of electrons. A metal ion needing two electrons therefore yields at most half that many moles of metal. It is an upper bound rather than an answer because some current goes to side reactions — hydrogen at the cathode, most often — so the measured mass over the theoretical mass is the cell's efficiency. That ratio is what makes the cell auditable: a treated-water number inconsistent with the charge passed is wrong somewhere."
        rebuttals:
          - Concentration affects the rate and the efficiency; the charge is what limits the total.
          - One electron deposits one atom only for a singly charged ion. A divalent ion needs two.
          - The ion's charge is exactly what converts moles of electrons into moles of metal.
        choices:
          - The charge passed sets an upper bound on the moles deposited, through the electrons each ion needs.
          - Nothing. How much metal plates out depends on concentration only, and the current does not matter.
          - It fixes the mass exactly, because every electron deposits one atom of metal.
          - It fixes the mass exactly, and the ion's charge does not enter the calculation.
        answer: The charge passed sets an upper bound on the moles deposited, through the electrons each ion needs.
      - group: TREAT
        call: Fund the chemical legacy
        task: The emergency money is about to move elsewhere. What does the city keep?
        title: Fund the chemical legacy
        place: Long-Term Monitoring Office
        setup: The emergency money is about to move elsewhere. What does the city keep?
        scene: The emergency budget closes in three weeks. The plant is back online, the sediment still holds an estimated 40 kilograms of the compound, and of the four monitoring stations set up during the response, one has permanent funding.
        story: The immediate emergency is over and the money is about to move somewhere else. What outlasts a release is the contamination that fell below a threshold rather than disappearing, the sediment and infrastructure holding it, and the institutional memory of how any of this was measured. Long-term monitoring, resilient treatment and preserved methods are what convert fifteen days of crisis work into capacity the city keeps. What the city keeps is what will still matter when nobody remembers the fire.
        assumes:
          - falling below a threshold is not the same as being gone
        takeaway: Stewardship continues after concentrations fall below the immediate threshold.
        format: CHOICE
        why: Nothing was destroyed. Seventy-one kilograms are in sediment, twenty are unaccounted for, and a transformation product is still being characterised — all of it below a threshold rather than gone. Monitoring across water, sediment and air is the only item on the list that would notice any of it coming back. Corrosion control protects the infrastructure, which is a different hazard. Open records preserve the method and cost almost nothing. What outlasts a release is the part that fell quiet rather than the part that stopped.
        rebuttals:
          - Corrosion control and resilience protect the infrastructure, which is a different hazard from the one still sitting in the reservoir.
          - Open records and reference materials preserve the method, cost very little, and should be done regardless of what this budget funds.
          - Closing the records destroys the only account of how any of this was measured, and the next city to burn a freight yard starts from nothing.
        choices:
          - Long-term water, sediment and air monitoring.
          - Corrosion control and treatment-plant resilience.
          - Open analytical records, reference materials and validated methods.
          - Nothing — the records can be closed once the review is published.
        answer: Long-term water, sediment and air monitoring.

# What each place says when the player reads it.
copy:
  WATER: <b>Water Intake Laboratory</b> — The drinking-water intake and the bench beside it. Polarity and intermolecular forces decide what dissolves, what floats as a surface film and what binds to sediment; pH and buffering decide how far a correction actually moves. What this room cannot tell you is where the contaminant went once it left the water column — that answer is in the mud, and it is measured somewhere else.
  GASES: "<b>Air &amp; Plume Station</b> — Mast, sondes and the gas bench. The ideal gas law gives an honest sense of scale: how much volume a release occupies at ambient temperature and pressure. It says nothing about where the material goes. Wind, turbulence, terrain and buoyancy do that, and they change while you are calculating."
  IDENT: <b>Molecular Identification Lab</b> — Chromatography, spectroscopy and the reference library. Separation tells you how many things are present; spectra tell you what they might be. Neither is sufficient alone, and one peak is not automatically one compound. Identity is an evidence package assembled from records, separation and structure together.
  QUANT: <b>Quantitative Analysis &amp; Quality Assurance</b> — Calibration curves, blanks, reference samples and the desk that decides whether a number counts as a result. Dilution, path length and whatever else is in the sample all sit between a signal and a concentration. A measurement without an uncertainty is not yet evidence for a decision.
  ENERGY: <b>Reaction &amp; Thermal Hall</b> — Stoichiometry, calorimetry and kinetics under one roof. Balanced equations bound how much can react; a heat balance separates stored heat from heat still being produced; rate laws and activation energy say how quickly that changes as the vessel warms. All three are needed before anyone enters a confined space.
  TREAT: <b>Pilot Treatment Plant</b> — Oxidation, adsorption and precipitation at pilot scale, with the byproduct bench next door. Every method here lowers the target contaminant. They differ in what they create, what they move into sludge, and what they leave for whoever is monitoring this river in ten years.
  CMD: <b>City Command</b> — Where the mission decision is actually made. The board carries scientific readiness, open high-consequence issues, response credits, and the projection at the deadline. Progress here is not the fraction of questions answered correctly; it is whether the evidence forms one chain that a reviewer could not break.
  RECORDS: <b>Records &amp; Shipping Office</b> — Manifests, supplier lot information and chain-of-custody paperwork. This is evidence that exists before any instrument is switched on, and it is often the cheapest way to eliminate a candidate. A label giving only a common name, with no composition or concentration, is not a record — it is a rumour with letterhead.
  BRIEF: <b>Public Briefing Center</b> — Where the city is told what is known. An uncertainty that survives being repeated has to be stated plainly the first time. A central estimate can be reassuring while the distribution behind it is not.
  YARD: <b>Freight Yard Gatehouse</b> — The fire started here, and several containers beside the river were damaged. The cordon stays until identity and hazard class are established, because an incompatible firefighting or treatment decision is worse than a slow one.
  DRUMS: "<b>The damaged containers</b> — Seven drums, two visibly scorched, none with a usable label. Nobody opens them and nobody identifies a chemical by smell. Composition, charge and provenance come first: secure and inventory, reconcile the records, then measure with validated remote or small-sample methods."
  DOCK: "<b>River sampling point</b> — Surface, mid-depth and sediment samples come off this dock. Where and when you sample decides what you are able to conclude: a surface grab and a sediment core can disagree completely and both be correct about the water they came from."
  READOUT_WATER: <b>Intake chemistry display</b> — pH, conductivity and dissolved concentration at the intake, against the sediment trend beneath it.
  READOUT_GASES: <b>Wind and plume display</b> — Wind speed and direction, stability class, and the current downwind corridor. The corridor is only as fresh as the last wind reading.
  READOUT_IDENT: <b>Spectra and identity display</b> — Chromatogram peaks alongside candidate spectral matches, with the confidence rank for each provisional identity.
  READOUT_QUANT: <b>Calibration and limits display</b> — The working calibration curve, today's blanks, the detection limit and the guard band around the release limit.
  READOUT_ENERGY: <b>Vessel temperature display</b> — Bulk temperature against time, with the cooling capacity drawn as a line the curve must not cross.
  READOUT_TREAT: <b>Treatment train display</b> — Water in and water out for each stage, plus the byproduct and sludge mass that leaves with them.
  BOARD: <b>Response status</b> — Mission, time remaining, scientific readiness and evidence independence, open issues, credits, risk and public trust, with the projection at the deadline. The assumptions behind the projection are inspectable, so a bottleneck can be fixed rather than merely out-spent.


        setup: Match each observation to the electrochemical role.
        scene: At the intake gallery, acidic water is flowing through a section where two different metals are electrically connected. Novák's coating inspection has also found one small breach. She wants the corrosion circuit identified before anyone chooses a repair.
        story: "Acidic water and two different metals in contact are all corrosion needs. Corrosion is an electrochemical circuit with four parts that must all be present: an anode where metal is oxidised and lost, a cathode where a matching reduction occurs, an electron path through the metal, and an ion path through the water. Break any one of them and the circuit stops. That is why treating a corroding pipe as a materials problem alone misses most of the available fixes, and why the intake pipeline for a city's drinking water is a bad place to guess."
        takesAsRead:
          - Atomic structure, ions and electron configuration
        assumes:
          - oxidation is losing electrons and reduction is gaining them
        takeaway: Stopping corrosion requires breaking or controlling the full circuit.
        format: PROTOCOL
        why: Corrosion is an electrochemical circuit with four required parts. The anode is where metal is oxidised and lost. The cathode consumes the released electrons in a reduction reaction. Electrons also need a conducting path through the metal, while ions need a path through the water. Breaking any one part stops the circuit. Two different metals connected in an electrolyte can supply all four. A small coating breach can then concentrate anodic current into one patch and drive rapid local attack.
        rebuttals:
          - Metal atoms losing electrons and entering solution is oxidation, and the site where it happens is the anode. This is where the metal is actually lost.
          - A surface consuming electrons in a reduction reaction is the cathode. It is the other half of the circuit and it loses no metal.
          - Two different metals connected in an electrolyte supply the anode, the cathode, the electron path and the ion path at once. That is a galvanic cell.
          - A coating breached at one point forces the whole anodic current through a small area, so the attack concentrates there and perforates fast.
        columns:
          - What is happening at the metal
          - Which half of the circuit that is
        scenarios:
          - Metal atoms lose electrons and enter solution.
          - A surface consumes electrons in a reduction reaction.
          - Two different metals are electrically connected in an electrolyte.
          - A protective coating is breached at one small point.
        choices:
          - Anodic oxidation site.
          - Cathodic reduction site.
          - A galvanic cell can form.
          - Localized attack may concentrate at the defect.
        mapping: [0, 1, 2, 3]
        guide: A corrosion cell needs four things at once. Somewhere metal is lost. Somewhere electrons are consumed. A path for the electrons, and a path for the ions. Each situation on the left supplies or concentrates one of those parts. Ask which part before pairing anything. Break any one and the circuit stops. So naming the parts is what decides which repair is a repair.
        background:
          - Why this is a matching board and not four separate questions. Responses on boards like this are written to be plausible for more than one situation, so choosing them one at a time lets a nearly-right answer through unexamined. Having to place all of them forces the comparison — not "is this reasonable here", but "is it more right here than there".
          - How to use the one-each rule. Because the responses are a set to be distributed rather than a list to be sampled, every join you make constrains the rest. Settling the two you are confident of can leave the remaining pair decided by elimination. Where it does not, two responses are still competing for one situation, and that is exactly the distinction the stop is testing.
          - "Why you cannot be wrong about exactly one. With every response used once, three correct joins leave the fourth with only one place to go. Any error therefore involves at least two joins. That is worth remembering when the last pair looks forced: the fault is usually not in the join you are struggling with, but in one you made early and stopped questioning."
        concept: Redox and electrochemistry
        answerText: 1. Metal atoms lose electrons and enter solution. → Anodic oxidation site. 2. A surface consumes electrons in a reduction reaction. → Cathodic reduction site. 3. Two different metals are electrically connected in an electrolyte. → A galvanic cell can form. 4. A protective coating is breached at one small point. → Localized attack may concentrate at the defect.

# The campaign: one working day each, three stops and a callback from day 3.
missions:
  - title: The Unknown Containers
    objective: Create a provisional identity list and choose the next discriminating measurements.
    briefing: A freight-yard fire damages several unlabeled containers beside Riverton's river. The response team must establish chemical identity and hazard classes before firefighters, residents, and the water utility act on rumors. A wrong identity can cause an incompatible firefighting or treatment decision.
    stake: "Day one, and the freight yard fire has been out for six hours. A row of containers 80 metres from the river is damaged and nobody can tell you what was in them. Three names are going around: one from a driver, one from a half-burnt manifest, one from a label nobody can read. Adaeze Okonjo, who leads the analytical chemistry, wants two methods on the same sample before anybody writes a name down; the fire chief wants a name now. Today you turn that into a short list you would defend, and decide how to spend the one round of lab work you get. Sampling has an order too, because some steps destroy what the next one needed."
    takeaway: Create a provisional identity list and choose the next discriminating measurements.
    stops:
      - group: IDENT
        call: Read the formula, not the rumor
        task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
        title: Read the formula, not the rumor
        place: Accident Command Post
        setup: Match each formula-level observation to the correct chemical interpretation.
        scene: A freight-yard fire has damaged several unlabelled containers, 80 metres from the river. Okonjo has written all three radio guesses on the whiteboard and crossed out none of them yet. Firefighters are picking a suppression agent from whatever identity you give them.
        story: "A freight-yard fire has damaged several unlabelled containers 80 metres from the river, and the shift supervisor's radio traffic is already carrying 3 different guesses about what is in them. A chemical formula is not a name: it states which elements are present, in what whole-number ratio, and what charge the unit carries, and each of those constrains what the substance can do. A subscript or a charge changed makes a different compound with different reactivity, different solubility and a different hazard class. Firefighters are choosing a suppression agent from whatever identity you give them, and some of the wrong answers react with water."
        takesAsRead:
          - Atomic structure, ions and electron configuration
          - Periodic trends and what an element can do
        assumes:
          - a chemical formula lists which elements are present and in what ratio
        takeaway: Chemical identity begins with explicit composition and charge.
        format: PROTOCOL
        why: A formula is not a name. It states which elements are present, in what whole-number ratio, and what charge the unit carries — and each of those constrains what the substance can do. Change a subscript or a charge and you have a different compound with different reactivity, different solubility and a different hazard class. A common name carries none of that, which is why a label reading only a trade name cannot support a hazard prediction. Some of the wrong answers here react with water.
        rebuttals:
          - A metal paired with a charged group of atoms is the standard signature of an ionic compound — two opposite charges holding on to each other, rather than atoms sharing electrons.
          - Same elements in different ratios is a different compound, not a different name for one. The ratio is part of the identity.
          - More electrons than protons means surplus negative charge. Counting the two is the whole test.
          - A common name with no composition and no concentration constrains nothing. It is a label, and hazard prediction needs the formula behind it.
        columns:
          - What the record shows
          - What you can conclude
        scenarios:
          - The formula pairs a metal with a charged group of atoms.
          - Two substances share the same elements but different ratios.
          - A particle has more electrons than protons.
          - A label gives a common name with no composition or concentration.
        choices:
          - Likely an ionic compound.
          - They are distinct compounds, not interchangeable names.
          - It is negatively charged.
          - The record is insufficient for hazard prediction.
        mapping: [0, 1, 2, 3]
        guide: "The left column is four kinds of record. The right column is four kinds of claim. Ask of each record what it actually fixes: which elements, in what ratio, carrying what charge. A trade name fixes none of the three. Some substances on the shortlist react with water. A firefighter is choosing a suppression agent from whatever identity comes back."
        background:
          - Why this is a matching board and not four separate questions. Responses on boards like this are written to be plausible for more than one situation, so choosing them one at a time lets a nearly-right answer through unexamined. Having to place all of them forces the comparison — not "is this reasonable here", but "is it more right here than there".
          - How to use the one-each rule. Because the responses are a set to be distributed rather than a list to be sampled, every join you make constrains the rest. Settling the two you are confident of can leave the remaining pair decided by elimination. Where it does not, two responses are still competing for one situation, and that is exactly the distinction the stop is testing.
          - "Why you cannot be wrong about exactly one. With every response used once, three correct joins leave the fourth with only one place to go. Any error therefore involves at least two joins. That is worth remembering when the last pair looks forced: the fault is usually not in the join you are struggling with, but in one you made early and stopped questioning."
        concept: Chemical formulas, naming and composition
        answerText: 1. The formula pairs a metal with a charged group of atoms. → Likely an ionic compound. 2. Two substances share the same elements but different ratios. → They are distinct compounds, not interchangeable names. 3. A particle has more electrons than protons. → It is negatively charged. 4. A label gives a common name with no composition or concentration. → The record is insufficient for hazard prediction.
      - group: IDENT
        call: From damaged container to provisional identity
        task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
        title: From damaged container to provisional identity
        place: Molecular Identification Lab
        setup: Order the non-destructive evidence workflow.
        scene: Inside the mobile laboratory, Okonjo sets the first intact sample from the damaged drums on the bench, still sealed. The outside markings are legible now and will scuff off on opening. Drawing liquid vents the headspace, and there is only enough for two runs.
        story: "The containers are now evidence as well as hazard. Identification runs in a fixed order for reasons that are chemical rather than bureaucratic: some observations leave the sample exactly as they found it and can be repeated all week, and some consume the material to produce their answer. A destructive method gives the best identification and gives it once. What is on the outside of the drum survives only until somebody opens it, and so does the air above the liquid: breaking the seal to draw an aliquot vents the headspace. You are choosing the order in which to spend a sample nobody can go back for."
        assumes:
          - some measurements leave the sample as they found it and some use it up
        takeaway: Analytical work runs from what costs nothing to what cannot be undone.
        format: SEQUENCE
        why: The order is set by what each step costs. The markings on the outside of the drum survive only until somebody opens it, so they are recorded first and consume nothing. Headspace vapour samples what has already escaped, without breaching the bulk liquid. A non-destructive spectrum on a small aliquot can be repeated all week if it goes wrong. The destructive method gives the best identification and gives it once. It is therefore the last thing you spend and the first thing you would regret.
        rebuttals:
          - Photograph the markings first. It costs nothing and it is the only evidence that stops existing the moment the drum is opened.
          - "Headspace vapour second: it samples what has already left the liquid, without breaching the container."
          - A non-destructive spectrum third. It uses an aliquot and gives it back, so a mistake here costs nothing.
          - The destructive method last. It answers best and it answers once, which makes it the thing you spend when you know what to ask.
        cards:
          - Photograph and record the markings on the outside of the drum, which consumes nothing.
          - Sample the headspace vapour onto a sorbent tube, without breaching the bulk liquid.
          - Draw a small aliquot and run a non-destructive spectrum on it.
          - Commit part of that aliquot to a method that destroys it to identify it.
        order: [0, 1, 2, 3]
        axis: Order the four by what each one costs you, cheapest first. This is not a clock — every step is available right now, and the question is which ones you can still take afterwards.
        ends:
          - Costs nothing
          - Cannot be undone
        guide: "Every one of these four is available right now, so nothing here is a clock. What separates them is what you can still do afterwards. Ask of each step what it consumes: the markings, the headspace, the liquid, or the sample itself. There is enough liquid for two runs. A step that ends the sample answers best and answers once, which puts it somewhere very particular in the order."
        background:
          - "Why the order is graded whole. A sequence is a claim about dependency: each step is here because the one before it has already happened, or has to have. One transposed pair falsifies that claim wherever it sits, so partial credit would be credit for a sequence that does not work."
          - Why the ends are the place to start. The first and last cards are constrained by having nothing before or after them, which usually makes them the two you can settle from the scene alone. Pinning them collapses the remaining arrangements sharply, and what is left in the middle is where the actual judgement lives.
          - What the rail can be ordered on. Time is the usual axis, but it is not the only one. An order can run on cost, on risk, or on reversibility — every observation that leaves the sample as it was, before any that consumes it. On those boards a chronological reading finds nothing, because none of the steps has to happen at a particular hour.
        concept: Kinetic molecular theory, diffusion and volatility
        answerText: 1. Photograph and record the markings on the outside of the drum, which consumes nothing. 2. Sample the headspace vapour onto a sorbent tube, without breaching the bulk liquid. 3. Draw a small aliquot and run a non-destructive spectrum on it. 4. Commit part of that aliquot to a method that destroys it to identify it.
      - group: IDENT
        call: Spend the first of the lab budget
        task: Spend the $800 laboratory budget on the evidence that most changes whether the provisional identity is defensible.
        title: Spend the first of the lab budget
        place: Records and Shipping Office
        setup: What does the response run first?
        question: Which evidence do you buy before giving firefighters a chemical identity?
        scene: An $800 laboratory budget is left for the first round of evidence. Three damaged drums have lost their labels, and Okonjo confirms the first extract is ready. Firefighters wait at the fence line for the provisional identity that decides their next move.
        story: "You have a limited laboratory budget and four ways to spend it, and the first hours of a release are when uncertainty is most expensive. Analytical methods are not interchangeable: each one answers a different question, carries its own way of being fooled, and costs sample, time and exposure. Some of what looks like a fast answer is really a low-quality one taken at personal risk — smelling a container tells you almost nothing chemically and puts a responder in the vapour. One of them goes first, and the firefighters are waiting on whatever it returns."
        assumes:
          - different analytical methods can fail for different reasons
          - a repeated measurement is not automatically an independent measurement
        takeaway: Independent evidence is more valuable than a repeated result when the decision depends on whether the identity itself is right.
        format: VALUE
        why: An analytical result can be precise and still be wrong. A repeat run tests repeatability, records test provenance, and quality controls test specific laboratory failure modes. None of those independently identifies the compound. A structural method based on different physics can overturn a mistaken retention-time match, so it changes the decision directly. With a limited budget, the first purchase should attack the uncertainty that can reverse the hazard call. Making the existing result look more complete is secondary.
        value:
          budget:
            amount: 800
            unit: $
          decision: Can the response give firefighters a defensible provisional identity for the damaged drums?
          options:
            - id: orthogonal
              label: Independent structural method on the same extract
              cost: 600
              axis: identity
              reveals: Whether the proposed compound is supported by a method that does not depend on the original separation or retention-time match.
              decisive: true
            - id: records
              label: Supplier and shipping-record search
              cost: 150
              axis: provenance
              reveals: What should have been shipped in the drums before the fire, not what is chemically present now.
            - id: controls
              label: Reference material, blank and matrix spike
              cost: 250
              axis: quality control
              reveals: Whether the laboratory added signal or the sample matrix changed the response of the first method.
            - id: replicate
              label: Repeat the first method on a second aliquot
              cost: 200
              axis: precision
              reveals: Whether the first method repeats on the same sample; it does not create an independent identity measurement.
          hint: Open each evidence card to see what it would tell you, then spend no more than $800. Repeating a result and independently identifying it are different purchases.
          commit: Commit the decision
        guide: Open each evidence card to see what it would actually tell you, then spend up to $800. A card's price is not its value. Firefighters at the fence need an identity firm enough to choose their next move, so buy the evidence that could distinguish between the candidates. Repeating a test you have already run buys certainty about something you already knew.
        background:
          - What makes a test worth its money. Not precision, and not how much data it returns. The question is whether its two possible results point at different chemicals. A test every candidate would pass tells you nothing you did not know before you paid for it.
          - Why a provisional identity is enough. The firefighters do not need a publication-grade answer; they need to know which class of chemistry they are standing next to. Waiting for certainty means they act on nothing at all, which is the more dangerous of the two errors.
          - Why the labels being gone matters so much. Three drums, no labels, and one extract means the identity has to come out of the chemistry rather than the paperwork. Every card on the board is a way of asking the material what it is.
        concept: "Measurement: significant figures, blanks, detection limits, uncertainty"
        answerText: Buy the independent structural method first. It is the only option that can directly overturn the working identity using different physics; the other purchases answer provenance, quality-control or precision questions.
      - group: IDENT
        task: Sort the drum labels before the contractor lifts them.
        title: Water first, or never water
        place: Container Yard
        question: Send each drum to the bin that says what water would do to it.
        scene: The contractor lifts at four and wants the yard sorted by then. Nils Sørensen, who runs Fire Command, has hose crews standing by. Some drums are made safe by dilution; others react with water, and a hose is the worst thing that could reach them.
        takesAsRead:
          - Atomic structure, ions and electron configuration
        assumes:
          - some substances dissolve in water and some react with it
        takeaway: The default response is right for most things and catastrophic for a short list.
        format: BELT
        why: "Water is the default response to a spill because it is what everybody has, and for most of a yard it is the right one: a soluble salt or an acid already in dilute solution is made less dangerous by more water, and the concentration is the hazard. The short list is where the default inverts. Alkali metals and hydrides displace hydrogen from water and give off enough heat to light it. Concentrated sulphuric acid releases so much heat on dilution that water poured onto it boils and throws the acid back — which is why the rule is acid into water and never the reverse. Carbides give off acetylene, and some chlorides give off hydrogen chloride gas that is worse in air than the drum was on the ground. Nothing about the drums looks different. The label is the only thing that tells you which list a drum is on, which is why a yard of unlabelled drums is the emergency rather than an inconvenience."
        belt:
          left:
            name: Water dilutes it
          right:
            name: Water reacts
          items:
            - name: Sodium chloride
              bin: left
            - name: Dilute acetic acid
              bin: left
            - name: Copper sulphate
              bin: left
            - name: Ammonium nitrate
              bin: left
            - name: Sodium hydroxide pellets
              bin: left
            - name: Ethanol
              bin: left
            - name: Glycerol
              bin: left
            - name: Potassium nitrate
              bin: left
            - name: Sucrose
              bin: left
            - name: Urea
              bin: left
            - name: Dilute ammonia
              bin: left
            - name: Sodium carbonate
              bin: left
            - name: Sodium metal
              bin: right
            - name: Calcium carbide
              bin: right
            - name: Sodium hydride
              bin: right
            - name: Concentrated sulphuric acid
              bin: right
            - name: Acetyl chloride
              bin: right
            - name: Phosphorus pentoxide
              bin: right
            - name: Titanium tetrachloride
              bin: right
            - name: Lithium aluminium hydride
              bin: right
            - name: Thionyl chloride
              bin: right
            - name: Calcium oxide
              bin: right
            - name: Potassium metal
              bin: right
            - name: Aluminium phosphide
              bin: right
            - name: Chlorosulphonic acid
              bin: right
            - name: Magnesium powder
              bin: right
          need: 20
          lives: 3
          pass: 0.8
          hint: Ask what happens the moment water reaches it.
          commit: Start the line
        guide: Two bins. Something that simply dissolves is diluted by water and made less dangerous by it. Something that reacts with water makes heat, gas or both, so water is what turns a spill into an event. Sort on what the substance does when water reaches it.
        background:
          - Why this is the first question at a yard. The default response to almost anything is water — hoses are what a fire crew has. For most of what is here that is right, and for a short list it is the one action that makes the situation worse.
          - What reacting with water looks like. Alkali metals and hydrides give off hydrogen. Concentrated acids give off enough heat to boil what is poured onto them. Carbides and some chlorides give off gas that is worse than what was in the drum.
        concept: Periodic trends and what an element can do
        answerText: Anything that dissolves goes left and dilution helps. Anything that reacts with water goes right, and a hose is the last thing it should meet.
  - title: The Vapor Cloud
    objective: Provide a bounded plume assessment and decision triggers for evacuation zones.
    briefing: A colorless plume moves toward two neighborhoods as the weather changes. The team must estimate expansion, density, and direction without treating an ideal-gas model as a complete atmospheric forecast. A delayed evacuation risks exposure; an overbroad evacuation can block emergency access and overwhelm shelters.
    stake: Second morning, first light, and the wind has backed 40 degrees. A colourless plume is drifting off the yard toward 2 neighbourhoods, and the forecast from the atmospheric chemistry lead, Miklos Varga, disagrees with the incident commander's map about where it goes by 11. Sipho Mbeki, who briefs the public, has to tell residents something by eight. Today you work out how much air that release can fill, what the warming morning will do to it, and which measurement to buy next. Both mistakes cost people. Evacuate too small an area and somebody is standing downwind of it. Evacuate the whole district and you block the roads the fire crews need.
    takeaway: Provide a bounded plume assessment and decision triggers for evacuation zones.
    stops:
      - group: GASES
        call: How much volume can the gas occupy?
        task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation. Estimate the gas volume at ambient conditions.
        title: How much volume can the gas occupy?
        place: Mobile Weather Station
        setup: Use an idealized release only to establish scale.
        question: Estimate the gas volume at ambient conditions.
        scene: At the command trailer, a colourless plume is moving toward two neighbourhoods. Police are holding the evacuation roads open while the wind shifts. The release inventory is finally known, and the incident commander, Grace Boateng, wants the gas scale before moving her roadblocks.
        story: "A colourless plume is drifting toward two neighbourhoods and the incident commander wants a number before the wind shifts. The ideal gas law relates the amount of substance to the volume it occupies at a given temperature and pressure — at ordinary conditions about 24 litres per mole — which turns a mass in a tank into a scale you can reason about. It is a first-order tool and nothing more: it says how big the release is, not where it goes. Evacuating too little exposes people; evacuating too much blocks the roads the response needs."
        assumes:
          - a given amount of gas occupies a predictable volume at ordinary conditions
        takeaway: Simple gas laws provide scale while atmospheric transport determines exposure.
        format: BALLPARK
        why: "The ideal gas law turns an amount of gas into a volume you can reason about. At ordinary temperature and pressure, the scale is about 24 litres per mole. It is a first-order tool and nothing more: it says how big the release is, not where it goes. The hazardous footprint depends on mixing, wind, terrain and chemistry, none of which appear in the calculation. The number still has to be right, because evacuating too little exposes people and evacuating too much blocks the roads the response needs."
        estimate:
          prompt: A colorless plume is leaving the yard. Command wants the equilibrium gas volume before anyone draws an evacuation corridor.
          question: Estimate the gas volume at ambient conditions.
          labels:
            - 2.0×10⁴ mol  (n, amount released)
            - 8.31 J mol⁻¹ K⁻¹  (R)
            - 300 K  (T, ambient)
            - 1.0×10⁵ Pa  (P, ambient)
            - 22.4 L mol⁻¹  (molar volume at STP)
            - 273 K  (0 °C)
          values: [20000, 8.31, 300, 100000, 22.4, 273]
          slots: 4
          template: "{0} × {1} × {2} ÷ {3}"
          formula: a*b*c/d
          correct: [0, 1, 2, 3]
          target: 498.6
          tolerance: 60
          units: m³
          solution: V = nRT/P ≈ (2.0×10⁴ × 8.31 × 300) / 1.0×10⁵ ≈ 500 m³.
          explanation: "The ideal gas law fixes the volume the release would occupy at equilibrium. That is a scale, not a hazard footprint: mixing, wind, terrain and chemistry decide where the material actually goes and at what concentration."
          givens:
            - n = 2.0×10^4 mol
            - T = 300 K
            - P = 1.0×10^5 Pa
            - R = 8.31 J mol^-1 K^-1
          relationship: V = nRT/P, with V the volume, n the moles of gas, R the gas constant, T the absolute temperature and P the pressure.
        guide: Six numbers, and two of them describe conditions the release is not at. One is the molar volume at standard temperature and pressure. One is zero Celsius in kelvin. The relationship is written for ambient conditions, so every term has to be the ambient one. A volume computed at the wrong conditions still looks like a volume. Roadblocks get moved on it.
        background:
          - What the relationship says. V = nRT/P, with V the volume, n the moles of gas, R the gas constant, T the absolute temperature and P the pressure.
          - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs, and whether the size of the answer looks right once they are in place.
          - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label is how a unit mismatch, or a quantity belonging to a different part of the problem, is caught before it is placed — which is the habit this format exists to build.
        concept: Gas laws and the ideal gas equation
        answerText: V ≈ 2.0×10^4×8.31×300/10^5 ≈ 500 m³.
      - group: GASES
        call: Interpret plume behavior
        task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
        title: Interpret plume behavior
        place: Gas Properties Lab
        setup: Match each change to its first-order consequence.
        scene: At the weather station, Varga reads out rising temperature, falling pressure and a strengthening afternoon wind while the plume is still moving. Ground crews also report vapour pooling in a low drainage channel on the downwind side of the freight yard.
        story: "The weather is changing while the plume is still moving. Two different physics are operating at once here: gas-law behaviour, which says how a fixed amount of substance responds to changes in temperature and pressure, and atmospheric transport, which says where the resulting parcel actually goes. Density relative to air decides whether the cloud hugs the ground or lifts; wind and turbulence decide how fast it dilutes; terrain decides where it pools. Each change on the board pushes on one of those and not necessarily the others, and the neighbourhood downwind is where the arithmetic lands."
        assumes:
          - a gas has a state and also a place, and they change for different reasons
        takeaway: A plume is a coupled thermodynamic and transport problem.
        format: PROTOCOL
        why: Two different physics are running at once. Gas-law behaviour says how a fixed amount of substance responds to temperature and pressure. Charles and Boyle are two statements about the same gas, one proportional and one inverse. Atmospheric transport says where the parcel actually goes. Density relative to air affects whether the cloud hugs the ground or lifts. Wind and turbulence control dilution, while terrain controls where vapour can pool. Each change on the board pushes on one part of that system, not necessarily the others.
        rebuttals:
          - A temperature rise at roughly constant pressure is proportional — twice the absolute temperature, twice the volume.
          - A pressure drop at constant amount and temperature is inverse — half the pressure, twice the volume.
          - Greater molar mass than air is about density, which the gas law does not address. It decides whether the cloud sinks or lifts, and turbulence can override it.
          - A wind shift is transport rather than state. Nothing about the gas changed; where it is going did.
        columns:
          - What changes in the field
          - What happens to the plume
        scenarios:
          - Temperature rises at roughly constant pressure.
          - External pressure falls for the same gas amount and temperature.
          - A gas has greater molar mass than surrounding air.
          - Wind direction shifts while the source continues.
        choices:
          - Volume rises in proportion to the absolute temperature.
          - Volume rises in inverse proportion to the pressure.
          - It may initially favour lower-level accumulation, though turbulence matters.
          - The downwind risk corridor must be updated.
        mapping: [0, 1, 2, 3]
        guide: Two different physics run at once here, and the four situations do not all belong to one. Some change what a fixed amount of gas occupies. Others change where the parcel goes. Ask which of the two each one acts on before pairing it. Read a transport change as a gas-law change and the corridor is drawn from the wrong physics. The vapour is pooling in a drainage channel.
        background:
          - Why this is a matching board and not four separate questions. Responses on boards like this are written to be plausible for more than one situation, so choosing them one at a time lets a nearly-right answer through unexamined. Having to place all of them forces the comparison — not "is this reasonable here", but "is it more right here than there".
          - How to use the one-each rule. Because the responses are a set to be distributed rather than a list to be sampled, every join you make constrains the rest. Settling the two you are confident of can leave the remaining pair decided by elimination. Where it does not, two responses are still competing for one situation, and that is exactly the distinction the stop is testing.
          - "Why you cannot be wrong about exactly one. With every response used once, three correct joins leave the fourth with only one place to go. Any error therefore involves at least two joins. That is worth remembering when the last pair looks forced: the fault is usually not in the join you are struggling with, but in one you made early and stopped questioning."
        concept: Kinetic molecular theory, diffusion and volatility
        answerText: 1. Temperature rises at roughly constant pressure. → Volume rises in proportion to the absolute temperature. 2. External pressure falls for the same gas amount and temperature. → Volume rises in inverse proportion to the pressure. 3. A gas has greater molar mass than surrounding air. → It may initially favour lower-level accumulation, though turbulence matters. 4. Wind direction shifts while the source continues. → The downwind risk corridor must be updated.
      - group: GASES
        call: Choose the next plume evidence
        task: Same drum, same liquid, three times the vapour. Why?
        title: Why the drum is worse in the afternoon
        place: Atmospheric Monitoring Post
        scene: The same open drum reads three times the vapour concentration at two in the afternoon as it did at six in the morning. Nothing has been added and nothing taken out. Varga logged both readings himself and wants them explained before the next briefing.
        assumes:
          - a liquid and its vapour sit in equilibrium at a temperature
        takeaway: How much of a liquid is in the air above it depends steeply on how warm it is.
        format: CHOICE
        why: Vapour pressure is the pressure of gas in equilibrium with its own liquid, and it climbs steeply with temperature — often doubling for every 10 or 15 degrees. Warming the drum from morning to afternoon moves more molecules into the gas phase above the same liquid, so the air above it is more concentrated with no change in what is in the drum. This is why exposure limits are checked at the hottest part of the day, and why a hazard assessment made at dawn understates the afternoon.
        rebuttals:
          - A new compound would show a different peak, and the analysis shows the same one.
          - Both readings came from the same instrument, and a threefold change is far outside its drift.
          - Evaporation removes the volatile fraction, which would lower the vapour above the liquid, not raise it.
        choices:
          - Its vapour pressure rose with temperature, so more of it is in the gas phase.
          - The liquid reacted during the day and made a new, more volatile compound.
          - The morning reading was wrong, because instruments drift when cold.
          - More liquid evaporated overnight, leaving a more concentrated residue.
        answer: Its vapour pressure rose with temperature, so more of it is in the gas phase.
        guide: All four options would explain a rising reading, and they differ in what has changed. One changes the liquid, one changes the instrument, one changes the amount, and one changes only the partition between liquid and air. Nothing was added and nothing was removed, which is the fact that does the work. Getting this wrong sets an exposure limit from a dawn reading and clears a site that is worse by mid-afternoon.
        background:
          - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
          - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
          - "What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested."
        concept: Phase changes, vapour pressure and phase diagrams
  - title: A Reaction Underground
    objective: Estimate the maximum reaction scale and define measurements that verify whether the assumed chemistry is occurring.
    briefing: Two drainage streams may mix in a confined tunnel. The player must determine limiting reactants, plausible products, and gas or heat generation before crews enter. Entering before bounding the chemistry could expose crews to heat, pressure, or oxygen displacement.
    stake: "Day 3. Two drains may be meeting in a closed tunnel under the yard and the closed-space safety officer, Femi Oyelaran, has a crew suited up at the hatch waiting on your word. He will not send them in on a story. Oyelaran has monitors at the hatch and two hours of bottled air per man. Today you work out the largest reaction that could be happening down there, and whether the reaction you assumed is the one really going on. What hurts people in a closed space is ordinary: heat, pressure, and oxygen pushed out."
    takeaway: Estimate the maximum reaction scale and define measurements that verify whether the assumed chemistry is occurring.
    stops:
      - group: ENERGY
        call: From identity to reaction estimate
        task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
        title: From identity to reaction estimate
        place: Sewer Monitoring Station
        setup: Order the stoichiometric workflow.
        scene: At the tunnel entrance, two drainage streams may be meeting behind a closed access door. Oyelaran holds his repair crew at the barricade, and the storm bypass remains shut. The laboratory has analyses from both drains but no reaction estimate yet.
        story: "Two drainage streams may be meeting in a confined tunnel, and crews are waiting for permission to enter. Every quantitative prediction about a reaction rests on a balanced chemical equation, because the balanced equation is what supplies the ratios: moles of one reactant to moles of another, and moles of reactant to moles of product. Written the wrong way round it produces confident numbers about a reaction that is not happening. The reason for the order of this work is that each step depends on the one before it being right."
        assumes:
          - a balanced equation says how many of one thing react with how many of another
        takeaway: Stoichiometry is a conditional prediction based on a specified reaction.
        format: SEQUENCE
        why: Every quantitative reaction prediction begins with a balanced equation. Its coefficients supply the mole ratios between reactants and products. Measured masses are then converted to moles, because the coefficients compare particles rather than grams. Those mole ratios identify which reactant runs out first. Only after the limiting reactant is known can the maximum products be calculated. The prediction can then be checked against the gas, heat or remaining reagent actually observed in the tunnel.
        rebuttals:
          - Balance the equation first. It is what supplies every ratio used later, and written wrong it gives confident numbers about a reaction that is not happening.
          - Convert to moles second. Ratios from a balanced equation are ratios of moles, and comparing grams gives the wrong answer.
          - Use the ratios to find the limiting reactant third. That is what sets the maximum extent of reaction.
          - Calculate theoretical products and compare with what was observed last. The comparison is the test; the calculation alone is only a prediction.
        cards:
          - Write and balance the plausible reaction.
          - Convert measured amounts to moles.
          - Use mole ratios to identify the limiting reactant.
          - Calculate theoretical products and compare with observed gas or heat.
        order: [0, 1, 2, 3]
        guide: These four are not four independent tasks. Each needs the output of another. Ask of each card what it requires before it can be done at all. Coefficients cannot be used until the equation is balanced. Masses cannot be compared until they are moles. A prediction is worth making only once there is a measurement to compare it against. A repair crew is at the barricade.
        background:
          - "Why the order is graded whole. A sequence is a claim about dependency: each step is here because the one before it has already happened, or has to have. One transposed pair falsifies that claim wherever it sits, so partial credit would be credit for a sequence that does not work."
          - Why the ends are the place to start. The first and last cards are constrained by having nothing before or after them, which usually makes them the two you can settle from the scene alone. Pinning them collapses the remaining arrangements sharply, and what is left in the middle is where the actual judgement lives.
          - What the rail can be ordered on. Time is the usual axis, but it is not the only one. An order can run on cost, on risk, or on reversibility — every observation that leaves the sample as it was, before any that consumes it. On those boards a chronological reading finds nothing, because none of the steps has to happen at a particular hour.
        concept: The mole, molar mass and stoichiometry
        answerText: Write and balance the plausible reaction. → Convert measured amounts to moles. → Use mole ratios to identify the limiting reactant. → Calculate theoretical products and compare with observed gas or heat.
      - group: ENERGY
        call: Which reactant limits?
        task: Use the masses and molar masses to identify the limiting reactant, the maximum amount of B that can react, and the percent yield from the recovered product.
        title: Which reactant limits?
        place: Stoichiometry Lab
        setup: Use the generic reaction 2A + B → products.
        question: Which reactant limits, how much B can react, and what percent yield was recovered?
        scene: A reaction takes two moles of A for every mole of B, and both are arriving in the tunnel in amounts nobody chose. Tomas Brandt, who leads reactions and energy, will not clear an entry until this number exists.
        story: "A generic reaction takes two moles of A for every mole of B, and both are arriving in the tunnel in amounts nobody chose. The limiting reactant is the one that runs out first, and it is what sets the maximum extent of reaction — the rest of the other reagent simply sits there once its partner is gone. That is why an estimate based on the larger quantity is not conservative but wrong: it predicts heat and gas that cannot physically be produced. Closed-space entry decisions are being made from this number."
        assumes:
          - a reaction stops when one ingredient runs out
        takeaway: Stoichiometric limits are set in moles, and percent yield compares what was recovered with that theoretical limit.
        format: BALLPARK
        why: A balanced equation compares particles, so masses have to become moles before the reactants can be compared. 500 grams of A at 50 g/mol is 10 mol. 640 grams of B at 80 g/mol is 8 mol. The 2:1 ratio means 10 mol A can consume only 5 mol B, so A limits. If the recovered product corresponds to 4.2 mol of reaction, the percent yield is 4.2/5.0 × 100 = 84%.
        estimate:
          prompt: Two drainage streams meet in the tunnel. Crews cannot enter until someone says how far the reaction can actually go.
          question: Identify the limiting reactant, maximum moles of B consumed, and percent yield for the recovered product.
          labels:
            - 10 mol A available
            - 8 mol B available
            - 2 mol A per mol B  (the ratio itself)
            - 18 mol  (A and B added together)
          values: [10, 8, 2, 18]
          slots: 2
          template: the smaller of  {0} ÷ 2  and  {1}
          formula: Math.min(a/2, b)
          correct: [0, 1]
          target: 5
          tolerance: 0.5
          units: mol B
          solution: "A: 500/50 = 10 mol. B: 640/80 = 8 mol. 10 mol A can consume 5.0 mol B, so A limits. Yield = 4.2/5.0 × 100 = 84%."
          explanation: Masses cannot be compared directly when substances have different molar masses. Convert each to moles, use the balanced ratio to find the theoretical limit, then compare the recovered amount with that limit.
          givens:
            - Available A = 10 mol
            - Available B = 8 mol
          relationship: "First use n = m/M. Then compare mole amounts with the 2 A : 1 B coefficients. Percent yield = actual/theoretical × 100."
        guide: Four numbers, and one of them is the two reactant amounts added together. Another is the reaction's own ratio rather than a quantity of anything. A balanced equation compares particles, so amounts have to be in moles before the ratio can be applied. Adding two reactants gives a number that no stoichiometry uses, and closed-space entry decisions are being made from whichever number comes out.
        background:
          - "What the relationship says. First use n = m/M. Then compare mole amounts with the 2 A : 1 B coefficients. Percent yield = actual/theoretical × 100."
          - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs, and whether the size of the answer looks right once they are in place.
          - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label is how a unit mismatch, or a quantity belonging to a different part of the problem, is caught before it is placed — which is the habit this format exists to build.
        concept: Limiting reactant and percent yield
        answerText: A is limiting. The masses correspond to 10 mol A and 8 mol B, so at most 5.0 mol B can react. A recovered 4.2 mol equivalent is an 84% yield.
      - group: ENERGY
        call: Heat release is not the spontaneity test
        task: Calculate ΔG at 18 °C, then decide whether thermodynamics favors the reaction and what the 6 quiet days imply about its rate.
        title: Heat release is not the spontaneity test
        place: Reactions and Energy Bay
        setup: Separate the thermodynamic calculation from the observation about rate.
        question: At 18 °C, what is ΔG, and what does the lack of product say about the reaction rate?
        scene: A clean-up reagent is staged beside the tunnel; the tank test shows no product after 6 days at 18 °C. Léa Moreau, the energy division's researcher, hands over the measured ΔH and ΔS and asks whether the chemistry is impossible or simply slow.
        assumes:
          - temperature in ΔG = ΔH − TΔS must be in kelvin
          - a negative ΔG means the forward reaction is thermodynamically favored
        takeaway: Free energy sets thermodynamic favorability; activation barriers set how quickly a favorable reaction proceeds.
        format: BALLPARK
        why: Free energy combines enthalpy, entropy and temperature. At 291 K, ΔG = −180 − 291(−0.40) ≈ −64 kJ/mol, so the reaction is thermodynamically favorable. That does not make it fast. The unchanged tank points to a substantial activation barrier at this temperature. This distinction matters in treatment design. Temperature or a catalyst can change reaction rate without changing the sign of ΔG. A favorable ΔG alone never guarantees useful speed.
        rebuttals:
          - Exothermic is about heat, not about direction. Entropy and temperature enter as well.
          - Every reaction has an activation barrier, and releasing heat once started says nothing about getting started.
          - Nothing in the tank has changed in six days, which is the observation that needs explaining.
        estimate:
          prompt: The tank has not changed in six days even though the proposed reaction releases heat. Use the measured entropy change before blaming thermodynamics.
          question: Calculate ΔG at 18 °C and interpret the result.
          labels:
            - −180 kJ/mol  (ΔH)
            - −0.40 kJ mol⁻¹ K⁻¹  (ΔS)
            - 291 K  (T in kelvin)
            - 18  (the Celsius figure — not T)
          values: [-180, -0.4, 291, 18]
          slots: 3
          template: "{0} − {2} × {1}"
          formula: a - c*b
          correct: [0, 1, 2]
          target: -63.6
          tolerance: 3
          units: kJ/mol
          solution: T = 291 K. ΔG = −180 − 291(−0.40) ≈ −63.6 kJ/mol. The reaction is favorable but slow under these conditions.
          explanation: A negative ΔG says the forward reaction is favorable. It says nothing about how quickly the activation barrier is crossed.
          givens:
            - ΔH = −180 kJ/mol
            - ΔS = −0.40 kJ mol⁻¹ K⁻¹
            - T = 18 °C = 291 K
          relationship: ΔG = ΔH − TΔS, with T in kelvin.
        guide: "Four numbers, and two of them are the same temperature written in different scales. The relationship needs an absolute temperature, so degrees Celsius put straight into it is not a small error but a different quantity. Note what the answer does and does not settle: a favourable sign says the reaction can go, not that it will go this week. The tank has had six days and shows nothing."
        background:
          - What the relationship says. ΔG = ΔH − TΔS, with T in kelvin.
          - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs, and whether the size of the answer looks right once they are in place.
          - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label is how a unit mismatch, or a quantity belonging to a different part of the problem, is caught before it is placed — which is the habit this format exists to build.
        concept: Entropy, free energy and spontaneity
        answerText: ΔG ≈ −64 kJ/mol at 291 K, so the reaction is thermodynamically favored. Six quiet days point to a slow reaction rate, not unfavorable free energy.
  - title: Identify the Unknowns
    objective: Assign confidence-ranked identities to mixture components using independent evidence.
    briefing: Chromatography reveals several peaks, while spectroscopy suggests overlapping functional groups. The player must combine separation and structural evidence rather than forcing one peak to equal one compound. A false identification could lead the treatment plant to use chemistry that creates a more hazardous byproduct.
    stake: Four days in. The lab has a chromatogram — a chart with one peak for each thing it managed to separate out — and there are more peaks than the team has names. Two methods run on the same sample disagree. Kwabena Osei, the treatment engineer, wants a list this morning so the plant can start ordering chemistry; Okonjo will not give him one she cannot defend. Today you decide what is actually in the mixture and how sure you are willing to be about each name. Name something that is not there and the plant treats the water for it.
    takeaway: Assign confidence-ranked identities to mixture components using independent evidence.
    stops:
      - group: IDENT
        call: From mixture to supported identity
        task: Which drum is the more reactive with water, and on what grounds?
        title: What the position in the table tells you
        place: Molecular Identification Lab
        scene: Okonjo stands between two unlabelled drums — one holding sodium hydride, one caesium hydride, the same anion in both. She wants the bench to say which will be the more violent with water before either is opened.
        takesAsRead:
          - Atomic structure, ions and electron configuration
        assumes:
          - the periodic table groups elements that behave alike
        takeaway: An element's position in the periodic table predicts how it behaves.
        format: CHOICE
        why: "Group 1 reactivity rises going down the group. The outer electron sits further out and is more shielded, so it is lost more easily. That also makes the metal–hydride bond more ionic and easier to break. In both drums it is the hydride ion that attacks water. Caesium is below sodium, so caesium hydride is the more energetic of the two. The anion is shared, which is why the cation decides how violent it is. Note that the same comparison fails on the chlorides: there the cation is already oxidised, and neither drum reacts. This is what the table is for — it lets a bench rank two substances it has never handled, from position alone, before anything is opened."
        rebuttals:
          - Atomic mass is not the trend. What matters is how tightly the outer electron is held, and that weakens down the group.
          - "The hydride ion is what reacts with water in both drums, and a shared anion is the reason the comparison works: it isolates the difference to the cation, which sets how violently."
          - Ranking 2 group 1 metals is exactly what periodic trends are for, and running an unknown violent reaction to find out is the wrong order of work.
        choices:
          - The caesium hydride, because reactivity with water increases down group 1.
          - The sodium hydride, because sodium is the lighter and lighter elements react faster.
          - Neither, because the anion is the same in both drums.
          - It cannot be predicted without running both reactions.
        answer: The caesium hydride, because reactivity with water increases down group 1.
        guide: "Two drums share an anion, so the anion cannot separate them. Each option offers a different basis for the ranking: position in a group, atomic mass, the shared part, or refusal to predict. Ask what changes down group 1, and why. The table exists to rank two substances a bench has never handled. That ranking is what a crew works to before either drum is opened."
        background:
          - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
          - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
          - "What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested."
        concept: Periodic trends and what an element can do
      - group: IDENT
        call: Read analytical disagreement
        task: Trace which measurements share dependencies, keep the evidence that stands independently, and name the source that explains the 3.1-minute signal.
        title: Read analytical disagreement
        place: Spectroscopy Suite
        setup: Match each pattern to the best response.
        question: Which channels remain trustworthy, and what shared source is at fault?
        scene: Two methods have been run on the same extract and they do not tell the same story. Yusra Haddad, the independent reviewer, flags the disagreement — a false identification here sends the plant a chemistry that could create a worse product than the one it removes.
        story: "Two methods have been run on the same extract and they do not tell the same story. Every analytical run carries controls for exactly this moment: a blank, which is everything except the sample and therefore answers whether a signal could have come from the laboratory itself, and a second method that the same thing could not fool, which answers whether the first was fooled by something that merely resembles the target. Reading them together is the skill. A false identification here sends the plant a chemistry that could create a worse product than the one it removes."
        assumes:
          - a blank contains every preparation step except the sample
          - independent methods do not share the same critical failure path
        takeaway: Agreement counts as independent evidence only when the measurements do not inherit the same failure path.
        format: TRACE
        why: The sample and duplicate chromatograms agree because they share the same preparation solvent, retention reference and detector path. Their agreement therefore does not provide two independent identifications. The blank carries almost the same 3.1-minute feature even though it contains no river sample, which points to preparation contamination. The structural spectrum uses a different measurement path and does not match the target. Together, the blank and the independent spectrum overturn the retention-time identification while leaving the rest of the run interpretable.
        trace:
          channels:
            - id: sample-chrom
              label: "River extract: 3.1-minute peak, 62 units"
              reading: target present
              depends:
                - prep-solvent
                - retention-ref
                - gc-cal
            - id: duplicate-chrom
              label: "Duplicate extract: 3.1-minute peak, 59 units"
              reading: target present
              depends:
                - prep-solvent
                - retention-ref
                - gc-cal
            - id: blank-chrom
              label: "Laboratory blank: 3.1-minute peak, 55 units"
              reading: signal exists without river sample
              depends:
                - prep-solvent
                - gc-cal
            - id: structure
              label: Structural spectrum from the 3.1-minute fraction
              reading: target structure not matched
              depends:
                - ms-ref
          resources:
            - id: prep-solvent
              label: Sample-preparation solvent lot
            - id: retention-ref
              label: Chromatography retention-time reference
            - id: gc-cal
              label: Chromatography detector calibration
            - id: ms-ref
              label: Independent structural-spectrum reference
          independent:
            - structure
          target: prep-solvent
          hint: Open each channel to see what it depends on. Keep evidence that still stands on an independent path, then name the shared source that explains the false agreement.
          commit: Correct it
        guide: Open each channel to see what its result depended on. Keep the ones that stand on an independent measurement, and untick the ones whose chain runs through a shared step. Then name the step they have in common. Two methods disagreeing is information, not an error to be averaged away.
        background:
          - Why disagreement is the useful signal. Two methods agreeing can mean both are right or both inherit the same mistake. Two disagreeing means at least one assumption is wrong, and finding which is a question about what each method depended on rather than about which number looks better.
          - "What a shared step looks like here. A calibration standard, a dilution, a column, an internal reference: anything both methods passed through. Everything downstream of it moves together if it is wrong, which is why the average of two such results is no safer than either."
          - What is riding on getting it right. A false identification sends the plant a treatment chemistry chosen for the wrong compound, and the product of that reaction can be worse than what it removes. Withdrawing both results is safer than averaging them and worse than naming the shared step.
        concept: "Quality control: standards, spikes and recovery"
        answerText: The preparation-solvent lot is the shared fault. Keep the blank as evidence of contamination and the structural spectrum as evidence against the target identity. Do not count the two chromatograms as independent confirmation.

          - Which way the equilibrium moves
        scenarios:
          - A solid precipitate is removed from contact with water.
          - A ligand strongly binds the dissolved metal.
          - pH shifts to favor an insoluble hydroxide.
          - Sediment later encounters acidic water.
        choices:
          - Further dissolution pressure is reduced after physical removal.
          - Complexation can increase total dissolved concentration.
          - Precipitation is favored.
          - Material that settled out earlier may dissolve again.
        mapping: [0, 1, 2, 3]
        answerText: 1. A solid precipitate is removed from contact with water. → Further dissolution pressure is reduced after physical removal. 2. A ligand strongly binds the dissolved metal. → Complexation can increase total dissolved concentration. 3. pH shifts to favor an insoluble hydroxide. → Precipitation is favored. 4. Sediment later encounters acidic water. → Material that settled out earlier may dissolve again.

  - title: What Dissolved in the River?
    objective: Predict where each chemical class will be found and design a mass-balance sampling plan.
    briefing: Runoff from the accident enters the river. Some compounds remain in surface films, some dissolve, and others bind to sediment. The player must predict partitioning from molecular interactions and verify it with sampling. If the team samples only water, a persistent sediment reservoir may be missed until it re-enters the water supply.
    stake: "Day 6. Runoff reached the river on the first night and Riverton's drinking-water intake is 900 metres downstream. Inês Ferreira, who owns water and sediment, has been out since four and wants it sampled; the state's auditor wants a water survey, because that is what a water survey means. Today you design it: where to sample, in what order, and which parts of the river to sample at all. That last one decides everything else. Test only the water and the result comes back clean, and it is honestly clean — today. The next flood will stir that sediment back into the water."
    takeaway: Predict where each chemical class will be found and design a mass-balance sampling plan.
    stops:
      - group: WATER
        call: Where will the chemical go?
        task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
        title: Where will the chemical go?
        place: River Sampling Boat
        setup: Match each molecular feature to the most likely environmental behavior.
        scene: Runoff from the accident has reached the river, and Ferreira is on the bank with empty sample bottles, waiting on a prediction. Choose the wrong phase and she samples the wrong thing — a clean water result the city reads as an all-clear.
        story: "Runoff from the accident has reached the river. A chemical released into water does not stay in one place or one phase: polar molecules dissolve readily, non-polar ones partition onto organic carbon in sediment and stay there, volatile ones leave for the atmosphere, and surface-active ones concentrate in the film on top. All of that follows from molecular structure — polarity, hydrogen bonding, and how the compound interacts with water compared with everything else on offer. If you predict the wrong phase you will sample the wrong thing, and a clean water result will be read by the city as an all-clear."
        takesAsRead:
          - Atomic structure, ions and electron configuration
        assumes:
          - like dissolves like — polar mixes with polar, and non-polar does not
        takeaway: The absence of a chemical from water does not mean it has disappeared.
        format: PROTOCOL
        why: A chemical released into water does not stay in one place or one phase, and where it goes follows from molecular structure. Polar molecules that can hydrogen-bond dissolve readily. Ionic species dissolve as hydrated ions, surrounded by water molecules. Non-polar liquids, which barely mix with water, separate out or spread as a surface film. Compounds that avoid water partition onto organic carbon in suspended particles and sediment and stay there. Absence from the water column is not absence from the river.
        rebuttals:
          - A small ionic species dissolves as hydrated ions — water molecules surround each ion and hold it in solution.
          - A non-polar organic liquid barely mixes with water at all. It forms its own phase, often as a film on top.
          - A polar neutral molecule that hydrogen-bonds behaves like water does, so it dissolves appreciably.
          - A water-avoiding compound that sticks to organic carbon leaves the water for the particles, and the particles settle.
        columns:
          - What kind of chemical it is
          - Where it ends up
        scenarios:
          - Small ionic species in water.
          - Nonpolar organic liquid that barely mixes with water.
          - Polar neutral molecule capable of hydrogen bonding.
          - Water-avoiding compound that sticks strongly to organic-rich sediment.
        choices:
          - Often dissolves as hydrated ions.
          - May form a separate phase or surface film.
          - Often has appreciable water solubility.
          - May concentrate in suspended particles or sediment.
        mapping: [0, 1, 2, 3]
        guide: "The left column is four molecular structures and the right column is four places a chemical can end up. Pair them by asking what water can do for that structure: hydrate an ion, hydrogen-bond a polar molecule, or refuse a non-polar one. A compound that avoids water sits on the particles instead. Sample the wrong phase and a clean water result gets read by the city as an all-clear."
        background:
          - Why this is a matching board and not four separate questions. Responses on boards like this are written to be plausible for more than one situation, so choosing them one at a time lets a nearly-right answer through unexamined. Having to place all of them forces the comparison — not "is this reasonable here", but "is it more right here than there".
          - How to use the one-each rule. Because the responses are a set to be distributed rather than a list to be sampled, every join you make constrains the rest. Settling the two you are confident of can leave the remaining pair decided by elimination. Where it does not, two responses are still competing for one situation, and that is exactly the distinction the stop is testing.
          - "Why you cannot be wrong about exactly one. With every response used once, three correct joins leave the fourth with only one place to go. Any error therefore involves at least two joins. That is worth remembering when the last pair looks forced: the fault is usually not in the join you are struggling with, but in one you made early and stopped questioning."
        concept: Molecular geometry, polarity and intermolecular forces
        answerText: 1. Small ionic species in water. → Often dissolves as hydrated ions. 2. Nonpolar organic liquid that barely mixes with water. → May form a separate phase or surface film. 3. Polar neutral molecule capable of hydrogen bonding. → Often has appreciable water solubility. 4. Water-avoiding compound that sticks strongly to organic-rich sediment. → May concentrate in suspended particles or sediment.
      - group: WATER
        call: Use the common-ion effect to clear the limit
        task: If carbonate is raised eightfold and the salt behaves as a 1:1 solid, estimate the new dissolved-metal concentration.
        title: Use the common-ion effect to clear the limit
        place: Water and Sediment Laboratory
        setup: Use the Ksp relationship as a ratio; you do not need the absolute value of Ksp.
        question: "Eight times the carbonate: what happens to the dissolved metal?"
        scene: The filtered water has 3.1 mg/L of dissolved metal against a 0.5 mg/L permit limit. The solid is a 1:1 metal carbonate and pH is fixed. Osei can raise dissolved carbonate eightfold at the pilot without changing the water volume.
        assumes:
          - a saturated solution is in equilibrium with a 1:1 solid
          - Ksp stays constant when temperature stays fixed
        takeaway: For a 1:1 sparingly soluble salt, increasing 1 ion lowers the equilibrium concentration of the other in inverse proportion.
        format: CHOICE
        why: For a 1:1 metal carbonate, the solubility product is proportional to the dissolved metal concentration times the carbonate concentration. At fixed temperature, that product stays constant at equilibrium. Raising carbonate by a factor of eight therefore drives the dissolved metal down by the same factor. Starting from 3.1 mg/L gives about 0.39 mg/L. That is below the 0.5 mg/L limit, although a real pilot still has to check pH, complexation and settling.
        rebuttals:
          - Ksp is fixed, not the dissolved-metal concentration. Changing the common ion changes the equilibrium solubility.
          - For a 1:1 salt, keeping Ksp fixed makes the 2 concentrations move inversely, not together.
          - The square would apply only if the stoichiometric powers in the Ksp expression required it. This simplified solid is 1:1.
        choices:
          - About 0.39 mg/L, because the dissolved metal falls by about a factor of 8.
          - About 3.1 mg/L, because solubility is fixed once the solid exists.
          - About 24.8 mg/L, because both ion concentrations rise together.
          - About 0.05 mg/L, because the concentration falls by the square of 8.
        answer: About 0.39 mg/L, because the dissolved metal falls by about a factor of 8.
        guide: "All four options give a number and a reason. The reasons are what differ: fixed solubility, a product held constant, both ions rising, or a squared dependence. Check the stoichiometry of the solid first. The exponents in the solubility product come from it. This has to clear a permit limit. An answer out by a factor of eight is a discharge that fails its consent."
        background:
          - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
          - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
          - "What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested."
        concept: Solubility product and the common-ion effect
      - group: WATER
        call: Spend the river survey budget
        task: Allocate 20 sample bottles so the survey can answer the intake, background and phase-partitioning questions this week.
        title: Spend the river survey budget
        place: Sediment Analysis Room
        setup: The utility wants an answer this week. What does the survey sample?
        question: How do you spend 20 bottles without leaving a required river question unanswered?
        scene: Ferreira has 20 samples in the survey budget. The compound is sparingly soluble, and the river runs 900 metres from the release to the intake. Her two grab samples taken so far disagree by a factor of six.
        story: "The survey has 20 samples in the budget. The compound is sparingly soluble, the river is 900 metres upstream of the intake, and the 2 grab samples taken so far disagree by a factor of 6. Sampling design is where environmental chemistry is usually won or lost: coverage in space, coverage in time, and coverage across phases each buy a different kind of certainty, and a striking photograph of an oily bank buys none of them. The point of a survey is to test the model you built — to give the partitioning prediction a real chance to be wrong — rather than to collect confirmation from the most visually convincing spot on the river."
        assumes:
          - different sample locations and phases answer different questions
          - a clean water sample cannot rule out contaminant stored in solids
        takeaway: A sampling plan is a set of questions it can answer, and every bottle spent on one question is unavailable to another.
        format: ALLOCATE
        why: Environmental sampling needs coverage across the dimensions that can change the conclusion. Intake samples measure current exposure, upstream samples establish background, and solids plus sediment test whether a water-avoiding compound has left the water column. A visually stained bank may be interesting, but it is not required for the main decision. The survey must test movement toward the intake and storage in another phase. The twenty-bottle limit forces those priorities to be explicit instead of letting every desirable sample appear on the plan.
        allocate:
          pool:
            amount: 20
            unit: sample bottles
            mode: scalar
          items:
            - id: background
              label: Upstream and tributary background sites
              cost: 4
            - id: intake
              label: Intake water time series
              cost: 6
            - id: solids
              label: Suspended-solids samples
              cost: 4
            - id: sediment
              label: Sediment transect
              cost: 4
            - id: stain
              label: Detailed sampling of the visibly stained bank
              cost: 5
          answers:
            - question: Is concentration at the drinking-water intake changing through the week?
              requires:
                - intake
              required: true
            - question: How much of the measured signal is above upstream background?
              requires:
                - background
              required: true
            - question: Is the contaminant leaving the water column for particles and sediment?
              requires:
                - solids
                - sediment
              required: true
            - question: What exactly caused the most visible bank discoloration?
              requires:
                - stain
          hint: Select sampling packages until the required decision questions are all answerable. The panel updates which questions your current bottle allocation can support.
          commit: Commit the plan
        guide: Twenty bottles is the whole survey. Each package you select spends some of them, and the panel shows which river questions your current plan can answer. Watch that list rather than the map. Two grab samples already disagree by a factor of six, so a plan that cannot explain why is a plan that will be argued with.
        background:
          - Why the disagreement is the design brief. A factor of six between two grabs means the compound is not evenly mixed. That can be plume structure across the channel, depth stratification, or a change with time. Each of those is a different sampling pattern, and one grab per site cannot tell them apart.
          - Why sparing solubility matters. A compound that barely dissolves travels partly as droplets or on particles rather than in solution, so a filtered bottle and an unfiltered one answer different questions. Nine hundred metres is far enough for that difference to matter at the intake.
          - "What the required questions are for. Not everything the survey could ask, but the ones a decision hangs on: whether the intake is affected now, whether it will be, and by how much. A plan that answers other things beautifully and misses one of those has spent twenty bottles badly."
        concept: "Sampling: representative samples and sample handling"
        answerText: Use 18 bottles on background sites, the intake time series, suspended solids and sediment. Those packages answer all three required questions and leave two bottles uncommitted; the detailed stained-bank package is the defensible item to forgo.
  - title: The Concentration Problem
    objective: Produce concentration maps whose units, detection limits, and quality controls are explicit.
    briefing: City leaders ask whether the contaminant is "high," but samples differ in dilution, path length, and what else is in the sample. The team must turn signals into defensible concentrations. An incorrect concentration map can either close a safe water system or expose residents through a false reassurance.
    stake: A week and a day in, and this is where the utility director, Marisol Reyes, and her quality assurance lead, Rie Nakamura, stop agreeing. The results are back as numbers and the city is holding each one against a legal limit, one water system at a time. Nakamura wants every result re-run before anything reopens. Reyes points out that four systems are shut on numbers nobody has questioned, hospitals are on tankers, and a week of caution has a cost too — and today she is right. Today you turn readings into what was really in the river, decide whether one result can be trusted, and choose where to sample. Outside the calibrated range nobody has checked what the instrument does at all.
    takeaway: Produce concentration maps whose units, detection limits, and quality controls are explicit.
    stops:
      - group: QUANT
        call: Undo the dilution
        task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation. Estimate the original concentration.
        title: Undo the dilution
        place: Quantitative Analysis Lab
        setup: A river sample is diluted before analysis.
        question: Estimate the original concentration.
        scene: Nakamura hands you the raw reading with its preparation log — the instrument reports what was in the vial, not what was in the river. City leaders are comparing your number against a threshold and closing or opening a water system with it.
        story: The instrument reports what was in the vial, not what was in the river. Samples are diluted so that the signal falls inside the range the method can actually measure, and the analyst has to carry that factor back through before the number means anything about the water — a tenfold dilution reported as-is understates the river by a factor of ten. Sample preparation is part of the result, not something that happened to it beforehand. City leaders are comparing the number you hand over against a threshold and closing or opening a water system with it.
        assumes:
          - diluting a sample lowers its concentration by a known factor
        takeaway: Sample preparation is part of the quantitative result.
        format: BALLPARK
        why: Samples are diluted so the signal lands inside the range the method can measure. That factor has to be carried back through before the number says anything about the river. A tenfold dilution reported as measured understates the river ten times over — and the report still looks like a valid result, because nothing about the number says it was diluted. Preparation is part of the answer, not something that happened to it first.
        estimate:
          prompt: The laboratory diluted the river sample before it went on the instrument. The number on the screen is not the number the city asked for.
          question: Estimate the original concentration in the river sample.
          labels:
            - 2.5 mg/L  (measured, diluted)
            - 100.0 mL  (final volume)
            - 10.0 mL  (sample taken)
            - 0.25 mg/L  (instrument detection limit)
            - 1,000 mL  (bottle volume)
          values: [2.5, 100, 10, 0.25, 1000]
          slots: 3
          template: "{0} × {1} ÷ {2}"
          formula: a*b/c
          correct: [0, 1, 2]
          target: 25
          tolerance: 2
          units: mg/L
          solution: C_original = 2.5 × 100.0 / 10.0 = 25 mg/L.
          explanation: A ten-fold dilution has to be undone before the result is compared with any threshold. Reporting the diluted figure understates the river by a factor of ten.
          givens:
            - 10.0 mL sample diluted to 100.0 mL
            - Measured diluted concentration = 2.5 mg/L
          relationship: The concentration of the solution is the amount dissolved divided by the volume holding it, so amount = C × V. Diluting adds solvent and not solute, which leaves C_original V_sample = C_diluted V_final.
        guide: "Five numbers, and two of them belong to different questions: a detection limit and the volume of the bottle. Two others are the volumes before and after the dilution, and only their ratio matters. Ask of each number whether it describes the vial, the river, or the method. A dilution not carried back understates the river tenfold, and nothing about the reported number says it was diluted."
        background:
          - What the relationship says. The concentration of the solution is the amount dissolved divided by the volume holding it, so amount = C × V. Diluting adds solvent and not solute, which leaves C_original V_sample = C_diluted V_final.
          - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs, and whether the size of the answer looks right once they are in place.
          - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label is how a unit mismatch, or a quantity belonging to a different part of the problem, is caught before it is placed — which is the habit this format exists to build.
        concept: Solutions, molarity and dilution
        answerText: C_original = 2.5×100/10 = 25 mg/L.
      - group: QUANT
        call: Protect the calibration
        task: Predict the result of a 1:1 dilution, make the dilution, then verify it with an in-range measurement before reporting the original concentration.
        title: Protect the calibration
        place: River Mapping Center
        setup: Match each problem to the correction.
        question: What should the absorbance become after dilution, and does the rerun support the dilution model?
        scene: An instrument will return a number for almost anything you put in front of it. Dana Whitfield, the calibration technician, lays out the panel — everything needed to decide whether this reading can be defended.
        story: An instrument will return a number for almost anything you put in front of it, which is why quality control exists. A calibration curve is a claim about a specific range of concentrations, built from standards that bracket that range; a blank says whether the laboratory contributed to the signal; a spike recovery says whether the matrix is suppressing or enhancing the response; replicates say whether the measurement is stable at all. Each of them fails in a distinct way, and the panel in front of you contains everything you need to decide whether this reading can be defended.
        assumes:
          - Beer–Lambert gives A proportional to concentration when path length and absorptivity are fixed
          - a 1:1 dilution halves concentration
        takeaway: A measurement outside its calibrated range becomes defensible only after a controlled change moves it into-range and the predicted response is verified.
        format: VERIFY
        why: Beer–Lambert predicts absorbance proportional to concentration while the method remains linear. A 1:1 dilution halves concentration, so an absorbance of 1.34 should fall to about 0.67. The observed 0.68 is inside the validated calibration range and agrees with that prediction. The diluted concentration can then be read from the calibration and doubled for the original sample. This is stronger than extrapolating 1.34 because both the dilution and the response are checked inside the range established by standards.
        verify:
          prediction:
            label: ""
            unit: absorbance
            min: 0.64
            max: 0.7
            step: 0.01
          truth: 0.68
          passRatio: [0.95, 1.05]
          intervention:
            label: Mix equal volumes of sample and clean matrix
            note: ""
            outcome: Delivered. Confirmed.
          measurement:
            label: Rerun diluted sample inside the calibration range
            note: ""
            cost: 1
            costUnit: ""
          hint: Lock the absorbance you expect after a 1:1 dilution. Make the dilution, then spend the verification run; a successful dilution is not evidence until the rerun is measured.
          lock: Lock the prediction
          run: Commit it
          measure: Take the measurement
          commit: Report
        guide: Lock the absorbance you expect after a one-to-one dilution before you make it. Then make the dilution and read what the instrument returns. The last step costs a verification slot, and spending it is the point. An instrument returns a number for almost anything, and only the comparison says whether this one can be defended.
        concept: Spectroscopy, Beer–Lambert and calibration curves
        answerText: Predict about 0.67 absorbance, make the 1:1 dilution, and rerun it. The observed 0.68 supports the dilution. An in-range result near 6.9 mg/L corresponds to about 13.8 mg/L in the original sample.
      - group: QUANT
        call: Map concentration with limited samples
        task: You cannot sample every metre of river. Where do the samples go?
        title: Map concentration with limited samples
        place: Quality Assurance Desk
        setup: You cannot sample every metre of river. Where do the samples go?
        scene: Reyes wants a concentration map of 11 kilometres of river for the city, and the laboratory can run 30 samples. The 2 known hot spots are 400 metres apart, and the field kit reads to plus or minus 30% against the laboratory's 5.
        story: "The city wants a concentration map of 11 kilometres of river, and the laboratory can run 30 samples. The 2 known hot spots are 400 metres apart, and the field kit reads to plus or minus 30% against the laboratory's 5. A map is a compromise between two things that both cost money: analytical validity, which is whether each number can be trusted, and spatial coverage, which is whether the numbers are in the places the decision depends on. Neither alone protects anybody — perfect chemistry at the wrong points, or dense sampling with an unvalidated method, both produce a confident map that misleads. Decide where the decisions actually get made, then spend on the sampling that constrains them."
        assumes:
          - a map is only worth what the decisions it supports are worth
        takeaway: Spatial coverage without analytical validity—or validity without spatial coverage—cannot protect the city.
        format: CHOICE
        why: "A map trades off two things that both cost money. Analytical validity is whether each number can be trusted. Spatial coverage is whether the numbers sit where the decision is made. Neither alone protects anybody: perfect chemistry at the wrong points and dense sampling with an unproven method both produce a confident map that misleads. Every decision the city is about to make happens at the intake, so detail anywhere else is detail nobody acts on."
        rebuttals:
          - Longitudinal sampling captures transport and is the second call. It answers where the contaminant is going rather than what the intake is drawing.
          - Replicates, blanks and spikes make each number defensible and place none of them. They are how you sample, not where.
          - Sampling the stained water samples the appearance. The compound that matters here is colourless.
        choices:
          - Densely, around the drinking-water intake.
          - Spread along the river, upstream and downstream, over several days.
          - Into replicates, blanks and spikes at every site already planned.
          - Wherever the water is visibly stained.
        answer: Densely, around the drinking-water intake.
        guide: Every option here buys something real, and they trade against one another. Coverage of the river runs against confidence in each number, and both against thirty samples. Ask of each what decision it improves. Perfect chemistry where nobody drinks misleads. So does dense coverage with an unproven method. Every decision the city makes happens in one place, and detail elsewhere is detail nobody acts on.
        background:
          - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
          - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
          - "What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested."
        concept: "Sampling: representative samples and sample handling"
      - group: QUANT
        task: Work the sample queue while the priority changes.
        title: What the bench is running now
        place: Analytical Laboratory
        question: Run to the priority on the bench card, and keep watching the card.
        scene: Samples queue on the bench all day. Nakamura holds one priority, and changes it as the incident does — after the river result, after the schools ask, after the hold times start expiring.
        assumes:
          - a laboratory works to a stated priority that somebody can change
        takeaway: The cost of a withdrawn instruction is paid by whoever is still working to it.
        format: SPOT
        why: "Three priorities run across the day and each wants a different part of the rack. Anything the commander is waiting on, then anything near its hold time, then anything from a drinking water source. A sample can answer two at once, which is what makes the change cost real. The panel scores the window either side of each change, because most of the rack is wanted by neither priority and is correctly left queued by somebody who has read nothing. The laboratory's own version is the twenty minutes after the schools ask: the priority has changed to drinking water, and the instrument is still working through river samples that were urgent an hour ago. And the cost is invisible afterwards — a sample past its hold time comes out of the fridge looking exactly like a sample that is still valid."
        spot:
          targets:

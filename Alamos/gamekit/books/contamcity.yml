          - Presentation is not evidence. The same weak data arranged more attractively is the one option here that adds no measurement.
        choices:
          - A second method of a different kind, run on the same extract.
          - A longer column and a slower change in the liquid carrying the sample, to improve the separation.
          - Certified reference material and matrix spikes.
          - The same data, presented more clearly in the report.
        answer: A second method of a different kind, run on the same extract.
        guide: Two candidates come off the column together. So anything that depends on how fast they travel inherits the ambiguity. Sort the options by that test. Does this one improve the separation, replace it with evidence of another kind, add controls, or only change the presentation? Controls make a number defensible and cannot resolve an overlap. Better presentation adds no measurement at all.

          - How to use the one-each rule. Because the responses are a set to be distributed rather than a list to be sampled, every join you make constrains the rest. Settling the two you are confident of can leave the remaining pair decided by elimination. Where it does not, two responses are still competing for one situation, and that is exactly the distinction the stop is testing.
          - "Why you cannot be wrong about exactly one. With every response used once, three correct joins leave the fourth with only one place to go. Any error therefore involves at least two joins. That is worth remembering when the last pair looks forced: the fault is usually not in the join you are struggling with, but in one you made early and stopped questioning."
        concept: "Measurement: significant figures, blanks, detection limits, uncertainty"
        answerText: 1. Identity confirmed by independent methods and controls. → Treat identity as established with documented methods. 2. A transformation product is plausible but lacks a validated standard. → Label provisional and continue method development. 3. Filtered water meets criteria, but sediment remains contaminated. → Keep managing the sediment, and keep watching for the metal coming back. 4. Pipeline corrosion is controlled only while chemistry remains within a narrow range. → Use conditional operation with chemistry and corrosion triggers.
      - group: TREAT
        call: Audit the electrochemical removal from the charge passed
        task: Use the current, time and ion charge to estimate the maximum moles of divalent metal that could plate out.
        title: Audit the electrochemical removal from the charge passed
        place: Treatment Plant Gallery
        setup: Use the electrical log to set a theoretical ceiling before trusting the water analysis.
        question: What upper bound does 6 hours at 40 A place on metal removal?
        scene: The electrochemical polishing cell has run for 6 hours at 40 amperes. Before Osei trusts the meter on the water leaving it, he wants to know how much metal that run should have taken out.
        assumes:
          - current is charge per unit time
          - a divalent metal ion needs two electrons to become neutral metal
        takeaway: Faraday’s law turns measured charge into a quantitative upper bound on electrochemical removal.
        format: BALLPARK
        why: Current times time is charge. Dividing charge by the Faraday constant gives moles of electrons, and a divalent metal needs two electrons per metal ion. 6 hours at 40 A passes 864,000 C, or about 8.95 mol of electrons. The theoretical maximum is therefore about 4.48 mol of metal. Real removal is lower when side reactions carry some current. Comparing measured removal with this bound gives current efficiency and catches impossible treatment claims.
        rebuttals:
          - Concentration affects the rate and the efficiency; the charge is what limits the total.
          - One electron deposits one atom only for a singly charged ion. A divalent ion needs two.
          - The ion's charge is exactly what converts moles of electrons into moles of metal.
        estimate:
          prompt: The electrochemical polishing cell ran continuously for 6 hours at 40 amperes on a divalent metal ion.
          question: Estimate the maximum moles of metal that could be deposited.
          labels:
            - 40 A  (current)
            - 21,600 s  (time in seconds)
            - 2  (electrons per metal ion)
            - 96,485 C/mol  (Faraday constant)
            - 6  (the figure in hours — not seconds)
          values: [40, 21600, 2, 96485, 6]
          slots: 4
          template: "{0} × {1} ÷ ({2} × {3})"
          formula: a*b/(c*d)
          correct: [0, 1, 2, 3]
          target: 4.48
          tolerance: 0.2
          units: mol
          solution: Q = 40 × (6×3600) = 864,000 C. n = 864,000 /(2×96,485) ≈ 4.48 mol metal.
          explanation: Charge counts electrons. A divalent ion requires two moles of electrons per mole of metal, so side reactions can only make the real removal smaller than this theoretical ceiling.
          givens:
            - I = 40 A
            - t = 6.0 h = 21,600 s
            - z = 2 electrons per metal ion
            - F = 96,485 C/mol e⁻
          relationship: Q = It and n_metal = Q/(zF) = It/(zF).
        guide: Five numbers, and two of them are the same duration in hours and in seconds. Another is the electrons each metal ion needs, which is a property of the metal. Check the units the constant is written in before choosing anything. What comes out is an upper bound rather than a removal. Side reactions carry some of the current. Measured removal below it is efficiency; above it is impossible.
        background:
          - What the relationship says. Q = It and n_metal = Q/(zF) = It/(zF).
          - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs, and whether the size of the answer looks right once they are in place.
          - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label is how a unit mismatch, or a quantity belonging to a different part of the problem, is caught before it is placed — which is the habit this format exists to build.
        concept: Electrolysis and quantitative electrochemistry
        answerText: Q = It = 864,000 C. That is about 8.95 mol e⁻, so a divalent ion can deposit at most 8.95/2 ≈ 4.48 mol of metal.

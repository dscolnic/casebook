  - title: The Water Changes pH
    objective: Select a controlled neutralization strategy and determine when buffer capacity will be exhausted.
    briefing: The river intake becomes acidic, while one proposed treatment could overshoot into strongly basic conditions. The player must use acid-base equilibria and buffering to control pH without masking chemical risk. A pH correction can mobilize metals, damage infrastructure, or injure workers if the chemical context is ignored.
    stake: Eleven days after the fire. The intake has turned acidic and Reyes wants a neutralising dose this morning; Novák, who maintains the pipeline, wants to know what it will do to her mains before anybody doses anything. The titration Ferreira ran overnight is nearly flat for four millilitres and then turns over hard. Today you work out how much acid is really there, read what that curve says about this water, and pick a dose that will not overshoot. There is one dosing pump and no way to take a dose back out. Overshoot and metals come off the pipe walls. Novák's question is the right one.
    takeaway: Select a controlled neutralization strategy and determine when buffer capacity will be exhausted.
    stops:
      - group: WATER
        call: How many moles of acid are present?
        task: Convert pH 4.0 to [H⁺], then estimate the moles of free hydrogen ion in 1,000 L.
        title: How many moles of acid are present?
        place: Water Intake Laboratory
        setup: Use an idealized strong-acid sample.
        question: How many moles of free H⁺ does the pH reading represent?
        scene: The river intake is acidic and the plant is preparing a neutralisation dose. Ferreira measured a one-thousand-litre test volume at pH 4.0 overnight. Novák wants the size of the free hydrogen-ion pool before anybody adds base.
        story: The river intake has turned acidic and the plant needs a neutralisation dose. pH is a logarithmic measure of the hydrogen ion concentration that is free in solution right now — one pH unit is a factor of ten — so a modest-looking change in pH is a large change in concentration, and pH alone tells you nothing about how much acid is waiting undissociated to take its place. Convert to moles first. Dosing on the pH number alone is how a plant overshoots from acidic straight into strongly basic.
        assumes:
          - pH is a logarithmic scale — one unit is a factor of ten
        takeaway: pH is logarithmic, and converting it to moles still captures only the free hydrogen ion present at that moment.
        format: BALLPARK
        why: A pH of 4.0 means [H⁺] = 10⁻⁴ mol/L, not 4 mol/L and not 4 times neutral water. Multiplying that concentration by 1,000 L gives 0.10 mol of free H⁺. That number is useful but incomplete. Weak acids and buffers can release more H⁺ as base is added, so pH does not measure the full neutralisation demand. A titration does, which is why the later dosing decision cannot come from this calculation alone.
        estimate:
          prompt: The intake has turned acidic. Before dosing anything, the team wants the size of the free acid pool it is about to neutralise.
          question: Estimate the moles of hydrogen ion in the measured free pool.
          labels:
            - 1,000 L  (volume treated)
            - 1.0×10⁻⁴ mol/L  ([H⁺] at pH 4.0)
            - 4.0  (the pH reading itself)
            - 1.0×10⁻⁷ mol/L  ([H⁺] in neutral water)
          values: [1000, 0.0001, 4, 1e-7]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 0.1
          tolerance: 0.02
          units: mol H⁺
          solution: "[H⁺] = 10⁻⁴ mol/L. n = 1.0×10⁻⁴ × 1,000 = 0.10 mol H⁺."
          explanation: This is the free hydrogen ion only. Weak acids and buffers release more H⁺ as neutralisation proceeds, so a titration measures the real base demand far better than pH does.
          givens:
            - volume = 1,000 L
            - pH = 4.0
          relationship: pH = −log[H⁺], so [H⁺] = 10^(−pH). Then n = cV.
        guide: Four numbers, and two of them are the pH reading itself and the concentration in neutral water. A pH is a logarithm, so the reading cannot enter a mole calculation as a concentration. Convert first, then multiply by the volume. Note what the answer covers. This is the free hydrogen ion at this moment. A buffered water can release much more as base goes in.
        background:
          - What the relationship says. pH = −log[H⁺], so [H⁺] = 10^(−pH). Then n = cV.
          - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs, and whether the size of the answer looks right once they are in place.
          - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label is how a unit mismatch, or a quantity belonging to a different part of the problem, is caught before it is placed — which is the habit this format exists to build.
        concept: Acids, bases and pH
        answerText: pH 4.0 gives [H⁺] = 1.0×10⁻⁴ mol/L. In 1,000 L, n = cV = 0.10 mol of free H⁺.
      - group: WATER
        call: Read the titration curve
        task: The titration curve is on screen. Which explanation accounts for the plateau, the equivalence point and the dose the trial actually needed?
        title: Read the titration curve
        place: Acid-Base Bench
        setup: Match each feature to its meaning.
        scene: The trial dose calculated from the intake pH overshot badly. Ferreira sets her overnight bench titration beside a strong-acid reference curve, with fresh pH 4 and pH 7 calibration checks from the same electrode on the screen.
        story: "The curve on the screen is the result of adding base slowly and watching what the solution does. A titration is two instruments in one: quantitatively it measures how much base was needed to reach the equivalence point, which is a measure of total acid rather than free acid, and diagnostically its shape identifies the chemistry — the steepness of the rise, the presence or absence of a flat region, and where the equivalence point falls all say something about what kind of acid is in the water. The plant will dose the intake from your reading."
        assumes:
          - a weak acid holds most of its acidity undissociated
        takeaway: Titration is both a quantitative method and a diagnostic fingerprint.
        format: DIAGNOSIS
        why: A titration curve shows how much base the water consumes as pH changes. A long plateau means a buffer is absorbing added base while pH moves slowly. An equivalence point above pH 7 is also diagnostic of a weak acid system. The conjugate base left near equivalence is itself basic. A strong acid reference reaches equivalence sharply and with much less added base. The curve therefore measures total neutralisation demand that the starting pH alone cannot reveal.
        rebuttals:
          - A strong acid at pH 4.6 is the reference curve on the same axes, and it reaches equivalence at 5 mL with a sharp rise and no plateau. The intake does neither.
          - The electrode was calibrated against pH 4 and 7 buffers to within 0.02. The pH reading is correct — it is simply answering a different question from the 1 the dose needed.
          - An over-strength base would overshoot, but it would also shorten the titration. This titration took five times *more* base than expected, not less.
          - A safety factor is a policy, not a mechanism, and it cannot explain a plateau, an equivalence point at 8.4, or a five-fold demand. Adding margin on top of a misread curve is how the overshoot happened.
        figure:
          kind: line
          xLabel: Base added (mL)
          yLabel: pH
          caption: Titration of the intake water with standard base. The dashed line marks neutral pH.
          limit:
            at: 7
            label: pH 7
          series:
            - name: Intake water
              points:
                - [0, 3.4]
                - [4, 4.1]
                - [8, 4.5]
                - [12, 4.7]
                - [16, 4.9]
                - [20, 5.2]
                - [23, 5.9]
                - [25, 8.4]
                - [27, 10.1]
                - [32, 10.8]
                - [40, 11.2]
            - name: Strong acid, same pH
              points:
                - [0, 4.6]
                - [2, 4.9]
                - [4, 5.4]
                - [5, 8.9]
                - [6, 10.4]
                - [10, 11]
                - [20, 11.3]
                - [40, 11.6]
        headline: The intake reads pH 4.6. Dosing for a strong acid at that pH overshoots badly on the trial batch.
        readings:
          - zone: Intake
            label: pH
            value: "4.6"
            status: alarm
            note: The headline number, and the one that misled the dose.
          - zone: Titration
            label: Plateau from 4 to 20 mL
            value: pH moves 4.1 → 5.2
            status: high
            note: 16 millilitres of base for 1 pH unit.
          - zone: Titration
            label: Equivalence point
            value: pH 8.4
            status: high
            note: Above 7, not at it.
          - zone: Titration
            label: Base to equivalence
            value: 25 mL
            status: alarm
            note: Five times what the strong-acid reference needed.
          - zone: Reference
            label: Strong acid at the same pH
            value: 5 mL to equivalence
            status: normal
          - zone: Bench
            label: Electrode calibration
            value: pH 4 and 7 buffers within 0.02
            status: normal
            note: The pH reading itself is trustworthy.
        choices:
          - label: The water contains a weak acid and its buffer system
            mechanism: A long plateau, an equivalence point above pH 7 and 5 times the expected base demand are what a weak acid does — pH shows the free H⁺, not the reservoir behind it.
          - label: The intake is a strong acid at pH 4.6
            mechanism: Read the pH, calculate the free hydrogen ion, and dose to match it.
          - label: The pH electrode is out of calibration
            mechanism: A drifting electrode would explain why the dose calculated from pH was wrong.
          - label: The base used for dosing is more concentrated than labelled
            mechanism: An over-strength reagent would overshoot regardless of the water chemistry.
          - label: Nothing unusual; treatment always needs a safety factor
            mechanism: Operators routinely add extra base to be sure of neutralising.
        answer: The water contains a weak acid and its buffer system
        guide: "Six readings, and two of them exist to rule things out: the fresh calibration checks and the strong-acid reference at the same pH. Compare the shape of the trial curve against that reference before choosing. A long plateau and an equivalence point above neutral are both features a strong acid does not have. The trial dose overshot, which means whatever explains the curve also has to explain a demand the starting pH never showed."
        background:
          - "Why the unremarkable readings decide it. The salient reading is what draws attention, and it is usually consistent with several explanations at once, which is why it rarely settles anything. The readings that discriminate are the ones a candidate predicts should have moved and which have not: a normal value is a positive result against every mechanism that would have disturbed it."
          - How to work the candidates. Take each mechanism and predict the panel it implies before you look at the panel again — which readings it drives, in which direction, and by roughly how much. Then compare. Working that way round is what separates a diagnosis from a rationalisation, because the prediction is made before the data is consulted.
          - Why only one candidate survives. Several will account for part of the panel, deliberately so, and a partial fit is exactly what a confident wrong answer feels like from the inside. When two remain, look for the reading on which their predictions differ and let it decide. If no reading separates them you have not finished reading the panel.
        concept: Buffers and titration
      - group: WATER
        call: Control pH without overshoot
        task: Write the step-down and stop rules for the base pump before the mixed-tank pH stream is released.
        title: Control pH without overshoot
        place: Treatment Control Room
        setup: The plant wants a neutralisation dose this morning. What do you give them?
        question: The tank is climbing from 4.8 towards the 7.5 limit. At what pH do you stop the base feed?
        scene: The base pump is primed and Novák's operators are waiting to open the valve. Intake water is at pH 4.8, her cast-iron line is corroding, and every pump change appears one sampling interval later on the mixed-tank electrode.
        story: "Neutralisation in a live water system is a control problem, not an arithmetic problem. The dose calculated from one grab sample assumes the water is uniform, the demand is fully characterised and the mixing is instantaneous, and none of those is true in a treatment train. Overshooting into strongly basic conditions is not a smaller mistake than under-dosing: it can mobilise metals from pipework and sediment that the acidic water was leaving alone. The plant is waiting on a dose, and what it is given first decides whether the correction is a measurement or a guess."
        assumes:
          - the mixed-tank pH reading lags a pump change by one sampling interval
          - pH is logarithmic, so equal pH steps do not represent equal amounts of hydrogen ion
        takeaway: When a process has delay, a control threshold must be set before the final limit because the system keeps moving while the action takes effect.
        format: TRIGGER
        why: Neutralisation in a flowing plant has delay. A pump change occurs now, but the mixed sample that proves its effect arrives later. Waiting for the displayed pH to reach the desired final value therefore guarantees overshoot. Staged dosing writes the rule in advance. The feed is slowed while buffer demand can still be measured. It is then stopped early enough that mixing and residual base carry the final reading upward without crossing the limit. The threshold is a control decision, not a retrospective interpretation.
        trigger:
          scale:
            label: The mixed tank
            unit: pH
            min: 4
            max: 9
            step: 0.05
            anchors:
              - at: 4.8
                means: the tank as it stands, acid enough to be outside consent
              - at: 8.2
                means: over-corrected past neutral, and consent is breached from the other side
          direction: rising
          conditions:
            - id: stop
              label: Stop base feed
              leadHours: 1
              window:
                min: 6.5
                max: 7
          stream:
            - at: update 0
              update: 4.8 pH
              value: 4.8
              hoursLeft: 7
            - at: update 1
              update: 5.4 pH
              value: 5.4
              hoursLeft: 6
            - at: update 2
              update: 6 pH
              value: 6
              hoursLeft: 5
            - at: update 3
              update: 6.5 pH
              value: 6.5
              hoursLeft: 4
            - at: update 4
              update: 7 pH
              value: 7
              hoursLeft: 3
            - at: update 5
              update: 7.4 pH
              value: 7.4
              hoursLeft: 2
            - at: update 6
              update: 7.8 pH
              value: 7.8
              hoursLeft: 1
            - at: update 7
              update: 8.2 pH
              value: 8.2
              hoursLeft: 0
          consequenceLimit: 7.5
          rehearsal:
            note: the last neutralisation on this tank
            stream:
              - value: 4.9
                hoursLeft: 7
              - value: 5.6
                hoursLeft: 6
              - value: 6.3
                hoursLeft: 5
              - value: 6.9
                hoursLeft: 4
              - value: 7.2
                hoursLeft: 3
              - value: 7.3
                hoursLeft: 2
              - value: 7.4
                hoursLeft: 1
              - value: 7.4
                hoursLeft: 0
          objective: The base feed is stopped in time to leave the mixed tank under pH 7.5.
          release: Release the board
          commit: Stand by the board
        guide: "One rule, written before the run and fixed the moment you release it. The base feed is pushing the tank up, and anything past pH 7.5 breaches consent from the other side. The catch is delay: a pump command shows on the mixed-tank electrode one reading later, so the tank goes on climbing after the feed is off. Put the line back from 7.5 by that one reading of travel — and not so far back that it fires on water which has shown nothing yet."
        concept: Acids, bases and pH
        answerText: Stop the feed around pH 6.5. The tank climbs about half a unit between the command and the reading that shows it, so a rule written at the number you actually want lands past the limit.
  - title: Equilibrium in the Reservoir
    objective: Predict how pH and ligands shift dissolved concentration and design monitoring for the metal coming back.
    briefing: After pH adjustment, dissolved contaminant decreases but sediment concentrations rise. The team must determine whether precipitation and complexation have transferred rather than destroyed the hazard. An apparently clean reservoir can become contaminated again when chemistry or flow changes.
    stake: A fortnight in, and two weeks of results has been clean. The dissolved amount is down, the amount in the sediment is up by about as much, and Elena Stavros, who will have to monitor it for a decade, is the only person in the room still asking about it — everybody else has moved on to the treatment plant. Today you predict where the contaminant goes the next time conditions move, and design monitoring that would catch it coming back. Nothing was destroyed by the correction. It was moved into a form that is not in the water today, and it is still in the reservoir. What tests that claim is a storm, a warm month, or the autumn week when the lake turns over.
    takeaway: Predict how pH and ligands shift dissolved concentration and design monitoring for the metal coming back.
    stops:
      - group: WATER
        call: From condition change to new equilibrium
        task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
        title: From condition change to new equilibrium
        place: Reservoir Sampling Dock
        setup: Order the reasoning.
        scene: After the pH adjustment the dissolved concentration has fallen and the sediment concentration has risen. Camila Ibarra, the sediment analyst, puts both curves on one page — reading only the water is how a reservoir gets declared clean while the contaminant settles.
        story: "After the pH adjustment the dissolved concentration has fallen and the sediment concentration has risen. A chemical equilibrium shifts in response to changes in conditions, but the total amount of material is conserved throughout — nothing about a shift destroys anything. Predicting where a system lands takes both halves: the equilibrium expressions, which say which direction it moves, and a mass balance, which says how much of what has to be somewhere. Reading only the water is how a reservoir gets declared clean while the contaminant is settling to the bottom of it."
        assumes:
          - material is conserved — a shift moves it, it does not destroy it
        takeaway: A lower dissolved concentration may mean phase transfer, not removal from the system.
        format: SEQUENCE
        why: "Predicting where a system lands takes both halves of the problem. The relevant reactions have to be identified first, because you cannot write an equilibrium expression for chemistry you have not named. The expressions and the mass balance come next: the expressions say which direction the system moves, and the mass balance says how much of what has to be somewhere. Only then does changing a condition in the model mean anything, and only then can a prediction be compared against a measurement."
        rebuttals:
          - Identify the reactions first. Dissolution, precipitation and complexation are different processes, and the model needs to know which are in play.
          - Write the equilibrium relationships and the mass balance second. Direction and conservation are both needed; either alone gives a wrong answer.
          - Change pH, ligand or ionic strength third — in the model, where being wrong is cheap.
          - Predict, then measure, last. A split predicted and never checked is an assumption with arithmetic attached.
        cards:
          - Identify the relevant dissolution, precipitation, or complexation reactions.
          - Write the equilibrium relationships and mass balance.
          - Change pH, ligand concentration, or ionic strength in the model.
          - Predict how much ends up dissolved and how much stays solid, and measure it.
        order: [0, 1, 2, 3]
        guide: "Each of these four needs something the others supply. Ask what each one cannot be done without. An equilibrium expression cannot be written for chemistry nobody has named. Changing a condition means nothing until the model balances mass. And the last card is the one this stop turns on: a prediction nobody measured against is not a prediction."
        background:
          - "Why the order is graded whole. A sequence is a claim about dependency: each step is here because the one before it has already happened, or has to have. One transposed pair falsifies that claim wherever it sits, so partial credit would be credit for a sequence that does not work."
          - Why the ends are the place to start. The first and last cards are constrained by having nothing before or after them, which usually makes them the two you can settle from the scene alone. Pinning them collapses the remaining arrangements sharply, and what is left in the middle is where the actual judgement lives.
          - What the rail can be ordered on. Time is the usual axis, but it is not the only one. An order can run on cost, on risk, or on reversibility — every observation that leaves the sample as it was, before any that consumes it. On those boards a chronological reading finds nothing, because none of the steps has to happen at a particular hour.
        concept: Equilibrium and Le Chatelier
        answerText: Identify the relevant dissolution, precipitation, or complexation reactions. → Write the equilibrium relationships and mass balance. → Change pH, ligand concentration, or ionic strength in the model. → Predict how much ends up dissolved and how much stays solid, and measure it.
      - group: WATER
        call: Interpret the shift
        task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
        title: Interpret the shift
        place: Equilibrium Chemistry Group
        setup: Match each change to the likely direction.
        scene: Reservoir conditions are changing as the treatment continues. Operators have removed some solids, a new ligand has entered with an upstream discharge, and pH varies through the day. Stavros points out that next spring nobody will be sampling continuously for remobilised metal.
        story: "A treatment that works today has to keep working when the conditions change, and reservoirs change constantly — pH, temperature, ionic strength, dissolved oxygen and the removal of a solid phase all push on the same equilibria. Le Chatelier's principle gives the direction: a system at equilibrium responds to a change by shifting in the direction that partly offsets it. What this means in practice is that a contaminant locked into a solid under this month's chemistry can be released again under next month's, and nobody will be sampling for it by then."
        assumes:
          - a system at equilibrium responds to a change by partly offsetting it
        takeaway: Treatment plans must anticipate the next environment, not only the current sample.
        format: PROTOCOL
        why: Le Chatelier's principle gives the direction, and each condition pushes a different way. Removing a solid phase from contact takes away the source of further dissolution. A ligand that binds the dissolved metal holds it in solution, so total dissolved concentration can rise even as free metal falls. A pH shift that favours an insoluble hydroxide drives precipitation. A sediment that later meets acidic water can release what it captured. A contaminant locked into a solid this month can therefore return next month.
        rebuttals:
          - Physically removing the precipitate takes the solid out of contact, so there is less driving further dissolution.
          - A strong ligand holds the metal in solution as a complex, so the total dissolved concentration can rise rather than fall.
          - A pH shift toward an insoluble hydroxide favours precipitation. This is the reaction treatment is usually trying to cause.
          - Acidic water meeting old sediment reverses the precipitation that captured it. What was locked away comes back.
        columns:
          - What changes in the water
          - Which way the equilibrium moves
        scenarios:
          - A solid precipitate is removed from contact with water.
          - A ligand strongly binds the dissolved metal.
          - pH shifts to favor an insoluble hydroxide.
          - Sediment later encounters acidic water.
        choices:
          - Further dissolution pressure is reduced after physical removal.
          - Complexation can increase total dissolved concentration.
          - Precipitation is favored.
          - Material that settled out earlier may dissolve again.
        mapping: [0, 1, 2, 3]
        guide: Four changes to the reservoir, and each pushes the same equilibrium a different way. Ask of each which side it takes something from or adds something to. One of them raises the total dissolved metal while lowering the free metal, which reads as a treatment failure and is not. Next spring nobody will be sampling continuously, so the answer has to be about the environment the sediment will be in then.
        background:
          - Why this is a matching board and not four separate questions. Responses on boards like this are written to be plausible for more than one situation, so choosing them one at a time lets a nearly-right answer through unexamined. Having to place all of them forces the comparison — not "is this reasonable here", but "is it more right here than there".
          - How to use the one-each rule. Because the responses are a set to be distributed rather than a list to be sampled, every join you make constrains the rest. Settling the two you are confident of can leave the remaining pair decided by elimination. Where it does not, two responses are still competing for one situation, and that is exactly the distinction the stop is testing.
          - "Why you cannot be wrong about exactly one. With every response used once, three correct joins leave the fourth with only one place to go. Any error therefore involves at least two joins. That is worth remembering when the last pair looks forced: the fault is usually not in the join you are struggling with, but in one you made early and stopped questioning."
        concept: Equilibrium and Le Chatelier
        answerText: 1. A solid precipitate is removed from contact with water. → Further dissolution pressure is reduced after physical removal. 2. A ligand strongly binds the dissolved metal. → Complexation can increase total dissolved concentration. 3. pH shifts to favor an insoluble hydroxide. → Precipitation is favored. 4. Sediment later encounters acidic water. → Material that settled out earlier may dissolve again.
      - group: WATER
        call: Predict whether the salty pond freezes
        task: Use freezing-point depression to estimate the pond freezing point and compare it with −4 °C.
        title: Predict whether the salty pond freezes
        place: Water and Sediment Laboratory
        setup: Use the salt analysis to predict the phase change before invoking another heat source.
        question: Should this pond still be liquid at −4 °C?
        scene: The holding pond sits liquid at −4 °C while the freshwater ditch beside it is frozen. Ferreira's analysis gives 1.2 mol of dissolved NaCl per kilogram of water. She asks whether the liquid pond is chemically expected or evidence of an unmeasured heat source.
        assumes:
          - molality is moles of solute per kilogram of solvent
          - NaCl contributes about two dissolved particles per formula unit in this estimate
        takeaway: Freezing-point depression depends on the number of dissolved particles, so concentration can predict whether a solution remains liquid below 0 °C.
        format: BALLPARK
        why: For an ideal solution, ΔTf = iKf m. Sodium chloride contributes roughly 2 dissolved ions, so i is about 2. With Kf = 1.86 °C kg/mol and m = 1.2 mol/kg, the depression is about 4.5 °C. That puts the expected freezing point near −4.5 °C, so liquid water at −4 °C is plausible without any extra heat source. The estimate is imperfect at high salt concentration, but it gives the correct scale and direction.
        rebuttals:
          - Volume changes how long freezing takes, not the temperature at which it happens.
          - The heat of solution was released when the salt dissolved, days ago, and has long since gone.
          - Density and freezing point are not related in that way; the ordering here comes from the solute concentration.
        estimate:
          prompt: The pond is below 0 °C but remains liquid. The salt analysis is available.
          question: Estimate the freezing point of the pond.
          labels:
            - 2  (van ’t Hoff factor i)
            - 1.86 °C kg/mol  (Kf)
            - 1.2 mol/kg  (molality)
            - 0 °C  (pure-water freezing point)
            - −4 °C  (the observed pond temperature)
          values: [2, 1.86, 1.2, 0, -4]
          slots: 3
          template: 0 − {0} × {1} × {2}
          formula: 0 - a*b*c
          correct: [0, 1, 2]
          target: -4.5
          tolerance: 0.3
          units: °C
          solution: ΔTf ≈ 2 × 1.86 × 1.2 = 4.46 °C, so T_freeze ≈ −4.5 °C.
          explanation: A colligative property depends on the number of dissolved particles. NaCl contributes roughly two particles per formula unit in this simplified estimate.
          givens:
            - i ≈ 2 for NaCl
            - Kf for water = 1.86 °C kg/mol
            - m = 1.2 mol/kg
          relationship: ΔTf = iKf m, and T_freeze ≈ 0 °C − ΔTf.
        guide: Five numbers, and two of them are reference points rather than terms. One is the freezing point of pure water; one is the temperature the pond is at. Another is the number of particles each formula unit contributes, which is where the salt does its work. Ask of each whether the relationship needs it or the comparison does. The answer decides whether this is ordinary chemistry or an unmeasured heat source.
        background:
          - What the relationship says. ΔTf = iKf m, and T_freeze ≈ 0 °C − ΔTf.
          - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs, and whether the size of the answer looks right once they are in place.
          - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label is how a unit mismatch, or a quantity belonging to a different part of the problem, is caught before it is placed — which is the habit this format exists to build.
        concept: Colligative properties
        answerText: ΔTf ≈ 2 × 1.86 × 1.2 ≈ 4.5 °C, so the pond should freeze near −4.5 °C. Being liquid at −4 °C is therefore expected.
  - title: The Air Is Not Clear Yet
    objective: Identify likely secondary products and update monitoring locations and times.
    briefing: Sunlight and atmospheric oxidants transform remaining vapors into secondary products. The player must reason about radicals, reaction pathways, and changing exposure after the source is controlled. Residents may return after the primary plume clears while secondary pollutants are still forming.
    stake: Seventeen days after the fire. The main plume cleared a week ago and residents came home the day after. Since then Varga's monitors climb every afternoon and drop overnight, and he has been ignored twice because the release is over. He has three fixed monitors, all of them on the yard fence, and one van. Today you work out what is forming out there and move the monitoring to where and when it could see it. Monitoring built for the release will keep reporting that the release is over, and it will be right. People are back in their houses with the windows open.
    takeaway: Identify likely secondary products and update monitoring locations and times.
    stops:
      - group: GASES
        call: Build a secondary-pollutant pathway
        task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
        title: Build a secondary-pollutant pathway
        place: Atmospheric Monitoring Station
        setup: Order the generic atmospheric chain.
        scene: The primary vapour is falling after the source was sealed, but a different compound is rising at the neighbourhood monitor each afternoon. Erik Lindqvist, the dispersion modeller, posts sunlight, oxidant measurements and wind data from the same period beside the chemical traces.
        story: "The source has been controlled and the monitors have not settled. Sunlight drives atmospheric chemistry: photons break bonds in molecules that were stable overnight, producing radicals that react with almost everything, and the products of those reactions can be more harmful than what was emitted. The chain runs in a fixed causal order — emission, radical production, reaction, accumulation — and its timing is what makes it dangerous, because exposure downwind can peak hours after the release itself has begun to fall. Residents are asking when they can come home."
        assumes:
          - sunlight carries enough energy to break chemical bonds
        takeaway: Exposure can peak after the original emission begins to decline.
        format: SEQUENCE
        why: Sunlight can start atmospheric chemistry that does not occur at night. Photons break bonds or create reactive radicals, and those radicals rapidly attack other molecules in air. The products can differ in toxicity from what was emitted. A primary vapour can therefore fall while a secondary pollutant rises later and farther downwind. Building the pathway in order links the daytime pattern to a mechanism. It also tells the monitoring team which new compounds and chemical drivers should be measured.
        rebuttals:
          - A primary vapour is emitted first. Everything downstream is made out of it.
          - Sunlight or oxidants create reactive intermediates second. This is the step that needs the sun, and it is why the pattern follows the day.
          - Intermediates react through branching pathways third — branching, which is why one release can produce several products.
          - Secondary products form and are transported last. That delay is why exposure peaks after the emission has fallen.
        cards:
          - A primary vapor is emitted.
          - Sunlight or oxidants create reactive intermediates.
          - Intermediates react through branching pathways.
          - Secondary products form and are transported.
        order: [0, 1, 2, 3]
        guide: These four are a chain, and each step makes what the next one needs. Ask what has to be present before each card can happen. Radicals cannot attack anything before something creates them. Nothing can be transported before it exists. The primary vapour is falling while a different compound rises each afternoon. The order of this chain tells the monitoring team which compounds to add.
        background:
          - "Why the order is graded whole. A sequence is a claim about dependency: each step is here because the one before it has already happened, or has to have. One transposed pair falsifies that claim wherever it sits, so partial credit would be credit for a sequence that does not work."
          - Why the ends are the place to start. The first and last cards are constrained by having nothing before or after them, which usually makes them the two you can settle from the scene alone. Pinning them collapses the remaining arrangements sharply, and what is left in the middle is where the actual judgement lives.
          - What the rail can be ordered on. Time is the usual axis, but it is not the only one. An order can run on cost, on risk, or on reversibility — every observation that leaves the sample as it was, before any that consumes it. On those boards a chronological reading finds nothing, because none of the steps has to happen at a particular hour.
        concept: Reaction mechanisms and the rate-determining step
        answerText: A primary vapor is emitted. → Sunlight or oxidants create reactive intermediates. → Intermediates react through branching pathways. → Secondary products form and are transported.
      - group: GASES
        call: Read the day-night pattern
        task: The source is controlled and exposure went up. Which explanation fits the whole day at both monitors well enough to renew or lift the shelter advice?
        title: Read the day-night pattern
        place: Photochemistry Lab
        setup: Match each trend to a useful inference.
        scene: The source has been sealed, but the afternoon monitor is climbing again. Yvette Delacroix, on the neighbourhood health desk, must renew the shelter notice today or let it lapse. Two stations have run a full day; their traces do not look like a plume drifting away.
        story: "Two monitors have been running through a full day and the traces do not look like a plume drifting away. Photochemistry has a signature: production requires sunlight, so a compound formed in the atmosphere climbs while the sun is up, lags the solar maximum by the time the chemistry takes, and falls back overnight when the radicals that made it are no longer being produced. A compound merely being blown around has no reason to care what time it is. The health desk is deciding today whether to lift the shelter advice."
        assumes:
          - a compound blown around by wind has no reason to care what time it is
        takeaway: Atmospheric chemistry must be inferred from coordinated chemical and weather patterns.
        format: DIAGNOSIS
        why: Photochemistry has a signature. Production needs sunlight, so a compound formed in air rises during the day. The peak can lag the solar maximum because the chemistry takes time. Production then falls overnight as the reactive radicals disappear. Formation in the air also shifts the peak downwind because the parcel reacts while it travels. A compound that is merely transported lacks this coordinated day-night and downwind pattern. That makes the shape diagnostic rather than incidental.
        rebuttals:
          - A second release would raise the primary vapour at the fence. It fell all day, from 42 ppb to 11.

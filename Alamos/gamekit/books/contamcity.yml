              label: River, commander waiting
              tags:
                - commander
            - id: s2
              label: Tap water, school
              tags:
                - drinking
            - id: s3
              label: River, hold time today
              tags:
                - holdtime
            - id: s4
              label: Borehole, hold time today
              tags:
                - holdtime
                - drinking
            - id: s5
              label: Soil, commander waiting
              tags:
                - commander
            - id: s6
              label: Reservoir inlet
              tags:
                - drinking
            - id: s7

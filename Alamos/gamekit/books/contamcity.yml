# The campaign: one working day each, three stops and a callback from day 3.
missions:
  - title: The Unknown Containers
    objective: Create a provisional identity list and choose the next discriminating measurements.
    briefing: A freight-yard fire damages several unlabeled containers beside Riverton's river. The response team must establish chemical identity and hazard classes before firefighters, residents, and the water utility act on rumors. A wrong identity can cause an incompatible firefighting or treatment decision.
    stake: "Day one, and the freight yard fire has been out for six hours. A row of containers eighty metres from the river is damaged and nobody can tell you what was in them. Three names are going around: one from a driver, one from a half-burnt manifest, one from a label nobody can read. Adaeze Okonjo, who leads the analytical chemistry, wants two methods on the same sample before anybody writes a name down; the fire chief wants a name now. Today you turn that into a short list you would defend, and decide how to spend the one round of lab work you get. Sampling has an order too, because some steps destroy what the next one needed."
    takeaway: Create a provisional identity list and choose the next discriminating measurements.
    stops:
      - group: IDENT
        call: Read the formula, not the rumor
        task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
        title: Read the formula, not the rumor
        place: Accident Command Post
        setup: Match each formula-level observation to the correct chemical interpretation.
        scene: A freight-yard fire has damaged several unlabelled containers, eighty metres from the river. Three different guesses about what is in them are already on the radio. Firefighters are picking a suppression agent from whatever identity you give them.
        story: "A freight-yard fire has damaged several unlabelled containers eighty metres from the river, and the shift supervisor's radio traffic is already carrying three different guesses about what is in them. A chemical formula is not a name: it states which elements are present, in what whole-number ratio, and what charge the unit carries, and each of those constrains what the substance can do. A subscript or a charge changed makes a different compound with different reactivity, different solubility and a different hazard class. Firefighters are choosing a suppression agent from whatever identity you give them, and some of the wrong answers react with water."
        assumes:
          - a chemical formula lists which elements are present and in what ratio
        takeaway: Chemical identity begins with explicit composition and charge.
        format: PROTOCOL
        why: A formula is not a name. It states which elements are present, in what whole-number ratio, and what charge the unit carries — and each of those constrains what the substance can do. Change a subscript or a charge and you have a different compound with different reactivity, different solubility and a different hazard class. A common name carries none of that, which is why a label reading only a trade name cannot support a hazard prediction. Some of the wrong answers here react with water.
        rebuttals:
          - A metal paired with a charged group of atoms is the standard signature of an ionic compound — two opposite charges holding on to each other, rather than atoms sharing electrons.
          - Same elements in different ratios is a different compound, not a different name for one. The ratio is part of the identity.
          - More electrons than protons means surplus negative charge. Counting the two is the whole test.
          - A common name with no composition and no concentration constrains nothing. It is a label, and hazard prediction needs the formula behind it.
        columns:
          - What the record shows
          - What you can conclude
        scenarios:
          - The formula pairs a metal with a charged group of atoms.
          - Two substances share the same elements but different ratios.
          - A particle has more electrons than protons.
          - A label gives a common name with no composition or concentration.
        choices:
          - Likely an ionic compound.
          - They are distinct compounds, not interchangeable names.
          - It is negatively charged.
          - The record is insufficient for hazard prediction.
        mapping: [0, 1, 2, 3]
        answerText: 1. The formula pairs a metal with a charged group of atoms. → Likely an ionic compound. 2. Two substances share the same elements but different ratios. → They are distinct compounds, not interchangeable names. 3. A particle has more electrons than protons. → It is negatively charged. 4. A label gives a common name with no composition or concentration. → The record is insufficient for hazard prediction.
      - group: IDENT
        call: From damaged container to provisional identity
        task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
        title: From damaged container to provisional identity
        place: Molecular Identification Lab
        setup: Order the non-destructive evidence workflow.
        scene: The containers are now evidence as well as hazard. You are choosing the order in which to spend a sample nobody can go back for.
        story: "The containers are now evidence as well as hazard. Identification runs in a fixed order for reasons that are chemical rather than bureaucratic: some observations leave the sample exactly as they found it and can be repeated all week, and some consume the material to produce their answer. A destructive method gives the best identification and gives it once. What is on the outside of the drum survives only until somebody opens it. You are choosing the order in which to spend a sample nobody can go back for."
        assumes:
          - some measurements leave the sample as they found it and some use it up
        takeaway: Analytical work runs from what costs nothing to what cannot be undone.
        format: SEQUENCE
        why: The order is set by what each step costs. The markings on the outside of the drum survive only until somebody opens it, so they are recorded first and consume nothing. Headspace vapour samples what has already escaped, without breaching the bulk liquid. A non-destructive spectrum on a small aliquot can be repeated all week if it goes wrong. The destructive method gives the best identification and gives it once, so it is the last thing you spend and the first thing you would regret.
        rebuttals:
          - Photograph the markings first. It costs nothing and it is the only evidence that stops existing the moment the drum is opened.
          - "Headspace vapour second: it samples what has already left the liquid, without breaching the container."
          - A non-destructive spectrum third. It uses an aliquot and gives it back, so a mistake here costs nothing.
          - The destructive method last. It answers best and it answers once, which makes it the thing you spend when you know what to ask.
        cards:
          - Photograph and record the markings on the outside of the drum, which consumes nothing.
          - Sample the headspace vapour onto a sorbent tube, without breaching the bulk liquid.
          - Draw a small aliquot and run a non-destructive spectrum on it.
          - Commit part of that aliquot to a method that destroys it to identify it.
        order: [0, 1, 2, 3]
        answerText: 1. Photograph and record the markings on the outside of the drum, which consumes nothing. 2. Sample the headspace vapour onto a sorbent tube, without breaching the bulk liquid. 3. Draw a small aliquot and run a non-destructive spectrum on it. 4. Commit part of that aliquot to a method that destroys it to identify it.
      - group: IDENT
        call: Spend the first of the lab budget
        task: What does the response run first?
        title: Spend the first of the lab budget
        place: Records and Shipping Office
        setup: What does the response run first?
        scene: Eight hundred pounds of laboratory budget, four ways to spend it, and three drums whose labels are gone. Firefighters are holding at the fence line waiting on whatever comes back, and the first sample went in ninety minutes ago.
        story: "You have a limited laboratory budget and four ways to spend it, and the first hours of a release are when uncertainty is most expensive. Analytical methods are not interchangeable: each one answers a different question, carries its own way of being fooled, and costs sample, time and exposure. Some of what looks like a fast answer is really a low-quality one taken at personal risk — smelling a container tells you almost nothing chemically and puts a responder in the vapour. One of them goes first, and the firefighters are waiting on whatever it returns."
        assumes:
          - a method that can be fooled will not tell you it has been
        takeaway: Early chemistry should reduce uncertainty without creating new exposure.
        format: CHOICE
        why: Analytical methods are not interchangeable. Each answers a different question, carries its own way of being fooled, and costs sample, time and exposure. An identity is worth what the chance it had to be wrong is worth — so two tests that could not be fooled by the same thing, run on the same sample, are the least evidence a name can rest on. Anything that can fool one of them has to also fool the other, and that is a much harder coincidence than fooling either alone.
        rebuttals:
          - Shipping records are fast and say what was supposed to be in the container. After a fire in a freight yard, that is a hypothesis rather than an observation.
          - Blanks and reference samples are required and answer whether the laboratory contributed the signal. That question only arises once there is a signal.
          - Odour puts a responder in the vapour and returns nothing chemical — no composition, no concentration, and no record anybody can check.
        choices:
          - Two different kinds of lab test, run on the same sample.
          - A search for the shipping records and supplier lot information.
          - Reference samples and blanks, prepared alongside the sample.
          - A trained responder identifying the containers by odour.
        answer: Two different kinds of lab test, run on the same sample.
  - title: The Vapor Cloud
    objective: Provide a bounded plume assessment and decision triggers for evacuation zones.
    briefing: A colorless plume moves toward two neighborhoods as the weather changes. The team must estimate expansion, density, and direction without treating an ideal-gas model as a complete atmospheric forecast. A delayed evacuation risks exposure; an overbroad evacuation can block emergency access and overwhelm shelters.
    stake: Day two, first light, and the wind has backed forty degrees. A colourless plume is drifting off the yard toward two neighbourhoods, and the forecast from the atmospheric chemistry lead, Miklos Varga, disagrees with the incident commander's map about where it goes by eleven. Sipho Mbeki, who briefs the public, has to tell residents something by eight. Today you work out how much air that release can fill, what the warming morning will do to it, and which measurement to buy next. Both mistakes cost people. Evacuate too small an area and somebody is standing downwind of it. Evacuate the whole district and you block the roads the fire crews need.
    takeaway: Provide a bounded plume assessment and decision triggers for evacuation zones.
    stops:
      - group: GASES
        call: How much volume can the gas occupy?
        task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation. Estimate the gas volume at ambient conditions.
        title: How much volume can the gas occupy?
        place: Mobile Weather Station
        setup: Use an idealized release only to establish scale.
        question: Estimate the gas volume at ambient conditions.
        scene: A colourless plume is drifting toward two neighbourhoods and the incident commander wants a number before the wind shifts.
        story: "A colourless plume is drifting toward two neighbourhoods and the incident commander wants a number before the wind shifts. The ideal gas law relates the amount of substance to the volume it occupies at a given temperature and pressure — at ordinary conditions about twenty-four litres per mole — which turns a mass in a tank into a scale you can reason about. It is a first-order tool and nothing more: it says how big the release is, not where it goes. Evacuating too little exposes people; evacuating too much blocks the roads the response needs."
        assumes:
          - a given amount of gas occupies a predictable volume at ordinary conditions
        takeaway: Simple gas laws provide scale while atmospheric transport determines exposure.
        format: BALLPARK
        why: "The ideal gas law turns a mass in a tank into a volume you can reason about — about twenty-four litres per mole at ordinary temperature and pressure. It is a first-order tool and nothing more: it says how big the release is, not where it goes. The hazardous footprint depends on mixing, wind, terrain and chemistry, none of which appear in the calculation. The number still has to be right, because evacuating too little exposes people and evacuating too much blocks the roads the response needs."
        estimate:
          prompt: A colorless plume is leaving the yard. Command wants the equilibrium gas volume before anyone draws an evacuation corridor.
          question: Estimate the gas volume at ambient conditions.
          labels:
            - 2.0×10⁴ mol  (n, amount released)
            - 8.31 J mol⁻¹ K⁻¹  (R)
            - 300 K  (T, ambient)
            - 1.0×10⁵ Pa  (P, ambient)
            - 22.4 L mol⁻¹  (molar volume at STP)
            - 273 K  (0 °C)
          values: [20000, 8.31, 300, 100000, 22.4, 273]
          slots: 4
          template: "{0} × {1} × {2} ÷ {3}"
          formula: a*b*c/d
          correct: [0, 1, 2, 3]
          target: 498.6
          tolerance: 60
          units: m³
          solution: V = nRT/P ≈ (2.0×10⁴ × 8.31 × 300) / 1.0×10⁵ ≈ 500 m³.
          explanation: "The ideal gas law fixes the volume the release would occupy at equilibrium. That is a scale, not a hazard footprint: mixing, wind, terrain and chemistry decide where the material actually goes and at what concentration."
          givens:
            - n = 2.0×10^4 mol
            - T = 300 K
            - P = 1.0×10^5 Pa
            - R = 8.31 J mol^-1 K^-1
          relationship: V = nRT/P.
        answerText: V ≈ 2.0×10^4×8.31×300/10^5 ≈ 500 m³.
      - group: GASES
        call: Interpret plume behavior
        task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
        title: Interpret plume behavior
        place: Gas Properties Lab
        setup: Match each change to its first-order consequence.
        scene: The weather is changing while the plume is still moving, and the neighbourhood downwind is where the arithmetic lands.
        story: "The weather is changing while the plume is still moving. Two different physics are operating at once here: gas-law behaviour, which says how a fixed amount of substance responds to changes in temperature and pressure, and atmospheric transport, which says where the resulting parcel actually goes. Density relative to air decides whether the cloud hugs the ground or lifts; wind and turbulence decide how fast it dilutes; terrain decides where it pools. Each change on the board pushes on one of those and not necessarily the others, and the neighbourhood downwind is where the arithmetic lands."
        assumes:
          - a gas has a state and also a place, and they change for different reasons
        takeaway: A plume is a coupled thermodynamic and transport problem.
        format: PROTOCOL
        why: "Two different physics are running at once. Gas-law behaviour says how a fixed amount of substance responds to temperature and pressure — Charles and Boyle are two statements about the same gas, one proportional and one inverse. Atmospheric transport says where the resulting parcel actually goes: density relative to air decides whether the cloud hugs the ground or lifts, wind and turbulence decide how fast it dilutes, terrain decides where it pools. Each change on the board pushes on one of those and not necessarily the others."
        rebuttals:
          - A temperature rise at roughly constant pressure is proportional — twice the absolute temperature, twice the volume.
          - A pressure drop at constant amount and temperature is inverse — half the pressure, twice the volume.
          - Greater molar mass than air is about density, which the gas law does not address. It decides whether the cloud sinks or lifts, and turbulence can override it.
          - A wind shift is transport rather than state. Nothing about the gas changed; where it is going did.
        columns:
          - What changes in the field
          - What happens to the plume
        scenarios:
          - Temperature rises at roughly constant pressure.
          - External pressure falls for the same gas amount and temperature.
          - A gas has greater molar mass than surrounding air.
          - Wind direction shifts while the source continues.
        choices:
          - Volume rises in proportion to the absolute temperature.
          - Volume rises in inverse proportion to the pressure.
          - It may initially favour lower-level accumulation, though turbulence matters.
          - The downwind risk corridor must be updated.
        mapping: [0, 1, 2, 3]
        answerText: 1. Temperature rises at roughly constant pressure. → Volume rises in proportion to the absolute temperature. 2. External pressure falls for the same gas amount and temperature. → Volume rises in inverse proportion to the pressure. 3. A gas has greater molar mass than surrounding air. → It may initially favour lower-level accumulation, though turbulence matters. 4. Wind direction shifts while the source continues. → The downwind risk corridor must be updated.
      - group: GASES
        call: Choose the next plume evidence
        task: Same drum, same liquid, three times the vapour. Why?
        title: Why the drum is worse in the afternoon
        place: Atmospheric Monitoring Post
        scene: The same open drum reads three times the vapour concentration at two in the afternoon as it did at six in the morning. Nothing has been added to it and nothing has been taken out.
        assumes:
          - a liquid and its vapour sit in equilibrium at a temperature
        takeaway: Vapour pressure rises steeply with temperature, so the same liquid is a different hazard at a different hour.
        format: CHOICE
        why: Vapour pressure is the pressure of gas in equilibrium with its own liquid, and it climbs steeply with temperature — often doubling for every ten or fifteen degrees. Warming the drum from morning to afternoon moves more molecules into the gas phase above the same liquid, so the air above it is more concentrated with no change in what is in the drum. This is why exposure limits are checked at the hottest part of the day, and why a hazard assessment made at dawn understates the afternoon.
        rebuttals:
          - A new compound would show a different peak, and the analysis shows the same one.
          - Both readings came from the same instrument, and a threefold change is far outside its drift.
          - Evaporation removes the volatile fraction, which would lower the vapour above the liquid, not raise it.
        choices:
          - Its vapour pressure rose with temperature, so more of it is in the gas phase.
          - The liquid reacted during the day and made a new, more volatile compound.
          - The morning reading was wrong, because instruments drift when cold.
          - More liquid evaporated overnight, leaving a more concentrated residue.
        answer: Its vapour pressure rose with temperature, so more of it is in the gas phase.
  - title: What Dissolved in the River?
    objective: Predict where each chemical class will be found and design a mass-balance sampling plan.
    briefing: Runoff from the accident enters the river. Some compounds remain in surface films, some dissolve, and others bind to sediment. The player must predict partitioning from molecular interactions and verify it with sampling. If the team samples only water, a persistent sediment reservoir may be missed until it re-enters the water supply.
    stake: "Day three. Runoff reached the river overnight and Riverton's drinking-water intake is nine hundred metres downstream. Inês Ferreira, who owns water and sediment, has been out since four and wants it sampled; the state's auditor wants a water survey, because that is what a water survey means. Today you design it: where to sample, in what order, and which parts of the river to sample at all. That last one decides everything else. Test only the water and the result comes back clean, and it is honestly clean — today. The next flood stirs the mud."
    takeaway: Predict where each chemical class will be found and design a mass-balance sampling plan.
    stops:
      - group: WATER
        call: Where will the chemical go?
        task: Match each situation to the most scientifically justified interpretation, control, or response. Each choice is used once.
        title: Where will the chemical go?
        place: River Sampling Boat
        setup: Match each molecular feature to the most likely environmental behavior.
        scene: Runoff from the accident has reached the river. If you predict the wrong phase you will sample the wrong thing, and a clean water result will be read by the city as an all-clear.
        story: "Runoff from the accident has reached the river. A chemical released into water does not stay in one place or one phase: polar molecules dissolve readily, non-polar ones partition onto organic carbon in sediment and stay there, volatile ones leave for the atmosphere, and surface-active ones concentrate in the film on top. All of that follows from molecular structure — polarity, hydrogen bonding, and how the compound interacts with water compared with everything else on offer. If you predict the wrong phase you will sample the wrong thing, and a clean water result will be read by the city as an all-clear."
        assumes:
          - like dissolves like — polar mixes with polar, and non-polar does not
        takeaway: The absence of a chemical from water does not mean it has disappeared.
        format: PROTOCOL
        why: A chemical released into water does not stay in one place or one phase, and where it goes follows from molecular structure. Polar molecules that can hydrogen-bond dissolve readily. Ionic species dissolve as hydrated ions, surrounded by water molecules. Non-polar liquids, which barely mix with water, separate out or spread as a surface film. Compounds that avoid water partition onto organic carbon in suspended particles and sediment and stay there. Absence from the water column is not absence from the river.
        rebuttals:
          - A small ionic species dissolves as hydrated ions — water molecules surround each ion and hold it in solution.
          - A non-polar organic liquid barely mixes with water at all. It forms its own phase, often as a film on top.
          - A polar neutral molecule that hydrogen-bonds behaves like water does, so it dissolves appreciably.
          - A water-avoiding compound that sticks to organic carbon leaves the water for the particles, and the particles settle.
        columns:
          - What kind of chemical it is
          - Where it ends up
        scenarios:
          - Small ionic species in water.
          - Nonpolar organic liquid that barely mixes with water.
          - Polar neutral molecule capable of hydrogen bonding.
          - Water-avoiding compound that sticks strongly to organic-rich sediment.
        choices:
          - Often dissolves as hydrated ions.
          - May form a separate phase or surface film.
          - Often has appreciable water solubility.
          - May concentrate in suspended particles or sediment.
        mapping: [0, 1, 2, 3]
        answerText: 1. Small ionic species in water. → Often dissolves as hydrated ions. 2. Nonpolar organic liquid that barely mixes with water. → May form a separate phase or surface film. 3. Polar neutral molecule capable of hydrogen bonding. → Often has appreciable water solubility. 4. Water-avoiding compound that sticks strongly to organic-rich sediment. → May concentrate in suspended particles or sediment.
      - group: WATER
        call: Build a river mass-balance survey
        task: Will extra carbonate lower the dissolved metal, and why?
        title: Why adding the same ion helps
        place: Water and Sediment Laboratory
        scene: The metal is precipitated as a carbonate, and the filtered water still reads 3.1 mg/L against a permit limit of 0.5. The carbonate dose is at the stoichiometric amount, the pH is 8.2, and somebody suggests simply adding more carbonate.
        assumes:
          - a saturated solution sits in equilibrium with the solid
        takeaway: A precipitation equilibrium can be pushed by adding an ion it already contains.
        format: CHOICE
        why: "At equilibrium the product of the ion concentrations equals the solubility product, a constant for that salt at that temperature. Raise one ion and the other must fall to keep the product fixed — the common-ion effect — so excess carbonate drives dissolved metal onto the solid. It is quantitative: ten times the carbonate leaves roughly a tenth of the metal in solution for a one-to-one salt, which is how a plant designs to a permit limit rather than hoping to meet it."
        rebuttals:
          - Solubility depends on what else is in the water; only Ksp itself is fixed.
          - Adsorption is a surface process and is not what the equilibrium calculation describes.
          - A shared ion suppresses dissolution. Adding a DIFFERENT, complexing ion is what can increase it.
        choices:
          - Yes. The ion product must stay at Ksp, so raising carbonate forces the metal down.
          - No. Solubility is a fixed property of the salt and cannot be changed.
          - Yes, but only because the extra carbonate physically adsorbs the metal.
          - No. Adding a shared ion dissolves more of the solid, not less.
        answer: Yes. The ion product must stay at Ksp, so raising carbonate forces the metal down.
      - group: WATER
        call: Spend the river survey budget
        task: The utility wants an answer this week. What does the survey sample?
        title: Spend the river survey budget
        place: Sediment Analysis Room
        setup: The utility wants an answer this week. What does the survey sample?
        scene: The survey has twenty samples in the budget. The compound is sparingly soluble, the river is nine hundred metres upstream of the intake, and the two grab samples taken so far disagree by a factor of six.
        story: "The survey has twenty samples in the budget. The compound is sparingly soluble, the river is nine hundred metres upstream of the intake, and the two grab samples taken so far disagree by a factor of six. Sampling design is where environmental chemistry is usually won or lost: coverage in space, coverage in time, and coverage across phases each buy a different kind of certainty, and a striking photograph of an oily bank buys none of them. The point of a survey is to test the model you built — to give the partitioning prediction a real chance to be wrong — rather than to collect confirmation from the most visually convincing spot on the river."
        assumes:
          - a survey that can only confirm you was not a test
        takeaway: Sampling design should test the partitioning model rather than confirm appearances.
        format: CHOICE
        why: Sampling design is where environmental chemistry is usually won or lost. Coverage in space, coverage in time and coverage across phases each buy a different kind of certainty, and a striking photograph of an oily bank buys none of them. The partitioning model predicts the water-avoiding part of it is not in the water at all, so a survey that samples only water comes back clean — and the city reads a clean water result as an all-clear. The point is to give the prediction a real chance to be wrong.
        rebuttals:
          - High-frequency sampling at the intake is where the decision gets made, and it measures one phase of a system with four.
          - Upstream comparison sites are what make any concentration mean something, and they are the next call rather than this one.
          - A sample from the visibly stained bank tests the appearance rather than the model, and it will be the photograph that gets published.
        choices:
          - Sediment and suspended solids, alongside the water.
          - Water at high frequency, close to the drinking-water intake.
          - Upstream and tributary comparison sites.
          - The bank where the discoloration is visible.
        answer: Sediment and suspended solids, alongside the water.

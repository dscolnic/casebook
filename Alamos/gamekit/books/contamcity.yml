        call: How fast can material disappear?
        task: Estimate the uniform corrosion rate in millimetres per year and the corresponding time to lose 6 mm of wall.
        title: How fast can material disappear?
        place: Electrochemistry Lab
        setup: Use a simplified mass-loss estimate.
        question: What uniform wall-loss rate does 2.0 kg/year imply?
        scene: Novák hands over a pipe coupon from the intake gallery — 2.0 kilograms of steel lost per year across 4.0 square metres of exposed surface. The steel density is 7,900 kilograms per cubic metre, and the remaining wall is 6 millimetres thick.
        story: An average corrosion rate is a mass loss spread evenly over an area, and metal almost never obliges. A uniform rate of a fraction of a millimetre a year sounds survivable; the same total loss concentrated at a defect in a coating perforates the wall in a season, because the entire anodic current is being delivered into a small patch. Work out the average anyway — it bounds the problem and it is what maintenance budgets are written against — but the number to hand over is the one that says where the metal is going, not just how much.
        takesAsRead:
          - Atomic structure, ions and electron configuration
        assumes:
          - a rate becomes a decision only when it is compared against a thickness
        takeaway: A corrosion rate becomes a decision only once it is a depth compared against a wall.
        format: BALLPARK
        why: Work out the average wall loss because it sets the scale of the problem. 2 kilograms per year over 4 square metres of steel is about 0.063 mm of depth per year. At that uniform rate, losing a 6 mm wall would take roughly 95 years. That result says uniform corrosion is not the immediate threat. Localised attack is worse because the same total metal loss can be concentrated into a small coating defect and perforate the wall far sooner.
        estimate:
          prompt: The gallery loses about 2.0 kg of steel a year over 4.0 m² of pipe wall. Steel runs about 7,900 kg per cubic metre, and the wall is 6 mm thick.
          question: Estimate the uniform corrosion rate, in millimetres per year.
          labels:
            - 2.0 kg/year  (mass lost)
            - 4.0 m²  (area affected)
            - 7,900 kg/m³  (steel density)
            - 1,000 mm/m
            - 6 mm  (remaining wall)
            - 1,000 kg/m³  (water density; distractor)
          values: [2, 4, 7900, 1000, 6, 1000]
          slots: 4
          template: "{0} ÷ ( {1} × {2} ) × {3}"
          formula: a / (b * c) * d
          correct: [0, 1, 2, 3]
          target: 0.0633
          tolerance: 0.008
          units: mm per year
          solution: depth/year = 2.0 /(7,900 × 4.0) m ≈ 6.3×10⁻⁵ m/year = 0.063 mm/year. 6 millimetres at that rate is about 95 years.
          explanation: "A mass loss per unit area is not a depth until it is divided by a density; the two densities offered differ by a factor of eight, and only one of them is the metal. The answer matters because it is survivable: at this rate the wall lasts a working lifetime. The same total loss concentrated at a coating defect perforates it in a season, which is why the average is a bound and not a forecast."
          givens:
            - corrosion mass loss = 2.0 kg/year
            - affected area = 4.0 m²
          relationship: depth loss rate = mass loss / (density × exposed area). Convert metres per year to millimetres per year.
        guide: Six numbers, and one of them is the density of water rather than of steel. Another is the wall that is left, which belongs to the comparison and not to the rate. Ask of each whether the relationship needs it or the decision does. Notice what a uniform rate cannot see. The same metal loss concentrated into one coating defect perforates far sooner than the average suggests.
        background:
          - What the relationship says. depth loss rate = mass loss / (density × exposed area). Convert metres per year to millimetres per year.
          - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs, and whether the size of the answer looks right once they are in place.
          - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label is how a unit mismatch, or a quantity belonging to a different part of the problem, is caught before it is placed — which is the habit this format exists to build.
        concept: Redox and electrochemistry
        answerText: About 0.063 mm/year, corresponding to roughly 95 years to lose 6 mm if the attack were truly uniform.
      - group: TREAT
        call: Protect the pipeline
        task: The gallery stays cleared until the first control is chosen. Which intervention breaks the corrosion problem most directly?
        title: Protect the pipeline
        place: Maintenance Control
        setup: The corrosion cell is running. Which control goes in first?
        scene: The thinnest section of intake pipe has only 3 millimetres of wall left. Corrosion has accelerated eightfold, and Novák has cleared the gallery until the first control is chosen. Water is still moving through the line.
        story: Protecting a pipeline means attacking the circuit at whichever point is cheapest to break. Water chemistry changes how aggressive the electrolyte is; coatings interrupt the ion path but concentrate the attack wherever they fail; electrical isolation removes the galvanic couple between different metals; cathodic protection supplies electrons so that the pipe stops being the anode; inspection tells you which of them is working before a leak does. They are complementary, not alternatives, and the city cannot afford to lose the intake in the middle of the emergency.
        takesAsRead:
          - Atomic structure, ions and electron configuration
        assumes:
          - a circuit stops when any one part of it is broken
        takeaway: Corrosion protection is a designed system of materials, environment, and inspection.
        format: CHOICE
        why: A corrosion cell needs an anode, a cathode, an electrolyte and an electrical path. The acidic, chloride-rich water makes ion transport easy. The connected dissimilar metals provide an electron path and drive galvanic attack. Electrical isolation breaks that path directly. A coating can help, but one small defect can concentrate attack. Chemistry control also matters, yet it does not remove the metal-to-metal connection. The first intervention should break the circuit while inspection and water chemistry controls follow.
        rebuttals:
          - Water chemistry works and is constrained by everything else the treatment train has to achieve, including the neutralisation that started this.
          - Coatings interrupt the ion path and concentrate the entire anodic current wherever they fail, which is why they cannot be installed without an inspection programme.
          - A better-presented leak report changes nothing in the circuit, and the intake is what is at risk.
        choices:
          - Electrically isolate the different metals where the coupling is.
          - Adjust the water chemistry to make the electrolyte less aggressive.
          - Recoat the pipe and inspect the coating for defects.
          - Reissue the leak report with the inspection photographs attached.
        answer: Electrically isolate the different metals where the coupling is.
        guide: Three of the four options act on a real part of the corrosion circuit. One only moves paper. Ask of each which of the four parts it removes, and whether one small defect can defeat it. The water is still moving and three millimetres of wall are left. So the first control has to break the circuit, not merely slow it down.
        background:
          - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
          - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken out of them deliberately.
          - "What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested."
        concept: Redox and electrochemistry
  - title: Will the Reaction Run Away?
    objective: Identify the controlling rate factors and define a safe operating envelope with automatic shutdown triggers.
    briefing: A treatment chemical reacts slowly at room temperature but rapidly as the vessel warms. The team must connect rate laws and activation energy to thermal feedback. A treatment intended to remove contamination could become the largest hazard on the site.
    stake: A month in. The treatment chemical sat quietly in a drum all week; in Brandt's warm pilot vessel it is lively. His own trace shows an hour of very little and then a step. Osei plans to run it at full scale on Monday — the pilot vessel holds 40 litres and the plant tank holds 9000. Today you decide what temperature range this process may run in, and what shuts it down without asking anybody. Treatment also gathers a spill spread thin across a yard into a single tank, and if that tank runs away, the whole of it leaves at once, hot.
    takeaway: Identify the controlling rate factors and define a safe operating envelope with automatic shutdown triggers.
    stops:
      - group: ENERGY
        call: What changes the rate?
        task: Match each change to its direct kinetic effect. For the concentration case, use rate = k[A]².
        title: What changes the rate?
        place: Kinetics Lab
        setup: Match each intervention to its direct kinetic effect.
        question: Which change affects collision frequency, barrier crossing, or activation energy?
        scene: The same treatment mixture is quiet in a cool drum and vigorous in the warmed pilot vessel. Moreau lays out concentration logs, temperature records and a catalyst trial on the bench, all taken from the same batch before scale-up begins.
        story: "The treatment chemical is quiet in the drum and vigorous in the warm vessel. Thermodynamics says whether a reaction can go and how much energy it releases; kinetics says how fast, and the two are independent — a strongly favourable reaction can sit unchanged for years behind a large activation barrier. Temperature, concentration and catalysis each act on the rate through a different mechanism: one supplies more molecules with enough energy to cross the barrier, one changes how often they meet, and one lowers the barrier itself. The pilot vessel is where the difference stops being academic."
        assumes:
          - kinetics means how fast a reaction proceeds and what controls that rate
          - a reaction needs molecules to meet with enough energy to react
        takeaway: A reaction can be favorable yet slow, or fast only after a barrier is lowered.
        format: PROTOCOL
        why: "Rate laws separate concentration effects from the rate constant. If rate = k[A]², doubling [A] multiplies the rate by four because the concentration term is squared. Temperature works differently: it changes the fraction of molecular encounters able to cross the activation barrier, which changes k. A catalyst also changes the pathway and lowers that barrier. Changing product energy changes thermodynamic driving force, but it does not by itself specify the kinetic barrier or the reaction rate."
        rebuttals:
          - For a second-order dependence, doubling [A] multiplies [A]² by four. The rate constant k has not changed.
          - Raising temperature widens the spread of molecular energies, so a larger fraction of collisions can cross the barrier.
          - A catalyst offers a different route with a lower activation energy. It is not consumed and it does not change how favourable the reaction is.
          - Changing product energy changes the thermodynamic driving force. The barrier between reactants and products can stay exactly where it was.
        columns:
          - What you change
          - What it does to the rate
        scenarios:
          - Double [A] while k stays constant and rate = k[A]².
          - Raise temperature.
          - Add a catalyst.
          - Change product energy while leaving the pathway unchanged.
        choices:
          - The rate becomes four times larger.
          - Increases the fraction of collisions able to cross the barrier.
          - Provides a lower-activation-energy pathway.
          - Changes thermodynamic driving force, not necessarily the activation barrier.
        mapping: [0, 1, 2, 3]
        guide: The four changes on the left act at three different places. One is the concentration term. One is the fraction of collisions that clear the barrier. One is the height of the barrier itself. Ask which of the three each change touches before pairing it. One of them changes the thermodynamics and leaves the barrier alone. That is the difference between quiet in a drum and vigorous in a warm vessel.
        background:
          - Why this is a matching board and not four separate questions. Responses on boards like this are written to be plausible for more than one situation, so choosing them one at a time lets a nearly-right answer through unexamined. Having to place all of them forces the comparison — not "is this reasonable here", but "is it more right here than there".
          - How to use the one-each rule. Because the responses are a set to be distributed rather than a list to be sampled, every join you make constrains the rest. Settling the two you are confident of can leave the remaining pair decided by elimination. Where it does not, two responses are still competing for one situation, and that is exactly the distinction the stop is testing.
          - "Why you cannot be wrong about exactly one. With every response used once, three correct joins leave the fourth with only one place to go. Any error therefore involves at least two joins. That is worth remembering when the last pair looks forced: the fault is usually not in the join you are struggling with, but in one you made early and stopped questioning."
        concept: Catalysis
        answerText: 1. Double [A] when rate = k[A]². → The rate becomes four times larger. 2. Raise temperature. → A larger fraction of collisions can cross the activation barrier. 3. Add a catalyst. → A lower-activation-energy pathway is available. 4. Change product energy without changing the pathway. → Thermodynamic driving force changes, but the kinetic barrier need not.
      - group: ENERGY
        call: Build a runaway feedback loop
        task: Arrange the four cards from the earliest prerequisite or cause to the latest result. The interface should lock correctly placed cards after each check.
        title: Build a runaway feedback loop
        place: Pilot Treatment Vessel
        setup: Order the causal chain.
        scene: The pilot vessel showed a sharp temperature rise during one treatment run. Brandt has posted four events from the log on the control-room board, printed out of order, and wants the causal sequence reconstructed before engineering meets.
        story: A runaway is not an explosion that comes out of nowhere; it is a feedback loop with an obvious first step. An exothermic reaction releases heat, that heat raises the temperature of the mixture, a higher temperature increases the reaction rate, and a faster reaction releases heat sooner — while the cooling system removes heat at a rate set by fixed geometry and a temperature difference it cannot control. Put the chain in order and it stops being alarming and starts being designable. Get the order wrong and you will engineer against the wrong link.
        assumes:
          - a reaction goes faster when it is hotter
        takeaway: Runaway risk emerges from coupling reaction rate to imperfect heat removal.
        format: SEQUENCE
        why: It is a feedback loop with an obvious first step. An exothermic reaction releases heat. That heat raises the temperature when removal cannot keep pace. The cooling system removes heat at a rate set by its geometry and the available temperature difference. A higher temperature raises the rate constant. A faster reaction releases the same heat sooner, and the loop closes. Put the chain in order and it stops being alarming and starts being designable.
        rebuttals:
          - Heat release is the first link. Without an exothermic reaction there is no loop at all.
          - Temperature rises second, and only because removal lags. Cooling that kept pace would break the loop here.
          - The rate constant rises third. This is the step that makes the feedback positive rather than merely warm.
          - Faster release last, which feeds back into the first link. The loop closing is what makes it a runaway.
        cards:
          - Reaction releases heat.
          - Temperature rises because heat removal lags.
          - The rate constant increases.
          - Faster reaction releases heat still more rapidly.
        order: [0, 1, 2, 3]
        guide: These four are one loop, so every card has something before it and something after it. Ask of each what has to be true already for it to happen. Heat has to exist before it can raise a temperature, and a temperature has to rise before a rate constant does. Put the chain in order and a run that looked alarming becomes something a cooling system can be sized against.
        background:
          - "Why the order is graded whole. A sequence is a claim about dependency: each step is here because the one before it has already happened, or has to have. One transposed pair falsifies that claim wherever it sits, so partial credit would be credit for a sequence that does not work."
          - Why the ends are the place to start. The first and last cards are constrained by having nothing before or after them, which usually makes them the two you can settle from the scene alone. Pinning them collapses the remaining arrangements sharply, and what is left in the middle is where the actual judgement lives.
          - What the rail can be ordered on. Time is the usual axis, but it is not the only one. An order can run on cost, on risk, or on reversibility — every observation that leaves the sample as it was, before any that consumes it. On those boards a chronological reading finds nothing, because none of the steps has to happen at a particular hour.
        concept: Reaction kinetics, rate laws and activation energy
        answerText: Reaction releases heat. → Temperature rises because heat removal lags. → The rate constant increases. → Faster reaction releases heat still more rapidly.
      - group: ENERGY
        call: Define the safe operating envelope
        task: Stress-test the three scale-up plans against the pessimistic end of the measured temperature sensitivity, then choose the plan that still has thermal margin.
        title: Define the safe operating envelope
        place: Process Control Room
        setup: What has to be true before the treatment vessel runs at scale?
        question: Which operating plan remains feasible when the reaction accelerates faster than the nominal assumption?
        scene: Osei has the first full-scale treatment batch scheduled before dawn. Bench work stopped at 55 °C, his proposed vessel runs at 60 °C, and the cooling jacket tops out at 40 kilowatts. Heat release above 65 °C has never been measured.
        story: A safe operating envelope is a set of conditions under which the heat a process generates cannot outrun the heat it can lose. Establishing one takes measured rate data rather than assumed kinetics, honest heat-removal capacity at the worst case rather than the design case, and protection that works when the control system is the thing that has failed. Speed and yield are not safety, and a process that runs beautifully at the intended temperature can be the largest hazard on site 15 degrees above it. What the vessel needs before it runs at scale is the bound, not the throughput.
        assumes:
          - heat generation tracks reaction rate over these compared operating points
          - a plan is infeasible when heat generation exceeds available cooling
        takeaway: A safe operating choice is one that still satisfies the thermal constraint when a key kinetic assumption is wrong in the dangerous direction.
        format: STRESS
        why: Scale-up cannot be based only on the nominal rate. Heat generation rises steeply with temperature, while heat removal is capped by the jacket and its temperature difference. A plan that barely fits the nominal kinetics can cross the cooling limit if the true temperature sensitivity is stronger. Stressing the uncertain doubling interval exposes that fragility before operation. The conservative plan gives up throughput. It is the only candidate that still has positive cooling margin at the pessimistic end of the stated range.
        stress:
          candidates:
            - id: A
              label: Plan A — 65 °C full-rate
            - id: B
              label: Plan B — 60 °C reduced-rate
            - id: C
              label: Plan C — 55 °C conservative start
          criteria:
            - key: heat
              label: Heat generation at the nominal
              unit: kW
            - key: cooling
              label: Cooling available
              unit: kW
            - key: time
              label: Time to clear the tank
              unit: × the fastest
          scores:
            A:
              heat: 36
              cooling: 40
              time: 1
            B:
              heat: 25.5
              cooling: 26.5
              time: 1.33
            C:
              heat: 18
              cooling: 20
              time: 1.82
          feasible:
            A: 10
            B: 10
            C: 8
          assumption:
            label: Temperature rise that doubles reaction rate
            unit: °C
            min: 8
            max: 12
            nominal: 10
            step: 1
          robust: C
          optimiseOn: time
          hint: Move the uncertain doubling interval to its pessimistic end before committing. A plan survives only if heat generation stays below available cooling.
          commit: Commit the choice
        guide: Move the uncertain doubling interval to its pessimistic end before you commit to anything. A plan that survives only at the nominal value is not a plan. The jacket removes 40 kilowatts and no more, bench work stopped at 55 °C, and nothing above 65 °C has ever been measured. Choose the operating plan that still holds at the bad end of the range.
        background:
          - What the doubling interval means. Reaction rate rises with temperature, and the interval is how many degrees it takes to double. A small interval means the heat release accelerates sharply, so a vessel that is comfortable at 60 °C can be uncontrollable at 68 °C.
          - Why the jacket is the hard limit. Cooling capacity is fixed at 40 kilowatts. Once the reaction produces heat faster than that, the temperature rises, which makes it produce heat faster still. That is a runaway, and no amount of operator attention reverses it once it starts.
          - Why the untested region is the whole problem. Above 65 °C there is no measurement at all, so the model there is extrapolation. Committing a full-scale batch to a region nobody has measured is the decision this stop is asking you not to make quietly.
        answerText: Choose Plan C at 55 °C for the initial scale-up. Plans A and B fit the nominal assumption but exceed their cooling limits when the rate doubles every 8 °C.
  - title: Remove It Without Making It Worse
    objective: Choose a treatment train using contaminant removal, byproduct formation, waste fate, and operational reliability.
    briefing: Three treatment methods can lower the target contaminant, but one creates a toxic byproduct and another shifts the contaminant into sludge. The player must compare complete chemical consequences. A rapid treatment can create a less visible but more persistent hazard.
    stake: "Day 38. Osei's pilot treatment works — 98% of the compound you identified is gone by the outlet — and he wants to scale it this week. Nakamura points out that the panel it was tested against was written for that compound and nothing else. Today you work out what the treatment actually did: what it removed, what it made, and where the rest went. A test panel written for the original reports success either way, because it is not looking for what you made. The hazard that lasts longest here may be one there is still no test for."
    takeaway: Choose a treatment train using contaminant removal, byproduct formation, waste fate, and operational reliability.
    stops:
      - group: TREAT
        call: What did the treatment actually do?
        task: Close the 100 kg contaminant ledger across the pilot streams and identify the mass that the water-removal headline does not account for.
        title: What did the treatment actually do?
        place: Pilot Treatment Plant
        setup: Match each observation to the process implication.
        question: How much material is missing from the measured streams, and does the ledger support a destruction claim?
        scene: The pilot treatment processed a batch containing 100 kilograms of contaminant. Rafael Delgado, the byproduct analyst, has measured the treated water, sludge and off-gas. City officials are waiting to hear whether the process destroyed the material or moved it into another reservoir.
        story: "The pilot plant has run and the city wants to hear that the contaminant is gone. A mass balance across every stream is what makes that claim checkable: what came in, what left in the treated water, what left in the sludge, what left as off-gas, and what is unaccounted for. Removal from water and destruction are two different claims, and only one of them means the hazard has ended — a contaminant concentrated into a solid is smaller in volume, easier to handle, and still entirely present. Read all the streams, not the one being asked about."
        assumes:
          - mass is conserved across the treatment process
          - a concentration decrease in water does not identify where the removed material went
        takeaway: Removal from one stream is not destruction; a treatment claim must conserve mass across all measured products and reservoirs.
        format: BALANCE
        why: The treated water contains only 6 kg, but that does not mean 94 kg were destroyed. 71 kilograms are measured in sludge and 3 kg appear in off-gas. Those visible streams total 80 kg, leaving a 20 kg term required to close the original 100 kg ledger. The bench already sees an unquantified transformation-product signal, so that missing mass has a plausible destination. The mass balance supports transfer and transformation, not a claim that the contaminant vanished.
        balance:
          total:
            amount: 100
            unit: kg
            label: Contaminant entering the pilot
          streams:
            - id: water
              label: Treated-water contaminant
              value: 6
              display: 6 kg
            - id: sludge
              label: Contaminant measured in sludge
              value: 71
              display: 71 kg
            - id: offgas
              label: Contaminant-equivalent measured in off-gas
              value: 3
              display: 3 kg
            - id: transform
              label: Unquantified transformation-product pool
              value: 20
              note: A separate analytical signal exists, but the method has not yet converted it to a concentration.
              hidden: true
          tolerance: 2
          hint: Read every stream first. Count only masses that refer to the same contaminant ledger, then close the difference between the measured outputs and the 100 kg input.
          commit: Report the total
        guide: Read every stream first, because reading costs nothing. Then count only the masses that belong to the same contaminant ledger. The batch went in with 100 kilograms, and treated water, sludge and off-gas have each been measured. Whatever the counted streams do not account for is the missing mass, and that gap is what the destruction claim rests on.
        background:
          - What counting a stream claims. Reading is neutral. Adding a stream to the ledger says that the mass in it is the same substance the batch went in with. A breakdown product measured by a method that reports it as the parent compound is the way that claim goes wrong.
          - "Why a gap is not a destruction. Mass that has left the measured streams has gone somewhere: an unmeasured vent, adsorbed on the vessel, or transformed into something none of the three methods sees. Destruction is one explanation for a gap, and the least testable of them."
          - What the city is actually being told. 'Destroyed' and 'moved into another reservoir' have very different consequences for whoever ends up with the sludge or the air. The ledger is what distinguishes them, which is why the claim has to be made from the numbers rather than about them.
        concept: The mole, molar mass and stoichiometry
        answerText: The measured streams account for 80 kg, so 20 kg remain unaccounted for. Until that term is identified and shown benign, the pilot supports a transfer/transformation claim, not 94% destruction.

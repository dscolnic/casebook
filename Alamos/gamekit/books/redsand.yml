    - free energy combines an enthalpy term with a temperature times an entropy term
    - a reaction that takes in heat has a positive enthalpy change
    takeaway: Temperature can change selectivity because competing reactions can have different thermodynamic responses 
      to heating.
    format: CHOICE
    question: Why does the hotter bed make relatively more carbon monoxide?
    why: "Two reactions are competing for the same carbon, and they have to be judged separately. Making methane gives off
      heat, so heating pushes that balance back toward the feed. Making carbon monoxide takes heat in, so heating pulls that
      balance forward. Both get faster too, but speed alone would leave the proportions unchanged. What moved is the split.
      That split is selectivity, and it moved because the two equilibrium constants do not travel in the same direction. So
      a set point does not only decide how much converts. It decides what the carbon becomes."
    choices:
    - Heating favours the reaction that takes heat in and pushes the other back.
    - Carbon monoxide forms faster than methane does, so a bed running faster makes more of it.
    - The catalyst changes what it makes once it is above 300 degrees.
    - Carbon monoxide is the more stable product, and heat lets the mixture reach it.
    answer: Heating favours the reaction that takes heat in and pushes the other back.
    rebuttals:
    - Both reactions do speed up with temperature, and speed alone would leave the proportions where they were.
    - The catalyst offers both paths at every temperature, and it is the two balances that move.
    - Stability is not one ranking; which product is favoured depends on the temperature being asked about.
  - group: KINET
    title: Reading a bed by where its heat is
    at: bed
    reason: >-
      Nine sols of heat profiles are pinned along the wall, and they are the only view anyone has inside the bed
    place: Catalyst Bay
    scene: >
      Nine sols of profiles are pinned along the wall in order. On the first, the hot spot sits 4 centimetres into the bed.
      On the last it sits at 34. The peak temperature is about the same on every one.
    guide: >-
      Nine sols of profiles are on the wall and something is moving. But look at what is not moving. The peak temperature
      is the same on every one. The pressure drop across the bed has not changed. Neither has the feed. Those three are your
      evidence, not the hot spot. Take each candidate and ask how many of the five readings it fits. And ask one more thing:
      which end of a bed meets the strongest feed?
    background:
    - >-
      Why a hot spot marks where the work is happening. The reaction gives off its heat exactly where it occurs. Dead catalyst
      does no reacting, so it gives off no heat — gas passes through it unchanged and unwarmed. The hot spot therefore sits
      at the first place the gas meets catalyst that still works. Move that boundary and the hot spot moves with it.
    - >-
      Why a bed dies from the inlet end. Whatever is poisoning this catalyst arrives dissolved in the feed. The front of the
      bed meets that feed first and at full strength, so it takes the damage first. As the front dies, the poison travels
      deeper before it is absorbed, and the dead zone grows downstream. A poisoned bed is eaten from the inlet, always in
      that direction.
    - >-
      Why the quiet readings decide this one. The alarming reading draws the eye and usually fits several explanations at
      once. The readings that separate them are the ones an explanation says should have moved and which have not. Unchanged
      pressure drop rules out packing and fouling. Unchanged feed rules out a leaner feed. An unchanged peak says the catalyst
      that still works is undamaged.
    assumes:
    - a reaction gives out its heat where it is happening
    - a bed can lose activity in one part and keep it in another
    takeaway: Where a bed is hot is where it is still working.
    format: DIAGNOSIS
    headline: The hot spot has walked 30 centimetres down the bed in 9 sols, at an unchanged peak temperature.
    task: Which explanation fits every reading?
    readings:
    - {zone: Bed profile, label: Hot spot position, value: 4 cm to 34 cm in 9 sols, status: alarm}
    - {zone: Bed profile, label: Peak temperature, value: unchanged, status: normal}
    - {zone: Reactor, label: Pressure drop across the bed, value: unchanged, status: normal, note: rules out packing and
        fouling}
    - {zone: Feed, label: Composition and flow, value: unchanged, status: normal}
    - {zone: Product, label: Conversion, value: down 2% a sol, status: alarm}
    choices:
    - {label: The front of the bed has stopped working, mechanism: 'Dead catalyst passes gas unchanged, so the heat appears
        wherever live catalyst begins.'}
    - {label: The gas is finding a channel through the packing, mechanism: 'A channel lets feed past without contacting the
        catalyst at all.'}
    - {label: The feed has changed and the bed is responding to it, mechanism: 'A leaner feed reacts further into the bed
        before it gives out heat.'}
    - {label: The thermocouples have drifted along their sheath since the last service, mechanism: 'A sensor problem can move
        a profile with nothing happening in the bed.'}
    answer: The front of the bed has stopped working
    why: >-
      The unchanged peak temperature is what decides it. Wherever the reaction is happening, it is going as hard as ever.
      So the catalyst that still works has not been weakened. What has changed is how much of the bed is doing any work at
      all. Unchanged pressure drop rules out packing and fouling. Unchanged feed rules out a leaner feed reacting later. That
      leaves a dead front. A bed dies from the inlet end, because that is where the feed arrives at full strength, and conversion
      falls as the working length shrinks.


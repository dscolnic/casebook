      Here is the piece to hold on to. A liquid that is already boiling cannot get any warmer. Every bit of heat that arrives goes into turning liquid into gas instead. So the thermometer never moves, and the tank empties anyway.

      The energy it takes to turn one kilogram of liquid into gas has a name. It is the latent heat of vaporisation. Latent means hidden — the heat goes in and the temperature does not show it.


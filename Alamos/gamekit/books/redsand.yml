        guide: >-
          Demir's question is a good one: the plant is paying for 1.75 volts and the
          thermodynamics only asks for 1.23. Start from what that first 1.23 buys. It pays
          the free-energy bill for splitting the water, and below it nothing happens at all.
          Everything above it has a name — overpotential — and a different job. So for each
          option, ask whether the extra half-volt changes the product or only the cost.
          Energy does not vanish, so it has to end up somewhere.
        background:
          - >-
              What the first 1.23 volts is for. Splitting water is uphill. It needs about 237
              kJ per mole of free energy supplied from outside, and 1.23 volts is what that
              works out to per electron. Below that voltage the reaction simply does not run.
              This part of the bill is set by the chemistry and cannot be negotiated.
          - >-
              What overpotential is, and why it is not optional. Real electrodes are not
              perfect. Current has to be pushed through the electrolyte, which resists it.
              Molecules have to be persuaded onto and off the electrode surface, and those
              steps are slow. Both need voltage above the minimum to happen at any useful
              rate. That excess is the overpotential, and it grows as you push more current.
          - >-
              Why the hydrogen is the same either way. A hydrogen molecule made at 1.75 volts
              is identical to one made at 1.23. It holds the same energy, because that energy
              lives in the molecule and not in the cell that produced it. So the extra half-

    background:
    - >-
      Why the bed heats itself. Assembling methane gives off heat, so a bed that is working is a bed that is warming. And
      a bed that warms converts less on each pass, because the ceiling falls as the temperature rises. The reaction and the
      cooling are in a loop with each other. Neither settles without the other.
    - >-
      Why the feed will not sit still. The stacks run on array power, the array follows the sun and the dust, and more hydrogen
      arriving means more reaction, which means more heat. It arrives as a rate rather than as a step, which is what makes
      chasing the reading a losing game.
    - >-
      What holding a self-heating process asks of you. A disturbance that keeps pushing needs the valve set to a new position,
      not nudged and watched. Nudge, wait, nudge again, and the bed is always a few minutes behind the feed. By the time the
      reading has moved far enough to convince you, the heat that moved it is already in the metal. Answer the feed, not the
      reading.

              label: Loop pressure
        answerText: Flow is the separating variable. Halving it at fixed temperature and pressure raises conversion from 64% to 69%, and restoring the flow returns it to 64%, showing a rate-limited shortfall.
        why: Equilibrium at fixed temperature and pressure does not depend on how quickly gas crosses the bed. Kinetics does. Halving the flow doubles residence time while leaving the equilibrium composition unchanged. In this controlled run, conversion rises well beyond repeat scatter and returns when the original flow is restored. That means the reactor had been leaving before the mixture reached its equilibrium ceiling. Changing temperature or pressure would not answer the same question because each would move the equilibrium as well as the reaction rate.
  # ---------------------------------------------------------------- sol 300
  - title: A new charge and a rule for the water
    objective: Get a bed back into service and decide what stops this happening again.
    briefing: There is one spare catalyst charge on the station and no second one coming.
    stake: >-
      Sol 300. The last spare catalyst charge came out of stores this morning and there is no second
      one on this planet, so whatever is done with it is done once. Kaur wants it qualified properly
      before it carries production; Sundqvist wants it making methane by the afternoon, and this
      time Marion Wells, who commands the station, has come down on Kaur's side. Achebe has parts
      enough for one improvement to the water and power loop and a list of four. Today you set the
      order the charge is brought into service, decide what the spare parts are spent on, and settle
      whether the methane tank's rising pressure is a leak or a temperature. Everything the plant
      does for the next hundred and 80 sols runs through a bed commissioned this afternoon.
    takeaway: A part with no replacement is commissioned by procedure rather than by enthusiasm.
    stops:
      - group: KINET
        task: Order the four operations for bringing the charge into service.
        title: Bringing a charge into service
        place: Catalyst Bay
        scene: |-
          The fresh charge arrives as nickel oxide on alumina, which is not a catalyst yet. Kaur has four operations written out and wants them in an order she can hand to a technician at three in the morning.
        assumes:
          - nickel oxide has to be reduced to nickel metal before it is active
          - hydrogen at temperature will reduce a metal oxide
        takeaway: A part that cannot be replaced is proved at low rate before it is trusted at full rate.
        format: SEQUENCE
        why: Each operation makes the next one possible or safer. Nitrogen purge removes oxygen before hot hydrogen enters the reactor. Reduction must then convert nickel oxide into active nickel metal. A low-flow light-off test checks whether the new charge is active before full production feed is committed. Only after that should the plant run a matched comparison against a known good charge. The comparison creates a quantitative baseline for the next crew instead of leaving them only a verbal impression of performance.
        cards:
          - Purge the reactor with nitrogen until no oxygen remains in it.
          - Pass dilute hydrogen at 350 °C to reduce the nickel oxide to nickel metal.
          - Run a light-off check at a tenth of production flow to confirm activity.
          - Match conditions to the sol-270 run and compare conversion against that charge.
        order: [0, 1, 2, 3]
      - group: ELEC
        task: Fund the change that would most alter what the plant does next.
        title: One improvement, four candidates
        place: Electrolysis Hall
        scene: The station has parts and crew time for one improvement. One catalyst charge is already lost, and there is no spare after the new one. Achebe puts four candidates on the board before anyone starts cutting pipe.
        assumes:
          - the polishing column gives no warning as it fills
          - the plant has no spare catalyst charge after this one
        takeaway: The work worth doing first is the work that would have caught the fault nobody caught.
        format: SCIENCETANK
        answerText: Fit the conductivity monitor and alarm on reactor feed water. It turns the measurement that already existed into an action before unpolished water reaches the catalyst.
        why: The failure was not that the plant lacked a measurement. Conductivity was recorded every sol. The failure was that no rule turned the measurement into an action. A feed-water alarm would have made the breakthrough visible while the catalyst could still be protected. A second polishing column adds capacity but still needs a trigger for changeover. Extra array power does not address the fault, and the catalyst already has several temperature probes. The highest-leverage change closes the gap between an existing signal and an irreversible consequence.
        proposals:
          - label: A
            text: Plumb a second polishing column behind the first, so the lead bed can be changed at breakthrough.
          - label: B
            text: Fit a conductivity monitor with an alarm on the reactor feed water.
          - label: C
            text: Add a fourth panel string to the array to raise the power available.
          - label: D
            text: Install a second temperature probe in the catalyst bed.
        recommended:
          A: 45
          B: 35
        evidence: |-
          The plant ran for 38 sols on water no column was polishing, and lost a catalyst
          charge to it. The conductivity was logged the whole time and read by nobody. The array has
          not been the limit on any sol this season, and there are four probes in the bed already.
      - group: PHASE
        task: Decide whether a rising pressure is a leak
        title: The tank pressure that is not a leak
        place: Cold End
        scene: |-
          The methane tank has climbed about 0.3 bar a sol for 4 sols. The mass in the tank is unchanged across the same four sols, and Moreau is being asked whether to vent it.
        assumes:
          - a liquid in a closed tank sits under the pressure of its own vapour
          - vapour pressure rises steeply with temperature
        takeaway: Pressure in a cryogenic tank is a reading of temperature until the mass says otherwise.
        format: CHOICE
        question: The pressure is rising and the mass is not falling. What is happening?
        why: A tank holding liquid and vapour together sits near the vapour pressure set by its temperature. Pressure is therefore a sensitive thermometer while both phases remain present. Here the mass has stayed constant for four sols, so a significant leak or sustained venting is not supported by the inventory. The rising pressure instead points to warming. The response is to find the added heat — insulation, a conducting valve or a refrigeration problem — rather than venting propellant merely because the pressure rose.
        choices:
          - The contents are warming, and the vapour pressure is following the temperature up.
          - Gas is escaping through a leak even though the measured tank mass is unchanged.
          - The liquid is boiling away fast enough to raise pressure without changing the tank inventory.
          - The gauge must have drifted because pressure cannot change at constant mass.
        answer: The contents are warming, and the vapour pressure is following the temperature up.
        rebuttals:
          - A leak large enough to explain the pressure trend should also appear as a mass loss; the inventory is flat.
          - Sustained boil-off or venting changes the liquid inventory unless the vapour is retained, and the pressure rise still requires warming.
          - Constant mass does not imply constant pressure when temperature changes.
  # ---------------------------------------------------------------- sol 301
  - title: The sol everything agreed
    objective: Close the plant's own books while there is nothing to firefight.
    briefing: The new charge ran to specification for a full sol and nobody quite believes it.
    stake: >-
      Sol 301, and for the first time since the spring the plant has run a full 24 hours
      without anybody being called out. The new charge is holding conversion at 71 per
      cent, the polishing column is fresh, and the sol's production came in at 14.1
      kilograms against a target of 13.8. Wells has asked for the quiet sol to be
      spent on arithmetic rather than on improvements, which is not a popular instruction. Today you
      close the energy ledger against what the array actually delivered, settle how full a
      cryogenic tank may be filled, and follow the carbon through a full pass of the loop. Herrera's
      view is that a plant nobody understands on a good sol is a plant nobody can fix on a bad one.
    takeaway: The sol to check the books is the sol when nothing is going wrong.
    stops:
      - group: GIBBS
        task: Put a number on what the hydrogen costs
        title: The bill for a kilogram of hydrogen
        place: Plant Control
        scene: Demir is closing the sol’s energy ledger. The stacks made 6.9 kg of hydrogen. He wants their electrical energy use written beside the array output before he signs the sheet.
        assumes:
          - electrical energy can be counted in kilowatt-hours
          - a stack costs more energy per kilogram than the hydrogen itself carries
        takeaway: What a product costs to make and what it stores are two different numbers, and the gap is the price of running at a rate.
        format: BALLPARK
        question: Estimate the electrical energy the stacks spent making hydrogen this sol.
        why: A kilogram of hydrogen has two useful energy numbers. One is the chemical energy stored in the hydrogen itself. The other is the electrical energy this stack spends to make that kilogram. The second is larger because real cells operate above the reversible voltage. That difference becomes heat and other losses in the electrolysis system. Here the stack uses about 55 kWh/kg while hydrogen stores about 39.4 kWh/kg. Using the stored-energy number as the production cost would understate the electrical bill substantially.
        estimate:
          prompt: The stacks made 6.9 kg of hydrogen. At the voltage they run, this stack spends about 55 kWh for each kilogram it makes.
          question: Estimate the electrical energy the stacks spent making hydrogen this sol.
          labels:
            - 6.9 kg  (hydrogen made this sol)
            - 55 kWh/kg  (energy this stack spends per kilogram)
            - 39.4 kWh/kg  (energy stored in a kilogram of hydrogen)
            - 1.75 V  (cell voltage)
            - 88800 s  (seconds in a sol)
          values: [6.9, 55, 39.4, 1.75, 88800]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 379.5
          tolerance: 25
          units: kWh
          solution: 6.9 kg × 55 kWh/kg ≈ 380 kWh.
          explanation: The energy a stack spends is not the energy the hydrogen holds. Using the stored figure instead gives 272 kWh and understates the bill by a quarter.
          relationship: Energy spent = the mass of hydrogen made × the energy this stack spends to make one kilogram of it.
      - group: PHASE
        task: Say how full a cryogenic tank may be filled
        title: The space left at the top
        place: Cold End
        scene: |-
          Bhatt's loading procedure stops the methane tank at 95 per cent by volume. Moreau has been asked why the remaining five per cent is not simply more propellant, with the window as close as it is.
        assumes:
          - a liquid at its boiling point turns to vapour when heat reaches it
          - a closed vessel has a pressure it is rated to
        takeaway: A cryogenic tank is designed around what happens to it between filling and use.
        format: CHOICE
        question: Why is the flight tank filled to 95 per cent rather than full?
        why: A cryogenic tank always contains some vapour because heat continues to enter. The gas space above the liquid is the ullage. It gives newly formed vapour room before pressure reaches the relief setting. Filling the tank completely with liquid removes that buffer. Heating then causes liquid expansion and vapour formation to drive pressure upward quickly. The relief system must vent material to protect the tank. Leaving planned ullage therefore prevents a small heat input from immediately becoming a propellant-loss event before the vehicle uses the fuel.
        choices:
          - Vapour from boil-off needs somewhere to go, or the tank pressure climbs against its rating.
          - Liquid methane expands as it cools further in the tank and would split a full one.
          - A full tank cannot be measured, since the gauge floats on the liquid surface.
          - The pump cannot draw from a tank with no gas above the liquid to push it out.
        answer: Vapour from boil-off needs somewhere to go, or the tank pressure climbs against its rating.
        rebuttals:
          - Liquid methane in a tank sits at its boiling point and is not cooling further.
          - The gauge on this tank reads by pressure and temperature and does not need a surface to float on.
          - The pump is fed by pressure from the tank's own vapour, and five per cent is not what makes that possible.
      - group: EQUIL
        task: Close the 100-mole carbon ledger for 1 pass, then decide which carbon is lost and which is recycled.
        title: Close the carbon pass
        place: Reactor Hall
        scene: "Herrera pins one pass of the carbon assay to the board: 100 moles of carbon dioxide entered. Methane and carbon monoxide are measured at the outlet, and the recycle meter records the unreacted return stream."
        assumes:
          - the recycle loop returns unreacted gas to the inlet
          - every carbon atom entering the bed leaves it in something
        takeaway: Per-pass conversion counts what reacts now; overall conversion counts what is eventually recovered after unreacted feed is recycled.
        format: BALANCE
        question: Where are all 100 carbon moles after 1 pass, and what does that imply for overall methane yield after repeated recycle?
        balance:
          total:
            amount: 100
            unit: mol C
            label: Carbon entering one reactor pass
          streams:
            - id: methane
              label: Carbon leaving as methane
              value: 64
              display: 64 mol C
            - id: carbon_monoxide
              label: Carbon leaving as carbon monoxide
              value: 2
              display: 2 mol C
            - id: bed_inventory
              label: Change in carbon held in the bed
              value: 0
              display: No accumulation
            - id: recycle
              label: Unreacted carbon dioxide returned to the inlet
              value: 34
              display: 34 mol C
              hidden: true
          tolerance: 0.5
          hint: Close the one-pass carbon ledger first. Only after every carbon mole is accounted for should you decide which terms are losses from the plant and which return for another pass.
        answerText: The pass closes as 64 CH₄ + 2 CO + 34 recycled CO₂ = 100 carbon moles. Recycle makes the overall methane fraction approach about 64/(64+2) ≈ 97%, not 64%.
        why: "A one-pass conversion of 64% does not mean 36% of the feed is lost. The carbon ledger shows 64 moles leaving as methane, 2 as carbon monoxide and 34 returning as unreacted carbon dioxide. The recycle term is therefore inventory, not waste. If the same selectivity holds over repeated passes, the returned carbon keeps getting another chance. The ultimate split approaches the ratio of the irreversible products: 64/(64+2), or about 97% methane, with about 3% ending as carbon monoxide."
  # ---------------------------------------------------------------- sol 302
  - title: 40 per cent of the sun
    objective: Decide what the station stops doing when the power halves.
    briefing: A regional dust storm arrived overnight and the array is delivering less than half.
    stake: >-
      Sol 302. A regional storm crossed the station overnight and the sky this morning is the
      colour of the ground. Iosif Petrov, the array technician, has the field delivering 430
      kilowatt-hours against 2000 on a clear sol, and nobody can say
      whether that lasts 2 sols or 20. Everything on this plain runs off that array: the
      stacks, the refrigerators, the drill, and the habitat that Demir keeps at 19 degrees.
      Today you work out how much light is actually reaching the panels, decide in what order the
      loads are shed, and settle what the water plant does while the drill is stopped. Wells will
      sign whatever order you set, and she has said she will not revisit it before the storm clears.
    takeaway: A power cut on a plain with one array is a decision about what the station stops doing.
    stops:
      - group: ELEC
        task: Work out how much sunlight is reaching the panels
        title: What the dust leaves of the sun
        place: Electrolysis Hall
        scene: |-
          Petrov has the optical depth from the station's own sun sensor: 2.4, against 0.4 on a clear sol. Above the dust the beam would deliver 490 watts to each square metre of panel.
        assumes:
          - each unit of optical depth cuts a beam by a further factor
          - a beam is attenuated as an exponential of the depth it passes through
        takeaway: Dust does not dim a beam in proportion; it multiplies it down, so each unit of depth costs more than the last.
        format: BALLPARK
        question: Estimate the direct beam reaching a panel through this dust.
        why: Dust attenuation is multiplicative. Each additional unit of optical depth removes the same fraction of the beam that remains. That is why a change from τ = 0.4 to τ = 2.4 is much worse than subtracting 2 equal pieces of sunlight. The direct beam falls to under a tenth of the above-dust value. The array still receives some scattered light from the sky, so direct-beam loss is not the same as total array output. The exponential relation describes only the unscattered beam.
        estimate:
          prompt: Above the dust the beam is 490 watts a square metre. The station's sun sensor reports an optical depth of 2.4.
          question: Estimate the direct beam reaching a panel through this dust.
          labels:
            - 490 W/m²  (beam above the dust)
            - 2.4  (optical depth today)
            - 0.4  (optical depth on a clear sol)
            - 0.22  (efficiency of the panels)
            - 1900 m²  (area of the array)
          values: [490, 2.4, 0.4, 0.22, 1900]
          slots: 2
          template: "{0} × e^(−{1})"
          formula: a*Math.exp(-b)
          correct: [0, 1]
          target: 44.5
          tolerance: 8
          units: W per square metre
          solution: 490 × e^(−2.4) ≈ 44 W per square metre of direct beam.
          explanation: The exponential is why a storm is so much worse than it looks. The panel efficiency and the array area turn this into kilowatts, and are a later step.
          relationship: "Transmitted beam = the beam above the dust × e raised to minus the optical depth: each unit of depth divides the beam by a further factor of about 2.7."
      - group: GIBBS
        task: Build a plan for the power there is
        title: What the station stops doing
        place: Plant Control
        scene: The dust storm has cut the sol from about 2,000 kilowatt-hours to 430. Tank refrigeration is already drawing power, and six other demands are queued. Demir and Wells want the sacrifices written down before breakers are opened.
        assumes:
          - stopping a process can be reversible or costly to reverse
          - a cryogenic tank warms up when its refrigerator stops
        takeaway: Loads are ranked by what stopping them costs to undo, rather than by what they draw.
        format: ALLOCATE
        question: 430 kilowatt-hours. Build the sol's plan, and know what it stops the station being able to say.
        allocate:
          hint: Nothing on this list is a wrong thing to run. What the plan cannot do is the price of what it can.
          pool:
            amount: 430
            unit: kWh
            mode: scalar
          items:
            - id: habitat
              label: Habitat heat and air
              cost: 180
              protected: true
              note: the crew is not a load
            - id: liquefier
              label: Liquefier and tank refrigeration
              cost: 210
            - id: stacks
              label: Electrolysis stacks at half rate
              cost: 160
            - id: batteries
              label: Recharge the battery reserve
              cost: 120
            - id: drill
              label: Drill and hopper heating
              cost: 90
            - id: drier
              label: Keep the product drier warm
              cost: 40
            - id: comms
              label: The downlink home
              cost: 20
          answers:
            - question: Does the propellant already made stay in the tanks?
              requires:
                - liquefier
              required: true
            - question: Does the plant make any methane this sol?
              requires:
                - stacks
            - question: Is there reserve in hand for the next storm?
              requires:
                - batteries
            - question: Does the cold end stay clear of ice?
              requires:
                - drier
            - question: Is any ice cut today?
              requires:
                - drill
          commit: Commit the sol's plan
        answerText: Keep the protected habitat bus and cryogenic refrigeration inside the 430 kWh limit. Then choose at most one substantial optional job. The jobs left unfunded are part of the answer.
        why: The power plan should rank loads by the cost of stopping them. Digging is recoverable because the ground remains available. Batteries can recharge on the next clear sol. Electrolysis can be made up later if schedule margin remains. Cryogenic refrigeration is different. When it stops, heat keeps entering the tanks and already-made propellant boils away. That loss cannot be recovered without making new propellant later. Habitat power is protected separately. The scarce pool should therefore preserve irreversible assets before funding work that can simply be deferred.
      - group: SOIL
        task: Decide what the water plant does with no drill
        title: Running the plant with no digging
        place: Water Plant
        scene: The drill is off and the hopper is empty. The holding tank still contains 1,100 litres, while the reactor draws about 60 litres per sol. Abiola is asked whether the whole water plant must stop.
        assumes:
          - the reactor's water demand is met from a holding tank rather than from the drill directly
          - the Sabatier reaction makes water as well as methane
        takeaway: A buffer between two steps is what lets one of them stop without the other one noticing.
        format: CHOICE
        question: What lets the reactor keep running through a storm with the drill stopped?
        why: "Two buffers separate the reactor from daily drilling. The first is stored water: 1,100 litres at 60 litres per sol is about 18 sols of inventory. That is longer than the storms recorded at this site. The second is process recycle. The Sabatier reaction produces water, and the plant condenses and returns part of that stream. Those two buffers let extraction pause without forcing an immediate reactor shutdown. They also show why plant reliability depends on inventories between steps, not only on the machines themselves."
        choices:
          - The holding tank, plus the water the reaction itself gives back into the loop.
          - The condenser, which pulls water vapour out of the atmosphere at six millibars.
          - The polishing column, which stores clean water inside its resin bed.
          - Nothing does; the reactor has to stop with the drill and restart afterwards.
        answer: The holding tank, plus the water the reaction itself gives back into the loop.
        rebuttals:
          - The atmosphere here holds almost no water vapour, and the condenser works on the hopper stream instead.
          - An exchange bed holds ions rather than water, and it holds no useful volume.
          - Restarting a cold reactor costs a sol of production, which is exactly what the buffer exists to avoid.
  # ---------------------------------------------------------------- sol 303
  - title: Three things at once
    objective: Rank three faults that arrived together, and act on them in that order.
    briefing: The storm cleared and left three problems that were not there a week ago.
    stake: >-
      Sol 303, and the storm blew itself out in the last hours of the night. It left three things
      behind. Moreau's oxygen tank is losing twice the boil-off it lost a fortnight ago; the new
      catalyst charge has never been checked against the sol-270 run because the storm took the
      power to do it; and the battery bank came down to 30 per cent overnight and has to be
      brought back before the next dust event. Today you work out what is wrong with the cold end,
      decide what a fair comparison of the new charge looks like, and rank all three against each
      other. Kaur, Moreau and Achebe each want theirs first, and all three of them are being
      reasonable about it.
    takeaway: Three reasonable people wanting to be first is a ranking problem rather than an argument.
    stops:
      - group: PHASE
        task: Build the refrigerator heat path in order and identify the transfer that dust has made limiting.
        title: Follow the heat to the sky
        place: Cold End
        scene: Oxygen boil-off has jumped from 12 to 26 kilograms a sol since the storm. Moreau opens the refrigeration schematic beside the tank. Jacket pressure is normal, while the compressor is already at its current limit.
        assumes:
          - a refrigerator has to reject its heat somewhere
          - dust settles on any surface left out in a storm
        takeaway: A refrigerator can lose capacity because heat cannot leave its warm end, even when the compressor and insulation are intact.
        format: CHAIN
        question: Trace the heat from the liquid oxygen to its final sink. Which required transfer is now governing the loss?
        chain:
          hint: Assemble only the required heat-transfer path from the tank to the environment. Then choose which link is contradicted by the normal readings and which is directly impaired by dust.
          links:
            - id: evaporator
              label: Tank liquid → cold heat exchanger
              transfers: heat from liquid oxygen into the refrigerant
            - id: compressor
              label: Compressor work on refrigerant
              transfers: raises refrigerant pressure and temperature so heat can be rejected
            - id: condenser
              label: Hot refrigerant → radiator plate
              transfers: moves heat out of the refrigerant
            - id: radiator_sky
              label: Radiator plate → cold sky
              transfers: radiates the heat away from the station
            - id: vacuum_jacket
              label: Outside structure → tank through insulation
              transfers: parasitic heat leak into the tank
          distractor: compressor
          evidence:
            vacuum_jacket: pressure normal
            compressor: at current limit
            radiator: dust-covered after storm
          order:
            - evaporator
            - compressor
            - condenser
            - radiator_sky
          governing: radiator_sky
        answerText: The governing link is heat rejection from the dusty radiator to the sky. The compressor is working, and the jacket is intact, but the final heat-transfer step has lost capacity.
        why: The refrigerator does not destroy heat. It moves heat from the tank into the refrigerant. Compressor work then raises the refrigerant temperature enough for heat rejection. The condenser transfers that heat to the radiator, which must radiate it to the sky. The vacuum jacket is a separate path for unwanted heat to enter the tank. Its normal pressure makes that path less likely here. Dust weakens the final radiator-to-sky transfer, so the cold end warms even while the compressor works at its limit.
      - group: KINET
        task: Set the terms of a fair comparison
        title: Comparing two charges honestly
        place: Catalyst Bay
        scene: |-
          Kaur wants the new charge compared against the sol-270 run before it is trusted with the rest of the season. The plant is at a different temperature, flow and pressure than it was on sol 270.
        assumes:
          - conversion depends on temperature, pressure, flow and the catalyst together
          - a comparison is only about the variable that was deliberately changed
        takeaway: A comparison is worth what its matched conditions are worth.
        format: CHOICE
        question: What has to be true for a comparison between two charges to mean anything?
        why: Conversion depends on several variables at once. Temperature, pressure and flow are operating settings, while catalyst condition is the property being compared. If the settings differ between two runs, the comparison mixes catalyst performance with operating effects. Matching those settings removes the main alternative explanations. The remaining conversion difference can then be attributed more credibly to the charge. Running each catalyst at its own best condition answers a different question and produces two results that cannot be cleanly subtracted.
        choices:
          - Temperature, pressure and flow are set to the sol-270 values before conversion is read.
          - Both charges are run at whatever conditions produce their best conversion.
          - The comparison uses a whole sol of production from each charge.
          - Both are compared at the same time of sol, so the ambient conditions match.
        answer: Temperature, pressure and flow are set to the sol-270 values before conversion is read.
        rebuttals:
          - Best-for-each conditions produce two numbers that cannot be compared, since the settings differ along with the charge.
          - A whole sol of each is more data about an unmatched comparison, which does not repair it.
          - Ambient conditions outside barely reach a reactor held at 593 K, and the loop's own settings are what matter.
      - group: GIBBS
        task: Rank three faults against each other
        title: Which of the three cannot wait
        place: Plant Control
        scene: >
          The three problems are on the board with the power to fix one of them today. Wells wants
          the order and the grounds for it in the log before anybody starts work.
        assumes:
          - propellant vented from a tank cannot be recovered
          - a comparison run and a battery charge can both be done later
        takeaway: What cannot be undone goes first, whatever is loudest.
        format: CHOICE
        question: Which of the three is dealt with first?
        choices:
          - The radiator, since every sol of doubled boil-off is propellant that leaves for good.
          - The battery bank, since another storm without reserve would stop the whole station.
          - The charge comparison, since the season's production depends on knowing the bed is good.
          - Whichever can be finished today, since a finished job is worth more than a started one.
        answer: The radiator, since every sol of doubled boil-off is propellant that leaves for good.
        why: >-
          Rank by what a delay costs and whether it can be recovered. Boil-off is a loss of a thing
          already made, running at 14 extra kilograms a sol, and no later work brings those
          kilograms back. Batteries recharge on the next clear sol. A comparison run is information,
          and information waits at no cost provided the bed is watched. Only one of the three is
          spending an asset while it is queued, and that is the one that goes first.
        rebuttals:
          - The battery bank refills on the next clear sol at no permanent cost, and one has been forecast.
          - The comparison matters and loses nothing by waiting two sols, since the bed is under watch.
          - Choosing by what fits in a sol ranks by convenience and ignores what each delay is costing.

  # ---------------------------------------------------------------- sol 304
  - title: Loading is one way
    objective: Decide whether this batch goes into the vehicle.
    briefing: The batch is made, the assay is back, and one line of it is outside the specification.
    stake: >-
      Sol 304, and the batch made since the new charge went in is standing in the transfer tank
      this morning with its assay beside it. It is 410 kilograms of methane, which
      is 3 sols of the season, and 1 line of the assay sits outside what Bhatt's specification
      allows. Once it goes across into the vehicle it cannot be taken out again, cleaned, or
      tested by firing. Today you read the batch against the specification, work out what mass of
      oxygen the vehicle needs beside it, and decide whether the stacks can be pushed to close the
      remaining gap. Bhatt has said she will sign what the assay supports and nothing else, and
      Sundqvist has counted how many sols are left.
    takeaway: A decision that cannot be reversed is worth more care than one that costs more.
    stops:
      - group: EQUIL
        task: Match each assay line to what it means for the vehicle.
        title: The line that fails
        place: Reactor Hall
        scene: The loading crew is waiting at the methane umbilical. Bhatt has four assay lines beside four flight limits. Three are inside specification; one is not. Herrera wants the consequence named before the transfer valve opens.
        assumes:
          - water freezes at a temperature the vehicle's valves reach in use
          - carbon monoxide does not burn to give the energy methane does
        takeaway: A specification is a list of chemical limits tied to different downstream consequences, not a single purity score.
        format: PROTOCOL
        why: "A specification is not one overall purity score. Each line protects a different downstream function. Water is the failure here: 400 ppm is 8 times a 50 ppm limit. At cryogenic valve temperatures, that water can become solid and interfere with moving hardware. Carbon monoxide and carbon dioxide are still inside their stated limits. If either rose too far, it would create a different consequence. The vehicle therefore needs every assay line interpreted against its own limit and failure mode before loading begins."
        scenarios:
          - Methane at 99.1 per cent against a limit of 99.0.
          - Water at 400 parts per million against a limit of 50.
          - Carbon monoxide at 0.5 per cent against a limit of 1.0.
          - Carbon dioxide at 0.2 per cent against a limit of 0.5.
        choices:
          - Inside the limit, and the margin is thin enough to be worth watching on the next batch.
          - Eight times the limit, and it freezes in a valve at the temperature that valve runs at.
          - Inside the limit; it is ballast that costs a little performance and does no damage.
          - Inside the limit, and it freezes out in the tank rather than in a moving part.
        mapping: [0, 1, 2, 3]
      - group: PHASE
        task: Work out how much oxygen goes with the methane
        title: How much oxygen a tonne of methane needs
        place: Cold End
        scene: |-
          Bhatt wants the oxygen mass checked independently before the loading order is written. Methane burns with oxygen 2 moles to 1, and the vehicle carries 6.6 tonnes of fuel.
        assumes:
          - a balanced equation gives the mole ratio for a reaction
          - a molar mass converts a number of moles into a mass
        takeaway: A mole ratio is not a mass ratio until both molar masses have been applied.
        format: BALLPARK
        question: Estimate the mass of oxygen needed for each kilogram of methane burned.
        why: A balanced equation gives a mole ratio, while tanks are filled by mass. Complete methane combustion uses two moles of oxygen for every mole of methane. 2 moles of O₂ have a mass of 64 g, while 1 mole of CH₄ has a mass of 16 g. The stoichiometric oxygen-to-fuel mass ratio is therefore 4:1. A rocket engine may deliberately operate away from that exact ratio for performance reasons. That design choice does not change the stoichiometric calculation the loading team must understand.
        estimate:
          prompt: Burning methane completely takes two moles of oxygen per mole of methane. Oxygen is 32.0 g per mole and methane is 16.0.
          question: Estimate the mass of oxygen needed for each kilogram of methane burned.
          labels:
            - 2  (moles of oxygen per mole of methane)
            - 32.0 g/mol  (molar mass of oxygen)
            - 16.0 g/mol  (molar mass of methane)
            - 6600 kg  (methane the vehicle carries)
            - 44.0 g/mol  (molar mass of carbon dioxide)
          values: [2, 32, 16, 6600, 44]
          slots: 3
          template: "{0} × {1} ÷ {2}"
          formula: a*b/c
          correct: [0, 1, 2]
          target: 4
          tolerance: 0.3
          units: kg of oxygen per kg of methane
          solution: 2 × 32.0 ÷ 16.0 = 4.0 kilograms of oxygen for each kilogram of methane.
          explanation: The mole ratio is 2 to 1 and the mass ratio is 4 to 1, since oxygen is twice as heavy a molecule. The engine actually runs below this, which is a design choice rather than an arithmetic one.
          relationship: Mass ratio = the mole ratio from the balanced equation × the molar mass of the oxidiser ÷ the molar mass of the fuel.
      - group: ELEC
        task: Say whether the stacks can be pushed harder
        title: What limits the current
        place: Electrolysis Hall
        scene: >
          Sundqvist wants the stacks run 20 per cent above their rated current for the sols that
          remain. Achebe has the cooling loop's capacity written on the board beside the request.
        assumes:
          - the product a cell makes is proportional to the charge it passes
          - the voltage above the minimum leaves the cell as heat
        takeaway: The ceiling on a cell is usually thermal rather than electrochemical.
        format: CHOICE
        question: What sets the highest current these stacks can be run at?
        choices:
          - The heat the cooling loop can carry away, since the wasted voltage rises with the current.
          - Faraday's constant, which fixes how many moles a cell can pass in a sol.
          - The water supply, since a cell can split no more than it is fed.
          - The pressure in the hydrogen collection line, which rises with the production rate.
        answer: The heat the cooling loop can carry away, since the wasted voltage rises with the current.
        why: >-
          Faraday's law puts no ceiling on current at all: more charge is simply more product, in
          exact proportion. What rises with current is the overpotential, because resistance and
          sluggish electrode steps both cost more voltage the harder the cell is driven, and that
          extra voltage becomes heat inside the stack. So the limit is set by what the cooling loop
          can carry away before the cell cooks its own seals. 20 per cent more current can cost
          40 per cent more heat.
        rebuttals:
          - Faraday's constant converts charge into moles and does not cap the charge itself.
          - Water feed is a limit worth checking and this hall has buffer enough for the requested rate.
          - Collection pressure is held by a regulator and does not rise with production.

  # ---------------------------------------------------------------- sol 305
  - title: What the next crew is told
    objective: Say what is known, how well it is known, and what was never established.
    briefing: The fortnight ends, and what survives it is what gets written down.
    stake: >-
      Sol 305, the last sol of this rotation, and the handover file has to be finished this morning.
      The plant is making 14.4 kilograms a sol against a target of 13.8,
      the tank stands at 4.3 tonnes of methane, and the arithmetic now finishes
      the fill 11 sols before the window opens. None of that is the difficult part. Today you
      decide what is left funded and instrumented for the crew who arrive on the next vehicle, write
      the standing order for the water loop, and say honestly what is known about the catalyst and
      what is not. Wells has one instruction about the file: that somebody who was not here can act
      on it without asking anybody who was.
    takeaway: A handover states what is known, how well, and what was never established at all.
    stops:
      - group: GIBBS
        task: Fund what the next crew should inherit.
        title: What to leave running
        place: Plant Control
        scene: Only 2 improvements can be left in place for the crew arriving 300 sols from now. Wells and Demir have four candidates on the final board. The failed catalyst charge is on the floor beside them.
        assumes:
          - the fault that cost this season went undetected because nothing measured it
          - the next crew arrives without anybody from this one
        takeaway: What outlives a crew is what somebody made automatic before they left.
        format: SCIENCETANK
        answerText: Leave the feed-water conductivity alarm and the standing lead/lag changeover rule. Together they detect breakthrough and tell the next crew what action follows.
        why: The best inheritance is a system that turns a known failure mode into an automatic response. The conductivity alarm closes the exact gap that let breakthrough continue unnoticed. The standing order for lead-and-lag column changeover tells the next crew what to do when that signal arrives. Spare thermocouples are useful but the bed already has temperature coverage, and a second sun sensor does not address the failure that consumed the catalyst. Together, alarm plus procedure connect measurement, threshold and action without requiring this crew’s memory.
        proposals:
          - label: A
            text: An alarm on feed-water conductivity, wired to the plant panel rather than to a log.
          - label: B
            text: A written standing order for changing the lead polishing column at breakthrough.
          - label: C
            text: A spare set of thermocouples for the catalyst bed.
          - label: D
            text: A second sun sensor at the far end of the array.
        recommended:
          A: 45
          B: 35
        evidence: |-
          This season lost 38 sols of production to a measurement that was taken every sol,
          logged every sol, and read by nobody. The bed already carries four thermocouples and the
          array has one sun sensor that has never disagreed with the sky.
      - group: SOIL
        task: Set the warning and column-swap thresholds, then replay the historic conductivity rise without changing them.
        title: Write the rule before the trace moves
        place: Water Plant
        scene: Abiola is writing a rule for a crew he will never meet. He loads last season’s conductivity trace into the alarm simulator. Once the replay starts, the thresholds are locked and the values run forward.
        assumes:
          - an exchange bed reaches breakthrough without warning
          - a lead and lag pair lets one bed be changed while the other works
        takeaway: A breakthrough threshold must be written before the rise and early enough to cover the action’s lead time.
        format: TRIGGER
        question: Where should warning and changeover trigger so the fresh column is in service before feed water leaves the accepted range?
        trigger:
          hint: Set both rules before release. The swap takes one update to complete. The accepted-water limit on this normalized replay is 3.0 times the clean baseline.
          direction: rising
          scale:
            min: 1
            max: 6
            step: 0.1
            unit: × clean-baseline conductivity
          limit: 3
          conditions:
            - id: warn
              label: Call the breakthrough warning
              leadHours: 2
            - id: swap
              label: Move lag column into lead service
              leadHours: 1
          stream:
            - step: 0
              value: 1
              hoursLeft: 8
              at: update 0
              update: 1 × clean-baseline conductivity
            - step: 1
              value: 1
              hoursLeft: 7
              at: update 1
              update: 1 × clean-baseline conductivity
            - step: 2
              value: 1.1
              hoursLeft: 6
              at: update 2
              update: 1.1 × clean-baseline conductivity
            - step: 3
              value: 1.3
              hoursLeft: 5
              at: update 3
              update: 1.3 × clean-baseline conductivity
            - step: 4
              value: 1.6
              hoursLeft: 4
              at: update 4
              update: 1.6 × clean-baseline conductivity
            - step: 5
              value: 2
              hoursLeft: 3
              at: update 5
              update: 2 × clean-baseline conductivity
            - step: 6
              value: 2.6
              hoursLeft: 2
              at: update 6
              update: 2.6 × clean-baseline conductivity
            - step: 7
              value: 3.4
              hoursLeft: 1
              at: update 7
              update: 3.4 × clean-baseline conductivity
            - step: 8
              value: 4.5
              hoursLeft: 0
              at: update 8
              update: 4.5 × clean-baseline conductivity
        answerText: Warn near 1.6× clean-baseline conductivity and start the lead/lag swap at 2.0×. With one-update lead time, the fresh bed is online before the replay crosses the 3.0× limit.
        why: The outlet can remain near baseline while the exchange front is still inside the bed, then rise quickly as the front reaches the end. A threshold is useful only if the response can finish before the water leaves specification. Here changeover takes one update. Triggering at twice baseline completes the swap while the next point is still 2.6 times baseline. Waiting for 2.6 completes it after the trace has crossed the 3.0 limit. Precommitting the rule prevents the next crew from turning hindsight into policy.
      - group: KINET
        task: State what is known about the catalyst and what is not
        title: The honest claim about the bed
        place: Catalyst Bay
        scene: Kaur is writing the final catalyst handover. The bed has run for five sols at one set of conditions using water from a fresh polishing column. It is the last charge available on the station.
        assumes:
          - a claim is limited by the conditions it was tested under
          - a poison accumulates over time rather than acting at once
        takeaway: The strength of a claim is set by what was varied while it was being tested.
        format: CHOICE
        question: What is the honest claim to hand over about this charge?
        why: A claim is limited by the conditions under which the evidence was collected. Five sols at one set point on clean water support a narrow statement about that operating window. They do not establish performance at other temperatures or flows. They also do not test resistance to chloride because chloride was intentionally absent after the column change. A useful handover keeps those conditions attached to the claim. The next crew can then tell whether a future observation is a replication of this result or a genuinely new test.
        choices:
          - It matches the sol-270 charge at matched conditions over 5 sols, on polished water.
          - It performs as well as any charge the station has run, on the evidence available.
          - It is unaffected by chloride, since conversion has held since the column was changed.
          - Its behaviour cannot be stated, since five sols is too short a run to say anything.
        answer: It matches the sol-270 charge at matched conditions over 5 sols, on polished water.
        rebuttals:
          - A comparison against every charge the station has run was not made, and two of them were never assayed.
          - Chloride was absent throughout, so the run says nothing about what the charge does when it is present.
          - Five sols supports a narrow claim rather than none at all, and the narrow claim is worth writing down.
# ------------------------------------------------------------- review stops
# Lessons no mission points at. From sol 3 the engine appends a callback to an
# area taught earlier and prefers a "— Review" variant of that lesson, so these
# are the spaced retrieval rather than spares: the same idea, a different case,
# a fortnight after it was first met.
lessons:
  - group: EQUIL
    title: What the loop settles at — Review
    task: Say what each change does to the balance, on a different reactor
    place: Reactor Hall
    scene: >
      A second reactor on the station makes ammonia for the greenhouse, from nitrogen and hydrogen,
      and it also gives out heat and ends with fewer gas molecules. Four changes are proposed to it.
    assumes:
      - a reaction that gives out heat has its balance pushed back by heating
      - fewer gas molecules on one side makes that side favoured by pressure
    takeaway: A rule about balance is about the equation's shape, not about the substance in the pipe.
    format: PROTOCOL
    task: Match each change to what it does to the ammonia at equilibrium.
    scenarios:
      - The vessel is squeezed to twice its working pressure.
      - The vessel is warmed by 60 degrees.
      - Ammonia is condensed out of the product and the rest returned.
      - A better catalyst is fitted at the same conditions.
    choices:
      - 'More ammonia: four gas molecules go in and two come out, so crowding favours the products.'
      - 'Less ammonia: heat is one of the outputs, and supplying more of it pushes the balance back.'
      - 'More ammonia: removing an output leaves the mixture short of what it settles at.'
      - 'No change in amount: the balance is reached sooner and it is the same balance.'
    mapping: [0, 1, 2, 3]
    why: >-
      The shape of the equation decides the answers, which is why a reactor making a completely
      different substance behaves the same way. Count the gas molecules to know what pressure does.
      Ask which side the heat is on to know what temperature does. Ask whether anything taking part
      has been added or removed to know whether the balance moves at all. A catalyst changes the
      time and never the destination.

  - group: KINET
    title: Rate is not yield — Review
    task: Separate speed from ceiling on a different reaction
    place: Catalyst Bay
    scene: >
      The greenhouse reactor is running cold and slow. Its operator proposes 40 degrees more, and
      the same argument that ran through the propellant plant a fortnight ago starts again.
    assumes:
      - heating raises the fraction of collisions that clear the barrier
      - an exothermic reaction's balance is pushed back by heating
    takeaway: One setting moving two quantities in opposite directions is the normal case rather than a special one.
    format: CHOICE
    question: A reaction that gives out heat is run hotter. Which pair of statements is right?
    choices:
      - Faster to its balance, and the balance itself holds less product.
      - Faster to its balance, and the balance holds more product as well.
      - Slower to its balance, and the balance holds less product.
      - Neither the speed nor the balance moves; temperature acts on the catalyst instead.
    answer: Faster to its balance, and the balance itself holds less product.
    why: >-
      Two quantities carry the temperature and they carry it in opposite directions. The rate
      constant rises steeply, since more collisions arrive with enough energy to clear the barrier.
      The equilibrium constant of a reaction that gives out heat falls, since heat behaves as one of
      its products. Every exothermic industrial reaction lives with that trade, and the usual answer
      is a temperature low enough for a decent balance with a catalyst good enough to reach it.
    rebuttals:
      - Rising with temperature is what the rate does, and the balance for this kind of reaction does the opposite.
      - Reactions do not slow when heated; it is the ceiling that comes down.
      - Temperature acts on the molecules rather than on the catalyst, and both the speed and the balance respond.

  - group: PHASE
    title: What freezes before methane condenses — Review
    task: Say what leaves a stream first as it is cooled
    place: Cold End
    scene: >
      A different stream comes off the greenhouse: mostly nitrogen, with water vapour, some carbon
      dioxide and a little argon. It is being cooled to recover the argon as a liquid.
    assumes:
      - each substance leaves the gas phase at its own temperature
      - stronger attractions between molecules mean a higher condensation temperature
    takeaway: Cooling a mixture separates it in the order the attractions between its molecules run.
    format: SEQUENCE
    task: Order the substances by the temperature at which they leave the gas, warmest first.
    cards:
      - Water, which hydrogen-bonds to itself and holds together far above room temperature.
      - Carbon dioxide, which turns solid near 195 K at this pressure.
      - Nitrogen, a small non-polar molecule that condenses near 77 K.
      - Argon, a single atom with the weakest attractions in the stream.
    order: [0, 1, 2, 3]
    why: >-
      The order is the strength of the forces between whole molecules. Water hydrogen-bonds and is
      the first out by a wide margin. Carbon dioxide is held by weaker forces and, at this pressure,
      goes straight from gas to solid. Nitrogen and argon are held only by the fleeting attractions
      between electron clouds, so they need the deepest cold, and argon — one atom, with the least to
      hold onto — is last. A cooling stream is a separation in that order.

  - group: ELEC
    title: Which electrode does which job — Review
    task: Read a different cell the same way
    place: Electrolysis Hall
    scene: >
      The station's oxygen generator splits water in a low-temperature cell rather than a hot one.
      Achebe wants it read the same way as the hot stacks, part by part.
    assumes:
      - reduction happens where electrons are pushed in
      - the electrolyte carries ions and not electrons
    takeaway: The parts of an electrolysis cell do the same jobs whatever the cell is made of.
    format: PROTOCOL
    task: Match each part of this cell to what happens there.
    scenarios:
      - The electrode the supply pushes electrons into.
      - The electrode electrons are drawn out of.
      - The membrane between them.
      - The applied voltage.
    choices:
      - Water gains electrons here and hydrogen comes off.
      - Water loses electrons here and oxygen comes off.
      - It passes hydrogen ions and keeps the two gases apart.
      - It has to exceed the minimum the thermodynamics sets before anything happens at all.
    mapping: [0, 1, 2, 3]
    why: >-
      A cell is a redox reaction with the halves separated, and which half sits where is fixed by
      the direction the electrons are pushed. Electrons in means reduction, so hydrogen appears at
      that electrode in any water-splitting cell, hot or cold. Electrons out means oxidation and
      oxygen. The separator carries one ion and stops the gases mixing. Below the minimum voltage
      nothing happens, and above it the excess is the price of a useful rate.

  - group: GIBBS
    title: What has to be paid for — Review
    task: Sort four station processes into driven and spontaneous
    place: Plant Control
    scene: >
      Demir has four of the station's processes on the board and wants them sorted before the
      quarterly energy plan is written. Two of them run downhill and two have to be pushed.
    assumes:
      - a negative free-energy change means a process can run on its own
      - running on its own says nothing about how fast a process goes
    takeaway: Sorting a station's processes by direction is what says which of them have a bill nobody can design away.
    format: CASEBOOK
    task: Match each process to what it needs from the station.
    scenarios:
      - Methane assembling from carbon dioxide and hydrogen over the bed.
      - Water splitting into hydrogen and oxygen in the stack.
      - Liquid oxygen boiling in a warmed tank.
      - Compressing the atmosphere from 6 millibars to 12 bar.
    choices:
      - Runs downhill and needs a catalyst to be quick about it.
      - Runs uphill and needs the free-energy difference supplied electrically.
      - Runs downhill and is the thing the refrigerator is fighting.
      - Runs uphill and is paid for in shaft work rather than in chemistry.
    mapping: [0, 1, 2, 3]
    why: >-
      Direction and speed are separate questions, and only direction decides whether there is a bill.
      The assembly is downhill and slow, which is what a catalyst is for. Splitting water is the same
      reaction backwards and the bill is the free-energy difference, paid in electricity. Boiling is
      downhill, which is why a tank needs work done on it to stop happening. Compression is uphill
      and physical rather than chemical, and it is paid for at the compressor.

  - group: SOIL
    title: Getting water out of frozen ground — Review
    task: Order the same plant on a poorer load
    place: Water Plant
    scene: >
      A load has come in at three per cent water instead of eight, and the same four operations have
      to run on it. Nakagawa wants the order confirmed before the hopper is sealed.
    assumes:
      - warming ice-bearing soil releases water as vapour at low pressure
      - a leaner load carries the same salts in less water
    takeaway: A poorer load changes the yield of a process and not the order of it.
    format: SEQUENCE
    task: Order the operations for a lean load.
    cards:
      - Weigh the load and sample it, so the water it should give is known in advance.
      - Seal and warm the hopper, holding it below the temperature the salts decompose at.
      - Condense the vapour on the chilled plate and measure what was actually collected.
      - Pass the collected water through the lead polishing column at the usual rate.
    order: [0, 1, 2, 3]
    why: >-
      Sampling comes first on a lean load for a reason that does not apply to a rich one: without a
      figure to expect, a poor yield and a plant fault look identical. Warming has a ceiling as well
      as a floor, since perchlorate salts break down when they are heated hard and release chlorine
      compounds into the vapour. Measuring what was collected against what was expected is the
      comparison that makes the sample worth taking, and the polishing rate does not change.

  - group: EQUIL
    title: Why the hotter pass gave less — Review
    task: Read a table of constants against temperature
    place: Reactor Hall
    scene: >
      Herrera has the equilibrium constant for the methane assembly at four temperatures: 500 K,
      550 K, 600 K and 650 K. It falls by more than a factor of 10 across that range.
    assumes:
      - the equilibrium constant depends on temperature and on nothing else
      - this reaction gives out heat
    takeaway: A table of constants against temperature is the plant's ceiling written out in advance.
    format: CHOICE
    question: What does a constant falling steeply with temperature tell the plant?
    choices:
      - The reaction gives out heat, and yield per pass is best at the lowest workable temperature.
      - The reaction takes in heat, so the ceiling on each pass improves as the bed is pushed hotter.
      - The catalyst is losing activity across that range, which is what the fall records.
      - Pressure has been changing with temperature, and the table mixes two effects.
    answer: The reaction gives out heat, and yield per pass is best at the lowest workable temperature.
    why: >-
      The direction the constant moves in identifies the sign of the heat. Falling with temperature
      means heat behaves as a product, so heating pushes the balance back — that is the definition
      of an exothermic reaction read off a table. The practical consequence is the whole design
      problem of this plant: yield wants a cold bed and rate wants a hot one, and the operating
      temperature is chosen where a good enough catalyst makes a good enough yield reachable.
    rebuttals:
      - A constant that rose with temperature would mean heat was taken in, and this one falls.
      - The constant is a property of the reaction and takes no account of what the catalyst is doing.
      - The constant is defined at a stated temperature and does not depend on the pressure at all.

  - group: PHASE
    title: Reading a blockage from outside the pipe — Review
    task: Read a second blockage from its readings
    place: Cold End
    scene: >
      A line on the oxygen side has slowed over two sols. Cho has four readings from around it, and
      the plant needs to know whether to warm the line out or open it up.
    assumes:
      - a refrigerator at its set point is doing its job
      - carbon dioxide deposits as a solid near 195 K
    takeaway: What a blockage is made of decides whether warming the line clears it.
    format: DIAGNOSIS
    headline: An oxygen line has slowed over two sols with the refrigerator holding temperature.
    task: Which explanation fits every reading?
    readings:
      - { zone: Oxygen line, label: Flow, value: down 60% over 2 sols, status: alarm }
      - { zone: Oxygen line, label: Inlet pressure, value: rising, status: high }
      - { zone: Refrigerator, label: Cold head temperature, value: at set point, status: normal }
      - { zone: Upstream trap, label: Carbon dioxide breakthrough, value: 700 ppm, status: alarm }
      - { zone: Line, label: Vacuum jacket pressure, value: unchanged, status: normal, note: the insulation is intact }
    choices:
      - { label: Carbon dioxide past the trap is freezing in the line, mechanism: 'Solid builds slowly on the wall and takes the flow down with it.' }
      - { label: The refrigerator has lost capacity over the last two sols, mechanism: 'A cold head above its set point cannot condense what it is given.' }
      - { label: A valve on this line has been partly closed by somebody, mechanism: 'A restriction cuts the flow and raises the pressure behind it.' }
      - { label: The vacuum jacket on this line has failed, mechanism: 'Heat leaking in warms the line and changes what it can carry.' }
    answer: Carbon dioxide past the trap is freezing in the line
    why: >-
      Three readings do the ruling out. A cold head at its set point has not lost capacity, and a
      steady jacket pressure is intact insulation. A valve moving would change the flow in the minute
      it moved rather than over two sols. What is left is something accumulating, and the trap's
      breakthrough figure names the material. It matters which material: carbon dioxide sublimes away
      when the line is warmed to 220 K, so this 1 is cleared without opening anything.

# ---------------------------------------------------------------- the rooms
# What is inside each of the six buildings, and what the instrument on the wall
# is reading when the player walks in.
interiors:
  KINET:
    caption: The bed is the only part of this plant that does something nothing else can do.
    standLine: 9 sols of temperature profiles, and a hot spot 30 centimetres further down the bed.
    station:
      kind: panel
      title: Reactor bed profile
      rows:
        - { label: Hot spot position, value: 34 cm, status: alarm }
        - { label: Peak temperature, value: 604 K, status: normal }
        - { label: Pressure drop, value: 0.6 bar, status: normal }
        - { label: Conversion this pass, value: 58 %, status: low }
  EQUIL:
    caption: There is an amount of methane this mixture will settle at, and urgency does not move it.
    standLine: Carbon in against carbon out, for one pass and for the loop.
    station:
      kind: panel
      title: Reactor loop
      rows:
        - { label: Loop pressure, value: 12.0 bar, status: normal }
        - { label: Bed inlet temperature, value: 593 K, status: high }
        - { label: Methane in dry product, value: 96.4 %, status: normal }
        - { label: Carbon monoxide, value: 0.9 %, status: alarm }
  PHASE:
    caption: Everything in the stream stops being a gas somewhere, and not at the same temperature.
    standLine: The cold line, the drier and the trap, in the order the stream meets them.
    station:
      kind: panel
      title: Cold end
      rows:
        - { label: Cold head, value: 114 K, status: normal }
        - { label: Drier outlet water, value: 900 ppm, status: alarm }
        - { label: Methane tank pressure, value: 3.4 bar, status: high }
        - { label: Oxygen boil-off, value: 12.5 kg/sol, status: low }
  ELEC:
    caption: Charge and moles are one measurement in two units, and the gap between them is the cell.
    standLine: 12 cells, 640 amps, and 8 per cent of it making nothing.
    station:
      kind: panel
      title: Water stack
      rows:
        - { label: Stack current, value: 640 A, status: normal }
        - { label: Cell voltage, value: 1.75 V, status: high }
        - { label: Hydrogen collected, value: 6.9 kg/sol, status: normal }
        - { label: Current efficiency, value: 92 %, status: low }
  GIBBS:
    caption: Some of what this station does runs on its own. The rest is paid for out of one array.
    standLine: The sol's ledger, with what the array delivered on the other side of it.
    station:
      kind: panel
      title: Station ledger
      rows:
        - { label: Array delivered, value: 1950 kWh, status: normal }
        - { label: Electrolysis, value: 380 kWh, status: normal }
        - { label: Liquefaction, value: 610 kWh, status: high }
        - { label: Habitat, value: 240 kWh, status: normal }
  SOIL:
    caption: What comes out of this ground is a solution, and everything dissolved in it has an address downstream.
    standLine: 1100 litres in the tank, and a column nobody has changed since sol 190.
    station:
      kind: panel
      title: Water plant
      rows:
        - { label: Holding tank, value: 1100 L, status: normal }
        - { label: Load water content, value: 4.5 %, status: low }

  - group: ELEC
    task: Separate reversible voltage, thermoneutral voltage and operating loss.
    title: Which part of 1.75 volts heats the stack?
    reason: >-
      The stacks run well above the voltage they actually need, and the array is paying the difference
    place: Electrolysis Hall
    scene: |-
      The water stack has three voltage marks. Its reversible potential is near 1.23 V. Its thermoneutral mark is near
      1.48 V, and it runs at 1.75 V. Plant Control asks why the whole gap above 1.23 V is not simply waste heat.
    guide: >-
      Three voltage scales are on the board. About 1.23 V corresponds to the reversible Gibbs free-energy requirement. Around
      1.48 V is the thermoneutral point where the electrical input matches the reaction enthalpy. Real kinetics and resistance
      push the operating voltage higher still. Separate those before deciding what becomes net stack heat.
    background:
    - What 1.23 V means. It is the reversible electrical free-energy requirement under the stated reference conditions. 
      It is not a promise that a practical cell can carry useful current there.
    - What the thermoneutral voltage adds. Splitting liquid water also has an enthalpy requirement. The difference 
      between the reversible and thermoneutral scales can be supplied or removed as heat depending on cell conditions; 
      it is not automatically electrical waste.
    - Where real losses appear. Electrode kinetics and ohmic resistance require extra driving voltage. At an operating 
      voltage above the thermoneutral benchmark, those losses contribute to net heat that the cooling system must 
      reject.
    assumes:
    - the reference reversible voltage is about 1.23 V and thermoneutral voltage about 1.48 V for this simplified 
      water-electrolysis comparison
    - real electrode and resistive losses require additional voltage at useful current
    takeaway: Three voltage marks answer three questions about direction, total energy, and practical cell costs.
    format: CHOICE
    question: At 1.75 V, which interpretation of the cell's energy balance is defensible?
    why: >-
      The reversible 1.23 V scale corresponds to Gibbs free energy. The thermoneutral scale near 1.48 V accounts for the full
      reaction enthalpy under the simplified reference conditions. Real kinetics and resistance then push the operating cell
      to 1.75 V. So it is wrong to label every volt above 1.23 as waste heat. The cell's net heat balance depends on the thermoneutral
      benchmark, while kinetic and ohmic losses are the part that undeniably increase electrical cost and heat rejection.
      The hydrogen molecule itself is not 'higher energy' because the cell was inefficient.
    choices:
    - 1.23 V is the reversible free-energy scale; about 1.48 V is thermoneutral; real losses help push operation to 1.75
      V and add heat.
    - Everything above 1.23 V is stored in the hydrogen, so hydrogen made at 1.75 V carries more chemical energy.
    - Everything above 1.23 V is waste heat, because the reaction's enthalpy and free energy are the same quantity.
    - The extra voltage changes Faraday's constant, so each coulomb makes more hydrogen.
    answer: 1.23 V is the reversible free-energy scale; about 1.48 V is thermoneutral; real losses help push operation 
      to 1.75 V and add heat.
    rebuttals:
    - Hydrogen's chemical state does not depend on the inefficiency of the electrolyser that made it.
    - ΔG and ΔH are not the same; the thermoneutral benchmark is above the reversible potential.
    - Faraday's constant is a charge-per-mole constant and does not increase with cell voltage.

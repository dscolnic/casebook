  - title: The line that stopped passing gas
    objective: Find what closed the cold line, and what the hot run has to do with it.
    briefing: The cold end stopped delivering liquid three hours into the hot run.
    stake: >-
      Sol 293. The cold end stopped delivering liquid 3 hours after the hot run began. The loop
      is still making methane. None of it is reaching a tank. The sol's production is standing
      in a pipe at 12 bar. Cho has a flow that fell away over three hours rather than stopping
      at once. That rules out most of the simple explanations. Herrera is right this sol. The
      hotter bed put more water into the product stream, and the water went somewhere. Today you
      find where the water went. You also work out why the hot pass gave back less methane, and
      follow the water back up the plant to the ground it came from. Nothing else runs while the
      cold end is blocked.
    takeaway: A plant is a chain, and the fastest step decides nothing on its own.
    stops:
      - group: PHASE
        task: Find the one explanation the quiet readings allow
        title: Reading a blockage from outside the pipe
        place: Cold End
        scene: >
          Five readings are up on the cold end panel. Two are alarming and three are entirely
          ordinary. Cho says the ordinary ones are the reason most of the obvious answers do not
          survive.
        guide: >-
          Cho's point is the one worth taking. Two readings are shouting and three are
          perfectly ordinary, and it is the ordinary three that will do the work. A
          reading that has not moved is a positive result — it rules out every
          explanation that would have moved it. So take each candidate in turn and ask
          how many of the five it actually fits. And look at the shape of the flow trace,
          not only its value. A flow that dies away over three hours is not telling the
          same story as one that stops.
        background:
          - >-
              Why water is the suspect and not the methane. The cold line falls from about
              10 degrees to 115 kelvin. Water turns solid at 273 K, right at the top of that
              run. Methane does not become liquid until about 112 K, at the very bottom. So
              water that gets past the drier has hundreds of degrees of pipe to freeze in.
              All of it comes before the methane end.
          - >-
              Why the unremarkable readings decide it. The alarming reading draws the eye,
              and it usually fits several explanations at once, so it rarely settles
              anything. The readings that separate candidates are the ones an explanation
              says should have moved and which have not. A normal value is a positive result
              against every mechanism that would have disturbed it.
          - >-
              How to work the four without fooling yourself. Take each one and predict the
              panel it implies before you look again — which readings it drives, which way,
              and roughly how far. Then compare. Several will fit part of the panel,
              deliberately, and a partial fit is exactly what a confident wrong answer feels
              like from inside. When two are left, find the reading their predictions
              disagree on.
        takesAsRead:
          - "Stoichiometry as a feed rate: turning a production target into kilograms in"
        assumes:
          - a refrigerator that has reached its set point is doing its job
          - water freezes at a far higher temperature than methane condenses at
        takeaway: The readings that are normal are what rule an explanation out.
        format: DIAGNOSIS
        headline: The cold line stopped passing gas over three hours, with the refrigerator at temperature.
        task: Which explanation fits every reading, not the loudest one?
        readings:
          - { zone: Cold line, label: Flow, value: fell to 0 over 3 h, status: alarm }
          - { zone: Cold head, label: Temperature, value: 114 K, status: normal, note: at its set point }
          - { zone: Drier outlet, label: Water content, value: 900 ppm, status: alarm }
          - { zone: Vacuum jacket, label: Pressure, value: steady, status: normal, note: rules out a jacket leak }
          - { zone: Upstream, label: Loop pressure, value: rising, status: high }
        choices:
          - { label: Water past the drier is freezing in the exchanger, mechanism: 'The line cools through 273 K long before it gets anywhere near methane.' }
          - { label: The refrigerator has lost capacity since the hot run began, mechanism: 'A cold head short of temperature passes gas where it should deliver liquid.' }
          - { label: The vacuum jacket has failed, mechanism: 'Heat leaking in warms the line and stops it condensing anything.' }
          - { label: A valve on the cold line was left shut, mechanism: 'A closed valve blocks the flow with everything else reading normally.' }
        answer: Water past the drier is freezing in the exchanger
        why: >-
          The quiet readings do the work. The cold head is sitting at its set point, the
          temperature it is asked to hold. So the refrigerator has not lost capacity. Jacket
          pressure is steady, so the jacket has not failed. That leaves something blocking the line.
          The shape of the flow trace says which kind. A shut valve stops the flow in a second. A
          solid builds up over hours and takes the flow down with it. The drier outlet at 900 ppm —
          parts per million — names the material. Rising pressure upstream of a growing plug
          finishes it.
      - group: EQUIL
        task: Separate the thermodynamic temperature effect from the flow change in the hot run.
        title: Why the hotter pass gave less
        concept: The equilibrium constant, and that temperature is what moves it
        place: Reactor Hall
        scene: The hot run’s assay is on Herrera’s desk. Conversion per pass fell from 71% to 64% while throughput rose. He wants the reason written down before anyone argues for another temperature increase.
        guide: >-
          Herrera wants this settled with a number instead of an argument, and the assay
          gives him one. The reaction quotient Q is built exactly like the equilibrium
          constant K. Each gas's partial pressure goes in raised to its coefficient in the
          balanced equation, products over reactants. The difference is that Q is worked out
          wherever the mixture happens to be right now. Compare Q with K and you have the
          direction. Two tiles are the raw pressures with no exponent applied, so read the
          labels.
        background:
          - >-
              What Q is, and what it is not. Q is built exactly like K, but it is worked out
              wherever the mixture happens to be. So it describes the present, not a fixed
              property of the reaction. Comparing the two tells you which way the reaction
              still has to go. It tells you nothing about how fast it will get there. That is a
              different question with a different answer.
          - >-
              Why the exponents are not decoration. Every partial pressure goes in raised to
              its coefficient from the balanced equation, and hydrogen's is four. Leave that
              out and Q changes by two orders of magnitude here. That is the difference between
              a mixture already past its ceiling and one nowhere near it.
          - >-
              Why the hot run had two things wrong with it. Temperature moved the ceiling, and
              the higher throughput moved the contact time, and one assay cannot separate them.
              What it can settle is the ceiling: K at the hotter temperature is smaller, and
              this outlet mixture is already above it.
        assumes:
          - the equilibrium constant is fixed at a given temperature
          - the Sabatier reaction gives out heat
        takeaway: Heating an exothermic reaction lowers its equilibrium product yield, while the observed reactor conversion can also depend on kinetics and residence time.
        format: BALLPARK
        question: Work out the reaction quotient Q at the hot run's outlet, and say which way that mixture still has to go.
        answerText: Q ≈ 282. K is 192 at the hot temperature and about 1,350 at the cooler one, so the outlet is past the hot ceiling and would run backwards there, while the same mixture is well short of the cooler ceiling.
        why: "The Sabatier reaction is CO₂ + 4H₂ → CH₄ + 2H₂O, so Q = p(CH₄) × p(H₂O)² ÷ (p(CO₂) × p(H₂)⁴). At the hot outlet that is 0.42 × 0.7056 ÷ (0.10 × 0.0105) ≈ 282. K is 192 at 573 K and about 1,350 at 533 K. Smaller when hotter, because this reaction gives off heat. So at the hot setting the outlet mixture sits above the ceiling. Q is bigger than K, and the reactor would have to run backwards to reach balance. At the cooler setting it is comfortably below. That settles the thermodynamic half of Herrera's question, and not the kinetic half. The higher throughput also cut the contact time. Only a flow test at fixed temperature and pressure can separate those two."
        estimate:
          prompt: "Outlet partial pressures from the hot-run assay, in bar: methane 0.42, water vapour 0.84, carbon dioxide 0.10, hydrogen 0.32. The balanced reaction is CO₂ + 4H₂ → CH₄ + 2H₂O."
          question: Choose the methane pressure, the squared water pressure, the carbon dioxide pressure and the fourth power of the hydrogen pressure.
          labels:
            - 0.42  (p(CH₄), methane at the outlet)
            - 0.7056  (p(H₂O)², water vapour squared)
            - 0.10  (p(CO₂), carbon dioxide at the outlet)
            - 0.0105  (p(H₂)⁴, hydrogen to the fourth)
            - 0.84  (p(H₂O), water vapour with no exponent applied)
            - 0.32  (p(H₂), hydrogen with no exponent applied)
          values: [0.42, 0.7056, 0.10, 0.0105, 0.84, 0.32]
          slots: 4
          template: '{0} × {1} ÷ ({2} × {3})'
          formula: a*b/(c*d)
          correct: [0, 1, 2, 3]
          target: 282.24
          tolerance: 25
          units: bar⁻²
          solution: 0.42 × 0.7056 ÷ (0.10 × 0.0105) ≈ 282, against K = 190 hot and about 1,050 cool.
          explanation: Q compared with K says which way the mixture has to go — past the ceiling at the hot setting, short of it at the cool one.
          givens:
            - outlet partial pressures 0.42, 0.84, 0.10 and 0.32 bar
            - K = 190 at 573 K and about 1,050 at 533 K
          relationship: The reaction quotient Q = p(CH₄) × p(H₂O)² ÷ (p(CO₂) × p(H₂)⁴), compared with the equilibrium constant K, gives the direction the reaction still has to run.
      - group: SOIL
        task: Order the steps the water plant runs in.
        title: Getting water out of frozen ground
        place: Water Plant
        scene: Femi Abiola, the regolith and water lead, has the plant’s four steps written on cards. The morning crew disagreed about where the extra water appeared. He wants the cards restored to process order.
        guide: >-
          Abiola's four cards will all happen; the only question is what each one needs
          from the step above it, so ask that of each. Ice that melts loose in the bucket
          runs straight into the ground. Vapour let go outside a sealed vessel joins an
          atmosphere at six millibars and is gone. And an ion-exchange bed — the column
          that swaps unwanted ions out of the water and onto a resin — can only be fed
          liquid. Put them out of order and each step finds nothing to work on.
        background:
          - >-
              Why the water leaves as vapour and not as liquid. At six millibars — under a
              hundredth of the pressure at sea level on Earth — water has almost no liquid
              range at all. Warm ice-bearing ground in the open and the ice goes straight to
              vapour and disperses. That is why the hopper is sealed before it is warmed. The
              same warming then has nowhere to send the vapour except onto the chilled plate.
          - >-
              Why the column comes last and not first. The polishing column swaps unwanted
              ions — chloride, here — out of the water and onto a resin. What it has is a fixed
              capacity, not a percentage. Feed it the whole soil load instead of the water that
              load gave up, and it fills in a sol. It sits at the outlet of the holding tank
              because that is where the volume is smallest and already cleanest.
          - >-
              Why the order is graded whole. A sequence is a claim about what depends on what:
              each step is here because the one before it has already happened. One swapped
              pair breaks that claim wherever it sits, so partial credit would be credit for a
              plant that does not run.
        takesAsRead:
          - Intermolecular forces, and why they set a boiling point
        assumes:
          - warming ice-bearing soil releases water as vapour at low pressure
          - dissolved salts stay behind when water evaporates
        takeaway: Every step in the water plant fixes something the step after it cannot survive.
        format: SEQUENCE
        why: The order is set by what each step needs from the one above it. Ice that melts in the bucket runs into the ground and is lost, so the load stays frozen until it is inside something sealed. Vapour has to be caught where it is released, or it joins an atmosphere at six millibars and is gone. Condensing gives liquid water, and only liquid water can be run through an ion-exchange bed. Take the steps out of order and each one finds nothing to work on.
        cards:
          - Cut ice-bearing ground and keep the load below its melting point on the way in.
          - Warm a sealed hopper so the water leaves the soil as vapour with nowhere else to go.
          - Condense that vapour on a chilled plate and drain it into a holding tank.
          - Strip chloride out on the polishing column at the outlet of the holding tank.
        order: [0, 1, 2, 3]
  # ---------------------------------------------------------------- sol 294
  - title: The loop that pays for itself
    objective: Size the feed the plant needs, and find where the current is going.
    briefing: With the cold line clear, the question is whether the feed can keep up with the bed.
    stake: >-
      Sol 294. The exchanger was warmed out overnight. The cold end took liquid again at six
      hours. That leaves the plant with the question it had two sols ago, and better information
      about it. Herrera's loop can convert two thirds of a pass and recycle the rest. What it
      cannot do is make methane out of carbon dioxide it has not been given. It cannot make it
      out of hydrogen the stacks have not made either. Today you size the feed the bed needs at
      the new rate. You also ask why Achebe's stacks return less hydrogen than the current says
      they should, and look at what the water carries with it. Abiola has been asking for a
      second polishing column since sol 240. He has not been given one.
    takeaway: A plant is limited by whichever feed runs out first, and it will not be the same one every sol.
    stops:
      - group: EQUIL
        task: Size the carbon dioxide the bed needs each sol
        title: How much gas the bed has to be fed
        concept: "Stoichiometry as a feed rate: turning a production target into kilograms in"
        place: Reactor Hall
        scene: |-
          The plant has to average 13.8 kilograms of methane a sol from here to the window. Herrera wants the carbon dioxide that implies before the intake compressors are asked for anything.
        guide: >-
          Herrera has a production target and wants the feed it implies. This is
          stoichiometry, which is mole bookkeeping. The balanced equation does the work.
          One carbon atom leaves each carbon dioxide and arrives in one methane. So by
          moles the two go one for one. By mass they do not, because a carbon dioxide
          molecule is heavier than a methane one. Five numbers are on the board and two
          belong to other parts of the equation. Ask of each whether carbon bookkeeping
          needs it.
        background:
          - >-
              What a mole is doing in this sum. A mole is a fixed count of molecules. Think of
              the chemist's dozen, only very much larger. Balanced equations are written in
              moles because reactions happen molecule by molecule. So the equation says one
              carbon dioxide gives one methane, whether you are handling grams or tonnes.
          - >-
              Why the mass ratio is not one to one. Molar mass is what one mole of a substance
              weighs: 44 grams for carbon dioxide, 16 for methane. Same count of molecules,
              very different weight, because each carbon dioxide carries two oxygen atoms that
              the methane does not keep. So equal moles come out as 44 kilograms in for every
              16 kilograms out.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label catches a unit that does not
              match. It also catches a quantity that belongs to a different part of the
              problem. Do it before you place the tile. That habit is the whole point of this
              format.
        assumes:
          - one mole of carbon dioxide yields one mole of methane in this reaction
          - a molar mass converts moles to kilograms
        takeaway: Stoichiometry turns a production target into a feed rate, and the feed rate is what the intake has to meet.
        format: BALLPARK
        question: Estimate the carbon dioxide the reactor must be fed each sol.
        why: Stoichiometry is mole bookkeeping. The balanced equation sends one carbon atom out of each carbon-dioxide molecule and into one methane molecule. So by moles the two go one for one. Mass needs one more step. A mole of carbon dioxide weighs 44 grams; a mole of methane only 16. Every kilogram of methane therefore needs 44/16 kilograms of carbon dioxide in. The intake compressors gather that out of a very thin atmosphere. The work they do scales straight off the production target the plant has promised.
        estimate:
          prompt: The plant must average 13.8 kg of methane a sol. One mole of carbon dioxide gives one mole of methane.
          question: Estimate the carbon dioxide the reactor must be fed each sol.
          labels:
            - 13.8 kg  (methane needed each sol)
            - 44.0 g/mol  (molar mass of carbon dioxide)
            - 16.0 g/mol  (molar mass of methane)
            - 4  (moles of hydrogen per mole of carbon dioxide)
            - 2  (moles of water made per mole of methane)
          values: [13.8, 44, 16, 4, 2]
          slots: 3
          template: "{0} × {1} ÷ {2}"
          formula: a*b/c
          correct: [0, 1, 2]
          target: 37.9
          tolerance: 2
          units: kg per sol
          solution: 13.8 kg × 44.0 ÷ 16.0 = 37.9 kg of carbon dioxide a sol.
          explanation: Equal moles of the two gases, so the mass ratio is the ratio of the molar masses. The hydrogen and the water are elsewhere in the ledger.
          relationship: Feed mass = product mass × molar mass of the feed ÷ molar mass of the product, since CO₂ + 4H₂ → CH₄ + 2H₂O consumes 1 carbon dioxide for each methane.
      - group: ELEC
        task: Close the hydrogen-equivalent charge ledger and identify the part of the current that did not become collected hydrogen.
        title: Where 8% of the charge went
        concept: "Current efficiency: the gap between charge passed and product collected"
        place: Electrolysis Hall
        scene: The cell held 640 amps for a full sol. Faraday’s law predicts about 594 grams of hydrogen, but the separator collected only 546. Achebe has already checked the collection-line pressure and the hydrogen inventory downstream.
        guide: >-
          Achebe has done the sensible checks already, so start where she left off.
          Faraday's law turns charge into a mass of product. 640 amps held for a sol should
          give about 594 grams of hydrogen. The separator collected 546. She has cleared the
          collection line and the inventory downstream, so nothing is hiding in a pipe. Read
          every stream on the ledger. Then count only what genuinely belongs in it.
        background:
          - >-
              What Faraday's law claims. Every electron that crosses the cell makes a fixed
              amount of hydrogen — two electrons for each molecule of H₂. So the predicted
              mass is arithmetic on the charge. It is an upper bound rather than a forecast.
              It assumes every single electron did the job it was sent to do.
          - >-
              Why the gap is a measurement and not an error. Electrons that did something
              else still crossed, and still counted as charge. Some drove a side reaction at
              the electrode. Some ran as a shuttle current, carrying charge back and forth to
              no purpose. Some made hydrogen that recombined inside the cell before it ever
              reached the separator. What is left over measures how much of the current did
              useful work. That fraction has a name: current efficiency.
          - >-
              Why checking the line first was right. A leak would explain the whole gap. So
              would hydrogen standing in the collection line that was not standing there
              yesterday. Neither says anything about the cell. Ruling both out is what turns an
              awkward discrepancy into evidence about the electrochemistry.
        assumes:
          - Faraday’s law converts charge into a theoretical amount of product
          - current efficiency is collected product divided by theoretical product from charge
        takeaway: Faraday’s law fixes the theoretical product from charge; current efficiency measures how much of that charge reached the intended reaction.
        format: BALANCE
        question: What term closes the charge ledger, and what does that term measure about the cell?
        balance:
          total:
            amount: 594
            unit: g H₂-equivalent
            label: Product allowed by measured charge
          streams:
            - id: collected
              label: Hydrogen collected at the separator
              value: 546
              display: 546 g
            - id: line_inventory
              label: Change in hydrogen held in the collection line
              value: 0
              display: No change
            - id: measured_vent
              label: Measured hydrogen vent loss
              value: 0
              display: No loss detected
            - id: nonproductive
              label: Charge not recovered as collected H₂
              value: 48
              display: 48 g-equivalent
              hidden: true
          tolerance: 3
          hint: All rows are written in hydrogen-equivalent grams. Count the measured product and any real downstream storage or loss before deciding what must be assigned to the cell itself.
        answerText: The ledger is short by about 48 g of hydrogen-equivalent charge. The cell collected 546/594 ≈ 92% of the Faraday-law maximum, so its current efficiency is about 92%.
        why: Current times time gives charge. Faraday’s law turns that charge into a mass of product, because each electron makes a fixed amount of hydrogen. This run's charge is worth about 594 grams. Only 546 were collected. The line inventory and the measured vent loss both sat still, so the missing 48 grams are not hydrogen hiding downstream. They are charge that crossed the cell and did something other than make collectable hydrogen. 546/594 is about 92 per cent. That ratio is the cell's current efficiency for the run.
      - group: SOIL
        task: Match each dissolved species to what it does downstream.
        title: What comes with the water
        place: Water Plant
        scene: |-
          The holding tank's analysis is on Abiola's bench: four dissolved species, none of them water. Each one has somewhere downstream that it matters, and the plant has one polishing column between them and everything else.
        guide: >-
          Abiola has four dissolved species on the bench and one polishing column to
          spend. So for each one, ask where it ends up and what it touches when it gets
          there. A catalyst's nickel surface? The hot faces inside a cell, where something
          can come back out of solution as scale? A packed bed it can physically clog? Or
          somewhere the plant does not much mind, because not every impurity is equally
          dangerous.
        background:
          - >-
              What dissolving actually does. A salt in water does not sit there as a lump. It
              comes apart into ions — charged pieces that move about independently — and
              perchlorate salts give up chloride that way. This is why a filter cannot catch
              them: there is nothing left to catch, only ions the size of single atoms
              travelling with the water.
          - >-
              Why chloride is the one that ends a catalyst. The nickel works because gas
              molecules land on its surface, react, and leave again. Chloride lands and does
              not leave — it binds to those same sites and holds them. Every site it takes is
              gone for good. So a slow chloride feed is a slow, permanent loss of catalyst,
              not a fault that can be cleaned out later.
          - >-
              Why the harmless one is harmless. Dissolved carbon dioxide makes the water
              slightly acidic and then arrives at a reactor whose entire job is turning
              carbon dioxide into methane. It is already on the feed list. Worth noticing,
              because the instinct to remove everything measurable spends a polishing
              column's fixed capacity on something the plant wanted anyway.
        takesAsRead:
          - Intermolecular forces, and why they set a boiling point
        assumes:
          - salts dissolve into ions in water
          - an electrolysis cell and a catalyst bed both have surfaces that can be fouled
        takeaway: Water from the ground is a solution, and every solute has an address downstream.
        format: PROTOCOL
        why: A dissolved species matters because of the surface it reaches. Chloride is the dangerous one here: it sticks to the nickel of the catalyst and takes those sites out of use for good. Sulphate comes back out of solution on hot surfaces as scale, and the cell's warm faces are where it finds them. Fine particles do no chemistry at all — they pack into the drier and throttle it a little more each sol. Dissolved carbon dioxide is a non-problem, because carbon dioxide is what the plant is trying to react anyway. So the polishing train is designed around consequences, not around treating every impurity alike.
        scenarios:
          - Chloride ion, from dissolved perchlorate salt.
          - Sulphate ion, at four grams a litre.
          - Suspended fines, too small for the filter.
          - Dissolved carbon dioxide, from the condenser headspace.
        choices:
          - Binds to the nickel surface of the catalyst and takes those sites out of use.
          - Comes out of solution as scale on the hot faces of the electrolysis cell.
          - Packs into the drier and raises the pressure drop across it sol by sol.
          - Adds acidity and nothing else; the reactor is fed the same gas anyway.
        mapping: [0, 1, 2, 3]
  # ---------------------------------------------------------------- sol 295
      - group: EQUIL
        task: Hold the reactor while the feed varies.
        title: Three hundred degrees, while the feed wanders
        concept: "The equilibrium constant, and that temperature is what moves it"
        place: Reactor Hall
        scene: The Sabatier bed has to sit at its working temperature while the electrolysis stacks feed it. The stacks follow the array, the array follows the sun, and the bed heats itself whenever it is making methane.
        guide: >-
          You are holding the bed at its working temperature, inside the band on the panel.
          Watch what the band does. It narrows as the sol goes on, because the tank has a
          filling rate to make. A bed wandering ten degrees is not making it. Your control is
          the cooling-loop valve. One thing to carry in with you: the bed heats itself
          whenever it is working. This is not a temperature that stays put on its own.
        background:
          - >-
              Why the bed heats itself. Assembling methane gives off heat, so a bed that is
              working is a bed that is warming. And a bed that warms converts less on each
              pass, because the ceiling falls as the temperature rises. The reaction and the
              cooling are in a loop with each other. Neither settles without the other.
          - >-
              Why the feed will not sit still. The stacks run on array power, the array follows
              the sun and the dust, and more hydrogen arriving means more reaction, which means
              more heat. It arrives as a rate rather than as a step, which is what makes
              chasing the reading a losing game.
          - >-
              What holding a self-heating process asks of you. A disturbance that keeps pushing
              needs the valve set to a new position, not nudged and watched. Nudge, wait, nudge
              again, and the bed is always a few minutes behind the feed. By the time the
              reading has moved far enough to convince you, the heat that moved it is already
              in the metal. Answer the feed, not the reading.
        assumes:
          - a reaction that gives out heat warms what it is running in
        takeaway: A process that heats itself is held by whoever is watching the cooling.
        format: HOLD
        question: Hold the bed at its working temperature through the sol.
        answerText: Inside the band for most of the sol, with the cooling valve set to answer each change in feed rather than nudged after the bed has already climbed.
        why: >-
          The Sabatier reaction gives off heat, so the bed warms whenever it is working. A warmer
          bed has a lower ceiling. That is why this plant treats temperature as a production
          setting rather than a comfort one. Every disturbance here is a rate, not a step. More
          hydrogen from the stacks does not lift the bed five degrees and stop. It raises the
          reaction rate, which raises the heat coming out. That goes on lifting the bed until the
          cooling is set to carry it away. So the valve is moved to a new position and left there.
          The band narrows for a reason. The tank has a filling schedule and the vehicle has a
          launch window. A bed wandering ten degrees either way is not making the rate the plan was
          built on. By late sol there is no margin left to make it up in.
        hold:
          quantity: Reactor bed temperature
          unit: °C
          control: Cooling loop valve
          hold: 300
          band: 0.4
          narrowTo: 0.2
          duration: 45
          direction: lower
          authority: 0.1
          pass: 0.8
          hint: Each change in feed keeps pushing. Set the valve to answer the feed, not the reading.
          disturbances:
            - { label: Stacks step up as the array clears dust, at: 4, amount: 0.03 }
            - { label: Recycle loop returns cooler gas, at: 20, amount: -0.05 }
            - { label: Second stack comes on line, at: 38, amount: 0.045 }
          commit: Report the sol
  - title: The ceiling on running hotter
    objective: Put a number on how far the temperature argument can be taken.
    briefing: Sundqvist has asked for another 40 degrees, and this time the question has an arithmetic answer.
    stake: >-
      Sol 295. Sundqvist has asked for another 40 degrees on the bed, 4 sols after the first 40
      worked. Kaur will not sign for it. The last charge she pulled had grown its metal
      particles. A bed that has sintered does not come back. Demir wants to know where the heat
      is coming from. The reactor gives out heat, and the habitat is short of it. Today you put
      an arithmetic ceiling on the temperature argument. You also decide what a catalyst can and
      cannot change about it, and follow the product stream into the cold end. The number you
      work out settles a fortnight of argument, either way. Marion Wells, who commands the
      station, has said she will act on it the same evening.
    takeaway: An argument that has an arithmetic answer should not be settled by seniority.
    stops:
      - group: GIBBS
        task: Work out the free-energy change at the bed's temperature
        title: The temperature the reaction stops wanting to run
        concept: The temperature at which a spontaneous reaction stops being one
        place: Plant Control
        scene: Demir has thermodynamic data for the Sabatier reaction on the desk. The sheet lists its enthalpy and entropy changes per mole of methane. He wants ΔG evaluated at the present bed temperature.
        guide: >-
          Demir has the data sheet and wants ΔG at the bed's own temperature. So this is
          ΔG = ΔH − TΔS with real numbers in it. Both terms here happen to be negative, and
          they pull against each other once the temperature multiplies the second one. That
          is the interesting part. As the bed gets hotter the second term grows, so somewhere
          up the scale the whole thing changes sign. Five numbers are on the board and two
          belong to other calculations. Ask of each whether this one needs it.
        background:
          - >-
              Why both terms are negative here, and why that matters. Making methane gives off
              heat, so ΔH is negative and the reaction is favoured on those grounds. But five
              gas molecules go in and three come out. The mixture ends up less spread out than
              it started, so ΔS is negative too. Subtracting a negative TΔS adds a positive
              amount. Entropy is working against this reaction, not for it.
          - >-
              Why the temperature decides which term wins. ΔH does not care how hot the bed is.
              TΔS does, because T is a multiplier sitting right on it. So heating the bed grows
              the term that opposes the reaction while leaving the term that favours it alone.
              Push far enough and ΔG crosses zero — with these tabulated numbers, near 720 K.
              Above that the reaction no longer runs on its own at all.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how you catch a unit that
              does not match, or a quantity belonging to a different problem, before you place
              it. That habit is the whole point of this format.
        assumes:
          - free energy combines the heat of a reaction with its entropy change
          - a negative free-energy change means the reaction can run on its own
        takeaway: With fixed tabulated ΔH and ΔS, ΔG = ΔH − TΔS predicts the temperature where spontaneity changes sign.
        format: BALLPARK
        question: Estimate the free-energy change for the reaction at the bed's temperature.
        why: The two terms pull against each other. Making methane gives off heat, so ΔH is negative and that favours the products. But it also turns five gas molecules into three. So ΔS is negative as well, and a negative ΔS works against the reaction once the temperature multiplies it. ΔH does not change with temperature; TΔS does. So the hotter the bed, the more the opposing term weighs. At 593 K, ΔG = −123,600 − (593 × −172) = −21,600 J per mole. Still comfortably negative. The same tabulated numbers cross zero near 720 K. Real values drift with temperature, so treat 720 K as this course's threshold rather than an exact plant limit.
        estimate:
          prompt: For this reaction the enthalpy change is −123,600 J per mole and the entropy change is −172 J per mole per kelvin. The bed is at 593 K.
          question: Estimate the free-energy change for the reaction at the bed's temperature.
          labels:
            - −123600 J/mol  (enthalpy change)
            - 593 K  (bed temperature)
            - −172 J/mol/K  (entropy change)
            - 8.314 J/mol/K  (the gas constant)
            - 298 K  (room temperature)

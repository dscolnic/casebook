  - group: SOIL
    task: Say what a full polishing column does
    title: The bed that warns only at the outlet
    reason: >-
      The polishing column protects everything downstream, and no gauge on it says when it is full
    place: Water Plant
    scene: |-
      The polishing column is a packed bed of ion-exchange resin with a fixed number of sites in it. Abiola has been asked how the plant would know the column was full, and he says the honest answer is that it would not.
    guide: >-
      Abiola's honest answer is worth sitting with: the plant would not know. The column is a packed bed with a fixed number
      of exchange sites in it. Water goes in one end and out the other. Picture what happens to those sites as sol after sol
      of water passes through. Which ones fill first? Then ask of each option whether it fits a bed that fills that way.
    background:
    - >-
      What ion exchange is doing. The resin is covered in sites, and each site holds a harmless ion. It will swap that ion
      for one you want gone — chloride, here. Each site does this once. There is no regenerating it in service and no partial
      credit. A site is either free or taken.
    - >-
      Why the bed fills from the inlet and not evenly. The first water through meets the first centimetre of resin and gives
      up its chloride there. Only when those sites are taken does the next water travel further to find a free one. So the
      used region grows from the inlet downstream, as a front, with clean resin still waiting beyond it.
    - >-
      Why capacity is not a percentage, and why that is the trap. A filter that removes 95 per cent removes 95 per cent all
      its life. A capacity bed removes nearly everything, and then removes nearly nothing. There is no gradual warning between
      those two states. That is why Abiola wants an alarm on the outlet rather than a maintenance date on a calendar.
    takesAsRead:
    - Rate constants, and how steeply they climb with temperature
    - "Stoichiometry as a feed rate: turning a production target into kilograms in"
    assumes:
    - an ion-exchange bed swaps unwanted ions for harmless ones
    - a packed bed holds a finite number of ions
    takeaway: A bed with a capacity has two states, and there is no announcement between them.
    format: CHOICE
    question: What happens at the outlet as the exchange front reaches the end of the bed?
    answerText: The outlet stays low until the loading front approaches it, then rises toward the inlet concentration. 
      That breakthrough curve is the warning the plant must monitor.
    why: An ion-exchange bed holds a fixed number of sites, and they fill from the inlet end. So a loading front creeps 
      down the resin, with fresh sites ahead of it and full ones behind. While there is fresh resin left, the outlet 
      stays clean. Then the front reaches the end and the outlet climbs fast toward the inlet concentration. That climb 
      is called breakthrough. It is not instant, and its exact shape depends on flow, but it is a cliff rather than a 
      slope. So the only warning is at the outlet — and only if somebody reads it often enough to act.
    choices:
    - It rises toward the inlet concentration as the exchange front reaches the outlet.
    - It rises steadily from the day fresh resin is installed because every captured ion weakens the whole bed equally.
    - It becomes cleaner just before exhaustion because a heavily loaded resin binds incoming ions more strongly.
    - It remains at a fixed fraction of the inlet concentration throughout the bed’s life.
    answer: It rises toward the inlet concentration as the exchange front reaches the outlet.
    rebuttals:
    - Most of the bed can load while the outlet stays low; the rise comes when the loading front approaches the outlet.
    - A loaded site has less capacity for the next ion, not more.
    - A capacity-limited bed does not remove one fixed percentage for its whole life.

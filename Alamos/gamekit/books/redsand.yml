      - group: GIBBS
        task: Work the load board while the power rule changes.
        title: What the plant is protecting now
        concept: "An energy ledger: what a station spends and what it collects"
        place: Plant Control
        scene: Loads come up on the board through the sol. The station runs to one power rule at a time. Demir changes it as the sol does: after the dust thickens, after the tank pressure rises, after the window gets closer.
        guide: >-
          Keep the loads the current rule protects, and let the rest drop. One thing to know
          before you start. The rule at the top of the board changes during the sol, and nobody
          announces it. What gets scored is the loads either side of a change. Those are the
          only ones that show whether you are reading the rule, or working to the last one you
          saw.
        background:
          - >-
              Why the rule changes at all. On a clear sol the plant protects production, because the
              tank has a schedule to meet. In a storm it protects the crew and the propellant
              already made, because neither can be remade. Close to the window it protects whatever
              the launch depends on. Three situations, three lists, and the same eight loads on the
              board.
          - >-
              Why a load can be right under one rule and wrong under the next. The stacks are
              production, so they are protected on a clear sol and dropped in a storm. Tank
              pressurisation counts twice. It serves the launch, and it protects what cannot be
              remade, so it survives two rules of the three. Nothing on this board is simply
              important or unimportant. It depends what is being protected.
          - >-
              What the changeover actually costs. Picture a desk still running the production rule
              through the first hour of a storm. It keeps the stacks warm and lets the liquefier go
              off. The propellant that boils away took forty sols of array output to make, and it
              has to be made again from the beginning. The instruction was withdrawn; the cost is
              paid by whoever was still working to it.
        assumes:
          - a station with limited power keeps some loads and drops others
        takeaway: The cost of a withdrawn instruction is paid by whoever is still working to it.
        format: SPOT
        question: Protect what the current rule protects, and keep watching the rule.
        answerText: Read the rule rather than the load list. Every change leaves a few minutes in which the old rule still looks like the right one.
        why: >-
          Three rules run across the sol, and each protects a different part of the board.
          Production first. Then whatever cannot be remade. Then whatever the launch depends on. A
          load can answer two rules at once, which is what makes a switch cost something real. So
          the panel scores the window either side of each change. A load protected by no rule at
          all is dropped correctly by somebody who has read nothing. It proves nothing. The station's own version of this is the first hour of a dust storm. The rule
          has moved to protecting what cannot be remade. A desk still running the production rule
          keeps the stacks warm and lets the liquefier go off. That boils away propellant which
          took forty sols of array output to make.
        spot:
          duration: 40
          switchEvery: 12
          pass: 0.75
          hint: The power rule is at the top of the board, and it changes without an announcement.
          targets:

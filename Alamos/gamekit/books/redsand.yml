# redsand.yml — Red Sand: the propellant plant at Arcadia Rise.
#
# AP Chemistry, taught through the back half of the course that The Contaminated
# City leaves alone: kinetics, equilibrium, electrochemistry, entropy and free
# energy, phase behaviour and intermolecular forces, and the solution chemistry
# of a brine nobody on Earth has to drink.
#
# The place is a propellant plant on Arcadia Planitia making methane and oxygen
# out of the atmosphere and the ground, against a transfer window that does not
# move. Format is tools/BOOK_TEMPLATE.md; import with
#
#   node tools/import-book.mjs books/redsand.yml redsand --verify

theme:
  id: redsand
  title: Red Sand
  subtitle: Propellant Lead · Arcadia Rise

# ---------------------------------------------------------------- the areas
# Six areas, chosen as the six units of the course this game exists to teach.
# The argument the campaign turns on runs between two of them: Catalyst Bay
# wants rate and Reactor Hall wants yield, and they are both right on a
# named sol.
groups:
  - id: KINET
    code: KINET
    name: Catalyst Bay
    color: '#d19a2b'
    desc: How fast the reaction goes, what the catalyst does, and what stops it working.
    defaultLeader: sundqvist
    milestones:
      - Establish what the bed is doing now
      - Separate rate from yield
      - Find what is taking the activity away
      - Qualify a charge somebody else can trust
  - id: EQUIL
    code: EQUIL
    name: Reactor Hall
    color: '#c05a33'
    desc: How much methane a pass can give, and what moves that limit.
    defaultLeader: herrera
    milestones:
      - State the balance the loop settles at
      - Move it on purpose rather than by accident
      - Close the carbon ledger across the loop
      - Certify a batch against the flight specification
  - id: PHASE
    code: PHASE
    name: Cold End
    color: '#4a86b8'
    desc: Where a gas becomes a liquid, what holds it there, and what it costs.
    defaultLeader: cho
    milestones:
      - Establish what condenses where
      - Keep the water and the carbon dioxide out of the cold line
      - Account for every kilogram that boils off
      - Hand a loaded tank to the vehicle
  - id: ELEC
    code: ELEC
    name: Electrolysis Hall
    color: '#3f9e8c'
    desc: Splitting water and carbon dioxide with electricity, and what the current buys.
    defaultLeader: achebe
    milestones:
      - Name the half-reactions at each electrode
      - Turn charge into kilograms
      - Find where the current goes when it makes nothing
      - Run the stack inside its thermal limit
  - id: GIBBS
    code: GIBBS
    name: Plant Control
    color: '#8d6bb5'
    desc: Which way a reaction runs on its own, and what has to be paid for.
    defaultLeader: demir
    milestones:
      - Sort the driven steps from the spontaneous ones
      - Put an energy number on each of them
      - Close the sol's ledger against the array
      - Decide what the station stops doing
  - id: SOIL
    code: SOIL
    name: Water Plant
    color: '#9a8352'
    desc: Getting water out of frozen ground, and the ions that come with it.
    defaultLeader: abiola
    milestones:
      - Get water out of the ground and keep it
      - Identify what is dissolved in it
      - Take out what the plant downstream cannot survive
      - Leave a rule the next crew can follow

# ------------------------------------------------------------------ the cast
# 13 people, at least 2 per area. Sundqvist and Herrera are the argument;
# everybody else has a position they will defend and a limit they admit to.
roster:
  - id: sundqvist
    name: Ingrid Sundqvist
    role: Plant Production Lead
    division: KINET
    bio: |
      Runs the plant against a calendar. Her case is arithmetic: the tank has to
      hold 29 tonnes on the sol the window opens, and a plant running
      below its rated output on any sol is a plant that has already lost that
      sol's kilograms.

      She reads the reactor as a rate problem. Heat the bed, move more gas
      through it, recycle whatever comes out unconverted, and the loop makes up
      in passes what it gives away per pass. Twice she has been right about that
      when everybody else was being careful.

      Her limit is that a kilogram made off-specification is not a kilogram. She
      knows it, argues with it, and has never once loaded a batch she was told
      not to.
    quiz:
      - q: Why does Sundqvist treat a slow sol as a loss she cannot get back?
        a: The window is fixed, so a sol's shortfall has to be carried by the sols left
        wrong:
          - The catalyst charge ages on a schedule set by its manufacturer
          - The plant's rated output is the figure the whole mission was planned and costed against
          - A slow sol forces the reactor to be purged and started again cold
  - id: herrera
    name: Tomás Herrera
    role: Reactor and Yield Lead
    division: EQUIL
    bio: |
      Owns the reactor loop and the specification the propellant has to meet. He
      thinks of the reaction as a balance rather than a process: at a given
      temperature and pressure there is an amount of methane the mixture will
      settle at, and no amount of urgency moves it.

      What he watches is the gap between what went in as carbon and what came out
      as product. A loop that cannot account for its own carbon is a loop making
      something nobody has named yet, and he has found carbon monoxide that way
      twice.

      His limit is that the balance says nothing about how long it takes to get
      there. A reactor can be at the right conditions and still be far too slow,
      and he needs Catalyst Bay to tell him which he is looking at.
    quiz:
      - q: What is Herrera actually testing when he compares carbon in against carbon out?
        a: Whether the loop is making a product nobody has listed
        wrong:
          - Whether the flow meters on the inlet and outlet still agree
          - Whether the reactor has reached the temperature the schedule asks for
          - Whether the catalyst charge has any working life left in it
  - id: cho
    name: Mei-Ling Cho
    role: Cryogenics Engineer
    division: PHASE
    bio: |
      Keeps the cold end, which is the part of the plant that turns a gas nobody
      can store into a liquid the vehicle can fly. Her working rule is that
      everything in the stream has a temperature at which it stops being a gas,
      and they are not the same temperature.

      That is also the whole of her trouble. Water freezes long before methane
      condenses, and carbon dioxide becomes a solid at a temperature the cold
      line passes through on its way down. Either of them will close a pipe from
      the inside with nothing showing outside it.

      Her limit is that she cannot see in. What she has is a pressure, a
      temperature and a flow, and a plug looks very like a valve nobody opened.
    quiz:
      - q: Why does Cho insist the stream is dried before it reaches her equipment?
        a: Water turns solid well above the temperature methane needs to condense
        wrong:
          - Water and methane form a mixture that will not separate again
          - Damp gas corrodes the heat exchanger over a season of running at temperature
          - Water carries dissolved chloride into the storage tank
  - id: achebe
    name: Rosalind Achebe
    role: Power and Electrolysis Engineer
    division: ELEC
    bio: |
      Runs the stacks and the array that feeds them. Everything she does converts
      electrical charge into moles, and the conversion is exact: a known current
      for a known time is a known number of molecules, if every electron did the
      job it was sent to do.

      Her interest is the gap between that and what the plant actually collects.
      Some of the current crosses the cell without splitting anything, some of the
      voltage above the thermodynamic minimum turns into heat, and both show up as
      hydrogen that was paid for and never arrived.

      Her limit is the array. Her stacks can take more current than the field can
      supply on most sols, so the number she works to is not an electrochemical
      one at all.
    quiz:
      - q: Why does Achebe distrust a hydrogen figure calculated from the current alone?
        a: Some of the charge crosses the cell without splitting any water
        wrong:
          - The current meter drifts warm over the course of a working sol
          - Faraday's constant depends on the temperature of the electrolyte
          - Hydrogen leaks out of the collection line faster than it is made
  - id: demir
    name: Yusuf Demir
    role: Life Support Officer
    division: GIBBS
    bio: |
      Responsible for the air, the water and the heat the crew lives in, all of
      which come off the same array as the propellant. He is the person who has to
      say out loud that a plant running flat out is a habitat running cold.

      He thinks in free energy rather than in kilowatt-hours, which sounds like
      pedantry until a decision turns on it. Some of what the station does happens
      on its own and needs only to be allowed; the rest has to be paid for, and
      the bill is set by chemistry rather than by engineering.

      His limit is that he is arguing for a margin against a deadline, which is
      the argument that loses. He has lost it four times this season and kept the
      minutes each time.
    quiz:
      - q: Why does Demir separate the station's loads into driven and spontaneous?
        a: The driven ones have a bill fixed by chemistry that no design can avoid
        wrong:
          - Spontaneous processes can be scheduled for the night side of the sol
          - Driven processes are the ones the crew can operate by hand if needed
          - The two kinds are metered on separate circuits from the array
  - id: abiola
    name: Femi Abiola
    role: Regolith and Water Lead
    division: SOIL
    bio: |
      Gets water out of frozen ground, which on this plain means ice cemented
      through the soil rather than ice in a sheet. His plant warms a sealed load,
      catches the vapour and condenses it, and what he collects is not water so
      much as a solution of whatever the ground had in it.

      Most of that is salt of one kind or another, and one of them is perchlorate,
      which is common here, dissolves readily, and lowers the freezing point of
      the brine far enough that it stays liquid at temperatures no fresh water
      would survive.

      His limit is the polishing column. It holds a finite number of ions, it
      gives no warning as it fills, and the sol it is full the water leaving it is
      as dirty as the water going in.
    quiz:
      - q: Why does Abiola describe his product as a solution rather than as water?
        a: Warming the ground dissolves whatever salt was cemented in with the ice
        wrong:
          - The condenser plate leaves a film of oil in every batch
          - Vapour collected under vacuum carries fine dust across to the condenser plate
          - Water made from ice is chemically different from surface water
  - id: stern
    name: Dana Stern
    role: Analytical Chemist
    division: EQUIL
    bio: |
      Runs the assay bench, where every claim the plant makes about its own
      product is either confirmed or quietly withdrawn. Two instruments and a set
      of standards, and a rule that a number without a standard behind it is an
      opinion with a decimal point.

      She is the reason the loop's carbon monoxide was found. It was not on
      anybody's list, so nobody was looking for it, and it sat in the product
      stream for 11 sols reading as inert.

      Her limit is that she measures what she is asked to measure. An assay is a
      question, and a contaminant nobody asks about is a contaminant that passes.
    quiz:
      - q: How did carbon monoxide sit in the product stream for 11 sols?
        a: The assay reported the compounds it was asked for, and that was not one
        wrong:
          - The chromatograph could not resolve it from the methane peak
          - Carbon monoxide forms inside the sample bottle in the hours after it is filled
          - Its concentration stayed below the instrument's detection limit
  - id: kaur
    name: Ravneet Kaur
    role: Catalysis Engineer
    division: KINET
    bio: |
      Looks after the catalyst charges: nickel on an alumina support, in a bed the
      size of a kitchen bin, doing the only job in the plant that nothing else can
      do. She can tell a great deal from where along the bed the heat is.

      A fresh charge does its work in the first few centimetres and the hot spot
      sits there. As the front of the bed loses activity the hot spot walks
      downstream, and the sol it reaches the far end there is no bed left to lose.

      Her limit is that the walk looks the same whatever is causing it. Heat and
      poison both take the front of the bed first, and the difference is visible
      in the spent charge rather than in the plant.
    quiz:
      - q: What does Kaur read from the position of the hot spot in the bed?
        a: How much of the bed has already stopped doing any work
        wrong:
          - Whether the reactor is running above its design temperature
          - How much gas is passing through the bed each minute
          - Whether the charge was packed evenly when it was loaded
  - id: moreau
    name: Élodie Moreau
    role: Cryogenic Fluids Technician
    division: PHASE
    bio: |
      Works the transfer lines and the tank farm. Everything she moves is a
      cryogenic liquid sitting at its own boiling point, which means any heat that
      reaches it leaves as vapour rather than as a temperature rise.

      She keeps the boil-off log, one line per sol, and she can tell a heat leak
      from a bad gauge by whether the loss changes when the tank is topped up.

      Her limit is the vent. Propellant that boils off can be recondensed if there
      is power to do it, and vented if there is not, and the second is a decision
      somebody makes at four in the morning.
    quiz:
      - q: Why does a heat leak into a cryogenic tank show up as vapour rather than as warming?
        a: A boiling liquid holds its temperature and takes the heat as evaporation
        wrong:
          - The tank's insulation keeps the liquid at the temperature it was filled at
          - Vapour rises to the top of the tank and carries the heat with it
          - The gauge measures pressure, so warming is invisible to it
  - id: petrov
    name: Iosif Petrov
    role: Array Technician
    division: ELEC
    bio: |
      Maintains 1800 square metres of photovoltaic panel on an open
      plain in a place with weather. Dust settles on every 1 of them at a rate
      he has measured, and a swept panel is worth a measurable fraction more than
      an unswept 1 for about 20 sols.

      His argument with the plant is about when to sweep. Sweeping costs power and
      crew time, and a storm undoes it, so the decision is a forecast rather than
      a schedule.

      His limit is that he cannot make the sun brighter. On a bad sol the array
      delivers what the sky lets through, and everything downstream is a choice
      about what to switch off.
    quiz:
      - q: Why is Petrov's sweeping schedule a forecast rather than a routine?
        a: A storm arriving soon after a sweep wastes the power the sweep cost
        wrong:
          - Panels can be damaged if they are swept more than once a season
          - Dust settles at a rate that changes with the time of year
          - Crew time for sweeping is allocated by the station commander
  - id: wells
    name: Marion Wells
    role: Station Commander
    division: GIBBS
    bio: |
      Commands the station, which in practice means she owns the energy budget and
      the arguments about it. Everything on this plain runs off one array, and she
      is the person who decides whether the next kilowatt-hour goes into the tank
      or into the habitat.

      She has one standing question for any proposal: what happens if we are wrong
      about it, and can we undo it. Work that can be undone she will approve on
      thin evidence. Work that cannot she will hold up for a sol.

      Her limit is that holding things up is itself a decision, and the calendar
      charges for it at the same rate.
    quiz:
      - q: What does Wells ask before approving something proposed on thin evidence?
        a: Whether the station can undo it if the evidence turns out wrong
        wrong:
          - Whether the work can be completed within a single working sol
          - Whether the proposal has been costed against the energy budget
          - Whether two members of the crew agree with the reasoning
  - id: nakagawa
    name: Sora Nakagawa
    role: Drill and Excavation Operator
    division: SOIL
    bio: |
      Cuts the ice-bearing ground the water plant runs on. The ice here is not a
      layer to be found but a cement through the soil, so what the machine brings
      up is a load of frozen dirt with a water content that changes across ten
      metres of ground.

      He samples every load before it goes to the hopper, because the difference
      between eight per cent water and three per cent is the difference between a
      shift that meets its number and one that does not.

      His limit is depth. Below about two metres the machine is slower than the
      plant can use, and the shallow ground near the station has already been cut.
    quiz:
      - q: Why does Nakagawa sample each load before it reaches the hopper?
        a: Water content varies across the ground, so the load's yield is not known
        wrong:
          - Samples are required by the station's excavation permit
          - A hopper cannot be opened again once a load has been sealed and warmed through
          - Dust in the load has to be measured before it enters the plant
  - id: bhatt
    name: Anaya Bhatt
    role: Ascent Vehicle Systems Engineer
    division: PHASE
    bio: |
      Owns the vehicle the whole plant exists to fill. Her tanks take the
      propellant, her specification says what may go into them, and she is the
      last signature before a batch is loaded.

      She is unsentimental about the plant's difficulties. The engine sees a
      mixture, not a season of work, and water in the methane freezes in a valve
      at a temperature the valve reaches every time it is used.

      Her limit is that she cannot test what she is being handed. There is one
      vehicle, it is not fired until it launches, and everything she knows about
      the propellant in it comes from an assay somebody else ran.
    quiz:
      - q: Why does Bhatt hold the specification hard on a trace contaminant?
        a: Nothing loaded into the vehicle can be taken out or tested by firing
        wrong:
          - The specification was written by the vehicle's manufacturer
          - Trace contaminants concentrate in the tank as the propellant around them boils away
          - An assay cannot measure a contaminant below a few parts per million

glossary:
  - name: Sabatier reaction
    aliases: [sabatier, the assembly reaction]
    def: Carbon dioxide and hydrogen combining over a catalyst to give methane and water. It gives out heat.
  - name: Catalyst
    aliases: [catalytic, catalyse, catalyses, catalysed]
    def: A material that speeds a reaction up by offering an easier path, and is not used up doing it.
  - name: Activation energy
    aliases: [activation barrier, energy barrier]
    def: The energy hill a reaction has to get over. A catalyst lowers it; heating helps more molecules clear it.
  - name: Rate law
    aliases: [rate equation, order of reaction, reaction order]
    def: How the speed of a reaction depends on the amounts present. Found by experiment, not from the equation.
  - name: Rate constant
    aliases: [rate coefficient]
    def: The number in a rate law that carries the temperature dependence. It rises steeply as the bed is heated.
  - name: Residence time
    aliases: [contact time, space velocity]
    def: How long gas spends inside the catalyst bed. Volume of the bed divided by the flow through it.
  - name: Poisoning
    aliases: [poisoned, poison, deactivation, deactivating]
    def: A substance in the feed binding to the catalyst's active sites and stopping them working.
  - name: Sintering
    aliases: [sinter, sintered]
    def: Heat making the small metal particles of a catalyst merge into larger ones, so less surface is left to work on.
  - name: Equilibrium
    aliases: [at equilibrium, equilibrium position]
    def: The state a reaction settles at, where the forward and reverse changes proceed at matching rates.
  - name: Equilibrium constant
    aliases: [equilibrium constant K, the constant K, K]
    def: The fixed ratio of products to reactants a reaction settles at, at one temperature. Changing the temperature changes it.
  - name: Reaction quotient
    aliases: [reaction quotient Q, Q]
    def: The same ratio worked out from what is in the vessel right now. Comparing it with K says which way the reaction will run.
  - name: Le Châtelier's principle
    aliases: [le chatelier, le châtelier]
    def: Disturb a system at equilibrium and it shifts in the direction that partly undoes the disturbance.
  - name: Partial pressure
    aliases: [partial pressures]
    def: The pressure one gas in a mixture would exert alone. The pressures of the parts add up to the total.
  - name: Yield
    aliases: [conversion, per-pass yield, single-pass conversion]
    def: How much of what went in came out as the product you wanted, on one pass through the reactor.
  - name: Recycle loop
    aliases: [recycle, recycled, recycling]
    def: Sending the unreacted gas back to the reactor inlet, so a poor conversion per pass can still give a good overall one.
  - name: Enthalpy change
    aliases: [enthalpy, heat of reaction, ΔH]
    def: The heat a reaction gives out or takes in at constant pressure. Negative means heat comes out.
  - name: Entropy
    aliases: [entropy change, ΔS]
    def: A measure of how spread out the energy and the matter are. Making fewer gas molecules lowers it.
  - name: Gibbs free energy
    aliases: [free energy, gibbs, ΔG]
    def: The combination of enthalpy and entropy that decides direction. Negative means the change can run on its own.
  - name: Spontaneous
    aliases: [spontaneity, runs on its own]
    def: Able to proceed without being driven from outside. It says nothing about how fast.
  - name: Electrolysis
    aliases: [electrolyse, electrolyser, electrolytic, electrolysed]
    def: Using an electric current to drive a reaction that would not run on its own, such as splitting water.
  - name: Half-reaction
    aliases: [half reaction, half-reactions, half equations]
    def: One side of an electron transfer written on its own — what is oxidised at one electrode, what is reduced at the other.
  - name: Oxidation
    aliases: [oxidised, oxidise]
    def: Loss of electrons. It happens at the anode.
  - name: Reduction
    aliases: [reduced, reduce]
    def: Gain of electrons. It happens at the cathode.
  - name: Faraday's constant
    aliases: [faraday constant, faraday's law, faraday's laws]
    def: The charge carried by 1 mole of electrons, about 96,485 coulombs. It converts current and time into moles.
  - name: Overpotential
    aliases: [overvoltage, excess voltage]
    def: The voltage a cell needs above the thermodynamic minimum to run at a useful rate. It leaves as heat.
  - name: Current efficiency
    aliases: [faradaic efficiency, coulombic efficiency]
    def: The fraction of the charge passed that actually made the product you wanted.
  - name: Vapour pressure
    aliases: [vapor pressure, saturation pressure]
    def: The pressure of the gas standing above its own liquid. It rises steeply with temperature.
  - name: Boiling point
    aliases: [condensation temperature, condenses at]
    def: The temperature at which vapour pressure reaches the surrounding pressure, so the liquid boils.
  - name: Intermolecular forces
    aliases: [intermolecular force, dispersion forces, london forces, hydrogen bonding]
    def: The attractions between whole molecules. Stronger attractions mean a higher boiling point.
  - name: Deposition
    aliases: [deposit, deposits, freezing out, freeze out]
    def: A gas turning straight into a solid without passing through a liquid. Carbon dioxide does it readily.
  - name: Triple point
    aliases: [triple-point]
    def: The one temperature and pressure at which solid, liquid and gas all sit together.
  - name: Boil-off
    aliases: [boiloff, boil off]
    def: Cryogenic liquid lost as vapour when heat reaches the tank. The liquid stays at its boiling point and evaporates instead of warming.
  - name: Cryogenic
    aliases: [cryogen, cryogenics]
    def: Cold enough that ordinary gases are liquids. Methane and oxygen are stored that way.
  - name: Perchlorate
    aliases: [perchlorates, perchlorate salt]
    def: A salt of chlorine and oxygen, common in this ground, very soluble, and the source of the chloride in the water.
  - name: Chloride
    aliases: [chloride ion, chlorides]
    def: The ion left when a chlorine-bearing salt dissolves. It sticks to a nickel catalyst and does not come off.
  - name: Sulphate
    aliases: [sulfate, sulphate ion]
    def: A dissolved ion of sulphur and oxygen. It comes out of solution as hard scale on a hot surface.
  - name: Brine
    aliases: [brines, salt solution]
    def: Water with a great deal of salt dissolved in it. It stays liquid far below the freezing point of fresh water.
  - name: Freezing point depression
    aliases: [depression of the freezing point, colligative]
    def: Dissolved particles lowering the temperature at which a solution freezes. How many particles matters, not which.
  - name: Molality
    aliases: [molal, moles per kilogram]
    def: Moles of dissolved substance per kilogram of solvent. Used where temperature changes make volumes unreliable.
  - name: Ion exchange
    aliases: [ion-exchange, polishing column, polishing bed]
    def: A packed bed that swaps unwanted ions out of water for harmless ones. It holds a fixed number and no more.
  - name: Breakthrough
    aliases: [breaks through, broken through]
    def: The moment a packed bed is full, after which what goes in comes straight out again.
  - name: Optical depth
    aliases: [opacity, dust opacity, tau]
    def: How much dust stands between the sun and the ground. Each unit cuts the direct beam by a further factor.
  - name: Sol
    aliases: [sols]
    def: 1 Martian day, 24 hours 39 minutes — about 88,800 seconds.
  - name: Mixture ratio
    aliases: [oxidiser-to-fuel ratio, o/f ratio]
    def: The mass of oxidiser burned per unit mass of fuel. It decides what fraction of the tank is oxygen.
  - name: Specification
    aliases: [spec, flight specification]
    def: The written limits a batch has to meet before it may be loaded into the vehicle.

# ---------------------------------------------------------------- the sols
# 15 working sols, sol 291 to sol 305 of a 550-sol surface stay. The window
# opens on sol 486 and does not move. Each sol visits 3 different areas; the
# engine adds a callback from sol 3 onward.
missions:
  # ---------------------------------------------------------------- sol 291
  - title: 2700 kilograms short
    objective: Establish what the plant is actually limited by before anybody changes a set point.
    briefing: The tank reconciliation was read at breakfast and the plant does not reach the number.
    stake: >-
      Sol 291, and the reconciliation of the ascent vehicle's tanks was read out at breakfast this
      morning. 3.9 tonnes of methane are aboard and 6.6 have to be aboard by
      the sol the transfer window opens, 195 sols from now, and the plant's
      present output does not reach it. Ingrid Sundqvist, the plant production lead, wants the
      reactor set point raised 40 degrees tonight. Tomás Herrera, who owns the reactor loop and
      the specification the propellant has to meet, says a hotter bed gives back less methane on
      every pass. Today you walk the loop end to end and decide what is holding the output down.
      Whatever the plant misses this fortnight is carried by the sols that are left, and there are
      195 of those.
    takeaway: A plant has a speed and a ceiling, and they are not the same limit.
    stops:
      - group: EQUIL
        task: Match each change to the loop with what it does to the methane at equilibrium.
        title: What the loop settles at
        place: Reactor Hall
        scene: The loading projection is still 2,700 kilograms short. Herrera has stopped accepting slogans like ‘run it hotter.’ Four proposed changes are on the reactor board. He wants each effect agreed before anyone touches the loop.
        assumes:
          - a reaction at equilibrium is still running in both directions
          - pressure and temperature are the two settings on a gas-phase reactor
        takeaway: Pressure, temperature, product removal and an inert gas do not disturb an equilibrium in the same way.
        format: PROTOCOL
        why: "Each of these is the same principle applied to a different quantity. Pressure counts gas molecules, and five go in where three come out, so squeezing the loop favours the smaller side. Temperature is different in kind: heat is one of the products here, so the equilibrium constant itself falls as the bed is heated. Condensing the water changes the ratio without touching the constant. Argon raises the total pressure and no partial pressure, so the mixture never notices that it is there."
        scenarios:
          - The loop pressure is raised from 8 bar to 12.
          - The bed is run 40 degrees hotter at the same pressure.
          - Product water is condensed out before the gas returns to the inlet.
          - Argon builds up in the loop, raising the total pressure at fixed volume.
        choices:
          - "More methane: the forward direction ends with fewer gas molecules than it starts with."
          - "Less methane: the assembly gives out heat, and supplying more heat pushes it back."
          - "More methane: taking an output away leaves the mixture short of the ratio it settles at."
          - "No change: nothing taking part in the reaction has had its own partial pressure altered."
        mapping: [0, 1, 2, 3]
      - group: KINET
        task: Say what 40 degrees actually buys
        title: Rate is not yield
        place: Catalyst Bay
        scene: Sundqvist wants the bed at 320 °C tonight, up from 280. Ravneet Kaur, the catalysis engineer, has the temperature profile and the production projection side by side. One setting may rescue the schedule or deepen the shortfall.
        assumes:
          - heating a reaction makes it go faster
          - an exothermic reaction gives out heat as it proceeds
        takeaway: Temperature can increase reaction rate while decreasing the equilibrium yield of an exothermic reaction.
        format: CHOICE
        question: The bed is run 40 degrees hotter at the same pressure and the same flow. What happens?
        why: Temperature moves two different quantities in opposite directions. The rate constant rises because more collisions can clear the activation barrier. That is a kinetic effect. For this exothermic reaction, the equilibrium constant falls as temperature rises. That is a thermodynamic effect. A hotter bed can therefore reach a lower methane ceiling more quickly. Whether the trade helps depends on recycle, residence time and how much unreacted feed the loop can send around again.
        choices:
          - The bed turns gas over faster, and the methane a single pass can give falls a little.
          - Both the speed and the amount at equilibrium rise together, since heat helps a reaction along.
          - The speed is unchanged and the yield rises, since the catalyst is what sets the pace.
          - Neither moves much, since loop pressure is what fixes the speed and the amount alike.
        answer: The bed turns gas over faster, and the methane a single pass can give falls a little.
        rebuttals:
          - Heat helps the rate and hinders the balance, and treating the two as one quantity is the mistake this reactor keeps making.
          - A catalyst changes how quickly the balance is reached and leaves the balance itself where it was.
          - Pressure does move this equilibrium, and it is not what sets the rate constant.
      - group: PHASE
        task: Say why the stream is cleaned before it is cooled
        title: What freezes before methane condenses
        place: Cold End
        scene: |-
          The cold line takes the product stream from 10 degrees down to 115 kelvin in 1 run of pipe. Mei-Ling Cho, the cryogenics engineer, will not accept a stream that has skipped the drier.
        assumes:
          - a substance leaves the gas phase at a temperature that depends on the pressure
          - liquid methane needs about 112 K at loop pressure
        takeaway: A cold line is a series of temperatures, and every substance in the stream leaves the gas at its own one.
        format: CHOICE
        question: Why does the stream pass a drier and a carbon dioxide trap before it reaches the cold line?
        why: Every substance in the stream leaves the gas phase at its own temperature. Water freezes near 273 K. Carbon dioxide can deposit directly as a solid near 195 K at these pressures. Methane remains gaseous until the stream is much colder, near its condensation temperature. If water and carbon dioxide are not removed first, both can become solids on exchanger surfaces. A growing solid layer narrows the passage and can mimic a valve or refrigeration fault from outside the pipe.
        choices:
          - Water and carbon dioxide turn solid at temperatures the line passes through on its way down.
          - Water and carbon dioxide dissolve into the liquid methane and cannot be separated afterwards.
          - Both gases carry heat into the cold end and raise the load on the refrigerator.
          - The drier and the trap are what raise the pressure the cold line needs to work at.
        answer: Water and carbon dioxide turn solid at temperatures the line passes through on its way down.
        rebuttals:
          - Neither one gets as far as the liquid methane; both are solid on the wall well before that.
          - The heat they carry is real and small, and it is not what closes the line.
          - Both fittings take a small pressure drop rather than adding pressure.
  # ---------------------------------------------------------------- sol 292
  - title: Run it hotter
    objective: Find what else the same power could be doing, now that the bed is where it should have been.
    briefing: The hot run made its number overnight, and the argument has moved to the electrolysis hall.
    stake: >-
      Sol 292, and the bed went to 320 degrees overnight on Sundqvist's
      authority. It made 11.4 kilograms of methane against 9.7 the sol
      before, and the recycle loop took back most of what the hotter pass gave away. Sundqvist is
      right this sol, and what she is right about is narrow: the bed had been running far below the
      temperature it was designed for, and a loop that recycles can afford a poor pass. Today you
      go to the electrolysis hall and settle what a stack actually converts, since hydrogen is the
      other half of every kilogram of methane. The heating hour the plant borrowed to do it came
      off Yusuf Demir's habitat margin, and the life support officer has said so in the log.
    takeaway: A loop that recycles can afford a poor pass, and a plant with no hydrogen cannot afford anything.
    stops:
      - group: KINET
        task: Work out how long the gas is in contact with the catalyst
        title: How long a molecule stays in the bed
        place: Catalyst Bay
        scene: |-
          Kaur wants the contact time worked out at the new flow before anything else is changed. The bed holds 340 litres of packed catalyst and the loop is passing 85 litres a minute through it.
        assumes:
          - a flow quoted in litres a minute is a volume passing each minute
          - gas volumes depend on the pressure and temperature they are quoted at
        takeaway: Conversion depends on how fast the reaction runs and on how long it is allowed to run for.
        format: BALLPARK
        question: Estimate how long a molecule of gas spends inside the bed.
        why: Residence time is the contact the reaction gets. A rate constant says how quickly reaction occurs at the stated conditions. Residence time says how long the gas remains with the catalyst. Conversion depends on both. Raising throughput by pushing more gas through the same bed shortens that contact. The plant can therefore increase flow while lowering conversion in one move. Rate and residence time must be judged together before a higher production setting is accepted.
        estimate:
          prompt: The bed holds 340 litres of packed catalyst, and the loop passes 85 litres a minute through it at reactor conditions.
          question: Estimate how long a molecule of gas spends inside the bed.
          labels:
            - 340 L  (volume of the packed bed)
            - 85 L/min  (flow through the bed at reactor conditions)
            - 12 bar  (loop pressure)
            - 593 K  (bed temperature)
            - 4  (moles of hydrogen per mole of carbon dioxide)
          values: [340, 85, 12, 593, 4]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 4
          tolerance: 0.4
          units: minutes
          solution: t = 340 L ÷ 85 L/min = 4.0 minutes.
          explanation: Contact time is the bed's volume divided by the flow through it. The pressure and the temperature are already inside that flow figure, which is quoted at reactor conditions.
          relationship: Residence time = the volume of the packed bed ÷ the gas flow through it each minute, with both measured at the reactor's own pressure and temperature.
      - group: ELEC
        task: Match each part of the cell to what it does.
        title: Which electrode does which job
        place: Electrolysis Hall
        scene: |-
          The hall runs two kinds of cell: 1 splits water, the other splits carbon dioxide at 800 degrees. Rosalind Achebe, the power and electrolysis engineer, has the four parts listed on the board.
        assumes:
          - oxidation is loss of electrons and reduction is gain of electrons
          - a current is a flow of charge
        takeaway: The two halves of one electron transfer can be run in separate places if something carries an ion between them.
        format: PROTOCOL
        why: Electrolysis separates the two halves of one electron-transfer reaction. Electrons enter at the cathode, where reduction occurs. Electrons leave at the anode, where oxidation occurs. The solid electrolyte carries ions between those regions without carrying electrons through the same path. That separation keeps oxygen away from the fuel-side product. Current measures how quickly charge is delivered through the external circuit. Faraday’s law then connects the total charge passed to the maximum amount of product the cell can make.
        scenarios:
          - The cathode, where the supply pushes electrons into the stream.
          - The anode, where electrons are pulled back out.
          - The solid electrolyte between them.
          - The setting on the power supply.
        choices:
          - "Reduction: carbon dioxide takes up electrons here and leaves an oxide ion behind."
          - "Oxidation: oxide ions give up electrons here and depart as oxygen gas."
          - It carries oxide ions across and refuses to carry electrons, so the circuit runs through the wire.
          - It fixes how many moles a sol the cell can make, since charge and moles are proportional.
        mapping: [0, 1, 2, 3]
      - group: GIBBS
        task: State which of the plant's steps have a bill
        title: What has to be paid for
        place: Plant Control
        scene: Demir has the sol’s energy ledger open on the desk. The reactor releases heat while it runs, while electrolysis takes most of the array output. He wants the difference stated plainly in the log.
        assumes:
          - some reactions give out heat and others take it in
          - electrical energy can be counted in kilowatt-hours
        takeaway: Whether a change runs on its own and how fast it goes are two separate questions, and one of them has a bill.
        format: CHOICE
        question: Why does splitting water need a power supply while the methane assembly does not?
        why: "Direction is set by the free-energy change, which weighs the heat given out against the change in how spread out the matter is. Assembling methane from carbon dioxide and hydrogen gives out a great deal of heat and runs downhill. Splitting water is that same reaction backwards: it takes the energy in, and no arrangement of equipment gets out of paying it. Electricity is how the plant pays. A catalyst can make a downhill change fast, and cannot make an uphill change run."
        choices:
          - Splitting water raises the free energy of what comes out, and that has to be supplied.
          - Splitting water is the slower of the two, and a slow reaction needs power to keep it going.
          - Water is a liquid, and turning a liquid into two gases is what the electricity pays for.
          - The assembly has a catalyst, and a catalyst supplies the energy a reaction would need.
        answer: Splitting water raises the free energy of what comes out, and that has to be supplied.
        rebuttals:
          - Speed and direction are different properties, and a fast uphill reaction still has to be driven.
          - Boiling the water would cost far less than splitting it, and the plant is not boiling anything.
          - A catalyst opens an easier path and puts no energy in; it leaves the free-energy change exactly where it was.
  # ---------------------------------------------------------------- sol 293
  - title: The line that stopped passing gas
    objective: Find what closed the cold line, and what the hot run has to do with it.
    briefing: The cold end stopped delivering liquid three hours into the hot run.
    stake: >-
      Sol 293, and the cold end stopped delivering liquid 3 hours after the hot run began. The
      loop is still making methane and none of it is reaching a tank, so the sol's production is
      standing in a pipe at 12 bar. Cho has a flow that fell away over three hours rather than
      stopping at once, which she says rules out most of the simple explanations. Herrera is right
      this sol: the hotter bed put more water into the product stream, and the water went somewhere.
      Today you find where it went, work out why the hot pass gave back less methane, and follow
      the water back up the plant to the ground it came out of. Nothing else runs while the cold end
      is blocked.
    takeaway: A plant is a chain, and the fastest step decides nothing on its own.
    stops:
      - group: PHASE
        task: Find the one explanation the quiet readings allow
        title: Reading a blockage from outside the pipe
        place: Cold End
        scene: >
          Five readings are up on the cold end panel. Two of them are alarming, three are entirely
          ordinary, and Cho says the ordinary ones are the reason most of the obvious answers do
          not survive.
        assumes:
          - a refrigerator that has reached its set point is doing its job
          - water freezes at a far higher temperature than methane condenses at
        takeaway: The readings that are normal are what rule an explanation out.
        format: DIAGNOSIS
        headline: The cold line stopped passing gas over three hours, with the refrigerator at temperature.
        task: Which explanation fits every reading, not the loudest one?
        readings:
          - { zone: Cold line, label: Flow, value: fell to 0 over 3 h, status: alarm }
          - { zone: Cold head, label: Temperature, value: 114 K, status: normal, note: at its set point }
          - { zone: Drier outlet, label: Water content, value: 900 ppm, status: alarm }
          - { zone: Vacuum jacket, label: Pressure, value: steady, status: normal, note: rules out a jacket leak }
          - { zone: Upstream, label: Loop pressure, value: rising, status: high }
        choices:
          - { label: Water past the drier is freezing in the exchanger, mechanism: 'The line cools through 273 K long before it gets anywhere near methane.' }
          - { label: The refrigerator has lost capacity since the hot run began, mechanism: 'A cold head short of temperature passes gas where it should deliver liquid.' }
          - { label: The vacuum jacket has failed, mechanism: 'Heat leaking in warms the line and stops it condensing anything.' }
          - { label: A valve on the cold line was left shut, mechanism: 'A closed valve blocks the flow with everything else reading normally.' }
        answer: Water past the drier is freezing in the exchanger
        why: >-
          The quiet readings do the work. A cold head sitting at its set point has not lost capacity,
          and a steady jacket pressure is a jacket that has not failed. That leaves a blockage, and
          the shape of the flow trace says which kind: a shut valve stops the flow in a second, while
          ice builds up over hours and takes the flow down with it. The drier outlet at 900 ppm names
          the material. Upstream pressure rising against a growing plug completes it.
      - group: EQUIL
        task: Separate the thermodynamic temperature effect from the flow change in the hot run.
        title: Why the hotter pass gave less
        place: Reactor Hall
        scene: The hot run’s assay is on Herrera’s desk. Conversion per pass fell from 71% to 64% while throughput rose. He wants the reason written down before anyone argues for another temperature increase.
        assumes:
          - the equilibrium constant is fixed at a given temperature
          - the Sabatier reaction gives out heat
        takeaway: Heating an exothermic reaction lowers its equilibrium product yield, while the observed reactor conversion can also depend on kinetics and residence time.
        format: CHOICE
        question: What happened to the equilibrium methane ceiling when temperature rose, even though the observed conversion may also reflect shorter residence time?
        why: "The hot run changed two things at once: temperature rose and throughput increased. Those changes should not be collapsed into one explanation. Thermodynamically, the higher temperature lowers the equilibrium constant for this exothermic reaction and therefore lowers the methane ceiling. Kinetically, the hotter catalyst reacts faster, while the higher flow shortens residence time. The observed 64% conversion can contain both effects. A later controlled flow test can separate them by changing residence time while holding temperature and pressure fixed."
        choices:
          - The equilibrium methane ceiling is lower at the higher temperature, even though the rate constant is larger.
          - The equilibrium ceiling is higher because hotter molecules collide more often and reach products more easily.
          - Temperature leaves equilibrium unchanged; only the shorter residence time can lower conversion.
          - The catalyst changes the equilibrium constant when it becomes hotter, so the balance follows catalyst activity.
        answer: The equilibrium methane ceiling is lower at the higher temperature, even though the rate constant is larger.
        rebuttals:
          - Collision frequency and activation energy affect rate, not the direction in which an exothermic equilibrium shifts with temperature.
          - Residence time can affect the measured conversion, but the equilibrium constant also changes with temperature.
          - A catalyst changes how fast equilibrium is reached and does not set the equilibrium constant.
      - group: SOIL
        task: Order the steps the water plant runs in.
        title: Getting water out of frozen ground
        place: Water Plant
        scene: Femi Abiola, the regolith and water lead, has the plant’s four steps written on cards. The morning crew disagreed about where the extra water appeared. He wants the cards restored to process order.
        assumes:
          - warming ice-bearing soil releases water as vapour at low pressure
          - dissolved salts stay behind when water evaporates
        takeaway: Every step in the water plant fixes something the step after it cannot survive.
        format: SEQUENCE
        why: The order is set by what each step needs from the one above it. Ice that melts in the bucket runs into the ground and is lost, so the load stays frozen until it is inside something sealed. Vapour has to be captured where it is released or it goes into the atmosphere at six millibars. Condensing gives liquid water, and only liquid water can be run through an ion-exchange bed. Take the steps out of order and each one has nothing to work on.
        cards:
          - Cut ice-bearing ground and keep the load below its melting point on the way in.
          - Warm a sealed hopper so the water leaves the soil as vapour with nowhere else to go.
          - Condense that vapour on a chilled plate and drain it into a holding tank.
          - Strip chloride out on the polishing column at the outlet of the holding tank.
        order: [0, 1, 2, 3]
  # ---------------------------------------------------------------- sol 294
  - title: The loop that pays for itself
    objective: Size the feed the plant needs, and find where the current is going.
    briefing: With the cold line clear, the question is whether the feed can keep up with the bed.
    stake: >-
      Sol 294. The exchanger was warmed out overnight and the cold end took liquid again at six
      hours, which leaves the plant with the question it had two sols ago and better information
      about it. Herrera's loop can convert two thirds of a pass and recycle the rest; what it
      cannot do is make methane out of carbon dioxide it has not been given, or hydrogen the stacks
      have not made. Today you size the feed the bed needs at the new rate, find out why Achebe's
      stacks return less hydrogen than the current says they should, and look at what the water
      carries with it. Abiola has been asking for a second polishing column since sol 240 and has
      not been given 1.
    takeaway: A plant is limited by whichever feed runs out first, and it will not be the same one every sol.
    stops:
      - group: EQUIL
        task: Size the carbon dioxide the bed needs each sol
        title: How much gas the bed has to be fed
        place: Reactor Hall
        scene: |-
          The plant has to average 13.8 kilograms of methane a sol from here to the window. Herrera wants the carbon dioxide that implies before the intake compressors are asked for anything.
        assumes:
          - one mole of carbon dioxide yields one mole of methane in this reaction
          - a molar mass converts moles to kilograms
        takeaway: Stoichiometry turns a production target into a feed rate, and the feed rate is what the intake has to meet.
        format: BALLPARK
        question: Estimate the carbon dioxide the reactor must be fed each sol.
        why: Stoichiometry is mole bookkeeping. The balanced reaction sends one carbon atom from each carbon-dioxide molecule into one methane molecule. Mass adds one conversion step. Carbon dioxide has a molar mass of 44 g/mol, while methane is 16 g/mol. Each kilogram of methane therefore needs 44/16 kilograms of carbon dioxide. The intake compressors must gather that feed from a very thin atmosphere. The required compressor work scales directly with the production target the plant promises to meet.
        estimate:
          prompt: The plant must average 13.8 kg of methane a sol. One mole of carbon dioxide gives one mole of methane.
          question: Estimate the carbon dioxide the reactor must be fed each sol.
          labels:
            - 13.8 kg  (methane needed each sol)
            - 44.0 g/mol  (molar mass of carbon dioxide)
            - 16.0 g/mol  (molar mass of methane)
            - 4  (moles of hydrogen per mole of carbon dioxide)
            - 2  (moles of water made per mole of methane)
          values: [13.8, 44, 16, 4, 2]
          slots: 3
          template: "{0} × {1} ÷ {2}"
          formula: a*b/c
          correct: [0, 1, 2]
          target: 37.9
          tolerance: 2
          units: kg per sol
          solution: 13.8 kg × 44.0 ÷ 16.0 = 37.9 kg of carbon dioxide a sol.
          explanation: Equal moles of the two gases, so the mass ratio is the ratio of the molar masses. The hydrogen and the water are elsewhere in the ledger.
          relationship: Feed mass = product mass × molar mass of the feed ÷ molar mass of the product, since CO₂ + 4H₂ → CH₄ + 2H₂O consumes 1 carbon dioxide for each methane.
      - group: ELEC
        task: Close the hydrogen-equivalent charge ledger and identify the part of the current that did not become collected hydrogen.
        title: Where eight per cent of the charge went
        place: Electrolysis Hall
        scene: The cell held 640 amps for a full sol. Faraday’s law predicts about 594 grams of hydrogen, but the separator collected only 546. Achebe has already checked the collection-line pressure and the hydrogen inventory downstream.
        assumes:
          - Faraday’s law converts charge into a theoretical amount of product
          - current efficiency is collected product divided by theoretical product from charge
        takeaway: Faraday’s law fixes the theoretical product from charge; current efficiency measures how much of that charge reached the intended reaction.
        format: BALANCE
        question: What term closes the charge ledger, and what does that term measure about the cell?
        balance:
          total:
            amount: 594
            unit: g H₂-equivalent
            label: Product allowed by measured charge
          streams:
            - id: collected
              label: Hydrogen collected at the separator
              value: 546
              display: 546 g
            - id: line_inventory
              label: Change in hydrogen held in the collection line
              value: 0
              display: No change
            - id: measured_vent
              label: Measured hydrogen vent loss
              value: 0
              display: No loss detected
            - id: nonproductive
              label: Charge not recovered as collected H₂
              value: 48
              display: 48 g-equivalent
              hidden: true
          tolerance: 3
          hint: All rows are written in hydrogen-equivalent grams. Count the measured product and any real downstream storage or loss before deciding what must be assigned to the cell itself.
        answerText: The ledger is short by about 48 g of hydrogen-equivalent charge. The cell collected 546/594 ≈ 92% of the Faraday-law maximum, so its current efficiency is about 92%.
        why: Current times time gives charge, and Faraday’s law converts that charge into a theoretical hydrogen mass. For this run the charge corresponds to about 594 grams. Only 546 grams were collected, while line inventory and measured vent loss were unchanged. The missing 48 grams are therefore not a hidden hydrogen store. They are hydrogen-equivalent charge that crossed by other electrochemical paths or recombined before collection. The ratio 546/594 is about 92%, which is the current efficiency for this run.
      - group: SOIL
        task: Match each dissolved species to what it does downstream.
        title: What comes with the water
        place: Water Plant
        scene: |-
          The holding tank's analysis is on Abiola's bench: four dissolved species, none of them water. Each one has somewhere downstream that it matters, and the plant has one polishing column between them and everything else.
        assumes:
          - salts dissolve into ions in water
          - an electrolysis cell and a catalyst bed both have surfaces that can be fouled
        takeaway: Water from the ground is a solution, and every solute has an address downstream.
        format: PROTOCOL
        why: A dissolved species matters because of the surface or process it reaches downstream. Chloride is dangerous here because it can bind strongly to nickel catalyst sites. Sulphate can contribute to scale on hot surfaces. Fine particles create a mechanical fouling problem. Dissolved carbon dioxide is different because the plant already handles carbon dioxide as a process species. The polishing train should therefore be designed around consequences, not around the idea that every impurity is equally harmful.
        scenarios:
          - Chloride ion, from dissolved perchlorate salt.
          - Sulphate ion, at four grams a litre.
          - Suspended fines, too small for the filter.
          - Dissolved carbon dioxide, from the condenser headspace.
        choices:
          - Binds to the nickel surface of the catalyst and takes those sites out of use.
          - Comes out of solution as scale on the hot faces of the electrolysis cell.
          - Packs into the drier and raises the pressure drop across it sol by sol.
          - Adds acidity and nothing else; the reactor is fed the same gas anyway.
        mapping: [0, 1, 2, 3]
  # ---------------------------------------------------------------- sol 295
  - title: The ceiling on running hotter
    objective: Put a number on how far the temperature argument can be taken.
    briefing: Sundqvist has asked for another 40 degrees, and this time the question has an arithmetic answer.
    stake: >-
      Sol 295, and Sundqvist has asked for another 40 degrees on the bed, 4 sols after the
      first 40 worked. Kaur will not sign for it: the last charge she pulled had grown its metal
      particles, and a bed that has sintered does not come back. Demir wants to know where the heat
      is coming from, since the reactor gives out heat and the habitat is short of it. Today you put
      an arithmetic ceiling on the temperature argument, decide what a catalyst can and cannot
      change about it, and follow the product stream into the cold end. The number you produce
      settles a fortnight of argument in either direction, and Wells has said she will act on it
      the same evening.
    takeaway: An argument that has an arithmetic answer should not be settled by seniority.
    stops:
      - group: GIBBS
        task: Work out the free-energy change at the bed's temperature
        title: The temperature the reaction stops wanting to run
        place: Plant Control
        scene: Demir has thermodynamic data for the Sabatier reaction on the desk. The sheet lists its enthalpy and entropy changes per mole of methane. He wants ΔG evaluated at the present bed temperature.
        assumes:
          - free energy combines the heat of a reaction with its entropy change
          - a negative free-energy change means the reaction can run on its own
        takeaway: With fixed tabulated ΔH and ΔS, ΔG = ΔH − TΔS predicts the temperature where spontaneity changes sign.
        format: BALLPARK
        question: Estimate the free-energy change for the reaction at the bed's temperature.
        why: The enthalpy and entropy terms oppose each other. Methanation releases heat, which favours products, but it also reduces the number of gas molecules and gives a negative entropy change. The TΔS term therefore becomes more important as temperature rises. At 593 K the estimate is still strongly negative. Using the same tabulated ΔH and ΔS gives 0 crossing near 960 K. Real thermodynamic values vary somewhat with temperature, so 960 K is a course-model threshold rather than an exact plant limit.
        estimate:
          prompt: For this reaction the enthalpy change is −165,000 J per mole and the entropy change is −172 J per mole per kelvin. The bed is at 593 K.
          question: Estimate the free-energy change for the reaction at the bed's temperature.
          labels:
            - −165000 J/mol  (enthalpy change)
            - 593 K  (bed temperature)
            - −172 J/mol/K  (entropy change)
            - 8.314 J/mol/K  (the gas constant)
            - 298 K  (room temperature)
          values: [-165000, 593, -172, 8.314, 298]
          slots: 3
          template: "{0} − {1} × {2}"
          formula: a - b*c
          correct: [0, 1, 2]
          target: -63004
          tolerance: 3000
          units: J per mole
          solution: ΔG = −165,000 − (593 × −172) = −63,000 J per mole.
          explanation: Both terms are negative, and they pull opposite ways once the temperature multiplies the second. The gas constant and room temperature belong to other calculations.
          relationship: ΔG = ΔH − TΔS, with ΔG the free-energy change, ΔH the heat given out at constant pressure, T the absolute temperature in kelvin and ΔS the entropy change of the reaction.
      - group: KINET
        task: Say what the catalyst is and is not doing
        title: What a catalyst cannot do
        place: Catalyst Bay
        scene: >
          Kaur has two charges on the bench: the spent 1 from sol 288 and a fresh 1 still in its
          sealed can. Sundqvist's proposal assumes a better catalyst would raise the methane a pass
          can give.
        assumes:
          - a catalyst offers a reaction an easier path
          - equilibrium is where the forward and reverse rates match
        takeaway: A catalyst changes how long the balance takes to arrive and leaves the balance where it was.
        format: CHOICE
        question: A better catalyst is fitted at the same temperature and pressure. What changes?
        choices:
          - Equilibrium arrives sooner, and the methane the mixture settles at is the same.
          - More methane at equilibrium, since the easier path favours the forward direction.
          - Neither the speed nor the amount changes, since the bed is already at equilibrium.
          - Less heat is released per mole, since the reaction now takes an easier route to get there.
        answer: Equilibrium arrives sooner, and the methane the mixture settles at is the same.
        why: >-
          A catalyst lowers the activation barrier, and it lowers it by the same amount in both
          directions. Forward and reverse both speed up, their ratio is untouched, and that ratio is
          the equilibrium constant. Nor does the catalyst change how much heat the reaction gives
          out: enthalpy depends on what the molecules are, not on the road taken between them. So a
          better catalyst buys time, which in a plant with a fixed number of sols is worth a great
          deal — and it buys no yield at all.
        rebuttals:
          - An easier path is easier in both directions at once, which is why the ratio between them does not move.
          - The bed leaves short of equilibrium at this flow, which is exactly why the speed matters.
          - Enthalpy is fixed by the starting materials and the products, whatever route joins them.
      - group: PHASE
        task: Order the stages of the cold end, warmest to coldest.
        title: The order the cold end has to work in
        place: Cold End
        scene: |-
          Cho is rebuilding the cold end's written procedure after the blockage, and wants the four stages back in the order the stream meets them. 2 of the 4 exist because of what happened on sol 293.
        assumes:
          - a substance condenses at a temperature that rises with pressure
          - carbon dioxide turns to solid near 195 K at these pressures
        takeaway: Cleaning a stream is cheapest at the warmest temperature that will do it.
        format: SEQUENCE
        why: The stream is cleaned as temperature falls. Each stage sits at a temperature where it can remove one unwanted species before that species harms a colder stage. Compression raises condensation temperatures and can reduce refrigeration demand. Water is removed before it can freeze in the exchanger. Carbon dioxide is trapped at a warmer stage where deposited solid can be managed. Only the cleaned remainder goes to the methane-condensation stage near 112 K. Driving contaminated gas colder wastes energy and creates blockage risk.
        cards:
          - Compress the dry product gas, so everything below condenses at a higher temperature.
          - Hold the stream at 250 K over a desiccant bed to take the water out as vapour.
          - Chill to 190 K across the trap, where carbon dioxide leaves as a solid.
          - Take the remainder to 112 K, where methane runs as a liquid into the tank.
        order: [0, 1, 2, 3]
  # ---------------------------------------------------------------- sol 296
  - title: Water is the whole plant
    objective: Find the feed that actually caps the plant, and what it costs to clean.
    briefing: The bed is fine and the stacks are fine, and the plant made 11 kilograms again.
    stake: >-
      Sol 296, and for the third sol running the plant has made about 11 kilograms with a bed
      that could do more. Sora Nakagawa, who cuts the ground the water comes from, has been working
      poorer ice for a week: eight per cent water by mass in the spring, four and a half this
      morning, and the machine cannot go deeper fast enough to make it up. Abiola's holding tank is
      brine rather than water, and it stays liquid at temperatures that ought to have frozen it
      solid. Today you find out how salty that has to be to behave that way, what the stacks do
      with the voltage above the minimum, and which way the loop is running right now. Everything
      downstream is waiting on one tank.
    takeaway: The step that limits a plant is not the step anybody is arguing about.
    stops:
      - group: SOIL
        task: Work out how much salt the brine is carrying
        title: The tank that will not freeze
        place: Water Plant
        scene: |-
          The holding tank sat at minus 40 overnight and drained as a liquid this morning. Abiola has the analysis: magnesium perchlorate, and a great deal of it. He wants the freezing point that concentration implies.
        assumes:
          - a dissolved salt separates into ions in water
          - the freezing point of pure water is 273 K
        takeaway: In the ideal colligative model, freezing-point depression scales with the number of dissolved particles, not their chemical identity.
        format: BALLPARK
        question: Estimate how far this brine's freezing point falls below that of pure water.
        why: Dissolved particles lower the chemical potential of liquid water and make freezing occur at a lower temperature. In the ideal colligative model, the size of that shift depends on the number of dissolved particles. Magnesium perchlorate contributes three ions per formula unit, so the van ’t Hoff factor is three in the course calculation. At 8 molal the solution is extremely concentrated, so real ion interactions make the ideal 45 K estimate only a rough magnitude. The calculation still shows why this brine remains liquid far below 0 °C.
        estimate:
          prompt: The tank holds magnesium perchlorate at 8.0 moles per kilogram of water. Each formula unit gives one magnesium ion and two perchlorate ions.
          question: Estimate how far this brine's freezing point falls below that of pure water.
          labels:
            - 3  (particles released per formula unit)
            - 1.86 K kg/mol  (freezing-point constant of water)
            - 8.0 mol/kg  (molality of the brine)
            - 0.51 K kg/mol  (boiling-point constant of water)
            - 223 g/mol  (molar mass of magnesium perchlorate)
          values: [3, 1.86, 8, 0.51, 223]
          slots: 3
          template: "{0} × {1} × {2}"
          formula: a*b*c
          correct: [0, 1, 2]
          target: 44.6
          tolerance: 3
          units: K
          solution: ΔTf = 3 × 1.86 × 8.0 ≈ 45 K below the freezing point of pure water.
          explanation: The particle count is what matters, so a salt giving three ions counts three times. The boiling-point constant and the molar mass belong to other questions.
          relationship: "ΔTf = i × Kf × m: the freezing point drops by the particle count i times the water constant Kf times the molality m."
      - group: ELEC
        task: Account for the voltage above the thermodynamic minimum
        title: What the extra volt is doing
        place: Electrolysis Hall
        scene: |-
          The water stack needs 1.23 volts a cell in principle and Achebe runs it at 1.75. The difference is half a kilowatt across the stack, and Demir wants to know whether that energy ends up in the hydrogen.
        assumes:
          - a cell has a minimum voltage set by the thermodynamics of the reaction
          - electrical power is current times voltage
        takeaway: A cell run fast costs more per mole than a cell run slowly, and the difference leaves as heat.
        format: CHOICE
        question: Where does the energy from the extra half-volt a cell end up?
        why: The thermodynamic minimum voltage pays for the free-energy increase of splitting water. Any voltage above that minimum is overpotential. It is the extra cost of driving useful current through real electrodes and electrolyte. Part of that cost comes from electrical resistance. Part comes from slow electrode steps that need additional driving force. The extra electrical energy ends up mainly as heat in the stack. Hydrogen made at 1.75 V is chemically the same product as hydrogen made closer to the reversible voltage.
        choices:
          - It leaves the stack as heat, and the hydrogen carries the same energy either way.
          - It is stored in the hydrogen, which comes out at a higher energy than at 1.23 volts.
          - It is spent making the reaction go, since below that voltage no water would split.
          - It goes into warming the water feed, which raises the amount each coulomb can split.
        answer: It leaves the stack as heat, and the hydrogen carries the same energy either way.
        rebuttals:
          - Hydrogen is hydrogen, and the energy stored in it depends on the molecule rather than on the cell that made it.
          - Below 1.23 volts the reaction genuinely stops, and that first 1.23 is not the half-volt in question.
          - Some of the heat does warm the feed, and warming water does not change what a coulomb can split.
      - group: EQUIL
        task: Calculate the reaction quotient from the snapshot and compare it with the equilibrium constant.
        title: Compute which way it runs
        place: Reactor Hall
        scene: Herrera freezes the 09:40 gas-analyser screen before the loop has settled. 4 partial pressures sit beside the equilibrium constant for 593 K. He wants the direction called before anyone changes a valve.
        assumes:
          - for CO₂ + 4H₂ ⇌ CH₄ + 2H₂O, Qp = PCH₄(PH₂O)² / [PCO₂(PH₂)⁴]
          - Kp is 0.14 at this bed temperature
        takeaway: Q < K drives the reaction forward, Q > K drives it backward, and Q = K is equilibrium.
        format: BALLPARK
        question: Estimate Q from the four partial pressures. Is the mixture driven forward or backward?
        answerText: Q ≈ 0.016, which is well below K = 0.14. The net reaction therefore runs forward and makes more methane and water.
        why: The reaction quotient uses the same pressure expression as the equilibrium constant, but it uses the mixture that exists right now. Here Q is about 0.016 while K is 0.14. The mixture therefore has too little product relative to equilibrium, so the forward reaction is favoured until Q rises to K. The comparison predicts direction, not speed. A poor catalyst could take a long time to close the gap. Temperature can change K itself; the catalyst cannot.
        choices:
          - Making methane, and it will go on doing so until the two figures meet.
          - Consuming methane, since a low quotient means the products are in excess.
          - Nothing at all, since a mixture with a low quotient is already at its balance.
          - Making methane faster than the catalyst can support, which is why the quotient is low.
        answer: Making methane, and it will go on doing so until the two figures meet.
        rebuttals:
          - A low quotient means the products are scarce rather than in excess, which is the opposite reading of the same number.
          - At equilibrium the two expressions are equal, and these two differ by a factor of nine.
          - The catalyst sets how quickly the gap closes and has no say in which side of the balance the mixture sits on.
        estimate:
          prompt: "At 593 K: PCH₄ = 1.0 bar, PH₂O = 0.50 bar, PCO₂ = 1.0 bar, PH₂ = 2.0 bar, and Kp = 0.14."
          question: Choose the four partial pressures needed to calculate Qp, then compare the result with Kp.
          relationship: For CO₂ + 4H₂ ⇌ CH₄ + 2H₂O, Qp = PCH₄(PH₂O)² ÷ [PCO₂(PH₂)⁴]. Compare Qp with Kp to get the net direction.
          explanation: Qp ≈ 0.016 and Kp = 0.14. Because Qp is smaller, the mixture moves toward products. Total loop pressure is not substituted separately into Qp.
          solution: Qp = 1.0 × (0.50)² ÷ [1.0 × (2.0)⁴] = 0.0156 < 0.14, so the net direction is forward.
          givens:
            - PCH₄ = 1.0 bar
            - PH₂O = 0.50 bar
            - PCO₂ = 1.0 bar
            - PH₂ = 2.0 bar
            - Kp = 0.14 at 593 K
          labels:
            - 1.0  (methane partial pressure)
            - 0.50  (water partial pressure)
            - 1.0  (carbon-dioxide partial pressure)
            - 2.0  (hydrogen partial pressure)
            - 0.14  (equilibrium constant Kp)
            - 12  (total loop pressure, bar)
          values: [1, 0.5, 1, 2, 0.14, 12]
          correct: [0, 1, 2, 3]
          slots: 4
          template: "{0} × {1}² ÷ ({2} × {3}⁴)"
          formula: a*b*b/(c*Math.pow(d,4))
          target: 0.015625
          tolerance: 0.002
          units: Qp
  # ---------------------------------------------------------------- sol 297
  - title: The bed walks downstream
    objective: Find out what is happening inside a bed nobody can see into.
    briefing: The reactor's hot spot has moved 30 centimetres down the bed in 9 sols.
    stake: >-
      Sol 297, and Kaur brought in 9 sols of temperature profiles this morning with the hot spot
      moved 30 centimetres down the bed. Output is falling about two per cent a sol against a
      feed that has not changed, and the assay bench has begun reporting carbon monoxide in the
      product where there was none in the spring. Élodie Moreau, who works the transfer lines, has a
      boil-off log that has gone up as well, which may be the same problem or a different one. Today
      you decide what the bed is telling you, work out why a hot reactor makes a gas nobody asked
      for, and put a number on what the tank farm loses standing still. Kaur says the profile means
      the front of the bed is dead; Sundqvist says a bed that hot is doing what hot beds do.
    takeaway: A measurement taken every sol becomes evidence when somebody lays nine of them side by side.
    stops:
      - group: PHASE
        task: Put a number on what the tank loses each sol
        title: What the tank farm loses standing still
        place: Cold End
        scene: |-
          Moreau's log shows the oxygen tank losing liquid on sols when nothing is drawn from it. The tank's insulation lets about 30 watts through, and she wants that expressed in kilograms rather than in watts.
        assumes:
          - a boiling liquid takes in heat without rising in temperature
          - a sol is about 88,800 seconds long
        takeaway: Heat reaching a cryogenic tank is paid for in kilograms rather than in degrees.
        format: BALLPARK
        question: Estimate the oxygen the tank loses to boil-off each sol.
        why: A cryogenic liquid sits near its boiling point. Heat that enters is therefore spent mainly on vaporising liquid rather than raising its temperature. The required energy per kilogram is the latent heat of vaporisation. That turns an insulation leak directly into a propellant-loss rate. 30 watts sounds small, but it acts every second of the sol. Over 88,800 seconds it boils away about 12.5 kg of oxygen. Repeated across many sols, a modest heat leak becomes a major production loss.
        estimate:
          prompt: About 30 watts of heat reaches the liquid oxygen tank. Vaporising liquid oxygen takes 213,000 joules per kilogram.
          question: Estimate the oxygen the tank loses to boil-off each sol.
          labels:
            - 30 W  (heat reaching the liquid)
            - 88800 s  (seconds in a sol)
            - 213000 J/kg  (heat needed to vaporise liquid oxygen)
            - 90 K  (boiling point of oxygen)
            - 32 g/mol  (molar mass of oxygen)
          values: [30, 88800, 213000, 90, 32]
          slots: 3
          template: "{0} × {1} ÷ {2}"
          formula: a*b/c
          correct: [0, 1, 2]
          target: 12.5
          tolerance: 1.5
          units: kg per sol
          solution: 30 W × 88,800 s ÷ 213,000 J/kg ≈ 12.5 kg a sol.
          explanation: Power times time is energy, and energy divided by the heat of vaporisation is a mass. The boiling point and the molar mass do not enter it.
          relationship: Boil-off mass = the heat reaching the tank × the time it reaches it for ÷ the energy needed to vaporise one kilogram.
      - group: GIBBS
        task: Explain the gas nobody asked for
        title: The reaction that likes being hot
        place: Plant Control
        scene: Dana Stern, the analytical chemist, has carbon monoxide rising in the assay each time the reactor set point is raised. Methane falls by almost the same carbon amount. Kaur has the two candidate reactions on the board and wants the temperature effect explained.
        assumes:
          - free energy combines an enthalpy term with a temperature times an entropy term
          - a reaction that takes in heat has a positive enthalpy change
        takeaway: Temperature can change selectivity because competing reactions can have different thermodynamic responses to heating.
        format: CHOICE
        question: Why does the hotter bed make relatively more carbon monoxide?
        why: "Competing reactions must be considered separately. The Sabatier reaction is exothermic, so heating shifts its equilibrium toward reactants. The carbon-monoxide-forming side reaction is endothermic, so heating shifts its equilibrium toward products. Both reactions may also become faster as temperature rises. The important point is selectivity: the two equilibrium constants do not move in the same direction. A temperature set point therefore changes not only total conversion, but also how the carbon feed is divided among products."
        choices:
          - Heating favours the reaction that takes heat in and pushes the other back.
          - Carbon monoxide forms faster than methane does, so a bed running faster makes more of it.
          - The catalyst changes what it makes once it is above 300 degrees.
          - Carbon monoxide is the more stable product, and heat lets the mixture reach it.
        answer: Heating favours the reaction that takes heat in and pushes the other back.
        rebuttals:
          - Both reactions do speed up with temperature, and speed alone would leave the proportions where they were.
          - The catalyst offers both paths at every temperature, and it is the two balances that move.
          - Stability is not one ranking; which product is favoured depends on the temperature being asked about.
      - group: KINET
        task: Say what the moving hot spot means
        title: Reading a bed by where its heat is
        place: Catalyst Bay
        scene: >
          Nine sols of profiles are pinned along the wall in order. The hot spot starts 4
          centimetres into the bed on the first and sits at 34 on the last, with about the
          same peak temperature on every 1.
        assumes:
          - a reaction gives out its heat where it is happening
          - a bed can lose activity in one part and keep it in another
        takeaway: Where a bed is hot is where it is still working.
        format: DIAGNOSIS
        headline: The hot spot has walked 30 centimetres down the bed in 9 sols, at an unchanged peak temperature.
        task: Which explanation fits every reading?
        readings:
          - { zone: Bed profile, label: Hot spot position, value: 4 cm to 34 cm in 9 sols, status: alarm }
          - { zone: Bed profile, label: Peak temperature, value: unchanged, status: normal }
          - { zone: Reactor, label: Pressure drop across the bed, value: unchanged, status: normal, note: rules out packing and fouling }
          - { zone: Feed, label: Composition and flow, value: unchanged, status: normal }
          - { zone: Product, label: Conversion, value: down 2% a sol, status: alarm }
        choices:
          - { label: The front of the bed has stopped working, mechanism: 'Dead catalyst passes gas unchanged, so the heat appears wherever live catalyst begins.' }
          - { label: The gas is finding a channel through the packing, mechanism: 'A channel lets feed past without contacting the catalyst at all.' }
          - { label: The feed has changed and the bed is responding to it, mechanism: 'A leaner feed reacts further into the bed before it gives out heat.' }
          - { label: The thermocouples have drifted along their sheath since the last service, mechanism: 'A sensor problem can move a profile with nothing happening in the bed.' }
        answer: The front of the bed has stopped working
        why: >-
          An unchanged peak temperature is the reading that decides it: wherever the reaction is
          happening it is going as hard as ever, so the catalyst that still works has not been
          weakened. What has changed is how much of the bed is doing it. Unchanged pressure drop
          rules out packing and fouling; unchanged feed rules out the third explanation. A bed dies
          from the inlet end, since that is where the feed is strongest, and conversion falls as the
          working length shrinks.

  # ---------------------------------------------------------------- sol 298
  - title: The assay bench
    objective: Turn current into kilograms, and find out what is actually in the product.
    briefing: Stern has run a full assay on the product stream for the first time since the spring.
    stake: >-
      Sol 298, and Dana Stern, the analytical chemist, has run the first full product assay since
      the spring rather than the two-line check the plant has been living on. Four numbers came off
      it, and one is a compound nobody had been asking about, which means it has been in the stream
      for as long as nobody asked. Achebe wants her stack's output stated in kilograms rather than
      in amps for the same reason. Today you convert a sol of current into a mass of hydrogen, read
      the assay for what each line implies about the loop, and look at how the polishing column
      behaves as it fills. Anaya Bhatt, the ascent vehicle systems engineer, has asked for all three
      before she countersigns another batch into her tanks.
    takeaway: A measurement nobody asks for is a measurement that arrives later at full size.
    stops:
      - group: ELEC
        task: Turn a sol of current into kilograms of hydrogen
        title: From amps to kilograms
        place: Electrolysis Hall
        scene: |-
          1 cell in the water stack carried 640 amps for the whole sol. Achebe wants the hydrogen that represents, worked out from the charge rather than from what the collection line reported.
        assumes:
          - 1 mole of electrons carries 96,485 coulombs
          - splitting water to hydrogen takes two electrons per molecule
        takeaway: Charge and moles are one measurement in two units, once the electrons per molecule are known.
        format: BALLPARK
        question: Estimate the hydrogen one cell should produce over a sol.
        why: Faraday’s law is charge bookkeeping. Current multiplied by time gives total charge. Dividing by the charge required per mole gives moles of hydrogen. Multiplying by hydrogen’s molar mass gives the product mass. Voltage does not enter this amount calculation; voltage controls the energy cost. The result is a theoretical maximum because it assumes every electron contributes to the intended electrode reaction. Comparing this number with collected hydrogen later gives the current efficiency of the real cell.
        estimate:
          prompt: The cell carried 640 amps for 88,800 seconds. Making 1 mole of hydrogen takes 2 moles of electrons, which is 192,970 coulombs.
          question: Estimate the hydrogen one cell should produce over a sol.
          labels:
            - 640 A  (current through the cell)
            - 88800 s  (seconds in a sol)
            - 192970 C/mol  (charge needed for 1 mole of hydrogen)
            - 2.016 g/mol  (molar mass of hydrogen)
            - 1.75 V  (cell voltage)
          values: [640, 88800, 192970, 2.016, 1.75]
          slots: 4
          template: "{0} × {1} ÷ {2} × {3}"
          formula: a*b/c*d
          correct: [0, 1, 2, 3]
          target: 594
          tolerance: 40
          units: g per sol
          solution: 640 A × 88,800 s ÷ 192,970 C/mol × 2.016 g/mol ≈ 594 g.
          explanation: Current times time is charge, charge divided by the charge per mole is moles, and moles times the molar mass is grams. The voltage decides the energy bill rather than the amount.
          relationship: Mass = current × time ÷ the charge needed for one mole of product × the molar mass of that product.
      - group: EQUIL
        task: Match each assay line to what it says about the loop.
        title: Four lines off the assay bench
        place: Reactor Hall
        scene: Stern's assay of the product stream has four lines on it. Herrera wants each one matched to what it implies about the loop before anybody argues about a set point again.
        assumes:
          - the loop returns unreacted gas to the reactor inlet
          - the product stream is dried before it is cooled
        takeaway: An assay is a statement about the process, not only about the bottle it came from.
        format: PROTOCOL
        why: Every line in an assay belongs to a part of the plant. The methane figure is the headline and the least informative. Carbon monoxide is not a contaminant that blew in; it is evidence of a second reaction on the same bed. Unreacted hydrogen is expected in a loop that recycles and would be alarming in one that did not. Water past the drier is a maintenance item that becomes an emergency 200 metres downstream, at 273 K in the exchanger.
        scenarios:
          - Methane at 96.4 per cent of the dry stream.
          - Carbon monoxide at 0.9 per cent.
          - Hydrogen at 2.1 per cent.
          - Water at 400 parts per million after the drier.
        choices:
          - The plant is doing its main job, and the arguments all live in the few per cent left over.
          - A second reaction is running on the same catalyst and taking feed away from the first.
          - Unreacted feed is going round again, which is the recycle working as it was designed to.
          - The desiccant is passing some through, and the cold end is where that arrives.
        mapping: [0, 1, 2, 3]
      - group: SOIL
        task: Say what a full polishing column does
        title: The bed that warns only at the outlet
        place: Water Plant
        scene: |-
          The polishing column is a packed bed of ion-exchange resin with a fixed number of sites in it. Abiola has been asked how the plant would know the column was full, and he says the honest answer is that it would not.
        assumes:
          - an ion-exchange bed swaps unwanted ions for harmless ones
          - a packed bed holds a finite number of ions
        takeaway: A bed with a capacity has two states, and there is no announcement between them.
        format: CHOICE
        question: What happens at the outlet as the exchange front reaches the end of the bed?
        answerText: The outlet stays low until the loading front approaches it, then rises toward the inlet concentration. That breakthrough curve is the warning the plant must monitor.
        why: An ion-exchange bed has a finite number of exchange sites. A loading front moves through the resin as those sites fill. The outlet can stay very clean for most of the run, then rise quickly when that front reaches the end. The transition is called breakthrough. It is not perfectly instantaneous, and the exact curve depends on flow and mass transfer. The practical warning is therefore an outlet measurement. Monitoring conductivity often enough lets the plant act before the effluent reaches the inlet concentration.
        choices:
          - It rises toward the inlet concentration as the exchange front reaches the outlet.
          - It rises steadily from the day fresh resin is installed because every captured ion weakens the whole bed equally.
          - It becomes cleaner just before exhaustion because a heavily loaded resin binds incoming ions more strongly.
          - It remains at a fixed fraction of the inlet concentration throughout the bed’s life.
        answer: It rises toward the inlet concentration as the exchange front reaches the outlet.
        rebuttals:
          - Most of the bed can load while the outlet stays low; the rise comes when the loading front approaches the outlet.
          - A loaded site has less capacity for the next ion, not more.
          - A capacity-limited bed does not remove one fixed percentage for its whole life.

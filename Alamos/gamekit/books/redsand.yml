      support?
    why: "The ideal colligative model counts dissolved particles. In that simplified picture magnesium perchlorate gives
      about three ions per formula unit, so ΔTf = 3 × 1.86 × 8.0 ≈ 45 K. But 8 mol/kg is far outside the dilute range
      where that equation can be trusted for a number. Ions interact, and the real phase behaviour matters a great deal.
      So 45 K is a first guess at the scale, not the tank's certified freezing point. That the brine drained as liquid at

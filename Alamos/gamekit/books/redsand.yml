        task: Work out how much salt the brine is carrying
        title: The tank that will not freeze
        place: Water Plant
        scene: |-
          The holding tank sat at minus 40 overnight and drained as a liquid this morning. Abiola has the analysis: magnesium perchlorate, and a great deal of it. He wants the freezing point that concentration implies.
        guide: >-
          A tank that drained as a liquid at minus 40 is telling you something about how
          much salt is in it. The rule is freezing-point depression: ΔTf = i × Kf × m.
          Molality m is moles of salt per kilogram of water. Kf is a constant belonging to
          water itself. And i is the particle count — how many separate ions one formula
          unit breaks into. That count is what matters here, not how heavy the salt is.
          Two of the five numbers belong to other questions.
        background:
          - >-
              Why dissolved particles lower a freezing point at all. Ice can only form when
              water molecules line up into a crystal. Dissolved particles get in the way of
              that. They do not stop it, but they make it happen at a lower temperature than
              it otherwise would. This is called a colligative property: it depends on how
              many particles are dissolved, not on what they are.
          - >-
              Why the particle count is the whole trick. Magnesium perchlorate is
              Mg(ClO₄)₂. Put it in water and it does not stay whole. It breaks into one
              magnesium ion and two perchlorate ions — three separate particles from one
              formula unit. So it depresses the freezing point three times as much as
              something that dissolves in one piece. That factor of three is i, the van 't
              Hoff factor.
          - >-
              Why 45 K is a magnitude and not a measurement. The rule assumes dissolved
              particles ignore each other. At 8 moles per kilogram they cannot — the tank is
              packed, and real ions attract and crowd. So treat 45 K as showing why this
              brine is still liquid at minus 40, rather than as its true freezing point.
        assumes:
          - a dissolved salt separates into ions in water
          - the freezing point of pure water is 273 K
        takeaway: In the ideal colligative model, freezing-point depression scales with the number of dissolved particles, not their chemical identity.

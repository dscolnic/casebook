- title: The poison in the spent charge
  objective: Find out what has been taking the bed apart, and for how long.
  briefing: The spent catalyst finally supplies evidence that can separate heat damage from poisoning and date when the 
    real failure began.
  stake: >-
    On sol 299 the spent charge came out of the bed overnight with normal grains and little carbon. Its inlet end is
    rich in chlorine, which points away from heat and toward a poison. Today you name the cause and say when the path
    opened.
  takeaway: The plant was arguing about temperature while a contamination path was taking the catalyst away.
  stops:
  - group: KINET
    task: Which explanation fits every finding?
    title: One line off the spent charge
    reason: >-
      The dead charge was cut into three sections and assayed, and the findings are already on the board
    place: Catalyst Bay
    scene: "The spent charge was assayed in three sections: the first 20 millimetres, the middle, and the outlet end. Kaur
      has the five findings on the board and is no longer sure of her own explanation."
    guide: >-
      Kaur has stopped trusting her own explanation, which is the right moment to look at the material rather than the plant.
      Each of the four candidates would leave its own mark on the catalyst itself. Heat damage shows up in the size of the
      metal particles. Coking shows up as carbon on the surface. A bad batch shows up everywhere at once. So take each one
      and ask what the assay ought to show if it were true. Then read the five findings.
    background:
    - >-
      How a catalyst dies of heat, and what it leaves behind. The nickel works as tiny particles, because small particles
      give a great deal of surface for their mass. Run them hot enough for long enough and neighbouring particles merge into
      bigger ones. That is sintering, and it destroys surface without destroying any nickel. It is permanent, and it is visible:
      the particles are measurably larger.
    - >-
      How poisoning can move down a bed. A poison in the feed reaches the inlet first. If the surface catches it there,
      the front loses activity before the back. The damage moves deeper as those sites fill. A chlorine-rich inlet with a
      clean outlet supports a chlorine-bearing poison. It does not show the exact form chlorine took through each earlier step.
    - >-
      Why two causes with one symptom are settled in the material. Sintering and poisoning both look identical from the control
      room. Conversion falls; the hot spot moves. Neither reading tells them apart. The catalyst itself does. Particle size
      answers the first question, surface chlorine answers the second, and a sealed can sat on a shelf for eleven sols holding
      both answers.
    assumes:
    - a catalyst can lose activity by heat or by a substance binding to it
    - heat makes small metal particles merge into larger ones
    takeaway: Two causes with one symptom are told apart in the material rather than in the plant readings.
    format: CHOICE
    why: "One material clue settles the competing explanations. Normal nickel grain size rules out sintering. The small
      carbon trace rules out coke. The outlet is still active, so the whole charge was not bad. What remains is 1.9 percent

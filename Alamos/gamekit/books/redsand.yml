        value: 48
        display: 48 g-equivalent
        hidden: true
      tolerance: 3
      hint: All rows are written in hydrogen-equivalent grams. Count the measured product and any real downstream 
        storage or loss before deciding what must be assigned to the cell itself.
    answerText: The ledger is short by about 48 g of hydrogen-equivalent charge. The cell collected 546/594 ≈ 92% of the
      Faraday-law maximum, so its current efficiency is about 92%.
    why: Current times time gives charge. Faraday’s law turns that charge into a mass of product, because each electron 
      makes a fixed amount of hydrogen. This run's charge is worth about 594 grams. Only 546 were collected. The line 
      inventory and the measured vent loss both sat still, so the missing 48 grams are not hydrogen hiding downstream. 
      They are charge that crossed the cell and did something other than make collectable hydrogen. 546/594 is about 92 
      per cent. That ratio is the cell's current efficiency for the run.

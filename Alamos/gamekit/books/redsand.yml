    title: Where 8% of the charge went
    at: stack
    reason: >-
      The stacks are billed for every amp, and less hydrogen comes out than the current says it should
    concept: "Current efficiency: the gap between charge passed and product collected"
    place: Electrolysis Hall
    scene: The cell held 640 amps for a full sol. Faraday’s law predicts about 594 grams of hydrogen, but the separator 
      collected only 546. Achebe has already checked the collection-line pressure and the hydrogen inventory downstream.
    guide: >-
      Achebe has done the sensible checks already, so start where she left off. Faraday's law turns charge into a mass of
      product. 640 amps held for a sol should give about 594 grams of hydrogen. The separator collected 546. She has cleared
      the collection line and the inventory downstream, so nothing is hiding in a pipe. Read every stream on the ledger. Then
      count only what genuinely belongs in it.
    background:
    - >-
      What Faraday's law claims. Every electron that crosses the cell makes a fixed amount of hydrogen — two electrons for
      each molecule of H₂. So the predicted mass is arithmetic on the charge. It is an upper bound rather than a forecast.
      It assumes every single electron did the job it was sent to do.
    - >-
      Why the gap is a measurement and not an error. Electrons that did something else still crossed, and still counted as
      charge. Some drove a side reaction at the electrode. Some ran as a shuttle current, carrying charge back and forth to
      no purpose. Some made hydrogen that recombined inside the cell before it ever reached the separator. What is left over
      measures how much of the current did useful work. That fraction has a name: current efficiency.
    - >-
      Why checking the line first was right. A leak would explain the whole gap. So would hydrogen standing in the collection
      line that was not standing there yesterday. Neither says anything about the cell. Ruling both out is what turns an awkward
      discrepancy into evidence about the electrochemistry.
    assumes:
    - Faraday’s law converts charge into a theoretical amount of product
    - current efficiency is collected product divided by theoretical product from charge
    takeaway: Faraday’s law fixes the theoretical product from charge; current efficiency measures how much of that 
      charge reached the intended reaction.

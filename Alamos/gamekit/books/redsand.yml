      - group: SOIL
        task: Sort the regolith samples before the hopper is charged.
        title: Worth digging, or worth leaving
        takesAsRead:
          - "Intermolecular forces, and why they set a boiling point"
        concept: "Phase changes, and that every substance has its own temperature for one"
        place: Regolith Yard
        scene: The hopper takes one charge at a time and the digging arm has brought in more than it can process. Some of what is out there gives up water when it is heated. The rest costs the same power and returns nothing.
        guide: >-
          You have more material than the hopper can take, so the whole job is deciding
          what is worth heating. One thing decides it: whether heat gets water back out of
          the sample. Hydrated minerals will, because they have water locked into the
          crystal itself, and so will buried ice. Dry basaltic dust will not, however
          promising it looks. Judge each sample on what it gives up, not on where the arm
          found it.
        background:
          - >-
              Why this is the plant's first decision. Every charge costs the same heating
              energy whatever is in it, and energy is the thing this station has least of. A
              hopper charged with dry dust has spent a sol's margin on nothing.
          - >-
              What heating a hydrated mineral actually does. The water in these minerals is not
              damp. It is built into the crystal, held in place as part of the structure. Heat
              breaks it loose and it leaves as vapour. The process is called dehydration, and
              it needs a few hundred degrees rather than a warm morning.
              What is left behind is the same mineral with its water gone.
          - >-
              What holds water here, and in what way. Hydrated sulphates and clays hold it
              chemically — water molecules built into the crystal, which come off at a few
              hundred degrees. Buried ice holds it as ice, and gives it up far more cheaply.
              Weathered basalt, volcanic glass and windblown fines are anhydrous: no water in
              the structure to release. They are also most of what the arm reaches.
        assumes:
          - some minerals hold water that heating can drive off
        takeaway: Every charge costs the same energy, so what is in it is the whole decision.
        format: BELT
        question: Send each sample to the bin that says whether heat gets water back out of it.
        answerText: Hydrated minerals and buried ice go left and pay for their heat. Dry fines and glass go right, and heating them spends the sol's margin on nothing.
        why: >-
          Water is the input the whole plant runs on, and heating is how it is got back. So the
          only question worth asking of a sample is whether heat gets water out of it. Hydrated
          sulphates and clays say yes. The water is built into the crystal and comes off at a few
          hundred degrees. Buried ice says yes more cheaply still. Weathered basalt, volcanic
          glass and the windblown fines are anhydrous — no water in the structure at all. They
          also cover most of the site, and they look exactly like the material that does hold
          some. That is why the sorting happens out in the yard and not at the hopper. The cost
          of getting it wrong is not the sample. It is the charge. The heater draws the same
          power whatever is in it. A hopper of dry dust has spent a sol's margin making steam
          that was never there.

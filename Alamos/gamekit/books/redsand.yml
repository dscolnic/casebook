  - group: SOIL
    task: Decide what the water plant does with no drill
    title: Running the plant with no digging
    reason: >-
      The drill is off and the hopper is empty, so how long the tank lasts decides the rest
    concept: Per-pass conversion against overall conversion, and what a recycle loop buys
    place: Water Plant
    scene: The drill is off and the hopper is empty. The holding tank still contains 1,100 litres, while the reactor 
      draws about 60 litres per sol. Abiola is asked whether the whole water plant must stop.
    guide: >-
      The drill has stopped and Abiola is being asked whether everything downstream stops with it. Do the arithmetic before
      you read the options. Eleven hundred litres in the tank, sixty litres a sol going to the reactor. How many sols is that?
      Then ask of each option whether it stores water or makes it, because those are not the same kind of help. And remember
      what the Sabatier reaction puts out besides methane.
    background:
    - >-
      What a buffer does for a plant. A buffer is a store that sits between two steps. Steps in a chain run at their own rates and break at their own times. A tank between
      two of them lets the upstream one stop without the downstream one noticing. Eleven hundred litres at sixty a sol is
      about eighteen sols of cover, and no storm recorded at this site has lasted that long. The tank is not spare capacity.
      It is the reason a stopped drill is not a stopped plant.
    - >-
      Why the reaction gives some water back. CO₂ + 4H₂ → CH₄ + 2H₂O. Two moles of water come out for every mole of methane.
      The cold end condenses that water on its way down. Returned to the loop, it is water the drill did not have to cut.
      The plant is therefore not simply consuming water. It is recycling part of its own output.
    - >-
      Why the other two candidates cannot help. A polishing column holds ions on a resin, not litres in a vessel — there is
      no useful volume in it. And a condenser pulls water out of a stream that already has water in it. The atmosphere here
      is six millibars and nearly dry, so there is nothing out there to condense.
    assumes:
    - the reactor's water demand is met from a holding tank rather than from the drill directly
    - the Sabatier reaction makes water as well as methane
    takeaway: A buffer between two steps is what lets one of them stop without the other one noticing.
    format: CHOICE
    question: A recycle loop puts back what one pass did not use. With the drill stopped, what lets the reactor keep
      running through a storm?
    why: "Two buffers stand between the reactor and the drill. The first is stored water. 1,100 litres at 60 a sol is about
      18 sols of cover, and that is longer than any storm recorded here. The second is the reaction itself: CO₂ + 4H₂ → CH₄
      + 2H₂O makes two moles of water for every mole of methane. The cold end condenses part of that back into the loop. So
      digging can pause without the reactor stopping. Which is the wider lesson — a plant survives a broken machine on the
      inventories between its steps, not on the machines."
    choices:
    - The holding tank, plus the water the reaction itself gives back into the loop.
    - The condenser, which pulls water vapour out of the atmosphere at six millibars.
    - The polishing column, which stores clean water inside its resin bed.
    - Nothing does; the reactor has to stop with the drill and restart afterwards.
    answer: The holding tank, plus the water the reaction itself gives back into the loop.
    rebuttals:
    - The atmosphere here holds almost no water vapour, and the condenser works on the hopper stream instead.
    - An exchange bed holds ions rather than water, and it holds no useful volume.
    - Restarting a cold reactor costs a sol of production, which is exactly what the buffer exists to avoid.

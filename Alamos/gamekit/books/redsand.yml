- title: Three failures after the storm
  objective: Rank three faults that arrived together, and act on them in that order.
  briefing: The storm leaves three urgent problems, and the plant must rank them by irreversible loss rather than by 
    which alarm sounds loudest.
  stake: >-
    On sol 421 the storm has passed overnight and left three faults behind. Oxygen is boiling off, the battery is low,
    and the catalyst test is late. Today you rank the three and decide which is fixed first.
  takeaway: Three reasonable people wanting to be first is a ranking problem rather than an argument.
  stops:
  - group: PHASE
    task: Build the heat path in order, and name the handover the dust has made the worst one.
    title: Follow the heat to the sky
    at: fridge
    reason: >-
      Oxygen boil-off has more than doubled since the storm, and the fault is somewhere on the heat path
    concept: "Boil-off: heat into a boiling liquid is a mass, not a temperature"
    place: Cold End
    scene: Oxygen boil-off has jumped from 12 to 26 kilograms a sol since the storm. Moreau opens the refrigerator
      diagram beside the tank. The jacket pressure is normal. The compressor is already working as hard as it can.
    guide: |-
      Twice as much oxygen is boiling away, and nothing is broken. So something on the heat path has changed.

      Follow the heat. It starts in the cold liquid oxygen. It has to end up somewhere outside the station. Every step in between is a handover — one thing passing heat to the next thing.

      Build the path in order first. Then ask which single step is now holding the whole chain up. Two of the readings are evidence about that. Use them.
    background:
    - >-
      Why boil-off is really a heat measurement. Liquid oxygen sits at its boiling temperature, so every joule that
      reaches it turns some liquid into gas. Nothing warms up. Something boils away instead. So 12 kilograms a sol
      becoming 26 says heat is arriving about twice as fast as before. The tank has not changed. What reaches it has.
    - >-
      What a refrigerator really does, and where the heat ends up. It does not destroy heat. Nothing does. It picks
      heat up in a cold place and puts it down in a warm one. The compressor makes the fluid hot enough to give the
      heat away. But it still has to give it to something. On a planet with no water and thin air, the only thing left
      is the sky. A radiator plate is how you talk to the sky.
    - >-
      Why a chain is only as strong as one link. Heat has to make every handover to get out. Fail one and the whole
      path backs up, however well the rest are working. So a compressor already at its limit is not the cause of the
      extra heat. It is the reason none of the extra can leave. And dust on a radiator breaks nothing. It just makes
      the last handover worse, and that is enough.
    assumes:
    - a refrigerator has to reject its heat somewhere
    - dust settles on any surface left out in a storm
    takeaway: A refrigerator can stop keeping up because heat cannot leave its warm end, even when nothing is
      broken.
    format: CHAIN
    question: Follow the heat from the liquid oxygen to the place it finally goes. Which handover is holding the rest
      up?
    chain:
      hint: Build only the handovers heat has to make to get from the tank to the outside. Then pick the link the
        normal readings rule out, and the link the dust has made worse.
      links:
      - id: evaporator
        label: Liquid in the tank → the cold coil
        transfers: heat moves out of the liquid oxygen and into the fluid
      - id: compressor
        label: The compressor squeezes the fluid
        transfers: makes the fluid hot enough that it can give its heat away
        reading: at current limit
      - id: condenser
        label: Hot fluid → the radiator plate
        transfers: moves the heat out of the fluid
      - id: radiator_sky
        label: Radiator plate → the cold sky
        transfers: sends the heat away from the station for good
        reading: dust-covered after the storm
      - id: vacuum_jacket
        label: Outside → the tank through the insulation
        transfers: heat leaking the wrong way, into the tank
        reading: pressure normal
      distractor: compressor
      order:
      - evaporator
      - compressor
      - condenser
      - radiator_sky
      governing: radiator_sky
    answerText: The handover holding the rest up is the dusty radiator giving its heat to the sky. The compressor is
      working and the insulation is fine. It is the last step that has lost its capacity.
    why: A refrigerator does not destroy heat. It moves it. Heat leaves the tank into the fluid. The compressor makes
      that fluid hot enough to be rid of it. The condenser hands the heat to the radiator, and the radiator gives it
      to the sky. Every step is a handover, and the chain is only as good as its worst one. The jacket is a different
      path — heat leaking in — and its normal pressure rules that out. Dust has weakened the last handover of all. So
      the cold end warms while the compressor runs flat out, and nothing has failed.
  - group: KINET
    task: Set the terms of a fair comparison
    title: Comparing two charges honestly
    reason: >-
      The new charge has to be judged against the old one, and the plant is not where it was then
    place: Catalyst Bay
    scene: |-
      Kaur wants the new charge compared against the sol-270 run before it is trusted with the rest of the season. The plant is at a different temperature, flow and pressure than it was on sol 270.
    guide: >-
      Kaur wants to know about the charge, and only about the charge. But conversion answers to four things at once: temperature,
      pressure, flow, and the catalyst itself. Three of those are settings you choose. One is the thing being tested. So ask
      of each option whether it removes the other explanations, or quietly adds another one. A comparison is only about the
      variable you deliberately changed.
    background:
    - >-
      What a controlled comparison is for. Conversion has four inputs here, and you only want to learn about one of them.
      So hold the other three still. Then any difference you measure has nowhere else to have come from. This is what people
      mean by controlling a variable, and it is the entire reason the sol-270 settings are worth digging out of a log.
    - >-
      Why best-for-each is the tempting wrong answer. It sounds generous and it sounds rigorous. But suppose charge A runs
      at 580 K and charge B at 600 K. The two conversion figures now differ by the charge and by 20 degrees, with no way to
      separate them afterwards. Two numbers measured under different conditions cannot be subtracted. They are answers to
      two different questions.
    - >-
      Why more data does not repair an unmatched comparison. A whole sol of each charge gives you a much more precise measurement
      of the wrong quantity. Scatter shrinks; the confusion does not. That is worth remembering generally: precision and validity
      are separate properties, and only one of them improves by running longer.
    takesAsRead:
    - "Stoichiometry as a feed rate: turning a production target into kilograms in"
    assumes:
    - conversion depends on temperature, pressure, flow and the catalyst together
    - a comparison is only about the variable that was deliberately changed
    takeaway: A comparison is worth what its matched conditions are worth.
    format: CHOICE
    question: What has to be true for a comparison between two charges to mean anything?
    why: Conversion answers to four things at once. Temperature, pressure and flow are settings you choose. The catalyst
      is the thing being tested. Let the settings differ between two runs and the comparison mixes the charge in with 
      the conditions, with no way to pull them apart afterwards. Match the settings to sol 270 and those other 
      explanations are gone, so what is left can fairly be credited to the charge. Running each at its own best 
      condition sounds fairer and is not. It produces two numbers that cannot be subtracted.
    choices:
    - Temperature, pressure and flow are set to the sol-270 values before conversion is read.
    - Both charges are run at whatever conditions produce their best conversion.
    - The comparison uses a whole sol of production from each charge.
    - Both are compared at the same time of sol, so the ambient conditions match.
    answer: Temperature, pressure and flow are set to the sol-270 values before conversion is read.
    rebuttals:
    - Best-for-each conditions produce two numbers that cannot be compared, since the settings differ along with the 
      charge.
    - A whole sol of each is more data about an unmatched comparison, which does not repair it.
    - Ambient conditions outside barely reach a reactor held at 593 K, and the loop's own settings are what matter.
  - group: GIBBS
    task: Rank three faults against each other
    title: Which of the three cannot wait
    reason: >-
      There is power to fix one fault today, and the order has to go in the log with its grounds
    place: Plant Control
    scene: >
      The three problems are on the board with the power to fix one of them today. Wells wants the order and the grounds for
      it in the log before anybody starts work.
    guide: >-
      Three people want to be first and all three have a case, so the ranking has to come from something other than who is
      asking. Use the same test you used on the storm plan. For each job, ask what the delay actually costs. Some delays cost
      time, and time can be made up. One of them is spending something the station has already made, every sol it waits. That
      is not the same kind of cost.
    background:
    - The difference between a delay and a loss. Some jobs sit in a queue and cost nothing while they wait. The battery 
      bank refills on the next clear sol. The comparison run is information, and information keeps. Other jobs are 
      spending something every sol they are not done. Fourteen extra kilograms of oxygen a sol is propellant that took 
      array output to make, and it is gone. Rank by that, not by urgency of tone.
    - Why boil-off is the one that cannot wait. The oxygen in that tank is stored work. Sols of power went into 
      splitting the water and cooling the product. Let it boil and there is no recovering it. You have to start again 
      from atmosphere and ice. Every other job on this board can be picked up on the next clear sol for exactly what it 
      would have cost on 421.
    - Why finishing something is not a reason to choose it. Picking the job that fits in a sol ranks by convenience. It 
      feels like progress because something gets closed, and it says nothing about what the other two cost while they 
      wait. A ranking has to be about consequences. Neatness is not one.
    assumes:
    - propellant vented from a tank cannot be recovered
    - a comparison run and a battery charge can both be done later
    takeaway: What cannot be undone goes first, whatever is loudest.
    format: CHOICE
    question: Which of the three is dealt with first?
    choices:
    - The radiator, since every sol of doubled boil-off is propellant that leaves for good.
    - The battery bank, since another storm without reserve would stop the whole station.
    - The charge comparison, since the season's production depends on knowing the bed is good.
    - Whichever can be finished today, since a finished job is worth more than a started one.
    answer: The radiator, since every sol of doubled boil-off is propellant that leaves for good.
    why: >-
      Rank by what the delay costs, and whether it can be got back. Boil-off is the loss of something already made. Fourteen
      extra kilograms a sol, and no later work returns them. Batteries recharge on the next clear sol at no permanent cost.
      A comparison run is information, and information waits for nothing so long as the bed is watched. Only one of the three
      is spending an asset while it sits in the queue. That is the one that goes first.
    rebuttals:
    - The battery bank refills on the next clear sol at no permanent cost, and one has been forecast.
    - The comparison matters and loses nothing by waiting two sols, since the bed is under watch.
    - Choosing by what fits in a sol ranks by convenience and ignores what each delay is costing.


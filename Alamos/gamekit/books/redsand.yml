  - group: ELEC
    task: Match each item on Achebe's board to what it does.
    title: Which electrode does which job
    at: stack
    reason: >-
      This hall is the only source of hydrogen on the station, so start by learning how its cells work
    place: Electrolysis Hall
    scene: |-
      The hall runs two kinds of cell: one splits water, the other splits carbon dioxide at 800 degrees. Rosalind Achebe, the power and electrolysis engineer, has the four parts listed on the board.
    guide: >-
      Achebe's board is really one question asked four times: what is this item for? Two of them are electrodes. An electrode
      is named by which way electrons move there. In means reduction, a gain of electrons. Out means oxidation, a loss. One
      item is the electrolyte sitting between the two, and it has a job of its own. The last is not part of the cell at all,
      so ask whether it settles a direction or an amount.
    background:
    - >-
      Why an electron transfer always has two halves. Each of these reactions is one substance losing electrons and another
      gaining them. The two always happen together. Nothing loses electrons with nobody there to take them. Oxidation is the
      losing half; reduction is the gaining half. A cell's trick is to make those two halves happen a few centimetres apart.
    - >-
      What the electrolyte does, and why it has to refuse electrons. Charge has to get back somehow or the cell stops in a
      moment. The electrolyte lets ions carry it — here oxide ions, O²⁻, crossing the solid. What it will not carry is electrons.
      That refusal is the whole design. The electrons have no way home except the outside wire. That is where the work gets
      done, and where the current is measured.
    - >-
      Why the current setting is a different kind of thing. The two electrodes and the electrolyte decide what happens. The
      current decides how much. Faraday's law makes that exact. A fixed amount of charge is a fixed number of moles, because
      each molecule of product needs a set number of electrons. Two for a molecule of hydrogen. Four for one of oxygen. Charge
      is not a rough guide to yield. It is the count.
    takesAsRead:
    - "Stoichiometry as a feed rate: turning a production target into kilograms in"
    assumes:
    - oxidation is loss of electrons and reduction is gain of electrons
    - a current is a flow of charge
    takeaway: The two halves of one electron transfer can be run in separate places, so long as something carries an ion
      between them.
    format: PROTOCOL
    why: >-
      Electrolysis splits one electron transfer into two places. At the cathode the supply pushes electrons in, so whatever
      is there gains them — that is reduction. At the anode electrons are pulled back out, so whatever is there loses them
      — that is oxidation. The electrolyte between carries ions across and refuses electrons, which forces the circuit through
      the wire and keeps the two products apart. The current setting is different in kind: by Faraday's law, charge is moles,
      so it fixes the amount rather than the direction.
    scenarios:
    - The cathode, where the supply pushes electrons into the stream.
    - The anode, where electrons are pulled back out.
    - The solid electrolyte between them.
    - The setting on the power supply.
    choices:
    - "Reduction: carbon dioxide takes electrons in here, and leaves an oxide ion behind."
    - "Oxidation: oxide ions give their electrons up here, and leave as oxygen gas."
    - It carries oxide ions across and refuses electrons, so the circuit has to run through the wire.
    - It sets how many moles a sol the cell can make, because charge and moles go together exactly.
    mapping: [0, 1, 2, 3]
  - group: GIBBS
    task: State which of the plant's steps have a bill
    title: What has to be paid for
    at: ledger
    reason: >-
      The hot run borrowed power from somewhere, and nobody has said which steps cost energy and which give it back
    concept: Exothermic and endothermic, and heat as something on one side of the equation
    place: Plant Control
    scene: Yusuf Demir, the life support officer, has the sol’s energy ledger open. The reactor releases heat while it 
      runs, while electrolysis takes most of the array output. He wants the difference stated plainly in the log.
    guide: >-
      Demir wants the direction written down as a number, and the number is the free-energy change: ΔG = ΔH − TΔS. Splitting
      water has a known enthalpy change, ΔH. That is the heat it takes in. It has a known entropy change too, ΔS, which is
      how much more spread out things end up. A positive ΔG means the change will not run on its own. One warning before you
      place the tiles. One is in joules and the others in kilojoules, so it wants converting rather than adding.
    background:
    - >-
      What the two terms are doing. The enthalpy term, ΔH, is the heat the change takes in or gives out. The entropy term,
      ΔS, is how much more spread out the matter and its energy end up — and it is multiplied by the temperature. That multiplication
      is why heating something can turn a change that will not run into one that will.
    - >-
      Why a positive answer is a bill. A positive free-energy change means the products sit higher than the reactants, so
      the energy has to come from outside the reaction. Here it comes from the solar array, through the cell, at a price in
      kilowatt-hours that the ledger on Demir's desk has to carry.
    - >-
      Why the reverse is free. Making methane is water splitting run backwards, and it gives out what the splitting takes
      in. That is one number with two signs, not two separate facts. It is why this plant can run one step on its own and
      never the other.
    assumes:
    - some reactions give out heat and others take it in
    - electrical energy can be counted in kilowatt-hours
    takeaway: Whether a change runs on its own and how fast it goes are two separate questions, and one of them has a 
      bill.
    format: BALLPARK
    question: The free-energy change says whether a reaction runs on its own. What is it for splitting a mole of water 
      at the cell's working temperature?
    answerText: About +237 kJ per mole. It is positive, so the change does not run on its own at any temperature the 
      cell can reach, and the array has to pay for it.
    why: "Direction is set by the free-energy change: ΔG = ΔH − TΔS. Splitting a mole of liquid water takes in 286 kJ, so
      ΔH is positive. It makes two gases out of a liquid, so things end up more spread out. ΔS is positive too, at 163 J per
      kelvin per mole. At 298 K the TΔS term is 298 × 0.163 = 48.6 kJ. That leaves ΔG = 286 − 48.6 ≈ +237 kJ per mole. Positive
      means the products sit higher than the reactants, and no change of equipment moves that. The energy has to arrive from
      outside, which is what the array is for. Making methane is the same number with the sign flipped. That is why one step
      runs on its own and the other never will."
    estimate:
      prompt: Splitting a mole of liquid water takes in 286 kJ and raises entropy by 163 J per kelvin per mole. The cell
        works at 298 K.
      question: Choose the enthalpy change, the temperature, and the entropy change in the same units as the enthalpy.
      labels:
      - 286  (ΔH, kJ per mole taken in)
      - 298  (T, the cell's working temperature in K)
      - 0.163  (ΔS in kJ per kelvin per mole)
      - 163  (ΔS in J per kelvin per mole, before conversion)
      - 237  (the answer, if you already knew it)
      values: [286, 298, 0.163, 163, 237]
      slots: 3
      template: '{0} − {1} × {2}'
      formula: a-b*c
      correct: [0, 1, 2]
      target: 237.4
      tolerance: 6
      units: kJ per mole
      solution: 286 − 298 × 0.163 ≈ 237 kJ per mole, and positive means it has to be paid for.
      explanation: A positive free-energy change is a bill. The reverse reaction is the same number with the other sign,
        which is why the reactor runs on its own.
      givens:
      - ΔH = +286 kJ per mole and ΔS = +163 J per kelvin per mole
      - the cell works at 298 K
      relationship: ΔG = ΔH − TΔS. A positive free energy means the change does not run on its own and has to be paid 

- title: The ceiling on heat
  objective: Put a number on how far the temperature argument can be taken.
  briefing: Another temperature increase is proposed, and this time the plant has enough evidence to separate a faster 
    reaction from a better equilibrium.
  stake: >-
    On sol 295 the first hot run has helped, and another 40 °C is asked for. More heat speeds the reaction, but it can
    lower the methane the mixture settles at. Today you work out both effects and decide whether the bed goes hotter.
  takeaway: An argument that has an arithmetic answer should not be settled by seniority.
  stops:
  - group: GIBBS
    task: Work out the free-energy change at the bed's temperature
    title: The temperature the reaction stops wanting to run
    at: ledger
    reason: >-
      The heat argument needs a number, and the thermodynamic data to work one out is on this desk
    concept: The temperature at which a spontaneous reaction stops being one
    place: Plant Control
    scene: "Demir has the plant's simplified table for the Sabatier loop: ΔH = −123.6 kJ/mol and ΔS = −172 J/mol/K over
      the training range. He wants the temperature at which that approximation makes ΔG cross zero. The real plant uses
      data that moves with temperature."
    guide: >-
      Demir has the data sheet and wants ΔG at the bed's own temperature. So this is ΔG = ΔH − TΔS with real numbers in it.
      Both terms here happen to be negative, and they pull against each other once the temperature multiplies the second one.
      That is the interesting part. As the bed gets hotter the second term grows, so somewhere up the scale the whole thing
      changes sign. Five numbers are on the board and two belong to other calculations. Ask of each whether this one needs
      it.
    background:
    - >-
      Why both terms are negative here, and why that matters. Making methane gives off heat, so ΔH is negative and the reaction
      is favoured on those grounds. But five gas molecules go in and three come out. The mixture ends up less spread out than
      it started, so ΔS is negative too. Subtracting a negative TΔS adds a positive amount. Entropy is working against this
      reaction, not for it.
    - >-
      Why the temperature decides which term wins. ΔH does not care how hot the bed is. TΔS does, because T is a multiplier
      sitting right on it. So heating the bed grows the term that opposes the reaction while leaving the term that favours
      it alone. Push far enough and ΔG crosses zero — with these tabulated numbers, near 720 K. Above that the reaction no
      longer runs on its own at all.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label
      is how you catch a unit that does not match, or a quantity belonging to a different problem, before you place it. That
      habit is the whole point of this format.
    assumes:

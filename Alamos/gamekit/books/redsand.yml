  - group: SOIL
    task: Date the change in the water
    title: The trace nobody read
    reason: >-
      His outlet trace has been logged every sol since the plant started, and it can date what happened
    place: Water Plant
    scene: |-
      The conductivity of the water leaving the polishing column is logged every sol. The trace runs flat for 260 sols, steps up over about 4, and runs flat and high from there to this morning.
    guide: >-
      One trace, printed every sol, and nobody had a reason to read it until now. The shape is the evidence, so read the shape.
      Flat for 260 sols. Then four sols of rising. Then flat and high ever since. For each option, ask two things. What would
      the inlet record have to show if that were true? And would it give you a rise over four sols, or something else?
    background:
    - >-
      What conductivity is measuring. Pure water barely conducts electricity at all. Dissolved ions carry charge, so the more
      ions in the water, the better it conducts. That makes a conductivity meter a cheap, continuous count of how salty the
      water is. It cannot say which ion. It can say how many, every sol, for years.
    - >-
      What a breakthrough curve looks like, and why four sols is the tell. A fresh exchange bed keeps the outlet clean while
      it has free sites left. As the loading front reaches the outlet, the reading climbs toward the inlet value and then
      stays there. Low, rise, high. The rise takes as long as the front takes to clear the last of the resin — sols, not hours.
    - >-
      Why the shape rules the other three out. A saltier feed would show in the inlet record too, and the inlet is flat across
      the whole period. A sensor reset happens in one sol, not four. A leak around a seal would have raised the trace from
      the day it was fitted, sloping, with no flat run before it. Only one candidate makes a flat line, a four-sol ramp, and
      a plateau.
    takesAsRead:
    - "Stoichiometry as a feed rate: turning a production target into kilograms in"
    assumes:
    - conductivity rises with the ions dissolved in water
    - an exchange bed holds a fixed number of ions
    takeaway: A step in a record is a date, and a date turns a fault into a history.
    format: CHOICE
    question: What does the shape of that trace say?
    why: The record carries the history. A fresh exchange bed keeps its outlet clean while free sites remain. The reading
      rises as the loading front reaches the outlet, then stays near the inlet level. That low-rise-high shape marks
      breakthrough. A saltier feed would also change the inlet, and a sensor reset would take one sol. This four-sol rise
      dates breakthrough to about sol 261 and opens a path for halide contamination.
    choices:
    - The column filled around sol 261 and has passed the feed straight through since.
    - The feed water got saltier at sol 261 and has stayed that way since.
    - The conductivity sensor was reset against a standard at sol 261 and reads high now.
    - The column has been leaking around its seal at a steady rate since it was fitted.
    answer: The column filled around sol 261 and has passed the feed straight through since.
    rebuttals:
    - The inlet trace is flat across the whole period, so the water arriving at the column has not changed.
    - Resetting a sensor moves a trace within a single sol, and this step took four of them.
    - A steady leak gives a raised, sloping trace from the beginning rather than a flat run and a step.
  - group: EQUIL
    task: Hold temperature and pressure fixed, change one operating variable, reverse it, and determine whether the 
      reactor is rate-limited.
    title: Change the time, not the ceiling
    at: skid
    reason: >-
      A fortnight of argument about the reactor gets one controlled run to settle it
    place: Reactor Hall
    scene: Herrera and Sundqvist have argued for a fortnight about whether the hot reactor is at equilibrium or simply 
      short of reaction time. Stern gives them one controlled run before the production schedule resumes.
    guide: >-
      The number you are watching is conversion — how much of the gas that went in came out as product. Two explanations are
      on the table. Either the gas leaves before the reaction has finished, or it has hit a ceiling the equilibrium sets.
      Three settings can be changed and only one of them tells those apart. Think about which. A response only counts if it
      beats the assay's own scatter. So change one setting, run it, put it back, and name the one conversion follows.
    background:
    - >-
      What the argument is actually about. A reaction that has not finished and a reaction that has hit its limit both give
      a low conversion. On one measurement they read exactly the same. The difference is what they answer to. More time helps
      the first and does nothing at all for the second. So the test has to be a change in time.
    - >-
      What each of the three settings does. Gas flow sets how long the gas spends over the bed. It changes the time available
      and leaves the ceiling where it is. Temperature and pressure both move the ceiling itself. That is why only one of the
      three can separate the two explanations — the other two change both things at once and settle nothing.
    - >-
      Why putting the setting back matters. Plants drift. A bed ages, a heater wanders, a feed composition shifts, and conversion
      moves a little while you work. So a rise after your change might not be your change. Restore the setting and watch conversion
      come back to where it was. That is how you tell your own effect from the plant's own drift.
    takesAsRead:
    - Rate constants, and how steeply they climb with temperature
    - "Stoichiometry as a feed rate: turning a production target into kilograms in"
    assumes:
    - equilibrium is a ceiling that depends on temperature and pressure
    - conversion also depends on how long the gas spends in the bed
    takeaway: Changing residence time at fixed temperature and pressure changes kinetic approach to equilibrium without 
      moving the equilibrium ceiling.
    format: CONTROL
    question: Which controlled change separates a kinetic limit from an equilibrium limit, and does conversion follow it
      on reversal?
    control:
      hint: Change one setting from the baseline, run the assay, then restore it. A useful test changes residence time 
        without moving the equilibrium constant.
      noise: 0.7
      baseline: 64
      observable:
        label: Reading
        unit: "% conversion"
      response: 5
      truth: flow
      variables:
      - id: flow
        label: Gas flow
      - id: temperature
        label: Bed temperature
      - id: pressure
        label: Loop pressure
    answerText: Flow is the separating variable. Halving it at fixed temperature and pressure raises conversion from 64%
      to 69%, and restoring the flow returns it to 64%, showing a rate-limited shortfall.
    why: At fixed temperature and pressure, the ceiling does not care how fast gas crosses the bed. The rate does. So 
      halving the flow doubles the contact time and leaves the ceiling exactly where it was. In this run conversion rose
      from 64 to 69 per cent, well past the assay's own scatter. It came back to 64 when the flow was restored. That 
      means the gas had been leaving before the mixture reached its ceiling. The shortfall was time, not thermodynamics.
      Temperature or pressure could not have answered it, because each moves the ceiling and the rate together.

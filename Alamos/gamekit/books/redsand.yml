      What heating a hydrated mineral actually does. The water in these minerals is not damp. It is built into the crystal,
      held in place as part of the structure. Heat breaks it loose and it leaves as vapour. The process is called dehydration,
      and it needs a few hundred degrees rather than a warm morning. What is left behind is the same mineral with its water
      gone.

  takeaway: A part with no replacement is commissioned by procedure rather than by enthusiasm.
  stops:
  - group: KINET
    task: Order the four operations for bringing the charge into service.
    title: Bringing a charge into service
    at: reduction-furnace
    reason: >-
      The new charge is not a catalyst yet, and there is only one chance to bring it into service
    concept: What a catalyst does, and the two things it cannot do
    place: Catalyst Bay
    scene: |-
      The fresh charge arrives as nickel oxide on alumina, which is not a catalyst yet. Kaur has four operations written out and wants them in an order she can hand to a technician at three in the morning.
    guide: >-
      What arrives in the can is nickel oxide. Nickel oxide is not a catalyst. All four operations will happen, so the question
      is what each one makes possible, or safe. Two things to hold on to. Hydrogen and oxygen together at 350 °C is not something
      you want inside a reactor. And nobody hands full production feed to a charge whose activity is still unknown.
    background:
    - >-
      Why the charge has to be reduced before it works. Nickel does the work here, and what ships in the can is nickel oxide.
      That is nickel with oxygen attached. Pass hot hydrogen over it and the oxygen leaves as water, and nickel metal is left
      behind. This is reduction, the same word as ever: something gained electrons. Until it happens there is no catalyst
      in the reactor. Only its ingredients.
    - >-
      Why the purge is not a formality. The reduction step needs hot hydrogen. If oxygen is still in the vessel when that
      hydrogen arrives, the two react with each other instead, and they do it fast. Nitrogen is used to push the oxygen out
      first because nitrogen reacts with nothing here. It is a step whose only purpose is to make the next step safe.
    - >-
      Why the low-flow check comes before the comparison. There is one spare charge on the planet. A tenth of production flow
      is enough to show whether the bed lights off at all. If it does not, almost nothing has been risked. Only once the bed
      is known to be active is the sol-270 comparison worth running. That run leaves the next crew a number.
    assumes:
    - nickel oxide has to be reduced to nickel metal before it is active
    - hydrogen at temperature will reduce a metal oxide
    takeaway: A part that cannot be replaced is proved at low rate before it is trusted at full rate.
    format: SEQUENCE
    why: Each operation makes the next one possible, or safer. The nitrogen purge removes oxygen before hot hydrogen 
      goes in, because those two react with each other given the chance. Reduction then turns nickel oxide into nickel 
      metal. Until that is done there is no catalyst in the reactor. A light-off check at a tenth of flow shows whether 
      the charge is active, at almost no risk. Only then is a matched comparison against the sol-270 run worth running. 
      It leaves the next crew a number instead of an impression.
    cards:
    - Purge the reactor with nitrogen until no oxygen remains in it.
    - Pass dilute hydrogen at 350 °C to reduce the nickel oxide to nickel metal.
    - Run a light-off check at a tenth of production flow to confirm activity.
    - Match conditions to the sol-270 run and compare conversion against that charge.
    order: [0, 1, 2, 3]
  - group: ELEC
    task: Fund the change that would most alter what the plant does next.
    title: One improvement, four candidates
    reason: >-
      There are parts and crew time for one change to the plant, and four things asking for them
    place: Electrolysis Hall
    scene: The station has parts and crew time for one improvement. One catalyst charge is already lost, and there is no
      spare after the new one. Achebe puts four candidates on the board before anyone starts cutting pipe.
    guide: >-
      Here is what the last fortnight established, and it is worth having straight before you spend anything. The plant ran
      38 sols on water no column was polishing. It lost a catalyst charge to that water. Conductivity was logged on every
      one of those sols, and read by nobody. The array has not been the limit on a single sol this season. There are already
      four probes in the bed. A second column in series would let the lead bed be swapped at breakthrough, and it needs pipe
      and a shutdown. And one catalyst charge is left, with no spare behind it.
    rules: >-
      Spread the hundred points across the 4 proposals. At least 80 of them have to be committed, because a panel that funds
      almost nothing has not decided anything. Your largest single allocation must be 35 or more, and it has to land on what
      the evidence supports most. Keep the total sitting on proposals the evidence does not support under fifteen. And a proposal
      it does support should not be left under twenty.
    background:
    - >-
      Why the whole spread is graded. Funding is not a vote for one idea. A portfolio says three things at once: what you
      think is likely, what is worth hedging against, and what is not worth doing at all. Most of the information is in the
      last two. Backing the right proposal while quietly funding a bad one is a worse answer than it looks. The small numbers
      count as much as the big one.
    - >-
      What the three numbers are for. Thirty-five is what makes a lead a lead. Below it you have hedged rather than chosen.
      Fifteen is the most that can sit on unsupported work before it stops being a rounding error. Past that it is a second
      opinion nobody argued for. Twenty is the floor under work you have already called strong, because funding it too thin
      to finish spends the money and buys nothing.
    - >-
      Why there is a floor on the total. Points held back are not caution. They are a decision not to decide, taken with somebody
      else's money and somebody else's deadline. The floor is what forces the panel to say something.
    takesAsRead:
    - "Stoichiometry as a feed rate: turning a production target into kilograms in"
    assumes:
    - the polishing column gives no warning as it fills
    - the plant has no spare catalyst charge after this one
    takeaway: The work worth doing first is the work that would have caught the fault nobody caught.
    format: SCIENCETANK
    answerText: Fit the conductivity monitor and alarm on reactor feed water. It turns the measurement that already 
      existed into an action before unpolished water reaches the catalyst.
    why: The plant did not lack a measurement. Conductivity was recorded every single sol. What it lacked was a rule 
      that turned the measurement into an action. An alarm on the feed water would have made breakthrough visible while 
      the catalyst could still be saved. A second column adds capacity, and it still needs something to tell you when to
      switch over. Extra array power addresses nothing that failed, and the bed already has four probes. The change 
      worth funding first is the one that closes the gap between a signal you already have and a loss you cannot undo.
    proposals:
    - label: A
      text: Plumb a second polishing column behind the first, so the lead bed can be changed at breakthrough.
    - label: B
      text: Fit a conductivity monitor with an alarm on the reactor feed water.
    - label: C
      text: Add a fourth panel string to the array to raise the power available.
    - label: D
      text: Install a second temperature probe in the catalyst bed.
    recommended:
      A: 45
      B: 35
  - group: PHASE
    task: Decide whether a rising pressure is a leak
    title: The tank pressure that is not a leak
    reason: >-
      The methane tank has been climbing for four sols, and somebody is about to vent it
    place: Cold End
    scene: |-
      The methane tank has gained about 0.3 bar every sol for four sols. The mass inside has not changed at all over the same four sols. Moreau is being asked to vent it.
    guide: |-
      Venting means throwing away rocket fuel. So be sure first.

      Two numbers disagree. The pressure is climbing. The mass is not moving.

      Here is the piece to hold on to. A closed tank with liquid in the bottom always has gas above it, pushing on the lid. How hard that gas pushes has a name: the vapour pressure. And it depends on one thing only — how warm the liquid is.

      Take each of the four answers. Ask what would have to be true for it, then check that against the mass. Mass is the number that cannot be argued with.
    background:
    - >-
      What vapour pressure is. Put a liquid in a sealed tank and some of it leaves as gas. The gas builds up above the
      liquid. It builds until just as many molecules are dropping back in as are leaving. The push that gas makes is
      the vapour pressure. Warm the tank and more molecules have enough energy to escape, so the push settles higher.
    - >-
      Why that turns a pressure gauge into a thermometer. As long as there is liquid and gas together in the tank, the
      push is locked to the temperature. It is not free to be anything else. So a pressure climbing steadily for four
      sols is a temperature climbing steadily for four sols, written in different units.
    - >-
      Why the mass is the reading that decides it. Gas leaving a tank takes mass with it, whether it goes out through
      a leak or out through a vent. There is no way around that. So a flat mass across four sols rules out everything
      that works by losing contents. What is left has to raise the push while keeping every molecule inside. Warming
      is the only one on the list that does.
    assumes:
    - a liquid in a closed tank sits under the push of its own gas
    - that push climbs steeply as the liquid warms
    takeaway: Pressure in a cold tank is a temperature reading, until the mass says otherwise.
    format: CHOICE
    question: The pressure is rising and the mass is not falling. What is happening?
    why: A closed tank with liquid and gas together sits at the push of its own gas, and that push is set by the
      temperature. So while both are there, the pressure gauge is a thermometer. Here the mass has not moved for four
      sols. A leak takes mass out. A vent takes mass out. The flat mass rules out both. That leaves warming, and the
      pressure is following the temperature up. Go and find the heat instead. Venting fuel because a gauge rose spends
      the tank to treat a symptom.
    choices:
    - The contents are warming, and the push from the gas is following the temperature up.
    - Gas is escaping through a leak, even though the measured mass has not changed at all.
    - The liquid is boiling away fast, and that raises the pressure without changing the mass.
    - The gauge must have drifted, because pressure cannot change while the mass stays still.
    answer: The contents are warming, and the push from the gas is following the temperature up.
    rebuttals:
    - A leak big enough to explain this would show up as lost mass. The mass is flat.
    - Boiling moves mass out of the liquid, and raising the push still takes warming.
    - A steady mass does not mean a steady pressure. The temperature can still move.
  # ---------------------------------------------------------------- sol 340
- title: Forty clean sols
  objective: Close the plant's own books while there is nothing to firefight.
  briefing: The replacement charge has held for forty sols on qualified feed, giving the team a quiet checkpoint to 
    reconcile energy, carbon and cryogenic losses.
  stake: >-
    On sol 340 the new charge has held for forty sols since the swap, and the water outlet is still clean. A quiet
    stretch can hide losses behind a good output number. Today you close the energy and carbon ledgers, and ask what the
    tank really gained.
  takeaway: The sol to check the books is the sol when nothing is going wrong.
  stops:
  - group: GIBBS
    task: Put a number on what the hydrogen costs
    title: The bill for a kilogram of hydrogen
    at: cell-stacks
    reason: >-
      The sol's energy ledger is open, and the stacks' share of the array has never been written down
    place: Plant Control
    scene: Demir is closing the sol’s energy ledger. The stacks made 6.9 kg of hydrogen. He wants their electrical 
      energy use written beside the array output before he signs the sheet.
    guide: >-
      Plant Control wants what the stacks spent, not what the hydrogen stores. Those are different numbers. A kilogram of
      hydrogen stores about 39.4 kWh on this scale. This stack uses about 55 kWh to make it. The gap includes cell losses,
      pumps, and cooling. It is not one simple heat term.
    background:
    - >-
      Why a kilogram of hydrogen has two energy numbers. One is what it stores: burn it, or run it through a fuel cell, and
      about 39.4 kWh comes back out. The other is what it cost to make: about 55 kWh through this stack. Both are correct.
      They answer different questions, and a ledger wants the second.
    - >-
      Where the gap comes from. A practical electrolyser operates away from the reversible limit and also powers pumps, controls
      and thermal management. Electrode kinetics and resistance dissipate energy, while the cell's full heat balance is referenced
      to the thermoneutral as well as reversible voltage. The plant therefore uses measured kWh per kilogram for its ledger
      instead of reconstructing the whole loss from one voltage subtraction.
    - >-
      Why using the wrong figure matters here. Put 39.4 into the sum and the sol's bill reads 272 kWh. The true figure is
      380. That is a quarter of the entry missing from an energy ledger, on a station whose array is the only source of power.
      A cheerful number in the wrong column is worse than no number.
    assumes:
    - electrical energy can be counted in kilowatt-hours
    - a stack costs more energy per kilogram than the hydrogen itself carries
    takeaway: What a product costs to make and what it stores are two different numbers, and the gap is the price of 
      running at a rate.
    format: BALLPARK
    question: Estimate the electrical energy the stacks spent making hydrogen this sol.
    why: >-
      Stored energy and the energy used to make hydrogen answer different questions. At 6.9 kg and 55 kWh/kg, the stack
      used about 380 kWh. The gap includes cell losses and support equipment. It does not mean every volt above 1.23 V
      became heat. The station ledger must use the measured 55 kWh/kg.
    estimate:
      prompt: The stacks made 6.9 kg of hydrogen. At the voltage they run, this stack spends about 55 kWh for each 
        kilogram it makes.
      question: Estimate the electrical energy the stacks spent making hydrogen this sol.
      labels:
      - 6.9 kg  (hydrogen made this sol)
      - 55 kWh/kg  (energy this stack spends per kilogram)
      - 39.4 kWh/kg  (energy stored in a kilogram of hydrogen)
      - 1.75 V  (cell voltage)
      - 88800 s  (seconds in a sol)
      values: [6.9, 55, 39.4, 1.75, 88800]
      slots: 2
      template: "{0} × {1}"
      formula: a*b
      correct: [0, 1]
      target: 379.5
      tolerance: 25
      units: kWh
      solution: 6.9 kg × 55 kWh/kg ≈ 380 kWh.
      explanation: The energy a stack spends is not the energy the hydrogen holds. Using the stored figure instead gives
        272 kWh and understates the bill by a quarter.
      relationship: Energy spent = the mass of hydrogen made × the energy this stack spends to make one kilogram of it.
  - group: PHASE
    task: Say how full a cold tank is allowed to be filled
    title: The space left at the top
    reason: >-
      The loading procedure stops the tank short of full, and nobody has explained that to the people counting kilograms
    place: Cold End
    scene: |-
      Anaya Bhatt, the ascent vehicle systems engineer, stops the methane tank at 95 percent full. Moreau has been asked why the last 5 percent is not just more fuel, with the window this close.
    guide: |-
      Five percent of a tank is a lot of fuel, and the window is close. Moreau's answer had better be good.

      Think about what happens to that tank between filling day and launch day. Nobody takes anything out of it. Heat still gets in. And remember what heat does to a liquid that is already boiling. It does not make it warmer. It makes more gas.

      So ask of each answer: is it really about the liquid, or about the gas above the liquid? That empty space at the top has a name. It is called the ullage.
    background:
    - >-
      Why a cold tank always has gas in it. The liquid sits at its boiling temperature. Insulation slows heat down and
      never stops it. So some liquid is always turning to gas, and that gas needs somewhere to be. This is not a fault
      to be fixed. It is how the tank lives all the time.
    - >-
      What happens to a tank filled right to the brim. Gas still forms, and now it has nowhere to go. Gas that cannot
      spread out pushes harder instead, and it does that fast. The relief valve opens and starts throwing fuel
      overboard to save the tank. A small heat leak has become lost fuel, and the rocket has not burned a gram.
    - >-
      Why 5 percent and not 1 or 20. The empty space has to swallow every kilogram that boils off between filling and
      launch, without the push reaching the relief valve. Work out the boil-off each sol. Multiply by the wait. Add a
      bit for a bad sol. The answer comes out at a few percent. It is a sum, not a habit.
    assumes:
    - a liquid at its boiling temperature turns to gas when heat reaches it
    - a closed tank has a pressure it is built to hold and no more
    takeaway: A cold tank is designed around what happens to it while it is standing still.
    format: CHOICE
    question: Why is the flight tank filled to 95 percent instead of full?
    why: Heat keeps arriving however good the insulation is, so gas keeps forming above the liquid. The empty space at
      the top is the ullage, and its job is to give that new gas room. Fill the tank to the brim and the room is gone.
      The gas pushes harder instead, quickly, and the relief valve has to vent fuel to save the tank. A small heat leak
      becomes lost fuel before the rocket burns a gram. The 5 percent buys the wait between filling and launch.
    choices:
    - Gas from boil-off needs somewhere to go, or the tank pressure climbs past its limit.
    - Liquid methane keeps cooling and shrinking in the tank, and a full one would split.
    - A full tank cannot be measured, because the gauge floats on top of the liquid.
    - The pump cannot draw at all without gas above the liquid to push it out.
    answer: Gas from boil-off needs somewhere to go, or the tank pressure climbs past its limit.
    rebuttals:
    - Liquid methane in this tank sits at its boiling temperature. It is not cooling any further.
    - This gauge reads from pressure and temperature. It does not need a surface to float on.
    - The pump is fed by the tank's own gas pushing, and 5 percent is not what makes that work.
  - group: EQUIL
    task: Close the 100-mole carbon ledger for 1 pass, then decide which carbon is lost and which is recycled.
    title: Close the carbon pass
    at: skid
    reason: >-
      One pass of the carbon assay is pinned to the board, and it says what the loop loses
    place: Reactor Hall
    scene: "Herrera pins one pass of the carbon assay to the board: 100 moles of carbon dioxide entered. Methane and carbon
      monoxide are measured at the outlet, and the recycle meter records the unreacted return stream."
    guide: >-
      A hundred moles of carbon went into the bed, so a hundred moles have to come out of it somewhere. Methane and carbon
      monoxide are measured at the outlet. The recycle meter records what came back unreacted. Read every stream, then count
      only the carbon that belongs to this pass. And keep one distinction in mind as you go: carbon that comes back is not
      the same as carbon that is gone.
    background:
    - >-
      Why one pass is not the yield. A single pass converts part of the feed. The rest comes back and goes round again. So
      the overall yield after many passes can be far higher than the conversion on any one of them. That holds as long as
      nothing is lost on each circuit — which is what makes the recycle number worth checking.
    - >-
      What counting a stream actually claims. Reading a meter is free. Counting the number says this carbon belongs to the
      same hundred moles that went in. Methane and carbon monoxide are both products. Unreacted carbon dioxide is not a product,
      but it is still carbon, and it still has to appear somewhere in the ledger.
    - >-
      Why a gap would change the plan. Carbon that leaves the loop each pass is carbon the recycle can never recover. It might
      be laid down on the catalyst, vented, or dissolved in water. A small loss on every circuit compounds into a hard ceiling
      on overall yield. That ceiling is the number the ascent vehicle's schedule rests on.
    assumes:
    - the recycle loop returns unreacted gas to the inlet
    - every carbon atom entering the bed leaves it in something
    takeaway: Per-pass conversion counts what reacts now; overall conversion counts what is eventually recovered after 
      unreacted feed is recycled.
    format: BALANCE
    question: Where are all 100 carbon moles after 1 pass, and what does that imply for overall methane yield after 
      repeated recycle?
    balance:
      total:
        amount: 100
        unit: mol C
        label: Carbon entering one reactor pass
      streams:
      - id: methane
        label: Carbon leaving as methane
        value: 64
        display: 64 mol C
      - id: carbon_monoxide
        label: Carbon leaving as carbon monoxide
        value: 2
        display: 2 mol C
      - id: bed_inventory
        label: Change in carbon held in the bed
        value: 0
        display: No accumulation
      - id: recycle
        label: Unreacted carbon dioxide returned to the inlet
        value: 34
        display: 34 mol C
        hidden: true
      tolerance: 0.5
      hint: Close the one-pass carbon ledger first. Only after every carbon mole is accounted for should you decide 
        which terms are losses from the plant and which return for another pass.
    answerText: The pass closes as 64 CH₄ + 2 CO + 34 recycled CO₂ = 100 carbon moles. Recycle makes the overall methane
      fraction approach about 64/(64+2) ≈ 97%, not 64%.
    why: "A one-pass conversion of 64% does not mean 36% of the feed is lost. The ledger closes as 64 moles of methane, 2
      of carbon monoxide, and 34 of unreacted carbon dioxide going back to the inlet. That recycle term is inventory, not
      waste. It gets another chance next pass, and another after that. So if the selectivity holds, the split settles at the
      ratio of the two things that cannot come back: 64 to 2. That is about 97% methane and 3% carbon monoxide. Per-pass conversion
      is 64%. Overall conversion is nearly everything."
  # ---------------------------------------------------------------- sol 420
- title: Dust over the array
  objective: Decide what the station stops doing when the power halves.
  briefing: A regional storm cuts total array output to about one fifth of a clear-sol value; the direct-beam model 
    predicts something different and the distinction matters.
  stake: >-
    On sol 420 a dust storm since last night has cut the array to a fifth of what a clear sol gives. The sunlight model covers only
    the direct beam, not all the light the panels see. Today you compare model and meter, then say which loads can stop.
  takeaway: A model of the direct beam and a measurement of total array output are related evidence, not the same 
    quantity.
  stops:
  - group: ELEC
    task: Work out how much sunlight is reaching the panels
    title: What the dust leaves of the sun
    at: sun-sensor
    reason: >-
      Every decision today rests on how much sunlight the dust is still letting through
    place: Electrolysis Hall
    scene: |-
      Petrov, the array technician, has two numbers that do not agree. The dust instrument reports an optical depth of τ = 2.4. The array meter says the panels are making about one fifth of a clear-sol output. He wants the direct beam worked out on its own.
    guide: >-
      Use I = I₀e^(−τ) only for the direct solar beam. The array also receives diffuse light scattered by dust and its electrical
      output includes panel geometry, temperature and conversion efficiency. Calculate the direct-beam scale, then keep it
      separate from the measured one-fifth total output.
    background:
    - >-
      Why attenuation — how much of the light the dust takes out — multiplies rather than subtracts. Picture the dust as a stack of thin layers. Each layer stops the same
      fraction of whatever light reaches it — not the same amount. So the first layer takes a lot and the tenth takes a little,
      because there is less left for it to take. Repeated fractions of fractions is what an exponential is.
    - >-
      What optical depth means as a number. Depth 1 leaves about a third of the beam. Depth 2 leaves about a tenth. Depth
      2.4 leaves about a twelfth. So going from a clear sol at 0.4 to a storm at 2.4 is not five times worse. It is roughly
      sevenfold, because the two extra units of depth each divide again.
    - >-
      Why the direct beam is not the array's output. What e^(−τ) describes is light that came straight through untouched.
      Dust also scatters light sideways, and some of that still lands on a panel from the sky. So the array does better than
      the direct beam alone suggests. It does not do anything like as well as a clear sol.
    takesAsRead:
    - "Stoichiometry as a feed rate: turning a production target into kilograms in"
    assumes:
    - each unit of optical depth cuts a beam by a further factor
    - a beam is attenuated as an exponential of the depth it passes through
    takeaway: Optical depth predicts direct-beam attenuation; total photovoltaic output is a separate measurement with 
      additional light paths and hardware response.
    format: BALLPARK
    question: Estimate the direct beam reaching a panel through this dust.
    why: 'The Beer–Lambert-style attenuation model gives the direct beam: 490 × e^(−2.4) ≈ 44 W/m², about nine percent of
      the above-dust beam. The array meter, however, reports total electrical output near twenty percent of a clear sol. Those
      do not conflict automatically. Dust also scatters light into the sky, panels collect some diffuse illumination, and
      electrical output depends on more than the straight-through beam. The model and the measurement constrain different
      quantities, which is exactly why they should not be substituted for one another.'
    estimate:
      prompt: Above the dust the beam is 490 watts a square metre. The station's sun sensor reports an optical depth of 
        2.4.
      question: Estimate the direct solar beam reaching a horizontal reference surface through this dust.
      labels:
      - 490 W/m²  (beam above the dust)
      - 2.4  (optical depth today)
      - 0.4  (optical depth on a clear sol)
      - 0.22  (efficiency of the panels)
      - 1900 m²  (area of the array)
      values: [490, 2.4, 0.4, 0.22, 1900]
      slots: 2
      template: "{0} × e^(−{1})"
      formula: a*Math.exp(-b)
      correct: [0, 1]
      target: 44.5
      tolerance: 8
      units: W per square metre
      solution: 490 × e^(−2.4) ≈ 44 W per square metre of direct beam.
      explanation: This exponential gives only the straight-through beam. It is not a prediction that total array 
        electrical output must also be nine percent of clear-sol output.
      relationship: "Transmitted beam = the beam above the dust × e raised to minus the optical depth: each unit of depth
        divides the beam by a further factor of about 2.7."
  - group: GIBBS
    task: Build a plan for the power there is
    title: What the station stops doing
    at: loadboard
    reason: >-
      The sacrifices have to be written down and agreed before any breaker is opened
    place: Plant Control
    scene: The dust storm has cut the sol from about 2,000 kilowatt-hours to 600. Tank refrigeration is already drawing 
      power, and six other demands are queued. Marion Wells, who commands the station, wants the sacrifices written down
      before breakers are opened.
    guide: >-
      Six hundred kilowatt-hours for the whole sol, against about two thousand on a clear one. Watch the answers list rather
      than the equipment. It shows what the station can still say at the end of the sol under your plan. The habitat is not
      a load and comes out first. After that, rank what is left by one question: if you stop this, can you get it back? Some
      of these you can. One of them you cannot.
    background:
    - >-
      Why reversibility is the ranking, not power drawn. Digging can wait — the ground will still be there. Batteries can
      recharge on the next clear sol. Electrolysis can be made up later if there is schedule margin left. None of those losses
      is permanent. Refrigeration is different in kind, and that is what puts it at the top rather than its 210 kWh.
    - >-
      Why stopping the refrigerator costs more power than it saves. Propellant already in the tanks took sols of array output
      to make. Stop cooling it and heat keeps arriving, so it boils away. The only way to get it back is to make it again,
      from the beginning, with power you do not have during a storm. Saving 210 kWh today to spend a thousand next week is
      not a saving.
    - >-
      Why writing the sacrifices down matters. Breakers opened without a record become an argument afterwards about what was
      agreed. Demir and Wells want the list because the storm will outlast everybody's memory of the reasoning. A plan that
      names what it gave up can be defended. A plan that only names what it kept cannot.
    assumes:
    - stopping a process can be reversible or costly to reverse
    - a cryogenic tank warms up when its refrigerator stops
    takeaway: Loads are ranked by what stopping them costs to undo, rather than by what they draw.
    format: ALLOCATE
    question: 600 kilowatt-hours. Build the sol's plan, and know what it stops the station being able to say.
    allocate:
      hint: Nothing on this list is a wrong thing to run. What the plan cannot do is the price of what it can.
      pool:
            # 560, not 430. Habitat is protected at 180 and the liquefier is required at
            # 210 and the drier is required at 40, so a 430 kWh sol committed 390 before the
            # player touched anything and left 40 — every substantial job unaffordable, four
            # of the five answers dark whatever was chosen, and a full score for committing
            # without deciding. At 600 the 170 left over funds exactly one substantial job:
            # the stacks at half rate (160, so the plant makes methane today), or the battery
            # reserve with the downlink (120 + 20), or the drill with the downlink (90 + 20).
            # Three plans, three different things the station can still say at the end of it.
        amount: 600
        unit: kWh
        mode: scalar
      items:
      - id: habitat
        label: Habitat heat and air
        cost: 180
        protected: true
        note: the crew is not a load
      - id: liquefier
        label: Liquefier and tank refrigeration
        cost: 210
      - id: stacks
        label: Electrolysis stacks at half rate
        cost: 160
      - id: batteries
        label: Recharge the battery reserve
        cost: 120
      - id: drill
        label: Drill and hopper heating
        cost: 90
      - id: drier
        label: Keep the product drier warm
        cost: 40
      - id: comms
        label: The downlink home
        cost: 20
      answers:
      - question: Does the propellant already made stay in the tanks?
        requires:
        - liquefier
        required: true
      - question: Does the plant make any methane this sol?
        requires:
        - stacks
      - question: Is there reserve in hand for the next storm?
        requires:
        - batteries
            # Required as well as the liquefier: sol 3's blockage was water past the drier
            # freezing in the exchanger, so letting it go cold is how this plant already
            # lost a line. With two required answers the grade turns on a decision rather
            # than on arithmetic the panel has already done.

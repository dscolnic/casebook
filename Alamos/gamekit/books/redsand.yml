- title: The line that froze shut
  objective: Find what closed the cold line, and what the hot run has to do with it.
  briefing: The cold end stops passing liquid, turning yesterday's production gain into a blockage that has to be 
    diagnosed from outside the pipe.
  stake: >-
    On sol 293 no methane has reached the tank since this morning. The cold unit is on target and the valve reads open.
    Today you read pressure, temperature and flow to say what is closing the pipe, and where.
  takeaway: A plant is a chain, and the fastest step decides nothing on its own.
  stops:
  - group: PHASE
    title: Reading a blockage from outside the pipe
    at: coldline
    reason: >-
      The blockage is here and the pipe cannot be opened, so the gauges are the only way in
    place: Cold End
    scene: >-
      Five gauges are up on the cold end panel. Two are screaming. Three look completely normal. Mei-Ling Cho, the
      engineer who runs the cold end, says the three normal ones are the ones that will solve it.
    guide: |-
      A gauge that did not move is not a boring gauge. It is a clue. If a gauge did not move, then whatever is wrong did not touch it. So every guess that would have moved it is out.

      One of these gauges is an assay. An assay means: what is actually in it. Somebody measured the gas leaving the drier and wrote the number down. It says 900 ppm — that means 900 parts out of every million are water.

      Take the four guesses one at a time. Before you look at the panel again, say which gauges that guess would move, and which way. Then check. Two guesses will fit part of the panel. Find the gauge they disagree about.
    background:
    - >-

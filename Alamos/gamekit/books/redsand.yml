    task: Order the steps the water plant runs in.
    title: Getting water out of frozen ground
    at: hopper
    reason: >-
      The water started here, so the last stop is the step that let more of it through
    place: Water Plant
    scene: Femi Abiola, the regolith and water lead, has the plant’s four steps written on cards. The morning crew 

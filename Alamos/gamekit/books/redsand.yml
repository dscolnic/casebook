    task: Work out how long the gas is in contact with the catalyst
    title: How long a molecule stays in the bed
    at: bed
    reason: >-
      Before the hot run gets the credit, find out how long the gas still touches the catalyst
    place: Catalyst Bay
    scene: |-
      Kaur wants the contact time worked out at the new flow before anything else is changed. The bed holds 340 litres of packed catalyst and the loop is passing 85 litres a minute through it.
    guide: >-
      Kaur is asking for a contact time. Contact time is the same thing as residence time: how long a molecule stays inside
      the bed. A volume and a flow through the bed will give you that. Five numbers are on the board and they are not all
      about the bed's size. Some describe the conditions in the loop instead. Ask of each whether a length of time could possibly
      depend on it.
    background:
    - >-
      What residence time is, and what it is not. It is the time a molecule spends inside the packed bed: its volume divided
      by the flow through the bed. It says nothing about how quickly the reaction itself runs. A slow reaction given a long
      contact and a fast one given a short contact can convert the same amount. Conversion is the two of them together.
    - >-
      Why the flow has to be quoted at the reactor's own conditions. A gas volume is not a fixed amount of gas. Squeeze it
      and the same molecules take up less room; heat it and they take up more. So 85 litres a minute at 12 bar and 593 K is
      one number of molecules. The same 85 litres a minute out on the surface is quite another. Both numbers here are already
      quoted inside the bed. That is why the pressure and the temperature are not wanted a second time.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label
      catches a unit that does not match. It also catches a quantity that belongs to a different part of the problem. Do it
      before you place the tile. That habit is the whole point of this format.

  - title: Loading is one way
    objective: Decide whether this batch goes into the vehicle.
    briefing: The batch is made, the assay is back, and one line of it is outside the specification.
    stake: >-
      Sol 304. The batch made since the new charge went in is standing in the transfer tank this
      morning. Its assay is beside it. The batch is 410 kilograms of methane, which is 3 sols of
      the season. One line of the assay sits outside what Bhatt's specification allows. Once it
      goes across into the vehicle it cannot be taken out again. It cannot be cleaned, and it
      cannot be tested by firing. Today you read the batch against the specification. You also
      work out what mass of oxygen the vehicle needs beside it, and whether the stacks can be
      pushed to close the gap that is left. Bhatt has said she will sign what the assay supports
      and nothing else. Sundqvist has counted how many sols are left.
    takeaway: A decision that cannot be reversed is worth more care than one that costs more.
    stops:
      - group: EQUIL
        task: Match each assay line to what it means for the vehicle.
        title: The line that fails
        place: Reactor Hall
        scene: The loading crew is waiting at the methane umbilical. Bhatt has four assay lines beside four flight limits. Three are inside specification; one is not. Herrera wants the consequence named before the transfer valve opens.
        guide: >-
          A specification is not one purity score. It is four separate limits, and each one is
          there to protect something different. So take the lines one at a time. Compare each
          against its own limit first. Then, for anything that is over, ask the question that
          actually matters: where does that substance end up as the stream gets colder, and
          does that place have moving parts in it?
        background:
          - >-
              Why a specification is a list and not a score. Each line guards a different piece
              of hardware against a different failure. There is no way to average them. Being
              well inside three limits earns nothing against being outside the fourth, because
              the fourth is the one protecting the valve. A single purity number would hide
              exactly the information the loading crew needs.
          - >-
              Why the same amount of a substance can be harmless or fatal. It depends where it
              ends up. Carbon dioxide freezes out in the tank, sitting still, doing nothing.
              Water freezes at a far higher temperature, so it turns solid in the plumbing that
              the valves live in. Same physics, different address. One is ballast and the other
              stops a valve moving.
          - >-
              Why an impurity can be a performance cost rather than a hazard. Carbon monoxide
              burns, but it releases far less energy per kilogram than methane does. So carrying
              it is carrying dead weight: it takes tank volume and gives little back. That is a
              reason to have a limit on it. It is not a reason to stop a loading.
        takesAsRead:
          - "Stoichiometry as a feed rate: turning a production target into kilograms in"
        assumes:
          - water freezes at a temperature the vehicle's valves reach in use
          - carbon monoxide does not burn to give the energy methane does
        takeaway: A specification is a list of chemical limits tied to different downstream consequences, not a single purity score.
        format: PROTOCOL
        why: "A specification is not one purity score. Each line protects a different piece of hardware. Water is the failure here: 400 ppm against a limit of 50, so eight times over. And water freezes at a temperature the vehicle's valves reach in use, which puts solid ice in something that has to move. Carbon monoxide and carbon dioxide are both inside their limits. Carbon monoxide would be dead weight if it rose; carbon dioxide freezes out in the tank, where nothing moves. So each line has to be read against its own limit and its own failure, before the valve opens."
        scenarios:
          - Methane at 99.1% against a limit of 99.0.
          - Water at 400 parts per million against a limit of 50.
          - Carbon monoxide at 0.5% against a limit of 1.0.
          - Carbon dioxide at 0.2% against a limit of 0.5.
        choices:
          - Inside the limit, and the margin is thin enough to be worth watching on the next batch.
          - Eight times the limit, and it freezes in a valve at the temperature that valve runs at.
          - Inside the limit; it is ballast that costs a little performance and does no damage.
          - Inside the limit, and it freezes out in the tank rather than in a moving part.
        mapping: [0, 1, 2, 3]
      - group: PHASE
        task: Work out how much oxygen goes with the methane
        title: How much oxygen a tonne of methane needs
        place: Cold End
        scene: |-
          Bhatt wants the oxygen mass checked independently before the loading order is written. Methane burns with oxygen 2 moles to 1, and the vehicle carries 6.6 tonnes of fuel.
        guide: >-
          Bhatt wants a mass, and the balanced equation gives moles. That gap is the whole
          question. Two moles of oxygen burn one mole of methane. But a mole of oxygen weighs
          32 grams and a mole of methane only 16. So the mass ratio is not 2. Let the molar
          masses do the converting. Five numbers are on the board and two belong to other
          questions. And note in passing that a real engine runs away from this ratio on
          purpose.
        background:
          - >-
              Why a mole ratio is never a mass ratio. Balanced equations count molecules,
              because that is how reactions happen. Tanks are filled by mass, because that is
              what a pump moves. The two only line up if the molecules weigh the same, and they
              almost never do. So a 2-to-1 mole ratio here comes out as 4-to-1 by mass, and
              the factor of two is the difference in molar mass.
          - >-
              Why this is worth checking independently. The oxygen tank and the methane tank are
              filled from different plants on different sols. Nothing on the vehicle notices a
              mismatch until the engine runs, and by then the wrong answer has flown. So a
              second person does the arithmetic from the balanced equation rather than from the
              loading order, and the two are compared.
          - >-
              Why the engine does not use this number exactly. Complete combustion is 4-to-1 by
              mass, and rocket engines usually run with a little less oxygen than that. Slightly
              fuel-rich exhaust is cooler, which the engine's own metal appreciates, and the
              lighter molecules leave faster. That is a design choice about performance. It does
              not change the stoichiometry the loading team has to know.
        assumes:
          - a balanced equation gives the mole ratio for a reaction
          - a molar mass converts a number of moles into a mass
        takeaway: A mole ratio is not a mass ratio until both molar masses have been applied.
        format: BALLPARK
        question: Estimate the mass of oxygen needed for each kilogram of methane burned.
        why: A balanced equation gives a mole ratio. Tanks are filled by mass. Burning methane completely takes two moles of oxygen per mole of methane. Two moles of O₂ weigh 64 grams; one mole of CH₄ weighs 16. So the mass ratio is 4 to 1, not 2 to 1. The factor of two is nothing but the difference in molar mass. A real engine runs slightly away from that ratio for performance, which is a design choice. It does not change the arithmetic the loading team has to be able to check.
        estimate:
          prompt: Burning methane completely takes two moles of oxygen per mole of methane. Oxygen is 32.0 g per mole and methane is 16.0.
          question: Estimate the mass of oxygen needed for each kilogram of methane burned.
          labels:
            - 2  (moles of oxygen per mole of methane)
            - 32.0 g/mol  (molar mass of oxygen)
            - 16.0 g/mol  (molar mass of methane)
            - 6600 kg  (methane the vehicle carries)
            - 44.0 g/mol  (molar mass of carbon dioxide)
          values: [2, 32, 16, 6600, 44]
          slots: 3
          template: "{0} × {1} ÷ {2}"
          formula: a*b/c
          correct: [0, 1, 2]
          target: 4
          tolerance: 0.3
          units: kg of oxygen per kg of methane
          solution: 2 × 32.0 ÷ 16.0 = 4.0 kilograms of oxygen for each kilogram of methane.
          explanation: The mole ratio is 2 to 1 and the mass ratio is 4 to 1, since oxygen is twice as heavy a molecule. The engine actually runs below this, which is a design choice rather than an arithmetic one.
          relationship: Mass ratio = the mole ratio from the balanced equation × the molar mass of the oxidiser ÷ the molar mass of the fuel.
      - group: ELEC
        task: Say whether the stacks can be pushed harder
        title: What limits the current
        concept: "Overpotential: the voltage above the minimum, and where it goes"
        place: Electrolysis Hall
        scene: >
          Sundqvist wants the stacks run 20% above their rated current for the sols that
          remain. Achebe has the cooling loop's capacity written on the board beside the request.
        guide: >-
          Sundqvist wants 20 per cent more current, and Achebe has put the cooling loop's
          capacity on the board beside the request. That is a hint about where to look. Take
          each candidate and ask one thing: does it actually get worse as the current goes up?
          Faraday's law does not — more charge is simply more product, in exact proportion.
          Something else in the cell does.
        background:
          - >-
              Why Faraday's law sets no limit. It is a proportion, not a ceiling. Twice the
              charge is twice the product, and the constant in it is just the exchange rate
              between coulombs and moles. Nothing in the law says a cell will object to being
              driven harder. Whether it survives being driven harder is a different question,
              and a different part of physics.
              And overpotential is where that question lives.
          - >-
              Why the wasted voltage grows faster than the current. Overpotential is the
              voltage above the minimum, and it rises as the cell is pushed. Resistance costs
              more voltage at higher current, and slow electrode steps need more driving force
              to go faster. So the cell needs a higher voltage *and* is passing a higher
              current, and heat is voltage times current. Push the current 20 per cent and the
              heat can climb 40.
          - >-
              Why the limit is thermal rather than electrochemical. All that heat appears inside
              the stack, between the plates, next to the seals. It has to be carried away by the
              cooling loop or the stack cooks itself. So the real ceiling is not a number in a
              chemistry table. It is whatever the cooling loop can remove, which is why Achebe
              wrote that figure on the board.
        assumes:
          - the product a cell makes is proportional to the charge it passes
          - the voltage above the minimum leaves the cell as heat
        takeaway: The ceiling on a cell is usually thermal rather than electrochemical.
        format: CHOICE
        question: What sets the highest current these stacks can be run at?
        choices:
          - The heat the cooling loop can carry away, since the wasted voltage rises with the current.
          - Faraday's constant, which fixes how many moles a cell can pass in a sol.
          - The water supply, since a cell can split no more than it is fed.
          - The pressure in the hydrogen collection line, which rises with the production rate.
        answer: The heat the cooling loop can carry away, since the wasted voltage rises with the current.
        why: >-
          Faraday's law puts no ceiling on current. More charge is simply more product, in exact
          proportion. What rises with current is the overpotential. Resistance costs more voltage
          at higher current, and slow electrode steps need more push to go faster. So the cell
          needs a higher voltage while passing a higher current, and heat is the two multiplied.
          That heat appears inside the stack, next to the seals. So the ceiling is whatever the
          cooling loop can carry away. 20 per cent more current can cost 40 per cent more heat.
        rebuttals:
          - Faraday's constant converts charge into moles and does not cap the charge itself.
          - Water feed is a limit worth checking and this hall has buffer enough for the requested rate.
          - Collection pressure is held by a regulator and does not rise with production.

  # ---------------------------------------------------------------- sol 305
  - title: What the next crew is told
    objective: Say what is known, how well it is known, and what was never established.
    briefing: The fortnight ends, and what survives it is what gets written down.
    stake: >-
      Sol 305 is the last sol of this rotation. The handover file has to be finished this
      morning. The plant is making 14.4 kilograms a sol against a target of 13.8. The tank
      stands at 4.3 tonnes of methane. The arithmetic now finishes the fill 11 sols before the
      window opens. None of that is the difficult part. Today you decide what is left funded and
      instrumented for the crew who arrive on the next vehicle. You also write the standing
      order for the water loop, and say plainly what is known about the catalyst and what is
      not. Wells has one instruction about the file. Somebody who was not here has to be able to
      act on it without asking anybody who was.
    takeaway: A handover states what is known, how well, and what was never established at all.
    stops:
      - group: GIBBS
        task: Fund what the next crew should inherit.
        title: What to leave running
        place: Plant Control
        scene: Only 2 improvements can be left in place for the crew arriving 300 sols from now. Wells and Demir have four candidates on the final board. The failed catalyst charge is on the floor beside them.
        guide: >-
          Here is the season in one sentence. It lost 38 sols of production to a measurement
          taken every sol, logged every sol, and read by nobody. Now the facts you are
          spending against. The bed already carries four thermocouples. The array has one sun
          sensor and it has never disagreed with the sky. And the next crew arrives 300 sols
          from now, having met nobody who was here. So think about what survives that gap. An
          alarm reaches somebody without being looked for. A written order tells whoever
          hears it what to do next.
        rules: >-
          Spread the hundred points across the 4 proposals. At least 80 of them have to
          be committed, because a panel that funds almost nothing has not decided
          anything. Your largest single allocation must be 35 or more, and it has to
          land on what the evidence supports most. Keep the total sitting on proposals
          the evidence does not support under fifteen. And a proposal it does support
          should not be left under twenty.
        background:
          - >-
              Why the whole spread is graded. Funding is not a vote for one idea. A portfolio
              says three things at once: what you think is likely, what is worth hedging
              against, and what is not worth doing at all. Most of the information is in the
              last two. Backing the right proposal while quietly funding a bad one is a worse
              answer than it looks. The small numbers count as much as the big one.
          - >-
              What the three numbers are for. Thirty-five is what makes a lead a lead. Below it
              you have hedged rather than chosen. Fifteen is the most that can sit on
              unsupported work before it stops being a rounding error. Past that it is a second
              opinion nobody argued for. Twenty is the floor under work you have already called
              strong, because funding it too thin to finish spends the money and buys nothing.
          - >-
              Why a measurement is not a control. Conductivity was measured all season. What
              was missing was the pair of things that turn a number into an action: something
              that shouts when the number moves, and something that says what to do when it
              shouts. An alarm without a written order leaves the next crew a noise. An order
              without an alarm leaves them a page nobody reads. Neither half works alone.
        assumes:
          - the fault that cost this season went undetected because nothing measured it
          - the next crew arrives without anybody from this one
        takeaway: What outlives a crew is what somebody made automatic before they left.
        format: SCIENCETANK
        answerText: Leave the feed-water conductivity alarm and the standing lead/lag changeover rule. Together they detect breakthrough and tell the next crew what action follows.
        why: The best thing to leave behind is a known failure turned into an automatic response. The conductivity alarm closes the exact gap that let breakthrough run for 38 sols unnoticed. The standing order tells the next crew what to do the moment it fires. Those two are a pair: an alarm with no order is a noise, and an order with no alarm is a page nobody opens. The spare thermocouples are useful, and the bed already has four. A second sun sensor addresses nothing that failed. Alarm plus procedure joins measurement to action, and needs nobody's memory.
        proposals:
          - label: A
            text: An alarm on feed-water conductivity, wired to the plant panel rather than to a log.
          - label: B
            text: A written standing order for changing the lead polishing column at breakthrough.
          - label: C
            text: A spare set of thermocouples for the catalyst bed.
          - label: D
            text: A second sun sensor at the far end of the array.
        recommended:
          A: 45
          B: 35
      - group: SOIL
        task: Set the warning and column-swap thresholds, then replay the historic conductivity rise without changing them.
        title: Write the rule before the trace moves
        place: Water Plant
        scene: Abiola is writing a rule for a crew he will never meet. He loads last season’s conductivity trace into the alarm simulator. Once the replay starts, the thresholds are locked and the values run forward.
        guide: >-
          One rule, written before the trace moves, and fixed the moment you release it. Two
          numbers set it. The changeover takes one update to complete once it is called. And
          past 3 × baseline the feed water is outside what the reactor will accept. So work
          backwards from 3 by however far this trace climbs in a single update. Then check the
          other direction too. Set the line too low and a perfectly good bed gets swapped out
          for a reading that meant nothing.
        background:
          - >-
              Why conductivity is the signal to write the rule on. It climbs as the column runs
              out of capacity and starts letting ions through. So it moves *before* the water is
              out of specification, not after. That gap is the only reason a rule is possible at
              all. A measurement that only told you after the damage would be a record, not a
              warning.
          - >-
              Why a threshold has to allow for lead time. The swap is not instant. Call it and
              one update passes before the fresh bed is in service, and the trace keeps climbing
              through that update. So the line cannot sit at the limit. It has to sit far enough
              below the limit that the climb during the swap still lands underneath it. Work
              backwards from the consequence, never forwards from the reading.
          - >-
              What writing for a crew you will never meet changes. Nobody will be there to
              exercise judgement when it fires. So the rule has to hold for a trace nobody has
              seen, including one that rises faster than this one. That argues for margin. But
              margin costs columns, and swapping a clean bed wastes the very capacity the rule
              exists to protect. Both errors are real, which is what makes this a decision.
        assumes:
          - an exchange bed reaches breakthrough without warning
          - a lead and lag pair lets one bed be changed while the other works
        takeaway: A breakthrough threshold must be written before the rise and early enough to cover the action’s lead time.
        format: TRIGGER
        question: >-
          At what conductivity do you move the lag column into lead service, given the changeover
          takes one update to complete?
        trigger:
          hint: >-
            Set the rule before release. The swap takes one update to complete, and the accepted-water
            limit on this normalised replay is 3.0 times the clean baseline.
          direction: rising
          scale:
            label: Conductivity of the treated water
            min: 1
            max: 6
            step: 0.1
            unit: × clean baseline
            anchors:
              - { at: 1.0, means: 'the bed is clean and nothing is passing through it' }
              - { at: 4.5, means: 'well outside specification, with the electrolyser taking whatever the bed let through' }
          objective: >-
            The fresh bed is in lead service before the trace crosses 3 × baseline.
          consequenceLimit: 3
          rehearsal:
            note: the bed that was changed out last quarter
            stream:
              - { value: 1.0, hoursLeft: 8 }
              - { value: 1.05, hoursLeft: 7 }
              - { value: 1.2, hoursLeft: 6 }
              - { value: 1.7, hoursLeft: 5 }
              - { value: 2.4, hoursLeft: 4 }
              - { value: 3.6, hoursLeft: 3 }
              - { value: 4.8, hoursLeft: 2 }
              - { value: 5.6, hoursLeft: 1 }
              - { value: 5.9, hoursLeft: 0 }
          conditions:
            - id: swap
              label: Move lag column into lead service
              leadHours: 1
              window: { min: 1.6, max: 2 }
          stream:
            - step: 0
              value: 1
              hoursLeft: 8
              at: update 0
              update: 1 × clean-baseline conductivity
            - step: 1
              value: 1
              hoursLeft: 7
              at: update 1
              update: 1 × clean-baseline conductivity
            - step: 2
              value: 1.1
              hoursLeft: 6
              at: update 2
              update: 1.1 × clean-baseline conductivity
            - step: 3
              value: 1.3
              hoursLeft: 5
              at: update 3
              update: 1.3 × clean-baseline conductivity
            - step: 4
              value: 1.6
              hoursLeft: 4
              at: update 4
              update: 1.6 × clean-baseline conductivity
            - step: 5
              value: 2
              hoursLeft: 3
              at: update 5
              update: 2 × clean-baseline conductivity
            - step: 6
              value: 2.6
              hoursLeft: 2
              at: update 6
              update: 2.6 × clean-baseline conductivity
            - step: 7
              value: 3.4
              hoursLeft: 1
              at: update 7
              update: 3.4 × clean-baseline conductivity
            - step: 8
              value: 4.5
              hoursLeft: 0
              at: update 8
              update: 4.5 × clean-baseline conductivity
        answerText: >-
          Swap at about 1.7 × baseline. It fires with the update the changeover needs, and the trace
          does not reach 3 × baseline until two updates later.
        why: The outlet stays near baseline while the front is still inside the bed, then climbs fast once it reaches the end. So a threshold is only useful if the response can finish before the water leaves specification. Here the swap takes one update. Fire at about twice baseline and it completes while the next reading is still 2.6. Wait for 2.6 and it completes after the trace has already crossed 3.0. That is the whole calculation: work back from the limit by one update's worth of climb. And write it before the replay, so the next crew inherits a rule rather than somebody's hindsight.
      - group: KINET
        task: State what is known about the catalyst and what is not
        title: The honest claim about the bed
        place: Catalyst Bay
        scene: Kaur is writing the final catalyst handover. The bed has run for five sols at one set of conditions using water from a fresh polishing column. It is the last charge available on the station.
        guide: >-
          Kaur has five sols of evidence and four claims to choose between. So for each one,
          ask exactly what was varied while the evidence was collected. One set point.
          One flow. Water from a fresh column, which means no chloride in it at all. A claim
          can only reach as far as the conditions that were tested — and notice that this cuts
          both ways. Overclaiming is one failure. Refusing to claim what you did establish is
          another.
        background:
          - >-
              Why a claim carries its conditions with it. Evidence is collected somewhere
              specific: one temperature, one flow, one water quality, five sols. Strip those
              away and the sentence sounds stronger, and it is no longer supported. So the
              conditions are not hedging. They are part of what was measured, and a claim
              without them is a different claim than the one the data backs.
          - >-
              Why absence of a poison cannot prove resistance to it. Conversion has held since
              the column was changed. But the column was changed precisely so that chloride
              would not arrive. So the run contains no chloride, and a test needs the thing
              present to say anything about it. Nothing happening when nothing was tried is not
              a result.
          - >-
              Why refusing to claim anything is also wrong. Five sols at matched conditions is
              real evidence, and it settles a real question: this charge holds up against the
              sol-270 run in that window. Throwing that away because it is not everything
              leaves the next crew with nothing to build on. A narrow claim, written down with
              its conditions, is worth far more than an honest shrug.
        takesAsRead:
          - Rate constants, and how steeply they climb with temperature
        assumes:
          - a claim is limited by the conditions it was tested under
          - a poison accumulates over time rather than acting at once
        takeaway: The strength of a claim is set by what was varied while it was being tested.
        format: CHOICE
        question: What is the honest claim to hand over about this charge?
        why: A claim reaches as far as the conditions it was tested under, and no further. Five sols at one set point on clean water supports a narrow statement about that window. It says nothing about other temperatures or flows, because none were tried. And it cannot say anything about chloride, because the column was changed so that no chloride would arrive. Nothing happening when nothing was tried is not a result. So the handover keeps the conditions attached to the claim. That way the next crew can tell a repeat of this test from a new one.
        choices:
          - It matches the sol-270 charge at matched conditions over 5 sols, on polished water.
          - It performs as well as any charge the station has run, on the evidence available.
          - It is unaffected by chloride, since conversion has held since the column was changed.
          - Its behaviour cannot be stated, since five sols is too short a run to say anything.
        answer: It matches the sol-270 charge at matched conditions over 5 sols, on polished water.
        rebuttals:
          - A comparison against every charge the station has run was not made, and two of them were never assayed.
          - Chloride was absent throughout, so the run says nothing about what the charge does when it is present.
          - Five sols supports a narrow claim rather than none at all, and the narrow claim is worth writing down.
# ------------------------------------------------------------- review stops
# Lessons no mission points at. From sol 3 the engine appends a callback to an
# area taught earlier and prefers a "— Review" variant of that lesson, so these
# are the spaced retrieval rather than spares: the same idea, a different case,
# a fortnight after it was first met.
lessons:
  - group: EQUIL
    title: What the loop settles at — Review
    task: Say what each change does to the balance, on a different reactor
    place: Reactor Hall
    scene: >
      A second reactor on the station makes ammonia for the greenhouse, out of nitrogen and
      hydrogen. It gives out heat, and it ends with fewer gas molecules than it started. Four
      changes are proposed to it.
    guide: >-
      Different reactor, different product, same four questions. That is the point of
      putting it in front of you again. For pressure, count the gas molecules on each
      side. For temperature, ask which side the heat is on. For anything added or taken
      away, ask whether it takes part in the reaction at all. And for the catalyst, ask
      whether it changes the destination or only the journey.
    background:
      - >-
          Why the substance in the pipe does not matter. Le Châtelier's principle is about
          the shape of the equation, not about what the molecules are. N₂ + 3H₂ ⇌ 2NH₃ has
          four gas molecules going in and two coming out, and it gives off heat. So does the
          Sabatier reaction, in its own numbers. Two different plants, two different
          products, and the same four answers.
      - >-
          Why counting molecules is the whole of the pressure question. Squeeze a mixture and
          it shifts to whichever side occupies less room, because that relieves some of the
          squeeze. Fewer gas molecules means less room. So the side with fewer wins. Here that
          is the ammonia side, four going to two, and it is why industrial ammonia plants run
          at pressures that sound absurd.
      - >-
          Why the catalyst is on this board at all. It is here to be the one that does not
          move the balance. Every other change on the list shifts where the mixture settles.
          The catalyst changes how long it takes to get there and leaves the destination
          exactly as it was. Meeting that fact in a second reactor is the point of meeting it
          twice.
    assumes:
      - a reaction that gives out heat has its balance pushed back by heating
      - fewer gas molecules on one side makes that side favoured by pressure
    takeaway: A rule about balance is about the equation's shape, not about the substance in the pipe.
    format: PROTOCOL
    task: Match each change to what it does to the ammonia at equilibrium.
    scenarios:
      - The vessel is squeezed to twice its working pressure.
      - The vessel is warmed by 60 degrees.
      - Ammonia is condensed out of the product and the rest returned.
      - A better catalyst is fitted at the same conditions.
    choices:
      - 'More ammonia: four gas molecules go in and two come out, so crowding favours the products.'
      - 'Less ammonia: heat is one of the outputs, and supplying more of it pushes the balance back.'
      - 'More ammonia: removing an output leaves the mixture short of what it settles at.'
      - 'No change in amount: the balance is reached sooner and it is the same balance.'
    mapping: [0, 1, 2, 3]
    why: >-
      The shape of the equation decides all four answers. That is why a reactor making a completely
      different substance behaves the same way. Count the gas molecules and you know what pressure
      does: four in, two out, so squeezing favours the ammonia. Ask which side the heat is on and
      you know what temperature does: heat is an output here, so adding more pushes the balance
      back. Ask whether what was removed takes part, and you know whether the balance moves at all.
      And the catalyst changes the time, never the destination.

  - group: KINET
    title: Rate is not yield — Review
    task: Separate speed from ceiling on a different reaction
    place: Catalyst Bay
    scene: >
      The greenhouse reactor is running cold and slow. Its operator proposes 40 degrees more, and
      the same argument that ran through the propellant plant a fortnight ago starts again.
    guide: >-
      The same argument as the propellant plant, in a different building. Each option
      here makes two claims at once, so check both halves separately. One is about how
      fast the reaction gets to its balance. The other is about how much product that
      balance holds. Those are two different quantities, and for a reaction that gives
      off heat they are free to disagree with each other.
    background:
      - >-
          Why one setting moves two quantities. Temperature reaches the reaction twice over.
          It reaches the rate constant, which climbs steeply because more collisions arrive
          carrying enough energy to react. And it reaches the equilibrium constant, which for
          a heat-releasing reaction falls, because heat behaves as one of the products. Two
          separate routes, and nothing says they have to agree.
      - >-
          Why this is the normal case, not a special one. It is tempting to expect a single
          setting to have a single effect. Most of the interesting decisions in a plant are the
          other kind. Heat helps the rate and hurts the ceiling. More current makes more
          hydrogen and more waste heat. Faster flow raises throughput and cuts contact time.
          Every one of those is one knob pulling two ways.
      - >-
          What the industry actually does about it. If heat buys speed and costs yield, the
          usual answer is to buy the speed some other way. Run the bed at the coolest
          temperature that gives an acceptable balance. Then spend money on a catalyst good
          enough to reach that balance in the time available. That is why catalyst research is
          worth what it is worth.
    assumes:
      - heating raises the fraction of collisions that clear the barrier
      - an exothermic reaction's balance is pushed back by heating
    takeaway: One setting moving two quantities in opposite directions is the normal case rather than a special one.
    format: CHOICE
    question: A reaction that gives out heat is run hotter. Which pair of statements is right?
    choices:
      - Faster to its balance, and the balance itself holds less product.
      - Faster to its balance, and the balance holds more product as well.
      - Slower to its balance, and the balance holds less product.
      - Neither the speed nor the balance moves; temperature acts on the catalyst instead.
    answer: Faster to its balance, and the balance itself holds less product.
    why: >-
      Temperature reaches this reaction by two routes, and they run opposite ways. The rate constant
      climbs steeply, because more collisions arrive carrying enough energy to react. The
      equilibrium constant falls, because heat behaves as one of the products of a reaction that
      gives heat off. So the bed gets to its balance faster and the balance holds less. Every
      exothermic industrial reaction lives with that trade. The usual answer is a temperature low
      enough for a decent balance, and a catalyst good enough to reach it in the time available.
    rebuttals:
      - Rising with temperature is what the rate does, and the balance for this kind of reaction does the opposite.
      - Reactions do not slow when heated; it is the ceiling that comes down.
      - Temperature acts on the molecules rather than on the catalyst, and both the speed and the balance respond.

  - group: PHASE
    title: What freezes before methane condenses — Review
    place: Cold End
    scene: >
      A different stream comes off the greenhouse: mostly nitrogen, with water vapour, some carbon
      dioxide and a little argon. It is being cooled to recover the argon as a liquid.
    guide: >-
      All four are in the stream together, so nothing here happens before anything else.
      What sorts them is how strongly each one holds on to itself. So ask of each what
      kind of pull it has. Hydrogen bonds are the strongest of the three. Ordinary forces
      between whole molecules are weaker. Weakest of all is the fleeting attraction
      between electron clouds. And one of these is a single atom, with the least to hold
      on with.
    background:
      - >-
          Why attraction between molecules sets a boiling point. To leave a liquid, a molecule
          has to break away from its neighbours. The harder they hold on, the more energy that
          takes, and energy means temperature. So a substance whose molecules pull strongly on
          each other stays liquid to a high temperature. One whose molecules barely notice each
          other needs deep cold before it will condense at all.
      - >-
          The three strengths, in order. A hydrogen bond forms when hydrogen sits next to
          oxygen, nitrogen or fluorine. It is much the strongest of these three. That is why
          water is still liquid at temperatures where the others are all gas. Next come ordinary
          attractions between whole molecules. Weakest of all are the fleeting pulls between
          electron clouds, which every substance has and some substances have nothing else.
      - >-
          Why argon is last. It is a single atom, not a molecule. It has no shape and nothing
          sticking out. So nothing is available but that fleeting pull between electron
          clouds. And a small atom has a small cloud. It condenses near 87 K, colder than
          nitrogen, which is why recovering it means going deeper than anything else in this
          stream.
    assumes:
      - each substance leaves the gas phase at its own temperature
      - stronger attractions between molecules mean a higher condensation temperature
    takeaway: Cooling a mixture separates it in the order the attractions between its molecules run.
    format: SEQUENCE
    task: Order the substances by the temperature at which they leave the gas, warmest first.
    cards:
      - Water, which hydrogen-bonds to itself and holds together far above room temperature.
      - Carbon dioxide, which turns solid near 195 K at this pressure.
      - Nitrogen, a small non-polar molecule that condenses near 77 K.
      - Argon, a single atom with the weakest attractions in the stream.
    order: [0, 1, 2, 3]
    axis: Order the four substances by the temperature at which each one leaves the gas, warmest first. Nothing here happens before anything else — they are all in the stream together, and the cooling picks them off in the order their molecules hold on to one another.
    ends: [Leaves the gas warmest, Leaves the gas coldest]
    why: >-
      The order is the strength of the pull between the particles. Water hydrogen-bonds to itself,
      and that is much the strongest of these, so it leaves first by a wide margin. Carbon dioxide
      is held by weaker forces between whole molecules. At this pressure it goes straight from gas
      to solid. Nitrogen and argon have nothing but the fleeting pull between electron clouds, so
      both need deep cold. Argon is last, because a single atom has the least to hold on with. A
      cooling stream is a separation in exactly that order.

  - group: ELEC
    title: Which electrode does which job — Review
    task: Read a different cell the same way
    place: Electrolysis Hall
    scene: >
      The station's oxygen generator splits water in a low-temperature cell rather than a hot one.
      Achebe wants it read the same way as the hot stacks, part by part.
    guide: >-
      A cold cell this time instead of a hot one, and the reading does not change. Ask of
      each part which way the electrons are being pushed. Electrons in means reduction, a
      gain. Electrons out means oxidation, a loss. That much is true of any
      water-splitting cell, whatever it is built from. One item on this board is not a
      place at all, so ask what a voltage does rather than where it is.
    background:
      - >-
          Why the electrode names do not depend on the cell. An electrode is named by what
          happens at it, not by what it is made of or how hot it runs. Electrons pushed in,
          something gains them, and that is reduction. Electrons drawn out, something loses
          them, and that is oxidation. Hot ceramic cell or cold polymer cell, the two halves
          are the same two halves.
      - >-
          What changes between the hot cell and this one. The ion the middle carries. The hot
          stack moves oxide ions, O²⁻, across a solid ceramic. This cold cell moves hydrogen
          ions, H⁺, across a polymer membrane. Different ion, opposite direction of travel, and
          exactly the same job: carry the charge, refuse the electrons, keep the two gases from
          meeting.
      - >-
          Why the voltage is on a board of parts. Because it is the one item that is not a
          part. It is a condition the whole cell has to satisfy before any of the parts do
          anything at all. Below the minimum the thermodynamics sets, nothing happens anywhere
          in the cell. Above it, the excess is what buys a useful rate, and it leaves as heat.
    assumes:
      - reduction happens where electrons are pushed in
      - the electrolyte carries ions and not electrons
    takeaway: The parts of an electrolysis cell do the same jobs whatever the cell is made of.
    format: PROTOCOL
    task: Match each part of this cell to what happens there.
    scenarios:
      - The electrode the supply pushes electrons into.
      - The electrode electrons are drawn out of.
      - The membrane between them.
      - The applied voltage.
    choices:
      - Water gains electrons here and hydrogen comes off.
      - Water loses electrons here and oxygen comes off.
      - It passes hydrogen ions and keeps the two gases apart.
      - It has to exceed the minimum the thermodynamics sets before anything happens at all.
    mapping: [0, 1, 2, 3]
    why: >-
      A cell is one redox reaction with its two halves held apart. Which half sits where is fixed
      by the direction the electrons are pushed. Electrons in means reduction, so hydrogen
      comes off there in any water-splitting cell, hot or cold. Electrons out means oxidation, and
      oxygen. The membrane carries one ion and stops the gases mixing — hydrogen ions here, oxide
      ions in the hot stack, same job either way. And the voltage is not a part. Below the minimum
      nothing happens at all. Above it, the excess buys a rate and leaves as heat.

  - group: GIBBS
    title: What has to be paid for — Review
    task: Sort four station processes into driven and spontaneous
    place: Plant Control
    scene: >
      Demir has four of the station's processes on the board and wants them sorted before the
      quarterly energy plan is written. Two of them run downhill and two have to be pushed.
    guide: >-
      Two questions of each process, in this order. First: does it run downhill on its
      own, or does something have to push it? That is the one that decides whether there
      is a bill at all. Second, for the ones that do need pushing: is the bill chemical
      or physical? And watch out for the one that runs downhill so willingly that
      stopping it is what costs money.
    background:
      - >-
          Why direction and speed are separate questions. A negative free-energy change says a
          process can run on its own. It says nothing whatever about when. Making methane is
          downhill and would still take years without a catalyst. So "it runs on its own" and
          "it runs" are two different claims, and only the first one is about thermodynamics.
      - >-
          Why the same reaction appears twice on this board. Splitting water and making methane
          are close to being one reaction read in two directions. One is uphill and has to be
          paid for electrically. The other is downhill and pays out. That is one number with
          two signs, which is why this station can run one step for free and never the other.
      - >-
          Why stopping something downhill costs money. Boiling is downhill: heat arrives and
          liquid becomes gas without anyone helping. So keeping oxygen liquid means fighting a
          process that wants to happen, every second, forever. That is what the refrigerator
          is for. A downhill process is not always the cheap one — it is only cheap if you
          wanted it to happen.
    assumes:
      - a negative free-energy change means a process can run on its own
      - running on its own says nothing about how fast a process goes
    takeaway: Sorting a station's processes by direction is what says which of them have a bill nobody can design away.
    format: CASEBOOK
    task: Match each process to what it needs from the station.
    scenarios:
      - Methane assembling from carbon dioxide and hydrogen over the bed.
      - Water splitting into hydrogen and oxygen in the stack.
      - Liquid oxygen boiling in a warmed tank.
      - Compressing the atmosphere from 6 millibars to 12 bar.
    choices:
      - Runs downhill and needs a catalyst to be quick about it.
      - Runs uphill and needs the free-energy difference supplied electrically.
      - Runs downhill and is the thing the refrigerator is fighting.
      - Runs uphill and is paid for in shaft work rather than in chemistry.
    mapping: [0, 1, 2, 3]
    why: >-
      Direction and speed are separate questions, and only direction says whether there is a bill.
      Making methane runs downhill and runs slowly, which is exactly what a catalyst is for.
      Splitting water is close to the same reaction backwards, so it runs uphill, and the bill is
      the free-energy difference paid in electricity. Boiling runs downhill too — which is why
      keeping oxygen liquid costs work, every second, to stop something that wants to happen.
      Compression is uphill and physical rather than chemical, and it is paid for at the
      compressor.

  - group: SOIL
    title: Getting water out of frozen ground — Review
    task: Order the same plant on a poorer load
    place: Water Plant
    scene: >
      A load has come in at 3% water instead of eight, and the same four operations have
      to run on it. Nakagawa wants the order confirmed before the hopper is sealed.
    guide: >-
      Same four operations, a much poorer load. So ask a different question this time:
      what would you be unable to tell apart if a step were missing? A lean load gives
      little water. So does a broken plant. Something on this list is what separates those
      two. And note that the warming has a ceiling as well as a floor, because perchlorate
      salts come apart when they are heated hard.
    background:
      - >-
          Why a lean load needs the sample and a rich one does not. Expect eight per cent
          water and get eight, and nothing needs explaining. Expect nothing in particular and
          get very little, and you cannot tell a poor load from a plant fault. The sample turns
          the second sol into a measurement instead of a shrug. That is why it moves to the
          front when the ground gets worse.
      - >-
          Why the warming has a ceiling. Perchlorate salts do not simply sit there when heated
          hard. They decompose, and what comes off includes chlorine compounds that end up in
          the vapour and then in the water. Chloride is exactly what kills the catalyst. So the
          hopper is held below that temperature — hot enough to drive the water off, cool
          enough to leave the salts intact.
      - >-
          Why the order is the same on a poor load as on a good one. A leaner load carries the
          same salts in less water. It does not change what depends on what: still sealed
          before warmed, still condensed before polished. What changes is the yield, and the
          value of having predicted it. A poorer load changes the numbers and not the
          sequence.
    assumes:
      - warming ice-bearing soil releases water as vapour at low pressure
      - a leaner load carries the same salts in less water
    takeaway: A poorer load changes the yield of a process and not the order of it.
    format: SEQUENCE
    task: Order the operations for a lean load.
    cards:
      - Weigh the load and sample it, so the water it should give is known in advance.
      - Seal and warm the hopper, holding it below the temperature the salts decompose at.
      - Condense the vapour on the chilled plate and measure what was actually collected.
      - Pass the collected water through the lead polishing column at the usual rate.
    order: [0, 1, 2, 3]
    why: >-
      Sampling comes first on a lean load for a reason that hardly matters on a rich one. Without a
      figure to expect, a poor yield and a plant fault look identical. Warming has a ceiling as well
      as a floor, because perchlorate salts break down when heated hard and put chlorine compounds
      into the vapour. Measuring what was collected against what was predicted is what makes the
      sample worth taking. And the polishing rate does not change, because a leaner load carries
      the same salts in less water.

  - group: EQUIL
    title: Why the hotter pass gave less — Review
    task: Read a table of constants against temperature
    place: Reactor Hall
    scene: >
      Herrera has the equilibrium constant for the methane assembly at four temperatures: 500 K,
      550 K, 600 K and 650 K. It falls by more than a factor of 10 across that range.
    guide: >-
      A table of the equilibrium constant against temperature, and it falls. Start with
      what the constant is a property of, because two of these options assume it is a
      property of something else. Then read the direction. A constant that falls as the
      bed gets hotter is telling you which side the heat is on. That is a fact about the
      reaction, not about the equipment.
    background:
      - >-
          What K is a property of, and what it is not. The equilibrium constant belongs to the
          reaction, and it answers to temperature and to nothing else. Not to pressure. Not to
          the catalyst. Not to how much of anything you put in. Two of the options on this
          board get that wrong, and both are tempting, because both name something that really
          does affect the plant.
      - >-
          How to read the sign of the heat off a table. If K falls as the temperature rises, the
          reaction is giving heat out. Heat behaves as one of its products, so supplying more
          pushes the balance back. If K rose instead, the reaction would be taking heat in.
          That is exothermic and endothermic read straight off a column of numbers, with no
          apparatus involved.
      - >-
          Why this table is the plant's whole design problem, written in advance. Yield wants a
          cold bed. Rate wants a hot one. A factor of ten in K across 150 degrees says how
          expensive that argument is. The operating temperature is picked where a good enough
          catalyst makes a good enough yield reachable in the time available. The table is
          what tells you where to look.
    assumes:
      - the equilibrium constant depends on temperature and on nothing else
      - this reaction gives out heat
    takeaway: A table of constants against temperature is the plant's ceiling written out in advance.
    format: CHOICE
    question: What does a constant falling steeply with temperature tell the plant?
    choices:
      - The reaction gives out heat, and yield per pass is best at the lowest workable temperature.
      - The reaction takes in heat, so the ceiling on each pass improves as the bed is pushed hotter.
      - The catalyst is losing activity across that range, which is what the fall records.
      - Pressure has been changing with temperature, and the table mixes two effects.
    answer: The reaction gives out heat, and yield per pass is best at the lowest workable temperature.
    why: >-
      The direction the constant moves in tells you the sign of the heat. Falling with temperature
      means heat behaves as one of the products, so supplying more of it pushes the balance back.
      That is an exothermic reaction read straight off a table. And the consequence is this plant's
      whole design problem. Yield wants a cold bed. Rate wants a hot one. So the operating
      temperature is chosen where a good enough catalyst makes a good enough yield reachable in the
      time available.
    rebuttals:
      - A constant that rose with temperature would mean heat was taken in, and this one falls.
      - The constant is a property of the reaction and takes no account of what the catalyst is doing.
      - The constant is defined at a stated temperature and does not depend on the pressure at all.

  - group: PHASE
    title: Reading a blockage from outside the pipe — Review
    task: Read a second blockage from its readings
    place: Cold End
    scene: >
      A line on the oxygen side has slowed over two sols. Cho has four readings from around it, and
      the plant needs to know whether to warm the line out or open it up.
    guide: >-
      Same discipline as the methane line, on a different pipe. Three of these five
      readings are doing the ruling out, so start with them rather than with the alarm.
      And look at the shape of the flow again. Something that closes in a minute is not
      the same story as something that closes over two sols. Then one extra question,
      because Cho has to choose an action: what is the blockage made of?
    background:
      - >-
          Why a normal reading is a result. The alarm draws the eye and usually fits several
          explanations at once. What separates candidates is a reading an explanation says
          should have moved and which has not. A cold head at its set point says the
          refrigerator has capacity. A steady jacket pressure says the insulation is intact.
          Both are positive findings, not the absence of one.
      - >-
          Why the shape of a trace is evidence too. A valve closing is an event. It changes the
          flow in the minute somebody moves it, and then stops changing. A solid building on a
          wall is a process. It takes the flow down gradually, over sols, and keeps going. So
          two sols of decline rules out the valve without anybody inspecting the valve.
      - >-
          Why the material decides the action, not just the diagnosis. Carbon dioxide turns
          solid near 195 K and turns back to gas near 220 K. So warming this line clears it,
          and nothing has to be opened. Water would be a different answer entirely — ice needs
          273 K, which is far warmer than this line is built to go. Same symptom, same
          reasoning, two different repairs.
    assumes:
      - a refrigerator at its set point is doing its job
      - carbon dioxide deposits as a solid near 195 K
    takeaway: What a blockage is made of decides whether warming the line clears it.
    format: DIAGNOSIS
    headline: An oxygen line has slowed over two sols with the refrigerator holding temperature.
    task: Which explanation fits every reading?
    readings:
      - { zone: Oxygen line, label: Flow, value: down 60% over 2 sols, status: alarm }
      - { zone: Oxygen line, label: Inlet pressure, value: rising, status: high }
      - { zone: Refrigerator, label: Cold head temperature, value: at set point, status: normal }
      - { zone: Upstream trap, label: Carbon dioxide breakthrough, value: 700 ppm, status: alarm }
      - { zone: Line, label: Vacuum jacket pressure, value: unchanged, status: normal, note: the insulation is intact }
    choices:
      - { label: Carbon dioxide past the trap is freezing in the line, mechanism: 'Solid builds slowly on the wall and takes the flow down with it.' }
      - { label: The refrigerator has lost capacity over the last two sols, mechanism: 'A cold head above its set point cannot condense what it is given.' }
      - { label: A valve on this line has been partly closed by somebody, mechanism: 'A restriction cuts the flow and raises the pressure behind it.' }
      - { label: The vacuum jacket on this line has failed, mechanism: 'Heat leaking in warms the line and changes what it can carry.' }
    answer: Carbon dioxide past the trap is freezing in the line
    why: >-
      Three readings do the ruling out. A cold head at its set point has not lost capacity. A steady
      jacket pressure is intact insulation. And a valve moving would change the flow in the minute it
      moved, not over two sols. What is left is something accumulating on the wall, and the trap's
      700 ppm names the material. Which material it is decides the repair. Carbon dioxide turns back
      to gas near 220 K, so warming the line clears this one without opening anything.

# ---------------------------------------------------------------- the rooms
# What is inside each of the six buildings, and what the instrument on the wall
# is reading when the player walks in.
interiors:
  KINET:
    caption: The bed is the only part of this plant that does something nothing else can do.
    standLine: 9 sols of temperature profiles, and a hot spot 30 centimetres further down the bed.
    station:
      kind: panel
      title: Reactor bed profile
      rows:
        - { label: Hot spot position, value: 34 cm, status: alarm }
        - { label: Peak temperature, value: 604 K, status: normal }
        - { label: Pressure drop, value: 0.6 bar, status: normal }
        - { label: Conversion this pass, value: 58 %, status: low }
  EQUIL:
    caption: There is an amount of methane this mixture will settle at, and urgency does not move it.
    standLine: Carbon in against carbon out, for one pass and for the loop.
    station:
      kind: panel
      title: Reactor loop
      rows:
        - { label: Loop pressure, value: 12.0 bar, status: normal }
        - { label: Bed inlet temperature, value: 593 K, status: high }
        - { label: Methane in dry product, value: 96.4 %, status: normal }
        - { label: Carbon monoxide, value: 0.9 %, status: alarm }
  PHASE:
    caption: Everything in the stream stops being a gas somewhere, and not at the same temperature.
    standLine: The cold line, the drier and the trap, in the order the stream meets them.
    station:
      kind: panel
      title: Cold end
      rows:
        - { label: Cold head, value: 114 K, status: normal }
        - { label: Drier outlet water, value: 900 ppm, status: alarm }
        - { label: Methane tank pressure, value: 3.4 bar, status: high }
        - { label: Oxygen boil-off, value: 12.5 kg/sol, status: low }
  ELEC:
    caption: Charge and moles are one measurement in two units, and the gap between them is the cell.
    standLine: 12 cells, 640 amps, and 8% of it making nothing.
    station:
      kind: panel
      title: Water stack
      rows:
        - { label: Stack current, value: 640 A, status: normal }
        - { label: Cell voltage, value: 1.75 V, status: high }
        - { label: Hydrogen collected, value: 6.9 kg/sol, status: normal }
        - { label: Current efficiency, value: 92 %, status: low }
  GIBBS:
    caption: Some of what this station does runs on its own. The rest is paid for out of one array.
    standLine: The sol's ledger, with what the array delivered on the other side of it.
    station:
      kind: panel
      title: Station ledger
      rows:
        - { label: Array delivered, value: 1950 kWh, status: normal }
        - { label: Electrolysis, value: 380 kWh, status: normal }
        - { label: Liquefaction, value: 610 kWh, status: high }
        - { label: Habitat, value: 240 kWh, status: normal }
  SOIL:
    caption: What comes out of this ground is a solution, and everything dissolved in it has an address downstream.
    standLine: 1100 litres in the tank, and a column nobody has changed since sol 190.
    station:
      kind: panel
      title: Water plant
      rows:
        - { label: Holding tank, value: 1100 L, status: normal }
        - { label: Load water content, value: 4.5 %, status: low }
        - { label: Outlet conductivity, value: 6× the spring figure, status: alarm }
        - { label: Column in service since, value: sol 190, status: high }

# What each place says when the player reads its sign.
# --------------------------------------------------------------- the warm-ups
warmups:
  greet:
    title: Six people, and the next crew is eighteen months away
    why: >-
      There are six of you and no relief. Sundqvist, the plant production lead, wants you known
      to as many of them as you can before the first sol of production, because a disagreement
      here is not settled by anybody leaving the room — there is nowhere to go, and the transfer
      window is 486 sols out.
  trial-near:
    title: Walk the plant while your suit is fresh
    why: >-
      Nine modules buried to the eaves along one track, and an ascent vehicle four hundred
      metres past the last of them. Walk the whole line once early, on a clear sol, because the
      next time you do it will be in a dust storm on a suit that has been out for three hours
      already.
  follow:
    title: Cho walks the cold end once
    why: >-
      The liquefier's cold end is the part of the plant nobody has a diagram of at the level
      that matters — which joint frosts first, which line ticks when it is cooling. Cho, the
      cryogenics engineer, walks it once. Stay with her and keep off the lines; a boot on a cold
      transfer line is a leak you cannot weld out here.
  hunt:
    title: Six regolith bins, and the tally says four
    item: { name: regolith bin, plural: regolith bins }
    why: >-
      The feedstock tally is what the whole propellant schedule is planned against, and two bins
      are not where it says they are. A bin nobody can find is either full and idle or empty and
      counted, and those two mean very different launch dates.
  canvass:
    title: Who has actually seen the seal on module four
    why: >-
      The habitat's leak rate went up on sol 9 and the log blames a seal nobody has inspected
      since landing. Ask round the crew until enough of them have said what they have actually
      seen rather than what the log says, because six people is a small enough sample that one
      assumption becomes a fact.
  evade:
    title: Earth wants a call and the window is closing
    why: >-
      There is a downlink slot in twenty minutes and the flight surgeon wants a personal medical
      conference that will take all of it. The tank pressure survey has to go this window or
      wait a sol. Keep out of the way until the data is queued.
  tag:
    title: Catch Achebe before the array goes into storm mode
    why: >-
      Achebe, the power and electrolysis engineer, has the only measurement of what the array
      actually delivered before the dust thickened, and once it folds into storm mode the
      sensors read nothing useful for days. Every power decision this week is against that
      number.

copy:
  KINET: <p>Catalyst Bay. Nickel on alumina, in a bed the size of a kitchen bin, doing the one job in this plant that nothing else can do.</p>
  EQUIL: <p>The reactor hall. Carbon dioxide and hydrogen go in, methane and water come out, and the argument is about how much.</p>
  PHASE: <p>The cold end. Where a gas nobody can store becomes a liquid the vehicle can fly, at 112 kelvin.</p>
  ELEC: <p>The electrolysis hall. 12 cells splitting water, and 1 hot stack splitting carbon dioxide straight to oxygen.</p>
  GIBBS: <p>Plant control. The energy ledger for everything on this plain, and the desk where the arguments about it end.</p>
  SOIL: <p>The water plant. Frozen ground in at one end, and a brine that has to be cleaned before anything downstream can use it.</p>
  HAB: <p>The habitat. 6 people, 19 degrees, and the only room on the planet with a window somebody chose the view from.</p>
  PAD: <p>The pad. The ascent vehicle stands on it, 4.3 tonnes of methane aboard and 6.6 needed.</p>
  ARRAY: <p>The array shed. 1800 square metres of panel out there, and a sun sensor that says how much of the sun is reaching it.</p>
  TANKS: <p>The tank farm. Everything the plant has made so far, held at its own boiling point and losing a little every sol.</p>
  GARAGE: <p>The garage. Two pressurised rovers, one drill rig, and the dust that comes back in with all of them.</p>
  INTAKE: <p>The intake. 6 millibars of carbon dioxide compressed to 12 bar, which is most of the plant's power bill before any chemistry happens.</p>

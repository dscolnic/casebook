  - group: KINET
    task: Say what the catalyst is and is not doing
    title: What a catalyst cannot do
    reason: >-
      Her case rests on a better catalyst lifting the ceiling, so find out whether one can do that at all
    concept: What a catalyst does, and the two things it cannot do
    place: Catalyst Bay
    scene: >
      Kaur has two charges on the bench: the spent one from sol 288 and a fresh one still in its sealed can. Sundqvist's proposal
      assumes a better catalyst would raise the methane a pass can give.
    guide: >-
      Sundqvist's proposal rests on a claim about catalysts, and it is worth testing the claim before the proposal. A catalyst
      lowers the activation energy — the push a collision needs before it reacts. Hold on to one detail while you read the
      four options. It lowers that push in both directions at once. Forwards and backwards, by the same amount. Then ask of
      each option whether a catalyst could actually deliver it.
    background:
    - >-
      What a catalyst is actually doing. Molecules only react when a collision carries enough energy to get over a hump —
      the activation energy. A catalyst gives the reaction an easier route over that hump, usually by holding the molecules
      on a surface in a helpful arrangement. It is not consumed, and it does not appear in the balanced equation. It changes
      the road, not the destination.
    - >-
      Why it cannot move the balance point. The equilibrium constant K is set by the ratio of the forward speed to the backward
      speed. An easier route is easier in both directions at once, so both speeds rise and their ratio does not move. That
      ratio is K. This is the part people reliably get wrong, because it feels as though anything that helps a reaction should
      give you more of the product.
    - >-
      Why it cannot change the heat either. The heat a reaction gives out depends on two things only: what the molecules were
      at the start, and what they are at the end. It is the energy difference between them. The road taken in between does
      not enter into it. So a catalyst buys time and nothing else. In a plant with a fixed number of sols left, that is still
      worth a great deal.
    assumes:
    - a catalyst offers a reaction an easier path
    - equilibrium is where the forward and reverse rates match
    takeaway: A catalyst changes how long the balance takes to arrive and leaves the balance where it was.
    format: CHOICE
    question: A better catalyst is fitted at the same temperature and pressure. What changes?
    choices:
    - Equilibrium arrives sooner, and the methane the mixture settles at is the same.
    - More methane at equilibrium, since the easier path favours the forward direction.
    - Neither the speed nor the amount changes, since the bed is already at equilibrium.
    - Less heat is released per mole, since the reaction now takes an easier route to get there.
    answer: Equilibrium arrives sooner, and the methane the mixture settles at is the same.
    why: >-
      A catalyst lowers the activation energy, and it lowers it by the same amount in both directions. Forward and backward
      both speed up. So the ratio between them does not move, and that ratio is the equilibrium constant. Nor does a catalyst
      change how much heat comes out. That depends on what the molecules are at each end, not on the road taken between them.
      So a better catalyst buys time and no extra methane at all. In a plant with a fixed number of sols left, time is still
      worth a great deal.
    rebuttals:
    - An easier path is easier in both directions at once, which is why the ratio between them does not move.
    - The bed leaves short of equilibrium at this flow, which is exactly why the speed matters.
    - Enthalpy is fixed by the starting materials and the products, whatever route joins them.

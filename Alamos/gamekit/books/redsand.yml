- title: The batch you cannot take back
  objective: Decide whether this batch goes into the vehicle.
  briefing: A 410-kilogram transfer batch fails one flight-specification line; rejecting it leaves only enough time to 
    remake it if the decision is made now.
  stake: >-
    On sol 445 a 410-kilogram batch failed one flight limit, and once it is loaded it cannot come back. Thirty sols are
    left before the window, only just time to make it again. Today you say whether it flies, and set the oxygen to match.
  takeaway: Irreversible loading decisions are made against each specification line, with enough time left to recover 
    from a rejection.
  stops:
  - group: EQUIL
    task: Match each assay line to what it means for the vehicle.
    title: The line that fails
    at: spec-bench
    reason: >-
      The loading crew is waiting at the umbilical, and one assay line has to be judged before the valve opens
    place: Reactor Hall
    scene: The loading crew is waiting at the methane umbilical. Bhatt has four assay lines beside four flight limits. 
      Three are inside specification; water is 400 ppm — 400 parts in every million — against a 50 ppm limit. The batch can be remade before Sol 475 if
      it is rejected now; it cannot be removed after loading.
    guide: >-
      A specification is not one purity score. It is four separate limits, and each one is there to protect something different.
      So take the lines one at a time. Compare each against its own limit first. Then, for anything that is over, ask the
      question that actually matters. Where does that substance end up as the stream gets colder? And does that place have
      moving parts in it?
    background:
    - >-
      Why a specification is a list and not a score. Each line guards a different piece of hardware against a different failure.
      There is no way to average them. Being well inside three limits earns nothing against being outside the fourth, because
      the fourth is the one protecting the valve. A single purity number would hide exactly the information the loading crew
      needs.
    - >-
      Why the same amount of a substance can be harmless or fatal. It depends where it ends up. Carbon dioxide freezes out
      in the tank, sitting still, doing nothing. Water freezes at a far higher temperature, so it turns solid in the plumbing
      that the valves live in. Same physics, different address. One is ballast and the other stops a valve moving.
    - >-
      Why an impurity can be a performance cost rather than a hazard. Carbon monoxide burns, but it releases far less energy
      per kilogram than methane does. So carrying it is carrying dead weight: it takes tank volume and gives little back.
      That is a reason to have a limit on it. It is not a reason to stop a loading.
    takesAsRead:
    - "Stoichiometry as a feed rate: turning a production target into kilograms in"
    assumes:
    - water freezes at a temperature the vehicle's valves reach in use
    - carbon monoxide does not burn to give the energy methane does
    takeaway: A batch outside one flight-critical specification line is rejected even if every other line is excellent.
    format: PROTOCOL
    why: "A specification is not one purity score. Each line protects a different piece of hardware. Water is the failure
      here: 400 ppm against a limit of 50, so eight times over. And water freezes at a temperature the vehicle's valves reach
      in use, which puts solid ice in something that has to move. Carbon monoxide and carbon dioxide are both inside their
      limits. Carbon monoxide would be dead weight if it rose; carbon dioxide freezes out in the tank, where nothing moves.
      So each line has to be read against its own limit and its own failure, before the valve opens. Because the water line
      is outside its own limit and loading is one-way, this batch is held and remade rather than averaged against three passing
      lines."
    scenarios:
    - Methane at 99.1% against a limit of 99.0.
    - Water at 400 parts per million against a limit of 50.
    - Carbon monoxide at 0.5% against a limit of 1.0.
    - Carbon dioxide at 0.2% against a limit of 0.5.
    choices:
    - Inside the limit, and the margin is thin enough to be worth watching on the next batch.
    - Eight times the limit, and it freezes in a valve at the temperature that valve runs at.
    - Inside the limit; it is ballast that costs a little performance and does no damage.
    - Inside the limit, and it freezes out in the tank rather than in a moving part.
    mapping: [0, 1, 2, 3]
  - group: PHASE
    task: Work out how much oxygen goes with the methane
    title: How much oxygen a tonne of methane needs
    at: umbilical
    reason: >-
      Methane alone does not fly, and the oxygen going up beside it has to be checked independently
    place: Cold End
    scene: |-
      Bhatt writes the loading numbers beside the chemistry check. The tanks take 23,000 kilograms of oxygen for 6,600 of methane. That is 3.48 to one. She wants somebody to say why the recipe gives a different number.
    guide: |-
      Bhatt wants an answer in kilograms. The recipe is written in molecules. That gap is the whole question.

      The recipe says one methane molecule needs two oxygen molecules. Two to one, by count. But molecules do not all weigh the same. Count out the same number of each, and the oxygen weighs twice as much. That is what the molar masses on the board are telling you: 32 grams against 16.

      Five numbers are up there and two belong to other questions. And notice, in passing, that a real engine runs away from this ratio on purpose.
    background:
    - >-
      Why counting is not weighing. A balanced equation counts molecules, because that is how a reaction really works.
      A tank is filled by weight, because that is what a pump moves. Those two only match if the molecules weigh the
      same, and they almost never do. Here a 2-to-1 count comes out as 4-to-1 by weight, and the extra factor of two
      is just how much heavier oxygen is.
    - >-
      Why a second person checks this. The oxygen tank and the methane tank are filled by different plants on
      different sols. Nothing on the rocket notices a mismatch until the engine runs, and by then the wrong answer has
      flown. So somebody works it out from the recipe instead of from the loading sheet, and the two are compared.
    - >-
      Why the engine does not use this number exactly. Burning it all takes 4 kilograms of oxygen for every kilogram
      of methane. Rocket engines usually run with a bit less oxygen than that. The exhaust comes out cooler, which the
      engine's own metal is grateful for, and the lighter leftovers leave faster. That is a design choice about
      performance. It does not change the chemistry the loading team has to know.
    assumes:
    - a balanced equation gives the count of molecules a reaction needs
    - a molar mass turns a count of molecules into a weight
    takeaway: Chemistry tells you the count. Flight tells you what to load. They are different numbers, and both are
      right.
    format: BALLPARK
    question: Why does the rocket load 3.48 kilograms of oxygen for each kilogram of methane, when burning it all
      takes 4.0?
    why: The recipe gives the reference. CH₄ + 2O₂ → CO₂ + 2H₂O. Burning it all takes 64 grams of oxygen for every 16
      of methane, which is 4.0 kilograms for every kilogram. The rocket is loaded at about 3.48 instead, and that is
      on purpose. An engine picks its mix for thrust, for how hot the exhaust runs, and for what the metal will stand.
      The choice does not make the chemistry wrong. It tells the loading team which number is chemistry and which is
      flight.
    estimate:
      prompt: Burning methane completely is CH₄ + 2O₂ → CO₂ + 2H₂O. Before you look at what the rocket actually
        loads, work out how many kilograms of oxygen one kilogram of methane needs.
      question: Estimate the mass of oxygen needed for each kilogram of methane burned.
      labels:
      - 2  (moles of oxygen per mole of methane)
      - 32.0 g/mol  (molar mass of oxygen)
      - 16.0 g/mol  (molar mass of methane)
      - 6600 kg  (methane the vehicle carries)
      - 44.0 g/mol  (molar mass of carbon dioxide)
      values: [2, 32, 16, 6600, 44]
      slots: 3
      template: "{0} × {1} ÷ {2}"
      formula: a*b/c
      correct: [0, 1, 2]
      target: 4
      tolerance: 0.3
      units: kg of oxygen per kg of methane
      solution: 2 × 32.0 ÷ 16.0 = 4.0 kilograms of oxygen for each kilogram of methane.
      explanation: The chemistry says 4.0 kilograms of oxygen for each kilogram of methane. The rocket loads less than
        that on purpose. The two numbers answer different questions.
      relationship: Mass ratio = the count from the balanced equation × what a mole of oxygen weighs ÷ what a mole of
        methane weighs.
  - group: ELEC
    task: Say whether the stacks can be pushed harder
    title: What limits the current
    reason: >-
      Running the stacks harder would close the gap this batch leaves, if the cooling loop can take it
    concept: "Overpotential: the voltage above the minimum, and where it goes"
    place: Electrolysis Hall
    scene: >-
      Sundqvist wants the stacks run 20% above rated current for the sols that remain. Achebe has the measured stack-voltage
      curve and cooling-loop capacity beside the request.
    guide: >-
      Faraday's law says a bigger current makes proportionally more hydrogen. It does not say the hardware can carry that
      current. Push more amps through a stack and every cell needs more volts than before. That extra is the
      overpotential — the voltage above the least the chemistry itself needs. Volts times amps is power, and power that
      does no chemistry leaves as heat. So work from Achebe's voltage-current curve and her cooling capacity rather than
      from the 1.23 V figure.
    background:
    - Why Faraday's law is not the hardware limit. Charge sets how much product is possible. It does not tell you what
      voltage the real stack needs. It does not say how hot the plates get. And it says nothing about whether the
      cooling loop can carry that heat away.
    - Why more current costs more than its share of the power. Slow electrode reactions and plain resistance both push
      the working voltage up as the current rises. Electrical power is current times voltage. So a fifth more current
      costs more than a fifth more power.
    - Why the limit is a thermal one here. Achebe has measured how this stack's voltage climbs with current, and she
      knows what her cooling loop can carry away. Between them they say how hard this particular stack can be driven
      before it runs too hot. That is an engineering measurement sitting on top of Faraday's chemistry.
    assumes:
    - the stack's measured operating voltage rises with current because of kinetic and resistive losses
    - the cooling loop has a finite heat-removal capacity
    takeaway: Faraday's law sets product per coulomb; the stack's voltage-current curve and cooling system set how many 
      coulombs per second the hardware can survive.
    format: CHOICE
    question: What actually limits the proposed 20% current increase?
    choices:
    - 'The measured stack thermal limit: higher current also raises the required operating voltage and the cooling load.'
    - Faraday's constant, which sets a maximum current once a cell has run for one sol.
    - The reversible 1.23 V potential, because any current above the value at 1.23 V is chemically impossible.
    - The hydrogen's chemical energy, which rises as the cell voltage is increased.
    answer: 'The measured stack thermal limit: higher current also raises the required operating voltage and the cooling load.'
    why: >-
      Faraday's law is an amount per charge, not a ceiling on current. More current can make more hydrogen. But real
      electrode kinetics and resistance push the working voltage up while it does. Electrical power is current times
      voltage, so the power drawn and the heat made climb faster than the current alone. That is why Achebe sets the
      ceiling from her measured voltage-current curve and her cooling loop. The chemistry says how much product a coulomb
      buys. The hardware says how fast the station can spend coulombs.
    rebuttals:
    - Faraday's constant is a conversion between charge and moles and does not impose a one-sol current limit.
    - The reversible potential is a thermodynamic reference, not a maximum allowable operating current.
    - Hydrogen's chemical state does not become more energetic because the electrolyser was run at a higher voltage.
- title: Release the full tank
  objective: Say what is known, how well it is known, and what was never established.
  briefing: The target masses and final assays are in; the last job is to decide whether the propellant set is ready to 
    become a flight system.
  stake: >-
    On sol 475, eleven sols before the window, the tanks hold 6.6 tonnes of methane and 23 of oxygen. Every batch aboard
    passed its test, but doubt is left. Today you write the rule the next crew works to, and say whether the tanks are
    released.
  takeaway: Readiness means the required mass is aboard, every loaded batch meets its limits, and the remaining 
    uncertainty is stated rather than hidden.
  stops:
  - group: SOIL
    task: Set the warning and column-swap thresholds, then replay the historic conductivity rise without changing them.
    title: Write the rule before the trace moves
    at: columns
    reason: >-
      The water alarm must protect the flight-ready plant and the crew that inherits it without relying on anyone remembering
      Sol 299.
    place: Water Plant
    scene: Abiola is freezing the water rule before flight release. He loads the historic conductivity breakthrough into
      the simulator. Once the replay starts, the thresholds are locked; the same rule will remain for the crew that 
      inherits the plant.
    guide: >-
      One rule, written before the trace moves, and fixed the moment you release it. Two numbers set it. The changeover takes
      one update to complete once it is called, and the trace keeps climbing through it. So work backwards from 3 by
      however far this trace climbs in a single update. Then check the other direction too. Set
      the line too low and a perfectly good bed gets swapped out for a reading that meant nothing.
    background:
    - >-
      Why conductivity is the signal to write the rule on. It climbs as the column runs out of capacity and starts letting
      ions through. So it moves *before* the water is out of specification, not after. That gap is the only reason a rule
      is possible at all. A measurement that only told you after the damage would be a record, not a warning.
    - >-
      Why a threshold has to allow for lead time. The swap is not instant. Call it and one update passes before the fresh
      bed is in service, and the trace keeps climbing through that update. So the line cannot sit at the limit. It has to
      sit far enough below the limit that the climb during the swap still lands underneath it. Work backwards from the consequence,
      never forwards from the reading.
    - >-
      What writing for a crew you will never meet changes. Nobody will be there to exercise judgement when it fires. So the
      rule has to hold for a trace nobody has seen, including one that rises faster than this one. That argues for margin.
      But margin costs columns, and swapping a clean bed wastes the very capacity the rule exists to protect. Both errors
      are real, which is what makes this a decision.
    assumes:
    - an exchange bed reaches breakthrough without warning
    - a lead and lag pair lets one bed be changed while the other works
    takeaway: A breakthrough warning is only useful if its trigger is written before the trace rises and leaves enough 
      lead time for the swap.
    format: TRIGGER
    question: >-
      The specification for feed water — the list of limits it has to meet — puts conductivity at 3 times the clean
      baseline. At what conductivity do you move the lag column into lead service, given the changeover
      takes one update to complete?
    trigger:
      hint: >-
        Set the rule before release. The swap takes one update to complete, and the accepted-water limit on this normalised
        replay is 3.0 times the clean baseline.
      direction: rising
      scale:
        label: Conductivity of the treated water
        min: 1
        max: 6
        step: 0.1
        unit: × clean baseline
        anchors:
        - {at: 1.0, means: 'the bed is clean and nothing is passing through it'}
        - {at: 4.5, means: 'well outside specification, with the electrolyser taking whatever the bed let through'}
      objective: >-
        The fresh bed is in lead service before the trace crosses 3 × baseline.
      consequenceLimit: 3
      rehearsal:
        note: the bed that was changed out last quarter
        stream:
        - {value: 1.0, hoursLeft: 8}
        - {value: 1.05, hoursLeft: 7}
        - {value: 1.2, hoursLeft: 6}
        - {value: 1.7, hoursLeft: 5}
        - {value: 2.4, hoursLeft: 4}
        - {value: 3.6, hoursLeft: 3}
        - {value: 4.8, hoursLeft: 2}
        - {value: 5.6, hoursLeft: 1}
        - {value: 5.9, hoursLeft: 0}
      conditions:
      - id: swap
        label: Move lag column into lead service
        leadHours: 1
        window: {min: 1.6, max: 2}
      stream:
      - step: 0
        value: 1
        hoursLeft: 8
        at: update 0
        update: 1 × clean-baseline conductivity
      - step: 1
        value: 1
        hoursLeft: 7
        at: update 1
        update: 1 × clean-baseline conductivity
      - step: 2
        value: 1.1
        hoursLeft: 6
        at: update 2
        update: 1.1 × clean-baseline conductivity
      - step: 3
        value: 1.3
        hoursLeft: 5
        at: update 3
        update: 1.3 × clean-baseline conductivity
      - step: 4
        value: 1.6
        hoursLeft: 4
        at: update 4
        update: 1.6 × clean-baseline conductivity
      - step: 5
        value: 2
        hoursLeft: 3
        at: update 5
        update: 2 × clean-baseline conductivity
      - step: 6
        value: 2.6
        hoursLeft: 2
        at: update 6
        update: 2.6 × clean-baseline conductivity
      - step: 7
        value: 3.4
        hoursLeft: 1
        at: update 7
        update: 3.4 × clean-baseline conductivity
      - step: 8
        value: 4.5
        hoursLeft: 0
        at: update 8
        update: 4.5 × clean-baseline conductivity
    answerText: >-
      Swap at about 1.7 × baseline. It fires with the update the changeover needs, and the trace does not reach 3 × baseline
      until two updates later.
    why: >-
      The outlet stays near baseline while the front is still inside the bed, then climbs fast once it reaches the end. So
      a threshold is only useful if the response can finish before the water leaves specification. Here the swap takes one
      update. Fire at about twice baseline and it completes while the next reading is still 2.6. Wait for 2.6 and it completes
      after the trace has already crossed 3.0. That is the whole calculation: work back from the limit by one update's worth
      of climb. And write it before the replay, so the next crew inherits a rule rather than somebody's hindsight.
  - group: KINET
    task: State what is known about the catalyst and what is not
    title: The honest claim about the bed
    reason: >-
      The catalyst record has to say what 175 sols of qualified clean-feed running proved, and what it did not.
    place: Catalyst Bay
    scene: Kaur is freezing the catalyst record on Sol 475. The last spare charge has run 175 sols since commissioning, 
      inside the stated temperature/flow envelope, while the polishing outlet stayed below its halide warning line.
    guide: >-
      Kaur has a long run and four claims. Ask what conditions were actually varied. The charge saw the qualified temperature
      and flow envelope and 175 sols of clean feed. It did not see the chlorine-bearing contamination that killed the previous
      charge. A strong record supports a stronger duration claim than five sols did, but still cannot prove resistance to
      a poison that was deliberately excluded.
    background:
    - Why duration strengthens one claim and not every claim. One hundred seventy-five sols of stable conversion is 
      strong evidence about durability inside the tested clean-feed operating envelope.
    - Why absence of a poison still cannot prove resistance to it. The water train was repaired precisely so halide 
      breakthrough would not reach the reactor feed. The new run therefore contains no controlled test of 
      chlorine-poison tolerance.
    - Why conditions stay attached to the handover. Temperature, flow, pressure and feed quality define the operating 
      envelope in which the result was observed. Removing them turns a supported statement into a broader unsupported 
      one.
    takesAsRead:
    - Rate constants, and how steeply they climb with temperature
    assumes:
    - a claim is limited by the conditions it was tested under
    - a poison accumulates over time rather than acting at once
    takeaway: A long run strengthens the claim inside the tested operating envelope; it does not create evidence for 
      conditions that were excluded.
    format: CHOICE
    question: What is the strongest claim the 175-sol record actually supports?
    why: The last charge has held stable conversion for 175 sols inside the qualified temperature, pressure, flow and 
      clean-feed envelope. That is real durability evidence and should be stated plainly. It still does not show 
      resistance to chlorine-bearing contamination, because the repaired water train kept that challenge out of the 
      feed. The strongest defensible handover therefore includes both the duration and the conditions.
    choices:
    - It held the qualified conversion over 175 sols inside the stated operating envelope on clean feed.
    - It is immune to chlorine poisoning because no second decline occurred after Sol 300.
    - It is proven across any temperature and flow the next crew may choose because the run lasted most of a season.
    - Nothing can be claimed until another catalyst charge is tested in parallel.
    answer: It held the qualified conversion over 175 sols inside the stated operating envelope on clean feed.
    rebuttals:
    - The poison was excluded by the repaired water train, so absence of failure is not a chlorine-resistance test.
    - Long duration does not substitute for conditions that were never tested outside the qualified envelope.
    - A parallel charge would add evidence, but 175 sols of controlled operation already supports a narrow, useful 
      durability claim.
  - group: GIBBS
    task: Decide whether the propellant set is ready to become a flight system.
    title: Release the full tank
    at: loadboard
    reason: The masses are aboard, every loaded batch has an assay, and the next valve the station opens belongs to the 
      flight.
    concept: What an assay is for, and what a specification is a list of
    place: Plant Control
    scene: 'Wells puts the final board beside the ascent vehicle telemetry. Methane: 6.6 tonnes. Oxygen: 23 tonnes. Every
      loaded batch is inside its own flight limits; the Sol 445 batch was rejected and remade. The conductivity trigger is
      armed, and the catalyst record is qualified rather than universal. The return window opens in eleven sols.'
    guide: Do not ask whether every uncertainty on Mars has disappeared. Ask whether the flight decision's required 
      claims are supported. The tank masses are measured. Batch acceptance is documented. The rejected batch stayed out.
      The water-control rule is armed. The remaining unknowns concern future column life, deeper ice and untested 
      catalyst-poison conditions—not the specification of the propellant already aboard.
    background:
    - What release means. This is not a claim that the plant is solved forever. It is a decision that the propellant set
      now aboard satisfies the vehicle's stated mass and chemistry requirements.
    - Why unresolved science can remain. The next crew still needs better breakthrough statistics and deeper-ice 
      chemistry. Those uncertainties belong to future production. They do not automatically invalidate measured, 
      in-specification propellant already loaded.
    - Why the rejected batch matters. Readiness includes the decisions not taken. The Sol 445 water-contaminated batch 
      never entered the vehicle, and the replacement production is included in the final mass. The audit trail therefore
      closes mass, chemistry and reversibility together.
    assumes:
    - the vehicle flight specification is the acceptance rule for propellant already loaded
    - all loaded batches have traceable assays and the displayed tank masses are reconciled
    takeaway: 'Readiness is a bounded claim: these measured tanks meet these flight requirements, with the remaining unknowns
      left attached to future production.'
    format: CHOICE
    question: What do you sign eleven sols before the return window?
    why: The required flight claims are now supported independently. The tank masses are reconciled at 6.6 tonnes 
      methane and 23 tonnes oxygen. Every batch that entered the vehicle passed its own specification; the batch that 
      failed did not enter. The water system has a prewritten breakthrough response, and the catalyst record states only
      the conditions it actually survived. Waiting for every unknown about deeper regolith or future column lifetime 
      would not improve the chemistry of propellant already measured aboard. Releasing without conditions would 
      overstate what the season proved. The defensible action is to release this propellant set to flight and carry the 
      remaining limits forward.
    choices:
    - Release the propellant set to flight; the required masses and loaded-batch specifications are met, with the 
      qualified operating limits recorded.
    - Hold the vehicle until deeper-ice chemistry and the next polishing-column lifetime are known, even though the 
      propellant already aboard meets specification.
    - Release it unconditionally and remove the catalyst and water qualifications because the final tank masses are 
      correct.
    - Add the rejected Sol 445 batch for extra margin, since three of its four assay lines passed.
    answer: Release the propellant set to flight; the required masses and loaded-batch specifications are met, with the 
      qualified operating limits recorded.
    rebuttals:
    - Those are future-production uncertainties. They do not change the measured chemistry of the accepted propellant 
      already aboard.
    - Correct tank mass does not erase the limits of the evidence about future catalyst and water-system operation.
    - One failed flight-critical specification line is enough to reject a batch; passing three others does not average 
      it back into compliance.
lessons:
- group: EQUIL
  title: What the loop settles at — Review
  place: Reactor Hall
  scene: >
    A second reactor on the station makes ammonia for the greenhouse, out of nitrogen and hydrogen. It gives out heat, and
    it ends with fewer gas molecules than it started. Four changes are proposed to it.
  guide: >-
    Different reactor, different product, same four questions. That is the point of putting it in front of you again. For
    pressure, count the gas molecules on each side. For temperature, ask which side the heat is on. For anything added or
    taken away, ask whether it takes part in the reaction at all. And for the catalyst, ask whether it changes the destination
    or only the journey.
  background:
  - >-
    Why the substance in the pipe does not matter. Le Châtelier's principle is about the shape of the equation, not about
    what the molecules are. N₂ + 3H₂ ⇌ 2NH₃ has four gas molecules going in and two coming out, and it gives off heat. So
    does the Sabatier reaction, in its own numbers. Two different plants, two different products, and the same four answers.
  - >-
    Why counting molecules is the whole of the pressure question. Squeeze a mixture and it shifts to whichever side occupies
    less room, because that relieves some of the squeeze. Fewer gas molecules means less room. So the side with fewer wins.
    Here that is the ammonia side, four going to two, and it is why industrial ammonia plants run at pressures that sound
    absurd.
  - >-
    Why the catalyst is on this board at all. It is here to be the one that does not move the balance. Every other change
    on the list shifts where the mixture settles. The catalyst changes how long it takes to get there and leaves the destination
    exactly as it was. Meeting that fact in a second reactor is the point of meeting it twice.
  assumes:
  - a reaction that gives out heat has its balance pushed back by heating
  - fewer gas molecules on one side makes that side favoured by pressure
  takeaway: A rule about balance is about the equation's shape, not about the substance in the pipe.
  format: PROTOCOL
  task: Match each change to what it does to the ammonia at equilibrium.
  scenarios:
  - The vessel is squeezed to twice its working pressure.
  - The vessel is warmed by 60 degrees.
  - Ammonia is condensed out of the product and the rest returned.
  - A better catalyst is fitted at the same conditions.
  choices:
  - 'More ammonia: four gas molecules go in and two come out, so crowding favours the products.'
  - 'Less ammonia: heat is one of the outputs, and supplying more of it pushes the balance back.'
  - 'More ammonia: removing an output leaves the mixture short of what it settles at.'
  - 'No change in amount: the balance is reached sooner and it is the same balance.'
  mapping: [0, 1, 2, 3]
  why: >-
    The shape of the equation decides all four answers. That is why a reactor making a completely different substance behaves
    the same way. Count the gas molecules and you know what pressure does: four in, two out, so squeezing favours the ammonia.
    Ask which side the heat is on and you know what temperature does: heat is an output here, so adding more pushes the balance
    back. Ask whether what was removed takes part, and you know whether the balance moves at all. And the catalyst changes
    the time, never the destination.

- group: KINET
  title: Rate is not yield — Review
  task: Separate speed from ceiling on a different reaction
  place: Catalyst Bay
  scene: >
    The greenhouse reactor is running cold and slow. Its operator proposes 40 degrees more, and the same argument that ran
    through the propellant plant a fortnight ago starts again.
  guide: >-
    The same argument as the propellant plant, in a different building. Each option here makes two claims at once, so check
    both halves separately. One is about how fast the reaction gets to its balance. The other is about how much product that
    balance holds. Those are two different quantities, and for a reaction that gives off heat they are free to disagree with
    each other.
  background:
  - >-
    Why one setting moves two quantities. Temperature reaches the reaction twice over. It reaches the rate constant, which
    climbs steeply because more collisions arrive carrying enough energy to react. And it reaches the equilibrium constant,
    which for a heat-releasing reaction falls, because heat behaves as one of the products. Two separate routes, and nothing
    says they have to agree.
  - >-
    Why this is the normal case, not a special one. It is tempting to expect a single setting to have a single effect. Most
    of the interesting decisions in a plant are the other kind. Heat helps the rate and hurts the ceiling. More current makes
    more hydrogen and more waste heat. Faster flow raises throughput and cuts contact time. Every one of those is one knob
    pulling two ways.
  - >-
    What the industry actually does about it. If heat buys speed and costs yield, the usual answer is to buy the speed some
    other way. Run the bed at the coolest temperature that gives an acceptable balance. Then spend money on a catalyst good
    enough to reach that balance in the time available. That is why catalyst research is worth what it is worth.
  assumes:
  - heating raises the fraction of collisions that clear the barrier
  - an exothermic reaction's balance is pushed back by heating
  takeaway: One setting moving two quantities in opposite directions is the normal case rather than a special one.
  format: CHOICE
  question: A reaction that gives out heat is run hotter. Which pair of statements is right?
  choices:
  - Faster to its balance, and the balance itself holds less product.
  - Faster to its balance, and the balance holds more product as well.
  - Slower to its balance, and the balance holds less product.
  - Neither the speed nor the balance moves; temperature acts on the catalyst instead.
  answer: Faster to its balance, and the balance itself holds less product.
  why: >-
    Temperature reaches this reaction by two routes, and they run opposite ways. The rate constant climbs steeply, because
    more collisions arrive carrying enough energy to react. The equilibrium constant falls, because heat behaves as one of
    the products of a reaction that gives heat off. So the bed gets to its balance faster and the balance holds less. Every
    exothermic industrial reaction lives with that trade. The usual answer is a temperature low enough for a decent balance,
    and a catalyst good enough to reach it in the time available.
  rebuttals:
  - Rising with temperature is what the rate does, and the balance for this kind of reaction does the opposite.
  - Reactions do not slow when heated; it is the ceiling that comes down.
  - Temperature acts on the molecules rather than on the catalyst, and both the speed and the balance respond.

- group: PHASE
  title: What freezes before methane condenses — Review
  concept: "Phase changes, and that every substance has its own temperature for one"
  place: Cold End
  scene: >-
    Cho has four things from the process stream on the board: water, carbon dioxide, nitrogen and argon. She has the
    temperature each one gives up at, worked out for this pipe's pressure. She wants them in order, warmest first.
  guide: |-
    All four are in the stream at the same time. Nothing here happens before anything else. What sorts them is how tightly each one holds on to itself.

    So ask of each one: what kind of grip does it have?

    The strongest grip is called a hydrogen bond. It happens when a hydrogen atom sits right next to an oxygen, a nitrogen or a fluorine. Next comes the ordinary pull between whole molecules. Weakest of all is a flicker of attraction between electron clouds — every substance has that one, and some have nothing else.

    And one of these four is a single atom, with the least to hold on with.
  background:
  - >-
    Why stickiness sets a boiling point. To leave a liquid, a molecule has to break away from its neighbours. The
    harder they hold on, the more energy that takes. Energy means temperature. So a substance whose molecules grip
    each other hard stays liquid up to a warm temperature. One whose molecules barely notice each other needs deep
    cold before it will turn to liquid at all.
  - >-
    The three grips, in order. A hydrogen bond forms when hydrogen sits next to oxygen, nitrogen or fluorine. It is
    much the strongest of the three. That is why water is still liquid at temperatures where the others are all gas.
    Next comes the ordinary pull between whole molecules. Weakest of all is the flicker between electron clouds, which
    every substance has and some substances have nothing else.
  - >-
    Why argon is last. It is a single atom, not a molecule. It has no shape and nothing sticking out. So it has
    nothing but that flicker between electron clouds. And a small atom has a small cloud. Argon gives up near 87 K,
    colder than nitrogen, which is why getting it back means going deeper than anything else in this stream.
  assumes:
  - each substance gives up at its own temperature
  - a stronger grip means it gives up at a warmer temperature
  takeaway: You can only put a cooling job in order once somebody has said what the pressure is.
  format: SEQUENCE
  task: Put the substances in order by the temperature each one gives up at, warmest first.
  cards:
  - Water. Hydrogen bonds grip hard, so it holds on far above room temperature.
  - Carbon dioxide. At this pressure it turns straight to a solid near 195 K.
  - Nitrogen. A small molecule with a weak grip, giving up near 77 K.
  - Argon. A single atom, with the weakest grip of anything in the stream.
  order: [0, 1, 2, 3]
  axis: Put the four in order by the temperature each one gives up at, warmest first. Nothing here happens before
    anything else. They are all in the stream together, and the cooling picks them off in the order of how hard they
    grip.
  ends: [Gives up warmest, Gives up coldest]
  why: >-
    At this pipe's pressure, water goes first. Carbon dioxide follows, then nitrogen, then argon in the deepest cold.
    The order is set by how hard each one holds on to itself, and argon, a lone atom, holds on least. The rule worth
    keeping is not four temperatures learned by heart. Every one of them moves with the pressure, so the plant works
    out its own numbers for its own pipe before it uses cold to separate anything.

- group: ELEC
  title: Which electrode does which job — Review
  place: Electrolysis Hall
  scene: >
    The station's oxygen generator splits water in a low-temperature cell rather than a hot one. Achebe wants it read the
    same way as the hot stacks, part by part.
  guide: >-
    A cold cell this time instead of a hot one, and the reading does not change. Ask of each part which way the electrons
    are being pushed. Electrons in means reduction, a gain. Electrons out means oxidation, a loss. That much is true of any
    water-splitting cell, whatever it is built from. One item on this board is not a place at all, so ask what a voltage does
    rather than where it is.
  background:
  - 'Why the electrode names do not depend on the cell. An electrode is named by the process occurring there: reduction where
    electrons are supplied, oxidation where electrons are removed.'
  - What changes between the hot and cold cells. Different electrolytes carry different ions, but in both cases the 
    electrolyte carries ionic charge while keeping the product gases separated from the external electron path.
  - Why voltage belongs on a board of parts. The reversible potential is the thermodynamic reference — the least
    voltage the chemistry can be done at, which is 1.23 V here. A working cell always needs more than that. Some of the
    extra pushes the reactions along at the electrodes. Some is simply lost to resistance in the cell. And the heat
    balance answers to the thermoneutral voltage as well, so it is not one subtraction from 1.23 V.
  assumes:
  - reduction happens where electrons are pushed in
  - the electrolyte carries ions and not electrons
  takeaway: The electrode roles follow electron transfer; practical voltage and heat depend on the cell's 
    thermodynamics, kinetics and resistance.
  format: PROTOCOL
  task: Match each part of this cell to what happens there.
  scenarios:
  - The electrode the supply pushes electrons into.
  - The electrode electrons are drawn out of.
  - The membrane between them.
  - The applied voltage.
  choices:
  - Water gains electrons here and hydrogen comes off.
  - Water loses electrons here and oxygen comes off.
  - It passes hydrogen ions and keeps the two gases apart.
  - It has to exceed the minimum the thermodynamics sets before anything happens at all.
  mapping: [0, 1, 2, 3]
  why: >-
    A cell is one redox reaction with its two halves held apart. Electrons supplied to an electrode drive reduction. Electrons
    removed drive oxidation. The electrolyte carries ions rather than the external electrons, and it keeps the two products
    apart. The applied voltage is not an electrode at all. It is a condition set on the whole cell. The reversible value is
    the thermodynamic reference, and a working cell needs more than it to carry any useful current. That extra voltage costs
    electricity, but the heat balance is not simply 'everything above the minimum becomes heat.'

- group: GIBBS
  title: What has to be paid for — Review
  place: Plant Control
  scene: >
    Demir has four of the station's processes on the board. She wants them sorted before the quarterly energy plan is written.
    Two of them run downhill. Two have to be pushed.
  guide: >-
    Two questions of each process, in this order. First: does it run downhill on its own? Or does something have to push it?
    That question decides whether there is a bill at all. Second, take the ones that do need pushing. Is the bill chemical
    or physical? And watch out for one process here. It runs downhill so willingly that stopping it is what costs money.
  background:
  - >-
    Why direction and speed are separate questions. A negative free-energy change says a process can run on its own. It says
    nothing whatever about when. Making methane is downhill. It would still take years without a catalyst. So "it runs on
    its own" and "it runs" are two different claims. Only the first one is about thermodynamics.
  - >-
    Why the same reaction appears twice on this board. Splitting water and making methane are close to one reaction. It is
    read in two directions. One is uphill and has to be paid for electrically. The other is downhill and pays out. That is
    one number with two signs. So this station can run one step for free and never the other.
  - >-
    Why stopping something downhill costs money. Boiling is downhill. Heat arrives and liquid becomes gas without anyone helping.
    So keeping oxygen liquid means fighting a process that wants to happen. Every second, forever. That is what the refrigerator
    is for. A downhill process is not always the cheap one. It is only cheap if you wanted it to happen.
  assumes:
  - a negative free-energy change means a process can run on its own
  - running on its own says nothing about how fast a process goes
  takeaway: Direction is what sorts a station's processes. It says which of them have a bill nobody can design away.
  format: CASEBOOK
  task: Match each process to what it needs from the station.
  scenarios:
  - Methane assembling from carbon dioxide and hydrogen over the bed.
  - Water splitting into hydrogen and oxygen in the stack.
  - Liquid oxygen boiling in a warmed tank.
  - Compressing the atmosphere from 6 millibars to 12 bar.
  choices:
  - Runs downhill and needs a catalyst to be quick about it.
  - Runs uphill and needs the free-energy difference supplied electrically.
  - Runs downhill and is the thing the refrigerator is fighting.
  - Runs uphill and is paid for in shaft work rather than in chemistry.
  mapping: [0, 1, 2, 3]
  why: >-
    Direction and speed are separate questions. Only direction says whether there is a bill. Making methane runs downhill,
    and it runs slowly. That is exactly what a catalyst is for. Splitting water is close to the same reaction backwards. So
    it runs uphill, and the bill is the free-energy difference paid in electricity. Boiling runs downhill too. That is why
    keeping oxygen liquid costs work, every second, to stop something that wants to happen. Compression is uphill, and physical
    rather than chemical. It is paid for at the compressor.

- group: SOIL
  title: Getting water out of frozen ground — Review
  place: Water Plant
  scene: >
    A load has come in at 3% water instead of eight, and the same four operations have to run on it. Sora Nakagawa, the drill
    and excavation operator, wants the order confirmed before the hopper is sealed.
  guide: >-
    Same four operations, a much poorer load. So ask a different question this time: what would you be unable to tell apart
    if a step were missing? A lean load gives little water. So does a broken plant. Something on this list is what separates
    those two. And note that the warming has a ceiling as well as a floor, because perchlorate salts come apart when they
    are heated hard.
  background:
  - Why a lean load needs the sample and a rich one does not. Expect eight per cent water and get eight, and nothing 
    needs explaining. Expect nothing in particular and get very little, and you cannot tell a poor load from a plant 
    fault. The sample turns the second sol into a measurement instead of a shrug. That is why it moves to the front when
    the ground gets worse.
  - Why the warming has a ceiling. Oxychlorine salts such as the perchlorates decompose — come apart — when they are
    heated hard. What they leave behind is a reactive chlorine compound. So the plant heats only enough to free the
    water. Heating past that is a second way of spoiling the batch. It is not the same thing as perchlorate dissolving
    into chloride, which happens at any temperature.
  - 'Why the order is the same on a poor load as on a good one. A leaner load carries the same salts in less water. It does
    not change what depends on what: still sealed before warmed, still condensed before polished. What changes is the yield,
    and the value of having predicted it. A poorer load changes the numbers and not the sequence.'
  assumes:
  - warming ice-bearing soil releases water as vapour at low pressure
  - a leaner load carries the same salts in less water
  takeaway: A poorer load changes the yield of a process and not the order of it.
  format: SEQUENCE
  task: Order the operations for a lean load.
  cards:
  - Weigh the load and sample it, so the water it should give is known in advance.
  - Seal and warm the hopper, holding it below the temperature the perchlorate salts decompose at.
  - Condense the vapour on the chilled plate and measure what was actually collected.
  - Pass the collected brine through the lead polishing column at the usual rate.
  order: [0, 1, 2, 3]
  why: >-
    Sampling comes first on a lean load because without an expected water yield, poor ground and a plant fault look the same.
    Warming then has both a floor and a ceiling. The floor is enough heat to free the water. The ceiling is the temperature
    at which oxychlorine salts — the perchlorates — come apart and make new chlorine-bearing contamination. The vapour is
    condensed and measured against the predicted yield. Then the liquid is polished at the qualified flow before it is sent
    downstream.

- group: EQUIL
  title: Why the hotter pass gave less — Review
  task: Read a table of constants against temperature
  place: Reactor Hall
  scene: >
    Herrera has the equilibrium constant for the methane assembly at four temperatures: 500 K, 550 K, 600 K and 650 K. It
    falls by more than a factor of 10 across that range.
  guide: >-
    A table of the equilibrium constant against temperature, and it falls. Start with what the constant is a property of,
    because two of these options assume it is a property of something else. Then read the direction. A constant that falls
    as the bed gets hotter is telling you which side the heat is on. That is a fact about the reaction, not about the equipment.
  background:
  - >-
    What K is a property of, and what it is not. The equilibrium constant belongs to the reaction, and it answers to temperature
    and to nothing else. Not to pressure. Not to the catalyst. Not to how much of anything you put in. Two of the options
    on this board get that wrong, and both are tempting, because both name something that really does affect the plant.
  - >-
    How to read the sign of the heat off a table. If K falls as the temperature rises, the reaction is giving heat out. Heat
    behaves as one of its products, so supplying more pushes the balance back. If K rose instead, the reaction would be taking
    heat in. That is exothermic and endothermic read straight off a column of numbers, with no apparatus involved.
  - >-
    Why this table is the plant's whole design problem, written in advance. Yield wants a cold bed. Rate wants a hot one.
    A factor of ten in K across 150 degrees says how expensive that argument is. The operating temperature is picked where
    a good enough catalyst makes a good enough yield reachable in the time available. The table is what tells you where to
    look.
  assumes:
  - the equilibrium constant depends on temperature and on nothing else
  - this reaction gives out heat
  takeaway: A table of constants against temperature is the plant's ceiling written out in advance.
  format: CHOICE
  question: What does a constant falling steeply with temperature tell the plant?
  choices:
  - The reaction gives out heat, and yield per pass is best at the lowest workable temperature.
  - The reaction takes in heat, so the ceiling on each pass improves as the bed is pushed hotter.
  - The catalyst is losing activity across that range, which is what the fall records.
  - Pressure has been changing with temperature, and the table mixes two effects.
  answer: The reaction gives out heat, and yield per pass is best at the lowest workable temperature.
  why: >-
    The direction the constant moves in tells you the sign of the heat. Falling with temperature means heat behaves as one
    of the products, so supplying more of it pushes the balance back. That is an exothermic reaction read straight off a table.
    And the consequence is this plant's whole design problem. Yield wants a cold bed. Rate wants a hot one. So the operating
    temperature is chosen where a good enough catalyst makes a good enough yield reachable in the time available.
  rebuttals:
  - A constant that rose with temperature would mean heat was taken in, and this one falls.
  - The constant is a property of the reaction and takes no account of what the catalyst is doing.
  - The constant is defined at a stated temperature and does not depend on the pressure at all.

- group: PHASE
  title: Reading a blockage from outside the pipe — Review
  concept: "Phase changes, and that every substance has its own temperature for one"
  place: Cold End
  scene: >-
    A pipe on the oxygen side has slowed down over two sols. Cho has five gauges from around it. The plant has to
    decide whether to warm the pipe out or take it apart.
  guide: |-
    Same job as the methane line, on a different pipe.

    Three of these five gauges are doing the ruling out. Start with those, not with the alarm.

    And look again at how the flow died. Something that closes in one minute is a different story from something that closes over two sols. A valve slams. A solid grows.

    Then one extra question, because Cho has to pick an action: what is the blockage made of? Warming a pipe clear of carbon dioxide is a small job. Warming it clear of water ice is a much bigger one.
  background:
  - >-
    Why a normal gauge is a result. The alarm usually fits several guesses at once, so it settles nothing. The quiet
    gauges are what rule things out. A cold head sitting at its set point says the cooling is still there. A steady
    jacket pressure says the insulation is still good.
  - >-
    Why the shape of the flow is evidence. Somebody closing a valve happens fast and then stops. A solid growing on
    the inside wall takes the flow down slowly, over hours or over sols. The shape tells you what kind of thing you
    are looking at, before you know what it is made of.
  - >-
    Why what it is made of decides the repair. At this pipe's pressure, carbon dioxide can be turned back into gas by
    a gentle, controlled warm-up. Water ice needs a great deal more heat than that. So the plant works out the numbers
    for its own pipe, instead of treating 195 K and 273 K as switches that work everywhere.
  assumes:
  - each substance gives up at a temperature that depends on this pipe's own pressure
  - a flow that fades over two sols is not one valve being moved once
  takeaway: The same gauges can mean two different repairs, depending on what the blockage is made of.
  format: DIAGNOSIS
  headline: An oxygen pipe has slowed over two sols, and the cooling machine is holding its temperature.
  task: Which guess fits every gauge?
  readings:
  - {zone: Oxygen line, label: Flow, value: down 60% over 2 sols, status: alarm}
  - {zone: Oxygen line, label: Inlet pressure, value: rising, status: high}
  - {zone: Refrigerator, label: Cold head temperature, value: at set point, status: normal}
  - {zone: Upstream trap, label: Carbon dioxide breakthrough, value: 700 ppm, status: alarm, note: '700 ppm — 700 parts in every million'}
  - {zone: Line, label: Vacuum jacket pressure, value: unchanged, status: normal, note: the insulation is intact}
  choices:
  - {label: Carbon dioxide past the trap is freezing inside the pipe, mechanism: 'A solid grows slowly on the wall and
      takes the flow down with it.'}
  - {label: The cooling machine has got weaker over the last two sols, mechanism: 'A cold head above its set point
      cannot turn what it is given into liquid.'}
  - {label: Somebody has partly closed a valve on this pipe, mechanism: 'A narrowing cuts the flow and raises the
      pressure behind it.'}
  - {label: The vacuum jacket on this pipe has failed, mechanism: 'Heat leaking in warms the pipe and changes what it
      can carry.'}
  answer: Carbon dioxide past the trap is freezing inside the pipe
  why: >-
    Two things decide this. The shape first: a flow that fades over two sols is something building up inside the pipe,
    not one valve being moved. Then the quiet gauges. The cold head is at its set point, so the cooling is fine. The
    jacket has not moved, so the insulation is fine. That leaves a solid growing on the wall. The trap is letting
    carbon dioxide through at 700 parts in every million, which names it. And that matters: carbon dioxide comes back
    off with a gentle warm-up. Water ice would not.

# ---------------------------------------------------------------- the rooms
# What is inside each of the six buildings, and what the instrument on the wall
# is reading when the player walks in.
interiors:
  KINET:
    caption: The bed is the only part of this plant that does something nothing else can do.
    standLine: 9 sols of temperature profiles, and a hot spot 30 centimetres further down the bed.
    station:
      kind: panel
      title: Reactor bed profile
      rows:
      - {label: Hot spot position, value: 34 cm, status: alarm}
      - {label: Peak temperature, value: 604 K, status: normal}
      - {label: Pressure drop, value: 0.6 bar, status: normal}
      - {label: Conversion this pass, value: 58 %, status: low}
  EQUIL:
    caption: There is an amount of methane this mixture will settle at, and urgency does not move it.
    standLine: Carbon in against carbon out, for one pass and for the loop.
    station:
      kind: panel
      title: Reactor loop
      rows:
      - {label: Loop pressure, value: 12.0 bar, status: normal}
      - {label: Bed inlet temperature, value: 593 K, status: high}
      - {label: Methane in dry product, value: 96.4 %, status: normal}
      - {label: Carbon monoxide, value: 0.9 %, status: alarm}
  PHASE:
    caption: Everything in the stream stops being a gas somewhere, and not at the same temperature.
    standLine: The cold line, the drier and the trap, in the order the stream meets them.
    station:
      kind: panel
      title: Cold end
      rows:
      - {label: Cold head, value: 114 K, status: normal}
      - {label: Drier outlet water, value: 900 ppm, status: alarm}
      - {label: Methane tank pressure, value: 3.4 bar, status: high}
      - {label: Oxygen boil-off, value: 12.5 kg/sol, status: low}
  ELEC:
    caption: Charge and moles are one measurement in two units, and the gap between them is the cell.
    standLine: 12 cells, 640 amps, and 8% of it making nothing.
    station:
      kind: panel
      title: Water stack
      rows:
      - {label: Stack current, value: 640 A, status: normal}
      - {label: Cell voltage, value: 1.75 V, status: high}
      - {label: Hydrogen collected, value: 6.9 kg/sol, status: normal}
      - {label: Current efficiency, value: 92 %, status: low}
  GIBBS:
    caption: Some of what this station does runs on its own. The rest is paid for out of one array.
    standLine: The sol's ledger, with what the array delivered on the other side of it.
    station:
      kind: panel
      title: Station ledger
      rows:
      - {label: Array delivered, value: 1950 kWh, status: normal}
      - {label: Electrolysis, value: 380 kWh, status: normal}
      - {label: Liquefaction, value: 610 kWh, status: high}
      - {label: Habitat, value: 240 kWh, status: normal}
  SOIL:
    caption: What comes out of this ground is a solution, and everything dissolved in it has an address downstream.
    standLine: 1100 litres in the tank, and a column nobody has changed since sol 190.
    station:
      kind: panel
      title: Water plant
      rows:
      - {label: Holding tank, value: 1100 L, status: normal}
      - {label: Load water content, value: 4.5 %, status: low}
      - {label: Outlet conductivity, value: 6× the spring figure, status: alarm}
      - {label: Column in service since, value: sol 190, status: high}

# What each place says when the player reads its sign.
# --------------------------------------------------------------- the warm-ups
warmups:
  greet:
    title: Six people, and the next crew is eighteen months away
    why: Meet the six-person crew now, because during a crisis you must know who understands each part of the plant.
  trial-near:
    title: Walk the plant while your suit is fresh
    why: Walk the full plant route on a clear sol so you can find every module fast when a dust storm hides the track.
  trial-far:
    title: The rover, and the three hundred metres to the ice cut
    why: Drive to the ice cut while the sky is clear so you know the route when the plant needs water during a storm.
  follow:
    title: Cho walks the cold end once
    why: Follow Cho, the cryogenics engineer, through the cold end now so you learn which pipes and joints can freeze or
      leak before a fault hits.
  hunt:
    title: Six regolith bins, and the tally says four
    item: {name: regolith bin, plural: regolith bins}
    # AT THE OPENED PLACES, not at the six area doors.
    #
    # `HUNT` falls back to one item per area, which sweeps ground the player
    # already walks four times a sol and teaches them nothing about the site. The
    # five buildings that stood closed until the placement pass, plus the pad, are
    # the half of Arcadia Rise nothing ever sent anybody to. This run is the reason
    # to go, and it lands on sol 6 — two sols after the rovers sign out, which is
    # what makes a bin at the pad a decision rather than a march.
    # Two bins moved off the tank farm and the array shed on purpose: both of those
    # now carry a sited call of their own, on sols 7 and 12, and a place opened by
    # a crate on sol 6 cannot then be opened by its question later. Spreading WHEN
    # each building is first needed is the point — see engine/core/access.js.
    at:
    - {x: -58, z: 34}         # Habitat
    - {x: 48, z: 36}          # Vehicle Bay
    - {x: 25, z: -4}          # Catalyst Bay
    - {x: -27, z: -28}        # Reactor Hall
    - {x: -31, z: 4}          # Water Plant
    - {x: -6, z: 22}          # Plant Control
    why: Find the two missing soil bins because the launch fuel plan counts water from all six.
  canvass:
    title: Who has actually seen the seal on module four
    why: Ask who saw the module-four seal because the log may blame a leak that no one has checked.
  evade:
    title: Earth wants a call and the window is closing
    why: Get the tank survey into the downlink before a private call uses the only slot.
  tag:
    title: Catch Achebe before the array goes into storm mode
    why: Reach Achebe, the power and electrolysis engineer, before storm mode hides the array reading needed for every
      power choice this week.

copy:
  KINET: <p>Catalyst Bay. Nickel on alumina, in a bed the size of a kitchen bin, doing the one job in this plant that 
    nothing else can do.</p>
  EQUIL: <p>The reactor hall. Carbon dioxide and hydrogen go in, methane and water come out, and the argument is about 
    how much.</p>
  PHASE: <p>The cold end. Where a gas nobody can store becomes a liquid the vehicle can fly, at 112 kelvin.</p>
  ELEC: <p>The electrolysis hall. Water stacks make hydrogen and oxygen; one hot solid-oxide stack splits carbon dioxide
    into oxygen and carbon monoxide.</p>
  GIBBS: <p>Plant control. The energy ledger for everything on this plain, and the desk where the arguments about it 
    end.</p>
  SOIL: <p>The water plant. Frozen ground in at one end, and a brine that has to be cleaned before anything downstream 
    can use it.</p>
  HAB: <p>The habitat. 6 people, 19 degrees, and the only room on the planet with a window somebody chose the view 
    from.</p>
  PAD: <p>The pad. The ascent vehicle stands on it, 4.3 tonnes of methane aboard and 6.6 needed.</p>
  ARRAY: <p>The array shed. 1800 square metres of panel out there, and a sun sensor that says how much of the sun is 
    reaching it.</p>
  TANKS: <p>The tank farm. Everything the plant has made so far, held at its own boiling point and losing a little every
    sol.</p>
  GARAGE: <p>The garage. Two pressurised rovers, one drill rig, and the dust that comes back in with all of them.</p>
  INTAKE: <p>The intake. 6 millibars of carbon dioxide compressed to 12 bar, which is most of the plant's power bill 
    before any chemistry happens.</p>

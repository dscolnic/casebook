- title: The compound nobody asked for
  objective: Turn current into kilograms, and find out what is actually in the product.
  briefing: A full product assay finds a compound the routine panel never looked for, while the water column shows the 
    first signs of exhaustion.
  stake: >-
    On sol 298 a full assay has found a carbon compound the usual report never lists. The water-cleaning bed may soon
    let harmful ions through. Today you check what the cells should make, then pick the test that would show it.
  takeaway: A measurement nobody asks for is a measurement that arrives later at full size.
  stops:
  - group: ELEC
    task: Turn a sol of current into kilograms of hydrogen
    title: From amps to kilograms
    at: store-scales
    reason: >-
      The stacks report amps and the tank fills in kilograms, and nobody has turned one into the other
    place: Electrolysis Hall
    scene: |-
      1 cell in the water stack carried 640 amps for the whole sol. Achebe wants the hydrogen that represents, worked out from the charge rather than from what the collection line reported.
    guide: >-
      Achebe wants the hydrogen worked out from the charge, not from what the collection line reported. That is Faraday's
      law, and it is bookkeeping. Current times time gives charge, in coulombs. Divide by the charge one mole of product needs
      and you have moles. Multiply by the molar mass and you have grams. Five numbers are on the board, and one is the cell
      voltage, which belongs to the energy bill rather than to the amount. And note what this answer assumes: every electron
      doing the job it was sent to do. The real figure will be lower.
    takesAsRead:
    - "Stoichiometry as a feed rate: turning a production target into kilograms in"
    background:
    - >-
      What Faraday's law actually says. Charge is counted in coulombs, and one mole of electrons carries 96,485 of them. That
      number is the Faraday constant. Making one molecule of hydrogen takes two electrons, so one mole of hydrogen takes two
      moles of them: 192,970 coulombs. Charge and moles are the same measurement in different units.
    - >-
      Why voltage has nothing to do with the amount. Current is how many electrons cross each second. Voltage is how hard
      each one is pushed. The amount of product depends only on how many crossed. So only the current and the time enter this
      sum. Voltage decides the energy bill, which is a different question.
    - >-
      Why this is a maximum and not a prediction. The sum assumes every electron did the intended reaction. Some never do.
      They drive a side reaction, or make hydrogen that recombines before it is collected. So the real mass is always lower.
      Comparing this number with what the separator actually caught is how a cell's current efficiency gets measured.
    assumes:
    - 1 mole of electrons carries 96,485 coulombs
    - splitting water to hydrogen takes two electrons per molecule
    takeaway: Charge and moles are one measurement in two units, once the electrons per molecule are known.
    format: BALLPARK
    question: Estimate the hydrogen one cell should produce over a sol.
    why: Faraday’s law is charge bookkeeping. Current times time gives the total charge. Divide by the charge one mole 
      of product needs and you have moles. Multiply by the molar mass and you have grams. Voltage does not enter it. 
      Voltage sets the energy cost, not the amount. And the answer is a ceiling rather than a forecast. It assumes every
      electron did the intended reaction, and some never do. Comparing this figure with the hydrogen actually collected 
      is how a real cell's current efficiency gets measured.
    estimate:
      prompt: The cell carried 640 amps for 88,800 seconds. Making 1 mole of hydrogen takes 2 moles of electrons, which 
        is 192,970 coulombs.
      question: Estimate the hydrogen one cell should produce over a sol.
      labels:
      - 640 A  (current through the cell)
      - 88800 s  (seconds in a sol)
      - 192970 C/mol  (charge needed for 1 mole of hydrogen)
      - 2.016 g/mol  (molar mass of hydrogen)
      - 1.75 V  (cell voltage)
      values: [640, 88800, 192970, 2.016, 1.75]
      slots: 4
      template: "{0} × {1} ÷ {2} × {3}"
      formula: a*b/c*d
      correct: [0, 1, 2, 3]
      target: 594
      tolerance: 40
      units: g per sol
      solution: 640 A × 88,800 s ÷ 192,970 C/mol × 2.016 g/mol ≈ 594 g.
      explanation: Current times time is charge, charge divided by the charge per mole is moles, and moles times the 
        molar mass is grams. The voltage decides the energy bill rather than the amount.
      relationship: Mass = current × time ÷ the charge needed for one mole of product × the molar mass of that product.

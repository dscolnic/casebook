    guide: >-
      Abiola's four cards will all happen. The only question is what each one needs from the step above it, so ask that
      of each. Ice that melts loose in the bucket runs straight into the ground. Vapour let go outside a sealed vessel
      joins an atmosphere at six millibars and is gone. And an ion-exchange bed can only be fed liquid. That is the
      column that swaps unwanted ions out of the water and onto a resin. Put them out of order and each step finds
      nothing to work on.
    background:
    - >-
      Why the water leaves as vapour and not as liquid. At six millibars water has almost no liquid range at all. Six
      millibars is under a hundredth of the pressure at sea level on Earth. Warm ice-bearing ground in the open and the
      ice goes straight to vapour and disperses. That is why the hopper is sealed before it is warmed. The warming then
      has nowhere to send the vapour except onto the chilled plate.
    - >-
      Why the column comes last and not first. The polishing column swaps unwanted ions — chloride, here — out of the water
      and onto a resin. What it has is a fixed capacity, not a percentage. Feed it the whole soil load instead of the water
      that load gave up, and it fills in a sol. It sits at the outlet of the holding tank because that is where the volume
      is smallest and already cleanest.
    - >-
      Why the order is graded whole. A sequence is a claim about what depends on what: each step is here because the one before
      it has already happened. One swapped pair breaks that claim wherever it sits, so partial credit would be credit for
      a plant that does not run.
    takesAsRead:
    - Intermolecular forces, and why they set a boiling point
    assumes:
    - warming ice-bearing soil releases water as vapour at low pressure
    - dissolved salts stay behind when water evaporates
    takeaway: Every step in the water plant fixes something the step after it cannot survive.
    format: SEQUENCE
    why: The order is set by what each step needs from the one above it. Ice that melts in the bucket runs into the 
      ground and is lost, so the load stays frozen until it is inside something sealed. Vapour has to be caught where it
      is released, or it joins an atmosphere at six millibars and is gone. Condensing gives liquid water, and only 
      liquid water can be run through an ion-exchange bed. Take the steps out of order and each one finds nothing to 
      work on.
    cards:
    - Cut ice-bearing ground and keep the load below its melting point on the way in.
    - Warm a sealed hopper so the water leaves the soil as vapour with nowhere else to go.
    - Condense that vapour on a chilled plate and drain it into a holding tank.
    - Strip chloride out on the polishing column at the outlet of the holding tank.

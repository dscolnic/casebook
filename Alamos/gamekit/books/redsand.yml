    task: Work out how much salt the brine is carrying
    title: The brine the ideal model cannot finish
    at: brinetank
    reason: >-
      The tank sat below freezing overnight and still drained as a liquid, which says what is dissolved in it
    place: Water Plant
    scene: |-
      The holding tank sat at minus 40 overnight. It drained as a liquid this morning. Abiola has the analysis. It is magnesium perchlorate, and a great deal of it. He wants the freezing point that concentration implies.
    guide: >-
      This tank drained as a liquid at minus 40. That tells you something about how much salt is in it. The rule is freezing-point
      depression. ΔTf = i × Kf × m. Molality m is moles of salt per kilogram of water. Kf is a constant belonging to water
      itself. And i is the particle count. It is how many separate ions one formula unit breaks into. That count is what matters
      here. Not how heavy the salt is. Two of the five numbers belong to other questions.
    background:
    - >-
      Why dissolved particles lower a freezing point at all. Ice can only form one way. Water molecules line up into a crystal.
      Dissolved particles get in the way of that. They do not stop it. They make it happen at a lower temperature than it
      otherwise would. This is called a colligative property. It depends on how many particles are dissolved. Not on what
      they are.
    - >-
      Why the particle count is the whole trick. Magnesium perchlorate is Mg(ClO₄)₂. Put it in water and it does not stay
      whole. It breaks into one magnesium ion and two perchlorate ions. That is three separate particles from one formula
      unit. Something that dissolves in one piece gives one particle. So this salt depresses the freezing point three times
      as much. That factor of three is i, the van 't Hoff factor.
    - >-
      Why 45 K is a magnitude. Not a measurement. The rule assumes dissolved particles ignore each other. At 8 moles per kilogram
      they cannot. The tank is packed, and real ions attract and crowd. So treat 45 K as showing why this brine is still liquid
      at minus 40. It is not its true freezing point.
    assumes:
    - a dissolved salt separates into ions in water
    - the freezing point of pure water is 273 K
    takeaway: At extreme concentration, the ideal colligative calculation gives a scale; the tank's measured phase 
      behavior is the evidence the plant operates on.

        place: Catalyst Bay
        scene: >
          Nine sols of profiles are pinned along the wall in order. On the first, the hot
          spot sits 4 centimetres into the bed. On the last it sits at 34. The peak
          temperature is about the same on every one.
        guide: >-
          Nine sols of profiles are on the wall and something is moving. But look at what is
          not moving. The peak temperature is the same on every one. The pressure drop across
          the bed has not changed. Neither has the feed. Those three are your evidence, not
          the hot spot. Take each candidate and ask how many of the five readings it fits.
          And ask one more thing: which end of a bed meets the strongest feed?
        background:
          - >-
              Why a hot spot marks where the work is happening. The reaction gives off its
              heat exactly where it occurs. Dead catalyst does no reacting, so it gives off no
              heat — gas passes through it unchanged and unwarmed. The hot spot therefore sits
              at the first place the gas meets catalyst that still works. Move that boundary
              and the hot spot moves with it.
          - >-
              Why a bed dies from the inlet end. Whatever is poisoning this catalyst arrives
              dissolved in the feed. The front of the bed meets that feed first and at full
              strength, so it takes the damage first. As the front dies, the poison travels
              deeper before it is absorbed, and the dead zone grows downstream. A poisoned bed
              is eaten from the inlet, always in that direction.
          - >-
              Why the quiet readings decide this one. The alarming reading draws the eye and
              usually fits several explanations at once. The readings that separate them are
              the ones an explanation says should have moved and which have not. Unchanged
              pressure drop rules out packing and fouling. Unchanged feed rules out a leaner
              feed. An unchanged peak says the catalyst that still works is undamaged.
        assumes:
          - a reaction gives out its heat where it is happening
          - a bed can lose activity in one part and keep it in another
        takeaway: Where a bed is hot is where it is still working.
        format: DIAGNOSIS
        headline: The hot spot has walked 30 centimetres down the bed in 9 sols, at an unchanged peak temperature.
        task: Which explanation fits every reading?
        readings:
          - { zone: Bed profile, label: Hot spot position, value: 4 cm to 34 cm in 9 sols, status: alarm }
          - { zone: Bed profile, label: Peak temperature, value: unchanged, status: normal }
          - { zone: Reactor, label: Pressure drop across the bed, value: unchanged, status: normal, note: rules out packing and fouling }
          - { zone: Feed, label: Composition and flow, value: unchanged, status: normal }
          - { zone: Product, label: Conversion, value: down 2% a sol, status: alarm }
        choices:
          - { label: The front of the bed has stopped working, mechanism: 'Dead catalyst passes gas unchanged, so the heat appears wherever live catalyst begins.' }
          - { label: The gas is finding a channel through the packing, mechanism: 'A channel lets feed past without contacting the catalyst at all.' }
          - { label: The feed has changed and the bed is responding to it, mechanism: 'A leaner feed reacts further into the bed before it gives out heat.' }
          - { label: The thermocouples have drifted along their sheath since the last service, mechanism: 'A sensor problem can move a profile with nothing happening in the bed.' }
        answer: The front of the bed has stopped working
        why: >-
          The unchanged peak temperature is what decides it. Wherever the reaction is happening, it
          is going as hard as ever. So the catalyst that still works has not been weakened. What has
          changed is how much of the bed is doing any work at all. Unchanged pressure drop rules out
          packing and fouling. Unchanged feed rules out a leaner feed reacting later. That leaves a
          dead front. A bed dies from the inlet end, because that is where the feed arrives at full
          strength, and conversion falls as the working length shrinks.

  # ---------------------------------------------------------------- sol 298
  - title: The assay bench
    objective: Turn current into kilograms, and find out what is actually in the product.
    briefing: Stern has run a full assay on the product stream for the first time since the spring.
    stake: >-
      Sol 298. Dana Stern, the analytical chemist, has run the first full product assay since
      the spring. The plant has been living on a two-line check instead. Four numbers came off
      the assay. One of them is a compound nobody had been asking about. So it has been in the
      stream for as long as nobody asked. Achebe wants her stack's output stated in kilograms,
      not in amps, for the same reason. Today you turn a sol of current into a mass of hydrogen.
      You also read the assay line by line, and look at how the polishing column behaves as it
      fills. Anaya Bhatt, the ascent vehicle systems engineer, has asked for all three. She will
      not countersign another batch into her tanks until she has them.
    takeaway: A measurement nobody asks for is a measurement that arrives later at full size.
    stops:
      - group: ELEC
        task: Turn a sol of current into kilograms of hydrogen
        title: From amps to kilograms
        place: Electrolysis Hall
        scene: |-
          1 cell in the water stack carried 640 amps for the whole sol. Achebe wants the hydrogen that represents, worked out from the charge rather than from what the collection line reported.
        guide: >-
          Achebe wants the hydrogen worked out from the charge, not from what the collection
          line reported. That is Faraday's law, and it is bookkeeping. Current times time
          gives charge, in coulombs. Divide by the charge one mole of product needs and you
          have moles. Multiply by the molar mass and you have grams. Five numbers are on the
          board, and one is the cell voltage, which belongs to the energy bill rather than to
          the amount. And note what this answer assumes: every electron doing the job it was
          sent to do. The real figure will be lower.
        takesAsRead:
          - "Stoichiometry as a feed rate: turning a production target into kilograms in"
        background:
          - >-
              What Faraday's law actually says. Charge is counted in coulombs, and one mole of
              electrons carries 96,485 of them. That number is the Faraday constant. Making
              one molecule of hydrogen takes two electrons, so one mole of hydrogen takes two
              moles of them: 192,970 coulombs. Charge and moles are the same measurement in
              different units.
          - >-
              Why voltage has nothing to do with the amount. Current is how many electrons
              cross each second. Voltage is how hard each one is pushed. The amount of product
              depends only on how many crossed. So only the current and the time enter this
              sum. Voltage decides the energy bill, which is a different question.
          - >-
              Why this is a maximum and not a prediction. The sum assumes every electron did
              the intended reaction. Some never do. They drive a side reaction, or make
              hydrogen that recombines before it is collected. So the real mass is always
              lower. Comparing this number with what the separator actually caught is how a
              cell's current efficiency gets measured.
        assumes:
          - 1 mole of electrons carries 96,485 coulombs
          - splitting water to hydrogen takes two electrons per molecule
        takeaway: Charge and moles are one measurement in two units, once the electrons per molecule are known.
        format: BALLPARK
        question: Estimate the hydrogen one cell should produce over a sol.
        why: Faraday’s law is charge bookkeeping. Current times time gives the total charge. Divide by the charge one mole of product needs and you have moles. Multiply by the molar mass and you have grams. Voltage does not enter it. Voltage sets the energy cost, not the amount. And the answer is a ceiling rather than a forecast. It assumes every electron did the intended reaction, and some never do. Comparing this figure with the hydrogen actually collected is how a real cell's current efficiency gets measured.
        estimate:
          prompt: The cell carried 640 amps for 88,800 seconds. Making 1 mole of hydrogen takes 2 moles of electrons, which is 192,970 coulombs.
          question: Estimate the hydrogen one cell should produce over a sol.
          labels:
            - 640 A  (current through the cell)
            - 88800 s  (seconds in a sol)
            - 192970 C/mol  (charge needed for 1 mole of hydrogen)
            - 2.016 g/mol  (molar mass of hydrogen)
            - 1.75 V  (cell voltage)
          values: [640, 88800, 192970, 2.016, 1.75]
          slots: 4
          template: "{0} × {1} ÷ {2} × {3}"
          formula: a*b/c*d
          correct: [0, 1, 2, 3]
          target: 594
          tolerance: 40
          units: g per sol
          solution: 640 A × 88,800 s ÷ 192,970 C/mol × 2.016 g/mol ≈ 594 g.
          explanation: Current times time is charge, charge divided by the charge per mole is moles, and moles times the molar mass is grams. The voltage decides the energy bill rather than the amount.
          relationship: Mass = current × time ÷ the charge needed for one mole of product × the molar mass of that product.
      - group: EQUIL
        task: Match each assay line to what it says about the loop.
        title: Four lines off the assay bench
        place: Reactor Hall
        scene: Stern's assay of the product stream has four lines on it. Herrera wants each one matched to what it implies about the loop before anybody argues about a set point again.
        guide: >-
          Stern's assay has four lines, and Herrera wants each one placed before anybody
          argues about a set point again. Take them one at a time. Ask which part of the
          plant each line is reporting on. The bed? The recycle loop? The drier? And ask
          which line tells you least, because on an assay the biggest number usually does.
        background:
          - >-
              Why the biggest number tells you least. A stream that is 96.4 per cent methane
              is a stream doing its job. Every plant's headline figure looks like that when
              nothing is badly wrong. The arguments live in the few per cent left over,
              because that is where anything unexpected has to be. Read the small lines
              first.
          - >-
              Why carbon monoxide is a reaction and not a contamination. Nothing out here
              delivers carbon monoxide into a sealed loop. It has to be made, and the only
              thing in the loop that can make it is the bed. So its presence says a second
              reaction is running on the same catalyst, competing for the same carbon. That
              is a selectivity problem, not a cleanliness one.
          - >-
              Why one line can mean two things. 400 parts per million of water is nothing at
              the reactor, which is making water as a product anyway. Two hundred metres
              downstream the pipe passes 273 K. There, the same 400 ppm is ice on an
              exchanger wall. An assay line only means something once you ask where the
              stream goes next.
        takesAsRead:
          - "Stoichiometry as a feed rate: turning a production target into kilograms in"
        assumes:
          - the loop returns unreacted gas to the reactor inlet
          - the product stream is dried before it is cooled
        takeaway: An assay is a statement about the process, not only about the bottle it came from.
        format: PROTOCOL
        why: Every line in an assay belongs to a part of the plant. The methane figure is the headline and tells you least. It only says the plant is doing its main job. Carbon monoxide did not blow in from anywhere. It is evidence of a second reaction on the same bed, taking carbon the methane wanted. Unreacted hydrogen is expected in a loop that recycles, and would be alarming in one that did not. Water past the drier is a maintenance item here. Two hundred metres downstream, at 273 K in the exchanger, it is an emergency.
        scenarios:
          - Methane at 96.4% of the dry stream.
          - Carbon monoxide at 0.9%.
          - Hydrogen at 2.1%.
          - Water at 400 parts per million after the drier.
        choices:
          - The plant is doing its main job, and the arguments all live in the few per cent left over.
          - A second reaction is running on the same catalyst and taking feed away from the first.
          - Unreacted feed is going round again, which is the recycle working as it was designed to.
          - The desiccant is passing some through, and the cold end is where that arrives.
        mapping: [0, 1, 2, 3]
      - group: SOIL
        task: Say what a full polishing column does
        title: The bed that warns only at the outlet
        place: Water Plant
        scene: |-
          The polishing column is a packed bed of ion-exchange resin with a fixed number of sites in it. Abiola has been asked how the plant would know the column was full, and he says the honest answer is that it would not.
        guide: >-
          Abiola's honest answer is worth sitting with: the plant would not know. The column
          is a packed bed with a fixed number of exchange sites in it. Water goes in one end
          and out the other. Picture what happens to those sites as sol after sol of
          water passes through. Which ones fill first? Then ask of each option whether it
          fits a bed that fills that way.
        background:
          - >-
              What ion exchange is doing. The resin is covered in sites, and each site holds a
              harmless ion. It will swap that ion for one you want gone — chloride, here. Each
              site does this once. There is no regenerating it in service and no partial
              credit. A site is either free or taken.
          - >-
              Why the bed fills from the inlet and not evenly. The first water through meets
              the first centimetre of resin and gives up its chloride there. Only when those
              sites are taken does the next water travel further to find a free one. So the
              used region grows from the inlet downstream, as a front, with clean resin still
              waiting beyond it.
          - >-
              Why capacity is not a percentage, and why that is the trap. A filter that
              removes 95 per cent removes 95 per cent all its life. A capacity bed removes
              nearly everything, and then removes nearly nothing. There is no gradual warning
              between those two states. That is why Abiola wants an alarm on the outlet rather
              than a maintenance date on a calendar.
        takesAsRead:
          - Rate constants, and how steeply they climb with temperature
          - "Stoichiometry as a feed rate: turning a production target into kilograms in"
        assumes:
          - an ion-exchange bed swaps unwanted ions for harmless ones
          - a packed bed holds a finite number of ions
        takeaway: A bed with a capacity has two states, and there is no announcement between them.
        format: CHOICE
        question: What happens at the outlet as the exchange front reaches the end of the bed?
        answerText: The outlet stays low until the loading front approaches it, then rises toward the inlet concentration. That breakthrough curve is the warning the plant must monitor.
        why: An ion-exchange bed holds a fixed number of sites, and they fill from the inlet end. So a loading front creeps down the resin, with fresh sites ahead of it and full ones behind. While there is fresh resin left, the outlet stays clean. Then the front reaches the end and the outlet climbs fast toward the inlet concentration. That climb is called breakthrough. It is not instant, and its exact shape depends on flow, but it is a cliff rather than a slope. So the only warning is at the outlet — and only if somebody reads it often enough to act.
        choices:
          - It rises toward the inlet concentration as the exchange front reaches the outlet.
          - It rises steadily from the day fresh resin is installed because every captured ion weakens the whole bed equally.
          - It becomes cleaner just before exhaustion because a heavily loaded resin binds incoming ions more strongly.
          - It remains at a fixed fraction of the inlet concentration throughout the bed’s life.
        answer: It rises toward the inlet concentration as the exchange front reaches the outlet.
        rebuttals:
          - Most of the bed can load while the outlet stays low; the rise comes when the loading front approaches the outlet.
          - A loaded site has less capacity for the next ion, not more.
          - A capacity-limited bed does not remove one fixed percentage for its whole life.
  # ---------------------------------------------------------------- sol 299
  - title: What the spent charge was carrying
    objective: Find out what has been taking the bed apart, and for how long.
    briefing: The spent catalyst charge came back from the assay bench this morning.
    stake: >-
      Sol 299. The spent charge Kaur pulled on sol 288 came back from Stern's bench an hour ago.
      It had sat in a sealed can for 11 sols. Nobody thought a dead catalyst would say anything
      a temperature profile had not. The result is one line long. It changes what the last
      fortnight was about. Abiola's outlet conductivity trace has been printed every sol since
      the plant started. Nobody has had a reason to read it. Today you work out what killed the
      bed and when it started. You also settle what the loop's poor conversion has really been
      telling everybody. Sundqvist and Herrera have argued about a set point for 8 sols. Eleven
      sols of production are gone while they did.
    takeaway: Two people can argue correctly for a fortnight about the wrong variable.
    stops:
      - group: KINET
        task: Which explanation fits every finding?
        title: One line off the spent charge
        place: Catalyst Bay
        scene: "The spent charge was assayed in three sections: the first 20 millimetres, the middle, and the outlet end. Kaur has the five findings on the board and is no longer sure of her own explanation."
        guide: >-
          Kaur has stopped trusting her own explanation, which is the right moment to look at
          the material rather than the plant. Each of the four candidates would leave its own
          mark on the catalyst itself. Heat damage shows up in the size of the metal
          particles. Coking shows up as carbon on the surface. A bad batch shows up
          everywhere at once. So take each one and ask what the assay ought to show if it
          were true. Then read the five findings.
        background:
          - >-
              How a catalyst dies of heat, and what it leaves behind. The nickel works as
              tiny particles, because small particles give a great deal of surface for their
              mass. Run them hot enough for long enough and neighbouring particles merge into
              bigger ones. That is sintering, and it destroys surface without destroying any
              nickel. It is permanent, and it is visible: the particles are measurably
              larger.
          - >-
              How a catalyst dies of poisoning, and why the inlet goes first. A poison
              arrives dissolved in the feed and sticks to the first free site it meets. The
              front of the bed sees the feed first and at full strength, so it takes the
              damage first. Behind that, the feed is already stripped. So poisoning eats a
              bed from the inlet downstream and leaves the outlet end lively.
              Chlorine on the surface is the fingerprint.
          - >-
              Why two causes with one symptom are settled in the material. Sintering and
              poisoning both look identical from the control room. Conversion falls; the hot
              spot moves. Neither reading tells them apart. The catalyst itself does. Particle
              size answers the first question, surface chlorine answers the second, and a
              sealed can sat on a shelf for eleven sols holding both answers.
        assumes:
          - a catalyst can lose activity by heat or by a substance binding to it
          - heat makes small metal particles merge into larger ones
        takeaway: Two causes with one symptom are told apart in the material rather than in the plant readings.
        format: CHOICE
        why: "One material observation settles it. The nickel particles are the same size as fresh material, so nothing has sintered. Only traces of carbon, so nothing has coked over. A bad batch would be weak along its whole length, and the outlet end is still working. What is left is 1.9 per cent chlorine on the inlet surface and none at the outlet. That is a poison arriving with the feed and landing on the first sites it meets. It also explains the walking hot spot: as the front loses its usable surface, the reaction starts further in."
        headline: The spent charge is dead at the inlet end and lively at the outlet, and the reason is in the material.
        readings:
          - zone: Inlet 20 mm
            label: Chlorine on the surface
            value: 1.9% by mass
            status: alarm
          - zone: Inlet 20 mm
            label: Nickel particle size
            value: unchanged from fresh
            status: normal
            note: rules out heat damage
          - zone: Inlet 20 mm
            label: Carbon deposit
            value: trace
            status: normal
          - zone: Outlet end
            label: Chlorine on the surface
            value: not detected
            status: normal
          - zone: Feed water
            label: Outlet conductivity
            value: up sixfold since sol 261
            status: alarm
        choices:
          - label: Something in the feed is binding to the nickel
            mechanism: A poison arrives with the feed, so it lands on the first catalyst it meets.
          - label: The bed has been run too hot and the metal has coarsened
            mechanism: Heat merges small metal particles into larger ones with less surface.
          - label: Carbon is laying down on the surface and covering it
            mechanism: Coke builds up on a catalyst working with carbon-bearing gas.
          - label: The charge was already faulty when it was loaded into the reactor
            mechanism: A bad batch never had the activity the plant assumed it had.
        answer: Something in the feed is binding to the nickel
      - group: SOIL
        task: Date the change in the water
        title: The trace nobody read
        place: Water Plant
        scene: |-
          The conductivity of the water leaving the polishing column is logged every sol. The trace runs flat for 260 sols, steps up over about 4, and runs flat and high from there to this morning.
        guide: >-
          One trace, printed every sol, and nobody had a reason to read it until now. The
          shape is the evidence, so read the shape. Flat for 260 sols. Then four sols of
          rising. Then flat and high ever since. For each option, ask two things. What would
          the inlet record have to show if that were true? And would it give you a rise over
          four sols, or something else?
        background:
          - >-
              What conductivity is measuring. Pure water barely conducts electricity at all.
              Dissolved ions carry charge, so the more ions in the water, the better it
              conducts. That makes a conductivity meter a cheap, continuous count of how
              salty the water is. It cannot say which ion. It can say how many, every sol,
              for years.
          - >-
              What a breakthrough curve looks like, and why four sols is the tell. A fresh
              exchange bed keeps the outlet clean while it has free sites left. As the loading
              front reaches the outlet, the reading climbs toward the inlet value and then
              stays there. Low, rise, high. The rise takes as long as the front takes to clear
              the last of the resin — sols, not hours.
          - >-
              Why the shape rules the other three out. A saltier feed would show in the inlet
              record too, and the inlet is flat across the whole period. A sensor reset happens
              in one sol, not four. A leak around a seal would have raised the trace from the
              day it was fitted, sloping, with no flat run before it. Only one candidate makes
              a flat line, a four-sol ramp, and a plateau.
        takesAsRead:
          - "Stoichiometry as a feed rate: turning a production target into kilograms in"
        assumes:
          - conductivity rises with the ions dissolved in water
          - an exchange bed holds a fixed number of ions
        takeaway: A step in a record is a date, and a date turns a fault into a history.
        format: CHOICE
        question: What does the shape of that trace say?
        why: The shape of the record carries the history. A fresh exchange bed keeps the outlet clean while it still has free sites. As the loading front reaches the outlet, the reading climbs toward the inlet value and then stays there. Low, then rising, then high — that is the breakthrough signature. A saltier feed would show at the inlet too, and the inlet is flat. A sensor reset moves a trace within one sol, and this took four. So the trace dates breakthrough to about sol 261, and says the plant has been feeding the reactor unpolished water ever since.
        choices:
          - The column filled around sol 261 and has passed the feed straight through since.
          - The feed water got saltier at sol 261 and has stayed that way since.
          - The conductivity sensor was reset against a standard at sol 261 and reads high now.
          - The column has been leaking around its seal at a steady rate since it was fitted.
        answer: The column filled around sol 261 and has passed the feed straight through since.
        rebuttals:
          - The inlet trace is flat across the whole period, so the water arriving at the column has not changed.
          - Resetting a sensor moves a trace within a single sol, and this step took four of them.
          - A steady leak gives a raised, sloping trace from the beginning rather than a flat run and a step.
      - group: EQUIL
        task: Hold temperature and pressure fixed, change one operating variable, reverse it, and determine whether the reactor is rate-limited.
        title: Change the time, not the ceiling
        place: Reactor Hall
        scene: Herrera and Sundqvist have argued for a fortnight about whether the hot reactor is at equilibrium or simply short of reaction time. Stern gives them one controlled run before the production schedule resumes.
        guide: >-
          The number you are watching is conversion — how much of the gas that went in came
          out as product. Two explanations are on the table. Either the gas leaves before the
          reaction has finished, or it has hit a ceiling the equilibrium sets. Three settings
          can be changed and only one of them tells those apart. Think about which. A
          response only counts if it beats the assay's own scatter. So change one setting,
          run it, put it back, and name the one conversion follows.
        background:
          - >-
              What the argument is actually about. A reaction that has not finished and a
              reaction that has hit its limit both give a low conversion. On one measurement
              they read exactly the same. The difference is what they answer to. More time
              helps the first and does nothing at all for the second. So the test has to be a
              change in time.
          - >-
              What each of the three settings does. Gas flow sets how long the gas spends over
              the bed. It changes the time available and leaves the ceiling where it is.
              Temperature and pressure both move the ceiling itself. That is why only one of
              the three can separate the two explanations — the other two change both things
              at once and settle nothing.
          - >-
              Why putting the setting back matters. Plants drift. A bed ages, a heater wanders,
              a feed composition shifts, and conversion moves a little while you work. So a
              rise after your change might not be your change. Restore the setting and watch
              conversion come back to where it was. That is how you tell your own effect from
              the plant's own drift.
        takesAsRead:
          - Rate constants, and how steeply they climb with temperature
          - "Stoichiometry as a feed rate: turning a production target into kilograms in"
        assumes:
          - equilibrium is a ceiling that depends on temperature and pressure
          - conversion also depends on how long the gas spends in the bed
        takeaway: Changing residence time at fixed temperature and pressure changes kinetic approach to equilibrium without moving the equilibrium ceiling.
        format: CONTROL
        question: Which controlled change separates a kinetic limit from an equilibrium limit, and does conversion follow it on reversal?
        control:
          hint: Change one setting from the baseline, run the assay, then restore it. A useful test changes residence time without moving the equilibrium constant.
          noise: 0.7
          baseline: 64
          observable:
            label: Reading
            unit: "% conversion"
          response: 5
          truth: flow
          variables:
            - id: flow
              label: Gas flow
            - id: temperature
              label: Bed temperature
            - id: pressure
              label: Loop pressure
        answerText: Flow is the separating variable. Halving it at fixed temperature and pressure raises conversion from 64% to 69%, and restoring the flow returns it to 64%, showing a rate-limited shortfall.
        why: At fixed temperature and pressure, the ceiling does not care how fast gas crosses the bed. The rate does. So halving the flow doubles the contact time and leaves the ceiling exactly where it was. In this run conversion rose from 64 to 69 per cent, well past the assay's own scatter. It came back to 64 when the flow was restored. That means the gas had been leaving before the mixture reached its ceiling. The shortfall was time, not thermodynamics. Temperature or pressure could not have answered it, because each moves the ceiling and the rate together.
  # ---------------------------------------------------------------- sol 300
  - title: A new charge and a rule for the water
    objective: Get a bed back into service and decide what stops this happening again.
    briefing: There is one spare catalyst charge on the station and no second one coming.
    stake: >-
      Sol 300. The last spare catalyst charge came out of stores this morning. There is no
      second one on this planet. Whatever is done with it is done once. Kaur wants it qualified
      properly before it carries production. Sundqvist wants it making methane by the afternoon.
      This time Wells has come down on Kaur's side. Achebe has parts enough for one improvement
      to the water and power loop, and a list of four. Today you set the order the charge is
      brought into service. You also decide what the spare parts are spent on, and whether the
      methane tank's rising pressure is a leak or a temperature. Everything the plant does for
      the next 180 sols runs through a bed commissioned this afternoon.
    takeaway: A part with no replacement is commissioned by procedure rather than by enthusiasm.
    stops:
      - group: KINET
        task: Order the four operations for bringing the charge into service.
        title: Bringing a charge into service
        concept: What a catalyst does, and the two things it cannot do
        place: Catalyst Bay
        scene: |-
          The fresh charge arrives as nickel oxide on alumina, which is not a catalyst yet. Kaur has four operations written out and wants them in an order she can hand to a technician at three in the morning.
        guide: >-
          What arrives in the can is nickel oxide. Nickel oxide is not a catalyst. All four
          operations will happen, so the question is what each one makes possible, or safe.
          Two things to hold on to. Hydrogen and oxygen together at 350 °C is not something
          you want inside a reactor. And nobody hands full production feed to a charge whose
          activity is still unknown.
        background:
          - >-
              Why the charge has to be reduced before it works. Nickel does the work here, and
              what ships in the can is nickel oxide. That is nickel with oxygen attached. Pass
              hot hydrogen over it and the oxygen leaves as water, and nickel metal is left
              behind. This is reduction, the same word as ever: something gained electrons.
              Until it happens there is no catalyst in the reactor. Only its ingredients.
          - >-
              Why the purge is not a formality. The reduction step needs hot hydrogen. If
              oxygen is still in the vessel when that hydrogen arrives, the two react with
              each other instead, and they do it fast. Nitrogen is used to push the oxygen out
              first because nitrogen reacts with nothing here. It is a step whose only purpose
              is to make the next step safe.
          - >-
              Why the low-flow check comes before the comparison. There is one spare charge on
              the planet. A tenth of production flow is enough to show whether the bed lights
              off at all. If it does not, almost nothing has been risked. Only once the bed is
              known to be active is the sol-270 comparison worth running. That run leaves the
              next crew a number.
        assumes:
          - nickel oxide has to be reduced to nickel metal before it is active
          - hydrogen at temperature will reduce a metal oxide
        takeaway: A part that cannot be replaced is proved at low rate before it is trusted at full rate.
        format: SEQUENCE
        why: Each operation makes the next one possible, or safer. The nitrogen purge removes oxygen before hot hydrogen goes in, because those two react with each other given the chance. Reduction then turns nickel oxide into nickel metal. Until that is done there is no catalyst in the reactor. A light-off check at a tenth of flow shows whether the charge is active, at almost no risk. Only then is a matched comparison against the sol-270 run worth running. It leaves the next crew a number instead of an impression.
        cards:
          - Purge the reactor with nitrogen until no oxygen remains in it.
          - Pass dilute hydrogen at 350 °C to reduce the nickel oxide to nickel metal.
          - Run a light-off check at a tenth of production flow to confirm activity.
          - Match conditions to the sol-270 run and compare conversion against that charge.
        order: [0, 1, 2, 3]
      - group: ELEC
        task: Fund the change that would most alter what the plant does next.
        title: One improvement, four candidates
        place: Electrolysis Hall
        scene: The station has parts and crew time for one improvement. One catalyst charge is already lost, and there is no spare after the new one. Achebe puts four candidates on the board before anyone starts cutting pipe.
        guide: >-
          Here is what the last fortnight established, and it is worth having straight
          before you spend anything. The plant ran 38 sols on water no column was polishing.
          It lost a catalyst charge to that water. Conductivity was logged on every one of
          those sols, and read by nobody. The array has not been the limit on a single sol
          this season. There are already four probes in the bed. A second column in series
          would let the lead bed be swapped at breakthrough, and it needs pipe and a
          shutdown. And one catalyst charge is left, with no spare behind it.
        rules: >-
          Spread the hundred points across the 4 proposals. At least 80 of them have to
          be committed, because a panel that funds almost nothing has not decided
          anything. Your largest single allocation must be 35 or more, and it has to
          land on what the evidence supports most. Keep the total sitting on proposals
          the evidence does not support under fifteen. And a proposal it does support
          should not be left under twenty.
        background:
          - >-
              Why the whole spread is graded. Funding is not a vote for one idea. A portfolio
              says three things at once: what you think is likely, what is worth hedging
              against, and what is not worth doing at all. Most of the information is in the
              last two. Backing the right proposal while quietly funding a bad one is a worse
              answer than it looks. The small numbers count as much as the big one.
          - >-
              What the three numbers are for. Thirty-five is what makes a lead a lead. Below
              it you have hedged rather than chosen. Fifteen is the most that can sit on
              unsupported work before it stops being a rounding error. Past that it is a
              second opinion nobody argued for. Twenty is the floor under work you have
              already called strong, because funding it too thin to finish spends the money
              and buys nothing.
          - >-
              Why there is a floor on the total. Points held back are not caution. They are a
              decision not to decide, taken with somebody else's money and somebody else's
              deadline. The floor is what forces the panel to say something.
        takesAsRead:
          - "Stoichiometry as a feed rate: turning a production target into kilograms in"
        assumes:
          - the polishing column gives no warning as it fills
          - the plant has no spare catalyst charge after this one
        takeaway: The work worth doing first is the work that would have caught the fault nobody caught.
        format: SCIENCETANK
        answerText: Fit the conductivity monitor and alarm on reactor feed water. It turns the measurement that already existed into an action before unpolished water reaches the catalyst.
        why: The plant did not lack a measurement. Conductivity was recorded every single sol. What it lacked was a rule that turned the measurement into an action. An alarm on the feed water would have made breakthrough visible while the catalyst could still be saved. A second column adds capacity, and it still needs something to tell you when to switch over. Extra array power addresses nothing that failed, and the bed already has four probes. The change worth funding first is the one that closes the gap between a signal you already have and a loss you cannot undo.
        proposals:
          - label: A
            text: Plumb a second polishing column behind the first, so the lead bed can be changed at breakthrough.
          - label: B
            text: Fit a conductivity monitor with an alarm on the reactor feed water.
          - label: C
            text: Add a fourth panel string to the array to raise the power available.
          - label: D
            text: Install a second temperature probe in the catalyst bed.
        recommended:
          A: 45
          B: 35
      - group: PHASE
        task: Decide whether a rising pressure is a leak
        title: The tank pressure that is not a leak
        place: Cold End
        scene: |-
          The methane tank has climbed about 0.3 bar a sol for 4 sols. The mass in the tank is unchanged across the same four sols, and Moreau is being asked whether to vent it.
        guide: >-
          Moreau is being asked to vent propellant, so it is worth being sure first. Two
          numbers matter and they disagree with each other. Pressure is climbing. Mass is
          not moving. Start from what would have to be true for each option, and check it
          against the mass. Then keep one fact in reserve: a tank holding liquid with vapour
          above it sits at the vapour pressure of whatever temperature it happens to be.
        background:
          - >-
              What vapour pressure is. Put a liquid in a sealed tank and some of it leaves as
              gas. That gas builds up until as many molecules are returning to the liquid as
              are leaving it. The pressure it settles at is the vapour pressure, and it
              depends on one thing only: the temperature. Warm the tank and more molecules
              have the energy to leave, so the pressure settles higher.
          - >-
              Why that makes a pressure gauge a thermometer. As long as there is liquid and
              vapour together in the tank, the pressure is pinned to the temperature. It is
              not a free variable. So a pressure reading climbing steadily for four sols is a
              temperature reading climbing steadily for four sols, told in different units.
          - >-
              Why the mass is the reading that decides it. Gas leaving a tank — through a
              leak, or a vent — takes mass with it. There is no way around that. So a flat
              mass across four sols rules out anything that works by losing contents. So what is
              left has to raise the pressure while keeping every molecule inside the tank.
              Warming is the only candidate on the list that does.
        assumes:
          - a liquid in a closed tank sits under the pressure of its own vapour
          - vapour pressure rises steeply with temperature
        takeaway: Pressure in a cryogenic tank is a reading of temperature until the mass says otherwise.
        format: CHOICE
        question: The pressure is rising and the mass is not falling. What is happening?
        why: A tank holding liquid with vapour above it sits at the vapour pressure of its own temperature. So while both are present, the pressure gauge is a thermometer. Here the mass has not moved for four sols. A leak or a sustained vent takes mass out, so the inventory rules both out. That leaves warming, and the pressure is simply following the temperature up. The right response is to go and find the heat — insulation, a valve conducting warmth in, a refrigerator falling behind. Venting propellant because a gauge rose spends the tank to treat a symptom.
        choices:
          - The contents are warming, and the vapour pressure is following the temperature up.
          - Gas is escaping through a leak even though the measured tank mass is unchanged.
          - The liquid is boiling away fast enough to raise pressure without changing the tank inventory.
          - The gauge must have drifted because pressure cannot change at constant mass.
        answer: The contents are warming, and the vapour pressure is following the temperature up.
        rebuttals:
          - A leak large enough to explain the pressure trend should also appear as a mass loss; the inventory is flat.
          - Sustained boil-off or venting changes the liquid inventory unless the vapour is retained, and the pressure rise still requires warming.
          - Constant mass does not imply constant pressure when temperature changes.
  # ---------------------------------------------------------------- sol 301
  - title: The sol everything agreed
    objective: Close the plant's own books while there is nothing to firefight.
    briefing: The new charge ran to specification for a full sol and nobody quite believes it.
    stake: >-
      Sol 301. For the first time since the spring the plant has run a full 24 hours with nobody
      called out. The new charge is holding conversion at 71%. The polishing column is fresh.
      The sol's production came in at 14.1 kilograms against a target of 13.8. Wells has asked
      for the quiet sol to be spent on arithmetic, not on improvements. That is not a popular
      instruction. Today you close the energy ledger against what the array really delivered.
      You also settle how full a cryogenic tank may be filled, and follow the carbon through a
      full pass of the loop. Herrera's view is simple. A plant nobody understands on a good sol
      is a plant nobody can fix on a bad one.
    takeaway: The sol to check the books is the sol when nothing is going wrong.
    stops:
      - group: GIBBS
        task: Put a number on what the hydrogen costs
        title: The bill for a kilogram of hydrogen
        place: Plant Control
        scene: Demir is closing the sol’s energy ledger. The stacks made 6.9 kg of hydrogen. He wants their electrical energy use written beside the array output before he signs the sheet.
        guide: >-
          Demir wants what the stacks spent, not what the hydrogen holds. Those are two
          different numbers and both are on the board. A kilogram of hydrogen stores about
          39.4 kWh. This stack spends about 55 kWh to make one. The gap is real, and it is
          the overpotential you met in the hall — voltage above the minimum, leaving as heat.
          So ask of each tile which of the two questions it answers.
        background:
          - >-
              Why a kilogram of hydrogen has two energy numbers. One is what it stores: burn
              it, or run it through a fuel cell, and about 39.4 kWh comes back out. The other
              is what it cost to make: about 55 kWh through this stack. Both are correct. They
              answer different questions, and a ledger wants the second.
          - >-
              Where the missing 15 kWh went. A cell only has to supply 1.23 volts in
              principle. This one runs at 1.75. Everything above the minimum is overpotential,
              and it leaves the stack as heat rather than going into the product. So the
              hydrogen is the same hydrogen, and the plant paid about 40 per cent more than
              the thermodynamics asked for.
          - >-
              Why using the wrong figure matters here. Put 39.4 into the sum and the sol's
              bill reads 272 kWh. The true figure is 380. That is a quarter of the entry
              missing from an energy ledger, on a station whose array is the only source of
              power. A cheerful number in the wrong column is worse than no number.
        assumes:
          - electrical energy can be counted in kilowatt-hours
          - a stack costs more energy per kilogram than the hydrogen itself carries
        takeaway: What a product costs to make and what it stores are two different numbers, and the gap is the price of running at a rate.
        format: BALLPARK
        question: Estimate the electrical energy the stacks spent making hydrogen this sol.
        why: A kilogram of hydrogen has two energy numbers, and they are not the same. One is what it stores: about 39.4 kWh. The other is what this stack spent to make it: about 55 kWh. The second is larger because real cells run above the minimum voltage, and the excess leaves as heat. So 6.9 kg cost about 380 kWh. Using the stored figure would have given 272, and understated the sol's electricity by a quarter. On a station with one array, that is not a rounding error.
        estimate:
          prompt: The stacks made 6.9 kg of hydrogen. At the voltage they run, this stack spends about 55 kWh for each kilogram it makes.
          question: Estimate the electrical energy the stacks spent making hydrogen this sol.
          labels:
            - 6.9 kg  (hydrogen made this sol)
            - 55 kWh/kg  (energy this stack spends per kilogram)
            - 39.4 kWh/kg  (energy stored in a kilogram of hydrogen)
            - 1.75 V  (cell voltage)
            - 88800 s  (seconds in a sol)
          values: [6.9, 55, 39.4, 1.75, 88800]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 379.5
          tolerance: 25
          units: kWh
          solution: 6.9 kg × 55 kWh/kg ≈ 380 kWh.
          explanation: The energy a stack spends is not the energy the hydrogen holds. Using the stored figure instead gives 272 kWh and understates the bill by a quarter.
          relationship: Energy spent = the mass of hydrogen made × the energy this stack spends to make one kilogram of it.
      - group: PHASE
        task: Say how full a cryogenic tank may be filled
        title: The space left at the top
        place: Cold End
        scene: |-
          Bhatt's loading procedure stops the methane tank at 95% by volume. Moreau has been asked why the remaining 5% is not simply more propellant, with the window as close as it is.
        guide: >-
          The window is close and 5 per cent of a tank is a lot of propellant, so Moreau's
          answer had better be a good one. Think about what happens to that tank between
          filling and launch. Nobody draws from it. Heat still reaches it. So ask of each
          option whether it is really about the liquid, or about the gas above the liquid.
          That gas space has a name, by the way. It is called the ullage.
        background:
          - >-
              Why a cryogenic tank always has gas in it. The liquid is sitting at its boiling
              point. Insulation slows heat down and never stops it. So some liquid is always
              turning to vapour, and that vapour has to occupy space. This is not a fault to
              be engineered away. It is the condition the tank permanently lives in.
          - >-
              What happens to a tank filled to the brim. Vapour still forms, and now there is
              nowhere for it to go. Gas that cannot expand raises the pressure instead, and it
              does so fast. The relief valve opens and starts throwing propellant overboard to
              protect the tank. A small heat leak has become a loss of fuel, and the vehicle
              has not burned a gram.
          - >-
              Why 5 per cent rather than 1 or 20. The ullage has to swallow every kilogram
              that boils off between filling and launch, without the pressure reaching the
              relief setting. Estimate the boil-off rate. Multiply by the wait. Add margin for
              a bad sol. The answer comes out at a few per cent. It is a calculation, not a
              habit.
        assumes:
          - a liquid at its boiling point turns to vapour when heat reaches it
          - a closed vessel has a pressure it is rated to
        takeaway: A cryogenic tank is designed around what happens to it between filling and use.
        format: CHOICE
        question: Why is the flight tank filled to 95% rather than full?
        why: A cryogenic tank always holds some vapour, because heat keeps arriving however good the insulation is. The gas space above the liquid is the ullage, and its job is to give that new vapour room. Fill the tank to the brim and the room is gone. Vapour then raises the pressure instead, quickly, and the relief valve has to vent propellant to protect the tank. So a small heat leak becomes a fuel loss before the vehicle has burned a gram. The 5 per cent is what buys the wait between filling and launch.
        choices:
          - Vapour from boil-off needs somewhere to go, or the tank pressure climbs against its rating.
          - Liquid methane expands as it cools further in the tank and would split a full one.
          - A full tank cannot be measured, since the gauge floats on the liquid surface.
          - The pump cannot draw from a tank with no gas above the liquid to push it out.
        answer: Vapour from boil-off needs somewhere to go, or the tank pressure climbs against its rating.
        rebuttals:
          - Liquid methane in a tank sits at its boiling point and is not cooling further.
          - The gauge on this tank reads by pressure and temperature and does not need a surface to float on.
          - The pump is fed by pressure from the tank's own vapour, and 5% is not what makes that possible.
      - group: EQUIL
        task: Close the 100-mole carbon ledger for 1 pass, then decide which carbon is lost and which is recycled.
        title: Close the carbon pass
        place: Reactor Hall
        scene: "Herrera pins one pass of the carbon assay to the board: 100 moles of carbon dioxide entered. Methane and carbon monoxide are measured at the outlet, and the recycle meter records the unreacted return stream."
        guide: >-
          A hundred moles of carbon went into the bed, so a hundred moles have to come out
          of it somewhere. Methane and carbon monoxide are measured at the outlet. The
          recycle meter records what came back unreacted. Read every stream, then count only
          the carbon that belongs to this pass. And keep one distinction in mind as you go:
          carbon that comes back is not the same as carbon that is gone.
        background:
          - >-
              Why one pass is not the yield. A single pass converts part of the feed. The rest
              comes back and goes round again. So the overall yield after many passes can be
              far higher than the conversion on any one of them. That holds as long as nothing
              is lost on each circuit — which is what makes the recycle number worth checking.
          - >-
              What counting a stream actually claims. Reading a meter is free. Counting the
              number says this carbon belongs to the same hundred moles that went in. Methane
              and carbon monoxide are both products. Unreacted carbon dioxide is not a
              product, but it is still carbon, and it still has to appear somewhere in the
              ledger.
          - >-
              Why a gap would change the plan. Carbon that leaves the loop each pass is carbon
              the recycle can never recover. It might be laid down on the catalyst, vented, or
              dissolved in water. A small loss on every circuit compounds into a hard ceiling
              on overall yield. That ceiling is the number the ascent vehicle's schedule rests
              on.
        assumes:
          - the recycle loop returns unreacted gas to the inlet
          - every carbon atom entering the bed leaves it in something
        takeaway: Per-pass conversion counts what reacts now; overall conversion counts what is eventually recovered after unreacted feed is recycled.
        format: BALANCE
        question: Where are all 100 carbon moles after 1 pass, and what does that imply for overall methane yield after repeated recycle?
        balance:
          total:
            amount: 100
            unit: mol C
            label: Carbon entering one reactor pass
          streams:
            - id: methane
              label: Carbon leaving as methane
              value: 64
              display: 64 mol C
            - id: carbon_monoxide
              label: Carbon leaving as carbon monoxide
              value: 2
              display: 2 mol C
            - id: bed_inventory
              label: Change in carbon held in the bed
              value: 0
              display: No accumulation
            - id: recycle
              label: Unreacted carbon dioxide returned to the inlet
              value: 34
              display: 34 mol C
              hidden: true
          tolerance: 0.5
          hint: Close the one-pass carbon ledger first. Only after every carbon mole is accounted for should you decide which terms are losses from the plant and which return for another pass.
        answerText: The pass closes as 64 CH₄ + 2 CO + 34 recycled CO₂ = 100 carbon moles. Recycle makes the overall methane fraction approach about 64/(64+2) ≈ 97%, not 64%.
        why: "A one-pass conversion of 64% does not mean 36% of the feed is lost. The ledger closes as 64 moles of methane, 2 of carbon monoxide, and 34 of unreacted carbon dioxide going back to the inlet. That recycle term is inventory, not waste. It gets another chance next pass, and another after that. So if the selectivity holds, the split settles at the ratio of the two things that cannot come back: 64 to 2. That is about 97% methane and 3% carbon monoxide. Per-pass conversion is 64%. Overall conversion is nearly everything."
  # ---------------------------------------------------------------- sol 302
  - title: 40% of the sun
    objective: Decide what the station stops doing when the power halves.
    briefing: A regional dust storm arrived overnight and the array is delivering less than half.
    stake: >-
      Sol 302. A regional storm crossed the station overnight. The sky this morning is the
      colour of the ground. Iosif Petrov, the array technician, has the field delivering 430
      kilowatt-hours. A clear sol gives 2000. Nobody can say whether this lasts 2 sols or 20.
      Everything on this plain runs off that array. The stacks, the refrigerators, the drill,
      and the habitat that Demir keeps at 19 degrees. Today you decide in what order the loads
      are shed. You also work out how much light is reaching the panels, and what the water
      plant does while the drill is stopped. Wells will sign whatever order you set. She has
      said she will not revisit it before the storm clears.
    takeaway: A power cut on a plain with one array is a decision about what the station stops doing.
    stops:
      - group: ELEC
        task: Work out how much sunlight is reaching the panels
        title: What the dust leaves of the sun
        place: Electrolysis Hall
        scene: |-
          Petrov has the optical depth from the station's own sun sensor: 2.4, against 0.4 on a clear sol. Above the dust the beam would deliver 490 watts to each square metre of panel.
        guide: >-
          Optical depth is a measure of how much is in the way. Here is the part worth
          getting right. Dust does not subtract from a beam. It multiplies it down. Each
          unit of depth divides what is left by a further factor of about 2.7. So the
          formula has e in it rather than a minus sign. Five numbers are on the board and
          three belong to the array rather than to the beam. And be clear what you are
          working out: the direct beam, not the array's output.
        background:
          - >-
              Why attenuation multiplies rather than subtracts. Picture the dust as a stack of
              thin layers. Each layer stops the same fraction of whatever light reaches it —
              not the same amount. So the first layer takes a lot and the tenth takes a
              little, because there is less left for it to take. Repeated fractions of
              fractions is what an exponential is.
          - >-
              What optical depth means as a number. Depth 1 leaves about a third of the beam.
              Depth 2 leaves about a tenth. Depth 2.4 leaves about a twelfth. So going from a
              clear sol at 0.4 to a storm at 2.4 is not five times worse. It is roughly
              sevenfold, because the two extra units of depth each divide again.
          - >-
              Why the direct beam is not the array's output. What e^(−τ) describes is light
              that came straight through untouched. Dust also scatters light sideways, and
              some of that still lands on a panel from the sky. So the array does better than
              the direct beam alone suggests. It does not do anything like as well as a clear
              sol.
        takesAsRead:
          - "Stoichiometry as a feed rate: turning a production target into kilograms in"
        assumes:
          - each unit of optical depth cuts a beam by a further factor
          - a beam is attenuated as an exponential of the depth it passes through
        takeaway: Dust does not dim a beam in proportion; it multiplies it down, so each unit of depth costs more than the last.
        format: BALLPARK
        question: Estimate the direct beam reaching a panel through this dust.
        why: Dust attenuation multiplies; it does not subtract. Each further unit of optical depth removes the same fraction of whatever beam is left. So 490 × e^(−2.4) ≈ 44 watts a square metre, under a tenth of the above-dust value. That is why going from 0.4 to 2.4 is so much worse than it sounds — the two extra units each divide again. One limit on the answer. The array also picks up light the dust scattered sideways out of the sky, so its output is better than the direct beam alone. The exponential only describes light that came straight through.
        estimate:
          prompt: Above the dust the beam is 490 watts a square metre. The station's sun sensor reports an optical depth of 2.4.
          question: Estimate the direct beam reaching a panel through this dust.
          labels:
            - 490 W/m²  (beam above the dust)
            - 2.4  (optical depth today)
            - 0.4  (optical depth on a clear sol)
            - 0.22  (efficiency of the panels)
            - 1900 m²  (area of the array)
          values: [490, 2.4, 0.4, 0.22, 1900]
          slots: 2
          template: "{0} × e^(−{1})"
          formula: a*Math.exp(-b)
          correct: [0, 1]
          target: 44.5
          tolerance: 8
          units: W per square metre
          solution: 490 × e^(−2.4) ≈ 44 W per square metre of direct beam.
          explanation: The exponential is why a storm is so much worse than it looks. The panel efficiency and the array area turn this into kilowatts, and are a later step.
          relationship: "Transmitted beam = the beam above the dust × e raised to minus the optical depth: each unit of depth divides the beam by a further factor of about 2.7."
      - group: GIBBS
        task: Build a plan for the power there is
        title: What the station stops doing
        place: Plant Control
        scene: The dust storm has cut the sol from about 2,000 kilowatt-hours to 600. Tank refrigeration is already drawing power, and six other demands are queued. Demir and Wells want the sacrifices written down before breakers are opened.
        guide: >-
          Six hundred kilowatt-hours for the whole sol, against about two thousand on a clear
          one. Watch the answers list rather than the equipment. It shows what the station can
          still say at the end of the sol under your plan. The habitat is not a load and comes
          out first. After that, rank what is left by one question: if you stop this, can you
          get it back? Some of these you can. One of them you cannot.
        background:
          - >-
              Why reversibility is the ranking, not power drawn. Digging can wait — the ground
              will still be there. Batteries can recharge on the next clear sol. Electrolysis
              can be made up later if there is schedule margin left. None of those losses is
              permanent. Refrigeration is different in kind, and that is what puts it at the
              top rather than its 210 kWh.
          - >-
              Why stopping the refrigerator costs more power than it saves. Propellant already
              in the tanks took sols of array output to make. Stop cooling it and heat keeps
              arriving, so it boils away. The only way to get it back is to make it again,
              from the beginning, with power you do not have during a storm. Saving 210 kWh
              today to spend a thousand next week is not a saving.
          - >-
              Why writing the sacrifices down matters. Breakers opened without a record become
              an argument afterwards about what was agreed. Demir and Wells want the list
              because the storm will outlast everybody's memory of the reasoning. A plan that
              names what it gave up can be defended. A plan that only names what it kept
              cannot.
        assumes:
          - stopping a process can be reversible or costly to reverse
          - a cryogenic tank warms up when its refrigerator stops
        takeaway: Loads are ranked by what stopping them costs to undo, rather than by what they draw.
        format: ALLOCATE
        question: 600 kilowatt-hours. Build the sol's plan, and know what it stops the station being able to say.
        allocate:
          hint: Nothing on this list is a wrong thing to run. What the plan cannot do is the price of what it can.
          pool:
            # 560, not 430. Habitat is protected at 180 and the liquefier is required at
            # 210 and the drier is required at 40, so a 430 kWh sol committed 390 before the
            # player touched anything and left 40 — every substantial job unaffordable, four
            # of the five answers dark whatever was chosen, and a full score for committing
            # without deciding. At 600 the 170 left over funds exactly one substantial job:
            # the stacks at half rate (160, so the plant makes methane today), or the battery
            # reserve with the downlink (120 + 20), or the drill with the downlink (90 + 20).
            # Three plans, three different things the station can still say at the end of it.
            amount: 600
            unit: kWh
            mode: scalar
          items:
            - id: habitat
              label: Habitat heat and air
              cost: 180
              protected: true
              note: the crew is not a load
            - id: liquefier
              label: Liquefier and tank refrigeration
              cost: 210
            - id: stacks
              label: Electrolysis stacks at half rate
              cost: 160
            - id: batteries
              label: Recharge the battery reserve
              cost: 120
            - id: drill
              label: Drill and hopper heating
              cost: 90
            - id: drier
              label: Keep the product drier warm
              cost: 40
            - id: comms
              label: The downlink home
              cost: 20
          answers:
            - question: Does the propellant already made stay in the tanks?
              requires:
                - liquefier
              required: true
            - question: Does the plant make any methane this sol?
              requires:
                - stacks
            - question: Is there reserve in hand for the next storm?
              requires:
                - batteries
            # Required as well as the liquefier: sol 3's blockage was water past the drier
            # freezing in the exchanger, so letting it go cold is how this plant already
            # lost a line. With two required answers the grade turns on a decision rather
            # than on arithmetic the panel has already done.
            - question: Does the cold end stay clear of ice?
              requires:
                - drier
              required: true
            - question: Is any ice cut today?
              requires:
                - drill
          commit: Commit the sol's plan
        answerText: Keep the protected habitat bus and cryogenic refrigeration inside the 600 kWh limit. Then choose at most one substantial optional job. The jobs left unfunded are part of the answer.
        why: Rank the loads by what stopping them costs to undo, not by what they draw. Digging can wait; the ground stays where it is. Batteries recharge on the next clear sol. Electrolysis can be made up later if there is margin. Refrigeration cannot. Stop it and heat keeps entering the tanks, and propellant that took sols of array output boils away for good. Habitat power is protected separately, because the crew is not a load. So the scarce pool protects what cannot be remade, then buys whatever single job is left affordable.
      - group: SOIL
        task: Decide what the water plant does with no drill
        title: Running the plant with no digging
        concept: Per-pass conversion against overall conversion, and what a recycle loop buys
        place: Water Plant
        scene: The drill is off and the hopper is empty. The holding tank still contains 1,100 litres, while the reactor draws about 60 litres per sol. Abiola is asked whether the whole water plant must stop.
        guide: >-
          The drill has stopped and Abiola is being asked whether everything downstream
          stops with it. Do the arithmetic before you read the options. Eleven hundred litres
          in the tank, sixty litres a sol going to the reactor. How many sols is that? Then
          ask of each option whether it stores water or makes it, because those are not the
          same kind of help. And remember what the Sabatier reaction puts out besides
          methane.
        background:
          - >-
              What a buffer does for a plant. Steps in a chain run at their own rates and
              break at their own times. A tank between two of them lets the upstream one stop
              without the downstream one noticing. Eleven hundred litres at sixty a sol is
              about eighteen sols of cover, and no storm recorded at this site has lasted that
              long. The tank is not spare capacity. It is the reason a stopped drill is not a
              stopped plant.
          - >-
              Why the reaction gives some water back. CO₂ + 4H₂ → CH₄ + 2H₂O. Two moles of
              water come out for every mole of methane. The cold end condenses that water on
              its way down. Returned to the loop, it is water the drill did not have to
              cut. The plant is therefore not simply consuming water. It is recycling part of
              its own output.
          - >-
              Why the other two candidates cannot help. A polishing column holds ions on a
              resin, not litres in a vessel — there is no useful volume in it. And a condenser
              pulls water out of a stream that already has water in it. The atmosphere here is
              six millibars and nearly dry, so there is nothing out there to condense.
        assumes:
          - the reactor's water demand is met from a holding tank rather than from the drill directly
          - the Sabatier reaction makes water as well as methane
        takeaway: A buffer between two steps is what lets one of them stop without the other one noticing.
        format: CHOICE
        question: What lets the reactor keep running through a storm with the drill stopped?
        why: "Two buffers stand between the reactor and the drill. The first is stored water. 1,100 litres at 60 a sol is about 18 sols of cover, and that is longer than any storm recorded here. The second is the reaction itself: CO₂ + 4H₂ → CH₄ + 2H₂O makes two moles of water for every mole of methane. The cold end condenses part of that back into the loop. So digging can pause without the reactor stopping. Which is the wider lesson — a plant survives a broken machine on the inventories between its steps, not on the machines."
        choices:
          - The holding tank, plus the water the reaction itself gives back into the loop.
          - The condenser, which pulls water vapour out of the atmosphere at six millibars.
          - The polishing column, which stores clean water inside its resin bed.
          - Nothing does; the reactor has to stop with the drill and restart afterwards.
        answer: The holding tank, plus the water the reaction itself gives back into the loop.
        rebuttals:
          - The atmosphere here holds almost no water vapour, and the condenser works on the hopper stream instead.
          - An exchange bed holds ions rather than water, and it holds no useful volume.
          - Restarting a cold reactor costs a sol of production, which is exactly what the buffer exists to avoid.
  # ---------------------------------------------------------------- sol 303
  - title: Three things at once
    objective: Rank three faults that arrived together, and act on them in that order.
    briefing: The storm cleared and left three problems that were not there a week ago.
    stake: >-
      Sol 303. The storm blew itself out in the last hours of the night. It left three things
      behind. Moreau's oxygen tank is losing twice the boil-off it lost a fortnight ago. The new
      catalyst charge has never been checked against the sol-270 run. The storm took the power
      to do it. And the battery bank came down to 30% overnight. It has to be brought back up
      before the next dust event. Today you rank all three jobs against each other. You also
      work out what is wrong with the cold end, and what a fair test of the new charge looks
      like. Kaur, Moreau and Achebe each want theirs first. All three of them are being
      reasonable about it.
    takeaway: Three reasonable people wanting to be first is a ranking problem rather than an argument.
    stops:
      - group: PHASE
        task: Build the refrigerator heat path in order and identify the transfer that dust has made limiting.
        title: Follow the heat to the sky
        concept: "Boil-off: heat into a boiling liquid is a mass, not a temperature"
        place: Cold End
        scene: Oxygen boil-off has jumped from 12 to 26 kilograms a sol since the storm. Moreau opens the refrigeration schematic beside the tank. Jacket pressure is normal, while the compressor is already at its current limit.
        guide: >-
          Boil-off has doubled and nothing has broken, which means something in the heat path
          has changed. So follow the heat. It starts in the liquid oxygen and has to end up
          somewhere outside the station. Every step between is a handover from one thing to
          the next. Build that path in order first. Then ask which single step is now
          holding the whole chain up. Two readings are evidence about that, so use them.
        background:
          - >-
              Why boil-off is a heat measurement in disguise. Liquid oxygen sits at its
              boiling point, so every joule reaching it turns some into gas. Nothing warms up.
              Something evaporates instead. So 12 kilograms a sol becoming 26 says heat is
              arriving about twice as fast as it was. The tank has not changed. What reaches
              it has.
          - >-
              What a refrigerator actually does, and where the heat ends up. It does not
              destroy heat; nothing does. It picks heat up at a cold place and puts it down at
              a warm one. The compressor is what makes the refrigerant hot enough to give it
              up. But it still has to be given up to something. On a planet with no water and
              thin air, the only thing left is the sky. A radiator plate is how you talk to
              it.
          - >-
              Why a chain is only as good as one link. Heat has to make every handover to get
              out. Fail one and the whole path backs up, however well the others are working.
              So a compressor already at its limit is not the cause of the extra heat. It is
              the reason none of the extra can leave. And dust on a radiator breaks nothing.
              It only makes the last handover worse, which is enough.
        assumes:
          - a refrigerator has to reject its heat somewhere
          - dust settles on any surface left out in a storm
        takeaway: A refrigerator can lose capacity because heat cannot leave its warm end, even when the compressor and insulation are intact.
        format: CHAIN
        question: Trace the heat from the liquid oxygen to its final sink. Which required transfer is now governing the loss?
        chain:
          hint: Assemble only the required heat-transfer path from the tank to the environment. Then choose which link is contradicted by the normal readings and which is directly impaired by dust.
          links:
            - id: evaporator
              label: Tank liquid → cold heat exchanger
              transfers: heat from liquid oxygen into the refrigerant
            - id: compressor
              label: Compressor work on refrigerant
              transfers: raises refrigerant pressure and temperature so heat can be rejected
              reading: at current limit
            - id: condenser
              label: Hot refrigerant → radiator plate
              transfers: moves heat out of the refrigerant
            - id: radiator_sky
              label: Radiator plate → cold sky
              transfers: radiates the heat away from the station
              reading: dust-covered after the storm
            - id: vacuum_jacket
              label: Outside structure → tank through insulation
              transfers: parasitic heat leak into the tank
              reading: pressure normal
          distractor: compressor
          order:
            - evaporator
            - compressor
            - condenser
            - radiator_sky
          governing: radiator_sky
        answerText: The governing link is heat rejection from the dusty radiator to the sky. The compressor is working, and the jacket is intact, but the final heat-transfer step has lost capacity.
        why: A refrigerator does not destroy heat. It moves it. Heat leaves the tank into the refrigerant. The compressor raises the refrigerant hot enough to be rid of it. The condenser hands it to the radiator, and the radiator gives it to the sky. Every step is a handover, and the chain is only as good as its worst one. The vacuum jacket is a different path — heat leaking in — and its normal pressure rules that out here. Dust has weakened the last handover of all. So the cold end warms while the compressor runs flat out, and nothing has failed.
      - group: KINET
        task: Set the terms of a fair comparison
        title: Comparing two charges honestly
        place: Catalyst Bay
        scene: |-
          Kaur wants the new charge compared against the sol-270 run before it is trusted with the rest of the season. The plant is at a different temperature, flow and pressure than it was on sol 270.
        guide: >-
          Kaur wants to know about the charge, and only about the charge. But conversion
          answers to four things at once: temperature, pressure, flow, and the catalyst
          itself. Three of those are settings you choose. One is the thing being tested. So
          ask of each option whether it removes the other explanations, or quietly adds
          another one. A comparison is only about the variable you deliberately changed.
        background:
          - >-
              What a controlled comparison is for. Conversion has four inputs here, and you
              only want to learn about one of them. So hold the other three still. Then any
              difference you measure has nowhere else to have come from. This is what people
              mean by controlling a variable, and it is the entire reason the sol-270 settings
              are worth digging out of a log.
          - >-
              Why best-for-each is the tempting wrong answer. It sounds generous and it sounds
              rigorous. But suppose charge A runs at 580 K and charge B at 600 K. The two
              conversion figures now differ by the charge and by 20 degrees, with no way to
              separate them afterwards. Two numbers measured under different conditions
              cannot be subtracted. They are answers to two different questions.
          - >-
              Why more data does not repair an unmatched comparison. A whole sol of each
              charge gives you a much more precise measurement of the wrong quantity. Scatter
              shrinks; the confusion does not. That is worth remembering generally: precision
              and validity are separate properties, and only one of them improves by running
              longer.
        takesAsRead:
          - "Stoichiometry as a feed rate: turning a production target into kilograms in"
        assumes:
          - conversion depends on temperature, pressure, flow and the catalyst together
          - a comparison is only about the variable that was deliberately changed
        takeaway: A comparison is worth what its matched conditions are worth.
        format: CHOICE
        question: What has to be true for a comparison between two charges to mean anything?
        why: Conversion answers to four things at once. Temperature, pressure and flow are settings you choose. The catalyst is the thing being tested. Let the settings differ between two runs and the comparison mixes the charge in with the conditions, with no way to pull them apart afterwards. Match the settings to sol 270 and those other explanations are gone, so what is left can fairly be credited to the charge. Running each at its own best condition sounds fairer and is not. It produces two numbers that cannot be subtracted.
        choices:
          - Temperature, pressure and flow are set to the sol-270 values before conversion is read.
          - Both charges are run at whatever conditions produce their best conversion.
          - The comparison uses a whole sol of production from each charge.
          - Both are compared at the same time of sol, so the ambient conditions match.
        answer: Temperature, pressure and flow are set to the sol-270 values before conversion is read.
        rebuttals:
          - Best-for-each conditions produce two numbers that cannot be compared, since the settings differ along with the charge.
          - A whole sol of each is more data about an unmatched comparison, which does not repair it.
          - Ambient conditions outside barely reach a reactor held at 593 K, and the loop's own settings are what matter.
      - group: GIBBS
        task: Rank three faults against each other
        title: Which of the three cannot wait
        place: Plant Control
        scene: >
          The three problems are on the board with the power to fix one of them today. Wells wants
          the order and the grounds for it in the log before anybody starts work.
        guide: >-
          Three people want to be first and all three have a case, so the ranking has to come
          from something other than who is asking. Use the same test you used on the storm
          plan. For each job, ask what the delay actually costs. Some delays cost time, and
          time can be made up. One of them is spending something the station has already made,
          every sol it waits. That is not the same kind of cost.
        background:
          - >-
              The difference between a delay and a loss. Some jobs sit in a queue and cost
              nothing while they wait. The battery bank refills on the next clear sol. The
              comparison run is information, and information keeps. Other jobs are spending
              something every sol they are not done. Fourteen extra kilograms of oxygen a sol
              is propellant that took array output to make, and it is gone. Rank by that, not
              by urgency of tone.
          - >-
              Why boil-off is the one that cannot wait. The oxygen in that tank is stored work.
              Sols of power went into splitting the water and cooling the product. Let it boil
              and there is no recovering it. You have to start again from atmosphere and ice.
              Every other job on this board can be picked up on sol 305 for exactly what it
              would have cost on 303.
          - >-
              Why finishing something is not a reason to choose it. Picking the job that fits
              in a sol ranks by convenience. It feels like progress because something gets
              closed, and it says nothing about what the other two cost while they wait. A
              ranking has to be about consequences. Neatness is not one.
        assumes:
          - propellant vented from a tank cannot be recovered
          - a comparison run and a battery charge can both be done later
        takeaway: What cannot be undone goes first, whatever is loudest.
        format: CHOICE
        question: Which of the three is dealt with first?
        choices:
          - The radiator, since every sol of doubled boil-off is propellant that leaves for good.
          - The battery bank, since another storm without reserve would stop the whole station.
          - The charge comparison, since the season's production depends on knowing the bed is good.
          - Whichever can be finished today, since a finished job is worth more than a started one.
        answer: The radiator, since every sol of doubled boil-off is propellant that leaves for good.
        why: >-
          Rank by what the delay costs, and whether it can be got back. Boil-off is the loss of
          something already made. Fourteen extra kilograms a sol, and no later work returns them.
          Batteries recharge on the next clear sol at no permanent cost. A comparison run is
          information, and information waits for nothing so long as the bed is watched. Only one of
          the three is spending an asset while it sits in the queue. That is the one that goes
          first.
        rebuttals:
          - The battery bank refills on the next clear sol at no permanent cost, and one has been forecast.
          - The comparison matters and loses nothing by waiting two sols, since the bed is under watch.
          - Choosing by what fits in a sol ranks by convenience and ignores what each delay is costing.


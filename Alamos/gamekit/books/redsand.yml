      - group: KINET
        task: Say what the catalyst is and is not doing
        title: What a catalyst cannot do
        concept: What a catalyst does, and the two things it cannot do
        place: Catalyst Bay
        scene: >
          Kaur has two charges on the bench: the spent one from sol 288 and a fresh one still in its
          sealed can. Sundqvist's proposal assumes a better catalyst would raise the methane a pass
          can give.
        guide: >-
          Sundqvist's proposal rests on a claim about catalysts, and it is worth testing
          the claim before the proposal. A catalyst lowers the activation energy — the push
          a collision needs before it reacts. Hold on to one detail while you read the four
          options. It lowers that push in both directions at once. Forwards and backwards,
          by the same amount. Then ask of each option whether a catalyst could actually
          deliver it.
        background:
          - >-
              What a catalyst is actually doing. Molecules only react when a collision carries
              enough energy to get over a hump — the activation energy. A catalyst gives the
              reaction an easier route over that hump, usually by holding the molecules on a
              surface in a helpful arrangement. It is not consumed, and it does not appear in
              the balanced equation. It changes the road, not the destination.
          - >-
              Why it cannot move the balance point. The equilibrium constant K is set by the
              ratio of the forward speed to the backward speed. An easier route is easier in
              both directions at once, so both speeds rise and their ratio does not move. That
              ratio is K. This is the part people reliably get wrong, because it feels as
              though anything that helps a reaction should give you more of the product.
          - >-
              Why it cannot change the heat either. The heat a reaction gives out depends on
              two things only: what the molecules were at the start, and what they are at the
              end. It is the energy difference between them. The road taken in between does not
              enter into it. So a catalyst buys time and nothing else. In a plant with a fixed
              number of sols left, that is still worth a great deal.
        assumes:
          - a catalyst offers a reaction an easier path
          - equilibrium is where the forward and reverse rates match
        takeaway: A catalyst changes how long the balance takes to arrive and leaves the balance where it was.
        format: CHOICE
        question: A better catalyst is fitted at the same temperature and pressure. What changes?
        choices:
          - Equilibrium arrives sooner, and the methane the mixture settles at is the same.
          - More methane at equilibrium, since the easier path favours the forward direction.
          - Neither the speed nor the amount changes, since the bed is already at equilibrium.
          - Less heat is released per mole, since the reaction now takes an easier route to get there.
        answer: Equilibrium arrives sooner, and the methane the mixture settles at is the same.
        why: >-
          A catalyst lowers the activation energy, and it lowers it by the same amount in both
          directions. Forward and backward both speed up. So the ratio between them does not move,
          and that ratio is the equilibrium constant. Nor does a catalyst change how much heat comes
          out. That depends on what the molecules are at each end, not on the road taken between
          them. So a better catalyst buys time and no extra methane at all. In a plant with a fixed
          number of sols left, time is still worth a great deal.
        rebuttals:
          - An easier path is easier in both directions at once, which is why the ratio between them does not move.
          - The bed leaves short of equilibrium at this flow, which is exactly why the speed matters.
          - Enthalpy is fixed by the starting materials and the products, whatever route joins them.
      - group: PHASE
        task: Order the stages of the cold end, warmest to coldest.
        title: The order the cold end has to work in
        place: Cold End
        scene: |-
          Cho is rebuilding the cold end's written procedure after the blockage, and wants the four stages back in the order the stream meets them. 2 of the 4 exist because of what happened on sol 293.
        guide: >-
          All four stages exist in Cho's plant, so this is not about which ones to keep.
          It is about what each one takes out before the next one gets the stream. So ask
          of each: what would this stage's leftovers do to the colder stage after it?
          Three of the four are removals at a particular temperature. One is different in
          kind — compression raises the temperature at which everything else condenses,
          which is a favour done to every stage below it.
        background:
          - >-
              Why compressing the gas first helps everything after it. A substance condenses at
              a higher temperature when the pressure is higher. Squeeze a gas and it turns to
              liquid sooner on the way down. So compression at the top lets every stage below it
              work at a warmer temperature. And warmer refrigeration is cheaper refrigeration.
              That is the whole reason it goes first.
          - >-
              Why cleaning is cheapest at the warmest temperature that will do it. Every stage
              is there to take one substance out before it reaches metal cold enough to make it
              solid. Water comes out at 250 K over a desiccant. Carbon dioxide goes near 190 K
              in the trap. Only then does the clean remainder go down to 112 K, where methane
              runs as a liquid. Push a dirty stream colder than it needs to go and you pay
              twice — once in refrigeration, once in the blockage.
          - >-
              Why the order is graded whole. A sequence is a claim about what depends on what:
              each stage is here because the one before it has already happened. One swapped
              pair breaks that claim wherever it sits, so partial credit would be credit for a
              cold end that blocks.
        takesAsRead:
          - Vapour pressure, and reading a cryogenic tank by it
        assumes:
          - a substance condenses at a temperature that rises with pressure
          - carbon dioxide turns to solid near 195 K at these pressures
        takeaway: Cleaning a stream is cheapest at the warmest temperature that will do it.
        format: SEQUENCE
        why: The stream is cleaned on the way down, and each stage sits at the warmest temperature that will do its job. Compression comes first because raising the pressure raises the temperature at which everything below it condenses, which makes every later stage cheaper. Then water comes out over a desiccant at 250 K, before it can reach metal cold enough to freeze it. Then carbon dioxide is trapped near 190 K, where the solid forms somewhere it can be managed. Only the cleaned remainder goes to 112 K, where methane runs as a liquid. Driving a dirty stream colder than it needs to go wastes refrigeration and builds the blockage.
        cards:
          - Compress the dry product gas, so everything below condenses at a higher temperature.
          - Hold the stream at 250 K over a desiccant bed to take the water out as vapour.
          - Chill to 190 K across the trap, where carbon dioxide leaves as a solid.
          - Take the remainder to 112 K, where methane runs as a liquid into the tank.
        order: [0, 1, 2, 3]
        axis: Order the four stages by temperature, warmest first. The stream walks down the plant in that order, and the reason it does is the question — each stage removes what would otherwise foul the colder one after it.
        ends: [Warmest stage, Coldest stage]

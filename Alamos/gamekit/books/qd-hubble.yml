copy:
  PLATES: <p>The plate vault, first door on the west side. Years of glass in numbered drawers, a blink comparator on the bench, and the marked-up finding charts pinned above it.</p>
  SPEC: <p>The spectrograph room, across the corridor. The instrument bolted to a pier of its own, the plate holders in a rack beside it, and the laboratory comparison lamps on a shelf above.</p>
  LADDER: <p>The ladder desk, further down the east side. A log table, a slide rule, the calibration of the first rung pinned to the wall, and the error budget beside it in pencil.</p>
  DIAGRAM: <p>The diagram room at the far end of the west side. One large plot on the wall with the points added in ink as they arrive, and a straightedge on a pivot at the origin.</p>
  PORCH: <p>The entrance desk. A signing-in book, the night's seeing conditions chalked on a slate, and a clock kept on sidereal time.</p>
  TEA: <p>The common room halfway down the west side. A stove, six chairs, and the observing rota that everybody has already changed by hand.</p>
  DARK: <p>The darkroom, next to the spectrograph. Dishes, a red lamp, and a line for prints to dry on.</p>
  RACK: <p>The store at the end of the west side. Unexposed plates in sealed boxes, spare holders, and the crate the new grating came in.</p>
  LIB: <p>The library at the far end. Bound journals, the plate catalogue, and the one desk with a lamp that works.</p>

# --------------------------------------------------------------- the warm-ups
# Wellmere is rings on a headland: the vault and the lab are near, the trial plots
# and the crossing block are out past the glasshouses. The far lap is real.
warmups:
  trial-near:
    title: Walk the inner rings before the sowing plan is signed
    why: >-
      The station is laid out by isolation distance — vault at the middle, then the lab, then
      the glasshouses — and the plan you are about to sign puts material in specific rings.
      Qureshi, the collection curator, walks every new hand round the inner ones once, because a
      sowing plan drawn from a map ignores which way the wind crosses the headland.
  greet:
    title: Six leads and one season, and the crossing block is Thursday
    why: >-
      Everybody here has one season a year and all of them want the same glasshouse slots.
      Volpe, the head breeder, wants you known to as many of them as you can before the plan is
      argued over, because a negotiation about bench space between strangers takes twice as long
      and lands worse.
  trial-far:
    title: The outer rings open today, and the vehicle with them
    why: >-
      The trial plots and the crossing block are out past the glasshouses along the causeway,
      and nothing out there has been called this week. From today they are on the list, and the
      vehicle is signed out for it. Drive the ring road once so you know which plots are which
      before somebody asks you to score one.
  follow:
    title: Quiroga walks the trial rows once, before scoring starts
    why: >-
      The trial is four blocks of twenty lines and the plot map is only true if you know where
      the blocks start. Quiroga, the field trials manager, walks it once at the pace scoring
      actually happens. Stay with her — she stops at the row ends, which is where the map and
      the ground disagree.
  hunt:
    title: Six bagged heads, and the sheet lists four
    item: { name: bagged head, plural: bagged heads }
    why: >-
      Every bagged head in the crossing block has to be accounted for before the wind gets up,
      because a bag that has come off is a cross with an unknown father and nothing downstream
      can recover which one it was. Four are where the sheet says. Find the other two.
  canvass:
    title: Which growers actually kept the seed apart
    why: >-
      Half the district took seed from Wellmere last year on the understanding it would be grown
      in isolation, and whether that happened decides what the collection can claim about those
      lines. Ask round the farms until enough answers have come back to say.
  evade:
    title: The merchant who wants a release agreed at the gate
    why: >-
      The merchant has been on the causeway since eight wanting a yes on WM-712 before the rust
      question is settled, and Qureshi, the collection curator, has said plainly that nothing is
      agreed outside the office. Keep clear of him and finish your round.
  tag:
    title: Catch Nakagawa before the marker run starts
    why: >-
      Nakagawa, the molecular laboratory lead, has the plate layout for this morning's marker
      run, and once the machine starts it is four hours and the layout is the only thing that
      says which well is which line. Catch her before she loads it, because a result with no
      layout is ninety-six numbers and no names.

copy:
  VAULT: <p>The Seed Vault, on the neck. No windows, 1 door, and 41000 foil packets on rolling shelves at minus 18. It is the landward end of the site because it is the only building here that needs a lorry.</p>
  DRY: <p>Drying and Processing, out on the trial ring where the harvest comes off. Trays on racks in still, dry air, a cleaning mill that has not been rebalanced since March, and every sack labelled twice because a sack labelled once is a sack with no history.</p>
  CROSS: <p>The Crossing Hall, alone at the centre of the Point. Everything else on this site is arranged around the distance from here: glassine bags, forceps, a bench of pollinated heads under numbered tags, and a whiteboard where 8 slots decide what the programme works on until 2033.</p>
  LAB: <p>The Molecular Laboratory, beside the vault. Plates, a thermal cycler on its third batch of the day, and a wall of gels that say which piece of chromosome a plant inherited and nothing at all about what it will do in a field.</p>
  TRIAL: <p>The Field Laboratory, standing in its own wedge of the trial ring. Scales, a drying oven, sample bags by plot number, and the seaward plots visible through the window standing a hand shorter than the rest.</p>
  POP: <p>Genetic Resources, out in the increase ring among the grow-outs. Passport records, collection maps with pencilled routes on them, and the regeneration log that turns out to be the most important document on the station.</p>
  GH1: <p>Glasshouse 1, the warm bay. Lights on a timer, two generations a year, and the backcross that has to be finished before the rust is regional. It stands inside the isolation buffer because a sealed house is its own isolation.</p>
  GH2: <p>Glasshouse 2, the cool bay. Trays of vernalising seedlings held at four degrees, because a winter wheat that never gets a winter never flowers.</p>
  GH3: <p>Glasshouse 3, the screening bay, with its own door and its own boots. What is grown in here is deliberately infected, which is why it is the far end of the arc from everything else.</p>
  SCREEN: <p>The screenhouses, in the increase ring. Insect-proof mesh over the whole frame, so an increase of one accession stays that accession and nothing flies in with other pollen.</p>
  RECORDS: <p>Passport Records. Where every accession came from, who collected it, on what date and off which hillside, in handwriting going back to 1961.</p>
  THRESH: <p>The threshing floor, by the gate end of the compound. Harvest in, chaff out, and 40 paper bags with a farmer's handwriting on them waiting to be threshed 1 plant at a time.</p>
  GATE: <p>Point Gate, at the landward end of the causeway. The only way on or off, and the bearing the wind comes from — which is the whole reason the crossing block is 300 metres the other way.</p>

# --------------------------------------------------------------- review variants
#
# Lessons no mission stop points at. `shapeMissions` reaches these by title from
# day 3 on, so the spaced-retrieval callback has something to serve that is not
# the card the player already answered. Each one is the base lesson's concept on
# a different case: a different store, a different tray, a different family, a
# different grow-out.
lessons:
  - group: VAULT
    title: Why the vault is cold — Review
    task: Price the same two factors on somebody else's store
    concept: Why cold and dry both work, and that they multiply
    place: Seed Vault
    scene: >-
      Wren Ashworth, the genebank technician, has an aid-agency store's logbook on the bench.
      Four things about that store are being changed this year, and Mbaye wants each one's
      effect on shelf life named before the shipment is accepted.
    guide: >-
      Four changes and four effects, in a store nobody here built. Price them the way you
      would price this vault. Turn each change into doublings — degrees at roughly one per
      five, moisture at roughly one per two points removed — and read what that many
      doublings is worth as a factor. Then ask what the pair of them is worth together, and
      whether the fourth change touches the rate at all.
    background:
      - >-
          Why a factor rather than a number of years. Nothing here says how long the seed
          will live, because that depends on the species and on what state it went in. What
          both variables do is divide a rate, and a divided rate is a multiplier on whatever
          the shelf life happened to be.
      - >-
          Why one of the four changes moves nothing. Sealing a packet does not slow a
          reaction; it stops the surrounding air undoing the drying that has already been
          paid for. That is a real reason to do it and it is not a factor, which is the
          distinction this board is about.
    assumes:
      - orthodox seeds are seeds that can survive drying and cold storage
    takeaway: Two factors that each divide the same rate combine by multiplying, so the cheaper second change is worth as much as the first.
    format: PROTOCOL
    task: Match each change to the store to what it does to shelf life.
    scenarios:
      - The cold room is taken from plus five degrees down to minus fifteen.
      - The seed is dried from ten per cent moisture to six before it goes in.
      - Both of those changes are made in the same refit.
      - The packets are moved from paper envelopes into sealed foil, with nothing else altered.
    choices:
      - 'Sixteen times the shelf life, from four doublings at roughly one per five degrees.'
      - 'Four times the shelf life, from two doublings at roughly one per two points of moisture.'
      - 'Sixty-four times, because both factors divide the rate of the same reactions.'
      - 'No factor at all, and worth doing because it holds the drying that has been paid for.'
    mapping: [0, 1, 2, 3]
    why: >-
      Deterioration in a stored seed is a chemical rate, and both variables act on the same
      reactions. Twenty degrees at roughly a doubling per five is two to the fourth, or
      sixteen times. Four points of moisture at roughly a doubling per two is four times.
      Because each divides the rate of one process, the store that gets both ends at
      sixty-four times the shelf life rather than twenty. Sealed packaging changes no rate;
      it stops the drying from being undone.

  - group: CROSS
    title: Counting a generation — Review
    task: Predict the class that shows nothing, on a different tray
    concept: Monohybrid ratios, and reading a count as evidence for a mechanism
    place: Crossing Hall
    scene: >-
      Otto Bengtsson, the glasshouse manager, has the second tray out of the warm bay — five
      hundred and sixty F2 plants from a waxy-bloom cross, scored this morning. Volpe wants
      the non-waxy count predicted before anybody reads the tally sheet out.
    guide: >-
      Work from the class that shows nothing rather than the class that shows the trait. Two
      heterozygous parents give four equally likely gametic combinations, and only one of
      them carries neither dominant copy. Multiply the tray by that fraction. Two of the
      tiles belong to the dominant class or to a rival two-gene model, so read every label
      before you place anything.
    background:
      - >-
          Why the recessive class is the one to count. Both models put most of the tray in
          the dominant class, so the two predictions sit close together there and a sampling
          wobble covers the gap. The recessive class is where they separate: a quarter under
          one gene, a sixteenth under two.
      - >-
          What a close fit is and is not evidence of. A count near the expectation says the
          data are consistent with one dominant locus. It does not rule out a second gene of
          small effect, or a locus so tightly linked that the two travel together. It rules
          out the models that predict something else, which is all a ratio ever does.
    assumes:
      - a plant carries two copies of each gene and passes on one
    takeaway: The recessive class is the smaller number and the sharper test, because it is the one a rival model moves furthest.
    format: BALLPARK
    question: How many of the 560 F2 plants should be non-waxy if a single dominant locus governs the bloom?
    answerText: About 140 of the 560, against 147 counted. A two-gene either-way model would predict about 35, which the count rules out.
    why: >-
      Each parent carries one waxy allele and one non-waxy allele, and meiosis puts one of
      the two into every gamete. Four combinations follow and only one of them is recessive
      at both copies, so a quarter of the tray should show no bloom: 560 ÷ 4 = 140, against
      147 counted. The two-gene either-way model puts the recessive class at one in sixteen,
      or about 35. Counting the smaller class is what separates them, because that is where
      the two predictions differ fourfold.
    estimate:
      prompt: Five hundred and sixty F2 plants from two heterozygous parents. The waxy bloom is dominant, so only a plant carrying neither dominant copy is non-waxy.
      question: Choose the number of plants, the number of gametic combinations carrying neither dominant copy, and the number of combinations there are.
      labels:
        - 560  (F2 plants scored in the tray)
        - 1  (of the combinations carrying neither dominant copy)
        - 4  (equally likely gametic combinations)
        - 3  (combinations carrying at least one dominant copy)
        - 16  (combinations under the two-gene either-way model)
      values: [560, 1, 4, 3, 16]
      slots: 3
      template: '{0} × {1} ÷ {2}'
      formula: a*b/c
      correct: [0, 1, 2]
      target: 140
      tolerance: 10
      units: non-waxy plants
      solution: 560 × 1 ÷ 4 = 140 non-waxy, against 147 counted. The two-gene model would want 560 ÷ 16, or about 35.
      explanation: 140 expected against 147 counted is a 3 : 1 fit. The rival model wanted about 35, so the smaller class is what tells them apart.
      givens:
        - five hundred and sixty F2 plants, 147 of them non-waxy
        - two heterozygous parents, and the waxy bloom dominant
      relationship: Expected recessive = plants × 1 ÷ 4, which is the other quarter of the same 3 : 1 expectation.

  - group: LAB
    title: One disagreement, two possible causes — Review
    task: Order the moves that turn a disagreement into an answer
    concept: "Linkage and recombination: distance on a chromosome as a probability"
    place: Molecular Laboratory
    scene: >-
      Sylvie Pirelli, who keeps the passport records, has brought Nakagawa a second family.
      The marker on it sits nine centimorgans off the gene. Twenty-six plants in three hundred
      have a band that their field reaction does not agree with.
    guide: >-
      Four moves, and the order is forced by what each one needs to already exist. Ask of
      every card what has to be written down before it can be done at all. The direct-gene
      assay is the expensive one and it is aimed at a list, and the list cannot be written
      until two independent scores exist for the same plants.
    background:
      - >-
          Why the shortlist is the whole economy of this. A direct assay on three hundred
          plants answers a question that twenty-six of them were ever going to raise. Running
          the cheap marker across the family and the field score across the same family is
          what produces the twenty-six, and nothing else does.
      - >-
          Why neither of the first two scores is the truth. The marker is a band near the
          gene and the field score is a plant's reaction to an inoculation, and both can be
          wrong for reasons of their own. A disagreement names a plant worth a third look; it
          does not say which of the two was mistaken.
    takesAsRead:
      - Independent assortment, and the ratios two genes give instead
    assumes:
      - a nearby marker can be separated from a gene by crossing over
      - PCR uses primers to amplify a chosen DNA region
    takeaway: A confirmatory test is worth running only once there is a shortlist for it, and the shortlist is made of disagreements.
    format: SEQUENCE
    task: Order the four moves this family has to go through.
    cards:
      - Score every plant in the family with the linked marker.
      - Score the same plants for their reaction in the inoculated bay.
      - List the plants whose marker call and whose reaction disagree.
      - Run a second assay aimed inside the resistance gene, on the discordant plants only.
    order: [0, 1, 2, 3]
    why: >-
      A marker nine centimorgans from a gene is separated from it in about nine meioses in a
      hundred, so twenty-six disagreements in three hundred is roughly what linkage alone
      predicts. Nothing in that number distinguishes recombination from a misread band, and
      neither score can be trusted over the other. The order matters because the direct assay
      answers only the plants it is run on. Score the marker, score the plants, take the
      difference, and spend the second assay on that difference.

  - group: VAULT
    title: How many plants make a population — Review
    task: Say what an unequal bulk costs
    concept: Effective population size, and what a grow-out has to be
    place: Seed Vault
    scene: >-
      Ashworth has the harvest sheet from last season's grow-out of a barley accession. Forty
      plants flowered and all forty were cut. Qureshi, the collection curator, has ringed the
      line underneath: the packet that went back into store was bulked from the six heaviest heads.
    guide: >-
      Four accounts of what a lopsided bulk costs. Ask of each which number it is counting —
      the plants that stood in the plot, or the plants that put alleles into the packet. Those
      two are different here, and the options disagree about which of them drift responds to.
    background:
      - >-
          Why a head count is the wrong census. A regeneration is a sample of the generation
          before it, and the sample is drawn by whoever actually contributes seed to the
          packet. A plant that flowered, was cut, and then went into the reject tray is in the
          field notebook and not in the next generation.
      - >-
          Why nothing routine catches it. Seed off a lopsided bulk germinates as well as any
          other seed, weighs the same or more, and passes every viability test the vault runs.
          What has changed is which alleles are present, and no test on the drying floor is
          looking for that.
    takesAsRead:
      - Genetic drift, and why it is worst in a small sample
    assumes:
      - each generation's alleles are a sample of the last generation's
    takeaway: A grow-out is measured by who contributed rather than by who stood there, and an unequal contribution makes a population behave as a smaller one.
    format: CHOICE
    question: Forty plants were grown out and the packet was bulked from six of them. What has that cost the accession?
    choices:
      - It drifts like a much smaller population, six plants parenting the next generation
      - It drifts like a population of forty, since forty plants stood in the plot and were harvested
      - Nothing is lost genetically, because six well-grown heads still carry the accession's range
      - The cost is vigour rather than variation, appearing as inbreeding depression next season
    answer: It drifts like a much smaller population, six plants parenting the next generation
    why: >-
      Drift is set by the number of individuals that actually pass alleles on, not by the
      number that grew. Forty plants stood in the plot and six of them are the parents of
      everything in the packet, so the accession behaves as a population of about six.
      Whatever the other thirty-four carried and nobody else did has gone, and it has gone
      silently: the bulked seed germinates as well as any other seed and weighs more.
    rebuttals:
      - Counting the plants that stood in the plot is the mistake itself; what counts is the plants that contributed seed.
      - Six heads carry six plants' worth of alleles, and whatever the other thirty-four held is not in the packet.
      - Inbreeding depression is a real second cost, and it follows the loss of variation rather than replacing it.

          Start the grow-out at about 88 % germination. It fires with the interval the grow-out needs,
          and the lot is under way before viability reaches the 85 % floor.
        why: The viability floor is not the moment to begin acting, because the biological response has lead time of its own. A grow-out starts an interval after it is called, and germination goes on falling in the meantime, so the rule has to sit above the 85 per cent floor by however far viability drops in that interval. Writing it before the record is replayed is what keeps hindsight from becoming policy. In this authored stream, starting at 88 leaves the lot under way before the floor; waiting until 85 acts after it is crossed.
      - group: TRIAL
        task: Say why last year's height difference has gone
        title: A difference that was the field
        place: Field Laboratory
        scene: Last season two pure lines differed by nine centimetres in height, with a statistically clear separation. This season the same lines were randomised onto different plots and no longer differ. The seed stocks themselves have not changed.
        guide: >-
          Four explanations for a gap that vanished. Ask of each whether the seed or the
          ground changed between seasons. Lines do not become genetically different in a
          year. Randomisation prevents systematic favouring and one realised layout can
          still be lucky. A second season on different plots asks whether the difference
          follows the seed.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - the same line grown in two places can give two different results
        takeaway: A result that does not survive being grown again somewhere else was probably about the somewhere.
        format: CHOICE
        question: What is the most likely explanation?
        why: A one-season comparison contains genetics plus whatever was unusual about the plots each line received. Randomisation makes systematic favouring less likely, but one realised layout can still be lucky. A second season on different plots asks whether the difference follows the seed. Here the nine-centimetre gap disappears. That makes last year’s estimate look partly environmental rather than a stable genetic effect. Replication across plots and seasons is how a breeding programme separates a line from a flattering piece of ground.
        choices:
          - Last year's difference was partly the plots those lines landed in
          - The lines have changed genetically between one season and the next
          - This year's measurements were taken less carefully
          - Height is not a heritable trait in wheat
        answer: Last year's difference was partly the plots those lines landed in
        rebuttals:
          - Pure lines do not change appreciably between two seasons.
          - Careless measurement adds scatter rather than removing a difference of nine centimetres.
          - Height is strongly heritable, which is exactly why the disappearance is worth explaining.
  # ---------------------------------------------------------------- day 7
  - title: 400 kilometres away
    objective: Decide what to do about a disease that has not arrived.
    briefing: A new race of the rust, reported on the other side of the border.
    stake: >-
      Tuesday. The regional bulletin has a new race of stem rust in it. The race is 400
      kilometres east of here. It is on a variety that carries the same resistance gene as
      WM-712. That gene is not stopping it. WM-712 is already in seed increase. Nakagawa can
      screen the collection for a second resistance gene. Ivanescu can tell her which samples to
      look in. Neither of them can do it in one season without dropping something else. Wellmere
      has no rule that says when a warning this far away becomes work here. Today you decide
      what the screen looks for.
    takeaway: A resistance that rests on one gene is a resistance the pathogen only has to solve once.
    stops:
      - group: LAB
        task: Trace how a DNA change can become a resistance-breaking phenotype
        title: One base, one broken lock
        place: Molecular Laboratory
        scene: WM-712 is failing east of the border. Nakagawa has sequenced a rust gene from older and newer isolates. The newer isolate differs by one nucleotide in a coding region, while the rest of that gene is unchanged.
        guide: >-
          Four accounts of how one base can matter. Ask of each whether it respects the
          order of the steps. DNA is transcribed, and the transcript is translated. So a
          change acts before the protein exists, not during infection. Some
          substitutions are silent, and not all of them stop translation. What follows
          is selection on whichever variant escapes recognition.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        takesAsRead:
          - Dominance, and why one allele is enough
        assumes:
          - genes contain DNA sequences that can be transcribed into mRNA
          - ribosomes translate mRNA codons into amino acids
        takeaway: A mutation matters through what it changes in RNA, protein, and phenotype; selection then acts on that phenotype.
        format: CHOICE
        question: How can 1 DNA substitution change whether WM-712 recognizes the pathogen?
        answerText: The DNA substitution can change an mRNA codon and therefore an amino acid in the pathogen protein. If that changes recognition, the resulting phenotype can spread by natural selection.
        why: A point mutation replaces one nucleotide in DNA. When that region is transcribed, the change can alter an mRNA codon. During translation, a changed codon may place a different amino acid in the pathogen protein. That can alter the protein’s shape or function, although some substitutions are silent. If the altered protein escapes recognition by WM-712, that rust variant can reproduce on resistant plants. Selection then raises the frequency of the resistance-breaking variant.
        choices:
          - The substitution can alter an mRNA codon, changing the protein that the wheat recognizes
          - The substitution directly rewrites the wheat resistance protein during infection
          - The changed mRNA is inherited even though the pathogen DNA stays unchanged
          - Every single-base substitution stops translation before the protein is completed
        answer: The substitution can alter an mRNA codon, changing the protein that the wheat recognizes
        rebuttals:
          - The pathogen mutation changes the pathogen's information; it does not rewrite the wheat genome.
          - Heritable sequence information resides in DNA. The mRNA is a temporary transcript of it.
          - Some substitutions are silent, and others change one amino acid without creating a stop codon.
      - group: POP
        task: Say where to look for a second gene
        title: Where an unused allele lives
        place: Genetic Resources Office
        scene: |-
          Ivanescu has to pick 50 accessions to screen out of 41,000. On the board: modern varieties, the breeding programme's own parents, and the landraces from districts where rust has always been present.
        guide: >-
          Four kinds of material to search. Ask of each what selection it has actually
          experienced. A landrace grown where the rust arrives often has met that
          pathogen many times, so protective alleles could rise in frequency. The
          programme's own parents may share ancestry, and the same source, with the line
          that is failing.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - populations are shaped by what has been selecting them
        takeaway: Where a disease has always been, the plants that stayed are the ones that could.
        format: CHOICE
        question: Which material is most likely to carry a different resistance gene?
        why: Selection leaves a signature in the populations that experienced it. A landrace grown where rust arrives often has repeatedly faced that pathogen. Plants with useful resistance can then contribute more seed, raising the frequencies of protective alleles. Modern breeding parents are more likely to share ancestry with WM-712 and may carry the same resistance source. Landraces from endemic regions therefore offer a better search space for different resistance. They are not guaranteed to contain it, so the next step is still screening rather than assumption.
        choices:
          - Landraces from districts where the rust is endemic
          - The programme's own recent parents
          - Modern varieties from the driest districts
          - Accessions collected most recently, from anywhere
        answer: Landraces from districts where the rust is endemic
        rebuttals:
          - Recent parents share ancestry with the line that is failing, so they mostly share its gene.
          - Rust needs moisture; dry districts select for something else entirely.
          - Collection date says nothing about what selected the population before it was collected.
      - group: DRY
        task: Close a simplified 100-unit resource ledger for the resistant line and identify the unlisted allocation.
        title: Where the missing 2% went
        place: Drying & Processing Hall
        scene: Toft has paired no-rust plots of near-identical lines with and without the resistance gene. The resistant line yields about 2% less. Nakagawa also detects the defence transcript in clean leaves before infection.
        guide: >-
          Read every stream, then count only what belongs in the same resource ledger.
          The resistant line yields about 2% less in plots with no rust at all, so the
          resource has gone somewhere other than growth. Nakagawa's transcript
          measurement is the clue to which stream is not yet on the board.
        background:
          - >-
              Why no-rust plots are the whole design. With disease present, a resistant line
              yields more because it is not being eaten. Removing the disease removes that
              benefit and leaves only the cost, which is the quantity this stop is trying to
              measure.
          - >-
              What the transcript is evidence of. The defence pathway is being expressed in
              clean leaves, before any infection. Making those proteins costs carbon and
              nitrogen that are then unavailable for grain, and that expenditure happens
              whether or not the pathogen ever arrives.
          - >-
              Why the number matters commercially. A 2% yield penalty carried permanently is
              the price of insurance against a disease that may not come every year. Knowing
              it is what lets a breeding programme decide when the insurance is worth
              buying.
        takesAsRead:
          - Dominance, and why one allele is enough
        assumes:
          - transcription produces mRNA from DNA
          - translation uses mRNA to make protein
          - gene expression can be constitutive or inducible
        takeaway: Gene regulation controls when defence proteins are made, and expression before infection can carry a standing resource cost.
        format: BALANCE
        question: Which hidden allocation closes the resistant line's resource budget and matches the yield penalty?
        balance:
          hint: Count only terms expressed in the same 100-unit seasonal resource budget. The visible allocations do not quite close the total.
          total:
            amount: 100
            unit: resource units
            label: Seasonal assimilated-resource budget
          streams:
            - id: grain
              label: Grain allocation
              value: 48
              display: 48 units
            - id: shoot
              label: Leaves and stems
              value: 34
              display: 34 units
            - id: roots
              label: Roots and maintenance
              value: 16
              display: 16 units
            - id: defence
              label: Resistance-system maintenance
              value: 2
              display: 2 units
              hidden: true
          tolerance: 0.5
        answerText: The hidden two-unit allocation is defence. The resistance line is expressing the pathway even without rust, so some resources are committed before infection.
        why: Regulatory DNA and transcription factors control whether a gene is transcribed. Some genes are expressed continuously, while others are induced by a signal. Here the defence transcript is already present in clean leaves, so the plant is investing in that pathway before rust arrives. Translation turns the mRNA into protein, and maintaining that machinery uses part of the plant’s resource budget. The simplified ledger assigns the missing two units to defence, matching the observed yield penalty.
  # ---------------------------------------------------------------- day 8
  - title: What you asked for and what you got
    objective: Predict what one round of selection will actually deliver.
    briefing: The best 20 plots, and what their offspring will be like.
    stake: >-
      Wednesday. The trial is scored. Volpe wants to take the best 20 plots out of 240 forward,
      and she has her 20 marked on the plan already. 240 plots is the whole trial, sown before
      the rust warning came. Quiroga has run the numbers on what those 20 plots would actually
      give the programme next year. Bengtsson can find the programme one extra generation in the
      warm bay. He needs the decision this week. Toft has finally got his canopy data. It
      explains why 2 of the 20 are good. Today you decide what the trial carries forward.
    takeaway: What a round of selection returns is the part of the difference that was inherited, and no more.
    stops:
      - group: TRIAL
        task: Predict the gain
        title: What one round returns
        place: Field Laboratory
        scene: The trial mean is 7.4 tonnes per hectare. The 20 plots Volpe wants to keep average 9.1. Quiroga estimates yield heritability on this ground at 0.3 and asks what gain should actually reach the next generation.
        guide: >-
          Five numbers, and two of them belong elsewhere: the number of plots, and a
          difference already worked out. Ask of each what this prediction needs. The
          selected plots are above average for two reasons, and only one of them is
          inherited. So the selected mean is not a forecast; much of its advantage stays
          with the plots.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - a plant's performance is part inheritance and part where it grew
        takeaway: Only the heritable share of an advantage is passed on, and for yield that share is small.
        format: BALLPARK
        question: Estimate the yield of the next generation from this selection.
        answerText: About 7.9 t/ha, a gain of roughly half a tonne rather than 1.7.
        why: The selected plots are above average for genetic and environmental reasons. The breeder’s equation keeps only the heritable share of that advantage. Here the selection differential is 9.1 − 7.4 = 1.7 tonnes per hectare. Multiplying by h² = 0.3 gives a response of 0.51. Adding that response to the original mean predicts about 7.9 tonnes per hectare next generation. The selected-plot mean of 9.1 is therefore not an inherited forecast; much of its advantage stays with the plots.
        estimate:
          prompt: Trial mean 7.4 t/ha, selected mean 9.1 t/ha, heritability 0.3. Predict the next-generation mean.
          question: Choose the original mean, selected mean and heritability.
          labels:
            - 7.4  (trial mean, t/ha)
            - 9.1  (selected mean, t/ha)
            - 0.3  (heritability)
            - 1.7  (selection differential, already calculated)
            - 240  (plots in the trial)
          values: [7.4, 9.1, 0.3, 1.7, 240]
          slots: 3
          template: "{0} + {2} × ({1} − {0})"
          formula: a+c*(b-a)
          correct: [0, 1, 2]
          target: 7.91
          tolerance: 0.15
          units: t/ha next generation
          solution: 7.4 + 0.3 × (9.1 − 7.4) = 7.91 t/ha.
          explanation: The selected plots are 1.7 t/ha above average, but only 30% of that differential is expected to appear in the next generation.
          givens:
            - Trial mean 7.4 t/ha and selected mean 9.1 t/ha
            - Heritability h² = 0.3
          relationship: R = h²S, where S = selected mean − population mean. Add R to the original mean.
      - group: CROSS
        task: Decide what the extra generation is for
        title: An extra generation in the bay
        concept: Backcrossing a gene into an existing line, one generation at a time
        place: Crossing Hall
        scene: Bengtsson can run one more generation over the winter in the warm bay. It is the only place at Wellmere where a generation costs 3 months instead of 12, and there is bench room for 1 population.
        guide: >-
          Four uses for one warm bay. Ask of each whether it needs time, field
          conditions, or space. Yield cannot be judged under glass because the
          environment is missing. Regenerating a landrace there imposes a selection
          nobody chose. Seed multiplication needs area. Only one of the four is short of
          generations rather than of anything the bay lacks.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        takesAsRead:
          - Dominance, and why one allele is enough
        assumes:
          - a glasshouse can complete a generation out of season
        takeaway: A generation indoors is for advancing material, not for judging it.
        format: CHOICE
        question: What should the warm bay be used for this winter?
        answerText: Use the warm bay to advance the backcross. It buys another generation and another chance at the rare crossover without pretending the glasshouse can replace a field trial.
        why: The warm bay is valuable when calendar time is the main constraint. Breaking linkage drag needs more meioses and more opportunities for a rare crossover, so another generation directly advances that goal. Yield cannot be judged credibly under glass because the field environment is missing. Regenerating a landrace there would impose an unintended glasshouse selection. Seed multiplication mainly needs area, which the bay lacks. The scarce indoor generation therefore belongs to the backcross rather than to work that needs field conditions or space.
        choices:
          - Advancing the backcross that needs a rare crossover
          - Yield-testing the 20 selected lines early
          - Growing out the overdue landrace accession
          - Multiplying seed of WM-712 for the merchant
        answer: Advancing the backcross that needs a rare crossover
        rebuttals:
          - A yield figure from a glasshouse is measured under conditions no field ever offers.
          - Regenerating an accession under glass applies a selection nobody chose and cannot undo.
          - Multiplication is an area problem, and the bay is the smallest ground on the station.
      - group: DRY
        task: Say what explains 2 of the 20
        title: Why those two did well
        place: Drying & Processing Hall
        scene: |-
          2 of the 20 selected plots reached full canopy 11 days before the rest and flowered 4 days earlier. Their yields are the highest in the trial and the season was dry after flowering.
        guide: >-
          Four explanations for the early lines winning. Ask of each whether it is about
          efficiency or about timing. Soil water became limiting after flowering, so a
          canopy that closed earlier caught light while the stomata could still open.
          Two of these options are about escaping something else entirely. And in a wet
          year the advantage could vanish.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone

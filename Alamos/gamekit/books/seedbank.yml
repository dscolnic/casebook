# Wellmere — a seed bank, a breeding programme, and one season to decide.
#
# The second AP Biology game. Outbreak: Riverton is the medical-molecular half
# of that course — cells, membranes, diagnostics, immunity, epidemiology. This is
# the other half, the one a hospital campus can only name-check: heredity,
# selection, population genetics and plant energetics. Nothing here is decided by
# a pathogen and a patient; everything is decided by a cross, a frequency or a
# temperature.
#
# The argument: Volpe holds that a line good enough to release is a line that
# should be released, because a season lost is food nobody eats. Qureshi holds
# that the collection is the only copy of what nobody has needed yet, and that
# every shortcut through it is taken from people who are not in the room.
# Volpe is right on day 4. Qureshi is right on day 12.

theme:
  id: seedbank
  title: Wellmere
  subtitle: Season Lead · Wellmere Seed Bank

groups:
  - id: VAULT
    code: VAULT
    name: Conservation & Viability
    color: '#2f5d52'
    desc: What a seed is doing while it sits still, and how long it can go on doing it.
    defaultLeader: mbaye
    milestones: [Read the store, Test the germination, Decide what to regenerate, Ready to hand over]
  - id: CROSS
    code: CROSS
    name: Heredity & Crossing
    color: '#7a4fa3'
    desc: Which parents, which offspring, and what a ratio is evidence of.
    defaultLeader: volpe
    milestones: [Choose the parents, Make the cross, Read the generation, Ready to hand over]
  - id: POP
    code: POP
    name: Population Genetics
    color: '#1f7a6b'
    desc: What a collection holds, and what is lost every time it is grown out.
    defaultLeader: ivanescu
    milestones: [Count the alleles, Test against the null, Size the sample, Ready to hand over]
  - id: TRIAL
    code: TRIAL
    name: Field Trials & Selection
    color: '#b0762a'
    desc: Telling a good line from a good year, on ground that is never uniform.
    defaultLeader: quiroga
    milestones: [Lay out the trial, Score the plots, Separate line from site, Ready to hand over]
  - id: LAB
    code: LAB
    name: Markers & Gene Expression
    color: '#3f6f8f'
    desc: What a piece of DNA can tell you about a plant you have not grown yet.
    defaultLeader: nakagawa
    milestones: [Run the marker, Check the linkage, Predict the phenotype, Ready to hand over]
  - id: DRY
    code: DRY
    name: Agronomy & Plant Energetics
    color: '#b3462f'
    desc: Where the mass in a seed comes from, and what it costs the plant to make it.
    defaultLeader: toft
    milestones: [Measure the crop, Follow the carbon, Account for the water, Ready to hand over]

roster:
  - id: qureshi
    name: Dr. Nasrin Qureshi
    role: Collection Curator
    division: VAULT
    bio: |
      Keeps 41,000 accessions, which is 41,000 populations rather than 41,000
      seeds. What is in the vault is not a list of varieties; it is the variation
      inside each of them, and that is the part which cannot be bought back.

      Her argument with the breeding programme is the same one every season.
      Every time an accession is grown out to refresh it, a sample of it is what
      survives — and a sample is smaller than the thing it came from. Do that
      often enough with too few plants and the collection quietly becomes a
      different collection.

      Her limit is that she is defending against a problem nobody has yet. The
      rust that makes her right arrives after the season she loses the argument.
    quiz:
      - q: Why does Qureshi call an accession a population rather than a variety?
        a: The variation inside it is the part that cannot be replaced
        wrong:
          - Accessions are stored as bulk samples rather than as named varieties
          - A variety has to be registered before a gene bank will accept it
          - Populations are counted by weight and varieties by seed number
  - id: volpe
    name: Dr. Chiara Volpe
    role: Head Breeder
    division: CROSS
    bio: |
      Runs the breeding programme and counts in seasons, because that is the unit
      she is given. A cross made this spring is a line in four years and a
      release in seven, and every argument that delays one delays all of them.

      She is unsentimental about the collection in a way the curator finds
      alarming and is not wrong about: material nobody uses is material that
      helps nobody, and a gene bank that never gives anything away is a very
      expensive cupboard.

      Her limit is the thing she is selecting for. A line bred for one place and
      one decade is exactly as good as that place and that decade turn out to be.
    quiz:
      - q: Why does Volpe treat a season's delay as expensive?
        a: Every step of a seven-year pipeline moves back with it
        wrong:
          - Seed loses viability if it is held for a further season before sowing
          - Trial ground has to be rented a year in advance and cannot be deferred
          - Funding for a breeding programme is released one season at a time
  - id: mbaye
    name: Dr. Yusuf Mbaye
    role: Seed Physiologist
    division: VAULT
    bio: |
      Answers one question for a living: how long will this live? A seed in the
      vault is not inert. It is respiring, slowly, and everything he controls —
      the drying room, the moisture content, the minus eighteen — is aimed at
      making that slower.

      He germinates a sample of every accession on a schedule and plots the
      curve. When it drops below eighty-five per cent the accession has to be
      grown out, which is the moment the argument between the vault and the
      field starts again.

      His limit is that a germination test costs seed. Every measurement of how
      alive a collection is takes a little of it away.
    quiz:
      - q: Why does Mbaye dry seed before it goes into the vault?
        a: A drier seed respires more slowly and lives longer
        wrong:
          - Dry seed packs more tightly and the vault holds more of it
          - Moisture makes the passport labels illegible over time
          - Freezing wet seed shatters the seed coat on the way down
  - id: ivanescu
    name: Dr. Tomas Ivanescu
    role: Population Geneticist
    division: POP
    bio: |
      Counts alleles for a living and is patient about being asked why it
      matters. A frequency is a fact about a population and not about any plant
      in it, and most arguments here come from somebody forgetting which of the
      two they are holding.

      He is the one who works out how many plants an accession has to be grown
      from. It is not a matter of taste: below a certain number, drift takes rare
      alleles out on its own, and nothing about the growing was done badly.

      His limit is that he cannot say which allele will matter. He can only say
      what it costs to keep all of them, which is an argument nobody enjoys.
    quiz:
      - q: Why can Ivanescu not say which alleles are worth keeping?
        a: What is useful depends on a future nobody has seen
        wrong:
          - Allele frequencies cannot be measured accurately below one per cent
          - The passport data does not record which alleles an accession carries
          - Sequencing every accession would cost more than the collection is worth
  - id: quiroga
    name: Dr. Meera Quiroga
    role: Field Trials Manager
    division: TRIAL
    bio: |
      Lays out the ground. Four replicates, randomised within blocks, and the
      same line sown in four different places on purpose — because the north end
      of that field is wetter than the south and always has been.

      What she is defending against is the oldest mistake in agriculture:
      deciding a line is good when what was good was the corner it grew in. The
      randomisation is not a formality; it is the only reason the numbers at the
      end mean a line at all.

      Her limit is one site and one year. Everything she measures is true of
      Wellmere in this weather, and saying so is most of her job.
    quiz:
      - q: Why does Quiroga sow the same line in four separate plots?
        a: So a difference between plots does not get read as a difference between lines
        wrong:
          - Four plots give enough seed to sow the following season
          - Regulations require every trial entry to be replicated four times
          - A single plot cannot be scored accurately by one person
  - id: nakagawa
    name: Dr. Hana Nakagawa
    role: Molecular Laboratory Lead
    division: LAB
    bio: |
      Runs the markers, and is careful about what a marker is: a piece of DNA
      near the gene you care about, not the gene itself. Near is doing the work
      in that sentence, and how near decides how often the marker lies.

      She can tell the breeder which seedlings to keep before they have a leaf
      worth looking at, which saves a year. She will also say, unprompted, when a
      marker has come loose from the trait in a new population and is no longer
      telling anybody anything.

      Her limit is that she tests for what somebody has already found. A marker
      exists because a gene was mapped, and nothing in her laboratory finds the
      thing nobody has looked for.
    quiz:
      - q: Why does Nakagawa re-check a marker in each new population?
        a: Recombination can separate it from the gene it stands for
        wrong:
          - Markers degrade in storage and have to be re-synthesised each season
          - Every population needs its own primers for the same marker
          - Laboratory reagents vary between batches and shift the result
  - id: toft
    name: Dr. Osman Toft
    role: Agronomist
    division: DRY
    bio: |
      Follows the carbon. Every gram of grain in the drying hall was atmospheric
      carbon dioxide in June, and the difference between a good line and a bad
      one is mostly what it did with the light and the water it was given.

      He measures the boring things nobody publishes — canopy cover, days to
      flowering, water use — because they are what explain a yield rather than
      report it. A line that yields well and cannot say why is a line nobody can
      breed from.

      His limit is that a field is not a chamber. Everything he measures is
      confounded with the weather, which is why he keeps eleven years of it.
    quiz:
      - q: Why does Toft measure canopy cover and flowering date alongside yield?
        a: They explain a yield instead of only recording it
        wrong:
          - Yield cannot be measured accurately until the crop has flowered
          - Canopy cover is what the trial protocol requires to be reported
          - Flowering date is used to schedule the harvest crew
  - id: ashworth
    name: Wren Ashworth
    role: Genebank Technician
    division: VAULT
    bio: |
      Packs, labels, counts and finds. Every accession that leaves the vault and
      every one that comes back goes through their hands, and the number on the
      packet is the only thing tying a seed to everything known about it.

      They are quietly the most careful person on site. A mislabelled packet is
      not a small error: it is a plant whose passport belongs to something else,
      and it can be twenty years before anybody notices.

      Their limit is that they can only record what the field tells them. A plot
      harvested into the wrong bag arrives here already wrong.
    quiz:
      - q: Why does Ashworth treat a packet number as the important part?
        a: Without it the seed is separated from everything known about it
        wrong:
          - Numbers are how the vault's temperature log is cross-referenced
          - The number determines which shelf and box the packet belongs in
          - Accessions cannot be exported without a number on the packet
  - id: fenn
    name: Idris Fenn
    role: Farmer, and on-farm conservation partner
    division: POP
    bio: |
      Grows four landraces on his own ground because his grandfather did, and
      because two of them do something in a wet August that nothing modern does.
      Wellmere has samples of all four; his fields have the living versions.

      What he provides that the vault cannot is a population still being
      selected — by his soil, his weather and his own choice of what to keep
      seed from. The vault holds 1994. His field holds this year.

      His limit is that he is one farm. What his ground selects for is his
      ground, and he says so before anybody else can.
    quiz:
      - q: What does Fenn's field hold that the vault does not?
        a: Plants still under the pressures of a real farm
        wrong:
          - Larger seed samples than a gene bank can store
          - Varieties that were never accepted into the collection
          - Seed that has been tested for germination every year
  - id: pirelli
    name: Sylvie Pirelli
    role: Data & Passport Records
    division: LAB
    bio: |
      Holds the passport data: where each accession was collected, when, by whom
      and from what. It is the difference between a bag of seed and a sample of
      somewhere.

      She is strict about provenance because everything downstream leans on it. A
      duplicate entered twice under two names inflates a collection on paper and
      wastes a regeneration slot that something unique needed.

      Her limit is that she inherited most of it. Half these records were written
      on paper by people who are dead, and the gaps are permanent.
    quiz:
      - q: Why does Pirelli chase duplicate accessions so hard?
        a: A duplicate takes a regeneration slot something unique needed
        wrong:
          - Duplicates make the collection appear smaller than it is
          - Storage space in the vault is the limiting resource
          - Two records of one accession cannot both be exported
  - id: bengtsson
    name: Otto Bengtsson
    role: Glasshouse Manager
    division: CROSS
    bio: |
      Runs three bays at three temperatures and knows what each one is for: the
      warm bay to push a generation through in winter, the cool bay for the
      lines that will not flower without a cold spell, and the screening bay,
      which is kept apart because there is rust in it on purpose.

      He can get the programme an extra generation a year, which is the single
      biggest lever anybody at Wellmere has on time.

      His limit is that a glasshouse is not a field. A line that looks superb in
      his bays has been grown without wind, without drought and without
      competition, and he says so every time somebody gets excited.
    quiz:
      - q: Why does Bengtsson warn against judging a line in the glasshouse?
        a: It has grown without wind, drought or competition
        wrong:
          - Glasshouse plants are grown at higher density than field plots
          - The bays cannot be scored with the same instruments as a field
          - Lines in glasshouses are grown from smaller seed samples

glossary:
  - name: Seed
    aliases: [seeds]
    def: A young plant with its own supplies and a coat around both. Everything in this collection is one, and none of them is inert.
  - name: Gene
    aliases: [genes]
    def: One instruction in a plant's inheritance — for a protein, and through it for something about the plant.
  - name: DNA
    aliases: []
    def: The molecule those instructions are written in, copied into every cell and handed on when a plant reproduces.
  - name: Chromosome
    aliases: [chromosomes]
    def: One long thread carrying many instructions in a fixed order, and inherited whole. A wheat plant has twenty-one pairs.
  - name: Pollen
    aliases: []
    def: What a plant fertilises with. One grain of it carries a single set of chromosomes to an egg.
  - name: Plot
    aliases: [plots]
    def: One patch of a trial, carrying one line. It is the unit everything in the field is measured on.
  - name: Accession
    aliases: [accessions]
    def: One sample held in a collection, with a number and a record of where it came from. What is in it is a population.
  - name: Variety
    aliases: [varieties]
    def: A named, uniform crop type sold to farmers. A collection holds many of them and is not made of them.
  - name: Trait
    aliases: [traits]
    def: Anything about a plant somebody measures or scores — its height, its yield, whether it stays standing.
  - name: Landrace
    aliases: [landraces]
    def: A crop population shaped by one place and its farmers over generations rather than by a breeding programme.
  - name: Viability
    aliases: [viable]
    def: The share of a sample that will still grow. It falls with time, and how fast depends on how the sample is kept.
  - name: Germination test
    aliases: [germination]
    def: Sowing a sample of an accession to count how many come up. It is the only honest measure of viability, and it costs seed.
  - name: Regeneration
    aliases: [regenerate, regenerated, grow-out]
    def: Growing an accession out to make fresh seed. Every one is a new sample of the old population.
  - name: Respiration
    aliases: [respire, respiring]
    def: The slow burning of what a cell has put by, which is how it keeps going. Cold and dry makes it slower; warm and damp makes it quick, and then it ends.
  - name: Moisture content
    aliases: [moisture]
    def: How much water a seed is carrying, as a share of its weight. It sets the rate of everything else that happens to it.
  - name: Photosynthesis
    aliases: [photosynthetic]
    def: Building sugars from carbon dioxide and water using light. Every gram of grain was air in June.
  - name: Allele
    aliases: [alleles]
    def: One of the versions a gene comes in. A population holds several; a plant holds two.
  - name: Allele frequency
    aliases: [frequencies, gene frequency]
    def: How common a version of a gene is in a population, as a proportion. It is a fact about the population, not about any plant.
  - name: Hardy-Weinberg
    aliases: [hardy–weinberg, equilibrium expectation]
    def: What genotype proportions would be if nothing were acting on a population. It is a null to be tested against, not a description.
  - name: Genetic drift
    aliases: [drift]
    def: Change in allele frequency by sampling alone. It is strongest in small populations, and what it removes is whatever was uncommon.
  - name: Effective population size
    aliases: [effective size]
    def: How large a population behaves as, genetically. Uneven contributions and few parents both make it smaller than the plant count.
  - name: Bottleneck
    aliases: [bottlenecks]
    def: A generation grown from too few parents. What comes out is a sample of what went in, and the uncommon versions are what go missing.
  - name: Meiosis
    aliases: []
    def: The division that makes a plant's male and female cells. It halves the number of chromosomes and shuffles what goes into each.
  - name: Segregation
    aliases: [segregate, segregates]
    def: The separation of a plant's two alleles into different gametes, so a cross gives offspring in predictable proportions.
  - name: Cross
    aliases: [crosses, crossing, backcross]
    def: Deliberately fertilising one plant with another. A backcross returns to one parent to keep the rest of that parent.
  - name: Dominant
    aliases: [dominance, recessive]
    def: An allele whose effect shows when only one copy is present. A recessive one shows only when both copies are it.
  - name: Phenotype
    aliases: [phenotypes]
    def: What a plant turns out to be like, as opposed to what it is carrying. Two plants can match here and differ underneath.
  - name: Genotype
    aliases: [genotypes]
    def: Which alleles a plant carries. Two plants can share a phenotype and not a genotype.
  - name: Heritability
    aliases: [heritable]
    def: How much of the variation in something measured, in one population in one place, is down to inheritance rather than conditions.
  - name: Selection differential
    aliases: [selection intensity]
    def: How much better the plants you kept were than the average of what you grew. It is what you asked for.
  - name: Marker
    aliases: [markers, marker-assisted]
    def: A stretch of DNA close enough to a gene to travel with it, used to pick plants before anything can be seen.
  - name: Linkage
    aliases: [linked]
    def: Two instructions near each other on one chromosome travel together. It is what makes a marker work, and what brings unwanted neighbours along with a wanted one.
  - name: Recombination
    aliases: [recombine, crossing over]
    def: The swapping of stretches between a pair of chromosomes when gametes are made. Given enough generations it separates neighbours.
  - name: Replicate
    aliases: [replicates, replication]
    def: The same line grown in more than one place, so that the ground can be told apart from the line.
  - name: Randomisation
    aliases: [randomise, randomised]
    def: Assigning entries to plots by chance, so that no line is systematically given the best corner of a field.
  - name: Block
    aliases: [blocks, blocking]
    def: A group of neighbouring plots, close enough to be alike. Comparing inside one removes most of what the field itself contributes.
  - name: Pathogen
    aliases: [pathogens]
    def: Anything living that makes a plant ill — a fungus, a bacterium, a virus. It is under selection too, which is why a defence does not stay one.
  - name: Rust
    aliases: []
    def: A fungal disease of cereals that spreads on the wind and evolves around resistance. It is why nobody plants one variety everywhere.
  - name: Resistance gene
    aliases: [resistance]
    def: An allele that lets a plant fight off a particular disease. A disease that changes can make it worthless in a season.

missions:
  # ---------------------------------------------------------------- day 1
  - title: What is actually in the vault
    objective: Find out what Wellmere is holding and what it is doing while it sits there.
    briefing: Forty-one thousand accessions, and sixty of them overdue.
    stake: >-
      Monday in the first week of March, and the sowing plan has to be signed by Friday. Wellmere
      holds 41,000 accessions at minus eighteen, and Yusuf Mbaye's germination schedule says sixty
      of them have dropped below the line where they have to be grown out this season. There is
      room in the ground for about forty. Chiara Volpe wants that ground for her own trial and
      Nasrin Qureshi wants it for the collection. Today you find out what a seed is doing while it
      is stored, what the crossing programme is trying to make, and how the trial ground is laid
      out — because Friday's plan is made out of those three things.
    takeaway: A stored seed is alive and spending itself, and everything in the vault is aimed at slowing that down.
    stops:
      - group: VAULT
        task: Say what the cold and the drying are for
        title: Why the vault is cold
        place: Seed Vault
        scene: Mbaye has two lots of the same accession on the bench. One spent four years at minus eighteen degrees and six per cent moisture. The other sat in a warm shed and now germinates at thirty-one per cent.
        assumes:
          - orthodox seeds are seeds that can survive drying and cold storage
        takeaway: Cold and low moisture extend orthodox-seed life by slowing the reactions that drive deterioration.
        format: CHOICE
        question: Why does cold, dry storage keep a seed alive longer?
        answerText: Cold and drying slow the reactions that accumulate damage inside orthodox seeds, so viability declines much more slowly.
        why: Orthodox seeds tolerate drying, but they are still chemically active enough to age. Low water content slows many damaging reactions inside the cells. Cold slows those reactions further, so the two conditions work together. Viability loss is not simply a fuel tank running empty. Membranes, proteins and other cell components accumulate damage over time. Pests and fungi also matter, but a clean sealed sample still lasts far longer when it is kept cold and dry.
        choices:
          - They slow the chemical reactions that gradually damage a stored seed
          - They keep the embryo dormant by blocking its germination signals
          - They preserve the seed mainly by killing fungi already inside the packet
          - They harden the seed coat so the living cells no longer need repair
        answer: They slow the chemical reactions that gradually damage a stored seed
        rebuttals:
          - Dormancy helps prevent germination at the wrong time, but it does not explain decades of slower ageing in dry storage.
          - Drying and sealing suppress pests and fungi, but sterile seed still ages; the internal damage rate also matters.
          - The coat does not make the living cells maintenance-free. Storage conditions change the rate of deterioration inside them.
      - group: CROSS
        task: Say what a cross is for
        title: Two parents, and what you are asking of them
        place: Crossing Hall
        scene: Volpe has two parents pinned above the bench. One is a high-yielding modern variety. The other is a low-yielding landrace that survived the 2018 drought. Otto Bengtsson asks what combination the programme is trying to create.
        assumes:
          - offspring get one set of chromosomes from each parent
        takeaway: A cross is a request for a combination, and it takes generations to find out whether it was granted.
        format: CHOICE
        question: What is the programme actually asking for by crossing these two?
        why: Meiosis gives each gamete one copy of each chromosome. The F1 therefore receives one set from each parent. The next generation reshuffles those copies into many combinations. The breeder wants offspring carrying useful yield alleles from the modern parent and drought alleles from the landrace. Neither parent has that combination. Many offspring will be worse than either parent because useful and harmful alleles also segregate. Breeding works by making enough recombinant offspring to find the rare combinations worth keeping.
        choices:
          - Offspring that carry both parents' useful alleles at once
          - Offspring midway between the two parents in every trait
          - A landrace that has been improved by contact with the modern line
          - A hybrid that will be stronger than either parent
        answer: Offspring that carry both parents' useful alleles at once
        rebuttals:
          - Traits controlled by many genes average out; the ones the programme wants do not.
          - A landrace is a population, and crossing changes what comes out rather than improving it in place.
          - Hybrid vigour is real in some crops and is not what a wheat breeding programme is for.
      - group: TRIAL
        task: Read the trial ground
        title: Why the same line is sown four times
        place: Field Laboratory
        scene: "Meera Quiroga has the plot map on the wall: 240 plots, with each line appearing four times across four blocks. The order is randomised, and the north end of the field is visibly wetter than the south."
        assumes:
          - the same crop grows differently in different parts of a field
        takeaway: A field is not uniform, so a single plot measures the plot as much as the line in it.
        format: CHOICE
        question: What does sowing each line in four randomised plots buy?
        why: A field varies in drainage, soil depth, compaction and shelter. Sow a line once and its yield contains both genotype and the conditions of that plot. Replicating the line in several blocks spreads it across different ground. Randomising positions prevents the researcher’s habits from deciding which line receives favourable places. Differences among replicate plots estimate environmental variation. That variation becomes part of the uncertainty when lines are compared. Replication therefore improves the genetic comparison rather than the measurement of one plot.
        choices:
          - A comparison that separates line performance from differences among pieces of ground
          - Four independent seed increases that protect next season's planting stock
          - Protection against one local weather event wiping out the whole trial
          - A more precise yield measurement from each individual plot in the block
        answer: A comparison that separates line performance from differences among pieces of ground
        rebuttals:
          - A yield trial is harvested for comparison; these replicates are not four separate seed-increase populations.
          - Weather acts across the site, so four nearby plots do not provide four independent seasons.
          - Each plot is measured the same way. Replication improves the comparison by estimating environmental variation.
  # ---------------------------------------------------------------- day 2
  - title: What the generation tells you
    objective: Read the second generation of last year's cross, and check it against a marker.
    briefing: Four hundred plants in the warm bay, and a ratio to count.
    stake: >-
      Tuesday. The F2 of Volpe's 2024 cross is in the warm bay — four hundred plants, and the first
      generation of any cross where the parents' alleles come apart and show themselves. Hana
      Nakagawa has run a marker on the same plants and has a disagreement to explain: eleven of them
      score as carrying the resistance allele and do not look it. Osman Toft, meanwhile, wants
      somebody to explain to the trainees where the grain in his drying hall came from. Today you
      count what the generation is telling you, decide what the marker mismatch means, and follow
      the carbon.
    takeaway: A ratio is evidence about what the parents carried, not a decoration on a data sheet.
    stops:
      - group: CROSS
        task: Read what the second generation shows
        title: Counting a generation
        place: Crossing Hall
        scene: |-
          Four hundred F2 plants, and 306 of them show the resistant reaction while 94 do not. Bengtsson asks what that number is supposed to be, and whether it is close enough.
        assumes:
          - a plant carries two copies of each gene and passes on one
        takeaway: The proportions in a whole generation carry information that no single plant in it does.
        format: CHOICE
        question: What do 306 resistant and 94 susceptible plants tell you about this resistance?
        answerText: "The counts fit a single dominant resistance locus: about 300:100 is expected, while a 15:1 two-gene model would predict about 375:25."
        why: F1 plants carry one resistance allele and one susceptible allele. Meiosis separates those alleles, so two heterozygous parents give a 3:1 phenotype expectation when resistance is dominant. In 400 offspring that is 300 resistant and 100 susceptible. The observed 306 and 94 are close. Two independently assorting genes where either dominant allele gives resistance predict 15:1, or 375 resistant and 25 susceptible. The counts therefore support one dominant locus much better than the two-locus alternative.
        choices:
          - One gene is involved and the resistant allele is dominant
          - Two genes are involved and either one confers resistance
          - The resistance is partly environmental in the glasshouse
          - The marker used to select the parents was wrong
        answer: One gene is involved and the resistant allele is dominant
        rebuttals:
          - Two genes acting either-way give about one susceptible in sixteen, not one in four.
          - The screening bay is inoculated deliberately, so escape is possible and would not give a clean ratio.
          - A wrong marker in the parents would break the ratio rather than produce a textbook one.
      - group: LAB
        task: Fit the marker disagreement with recombination and assay error, then use PCR on the resistance gene itself to separate them.
        title: One disagreement, two possible causes
        place: Molecular Laboratory
        scene: Nakagawa has 400 F2 plants scored by a linked PCR marker and by resistance. Eleven carry the marker but fail the resistance test. The PCR controls and gel bands look clean; the marker lies about four centimorgans from the gene.
        assumes:
          - PCR uses primers to amplify a chosen DNA region
          - gel electrophoresis separates DNA fragments by size
          - a nearby marker can be separated from a gene by crossing over
        takeaway: PCR can identify a DNA sequence, but a linked DNA marker can still separate from the gene it predicts.
        format: DEGENERACY
        question: Which combinations can explain the first disagreement rate, and which one survives the direct-gene PCR check?
        degeneracy:
          hint: Use the first panel to find more than one pair that fits. Then open the PCR check aimed inside the resistance gene and keep only combinations that fit both measurements.
          controls:
            - id: recombination
              label: Recombination fraction
              min: 0
              max: 0.08
              step: 0.01
              unit: fraction
            - id: marker_error
              label: Marker-assay error fraction
              min: 0
              max: 0.08
              step: 0.01
              unit: fraction
          observable:
            label: Marker–phenotype disagreement, 11 of 400 in this generation
          locus:
            - a: 0
              b: 0.04
            - a: 0.01
              b: 0.03
            - a: 0.02
              b: 0.02
            - a: 0.03
              b: 0.01
            - a: 0.04
              b: 0
          second:
            label: PCR aimed inside the resistance gene itself, on the eleven discordant plants
            apply: Run the direct-gene assay
            locus:
              - a: 0.02
                b: 0
              - a: 0.04
                b: 0
              - a: 0.06
                b: 0
          truth:
            a: 0.04
            b: 0
          tolerance:
            a: 0.005
            b: 0.005
          commit: Report it
        answerText: The first result permits several mixes of recombination and marker error. Direct-gene PCR removes the assay-error explanation, leaving linkage and about four per cent recombination.
        why: PCR copies a chosen DNA region through repeated denaturation, primer annealing, and extension. Gel electrophoresis can then separate the resulting DNA fragments by size. Here that tool reads a marker near the resistance gene, not the gene itself. Marker–trait disagreement can therefore come from recombination or assay error. One disagreement rate cannot separate those causes. A second PCR assay aimed inside the resistance gene adds independent evidence. When it confirms the gene call, linkage and recombination remain.
      - group: DRY
        task: Say where the mass in the harvest came from
        title: Where a tonne of grain comes from
        place: Drying & Processing Hall
        scene: |-
          Toft has eleven tonnes from one field on the weighbridge slip and a trainee who has just said the crop got it from the soil. He would like that answered properly before it goes any further.
        assumes:
          - plants build sugars from carbon dioxide and water using light
        takeaway: A harvest weighs what it weighs because of something that was not there when it started.
        format: CHOICE
        question: Where does almost all the dry weight of that grain come from?
        why: Most dry crop mass is carbohydrate, and its carbon entered the leaf as carbon dioxide. Photosynthesis uses light energy and water to fix that carbon into sugars. The plant then builds grain, stems and roots from those products. Water is essential, but most water entering the roots later leaves as vapour. Mineral nutrients such as nitrogen and phosphorus control how much tissue can be built. They are essential to growth while contributing only a small fraction of the final dry mass.
        choices:
          - Carbon dioxide taken from the air through the leaves
          - Minerals taken up from the soil by the roots as the plant grows
          - Water taken up from the soil by the roots
          - Nitrogen fertiliser applied in the spring
        answer: Carbon dioxide taken from the air through the leaves
        rebuttals:
          - Minerals are essential and make up a few per cent of dry matter at most.
          - Water is most of a living plant and nearly all of it is gone by the time grain is dry.
          - Nitrogen changes how much the crop can build; the mass it contributes is small.
  # ---------------------------------------------------------------- day 3
  - title: What a collection is made of
    objective: Count what the vault holds at the level that actually matters.
    briefing: Not varieties. Frequencies.
    stake: >-
      Wednesday. Tomas Ivanescu has genotyped a sample from one landrace accession — the one Idris
      Fenn's grandfather gave Wellmere in 1994 — and has put the numbers on the board rather than a
      description. Sylvie Pirelli has found that two accession numbers point at the same collection
      site, which may mean one of them is a duplicate taking a regeneration slot. Today you learn
      what a population is made of, what the numbers would look like if nothing were acting on it,
      and how many plants a grow-out actually needs.
    takeaway: A population is a set of frequencies, and everything the vault protects is in those numbers.
    stops:
      - group: POP
        task: Work out what the sample says about the population
        title: Frequencies, not plants
        place: Genetic Resources Office
        scene: Ivanescu has 100 plants from the 1994 accession scored at one locus. Thirty-six are AA, forty-eight are Aa and sixteen are aa. He asks for the allele frequency, then points to Hardy–Weinberg as the comparison model.
        assumes:
          - a diploid plant carries two copies of the locus
          - Hardy–Weinberg is a null model that predicts genotype frequencies from allele frequencies
        takeaway: A frequency describes the population; a genotype describes one plant, and they answer different questions.
        format: BALLPARK
        question: Estimate the frequency of the tall allele in this accession.
        answerText: 0.6 for the tall allele, and 0.4 for the short one.
        why: One hundred diploid plants carry 200 allele copies. The 36 AA plants contribute 72 A copies, and the 48 heterozygotes contribute 48 more. That gives p = 120/200 = 0.60 and q = 0.40. Hardy–Weinberg predicts p² = 0.36, 2pq = 0.48 and q² = 0.16. Those values exactly match the observed genotype fractions here. This gives a clean null model before drift, selection, migration, non-random mating or a bottleneck changes the population.
        estimate:
          prompt: One hundred plants have genotypes 36 AA, 48 Aa and 16 aa. Each plant carries two copies of the locus.
          question: Choose the tall-allele copies contributed by AA and Aa plants, and the total allele copies.
          labels:
            - 72  (A copies in the 36 AA plants)
            - 48  (A copies in the 48 Aa plants)
            - 200  (all allele copies in 100 plants)
            - 100  (plants sampled)
            - 16  (aa plants)
          values: [72, 48, 200, 100, 16]
          slots: 3
          template: ({0} + {1}) ÷ {2}
          formula: (a+b)/c
          correct: [0, 1, 2]
          target: 0.6
          tolerance: 0.05
          units: frequency of the tall allele
          solution: (72 + 48) ÷ 200 = 0.60; q = 0.40; p² = 0.36, 2pq = 0.48, q² = 0.16.
          explanation: p = 0.60 and q = 0.40. The Hardy–Weinberg expectations are 0.36, 0.48 and 0.16, exactly matching this sample's genotype fractions.
          givens:
            - 36 AA, 48 Aa and 16 aa plants
            - 100 diploid plants means 200 allele copies
          relationship: p = (2AA + Aa) ÷ 2N. Then q = 1 − p, and Hardy–Weinberg predicts p², 2pq and q².
      - group: VAULT
        task: Decide how many plants a grow-out needs
        title: How many plants make a population
        place: Seed Vault
        scene: |-
          Mbaye can regenerate the 1994 accession from whatever number of plants the ground allows. Volpe points out that thirty plants would free half a plot. Ivanescu has gone very quiet.
        assumes:
          - each generation's alleles are a sample of the last generation's
        takeaway: A grow-out is a sample, and a small sample loses whatever was rare in what it came from.
        format: CHOICE
        question: What does regenerating from thirty plants instead of two hundred cost?
        why: Every regeneration samples alleles from the population that came before it. Rare variants are easiest to miss because few plants carry them. If an observable type occurs in only a few plants, a small grow-out can contain none of those plants by chance. Once the allele is absent from every contributor, careful storage cannot restore it. The resulting seed may still germinate well and look normal. That is why a genetic bottleneck can damage a collection without leaving an obvious sign in routine viability tests.
        choices:
          - The rare alleles, which drop out by chance alone
          - The germination rate of the resulting seed
          - The accuracy of the passport record
          - The purity of the accession, through cross-pollination
        answer: The rare alleles, which drop out by chance alone
        rebuttals:
          - Seed from thirty well-grown plants germinates as well as seed from three hundred.
          - The passport record describes where the accession came from and is unaffected by how it is grown.
          - Cross-pollination is a separate risk, handled by isolation distance and by bagging.
      - group: TRIAL
        task: Hold the wheat line fixed, change one field variable at a time, then reverse the change.
        title: Move the line, not the story
        place: Field Laboratory
        scene: Quiroga has three microplot positions across the slope and enough seed from two numbered lines for a quick repeat. The trainee’s strip layout put each line in only one place. Yield scatter from repeated microplots is already known.
        assumes:
          - field position can change crop yield
          - a causal comparison changes one candidate cause while holding the others fixed
        takeaway: When genotype and field position always change together, their effects are confounded; a control test separates them by changing one at a time.
        format: CONTROL
        question: Which variable moves yield by more than the repeat scatter and then returns when you restore it?
        control:
          hint: Start from the baseline. Change one setup variable, run the microplot, and restore the original setting before naming a cause.
          noise: 0.15
          baseline: 7
          observable:
            label: Reading
            unit: t/ha
          response: 0.5999999999999996
          truth: strip
          variables:
            - id: line
              label: Wheat line
            - id: strip
              label: Field position
            - id: density
              label: Sowing density
        answerText: Field position is the large effect in this test. Moving the same line from north to south changes yield by 1.0 t/ha, and restoring the north plot restores the original yield.
        why: A strip design changes genotype and ground together, so either can explain the yield difference. The control run holds the line and sowing density fixed while moving only the plot position. That change shifts yield far beyond the repeat scatter. Restoring the original position restores the reading. Changing the line on the same ground produces only a small shift in this authored test. The result shows why blocks and randomisation are needed before genotype can be credited for a field difference.
  # ---------------------------------------------------------------- day 4
  - title: The season you do not get back
    objective: Weigh a release against a delay, with a dry summer forecast.
    briefing: WM-712 is ready. The ground it needs is the ground the vault wants.
    stake: >-
      Thursday, and the sowing plan is due tomorrow. Volpe's line WM-712 has been through four
      seasons of trials and yields eleven per cent over the standard in dry years. Releasing it
      needs the whole west ground for seed increase, which is the ground Qureshi's sixty overdue
      accessions would have used. The forecast for the summer is dry, the merchant wants a decision,
      and both of them are right about something. Today you work out what a season's delay actually
      costs, what the trial data does and does not support, and what the crop gets out of a wet
      spring that a dry one never gives it.
    takeaway: A delay is not neutral, and neither is a release; the question is which cost is recoverable.
    stops:
      - group: CROSS
        task: Say what deferring the release costs
        title: What a season costs
        place: Crossing Hall
        scene: |-
          Volpe has the pipeline on the board: cross to release is seven years, and every stage behind WM-712 moves back with it. Qureshi asks, reasonably, what a year of a wheat variety is worth.
        assumes:
          - a breeding programme moves one generation at a time
        takeaway: The cost of holding something back is rarely paid by the thing being held back.
        format: CHOICE
        question: Why does a one-season deferral cost more than one season?
        why: "A breeding programme is a queue that shares seasons, ground and staff. Holding WM-712 for one year also delays its seed increase, the trial that would have used that ground, and the crosses waiting behind it. The cost therefore lands on lines that were never part of the argument. That is the strongest version of Volpe’s case: delay has opportunity costs throughout the pipeline. It does not prove release is right, but it makes the price of waiting explicit."
        choices:
          - Every line behind it in the pipeline waits too
          - The line loses its advantage as the standard improves
          - Seed held for a year germinates less well
          - The trial data expires and has to be repeated
        answer: Every line behind it in the pipeline waits too
        rebuttals:
          - The standard does improve, slowly, and it is not what makes a single season expensive.
          - A year in a cold store costs a well-dried sample very little germination.
          - Trial data does not expire; it becomes one more year in a series.
      - group: TRIAL
        task: Say what four seasons of trials support
        title: What the trial can actually claim
        place: Field Laboratory
        scene: |-
          Four seasons, one site, four replicates each. WM-712 is ahead by eleven per cent in the two dry years and by two per cent in the wet ones. The merchant's leaflet says "eleven per cent higher yielding".
        assumes:
          - a trial measures lines under the conditions the trial happened in
        takeaway: A number from a trial carries the conditions it was measured under, or it is a different claim.
        format: CHOICE
        question: What does this trial support saying about WM-712?
        answerText: "The defensible claim is site- and season-specific: WM-712's advantage was much larger in the two dry years than in the wet years."
        why: "The eleven-per-cent advantage belongs to two dry years at one site. In wet years the advantage is only two per cent. Removing those conditions turns a measured result into a broader claim the data have not tested. The useful conclusion therefore carries its environment with it: WM-712 performed especially well in dry seasons on this ground. That result can motivate trials in other dry places, but it cannot substitute for them. Genotype-by-environment effects make performance conditional rather than universal."
        choices:
          - At this site, its advantage is much larger in dry seasons than in wet ones
          - Across these four seasons, it has a consistent eleven-per-cent advantage at this site
          - Its dry-year result shows that it is broadly adapted to drought across regions
          - It should outyield the standard whenever seasonal rainfall falls below average
        answer: At this site, its advantage is much larger in dry seasons than in wet ones
        rebuttals:
          - The wet-year advantage is only two per cent, so eleven per cent is not a season-independent effect.
          - One site can motivate a drought-adaptation hypothesis, but it cannot establish performance across regions.
          - The trial separates dry from wet years here; it does not define a rainfall threshold that guarantees the same response.
      - group: DRY
        task: Say why a dry summer costs yield
        title: What the crop cannot do without water
        place: Drying & Processing Hall
        scene: |-
          Toft has eleven years of yield against summer rainfall and a straight-ish line through it. A trainee asks why a plant that is mostly built from air minds a dry summer at all.
        assumes:
          - plants take in carbon dioxide through pores in their leaves
        takeaway: The opening a leaf takes carbon in through is the opening it loses water through.
        format: CHOICE
        question: Why does drought cut yield even though the mass comes from the air?
        why: "Leaves take carbon dioxide in through stomata, and water vapour leaves through the same pores. A crop can lose far more water through transpiration than it uses directly in photosynthesis. When soil dries, stomata close to limit water loss. That also lowers carbon dioxide entry and slows carbon fixation. Drought can create other stresses too, including nutrient and heat effects. The central trade-off here is gas exchange: conserving water restricts the carbon supply needed to keep building biomass and grain."
        choices:
          - Closing the pores to save water also shuts out carbon dioxide
          - Roots cannot take up the minerals the grain is built from
          - The plant cannot cool itself and its enzymes are destroyed
          - Photosynthesis requires liquid water as a raw material in quantity
        answer: Closing the pores to save water also shuts out carbon dioxide
        rebuttals:
          - Mineral uptake does suffer in dry soil and is not the main route from drought to lost yield.
          - Heat damage to enzymes is a separate stress that often arrives with drought.
          - The water split in photosynthesis is a small fraction of what the crop transpires.
  # ---------------------------------------------------------------- day 5
  - title: What comes with what you wanted
    objective: Find out what else the resistance gene is dragging behind it.
    briefing: The resistant lines are shorter, and nobody bred them that way.
    stake: >-
      Friday, and the plan is signed: WM-712 goes to seed increase, forty of the sixty accessions
      get regenerated, and Qureshi has said what she thinks of that in writing. In the glasshouse
      the backcross lines carrying the resistance gene are all noticeably shorter than their
      siblings, which nobody selected for and nobody wants. Nakagawa has the marker data and a
      question about whether the marker still means anything two populations later. Today you work
      out what is travelling with the gene, whether the marker can be trusted here, and what to do
      about both.
    takeaway: Genes near each other are inherited together, which is what makes markers work and what makes them expensive.
    stops:
      - group: CROSS
        task: Explain the short plants
        title: What came with the gene
        place: Crossing Hall
        scene: Every backcross line carrying the resistance allele is twelve to fifteen centimetres shorter than its susceptible siblings. The donor parent was a short landrace, while the recurrent elite parent is tall. Volpe wants to know what travelled with the target gene.
        assumes:
          - genes sit at fixed places on chromosomes
        takeaway: A chromosome is inherited in stretches, so a wanted gene arrives with its neighbours.
        format: CHOICE
        question: Why are the resistant backcross lines shorter?
        why: Backcrossing recovers most of the recurrent parent’s genome while keeping the target resistance allele. The chromosome around that allele is different. Nearby donor genes tend to travel with the target because recombination is less likely across a short interval. That linked donor segment can carry unwanted traits such as short stature. Breaking the association requires a crossover between the target and the unwanted neighbour. Breeders therefore grow many offspring and screen for the rare recombinant that keeps resistance while losing the linked donor trait.
        choices:
          - They carry the donor's neighbouring genes along with the resistance
          - The resistance response itself costs the plant growth
          - Backcrossing reduces vigour with each generation
          - The short plants were selected for unintentionally in the glasshouse
        answer: They carry the donor's neighbouring genes along with the resistance
        rebuttals:
          - A defence response has a real cost and it does not produce a consistent fifteen centimetres.
          - Backcrossing recovers the recurrent parent and does not reduce vigour by itself.
          - Selection in the bay was for the marker, and height was not scored at all.
      - group: LAB
        task: Test whether the marker still works here
        title: A marker fitted where it worked
        place: Molecular Laboratory
        scene: |-
          The marker was mapped in the original population and has picked plants correctly for three seasons. Nakagawa has a new population from a different donor and a hundred plants scored both ways.
        assumes:
          - a marker predicts a trait by being close to the gene, in that population
        takeaway: A rule fitted on one population has to be scored on a population it has never seen.
        format: HOLDOUT
        question: Set the marker score above which a seedling is kept, on the plants the marker was mapped in — then freeze it and score it on a population it has never seen. What does it get?
        answerText: About 94 per cent, from a cut-off near 48. The 63 that scores 99 on the mapping plants drops to 79 on the new cross — twenty points of it was that one population's noise.
        why: A cut-off chosen on one population partly fits that population’s accidents. Those accidents do not have to repeat. The broad high-scoring shelf is useful because it persists when the rule is frozen and applied to the new donor cross. The sharp optimum at 63 does not persist; it was overfit to the mapping plants. A holdout population separates a marker rule that generalises from one that merely describes the sample used to choose it.
        holdout:
          hint: The calibration curve is the population this marker was built from. The other one is next year's.
          axis:
            label: Marker score cut-off
            unit: ""
            min: 20
            max: 90
            step: 1
          unit: "%"
          fitLabel: Mapping population, 240 plants
          testLabel: A new donor cross, never seen
          pass: 92
          start: 22
          fit:
            - at: 20
              value: 74
            - at: 30
              value: 86
            - at: 40
              value: 93
            - at: 48
              value: 95
            - at: 56
              value: 95
            - at: 63
              value: 99
            - at: 70
              value: 94
            - at: 80
              value: 88
            - at: 90
              value: 71
          test:
            - at: 20
              value: 72
            - at: 30
              value: 84
            - at: 40
              value: 92
            - at: 48
              value: 94
            - at: 56
              value: 93
            - at: 63
              value: 79
            - at: 70
              value: 88
            - at: 80
              value: 84
            - at: 90
              value: 69
          freeze: Freeze the cut-off
          commit: Report what it scores on the new cross
      - group: DRY
        task: Say what the shorter plants do to the harvest
        title: Short is not simply worse
        place: Drying & Processing Hall
        scene: |-
          Toft points out that shorter wheats were the whole point of the 1960s: less stem, more grain, and they stand up in the rain. Volpe still does not want fifteen centimetres she did not ask for.
        assumes:
          - a plant divides what it builds between stem, leaf and grain
        takeaway: What matters is the share of what the plant built that ends up in the grain.
        format: CHOICE
        question: Why can a shorter wheat outyield a taller one?
        why: A shorter wheat can put a larger share of its seasonal dry matter into grain instead of stem. That fraction is the harvest index. Shorter stems also reduce lodging, so more grain reaches the combine after wind and rain. This logic helped drive the success of semi-dwarf wheats. It does not mean every short plant is better. Volpe still has to learn whether this donor-linked shortness improves allocation and standing ability or simply reduces useful growth.
        choices:
          - More of what it builds goes into grain instead of stem
          - It photosynthesises faster than a tall plant
          - It uses less water because there is less of it
          - It escapes disease by holding its leaves clear of the soil
        answer: More of what it builds goes into grain instead of stem
        rebuttals:
          - Photosynthetic rate per unit leaf is not what height changes.
          - Water use tracks leaf area and season length rather than stem height.
          - Lifting leaves away from soil-borne spores helps in some diseases and is not the yield story.
  # ---------------------------------------------------------------- day 6
  - title: How many is enough
    objective: Put a number on what a regeneration needs, and on what the vault is losing.
    briefing: Forty accessions, one field, and a number nobody wants to hear.
    stake: >-
      Monday of the second week, and the regeneration list has to be cut from sixty to forty.
      Ivanescu has spent the weekend on the arithmetic of how many plants each grow-out needs, and
      it is not the number in the manual. Mbaye has eleven years of germination tests on one
      accession and a curve that is about to cross his line. Quiroga wants to know why last year's
      trial found a difference in plant height that this year's cannot see. Today you size the
      samples, read the curve, and work out which of last year's results were the ground talking.
    takeaway: Every number here is about a population, and populations do not behave like the plants in them.
    stops:
      - group: POP
        task: Estimate the effective size of this unequal-parent regeneration
        title: Not the number of plants
        place: Genetic Resources Office
        scene: Last year’s regeneration of a dioecious conservation accession used 120 plants. Eighteen pollen donors and 102 seed parents contributed to the harvested seed. Ivanescu wants the effective size before the next regeneration plan is approved.
        assumes:
          - dioecious means pollen and seed are produced by separate plants
          - unequal parental contributions reduce effective population size
        takeaway: A regeneration can contain many plants yet behave genetically like a much smaller population when parental contributions are unbalanced.
        format: BALLPARK
        question: What effective population size did 18 pollen donors and 102 seed parents produce?
        answerText: About 61 effective breeding individuals, even though 120 plants stood in the plot.
        why: Effective population size asks how many equally contributing breeders would produce similar genetic drift. For separate pollen and seed parents, Ne ≈ 4NmNf/(Nm+Nf). Here 18 pollen donors and 102 seed parents give about 61, far below the 120 plants standing in the plot. The imbalance means transmitted alleles had fewer independent routes through the pollen side. Rare variants therefore faced a stronger sampling bottleneck than the headcount suggests. This sex-ratio formula applies to this separate-sex accession, not ordinary selfing wheat.
        estimate:
          prompt: A separate-sex accession had 18 pollen donors and 102 seed parents. Use Ne = 4NmNf/(Nm+Nf).
          question: Choose the constant and the two contributing-parent counts.
          labels:
            - 4  (the sex-ratio constant)
            - 18  (pollen donors)
            - 102  (seed parents)
            - 120  (plants standing in the plot)
            - 60  (half the plot)
          values: [4, 18, 102, 120, 60]
          slots: 3
          template: "{0} × {1} × {2} ÷ ({1} + {2})"
          formula: a*b*c/(b+c)
          correct: [0, 1, 2]
          target: 61.2
          tolerance: 6
          units: effective plants
          solution: 4 × 18 × 102 ÷ (18 + 102) = 61.2.
          explanation: The imbalance makes the population behave genetically like about 61 equal contributors, not 120.
          givens:
            - 18 pollen donors
            - 102 seed parents
          relationship: Ne = 4NmNf ÷ (Nm + Nf), where Nm and Nf are the contributing pollen and seed parents.
      - group: VAULT
        task: Set the field-reservation and grow-out thresholds before replaying the viability record.
        title: Write the viability rule before it falls
        place: Seed Vault
        scene: Mbaye has eleven germination results from the same accession, falling from 98 to 85 per cent. The current regeneration floor is 85. Booking field space takes several planning updates, and starting the grow-out takes one more.
        assumes:
          - germination percentage measures the fraction of seeds that can produce seedlings
          - regeneration requires field space before seed can be multiplied
        takeaway: A biological threshold must fire early enough for the action it triggers to arrive before the measured state crosses the limit.
        format: TRIGGER
        question: Where should each action trigger so the regeneration is ready before viability falls below the floor?
        trigger:
          hint: Set both rules before release. Reserving field space takes three updates to take effect; starting the grow-out takes one.
          direction: falling
          scale:
            min: 80
            max: 100
            unit: "% germination"
          floor: 85
          conditions:
            - id: reserve
              label: Reserve regeneration field
              leadHours: 3
            - id: start
              label: Start regeneration grow-out
              leadHours: 1
          stream:
            - step: 0
              value: 98
              hoursLeft: 11
              at: update 0
              update: 98 % germination
            - step: 1
              value: 97
              hoursLeft: 10
              at: update 1
              update: 97 % germination
            - step: 2
              value: 96
              hoursLeft: 9
              at: update 2
              update: 96 % germination
            - step: 3
              value: 94
              hoursLeft: 8
              at: update 3
              update: 94 % germination
            - step: 4
              value: 93
              hoursLeft: 7
              at: update 4
              update: 93 % germination
            - step: 5
              value: 91
              hoursLeft: 6
              at: update 5
              update: 91 % germination
            - step: 6
              value: 90
              hoursLeft: 5
              at: update 6
              update: 90 % germination
            - step: 7
              value: 88
              hoursLeft: 4
              at: update 7
              update: 88 % germination
            - step: 8
              value: 87
              hoursLeft: 3
              at: update 8
              update: 87 % germination
            - step: 9
              value: 86
              hoursLeft: 2
              at: update 9
              update: 86 % germination
            - step: 10
              value: 85
              hoursLeft: 1
              at: update 10
              update: 85 % germination
            - step: 11
              value: 84
              hoursLeft: 0
              at: update 11
              update: 84 % germination
        answerText: Reserve the regeneration field by 90% viability and start the grow-out by 86% on this authored stream. Waiting for 85% is too late once lead time is included.
        why: The viability floor is not the moment to begin planning if the biological response has lead time. A field slot has to be reserved before a grow-out can start. The grow-out itself also begins after the decision is made. Writing both thresholds before the record is replayed prevents hindsight from becoming policy. In this authored stream, reserving at 90 and starting at 86 leaves enough updates for both actions. Waiting until 85 to start acts after the floor is crossed.
      - group: TRIAL
        task: Say why last year's height difference has gone
        title: A difference that was the field
        place: Field Laboratory
        scene: Last season two pure lines differed by nine centimetres in height, with a statistically clear separation. This season the same lines were randomised onto different plots and no longer differ. The seed stocks themselves have not changed.
        assumes:
          - the same line grown in two places can give two different results
        takeaway: A result that does not survive being grown again somewhere else was probably about the somewhere.
        format: CHOICE
        question: What is the most likely explanation?
        why: A one-season comparison contains genetics plus whatever was unusual about the plots each line received. Randomisation makes systematic favouring less likely, but one realised layout can still be lucky. A second season on different plots asks whether the difference follows the seed. Here the nine-centimetre gap disappears. That makes last year’s estimate look partly environmental rather than a stable genetic effect. Replication across plots and seasons is how a breeding programme separates a line from a flattering piece of ground.
        choices:
          - Last year's difference was partly the plots those lines landed in
          - The lines have changed genetically between one season and the next
          - This year's measurements were taken less carefully
          - Height is not a heritable trait in wheat
        answer: Last year's difference was partly the plots those lines landed in
        rebuttals:
          - Pure lines do not change appreciably between two seasons.
          - Careless measurement adds scatter rather than removing a difference of nine centimetres.
          - Height is strongly heritable, which is exactly why the disappearance is worth explaining.
  # ---------------------------------------------------------------- day 7
  - title: Four hundred kilometres away
    objective: Decide what to do about a disease that has not arrived.
    briefing: A new race of the rust, reported on the other side of the border.
    stake: >-
      Tuesday. The regional bulletin reports a new race of stem rust four hundred kilometres east,
      on a variety that carries the same resistance gene as WM-712 — and it is not stopping it.
      Nakagawa can screen for a second gene in the collection, Ivanescu can tell her where to look,
      and neither of them can do it in one season without giving something up. The line is already
      in seed increase. Today you decide what is worth screening for, write the rule that says when
      Wellmere acts, and work out what the crop's own defences cost it.
    takeaway: A resistance that rests on one gene is a resistance the pathogen only has to solve once.
    stops:
      - group: LAB
        task: Trace how a DNA change can become a resistance-breaking phenotype
        title: One base, one broken lock
        place: Molecular Laboratory
        scene: WM-712 is failing east of the border. Nakagawa has sequenced a rust gene from older and newer isolates. The newer isolate differs by one nucleotide in a coding region, while the rest of that gene is unchanged.
        assumes:
          - genes contain DNA sequences that can be transcribed into mRNA
          - ribosomes translate mRNA codons into amino acids
        takeaway: A mutation matters through what it changes in RNA, protein, and phenotype; selection then acts on that phenotype.
        format: CHOICE
        question: How can one DNA substitution change whether WM-712 recognizes the pathogen?
        answerText: The DNA substitution can change an mRNA codon and therefore an amino acid in the pathogen protein. If that changes recognition, the resulting phenotype can spread by natural selection.
        why: A point mutation replaces one nucleotide in DNA. When that region is transcribed, the change can alter an mRNA codon. During translation, a changed codon may place a different amino acid in the pathogen protein. That can alter the protein’s shape or function, although some substitutions are silent. If the altered protein escapes recognition by WM-712, that rust variant can reproduce on resistant plants. Selection then raises the frequency of the resistance-breaking variant.
        choices:
          - The substitution can alter an mRNA codon, changing the protein that the wheat recognizes
          - The substitution directly rewrites the wheat resistance protein during infection
          - The changed mRNA is inherited even though the pathogen DNA stays unchanged
          - Every single-base substitution stops translation before the protein is completed
        answer: The substitution can alter an mRNA codon, changing the protein that the wheat recognizes
        rebuttals:
          - The pathogen mutation changes the pathogen's information; it does not rewrite the wheat genome.
          - Heritable sequence information resides in DNA. The mRNA is a temporary transcript of it.
          - Some substitutions are silent, and others change one amino acid without creating a stop codon.
      - group: POP
        task: Say where to look for a second gene
        title: Where an unused allele lives
        place: Genetic Resources Office
        scene: |-
          Ivanescu has to pick fifty accessions to screen out of 41,000. On the board: modern varieties, the breeding programme's own parents, and the landraces from districts where rust has always been present.
        assumes:
          - populations are shaped by what has been selecting them
        takeaway: Where a disease has always been, the plants that stayed are the ones that could.
        format: CHOICE
        question: Which material is most likely to carry a different resistance gene?
        why: Selection leaves a signature in the populations that experienced it. A landrace grown where rust arrives often has repeatedly faced that pathogen. Plants with useful resistance can then contribute more seed, raising the frequencies of protective alleles. Modern breeding parents are more likely to share ancestry with WM-712 and may carry the same resistance source. Landraces from endemic regions therefore offer a better search space for different resistance. They are not guaranteed to contain it, so the next step is still screening rather than assumption.
        choices:
          - Landraces from districts where the rust is endemic
          - The programme's own recent parents
          - Modern varieties from the driest districts
          - Accessions collected most recently, from anywhere
        answer: Landraces from districts where the rust is endemic
        rebuttals:
          - Recent parents share ancestry with the line that is failing, so they mostly share its gene.
          - Rust needs moisture; dry districts select for something else entirely.
          - Collection date says nothing about what selected the population before it was collected.
      - group: DRY
        task: Close a simplified 100-unit resource ledger for the resistant line and identify the unlisted allocation.
        title: Where the missing two per cent went
        place: Drying & Processing Hall
        scene: Toft has paired no-rust plots of near-identical lines with and without the resistance gene. The resistant line yields about two per cent less. Nakagawa also detects the defence transcript in clean leaves before infection.
        assumes:
          - transcription produces mRNA from DNA
          - translation uses mRNA to make protein
          - gene expression can be constitutive or inducible
        takeaway: Gene regulation controls when defence proteins are made, and expression before infection can carry a standing resource cost.
        format: BALANCE
        question: Which hidden allocation closes the resistant line's resource budget and matches the yield penalty?
        balance:
          hint: Count only terms expressed in the same 100-unit seasonal resource budget. The visible allocations do not quite close the total.
          total:
            amount: 100
            unit: resource units
            label: Seasonal assimilated-resource budget
          streams:
            - id: grain
              label: Grain allocation
              value: 48
              display: 48 units
            - id: shoot
              label: Leaves and stems
              value: 34
              display: 34 units
            - id: roots
              label: Roots and maintenance
              value: 16
              display: 16 units
            - id: defence
              label: Resistance-system maintenance
              value: 2
              display: 2 units
              hidden: true
          tolerance: 0.5
        answerText: The hidden two-unit allocation is defence. The resistance line is expressing the pathway even without rust, so some resources are committed before infection.
        why: Regulatory DNA and transcription factors control whether a gene is transcribed. Some genes are expressed continuously, while others are induced by a signal. Here the defence transcript is already present in clean leaves, so the plant is investing in that pathway before rust arrives. Translation turns the mRNA into protein, and maintaining that machinery uses part of the plant’s resource budget. The simplified ledger assigns the missing two units to defence, matching the observed yield penalty.
  # ---------------------------------------------------------------- day 8
  - title: What you asked for and what you got
    objective: Predict what one round of selection will actually deliver.
    briefing: The best twenty plots, and what their offspring will be like.
    stake: >-
      Wednesday. The trial is scored and Volpe wants to select the best twenty plots out of 240 to
      carry forward. Quiroga has the numbers for what that will actually produce, which is less than
      the twenty plots suggest and more than nothing. Bengtsson can give the programme an extra
      generation in the warm bay if the decision is made this week, and Toft has finally got the
      canopy data that explains why two of those twenty are good. Today you predict the gain from
      one round of selection, and decide what to do with an extra generation.
    takeaway: What a round of selection returns is the part of the difference that was inherited, and no more.
    stops:
      - group: TRIAL
        task: Predict the gain
        title: What one round returns
        place: Field Laboratory
        scene: The trial mean is 7.4 tonnes per hectare. The twenty plots Volpe wants to keep average 9.1. Quiroga estimates yield heritability on this ground at 0.3 and asks what gain should actually reach the next generation.
        assumes:
          - a plant's performance is part inheritance and part where it grew
        takeaway: Only the heritable share of an advantage is passed on, and for yield that share is small.
        format: BALLPARK
        question: Estimate the yield of the next generation from this selection.
        answerText: About 7.9 t/ha, a gain of roughly half a tonne rather than 1.7.
        why: The selected plots are above average for genetic and environmental reasons. The breeder’s equation keeps only the heritable share of that advantage. Here the selection differential is 9.1 − 7.4 = 1.7 tonnes per hectare. Multiplying by h² = 0.3 gives a response of 0.51. Adding that response to the original mean predicts about 7.9 tonnes per hectare next generation. The selected-plot mean of 9.1 is therefore not an inherited forecast; much of its advantage stays with the plots.
        estimate:
          prompt: Trial mean 7.4 t/ha, selected mean 9.1 t/ha, heritability 0.3. Predict the next-generation mean.
          question: Choose the original mean, selected mean and heritability.
          labels:
            - 7.4  (trial mean, t/ha)
            - 9.1  (selected mean, t/ha)
            - 0.3  (heritability)
            - 1.7  (selection differential, already calculated)
            - 240  (plots in the trial)
          values: [7.4, 9.1, 0.3, 1.7, 240]
          slots: 3
          template: "{0} + {2} × ({1} − {0})"
          formula: a+c*(b-a)
          correct: [0, 1, 2]
          target: 7.91
          tolerance: 0.15
          units: t/ha next generation
          solution: 7.4 + 0.3 × (9.1 − 7.4) = 7.91 t/ha.
          explanation: The selected plots are 1.7 t/ha above average, but only 30% of that differential is expected to appear in the next generation.
          givens:
            - Trial mean 7.4 t/ha and selected mean 9.1 t/ha
            - Heritability h² = 0.3
          relationship: R = h²S, where S = selected mean − population mean. Add R to the original mean.
      - group: CROSS
        task: Decide what the extra generation is for
        title: An extra generation in the bay
        place: Crossing Hall
        scene: Bengtsson can run one more generation over the winter in the warm bay. It is the only place at Wellmere where a generation costs three months instead of twelve, and there is bench room for one population.
        assumes:
          - a glasshouse can complete a generation out of season
        takeaway: A generation indoors is for advancing material, not for judging it.
        format: CHOICE
        question: What should the warm bay be used for this winter?
        answerText: Use the warm bay to advance the backcross. It buys another generation and another chance at the rare crossover without pretending the glasshouse can replace a field trial.
        why: The warm bay is valuable when calendar time is the main constraint. Breaking linkage drag needs more meioses and more opportunities for a rare crossover, so another generation directly advances that goal. Yield cannot be judged credibly under glass because the field environment is missing. Regenerating a landrace there would impose an unintended glasshouse selection. Seed multiplication mainly needs area, which the bay lacks. The scarce indoor generation therefore belongs to the backcross rather than to work that needs field conditions or space.
        choices:
          - Advancing the backcross that needs a rare crossover
          - Yield-testing the twenty selected lines early
          - Growing out the overdue landrace accession
          - Multiplying seed of WM-712 for the merchant
        answer: Advancing the backcross that needs a rare crossover
        rebuttals:
          - A yield figure from a glasshouse is measured under conditions no field ever offers.
          - Regenerating an accession under glass applies a selection nobody chose and cannot undo.
          - Multiplication is an area problem, and the bay is the smallest ground on the station.
      - group: DRY
        task: Say what explains two of the twenty
        title: Why those two did well
        place: Drying & Processing Hall
        scene: |-
          Two of the twenty selected plots reached full canopy eleven days before the rest and flowered four days earlier. Their yields are the highest in the trial and the season was dry after flowering.
        assumes:
          - a crop builds most of its grain from light captured after flowering
        takeaway: An early canopy captures light while there is still water to use it with.
        format: CHOICE
        question: Why did the early lines yield best in this season?
        why: Yield depends on how much light the crop intercepts, how efficiently it converts that energy, and how much biomass reaches grain. In this dry season, soil water became limiting after flowering. The lines that closed their canopies earlier captured more light while stomata could still stay open. Earlier flowering also shifted grain filling toward the wetter part of the season. These traits are therefore escape strategies for this environment. In a wet year their advantage could shrink or disappear.
        choices:
          - They captured light and set grain before the soil dried
          - Early flowering makes plants more efficient per leaf
          - They avoided the rust, which arrived late in the season
          - Early canopy closes weeds out and removes competition
        answer: They captured light and set grain before the soil dried
        rebuttals:
          - Efficiency per unit leaf is not what flowering date changes.
          - Rust arrived nowhere near this trial, and escape would show as health rather than yield.
          - Weed suppression is a genuine benefit of early cover and is not worth this much yield.
  # ---------------------------------------------------------------- day 9
  - title: The collection is not what the records say
    objective: Find out why the regenerated accessions no longer match their own passports.
    briefing: A genotyping run that was meant to be routine.
    stake: >-
      Thursday. Nakagawa ran a routine genotyping panel across ninety accessions to build a
      reference set, and a third of them do not match the passport data — same numbers, same
      records, different populations. Pirelli has checked the labelling twice and found nothing
      wrong with it. Qureshi has gone down to the vault and has not come back up. Today you work out
      what has actually happened to those accessions, whether the vault or the field is where it
      happened, and what it means for the fifty being screened for rust resistance.
    takeaway: A collection can be kept perfectly and still stop being the thing it was.
    stops:
      - group: POP
        task: Open the dependencies behind the genetic and viability results, keep the independent evidence, and name the shared source behind the shifts.
        title: Which evidence shares the grow-out
        place: Genetic Resources Office
        scene: "Thirty of ninety accessions no longer match their 1990s allele frequencies. Nakagawa has four evidence channels on the board: genetic comparisons, regeneration histories, germination results and the vault log. Independent shelf checks are clean."
        assumes:
          - a result can depend on earlier handling as well as on the current assay
          - independent evidence does not share the same critical source
        takeaway: Several results can agree because they share one history; independent evidence should be kept when the shared dependency is corrected.
        format: TRACE
        question: Which results inherit the repeated small-grow-out history, and which evidence remains independent of it?
        trace:
          hint: Open each result and inspect what it rests on. Name the source shared by the genetic shifts, but do not discard a channel whose evidence path never uses it.
          target: regen_history
          resources:
            - id: regen_history
              label: Recorded grow-out history
            - id: passport
              label: 1990s genotype and allele-frequency record
            - id: current_genotype
              label: Current genotype panel
            - id: archive_subsample
              label: Archived comparison subsample
            - id: germination
              label: Current germination assay
            - id: vault_log
              label: Twenty-eight-year temperature and storage log
          channels:
            - id: frequency
              label: Allele-frequency comparison
              reading: 18 of 30 loci have moved more than five percentage points from the 1994 record
              depends:
                - passport
                - current_genotype
                - regen_history
            - id: rare
              label: Rare-variant comparison
              reading: Nine alleles recorded in 1994 at under five per cent are absent from the current sample
              depends:
                - passport
                - current_genotype
                - regen_history
            - id: archive
              label: Archived-subsample comparison
              reading: The archived subsample matches the current panel, not the 1994 record
              depends:
                - archive_subsample
                - current_genotype
                - regen_history
            - id: viability
              label: Germination panel
              reading: Germination 91 per cent, and the store has held minus 18 for twenty-eight years
              depends:
                - germination
                - vault_log
          independent:
            - viability
          commit: Correct it
        answerText: The genetic channels share repeated small grow-outs. Keep the viability channel. It shows storage succeeded even while regeneration changed allele frequencies.
        why: "Three genetic comparisons depend on the same regeneration history, so their agreement is not three independent causes. The viability panel does not share that path. It rests on germination tests and the vault record, and it says the seed remained alive. Opening the dependencies therefore separates two claims: storage preserved viability, while repeated small grow-outs altered allele frequencies. Discarding the viability evidence would throw away an independent result. Ignoring the shared grow-out path would count one causal exposure several times."
      - group: LAB
        task: Say what this does to the rust screen
        title: What the screen may not find
        place: Molecular Laboratory
        scene: Nakagawa is screening fifty accessions for a second resistance gene. Twenty-two are on the drifted list, but their marker controls are clean. She wants to know what a negative result from those accessions is still allowed to mean.
        assumes:
          - an allele that is uncommon in a population may be missing from a small sample of it
        takeaway: A screen finds what is in front of it, and what is in front of it is what survived the last grow-out.
        format: CHOICE
        question: What does the drift mean for the screen?
        why: "Drift can remove an allele that was uncommon in the original population. A clean negative from a drifted accession therefore has two explanations: the allele was never present, or it was present and disappeared during regeneration. The marker cannot distinguish those histories. A positive remains useful because drift does not invent the target allele. The remedy is not a different marker. It is to test material that has avoided the bottleneck, or to compare with older archived material when that exists."
        choices:
          - A negative result on those accessions no longer proves absence
          - The screen will produce false positives on the drifted material
          - The screen has to be redesigned around different markers
          - Nothing, since resistance genes are under selection and are retained
        answer: A negative result on those accessions no longer proves absence
        rebuttals:
          - Drift removes alleles rather than inventing them, so positives are unaffected.
          - The markers work; what has changed is the population they are being run on.
          - Nothing in a vault selects for rust resistance, so there is no reason for it to be retained.
      - group: VAULT
        task: Say what the vault can still be trusted for
        title: What the store did right
        place: Seed Vault
        scene: Qureshi wants one sentence for the board that names the failed process rather than the room it happened near. The vault temperature log covers twenty-eight years without an excursion, and current germination remains strong in the affected packets.
        assumes:
          - a store preserves what it is given rather than improving it
        takeaway: Storage held what it was handed; the loss happened in the field, on the way back in.
        format: CHOICE
        question: What is the honest statement of what went wrong?
        answerText: The storage system preserved viable seed. Repeated small grow-outs changed allele frequencies by sampling too few contributors.
        why: The fix depends on naming the failed step precisely. The vault kept the stored seed cold and viable. The allele-frequency shifts instead track repeated regeneration, where a small set of parents stood in for a larger population. Calling this a storage failure would direct money toward freezers that already worked. Calling it a regeneration failure directs attention toward population size, contribution balance and records from the grow-out. The same packet can therefore be healthy seed and a poor genetic representation of the original accession.
        choices:
          - Storage preserved the seed, while repeated regeneration changed its allele frequencies
          - The old passport records are too coarse for any allele-frequency comparison
          - A long-term shift in the genotyping assay created the apparent differences
          - Low viability in storage repeatedly selected which genotypes survived
        answer: Storage preserved the seed, while repeated regeneration changed its allele frequencies
        rebuttals:
          - The historical records predict the less-regenerated accessions correctly, so their resolution is not the pattern.
          - Current controls and archived comparisons do not show an assay shift that follows regeneration count.
          - Affected packets still germinate well, and viability loss would track storage history rather than the number of grow-outs.
  # ---------------------------------------------------------------- day 10
  - title: What is left to work with
    objective: Rebuild the season's plan around material that has not been through a bottleneck.
    briefing: The vault is one copy. The other one is in a field forty miles away.
    stake: >-
      Friday. The finding is written up and the season has to be re-planned around it. Twenty-two of
      the fifty screening candidates are unreliable, the ground is already committed, and the one
      source of unbottlenecked material is Idris Fenn's four landraces, which have been grown every
      year on his own farm and selected by his own weather. Fenn is willing. Volpe points out, not
      unfairly, that none of this changes what is already in seed increase. Today you decide what
      the screen is run on, what regeneration looks like from now on, and what the field can absorb.
    takeaway: A collection kept in one place is one copy, however carefully it is kept.
    stops:
      - group: POP
        task: Say what on-farm material offers
        title: The other copy
        place: Genetic Resources Office
        scene: Fenn’s four landraces descend from populations sampled for Wellmere in 1994. His family has grown them every year since then, usually as large fields. The vault copies have been regenerated only twice, each time through much smaller grow-outs.
        assumes:
          - a population in cultivation continues to be selected by where it is grown
        takeaway: Material that never stopped growing has never been through a sampling step.
        format: CHOICE
        question: What does Fenn's seed have that the vault's does not?
        why: "Fenn’s seed is not unchanged since 1994. His soil, weather, disease and seed saving have selected it every year. What it has avoided is the vault’s small-sample bottleneck: a field contains thousands of contributing plants instead of dozens. Rare alleles lost by drift in the stored copy may therefore persist on the farm. The two conservation strategies preserve different things. Ex situ storage slows evolutionary change; in situ cultivation keeps a large population evolving under its local environment."
        choices:
          - It has not passed through a small sample twice
          - It is younger and therefore germinates better
          - It has been selected for the traits Wellmere wants
          - It carries more alleles than it did in 1994
        answer: It has not passed through a small sample twice
        rebuttals:
          - Fresh seed germinates better and that is not what the screen needs from it.
          - His selection is for his farm, and it is a change rather than an improvement.
          - No population gains alleles by being grown; mutation is far too slow to matter here.
      - group: VAULT
        task: Order what a regeneration standard has to fix, most binding first.
        title: What a grow-out has to be from now on
        place: Seed Vault
        scene: |-
          Qureshi has to write a standard that survives the next twenty years and the next four season leads. The ground available does not change and the collection does not shrink.
        assumes:
          - the effective size of a grow-out depends on how many plants contribute
        takeaway: A standard is what survives the person who wrote it, so it has to name a number.
        format: SEQUENCE
        why: The minimum contributing population comes first because no later care can restore an allele that was never sampled into the new seed. Isolation then prevents pollen from another accession entering the grow-out. Even harvesting protects the effective size promised by the plant count; a few prolific plants should not supply most of the seed. Finally, the record preserves what actually happened for the next curator. A durable regeneration standard therefore controls population size, gene flow, contribution balance and provenance rather than only producing seed that germinates.
        cards:
          - The minimum number of contributing plants, written as a number.
          - Isolation, so a grow-out is not pollinated by its neighbours.
          - Even harvesting, so no plant contributes far more seed than another.
          - The record of what was actually grown, plot by plot.
        order: [0, 1, 2, 3]
      - group: TRIAL
        task: Spend the ground you can free without spending the trial's ability to answer.
        title: Ground that is already committed
        place: Field Laboratory
        scene: |-
          Every plot is allocated. Quiroga can take the guard rows out of the yield trial, shorten the plots, or drop the fourth replicate. Each buys ground and costs something different.
        assumes:
          - a trial's precision depends on its replication and its plot size
        takeaway: Ground taken from a trial is taken from what the trial can say, and which part is a choice.
        format: SCIENCETANK
        why: The first place to find ground is outside the measured yield trial. Headlands and spare block can hold a screening nursery that mainly needs many plants and reliable inoculation. If more ground is still needed, shortening every plot spreads a modest precision cost across the trial. Dropping a replicate removes an entire independent comparison. That weakens small yield differences. Removing guard rows is worse because vigorous plots can borrow light and water from neighbours, quietly biasing every comparison. Different cuts therefore sacrifice different kinds of evidence.
        evidence: |-
          The yield trial has 240 plots: 60 lines, four replicates. Guard rows take about 8 per cent
          of the area and stop plots from borrowing light and water from their neighbours. Shortening
          plots by a fifth would free 20 per cent but raises the error variance because a short plot
          samples less ground. Dropping the fourth replicate frees a quarter and removes most of the
          trial's ability to separate lines that differ by less than half a tonne. The screening
          material needs the equivalent of 30 plots.
        proposals:
          - label: A
            text: Shorten every plot by a fifth, keeping all four replicates.
          - label: B
            text: Take the screening nursery onto the headlands and the spare block.
          - label: C
            text: Drop the fourth replicate across the whole trial.
          - label: D
            text: Remove the guard rows between plots.
        recommended:
          B: 55
          A: 30
  # ---------------------------------------------------------------- day 11
  - title: A week when the work is just the work
    objective: Sow the ground, and do the things that only get done when nothing is wrong.
    briefing: The drill is in the field and the forecast is kind.
    stake: >-
      Monday of the third week, and for once there is nothing to argue about. The trial is drilled,
      the screening nursery is on the headland, Fenn's four landraces went in on Saturday and the
      forecast is a fortnight of ordinary weather, with cloud sitting on the ridge north of the
      shelterbelt and nothing else in the sky. Wren Ashworth has the vault door open and a
      backlog of packets to re-bag. Toft is out with the canopy meter because this is the week the
      readings are worth taking. Today you spend a quiet week on the things that are impossible in a
      busy one — and on the one measurement that only works while a crop is still growing.
    takeaway: A quiet week is when the work that has no deadline finally gets done.
    stops:
      - group: DRY
        task: Take the readings that need a growing crop
        title: Measuring while it is still happening
        place: Drying & Processing Hall
        scene: Toft can measure canopy cover this week, while every plot is still green, or wait for yield in August. The board already records flowering date and soil-water status, but several canopy measurements are about to disappear with leaf senescence.
        assumes:
          - a crop's final yield is built up over the whole season
        takeaway: A measurement taken after the fact records an outcome; one taken during it can explain the outcome.
        format: CHOICE
        question: Why is canopy cover worth measuring now rather than reconstructing later?
        why: Yield is an outcome; canopy cover, flowering time and water use describe processes that produced it. Those states are temporary. Measuring canopy now lets the breeder later ask whether a high-yield line closed early, stayed green longer or used water differently. Skipping the measurement leaves only the final weight, which cannot reconstruct the path that created it. Process traits therefore do not replace yield. They explain why yield differed and identify traits worth testing in the next generation.
        choices:
          - It is gone by harvest, and it is what the yield was built from
          - It predicts yield more accurately than yield itself
          - Harvest measurements are less accurate than field ones taken now
          - It is required before the trial can be reported
        answer: It is gone by harvest, and it is what the yield was built from
        rebuttals:
          - Canopy cover explains yield; it does not predict it better than measuring yield does.
          - Weighbridge numbers are extremely accurate and are about a different question.
          - Nothing in the reporting requires it, which is exactly why it gets skipped in a busy year.
      - group: VAULT
        task: Keep the worsening vault problem and delegate the other two with an owner, first action and return condition.
        title: Three jobs, one still damaging seed
        place: Seed Vault
        scene: Ashworth has 400 packets with failed foil seals, a viability-testing schedule three months behind, and a stack of faded labels still recoverable from shelf positions. The vault is quiet this week, and three staff roles are available.
        assumes:
          - moisture exposure accelerates deterioration of stored orthodox seed
          - a viability test measures condition but does not repair it
        takeaway: Urgency depends on whether damage is still accumulating and reversible; a handoff is complete only with an owner, first action and return condition.
        format: DELEGATE
        question: Which problem stays with you, and what complete handoffs do the other two receive?
        delegate:
          hint: Keep the problem whose biological damage is still accumulating. A delegated job is accepted only when it has an owner, a first action and a condition that brings it back.
          team:
            - id: player
              label: player
            - id: seed_test
              label: seed_test
            - id: records
              label: records
          people:
            - id: player
              label: Season Lead
            - id: vault_tech
              label: Vault technician
            - id: seed_test
              label: Seed-testing technician
            - id: records
              label: Records technician
          problems:
            - id: failed_seals
              label: Packets with failed foil seals
              trend: rising
              irreversible: true
              loud: false
              stable: false
              rate: moisture exposure continues while a failed packet remains unsealed
              consequence: seed ageing can accelerate before the next viability test
              owner: player
              firstAction: Pull the failed-seal packets into a dry handling batch and begin re-bagging
              returnCondition: Return only when every failed packet is sealed and its exposure is logged
              delegable: false
            - id: viability_backlog
              label: Three-month viability-testing backlog
              trend: stable
              irreversible: false
              loud: true
              stable: true
              rate: the knowledge delay grows, but the test itself does not change the seed
              consequence: curators have older information about which lots are approaching regeneration thresholds
              owner: seed_test
              firstAction: Start with accessions closest to their regeneration threshold
              returnCondition: Return any accession at or below its action threshold immediately
              delegable: true
            - id: faded_labels
              label: Faded packet labels
              trend: stable
              irreversible: false
              loud: false
              stable: true
              rate: identity remains recoverable while packets stay in recorded shelf positions
              consequence: moving an unresolved packet could turn a recoverable record problem into lost provenance
              owner: records
              firstAction: Resolve each label against shelf position and catalogue before moving it
              returnCondition: Return any packet whose identity cannot be resolved from independent records
              delegable: true
          first: failed_seals
          firstActions:
            - id: a1
              label: Pull the failed-seal packets into a dry handling batch and begin re-bagging
            - id: a2
              label: Start with accessions closest to their regeneration threshold
            - id: a3
              label: Resolve each label against shelf position and catalogue before moving it
        answerText: Keep the failed-seal response. Delegate the viability backlog to seed testing and the faded labels to records, each with a first action and a clear return condition.
        why: A failed seal is the only problem that is actively changing the seed. Moisture can enter now, and ageing caused by that exposure cannot be undone later. The viability backlog is loud but stable; it delays knowledge rather than causing the decline it measures. Faded labels are also stable while shelf positions still recover identity. The season lead should therefore keep the failed-seal response and delegate the other work completely. Delegation protects attention without turning the quieter jobs into forgotten work.
      - group: CROSS
        task: Order what has to happen to make a controlled cross.
        title: The fortnight when it is possible
        place: Crossing Hall
        scene: |-
          Crossing needs the female parent before the anthers shed and the male in flower on the same morning. Bengtsson has the two parents at the right stage for about eleven days.
        assumes:
          - a plant can only be crossed while its flowers are at the right stage
        takeaway: Some work has a window rather than a deadline, and the window is set by the plant.
        format: SEQUENCE
        why: The order is forced by flower biology. Anthers must be removed before they shed pollen, or the female can self-pollinate before the intended cross begins. The head is bagged immediately so stray pollen cannot enter. Pollen from the chosen male is collected when it is ready, transferred to the receptive female, and the head is re-bagged. The label then records both parents and the date. Without that provenance, seed may grow perfectly while the breeder no longer knows who its father was.
        cards:
          - Open the female floret and remove its anthers before they shed.
          - Bag the head, so nothing else can reach it.
          - Collect pollen from the chosen male parent at flowering.
          - Transfer the pollen, re-bag, and label with both parents and the date.
        order: [0, 1, 2, 3]
  # ---------------------------------------------------------------- day 12
  - title: The rust arrives
    objective: Find a second resistance gene, in a collection that may no longer have one.
    briefing: Two hundred kilometres in four days, and WM-712 is in the ground.
    stake: >-
      Tuesday. The wind has come round off the foothills and the new race is two hundred kilometres
      closer than it was on Friday and there are
      pustules on the screening nursery this morning — the same nursery WM-712's sister lines are in.
      The single resistance gene is not holding. Volpe, who was right in March about the season, has
      stopped arguing. Nakagawa's screen of the fifty candidate accessions has come back with two
      hits, and Ivanescu can tell you what is wrong with both of them. Today you find out what the
      collection can still offer, and where the rest of it is.
    takeaway: The insurance was bought decades ago by people who did not know what for, and only some of it survived.
    stops:
      - group: LAB
        task: Spend the two evidence credits on checks that can change which positive accession receives the single increase slot.
        title: Which positive is worth the screenhouse slot
        place: Molecular Laboratory
        scene: Two of fifty accessions carry a different resistance marker, and the screenhouse can increase only one this season. One seed vial is visibly thin and the other is full. Nakagawa has records and tests available before the slot is committed.
        assumes:
          - a regeneration can change allele frequencies by sampling
          - a small viable seed lot can sometimes be increased without first using it in a field trial
        takeaway: The best measurement is the one that can change the decision, not the one that produces the most detailed description.
        format: VALUE
        question: Which evidence is worth buying before choosing the accession to increase?
        value:
          decision: Which marker-positive accession should receive the single screenhouse increase slot?
          budget:
            amount: 2
            unit: evidence credits
            label: Checks available before the slot is committed
          hint: Buy evidence that could change which accession deserves the scarce increase slot. A precise answer to a side question can still be poor value.
          options:
            - id: history
              label: Audit regeneration history
              cost: 1
              axis: genetic integrity
              decisive: true
              reveals: The thin-vial accession has never been regenerated. The full-vial accession has been regenerated three times and is on the drifted list.
            - id: seed_count
              label: Count viable seed in the thin vial
              cost: 1
              axis: increase feasibility
              decisive: false
              reveals: Eleven grams is roughly 300 viable seeds, enough for a careful protected increase.
            - id: repeat_marker
              label: Repeat the resistance-marker screen
              cost: 2
              axis: assay repeatability
              decisive: false
              reveals: Both positive calls repeat with clean controls; the repeat does not tell which accession still represents its original population.
            - id: yield_trial
              label: Run a small field-performance comparison
              cost: 3
              axis: agronomic performance
              decisive: false
              reveals: A one-season yield difference would not establish which seed lot has preserved the accession's original genetic variation.
          best:
            - history
            - seed_count
        answerText: "Buy the regeneration-history audit, with the seed-count check if budget remains. Increase the unregenerated accession: its 11 g is roughly 300 seeds, enough for a careful increase."
        why: The decision is not which accession has more seed today. Seed quantity can be repaired by one careful increase if enough viable seed remains. The harder issue is genetic integrity. The regeneration-history audit shows that one positive has never passed through a grow-out. The abundant one was regenerated three times and belongs to the drifted group. A repeat marker or small yield test may add detail, but neither restores the original population. Evidence is valuable when it changes which source deserves the scarce increase slot.
      - group: POP
        task: What happened to the resistance in this accession?
        title: What was lost, and when
        place: Genetic Resources Office
        scene: |-
          Ivanescu has the 1994 field notes for the drifted accession. The collector recorded rust on the crop and noted that about one plant in twenty stayed clean. Today's sample has none.
        assumes:
          - an allele present at low frequency can be lost when a population is sampled
        takeaway: An allele that has vanished was not necessarily destroyed; it may only have failed to be picked.
        format: DIAGNOSIS
        answerText: The evidence supports loss by drift during repeated small grow-outs. The old note shows the resistant phenotype was rare, not that the allele frequency was exactly five per cent.
        why: The 1994 field note says about five per cent of plants showed the resistant phenotype. That is not automatically a five-per-cent allele frequency. Dominance and genotype frequencies matter. It still tells us the resistant type was uncommon. If five per cent of plants show it, a random sample of thirty has about a 21 per cent chance of missing it entirely. Repeated small grow-outs create repeated opportunities for that loss. The clean nurseries provide no selection that would reliably preserve the resistance.
        headline: The 1994 notes describe resistant plants in this accession. The 2026 sample has none.
        readings:
          - zone: 1994 notes
            label: Resistant plants observed
            value: about 1 in 20
            status: normal
          - zone: Today
            label: Resistant plants in sample
            value: none in 300
            status: alarm
          - zone: Regeneration log
            label: Grow-outs since 1994
            value: three
            status: alarm
          - zone: Grow-out size
            label: Contributing plants each time
            value: 20 to 40
            status: alarm
          - zone: Selection
            label: Rust present at grow-outs
            value: never
            status: normal
            note: grown in a clean nursery
        choices:
          - label: Drift removed it across three small grow-outs
            mechanism: An allele at five per cent has a real chance of missing a sample of thirty, three times over.
          - label: The 1994 collector recorded it wrongly
            mechanism: A mistaken note would not be consistent with the rest of that collection trip.
          - label: The resistance was selected against during the grow-outs
            mechanism: Selection against a gene needs something acting on it, and the nurseries were clean.
          - label: The allele is present and the marker cannot detect it here
            mechanism: A marker failure would show in the controls, which came out correct.
        answer: Drift removed it across three small grow-outs
      - group: VAULT
        task: Say where the rest of the collection's insurance is
        title: The copy that was never in the vault
        place: Seed Vault
        scene: Fenn’s landraces are established in the station plots. His family has grown one of them continuously since before Wellmere existed, in a district where rust arrives most years. The vault copy of the same old population has been regenerated only in clean nurseries.
        assumes:
          - a population growing where a disease occurs is being selected by it every season
        takeaway: A population kept in cultivation keeps being tested by the thing you might one day need it for.
        format: CHOICE
        question: Why is Fenn's field likely to hold what the vault lost?
        why: "Fenn’s population has faced rust repeatedly, so plants carrying useful resistance can leave more seed in infected years. That changes allele frequencies through natural and farmer-mediated selection. The clean vault grow-outs did something different: without rust, resistance had no selective advantage and rare variants could disappear by drift. The farm population is not a frozen copy of 1994, but it may retain or enrich alleles the ex situ copy lost. In situ and ex situ conservation therefore preserve different evolutionary histories."
        choices:
          - Rust has selected it every year the vault was standing still
          - His seed is fresher and therefore more genetically complete
          - He has more seed than the vault has of that accession
          - Farm-saved seed mutates faster than stored seed
        answer: Rust has selected it every year the vault was standing still
        rebuttals:
          - Freshness affects germination and has nothing to do with which alleles are present.
          - Quantity is not the issue; the vault has plenty of a population that has lost the gene.
          - Mutation is far too rare to restore an allele in thirty years.
  # ---------------------------------------------------------------- day 13
  - title: Three things before the drill
    objective: Rank a nursery, a merchant and a phone call.
    briefing: The rust is here, the merchant wants an answer, and the seed increase is halfway.
    stake: >-
      Wednesday, and three things need deciding before the drill goes out at two. The screening
      nursery is infected and Nakagawa can score it today or lose the reading to fungicide drift
      from the neighbouring farm. The merchant wants WM-712's release confirmed or cancelled by five,
      with forty tonnes of seed already increased. And Fenn has rung to say he has rust in the field
      the landraces are in, which is either a disaster or the most useful thing that has happened
      all season. Today you decide the order and live with it.
    takeaway: Three urgent things are three decisions, and the order is one of them.
    stops:
      - group: TRIAL
        task: Decide what gets done first
        title: What cannot be done later
        place: Field Laboratory
        scene: The nursery can be scored this afternoon or not at all because neighbouring fungicide drift reaches it tomorrow. The merchant wants an answer by five. Fenn’s infected field will still be there tomorrow, and the seed-increase arithmetic can be done later.
        assumes:
          - some measurements are only available while conditions last
        takeaway: What goes first is what stops being possible, not what is loudest.
        format: CHOICE
        question: Which of the three has to happen first?
        answerText: Score the nursery first. Its biological measurement window closes today; the merchant deadline can be renegotiated, Fenn's field persists, and the arithmetic is not time-sensitive.
        why: The nursery has the only biological window that closes today. Fungicide drift will make tomorrow’s scores uninterpretable, and this season’s infection cannot be replayed. The merchant’s five-o’clock deadline was set by people and can be renegotiated. Fenn’s field will remain infected tomorrow. The seed calculations are also recoverable later. Prioritising the nursery is therefore not about which request sounds most important. It is about preserving information that will cease to exist if nobody measures it now.
        choices:
          - Scoring the nursery, before the drift reaches it
          - Confirming the release to the merchant before five o'clock
          - Driving out to Fenn's field to look
          - Recalculating the seed increase figures
        answer: Scoring the nursery, before the drift reaches it
        rebuttals:
          - A deadline set by a person can be moved by a person; drift cannot.
          - His field will be infected tomorrow too, and it is more informative once the nursery is scored.
          - The seed increase figures are arithmetic and can be done at any hour.
      - group: CROSS
        task: Answer the merchant
        title: Forty tonnes and a failing gene
        place: Crossing Hall
        scene: |-
          Forty tonnes of WM-712 seed exists. Its single resistance gene is being beaten two hundred kilometres away and in Wellmere's own nursery this morning. It still yields eleven per cent more in a dry year.
        assumes:
          - a released variety is planted over a large area at once
        takeaway: What makes a variety valuable is also what makes a single failing gene expensive.
        format: CHOICE
        question: What should Wellmere tell the merchant?
        why: The dry-year yield advantage is real, and forty tonnes of seed already exists. Destroying it does not repair the resistance gene. The risk is that a variety sold as resistant may be planted widely as though one failing gene were enough. Naming the weakness changes management and surveillance. Adding a second gene belongs in the next breeding cycle because existing seed cannot be genetically changed today. The biology defines the trade-off, while release policy still sets what level of risk is acceptable.
        choices:
          - Release it, with the resistance stated as a known weakness
          - Release it as planned and say nothing about the rust
          - Cancel the release and destroy the seed
          - Delay the release a season and add the second resistance gene first
        answer: Release it, with the resistance stated as a known weakness
        rebuttals:
          - Silence is what produces a district planted to one failing gene.
          - Forty tonnes of a high-yielding line is worth something even where rust arrives.
          - The second gene is the plan for the next line; it cannot be added to seed already grown.
      - group: POP
        task: Decide what to do about Fenn's field
        title: An outbreak in the right place
        place: Genetic Resources Office
        scene: Fenn’s landraces are carrying rust in the station plots, and he asks whether the whole block should be sprayed. Ivanescu has flagging tape, paper bags and plot tags ready, because some individual plants still look clean among heavily infected neighbours.
        assumes:
          - a population under a disease is being selected by it
        takeaway: A field with the disease in it is the only place the useful plants identify themselves.
        format: CHOICE
        question: What should Wellmere ask Fenn to do?
        why: An infected unsprayed patch can function as a field screen against the pathogen race that is actually present. Plants that remain relatively clean are candidates for useful resistance. They can be marked, bagged and harvested separately for later confirmation. Spraying the entire field would protect yield but erase that contrast. The field also belongs to Fenn, so the experiment requires his agreement and compensation for the unsprayed area. Conservation and breeding here work because the disease creates selection that the clean nursery does not.
        choices:
          - Leave part of it unsprayed and mark the plants that stay clean
          - Spray the whole field, so that the landraces are not lost to the rust
          - Harvest it early before the infection spreads
          - Plough it in to stop the rust spreading to the station
        answer: Leave part of it unsprayed and mark the plants that stay clean
        rebuttals:
          - Spraying saves the crop and removes the one thing this field can tell anybody.
          - Early harvest loses both the grain and the chance to see which plants held out.
          - Ploughing in destroys the population that is currently identifying itself.
  # ---------------------------------------------------------------- day 14
  - title: What goes in the crossing block
    objective: Decide what the next seven years are made of, on the last day it can be changed.
    briefing: The block is drilled tomorrow. After that the parents are fixed.
    stake: >-
      Thursday. The crossing block goes in tomorrow morning and it decides what the programme is
      working on until 2033 — a cross made in it is a line in four years and a release in seven.
      Volpe has her list, Qureshi has hers, and this year they overlap more than they ever have.
      The screen has one clean source of a second resistance gene, Fenn has forty marked plants
      being threshed individually, and there is room in the block for eight crosses. Today you fix
      the eight, and after tomorrow nothing in this season can be changed.
    takeaway: A crossing block is a decision about a decade, made in one morning with what is to hand.
    stops:
      - group: CROSS
        task: Spend eight programme slots across four crossing packages and preserve both resistance goals.
        title: Eight crossing commitments
        place: Crossing Hall
        scene: The crossing board has eight programme slots for the next two years. Volpe wants elite yield crosses, Qureshi wants unrelated resistance material brought in, and the current elite line still needs the second resistance gene. Fenn’s marked plants remain uncharacterised.
        assumes:
          - crosses consume greenhouse, generation and follow-up capacity for several seasons
          - closely related elite parents share more of the same genetic vulnerabilities
        takeaway: A breeding plan is a finite set of genetic questions it chooses to answer, and every crossing commitment delays another.
        format: ALLOCATE
        question: Which crossing packages keep the programme defended without spending the block on work that can wait?
        allocate:
          hint: The live panel shows which breeding questions each package answers. Protect the required resistance questions before spending remaining capacity on useful but deferrable work.
          pool:
            amount: 8
            unit: programme slots
            label: Crossing commitments available
          items:
            - id: backcross_second
              label: Four-generation second-gene backcross programme
              cost: 4
            - id: unrelated_two
              label: Cross the unregenerated accession onto two unrelated elite backgrounds
              cost: 2
            - id: elite_yield
              label: Elite-to-elite yield-cross package
              cost: 4
            - id: fenn_explore
              label: Exploratory package using uncharacterised Fenn plants
              cost: 3
          answers:
            - required: true
              requires:
                - backcross_second
              question: Can the current elite background receive the second resistance gene?
            - required: true
              requires:
                - unrelated_two
              question: Can the resistance programme move into unrelated genetic backgrounds?
            - required: false
              requires:
                - elite_yield
              question: Can the programme add another conventional elite yield cross now?
            - required: false
              requires:
                - fenn_explore
              question: Can the programme explore Fenn’s uncharacterised source immediately?
        answerText: Fund the second-gene backcross programme and the two unrelated-background crosses first. Together they use six of the eight authored programme slots and answer both urgent resistance questions.
        why: The programme has two urgent genetic questions. One is to place the second resistance gene into the elite background farmers already use. The other is to put that gene into unrelated backgrounds so the programme does not rebuild the same single point of failure. Elite-to-elite yield crosses are useful but narrow the same base and consume a large package. Fenn’s plants are promising but still uncharacterised. A finite crossing board therefore protects the two resistance questions first and deliberately leaves lower-priority packages for later.
        evidence: The programme's elite parents are closely related and carry the failing resistance gene between them. The unregenerated accession carries a second gene and has never been in a cross. Fenn's marked plants are unproven and will not be characterised for two seasons. Backcrossing the second gene into the current elite line takes four generations and the warm bay can run two a year. A yield cross onto elite parents is reliable and adds a fraction of a tonne. The rust race is expected to be regional within three years.
      - group: POP
        task: Say what the block does to the programme's base
        title: How narrow the base has become
        place: Genetic Resources Office
        scene: Ivanescu has the pedigree of six elite parents across the wall. Four share a recent grandparent, and all six carry the same resistance gene. The new rust race is already defeating that gene in commercial wheat east of Wellmere.
        assumes:
          - related parents share more alleles than unrelated ones
        takeaway: A programme that keeps crossing its best with its best is narrowing what it can still draw on.
        format: CHOICE
        question: What is the risk in the current elite parents?
        answerText: The base is genetically narrow, so the programme has fewer independent alternatives. The immediate shared vulnerability is that all six parents carry the same resistance gene now failing.
        why: "Related parents share more of the same alleles. Repeated elite-by-elite crossing therefore narrows the breeding base and reduces the independent variants available for future selection. A shared grandparent does not make every weakness identical. The immediate vulnerability is more specific: all six parents carry the same resistance gene now being defeated. Together, pedigree narrowing and a common resistance mechanism leave fewer alternatives when conditions change. Bringing unrelated material into the programme rebuilds options, although several generations may be needed to recover elite performance."
        choices:
          - A narrow pool of alternatives, plus one resistance gene shared by all six
          - Severe inbreeding depression because four parents share a recent grandparent
          - No remaining capacity to improve yield through further selection among descendants
          - Faster loss of seed viability because related parents share similar storage traits
        answer: Severe inbreeding depression because four parents share a recent grandparent
        rebuttals:
          - Self-pollinating wheat tolerates inbreeding well; the main problem is a narrow set of alternatives, not sudden inbreeding collapse.
          - A narrow base can slow response, but selection does not become literally impossible.
          - Cold-storage longevity depends on seed condition and storage environment, not on whether elite parents share a grandparent.
      - group: LAB
        task: Decide what to screen early and what the finished line must still prove
        title: DNA present, resistance working?
        place: Molecular Laboratory
        scene: Nakagawa can run the linked DNA marker at the two-leaf stage. On final candidates she can also measure resistance-gene mRNA after rust exposure and challenge leaves with the pathogen. The marker is four centimorgans from the gene.
        assumes:
          - a linked marker can separate from a gene by recombination
          - transcription makes RNA from DNA and translation makes protein from mRNA
        takeaway: DNA can show what a plant carries; RNA and phenotype show whether that information is being used and whether it works.
        format: CHOICE
        question: Which evidence belongs early, and what should the final line still be required to show?
        answerText: Use the DNA marker early. On the final line, confirm that the resistance gene is expressed after rust exposure and that the plant actually resists the pathogen.
        why: The linked DNA marker is useful early because it can remove unlikely seedlings months before resistance can be tested. But recombination can separate that marker from the gene. Even direct DNA evidence only shows that a sequence is present. Transcription produces mRNA, translation produces protein, and regulatory interactions affect how much gene product appears and when. An RNA check after rust exposure tests expression. The pathogen challenge then tests whether the whole pathway produces the resistant phenotype.
        choices:
          - Use the DNA marker early; on the final line check induced mRNA and the resistance phenotype
          - Measure mRNA in every generation; on the final line the pathogen challenge is unnecessary
          - Challenge plants in every generation; use the DNA marker only after the final backcross
          - Use the DNA marker early and late; DNA presence alone is enough to certify resistance
        answer: Challenge plants in every generation; use the DNA marker only after the final backcross
        rebuttals:
          - RNA shows expression, but the final phenotype still tests whether the complete pathway works.
          - Waiting for a pathogen phenotype every generation gives up the time advantage of early DNA screening.
          - A linked marker can recombine away, and even the gene's presence does not by itself prove expression or function.
  # ---------------------------------------------------------------- day 15
  - title: What the season established
    objective: Say what Wellmere knows now, what it cost, and what changes.
    briefing: The block is in. The rust is here. The collection is smaller than the catalogue says.
    stake: >-
      Friday, and the season is set. The crossing block went in yesterday, WM-712 was released with
      its weakness written on the label, and the drifted accessions are on a list that will take
      fifteen years to work through. Fenn's marked plants are drying in forty paper bags with his
      handwriting on them. The board meets on Monday and Qureshi has to say what happened here in
      terms somebody who funds a gene bank will understand. Today you settle what the season
      established, what it cost to find out, and which of the things done under pressure are worth
      keeping.
    takeaway: A collection is only as good as the last time each accession was grown, and now Wellmere knows which.
    stops:
      - group: VAULT
        task: Say what the season established about the collection
        title: What the catalogue says and what is there
        place: Seed Vault
        scene: Ninety accessions were genotyped. Thirty had drifted, and every one of those had been regenerated at least twice. The other sixty, regenerated once or not at all, still matched. About 9,000 accessions have two or more regenerations.
        assumes:
          - a sample of a collection supports an estimate about the collection
        takeaway: A sample can identify a high-risk group without proving the exact fraction affected in the entire collection.
        format: CHOICE
        question: What can Wellmere honestly say to its board on Monday?
        answerText: Repeated regeneration is the high-risk category. Prioritise those accessions for audit and change the protocol now, while a larger sample estimates how common drift is within that group.
        why: "The sample separates sharply by regeneration history: all thirty repeatedly regenerated accessions drifted, while the sixty less-regenerated accessions matched. That is strong evidence that repeated regeneration marks a high-risk group. It does not justify saying one third of the whole collection has drifted, because the sampled groups had different exposure histories. It also does not prove every one of the 9,000 repeatedly regenerated accessions is affected. The board can act on the risk group now while a larger audit estimates its true prevalence."
        choices:
          - Repeatedly regenerated accessions are a high-risk group and should be prioritised for audit
          - About one third of the entire 41,000-accession collection has drifted
          - Only the thirty sampled accessions can be treated as affected
          - All 9,000 accessions regenerated twice or more should be assumed to have drifted
        answer: About one third of the entire 41,000-accession collection has drifted
        rebuttals:
          - The one-third figure mixes accessions with very different regeneration histories and cannot be applied to the full collection.
          - The sample identifies a strong risk pattern beyond the thirty measured packets, even though it cannot name every affected accession.
          - All thirty sampled repeated-regeneration accessions drifted, but a sample of thirty does not establish a literal 100% prevalence across all 9,000.
      - group: TRIAL
        task: Say what the season's trial data supports
        title: One site, one year, again
        place: Field Laboratory
        scene: The trial is scored and the selected lines are chosen. The summary sheet now goes to a board that will remember one headline number. This was a dry season at one site, and the selected plots looked much better than the full replicated mean.
        assumes:
          - a trial's conclusions belong to the conditions it ran under
        takeaway: The sentence that survives being quoted out of context is the one worth writing.
        format: CHOICE
        question: How should this season's trial result be summarised?
        answerText: Report the replicated gain with the dry season and site attached to it. Those conditions are part of what the number means.
        why: A yield number becomes misleading when the conditions that produced it are stripped away. This season’s gain belongs to one site and a dry year. The selected-plot mean is even less defensible as a headline because those plots were chosen partly for favourable ground and weather. Putting site and season in the same sentence as the gain is not cosmetic caution; it defines the claim being made. A later season can test generality, but it does not make the current conditional result useless.
        choices:
          - Report the replicated gain and state the dry season and site in the same sentence
          - Report the larger selected-plot gain because those are the lines entering the programme
          - Report the replicated gain as the headline and put environmental limits in a footnote
          - Withhold the result until another season shows the same numerical advantage
        answer: Report the replicated gain and state the dry season and site in the same sentence
        rebuttals:
          - Selected plots were chosen after seeing outcomes, so their mean contains selection on favourable plot effects as well as genetics.
          - A detached headline is likely to travel without its footnote, changing a conditional result into a general one.
          - A second season tests how portable the result is; it is not required for the first season's conditional result to be real.
      - group: DRY
        task: Say what the year's agronomy is worth keeping
        title: Eleven years, and what they are for
        place: Drying & Processing Hall
        scene: Toft’s canopy, flowering and weather records now span twelve seasons. Nobody has ever asked for the whole series. This year two of those records explained why the highest-yielding plots separated from the rest during a dry finish.
        assumes:
          - a long record allows a season to be compared against others
        takeaway: A measurement series is worth more each year, and it can only be started early.
        format: CHOICE
        question: What makes the twelve-year record valuable?
        why: One season’s result is hard to interpret without a reference for how unusual that season was. A long weather and crop-development record supplies that context. It can show whether this year was exceptionally dry, early or otherwise unusual. That helps explain why particular traits paid off now. The series cannot be reconstructed later because past canopy and flowering states are gone. Routine measurements may feel unimportant in any single year, but their accumulated context becomes valuable when an unexpected season forces a comparison.
        choices:
          - It lets any one season be read against how ordinary it was
          - It improves the accuracy of each year's measurements
          - It is required for the trial results to be published
          - It replaces the need to measure yield directly
        answer: It lets any one season be read against how ordinary it was
        rebuttals:
          - Each year's measurement is as accurate as its instrument, however many years exist.
          - Nothing in publication requires it, which is why it is the first thing cut.
          - Yield still has to be measured; the record explains it rather than replacing it.
interiors:
  VAULT:
    caption: Seed dies by respiring. Cold and dry is the whole of the method.
    standLine: Forty-one thousand accessions, and a list of which ones are still what the label says.
    station:
      kind: panel
      title: Vault conditions
      rows:
        - { label: Chamber temperature, value: minus 18 C, status: normal }
        - { label: Seed moisture, value: 5.8 per cent, status: normal }
        - { label: Door open today, value: 41 minutes, status: high }
        - { label: Viability tests overdue, value: "1,140 accessions", status: alarm }
  DRY:
    caption: A seed comes in at twenty per cent water and has to leave at five.
    standLine: Slow and cool, because heat kills the embryo it is meant to be preserving.
    station:
      kind: panel
      title: Drying room
      rows:
        - { label: Air temperature, value: 18 C, status: normal }
        - { label: Relative humidity, value: 15 per cent, status: normal }
        - { label: Incoming moisture, value: 19 per cent, status: high }
        - { label: Target moisture, value: 5 to 7 per cent, status: normal }
  CROSS:
    caption: Two parents, one morning, and a bag over the head before anything else reaches it.
    standLine: A cross made here is a line in four years and a release in seven.
    station:
      kind: panel
      title: Crossing block
      rows:
        - { label: Slots available, value: 8, status: high }
        - { label: Warm bay generations a year, value: 2, status: normal }
        - { label: Elite parents on the list, value: 6, status: normal }
        - { label: Sharing a grandparent, value: 4 of 6, status: alarm }
  LAB:
    caption: A marker reports a piece of chromosome, and the gene is somewhere near it.
    standLine: Ninety accessions genotyped, and thirty of them are not what the catalogue says.
    station:
      kind: panel
      title: Marker run
      rows:
        - { label: Accessions screened, value: 90, status: normal }
        - { label: Carrying the second gene, value: 2, status: high }
        - { label: Marker to gene, value: 4 centimorgans, status: high }
        - { label: Expected error, value: about 4 in 100, status: alarm }
  TRIAL:
    caption: The plot is the unit, and everything true here is true of this ground and this year.
    standLine: Two hundred and forty plots, four replicates, and a wet corner that flatters whatever is in it.
    station:
      kind: panel
      title: Trial ground
      rows:
        - { label: Plots, value: 240, status: normal }
        - { label: Replicates, value: 4, status: normal }
        - { label: Selected-plot gain, value: 31 per cent, status: alarm }
        - { label: Gain across replicates, value: 11 per cent, status: normal }
  POP:
    caption: A collection is a set of frequencies, and every grow-out is a chance to change them.
    standLine: What was collected in 1994 and what is in the packet now are two different populations.
    station:
      kind: panel
      title: Regeneration log
      rows:
        - { label: Accessions regenerated twice or more, value: "about 9,000", status: high }
        - { label: Plants contributing per grow-out, value: 20 to 40, status: alarm }
        - { label: Recommended minimum, value: 100, status: normal }
        - { label: Drift found in the sample, value: 30 of 90, status: alarm }

copy:
  VAULT: <p>The Seed Vault. No windows, one door, and forty-one thousand foil packets on rolling shelves at minus eighteen. Everything in here is alive and doing as little as the cold will let it.</p>
  DRY: <p>Drying and Processing. Trays on racks in still, dry air, a cleaning mill that has not been rebalanced since March, and every sack labelled twice because a sack labelled once is a sack with no history.</p>
  CROSS: <p>The Crossing Hall. Glassine bags, forceps, a bench of pollinated heads under numbered tags, and a whiteboard where eight slots decide what the programme works on until 2033.</p>
  LAB: <p>The Molecular Laboratory. Plates, a thermal cycler running its third batch of the day, and a wall of gels that say which piece of chromosome a plant inherited and nothing at all about what it will do in a field.</p>
  TRIAL: <p>The Field Laboratory, at the bottom of the trial ground. Scales, a drying oven, sample bags by plot number, and the wet corner visible through the window from here.</p>
  POP: <p>Genetic Resources. Passport records, collection maps with pencilled routes on them, and the regeneration log that turns out to be the most important document on the station.</p>
  GH1: <p>Glasshouse 1, the warm bay. Lights on a timer, two generations a year, and the backcross that has to be finished before the rust is regional.</p>
  GH2: <p>Glasshouse 2, the cool bay. Trays of vernalising seedlings held at four degrees, because a winter wheat that never gets a winter never flowers.</p>
  GH3: <p>Glasshouse 3, the screening bay, kept apart from the rest with its own door and its own boots. What is grown in here is deliberately infected.</p>
  SCREEN: <p>The screenhouse. Insect-proof mesh over the whole frame, so an increase of one accession stays that accession and nothing flies in with other pollen.</p>
  RECORDS: <p>Passport Records. Where every accession came from, who collected it, on what date and off which hillside, in handwriting going back to 1961.</p>
  THRESH: <p>The threshing floor. Harvest in, chaff out, and forty paper bags with a farmer's handwriting on them waiting to be threshed one plant at a time.</p>

              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a breeding programme moves one generation at a time
        takeaway: The cost of holding something back is rarely paid by the thing being held back.
        format: CHOICE
        question: Why does a one-season deferral cost more than one season?
        why: "A breeding programme is a queue that shares seasons, ground and staff. Holding WM-712 for 1 year also delays its seed increase, the trial that would have used that ground, and the crosses waiting behind it. The cost therefore lands on lines that were never part of the argument. That is the strongest version of Volpe’s case: delay has opportunity costs throughout the pipeline. It does not prove release is right, but it makes the price of waiting explicit."
        choices:
          - Every line behind it in the pipeline waits too
          - The line loses its advantage as the standard improves
          - Seed held for a year germinates less well
          - The trial data expires and has to be repeated
        answer: Every line behind it in the pipeline waits too
        rebuttals:
          - The standard does improve, slowly, and it is not what makes a single season expensive.
          - A year in a cold store costs a well-dried sample very little germination.
          - Trial data does not expire; it becomes one more year in a series.
      - group: TRIAL
        task: Say what four seasons of trials support
        title: What the trial can actually claim
        place: Field Laboratory
        scene: |-
          Four seasons, one site, four replicates each. WM-712 is ahead by 11% in the 2 dry years and by 2% in the wet ones. The merchant's leaflet says "11% higher yielding".
        guide: >-
          The claim on the leaflet rests on an assumption about how dry next season is, and
          the slider is that assumption — the soil-moisture deficit, where a low number is a
          wet year. Three candidate sentences are scored against two criteria. Take the
          slider down to a wet season and see which sentence is still true, because the one
          that reads best at the expected deficit is not the one that survives being wrong.
        background:
          - >-
              What a trial measures. Four replicates at one site over four seasons separate a
              line from the pieces of ground it was grown on, and they do it under the weather
              those four seasons happened to bring. The number and its conditions are one
              object; quoting the number alone makes a different claim.
          - >-
              Why the expected season is the trap. At the four-season average deficit the bare
              eleven per cent needs the fewest words of qualification, which is exactly what a
              leaflet optimises for. Take the deficit down to a wet year and the sentence is
              wrong by a factor of five, and a buyer who paid for eleven and got two has been
              misled by a figure nobody fabricated.
          - >-
              What survives. A sentence that names the condition it was measured under stays
              true whatever next season does, and costs the merchant eleven more words on the
              leaflet. That is the trade being made, and genotype-by-environment interaction is
              the name for the reason it cannot be avoided.
        assumes:
          - a trial measures lines under the conditions the trial happened in
        takeaway: A number from a trial carries the conditions it was measured under, or it is a different claim.
        format: STRESS
        question: Which sentence about WM-712 is still true if next season's rainfall lands anywhere in the plausible range?
        answerText: "The conditional one: at this site the advantage is large in dry seasons and small in wet ones. The bare 11 per cent needs the fewest qualifying words and is wrong by a factor of five in a wet year."
        why: The eleven per cent is real and it belongs to two dry seasons. Set next season wet and the same line yields two per cent more than the standard, so a buyer who planned on eleven has been misled by a figure nobody fabricated. The conditional sentence gives up the headline and stays true across the whole rainfall range, which is what robustness means here: not the claim that scores best at the expected value, but the one that is still correct at the edges. The regional claim is worse than both — one site cannot support it at any rainfall, because nothing in the trial varied the region. Genotype-by-environment interaction is exactly this: a line's advantage is a property of the line and the conditions together, and a number quoted without its conditions is a different claim wearing the same digits.
        stress:
          assumption:
            label: Next season's summer soil-moisture deficit at this site
            unit: mm
            min: 10
            max: 210
            nominal: 130
            step: 5
          criteria:
            - key: hedging
              label: Qualifying words the leaflet has to print with the claim
              unit: words
            - key: truth
              label: Seasons in the plausible range where the sentence is still true
              unit: of 5
          candidates:
            - id: bare
              label: WM-712 yields 11 per cent more than the standard
            - id: conditional
              label: At this site, WM-712's advantage is large in dry seasons and small in wet ones
            - id: regional
              label: WM-712 is adapted to drought across the region
          scores:
            bare:
              hedging: 3
              truth: 2
            conditional:
              hedging: 14
              truth: 5
            regional:
              hedging: 5
              truth: 1
          feasible:
            bare: 120
            conditional: 10
            regional: 400
          optimiseOn: hedging
          robust: conditional
      - group: DRY
        task: Say why a dry summer costs yield
        title: What the crop cannot do without water
        concept: Where water and mineral nutrients do and do not go
        place: Drying & Processing Hall
        scene: |-
          Toft has 11 years of yield against summer rainfall and a straight-ish line through it. A trainee asks why a plant that is mostly built from air minds a dry summer at all.
        guide: >-
          Four steps carry carbon from the air into grain, and each one has a reading beside
          it saying how much it is passing today. Put them in the order the carbon travels,
          then name the step that is setting the rate. The largest number on the panel is
          not automatically the governing one, and neither is the first step in the path.
        background:
          - >-
              What a governing link is. Along any path, the step passing the least is the one
              that fixes the total, and improving any other step changes nothing. That is why
              naming it matters more than describing the path: it is the only place where an
              intervention does anything.
          - >-
              Why the stomata are the awkward step. A leaf takes carbon dioxide in through
              pores and loses water vapour out through the same pores. There is no setting of
              those pores that admits carbon and holds water, so under drought the plant
              closes them and accepts the loss of carbon that follows.
          - >-
              What the other steps are doing. Light capture and the enzymes that fix carbon
              are working at close to their usual rate in a dry summer; the roots are the
              obvious suspect and are moving water, not carbon. The reading beside each step
              is what separates a suspect from the answer.
        takesAsRead:
          - Photosynthesis as where a crop’s dry mass comes from
        assumes:
          - plants take in carbon dioxide through pores in their leaves
        takeaway: The opening a leaf takes carbon in through is the opening it loses water through.
        format: CHAIN
        question: Trace the path carbon takes into the grain, and name the step that is setting the rate in a dry summer.
        answerText: Stomatal conductance. The pores are shut to hold water, so carbon dioxide supply to the leaf interior is what limits the whole path, whatever the light and the enzymes could do.
        why: Almost all of a crop's dry mass arrives as carbon dioxide through the stomata, and water vapour leaves through those same pores. Under drought the plant closes them, which is the correct decision for survival and immediately cuts the carbon supply to the sites that fix it. Light interception is unchanged, the fixing enzymes are unimpaired, and the roots are moving what water there is — so improving any of those three changes nothing while the pores are shut. That is what a governing link means: the step passing the least sets the total. The straight-ish line in Toft's eleven years is the same fact plotted at field scale, and the reason breeders talk about water-use efficiency rather than about drought resistance.
        chain:
          links:
            - id: light
              label: Light intercepted by the canopy
              transfers: 780 of 1,000 µmol m⁻² s⁻¹ reaching the canopy, unchanged this season
            - id: stomata
              label: Carbon dioxide admitted through the stomata
              transfers: 6.1 µmol m⁻² s⁻¹, down from 21 in a wet summer — pores 70 per cent closed
            - id: fixation
              label: Carbon fixed by the enzymes in the leaf
              transfers: capacity for 24 µmol m⁻² s⁻¹ at this leaf temperature
            - id: filling
              label: Carbon moved into the filling grain
              transfers: capacity for 19 µmol m⁻² s⁻¹ over the filling period
          order: [light, stomata, fixation, filling]
          governing: stomata
          distractor: light

  # ---------------------------------------------------------------- day 5
  - title: What comes with what you wanted
    objective: Find out what else the resistance gene is dragging behind it.
    briefing: The resistant lines are shorter, and nobody bred them that way.
    stake: >-
      Friday, and the plan is signed. WM-712 goes to seed increase. 40 of the 60 overdue samples
      get regrown. Qureshi has put what she thinks of that in writing. In the glasshouse there
      is a new problem. The backcross lines that carry the rust resistance gene are all shorter
      than their sisters. Nobody selected for short. Nobody wants short. Nakagawa has marker
      data on those same lines and a question of her own. The marker was chosen two populations
      ago. She is not sure it still means anything here. Today you work out what came along with
      the gene.
    takeaway: Genes near each other are inherited together, which is what makes markers work and what makes them expensive.
    stops:
      - group: CROSS
        task: Explain the short plants
        title: What came with the gene
        concept: Backcrossing a gene into an existing line, one generation at a time
        place: Crossing Hall
        scene: Every backcross line carrying the resistance allele is 12 to 15 centimetres shorter than its susceptible siblings. The donor parent was a short landrace, while the recurrent elite parent is tall. Volpe wants to know what travelled with the target gene.
        guide: >-
          The scoring sheet counts how often the marker and the height gene come apart. Work
          out that fraction from the plants that recombined, and read it as a distance along
          the chromosome. Two tiles belong to the whole population and two to the recombinant
          class, and only one pairing is the frequency.
        background:
          - >-
              Why a distance is the useful form. A recombination frequency of one per cent
              between two loci is defined as one centimorgan of map distance, so the fraction
              measured in a population converts straight into how far apart the two genes sit.
              That is what tells a breeder whether the drag can be broken at all.
          - >-
              Why a chromosome travels in stretches. Crossing over happens at a limited number
              of points per chromosome per meiosis, so a wanted allele arrives with a block of
              its neighbours. The closer a neighbour sits, the more generations it takes to
              separate — and the shortness here is a neighbour, not a cost of resistance.
          - >-
              What the number is for. Six recombinants in two hundred is three centimorgans,
              which is close enough that finding a line carrying resistance without the height
              block means screening hundreds of plants rather than dozens. Volpe's answer is
              therefore a screening budget, not a shrug.
        takesAsRead:
          - Dominance, and why one allele is enough
        assumes:
          - genes sit at fixed places on chromosomes
        takeaway: A chromosome is inherited in stretches, so a wanted gene arrives with its neighbours.
        format: BALLPARK
        question: How far apart are the resistance gene and the height locus, in centimorgans?
        answerText: About 3 cM. 6 recombinants in 200 backcross plants is a recombination frequency of 3 per cent, and 1 per cent is 1 centimorgan by definition.
        why: The short plants are not paying a price for being resistant. They are carrying a block of the donor's chromosome that came across with the resistance allele, and a height gene is inside that block. How often the two come apart is measurable: 6 of the 200 backcross plants carry one without the other, so the recombination frequency is 6 ÷ 200 = 0.03, and 1 per cent recombination is defined as 1 centimorgan of map distance. Three centimorgans is close linkage. It means the drag can be broken — the two loci do separate — but only by screening enough plants to catch a 3 per cent event, which is why linkage drag is a budget question rather than a permanent feature of the line. The alternative explanations are all testable and all fail: resistance costing growth would shorten every resistant plant in every background, and backcrossing does not reduce vigour.
        estimate:
          prompt: 200 backcross plants scored for both the resistance marker and height. 6 of them carry the resistance allele at normal height, or normal height with no resistance.
          question: Choose the number of recombinant plants and the number of plants scored.
          labels:
            - 6  (plants where the two came apart)
            - 200  (backcross plants scored)
            - 100  (per cent, to read the fraction as centimorgans)
            - 194  (plants where the block stayed intact)
            - 15  (centimetres of height difference)
          values: [6, 200, 100, 194, 15]
          slots: 3
          template: '{0} ÷ {1} × {2}'
          formula: a/b*c
          correct: [0, 1, 2]
          target: 3
          tolerance: 0.5
          units: cM
          solution: 6 ÷ 200 × 100 = 3 per cent recombination, and 1 per cent recombination is 1 cM, so the map distance is 3 cM.
          explanation: 3 cM is close linkage — separable, but only by screening enough plants to catch a 3 per cent event.
          givens:
            - 200 backcross plants, 6 of them recombinant
            - 1 per cent recombination is defined as 1 centimorgan
          relationship: recombination frequency ≈ map distance in cM. Recombinants ÷ plants scored × 100 gives the percentage, and 1 per cent is 1 cM.
      - group: LAB
        task: Test whether the marker still works here
        title: A marker fitted where it worked
        place: Molecular Laboratory
        scene: >-
          A marker predicts a trait by sitting close to the gene — in the population it
          was mapped in. Nakagawa's marker has picked plants correctly for three seasons
          in that population. She now has a new cross from a different donor, with 100
          plants scored both ways. A cut-off's score is the share of plants it calls
          correctly, so higher is better.
        guide: >-
          Drag the cut-off and watch how it does on the mapping population. Remember
          what that number is: the marker was mapped in these plants, so a cut-off tuned
          on them is tuned to this population's genetics as much as to the trait. When
          you have chosen, press freeze. Freezing commits you and opens the new cross,
          which the cut-off has never seen. Report what it scores there.
        background:
          - >-
              Why a marker works at all. The marker is not the gene. It is a stretch of
              sequence near enough to the gene that the two are usually inherited together,
              so scoring the marker is a cheap way of asking about the gene. How near is
              near enough depends on the population: parents, generations and any
              recombination between the two sites.
          - >-
              Why a different donor is a different question. Bring the trait in from another
              parent and the sequence around the gene comes with it. The distance between
              marker and gene can be larger, or the marker's variant can travel with the
              wrong version of the gene entirely. Nothing about the marker has changed; what
              changed is the population it is being asked about.
          - >-
              What the freeze buys. A cut-off chosen on the mapping plants is flattered by
              them, and a score measured there is a score of the cut-off plus that
              population. The held-back cross is the only honest test, and it is only a test
              while the cut-off was chosen without it — which is what committing before you
              look actually means.
        assumes:
          - a marker predicts a trait by being close to the gene, in that population
        takeaway: A rule fitted on one population has to be scored on a population it has never seen.
        format: HOLDOUT
        question: Set the marker score above which a seedling is kept, on the plants the marker was mapped in — then freeze it and score it on a population it has never seen. What does it get?
        answerText: About 94%, from a cut-off near 48. The 63 that scores 99 on the mapping plants drops to 79 on the new cross — 20 points of it was that 1 population's noise.
        why: A cut-off chosen on one population partly fits that population’s accidents. Those accidents do not have to repeat. The broad high-scoring shelf is useful because it persists when the rule is frozen and applied to the new donor cross. The sharp optimum at 63 does not persist; it was overfit to the mapping plants. A holdout population separates a marker rule that generalises from one that merely describes the sample used to choose it.
        holdout:
          axis:
            label: Marker score cut-off
            unit: ""
            min: 20
            max: 90
            step: 1
          unit: "%"
          fitLabel: Mapping population, 240 plants
          testLabel: A new donor cross, never seen
          pass: 92
          start: 22
          fit:
            - at: 20
              value: 74
            - at: 30
              value: 86
            - at: 40
              value: 93
            - at: 48
              value: 95
            - at: 56
              value: 95
            - at: 63
              value: 99
            - at: 70
              value: 94
            - at: 80
              value: 88
            - at: 90
              value: 71
          test:
            - at: 20
              value: 72
            - at: 30
              value: 84
            - at: 40
              value: 92
            - at: 48
              value: 94
            - at: 56
              value: 93
            - at: 63
              value: 79
            - at: 70
              value: 88
            - at: 80
              value: 84
            - at: 90
              value: 69
          freeze: Freeze the cut-off
          commit: Report what it scores on the new cross
      - group: DRY
        task: Say what the shorter plants do to the harvest
        title: Short is not simply worse
        concept: Photosynthesis as where a crop’s dry mass comes from
        place: Drying & Processing Hall
        scene: |-
          Toft points out that shorter wheats were the whole point of the 1960s: less stem, more grain, and they stand up in the rain. Volpe still does not want 15 centimetres she did not ask for.
        guide: >-
          The crop built 19.6 tonnes of dry matter this season and the list wants more than
          that. Roots and canopy are not optional, so they are already committed. Spend what
          is left and see which of the questions underneath your plan can still be answered —
          every one of them is a real thing the station wants, and the plan is what you give up.
        background:
          - >-
              What harvest index is. The fraction of everything the crop built that ends up in
              the grain. A tall wheat puts a quarter of its dry matter into stem; a short one
              puts less, and the difference is available to the ear. Nothing about the shorter
              plant photosynthesises faster.
          - >-
              Why the stem is not waste. Straw holds the ear above the ground, carries water
              and sugars to it, and stops the crop going flat in August rain. A stem thick
              enough to stand in weather is bought out of the same nineteen tonnes as the grain,
              which is why the trade is a trade and not an oversight.
          - >-
              Why defence is on the list. Making the compounds that slow a rust infection costs
              dry matter that would otherwise be grain, and a line that spends nothing on it
              yields more in a clean year and less in a bad one. One budget, and the season
              decides which allocation looks clever.
        assumes:
          - a plant divides what it builds between stem, leaf and grain
        takeaway: What matters is the share of what the plant built that ends up in the grain.
        format: ALLOCATE
        question: 19.6 tonnes of dry matter. Spend it across the plant, and know what the plan stops you claiming.
        answerText: Roots and canopy are committed. Fill the grain and keep enough stem to stand — then defence and the extra height are what the season costs you, and a wet August makes the stem the one you cannot skip.
        why: A crop cannot build more dry matter than the season allowed it, so every structure is paid for out of one total and the grain is the last claimant. That is harvest index: not how much the plant made, but the share of it that ended in the ear. Roots and canopy are committed — nothing grows without them — which leaves about 9.7 tonnes to divide. Grain fill wants 8.6 of that, a stem strong enough to hold up in August rain wants 5.2, the defence compounds want 0.8, and the extra 15 centimetres of height wants 1.8. They cannot all be bought. Shorter wheats did not photosynthesise faster in the 1960s; they stopped spending as much on stem, and the ear got what the stem gave up. Volpe's 15 centimetres is not a rounding error, it is 1.8 tonnes of somebody else's grain.
        allocate:
          hint: Nothing here is a wrong thing to build. What the plant cannot do is the price of what it can.
          pool:
            amount: 19.6
            unit: t of dry matter
            mode: scalar
          items:
            - id: roots
              label: Root system to the depth the soil allows
              cost: 2.4
              protected: true
              note: nothing above ground happens without it
            - id: canopy
              label: Leaf canopy that intercepts the light
              cost: 7.5
              protected: true
              note: this is the machinery that built the rest
            - id: grain
              label: Fill every floret the ear set
              cost: 8.6
            - id: stem
              label: Stem strong enough to stand in August rain
              cost: 5.2
            - id: height
              label: The extra 15 centimetres of straw
              cost: 1.8
            - id: defence
              label: Defence compounds against the rust
              cost: 0.8
            - id: tillers
              label: Late tillers that may or may not fill
              cost: 1.4
          answers:
            - question: Does the ear fill the florets it set?
              requires:
                - grain
              required: true
            - question: Is the crop still standing after August rain?
              requires:
                - stem
            - question: Does the line hold the rust back on its own?
              requires:
                - defence
            - question: Is the straw long enough to bale?
              requires:
                - height
            - question: Do the late tillers contribute anything?
              requires:
                - tillers
          commit: Commit the season's allocation

  # ---------------------------------------------------------------- day 6
  - title: How many is enough
    objective: Put a number on what a regeneration needs, and on what the vault is losing.
    briefing: 40 accessions, 1 field, and a number nobody wants to hear.
    stake: >-
      Monday of the second week. The regrowing list has to be cut from 60 samples to 40.
      Ivanescu spent the weekend on how many plants a grow-out really needs. The number he got
      is not the number in the manual. Mbaye has 11 years of germination tests on one sample.
      Its curve is about to cross his line. Quiroga has a question from the trial ground. Last
      year's trial found a difference in plant height. This year's trial cannot see it. She
      wants to know which of the two to believe. Today you decide which 40 samples go in the
      ground.
    takeaway: Every number here is about a population, and populations do not behave like the plants in them.
    stops:
      - group: POP
        task: Estimate the effective size of this unequal-parent regeneration
        title: Not the number of plants
        place: Genetic Resources Office
        scene: Last year’s regeneration of a dioecious conservation accession used 120 plants. 18 pollen donors and 102 seed parents contributed to the harvested seed. Ivanescu wants the effective size before the next regeneration plan is approved.
        guide: >-
          Five numbers, and two of them count plants standing rather than parents
          contributing: the plot total, and half of it. Ask of each whether this measure
          uses it. The two parent counts are badly unbalanced, and the answer will come
          out well below the headcount. Rare alleles had fewer independent routes
          through the smaller side.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - dioecious means pollen and seed are produced by separate plants
          - unequal parental contributions reduce effective population size
        takeaway: A regeneration can contain many plants yet behave genetically like a much smaller population when parental contributions are unbalanced.
        format: BALLPARK
        question: What effective population size did 18 pollen donors and 102 seed parents produce?
        answerText: About 61 effective breeding individuals, even though 120 plants stood in the plot.
        why: Effective population size asks how many equally contributing breeders would produce similar genetic drift. For separate pollen and seed parents, Ne ≈ 4NmNf/(Nm+Nf). Here 18 pollen donors and 102 seed parents give about 61, far below the 120 plants standing in the plot. The imbalance means transmitted alleles had fewer independent routes through the pollen side. Rare variants therefore faced a stronger sampling bottleneck than the headcount suggests. This sex-ratio formula applies to this separate-sex accession, not ordinary selfing wheat.
        estimate:
          prompt: A separate-sex accession had 18 pollen donors and 102 seed parents. Use Ne = 4NmNf/(Nm+Nf).
          question: Choose the constant and the two contributing-parent counts.
          labels:
            - 4  (the sex-ratio constant)
            - 18  (pollen donors)
            - 102  (seed parents)
            - 120  (plants standing in the plot)
            - 60  (half the plot)
          values: [4, 18, 102, 120, 60]
          slots: 3
          template: "{0} × {1} × {2} ÷ ({1} + {2})"
          formula: a*b*c/(b+c)
          correct: [0, 1, 2]
          target: 61.2
          tolerance: 6
          units: effective plants
          solution: 4 × 18 × 102 ÷ (18 + 102) = 61.2.
          explanation: The imbalance makes the population behave genetically like about 61 equal contributors, not 120.
          givens:
            - 18 pollen donors
            - 102 seed parents
          relationship: Ne = 4NmNf ÷ (Nm + Nf), where Nm and Nf are the contributing pollen and seed parents.
      - group: VAULT
        task: Set the field-reservation and grow-out thresholds before replaying the viability record.
        title: Write the viability rule before it falls
        place: Seed Vault
        scene: Mbaye has 11 germination results from the same accession, falling from 98 to 85%. The current regeneration floor is 85. Booking field space takes several planning updates, and starting the grow-out takes one more.
        guide: >-
          One rule, written before the test results arrive and fixed once released. The grow-out takes
          one interval from the moment it is called, and below 85 % germination the lot is past the
          floor the vault regenerates at. So the line sits above 85 by however far viability falls in
          that interval — and not so far above it that a healthy lot is regenerated for nothing.
        background:
          - >-
              Why a floor is not a trigger. The regeneration floor is where the accession
              must already have been grown out. Everything that has to happen first —
              booking ground, preparing seed, planting — takes time, so the trigger has to
              sit above the floor by however long that takes.
          - >-
              What the falling series is telling you. Eleven results from 98 down to 85 is a
              trend, not a scatter, and the rate of fall is what turns a threshold into a
              date. A rule written against the level alone ignores how fast the level is
              arriving.
          - >-
              Why the rule is written before the updates. Germination results arrive one at
              a time, and a threshold adjusted as they come in is a description of what
              somebody already decided. Committing first is what makes the vault's practice
              defensible to whoever inherits it.
        assumes:
          - germination percentage measures the fraction of seeds that can produce seedlings
          - regeneration requires field space before seed can be multiplied
        takeaway: A biological threshold must fire early enough for the action it triggers to arrive before the measured state crosses the limit.
        format: TRIGGER
        question: >-
          At what germination do you start the regeneration grow-out, given it takes an interval to
          get under way?
        trigger:
          hint: >-
            Set the rule before release. The grow-out takes one interval to get under way, and the
            readings only fall.
          direction: falling
          scale:
            label: Germination of the stored lot
            min: 80
            max: 100
            unit: "%"
            anchors:
              - { at: 98, means: 'the lot as it went into store' }
              - { at: 84, means: 'below the regeneration floor — the lot is grown out now or it is lost' }
          consequenceLimit: 85
          objective: >-
            The regeneration grow-out has started before germination falls to the 85 % floor.
          rehearsal:
            note: the lot regenerated two winters ago
            stream:
              - { value: 96, hoursLeft: 11 }
              - { value: 94, hoursLeft: 9 }
              - { value: 92, hoursLeft: 7 }
              - { value: 90, hoursLeft: 5 }
              - { value: 88, hoursLeft: 3 }
              - { value: 86, hoursLeft: 1 }
              - { value: 85, hoursLeft: 0 }
          conditions:
            - id: start
              label: Start regeneration grow-out
              leadHours: 1
              window: { min: 86, max: 88 }
          stream:
            - step: 0
              value: 98
              hoursLeft: 11
              at: update 0
              update: 98 % germination
            - step: 1
              value: 97

              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        takesAsRead:
          - "Resource allocation: defence, growth and yield out of one budget"
        assumes:
          - a crop builds most of its grain from light captured after flowering
        takeaway: An early canopy captures light while there is still water to use it with.
        format: CHOICE
        question: Why did the early lines yield best in this season?
        why: Yield depends on how much light the crop intercepts, how efficiently it converts that energy, and how much biomass reaches grain. In this dry season, soil water became limiting after flowering. The lines that closed their canopies earlier captured more light while stomata could still stay open. Earlier flowering also shifted grain filling toward the wetter part of the season. These traits are therefore escape strategies for this environment. In a wet year their advantage could shrink or disappear.
        choices:
          - They captured light and set grain before the soil dried
          - Early flowering makes plants more efficient per leaf
          - They avoided the rust, which arrived late in the season
          - Early canopy closes weeds out and removes competition
        answer: They captured light and set grain before the soil dried
        rebuttals:
          - Efficiency per unit leaf is not what flowering date changes.
          - Rust arrived nowhere near this trial, and escape would show as health rather than yield.
          - Weed suppression is a genuine benefit of early cover and is not worth this much yield.
  # ---------------------------------------------------------------- day 9
  - title: The collection is not what the records say
    objective: Find out why the regenerated accessions no longer match their own passports.
    briefing: A genotyping run that was meant to be routine.
    stake: >-
      Thursday. Nakagawa ran a routine marker panel across 90 samples. She was only building a
      reference set. A third of the 90 do not match their passport records. Same sample numbers,
      same paperwork, different plants. Pirelli has checked the labelling twice and found
      nothing wrong with it. A gene bank sells one thing, which is knowing what is in the
      packet. Qureshi went down to the vault an hour ago. She has not come back up. 50 of these
      samples are the ones being screened for rust resistance. Today you work out what has
      happened to those samples.
    takeaway: A collection can be kept perfectly and still stop being the thing it was.
    stops:
      - group: POP
        task: Open the dependencies behind the genetic and viability results, keep the independent evidence, and name the shared source behind the shifts.
        title: Which evidence shares the grow-out
        place: Genetic Resources Office
        scene: "30 of 90 accessions no longer match their 1990s allele frequencies. Nakagawa has four evidence channels on the board: genetic comparisons, regeneration histories, germination results and the vault log. Independent shelf checks are clean."
        guide: >-
          Open each channel to see what it was computed from. Keep the ones that stand
          independently of the repeated small grow-outs, and untick the ones that
          inherit that history. Then name the shared source. The shelf checks are clean,
          which is itself evidence about where the drift did not come from.
        background:
          - >-
              What repeated small grow-outs do. Regenerating an accession from a handful of
              plants each time loses alleles by chance, and doing it repeatedly compounds
              the loss. The result looks exactly like a collection that has drifted from its
              1990s records — because it has, through its own maintenance.
          - >-
              Why the shelf checks being clean matters. If storage conditions or
              mislabelling were the cause, the shelves would show it. Clean shelves point
              away from an accident and towards something systematic in how the material has
              been renewed.
          - >-
              Why some channels survive. Germination results and the vault log are records
              of handling rather than of allele frequency, so they do not inherit the
              grow-out history. That is what makes them able to test it rather than repeat
              it.
        takesAsRead:
          - Genetic drift, and why it is worst in a small sample
        assumes:
          - a result can depend on earlier handling as well as on the current assay
          - independent evidence does not share the same critical source
        takeaway: Several results can agree because they share one history; independent evidence should be kept when the shared dependency is corrected.
        format: TRACE
        question: Which results inherit the repeated small-grow-out history, and which evidence remains independent of it?
        trace:
          hint: Open each result and inspect what it rests on. Name the source shared by the genetic shifts, but do not discard a channel whose evidence path never uses it.
          target: regen_history
          resources:
            - id: regen_history
              label: Recorded grow-out history
            - id: passport
              label: 1990s genotype and allele-frequency record
            - id: current_genotype
              label: Current genotype panel
            - id: archive_subsample
              label: Archived comparison subsample
            - id: germination
              label: Current germination assay
            - id: vault_log
              label: Twenty-eight-year temperature and storage log
          channels:
            - id: frequency
              label: Allele-frequency comparison
              reading: 18 of 30 loci have moved more than 5 percentage points from the 1994 record
              depends:
                - passport
                - current_genotype
                - regen_history
            - id: rare
              label: Rare-variant comparison
              reading: 9 alleles recorded in 1994 at under 5% are absent from the current sample
              depends:
                - passport
                - current_genotype
                - regen_history
            - id: archive
              label: Archived-subsample comparison
              reading: The archived subsample matches the current panel, not the 1994 record
              depends:
                - archive_subsample
                - current_genotype
                - regen_history
            - id: viability
              label: Germination panel
              reading: Germination 91%, and the store has held minus 18 for 28 years
              depends:
                - germination
                - vault_log
          independent:
            - viability
          commit: Correct it
        answerText: The genetic channels share repeated small grow-outs. Keep the viability channel. It shows storage succeeded even while regeneration changed allele frequencies.
        why: "Three genetic comparisons depend on the same regeneration history, so their agreement is not three independent causes. The viability panel does not share that path. It rests on germination tests and the vault record, and it says the seed remained alive. Opening the dependencies therefore separates two claims: storage preserved viability, while repeated small grow-outs altered allele frequencies. Discarding the viability evidence would throw away an independent result. Ignoring the shared grow-out path would count one causal exposure several times."
      - group: LAB
        task: Say what this does to the rust screen
        title: What the screen may not find
        place: Molecular Laboratory
        scene: Nakagawa is screening 50 accessions for a second resistance gene. 22 are on the drifted list, but their marker controls are clean. She wants to know what a negative result from those accessions is still allowed to mean.
        guide: >-
          Four readings of what drift does to a screen. Ask of each whether it acts on
          negatives, positives, or both. Drift can remove an uncommon allele, so a clean
          negative now has two histories and the marker cannot tell them apart. Drift
          does not invent the target, so positives survive. The remedy is different
          material rather than a different marker.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - an allele that is uncommon in a population may be missing from a small sample of it
        takeaway: A screen finds what is in front of it, and what is in front of it is what survived the last grow-out.
        format: CHOICE
        question: What does the drift mean for the screen?
        why: "Drift can remove an allele that was uncommon in the original population. A clean negative from a drifted accession therefore has two explanations: the allele was never present, or it was present and disappeared during regeneration. The marker cannot distinguish those histories. A positive remains useful because drift does not invent the target allele. The remedy is not a different marker. It is to test material that has avoided the bottleneck, or to compare with older archived material when that exists."
        choices:
          - A negative result on those accessions no longer proves absence
          - The screen will produce false positives on the drifted material
          - The screen has to be redesigned around different markers
          - Nothing, since resistance genes are under selection and are retained
        answer: A negative result on those accessions no longer proves absence
        rebuttals:
          - Drift removes alleles rather than inventing them, so positives are unaffected.
          - The markers work; what has changed is the population they are being run on.
          - Nothing in a vault selects for rust resistance, so there is no reason for it to be retained.
      - group: VAULT
        task: Say what the vault can still be trusted for
        title: What the store did right
        place: Seed Vault
        scene: Qureshi wants one sentence for the board that names the failed process rather than the room it happened near. The vault temperature log covers 28 years without an excursion, and current germination remains strong in the affected packets.
        guide: >-
          Five signed statements, and three verifications. Every one of them is somebody's
          record rather than a condition you have observed, so decide which two would hurt
          most if the paper were wrong, and check those. A claim can only be held once it
          has been verified. Holding the whole critical list is not caution, because two of
          these are backed by evidence taken this week.
        background:
          - >-
              What a signature records. It records who is answerable for a statement, and
              nothing about whether the statement is true. The two come apart exactly where
              nobody looked, which is why the verifications are fewer than the claims — an
              audit with time for everything measures nothing about where you chose to look.
          - >-
              Why the freezer is the wrong suspect. Cold storage slows deterioration, and a
              continuous logger trace with calibration certificates behind it is about as
              good as institutional evidence gets. Germination in the affected packets is
              strong, which is what a working freezer looks like from the outside.
          - >-
              What a grow-out record has to say. A regeneration is a sampling step, so the
              two things that decide whether it preserved the accession are how many plants
              contributed and whether they were isolated from foreign pollen. Both are
              written down by the person who did the work, on the day, or not at all.
        assumes:
          - a store preserves what it is given rather than improving it
        takeaway: Storage held what it was handed; the loss happened in the field, on the way back in.
        format: ATTEST
        question: Which of these signed claims cannot be held, given what the evidence actually supports?
        answerText: The two grow-out claims. The 1994 regeneration has no plant count on its sheet and the 2003 grow-out has no isolation record, and both are critical to whether the accession came back intact.
        why: The freezer claim is critical and backed — 28 years of continuous logger trace, calibrated, with strong germination in the affected packets to match. The two grow-out claims are critical and unbacked, and they are where a collection actually loses alleles: a regeneration is a sampling step, so a missing plant count means nobody can say how large the sample was, and a missing isolation record means nobody can say whose pollen it received. Both were signed by people who were doing the work correctly as far as anyone knows, which is the point. A signature records who is answerable, not what happened. Naming this a storage failure sends money to the one piece of equipment that did its job.
        attest:
          checks: 3
          moral: The vault kept every promise it made about temperature. What nobody has evidence for is the fortnight the seed spent out of it.
          claims:
            - id: cold
              label: The vault held −18 °C continuously from 1996 to 2024
              signedBy: Mbaye, store manager
              evidence: Continuous logger trace, two calibration certificates, no excursion over 0.4 °C
              critical: true
              backed: true
            - id: count
              label: The 1994 accession was regenerated from at least 200 plants
              signedBy: field officer, 1994 season
              evidence: Grow-out sheet has the date and the plot but no plant count; the field book for that fortnight is missing
              critical: true
              backed: false
            - id: isolation
              label: Each regeneration was pollen-isolated to the ring plan
              signedBy: nursery lead, 2003 season
              evidence: No isolation-distance entry for the 2003 grow-out; the neighbouring plot grew a modern line that year
              critical: true
              backed: false
            - id: germ
              label: Germination in the affected packets is above 85 per cent
              signedBy: seed testing bench, this month
              evidence: Assay run this week, 400 seeds, 91 per cent
              critical: false
              backed: true
            - id: passport
              label: The passport record has been unchanged since collection
              signedBy: data officer
              evidence: Catalogue export shows no edits to the accession row
              critical: false
              backed: true

  # ---------------------------------------------------------------- day 10
  - title: What is left to work with
    objective: Rebuild the season's plan around material that has not been through a bottleneck.
    briefing: The vault is one copy. The other one is in a field 40 miles away.
    stake: >-
      Friday. The finding is written up and the season has to be planned again around it. 22 of
      the 50 screening candidates cannot be trusted now. The ground is already committed. One
      source of material is left outside the vault. Idris Fenn has 4 landraces on his farm. He
      has grown them every year, and his own weather has done the selecting. Fenn is willing to
      hand them over. Volpe points out, not unfairly, that none of this changes what is already
      in seed increase. Today you decide what the rust screen is run on.
    takeaway: A collection kept in one place is one copy, however carefully it is kept.
    stops:
      - group: POP
        task: Say what on-farm material offers
        title: The other copy
        place: Genetic Resources Office
        scene: Fenn’s 4 landraces descend from populations sampled for Wellmere in 1994. His family has grown them every year since then, usually as large fields. The vault copies have been regenerated only twice, each time through much smaller grow-outs.
        guide: >-
          Four things the farm copy might have. Ask of each whether it is a claim about
          age or about population size. Fenn's seed is not unchanged since 1994: his
          soil, weather and disease have selected it every year. What it avoided is a
          grow-out of dozens standing in for thousands.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a population in cultivation continues to be selected by where it is grown
        takeaway: Material that never stopped growing has never been through a sampling step.
        format: CHOICE
        question: What does Fenn's seed have that the vault's does not?
        why: "Fenn’s seed is not unchanged since 1994. His soil, weather, disease and seed saving have selected it every year. What it has avoided is the vault’s small-sample bottleneck: a field contains thousands of contributing plants instead of dozens. Rare alleles lost by drift in the stored copy may therefore persist on the farm. The two conservation strategies preserve different things. Ex situ storage slows evolutionary change; in situ cultivation keeps a large population evolving under its local environment."
        choices:
          - It has not passed through a small sample twice
          - It is younger and therefore germinates better
          - It has been selected for the traits Wellmere wants
          - It carries more alleles than it did in 1994
        answer: It has not passed through a small sample twice
        rebuttals:
          - Fresh seed germinates better and that is not what the screen needs from it.
          - His selection is for his farm, and it is a change rather than an improvement.
          - No population gains alleles by being grown; mutation is far too slow to matter here.
      - group: VAULT
        task: Order what a regeneration standard has to fix, most binding first.
        title: What a grow-out has to be from now on
        place: Seed Vault
        scene: |-
          Qureshi has to write a standard that survives the next 20 years and the next 4 season leads. The ground available does not change and the collection does not shrink.
        guide: >-
          All four clauses will be in the standard, so the order is about what cannot be
          recovered. Ask of each whether later care could put it back. An allele never
          sampled into the new seed is gone whatever else is done well. Pollen from next
          door can be tested for afterwards. And a record protects the next curator
          rather than this seed.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency: each
              step is here because the one before it has already happened, or has to have.
              One transposed pair falsifies that claim wherever it sits, so partial credit
              would be credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained
              by having nothing before or after them, which usually makes them the two you
              can settle from the scene alone. Pinning them collapses the remaining
              arrangements sharply, and what is left in the middle is where the actual
              judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the
              only one. An order can run on cost, on risk, or on reversibility — every
              observation that leaves the sample as it was, before any that consumes it. On
              those boards a chronological reading finds nothing, because none of the steps
              has to happen at a particular hour.
        assumes:
          - the effective size of a grow-out depends on how many plants contribute
        takeaway: A standard is what survives the person who wrote it, so it has to name a number.
        format: SEQUENCE
        why: The minimum contributing population comes first because no later care can restore an allele that was never sampled into the new seed. Isolation then prevents pollen from another accession entering the grow-out. Even harvesting protects the effective size promised by the plant count; a few prolific plants should not supply most of the seed. Finally, the record preserves what actually happened for the next curator. A durable regeneration standard therefore controls population size, gene flow, contribution balance and provenance rather than only producing seed that germinates.
        cards:
          - The minimum number of contributing plants, written as a number.
          - Isolation, so a grow-out is not pollinated by its neighbours.
          - Even harvesting, so no plant contributes far more seed than another.
          - The record of what was actually grown, plot by plot.
        order: [0, 1, 2, 3]
        axis: Order the four clauses by what is lost for good if the standard omits it. These are not steps in a season — they are the things a written standard has to name, and one of them cannot be recovered by any later care.
        ends: [Unrecoverable if omitted, Recoverable later]
      - group: TRIAL
        task: Spend the ground you can free without spending the trial's ability to answer.
        title: Ground that is already committed
        place: Field Laboratory
        scene: |-
          Every plot is allocated. Quiroga can take the guard rows out of the yield trial, shorten the plots, or drop the fourth replicate. Each buys ground and costs something different.
        guide: >-
          The yield trial is 240 plots: 60 lines in four replicates. Guard rows take
          about 8 per cent of the area and stop plots borrowing light and water from
          their neighbours. Shortening every plot by a fifth frees 20 per cent and
          raises the error variance, because a short plot samples less ground. Dropping
          the fourth replicate frees a quarter and removes most of the trial's power to
          separate lines that differ by under half a tonne. The screening material needs
          the equivalent of 30 plots, and the headlands and the spare block are outside
          the measured trial.
        rules: >-
          Spread the hundred points across the 4 proposals. At least 80 of them have to
          be committed, because a panel that funds almost nothing has not decided
          anything. Your largest single allocation must be 35 or more, and it has to
          land on what the evidence supports most. Keep the total sitting on proposals
          the evidence does not support under fifteen. And a proposal it does support
          should not be left under twenty.
        background:
          - >-
              Why the whole spread is graded. Funding is not a vote for one idea. A
              portfolio says what you think is likely, what is worth hedging against, and
              what is not worth pursuing at all — and the last two are where most of the
              information is. Backing the right proposal while quietly funding a bad one is
              a worse answer than it looks. That is why the small numbers count as much as
              the big one.
          - >-
              What the three numbers are for. Thirty-five is what makes a lead a lead: below
              it you have hedged rather than chosen. Fifteen is the most that can sit on
              unsupported work before it stops being a rounding error. Past that it is a
              second opinion nobody argued for. Twenty is the floor under a line of work you
              have already called strong, because funding it too thin to finish spends the
              money and buys nothing.
          - >-
              Why there is a floor on the total. Points held back are not caution; they are
              a decision not to decide, taken with somebody else's money and somebody else's
              deadline. The floor is what forces the panel to say something.
        assumes:
          - a trial's precision depends on its replication and its plot size
        takeaway: Ground taken from a trial is taken from what the trial can say, and which part is a choice.
        format: SCIENCETANK
        why: The first place to find ground is outside the measured yield trial. Headlands and spare block can hold a screening nursery that mainly needs many plants and reliable inoculation. If more ground is still needed, shortening every plot spreads a modest precision cost across the trial. Dropping a replicate removes an entire independent comparison. That weakens small yield differences. Removing guard rows is worse because vigorous plots can borrow light and water from neighbours, quietly biasing every comparison. Different cuts therefore sacrifice different kinds of evidence.
        proposals:
          - label: A
            text: Shorten every plot by a fifth, keeping all four replicates.
          - label: B
            text: Take the screening nursery onto the headlands and the spare block.
          - label: C
            text: Drop the fourth replicate across the whole trial.
          - label: D
            text: Remove the guard rows between plots.
        recommended:
          B: 55
          A: 30
  # ---------------------------------------------------------------- day 11
  - title: A week when the work is just the work
    objective: Sow the ground, and do the things that only get done when nothing is wrong.
    briefing: The drill is in the field and the forecast is kind.
    stake: >-
      Monday of the third week, and for once there is nothing to argue about. The trial is
      drilled. The screening nursery is in on the headland. Fenn's 4 landraces went in on
      Saturday. The forecast is a fortnight of ordinary weather. Cloud sits on the ridge north
      of the shelterbelt and nothing else is in the sky. Wren Ashworth, the genebank technician,
      has the vault door open and a backlog of packets to re-bag. Toft is out with the canopy
      meter, because this is the week the readings are worth taking. Today you spend a quiet
      week on the jobs a busy week makes impossible.
    takeaway: A quiet week is when the work that has no deadline finally gets done.
    stops:
      - group: DRY
        task: Take the readings that need a growing crop
        title: Measuring while it is still happening
        concept: Canopy, flowering time and the traits that build a yield
        place: Drying & Processing Hall
        scene: Toft can measure canopy cover this week, while every plot is still green, or wait for yield in August. The board already records flowering date and soil-water status, but several canopy measurements are about to disappear with leaf senescence.
        guide: >-
          Two days of somebody's time, and a list of measurements that cost more than that
          between them. Buy the ones that would change what the station does, not the ones
          that would be interesting to have. Two of these can only be taken this week; the
          others will still be available in August, which is a different kind of cost.
        background:
          - >-
              What makes a measurement decisive. Not how precise it is, and not how much it
              tells you — whether the answer changes a decision. A reading that comes out either
              way and leaves the same next step is worth buying last, however good the
              instrument.
          - >-
              Why the same axis twice is the mistake. Two measurements of the growing canopy
              tell you nearly the same thing, so the second one buys precision rather than
              information. Spending the whole two days on one axis is how a season ends with a
              beautifully characterised canopy and no idea what the roots did.
          - >-
              Why some of it cannot wait. Canopy cover and green leaf area stop existing at
              senescence, and no August measurement reconstructs them. Yield can be measured
              later by definition. That asymmetry, not the relative interest of the numbers, is
              what should decide this week.
        takesAsRead:
          - "Resource allocation: defence, growth and yield out of one budget"
        assumes:
          - a crop's final yield is built up over the whole season
        takeaway: A measurement taken after the fact records an outcome; one taken during it can explain the outcome.
        format: VALUE
        question: Two days of field time this week. Which measurements are worth taking, and which would only be interesting?
        answerText: Canopy cover and the root-depth cores. Both decide something — whether the dry-finish advantage came from interception or from water access — and both stop being possible when the crop senesces.
        why: A measurement earns its cost by changing a decision. Canopy cover during grain fill and a root core at depth answer different halves of one question — whether WM-712's dry-season advantage comes from intercepting more light or from reaching more water — and the answer decides which trait the programme selects for next season. Both disappear with senescence. Grain moisture and thousand-grain weight are real numbers that will still be available in August, so buying them this week spends a scarce day on an abundant measurement. And a second canopy index buys precision on an axis already covered, which is the commonest way a measurement budget is wasted: two readings of the same thing feel like twice the evidence and are not.
        value:
          budget:
            amount: 2
            unit: field days
          decision: which trait to select for in next season's dry-finish nursery
          options:
            - id: canopy
              label: Canopy cover across all four replicates, this week
              cost: 0.75
              axis: light interception
              decisive: true
              reveals: whether the advantage is more light intercepted during filling
            - id: roots
              label: Root cores to 1.4 m on the two dry-finish plots
              cost: 1.0
              axis: water access
              decisive: true
              irreversible: true
              reveals: whether the advantage is water reached below 1 m
            - id: index
              label: A second canopy index with the handheld sensor
              cost: 0.5
              axis: light interception
              reveals: the same interception story, to two decimal places
            - id: moisture
              label: Grain moisture on every plot
              cost: 0.5
              axis: harvest logistics
              reveals: the drying schedule, which August will also tell you
            - id: tgw
              label: Thousand-grain weight, plot by plot
              cost: 0.75
              axis: harvest logistics
              reveals: how the ear filled, measurable any time after harvest
          commit: Commit the two days
      - group: VAULT
        task: Keep the worsening vault problem and delegate the other two with an owner, first action and return condition.
        title: Three jobs, one still damaging seed
        place: Seed Vault
        scene: Ashworth has 400 packets with failed foil seals, a viability-testing schedule 3 months behind, and a stack of faded labels still recoverable from shelf positions. The vault is quiet this week, and three staff roles are available.
        guide: >-
          Three jobs, three staff roles, and one you keep yourself. For each handoff,
          name the owner, the first real action, and what brings the problem back to
          you. One of these three is still damaging seed while you decide, which is what
          should decide the order rather than how large each backlog is.
        background:
          - >-
              Which one is getting worse. Four hundred failed foil seals are letting
              moisture into seed right now, and every day of that is viability that cannot
              be recovered. The testing backlog is three months old and stable. Faded labels
              are recoverable from shelf positions and will still be recoverable next week.
          - >-
              Why a first action is required. 'Sort out the seals' is a wish. 'Reseal in
              batches of fifty, starting with the accessions with no duplicate elsewhere' is
              a task somebody can begin without asking you anything.
          - >-
              What a return condition looks like here. Not a status meeting. A rule: any
              packet whose seed shows visible moisture damage comes to you rather than being
              resealed, because that is a viability decision rather than a repair.
        assumes:
          - moisture exposure accelerates deterioration of stored orthodox seed
          - a viability test measures condition but does not repair it
        takeaway: Urgency depends on whether damage is still accumulating and reversible; a handoff is complete only with an owner, first action and return condition.
        format: DELEGATE
        question: Which problem stays with you, and what complete handoffs do the other two receive?
        delegate:
          hint: Keep the problem whose biological damage is still accumulating. A delegated job is accepted only when it has an owner, a first action and a condition that brings it back.
          team:
            - id: player
              label: player
            - id: seed_test
              label: seed_test
            - id: records
              label: records
          people:
            - id: player
              label: Season Lead
            - id: vault_tech
              label: Vault technician
            - id: seed_test
              label: Seed-testing technician
            - id: records
              label: Records technician
          problems:
            - id: failed_seals
              label: Packets with failed foil seals
              trend: rising
              irreversible: true
              loud: false
              stable: false
              rate: moisture exposure continues while a failed packet remains unsealed
              consequence: seed ageing can accelerate before the next viability test
              owner: player
              firstAction: Pull the failed-seal packets into a dry handling batch and begin re-bagging
              returnCondition: Return only when every failed packet is sealed and its exposure is logged
              delegable: false
            - id: viability_backlog
              label: Three-month viability-testing backlog
              trend: stable
              irreversible: false
              loud: true
              stable: true
              rate: the knowledge delay grows, but the test itself does not change the seed
              consequence: curators have older information about which lots are approaching regeneration thresholds
              owner: seed_test
              firstAction: Start with accessions closest to their regeneration threshold
              returnCondition: Return any accession at or below its action threshold immediately
              delegable: true
            - id: faded_labels
              label: Faded packet labels
              trend: stable
              irreversible: false
              loud: false
              stable: true
              rate: identity remains recoverable while packets stay in recorded shelf positions
              consequence: moving an unresolved packet could turn a recoverable record problem into lost provenance
              owner: records
              firstAction: Resolve each label against shelf position and catalogue before moving it
              returnCondition: Return any packet whose identity cannot be resolved from independent records
              delegable: true
          first: failed_seals
          firstActions:
            - id: a1
              label: Pull the failed-seal packets into a dry handling batch and begin re-bagging
            - id: a2
              label: Start with accessions closest to their regeneration threshold
            - id: a3
              label: Resolve each label against shelf position and catalogue before moving it
        answerText: Keep the failed-seal response. Delegate the viability backlog to seed testing and the faded labels to records, each with a first action and a clear return condition.
        why: A failed seal is the only problem that is actively changing the seed. Moisture can enter now, and ageing caused by that exposure cannot be undone later. The viability backlog is loud but stable; it delays knowledge rather than causing the decline it measures. Faded labels are also stable while shelf positions still recover identity. The season lead should therefore keep the failed-seal response and delegate the other work completely. Delegation protects attention without turning the quieter jobs into forgotten work.
      - group: CROSS
        task: Order what has to happen to make a controlled cross.
        title: The fortnight when it is possible
        place: Crossing Hall
        scene: |-
          Crossing needs the female parent before the anthers shed and the male in flower on the same morning. Bengtsson has the 2 parents at the right stage for about 11 days.
        guide: >-
          All four steps will happen inside one fortnight, and flower biology forces the
          order. Ask of each what would already be too late. Anthers shed pollen, so a
          head left open can pollinate itself before the intended cross begins. And the
          label is not clerical: without it the seed grows perfectly and nobody knows
          the father.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency: each
              step is here because the one before it has already happened, or has to have.
              One transposed pair falsifies that claim wherever it sits, so partial credit
              would be credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained
              by having nothing before or after them, which usually makes them the two you
              can settle from the scene alone. Pinning them collapses the remaining
              arrangements sharply, and what is left in the middle is where the actual
              judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the
              only one. An order can run on cost, on risk, or on reversibility — every
              observation that leaves the sample as it was, before any that consumes it. On
              those boards a chronological reading finds nothing, because none of the steps
              has to happen at a particular hour.
        assumes:
          - a plant can only be crossed while its flowers are at the right stage
        takeaway: Some work has a window rather than a deadline, and the window is set by the plant.
        format: SEQUENCE
        why: The order is forced by flower biology. Anthers must be removed before they shed pollen, or the female can self-pollinate before the intended cross begins. The head is bagged immediately so stray pollen cannot enter. Pollen from the chosen male is collected when it is ready, transferred to the receptive female, and the head is re-bagged. The label then records both parents and the date. Without that provenance, seed may grow perfectly while the breeder no longer knows who its father was.
        cards:
          - Open the female floret and remove its anthers before they shed.
          - Bag the head, so nothing else can reach it.
          - Collect pollen from the chosen male parent at flowering.
          - Transfer the pollen, re-bag, and label with both parents and the date.
        order: [0, 1, 2, 3]
  # ---------------------------------------------------------------- day 12
      - group: DRY
        task: Sort the harvest bags before the store closes.
        title: Bagged, or open to the wind
        concept: "Controlled crossing: emasculation, bagging and knowing the father"
        place: Drying & Processing Hall
        scene: The threshing floor has two hours of bags to clear and one store manager. A bagged head was pollinated by itself under a paper cover. An open head took whatever the wind brought.
        guide: >-
          Two bins, and the question is what fathered the seed in the bag. A head that was
          bagged before it flowered can only have pollinated itself. A head left open took
          pollen from whatever was flowering upwind. Sort on that, not on the label wording.
        background:
          - >-
              Why it matters at the store door. Selfed seed is a known quantity: its two copies came
              from one plant, so a line stays a line. Open-pollinated seed carries an unknown father
              and cannot be treated as the same accession, however good it looks in the bag.
          - >-
              Why the wording will not do it for you. Both bins contain bags marked with the same
              words — covers, sleeves, sheets and skirts appear on both sides — because a cover put
              on after flowering is not a cover at all.
        assumes:
          - a flower can be pollinated by its own plant or by another one
        takeaway: What fathered a seed is decided before the flower opens, not by what the bag says.
        format: BELT
        question: Send each bag to the bin that says what fathered its seed.
        answerText: Anything covered before the flower opened is selfed and keeps its line. Anything open at flowering took an unknown father, whatever went over it afterwards.
        why: >-
          The bin a bag belongs in is decided by one moment: whether the head was isolated
          before its flowers opened, not whether anything was over it at harvest. A bag put on
          the day before flowering keeps the line — the two copies in every seed came from one
          plant, and next season's row will be what this row was. A head that was open at
          flowering took pollen from whatever was upwind, which at Wellmere means the trial
          plots eighty metres away, and no cover applied afterwards changes it. That is why
          the words on the labels are no help and are not meant to be: covers, sleeves and
          sheets appear on both sides of the floor. The date is the category.
        belt:

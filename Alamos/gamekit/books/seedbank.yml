  - title: The rust arrives
    objective: Find a second resistance gene, in a collection that may no longer have one.
    briefing: 200 kilometres in 4 days, and WM-712 is in the ground.
    stake: >-
      Tuesday. The wind has come round off the foothills. The new race of rust is 200 kilometres
      closer than it was on Friday. There are pustules on the screening nursery this morning.
      WM-712's sister lines are in that same nursery. One resistance gene is not holding. Volpe
      was right in March about the season, and she has stopped arguing. Nakagawa's screen of the
      50 candidates has come back with 2 hits. Ivanescu can tell you what is wrong with both of
      them. Today you find out what the collection can still offer.
    takeaway: The insurance was bought decades ago by people who did not know what for, and only some of it survived.
    stops:
      - group: LAB
        task: Spend the two evidence credits on checks that can change which positive accession receives the single increase slot.
        title: Which positive is worth the screenhouse slot
        place: Molecular Laboratory
        scene: 2 of 50 accessions carry a different resistance marker, and the screenhouse can increase only one this season. One seed vial is visibly thin and the other is full. Nakagawa has records and tests available before the slot is committed.
        guide: >-
          Two positives, one screenhouse slot, and records and tests available before
          you commit. Open each piece of evidence and ask what it would change about
          which accession to increase. One vial is visibly thin and the other is full,
          which is a fact about how much seed there is rather than about which marker
          matters.
        background:
          - >-
              Why the thin vial is the awkward one. Increasing an accession that has little
              seed left is the most valuable thing the screenhouse can do, because that
              material is closest to being lost. It is also the riskiest, since a failed
              increase spends the last of it.
          - >-
              What evidence would actually change the choice. Whether the marker in each
              accession is the one that confers resistance, whether the thin vial's seed is
              still viable, whether either accession is duplicated elsewhere. Any of those
              can flip the decision; a repeat of the marker screen cannot.
          - >-
              Why buying evidence beats choosing carefully. The slot is committed for the
              season, and a wrong choice cannot be corrected until next year. That asymmetry
              is what makes a test worth its cost here.
        assumes:
          - a regeneration can change allele frequencies by sampling
          - a small viable seed lot can sometimes be increased without first using it in a field trial
        takeaway: The best measurement is the one that can change the decision, not the one that produces the most detailed description.
        format: VALUE
        question: Which evidence is worth buying before choosing the accession to increase?
        value:
          decision: Which marker-positive accession should receive the single screenhouse increase slot?
          budget:
            amount: 2
            unit: evidence credits
            label: Checks available before the slot is committed
          hint: Buy evidence that could change which accession deserves the scarce increase slot. A precise answer to a side question can still be poor value.
          options:
            - id: history
              label: Audit regeneration history
              cost: 1
              axis: genetic integrity
              decisive: true
              reveals: The thin-vial accession has never been regenerated. The full-vial accession has been regenerated three times and is on the drifted list.
            - id: seed_count
              label: Count viable seed in the thin vial
              cost: 1
              axis: increase feasibility
              decisive: false
              reveals: 11 grams is roughly 300 viable seeds, enough for a careful protected increase.
            - id: repeat_marker
              label: Repeat the resistance-marker screen
              cost: 2
              axis: assay repeatability
              decisive: false
              reveals: Both positive calls repeat with clean controls; the repeat does not tell which accession still represents its original population.
            - id: yield_trial
              label: Run a small field-performance comparison
              cost: 3
              axis: agronomic performance
              decisive: false
              reveals: A one-season yield difference would not establish which seed lot has preserved the accession's original genetic variation.
          best:
            - history
            - seed_count
        answerText: "Buy the regeneration-history audit, with the seed-count check if budget remains. Increase the unregenerated accession: its 11 g is roughly 300 seeds, enough for a careful increase."
        why: The decision is not which accession has more seed today. Seed quantity can be repaired by one careful increase if enough viable seed remains. The harder issue is genetic integrity. The regeneration-history audit shows that one positive has never passed through a grow-out. The abundant one was regenerated three times and belongs to the drifted group. A repeat marker or small yield test may add detail, but neither restores the original population. Evidence is valuable when it changes which source deserves the scarce increase slot.
      - group: POP
        task: What happened to the resistance in this accession?
        title: What was lost, and when
        place: Genetic Resources Office
        scene: |-
          Ivanescu has the 1994 field notes for the drifted accession. The collector recorded rust on the crop and noted that about 1 plant in 20 stayed clean. Today's sample has none.
        guide: >-
          Five readings, and two of them are absences of selection: clean nurseries and
          small contributor counts. Ask of each candidate how many of the five it fits.
          Five per cent of plants is uncommon, and a sample of thirty misses an uncommon
          type surprisingly often. Three grow-outs are three chances to lose it.
        background:
          - >-
              Why the unremarkable readings decide it. The salient reading is what draws
              attention, and it is usually consistent with several explanations at once,
              which is why it rarely settles anything. The readings that discriminate are
              the ones a candidate predicts should have moved and which have not: a normal
              value is a positive result against every mechanism that would have disturbed
              it.
          - >-
              How to work the candidates. Take each mechanism and predict the panel it
              implies before you look at the panel again — which readings it drives, in
              which direction, and by roughly how much. Then compare. Working that way round
              is what separates a diagnosis from a rationalisation, because the prediction
              is made before the data is consulted.
          - >-
              Why only one candidate survives. Several will account for part of the panel,
              deliberately so, and a partial fit is exactly what a confident wrong answer
              feels like from the inside. When two remain, look for the reading on which
              their predictions differ and let it decide. If no reading separates them you
              have not finished reading the panel.
        assumes:
          - an allele present at low frequency can be lost when a population is sampled
        takeaway: An allele that has vanished was not necessarily destroyed; it may only have failed to be picked.
        format: DIAGNOSIS
        answerText: The evidence supports loss by drift during repeated small grow-outs. The old note shows the resistant phenotype was rare, not that the allele frequency was exactly 5%.
        why: The 1994 field note says about 5% of plants showed the resistant phenotype. That is not automatically a five-per-cent allele frequency. Dominance and genotype frequencies matter. It still tells us the resistant type was uncommon. If 5% of plants show it, a random sample of 30 has about a 21% chance of missing it entirely. Repeated small grow-outs create repeated opportunities for that loss. The clean nurseries provide no selection that would reliably preserve the resistance.
        headline: The 1994 notes describe resistant plants in this accession. The 2026 sample has none.
        readings:
          - zone: 1994 notes
            label: Resistant plants observed
            value: about 1 in 20
            status: normal
          - zone: Today
            label: Resistant plants in sample
            value: none in 300
            status: alarm
          - zone: Regeneration log
            label: Grow-outs since 1994
            value: three
            status: alarm
          - zone: Grow-out size
            label: Contributing plants each time
            value: 20 to 40
            status: alarm
          - zone: Selection
            label: Rust present at grow-outs
            value: never
            status: normal
            note: grown in a clean nursery
        choices:
          - label: Drift removed it across three small grow-outs
            mechanism: An allele at 5% has a real chance of missing a sample of 33 times over.
          - label: The 1994 collector recorded it wrongly
            mechanism: A mistaken note would not be consistent with the rest of that collection trip.
          - label: The resistance was selected against during the grow-outs
            mechanism: Selection against a gene needs something acting on it, and the nurseries were clean.
          - label: The allele is present and the marker cannot detect it here
            mechanism: A marker failure would show in the controls, which came out correct.
        answer: Drift removed it across three small grow-outs
      - group: VAULT
        task: Say where the rest of the collection's insurance is
        title: The copy that was never in the vault
        place: Seed Vault
        scene: Fenn’s landraces are established in the station plots. His family has grown one of them continuously since before Wellmere existed, in a district where rust arrives most years. The vault copy of the same old population has been regenerated only in clean nurseries.
        guide: >-
          Four reasons the field copy might hold what the vault lost. Ask of each
          whether it names a mechanism. Freshness and quantity are not mechanisms. Rust
          arriving every year means plants with useful resistance leave more seed, which
          is selection. The clean nursery gave resistance no advantage at all, and rare
          variants drifted.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a population growing where a disease occurs is being selected by it every season
        takeaway: A population kept in cultivation keeps being tested by the thing you might one day need it for.
        format: CHOICE
        question: Why is Fenn's field likely to hold what the vault lost?
        why: "Fenn’s population has faced rust repeatedly, so plants carrying useful resistance can leave more seed in infected years. That changes allele frequencies through natural and farmer-mediated selection. The clean vault grow-outs did something different: without rust, resistance had no selective advantage and rare variants could disappear by drift. The farm population is not a frozen copy of 1994, but it may retain or enrich alleles the ex situ copy lost. In situ and ex situ conservation therefore preserve different evolutionary histories."
        choices:
          - Rust has selected it every year the vault was standing still
          - His seed is fresher and therefore more genetically complete
          - He has more seed than the vault has of that accession
          - Farm-saved seed mutates faster than stored seed
        answer: Rust has selected it every year the vault was standing still
        rebuttals:
          - Freshness affects germination and has nothing to do with which alleles are present.
          - Quantity is not the issue; the vault has plenty of a population that has lost the gene.
          - Mutation is far too rare to restore an allele in 30 years.
  # ---------------------------------------------------------------- day 13
  - title: Three things before the drill
    objective: Rank a nursery, a merchant and a phone call.
    briefing: The rust is here, the merchant wants an answer, and the seed increase is halfway.
    stake: >-
      Wednesday, and three things need deciding before the drill goes out at two. The screening
      nursery is infected. Nakagawa can score it today, or lose the reading to fungicide drift
      from the farm next door. The merchant wants WM-712 confirmed or cancelled by 5. There are
      already 40 tonnes of its seed in store. And Fenn has rung. He has rust in the field his
      landraces are in. That is either a disaster or the most useful thing that has happened all
      season. Today you decide the order and live with it.
    takeaway: Three urgent things are three decisions, and the order is one of them.
    stops:
      - group: TRIAL
        task: Decide what gets done first
        title: What cannot be done later
        place: Field Laboratory
        scene: The nursery can be scored this afternoon or not at all because neighbouring fungicide drift reaches it tomorrow. The merchant wants an answer by five. Fenn’s infected field will still be there tomorrow, and the seed-increase arithmetic can be done later.
        guide: >-
          Four jobs, and the rail is not a clock. Order them by how soon each one stops being
          possible at all, soonest first. Every one of them is available right now; what
          separates them is which ones will still be available tomorrow, and a job that can
          be done any time belongs at the end however loudly it is being asked for.
        axis: Order the four by how soon each one stops being possible, soonest first. This is not a clock — everything here can be started this afternoon, and the question is what is still available tomorrow.
        ends: [Stops being possible today, Available any time]
        background:
          - >-
              Why urgency and irreversibility are different. The merchant's five o'clock is a
              deadline somebody set and can move. Fungicide drift arriving on the nursery is a
              deadline the weather set, and after it the scores that would have distinguished
              the resistant seedlings do not exist to be taken.
          - >-
              What a lost measurement costs. A drifted nursery does not give a wrong score, it
              gives a clean-looking one — every seedling protected, no discrimination between
              them, and a season's screening spent. Nothing later recovers it, because the
              plants were the instrument.
          - >-
              Why the arithmetic goes last. A seed-increase calculation uses numbers that are
              already recorded and will still be recorded tomorrow. It feels productive and it
              is the only item on this list with no expiry, which is exactly why it is the one
              to do in the evening.
        assumes:
          - some measurements are only available while conditions last
        takeaway: What goes first is what stops being possible, not what is loudest.
        format: SEQUENCE
        question: Order the four jobs by how soon each stops being possible.
        cards:
          - Score the seedling nursery before the fungicide drift reaches it
          - Tag the clean plants in Fenn's infected block while the rust is active
          - Give the merchant the release decision
          - Recalculate the seed-increase areas for the coming spring
        order: [0, 1, 2, 3]
        answerText: Nursery, then Fenn's block, then the merchant, then the arithmetic. The first two are measurements that expire; the last two are decisions and sums that do not.
        why: The nursery stops being an instrument the moment the drift arrives, and it stops silently — every seedling looks protected, so the screen returns a clean sheet rather than an error. That makes it first. Fenn's block is the same kind of asset with a longer fuse: the rust is active for days rather than hours, but once the infection has run its course the plants that stayed clean cannot be told from the plants that were never tested. The merchant's five o'clock is a deadline a person set, and a person can move it; the release decision loses nothing by being made at six. The seed-increase arithmetic uses numbers already in the book and will be exactly as available next week. The loudest item on the list is third, and the two that would have been quietly lost are first.
      - group: CROSS
        task: Answer the merchant
        title: 40 tonnes and a failing gene
        concept: Monoculture and a single resistance gene as one point of failure
        place: Crossing Hall
        scene: |-
          40 tonnes of WM-712 seed exists. Its single resistance gene is being beaten 200 kilometres away and in Wellmere's own nursery this morning. It still yields 11% more in a dry year.
        guide: >-
          Four things to say to the merchant. Ask of each what it does to the forty
          tonnes that already exist. Destroying seed does not repair a gene, and no
          statement changes the genetics of what is in the shed. The risk is a variety
          sold as resistant being planted as though one failing gene were enough.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a released variety is planted over a large area at once
        takeaway: What makes a variety valuable is also what makes a single failing gene expensive.
        format: CHOICE
        question: What should Wellmere tell the merchant?
        why: The dry-year yield advantage is real, and 40 tonnes of seed already exists. Destroying it does not repair the resistance gene. The risk is that a variety sold as resistant may be planted widely as though one failing gene were enough. Naming the weakness changes management and surveillance. Adding a second gene belongs in the next breeding cycle because existing seed cannot be genetically changed today. The biology defines the trade-off, while release policy still sets what level of risk is acceptable.
        choices:
          - Release it, with the resistance stated as a known weakness
          - Release it as planned and say nothing about the rust
          - Cancel the release and destroy the seed
          - Delay the release a season and add the second resistance gene first
        answer: Release it, with the resistance stated as a known weakness
        rebuttals:
          - Silence is what produces a district planted to one failing gene.
          - 40 tonnes of a high-yielding line is worth something even where rust arrives.
          - The second gene is the plan for the next line; it cannot be added to seed already grown.
      - group: POP
        task: Decide what to do about Fenn's field
        title: An outbreak in the right place
        place: Genetic Resources Office
        scene: Fenn’s landraces are carrying rust in the station plots, and he asks whether the whole block should be sprayed. Ivanescu has flagging tape, paper bags and plot tags ready, because some individual plants still look clean among heavily infected neighbours.
        guide: >-
          Four things differ between the clean plants and the infected ones, and the scoring
          bench will read a rust severity for whatever you set up. Change one of them and
          run it; changing several at once tells you nothing about any of them. Then put your
          suspect back the way it was and run it again, because a difference that does not
          follow the change both ways was never the cause.
        background:
          - >-
              Why the field and not the glasshouse. Resistance that matters is resistance to
              the pathogen races actually present, at the density they actually reach. A field
              with the disease in it applies that test to every plant at once and for nothing,
              which is why the clean plants among infected neighbours are the interesting ones.
          - >-
              Why one thing at a time. Any two plots differ in dozens of ways. A trial that
              moves several of them cannot say which one the reading followed, and reports
              itself as ambiguous rather than as a finding — the honest outcome, and the one
              that costs a season.
          - >-
              Why reversing it matters. Restoring the suspect and watching the reading come
              back is what separates a cause from a coincidence that happened during the same
              fortnight. Spraying the whole block removes the test before it has been run, and
              the plants that would have identified themselves stay anonymous.
        assumes:
          - a population under a disease is being selected by it
        takeaway: A field with the disease in it is the only place the useful plants identify themselves.
        format: CONTROL
        question: Which difference between the clean plants and their infected neighbours is actually keeping them clean?
        answerText: The plant's own genotype. Leave a strip unsprayed and the clean plants stay clean when everything else about their position is matched — and go down with the rest when the resistant seed is swapped out.
        why: Four things could explain a clean plant sitting among infected ones: its own genotype, the row's exposure to wind-blown spores, the fungicide overspray drifting from the neighbouring trial, and how much nitrogen that strip received. Only one of them survives being isolated. Matching position, drift and nitrogen and changing the seed alone moves the severity score from 48 to 6, and putting the susceptible seed back brings it to 44 — a response that follows the change in both directions, and eight times the trial-to-trial noise. Spraying the whole block would have removed the difference the station most needed to see. This is what standing variation means: the useful alleles were already there, and the outbreak is what made them visible.
        control:
          observable:
            label: Rust severity on the flag leaf
            unit: per cent leaf area
          variables:
            - id: genotype
              label: Which landrace seed the strip was sown with
            - id: exposure
              label: Row position relative to the prevailing wind
            - id: drift
              label: Fungicide drift from the neighbouring trial
            - id: nitrogen
              label: Nitrogen applied to the strip in March
          held:
            - sowing date
            - plot size and row spacing
            - irrigation
            - the rust race present in the block
          truth: genotype
          baseline: 48
          response: -42
          noise: 5
          hint: The scoring bench reads one strip at a time. Set what you want, run it, and watch whether the reading follows.
          run: Score the strip
          commit: Name the difference that is doing it

  # ---------------------------------------------------------------- day 14
      - group: POP
        task: Rogue the nursery to whatever the standing instruction says.
        title: What the rogueing crew is pulling today
        concept: "Selection acting on standing variation, in a field and not in a nursery"
        place: Genetic Resources Office
        scene: The rogueing crew works to one standing instruction, chalked at the end of the row. It is rewritten when the season turns, by whoever is running the nursery that morning, and nobody walks the rows to announce it.
        guide: >-
          Pull the plants the instruction currently wants and leave the rest. The chalked
          rule changes during the morning and nothing marks the moment. What is scored is
          the plants either side of a change, because they are the only ones that show
          whether the crew is reading the board or working from memory.
        background:
          - >-
              Why the instruction changes at all. Early in the season the nursery is being cleaned
              of anything that is not the line — off-types, volunteers, the wrong height. Once rust
              arrives the same crew is looking for something else entirely, and the plants that were
              being pulled an hour ago are now the ones worth keeping.
          - >-
              Why the changeover is where the damage happens. A crew that keeps pulling to the old
              rule for ten more minutes removes exactly the plants the new rule was written to save.
              Nobody notices, because a pulled plant leaves no evidence of why it was pulled.
        assumes:
          - a standing instruction can be replaced while work is still going on
        takeaway: The cost of a withdrawn instruction is paid by whoever is still working to it.
        format: SPOT
        question: Pull to the instruction on the board, and keep watching the board.
        answerText: Read the chalk, not the row. Every change leaves a few minutes in which the old rule still feels like the right one.
        why: >-
          Three instructions run across the morning and each wants a different part of the
          nursery. Off-types out, then anything flowering early, then — once the rust is in the
          block — anything showing infection, which is a rule that keeps the clean plants
          standing rather than removing them. A plant can answer two of those at once, which is
          what makes the change cost something real. The plants scored are the ones either side
          of a change, because everything else in the row is wanted by neither rule and is left
          alone correctly by somebody who has not read anything. And the damage is invisible
          afterwards: a plant pulled to a withdrawn instruction leaves a gap in the row and no
          record of why, which is why the nursery's own rule is that the chalk is read at the
          start of every row rather than at the start of the morning.
        spot:
          duration: 40
          switchEvery: 12
          pass: 0.75
          hint: The chalk at the end of the row is the instruction, and it is rewritten without announcement.
          targets:
            - id: p1
              label: Off-type, early flowering
              tags: [offtype, early]
            - id: p2
              label: Off-type, rust free
              tags: [offtype, clean]
            - id: p3
              label: True to type, rusted
              tags: [totype, rusted]
            - id: p4
              label: True to type, early
              tags: [totype, early]
            - id: p5
              label: Volunteer from last season
              tags: [offtype, volunteer]
            - id: p6
              label: True to type, clean
              tags: [totype, clean]
            - id: p7
              label: Tall off-type, rusted
              tags: [offtype, rusted]
            - id: p8
              label: Late flowering, clean
              tags: [totype, late, clean]
          rules:
            - say: Anything that is not the line
              want: [offtype]
            - say: Anything flowering early
              want: [early]
            - say: Anything showing rust
              want: [rusted]
          commit: Open the row
  - title: What goes in the crossing block
    objective: Decide what the next seven years are made of, on the last day it can be changed.
    briefing: The block is drilled tomorrow. After that the parents are fixed.
    stake: >-
      Thursday. The crossing block goes in tomorrow morning. It decides what the programme works
      on until 2033. A cross made in it is a finished line in 4 years and a release in 7. Volpe
      has her list of parents. Qureshi has hers. This year the two lists overlap more than they
      ever have. The screen found one clean source of a second resistance gene. Fenn has 40
      marked plants being threshed one at a time. There is room in the block for 8 crosses.
      Today you fix the eight. After tomorrow nothing in this season can be changed.
    takeaway: A crossing block is a decision about a decade, made in one morning with what is to hand.
    stops:
      - group: CROSS
        task: Spend eight programme slots across four crossing packages and preserve both resistance goals.
        title: Eight crossing commitments
        place: Crossing Hall
        scene: The crossing board has eight programme slots for the next two years. Volpe wants elite yield crosses, Qureshi wants unrelated resistance material brought in, and the current elite line still needs the second resistance gene. Fenn’s marked plants remain uncharacterised.
        guide: >-
          Eight slots for two years, and more requests than slots. Watch the questions
          list rather than the crossing board: it shows what the programme can still
          answer under the current plan. Every package you commit is a question you can
          answer and one you have given up, and one of the requests can wait a season
          without costing anything.
        background:
          - >-
              What 'defended' means for a breeding programme. A single resistance gene is
              defeated eventually; a line carrying two is defeated much more slowly. Getting
              the second gene into the elite line is the work that keeps everything else the
              programme has built usable.
          - >-
              Why unrelated material is worth slots at all. Bringing in resistance from an
              unrelated source is slow and produces nothing marketable for years. It is also
              the only way to have a third gene when the second one fails, which is a
              decision about the decade rather than the season.
          - >-
              Why uncharacterised marked plants are a trap. They may be carrying exactly
              what is needed or nothing at all. Committing slots to them before
              characterisation is spending the block on a question that a cheap test could
              answer first.
        assumes:
          - crosses consume greenhouse, generation and follow-up capacity for several seasons
          - closely related elite parents share more of the same genetic vulnerabilities
        takeaway: A breeding plan is a finite set of genetic questions it chooses to answer, and every crossing commitment delays another.
        format: ALLOCATE
        question: Which crossing packages keep the programme defended without spending the block on work that can wait?
        allocate:
          hint: The live panel shows which breeding questions each package answers. Protect the required resistance questions before spending remaining capacity on useful but deferrable work.
          pool:
            amount: 8
            unit: programme slots
            label: Crossing commitments available
          items:
            - id: backcross_second
              label: Four-generation second-gene backcross programme
              cost: 4
            - id: unrelated_two
              label: Cross the unregenerated accession onto two unrelated elite backgrounds
              cost: 2
            - id: elite_yield
              label: Elite-to-elite yield-cross package
              cost: 4
            - id: fenn_explore
              label: Exploratory package using uncharacterised Fenn plants
              cost: 3
          answers:
            - required: true
              requires:
                - backcross_second
              question: Can the current elite background receive the second resistance gene?
            - required: true
              requires:
                - unrelated_two
              question: Can the resistance programme move into unrelated genetic backgrounds?
            - required: false
              requires:
                - elite_yield
              question: Can the programme add another conventional elite yield cross now?
            - required: false
              requires:
                - fenn_explore
              question: Can the programme explore Fenn’s uncharacterised source immediately?
        answerText: Fund the second-gene backcross programme and the two unrelated-background crosses first. Together they use six of the eight authored programme slots and answer both urgent resistance questions.
        why: The programme has two urgent genetic questions. One is to place the second resistance gene into the elite background farmers already use. The other is to put that gene into unrelated backgrounds so the programme does not rebuild the same single point of failure. Elite-to-elite yield crosses are useful but narrow the same base and consume a large package. Fenn’s plants are promising but still uncharacterised. A finite crossing board therefore protects the two resistance questions first and deliberately leaves lower-priority packages for later.
        evidence: The programme's elite parents are closely related and carry the failing resistance gene between them. The unregenerated accession carries a second gene and has never been in a cross. Fenn's marked plants are unproven and will not be characterised for two seasons. Backcrossing the second gene into the current elite line takes four generations and the warm bay can run two a year. A yield cross onto elite parents is reliable and adds a fraction of a tonne. The rust race is expected to be regional within three years.
      - group: POP
        task: Say what the block does to the programme's base
        title: How narrow the base has become
        concept: Pedigree, relatedness and the narrowing of a breeding base
        place: Genetic Resources Office
        scene: Ivanescu has the pedigree of six elite parents across the wall. Four share a recent grandparent, and all six carry the same resistance gene. The new rust race is already defeating that gene in commercial wheat east of Wellmere.
        guide: >-
          Six parents, and five sources they could have drawn their resistance from. Name the
          source the pedigree actually shares, then keep only the parents whose resistance
          does not come through it. Six lines all reporting resistance is not six pieces of
          evidence if the resistance is one allele arriving six times.
        background:
          - >-
              Why agreement is not independence. Six trials of the same allele against the same
              rust race give one result, repeated. The programme's confidence came from the
              number of lines rather than from the number of sources, and those are different
              quantities whenever a pedigree has a shared ancestor in it.
          - >-
              What relatedness does to a breeding base. Four of the six share a grandparent, so
              a quarter of their genome is expected to be shared by descent alone. Crossing the
              best with the best concentrates exactly the alleles that made them the best, and
              narrows what is left to draw on when the pathogen changes.
          - >-
              Why the eastern outbreak is the whole point. A resistance gene is only useful
              against races that have not defeated it. The moment one race does, every line
              carrying that allele fails together — which is what a shared source means in
              practice, and why two independent sources are worth more than six correlated ones.
        assumes:
          - related parents share more alleles than unrelated ones
        takeaway: A programme that keeps crossing its best with its best is narrowing what it can still draw on.
        format: TRACE
        question: Which of these six parents give genuinely independent evidence that the programme has rust resistance?
        answerText: Only WM-604 and the Anatolian landrace introgression. The other four trace their resistance to the same 1998 grandparent, so their agreement is one source reported four times.
        why: Four of the six parents descend from the 1998 line WM-311, and their resistance is that line's allele arriving four times over. Their agreement carries no more information than one of them does, which is why the programme's confidence was misplaced rather than merely optimistic: the number of lines went up and the number of sources did not. WM-604's resistance came in from a separate cross with a Chinese spring wheat, and the Anatolian introgression is a different gene at a different locus — two sources, and a race that defeats one need not defeat the other. This is what a narrowing base looks like from the inside. Everything in the nursery reports the same answer, and the reason is a common ancestor rather than a robust finding.
        trace:
          resources:
            - id: wm311
              label: WM-311, the 1998 elite parent
            - id: chinese
              label: The Chinese spring wheat cross of 2011
            - id: anatolian
              label: The Anatolian landrace introgression
            - id: bench
              label: The seedling assay bench
            - id: race
              label: The rust race the assay uses
          channels:
            - id: wm701
              label: WM-701 scores resistant
              reading: severity 4 per cent on the flag leaf
              depends: [wm311, bench, race]
            - id: wm708
              label: WM-708 scores resistant
              reading: severity 6 per cent on the flag leaf
              depends: [wm311, bench, race]
            - id: wm712
              label: WM-712 scores resistant
              reading: severity 3 per cent on the flag leaf
              depends: [wm311, bench, race]
            - id: wm715
              label: WM-715 scores resistant
              reading: severity 5 per cent on the flag leaf
              depends: [wm311, bench, race]
            - id: wm604
              label: WM-604 scores resistant
              reading: severity 8 per cent on the flag leaf
              depends: [chinese, bench, race]
            - id: anat
              label: The Anatolian introgression line scores resistant
              reading: severity 2 per cent, and a different lesion type
              depends: [anatolian, bench, race]
          independent: [wm604, anat]
          target: wm311
      - group: LAB
        task: Decide what to screen early and what the finished line must still prove
        title: DNA present, resistance working?
        place: Molecular Laboratory
        scene: Nakagawa can run the linked DNA marker at the two-leaf stage. On final candidates she can also measure resistance-gene mRNA after rust exposure and challenge leaves with the pathogen. The marker is four centimorgans from the gene.
        guide: >-
          Four ways to order the evidence, and the question is which test belongs where.
          Ask of each what a marker can and cannot show. A linked marker can be
          separated from the gene by recombination. Even the gene's presence is not its
          expression: transcription, translation and regulation all sit between the
          sequence and the phenotype.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        takesAsRead:
          - Dominance, and why one allele is enough
        assumes:
          - a linked marker can separate from a gene by recombination
          - transcription makes RNA from DNA and translation makes protein from mRNA
        takeaway: DNA can show what a plant carries; RNA and phenotype show whether that information is being used and whether it works.
        format: CHOICE
        question: Which evidence belongs early, and what should the final line still be required to show?
        answerText: Use the DNA marker early. On the final line, confirm that the resistance gene is expressed after rust exposure and that the plant actually resists the pathogen.
        why: The linked DNA marker is useful early because it can remove unlikely seedlings months before resistance can be tested. But recombination can separate that marker from the gene. Even direct DNA evidence only shows that a sequence is present. Transcription produces mRNA, translation produces protein, and regulatory interactions affect how much gene product appears and when. An RNA check after rust exposure tests expression. The pathogen challenge then tests whether the whole pathway produces the resistant phenotype.
        choices:
          - Use the DNA marker early; on the final line check induced mRNA and the resistance phenotype
          - Measure mRNA in every generation; on the final line the pathogen challenge is unnecessary
          - Challenge plants in every generation; use the DNA marker only after the final backcross
          - Use the DNA marker early and late; DNA presence alone is enough to certify resistance
        answer: Use the DNA marker early; on the final line check induced mRNA and the resistance phenotype
        rebuttals:
          - RNA shows expression, but the final phenotype still tests whether the complete pathway works.
          - Waiting for a pathogen phenotype every generation gives up the time advantage of early DNA screening.
          - A linked marker can recombine away, and even the gene's presence does not by itself prove expression or function.
  # ---------------------------------------------------------------- day 15
  - title: What the season established
    objective: Say what Wellmere knows now, what it cost, and what changes.
    briefing: The block is in. The rust is here. The collection is smaller than the catalogue says.
    stake: >-
      Friday, and the season is set. The crossing block went in yesterday. WM-712 was released
      with its weakness written on the label. The drifted samples are on a list that will take
      15 years to work through. Fenn's marked plants are drying in 40 paper bags with his
      handwriting on them. The board meets on Monday. The season record goes on the table in
      front of them. Qureshi has to say what happened here in words that somebody who funds a
      gene bank will understand. Today you settle what this season established and what it cost
      to find out.
    takeaway: A collection is only as good as the last time each accession was grown, and now Wellmere knows which.
    stops:
      - group: VAULT
        task: Say what the season established about the collection
        title: What the catalogue says and what is there
        place: Seed Vault
        scene: 90 accessions were genotyped. 30 had drifted, and every one of those had been regenerated at least twice. The other 60, regenerated once or not at all, still matched. About 9,000 accessions have 2 or more regenerations.
        guide: >-
          Turn the sample into a number for the group it came from, and only for that group.
          Every drifted accession in the sample had been regenerated twice or more, and the
          collection holds about nine thousand of those. Two of the tiles belong to the whole
          collection rather than to the high-risk group, and putting one of them in gives the
          number the board must not be told.
        background:
          - >-
              What the sample supports. All thirty drifted accessions came from the
              twice-regenerated group, and none of the sixty from outside it drifted. That
              identifies a risk factor cleanly. What it does not do is measure the drift rate of
              accessions nobody sampled.
          - >-
              Why the whole-collection figure is the wrong one. Forty-one thousand accessions
              times any rate estimated from this sample would be a claim about material that
              was never tested, and most of the collection has never been regenerated at all —
              the group where nothing drifted.
          - >-
              What the honest sentence looks like. A rate, the group it applies to, and the
              number in that group: about a third of roughly nine thousand twice-regenerated
              accessions, which is around three thousand and is not the same statement as a
              third of the collection.
        assumes:
          - a sample of a collection supports an estimate about the collection
        takeaway: A sample can identify a high-risk group without proving the exact fraction affected in the entire collection.
        format: BALLPARK
        question: How many accessions does this season's sample actually put at risk?
        answerText: About 3,000 — a third of the roughly 9,000 twice-regenerated accessions. Not a third of the 41,000, which is the sentence the board must not be given.
        why: Thirty of the ninety sampled accessions had drifted, and every one of the thirty came from the twice-regenerated group. Within the sample that group is 30 of 90, which is not the rate to use — the rate that matters is drifted-over-sampled inside the high-risk group itself, and applied to the roughly 9,000 accessions the collection holds in that group it gives about 3,000. The 41,000-accession figure is a different claim entirely, about material that was never tested and most of which has never been regenerated, which is the group where nothing drifted at all. Both numbers are arithmetic on the same sample; only one of them is a statement the evidence supports. The board will quote whichever sentence it is given, which is why the group has to travel with the fraction.
        estimate:
          prompt: 30 of the 90 sampled accessions had drifted, and all 30 were in the twice-regenerated group. The collection holds about 9,000 twice-regenerated accessions and 41,000 in total.
          question: Choose the drifted fraction and the size of the group it applies to.
          labels:
            - 30  (sampled accessions that had drifted)
            - 90  (accessions sampled in total)
            - 9000  (accessions regenerated twice or more)
            - 41000  (accessions in the whole collection)
            - 60  (sampled accessions that still matched)
          values: [30, 90, 9000, 41000, 60]
          slots: 3
          template: '{0} ÷ {1} × {2}'
          formula: a/b*c
          correct: [0, 1, 2]
          target: 3000
          tolerance: 250
          units: accessions at risk
          solution: 30 ÷ 90 × 9,000 ≈ 3,000 accessions in the twice-regenerated group. Using 41,000 instead gives 13,700, which the sample cannot support.
          explanation: A third of the high-risk group is about 3,000. The same arithmetic against the whole collection is a claim about material nobody tested.
          givens:
            - 30 of 90 sampled accessions drifted, all in the twice-regenerated group
            - the collection holds about 9,000 twice-regenerated accessions
          relationship: Accessions at risk = drifted ÷ sampled × size of the group the sample came from.
      - group: TRIAL
        task: Say what the season's trial data supports
        title: One site, one year, again
        concept: Regression to the mean, and why the best plot flatters itself
        place: Field Laboratory
        scene: The trial is scored and the selected lines are chosen. The summary sheet now goes to a board that will remember one headline number. This was a dry season at one site, and the selected plots looked much better than the full replicated mean.
        guide: >-
          Four ways to write one result. Ask of each where the conditions sit relative
          to the number. A footnote is not the same sentence. The selected-plot mean is
          worse as a headline, because those plots were chosen partly for their ground.
          And withholding the result treats a conditional finding as useless rather than
          as conditional.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a trial's conclusions belong to the conditions it ran under
        takeaway: The sentence that survives being quoted out of context is the one worth writing.
        format: CHOICE
        question: How should this season's trial result be summarised?
        answerText: Report the replicated gain with the dry season and site attached to it. Those conditions are part of what the number means.
        why: A yield number becomes misleading when the conditions that produced it are stripped away. This season’s gain belongs to one site and a dry year. The selected-plot mean is even less defensible as a headline because those plots were chosen partly for favourable ground and weather. Putting site and season in the same sentence as the gain is not cosmetic caution; it defines the claim being made. A later season can test generality, but it does not make the current conditional result useless.
        choices:
          - Report the replicated gain and state the dry season and site in the same sentence
          - Report the larger selected-plot gain because those are the lines entering the programme
          - Report the replicated gain as the headline and put environmental limits in a footnote
          - Withhold the result until another season shows the same numerical advantage
        answer: Report the replicated gain and state the dry season and site in the same sentence
        rebuttals:
          - Selected plots were chosen after seeing outcomes, so their mean contains selection on favourable plot effects as well as genetics.
          - A detached headline is likely to travel without its footnote, changing a conditional result into a general one.
          - A second season tests how portable the result is; it is not required for the first season's conditional result to be real.
      - group: DRY
        task: Say what the year's agronomy is worth keeping
        title: 11 years, and what they are for
        concept: Canopy, flowering time and the traits that build a yield
        place: Drying & Processing Hall
        scene: Toft’s canopy, flowering and weather records now span 12 seasons. Nobody has ever asked for the whole series. This year two of those records explained why the highest-yielding plots separated from the rest during a dry finish.
        guide: >-
          The cloud is the twelve seasons of summer rainfall, one point each, and the band that
          counts as an ordinary season is drawn across it. Place the middle bar and the two
          sigma bars to report where the seasons sit and how widely they scatter, then use what
          the archive offers to sharpen the estimate. A single year has no position until the
          distribution behind it exists.
        background:
          - >-
              Why one season cannot be read alone. This summer delivered 118 millimetres. On its
              own that number means nothing at all; against twelve seasons it is the second
              driest, which is what turns a yield difference into evidence about dry-finish
              performance.
          - >-
              What the two bars are for. The middle bar is the station's estimate of an ordinary
              season and the outer pair is the uncertainty on it, one sigma either side. A pair
              placed honestly holds roughly two thirds of the points between them, which is what
              one sigma means and is worth checking on the plot rather than taking on trust.
          - >-
              Why a series cannot be started late. Extending it backwards is possible only where
              somebody else kept a record; the airfield's rain gauge can be borrowed and the
              canopy states of past seasons cannot, because the crops are gone. That asymmetry is
              the whole argument for measuring routinely in years when nobody asks.
        takesAsRead:
          - "Resource allocation: defence, growth and yield out of one budget"
        assumes:
          - a long record allows a season to be compared against others
        takeaway: A measurement series is worth more each year, and it can only be started early.
        format: CLOUD
        question: Report where an ordinary summer sits and how widely the seasons scatter, and say whether this year is inside the ordinary band.
        answerText: About 196 mm with a one-sigma spread near 34 mm once the airfield series is borrowed and the exposure correction applied. This summer's 118 mm sits more than two sigma below the middle, which is what makes it an unusual season rather than a bad one.
        why: A season is a number until there is a distribution behind it, and then it becomes a position. Twelve summers of rainfall at this site scatter around roughly 196 millimetres with a one-sigma width near 34, so this year's 118 sits more than two sigma low — the second driest in the series and comfortably outside the ordinary band. That is what licenses the sentence Toft wants to write: WM-712's advantage appeared in a season that was unusual in a stated, measured way. The station's own record is short, so borrowing the airfield's longer gauge series narrows the estimate of the middle without moving it much, and correcting the exposure difference between the two gauges shifts it without narrowing anything. Neither operation invents information about this summer; both change how confidently the station can say what an ordinary summer is. And the canopy half of the record cannot be recovered at all, which is why a routine measurement in a year nobody asks about is the asset here.
        cloud:
          unit: mm of summer rainfall
          hint: Place the middle bar and the sigma bars from the points on the plot, then apply what the archive offers and place them again.
          bounds:
            min: 140
            max: 260
          centre: 196
          spread: 52
          pass: 0.8
          actions:
            - id: airfield
              label: Borrow the airfield's 30-year gauge series
              effect: narrow
              amount: 0.72
              cost: 1
            - id: exposure
              label: Correct the exposure difference between the two gauges
              effect: shift
              amount: 6
              cost: 1
            - id: canopy
              label: Reconstruct past canopy cover from the yield sheets
              effect: narrow
              amount: 0.94
              cost: 2
          costUnit: archive days
          report:
            centreTol: 10
            spreadTol: 11
          commit: Report the middle and the spread


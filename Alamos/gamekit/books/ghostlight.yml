copy:
  FRONT: <p>The box office. Six weeks of advance in a hand-ruled book, and the only place in the building where the numbers are about people rather than about the room.</p>
  BOARD: <p>The lighting board. Twenty-eight units on four bars, plotted in bearings and hung in offsets, which is where every rig argument starts.</p>
  PIT: <p>The orchestra pit. Built for twenty-two players, holding nine, and every fader on the desk is a logarithm.</p>
  FLY: <p>The fly floor. Twenty-six lines, a counterweight system added in 1958, and a grid narrower than the stage it hangs over.</p>
  SHOP: <p>The scene shop. One room, two benches and a band saw older than the counterweights. Curves are set out in radians here because a template is an arc.</p>
  HOUSE: <p>The house. Nine hundred seats numbered in 1911, a proscenium narrowed in 1958, and nobody has drawn a sightline since.</p>
  STAGEDOOR: <p>The stage door. Everybody who works in this building comes through it, and the keeper knows who is in.</p>
  GREEN: <p>The green room. Forty-one people, one kettle, and where the notes get argued about after they are given.</p>
  DIMMER: <p>The dimmer room. 1958 equipment feeding a 1911 building through cable that has been replaced twice by hand.</p>
  PROMPT: <p>The prompt corner. Where the show is run from, and the only place in the theatre that can see the stage and the score at once.</p>
  WARDROBE: <p>Wardrobe. Two hundred costumes that came back from store in eleven crates, and a steamer that works when it is asked nicely.</p>
  DOCK: <p>The scene dock. Where a piece waits between the shop and the stage, and where the flying gear is checked before it goes up.</p>

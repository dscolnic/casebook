# ghostlight.yml — Ghost Light. AP Precalculus at the Ellery Variety Theatre.
#
# THE PLACE WAS CHOSEN BECAUSE EVERY FAMILY OF FUNCTION IS A PIECE OF KIT. A
# fader is a logarithm. A beam is polar. A flying line is a vector. The box
# office is a rational function with a real asymptote in it. Nothing here is an
# example of a function; it is a thing in the building that happens to be one.
#
# The argument, both sides right on some day: Sallow has sold nine hundred seats
# and is right on day 10 that a house held back for sightlines nobody has
# measured is a house nobody is paid for. Osei will not fly four tonnes on an
# untested grid and is right on day 9, when the load plot comes out at three and
# a half tonnes with the lines leaning further than anybody drew.
#
#   node tools/import-book.mjs books/ghostlight.yml ghostlight --verify

theme:
  id: ghostlight
  title: Ghost Light
  subtitle: Production Manager · The Ellery Variety Theatre

groups:
  - id: FRONT
    code: FRONT
    name: Box Office
    color: '#a8553c'
    desc: What has sold, what will, and the curve it is following.
    defaultLeader: sallow
    milestones: [Read the sales, Fit a model, Test it, Ready for the opening]
  - id: BOARD
    code: BOARD
    name: Lighting Board
    color: '#c09a3a'
    desc: Angles, throws and three channels of colour.
    defaultLeader: adeyemi
    milestones: [Plot the beams, Work the angles, Balance the colour, Ready for the opening]
  - id: PIT
    code: PIT
    name: Orchestra Pit and Sound
    color: '#3f7fa8'
    desc: Waveforms, levels and everything measured in logarithms.
    defaultLeader: brand
    milestones: [Read the waveform, Add the gains, Set the levels, Ready for the opening]
  - id: FLY
    code: FLY
    name: Fly Floor
    color: '#7f8a5c'
    desc: Lines, loads and the vectors they pull along.
    defaultLeader: osei
    milestones: [Weigh the piece, Resolve the lines, Plot the load, Ready for the opening]
  - id: SHOP
    code: SHOP
    name: Scene Shop
    color: '#8a6f3c'
    desc: Radians, right triangles and things cut to a curve.
    defaultLeader: novak
    milestones: [Set out the curve, Cut the angles, Check the fit, Ready for the opening]
  - id: HOUSE
    code: HOUSE
    name: The House
    color: '#6a4a6a'
    desc: Sightlines, seats and the geometry of a room built in 1911.
    defaultLeader: kettleby
    milestones: [Survey the seats, Draw the sightlines, Settle the map, Ready for the opening]

roster:
  - id: sallow
    name: Marguerite Sallow
    role: Producer
    division: FRONT
    bio: |
      Has produced eleven shows in rooms she did not own and has never yet
      opened one late. She sold nine hundred seats for the Ellery before anybody
      had measured the building, which she considers a normal risk and everybody
      else considers the problem.

      Her argument is about the shape of a sales curve rather than about a total.
      Advance sales rise slowly and then steeply in the last fortnight, so a
      house held back on the eighth for a reason nobody can write down is a
      house that never sells.

      What she accepts, and few producers do, is being shown a number. She will
      move a seat map for a measurement and not for an opinion.
    quiz:
      - q: Why does Sallow object to holding seats back without a written reason?
        a: Seats withdrawn late in the curve are seats that never sell
        wrong:
          - Withdrawn seats have to be refunded at a premium under the ticketing contract
          - A held seat cannot be released again once the allocation is filed with the box office
          - She believes sightline problems are always exaggerated by technical staff
  - id: osei
    name: Kwame Osei
    role: Head Flyman
    division: FLY
    bio: |
      Has run the Ellery's fly floor since he was nineteen, which was two years
      before it went dark. Twenty-six hemp lines, a counterweight system added
      in 1958, and a grid nobody has load-tested since.

      He thinks in components rather than totals. A piece hanging from two lines
      does not put half its weight on each unless the lines are vertical, and
      the lines at the Ellery are not vertical because the grid is narrower than
      the stage.

      His refusal is specific. He will fly anything with a load plot and a
      margin, and nothing at all on an assurance.
    quiz:
      - q: Why does Osei say two lines rarely share a load equally?
        a: Only the vertical part of each line's pull carries the weight
        wrong:
          - Hemp lines and counterweight lines have different breaking strengths, so the load splits unevenly
          - The grid at the Ellery has been out of level since the 1958 conversion work
          - A load always settles on whichever line was tensioned first
  - id: brand
    name: Ilse Brand
    role: Sound Designer
    division: PIT
    bio: |
      Came from concert halls to variety and says the difference is that in
      variety everything is amplified and nothing is supposed to sound like it.

      She works in logarithms without saying so. Every fader on her desk is one,
      every gain stage multiplies rather than adds, and her standing complaint
      is that people discuss six decibels as though it were a small number.

      The Ellery's problem is its reverberation. Eleven years shut with the
      seats out has left a room that rings, and the seats coming back is the only
      thing that will fix it.
    quiz:
      - q: Why does Brand object to six decibels being called a small change?
        a: Each three decibels doubles the intensity, so six is four times
        wrong:
          - Six decibels is the smallest change most listeners can reliably detect in a hall
          - Decibel readings on her desk are peak values rather than averages, so they understate the change
          - The scale is only logarithmic below the threshold of pain
  - id: adeyemi
    name: Tunde Adeyemi
    role: Lighting Designer
    division: BOARD
    bio: |
      Plots a rig in polar coordinates because that is what a lantern is: a
      position, a bearing and a spread. He converts to the plan drawing
      afterwards, which is the opposite of how most designers work and produces
      fewer arguments on the day.

      He is exact about the inverse square law and unpopular for it. Moving a
      lantern from six metres to twelve does not halve the light on the
      performer; it quarters it, and the colour goes with it.

      His limit is the Ellery's own dimmers, which are older than he is and do
      not do what their numbers say.
    quiz:
      - q: Why does Adeyemi plot in polar coordinates rather than on the plan?
        a: A lantern is a bearing and a spread before it is a position on paper
        wrong:
          - Plan drawings of the Ellery were lost when the building closed in the 1970s
          - Polar plots are required by the licensing authority for any rig over a public audience
          - It is the only way to record the dimmer number alongside the position
  - id: novak
    name: Petra Novak
    role: Head of Construction
    division: SHOP
    bio: |
      Runs the scene shop, which at the Ellery is one room, two benches and a
      band saw older than the counterweight system. She sets out curves in
      radians because a template is an arc and an arc is a radius and an angle.

      She has built for rooms that were surveyed and rooms that were not, and
      the difference she cares about is whether a piece has to be recut on the
      stage in front of a company standing about.

      Her rule is to measure the room rather than the drawing, because the
      Ellery is 1911 and nothing in it is where the drawing says.
    quiz:
      - q: Why does Novak measure the room rather than the drawing?
        a: A 1911 building has moved, and the drawing has not
        wrong:
          - The original drawings were made before the 1958 counterweight conversion
          - Room measurements are required before any piece can be signed off by the licence
          - Drawings show finished dimensions rather than the timber sizes she has to order
  - id: kettleby
    name: Alan Kettleby
    role: House Manager
    division: HOUSE
    bio: |
      Has managed three houses and can tell you, of any seat in any of them,
      what it can and cannot see. At the Ellery he inherited a seat map drawn in
      1911, a proscenium narrowed in 1958 and no record of what that did.

      He treats a sightline as two lines that either meet on stage or do not.
      Where they do not, the seat is not a bad seat; it is a seat that cannot see
      a performer standing where the show puts them.

      His argument with the producer is about which of the two numbers moves:
      the seat map, or the blocking.
    quiz:
      - q: Why does Kettleby describe a bad sightline as two lines rather than a bad seat?
        a: It depends on where the performer stands, not only where the seat is
        wrong:
          - Seats are rated in pairs under the licensing scheme, so they are assessed two at a time
          - The 1958 proscenium narrowing removed the original seat numbering
          - A seat with an obstructed view can be sold at a reduced price instead
  - id: dowd
    name: Ruth Dowd
    role: Box Office Manager
    division: FRONT
    bio: |
      Has sold tickets for this town for twenty-two years, three venues, and
      keeps the only record of what a Tuesday looks like against a Saturday.

      She thinks in curves without using the word. Advance sales for a variety
      bill do not rise steadily: they crawl for three weeks and then go
      vertical, and a decision made in week two on week-two numbers is a
      decision made on the flat part.

      What she will not do is forecast past the last date she has data for, and
      she says so in writing every time she is asked.
    quiz:
      - q: Why does Dowd refuse to forecast past her last data point?
        a: A curve fitted inside a range says nothing certain outside it
        wrong:
          - Her ticketing system cannot export projections beyond the current sales window
          - Forecasts past the last data point would have to be disclosed to the producer's investors
          - Advance sales for variety bills have never been recorded accurately in this town
  - id: ferreira
    name: Nuno Ferreira
    role: Chief Electrician
    division: BOARD
    bio: |
      Keeps the dimmer room, which is 1958 equipment feeding a 1911 building
      through cable he has replaced twice himself.

      His interest is the gap between what a channel is set to and what it puts
      out. A fader at 50 per cent is not half the light, the old dimmers have a
      curve of their own, and the two together are why the designer's plot never
      matches the first look.

      He is the person who insists a level be measured at the performer rather
      than read off the desk.
    quiz:
      - q: Why does Ferreira measure light at the performer rather than reading the desk?
        a: A fader position and the light arriving are two different quantities
        wrong:
          - The 1958 dimmers have no calibrated readout on the desk at all
          - Desk readings are averages over the whole rig rather than per channel
          - Light levels at the performer are what the licence requires to be logged
  - id: haigh
    name: Simone Haigh
    role: Stage Manager
    division: FLY
    bio: |
      Runs the show from the prompt corner and the rehearsal room from a
      clipboard, and the two jobs are the same job: everything has to happen in
      an order, with a margin, and the margin is what she is actually managing.

      She builds the rehearsal call sheet as a sequence — the same interval
      between calls, repeated — because a plan with an even step in it is a plan
      anybody can see the end of.

      Her limit is that a flying sequence has to be timed, and a timing nobody
      has rehearsed is a number somebody made up.
    quiz:
      - q: Why does Haigh build the call sheet on an even interval?
        a: An even step lets anybody see where the plan ends
        wrong:
          - Union rules require rehearsal calls to be spaced at equal intervals
          - Uneven calls cannot be entered into the theatre's booking system
          - It is the only way to fit forty-one people into one rehearsal room
  - id: pell
    name: Douglas Pell
    role: Licensing Officer
    division: HOUSE
    bio: |
      Comes from the council with a folder and a list, and is neither an
      obstacle nor an ally. He signs the licence if the file supports it and not
      if it does not, and he has read enough files to know the difference.

      He is precise about what he needs: a measured seat count, a load plot with
      a margin, sound levels at the seat rather than at the desk, and exit
      timings from a walked rehearsal.

      His complaint about theatres is that they treat a licence as a formality
      and then argue about it at four o'clock on opening day.
    quiz:
      - q: What does Pell mean when he says a licence is not a formality?
        a: The file has to carry measurements, not assurances
        wrong:
          - Licences are issued by a committee that meets only twice a year
          - A theatre closed for more than ten years needs a new licence rather than a renewal
          - He has no authority to sign anything on the day of an opening
  - id: mbatha
    name: Thandi Mbatha
    role: Musical Director
    division: PIT
    bio: |
      Has a nine-piece band in a pit built for twenty-two, and the arrangement
      she is conducting was written for the twenty-two.

      Her working problem is balance, and she thinks about it in periods and
      phases: two instruments a fraction of a beat apart do not sound like a
      bigger instrument, they sound like a mistake, and the fix is timing rather
      than volume.

      She wants the pit rail lowered by three inches, which is a construction
      question, a sightline question and a sound question at once.
    quiz:
      - q: Why does Mbatha say two instruments slightly out of time are worse than one?
        a: A small phase difference is heard as an error rather than as size
        wrong:
          - Nine players cannot balance an arrangement written for twenty-two at any timing
          - The pit rail reflects sound back at the players and confuses their timing
          - Two instruments playing the same line always cancel at some frequencies
  - id: quirke
    name: Eamon Quirke
    role: Master Carpenter
    division: SHOP
    bio: |
      Built for the Ellery before it closed and has come back for the reopening,
      which he refers to as finishing a job rather than starting one.

      He knows the building's history in dimensions: the proscenium was narrowed
      by two feet three inches in 1958, the pit rail was raised, and the fly
      grid was never widened to match. Everything awkward about this fortnight
      is downstream of one of those three.

      He measures twice and quotes the 1958 drawings as a warning rather than a
      source.
    quiz:
      - q: Why does Quirke treat the 1958 drawings as a warning?
        a: They record an alteration whose consequences were never redrawn
        wrong:
          - The 1958 drawings were made in imperial units and cannot be converted reliably
          - They were drawn by the contractor rather than by an architect
          - The alterations they show were never actually carried out

glossary:
  - name: Scenery
    aliases: [scenery, scenic, piece, pieces]
    def: What is built for a show and used on stage. Each item has a weight, a width and a place it has to go.
  - name: Ironwork
    aliases: [steel, ironwork]
    def: The beams over the stage. They are what finally takes the weight of anything in the air.
  - name: Reflector
    aliases: [reflector, fold-back]
    def: A surface put behind or beside players so they hear themselves. The pit rail is one by accident.
  - name: Fly floor
    aliases: [fly floor, flying, flown]
    def: The gallery high up at the side of the stage, where a crew works the lines by hand.
  - name: Grid
    aliases: [grid, the grid]
    def: The frame over the stage that everything in the air is tied to. It has a stated limit, and here nobody has tested it since 1958.
  - name: Batten
    aliases: [batten, battens]
    def: A bar over the stage that lanterns and cloth are bolted to. It goes up and down on lines.
  - name: Counterweight
    aliases: [counterweight]
    def: Weights that balance what is on the other end of a line, so one person can move it. Added in 1958.
  - name: Amplitude
    aliases: [amplitude]
    def: Half the distance from the top of a wave to the bottom. On a sound waveform it is how loud, before any scale is applied.
  - name: Period
    aliases: [period, periodic]
    def: How much input one full cycle of a repeating function takes. For a wave in time, how long one cycle lasts.
  - name: Phase
    aliases: [phase, phase shift]
    def: Where in its cycle a wave starts. Two identical waves a little out of phase do not add up to a bigger one.
  - name: Decibel
    aliases: [decibel, decibels, db]
    def: A logarithmic scale for a ratio of intensities. Three decibels is a doubling and ten is a factor of ten.
  - name: Radian
    aliases: [radian, radians]
    def: An angle measured as the arc it sweeps divided by the radius. A full turn is two pi of them.
  - name: Polar coordinates
    aliases: [polar, polar coordinates]
    def: Naming a point by a distance and a bearing from a centre, rather than by two perpendicular measurements.
  - name: Asymptote
    aliases: [asymptote, asymptotes, asymptotic]
    def: A line a curve approaches without reaching. A vertical one sits where a denominator goes to zero.
  - name: Vector
    aliases: [vector, vectors]
    def: A quantity with a size and a direction, which can be split into perpendicular parts and added part by part.
  - name: Sightline
    aliases: [sightline, sightlines]
    def: The straight line from a seat to a point on stage. If something solid is in the way, that seat cannot see that point.
  - name: Proscenium
    aliases: [proscenium]
    def: The arch framing the stage. The Ellery's was narrowed by two feet three inches in 1958 and nothing downstream was redrawn.
  - name: Reverberation
    aliases: [reverberation, reverberant, ring]
    def: Sound continuing after its source has stopped, decaying by the same fraction each interval. An empty room rings; seats and people stop it.
  - name: Residual
    aliases: [residual, residuals]
    def: What a model missed by at one point — the observed value minus the predicted one. A pattern in them means the wrong shape was chosen.

warmups:
  greet:
    title: Forty-one people, and half of them started yesterday
    why: >-
      The company, the crew and the band were hired separately and most of them have never
      worked this building. Simone Haigh, the stage manager, wants you known to as many of them
      as you can get round before the first flying rehearsal, because a call that has to be
      explained twice is a call that arrives late.
  trial-near:
    title: Walk the building before you sign for it
    why: >-
      Eleven years shut, one alteration in 1958 and no survey since. Eamon Quirke, the master
      carpenter, walks every new manager the length of the backstage corridor once, because the
      proscenium is two feet three inches narrower than the drawings and everything awkward
      about this fortnight comes off that one fact.
  follow:
    title: Follow Novak round the set-out
    why: >-
      Petra Novak, who runs the scene shop, sets out the curved rostrum on the stage floor
      itself rather than on paper, and she does not stop walking to explain it. Stay with her:
      the arc she is stepping out is the piece the flying sequence has to clear, and its radius
      is the number three later calculations use.
  hunt:
    title: Six lanterns went out with the 1974 sale
    item: { name: lantern, plural: lanterns }
    why: >-
      The rig plot lists six units that are not on the bars, and Nuno Ferreira, the chief
      electrician, thinks they are still in the building rather than sold. Find all six. Every
      one you turn up is a unit the budget does not have to hire, and the plot has to be right
      before the board is plotted.
  canvass:
    title: Ask the front six rows what they can see
    why: >-
      Alan Kettleby, the house manager, will not withdraw a seat on an opinion and will not sell
      one on a guess. Sit somebody in each of the front rows with the marker on stage, ask one
      question and count the answers — a sightline is a measurement and the room is the only
      instrument for it.
  evade:
    title: Keep clear of Pell until the load plot is filed
    why: >-
      Douglas Pell, the licensing officer, is in the building and asking about the grid. Keep
      your distance until the load plot is in the file: a number given in a corridor becomes the
      number on the licence, and the one in your head has no margin written on it yet.
  tag:
    title: Catch Sallow before the seat map goes to print
    why: >-
      Marguerite Sallow, who is producing, has the seat map going to the printer at four and the
      front six rows are still on it. She is crossing the building at speed with a folder under
      her arm, and print is the point after which a sightline problem becomes a refund problem.

# ---------------------------------------------------------------- the fortnight
missions:
  # ----- day 1. What the building is, and what has sold.
  - title: Eleven years of dust and nine hundred seats
    objective: Establish what the room actually is and what the sales are doing.
    briefing: The seat map is 1911, the proscenium is 1958, and the advance is three weeks old.
    stake: >-
      Monday, fourteen days out. Ruth Dowd, the box office manager, has three weeks of advance sales and a producer who reads the last week as the trend. Alan Kettleby, the house manager, has a seat map drawn in 1911 for a proscenium that was narrowed in 1958, and no record of what that did to the front rows. Today you work out what the sales are actually doing, which seats are in question and what the shop has to build to. A number read off the flat part of a curve is a decision made about a different fortnight.
    takeaway: A rate of change belongs to the interval it was measured over.
    stops:
      - group: FRONT
        task: Work out what the advance is doing per week
        title: Off the flat part
        place: Box Office
        relationship: >-
          The average rate of change, rate = Δy ÷ Δx: the change in sales divided by the weeks it happened over.
        concept: 'Average rate of change over an interval'
        takesAsRead:
          - 'A function as a rule, its domain and what the domain rules out'
        scene: >
          Dowd has three weeks of advance. Week one sold 41 seats, week two 66, week three
          188. Sallow is quoting the last week as the rate for the fortnight.
        guide: >-
          A rate of change is a difference divided by an interval, and the interval is part of the
          answer. Work out the average across all three weeks, then compare it with the last week
          on its own. Both are correct arithmetic about the same three numbers, and one of them is
          being used to forecast eleven days nobody has data for.
        background:
          - >-
              Why the interval matters as much as the numbers. The same three weeks give 98 seats a
              week averaged, or 122 a week if you take the last step alone. Neither is wrong; they
              answer different questions, and only one of them is a claim about the fortnight.
          - >-
              What a rising rate of change means. The steps are 25 and 122, so the rate is not
              constant — the curve is bending upward. A quantity whose rate of change is itself
              increasing cannot be described by any single average without saying which interval it
              is the average of.
          - >-
              Why the shape of a variety advance is known. Dowd has twenty-two years of it: three
              weeks flat, then vertical in the last fortnight. That is a fact about how people buy
              tickets rather than about this show, and it is why a week-two decision is a decision
              made on the flat part.
        assumes:
          - the three weekly figures are complete weeks
        takeaway: The same three numbers give two honest rates, and the interval is which one you mean.
        format: BALLPARK
        question: Estimate the average rate of change in sales across the three weeks.
        estimate:
          prompt: Advance sales by week: 41, 66, 188. Dowd wants the average rate across all three, not the last step.
          question: Estimate the average rate of change in sales across the three weeks.
          labels:
            - 188  (seats sold in week three)
            - 41  (seats sold in week one)
            - 2  (weeks between the first and the third)
            - 122  (the last step on its own)
          values: [188, 41, 2, 122]
          slots: 3
          template: '({0} − {1}) ÷ {2}'
          formula: (a-b)/c
          correct: [0, 1, 2]
          target: 73.5
          tolerance: 6
          units: seats a week
          solution: rate = (188 − 41) ÷ 2 = 73.5 seats a week.
          explanation: Seventy-four a week averaged over the interval, against 122 in the last week alone — the curve is bending, so neither figure describes the fortnight.
        answerText: About 73.5 seats a week averaged across the interval, against 122 in the last week alone.
        why: >
          The change is 147 seats over two weekly steps, so the average rate is 73.5 a week. The
          last step alone is 122. Both are honest and they answer different questions, which is the
          whole point: a rate of change is a property of an interval, not of a curve. What the two
          together tell you is that the rate is itself rising, so no single number describes the
          fortnight. Dividing by three rather than two is the common slip — three figures have two
          gaps between them — and it understates the rate by a third.
        rebuttals:
          - Three data points have two intervals between them, so dividing by three understates the rate.
          - The last step alone is a rate over one week and cannot be read as the rate across three.
      - group: HOUSE
        task: Say which seats are actually in question
        title: Two lines that have to meet
        place: The House
        concept: 'A function as a rule, its domain and what the domain rules out'
        scene: >
          Kettleby has the 1911 seat map and a proscenium narrowed by two feet three inches in
          1958. Nobody has drawn a sightline since. Nine hundred seats are on sale.
        guide: >-
          A sightline is a straight line from a seat to a point on stage, so a seat is not good or
          bad on its own — it is a seat that can or cannot see a particular place. Work out what
          has to be known before any seat can be called into question, and which of the four
          things on offer is the one nobody has.
        background:
          - >-
              Why a seat is not the unit. The same seat sees a performer at centre stage and not one
              standing three metres left of centre. So the question is a pair: a seat, and a place
              somebody stands. That is what makes it two lines rather than a rating.
          - >-
              What the 1958 alteration did. Narrowing the proscenium by two feet three inches moved
              both edges of the frame inward. Every seat at the outer end of a row lost some of the
              stage, and the further forward the seat, the more it lost — which is why the front
              rows are the ones in question rather than the back.
          - >-
              Why the domain matters here. The function that matters takes a seat and a stage
              position and returns whether the line is clear. Its domain is every pair, and the
              pairs nobody has evaluated are the ones the show is about to sell.
        assumes:
          - the 1958 alteration was symmetric about the centre line
        takeaway: A sightline is a pair — a seat and a place somebody stands — not a property of a seat.
        format: CHOICE
        question: What has to be known before any seat can be called into question?
        choices:
          - Where the show puts a performer, and which seats have a clear line to it
          - The 1911 seat numbering and the current row spacing
          - How much each seat in the front rows was sold for
          - The width of the proscenium before and after 1958
        answer: Where the show puts a performer, and which seats have a clear line to it
        why: >
          A sightline takes two things: a seat, and a place on stage. Without the second, no seat
          can be assessed at all, and the blocking is exactly what nobody has written down yet.
          That is why the question goes to the director before it goes to the seat map. The
          proscenium widths are known and are not sufficient — they say the frame moved without
          saying who lost what. The seat numbering is a naming scheme rather than a geometry, and
          the price a seat sold for is what the problem costs rather than whether it exists.
        rebuttals:
          - Numbering names the seats; it says nothing about what any of them can see.
          - Price is what the problem costs once it is established, not evidence that it exists.
          - The two widths say the frame moved, without saying which seats lost which part of the stage.
      - group: SHOP
        task: Set out the curve the piece has to follow
        title: An arc, a radius and an angle
        place: Scene Shop
        relationship: >-
          The arc length s = rθ, with θ in radians: an angle measured in radians is the arc it sweeps divided by the radius.
        concept: 'Radians, and the arc a radius sweeps'
        scene: >
          Petra Novak, who runs the scene shop, is setting out a curved rostrum on the stage floor. The design gives a radius of
          4.2 metres and an arc that turns through 1.15 radians. She needs the length of the
          front edge before she orders timber.
        guide: >-
          An angle in radians is defined as the arc divided by the radius, so the arc is just the
          radius multiplied by the angle. That is the whole formula, and it is why radians have no
          conversion factor in them. Work out the front edge, and note what the same angle would
          give at a different radius.
        background:
          - >-
              Why radians make this simple. Measured in degrees the same calculation needs a factor
              of pi over 180 every time. A radian is the angle whose arc equals its radius, so arc
              length is a multiplication and nothing else. Every formula in the course that mixes
              angles with lengths is written this way for that reason.
          - >-
              What the number is for. The front edge is faced with a single strip of ply bent round
              the curve, and it is ordered by length. Two hundred millimetres short is a joint in the
              middle of the front edge, on the piece the audience looks at all evening.
          - >-
              Why the radius has to come off the floor rather than the drawing. Novak sets out on the
              stage because the 1958 proscenium moved the centre line, and a curve set out from the
              drawing's centre lands two feet three inches off the room's.
        assumes:
          - the arc is a single circular curve of constant radius
        takeaway: An angle in radians times a radius is an arc length, with nothing else in it.
        format: BALLPARK
        question: Estimate the length of the rostrum's front edge.
        estimate:
          prompt: The curve has a radius of 4.2 m and turns through 1.15 radians. Novak orders the facing strip by length.
          question: Estimate the length of the rostrum's front edge.
          labels:
            - 4.2 m  (radius of the curve)
            - 1.15 rad  (angle the curve turns through)
            - 65.9 deg  (the same angle in degrees)
            - 8.4 m  (the diameter)
          values: [4.2, 1.15, 65.9, 8.4]
          slots: 2
          template: '{0} × {1}'
          formula: a*b
          correct: [0, 1]
          target: 4.83
          tolerance: 0.3
          units: m
          solution: s = rθ = 4.2 × 1.15 = 4.83 m.
          explanation: Just under five metres, so a single strip covers it — using the angle in degrees would give 277 metres.
        answerText: About 4.83 metres, which one strip of facing covers with a little to spare.
        why: >
          Radius times angle in radians is the arc: 4.2 times 1.15 is 4.83 metres. The degree
          figure is on the tile row because it is the same angle and it cannot be used this way —
          multiplying by 65.9 gives 277 metres, which is absurd enough to catch and is exactly the
          mistake a calculator left in the wrong mode makes silently. The reason radians work here
          is definitional: a radian is the angle whose arc equals its radius, so the conversion
          factor is one. The diameter is the other trap, and it would give twice the answer, which
          is not absurd at all.
        rebuttals:
          - The angle in degrees needs a factor of pi over 180 before it can multiply a length.
          - Using the diameter doubles the arc, which is wrong by a factor that looks plausible.

  # ----- day 2. Sequences: the call sheet and the batten heights.
  - title: An even step, and a doubling one
    objective: Build the rehearsal sequence and the batten trim heights, and tell the two kinds apart.
    briefing: Haigh needs a call sheet and Osei needs trim heights, and they are different kinds of sequence.
    stake: >-
      Tuesday, and two lists have to be written before the first flying rehearsal. Simone Haigh, the stage manager, wants rehearsal calls on an even interval so forty-one people can see where the day ends. Kwame Osei needs the trim heights for eleven battens, which are not evenly spaced because the grid is not. Marguerite Sallow wants both on one sheet by six. Today you build each sequence, and say which kind each one is. A list that looks even and is not is a list somebody works to and gets wrong.
    takeaway: A constant difference and a constant ratio are two different kinds of list.
    stops:
      - group: FLY
        task: Work out the eleventh trim height
        title: The same step, eleven times
        place: Fly Floor
        relationship: >-
          The arithmetic sequence aₙ = a₁ + (n − 1)d, with d the common difference added each time.
        concept: 'Arithmetic sequences: a constant difference'
        takesAsRead:
          - 'Average rate of change over an interval'
        scene: >
          Osei's trim heights start at 2.40 metres for the first batten and rise 0.34 metres for
          each one upstage. There are eleven battens. He needs the last one before he sets the
          counterweights.
        guide: >-
          A sequence that adds the same amount each time is fixed by two numbers: where it starts
          and what it adds. The trap is the count. Going from the first term to the eleventh is ten
          steps, not eleven, and one step of 0.34 metres is the difference between a piece that
          clears the grid and one that does not.
        background:
          - >-
              Why the trim heights rise at all. The grid is not level with the stage: each batten
              upstage sits a little higher, so a cloth hung on the eleventh has to be flown further
              to clear the one in front of it. The rise is set by the ironwork and is genuinely
              constant.
          - >-
              Why the off-by-one is the whole risk. Eleven terms have ten gaps. Using eleven gives
              6.14 metres instead of 5.80, which is a batten trimmed 340 millimetres high — enough
              that the cloth shows its bottom edge to the front rows.
          - >-
              What makes it arithmetic rather than geometric. The heights add a constant, they do not
              multiply by one. A geometric rise would put the eleventh batten at nearly forty metres,
              which is above the roof, and noticing that is faster than checking the arithmetic.
        assumes:
          - the rise between battens is constant across all eleven
        takeaway: A sequence with n terms has n − 1 steps in it.
        format: VERIFY
        question: Predict the eleventh trim height, then put a tape on it and report.
        verify:
          hint: >-
            Lock the prediction before the tape goes up. Eleven battens have ten gaps between them,
            and both numbers are on the ironwork drawing.
          prediction: { label: Predicted trim height of batten eleven, unit: m, min: 2, max: 9, step: 0.05 }
          truth: 5.80
          passRatio: [0.9, 1.1]
          intervention:
            label: Send a tape up to batten eleven
            note: One flyman on the grid ladder, measuring from the stage floor.
            outcome: Tape up. Read at the batten with the set at working trim.
          measurement:
            label: Measured trim height
            note: 5.74 metres — six centimetres under the drawing, which is the ironwork rather than the arithmetic.
            cost: 1
            costUnit: climbs
          unmeasuredMoral: >-
            A trim height computed from a drawing is a statement about the drawing. The counterweights
            are set against the batten, and only the tape knows where the batten is.
          commit: Report the trim height
        answerText: >-
          Predicted 5.80 metres from ten steps of 0.34, measured 5.74 — six centimetres of accumulated
          ironwork, and nowhere near the 6.14 that eleven steps would have given.
        why: >
          Eleven battens have ten gaps, so the prediction is 2.40 plus ten steps of 0.34: 5.80 metres.
          The tape says 5.74. Six centimetres over ten spacings is the ironwork rather than the
          arithmetic, and it is exactly the sort of drift a 1911 building accumulates. What the
          measurement rules out is the off-by-one: eleven steps would have given 6.14, which is 400
          millimetres above what the tape found, and 340 of those millimetres would have been a cloth
          showing its bottom edge to the front rows all evening.
      - group: SHOP
        task: Say which sequence the timber order follows
        title: Sixteen pieces, each a little shorter
        place: Scene Shop
        concept: 'Arithmetic sequences: a constant difference'
        takesAsRead:
          - 'Average rate of change over an interval'
        scene: >
          Novak has sixteen treads for a raked rostrum. The first is 3.60 metres and each one is
          4 per cent shorter than the one below it. Quirke has written the order out as a constant
          subtraction.
        guide: >-
          Read what the design says rather than what the order sheet says. Four per cent shorter
          than the one below is a multiplication, repeated; a constant subtraction is an addition,
          repeated. Work out where the two lists disagree, and by how much at the top of the rake.
        background:
          - >-
              Why the two look identical at first. Over the first two or three terms, four per cent of
              3.60 is about 0.14 metres, so a constant subtraction of 0.14 fits almost exactly. The
              lists diverge slowly and then obviously, which is why the mistake survives the first
              few pieces being cut correctly.
          - >-
              Where they end up. Sixteen terms at four per cent leaves the last tread at 1.98 metres.
              Sixteen terms subtracting 0.14 leaves it at 1.50. Half a metre of tread, on a piece a
              performer stands on.
          - >-
              Which one the design means. A raked rostrum narrows in proportion because it is
              following a perspective, and a perspective is a ratio. That is a fact about the drawing
              rather than about arithmetic, and it is the reason to ask before ordering.
        assumes:
          - the design's four per cent is per tread rather than overall
        takeaway: A constant proportional change is a ratio, and it only looks like a difference at the start.
        format: CHOICE
        question: What is wrong with writing the treads as a constant subtraction?
        choices:
          - It matches for the first few and is half a metre out by the top
          - It gives a negative length before the sixteenth tread
          - Constant subtraction cannot be used for lengths at all
          - The design's percentage is an overall reduction rather than per tread
        answer: It matches for the first few and is half a metre out by the top
        why: >
          Four per cent of 3.60 is 0.144, so a constant subtraction of about 0.14 fits the first
          two or three treads almost exactly and then drifts: the ratio takes four per cent of a
          steadily smaller number while the subtraction keeps taking the same amount. By the
          sixteenth tread the two lists are 1.98 metres and 1.50 metres, which is half a metre of
          timber on a piece somebody stands on. The subtraction does not go negative in sixteen
          terms, so nothing about the order sheet looks absurd, and that is exactly why it would
          have been cut.
        rebuttals:
          - Sixteen steps of 0.14 from 3.60 leaves 1.50 metres, which is short but not negative.
          - Constant subtraction is perfectly usable for lengths; it is the wrong model for this design.
          - The design specifies four per cent per tread, which is what makes it a ratio.
      - group: PIT
        task: Work out what the gain stages come to
        title: Four stages, each times something
        place: Orchestra Pit and Sound
        relationship: >-
          The geometric sequence aₙ = a₁ · rⁿ⁻¹, with r the common ratio multiplied in at each stage.
        concept: 'Geometric sequences: a constant ratio'
        takesAsRead:
          - 'Arithmetic sequences: a constant difference'
        scene: >
          Ilse Brand, the sound designer, has a signal through four stages, each multiplying it by 3.2: the microphone
          preamp, the desk channel, the group and the amplifier. The input is 0.004 volts.
        guide: >-
          Gain stages multiply. Four of them at 3.2 each is not 12.8 times the signal, and the
          difference between adding and multiplying is the entire reason a chain like this clips.
          Work out what arrives at the amplifier, then compare it with what adding the gains would
          have suggested.
        background:
          - >-
              Why every stage multiplies. Each one takes whatever arrives and scales it, so the
              output is the input times the product of the gains. That is a geometric sequence with
              the input as its first term, and it is why gain is quoted in decibels — logarithms turn
              the multiplication into an addition a person can do in their head.
          - >-
              What clipping is. Every stage has a ceiling, and a chain that multiplies reaches it
              suddenly. Four stages of 3.2 is a factor of 105, so an input a little hotter than
              expected arrives at the amplifier far past what it can pass, and the result is
              distortion rather than loudness.
          - >-
              Why the fourth stage is where it shows. The first three multiply a small number and
              the fourth multiplies a large one. The same 3.2 is worth 0.009 volts at the first stage
              and 0.29 at the last, which is why gain is set from the front of the chain backwards.
        assumes:
          - each stage passes its input to the next without limiting
        takeaway: Gains multiply, so a chain reaches its ceiling suddenly rather than gradually.
        format: BALLPARK
        question: Estimate the signal arriving at the amplifier.
        estimate:
          prompt: 0.004 V in, four stages of 3.2 each. Brand wants the level at the amplifier input.
          question: Estimate the signal arriving at the amplifier.
          labels:
            - 0.004 V  (the microphone signal)
            - 3.2  (gain at each stage)
            - 4  (number of stages)
            - 12.8  (the four gains added)
          values: [0.004, 3.2, 4, 12.8]
          slots: 3
          template: '{0} × {1}^{2}'
          formula: a*Math.pow(b,c)
          correct: [0, 1, 2]
          target: 0.42
          tolerance: 0.05
          units: V
          solution: 0.004 × 3.2⁴ = 0.004 × 104.9 = 0.42 V.
          explanation: Four hundred and twenty millivolts, against 51 if the gains had added — a factor of eight between the two answers.
        answerText: About 0.42 volts, where adding the gains would have suggested 0.051.
        why: >
          Four stages of 3.2 multiply to 104.9, so 4 millivolts becomes 420. Adding the gains gives
          12.8 and an answer of 51 millivolts — a factor of eight out, and in the direction that
          makes a chain look safe when it is not. That is what makes this a geometric sequence
          rather than an arithmetic one: each stage scales what arrives rather than adding to it.
          It also explains where the trouble appears. The same 3.2 is worth nine millivolts at the
          first stage and 290 at the last, so gain is always set from the front backwards.
        rebuttals:
          - Adding the four gains treats each stage as contributing the same amount rather than the same factor.
          - Three stages rather than four is the level at the group output, one stage short of the amplifier.

  # ----- day 3. Angles: the beam and the corner.
  - title: What the lantern is pointing at
    objective: Get an angle out of two measurements, and a beam onto a mark.
    briefing: Adeyemi's plot is in bearings and the bars are hung on a plan drawn in 1911.
    stake: >-
      Wednesday, and the rig has to be plotted before the bars go out on Thursday. Tunde Adeyemi, the lighting designer, works in bearings and spreads and converts afterwards; Nuno Ferreira, the chief electrician, has to hang the units on a bar whose plan positions are 1911. Sallow wants the first look on Friday. Today you turn two measurements into an angle, and the angle into a position on a bar, and you say which shape the advance sales are actually following. Everything hung on a wrong angle is hung again in front of a company standing about, and the notes session is at six.
    takeaway: Two sides of a right triangle fix an angle, and the angle is what a rigger can work to.
    stops:
      - group: BOARD
        task: Work out the angle the lantern has to make
        title: Six metres up, nine metres out
        place: Lighting Board
        relationship: >-
          The tangent ratio, tan θ = opposite ÷ adjacent, so the angle is the arctan of opposite over adjacent.
        concept: 'Right-triangle ratios, and finding an angle from two sides'
        takesAsRead:
          - 'The unit circle, and sine and cosine as coordinates'
        scene: >
          The front-of-house bar is 6.2 metres above the stage floor and 9.4 metres out from the
          performer's mark. Adeyemi wants the down angle before Ferreira sets the yokes.
        guide: >-
          Two sides of a right triangle fix the angle. The height above the mark is opposite the
          angle at the lantern and the horizontal distance is adjacent to it, so the ratio of those
          two gives the tangent, and the inverse tangent gives the angle. Work it out, then say
          what the same lantern would need if the bar were two metres lower.
        background:
          - >-
              Why this angle rather than another. A performer's face is lit by what arrives from
              above and in front, and the usual figure is somewhere near thirty-five to forty-five
              degrees down. Steeper puts the eyes in shadow; shallower puts the light in the
              audience's eyes and flattens the face.
          - >-
              Why the inverse function is needed. The ratio is the easy part; the angle has to be
              recovered from it, and that is what an inverse trigonometric function is for. It
              returns one angle from a restricted range, which is all that is wanted here because a
              lantern's down angle is between zero and ninety degrees by construction.
          - >-
              Why the numbers come off the room. The bar height is measured with a tape from the
              stage floor and the distance from the mark is stepped out on the deck, because the
              1911 plan puts the bar 400 millimetres further out than it is.
        assumes:
          - the mark is on the centre line of the beam
        takeaway: A ratio of two sides gives the tangent, and the inverse tangent gives the angle back.
        format: BALLPARK
        question: Estimate the down angle from the bar to the mark.
        estimate:
          prompt: The bar is 6.2 m above the mark and 9.4 m out from it. Adeyemi needs the angle below the horizontal.
          question: Estimate the down angle from the bar to the mark.
          labels:
            - 6.2 m  (height above the mark)
            - 9.4 m  (horizontal distance to it)
            - 11.3 m  (the straight-line throw)
            - 45 deg  (the angle a designer would prefer)
          values: [6.2, 9.4, 11.3, 45]
          slots: 2
          template: 'arctan({0} ÷ {1})'
          formula: Math.atan(a/b)*180/Math.PI
          correct: [0, 1]
          target: 33.4
          tolerance: 2.5
          units: deg
          solution: θ = arctan(6.2 ÷ 9.4) = arctan(0.660) = 33.4°.
          explanation: Thirty-three degrees — shallow for a face light, which is a rigging problem rather than an arithmetic one.
        answerText: About 33 degrees below the horizontal, which is shallower than the designer wants.
        why: >
          The height is opposite the angle and the distance is adjacent to it, so the tangent is
          6.2 over 9.4, which is 0.66, and the inverse tangent of that is 33.4 degrees. The
          arithmetic settles a rigging argument: 33 degrees is shallow for a face light, so either
          the bar comes in or the mark moves upstage. Using the straight-line throw of 11.3 metres
          as one of the two sides gives 33 degrees for the wrong reason — that is the hypotenuse, and
          it belongs in a sine or a cosine rather than a tangent. The 45 degrees is what a designer
          would like and is not a measurement of anything in this room.
        rebuttals:
          - The 11.3 metres is the hypotenuse. Using it with the height gives a sine, not a tangent.
          - The 45 degrees is a preference rather than a measurement of this bar.
      - group: FRONT
        task: Say which curve the advance is following
        title: Flat, then vertical
        place: Box Office
        concept: 'Choosing a model, and what a residual says about the choice'
        takesAsRead:
          - 'Average rate of change over an interval'
        scene: >
          Dowd has four weeks now: 41, 66, 188, 402. Sallow wants a forecast for the fortnight.
          A straight line through the four points misses the last one by ninety seats.
        guide: >-
          Fit each candidate shape in your head and look at what it leaves over. A straight line has
          a constant difference, an exponential has a constant ratio, and a quadratic has a constant
          second difference. Work out which of the three the four numbers actually have, and treat
          the residuals — what each model missed by — as the evidence rather than the eye.
        background:
          - >-
              What the differences say. The steps are 25, 122 and 214, which is not constant, so it
              is not linear. The ratios are 1.6, 2.8 and 2.1, which is not constant either. The
              second differences are 97 and 92, which very nearly are — and that is a quadratic.
          - >-
              Why residuals rather than appearance. Any smooth curve through four points looks
              plausible drawn by hand. The residual is the observed value minus the predicted one,
              and a model with a pattern in its residuals is the wrong shape however close it looks.
          - >-
              Why the choice matters more than the fit. All three models agree closely inside the
              four weeks and disagree wildly outside them, which is where the forecast is. The
              fortnight ahead is exactly the region the data cannot arbitrate.
        assumes:
          - the four weekly figures are complete and comparable
        takeaway: Each family of function has its own fingerprint in a table of values.
        format: CHOICE
        question: Which family do the four weekly figures actually belong to?
        choices:
          - 'Quadratic: the second differences are nearly constant'
          - 'Linear: the sales rise every week'
          - 'Exponential: the sales more than double at one point'
          - None of them, because four points cannot identify a family
        answer: 'Quadratic: the second differences are nearly constant'
        why: >
          The first differences are 25, 122 and 214, which rules out a straight line. The ratios are
          1.6, 2.8 and 2.1, which rules out an exponential — a constant ratio is exactly what an
          exponential has. The second differences are 97 and 92, near enough constant to identify a
          quadratic. Rising every week makes a curve increasing rather than linear, and one doubling
          is not a constant ratio. Four points can identify a family, and the honest caveat is
          different: all three models agree inside the data and disagree wildly outside it, which is
          precisely where the forecast is wanted.
        rebuttals:
          - Rising every week makes it increasing. Linear needs the rise to be the same each week.
          - One doubling is not a constant ratio, and the ratios here run 1.6, 2.8 and 2.1.
          - Four points do identify a family from their differences; what they cannot do is justify extrapolation.
      - group: HOUSE
        task: Work out which row loses the corner
        title: Where the frame cuts in
        place: The House
        concept: 'Right-triangle ratios, and finding an angle from two sides'
        takesAsRead:
          - 'The unit circle, and sine and cosine as coordinates'
        scene: >
          The proscenium edge is 5.1 metres from the centre line. Kettleby is standing on the mark
          the show puts a performer, 2.8 metres left of centre and 3.4 metres upstage of the
          proscenium line.
        guide: >-
          The seat, the proscenium edge and the performer are three points, and whether the seat can
          see the performer is whether the edge is inside or outside the line between the other two.
          Work out the angle the sightline makes with the centre line, and the angle to the edge, and
          compare them. The one that is larger is what is in the way.
        background:
          - >-
              Why a performer upstage is worse than one downstage. The further behind the proscenium
              line somebody stands, the more of the stage the frame cuts off for a seat at the side —
              because the line from the seat has to pass the frame at a shallower angle. Three and a
              half metres upstage is a normal position for a solo spot.
          - >-
              What the comparison actually is. Two angles measured from the same point: the angle to
              the performer and the angle to the frame edge. If the frame's angle is the smaller one,
              the frame is inside the sightline and the seat sees the performer; if it is larger, it
              is not.
          - >-
              Why this is arithmetic rather than judgement. A seat either has a clear line or it does
              not, and the answer follows from four measured distances. What is a judgement is what to
              do about it, and that is tomorrow's argument rather than today's.
        assumes:
          - the proscenium edge is a straight vertical line at that distance from centre
        takeaway: Whether a seat sees a mark is two angles from the same point, compared.
        format: PROTOCOL
        task: Match each pair of measurements to the angle it gives.
        columns:
          - What is measured
          - What it gives
        scenarios:
          - 2.8 m left of centre, 3.4 m upstage of the proscenium line
          - 5.1 m from centre at the proscenium line, seat 14 m back
          - Seat 14 m back, 7.6 m left of centre
          - Proscenium 5.1 m from centre, performer 2.8 m left of centre
        choices:
          - The performer's position, as an offset and a depth
          - 'The angle from that seat to the frame edge: arctan of 5.1 over 14'
          - 'The seat''s own bearing from the centre line: arctan of 7.6 over 14'
          - The gap between frame and performer across the stage, which is 2.3 m
        mapping: [0, 1, 2, 3]
        rebuttals:
          - Two distances from the centre line and the proscenium fix where the performer is standing, and nothing else.
          - The frame edge and the seat's distance back give the angle at which the frame cuts across that seat's view.
          - A seat's offset and its distance back give its own bearing from the centre line.
          - Two distances measured across the stage give a gap, which is not an angle at all.
        answerText: >-
          Offset and depth fix the performer; frame and seat distance give the frame's angle; offset
          and depth give the seat's bearing; two cross-stage distances give only a gap.
        why: >
          Every angle here comes from two perpendicular distances, and the discipline is keeping
          track of which point each one is measured from. The performer's position is an offset and a
          depth. The frame's angle is measured from the seat, using the frame's offset and the seat's
          distance back. The seat's own bearing uses its own offset and the same depth. The fourth
          pair is the one that is not an angle at all: two distances measured across the stage give
          the gap between the frame and the performer, which is 2.3 metres and tells you nothing
          about any seat until it is put with a distance back.

  # ----- day 4. Waves, and a curve that decays.
  - title: Four numbers describe a wave
    objective: Read a waveform for its four parameters, and fit a decay to the ticket returns.
    briefing: Brand has a trace off the desk and Dowd has three weeks of returns.
    stake: >-
      Thursday, and the band plays into the room for the first time at two. Ilse Brand, the sound designer, has a trace off the desk that the pit cannot interpret and Thandi Mbatha, the musical director, has nine players covering an arrangement for twenty-two. Meanwhile Dowd's returns are running and Sallow wants them forecast. Today you describe a wave in the four numbers that fix it, and put a shape on a set of returns. A waveform argued about in adjectives is a waveform nobody can set a fader to.
    takeaway: Amplitude, midline, period and phase fix a sinusoid completely.
    stops:
      - group: PIT
        task: Read the four parameters off the trace
        title: Tall, often, centred, and starting where
        place: Orchestra Pit and Sound
        relationship: >-
          The sinusoid y = A·sin(B(x − C)) + D, with A the amplitude, B setting the period, C the phase shift and D the midline.
        concept: 'A sinusoid: amplitude, midline, period and phase'
        takesAsRead:
          - 'The unit circle, and sine and cosine as coordinates'
        scene: >
          The trace runs between 0.18 and 0.62 volts. It repeats every 4.5 milliseconds. Its first
          upward crossing of the middle comes 0.9 milliseconds after the trigger.
        guide: >-
          Four numbers fix any sine wave and each one comes off the trace directly. The midline is
          halfway between the top and the bottom; the amplitude is half the distance between them;
          the period is the repeat; and the phase is where the cycle starts relative to the
          trigger. Work out the first two and say what the other two are read from.
        background:
          - >-
              Why amplitude is half and not all. The amplitude is measured from the midline to the
              peak, so the peak-to-peak figure an oscilloscope shows is twice it. This is the most
              common misreading of a trace and it doubles every level derived from it.
          - >-
              Why the midline is not zero here. The signal is riding on a direct offset of 0.40
              volts, which is a fault rather than a feature: something upstream is passing a standing
              voltage. It does not change the sound and it does eat headroom, and it is visible only
              because the midline was read rather than assumed.
          - >-
              Why the phase matters to Mbatha rather than to Brand. Two instruments a fraction of a
              cycle apart do not sound bigger, they sound wrong, and the fix is timing. The phase
              shift is the number that says how far apart they are in the only units that matter,
              which is a fraction of a period.
        assumes:
          - the trace is a single sinusoid rather than a sum of several
        takeaway: Amplitude is measured from the midline, not from the bottom of the trace.
        format: BALLPARK
        question: Estimate the amplitude of the trace.
        estimate:
          prompt: The trace runs between 0.18 V and 0.62 V. Brand wants the amplitude, not the peak-to-peak.
          question: Estimate the amplitude of the trace.
          labels:
            - 0.62 V  (the top of the trace)
            - 0.18 V  (the bottom of the trace)
            - 2  (the divisor that makes it an amplitude)
            - 4.5 ms  (the repeat interval)
          values: [0.62, 0.18, 2, 4.5]
          slots: 3
          template: '({0} − {1}) ÷ {2}'
          formula: (a-b)/c
          correct: [0, 1, 2]
          target: 0.22
          tolerance: 0.02
          units: V
          solution: A = (0.62 − 0.18) ÷ 2 = 0.22 V, on a midline of 0.40 V.
          explanation: 0.22 volts amplitude on a 0.40 volt midline — and that midline is a standing offset that should not be there.
        answerText: 0.22 volts, sitting on a midline of 0.40 that should not be there at all.
        why: >
          The peak-to-peak span is 0.44 volts, so the amplitude — measured from the midline to the
          peak — is half of it: 0.22. Reading 0.44 as the amplitude is the standard error and doubles
          every level derived from the trace. The more interesting number is the one that falls out
          for free: the midline is 0.40 volts rather than zero, so the signal is riding on a standing
          offset. It does not change what anybody hears and it eats headroom, and it is only visible
          because the midline was read rather than assumed to be zero.
        rebuttals:
          - The full span between the extremes is peak-to-peak, which is twice the amplitude.
          - The top of the trace on its own is a peak measured from zero, not from the wave's own middle.
      - group: FRONT
        task: Fit the returns to a decay
        title: The same fraction each week
        place: Box Office
        relationship: >-
          The exponential model y = a · bˣ, with a the value at the start and b the factor per week.
        concept: 'Exponential functions, and why a constant ratio is not a constant difference'
        takesAsRead:
          - 'Geometric sequences: a constant ratio'
        scene: >
          Returned tickets: 84 in the first week after they went on sale, then 59, then 41.
          Dowd wants the fourth week before she releases the held seats.
        guide: >-
          Look at the ratios rather than the differences. Each week's returns divided by the week
          before gives roughly the same number, which is what an exponential is. Work out the ratio,
          apply it once more, and say what the model does and does not entitle anybody to claim
          about week eight.
        background:
          - >-
              Why returns decay proportionally. The people most likely to return a ticket do it soon
              after buying, so each week draws on a shrinking pool of recent buyers. That produces a
              constant fraction rather than a constant number, which is the signature of an
              exponential.
          - >-
              Why the difference test fails here. The drops are 25 and 18, which is not constant, so
              a straight line is out. The ratios are 0.70 and 0.69, which is about as constant as
              three real numbers get, and it is the ratio that identifies the family.
          - >-
              What it cannot say. The model is fitted over three weeks and the fortnight ahead is
              outside them. Returns will not follow this curve to zero — there is a floor of
              cancellations that happen for reasons unrelated to buying — and a model quoted past its
              data is a claim about a mechanism nobody has checked.
        assumes:
          - the three weekly return figures cover complete weeks
        takeaway: A constant ratio identifies an exponential; a constant difference identifies a line.
        format: BALLPARK
        question: Estimate next week's returns from the ratio.
        estimate:
          prompt: Returns by week: 84, 59, 41. Dowd wants the fourth week before releasing the held seats.
          question: Estimate next week's returns from the ratio.
          labels:
            - 41  (returns in the third week)
            - 0.70  (the weekly ratio)
            - 18  (the last drop, in tickets)
            - 84  (returns in the first week)
          values: [41, 0.70, 18, 84]
          slots: 2
          template: '{0} × {1}'
          formula: a*b
          correct: [0, 1]
          target: 28.7
          tolerance: 3
          units: tickets
          solution: 41 × 0.70 = 28.7 tickets.
          explanation: About twenty-nine. Subtracting the last drop of 18 instead gives 23, and the two diverge fast after that.
        answerText: About 29 tickets, where subtracting the last drop would have said 23.
        why: >
          The ratios are 0.70 and 0.69, so the sensible model multiplies by about 0.70 each week:
          41 becomes 29. Subtracting the last drop of 18 gives 23, and the two answers diverge fast
          — by week six the ratio model says 14 and the subtraction says nothing at all, because it
          has gone negative. That is the practical test between the families and it is worth doing on
          three numbers. What the model does not license is week eight: it is fitted on three weeks,
          returns have a floor made of cancellations that happen for their own reasons, and a curve
          quoted past its data is a claim about a mechanism nobody has checked.
        rebuttals:
          - Subtracting the last drop treats a shrinking quantity as falling by a constant amount, and it goes negative by week six.
          - The first week's figure is where the decay started, not what it is now multiplying.
      - group: BOARD
        task: Say what happens when the lantern moves back
        title: Twice as far, a quarter as bright
        place: Lighting Board
        concept: 'Transformations: shift, stretch and reflect'
        takesAsRead:
          - 'A function as a rule, its domain and what the domain rules out'
        scene: >
          Ferreira has to move a unit off the front bar because the flying sequence needs the
          space. The new position is twice as far from the mark. Adeyemi says the level goes to a
          quarter; Sallow has been told it halves.
        guide: >-
          Ask what the function of distance actually is before arguing about the factor. Light from
          a point source spreads over a sphere, and the area of a sphere goes as the square of the
          radius, so the level at a surface goes as one over the distance squared. Then say what
          that means for the two claims in the room, and what could be done about it.
        background:
          - >-
              Why the square rather than the distance. The same light spreads over a surface that
              grows as the square of the radius, so it is diluted by that square. Doubling the
              distance quadruples the area and quarters the level. This is not specific to light: it
              is what happens to anything radiating outward from a point.
          - >-
              What can be done about it. A narrower beam angle puts the same output on a smaller
              patch, which recovers level at the cost of coverage — so a unit moved back can be
              re-lensed rather than replaced. What cannot be recovered is the softness that comes
              with a wide beam close in.
          - >-
              Why the mistake is so common. Intuition is linear. Twice as far sounding like half as
              bright is one of the most reliable wrong answers in a technical rehearsal, and the
              correction is a factor of two on a number somebody has already set a fader to.
        assumes:
          - the unit can be treated as a point source at these distances
        takeaway: A quantity spreading over a sphere falls as the square of the distance.
        format: CHOICE
        question: What does doubling the throw do to the level at the mark?
        choices:
          - 'Quarters it: four times the area to cover'
          - Halves it, because the level falls in proportion to the distance travelled
          - Leaves it unchanged, since the beam angle has not been altered
          - Reduces it by an amount that depends on the colour in the unit
        answer: 'Quarters it: four times the area to cover'
        why: >
          Light from a point spreads over a sphere, and a sphere's area goes as the square of its
          radius, so twice the distance is four times the area and a quarter of the level. Halving is
          the intuitive answer and it is wrong by a factor of two on a number somebody has already
          set a fader to. Keeping the beam angle unchanged is exactly the case being described — the
          angle is what makes the patch bigger as the unit goes back. Colour costs level through the
          filter and does so at any distance, so it is a separate multiplication rather than an
          explanation of this one. What recovers the level is a narrower lens, at the price of
          coverage.
        rebuttals:
          - Halving is the linear intuition; the area the light covers grows as the square.
          - 'An unchanged beam angle is the case in question: the same cone covers four times the area at twice the distance.'
          - A colour filter costs level at every distance and does not change how level falls with distance.

  # ----- day 5. Logs, and a beam described from the centre out.
  - title: Adding what multiplies
    objective: Turn the gain chain into decibels and the beam plot into coordinates.
    briefing: Brand's desk is calibrated in decibels and Adeyemi's plot is in bearings.
    stake: >-
      Friday, and the first technical run is at four. Brand has a chain of gains that multiply and a desk marked in decibels, and Mbatha wants two channels matched by ear rather than by number, which Brand will not do. Adeyemi's rig plot is a list of bearings and distances that Ferreira has to turn into positions on a bar. Today you use logarithms to add what would otherwise multiply, and convert a beam from a bearing to a coordinate. Two people describing the same rig in different coordinates argue for an hour and hang nothing.
    takeaway: Logarithms turn multiplication into addition, which is what a fader is.
    stops:
      - group: PIT
        task: Add the gains instead of multiplying them
        title: Why a fader is a logarithm
        place: Orchestra Pit and Sound
        relationship: >-
          The log rules: log(xy) = log x + log y, so you add the logs instead of multiplying the gains, which is why a desk is marked in decibels.
        concept: 'Log properties, and why a product becomes a sum'
        takesAsRead:
          - 'Logarithms as inverse exponentials'
        scene: >
          The chain multiplies by 3.2, then 4.0, then 2.5, then 8.0. Brand wants each stage marked
          on the desk in decibels so the crew can add them in their heads.
        guide: >-
          A product of four factors becomes a sum of four logarithms. Take the log of each gain,
          multiply by twenty to get voltage decibels, and add. Then check the answer against the
          log of the product, because the whole point of the rule is that those two are the same
          number arrived at two ways.
        background:
          - >-
              Why twenty rather than ten. For a voltage ratio the decibel is twenty times the log,
              because power goes as the square of voltage and the ten-times-log definition is written
              for power. Mixing the two is a factor of two on every number, which is four decibels on
              a typical stage gain.
          - >-
              What the rule buys in practice. Four multiplications with a calculator become four
              additions in the head, and a crew can then talk about a stage as plus ten or minus six
              rather than as times three point two. Every fader, every trim and every pad on the desk
              is marked that way for this reason.
          - >-
              Why the check matters. The sum of the logs and the log of the product are equal by the
              rule, so computing both is a free verification. A discrepancy means a gain was written
              down wrong, which is what the check is for.
        assumes:
          - the gains are voltage ratios rather than power ratios
        takeaway: The sum of the logs equals the log of the product, which is why gains add on a desk.
        format: BALANCE
        question: Read what you need and report the chain's total gain in decibels.
        balance:
          hint: >-
            Reading a stage off the desk is free. Counting it is the claim you are making about what
            the chain does to the signal.
          total: { amount: 38.2, unit: dB, label: Total gain from microphone to amplifier }
          streams:
            - { id: pre, label: Microphone preamp, value: 10.1, display: 'gain 3.2, which is 10.1 dB' }
            - { id: chan, label: Desk channel, value: 12.0, display: 'gain 4.0, which is 12.0 dB' }
            - { id: group, label: Group bus, value: 8.0, display: 'gain 2.5, which is 8.0 dB' }
            - { id: amp, label: Amplifier input stage, value: 18.1, display: 'gain 8.0, which is 18.1 dB' }
            - { id: pad, label: Pad in the microphone barrel, value: -10.0, display: 'a 10 dB pad, switched in and not on the desk', hidden: true, note: 'nothing on the desk shows it' }
            - { id: fader, label: The fader position itself, value: 0, display: 'at unity — a position rather than a gain' }
          tolerance: 3
          commit: Report the total gain
        answerText: >-
          About 38 decibels once the barrel pad is counted: 48.2 from the four stages, less the ten
          the pad is taking out where nothing on the desk shows it.
        why: >
          Each stage multiplies. A log turns that into a sum. So the four stages add to 48.2 dB
          rather than being multiplied out to 256. The term that hides is the pad in the mike
          barrel. Ten dB, switched in at the capsule, and nothing on the desk shows it. It is also
          why the channel needed so much gain. The total is 38 dB, not 48. The fader is the other
          trap. At unity it is a position rather than a gain, so counting it adds nothing.
      - group: BOARD
        task: Turn the bearing into a position on the bar
        title: From the centre out
        place: Lighting Board
        relationship: >-
          Polar to rectangular: x = r cos θ and y = r sin θ, so a bearing and a distance name the same point as two coordinates.
        concept: 'Converting between polar and rectangular'
        takesAsRead:
          - 'Polar coordinates, and a beam described as r of theta'
        scene: >
          Adeyemi's plot puts a unit 7.4 metres from the centre of the proscenium at a bearing of
          38 degrees off the centre line. Ferreira works in metres left or right of centre and
          metres upstage.
        guide: >-
          A bearing and a distance are one description of a point and two perpendicular offsets are
          another. The conversion is a right triangle: the distance is the hypotenuse, the bearing
          is the angle at the centre, and the two offsets are the sides. Work out both offsets, and
          say which of them the rigger actually needs first.
        background:
          - >-
              Why a designer works in polar and a rigger in rectangular. A lantern is aimed, so its
              natural description is a direction and a throw. A bar is a straight line with positions
              along it, so its natural description is a distance from centre. Both are right and the
              conversion is the interface between two trades.
          - >-
              Which offset matters first. The across-stage figure is where on the bar the unit hangs,
              which has to be right before anything is bolted. The upstage figure decides which bar,
              and there are only four to choose from, so it is coarser and easier to fix.
          - >-
              What goes wrong without the conversion. Two people describing the same rig in different
              coordinates agree about everything and hang nothing, or worse, hang it 900 millimetres
              out because a bearing was read as an offset.
        assumes:
          - the bearing is measured from the centre line toward stage left
        takeaway: A bearing and a distance convert to two offsets through one right triangle.
        format: BALLPARK
        question: Estimate how far off centre the unit hangs.
        estimate:
          prompt: The plot gives 7.4 m at 38 degrees off the centre line. Ferreira needs the across-stage offset.
          question: Estimate how far off centre the unit hangs.
          labels:
            - 7.4 m  (distance from the centre of the proscenium)
            - 38 deg  (bearing off the centre line)
            - 5.8 m  (the upstage offset, for the bar choice)
            - 52 deg  (the complement of the bearing)
          values: [7.4, 38, 5.8, 52]
          slots: 2
          template: '{0} × sin({1})'
          formula: a*Math.sin(b*Math.PI/180)
          correct: [0, 1]
          target: 4.56
          tolerance: 0.3
          units: m
          solution: across = r·sin θ = 7.4 × sin 38° = 4.56 m off centre.
          explanation: Four metres fifty-six off centre, with 5.8 upstage — which picks the bar as well as the position on it.
        answerText: About 4.56 metres off centre, with 5.8 metres upstage choosing the bar.
        why: >
          The distance is the hypotenuse and the bearing is the angle at the centre, so the
          across-stage offset is 7.4 times the sine of 38 degrees: 4.56 metres. Using the cosine
          gives 5.83, which is the upstage offset — a perfectly real number for a different question,
          and the reason the two are on the same tile row. Getting them the wrong way round hangs the
          unit 1.3 metres out of position, which on a front bar is the difference between lighting a
          performer and lighting the person beside them. The complement of the angle is on the row
          because using it swaps the two offsets silently.
        rebuttals:
          - The cosine of the bearing gives the upstage offset, which chooses the bar rather than the position along it.
          - Using the complement of the angle swaps the two offsets without changing either number's plausibility.
      - group: FLY
        task: Say what the two lines are each pulling
        title: Not half each
        place: Fly Floor
        relationship: >-
          The magnitude of a vector from its components, |v| = √(vₓ² + v_y²).
        concept: 'Vectors: components, magnitude and direction'
        takesAsRead:
          - 'Right-triangle ratios, and finding an angle from two sides'
        scene: >
          A cloth weighing 180 kilograms hangs from two lines. The grid is narrower than the
          stage, so each line leans 22 degrees off the vertical. Osei will not lift it until the
          per-line figure is written down.
        guide: >-
          A line pulls along its own length, so only part of that pull is vertical. Split each
          line's tension into a vertical part, which carries the weight, and a horizontal part,
          which does not. Then work out what each line has to pull for the two vertical parts to add
          up to 180 kilograms of load.
        background:
          - >-
              Why leaning costs. The vertical components have to sum to the weight whatever the
              angle, so as the lines lean further each one has to pull harder to keep its vertical
              part the same. At 22 degrees the penalty is about eight per cent; at 60 degrees each
              line pulls the whole weight.
          - >-
              Where the horizontal parts go. They point toward each other and cancel at the piece,
              which is why it hangs still. They do not cancel at the grid: each line puts a sideways
              pull into the ironwork, which is what the 1958 conversion never accounted for.
          - >-
              Why Osei wants it written. A per-line tension is what a line's rating is compared
              against, and half the weight is the number people say. The difference between 90 and 97
              kilograms is small; the difference at the angles this grid forces on a wide cloth is
              not.
        assumes:
          - the two lines are symmetric about the piece's centre of mass
        takeaway: Only the vertical component of a leaning line carries the load.
        format: BALLPARK
        question: Estimate the tension in each of the two lines.
        estimate:
          prompt: 180 kg on two lines, each leaning 22 degrees off the vertical. Osei wants the per-line figure.
          question: Estimate the tension in each of the two lines.
          labels:
            - 180 kg  (the weight of the cloth)
            - 2  (the number of lines)
            - 22 deg  (each line's lean off the vertical)
            - 90 kg  (half the weight, as usually quoted)
          values: [180, 2, 22, 90]
          slots: 3
          template: '{0} ÷ ({1} × cos {2})'
          formula: a/(b*Math.cos(c*Math.PI/180))
          correct: [0, 1, 2]
          target: 97.1
          tolerance: 4
          units: kg
          solution: T = 180 ÷ (2 × cos 22°) = 180 ÷ 1.855 = 97.1 kg per line.
          explanation: Ninety-seven kilograms a line rather than ninety — eight per cent, and it grows fast as the lines lean further.
        answerText: About 97 kilograms in each line, not the 90 that halving gives.
        why: >
          Each line's vertical component is its tension times the cosine of its lean, and the two
          vertical components have to add to 180 kilograms. So each line pulls 180 over twice the
          cosine of 22 degrees, which is 97.1 kilograms. Halving the weight gives 90 and assumes the
          lines are vertical, which they are not, because the grid is narrower than the stage. Eight
          per cent sounds ignorable and the point is the shape of the relationship: at 45 degrees each
          line pulls 127 kilograms, and at 60 it pulls the whole 180. The horizontal components
          cancel at the cloth and do not cancel at the grid.
        rebuttals:
          - Halving the weight assumes both lines are vertical, which is the one thing this grid does not allow.
          - Using the sine gives the horizontal pull, which is what the ironwork feels rather than what carries the cloth.

  # ----- day 6. Levels, periods and a resultant.
  - title: How often, how loud, how hard
    objective: Set a level against the licence, a period against a cue, and a resultant against a rating.
    briefing: Pell wants sound levels at the seat and Haigh wants the revolve timed.
    stake: >-
      Saturday, and Douglas Pell, the licensing officer, has asked for sound levels measured at the seat rather than at the desk. Haigh needs the revolve's period so the cue can be called on a count rather than on a look. Osei has a second cloth to fly and the first one's figure to compare it against. Today you work three numbers the licence file needs. A level read off a desk and a level at a seat are two different measurements, and only one of them is what an audience gets.
    takeaway: A level is a ratio on a logarithmic scale, and a period is what one cycle costs.
    stops:
      - group: PIT
        task: Work out the level at the seat
        title: Ten times the log of it
        place: Orchestra Pit and Sound
        relationship: >-
          The level in decibels, L = 10·log₁₀(I / I₀), with I the measured intensity and I₀ the reference.
        concept: 'The decibel: a logarithmic scale on a physical ratio'
        takesAsRead:
          - 'Log properties, and why a product becomes a sum'
        scene: >
          The meter at row F reads an intensity of 3.2 × 10⁻⁴ watts per square metre. The
          reference for the scale is 1.0 × 10⁻¹² watts per square metre. The licence caps the
          house at 103 decibels.
        guide: >-
          A decibel level is ten times the logarithm of the measured intensity divided by the
          reference. Work out the ratio first, then the logarithm, then the ten. Compare what comes
          out with the licence cap, and note how much the whole argument turns on the scale being
          logarithmic rather than linear.
        background:
          - >-
              Why the reference is in the formula at all. A decibel is a ratio, so it needs something
              to be a ratio of. The standard reference is the quietest audible intensity, which is why
              the numbers come out between zero and about 130 for everything a person meets.
          - >-
              What the cap means in intensity. Three decibels is a doubling, so a house at 106 is
              twice the intensity of one at 103, not three per cent more. That is what makes an
              argument about a few decibels an argument about factors.
        assumes:
          - the meter reading is an average over the passage rather than a peak
        takeaway: Ten decibels is a factor of ten, and three is a factor of two.
        format: BALLPARK
        question: Estimate the level at row F in decibels.
        estimate:
          prompt: The meter reads 3.2 × 10⁻⁴ W/m² at row F, against a reference of 1.0 × 10⁻¹². The cap is 103 dB.
          question: Estimate the level at row F in decibels.
          labels:
            - 3.2e-4  (measured intensity, W/m²)
            - 1.0e-12  (the reference intensity)
            - 10  (the multiplier for an intensity ratio)
            - 20  (the multiplier for a voltage ratio)
          values: [3.2e-4, 1.0e-12, 10, 20]
          slots: 3
          template: '{2} × log₁₀({0} ÷ {1})'
          formula: c*Math.log10(a/b)
          correct: [0, 1, 2]
          target: 85
          tolerance: 3
          units: dB
          solution: 10 × log₁₀(3.2 × 10⁸) = 10 × 8.51 = 85.1 dB.
          explanation: Eighty-five decibels, eighteen under the cap — which is a factor of sixty in intensity, not eighteen per cent.
        answerText: About 85 decibels, which is eighteen under the cap and a factor of sixty in intensity.
        why: >
          The ratio is 3.2 × 10⁸. Its logarithm is 8.51, and ten times that is 85 decibels. The
          margin to the cap is the part worth saying properly. Eighteen decibels is not eighteen per
          cent. It is a factor of about sixty in intensity, so the house has a great deal of headroom
          rather than a little. Using twenty as the multiplier gives 170. That is the voltage
          definition applied to an intensity, and it is above the threshold of pain — absurd enough
          to catch. Knowing which definition belongs to which quantity is what makes it catchable.
        rebuttals:
          - Twenty times the log is for a voltage ratio; this is an intensity, so it takes ten.
          - Without dividing by the reference there is no ratio, and a logarithm of a bare intensity is not a level.
      - group: BOARD
        task: Work out how long one turn takes
        title: Two pi over the coefficient
        place: Lighting Board
        relationship: >-
          The period from the inside coefficient, period = 2π ÷ B.
        concept: 'Period from the coefficient inside the function'
        takesAsRead:
          - 'A sinusoid: amplitude, midline, period and phase'
        scene: >
          The chase on the board runs as a sinusoid in the intensity of each circuit, written with
          an inside coefficient of 0.42 per second. Haigh needs the period to call the cue on a
          count.
        guide: >-
          The coefficient inside the function is what squeezes or stretches the cycle, and the period
          is two pi divided by it. Work it out in seconds, then say what a larger coefficient would do
          — because the relationship is inverse and the intuition usually runs the wrong way.
        background:
          - >-
              Why the relationship is inverse. The function completes a cycle when its argument
              advances by two pi, and the argument advances B times as fast as the input, so a larger B
              means a shorter cycle. Doubling the coefficient halves the period.
          - >-
              What a count is for. A cue called on a count rather than on a look is repeatable, and a
              period in seconds converts to a count at whatever tempo the band is playing. That
              conversion is why the number has to be a period and not a description.
        assumes:
          - the chase runs at a constant coefficient through the cue
        takeaway: A larger coefficient inside the function makes a shorter cycle, not a longer one.
        format: VERIFY
        question: Predict the period from the coefficient, then run the chase and time it.
        verify:
          hint: >-
            Lock the prediction before the chase runs. A cycle finishes when the argument has advanced
            by two pi, and the coefficient says how fast that happens.
          prediction: { label: Predicted period of the chase, unit: s, min: 2, max: 40, step: 0.5 }
          truth: 15.0
          passRatio: [0.9, 1.1]
          intervention:
            label: Run the chase and time it
            note: One full cycle, timed on the board's own clock from peak to peak.
            outcome: Chase run once. Timed peak to peak with a stopwatch on the desk.
          measurement:
            label: Measured period
            note: 15.2 seconds, which at 120 beats a minute is a count of thirty.
            cost: 1
            costUnit: runs
          unmeasuredMoral: >-
            A period computed from a coefficient is a statement about the software. Whether the board
            runs the chase at the rate it was given is a different claim, and the boards here are 1958.
          commit: Report the period
        answerText: >-
          Predicted 15.0 seconds from two pi over 0.42, timed at 15.2 — a count of thirty at 120 beats
          a minute, which is what Haigh can call the cue against.
        why: >
          A cycle finishes when the argument advances by two pi, and it advances 0.42 times as fast as
          the clock, so the period is 6.283 over 0.42: fifteen seconds. The board runs it at 15.2,
          which is the software doing what it was told. The relationship is inverse, which is where
          intuition fails — doubling the coefficient gives seven and a half seconds rather than thirty.
          Using pi instead of two pi halves the answer and would have put the cue in the wrong bar,
          and it is the measurement that would have caught it.
      - group: FLY
        task: Say what the grid feels sideways
        title: What cancels at the cloth and not at the grid
        place: Fly Floor
        concept: 'Adding vectors, and why two lines do not share a load equally'
        takesAsRead:
          - 'Vectors: components, magnitude and direction'
        scene: >
          Yesterday's cloth hangs on two lines at 22 degrees, each pulling 97 kilograms. Osei wants
          the sideways force each line puts into the grid ironwork before he adds a second cloth.
        guide: >-
          Split each tension into its two components again, but keep the horizontal one this time. At
          the cloth the two horizontal parts point at each other and cancel. At the grid they do not
          cancel, because they act at two different points, and that is the load the 1958 conversion
          never had a figure for.
        background:
          - >-
              Why cancellation depends on where you stand. Two equal and opposite forces at the same
              point sum to nothing. The same two forces applied at points four metres apart put the
              structure between them into tension, and nothing about the piece hanging still says
              otherwise.
          - >-
              What the ironwork was designed for. Vertical load, which is what a grid over a
              stage-width flying system carries. The Ellery's grid is narrower than its stage, so
              every wide piece leans its lines and adds a sideways component the drawings do not
              mention.
        assumes:
          - both lines lean by the same angle
        takeaway: Equal and opposite forces cancel at a point and load the structure between two points.
        format: CHOICE
        question: What does the sideways component of each line do?
        choices:
          - Loads the ironwork between the two lines in tension
          - Cancels completely, since the cloth hangs still
          - Adds to the vertical load on the grid
          - Only matters if the two lines lean by different angles
        answer: Loads the ironwork between the two lines in tension
        why: >
          Each line pulls 97 kilograms along its own length, and at 22 degrees the sideways part of
          that is about 36 kilograms. The two sideways parts point toward each other, so at the cloth
          they cancel and it hangs still — which is exactly why the problem is invisible. They are
          applied four metres apart at the grid, and two opposed forces at separated points put the
          structure between them in tension. Nothing about the piece being motionless says anything
          about what the ironwork carries. It does not add to the vertical load, which is a
          perpendicular direction, and unequal angles would make it worse rather than make it exist.
        rebuttals:
          - The cloth hanging still says the forces cancel at the cloth, not at the two points four metres apart.
          - A horizontal component is perpendicular to the vertical one and cannot add to it.
          - Unequal angles make the sideways forces unequal too; equal angles still load the ironwork.

  # ----- day 7. A room that rings.
  - title: The room is the instrument
    objective: Measure what the empty house does to sound, and what the seats will do about it.
    briefing: The house rings, the seats arrive on Tuesday, and Pell wants a figure either way.
    stake: >-
      Sunday, and the seats are on a lorry that arrives Tuesday. Brand can hear what the empty house does and cannot put a number on it until she measures the decay. Mbatha wants the pit rail lowered, which is a construction job Novak would have to start today. Pell wants the reverberation figure in the file whichever way it goes. Today you measure a decay and say what it will be once eight hundred and sixty people are sitting in it. A room measured empty is a measurement of a building nobody performs in.
    takeaway: A quantity falling by the same fraction each interval never quite reaches zero.
    stops:
      - group: HOUSE
        task: Work out how long the ring takes to fall
        title: The same fraction each half second
        place: The House
        relationship: >-
          A proportional decay, V = A·(1 − k)ᵗ, with k the fraction lost each interval and t the number of intervals.
        concept: 'Exponential functions, and why a constant ratio is not a constant difference'
        takesAsRead:
          - 'Geometric sequences: a constant ratio'
        scene: >
          Brand claps once in the empty house. The level is 92 decibels at the clap and falls by 28
          per cent of its remaining sound energy every half second.
        guide: >-
          A decay that removes the same fraction each interval is a repeated multiplication. Work out
          what fraction of the original energy is left after eight half-seconds, then say what that
          means for the reverberation time — the interval over which a room loses almost all of it.
        background:
          - >-
              Why a proportional decay never reaches zero. Each step takes a fraction of what remains,
              so there is always something left. In practice the sound falls below what anybody can
              hear, which is why reverberation time is defined against a stated drop rather than
              against silence.
          - >-
              Why the seats change it. Sound energy leaves a room by being absorbed, and an empty
              seat absorbs far less than an occupied one. Eight hundred and sixty people are the
              largest absorber the Ellery will ever contain, and their absence is why the room is
              currently unusable.
        assumes:
          - the decay fraction is constant across the interval measured
        takeaway: A proportional loss leaves a shrinking amount each step and never quite finishes.
        format: VERIFY
        question: Predict what is left after four seconds, then clap and measure it.
        verify:
          hint: >-
            Lock the prediction before the clap. Each half second leaves 72 per cent of what was there,
            and four seconds is eight of them.
          prediction: { label: Predicted energy remaining after four seconds, unit: '% of original', min: 0, max: 60, step: 0.5 }
          truth: 7.2
          passRatio: [0.7, 1.4]
          intervention:
            label: Clap once and record the tail
            note: Empty house, seats out, one clap from centre stage with the meter at row F.
            outcome: Recorded. The tail is measured from the clap to four seconds after it.
          measurement:
            label: Measured energy remaining
            note: 8.1 per cent — audible from row F, and the reason a line of dialogue is still in the air when the next one starts.
            cost: 1
            costUnit: claps
          unmeasuredMoral: >-
            A decay computed from a fraction is a statement about the fraction. What the room does is a
            measurement, and this room has had its seats out for eleven years.
          commit: Report the decay
        answerText: >-
          Predicted 7.2 per cent from 0.72 to the eighth, measured 8.1 — a room that rings straight
          through the next line.
        why: >
          Each half second leaves 72 per cent of what was there, and eight of those is 0.72 to the
          eighth: 7.2 per cent. The measurement gives 8.1, close enough to confirm the model and far
          enough above nothing to be plainly audible from row F, which is what an empty variety house
          sounds like. Using the lost fraction instead gives 0.28 to the eighth, a ten-millionth, which
          would describe a recording studio. Multiplying 0.28 by eight is the linear reflex and gives
          more than two — more energy than the clap had — which is the fastest way to notice the model
          is a repeated multiplication rather than a repeated subtraction.
      - group: SHOP
        task: Decide whether the rail comes down
        title: Three inches, and what it costs
        place: Scene Shop
        concept: 'Choosing a model, and what a residual says about the choice'
        takesAsRead:
          - 'Average rate of change over an interval'
        scene: >
          Mbatha wants the pit rail three inches lower. Novak has one day of shop time left before
          the seats arrive, and the rail is also a sightline for row A and a reflector for the band.
        guide: >-
          One change, three consequences, and they are measured in three different units. Work out
          what each of them is actually a function of, and which of the three can be answered from
          numbers already in the file. The answer is which measurement to take rather than what to do.
        background:
          - >-
              Why three inches is not a small change here. Row A sits 1.1 metres behind the rail, so
              three inches of rail height is nearly two degrees of sightline for that row — and the
              rail is the top edge of what those seats see over.
          - >-
              What the rail does for the band. It reflects sound back at the players, which is how
              nine people covering an arrangement for twenty-two hear each other. Lowering it improves
              the house and removes some of that, which is Mbatha asking for two contradictory things.
        assumes:
          - the shop has one working day before the seats arrive
        takeaway: One change with three consequences needs three measurements, not one opinion.
        format: CHOICE
        question: What should be measured before the rail is cut?
        choices:
          - What row A can see over the rail as it stands
          - How much the band's own level drops with the rail down
          - Whether the shop has time to cut it before Tuesday
          - What the rail weighs
        answer: What row A can see over the rail as it stands
        why: >
          Row A is the consequence that cannot be undone. Sound is adjustable — a fold-back for the
          band, or a reflector added later — and shop time is a scheduling fact rather than a
          measurement. But a seat that cannot see over a rail is a refund, and the rail is the top
          edge of what row A looks over, at nearly two degrees per three inches from 1.1 metres back.
          Measuring the band's drop is worth doing and it is a level that can be recovered by other
          means. What the rail weighs is a construction detail with no bearing on any of the three
          questions in the room.
        rebuttals:
          - The band's level can be recovered with fold-back; a sightline lost to a rail cannot.
          - Shop time is a constraint on doing it, not evidence about whether it should be done.
          - The rail's weight matters to whoever lifts it and to none of the three consequences.
      - group: FRONT
        task: Say what the model is a model of
        title: Where it stops being one
        place: Box Office
        concept: 'Reading a model: what it is a model of, and where it stops being one'
        takesAsRead:
          - 'Choosing a model, and what a residual says about the choice'
        scene: >
          The quadratic through four weeks of advance sales fits closely. Extended to week eight it
          predicts 2,140 seats sold, in a house that holds nine hundred.
        guide: >-
          Take the model at its word and see where the word breaks. Work out what the prediction says
          and compare it with something the model cannot know, then say which of the four statements
          about it is the honest one. A model that fits its data is a claim about that data.
        background:
          - >-
              What extrapolation actually assumes. That the mechanism producing the numbers keeps
              working the same way outside the range measured. Here it cannot: the house has nine
              hundred seats, so sales must flatten no matter what the curve does.
          - >-
              Why the fit is not the problem. The quadratic is the right family inside the four weeks,
              and its residuals are small. Choosing the right shape and then using it outside the data
              are two separate steps, and the second one is where this goes wrong.
        assumes:
          - the house capacity is fixed at nine hundred
        takeaway: A model fitted inside a range says nothing certain outside it.
        format: CHOICE
        question: What is the honest thing to say about the week-eight figure?
        choices:
          - The curve is right and the extrapolation is not
          - The quadratic was the wrong family after all
          - Sales will reach 900 and stop
          - The model needs more data before it can be used
        answer: The curve is right and the extrapolation is not
        why: >
          Two things are separately true. Inside the four weeks the quadratic is the right family and
          its residuals are small, so the fit is not in question. Outside them the model assumes a
          mechanism that keeps working, and it cannot here, because there are nine hundred seats. So
          the honest sentence keeps the fit and refuses the forecast. Saying the family was wrong
          throws away a good description of what happened. Saying sales will reach nine hundred and
          stop is a different model nobody has fitted — plausible, and not what these four numbers
          say. And more data does not fix an extrapolation; it only moves where the extrapolation
          starts.
        rebuttals:
          - The residuals inside the four weeks are small, so the family is right about the data it was fitted to.
          - A ceiling at nine hundred is a different model, and it has not been fitted to anything.
          - More data moves the edge of the range; it does not license predicting beyond the new edge either.

  # ----- day 8. Lux at the mark, and the second solution.
  - title: What arrives at the performer
    objective: Get a level onto a face, and find both angles a cue could be called at.
    briefing: The first look is tonight and the plot has not been checked against a meter.
    stake: >-
      Monday, and the first full look is at seven. Adeyemi's plot is drawn and Ferreira has not yet put a meter under any of it, which is where every rig argument starts. Haigh has a cue that has to fire when the revolve reaches a mark, and the chase reaches that level twice a cycle. Today you work out what arrives at the performer, find both times the cue could go, and say which seats the walked survey actually condemns. A trigonometric equation with one answer written down has usually had a second one thrown away, and a cue called on the wrong crossing fires fifteen seconds late.
    takeaway: A ratio falling as the square of a distance, and an equation with two solutions a cycle.
    stops:
      - group: BOARD
        task: Work out the level arriving at the mark
        title: Four pi d squared
        place: Lighting Board
        relationship: >-
          The inverse square law, I = P ÷ (4πd²), with P the output of the source and d the distance to the surface.
        concept: 'Transformations: shift, stretch and reflect'
        takesAsRead:
          - 'A function as a rule, its domain and what the domain rules out'
        scene: >
          The unit puts out 9,600 lumens. The mark is 11.3 metres away along the beam. Ferreira
          wants the figure before he puts a meter under it tonight.
        guide: >-
          Light leaving a point spreads over a sphere, and the area of that sphere is four pi times
          the radius squared. Divide the output by that area to get what arrives per square metre.
          Then compare it with what the same unit gives at half the distance, because the factor is
          the part worth carrying.
        background:
          - >-
              Why this is an estimate rather than a measurement. A real lantern is not a point and does
              not radiate in all directions — a lens puts most of the output into a cone, so the actual
              level is several times this figure. The spherical calculation gives the floor, which is
              why Ferreira meters it rather than trusting it.
          - >-
              What the square does to a rigging decision. Half the distance is four times the level, so
              a unit moved from eleven metres to five and a half gains two stops of light. That is why
              front-of-house positions are argued about more than any other part of a rig.
        assumes:
          - the unit can be treated as radiating into a sphere for a floor estimate
        takeaway: Output over four pi d squared is the floor, and a lens is what puts it above that.
        format: BALLPARK
        question: Estimate the illuminance arriving at the mark.
        estimate:
          prompt: 9,600 lumens at 11.3 m along the beam. Ferreira wants the spherical figure before he meters it.
          question: Estimate the illuminance arriving at the mark.
          labels:
            - 9600 lm  (output of the unit)
            - 11.3 m  (distance to the mark)
            - 12.566  (four pi)
            - 6.2 m  (the bar height above the mark)
          values: [9600, 11.3, 12.566, 6.2]
          slots: 3
          template: '{0} ÷ ({2} × {1}²)'
          formula: a/(c*b*b)
          correct: [0, 1, 2]
          target: 6.0
          tolerance: 0.8
          units: lux
          solution: I = 9600 ÷ (4π × 11.3²) = 9600 ÷ 1604 = 6.0 lux.
          explanation: Six lux as a spherical floor. A lens concentrates it many times over, which is why this figure is metered rather than trusted.
        answerText: About 6 lux as a floor — the lens puts the real figure many times above it.
        why: >
          The sphere at 11.3 metres has an area of 1,604 square metres, so 9,600 lumens spread over
          it is 6 lux. That is a floor rather than a prediction, because a lantern's lens puts most of
          its output into a narrow cone instead of a sphere — which is exactly why Ferreira meters at
          the mark. What the calculation is genuinely for is the exponent. Halving the distance
          quarters the area and quadruples the level, so moving a unit from eleven metres to five and
          a half is worth two stops, and that is why front-of-house positions are fought over.
          Dropping the four pi gives 75 lux and an answer that flatters the rig by more than tenfold.
        rebuttals:
          - Leaving out the four pi divides by a length squared rather than by an area.
          - Using the bar height rather than the throw measures a vertical drop, not the distance the light travels.
      - group: PIT
        task: Find both times the level is reached
        title: Twice a cycle
        place: Orchestra Pit and Sound
        concept: 'Solving a trigonometric equation, and the second solution'
        takesAsRead:
          - 'Inverse trigonometric functions, and the range they are restricted to'
          - 'Period from the coefficient inside the function'
        scene: >
          The chase rises and falls on a fifteen-second cycle between 10 and 90 per cent. Haigh's
          cue has to fire when it passes 70 per cent. The board's inverse function gives her one
          time.
        guide: >-
          A sinusoid passes any level between its extremes twice in every cycle — once going up and
          once coming down. The inverse function returns one of the two, because it is restricted to a
          single range. Work out where the other one is and say which of them the cue should use.
        background:
          - >-
              Why an inverse trigonometric function returns one answer. Sine is not one-to-one, so it
              has no inverse until its domain is restricted, and the restriction is what makes the
              inverse a function. The cost of that convenience is that the other solutions have to be
              recovered by hand.
          - >-
              How to recover the second one. Within one cycle, the two times a rising-then-falling wave
              crosses a level are symmetric about the peak. So the second is as far after the peak as
              the first is before it, and both repeat every period.
        assumes:
          - the chase runs one full cycle per cue
        takeaway: A sinusoid crosses any interior level twice a cycle, and the inverse gives one of them.
        format: CHOICE
        question: Where is the second time the chase passes 70 per cent?
        choices:
          - As far after the peak as the first is before it
          - Half a period after the first
          - One full period after the first
          - There is no second crossing within a cycle
        answer: As far after the peak as the first is before it
        why: >
          A rising-then-falling wave crosses any level between its extremes twice, and the two
          crossings are symmetric about the peak — so the second is as far after the peak as the first
          is before it. Half a period after the first is the general shape of the mistake: that
          spacing is only right for a crossing of the midline, and 70 per cent is well above it. One
          full period later is the same crossing in the next cycle rather than the second crossing in
          this one, which for a cue means firing fifteen seconds late. And there is certainly a second
          crossing, because the wave has to come back down; the inverse function simply does not
          return it.
        rebuttals:
          - Half a period apart is correct for a midline crossing and wrong for any other level.
          - One period later is the same crossing next cycle, which fires the cue fifteen seconds late.
          - The wave returns to every level it passed; the inverse function only reports one of the two.
      - group: HOUSE
        task: Say which seats the measurement condemns
        title: Six rows, two seats each
        place: The House
        concept: 'Solving a linear system, and what no solution looks like'
        takesAsRead:
          - 'Matrices as transformations of the plane'
        scene: >
          Kettleby has walked the front six rows with a marker on the performer's position. Rows A
          to F each lose the two outermost seats on the stage-left side. Sallow has nine hundred on
          sale.
        guide: >-
          A sightline is two lines that either meet on the stage or do not, which is a pair of
          equations with a solution or without one. Work out what the walked measurement establishes,
          and say what the honest description of a condemned seat is — because the difference between
          a bad seat and a seat that cannot see decides whether it is sold at all.
        background:
          - >-
              What no solution looks like here. The line from the seat past the proscenium edge and the
              line to the performer do not intersect anywhere on stage: there is no point the seat can
              see the performer from. That is a geometric fact rather than a matter of degree.
          - >-
              Why twelve seats and not six or twenty-four. Both sides of the house are symmetric about
              the centre line, so the count is doubled — but the marker was on a stage-left position, so
              a stage-right mark would condemn the mirror pair instead. Twelve is the count for this
              blocking.
        assumes:
          - the marker was placed where the show puts the performer
        takeaway: A sightline with no solution is a seat that cannot see, rather than a seat that sees badly.
        format: CHOICE
        question: What does the walked survey establish?
        choices:
          - Twelve seats cannot see that mark, for this blocking
          - Twelve seats have a poor view of the stage
          - The front six rows should not be sold
          - The proscenium must be widened before opening
        answer: Twelve seats cannot see that mark, for this blocking
        why: >
          The survey establishes a specific thing: for this blocking, twelve seats have no line to the
          performer's mark. That is a pair of lines with no intersection on stage rather than a bad
          view, and the qualification matters — move the mark and the twelve seats change. Calling them
          poor-view seats invites selling them at a discount for a problem that is total rather than
          partial. Condemning the whole front six rows is a much larger claim than twelve seats and
          would cost about ninety. Widening the proscenium is undoing 1958 in six days, which is not a
          finding of the survey.
        rebuttals:
          - A poor view is partial. These seats have no line to the mark at all.
          - The rows contain about ninety seats; the survey condemns twelve of them.
          - Reversing the 1958 alteration is a building project, not a conclusion from a seat survey.

  # ----- day 9. The load plot.
  - title: Three and a half tonnes, written down
    objective: Produce a load plot the grid can be signed against.
    briefing: Osei will not fly the sequence without it and Pell will not sign without it.
    stake: >-
      Tuesday, and the seats arrive at eight, the flying rehearsal is at two and Pell wants the load plot before either. Osei has four pieces to fly on a grid nobody has tested since 1958, and Sallow's sequence puts three of them in the air at once. Every line leans, because the grid is narrower than the stage. Today you work the per-line tensions, total the grid load and say what the margin is. A grid signed off on an assurance is the one number in this building nobody gets a second chance at.
    takeaway: A leaning line pulls harder than the load it carries, and the angle sets by how much.
    stops:
      - group: FLY
        task: Work the worst line in the sequence
        title: The one that leans furthest
        place: Fly Floor
        relationship: >-
          The tension in two symmetric lines, T = W ÷ (2·cos θ), with θ the angle each line makes with the vertical.
        concept: 'Adding vectors, and why two lines do not share a load equally'
        takesAsRead:
          - 'Vectors: components, magnitude and direction'
        scene: >
          The widest piece is a 260 kilogram truss cloth. The grid is narrow enough here that each
          of its two lines leans 41 degrees off the vertical. The lines are rated at 180 kilograms
          each.
        guide: >-
          Work out what each line actually pulls at this angle, then compare it with the rating.
          Forty-one degrees is a long way from vertical and the cosine is what carries the load, so
          the penalty is not a few per cent. Say whether the piece can fly as drawn.
        background:
          - >-
              Why the penalty accelerates. The cosine falls slowly at first and then quickly: ten
              degrees costs two per cent, twenty-two costs eight, forty-one costs thirty-three, and
              sixty doubles the tension. A drawing that leans lines a little is fine and one that leans
              them a lot is a different order of problem.
          - >-
              What can be done about it. A bridle — a short line pulling the two mains closer to
              vertical — or a narrower piece, or the piece flown from a different pair of lines further
              out. All three are available today, and all three need this number first.
        assumes:
          - the two lines are symmetric and the piece hangs level
        takeaway: The cosine of the lean is what carries the weight, and it falls away fast past thirty degrees.
        format: BALLPARK
        question: Estimate the tension in each line at 41 degrees.
        estimate:
          prompt: 260 kg on two lines, each leaning 41 degrees off the vertical, rated 180 kg each.
          question: Estimate the tension in each line at 41 degrees.
          labels:
            - 260 kg  (weight of the truss cloth)
            - 2  (the number of lines)
            - 41 deg  (each line's lean off the vertical)
            - 130 kg  (half the weight)
          values: [260, 2, 41, 130]
          slots: 3
          template: '{0} ÷ ({1} × cos {2})'
          formula: a/(b*Math.cos(c*Math.PI/180))
          correct: [0, 1, 2]
          target: 172
          tolerance: 8
          units: kg
          solution: T = 260 ÷ (2 × cos 41°) = 260 ÷ 1.509 = 172 kg per line.
          explanation: A hundred and seventy-two against a 180 kilogram rating — inside it, with four per cent to spare and no allowance for a snatch.
        answerText: About 172 kilograms a line, against a 180 rating — four per cent of margin.
        why: >
          Two lines at 41 degrees have a combined vertical capability of twice the cosine, which is
          1.509, so each pulls 172 kilograms rather than the 130 that halving suggests. Against a 180
          kilogram rating that is inside the limit and only just: four per cent, with nothing left for
          the snatch load when a piece is started or stopped quickly. That is the argument for a
          bridle rather than for a refusal, and it is only visible because the angle was carried
          through. At 60 degrees the same cloth would put 260 kilograms in each line, which is well
          past the rating, so the shape of the cosine is as important as this one number.
        rebuttals:
          - Halving the weight assumes vertical lines and understates the tension by a third at this angle.
          - Using the sine gives the sideways pull into the ironwork, which is a different check.
      - group: SHOP
        task: Decide what to build to bring the lines in
        title: A bridle, or a narrower piece
        place: Scene Shop
        concept: 'Solving a linear system, and what no solution looks like'
        takesAsRead:
          - 'Matrices as transformations of the plane'
        scene: >
          Three options are on Novak's bench: a bridle that brings each line to 28 degrees, a piece
          cut 900 millimetres narrower, or flying the cloth from the next pair of lines out. Shop
          time is four hours.
        guide: >-
          Each option changes a different quantity in the same relationship. Work out which one
          changes the angle, which changes the weight and which changes neither, then rank them by
          what four hours of shop time can actually deliver before two o'clock.
        background:
          - >-
              What a bridle does. It pulls the two main lines toward the vertical by adding a short
              line between them, so the cosine rises and every tension falls. It costs two shackles and
              an hour, and it adds a point load where the bridle meets the mains.
          - >-
              What cutting the piece does. Nine hundred millimetres off the width takes about 30
              kilograms off the weight and brings the lines in a little, so it helps twice — and it is
              four hours of shop time and a repaint.
        assumes:
          - the next pair of lines out is free in the sequence
        takeaway: One relationship, three quantities, and each option moves a different one.
        format: PROTOCOL
        task: Match each option to what it changes in the relationship.
        columns:
          - The option
          - What it changes
        scenarios:
          - A bridle bringing each line to 28 degrees
          - Cutting 900 mm off the width of the cloth
          - Flying it from the next pair of lines further out
          - Adding a second counterweight to the set
        choices:
          - The angle only, and it is the fastest of the three
          - Both the weight and the angle, at four hours of shop time
          - The angle, if those lines are free when the cue happens
          - Nothing about the tension in the lines at all
        mapping: [0, 1, 2, 3]
        rebuttals:
          - A bridle pulls the mains toward the vertical, which raises the cosine and lowers every tension.
          - A narrower cloth weighs less and hangs on lines that lean less, so it helps twice.
          - Lines further out lean less over the same piece, provided the sequence leaves them free.
          - Counterweights balance the set so a person can move it. They do not change what the lines carry.
        answerText: >-
          The bridle changes the angle fastest, the narrower cloth changes both, the outer lines
          change the angle if they are free, and the counterweight changes nothing about tension.
        why: >
          Three of the four move a term in the same relationship and one does not. A bridle raises
          the cosine, which lowers every tension and takes an hour. A narrower cloth reduces the
          weight and the lean together, and costs four hours the shop does not really have. Lines
          further out reduce the lean for nothing, if the sequence leaves them free — which is a
          question for Haigh rather than for Novak. The counterweight is the one that feels relevant
          and is not: it balances the set so one person can move it, and the tension in the lines
          above the piece is unchanged by what is hanging on the other end of them.
      - group: HOUSE
        task: Total the grid load with a margin on it
        title: What the grid carries at once
        place: The House
        concept: 'Vectors: components, magnitude and direction'
        takesAsRead:
          - 'Right-triangle ratios, and finding an angle from two sides'
        scene: >
          The sequence has three pieces in the air together: 260, 190 and 410 kilograms, with a
          bridled truss adding 60 more. Pell wants a total with a stated margin against the grid's
          assessed 1,600 kilograms.
        guide: >-
          Add what is actually hanging, then decide what a margin means. The tensions in the lines
          are larger than the weights, and the grid feels the tensions, so a total built from weights
          alone understates what the ironwork carries. Read the panel and report the figure the file
          should say.
        background:
          - >-
              Why the total is not the sum of the weights. Every leaning line pulls harder than the
              weight it carries, and the grid feels each line's pull rather than each piece's mass. On
              this sequence that difference is about 130 kilograms.
          - >-
              What the margin is for. A snatch — a piece started or stopped fast — puts a transient
              well above the static load, and a grid untested since 1958 has an assessed rather than a
              measured capacity. Pell's file wants both numbers and the gap between them.
        assumes:
          - the assessed grid capacity of 1,600 kilograms is a static figure
        takeaway: A grid carries line tensions rather than piece weights, and they are not the same total.
        format: BALANCE
        question: Read what you need and report the load the grid actually carries.
        balance:
          hint: >-
            Reading a weight ticket is free. Counting a stream is the claim you are making about what
            the ironwork is holding.
          total: { amount: 1050, unit: kg, label: Total load on the grid during the sequence }
          streams:
            - { id: pieces, label: The three pieces in the air, value: 860, display: '260 + 190 + 410 kg on the weight tickets' }
            - { id: bridle, label: Bridled truss and its hardware, value: 60, display: '60 kg' }
            - { id: lean, label: Extra pull because every line leans, value: 130, display: '130 kg — the tensions exceed the weights', hidden: true, note: 'on no weight ticket, because it is not a mass' }
            - { id: counter, label: Counterweights on the other end of the sets, value: 0, display: 'carried by the counterweight frame, not by the grid' }
          tolerance: 50
          commit: Report the grid load
        answerText: >-
          About 1,050 kilograms — the 920 on the weight tickets plus the 130 the leaning lines add,
          against an assessed 1,600.
        why: >
          The pieces and the bridle come to 920 kilograms on the tickets, and the term that does not
          announce itself is the lean: every line pulls harder than the weight it carries, and the
          grid feels the tensions rather than the masses. That is another 130 kilograms, on no ticket
          anywhere because it is not a mass. Total about 1,050 against an assessed 1,600, which is a
          real margin and one that Pell can be shown. The counterweights are the tempting fifth term
          and belong to the counterweight frame rather than the grid. Reporting 920 would be an
          honest reading of every document in the building and thirteen per cent light.

  # ----- day 10. The seat map, and the price of a held seat.
  - title: The seat map goes to print at four
    objective: Decide what happens to twelve seats, and price a house that is not full.
    briefing: Sallow is right that a held seat sells to nobody, and Kettleby is right that a blind seat is a refund.
    stake: >-
      Wednesday, and the seat map goes to the printer at four. Sallow's position today is the one she is right about: twelve seats withdrawn in the last fortnight of a rising sales curve are twelve seats that sell to nobody, and the run is costed on nine hundred. Kettleby is equally right that a seat with no line to the mark is a refund and a complaint. Today you price both, and find the number the argument has been missing. Two people are right and only one of the two numbers has been calculated.
    takeaway: A quantity rising without bound as its input approaches a value has an asymptote there.
    stops:
      - group: FRONT
        task: Work out what the last seats are worth
        title: What the curve says the twelve are worth
        place: Box Office
        relationship: >-
          A rational model, y = k ÷ (x − a), with a the input the model blows up at.
        concept: 'Rational functions: vertical asymptotes where the denominator vanishes'
        takesAsRead:
          - 'Zeros, multiplicity and what a graph does at one'
        scene: >
          Dowd's returns data gives a resale price that rises as the house fills: with 60 seats
          left it is £41, with 30 it is £82, with 12 it is £205. The model is a constant over the
          seats remaining.
        guide: >-
          A price that doubles as the seats remaining halve is a constant divided by the seats
          remaining. Find the constant from one of the three points and use it on the twelve. Then say
          what the model does as the last seat goes, because that behaviour is the whole reason this
          shape was chosen.
        background:
          - >-
              What the asymptote means here. As the seats remaining approach zero the modelled price
              rises without bound, which is a vertical asymptote at zero. No real seat sells for an
              unbounded price, so the model is describing scarcity rather than predicting a transaction.
          - >-
              Why the fit is convincing anyway. Sixty seats at £41, thirty at £82 and twelve at £205
              all give a constant of about 2,460. Three points agreeing on the constant is what
              identifies the family, and it is a stronger test than any of them individually.
        assumes:
          - the resale price data comes from comparable performances
        takeaway: A constant over a shrinking quantity rises without bound, which is a vertical asymptote.
        format: BALLPARK
        question: Estimate the modelled value of the last twelve seats.
        estimate:
          prompt: Resale price is a constant over seats remaining, fitted at £2,460. Sallow wants what the last twelve are worth.
          question: Estimate the modelled value of the last twelve seats.
          labels:
            - 2460  (the fitted constant)
            - 12  (seats remaining)
            - 205  (the modelled price at twelve seats)
            - 900  (the capacity of the house)
          values: [2460, 12, 205, 900]
          slots: 2
          template: '{0} ÷ {1} × {1}'
          formula: a/b*b
          correct: [0, 1]
          target: 2460
          tolerance: 200
          units: '£'
          solution: 12 seats at £205 each is £2,460 — which is the fitted constant, because price times seats is constant.
          explanation: About £2,460, and the reason it equals the constant is that this model makes price times seats remaining a fixed number.
        answerText: About £2,460 — which is the constant itself, because price times seats is fixed in this model.
        why: >
          Twelve seats at the modelled £205 is £2,460. That equals the fitted constant, and the
          reason is the shape of the model: price times seats remaining is fixed. So the last twelve
          are worth what the last thirty were, and what the last sixty were. It is a real result about
          scarcity, and it is also where the model stops. As the seats remaining approach zero the
          price rises without bound, and no seat sells for an unbounded amount. The £2,460 is the
          number for the argument. The asymptote is the caveat that goes with it.
        rebuttals:
          - Dividing the constant by the capacity prices a full house, which is a different question.
          - The constant on its own is a fitted parameter rather than a value in pounds until it is used.
      - group: HOUSE
        task: Decide what happens to the twelve
        title: Withdraw, discount or reblock
        place: The House
        concept: 'Reading a model: what it is a model of, and where it stops being one'
        takesAsRead:
          - 'Choosing a model, and what a residual says about the choice'
        scene: >
          Twelve seats have no line to the mark. Withdrawing them costs about £2,460 across the run.
          Reblocking the number moves the mark 1.2 metres downstage, which Mbatha says the band can
          live with.
        guide: >-
          Both people in the argument are right about their own number, so the answer is not a
          compromise between them — it is the third option nobody has costed. Read what each course
          actually does to the twelve seats and to the show, and pick the one that removes the
          problem rather than paying for it.
        background:
          - >-
              Why discounting is the worst of the three. A seat sold cheap to somebody who then cannot
              see the performer produces a refund and a complaint, so the revenue is notional and the
              cost is real. Selling a known blind seat is the one option that gets worse after the
              transaction.
          - >-
              What reblocking costs. Moving the mark 1.2 metres downstage puts the performer nearer the
              band, which Mbatha has already accepted, and it changes two lighting angles that Adeyemi
              can replot in an hour. It costs an hour and no seats.
        assumes:
          - the mark can move without changing the staging elsewhere
        takeaway: When two people are each right about their own number, the answer is usually a third option.
        format: CHOICE
        question: What should happen before the map goes to print?
        choices:
          - Move the mark 1.2 metres downstage and keep all twelve on sale
          - Withdraw the twelve seats and take the loss
          - Sell them at a discount with a note on the ticket
          - Print the map as it stands and deal with complaints
        answer: Move the mark 1.2 metres downstage and keep all twelve on sale
        why: >
          Sallow is right that twelve seats withdrawn late in a rising curve are twelve seats sold to
          nobody, and Kettleby is right that a seat with no line is a refund. Both numbers are correct,
          which is why the answer is the option neither of them has costed: moving the mark 1.2 metres
          downstage clears the lines, costs an hour of replotting and no seats, and the musical
          director has already agreed to it. Withdrawing pays £2,460 to solve a geometry problem.
          Discounting sells a known defect and turns revenue into refunds and complaints. Printing as
          it stands is the same thing without the discount.
        rebuttals:
          - Withdrawal is the honest version of paying £2,460 for something an hour of replotting fixes.
          - A discounted blind seat produces a refund and a complaint, so the revenue is notional.
          - Printing unchanged is discounting without the discount, and the complaints arrive anyway.
      - group: BOARD
        task: Replot the two angles the move changes
        title: Two angles, an hour
        place: Lighting Board
        concept: 'Right-triangle ratios, and finding an angle from two sides'
        takesAsRead:
          - 'The unit circle, and sine and cosine as coordinates'
        scene: >
          The mark moves 1.2 metres downstage. The front bar is 6.2 metres up and was 9.4 metres
          out; the side boom is 4.1 metres up and 3.3 metres across. Both need new angles.
        guide: >-
          Recompute each angle from its own two sides after the move. The front bar's horizontal
          distance shortens by 1.2 metres and the boom's does not change at all, which is the part
          worth noticing before doing any arithmetic — a move downstage is along one unit's axis and
          across the other's.
        background:
          - >-
              Why the boom barely moves. The side boom is out to the side, so a mark moving downstage
              changes its distance by very little — the two displacements are nearly perpendicular. The
              front bar is straight out front, so the same 1.2 metres comes almost entirely off its
              throw.
          - >-
              What the new front angle is. Six point two over 8.2 gives a tangent of 0.756 and an angle
              of 37 degrees, up from 33. That is closer to what Adeyemi wanted in the first place, which
              is the sort of accident worth noticing and not relying on.
        assumes:
          - the mark moves along the centre line
        takeaway: A displacement along one unit's axis is across another's, and each angle is recomputed from its own sides.
        format: BALLPARK
        question: Estimate the new down angle from the front bar.
        estimate:
          relationship: tan θ = opposite ÷ adjacent, so the angle is the arctangent of the height over the new horizontal distance.
          prompt: The front bar is 6.2 m up. Its horizontal distance to the mark was 9.4 m and the mark has moved 1.2 m downstage.
          question: Estimate the new down angle from the front bar.
          labels:
            - 6.2 m  (bar height above the mark)
            - 8.2 m  (new horizontal distance)
            - 9.4 m  (the old horizontal distance)
            - 1.2 m  (how far the mark moved)
          values: [6.2, 8.2, 9.4, 1.2]
          slots: 2
          template: 'arctan({0} ÷ {1})'
          formula: Math.atan(a/b)*180/Math.PI
          correct: [0, 1]
          target: 37.1
          tolerance: 2.5
          units: deg
          solution: θ = arctan(6.2 ÷ 8.2) = arctan(0.756) = 37.1°.
          explanation: Thirty-seven degrees, up from thirty-three, and nearer what the designer wanted than the original position was.
        answerText: About 37 degrees, up from 33 — nearer what the designer wanted than before.
        why: >
          The bar height is unchanged and the horizontal distance is now 8.2 metres, so the tangent is
          0.756 and the angle is 37.1 degrees. Using the old 9.4 gives the angle the plot already had,
          which is the error that leaves a unit aimed at where somebody used to stand. The interesting
          part is the asymmetry: the same 1.2 metre move takes 1.2 metres off the front bar's throw and
          almost nothing off the side boom's, because the displacement is along one unit's axis and
          across the other's. So one angle changes by four degrees and the other by less than one.
        rebuttals:
          - The old horizontal distance gives the angle already on the plot, aimed where nobody now stands.
          - The 1.2 metres is the change in the distance rather than a side of the triangle.

  # ----- day 11. Colour, as three channels multiplied.
  - title: Three channels and a matrix
    objective: Mix a colour that survives the filter, and say what a transformation does.
    briefing: The wash reads green on camera and nobody can say which channel is lying.
    stake: >-
      Thursday, and the recording company is in on the fourteenth, so the wash has to read on camera as well as in the room. Adeyemi has three channels and a filter; Ferreira has dimmers that do not do what their numbers say. Sallow wants the look signed off before the dress. Today you work out what a mix actually delivers and what a transformation does to a plot. Three channels each doing what they are told and a look that is wrong is a multiplication somebody has treated as an addition.
    takeaway: A transformation applied to every point is a matrix, and it does not commute.
    stops:
      - group: BOARD
        task: Say what the three channels deliver
        title: Not the numbers on the desk
        place: Lighting Board
        concept: 'Matrices as transformations of the plane'
        takesAsRead:
          - 'Vectors: components, magnitude and direction'
        scene: >
          The desk shows red at 80, green at 80 and blue at 40. The filter passes 90 per cent of
          red, 70 of green and 35 of blue. The dimmer curve delivers the square of the fader
          setting.
        guide: >-
          Three things happen to each channel in order: the fader, the dimmer curve and the filter.
          Each one multiplies, so the order does not change the product — but the sizes do. Work out
          which channel loses most, and say why the room and the camera disagree.
        background:
          - >-
              Why a dimmer curve exists. A fader at half does not deliver half the light; older dimmers
              approximate a square law, so 80 per cent delivers about 64 and 40 per cent delivers 16.
              That is why the blue is so much weaker than the desk suggests.
          - >-
              Why the camera sees it differently from the eye. The eye adapts to the overall colour of a
              scene and largely discounts it; a camera does not unless it is told to. So a wash that
              looks neutral in the room reads green on a recording, which is the complaint.
        assumes:
          - the dimmer curve is the same on all three channels
        takeaway: A chain of multiplications is a transformation, and every stage scales what arrives.
        format: PROTOCOL
        task: Match each channel to what actually arrives.
        columns:
          - The channel
          - What arrives at the performer
        scenarios:
          - Red at 80 on the desk, filter passes 90 per cent
          - Green at 80 on the desk, filter passes 70 per cent
          - Blue at 40 on the desk, filter passes 35 per cent
          - The three faders read 80, 80 and 40
        choices:
          - About 58 per cent of full
          - About 45 per cent of full
          - About 6 per cent of full
          - A set of positions rather than a set of outputs
        mapping: [0, 1, 2, 3]
        rebuttals:
          - Eighty on the fader delivers about 64 through the curve, and 90 per cent of that is 58.
          - The same 64 through a 70 per cent filter is 45, which is why green sits below red.
          - Forty on the fader delivers about 16, and 35 per cent of that is 6 — the blue is almost gone.
          - Fader positions are inputs. What arrives is the product of three multiplications.
        answerText: >-
          Red arrives at about 58 per cent, green at 45 and blue at 6 — and the fader positions are
          inputs rather than outputs.
        why: >
          Each channel passes through the fader, the dimmer curve and the filter, and every stage
          multiplies. Eighty on the desk is about 64 through a square-law dimmer, and 90 per cent of
          that leaves red at 58. The same 64 through a 70 per cent filter leaves green at 45. Forty on
          the desk is only 16 through the curve, and 35 per cent of that leaves blue at 6 — so the
          wash has almost no blue in it at all, which is the green cast on camera. The desk reading of
          80, 80, 40 looks balanced and is a set of inputs; what the performer is lit by is the
          product of three multiplications.
      - group: PIT
        task: Say what happens when two things are done in the other order
        title: Order matters, or it does not
        place: Orchestra Pit and Sound
        concept: 'Matrices as transformations of the plane'
        takesAsRead:
          - 'Vectors: components, magnitude and direction'
        scene: >
          Brand has a compressor and an equaliser in the same channel. Mbatha wants the equaliser
          first; the patch has the compressor first. Both insist their order is the correct one.
        guide: >-
          Ask of each pair of operations whether swapping them changes the result. Two gains in series
          commute, because multiplication does. A compressor responds to the level arriving at it, so
          what comes before it changes what it does. Work out which of the four pairs commute and
          which do not.
        background:
          - >-
              Why gains commute and processing does not. Multiplying by three then by four is the same
              as four then three. A compressor is not a multiplication: it applies a different gain
              depending on the level it sees, so changing what arrives changes the gain it chooses.
          - >-
              Why this is the same idea as matrices. A transformation of the plane is applied to every
              point, and two transformations applied in different orders generally give different
              results. Rotating then stretching is not stretching then rotating, and the reason is the
              same as the compressor's.
        assumes:
          - both devices are in the same channel path
        takeaway: Multiplications commute and level-dependent operations do not.
        format: CHOICE
        question: Which pair genuinely gives a different result in the other order?
        choices:
          - The equaliser and the compressor
          - Two fixed gain stages
          - A gain stage and a fixed pad
          - The channel fader and the group fader
        answer: The equaliser and the compressor
        why: >
          A compressor chooses its gain from the level arriving at it, so boosting a frequency before
          it makes it compress on that frequency, and boosting after leaves the compression alone and
          then lifts the result. Those are audibly different, and both engineers are describing a real
          preference rather than a mistake. Everything else on the list is a multiplication: two gain
          stages, a gain and a pad, a channel fader and a group fader all commute, because the product
          of numbers does not depend on their order. That is the distinction worth carrying, and it is
          exactly why matrices are introduced with the warning that they do not commute.
        rebuttals:
          - Two fixed gains multiply, and multiplication does not care about order.
          - A pad is a fixed multiplication like any gain, so the order changes nothing.
          - Two faders in series are two multiplications; the product is the same either way.
      - group: SHOP
        task: Say what the piece traces as it flies
        title: Two functions of one parameter
        place: Scene Shop
        concept: 'Parametric functions: position as two functions of one parameter'
        takesAsRead:
          - 'Converting between polar and rectangular'
        scene: >
          The bridled truss rises 4.2 metres while the revolve turns it 1.15 radians. Novak needs to
          know whether it clears the false proscenium during the move, not just at the ends.
        guide: >-
          The piece has a height that depends on time and a bearing that depends on time, so its
          position is two functions of one parameter. Say what that means for the question being
          asked, because a clearance at the start and a clearance at the end do not establish a
          clearance in the middle.
        background:
          - >-
              Why the ends are not enough. Both coordinates change through the move, so the path
              between the two endpoints is a curve rather than a straight line. A piece can clear at
              both ends and foul in the middle, which is exactly the case a rehearsal finds and a
              drawing does not.
          - >-
              What the parameter is. Time, here — but it could be a fraction of the move, and often
              is, because the flying operator and the revolve are on different clocks. The useful
              parameterisation is the one both operators can read.
        assumes:
          - the two movements start and finish together
        takeaway: Two coordinates changing together trace a curve, and the ends say nothing about the middle.
        format: CHOICE
        question: What does the piece's path require to be checked?
        choices:
          - The position at several points through the move
          - The start and end positions only
          - The highest point the truss reaches
          - The total angle the revolve turns through
        answer: The position at several points through the move
        why: >
          Height and bearing both change through the move, so the piece traces a curve and the
          clearance has to be evaluated along it. Checking the ends is the standard mistake and it
          passes a move that fouls in the middle — which is the failure a rehearsal finds with
          forty-one people watching. The highest point matters if the obstruction is above, and the
          false proscenium is beside the path rather than over it, so height alone does not settle it.
          The total angle is a fact about the revolve and says nothing about where the truss is at any
          moment during the turn.
        rebuttals:
          - Two coordinates moving together trace a curve; the endpoints do not describe it.
          - The highest point answers a clearance above, and the false proscenium is beside the path.
          - A total angle says where the revolve finishes rather than where the piece is on the way.

  # ----- day 12. The dress: where two lines have to meet.
  - title: Two equations, one stage
    objective: Settle the flying cue against the revolve, and the exit timings against the licence.
    briefing: The dress is at seven and two things have to happen at the same instant.
    stake: >-
      Friday, and the dress rehearsal is at seven with Pell in the room. The flying cue and the revolve have to arrive together, which is two rates and one moment. The exit timings have to be walked rather than estimated, because a licence signed on an estimate is signed on nothing. Haigh has both on her sheet and neither has a number yet. Today you solve for when two moving things meet, and time an exit by walking it. Two rates and a distance is a system with one answer, or none.
    takeaway: Two things moving at different rates meet at one moment, or never.
    stops:
      - group: FLY
        task: Find the moment the two arrive together
        title: When the two rates meet
        place: Fly Floor
        concept: 'Solving a linear system, and what no solution looks like'
        takesAsRead:
          - 'Matrices as transformations of the plane'
        scene: >
          The truss flies out at 0.42 metres a second from 2.4 metres, and the revolve brings the
          rostrum's edge toward the same point at 0.31 metres a second from 6.8 metres away. Haigh
          needs the moment they are level.
        guide: >-
          Write each position as a function of time and set them equal. That is a pair of linear
          equations, and where they agree is a single instant — unless the rates are such that they
          never do. Work out the time, then check whether it falls inside the length of the cue.
        background:
          - >-
              What no solution looks like here. If both moved at the same rate in the same direction
              the gap would never close: the two lines would be parallel and there would be no moment
              at all. That is the geometric meaning of an inconsistent system, and it is a real
              possibility in a flying cue rather than a textbook curiosity.
          - >-
              Why the answer has to be inside the cue. A solution at eleven seconds is useless if the
              cue is eight seconds long — mathematically fine and operationally a collision, because
              something else happens at eight. The domain is part of the answer.
        assumes:
          - both movements run at constant speed through the cue
        takeaway: Setting two linear positions equal gives one instant, or none if the lines are parallel.
        format: BALLPARK
        question: Estimate the time the truss and the rostrum edge are level.
        estimate:
          relationship: Set the two positions equal: the gap divided by the sum of the two rates is the moment they are level.
          prompt: Truss from 2.4 m rising at 0.42 m/s; rostrum edge from 6.8 m closing at 0.31 m/s. Haigh needs the moment.
          question: Estimate the time the truss and the rostrum edge are level.
          labels:
            - 6.8 m  (the rostrum edge's starting distance)
            - 2.4 m  (the truss's starting height)
            - 0.42 m/s  (the truss's rate)
            - 0.31 m/s  (the rostrum edge's rate)
            - 8 s  (the length of the whole cue)
          values: [6.8, 2.4, 0.42, 0.31, 8]
          slots: 4
          template: '({0} − {1}) ÷ ({2} + {3})'
          formula: (a-b)/(c+d)
          correct: [0, 1, 2, 3]
          target: 6.0
          tolerance: 0.6
          units: s
          solution: The gap is 4.4 m closing at 0.73 m/s, so t = 4.4 ÷ 0.73 = 6.0 s.
          explanation: Six seconds, which is inside an eight-second cue — with two seconds of margin rather than none.
        answerText: About six seconds, which falls inside the eight-second cue with two to spare.
        why: >
          The gap is 4.4 metres and the two are closing it at 0.42 plus 0.31, which is 0.73 metres a
          second, so they are level at six seconds. Adding the rates is the step to get right: they
          approach each other, so the closing speed is the sum, and subtracting them gives 40 seconds
          and a cue that appears to have enormous margin. Six seconds inside an eight-second cue leaves
          two seconds, which is a margin rather than a coincidence, and it is the number Haigh calls
          the cue against. Had the rates been equal and in the same direction there would have been no
          solution at all, which in a flying cue means a collision rather than a curiosity.
        rebuttals:
          - Subtracting the rates describes two things moving the same way, and gives 40 seconds for a cue that is eight long.
          - Dividing the starting distance by the sum ignores where the truss starts from.
      - group: HOUSE
        task: Time the exit by walking it
        title: Walked, not estimated
        place: The House
        concept: 'Average rate of change over an interval'
        takesAsRead:
          - 'A function as a rule, its domain and what the domain rules out'
        scene: >
          Pell needs the house cleared in under 150 seconds. The estimate on file, made by dividing
          the seat count by a per-second flow figure, says 138. Nobody has walked it.
        guide: >-
          Predict the time from the flow figure, then walk the exit with the company and measure it.
          Lock the prediction first: the value of the measurement is the comparison, and a walked
          figure that agrees with an estimate is a different piece of evidence from an estimate alone.
        background:
          - >-
              Why an estimate from a flow rate is optimistic. It assumes a steady flow through every
              exit from the first second, and real houses have a delay while people stand and gather,
              and a bottleneck at the narrowest point. Both push the real figure above the estimate.
          - >-
              What the licence actually wants. A measured time from a walked rehearsal, because the
              file has to show the room rather than the arithmetic. Pell has read enough files to know
              the difference and says so.
        assumes:
          - the walked exit uses the exits the licence relies on
        takeaway: A prediction and a measurement are two pieces of evidence, and the second is the one the file needs.
        format: VERIFY
        question: Predict the clearance time from the flow figure, then walk it and report.
        verify:
          hint: >-
            Lock the prediction before the company walks. The seat count and the flow figure are both
            already on the file.
          prediction: { label: Predicted clearance time, unit: s, min: 60, max: 300, step: 1 }
          truth: 138
          passRatio: [0.85, 1.15]
          intervention:
            label: Walk the exit with the full company
            note: Forty-one people plus the crew, from the seats they will actually be in.
            outcome: Walked once, timed from the cue to the last person through the doors.
          measurement:
            label: Measured clearance time
            note: 161 seconds — over the licence figure, with the bottleneck at the stage-left pass door.
            cost: 1
            costUnit: walks
          unmeasuredMoral: >-
            A clearance time computed from a flow rate is a statement about the flow rate. The licence
            is about the room, and only walking it says anything about the room.
          commit: Report the clearance time
        answerText: >-
          The estimate is 138 seconds and the walk gives 161 — over the 150 the licence allows, with
          the bottleneck at the stage-left pass door.
        why: >
          The flow figure predicts 138 seconds and the walk measures 161, which is over the licence
          limit. The gap is the whole reason the walk is required: a flow calculation assumes steady
          movement through every exit from the first second, and a real house spends time standing up
          and then queues at its narrowest point. Both effects push the measurement above the
          estimate, and neither is visible in the arithmetic. What the walk also gives, which no
          estimate can, is where the queue formed — the stage-left pass door — which turns a failed
          number into a specific thing to fix before the fourteenth.
      - group: FRONT
        task: Say what the sales curve has done
        title: Where the curve turned
        place: Box Office
        concept: 'Increasing, decreasing, and where a rate of change turns'
        takesAsRead:
          - 'Average rate of change over an interval'
        scene: >
          Weekly sales now read 41, 66, 188, 402, 511, 566. Sallow reads it as still accelerating.
          Dowd says it turned last week.
        guide: >-
          Work with the differences rather than the totals. Sales are still rising, so the totals say
          nothing about the argument. What settles it is whether the rise itself is getting bigger or
          smaller, which is the difference of the differences.
        background:
          - >-
              What the two claims actually are. Sallow is claiming the second difference is still
              positive — the increase is increasing. Dowd is claiming it has gone negative. Both agree
              sales are rising, which is why the totals cannot arbitrate.
          - >-
              Why it matters commercially. If the rise is slowing, the last hundred seats will not sell
              themselves and the marketing spend has a job to do. If it is still accelerating, the spend
              is wasted on seats that were going anyway.
        assumes:
          - all six figures are complete weeks
        takeaway: Whether a rise is speeding up is the difference of the differences, not the total.
        format: CHOICE
        question: What do the six figures say about the argument?
        choices:
          - The rise peaked at week four and has slowed since
          - Sales are still accelerating, as the producer says
          - Sales have started to fall
          - Six points are too few to say either way
        answer: The rise peaked at week four and has slowed since
        why: >
          The weekly rises are 25, 122, 214, 109 and 55. They grew to week four and have fallen away
          since, so sales are still increasing while the increase is shrinking — which is precisely
          Dowd's claim and precisely why the totals cannot settle it. Sales are not falling: every week
          is larger than the one before, and reading a slowing rise as a decline is the mirror error.
          Six points are ample to see a turn in the differences; what six points cannot support is a
          forecast past them. Commercially the answer decides whether the last hundred seats need
          spending on, and they do.
        rebuttals:
          - The producer's claim needs the rises to keep growing, and they have halved twice.
          - Every week is larger than the last, so nothing here is falling.
          - Six points show the turn clearly in the differences; it is extrapolation they cannot support.

  # ----- day 13. The board, plotted from the centre out.
  - title: The rig, in the coordinates it was drawn in
    objective: Finish the plot, and find the one unit that is in the wrong place.
    briefing: Twenty-eight units are hung and one of them is 900 millimetres out.
    stake: >-
      Saturday, and the rig is hung except for the focus. Ferreira has twenty-eight units on four bars and a plot in bearings, and one unit is not where the plot puts it — the focus session found a shadow on the mark that nothing accounts for. Adeyemi wants it found before the notes session at six. Today you use the plot's own coordinates to find which unit moved. A rig plotted in one coordinate system and hung in another has exactly one kind of error in it, and it is always the same kind.
    takeaway: Converting between two descriptions of a point is where a rig's errors live.
    stops:
      - group: BOARD
        task: Find the unit that is out of position
        title: Nine hundred millimetres
        place: Lighting Board
        concept: 'Converting between polar and rectangular'
        takesAsRead:
          - 'Polar coordinates, and a beam described as r of theta'
        scene: >
          Four units on bar two are plotted at 6.9 metres and bearings of 12, 24, 36 and 48
          degrees. Ferreira's hanging sheet lists offsets of 1.43, 2.81, 4.06 and 4.63 metres
          from centre.
        guide: >-
          Convert each plotted bearing into an across-stage offset and compare it with the sheet.
          Three will agree within the tolerance a tape measure gives; one will not. Work out which,
          and by how much, before anybody climbs a ladder.
        background:
          - >-
              Why the fourth is the suspect. Six point nine metres at 48 degrees gives an offset of
              5.13 metres, and the sheet says 4.63 — half a metre out, which on a focused unit is a
              shadow on the mark rather than a slightly different look.
          - >-
              Why this error is always the same kind. Somebody converted with the wrong function, or
              read the bearing as an offset directly. Both produce a number that is plausible, on the
              right bar, in the right units, and wrong — which is why it survives being written down.
        assumes:
          - all four units are on the same bar at the same distance
        takeaway: A plausible number in the right units is the error that survives being written down.
        format: BALANCE
        question: Read what you need and report where the unit should hang, measured from centre.
        balance:
          hint: >-
            Reading the plot or the sheet is free. Counting a term is the claim you are making about
            where the unit belongs.
          total: { amount: 5.27, unit: m, label: Correct offset from the room centre line }
          streams:
            - { id: plot, label: Plot converted properly, value: 5.13, display: '6.9 m × sin 48° = 5.13 m' }
            - { id: sheet, label: What the hanging sheet says, value: 0, display: '4.63 m — the same distance at 42°, so not a term at all' }
            - { id: bar, label: Bar centre offset from the room centre line, value: 0.14, display: '140 mm — the bar was hung to the 1911 drawing', hidden: true, note: 'on no paperwork — the paperwork is what is wrong' }
            - { id: yoke, label: Yoke offset within the clamp, value: 0, display: '±0 — the clamp centres on the bar' }
          tolerance: 0.08
          commit: Report the offset
        answerText: >-
          About 5.27 metres from the room's centre line: 5.13 from the plot, plus the 140 millimetres
          the bar itself is off because it was hung to the 1911 drawing.
        why: >
          Six point nine metres at 48 degrees is an offset of 5.13, and the sheet's 4.63 is the same
          distance at 42 degrees — the complement, which is what you get measuring the bearing from the
          proscenium line instead of the centre line. That is the error the focus session found. The
          term that does not announce itself is the bar: it was hung to the 1911 drawing, so it sits 140
          millimetres off the room's own centre line, and no paperwork records that because the
          paperwork is what is wrong. The yoke is the tempting fourth term and is zero, because the
          clamp centres on the bar.
      - group: FLY
        task: Say what the plot is missing
        title: Bearings without a reference
        place: Fly Floor
        concept: 'Polar coordinates, and a beam described as r of theta'
        takesAsRead:
          - 'The unit circle, and sine and cosine as coordinates'
        scene: >
          Adeyemi's plot lists distances and bearings. It does not say what the bearings are measured
          from, and there are three plausible references in this building.
        guide: >-
          A polar description needs three things and the plot has two. Say what is missing, and why a
          set of bearings with no stated reference is not merely inconvenient but ambiguous by a fixed
          amount that nobody can detect from the numbers.
        background:
          - >-
              What a polar coordinate system requires. An origin, a reference direction and a sense of
              rotation. Miss any one and the numbers describe a family of positions rather than a
              position.
          - >-
              The three plausible references here. The centre line, the proscenium line and the front
              edge of bar one, which differ by 90 degrees and by 400 millimetres. Every bearing in the
              plot is wrong by a fixed amount under two of the three, which is exactly what today's
              error looked like.
        assumes:
          - the plot's distances are all measured from one origin
        takeaway: A polar description needs an origin, a reference direction and a sense of rotation.
        format: CHOICE
        question: What does the plot have to state before it can be hung from?
        choices:
          - The direction the bearings are measured from
          - The height of each bar above the stage
          - Which dimmer each unit is patched to
          - The beam angle of each unit
        answer: The direction the bearings are measured from
        why: >
          A bearing is an angle from something, and the plot does not say what. With three plausible
          references in the building — centre line, proscenium line, front edge of bar one — every
          number in the plot describes three different positions, and nothing in the numbers reveals
          which was meant. That is what produced today's half-metre error. Bar heights, dimmer numbers
          and beam angles are all necessary to finish the rig and none of them resolves the ambiguity:
          a unit hung at the wrong bearing is in the wrong place however well the rest of its
          paperwork reads.
        rebuttals:
          - Bar heights are needed to focus and do not say what the bearings are measured from.
          - A patch number says which channel controls the unit, not where it hangs.
          - A beam angle describes the spread of the light rather than the direction to the position.
      - group: SHOP
        task: Set out the last piece from the room
        title: The centre line the room has
        place: Scene Shop
        concept: 'Reading a model: what it is a model of, and where it stops being one'
        takesAsRead:
          - 'Choosing a model, and what a residual says about the choice'
        scene: >
          Quirke is setting out the false proscenium. The 1911 drawing gives a centre line; the
          1958 alteration moved the frame; a tape from the two side walls gives a third line, 140
          millimetres from the drawing's.
        guide: >-
          Three candidate centre lines and one piece to build. Decide which line the piece has to be
          symmetric about, and say what makes that the right answer rather than the average of the
          three. The audience is the test rather than the drawing.
        background:
          - >-
              Why the wall measurement wins. The piece is seen against the frame and the walls, by
              people sitting in the room. Symmetry that reads to an audience is symmetry about what
              they can see, which is the room, not the drawing.
          - >-
              Why averaging is the wrong instinct. Three measurements of the same thing average
              usefully; three different things do not. These are a historical record, an altered
              structure and a current measurement, and the average of them is a line with no referent
              at all.
        assumes:
          - the two side walls are the ones visible to the audience
        takeaway: Averaging three measurements of one thing is sensible; averaging three different things is not.
        format: PROTOCOL
        task: Match each candidate centre line to what it is a record of.
        columns:
          - The line
          - What it is a record of
        scenarios:
          - Measured from the two side walls today
          - The 1911 drawing's centre line
          - The line the existing frame is symmetric about
          - The average of the three
        choices:
          - The room as an audience sees it, which is what the piece is looked at against
          - The building before the alteration that created the problem
          - The 1958 alteration itself, which is where the discrepancy came from
          - Nothing at all — three different quantities do not average
        mapping: [0, 1, 2, 3]
        rebuttals:
          - The wall measurement is the only one taken from the room people sit in.
          - The 1911 line records a building that has since been altered.
          - The frame is the thing that moved, so its symmetry is the discrepancy rather than a reference.
          - Averaging a drawing, an alteration and a measurement produces a line nothing is symmetric about.
        answerText: >-
          Build to the walls: the drawing records a building since altered, the frame records the
          alteration, and the average of three different things records nothing.
        why: >
          The piece is looked at by people in the room, so it has to be symmetric about what they can
          see — and that is the line the walls give today. The 1911 drawing is a record of the building
          before the change that caused all this. The frame's own symmetry is a record of the 1958
          alteration, which is the discrepancy rather than a reference for it. And the average is the
          instinct worth resisting: three measurements of one quantity average usefully, and these are
          three different quantities, so their average is a line nothing in the building is symmetric
          about.

  # ----- day 14. The last full day.
  - title: Everything at once, and one rehearsal left
    objective: Fit the last of the numbers and spend the last of the time.
    briefing: One rehearsal, four things to fix, and the licence file closes at noon tomorrow.
    stake: >-
      Sunday, and there is one rehearsal left. The pass door bottleneck is still 161 seconds, the flying cue is timed but not run with the revolve, the wash reads green on camera and the last hundred seats are not selling themselves. Sallow wants the notes closed and Pell wants the file. Today you decide where the last four hours go and finish the two numbers the file is short of. Four hours is a smaller quantity than the list, which is what makes it a decision rather than a plan.
    takeaway: A finite pool spent on a list longer than itself is a decision about what is not done.
    stops:
      - group: HOUSE
        task: Spend the last four hours
        title: Four hours, six jobs
        place: The House
        concept: 'Reading a model: what it is a model of, and where it stops being one'
        takesAsRead:
          - 'Choosing a model, and what a residual says about the choice'
        scene: >
          Four hours of company time before the dress. Six jobs on Haigh's sheet, two of them
          required by the licence and four of them wanted by somebody with an argument.
        guide: >-
          Everything on this list is worth doing and the four hours will not cover it. Two of the six
          are conditions of the licence, so the doors do not open without them. Spend the pool, and
          know what the plan cannot answer once it is spent.
        background:
          - >-
              What the licence actually requires. A walked exit under 150 seconds and a filed load plot.
              Neither is negotiable and both are measurable, which is what makes them different from the
              other four items on the sheet.
          - >-
              Why the flying cue has to be run rather than calculated. Six seconds is the computed
              answer and a rehearsal is the only thing that establishes the operators can hit it, twice,
              with a company on stage.
        assumes:
          - the four hours cannot be extended
        takeaway: A pool smaller than the list is a decision about what will not be done.
        format: ALLOCATE
        question: Four hours before the dress. Build the plan, and know what it stops you being able to say.
        allocate:
          hint: >-
            Nothing here is the wrong thing to rehearse. What the plan cannot cover is the price of what
            it can, and two of the six are licence conditions.
          pool:
            amount: 240
            unit: min
            mode: scalar
          items:
            - id: exits
              label: Re-walk the exits with the pass door propped
              cost: 40
              note: the licence needs a figure under 150 seconds
            - id: fly
              label: Run the flying cue against the revolve, twice
              cost: 60
              note: six seconds computed, nobody has hit it yet
            - id: wash
              label: Re-mix the wash for camera
              cost: 45
            - id: sightline
              label: Re-block the moved mark with the company
              cost: 50
            - id: band
              label: Balance the nine-piece against the room with seats in
              cost: 55
            - id: notes
              label: Give the company the accumulated notes
              cost: 30
              protected: true
              note: forty-one people cannot open on notes they have not heard
          answers:
            - question: Does the file have an exit time the licence will accept?
              requires:
                - exits
              required: true
            - question: Have the operators actually hit the flying cue?
              requires:
                - fly
            - question: Will the recording read as the designer intended?
              requires:
                - wash
            - question: Does the company know where the moved mark is?
              requires:
                - sightline
            - question: Is the band balanced against a room with seats in it?
              requires:
                - band
          commit: Commit the four hours
        answerText: >-
          Notes are protected, the exit walk is the licence condition, and the flying cue is the one
          thing nobody has done. That is 130 minutes, leaving room for the re-block or the wash and
          not both.
        why: >
          The two licence items are not preferences: the doors do not open without an exit time under
          150 seconds and a filed load plot, so the exit walk is bought first whatever else waits. The
          flying cue is the item where computation has run out — six seconds is the answer and nobody
          has hit it with a company on stage, and a cue nobody has run is a cue that happens for the
          first time in front of an audience. The notes are protected because forty-one people cannot
          open on notes they have not heard. What is left buys the re-block or the camera wash, and the
          honest thing is to say which one is not being done rather than to plan for both.
      - group: PIT
        task: Balance the band against a room with seats in it
        title: The room is different now
        place: Orchestra Pit and Sound
        relationship: >-
          The level in decibels, L = 10·log₁₀(I / I₀), applied to a room whose absorption has changed.
        concept: 'The decibel: a logarithmic scale on a physical ratio'
        takesAsRead:
          - 'Log properties, and why a product becomes a sum'
        scene: >
          With the seats in, the same clap now leaves 22 per cent of its energy after four seconds
          rather than seven. Brand has to reset the band's level for a room that no longer rings.
        guide: >-
          Work out what the change in the room does to the level a listener hears, in decibels, and
          decide which way the band's own level has to move. A room that rings less returns less sound
          to the seats, so the same playing arrives quieter than it did in rehearsal.
        background:
          - >-
              Why a deader room needs more level rather than less. Reverberation adds to what a listener
              receives — the direct sound plus everything the room returns. Take away the returns and the
              total falls, so a band that was balanced in an empty house is quiet in a full one.
          - >-
              Why nobody trusts their ears for this. The empty house was audibly wrong and the change is
              a factor rather than an impression. Brand wants the decibel figure so the desk can be moved
              by a known amount rather than by consensus in a corridor.
        assumes:
          - the direct sound from the pit is unchanged by the seats
        takeaway: A room that returns less sound delivers less total level for the same playing.
        format: BALLPARK
        question: Estimate the change in level from the room alone.
        estimate:
          prompt: Reverberant energy after four seconds falls from 7 per cent to 22 per cent of the clap — the seats have changed the room.
          question: Estimate the change in level from the room alone.
          labels:
            - 0.22  (energy left with the seats in)
            - 0.072  (energy left with the house empty)
            - 10  (the multiplier for an intensity ratio)
            - 20  (the multiplier for a voltage ratio)
          values: [0.22, 0.072, 10, 20]
          slots: 3
          template: '{2} × log₁₀({1} ÷ {0})'
          formula: c*Math.log10(b/a)
          correct: [0, 1, 2]
          target: -4.8
          tolerance: 0.8
          units: dB
          solution: 10 × log₁₀(0.072 ÷ 0.22) = 10 × (−0.485) = −4.8 dB.
          explanation: Nearly five decibels down from the room alone, which is why a band balanced in an empty house is quiet in a full one.
        answerText: About −4.8 decibels from the room alone, so the band comes up by about five.
        why: >
          The ratio of reverberant energies is 0.072 over 0.22, which is 0.33, and ten times its
          logarithm is −4.8 decibels. That is the room's own contribution changing, and it is nearly
          five decibels — a factor of three in intensity, which nobody balances by ear in a corridor.
          The sign is the part to get right: the seats absorb, the room returns less, and the total at a
          listener falls, so the band comes up rather than down. Using twenty as the multiplier doubles
          the figure and would have the desk moved nine and a half decibels, which is a different show.
        rebuttals:
          - Twenty times the log is the voltage definition; these are energies, so it takes ten.
          - Taking the ratio the other way up gives the same size with the wrong sign, and moves the desk the wrong way.
      - group: FLY
        task: Run the cue and report what happened
        title: Six seconds, twice
        place: Fly Floor
        concept: 'Solving a linear system, and what no solution looks like'
        takesAsRead:
          - 'Matrices as transformations of the plane'
        scene: >
          The computed moment is six seconds into the cue. Osei and the revolve operator have never
          run it together. Haigh has an hour and wants two clean runs.
        guide: >-
          Predict the moment from the two rates, then run the cue and time what actually happens. The
          computation is not in doubt; what is in doubt is whether two operators on different clocks
          can arrive at the same instant, twice.
        background:
          - >-
              Why two runs rather than one. One run establishes that it can happen. Two establishes that
              it can be repeated, which is what a cue is. A sequence that worked once is an anecdote and
              a sequence that worked twice is a cue Haigh will call.
          - >-
              What the measurement is likely to show. Operators anticipate, so the first run usually
              arrives early and the second, corrected, arrives late. The useful output is the spread
              rather than either number.
        assumes:
          - both operators start on the same call
        takeaway: A computed moment and a rehearsed one are two different pieces of evidence.
        format: VERIFY
        question: Predict the moment the two arrive together, then run the cue and report.
        verify:
          hint: >-
            Lock the prediction before the cue runs. The gap and the two rates are on the sheet from
            Friday.
          prediction: { label: Predicted moment of arrival, unit: s, min: 0, max: 20, step: 0.5 }
          truth: 6.0
          passRatio: [0.85, 1.15]
          intervention:
            label: Run the cue with both operators
            note: Truss out, revolve in, company clear of the deck.
            outcome: Run twice. Timed from the call to the moment the two were level.
          measurement:
            label: Measured arrival
            note: 5.4 seconds on the first run and 6.3 on the second, both inside the eight-second cue.
            cost: 1
            costUnit: runs
          unmeasuredMoral: >-
            A computed moment nobody has run is a statement about two rates. Whether two operators can
            arrive there together is a different claim, and only a rehearsal makes it.
          commit: Report the cue
        answerText: >-
          Computed at six seconds; run at 5.4 and 6.3. Both inside the cue, and the spread of nearly a
          second is the number the margin has to cover.
        why: >
            The prediction is six seconds and the two runs came in at 5.4 and 6.3, which is the pattern
            operators produce: the first anticipates and the second over-corrects. Both are inside the
            eight-second cue, so the sequence stands. The useful output is not either time but the
            spread — nearly a second of variation, which is what the margin has to absorb, and it is
            invisible to any calculation. Two runs rather than one is the whole point: one establishes
            that it can happen and two establishes that it repeats, and a cue is a thing that repeats.

  # ----- day 15. Opening.
  - title: The fourteenth
    objective: Close the file, open the doors, and say what the fortnight established.
    briefing: Pell signs at noon, the house opens at seven, and everything either measures or it does not.
    stake: >-
      Monday the fourteenth. Pell signs the licence at noon on the strength of the file, the doors open at seven and eight hundred and sixty-one seats are sold. Sallow wants the last hundred released; Kettleby wants the twelve confirmed clear on the moved mark; Osei wants the load plot signed as it stands. Today you close three numbers, decide what happens to the last thirty-nine seats and say what the fortnight actually established. Everything in this building is now either a measurement with a period on it or somebody's recollection, and the file is what decides which of the two the next production inherits.
    takeaway: A measured local number with a stated period is worth more than an inherited figure.
    stops:
      - group: HOUSE
        task: Say what the file can now support
        title: What the file says
        place: The House
        concept: 'Reading a model: what it is a model of, and where it stops being one'
        takesAsRead:
          - 'Choosing a model, and what a residual says about the choice'
        scene: >
          Four statements are drafted for the licence file. Pell will read all four and sign or not
          sign on the strength of them. Two are measurements and two are not.
        guide: >-
          Read each statement against what was actually done in the fortnight. A measurement carries
          the conditions it was taken under; an estimate carries the assumptions it was computed from.
          Both belong in a file and only one of them can be signed against.
        background:
          - >-
              What the walk established and the calculation did not. A clearance time of 161 seconds
              from a walked rehearsal with the full company, and where the queue formed. The 138-second
              estimate assumed a steady flow that no real house produces.
          - >-
              Why the load plot is the strongest item in the file. Every tension in it was computed from
              a measured angle and a weighed piece, and the total includes the term that appears on no
              weight ticket. It is the only number in the building with a margin stated beside it.
        assumes:
          - the file is read as it stands rather than explained in person
        takeaway: A measurement carries its conditions; an estimate carries its assumptions.
        format: PROTOCOL
        task: Match each statement to what supports it.
        columns:
          - The statement
          - What stands behind it
        scenarios:
          - The house clears in 161 seconds
          - The grid carries 1,050 kilograms in the sequence, against 1,600 assessed
          - Twelve seats have no line to the mark
          - Everyone will be out in 138 seconds
        choices:
          - A walked rehearsal with the full company, and the bottleneck named
          - Weighed pieces, measured angles, and the leaning term nobody tickets
          - A survey walked with a marker on the performer's position
          - A steady flow rate assumed from the first second, which no room delivers
        mapping: [0, 1, 2, 3]
        rebuttals:
          - The 161 is a measured time from a walk, and it names where the queue formed.
          - The load plot is built from weighed pieces and measured angles, including the term that is not a mass.
          - The twelve seats were established by sitting in them with a marker on stage.
          - That figure came from a flow rate. The walk measured 23 seconds more than it.
        answerText: >-
          Three measurements with their conditions attached, and one estimate that the walk has already
          contradicted.
        why: >
          Three of the four carry the conditions they were taken under: a walked clearance with the
          bottleneck named, a load plot built from weighed pieces and measured angles, and a seat survey
          done by sitting in the seats with a marker on stage. The fourth is an estimate from a flow
          rate, and the walk has already measured 23 seconds more than it predicted. All four can go in
          the file; only three can be signed against, and the honest form is to keep the estimate with
          the measurement beside it so the next manager can see which was which.
      - group: FRONT
        task: Decide what to do with the last hundred
        title: The last hundred seats
        place: Box Office
        concept: 'Increasing, decreasing, and where a rate of change turns'
        takesAsRead:
          - 'Average rate of change over an interval'
        scene: >
          Eight hundred and sixty-one sold, thirty-nine unsold and the twelve now clear on the moved
          mark. The weekly rise peaked at week four and has been falling since.
        guide: >-
          Use what the differences said rather than what the total says. A rising total with a falling
          rise does not fill a house on its own, so decide whether the last thirty-nine sell
          themselves and what the answer implies for tonight.
        background:
          - >-
              What the turn means for the last seats. The rise has halved twice, so the remaining
              thirty-nine will not go the way the first eight hundred did. They need a reason —
              day-of-performance release, a price, or somebody telling the town the twelve are back on
              sale.
          - >-
              Why the twelve matter out of proportion. They are the only seats whose availability is
              news, because they were withdrawn and are now clear. Everything else on the list is a seat
              that has been on sale for six weeks.
        assumes:
          - the twelve seats are confirmed clear on the moved mark
        takeaway: A rising total with a falling rise does not finish the job on its own.
        format: CHOICE
        question: What should the box office do at noon?
        choices:
          - Release the twelve as returned seats and hold the rest for the door
          - Discount the remaining thirty-nine
          - Do nothing, since the total is still rising
          - Hold all thirty-nine back for the recording company
        answer: Release the twelve as returned seats and hold the rest for the door
        why: >
          The rise has halved twice, so the remaining thirty-nine are not going to sell themselves in a
          day — the total rising says nothing about the rate, which is what fills the last of a house.
          The twelve are the only seats whose availability is actually news, having been withdrawn and
          then cleared, so releasing them is the one action that generates its own demand. Discounting
          thirty-nine seats on a sold-out-looking night gives away revenue on seats that walk-ups take
          anyway. Doing nothing reads the total and ignores the rate. Holding all of them for the
          recording company empties the two rows the camera is pointed at.
        rebuttals:
          - Discounting gives away revenue on the seats walk-ups take at full price.
          - The total rising is not the rate rising, and the rate has halved twice.
          - Held seats leave visible gaps in exactly the rows the camera looks at.
      - group: SHOP
        task: Say what the fortnight replaced
        title: Four numbers that used to be opinions
        place: Scene Shop
        concept: 'Choosing a model, and what a residual says about the choice'
        takesAsRead:
          - 'Average rate of change over an interval'
        scene: >
          Quirke has the four things that changed this fortnight written on the shop wall. Novak
          wants them in an order somebody can act on next time the building goes dark.
        guide: >-
          Look for what the four have in common rather than what each says. In every case a figure
          taken from somewhere else was replaced by a measurement made here, with a period or a
          condition attached to it. Put them in the order of how soon the next production needs each.
        background:
          - >-
              What each one replaced. A centre line from a 1911 drawing, a clearance from a flow rate, a
              per-line tension from halving a weight, and a beam angle from a bearing with no stated
              reference. All four were plausible and none was measured.
          - >-
              Why the order is by urgency rather than by importance. The next production inherits the
              file, and what it needs first is what it cannot work without: the room's own centre line,
              then the load plot, then the seat map, then the rig's reference direction.
        assumes:
          - the file is inherited by the next production intact
        takeaway: An inherited figure and a measured one can agree and are not the same evidence.
        format: SEQUENCE
        question: Put the four in the order the next production needs them.
        cards:
          - The room's own centre line, measured from the side walls
          - The load plot, with every angle measured and the leaning term included
          - The seat map, with the twelve confirmed against a marked position
          - The rig plot's reference direction, stated on the plot itself
        order: [0, 1, 2, 3]
        axis: which the next production needs first
        ends: [needed first, needed last]
        answerText: >-
          Centre line, load plot, seat map, then the rig's reference direction — the order in which the
          next production cannot proceed without each.
        why: >
          The order is by what stops work rather than by what matters most. Nothing can be set out
          without the room's own centre line, and everything built to the 1911 line is 140 millimetres
          wrong. The load plot comes next because nothing flies without it. The seat map is needed
          before tickets go on sale, which is weeks rather than days. The rig's reference direction is
          needed when the rig is plotted, which is last — and it is the one that cost half a metre this
          time. All four are the same move: a figure inherited from a drawing, a rate or a habit,
          replaced by a measurement of this room with its conditions written beside it.


              max: 1
              step: 0.01
              unit: fraction
          truth:
            a: 180
            b: 0.4444
          locus:
            - a: 120
              b: 1
            - a: 180
              b: 0.4444
            - a: 200
              b: 0.36
            - a: 300
              b: 0.16
            - a: 600
              b: 0.04
          second:
            label: Thermal-emission proxy
            locus:
              - a: 180
                b: 0.4444
              - a: 200
                b: 0.55
              - a: 240
                b: 0.6875
              - a: 300
                b: 0.8
              - a: 400
                b: 0.8875
              - a: 600
                b: 0.95
          observable:
            label: Reflected-light brightness proxy
          tolerance:
            a: 15
            b: 0.03
        answerText: Reflected light allows a whole family of pairs. The heat reading crosses that family near one hundred and eighty metres across, with a surface reflecting about 0.44 of the light that lands. The glow also puts the surface near seventeen degrees Celsius.
        why: Reflected light depends on size and surface together, so many pairs fit it equally well. That is a tie, not a noisy measurement, and measuring the same light more carefully will never break it. Heat depends on the two the other way round. A dark rock absorbs more sunlight, so it runs warmer and glows more. Lay the two answers over each other and they cross in one place.
  - title: What Is It Made Of?
    objective: Assign a composition class with explicit alternatives and confidence.
    briefing: Spectra show broad features, but weathering, grain size, and viewing geometry complicate composition. The player must avoid turning a taxonomic resemblance into an exact material claim.
    stake: "Five days out. A wide dip has appeared in the light from the rock. If it is real, it changes what Tola Adebayo, the physical characterization lead, has already written into a draft notice. Today you decide whether that dip belongs to the rock. This is not a label for a catalogue. What the rock is made of gives its weight, and its weight decides whether a spacecraft could move it."
    takeaway: Use spectra, absorption features, mineralogy, taxonomy, model ambiguity as an evidence chain rather than as isolated facts.
    stops:
      - group: CHAR
        task: Open what each spectrum depends on, keep the ones that stand alone, and name what the rest share.
        title: Whose dip is it?
        place: Spectroscopy Observatory
        scene: A wide dip has turned up in the spectrum, which is the rock's brightness measured colour by colour. It would change what the rock is made of. The room has a standard star, an air record, and a spectrum taken from space.
        guide: >-
          Open each piece of evidence to see what the spectrum depended on. Keep what
          would still stand if the air were at fault, and untick the rest. Then name
          what the failing ones share. The dip would change what the rock is made of, so
          both halves count: keeping a false dip and throwing away a real one are
          equally wrong.
        background:
          - >-
              Why the air is the first suspect. Water vapour in Earth's air absorbs light at
              particular colours, and one of them is right where this dip is. Every ground
              telescope looks through that air, so every ground spectrum is the rock's
              spectrum multiplied by the air's.
          - >-
              What looking through more air tells you. If the dip gets deeper when the
              telescope looks through more atmosphere, the air is making it. If it stays the
              same, the air is not.
          - >-
              Why the space spectrum settles it. Above the atmosphere there is no water
              vapour in the way at all. It is the one measurement that does not go through
              the suspect step, which makes it worth more than any number of careful ground
              measurements.
        assumes:
          - a spectrum is brightness measured colour by colour
          - air can leave marks of its own in a spectrum taken from the ground
          - airmass is how much air the light came through on the way in
        takeaway: Measurements that share one path do not check each other.
        format: TRACE
        question: Does the dip belong to the rock, to the air, or to the camera?
        trace:
          hint: Do not count how many plots show the dip. Open what each measurement passes through, keep the checks built on different dependencies, and then name the source shared by the ground-based spectral channels.
          target: telluric
          channels:
            - id: target_ground
              label: Ground target spectrum
              reading: broad dip near 1.4 μm (expected candidate surface feature)
              depends:
                - surface
                - telluric
                - detector
            - id: path
              label: Path-length comparison
              reading: dip deepens at larger airmass (expected feature would be stable if intrinsic to the target over these exposures)
              depends:
                - telluric
                - airmass_geometry
            - id: flat
              label: Flat-field check
              reading: stable response with no matching feature (expected detector calibration stable)
              depends:
                - detector
            - id: space
              label: Space comparison spectrum
              reading: feature absent (expected same target observed without a terrestrial path)
              depends:
                - surface
          resources:
            - id: telluric
              label: Terrestrial atmosphere
            - id: detector
              label: Spectrograph response
            - id: surface
              label: Asteroid surface
            - id: airmass_geometry
              label: airmass geometry
          independent:
            - space
            - flat
        answerText: Treat the dip as air, not rock. The ground spectrum and the airmass comparison both look through Earth's atmosphere, and the dip deepens the longer the path through it. The spectrum from space has no dip at all, and the flat field says the camera is fine.
        why: Three ground displays can agree because all three looked through the same air. The standard star has the dip too. The dip gets deeper when the light came through more air. The flat field is steady, so the camera is not adding it. And the spectrum taken from above the air has no dip at all. Agreement proves nothing when everything agrees for one shared reason.
        headline: A spectrum seems to show a broad absorption feature that could change the inferred surface composition.

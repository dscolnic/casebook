          - the same push shared over more weight makes less change in speed
        takeaway: The same push moves a heavier thing less, in exact proportion.
        format: BALLPARK
        question: How far will the nudge have moved the rock by the time it arrives?
        why: The push is tiny. A craft weighing ten tonnes hits a rock weighing eight billion, so the rock's speed changes by about fifteen millimetres a second — walking pace divided by two hundred. What makes it matter is that the rock keeps that speed, second after second, for eight years. Fifteen millimetres a second works out at about 475 kilometres in a year, and eight of those is thousands of kilometres of sideways shift. That is the whole idea of a nudge: it is not the push that is big, it is the time.
        estimate:
          relationship: Distance moved = how far it shifts in one year × the number of years.
          prompt: The push speeds the rock sideways by fifteen millimetres a second, which works out at about 475 kilometres in a year. The encounter is eight years away.
          question: How far will the rock have moved by then?
          labels:
            - 475 km (how far the nudge moves it in a year)
            - 8 (years before the encounter)
            - 15 (millimetres a second the nudge adds)
            - 2 (extra push from material thrown off)
          values: [475, 8, 15, 2]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 3800
          tolerance: 300
          units: km
          solution: About 475 kilometres in a year, for eight years, is about 3,800 kilometres.
          explanation: The millimetres a second are the same fact in a smaller unit, not a second thing to multiply by. Do this nudge one year out instead of eight and it buys an eighth as much room.
      - group: IMPACT
        task: Match each item on the board to what it does to the outcome.
        title: What makes a deflection work?
        place: Mission Engineering Center
        scene: The impactor plan is up on the mission board. Beside it sit the weight estimate and the tracking plan. The director wants it all sorted before the review.
        guide: >-
          Four items on the board, and four effects. Pair them by asking which part each
          one changes. The push that lands? How much that push moves the rock? Or how
          far the rock has gone by the time it arrives? One of the four is not a
          prediction at all. It is a measurement, taken afterwards.
        background:
          - >-
              Why you match instead of choosing. A response that is right for one situation
              is often nearly right for the next one. Picking from a list lets you take the
              nearly-right answer and never notice. Matching makes you say which situation
              it fits best, and that comparison is the whole point.
          - >-
              How to use the one-each rule. Every response goes somewhere, and nowhere
              twice. So the situations you are sure about are worth more than themselves:
              each one you settle leaves fewer responses for the ones you are not sure
              about. Two lines you trust can decide the other two for you.
          - >-
              Why one wrong line is impossible. If three lines are right, the fourth
              response has nowhere else to go, so it is right too. Being wrong always means
              at least two are wrong at once. If a join feels forced, the mistake is
              probably not in that join — it is in one you already made and stopped
              questioning.
        assumes:
          - a tiny change in speed adds up to a large change in position over years
        takeaway: A deflection is an experiment, and the thing it changes is the orbit.
        format: PROTOCOL
        why: A deflection has four separate parts, and only one of them is the collision. The push that lands depends on the craft's weight and closing speed. What that push does depends on the rock's weight. Material thrown off the surface adds more push, by an amount nobody can predict yet. Time turns a tiny speed change into distance. Without tracking afterwards none of it is measured, only hoped.
        columns:
          - What is on the board
          - What it does to the outcome
        rebuttals:
          - More warning multiplies the same small change into more distance. It is the cheapest thing in the whole problem.
          - The rock's weight divides the push, so an uncertain weight is an uncertain result, in direct proportion.
          - Material thrown off the surface carries momentum away and adds to the push, by a factor nobody can predict.
          - Tracking afterwards measures the change that happened rather than the one that was expected.
        scenarios:
          - More years of warning.
          - The rock's weight is not well known.
          - Nobody knows how much material will be thrown off.
        choices:
          - The same change in speed moves it further.
          - The size of the change cannot be predicted well.
          - The push that lands is bigger or smaller than planned.
        mapping: [0, 1, 2]
      - group: ORBIT
        task: Lock a predicted range, run the impact, then spend the tracking to find out what happened.
        title: Say what you expect, then measure it
        place: Orbit Monitoring Room
        scene: The impactor has hit and the control room is cheering. Nobody has measured the orbit yet. One tracking campaign is left in the budget.
        guide: >-
          Write down the change you expected before the impact, and lock it. Then run
          the tracking campaign and read what the orbit actually did. The cheering is
          not the result. One campaign is left in the budget, so this is the only chance
          to find out.
        background:
          - >-
              Why hitting it is not the same as moving it. The spacecraft changes the rock's
              speed by a few millimetres a second. How much depends mostly on the rubble
              thrown off the surface when it hits, and nobody knows what that surface is
              made of. So the size of the push has to be measured, not assumed.
          - >-
              What the campaign measures. Where the rock was going before, and where it is
              going now, watched long enough that the difference is bigger than the
              measurement error. That is what turns 'we hit it' into 'we moved it this
              much'.
          - >-
              Why the prediction is written first. If the number is written after the
              measurement, it becomes whatever makes the mission look right. Then the one
              thing this whole mission existed to find out is lost.
        assumes:
          - the momentum sum gives the smallest change in speed to expect
          - material thrown off the surface can add to the push
        takeaway: An action is not finished until somebody measures what it did.
        format: VERIFY
        question: Did the measured change in the orbit match what was predicted before the impact?
        verify:
          hint: The momentum calculation gives the lower-bound scale, but ejecta can change the result. Lock the expected range before impact. After the hit, do not stop at a successful collision—buy the tracking measurement and compare it with what you predicted.
          reference:
            label: Actual asteroid velocity change after impact
            truth: 2.1
            unit: cm/s
          measurement:
            label: Post-impact orbit-fit velocity change
            value: 2.1
            unit: cm/s
            cost: 1
          passRatio: [0.6, 1.6]
          prediction:
            min: 1.5
            max: 4.5
            step: 0.05
            label: Post-impact orbit-fit velocity change
            unit: cm/s
          truth: 2.1
          intervention:
            label: Execute the kinetic impact
            alwaysSucceeds: true
        answerText: The hit works. The job is finished only once tracking measures the new orbit. Here the measured change is 2.1 centimetres a second. That sits inside the predicted 1.5 to 4.5, so the model that sized the craft holds up.
        why: The momentum sum gives a smallest change of about one and a half centimetres a second. Material thrown off the surface can add to that. So the prediction has to be a range, not one number. A hit proves the craft arrived. It does not measure the new orbit. Only tracking does that. Comparing it against a locked prediction tests the physics, not the aim.
      - group: IMPACT
        task: Move and narrow the cloud of paths until all of it clears Earth.
        title: Read the risk correctly
        concept: Uncertainty as a range, not a mistake
        place: Impact Monitoring Center
        scene: The best-guess path misses Earth, and the cloud of possible paths around it still touches the impact line. Dr. Marco Rossi, the orbit lead, wants one sentence before the briefing.
        guide: >-
          The cloud on screen is every path the observations still allow. Its middle
          misses Earth. Its edge still touches the impact line, so this is not a
          stand-down yet. Two improvements are ready, and they do different things to
          the cloud: one moves it, one makes it smaller. Apply what you would authorise,
          then say what the briefing can state.
        background:
          - >-
              What the cloud is. The path is worked out from observations, and the
              observations allow a range of paths rather than one. Drawn on the encounter
              plane, that range is a cloud. The impact line is drawn on the same plane.
              Saying the best-guess path misses Earth is a statement about the middle of the
              cloud only.
          - >-
              Moving it and shrinking it are different jobs. Fixing an error in the
              best-guess path slides the whole cloud across without changing its size. The
              uncertainty is the same, just somewhere else. A new, well-placed observation
              adds information and makes the cloud smaller. Only that can clear Earth if it
              is the width that reaches the line.
          - >-
              Why the sentence matters. People hear safe or not safe. A stand-down that gets
              taken back costs the trust the next warning needs. So the briefing has to be
              about the whole cloud, and this is where you find out whether you can say that
              yet.
        assumes:
          - an orbit fit gives a spread of possible paths, not one path
          - the middle of a spread can move without the spread getting any thinner
        takeaway: Risk lives in the whole spread, not in the middle of it.
        format: CLOUD
        question: What has to change before the whole cloud of paths clears Earth? Move the bars to show the middle and one sigma either side.
        cloud:
          hint: The center is the nominal miss and the width is the current uncertainty. Try the two authored improvements separately before combining them; clearance requires the whole displayed band to remain outside the Earth-limb boundary.
          actions:
            - id: recenter
              label: Correct the catalog bias in the nominal orbit
              effect: shift
              amount: 0.13333333333333333
            - id: narrow
              label: Add an independent high-leverage observation
              effect: narrow
              amount: 0.9142857142857144
          pass: 0.98
          centre: 4
          spread: 1.75
          bounds:
            unit: Earth radii on encounter plane
            min: 1
            max: 14.5
            label: Earth-limb clearance
        answerText: Neither move is enough on its own. Do both. The near edge then sits at 4.5 − 3.2 = 1.3 Earth radii, and the whole cloud clears Earth.
        why: An orbit is a spread of possible paths, not a dot. Fixing a known bias slides the whole spread sideways. It does not make the spread any thinner. Better measurements do make it thinner, but they do not choose where the middle sits. The call needs both. If a real part of the spread still crosses Earth, a safe-looking middle has not made anybody safe.
  - title: Evacuate or Wait?
    objective: Create trigger-based preparations proportional to probability, consequence, lead time, and reversibility.
    briefing: The impact corridor crosses populated regions, but the probability is still changing. The player must connect scientific uncertainty to staged civil decisions and avoid both complacency and panic.
    stake: "Three years in. The impactor launched two years ago and reaches the asteroid in eleven days. The chance has moved twice this month, both times downward. The preparedness coordinator, Joan Ellery, has a draft evacuation plan already with two regional governments. Today you match what gets done to what is actually known. Stockpiles are cheap and can be undone. Moving nine million people is neither, and it kills people by itself."
    takeaway: Use risk thresholds, expected consequence, decision under uncertainty, communication, reversibility as an evidence chain rather than as isolated facts.
    stops:
      - group: OPS
        task: Match each state of the evidence to what it justifies doing.
        title: Match what you do to what you know
        place: Risk Communication Center
        scene: The regional team is round one table. The wall shows the newest corridor, the likely damage area and the time left. Today they choose what to do.
        guide: >-
          Four states of the evidence, and four things to do. Pair them by asking three
          questions. How bad would it be? How long is left? And can the action be
          undone? Cheap, undoable things suit a long wait. Ordering people to move suits
          having run out of time. And saying so in public is what makes the next warning
          believed.
        background:
          - >-
              Why you match instead of choosing. A response that is right for one situation
              is often nearly right for the next one. Picking from a list lets you take the
              nearly-right answer and never notice. Matching makes you say which situation
              it fits best, and that comparison is the whole point.
          - >-
              How to use the one-each rule. Every response goes somewhere, and nowhere
              twice. So the situations you are sure about are worth more than themselves:
              each one you settle leaves fewer responses for the ones you are not sure
              about. Two lines you trust can decide the other two for you.
          - >-
              Why one wrong line is impossible. If three lines are right, the fourth
              response has nowhere else to go, so it is right too. Being wrong always means
              at least two are wrong at once. If a join feels forced, the mistake is
              probably not in that join — it is in one you already made and stopped
              questioning.
        assumes:
          - a reversible action can be undone afterwards; an irreversible one cannot
        takeaway: You can prepare in stages without ever claiming to be certain.
        format: PROTOCOL
        why: "What you do depends on three things: how bad it would be, how long you have, and whether you could undo it. Years in hand means there is still time to learn more, so watch and prepare cheaply. A rising chance is worth real preparation, as long as it can be undone. With days left, the time to learn more has gone. And a chance that falls is stood down out loud, or the next warning is ignored."
        columns:
          - What the evidence says
          - What you do
        rebuttals:
          - A tiny chance with years in hand buys the cheapest thing there is. Keep watching, and prepare in ways that cost nothing.
          - A rising chance over a corridor that holds still is worth real supplies, because supplies can be moved back out.
          - With days left, being able to undo it stops being the deciding thing. What it would cost takes over.
          - A falling chance is stood down out loud, with the reason. Dropping it quietly is how the next warning gets ignored.
        scenarios:
          - A tiny chance, with years still to run.
          - A rising chance, and the corridor holding still.
          - A high chance, with days left.
        choices:
          - Keep watching, and prepare in ways that waste nothing.
          - Move supplies in and plan the routes, because both can be undone.
          - Order people to move, under emergency powers.
        mapping: [0, 1, 2]
      - group: OPS
        task: Turn the chance and the population into a number the office can plan against.
        title: How many people is that share?
        concept: Ratios and unit rates in a measurement
        place: Emergency Management Office
        scene: The emergency office needs a number to plan against. It has the people living inside the corridor. It has today's chance of impact. And it has a form to fill in.
        guide: >-
          Five numbers, and three belong to other sums. The biggest city, the earlier
          chance, and the paths that hit. Ask of each whether this one needs it. A share
          of a whole means multiplying, once the share is written as a decimal. What
          comes out is a planning figure, not a number of people who will really move.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - a percentage is a share out of one hundred
        takeaway: A small share of a very large number is still a number somebody has to plan for.
        format: BALLPARK
        question: How many people does that share come to?
        why: This number is a share, not a headcount. Half of one per cent of nine million people is forty-five thousand. Nobody expects exactly that many people to move. Either the rock misses and nobody moves, or it hits and far more than that do. What the share is good for is comparing plans. It puts the cost of preparing beside the risk of not preparing, in the same units.
        estimate:
          relationship: Part = the whole × the share, once the share is written as a decimal.
          prompt: Nine million people live inside the corridor. Today's chance of impact is half of one per cent.
          question: How many people does that share come to?
          labels:
            - 9,000 (thousands of people in the corridor)
            - 5 (people in every thousand, at today's chance)
            - 2,000 (thousands of people in the biggest city there)
            - 50 (people in every thousand, at the earlier chance)
            - 0.37 (paths in every thousand that hit)
          values: [9000, 5, 2000, 50, 0.37]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 45000
          tolerance: 3600
          units: people (expectation)
          solution: Nine million × 0.005 is forty-five thousand people.
          explanation: Half of one per cent is 0.005, not 0.5. Put the percentage straight in without converting it and the answer is a hundred times too big.
      - group: OPS
        task: Set the threshold before the updates arrive, then release the stream.
        title: Prepare without panic
        concept: Deciding what to tell people, and when
        place: Scientific Advisory Board
        scene: Five orbit updates are queued. Planners can still prepare without moving anybody. Both planning and supplies take time, and the thresholds have to be set before the stream starts.
        guide: >-
          One rule, written before the next updates arrive. Once the board is released the number
          cannot change. Starting the planning cell takes two days from the moment it is called, and
          the last update arrives with no time left at all. So your line has to be crossed early
          enough for those two days to fit — and not so early that a cell is started for an object
          that was never going to matter.
        background:
          - >-
              Why set the rules first. The updates arrive one after another, each one
              changing the odds a little. A threshold changed while they come in is just a
              description of what somebody already decided, and it cannot be explained
              afterwards to the people who acted on it.
          - >-
              Why two numbers rather than one. Writing a plan takes weeks. Moving supplies
              takes days, and needs the plan to exist first. One threshold set for the slow
              job fires far too early for the fast one, and set for the fast one leaves no
              time to plan.
          - >-
              What preparing without panic buys. Preparation can be undone cheaply.
              Evacuating people cannot. Good thresholds keep the cheap actions available
              long enough that the expensive one never becomes the only one left.
        assumes:
          - the chance of impact moves as new measurements arrive
          - preparations take time to set up, and some of them can be undone
        takeaway: A rule written before the numbers arrive is the only rule the numbers cannot bend.
        format: TRIGGER
        question: >-
          At what impact probability do you start up the regional planning cell, when it takes two days?
        trigger:
          hint: >-
            Write the threshold before releasing the updates. The cell takes two days to start, so a
            rule firing with less than that has called something that cannot happen.
          scale:
            min: 0
            max: 2
            unit: "%"
            label: Impact probability
            anchors:
              - { at: 0.11, means: 'about one chance in 900 — the quiet end of the list' }
              - { at: 1.4, means: 'one chance in 70, and the corridor crosses where people live' }
          stream:
            - t: 0
              value: 0.11
              hoursLeft: 168
              at: day 0
              update: 0.11 % impact probability
            - t: 2
              value: 0.18
              hoursLeft: 120
              at: day 2
              update: 0.18 % impact probability
            - t: 4
              value: 0.35
              hoursLeft: 72
              at: day 4
              update: 0.35 % impact probability
            - t: 6
              value: 0.8
              hoursLeft: 24
              at: day 6
              update: 0.8 % impact probability
            - t: 7
              value: 1.4
              hoursLeft: 0
              at: day 7
              update: 1.4 % impact probability
          objective: >-
            The planning cell is running while there is still time to use it.
          rehearsal:
            note: the last object watched at this range
            stream:
              - { value: 0.09, hoursLeft: 168 }
              - { value: 0.14, hoursLeft: 120 }
              - { value: 0.22, hoursLeft: 72 }
              - { value: 0.15, hoursLeft: 24 }
              - { value: 0.05, hoursLeft: 0 }
          conditions:
            - id: planning
              label: Activate regional planning cell
              leadHours: 48
              window: { min: 0.15, max: 0.4 }
        answerText: >-
          Start it near 0.2 per cent. It fires on the 0.35 per cent update with 72 hours left, which
          covers the two days the cell needs. The 0.8 per cent update arrives with 24 hours and the
          last one with none.
        why: A threshold is a decision made before the next number lands. Preparation takes time, so an action that is right can still be useless if it starts too late. Setting the rule first also stops every new number being judged by a new standard. Early thresholds go on things that can be undone. Later ones go on the things that cost more. None of it pretends the chance is certain.
      - group: OPS
        task: Observe what the priority asks for.
        title: What the telescope is chasing tonight
        concept: "Deciding what to tell people, and when"
        place: Operations Hut
        scene: The target list runs all night. One priority says which to observe, and whoever has the desk changes it as the night goes on.
        guide: >-
          Observe what the priority asks for and leave the rest on the list. The board
          changes during the night and nobody announces it. What counts is the targets either
          side of a change, because a target that has set cannot be brought back.
        background:
          - >-
              Why the priority changes. A new object nobody has tracked yet is the most urgent thing
              on any night, until enough measurements exist to predict where it goes. Then it becomes
              whatever is setting soonest, because a target below the horizon cannot be observed at
              all.
          - >-
              Why a missed target is different from other mistakes. Most work can be done tomorrow. An
              object low in the sky is up for an hour a night for two weeks, and then not for a year.
        assumes:
          - an object can only be observed when it is above the horizon
        takeaway: A rule that has changed costs most when the chance does not come back.
        format: SPOT
        question: Observe to the priority on the board, and keep checking the board.
        answerText: Read the board, not the list. Every change leaves a few minutes when the old priority still looks like tonight's.
        why: >-
          Three priorities run across the night and each wants different targets. Anything
          nobody has tracked yet, then anything setting soon, then anything with a deadline. A
          target can match two at once, and that is what makes a change cost something. What the
          panel scores is the targets either side of a change. Most of the list is wanted by
          neither priority, so leaving those alone proves nothing. This is the case where the
          cost is highest, because the sky does not wait. An object low in the west is up for
          an hour a night for a fortnight, and a telescope spent on the last hour's priority
          adds a year to somebody's orbit.
        spot:
          duration: 40
          switchEvery: 12
          pass: 0.75
          hint: The priority is on the desk board and changes without warning.
          targets:
            - id: o1
              label: New object, few points
              tags: [new]
            - id: o2
              label: Setting within the hour
              tags: [setting]
            - id: o3
              label: New object, setting soon
              tags: [new, setting]
            - id: o4
              label: Due by Friday
              tags: [deadline]
            - id: o5
              label: Well known, high up
              tags: [routine]
            - id: o6
              label: Deadline, setting soon
              tags: [deadline, setting]
            - id: o7
              label: Routine measurement
              tags: [routine]
            - id: o8
              label: New object, deadline
              tags: [new, deadline]
          rules:
            - say: Anything nobody has tracked yet
              want: [new]
            - say: Anything setting soon
              want: [setting]
            - say: Anything with a deadline
              want: [deadline]
          commit: Open the list
  - title: The Final Defense Review
    objective: Produce a claim-by-claim planetary-defense decision package and preserve monitoring after the immediate threat passes.
    briefing: The international board must decide whether the object is sufficiently characterized, whether the deflection worked, and which civil preparations remain necessary.
    stake: "Eight years after the discovery, and the encounter is next week. The impactor struck five years ago, and tracking since then puts the object about two Earth radii clear. Some five thousand kilometres of that was bought by the impact. Nothing further can be done now, which is as it should be. Today you take the claims one at a time with Isabel Garcia, the survey and response lead, and write the public record with Ellery."
    takeaway: Use evidence synthesis, readiness, residual risk, international coordination, long-term stewardship as an evidence chain rather than as isolated facts.
    stops:
      - group: OPS
        task: Match each claim to what the evidence under it justifies doing.
        title: What each claim has earned
        concept: "Independent checks: a second method that could disagree"
        place: International Review Hall
        scene: The board has to publish one account of an eight-year campaign. The four claims in front of it rest on very different evidence. Whoever runs the next one will read it.
        guide: >-
          Four claims and four things to do about them. Pair them by asking what state
          each claim is in. Settled? Still open? Out of date? Or bigger than this rock?
          Giving four different states the same confidence is how a report stops being
          trusted. Whoever runs the next campaign reads this one.
        background:
          - >-
              Why you match instead of choosing. A response that is right for one situation
              is often nearly right for the next one. Picking from a list lets you take the
              nearly-right answer and never notice. Matching makes you say which situation
              it fits best, and that comparison is the whole point.
          - >-
              How to use the one-each rule. Every response goes somewhere, and nowhere
              twice. So the situations you are sure about are worth more than themselves:
              each one you settle leaves fewer responses for the ones you are not sure
              about. Two lines you trust can decide the other two for you.
          - >-
              Why one wrong line is impossible. If three lines are right, the fourth
              response has nowhere else to go, so it is right too. Being wrong always means
              at least two are wrong at once. If a join feels forced, the mistake is
              probably not in that join — it is in one you already made and stopped
              questioning.
        assumes:
          - a conclusion is only as strong as the evidence under it
        takeaway: Different claims in one document have earned different amounts of confidence.
        format: PROTOCOL
        why: These four claims are in four different states, and giving them one level of confidence is how a report stops being trusted. A shift that somebody else has confirmed can be accepted. An edge nobody has pinned down is a reason to keep watching, not a reason to quote the middle. Plans built on an old corridor have to be fixed before use. And the gaps in the search outlive this rock entirely.
        columns:
          - What the evidence shows
          - What you do with it
        rebuttals:
          - An orbit shift somebody else has confirmed is the strongest claim here. Accept it, with checking going on.
          - An edge nobody has pinned down is not a safe middle. Treating it as one is the mistake this whole campaign was about.
          - Plans built on an old corridor are worse than no plans, because somebody will pick them up and use them.
          - Gaps in the search have nothing to do with this rock and everything to do with the next one.
        scenarios:
          - Tracking shows the orbit shift, and somebody else confirms it.
          - The best guess is safe, and the edges are not pinned down.
          - The plans are ready, and they use an old corridor.
        choices:
          - Accept it, and keep checking.
          - Keep observing, and do not treat the middle as the whole answer.
          - Update them before anybody uses them.
        mapping: [0, 1, 2]
      - group: ORBIT
        task: Spend the two checks on the signed claims that most need measuring.
        title: Signed is not checked
        place: Orbit Monitoring Center
        scene: Two independent checks are left before the record goes public tonight. Every claim in it is signed. Some of them would change the conclusion if they were wrong.
        guide: >-
          Two checks left, and the record goes out tonight. Open each signed claim and
          read what actually backs it. Hold the ones the evidence does not support, and
          spend the checks where a wrong claim would do the most damage — because what
          goes out tonight is where the next team starts.
        background:
          - >-
              Why signed is not checked. A signature says somebody took responsibility for a
              sentence. It does not say anybody went and looked. Under a deadline, a guess
              and an observation end up written the same way on the same page.
          - >-
              Why a public record is harder to fix than to write. People will read it who
              cannot see the evidence, and quote it who were not there. A correction
              afterwards never travels as far as the original did.
          - >-
              How to pick two out of several. Not the shakiest. The one that would send the
              next team in the wrong direction if it were wrong.
        assumes:
          - a signature records that somebody approved something
          - checking costs time, and there is not enough of it for everything
        takeaway: A signature records a decision. It does not measure a thing.
        format: ATTEST
        question: Which signed claims have to be checked before the record goes out?
        attest:
          hint: Every card is signed, but a signature is only a record. You can independently verify two claims. Spend those checks where a wrong claim would materially change the scientific or public conclusion and where no independent backing already exists.
          claims:
            - id: orbit
              label: The current orbit solution and immediate encounter status are independently reproduced
              critical: true
              backed: true
              evidence: a second orbit pipeline using independent software and a separate astrometric subset reproduces the encounter solution
            - id: deflection
              label: The deflection record reports the measured post-impact Δv and its uncertainty
              critical: true
              backed: false
              evidence: raw pre/post astrometry and an independent fit reproduce a Δv near 2.1 cm/s
            - id: size_consequence
              label: The diameter and consequence range preserve the thermal/radar dependencies and uncertainty
              critical: true
              backed: false
              evidence: independent reprocessing reproduces the approximately 180 m size scale and the stated consequence envelope
            - id: wording
              label: The public summary has final communications approval
              critical: false
              backed: false
              evidence: communications office signs the release wording
          checks: 2
        answerText: Spend both checks on the claims that matter and that nobody has backed up. Those are the measured push and the size record. The orbit status has been checked elsewhere already. A signature is not a measurement.
        why: A record is trustworthy when somebody else can rebuild what was measured and how. A signature says a person approved it. It does not say the thing is true. So the checks go to claims that matter and that nobody has confirmed another way. Checking an orbit fit that has already been reproduced spends a check and strengthens nothing. The weakest important link is the one worth the money.
      - group: OPS
        task: Say which part of the system has to keep its funding.
        title: What survives the success
        place: Mission Operations
        scene: The threat is gone, and so is most of the budget. The search still misses parts of the sky, and two follow-up sites lose their funding at the end of the year.
        guide: >-
          Four options, and the threat is gone along with most of the money. Ask of each
          what it does to warning time. Finding a rock earlier buys nights for the path,
          time for the size, and years for a small nudge to work. Nothing later can give
          back time that was never bought.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - warning time comes from finding things early, not from planning for them
        takeaway: The lasting defence is a system that can find, learn, decide and act again.
        format: CHOICE
        question: The campaign budget ends with this review. What survives it?
        why: Warning time is what every later choice gets bought with. Finding a rock earlier gives more nights to check the orbit. It gives time to measure the size and what it is made of. It makes a small push worth giving, because years turn a push into distance. It lets people prepare in stages. Plans and models matter too, and none of them can give back time that was never bought.
        choices:
          - Keep the search and the quick follow-up, and the links.
          - Move the money to studying rocks and testing nudges.
          - Move the money to civil readiness, and wait for warnings.
          - Stop spending. The catalogue and the automatic alerts have it covered.
        answer: Keep the search and the quick follow-up, and the links.
        rebuttals:
          - Studying rocks and testing deflections are both worth having, and they need an object found early enough for any of it to matter.
          - Readiness turns a warning into action. It cannot make a warning if nothing finds the rock in the first place.
          - This campaign is the evidence against that. The gaps, the viewing angles and the follow-up were all short.
# What each place says when the player reads it.
# --------------------------------------------------------------- the warm-ups
warmups:
  trial-near:
    title: Walk the camp while it is still light
    why: >-
      Everything here happens in the dark, and the camp is seven buildings on a ridge with no
      street lights. Walk it once in daylight, because a route learned in the light is one you
      can take at two in the morning with a red torch.
  greet:
    title: Two shifts that barely meet, and you are on both
    why: >-
      The day crew work up what the night crew found, and the two hand over in eleven minutes at
      dawn. Put a name to most of them before your first handover. The survey runs on trusting a
      measurement somebody else took.
  trial-far:
    title: The outstations open tonight, and the keys come out
    why: >-
      The dish and the two outstations are a long way down the ridge road, and nothing out there
      has been called this week. From tonight it is, and the vehicle is signed out. Drive it once
      before you drive it in the dark.
  follow:
    title: Fischer walks the cable run once
    why: >-
      The dish's timing cable runs from the hut to the pad along a route nobody drew. Fischer,
      the radar dynamics lead, knows where it crosses the road. Stay with her, because where she
      stops is where the cable is buried shallow.
  hunt:
    title: Six lamps, and four are where the log says
    item: { name: lamp, plural: lamps }
    why: >-
      Every telescope here is checked against portable lamps, and two went out with somebody
      last week. Until all six are found, nobody can say the brightness measurements are on one
      scale. Two scales invent objects that are not there.
  canvass:
    title: Who saw the bright thing on Tuesday
    why: >-
      Half the valley reported something bright on Tuesday night. The office has to say whether
      it was the re-entry everybody assumes. Ask around until enough accounts have come back to
      separate one bright thing from two.
  evade:
    title: The visitor who wants a look through the telescope
    why: >-
      A guest has been in the dome since dusk wanting to be shown something. Every minute the
      telescope is off target is sky nobody covers tonight. Keep out of his way and get your
      round done.
  tag:
    title: Catch Rossi before the fit starts
    why: >-
      Rossi, the orbit determination lead, has two extra measurements from Monday that never
      went into the file. Once the orbit fit is running it takes two hours and he will not stop
      it. Two points change where this object is predicted to be.

copy:
  DISC: <p>The survey dome and its image processing room. Everything this campaign knows started as photons here.</p>
  ORBIT: <p>Orbit determination. Where a set of angles becomes a family of possible futures.</p>
  CHAR: <p>Spectroscopy and characterization. Size, reflectivity, spin and composition — the physical body itself.</p>
  RADAR: <p>The planetary radar. It measures distance directly, and only when the geometry allows.</p>
  IMPACT: <p>Entry and consequences. What the atmosphere does to an arriving body, and what is left over.</p>
  OPS: <p>The coordination office. Telescope time, international protocol, and what the public is told.</p>
  BOARD: <p>The briefing hall. The board meets here, and the record it publishes outlives everyone in the room.</p>
  TIME: <p>Time and frequency standards. Every timestamp on this mountain traces back to this building.</p>
  ARCHIVE: <p>The plate and data archive. Objects are often found years later in images already taken.</p>

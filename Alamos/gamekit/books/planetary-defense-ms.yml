      - group: CHAR
        task: Fit the reflected light, then use the heat reading to settle the size and the surface.
        title: Settle the size
        place: Physical Characterization Group
        scene: Reflected light alone puts the rock somewhere between one hundred and twenty and six hundred metres across. The heat team now has an infrared reading from the same night.
        guide: >-
          Two controls slide the size and the surface brightness along a whole family of
          pairs that all match the reflected light. See how wide that family is first.
          Then bring in the heat reading, which depends on the same two things in a
          different way, and watch the family shrink to one pair.
        background:
          - >-
              Why reflected light alone cannot settle it. What you measure is how much
              sunlight comes back. That depends on how big the rock is and how shiny it is,
              multiplied together. A small shiny rock and a big dark one send back the same
              light.
          - >-
              What the heat reading adds. Sunlight that is not reflected is absorbed and
              comes back out as heat. So the heat depends on the size and on how much is
              absorbed, which is a different mix of the same two unknowns. Put the two
              together and both are fixed.
          - >-
              Why the size is the number everybody wants. The energy of an impact goes as
              the size cubed. A rock five times wider carries more than a hundred times the
              energy, which is the difference between one region and a continent.
        assumes:
          - a warm object glows in infrared light, which our eyes cannot see
          - reflected brightness depends on the size and the surface together
        takeaway: A tie between two answers is broken by a measurement that depends on them differently.
        format: DEGENERACY
        question: Which width and which surface fit the reflected light and the heat at once?
        degeneracy:
          hint: First move diameter and albedo until the reflected-light proxy is matched; several combinations work. Then use the thermal spectrum and flux, which respond to absorbed and emitted energy, and satisfy both constraints at once.

theme:
  id: planetary_defense_ms
  title: Planetary Defense
  subtitle: Campaign Director · International NEO Response

# The areas of study. One column of the game each; every group needs somebody on the roster.
groups:
  - id: DISC
    code: DISC
    name: Discovery & Imaging
    color: "#315c78"
    desc: Images, signal-to-noise, moving-object detection, and artifact rejection.
    defaultLeader: nguyen
    milestones:
      - Validate the detection
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: ORBIT
    code: ORBIT
    name: Astrometry & Orbit
    color: "#704f88"
    desc: Sky position, timing, orbit fitting, covariance, and impact probability.
    defaultLeader: rossi
    milestones:
      - Constrain the orbit
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: CHAR
    code: CHAR
    name: Physical Characterization
    color: "#4b775f"
    desc: Brightness, albedo, spectra, rotation, size, and composition.
    defaultLeader: adebayo
    milestones:
      - Measure the body
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: RADAR
    code: RADAR
    name: Radar & Dynamics
    color: "#9a741d"
    desc: Range, delay, velocity, momentum transfer, and independent orbit constraints.
    defaultLeader: fischer
    milestones:
      - Add geometric leverage
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: IMPACT
    code: IMPACT
    name: Entry & Consequences
    color: "#9a3f36"
    desc: Energy, atmospheric entry, fragmentation, consequence uncertainty, and deflection physics.
    defaultLeader: banerjee
    milestones:
      - Bound the consequence
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off
  - id: OPS
    code: OPS
    name: Survey & Response
    color: "#3d6f52"
    desc: Completeness, observing geometry, response decisions, communication, and long-term readiness.
    defaultLeader: garcia
    milestones:
      - Turn evidence into action
      - Connect the evidence
      - Verify with an independent check
      - Ready to hand off

# The cast. `division` is what makes a person a valid person stop.
roster:
  - id: nguyen
    name: Dr. Linh Nguyen
    role: Survey Imaging Lead
    division: DISC
    quiz:
      - q: How does Nguyen separate a real moving object from a detector artefact?
        a: It appears in independent exposures and moves consistently
        wrong:
          - Artefacts are always brighter on the frame than a real detection is
          - Real objects appear on only one detector at a time
          - Cosmic rays are removed by the telescope's own software
    bio: Distinguishes real moving sources from cosmic rays, detector defects, and image-processing artifacts using repeated and independent observations.
  - id: rossi
    name: Dr. Marco Rossi
    role: Orbit Determination Lead
    division: ORBIT
    quiz:
      - q: Why does Rossi treat a position as a timed measurement rather than a point?
        a: An orbit is fitted to when as much as where
        wrong:
          - A position is only valid for the night on which it was taken
          - Timing decides which telescope gets credit for the observation
          - The covariance is computed from exposure length
    bio: Treats every position as a timed measurement with calibration and covariance, then asks which observation reduces the dangerous uncertainty.
  - id: adebayo
    name: Dr. Tola Adebayo
    role: Physical Characterization Lead
    division: CHAR
    quiz:
      - q: Why will Adebayo not give a diameter from brightness alone?
        a: Brightness is size and reflectivity together
        wrong:
          - Brightness cannot be measured accurately at the faintest magnitudes
          - Diameter requires a radar detection by definition
          - Reflectivity is the same for every asteroid of a given type
    bio: Combines brightness, color, spectra, thermal information, and rotation without pretending any one observable uniquely determines size or composition.
  - id: fischer
    name: Dr. Anna Fischer
    role: Radar Dynamics Lead
    division: RADAR
    quiz:
      - q: What does radar add that optical astrometry cannot give?
        a: A direct distance and line-of-sight speed
        wrong:
          - A far more accurate measurement of the very same position on the sky
          - The object's composition from the returned frequency
          - Observations that can be made in daylight
    bio: Uses signal delay and Doppler measurements to add independent geometric constraints to optical astrometry.
  - id: banerjee
    name: Dr. Rohan Banerjee
    role: Impact Physics Lead
    division: IMPACT
    quiz:
      - q: Why does Banerjee give consequence as a range rather than a number?
        a: Three uncertain inputs multiply through the calculation
        wrong:
          - A range is required by protocol before any public statement is made
          - Deterministic answers are only possible after entry
          - The range describes how likely an impact is
    bio: Connects size, density, speed, atmosphere, and fragmentation to consequence ranges rather than single deterministic outcomes.
  - id: garcia
    name: Dr. Isabel Garcia
    role: Survey and Response Lead
    division: OPS
    quiz:
      - q: What is Garcia guarding against when she says expected value is not a prediction?
        a: A tiny chance of something enormous gives a number nobody will see
        wrong:
          - Expected value cannot be computed before the orbit is known
          - Probabilities below 1% are not meaningful to a general audience
          - The public always misreads percentages
    bio: Balances observing completeness, uncertainty reduction, public communication, and response thresholds without confusing expected value with a prediction.
  - id: virtanen
    name: Aino Virtanen
    role: Survey Pipeline Scientist
    division: DISC
    bio: |-
      Owns the software that decides which of the night's 40000 detections
      a human being ever sees. Most of what it flags is a satellite, a cosmic ray or
      a column of hot pixels.

      Her measure of the pipeline is not how many objects it finds but how many real
      ones it throws away, which can only be known by feeding it synthetic objects
      and counting how many come back.
    quiz:
      - q: How does Virtanen measure whether the survey is missing objects?
        a: By planting known objects and seeing how many are found
        wrong:
          - By comparing the number found this year with last year
          - By checking that no uncatalogued objects appear in the catalogue
          - By observing the same field twice on the same night
  - id: delacroix
    name: Hugo Delacroix
    role: Astrometrist
    division: ORBIT
    bio: |-
      Turns images into positions, which sounds mechanical and is where most orbit
      errors are actually born. A position is only as good as the star catalogue it
      was measured against and the clock that timestamped it.

      He looks for structure in residuals across the focal plane. A bias that grows
      toward the corner of a detector is an instrument problem wearing the costume
      of an orbital one.
    quiz:
      - q: What does Delacroix conclude from residuals that grow toward one corner of the detector?
        a: The error follows position on the detector, not the sky
        wrong:
          - The object is accelerating in a way gravity does not explain
          - The exposure times were recorded in the wrong time standard
          - The telescope was tracking at the wrong rate
  - id: sorokin
    name: Irina Sorokin
    role: Thermal Infrared Observer
    division: CHAR
    bio: |-
      Measures asteroids in the infrared, where what is seen is heat the body
      re-radiates rather than sunlight it reflects. That breaks the tie between a
      small bright object and a large dark one.

      Reflected light alone gives brightness, which is the product of size and
      reflectivity. Two unknowns, one measurement — and every consequence estimate
      downstream cubes whichever size you guessed.
    quiz:
      - q: Why does Sorokin's infrared measurement pin down a diameter that optical brightness cannot?
        a: Thermal emission depends on size and temperature, not reflectivity
        wrong:
          - Infrared telescopes have better angular resolution
          - Reflected light cannot be measured for faint objects
          - The infrared band is unaffected by distance
  - id: mbeki
    name: Thabo Mbeki-Rowe
    role: Radar Astronomer
    division: RADAR
    bio: |-
      Transmits at an asteroid and listens for the echo, which is the only method in
      this campaign that measures a distance directly instead of inferring it.

      The catch is geometry. Radar strength falls with the fourth power of distance,
      so the technique that collapses an orbit works for a few days per apparition
      and then not at all for years.
    quiz:
      - q: Why is a radar window so short and so valuable?
        a: The returned signal weakens as the fourth power of range
        wrong:
          - The transmitter overheats after a few hours of use
          - Radar requires the object to be in the Earth's shadow
          - Other observatories are booked for optical work at exactly the same hours
  - id: schulz
    name: Marta Schulz
    role: Impact Physics Modeller
    division: IMPACT
    bio: |-
      Models what happens between the top of the atmosphere and the ground, where
      an object either arrives intact, breaks up and deposits its energy as a burst,
      or does something in between.

      Which of those happens depends on the body's strength, and strength is the
      quantity nobody has measured for the object in question. Her models therefore
      produce distributions, and she resists every request to reduce one to a
      headline number.
    quiz:
      - q: Why do Schulz's entry models produce a range of outcomes rather than one?
        a: The body's strength is unmeasured, and it decides whether it fragments
        wrong:
          - Atmospheric density at those heights is never known to better than a factor of two
          - The models are run on different computers with different rounding
          - Entry angle cannot be determined before impact
  - id: ellery
    name: Joan Ellery
    role: Preparedness Coordinator
    division: OPS
    bio: |-
      Translates a probability that keeps moving into actions that people can take
      without being made fools of when it moves again.

      Her tool is the pre-agreed trigger: what has to be observed, by when, for a
      given protective step to begin. Announced in advance, it survives a
      probability that falls; announced afterwards, it looks like improvisation.
    quiz:
      - q: Why does Ellery agree protective triggers before the probability settles?
        a: A step tied to a stated observation survives the probability changing
        wrong:
          - Triggers reduce the uncertainty in the orbit determination
          - Regulations require evacuation plans to be filed in advance
          - Announcing them early is what stops the media reporting the risk badly

# Terms the game may explain in place.
glossary:
  - name: Albedo
    aliases:
      - albedo
    def: The fraction of incident light a surface reflects.
  - name: Astrometry
    aliases:
      - astrometry
    def: Measurement of an object position on the sky.
  - name: Astronomical unit
    aliases:
      - AU
      - astronomical unit
    def: The average Earth–Sun distance, about 150 million kilometres. Orbit sizes are quoted in it.
  - name: Calibration
    aliases:
      - calibrate
      - calibrated
      - calibration
    def: The correction between what an instrument reads and what is true, established against something known.
  - name: Covariance
    aliases:
      - covariance
    def: A description of how uncertainties in fitted quantities vary together.
  - name: Ephemeris
    aliases:
      - ephemeris
      - ephemerides
    def: A table of where an object will be, night by night, computed from its orbit. Its uncertainty is what a telescope has to search.
  - name: Light curve
    aliases:
      - light curve
    def: Brightness measured as a function of time.
  - name: Parallax
    aliases:
      - parallax
    def: The apparent shift of an object against the background stars when the observer moves. With a known baseline it gives a distance by triangle.
  - name: Polarimetry
    aliases:
      - polarimetry
      - polarimetric
    def: Measuring how light is polarised after reflection, which constrains what a surface is made of and how rough it is.
  - name: Radar delay
    aliases:
      - radar delay
    def: Round-trip travel time of a radar signal, used to infer range.
  - name: Solar elongation
    aliases:
      - solar elongation
    def: The angular separation between an object and the Sun as seen from the observer.

# The campaign: 1 working day each, 3 stops and a callback from day 3.
missions:
  - title: The Discovery Image
    objective: Validate a new-object candidate and preserve the measurements needed for follow-up.
    briefing: A survey telescope flags a faint moving point near the ecliptic. The player must determine whether it is a real Solar System object, an image artifact, or a known source.
    stake: Eleven days before the object passes Earth. The survey run by Aino Virtanen has flagged a faint dot that moved between three pictures. The same patch of sky holds forty thousand catalogued stars, two satellite streaks and a column of hot pixels. Today you decide whether there is really something out there. You leave the measurements in a state somebody else can use. And you say where to point next. Nothing else is known yet. Not how big it is. Not what it is made of. Not whether this pass is the one that matters. Every hour of waiting widens the patch of sky it could be in.
    takeaway: Use digital images, signal-to-noise, artifacts, moving-object detection, controls as an evidence chain rather than as isolated facts.
    stops:
      - group: DISC
        task: Say which explanation fits all four readings on the board.
        title: Real object, or camera fault?
        place: Survey Telescope Control
        scene: Three survey pictures show the same faint dot in three different places. The background stars have not moved. A telescope on another mountain has just found the dot too.
        assumes:
          - a detector is the chip inside the camera, and its faults stay in one spot on the chip
        takeaway: Something real moves against the stars, and a camera fault stays where the camera put it.
        format: CHOICE
        question: Which explanation fits all four readings?
        why: A real object moves against the sky. A camera fault moves with the camera. That is the test, and every reading here uses it. The dot is round in all three pictures, so it is not a cosmic ray, which hits once and hits sharp. It lands on a new pixel each time, so it is not a hot pixel. A second telescope found it, so it is not one camera making things up.
        rebuttals:
          - A cosmic ray hits once and looks sharp. This dot is round in all three pictures, and it keeps moving.
          - A hot pixel is bright wherever that pixel sits. This dot lands somewhere new each time.
          - A bad line-up would drag many stars along. Here the stars hold still and one dot does not.
        headline: The survey software flags a faint dot that moves near the ecliptic.
        readings:
          - zone: Three survey exposures
            label: Three survey exposures
            value: Source moves linearly between frames
            status: alarm
            note: Motion is consistent in time and direction
          - zone: Point-spread shape
            label: Point-spread shape
            value: Star-like in each exposure
            status: alarm
            note: Not a single-pixel spike
          - zone: Detector defect map
            label: Detector defect map
            value: No hot pixel at those positions
            status: normal
            note: The source crosses different detector pixels
          - zone: Background stars
            label: Background stars
            value: Remain fixed after astrometric alignment
            status: normal
            note: Frame alignment is stable
          - zone: Second telescope
            label: Second telescope
            value: Recovers source near predicted position
            status: alarm
            note: Independent hardware confirms motion
        choices:
          - label: A real object out in the Solar System
            mechanism: A real object shifts against the stars and lands on a new part of the chip each time.
          - label: A cosmic ray hitting the camera
            mechanism: A charged particle leaves one sharp mark, in one picture only.
          - label: A hot pixel on the chip
            mechanism: One spot on the chip reads bright every time that spot is read.
          - label: The pictures were lined up wrong
            mechanism: A bad line-up drags many stars the same way at once.
        answer: A real object out in the Solar System
      - group: DISC
        task: Put the four steps in the order they have to be done.
        title: Check it before you send it
        place: Image Processing Lab
        scene: Forty thousand stars, two satellite streaks and a bad column of pixels share the pictures with the moving dot. The discovery notice goes out at dawn.
        assumes:
          - a prediction other people can test is what makes a claim checkable
        takeaway: A claim is worth sending out once somebody else can test it.
        format: SEQUENCE
        why: Each step throws out a different kind of mistake. Cleaning removes what the camera itself adds. Matching removes the satellites, the known faults and the objects already on the list. Measuring turns a picture into numbers, with a range that says how sure you are. The last step turns all of that into a prediction. A prediction can fail, and that is what makes the claim worth sending.
        rebuttals:
          - Cleaning comes first. Positions measured off a dirty picture are wrong, and no later step fixes that.
          - Matching comes second, or you measure a satellite or a bad pixel very carefully.
          - Measuring comes third, with how sure you are. A position with no range on it fits nothing.
          - The prediction comes last. It is the step that lets somebody else prove you wrong.
        cards:
          - Remove the camera's own marks, and solve exactly where it was pointing.
          - Match every dot in the field against the star list, the satellite list and the known camera faults.
          - Measure where the object is and how bright it is, and say how sure you are.
          - Post a predicted position, so another observatory can look and check.
        order: [0, 1, 2, 3]
      - group: ORBIT
        task: Turn the shift between two pictures into a rate the next telescope can use.
        title: How fast is it moving?
        place: Minor-Planet Operations Desk
        scene: The dot shifted between two pictures taken twenty minutes apart. The next telescope has to be told where to point. Nobody has turned that shift into a rate yet.
        assumes:
          - a rate is an amount divided by the time it took
        takeaway: Two pictures and a clock turn movement into a rate you can point with.
        format: BALLPARK
        question: About how fast is it moving, in arcseconds per hour?
        why: Angular speed is a rate, so the units have to match before anything is divided. Six tenths of an arcsecond a minute is thirty-six arcseconds an hour, because an hour holds sixty minutes. This is not how fast the rock really flies. The same shift in the sky means very different true speeds at different distances. What it does tell you is how far the dot drifts between tonight's pictures.
        estimate:
          relationship: Rate = how far it moved ÷ how long it took. Minutes become hours by multiplying by sixty.
          prompt: The dot moves twelve arcseconds in twenty minutes. Before anyone points a telescope, that has to become a rate per hour.
          question: About how fast is it moving, in arcseconds per hour?
          labels:
            - twelve arcseconds (how far it moved)
            - twenty minutes (between the two pictures)
            - three exposures
            - 1,200 seconds (the same gap, in seconds)
            - twenty-four hours
          values: [12, 20, 3, 1200, 24]
          slots: 2
          template: "{0} ÷ {1} × 60"
          formula: a/b*60
          correct: [0, 1]
          target: 36
          tolerance: 3
          units: arcsec/hour
          solution: Twelve ÷ twenty is six tenths of an arcsecond a minute, so about thirty-six arcseconds an hour.
          explanation: The sixty in the template is the minutes in an hour, so the time has to be in minutes. Use the same gap in seconds and the answer comes out sixty times too small.
  - title: Confirm the Motion
    objective: Produce a consistent astrometric track and identify observations that should be down-weighted or repeated.
    briefing: Follow-up telescopes obtain positions with different clocks and plate solutions. The player must combine astrometry without creating a false trajectory from inconsistent reference frames.
    stake: Ten days to the pass. Six observatories have sent positions to Hugo Delacroix, the campaign's position expert. Two used a different clock standard. One sent no pointing solution at all. And one camera's measurements bend away from the orbit in a way that looks like a fault rather than noise. Today you build one clean track out of all of it, and you buy the next observation. Delacroix will not throw anything out until the room agrees how. A weak track loses the object after the pass. It will be too faint to find again for years.
    takeaway: Use angular coordinates, plate calibration, time standards, uncertainty, residuals as an evidence chain rather than as isolated facts.
    stops:
      - group: OPS
        task: Say which explanation fits the pattern in the misses.
        title: Why do the positions disagree?
        place: Follow-Up Telescope Network
        scene: One wide camera's positions bend away from the orbit near one edge of its chip. The clock checks out. A second telescope, watching the same object, shows nothing odd.
        assumes:
          - the reference stars in a picture are a check on the picture itself, because they do not move
        takeaway: An error that follows the equipment is telling you about the equipment.
        format: CHOICE
        question: Which explanation fits the pattern in the misses?
        why: The reference stars are the control. They do not move, so anything that shifts them belongs to the equipment. Here they miss by more toward one edge of the chip, and the asteroid misses the same way. That is a pattern in chip position, not in the sky. A real push would move the asteroid alone. The clock agrees, so it is not timing, and the second telescope agrees, so it is not the orbit.
        rebuttals:
          - A real push acts on the asteroid alone. The stars would stay where they belong, and here they do not.
          - A clock error moves the asteroid and leaves the stars right. Both are off here, and the clock checks out.
          - A bad star list would show up at the second telescope too, and all across the field rather than at one edge.
        headline: One camera's follow-up positions curve away from the orbit. A second telescope agrees with the orbit.
        readings:
          - zone: Asteroid residuals
            label: Asteroid residuals
            value: Grow toward field edge
            status: alarm
            note: Small near center, larger at large radius
          - zone: Reference-star residuals
            label: Reference-star residuals
            value: Show the same spatial pattern
            status: alarm
            note: Not unique to the asteroid
          - zone: Exposure timestamps
            label: Exposure timestamps
            value: Agree with observatory clock
            status: alarm
            note: No measurable timing jump
          - zone: Second telescope
            label: Second telescope
            value: Agrees with predicted orbit
            status: normal
            note: Independent instrument does not see the offset
          - zone: Distortion calibration
            label: Distortion calibration
            value: Older than current camera configuration
            status: alarm
            note: Geometric model may be stale
        choices:
          - label: The camera's map from chip to sky is out of date
            mechanism: A stale chip-to-sky map pushes the stars and the asteroid the same way near the edge.
          - label: The asteroid is really speeding up
            mechanism: A real force in space moves the asteroid and nothing else.
          - label: The recorded times are wrong
            mechanism: A wrong exposure time shifts moving objects and leaves fixed stars where they belong.
          - label: The star list is wrong everywhere
            mechanism: A bad star list is wrong in the same way at every telescope and across the whole field.
        answer: The camera's map from chip to sky is out of date
      - group: ORBIT
        task: Put the four steps in the order they have to be done.
        title: Build the arc
        place: Astrometry Lab
        scene: Six observatories have sent positions. Two used a different time standard, and one sent no pointing solution at all. Together they cover four hours.
        assumes:
          - an arc is the stretch of time your measurements cover
        takeaway: A path is tested by where the object turns up next, not by how well it fits the past.
        format: SEQUENCE
        why: A short arc fits many paths at once. They agree about where the object has been and disagree about where it goes. Time is what pulls them apart. Wait a few nights and paths that matched the same measurements spread out across the sky. So the real test is a prediction. Point where one path says the object will be, and the paths that were wrong are gone.
        rebuttals:
          - Same map and same clock first. Two time standards in one fit hide inside the answer afterwards.
          - A rough path second. You need something to measure the misses against.
          - The misses third. Scatter is noise, but a pattern that follows one station is a fault.
          - The prediction last. It is the only step the sky can prove wrong.
        cards:
          - Put every measurement on the same map and the same clock.
          - Fit a first rough path across the sky.
          - Look at what the fit misses, and see whether the misses make a pattern.
          - Say where the object will be tomorrow night, closely enough to point a telescope.
        order: [0, 1, 2, 3]
      - group: OPS
        task: Spend the one booking on the observation that changes next week's prediction most.
        title: Buy the observation that decides
        place: Time Standards Room
        scene: Four hours of spare time on a two-metre telescope. The object is faint and sets soon after dusk. The same patch of sky comes back in six nights.
        assumes:
          - a short arc of measurements fits many possible paths
          - parallax is the shift you see when you look at something from a different place
        takeaway: A measurement is worth buying when its result would change what you do next.
        format: VALUE
        question: Which booking changes the six-night prediction most?
        value:
          hint: You can buy one follow-up booking. Open each option to see what new constraint it would add, then spend the slot on the evidence that most changes the short-arc orbit prediction.
          budget:
            amount: 1
            unit: follow-up booking
            label: Discretionary telescope allocation
          decision: Choose which orbit family to prioritize for the next six-night prediction and impact-monitoring update.
          options:
            - id: later
              label: Observe again near the end of the six-night visibility window
              cost: 1
              axis: time baseline
              decisive: true
              reveals: How the competing short-arc orbit families separate after several days of propagation.
            - id: immediate
              label: Take another exposure immediately from the same telescope
              cost: 1
              axis: same-geometry precision
              decisive: false
              reveals: A slightly smaller random position error at almost the same time and geometry.
            - id: parallax
              label: Use a geographically separated telescope tonight
              cost: 1
              axis: distance by parallax
              decisive: false
              reveals: An independent distance constraint from simultaneous viewing geometry, useful but less leverage on the six-day along-track prediction than the missing time baseline.
            - id: press
              label: Use the slot to prepare and release the discovery notice
              cost: 1
              axis: communication
              decisive: false
              reveals: No new physical constraint on distance, velocity, or the orbit family.
        answerText: Book the later observation. By then the paths that fit today's data have spread apart. One position rules most of them out. Another picture tonight would not.
        why: A short arc fits many paths at once. A picture tonight is sharp and adds almost nothing. The paths have not had time to disagree yet. Give them days and they spread across the sky. Then one later position throws most of them out. Looking from far away works for the same reason. A new angle is new information. A sharper picture from the same spot is not.
  - title: The Uncertainty Corridor
    objective: Report an impact probability and uncertainty corridor that remain meaningful as new data arrive.
    briefing: The nominal trajectory misses Earth, but a thin set of allowed solutions passes through it. The player must interpret probability, covariance, and how the spread grows unevenly, without confusing low probability with zero consequence.
    stake: Eight days out, and the argument is no longer about this pass. The best-fit path for the return in eight years misses Earth easily. A thin set of paths inside the spread does not. The strip they cross holds nine million people and a coastline. This morning's numbers pushed the chance up, and it is already on the wire. Dr. Marco Rossi, the orbit lead, wants to say nothing until the arc is longer. Joan Ellery, who runs preparedness for the two counties under that strip, says the number goes public whether or not this room has the words for it. Today you work the chance out properly, and pick the measurement that shrinks it. You get one chance to explain it.
    takeaway: Use probability distributions, covariance, uneven growth of the spread, risk corridors, decision thresholds as an evidence chain rather than as isolated facts.
    stops:
      - group: IMPACT
        task: Move and narrow the cloud of paths until all of it clears Earth.
        title: Read the risk correctly
        place: Impact Monitoring Center
        scene: The best-guess path misses Earth, and the cloud of possible paths around it still touches the impact line. Dr. Marco Rossi, the orbit lead, wants one sentence before the briefing.
        assumes:
          - an orbit fit gives a spread of possible paths, not one path
          - the middle of a spread can move without the spread getting any thinner
        takeaway: Risk lives in the whole spread, not in the middle of it.
        format: CLOUD
        question: What has to change before the whole cloud of paths clears Earth?
        cloud:
          hint: The center is the nominal miss and the width is the current uncertainty. Try the two authored improvements separately before combining them; clearance requires the whole displayed band to remain outside the Earth-limb boundary.
          actions:
            - id: recenter
              label: Correct the catalog bias in the nominal orbit
              effect: shift
              amount: 0.13333333333333333
            - id: narrow
              label: Add an independent high-leverage observation
              effect: narrow
              amount: 0.9142857142857144
          pass: 0.98
          centre: 4
          spread: 1.75
          bounds:
            unit: Earth radii on encounter plane
            min: 1
            max: 14.5
            label: Earth-limb clearance
        answerText: Neither move is enough on its own. Do both. The near edge then sits at 4.5 − 3.2 = 1.3 Earth radii, and the whole cloud clears Earth.
        why: An orbit is a spread of possible paths, not a dot. Fixing a known bias slides the whole spread sideways. It does not make the spread any thinner. Better measurements do make it thinner, but they do not choose where the middle sits. The call needs both. If a real part of the spread still crosses Earth, a safe-looking middle has not made anybody safe.
      - group: ORBIT
        task: Turn the count of paths that hit into a chance anybody can quote.
        title: Thirty-seven paths in a hundred thousand
        place: Statistical Orbit Lab
        scene: The computer has finished flying every path that fits the measurements. What came back is a count. The number that leaves this room will be quoted in public for years.
        assumes:
          - a chance can be worked out by counting how often something happens out of all the tries
        takeaway: A very small chance can only be measured by trying a very large number of times.
        format: BALLPARK
        question: What is the chance of impact, as a percentage?
        why: The computer draws many paths that all fit the measurements, then flies each one forward. Thirty-seven out of one hundred thousand land on Earth. That works out at 0.037 per cent. It is not a count of future impacts. It is the share of the spread that lands on us. So the number moves whenever the spread moves. One good measurement next week can shrink it to nothing, or double it.
        estimate:
          relationship: Chance = paths that hit ÷ all the paths tried. Multiply by one hundred for a percentage.
          prompt: The computer flew one hundred thousand paths that all fit the measurements. Thirty-seven of them hit Earth.
          question: What is the chance of impact, as a percentage?
          labels:
            - thirty-seven paths that hit
            - one hundred thousand paths tried
            - one thousand paths (the first quick run)
            - 99,963 paths that missed
            - eight years to the encounter
          values: [37, 100000, 1000, 99963, 8]
          slots: 2
          template: "{0} ÷ {1} × 100"
          formula: a/b*100
          correct: [0, 1]
          target: 0.037
          tolerance: 0.004
          units: "%"
          solution: Thirty-seven out of one hundred thousand is 0.037 per cent.
          explanation: The bottom number is every path tried, not only the ones that missed. And a thousand tries could never have found a chance this small.
      - group: OPS
        task: A thin set of paths still hits Earth. Say where the telescope should point next week.
        title: Point where the answers disagree
        place: Planetary Defense Coordination Office
        scene: The best guess misses by four Earth radii, and about one path in six hundred still hits. Next Tuesday the two sets of paths sit eight arcseconds apart. After that they close up again.
        assumes:
          - a measurement teaches you something where the possible answers disagree
        takeaway: The best measurement is the one whose result the rival answers would disagree about.
        format: CHOICE
        question: A thin set of paths still hits Earth. Where do you point next week?
        why: A measurement only teaches you something where the rival answers disagree. Here that is one night. On Tuesday the hitting paths and the missing paths sit eight arcseconds apart. Any follow-up telescope can tell those apart. Before and after, both sets predict the same spot. Point then and you confirm what nobody argued about. So the answer here is a date, not a better telescope.
        choices:
          - Where the hitting paths and the missing paths point to different places.
          - Wherever the object is brightest and easiest to measure.
          - At the same patch of sky again, to improve the camera calibration.
          - Nowhere new — run the same measurements through another orbit program.

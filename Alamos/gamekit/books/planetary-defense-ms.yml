      - group: ORBIT
        task: Put the four steps in the order they have to be done.
        title: Build the arc
        concept: "Position, time and speed: how fast something moves across the sky"
        place: Astrometry Lab
        scene: Six observatories have sent positions. Two used a different time standard, and one sent no pointing solution at all. Together they cover four hours.
        guide: >-
          All four steps will happen. Six observatories have sent positions, two on a
          different clock and one with no pointing solution. Ask of each step what the
          next one would mean without it. And note what the goal is. Not more numbers,
          but numbers that would tell two possible paths apart.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim that each step needs the
              one before it to have happened. Get one pair the wrong way round and the claim
              is wrong, even if everything else lines up. That is why there is no part
              credit.
          - >-
              Why the ends are the place to start. The first and last steps are usually the
              easiest to be sure of, because one has nothing before it and the other has
              nothing after it. Fixing those two leaves fewer ways for the middle to go, and
              the middle is where the real question usually is.
          - >-
              What the rail can be ordered on. Often it is time. It can also be cost, or
              risk, or what you can still undo afterwards — do the steps that change nothing
              before the ones that change something for good. A step that destroys the
              sample can only be last.
        assumes:
          - an arc is the stretch of time your measurements cover
        takeaway: A path is tested by where the object turns up next, not by how well it fits the past.
        format: SEQUENCE
        why: A short arc fits many paths at once. They agree about where the object has been and disagree about where it goes. Time is what pulls them apart. Wait a few nights and paths that matched the same measurements spread out across the sky. So the real test is a prediction. Point where one path says the object will be, and the paths that were wrong are gone.
        rebuttals:
          - Same map and same clock first. Two time standards in one fit hide inside the answer afterwards.
          - A rough path second. You need something to measure the misses against.
          - The misses third. Scatter is noise, but a pattern that follows one station is a fault.
          - The prediction last. It is the only step the sky can prove wrong.
        cards:
          - Put every measurement on the same map and the same clock.
          - Fit a first rough path across the sky.
          - Say where it will be tomorrow, closely enough to point.
        order: [0, 1, 2]
      - group: OPS
        task: A thin set of paths still hits Earth. Say where the telescope should point next week.
        title: Point where the answers disagree
        concept: Choosing the measurement that tells two explanations apart
        place: Planetary Defense Coordination Office
        scene: The best guess misses by four Earth radii, and about one path in six hundred still hits. Next Tuesday the two sets of paths sit eight arcseconds apart. After that they close up again.
        guide: >-
          Four places to point, and a measurement only helps where the answers disagree.
          Ask of each option whether the hitting paths and the missing paths point
          somewhere different there. Before and after Tuesday they agree. Looking then
          confirms what nobody was arguing about. Brightness is not what decides this. A
          date is.

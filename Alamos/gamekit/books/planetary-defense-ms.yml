        assumes:
          - a measurement teaches you something where the possible answers disagree
        takeaway: The best measurement is the one whose result the rival answers would disagree about.
        format: CHOICE
        question: A thin set of paths still hits Earth. Where do you point next week?
        why: A measurement only teaches you something where the rival answers disagree. Here that is one night. On Tuesday the hitting paths and the missing paths sit eight arcseconds apart. Any follow-up telescope can tell those apart. Before and after, both sets predict the same spot. Point then and you confirm what nobody argued about. So the answer here is a date, not a better telescope.
        choices:
          - Where the hitting paths and the missing paths point to different places.
          - Wherever the object is brightest and easiest to measure.
          - At the same patch of sky again, to improve the camera calibration.
          - Nowhere new — run the same measurements through another orbit program.
        answer: Where the hitting paths and the missing paths point to different places.
        rebuttals:
          - The brightest night is the easiest measurement and the least useful one. Every path already agrees about where it will be.
          - Better calibration helps every measurement a little, and tells the two sets apart not at all.
          - Another program checks the arithmetic rather than the sky. Worth doing, and it adds no measurement.
      - group: OPS
        task: Spend the one booking on the observation that changes next week's prediction most.
        title: Why waiting helps
        concept: Repeated measurements and their average
        place: Time Standards Room
        scene: Four hours of spare time on a two-metre telescope, and the object sets soon after dusk. Two possible paths fit tonight's measurements equally well. The same patch of sky comes back in six nights.
        guide: >-
          Four options, and two paths fit tonight equally well. Ask of each what it
          would change about that. A sharper picture tonight measures the same moment
          more precisely. So does a bigger telescope, and so does taking more pictures
          in a row. What tells two paths apart is letting them drift away from each
          other.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - two paths that agree tonight can disagree later
        takeaway: Two paths that agree today drift apart with time, so a later look separates them better than a sharper look now.
        format: CHOICE
        question: Two paths fit tonight equally well. What makes them easier to tell apart?
        answerText: Time. Let both paths run for six nights and they end up in visibly different places.
        why: Two paths through the same point tonight are heading slightly different ways. Tonight they sit on top of each other. No camera can split them, however sharp it is. Six nights later that small difference has become a real gap in the sky. One picture then does what ten pictures tonight cannot. So the booking worth having is the late one. A sharper look at tonight is worth much less than a rougher look later.
        choices:
          - Waiting, and looking again in six nights
          - Taking a sharper picture tonight
          - Taking many pictures tonight in a row
          - Using a bigger telescope tonight
        answer: Waiting, and looking again in six nights
        rebuttals:
          - A sharper picture of tonight still has both paths in the same place.
          - Ten pictures of the same moment is one moment, ten times.
          - A bigger telescope sees fainter, and it cannot see the future.
        call: Say what separates two paths
        setup: Two possible paths fit tonight's measurements equally well.
  - title: How Large Is It?
    objective: Produce a diameter range rather than a single unsupported value.
    briefing: The object’s brightness is known, but size depends strongly on reflectivity. The player must combine brightness, albedo, and thermal evidence to bound diameter.
    stake: "Six days to the pass. Irina Sorokin, the thermal infrared observer, has been waiting on telescope time all week. Everything anybody wants to know depends on the size, and the size rests on how bright the dot looked. Brightness alone allows anything from 120 metres to 600. At the small end this is a city. At the large end it is a country. Today you buy the measurement that breaks the tie."
    takeaway: Use brightness, inverse-square law, albedo, thermal emission, size degeneracy as an evidence chain rather than as isolated facts.
    stops:
      - group: CHAR
        task: Match each change to what it does to the brightness we measure.
        title: What makes it look bright?
        place: Photometry Lab
        scene: The object was bright enough for the survey to spot it, and people across the room are reading that one number as a size. Four things that change brightness are on the board.
        guide: >-
          Four changes, and four things they do to the brightness. Pair them by asking
          where in the journey each one acts. How much sunlight arrives? How much is
          sent back? Or how much of that reaches us? Brightness is all of them together,
          which is why one number cannot give a size.
        background:
          - >-
              Why you match instead of choosing. A response that is right for one situation
              is often nearly right for the next one. Picking from a list lets you take the
              nearly-right answer and never notice. Matching makes you say which situation
              it fits best, and that comparison is the whole point.
          - >-
              How to use the one-each rule. Every response goes somewhere, and nowhere
              twice. So the situations you are sure about are worth more than themselves:
              each one you settle leaves fewer responses for the ones you are not sure
              about. Two lines you trust can decide the other two for you.
          - >-
              Why one wrong line is impossible. If three lines are right, the fourth
              response has nowhere else to go, so it is right too. Being wrong always means
              at least two are wrong at once. If a join feels forced, the mistake is
              probably not in that join — it is in one you already made and stopped
              questioning.
        assumes:
          - light spreads out as it travels, so the same lamp looks fainter from further away
        takeaway: A bright asteroid is not always a big one.
        format: PROTOCOL
        why: Brightness is four things multiplied together, which is why size and surface get tangled. A bigger rock catches more sunlight. A better reflector sends back more of what lands on it. Distance from the Sun sets how much sunlight arrives at all. Distance from us sets how much of what leaves the rock gets here. The same brightness fits a small pale rock nearby or a big dark one far out.
        columns:
          - What changes
          - What that does to the brightness
        rebuttals:
          - A bigger rock catches more sunlight and sends more back. This is the one everybody assumes is the whole story.
          - A shinier surface returns more of what lands on it, at the same size. This is what makes brightness ambiguous.
          - Further from the Sun means less sunlight arrives in the first place.
          - Further from us means what comes back is spread thinner by the time it arrives.
        scenarios:
          - The rock is bigger across.
          - The surface reflects better.
          - The rock is further from the Sun.
        choices:
          - More light comes back, because there is more surface catching sunlight.
          - More of the sunlight landing on it is sent back.
          - Less sunlight arrives to be sent back at all.
        mapping: [0, 1, 2]
      - group: OPS
        task: Work out how the widths compare when two rocks look equally bright.
        title: Same brightness, different size
        concept: "Size and albedo: two explanations for one brightness"
        place: Infrared Telescope Team
        scene: Two rocks look just as bright as each other. One reflects four times as well. The infrared team wants the sizes compared before anybody says a number out loud.
        guide: >-
          Five numbers, and three of them are wrong ways to use the reflectivity. Its
          square. One divided by it. And the brightness itself. Ask of each whether it
          respects the two steps. Four times the reflectivity needs a quarter of the
          area. And width is the square root of area, so a quarter of the area is half
          the width.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is

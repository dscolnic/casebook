            - { name: Shaft rate line, bin: left }
            - { name: Galley extractor, bin: left }
            - { name: Hydraulic ram, bin: left }
            - { name: Air compressor, bin: left }
            - { name: Hull popping, bin: left }
            - { name: Loose deck plate, bin: left }
            - { name: Coolant pump, bin: left }
            - { name: Fan bearing whine, bin: left }
            - { name: Torpedo tube drain, bin: left }
            - { name: Ballast vent, bin: left }
            - { name: Steering gear, bin: left }
            - { name: Distant merchant, bin: right }
            - { name: Whale call, bin: right }
            - { name: Shrimp crackle, bin: right }
            - { name: Trawler winch, bin: right }
            - { name: Surface swell, bin: right }
            - { name: Surface rain, bin: right }
            - { name: Ice cracking, bin: right }
            - { name: Seismic airgun, bin: right }
            - { name: Echo sounder, bin: right }
            - { name: Ferry propeller, bin: right }
            - { name: Cable thruster, bin: right }
            - { name: Dolphin whistles, bin: right }
            - { name: Standby vessel, bin: right }
            - { name: Buoy chain rattle, bin: right }
          commit: Start the line
  - title: Uncontrolled Depth Change
    objective: Tell a symptom from a cause when the boat is going somewhere you did not order.
    briefing: |-
      The boat is heavier than it was an hour ago and it is going down. The depth gauge, the trim state and the planes all have something to say and only one of them is the cause.
    stake: Twelfth day, middle watch. The boat is going deeper with the planes already at rise, the trim shows heavy forward, speed is unchanged, and the depth gauge is the calmest instrument in the control room. Ferro is on his way forward without being asked, which tells you what he thinks it is. This watch you decide what is actually causing it, work out how much weight is aboard, and choose which control to use — knowing two of the four are hard to undo at this depth. Treat the symptom and the boat keeps going down while everybody watches the right gauge for the wrong reason.
    takeaway: Depth is the outcome of weight, angle and speed, and each of those has its own cause.
    stops:
      - group: NAV
        task: Which cause accounts for every reading?
        title: Three gauges, one problem
        place: Control Room
        scene: The depth needle is still moving deeper even though the planes are already at rise. Trim shows the boat heavy forward, speed has not changed, and the aft depth gauge disagrees with control by four metres. The next depth report is due now.
        guide: >-
          Three gauges disagree and one cause has to cover all of them. The planes are
          already at rise. The trim is heavy forward. Four metres separate the two depth
          gauges. Ask of each option how many of those it explains. A gauge fault
          explains one. Neither depth reading is truth while they disagree, so the
          answer has to separate what is real from what is indication.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a submarine holds depth by buoyancy and by the planes together
        takeaway: The instrument that disagrees is a candidate, not automatically the culprit.
        format: CHOICE
        why: A depth change can come from real vertical motion, a bad indication, or both. The planes already at rise say the control system is trying to oppose the descent. Heavy-forward trim is independent evidence that extra weight or lost buoyancy may be forward. The two depth gauges disagree, so neither should be treated as unquestioned truth. The readings together point to a real trim problem plus an indication problem. Command needs an independent depth check while the weight source is investigated.
        rebuttals:
          - A faulty gauge explains one reading and leaves the boat heavy and bow-down for no reason. The disagreement is what a bow-down boat produces.
          - Trim water moved inside the boat would show in the tank levels, and they are unchanged. Weight has been added, not shifted.
          - A planes-control failure gives an angle without added weight, and it would not put water in the forward bilge.
          - Less flow over the planes would reduce lift, and speed is unchanged at eight knots.
        headline: The boat is going deeper with the planes at rise, and the two depth gauges disagree.
        readings:
          - zone: Depth
            label: Control gauge
            value: 94 m, increasing
            status: alarm
          - zone: Depth
            label: After gauge
            value: 98 m, increasing
            status: alarm
          - zone: Trim
            label: Bubble
            value: 1.2° bow down
            status: alarm
          - zone: Trim
            label: Trim tank levels
            value: unchanged
            status: normal
          - zone: Plant
            label: Speed
            value: 8 kn, unchanged
            status: normal
          - zone: DC
            label: Forward bilge
            value: wet, level unread
            status: high
        choices:
          - label: Water coming aboard forward
            mechanism: Weight added at the bow explains the trim, the depth and the wet bilge, and the gauges disagree because they are at different depths in a boat that is down by the bow.
          - label: A depth-gauge fault
            mechanism: One instrument reading wrong, which would not make the boat heavy or bow-down.
          - label: Trim water transferred aft by mistake
            mechanism: Weight moved inside the boat, which the tank levels would show.
          - label: A planes-control failure
            mechanism: Control surfaces not doing what is ordered, which would show as an angle without added weight.
          - label: Speed loss reducing lift
            mechanism: Less flow over the planes, which the unchanged speed rules out.
        answer: Water coming aboard forward
      - group: DC
        task: Work out the work the air has to do
        title: What the blow has to push against
        place: Forward Equipment & Handling
        relationship: >-
          W = PΔV: the work done by the gas expanding against sea pressure, with the pressure taken
          from P = P₀ + ρgh at the blow depth.
        scene: The boat is 1.6 cubic metres heavy and 90 metres down. Blowing the forward group will push that water out through the flood ports, and Yorke wants to know what the air bottles are being asked to spend before she opens a valve.
        guide: >-
          Air blown into a ballast tank does not simply appear there. It has to push seawater out
          against whatever the sea is pressing back with at that depth, and pushing against a
          pressure through a volume is work. Take the sea pressure at the blow depth — the surface
          atmosphere plus the water above you — and multiply it by the volume of water being
          displaced. That product is what the bottles have to deliver.
        background:
          - >-
              Why the depth is the expensive term. The pressure at ninety metres is roughly ten
              atmospheres, so displacing the same volume costs about ten times what it costs alongside.
              A boat that surfaces from deep spends a large fraction of its high-pressure air doing it,
              which is why blowing deep is a decision and not a reflex.
          - >-
              What the work does not include. This is the work against sea pressure alone. The air also
              cools as it expands out of the bottles, and some of the energy goes into the water it
              stirs. Both are real and both are small beside the pressure-volume term, which is what
              makes that term the one to estimate first.
          - >-
              Why it matters that this is a one-way spend. Air blown into a tank at depth is gone: it
              vents on the way up as the outside pressure falls, and the only way to get it back is a
              compressor running at the surface. So the number is not a rate, it is a budget, and every
              blow comes out of the same bottles the escape trunk needs.
        assumes:
          - the blow displaces seawater at constant sea pressure
        takeaway: Pushing water out against sea pressure is work, and the depth sets the price.
        format: BALLPARK
        concept: 'The first law: internal energy, heat in, and work done by an expanding gas'
        question: Estimate the work the blow has to do against sea pressure.
        estimate:
          prompt: The boat is 1.6 m³ heavy at 90 metres. Yorke wants the work the air has to do to put that volume back over the side.
          question: Estimate the work the blow has to do against sea pressure.
          labels:
            - 1.01e6 Pa  (P, sea pressure at 90 m)
            - 1.6 m³  (ΔV, the water displaced)
            - 1.01e5 Pa  (surface pressure alone)
            - 1025 kg/m³  (density of seawater)
          values: [1010000, 1.6, 101000, 1025]
          slots: 2
          template: '{0} × {1}'
          formula: a*b
          correct: [0, 1]
          target: 1616000
          tolerance: 150000
          units: J
          solution: W = PΔV = 1.01e6 × 1.6 ≈ 1.6 MJ.
          explanation: About 1.6 megajoules — ten times what the same blow would cost alongside.
        answerText: About 1.6 megajoules, which is roughly ten times the same blow at the surface.
        why: >
          Work done by a gas expanding against a pressure is that pressure times the change in volume,
          and here the pressure is not the boat's, it is the sea's at the depth the flood ports are at.
          Ninety metres of seawater is about nine atmospheres on top of the one already there, so the
          sea is pushing back with about ten times what it pushes back with alongside — and the same
          1.6 cubic metres costs ten times as much air to shift. Using the surface figure gives 160
          kilojoules and a blow that appears almost free, which is the error that empties a bottle
          group on the way up. It also explains why the boat prefers to drive itself shallow on the
          planes first and blow late: every metre of depth taken off before the valve opens comes
          straight off the price.
      - group: ENG
        task: Predict the induced voltage, then measure it
        title: What each control actually does
        takesAsRead:
          - The magnetic field of a current, and the field around a bus bar
        place: Machinery Control Room
        relationship: >-
          ε = −ΔΦ / Δt: Faraday's law — the induced voltage is the rate of change of magnetic flux
          through the coil.
        scene: The main motor is being driven by the shaft rather than driving it, and Okonkwo wants to know what the field is making before the breaker is closed. Flux through the armature falls from 0.42 to 0.06 webers in 0.9 seconds as the boat coasts down.
        guide: >-
          A voltage appears across a coil only while the flux through it is changing, and its size is
          how fast that change happens — not how big the flux is. Predict the volts from the change and
          the time it takes, lock that in, then close the meter onto the armature and see what the
          machine is actually producing. A prediction made after the reading is not a prediction.
        background:
          - >-
              Why the rate and not the amount. A coil sitting in a huge steady field has no voltage
              across it at all. Halving the time the same change takes doubles the voltage, which is why
              a machine slowing quickly is more dangerous than one that has been spinning for an hour.
          - >-
              What the minus sign is for. The induced voltage opposes the change that made it, which
              is why a generator resists being turned and why a motor being driven fights back. On a
              boat coasting down that opposition is a braking torque on the shaft, and it is why the
              turn count falls faster once the breaker closes.
          - >-
              Why this is a measurement and not a calculation. The flux figures come from the machine's
              own curves at a nominal field current, and the field on this motor has been in service for
              nine years. Predicting and then measuring is what tells you whether the curves still
              describe the machine.
        assumes:
          - the flux through the armature can be treated as changing at a steady rate
        takeaway: A voltage appears only while flux is changing, and its size is how fast.
        format: VERIFY
        concept: "Magnetic flux and Faraday's law: a changing flux makes a voltage"
        question: Predict the voltage the coasting machine induces, then measure it.
        verify:
          hint: >-
            Lock the prediction before the meter goes on. Faraday's law needs the change in flux and
            the time it takes, and both are on the slate.
          prediction: { label: Predicted induced voltage, unit: V, min: 0, max: 90, step: 0.5 }
          truth: 40
          passRatio: [0.7, 1.4]
          intervention:
            label: Meter across the open armature
            note: Breaker still open, shaft turning on the boat's way through the water.
            outcome: Meter on, breaker left open. The machine is generating into nothing.
          measurement:
            label: Measured armature voltage
            note: Reads 38 volts and falling as the shaft slows.
            cost: 1
            costUnit: readings
          unmeasuredMoral: >-
            A predicted voltage nobody metered is a statement about the machine's nine-year-old field
            curves. Closing a breaker onto it is a statement about the machine.
          commit: Report the armature voltage
        answerText: >-
          About 40 volts — a flux change of 0.36 webers in 0.9 seconds — and the meter reading of 38
          is what says the field is still behaving as its curves claim.
        why: >
          Faraday's law is about a rate, and the trap is that the flux itself looks like the important
          number. It is not: 0.42 webers standing still induces nothing at all, and the 0.36-weber
          change over 0.9 seconds is the whole of the answer. That also settles what the controls do.
          Closing the breaker onto a machine already generating 38 volts loads it, and a loaded
          generator opposes the motion driving it — so the same action that charges the battery also
          brakes the shaft, which is the one effect the panel does not label. The measurement matters
          because the prediction rests on field curves from a machine that has been in service nine
          years, and the two agreeing is the evidence that everything else built on those curves is
          still safe to trust.
      - group: ENG
        task: Hold the trim while the boat works.
        title: Ordered depth, while the boat changes weight
        place: Engine Room
        scene: The boat has to hold sixty metres while the galley pumps out, the torpedo tubes are flooded for a drill, and the sea gets colder over the shelf. The trim pump is what answers all of it.
        guide: >-
          Hold the boat at ordered depth, inside the band on the gauge. The band narrows as
          the passage goes on, because a boat under a layer has less room to wander than one
          in open water. The trim pump moves water between tanks and the sea, and every
          change in the boat's weight keeps pushing until you answer it.
        background:
          - >-
              Why a boat drifts off depth at all. A submarine at ordered depth is balanced: the weight
              of the boat against the weight of the water it displaces. Pump a tonne of galley waste
              over the side and the boat is a tonne light, so it rises — and goes on rising.
          - >-
              Why the sea itself moves you. Colder, saltier water is denser, so the same boat
              displaces more weight in it and floats up. Crossing a front is a change in the water
              rather than in the boat, and it feels identical on the gauge.
          - >-
              Why the pump has to be set rather than tapped. Every one of these is a step in the
              rate. A boat a tonne light does not rise by two metres and stop; it keeps rising until
              the trim is put back, which is why the answer is a new pump setting held for a while.
        assumes:
          - a submarine is balanced between its weight and the water it displaces
        takeaway: A boat that has changed weight is not a boat that has changed depth once.
        format: HOLD
        question: Hold sixty metres while the boat's weight and the water both change.
        answerText: Inside the band for most of the passage, with the trim pump set to answer each change in weight rather than tapped after the depth has already gone.
        why: >-
          A submarine at ordered depth is a balance between what it weighs and what it
          displaces, and everything in this passage disturbs one side of that. Pumping the
          galley over the side makes the boat lighter, so it rises and keeps rising. Flooding
          the tubes makes it heavier, so it sinks and keeps sinking. Crossing onto the shelf
          changes neither: the water gets denser, the same hull displaces more weight, and the
          boat floats up exactly as though somebody had pumped. All three are steps in the rate
          rather than steps in the depth, which is why the trim pump is set to a new rate and
          held rather than tapped and released. The band narrowing is the other half — under a
          layer, holding depth is what keeps the boat quiet and keeps the sonar picture usable,
          so the same skill has to be exercised more tightly exactly where it is hardest.
        hold:
          quantity: Depth off ordered depth
          unit: m
          control: Trim pump
          hold: 60
          band: 0.4
          narrowTo: 0.2
          duration: 45
          direction: lower
          authority: 0.1
          pass: 0.8
          hint: Each change in weight keeps pushing. Set the pump to answer the change, not the gauge.
          disturbances:
            - { label: Galley pumps out over the side, at: 4, amount: -0.03 }
            - { label: Tubes flooded for the drill, at: 20, amount: 0.05 }
            - { label: Colder water over the shelf, at: 38, amount: -0.045 }
          commit: Report the passage
  - title: The Cooling Path
    objective: Trace one cooling path end to end and find where it stopped.
    briefing: |-
      Lube oil temperature is rising on the main bearing and nothing has changed on the throttle. Somewhere between the sea and that bearing there is a chain of things that carry heat away, and one of them is not.
    stake: "Thirteenth day, and this one was bought two watches ago. A main bearing is running hot: the oil is hot, the fresh water loop is hot, and the seawater leaving the heat exchanger is barely warmer than the seawater going in. The second cooling pump is still secured from the quiet lineup Rask asked for, and its breaker is open at the switchboard with nothing in the log. This watch you write the cooling path down in order and decide which link stopped handing the heat on. A bearing run hot for an hour is a bearing replaced in a shipyard."
    takeaway: A cooling system is a chain, and a chain is diagnosed link by link.
    stops:
      - group: ENG
        task: Build the heat path in order, then name the link that governs how fast heat can leave the boat.
        title: From the sea to the bearing
        concept: 'Heat transfer rates: conduction through a wall, and what a warm surface is losing'
        place: Propulsion Machinery
        scene: "The bearing is running warm at its usual load. Haruki puts the cooling diagram on the table before anyone touches a valve: bearing, lube oil, oil cooler, fresh-water loop, seawater cooler, and overboard discharge. One link is failing."
        guide: >-
          Put the six stages in the order the heat actually travels, from the bearing
          out to the sea. Then read what each handover is doing and name the one that is
          limiting the chain. The bearing is hottest because it is where the heat is
          made; that would be true even if everything downstream were perfect.
        background:
          - >-
              What each handover is. The bearing makes heat. Lube oil carries it away. The
              oil cooler hands it to the fresh-water loop, the seawater cooler hands that to
              seawater, and the discharge carries it overboard. Every one of those has to
              pass on as much as arrives, or heat backs up behind it.
          - >-
              How to find the limiting one. Compare what each stage is receiving against
              what it is passing on. The stage that has fallen behind — a fouled cooler, a
              throttled valve, a low flow — is the one setting the temperature everywhere
              upstream of it.
          - >-
              Why the diagram comes out before anybody touches a valve. Changing a flow in
              the middle of a chain moves the symptom without fixing the cause, and on a
              submarine an unnecessary valve movement is also a noise transient.
        assumes:
          - heat must be transferred through every required link before it can leave the boat
          - a hot component is not automatically the failed link
        takeaway: A transfer chain is limited by the weakest required handoff, not necessarily by the hottest or largest component.
        format: CHAIN
        question: Where does the heat travel, and which required transfer is limiting the chain?
        chain:
          hint: Put the heat handoffs in physical order. Then inspect the link readings and choose the required transfer that limits the whole path.
          links:
            - id: bearing
              label: Bearing
              transfers: creates heat into lube oil
              reading: load normal; temperature rising
            - id: lube
              label: Lube-oil flow
              transfers: carries heat from bearing to oil cooler
              reading: flow 100% reference
            - id: oil_cooler
              label: Oil cooler
              transfers: moves heat from oil to fresh water
              reading: fresh-water side warms normally
            - id: fresh_loop
              label: Fresh-water loop
              transfers: carries heat to seawater cooler
              reading: flow 98% reference
            - id: sea_flow
              label: Seawater through cooler
              transfers: carries heat across hull cooling stage
              reading: flow 45% reference
            - id: overboard
              label: Overboard discharge
              transfers: carries rejected heat into the sea
              reading: outlet present
          distractor: bearing
          order:
            - bearing
            - lube
            - oil_cooler
            - fresh_loop
            - sea_flow
            - overboard
          governing: sea_flow
        answerText: Bearing → lube oil → oil cooler → fresh-water loop → seawater cooler → overboard. The governing weak link is the seawater-flow stage, not the hot bearing itself.
        why: The bearing creates heat, but that does not make the bearing the failed link. Heat must move into the lube oil, across the oil cooler, through the fresh-water loop, across the seawater cooler, and finally overboard. If any required handoff is weak, everything upstream gets hotter. The current readings show normal bearing load and normal oil-side flow, but reduced seawater flow. That makes the final rejection path the governing link. Writing the chain first prevents the hottest component from being mistaken for the cause.
      - group: ENG
        task: Choose the fix that survives the fouling nobody measured
        title: One link is not handing the heat on
        place: Machinery Control Room
        relationship: >-
          Q/t = kA·ΔT/L: the rate heat conducts through a wall, so a fouling layer of unknown
          thickness sits in the denominator of everything on this board.
        scene: The reduction-gear bearing is running warm and the cooler's seawater side is cold, so the heat is not crossing. Nobody has measured the fouling on the plate. Okonkwo has four fixes ranked at one assumed thickness and the range that thickness actually came with.
        guide: >-
          Conduction through a wall goes as conductivity times area times temperature difference,
          divided by thickness — and fouling adds thickness of a material with a hundredth of the
          plate's conductivity. So the fouling layer is the term the whole board rests on, and nobody
          has measured it. Move the assumed thickness across its range before you choose, and watch
          which options stop being possible at all rather than merely getting slower.
        background:
          - >-
              Why the fouling dominates. The plate is four millimetres of steel at 45 watts per metre
              per kelvin. A film of biological fouling is a fraction of a millimetre at about 0.6. Put
              both in the same relation and the thin layer carries most of the temperature drop, which is
              why a cooler can lose most of its capacity to something you could wipe off with a thumb.
          - >-
              Why the nominal ranking is not the answer. Every option was scored at one assumed
              transfer, and the fastest of them is fastest only there. An option needing more transfer
              than the fouled plate can give does not merely take longer. It never completes, and the
              bearing goes on heating while it is attempted.
          - >-
              What the cold outlet is telling you. That heat is not arriving. A working cooler has a
              warm outlet, because a temperature difference driving heat across is the whole mechanism.
              A cold seawater side reads like good cooling and is the opposite.
        assumes:
          - the fouling layer can be treated as a uniform wall in series with the plate
        takeaway: Heat crosses a wall inversely to thickness, so a thin layer of poor conductor decides everything.
        format: STRESS
        concept: 'Heat transfer rates: conduction through a wall, and what a warm surface is losing'
        question: Move the transfer the fouled plate can still pass through its range, then choose a fix.
        stress:
          hint: >-
            Nobody measured the fouling, so what the cooler can still pass has a range rather than a
            value. Move it across the whole range before you choose, and watch which options stop
            being possible.
          assumption:
            label: Heat the fouled cooler can still pass
            unit: kW
            min: 11
            max: 90
            nominal: 45
            step: 1
          criteria:
            - { key: hours, label: Time to restore transfer, unit: h }
            - { key: risk, label: Chance of a repeat this patrol, unit: '%' }
            - { key: air, label: High-pressure air spent, unit: m3 }
          candidates:
            - { id: flow, label: Raise seawater flow and hold the load }
            - { id: backflush, label: Backflush the seawater side at pressure }
            - { id: strip, label: Open the cooler and strip the plate }
            - { id: shift, label: Shift the load to the standby cooler }
          scores:
            flow: { hours: 1, risk: 62, air: 0 }
            backflush: { hours: 3, risk: 34, air: 2 }
            strip: { hours: 9, risk: 6, air: 0 }
            shift: { hours: 2, risk: 18, air: 4 }
          # The transfer each option needs the fouled plate to be still passing for
          # it to work at all. Raising flow only widens the temperature difference
          # across a plate that is already the restriction, so it needs the most.
          feasible:
            flow: 38
            backflush: 24
            shift: 19
            strip: 10
          robust: strip
          optimiseOn: hours
          moral: >-
            Every option here was ranked at one assumed transfer. Only one of them is still possible
            at the bad end of a range nobody measured.
          commit: Commit the fix
        answerText: >-
          Open the cooler and strip the plate. It is the slowest fix at nine hours and the only one
          that still works if the fouling is at the thick end of a range nobody has measured.
        why: >
          Conduction goes as conductivity times area times temperature difference, over thickness. The
          plate could pass nearly seven hundred kilowatts and the bearing makes twelve, so the metal is
          not the restriction. The fouling is. Raising seawater flow buys a little more temperature
          difference, which is the one term in the relation a watch can move, and it is nowhere near
          enough once the fouled plate is down near ten kilowatts. Backflushing and shifting the load
          both hold up at the assumed transfer and stop being possible before the bad end of the range.
          Stripping the plate is worst on every score at the nominal and is the only fix that works
          whatever the fouling turns out to be. That is the trade the board is for: an option ranked best at one
          assumed value, against an option that is never impossible.
      - group: FIRE
        task: Work out the heat the run is putting into the space
        title: Two hundred and thirty watts in a cable run
        place: Electrical Distribution
        relationship: >-
          P = I²R: the power dissipated as heat in a conductor, which is why doubling the current
          quadruples the heating.
        scene: The bilge pump is off and its breaker is closed, which should not both be true. Yorke finds the run warm to the hand, carrying 46 amps through a cable rated for 30, and wants the heat it is putting into the space.
        guide: >-
          A conductor carrying current heats, and the heating goes as the square of that current — so
          a cable at 46 amps is not fifty per cent worse than the same cable at 30, it is more than
          twice as bad. Multiply the square of the current by the resistance of the run to get the
          watts going into the cable. Then compare it with what the same cable does at its rating.
        background:
          - >-
              Why the square is the whole story. Doubling the current doubles the volts dropped along
              the run and doubles the current carrying them, and power is the product of the two. That is
              why cable ratings are hard limits rather than guidance: fifty per cent over rating is more
              than double the heat, and the insulation does not know what the rating was.
          - >-
              Where the heat goes in a sealed space. Nowhere. A boat's compartments are closed volumes
              with a fixed amount of air, so a couple of hundred watts of cable is a couple of hundred
              watts the atmosphere plant has to shift on top of everything else. Alongside it would
              simply warm a wall.
          - >-
              Why the pump being off is the alarming half. A closed breaker with no load means the
              current is going somewhere other than the pump, and 46 amps is well above what the pump
              draws. That is the signature of a fault path to earth or between phases, which is exactly
              the situation the insulation readings were tracking earlier in the week.
        assumes:
          - the whole run can be treated as one resistance
        takeaway: Heating in a conductor goes as the square of the current, so fifty per cent over rating is double the heat.
        format: BALLPARK
        concept: 'Power in a circuit, and I²R as the heat a fault puts somewhere'
        question: Estimate the power the run is dissipating.
        estimate:
          prompt: Yorke has 46 amps in a cable rated 30, and 0.11 ohms of run. She wants the watts going into the space.
          question: Estimate the power the run is dissipating.
          labels:
            - 46 A  (I, the measured current)
            - 0.11 Ω  (R, resistance of the run)
            - 30 A  (the cable's rating)
            - 300 V  (the bus voltage)
          values: [46, 0.11, 30, 300]
          slots: 2
          template: '{0}² × {1}'
          formula: a*a*b
          correct: [0, 1]
          target: 233
          tolerance: 25
          units: W
          solution: P = I²R = 46² × 0.11 ≈ 233 W.
          explanation: 233 watts into a sealed compartment, against 99 watts if the same cable were at its 30-amp rating.
        answerText: About 233 watts — where the same run at its 30-amp rating would put out 99.
        why: >
          Power dissipated in a conductor is the current squared times the resistance, and the square is
          what makes an overload dangerous rather than merely untidy. Fifty-three per cent over rating
          is 2.4 times the heat, all of it going into a sealed compartment where there is nowhere for it
          to go but the air the atmosphere plant is already struggling with. Using the bus voltage
          instead — 46 amps at 300 volts — gives nearly fourteen kilowatts, which is the power the load
          would be drawing if there were a load; the cable only dissipates what its own resistance
          takes. And the pump being off while 46 amps flows is the part that decides the action: the
          current is not going through the pump, so it is going somewhere nobody has drawn.
  - title: Silent-Running Configuration
    objective: Decide what may be secured, reduced or rescheduled while keeping the boat alive.
    briefing: |-
      The boat has to be quiet for four hours. Everything aboard that makes noise also does something, and the ones that keep people breathing and bearings cool are not on the table.
    stake: Fifteenth day, and the argument that has been running all patrol comes due. Four hours of quiet running, and Haruki intends to secure everything on Rask's list to get it — including the second seawater pump and half the carbon dioxide scrubbing. Lindqvist has done the arithmetic on the second one and is not happy. This watch you decide what may be shut down, what may only be slowed, and what the whole configuration costs the boat. Quiet is bought with capability, and the bill arrives late, in another department. None of that appears on the same gauge as the decision.
    takeaway: A silent lineup is a set of deadlines, not a set of switches.
    stops:
      - group: ENG
        task: Stress the plan by shrinking the time margin left before the six-hour passage ceiling, then choose the lineup that still works.
        title: Four hours of quiet
        concept: 'Intensity, the inverse-square law and the decibel'
        place: Machinery Control Room
        scene: 2 narrowband components sit at 147 and 150 hertz on the same bearing. In seawater the sound speed is about 1500 metres per second. The audio level swells and fades regularly while both spectral lines themselves remain steady.
        guide: >-
          Move the two-hour schedule margin down to zero and watch which lineups go
          dark. A lineup that works only with margin in hand is not a lineup. Sound
          speed in seawater is about 1500 metres a second, and both lines stay steady
          while the level swells and fades — those are the facts the surviving plan has
          to be consistent with.
        background:
          - >-
              What the swelling and fading is. Two steady tones close in frequency add and
              cancel as they drift in and out of phase, at a rate set by their difference —
              three hertz here, so a swell every third of a second. It sounds like a machine
              changing load and it is two machines that are not.
          - >-
              Why the margin is the thing to stress. A schedule with two hours spare hides a
              lot: a slow transit, a delayed evolution, a repair that runs long. Testing at
              zero is what separates plans that work from plans that have been lucky.
          - >-
              Why sound speed appears in a scheduling problem. It sets how long the boat is
              detectable at a given range as the geometry changes, so the acoustic
              constraint and the timetable are the same constraint written twice.
        assumes:
          - a robust plan is tested at the pessimistic end of a stated uncertainty
          - quieting measures can trade acoustic benefit against equipment endurance
        takeaway: A robust choice still works when the margin you thought you had disappears.
        format: STRESS
        question: Which lineup survives when the two-hour schedule margin falls all the way to zero?
        stress:
          hint: The slider is time margin, not transit duration. Move it from two hours to zero. A lineup must remain feasible and still meet the 7 dB noise-reduction requirement.
          assumption:
            id: margin
            label: Time margin before the six-hour passage ceiling
            nominal: 2
            min: 0
            max: 2
            unit: h
            step: 0.05
          criteria:
            - id: quiet
              label: Radiated-noise reduction (needs ≥ 7 dB)
              operator: ">="
              target: 7
              unit: dB
              key: quiet
            - id: endurance
              label: Equipment endurance at the nominal transit
              operator: ">="
              target: 4
              unit: h
              key: endurance
          candidates:
            - id: max
              label: Maximum Quiet
            - id: balanced
              label: Balanced Quiet
            - id: conservative
              label: Conservative — 5 dB, short of the requirement
          robust: balanced
          optimiseOn: quiet
          feasible:
            max: 1
            balanced: 0
            conservative: 3
          scores:
            max:
              quiet: 12
              endurance: 5
            balanced:
              quiet: 8
              endurance: 8
            conservative:
              quiet: 5
              endurance: 20
        answerText: Balanced Quiet. It still meets the 7 dB acoustic requirement when the passage reaches 6 hours and the schedule margin is gone.
        why: A four-hour transit leaves two hours before the six-hour planning ceiling. Maximum Quiet looks best there because it cuts noise by 12 dB. But its equipment clock lasts only five hours, so it needs at least one hour of schedule margin. Balanced Quiet reaches the 7 dB requirement and lasts 8 hours, so it still works with no margin left. Conservative lasts, but is too loud. Moving the margin changes the winner because uncertainty belongs inside the decision.
      - group: ATMO
        task: Put a deadline on the quiet
        title: How long one scrubber lasts
        concept: 'Atomic energy levels and ionisation, and what a mass spectrum is a list of'
        place: Auxiliary Machinery & Bilge
        scene: With one scrubber train secured, the remaining train removes less carbon dioxide than the crew produces. Lindqvist wants the number of hours before the boat has to make a noise to fix that.
        guide: >-
          Four numbers. One is the length of the transit, which the answer is compared
          against rather than built from. Two are rates that point in opposite
          directions. Ask of each whether it adds carbon dioxide, removes it, or
          measures the room left. A net rate is the difference between two of these. A
          deadline in hours is what command can plan around.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - a net rate is what is produced minus what is removed
        takeaway: A slow problem with a known rate is a deadline, and a deadline can be planned around.
        format: BALLPARK
        question: How long can the boat run on one scrubber train?
        why: A closed atmosphere with a production rate and a removal rate has a net rate. Compare that net rate with the remaining headroom to get a deadline. Here the crew produces 1.4 cubic metres per hour while 1 train removes 1.1. The net rise is 0.3 cubic metres per hour. 6 cubic metres of headroom therefore lasts about 20 hours. Command can plan around 20 hours. It cannot plan around “soon,” which is why a slow problem becomes useful once its rate is known.
        estimate:
          relationship: Time = the headroom left ÷ the net rate of gain, which is production minus removal.
          prompt: The crew makes more carbon dioxide than one train removes, and the limit is a rise of 1%.
          question: Estimate how long until the boat reaches the limit.
          labels:
            - 1.4 m³/h  (crew production)
            - 1.1 m³/h  (1 train removes)
            - 6.0 m³  (a 1% rise, boat-wide)
            - 4 h  (the transit)
          values: [1.4, 1.1, 6, 4]
          slots: 3
          template: "{2} ÷ ({0} − {1})"
          formula: c/(a-b)
          correct: [0, 1, 2]
          target: 20
          tolerance: 2
          units: hours
          solution: The net gain is 0.3 m³/h; 6.0 ÷ 0.3 = 20 hours to the limit.
          explanation: 20 hours against a four-hour transit is a comfortable margin, and knowing it is what makes securing the train a decision rather than a gamble. Had the answer been three hours, the same action would have been reckless.
      - group: SONAR
        task: Work out where the periscope forms its image
        title: Where the horizon comes to focus
        place: Sonar Shack
        relationship: >-
          1/f = 1/dₒ + 1/dᵢ: the thin-lens relation, with the objective's focal length fixing the
          image distance for an object at range.
        scene: The night channel on the search periscope is being set up for the dark hours. Hoyt has the objective's focal length and the range to the horizon, and the eyepiece has to be positioned for where the image will actually form.
        guide: >-
          A lens forms an image at a distance set by its focal length and the distance to the object.
          For anything at a serious range the object distance is enormous compared with the focal
          length, and the image falls almost exactly at the focal point — which is what the eyepiece
          has to be looking at. Work it out for the horizon and see how far from the focal length the
          answer actually sits.
        background:
          - >-
              Why the answer is so close to the focal length. The thin-lens relation puts one over the
              image distance equal to one over the focal length minus one over the object distance, and
              at 8000 metres that second term is minuscule. So the image sits a fraction of a millimetre
              beyond the focal point, and a periscope focused at infinity is focused on everything that
              matters.
          - >-
              What that buys a periscope watch. The head can be raised, swept and lowered without
              refocusing, because everything outside a few hundred metres images in the same place. A
              periscope exposure is counted in seconds, and any adjustment that has to happen while the
              head is up is an adjustment that will not happen.
          - >-
              Why the near case is the interesting one. An object at ten times the focal length images
              at about eleven ninths of it, which is far enough out to matter — and that is the case
              where the head is looking at something alongside. This is why the eyepiece has a focus at
              all, and why it lives at the bottom rather than up in the head.
        assumes:
          - the objective can be treated as a single thin lens
        takeaway: For a distant object the image forms essentially at the focal point, which is why a periscope stays focused.
        format: BALLPARK
        concept: 'Thin lenses: where the image forms, and how big it is'
        question: Estimate where the objective forms the image of the horizon.
        estimate:
          prompt: Hoyt is setting the night channel. The objective is 0.42 m focal length and the horizon is 8000 m off.
          question: Estimate where the objective forms the image of the horizon.
          labels:
            - 0.42 m  (f, the objective)
            - 8000 m  (dₒ, range to the horizon)
            - 1.33  (refractive index of seawater)
            - 0.018 m  (the eyepiece focal length)
          values: [0.42, 8000, 1.33, 0.018]
          slots: 2
          template: '1 ÷ (1 ÷ {0} − 1 ÷ {1})'
          formula: 1/(1/a-1/b)
          correct: [0, 1]
          target: 0.42002
          tolerance: 0.005
          units: m
          solution: 1/dᵢ = 1/0.42 − 1/8000, so dᵢ ≈ 0.4200 m.
          explanation: Twenty microns beyond the focal point — which is why a periscope set at infinity needs no adjustment while it is up.
        answerText: Essentially at the focal length, 0.420 metres — about twenty microns beyond it.
        why: >
          The thin-lens relation says the image distance follows from the focal length and the object
          distance, and at eight kilometres the object term contributes about one part in twenty
          thousand. So the image forms at the focal point for anything at range, which is the fact the
          whole instrument is built on: a head that needs no refocusing can be up for four seconds
          instead of thirty. What silence buys, term by term, is exactly that — every adjustment
          removed from the time the head is exposed. The near case is where it stops being true, and an
          object a few metres off images far enough out that the eyepiece focus earns its keep; that is
          also the only case where a periscope watch has to think about the lens at all.
      - group: NAV
        task: Work the contact board while the standing order changes.
        title: What the picture is for tonight
        place: Control Room
        scene: Contacts come onto the board through the watch. The officer of the watch holds one standing order about which of them matter, and rewrites it as the passage changes — after the fishing fleet, after the range closes, after the boat goes quiet.
        guide: >-
          Hold the contacts the standing order currently wants and let the rest go. The order
          is changed during the watch and nobody announces it. What is scored is the contacts
          either side of a change, because they are the only ones that show whether the plot
          is being kept to tonight's order or to the last one.
        background:
          - >-
              Why a standing order changes. In open water the plot is about anything that could close
              the boat. Through a fishing fleet it is about anything under way rather than drifting.
              Once the boat is rigged for quiet it is about anything that could hear us, which is a
              different list again.
          - >-
              Why the changeover is where a plot goes wrong. A team holding to the old order for ten
              more minutes drops the contacts the new order was written to keep, and a contact
              dropped from the plot leaves nothing behind to say it was ever there.
        assumes:
          - a watch works to a stated order about which contacts are held
        takeaway: The cost of a withdrawn instruction is paid by whoever is still working to it.
        format: SPOT
        question: Hold the contacts tonight's order wants, and keep watching the order.
        answerText: Read the order rather than the board. Every rewrite leaves a few minutes in which the old order still feels like the right one.
        why: >-
          Three orders run across the watch and each wants a different part of the board.
          Anything closing, then anything under way, then anything with active sonar. A contact
          can answer two at once, which is what makes the switch cost real. The panel scores
          the window either side of each change, because most of what is on the board is wanted
          by neither order and is correctly let go by somebody who has read nothing. The
          control room's own version is the ten minutes after the boat is rigged for quiet: the
          order has changed to anything that could hear us, and the plot being maintained is
          still the one that was tracking anything that could hit us.
        spot:
          duration: 40
          switchEvery: 12
          pass: 0.75
          hint: The standing order is on the board, and the officer of the watch rewrites it without calling it out.
          targets:
            - id: t1
              label: Merchant, closing
              tags: [closing]
            - id: t2
              label: Trawler, nets down
              tags: [drifting]
            - id: t3
              label: Warship, active sonar
              tags: [active, underway]
            - id: t4
              label: Trawler, under way
              tags: [underway]
            - id: t5
              label: Fishing boat, drifting
              tags: [drifting]
            - id: t6
              label: Survey ship, closing
              tags: [closing, underway]
            - id: t7
              label: Ferry, active sounder
              tags: [active]
            - id: t8
              label: Buoy, adrift
              tags: [drifting]
          rules:
            - say: Anything closing on us
              want: [closing]
            - say: Anything under way
              want: [underway]
            - say: Anything transmitting
              want: [active]
          commit: Open the board
  - title: Rig for Dive
    objective: Prove the boat is ready before the last patrol, rather than assuming it.
    briefing: |-
      The boat sails in an hour. Every check on the rig-for-dive list exists because somebody once did not do it, and each one proves a different thing.
    stake: Nineteenth day. The boat has been open to the surface since Tuesday for work on the mast and dives at dawn. The switchboard shows two breakers open from that work, the log says one was restored, and every valve on the rig sheet has signatures against it — including one from a man who was ashore that morning. This watch you work out what each checklist line is really asking, close the boat up in the right order, and decide what to do about a record that does not match. This is the cheapest hour of the patrol, and the last one before the sea decides.
    takeaway: A check is a measurement that proves a specific claim, not a box beside a word.
    stops:
      - group: DC
        task: Choose which two signed claims to verify physically before the boat dives.
        title: What the checklist is actually asking
        place: Forward Equipment & Handling
        scene: The rig-for-dive sheet has four signed claims. A hull valve operates; every bilge has a baseline; the drain pump builds pressure; both escape routes are clear. You have time to physically verify only two before the dive.
        guide: >-
          Four signed claims on the rig-for-dive sheet, and time to physically verify
          two. Open each and read what backs it. A signature says somebody took
          responsibility; it does not say anybody operated the valve or walked the
          escape route. Hold what the evidence does not support, and spend the checks
          where being wrong would matter most once the boat is dived.
        background:
          - >-
              Why diving changes the arithmetic. On the surface a wrong claim is an
              inconvenience. Dived, the same claim is a compartment nobody can leave or a
              valve nobody can reach. The consequence of each claim being false is what
              should decide the two checks, not how doubtful each looks.
          - >-
              What a checklist is actually asking. Not 'is this true' but 'has somebody
              confirmed it since the last time it mattered'. Items get signed from memory of
              the last dive, especially the ones that are almost always fine.
          - >-
              Why the escape routes are tempting to skip. They are the claim least likely to
              be false and the most expensive to be wrong about. That tension is the whole
              judgement, and it has no formula.
        assumes:
          - a signature records a claim made earlier
          - a physical verification can fail even when the record is signed
        takeaway: A signed record is evidence about what someone reported; it is not the same thing as the physical condition now.
        format: ATTEST
        question: Where should the two verification checks be spent?
        attest:
          hint: You can open each claim and see what evidence backs it. You have two checks. Spend them where a wrong present condition would matter most and the record does not already have current physical evidence.
          checks: 2
          claims:
            - id: valve
              label: Hull valve operates through full travel
              critical: true
              backed: false
              record: signed last week
              truth: one valve is stiff near shut
              evidence: operate through full travel
            - id: bilge
              label: Every bilge has a starting baseline
              critical: false
              backed: true
              record: levels logged this watch
              truth: baseline is current
              evidence: re-read all bilges
            - id: pump
              label: Drain pump builds discharge pressure
              critical: true
              backed: true
              record: pressure test passed this morning
              truth: pump is serviceable
              evidence: repeat closed-discharge test
            - id: escape
              label: Both escape routes are clear
              critical: true
              backed: false
              record: signed before stores were loaded
              truth: one route is narrowed by stores
              evidence: walk both routes
          correctChecks:
            - valve
            - escape
        answerText: Verify the hull valve through its travel and physically walk both escape routes. The pump pressure test and bilge baseline already have current backing.
        why: A checklist compresses work into claims, but not all claims deserve the same verification effort. The drain pump has a recent pressure test, and the bilge baseline has a current logged reading. The hull valve has only a signature from last week, while the escape route can be blocked by stores after the sheet is signed. Those two conditions can hurt immediately if they are wrong and neither has current physical backing. With only two checks, verify the critical unbacked claims rather than rechecking the best-documented items.
      - group: ATMO
        task: Line up the air before you need it
        title: Dampers before dive
        place: Auxiliary Machinery & Bilge
        scene: The ventilation has been open to the surface all week. Before diving, the boat has to be closed up and the internal air path lined up, and the order of those two things matters.
        guide: >-
          Ask of each card what would be much harder to correct once the hull is sealed.
          A missed damper and a plant that will not start are both cheap to find while
          the surface is still available. A baseline reading is only a baseline if it is
          taken before anything changes. One of these four closes the door, and
          everything it makes difficult it makes difficult for the whole dive.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency: each
              step is here because the one before it has already happened, or has to have.
              One transposed pair falsifies that claim wherever it sits, so partial credit
              would be credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained
              by having nothing before or after them, which usually makes them the two you
              can settle from the scene alone. Pinning them collapses the remaining
              arrangements sharply, and what is left in the middle is where the actual
              judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the
              only one. An order can run on cost, on risk, or on reversibility — every
              observation that leaves the sample as it was, before any that consumes it. On
              those boards a chronological reading finds nothing, because none of the steps
              has to happen at a particular hour.
        assumes:
          - once the hull is sealed, the air aboard is the only air there is
        takeaway: The air path has to be proved before the boat is sealed, not after.
        format: SEQUENCE
        why: The internal air path should be lined up while the surface is still available. First, open the dampers that connect every compartment to the treatment plant. Next, start the scrubber and oxygen plant and prove they run. Then take handheld baseline readings, so later numbers have a trusted comparison. Only after those steps should the boat be shut off from outside air and dive. The order matters because every missed damper or failed plant becomes much harder to correct once the hull is sealed.
        rebuttals:
          - Line up the internal ventilation first. A damper missed now is a compartment outside the loop for weeks.
          - Start the plant and prove it works second, while the hatch is still open and a failure is only an embarrassment.
          - Take the baseline readings third. A number is only high compared with something, and this is that something.
          - Shut off from the surface and dive last. It is the step that makes everything before it permanent.
        cards:
          - Line up the internal ventilation so every compartment reaches the plant.
          - Start the scrubber and oxygen plant and prove they are working.
          - Take a handheld reading in each compartment as a starting baseline.
          - Shut the boat off from the surface and dive.
        order: [0, 1, 2, 3]
      - group: FIRE
        task: Predict how long the bank stays dangerous, then time it
        title: Predict the bleed, then meter the bank
        place: Electrical Distribution
        relationship: >-
          τ = RC: the time constant of a discharge, so the bank falls to about a third of its voltage
          in one τ and is not safe until several have passed.
        scene: The transducer drive cabinet is isolated and the last watch signed it as safe to open. Yorke has the bleed resistor's value and the bank's capacitance in front of her and wants a number before anybody puts a hand in.
        guide: >-
          A capacitor discharging through a resistance does not empty at a steady rate — it falls by
          the same fraction in every equal interval, and the interval is the resistance times the
          capacitance. Predict that time constant, then put a meter on the bank and watch what it is
          actually doing. The isolation is not in question. What is in question is how long after
          isolation the bank is still holding a lethal voltage.
        background:
          - >-
              What one time constant leaves behind. About thirty-seven per cent of the starting
              voltage. Two leaves fourteen per cent, three leaves five, and five leaves under one — so
              the working rule is five time constants, not one, and 2.2 kilovolts is still over a
              hundred volts after three.
          - >-
              Why the bleed resistor is the whole design. Without a deliberate discharge path a bank
              can hold charge for hours, because the only leakage is through the insulation, which is
              built to be as high a resistance as possible. The resistor exists to make the time
              constant a known number instead of an unknown one.
          - >-
              Why a signature is not evidence here. The previous watch signed the cabinet as isolated,
              and it is: the breaker is open and locked. Isolation says no more energy is arriving. It
              says nothing at all about the energy already inside, and those are two different claims
              about the same cabinet.
        assumes:
          - the bank discharges only through its bleed resistor
        takeaway: A discharge falls by the same fraction each time constant, so safe is five of them, not one.
        format: VERIFY
        concept: 'The RC time constant, and why a bank stays dangerous after the switch opens'
        question: Predict the time constant of the bleed path, then meter the bank.
        verify:
          hint: >-
            Lock the prediction before the meter goes on. The time constant is the resistance times the
            capacitance, and both are on the cabinet label.
          prediction: { label: Predicted time constant, unit: s, min: 0, max: 60, step: 0.5 }
          truth: 27
          passRatio: [0.7, 1.4]
          intervention:
            label: Meter across the bank
            note: Cabinet isolated and locked, bleed resistor in circuit, breaker open 4 minutes.
            outcome: Meter on. Reading falling, and not as fast as the log implies anybody assumed.
          measurement:
            label: Measured bank voltage, four minutes after isolation
            note: Reads 220 volts and still falling — about nine time constants would be needed to clear.
            cost: 1
            costUnit: readings
          unmeasuredMoral: >-
            A signature saying the cabinet is isolated and a meter saying the bank is at 220 volts are
            both true. Only one of them is about whether it is safe to put a hand in.
          commit: Report the time constant
        answerText: >-
          About 27 seconds — 150 kilohms across 180 microfarads — so the bank needs well over two
          minutes to be safe, and the meter at four minutes reading 220 volts says the bleed path is
          not doing what the label claims.
        why: >
          The time constant is the resistance times the capacitance and nothing else. 150 kilohms
          across 180 microfarads is 27 seconds. Five of those is a little over two minutes, so the
          cabinet should have been safe long before the watch changed. It is not. That is the finding.
          220 volts at four minutes is far above what a 27-second constant allows. So the real
          discharge path has a much higher resistance than the label claims — a bleed resistor
          open-circuit, or a joint that has never carried current. The isolation is genuine and
          beside the point. It stopped energy arriving. It did nothing about the 436 joules already
          in the bank, which is enough to kill somebody who trusts a signature over a meter.
  - title: Refit Decision
    objective: Choose what to improve before the last patrol, on evidence rather than preference.
    briefing: |-
      There is money and yard time for some of what the boat wants and not all of it. Every proposal has a cost, an uncertain benefit, and an effect on the patrol that follows.
    stake: "Twenty-first day, and the refit list goes off the boat in tomorrow's message window. The yard will fund one item. Haruki wants the cooling pump that has cost him two watches this patrol, Rask wants the mounts that would have prevented the noise line, Lindqvist wants a second scrubber train, and Whitfield wants to know which of them the next patrol is most likely to need. This watch you decide. The evidence is unglamorous: which failures cost real time, which are becoming more frequent, and what each fix would actually remove. Everyone in the room is arguing from what they remember, and nobody has opened the log."
    takeaway: An upgrade is worth what it changes about the decisions you will actually face.
    stops:
      - group: ENG
        task: Spend two yard slots across four refits and make sure the plan answers the patrol’s required capability questions.
        title: What the boat should buy
        place: Machinery Control Room
        scene: The yard can complete two major jobs. Pump isolators cut radiated power by 12 dB. An independent depth sounder adds a separate transducer and power path. Faster scrubber media adds air margin; a larger drain pump raises flood-removal rate. The patrol needs two capabilities most.
        guide: >-
          The yard can do two jobs and four are on the table. Watch the capability list
          rather than the equipment: it shows what the patrol plan can still do under
          the current pair. Every job you buy is a capability you keep and one you have
          given up, and the patrol needs two particular ones most.
        background:
          - >-
              Why 12 dB is not a small number. Radiated acoustic power on a logarithmic
              scale: twelve decibels is a factor of about sixteen in power. That is the
              difference between being detectable at one range and at a quarter of it, which
              changes where the boat can go rather than how comfortable it is.
          - >-
              Why redundancy competes with performance. An independent depth sounder adds
              nothing on a good day and everything on the day the first one fails. Scrubber
              media and a larger drain pump both buy margin in a casualty. Only the patrol
              plan says which of those matters more.
          - >-
              Why two rather than three. A refit window is fixed and the yard is not yours.
              The choice is what makes this a decision, and the third job is not wrong — it
              is the one whose absence the plan can survive.
        assumes:
          - a finite yard slot spent on one refit cannot also be spent on another
          - the patrol has both a stealth requirement and an old-chart navigation risk
        takeaway: A resource plan is a set of questions it can answer and questions it deliberately leaves unanswered.
        format: ALLOCATE
        question: Which two refits make the patrol plan complete?
        allocate:
          hint: Each refit costs one yard slot. The panel shows which patrol questions your current pair can answer. You have only two slots, so a complete plan must deliberately leave some useful improvements undone.
          pool:
            amount: 2
            unit: yard slots
          items:
            - id: isolators
              label: Pump isolators
              cost: 1
            - id: sounder
              label: Independent depth sounder
              cost: 1
            - id: scrubber
              label: Faster scrubber media
              cost: 1
            - id: drain
              label: Larger drain pump
              cost: 1
          answers:
            - required: true
              requires:
                - isolators
              question: Can the boat cut its pump-dominated radiated signature for the constrained passage?
            - required: true
              requires:
                - sounder
              question: Can navigation obtain a depth measurement with an independent sensor and power path?
            - required: false
              requires:
                - scrubber
              question: Can the boat extend an already-long carbon-dioxide margin?
            - required: false
              requires:
                - drain
              question: Can the boat pump a severe flood faster after the source is attacked?
        answerText: Use the two yard slots on pump isolators and the independent depth sounder. Those are the two required mission capabilities; the scrubber and larger drain pump are useful but optional for this patrol.
        why: All four refits improve something, so asking which one is “best” hides the real decision. The patrol must reduce its pump-dominated acoustic signature. It also needs a depth measurement that can fail independently of the existing navigation chain. Faster scrubber media improves a margin that is already long. A larger drain pump helps a casualty in which stopping the source remains the binding action. With two yard slots, the complete plan is therefore pump isolation plus an independent depth sounder. Choosing either optional improvement gives up one required capability.
      - group: SONAR
        task: Use the supplied values, show the governing relationship, and give a sensible rounded result with units and interpretation.
        title: What 12 decibels is worth
        place: Sonar Shack
        scene: The yard quotes a 12 dB reduction in the boat’s radiated acoustic power level from new pump mounts. The wardroom has described that as “about a tenth quieter” and is weighing it against the other refits.
        guide: >-
          Four numbers, and two are two ways of doing the same arithmetic. One counts
          factors of two per three decibels. One works in powers of ten. Either is
          legitimate, and mixing them is not. Decibels are logarithmic, so a level
          difference is a ratio and never a subtraction. A tenth quieter and the true
          factor are not the same claim, and this refit is being weighed against others.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - decibels here are being used for an acoustic power ratio
        takeaway: "A decibel difference is a logarithmic power ratio: 12 dB corresponds to about a sixteen-fold change in power."
        format: BALLPARK
        question: By what factor do the mounts reduce radiated power?
        answerText: A factor of about 15.85, usually rounded to 16; the new radiated power is about 6.3% of the old value.
        why: "For a power ratio, ΔL = 10 log₁₀(P₂/P₁). A 12 dB reduction means the original-to-new power ratio is 10^(12/10) ≈ 15.85. So the new radiated power is about 1/15.85, or 6.3%, of the old value. The common “3 dB is a doubling” shortcut gives nearly the same answer: 4 3 dB steps are about a factor of 16. The exact logarithmic calculation is better here because the equation is what the course is supposed to teach."
        estimate:
          relationship: Reduction factor = 10^(ΔL/10) for a power-level difference in decibels.
          prompt: The mounts reduce radiated acoustic power level by 12 dB.
          question: By what factor is radiated power reduced?
          labels:
            - 12 dB  (level reduction)
            - 3 dB  (one halving of power)
            - 2  (the factor each 3 dB is worth)
            - 10  (the divisor if you work in powers of ten)
          values: [12, 3, 2, 10]
          slots: 3
          template: "{2} ^ ({0} ÷ {1})"
          formula: Math.pow(c, a/b)
          correct: [0, 1, 2]
          target: 16
          tolerance: 2
          units: × less power
          solution: 12 dB is four steps of 3 dB, and each step halves the power: 2^4 = 16 times lower, or about 6% of the original.
          explanation: A logarithmic level difference turns subtraction in decibels into a power ratio.
      - group: NAV
        task: Work out whether the photocathode can see the wavelength at all
        title: One photon at eight hundred nanometres
        place: Control Room
        relationship: >-
          K_max = hf − φ: the photoelectric equation, so a photon below the work function ejects no
          electron however many arrive.
        scene: The refit list has a low-light channel for the search periscope. Its photocathode has a work function of 1.9 electronvolts, and the light the boat actually needs to see by at night is starlight scattered off the sea at around 800 nanometres. Vance wants to know if the thing works before it is bought.
        guide: >-
          A photocathode turns light into electrons one photon at a time, and a photon either has
          enough energy to free an electron or it has not. The photon energy comes from the wavelength;
          the threshold comes from the surface. Work out both and compare them. Brightness does not
          enter — a dim source of energetic photons produces a signal and a blazing source of weak
          ones produces nothing at all.
        background:
          - >-
              Why intensity cannot help. Each electron is freed by a single photon, so a photon that
              falls short is not topped up by the next one arriving. Doubling the light doubles the
              number of photons and changes nothing about whether any individual one clears the barrier.
              This is the observation classical wave optics could not explain and the reason the
              photoelectric effect matters historically.
          - >-
              How to get photon energy from a wavelength. Energy is Planck's constant times frequency,
              and frequency is the speed of light over the wavelength — so a convenient shortcut is that
              1240 divided by the wavelength in nanometres gives the energy in electronvolts. At 800
              nanometres that is about 1.55 electronvolts.
          - >-
              What the refit decision actually is. If the photocathode cannot see the light the boat
              has, the channel is an expensive way of showing a black screen, and the money should go to
              the sound-isolation mounts instead. Two failures cost the same money and only one of them
              is visible in a harbour trial.
        assumes:
          - the photocathode responds only to photons above its work function
        takeaway: A photon either clears the work function or it does not, and brightness cannot make up the difference.
        format: BALLPARK
        concept: 'The photoelectric effect, and the work function of a photocathode'
        question: Estimate the energy of an 800-nanometre photon, in electronvolts.
        estimate:
          prompt: The proposed low-light channel has a 1.9 eV photocathode. Vance wants the photon energy at the wavelength the boat actually has.
          question: Estimate the energy of an 800-nanometre photon, in electronvolts.
          labels:
            - 1240 eV·nm  (hc, in convenient units)
            - 800 nm  (λ, scattered starlight)
            - 1.9 eV  (φ, the photocathode's work function)
            - 6.63e-34 J·s  (h, Planck's constant)
          values: [1240, 800, 1.9, 6.63e-34]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 1.55
          tolerance: 0.15
          units: eV
          solution: E = hc/λ = 1240 ÷ 800 = 1.55 eV, which is below the 1.9 eV work function.
          explanation: 1.55 eV against a 1.9 eV threshold: no electron leaves, so the channel shows nothing at the wavelength the boat has.
        answerText: About 1.55 electronvolts — below the 1.9 the surface needs, so this photocathode is blind to that light.
        why: >
          The photoelectric equation gives the most energy an ejected electron can carry: the photon
          energy minus the work function. Here that difference is negative. 1.55 electronvolts against
          a 1.9-electronvolt threshold means no electron leaves. The channel is not dim at 800
          nanometres. It is blind, and gain downstream cannot recover a signal that was never made.
          The value is in the calculation rather than the device. Sodium lighting in a harbour is full
          of photons above 1.9 electronvolts, so the channel would pass its trial. Then it shows a
          black screen on the first dark night at sea. That failure is a different kind from a noisy
          channel, and a sea trial finds it too late.
  - title: Deep Watch
    objective: Run the whole boat at once, with everything degraded a little and nothing decided for you.
    briefing: |-
      An uncertain contact, a plot four hours old, water in the forward bilge, a scrubber train down and a bearing running warm. None of them is an emergency. Together they are the patrol.
    stake: Twenty-second day, the last full watch of the patrol, and everything is degraded a little. A contact Rask has not resolved. A plot Sowande has not been able to fix since the forenoon. A machine Haruki has not looked at since Tuesday. Whitfield is in the wardroom with the corpsman and a fractured wrist of his own, so the officer you would have handed half of this to is not available. This watch you decide the order everything gets worked in, and you do it while it is happening. Nobody will tell you which problem is the important one. Getting that ranking right is the job, and it is the only part of it that cannot be delegated.
    takeaway: Command is choosing which uncertainty you can live with, and saying so out loud.
    stops:
      - group: NAV
        task: Work out how much light the escape markers have left
        title: Five small problems
        place: Control Room
        relationship: >-
          N = N₀·2^(−t/T½): radioactive decay by half-lives, with tritium at 12.3 years.
        scene: Five things are on Vance's list and one of them is the escape-trunk markers. They are tritium, fitted at the boat's build fourteen years ago, and the last docking report notes they are "dimmer than expected" without saying against what.
        guide: >-
          A radioluminescent marker is bright in proportion to how much tritium is left in it, and
          tritium halves every 12.3 years. Work out the fraction remaining after fourteen years and
          compare it with what the markers are specified to hold. That number decides whether "dimmer
          than expected" is a fault to chase or the markers doing exactly what physics says they will.
        background:
          - >-
              Why the fall is not steady. Every half-life removes half of whatever is left, so a marker
              loses a great deal early and then declines slowly. Fourteen years is a little over one
              half-life, which is why the first inspection after a decade always reports a change and the
              one after twenty reports much less of one.
          - >-
              What the markers are for. They mark the escape route with no power and no battery, in a
              flooded and dark boat, which is the one situation where nothing else on this list matters.
              A marker at half brightness is still a marker; a marker below the threshold the eye needs
              in the dark is decoration.
          - >-
              Why this is the item that goes to the top. Four of the five things on the list are
              inconveniences with workarounds. This one has no workaround, cannot be assessed by looking
              at it in a lit compartment, and is on a fourteen-year clock nobody has been reading.
        assumes:
          - the markers were fitted at full specification at build
        takeaway: Every half-life removes half of what is left, so age alone predicts the brightness.
        format: BALLPARK
        concept: 'Radioactive decay and half-life, and a marker that has faded'
        question: Estimate the fraction of the original tritium still in the markers.
        estimate:
          prompt: The markers are tritium, fitted fourteen years ago. Vance wants to know how much of it is left before she calls it a fault.
          question: Estimate the fraction of the original tritium still in the markers.
          labels:
            - 14 years  (t, since the boat was built)
            - 12.3 years  (T½, tritium)
            - 5730 years  (T½, carbon-14)
            - 2  (the halving factor)
          values: [14, 12.3, 5730, 2]
          slots: 3
          template: '{0} ^ (−{1} ÷ {2})'
          formula: Math.pow(a,-b/c)
          correct: [3, 0, 1]
          target: 0.45
          tolerance: 0.05
          units: of the original
          solution: N/N₀ = 2^(−14/12.3) = 0.45.
          explanation: Forty-five per cent left after a little over one half-life — dimmer than expected is exactly what a fourteen-year-old marker should be.
        answerText: About 45 per cent — which is what a fourteen-year-old tritium marker is supposed to be.
        why: >
          Decay is a halving on a fixed clock. Fourteen years against a 12.3-year half-life is a
          little over one half-life, which leaves about 45 per cent. That settles what the docking
          report could not. The markers are not faulty. They are aged, and no inspection will find
          anything wrong with them. What it does not settle is whether 45 per cent is enough. That is
          a different question with a different kind of answer: a dark-adapted eye against a specified
          minimum. This item goes above the other four for two reasons. Its failure appears once, in
          the dark, with the boat flooding. And its condition can be predicted from the build date
          without opening anything.
      - group: DC
        task: Match each item to the assignment that fits it.
        title: Everything you are not doing yourself
        place: Forward Equipment & Handling
        scene: You keep the degraded plot yourself while four other problems remain open. Whitfield stands beside the watch bill with names ready, but nobody is assigned yet. This is the last watch of the patrol, and the handoff has to work without you hovering.
        guide: >-
          Four open problems and four assignments, and the pairing is about what each
          person is meant to notice. Ask of each item what the useful report would be: a
          change, a rate, an hour, or a cost. A number logged with no threshold is a
          number nobody acts on. This is the last watch of the patrol, so an assignment
          that still needs you standing over it has not been made.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last
              pair looks forced: the fault is usually not in the join you are struggling
              with, but in one you made early and stopped questioning.
        assumes:
          - an instruction has to be actable by the person who receives it
        takeaway: An assignment that names a threshold can be acted on alone; one that says watch it cannot.
        format: PROTOCOL
        why: A useful assignment lets the other person act without guessing what you meant. It names an owner, a first action and a condition for reporting back. For the bilge, log the level and report a change. For the contact, hold it long enough to obtain bearing rate. For the scrubber, restore it or name the deadline. For the warm bearing, restore cooling and state the acoustic cost. “Watch it” sounds responsible, but it gives no one a decision point and leaves every problem attached to you.
        columns:
          - What is going on elsewhere
          - What you ask for
        rebuttals:
          - A bilge that is wet and not rising needs a level logged every ten minutes and a change reported — a change, not a number, because the number means nothing on its own.
          - An unresolved contact needs holding for a bearing rate, and a report before it resolves. Waiting until it is certain wastes the geometry.
          - A scrubber train that is down needs restoring, or an hour named at which the air stops being optional. That hour is what command plans around.
          - A warm bearing needs the second cooling pump back, and the acoustic cost said out loud — because that cost is the reason it was secured.
        scenarios:
          - The forward bilge, wet but not rising.
          - The faint contact nobody has resolved.
          - The scrubber train that is down.
          - The bearing running warm.
        choices:
          - Log the level every ten minutes and report a change, not a number.
          - Hold it and get a bearing rate, and report before it resolves rather than after.
          - Restore it, or name the hour at which the air stops being optional.
          - Restore the second cooling pump, and say what that costs acoustically.
        mapping: [0, 1, 2, 3]
      - group: SONAR
        task: Calculate the beat frequency from the two spectral lines.
        title: Why the level pulses three times a second
        place: Sonar Shack
        scene: 2 narrowband components sit at 147 and 150 hertz on the same bearing. In seawater the sound speed is about 1500 metres per second. The audio level swells and fades regularly while both spectral lines themselves remain steady.
        guide: >-
          Three numbers, and one of them is the sound speed, which the pulsing rate does
          not need at all. It belongs to the wavelengths rather than to the beat. Ask of
          each number whether the swelling depends on it. Both spectral lines are
          steady, so nothing is changing frequency. What is changing is how the two
          patterns line up, and that comes from the gap between them.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - waves add when they arrive together
          - sound speed is approximately the same for these two nearby frequencies
        takeaway: Two nearby frequencies beat at their difference frequency because their relative phase cycles steadily.
        format: BALLPARK
        question: How many amplitude swells per second should the two tones produce?
        answerText: 3 beats per second. The corresponding wavelengths are about 10.20 m and 10.00 m.
        why: "The beat frequency is fbeat = |f₁ − f₂|, so 150 − 147 = 3 Hz: three amplitude swells each second. The wave relation v = fλ also gives different wavelengths in the same water: about 1500/147 = 10.20 m and 1500/150 = 10.00 m. Because the two wave patterns advance with slightly different phase rates, they repeatedly line up and oppose each other. The pulsing is therefore interference between close-frequency components, not a third spectral line or a changing shaft speed."
        choices:
          - Two sources beating, at the difference of their frequencies.
          - One source whose speed is changing three times a second.
          - A fault in the display, since two steady lines cannot pulse.
          - The boat's own machinery, aliased into the band.
        answer: Two sources beating, at the difference of their frequencies.
        rebuttals:
          - A speed change moves a line's frequency. It does not make the level rise and fall on a fixed period.
          - Two steady lines pulsing is what interference sounds like; the display is showing the frequencies, not the sum.
          - Our own machinery would appear on every bearing. These two lines are on one.
        estimate:
          prompt: 2 tones are 147 Hz and 150 Hz in water where v ≈ 1500 m/s.
          question: Estimate the beat frequency.
          relationship: fbeat = |f₁ − f₂|.
          explanation: Only the two frequencies set the beat rate. Sound speed is useful later for wavelength, but not for this subtraction.
          solution: fbeat = |150−147| = 3 Hz. As a follow-on, λ147 ≈ 10.20 m and λ150 = 10.00 m.
          labels:
            - 147 Hz  (first tone)
            - 150 Hz  (second tone)
            - 1500 m/s  (sound speed, not needed for beat rate)
          values: [147, 150, 1500]
          correct: [1, 0]
          slots: 2
          template: "{0} − {1}"
          formula: a - b
          target: 3
          tolerance: 0.25
          units: Hz

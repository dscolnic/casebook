        answerText: Keep the rising fire boundary. Delegate the falling bilge, stable atmosphere and wrist injury with explicit first actions and report thresholds.
        why: The fire boundary is the one condition that gets worse fast enough to cross a damage threshold while you are deciding. At 54 °C and rising 6 °C per minute, an 80 °C insulation limit is only a few minutes away. The flooding is already losing 20 litres a minute net, so it can be watched. The atmosphere and wrist are stable. A useful handoff gives each problem an owner, a first action, and a number that brings it back to you. “Watch it” supplies none of those.
      - group: NAV
        task: Buy the time to think
        title: Slowing down as a decision
        place: Control Room
        scene: The degraded plot is still being rebuilt while the boat makes eight knots toward a bank nine miles ahead. The officer of the deck can slow to three knots now. Whitfield wants to know how much thinking time that buys before anything harder to reverse.
        guide: >-
          Five numbers, and two of them are not distances or speeds: the minutes since
          the plot degraded, and the difference between the two speeds. A difference in
          knots is not a difference in time, because time is distance divided by speed.
          Work out each speed's time and compare them. Slowing costs progress and buys
          everything else, and the passage will still be there afterwards.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - distance divided by speed is time
        takeaway: Slowing the boat converts a distance problem into a time budget.
        format: BALLPARK
        question: How much time does coming down to three knots buy?
        why: Time is the only resource in a casualty that can be manufactured, and speed is the price list. Nine miles at eight knots is a little over an hour; the same nine miles at three knots is three. Slowing costs progress and buys everything else — the plot can be rebuilt, the flooding can be fought, the passage will still be there. Work out what eight knots is actually spending, in minutes, before deciding whether the boat can afford it.
        estimate:
          relationship: Time = distance ÷ speed. The gain is the time at the slower speed minus the time at the faster one.
          prompt: Nine miles to the bank at eight knots, with the option of coming down to three.
          question: Estimate the extra time coming down to three knots buys.
          labels:
            - 9 nm  (to the bank)
            - 8 kn  (present speed)
            - 3 kn  (the slow option)
            - 6 min  (since the plot degraded)
            - 5 kn  (the difference between the 2 speeds)
          values: [9, 8, 3, 6, 5]
          slots: 3
          template: "{0} ÷ {2} − {0} ÷ {1}"
          formula: a/c - a/b
          correct: [0, 1, 2]
          target: 1.875
          tolerance: 0.2
          units: hours
          solution: 1.1 hours at 8 knots against 3 at 3 knots, so slowing buys nearly 2 more.
          explanation: An hour is not enough time to fight a flooding casualty and rebuild a plot. Three hours is. The boat's speed is the one number on this list that you control, and it is worth two hours.
  - title: Sonar Blinded by the Boat
    objective: Find the noise the boat is making about itself, and prove which machine it is.
    briefing: |-
      Sonar has lost the picture. There is a broadband rise across every bearing and a new narrowband line, and the ocean has not changed. The problem is aboard, which makes it the engineers' problem and sonar's evidence.
    stake: Eleventh day. The broadband noise floor is up across every bearing rather than in 1 sector, and the broadband operator, Kes Dunne, has found a new narrowband line at 113 hertz that grows with turns. Rask says the boat is shouting into its own array; Haruki says his plant is running exactly as it was yesterday. This watch you decide whether the noise is outside the boat or inside it, narrow it to one machine, and say what kind of fault makes a line like that. While the array is degraded other boats can still hear this one, and it cannot hear them.
    takeaway: Own-ship noise is diagnosed by correlating what sonar hears with what the plant is doing.
    stops:
      - group: SONAR
        task: Close the energy ledger on the transducer bank
        title: The rise on every bearing
        relationship: >-
          U = ½CV²: the energy stored in a capacitor, times the pulse rate for a power.
        place: Sonar Room
        scene: Self-noise is up on every bearing at once, which is the signature of something aboard. The transducer drive bank is the suspect: 180 microfarads charged to 2.2 kilovolts, pulsing eight times a second, and Rask wants the energy accounted for before anybody opens a cabinet.
        guide: >-
          A capacitor stores energy in the field between its plates, and the store goes as the square
          of the voltage — so the bank at 2.2 kilovolts holds four times what it would hold at 1.1.
          Read what you need off the panel and report the energy the bank puts out every second.
          Anything already being dissipated during the interval you measured has to go back into the
          total, and a bleed resistor that has been carrying current since the last shutdown is easy
          to leave out precisely because nothing on the panel moves when it runs.
        background:
          - >-
              Why the square matters here. Energy stored is a half of the capacitance times the voltage
              squared, so the drive voltage is the term worth arguing about. Dropping the bank from 2.2
              to 1.9 kilovolts loses a quarter of the stored energy and a quarter of the acoustic output,
              which is the trade the refit conversation later in the fortnight is about.
          - >-
              What a transducer is, electrically. A slab of piezoelectric ceramic between two
              electrodes is a capacitor that changes shape when it is charged. So the drive circuit is
              not powering a motor, it is charging and discharging a capacitance, and every joule that
              does not leave as sound leaves as heat in the ceramic and in the cabinet.
          - >-
              Why the ledger has to close. If the energy leaving the bank exceeds what the pulses can
              account for, the difference is going somewhere it was not designed to go — and a bank
              dissipating hundreds of watts into a cabinet is both the self-noise source and the reason
              the cabinet is warm.
        assumes:
          - the bank is fully charged before each pulse and fully discharged by it
        takeaway: Stored energy goes as the square of the voltage, so the drive voltage is the term that matters.
        format: BALANCE
        concept: 'Capacitance and stored energy: the transducer as a capacitor'
        question: Read what you need and report the energy the bank delivers each second.
        balance:
          hint: >-
            Reading a panel is free. Counting a stream is the claim you are making about where the
            energy is going.
          total: { amount: 3560, unit: J/s, label: Energy leaving the bank each second }
          streams:
            - { id: pulses, label: Stored energy per pulse × pulse rate, value: 3485, display: '½ × 180 µF × (2200 V)² = 435.6 J, × 8 per second = 3485 J/s' }
            - { id: bleed, label: Bleed resistor dissipation, value: 75, display: 75 W, hidden: true, note: 'in circuit since the last shutdown' }
            - { id: heater, label: Cabinet heater, value: 0, display: 'off since the boat dived' }
          tolerance: 40
          commit: Report the energy rate
        answerText: >-
          About 3560 joules a second — the 3485 the pulses carry plus the 75 the bleed resistor has been
          dissipating the whole time.
        why: >
          The energy in a capacitor is half the capacitance times the square of the voltage, and at 180
          microfarads and 2.2 kilovolts that is 436 joules sitting in the bank between pulses. Eight
          pulses a second makes it a three-and-a-half kilowatt load, which is a serious heat source in a
          cabinet inside a sealed boat. The bleed resistor is the term that gets missed: it is not a
          reading, nothing on the panel changes when it conducts, and it has been in circuit since the
          last shutdown. Leaving it out understates the bank by two per cent, which sounds harmless until
          you notice that the same habit — counting only what a gauge shows — is what left the pump out
          of the flooding total on day five.
      - group: ENG
        task: Change one machine at a time, listen to the line, then reverse the suspected change to confirm the cause.
        title: Narrowing it to one mount
        place: Propulsion Machinery
        scene: 4 machines are running when a new 212-hertz line appears across the array. Only the seawater pump was started in the last half hour. Haruki will let you change one machine at a time, but sonar must report before each next change.
        guide: >-
          The number you are watching is the strength of the 212-hertz line on the sonar
          array. Four machines are running, and only one of them has to be the source.
          Stop a machine and sonar reports again: a machine that matters takes the line
          down with it, and a machine that does not leaves it where it was. Restart what
          you stopped before the next change, then name the machine the line follows.
        background:
          - >-
              Why one machine at a time. Two machines stopped together and a line that
              disappears tells you nothing about which one did it, and on a boat there is a
              further cost: every machine you leave stopped is a system somebody else needs.
              The rule is also a rule about the boat, not only about the measurement.
          - >-
              Why the timing is suggestive and not evidence. The seawater pump was started
              in the half hour before the line appeared, which makes it the obvious suspect
              and not a proven one. Plenty of things change in half an hour aboard a
              submarine, and a coincidence in time is exactly what this format exists to
              separate from a cause.
          - >-
              What the line is. A rotating machine radiates at frequencies set by its shaft
              rate and the number of blades or vanes, and a mount that has loosened couples
              that sound into the hull far more efficiently than it should. So the tone is a
              fingerprint: its frequency says what kind of machine, and switching says which
              one.
        assumes:
          - changing several variables at once makes a causal result ambiguous
          - a suspected cause should reproduce the effect when restored
        takeaway: A correlation becomes a causal test when one variable changes, the response follows, and the response returns when the variable is restored.
        format: CONTROL
        question: Which machine causes the 212-hertz line?
        control:
          hint: Change only one machine before each sonar report. Once you find a large response, put that machine back and confirm that the line returns.
          baseline: 74
          noise: 2
          unit: dB at 212 Hz
          variables:
            - id: sw_pump_2
              label: Second seawater pump
              changedValue: secured
              restored: 74
            - id: trim_pump
              label: Trim pump
              changedValue: secured
              restored: 74
            - id: vent_fan
              label: Ventilation fan
              changedValue: secured
              restored: 74
            - id: lube_pump
              label: Lube-oil pump
              changedValue: secured
              restored: 74
          response: 61
          truth: sw_pump_2
        answerText: "The second seawater pump is the source: securing it removes 13 dB from the line, and restoring it brings the line back."
        why: The log tells you what changed near the time the line appeared, but timing alone is only a correlation. A causal test holds every other machine fixed, changes one control, and waits for sonar to report. The seawater pump changes the line by 13 dB while measurement noise is only 2 dB. The other machines move it by no more than the noise. Restoring the pump brings the line back. That reversal is what turns a plausible suspect into the measured cause.
      - group: SONAR
        task: Use the supplied values to estimate the contact’s line-of-sight speed.
        title: What the shifted line says about speed
        place: Sonar Shack
        scene: After the 212-hertz own-ship line is removed, a separate contact on bearing 064° resolves at 149.7 hertz. Boats of that class produce the same machinery line at 150.0 hertz. The operator asks what the small frequency shift says about range rate.
        guide: >-
          Four numbers, and one is a conversion into knots rather than a term. Note
          which frequency is the reference and which is the measurement. Their
          difference is what carries the information, and the sign matters as much as
          the size. Note whose line this is now. The own-ship tonal was removed first,
          because a machine aboard shares the receiver's motion and shows no Doppler at
          all.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - sound travels at about 1500 metres a second in sea water
        takeaway: A one-way Doppler shift measures line-of-sight relative speed; the sign tells whether the range is opening or closing.
        format: BALLPARK
        question: Estimate the range rate implied by the 0.3-hertz downward shift.
        answerText: About 3.0 m/s, or 5.8 knots, opening.
        why: For speeds much smaller than sound speed, the fractional Doppler shift is approximately Δf/f = v/c. Here the observed line is 0.3 Hz below a 150.0 Hz rest line, so Δf/f = -0.3/150 = -0.002. Multiplying by 1500 m/s gives about -3 m/s, or roughly -5.8 knots. The negative sign means the range is opening. This calculation now belongs to an external contact; an own-ship machine would share the receiver’s motion and would not show a six-knot relative Doppler shift.
        estimate:
          relationship: Δf/f ≈ v/c, with negative v for an opening range in this sign convention.
          prompt: An external contact’s line is at 149.7 Hz. The class reference is 150.0 Hz. Use c = 1500 m/s.
          question: Estimate the line-of-sight range rate.
          labels:
            - 0.3 Hz  (how far the line has shifted)
            - 150.0 Hz  (reference frequency)
            - 1500 m/s  (sound speed)
            - 0.5144 m/s per knot  (conversion)
          values: [0.3, 150, 1500, 0.5144]
          slots: 3
          template: "{0} ÷ {1} × {2}"
          formula: a/b*c
          correct: [0, 1, 2]
          target: 3
          tolerance: 0.6
          units: m/s
          solution: Δf = -0.3 Hz. (-0.3/150) × 1500 m/s = -3.0 m/s ≈ -5.8 kn, opening.
          explanation: Use the fractional frequency shift, not the absolute frequency alone.
      - group: SONAR
        task: Sort the night's contacts before the log goes up.
        title: Ours, or somebody else's
        place: Sonar Room
        scene: The night's held contacts have to be logged before the watch changes. Some of what the array heard came from this boat. The rest came from the water outside it.
        guide: >-
          Two bins. A sound made by this boat rides with it — the bearing does not change
          however the boat turns, and it comes and goes with what the engineers are doing.
          A sound from outside has a bearing of its own. Sort on where the sound is made,
          not on what it sounds like.
        background:
          - >-
              Why own noise is the hard case. It arrives on the same array as everything else and can
              be louder than a real contact. What separates it is that it does not move: turn the
              boat thirty degrees and an outside contact's bearing changes, and the pump's does not.
          - >-
              Why it matters for the log. Own noise logged as a contact puts a ghost on the plot that
              the next watch has to disprove. An outside contact logged as own noise is a boat
              nobody is tracking.
        assumes:
          - a hydrophone hears the boat it is mounted on as well as the sea
        takeaway: A sound that turns with the boat was made by the boat.
        format: BELT
        question: Send each sound to the bin that says where it was made.
        answerText: Anything whose bearing turns with the boat is our own. Anything that holds its own bearing came from the water outside.
        why: >-
          The array cannot tell where a sound was made; the geometry can. A sound generated on
          this boat arrives at the array from the same relative direction whatever the boat is
          doing, so the bearing follows the hull round a turn. A sound made in the water holds
          its own bearing while the boat turns under it, which is why a thirty-degree course
          change is the standard test and why it is worth the time it costs. The second clue is
          correlation: own noise starts and stops with something the crew did — a pump cut in, a
          shaft order, a hatch. A biologic or another vessel has no reason to be synchronised
          with the engine room. Getting the bin wrong costs in both directions. Own noise in the
          log is a ghost the next watch has to spend hours disproving; a real contact filed as
          own noise is a vessel nobody is tracking, on a night when the boat is trying to stay
          unheard.
        belt:
          left: { name: Made by us }
          right: { name: Made outside }
          need: 20
          lives: 3
          pass: 0.8
          hint: Turn the boat. What turns with it was made on it.
          items:

        guide: >-
          Three problems and you keep one. For each of the others, name an owner, the
          first real action they will take, and the reading or event that brings it back
          to you. The flooding is now losing — sixty litres a minute out against forty
          in — so it is contained. The boundary aft is heating, which is not.
        background:
          - >-
              How to rank the three. Trend, containment, consequence. Flooding that is
              losing is trending the right way. A heating fire boundary is trending the
              wrong way and has the worst consequence if it is ignored. A fractured wrist
              hurts and is stable.
          - >-
              Why a first action is required. An owner told to watch something comes back
              for instructions at the worst possible moment. Naming what they will do first
              is what lets them hold it without you.
          - >-
              Why a return condition is the other half. It is the number or event at which
              the problem stops being theirs, agreed now so nobody has to judge in the
              moment whether to interrupt you.
        assumes:
          - a problem’s trend matters as much as its present size
          - a complete delegation names an owner, a first action and a return condition
        takeaway: Delegation is complete only when an owner knows what to do first and when to report back.
        format: DELEGATE
        question: Which problem do you keep, and what complete assignment does each remaining problem get?
        delegate:

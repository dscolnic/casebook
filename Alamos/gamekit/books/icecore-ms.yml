          prompt: The spaces seal at eighty-eight metres. The surface adds about 0.32 metres of snow a year, and this snow has not been squashed thinner yet.
          question: How old is the snow at the depth where the spaces seal?
          relationship: Age = depth ÷ what one year adds.
          labels:
            - 88 m (where the spaces seal)
            - 0.32 m/yr (what one year adds, as snow)
            - 0.119 m/yr (the same year, as ice)
            - 917 kg/m³ (how heavy solid ice is)
          values: [88, 0.32, 0.119, 917]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 275
          tolerance: 25
          units: years
          solution: Eighty-eight ÷ 0.32 is about 275 years.
          explanation: The ice figure is the trap. This depth is measured in snow, so the rate has to be in snow as well.
  # ------------------------------------------------------------------ day 5
  - title: Turning a ratio into a temperature
    objective: Establish what the isotope record measures and how confidently it can be stated in degrees.
    briefing: The isotope profile is finished to 1,600 metres and nobody has agreed what it says in degrees.
    stake: "Friday, and the isotope readings run down to sixteen hundred metres. Tanabe has the numbers, and Halvorsen wants them in degrees for the summary. That means a conversion figure. Somebody measured that figure; it is not a law of nature. Today you turn the readings into a temperature change, and decide how firmly it can be stated. A figure taken on trust turns every degree into somebody's assumption."
    takeaway: A proxy becomes a number through a calibration, and the calibration is part of the result.
    stops:
      - group: COLD
        task: Turn the isotope shift into degrees.
        title: What the ratio says in degrees
        place: Cold Laboratory
        scene: Tanabe has the isotope readings against depth. The stretch covering the last cold spell sits 1.8 units below today's value. The conversion figure is on the board.
        assumes:
          - colder air drops its heavier water first, so the snow that falls last is lighter
        takeaway: A conversion figure turns a measurement into a claim, and it is measured rather than assumed.
        format: BALLPARK
        question: How much colder was that cold spell than today?
        answerText: About 2.7 degrees colder. The shift is 1.8 units, and one degree here is worth 0.67 of them.
        why: Water carrying heavier atoms turns to snow first. Air that has cooled further has already lost more of them, so the last snow to fall is the lightest. Over a useful range the reading and the temperature move together in a straight line. How steep that line is belongs to this place, not to physics. So it is measured against the mast. Divide the shift by it, and the answer is in degrees.
        estimate:
          prompt: The cold spell sits 1.8 units below today's value. Comparing the record against the weather mast gives 0.67 units for every degree.
          question: How much colder was that cold spell than today?
          relationship: Temperature change = the shift ÷ how many units there are in one degree.
          labels:
            - 1.8 units (the shift)
            - 0.67 units for each degree (this site)
            - 8.0 units for each degree (a different measurement)
            - 11 (years that overlap the mast)
          values: [1.8, 0.67, 8, 11]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 2.7
          tolerance: 0.3
          units: °C colder
          solution: 1.8 ÷ 0.67 is about 2.7 degrees.
          explanation: The other figure on the board belongs to a different kind of measurement. Using it here gives an answer eleven times too small.
      - group: FIELD
        task: State the cooling with the doubt around it.
        title: How firmly the cooling can be stated
        place: Snow Study Hut
        scene: Brandt has the mast record, the years that overlap it, and the scatter around the fitted line. The season summary needs a statement about that cold spell.
        assumes:
          - a line fitted through measurements carries a spread as well as a middle
        takeaway: Moving the middle and narrowing the spread are different actions, with different evidence behind them.
        format: CLOUD
        question: Which work would let the summary say the spell was more than two degrees colder?
        cloud:
          hint: The band is the reconstructed cooling with its calibration uncertainty. The claim is cleared only when the whole distribution sits past the limit.
          centre: 2.7
          spread: 0.55
          bounds:
            min: 2
            max: 5
            label: between two and five degrees colder
          pass: 0.95
          actions:
            - id: overlap
              label: Add six more years of mast overlap to the calibration
              effect: narrow
              amount: 0.6
              note: Six more years of both records measured against each other
            - id: recentre
              label: Apply the revised source-region correction to the slope
              effect: shift
              amount: 0.15
              note: Moves the central estimate, on the same 11 years
          commit: State the cooling
        answerText: More overlap with the mast. That narrows the spread, which is what the claim needs. Moving the middle makes the estimate different, not surer.
        why: The answer is a spread, not a number. The line was fitted through eleven years of overlap, and it carries the scatter of those eleven years. Saying the spell was more than two degrees colder is a claim about where the whole spread sits. So it is won by making the spread narrower. More overlap years is the only thing here that adds information. The correction moves the middle and leaves the spread as wide as it was.
      - group: DATA
        task: Say what the isotopes are a thermometer of.
        title: The temperature of what, and where
        place: Science Module
        scene: Jonas Aalto, who keeps the records, is drafting the summary. He has written that the isotopes give the temperature of the last cold spell. The drilling lead wants that narrowed before it goes out.
        assumes:
          - snow forms in a cloud and falls to the ground some way below it
        takeaway: A stand-in measures one specific thing, and the sentence has to say which.
        format: CHOICE
        question: What does the isotope record most directly record?
        answerText: The temperature where this snow formed, in the air above this place. Close to the ground temperature, and not the same thing.
        why: The isotope ratio is set as water vapour turns into snow. So it records what the cloud was like, weighted to the seasons that bring most of the snow. Getting from there to the ground needs the link between cloud and ground. That is what the site's own figure supplies. The sea the water came off leaves a small mark. The ice's own temperature is a different measurement.
        choices:
          - Where the snow formed, over this region, in the season it fell.
          - The average yearly temperature of half the planet at that time.
          - The temperature of the ice itself, kept since it was buried.
          - The temperature of the sea the water came off.
        answer: Where the snow formed, over this region, in the season it fell.
        rebuttals:
          - One site records its own region. An average for half the planet is built by adding many sites together.
          - A thermometer down the hole measures the ice now. That is a check on the isotopes rather than a replacement for them.
          - Where the water came from does leave a mark, and it is a small correction rather than the signal.
  # ------------------------------------------------------------------ day 6
  - title: Air that stopped moving
    objective: Establish what a bubble is, when it sealed, and why its air is younger than its ice.
    briefing: The gas record and the ice record from the same depth are not the same age.
    stake: "Saturday. Samuel Adeyemi has carbon dioxide from four depths and a problem with all of them. The air in a bubble stopped moving centuries after the snow around it fell. At a site this dry, that gap is the biggest correction in the record. Today you work out how big the gap is here, and why the gas record is smoother than the ice one. Get it wrong and a gas record lands centuries from the climate it belongs to."
    takeaway: Two things in the same piece of ice can be different ages, and the difference has to be calculated.
    stops:
      - group: GAS
        task: Work out the gap between the air and the ice around it.
        title: How much younger the air is
        place: Gas Laboratory
        scene: The spaces between the grains seal at eighty-eight metres here. Above that, air moves freely up to the surface. Adeyemi has the yearly build-up on the board beside it.
        assumes:
          - air moves through the connected spaces in the snow until they close off
        takeaway: A bubble is sealed at a depth, and the ice around it arrived at that depth long before.
        format: BALLPARK
        question: How much younger is the air than the ice around it?
        answerText: About 460 years. The snow at the sealing depth is that old, and the air shut into it is nearly new.
        why: Air moves through the open spaces in the snow. It stays in touch with the sky until those spaces close. So the air in a bubble is about as old as the moment it was sealed. The ice around it is as old as the snow. The gap is how long that snow took to get down there. Cold dry places take centuries. Wet coastal ones take decades. Forget it, and a gas record is plotted centuries too early.
        estimate:
          prompt: The spaces seal at eighty-eight metres. The snow above averages 0.62 of the weight of solid ice, and the site adds 0.119 metres of ice a year.
          question: How much younger is the air than the ice around it?
          relationship: Age gap = sealing depth × how heavy the snow is ÷ what one year adds, in ice.
          labels:
            - 88 m (where the spaces seal)
            - 0.62 (how heavy the snow is, against solid ice)
            - 0.119 m/yr (what one year adds, as ice)
            - 0.32 m/yr (the same year, as snow)
          values: [88, 0.62, 0.119, 0.32]
          slots: 3
          template: "{0} × {1} ÷ {2}"
          formula: a*b/c
          correct: [0, 1, 2]
          target: 458
          tolerance: 40
          units: years
          solution: 88 × 0.62 ÷ 0.119 is about 460 years.
          explanation: The snow thickness is the trap. The weight has already been allowed for, and using it twice counts the same correction twice.
      - group: DRILL
        task: Build the stages in order, then name the one that fixes the gap.
        title: From snowfall to sealed bubble
        place: Drill Trench
        scene: Lindqvist has the borehole's own record on the wall. Five stages, from a snowflake landing to air being shut away, with a measurement against each.
        assumes:
          - something that passes through several stages is limited by one of them
        takeaway: In a chain of stages, one of them sets the answer and the rest follow it.
        format: CHAIN
        question: Which stage decides how much older the ice is than the air inside it?
        chain:
          hint: Put the stages in the order air actually passes through them, then name the one that fixes the size of the age difference.
          links:
            - id: snowfall
              label: Snow lands on the surface
              transfers: New mass, carrying the isotopes of the air it condensed from
              reading: 0.32 m of new snow a year
            - id: burial
              label: The layer is buried and begins to compact
              transfers: Load from everything above it, squeezing the pore space smaller
              reading: Density rising from 340 to 550 kg per cubic metre
            - id: mixing
              label: Air moves through the open pores
              transfers: Atmospheric composition, exchanged with the surface
              reading: Mixes to within a decade of the surface air
            - id: closeoff
              label: The pores seal into separate bubbles
              transfers: The atmosphere of that moment, locked into the ice
              reading: Complete by 88 m
            - id: compression
              label: Bubbles compress and eventually become clathrate
              transfers: Pressure into the trapped gas, then into the crystal structure
              reading: Bubbles gone below about 1,200 m
          order:
            - snowfall
            - burial
            - mixing
            - closeoff
            - compression
          governing: closeoff
          distractor: mixing
          commit: Name the governing stage
        answerText: The moment the spaces seal. The gap is the age of the ice at that depth. Above it, open snow. Below it, a bubble.
        why: Every stage moves something, and only one fixes the size of the gap. Air swaps with the sky all the way down through the snow. So its age hardly changes, while the ice around it gets older year by year. The moment the spaces seal is the moment that swapping stops. Whatever the ice's age is at that depth is the gap. Mixing keeps the air young, and it is worth a decade.
      - group: CORE
        task: Say why the gas record is smoother than the ice record.
        title: Why the gas record has no sharp edges
        place: Core Line
        scene: Okonkwo has both records from the same depths on one plot. The ice record has features a few years wide. The gas record has nothing in it narrower than a few decades.
        assumes:
          - a measurement that averages over a stretch cannot show anything shorter than it
        takeaway: A record made by averaging cannot show a change faster than the averaging.
        format: CHOICE
        question: Why is the gas record smoother than the ice record from the same depths?
        answerText: The air mixed through the whole open snow column before it was sealed. So each bubble holds decades of sky, not one year of it.
        why: Air stays in touch with the sky all the way through the open snow, and the spaces do not all close at once. They close across a stretch of depth, so the bubbles sealed in one layer hold a mixture covering every year that stretch represents. That smoothing belongs to the site. Somewhere with heavy snowfall seals in a decade and keeps sharp features. Here it takes several. Cutting smaller samples cannot undo it.
        choices:
          - Each bubble holds air mixed over decades.
          - Gas samples are bigger, so they average more ice.
          - Carbon dioxide changes more slowly in the air than temperature does.
          - Bubbles leak slowly into each other over thousands of years.
        answer: Each bubble holds air mixed over decades.
        rebuttals:
          - Sample size is a choice and could be made smaller. The mixing in the snow is fixed by the site.
          - Some changes in the air really are fast, and this record could not show those either.
          - Bubbles are sealed, and they do not swap with each other on any timescale that matters here.

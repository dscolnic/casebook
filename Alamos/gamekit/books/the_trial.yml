# The Trial — CLARION-3, and the 3 weeks before the second interim.
#
# Written to gamekit/tools/BOOK_TEMPLATE.md. The place is themes/the_trial/plan.js;
# the arc it follows is in ../GAME_IDEAS.md under "The Trial".
#
# The argument: Balogun holds that every month of delay is people on the arm that
# will turn out to be worse. Feldman holds that the boundary exists so the room
# cannot fool itself, and that trials stopped early overstate what they found.
# Balogun is right on day 3. Feldman is right on day 13.

theme:
  id: the_trial
  title: The Trial
  subtitle: Methodology & Operations Lead · CLARION-3

groups:
  - id: RAND
    code: RAND
    name: Randomisation & Blinding
    color: '#3f6f8f'
    desc: How an arm is assigned, and what has to be true for nobody to know which.
    defaultLeader: diouf
    milestones: [Read the allocation, Hold the blind, Account for the kit, Ready to hand over]
  - id: ENDP
    code: ENDP
    name: Endpoints & Measurement
    color: '#7a4fa3'
    desc: What is being counted, who counts it, and how the counting can go wrong.
    defaultLeader: ansah
    milestones: [Define the event, Adjudicate the file, Check the measurement, Ready to hand over]
  - id: SAFE
    code: SAFE
    name: Safety Monitoring
    color: '#b3462f'
    desc: What harm looks like early, and who is allowed to see it.
    defaultLeader: vogt
    milestones: [Read the report, Rate the event, Brief the board, Ready to hand over]
  - id: STAT
    code: STAT
    name: Statistical Analysis
    color: '#1f7a6b'
    desc: Power, boundaries, intervals, and what a number is entitled to claim.
    defaultLeader: feldman
    milestones: [State the question, Fix the rule, Estimate the effect, Ready to hand over]
  - id: SITE
    code: SITE
    name: Site Operations
    color: '#b0762a'
    desc: 31 hospitals, and the distance between a chart and a database.
    defaultLeader: marchetti
    milestones: [Visit the site, Verify the source, Close the query, Ready to hand over]
  - id: REG
    code: REG
    name: Regulatory & Reporting
    color: '#5b6a72'
    desc: What was promised in advance, and what has to be said out loud afterwards.
    defaultLeader: umeh
    milestones: [Find the commitment, Record the change, State the result, Ready to hand over]

roster:
  - id: balogun
    name: Dr. Yemi Balogun
    role: Trial Chair
    division: SITE
    bio: |
      Chairs CLARION-3, and saw the first 11 participants himself before the
      trial had a coordinating centre. He counts the trial in people rather than
      in months: 2400, half of them on whichever arm turns
      out to be the worse 1.

      His argument with the statistics room is the same one every week. A trial
      that runs a year longer is a year of somebody getting the treatment that
      loses, and that cost is real even when nobody can put an interval on it.

      His limit is that he wants the answer, which is exactly the state of mind
      a stopping rule is written to protect a trial from.
    quiz:
      - q: Why does Balogun treat a year of extra recruitment as a cost rather than as caution?
        a: Half of that year's recruits get the arm that loses
        wrong:
          - Funding bodies withdraw support from trials that overrun their planned end date
          - Recruiting for longer widens the interval around the final estimate
          - Sites lose interest in a trial that has run for more than three years
  - id: feldman
    name: Dr. Miriam Feldman
    role: Trial Statistician
    division: STAT
    bio: |
      Wrote the analysis plan and will not be talked out of it. Everything the
      trial is allowed to claim was written down before the data existed, which
      is the only arrangement under which a claim means anything.

      She is unpopular twice a year, when somebody wants to look at the numbers
      early and she explains what looking costs. Each unplanned look spends part
      of the trial's small budget for being wrong, and that budget does not
      refill.

      Her limit is that she is blinded too. She can say what the rule is and not
      whether today is the day it matters.
    quiz:
      - q: Why does Feldman treat an extra look at the data as something that gets spent?
        a: Every look is another chance for variation to clear the line
        wrong:
          - Each analysis costs the statistics team several days it cannot spend elsewhere
          - Looking early lowers the number of events the trial will collect
          - An unplanned analysis has to be repeated after the database is locked
  - id: vogt
    name: Prof. Helena Vogt
    role: Independent Monitoring Board Chair
    division: SAFE
    bio: |
      Chairs the board that meets three times in the life of this trial and is
      the only body that may recommend stopping it. She holds no other role in
      CLARION-3 and has never met a participant, which is the point of her.

      In closed session she is shown the two arms separately. Everybody who runs
      the trial is shown a version where they are pooled, and she is careful
      about what she says in a corridor afterwards.

      Her limit is that a recommendation is all she has. The sponsor decides,
      and the board's minutes are the only argument it takes with it.
    quiz:
      - q: Why is Vogt given no other role in the trial she monitors?
        a: A stake in the result disqualifies whoever reads it
        wrong:
          - Anybody holding a medical qualification is barred from sitting on a monitoring board
          - The board is required to be recruited from outside the country
          - A chair with clinical duties would be unable to attend three meetings
  - id: petrescu
    name: Dr. Alina Petrescu
    role: Unblinded Statistician
    division: STAT
    bio: |
      The only person in the building who has seen CLARION-3 by arm. She
      prepares the closed report for the board and has done so twice, and she
      has told nobody anything, including the chair, including at a leaving do.

      Her office is past the firewall and her printouts go face down. She eats
      lunch alone rather than answer a friendly question badly, which she
      describes as the least interesting kind of discipline there is.

      Her limit is that she cannot be asked to help. Any question she answers
      well is a question that lets the room infer the answer.
    quiz:
      - q: Why does Petrescu avoid the team's ordinary shop talk about the trial?
        a: Even a careful answer leaks which way it is going
        wrong:
          - Staff who have seen the arms are barred from social contact with the trial team
          - Her contract is with the board rather than with the coordinating centre
          - Discussing the trial outside her office would breach the participants' privacy
  - id: diouf
    name: Farida Diouf
    role: Trial Pharmacist
    division: RAND
    bio: |
      Runs the kit warehouse, where the blind is not an idea but 4000
      identical boxes in numbered order. She packs, labels, ships and counts them
      back, and she can tell you where any one of them is.

      Every box carries a code-break envelope that has never been opened. Two
      have been opened in four years, both at three in the morning, both for a
      patient in front of a doctor who needed to know.

      Her limit is the cold room. Kit that has been warm is kit she cannot vouch
      for, and vouching is the whole job.
    quiz:
      - q: Why does Diouf treat the numbering of the boxes as part of the science?
        a: It is what keeps the arm unknowable at the bedside
        wrong:
          - Numbering is how the pharmacy reclaims the cost of each shipment from the sponsor
          - The sequence is what allows expired stock to be withdrawn in order
          - Regulators require every shipment to carry a serial number
  - id: renner
    name: Tobias Renner
    role: Data Management Lead
    division: REG
    bio: |
      Runs the database that everything eventually becomes. He writes the queries
      that go back to sites when a form and a chart disagree, and he can tell how
      a site is doing from how long its queries stay open.

      He is careful about the difference between a field left empty and a field
      answered zero. One is a measurement and the other is an absence, and a
      database that stores them the same way has destroyed something.

      His limit is that he is downstream of everybody. By the time a mistake
      reaches him it has usually been made twice.
    quiz:
      - q: Why does Renner refuse to let an empty field become a zero?
        a: An absence stored as a measurement is invented data
        wrong:
          - Empty fields are filled in by the site once the query has gone back to it
          - A zero requires a countersignature before it can enter the database
          - The database cannot sort records that contain a true zero
  - id: ansah
    name: Dr. Kwame Ansah
    role: Endpoint Adjudication Chair
    division: ENDP
    bio: |
      Chairs the committee that decides whether what happened to a participant
      counts as the event the trial is measuring. Three readers, no names, no
      arms, no site, and a definition agreed before the first participant.

      He insists on the stripping because the alternative is a reader who knows,
      and a reader who knows finds what they expect in an ambiguous file. Half
      of what he reads is ambiguous.

      His limit is that he can only rule on what was written down at the time.
      A file assembled after the fact is a file that already has an opinion.
    quiz:
      - q: Why does Ansah's committee read files with the site and the arm removed?
        a: An ambiguous file resolves the way the reader expects
        wrong:
          - Readers would otherwise recognise participants they had treated themselves
          - Sites are entitled to have their identity withheld from the committee
          - The definition of the event changes depending on where it happened
  - id: marchetti
    name: Lucia Marchetti
    role: Lead Monitor
    division: SITE
    bio: |
      Drives to sites and reads the hospital notes against what the site typed
      into the database. 29 of the 31 are fine. She spends her
      time on the two, and on working out why they are the two.

      She has learned that most mismatches are not dishonesty but a form filled
      in on Friday from memory, and that the fix is usually a rota rather than a
      warning letter.

      Her limit is that she samples. Nobody verifies every field of every
      participant, so what she can say is about the site rather than the record.
    quiz:
      - q: Why does Marchetti check the hospital notes rather than the trial's own forms?
        a: The notes record the care; the form records the notes
        wrong:
          - Trial forms belong to the sponsor and a monitor has no authority to alter them
          - Hospital notes carry the participant's consent signature
          - The database rejects any field a monitor has not seen in person
  - id: umeh
    name: Nkechi Umeh
    role: Regulatory Lead
    division: REG
    bio: |
      Keeps the trial's promises. The protocol, the registry entry, every
      amendment and the date each one was made — she can produce the version of
      the plan that was in force on any day of the last four years.

      She reports the events that must be reported inside the window they must be
      reported in, and she is the reason the trial can show that today's analysis
      is the one it said it would run.

      Her limit is that she holds the record and not the reason. She can prove
      what was promised, not whether it was the right promise.
    quiz:
      - q: Why does Umeh keep every superseded version of the protocol?
        a: It is how the analysis is shown to predate the data
        wrong:
          - Superseded versions are what the sponsor's costs for each period are calculated from
          - Superseded protocols remain legally binding on the sites
          - The registry will not accept an amendment without its predecessor
  - id: iriarte
    name: Dr. Nuno Iriarte
    role: Principal Investigator, Site 12
    division: SITE
    bio: |
      Runs the fastest-recruiting site in CLARION-3 and is proud of it. Site 12
      has enrolled more than twice its share, and his screening log is the
      shortest in the trial.

      He believes the trial is good for his patients and that the eligibility
      criteria are conservative. He is at least half right, and the half he is
      wrong about does not show up in his own numbers at all.

      His limit is that a site cannot see itself. Everything unusual about site
      12 is only visible next to the other 30.
    quiz:
      - q: Why can site 12's recruiting speed only be judged from outside the site?
        a: Its own practice looks ordinary with nothing to compare against
        wrong:
          - Sites are not permitted to see their own recruitment figures while the trial runs
          - Recruitment is recorded centrally and never returned to sites
          - A principal investigator may not review a screening log they signed
  - id: doyle
    name: Maggie Doyle
    role: Participant Representative
    division: SAFE
    bio: |
      Sits on the steering committee because somebody in the room has to have
      been the person the trial is about. She had the condition CLARION-3 is
      studying and was in a different trial 9 years ago.

      She reads every draft of the participant information and sends back the
      sentences that mean nothing. Her standing question about any result is what
      it would tell somebody deciding on a Tuesday afternoon whether to take it.

      Her limit is that she is one person's experience, which she says more often
      than anyone else does.
    quiz:
      - q: What is Doyle's standing test for how a result should be reported?
        a: Whether it helps one person decide to take the treatment
        wrong:
          - Whether the wording would survive being quoted in a newspaper
          - Whether the analysis reported was the one the protocol named in advance
          - Whether every participant is sent the figure before it is published

glossary:
  - name: Randomisation
    aliases: [randomise, randomised, randomly assigned]
    def: Assigning each participant to an arm by chance, so the groups differ only by luck and by what is being tested.
  - name: Allocation concealment
    aliases: [concealment, concealed allocation]
    def: Keeping the next assignment unknowable until the participant is entered, so nobody can time an entry to get an arm.
  - name: Blinding
    aliases: [blind, blinded, unblinded, masking]
    def: Keeping who is on which arm hidden after assignment — from participants, from staff, or from whoever measures the outcome.
  - name: Arm
    aliases: [arms, treatment arm, control arm]
    def: One of the groups a trial compares. CLARION-3 has two: the drug and standard care.
  - name: Primary endpoint
    aliases: [endpoint, endpoints, primary outcome]
    def: The one outcome the trial was designed to answer, named before it began. Everything else is secondary.
  - name: Adjudication
    aliases: [adjudicate, adjudicated, adjudication committee]
    def: An independent panel deciding whether what happened to a participant meets the trial's definition of an event.
  - name: Interim analysis
    aliases: [interim, interim look]
    def: A scheduled look at the accumulating data before the trial finishes, done by the board rather than the trial team.
  - name: Stopping boundary
    aliases: [boundary, boundaries, stopping rule]
    def: The result a trial has to beat at an interim look before stopping counts as evidence rather than as luck.
  - name: Alpha
    aliases: [significance level, type I error]
    def: The chance the trial accepts of calling a difference real when there is none. Every extra look spends some of it.
  - name: Power
    aliases: [powered, underpowered]
    def: The chance a trial finds a difference of a stated size if that difference is really there.
  - name: Intention to treat
    aliases: [intention-to-treat, ITT]
    def: Analysing every participant in the arm they were assigned, whatever they went on to take.
  - name: Per protocol
    aliases: [per-protocol]
    def: Analysing only participants who received what they were assigned and stayed in the trial. It breaks the balance randomisation bought.
  - name: Absolute risk reduction
    aliases: [absolute risk, ARR, risk difference]
    def: How much less often the outcome happens on the treatment, stated as a difference in percentage points.
  - name: Relative risk
    aliases: [relative, risk ratio, relative reduction]
    def: How much less often the outcome happens on the treatment, stated as a proportion of the control rate.
  - name: Number needed to treat
    aliases: [NNT, number needed]
    def: How many people have to be treated for one of them to avoid the outcome. One divided by the absolute risk reduction.
  - name: Confidence interval
    aliases: [interval, intervals, CI]
    def: The range of true effects the data are compatible with. Its width says how much is still unknown.
  - name: Information fraction
    aliases: [information, events accrued]
    def: How far through a trial really is — the events collected so far as a share of the events planned.
  - name: Multiplicity
    aliases: [multiple comparisons, multiple testing]
    def: The way testing many questions makes at least one look impressive by chance alone.
  - name: Subgroup
    aliases: [subgroups, subgroup analysis]
    def: A slice of the participants — by age, by site, by severity — analysed on its own.
  - name: Blinding index
    aliases: [guessing survey]
    def: A check that asks staff or participants to guess the arm, and compares how often they are right against chance.
  - name: Source data
    aliases: [source document, source documents, source data verification]
    def: The hospital's own notes, made when the care happened. The trial's forms are copies of it.
  - name: Protocol deviation
    aliases: [deviation, deviations]
    def: Something done differently from what the protocol says, recorded whether or not it changed anything.
  - name: Serious adverse event
    aliases: [adverse event, adverse events, SAE]
    def: Harm during a trial that puts someone in hospital, disables them or worse — reported whether or not the drug caused it.
  - name: Equipoise
    aliases: []
    def: Honest uncertainty about which arm is better. It is what makes randomising someone defensible, and it ends when the evidence arrives.
  - name: Database lock
    aliases: [locked, data cut]
    def: Freezing the data at a stated moment so an analysis is of something fixed rather than of a moving target.
  - name: Conditional power
    aliases: []
    def: The chance the trial would end up positive if it carried on to the end, given what it has collected so far.
  - name: Fragility
    aliases: [fragility index]
    def: How many participants' outcomes would have to change for a significant result to stop being significant.
  - name: Regression to the mean
    aliases: [regression toward the mean]
    def: The tendency of an extreme measurement to be less extreme when it is taken again, whatever was done in between.

missions:
  # ---------------------------------------------------------------- day 1
  - title: What the trial already decided
    objective: Establish what CLARION-3 promised before it had any data.
    briefing: Three weeks to the second interim, and the board pack starts today.
    stake: >-
      Monday, and the second interim analysis is 21 days away. CLARION-3 has randomised
      2,400 people across 31 hospitals, and in 3 weeks Professor Vogt's board will read
      the trial by arm and say whether it carries on. Yemi Balogun wants that meeting to end the
      trial; Miriam Feldman wants it to end nothing that was not written down in advance. Today you
      go back through what the trial committed to before the first participant — the assignment, the
      outcome it counts, the size it was built to detect — because everything the board is told in
      three weeks is measured against those promises rather than against what anybody now hopes.
    takeaway: A trial's claims are the ones it made before it had data.
    stops:
      - group: RAND
        task: Work out which protection site 7 has lost
        title: Concealment is not the same as blinding
        concept: "Allocation concealment: protecting the moment of entry"
        place: Kit Warehouse & Cold Room
        scene: >
          Farida Diouf has a note from site 7. Their pharmacy diary lists kit numbers beside the arm
          each one contains, and the research nurse can see the next entry before she decides whether
          to enter a patient.
        guide: >-
          All four options are real costs of a readable diary. Ask of each whether it
          acts at the moment of entry, or afterwards. A nurse who can see the next slot
          can wait a day for a patient she thinks will do well. Nobody has to be
          dishonest for that to wreck the comparison. Concealment protects entry;
          blinding protects everything after, and they fail separately.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - participants are assigned to arms by chance rather than by choice
        takeaway: If the next assignment can be seen in advance, chance is no longer the only thing choosing.
        format: CHOICE
        question: What has site 7's readable diary cost CLARION-3?
        choices:
          - The groups can differ by who was picked, not only by luck
          - The nurse giving the infusion will be able to tell what is in the bag
          - Participants at site 7 will work out which arm they are on
          - The pharmacy can no longer reconcile shipped kit against what was dispensed
        answer: The groups can differ by who was picked, not only by luck
        why: >
          Randomisation only buys balanced groups if nobody can see what is coming. A nurse who knows
          the next slot is the drug can wait a day for a patient she thinks will do well, or enter a
          frailer one when the next slot is standard care. Neither is dishonest and both destroy the
          comparison, because the arms now differ in who was entered as well as in what they were
          given. Concealment protects the moment of entry. Blinding protects everything after it, and
          the two fail separately.
        rebuttals:
          - That is blinding, and it fails later — after entry, when somebody is treating or measuring.
          - Participants guessing is a real problem, and it is also after the fact rather than at entry.
          - Accountability is the pharmacy's own record and is not what the diary has broken.
      - group: ENDP
        task: Separate what the trial counts from what it also collects
        title: One outcome, named in advance
        concept: The primary endpoint, named in advance, and everything else
        place: Adjudication Room
        scene: >
          Kwame Ansah has four measurements from the same participant on his screen and a definition
          agreed four years ago. A journalist has asked the sponsor which of the 4 CLARION-3 is
          actually about.
        guide: >-
          Four candidate primary endpoints, scored on two things the sponsor cares about. The
          slider is the event rate the trial actually gets, which nobody knows in advance —
          slide it to the pessimistic end and see which endpoint still answers the question
          there. The one that looks best at the expected rate is not necessarily the one that
          survives being wrong about it.
        background:
          - >-
              What a primary endpoint is. The one question the trial was built to answer, named
              before the first participant was randomised and used to set the sample size. It also
              fixes how the result will be reported: an absolute risk reduction in percentage points,
              with the relative figure beside it. Everything else on Ansah's screen is collected —
              worth having, worth reporting, and not what the trial promised.
          - >-
              Why naming it in advance matters. With four measurements per participant, somebody
              choosing afterwards has four chances to find a difference, and the reported result
              would be the best of four rather than the answer to one question. That is the whole of
              why the definition is four years old.
          - >-
              Why the event rate is the assumption that bites. Every endpoint's power depends on how
              often its event happens. A rare, hard endpoint is unimpeachable and may never
              accumulate enough events to say anything; a composite happens more often and answers a
              blurrier question. That trade is what the slider makes visible.
        assumes:
          - a trial collects more than one measurement from each participant
        takeaway: The primary endpoint is the one question the trial was built to answer; the rest are collected, not promised.
        format: STRESS
        question: Which primary endpoint still answers the question if the event rate comes in lower than anyone expected?
        answerText: The composite of death, stroke or hospitalisation. Cardiovascular death alone is the cleanest question in the protocol and needs an event rate the trial has not got.
        why: Naming the endpoint in advance fixes how the answer gets reported. It comes out as an absolute risk reduction in percentage points, with the relative figure beside it. Every endpoint here is defensible. They fail differently when the assumption behind them turns out to be wrong. Cardiovascular death alone asks the crispest question and needs the most events. At 3.5 per cent a year it is decisive. At 1.6 per cent the trial never accumulates enough, and reports an interval that includes everything. The composite of death, stroke or hospitalisation happens often enough to answer even at the low end. The cost is that it blurs what "the treatment worked" means. The walk distance would give a number at any event rate. It answers a different question — how people felt, not what happened to them. So choosing well costs something. The composite is not the sharpest question on the list. It is the one still being asked when the trial's central assumption misses.
        stress:
          assumption:
            label: Annual event rate the trial actually achieves in the control arm
            unit: '% a year'
            min: 1.6
            max: 4.2
            nominal: 3.0
            step: 0.1
          criteria:
            - key: blur
              label: How much the endpoint blurs what the treatment did
              unit: score of 10
            - key: answers
              label: Event rates across the range at which it still answers
              unit: of 5
          candidates:
            - id: death
              label: Cardiovascular death alone
            - id: composite
              label: Death, stroke or hospitalisation for heart failure
            - id: symptom
              label: Change in the six-minute walk distance
          scores:
            death:
              blur: 1
              answers: 2
            composite:
              blur: 4
              answers: 5
            symptom:
              blur: 8
              answers: 4
          feasible:
            death: 2.9
            composite: 1.6
            symptom: 1.9
          optimiseOn: blur
          robust: composite
      - group: STAT
        task: Work out what the trial is waiting for
        title: A trial ends at a number of events
        concept: Event-driven trials, and information fraction as progress
        place: Statistics & Analysis
        scene: >
          Balogun wants to know when CLARION-3 will be finished and has been told, twice, that
          nobody can say. Feldman writes three quantities on the whiteboard and asks him to estimate
          it himself.
        guide: >-
          Five numbers, and three belong to other questions: the events adjudicated so
          far, the hospitals recruiting, and one of the two rates. Ask of each whether
          this schedule depends on it. A trial learns from events, not from people. So
          the duration is not a decision anybody makes. It is what the rate produces,
          and the rate belongs to the participants.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - the trial compares how often an event happens in two arms
          - events accumulate over time, at some rate per participant per year
        takeaway: A trial that waits for events finishes when the events arrive, which is not a date.
        format: BALLPARK
        question: Estimate how long CLARION-3 has to follow its participants to reach the events it needs.
        why: >
          A time-to-event trial learns from events, not from people. 2000 participants who
          stay well carry almost no information about which arm is better; the comparison rests on
          the ones something happened to. So the design fixes a number of events, and recruitment
          and follow-up run until that number arrives. How long that takes is not a decision anybody
          makes — it is the required events divided by the rate they arrive at, and that rate belongs
          to the participants rather than to the trial. A healthier-than-expected group is bad news
          for the schedule for exactly this reason, and it is why the interim looks are placed at
          fractions of the events rather than at fractions of the years.
        estimate:
          prompt: >
            CLARION-3 was designed to need 380 primary events. It has randomised 2,400 people, and
            across both arms together about 8 events occur per 100 participants per year — that is
            0.08 events per participant per year.
          question: Choose the events required, the number randomised and the event rate.
          labels:
            - 380  (primary events the design requires)
            - 2400  (participants randomised)
            - 0.08  (events per participant per year, both arms)
            - 246  (events adjudicated so far)
            - 31  (hospitals recruiting)
          values: [380, 2400, 0.08, 246, 31]
          slots: 3
          template: '{0} ÷ ({1} × {2})'
          formula: a/(b*c)
          correct: [0, 1, 2]
          target: 1.98
          tolerance: 0.35
          units: years
          solution: 2400 × 0.08 = 192 events a year, and 380 ÷ 192 ≈ 2.0 years.
          explanation: >
            About two years of follow-up. 2400 people at 8 events per 100 per
            year produce roughly 192 events a year, so the 380 the design needs take about 2 of
            them. Nobody can promise that date, because the rate is the participants' and not the
            trial's: at 6 events per 100 per year the same 380 events take nearly 3 years. It is
            also why the 246 events already adjudicated, rather than the calendar, is what says how
            far through CLARION-3 is.
          givens:
            - The design requires 380 primary events
            - About 8 events per 100 participants per year, both arms together
          relationship: >
            Years of follow-up ≈ events required ÷ (participants × events per participant per year).
        answerText: About two years of follow-up.

  # ---------------------------------------------------------------- day 2
  - title: Who measures, and how
    objective: Find out where a number is made before deciding what it is worth.
    briefing: Two outcomes, two ways of measuring, and only one of them has a committee.
    stake: >-
      Tuesday. 20 days to the interim, and the board pack has 2 outcomes in it rather than
      1. CLARION-3 counts a clinical event, which a committee rules on from the notes, and it also
      carries a symptom score the treating doctor writes down at each visit. Kwame Ansah trusts the
      first and says so at every meeting; Nuno Iriarte at site 12 thinks the second is the 1 that
      matters to patients, and Maggie Doyle agrees with him. Today you work out where each number is
      actually made, and what each is worth when the two arms are compared — because in three weeks
      they will be on the same page.
    takeaway: A measurement is worth what the procedure that made it is worth.
    stops:
      - group: ENDP
        task: Match each measurement to the weakness that can bend what it means.
        title: A number can be precise and still be the wrong outcome
        place: Adjudication Room
        scene: Kwame Ansah has 4 CLARION-3 measurements on his table. One comes from a national register, one from blinded readers, one from a treating doctor, and one from a central laboratory. Doyle wants to know what can go wrong with each.
        guide: >-
          Four measurements and four weaknesses. Pair them by asking how much trial
          judgement each measurement passes through. A death in a national register goes
          through almost none. A borderline admission goes through a definition. A
          symptom score goes through a person who may believe something. And one of them
          can be measured perfectly and still stand in for the wrong thing.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last
              pair looks forced: the fault is usually not in the join you are struggling
              with, but in one you made early and stopped questioning.
        assumes:
          - a measurement can be precise without being clinically important
          - a surrogate outcome is a measure used to stand in for a clinical outcome
        takeaway: Before trusting a number, ask both how it was made and whether it measures the outcome people actually care about.
        format: PROTOCOL
        why: Measurements can fail in different ways. A death in a national register needs little trial judgement. A borderline admission can move if readers apply the definition differently, so blinded adjudication protects it. A symptom score can move with the scorer’s belief about treatment. A laboratory marker can be measured perfectly and still mislead. If it stands in for a clinical outcome, it is a surrogate. Changing the marker does not prove that admissions, symptoms or survival changed with it.
        columns:
          - What is measured
          - What could make it mislead
        scenarios:
          - Death from any cause, taken from the national register.
          - A hospital admission for the trial condition, ruled on by three blinded readers.
          - A symptom score the treating doctor writes at each visit.
          - A blood inflammation marker measured by the central laboratory and used as a stand-in for future admission.
        choices:
          - Almost none from trial judgement; the event is recorded outside the study.
          - A borderline case can move if the definition is applied differently.
          - The scorer’s belief about treatment can shift a subjective rating.
          - It can improve even if the clinical outcome it stands in for does not.
        mapping: [0, 1, 2, 3]
      - group: SITE
        task: Decide what a deviation is worth recording
        title: What counts as a deviation
        place: Monitors' Room
        scene: >
          Lucia Marchetti has four things sites did this month that were not what the protocol says.
          None of them harmed anybody. Site 12 has asked which of them are worth the paperwork.
        guide: >-
          All four are real deviations and none harmed anybody. Ask of each whether it
          lands on both arms equally. A late blood test and a late form are untidy in
          both arms. A different pump delivers the same drug. Only one of these changes
          who is in the trial. It matters because those entries need not be spread
          evenly across the arms.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - the protocol states what should happen at each visit
        takeaway: A deviation is recorded for what it does to the comparison, not for how bad it looks.
        format: CHOICE
        question: Which of these most threatens the comparison CLARION-3 is making?
        choices:
          - A site entered four people who did not qualify
          - A site took the twelve-week bloods a week late, at 13 weeks
          - A site filed its visit forms a fortnight late
          - A site used a different brand of infusion pump
        answer: A site entered four people who did not qualify
        why: >
          Deviations matter in proportion to what they do to the two arms. A late blood test and a
          late form are untidy and affect both arms equally, so the comparison survives them. A
          different pump delivers the same drug. Entering people the trial was not designed for
          changes who is in it — and if that site's entries are not spread evenly across the arms,
          it changes what is being compared. The test is always whether the two groups are still
          alike apart from the treatment.
        rebuttals:
          - A week's delay applies to both arms and leaves the comparison intact.
          - Late paperwork is a data-management problem; the visit itself happened on time.
          - A different pump is a deviation worth recording and does not alter who is in which arm.
      - group: REG
        task: Find what the trial promised about this analysis
        title: The plan that was in force
        place: Regulatory & Registry
        scene: >
          Nkechi Umeh has four versions of the analysis plan, each dated. Feldman wants to know which
          1 governs the interim in 20 days, and the sponsor's lawyer wants to know how anybody
          could prove it.
        guide: >-
          All four steps will happen, so ask what order makes the claim provable.
          Prespecification is a claim about time: this analysis was chosen before
          anybody could see what it would give. The only support for that afterwards is
          a dated public record made before the data existed. Reverse any two of these
          and the arithmetic is still right about a question chosen after the fact.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency: each
              step is here because the one before it has already happened, or has to have.
              One transposed pair falsifies that claim wherever it sits, so partial credit
              would be credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained
              by having nothing before or after them, which usually makes them the two you
              can settle from the scene alone. Pinning them collapses the remaining
              arrangements sharply, and what is left in the middle is where the actual
              judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the
              only one. An order can run on cost, on risk, or on reversibility — every
              observation that leaves the sample as it was, before any that consumes it. On
              those boards a chronological reading finds nothing, because none of the steps
              has to happen at a particular hour.
        assumes:
          - a trial's plan can be amended while it is running
        takeaway: A result is worth more when the plan that produced it can be dated.
        format: SEQUENCE
        task: Order what has to be true before an interim analysis can be called prespecified.
        cards:
          - The analysis is written into the plan, with its boundary and its timing.
          - The plan version is registered publicly, with the date it took effect.
          - The data are cut at the stated point and the file is locked.
          - The unblinded statistician runs the analysis that the registered plan names.
        order: [0, 1, 2, 3]
        why: >
          Prespecification is a claim about time: this analysis was chosen before anybody could see
          what it would give. The only way to support that claim afterwards is a public record with
          dates on it, made before the data existed. That is why the plan is registered rather than
          filed, why the cut comes after the registration rather than before, and why the person who
          runs it is the one person already permitted to see the arms. Reverse any two of those
          steps and the analysis is still correct arithmetic about a question chosen after the fact.

  # ---------------------------------------------------------------- day 3
  - title: The signal at two sites
    objective: Decide what has to be reported today rather than at the next meeting.
    briefing: Two sites have sent the same kind of event in the same fortnight.
    stake: >-
      Wednesday morning, 19 days out. Sites 4 and 19 have each reported a participant admitted
      with the same unusual liver picture, 11 days apart, and neither report says which arm the
      participant was on because neither site knows. Feldman's instinct is that 2 is a number you
      see in a trial this size and that the board meets in 19 days anyway. Balogun wants it in
      front of Vogt this week. Today you decide what is reported, to whom, and how fast — and what
      the trial is entitled to do while it waits.
    takeaway: Safety reporting runs on a different clock from the analysis.
    stops:
      - group: SAFE
        task: Decide what moves now, before the next scheduled board meeting can help.
        title: The clock that is not the analysis clock
        place: Monitoring Board Room
        scene: The second admission arrived 18 minutes ago. 1 patient is still on the ward, and the 2 sites are 400 kilometres apart. Vogt is reachable this afternoon. The next board meeting is 19 days away.
        guide: >-
          Four options, and two clocks are running. One patient is still on the ward and
          the board meets in nineteen days. Ask of each option which clock it obeys. A
          serious unexpected event may change treatment tomorrow. Whether it also counts
          as an endpoint is a separate path, and the same event can travel both at once.
        background:
          - >-
              Why first is a different question from most important. When several calls
              compete for the same hour, what a choice is worth is not its own importance
              but the difference between doing it now and doing it later. A serious problem
              that will be no worse in an hour costs nothing to defer. A smaller one that
              closes a door costs everything behind that door.
          - >-
              What to look for in the options. Two things separate them: which is still
              changing, and which is a precondition for the others. A situation that is
              deteriorating has a cost per hour attached to it, and a step that unblocks the
              rest multiplies the value of the hours after it. Everything else is a
              preference about where to start.
          - >-
              Why only one answer is marked. In the situation these options describe all of
              them eventually happen; what is being tested is the head of the queue, because
              that is where the reasoning is visible. The verdict names what each of the
              others was waiting on, which is worth reading even when the choice was right —
              the ordering behind the first place is the rest of the answer.
        takesAsRead:
          - Hard endpoints against judged ones, and blinded adjudication
        assumes:
          - serious harm during a trial is reported whether or not the drug is thought to have caused it
        takeaway: A safety report does not wait for the analysis it might belong to.
        format: TRIAGE
        question: What should happen to these two reports today?
        why: "Safety reporting and endpoint analysis run on different clocks. A serious unexpected event may matter to treatment tomorrow, so it cannot wait 19 days for a board meeting. The site reports what happened now, with enough detail to judge urgency. Whether the event later counts toward a trial endpoint is a separate process. The same event can therefore travel down two paths at once: immediate safety reporting and later blinded adjudication. Waiting for one path to finish before starting the other loses time the safety system was built to protect."
        choices:
          - Both go to the board unblinded now, and recruitment continues
          - Both wait for the interim pack so the board sees them beside the efficacy result
          - Recruitment stops today and the reports go with the suspension notice
          - The sites are asked for more detail and nothing leaves until the files are complete
        answer: Both go to the board unblinded now, and recruitment continues
        rebuttals:
          - Holding a safety signal so it arrives with the efficacy result is a scheduling decision, and people are still being infused.
          - Suspending recruitment is a decision that needs the arms, and nobody blinded can make it.
          - Complete files are worth having; the report goes now and the detail follows it.
      - group: SITE
        task: Spend the call time on evidence that could change whether the two cases form a pattern.
        title: Ten minutes on each case
        place: Monitors' Room
        scene: Lucia Marchetti has ten minutes with each site before the reports go to Vogt. One coordinator is at a bedside. Five useful questions are on her screen, but asking all of them would take longer than either call.
        guide: >-
          Ten minutes with each site, five useful questions, and no time for all of
          them. Open each question and ask what its answer would change before the
          reports go to Vogt. One coordinator is at a bedside, so the call has to be
          short and worth having. Spend the ten minutes on what the reports cannot
          already tell you.
        background:
          - >-
              Why some questions are wasted on a call. Anything the site has already entered
              in the system is in the reports. A call is the only way to get at what has not
              been written down: why a visit slipped, what the coordinator is worried about,
              whether a protocol step is being interpreted differently.
          - >-
              Why 'before the reports leave' is the constraint. Once the report is out, a
              correction is a deviation and a conversation. Something learned now changes
              what the report says; the same thing learned tomorrow changes what has to be
              explained.
          - >-
              What a coordinator at a bedside can actually do. Answer one or two things from
              memory. A call that asks five questions gets three rushed answers, and the
              rushed ones are the least reliable data in the trial.
        takesAsRead:
          - Eligibility criteria, and what widening them changes
        assumes:
          - a safety pattern depends on whether cases share timing and clinical features
          - a VALUE board charges time for each piece of evidence
        takeaway: When time is scarce, collect the evidence that can change the decision before collecting detail that only decorates it.
        format: VALUE
        question: What should Marchetti spend the ten minutes finding out before the reports leave?
        value:
          budget:
            amount: 10
            unit: minutes
          decision: Do the two admissions share a timing pattern strong enough to flag for the board today?
          options:
            - id: timeline
              label: Dose, first-symptom and admission dates
              cost: 4
              axis: timing
              decisive: true
              reveals: Whether both cases began after a similar interval from first exposure.
            - id: meds
              label: New medicines and major lab changes
              cost: 4
              axis: alternative causes
              decisive: false
              reveals: Whether either case has an obvious competing explanation that weakens the apparent pattern.
            - id: causality
              label: Investigator causality opinion
              cost: 3
              axis: clinical judgement
              decisive: false
              reveals: How each local investigator interprets the case without knowing the treatment arm.
            - id: recruitment
              label: Site recruitment total this year
              cost: 2
              axis: operations
              decisive: false
              reveals: How busy each site has been, which does not establish whether these cases share a clinical pattern.
            - id: withdrawal
              label: Whether each participant withdrew
              cost: 2
              axis: follow-up
              decisive: false
              reveals: What happened after the admission, not whether the two admissions arose on the same exposure clock.
          hint: Each question spends the minutes shown beside it. Buy what would most change the pattern decision before using the remaining time on supporting detail.
        answerText: Buy the exposure timeline first. The dates of first dose, first symptom and admission can show whether the cases share the same exposure clock. Other details can support that judgement, but they cannot replace it.
        why: Two reports become a signal only when their details line up in a way that could matter. Timing is the fastest discriminator here. A case three days after first exposure tells a different story from one eight months later. Matching intervals in two distant sites would strengthen the case for a shared cause. Different intervals would weaken it. Investigator opinions, recruitment totals and withdrawal status may still matter, but none can establish that temporal pattern before the reports leave.
      - group: REG
        task: Work out which reports the regulator is owed and when
        title: What has to be told, and how fast
        place: Regulatory & Registry
        scene: >
          Umeh has a wall calendar with two windows marked on it in red and a stack of four events
          from this month. She has to sort them before Friday.
        guide: >-
          Four events and four obligations. Pair them by asking three things of each: is
          it serious, was it unexpected, and could it be related? The combination sets
          the clock, not how dramatic it sounds. A death nobody thinks is related is
          still serious. And an admission for the trial's own condition is the thing
          being counted rather than a safety report.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last
              pair looks forced: the fault is usually not in the join you are struggling
              with, but in one you made early and stopped questioning.
        takesAsRead:
          - Hard endpoints against judged ones, and blinded adjudication
        assumes:
          - regulators set deadlines for reporting harm during a trial
        takeaway: Expedited reporting is decided by what the event is, not by what anybody thinks caused it.
        format: PROTOCOL
        task: Match each event to what the trial owes and when.
        columns: [What happened, What is owed]
        scenarios:
          - An admission with an unexpected liver picture, thought possibly drug-related.
          - A fatal road accident with no plausible link to the treatment.
          - A hospital admission for the condition the trial is treating.
          - A rash that settled in two days without treatment.
        choices:
          - Expedited report to the regulator, days rather than weeks.
          - Recorded as a serious event and reported in the routine safety update.
          - Recorded as a trial endpoint and adjudicated like any other.
          - Recorded as an adverse event in the participant's file.
        mapping: [0, 1, 2, 3]
        why: >
          The reporting window is set by the category, not by the drama. Serious, unexpected and
          possibly related is the combination that runs on a clock of days, because it is the
          combination that might change how the drug is used tomorrow. A death nobody thinks is
          related is still serious and still reported, on the ordinary schedule. An admission for
          the trial's own condition is the thing being counted, so it goes to adjudication rather
          than to the safety desk. Everything else lives in the file.

  # ---------------------------------------------------------------- day 4
  - title: The unplanned look
    objective: Establish what looking early costs and who is allowed to do it.
    briefing: Somebody senior would like a peek at the numbers before the board sees them.
    stake: >-
      Thursday, 18 days out. The sponsor's medical director has asked, in writing, for a
      pooled summary of the primary endpoint by arm before the board meets, on the grounds that the
      liver reports have made everybody nervous. Feldman has said no twice and been asked to explain
      why in a way that does not sound like obstruction. Alina Petrescu, who is the only person who
      could produce it, has said nothing at all. Today you work out what an extra look actually
      costs the trial, who may take one, and what the trial can offer instead of the answer.
    takeaway: A trial's small budget for being wrong is spent by looking, not by finding.
    stops:
      - group: STAT
        task: Say what a second look costs
        title: What an extra look spends
        place: Statistics & Analysis
        scene: The medical director wants one unplanned endpoint summary before noon and has already drafted the email asking for it. Feldman has the two planned looks on the whiteboard and an empty box where this new request would sit.
        guide: >-
          Add up what the planned looks already spend, and compare it with what the trial has
          to spend in total. Each look has a boundary, and the error rate it uses is the price
          of that look. Pick the three planned amounts. The unplanned look's price is on the
          board too, and it is what the sum has no room for.
        background:
          - >-
              What is being spent. A five per cent error rate is a promise about the whole trial,
              not about any one test. Every look at the accumulated data is another chance to catch
              a wandering difference at its most flattering moment, so each look consumes part of
              that budget and the budget does not refill.
          - >-
              How planned looks are paid for. The boundaries at the planned looks are made harder —
              an interim result has to be more extreme than the final one to stop the trial — and
              the amounts add up to no more than the total. That is the whole of the arithmetic:
              the spending plan is written before any data arrive.
          - >-
              Why an unplanned look is different in kind. It has no boundary and no allowance, so
              whatever it spends comes out of the final analysis. A trial that has spent more than
              its budget can no longer say what its error rate is, which is a worse position than
              not having looked.
        takesAsRead:
          - Type I and type II error, and what α and β are for
        assumes:
          - a trial accepts a small chance of calling a difference real when there is none
        takeaway: A trial's tolerance for error is spent by testing, and it does not refill.
        format: BALLPARK
        question: What do the planned looks already spend of the trial's error budget?
        answerText: Exactly 0.025 — the whole of it. The unplanned look would add 0.015 on top, taking the trial to 0.040 with no boundary and no allowance for it.
        why: "The rule is Σ α_spent ≤ α. This trial is run one-sided at 0.025, and the spending plan puts 0.001 at the first interim, 0.004 at the second and 0.020 at the final analysis: 0.001 + 0.004 + 0.020 = 0.025, which is the whole budget and exactly what the plan is allowed to be. That is why the interim boundaries are so hard to cross — an early look is cheap precisely because it demands an extreme result. An unplanned look priced at 0.015 takes the total to 0.040, and the trial can no longer state its own error rate: 4 per cent of trials with no real effect would report one. Nothing about the data changes when somebody looks, which is what makes this counter-intuitive. What changes is the number of chances the trial has taken to be fooled, and that number is in the denominator of every claim it goes on to make."
        estimate:
          prompt: The spending plan puts 0.001 at the first interim, 0.004 at the second, and 0.020 at the final analysis. The trial is run one-sided at 0.025.
          question: Choose the three planned amounts.
          labels:
            - 0.001  (spent at the first interim)
            - 0.004  (spent at the second interim)
            - 0.020  (spent at the final analysis)
            - 0.015  (what the unplanned look would cost)
            - 0.025  (the trial's total budget)
          values: [0.001, 0.004, 0.020, 0.015, 0.025]
          slots: 3
          template: '{0} + {1} + {2}'
          formula: a+b+c
          correct: [0, 1, 2]
          target: 0.025
          tolerance: 0.001
          units: of error rate spent
          solution: 0.001 + 0.004 + 0.020 = 0.025, the whole budget. The unplanned look would take it to 0.040.
          explanation: The plan spends exactly what it has. An extra look has no boundary and no allowance, so it spends out of the final analysis.
          givens:
            - planned spending 0.001, 0.004 and 0.020
            - the trial's total budget is 0.025, one-sided
            - three unadjusted looks would give P(at least one false positive) = 1 − (1 − 0.025)³ = 1 − 0.9268 = 0.073
          relationship: Unadjusted, k looks give P(at least one false positive) = 1 − (1 − α)^k. Alpha spending answers that, obeying Σ α_spent ≤ α against one budget.
      - group: SAFE
        task: Decide who is entitled to see what
        title: Why the board looks and the team does not
        place: Monitoring Board Room
        scene: |-
          Vogt is in the building for an hour. Petrescu's closed report is on the table, face down. The medical director is copied on everything the trial team writes and on nothing the board writes.
        guide: >-
          Four options, and somebody has to see the arms or a harmful treatment
          continues unnoticed. Ask of each whether it names a route from knowledge into
          the trial's own conduct. The board does not recruit, treat or score. The team
          does all three. Confidentiality cannot close those routes, and being advisory
          does not either.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - the trial team recruits, treats and measures while the trial runs
        takeaway: The people who could act on an early result are the people kept from seeing it.
        format: CHOICE
        question: Why is the monitoring board shown the arms when the trial team is not?
        answerText: The board can see the arms because it is separated from recruitment, treatment and outcome scoring. Its knowledge can guide a recommendation without feeding back into the measurements still being made.
        why: Somebody must see unblinded data or a harmful treatment could continue unnoticed. The safeguard is separation of roles. The monitoring board does not recruit participants, deliver treatment or score outcomes. What it learns cannot change those processes directly. The trial team does all three. If that team knows which arm is winning, ordinary judgement can shift enrolment or follow-up. It can also shift how an ambiguous score is written. Confidentiality alone cannot remove those pathways.
        choices:
          - It is separated from recruitment, treatment and outcome scoring
          - Its members are more qualified to interpret an early treatment difference
          - Its confidentiality rules prevent the result from affecting site behaviour
          - Its recommendation is advisory, so seeing the arms cannot influence the trial
        answer: It is separated from recruitment, treatment and outcome scoring
        rebuttals:
          - Expertise helps the board interpret data, but expertise does not stop knowledge from changing measurements.
          - Confidentiality limits disclosure; it does not make knowledge harmless for people who recruit or score outcomes.
          - An advisory recommendation can change the trial. The protection comes from keeping the board outside data-producing roles.
      - group: RAND
        task: Rule on a request to break one participant's code
        title: When the blind is opened for one person
        concept: Unblinding an individual for their own care
        place: Kit Warehouse & Cold Room
        scene: >
          Diouf has a call from an intensive care registrar at three in the morning, on speaker. A
          CLARION-3 participant is in front of him and the treatment he is considering depends on
          what she has been receiving.
        guide: >-
          Four steps, and the rail is not a clock — every one of them could be done in the next
          ten minutes. Order them by what each one protects: the thing that cannot be recovered
          if it is skipped goes first, and the thing that can be done afterwards without
          costing anybody anything goes last.
        axis: Order the four by what is lost if the step is skipped, most irrecoverable first. This is not a clock — all four are available right now, and the question is which omissions cannot be repaired afterwards.
        ends: [Cannot be recovered, Can wait until morning]
        background:
          - >-
              Why the blind exists. It protects the comparison, not the participant. Every person who
              knows an assignment is a person whose judgement can drift with it — the treating team,
              the assessor, the participant. The trial's answer depends on that ignorance being
              intact across four hundred people, and one code being opened costs one of them.
          - >-
              Why the clinical decision comes first anyway. The blind is a research instrument and
              this is a patient in front of a registrar at three in the morning. If knowing the
              assignment changes what is safe to give her, the code is opened; the trial can lose a
              participant from the blinded analysis and cannot lose her.
          - >-
              What has to be written down and why the order matters. The reason, the time and who
              authorised it, recorded before the envelope is opened rather than reconstructed
              afterwards — because once the assignment is known, nobody can prove the request was
              made on clinical grounds. Telling the monitoring committee can wait; telling the site
              file cannot.
        takesAsRead:
          - Blinding, and the several people it can fail for separately
        assumes:
          - each participant's assignment is held in a sealed record that can be opened
        takeaway: The blind exists for the trial; it is opened when a decision for one person needs it.
        format: SEQUENCE
        question: Order the four steps by what is lost if the step is skipped.
        cards:
          - Establish that the clinical decision actually turns on the assignment
          - Record the reason, the time and the authorising name before the code is opened
          - Open that participant's code and tell the treating registrar
          - Enter the participant on the monitoring committee's unblinding log
        order: [0, 1, 2, 3]
        answerText: Establish that the decision turns on it, write down why before opening, open it, then enter it on the committee's log. The first two cannot be reconstructed afterwards; the last can be done in the morning.
        why: The first step cannot be recovered, because it cannot be established after the fact. Once the registrar knows the assignment, nobody can show the request rested on clinical need rather than curiosity. The written reason is the same problem in another form. A note made before the envelope is opened is evidence. One made afterwards is an account. Only then is the code opened, and the participant treated on what is known. Notifying the committee and flagging her in the analysis plan matters, and costs nothing by waiting until morning. That is why it is last rather than unimportant. The blind protects the comparison across four hundred people. It is opened for one of them when a decision for that person turns on it. The price is paid in the analysis, not argued about at three in the morning.

  # ---------------------------------------------------------------- day 5
  - title: The site that is faster than everybody
    objective: Work out why site 12 recruits twice as fast as anyone else.
    briefing: One site's screening log is shorter than every other site's.
    stake: >-
      Friday, 17 days out. Site 12 has randomised more than twice its expected share and Nuno
      Iriarte has been thanked publicly for it twice. Marchetti has now put his screening log beside
      the other 30 and found that where most sites screen 4 people to enter 1, site 12
      enters almost everyone it sees. Balogun reads that as a site that has organised itself well.
      Today you work out which of those readings the log actually supports, and what it would mean
      for the trial if the fast site is also entering a different kind of participant from everybody
      else.
    takeaway: A site cannot see what is unusual about itself.
    stops:
      - group: SITE
        task: Choose the explanation that fits the whole screening log, not just the high entry rate.
        title: What a short screening log says
        place: Monitors' Room
        scene: 31 screening logs on 1 page. Most sites screen four and enter one. Site 12 screens 11 and enters 9, and its consent rate is the highest in the trial.
        guide: >-
          Four explanations for a short screening log. Ask of each what the log would
          look like if it were true. The high entry rate is not the strongest clue. The
          nearly empty reasons column is. Eleven screened and nine entered should still
          record why two were not, and a year should show many who failed before
          consent.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        takesAsRead:
          - Eligibility criteria, and what widening them changes
        assumes:
          - sites record everybody they assess as well as everybody they enter
        takeaway: Recruitment figures describe a funnel, and an empty log hides the top of it.
        format: CHOICE
        question: Which explanation best fits site 12's screening log?
        answerText: Site 12 appears to be logging people only after an informal pre-screen. That makes the visible funnel look unusually efficient because many people who were considered never appear at its top.
        why: The high entry rate is not the strongest clue. The nearly empty reasons column is. A site that truly screened 11 people and entered 9 should still record why the other 2 were not entered. Across a year, it should also show many people who failed before consent. If those people never reach the log, the trial cannot describe who was considered and passed over. The result is a selected group whose recruitment funnel cannot be reconstructed.
        headline: Site 12 enters 9 of every 11 people it logs as screened. Most sites enter about one in four.
        readings:
          - zone: Site 12 funnel
            label: Screened to entered
            value: 9 in 11
            status: alarm
          - zone: Other 30 sites
            label: Screened to entered
            value: 1 in 4
            status: normal
          - zone: Reasons column
            label: Not-entered reasons written down
            value: 2 in a year
            status: alarm
          - zone: Consent
            label: Refusals at site 12
            value: lowest in the trial
            status: high
          - zone: Deviations
            label: Entries failing a criterion
            value: none found
            status: normal
            note: the entries themselves are eligible
        choices:
          - label: The site is screening after it has already decided
            mechanism: People who would not qualify never reach the log, so the funnel looks efficient.
          - label: The site is entering people who do not qualify
            mechanism: Ineligible entries would show up as deviations, and none are recorded.
          - label: The site's population is genuinely more eligible
            mechanism: A different catchment would raise entries without emptying the reasons column.
          - label: The site is unusually good at explaining the trial
            mechanism: Better consent conversations would move refusals and nothing else.
        answer: The site is screening after it has already decided
      - group: RAND
        task: Check how the assignments have landed at site 12
        title: Balance is bought in blocks
        concept: "Randomisation: what chance assignment buys, and what it cannot buy"
        place: Kit Warehouse & Cold Room
        scene: >
          Diouf pulls site 12's kit records. The site has entered 94 participants, 49
          to 1 arm and 45 to the other, in a sequence that never runs more than 4 the
          same way.
        guide: >-
          Four purposes for a short block. Ask of each whether it is bought or paid for.
          Chance is fine over two thousand people and unreliable over ninety. Blocks
          force the counts to catch up every few entries. Predictability is the price
          rather than the point, which is why the block length varies and nobody at the
          site is told it.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - assignment is by chance, in a sequence prepared before the trial opened
        takeaway: Chance alone is unreliable in small numbers, which is why the sequence is constrained.
        format: CHOICE
        question: Why is the sequence built so that no run of the same arm goes past four?
        choices:
          - It keeps the arms close in size at every site
          - It stops any site from receiving more of one treatment than another over the trial
          - It makes the next assignment harder for a coordinator to guess
          - It spreads the drug's supply evenly across the shipping schedule
        answer: It keeps the arms close in size at every site
        why: >
          Pure chance is fine over 2000 people and unreliable over 90. A site that closes
          at 19 participants could easily have 13 on 1 arm and 6 on the other, and
          any difference between sites then partly becomes a difference between arms. Working in
          small blocks forces the counts to catch up every few entries, so the arms are balanced
          within each site at every point. The cost is predictability, which is why the block length
          varies and why nobody at the site is told what it is.
        rebuttals:
          - Equal totals across the whole trial follow from balance at each site rather than being what blocking is for.
          - Blocking makes the sequence a little more guessable, not less; varying the block length is the fix.
          - Supply is planned from recruitment forecasts and does not drive the allocation sequence.
      - group: ENDP
        task: Change 1 feature of the re-scoring setup at a time and find which change removes site 12's offset.
        title: Make the three-point offset move
        place: Adjudication Room
        scene: Kwame Ansah has matched visit records from site 12 and 3 comparison sites. The symptom score sits about 3 points higher at site 12. A re-scoring console can change one feature of the setup for the same records.
        guide: >-
          The number you are watching is the offset in symptom score between site 12 and
          the comparison sites, currently about three points. The console can change one
          feature of how the same records were produced, and the run-to-run noise is
          about half a point, so anything smaller than that is not a response. Change
          one, run it, restore it, and name the feature the offset follows.
        background:
          - >-
              Why the records are held fixed. Nothing about the patients changes in this
              console: the same visits, the same people, the same dates. Only a feature of
              how the score was produced changes. That is what makes it a controlled
              comparison rather than a new study, and it is why a response points at the
              procedure rather than at the disease.
          - >-
              What the three candidates are for. Who does the scoring, how visit days were
              matched, and what mix of cases each site saw are three ordinary ways a site
              can look different without being different. Each is a real explanation
              somebody at the meeting will offer, and only one of them survives being
              switched.
          - >-
              Why half a point is the floor. Rescoring the same records twice does not give
              the same number twice — scales have judgement in them. That scatter is the
              yardstick every response has to beat, and a difference under it is a
              measurement of the yardstick rather than of the site.
        takesAsRead:
          - Hard endpoints against judged ones, and blinded adjudication
        assumes:
          - a systematic offset is a repeated shift rather than random scatter
          - a control test changes one factor while holding the rest fixed
        takeaway: A suspected cause becomes persuasive when changing only that factor moves the reading and reversing it brings the effect back.
        format: CONTROL
        question: Which single change makes the offset disappear, and does putting it back restore the offset?
        control:
          baseline: 3
          noise: 0.5
          variables:
            - id: reader
              label: Who scores the same records
              change: Use a blinded central reader
            - id: visit_day
              label: Visit-day matching
              change: Match visits to the same study day
            - id: case_mix
              label: Case mix
              change: Use a severity-matched subset
          hint: Run one change at a time. Compare its shift with the 0.5-point noise, then put the changed factor back and run again.
          response: -2.8
          truth: reader
          observable:
            label: Site 12 offset
            unit: score points
        answerText: "Changing the reader removes the offset: it falls from about 3.0 points to 0.2, a 2.8-point shift. Restoring the site reader brings it back to about 3.1, while the other changes stay inside the noise threshold."
        why: A site-wide offset can come from the patients, the timing of visits or the person applying the scale. The hard endpoint already argues against a healthier site 12 population. The control test goes further. It keeps the same records and changes one candidate cause at a time. Only the reader change moves the score by far more than the background noise. When the original reader is restored, the offset returns. That reversal is much stronger evidence than a correlation between site and score.
  # ---------------------------------------------------------------- day 6
      - group: SITE
        task: Hold the recruitment rate while the sites vary.
        title: Eleven a week, through the summer
        takesAsRead:
          - "Eligibility criteria, and what widening them changes"
        concept: "The recruitment funnel: screened, eligible, consented, entered"
        place: Site Office
        scene: The trial needs eleven entries a week to finish on time. Sites go on holiday, a competing trial opens at the largest one, and the only lever the office has is where it puts its monitors and its money.
        guide: >-
          Hold the entry rate inside the band on the tracker. The band narrows as the summer
          goes on, because the shortfall that could be made up in September cannot be made up
          in November. Site support is your control, and every change at a site keeps costing
          entries until the support answers it.
        background:
          - >-
              Why a rate rather than a total. Recruitment is a funnel — screened, eligible,
              consented, entered — and each stage has its own losses. A site that stops screening
              does not lose one patient; it loses its share of every week that follows.
          - >-
              Why a shortfall compounds. The trial ends when its events accumulate, and events
              accumulate from patients already in it. A patient not entered in July is not
              contributing follow-up in August either, so a week's shortfall costs more than a
              week.
          - >-
              Why the band tightens. Early in the summer there is time to recover; by the end there
              is not. The same rate below target is a larger fraction of what remains recoverable
              with every week that passes.
        assumes:
          - a trial enters patients at some rate over time
        takeaway: A shortfall in a rate is not made up by a good week later.
        format: HOLD
        question: Hold the entry rate at eleven a week through the summer.
        answerText: Inside the band for most of the summer, with support moved to answer each site's problem rather than added after the tracker has already fallen.
        why: >-
          Recruitment is a rate and every disturbance to it is a rate too. A site's principal
          investigator going on leave does not cost one patient; it costs that site's weekly
          share for as long as the leave lasts. A competing trial at the largest site takes a
          fraction of every week's screening from then on. A new site opening adds a fraction
          the same way. None of them is a step, which is why moving a monitor for one week and
          moving them back changes nothing that lasts. And the shortfall compounds in a way a
          simple total would not show: an event-driven trial finishes when its events
          accumulate, and events come from patients already enrolled, so a patient not entered
          in July is also not contributing follow-up in August. That is why the band narrows
          through the summer. The same rate below target is recoverable in June and is the
          trial's timeline in September.
        hold:
          quantity: Entries a week
          unit: patients
          control: Site support
          hold: 11
          band: 0.4
          narrowTo: 0.2
          duration: 45
          direction: raise
          authority: 0.1
          pass: 0.8
          hint: Each site problem keeps costing entries. Move support to answer it rather than reacting to the tracker.
          disturbances:
            - { label: The lead investigator goes on leave, at: 4, amount: -0.03 }
            - { label: Two new sites come on line, at: 20, amount: 0.05 }
            - { label: Competing trial opens at the largest site, at: 38, amount: -0.045 }
          commit: Report the summer
  - title: The amendment comes back
    objective: Find out what widening the entry criteria has done to the trial.
    briefing: Recruitment recovered. The event rate did not.
    stake: >-
      Monday, 14 days out. The amendment signed eight months ago to keep recruitment on
      schedule widened two entry criteria, and it worked: the trial filled. The data manager, Tobias
      Renner, has now plotted events against months and the curve has flattened since. Feldman thinks the trial is further
      from its answer than the calendar says; Balogun signed the amendment and says the alternative
      was a trial that never finished at all. Today you work out how much information CLARION-3
      actually holds, what the flattening does to the interim in a fortnight, and whether the 2
      of them are disagreeing about anything real.
    takeaway: A trial's progress is measured in events, and a decision made a year ago can slow them.
    stops:
      - group: STAT
        task: Work out how far through the trial really is
        title: How much of the trial has happened
        concept: Sample size and statistical power
        place: Statistics & Analysis
        scene: >
          Feldman has two numbers on the board: the events CLARION-3 was designed to need, and the
          events adjudicated so far. Balogun has a third, the months elapsed, and thinks it tells
          the same story.
        guide: >-
          Five numbers, and three of them measure calendar time or people: the months
          elapsed, the months planned, and the number randomised. Ask of each whether an
          interim boundary depends on it. A trial three quarters through its years can
          hold half its events. That is why the meeting moves when the event curve
          flattens, and the date does not.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - the trial is powered on a number of events rather than a number of people
        takeaway: The share of the planned events already collected is what says how far through a trial is.
        format: BALLPARK
        question: Estimate the fraction of CLARION-3's information that is in hand today.
        why: >
          Calendar time and information are different quantities, and only one of them decides what
          an interim can say. A trial three quarters of the way through its planned years may hold
          half its events, because the people recruited late have been followed for months rather
          than years and because a healthier group produces events more slowly. The boundary at each
          interim is set by the information fraction, not by the date, so a flattening event curve
          moves the meeting without moving the calendar. It is also why finishing takes longer than
          anyone forecasts.
        estimate:
          prompt: >
            CLARION-3 was designed to need 380 adjudicated events. The database holds 246 of them
            this morning. The information fraction is the events in hand divided by the events
            planned.
          question: Choose the events collected and the events planned.
          labels:
            - 246  (adjudicated events in hand)
            - 380  (events the design requires)
            - 2400  (participants randomised)
            - 41  (months since the first participant)
            - 54  (months planned in total)
          values: [246, 380, 2400, 41, 54]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 0.65
          tolerance: 0.06
          units: of the planned information
          solution: 246 ÷ 380 ≈ 0.65.
          explanation: >
            About two thirds. By months the trial looks 3 quarters done — 41 of 54 — and the 2
            numbers disagree because the amendment brought in people at lower risk. The boundary the
            board reads in a fortnight is set from the 0.65, not from the calendar.
          givens:
            - The design requires 380 adjudicated events
            - 246 have been adjudicated so far
          relationship: >
            Information fraction = events observed ÷ events planned, and it sets the boundary: the
            number of looks at an unadjusted 0.05 would cost 1 − 0.95² ≈ 0.10, so alpha spent stays
            inside 0.05.
        answerText: About 0.65 — roughly 2 thirds of the information.
      - group: SITE
        task: Work out who the amendment brought in
        title: Who a wider door lets in
        place: Monitors' Room
        scene: >
          Marchetti has the entry criteria as they were and as they are, with the participants
          recruited under each. Balogun wants to know whether the amendment cost anything he
          should have seen coming.
        guide: >-
          The amendment brought in people at lower risk, so the hazard ratio the trial can
          expect moved from 0.75 toward 0.85. Work out how many events the trial now needs to
          answer its question at the same power. The numerator is the same for both; what
          changes is the squared logarithm underneath. One tile is that term for the original
          criteria, which is the comparison rather than the answer.
        background:
          - >-
              Why events and not people. An event-driven trial is powered by how many events it
              observes, not by how many participants it enrols. Recruiting lower-risk people adds
              participants who contribute little to that count, which is why a wider door can grow
              the trial and slow it down at the same time.
          - >-
              Why the effect size is squared underneath. The number of events needed goes as one
              over the square of the log hazard ratio, so a treatment effect that dilutes a little
              costs a lot. Moving from 0.75 to 0.85 roughly triples the events required, which is
              the amendment's real price.
          - >-
              What the amendment did not do. It did not make the treatment work less well. It
              changed who is in the trial, and therefore the average effect the trial is measuring
              and how often its event happens. Both belong in the sentence, and only one of them
              is usually said out loud.
        assumes:
          - entry criteria decide who may be randomised
        takeaway: Widening entry changes who is in the trial, and therefore how often the trial's event happens.
        format: BALLPARK
        question: How many events does the trial need now the wider criteria have diluted the expected effect?
        answerText: About 1,190 events, against 380 under the original criteria. The amendment tripled the trial's information requirement without anybody changing the power or the threshold.
        why: "The event requirement is events ≈ 4 (z_{α/2} + z_β)² / (ln HR)². At 5 per cent two-sided and 80 per cent power the z terms are 1.96 and 0.84, so the numerator is 4 × 2.80² ≈ 31.4 and it does not change. Under the original criteria the expected hazard ratio was 0.75, so (ln 0.75)² = 0.0828 and the trial needed 31.4 ÷ 0.0828 ≈ 380 events. The amendment admitted lower-risk participants whose expected benefit is smaller, moving the trial-wide hazard ratio to about 0.85: (ln 0.85)² = 0.0264, and 31.4 ÷ 0.0264 ≈ 1,190 events. Three times the information for the same question, because the effect size sits squared in the denominator. And the second cost compounds it: lower-risk participants have events less often, so each new enrolment contributes less to the count the trial is waiting for. The amendment grew the trial and slowed it down, and neither effect was on the form that authorised it."
        estimate:
          prompt: At 5 per cent two-sided and 80 per cent power the numerator is 4 × (1.96 + 0.84)² ≈ 31.4. The diluted hazard ratio is 0.85, so (ln 0.85)² ≈ 0.0264.
          question: Choose the numerator and the squared log hazard ratio for the wider criteria.
          labels:
            - 31.4  (4 × (z + z)² at 80 per cent power)
            - 0.0264  ((ln 0.85)², the diluted effect)
            - 0.0828  ((ln 0.75)², the original effect)
            - 0.85  (the diluted hazard ratio itself)
            - 380  (events needed under the original criteria)
          values: [31.4, 0.0264, 0.0828, 0.85, 380]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 1189
          tolerance: 80
          units: events needed
          solution: 31.4 ÷ 0.0264 ≈ 1,190 events, against 31.4 ÷ 0.0828 ≈ 380 before the amendment.
          explanation: The effect size is squared in the denominator, so a small dilution triples the events the trial has to see.
          givens:
            - numerator 31.4 at 5 per cent two-sided and 80 per cent power
            - hazard ratio diluted from 0.75 to 0.85 by the wider criteria
          relationship: The trial needs events ≈ 4 (z_{α/2} + z_β)² / (ln HR)² — so the events needed to detect an effect rise as the square of the effect shrinks.
      - group: REG
        task: Establish what the amendment obliged the trial to do
        title: Changing the plan, on the record
        place: Regulatory & Registry
        scene: >
          Umeh has the amendment file open: the change, the approvals, the registry update and the
          date each happened. One of the four is a fortnight later than it should be.
        guide: >-
          All four steps will happen, and one of them is a fortnight late. Ask of each
          what order makes the change defensible. Approved by outsiders, published
          before use, then handed to sites. That sequence shows the change was not
          chosen after seeing what it would do. Enrol first and register after, and
          nothing can ever show the two were independent.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency: each
              step is here because the one before it has already happened, or has to have.
              One transposed pair falsifies that claim wherever it sits, so partial credit
              would be credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained
              by having nothing before or after them, which usually makes them the two you
              can settle from the scene alone. Pinning them collapses the remaining
              arrangements sharply, and what is left in the middle is where the actual
              judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the
              only one. An order can run on cost, on risk, or on reversibility — every
              observation that leaves the sample as it was, before any that consumes it. On
              those boards a chronological reading finds nothing, because none of the steps
              has to happen at a particular hour.
        assumes:
          - the entry criteria are part of the protocol and can be amended
        takeaway: An amendment is judged by whether it was recorded before it was used, not by whether it was sensible.
        format: SEQUENCE
        task: Order what has to happen before a widened criterion may enrol anybody.
        cards:
          - The change is drafted with the reason it is being made.
          - The ethics committee and the regulator approve the amended protocol.
          - The public registry entry is updated to the new criteria.
          - Sites are trained on the new criteria and begin using them.
        order: [0, 1, 2, 3]
        why: >
          The order is the protection. A change made for a stated reason, approved by people outside
          the trial, published before it is used and only then handed to sites, is a change nobody
          can have chosen after seeing what it would do to the results. Enrol first and register
          afterwards and there is no way, ever, to show the two were independent. The audit does not
          ask whether widening was wise — it asks whether the record was made before it mattered.
  # ---------------------------------------------------------------- day 7
      - group: SITE
        task: Sort the screening log before the meeting.
        title: Eligible, or nearly
        concept: "Eligibility criteria, and what widening them changes"
        place: Monitors' Room
        scene: The screening log has more entries than the meeting has time for. Some of these people meet the protocol as written. The rest are close, and close is not a category the protocol has.
        guide: >-
          Two bins. Somebody is eligible if every criterion in the protocol is satisfied as it
          is written. Anything that requires reading a criterion generously is not eligible,
          however sensible the generosity looks. Sort on the protocol, not on the patient.
        background:
          - >-
              Why the line is where it is. Every criterion was written to make the trial's population
              the one the question is about. A patient admitted by a generous reading is in the
              analysis but not in the population, and nothing downstream can separate them again.
          - >-
              Why "nearly" is the dangerous pile. Nobody enrols somebody wildly ineligible. Trials
              are damaged by a hundred small generosities, each defensible on its own, which together
              make a population nobody planned and no protocol describes.
        assumes:
          - a protocol states who may be entered into a trial
        takeaway: A criterion read generously is a criterion the trial no longer has.
        format: BELT
        question: Send each screening entry to the bin that says whether the protocol admits them.
        answerText: Anything that satisfies every criterion as written is eligible. Anything needing a generous reading is not, however reasonable the generosity looks.
        why: >-
          Eligibility criteria are what make a trial's population the population its question is
          about, and they only work if they are applied as written. The dangerous entries are
          never the obviously ineligible ones — nobody enrols a patient twenty years outside the
          age range. They are the ones a sensible person would let through: an eGFR of 29
          against a limit of 30, an ejection fraction measured six weeks ago instead of four, a
          diagnosis made clinically rather than by the stated test. Each is defensible alone.
          A hundred of them together produce a trial population nobody planned, whose result
          applies to nobody in particular, and the analysis cannot separate them out afterwards
          because the log records that they were eligible. That is why the honest handling of
          a near-miss is a protocol amendment, prospectively, with the reason written down —
          and not a decision at the screening desk on a Thursday.
        belt:
          left: { name: Eligible as written }
          right: { name: Needs a stretch }
          need: 20
          lives: 3
          pass: 0.8
          hint: Ask whether any criterion has to be read generously.
          items:
            - { name: All criteria met, bin: left }
            - { name: Age within range, bin: left }
            - { name: Consent documented, bin: left }
            - { name: Echo within window, bin: left }
            - { name: Bloods in range, bin: left }
            - { name: Diagnosis by protocol, bin: left }
            - { name: Washout complete, bin: left }
            - { name: No excluded drug, bin: left }
            - { name: Both readings agree, bin: left }
            - { name: Enrolled at site, bin: left }
            - { name: Follow-up feasible, bin: left }
            - { name: Screening within window, bin: left }
            - { name: eGFR just under, bin: right }
            - { name: Echo six weeks, bin: right }
            - { name: Diagnosis made clinically, bin: right }
            - { name: Washout days short, bin: right }
            - { name: A year over, bin: right }
            - { name: Consent taken late, bin: right }
            - { name: Excluded drug stopped, bin: right }
            - { name: One reading only, bin: right }
            - { name: Screening window missed, bin: right }
            - { name: Outside-lab bloods, bin: right }
            - { name: Verbal consent first, bin: right }
            - { name: Criterion waived once, bin: right }
            - { name: Site-specific exception, bin: right }
            - { name: Investigator judgement, bin: right }
          commit: Start the line
  - title: Who is missing
    objective: Decide what to do about the participants the trial has lost track of.
    briefing: 91 people have no outcome recorded, and they are not a random 91.
    stake: >-
      Tuesday, 13 days out. Renner's reconciliation says 91 participants have no
      twelve-month outcome: some moved, some withdrew, some stopped answering the phone. Ansah
      cannot adjudicate what nobody wrote down, and 48 of the 91 stopped attending
      in the weeks after a worsening episode was recorded in their notes. Doyle has asked, at the
      steering committee, what the trial intends to say about people it lost, and whether the answer
      changes depending on which arm they were on. Today you decide how the missing are handled in
      the analysis the board reads in 13 days, what the sites should spend a fortnight
      chasing, and what CLARION-3 can honestly claim about the people it cannot find.
    takeaway: What you do about missing outcomes is a decision, and it has to be made before you see them.
    stops:
      - group: ENDP
        task: Match each gap to what it does to the comparison.
        title: Missing is not one thing
        place: Adjudication Room
        scene: Friday’s database lock is now on the wall clock. Four kinds of missing record are still in the queue, each with a count beside it. Renner wants one rule for all of them before the next site call starts.
        guide: >-
          Four gaps and four consequences. Pair them by asking whether the reason for
          the gap is connected to how the person was doing. A move abroad is not.
          Stopping attendance after worsening is. A lost fax batch is recoverable. And
          one of them closes the door permanently, which is a different problem from
          either.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last
              pair looks forced: the fault is usually not in the join you are struggling
              with, but in one you made early and stopped questioning.
        assumes:
          - an outcome can be absent for reasons connected to the outcome itself
        takeaway: A gap that depends on what happened is not the same as a gap that does not.
        format: PROTOCOL
        why: Missing data are dangerous for different reasons. A missed visit because somebody moved is mostly a loss of precision. A missing outcome after a participant worsened is different, because the reason for the gap is tied to the thing being measured. That can bend the comparison. A form still sitting at a site is recoverable and should be chased before lock. Withdrawal of consent changes what the trial is allowed to pursue. One rule for every blank cell would hide these differences instead of managing them.
        columns:
          - Why the outcome is missing
          - What it does to the comparison
        scenarios:
          - The participant moved abroad and left an address.
          - The participant stopped attending after their symptoms worsened.
          - The site's fax machine lost a batch of forms in March.
          - The participant withdrew consent and asked for no further contact.
        choices:
          - "Little: the reason has nothing to do with how they were doing."
          - "A great deal: the sickest are disappearing, and possibly not evenly by arm."
          - Little, if the batch was whoever happened to be seen that week.
          - "Unknown, and unknowable: nothing more may be collected about them."
        mapping: [0, 1, 2, 3]
      - group: STAT
        task: Choose which population the board is shown
        title: Everyone as assigned
        concept: Intention to treat against per-protocol
        place: Statistics & Analysis
        scene: >
          Two analyses are on Feldman's desk. One counts everybody in the arm they were assigned.
          The other counts only those who completed treatment, and it shows a bigger effect.
        guide: >-
          Work the relative risk out for the analysis the board is shown — everybody in the arm
          they were assigned to, whatever they went on to do. Pick the event rate in the
          treatment arm and the event rate in the control arm and divide. Two of the tiles are
          the per-protocol rates, which is the other analysis and the other answer.
        background:
          - >-
              What relative risk is. The event rate in the treatment arm divided by the event rate
              in the control arm. Below one means fewer events on treatment. It says nothing about
              how many people that is — a relative risk of 0.7 can be six fewer events per hundred
              or six per hundred thousand, which is why it needs the absolute difference beside it.
          - >-
              Why as-assigned is the analysis of record. Randomisation made the arms alike in
              everything, including what nobody measured, and that balance belongs to the groups as
              assigned. Remove people for something that happened afterwards — stopping the drug,
              missing visits — and they are removed for a reason connected to how they were doing.
          - >-
              Why the smaller effect is the honest one. As-assigned usually shows less benefit, and
              that is not a defect of the method. It is the effect of being offered the treatment,
              which is the decision a doctor actually faces in a clinic where some patients will
              not finish the course.
        assumes:
          - some participants do not take the treatment they were assigned
        takeaway: Analysing people as assigned keeps the balance that randomisation bought.
        format: BALLPARK
        question: What is the relative risk in the analysis by assigned arm?
        answerText: 0.70 — a 30 per cent relative reduction. The per-protocol analysis gives 0.60, and the difference between those two numbers is the people it removed.
        why: "Relative risk is RR = p_treatment / p_control. As assigned, 84 of 600 on treatment had the event and 120 of 600 on control did, so the rates are 0.140 and 0.200 and RR = 0.70 — a 30 per cent relative reduction. Counting only those who completed gives 0.121 against 0.201 and RR = 0.60, which looks better and is not the same question. The people dropped from that second analysis stopped treatment, and stopping is connected to how they were doing, so the two arms are no longer alike in the way randomisation made them. The as-assigned figure is the effect of being offered the treatment, which is what a clinic faces. And note what neither number says: a relative risk hides how big the effect is. The absolute difference here is six events per hundred, so about 17 people have to be treated to prevent one — the honest headline, and it is not in the ratio."
        estimate:
          prompt: As assigned, 84 of 600 on treatment had the event and 120 of 600 on control did. Counting completers only gives 0.121 and 0.201.
          question: Choose the treatment-arm event rate and the control-arm event rate, as assigned.
          labels:
            - 0.140  (84 of 600 on treatment, as assigned)
            - 0.200  (120 of 600 on control, as assigned)
            - 0.121  (treatment rate among completers only)
            - 0.201  (control rate among completers only)
            - 600  (participants in each arm)
          values: [0.140, 0.200, 0.121, 0.201, 600]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 0.70
          tolerance: 0.03
          units: relative risk
          solution: 0.140 ÷ 0.200 = 0.70 as assigned, against 0.121 ÷ 0.201 = 0.60 among completers.
          explanation: 0.70 is the effect of being offered the treatment. The 0.60 is what the trial looks like once the people who stopped are removed.
          givens:
            - 84 of 600 events on treatment and 120 of 600 on control, as assigned
            - completers only give 0.121 and 0.201
          relationship: The relative risk is RR = p_treatment / p_control — the event rate on treatment over the event rate on control.
      - group: SITE
        task: Allocate the monitoring time so the required questions can still be answered before the file is frozen.
        title: 40 hours before the lock
        place: Monitors' Room
        scene: Lucia Marchetti has a fortnight, 31 sites and 40 monitoring hours she can still deploy. Four recoverable gaps compete for that time. 14 people who withdrew consent are locked out of the plan and cannot be contacted again.
        guide: >-
          Forty monitoring hours, four recoverable gaps, and a fortnight before the
          lock. Watch the questions list rather than the site map: it shows what the
          interim analysis can still answer under your plan. The fourteen who withdrew
          consent are locked out and cannot be contacted, so no plan recovers them —
          spend the hours on what is still recoverable.
        background:
          - >-
              What makes a gap recoverable. A missing form that exists on paper, a visit
              whose data was never entered, a query nobody answered. Those can be closed by
              somebody going to look. A withdrawal cannot, because the data no longer
              belongs to the trial.
          - >-
              Why the interim analysis defines value. Not every gap affects it. A missing
              secondary endpoint at a small site may not move anything, while a handful of
              missing primary events at a large one can decide whether the trial continues.
          - >-
              Why hours rather than sites. Monitoring time is the resource, and sites differ
              enormously in how long a gap takes to close. Four hours at a well-run site can
              recover more than a day at one in difficulty.
        assumes:
          - missing outcomes are most dangerous when the reason for missingness is tied to the outcome
          - withdrawal of consent prevents further contact
        takeaway: A monitoring plan is a set of questions it can answer and questions it deliberately leaves unanswered.
        format: ALLOCATE
        question: Which monitoring jobs buy the answers the interim analysis actually needs?
        allocate:
          pool:
            amount: 40
            unit: monitoring hours
          items:
            - cost: 0
              id: withdrawn14
              label: 14 people who withdrew consent
              reason: No further contact is permitted.
              protected: true
            - id: worsening48
              label: Trace 48 people lost after worsening
              cost: 28
            - id: paper7
              label: Recover seven paper outcome forms
              cost: 6
            - id: moved22
              label: Trace 22 people who moved or emigrated
              cost: 18
            - id: reverify20
              label: Re-verify 20 complete records
              cost: 12
          answers:
            - requires:
                - worsening48
              required: true
              question: Reduce outcome-dependent missingness before the cut
            - requires:
                - paper7
              required: true
              question: Restore outcomes already known to exist on paper
            - requires:
                - moved22
              required: false
              question: Reduce losses unrelated to health status
            - requires:
                - reverify20
              required: false
              question: Repeat checks on records already complete
          hint: The live panel shows which analysis questions your selected jobs can answer. You do not have enough hours to buy every job.
        answerText: Fund the 48 outcome-dependent losses and recover the 7 paper forms. Those 2 jobs cost 34 of 40 hours and protect the questions the interim must answer; neutral losses and already-complete records can wait.
        why: The dangerous gaps are not simply the largest ones. 48 participants disappeared after worsening, so their missingness is tied to the outcome itself. That can bend the comparison if the losses differ by arm. Seven outcomes already exist on paper and are cheap to restore. People who moved are missing for a more neutral reason, so tracing them mainly improves precision. Rechecking complete records buys less. The allocation should protect validity first, then spend any remaining effort on precision.
  # ---------------------------------------------------------------- day 8
  - title: The cold room
    objective: Work out which kit is compromised and what that obliges the trial to do.
    briefing: A freezer alarm at one site was silenced for two days in July.
    stake: >-
      Wednesday, 12 days out. Site 19's fridge logger shows 41 hours above the storage
      range in July, and the alarm was acknowledged twice and never escalated. Farida Diouf has the
      kit numbers that were in that fridge and can say exactly who received them. What she cannot
      say, and will not find out, is which of those boxes held the drug. Today you decide what the
      excursion means for the participants who received that kit, what has to be reported and to
      whom, and how the trial keeps a warm fridge from becoming a reason to open the blind.
    takeaway: A material problem becomes an analysis problem the moment it is not spread evenly across the arms.
    stops:
      - group: RAND
        task: Choose what the warm-storage excursion does to the comparison.
        title: Kit that cannot be vouched for
        place: Kit Warehouse & Cold Room
        scene: Site 19 has already dispensed 11 boxes from the warm fridge to 9 participants. Farida Diouf has the logger trace, dispensing list and stability sheets open. A replacement shipment will not reach the site until morning.
        guide: >-
          Four readings of a warm fridge. Ask of each whether the fault can act on both
          arms equally. Identical boxes can hold different contents, and heat has
          nothing to damage in a comparator. So the direction of the error is not
          symmetric. Eleven boxes is a question about size, which is separate from the
          question about direction.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - both arms receive kit that looks identical
        takeaway: A storage failure damages one arm's material and leaves the other untouched.
        format: CHOICE
        question: What is the most important effect of the site 19 excursion on the trial comparison?
        answerText: The excursion can weaken active drug without weakening the comparator. That makes the error one-sided, even though 11 boxes in a four-thousand-box trial are unlikely to move the overall estimate much.
        why: Identical boxes can hide different contents. Heat can damage active drug, while the comparator has no active material to lose. The excursion can therefore pull treated participants toward the control result. That is different from an error that affects both arms equally. 11 boxes are unlikely to change the whole trial, but the scale of the problem is a separate question from its direction. Recording the event lets later reviewers distinguish a small one-sided fault from a repeated one.
        headline: 11 boxes spent 41 hours above range at site 19. Nine participants received one of them.
        readings:
          - zone: Logger
            label: Hours above range
            value: 41
            status: alarm
          - zone: Pharmacy
            label: Boxes affected
            value: 11 of 4000
            status: normal
          - zone: Stability data
            label: Drug at that temperature
            value: potency falls
            status: alarm
          - zone: Comparator
            label: Standard-care kit
            value: nothing to degrade
            status: normal
          - zone: Blind
            label: Which boxes held drug
            value: not known at the site
            status: normal
            note: the numbers are known, the contents are not
        choices:
          - label: It can weaken active drug without weakening the comparator
            mechanism: Only one arm has material that heat can spoil, so the loss is one-sided.
          - label: It should affect both arms equally because the boxes look identical
            mechanism: Identical packaging would spread any harm across the arms evenly.
          - label: It invalidates every participant enrolled at site 19
            mechanism: Removing a site after the fact would rebalance what the excursion disturbed.
          - label: It can be ignored because only 11 boxes were involved
            mechanism: A fraction that small could not move an estimate either way.
        answer: It can weaken active drug without weakening the comparator
      - group: SITE
        task: Decide what the nine participants are told
        title: What the nine are owed
        place: Monitors' Room
        scene: >
          Nine people received kit from that fridge. Marchetti has to tell site 19 what to say to
          them, and Doyle has asked to see the wording before it goes.
        guide: >-
          Four things to tell nine people, and two duties pulling opposite ways. Ask of
          each whether it can be said to all nine equally without saying what is in the
          box. Saying they may have been under-treated says the drug is theirs. Saying
          nothing because the arms are unknown puts the blind above the person, which is
          the inversion the whole trial exists to avoid.
        background:
          - >-
              Why first is a different question from most important. When several calls
              compete for the same hour, what a choice is worth is not its own importance
              but the difference between doing it now and doing it later. A serious problem
              that will be no worse in an hour costs nothing to defer. A smaller one that
              closes a door costs everything behind that door.
          - >-
              What to look for in the options. Two things separate them: which is still
              changing, and which is a precondition for the others. A situation that is
              deteriorating has a cost per hour attached to it, and a step that unblocks the
              rest multiplies the value of the hours after it. Everything else is a
              preference about where to start.
          - >-
              Why only one answer is marked. In the situation these options describe all of
              them eventually happen; what is being tested is the head of the queue, because
              that is where the reasoning is visible. The verdict names what each of the
              others was waiting on, which is worth reading even when the choice was right —
              the ordering behind the first place is the rest of the answer.
        takesAsRead:
          - "Allocation concealment: protecting the moment of entry"
        assumes:
          - participants are told about problems that affect their own treatment
        takeaway: A participant is owed what affects them, said in a way that does not tell them their arm.
        format: TRIAGE
        question: What should the nine participants be told this week?
        choices:
          - That a storage fault may have weakened some kit
          - Nothing, because the boxes cannot be linked to individual arms anyway
          - That they received kit from a faulty fridge and may have been under-treated
          - Nothing until the board has reviewed the excursion in 12 days
        answer: That a storage fault may have weakened some kit
        why: >
          Two duties pull in different directions and both can be met. People are entitled to know
          about a fault that touched their own treatment, and telling them costs the trial nothing
          if the wording covers all nine equally. Saying they may have been under-treated says the
          drug is in the box. Saying nothing because the arms are unknown treats the blind as more
          important than the person, which is the inversion the whole trial is arranged to avoid.
          Waiting for the board is 12 more days for information that is already certain.
        rebuttals:
          - The link to arms is unknown, and the fault touched their treatment either way.
          - Telling somebody they were under-treated tells them which arm they are on.
          - The board reviews the excursion; it does not decide whether people hear about their own kit.
      - group: REG
        task: Use two verification checks on the claims in the excursion record before signing it as reviewable.
        title: What the excursion record can actually prove
        place: Regulatory & Registry
        scene: Nkechi Umeh has the site 19 excursion form, the logger trace, dispensing records and an inventory statement. Four claims on the form are signed. She has time to verify only two before the deviation file closes.
        guide: >-
          Four signed claims on the excursion form, and time to verify two. Open each
          and read what backs it: the logger trace, the dispensing records, the
          inventory statement, or the form itself. Hold what the evidence does not
          support, and verify where a wrong claim would most damage somebody's later
          judgement about whether the drug was fit to use.
        background:
          - >-
              What an excursion record is for. It documents a period when storage went
              outside its specified range, so that somebody later can decide whether the
              product was affected. It is written to be read by a person who was not there,
              which is exactly why the backing matters more than the wording.
          - >-
              Why the logger trace is not automatically the strongest evidence. It records
              what the logger saw at its position. Whether that position represents the
              product, whether the logger was calibrated, and whether the affected stock was
              in that location at that time are separate claims — and they are the ones
              usually signed rather than checked.
          - >-
              Why two checks and not four. The deviation file closes, and after that the
              record is what a reviewer sees. A claim held as unverified is honest; a claim
              verified after the file closes is a second deviation.
        assumes:
          - a deviation record is evidence for later review
          - a signed statement records what someone asserts, not necessarily what the underlying records show
        takeaway: A signed record is useful only when the claims that could change the conclusion are tied to evidence.
        format: ATTEST
        question: Which claims most need verification before this record can support somebody else's judgement later?
        attest:
          checks: 2
          claims:
            - id: duration
              label: The excursion lasted 41 hours
              critical: true
              backed: true
              evidence: continuous temperature logger trace
            - id: scope
              label: Only 11 kit numbers were exposed
              critical: true
              backed: false
              evidence: site inventory statement without stock reconciliation
            - id: recipients
              label: Nine participants received listed kits
              critical: true
              backed: true
              evidence: dispensing records linked to kit numbers
            - id: recovery
              label: The fridge returned to the allowed range
              critical: false
              backed: true
              evidence: current logger reading
          hint: A check opens the evidence behind one signed claim. Spend the two checks where a wrong claim would most change the size or meaning of the excursion.
        answerText: Verify the exposure scope and one of the backed critical claims. The weak point is the statement that only 11 kits were exposed; it needs stock reconciliation before the record can establish the excursion's true scope.
        why: A deviation form does not become reliable because somebody signed it. The duration can be checked against the logger, and the nine recipients can be checked against dispensing records. The important weak link is scope. If more than 11 kits were in the fridge, the size of the problem changes immediately. That claim needs an inventory reconciliation, not another signature. Recording the excursion still matters even if the final effect is small, because later reviewers can only challenge a judgement when its evidence survives.
  # ---------------------------------------------------------------- day 9
  - title: What the guessing survey found
    objective: Find out whether the people scoring the outcome knew which arm they were scoring.
    briefing: Investigators were asked to guess. They were right far more often than chance.
    stake: >-
      Thursday, 11 days out, and a routine questionnaire has come back wrong. At the last
      annual visit every investigator was asked to guess which arm each of their participants was
      on. Across 1,180 guesses they were right 71% of the time. Ansah's committee, who see
      no arms at all, are unaffected; the symptom score written by the treating doctor is another
      matter, and it is the score Iriarte and Doyle have both called the one patients care about.
      Today you work out what a guessing rate like that does to each of CLARION-3's outcomes, and
      what the board has to be told before it reads either.
    takeaway: A blind that has already failed cannot be restored by insisting on it.
    stops:
      - group: ENDP
        task: Choose the explanation that fits the guessing survey and the visible flush.
        title: The blind that had already gone
        place: Adjudication Room
        scene: At the annual visit, investigators and participants guessed each person's arm. Investigators were correct 71% across 1,180 guesses. The case packet also contains first-fortnight symptom logs, the allocation audit and the adjudicated outcome summary.
        guide: >-
          Four explanations for guessing right 71 per cent of the time. Ask of each
          whether it accounts for both investigators and participants guessing well. A
          leaked list would not. A treatment effect big enough to be visible in
          improvement is not in the event data. And chance across 1,180 guesses does not
          reach anywhere near 71.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - blinding is meant to keep the person measuring from knowing the arm
        takeaway: When a treatment announces itself, the people measuring stop being blind whatever the protocol says.
        format: CHOICE
        question: What best explains investigators guessing the treatment arm correctly 71% of the time?
        answerText: The visible early flush is the best explanation. It gives investigators information about assignment before they later write the symptom score. The protocol may still say blinded while the measurement process is not.
        why: 71% correct across 1,180 guesses is far from the 50% expected by chance. The visible flush also supplies a direct mechanism. Investigators can see it before they later score symptoms. A leaked allocation list could also raise guessing, but it would not explain participants guessing well too. Guessing from improvement would require a treatment effect much larger than the event data show. The survey therefore measures a real loss of blinding, not random noise.
        headline: Investigators guessed correctly 71% of the time. Chance would be 50%. First-fortnight logs show a visible flush concentrated in one arm.
        readings:
          - zone: Investigator guesses
            label: Correct
            value: 71%
            status: alarm
          - zone: Participant guesses
            label: Correct
            value: 68%
            status: alarm
          - zone: Adjudicators
            label: Files with arm shown
            value: none
            status: normal
          - zone: Drug profile
            label: Visible early effect
            value: flushing in most
            status: alarm
          - zone: Symptom score
            label: Written by
            value: treating doctor
            status: normal
            note: the same person who guessed
        choices:
          - label: The visible early flush is revealing assignment
            mechanism: A side effect anybody can see tells the doctor the arm before they write the score.
          - label: Someone has leaked the allocation list to investigators
            mechanism: A leak would raise guessing accuracy without any clinical signal to go on.
          - label: Investigators are inferring assignment from dramatic clinical improvement
            mechanism: Accurate guessing would then be a consequence of the treatment working.
          - label: 71% is a plausible chance fluctuation in 1,180 guesses
            mechanism: Across 1,180 guesses, ordinary variation would put the figure near 50.
        answer: The visible early flush is revealing assignment
      - group: STAT
        task: Open each measurement's dependencies, keep the ones that do not inherit the blinding leak, and name the shared source.
        title: Which measurements share the leak
        place: Statistics & Analysis
        scene: Feldman has 4 CLARION-3 measurements on the wall. The guessing survey says the blind has leaked. Each measurement came through a different path, and the sponsor wants to know which evidence still stands on its own.
        guide: >-
          Open each of the four measurements to see what it came through. Keep the ones
          that would still stand if the blind has leaked, and untick the rest. Then name
          the source the compromised ones share. A leak does not spoil everything
          equally, and the sponsor needs to know exactly what survives.
        background:
          - >-
              What a blind is protecting. If people know which arm a patient is in, that
              knowledge can reach the measurement: through how symptoms are elicited, how
              ambiguous events are coded, how closely anybody is followed up. Blinding is
              what stops the treatment assignment influencing the record of what happened.
          - >-
              Why the guessing survey matters. Asking staff to guess the assignment measures
              whether the blind held. Guesses much better than chance mean it did not, which
              puts every measurement that passed through a person who knew under suspicion —
              and leaves the automated ones alone.
          - >-
              Why withdrawing everything is the wrong response. It discards measurements the
              leak could not have touched, and it tells a data monitoring committee that
              nothing is known. Naming what is compromised is what lets the trial continue
              honestly.
        assumes:
          - the visible flush can reveal treatment assignment
          - adjudication removes the arm and site before the committee rules
        takeaway: Agreement counts as independent evidence only when the measurements do not share the same route for bias to enter.
        format: TRACE
        question: Which measurements remain independent of the leak, and what source compromises the others?
        trace:
          channels:
            - id: symptom
              label: Symptom score
              reading: Treatment-arm symptom scores average 3.4 points better than control.
              depends:
                - visible_flush
                - clinician_belief
            - id: kit
              label: Returned-kit adherence
              reading: Returned-kit adherence is 89% in treatment and 84% in control.
              depends:
                - visible_flush
                - participant_belief
            - id: event
              label: Adjudicated admission
              reading: "Adjudicated admission: 14.7% treatment versus 18.9% control."
              depends:
                - source_record
                - blinded_committee
            - id: death
              label: All-cause death
              reading: "All-cause death: 2.8% treatment versus 3.1% control."
              depends:
                - national_register
          target: visible_flush
          hint: Open the dependency tree behind each measurement. Keep a channel only if its path does not pass through the source you think caused the blinding failure.
          resources:
            - id: visible_flush
              label: early visible treatment effect
            - id: clinician_belief
              label: treating clinician's arm belief
            - id: participant_belief
              label: participant's arm belief
            - id: blinded_committee
              label: blinded adjudication committee
            - id: source_record
              label: hospital source record
            - id: national_register
              label: national death register
          independent:
            - event
            - death
        answerText: Keep the adjudicated admission and all-cause death as independent channels. The symptom score and returned-kit measure both have a path through the visible flush, which can reveal assignment before those measurements are produced.
        why: A blinding failure does not contaminate every number automatically. Bias needs a path. The treating clinician can see the flush, infer the arm and then write the symptom score. Participants can see the same flush and change how they take or return kit. The adjudication committee sees neither arm nor site, so that route is cut. The national death register is farther away still. Dependency tracing shows why four results pointing the same way are not automatically four independent pieces of evidence.
      - group: SAFE
        task: Decide what has to enter tonight’s pack before the board sees the interim results.
        title: Telling the board what it does not yet know
        place: Monitoring Board Room
        scene: Vogt reads the interim pack in 11 days, and the PDF is queued for sign-off tonight. The guessing survey is absent because nobody expected it to matter. Balogun wants to leave it for the annual report.
        guide: >-
          Four things about the trial's condition, and four ways a pack can carry them. Match
          each to the treatment that lets the board weigh it — some belong in the results
          section, one belongs in a limitations paragraph the board reads before the numbers,
          and one is genuinely an annual-report item. What decides the match is whether the
          board's next decision turns on it.
        background:
          - >-
              What the board is for. It is the only body that sees the arms separated, and it
              decides whether the trial continues. Everything it decides rests on the pack in front
              of it, so a weakness the pack does not mention is a weakness that cannot enter the
              decision.
          - >-
              Why a limitation is not an admission. A blinding survey suggesting the assignment may
              be guessable changes how much weight the effect estimate carries. Reported beside the
              estimate, it is information. Held for the annual report, it becomes something the
              board was not told before it decided, which is a different document to have to write.
          - >-
              What genuinely can wait. Enrolment running two months behind is a management problem
              with no bearing on whether the accumulated data support continuing. The test is not
              importance in general — it is whether this board's next decision turns on it.
        assumes:
          - the board decides whether the trial continues
        takeaway: A board cannot weigh a result whose weakness it has not been shown.
        format: PROTOCOL
        question: Match each fact about the trial's condition to the way tonight's pack should carry it.
        scenarios:
          - A blinding survey suggests treating teams may be guessing the assignment above chance.
          - Two sites have deviation rates four times the study average.
          - The interim effect estimate is based on 246 of the 380 planned events.
          - Enrolment is running two months behind the recruitment curve.
        choices:
          - A limitations paragraph placed before the efficacy tables, so it is read before the estimate it qualifies.
          - A per-site table in the body, since the comparison is only as good as the sites feeding it.
          - Stated as an information fraction beside every estimate, because it fixes how much any of them can settle.
          - A line in the operational annexe, which is where a management problem belongs.
        mapping: [0, 1, 2, 3]
        answerText: The blinding survey goes in a limitations paragraph before the tables, the deviation rates in a per-site table, the event count beside every estimate as an information fraction, and the recruitment shortfall in the operational annexe.
        why: A monitoring board's decision is made out of the pack, so the placement of a fact is not presentation — it decides whether the fact enters the decision at all. The blinding survey qualifies every efficacy number in the document, which is why it goes before them rather than after: a board that reads an estimate and then learns the blind may have leaked has already formed a view. Deviation rates belong site by site in the body, because a comparison is only as good as the sites feeding it and an average hides the two that are the problem. The event count is not a footnote either — 246 of 380 is the information fraction, and it fixes how much any estimate in the pack can settle. Recruitment running behind is real and belongs in the annexe, because nothing the board decides tonight turns on it. What makes the survey the hard case is that leaving it out is defensible one item at a time and indefensible as a decision: the board cannot weigh a weakness it has not been shown.

  # ---------------------------------------------------------------- day 10
  - title: What survives
    objective: Re-read the trial on the outcome the unblinding could not reach.
    briefing: Take the compromised score out and see what is left.
    stake: >-
      Friday, ten days out. Ansah's committee has re-read every ambiguous file from the past year
      with the site and the arm stripped, as always, and Petrescu has run the adjudicated endpoint
      for the closed report. The effect on the symptom score was large; on the adjudicated events it
      is smaller and it is still there. Feldman says that is the number the trial always had.
      Balogun says a smaller real effect is still a reason to stop giving people the other arm.
      Today you work out what the surviving result actually says, how precisely it says it, and what
      CLARION-3 does about the blind for the participants still being recruited.
    takeaway: A finding that shrinks when the bias is removed was partly the bias.
    stops:
      - group: ENDP
        task: Check the committee's re-read for the thing it could still get wrong
        title: Reading the same files twice
        place: Adjudication Room
        scene: |-
          The committee has re-read 400 files. Ansah is asked whether a second reading by the same three people, who now know a guessing survey exists, can be trusted at all.
        guide: >-
          The cloud is the 400 files, each plotted as the difference between its first and
          second reading. Place the middle bar and the two sigma bars to report where the
          differences centre and how widely they scatter, then buy what the committee can
          actually do to tighten the agreement. The band drawn across the plot is how much
          drift the endpoint definition tolerates.
        background:
          - >-
              What a difference of zero would mean. That the rule decided the reading, not the
              reader. A centre away from zero is drift — the second pass systematically scoring
              differently from the first — and a wide scatter is inconsistency, which is a different
              defect with a different fix.
          - >-
              Why the two are not the same problem. Re-centring a drifted committee is a
              recalibration: restate the rule, define the ambiguous case, and the middle moves. Only
              a sharper rule narrows the spread, and no amount of re-centring does it, which is what
              this panel is really about.
          - >-
              Why knowing the survey exists is dangerous. Three people who now expect the blind may
              have leaked are three people with a reason to read the ambiguous files differently, and
              their agreement with each other would not show it. Consistency between two readings
              comes from the rule, not from memory of what they decided last time.
        takesAsRead:
          - Hard endpoints against judged ones, and blinded adjudication
        assumes:
          - the adjudication committee never sees the arm
        takeaway: Consistency between two readings comes from the rule, not from memory.
        format: CLOUD
        question: Report where the first-to-second-reading differences centre and how far they scatter, and get the spread inside what the definition tolerates.
        answerText: Centred near 0.2 events per hundred files with a spread of about 1.6 once the ambiguous case is defined and a fourth reader added. Re-centring alone never gets there — only a sharper rule narrows the scatter.
        why: A re-read is worth something only if the rule did the deciding. Plotted as first reading minus second, 400 files scatter around a centre near 0.6 events per hundred, with a spread of about 2.9. That is a committee both slightly drifted and quite inconsistent. Those are two defects, and they have different repairs. Restating the definition moves the centre and leaves the width alone. Defining the one ambiguous case narrows it. A fourth reader who has never seen these files narrows it again. Apply every re-centring and no rule change, and the spread sits exactly where it was. That is the lesson. Agreement between two readings by the same people can be manufactured by memory. Only a rule that decides the ambiguous case the same way twice makes it evidence. The guessing survey matters for that reason. Three readers who suspect the blind has leaked have a reason to read the ambiguous files differently, and agreeing with each other would never reveal it.
        cloud:
          unit: events per hundred files
          hint: Place the middle bar and the sigma bars from the points, then buy what the committee can do and place them again.
          bounds:
            min: -2
            max: 2
          centre: 0.6
          spread: 2.9
          pass: 0.75
          actions:
            - id: restate
              label: Restate the endpoint definition at the start of the session
              effect: shift
              amount: 0.4
              cost: 1
            - id: ambiguous
              label: Define the ambiguous case that accounts for most disagreements
              effect: narrow
              amount: 0.68
              cost: 2
            - id: fourth
              label: Add a fourth reader who has never seen these files
              effect: narrow
              amount: 0.82
              cost: 2
          costUnit: committee sessions
          report:
            centreTol: 0.5
            spreadTol: 0.7
          commit: Report the drift and the scatter
      - group: STAT
        task: Translate the effect into NNT, then put a number on the sampling noise behind one arm rate.
        title: How big, and how wide
        place: Statistics & Analysis
        scene: The press office has lifted “4.2 percentage points” into a draft briefing. Feldman circles the interval beside it. Before the number leaves the room, she wants the team to put both clinical size and sampling noise on the result.
        guide: >-
          Five numbers, and two of them are answers to other questions: the risk ratio,
          and the risk difference already worked out. Ask of each what this calculation
          needs. The number needed to treat is built from the absolute difference, not
          the ratio. And precision is a separate question from size, which is why the
          interval is circled beside the headline.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        takesAsRead:
          - "Effect measures: relative risk, absolute risk reduction, number needed to treat"
        assumes:
          - the 2,400 participants are allocated about equally between 2 arms
          - a proportion estimated from a sample has sampling error
        takeaway: Effect size says how large the difference is; standard error says how much the estimate would move across repeated samples.
        format: BALLPARK
        question: Estimate the NNT, then estimate the standard error of the 18.9% control-arm event rate.
        answerText: About 24 people treated for 1 event avoided; the control-arm event rate has SE ≈ 0.011, or 1.1 percentage points.
        why: The risk difference and NNT describe the size of the observed benefit. Precision is a different question. For a proportion, standard error depends on both the event rate and the number measured. With about 1,200 people in the control arm, an 18.9% rate has an SE near 1.1 percentage points. A 95% margin is about twice that. Increasing the sample narrows this uncertainty only with the square root of n, so halving the SE takes about four times as many people.
        estimate:
          prompt: The adjudicated event happened in 18.9% of control and 14.7% of treatment, with about 1,200 people per arm. First use ARR = p_control − p_treatment and NNT = 1/ARR. Then use SE = √(p(1−p)/n) for the control rate and 1.96 × SE for a 95% margin.
          question: Choose the two event rates and the approximate number in one arm.
          labels:
            - 0.189  (control arm event rate)
            - 0.147  (treatment arm event rate)
            - 0.78  (the risk ratio, which is not what NNT is built from)
            - 1  (the numerator in NNT)
            - 0.042  (the absolute risk reduction, already worked out)
          values: [0.189, 0.147, 0.78, 1, 0.042]
          slots: 3
          template: "{2} ÷ ({0} − {1})"
          formula: c/(a-b)
          correct: [0, 1, 3]
          target: 23.8
          tolerance: 3
          units: people treated per event avoided
          solution: ARR = 0.189 − 0.147 = 0.042; NNT = 1/0.042 ≈ 24. SE = √(0.189×0.811/1200) ≈ 0.0113; 1.96×SE ≈ 0.022.
          explanation: NNT is about 24. The control-arm SE is about 0.011, or 1.1 percentage points, so its 95% margin is about 2.2 points. The first number describes clinical size; the second describes sampling precision. Halving that SE would require about four times the sample, not twice.
          givens:
            - Control arm event rate 18.9%
            - Treatment arm event rate 14.7%
          relationship: ARR = p_control − p_treatment; NNT = 1/ARR; SE = √(p(1−p)/n); a 95% margin is about 1.96 × SE.
      - group: RAND
        task: Decide what to do about the blind for everybody still enrolling
        title: What to do about a blind that leaks
        place: Kit Warehouse & Cold Room
        scene: >
          600 participants are still in follow-up and the flush has not stopped happening.
          Diouf has been asked whether there is anything the pharmacy can do about it at this stage.
        guide: >-
          Four options for a blind that has already leaked. Ask of each what it could
          still protect. Nothing recovers the blind for anybody who saw the first
          fortnight. What can be protected is the route from belief into the number.
          Matching the comparator is the right design, four years too late. And a
          limitation paragraph fixes nothing while six hundred people are still being
          scored.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - the drug produces an early visible effect that the comparator does not
        takeaway: When a treatment cannot be hidden, protect the measurement instead of pretending the blind holds.
        format: CHOICE
        question: What is the best available fix for the remaining follow-up?
        choices:
          - Scoring by someone who never sees the early visits
          - Add a substance to the comparator so it produces a similar flush
          - Ask investigators to stop recording the flush in the notes
          - Accept the leak and note it as a limitation in the final paper
        answer: Scoring by someone who never sees the early visits
        why: >
          The blind has already failed for anybody who saw the first fortnight, and nothing recovers
          it for them. What can still be protected is the route from belief into the number:
          separate the assessor from the treating team, and the score is written by somebody with
          nothing to infer from. Matching the comparator's appearance is the right design and it is
          four years too late to introduce here. Leaving it in the notes matters — the notes are the
          source record — and a limitation paragraph fixes nothing while 600 people are
          still being scored.
        rebuttals:
          - Changing the comparator mid-trial creates two different control arms and cannot be applied backwards.
          - The flush is a clinical finding; leaving it out of the notes damages the record and hides nothing from the treating doctor.
          - A limitation in the paper describes the problem for readers and does nothing for the scores still being written.

  # ---------------------------------------------------------------- day 11
  - title: The quiet day
    objective: Close the file that the board will read.
    briefing: Nothing has gone wrong. The cut is on Thursday.
    stake: >-
      Monday, six days out, and nothing is wrong. Queries are down to 41, the sites have sent
      what they owe, and Renner's reconciliation balanced on the first run for the first time in 2
      years. Umeh has the lock plan on the wall with Thursday circled. Vogt reads the pack on the
      following Tuesday and Petrescu is the only person who will have seen it before then. Today you
      close the file: decide what still has to be true before the data can be frozen, what a locked
      database actually promises, and which of the 41 open queries has to be answered before
      Thursday rather than after it.
    takeaway: A locked file is a promise about a moment, not about perfection.
    stops:
      - group: REG
        task: Say what the lock protects, and what kind of problem could justify breaking it.
        title: Freezing something that was moving
        place: Regulatory & Registry
        scene: "The database-lock checklist is projected on the wall and the cut is three days away. Umeh has one question from the sponsor and another from Renner: once the file freezes, what exactly would justify opening it again?"
        guide: >-
          Four things a lock might buy. Ask of each whether a frozen file could deliver
          it. It cannot make the data correct, and it cannot stop collection. What it
          does is put a visible boundary around what the analysis used, so anybody can
          rerun it. Reopening is possible and creates a new version of the evidence,
          which is why it needs a reason.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - data arrive from sites continuously while a trial runs
        takeaway: Locking fixes what the analysis was run on, so the result can be checked later.
        format: CHOICE
        question: What does locking the database buy the interim analysis?
        why: A database lock creates a version of the trial that cannot quietly move under the analysis. Queries are closed, coding is fixed and the dataset is frozen before the planned calculation runs. That makes the result reproducible later. Reopening is possible, but it must be exceptional and documented because it creates a new version of the evidence. A discovered error that changes a primary event can justify that step. A cosmetic correction usually cannot. The point is not permanence; it is a visible boundary around what the analysis actually used.
        choices:
          - A fixed dataset that anybody can rerun the analysis on
          - A guarantee that the data contain no remaining errors
          - Protection from sites amending records they have already sent
          - A point after which the trial no longer collects information
        answer: A fixed dataset that anybody can rerun the analysis on
        rebuttals:
          - Errors that nobody has found are locked in with everything else; the lock is about repeatability.
          - Sites keep working and keep correcting; later changes go into the next locked version.
          - Collection continues after the lock, which is why the next analysis has a different cut.
      - group: SITE
        task: Keep the one query that cannot miss Thursday's cut and delegate the others with an owner, first action and return condition.
        title: 3 days, 41 queries
        place: Monitors' Room
        scene: 41 queries remain and the interim file locks in 3 working days. 1 concerns a primary-event date, 1 a duplicated visit, and 39 are contact-field corrections. Renner has two people available, and you can keep only one problem yourself.
        guide: >-
          Forty-one queries, three working days, two people, and one problem you keep
          yourself. For each thing you hand over, name the owner, the first action, and
          what brings it back to you. Thirty-nine of the queries are contact-field
          corrections, which is a volume problem. The other two are not.
        background:
          - >-
              Why volume and judgement are different work. Thirty-nine identical corrections
              need somebody methodical with a clear rule for the ambiguous ones. A
              primary-event date and a duplicated visit each need somebody who understands
              what the field means, because getting them wrong changes the analysis rather
              than the tidiness of the file.
          - >-
              Which to keep. The primary-event date is the one that feeds the interim
              analysis directly. A wrong date can move an event across the analysis
              boundary, which is the one error in this list that changes a result rather
              than a record.
          - >-
              What a return condition looks like here. Not 'come back if stuck'. A rule: any
              correction that would change a date, or any duplicate that cannot be resolved
              from the source document, comes back to you rather than being decided.
        assumes:
          - an event outside the cut is absent from this interim analysis
          - delegation needs an owner, a first action and a condition for returning the problem
        takeaway: Urgency belongs to the problem whose consequence becomes irreversible first, not to the problem making the most noise.
        format: DELEGATE
        question: What do you keep, what do you hand off, and what must each delegated owner bring back?
        delegate:
          problems:
            - id: event_date
              label: Primary-event date unresolved
              trend: rising
              irreversible: true
              consequence: If it is unresolved at the cut, the event is absent from this interim.
              rate: 3 working days to Thursday cut; source retrieval and site confirmation can consume 1–2 working days.
              delegable: false
            - id: duplicate_visit
              label: Visit appears twice in one week
              trend: stable
              irreversible: false
              consequence: A visit-level measure could be duplicated until the source note is checked.
              rate: 1 duplicated visit is open; no second duplicate has appeared in the last 6 working days.
              delegable: true
            - id: contact_fields
              label: Large pile of contact-field corrections
              trend: stable
              irreversible: false
              loud: true
              consequence: Follow-up administration stays messy, but Thursday's endpoint count does not change.
              rate: 39 contact-field corrections are open and about 5 more arrive per day; they have no Thursday analysis deadline.
              delegable: true
          firstActions:
            - id: pull_source
              label: Pull the admission and discharge source record
            - id: compare_entries
              label: Compare both visit entries with the signed site note
            - id: batch_contacts
              label: Return the contact list to sites as one batch
          returnConditions:
            - id: date_resolved
              label: Return when the event date is documented or shown unknowable
            - id: duplicate_resolved
              label: Return when one or both visit entries are confirmed against source
            - id: contacts_block_followup
              label: Return only if a missing field blocks scheduled participant follow-up
          hint: Keep one problem yourself. Every delegated problem needs an owner, a first action and a condition that tells the owner when it comes back to you.
          team:
            - id: data_manager
              label: Data manager
            - id: site_monitor
              label: Site monitor
          first: event_date
        answerText: Keep the primary-event date because Thursday makes its consequence irreversible. Delegate the duplicate visit for source reconciliation and batch the contact corrections, with a return condition only if they begin blocking follow-up.
        why: The biggest pile is not the most urgent problem. A missing event date can decide whether a primary event exists in Thursday's analysis at all. Once the file is cut, that omission cannot be repaired for this interim. The duplicate visit is important but stable, and a site monitor can reconcile it against the source note. Contact-field corrections are numerous and visible, yet they do not change the endpoint count. Good delegation protects the irreversible decision while giving stable work clear owners and return rules.
      - group: ENDP
        task: Decide what the committee still owes before the lock
        title: Nothing left in the tray
        concept: Hard endpoints against judged ones, and blinded adjudication
        place: Adjudication Room
        scene: >
          Ansah has 19 files still under adjudication and 3 days. 2 of the 19 are
          from participants recruited in the first year and have been waiting on 1 missing
          discharge summary each.
        guide: >-
          Four reasons the tray has to be empty. Ask of each what an unadjudicated file
          actually is in the analysis. Adjudication is what turns something that
          happened into a countable event, so nineteen files in a tray are nineteen
          events nobody had. And files wait longest where the evidence is thinnest,
          which is not evenly spread across the arms.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - an event is only counted once the committee has ruled on it
        takeaway: An unadjudicated event is invisible to the analysis, whatever the notes say.
        format: CHOICE
        question: Why must the committee clear its tray before the file is locked?
        choices:
          - Events without a ruling are absent from the analysis
          - A ruling made after the lock cannot be entered into any database
          - The committee's rulings determine which arm each participant is in
          - Unadjudicated files count as missing outcomes for those participants
        answer: Events without a ruling are absent from the analysis
        why: >
          Adjudication is not paperwork after the fact; it is the step that turns something that
          happened into a countable event. 19 files sitting in a tray are 19 events the
          analysis will behave as though nobody had. That is not neutral: files wait longest where
          the evidence is thinnest, and the thin files are not evenly spread between arms. Rulings
          made after the lock go into the next version, which means the interim was read on a trial
          that was quietly missing part of itself.
        rebuttals:
          - Later rulings are entered normally; they simply arrive after this analysis has been run.
          - The committee rules on events and never sees or determines the arm.
          - The participant is not missing; one of their events is uncounted, which is a different fault.

  # ---------------------------------------------------------------- day 12
  - title: Three things at once
    objective: Rank what the board is told when everything arrives on the same morning.
    briefing: A subgroup has crossed its line, a rival has published, and the regulator has written.
    stake: >-
      Tuesday, five days out, and three things landed before nine. Petrescu's closed tables show 1
      subgroup — participants over 70 — crossing the boundary on its own. A group in Lyon has
      published a smaller trial of a related drug with a strong result. And the regulator has asked
      for the liver cases from day three as a formal safety update, due Friday. Balogun has read the
      Lyon paper twice and wants the board told about all three together. Today you decide what goes
      in the pack, in what order, and what each of the three is actually evidence about.
    takeaway: Three urgent things are not one big thing, and the board is owed the difference.
    stops:
      - group: STAT
        task: Say what a subgroup crossing its line is worth
        title: The subgroup that crossed
        concept: Subgroup analysis, and why a subgroup finding is a hypothesis
        place: Statistics & Analysis
        scene: >
          Participants over 70 show a difference that clears the line on its own. Feldman asks which
          of 14 prespecified subgroups this is, and whether anybody has looked at the other 13 yet.
        guide: >-
          Put an interval around the over-70 result before deciding what it is worth. The
          interval is the estimate plus and minus about two standard errors, so pick the
          multiplier and the standard error and work out the half-width. One tile is the
          standard error of the whole trial, which is the number this subgroup does not have.
        background:
          - >-
              What the width says. A confidence interval is the estimate give or take about two
              standard errors, and the standard error grows as the group shrinks. A subgroup of a
              few hundred therefore carries an interval several times wider than the trial's, which
              is why subgroup estimates swing so far from the overall result.
          - >-
              Why 14 subgroups is the other half of the problem. Testing fourteen slices at the
              usual threshold gives about a one-in-two chance that at least one clears the line by
              luck alone. A subgroup that crossed is therefore what an honest trial expects to see,
              not evidence that something is different about people over 70.
          - >-
              What the over-70 result is for. It is a hypothesis somebody could test in a trial
              designed to test it. Stated as a finding it becomes a treatment recommendation for a
              group whose interval, once you draw it, includes no benefit at all.
        assumes:
          - a subgroup is a slice of the participants analysed on its own
        takeaway: A subgroup result is one of many results, and it has to be judged as one of many.
        format: BALLPARK
        question: How wide is the interval around the over-70 result, either side of the estimate?
        answerText: About 6.7 percentage points either side of a 6.0-point estimate — so the interval runs from about −0.7 to 12.7 and includes no benefit at all.
        why: "A confidence interval is CI ≈ estimate ± 1.96 × SE. The over-70 subgroup's absolute risk reduction is 6.0 percentage points with a standard error of 3.4, so the half-width is 1.96 × 3.4 ≈ 6.7 and the interval runs from about −0.7 to 12.7 points. It includes zero, which is the whole answer: the subgroup that 'crossed its line' has an interval that does not exclude no effect once it is drawn properly. The trial as a whole has a standard error of 1.5, so its interval is less than half as wide — precision improves with the square root of the sample, and a subgroup is a smaller sample by construction. Then there is the second problem: with fourteen prespecified subgroups, the chance that at least one clears the usual threshold by luck alone is about one in two. So this result is what a well-run trial expects to produce, and the honest sentence calls it a hypothesis rather than a finding."
        estimate:
          prompt: The over-70 subgroup shows an absolute risk reduction of 6.0 percentage points with a standard error of 3.4. The whole trial's standard error is 1.5.
          question: Choose the multiplier for a 95 per cent interval and the subgroup's standard error.
          labels:
            - 1.96  (multiplier for a 95 per cent interval)
            - 3.4  (SE of the over-70 subgroup, in percentage points)
            - 1.5  (SE of the whole trial, in percentage points)
            - 6.0  (the subgroup's estimated risk reduction)
            - 14  (prespecified subgroups)
          values: [1.96, 3.4, 1.5, 6.0, 14]
          slots: 2
          template: '{0} × {1}'
          formula: a*b
          correct: [0, 1]
          target: 6.66
          tolerance: 0.5
          units: percentage points either side
          solution: 1.96 × 3.4 ≈ 6.7 points, so 6.0 ± 6.7 runs from −0.7 to 12.7 and includes zero.
          explanation: Drawn properly, the interval around the subgroup that crossed does not exclude no effect.
          givens:
            - subgroup risk reduction 6.0 points, standard error 3.4
            - 14 prespecified subgroups were planned
          relationship: A confidence interval is CI ≈ estimate ± 1.96 × SE, and the width of the interval grows as the group gets smaller.
      - group: SAFE
        task: Assemble the safety update the regulator has asked for
        title: The update that is due Friday
        place: Monitoring Board Room
        scene: |-
          The regulator wants the liver cases written up by Friday. There are now four, not two. Vogt has seen all four by arm; nobody else in the building has.
        guide: >-
          Four versions of Friday's update. Ask of each whether a reader could work out
          how common the problem is. Four cases among forty exposed people is a
          different thing from four among twelve hundred. So a numerator without a
          denominator is not a rate. Causality opinions can go in and do not replace the
          counts, and efficacy belongs to a closed review.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - serious events are reported to regulators on a stated schedule
        takeaway: A safety update reports the events and the denominator, not a conclusion about them.
        format: CHOICE
        question: What must Friday's update contain to be worth reading?
        answerText: The update needs the four cases, the number of people exposed, and enough timing and clinical detail to understand the pattern. A case count without its denominator is not a rate.
        why: Four cases do not say how common the problem is. 4 cases among 40 exposed people mean something very different from 4 among 1200. The regulator needs both the numerator and denominator, plus enough clinical detail to recognise a pattern. Causality opinions can be included, but they do not replace the counts. Efficacy results belong to the board's closed review. A recommendation about continuing also comes later, after the people responsible for that decision have the same safety evidence.
        choices:
          - The four cases, the exposed population, and the timing and clinical pattern
          - The four cases, the board's current causality judgement, and no exposure denominator
          - The four cases beside the interim efficacy estimate and treatment-arm difference
          - The four cases with a recommendation on whether recruitment should continue
        answer: The four cases, the exposed population, and the timing and clinical pattern
        rebuttals:
          - A causality view can accompany the report, but without the exposed population the reader cannot interpret frequency.
          - The interim efficacy result belongs to the board's protected review and is not needed to make the safety update interpretable.
          - A continuation recommendation is a decision built from the evidence, not a substitute for reporting the evidence itself.
      - group: REG
        task: Spend tonight's review budget on the parts of the Lyon result that could change what CLARION-3 asks its board to consider.
        title: What the Lyon paper is worth tonight
        place: Regulatory & Registry
        scene: The Lyon trial published a large benefit at 6:10 this morning. By lunch, Balogun wants CLARION-3 to respond. Nkechi Umeh has the paper, its supplement and four review hours before she must state the trial’s position.
        guide: >-
          Four review hours before a position has to be stated, and a paper published
          this morning. Open each piece of the Lyon evidence and ask what would change
          about CLARION-3's position depending on how it comes out. Buy what could
          change the position, not what would explain the headline more thoroughly.
        background:
          - >-
              Why the headline is rarely the useful part. A large benefit in another trial
              matters to this one only through specifics: the population, the endpoint
              definition, the comparator, whether the effect is plausible in the patients
              CLARION-3 enrolled. Those live in the supplement rather than the abstract.
          - >-
              What a position actually has to survive. Balogun will be asked whether
              CLARION-3 should continue, and the answer has to hold whether the Lyon result
              replicates or not. Evidence that would only be reassuring if Lyon is right is
              not worth an hour.
          - >-
              Why four hours is the whole point. There is time to read some of it properly
              or all of it badly. Choosing which parts is the same judgement every VALUE
              stop asks for, on the day it is least comfortable to make.
        assumes:
          - a related trial can change the uncertainty that makes continued randomisation defensible
          - an outside result does not rewrite a prespecified analysis plan
        takeaway: External evidence matters in proportion to how much it can change the decision, not how dramatic its headline sounds.
        format: VALUE
        question: Which pieces of the Lyon evidence are worth buying before tonight's position is written?
        value:
          budget:
            amount: 4
            unit: review hours
          decision: How much weight should the Lyon result receive in the board's interim discussion?
          options:
            - id: endpoint
              label: Endpoint definition, event count and confidence interval
              cost: 2
              axis: comparability
              decisive: true
              reveals: Whether Lyon measured an outcome close enough to CLARION-3's primary endpoint, with enough events, to change the same clinical question.
            - id: randomisation
              label: Randomisation and concealment methods
              cost: 2
              axis: internal validity
              decisive: false
              reveals: Whether Lyon's treatment groups were protected from selection at entry.
            - id: subgroups
              label: Subgroup forest plot
              cost: 2
              axis: heterogeneity
              decisive: false
              reveals: Whether the headline benefit is broad or concentrated in selected slices.
            - id: commentary
              label: Mechanism editorial
              cost: 2
              axis: biological plausibility
              decisive: false
              reveals: Why commentators think the related drug could plausibly work.
            - id: press
              label: Sponsor press release
              cost: 1
              axis: public framing
              decisive: false
              reveals: How the sponsor describes the result, without adding evidence needed to judge it.
          hint: You cannot read everything tonight. Buy the evidence that tells you whether Lyon answered a question close enough to CLARION-3's to change the board's decision.
        answerText: Read the endpoint definition, event count and confidence interval first, then the randomisation methods if time remains. Those tell you whether Lyon is both comparable and credible enough to change what the board weighs; the analysis plan itself stays unchanged.
        why: A striking outside result is neither ignored nor copied into the current trial. First ask whether it measured the same kind of outcome, on enough events, with uncertainty narrow enough to matter. Then ask whether its randomisation protected the comparison. Those features determine how much the paper should change the board's uncertainty. A plausible mechanism or an impressive subgroup can support interpretation, but they cannot rescue an incomparable endpoint. The result belongs in the board's discussion, while CLARION-3's registered analysis remains fixed.
  # ---------------------------------------------------------------- day 13
      - group: SAFE
        task: Work the safety queue while the reporting rule changes.
        title: What has to go out today
        concept: "Causality assessment, and why reporting does not wait for it"
        place: Safety Desk
        scene: Adverse event reports queue on the safety desk faster than they can all be assessed. The rule about which go out today is set by the safety physician, and it changes as the picture does — after the second case, after the regulator writes, after the board meets.
        guide: >-
          Send out what the current rule requires and hold the rest for assessment. The rule
          on the desk changes during the day and nobody announces it. What is scored is the
          reports either side of a change, because they are the only ones that show whether
          the desk is reading the rule.
        background:
          - >-
              Why the rule moves at all. Ordinarily what goes out today is anything serious and
              unexpected. Once a second case of the same thing appears, the rule becomes anything
              resembling it, whether or not it is serious. After a regulator asks, it is anything
              they have asked about, on their timetable rather than the trial's.
          - >-
              Why late is not a small failure. Expedited reporting exists so that somebody outside
              the trial can see a pattern the trial cannot. A report held for assessment is a report
              that is not in that view, and assessment is exactly what the recipient is supposed to
              do independently.
        assumes:
          - a trial reports certain events without waiting to decide what caused them
        takeaway: The cost of a withdrawn instruction is paid by whoever is still working to it.
        format: SPOT
        question: Report to the rule in force, and keep watching the rule.
        answerText: Read the rule rather than the report. Every change leaves an hour in which the old rule still looks like today's.
        why: >-
          Three rules run across the day and each wants a different part of the queue. Anything
          serious and unexpected, then anything resembling the cluster, then anything the
          regulator has asked about. A report can answer two at once, which is what makes the
          change cost real rather than notional. The panel scores the window either side of
          each change, because most of the queue is wanted by neither rule and is correctly
          held for assessment by somebody who has read nothing. The desk's own version is the
          hour after a second case appears: the rule has changed to anything resembling it, and
          the reports going out are still the ones that were serious-and-unexpected when the
          morning started — which is precisely the hour in which the pattern was visible and
          nobody outside the trial could see it.
        spot:
          duration: 40
          switchEvery: 12
          pass: 0.75
          hint: The reporting rule is on the desk, and the safety physician changes it without announcing it.
          targets:
            - id: e1
              label: Serious, unexpected
              tags: [serious]
            - id: e2
              label: Mild rash, third case
              tags: [cluster]
            - id: e3
              label: Serious, matches cluster
              tags: [serious, cluster]
            - id: e4
              label: Regulator asked about it
              tags: [asked]
            - id: e5
              label: Expected, non-serious
              tags: [routine]
            - id: e6
              label: Asked about, cluster
              tags: [asked, cluster]
            - id: e7
              label: Serious, expected
              tags: [routine]
            - id: e8
              label: Hospitalisation, unexpected
              tags: [serious]
          rules:
            - say: Anything serious and unexpected
              want: [serious]
            - say: Anything resembling the cluster
              want: [cluster]
            - say: Anything the regulator asked about
              want: [asked]
          commit: Open the desk
  - title: 1 of 14
    objective: Work out what the over-seventies result would have cost if it had been believed.
    briefing: Feldman has the list of every subgroup the plan named.
    stake: >-
      Wednesday, four days out. The prespecified subgroup list has 14 entries on it, and the
      over-seventies are the eleventh. Feldman has spent the morning showing what 14 looks
      like: with that many slices, one of them clearing the usual line is close to expected even
      when the treatment does the same thing in everybody. Balogun, who has argued all fortnight for
      acting sooner, agrees before she has finished. Today you put a number on how often 14
      independent looks throw up a false positive, and decide what the board is told about the
      over-seventies as a result.
    takeaway: A result that would be surprising once is unremarkable in 14 attempts.
    stops:
      - group: STAT
        task: Put a number on 14 looks
        title: How often something clears the line by luck
        concept: Type I and type II error, and what α and β are for
        place: Statistics & Analysis
        scene: >
          14 prespecified subgroups, each tested at the usual 5%. Feldman writes
          the arithmetic on the board and asks what the chance is that at least one clears the line
          with no real difference anywhere.
        guide: >-
          Five numbers, and two of them belong elsewhere: the number randomised, and the
          one that stands for certainty. Ask of each whether this stacking depends on
          it. Each test carries its own small chance of misfiring, and those chances
          multiply rather than staying small. Real subgroups overlap, which softens the
          number without changing what it says.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - each test has a 5% chance of a false positive on its own
        takeaway: The chance of at least one false positive rises fast with the number of tests.
        format: BALLPARK
        question: Estimate the chance that at least 1 of 14 subgroups clears the line by luck alone.
        why: >
          Each test carries its own small chance of being wrong, and the chances do not stay small
          when they are stacked. With independent tests the probability that none misfires is 0.95
          multiplied by itself once per test, so 14 tests leave barely half the outcomes
          clean. That is the arithmetic behind every impressive subgroup: not that anybody cheated,
          but that a room looking in 14 places will usually find something in 1 of them.
          Real subgroups overlap and correlate, which softens the number without changing the
          lesson.
        estimate:
          prompt: >
            14 subgroups are each tested at 5% level. If nothing is really
            different anywhere, the chance that none of them clears the line is 0.95 raised to the
            fourteenth power. The chance that at least one does is one minus that.
          question: Choose the per-test pass rate and the number of tests.
          labels:
            - 0.95  (chance 1 test does not misfire)
            - 14  (subgroups tested)
            - 0.05  (the level of each test)
            - 1  (the whole probability)
            - 2400  (participants randomised)
          values: [0.95, 14, 0.05, 1, 2400]
          slots: 3
          template: '{3} − {0}^{1}'
          formula: c-Math.pow(a,b)
          correct: [0, 1, 3]
          target: 0.51
          tolerance: 0.06
          units: chance of at least one
          solution: 1 − 0.95¹⁴ = 1 − 0.49 ≈ 0.51.
          explanation: >
            About 1 in 16 honest looks at a trial where the treatment does the same
            thing in everybody will produce at least 1 subgroup clearing the line about half the
            time, which is why the over-seventies finding is not evidence on its own.
          givens:
            - 14 subgroups were prespecified
            - Each is tested at the 5% level
          relationship: >
            Chance of at least 1 false positive = 1 − (1 − α)^m, with α the level of each test and
            m the number of tests.
        answerText: About 51% — near enough a coin toss.
      - group: ENDP
        task: Check what the over-seventies analysis actually measured
        title: The slice, and what it was scored on
        place: Adjudication Room
        scene: |-
          The over-seventies result is on the symptom score rather than the adjudicated event. Ansah points out that this is the outcome the guessing survey landed on, and that older participants attend most often.
        guide: >-
          Four accounts of what the subgroup result rests on. Ask of each whether the
          outcome named is the protected one or the leaky one. Two weaknesses compound
          here: one of fourteen looks, measured on the score the guessing survey
          reached. Older participants attend more often, so there are more scored visits
          for a small bias to enter.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - the symptom score is written by the treating doctor and the event is adjudicated
        takeaway: A subgroup finding inherits every weakness of the outcome it was measured with.
        format: CHOICE
        question: What does the over-seventies result rest on?
        why: "Two weaknesses compound here. The finding is 1 of 14 subgroup looks, so chance already has many opportunities to produce something interesting. It is also measured on the symptom score, which the guessing survey showed can inherit treatment knowledge. Older participants attend more often, creating more scored visits where a small bias can enter. The adjudicated event in the same subgroup shows nothing unusual. That contrast matters: the subgroup signal is strongest exactly where the measurement process is least protected."
        choices:
          - The outcome the unblinding was shown to reach
          - The adjudicated endpoint, in a smaller group
          - A separate scale used only in older participants
          - The same endpoint, scored by the committee twice
        answer: The outcome the unblinding was shown to reach
        rebuttals:
          - The adjudicated endpoint shows nothing unusual in this slice, which is what makes the contrast informative.
          - No separate scale exists for older participants; the same instrument is used throughout.
          - The committee's second reading covered ambiguous files across the trial, not this subgroup.
      - group: SAFE
        task: Write what the board is told about the subgroup
        title: What to say about a slice
        place: Monitoring Board Room
        scene: >
          Vogt will see the over-seventies table whatever the pack says about it. What the pack can
          do is tell her what she is looking at before she looks at it.
        guide: >-
          Four ways to present one slice, and the board will see the table whatever the
          pack says. Ask of each what reaction the layout invites. A striking slice
          alone invites the reader to treat it as the finding. The eleventh row of
          fourteen invites them to count. And filtering what looks unlikely starts
          making the board's decision for it.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - the board sees the trial's subgroup tables in closed session
        takeaway: A subgroup table is reported with the number of looks that produced it.
        format: CHOICE
        question: How should the over-seventies table be presented to the board?
        choices:
          - Beside all 14 subgroups, on the same page
          - On its own, with the biological argument for it
          - Left out, since it is unlikely to be real
          - First, because it is the strongest signal in the pack
        answer: Beside all 14 subgroups, on the same page
        why: >
          A single striking slice on its own page invites the reader to treat it as the finding. The
          same slice as the eleventh row of 14 invites them to count, which is the right
          reaction. Presenting all of them costs nothing and removes the choice of what to
          emphasise from whoever assembles the pack. Leaving it out is worse than either: the board
          is the body entitled to see everything, and a pack that filters what looks unlikely has
          started making the board's decision for it.
        rebuttals:
          - A biological argument beside one slice makes it look chosen for its plausibility rather than found among many.
          - Withholding a table decides for the board what it is allowed to weigh.
          - Ordering the pack by how strong something looks is the emphasis the board is meant to supply.

  # ---------------------------------------------------------------- day 14
  - title: The last reversible moment
    objective: Prepare the case the board will decide on, and be honest about what stopping costs.
    briefing: The board meets tomorrow. After that the decisions are made.
    stake: >-
      Thursday, one day out. The pack is printed, the file is locked, and Petrescu has run the
      analyses the plan named. Tomorrow Vogt's board sits for four hours and recommends one of three
      things: stop for benefit, stop for futility, or carry on to the end. Balogun will attend the
      open session and say what he has said all fortnight; Doyle will be in the room too, and has
      asked what a participant recruited last month is owed by either decision. Today you assemble
      what the board needs to weigh — how likely the trial is to finish positive, and what each way
      of stopping would leave unknown.
    takeaway: Stopping is a decision about what will never be known, as much as about what is known.
    stops:
      - group: SAFE
        task: Match each recommendation to what the board gives up by making it.
        title: Three things the board can say
        place: Monitoring Board Room
        scene: Vogt’s board meets behind a closed door in 40 minutes. The adjudicated effect is modest, the stopping boundary is not crossed, and four liver cases remain unexplained. Three recommendations are printed on separate cards in front of her.
        guide: >-
          Three recommendations and four costs, and none of the choices is free. Pair
          them by asking what each one gives up: precision, a real benefit, another year
          of exposure, or comparability with the registered plan. Early stops overstate
          effects. And even changing what gets reported has a cost, unless the change is
          recorded before it is used.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last
              pair looks forced: the fault is usually not in the join you are struggling
              with, but in one you made early and stopped questioning.
        takesAsRead:
          - Sample size and statistical power
        assumes:
          - a monitoring board recommends and the sponsor decides
        takeaway: Each way of ending a trial buys something and gives something up.
        format: PROTOCOL
        why: None of the board’s three choices is free. Stopping for benefit before the boundary is crossed risks exaggerating an effect and loses future safety follow-up. Stopping for futility can discard a modest benefit that more events might confirm. Continuing preserves the planned evidence but keeps people exposed to the arm doing worse so far. Even changing what gets reported has a cost. The registered plan is part of why readers can trust the result, so any change has to be recorded before it is used.
        columns:
          - What the board recommends
          - What it gives up
        scenarios:
          - Stop now for benefit, on an effect that has not crossed the boundary.
          - Stop now for futility, on the grounds that the effect is small.
          - Continue to the planned number of events.
          - Continue, with the symptom score dropped from the primary reporting.
        choices:
          - The long-term safety data, and a precise estimate — early stops overstate effects.
          - A modest but real benefit, which the trial would have gone on to confirm.
          - Another year in which half of those recruited receive the arm that loses.
          - Comparability with the plan as registered, unless the change is recorded first.
        mapping: [0, 1, 2, 3]
      - group: STAT
        task: Say how likely the trial is to finish positive
        title: What the rest of the trial would probably do
        place: Statistics & Analysis
        scene: |-
          Feldman has computed what the trial would most likely conclude if it ran to 380 events, given the 246 in hand. Balogun asks the obvious question: if it is going to end positive, why wait.
        guide: >-
          The forecast rests on one number: how extreme the remaining events would have to be
          for the final analysis to clear its boundary. Work out the information fraction
          first — events in hand over events planned — and the verdict turns that into the
          conditional power. One tile is the events still to come, which is not the fraction.
        background:
          - >-
              What the information fraction is. Events observed over events planned. It is how far
              through an event-driven trial actually is, and it is not the same as how far through
              its calendar or its recruitment — 246 of 380 events is about two thirds of the
              information, whatever the enrolment log says.
          - >-
              What conditional power is. The probability that the trial is significant at the end,
              given the data so far and assuming the effect really is what the protocol assumed. It
              is a forecast about a study: it answers "will this trial clear its boundary", and not
              "does this treatment work".
          - >-
              Why a high forecast is not a reason to stop. Stopping early converts a forecast into a
              conclusion and spends error rate that was budgeted for the final look. The trial was
              designed to answer the question at 380 events because that is how much information the
              question needs, and a probable answer is not one.
        takesAsRead:
          - Sample size and statistical power
        assumes:
          - the trial has collected about two thirds of its planned events
        takeaway: A forecast about a study is not a statement about the treatment.
        format: BALLPARK
        question: How far through its information is the trial, and what does that make of the forecast?
        answerText: 0.65 of the information, and a conditional power of about 0.82 — a forecast that the trial will probably clear its boundary, which is a statement about the trial and not about the drug.
        why: "The information fraction is t = events observed / events planned, so 246 ÷ 380 = 0.65: about two thirds of the way through, whatever the calendar says. That fraction is what the forecast is built on. Conditional power = P(significant at the end | data so far), and with the interim z-score at 1.42, a final boundary of 1.96 and 35 per cent of the information still to come, the remaining events would have to be mildly favourable rather than dramatic — which comes out at roughly 0.82. Two things follow. It is a forecast about a study, not a statement about the treatment: it assumes the effect is what the protocol assumed and asks whether this trial will clear its line. And a probable answer is not an answer — stopping now converts the forecast into a conclusion and spends error rate that was budgeted for 380 events. The mirror case is the one the format exists for: a conditional power of 0.05 is a futility signal, and it is still a statement about the trial rather than proof the treatment does nothing."
        estimate:
          prompt: The trial has 246 events in hand of the 380 it was designed for. The interim z-score is 1.42 against a final boundary of 1.96.
          question: Choose the events observed and the events planned.
          labels:
            - 246  (events in hand)
            - 380  (events the trial was designed for)
            - 134  (events still to come)
            - 1.42  (the interim z-score)
            - 1.96  (the final boundary)
          values: [246, 380, 134, 1.42, 1.96]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 0.647
          tolerance: 0.03
          units: of the planned information
          solution: 246 ÷ 380 = 0.65 of the information, which with z = 1.42 gives a conditional power of about 0.82.
          explanation: Two thirds of the information, and a probable result. Neither is a conclusion, and stopping early spends error rate budgeted for the final look.
          givens:
            - 246 events in hand of 380 planned
            - interim z-score 1.42, final boundary 1.96
          relationship: The information fraction is t = events observed / events planned, and the conditional power = P(significant at the end | data so far) is read from it with the interim z-score.
      - group: REG
        task: Order what has to happen if the board recommends stopping tomorrow.
        title: What a stop obliges
        place: Regulatory & Registry
        scene: Umeh has the registry entry, protocol and publication policy open before the board call. One participant is due an infusion on Monday. Doyle asks what happens, in what order, if the board recommends stopping tomorrow.
        guide: >-
          All four steps will happen, so ask who learns what, and when. The board
          recommends and the sponsor decides. Somebody is due an infusion on Monday. A
          registered trial that quietly disappears is how the literature acquires
          missing arms. And a trial stopped early still owes its results, with the
          shortened follow-up stated plainly.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency: each
              step is here because the one before it has already happened, or has to have.
              One transposed pair falsifies that claim wherever it sits, so partial credit
              would be credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained
              by having nothing before or after them, which usually makes them the two you
              can settle from the scene alone. Pinning them collapses the remaining
              arrangements sharply, and what is left in the middle is where the actual
              judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the
              only one. An order can run on cost, on risk, or on reversibility — every
              observation that leaves the sample as it was, before any that consumes it. On
              those boards a chronological reading finds nothing, because none of the steps
              has to happen at a particular hour.
        takesAsRead:
          - "Allocation concealment: protecting the moment of entry"
        assumes:
          - a trial's commitments continue after recruitment ends
        takeaway: Ending recruitment does not end the trial's obligations to the people in it.
        format: SEQUENCE
        why: |-
          A stop is an event with a sequence, and the sequence is about who learns what and when. The sponsor decides, because the board only recommends. Sites and participants come next and quickly: somebody is due an infusion on Monday and is entitled to know. The public record is corrected because a registered trial that quietly disappears is how the literature acquires missing arms. And reporting is not optional — a trial stopped early still owes its results, with the shortened follow-up stated plainly.
        cards:
          - The sponsor accepts the recommendation and sets a date recruitment ends.
          - Sites are told, and participants already enrolled are told what changes for them.
          - The registry entry is updated to say the trial stopped and why.
          - The results are reported, including the follow-up that was cut short.
        order: [0, 1, 2, 3]
  # ---------------------------------------------------------------- day 15
  - title: What it is worth saying
    objective: Say what CLARION-3 found, how strongly, and what nobody knows yet.
    briefing: The board has reported. Now the trial has to be described in words.
    stake: >-
      Friday, and the board reported yesterday: continue to the planned events, with the symptom
      score dropped from the primary reporting and the liver cases followed formally. Balogun has
      accepted it. Feldman has written the sentence she thinks the trial can defend; the sponsor's
      communications team has written a different one, using the same numbers. Doyle wants to know
      which of the two would help somebody decide on a Tuesday afternoon. Today you settle how the
      result is stated, what the trial is entitled to claim about its endpoint, and what happens
      now to the 2400 people still in it.
    takeaway: The last decision in a trial is what to say, and the numbers do not settle it.
    stops:
      - group: REG
        task: Move the two event rates until they reproduce the reported relative risk, then use the absolute risk reduction to collapse the possibilities.
        title: One relative risk, many absolute effects
        place: Regulatory & Registry
        scene: 2 lines for the board chair’s closed briefing describe the same CLARION-3 result. 1 says risk fell about 22%; the other says roughly 4 events were prevented per hundred people. Umeh puts both arm rates on a two-control display.
        guide: >-
          Two controls slide the two arm risks along a family of pairs that all give the
          same relative result. Find out how wide that family is before choosing a line
          for the briefing. Then bring in the second measurement, which fixes one arm
          rather than the ratio, and watch the family collapse to a single pair.
        background:
          - >-
              Why a relative risk does not pin the arms. A 22% reduction is a ratio. Twenty
              per cent against sixteen has it; two per cent against one and a half has it
              too. The ratio is the same and the number of people helped differs by an order
              of magnitude.
          - >-
              What the absolute figure adds. Four events prevented per hundred people is a
              statement about how common the outcome is, which the ratio deliberately hides.
              Both sentences are true of the same result, and only one of them tells the
              chair what the trial would do for a patient.
          - >-
              Why boards are shown both. A relative figure travels well between populations
              and exaggerates importance in rare outcomes. An absolute figure is honest
              about scale and does not transfer to a population with a different baseline.
              Presenting one alone is the most common way a true result misleads.
        assumes:
          - relative risk is treatment risk divided by control risk
          - absolute risk reduction is control risk minus treatment risk
        takeaway: A relative effect does not determine the absolute benefit until the baseline risk is known.
        format: DEGENERACY
        question: How many pairs of arm risks fit the relative result, and what second measurement identifies the CLARION-3 pair?
        degeneracy:
          controls:
            - id: p_control
              label: Control-arm event risk
              min: 0.03
              max: 0.55
              step: 0.001
            - id: p_treatment
              label: Treatment-arm event risk
              min: 0.02
              max: 0.45
              step: 0.001
          truth:
            a: 0.189
            b: 0.147
          hint: First match the relative risk. Notice how many rate pairs work. Then reveal the absolute reduction and find where the two constraint lines cross.
          tolerance:
            a: 0.01
            b: 0.008
          locus:
            - a: 0.05
              b: 0.0389
            - a: 0.1
              b: 0.0778
            - a: 0.189
              b: 0.147
            - a: 0.3
              b: 0.2334
            - a: 0.5
              b: 0.389
          second:
            label: Absolute risk reduction
            locus:
              - a: 0.1
                b: 0.058
              - a: 0.189
                b: 0.147
              - a: 0.3
                b: 0.258
          observable:
            label: Relative risk
        answerText: "The relative risk alone allows many pairs. Adding ARR = 0.042 selects the CLARION-3 rates: 0.189 in control and 0.147 in treatment. Their ratio is about 0.778, a 22% relative reduction."
        why: A ratio does not carry the baseline rate with it. Treatment and control risks of 3.9 and 5% give almost the same relative reduction as 14.7 and 18.9%. The absolute benefits are very different. That is why the relative result forms a whole line of possible pairs on the display. Adding the measured absolute reduction gives a second line. Their intersection recovers the actual arm rates and shows why an absolute statement carries information the relative headline leaves out.
      - group: ENDP
        task: State what the trial has established about its endpoint
        title: What can be claimed
        place: Adjudication Room
        scene: |-
          Ansah is asked to write one sentence about the adjudicated endpoint for the board's minutes. He has the effect, the interval, and the fact that the trial has not finished.
        guide: >-
          Four sentences for the minutes. Ask of each what it claims beyond the estimate
          and its interval. One refuses to say anything until the target is reached,
          which throws away information already collected. One imports a fragile
          subgroup. One argues the trial should have stopped, which is the question the
          boundary already answered.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - the interval around an estimate says what the data are compatible with
        takeaway: An honest claim carries its uncertainty and the conditions it was measured under.
        format: CHOICE
        question: Which sentence does CLARION-3's adjudicated endpoint currently support?
        answerText: The current data support an effect of about four percentage points on the adjudicated endpoint. There is uncertainty around that estimate, and more events are still to come.
        why: An interim estimate is evidence, but it is not the final word. The point estimate says where the observed difference sits, and the interval shows the range still compatible with the data. More events can move both. Saying there is no effect until the target event count is reached throws away information already collected. Claiming the effect is specific to older participants imports a fragile subgroup result. Claiming the trial should have stopped ignores the stopping boundary the board actually used.
        choices:
          - The adjudicated endpoint currently differs by about four points, with uncertainty and further follow-up still ahead
          - The primary endpoint cannot support any effect statement until all 380 planned events have occurred
          - The four-point effect is established most clearly in participants over 70 because that subgroup crossed its own line
          - The four-point effect is already strong enough to justify stopping because the interval excludes no effect
        answer: The adjudicated endpoint currently differs by about four points, with uncertainty and further follow-up still ahead
        rebuttals:
          - Interim data already contain information; the final event count determines precision and the planned stopping rule, not whether the current estimate exists.
          - That subgroup was 1 of 14 and was strongest on the outcome most exposed to the blinding failure.
          - Statistical evidence against no effect is not identical to crossing the prespecified early-stopping boundary.
      - group: SITE
        task: Write the rule for what sites tell participants after the board says continue.
        title: What happens to the people in it
        place: Monitors' Room
        scene: The board has said continue. At 8 Monday morning, 31 sites will open their phones and 2,400 participants will still be enrolled. Marchetti has one letter to tell every site what changes, and what does not.
        guide: >-
          Four things participants might be owed. Ask of each whether it could travel
          back into the trial through them. Consent is a continuing decision, not a
          signature from four years ago, so saying nothing fails an obligation. But
          releasing the interim numbers or somebody's own arm lets treatment knowledge
          spread back through the sites still scoring outcomes.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        takesAsRead:
          - "Allocation concealment: protecting the moment of entry"
        assumes:
          - participants continue treatment and follow-up until the trial ends
        takeaway: Consent is maintained, not collected once.
        format: CHOICE
        question: What are the participants owed now that the board has reported?
        why: Consent is a continuing decision, not a signature stored from four years ago. Participants should know facts that could reasonably affect whether they stay. Here the safe fact is that an independent board reviewed the trial and recommended continuing. Releasing the unblinded interim numbers would let treatment knowledge spread back through participants and sites. Telling somebody their own arm would do the same. Saying nothing also fails the obligation, because a meaningful review happened. The update should preserve both informed participation and the comparison still under way.
        choices:
          - That the trial reviewed its data and is continuing, and why
          - The interim result, so they can decide whether to stay
          - Nothing, since nothing about their treatment changes
          - Their own arm, now that an interim analysis has been done
        answer: That the trial reviewed its data and is continuing, and why
        rebuttals:
          - Releasing the interim result to participants unblinds the trial by another route.
          - Silence leaves people unaware that a review happened at all.
          - Telling somebody their arm removes them from the comparison they consented to be part of.

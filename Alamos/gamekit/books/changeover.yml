  - group: NOTES
        # removed duplicate task: Reconcile the weighed returns against the ledger
    title: Two counts of the same money
    reason: >-
      Femi Adeyinka won't sign either count of the returned notes until somebody explains
      why they are thirteen thousand apart.
    place: Note Room
    concept: 'Reading an economic statistic: what it counts, over what period, and revised how often'
    takesAsRead:
    - 'A price index, and the basket it is an index of'
    scene: >
      The weighed count says 228,000 notes returned. The six regional ledgers, added, say
      241,000. Femi Adeyinka, the vault officer, will not sign either figure.
    guide: >-
      Two counts of the same thing disagree by thirteen thousand notes. Work out what each method
      would get wrong, and which of the four explanations is consistent with the weighed figure
      being the lower of the two. One of them is an error and one of them is money.
    background:
    - >-
      What the weighing can get wrong. The mass per note comes from a sample, so a mix with
      more heavy notes than sampled makes the count too low. Thirteen thousand out of 241,000
      is about five per cent, which is well within what a bad sample could do.
    - >-
      What the ledgers can get wrong. A note counted at a branch and again at the centre is
      double-counted, which pushes the ledger total up. Both explanations fit the direction, and
      only a recount of one region separates them.
    assumes:
    - both counts cover the same returns
    takeaway: When two methods disagree, the question is what each of them would get wrong.
    format: PROTOCOL
    task: Match each explanation to what it predicts about the two counts.
    columns:
    - The explanation
    - What it predicts
    scenarios:
    - The sampled mass per note is too high
    - A region has counted its returns twice
    - Notes have been taken between the branch and the centre
    - The scale is reading low across the whole range
    choices:
    - The weighed count comes out low, and a recount of one region settles it
    - The ledger total comes out high, and the region's own tally will not match its dispatch note
    - Both counts are right and the difference left the building
    - Every weighed figure this fortnight is low by the same proportion
    mapping: [0, 1, 2, 3]
    rebuttals:
    - A mass per note set too high divides the same mass into too few notes, so the weighed count is low.
    - A region counting twice inflates the ledger, and its dispatch note will disagree with its tally.
    - If both counts are right, the difference is notes that left between the two counting points.
    - A scale reading low understates every weighing, which shows as a constant proportional gap.
    answerText: >-
      A high mass per note makes the weighed count low; a double count inflates the ledger; both
      being right means the difference left the building; a low scale is a constant proportional
      error.
    why: >
      Four explanations, and each predicts something different that can be checked without
      arguing. A sampled mass per note set too high divides the same mass into too few notes.
      So the weighed figure is low, and a recount of one region settles it. A region counting
      twice inflates the ledger and its own dispatch note will not match its tally. If both
      methods are right, the thirteen thousand notes left between the branch and the centre,
      which is a matter for somebody other than the statisticians. And a scale reading low
      would show as the same proportional gap on every weighing this fortnight, which is a
      single test on this morning's returns.

  # ----- day 5. The multiplier, in a ledger.
- title: Twelve million that could become six hundred
  objective: Work out what the banking system can create, and what caps it.
  briefing: The banking supervisor wants the reserve requirement raised before the new notes go out.
  stake: >-

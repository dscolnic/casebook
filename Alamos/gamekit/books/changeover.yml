      and then at Iyer's proposed one. The gap between the two answers is the argument the board is
      about to have, and it is much larger than the injection itself.
    background:
    - >-
      Why the injection is not the increase. Reserves lent become deposits, which are lent again
      less the required fraction, and so on. The total the system can create is the injection
      times the multiplier, and only the multiplier is under the board's control.
    - >-
      What makes it a ceiling rather than a forecast. Banks lend to the limit only if there are
      borrowers and confidence. In a changeover fortnight there may be neither, so the figure is

    that could support hundreds of millions in deposits. Before the money moves, you calculate the ceiling and what
    a higher reserve requirement would change.
  takeaway: A pound of reserves supports several pounds of deposits, and the requirement sets how many.
  segue: >-
    At four o'clock the board finally got a number. At two per cent, twelve million marks of
    reserves can grow into six hundred million. The board still has no rate. So it knows what
    one mark becomes inside a bank. Nobody has asked yet what one mark becomes inside a
    paycheck.
  stops:
  - group: BANKS
    task: Work out what the requirement caps
    title: One over the ratio
    reason: >-
      Sunita Iyer wants the reserve requirement raised from two per cent to eight before the
      new notes go out, and Ruth Haldane's bank is the test case for what that would cost.
    place: Ledger Hall
    relationship: >-
      In the simplified deposit-multiplier model used here: maximum multiplier = 1 ÷ required reserve ratio.
    concept: 'The money multiplier, and what a reserve requirement caps'
    takesAsRead:
    - 'Fractional reserve banking: a deposit is somebody else’s loan'
    - 'The spending multiplier, and why one round is not the total'
    scene: >
      The requirement is two per cent. Iyer wants eight. Haldane's bank holds 21 million of
      reserves against 780 million of deposits.
    guide: >-
      Use the simplified multiplier to compare the two reserve rules, then check Haldane’s actual balance sheet.
      Treat the result as a ceiling under the model—not a prediction that banks will automatically lend to it.
    background:
    - >-
      Why one over the ratio. Each pound of reserves can support deposits up to the point where
      the required fraction of them equals that pound, so the maximum is the reciprocal. At two
      per cent a pound supports fifty; at eight it supports twelve and a half.
    - >-
      Why the timing is Iyer's whole argument. Raising the requirement before the new notes go
      out constrains lending that has not happened. Raising it afterwards forces banks to call in
      loans already made, which contracts the money supply exactly when the board is trying to
      stabilise it.
    assumes:
    - banks lend up to the limit the requirement allows
    takeaway: In the simplified model, a higher required reserve ratio lowers the maximum deposit expansion.
    format: BALLPARK
    question: Estimate the money multiplier at each requirement.
    estimate:
      prompt: The requirement is 2 per cent now and Iyer wants 8. Work out the multiplier at the proposed 
        figure.
      question: Estimate the money multiplier at the proposed 8 per cent.
      labels:
      - 1  (the numerator)
      - 0.08  (the proposed reserve ratio)
      - 0.02  (the current reserve ratio)
      - 780  (Haldane's deposits, in millions)
      values: [1, 0.08, 0.02, 780]
      slots: 2
      template: '{0} ÷ {1}'
      formula: a/b
      correct: [0, 1]
      target: 12.5
      tolerance: 1
      units: times reserves
      solution: 1 ÷ 0.08 = 12.5, against 1 ÷ 0.02 = 50 at the current requirement.
      explanation: Twelve and a half against fifty. The requirement quadruples and the multiplier falls to a 
        quarter.
    answerText: 12.5 at eight per cent, against 50 at two — the multiplier falls to a quarter.
    why: >-
      In the simplified AP-style model, 1 ÷ 0.08 = 12.5 and 1 ÷ 0.02 = 50, so the maximum multiplier falls to one
      quarter. The bank's own sheet shows 21 million of reserves behind 780 million of deposits, or about 2.7 per cent.
      An 8 per cent rule would require 62.4 million, leaving a 41.4 million shortfall if applied at once. The model
      does not say banks will actually create fifty times every new reserve mark: borrowers, excess reserves, cash
      holdings and the banking rules all matter. What it does give the board is a stress-test ceiling and a clear
      picture of how abrupt the proposed rule would be for Haldane today.
    rebuttals:
    - Using the current two per cent gives the multiplier the board is trying to move away from.
    - The deposit total is what the multiplier applies to rather than an input to the multiplier.

      eventually constrains runs nine months. So the cap on new lending is a month away and
      the adjustment of existing lending is most of a year. That is why the vote has to happen
      before the new notes go out rather than after. The effect the board wants is a month
      behind whatever it decides today.
    rebuttals:
    - The data here are the board's own and are days old, so recognition is not the delay.
    - The board is meeting daily, so deciding costs hours rather than weeks.
    - A requirement applies from the next reporting date, not from the moment it is announced.
  - group: TRADE
    task: Say what the trade-off looks like in the short run
    title: Prices against jobs
    reason: >-
      Josiah Mbeya's wage plan and Sunita Iyer's requirement pull in opposite directions, and
      Levon Sarkis wants the trade-off stated plainly before the board has to pick one.
    place: Wire Room
    concept: 'The short-run trade-off between inflation and unemployment'
    takesAsRead:
    - 'Demand-pull and cost-push inflation, and telling them apart'
    - 'Frictional, structural and cyclical unemployment'
    scene: >
      Mbeya's plan would lower unemployment and raise prices. Iyer's requirement would lower
      prices and raise unemployment. Verhoeven has to pick one before the fifteenth.
    guide: >-
      In the short run a demand policy moves prices and unemployment in opposite directions, which
      is what makes this a choice rather than an optimisation. Say what the trade-off actually is
      here — and what makes Halvern's case unusual, because a cost shock does not sit on the same
      curve.
    background:
    - >-
      Why the trade-off exists in the short run. More spending buys more output and more
      employment, and pulls prices up doing it. Less spending does the reverse. Along that curve
      a board chooses a point rather than escaping it.
    - >-
      Why a cost shock is worse than a choice. A supply shock moves the whole trade-off, so both
      numbers get worse at once and no point on the old curve is available. That is Halvern's
      case, and it is why neither policy on the table is a solution rather than a preference.
    assumes:
    - both policies act within the fortnight
    takeaway: Some events give you a choice and some take the choices away.
    format: CHOICE
    question: What does the board face this fortnight?
    choices:
    - 'A worse trade-off: the curve itself has moved'
    - A straightforward choice between prices and jobs, because a demand policy moves both
    - No trade-off, since both can be improved together
    - A choice that only matters after the fifteenth
    answer: 'A worse trade-off: the curve itself has moved'
    why: >
      In an ordinary month the board would be choosing a point: more demand for lower
      unemployment and higher prices, or less for the reverse. A cost shock does something
      different. It moves the whole relationship, so every available combination is worse than
      it was, and no point on the old curve exists any more. That is why Mbeya's plan and
      Iyer's requirement are both defensible, and neither is a solution. One buys jobs with
      prices; the other buys prices with jobs. The shock has left both worse than either would
      have been. It matters now rather than later because the impact lag is a month.
    rebuttals:
    - A straightforward choice would be available if the curve had not moved, and it has.
    - Both cannot improve together while the shock is raising costs.
    - The impact lag is a month, so a decision after the fifteenth lands after the recovery starts.

  # ----- day 12. The rate is fixed.
- title: Rehearse 4.15 before you sign it
  objective: Fix the rate and say what it costs whom.
  briefing: The board chair is right today, and the number still has to be defensible.
  stake: >-
    Friday, three days before the changeover. The 4.15 candidate survived the reserve test, but no one has signed
    it. Today the counter rehearses the conversion, the price room checks what redenomination does to the index,
    and you look for any reason 4.15 still cannot be defended.
  takeaway: A rate that can be held is worth more than a rate that is fair and cannot be.
  segue: >-
    The notice went up at four: 4.15 old marks to one new. One saver's tin at the counter is
    worth 2,410 new marks now, not the 2,778 it was worth that morning. She is one of nine
    hundred thousand people paying for a rate that will last 134 days. But by six, the
    mills and the bakeries had both wired in. One said the rate was too weak. The other said
    it was too strong.
  stops:
  - group: RATE
    task: Convert the rate into what a wage becomes
    title: Four fifteen to the old
    reason: >-
      Ngozi Okonjo needs the counter software tested against the surviving 4.15 candidate before Monday. A direction
      error would make every converted wage wrong even if the final rate itself is correct.
    place: Rate Room
    relationship: >-
      An exchange rate as a price: rate = foreign currency ÷ domestic currency, quoted in a stated direction.
    concept: 'An exchange rate as a price, and what moves it'
    takesAsRead:
    - 'The balance of payments: the current account and its mirror'
    - 'Demand, supply and the price that clears a market'
    scene: >-
      For the rehearsal, use 4.15 old marks to one new. The tram drivers earn 2,180 old marks a month. Okonjo needs
      the test conversion before the counter opens on Monday.
    guide: >-
      This is a rehearsal of the surviving candidate, not the final signature. Divide or multiply according to the
      quoted direction, then check the result using the reciprocal rate.
    background:
    - >-
      Why the direction matters more than the arithmetic. A rate quoted as 4.15 old to one new
      and a rate quoted as 0.241 new to one old are the same rate. Multiplying when you should
      divide gives a wage seventeen times too large, and the counter notice is read by nine
      hundred thousand people.
    - >-
      What the new figure means. A wage of 525 new marks buys what 2,180 old ones bought this
      morning, so nobody is better or worse off at the moment of conversion. Everything that
      happens afterwards depends on what prices do in the new currency.
    assumes:
    - the rate is quoted as old marks per new mark
    takeaway: A conversion factor changes the numerical unit; its real consequences depend on how prices, 
      wages and external values move around it.
    format: BALLPARK
    question: Estimate the drivers' wage in new marks.
    estimate:
      prompt: The rate is 4.15 old marks to one new. The drivers earn 2,180 old marks a month.
      question: Estimate the drivers' wage in new marks.
      labels:
      - 2180  (the wage in old marks)
      - 4.15  (old marks per new mark)
      - 0.241  (new marks per old mark)
      - 275  (the price index)
      values: [2180, 4.15, 0.241, 275]
      slots: 2
      template: '{0} ÷ {1}'
      formula: a/b
      correct: [0, 1]
      target: 525
      tolerance: 30
      units: new marks
      solution: 2,180 ÷ 4.15 = 525 new marks a month.
      explanation: Five hundred and twenty-five. Multiplying instead gives 9,047, which is the error a counter
        notice cannot make.
    answerText: About 525 new marks a month, where multiplying would have printed 9,047.
    why: >-
      The quote is old marks per new mark, so 2,180 ÷ 4.15 ≈ 525 new marks. The reciprocal route gives the same
      result. If every domestic wage, account balance and posted domestic price were converted by the same factor
      at the same instant, the unit change alone would not alter purchasing power. The real stakes come from what
      happens to imported prices, inflation, reserves, and any contracts that are not converted symmetrically. Today’s
      job is to make the arithmetic operationally correct before the board decides whether to sign 4.15 at all.
    rebuttals:
    - Multiplying by old marks per new applies the rate in the wrong direction and inflates the wage 
      seventeenfold.
    - The price index converts across time rather than across currencies.
  - group: COUNTER
    task: Say what 4.15 costs—and what conversion alone does not cost
    title: Fewer new units is not the whole loss
    reason: >-
      Okonjo will be asked why 10,000 old marks become fewer new units at 4.15 than at 3.60. The answer has to separate
      a change of unit from the real effects of choosing a different external value.
    place: Counter Room
    concept: 'A fixed rate, and what it costs to defend one'
    takesAsRead:
    - 'An exchange rate as a price, and what moves it'
    - 'Monetary policy: the three tools and what each one moves'
    scene: >-
      At 4.15, 10,000 old marks convert to about 2,410 new marks; at 3.60 they would convert to about 2,778. The
      reserve clock says 4.15 can be defended for about 134 days while 3.60 lasts about 36.
    guide: >-
      Do not call the smaller number of new units a purchasing-power loss by itself. Ask what happens to domestic
      prices that are converted at the same factor, and separately what happens to imported goods and to confidence
      if the peg fails.
    background:
    - >-
      What savers lose at the weaker rate. About thirteen per cent of what they held, immediately
      and visibly, which is why 3.60 is what the queue wants and what the board cannot hold.
    - >-
      What everybody loses if a peg fails. The rate goes wherever the market puts it,
      which is past 4.80 on Sarkis's numbers. Everybody who took the new currency because
      the board promised 3.60 takes that loss instead. The saver loses more, later, along
      with everybody else.
    assumes:
    - the reserve figures hold at each rate
    takeaway: Redenomination changes units; the real distributional effects come from relative prices, 
      external value, inflation and whether the promise holds.
    format: CHOICE
    question: What is the honest way to explain the 4.15 candidate?
    choices:
    - It converts balances into fewer new units than 3.60, and it also survives the reserve test.
    - It makes every saver about 13 per cent poorer the instant the counter opens.
    - It is the fairest rate available, because it maximizes how long the reserves last.
    - It is only a temporary rate, and the board can promise a better one later on.
    answer: It converts balances into fewer new units than 3.60, and it also survives the reserve test.
    why: >-
      Ten thousand old marks becoming 2,410 rather than 2,778 new marks is a nominal difference between two conversion
      factors. If domestic prices and claims are converted consistently, that arithmetic alone does not tell you
      the change in real purchasing power. The meaningful comparison is what each candidate does to imported prices,
      reserve losses, inflation expectations and the risk of a forced devaluation. 3.60 fails the 96-day reserve
      test; 4.15 survives it. Calling the smaller new-number balance an immediate real loss confuses a unit change
      with the economic consequences of the chosen external value.
    rebuttals:
    - A smaller number of new currency units is not by itself a smaller real balance if prices and claims 
      convert by the same factor.
    - Reserve longevity is a constraint, not a complete measure of fairness.
    - The board cannot promise a later improvement it may not be able to defend.
  - group: PRICES
    task: Say what the index does on the fifteenth
    title: One basket, two currencies
    reason: >-
      Emil Radic has to say what the index does the moment the currency itself changes
      underneath it, before the fifteenth makes the question unavoidable.
    place: Price Room
    concept: 'A price index, and the basket it is an index of'
    takesAsRead:
    - 'Gross domestic product, and the four things it adds up'
    scene: >
      On the fifteenth the same basket will be priced in new marks. Radic has to decide what
      happens to the series that has been running in old marks for eleven years.
    guide: >-
      The basket is not changing and the currency is. Decide what has to happen to the index
      so that a month before the changeover can be compared with a month after it. Then say
      what the alternative costs.
    background:
    - >-
      Why the index can survive a currency change. An index is a ratio, and a ratio is
      unitless. Prices in new marks divided by base-year prices converted at the same rate
      give the same index. So the series continues if the conversion is applied
      consistently to both.
    - >-
      What breaks it. Converting this month's prices and not the base year's, which changes the
      index by the rate rather than by any price movement. That would print a 76 per cent fall in
      prices on the fifteenth and nothing would have happened.
    assumes:
    - the conversion rate is applied to the whole series
    takeaway: A pure currency-unit conversion cancels in an index ratio if both comparison periods are 
      converted consistently.
    format: TRIAGE
    question: What has to happen to the index on the fifteenth?
    choices:
    - Convert both this month and the base year, so the ratio is unchanged
    - Start a new series at 100 and abandon the old one
    - Convert this month's prices only
    - Publish both series and let readers choose
    answer: Convert both this month and the base year, so the ratio is unchanged
    why: >
      An index is a ratio and a ratio has no units, so a currency change cancels — provided it
      is applied to both halves. Convert this month's basket and the base year's at the same
      rate and the index is exactly what it was, and eleven years of series survives.
      Converting only this month divides the index by 4.15. It would print a 76 per cent fall
      in prices on a day when nothing happened. That is the error that would end the series'
      credibility. Starting again at 100 throws away eleven years for no reason. Publishing
      both invites everybody to quote whichever suits them.
    rebuttals:
    - Restarting at 100 discards eleven years of comparison for a change that cancels.
    - Converting one side only prints a 76 per cent price fall on a day when nothing happened.
    - Two parallel series means every argument gets to pick the number it prefers.


# changeover.yml — Changeover. AP Macroeconomics on the top four floors of
# Kesteven House, Halvern.
#
# THE PLACE SOLVES THIS COURSE'S PROBLEM. Every quantity in macroeconomics is
# national, aggregated and invisible, which is why a first-person game has never
# been set in one. A currency changeover makes all of them local for a fortnight:
# the money supply is a mass of old notes on a platform scale, the multiplier is
# a column in a ledger, the open economy arrives one telex at a time, and the
# rate is set two floors above the room where the index is built.
#
# AND A HUNDRED AND EIGHTY METRES UP, IT MAKES THEM VISIBLE. The board took the
# top four floors of the tallest building in Halvern because it was the only
# vacant plate big enough, and the accident of that is the whole game: the queue
# for the counter is on the plaza directly below, Vend Street — two thirds of the
# basket — runs west from the door, and the port the trade figures come off is on
# the horizon. Every quantity the course asks about has something out of the
# window that it is a number for, and the player can look at both at once.
#
# The argument, both sides right on some day: Verhoeven needs the rate fixed on
# Friday because wages and contracts have to be written against something, and
# she is right on day 12 that an unfixed rate is its own kind of inflation. Radic
# will not certify an index built on three weeks of prices, and he is right on
# day 4 that the basket he was handed prices a city nobody lives in.
#
#   node tools/import-book.mjs books/changeover.yml changeover --verify

theme:
  id: changeover
  title: Changeover
  subtitle: Chief Economist · Halvern Currency Board

groups:
- id: COUNTER
  code: COUNTER
  name: Counter Room
  color: '#a8763c'
  desc: Households, one at a time, with money in their hands.
  defaultLeader: okonjo
  milestones: [Open the counter, Read the queue, Set the terms, Ready for the fifteenth]
- id: PRICES
  code: PRICES
  name: Price Room
  color: '#3f8f7a'
  desc: The basket, the index and what the index is an index of.
  defaultLeader: radic
  milestones: [Price the basket, Build the index, Defend it, Ready for the fifteenth]
- id: NOTES
  code: NOTES
  name: Note Room
  color: '#8a6f4a'
  desc: The old currency, weighed on the way out of circulation.
  defaultLeader: tulloch
  milestones: [Weigh the returns, Count the supply, Reconcile it, Ready for the fifteenth]
- id: BANKS
  code: BANKS
  name: Ledger Hall
  color: '#5f7fa8'
  desc: Reserves, deposits and what the banks can create out of both.
  defaultLeader: iyer
  milestones: [Read the reserves, Work the multiplier, Set the requirement, Ready for the fifteenth]
- id: RATE
  code: RATE
  name: Rate Room
  color: '#8a5c7f'
  desc: The rate, the tools and the lag between them.
  defaultLeader: verhoeven
  milestones: [Read the market, Choose the tool, Time it, Ready for the fifteenth]
- id: TRADE
  code: TRADE
  name: Wire Room
  color: '#4a7f8a'
  desc: The open economy, one wire at a time.
  defaultLeader: sarkis
  milestones: [Read the wires, Balance the account, Price the currency, Ready for the fifteenth]

roster:
- id: verhoeven
  name: Ada Verhoeven
  role: Board Chair
  division: RATE
  bio: |
    Chairs the currency board, which was three people and a room a month ago
    and is now the only institution in Halvern with a decision to make.

    Her position is about certainty rather than about a number. Wages,
    contracts, rents and pensions all have to be written against something by
    the fifteenth, and an unfixed rate means every one of them is written
    against a guess. She would take a wrong rate announced on Friday over a
    right one announced late.

    What she will not do is announce a rate the reserves cannot hold. She has
    seen a peg fail and says it costs more than never having set one.
  quiz:
  - q: Why does Verhoeven prefer a fixed rate announced early to a better one announced late?
    a: Everything signed this fortnight needs a fixed figure to refer to
    wrong:
    - A rate announced late has to be defended with reserves the board does not hold
    - Announcing early gives the board time to revise the figure before the fifteenth
    - The board's authority to set a rate expires on the fourteenth
- id: radic
  name: Emil Radic
  role: Chief Statistician
  division: PRICES
  bio: |
    Built the price index Halvern has used for eleven years and refuses to
    certify the one he has been handed for the changeover.

    His objection is the basket. It was fixed in a year when half the city
    heated with coal and nobody bought imported flour, so it prices a city
    that has stopped existing. An index is only as good as the list of things
    it prices, and the list is the part nobody argues about because it is dull.

    He will publish a provisional figure with the basket printed beside it. He
    will not publish a final one and let the basket stay unexamined.
  quiz:
  - q: Why does Radic insist the basket be printed beside the index?
    a: Readers can only judge the figure if they can see what was priced
    wrong:
    - Publishing the basket is required before a figure can be called provisional
    - The basket has to be shown so that other cities can compare their own indices
    - Without it the index cannot be recalculated for a different base year
- id: okonjo
  name: Ngozi Okonjo
  role: Counter Supervisor
  division: COUNTER
  bio: |
    Runs the exchange counter down on the plaza, which means she is the only
    person on these four floors who spends any part of the day in front of the
    public and the only one who knows what the queue is actually doing.

    She reads behaviour rather than figures. A queue that lengthens on the day
    a rate is rumoured is a queue that has heard something, and the people at
    the front of it are the ones with the most to lose from waiting.

    Her complaint about the board is that it discusses households as a
    component of demand while she watches nine hundred of them from a window
    that is too far up to hear anything, forty at a time at the counters,
    asking what a note will be worth on Monday.
  quiz:
  - q: What does Okonjo learn from the length of the queue that the board cannot?
    a: What people expect the rate to do next
    wrong:
    - How much old currency is left in circulation across the city
    - Whether the counter is staffed adequately for the fortnight ahead
    - Which denominations are being hoarded rather than exchanged
- id: tulloch
  name: Bram Tulloch
  role: Note Room Manager
  division: NOTES
  bio: |
    Weighed freight for Halvern Docks for nineteen years and weighs money now,
    on the same three platform scales, four hundred and forty feet up. Three
    scales, a ledger, and a goods hoist down to the furnace.

    He counts by weight because counting by hand is impossible at this volume,
    and he is exact about what that assumes: a note's mass, a denomination mix
    and a sample to check both. Get the mix wrong and the count is wrong by
    whatever fraction the mix is wrong by.

    He sends the returns down to the furnace under two signatures, which is the
    only part of this fortnight that is genuinely irreversible.
  quiz:
  - q: Why does Tulloch sample the denomination mix rather than assume it?
    a: A wrong mix makes the whole weighed count wrong
    wrong:
    - Sampling is required by the board before notes can be destroyed
    - The scales cannot distinguish denominations without a sample to calibrate against
    - The mix determines how many furnace loads the returns will take
- id: iyer
  name: Sunita Iyer
  role: Banking Supervisor
  division: BANKS
  bio: |
    Supervises eleven regional banks that between them hold every deposit in
    Halvern, from a ledger hall with no computer in it.

    Her subject is the gap between what a bank holds and what it owes. A
    deposit is somebody else's loan, so the money supply is not a stock
    somebody decided on — it is what the banking system created, and a reserve
    requirement is the only thing that caps it.

    She has spent the fortnight arguing that the requirement has to rise before
    the new currency goes out rather than after. Afterwards is a different and
    much worse problem.
  quiz:
  - q: Why does Iyer want the reserve requirement raised before the changeover rather than after?
    a: Raising it later forces banks to unwind loans already made
    wrong:
    - A requirement raised after the changeover would apply to the old currency instead
    - The board loses the power to set the requirement once the new notes are issued
    - Banks cannot calculate their reserves during a changeover fortnight
- id: sarkis
  name: Levon Sarkis
  role: Trade and Reserves Officer
  division: TRADE
  bio: |
    Sits in the wire room with six correspondents in three time zones and the
    reserve position in a locked book.

    He thinks in flows per day rather than in totals, because a reserve stock
    divided by a daily outflow is a number of days and a number of days is a
    decision. The board asks him whether the reserves are enough; he answers
    with how long they last at the rate being proposed.

    His frustration is that the current account is discussed as a moral
    question. It is an identity: a deficit is being financed by something, and
    the something is either borrowing or reserves.
  quiz:
  - q: Why does Sarkis answer questions about reserves with a number of days?
    a: A stock over a daily outflow is a deadline
    wrong:
    - The board's mandate requires reserve positions to be expressed as coverage in days
    - Daily figures are the only ones the correspondents will accept by telex
    - Reserve totals are revised too often to be quoted as a single number
- id: prentice
  name: Della Prentice
  role: Labour Statistician
  division: PRICES
  bio: |
    Counts who is working, which during a changeover is harder than usual
    because a great many people have stopped being paid without stopping
    working.

    She is precise about the denominator. The unemployment rate is out of the
    labour force, not the population, so somebody who gives up looking leaves
    the rate rather than raising it — and a fortnight like this makes people
    give up looking.

    What she keeps saying to the board is that a falling rate in a bad month is
    usually people leaving the count.
  quiz:
  - q: Why can Prentice's unemployment rate fall in a bad month?
    a: People who stop looking leave the labour force
    wrong:
    - Seasonal adjustment removes short-term movements from the published figure
    - A changeover fortnight suspends the counting of casual and daily-paid workers
    - Employers report hiring intentions rather than actual hires
- id: mbeya
  name: Josiah Mbeya
  role: Treasury Liaison
  division: RATE
  bio: |
    Represents a treasury that would like the board to be independent in
    public and helpful in private.

    His interest is fiscal: the government has wages to pay in a currency that
    is about to stop existing, and every option it has moves aggregate demand
    at exactly the moment prices are unstable.

    He is straightforward about the conflict. Spending to keep people paid is
    the right thing to do and it is also the thing that makes an inflation
    figure worse, and he would rather that be said in the room than discovered
    in a newspaper.
  quiz:
  - q: What is the conflict Mbeya says out loud?
    a: Paying wages now worsens the inflation figure
    wrong:
    - The treasury cannot borrow in a currency that is being withdrawn
    - Board independence prevents the treasury from being consulted on the rate
    - Government wages are the largest single component of aggregate demand
- id: haldane
  name: Ruth Haldane
  role: Regional Bank Manager
  division: BANKS
  bio: |
    Manages the largest of the eleven regional banks, which holds about a third
    of Halvern's deposits and rather less than a third of its reserves.

    She is candid about what a bank is. It holds a fraction of what it owes and
    lends the rest, which works because depositors do not all arrive on the
    same morning — and a changeover is precisely the event that makes them
    consider it.

    She wants the requirement raised in steps rather than at once, and she has
    the arithmetic for what happens to her loan book either way.
  quiz:
  - q: Why does Haldane say a changeover is dangerous for a bank specifically?
    a: It gives every depositor the same reason to come at once
    wrong:
    - Old currency held as reserves cannot be counted toward the requirement
    - Banks must exchange their own reserves before their depositors can
    - Loan repayments in old currency lose value faster than deposits do
- id: farr
  name: Douglas Farr
  role: Press Officer
  division: RATE
  bio: |
    Writes what the board says, which during a changeover is a monetary
    instrument rather than a courtesy.

    His argument is that expectations are the cheapest tool the board has and
    the easiest to spend. A rate announced with a reason holds better than the
    same rate announced with a number, because people price what they expect
    next rather than what is true now.

    He has one rule: the board never publishes a figure it might have to
    correct, because the correction costs more credibility than the figure
    bought.
  quiz:
  - q: Why does Farr treat what the board says as a policy tool?
    a: People act on what they expect next
    wrong:
    - Announcements are the only instrument available before the new notes are issued
    - The board's statements are legally binding on banks and employers
    - A published figure cannot be revised once it is in the newspapers
- id: novotny
  name: Kata Novotny
  role: Market Trader
  division: COUNTER
  bio: |
    Sells vegetables in the market square and has repriced her stall every
    morning for three weeks, which makes her a better source on inflation than
    anybody in this building.

    Her prices are not the index. She buys imported flour at a rate that moves
    daily and local carrots at a price that has not moved since spring, so the
    basket matters enormously and her own experience of it is one basket of one
    household.

    She is the person Radic sends the new basket to before he certifies it.
  quiz:
  - q: Why is Novotny's experience of prices not the same as the index?
    a: Her basket is one household's, not the average
    wrong:
    - Market stall prices are excluded from the official basket by convention
    - She reprices daily and the index is compiled monthly
    - Imported goods are weighted differently in the index than at a stall
- id: adeyinka
  name: Femi Adeyinka
  role: Vault Officer
  division: NOTES
  bio: |
    Guards what is left of the reserve holding, which is in the old left
    luggage room behind two doors and a ledger.

    He signs for what comes in and what goes out and will not sign for a total
    he has not seen counted. His refusal has held up two board meetings and
    been right twice.

    He is the person who noticed the discrepancy between the weighed returns
    and the ledger, which is the difference between an accounting error and
    several hundred thousand marks that never came back.
  quiz:
  - q: Why does Adeyinka refuse to sign for a total he has not seen counted?
    a: A signature converts an estimate into a fact
    wrong:
    - The board requires two signatures on every vault movement
    - Weighed totals are unreliable without a denomination sample
    - Counting is the only way to identify counterfeit notes in a return

glossary:
- name: Money supply
  aliases: [money supply, quantity of money]
  def: 'Spendable money held by the public: currency in circulation plus the deposit balances included in the chosen
    money measure, without double-counting interbank claims.'
- name: Reserve requirement
  aliases: [reserve requirement, reserve ratio, reserves]
  def: The ratio of a bank's reserves to its deposits — the share it must hold back — set by the rule. In the
    simplified deposit-multiplier model used in this game, a higher ratio lowers the maximum deposit expansion.
- name: Deposit
  aliases: [deposit, deposits]
  def: Money a bank owes you on demand. It counts as money even though the bank has lent most of it to 
    somebody else.
- name: Price index
  aliases: [price index, index, consumer price index]
  def: A weighted basket repriced over time and compared with a base period. The weights say whose spending 
    pattern the index is meant to represent.
- name: Basket
  aliases: [basket, the basket]
  def: The unchanging list of things whose cost is tracked month to month. Choosing it decides what the 
    tracking is about.
- name: Inflation
  aliases: [inflation, inflationary]
  def: The rate at which the general price level is rising, usually per month or per year. A rate, not a 
    level.
- name: Nominal
  aliases: [nominal]
  def: A figure as measured, in the money of the day, before the change in prices has been taken out of it.
- name: Real
  aliases: [real terms, in real terms]
  def: A figure with the price change taken out, so two years can be compared by what the money would buy.
- name: Aggregate demand
  aliases: [aggregate demand, total demand]
  def: 'Everything bought in an economy at each price level: by households, by firms, by government, and by buyers
    outside the country less what is bought from them.'
- name: Aggregate supply
  aliases: [aggregate supply]
  def: What producers will make at each price level. Prices move it in the short run; in the long run it is 
    capacity.
- name: Output gap
  aliases: [output gap]
  def: The difference between what the economy is producing and what it could produce at full employment, as a
    percentage.
- name: Multiplier
  aliases: [multiplier, spending multiplier]
  def: A mark that reaches somebody becomes their money, and part of it moves on again, so the total effect 
    exceeds the first round.
- name: Labour force
  aliases: [labour force, labor force]
  def: Everybody in work, and everybody without work who is looking. People who stop looking drop out, which 
    is why the rate can fall in a bad month.
- name: Exchange rate
  aliases: [exchange rate, the rate]
  def: The price of one currency in units of another. Quoted in either direction, and the direction matters.
- name: Current account
  aliases: [current account]
  def: What crosses the border in both directions, with money sent home and money owed abroad. A shortfall has
    to be covered somehow.
- name: Peg
  aliases: [peg, pegged, fixed rate]
  def: A rate the authorities commit to holding, by buying or selling their own currency with reserves 
    whenever the market disagrees.
- name: Velocity
  aliases: [velocity]
  def: How often a unit of money changes hands in a period. If it holds steady, money growing faster than 
    output shows up in prices.

warmups:
  # THE MISSION-1 WARM-UP CARRIES NO STORY, deliberately — one sentence, purely
  # functional, because on this morning the player has met nobody and the reason
  # for the run is orientation itself (THREE_PASS_BRIEF mandate 4b). It still
  # names Okonjo's job: this card is read before day 1's stake, so it is where
  # `checkNames` sees her first.
  greet:
    title: Get round the four floors before the counter opens
    why: >-
      Ngozi Okonjo, the counter supervisor, wants you known to as many of the people on these
      four floors as you can get round this morning.
  trial-near:
    title: Walk floor forty-five before you sign anything
    why: >-
      The counter room and the note room are at opposite ends of one corridor, and the arithmetic
      runs between them in that order. Bram Tulloch, who manages the note room, walks every new
      officer the length of the floor once, because the money coming out of circulation is weighed
      across the corridor from the desk that decided how much of it to take.
  follow:
    title: Follow Novotny round her repricing
    why: >-
      Kata Novotny, a market trader from Vend Street, brings her price cards up to the price room
      every morning and does not stop walking to explain them. Stay with her: the basket Emil
      Radic, the chief statistician, has been handed prices a city that stopped existing, and her
      stall — visible from the window, four hundred metres west — is the only place in Halvern
      where the new one can be checked against something real.
  hunt:
    title: Six ledgers, and one of them does not reconcile
    item: {name: ledger, plural: ledgers}
    why: >-
      Femi Adeyinka, the vault officer, has six regional ledgers out across these four floors and
      a weighed total that does not match their sum. Find all six and read them. The gap between
      the weighed returns and the ledgers is either an accounting error or several hundred thousand
      marks that never came back.
  canvass:
    title: Ask everyone on the counter floor the same question
    why: >-
      The board is about to set a rate on the assumption that people will hold the new currency
      rather than spend it at once. Ngozi Okonjo, the counter supervisor, has forty people who have
      been on the plaza telephones since eight and will not put words in any of their mouths. Ask
      each of them one question and count the answers — expectations are a policy instrument, and
      this is the only instrument that measures them.
  evade:
    title: Keep clear of the treasury man until the index is certified
    why: >-
      Josiah Mbeya, the treasury liaison, wants the provisional inflation figure before the chief
      statistician, Emil Radic, has certified the basket it rests on. Keep your distance until it is signed: a number
      quoted
      in a corridor arrives at the board with nobody's name on it and a basket nobody has examined.
  tag:
    title: Catch Sarkis before the wire closes
    why: >-
      Levon Sarkis, the trade and reserves officer, closes the wire room at four and the reserve
      position for the week is only in his book. He is halfway down the corridor at speed with it
      under his arm, and after four the rate has to be argued from last week's number.

# ---------------------------------------------------------------- the fortnight
missions:
  # ----- day 1. What the board is actually measuring.
- title: The board has numbers. None agree
  objective: Establish what the board measures and what it can defend.
  briefing: Three weeks of prices, a basket from another decade, and a rate due Friday.
  stake: >-
    Monday, fourteen days out. The board wants a conversion rate, but its price basket is stale, the counter queue
    has tripled and the note count depends on a sample. Today you decide which numbers are measurements and which
    are guesses before anybody argues about the rate.
  takeaway: Every economic statistic counts something specific, over a specific period.
  segue: >-
    The rate book's first page goes in tonight, with three numbers on it. But not one of them
    would survive Friday's meeting. The board now knows what it doesn't know, and it has
    thirteen days left to fix that.
  stops:
  - group: PRICES
    task: Work out what the basket costs now
    title: The same list, twice
    reason: >-
      Emil Radic needs a defensible index number before he will even consider certifying
      anything for Friday.
    place: Price Room
    relationship: >-
      A price index: index = (basket now ÷ basket in the base year) × 100, with the basket held fixed on purpose.
    concept: 'A price index, and the basket it is an index of'
    takesAsRead:
    - 'Gross domestic product, and the four things it adds up'
    scene: >
      Emil Radic, the chief statistician, has the fixed basket priced twice. It cost 84 marks
      in the base year and 231 marks this month. The board wants an index number for Friday.
    guide: >-
      An index is a ratio dressed as a number. Divide what the basket costs now by what the same
      basket cost in the base year, then multiply by a hundred so the base year reads as 100.
      Work it out, and note what the result does and does not say about anybody's cost of living.
    background:
    - >-
      Why the basket is held fixed. If the list changed with the prices, a rise could be hidden
      by substituting something cheaper, and the index would measure the substitution rather
      than the prices. Holding it still is what makes two years comparable.
    - >-
      What holding it still costs. A basket fixed years ago prices a city that has changed —
      which is Radic's objection. Both facts are true at once: the basket has to be fixed to be
      an index, and it has to be revised to be about anybody.
    assumes:
    - the basket is the same list of goods in both years
    takeaway: An index is a ratio to a base year, multiplied by a hundred.
    format: BALLPARK
    question: Estimate the price index for this month.
    estimate:
      prompt: The fixed basket cost 84 marks in the base year and 231 this month. The base year reads 100.
      question: Estimate the price index for this month.
      labels:
      - 231 marks  (the basket this month)
      - 84 marks  (the basket in the base year)
      - 100  (what the base year is set to read)
      - 147 marks  (the difference between the two)
      values: [231, 84, 100, 147]
      slots: 3
      template: '{0} ÷ {1} × {2}'
      formula: a/b*c
      correct: [0, 1, 2]
      target: 275
      tolerance: 15
      units: index points
      solution: index = 231 ÷ 84 × 100 = 275.
      explanation: An index of 275 means the same basket costs 2.75 times what it did — a level, not a rate.
    answerText: About 275, meaning the same list of goods costs 2.75 times the base year.
    why: >
      Two hundred and thirty-one over eighty-four is 2.75, and multiplying by a hundred gives an
      index of 275. The base year reads 100 by construction, which is the only reason index
      numbers are comparable at all. What this is not is an inflation rate: 275 is a level, and a
      rate is what the level does between two dates. Reading the difference of 147 as the answer
      gives a number in marks rather than in index points, and it cannot be compared with any
      other month. The basket is the part Radic is right about, and it does not change this
      arithmetic — it changes what the arithmetic is about.
    rebuttals:
    - The difference between the two costs is in marks and cannot be compared across months.
    - Dividing the base year by this month gives what the basket used to cost as a fraction of now.
  - group: COUNTER
    task: Say what the queue is telling you
    title: Forty people, and what they have heard
    reason: >-
      Ngozi Okonjo's queue is forty people deep this morning with nothing announced behind
      it, and she wants to know what that means before the board does.
    place: Counter Room
    concept: 'Expectations, credibility, and why a promise is a policy instrument'
    takesAsRead:
    - 'The short-run trade-off between inflation and unemployment'
    scene: >
      The counter supervisor Okonjo's queue was eleven people on Friday and forty this morning. Nothing has been
      announced. The board has not met since Thursday.
    guide: >-
      A queue is a measurement of what people expect rather than of what has happened. Ask what
      would make somebody move today rather than next week, and which of the four explanations on
      offer is consistent with nothing having been announced.
    background:
    - >-
      Why expectations are a policy variable rather than a mood. People act on what they think
      the rate will be, so the belief changes behaviour before any policy does. A rumour is
      therefore a monetary event, and the board's silence is a statement whether it means to be
      or not.
    - >-
      What the counter measures that the index cannot. The index reports prices already
      charged. The queue reports what people think prices will do, which is the variable the
      board can actually move on Friday.
    assumes:
    - nothing has been announced since Thursday
    takeaway: Expectations move before policy does, and a silence is read as information.
    format: CHOICE
    question: What is the lengthening queue evidence of?
    choices:
    - What people expect the rate to be
    - That prices rose over the weekend
    - That the counter was understaffed on Friday
    - That the old currency is nearly exhausted
    answer: What people expect the rate to be
    why: >
      Nothing has been announced, so nothing has happened to prices or to the rate — and forty
      people have still decided that today is better than next week. That decision is about the
      future rather than the past, which makes the queue a measurement of expectations and the
      only one the board has. Weekend prices would show in Radic's figures rather than at the
      counter. Staffing changes how fast a queue moves, not how many people join it. And the old
      currency is nowhere near exhausted: Bram Tulloch, who manages the note room, has
      weighed a fraction of what was issued.
    rebuttals:
    - Prices charged over the weekend appear in the index rather than in the length of a queue.
    - Staffing changes how fast the queue moves and not how many people decide to join it.
    - The returns so far are a small fraction of what was issued, so scarcity is not driving this.
  - group: NOTES
    task: Turn a weight of notes into a count
    title: Money on a platform scale
    reason: >-
      Bram Tulloch has 214 kilograms of returned notes on the scale and needs an actual
      count before the money supply figure can be trusted.
    place: Note Room
    relationship: >-
      Counting a withdrawn currency by weight: old notes = mass ÷ mass per note.
    concept: 'What counts as money, and the three things it has to do'
    takesAsRead:
    - 'Demand, supply and the price that clears a market'
    scene: >
      Tulloch has 214 kilograms of returned notes on the platform scale. A sample says the mix
      averages 0.94 grams a note. The board needs a count for the money supply figure.
    guide: >-
      Counting this many notes by hand is not possible, so the count comes from a mass and a
      mass per note. Divide, mind the units, and then ask what the answer depends on that is
      not on the scale. The sample is doing as much work here as the weighing is.
    background:
    - >-
      What the sample decides. Notes of different denominations weigh nearly the same, so the
      mass gives a count of notes and says nothing about their value. The denomination mix comes
      from a sample, and the value of the return is the count multiplied by that mix.
    - >-
      Why the count matters to the board. The money supply figure is what the rate is
      argued against. The part of it that is cash is exactly this: what was issued, less
      what has come back and been burnt under two signatures.
    assumes:
    - the sampled mass per note is representative of the whole return
    takeaway: A weighed count is a count of notes, and their value needs a sampled mix as well.
    format: VERIFY
    question: Predict the count from the weight, then hand-count a bundle and check it.
    verify:
      hint: >-
        Lock the prediction before anything is counted by hand. The weighed mass and the sampled
        mass per note are both on the ledger.
      prediction: {label: Predicted notes returned, unit: thousand notes, min: 100, max: 400, step: 1}
      truth: 228
      passRatio: [0.9, 1.1]
      intervention:
        label: Hand-count one bundle and weigh it
        note: One sealed bundle of a thousand, counted twice by two people.
        outcome: Counted. The bundle weighs 0.98 kilograms rather than the 0.94 the sample implied.
      measurement:
        label: Implied count from the hand-counted bundle
        note: 218,000 notes — four per cent fewer than the sample said, because the mix is heavier than 
          sampled.
        cost: 1
        costUnit: counts
      unmeasuredMoral: >-
        A count from a weight is a statement about the sample. Whether the sample matches what is
        actually in the sacks is a different claim, and one bundle settles it.
      commit: Report the count
    answerText: >-
      Predicted about 228,000 notes from 0.94 grams each; the hand-counted bundle gives 0.98 grams
      and 218,000 — four per cent fewer, because the mix is heavier than the sample said.
    why: >
      Two hundred and fourteen kilograms at 0.94 grams a note is about 228,000 notes. One
      bundle hand-counted says the notes average 0.98 grams, so the true count is nearer
      218,000. That is four per cent fewer, and the error is in the sample rather than in the
      scale. That matters twice over. The count feeds the money supply figure. The same sample
      supplies the denomination mix that turns a count into a value. So a mix wrong by four
      per cent is a value wrong by about the same. Notes of different denominations weigh
      almost the same, which is why the scale can give a count and can never give an amount of
      money.

  # ----- day 2. What the country produces, and who is working.
- title: The economy shrank while the jobless rate fell
  objective: Add up the output and count who is working, without double-counting either.
  briefing: The board's own output figure has flour in it twice.
  stake: >-
    Tuesday. One bag of flour was counted twice, and the unemployment rate fell in a month when three factories
    closed. If the board cannot say what output and unemployment actually count, every later policy choice starts
    from the wrong economy.
  takeaway: An aggregate is a sum of specific things, and what it excludes is a decision.
  segue: >-
    The jobless rate will print at 8.4 per cent tonight. Sixteen thousand of that drop is
    people who gave up looking for work, not people who found it. The output figure is solid
    now. But the newspapers will only quote the six o'clock draft, and nobody has fixed that
    sentence yet.
  stops:
  - group: PRICES
    task: Add up the output without counting anything twice
    title: Flour, and then bread
    reason: >-
      Emil Radic caught the flour counted twice, once as a sale to the bakery and again
      inside the bread, and wants the corrected total before the board trusts it.
    place: Price Room
    relationship: >-
      GDP by expenditure: GDP = C + I + G + (X − M), counting final goods once.
    concept: 'Gross domestic product, and the four things it adds up'
    takesAsRead:
    - 'Demand, supply and the price that clears a market'
    scene: >
      The month's figures: households spent 412 million, firms invested 96, the government
      spent 178, exports were 64 and imports 121. The board's draft adds the imports in.
    guide: >-
      Add what was spent on final goods by each of the four buyers, and subtract imports
      rather than adding them. An import is spending that went to somebody else's output. Work
      out the figure the board should publish, then say what the draft's error does to it.
    background:
    - >-
      Why imports are subtracted. Household spending already includes what households bought
      from abroad, so leaving imports in counts foreign output as Halvern's. Subtracting them
      removes exactly that, which is why the term is exports less imports rather than exports.
    - >-
      Why the flour is a different error. Counting flour sold to a bakery and then the bread
      counts the same wheat twice. Only final goods go in, which is why intermediate sales are
      excluded rather than being a separate component.
    assumes:
    - the four spending figures are all for the same month
    takeaway: Imports are subtracted because they are spending on somebody else's output.
    format: BALLPARK
    question: Estimate the month's output figure.
    estimate:
      prompt: Households 412, firms 96, government 178, exports 64, imports 121 — all in millions of marks.
      question: Estimate the month's output figure.
      labels:
      - 412  (household consumption)
      - 96  (investment by firms)
      - 178  (government spending)
      - 64  (exports)
      - 121  (imports)
      - 750  (the four components before imports come off)
      values: [412, 96, 178, 64, 121, 750]
      slots: 5
      template: '{0} + {1} + {2} + {3} − {4}'
      formula: a+b+c+d-e
      correct: [0, 1, 2, 3, 4]
      target: 629
      tolerance: 30
      units: million marks
      solution: 412 + 96 + 178 + 64 − 121 = 629 million marks.
      explanation: 629 million. The draft added the imports instead of subtracting them, which overstates 
        output by 242 million.
    answerText: 629 million marks — the draft's version overstates it by 242 million.
    why: >
      The four components add to 750 and imports of 121 come off, leaving 629 million. Adding
      imports instead of subtracting them is not a small slip. It moves the figure by twice
      the import total, 242 million, because the error is in the direction as well as the
      term. The reason imports are subtracted is that household spending already contains
      them, so leaving them in counts another country's output as Halvern's. The flour is a
      separate error of the same family: an intermediate good counted once as flour and again
      as bread. It is excluded rather than netted off.
    rebuttals:
    - Adding imports counts foreign output as Halvern's, and does so twice over because the spending is 
      already in the consumption figure.
    - Leaving imports out entirely ignores that the consumption figure already contains them.
  - group: COUNTER
    task: Say what the labour figure counts
    title: A rate that fell in a bad month
    reason: >-
      Della Prentice's jobless rate fell the same month three factories shut, and she wants
      the board to know what the number is actually counting before it gets quoted as good
      news.
    place: Counter Room
    relationship: >-
      The unemployment rate, u = unemployed ÷ labour force × 100, where the labour force is the employed plus those
      looking.
    concept: 'Unemployment: who is counted, and who is not in the labour force'
    takesAsRead:
    - 'Gross domestic product, and the four things it adds up'
    scene: >
      Della Prentice, the labour statistician, has 41,000 unemployed out of a labour force of
      486,000, down from 44,000 out of 502,000. Three factories shut during the month.
    guide: >-
      Work out both rates and compare them. Then look at what happened to the denominator. The
      labour force fell by sixteen thousand in a month when three factories closed, and that
      is the whole of the story.
    background:
    - >-
      Who is in the labour force. People working, and people not working who are looking for
      work. Somebody who stops looking is in neither category and leaves the calculation
      entirely, which lowers the numerator and the denominator at once.
    - >-
      Why a falling rate can be bad news. If people leave the labour force faster than they
      find work, the rate falls while fewer people are working. The figure that does not have
      this problem is the participation rate, which is why it is published beside it.
    assumes:
    - both months were counted the same way
    takeaway: A rate can fall because its denominator shrank rather than because its numerator did.
    format: BALLPARK
    question: Estimate this month's unemployment rate.
    estimate:
      prompt: 41,000 unemployed out of a labour force of 486,000, down from 44,000 out of 502,000.
      question: Estimate this month's unemployment rate.
      labels:
      - 41000  (unemployed this month)
      - 486000  (the labour force this month)
      - 502000  (the labour force last month)
      - 100  (to make it a percentage)
      values: [41000, 486000, 502000, 100]
      slots: 3
      template: '{0} ÷ {1} × {2}'
      formula: a/b*c
      correct: [0, 1, 3]
      target: 8.4
      tolerance: 0.5
      units: '%'
      solution: 41,000 ÷ 486,000 × 100 = 8.4 %, against 8.8 % last month.
      explanation: Down from 8.8 to 8.4 — while the labour force fell by 16,000, which is where most of the 
        improvement came from.
    answerText: About 8.4 per cent, down from 8.8 — while the labour force shrank by 16,000.
    why: >
      Forty-one thousand over 486,000 is 8.4 per cent, against 8.8 last month, so the
      published rate improves. The labour force fell by sixteen thousand in the same month,
      and that is where the improvement came from. People who stop looking are in neither the
      numerator nor the denominator. So they leave the rate rather than raising it. Three
      factories closing and a rate falling are consistent, and that is the point. Using last
      month's labour force with this month's unemployed gives 8.2, which mixes two months and
      makes the fall look larger.
    rebuttals:
    - Using last month's labour force with this month's unemployed mixes two periods.
    - The change in the labour force is the explanation rather than the rate being asked for.
  - group: BANKS
    task: Say what a deposit actually is
    title: Somebody else's loan
    reason: >-
      Sunita Iyer and Ruth Haldane have the eleven banks' reserves and deposits on the
      table, and the gap between the two is the shape of the money problem the board hasn't
      named yet.
    place: Ledger Hall
    concept: 'Fractional reserve banking: a deposit is somebody else’s loan'
    takesAsRead:
    - 'What counts as money, and the three things it has to do'
    scene: >
      Sunita Iyer, the banking supervisor, has the eleven regional balance sheets. Between them
      they hold 62 million marks of reserves against 2.4 billion of deposits. Ruth Haldane, who
      manages the largest of the eleven, is in the room.
    guide: >-
      Look at the two numbers and say what they mean about what a bank is. Then decide which of
      the four statements about the deposits is true, because three of them describe an
      arrangement no bank has ever had.
    background:
    - >-
      Why holding a fraction is normal rather than a scandal. Depositors do not all arrive on
      the same morning, so a bank can lend most of what it holds and still meet ordinary
      demands. The arrangement works on the strength of that assumption and nothing else.
    - >-
      What that makes the money supply. Not a quantity somebody decided on: the deposits are
      money, and they exist because loans were made. So the money supply is largely something
      the banking system created, which is why a reserve requirement is a policy tool.
    assumes:
    - the eleven balance sheets are for the same date
    takeaway: Most of what a country calls money was never issued by anybody.
    format: CHOICE
    question: What is true of the 2.4 billion in deposits?
    choices:
    - Most of it was created by lending
    - It sits in the vaults as cash, because that is what a deposit is
    - It is guaranteed by the board's reserves
    - It cannot exceed the money the board has issued
    answer: Most of it was created by lending
    why: >
      Sixty-two million of reserves stands behind 2.4 billion of deposits, which tells you at
      once that the deposits are not cash in a vault. There is not remotely enough cash for
      that. They exist because banks lent, and a loan credited to somebody's account is a
      deposit. That is what makes the money supply something the banking system created rather
      than something the board issued. It is why deposits can exceed issued currency by a wide
      margin. The board's reserves do not guarantee them either; sixty-two million against 2.4
      billion would be a guarantee of about two and a half per cent.
    rebuttals:
    - There are 62 million of reserves against 2.4 billion of deposits, so almost none of it is cash in a 
      vault.
    - Reserves of 62 million cannot guarantee 2.4 billion; they cover about two and a half per cent of it.
    - Deposits routinely exceed issued currency, because lending creates them.

  # ----- day 3. The rate that prices are changing at.
- title: The same wage buys less
  objective: Turn two index numbers into an inflation rate, and a wage into what it buys.
  briefing: The board keeps quoting the index and calling it inflation.
  stake: >-
    Wednesday. The board has called an index level “inflation,” while tram drivers say their doubled wage buys less
    than it used to. Today you separate levels from rates and nominal money from what that money can actually buy.
  takeaway: An index is a level; inflation is what the level did between two dates.
  segue: >-
    The newspaper printed the tram drivers' raise as nineteen per cent. It is really six.
    That correction goes out tonight. But every number in it still rests on an index nobody
    has signed yet.
  stops:
  - group: PRICES
    task: Turn two index numbers into a rate
    title: From 248 to 275
    reason: >-
      Emil Radic needs the index turned into an actual rate before the board's draft calls a
      level of 275 "inflation" in print.
    place: Price Room
    relationship: >-
      Inflation from two index values: inflation = (index₂ − index₁) ÷ index₁ × 100.
    concept: 'Inflation as a rate, and the difference between a level and a rate'
    takesAsRead:
    - 'A price index, and the basket it is an index of'
    scene: >
      The index was 248 last month and 275 this month. The board's draft says inflation is
      275 per cent.
    guide: >-
      A rate is a change divided by where it started. Take the difference between the two index
      values, divide by the earlier one and express it as a percentage. Then compare that with
      what the draft says, because the two numbers differ by a factor of twenty-five.
    background:
    - >-
      Why the confusion is so common. The index is a percentage-looking number and the rate is
      a percentage, so both read as per cent and only one of them is. An index of 275 says the
      price level is 2.75 times the base year; it says nothing about this month.
    - >-
      Why the direction of the error matters. Quoting a level as a rate always overstates
      inflation, and an overstated inflation figure raises exactly the expectations the board is
      trying to hold down. The error is not neutral.
    assumes:
    - both index values are on the same base year
    takeaway: A rate is a change over where it started, and an index is not a change at all.
    format: BALLPARK
    question: Estimate the month's inflation rate.
    estimate:
      prompt: The index was 248 last month and 275 this month. The draft statement says 275 per cent.
      question: Estimate the month's inflation rate.
      labels:
      - 275  (this month's index)
      - 248  (last month's index)
      - 100  (to make it a percentage)
      - 27  (the difference in index points)
      values: [275, 248, 100, 27]
      slots: 3
      template: '({0} − {1}) ÷ {1} × {2}'
      formula: (a-b)/b*c
      correct: [0, 1, 2]
      target: 10.9
      tolerance: 0.8
      units: '% a month'
      solution: (275 − 248) ÷ 248 × 100 = 10.9 % for the month.
      explanation: About 10.9 per cent for this month. If that same monthly pace somehow persisted for twelve 
        months it would compound to roughly 246 per cent, but that is a scenario, not a measured annual 
        inflation rate.
    answerText: About 10.9 per cent for the month, where the draft said 275.
    why: >-
      The change is 27 index points on a base of 248, so the measured inflation rate for this month is 10.9 per
      cent. The draft’s 275 is an index level, not a rate. It would also be misleading to publish one bad month
      as though a full year had already happened: 10.9 per cent every month for twelve months would compound to
      roughly 246 per cent, but that is a conditional annualized pace, not an observed annual rate. The file therefore
      records 10.9 per cent for the month and keeps the period attached to the number.
    rebuttals:
    - The index level is 2.75 times the base year and says nothing about this month.
    - The difference in index points is a change without a base, so it cannot be a rate.
  - group: COUNTER
    task: Say what the wage actually buys
    title: The same wage, deflated
    reason: >-
      Ngozi Okonjo needs a straight answer for the tram drivers waiting at her counter: is
      their wage claim fair, or already ahead of prices?
    place: Counter Room
    relationship: >-
      Deflating a nominal figure: real = nominal ÷ (index ÷ 100).
    concept: 'Nominal against real: taking the price change out of a figure'
    takesAsRead:
    - 'Inflation as a rate, and the difference between a level and a rate'
    scene: >
      The tram drivers earned 890 marks a month in the base year and 2,180 now. The index is
      275. Their claim asks for 2,600.
    guide: >-
      A wage in the money of the day cannot be compared with one from another year until the
      price change is taken out. Divide the current wage by the index over a hundred, and set the
      answer against the base-year figure. Then say what the claim is actually asking for.
    background:
    - >-
      What deflating does. Dividing by the price level converts money-of-the-day into money of
      the base year, so two figures can be compared by what they would buy. It is the same
      operation whether the figure is a wage, an output total or a tax take.
    - >-
      Why the claim reads differently once deflated. In base-year terms the drivers are on 793
      marks against 890 before, so they have lost about eleven per cent. The claim for 2,600 is
      945 in real terms — six per cent above where they started rather than a 19 per cent rise.
    assumes:
    - the index applies to what the drivers actually buy
    takeaway: Two wages from different years compare only after the price change is divided out.
    format: BALLPARK
    question: Estimate the drivers' current wage in base-year terms.
    estimate:
      prompt: 2,180 marks a month now, with the index at 275. They earned 890 in the base year.
      question: Estimate the drivers' current wage in base-year terms.
      labels:
      - 2180 marks  (the wage now)
      - 275  (the price index)
      - 100  (the base year's index)
      - 890 marks  (the base-year wage)
      values: [2180, 275, 100, 890]
      slots: 3
      template: '{0} ÷ ({1} ÷ {2})'
      formula: a/(b/c)
      correct: [0, 1, 2]
      target: 793
      tolerance: 40
      units: base-year marks
      solution: 2,180 ÷ 2.75 = 793 base-year marks, against 890 before.
      explanation: '793 against 890: the drivers are eleven per cent worse off, while their nominal wage has more
        than doubled.'
    answerText: About 793 base-year marks, against 890 before — eleven per cent worse off.
    why: >
      Dividing 2,180 by the price level of 2.75 gives 793 base-year marks, against 890 in the
      base year. The drivers are about eleven per cent worse off, and their nominal wage has
      more than doubled. That is the whole reason the distinction exists. It is also what
      makes the wage claim arguable rather than greedy. In real terms 2,600 is 945, six per
      cent above where they started. Multiplying by the index instead of dividing gives 5,995,
      which is the error that makes any historical comparison absurd in the flattering
      direction.
    rebuttals:
    - Multiplying by the price level inflates a figure that is already in today's money.
    - Comparing the two nominal wages directly compares two different currencies of the same name.
  - group: RATE
    task: Say which curve the board has moved
    title: Which side it came from
    reason: >-
      Josiah Mbeya has drafted a statement blaming excess demand, and the rate room needs to
      know whether the numbers actually back him up before it goes out.
    place: Rate Room
    concept: 'Demand-pull and cost-push inflation, and telling them apart'
    takesAsRead:
    - 'Short-run aggregate supply, and what a cost shock does to it'
    - 'Inflation as a rate, and the difference between a level and a rate'
    scene: >
      Prices are up eleven per cent for the month. Output is down four per cent and
      unemployment is up. The treasury liaison, Josiah Mbeya, has a draft blaming excess demand.
    guide: >-
      Two of these three numbers move together under one explanation and against each other under
      the other. Work out which pattern demand-driven inflation produces and which a cost shock
      produces, then say which the figures are consistent with.
    background:
    - >-
      What demand-pull looks like in the figures. Prices and output rise together, because more
      spending pulls both up, and unemployment falls. That is the pattern the draft assumes.
    - >-
      What a cost shock looks like. Prices rise while output falls, because the same production
      costs more, and unemployment rises with it. Halvern imports its flour and fuel and the
      exchange rate has moved, which is a textbook cost shock arriving by wire.
    assumes:
    - the output and price figures are for the same month
    takeaway: Prices and output moving together is demand; moving apart is cost.
    format: CHOICE
    question: Which explanation fits prices up, output down and unemployment up?
    choices:
    - A cost shock, arriving through import prices
    - Excess demand, as the draft says
    - A rise in the economy's capacity
    - A fall in the money supply
    answer: A cost shock, arriving through import prices
    why: >
      Demand-driven inflation raises prices and output together and lowers unemployment,
      because more spending pulls on both. Here output is falling and unemployment rising
      while prices rise. That is the opposite pattern, and the signature of costs. The same
      production is more expensive, so less of it happens at a higher price. Halvern imports
      flour and fuel and the exchange rate has moved, so the mechanism is on the wires rather
      than in the shops. A rise in capacity would lower prices, and a fall in the money supply
      would lower them too. Both are the wrong direction on the one number nobody disputes.
    rebuttals:
    - Excess demand raises output as well as prices, and output has fallen.
    - More capacity puts downward pressure on prices rather than upward.
    - A shrinking money supply lowers the price level, which is the opposite of what is happening.

  # ----- day 4. The basket, and what it is a basket of.
- title: The basket prices a vanished city
  objective: Fix the basket before the index built on it is certified.
  briefing: The chief statistician still won't sign, and he's right about why.
  stake: >-
    Thursday. Radic refuses to certify a basket that still gives heavy weight to coal and none to imported flour.
    The city changed; the index did not. Today you decide how to preserve a usable time series without pretending
    an old spending pattern is still current.
  takeaway: A basket has to be fixed to be comparable and revised to be about anybody.
  segue: >-
    The market stall's own prices went into the new weights, and the index is finally signed.
    It goes out tonight with the list printed right beside it. But the vault still can't say
    which count of the notes is real. The two methods are thirteen thousand notes apart.
  stops:
  - group: PRICES
    task: Decide what the basket should price
    title: Coal, and imported flour
    reason: >-
      Emil Radic won't certify the index until the basket's weights match how the city
      actually spends today, not eleven years ago.
    place: Price Room
    concept: 'A price index, and the basket it is an index of'
    takesAsRead:
    - 'Gross domestic product, and the four things it adds up'
    scene: >
      The current basket gives coal a fifth of its weight and imported flour nothing. The market trader Novotny's stall and the counter queue both say the opposite is now true.
    guide: >-
      A basket is a set of weights, and the weights are supposed to be what households actually
      spend on. Work out what the present weights get wrong, and pick the change that fixes the
      index rather than the change that flatters it.
    background:
    - >-
      What a revision costs. A basket changed between two months makes those two months
      incomparable, so a revision needs both baskets priced in an overlap month. That is real
      work and it is the reason revisions are rare and overdue.
    - >-
      What refusing to revise costs. An index whose weights are wrong reports the price of a
      household that does not exist. Coal at a fifth of spending understates a city that now
      buys electricity and imported flour, and it does so in whichever direction coal happens to
      move.
    assumes:
    - the stall prices and the queue are representative of household spending
    takeaway: The weights are the claim an index makes about how people live.
    format: TRIAGE
    question: What should be done about the basket before Friday?
    choices:
    - Reweight it and price both baskets this month
    - Keep it, so the series stays comparable
    - Drop coal and publish the rest
    - Use Novotny's stall prices as the basket
    answer: Reweight it and price both baskets this month
    why: >
      Both objections are real: a basket has to be fixed for two months to be comparable, and
      this one has weights from a city that has changed. Pricing both baskets in the same
      month settles it. The overlap is what links the old series to the new one. It costs one
      month of double work rather than the whole series. Keeping it preserves comparability
      with a figure nobody should be comparing. Dropping coal without reweighting leaves the
      remaining weights summing to four fifths, so every number afterwards is wrong by a
      quarter. And one stall is one household's basket, which is the error the index exists to
      avoid.
    rebuttals:
    - Comparability with a wrong basket preserves the error rather than the series.
    - Removing a fifth of the weight without reweighting inflates every remaining item by a quarter.
    - A single stall is one household's spending, which is what an index is built to average over.
  - group: TRADE
    task: Work out what the trade position actually is
    title: The account and its mirror
    reason: >-
      Levon Sarkis has this month's wires in front of him, and the board needs the real
      trade position before Friday's rate gets argued from half a number.
    place: Wire Room
    relationship: >-
      The current account: current account = X − M + net income + transfers.
    concept: 'The balance of payments: the current account and its mirror'
    takesAsRead:
    - 'Gross domestic product, and the four things it adds up'
    scene: >
      Levon Sarkis, the trade and reserves officer, has the month's wires: exports 64 million,
      imports 121, net income from abroad minus 8, and remittances in of 19.
    guide: >-
      Add the four flows with their signs. Two of them are the trade balance and two are the parts
      people forget, and one of those is large enough here to change the conclusion. Then say what
      a deficit on this account has to be financed by, because that is what makes it a constraint
      rather than a statistic.
    background:
    - >-
      What remittances do to a small economy. Halvern has people working abroad and sending
      money home, and 19 million a month is a third of the trade gap. An analysis that looks
      only at exports and imports understates the country's position by exactly that.
    - >-
      Why the account is a constraint. A deficit means the country is buying more from
      abroad than it is selling. The difference has to be paid for: by borrowing, by
      selling assets, or by running down reserves. On the fifteenth it will be reserves.
    assumes:
    - the four figures are all for the same month
    takeaway: A current account deficit has to be financed by borrowing or by reserves.
    format: BALLPARK
    question: Estimate the month's current account balance.
    estimate:
      prompt: Exports 64, imports 121, net income from abroad −8, remittances in 19 — all in millions.
      question: Estimate the month's current account balance.
      labels:
      - 64  (exports)
      - 121  (imports)
      - 8  (net income paid abroad)
      - 19  (remittances received)
      - 57  (exports less imports on its own)
      values: [64, 121, 8, 19, 57]
      slots: 4
      template: '{0} − {1} − {2} + {3}'
      formula: a-b-c+d
      correct: [0, 1, 2, 3]
      target: -46
      tolerance: 6
      units: million marks
      solution: 64 − 121 − 8 + 19 = −46 million marks.
      explanation: A deficit of 46 million, not the 57 the trade balance alone suggests — the remittances 
        close a third of the gap.
    answerText: A deficit of about 46 million marks, where the trade balance alone says 57.
    why: >
      Exports less imports is a gap of 57 million. The two terms people leave out change it
      substantially. Eight million paid abroad in income makes it worse, and nineteen million
      of remittances makes it better, for a deficit of 46. That is a third of the gap closed
      by money Halvern's own people send home, and an analysis that stops at trade misses it
      entirely. The reason the number matters on Friday is what a deficit has to be financed
      by. There is no borrowing available, so it is reserves, and reserves divided by 46
      million a month is a number of months rather than an opinion.
    rebuttals:
    - Exports less imports is the trade balance, which is only two of the four flows.

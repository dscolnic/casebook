      - 12.5  (the multiplier at eight per cent)
      - 0.02  (the reserve ratio)
      values: [12, 50, 12.5, 0.02]
      slots: 2
      template: '{0} × {1}'
      formula: a*b
      correct: [0, 1]
      target: 600
      tolerance: 40
      units: million marks
      solution: 12 × 50 = 600 million marks of deposits.
      explanation: Six hundred million from a twelve million injection — and 150 million if the requirement is
        raised first.
    answerText: Up to 600 million marks in the simplified 2 per cent model, versus 150 million at 8 per cent; 
      neither number is a forecast of actual lending.
    why: >-
      With the game’s simplified 2 per cent reserve model, twelve million times fifty gives a maximum deposit expansion
      of 600 million. At 8 per cent the corresponding ceiling is 150 million. The 450 million gap shows why timing
      matters in this fictional board’s framework, but neither total is guaranteed. Banks must find willing borrowers,
      may hold excess reserves, and households may hold currency rather than redeposit it. The board is using the
      calculation to bound a risk, not to predict an automatic chain.
    rebuttals:
    - The multiplier at eight per cent answers what the injection becomes after the requirement is raised.
    - The reserve ratio is what the multiplier is built from rather than something to multiply by.
  - group: COUNTER
    task: Say what the counter tells the board about Friday
    title: What the queue has already decided
    reason: >-
      Ngozi Okonjo's queue is still holding at forty, and what people do there this
      afternoon is the closest thing the board has to a vote on today's rate.
    place: Counter Room
    concept: 'Expectations, credibility, and why a promise is a policy instrument'
    takesAsRead:
    - 'The short-run trade-off between inflation and unemployment'
    scene: >
      Okonjo's queue is holding at forty. Of the last hundred people, eighty-one took the
      maximum they were allowed and nineteen took less than they could have.
    guide: >-
      Look at what people did rather than at what they said. Taking the maximum allowed is a bet
      on one thing and taking less is a bet on the other. Work out which way the queue has voted
      and what that means for a rate announced this afternoon.
    background:
    - >-
      What taking the maximum means. It is a bet that the old currency is worth less later than
      now, which is a bet on the rate moving against it. Eighty-one in a hundred is not a
      rumour; it is a distribution.
    - >-
      Why it constrains the board rather than informing it. A rate set above what people expect
      will be believed and one set below it will be tested, and the testing is done with
      reserves. Expectations are cheap to use and expensive to contradict.
    assumes:
    - the hundred people are the most recent at the counter
    takeaway: What people do at a counter is a distribution rather than a rumour.
    format: CHOICE
    question: What has the queue already decided?
    choices:
    - That the old currency will be worth less later
    - That the counter will close early
    - That the new notes will be in short supply
    - That the board will not set a rate at all
    answer: That the old currency will be worth less later
    why: >
      Eighty-one people in a hundred took the maximum they were allowed. That is a bet that
      waiting costs them, and that the old currency buys less later than now. That is a
      statement about the expected rate rather than about the counter, and eighty-one in a
      hundred makes it a distribution rather than a rumour. It matters this afternoon because
      a rate set above what people expect is believed and one set below it is tested with
      reserves. Closing hours would change when people come rather than how much they take. A
      shortage of new notes would show as people taking less. And a board expected to set no
      rate would produce hoarding of goods rather than a queue for currency.
    rebuttals:
    - Closing hours change when people arrive rather than how much each of them takes.
    - Expecting a shortage of new notes would make people take less, not more.
    - If no rate were expected at all, people would hold goods rather than queue for currency.

  # ----- day 6. Aggregate demand, and the multiplier that is not the money one.
- title: The wage payment does not stop at wages
  objective: Work the spending multiplier and say which curve the treasury's plan moves.
  briefing: The treasury wants to pay wages early, and every option moves demand.
  stake: >-
    Saturday. The treasury wants to pay wages early, but the first payment is not the whole demand effect. Today
    you measure how much households spend, how repeated rounds amplify it, and how imports make the domestic effect
    smaller than the closed-economy headline.
  takeaway: A pound spent becomes income and is partly spent again, so one round is not the total.
  segue: >-
    The treasury got its vote. The new paper says 336 million, not the 84 million it started
    with. Everyone gets paid. Prices get worse. Now the board still wants its rate fixed by
    Sunday. Only one ledger says what that would actually cost.
  stops:
  - group: RATE
    task: Work out how much of an extra mark gets spent
    title: Out of every extra mark
    reason: >-
      Della Prentice's household survey is what the treasury's wage plan gets measured
      against, and the board needs the real spending fraction before it multiplies the
      payment by guesswork.
    place: Rate Room
    relationship: >-
      The marginal propensity to consume, MPC = ΔC ÷ Δ(disposable income).
    concept: 'Aggregate demand, and the four components that move it'
    takesAsRead:
    - 'Gross domestic product, and the four things it adds up'
    scene: >
      Prentice's household survey: when disposable income rose 40 marks a month last year,
      measured consumption rose 30. Mbeya's plan pays out 84 million.
    guide: >-
      The fraction of an extra mark that gets spent rather than saved is what makes a
      multiplier large or small. Work it out from the survey. Note that the rest of it is not
      lost but saved, which matters for the loanable funds argument later in the fortnight.
    background:
    - >-
      Why it is measured rather than assumed. A propensity to consume is a behaviour and it
      changes with who is being paid and what they expect. During a changeover households may
      spend faster, save more for precaution, or shift what they buy; the direction is empirical.
    - >-
      Why the survey is the weak point. Last year's behaviour at a stable price level is not
      this fortnight's. The figure is the best available estimate, and the board should publish
      the period and uncertainty instead of pretending it is a constant.
    assumes:
    - the survey's households are representative of those being paid
    takeaway: The propensity to consume is a measured behaviour rather than a constant.
    format: BALLPARK
    question: Estimate the marginal propensity to consume.
    estimate:
      prompt: Disposable income rose 40 marks a month and consumption rose 30. Radic wants the propensity.
      question: Estimate the marginal propensity to consume.
      labels:
      - 30 marks  (the rise in consumption)
      - 40 marks  (the rise in disposable income)
      - 10 marks  (the part that was saved)
      - 84  (the treasury's payment, in millions)
      values: [30, 40, 10, 84]
      slots: 2
      template: '{0} ÷ {1}'
      formula: a/b
      correct: [0, 1]
      target: 0.75
      tolerance: 0.06
      units: of each extra mark
      solution: MPC = 30 ÷ 40 = 0.75.
      explanation: Three quarters of an extra mark is spent, which makes the multiplier four rather than one.
    answerText: 0.75 — three quarters of an extra mark is spent and a quarter saved.
    why: >-
      Thirty over forty is 0.75, so in last year’s survey three quarters of an extra mark of disposable income was
      spent and one quarter saved. That measured behavior is useful for a first estimate, but it is not a constant
      and not a lower bound. During a currency panic households could spend more quickly, save more precautionarily,
      or shift spending toward imports. The board should therefore write 0.75 as the survey estimate it actually
      has, with the period beside it.
    rebuttals:
    - The saved portion over the income rise is the propensity to save, which is one minus this.
    - The treasury's payment is what the propensity will be applied to rather than an input to it.
  - group: PRICES
    task: Work out the total effect on demand
    title: One over one minus it
    reason: >-
      Josiah Mbeya's paper treats the wage payment as its own total effect on demand, and the
      price room needs the real multiplier before that number reaches the board.
    place: Price Room
    relationship: >-
      The spending multiplier, k = 1 ÷ (1 − MPC).
    concept: 'The spending multiplier, and why one round is not the total'
    takesAsRead:
    - 'Aggregate demand, and the four components that move it'
    scene: >
      The propensity to consume is 0.75. The treasury's payment is 84 million marks. Mbeya's
      paper describes the effect on demand as 84 million.
    guide: >-
      The payment is spent, becomes somebody's income, and three quarters of it is spent again.
      Work out the total using the multiplier, then compare it with the paper's figure. The
      difference is not a correction; it is most of the effect.
    background:
    - >-
      Where the series comes from. Eighty-four million, then three quarters of that, then three
      quarters of the remainder, and so on. The sum of the series is the payment divided by one
      minus the propensity, which is why the formula is a reciprocal.
    - >-
      Why the total is a ceiling. Each round takes time, and the fortnight is fourteen days. The
      multiplier is the eventual effect, and how much of it lands before the fifteenth is a
      separate question the board also has to ask.
    assumes:
    - the propensity holds across the rounds of spending
    takeaway: The simple spending multiplier is a benchmark; imports, taxes, saving behavior and time reduce 
      what lands domestically.
    format: BALLPARK
    question: Estimate the total effect on demand.
    estimate:
      prompt: 84 million paid out, with a propensity to consume of 0.75. Mbeya's paper says the effect is 84 
        million.
      question: Estimate the total effect on demand.
      labels:
      - 84  (the payment, in millions)
      - 0.75  (the propensity to consume)
      - 1  (the numerator of the multiplier)
      - 0.25  (the propensity to save)
      values: [84, 0.75, 1, 0.25]
      slots: 3
      template: '{0} × {2} ÷ (1 − {1})'
      formula: a*c/(1-b)
      correct: [0, 1, 2]
      target: 336
      tolerance: 25
      units: million marks
      solution: k = 1 ÷ (1 − 0.75) = 4, so the effect is 84 × 4 = 336 million marks.
      explanation: Three hundred and thirty-six million, four times what the paper says — and the paper's 
        figure is only the first round.
    answerText: 336 million marks is the closed-economy, no-tax upper-bound calculation from MPC = 0.75; the 
      domestic effect will be smaller once leakages and timing are included.
    why: >-
      With only saving as a leakage, MPC = 0.75 gives 1 ÷ (1 − 0.75) = 4, and 84 million × 4 = 336 million. That
      is the textbook benchmark, not a guaranteed fourteen-day increase in Halvern’s demand. Imports and taxes leak
      spending out of the domestic rounds, behavior can change during the panic, and later rounds take time. Mbeya’s
      84 million counts only the first payment; 336 million is the closed-economy upper bound that tells the board
      how large the feedback could be.
    rebuttals:
    - Multiplying by the propensity gives the second round of spending rather than the total.
    - Dividing by the propensity to save without the payment leaves a multiplier rather than an amount.
  - group: TRADE
    task: Say what the payment does to the trade position
    title: Where some of it goes
    reason: >-
      Levon Sarkis wants to know how much of the treasury's payment leaks out as imports
      before the wire room signs off on the demand estimate.
    place: Wire Room
    concept: 'The balance of payments: the current account and its mirror'
    takesAsRead:
    - 'Gross domestic product, and the four things it adds up'
    scene: >
      Halvern imports its flour, its fuel and most of its manufactures. The payment is 84
      million and the multiplier makes the demand effect 336.
    guide: >-
      Ask where extra spending in Halvern actually lands. Some of it buys local services and some
      of it buys imported goods, and the imported part leaves the country rather than circulating
      in it. Say what that does to the multiplier and to the current account.
    background:
    - >-
      Why imports leak out of the multiplier. A mark spent on imported flour becomes income
      abroad rather than in Halvern, so it does not come back for another round. The larger the
      import share, the smaller the multiplier actually is.
    - >-
      What it does to the account. The same spending widens the current account deficit, which
      is financed by reserves — the same reserves that would be defending a rate. So the fiscal
      plan and the exchange rate policy are competing for one pot.
    assumes:
    - the import share of extra spending is similar to the average
    takeaway: Spending on imports leaves the domestic circuit and lands in the current account.
    format: CHOICE
    question: What does the import share do to the treasury's plan?
    choices:
    - Shrinks the multiplier and widens the deficit
    - Shrinks the multiplier and narrows the deficit
    - Leaves the multiplier alone and widens the deficit
    - Leaves both unchanged, since imports are already in the figures
    answer: Shrinks the multiplier and widens the deficit
    why: >
      A mark spent on imported flour becomes income abroad. So it does not return for another
      round of domestic spending. The multiplier is smaller than one over one minus the
      propensity to consume suggests. The same mark also appears as an import in the current
      account, which widens the deficit. Both effects run the same way and both matter on the
      fifteenth, because the deficit is financed by the reserves that would otherwise be
      defending a rate. The plan therefore does less for demand and more to the account than
      the paper says, which is a stronger objection than either half on its own.
    rebuttals:
    - Extra imports widen the deficit rather than narrowing it; the spending goes out.
    - The leak is what shrinks the multiplier, so it cannot be unchanged.
    - The existing figures contain last month's imports, not the ones this payment will cause.

  # ----- day 7. The rate, and what the reserves can hold.
- title: The chair's rate fails the reserve clock
  objective: Price the currency and say how long a defended rate lasts.
  briefing: The board wants a fixed rate, and the reserve book says what it would cost.
  stake: >-
    Sunday. Verhoeven, the board chair, wants 3.60 old marks to one new because the queue will like it. Sarkis says the reserves would
    be gone in thirty-six days, while the promise has to last ninety-six. Today you eliminate the rates the board
    cannot keep.
  takeaway: Defending a rate spends reserves daily, so the stock is a clock.
  segue: >-
    At 4.15 the reserves last 134 days. At the 3.60 savers wanted, they'd last only
    thirty-six. The announcement finally has a reason printed beside the number. Anyone can
    check it. But upstairs, a loan book just landed on the desk. Every rate in it was set
    before any of this started.
  stops:
  - group: TRADE
    task: Work out how long the reserves last
    title: A stock over an outflow
    reason: >-
      Levon Sarkis has the reserve book, and the board can't choose a rate until someone
      turns his stock-and-outflow numbers into an actual number of days.
    place: Wire Room
    relationship: >-
      The cost of a peg: reserves needed = gap × days to defend.
    concept: 'A fixed rate, and what it costs to defend one'
    takesAsRead:
    - 'An exchange rate as a price, and what moves it'
    - 'Monetary policy: the three tools and what each one moves'
    scene: >
      Sarkis has 187 million marks of foreign reserves. At the rate Ada Verhoeven, the board
      chair, wants, the net outflow is running at 5.2 million a day.
    guide: >-
      Divide the stock by the daily outflow to get a number of days, then count how many days the
      rate has to hold for. A peg that lasts less than the period it is promised for is worse than
      no peg, because the abandonment is a policy event of its own.
    background:
    - >-
      Why defending costs reserves daily. Holding a rate the market disagrees with means buying
      your own currency with foreign reserves every day, at whatever volume is offered. The
      outflow is not a fee; it is the price of the promise.
    - >-
      What abandoning one costs. Everybody who held the currency on the strength of the promise
      loses, and the next promise is not believed. Douglas Farr, the press officer, argues
      that credibility is spent once, so a rate should only be announced if it can be held.
    assumes:
    - the daily outflow holds at the rate being proposed
    takeaway: A reserve stock divided by a daily outflow is how long a promise can be kept.
    format: BALLPARK
    question: Estimate how many days the reserves would hold the rate.
    estimate:
      prompt: 187 million of reserves, outflow 5.2 million a day at the proposed rate. The rate has to hold to
        the year end, 96 days.
      question: Estimate how many days the reserves would hold the rate.
      labels:
      - 187  (reserves, in millions)
      - 5.2  (net outflow a day, in millions)
      - 96  (days the rate has to hold)
      - 46  (the deficit last month, in millions)
      values: [187, 5.2, 96, 46]
      slots: 2
      template: '{0} ÷ {1}'
      formula: a/b
      correct: [0, 1]
      target: 36
      tolerance: 3
      units: days
      solution: 187 ÷ 5.2 = 36 days, against the 96 the rate has to hold for.
      explanation: Thirty-six days against ninety-six needed. The rate Verhoeven wants cannot be held, at this
        outflow.
    answerText: About 36 days, against the 96 the rate has to hold — the peg fails in November.
    why: >
      One hundred and eighty-seven million over 5.2 million a day is thirty-six days, and the
      rate has to hold for ninety-six. So the peg Verhoeven wants is not a policy. It is a
      policy with a date on it, and the date is inside the period it was announced for. That
      is the argument against announcing it. The abandonment is itself an event. Everybody who
      took the currency on the strength of the promise loses, and the next promise is
      discounted. Using the monthly deficit as the outflow gives four years, and it is the
      wrong quantity. The deficit is financed partly by other flows. The defence outflow is
      what the peg specifically costs.
    rebuttals:
    - The monthly current account deficit is a different flow from what defending the rate costs each day.
    - Dividing the days needed by the outflow gives days per million, which is not a period.
  - group: RATE
    task: Find which candidate survives the reserve test
    title: Only one candidate clears ninety-six days
    reason: >-
      Ada Verhoeven wants 3.60, but the board has not signed anything. Your job is to remove any candidate that
      cannot survive the full ninety-six-day defence period before politics enters the room.
    place: Rate Room
    concept: 'An exchange rate as a price, and what moves it'
    takesAsRead:
    - 'The balance of payments: the current account and its mirror'
    - 'Demand, supply and the price that clears a market'
    scene: >
      Three candidate rates: 3.60 old marks to the new, 4.15, and 4.80. The outflow at each is
      5.2, 1.4 and nil million a day. The reserves are 187 million.
    guide: >-
      Calculate reserve cover at each candidate and compare it with ninety-six days. This stop is a feasibility
      screen, not the final policy choice: surviving the reserve test is necessary, not sufficient.
    background:
    - >-
      Why a weaker rate costs less to defend. Setting the new currency cheaper against foreign
      money means the market is not pushing against the peg, so nothing has to be bought to hold
      it. The cost moves from the reserves to the households buying imported flour.
    - >-
      Who each rate falls on. At 3.60 savers keep more of what they had and importers pay more
      of the difference through a devaluation later. At 4.80 importers pay immediately and
      anybody holding old marks takes the loss now.
    assumes:
    - the outflow figures hold at each candidate rate
    takeaway: Reserve cover can eliminate an impossible promise before the board argues about who bears the 
      cost.
    format: TRIAGE
    question: Which candidate is the strongest rate that still survives the reserve test?
    choices:
    - 4.15, which holds for 134 days
    - 3.60, which is closest to what savers expect
    - 4.80, which costs nothing to defend
    - No fixed rate at all, and let it float
    answer: 4.15, which holds for 134 days
    why: >-
      At 3.60, 187 million divided by 5.2 million a day gives only about 36 days, far short of the required 96.
      At 4.15, the 1.4 million daily defence outflow gives about 134 days, so it clears the test with a margin.
      At 4.80 no defence outflow is assumed, so it also survives—but it is a weaker old-mark conversion than the
      board needs if 4.15 can be defended. The calculation therefore does not “set the rate” today. It removes 3.60
      and leaves 4.15 as the strongest candidate that meets the reserve condition.
    rebuttals:
    - 3.60 is what savers expect and the reserves hold it for 36 of the 96 days needed.
    - 4.80 costs the board nothing and puts the whole adjustment on households at once.
    - A float leaves wages and contracts with nothing to be written against, which is the problem the board 
      exists to solve.
  - group: COUNTER
    task: Say what evidence must travel with any final rate
    title: A number is not yet a promise
    reason: >-
      Farr is drafting the page that could be released on the fifteenth. The candidate rate is useless if the public
      cannot see the reserve arithmetic that makes it believable.
    place: Counter Room
    concept: 'Expectations, credibility, and why a promise is a policy instrument'
    takesAsRead:
    - 'The short-run trade-off between inflation and unemployment'
    scene: >-
      Farr has a draft page with “4.15” in large type and nothing underneath it. Okonjo has forty people who will
      decide whether to hold the new currency or spend it as soon as the counter opens.
    guide: >-
      A rate is a number and an announcement is an instrument. Decide what the statement has
      to carry beyond the figure. The people reading it are choosing whether to hold the new
      currency or spend it at once.
    background:
    - >-
      Why the reason travels further than the number. A rate announced with the reserve position
      behind it can be checked, and a rate announced alone can only be believed or not. What
      people are deciding is whether the rate will hold, which is a question about the reserves
      rather than about the figure.
    - >-
      What must not be in it. Anything the board might have to correct. A single revision costs
      more credibility than any sentence buys, which is Farr's one rule and the reason the
      statement is short.
    assumes:
    - the statement is published before the counter opens
    takeaway: A rate announced with its reason can be checked; one announced alone can only be believed.
    format: TRIAGE
    question: What evidence has to be printed beside any final rate?
    choices:
    - The reserve position the rate is held with
    - The board's forecast for prices next year
    - An assurance that the rate will never change
    - The names of the board members who voted for it
    answer: The reserve position the rate is held with
    why: >-
      The public cannot check the board’s confidence, but it can check the reserve position and the defence arithmetic.
      Printing those makes the promise falsifiable rather than merely reassuring. A price forecast is a different
      claim and may be revised. “Never change” is a promise the board cannot guarantee. Vote names improve governance
      transparency but do not show whether the currency can be defended.
    rebuttals:
    - A price forecast is the one figure most likely to need correcting, and a correction is expensive.
    - A permanent promise cannot be kept, and the market will test it rather than believe it.
    - Who voted is about the board rather than about whether the rate holds.

  # ----- day 8. Real and nominal, and who the difference falls on.
- title: The loan book changes sides
  objective: Work the real interest rate and say who gains and loses from it.
  briefing: Eleven banks have loan books written at rates set before the changeover.
  stake: >-
    Monday. A loan book written before the price surge is being repaid in money with sharply less purchasing power.
    Today you put the nominal and inflation rates on the same clock and identify who gains and who loses when inflation
    was not priced into the contract.
  takeaway: The real rate is the nominal rate less inflation, and the difference has an owner.
  segue: >-
    Somewhere in the city, a family is paying off a flat in marks that shrink every week. One
    bank is eating that loss. Nobody chose it, and nobody can undo it either. So for eight days
    the board has argued about money it has never once added up.
  stops:
  - group: BANKS
    task: Work out what the lender is actually earning
    title: Nine a year, against eleven in one month
    reason: >-
      Ruth Haldane's loan book is written at nine per cent a year, and Sunita Iyer needs the
      real return on it before she can say which banks survive the changeover.
    place: Ledger Hall
    relationship: >-
      Exact real return over one period: (1 + nominal return) ÷ (1 + inflation) − 1. The subtraction rule is an
      approximation for small rates.
    concept: 'Nominal and real interest rates, and who the difference falls on'
    takesAsRead:
    - 'The loanable funds market, and where saving meets investment'
    - 'Nominal against real: taking the price change out of a figure'
    scene: >-
      Haldane’s loan book earns 9 per cent a year. That is about 0.72 per cent for one month. Prices rose 10.9 per
      cent over that same month.
    guide: >-
      Put both rates on the same one-month clock. Because inflation is very large, do not use the usual real ≈ nominal
      − inflation shortcut as though it were exact. Compare the lender’s purchasing power before and after the month.
    background:
    - Why the period has to match. A 9 per cent annual nominal rate is about 0.72 per cent for one month. The 
      price level rose 10.9 per cent in that same month, so the two returns can now be compared on one clock.
    - Why the usual subtraction is only an approximation. For small rates, nominal minus inflation is close 
      enough. Here the exact gross real return is the nominal payoff divided by the price increase. That keeps
      a one-period real loss above the impossible −100 per cent floor.
    assumes:
    - the 9 per cent contract rate is an effective annual rate for this calculation
    takeaway: Unexpected inflation lowers the real return on a fixed nominal loan; at high inflation, use the 
      exact Fisher relation rather than the subtraction shortcut.
    format: BALLPARK
    question: Estimate the lender’s real return over this month.
    estimate:
      prompt: A 9 per cent annual loan earns about 0.72 per cent this month; prices rose 10.9 per cent this 
        month.
      question: Estimate the lender’s real return over this month.
      labels:
      - 100.72  (nominal value of 100 after one month)
      - 110.9  (price level after 10.9 per cent inflation)
      - 9  (annual nominal rate, per cent)
      - 10.9  (monthly inflation rate, per cent)
      values:
      - 100.72
      - 110.9
      - 9
      - 10.9
      slots: 2
      template: '{0} ÷ {1} × 100 − 100'
      formula: a/b*100-100
      correct:
      - 0
      - 1
      target: -9.2
      tolerance: 1.0
      units: '% for the month'
      solution: 100.72 ÷ 110.9 × 100 − 100 ≈ −9.2 % for the month.
      explanation: About −9.2 per cent in purchasing power for the month. The familiar subtraction shortcut 
        would give about −10.2 per cent here; the exact Fisher calculation matters because inflation is so 
        large.
    answerText: 'About −9.2 per cent for the month: the lender receives slightly more marks, but those marks buy
      substantially less.'
    why: >-
      A 9 per cent effective annual return is about 0.72 per cent for one month, so 100 marks becomes about 100.72.
      The price level rises from 100 to 110.9. Dividing 100.72 by 110.9 gives about 0.908, or a real one-month return
      of roughly −9.2 per cent. Borrowers on fixed nominal contracts gain relative to lenders when the inflation
      was unexpected, but the transfer is about purchasing power—not money literally moving one-for-one from every
      lender to every borrower.
    rebuttals:
    - Subtracting a monthly rate from an annual one compares two different periods.
    - Adding inflation to the nominal rate describes what a lender would need to charge, not what it is 
      earning.
  - group: RATE
    task: Say what the treasury's borrowing has become
    title: The same debt, in different money
    reason: >-
      Josiah Mbeya wants to know whether the treasury's own borrowing just got cheaper, and
      the answer decides whether he recommends borrowing more.
    place: Rate Room
    concept: 'Fiscal policy: spending and taxation as levers'
    takesAsRead:
    - 'The spending multiplier, and why one round is not the total'
    scene: >
      The treasury owes 340 million marks at a fixed 7 per cent, borrowed before the
      changeover. Mbeya wants to know whether that is now cheap.
    guide: >-
      Ask what the debt is denominated in and what has happened to that money. Then say what
      follows for the treasury and for whoever holds the debt, and whether the answer is a reason
      to borrow more.
    background:
    - >-
      Why the debt has become cheap. It is fixed in old marks and old marks are worth far less
      than when it was borrowed, so the real burden has collapsed. The treasury gains exactly
      what the holders of the debt lose.
    - >-
      Why that is not a strategy. It works once and only because it was unexpected. The
      next lender prices in what just happened, so the government borrows at a nominal
      rate that contains the inflation. The trick is not available a second time.
    assumes:
    - the debt is denominated in old marks at a fixed rate
    takeaway: Unexpected inflation can reduce the real burden of fixed nominal debt; future lenders can demand
      compensation once the inflation is expected.
    format: CHOICE
    question: What has happened to the treasury's borrowing, and what follows?
    choices:
    - It has become cheap, and cannot be repeated
    - It has become cheap, so the treasury should borrow more
    - It is unchanged, since the rate was fixed
    - It has become expensive, since prices are rising
    answer: It has become cheap, and cannot be repeated
    why: >-
      The treasury debt is fixed in old marks, so an unexpected rise in the price level reduces its real burden
      and reduces the real value received by the bondholders. That does not create a repeatable free lunch. Once
      lenders expect high inflation they can demand higher nominal yields, shorten maturities or refuse the contract.
      The lesson is about the difference between nominal and real obligations, not a policy recommendation to “inflate
      away” debt.
    rebuttals:
    - 'Borrowing more is the trap: the next lender prices in the inflation that just happened.'
    - A fixed nominal rate is what lets the real cost fall when prices rise.
    - Rising prices make a debt fixed in that money cheaper, not more expensive.
  - group: PRICES
    task: Say what the index cannot tell the banks
    title: One index, many households
    reason: >-
      Sunita Iyer wants to deflate all eleven loan books by one index, and Emil Radic has to
      say what that index can and can't actually tell her.
    place: Price Room
    concept: 'Reading an economic statistic: what it counts, over what period, and revised how often'
    takesAsRead:
    - 'A price index, and the basket it is an index of'
    scene: >
      Iyer wants to deflate eleven loan books by the index. Radic points out that the index is
      one basket, and a bank lending to farmers is not lending to the same prices as a bank
      lending to importers.
    guide: >-
      The index is an average over one basket. Ask what that makes it good for and what it cannot
      settle, then choose the honest way to use it on eleven books that face different prices.
    background:
    - >-
      What a single index is good for. Comparing one period with another on a consistent
      basis. That is exactly what deflating a loan book needs. It is why the index is the
      right tool even though it is not the right basket for anybody in particular.
    - >-
      What it cannot settle. Whether a particular bank's borrowers face those prices. A farmer
      selling grain into a rising market and an importer buying flour in a falling currency are on
      opposite sides of the same index.
    assumes:
    - the index is the only price series available
    takeaway: One index is right for comparing periods and silent about which household.
    format: TRIAGE
    question: How should the index be used on the eleven loan books?
    choices:
    - Deflate them all with it, and state that it is one basket
    - Deflate only the books lending to households
    - Build a separate index for each bank
    - Use nominal figures, since the index does not fit any of them
    answer: Deflate them all with it, and state that it is one basket
    why: >
      The index is the right tool for the job it is being asked to do, which is comparing one
      period with another on a consistent basis. It is the wrong basket for any particular
      borrower. So the honest use is to apply it consistently and say what it is: one basket,
      an average, not a statement about farmers or importers specifically. Deflating only some
      books makes them incomparable with the others. Eleven separate indices is a year of work
      Radic does not have and would produce eleven series nobody can add up. And using nominal
      figures avoids the caveat by discarding the correction entirely, which is worse than an
      imperfect one.
    rebuttals:
    - Deflating only some books makes the eleven incomparable with each other.
    - Eleven bespoke indices is a year of work and produces series that cannot be aggregated.
    - Nominal figures avoid the caveat by discarding the price change altogether.

  # ----- day 9. The money supply, counted and capped.
- title: Eighty-two million counted twice
  objective: Reconcile the money supply and decide the requirement.
  briefing: The weighed returns, the ledgers and the deposits have to add up to one figure.
  stake: >-
    Tuesday. The first money-supply total is 82 million too high because banks counted deposits they hold with each
    other. Today you reconcile the count before the board uses that number to argue about inflation and reserve
    policy.
  takeaway: The money supply is cash in hands plus deposits, and neither counts twice.
  segue: >-
    The vault's gap wasn't an accounting error. The sample was wrong. The six ledgers were
    right. Some of the returned notes never reached the scales at all. So more old money is
    still loose in Halvern than any count the board has. And the new eight per cent
    requirement now caps a number. The board has been quoting it wrong for nine days.
  stops:
  - group: NOTES
    task: Count the money supply without counting anything twice
    title: In hands, and in ledgers
    reason: >-
      Bram Tulloch's weighed returns are one of three counts the board has to reconcile
      today, and the vault holding is the trap most likely to overstate the total.
    place: Note Room
    concept: 'What counts as money, and the three things it has to do'
    takesAsRead:
    - 'Demand, supply and the price that clears a market'
    scene: >
      Issued old currency: 1.42 billion marks. Returned and burnt: 214 million. Held in the
      vault, never issued: 96 million. Bank deposits: 2.4 billion.
    guide: >-
      Money is what people can spend: cash in hands plus what banks owe on demand. Read the
      panel and report the figure. Two of these numbers are not money in the public's hands at
      all, and one of them is easy to add by mistake.
    background:
    - >-
      Why the vault holding is not money. Currency printed and never issued is paper. It becomes
      money when it leaves the vault, and counting it beforehand overstates the supply by
      whatever is in stock.
    - >-
      Why the burnt notes come off. They were money and are not any more, so the cash in hands
      is what was issued less what has come back and been destroyed. Notes returned and not yet
      burnt are the awkward case and are counted as withdrawn once they are in the office.
    assumes:
    - deposits and currency figures are for the same date
    takeaway: Printed and unissued currency is paper; issued and unreturned currency is money.
    format: BALANCE
    question: Read what you need and report the money supply.
    balance:
      hint: >-
        Reading a ledger is free. Counting a line is the claim you are making about what people can
        actually spend.
      total: {amount: 3524, unit: million marks, label: Money supply on this date}
      streams:
      - {id: issued, label: Old currency issued, value: 1420, display: '1,420 million issued since the last reform'}
      - {id: burnt, label: Returned and burnt, value: -214, display: '214 million — money that has stopped being
          money'}
      - {id: deposits, label: Bank deposits repayable on demand, value: 2400, display: '2,400 million across the
          eleven banks'}
      - {id: interbank, label: Deposits the banks hold with each other, value: -82, display: '82 million — counted
          twice, once at each bank', hidden: true, note: 'on both balance sheets, and it is one deposit'}
      - {id: office, label: Returned and awaiting the furnace, value: 0, display: 'in the note room, already counted
          as withdrawn'}
      - {id: vault, label: Printed and never issued, value: 0, display: 'in the vault — paper, not money'}
      tolerance: 40
      commit: Report the money supply
    answerText: >-
      About 3,524 million marks: 1,420 issued less the 214 burnt, plus 2,400 of deposits, less the
      82 million the banks hold with each other and have both counted.
    why: >
      Money is what can be spent: cash in the public's hands plus deposits repayable on
      demand. That is 1,420 million issued, less the 214 million burnt, plus 2,400 million of
      deposits. The term that does not announce itself is interbank. Of the deposit total, 82
      million is banks holding accounts with each other. That appears on two balance sheets
      and is one deposit, so it comes off. Two more figures are traps in opposite directions.
      The vault stock has been printed and never issued, so it is paper and adding it
      overstates the supply. The notes in the note room are already counted as withdrawn, so
      subtracting them again double-counts.
  - group: BANKS
    task: Set the requirement, and say what it costs
    title: Two per cent, or eight
    reason: >-
      Sunita Iyer wants the requirement at eight per cent before Thursday, and Ruth
      Haldane's bank is the test of whether that is a step or a shock.
    place: Ledger Hall
    concept: 'The money multiplier, and what a reserve requirement caps'
    takesAsRead:
    - 'Fractional reserve banking: a deposit is somebody else’s loan'
    - 'The spending multiplier, and why one round is not the total'
    scene: >
      The requirement is two per cent. Iyer wants eight before Thursday. Haldane's bank holds
      2.7 per cent and three of the eleven hold less than four.
    guide: >-
      Work out what the change asks of the banks that are furthest from it, then decide the timing.
      Raising the requirement caps what the system can create and forces anybody below the new
      figure to find reserves — and the two things happen at once.
    background:
    - >-
      What eight per cent asks of Haldane. She holds 21 million against 780 million of deposits,
      and eight per cent of 780 is 62.4 million. That is 41 million she has to find, by selling
      assets or by calling in loans, and there is no market for either this fortnight.
    - >-
      Why in steps rather than at once. A requirement raised in stages gives banks time to
      accumulate reserves out of new deposits rather than by unwinding loans. It also caps the
      multiplier immediately, which is the part that matters before the new notes go out.
    assumes:
    - the eleven banks cannot raise capital externally this fortnight
    takeaway: In this scenario, the staged requirement reduces the model’s deposit-expansion ceiling while 
      giving weak banks time to meet the new rule.
    format: TRIAGE
    question: What should the board do about the requirement?
    choices:
    - Raise it in steps, starting before Thursday
    - Raise it to eight at once, before the new notes
    - Leave it at two until after the changeover
    - Raise it only for the banks below four per cent
    answer: Raise it in steps, starting before Thursday
    why: >-
      The board is using the reserve requirement as a fictional transition rule, and it has two effects that must
      be separated. In the game’s simplified multiplier model, a higher ratio lowers the maximum deposit expansion
      immediately. But an existing bank below the new ratio cannot conjure reserves instantly; it must raise reserves,
      shrink assets, or receive support. A staged rule reduces the modeled expansion ceiling while giving the three
      weak banks time to adjust. The simple 1/RR multiplier is a teaching model, not a claim that real-world bank
      lending is mechanically fixed by one ratio.
    rebuttals:
    - Eight at once forces three banks to find tens of millions in a fortnight with no market to sell into.
    - Waiting until after the changeover means unwinding loans already made, which contracts the money supply 
      at the worst moment.
    - A lower requirement for weaker banks rewards weakness and identifies those banks to the market.
  - group: TRADE
    task: Say what money growth does if velocity holds
    title: Money, output and prices
    reason: >-
      Levon Sarkis wants to know what a 17 per cent jump in the money supply does to prices
      while output is still falling, before the board treats the injection as free.
    place: Wire Room
    relationship: >-
      The quantity equation, velocity: MV = PY, with turnover holds steady, so money growth above
      output growth lands in prices.
    concept: 'The money multiplier, and what a reserve requirement caps'
    takesAsRead:
    - 'Fractional reserve banking: a deposit is somebody else’s loan'
    - 'The spending multiplier, and why one round is not the total'
    scene: >-
      The reconciled money supply is 3,524 million marks. In the board’s simplified scenario, a 12 million reserve
      injection at the old requirement could support up to 600 million more deposits, taking the modeled total to
      4,124 million. Real output is falling four per cent.
    guide: >-
      Put the money supply, its turnover, the price level and real output in one relationship and
      see what has to give. If money grows and output does not, and turnover holds steady, the
      adjustment happens in prices. Work out the size of it.
    background:
    - >-
      What velocity is and why it is assumed. How many times a unit of money is spent in a
      period. It is not constant, and in a changeover it rises because nobody wants to hold the
      old currency — which makes the price effect worse rather than better.
    - >-
      What the relationship does and does not prove. It is an identity: the four terms are
      defined so that it holds. What makes it useful is the assumption about velocity, and that
      assumption is where every argument about it actually is.
    assumes:
    - velocity holds steady over the fortnight
    takeaway: If money grows faster than output and turnover holds, the difference lands in prices.
    format: CHOICE
    question: What does a 17 per cent rise in the money supply do, with output falling?
    choices:
    - Prices rise by more than 17 per cent
    - Prices rise by exactly 17 per cent
    - Prices are unaffected, since output fell
    - Output recovers to match the money
    answer: Prices rise by more than 17 per cent
    why: >-
      The reconciled money count is 3,524 million, not the unreconciled 3,606. Adding the model’s 600 million maximum
      deposit expansion gives 4,124 million, about 17 per cent higher. Under MV = PY, if velocity were unchanged
      and real output fell four per cent, the price level would have to rise by more than the money growth alone.
      That is a conditional model result. Velocity need not be constant, the 600 million is a ceiling rather than
      a forecast, and money growth does not by itself identify the cause of inflation.
    rebuttals:
    - Prices rising by exactly the money growth assumes output is flat, and output is falling.
    - Falling output makes the price effect larger rather than cancelling it.
    - More money does not add capacity, so output does not rise to meet it.

  # ----- day 10. The output gap, and what it says the problem is.
- title: Prices up, output down
  objective: Measure the gap between what Halvern makes and what it could.
  briefing: Two people are reading the same figures as opposite problems.
  stake: >-
    Wednesday. Output is nearly twelve per cent below estimated capacity while prices are rising fast. Demand weakness
    alone cannot explain both. Today you decide what combination of shocks the evidence actually supports and which
    unemployed workers policy can reach.
  takeaway: Where output sits relative to capacity is what says which problem you have.
  segue: >-
    The board signed the sentence. Output is 11.7 per cent under capacity, and a cost shock is
    making it worse. Both sides of the argument were half right. That's the worst answer for a
    board that has to pick just one policy. But of the 41,000 people out of work, only about
    9,000 are the kind any demand policy can even reach.
  stops:
  - group: PRICES
    task: Work out the output gap
    title: Actual, against potential
    reason: >-
      Emil Radic's output estimate and Della Prentice's labour numbers are about to be
      compared directly, and whether they agree decides which side of the argument holds up.
    place: Price Room
    relationship: >-
      The output gap = (actual − potential) ÷ potential × 100.
    concept: 'The business cycle, and where an output gap sits in it'
    takesAsRead:
    - 'Frictional, structural and cyclical unemployment'
    - 'Nominal against real: taking the price change out of a figure'
    scene: >
      Real output is running at 629 million a month. Radic's estimate of potential, at full
      employment, is 712 million. Unemployment is 8.4 per cent against a natural rate of 5.
    guide: >-
      Work out how far actual output is from potential as a percentage of potential. Then
      check it against the labour figures. A gap in output and a gap in unemployment should
      tell the same story, and here they can be compared directly.
    background:
    - >-
      What potential output is. What the economy could produce with everybody employed who wants
      to be, at the capital and skills it has. It is an estimate rather than a measurement, and
      Radic's has a range on it he will quote if asked.
    - >-
      Why the two gaps agree. Three and a half points of unemployment above the natural rate is
      a lot of idle labour, and idle labour is missing output. The two figures being consistent
      is the strongest evidence either of them is right.
    assumes:
    - the estimate of potential output is of the same period
    takeaway: A negative output gap and unemployment above its natural rate are two views of one thing.
    format: BALLPARK
    question: Estimate the output gap.

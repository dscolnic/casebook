            - id: utility
              label: utility
            - id: player
              label: player
            - id: desk
              label: desk
          people:
            - id: utility
              label: Utility liaison
            - id: desk
              label: Desk engineer
            - id: field
              label: Field engineer
            - id: player
              label: Building Safety Coordinator
          problems:
            - id: burst_main
              label: Burst water main over liquefaction-susceptible fill
              trend: rising
              irreversible: true
              loud: true
              stable: false
              rate: worsens while uncontrolled flow continues
              consequence: additional water raises pore pressure and can reduce effective-stress margin before another strong aftershock
              owner: utility

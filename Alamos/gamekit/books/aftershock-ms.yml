          - Open the whole site, because the placard is green.
          - Open the classrooms and shut the gym until the fixings are repaired.
          - Shut the site until every building has been looked at.
          - Open the site, and hold every class in the gym.
        answer: Open the classrooms and shut the gym until the fixings are repaired.
        rebuttals:
          - The green placard covered what could be seen from outside, and the gym was locked that day.
          - Shutting the classrooms protects nobody. There is nothing wrong with them.
          - The gym is the worst room on the site, not the safest. Its walls hang on the fixings that tested short.
      - group: STRUCT
        task: Sort the damage photographs before the panel meets.
        title: Holding it up, or hung on it
        concept: "A building carries its weight down a path, and the weakest needed link governs"
        place: Structural Assessment
        scene: Four hundred photographs came in this morning and the panel meets at four. Some of them show the parts that hold the building up. The rest show things the building holds, and both look bad in a photograph.
        guide: >-
          Two bins. Ask whether the thing in the picture is holding something up. Columns,
          beams and walls that carry weight are. Ceilings, cladding, partitions and shelves
          are carried by the building instead.
        background:
          - >-
              Why it decides the placard. A cracked column changes whether the building stands up in
              the next shake. A cracked partition costs money and does not.
          - >-
              Why the other pile still matters. Falling cladding and ceilings hurt people. They need
              clearing and making safe, which is a different crew and a different day.
        assumes:
          - some parts of a building hold it up and some are carried by it
        takeaway: What decides if people can go in is what carries the weight, not what looks worst.
        format: BELT
        question: Send each photograph to the bin that says whether it carries weight.
        answerText: Anything carrying weight down to the ground goes left. Anything the building carries goes right, however bad it looks.
        why: >-
          The question the panel has to answer is whether the building will stand up to the next
          shake, and only the parts that carry weight decide that. Columns, beams, load-bearing
          walls and the joints between them make a path from the roof down to the ground.
          Damage anywhere on that path makes the building weaker. A smashed partition, a ceiling
          on the floor, cladding hanging off the front and a toppled shelf are all carried by
          the building. None of them makes the frame weaker. That is why the worst-looking
          photographs are usually the ones that do not change the placard, and the photograph
          that does is often a thin crack on a column behind a wall that looks fine. The second
          pile still matters. Falling cladding hurts more people in a medium earthquake than
          anything else. It just wants a different crew, not shoring.
        belt:
          left: { name: Holds weight }
          right: { name: Is carried }
          need: 20
          lives: 3
          pass: 0.8
          hint: Ask whether it is holding something up.
          items:
            - { name: Cracked column, bin: left }
            - { name: Beam-column joint, bin: left }
            - { name: Cracked shear wall, bin: left }
            - { name: Foundation settled, bin: left }
            - { name: Buckled brace, bin: left }
            - { name: Spalled column, bin: left }
            - { name: Slab pulling away, bin: left }
            - { name: Bearing pad moved, bin: left }
            - { name: Cracked pier, bin: left }
            - { name: Sheared bolts, bin: left }
            - { name: Masonry pier cracked, bin: left }
            - { name: Cracked corbel, bin: left }
            - { name: Ceiling down, bin: right }
            - { name: Cladding hanging, bin: right }
            - { name: Cracked partition, bin: right }
            - { name: Toppled shelf, bin: right }
            - { name: Broken window, bin: right }
            - { name: Light fitting down, bin: right }
            - { name: Burst sprinkler pipe, bin: right }
            - { name: Loose coping, bin: right }
            - { name: Swinging duct, bin: right }
            - { name: Roof tiles off, bin: right }
            - { name: Shop sign down, bin: right }
            - { name: Cracked plaster, bin: right }
            - { name: Jammed lift door, bin: right }
            - { name: Spilled cabinet, bin: right }
          commit: Start the line
  - title: The hospital, and what waiting costs
    objective: Resolve a yellow placard on the one building the district cannot do without.
    briefing: 90 patients, 3 days of yellow, and an argument about whether more evidence is worth more time.
    stake: "Wednesday, and the hospital has been yellow for four days. Peter Ives, the hospital facilities manager, has ninety patients on the ground floor and two empty floors above them. Surgery is being done sixty kilometres away. Okonkwo wants the plant room opened and the walls cored before she signs. Bram Halvorsen says every day of that is a day of care nobody gets, and this morning he is right. Today you work out what is really unsettled, and what waiting costs."
    takeaway: Gathering more evidence is not free, and evidence that cannot change the decision costs without buying anything.
    stops:
      - group: STRUCT
        task: Check what is behind each record, then spend the one visit before the placard review.
        title: The part nobody has seen
        place: Structural Assessment
        scene: Ninety patients are still on the ground floor, and two floors above them stand empty. The hospital has been yellow for three days. The roof plant room is locked, with two full water tanks in it.
        guide: >-
          Each claim on the list was signed or checked by somebody. Open the backing
          before you spend anything. Some claims rest on somebody looking at the thing
          they describe. Some rest on a drawing, an assumption, or a locked door. You
          get one visit. Hold the claims the evidence does not support, and spend the
          visit where being wrong would cost the most.
        background:
          - >-
              What a signature does and does not say. It says somebody took responsibility
              for a sentence. It does not say anybody looked. Three days after an earthquake
              those two come apart all the time: drawings get checked, cladding gets looked
              at from the street, and a locked room gets written up from the last visit
              before the shake.
          - >-
              Why the tanks matter. Two full water tanks are a lot of weight, high up, in a
              room nobody has been into since the earthquake. If their supports have
              shifted, what happens next happens to the floor below — where ninety patients
              are. So that claim is the one that costs the most if it is wrong, whatever the
              paperwork says.
          - >-
              Why only one check. Every visit costs time the hospital does not have while it
              stays yellow. Choosing which claim to check is the real decision, and it is
              about consequence rather than about which record looks weakest.
        assumes:
          - a building's parts can be cleared one at a time
          - a signature says somebody approved it, not that somebody looked
        takeaway: A signed record is worth whatever the looking behind it was worth.
        format: ATTEST
        question: Which claim still needs somebody to go and look?
        attest:
          hint: Open the backing attached to each claim before spending the visit. You have one direct verification before the placard review.
          checks: 1
          checkUnit: direct verification visit
          claims:
            - id: frame
              label: The reinforced-concrete frame has no observed condition requiring the current restriction
              critical: true
              backed: true
              evidence: Three days of frame inspection on all accessible floors.
            - id: cladding
              label: The external cladding does not present the unresolved structural issue
              critical: false
              backed: true
              evidence: Cladding inspection completed on day two.
            - id: stairs
              label: The main stair and egress route are usable for the proposed occupancy
              critical: true
              backed: true
              evidence: The stair core was directly inspected because it is the main escape route.
            - id: plant_room
              label: The roof water-tank restraints are adequate for the proposed occupancy
              critical: true
              backed: false
              evidence: No direct observation; the roof plant room remains unvisited.
        answerText: Go to the roof plant room. The frame, cladding and stairs already have somebody's eyes behind them. The full tanks and their fixings are what nobody has seen, and that is what holds the review open.
        why: A yellow placard should shrink to the specific things nobody has settled. The frame, the cladding and the stair have all been looked at, and there are notes to prove it. The roof plant room has not. Two full water tanks sit high in the building, and nobody has seen what holds them down. There is one visit left. Spending it on something already checked leaves the unchecked claim holding the review open.
      - group: HAZ
        task: Put the cost of waiting into the same units as the risk.
        title: What four more days buys
        place: Hazard & Forecasting
        scene: Tanaka has the aftershock rate for the week, and the hospital transfer log beside it. The office wants both stated as what they cost, rather than as principles. The board meets on Friday.
        guide: >-
          All four options are ways of weighing four days. They differ in what they
          count. Ask of each whether it prices the waiting, the evidence, or neither.
          The frame has already been inspected. What nobody has entered is a room on the
          roof. So ask what four days of evidence would actually change.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - waiting has consequences, and they can be counted
        takeaway: Waiting is a decision, and it has to be compared with the decision to act now.
        format: CHOICE
        question: Four more days would sharpen the number. What does the waiting cost while it does?
        why: Both choices have a cost, and both can be counted. Waiting means transfers, delayed care and a hospital running short. Testing is worth it when it has a real chance of changing the answer. Here the frame has been looked at already, and the thing nobody has settled is a locked plant room with heavy tanks in it. Four days of coring answers a different question. Ask what the evidence could change, and who pays while it is collected.
        choices:
          - Evidence comes first, and the delay is not your problem.
          - Against what the waiting costs, and what the evidence could change.
          - By the aftershock forecast alone, as the placard says.
          - By what the hospital's managers want, since they carry the day-to-day risk.
        answer: Against what the waiting costs, and what the evidence could change.
        rebuttals:
          - Evidence first is a good instinct and not a rule. The question is what this evidence could change.
          - The forecast speaks to the hazard and says nothing about what an empty hospital costs.
          - Managers carry the day-to-day risk, and they do not get to set the engineering standard.
      - group: SEIS
        task: Say what the basement record can and cannot settle.
        title: The instrument in the basement
        concept: An instrument that is wrong needs a check from something else
        place: Seismic Network
        scene: There is an instrument in the hospital basement, fitted in 1998 and never needed until now. Cardoso has its record. It peaked at 0.31 g. The building was designed for 0.35.
        guide: >-
          Say what the second instrument outside the hospital should read, then go and read it.
          Write the number down first. An instrument that has sat in a basement since 1998 has
          never been checked against anything, and the only way to find out whether it is
          telling the truth is another instrument that could disagree with it.
        background:
          - >-
              Why a second reading. One instrument on its own cannot be checked. If it is reading low,
              nothing in its own record says so. Another instrument nearby, on the same kind of ground,
              gives a number that either matches or does not.
          - >-
              What to expect. The car park instrument stands about eighty metres away on the same
              ground, so it should read close to the basement one — not exactly the same, because a
              basement is stiffer than open ground, but within about a fifth either way.
          - >-
              What 0.31 against 0.35 does not mean. The building was designed for 0.35, and coming in
              under a design figure is not a line below which nothing breaks. It says the shaking was
              about what the building was built for, which is worth knowing and is not a clean bill of
              health.
        assumes:
          - an instrument inside a building measures the shaking that building got
        takeaway: A record of what happened is evidence, and it is never a line under which damage is impossible.
        format: VERIFY
        question: Predict what the car park instrument read, then go and read it.
        answerText: About 0.33 g — close to the basement's 0.31, which is what tells you the basement instrument is working. A reading of 0.6 would have meant the basement one was wrong.
        why: One instrument cannot check itself. The basement record says 0.31 g, and if that instrument has been drifting low since 1998 there is nothing in its own record to say so. The car park instrument stands eighty metres away on the same ground, and it reads 0.33 g. Those two agree, which is the useful result: the basement number can be trusted, and the hospital really did see about what it was designed for. Had the car park read 0.6, the basement instrument would have been the problem rather than the building. Two things the record still does not settle. Coming in under a design figure of 0.35 is not a line below which nothing breaks — it means the shaking was about the size the building was built for. And it says nothing about the plant room upstairs, which shakes differently from the basement it sits above.
        verify:
          prediction:
            label: What the car park instrument read
            unit: g
            min: 0.05
            max: 0.8
            step: 0.01
          truth: 0.33
          passRatio: [0.6, 1.6]
          intervention:
            label: Walk out to the car park instrument and download its record
            note: eighty metres from the basement, on the same ground, fitted in the same year
            outcome: The record downloads and the peak for the same minute is on the screen.
          measurement:
            label: Read the peak for the same minute
            note: same event, same clock
            cost: 20
            costUnit: minutes
          unmeasuredMoral: Reporting the basement number without checking it against anything is reporting one instrument's word for itself, which is the whole thing this stop is about.

  - title: The material, and what it can still carry
    objective: Get a number for the strength of a damaged building instead of an opinion.
    briefing: The library's columns look cracked. Nobody has said what they can still hold.
    stake: "Friday, and the argument has moved from buildings to numbers. The library is a concrete frame from the 1970s, with cracks running diagonally through three ground-floor columns. Three engineers have called them moderate, serious and superficial. Duarte Ferreira, the materials engineer, points out that none of those is a number, and his lab can give one in a day. Today you turn a sample into a strength, and say what the building may be used for meanwhile."
    takeaway: A word like serious is an opinion; a strength with a method behind it is something the next engineer can use.
    stops:
      - group: MAT
        task: Say what the four crushed cores actually support.
        title: A number, with a method attached
        concept: One sample is not the whole building
        place: Materials & Testing
        scene: "Four cores, cut from the cracked columns. Sørensen crushes them: twenty-eight, thirty-one, twenty-four and thirty megapascals. The 1974 drawing asks for twenty-five."
        guide: >-
          Four cores, and every option is a claim about what they settle. Ask of each
          how far it travels from four crushed cylinders. Strength is a fact about the
          concrete. What a column can carry also depends on the steel inside it and the
          load on it. The cores narrow the question rather than closing it.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - concrete strength is measured by crushing a sample of it
        takeaway: A test tells you about the concrete. It does not tell you about the column.
        format: CHOICE
        question: The drawing asks for twenty-five, and the lowest core came out at twenty-four. What does that tell you about the concrete?
        why: The four cores average close to what the drawing asked for, so weak concrete is not the story. That is worth knowing, and it is not the answer. Crushing a cylinder measures the material. It does not measure what the column went through, how much steel is inside it, or how well that steel wraps the concrete. The cores narrow the question. Somebody still has to work out what the column can carry now.
        choices:
          - That the columns are undamaged, since the concrete beats what was specified.
          - It is as strong as the design assumed, and no stronger.
          - The design was too careful, and the building is over-strong.
          - That the cracking must have come from something other than the earthquake.
        answer: It is as strong as the design assumed, and no stronger.
        rebuttals:
          - Cracking is something you see in the structure. A crushed core says nothing about it either way.
          - One building's concrete beating its specification says nothing about whether the design was careful.
          - Cracks running diagonally in a ground-floor column during an earthquake have an obvious cause.
      - group: STRUCT
        task: Say which explanation fits the pattern.
        title: Which way the cracks run
        place: Structural Assessment
        scene: The cracks run diagonally, both ways, crossing in an X across the middle of each column. They are fine, there are many, and they sit evenly apart.
        guide: >-
          Four options, and the pattern has to be explained in full. The cracks go both
          ways. They cross. They are fine, many, and evenly spaced. Ask of each option
          what pattern it would leave instead. Crushing and settling do not change
          direction. And note the limit. A pattern names a cause, not what is left in
          the column.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - a crack opens across the direction something is being pulled apart
        takeaway: A pattern can point at the cause. It cannot tell you what is left.
        format: CHOICE
        question: The cracks cross in an X on every column. What kind of movement makes that shape?
        why: Concrete cracks across whatever is pulling it apart. Push a column sideways and the pull runs on a diagonal, so the crack opens on a diagonal. Push it back and a second diagonal opens, crossing the first. That X is the mark of shaking, not of weight or of slow settling. Many fine cracks rather than one big one also says the steel inside is working. It does not say how much is left.
        headline: Fine diagonal cracks cross both ways across three ground-floor columns.
        readings:
          - zone: Column A
            label: Crack direction
            value: diagonal both ways
            status: alarm
          - zone: Column A
            label: Crack width
            value: 0.3 mm
            status: normal
          - zone: Column B
            label: Cover concrete
            value: intact
            status: normal
          - zone: Column C
            label: Crack spacing
            value: even, 120 mm
            status: normal
          - zone: Core sample
            label: Strength
            value: 28 MPa
            status: normal
        choices:
          - label: Being pushed side to side, first one way and then the other.
            mechanism: A push one way and then back opens cracks running both ways.
          - label: Too much weight pressing straight down.
            mechanism: Too much weight crushes concrete and bursts the outer layer off.
          - label: The foundation settling slowly over years.
            mechanism: Settling bends a frame slowly, and in one direction.
          - label: Poor concrete.
            mechanism: Weak material cracks under everyday loads.
        answer: Being pushed side to side, first one way and then the other.
        rebuttals:
          - Crushing pushes the outer layer of concrete off, and the cover here is untouched.
          - Settling works slowly and one way. It does not open crossed diagonals.
          - The cores came back above what was specified, so weak material is not it.
      - group: SAFE
        task: Put the four steps in the order they have to happen.
        title: Part of a building, for part of a purpose
        place: Public Safety
        scene: Monday's public meeting has two hundred people booked. There is no other hall big enough. Three ground-floor columns in the library are cracked.
        guide: >-
          All four of these will happen. The order is what is being decided. Ask of each
          what has to be settled before it means anything. A limit on numbers only works
          once you have said which part of the building. A review date is what stops a
          limit lasting for ever. Two hundred people are booked and there is no other
          hall.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim that each step needs the
              one before it to have happened. Get one pair the wrong way round and the claim
              is wrong, even if everything else lines up. That is why there is no part
              credit.
          - >-
              Why the ends are the place to start. The first and last steps are usually the
              easiest to be sure of, because one has nothing before it and the other has
              nothing after it. Fixing those two leaves fewer ways for the middle to go, and
              the middle is where the real question usually is.
          - >-
              What the rail can be ordered on. Often it is time. It can also be cost, or
              risk, or what you can still undo afterwards — do the steps that change nothing
              before the ones that change something for good. A step that destroys the
              sample can only be last.
        assumes:
          - use can be limited by how many people, by which rooms, and for how long
        takeaway: Restricted use is a real answer between open and shut, and it has to say what it is protecting against.
        format: SEQUENCE
        question: Decide what the building may be used for meanwhile
        why: Part-use is an engineering line, not a hopeful label. Propping comes first, because it changes what the building can carry. A number on the door comes next. A limit nobody can count is not a limit. A review date comes after that, or the restriction quietly turns permanent and stops being believed. Only then is the meeting a yes or a no.
        cards:
          - Prop the three cracked columns, to take weight off them.
          - Set a limit on numbers, and put it on the door.
          - Put a review date on the limit, so it ends.
        order: [0, 1, 2]
  - title: The cordon nobody can lift
    objective: Weigh what a cordon protects against what it costs the people inside it.
    briefing: 11 streets have been closed for 6 days, and the reason is now 3 different reasons.
    stake: "Saturday, and the fence around the Flats is a week old. It went up on day one for falling masonry. It stayed on day three for the gas main. It is still up because nobody has said it can come down. Yvette Delacroix has four hundred families, sixty of them sleeping in the sports hall, and one question. What has to be true before people can go home? Today you find what each stretch of fence is really holding back."
    takeaway: A cordon is a decision that is remade every day, and one kept out of habit is a decision nobody is making.
    stops:
      - group: SAFE
        task: Check what is behind each stretch of fence, then spend the one field check.
        title: Three reasons wearing one line
        place: Public Safety
        scene: Shopkeepers wait at the tape with keys in their hands. Delacroix walks the line with the log. Three stretches have written reasons. The southern leg has none that anybody can point to.
        guide: >-
          Each stretch of tape is a claim that there is a hazard there now. Open the
          evidence behind each one first. Some rest on somebody looking. Some rest on a
          hazard that has since been cleared. One has no written reason at all. You can
          go and check one stretch. Hold the claims the evidence does not support, and
          check the one where opening the wrong street would cost the most.
        background:
          - >-
              A closure is a claim. Tape goes up for a reason, and the reason is about a
              condition right now — falling glass, a loose parapet, ground that may still
              move. Conditions change and reasons expire, so a stretch nobody has been back
              to is a claim nobody has retested.
          - >-
              What a stale closure costs. Shopkeepers are at the tape with keys and
              deliveries. Every day a stretch stays shut with no hazard behind it, people
              trust the tape less — and then they walk around the stretches that do matter.
              Closing too much is not the safe mistake it looks like.
          - >-
              Why the unwritten one is not automatically the answer. A stretch with no
              logged reason may still be holding back something real that somebody saw on
              day one and never wrote down. Finding out is the point, which is why you spend
              the check instead of guessing from the log.
        assumes:
          - a fence can be up for more than one reason
          - checking costs time, and there is one check left before the map is reissued
        takeaway: Every stretch of fence is a claim about a hazard, and a claim should be checkable.
        format: ATTEST
        question: Which closure most needs somebody to go and check the ground?
        attest:
          hint: Open the evidence attached to each segment. You can physically recheck one segment before the new map is issued; a line on the map is not itself evidence of a present hazard.
          checks: 1
          checkUnit: field verification
          claims:
            - id: north
              label: Keep the northern arc closed to pedestrian access
              critical: true
              backed: true
              evidence: Unsecured Parade parapets are documented directly above this arc.
            - id: east
              label: Keep the eastern leg closed while the gas-main status is unresolved
              critical: true
              backed: true
              evidence: Utility isolation and sign-off status are recorded for this main.
            - id: ferry
              label: Keep Ferry Street restricted to heavy emergency vehicles
              critical: true
              backed: true
              evidence: Road-support observations show the disturbed surface cannot yet support the appliance route.
            - id: south
              label: Keep the southern leg inside the public exclusion boundary
              critical: true
              backed: false
              evidence: No hazard or access reason is recorded for this segment.
        answerText: Check the southern leg. Every other stretch has a written hazard behind it. If there is a hazard there, record it and keep the fence. If there is not, the line should not stay up because somebody drew it on the first night.
        why: A cordon usually holds several different hazards, and each one has its own condition for coming down. The Parade is closed for the masonry overhead. The gas leg waits on the utility. Ferry Street is about heavy vehicles getting through. The southern leg is different. The map keeps people out and the log gives no reason. One check is left, and the unbacked line is the one to spend it on.
      - group: GEO
        task: Say what state Ferry Street is really in.
        title: Soft ground, three days on
        concept: Wet sandy ground can behave like a liquid when it is shaken
        place: Geotechnical
        scene: Thandi Mbeki has been out on Ferry Street with a hand auger. The sand has dried and the water has dropped back. The surface carries a person, and not a truck.
        guide: >-
          Four things are different about the street since Friday, and the plate test will give
          you a strength reading for whatever you set up. Change one of them and run the test.
          Change several and the reading cannot tell you which one did it. Then put your one
          back the way it was, because a change that does not undo itself was never the cause.
        background:
          - >-
              What went liquid and what came back. Shaking pushed the water between the sand grains
              until the grains stopped touching, and the ground behaved like a liquid. As the water
              pressure dropped the grains came back into contact, so the strength came back too.
          - >-
              What did not come back. The grains settled into new places, leaving the ground looser
              in some spots and hollow in others. That is why the surface carries a person and not a
              truck, and why it can go again if it is shaken while it is still wet.
          - >-
              Why one thing at a time. Water level, how packed the sand is, how heavy the load is and
              how long it sits are all different between Friday and today. A test that changes two of
              them at once gives a number that fits either story.
        assumes:
          - ground that went liquid gets its strength back as the water pressure drops
        takeaway: The liquid part is over quickly. What it leaves behind is not.
        format: CONTROL
        question: Which difference is actually deciding how much weight Ferry Street will carry?
        answerText: How high the water sits. Drop the water table and the plate reading nearly triples; put the water back and it falls again — the packing and the load do almost nothing on their own.
        why: Four things about the street have changed since Friday. Only one of them moves the strength reading. Drop the water by three quarters of a metre, with everything else the same, and the plate test goes from 38 to 104. Let the water back up and it falls again. That is what makes it a real cause: the reading follows the change both ways. How tightly the sand is packed, and how long the load sits, move the reading less than the test's own wobble. This is the first day's mechanism run backwards. Water pressure between the grains is what let go. Taking the water away puts the grains back in touch. But the street is still weaker than it was before the earthquake, because the grains have settled somewhere new. So the honest answer is drained and disturbed. Walk on it. Keep trucks off it. Expect it to go again if it is shaken while wet.
        control:
          observable:
            label: Strength under the plate test
            unit: kilopascals
          variables:
            - id: water
              label: How high the water sits under the street
            - id: packing
              label: How tightly the sand is packed
            - id: load
              label: How heavy a load is put on the plate
            - id: time
              label: How long the load is left in place
          held:
            - the same patch of street
            - the same plate and the same rig
            - the same weather that day
          truth: water
          baseline: 38
          response: 66
          noise: 8
          hint: The rig can be set up again for each test. Change what you want, run it, and watch the reading.
          run: Run the plate test
          commit: Name the one that is deciding it
      - group: HAZ
        task: Say what the office should promise.
        title: A condition, not a date
        place: Hazard & Forecasting
        scene: Halvorsen wants a date on the fence. Delacroix wants a condition instead. A date is a promise about the ground, and a condition is a promise about the office.
        guide: >-
          Four options, and they differ in what the office would be promising. Ask of
          each whether the promise is about the ground or about the office's own work. A
          date promises something nobody controls. A rate is about the whole town, not
          one street. Residents want to see progress, and a written condition is
          progress they can check.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - a promise can be tied to a day, or to something anybody can check
        takeaway: Tie a decision to something somebody can check, and it stays honest whatever the ground does next.
        format: CHOICE
        question: A date is a promise about the ground, and a condition is a promise about the office. Which one can the office actually keep?
        why: A date promises how the ground will behave, and nobody controls that. A condition promises what the office will require before it moves a fence, and the office does control that. Publishing the conditions turns waiting into something people can watch. The aftershock rate is a poor trigger, because it says nothing about one street. Name the checks that open each stretch.
        choices:
          - A date. The fence comes down on Friday.
          - A condition, so each stretch opens when its hazard is fixed.
          - A rate, tied to the aftershocks dropping below one a day.
          - No promise until every building inside is assessed.
        answer: A condition, so each stretch opens when its hazard is fixed.
        rebuttals:
          - A date promises how the ground and the repairs will behave, and nobody can promise that.
          - The aftershock rate is not the hazard written against any of these stretches.
          - Fully assessing every building would take a month, and most of these streets do not need it.
      - group: GEO
        task: Hold the water down while the trench is open.
        title: Keeping the water out of the trench
        concept: "Wet sandy ground can behave like a liquid when it is shaken"
        place: Geotechnical
        scene: A trench has to stand open for an afternoon in ground that went liquid nine days ago. Pumps hold the water down. If the water comes back up, the sides do not wait.
        guide: >-
          Hold the water level below the trench floor, inside the band on the gauge. The band
          gets narrower through the afternoon, because an open trench gets a little weaker
          every hour. Each thing that lets water in keeps letting it in. Set the pumps to
          match it.
        background:
          - >-
              Why the water matters. Sand holds together because the grains press on each other.
              Water between the grains pushes them apart, and then the sand behaves like a liquid.
          - >-
              Why rain is not one push. Rain keeps falling, a leaking pipe keeps leaking, and the
              tide keeps coming in. The water level does not settle at a new place. It keeps rising
              until the pumps match what is arriving.
        assumes:
          - water between sand grains makes the ground weaker
        takeaway: A leak that keeps arriving is not answered by turning a pump on once.
        format: HOLD
        question: Hold the water below the trench floor while the shoring goes in.
        answerText: Inside the band for most of the afternoon, with the pumps set to match each inflow rather than started once the gauge has risen.
        why: >-
          Sand holds together because the grains press on one another. Water between them pushes
          them apart, and once that happens the sand behaves like a liquid. That is exactly what
          happened to this ground nine days ago, in forty seconds. This afternoon it can happen
          slowly instead. Everything pushing the water up keeps pushing. Rain keeps falling, the
          leaking main keeps leaking, the tide keeps coming in. So the pumps are set to match
          what is arriving, and left there. A pump switched on for a minute buys a minute. The
          band gets narrower because an open trench loses a little strength every hour it
          stands. The same rise in water is a bigger problem at four o'clock than it was at one.
        hold:
          quantity: Water level below the trench floor
          unit: m
          control: Pumps
          hold: 1.5
          band: 0.4
          narrowTo: 0.2
          duration: 45
          direction: raise
          authority: 0.1
          pass: 0.8
          hint: Each inflow keeps arriving. Set the pumps to match it.
          disturbances:
            - { label: Rain starts, at: 4, amount: -0.03 }
            - { label: Tide goes out, at: 20, amount: 0.05 }
            - { label: The leaking main is found, at: 38, amount: -0.045 }
          commit: Report the afternoon
  - title: The record that was wrong all along
    objective: Re-read the fortnight after finding the instrument everyone trusted was mis-sited.
    briefing: The vault on the bench is not on rock. It is on four metres of weathered granite, and that changes every comparison.
    stake: "Tuesday, and Inês Cardoso has found the thing nobody wanted found. The vault above Upper Town is the station every comparison this fortnight has been measured against. It is not founded on rock. It sits on four metres of broken granite that behaves like stiff soil, and it has been exaggerating the shaking since 1998. Today you work out what that does to the fortnight's conclusions, and which of them still stand."
    takeaway: A reference that is not what it claims moves every measurement made against it, and finding that out is a good day.
    stops:
      - group: SEIS
        task: Open what each conclusion rests on, keep the ones that stand alone, and name what the rest share.
        title: Measuring against the wrong zero
        concept: An instrument that is wrong needs a check from something else
        place: Seismic Network
        scene: Cardoso's five-day check is finished. The station everything was compared against shakes more than it should. Navarro lays five of the fortnight's conclusions beside it.
        guide: >-
          Open a conclusion and the panel shows what it was worked out from. Keep the
          ones that stand on a measurement of their own. Untick the ones whose evidence
          runs through the bad station. Then name the source the failing ones share.
          Both halves count: throwing away a good conclusion costs you as much as
          keeping a bad one.
        background:
          - >-
              What went wrong. Every station's record is read against an assumed idea of how
              much that ground shakes. For one station that idea was wrong, and the five-day
              check has just proved it. Anything worked out through that station is wrong by
              the same amount. Anything measured somewhere else is not.
          - >-
              Why you should not throw out the lot. Withdrawing the whole fortnight looks
              careful. It is wrong twice. It throws away work that was never affected, and
              it tells the briefing that nothing is known when several things are. A
              retraction is a claim too, and it should be no bigger than the evidence.
          - >-
              How to read the chain. A conclusion is still good if there is some path to it
              that never touches the bad station. That is a question about the path, not
              about how big or alarming the number is — which is why you have to open each
              one.
        assumes:
          - a comparison is only as good as the thing you compared against
        takeaway: A bad reference spoils whatever leaned on it, and leaves what was measured directly alone.
        format: TRACE
        question: Which conclusions inherit the bad reference, and which stand on their own?
        trace:
          hint: Open each conclusion and inspect the sources underneath it. Keep conclusions whose evidence chain does not pass through the suspect reference, then name the source shared by the conclusions that fail.
          target: vault_ref
          channels:
            - id: ratio
              label: Flats motion comparison
              reading: 3.0 times as much shaking (a ratio, so it has no unit)
              depends:
                - flats_record
                - vault_ref
            - id: planning_factor
              label: Rebuilding demand factor
              reading: 3.0 times, copied into the planning memo (also a ratio)
              depends:
                - flats_record
                - vault_ref
            - id: hospital_pga
              label: Hospital base acceleration
              reading: 0.31 g, measured in the hospital basement
              depends:
                - hospital_record
            - id: marina
              label: Marina Court failure diagnosis
              reading: sinking, heaving and ejected sand, all seen and written down
              depends:
                - marina_survey
          correction:
            what: How much the reference station's own ground shakes
            was: 1.0 times — solid rock, no extra shaking
            now: 1.6 times — four metres of broken granite under it
            effect: Anything measured against this station is too small by that much.
            corrected: The Flats figure of 3.0 becomes 3.0 × 1.6, which is about 4.8 times solid rock. The planning factor copied from it moves too.
          resources:
            - id: vault_ref
              label: Reference-station site response
            - id: flats_record
              label: Flats accelerograph record
            - id: hospital_record
              label: Hospital basement accelerograph
            - id: marina_survey
              label: Marina Court survey and ground observations
          independent:
            - hospital_pga
            - marina
        answerText: Redo the Flats figure and the planning factor copied from it. The panel says the station shakes 1.6 times, not 1.0, so 3.0 times that station is about 4.8 times solid rock. Keep the hospital's 0.31 g and the Marina Court diagnosis. Neither of them used the station.
        why: Every conclusion has a chain under it. The question is whether the bad station sits in that chain. The Flats figure was measured against that station, so it moves. The panel gives you both numbers you need. The station shakes 1.6 times what solid rock does, so 3.0 times the station is about 4.8 times rock. Anything copied from that figure moves as well. The hospital's own record and the Marina Court survey never touched the station.
      - group: GEO
        task: Sort the fortnight's conclusions by what they rest on.
        title: What still stands
        concept: Saying what you know and what you do not
        place: Geotechnical
        scene: Navarro puts four of the fortnight's conclusions on the board and asks which of them leaned on the vault. The corrected vault report is clipped up beside them.
        guide: >-
          Four conclusions on the left, and what the vault error does to each on the
          right. Trace each one back to its evidence. Then ask whether the vault is in
          that evidence. A survey and a field of sand do not need a reference station.
          Neither does an instrument in a basement. One bad comparison spoils what was
          compared, and nothing else.
        background:
          - >-
              Why you match instead of choosing. A response that is right for one situation
              is often nearly right for the next one. Picking from a list lets you take the
              nearly-right answer and never notice. Matching makes you say which situation
              it fits best, and that comparison is the whole point.
          - >-
              How to use the one-each rule. Every response goes somewhere, and nowhere
              twice. So the situations you are sure about are worth more than themselves:
              each one you settle leaves fewer responses for the ones you are not sure
              about. Two lines you trust can decide the other two for you.
          - >-
              Why one wrong line is impossible. If three lines are right, the fourth
              response has nowhere else to go, so it is right too. Being wrong always means
              at least two are wrong at once. If a join feels forced, the mistake is
              probably not in that join — it is in one you already made and stopped
              questioning.
        assumes:
          - a conclusion can rest on one measurement or on several
        takeaway: A bad reference spoils what was measured against it, and leaves what was measured directly.
        format: PROTOCOL
        question: Match each conclusion to what the vault error does to it
        why: Follow each conclusion down to what it rests on. The Flats figure used the vault as its yardstick, so a bad yardstick moves it. Marina Court was worked out from a survey, from heave and from sand. The hospital's number came from its own basement. The parapet case rests on what people watched fall. Those three may deserve other checks, and this error is not one of them.
        rebuttals:
          - That factor was the vault comparison, so it is the one conclusion that falls.
          - Marina Court was worked out from settlement, heave and sand, with no station involved.
          - The hospital's shaking was measured in its own basement.
          - The parapet case rests on every parapet having come down, which is something people saw.
        columns:
          - The conclusion
          - What the vault error does to it
        scenarios:
          - The Flats shake about three times as hard.
          - Marina Court failed because the ground stopped holding it up.
          - The hospital saw 0.31 g against a design of 0.35.
        choices:
          - Falls, and has to be restated. The real figure is nearer five.
          - Stands. Survey, heave and sand, with no station in it.
          - Stands. Measured by the hospital's own instrument.
        mapping: [0, 1, 2]
      - group: HAZ
        task: Say what the corrected figure changes.
        title: Five times, not three
        place: Hazard & Forecasting
        scene: If the Flats shake five times as hard as rock rather than three, a future earthquake delivers far more there. The district map is waiting on a new number.
        guide: >-
          Two instruments recorded the same earthquake. One stood on the soft ground of the
          Flats, one on the rock above the town. How many times harder the Flats shook is the
          bigger reading divided by the smaller one. One tile is the old figure from the map,
          which is the number you are replacing.
        background:
          - >-
              Why you divide. Asking how many times bigger one thing is than another is always a
              division. Both readings are in the same units, so the answer has no units at all — it
              is just a number of times.
          - >-
              What it means for the Flats. The rock and the soft ground got the same earthquake. The
              soft ground turned it into something much larger, and that is a fact about the ground
              rather than about the earthquake.
          - >-
              What the new number changes. Everything still to be built there, because the design
              figures come from the shaking that is expected. It changes nothing about the cracks
              already in the walls, which were made by shaking that has already happened.
        assumes:
          - design figures come from the shaking that is expected
        takeaway: Fixing what you expect changes what gets built next. It does not change what already happened.
        format: BALLPARK
        question: How many times harder did the Flats shake than the rock?
        answerText: Five times. The Flats read 41 and the rock read 8.2, in per cent of gravity, and 41 divided by 8.2 is 5. The map says 3, so the map is wrong.
        why: Both instruments recorded the same earthquake. Written in per cent of gravity, the one on the Flats read 41 and the one on rock above the town read 8.2. How many times bigger is a division: 41 ÷ 8.2 = 5. Both numbers are in the same units, so the answer is just a number of times, with no units on it. That is the whole finding, and it is about the ground and not about the earthquake — the same shaking arrived at both places, and the soft ground made it five times larger. The district map says three. Fixing it changes what gets designed for the Flats from now on, and the case for improving the ground there. It changes nothing that has already happened: the cracks in the walls were made by the real shaking, which the instruments measured directly.
        estimate:
          prompt: The Flats instrument read 41 per cent of gravity. The instrument on rock above the town read 8.2. Same earthquake, same units.
          question: Choose the reading on the soft ground and the reading on the rock.
          labels:
            - 41  (the Flats, on soft ground)
            - 8.2  (the rock above the town)
            - 3  (the old figure on the district map)
            - 31  (the hospital basement)
          values: [41, 8.2, 3, 31]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 5
          tolerance: 0.4
          units: times harder
          solution: 41 ÷ 8.2 = 5 times, against the 3 on the map.
          explanation: Five, not three. The number is about the ground, and it changes what gets built rather than what has happened.
          givens:
            - the Flats read 41 and the rock read 8.2, in per cent of gravity
          relationship: How many times = bigger ÷ smaller. Both readings are in the same units, so the answer is a number of times.

  - title: Three things at once
    objective: Rank three demands on one office in one afternoon.
    briefing: An aftershock, a burst main and a deadline for the school, all inside an hour.
    stake: "Wednesday, twenty to four, and three things arrive at once. A magnitude 5.1 aftershock has just shaken the town, the biggest in a week. A water main has burst on Ferry Street, into ground everybody now knows is loose. And the district wants a decision on the school gym by five. Okonkwo has four engineers. Today you decide what gets attention first."
    takeaway: Ranking is about which problem grows fastest and which is cheapest to remove, not about which sounds worst.
    stops:
      - group: SAFE
        task: Keep the one judgement nobody else can make, and hand the rest over properly.
        title: Which of the three cannot wait
        place: Public Safety
        scene: Three calls land within minutes. A burst main is pouring water into the Flats. Buildings need checking after the 5.1. The school reopening message has to go out. Four engineers are free.
        guide: >-
          Three calls, four engineers, and one problem you keep yourself. For each of
          the others, choose somebody who can take a real first action, and say what
          reading or event brings it back to you. An owner with no first action will
          come back for orders at the worst moment. Then take the watch on the one that
          needs your own judgement.
        background:
          - >-
              Which one to keep. One of these is getting worse while you decide. One could
              hurt somebody and needs checking. One is a deadline that is not going anywhere
              — the message will still need sending in an hour. Keeping the deadline is the
              usual mistake, because it is the one that finishes, and finishing it costs the
              field team its hours.
          - >-
              What a first action is. Not "keep an eye on it". Something the owner can do
              without asking you: shut the valve, take a reading at the boundary, put out
              the message. A handover made of instructions to think is not a handover.
          - >-
              Why every handover needs a way back. You are lending the problem, not giving
              it away. Saying which reading brings it back means somebody else can hold it
              without checking in, and you hear about it at the moment it matters.
        assumes:
          - a problem still getting worse is different from one that has finished
        takeaway: Keep the judgement nobody else can make, and hand the rest over with a first move and a number.
        format: DELEGATE
        question: How do you split the team across the three?
        delegate:
          hint: Assign each handoff to a role that can take its first real action. The handoff is incomplete until it also says what result or threshold brings the problem back to you.

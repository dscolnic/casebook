# aftershock.yml — Kestrel Bay, 3 days after a magnitude 6.8.
#
# 1 earthquake, 2 disasters: Upper Town on granite, the Flats on hydraulic
# fill. The course is site effect, structural behaviour and decision under
# uncertainty, and the campaign is a fortnight of deciding which buildings
# people go back into.
#
# The argument, both sides right on a named day: Marisol Okonkwo places a
# building on what the evidence supports and will not move faster than it;
# Bram Halvorsen places it on what the town can survive being without, and
# argues that an empty hospital kills people too. Okonkwo is right on day 4.
# Halvorsen is right on day 6.

theme:
  id: aftershock_ms
  title: Aftershock
  subtitle: Building Safety Coordinator · Kestrel Bay

groups:
  - id: SEIS
    code: SEIS
    name: Seismic Network
    color: '#2980b9'
    desc: What the ground actually did, and which instrument is entitled to say so.
    defaultLeader: okonkwo
    milestones: [Read the records, Locate the source, Check the instruments, Ready to hand over]
  - id: STRUCT
    code: STRUCT
    name: Structural Assessment
    color: '#c0392b'
    desc: Whether a building is safe to enter, and what that placard is worth.
    defaultLeader: halvorsen
    milestones: [Walk the building, Find the load path, Rate the damage, Ready to hand over]
  - id: GEO
    code: GEO
    name: Geotechnical
    color: '#8e6b2f'
    desc: The ground under the town, and why it behaved in two different ways.
    defaultLeader: navarro
    milestones: [Log the ground, Test the fill, Bound the movement, Ready to hand over]
  - id: MAT
    code: MAT
    name: Materials & Testing
    color: '#7d5ba6'
    desc: What the concrete, the brick and the steel can still carry.
    defaultLeader: ferreira
    milestones: [Take the sample, Test it, Compare with design, Ready to hand over]
  - id: HAZ
    code: HAZ
    name: Hazard & Forecasting
    color: '#2f8f7a'
    desc: What might still happen, expressed as a number somebody can act on.
    defaultLeader: tanaka
    milestones: [Read the sequence, Fit the rate, State the uncertainty, Ready to hand over]
  - id: SAFE
    code: SAFE
    name: Public Safety
    color: '#d35400'
    desc: Cordons, notices and the cost of keeping people out of their own houses.
    defaultLeader: adeyemi
    milestones: [Set the cordon, Tell people why, Weigh the cost, Ready to hand over]

roster:
  - id: okonkwo
    name: Marisol Okonkwo
    role: Structural engineer, Building Safety Coordinator's deputy
    division: STRUCT
    color: '#c0392b'
    bio: >-
      <p>Nineteen years assessing buildings, six of them after earthquakes in three countries. She
      places a building on what the evidence supports and not one step further, and she has been
      overruled enough times to know exactly what it costs when she is right.</p>
      <p>Her rule, said aloud most mornings: a placard is a claim about a building, and a claim you
      cannot trace is a guess wearing a colour.</p>
    quiz:
      - q: Why does Okonkwo refuse to upgrade a placard on a walk-past?
        a: A rapid assessment samples what is visible from outside
        wrong:
          - Rapid assessments are only valid for the first 24 hours after an event
          - A placard cannot legally be changed once it has been fixed to the door
          - Damage always shows on the outside of a building before the inside
  - id: halvorsen
    name: Bram Halvorsen
    role: Emergency manager for the district
    division: SAFE
    color: '#d35400'
    bio: >-
      <p>Ran the response to two floods and a gas main before this. He thinks in what the town
      cannot do without: a hospital with nobody in it, a school that stays shut for a term, a port
      that stops paying wages. He is not careless and he is not in a hurry for its own sake.</p>
      <p>His argument with Okonkwo is the fortnight's argument, and each of them is right on a day
      the other is wrong.</p>
    quiz:
      - q: What does Halvorsen mean when he says an empty hospital has a cost?
        a: Care not given elsewhere is also harm, and it does not appear on any inspection form
        wrong:
          - Empty buildings deteriorate faster than occupied ones do
          - The hospital loses its funding if it is closed for more than a week
          - An empty building cannot be inspected properly while the power is off
  - id: navarro
    name: Elena Navarro
    role: Geotechnical engineer
    division: GEO
    color: '#8e6b2f'
    bio: >-
      <p>She wrote her thesis on the fill under this town, which nobody read at the time and four
      people have asked her for this week. She can tell you which streets were creek in 1910 and it
      turns out those are the streets with sand in them now.</p>
      <p>She is the 1 who keeps saying that the buildings are not the story, the ground is.</p>
    quiz:
      - q: Why does Navarro care which streets were a creek a century ago?
        a: Loose saturated fill in an old channel is where liquefaction shows up
        wrong:
          - Old creek beds are where the water mains were laid and they break first
          - Historical maps are the only record of where the fault runs
          - Buildings on former creek beds are always older and therefore weaker
  - id: ferreira
    name: Duarte Ferreira
    role: Materials engineer, testing laboratory
    division: MAT
    color: '#7d5ba6'
    bio: >-
      <p>He breaks things for a living and is unromantic about it. Cores from a damaged column,
      coupons cut from a brace, a rebound hammer for the cases where nobody will let him cut
      anything: he wants a number with a method attached and treats everything else as an opinion.</p>
      <p>He is patient with people and impatient with round figures nobody can source.</p>
    quiz:
      - q: Why will Ferreira not accept a rebound hammer reading as a strength?
        a: It measures surface hardness, which is a proxy that has to be calibrated against cores
        wrong:
          - The hammer only works on concrete poured within the last five years
          - Rebound readings are affected by the weather and are useless in the rain
          - A hammer test damages the surface and cannot be repeated
  - id: tanaka
    name: Rei Tanaka
    role: Seismologist, hazard and forecasting
    division: HAZ
    color: '#2f8f7a'
    bio: >-
      <p>Fits aftershock sequences for a living and spends most of the week explaining that a
      forecast is a rate and not a promise. She is careful in public and blunt in the room.</p>
      <p>She keeps a printed copy of the sequence taped to the wall, updated by hand, because she
      says people believe a curve they watched being drawn.</p>
    quiz:
      - q: What does Tanaka's aftershock forecast actually state?
        a: A rate of events per day, with a range around it
        wrong:
          - The date on which the sequence will end
          - The magnitude of the next aftershock
          - Which fault segment will move next
  - id: adeyemi
    name: Funmi Adeyemi
    role: Public information officer
    division: SAFE
    color: '#e08a2e'
    bio: >-
      <p>She has to turn everything this office decides into something a person standing in the
      street can act on, in two sentences, without frightening anybody into doing something worse.
      She is the only one who reads the notices aloud before they go out.</p>
      <p>Her test for a notice: what does somebody do differently after reading it?</p>
    quiz:
      - q: What is Adeyemi's test for a public notice?
        a: Whether somebody reading it does something different afterwards
        wrong:
          - Whether it uses only words in common use
          - Whether it has been approved by every agency involved
          - Whether it can be printed on a single side of paper
  - id: cardoso
    name: Inês Cardoso
    role: Network technician, Seismic Network
    division: SEIS
    color: '#2980b9'
    bio: >-
      <p>She maintains the vault on the bench above town and the four field stations below it, which
      means she is the only person who knows that two of them have been running on a clock that
      drifted since spring.</p>
      <p>She is not embarrassed about it. She is the one who found it.</p>
    quiz:
      - q: Why does Cardoso check the vault instrument against a second one?
        a: A single instrument cannot show its own drift
        wrong:
          - Vault instruments are less accurate than field stations
          - Two instruments together record a wider frequency range
          - The vault instrument is only used for large events
  - id: whitcombe
    name: Alan Whitcombe
    role: Assessment engineer, second team
    division: STRUCT
    color: '#a0392b'
    bio: >-
      <p>Came up from the city with the second wave of assessors and has placarded more buildings
      this week than most engineers do in a career. He is fast, and he knows the risk in being fast,
      which is why he writes down what he did not look at.</p>
      <p>The list of what he did not look at is the most useful document in the office.</p>
    quiz:
      - q: Why does Whitcombe keep a second list beside his placards?
        a: A placard says nothing about the parts of a building nobody could get to
        wrong:
          - A second list is required by the standard before a placard can be changed later
          - It records which buildings he expects to collapse in an aftershock
          - Inspectors are rotated, so the next one needs to know who was there
  - id: mbeki
    name: Thandi Mbeki
    role: Geotechnical field technician
    division: GEO
    color: '#9e7a3a'
    bio: >-
      <p>Logs the ground: cone tests where a rig can get in, hand augers where it cannot, and a
      photograph of every sand fan in the Flats with a scale bar in it.</p>
      <p>The photographs are turning into the best record anybody has of what the ground did.</p>
    quiz:
      - q: Why does Mbeki put a scale bar in every photograph?
        a: Without it the picture records that ejecta happened, not how much
        wrong:
          - Photographs taken without a scale bar cannot be entered as evidence at an inquiry
          - The bar keeps the camera at a fixed distance from the ground
          - It marks which photographs were taken after the first aftershock
  - id: sorensen
    name: Kirsten Sørensen
    role: Laboratory technician, Materials & Testing
    division: MAT
    color: '#8b6bb0'
    bio: >-
      <p>Runs the press. Cuts, caps and crushes cores, and keeps the chain of custody that makes the
      result mean anything — which building, which column, which face, which day.</p>
      <p>She has refused two samples this week for arriving without a label.</p>
    quiz:
      - q: Why does Sørensen refuse an unlabelled core?
        a: A strength belongs to one column in one building, and an unlabelled core belongs to none
        wrong:
          - Unlabelled cores dry out on the bench before the press is free to test them
          - The press cannot be calibrated without knowing the concrete's age
          - Regulations require every sample to carry the name of the engineer who cut it
  - id: ives
    name: Peter Ives
    role: Hospital facilities manager
    division: HAZ
    color: '#3a9a84'
    bio: >-
      <p>He has 90 beds, a yellow placard on his front door and no idea when either of those
      changes. He knows his building better than anybody assessing it, and he knows that is not the
      same as being able to say it is safe.</p>
      <p>He is not fighting the process. He is asking it to hurry, precisely.</p>
    quiz:
      - q: Why can Ives not simply declare his own building safe?
        a: Knowing a building well is not the same as having assessed what the earthquake did to it
        wrong:
          - Facilities managers are not permitted to enter a building that carries a yellow placard
          - He has no access to the design drawings for the upper floors
          - A declaration by the occupier would invalidate the insurance
  - id: delacroix
    name: Yvette Delacroix
    role: Ward councillor for the Flats
    division: SAFE
    color: '#d4762a'
    bio: >-
      <p>Represents the half of town that got the worse earthquake and has the smaller houses. She
      turns up to every meeting with a list of who is sleeping where, and she can name the streets
      that have been cordoned longest.</p>
      <p>She is not against the cordons. She wants somebody to say when they end.</p>
    quiz:
      - q: What is Delacroix actually asking the office for?
        a: The condition each stretch of cordon would have to meet to come down
        wrong:
          - A guaranteed date on which every street reopens
          - Compensation for every household still unable to get back into its own house
          - A second opinion from an engineer she chooses herself

glossary:
  - name: Placard
    aliases: [placards, placarded, placarding]
    def: The notice fixed to a building after an inspection — green to enter, yellow for restricted use, red for no entry.
  - name: Epicentre
    aliases: [epicenter]
    def: The point on the surface directly above where the fault started to slip.
  - name: Magnitude
    aliases: [magnitudes]
    def: A single number for the size of an earthquake, on a scale where each unit is about 32 times the energy.
  - name: Intensity
    aliases: []
    def: How strongly the ground shook at one particular place, which differs across a town in one earthquake.
  - name: Liquefaction
    aliases: [liquefied, liquefy]
    def: Wet, loosely packed ground losing its strength while it is shaken, and behaving like a heavy liquid.
  - name: Ejecta
    aliases: [sand boil, sand boils]
    def: Sand and water that reached the surface from below, left as grey fans in the street.
  - name: Fill
    aliases: [hydraulic fill, reclaimed]
    def: Ground that was placed by people rather than laid down by nature, often dredged and pumped into position.
  - name: Bedrock
    aliases: [rock site]
    def: Solid rock beneath the ground surface, which shakes only lightly where loose fill shakes hard.
  - name: Site effect
    aliases: [amplification, amplify, amplified]
    def: Soft ground magnifying shaking, so two places the same distance from an earthquake feel different ones.
  - name: Natural period
    aliases: [fundamental period]
    def: The time a building takes to sway back and forth once when it is pushed and let go.
  - name: Resonance
    aliases: [resonant]
    def: What happens when the ground shakes at close to a building's own natural period, so each push adds to the last.
  - name: Base shear
    aliases: []
    def: The total horizontal force an earthquake applies at the bottom of a building.
  - name: Load path
    aliases: [load paths]
    def: The route a force takes down through a building to the ground; if it stops anywhere, that is where the damage goes.
  - name: Soft storey
    aliases: [soft story, soft-storey]
    def: A floor with much lower stiffness than the storeys above it, usually an open ground floor, which takes all the movement.
  - name: Ductility
    aliases: [ductile, brittle]
    def: A material's ability to bend a long way without breaking, which is what lets a building absorb an earthquake.
  - name: Unreinforced masonry
    aliases: [URM, masonry]
    def: Brick or stone with no steel in it, strong when pressed and weak when pulled sideways.
  - name: Factor of safety
    aliases: [safety factor]
    def: What a part can carry, divided by what was required of it.
  - name: Aftershock
    aliases: [aftershocks]
    def: A smaller earthquake following the main one, on the same fault system, becoming rarer as time passes.
  - name: Cordon
    aliases: [cordoned, cordons]
    def: A boundary keeping people out of an area, and a decision with a cost on both sides of it.

  - name: Fault
    aliases: [faults, fault line]
    def: A break in the rock where the two sides have moved past each other, and can move again.
  - name: Pore pressure
    aliases: [pore water pressure]
    def: Water pressure in the gaps inside the ground, which holds the packed particles apart.
  - name: Loose ground
    aliases: [loose, loosely packed]
    def: Ground that is not tightly packed, so shaking can settle it into a smaller space.
  - name: Saturated
    aliases: [saturation]
    def: Ground in which every gap is already full of water.
  - name: Bearing capacity
    aliases: [bearing]
    def: How much weight the ground can take before it fails under a building.
  - name: Shear
    aliases: [shear force, in shear]
    def: A force that slides one part of a wall or column past the part beside it.
  - name: Capacity
    aliases: [capacities]
    def: How much a part of a building can carry before it fails.
  - name: Demand
    aliases: []
    def: How much the earthquake actually required that part to carry.

missions:
  - title: Two towns, one earthquake
    objective: Work out why the same shaking wrecked one half of Kestrel Bay and spared the other.
    briefing: Upper Town lost its chimneys. The Flats lost its streets. Both are the same distance from the source.
    stake: "Friday, three days after, and nothing about it makes sense yet. Upper Town sits on granite. It lost its chimneys and kept its buildings. The Flats are eleven hundred metres away, on the same fault, with sand in the gutters and a six-storey block leaning over. Marisol Okonkwo will not sign an assessment plan until somebody says why. Today you read the two records side by side, and decide which half of town gets the assessors first."
    takeaway: One earthquake produces as many shakings as there are grounds to shake, and the ground is the difference.
    stops:
      - group: SEIS
        task: Say what the difference between the two records means.
        title: The same event, recorded twice
        place: Seismic Network
        scene: Inês Cardoso has two records of the same earthquake, from stations eleven hundred metres apart. One trace is short and sharp. The other is three times taller and runs half a minute longer.
        assumes:
          - an instrument records the shaking where it stands, not the earthquake itself
        takeaway: A record describes one place, so two records of one earthquake can disagree and both be right.
        format: CHOICE
        question: What does the difference between the two records mean?
        answerText: The Flats record is about three times the rock one, because the ground there is soft fill. Same earthquake, different ground underneath.
        why: The earthquake was one event. What each instrument recorded is what its own ground did. The bench is granite, and granite passes shaking on nearly unchanged. The Flats are soft fill, and soft ground shakes harder and for longer. Here the soft site moved about three times as far as the rock site. That is the ground, not a bigger earthquake under one town. It is also why one number for a whole town is a poor number.
        choices:
          - One instrument is faulty, and its record should go.
          - The soft ground under the Flats shook harder, and for longer.
          - The Flats are closer, so the shaking there was stronger.
          - The Flats record has aftershocks in it that the other station missed.
        answer: The soft ground under the Flats shook harder, and for longer.
        rebuttals:
          - Both instruments checked out against a third sensor this morning. The difference is real.
          - Eleven hundred metres is nothing against a source twenty kilometres away. Distance cannot make it three times bigger.
          - Both records cover the same ninety seconds, and the aftershocks are on separate traces.
      - group: GEO
        task: Match each kind of ground to what it does when it is shaken.
        title: Ground that people put there
        place: Geotechnical
        scene: Elena Navarro, the ground engineer, has an 1892 survey and a photograph from 1948. Where Bay Road runs now there was a tidal creek. The port was pumped into place out of a dredger over four summers.
        assumes:
          - ground can be natural, or it can be put there by people
          - saturated means every gap between the grains is already full of water
        takeaway: Loose, wet, young ground behaves in a way old rock does not.
        format: PROTOCOL
        question: Say what the ground under the Flats is made of
        why: Fill that is pumped in through water lands loose, and it stays full of water. Shake it and the grains try to shuffle closer together. The water in the gaps cannot get out fast enough, so the water takes the load instead of the grains. Grains that are not pressing on each other cannot hold anything up, and the ground behaves like a thick liquid. Old ground has had a hundred centuries to pack down. This has had eighty years.
        rebuttals:
          - Fill dropped through water settles loose and stays wet. That is what pumping it in does to it.
          - The granite bench is neither loose nor wet, so shaking does something else entirely to it.
          - The old creek line holds the loosest, wettest material, which is why the sand fans follow it.
          - Age matters because ground packs down over time, and eighty years is young.
        columns:
          - The ground
          - What it does when it is shaken
        scenarios:
          - Fill pumped in from a dredger in the 1940s.
          - The granite bench under Upper Town.
          - The line of the old tidal creek.
          - Ground that has sat in place for ten thousand years.
        choices:
          - Loose and wet, so shaking packs it and squeezes water out.
          - Stiff and dry, so it passes the shaking on almost unchanged.
          - The loosest and wettest, where the sand came up.
          - Squeezed tight by its own weight over time.
        mapping: [0, 1, 2, 3]
      - group: STRUCT
        task: Spend the six assessor-days, then see which questions the plan can still answer.
        title: Where the first day of assessment goes
        place: Structural Assessment
        scene: Six assessors are free for one day. Four hundred families are waiting on a decision in the Flats. Marina Court and the Parade are already fenced off, and Upper Town is mostly lived in.
        assumes:
          - an inspection queue is a decision, not a list
        takeaway: Spend a team on the questions whose answers can still change what happens today.
        format: ALLOCATE
        question: Can your plan still get the waiting Flats families a decision today, knowing some questions have to wait?
        allocate:
          hint: Drag inspection packages into the six-day pool. The live panel shows which questions the current plan can answer; you do not need to answer every question today.
          pool:
            amount: 6
            unit: assessor-days
            label: Assessment capacity today
          items:
            - id: existing_controls
              label: Existing cordons and closure orders
              cost: 0
              protected: true
            - id: flats
              label: Flats terrace re-occupancy sweep
              cost: 4
            - id: marina
              label: Additional Marina Court documentation
              cost: 2
            - id: upper
              label: Upper Town timber-house follow-up
              cost: 2
            - id: parade
              label: Detailed Parade damage documentation
              cost: 2
          answers:
            - required: true
              requires:
                - flats
              question: Can the waiting Flats households receive an occupancy decision today?
            - required: false
              requires:
                - marina
              question: Can Marina Court be described in more detail today?
            - required: false
              requires:
                - upper
              question: Can the standing Upper Town houses receive an extra follow-up today?
            - required: false
              requires:
                - parade
              question: Can the already-closed Parade be documented in more detail today?
        answerText: Keep at least four assessor-days on the Flats, so the waiting families get a decision today. Spend what is left on one more question. The team cannot buy all four, and the rest wait.
        why: There are six assessor-days and more good work than that. Every inspection bought is another one given up. The Flats sweep can send four hundred families home tonight, or keep them out on purpose. Marina Court and the Parade have fences doing that job already, so more detail there changes little today. Upper Town is useful and not urgent. Buy the answer that can still change what happens.
  - title: The number everybody has already heard
    objective: Pin the magnitude and the location down, and separate them from what people felt.
    briefing: Two agencies published two magnitudes, and the difference is being read as a disagreement.
    stake: "Saturday, and the town has two numbers for the same earthquake. One agency said 6.6 within twenty minutes. Another said 6.8 six hours later. Rei Tanaka can explain the difference to an engineer, and has spent the morning failing to explain it to a radio station. Funmi Adeyemi has to put something in a notice by four. Today you say what the magnitude is, and what it is not."
    takeaway: A magnitude is a measurement with a method attached, and revising it is the method working.
    stops:
      - group: SEIS
        task: Turn the gap between the two arrivals into a distance.
        title: How far away it started
        place: Seismic Network
        scene: The vault trace shows the first wave at 04:12:19 and the strong shaking at 04:12:32. Cardoso wants a distance before anybody draws a circle on a map.
        assumes:
          - the first wave travels faster than the strong shaking that follows it
        takeaway: The gap between the two arrivals grows with distance, so one station gives a distance and three give a place.
        format: BALLPARK
        question: How far away did it start?
        answerText: About a hundred kilometres away. That is a circle drawn round this station, not a spot on the map.
        why: Both waves leave at the same moment, and one of them travels faster. So the gap between them grows the further you are from the source. Close in they arrive almost together. A hundred kilometres away there are thirteen seconds between them. That gap gives a distance, and a distance on its own is a circle round the station. Three stations give three circles, and where they cross is where it started.
        estimate:
          prompt: The first wave arrived at nineteen seconds past, and the strong shaking at thirty-two. Count about eight kilometres for each second between them.
          question: How far away did it start?
          labels:
            - 32 s (strong shaking, seconds past the minute)
            - 19 s (first wave, seconds past the minute)
            - 8 km for each second of the gap
            - 6.8 (the magnitude)
            - 11 km (how deep it started)
          values: [32, 19, 8, 6.8, 11]
          slots: 3
          template: ({0} − {1}) × {2}
          formula: (a-b)*c
          correct: [0, 1, 2]
          target: 104
          tolerance: 12
          units: km
          solution: Thirty-two take away nineteen is thirteen seconds. Thirteen times eight is a hundred and four kilometres.
          explanation: The magnitude and the depth are both real numbers about this earthquake, and neither belongs here. One is how big it was. One is how deep. This is how far.
          givens:
            - The gap between the two arrivals is thirteen seconds
            - Count about eight kilometres for each second of that gap
          relationship: Distance = the gap in seconds × eight kilometres.
      - group: HAZ
        task: Explain what changed between the two magnitudes.
        title: Why the number moved
        place: Hazard & Forecasting
        scene: Tanaka has both bulletins on the desk. The early one used the first stations to report. The later one used the whole network, hours afterwards.
        assumes:
          - a magnitude is worked out from records, so more records can change it
        takeaway: A number that changes means the measurement improved. The event did not change.
        format: CHOICE
        question: The second figure used more stations than the first. What got bigger — the earthquake, or the measurement?
        answerText: The later figure used more stations, and more of each record. A step of 0.2 is about twice the energy. It is a better measurement, not a bigger earthquake.
        why: A magnitude is not read off the ground. It is worked out from what the instruments recorded, so it gets better as more of them report. The first bulletin used the handful of stations that had answered in the first minutes. The later one used the whole network. Going from 6.6 to 6.8 sounds tiny, and it is not. That step means about twice the energy. The earthquake never changed. How much of it had been measured did.
        choices:
          - The earthquake got stronger during the six hours between the bulletins.
          - The later figure used more stations, and more of each record.
          - One agency made a mistake, and it should be corrected in public.
          - The two figures use different scales, so they cannot be compared.
        answer: The later figure used more stations, and more of each record.
        rebuttals:
          - The earthquake was over in under a minute. Nothing about it changed six hours later.
          - Neither agency was wrong. Each said what its own records supported at the time.
          - Both figures are on the same scale, which is exactly why they can be compared.
      - group: SAFE
        task: Put the four parts of the notice in the order they have to be read in.
        title: A notice somebody acts on
        place: Public Safety
        scene: Adeyemi has two hundred words, and a town that has heard two different numbers and a rumour about a bigger one coming.
        assumes:
          - a public notice is read once, quickly, by somebody who is tired
        takeaway: A notice earns its place by changing what somebody does, and everything else in it competes with that.
        format: SEQUENCE
        question: Say it in a way that survives being repeated
        why: People act on the first thing they can use, so the instruction goes at the top. The reason comes next, because a reason is what makes an instruction survive being passed on. The revised number matters to scientists and changes nothing about what to do outside a building. The chance of aftershocks goes last, as a rate. As a rate it stays a chance. As a date it becomes a promise.
        cards:
          - What to do about the building you are standing outside.
          - Why, in one sentence.
          - It went from 6.6 to 6.8, and what that does not mean.
          - The chance of aftershocks, given as a rate for the week.
        order: [0, 1, 2, 3]
  - title: The building that looks worst
    objective: Separate what frightens people from what is actually holding the building up.
    briefing: Marina Court is leaning eight degrees and its structure is undamaged. The queue outside it is not about engineering.
    stake: "Monday, and Marina Court is on the front page. Six storeys of flats leaning over the marina, photographed from the water. That photograph has frightened the town more than anything the office has said. Elena Navarro has been under it. The slab is uncracked and the frame is straight. Okonkwo will not sign the demolition of a sound building on the strength of a photograph. Today you work out what actually failed."
    takeaway: A building can fail without breaking, and the thing that failed may be the ground it stands on.
    stops:
      - group: GEO
        task: Say which explanation fits every observation.
        title: The slab is fine and the building is not
        place: Geotechnical
        scene: "Navarro's survey: the slab is whole and level within itself, and the whole block has tipped. One side is down three hundred and forty millimetres, the other up ninety. Sand fans on the low side."
        assumes:
          - a foundation spreads a building's weight out into the ground
        takeaway: A building can fail without anything in the building breaking.
        format: CHOICE
        question: The slab is whole and level within itself, and the whole block has tipped. Where did the movement happen?
        answerText: The ground gave way under one side and the building went with it. The whole slab and the straight frame are what say the fault is underneath.
        why: Everything here points underneath the building rather than inside it. The slab is whole. The frame is straight. The whole block has tipped like a tray, one edge down and one edge up, with fresh sand pushed up on the low side. That is ground that stopped holding weight. Shake wet fill hard enough and the water takes the load, the grains stop pressing on each other, and one side sinks into it.
        headline: A six-storey block stands eight degrees off upright, with nothing broken inside it.
        readings:
          - zone: Raft foundation
            label: Cracking
            value: none
            status: normal
          - zone: Frame
            label: Out of plumb within itself
            value: 0.1°
            status: normal
          - zone: North edge
            label: Settlement
            value: 340 mm
            status: alarm
          - zone: South edge
            label: Heave
            value: 90 mm
            status: alarm
          - zone: Street
            label: Ejecta
            value: heavy on the north side
            status: alarm
        choices:
          - label: The frame failed, and the lean is damage inside the building.
            mechanism: A frame that gave way on one side would lean this way.
          - label: The ground turned to liquid and stopped holding one side up.
            mechanism: Ground that has gone liquid cannot hold the slab up, so the slab tips into it.
          - label: The slab was built out of level, before the earthquake.
            mechanism: A mistake during building would leave a permanent lean.
          - label: An aftershock hit the building from one side.
            mechanism: One hard shove from one side could push a building over.
        answer: The ground turned to liquid and stopped holding one side up.
        rebuttals:
          - A frame that gave way shows it, and this one is straight to a tenth of a degree.
          - A mistake during building would have been visible for years, and it would not come with fresh sand on the ground.
          - One shove does not drop one edge by three hundred and forty millimetres and lift the other.
      - group: STRUCT
        task: Say what the lean actually costs.
        title: What eight degrees does
        place: Structural Assessment
        scene: Okonkwo has the column loads out. At eight degrees the weight above each column no longer lands over the middle of it. The gap grows the higher you go.
        assumes:
          - a column is built to be pushed straight down, along its own length
        takeaway: A column carrying its load off to one side is doing a job it was not built for.
        format: CHOICE
        question: What is the engineering objection to leaving Marina Court standing?
        answerText: The weight now lands off-centre, so the columns are bent as well as squashed. The frame is undamaged; the job it is being asked to do has changed.
        why: A column is strongest when the weight lands straight down its middle. Lean the building and that weight arrives off to one side, so the column is bent as well as squashed. Bending is the job it was not built for, and the offset grows the further up the building you go. The question is not how frightening eight degrees looks. It is whether those columns have enough left in them for a load path nobody designed.
        choices:
          - The lean will keep growing until the building falls.
          - The weight lands off centre, bending columns built to squash.
          - A leaning building frightens people, and public confidence matters.
          - The frame was weakened by the tipping itself.
        answer: The weight lands off centre, bending columns built to squash.
        rebuttals:
          - The lean stops when the water pressure underneath settles. It is not something that runs away by itself.
          - Frightened people are a real cost, and a reason to explain. They are not what makes a structure unsafe.
          - The frame is undamaged, which is exactly what the survey found.
      - group: SAFE
        task: Spend the five days of investigation on evidence that can change the town-wide decision.
        title: What knocking it down would fix
        place: Public Safety
        scene: The mayor's office wants Marina Court pulled down this week. Delacroix has twelve blocks next to it on the same made ground, and five days before the fence is reviewed.
        assumes:
          - a decision can treat what you can see, or what caused it
        takeaway: The best measurement is the one that could change a decision you have not made yet.
        format: VALUE
        question: Which investigation buys something that helps beyond the one building already fenced off?
        value:
          hint: Open each proposal to see what decision its result could change. The five-day investigation window is fixed, and the current cordon remains in place during the work.
          budget:
            amount: 5
            unit: investigation-days
            label: Investigation window
          decision: Decide whether the ground condition that affected Marina Court also requires action on neighbouring blocks.
          options:
            - id: ground_campaign
              label: CPTs, boreholes and groundwater checks across the Flats corridor
              cost: 3
              axis: extent of susceptible ground
              decisive: true
              reveals: Whether the same loose saturated layers and groundwater conditions continue beneath neighbouring blocks.
            - id: lean_monitor
              label: Increase Marina Court lean monitoring
              cost: 1
              axis: motion of the known building
              decisive: false
              reveals: Whether the already-cordoned building is continuing to rotate or has stabilised over the monitoring window.
            - id: demolition_plan
              label: Advance demolition engineering for Marina Court
              cost: 4
              axis: removal of the known hazard
              decisive: false
              reveals: How the known building could be removed safely, without establishing whether nearby buildings share its ground condition.
            - id: underpin_concept
              label: Develop an underpinning concept for Marina Court alone
              cost: 4
              axis: single-building intervention
              decisive: false
              reveals: How one foundation might be strengthened, without mapping the extent of the underlying susceptible fill.
        answerText: Buy the ground work along the corridor. The fence already holds Marina Court. Only the ground work says whether the twelve blocks beside it stand on the same problem.
        why: Pulling Marina Court down removes the building everybody can see. It says nothing about the ground under the twelve blocks on the same fill. Digging and testing that ground does. The fence already holds the hazard everybody knows about. So the five days are better spent on the question nobody has answered. More readings on one building answer a smaller question than the town is asking.
        evidence: The raft is uncracked and the frame is plumb within itself. 12 blocks stand on the same fill. Demolition would take three weeks and cost about the same as investigating the whole Flats. Nobody is inside the building. The lean has not changed in three days of readings.
  - title: The one everybody assumed was fine
    objective: Look at a green building properly, and find what a walk-past could never see.
    briefing: Bay Road School is green, term starts in a week, and nobody has been inside the gym.
    stake: "Tuesday, and the school is the quiet problem. Bay Road School came through with a green placard, and the district would like four hundred children back next week. Alan Whitcombe placarded it from outside, and wrote that the gymnasium was locked. The gym is a single-storey hall with a long roof and heavy panels for walls. Today you work out what such a hall does in an earthquake, and whether the children go in on Monday."
    takeaway: The dangerous building is often the one nobody looked at, because nothing about it invited a second look.
    stops:
      - group: STRUCT
        task: Build the sideways load path, then name the link that decides whether it holds.
        title: A hall with nothing in the middle
        place: Structural Assessment
        scene: The gym at Bay Road School has a long roof, heavy wall panels and nothing bracing it in the middle. One panel fixing tested badly. Everything big in there looks fine.
        assumes:
          - a sideways push has to travel through a building to reach the ground
        takeaway: A load path works only if every link in it carries the force onward to the ground.
        format: CHAIN
        question: Which link decides whether the panel's push reaches the ground?
        chain:
          hint: Arrange the force transfers from the moving panel to the ground. Then choose the required link whose loss would open the otherwise continuous path.
          distractor: panel_body
          links:
            - id: panel_inertia
              label: Horizontal inertia of the precast panel
              transfers: lateral inertial force within the panel
            - id: panel_tie
              label: Tie between the precast panel and the roof
              transfers: panel force into the roof diaphragm
            - id: roof_diaphragm
              label: Roof diaphragm carrying force toward the end wall
              transfers: collected lateral force across the roof
            - id: end_wall
              label: Resisting end wall or frame
              transfers: roof shear into the vertical lateral system
            - id: foundation
              label: Foundation and ground
              transfers: base shear into the ground
            - id: panel_body
              label: The large precast panel body
              transfers: internal forces within the panel
          order:
            - panel_inertia
            - panel_tie
            - roof_diaphragm
            - end_wall
            - foundation
          governing: panel_tie
        answerText: Panel, fixing, roof, end wall, ground. The fixing at the top of the panel governs it. If that lets go, nothing bigger downstream can collect the panel's push.
        why: A shaking building throws its own weight sideways, and that push has to get to the ground. From the panel it goes into the fixing at the top. Then into the roof, along to a wall that can take it, and down. Every step has to hold. The panel is heavy and the roof is big, and neither matters if the small fixing between them lets go. Size is not strength when a link is missing.
      - group: MAT
        task: Compare what the fixings carried with what the wall asks of them.
        title: What the tested fixings actually carried
        place: Materials & Testing
        scene: Kirsten Sørensen has pulled two fixings out of a spare panel in the yard. The drawing says forty kilonewtons each. The first came out at twenty-four, the second at twenty-seven.
        assumes:
          - a number on a drawing is a claim, and a test is a check on it
        takeaway: Two tests can show something is short. They cannot show a building is safe.
        format: BALLPARK
        question: How does what the fixings carried compare with what is asked of them?
        answerText: About eight tenths of what the wall asks — short, and from only two tests.
        why: Two fixings were pulled. They averaged twenty-five and a half kilonewtons against thirty-one asked of them. So what was measured is about eight tenths of what is needed. That is short. It is also only two of them, and two is not enough to know how much the rest vary. None of that has to be settled before acting. Keep people out of the gym, test enough fixings to mean something, and design the repair.
        estimate:
          prompt: The two fixings pulled out at twenty-four and twenty-seven kilonewtons. The wall asks about thirty-one kilonewtons of each of them.
          question: How does what they carried compare with what is asked of them?
          labels:
            - 25.5 kN (average of the two tests)
            - 31 kN (what the wall asks of each)
            - 40 kN (what the drawing promised)
            - 34 m (how far the roof spans)
            - 8 (panels on this wall)
          values: [25.5, 31, 40, 34, 8]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 0.82
          tolerance: 0.12
          units: (ratio)
          solution: Twenty-four and twenty-seven average twenty-five and a half. That divided by thirty-one is about 0.8.
          explanation: About eight tenths, which is under one. Two pulls do not settle the building. They settle whether this is worth acting on today.
          givens:
            - The two fixings averaged 25.5 kilonewtons
            - The wall asks about 31 kilonewtons of each
          relationship: Compare = the average tested ÷ what is asked.
      - group: SAFE
        task: Say what happens to the school on Monday.
        title: Four hundred children on Monday
        place: Public Safety
        scene: Four hundred children are due back Monday. The classrooms are sound and the gym is not. Bram Halvorsen, who runs the district's emergency work, has parents calling, and there is no spare school to move anybody to.
        assumes:
          - a building can be used in part
        takeaway: The question is which parts can be used, not whether the site is open or shut.
        format: CHOICE
        question: What should happen to Bay Road School on Monday?
        why: The fault is in one room, so the decision belongs to rooms rather than to the site. The classrooms have nothing wrong with them. The gym has heavy panels held on by fixings that tested below what the wall asks. If children can reach the classrooms without passing under those panels, the classrooms open and the gym stays shut. If the routes cross, that gets fixed first. Part-open is not optimism. It is a fence round the actual fault.
        choices:
          - Open the whole site, because the placard is green.
          - Open the classrooms and shut the gym until the fixings are repaired.
          - Shut the site until every building has been looked at.
          - Open the site, and hold every class in the gym.
        answer: Open the classrooms and shut the gym until the fixings are repaired.
        rebuttals:
          - The green placard covered what could be seen from outside, and the gym was locked that day.
          - Shutting the classrooms protects nobody. There is nothing wrong with them.
          - The gym is the worst room on the site, not the safest. Its walls hang on the fixings that tested short.
  - title: The hospital, and what waiting costs
    objective: Resolve a yellow placard on the one building the district cannot do without.
    briefing: 90 patients, 3 days of yellow, and an argument about whether more evidence is worth more time.
    stake: "Wednesday, and the hospital has been yellow for four days. Peter Ives has ninety patients on the ground floor and two empty floors above them. Surgery is being done sixty kilometres away. Okonkwo wants the plant room opened and the walls cored before she signs. Bram Halvorsen says every day of that is a day of care nobody gets, and this morning he is right. Today you work out what is really unsettled, and what waiting costs."
    takeaway: Gathering more evidence is not free, and evidence that cannot change the decision costs without buying anything.
    stops:
      - group: STRUCT
        task: Check what is behind each record, then spend the one visit before the placard review.
        title: The part nobody has seen
        place: Structural Assessment
        scene: Ninety patients are still on the ground floor, and two floors above them stand empty. The hospital has been yellow for three days. The roof plant room is locked, with two full water tanks in it.
        assumes:
          - a building's parts can be cleared one at a time
          - a signature says somebody approved it, not that somebody looked
        takeaway: A signed record is worth whatever the looking behind it was worth.
        format: ATTEST
        question: Which claim still needs somebody to go and look?
        attest:
          hint: Open the backing attached to each claim before spending the visit. You have one direct verification before the placard review.
          checks: 1
          checkUnit: direct verification visit
          claims:
            - id: frame
              label: The reinforced-concrete frame has no observed condition requiring the current restriction
              critical: true
              backed: true
              evidence: Three days of frame inspection on all accessible floors.
            - id: cladding
              label: The external cladding does not present the unresolved structural issue
              critical: false
              backed: true
              evidence: Cladding inspection completed on day two.
            - id: stairs
              label: The main stair and egress route are usable for the proposed occupancy
              critical: true
              backed: true
              evidence: The stair core was directly inspected because it is the main escape route.
            - id: plant_room
              label: The roof water-tank restraints are adequate for the proposed occupancy
              critical: true
              backed: false
              evidence: No direct observation; the roof plant room remains unvisited.
        answerText: Go to the roof plant room. The frame, cladding and stairs already have somebody's eyes behind them. The full tanks and their fixings are what nobody has seen, and that is what holds the review open.
        why: A yellow placard should shrink to the specific things nobody has settled. The frame, the cladding and the stair have all been looked at, and there are notes to prove it. The roof plant room has not. Two full water tanks sit high in the building, and nobody has seen what holds them down. There is one visit left. Spending it on something already checked leaves the unchecked claim holding the review open.
      - group: HAZ
        task: Put the cost of waiting into the same units as the risk.
        title: What four more days buys
        place: Hazard & Forecasting
        scene: Tanaka has the aftershock rate for the week, and the hospital transfer log beside it. The office wants both stated as what they cost, rather than as principles. The board meets on Friday.
        assumes:
          - waiting has consequences, and they can be counted
        takeaway: Waiting is a decision, and it has to be compared with the decision to act now.
        format: CHOICE
        question: Four more days would sharpen the number. What does the waiting cost while it does?
        why: Both choices have a cost, and both can be counted. Waiting means transfers, delayed care and a hospital running short. Testing is worth it when it has a real chance of changing the answer. Here the frame has been looked at already, and the thing nobody has settled is a locked plant room with heavy tanks in it. Four days of coring answers a different question. Ask what the evidence could change, and who pays while it is collected.
        choices:
          - Evidence comes first, and the delay is not your problem.
          - Against what the waiting costs, and what the evidence could change.
          - By the aftershock forecast alone, as the placard says.
          - By what the hospital's managers want, since they carry the day-to-day risk.
        answer: Against what the waiting costs, and what the evidence could change.
        rebuttals:
          - Evidence first is a good instinct and not a rule. The question is what this evidence could change.
          - The forecast speaks to the hazard and says nothing about what an empty hospital costs.
          - Managers carry the day-to-day risk, and they do not get to set the engineering standard.
      - group: SEIS
        task: Say what the basement record can and cannot settle.
        title: The instrument in the basement
        place: Seismic Network
        scene: There is an instrument in the hospital basement, fitted in 1998 and never needed until now. Cardoso has its record. It peaked at 0.31 g. The building was designed for 0.35.
        assumes:
          - an instrument inside a building measures the shaking that building got
        takeaway: A record of what happened is evidence, and it is never a line under which damage is impossible.
        format: CHOICE
        question: What can the basement record honestly add to the assessment?
        why: The record takes the biggest unknown away. The ground under this building peaked at 0.31 g, and it was built for 0.35. That is worth a lot, and it is not a line under which nothing breaks. What a building feels also depends on which rhythms arrived and how long they lasted. So the record says the shaking was not obviously past the design. It says nothing about the tanks nobody has seen.
        choices:
          - It is undamaged, since the shaking stayed under the design figure.
          - That this building felt a little less than it was built for.
          - That the design figure was too low and should be raised.
          - That no more inspection is needed anywhere in the building.
        answer: That this building felt a little less than it was built for.
        rebuttals:
          - Staying under a design figure makes damage less likely. It does not prove there is none.
          - One record from one earthquake is not grounds to change a design standard.
          - The plant room is still locked, so the inspection is not finished.
  - title: The material, and what it can still carry
    objective: Get a number for the strength of a damaged building instead of an opinion.
    briefing: The library's columns look cracked. Nobody has said what they can still hold.
    stake: "Friday, and the argument has moved from buildings to numbers. The library is a concrete frame from the 1970s, with cracks running diagonally through three ground-floor columns. Three engineers have called them moderate, serious and superficial. Duarte Ferreira points out that none of those is a number, and his lab can give one in a day. Today you turn a sample into a strength, and say what the building may be used for meanwhile."
    takeaway: A word like serious is an opinion; a strength with a method behind it is something the next engineer can use.
    stops:
      - group: MAT
        task: Say what the four crushed cores actually support.
        title: A number, with a method attached
        place: Materials & Testing
        scene: "Four cores, cut from the cracked columns. Sørensen crushes them: twenty-eight, thirty-one, twenty-four and thirty megapascals. The 1974 drawing asks for twenty-five."
        assumes:
          - concrete strength is measured by crushing a sample of it
        takeaway: A test tells you about the concrete. It does not tell you about the column.
        format: CHOICE
        question: The drawing asks for twenty-five, and the lowest core came out at twenty-four. What does that tell you about the concrete?
        why: The four cores average close to what the drawing asked for, so weak concrete is not the story. That is worth knowing, and it is not the answer. Crushing a cylinder measures the material. It does not measure what the column went through, how much steel is inside it, or how well that steel wraps the concrete. The cores narrow the question. Somebody still has to work out what the column can carry now.
        choices:
          - That the columns are undamaged, since the concrete beats what was specified.
          - It is as strong as the design assumed, and no stronger.
          - The design was too careful, and the building is over-strong.
          - That the cracking must have come from something other than the earthquake.
        answer: It is as strong as the design assumed, and no stronger.
        rebuttals:
          - Cracking is something you see in the structure. A crushed core says nothing about it either way.
          - One building's concrete beating its specification says nothing about whether the design was careful.
          - Cracks running diagonally in a ground-floor column during an earthquake have an obvious cause.
      - group: STRUCT
        task: Say which explanation fits the pattern.
        title: Which way the cracks run
        place: Structural Assessment
        scene: The cracks run diagonally, both ways, crossing in an X across the middle of each column. They are fine, there are many, and they sit evenly apart.
        assumes:
          - a crack opens across the direction something is being pulled apart
        takeaway: A pattern can point at the cause. It cannot tell you what is left.
        format: CHOICE
        question: The cracks cross in an X on every column. What kind of movement makes that shape?
        why: Concrete cracks across whatever is pulling it apart. Push a column sideways and the pull runs on a diagonal, so the crack opens on a diagonal. Push it back and a second diagonal opens, crossing the first. That X is the mark of shaking, not of weight or of slow settling. Many fine cracks rather than one big one also says the steel inside is working. It does not say how much is left.
        headline: Fine diagonal cracks cross both ways across three ground-floor columns.
        readings:
          - zone: Column A
            label: Crack direction
            value: diagonal both ways
            status: alarm
          - zone: Column A
            label: Crack width
            value: 0.3 mm
            status: normal
          - zone: Column B
            label: Cover concrete
            value: intact
            status: normal
          - zone: Column C
            label: Crack spacing
            value: even, 120 mm
            status: normal
          - zone: Core sample
            label: Strength
            value: 28 MPa
            status: normal
        choices:
          - label: Being pushed side to side, first one way and then the other.
            mechanism: A push one way and then back opens cracks running both ways.
          - label: Too much weight pressing straight down.
            mechanism: Too much weight crushes concrete and bursts the outer layer off.
          - label: The foundation settling slowly over years.
            mechanism: Settling bends a frame slowly, and in one direction.
          - label: Poor concrete.
            mechanism: Weak material cracks under everyday loads.
        answer: Being pushed side to side, first one way and then the other.
        rebuttals:
          - Crushing pushes the outer layer of concrete off, and the cover here is untouched.
          - Settling works slowly and one way. It does not open crossed diagonals.
          - The cores came back above what was specified, so weak material is not it.
      - group: SAFE
        task: Put the four steps in the order they have to happen.
        title: Part of a building, for part of a purpose
        place: Public Safety
        scene: Monday's public meeting has two hundred people booked. There is no other hall big enough. Three ground-floor columns in the library are cracked.
        assumes:
          - use can be limited by how many people, by which rooms, and for how long
        takeaway: Restricted use is a real answer between open and shut, and it has to say what it is protecting against.
        format: SEQUENCE
        question: Decide what the building may be used for meanwhile
        why: Part-use is an engineering line, not a hopeful label. Propping comes first, because it changes what the building can carry. A number on the door comes next. A limit nobody can count is not a limit. A review date comes after that, or the restriction quietly turns permanent and stops being believed. Only then is the meeting a yes or a no.
        cards:
          - Prop the three cracked columns, to take weight off them.
          - Set a limit on numbers, and put it on the door.
          - Put a review date on the limit, so it ends.
          - Decide whether Monday's meeting can be held in the building.
        order: [0, 1, 2, 3]
  - title: The cordon nobody can lift
    objective: Weigh what a cordon protects against what it costs the people inside it.
    briefing: 11 streets have been closed for 6 days, and the reason is now 3 different reasons.
    stake: "Saturday, and the fence around the Flats is a week old. It went up on day one for falling masonry. It stayed on day three for the gas main. It is still up because nobody has said it can come down. Yvette Delacroix has four hundred families, sixty of them sleeping in the sports hall, and one question. What has to be true before people can go home? Today you find what each stretch of fence is really holding back."
    takeaway: A cordon is a decision that is remade every day, and one kept out of habit is a decision nobody is making.
    stops:

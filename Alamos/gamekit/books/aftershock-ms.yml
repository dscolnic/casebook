        task: Build the sideways load path, then name the link that decides whether it holds.
        title: A hall with nothing in the middle
        place: Structural Assessment
        scene: The gym at Bay Road School has a long roof, heavy wall panels and nothing bracing it in the middle. One panel fixing tested badly. Everything big in there looks fine.
        guide: >-
          Put the handovers in the order the sideways push really travels, from the
          moving panel to the ground. Then name the one required handover that would
          break the path if it failed. The biggest part is not the answer. A path is
          only as good as its weakest handover, and the readings on each link tell you
          which one that is.
        background:
          - >-
              What is being handed on. In an earthquake the ground moves and the building's
              mass wants to stay put. That push has to be carried by something, passed
              along, and finally delivered to the foundation. Each pass is a fixing or a
              member. If one of them cannot carry its share, the path stops there.

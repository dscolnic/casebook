        answerText: Keep the checks on the propped buildings yourself. Send the utility liaison to shut the main now. Give the school message to the desk. Every handover gets an owner, a first move and a number.
        why: The burst main is still making the ground worse. So it gets stopped first, and stopping it belongs to the utility rather than to you. The 5.1 is over, and nobody knows what it did to the propped buildings. That is the judgement nobody else here can make, so you keep it. The school decision is settled and only needs saying. Three at once is not a queue. It is a split.
      - group: GEO
        task: Say why the burst main matters more here than uphill.
        title: Wetting ground that has already failed
        concept: Wet sandy ground can behave like a liquid when it is shaken
        place: Geotechnical
        scene: Mbeki is on Ferry Street with a standpipe. The water under the road has risen three quarters of a metre since the main went. The surface is soft underfoot again.
        guide: >-
          Four options for why a burst main matters more here. They differ in the
          reason. The pipes? The water pressure between the grains? Washing? The
          material itself? Ask of each whether it would also be true on granite. The
          leak on its own turns nothing to liquid. And the aftershocks have not
          finished.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - ground can only go liquid if it is full of water
        takeaway: Wetting loose ground uses up the margin it had before the next shake.
        format: CHOICE
        question: Why does the burst main matter more here than it would in Upper Town?
        why: Ground holds things up because the grains press on each other. Water in the gaps carries some of the load instead. The more water there is, the less the grains carry. Loose wet fill is already near the edge, and a burst main pushes it closer before any shaking starts. The leak alone will not make it go liquid. It means a smaller shake will.
        choices:
          - Because the Flats have older pipes, and more of them will burst.
          - More water in loose fill raises the pressure before shaking.
          - The water washes away the sand that came up before.
          - Because the fill will dissolve if it stays wet long enough.
        answer: More water in loose fill raises the pressure before shaking.
        rebuttals:
          - Pipe age explains why it burst, and not why it matters more on this ground.
          - Moving sand about is a nuisance. The water pressure is the part that matters.
          - Sand does not dissolve, and the fill is not going anywhere. Its strength is the problem.
      - group: STRUCT
        task: Say what the new cracks tell the office.
        title: A smaller shake against a weaker building
        concept: "Materials: what a crack means, and what a strength test can tell you"
        place: Structural Assessment
        scene: The 5.1 shook the Flats about a tenth as hard as the first earthquake. Eleven buildings have been propped since Friday, and two of them have new cracks this afternoon.
        guide: >-
          Work out how much wall each metre of footing is holding up. Take the whole weight
          the wall puts down and share it along the length the footing runs. One tile is the
          height of the wall, which is part of why it is heavy and not part of this sum.
        background:
          - >-
              Why per metre. A footing does not carry the weight in one place. It carries it spread
              along its whole length, so what matters is how much each metre has to hold, and that is
              the total shared out.
          - >-
              Why the new cracks matter so much. This shake was about a tenth as hard as the first
              one. A building that cracks under a tenth of what it already survived is not being
              hit harder — it is holding less.
          - >-
              What a prop does. It takes some of the load off, which is why the props went in on
              Friday. It does not put strength back into the wall, so the wall is still carrying
              what is left and still losing a little each time.
        assumes:
          - a propped building is being held up, not repaired
        takeaway: A small shake that still does damage is telling you how little the building has left.
        format: BALLPARK
        question: How much weight is each metre of the footing holding?
        answerText: About 54 kilonewtons per metre — 650 shared along 12 metres. The wall was built for about 90, so it still has room, and cracking under a tenth of Friday's shake means it is losing what it had.
        why: A footing carries its load spread along its length, so the number that matters is the load on each metre: total weight ÷ length. This wall puts 650 kilonewtons down along 12 metres of footing, which is 650 ÷ 12 ≈ 54 kilonewtons per metre. The wall was built to carry about 90, so on paper it has room. That is what makes the new cracks the important thing in the room. Today's shake was about a tenth as hard as the one on Friday, and a wall that cracks under a tenth of what it already stood up to is not being pushed harder — it is holding less than it was. The props help by taking some of the load off. They do not put strength back, so the wall keeps carrying what is left, and each shake takes a little more.
        estimate:
          prompt: The wall puts 650 kilonewtons down onto a footing 12 metres long. It was built to carry about 90 kilonewtons on each metre.
          question: Choose the total weight and the length it is shared along.
          labels:
            - 650  (the whole weight the wall puts down, in kN)
            - 12  (the length of the footing, in m)
            - 90  (what each metre was built to carry, in kN)
            - 6  (the height of the wall, in m)
          values: [650, 12, 90, 6]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 54
          tolerance: 4
          units: kilonewtons on each metre
          solution: 650 ÷ 12 ≈ 54 kilonewtons per metre, against about 90 it was built for.
          explanation: There is room on paper. Cracking under a tenth of Friday's shake says the wall is holding less than it was.
          givens:
            - the wall puts 650 kN down along 12 m of footing
            - each metre was built to carry about 90 kN
          relationship: Load on each metre = total weight ÷ length. A footing carries its load spread along it, not in one place.
      - group: SAFE
        task: Send the teams where the rule says.
        title: What the teams are being sent to
        concept: "Deciding with a cordon: how likely, and how bad, against what it costs people"
        place: Assessment Office
        scene: More buildings are waiting than the teams can reach. The office works to one priority. Marisol Okonkwo changes it as the fortnight goes on, and nobody announces it.
        guide: >-
          Send teams to what the priority asks for and leave the rest waiting. The priority
          on the office board changes during the day. What counts is the buildings either
          side of a change, because they show whether you are reading the board.
        background:
          - >-
              Why the priority changes. It starts with buildings people are living in. After an
              aftershock it becomes anything already marked yellow, because those have less strength
              left. When the schools ask, it becomes schools.
          - >-
              Why the change is where it goes wrong. A team sent under the old priority spends half a
              day on a building nobody is waiting for, and the one that mattered waits another night
              with people inside.
        assumes:
          - somebody decides which buildings are checked first
        takeaway: The cost of a rule that has changed is paid by whoever is still using the old one.
        format: SPOT
        question: Send teams to the priority on the board, and keep checking the board.
        answerText: Read the board, not the queue. Every change leaves an hour when the old priority still looks right.
        why: >-
          Three priorities run across the fortnight. Buildings people are in, then buildings
          already marked yellow, then schools. A building can match two at once, and that is
          what makes a change cost something real. What the panel scores is the buildings either
          side of a change. Most of the queue is wanted by neither priority, so leaving those
          waiting proves nothing. The office's own version of this is the hour after an
          aftershock. The priority has changed to the yellow placards, because their strength
          has just dropped again, and the teams already in the vans are driving to the list
          from before the shake.
        spot:
          duration: 40
          switchEvery: 12
          pass: 0.75
          hint: The priority is on the office board and changes without warning.
          targets:
            - id: b1
              label: Flats, people inside
              tags: [occupied]
            - id: b2
              label: Yellow placard, empty
              tags: [yellow]
            - id: b3
              label: School, in use
              tags: [school, occupied]
            - id: b4
              label: Yellow placard, occupied
              tags: [yellow, occupied]
            - id: b5
              label: Warehouse, empty
              tags: [empty]
            - id: b6
              label: School, closed
              tags: [school]
            - id: b7
              label: Shops, empty
              tags: [empty]
            - id: b8
              label: Church hall, yellow
              tags: [yellow]
          rules:
            - say: Anywhere people are living
              want: [occupied]
            - say: Anything already yellow
              want: [yellow]
            - say: Any school
              want: [school]
          commit: Open the queue

  - title: What we know, and how well
    objective: State the fortnight's findings at the confidence each one has earned.
    briefing: The report goes out today, and it has to say which of its findings are measurements and which are judgements.
    stake: "Friday, two weeks on, and the fortnight goes into a report. Marisol Okonkwo will not sign one that states everything with the same confidence. A reader who cannot tell a measurement from a guess will act on both the same way. Rei Tanaka wants her forecast written as a range. Today you sort the findings by the evidence under them, and say what should outlive the emergency."
    takeaway: A finding is worth what its evidence is worth, and saying so is what makes a report usable a year later.
    stops:
      - group: SEIS
        task: Sort the four findings by the evidence under them.
        title: Measured, worked out, or guessed
        concept: Saying what you know and what you do not
        place: Seismic Network
        scene: Cardoso lays out four statements from the fortnight. The office believes all four. They are not believed for the same reasons, and she will not let them into the report as equals.
        guide: >-
          Four statements the office believes, believed for four different reasons. Sort
          them by what somebody would have to produce to argue back. A second log?
          Another earthquake? A hole dug under the slab? Believing them is not the
          difference. The weakest of the four is the one the plan rests on, and the
          report has to say so.
        background:
          - >-
              Why a clue needs an explanation and not a name. Saying what a clue is called
              is not saying what produced it. The board makes you commit to a cause, and a
              cause has to account for that clue and not for the one next to it. That is the
              difference between recognising something and explaining it.
          - >-
              How to use the one-each rule. Every explanation goes with exactly one clue. So
              the pairs you are sure about are worth more than themselves — each one you
              settle leaves fewer explanations for the clues you are unsure of. Two you
              trust can decide the other two.
          - >-
              Why one wrong line is impossible. If three lines are right, the last
              explanation has nowhere else to go, so it is right too. Being wrong always
              means two are wrong at once. When a join feels forced, look again at one you
              made early and stopped questioning.
        assumes:
          - a claim can rest on a measurement, on reasoning, or on nothing much yet
        takeaway: Sorting findings by their evidence is what lets the next reader know which one to check first.
        format: CASEBOOK
        question: Sort the findings by their evidence
        why: These four are believed for four different reasons, and the report should say which. The vault error was dug up, logged, and checked against another station for five days. The hospital's number came from its own basement, once. Marina Court's cause is good reasoning from a survey, with nobody having dug under the slab. The last one is a guess about the future. Saying so does not weaken the report.
        rebuttals:
          - The vault error has a trench log and five days of side-by-side recording behind it.
          - The hospital's number came from an instrument in its own basement, for one earthquake.
          - Marina Court's cause is sound reasoning from a survey, with no hole dug under the slab.
          - How the fill behaves next time is a projection, and it is the weakest claim here.
        columns:
          - The finding
          - How strongly it is held
        scenarios:
          - The reference vault sits on weathered granite, not solid rock.
          - The hospital felt 0.31 g at its base.
          - The Flats will shake about five times as hard next time.
        choices:
          - Settled. A 1998 trench log, and five days of side-by-side records.
          - Measured once, at one building, for one earthquake.
          - A projection — the weakest claim, and the one the plan uses.
        mapping: [0, 1, 2]
      - group: HAZ
        task: Say why the forecast goes in as a range.
        title: The number that has to be a range
        concept: Aftershocks get rarer as time passes, and a chance is not a promise
        place: Hazard & Forecasting
        scene: Tanaka's aftershock forecast goes into the report. She wants the range in the sentence. Okonkwo wants to know what the range is for. The staffing appendix waits on the wording.
        guide: >-
          Four reasons to publish a range, and they differ in who it is for. Ask of each
          whether it is about being careful, being honest, being safe from blame, or
          planning. Nobody staffs an emergency for an average week. One number says
          nothing about how bad the bad week could be. The staffing appendix waits on
          this wording.
        background:
          - >-
              Why the wrong answers are worth reading. Each one is written to look right to
              somebody who made a particular mistake. Working out which mistake each one
              belongs to is most of the learning in this format — more than getting the
              right one, which you can sometimes do by feel.
          - >-
              Why sounding careful is not the same as being right. A long answer with a lot
              of detail in it feels safer, and it is easy to write one that is still wrong.
              The check that builds these questions measures option length across the whole
              game so the longest one is not the answer more often than chance. Reading is
              the only way through.
          - >-
              What the verdict adds. After you answer, the verdict says why each wrong
              option is wrong, in its own words. That is written for the reader who picked
              it. Read it even when you were right, because being right for a shaky reason
              is the thing that catches up with you two stops later.
        assumes:
          - a forecast covers a spread of outcomes, not just one
        takeaway: A forecast with no range cannot size a decision, because the decision is sized against the range.
        format: CHOICE
        question: Why does the forecast go in as a range rather than one number?
        why: Nobody staffs an emergency for an average week. They staff it for a bad one, and how bad is exactly what the range says. Give a planner one number and they invent a margin themselves, usually too small. The range is also the honest half of the forecast. It says which part of the behaviour four hundred recorded aftershocks pin down well, and which part they do not. One number hides both.
        choices:
          - A range is more careful, and careful is right here.
          - Because people plan against the bad end, and one number deletes it.
          - The model cannot honestly give one number yet.
          - Because a range cannot be shown to be wrong afterwards.
        answer: Because people plan against the bad end, and one number deletes it.
        rebuttals:
          - Care is not the reason. The range is a number the staffing sum actually needs.
          - How good the model is, is what the range states. That is the opposite of hiding it.
          - A range can be shown to be wrong. Outcomes outside it count against the model.
      - group: STRUCT
        task: Choose the practice worth keeping when nothing is happening.
        title: What outlives the emergency
        place: Structural Assessment
        scene: Four things the office started doing under pressure. Okonkwo asks which is worth its cost on an ordinary Tuesday, when nothing has happened.
        guide: >-
          All four practices are good ones. Two questions separate them. Does it stop
          the thing that actually went wrong? And will the office still do it in a quiet
          month? Trace each back to the mechanism. The gym, the roof room and the
          basement were all outside the first inspection. All three were written down,
          and nobody acted.
        background:
          - >-
              Why first is a different question from best. When there is more than one call
              on the same hour, the value of doing something now is not how much it matters.
              It is how much is lost by doing it later. Something important that will be
              just as fixable in an hour can wait. Something small that will not be fixable
              can not.
          - >-
              What to look for in the options. Ask which one changes if you wait — a reading
              that is still moving, a person who is getting worse, a window that closes.
              Then ask which ones can only be done after something else. Those two questions
              usually leave one option standing.
          - >-
              Why only one answer is marked. Real shifts do all of these, in some order. The
              stop asks for the front of that order because that is the only part where the
              reasoning shows. Read the verdict afterwards even when you are right — it says
              what the others were waiting on, which is the rest of the answer.
        assumes:
          - a habit taken up in an emergency has a cost that only shows later
        takeaway: An unknown gets safer only when it has an owner, a date, and a rule that stops it being forgotten.
        format: TRIAGE
        question: Which practice would most directly stop this happening again?
        why: A habit worth keeping catches the mistakes that keep happening, at a price the office will still pay in a quiet year. The gym, the plant room and the Ferry Street basement were all outside what anybody looked at. In every case somebody knew. Writing that list down, and giving it an owner, would have caught all three. A rule nobody keeps is worse than no rule.
        choices:
          - On every inspection, write down what nobody could see.
          - Two engineers on every placard, which halves how many buildings get cleared.
          - A daily public meeting, which took two hours out of every afternoon.
          - Re-inspect every propped building after any aftershock above magnitude 4.
        answer: On every inspection, write down what nobody could see.
        rebuttals:
          - Doubling up halves how many buildings get cleared in a day, for a mistake rate nobody has measured.
          - A daily meeting was right during the emergency, and no office keeps that up for years.
          - A rule that fires on every magnitude 4 gets dropped in the first quiet year, which is worse than no rule.
# --------------------------------------------------------------- the warm-ups
warmups:
  trial-near:
    title: Walk Upper Town before you place a single notice
    why: >-
      Three days after the earthquake, and you have not been here before. Walk the near
      buildings once on foot. Nothing gets a notice from a map, and the streets on the plan card
      mean nothing until you have seen which way the ground falls.
  greet:
    title: Two teams in one office, and nobody has been introduced
    why: >-
      Half the office is from the council and half arrived on Saturday. By Friday somebody has
      to trust somebody else's check. Put a name to as many of them as you can now, because a signature you
      cannot picture is one you will check twice.
  trial-far:
    title: The Flats open today, and the van comes out
    why: >-
      Everything across the scarp has been walkable all week, and none of it has been called.
      That changes today. The fill, the wharf and Ferry Street go on the list, and they are far
      enough out that the van is signed out. Drive it once first.
  follow:
    title: Mbeki walks the line where the ground changes
    why: >-
      The line between the hard rock and the soft fill is not on any map closely enough to use.
      Mbeki, the geotechnical field technician, can see it in the ground. She walks it once this
      morning. Stay with her, and watch where she stops.
  hunt:
    title: Six props went out, and the log has four
    item: { name: prop, plural: props }
    why: >-
      Every temporary prop has to be found before the fence comes in. A prop nobody can find is
      either holding something up or lying in a street where a lorry will hit it. Four are where
      the log says.
  canvass:
    title: Who slept in their own bed last night
    why: >-
      The numbers the office is using came from Saturday, and they decide which buildings get
      checked first. Ask along the streets until enough answers have come back to say who went
      to the hall and who came home.
  evade:
    title: The builder who wants a green notice in the car park
    why: >-
      He has been outside since eight wanting somebody to say Marina Court is fine. Nothing is
      agreed anywhere except on the form. Keep clear of him and get your round done.
  tag:
    title: Catch Ives before the hospital handover
    why: >-
      Ives, the hospital facilities manager, has the only plan with the yellow rooms marked on
      it, and he is walking back for the ten o'clock handover. After that he is on a ward round
      for four hours, and this afternoon's decision needs that drawing.

copy:
  SEIS: <p>The vault, cut into the bench above town. Concrete, a locked hatch, and the instrument every comparison this fortnight has been made against.</p>
  STRUCT: <p>Assessment. Forms on every surface, a plan of the town with 400 coloured dots on it, and a queue outside that starts before the door opens.</p>
  GEO: <p>Geotechnical. Boxes of core, a hand auger against the wall, and an 1892 survey showing where the creek used to run.</p>
  MAT: <p>The testing laboratory. A press, a saw, and a chain of custody that means the number belongs to a particular column in a particular building.</p>
  HAZ: <p>The incident base, on the boundary between the two halves of town. The aftershock sequence is taped to the wall and updated by hand, because people believe a curve they watched being drawn.</p>
  SAFE: <p>Public safety. Cordon tape, printed notices, and the list of who is sleeping where.</p>
  HOSP: <p>Kestrel Bay Hospital. 90 patients on the ground floor, 2 upper floors closed, and a yellow placard nobody has been able to resolve.</p>
  SCHOOL: <p>Bay Road School. Green placard, undamaged classrooms, and a gymnasium whose wall panels are held on by anchors that tested below demand.</p>
  PARADE: <p>The Parade. 1890s shopfronts with their parapets in the street and timber shores holding the façades in.</p>
  DEPOT: <p>The port gate. The quay moved two metres seaward and the cranes have not turned since.</p>

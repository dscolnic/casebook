copy:
  PLOT: <p>The plot shelter, at the head of the trial beds. A bench out of the sun, the bed book on a hook, and two hundred and fifty numbered beds running away from the door.</p>
  GLASS: <p>The glasshouse, across the walk. Forceps, a box of muslin bags, a tray of stakes, and rows of pots with a flower opened on nearly every one.</p>
  COUNT: <p>The counting room, forty metres down the walk. Sorting trays, a ledger ruled into four columns, and nothing growing anywhere in it.</p>
  STORE: <p>The seed store at the far end. Bins along both walls, every line labelled twice, and a scoop hanging on a nail beside the door.</p>
  GATE: <p>The gate house at the entrance. The garden book everybody signs, and a key board with more keys than doors.</p>
  BEES: <p>The bee house, inside the wall. Six skeps on a stone shelf, and the reason every flower in the glasshouse is bagged before it opens.</p>
  TOOLS: <p>The tool shed beyond the counting room. Canes in bundles, netting on a roll, twine, and a sharpening stone worn hollow.</p>

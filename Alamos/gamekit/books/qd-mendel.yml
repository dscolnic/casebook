    standLine: The bed book, open at a season that has not been sown yet.
    station:
      kind: panel
      title: Bed book
      rows:
        - { label: Beds available, value: 250, status: normal }
        - { label: Trait chosen, value: not yet, status: low }
        - { label: Seasons in hand, value: 1, status: low }
        - { label: Lines bred true, value: 8 generations, status: normal }
  GLASS:
    caption: A cross is only a cross if the pollen is the pollen you chose.
    standLine: Sixty flowers opened by hand, bagged, and staked.
    station:
      kind: panel
      title: Crossing bench
      rows:

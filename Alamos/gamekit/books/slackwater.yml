        guide: >-
          All four options are things somebody might do with a single track. Ask of each whether it
          uses the float as a measurement of what happened or as a model of what happens, and what
          the difference costs when the report is read by somebody making a decision two years from
          now.
        assumes:
          - a measurement describes the occasion it was taken on
        takeaway: A single measurement is evidence about its own occasion, and becomes a model only when somebody says so in writing.
        format: CHOICE
        question: What is float 7's track legitimately evidence of?
        why: >-
          It is evidence of what the water did on those eleven days. That is worth a great deal:
          it is the only direct measurement of transport this estuary has. What it cannot do is
          stand in for the general pattern, because a fortnight of tides contains one particular
          sequence of winds and one particular spring–neap phase. A prediction covers the general
          case and carries a bound; a measurement covers one case exactly. Reports go wrong by
          quietly promoting the second into the first.
        choices:
          - What the water did during the eleven days it was out
          - The transport pattern of the estuary in general
          - The error in the harmonic prediction over the same period
          - The exchange fraction of the impoundment per tide
        answer: What the water did during the eleven days it was out
        rebuttals:
          - A fortnight contains one spring–neap phase and one weather sequence, so it cannot stand for all of them.
          - The prediction is a level at the gates and the float is a position in the estuary; neither bounds the other.
          - An exchange fraction is a property of a volume, and one float samples no volume at all.
  # ---------------------------------------------------------------- day 7
  - title: The impoundment fills
    objective: Solve the filling equation, and price the interval the gate table is written to.
    briefing: Beke wants a filling time he can defend, and a reason for half an hour rather than ten minutes.
    stake: >-
      Tuesday, six working days to the springs. Beke has to publish the gate programme for day
      thirteen and every row of it rests on how long the impoundment takes to come up through a part-open
      gate. The flow depends on the head, and the head closes while the water is passing, so the
      rate falls throughout — which is why nobody in this building has ever written the filling time
      down. Calloway's office is stepping the surge forecast forward at half-hour intervals for the
      same programme. Today you solve the filling equation properly, take one step of the surge
      model by hand, and ask Nkechi Ude what the impoundment actually exchanges. A gate programme built on
      a filling time that is twenty per cent wrong closes the eastern gate in the wrong half hour.
    takeaway: A rate that depends on what it has already done has to be solved, not multiplied.
    stops:
      - group: SLUICE
        task: Solve the filling equation for the time to fill
        title: A rate that closes its own head
        concept: Separable differential equations
        place: Sluice Control
        scene: >-
          Beke has the flow law for a part-open gate: the level inside rises at a constant times the
          square root of the head across it. Outside is held at 7.4 metres, the impoundment starts at 4.3,
          and the constant is 0.11 in metres and minutes.
        guide: >-
          You build the working a line at a time. Everything with an h in it goes to one side and
          everything with a t to the other, which is what makes this equation solvable at all. Then
          each side is integrated on its own, the level at the start fixes the constant, and only
          then is there anything to rearrange for a time.
        background:
          - >-
            Why the rate is a square root. Flow through an opening is driven by the head across it,
            and the speed of that flow goes as the square root of the head — the same relation that
            makes a jet from a deep tank faster than one from a shallow one. So the impoundment comes up
            quickly at first and then more and more slowly.
          - >-
            Why this cannot be done by multiplying. The rate at the start is 0.11 times the root of
            3.1, which is 0.194 metres a minute, and at that rate the impoundment would be level in 16
            minutes. The true answer is twice that, because the rate is falling the whole way and
            the starting value is the largest it ever takes.
          - >-
            Why the solution reaches the end rather than approaching it. An exponential decay
            approaches its target and never arrives. This one is a square root, so the solved form
            is a parabola in time and it meets the outside level exactly, at a finite minute. That
            is a real difference between two equations that look equally harmless.
        takesAsRead:
          - The fundamental theorem, and the antiderivative it rests on
        assumes:
          - an equation whose variables can be put on opposite sides can be integrated side by side
        takeaway: Separating the variables turns a rate that depends on the answer into two integrals that do not.
        format: DERIVE
        question: How long does the impoundment take to come up to the outside level?
        answerText: >-
          About 32 minutes. Separating gives −2√(H − h) = kt + C, and the filling time is
          2√(H − h₀) ÷ k = 2 × 1.761 ÷ 0.11.
        why: >-
          The impoundment takes about 32 minutes. Putting every h on one side and every t on the other
          leaves two integrals that can each be done, and the h side integrates to minus twice the
          root of the head. The starting level fixes the constant, and the level meets the outside
          level when that root reaches zero, which is a finite time rather than a limit. Multiplying
          the starting rate by anything would have given 16 minutes, because the starting rate is
          the fastest the gate ever runs.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: dh/dt = k·√(H − h)
          startNote: H = 7.4 m held outside, h₀ = 4.3 m in the impoundment, k = 0.11 in metres and minutes
          goal: the time for h to reach H, in minutes
          askRule: true
          rules:
            - separation of the variables
            - integration of each side
            - the constant from the starting value
            - rearrangement
            - substitution of the stated values
          steps:
            - ask: Separate the variables.
              answer: 1
              candidates:
                - text: dh·√(H − h) = k·dt
                  rule: separation of the variables
                  why: >-
                    The root has been multiplied across rather than divided. It integrates perfectly
                    well and describes a impoundment that fills faster as the head closes.
                - text: dh ÷ √(H − h) = k·dt
                  rule: separation of the variables
                - text: dh ÷ (H − h) = k·dt
                  rule: separation of the variables
                  survives: true
                  why: >-
                    The root has been dropped, which turns this into the exponential case. It solves
                    cleanly, it looks like every other tank problem, and its impoundment never quite fills —
                    so there is no filling time to report at all.
                - text: dh ÷ √(H − h) = dt ÷ k
                  rule: rearrangement
                  why: >-
                    The constant has gone to the wrong side. It ends up dividing the time instead of
                    multiplying it, and the filling time comes out eighty times too long.
            - ask: Integrate each side.
              answer: 2
              candidates:
                - text: √(H − h) = kt + C
                  rule: integration of each side
                  survives: true
                  why: >-
                    The factor of minus two is missing. The sign error alone would be caught, but with
                    the two also gone the filling time comes out at 16 minutes, which is exactly the
                    answer a careless multiplication gives.
                - text: 2√(H − h) = kt + C
                  rule: integration of each side
                  why: >-
                    The two is right and the sign is not. Differentiating this back gives a rate with
                    the wrong sign, so the impoundment empties.
                - text: −2√(H − h) = kt + C
                  rule: integration of each side
                - text: ln(H − h) = kt + C
                  rule: integration of each side
                  why: >-
                    That is the antiderivative of one over the head, not one over its root. It belongs
                    to the equation without the square root in it.
            - ask: Use the starting level to fix the constant.
              answer: 0
              candidates:
                - text: C = −2√(H − h₀) = −2√3.1 = −3.52

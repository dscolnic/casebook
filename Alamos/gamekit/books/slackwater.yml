        title: Can one float stand for the whole estuary?
        reason: A single clean measurement can still become a bad model if it is generalized beyond the tide and place it sampled
        concept: A prediction, a bound and a measurement, and which of the three a decision rests on
        # SITED at the boat shed: eleven floats went out of that shed and nine
        # came back, and the empty cradle is float 7's. The rack there is the
        # object the question is about, so this is where it is asked — and it is
        # what opens the shed, on day 6. See engine/core/access.js.
        place: Boat Shed
        at: launchrack
        person: true
        scene: >-

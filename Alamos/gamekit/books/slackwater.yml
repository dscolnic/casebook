warmups:
  trial-near:
    title: Walk the barrage before the springs
    why: >-
      Five buildings, a road across six gates and a pontoon on the west side. Walk it once at low
      water. On the thirteenth you will be crossing this ground with a marsh warning to hang and a
      gate crew waiting, and pacing it out now is what makes that afternoon possible.
  trial-far:
    title: The shore track, and the wall at the end of it
    why: >-
      The wall station is two hundred metres along the shore to the east, and the walkway out to the
      gauge at the wall head is covered for four hours either side of high water. Take the track once
      in daylight, so that the day you are asked to fetch a gauge record you already know how long it
      takes.
  greet:
    title: Twelve people, six of whom you will disagree with
    why: >-
      This barrage runs on two signatures that have been in tension for nine years: Idris Calloway,
      the chief tidal analyst, and Renate Oyelaran, the barrage master. Get round the whole crew
      before the springs, because you will be carrying numbers between them all fortnight.
  follow:
    title: The core route, walked by the man who walks it
    why: >-
      Cal Reddy, the sediment technician, takes fourteen cores in the same order on the same state
      of the tide, and the route is not on any chart. Stay with him along it. Where he stops is
      where the flats will take a boot, and the two stations he cannot reach on foot are the two
      that go missing.
  hunt:
    title: Six tide poles, and the sheet accounts for four
    item: { name: tide pole, plural: tide poles }
    why: >-
      Every level quoted at this station is quoted against a pole, and two of the poles were reset
      after the eastern gate was re-gated without anybody writing down the new zero. A pole nobody
      can find is a datum nobody can check, and every prediction at that station is a metre of
      argument.
  canvass:
    title: Who else saw the water over the bank on the twelfth
    why: >-
      Something put water over the bank west of the turbine hall last month and only the wall gauge
      recorded it. Ask round the crew and the marsh graziers until enough accounts agree on where
      it came over, because one gauge is not a measurement of an overtopping yet.
  evade:
    title: The contractor who wants the gates open this afternoon
    why: >-
      He has a barge to move and the programme says the gates are shut from two. The argument
      belongs to Renate Oyelaran, the barrage master, not to you, and you have four calls to make before the sheet goes out. Keep
      clear of him and get the round done rather than spending the afternoon at the gate house.
  tag:
    title: Catch Achterberg before she goes to the mainland
    why: >-
      Wren Achterberg, the harmonic analyst, has the dropped amplitudes in her own notebook rather
      than on the wall, and she is on the four o'clock across the water for three days. Every bound
      printed on the springs prediction comes off that page.

copy:
  PRED: <p>The prediction office. Thirty-seven constituents on the wall in order of size, eight of them in the daily sum, and a board in the corridor that says what the tide will do tomorrow to a centimetre it cannot quite justify.</p>
  TRACK: <p>The survey pontoon. A launch, a rack of nine recovered floats and one empty cradle, and two columns of numbers that contain every speed this estuary has ever been measured at without stating one of them.</p>
  ROSE: <p>The currents room. Four meters on the barrage face, one on the wall, and a fortnight of ten-minute records drawn as two figures with no axes on them.</p>
  SLUICE: <p>Sluice control. Six gates on one desk, the head across them on the wall, and a programme for the springs that nobody has signed because it rests on a filling time nobody has computed.</p>
  FLATS: <p>The mud laboratory. A bench, a drying oven and eleven years of cores, and the only room on the site whose questions are all about how long something stays rather than how much arrived.</p>
  WALL: <p>The wall station, at the root of three hundred metres of armour. A stove, a notebook and a gauge at the far end, which reads higher than the gates do and has done for two years.</p>
  TURBINE: <p>The turbine hall. Four sets, ebb generation only, and a generation report that has always assumed the water went out at the middle of the release.</p>
  TOWER: <p>The gauge tower. A stilling well down the seaward face, a small inlet at the bottom of it, and forty minutes between the water outside changing and the float inside agreeing.</p>
  BOAT: <p>The boat shed. The launch on its trailer, spare drogues, and a chart of the flats with fourteen core stations on it, two of them ringed because they need the boat.</p>
  MARSH: <p>The marsh warning post. A board, a bell and a telephone, and the graziers read it before they decide where the stock spends the night.</p>

# ------------------------------------------------------------------ review variants
#
# Lessons no mission stop points at. From day 3 every day carries a callback, and
# `shapeMissions` only issues one where the oldest taught lesson has an unserved
# "— Review" variant of its own; with none authored this campaign served no
# callbacks at all. Four bases from the first three days, each re-asked on a
# different case at the same concept, and none of them a second DERIVE — a
# derivation is reviewed by applying its result, not by walking it again.
lessons:
  - group: PRED
    title: Two terms and a fortnight — Review
    task: Get the beat of the diurnal pair, on speeds a degree apart
    concept: A quantity written as a sum of periodic terms
    place: Prediction Office
    scene: >-
      Wren Achterberg, the harmonic analyst, has two more of the daily-sum terms on the board:
      the pair that rises once a day rather than twice. Their speeds are about a degree an hour
      apart. She wants the interval between one time they add and the next.
    guide: >-
      Four quantities are on the board and three of them make the answer. The interval is not the
      period of either term, and neither term's own period will get you to it. What decides it is
      how long the faster of the two takes to gain a whole turn on the slower, so the whole turn
      goes over the gap between the two speeds. The entry that is already a period in hours is
      there to be left out.
    background:
      - >-
        Why the two amplitudes do not appear. Adding two cosines of nearly equal speed gives a fast
        cosine inside a slow one, and the slow factor is built out of the difference of the speeds
        alone. The amplitudes decide how far the water moves when the two add; they decide nothing
        about how often that happens.
      - >-
        Why this pair matters at Sarn. The semidiurnal pair comes round every 14.7 days, which is
        the fortnight the springs are counted in. The diurnal pair comes round on its own cycle, a
        little under a fortnight, and the two are not in step with each other. The largest tides of
        the year happen where both patterns arrive together, which is what an equinoctial spring is.
    assumes:
      - a cosine of angular speed ω has period 360° ÷ ω
      - two terms add most strongly when their arguments differ by a whole number of turns
    takeaway: Two terms come back into step at the difference of their speeds, whatever their sizes and whatever each one's own period is.
    format: BALLPARK
    question: How long is it from one time the two diurnal terms add to the next?
    estimate:
      prompt: >-
        Two diurnal constituents, each running a little over and a little under one turn a day.
        The board wants the interval at which they come back into step.
      question: How long is it from one time the two diurnal terms add to the next?
      relationship: >-
        Interval between one time they add and the next = one whole turn ÷ the difference between
        the two speeds.
      labels:
        - 15.041 °/h  (speed of the solar-lunar diurnal term)
        - 13.943 °/h  (speed of the lunar diurnal term)
        - 360 °  (one whole turn of the slower term's lag on the faster)
        - 24.84 h  (the lunar diurnal term's own period)
      values: [15.041, 13.943, 360, 24.84]
      slots: 3
      template: '{2} ÷ ({0} − {1})'
      formula: c/(a-b)
      correct: [0, 1, 2]
      target: 327.9
      tolerance: 8
      units: hours
      solution: The two speeds differ by 1.098 °/h, so 360 ÷ 1.098 = 328 hours, or 13.7 days.
      explanation: >-
        Either term on its own comes round in about a day, and that period says nothing about how
        often the two add. What sets the interval is the rate at which one gains on the other.
    why: >-
      The interval is about 328 hours, which is 13.7 days. Two terms of nearly the same speed drift
      in and out of step at the difference of those speeds, and a whole turn divided by that
      difference is how long the drift takes. Here the gap is 1.098 degrees an hour, so the pair
      comes back into step every fortnight or so. The semidiurnal pair on the board did the same
      thing for the same reason and arrived at 14.7 days. Amplitudes set how big the swing is and
      never how often it comes.

  - group: TRACK
    title: A clock and a position — Review
    task: Match each quantity wanted from a float card to the work it takes
    concept: Parametric curves, and a path described by time rather than by x
    place: Survey Pontoon
    scene: >-
      Owen Mbeki, the drifter technician, has float 9 out of the water and its card on the bench:
      a column of times and two columns of position, ten minutes apart, and nothing else on it.
      Four numbers are wanted from that card for the sediment annex.
    guide: >-
      Four quantities wanted from the card, and four descriptions of the work each one takes.
      Pair them. The test every time is how much of the record has to be touched: a single line,
      one neighbouring pair of lines, two rates taken together as a right-angled pair, or every
      interval in the card added up from the first line to the last.
    assumes:
      - a fix is one position at one recorded time
      - a rate is a change divided by the interval it happened over
    takeaway: How much of a track you have to touch is what tells you which kind of quantity you are asking it for.
    format: PROTOCOL
    task: Match each number the annex wants to the work the card makes you do for it.
    scenarios:
      - Where float 9 was at 09:20 on the third day.
      - How fast it was going at 09:20 on the third day.
      - Which way it was heading at 09:20 on the third day.
      - How much water it rode through over the whole eleven days.
    choices:
      - Read one line off the card, because positions against time are what the card is.
      - Difference both position columns across one interval and combine the two rates as a right-angled pair.
      - Difference both position columns across one interval and take the ratio of the two rates.
      - Take a length for every interval in the card and add them from the first line to the last.
    mapping: [0, 1, 2, 3]
    why: >-
      A parametric record holds the position outright and holds everything else as a rate or as a
      sum of rates. Speed comes from differencing both columns over one interval and combining the
      two rates as a right-angled pair, which is the size of the velocity. Heading comes from the
      same two rates as a ratio, which throws the size away and keeps the direction. Length has to
      be accumulated interval by interval, because no single line of the card contains any of it.

  - group: SLUICE
    title: The rate does not wait — Review
    task: Price one row of the gate table against the trace of what happened
    concept: A rate of change, and the derivative as a rate
    place: Sluice Control
    scene: >-
      Tomas Beke, the sluice engineer, has one row of last Thursday's gate table beside the
      recorder trace for the same half hour. The row was written from the flow at the top of it.
      The trace says what the flow averaged instead.
    guide: >-
      Four quantities are on the desk and three of them belong in the answer. The row assumed one
      flow held for the whole interval; the trace gives what the flow averaged across it. The gap
      between those two rates, run for the length of the interval, is the water the sheet claimed
      and the estuary did not supply. The impoundment level is on the desk because the row was
      written from it, and it plays no part here.
    assumes:
      - a rate quoted at an instant is the rate at that instant only
      - a volume is a rate multiplied by the time that rate ran for
    takeaway: What a rate costs when it is used over an interval is its gap from the average rate, multiplied by the interval.
    format: BALLPARK
    question: How much water does one row of the gate table claim that never passed?
    estimate:
      prompt: >-
        One half-hour row, written from the flow at the top of it, against the trace of what the
        flow actually averaged over the same half hour.
      question: How much water does one row of the gate table claim that never passed?
      relationship: >-
        Water overstated = (the rate the row assumed − the rate that actually held on average)
        × the length of the interval.
      labels:
        - 62.0 m³/s  (the flow at the top of the half hour, which the row used)
        - 55.4 m³/s  (what the trace averaged across the half hour)
        - 1800 s  (the length of one row of the table)
        - 4.30 m  (the level being held in the impoundment)
      values: [62.0, 55.4, 1800, 4.30]
      slots: 3
      template: '({0} − {1}) × {2}'
      formula: (a-b)*c
      correct: [0, 1, 2]
      target: 11880
      tolerance: 400
      units: m³
      solution: 62.0 − 55.4 = 6.6 cubic metres a second, and 6.6 × 1800 = 11,880 cubic metres.
      explanation: >-
        The interval is what turns a difference of two rates into a volume. Shorten the row and the
        two rates have less time to come apart, which is the answer to the question Beke asks twice
        a year.
    why: >-
      About 11,900 cubic metres, out of one row. Flow through a part-open gate follows the head,
      and the head closes while the water is passing, so the rate at the top of a half hour is the
      largest rate of that half hour. Using it for the whole interval charges the sheet the
      difference. Every stepped calculation carries that error, and it has two handles: how fast
      the rate is changing, which the estuary decides, and how long the step is, which the table
      decides.

  - group: ROSE
    title: The slope of a track with no formula — Review
    task: Say what the chart slope does as one of the two rates passes zero
    concept: The slope of a parametric path, dy/dx out of two rates
    place: Currents Room
    takesAsRead:
      - The chain rule, and a quantity that moves because another one does
    scene: >-
      Dr. Halina Vos, the currents scientist, has meter two's record for the turn of the ebb. For
      ten minutes either side of slack the eastward rate runs down through zero while the
      northward rate is still going at three hundred metres an hour.
    guide: >-
      All four options describe the chart at the same instant. Ask first which of the two rates
      sits underneath in the ratio that makes a chart slope, and what a quotient does as that one
      closes on zero. Then ask separately whether anything about the water, the float or either
      rate is misbehaving at that moment, or only the number built out of the two of them.
    assumes:
      - a slope on a chart is a change in northing divided by a change in easting
      - a ratio whose denominator vanishes has no finite value
    takeaway: A path can be perfectly smooth at an instant where its slope on the chart has no value at all.
    format: CHOICE
    question: What is the track's chart slope doing as the eastward rate passes through zero?
    choices:
      - The slope grows without limit, and the track is running due north at that moment.
      - The slope falls to zero, since one of the two rates making it has vanished.
      - The slope is undefined for good, and the track has a genuine corner at slack.
      - The slope is unchanged, because only the northward rate decides which way a track leans.
    answer: The slope grows without limit, and the track is running due north at that moment.
    why: >-
      The chart slope is the northward rate over the eastward one, so it grows without limit as the
      eastward rate closes on zero, and the track stands vertical on the chart. Nothing is wrong
      with the float or with either meter at that instant: both coordinates are moving smoothly and
      both rates are perfectly well defined. What has failed is the description. A chart slope asks
      how far north per metre east, and for those few minutes there are no metres east to divide by.
    rebuttals:
      - A vanishing denominator sends a ratio up rather than down; it is a vanishing numerator that flattens a track.
      - The track is smooth through slack, since both coordinates and both rates stay continuous; only their ratio misbehaves.
      - A slope built from two rates uses both of them, and here it is the eastward rate doing the work.

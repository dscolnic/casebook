        title: Twenty minutes past the turn
        concept: Sequences, partial sums, and what convergence means
        place: Wall Station
        person: true
        scene: >-
          Fell has two years of notebook entries in the hut at the wall head. The gauge out here
          goes on rising for about twenty minutes after the level at the gates has turned, and it
          does it on every large tide.
        guide: >-
          All four options are ways a level at one end of a wall could go on rising while the level

      - group: PRED
        task: Take one step of the surge model by hand
        title: Half an hour of tangent
        concept: Euler's method, and the error a step size costs
        place: Prediction Office
        scene: >-
          The surge forecast arrives as a rate rather than a level: the surge grows at 0.42 metres an

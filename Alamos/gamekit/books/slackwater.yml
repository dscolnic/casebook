                - text: |r| = 0.62 < 1, so S = 0.34 ÷ 1.62 = 0.21 m
                  rule: substitution of the fitted values
                  survives: true
                  why: >-
                    One plus the ratio instead of one minus it. It is smaller than the first arrival,

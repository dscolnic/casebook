        question: What does one half-hour step give for the surge?
        estimate:
          prompt: >-
            The programme steps the surge model forward at half-hour intervals. This is the first
            step, from the present height and the rate the model gives at that height.
          question: What does one half-hour step give for the surge?
          relationship: >-
            Stepped forward: next value = present value + the rate at the present value × the step
            size.
          labels:
            - 0.30 m  (surge now)
            - 0.375 m/h  (the model's rate at that height)
            - 0.5 h  (the step size)
            - 0.42 m/h  (the forcing term on its own)
            - 30 min  (the same step, in minutes)
          values: [0.30, 0.375, 0.5, 0.42, 30]
          slots: 3
          template: '{0} + {1} × {2}'
          formula: a+b*c
          correct: [0, 1, 2]
          target: 0.4875
          tolerance: 0.02
          units: m
          solution: 0.30 + 0.375 × 0.5 = 0.49 m after one step.
          explanation: >-
            The rate the model gives at 0.30 m is the forcing less the decay, which is 0.375 rather
            than 0.42. Stepping on the forcing alone ignores the term that is currently taking the
            surge back down.
        why: >-
          One step gives 0.49 metres. The method treats the rate as though it held for the whole
          half hour, which it does not: the decay term grows as the surge does, so the true rate
          falls across the interval and the step overshoots. Halving the interval roughly halves that
          overshoot, which is the defensible reason Beke has been asking for. The forcing term alone
          is not the model's rate at any height except zero.
      - group: FLATS
        task: Ask Ude what the impoundment actually exchanges
        title: A third of a third of a third
        concept: Geometric series, and the sum of a reflection chain
        place: Mud Laboratory
        person: true
        scene: >-
          Ude has the dye results from March on the bench. A third of the impoundment is exchanged on each
          tide, and the licence report claims the impoundment is clear after three of them. The dye was
          still detectable after nine.
        guide: >-
          Each observation on the left has one explanation on the right that accounts for it. What
          separates them is whether the water leaving is replaced by new water or partly by water
          that has just left, because that is the difference between a total that runs out and a
          total that shrinks by a fixed fraction for ever.
        assumes:
          - what leaves an estuary on the ebb is partly what comes back on the flood
        takeaway: A fixed fraction removed each cycle leaves a fixed fraction behind each cycle, and that never reaches nothing.
        format: CASEBOOK
        task: Match each observation to the explanation that accounts for it.
        scenarios:
          - Dye was still detectable after nine tides, at about two per cent of the first reading.
          - The first three tides removed far less than the whole of the dye.
          - The second tide removed less dye than the first, in kilograms.
          - Water sampled on the flood carried dye, though the dye was released inside the impoundment.
        choices:
          - Each tide takes a third of what is present, so what remains falls by a factor rather than to nothing.
          - A third of the impoundment exchanged is not a third of the impoundment cleared, since the tides overlap in the same water.
          - The amount removed is a share of a falling quantity, so it falls with it.
          - Part of what left on the ebb is still outside the gates and returns on the next flood.
        mapping: [0, 1, 2, 3]
        why: >-
          All four are the same arithmetic seen from different angles. A tide that exchanges a third
          leaves two thirds, so after n tides the fraction left is two thirds multiplied by itself n
          times: 0.67, 0.44, 0.30, and about 0.026 after nine. Each tide removes a third of a smaller
          quantity than the last, so the kilograms removed fall too. And some of the water that left
          is still just outside the gates when the flood begins, which is why the exchanged share is
          not the cleared share.
  # ---------------------------------------------------------------- day 8
  - title: The tail nobody measures
    objective: Decide when the far end of a long process is worth a number.
    briefing: The nutrient claim in the licence report is an integral to infinity, and nobody has taken it.
    stake: >-
      Wednesday, and the nutrient section of the report needs one number: the total exposure of the
      flats to a discharge that decays away over many tides. Ude can measure the first four or five
      tides directly and the rest is a tail. Achterberg has been asked to say which tails have a
      total at all, because two of the models in circulation do not. Today you take the exposure
      integral out to infinity, sort four tails into those with a total and those without, and hear
      from Grieve why the armour count on the wall is the same question. A tail that has no total is
      a model that says the flats are exposed to an unlimited amount, which is the sort of sentence
      a licence review notices.
    takeaway: An integral or a sum that runs for ever may still be a finite number, and which it is has to be shown.
    stops:
      - group: FLATS
        task: Take the exposure integral out to infinity
        title: For ever, and forty-eight kilograms
        concept: Improper integrals, and when a tail has finite area
        place: Mud Laboratory
        scene: >-
          Ude has the decay fitted: the dissolved load starts at 48 kilograms and falls by a fixed
          fraction each tide, with a decay time of 6.2 tides. The report wants the total exposure
          over the whole of the decay.
        guide: >-
          You build the working a line at a time. An integral with no upper end is not evaluated at
          infinity; it is evaluated at a finite end and then that end is sent out, which is the step
          that decides whether there is an answer. The antiderivative is the ordinary one. What
          matters is what it does as the upper end grows.
        background:
          - >-
            Why the upper end has to be a limit. Infinity is not a number that can be substituted,
            so the integral is defined as the value at a finite upper end together with what happens
            to that value as the end moves out. For this decay the term at the upper end goes to
            nothing, so a finite answer survives.
          - >-
            Why this tail has a total and some do not. A quantity falling by a fixed fraction per
            tide falls faster than any power of the time, so its area is finite. A quantity falling
            like one over the time does not: its integral grows like a logarithm and passes every
            value eventually, which is the same distinction that separates two sums with terms going
            to zero.
          - >-
            What the units are. A load in kilograms accumulated over tides gives kilogram-tides,
            which is an exposure rather than a mass. It is the right quantity for the nutrient
            claim, because what harms the flats is how much was present for how long rather than how
            much arrived.
        takesAsRead:
          - The integral test, and comparison between series
        assumes:
          - an integral with no upper end means the limit of the integral as the end moves out
        takeaway: An improper integral is a limit, and the limit is where a tail either has a total or has not.
        format: DERIVE
        question: What is the total exposure over the whole decay, in kilogram-tides?
        answerText: >-
          About 298 kilogram-tides, from 48 × 6.2. The upper end is taken out as a limit and the
          exponential term there goes to nothing.
        why: >-
          The total is about 298 kilogram-tides. The integral is taken to a finite upper end, giving
          the decay time times the starting load times one minus a term at that end, and then the
          end is sent out. Because the load falls by a fixed fraction per tide, that end term goes to
          nothing and the whole tail contributes a finite amount. The answer is the starting load
          times the decay time, which is a useful thing to know: the exposure of a decaying
          discharge is what it would be if it held its initial value for one decay time.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: E = ∫₀^∞ 48·e^(−t/6.2) dt
          startNote: kilograms against tides; the decay time is 6.2 tides
          goal: the total exposure, in kilogram-tides
          askRule: true
          rules:
            - the definition of an improper integral
            - antidifferentiation
            - evaluation at the two ends
            - taking the limit
            - substitution of the stated values
          steps:
            - ask: Write the improper integral in a form that can be evaluated.
              answer: 2
              candidates:
                - text: E = 48·e^(−∞/6.2) − 48·e⁰
                  rule: evaluation at the two ends
                  why: >-
                    Infinity has been substituted as though it were a number, and the antiderivative
                    has been skipped. What is written is a difference of two values of the integrand.
                - text: E = ∫₀^{6.2} 48·e^(−t/6.2) dt
                  rule: the definition of an improper integral
                  survives: true
                  why: >-
                    The upper end has been replaced by the decay time, which is a real and useful
                    integral — the exposure over the first decay time. It is 63 per cent of the true
                    answer and nothing about the arithmetic afterwards looks wrong.
                - text: E = lim_{b→∞} ∫₀^b 48·e^(−t/6.2) dt
                  rule: the definition of an improper integral
                - text: E = ∫₀^∞ 48·e^(−t/6.2) dt, evaluated directly
                  rule: antidifferentiation
                  why: >-
                    That is the statement of the problem rather than a step towards it. The upper end
                    is not a number and cannot be put into an antiderivative.
            - ask: Antidifferentiate the integrand.
              answer: 0
              candidates:
                - text: −6.2 × 48·e^(−t/6.2)
                  rule: antidifferentiation
                - text: −48·e^(−t/6.2) ÷ 6.2
                  rule: antidifferentiation
                  survives: true
                  why: >-
                    The decay time is dividing where it should multiply. It is out by a factor of 38
                    and the shape of the expression is perfectly right, so only the size gives it away.
                - text: 48·e^(−t/6.2)
                  rule: antidifferentiation
                  why: >-
                    An exponential is its own derivative only when the exponent is plain t.
                    Differentiating this back leaves the factor of one over 6.2 unaccounted for.
                - text: −6.2 × 48·e^(−t/6.2) × t
                  rule: antidifferentiation
                  survives: true
                  why: >-
                    A stray factor of t, as though the exponential had been treated as a constant and
                    the dt integrated separately. It vanishes at the lower end, so the arithmetic there
                    still works.
            - ask: Evaluate between the two ends and take the limit.
              answer: 1
              candidates:
                - text: E = 6.2 × 48 × (e^(−b/6.2) − 1) → −298
                  rule: evaluation at the two ends
                  why: >-
                    The two ends are the right way round in the expression and the wrong way round in
                    the subtraction, which gives a negative exposure.
                - text: E = 6.2 × 48 × (1 − e^(−b/6.2)) → 6.2 × 48
                  rule: taking the limit
                - text: E = 6.2 × 48 × (1 − e^(−b/6.2)) → 0
                  rule: taking the limit
                  survives: true
                  why: >-
                    The limit has been taken of the wrong term: the exponential goes to zero, so the
                    bracket goes to one rather than to nothing. It is the right working with the last
                    line inverted.
                - text: E = 6.2 × 48 × e^(−b/6.2) → ∞
                  rule: taking the limit
                  why: >-
                    A negative exponent grows without limit only if the sign is dropped. As the upper
                    end moves out this term becomes smaller, not larger.
            - ask: Put the numbers in.
              answer: 3
              candidates:
                - text: E = 48 ÷ 6.2 = 7.7 kilogram-tides
                  rule: substitution of the stated values
                  why: >-
                    The decay time divides here rather than multiplying. A longer-lived discharge would
                    then produce less exposure, which is backwards.
                - text: E = 48 × 6.2 × 2 = 595 kilogram-tides
                  rule: substitution of the stated values
                  why: >-
                    There is no factor of two in this integral. It has been carried over from the
                    square-root case, where it belongs.
                - text: E = 48 kilogram-tides
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    The starting load reported as though it were the exposure. The number is real and
                    it is a mass rather than a mass times a time, which is the only way to tell.
                - text: E = 48 × 6.2 = 298 kilogram-tides
                  rule: substitution of the stated values
          commit: Commit the derivation
      - group: PRED
        task: Sort four tails into those with a total and those without
        title: Four tails, two totals
        concept: The harmonic series and p-series
        place: Prediction Office
        scene: >-
          Achterberg has four models on the wall, each giving the contribution of the nth tide after
          a discharge. In every one of the four the contributions get smaller, and two of the four
          add up to a number.
        guide: >-
          Each tail on the left has to be matched with what its total does. Every one of them has
          terms going to nothing, so that is not the distinction. What separates them is how fast
          the terms fall: a fixed fraction each time, or a fixed power of the tide number, and where
          the power sits relative to one.
        takesAsRead:
          - The nth-term test, and what it can and cannot settle
        assumes:
          - the size of the terms decides the total only through how fast they fall
        takeaway: Whether an endless sum has a total is decided by the rate the terms fall at, not by the terms being small.
        format: PROTOCOL
        task: Match each tail to what its total does.
        scenarios:
          - Each tide contributes 0.6 of what the tide before it contributed.
          - Each tide contributes one part in n, for the nth tide.
          - Each tide contributes one part in n squared.
          - Each tide contributes one part in the square root of n.
        choices:
          - A total of two and a half times the first term.
          - "No total: the sum passes any value you name, though slowly."
          - A total a little over one and a half times the first term.
          - No total, and it fails faster than the one-over-n case.
        mapping: [0, 1, 2, 3]
        why: >-
          A fixed fraction each time is geometric and has a total, here 1 ÷ (1 − 0.6). The powers of
          n are the p-series, and the boundary is at the power one: one over n has no total, though
          it grows only like a logarithm, and one over the root of n is worse because its terms fall
          more slowly still. One over n squared does have a total. All four have terms going to
          nothing, which is why the size of a single term settles none of this.
      - group: WALL
        task: Ask Grieve why the armour count is the same question
        title: Two hundred and forty units
        concept: The integral test, and comparison between series
        place: Wall Station
        person: true
        scene: >-
          Grieve has the armour survey on the table in the hut: two hundred and forty units, each
          taking a share of the wave energy that reaches it, the share falling steadily along the
          wall towards the head.
        guide: >-
          All four options are ways of getting a total out of a run of two hundred and forty terms.
          Ask of each whether it needs every term to be known, and what it would do if the wall were
          extended. The one that survives is the one that compares the terms with something already
          integrable.
        takesAsRead:
          - The harmonic series and p-series
        assumes:
          - a sum of terms that fall steadily can be compared with the area under a curve through them
        takeaway: A sum can be bounded by an integral through its own terms, which is what makes an unmeasured tail safe.
        format: CHOICE
        question: How can Grieve bound the total the unsurveyed units take without measuring them?
        why: >-
          The terms fall steadily along the wall, so the sum of the unsurveyed ones is bounded by the
          area under a curve drawn through them, and that area is an ordinary integral. This is the
          integral test doing structural work: it converts a sum nobody can measure into an integral
          somebody can, and it gives a bound rather than an estimate. Adding up the surveyed units
          and scaling would assume the far units are like the near ones, which is the one thing the
          falling trend says they are not.
        choices:
          - By comparing the terms with the area under a curve drawn through them
          - By scaling the surveyed total up in proportion to the number of units
          - By taking the largest surveyed share and applying it to every remaining unit
          - By assuming the shares go to nothing, so the tail contributes nothing
        answer: By comparing the terms with the area under a curve drawn through them
        rebuttals:
          - Scaling assumes the unsurveyed units take the same share as the surveyed ones, which the trend denies.
          - The largest share applied to every unit is a bound, and a bound six times too large is not usable.
          - Terms going to nothing is exactly what does not settle whether their total is finite.
  # ---------------------------------------------------------------- day 9
  - title: The residual has a shape
    objective: Find out where the extra term in the record comes from, and whether the fit has absorbed it.
    briefing: The eight-constituent fit leaves something behind, and it is not the same at every station.
    stake: >-
      Thursday, and three working days to the springs. The office has been treating what the fit
      leaves over as noise for nine years. Achterberg has plotted it against station and it is
      positive at every seaward gauge and negative at every one up the estuary, which is not what
      noise looks like. Calloway thinks the discharge law itself generates an extra term in shallow
      water. Today you expand the discharge law about mean head and see what the second-order term
      turns into, choose which of three fits should be carried into the springs prediction, and
      settle the order Beke's gate programme has to be built in. If the extra term is real, the
      board has been quietly wrong at the same stations in the same direction since commissioning.
    takeaway: A residual with a pattern in it is a term the model does not contain, not scatter.
    stops:
      - group: PRED
        task: Expand the discharge law about mean head
        title: Where the second term goes
        concept: Taylor and Maclaurin polynomials
        place: Prediction Office
        scene: >-
          Calloway has the discharge law on the board: flow through the gates goes as the head to the
          power three halves. Mean head is 2.1 metres and the tide moves it by 0.85 either way. He
          wants the law written as a polynomial in that movement.
        guide: >-
          You build the working a line at a time. An expansion about a point is built from the value
          and the derivatives at that point, each divided by the factorial that goes with it. Take
          the derivatives first, assemble them to second order, and only then put the tidal movement
          in — because the interesting thing happens to the squared term when the movement is a
          cosine.
        background:
          - >-
            Why expand at all. The three-halves power is not a polynomial, so a sum of cosines put
            into it does not come out as a sum of cosines. Expanding turns it into powers of the
            movement, and powers of cosines are things a harmonic prediction can hold.
          - >-
            What the squared term does. A cosine squared is one half of one plus the cosine of twice
            the angle. So the second-order term of this expansion contains a constant and a term at
            twice the tidal speed, and that is a constituent the fit does not have — generated by the
            shallow water rather than by the moon.
          - >-
            Why the first-order term is not enough. To first order the flow is proportional to the
            head movement, which is symmetric: as much extra on the flood as missing on the ebb. Every
            asymmetry the estuary shows, including the one in the two roses, lives in the second-order
            term and beyond.
        assumes:
          - a polynomial in a small movement can stand in for a smooth law near a point
        takeaway: A curved law expanded to second order generates a term at twice the driving frequency, which no sum of first-order terms contains.
        format: DERIVE
        question: What does the second-order term of the discharge law become when the head moves as a cosine?
        answerText: >-
          A constant plus a term at twice the tidal speed, with amplitude three sixteenths of
          (a/H)² times the mean discharge — about 3 per cent here.
        why: >-
          The second-order term becomes a constant plus an overtide at twice the tidal speed. The
          expansion coefficients are the derivatives at mean head over their factorials: three halves
          over H for the first, three eighths over H squared for the second. Putting a cosine into
          that squared term and using the double-angle form splits it into a steady part and a part
          oscillating twice as fast. With a movement of 0.85 metres on a mean head of 2.1, the
          overtide is about three per cent of the mean discharge, which is a measurable term in a
          nine-year record.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: Q(η) = C·(H + η)^{3/2}
          startNote: H = 2.1 m mean head, η the tidal movement about it, with amplitude a = 0.85 m
          goal: the second-order term of Q, written in terms of the tidal movement
          askRule: true
          rules:
            - the power rule
            - the coefficients of a Taylor polynomial
            - substitution of the tidal movement
            - the double-angle form
            - rearrangement
          steps:
            - ask: Take the first two derivatives at mean head.
              answer: 2
              candidates:
                - text: Q′ = (3/2)C·(H + η)^{1/2},  Q″ = (3/2)C·(H + η)^{−1/2}
                  rule: the power rule
                  survives: true
                  why: >-
                    The second derivative has kept the three halves instead of picking up the extra
                    half. It is out by a factor of two and has exactly the right form, so the overtide
                    comes out twice as large and still looks plausible against the record.
                - text: Q′ = (3/2)C·(H + η)^{1/2},  Q″ = (3/4)C·(H + η)^{1/2}
                  rule: the power rule
                  why: >-
                    The coefficient is right and the exponent has not dropped. Differentiating cannot
                    leave the power where it was.
                - text: Q′ = (3/2)C·(H + η)^{1/2},  Q″ = (3/4)C·(H + η)^{−1/2}
                  rule: the power rule
                - text: Q′ = (3/2)C·(H + η)^{3/2},  Q″ = (3/4)C·(H + η)^{3/2}
                  rule: the power rule
                  why: >-
                    Neither exponent has moved. The three-halves power is the law itself, and its
                    derivatives must have lower powers than it does.
            - ask: Assemble the expansion to second order.
              answer: 1
              candidates:
                - text: Q ≈ C·H^{3/2}·[1 + (3/2)(η/H) + (3/4)(η/H)²]
                  rule: the coefficients of a Taylor polynomial
                  survives: true
                  why: >-
                    The second derivative has been used without dividing by two factorial. Every
                    Taylor coefficient carries that factorial, and leaving it out doubles the term the
                    whole day is about.
                - text: Q ≈ C·H^{3/2}·[1 + (3/2)(η/H) + (3/8)(η/H)²]
                  rule: the coefficients of a Taylor polynomial
                - text: Q ≈ C·H^{3/2}·[1 + (3/2)(η/H)]
                  rule: the coefficients of a Taylor polynomial
                  why: >-
                    That is the first-order expansion, which is symmetric in the movement and therefore
                    contains no asymmetry and no overtide at all.
                - text: Q ≈ C·H^{3/2}·[1 + (3/2)(η/H) + (3/8)(η/H)³]
                  rule: rearrangement
                  why: >-
                    The second-order coefficient has been attached to a cube. The power and the
                    coefficient come from the same derivative and cannot be separated.
            - ask: Put the tidal movement in as a cosine.
              answer: 3
              candidates:
                - text: the squared term becomes (3/8)(a/H)²·cos(2ωt)
                  rule: substitution of the tidal movement
                  survives: true
                  why: >-
                    The overtide is there and the steady part has been lost. A cosine squared has a
                    mean of one half, so squaring a tide raises the average flow as well as adding a
                    faster term — and the raised average is the part that shows up as a datum error.
                - text: the squared term becomes (3/8)(a/H)²·cos²(ωt), and cannot be simplified
                  rule: substitution of the tidal movement
                  why: >-
                    It can be simplified, and until it is the term cannot be compared with a
                    constituent list, because nothing in that list is a squared cosine.
                - text: the squared term becomes (3/8)(a/H)·cos²(ωt)
                  rule: rearrangement
                  why: >-
                    One power of the mean head has gone missing from the denominator, which leaves the
                    term with units instead of being a pure ratio.
                - text: the squared term becomes (3/8)(a/H)²·cos²(ωt)
                  rule: substitution of the tidal movement
            - ask: Use the double-angle form and say what is in the result.
              answer: 0
              candidates:
                - text: (3/16)(a/H)²·[1 + cos 2ωt] — a constant and a term at twice the tidal speed
                  rule: the double-angle form
                - text: (3/8)(a/H)²·[1 + cos 2ωt] — a constant and a term at twice the tidal speed
                  rule: the double-angle form
                  survives: true
                  why: >-
                    The half from the double-angle form has not been carried into the coefficient. The
                    structure of the answer is exactly right and both parts of it are twice too large.
                - text: (3/16)(a/H)²·cos 2ωt — a term at twice the tidal speed and nothing else
                  rule: the double-angle form
                  why: >-
                    The constant has been dropped again. It is the part that shifts the mean, which is
                    the visible symptom at the gauges.
                - text: (3/16)(a/H)²·[1 + cos ωt] — a constant and a term at the tidal speed
                  rule: the double-angle form
                  why: >-
                    The doubling is the whole content of the identity. At the tidal speed this would be
                    absorbed into the existing constituent and would never have been noticed.
          commit: Commit the derivation
      - group: ROSE
        task: Choose which fit goes into the springs prediction
        title: Three fits, one to carry forward
        concept: Truncating a sum, and stating what was left out
        place: Currents Room
        scene: >-
          Six stations, and for each of them the difference between the predicted high water and the
          measured one, over the last fortnight. Vos has the same fortnight fitted three ways and
          only one of the three is going into the springs prediction.
        guide: >-
          Each stick is one station, drawn where it sits in the estuary; up is a prediction that came
          in low and down one that came in high. Look at every field before you choose. The summary
          number at the top of each is the typical size of what is left over, and it is not the only
          thing worth reading: a field where the leftovers change sign as you move up the estuary is
          telling you about something the fit does not contain.
        takesAsRead:
          - Alternating series, and the error after n terms
        assumes:
          - a fitted parameter will absorb whatever pattern is put in front of it
        takeaway: A fit that scores better by absorbing a pattern into a free parameter leaves the cause in place and hides it.
        format: RESIDUAL
        question: >-
          Look at each field before you choose. Which of these fits should go into the springs
          prediction?
        residual:
          hint: >-
            Each stick is one station, at its position in the estuary. Up is a prediction that came
            in low, down one that came in high.
          fits:
            - id: issued
              label: The eight-constituent fit as issued
              rms: 0.118
              structured: true
              residuals:
                - { x: -2, y: -2, value: 0.13 }
                - { x: 0, y: -2, value: 0.12 }
                - { x: 2, y: -2, value: 0.14 }
                - { x: -2, y: 2, value: -0.10 }
                - { x: 0, y: 2, value: -0.11 }
                - { x: 2, y: 2, value: -0.12 }
            - id: datum
              label: With a datum offset fitted per station
              rms: 0.092
              structured: true
              residuals:
                - { x: -2, y: -2, value: 0.10 }
                - { x: 0, y: -2, value: 0.09 }
                - { x: 2, y: -2, value: 0.11 }
                - { x: -2, y: 2, value: -0.08 }
                - { x: 0, y: 2, value: -0.09 }
                - { x: 2, y: 2, value: -0.10 }
            - id: overtide
              label: With the shallow-water term added
              rms: 0.101
              residuals:
                - { x: -2, y: -2, value: 0.11 }
                - { x: 0, y: -2, value: -0.09 }
                - { x: 2, y: -2, value: 0.04 }
                - { x: -2, y: 2, value: -0.12 }
                - { x: 0, y: 2, value: 0.08 }
                - { x: 2, y: 2, value: -0.05 }
          accept: overtide
          commit: Carry this fit forward
        answerText: >-
          The fit with the shallow-water term, at 0.101. The datum fit scores better and its
          leftovers still change sign along the estuary, which means the offsets absorbed the term
          rather than removing it.
        why: >-
          Two of the three leave a pattern: low seaward, high up-estuary, at every station. That is
          not scatter, it is a term the model does not contain, and fitting a free offset at each
          station soaks it up and improves the summary number while leaving the cause exactly where it
          was. The offsets will then be wrong by a different amount at the springs, when the movement
          is larger and the squared term matters more. The shallow-water fit scores worse and its
          leftovers change sign at random, which is what a complete model produces.
      - group: SLUICE
        task: Settle the order the gate programme is built in
        title: What to write down first
        concept: A prediction, a bound and a measurement, and which of the three a decision rests on
        place: Sluice Control
        person: true
        scene: >-
          Beke has four things to do before the programme can be issued, and no agreed order for
          them. Two of them can be undone in an afternoon and two of them cannot be undone at all
          once the sheet has gone to the gate crews.
        guide: >-
          Four steps, and the rail is not a clock — all four could be started this morning. Put them
          in the order of what each one commits you to, the freest first. What decides it is which
          steps you could still change your mind about afterwards, and one of the four is the one
          nobody can take back.
        assumes:
          - a step that can be revised costs less than one that cannot
        takeaway: Order work by what it forecloses, and the irreversible step goes last however ready it is.
        format: SEQUENCE
        task: Order the four steps by what each one commits you to.
        axis: >-
          Order the four by what each one commits you to, freest first. This is not a clock — every
          step could be started this morning, and the question is which ones you could still change
          your mind about afterwards.
        ends: [Can be revised freely, Cannot be taken back]
        cards:
          - Recompute the prediction with the shallow-water term in it.
          - Print the bound on the tail beside every predicted level.
          - Agree the closing level with the barrage master and record it.
          - Issue the sheet to the gate crews and stand the marsh warning up.
        order: [0, 1, 2, 3]
        why: >-
          Recomputing costs an afternoon of somebody's time and can be thrown away. Printing the
          bound changes nothing about the decision but makes it reviewable, so it is nearly free.
          Agreeing a closing level in writing binds two people and can still be revisited. Issuing
          the sheet and standing up a marsh warning reaches people outside this building: the marsh
          graziers move stock on it, and that cannot be recalled by saying so. The order is about
          what each step takes away from you, and only the last one is irreversible.
  # ---------------------------------------------------------------- day 10
  - title: An honest bound on the wrong quantity
    objective: Bound what the expansion left out, and find out what neither bound covers.
    briefing: The surge forecast has arrived, and it is not in the constituent list.
    stake: >-
      Friday, and the surge forecast for day thirteen came in overnight: half a metre of wind-driven
      water on top of the largest range of the year. Calloway's bound on the dropped constituents is
      0.19 metres and his expansion of the discharge law now needs a bound of its own. Oyelaran has
      read both and wants to know which of them says anything at all about the surge. Today you bound
      the error of the second-order expansion, settle what the tail bound does and does not cover,
      and ask Vos what her meters say about how fast a current changes. This is the day the argument
      that has run all fortnight comes out on Oyelaran's side, and it does so without anything
      Calloway wrote being wrong.
    takeaway: A bound covers what the model it came from contains, and a surge is not in the model.
    stops:
      - group: PRED
        task: Bound the error of the second-order expansion
        title: One more derivative, over six
        concept: The Lagrange error bound
        place: Prediction Office
        scene: >-
          The expansion is being carried into the springs prediction, where the head moves by 0.85
          metres about a mean of 2.1. Calloway will not sign it without a ceiling on what stopping at
          the squared term costs.
        guide: >-
          You build the working a line at a time. The bound is built from the next derivative after
          the last one you kept: its largest size anywhere between the expansion point and the point
          you are using, times the step to the matching power, over the matching factorial. Each of
          those three parts is a place the working can go wrong while still producing a number.
        background:
          - >-
            Why the next derivative and not the next term. The next term of the expansion uses the
            derivative at the expansion point. The bound uses the largest that derivative gets
            anywhere on the interval, which is what turns an estimate into a ceiling.
          - >-
            Where the largest value is. The third derivative here carries a negative power of the
            head, so it is largest where the head is smallest — at the low-water end of the
            movement. Taking it at mean head instead gives a number about a fifth too small, and
            nothing in the arithmetic complains.
          - >-
            What the bound is worth. It comes out at about half a per cent of the mean discharge,
            which is comfortably inside what the gate programme can absorb. That is the honest
            result, and it is a bound on the expansion. It is silent about anything the expansion was
            never given, which is the subject of the next call today.
        takesAsRead:
          - Alternating series, and the error after n terms
        assumes:
          - a bound uses the largest the next derivative reaches on the interval, not its value at one point
        takeaway: A Lagrange bound is a ceiling on a truncated expansion, and it says nothing about terms the model never had.
        format: DERIVE
        question: How large can the error of the second-order expansion be over the tidal movement?
        answerText: >-
          At most about 0.013 in the units of the law, which is 0.4 per cent of the mean discharge:
          M = 0.123, the step cubed is 0.614, and the factorial is 6.
        why: >-
          The bound is about 0.4 per cent. The remainder after a second-order expansion is bounded by
          the largest size the third derivative reaches on the interval, times the step cubed, over
          three factorial. The third derivative here goes as the head to the power minus three
          halves, so it is largest at the smallest head on the interval rather than at the middle,
          and using the middle value understates the bound. Half a per cent is small enough that the
          expansion can be used, which is the answer Calloway wanted and is not the answer to the
          day's question.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: |R₂| ≤ M·|η|³ / 3!
          startNote: the third derivative of C(H + η)^{3/2} is −(3/8)C(H + η)^{−3/2}; H = 2.1 m, |η| ≤ 0.85 m
          goal: a ceiling on the error of the second-order expansion, as a fraction of the mean discharge
          askRule: true
          rules:
            - the form of the remainder
            - the largest value on an interval
            - substitution of the stated values
            - comparison of magnitudes
            - rearrangement
          steps:
            - ask: Say which derivative the bound is built from.
              answer: 2
              candidates:
                - text: the second, since that is the last term kept
                  rule: the form of the remainder
                  why: >-
                    The bound is on what was dropped, so it is built from the first derivative that was
                    not used. Using the last one kept would bound a term that is already in the answer.
                - text: the fourth, since the error is at least two terms deep
                  rule: the form of the remainder
                  why: >-
                    The error begins at the very next term. Skipping to the fourth derivative bounds
                    only part of what was left out and is not a ceiling at all.
                - text: the third, the first one not used
                  rule: the form of the remainder
                - text: the third, evaluated at the expansion point
                  rule: the largest value on an interval
                  survives: true
                  why: >-
                    The right derivative at the wrong place. At the expansion point it is 0.123 and the
                    interval reaches 0.135 at low water, so this is about a tenth too small — a bound
                    that is not quite a bound, and no arithmetic afterwards can show it.
            - ask: Find the largest size that derivative reaches on the interval.
              answer: 0
              candidates:
                - text: M = (3/8)(H − 0.85)^{−3/2} = 0.135, at the low-water end
                  rule: the largest value on an interval
                - text: M = (3/8)(H + 0.85)^{−3/2} = 0.083, at the high-water end
                  rule: the largest value on an interval
                  survives: true
                  why: >-
                    The end has been chosen without looking at the sign of the power. A negative power
                    is largest where the head is smallest, so this takes the smallest value on the
                    interval and calls it the largest.
                - text: M = (3/8)H^{−3/2} = 0.123, at mean head
                  rule: substitution of the stated values
                  why: >-
                    Mean head is inside the interval rather than at its worst end. The value is close
                    and it is not a maximum.
                - text: M = (3/8)H^{3/2} = 1.14, at mean head
                  rule: rearrangement
                  why: >-
                    The sign of the power has been dropped. That is a number ten times too large and
                    the resulting bound is useless rather than wrong.
            - ask: Put the step and the factorial in.
              answer: 3
              candidates:
                - text: |R₂| ≤ 0.135 × 0.85 ÷ 6 = 0.019
                  rule: substitution of the stated values
                  why: >-
                    The step has not been cubed. A remainder after the squared term goes as the step to
                    the third power, which is what makes an expansion good near its own point.
                - text: |R₂| ≤ 0.135 × 0.614 ÷ 3 = 0.028
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    Three rather than three factorial. It is exactly twice the true bound, which is
                    still small, so it neither fails a sanity check nor changes the decision.
                - text: |R₂| ≤ 0.135 × 0.614 × 6 = 0.497
                  rule: rearrangement
                  why: >-
                    The factorial is multiplying instead of dividing. That turns a bound of half a per
                    cent into one of sixteen per cent.
                - text: |R₂| ≤ 0.135 × 0.614 ÷ 6 = 0.0138
                  rule: substitution of the stated values
            - ask: Put that beside the mean discharge term, C·H^{3/2} = 3.04.
              answer: 1
              candidates:
                - text: 0.0138 ÷ 3.04 = 0.45 per cent, so the expansion covers the surge as well
                  rule: comparison of magnitudes
                  why: >-
                    The arithmetic is right and the conclusion is about a quantity the expansion was
                    never given. A surge is not a value of η the law was expanded in.
                - text: 0.0138 ÷ 3.04 = 0.45 per cent of the mean discharge
                  rule: comparison of magnitudes
                - text: 0.0138 × 3.04 = 4.2 per cent of the mean discharge
                  rule: rearrangement
                  survives: true
                  why: >-
                    Multiplied rather than divided. Four per cent is still a believable size for an
                    expansion error, which is why nothing about the number itself gives it away.
                - text: 0.0138 is already a fraction, so it is 1.4 per cent
                  rule: comparison of magnitudes
                  why: >-
                    It is in the units of the law rather than a fraction, so it has to be divided by
                    the term it is being compared with before it means a percentage.
          commit: Commit the derivation
      - group: SLUICE
        task: Settle what the tail bound covers
        title: Nineteen centimetres of what
        concept: A prediction, a bound and a measurement, and which of the three a decision rests on
        place: Sluice Control
        scene: >-
          Oyelaran has both of Calloway's bounds in front of her and the surge forecast beside them.
          The forecast is half a metre of wind-driven water, arriving on the largest range of the
          year, and it came from the weather service rather than from the constituent list.
        guide: >-
          Four readings of what a 0.19-metre bound covers. Ask of each what the bound was computed
          from, because a ceiling can only be a ceiling on the terms that went into it. The
          distinction that matters is between a term that was dropped from the sum and a term that
          was never in the sum at all.
        assumes:
          - a bound is computed from the terms of a particular model
        takeaway: A bound is a statement about a model, so anything outside the model is outside the bound as well.
        format: CHOICE
        question: What does the 0.19-metre bound on the dropped tail cover?
        why: >-
          It covers the twenty-nine constituents that were fitted and not added in. That is all it
          was built from: their amplitudes, bounded one by one. A surge is not one of the thirty-seven
          constituents, because it does not repeat on any tidal period — it comes from wind and
          pressure, and a harmonic fit to nine years of record contains no term for it. Both of
          Calloway's bounds are correct. Neither is a bound on the level, because the level has a term
          in it that neither model has.
        choices:
          - The constituents that were fitted and left out of the daily sum
          - Everything the predicted level could be wrong by on any day
          - The difference between the predicted level and the gauge reading
          - The error in the discharge law's expansion about mean head
        answer: The constituents that were fitted and left out of the daily sum
        rebuttals:
          - A bound built from a list of amplitudes cannot cover a term absent from the list.
          - A gauge has its own lag and its own datum, and neither entered this arithmetic.
          - That is the other bound, computed from a third derivative rather than from amplitudes.
      - group: ROSE
        task: Ask Vos how fast a current changes
        title: The rate of a rate
        concept: Vector-valued functions, and acceleration as the derivative of velocity
        place: Currents Room
        person: true
        scene: >-
          Vos has meter three's fortnight on the screen as two components rather than as speed and
          bearing. The mooring designers have asked her for how fast the current changes, and she
          wants the question put properly before she answers it.
        guide: >-
          All four options are things that could be meant by how fast a current changes. Ask of each
          what it is the derivative of, and whether it can be got from the two components on the
          screen. A current has a direction, so a change in it can be a change in size, a change in
          direction, or both at once.
        assumes:
          - a velocity is two components, each a function of time
        takeaway: Differentiating a velocity component by component gives an acceleration that includes turning as well as speeding up.
        format: CHOICE
        question: What should Vos give the mooring designers for how fast the current changes?
        why: >-
          Differentiating each component gives the acceleration, and that is the quantity that
          includes turning. A current can hold a steady speed and swing through ninety degrees in an
          hour, and the mooring feels that as a change of load direction. The derivative of the speed
          on its own is blind to it: speed was made by throwing the direction away. Which of the two
          the designers want is a real question, and the answer that contains both is the pair of
          component derivatives.
        choices:
          - The derivative of each component, taken separately
          - The derivative of the speed, which is one number
          - The change in bearing per hour, in degrees
          - The largest speed reached during the fortnight
        answer: The derivative of each component, taken separately
        rebuttals:
          - The speed's derivative is zero while a steady current swings right round, and the mooring feels that swing.
          - A turning rate leaves out any change in size, so a current doubling on a fixed bearing reads as no change.
          - A peak speed is a value rather than a rate, and carries nothing about how quickly it arrived.
  # ---------------------------------------------------------------- day 11
  - title: Two integrals that will not come out
    objective: Get a moment and a growth law out of integrals that need a technique each.
    briefing: The generation report wants when the water went, and the silt model will not integrate as it stands.
    stake: >-
      Monday, and two working days to the springs. The generation section of the licence report asks
      for something the office has always fudged: not how much water was released on an ebb but when
      in the ebb it went, which is an integral with a time inside it. Ude has the opposite problem —
      her silt model is a growth law that slows as the flats fill, and it will not integrate until it
      is split into pieces. Achterberg has been refining the springs prediction term by term and
      wants to know when to stop. Today you take the flow-weighted mean time of a release, settle
      what splitting a fraction buys, and put a bracket round a refinement.
    takeaway: An integral that will not come out is usually an integral that has not been rearranged yet.
    stops:
      - group: SLUICE
        task: Get the flow-weighted mean time of a release
        title: When in the ebb the water went
        concept: Integration by parts
        place: Sluice Control
        scene: >-
          Beke has the release profile for the first quarter of an ebb: the flow starts at its
          largest and falls away as a cosine, reaching nothing after 3.1 hours. The report wants the
          mean time of the release, weighted by the flow.
        guide: >-
          You build the working a line at a time. The integral has a time multiplying a cosine, and
          neither factor is the derivative of anything convenient, so it has to be traded for a
          different integral. Which factor you choose to differentiate decides whether what comes back
          is easier or worse, and only one of the two choices makes progress.
        background:
          - >-
            Why the moment rather than the total. The total release is what came out; the moment says
            when. Two releases with the same total can put their water an hour apart in the ebb, and
            the turbines and the marsh both care which.
          - >-
            Why differentiate the time. Differentiating the time gives one, which removes it from the
            problem. Differentiating the cosine leaves a time multiplying a sine, which is exactly as
            hard as what you started with — the classic sign that the two factors were chosen the
            wrong way round.
          - >-
            What the answer means. The flow-weighted mean time comes out at about 1.13 hours into a
            3.1-hour quarter, rather than at the middle. That is because the flow is largest at the
            start, so the water is weighted towards the beginning of the release, and a report that
            assumed the midpoint would put the whole release half an hour late.
        takesAsRead:
          - The fundamental theorem, and the antiderivative it rests on
        assumes:
          - a mean weighted by a rate is the moment of that rate divided by its total
        takeaway: Parts trades one integral for another, and the trade is only worth making if the factor you differentiate disappears.
        format: DERIVE
        question: What is the flow-weighted mean time of the release, in hours into the ebb?
        answerText: >-
          About 1.13 hours. The moment is (π/2 − 1)/ω² = 2.22 hour-squared and the total is 1/ω =
          1.97 hours.
        why: >-
          The mean time is about 1.13 hours, not the 1.55 hours the midpoint would give. Parts turns
          the integral of a time times a cosine into a boundary term plus the integral of a sine,
          which comes out. Choosing to differentiate the time is what makes that happen: it becomes
          one and leaves. The moment divided by the total release is the mean, and it sits early in
          the quarter because the flow is largest at the start — which is the whole reason the
          quantity was asked for.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: M = ∫₀^{T} t·q₀·cos(ωt) dt
          startNote: ω = 0.5068 rad/h, T = 3.1 h so that ωT = π/2; the total release is ∫₀^T q₀cos(ωt)dt = q₀/ω
          goal: the flow-weighted mean time, in hours into the ebb
          askRule: true
          rules:
            - the choice of the two factors
            - integration by parts
            - evaluation at the two ends
            - antidifferentiation
            - rearrangement
          steps:
            - ask: Choose which factor to differentiate.
              answer: 1
              candidates:
                - text: differentiate the cosine, integrate the t
                  rule: the choice of the two factors
                  survives: true
                  why: >-
                    A legal choice that goes backwards. What comes back is a t squared multiplying a
                    sine, which is harder than what you started with, and every line of it is correct.
                - text: differentiate the t, integrate the cosine
                  rule: the choice of the two factors
                - text: differentiate both and multiply the results
                  rule: rearrangement
                  why: >-
                    That is not a rule about integrals at all. The derivative of a product is not the
                    product of the derivatives, and neither is the integral.
                - text: integrate both and subtract
                  rule: rearrangement
                  why: >-
                    There is one integral here, not two. Nothing licenses splitting a product into a
                    difference.
            - ask: Apply parts.
              answer: 2
              candidates:
                - text: M = q₀·[t·sin(ωt)] + q₀∫sin(ωt) dt
                  rule: integration by parts
                  why: >-
                    The one over ω from integrating the cosine has been dropped in both terms, and the
                    sign on the second is wrong as well.
                - text: M = q₀·[t·sin(ωt)/ω] + q₀∫sin(ωt)/ω dt
                  rule: integration by parts
                  survives: true
                  why: >-
                    The factors are right and the minus sign has gone. Parts subtracts the second
                    integral, and with a plus the boundary term and the integral add instead of partly
                    cancelling — giving 4.2 rather than 2.2.
                - text: M = q₀·[t·sin(ωt)/ω] − q₀∫sin(ωt)/ω dt
                  rule: integration by parts
                - text: M = q₀·[t·cos(ωt)/ω] − q₀∫cos(ωt)/ω dt
                  rule: integration by parts
                  why: >-
                    The cosine has not been integrated. The boundary term has to carry the
                    antiderivative of the factor you chose to integrate.
            - ask: Evaluate the boundary term at the two ends.
              answer: 0
              candidates:
                - text: [t·sin(ωt)/ω]₀^T = T/ω = 3.1 ÷ 0.5068 = 6.12 h²
                  rule: evaluation at the two ends
                - text: [t·sin(ωt)/ω]₀^T = 0, since the flow is nothing at T
                  rule: evaluation at the two ends
                  survives: true
                  why: >-
                    The flow is nothing at T because the cosine is; the sine at that instant is one, not
                    nothing. It is the right thought about the wrong function, and it removes the larger
                    of the two contributions.
                - text: [t·sin(ωt)/ω]₀^T = T·sin(T)/ω = 0.25 h²
                  rule: evaluation at the two ends
                  why: >-
                    The sine has been taken of the time rather than of ω times the time, so the argument
                    is 3.1 instead of π/2.
                - text: [t·sin(ωt)/ω]₀^T = T²/2ω = 9.5 h²
                  rule: rearrangement
                  why: >-
                    The t has been integrated a second time. It has already done its work in the
                    boundary term.
            - ask: Do the remaining integral and turn the moment into a mean.
              answer: 3
              candidates:
                - text: M = 6.12 + 1/ω² = 10.0 h², so the mean is 5.1 h
                  rule: rearrangement
                  why: >-
                    The remaining integral is subtracted, not added, and a mean time of 5.1 hours is
                    outside a release that lasts 3.1.
                - text: M = 6.12 − 1/ω² = 2.22 h², so the mean is 2.22 h
                  rule: rearrangement
                  survives: true
                  why: >-
                    The moment has been reported as the mean without dividing by the total release. The
                    number is inside the release window, which is what makes it survive a glance.
                - text: M = 6.12 − 1/ω = 4.15 h², so the mean is 2.1 h
                  rule: antidifferentiation
                  why: >-
                    Integrating the sine gives a second factor of one over ω. Only one has been applied.
                - text: M = 6.12 − 1/ω² = 2.22 h², and 2.22 ÷ 1.97 = 1.13 h
                  rule: rearrangement
          commit: Commit the derivation
      - group: FLATS
        task: Settle what splitting the fraction buys
        title: One fraction, two denominators
        concept: Partial fractions, and an integral that splits
        place: Mud Laboratory
        scene: >-
          Ude's silt model has the flats filling at a rate proportional both to how much silt is
          already there and to how much room is left. Separating it leaves one over a product of two
          brackets on the left, and the bench copy of the integral tables has nothing that fits.
        guide: >-
          Four claims about splitting one over a product into a sum of two simpler fractions. Ask of
          each what the split makes possible that was not possible before, and whether it changes the
          value of the integral. One of the four confuses making an integral doable with making it
          smaller.
        takesAsRead:
          - The fundamental theorem, and the antiderivative it rests on
        assumes:
          - a fraction with a factored denominator can be rewritten as a sum of simpler fractions
        takeaway: Splitting a fraction changes nothing about its value and everything about whether it can be integrated.
        format: CHOICE
        question: What does splitting one over the product of the two brackets achieve?
        why: >-
          It turns something with no standard antiderivative into two pieces that each have one, and
          each piece is a logarithm. The sum of the two fractions is identically equal to the
          original, so nothing about the quantity has changed: the same integral is being taken by a
          route that exists. Combined with separating the variables, that is what produces the
          S-shaped solution the flats actually follow, rising fastest when they are about half full.
        choices:
          - Each piece has a standard antiderivative, and their sum is the same quantity
          - The integral becomes smaller and therefore easier to bound
          - The two brackets can then be integrated independently of each other
          - It removes the need to separate the variables first
        answer: Each piece has a standard antiderivative, and their sum is the same quantity
        rebuttals:
          - The value is untouched by the rewriting; only the form it is written in changes.
          - The brackets are not integrated at all — the fractions built from them are.
          - Separation is what put the fraction on its own side in the first place, so it comes first.
      - group: PRED
        task: Ask Achterberg when to stop refining
        title: A bracket round a refinement
        concept: Alternating series, and the error after n terms
        place: Prediction Office
        person: true
        scene: >-
          Achterberg has been refining the springs prediction one correction at a time, and the
          corrections come in with alternating signs, each smaller than the last. She is at the
          fourth and the fifth is 0.011 metres.
        guide: >-
          Four claims about a sequence of corrections that alternate in sign and shrink. Ask of each
          what the next unused correction tells you about where the true value lies, and whether the
          answer needs any knowledge of the corrections after that one.
        assumes:
          - each correction is smaller in size than the one before it and has the opposite sign
        takeaway: With alternating shrinking corrections the answer is bracketed by two consecutive partial sums.
        format: CHOICE
        question: What can Achterberg say about the true value after four corrections?
        why: >-
          It lies within 0.011 metres of what she has, because the corrections alternate and shrink.
          Each partial sum overshoots and the next undershoots, so consecutive partial sums bracket
          the answer and the width of the bracket is the size of the first correction left out. That is
          a bound rather than an estimate, and it needs nothing about the corrections beyond the fifth.
          It is also the cheapest bound in the course: the number is already on the desk, unused.
        choices:
          - It is within 0.011 m of the total she has
          - It is within 0.011 m of the total she had after three corrections
          - It is larger than the total she has, by an unknown amount
          - Nothing, until the remaining corrections have been computed
        answer: It is within 0.011 m of the total she has
        rebuttals:
          - Three corrections in, the bracket is set by the fourth correction, which was larger than the fifth.
          - The direction is known from the sign of the next correction; it is the size that is bounded.
          - The bound needs only the first correction left out, which is exactly the one she is holding.
  # ---------------------------------------------------------------- day 12
  - title: The gate programme
    objective: Show the expansion is legitimate at the springs, and decide what the barrage closes on.
    briefing: The programme for day thirteen is signed this afternoon, with a surge on top of the largest range of the year.
    stake: >-
      Tuesday, and the springs are tomorrow. The prediction has the shallow-water term in it now and
      the surge forecast is holding at half a metre. Oyelaran will sign a gate programme this
      afternoon and Calloway will sign the prediction it rests on; the two signatures have been in
      tension for a fortnight and both are needed. Grieve has a hundred points of survey money left
      and four things she could spend it on. Today you show that the expansion is still legitimate
      when the head moves as far as it will tomorrow, spend what is left of the survey budget, and
      settle with the barrage master what the eastern gate closes on. Four hundred hectares and the
      marsh graziers' stock are behind that decision.
    takeaway: A prediction, a bound and a measurement are three different things, and a decision has to say which one it rests on.
    stops:
      - group: PRED
        task: Show the expansion is still legitimate at the springs
        title: How far the expansion reaches
        concept: The ratio test and the radius of convergence
        place: Prediction Office
        scene: >-
          Tomorrow the head moves by 1.40 metres about a mean of 2.1, once the surge is included.
          Calloway will not carry the expansion into the springs prediction until somebody has shown
          it converges that far out.
        guide: >-
          You build the working a line at a time. The test to use is the one that compares each term
          with the one before it: form that ratio, simplify it, and see what it settles down to as the
          terms go on. What it settles down to is a multiple of the movement, and the condition for
          the series to have a total tells you how large the movement may be.
        background:
          - >-
            Why the ratio and not the size. The terms here are a coefficient times a power of the
            movement. The coefficients on their own neither shrink nor grow in any obvious way, but the
            ratio of consecutive ones settles quickly, and that is what the test is built to use.
          - >-
            What the radius means physically. The series converges while the movement is smaller than
            the mean head — which is to say, while the head never reaches zero. That is not a
            mathematical accident: at zero head the three-halves power has an infinite derivative and
            no polynomial can follow it.
          - >-
            Why this matters today rather than yesterday. At 0.85 metres of movement the ratio is
            comfortable and nobody asks. At 1.40 with the surge it is two thirds, still inside, and if
            the surge had been forecast at 2.2 metres the answer would have been that the expansion
            cannot be used at all and the law would have to be computed directly.
        assumes:
          - the terms of the expansion are a coefficient times a power of the movement
        takeaway: The radius of convergence is a limit on where a series may be used, and it comes out of the ratio of consecutive terms.
        format: DERIVE
        question: How large may the head movement be before the expansion stops converging?
        answerText: >-
          Up to the mean head itself: the ratio settles at |η|/H, so the series converges for
          |η| < 2.1 m. Tomorrow's 1.40 m gives 0.67, inside it.
        why: >-
          The series converges while the movement is smaller than the mean head. The ratio of
          consecutive terms is the movement over the head times a factor built from the two
          coefficients, and that factor goes to one as the terms go on, so what is left is the
          movement over the head. The condition for a total is that this be less than one. Tomorrow's
          movement gives two thirds, so the expansion is legitimate — which is the answer, and it is
          not a statement about the surge being predictable.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: term n = cₙ·(η/H)ⁿ,  with cₙ₊₁/cₙ = (3/2 − n)/(n + 1)
          startNote: H = 2.1 m; tomorrow's movement including the surge is |η| = 1.40 m
          goal: the largest movement for which the expansion has a total
          askRule: true
          rules:
            - the ratio of consecutive terms
            - taking the limit
            - the condition on the ratio
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Form the ratio of consecutive terms.
              answer: 1
              candidates:
                - text: |cₙ₊₁/cₙ| on its own
                  rule: the ratio of consecutive terms
                  survives: true
                  why: >-
                    The powers of the movement have been left out of the ratio. The coefficients alone
                    settle at one, from which the conclusion would be that the series converges for
                    every movement — which it does not.
                - text: |cₙ₊₁/cₙ| × |η/H|
                  rule: the ratio of consecutive terms
                - text: |cₙ₊₁/cₙ| × |η/H|ⁿ
                  rule: the ratio of consecutive terms
                  why: >-
                    Dividing one term by the next leaves one power of the movement, not n of them. The
                    powers very nearly cancel.
                - text: |cₙ/cₙ₊₁| × |H/η|
                  rule: rearrangement
                  why: >-
                    Both ratios are the wrong way up. The condition that comes out of this is that the
                    movement must be larger than the head.
            - ask: Take the limit of that ratio as the terms go on.
              answer: 3
              candidates:
                - text: it goes to 3/2, so the limit is 1.5|η/H|
                  rule: taking the limit
                  survives: true
                  why: >-
                    The three halves in the numerator has been kept while the n beside it was dropped.
                    For large n the n dominates the constant, and the surviving ratio is one. This gives
                    a radius two thirds of the truth, which is still comfortably outside tomorrow's
                    movement.
                - text: it goes to 0, so the series converges for every movement
                  rule: taking the limit
                  why: >-
                    The numerator grows like n and so does the denominator, so the ratio settles at one
                    rather than falling away to nothing.
                - text: it grows without limit, so the series never converges
                  rule: taking the limit
                  why: >-
                    Both numerator and denominator grow at the same rate, so nothing here grows without
                    limit. The expansion plainly does work for small movements.
                - text: it goes to 1, so the limit is |η/H|
                  rule: taking the limit
            - ask: Apply the condition for the series to have a total.
              answer: 0
              candidates:
                - text: |η/H| < 1, so |η| < H = 2.1 m
                  rule: the condition on the ratio
                - text: |η/H| ≤ 1, so |η| ≤ H = 2.1 m
                  rule: the condition on the ratio
                  survives: true
                  why: >-
                    The boundary itself is exactly where the test says nothing, and at a movement equal
                    to the mean head the head reaches zero and the law has no expansion. Including the
                    equality claims the one case that has to be checked separately.
                - text: |η/H| < 1, so |η| < 1 m
                  rule: substitution of the stated values
                  why: >-
                    The condition is on the ratio, so clearing the H gives the head in metres and not a
                    bare one.
                - text: |η/H| > 1, so |η| > 2.1 m
                  rule: rearrangement
                  why: >-
                    The inequality has been reversed. A ratio larger than one is the divergent case, in
                    which the terms grow.
            - ask: Put tomorrow's movement in.
              answer: 2
              candidates:
                - text: 1.40 × 2.1 = 2.94, which is larger than one, so it cannot be used
                  rule: substitution of the stated values
                  why: >-
                    The movement has been multiplied by the head rather than divided by it, which is a
                    product of two lengths and cannot be compared with one at all.
                - text: 2.1 ÷ 1.40 = 1.50, which is larger than one, so it cannot be used
                  rule: rearrangement
                  survives: true
                  why: >-
                    The ratio has been formed upside down and duly comes out above one, so the
                    conclusion is that the expansion fails on exactly the day it works. Both numbers are
                    real and the division is the wrong way round.
                - text: 1.40 ÷ 2.1 = 0.67, which is less than one, so it converges
                  rule: substitution of the stated values
                - text: 1.40 − 2.1 = −0.70, which is less than one, so it converges
                  rule: rearrangement
                  why: >-
                    A difference rather than a ratio. It would say the expansion converges for every
                    movement smaller than the head plus one metre, in whatever unit happened to be used.
          commit: Commit the derivation
      - group: WALL
        task: Spend what is left of the survey budget
        title: A hundred points of survey money
        concept: A prediction, a bound and a measurement, and which of the three a decision rests on
        place: Wall Station
        scene: >-
          Grieve has a hundred points of survey money left in the year and four things she could
          spend it on. The licence review is in six weeks and will read whatever this fortnight
          produced.
        guide: >-
          What the station holds already: a returned fraction of 0.62 worked out of a fortnight of
          gauge records rather than measured off the wall; a shallow-water term now in the prediction
          but fitted to six stations, two of which have not been levelled since commissioning; a
          stilling well at the outer face that needs forty minutes and is the reason the gate call
          cannot wait for a reading; and two flats stations that need the launch and were missed last
          quarter. The wall itself was last surveyed before the eastern gate was re-gated.
        rules: >-
          A hundred points, whole points, across the four. Spending is scored on what a proposal
          would change about a future decision rather than on what it would tell you: a measurement
          that would move the gate call, or that would turn a number worked out of records into one
          measured directly, is worth more than a refinement of something already inside its own
          bound.
        assumes:
          - money spent on a measurement is worth what the measurement would change
        takeaway: Evidence is worth what it would change about a decision, not what it would add to a record.
        format: SCIENCETANK
        task: Spread a hundred points across the four.
        proposals:
          - { label: A, text: Survey the wall and measure the returned fraction directly. }
          - { label: B, text: Level the two unlevelled stations so the shallow-water fit has a datum. }
          - { label: C, text: "Fit a fast pressure sensor at the outer face, alongside the well." }
          - { label: D, text: Charter the launch for a quarter so no flats station is missed. }
        recommended: { A: 40, B: 30, C: 20 }
        why: >-
          The wall survey and the levelling both convert a number worked out of records into a
          measured one, and both feed decisions that are made repeatedly: the armour sizing and every
          future prediction at those stations. The fast sensor is worth something because the whole
          gate-timing argument rests on the well needing forty minutes, and a sensor that does not
          would remove the trade-off rather than sharpen it. The launch charter is real work and it
          improves a record rather than changing a decision, which is why it comes last.
      - group: SLUICE
        task: Settle with Oyelaran what the eastern gate closes on
        title: What the gate closes on
        concept: Truncating a sum, and stating what was left out
        place: Sluice Control
        person: true
        scene: >-
          Oyelaran has four things on the desk and one signature to give. The programme goes to the
          gate crews at four o'clock, the marsh warning with it, and tomorrow is the largest range of
          the year.
        guide: >-
          Four readings of the same four pieces of paper. Look at every one of them before choosing,
          including the two that are not alarming: a bound that has been computed honestly and a fit
          that now contains a term it did not have. What separates the explanations is which of the
          four quantities on the desk the level tomorrow actually depends on.
        assumes:
          - a decision has to name the quantity it is being made on
        takeaway: A prediction with a bound and a term added is still silent about anything that is not in the sum.
        format: DIAGNOSIS
        headline: The prediction is better than it has ever been, and Oyelaran is still not closing on it.
        task: Which account fits all four pieces of paper on the desk?
        readings:
          - { zone: Prediction, label: Springs high water, value: 11.4 m range, status: normal }
          - { zone: Tail bound, label: Dropped constituents, value: ±0.19 m, status: normal }
          - { zone: Shallow-water fit, label: Overtide now included, value: 3 % of discharge, status: normal }
          - { zone: Weather service, label: Wind-driven water, value: 0.55 m, status: alarm }
        choices:
          - { label: The prediction is not accurate enough to act on, mechanism: Nine years of record is too short to fit a station this shallow. }
          - { label: The level tomorrow has a term in it that no bound on the desk covers, mechanism: Both bounds are computed from models that contain nothing wind-driven. }
          - { label: The tail bound is too small and should be widened, mechanism: The dropped amplitudes were added up wrongly and the real tail is larger. }
          - { label: The shallow-water term makes the surge unnecessary to consider, mechanism: The overtide already carries the asymmetry the surge would produce. }
        answer: The level tomorrow has a term in it that no bound on the desk covers
        why: >-
          Three of the four pieces of paper are in good order and the fourth is not on the same
          footing as them. The prediction is better than it has ever been and its bound is honestly
          computed; the shallow-water term is a real improvement fitted to real records. All of that
          is about terms that repeat. The surge does not repeat, so it is in none of those models and
          therefore in none of their bounds, and it is half a metre on the largest range of the year.
          The gate closes on the gauge, with the prediction deciding when somebody is standing at it.


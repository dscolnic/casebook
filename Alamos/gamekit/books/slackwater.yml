          commit: Commit the derivation
      - group: PRED
        task: Settle what a shrinking term proves
        title: Small terms and no total
        concept: The nth-term test, and what it can and cannot settle
        place: Prediction Office
        scene: >-
          Achterberg has two lists on the wall. In both of them the terms get steadily smaller and
          go to nothing in the end. One of the two sums settles on a value and the other does not,
          and Calloway wants to know how the office is supposed to tell.
        guide: >-
          Four claims about a sum whose terms go to nothing. Ask of each what it would license you
          to write in a report. The distinction that decides it is between a test that can rule a
          sum out and a test that can rule one in, because the terms going to zero is necessary for
          a total and nowhere near sufficient for one.
        assumes:
          - a sum can only settle if its terms eventually become small
        takeaway: Terms going to zero is required for a sum to have a total and is not evidence that it has one.
        format: CHOICE
        question: What does knowing the terms go to zero let the office conclude?
        why: >-
          It licenses nothing on its own. If the terms do not go to zero the sum certainly has no
          total, so the test can throw a sum out. It cannot let one in: the terms one over n go to
          zero and their sum grows without limit, while the terms one over n squared go to zero and
          their sum settles. Both have vanishing terms, so whatever separates them is not the size
          of a single term but how fast the sizes fall away.
        choices:
          - Nothing on its own, though terms that did not go to zero would settle it
          - That the sum has a total, since the terms eventually add nothing
          - That the sum has no total, since infinitely many terms are still being added
          - That the sum has a total if the terms are also all positive
        answer: Nothing on its own, though terms that did not go to zero would settle it
        rebuttals:
          - The terms one over n go to zero and their sum passes every value eventually.
          - Terms that shrink fast enough do give a total, so the number of terms cannot settle it either.
          - Positive terms that shrink slowly still have no total; the harmonic series is all positive.
      - group: TRACK
        task: Ask Palmer what one float is evidence of
        title: Nine floats back out of eleven
        concept: A prediction, a bound and a measurement, and which of the three a decision rests on
        place: Survey Pontoon
        person: true
        scene: >-
          Palmer has signed two reports she was unhappy with, both of which took a single float's
          track as the transport pattern of the estuary. Float 7 is about to become the third if

      - group: SLUICE
        task: Ask Beke what happens to a rate while it is being used
        title: The rate does not wait
        concept: A rate of change, and the derivative as a rate
        place: Sluice Control
        person: true
        scene: >-
          Beke has the gate table on the desk: what to do at the top of each half hour, worked out
          from the flow at the moment the row was written. The flow through a part-open gate depends
          on the head, and the head is closing all the time.
        guide: >-
          All four options describe something that happens over a half-hour row of the table. The
          question is what using a single instantaneous rate for a whole interval actually assumes
          about that interval, and which way the resulting error goes when the rate is falling
          throughout.
        assumes:
          - a rate quoted at an instant is the rate at that instant only
        takeaway: A rate used over an interval is an assumption that it held for the interval, and it usually did not.
        format: CHOICE
        question: What does the table assume by using the flow at the top of each half hour?
        why: >-
          It assumes the flow held for the whole half hour. Through a part-open gate the flow
          depends on the head across it, and the head closes as the impoundment fills, so the true flow
          falls throughout the interval. Taking the value at the start therefore overstates the
          water passed, and the error grows with the length of the interval. This is exactly the
          assumption behind stepping a differential equation forward in flat pieces, and its cost
          can be computed rather than argued about.
        choices:
          - That the flow held at its top-of-the-hour value for the whole half hour
          - That the head across the gates was constant for the whole day
          - That the flow depends on the gate opening and not on the head
          - That the impoundment is large enough for its level not to change
        answer: That the flow held at its top-of-the-hour value for the whole half hour
        rebuttals:
          - The table is rewritten every half hour precisely because the head changes across the day.
          - The table's own rows come from the head, so it plainly does depend on it.
          - The level in the impoundment changes by metres in a tide, and the table's rows are written from it.
  # ---------------------------------------------------------------- day 4
  - title: What the tail can be worth
    objective: Put a ceiling on what twenty-nine dropped constituents can do, and compare it with waiting.
    briefing: Calloway wants the gate call made on the board; Oyelaran wants it made on the gauge.
    stake: >-
      Thursday, and the argument that runs this barrage arrives at a number for the first time.
      Calloway holds that the board can be acted on because what it leaves out can be bounded.
      Oyelaran holds that the gates close on the gauge, and that a prediction is somebody's opinion
      about water that has not arrived. Achterberg has the twenty-nine dropped amplitudes on the
      wall and nobody has ever added them up. Today you put a ceiling on the whole dropped tail,
      work out what the level does while a gauge is being waited for, and ask Pieter Loots, the
      instrument technician, what a meter's reading actually is. Whichever way the eastern gate is
      programmed on day thirteen, it will be defended with one of those two numbers.
    takeaway: A bound on what a sum left out is a number, and it can be compared with the cost of waiting.
    stops:
      - group: PRED
        task: Put a ceiling on the twenty-nine dropped terms
        title: What twenty-nine terms can be worth
        concept: Truncating a sum, and stating what was left out
        place: Prediction Office
        scene: >-
          Achterberg has the dropped list in order of size: 0.041, 0.033, 0.028 and 0.022 metres,
          then twenty-five smaller ones totalling 0.066. Calloway wants the worst those twenty-nine
          can do to a predicted level.
        guide: >-
          You build the working a line at a time. The remainder is the sum of the terms you did not
          add, and each of them is an amplitude times a cosine of something. Nothing is known about
          those angles at the hour that matters, so the step that pays is the one that stops needing
          to know: a cosine cannot exceed one in size, whatever its argument.
        background:
          - >-
            Why a bound and not an estimate. The dropped terms are at twenty-nine different speeds,
            so at any particular hour some add and some subtract, and the sum is almost always far
            smaller than the worst case. But which hour you care about is not known when the bound
            is written, so the honest quantity is the ceiling rather than the likely value.
          - >-
            Where the triangle inequality comes in. The size of a sum is at most the sum of the
            sizes. That is all that is being used, and it is what makes the result independent of
            every phase in the list — which is the property that makes it worth printing.
          - >-
            Why the comparison at the end is the point of the day. A bound is only useful against
            something. Twenty centimetres either way is a great deal in a shallow estuary and
            almost nothing beside what the level does in the forty minutes a stilling well needs to
            settle, and knowing which is which is what decides how the gates are programmed.
        takesAsRead:
          - Alternating series, and the error after n terms
        assumes:
          - a cosine is never larger than one in size, whatever its argument
          - the size of a sum is at most the sum of the sizes of its terms
        takeaway: A truncated sum has a ceiling on its error that needs no knowledge of the dropped terms' phases.
        format: DERIVE
        question: What is the largest the twenty-nine dropped constituents can contribute at any hour?
        answerText: >-
          At most 0.19 m. Every dropped cosine is bounded by one in size, so the tail is bounded by
          the sum of its own amplitudes: 0.041 + 0.033 + 0.028 + 0.022 + 0.066.
        why: >-
          The tail cannot exceed 0.19 metres. Each dropped term is an amplitude times a cosine, and
          a cosine never exceeds one in size, so each term is bounded by its own amplitude whatever
          its phase happens to be. The size of the sum is then at most the sum of those bounds. This
          is a ceiling rather than an estimate: at almost every hour the twenty-nine terms partly
          cancel and contribute a few centimetres. What makes it worth having is that it holds at
          every hour without anybody knowing the phases.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: R = Σ_{n=9}^{37} Aₙ·cos(ωₙt − φₙ)
          startNote: the twenty-nine dropped amplitudes are 0.041, 0.033, 0.028, 0.022 and twenty-five more totalling 0.066 m
          goal: a ceiling on |R| in metres, valid at any hour
          askRule: true
          rules:
            - the size of a cosine
            - triangle inequality
            - substitution of the fitted values
            - comparison of magnitudes
            - rearrangement
          steps:
            - ask: Bound the size of one dropped term.
              answer: 1
              candidates:
                - text: |Aₙ·cos(ωₙt − φₙ)| ≤ Aₙ·ωₙ
                  rule: the size of a cosine
                  why: >-
                    An angular speed has no business in a height. Multiplying an amplitude by degrees
                    an hour gives a quantity that is not a level at all.
                - text: |Aₙ·cos(ωₙt − φₙ)| ≤ Aₙ
                  rule: the size of a cosine
                - text: |Aₙ·cos(ωₙt − φₙ)| ≤ Aₙ/2
                  rule: the size of a cosine
                  survives: true
                  why: >-
                    A cosine averages to zero and its size averages to about two thirds, so a half
                    looks like a reasonable typical value. It is not a bound: at the hour the cosine
                    is one, the term is twice this.
                - text: |Aₙ·cos(ωₙt − φₙ)| ≤ 1
                  rule: the size of a cosine
                  why: >-
                    The bound on the cosine has been applied to the whole term. One metre is a bound,
                    and it is useless: it is larger than every amplitude in the list put together.
            - ask: Bound the size of the whole sum.
              answer: 3
              candidates:
                - text: |R| ≤ √(Σ Aₙ²)
                  rule: triangle inequality
                  survives: true
                  why: >-
                    That is the root sum of squares, which is the right combination for independent
                    random errors and the wrong one here. It gives 0.06 m, three times smaller, and
                    nothing about these terms is random — their phases are fitted constants.
                - text: |R| ≤ 29 × max Aₙ
                  rule: comparison of magnitudes
                  why: >-
                    A bound, and a very loose one: 1.19 m, larger than the whole tail by a factor of
                    six, because it treats every term as though it were the largest.
                - text: |R| ≤ Σ Aₙ − A₉
                  rule: rearrangement
                  why: >-
                    The largest term has been removed from its own bound. Nothing licenses dropping a
                    term from a sum of sizes.
                - text: |R| ≤ Σ Aₙ
                  rule: triangle inequality
            - ask: Put the fitted amplitudes in.
              answer: 2
              candidates:
                - text: 0.041 + 0.033 + 0.028 + 0.022 = 0.124 m
                  rule: substitution of the fitted values
                  survives: true
                  why: >-
                    The twenty-five smaller terms have been left out of the bound, which is the same
                    mistake one level down: a tail dropped from a calculation about a dropped tail.
                - text: 29 × 0.041 = 1.19 m, the largest amplitude taken twenty-nine times
                  rule: substitution of the fitted values
                  why: >-
                    Every term has been given the largest amplitude. That was the loose bound rejected
                    at the previous line.
                - text: 0.041 + 0.033 + 0.028 + 0.022 + 0.066 = 0.19 m
                  rule: substitution of the fitted values
                - text: 0.041 + 0.066 = 0.107 m
                  rule: substitution of the fitted values
                  why: >-
                    Only the largest term and the block of small ones have been added, and the second,
                    third and fourth have gone missing between them.
            - ask: Compare that ceiling with waiting forty minutes for the gauge to settle, at 0.9 m/h.
              answer: 0
              candidates:
                - text: the level moves 0.60 m in that time, three times the bound
                  rule: comparison of magnitudes
                - text: the level moves 0.15 m in that time, less than the bound
                  rule: comparison of magnitudes
                  survives: true
                  why: >-
                    Forty has been read as a fraction of an hour by dividing by four rather than by
                    sixty, or the rate has been halved. The comparison then reverses and the argument
                    of the whole day comes out the other way.
                - text: the level moves 36 m in that time, so no comparison is needed
                  rule: substitution of the fitted values
                  why: >-
                    Rate in metres an hour times a time in minutes. The units have not been made to
                    agree, and the answer is deeper than the estuary.
                - text: the two cannot be compared, since one is a bound and one is a movement
                  rule: comparison of magnitudes
                  why: >-
                    Both are heights of water in metres. A bound is worth having precisely because it
                    can be put beside the other costs of a decision.
          commit: Commit the derivation
      - group: SLUICE
        task: Work out what the level does while the gauge settles
        title: Forty minutes of water
        concept: A rate of change, and the derivative as a rate
        place: Sluice Control
        scene: >-
          The stilling well at the outer face needs about forty minutes before Oyelaran will read a
          level off it as settled. On a spring ebb the level outside is falling at nine tenths of a
          metre an hour.
        guide: >-
          Four quantities are offered and two of them make the answer. The trap is the time: a rate
          in metres an hour has to meet a time in hours, and the forty is in minutes. The prediction
          bound is on the list because the answer is going to be compared with it, not because it
          belongs in the arithmetic.
        assumes:
          - a rate multiplied by a time gives the change over that time, in the rate's own units
        takeaway: The cost of waiting for a measurement is measured in the same units as the error of not waiting.
        format: BALLPARK
        question: How much does the level outside move while the well is settling?
        estimate:
          prompt: >-
            Oyelaran will not read the well until it has settled. This is what the water does in the
            meantime, and it is the other half of the comparison Calloway is asking for.
          question: How much does the level outside move while the well is settling?
          relationship: >-
            Level change = the rate the level is moving multiplied by the waiting time, with both in
            the same unit of time.
          labels:
            - 0.9 m/h  (rate the level is falling)
            - 0.667 h  (the forty-minute wait, in hours)
            - 40 min  (the same wait, in minutes)
            - 0.19 m  (the ceiling on the twenty-nine unused terms)
          values: [0.9, 0.667, 40, 0.19]
          slots: 2
          template: '{0} × {1}'
          formula: a*b
          correct: [0, 1]
          target: 0.60
          tolerance: 0.05
          units: m
          solution: 0.9 × 0.667 = 0.60 m of level while the well settles.
          explanation: >-
            The wait has to be in hours because the rate is per hour. Using the forty directly gives
            36 metres, which is deeper than the estuary and is the commonest way this arithmetic
            fails.
        why: >-
          The level moves about 0.60 metres. That is three times this morning's ceiling on the
          twenty-nine unused terms, which is what makes today's argument decidable rather than a matter
          of temperament: on a fast ebb the price of waiting for a settled reading is larger than
          the worst the board can be wrong by. It does not settle the argument for every day. It
          settles it for a day when the level is moving at nine tenths of a metre an hour.
      - group: ROSE
        task: Ask Loots what a meter's reading is
        title: Ten minutes of current, in one number
        concept: The definite integral as an accumulation of a rate
        place: Currents Room
        person: true
        scene: >-
          Loots has meter three open on the bench. It reports one speed and one bearing every ten
          minutes. Inside, it is sampling several times a second and doing something to those
          samples before anything is written down.
        guide: >-
          All four options are things the number on the record could be. Ask of each what it would
          take to produce it from several hundred samples, and which of them can still be recovered
          afterwards from the one figure that was kept.
        assumes:
          - an average over an interval is the accumulated quantity divided by the length of the interval
        takeaway: A reported reading is an accumulation divided by its own interval, and what happened inside the interval is gone.
        format: CHOICE
        question: What is the number meter three writes down every ten minutes?
        why: >-
          It is the mean over the ten minutes: the samples accumulated and divided by the length of
          the interval, which is what an average value is. Anything that happened faster than ten
          minutes is inside that accumulation and cannot be got back out of it. That matters when
          the record is compared with a float, because the float is somewhere specific at each
          instant while the meter has already smoothed the instants together.
        choices:
          - The mean of the samples taken across those ten minutes
          - The largest speed reached during those ten minutes
          - The speed at the instant the ten minutes ended
          - The total distance the water moved in those ten minutes
        answer: The mean of the samples taken across those ten minutes
        rebuttals:
          - A peak is one sample out of hundreds, and a record of peaks would rise with the sampling rate.
          - A single instant would be as noisy as the water, which is why the samples are combined at all.
          - A distance would grow with the length of the interval, and this number does not.
  # ---------------------------------------------------------------- day 5
  - title: Speed against bearing
    objective: Get a number out of a figure that has no axes.
    briefing: The sediment work needs the ebb and the flood compared, and they are drawn as roses.
    stake: >-
      Friday, and the sediment section of the licence report is the part that has been rewritten
      twice. Vos has a fortnight of meter records plotted as two roses, one for the ebb and one for
      the flood, and Ude needs them compared as quantities rather than looked at. Nobody in the
      building has ever taken a number off one of these figures. Today you get the area enclosed by
      the ebb rose, compare it with the flood rose, and go out to the wall to hear from Jonas Fell,
      the wall keeper, what the gauge at the head does after the gates have turned. The asymmetry
      between those two roses is the whole reason the eastern flats are building up and the western
      ones are not.
    takeaway: A curve given as a reach at each bearing encloses an area, and the area is a comparable number.
    stops:
      - group: ROSE
        task: Take the area enclosed by the ebb rose
        title: Wedges round a figure
        concept: Area of a polar region as half the integral of r squared
        place: Currents Room
        scene: >-
          Vos has the ebb rose fitted: the reach at each bearing is 1.4 plus 0.9 times the cosine
          of the bearing, in metres a second, over the half turn the ebb occupies. She wants the
          area the figure encloses.
        guide: >-
          You build the working a line at a time. There are no axes to integrate against here, so
          the piece to work with is a thin wedge at one bearing: nearly a triangle, with the reach
          as its two long sides and a very short base. Adding the wedges round the figure is the
          integral, and the square in it is why the expansion has to be done before anything can be
          integrated.
        background:
          - >-
            Why a wedge and not a strip. A rose has no top and bottom, so a vertical strip cuts it
            in places that mean nothing. A wedge of angle dθ at reach r has area very nearly
            ½r²dθ, because it is a triangle with base r·dθ and height r, and the error in that
            approximation vanishes faster than the wedge does.
          - >-
            Why the square is the awkward part. The reach is a sum of two terms, so its square has
            three: a constant, a cosine, and a cosine squared. The last one has to be rewritten
            using the double-angle form before it can be integrated, and it is the term that
            carries the asymmetry between the two halves of the tide.
          - >-
            What the number is for. On its own the area is an index rather than a physical
            quantity: its units are the square of a speed times an angle. What makes it worth
            having is that the same construction applied to the flood rose gives a number in the
            same units, and the difference between them is the transport asymmetry the flats are
            being built out of.
        takesAsRead:
          - The definite integral as an accumulation of a rate
          - Polar coordinates, and a curve given as r of theta
        assumes:
          - a thin wedge of angle dθ at reach r has area very nearly one half r squared dθ
        takeaway: A polar area is half the integral of the square of the reach, and the square is what makes the expansion necessary.
        format: DERIVE
        question: What area does the ebb rose enclose, over the half turn it occupies?
        answerText: >-
          About 6.24 in units of speed squared times radians. The square expands into a constant, a
          cosine and a cosine squared, and only the first and last survive the half turn.
        why: >-
          The area comes out at about 6.24. A wedge at bearing θ has area one half r squared dθ,
          so the area of the whole figure is half the integral of the square of the reach. Squaring
          the reach gives three terms, and each is integrated on its own: the constant gives 1.96
          times π, the plain cosine integrates to zero over a symmetric half turn, and the cosine
          squared has to be rewritten as one half of one plus the double angle before it will
          integrate at all.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: r(θ) = 1.4 + 0.9·cos θ
          startNote: metres a second, with θ the bearing in radians; the ebb occupies θ from −π/2 to +π/2
          goal: the area the rose encloses over that half turn
          askRule: true
          rules:
            - area of a thin wedge
            - expansion of a square
            - the double-angle form
            - term-by-term integration
            - evaluation at the two ends
            - rearrangement
          steps:
            - ask: Write the area as an integral.
              answer: 2
              candidates:
                - text: A = ∫ r dθ
                  rule: area of a thin wedge
                  survives: true
                  why: >-
                    That is the sum of the reaches, which is a length times an angle rather than an
                    area. It integrates cleanly and gives 4.4, which is the right order of magnitude
                    and the wrong quantity.
                - text: A = ∫ 2πr dθ
                  rule: area of a thin wedge
                  why: >-
                    That is the circumference of a full circle at each reach. Nothing here is a full
                    circle, and an area does not have a 2π in it from this construction.
                - text: A = ½∫ r² dθ
                  rule: area of a thin wedge
                - text: A = π∫ r² dθ
                  rule: rearrangement
                  why: >-
                    The half in front comes from the area of a triangle. Replacing it with π is
                    borrowing the area of a circle for a shape that is not one, and it is six times
                    too large.
            - ask: Square the reach and expand it.
              answer: 3
              candidates:
                - text: r² = 1.96 + 0.81·cos²θ
                  rule: expansion of a square
                  survives: true
                  why: >-
                    The cross term has been dropped. It is the term that integrates to zero over this
                    particular half turn, so the final answer is right — and over the flood half, which
                    is not symmetric about the same axis, the same line is wrong.
                - text: r² = 1.96 + 2.52·cos θ
                  rule: expansion of a square
                  why: >-
                    The square of the cosine term has gone missing. That term carries the asymmetry
                    and is the reason the two roses differ at all.
                - text: r² = (1.4 + 0.9·cos θ)² = (1.4 + 0.9)²·cos²θ
                  rule: rearrangement
                  why: >-
                    The constant and the cosine cannot be added before the cosine is evaluated. As
                    written, the reach is zero at ninety degrees, which the rose plainly is not.
                - text: r² = 1.96 + 2.52·cos θ + 0.81·cos²θ
                  rule: expansion of a square
            - ask: Deal with the cosine squared.
              answer: 0
              candidates:
                - text: cos²θ = ½(1 + cos 2θ)
                  rule: the double-angle form
                - text: cos²θ = 1 − sin²θ
                  rule: rearrangement
                  survives: true
                  why: >-
                    A true identity that has not helped: the sine squared is exactly as hard to
                    integrate as the cosine squared, so the working goes round in a circle rather than
                    wrong.
                - text: cos²θ = cos 2θ
                  rule: the double-angle form
                  why: >-
                    A cosine squared is never negative and cos 2θ is negative over half its range, so
                    these cannot be the same function.
                - text: cos²θ = ½·cos 2θ
                  rule: the double-angle form
                  why: >-
                    The constant half has been dropped. That constant is the whole average value of a
                    cosine squared, and losing it removes 1.27 from the answer.

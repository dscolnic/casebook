  # ---------------------------------------------------------------- day 6
  - title: What comes back, and comes back again
    objective: Add up a chain of reflections, and say when such a chain has a total at all.
    briefing: The wall head reads higher than the first arrival, on every spring tide.
    stake: >-
      Monday, and the wall has not been surveyed since the eastern gate was re-gated last March.
      Marta Grieve, the structures and resonance engineer, has a fortnight of gauge records from the
      head and a first arrival of 0.34 metres on each of them, against a reading at the head that
      goes to nearly nine tenths of a metre. She is working the returned fraction out of the records
      rather than out of the wall. Today you add the chain of returns up, settle what a shrinking
      term does and does not prove about a sum, and ask Palmer what one float is evidence of. The
      armour on the last forty metres of that wall was placed for a design wave, and the design wave
      was the first arrival.
    takeaway: A chain of returns each a fixed fraction of the last has a finite total, and the total is not the first term.
    stops:
      - group: WALL
        task: Add up the chain of returns at the wall head
        title: Nine tenths out of a third
        concept: Geometric series, and the sum of a reflection chain
        place: Wall Station
        scene: >-
          Grieve has the numbers from the head: a first arrival of 0.34 metres, and each return
          about 0.62 of the one before it, arriving in step with the next forcing. She wants what
          the chain adds up to.
        guide: >-
          You build the working a line at a time. Write what the nth return is worth first, then the
          partial sum of the first few, then look at what the partial sums are doing. The step that
          decides the answer is the one that notices what kind of sum this is, because the closed
          form only exists for that kind and only when the returned fraction is less than one.
        background:
          - >-
            Why the returns arrive in step. The round trip along three hundred metres of wall and
            back takes about as long as the forcing period at this station, so each return arrives
            with the crest of the next one rather than against it. If it arrived against them they
            would cancel and the head would read less than the first arrival, not more.
          - >-
            Why the sum is finite. Each return is a fixed fraction of the last, so the terms shrink
            geometrically and the partial sums close on a value. What decides the total is not how
            many returns there are but how much of each one survives the round trip: at 0.62 the
            total is 2.6 times the first arrival, and at 0.8 it would be five times.
          - >-
            What this changes about the armour. The last forty metres of armour was sized for the
            first arrival, which is the wave anybody standing at the gates would measure. The
            quantity the armour actually meets is the total, and the ratio between the two is
            decided by the returned fraction and by nothing else.
        assumes:
          - each return arrives in step with the next forcing rather than against it
        takeaway: A geometric sum is set by the fraction that survives one round trip, not by the number of returns.
        format: DERIVE
        question: What does the chain of returns add up to at the wall head?
        answerText: >-
          About 0.89 m, from 0.34 ÷ (1 − 0.62). The chain is geometric with a ratio of 0.62, which
          is less than one, so the sum exists.
        why: >-
          The total is about 0.89 metres, against a first arrival of 0.34. The nth return is the
          first arrival times the returned fraction n times over, which makes the chain geometric.
          A geometric sum with a ratio smaller than one in size closes on the first term divided by
          one minus the ratio, and the ratio here is 0.62, so the total is 2.6 times the first
          arrival. The condition matters as much as the formula: at a ratio of one the chain has no
          total, and the algebra would still produce a number.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: a₀ = 0.34 m,  each return = 0.62 × the one before it
          startNote: the round trip along the wall and back takes about one forcing period, so the returns arrive in step
          goal: the total height at the wall head, in metres
          askRule: true
          rules:
            - the form of the nth term
            - the partial sum
            - recognising a geometric series
            - the condition on the ratio
            - substitution of the fitted values
          steps:
            - ask: Write down what the nth return is worth.
              answer: 3
              candidates:
                - text: aₙ = 0.34 − 0.62n
                  rule: the form of the nth term
                  why: >-
                    That takes a fixed amount off each time rather than a fixed fraction, and it goes
                    negative at the first return. A reflection cannot subtract height it never had.
                - text: aₙ = 0.34 × 0.62 × n
                  rule: the form of the nth term
                  survives: true
                  why: >-
                    A fraction applied once and then multiplied by how many returns there have been.
                    The terms grow instead of shrinking, so the sum has no total at all — and the first
                    two terms are exactly right, which is what makes it survive a spot check.
                - text: aₙ = 0.34 × 0.62ⁿ⁺¹
                  rule: the form of the nth term
                  why: >-
                    The first arrival has been given a reflection it has not had yet. At n = 0 this
                    gives 0.21 m rather than the 0.34 m the gauge records.
                - text: aₙ = 0.34 × 0.62ⁿ
                  rule: the form of the nth term
            - ask: Write the total of the first N returns.

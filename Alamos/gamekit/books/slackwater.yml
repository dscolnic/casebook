      - group: WALL
        task: Sum the entire chain of wave returns at the wall
        title: How high do all the reflected waves add up?
        reason: The wall cannot be checked against the first arriving wave if later reflections arrive in step and add to it
        concept: Geometric series, and the sum of a reflection chain
        place: Wall Station
        at: wallgauge
        scene: >-
          Grieve, the structures and resonance engineer, measures a first rise of 0.34 metres at the wall head. Each round trip sends back about
          62 percent of the previous wave, and the timing brings the returns back in step. She wants the
          total of the whole geometric chain.
        guide: >-
          You will build this a line at a time. First, write what the nth return is worth.
          Then write the partial sum — the total of just the first few returns. Next, look at
          what those partial sums are doing as you add more terms. The key step is naming what
          kind of sum this is. A neat formula for the total — a closed form — only exists for
          that kind of sum. It exists only when the returned fraction is less than one.
        background:
          - >-
            Why the returns arrive in step. Three hundred metres out and back along the wall.
            That takes about as long as the forcing period at this station — one tide cycle.
            So each returning wave lines up with the crest of the next wave, instead of
            against it. If the waves arrived against each other, they would cancel out. Then
            the wall head would read less than the first arrival, not more.
          - >-
            Why the sum settles on one number. Each return is the same fraction of the one
            before it. So the terms shrink at a steady rate — this is called shrinking
            geometrically. Because of that, the partial sums close in on one value instead of
            growing forever. What decides the final total is not how many returns there are.
            It is how much of each return survives the round trip. At a returned fraction of
            0.62, the total is 2.6 times the first arrival. At 0.8, it would be five times as
            large.
          - >-
            What this means for the armour. The last forty metres of armour was sized for the
            first arrival. That is the wave anyone standing at the gates would measure. But the
            armour actually has to meet the total, the full sum of the whole chain. How much
            bigger the total is than the first arrival depends only on the returned fraction.
            It depends on nothing else.
        assumes:
          - each return arrives in step with the next forcing rather than against it
        takeaway: What decides the size of a geometric sum is the fraction that survives one round trip. It is not how many returns you count.
        format: DERIVE
        question: What total rise does the full chain of reflected waves produce at the wall head?
        answerText: >-
          About 0.89 m, from 0.34 ÷ (1 − 0.62). The chain is geometric with a returned fraction
          of 0.62. Since that's less than one, the sum settles on a real number instead of
          growing forever.
        why: >-
          The total is about 0.89 metres, against a first arrival of 0.34. The nth return
          equals the first arrival times the returned fraction raised to the nth power. That is
          the pattern that makes this a geometric series. A geometric series like this settles
          on the first term over one minus the fraction. Here the fraction is 0.62, so the
          total is 2.6 times the first arrival. The condition matters as much as the formula.
          At a fraction of one, there's no real total, though the algebra would still give a
          number.
        derive:
          hint: Each line must follow from the line above it. Every line needs a rule that allows it.
          start: a₀ = 0.34 m,  each return = 0.62 × the one before it
          startNote: the round trip along the wall and back takes about one forcing period — one tide cycle — so the returns arrive in step
          goal: the total height at the wall head, in metres

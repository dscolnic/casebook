          estuary. Float 7 is about to become the third. She wants the claim narrowed to what this one
          path actually measured.
        guide: >-
          Palmer is not being fussy. She has signed this mistake twice and does not want a
          third. Two of the words on the list are worth having before you choose. The harmonic
          prediction is the tide worked out from the sun and moon's cycles. The exchange
          fraction is how much of the impoundment's water swaps out each tide. Now go down the
          options and ask of each one whether it treats the float as a measurement of what
          happened. Or as a model of what generally happens. Then ask what that difference
          costs a reader making a decision two years from now.
        assumes:
          - a measurement describes the occasion it was taken on
        takeaway: A measurement is evidence for its own occasion. It becomes a model only when someone says so in writing.
        format: CHOICE
        question: What is float 7's track directly evidence for?
        why: >-
          It is evidence of what the water did during those eleven days. That's worth a lot —
          it's the only direct measurement of transport this estuary has. What it can't do is
          stand in for the general pattern. Two weeks of tides has one run of winds and one
          spring–neap phase. That's where tides swing extra strong or extra weak. A prediction covers
          the general case and comes with a bound, a stated range of error. A measurement
          covers one case exactly. Reports go wrong when a measurement gets promoted into a
          prediction.
        choices:
          - What the water did during the eleven days it was out
          - The transport pattern of the estuary in general
          - The error in the harmonic prediction over the same period
          - The exchange fraction of the impoundment per tide
        answer: What the water did during the eleven days it was out
        rebuttals:
          - Two weeks contains just one spring–neap phase and one run of weather. So it can't speak for every two weeks there's ever been.
          - The prediction is a water level at the gates. The float is a position out in the estuary. Neither one puts a limit on the other.
          - An exchange fraction belongs to a whole volume of water. One float only samples a single point, not a volume.
  # ---------------------------------------------------------------- day 7
  - title: Closing the gates changes the water
    objective: Solve the changing fill behind the gates and test how much error enters when a storm model is stepped forward.
    briefing: Six working days remain. The gate plan needs to know how quickly water backs up once the gates begin to close.
    stake: >-
      The basin behind the barrage does not fill at a constant rate: the smaller the level difference
      becomes, the slower the flow gets. Today you solve that feedback exactly, then take one half-hour
      step of the storm model and see why a fixed fraction exchanged each tide never means the water is
      simply gone.
    takeaway: When a rate changes because the quantity itself changes, calculus has to follow that feedback rather than freeze it.
    segue: >-
      The basin takes about thirty-two minutes to fill under the stated conditions, and the storm model
      can be stepped forward one interval at a time only by accepting approximation error. On the mud
      bench, the same lesson appears in another form: removing one-third each tide never empties the basin
      in three tides. On day 8 you total processes that fade away forever.
    stops:
      - group: SLUICE
        task: Solve the changing fill rate behind the flood gates
        title: How long does the basin take to fill?
        reason: The rate slows as the water levels equalize, so a constant-rate estimate can put the next gate move at the wrong time
        concept: Separable differential equations
        place: Sluice Control
        at: impoundmentmodel
        scene: >-
          Beke's flow law says the basin fills quickly when the sea is much higher and more slowly as
          the two levels approach each other. The outside level is held fixed for this calculation. He
          needs the time to reach it from the starting basin level.
        guide: >-
          You build this line by line. The head across the gate is the gap between the outside
          level and the impoundment's own level, and it is what drives the rate. Put every h on
          one side of the equation and every t on the other side. That split is what makes this
          differential equation solvable at all. A differential equation like this one just ties
          a rate to the amount it is the rate of. Then integrate each side on its own. The
          starting level fixes the constant, and only after that is there anything to rearrange
          for a time.
        background:
          - >-
            Why the rate is a square root. Flow through an opening is driven by the head across
            it. The speed of that flow goes as the square root of the head. That is the same
            relation that makes a jet from a deep tank faster than one from a shallow one. So
            the impoundment comes up quickly at first and then more and more slowly.
          - >-
            Why this cannot be done by multiplying. The rate at the start is 0.11 times the root
            of 3.1, which is 0.194 metres a minute. At that rate the impoundment would be level
            in 16 minutes. The true answer is twice that, because the rate is falling the whole
            way and the starting value is the largest it ever takes.
          - >-
            Why the solution reaches the end instead of just approaching it. An exponential decay
            is a change that slows down forever and never quite stops, so it only approaches its
            target. This one is a square root instead, so the solved shape is a parabola in time.
            It meets the outside level exactly, at one finite minute. That is a real difference
            between two equations that otherwise look equally harmless.
        takesAsRead:
          - The fundamental theorem, and the antiderivative it rests on
        assumes:
          - an equation whose variables can be put on opposite sides can be integrated side by side
        takeaway: Separating the variables turns a rate that depends on the answer into two integrals that do not.
        format: DERIVE
        question: How long does the impoundment take to rise from 4.3 metres to the outside level of 7.4 metres?
        answerText: >-
          About 32 minutes. Separating gives −2√(H − h) = kt + C. The filling time is
          2√(H − h₀) ÷ k = 2 × 1.761 ÷ 0.11.
        why: >-
          The impoundment takes about 32 minutes. Putting every h on one side and every t on the
          other leaves two integrals that can each be done. The h side integrates to minus twice
          the root of the head. The starting level fixes the constant. The level meets the
          outside level when that root reaches zero, which is a finite time rather than a limit.
          Multiplying the starting rate by anything would have given 16 minutes, because the
          starting rate is the fastest the gate ever runs.
        derive:
          hint: Each line must follow from the one before it, and a rule must allow every step.
          start: dh/dt = k·√(H − h)
          startNote: H = 7.4 m held outside, h₀ = 4.3 m in the impoundment, k = 0.11 in metres and minutes
          goal: the time for h to reach H, in minutes
          askRule: true
          rules:
            - separation of the variables
            - integration of each side
            - the constant from the starting value
            - rearrangement
            - substitution of the stated values
          steps:
            - ask: Separate the variables.
              answer: 1
              candidates:
                - text: dh·√(H − h) = k·dt
                  rule: separation of the variables
                  why: >-
                    The square root has been multiplied across instead of divided. It still
                    integrates cleanly, but it describes an impoundment that fills faster as the
                    head closes.
                - text: dh ÷ √(H − h) = k·dt
                  rule: separation of the variables
                - text: dh ÷ (H − h) = k·dt
                  rule: separation of the variables
                  survives: true
                  why: >-
                    The square root has been dropped. That turns this into the exponential case. It
                    solves cleanly, and it looks like every other tank problem. But its impoundment
                    never quite fills, so there is no filling time to report at all.
                - text: dh ÷ √(H − h) = dt ÷ k
                  rule: rearrangement
                  why: >-
                    The constant has gone to the wrong side. It ends up dividing the time instead
                    of multiplying it, so the filling time comes out eighty times too long.
            - ask: Integrate each side.
              answer: 2
              candidates:
                - text: √(H − h) = kt + C
                  rule: integration of each side
                  survives: true
                  why: >-
                    The factor of minus two is missing entirely. The sign error alone would get
                    caught, but losing the two as well makes the filling time come out to 16
                    minutes. That is exactly what a careless multiplication would give.
                - text: 2√(H − h) = kt + C
                  rule: integration of each side
                  why: >-
                    The two is right and the sign is not. Differentiating this back gives a rate with
                    the wrong sign, so the impoundment empties.
                - text: −2√(H − h) = kt + C
                  rule: integration of each side
                - text: ln(H − h) = kt + C
                  rule: integration of each side
                  why: >-
                    That is the antiderivative of one over the head, not one over its root. It belongs
                    to the equation without the square root in it.
            - ask: Use the starting level to fix the constant.
              answer: 0
              candidates:
                - text: C = −2√(H − h₀) = −2√3.1 = −3.52
                  rule: the constant from the starting value
                - text: C = 2√(H − h₀) = +3.52
                  rule: the constant from the starting value
                  survives: true
                  why: >-
                    The sign has been taken from the number rather than from the equation. It
                    gives a negative filling time, and that is the one obviously wrong thing about
                    it. But the size is right, so it survives any check that only looks at magnitude.
                - text: C = −2√h₀ = −4.15
                  rule: substitution of the stated values
                  why: >-
                    The head is the difference between the two levels, not the level in the impoundment. This
                    uses 4.3 where 3.1 belongs.
                - text: C = 0, since t is measured from the start
                  rule: the constant from the starting value
                  why: >-
                    Measuring time from the start does set t to zero, and that is what fixes C.
                    But it fixes C at minus twice the root of the starting head, not at nothing.
            - ask: Rearrange for the time at which h reaches H.
              answer: 3
              candidates:
                - text: t = √(H − h₀) ÷ k = 16.0 min
                  rule: rearrangement
                  survives: true
                  why: >-
                    The factor of two got lost along the way. Sixteen minutes is also what you get
                    by just multiplying by the starting rate. So the two most common errors here
                    agree with each other.
                - text: t = 2(H − h₀) ÷ k = 56.4 min
                  rule: substitution of the stated values
                  why: >-
                    The head has not been put under a square root. The units give this away: k is
                    measured in root-metres a minute, so it can only divide a square root.
                - text: t = 2k·√(H − h₀) = 0.39 min
                  rule: rearrangement
                  why: >-
                    The constant is multiplying where it should divide. Twenty-three seconds to move
                    three metres of water across four hundred hectares.
                - text: t = 2√(H − h₀) ÷ k = 32.0 min
                  rule: rearrangement
          commit: Commit the derivation
      - group: PRED
        task: Take one Euler step of the surge model
        title: Where will the storm surge be in thirty minutes?
        reason: The weather model arrives as a rate of change, so the gate team has to know what one half-hour approximation really does
        concept: Euler's method, and the error a step size costs
        place: Prediction Office
        at: fitdesk
        scene: >-
          The surge is currently 0.30 metres high. Its rate combines fresh growth with decay
          proportional to the surge already present. Calloway wants one thirty-minute Euler step worked
          by hand before anyone trusts a table of them.
        guide: >-
          Five numbers are offered, and only three of them belong in the step. The model's real
          rate is already on the list. It's worked out at the surge's present height. The raw
          growth number by itself is also on the list, as a trap. Using that instead means
          stepping forward on a rate the model doesn't actually have right now. And the step
          size has to be in hours, since the rate is measured per hour.
        takesAsRead:
          - Separable differential equations
        assumes:
          - a rate can be treated as constant over a short enough interval
        takeaway: A step forward equals the current value plus the current rate times the time interval. The interval is where the error hides.
        format: BALLPARK
        question: After one thirty-minute Euler step, what surge height does the model predict?
        estimate:
          prompt: >-
            The programme moves the surge model forward in half-hour steps. This is the very
            first step. It starts from the surge's current height and the rate the model gives at
            that height.
          question: After one half-hour step, what does the model give for the surge?
          relationship: >-
            Step forward: next value = current value + (the rate at that value) × (the step
            size).
          labels:
            - 0.30 m  (surge now)
            - 0.375 m/h  (the model's rate at that height)
            - 0.5 h  (the step size)
            - 0.42 m/h  (the forcing term on its own)
            - 30 min  (the same step, in minutes)
          values: [0.30, 0.375, 0.5, 0.42, 30]
          slots: 3
          template: '{0} + {1} × {2}'
          formula: a+b*c
          correct: [0, 1, 2]
          target: 0.4875
          tolerance: 0.02
          units: m
          solution: 0.30 + 0.375 × 0.5 = 0.49 m after one step.
          explanation: >-
            At 0.30 m, the model's real rate is the growth minus the decay — 0.375, not 0.42.
            Stepping forward on the raw growth number alone ignores the part. That part is
            currently pulling the surge back down.
        why: >-
          One step gives 0.49 metres. This method pretends the rate stays constant for the whole
          half hour, and it does not. The decay term grows as the surge grows. So the true rate
          keeps falling across that half hour, and the step overshoots. Cutting the interval in
          half roughly cuts that overshoot in half too. That's the real reason Beke keeps
          asking for smaller steps. The raw growth number alone is only the model's true rate
          when the surge is exactly zero.
      - group: FLATS
        task: Use the dye record to test the station's three-tide clearing rule
        title: Does one-third exchanged mean empty after three tides?
        reason: Removing the same fraction each tide is exponential decay, not subtracting the same amount three times
        concept: Geometric series, and the sum of a reflection chain
        place: Mud Laboratory
        at: corebench
        person: true
        scene: >-
          Ude's dye test says one-third of the basin water is exchanged on each tide. The licence says
          that means the basin is clear after three tides, yet dye remains detectable after nine. Match
          the observations to the model that explains them.
        guide: >-
          Each thing Ude noticed on the left has one explanation on the right that fits it. What
          splits the four explanations is one question. When water leaves the impoundment on the
          ebb, is it fully replaced by new water? Or does some of that same water just come back
          on the next flood? That is the difference between a total that empties out and a total
          that keeps shrinking by the same fraction, tide after tide. It never actually hits zero.
        assumes:
          - what leaves an estuary on the ebb is partly what comes back on the flood
        takeaway: Removing a fixed fraction each cycle always leaves a fixed fraction behind — and that fraction never actually hits zero.
        format: CASEBOOK
        task: Match each observation to the explanation that accounts for it.
        scenarios:
          - Dye could still be found after nine tides, at about two per cent of the first reading.
          - The first three tides removed far less than all of the dye.
          - The second tide removed fewer kilograms of dye than the first tide did.
          - Water sampled on the flood carried dye, even though the dye had been released inside the impoundment.
        choices:
          - Each tide removes a third of whatever is there. So what is left shrinks by a fixed fraction — it does not drop to zero.
          - Exchanging a third of the impoundment's water is not the same as clearing a third of its dye. The tides mix with the same water again and again.
          - The amount removed each time is a share of a shrinking total, so it shrinks along with it.
          - Some of the water that left on the ebb is still just outside the gates. It comes back in on the next flood.
        mapping: [0, 1, 2, 3]
        why: >-
          All four explanations are the same arithmetic, seen from different angles. A tide that
          exchanges a third of the water leaves two thirds behind. So after n tides, the fraction left
          is two thirds multiplied by itself n times. The sequence runs 0.67, then 0.44, then 0.30,
          and about 0.026 after nine. Each tide removes a third of a smaller amount than the tide
          before it, so the kilograms removed fall too. Some of the water that left is still sitting
          just outside the gates when the next flood begins. That is why the fraction exchanged is not
          the fraction cleared.
  # ---------------------------------------------------------------- day 8
  - title: What never quite reaches zero
    objective: Turn long-decaying processes into finite totals, and reject the ones that do not converge.
    briefing: Five working days remain. Several licence claims depend on processes that fade away but never literally stop.
    stake: >-
      By the eighth day a nutrient release, a mathematical tail and the load along the sea wall get smaller with time
      or distance. Today you decide which endless processes have a real finite total and how to put a
      safe upper limit on the part nobody directly measured.
    takeaway: A process can continue forever and still have a finite total, but that has to be demonstrated rather than assumed.
    segue: >-
      The long nutrient tail has a finite total; some other shrinking tails do not. That makes the
      prediction office suspicious of every leftover it has been calling small. Nine years of forecast
      residuals are still pinned to one board. Tonight they stop looking like random scatter.
    stops:
      - group: FLATS
        task: Integrate the whole decaying nutrient load out to infinity
        title: What is the total exposure after the discharge fades away?
        reason: The environmental report needs the total exposure, not an arbitrary time at which somebody decides the tail is small enough
        concept: Improper integrals, and when a tail has finite area
        place: Mud Laboratory
        at: exchangeledger
        scene: >-
          Ude has fitted a nutrient load that starts at 48 kilograms and then decays exponentially with
          a timescale of 6.2 tides. The curve never becomes exactly zero, so the total must be defined
          by an improper integral.
        guide: >-
          Build this working one line at a time, and check each line against the rule it is
          allowed to use. This is an improper integral — an integral with no upper end. You cannot
          evaluate that directly at infinity. Instead, you evaluate it out to some finite end, and
          then let that end move out towards infinity. That one step — sending the end out — is
          what decides whether an answer exists at all. The antiderivative itself is the ordinary
          one, nothing special. What matters is what that antiderivative does as the upper end
          keeps growing.
        background:
          - >-
            Why the upper end has to be a limit, not a number. Infinity cannot be plugged into a
            formula the way a number can. So the integral is defined a different way. Take its
            value at some finite upper end. Then ask what happens to that value as the end moves
            farther and farther out. For this decay, the piece of the answer that depends on the
            upper end shrinks to nothing as the end grows. That is why a finite answer survives.
          - >-
            Why this tail — the part that runs on forever — ends up with a total, when some tails
            do not. A quantity that falls by a fixed fraction every tide falls faster than any
            power of time. That is fast enough for its area to add up to a finite number. A
            quantity that falls like one divided by time does not fall fast enough. Its integral
            grows like a logarithm, and a logarithm eventually passes every value, no matter how
            large. That is the same split that decides whether an infinite sum of shrinking terms
            adds up to a total or not.
          - >-
            What the units mean. A load measured in kilograms, added up over tides, gives
            kilogram-tides. That is a measure of exposure, not a measure of mass. It is the right
            quantity for the nutrient claim. What harms the flats is how much dye was present, and for
            how long. It is not just how much arrived in total.
        takesAsRead:
          - The integral test, and comparison between series
        assumes:
          - an integral with no upper end means the limit of the integral as the end moves out
        takeaway: An improper integral is a limit — and that limit is exactly where a tail either adds up to a total, or does not.
        format: DERIVE
        question: What is the total exposure over the entire decay, in kilogram-tides?
        answerText: >-
          About 298 kilogram-tides, from 48 × 6.2. The upper end is sent out to infinity as a
          limit, and the exponential term at that end shrinks to nothing.
        why: >-
          The total exposure is about 298 kilogram-tides. First, the integral is taken out to
          some finite upper end. That gives the decay time, times the starting load, times one
          minus a term evaluated at that end. Then the end is sent out toward infinity. Because
          the load falls by a fixed fraction every tide, that end term shrinks to nothing. So the
          whole tail adds up to a finite amount. What is left is the starting load times the
          decay time — a clean and useful result. The exposure of a decaying discharge equals what
          it would be if the discharge held its very first value for exactly one decay time.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: E = ∫₀^∞ 48·e^(−t/6.2) dt
          startNote: kilograms against tides; the decay time is 6.2 tides
          goal: the total exposure, in kilogram-tides
          askRule: true
          rules:
            - the definition of an improper integral
            - antidifferentiation
            - evaluation at the two ends
            - taking the limit
            - substitution of the stated values
          steps:
            - ask: Write the improper integral in a form that can be evaluated.
              answer: 2
              candidates:
                - text: E = 48·e^(−∞/6.2) − 48·e⁰
                  rule: evaluation at the two ends
                  why: >-
                    Here, infinity has been plugged in as though it were an ordinary number, and the
                    antiderivative step got skipped entirely. What is written is really just a
                    difference between two values of the integrand itself.
                - text: E = ∫₀^{6.2} 48·e^(−t/6.2) dt
                  rule: the definition of an improper integral
                  survives: true
                  why: >-
                    Here, the upper end has been swapped for the decay time itself. That is a real,
                    useful integral — it is the exposure over just the first decay time. It comes out
                    to 63 per cent of the true answer, and nothing about the arithmetic afterward
                    looks wrong on its own.
                - text: E = lim_{b→∞} ∫₀^b 48·e^(−t/6.2) dt
                  rule: the definition of an improper integral
                - text: E = ∫₀^∞ 48·e^(−t/6.2) dt, evaluated directly
                  rule: antidifferentiation
                  why: >-
                    That is just a restatement of the problem, not a step toward solving it. The
                    upper end is not a number, so it cannot be plugged into an antiderivative directly.
            - ask: Antidifferentiate the integrand.
              answer: 0
              candidates:
                - text: −6.2 × 48·e^(−t/6.2)
                  rule: antidifferentiation
                - text: −48·e^(−t/6.2) ÷ 6.2
                  rule: antidifferentiation
                  survives: true
                  why: >-
                    Here the decay time is dividing when it should be multiplying instead. That makes
                    it wrong by a factor of 38. The shape of the expression looks perfectly right —
                    only its size gives the mistake away.
                - text: 48·e^(−t/6.2)
                  rule: antidifferentiation
                  why: >-
                    An exponential is its own derivative only when its exponent is plain t, with no
                    scaling factor. Differentiating this expression back leaves a factor of
                    one-over-6.2 unaccounted for.
                - text: −6.2 × 48·e^(−t/6.2) × t
                  rule: antidifferentiation
                  survives: true
                  why: >-
                    This has a stray factor of t, as though the exponential were treated as a
                    constant and the dt integrated on its own. That stray t vanishes at the lower
                    end, so the arithmetic there still happens to work.
            - ask: Evaluate between the two ends and take the limit.
              answer: 1
              candidates:
                - text: E = 6.2 × 48 × (e^(−b/6.2) − 1) → −298
                  rule: evaluation at the two ends
                  why: >-
                    The two ends are in the right order inside the expression, but in the wrong order in the
                    subtraction. That flips the sign, giving a negative exposure.
                - text: E = 6.2 × 48 × (1 − e^(−b/6.2)) → 6.2 × 48
                  rule: taking the limit
                - text: E = 6.2 × 48 × (1 − e^(−b/6.2)) → 0
                  rule: taking the limit
                  survives: true
                  why: >-
                    The limit has been taken of the wrong piece here. The exponential term goes to
                    zero, which means the bracket goes to one, not to nothing. It is the right
                    working with just the last line flipped.
                - text: E = 6.2 × 48 × e^(−b/6.2) → ∞
                  rule: taking the limit
                  why: >-
                    A negative exponent only grows without bound if its minus sign gets dropped by
                    mistake. As the upper end moves farther out, this term actually gets smaller, not
                    larger.
            - ask: Put the numbers in.
              answer: 3
              candidates:
                - text: E = 48 ÷ 6.2 = 7.7 kilogram-tides
                  rule: substitution of the stated values
                  why: >-
                    Here the decay time divides instead of multiplying. That would mean a
                    longer-lived discharge produces less exposure overall, which is backwards.
                - text: E = 48 × 6.2 × 2 = 595 kilogram-tides
                  rule: substitution of the stated values
                  why: >-
                    There is no factor of two anywhere in this integral. It looks like it was carried
                    over from a different, square-root case, where it does belong.
                - text: E = 48 kilogram-tides
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    This just reports the starting load as though it were the exposure. The number is real, but
                    it is a mass, not a mass times a time. That unit mismatch is the only way to catch the
                    error.
                - text: E = 48 × 6.2 = 298 kilogram-tides
                  rule: substitution of the stated values
          commit: Commit the derivation
      - group: PRED
        task: Classify four shrinking series by whether their sums converge
        title: Which endless tails actually have a finite total?
        reason: A term getting small is not enough; the licence can use a finite total only when the mathematics proves one exists
        concept: The harmonic series and p-series
        place: Prediction Office
        at: tailwall
        scene: >-
          Achterberg puts four models on the wall. Every individual contribution shrinks with tide
          number. Only some of the corresponding infinite sums settle to finite values. Sort them by
          what their totals actually do.
        guide: >-
          Match each tail on the left to what its total actually does. Every one of these has
          terms shrinking to nothing, so that alone won't tell them apart. What separates them is
          how fast the terms fall. One kind shrinks by a fixed fraction each time. The other
          shrinks by a fixed power of the tide number. For that kind, it matters whether
          that power is above or below one.
        takesAsRead:
          - The nth-term test, and what it can and cannot settle
        assumes:
          - the size of the terms decides the total only through how fast they fall
        takeaway: Whether an endless sum settles on a total comes down to how fast its terms fall. Not just that they get small.
        format: PROTOCOL
        task: Match each tail to what its total does.
        scenarios:
          - Each tide contributes 0.6 times what the tide before it contributed.
          - The nth tide contributes one part in n.
          - The nth tide contributes one part in n squared.
          - The nth tide contributes one part in the square root of n.
        choices:
          - "A total: two and a half times the first term."
          - "No total — the sum climbs past any value you name, though slowly."
          - "A total: a bit over one and a half times the first term."
          - "No total — and it fails even faster than the one-over-n case."
        mapping: [0, 1, 2, 3]
        why: >-
          A fixed fraction each time makes a geometric series, and it does settle. Here at
          1 ÷ (1 − 0.6). The other three are powers of n, called a p-series. Its boundary
          sits right at power one. 1/n has no total, though it only grows as slowly as a
          logarithm. 1 over the square root of n is even worse. Its terms fall away more
          slowly still. 1/n² does settle on a total. All four have terms shrinking to nothing.
          That is exactly why the size of one term alone never settles this question.
      - group: WALL
        task: Use an integral bound on the armour units that were not surveyed
        title: How can we bound the unmeasured end of the wall?
        reason: The storm arrives before every block can be inspected, so the remaining contribution needs a defensible worst-case ceiling
        concept: The integral test, and comparison between series
        place: Wall Station
        at: armourcount
        person: true
        scene: >-
          Grieve has a row of 240 armour units whose individual shares of wave energy decrease toward
          the wall head. Several at the far end were not surveyed. She wants a safe upper bound on their
          combined contribution without pretending they were measured.
        guide: >-
          All four choices are ways to add up a run of two hundred and forty terms. For each
          one, ask: does it need every single term measured? Then ask: what would it do if the
          wall were made longer? The winning method is the one that compares the terms to
          something. You already know how to find the area under that something.
        takesAsRead:
          - The harmonic series and p-series
        assumes:
          - a sum of terms that fall steadily can be compared with something. That something is the area under a curve through them
        takeaway: When terms fall steadily, capping their sum with an integral tells you the leftover part is safe. That's true even without measuring it.
        format: CHOICE
        question: How can Grieve put a safe upper bound on the total contribution of the unmeasured armour units?
        why: >-
          The terms fall steadily along the wall. So the total of the unsurveyed units is
          capped by the area under a curve. That curve is drawn through them. That area is an
          ordinary integral. This trick is called the integral test, and here it does real
          engineering work. It turns an unmeasurable sum into an integral you can compute. That
          gives a safe limit, not a guess. Scaling up would assume the far units act like the
          near ones. The steady drop in the data says they don't.
        choices:
          - By comparing the terms to the area under a curve drawn through them
          - By scaling up the surveyed total based on how many units there are
          - By taking the largest surveyed share and giving it to every unit that's left
          - By assuming the shares shrink to zero, so the leftover terms — the tail — add up to nothing
        answer: By comparing the terms to the area under a curve drawn through them
        rebuttals:
          - Scaling up assumes the unsurveyed units take the same share as the surveyed ones. But the steady drop says they don't.
          - Applying the largest share to every unit gives a bound six times too big to be useful.
          - Terms shrinking to zero doesn't tell you whether their total — their sum — is finite or not.
  # ---------------------------------------------------------------- day 9
  - title: The 'noise' was a missing tide
    objective: Test whether a repeating pattern in the residuals comes from physics the tide model omitted.
    briefing: Four working days remain. Nine years of forecast errors line up with position in the estuary instead of scattering randomly.
    stake: >-
      If the residuals have a shape, the model is missing a mechanism. Today you expand the gate-flow
      law, predict the new repeating term that curvature creates, and choose the fit that removes the
      pattern instead of merely hiding it inside adjustable offsets.
    takeaway: A structured residual is evidence for a missing mechanism, not an invitation to fit the pattern away.
    segue: >-
      The curved flow law creates a real twice-frequency tide, and once that term is added the residual
      pattern disappears. Every spring prediction moves. The model is better than it has ever been. Then
      the weather service sends a number no tidal fit can absorb: roughly half a metre of wind-driven
      storm surge.
    stops:
      - group: PRED
        task: Expand the nonlinear gate-flow law and identify the new repeating term
        title: What hidden tide does a curved flow law create?
        reason: A twice-frequency pattern in nine years of residuals may be the signature of physics missing from the original tide model
        concept: Taylor and Maclaurin polynomials
        place: Prediction Office
        at: fitdesk
        scene: >-
          Calloway's gate-flow law depends on head to the three-halves power. The tide makes that head
          oscillate around a mean value. Expanding the curved law to second order shows what extra
          frequencies the nonlinearity creates.
        guide: >-
          You build the working one line at a time. An expansion around a point is built from
          the value there, plus its derivatives. Each one is divided by its matching factorial.
          Take the derivatives first. Then assemble them into a second-order expansion. Only
          after that do you put the tidal movement in. The interesting part happens to the
          squared term once that movement is a cosine — a constituent.
        background:
          - >-
            Why expand the law at all. The power three-halves is not a polynomial. So feeding a
            sum of constituents into it does not return a sum of constituents.
            Expanding turns the law into powers of the movement instead. And powers of cosines
            are something a harmonic prediction can actually hold. A harmonic prediction is one
            built from steady waves.
          - >-
            What the squared term does. A cosine squared equals one-half of (one plus the cosine
            of twice the angle). So the second-order term of this expansion splits into two
            parts. A constant, and a wave at twice the tidal speed. That second part is a
            constituent the fit never measured. It isn't made by the moon at all. It is made by
            the shallow water itself.
          - >-
            Why stopping at first order isn't enough. To first order, the flow just scales with
            the head's movement — which is symmetric. That means exactly as much extra flow
            arrives on the incoming tide. The same amount is missing on the outgoing one. But every real
            asymmetry the estuary shows lives in the second-order term and beyond. That includes
            the one seen in the two roses.
        assumes:
          - a polynomial in a small movement can stand in for a smooth law near a point
        takeaway: Expanding a curved law to second order creates a wave at twice the driving speed. No first-order sum could ever contain that.
        format: DERIVE
        question: When the head varies like a cosine, what new time dependence appears in the second-order term of the discharge law?
        answerText: >-
          A constant, plus a wave at twice the tidal speed. Its amplitude is three-sixteenths of
          (a/H)² times the mean discharge — about 3 percent here.
        why: >-
          The second-order term turns into a constant plus an overtide. That's a wave at twice the
          tidal speed. The expansion's coefficients are the derivatives at mean head, each
          divided by its factorial. Three-halves over H for the first one, three-eighths over H
          squared for the second. Put a cosine into that squared term, use the double-angle rule.
          It splits into two pieces. A steady part, and a part swinging twice as fast. Here
          the movement is 0.85 metres on a mean head of 2.1. So the overtide comes out to about
          three percent of the mean discharge. That's a size that shows up clearly in a nine-year
          record.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: Q(η) = C·(H + η)^{3/2}
          startNote: H = 2.1 m mean head, η the tidal movement about it, with amplitude a = 0.85 m
          goal: the second-order term of Q, written in terms of the tidal movement
          askRule: true
          rules:
            - the power rule
            - the coefficients of a Taylor polynomial
            - substitution of the tidal movement
            - the double-angle form
            - rearrangement
          steps:
            - ask: Take the first two derivatives at mean head.
              answer: 2
              candidates:
                - text: Q′ = (3/2)C·(H + η)^{1/2},  Q″ = (3/2)C·(H + η)^{−1/2}
                  rule: the power rule
                  survives: true
                  why: >-
                    The second derivative kept the three-halves instead of picking up the extra
                    half it should gain. It's off by a factor of two, but it has exactly the right
                    form. So the overtide comes out twice as big and still looks believable
                    against the record.
                - text: Q′ = (3/2)C·(H + η)^{1/2},  Q″ = (3/4)C·(H + η)^{1/2}
                  rule: the power rule
                  why: >-
                    The coefficient is right and the exponent has not dropped. Differentiating
                    cannot leave the power where it was.
                - text: Q′ = (3/2)C·(H + η)^{1/2},  Q″ = (3/4)C·(H + η)^{−1/2}
                  rule: the power rule
                - text: Q′ = (3/2)C·(H + η)^{3/2},  Q″ = (3/4)C·(H + η)^{3/2}
                  rule: the power rule
                  why: >-
                    Neither exponent has moved. The three-halves power is the law itself, and its
                    derivatives must have lower powers than it does.
            - ask: Assemble the expansion to second order.
              answer: 1
              candidates:
                - text: Q ≈ C·H^{3/2}·[1 + (3/2)(η/H) + (3/4)(η/H)²]
                  rule: the coefficients of a Taylor polynomial
                  survives: true
                  why: >-
                    The second derivative got used without dividing by two-factorial, which is
                    just 2. Every Taylor coefficient carries that factorial. Skipping it
                    doubles the very term the whole day is about.
                - text: Q ≈ C·H^{3/2}·[1 + (3/2)(η/H) + (3/8)(η/H)²]
                  rule: the coefficients of a Taylor polynomial
                - text: Q ≈ C·H^{3/2}·[1 + (3/2)(η/H)]
                  rule: the coefficients of a Taylor polynomial
                  why: >-
                    That is the first-order expansion, which is symmetric in the movement. It
                    therefore contains no asymmetry and no overtide at all.
                - text: Q ≈ C·H^{3/2}·[1 + (3/2)(η/H) + (3/8)(η/H)³]
                  rule: rearrangement
                  why: >-
                    The second-order coefficient has been attached to a cube. The power and the
                    coefficient come from the same derivative and cannot be separated.
            - ask: Put the tidal movement in as a cosine.
              answer: 3
              candidates:
                - text: the squared term becomes (3/8)(a/H)²·cos(2ωt)
                  rule: substitution of the tidal movement
                  survives: true
                  why: >-
                    The overtide is there, but the steady part got lost. A cosine squared
                    averages to one-half. So squaring a tide raises the average flow, not just
                    adding a faster wave. That raised average is exactly what shows up as a
                    datum error.
                - text: the squared term becomes (3/8)(a/H)²·cos²(ωt), and cannot be simplified
                  rule: substitution of the tidal movement
                  why: >-
                    It can be simplified. Until it is, the term cannot be compared with a
                    constituent list. Nothing in that list is a squared cosine.
                - text: the squared term becomes (3/8)(a/H)·cos²(ωt)
                  rule: rearrangement
                  why: >-
                    One power of the mean head has gone missing from the denominator. That
                    leaves the term with units instead of being a pure ratio.
                - text: the squared term becomes (3/8)(a/H)²·cos²(ωt)
                  rule: substitution of the tidal movement
            - ask: Use the double-angle form and say what is in the result.
              answer: 0
              candidates:
                - text: (3/16)(a/H)²·[1 + cos 2ωt] — a constant and a term at twice the tidal speed
                  rule: the double-angle form
                - text: (3/8)(a/H)²·[1 + cos 2ωt] — a constant and a term at twice the tidal speed
                  rule: the double-angle form
                  survives: true
                  why: >-
                    The half from the double-angle rule never made it into the coefficient. The
                    shape of the answer is exactly right, but both parts of it are twice too big.
                - text: (3/16)(a/H)²·cos 2ωt — a term at twice the tidal speed and nothing else
                  rule: the double-angle form
                  why: >-
                    The constant has been dropped again. It is the part that shifts the mean,
                    which is the visible symptom at the gauges.
                - text: (3/16)(a/H)²·[1 + cos ωt] — a constant and a term at the tidal speed
                  rule: the double-angle form
                  why: >-
                    The doubling is the whole content of the identity. At the tidal speed this
                    would be absorbed into the existing constituent. It would never have been
                    noticed.
          commit: Commit the derivation
      - group: ROSE
        task: Choose the residual fit that represents a real missing mechanism
        title: Which fit removes the pattern instead of hiding it?
        reason: A lower RMS is not an improvement if free offsets merely absorb the same structured residual at every station
        concept: Truncating a sum, and stating what was left out
        place: Currents Room
        at: residualboard
        scene: >-
          Vos has fit the same residual field three ways: the original tide model, a model with an
          adjustable datum at each station, and a model with the new shallow-water overtide. You need
          the fit that removes the spatial pattern for a physical reason, not just the one with the
          smallest headline number.
        guide: >-
          Each stick is one station, drawn where it sits in the estuary. Up is a prediction that
          came in low, and down one that came in high. Look at every field before you choose.
          The summary number at the top of each is the typical size of what is left over. It is
          not the only thing worth reading. A field where the leftovers change sign as you move
          up the estuary is telling you about something the fit does not contain.
        takesAsRead:
          - Alternating series, and the error after n terms
        assumes:
          - a fitted parameter will absorb whatever pattern is put in front of it
        takeaway: A fit that scores better by absorbing a pattern into a free parameter leaves the cause in place and hides it.
        format: RESIDUAL
        question: Which fit should be carried into the spring-tide prediction, and why?
        residual:
          hint: >-
            Each stick is one station, at its position in the estuary. Up is a prediction that came
            in low, down one that came in high.
          fits:
            - id: issued
              label: The eight-constituent fit as issued
              rms: 0.118
              structured: true
              residuals:
                - { x: -2, y: -2, value: 0.13 }
                - { x: 0, y: -2, value: 0.12 }
                - { x: 2, y: -2, value: 0.14 }
                - { x: -2, y: 2, value: -0.10 }
                - { x: 0, y: 2, value: -0.11 }
                - { x: 2, y: 2, value: -0.12 }
            - id: datum
              label: With a datum offset fitted per station
              rms: 0.092
              structured: true
              residuals:
                - { x: -2, y: -2, value: 0.10 }
                - { x: 0, y: -2, value: 0.09 }
                - { x: 2, y: -2, value: 0.11 }
                - { x: -2, y: 2, value: -0.08 }
                - { x: 0, y: 2, value: -0.09 }
                - { x: 2, y: 2, value: -0.10 }
            - id: overtide
              label: With the shallow-water term added
              rms: 0.101
              residuals:
                - { x: -2, y: -2, value: 0.11 }
                - { x: 0, y: -2, value: -0.09 }
                - { x: 2, y: -2, value: 0.04 }
                - { x: -2, y: 2, value: -0.12 }
                - { x: 0, y: 2, value: 0.08 }
                - { x: 2, y: 2, value: -0.05 }
          accept: overtide
          commit: Carry this fit forward
        answerText: >-
          The fit with the shallow-water term, at 0.101. The datum fit scores better and its
          leftovers still change sign along the estuary, which means the offsets absorbed the term
          rather than removing it.
        why: >-
          Two of the three leave a pattern: low seaward, high up-estuary, at every station. That
          is not scatter. It is a term the model does not contain. Fitting a free offset at each
          station soaks it up and improves the summary number, while leaving the cause exactly
          where it was. The offsets will then be wrong by a different amount at the springs,
          when the movement is larger and the squared term matters more. The shallow-water fit
          scores worse and its leftovers change sign at random, which is what a complete model
          produces.
      - group: SLUICE
        task: Order the final modelling and sign-off steps by how reversible they are
        title: What must happen before the warning goes public?
        reason: Once a flood warning reaches farmers and gate crews, the decision cannot simply be taken back like a calculation on a board
        concept: A prediction, a bound and a measurement, and which of the three a decision rests on
        place: Sluice Control
        at: gatetable
        person: true
        scene: >-
          Beke has four remaining actions: recompute the prediction, print the error bound, agree the
          closing rule, and issue the gate sheet with the marsh warning. All could start today, but they
          do not carry the same consequence once done.
        guide: >-
          Four steps, and this is not about scheduling by time. All four of them could be started
          this morning. Put them in order of what each one commits you to, freest first. What
          decides the order is which steps you could still change your mind about afterward. One
          of the four is the one that cannot be taken back at all.
        assumes:
          - a step that can be revised costs less than one that cannot
        takeaway: Order work by what it closes off, and put the step that cannot be undone last, however ready it seems.
        format: SEQUENCE
        task: Order the four steps by what each one commits you to.
        axis: >-
          Order the four by what each one commits you to, freest first. This is not about timing.
          Every step could start this morning. The real question is which ones you could still
          change your mind about afterward.
        ends: [Can be revised freely, Cannot be taken back]
        cards:
          - Recompute the prediction with the shallow-water term in it.
          - Print the bound on the tail beside every predicted level.
          - Agree the closing level with the barrage master and record it.
          - Issue the sheet to the gate crews and stand the marsh warning up.
        order: [0, 1, 2, 3]
        why: >-
          Recomputing costs an afternoon of somebody's time and can be thrown away. Printing the
          bound changes nothing about the decision but makes it reviewable, so it is nearly
          free. Agreeing a closing level in writing binds two people and can still be revisited.
          Issuing the sheet and standing up a marsh warning reaches people outside this
          building. The marsh farmers move stock on it, and that cannot be recalled by saying
          so. The order is about what each step takes away from you, and only the last one is
          irreversible.
  # ---------------------------------------------------------------- day 10
  - title: A perfect bound can still miss the storm
    objective: Bound the approximation error, then separate that mathematical error from water the tide forecast never predicted.
    briefing: Three working days remain. The weather service now forecasts about half a metre of wind-driven water on top of the spring tide.
    stake: >-
      Calloway can bound the errors inside his mathematics. Oyelaran's question is whether those bounds
      say anything about weather that was never a tidal term. Today you calculate the approximation
      error honestly, then decide what the nineteen-centimetre tidal bound does and does not protect
      against.
    takeaway: A bound can be perfectly correct and still answer the wrong uncertainty.
    segue: >-
      The corrected discharge approximation is accurate to about one percent across the tested tidal
      range, and the omitted tidal constituents are still bounded by nineteen centimetres. Neither
      number bounds the weather forecast itself. Oyelaran wins the central argument: the prediction
      tells the crew when to be ready, but the final closing decision has to respond to measured water
      with the gauge lag explicitly accounted for.
    stops:
      - group: PRED
        task: Compute a correct Lagrange bound for the second-order discharge expansion
        title: How much error does the approximation itself add?
        reason: The newly repaired tide model still uses an approximation, and that approximation needs its own honest ceiling before the storm tide's extreme water level
        concept: The Lagrange error bound
        place: Prediction Office
        at: fitdesk
        scene: >-
          Calloway will use the second-order expansion of the discharge law in the final forecast.
          Across the tested tidal movement, you need the largest possible third derivative, not its
          convenient value at mean head, and then the Lagrange remainder.
        guide: >-
          You build the working one line at a time. The ceiling is built from the next
          derivative. That's the one right after the last one you kept. Take that derivative's largest
          size anywhere between the expansion point and the point you are using. Multiply that by
          the step, raised to the matching power, then divide by the matching factorial. Each of
          those three pieces is a place the math can go wrong. It can still spit out a number.
        background:
          - >-
            Why the next derivative, not the next term. The expansion's next term uses the
            derivative right at the expansion point. The ceiling instead uses the largest that
            same derivative gets anywhere across the whole interval. That's exactly what turns a
            mere estimate into a true ceiling.
          - >-
            Where that largest value actually sits. The third derivative here carries a negative
            power of the head. So it is biggest where the head is smallest. That's at the
            low-water end of the movement. Using mean head instead gives a number less than half as large as the true maximum.
            Nothing in the arithmetic will warn you.
          - >-
            What the ceiling is actually worth. It comes out to about one percent of the mean
            discharge. That's comfortably inside what the gate programme can absorb. It is a bound on
            the error made by replacing the exact discharge law with this polynomial. It is not a bound
            on whether the storm tide's water level itself has been forecast correctly. That's the subject of
            the next call today.
        takesAsRead:
          - Alternating series, and the error after n terms
        assumes:
          - a bound uses the largest the next derivative reaches on the interval. Not its value at one point
        takeaway: A Lagrange bound controls the error in the approximation itself. It does not control errors in the inputs supplied to that approximation.
        format: DERIVE
        question: Across the tested tidal movement, what is the largest error the second-order discharge approximation can add?
        answerText: >-
          At most about 0.0275 in the law's own units. That's about 0.9 percent of the mean discharge.
          The maximum third derivative is 0.268, the step cubed is 0.614, and the factorial is 6.
        why: >-
          The ceiling is about 0.9 percent of the mean discharge. The remainder after a second-order
          expansion is capped by the largest magnitude of the third derivative anywhere on the
          interval, multiplied by the step cubed and divided by three-factorial. Here that derivative
          grows as the head gets smaller, so its maximum is at the low-water end, not at mean head.
          The approximation is therefore accurate enough for the gate calculation. But this bound says
          only how well the polynomial represents the discharge law once a head is supplied; it does not
          say whether the forecast supplied the right head.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: "|R₂| ≤ M·|η|³ / 3!"
          startNote: the third derivative of C(H + η)^{3/2} is −(3/8)C(H + η)^{−3/2}; H = 2.1 m, |η| ≤ 0.85 m
          goal: a ceiling on the error of the second-order expansion, as a fraction of the mean discharge
          askRule: true
          rules:
            - the form of the remainder
            - the largest value on an interval
            - substitution of the stated values
            - comparison of magnitudes
            - rearrangement
          steps:
            - ask: Say which derivative the bound is built from.
              answer: 2
              candidates:
                - text: the second, since that is the last term kept
                  rule: the form of the remainder
                  why: >-
                    The bound is on what was dropped. So it is built from the first derivative
                    that was not used. Using the last one kept would bound a term that is already
                    in the answer.
                - text: the fourth, since the error is at least two terms deep
                  rule: the form of the remainder
                  why: >-
                    The error begins at the very next term. Skipping to the fourth derivative
                    bounds only part of what was left out. That's not a ceiling at all.
                - text: the third, the first one not used
                  rule: the form of the remainder
                - text: the third, evaluated at the expansion point
                  rule: the largest value on an interval
                  survives: true
                  why: >-
                    The right derivative, evaluated at the wrong spot. At the expansion point
                    it's 0.123, but the interval reaches about 0.268 at low water. The mean-head value is less
                    than half the required maximum. That makes it a ceiling that isn't quite a real ceiling. No
                    arithmetic afterward will catch the difference.
            - ask: Find the largest size that derivative reaches on the interval.
              answer: 0
              candidates:
                - text: M = (3/8)(H − 0.85)^{−3/2} = 0.268, at the low-water end
                  rule: the largest value on an interval
                - text: M = (3/8)(H + 0.85)^{−3/2} = 0.074, at the high-water end
                  rule: the largest value on an interval
                  survives: true
                  why: >-
                    The endpoint got picked without checking the sign of the power. A negative
                    power is biggest where the head is smallest. So this actually takes the
                    interval's smallest value and calls it the largest.
                - text: M = (3/8)H^{−3/2} = 0.123, at mean head
                  rule: substitution of the stated values
                  why: >-
                    Mean head is inside the interval rather than at its worst end. The value is
                    close and it is not a maximum.
                - text: M = (3/8)H^{3/2} = 1.14, at mean head
                  rule: rearrangement
                  why: >-
                    The sign of the power has been dropped. That is a number ten times too large
                    and the resulting bound is useless rather than wrong.
            - ask: Put the step and the factorial in.
              answer: 3
              candidates:
                - text: "|R₂| ≤ 0.268 × 0.85 ÷ 6 = 0.038"
                  rule: substitution of the stated values
                  why: >-
                    The step has not been cubed. A remainder after the squared term goes as the
                    step to the third power. That's what makes an expansion good near its own
                    point.
                - text: "|R₂| ≤ 0.268 × 0.614 ÷ 3 = 0.055"
                  rule: substitution of the stated values
                  survives: true
                  why: >-
                    Three rather than three-factorial. It is exactly twice the true bound, which
                    is still small. So it neither fails a sanity check nor changes the decision.
                - text: "|R₂| ≤ 0.268 × 0.614 × 6 = 0.987"
                  rule: rearrangement
                  why: >-
                    The factorial is multiplying instead of dividing. That turns a bound of about one
                    per cent into one that is tens of per cent.
                - text: "|R₂| ≤ 0.268 × 0.614 ÷ 6 = 0.0274"
                  rule: substitution of the stated values
            - ask: Put that beside the mean discharge term, C·H^{3/2} = 3.04.
              answer: 1
              candidates:
                - text: 0.0274 ÷ 3.04 = 0.90 per cent, so the total water-level forecast is also accurate to 0.90 per cent
                  rule: comparison of magnitudes
                  why: >-
                    The arithmetic is right, but the conclusion changes the question. This bound controls the
                    polynomial approximation to discharge for a supplied head. It does not bound errors in
                    the forecast of that head, including uncertainty in the storm surge.
                - text: 0.0274 ÷ 3.04 = 0.90 per cent of the mean discharge
                  rule: comparison of magnitudes
                - text: 0.0274 × 3.04 = 0.083, reported incorrectly as 8.3 per cent
                  rule: rearrangement
                  survives: true
                  why: >-
                    Multiplied rather than divided. Eight per cent is still a believable-looking size for
                    an expansion error. That's why nothing about the number itself gives it
                    away.
                - text: 0.0274 is already a fraction, so it is 2.7 per cent
                  rule: comparison of magnitudes
                  why: >-
                    It is in the units of the discharge law rather than a fraction. It has to be divided by the
                    mean discharge before it becomes a percentage.
          commit: Commit the derivation
      - group: SLUICE
        task: Separate the omitted-tide bound from the new weather surge
        title: Does the nineteen-centimetre bound include the storm?
        reason: The number on the forecast looks reassuring only if everyone remembers exactly what was included when it was calculated
        concept: A prediction, a bound and a measurement, and which of the three a decision rests on
        place: Sluice Control
        scene: >-
          Oyelaran puts the ±0.19 metre tidal-tail bound beside the weather service's roughly half-metre
          storm-surge forecast. One number comes from omitted repeating constituents; the other comes
          from wind and pressure. She wants the boundary between them stated plainly.
        guide: >-
          Four readings of what a 0.19-metre bound covers. Ask of each what the bound was
          computed from. A ceiling can only be a ceiling on the terms that went into it. The
          distinction that matters is between two kinds of term. One was dropped from the sum.
          The other was never in the sum at all.
        assumes:
          - a bound is computed from the terms of a particular model
        takeaway: A bound is a statement about a model, so anything outside the model is outside the bound as well.
        format: CHOICE
        question: Does the ±0.19 metre tidal-tail bound include the storm surge, and what does it actually cover?
        why: >-
          It covers the twenty-nine constituents that were fitted and then left out of the daily
          sum. That is all it was built from: their amplitudes, bounded one by one. A surge is
          not one of the thirty-seven constituents, because it does not repeat on any tidal cycle.
          It comes from wind and pressure instead. A harmonic fit only adds up repeating tide
          terms, so a prediction built that way has no term for a surge at all. Both of
          Calloway's bounds are correct. Neither one is a bound on the level, though, because the
          level at the storm tide has a term in it that neither model has.
        choices:
          - The constituents that were fitted and left out of the daily sum
          - Everything the predicted level could be wrong by on any day
          - The difference between the predicted level and the gauge reading
          - The error in the discharge law's expansion about mean head
        answer: The constituents that were fitted and left out of the daily sum
        rebuttals:
          - A bound built from a list of amplitudes cannot cover a term absent from the list.
          - A gauge has its own lag and its own datum, and neither entered this arithmetic.
          - That is the other bound, computed from a third derivative rather than from amplitudes.
      - group: ROSE
        task: Turn the derivative of the velocity vector into acceleration
        title: How fast is the current itself changing?
        reason: The gate and mooring loads depend on turning and speeding up, not only on the water's instantaneous speed
        concept: Vector-valued functions, and acceleration as the derivative of velocity
        place: Currents Room
        at: meterbank
        person: true
        scene: >-
          Vos writes the current as east-west and north-south velocity components. The mooring designers
          ask how quickly the current itself changes. Differentiating both components gives the
          acceleration vector, including changes in direction as well as changes in speed.
        guide: >-
          Vos will not answer until the question is put properly. She is right to wait. How
          fast a current changes can mean more than one thing. Ask of each option what it is the
          derivative of. Then ask whether it can be got from the two components on her screen.
          A current has a direction as well as a size. So a change in it can be a change in
          size, a change in direction, or both at once.
        assumes:
          - a velocity is two components, each a function of time
        takeaway: Differentiating a velocity component by component gives an acceleration that includes turning as well as speeding up.
        format: CHOICE
        question: What quantity should Vos give the mooring designers to describe how quickly the current velocity changes?
        why: >-
          Differentiating each component gives the acceleration. That is the quantity that
          includes turning. A current can hold a steady speed and swing through ninety degrees
          in an hour. The mooring feels that as a change of load direction. The derivative of
          the speed on its own is blind to it. Speed was made by throwing the direction away.
          Which of the two the designers want is a real question. The answer that contains both
          is the pair of component derivatives.
        choices:
          - The derivative of each component, taken separately
          - The derivative of the speed, which is one number
          - The change in bearing per hour, in degrees
          - The largest speed reached during the fortnight
        answer: The derivative of each component, taken separately
        rebuttals:
          - The speed's derivative is zero while a steady current swings right round. The mooring feels that swing.
          - A turning rate leaves out any change in size. A current doubling on a fixed bearing reads as no change.
          - A peak speed is a value rather than a rate, and carries nothing about how quickly it arrived.
  # ---------------------------------------------------------------- day 11
  - title: The last assumptions before sign-off
    objective: Finish the remaining integration checks and decide when another small correction is no longer worth chasing.
    briefing: Two working days remain. The gate rule is nearly settled, but the licence file still contains assumptions nobody has derived.
    stake: >-
      Before the plan can be signed, the generation and sediment records have to survive the same
      standard as the tide prediction: show the calculation and show the error. Today you finish two
      stubborn integrals and decide how tightly the final tide estimate is already bracketed.
    takeaway: A hard integral often becomes manageable after the right rearrangement, and a refinement is useful only until its remaining error is smaller than the decision needs.
    segue: >-
      The remaining integrals close, and the next correction to the spring prediction is already smaller
      than the decision can use. One line is still blank: what exactly should the gate crew act on when
      the prediction, its bounds and the actual water disagree? On day 12 you sign that rule.
    stops:
      - group: SLUICE
        task: Find the flow-weighted mean time of a release
        title: When during the ebb does most water leave?
        reason: The generation record needs when the water moved, not just the total volume that moved
        concept: Integration by parts
        # SITED at the turbine hall: it is the generation report's own number,
        # and the log that has recorded every release without ever recording the
        # time inside one is on that bench. Opens the hall on day 11.
        place: Turbine Hall
        at: generationlog
        scene: >-
          Beke's release flow starts high and falls to zero over the first 3.1 hours of the ebb. The
          report wants one representative time weighted by the flow, which means evaluating a
          time-weighted integral and dividing by total release.
        guide: >-
          You build this line by line. The integral you start with has a time multiplying a
          cosine, and neither piece is the antiderivative of anything simple. So the integral has
          to be traded for a different one. Which factor you choose to differentiate decides
          whether what comes back is easier or harder. Only one of the two choices actually
          makes progress.
        background:
          - >-
            Why look at the moment and not just the total. The total release tells you how much
            water came out. The moment tells you when. Two releases with the same total can put
            their water an hour apart in the ebb. Both the turbines and the marsh care which.
          - >-
            Why differentiate the time. Differentiating the time gives one, which removes it
            from the problem. Differentiating the cosine leaves a time multiplying a sine, which
            is exactly as hard as what you started with. That is the classic sign that the two
            factors were chosen the wrong way round.
          - >-
            What the answer means. The flow-weighted mean time comes out at about 1.13 hours
            into a 3.1-hour quarter, rather than at the middle. That is because the flow is
            largest at the start, so the water is weighted towards the beginning of the release.
            A report that assumed the midpoint would put the whole release half an hour late.
        takesAsRead:
          - The fundamental theorem, and the antiderivative it rests on
        assumes:
          - a mean weighted by a rate is the moment of that rate divided by its total
        takeaway: Parts trades one integral for another, and the trade is only worth making if the factor you differentiate disappears.
        format: DERIVE
        question: What is the flow-weighted mean time of the release, in hours after the ebb begins?
        answerText: >-
          About 1.13 hours. The moment is (π/2 − 1)/ω² = 2.22 hour-squared and the total is 1/ω =
          1.97 hours.
        why: >-
          The mean time is about 1.13 hours, not the 1.55 hours the midpoint would give. Parts
          turns the integral of a time times a cosine into a boundary term plus the integral of
          a sine, which comes out. Choosing to differentiate the time is what makes that happen:
          it becomes one and leaves. The moment divided by the total release is the mean. It
          sits early in the quarter because the flow is largest at the start, which is the whole
          reason the quantity was asked for.
        derive:
          hint: Each line must follow from the one before it, and a rule must allow every step.
          start: M = ∫₀^{T} t·q₀·cos(ωt) dt
          startNote: ω = 0.5068 rad/h, T = 3.1 h so that ωT = π/2; the total release is ∫₀^T q₀cos(ωt)dt = q₀/ω
          goal: the flow-weighted mean time, in hours into the ebb
          askRule: true
          rules:
            - the choice of the two factors
            - integration by parts
            - evaluation at the two ends
            - antidifferentiation
            - rearrangement
          steps:
            - ask: Choose which factor to differentiate.
              answer: 1
              candidates:
                - text: differentiate the cosine, integrate the t
                  rule: the choice of the two factors
                  survives: true
                  why: >-
                    A legal choice that goes backwards. What comes back is a t squared multiplying a
                    sine, which is harder than what you started with. Every line of it is correct.
                - text: differentiate the t, integrate the cosine
                  rule: the choice of the two factors
                - text: differentiate both and multiply the results
                  rule: rearrangement
                  why: >-
                    That is not a rule about integrals at all. The derivative of a product is not the
                    product of the derivatives, and neither is the integral.
                - text: integrate both and subtract
                  rule: rearrangement
                  why: >-
                    There is one integral here, not two. Nothing allows splitting a product into
                    a difference.
            - ask: Apply parts.
              answer: 2
              candidates:
                - text: M = q₀·[t·sin(ωt)] + q₀∫sin(ωt) dt
                  rule: integration by parts
                  why: >-
                    The one over ω from integrating the cosine has been dropped in both terms, and the
                    sign on the second is wrong as well.
                - text: M = q₀·[t·sin(ωt)/ω] + q₀∫sin(ωt)/ω dt
                  rule: integration by parts
                  survives: true
                  why: >-
                    The factors are right, but the minus sign has gone missing. Parts is supposed
                    to subtract the second integral. With a plus sign instead, the boundary term
                    and the integral add together instead of partly cancelling, giving 4.2 instead
                    of 2.2.
                - text: M = q₀·[t·sin(ωt)/ω] − q₀∫sin(ωt)/ω dt
                  rule: integration by parts
                - text: M = q₀·[t·cos(ωt)/ω] − q₀∫cos(ωt)/ω dt
                  rule: integration by parts
                  why: >-
                    The cosine has not been integrated. The boundary term has to carry the
                    antiderivative of the factor you chose to integrate.
            - ask: Evaluate the boundary term at the two ends.
              answer: 0
              candidates:
                - text: "[t·sin(ωt)/ω]₀^T = T/ω = 3.1 ÷ 0.5068 = 6.12 h²"
                  rule: evaluation at the two ends
                - text: "[t·sin(ωt)/ω]₀^T = 0, since the flow is nothing at T"
                  rule: evaluation at the two ends
                  survives: true
                  why: >-
                    The flow is nothing at T because the cosine is zero there. But the sine at
                    that same instant is one, not nothing. This is the right thought applied to
                    the wrong function, and it throws away the larger of the two contributions.
                - text: "[t·sin(ωt)/ω]₀^T = T·sin(T)/ω = 0.25 h²"
                  rule: evaluation at the two ends
                  why: >-
                    The sine has been taken of the time rather than of ω times the time, so the argument
                    is 3.1 instead of π/2.
                - text: "[t·sin(ωt)/ω]₀^T = T²/2ω = 9.5 h²"
                  rule: rearrangement
                  why: >-
                    The t has been integrated a second time. It has already done its work in the
                    boundary term.
            - ask: Do the remaining integral and turn the moment into a mean.
              answer: 3
              candidates:
                - text: M = 6.12 + 1/ω² = 10.0 h², so the mean is 5.1 h
                  rule: rearrangement
                  why: >-
                    The remaining integral is subtracted, not added, and a mean time of 5.1 hours is
                    outside a release that lasts 3.1.
                - text: M = 6.12 − 1/ω² = 2.22 h², so the mean is 2.22 h
                  rule: rearrangement
                  survives: true
                  why: >-
                    The moment has been reported as the mean without dividing by the total release. The
                    number is inside the release window, which is what makes it survive a glance.
                - text: M = 6.12 − 1/ω = 4.15 h², so the mean is 2.1 h
                  rule: antidifferentiation
                  why: >-
                    Integrating the sine gives a second factor of one over ω. Only one has been applied.
                - text: M = 6.12 − 1/ω² = 2.22 h², and 2.22 ÷ 1.97 = 1.13 h
                  rule: rearrangement
          commit: Commit the derivation
      - group: FLATS
        task: Use partial fractions to rewrite the separated silt equation
        title: How do we make the silt equation integrable?
        reason: The model is stuck not because the physics is missing, but because the algebra has hidden two standard integrals inside one fraction
        concept: Partial fractions, and an integral that splits
        place: Mud Laboratory
        scene: >-
          Ude's separated growth equation contains one over the product of two linear factors. The
          integral table has no entry for it in that form. Splitting the expression into partial
          fractions exposes two pieces the table already knows.
        guide: >-
          Ude has one fraction with two brackets multiplied underneath it. Nothing in the
          bench's tables fits that shape. What she can do is partial fractions. Split that one
          fraction into a sum of two simpler ones, each with a single bracket underneath. Each
          of those does have a standard antiderivative. That means a function the tables already
          know how to undo. Ask of each claim what the split makes possible that was not possible before.
          Then ask a second question. Does the split change the value of the integral, or only
          the way it is written?
        takesAsRead:
          - The fundamental theorem, and the antiderivative it rests on
        assumes:
          - a fraction with a factored denominator can be rewritten as a sum of simpler fractions
        takeaway: Splitting a fraction changes nothing about its value and everything about whether it can be integrated.
        format: CHOICE
        question: What does splitting the fraction into partial fractions accomplish?
        why: >-
          Splitting turns something with no standard antiderivative into two pieces that each have
          one. Each piece integrates to a logarithm. The sum of the two simpler fractions is
          identically equal to the original fraction. So nothing about its value has changed — only
          its form. The same integral gets taken, just by a route that actually exists. Combined with
          separating the variables earlier, this is what produces the S-shaped curve the flats
          actually follow. It fills fastest when they are about half full.
        choices:
          - Each piece has a standard antiderivative, and their sum is the same quantity
          - The integral becomes a smaller number, so it is easier to put a bound on
          - The two brackets can then be integrated separately, on their own
          - It removes the need to separate the variables first
        answer: Each piece has a standard antiderivative, and their sum is the same quantity
        rebuttals:
          - The value does not change when you rewrite it this way. Only the form it is written in changes.
          - The brackets themselves are never integrated. It is the fractions built from them that get integrated.
          - Separating the variables is what put the fraction on its own side in the first place. So separating comes before splitting, not after.
      - group: PRED
        task: Use the alternating-series error to bound the unfinished refinement
        title: When is the next correction no longer worth chasing?
        reason: The final forecast cannot be delayed forever for corrections that are already smaller than the operational decision can use
        concept: Alternating series, and the error after n terms
        place: Prediction Office
        at: fitdesk
        person: true
        scene: >-
          Achterberg's successive corrections alternate in sign and decrease in size. After the fourth
          correction, the next unused one is 0.011 metres. She wants the strongest statement that fact
          allows about the true value.
        guide: >-
          Here are four claims about a sequence of corrections that flip sign and shrink each
          time. For each claim, ask what the next unused correction tells you. It's about where the
          true value really sits. Then ask one more thing: does the answer need any knowledge of
          the corrections after that one?
        assumes:
          - each correction is smaller in size than the one before it and has the opposite sign
        takeaway: Corrections can alternate in sign and keep shrinking. When they do, the true answer sits bracketed between two neighboring partial sums.
        format: CHOICE
        question: After four alternating, shrinking corrections, what does the size of the next unused correction tell you about the remaining error?
        why: >-
          It lies within 0.011 metres of the total she already has. That's because the corrections
          alternate in sign and keep shrinking. Each partial sum overshoots the true value, and
          the next one undershoots it. So any two neighboring partial sums bracket the real
          answer between them. The width of that bracket is just the size of the first
          correction left out. The fifth one here. That's a true ceiling, not a guess, and it
          needs nothing about corrections beyond the fifth. It's also the cheapest ceiling in the
          whole course. The number is already sitting on the desk, unused.
        choices:
          - It sits within 0.011 m of the total she already has.
          - It sits within 0.011 m of the total she had after three corrections.
          - It is larger than her current total, by an unknown amount.
          - Nothing can be said until the remaining corrections are computed.
        answer: It sits within 0.011 m of the total she already has.
        rebuttals:
          - Three corrections in, the bracket was set by the fourth correction. That correction was bigger than the fifth.
          - The direction is already known, from the sign of the next correction. It's the size that stays bounded.
          - The ceiling only needs the first correction left out. That's exactly the one she's already holding.
  # ---------------------------------------------------------------- day 12
  - title: The order that protects the marsh
    objective: Check the corrected model at the storm tide's extreme level and sign the operational rule for the eastern gate.
    briefing: One working day remains. At dawn the year's largest tide and the forecast storm reach Sarn together.
    stake: >-
      The prediction has been rebuilt and its mathematical errors are bounded. Today you make sure the
      series is still valid at the storm tide's extreme level, decide which missing measurements matter most
      before the next storm, and sign the instruction the gate crew and marsh farmers will actually
      follow.
    takeaway: The best model tells you when to prepare; a safety decision must still say what measurement triggers action when weather lies outside that model.
    stops:
      - group: PRED
        task: Find the radius of convergence and check the storm tide's movement against it
        title: Will the series still work at the storm tide's extreme level?
        reason: The corrected series is only useful if the storm tide's unusually large head change remains inside the range where the expansion is guaranteed to converge
        concept: The ratio test and the radius of convergence
        place: Prediction Office
        at: fitdesk
        scene: >-
          The storm tide plus forecast surge moves the head by 1.40 metres around a mean of 2.1 metres.
          Calloway wants the radius of convergence from the ratio test and a direct check that 1.40
          metres lies safely inside it.
        guide: >-
          You build the working one line at a time. The test to use here compares each term with
          the one right before it. It's the ratio test. Form that ratio, simplify it, and see what it
          settles down to as the terms keep going. What it settles down to turns out to be a
          multiple of the movement. From there, the condition for the series to settle on a total
          comes in. It tells you exactly how large that movement is allowed to be.
        background:
          - >-
            Why the ratio, and not just the size of a term. Each term here is a coefficient times
            a power of the movement. The coefficients alone don't obviously shrink or grow. But
            the ratio of one term to the next settles down quickly. That ratio is exactly what
            this test is built to use.
          - >-
            What the radius actually means, physically. The nearest non-analytic point of the
            three-halves-power law is where the head reaches zero, one mean-head away from the
            expansion point. That sets a radius of 2.1 metres. The ratio test guarantees convergence
            strictly inside that radius; what happens exactly on the boundary has to be checked
            separately.
          - >-
            Why this matters today and didn't matter yesterday. At 0.85 metres of movement, the
            ratio is comfortably small and nobody even asks the question. At the storm tide's 1.40
            metres, including the surge, the ratio is two-thirds. Still inside the limit, but no
            longer comfortable. Suppose the total movement had instead been forecast at 2.2 metres. Then it would lie outside
            the radius and this series could not be trusted there; the discharge law would have to be
            evaluated directly.
        assumes:
          - the terms of the expansion are a coefficient times a power of the movement
        takeaway: The radius of convergence marks the distance within which the power series is guaranteed to converge; boundary points need their own check.
        format: DERIVE
        question: What is the radius of convergence of the head expansion, and is the storm tide's 1.40 metre movement inside it?
        answerText: >-
          The radius of convergence is 2.1 metres. The ratio settles at |η|/H, so the ratio test guarantees
          convergence for |η| < 2.1 m. The storm tide's 1.40 m movement gives 0.67, safely inside the radius.
        why: >-
          The limiting ratio is |η|/H because the ratio of the binomial coefficients tends to one. That
          gives a radius H = 2.1 metres around the mean head. The ratio test guarantees convergence
          when the movement is strictly inside that radius; it is inconclusive exactly on the
          boundary. The storm tide's 1.40 metres gives a ratio of about two-thirds, so the series is safely
          usable for the supplied head. That still says nothing about how accurately the weather
          service predicted the surge itself.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: term n = cₙ·(η/H)ⁿ,  with cₙ₊₁/cₙ = (3/2 − n)/(n + 1)
          startNote: H = 2.1 m; the storm tide's movement including the surge is |η| = 1.40 m
          goal: the radius within which the ratio test guarantees convergence
          askRule: true
          rules:
            - the ratio of consecutive terms
            - taking the limit
            - the condition on the ratio
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Form the ratio of consecutive terms.
              answer: 1
              candidates:
                - text: "|cₙ₊₁/cₙ| on its own"
                  rule: the ratio of consecutive terms
                  survives: true
                  why: >-
                    The powers of the movement got left out of the ratio. The coefficients alone
                    settle at one, which would wrongly conclude the series converges for every
                    possible movement.
                - text: "|cₙ₊₁/cₙ| × |η/H|"
                  rule: the ratio of consecutive terms
                - text: "|cₙ₊₁/cₙ| × |η/H|ⁿ"
                  rule: the ratio of consecutive terms
                  why: >-
                    Dividing one term by the next leaves one power of the movement, not n of
                    them. The powers very nearly cancel.
                - text: "|cₙ/cₙ₊₁| × |H/η|"
                  rule: rearrangement
                  why: >-
                    Both ratios are the wrong way up. The condition that comes out of this is that
                    the movement must be larger than the head.
            - ask: Take the limit of that ratio as the terms go on.
              answer: 3
              candidates:
                - text: it goes to 3/2, so the limit is 1.5|η/H|
                  rule: taking the limit
                  survives: true
                  why: >-
                    The three-halves in the numerator got kept while the n next to it was
                    dropped. For large n, that n dominates the constant, so the ratio that
                    survives is really just one. This gives a radius two-thirds of the true value.
                    It's still comfortably past the storm tide's movement, so nobody notices.
                - text: it goes to 0, so the series converges for every movement
                  rule: taking the limit
                  why: >-
                    The numerator grows like n and so does the denominator. So the ratio settles
                    at one rather than falling away to nothing.
                - text: it grows without limit, so the series never converges
                  rule: taking the limit
                  why: >-
                    Both numerator and denominator grow at the same rate, so nothing here grows
                    without limit. The expansion plainly does work for small movements.
                - text: it goes to 1, so the limit is |η/H|
                  rule: taking the limit
            - ask: Apply the condition for the series to have a total.
              answer: 0
              candidates:
                - text: "|η/H| < 1, so |η| < H = 2.1 m"
                  rule: the condition on the ratio
                - text: "|η/H| ≤ 1, so |η| ≤ H = 2.1 m"
                  rule: the condition on the ratio
                  survives: true
                  why: >-
                    The ratio test is inconclusive when the limiting ratio equals one. Writing ≤ quietly claims
                    the boundary case without doing the separate endpoint test it requires.
                - text: "|η/H| < 1, so |η| < 1 m"
                  rule: substitution of the stated values
                  why: >-
                    The condition is on the ratio. So clearing the H gives the head in metres and
                    not a bare one.
                - text: "|η/H| > 1, so |η| > 2.1 m"
                  rule: rearrangement
                  why: >-
                    The inequality has been reversed. A ratio larger than one is the divergent
                    case, in which the terms grow.
            - ask: Put the storm tide's movement in.
              answer: 2
              candidates:
                - text: 1.40 × 2.1 = 2.94, which is larger than one, so it cannot be used
                  rule: substitution of the stated values
                  why: >-
                    The movement has been multiplied by the head rather than divided by it. That
                    is a product of two lengths and cannot be compared with one at all.
                - text: 2.1 ÷ 1.40 = 1.50, which is larger than one, so it cannot be used
                  rule: rearrangement
                  survives: true
                  why: >-
                    The ratio got formed upside down, so it comes out above one. That means the
                    expansion fails on exactly the day it actually works. Both numbers are
                    correct; the division is just flipped.
                - text: 1.40 ÷ 2.1 = 0.67, which is less than one, so it converges
                  rule: substitution of the stated values
                - text: 1.40 − 2.1 = −0.70, which is less than one, so it converges
                  rule: rearrangement
                  why: >-
                    A difference rather than a ratio. It would say the expansion converges for
                    every movement smaller than the head plus one metre. That's in whatever unit
                    happened to be used.
          commit: Commit the derivation
      - group: WALL
        task: Spend the remaining survey budget on measurements that could change future flood decisions
        title: What should we measure before the next storm?
        reason: This storm exposed several numbers that came from inference or stale surveys rather than direct measurement
        concept: A prediction, a bound and a measurement, and which of the three a decision rests on
        place: Wall Station
        scene: >-
          Grieve has enough survey money for only part of the remaining work. The choices include
          measuring wall reflections directly, levelling two tide stations, adding a fast water-level
          sensor beside the slow stilling well, and expanding the routine flats survey. Rank the
          spending by what could change a future safety decision.
        guide: >-
          Here are the four things the station could buy, and what it already has. The returned
          fraction of 0.62 came from a fortnight of gauge records. It was worked out from data,
          not measured straight off the wall. The shallow-water term is now built into the
          prediction. But it is fitted using six stations. Two of those have not been leveled
          since they were built. The stilling well at the outer face is the pipe that slows the
          gauge's reading. It needs forty minutes to settle. That is why the gate call cannot
          wait for a reading from it. Two flats stations need the survey launch and were missed
          last quarter. The wall itself was last surveyed before the eastern gate was rebuilt.
        rules: >-
          Spread a hundred points, in whole points, across the four choices. Points are scored
          by what each choice would change about a future decision. They are not scored by what
          it would merely tell you. A measurement that could change the gate call is worth a
          lot. So is turning a number that came from records into one measured directly. Both
          are worth more than refining something that is already inside a safe bound.
        assumes:
          - money spent on a measurement is worth what the measurement would change
        takeaway: Evidence is worth what it would change about a decision. It is not worth what it would add to a record.
        format: SCIENCETANK
        task: Spread a hundred points across the four.
        proposals:
          - { label: A, text: Survey the wall and measure the returned fraction directly. }
          - { label: B, text: "Level the two unlevelled stations. That gives the shallow-water fit a solid reference point — a datum — to measure from." }
          - { label: C, text: "Fit a fast pressure sensor at the outer face, next to the stilling well." }
          - { label: D, text: "Charter the survey launch for a quarter, so no flats station gets missed." }
        recommended: { A: 20, B: 30, C: 40, D: 10 }
        why: >-
          The fast pressure sensor comes first because it removes the exact forty-minute delay that
          forced this storm's hardest decision. Levelling the two stations comes next because every
          future tide prediction there depends on a trustworthy datum. Measuring the wall reflection
          directly improves the armour calculation, but it does not decide the storm tide's gate timing.
          The launch survey still matters, but it mostly strengthens an environmental record rather
          than changing an immediate flood-safety call.
      - group: SLUICE
        task: Turn the prediction, its bounds and the weather forecast into one operational instruction
        title: What gate order do you sign?
        reason: The mathematics is finished only when the gate crew knows what to do with it at the storm tide
        concept: Truncating a sum, and stating what was left out
        # SITED at the marsh warning post: the last call of the campaign is
        # settled at the board ninety holdings read it off rather than three
        # hundred metres away in Sluice Control. Opens the post on day 12, which
        # is the only day anything sends anybody up the marsh road.
        place: Marsh Warning Post
        at: warningboard
        person: true
        scene: >-
          Oyelaran has the corrected tide prediction, the omitted-term bound, the shallow-water
          correction and the weather-service surge forecast on one desk. The marsh warning goes out with
          the gate sheet. You have to sign a rule that uses the forecast without pretending it contains
          the weather.
        guide: >-
          Read all four pieces of evidence before you sign. Three come from the tidal model and are
          in good order: the main prediction, the bound on omitted tidal constituents, and the new
          shallow-water term. The fourth comes from weather. Your instruction has to use the model
          for what it knows without pretending its bounds include a wind-driven surge.
        assumes:
          - a decision has to name the quantity it is being made on
        takeaway: A prediction with a bound and a term added is still silent about anything that is not in the sum.
        format: DIAGNOSIS
        headline: The tide model is ready. The storm is not part of it.
        task: Which operational gate order should you sign?
        readings:
          - { zone: Prediction, label: Springs high water, value: 11.4 m range, status: normal }
          - { zone: Tail bound, label: Dropped constituents, value: ±0.19 m, status: normal }
          - { zone: Shallow-water fit, label: Overtide now included, value: 3 % of discharge, status: normal }
          - { zone: Weather service, label: Wind-driven water, value: 0.55 m, status: alarm }
        choices:
          - { label: Close on the 11.4 m tidal prediction alone, mechanism: The two small mathematical bounds prove the total water level is known well enough. }
          - { label: "Use the prediction to put crews on station, but close on measured water with the known gauge lag accounted for", mechanism: The storm surge is outside the harmonic tide model and its tidal-tail bound. }
          - { label: Add 0.19 m to the predicted tide and close on that adjusted number, mechanism: The omitted-constituent bound can be used as a substitute for the missing weather term. }
          - { label: Treat the new shallow-water overtide as the storm correction, mechanism: "Both effects make the water asymmetric, so one can stand in for the other." }
        answer: Use the prediction to put crews on station, but close on measured water with the known gauge lag accounted for
        why: >-
          The tidal prediction is now better than it has ever been: the shallow-water term is in it,
          the dropped tidal constituents are bounded, and the discharge approximation is accurate
          enough for the operating calculation. None of those statements bounds wind-driven water.
          The prediction therefore tells the crew when the dangerous window is approaching, while the
          closing trigger comes from measured water with the gauge's known delay explicitly allowed
          for. Calloway's mathematics supplies the warning; Oyelaran's measurement supplies the final
          safety trigger.

                - text: L = 600t·√(1 + t²) × 2
                  rule: arc length as an integral of speed
                  survives: true
                  why: >-
                    Speed times the interval is right only for a constant speed, and this speed goes
                    from nothing to 2,683 metres an hour across the two hours. Taken at the end point
                    it overstates the length by a third.
                - text: L = ∫₀² 600t·√(1 + t²) dt
                  rule: arc length as an integral of speed
                - text: L = ∫₀² (600t + 600t²) dt
                  rule: arc length as an integral of speed

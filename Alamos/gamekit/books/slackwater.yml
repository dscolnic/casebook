# Slack Water — Sarn Barrage, and twelve working days before the equinoctial springs.
#
# Written to gamekit/tools/BOOK_TEMPLATE.md. The place is themes/slackwater/site.js.
#
# AP Calculus BC, the half of the course that starts where AB stops: parametric,
# polar and vector-valued functions, series and convergence, and the integration
# techniques the second term adds. Twelve of the thirty-six stops are DERIVE
# panels and they are the spine — one a day, in the order the mathematics has to
# arrive in:
#
#   day  1  the beat of two constituents, out of a sum-to-product identity
#   day  2  speed as the size of a velocity vector
#   day  3  arc length, out of the speed the day before
#   day  4  the bound on a truncated harmonic sum
#   day  5  the area of a polar region
#   day  6  the sum of a reflection chain
#   day  7  the impoundment equation, separated and solved
#   day  8  the flushing integral, taken to infinity
#   day  9  the shallow-water correction, expanded about mean level
#   day 10  the Lagrange bound on what that expansion left out
#   day 11  the generation integral, by parts
#   day 12  the radius of convergence of the expansion the programme rests on
#
# `askRule: true` is on. In this course the name of the licence IS the content:
# a student who differentiates a product correctly and calls it the chain rule
# has not understood which rule did the work, and the commonest lost point on the
# BC paper is a line that is algebraically legal and licensed by nothing.
#
# The argument: Calloway holds that a prediction with a stated bound is a
# measurement of the future and that the gate programme should be written from
# it. Oyelaran holds that a barrage closes on what the gauge reads. Calloway is
# right on day 4 — the bound is smaller than the gauge's own lag, so waiting for
# the reading costs the window and buys nothing. Oyelaran is right on day 10 —
# a surge is not periodic, so no number of constituents contains it and the
# bound, honestly computed, is a bound on the wrong quantity.
#
# The timeline the cards are checked against:
#   nine years ago      the barrage commissioned; the harmonic constants fitted
#   March, last year    the eastern sluice re-gated; the wall left un-surveyed
#   ten days ago        float 7 released on the ebb, still out
#   now                 twelve working days to the equinoctial springs
#   day 13              predicted 11.4 m range, with a surge forecast on top
#   six weeks after     the licence review that decides the generation window

theme:
  id: slackwater
  title: Slack Water
  subtitle: Flood Prediction Lead · Sarn Barrage, twelve days to the storm tide

groups:
  - id: PRED
    code: PRED
    name: Prediction Office
    color: '#4f7fa8'
    desc: The tide written as a sum, and what is left out of the sum.
    defaultLeader: calloway
    milestones: [Fit the constants, Bound the tail, State the error, Ready to hand over]
  - id: TRACK
    code: TRACK
    name: Survey & Drift
    color: '#3f8f7a'
    desc: A float is a path in time, and every question about it is a question about two rates.
    defaultLeader: palmer
    milestones: [Recover the float, Read the track, Measure the length, Ready to hand over]
  - id: ROSE
    code: ROSE
    name: Currents Room
    color: '#8a6fb0'
    desc: Speed against bearing, which is a curve in polar form and an area worth having.
    defaultLeader: vos
    milestones: [Plot the rose, Take the area, Compare the halves, Ready to hand over]
  - id: SLUICE
    code: SLUICE
    name: Sluice Control
    color: '#c2703f'
    desc: Six gates, an impoundment behind them, and a rate that depends on what it has already done.
    defaultLeader: oyelaran
    milestones: [Set the rate, Solve the fill, Step the model, Ready to hand over]
  - id: FLATS
    code: FLATS
    name: Mud Laboratory
    color: '#8a8f4a'
    desc: What the estuary keeps and what it flushes, over a tail that never quite ends.
    defaultLeader: ude
    milestones: [Sample the flats, Take the tail, Bound the exchange, Ready to hand over]
  - id: WALL
    code: WALL
    name: Wall Station
    color: '#6f6a86'
    desc: The training wall, two hundred metres along the shore, where a wave comes back and comes back again.
    defaultLeader: grieve
    milestones: [Time the return, Sum the chain, Set the limit, Ready to hand over]

roster:
  - id: calloway
    name: Idris Calloway
    role: Chief Tidal Analyst
    division: PRED
    bio: |
      Fitted the harmonic constants for this station nine years ago and has
      re-fitted them twice since. He holds that a tide is the most predictable
      thing in the natural world and that people who say otherwise are thinking
      of weather.

      His argument with operations is always the same. A prediction with a bound
      printed beside it is not a guess; it is a measurement of a time that has
      not happened yet, and refusing to act on one is refusing the only warning
      the estuary ever gives in advance.

      His limit is that his bound is a bound on the sum he wrote down. Anything
      the sum does not contain is outside it, and a bound that is honest about
      the wrong quantity is the most convincing wrong number there is.
    quiz:
      - q: Why does Calloway treat a prediction with a bound as better than a later reading?
        a: The bound is a stated ceiling on the error, and it arrives while there is still time to act
        wrong:
          - Gauges at this station are calibrated only once a year and drift badly between visits
          - A harmonic prediction contains the surge as well, so nothing further is needed
          - Readings from a stilling well are averages and cannot be compared with predictions
  - id: achterberg
    name: Wren Achterberg
    role: Harmonic Analyst
    division: PRED
    bio: |
      Runs the constituent list. Thirty-seven of them are fitted for this
      station and eight are used for the daily prediction, and she can say what
      each of the other twenty-nine is worth in centimetres.

      She thinks in tails rather than in terms. Her question about any sum is
      never whether it is right but how much of it has been thrown away, and
      she keeps the dropped amplitudes on the wall in descending order so that
      nobody has to guess.

      Her limit is that the list is fitted to nine years of this station's own
      record. A constituent that was small in those nine years is small on her
      wall whatever the estuary has done since the sluice was re-gated.
    quiz:
      - q: Why does Achterberg keep the amplitudes of the constituents she does not use?
        a: Their sum is the worst the dropped tail can contribute, which makes the truncation a number
        wrong:
          - The unused constituents are needed to check that the fitted phases are consistent
          - A constituent can be promoted into the daily list only if its amplitude is recorded
          - The list has to show thirty-seven entries for the record to be accepted at review
  - id: oyelaran
    name: Renate Oyelaran
    role: Barrage Master
    division: SLUICE
    bio: |
      Has the authority to close the gates and is the only person here who has
      used it against a prediction. That was four years ago, in a surge, and
      the prediction was excellent and the water came over the wall anyway.

      She is careful about how she puts it. The prediction is not wrong and
      Calloway is not careless. Her point is narrower: the harmonic sum is
      built out of things that repeat, and the water that has done the damage
      at this barrage twice in nine years was pushed up the estuary by wind.

      Her limit is that closing early costs the generation window and floods
      the upper marsh, and a gate closed on a surge that then does not arrive
      leaves nothing in the record to defend the decision with.
    quiz:
      - q: Why does Oyelaran hold that a good prediction can still be the wrong thing to close on?
        a: A harmonic sum contains only what repeats, and wind-driven water does not
        wrong:
          - Predictions at this station are issued for the outer gauge rather than for the impoundment
          - The gates take four hours to close, which is longer than any prediction is valid for
          - Harmonic constants fitted nine years ago are no longer accurate enough to use
  - id: beke
    name: Tomas Beke
    role: Sluice Engineer
    division: SLUICE
    bio: |
      Six gates, two of them re-gated last March, and an impoundment of four hundred
      hectares behind all of them. He is the person who can tell you what the
      flow through an opening actually does as the levels come together.

      He works in steps rather than in solutions. The gate programme is a table
      of what to do at the top of each half hour, so a rate that changes
      continuously has to be turned into something a person on a walkway can
      follow, and he wants to know how much the stepping itself costs.

      His limit is that his table is only as good as its interval. He has never
      been given a defensible reason for using half an hour rather than ten
      minutes, and he asks for one about twice a year.
    quiz:
      - q: Why does Beke want to know the cost of the interval his gate table uses?
        a: Stepping a changing rate forward in flat pieces leaves an error that depends on the step
        wrong:
          - A shorter interval would let the gates be worked by one operator instead of two
          - The table has to match the half-hourly interval the licence reports are written to
          - Flow through a sluice cannot be computed at all unless the interval is fixed first
  - id: palmer
    name: Sunniva Palmer
    role: Hydrographic Surveyor
    division: TRACK
    bio: |
      Runs the launch and the float programme. Eleven drifting floats have gone
      into this estuary in two years and nine have come back, which she regards
      as a good return and Calloway regards as a sampling problem.

      A float is the only instrument here that reports what the water actually
      did rather than what a model of the water says. It carries no compass and
      no speedometer: it carries a clock and a position, and everything else
      about its journey has to be got out of those two columns.

      Her limit is that a track is one path on one tide. She will not generalise
      from a single float and she has watched other people do it in reports she
      has had to sign.
    quiz:
      - q: Why does Palmer say a float reports nothing directly about how fast the water was moving?
        a: It records position against time, and speed has to be worked out from how those change
        wrong:
          - The floats are ballasted for the surface layer and read only the top half metre
          - Its clock and its position fixes are taken at different intervals and cannot be paired
          - A float travels more slowly than the water it sits in because of the drag of its drogue
  - id: mbeki
    name: Owen Mbeki
    role: Drifter Technician
    division: TRACK
    bio: |
      Builds and recovers the floats. He knows where they strand, which is a
      shorter list than the chart suggests, and he has walked most of the
      eastern flats at low water looking for them.

      The one that is out now went in on the ebb ten days ago and has been
      reporting a fix every ten minutes since. He is interested in the
      difference between how far it has gone and how far away it is, because
      the second number is small and the first one is not.

      His limit is that a stranded float keeps reporting from wherever it
      stranded, and the record does not say which fixes were taken in water.
    quiz:
      - q: Why is Mbeki unwilling to read the float's total travel off its start and finish positions?
        a: A path that turns with each tide is far longer than the gap between its ends
        wrong:
          - The first and last fixes are the two least accurate ones in the record
          - Fixes are dropped whenever the float is inside the barrage, so the ends are missing
          - The float is recovered by boat, so its finish position is not where it stopped
  - id: vos
    name: Dr. Halina Vos
    role: Currents Scientist
    division: ROSE
    bio: |
      Reads the current meters. There are four of them on the barrage face and
      one on the wall, and each reports a speed and a bearing every ten minutes,
      which she plots as a figure rather than as two columns.

      Her figures are polar because the estuary is. A current at this station is
      not a number that goes up and down; it is a direction that swings through
      the whole compass twice a day and is much stronger on one leg than the
      other, and the shape of that asymmetry is what moves the sediment.

      Her limit is that a rose throws time away. Two tides that reached the same
      speeds in the same directions in a different order plot identically.
    quiz:
      - q: What does Vos accept she has lost by plotting a tide as a rose rather than as two columns?
        a: The order in which the speeds and bearings occurred
        wrong:
          - The bearings, which have to be converted to radians before plotting
          - The slack water periods, which have no bearing and cannot be drawn
          - The peak speed, since the outer edge of a rose is an average
  - id: loots
    name: Pieter Loots
    role: Instrument Technician
    division: ROSE
    bio: |
      Keeps the current meters running, which at this station means keeping mud
      out of them. He services the barrage-face four on a fortnightly cycle and
      the wall meter whenever the launch can get alongside.

      He is exact about what an instrument reports. A meter gives an average
      over its own sampling interval and a bearing referred to magnetic north,
      and both of those have been the answer to a disagreement between a plot
      and a float at least once each.

      His limit is the wall meter. It has been serviced twice this year instead
      of six times, and he says so in writing every month.
    quiz:
      - q: Why does Loots insist a meter's reading is an average rather than a value?
        a: Each figure is taken over the meter's own sampling interval, and anything faster is smoothed away
        wrong:
          - The meters average four sensors, one at each corner of the housing
          - Readings are averaged in the office before they reach the currents room
          - A bearing referred to magnetic north cannot be reported instantaneously
  - id: ude
    name: Nkechi Ude
    role: Estuary Ecologist
    division: FLATS
    bio: |
      Runs the mud laboratory, which is a bench, a drying oven and eleven years
      of cores. Her subject is what the estuary keeps: the fine sediment, the
      nutrients that come with it and the animals that live in both.

      Her question about any discharge is how long it stays. A tide that
      exchanges a third of the impoundment every cycle does not clear it in three
      tides, because what comes back on the flood is partly what went out on
      the ebb, and the tail of that process is long enough to matter.

      Her limit is that the tail is where the assumptions live. She can measure
      the first few tides directly and everything after that comes out of a
      model she did not fit.
    quiz:
      - q: Why does Ude reject the idea that an impoundment exchanging a third of its water each tide is clear in three tides?
        a: Part of what leaves on the ebb returns on the flood, so the decline is a fraction of a fraction
        wrong:
          - The exchange fraction falls as the impoundment empties, so later tides move less water
          - Fine sediment settles out before the third tide and is no longer in the water
          - Three tides is less than the time the laboratory needs to take a sample
  - id: reddy
    name: Cal Reddy
    role: Sediment Technician
    division: FLATS
    bio: |
      Takes the cores and runs the oven. Fourteen stations on the flats, four
      times a year, at low water on a spring tide, which is the only time most
      of them can be reached on foot.

      He is the reason the record is comparable. Every core is taken at the
      same state of the tide, in the same order, by somebody who walks the same
      route, because the alternative is a series of samples that differ by
      whatever the weather was doing.

      His limit is the two stations out past the wall, which need the launch. In
      a bad quarter they are missed, and a missing station is not the same as a
      zero.
    quiz:
      - q: Why does Reddy take every core at the same state of the tide?
        a: Otherwise a difference between cores could be the tide rather than the flats
        wrong:
          - The oven cannot process wet cores taken on a flood tide
          - Low water on a spring tide is the only time the flats are legally accessible
          - Sediment concentration is defined at low water in the licence
  - id: grieve
    name: Marta Grieve
    role: Structures and Resonance Engineer
    division: WALL
    bio: |
      Responsible for the training wall, three hundred metres of concrete and
      armour that turns the ebb into a channel and is the reason the barrage has
      a deep berth in front of it.

      Her subject is what comes back. A long wall with a hard end reflects part
      of every wave that runs down it, and when the return trip takes about as
      long as the forcing period the returns arrive in step and add up. The
      arithmetic is a chain of diminishing bounces and its total is not the
      first one.

      Her limit is that the wall has not been surveyed since it was re-gated,
      so the fraction that survives a round trip is a number she is working
      from a fortnight of records rather than from the wall itself.
    quiz:
      - q: Why does Grieve say the height at the wall is not the height of the first wave?
        a: Each reflection returns a fraction of the last and they arrive in step, so they add
        wrong:
          - The wall shoals the water, which raises every wave passing along it
          - The first wave is measured at the gauge and the others at the wall head
          - Reflections arrive out of step and cancel, which lowers the total
  - id: fell
    name: Jonas Fell
    role: Wall Keeper
    division: WALL
    bio: |
      Walks the wall. Two hundred and forty armour units, a gauge at the head, a
      hut with a stove in it, and a causeway that is covered for four hours
      either side of high water.

      He is the person who knows what the sea does out there, which is not what
      it does at the barrage. He has watched the gauge at the head go on rising
      for twenty minutes after the level at the gates has turned, and he has
      been telling the office that for two years.

      His limit is that he has a gauge and a notebook. Nobody has ever gone out
      with an instrument fast enough to record what he is describing.
    quiz:
      - q: Why does Fell's observation at the wall head matter to the barrage?
        a: A level still rising out there after the gates have turned means the two ends are not one water level
        wrong:
          - The wall gauge is the reference the barrage predictions are issued for
          - It shows the wall gauge reads twenty minutes late and needs recalibrating
          - It means the causeway is covered for longer than the tables say

glossary:
  - name: Tide
    aliases: [tide, tides, tidal]
    def: The rise and fall of the water, morning and afternoon, at this station.
  - name: Estuary
    aliases: [estuary, estuaries]
    def: The reach of a river that salt water comes up into, where the two meet and mix.
  - name: Chart datum
    aliases: [chart datum, datum]
    def: The level every depth and height at a station is quoted above, chosen so the water very rarely goes under it.
  - name: Tidal range
    aliases: [tidal range, range of the tide]
    def: How far the level moves between one turn and the next, in metres.
  - name: Spring tide
    aliases: [spring tide, springs, equinoctial springs]
    def: The largest tides of a month, when the sun and the moon line up and their effects add.
  - name: Neap tide
    aliases: [neap tide, neaps]
    def: The smallest tides, a week later, when the two are working across each other.
  - name: Ebb
    aliases: [ebb, ebbing, on the ebb]
    def: The part of a tide when the level is going down and water is leaving through the gates.
  - name: Flood
    aliases: [flood tide, on the flood, flooding tide]
    def: The part of a tide when the level is coming up and water is entering through the gates.
  - name: Slack water
    aliases: [slack water, slack]
    def: The short period at the turn, when the water is barely moving in any direction.
  - name: Amplitude
    aliases: [amplitude, amplitudes]
    def: How far one rising-and-settling term reaches either side of its own mean.
  - name: Phase lag
    aliases: [phase lag, phase, lag of]
    def: How far behind its cause one term of a prediction arrives at this particular station.
  - name: Tidal constituent
    aliases: [tidal constituent, constituent, constituents]
    def: One cosine term of what a prediction is built by adding, with its own size, period and timing.
  - name: Harmonic prediction
    aliases: [harmonic prediction, predicted tide, prediction for]
    def: A level worked out by adding up the terms fitted to a station's own past record.
  - name: Storm surge
    aliases: [storm surge, surge]
    def: Extra water pushed inland by wind and by a drop in air pressure, which does not repeat on any regular period.
  - name: Shallow-water overtide
    aliases: [shallow-water overtide, overtide, shallow-water term]
    def: An extra term made where the water is shoal, running at two or three times the speed of what produced it.
  - name: Barrage
    aliases: [barrage]
    def: A structure built across the neck of an estuary with gates in it, to hold a difference in level and to pass water through turbines.
  - name: Sluice
    aliases: [sluice, sluice gate, gates]
    def: A gate that can be set anywhere between shut and fully open.
  - name: Impoundment
    aliases: [impoundment, impounded water]
    def: The water held on the landward side, four hundred hectares of it at this station.
  - name: Head
    aliases: [head, head across the gates]
    def: The difference in level across the gates at one instant, which is what drives the flow through them.
  - name: Tide gauge
    aliases: [tide gauge, gauge, gauges]
    def: An instrument that records the water level against time at one place.
  - name: Stilling well
    aliases: [stilling well, well]
    def: A vertical tube with a small inlet that a gauge floats in, so waves are smoothed out before the level is read.
  - name: Training wall
    aliases: [training wall, the wall]
    def: A wall built out from the shore to hold the outgoing water in one channel instead of letting it spread.
  - name: Seiche
    aliases: [seiche]
    def: A standing oscillation of the water along a wall, set going from outside and kept going by its own reflections.
  - name: Drifting float
    aliases: [drifting float, float, drifter]
    def: A weighted buoy that goes wherever the water goes and reports where it is every few minutes.
  - name: Fix
    aliases: [fix, fixes, position fix]
    def: One recorded position at one recorded time.
  - name: Bearing
    aliases: [bearing, bearings]
    def: A direction, given as an angle round from north.
  - name: Current rose
    aliases: [current rose, rose, rose plot]
    def: A figure with speed drawn as a distance from the centre and direction as the angle round it.
  - name: Partial sum
    aliases: [partial sum, partial sums]
    def: What a sum comes to after a stated number of its terms, before any of the rest are added.
  - name: Convergence
    aliases: [convergence, converge, converges, convergent]
    def: The property of a running total that settles on one value however many further terms are added.
  - name: Truncation
    aliases: [truncation, truncated, truncate]
    def: Stopping after a chosen number of terms and using what you have.
  - name: Arc length
    aliases: [arc length, length of the path, length of the track]
    def: The distance actually travelled along a path, as against the straight-line gap between its ends.
  - name: Polar form
    aliases: [polar form, polar, in polar]
    def: Describing a curve by how far out it reaches at each direction, rather than by height against distance.
  - name: Taylor polynomial
    aliases: [taylor polynomial, taylor, maclaurin, expansion about]
    def: A polynomial built from the value and the derivatives of a quantity at one point, used as a stand-in for it nearby.
  - name: Error bound
    aliases: [error bound, bound on the error, stated bound]
    def: A number the error is guaranteed not to exceed, as against an estimate of what the error probably is.
  - name: Euler step
    aliases: [euler step, euler's method, stepped forward]
    def: Advancing a quantity by assuming its present rate holds for a short interval, then working the rate out again.
  - name: Flushing time
    aliases: [flushing time, flushing, exchange time]
    def: How long this reach takes to replace what is dissolved in it, counted over the whole tail of the process.
  - name: Exchange fraction
    aliases: [exchange fraction, exchanged each tide]
    def: The share of the impounded water that leaves and is replaced by new water in one tide.

missions:
  # ---------------------------------------------------------------- day 1
  - title: The tide everyone is betting on
    objective: Build the first tide prediction and learn what the station actually measures.
    briefing: Twelve working days to the storm tide. The flood-gate plan still has no defensible closing time.
    stake: >-
      Twelve working days remain. The year's biggest tide is coming, and the farmers on the low marsh
      need to know whether to move livestock. Today you build the tide from its two biggest repeating
      waves, calculate what the gates should see, and separate a real measurement from a number worked
      out afterward.
    takeaway: A tide prediction is a model built from repeating waves, and its value depends on knowing exactly what went into it.
    segue: >-
      Calloway can now say when the spring tide should arrive and what level the gates should see.
      Oyelaran asks the question the board cannot answer: is the real water actually moving the way his
      equations say? Float 7 has been drifting through the estuary for ten days. On day 2 you make its
      positions speak.
    stops:
      - group: PRED
        task: Use the moon and sun tides to find the spring-tide interval
        title: When will the spring tide return?
        reason: The gate plan needs the timing of the largest repeating tide before anything else can be scheduled
        concept: A quantity written as a sum of periodic terms
        place: Prediction Office
        at: board
        scene: >-
          Calloway points to the two biggest repeating tides on the board: one driven mainly by the moon
          and one by the sun. A spring tide happens when their peaks line up. He wants the time from one
          alignment to the next using only their angular speeds.
        guide: >-
          You build the working one line at a time. At each step pick the expression that the
          line above actually gives you. Every wrong branch here is real math. It is not a typo,
          so do not hunt for one. Two constituents added together can be rewritten as a product.
          That is the product-to-sum identity — the rule that turns "wave plus wave" into "wave
          times wave." One factor is fast. One is slow. That slow factor is the envelope. It
          decides how often the two waves swing back into step: the beat.
        background:
          - >-
            Why a product rather than a sum. Added together, two cosines of nearly equal speed
            give a wave. Its height rises and falls over days. Written as a product, that is
            explicit. One factor runs at the average speed. One runs at half the difference. The
            second factor is the envelope the first one runs inside.
          - >-
            Where the factor of two comes from at the end. The springs happen whenever the
            envelope is at its largest. The envelope is the size of the slow cosine rather
            than the cosine itself. A cosine reaches its largest size twice per period, once
            positive and once negative. So the interval between springs is half the period of the
            slow factor.
          - >-
            Why the amplitudes were made equal for this exercise. When the two amplitudes differ,
            the envelope never reaches zero. The arithmetic then acquires a term that carries no
            teaching. The real station has the moon term at 3.4 m and the sun term at 1.1 m. The
            interval between springs comes out the same. It depends on the two speeds and not on
            the two heights.
        assumes:
          - a cosine of angular speed ω has period 360° ÷ ω
          - two terms are in step when their arguments differ by a whole number of turns
        takeaway: A beat's interval comes from the difference between two speeds. Never from either speed alone, and never from the amplitudes.
        format: DERIVE
        question: Using the two tidal waves' angular speeds, how long is it from one spring tide to the next?
        answerText: >-
          About 353 hours — 14.7 days. The slow factor's period is 706 hours. The springs happen
          at every peak of its size, and that happens twice in each period.
        why: >-
          The interval comes out to 14.7 days. Two constituents of nearly equal speed, added
          together. That's the same as multiplying a fast wave by a slow one — the product-to-sum
          identity again. The slow factor's speed is half the difference of the two speeds: 0.51
          degrees an hour here. So the slow wave's period is 706 hours. The springs arrive at every
          peak of that envelope's size, and that happens twice each period. Half of 706 hours is a
          fortnight.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: h(t) = A·cos(ω₁t) + A·cos(ω₂t)
          startNote: ω₁ = 28.98 °/h for the moon term, ω₂ = 30.00 °/h for the sun term, A = 1.7 m for both this month
          goal: the interval between one spring tide and the next, in days
          askRule: true
          rules:
            - trigonometric identity
            - rearrangement
            - period of a cosine
            - the size of a factor
            - substitution of the fitted values
          steps:
            - ask: Write the sum of the two cosines as a product.
              answer: 0
              candidates:
                - text: 2A·cos(½(ω₁+ω₂)t)·cos(½(ω₁−ω₂)t)
                  rule: trigonometric identity
                - text: 2A·cos(½(ω₁+ω₂)t)·sin(½(ω₁−ω₂)t)
                  rule: trigonometric identity
                  survives: true
                  why: >-
                    That is the identity for a difference of two cosines, and it is a perfectly
                    good product. But it is zero at t = 0. That's exactly when the two terms are in
                    step, which is a spring tide, not a neap. Follow this path and you get a
                    spring tide where a neap really is.
                - text: A²·cos(ω₁t)·cos(ω₂t)
                  rule: trigonometric identity
                  why: >-
                    The two terms are added, not multiplied, so nothing here should end up with an
                    amplitude squared. A metre squared is not a level.
                - text: A·cos((ω₁·ω₂)t)
                  rule: rearrangement
                  why: >-
                    A product of two angular speeds has units of degrees squared per hour squared.
                    That cannot sit inside a cosine at all.
            - ask: Say which factor is the slow one, and what its angular speed is.
              answer: 2
              candidates:
                - text: the first factor, at ½(28.98 + 30.00) = 29.49 °/h
                  rule: substitution of the fitted values
                  why: >-
                    That is the fast factor. It turns all the way around in a little over twelve
                    hours. That's the tide itself, not the fortnight the tide runs inside.
                - text: the second factor, at (30.00 − 28.98) = 1.02 °/h
                  rule: substitution of the fitted values
                  survives: true
                  why: >-
                    The half got dropped. The number is the right size but the wrong value, and
                    it halves every answer that follows. A fortnight turns into a week and still
                    looks believable.
                - text: the second factor, at ½(30.00 − 28.98) = 0.51 °/h
                  rule: substitution of the fitted values
                - text: the second factor, at ½(30.00 + 28.98) = 29.49 °/h
                  rule: rearrangement
                  why: >-
                    The identity puts the difference in the slow factor and the sum in the fast
                    one. Using the sum for both leaves nothing slow anywhere in the expression.
            - ask: Turn the slow factor's angular speed into the period of that cosine.
              answer: 1
              candidates:
                - text: T = 2π ÷ 0.51 = 12.3 h
                  rule: period of a cosine
                  why: >-
                    The speed is in degrees an hour, so a full turn is 360 of them, not 2π. Mixing
                    the two conventions gives an answer close to the tidal period itself. That's
                    exactly the wrong size to notice as a mistake.
                - text: T = 360° ÷ 0.51 °/h = 706 h
                  rule: period of a cosine
                - text: T = 0.51 ÷ 360 = 0.0014 h
                  rule: rearrangement
                  survives: true
                  why: >-
                    This still divides, just upside down. Every unit cancels the wrong way. The
                    only clue is that a fortnight comes out as five seconds.
                - text: T = 180° ÷ 0.51 °/h = 353 h
                  rule: period of a cosine
                  why: >-
                    That is the right final number, reached one step too early. It comes from
                    treating half a turn as a full period. The real halving happens on the next line,
                    and for a clear reason.
            - ask: The springs come whenever the slow factor is largest in size. How often is that?
              answer: 3
              candidates:
                - text: once per period, 706 h — every 29.4 days
                  rule: period of a cosine
                  survives: true
                  why: >-
                    A month sounds like a fine answer for a tidal cycle, and it is the wrong one.
                    It counts only the positive peaks of the slow wave. But the envelope is that
                    factor's size, and its negative peak is just as large.
                - text: four times per period, 176 h — every 7.4 days
                  rule: the size of a factor
                  why: >-
                    A cosine reaches its biggest size twice each period, not four times. Four also
                    counts the zero-crossings, which are the neaps.
                - text: it does not repeat, so there is no interval
                  rule: the size of a factor
                  why: >-
                    The slow factor is a cosine, so its size repeats by its very nature. Something
                    that never repeated could not be written as this kind of product at all.
                - text: twice per period, 353 h — every 14.7 days
                  rule: the size of a factor
          commit: Commit the derivation
      - group: SLUICE
        task: Calculate the head across the gates at 14:00
        title: What water level should the gates see?
        reason: This is the first point where the tide model turns into a number the gate crew could act on
        concept: A quantity written as a sum of periodic terms
        place: Sluice Control
        at: gatedesk
        scene: >-
          Oyelaran keeps the water behind the gates at 4.30 metres. Calloway's prediction gives the
          sea-side level at 14:00 from the mean level plus two tidal terms. She wants the difference
          between the two sides before she signs anything.
        guide: >-
          Five numbers are on the table, and only three belong in the sum. Two of them are traps.
          They are the constituents' own amplitudes — the biggest number a term can ever reach,
          not what it is giving right now. Head is the gap between the level outside the gates and
          the level held inside. Find the outside level at 14:00, then subtract the impoundment
          level, and that is the head.
        assumes:
          - a constituent contributes its amplitude only at the moment its cosine is one
        takeaway: An amplitude is the most a term can ever contribute. What it is contributing right now is a different number.
        format: BALLPARK
        question: At 14:00, how much higher is the sea side than the water behind the gates?
        estimate:
          prompt: >-
            The afternoon programme is signed against this number. Outside level is the station mean
            plus the two constituent terms. The impoundment is being held where it is.
          question: What is the head across the gates at 14:00?
          relationship: >-
            Head = mean level + each constituent's term at that hour − the level held in the impoundment.
          labels:
            - 6.10 m  (station mean level)
            - +2.41 m  (the moon term at 14:00)
            - −0.62 m  (the sun term at 14:00)
            - −4.30 m  (the level held in the impoundment)
            - 3.40 m  (the moon term's amplitude)
          values: [6.10, 2.41, -0.62, -4.30, 3.40]
          slots: 4
          template: '{0} + {1} + {2} + {3}'
          formula: a+b+c+d
          correct: [0, 1, 2, 3]
          target: 3.59
          tolerance: 0.12
          units: m
          solution: 6.10 + 2.41 − 0.62 − 4.30 = 3.59 m of head.
          explanation: >-
            The two terms are what those constituents are worth at 14:00, not what they are worth at
            their own high water. Using an amplitude instead puts a metre of head on the sheet that
            the water will not supply.
        why: >-
          The head is 3.59 m. A tide term acts like a cosine wave. It only gives its full
          amplitude at the one moment its wave peaks. At any other hour it gives less, and on the
          far side of its cycle it takes level away instead. At 14:00 the sun term is negative,
          and the moon term is at about seven tenths of its amplitude. Head is the outside level
          minus the level held inside, both measured from the same datum — the same starting height.
      - group: TRACK
        task: Separate what float 7 records from what must be calculated
        title: What does the drifting float actually measure?
        reason: The station keeps talking about the float's speed, but the instrument itself never measures speed
        concept: Parametric curves, and a path described by time rather than by x
        place: Survey Pontoon
        at: screen
        person: true
        scene: >-
          Mbeki, the drifter technician, shows you float 7's raw record. The float has drifted with the water for ten days and
          transmits one thing every ten minutes: where it is at that time. Every statement about speed,
          direction or distance has to be built from those positions.
        guide: >-
          A float like float 7 is what the course calls a Lagrangian drifter. It moves with the
          water instead of sitting fixed to the seabed. All four options here are things somebody
          might want from it. For each, ask whether a column of times and a column of
          positions could contain it directly. Sailors call these fixes. Then ask whether it
          would instead have to be worked out from how those columns change. What a record holds
          and what you can work out from it are different questions. Only one of the four sits
          directly in the record.
        assumes:
          - a position is two coordinates, and a track is those coordinates against time
        takeaway: A path written as two coordinates against time carries speed and direction inside it. Neither is spelled out, though.
        format: CHOICE
        question: What does float 7 record directly before any calculation is done?
        why: >-
          The record is where the float was and when it was there. Speed does not show up in it.
          Speed is how fast those coordinates are changing. Coordinates are the two numbers that
          make up a position. Getting speed means comparing the columns against each other. The
          same is true for direction and for distance covered. A path written as two coordinates
          against time is what the course calls a parametric curve. Every question about how the
          float moved is a question about the rates of its two coordinates.
        choices:
          - Where it was at each of a series of times
          - How fast it was moving at each of those times
          - The length of the path it has followed since release
          - The bearing it was travelling on at each fix
        answer: Where it was at each of a series of times
        rebuttals:
          - Speed is how fast the coordinates change. You can work it out from the record, but it isn't sitting in the record itself.
          - Length has to be added up along the whole path. No single fix — no single recorded position — contains any of it.
          - A direction of travel is built from two rates compared to each other. One fix, on its own, has no rate at all.
  # ---------------------------------------------------------------- day 2
  - title: Follow the real water
    objective: Turn a drifting float's positions into speed and direction, then ask what the tide model leaves out.
    briefing: Eleven working days remain. Calloway has a prediction; Oyelaran wants evidence from water that actually moved.
    stake: >-
      Float 7 has been sending back positions every ten minutes. Today you use derivatives to turn those
      dots into speed and direction, then look back at the forecast and ask what happened to the
      twenty-nine tidal waves the daily model never adds in.
    takeaway: Position data become velocity only through rates of change, and a model is only as complete as the terms it includes.
    segue: >-
      The float gives you a real speed and direction, and the daily forecast turns out to be only eight
      waves out of thirty-seven. But one instant of speed is not a journey. On day 3 you measure how far
      the water actually travelled and catch a dangerous assumption in the half-hour gate table.
    stops:
      - group: TRACK
        task: Turn the float's fitted position into speed at 14:00
        title: How fast is the real water moving?
        reason: Oyelaran wants a velocity from real water to put beside Calloway's predicted tide
        concept: Speed as the magnitude of a velocity vector
        place: Survey Pontoon
        at: plottable
        scene: >-
          Palmer, the hydrographic surveyor, has fitted one formula for the float's east-west position and another for its
          north-south position. Differentiating them gives the two components of velocity. She wants the
          float's actual speed two hours after low water.
        guide: >-
          Palmer builds the working one line at a time. Each line has to follow from the
          expression right above it. Differentiate each coordinate on its own — that turns one
          path into two separate rates. Only after that do the two rates combine. They
          combine as the two shorter sides of a right-angled triangle, not by simple addition.
          Watch the inner factor on the easting closely: its angle is πt/6.2, not just t.
        background:
          - >-
            Why each coordinate gets differentiated on its own. Position here is just two numbers
            that happen to share a clock — the easting and the northing. Nothing in the easting's
            expression shows up in the northing's. So each is differentiated by itself. The pair
            of results together is the velocity vector. That's the arrow made from both rates at
            once, pointing the way the float is actually moving.
          - >-
            Why speed throws away direction, but the vector itself doesn't. Velocity is a pair of
            numbers — the vector — and speed is just one. Squaring both parts, adding them, and
            taking the square root gives the length of that arrow. It carries no record of which way it
            points. That arrow does still point somewhere. It lies along the tangent, the exact
            direction the path is heading at that instant. Speed is what's wanted next, because
            the next step is accumulating distance along the path. A direction doesn't factor
            into a length.
          - >-
            What the inner factor is doing. The easting is a sine of πt/6.2, not of t. That's because
            the tide comes full circle every 12.4 hours. Differentiating it brings that π/6.2 out
            the front — a factor of 0.507 per hour. Forgetting it doubles the eastward rate to
            something this estuary has never actually recorded.
        takesAsRead:
          - A rate of change, and the derivative as a rate
        assumes:
          - each coordinate can be differentiated on its own with respect to time
        takeaway: Differentiating a path means differentiating each of its coordinates on their own. Speed is the length of the pair those two rates make.
        format: DERIVE
        question: What speed was float 7 making at t = 2.0 hours?
        answerText: >-
          About 1,540 metres an hour, which is 0.43 m/s. At that instant the eastward rate is
          1,501 m/h and the northward rate is 324 m/h.
        why: >-
          The speed is about 1,540 metres an hour. Differentiating the easting needs the chain
          rule, because it's a sine of πt/6.2, not of t. That inner factor is 0.507 per hour.
          It keeps the eastward rate at a believable 1,501 metres an hour. The northing is a
          polynomial. So its rate falls steadily, reaching 324 metres an hour at t = 2. Speed is
          the length of the vector those two rates make — squared, added, and rooted.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: x(t) = 5600·sin(πt/6.2),  y(t) = 380t − 14t²
          startNote: metres, with t in hours from local low water; the tide here comes round in 12.4 hours
          goal: the speed at t = 2.0 h, in metres an hour
          askRule: true
          rules:
            - chain rule
            - power rule
            - definition of speed
            - substitution of the stated time
            - rearrangement
          steps:
            - ask: Differentiate the easting with respect to time.
              answer: 1
              candidates:
                - text: dx/dt = 5600·cos(πt/6.2)
                  rule: chain rule
                  survives: true
                  why: >-
                    The inner factor has been dropped. It is a clean derivative of a sine. It is
                    2,837 metres an hour at its peak instead of 1,436. That's a current no
                    instrument at this station has ever seen. Nothing later in the working checks
                    catches it.
                - text: dx/dt = 5600·(π/6.2)·cos(πt/6.2)
                  rule: chain rule
                - text: dx/dt = 5600·(π/6.2)·sin(πt/6.2)
                  rule: chain rule
                  why: >-
                    Differentiating a sine gives a cosine. Leaving it as a sine puts the largest
                    eastward rate when the float is furthest east. That's the moment it is
                    turning.
                - text: dx/dt = 5600·(6.2/π)·cos(πt/6.2)
                  rule: rearrangement
                  why: >-
                    The inner factor is inverted. The chain rule multiplies by the derivative of the
                    inside. That derivative is π/6.2 per hour, not its reciprocal.
            - ask: Differentiate the northing with respect to time.
              answer: 2
              candidates:
                - text: dy/dt = 380 − 14t
                  rule: power rule
                  why: >-
                    The exponent has not come down. Differentiating t² gives 2t, so the coefficient is
                    28 and not 14.
                - text: dy/dt = 380t − 28t
                  rule: power rule
                  why: >-
                    The first term has been left undifferentiated while the second was done. A rate
                    cannot contain the quantity it is the rate of.
                - text: dy/dt = 380 − 28t
                  rule: power rule
                - text: dy/dt = −28t
                  rule: power rule
                  survives: true
                  why: >-
                    A constant term does differentiate to nothing — but 380t is not a constant. Losing
                    it makes the northward rate negative all afternoon. But the float has been going
                    north all afternoon.
            - ask: Put t = 2.0 h into both rates.
              answer: 3
              candidates:
                - text: dx/dt = 2837·cos(2.0) = −1181,  dy/dt = 324
                  rule: substitution of the stated time
                  survives: true
                  why: >-
                    The cosine has been taken of 2.0 radians rather than of πt/6.2 at t = 2. That's
                    1.013 radians. The sign flips, so the float is now travelling west, and every
                    later line is arithmetically perfect.
                - text: dx/dt = 2837·cos(1.013°) = 2837,  dy/dt = 324
                  rule: substitution of the stated time
                  why: >-
                    The argument is in radians, not degrees. Read as degrees, it is almost zero. So the
                    cosine is almost one. The rate comes out at its maximum at an arbitrary hour.
                - text: dx/dt = 1501,  dy/dt = 380
                  rule: substitution of the stated time
                  why: >-
                    The northward rate has been left at its value at t = 0. It falls by 28 metres an
                    hour for every hour, and two hours have passed.
                - text: dx/dt = 1501,  dy/dt = 324
                  rule: substitution of the stated time
            - ask: Combine the two rates into the speed.
              answer: 0
              candidates:
                - text: speed = √(1501² + 324²) = 1536 m/h
                  rule: definition of speed
                - text: speed = 1501 + 324 = 1825 m/h
                  rule: definition of speed
                  survives: true
                  why: >-
                    Adding the components is only right when they point the same way. These are at
                    right angles. It overstates every speed by up to forty per cent and never by
                    enough to look absurd.
                - text: speed = √(1501² − 324²) = 1466 m/h
                  rule: definition of speed
                  why: >-
                    A difference of squares belongs to a right-angled triangle where one of these is
                    the hypotenuse. Here they are the two shorter sides.
                - text: speed = 1501 × 324 = 486,324 m/h
                  rule: rearrangement
                  why: >-
                    A product of two speeds has units of metres squared per hour squared. That is not
                    a speed at all.
          commit: Commit the derivation
      - group: ROSE
        task: Find the slope of the float's path at the current meter
        title: Which way is the water moving?
        reason: The track can only be compared with the current meter if its direction is known at the same instant
        concept: The slope of a parametric path, dy/dx out of two rates
        place: Currents Room
        at: roseplot
        takesAsRead:
          - The chain rule, and a quantity that moves because another one does
        scene: >-
          Vos, the currents scientist, wants to lay the float track over the current record at meter three. At t = 2.0 hours you
          already have the eastward and northward rates. Their ratio gives the slope of the path at that
          instant.
        guide: >-
          Four quantities are offered and two of them belong in the answer. The track has no
          formula in easting and northing. So its slope on the chart cannot be found by
          differentiating one against the other. What is available is the two rates, and their
          ratio is the slope. The two entries that give a speed rather than a rate are there to
          be left out.
        assumes:
          - a slope on a chart is a change in northing divided by a change in easting
        takeaway: Where a path is given by two rates, its slope is their ratio, and the speed plays no part in it.
        format: BALLPARK
        question: What is the slope dy/dx of float 7's track at t = 2.0 hours?
        estimate:
          prompt: >-
            The chart wants the track's slope where it passes meter three, at t = 2.0 h. Both rates
            at that instant are on the board, along with the speed they make.
          question: What is the slope of float 7's track at t = 2.0 hours?
          relationship: >-
            Slope of the track = the northward rate divided by the eastward rate at that instant.
          labels:
            - 324 m/h  (northward rate at t = 2.0)
            - 1501 m/h  (eastward rate at t = 2.0)
            - 1536 m/h  (the speed at t = 2.0)
            - 0.43 m/s  (the same speed in SI units)
          values: [324, 1501, 1536, 0.43]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 0.216
          tolerance: 0.02
          units: metres north per metre east
          solution: 324 ÷ 1501 = 0.216, so the track rises about one north for every five east.
          explanation: >-
            A slope is a ratio of two changes in the same instant. The speed is the length of the
            velocity and carries no information about direction, so neither entry containing it can
            appear in a slope.
        why: >-
          The slope is 0.216, about one north for every five east. Neither coordinate is a
          function of the other, so there is nothing to differentiate directly. What there is
          instead is how fast each is changing. Dividing the northward rate by the eastward one
          gives the slope of the path on the chart. The speed cannot appear, because it was made
          by throwing the direction away. Where the eastward rate passes through zero, this ratio
          has no value. The track has a vertical tangent there, not a data error. A vertical
          tangent just means the slope points straight up for an instant.
      - group: PRED
        task: Compare ways of truncating the thirty-seven-term tide model
        title: What did the eight-term forecast leave out?
        reason: Only eight of thirty-seven fitted tidal waves go into the daily forecast, so the omitted part has to be named before it can be bounded
        concept: Sequences, partial sums, and what convergence means
        place: Prediction Office
        at: tailwall
        person: true
        scene: >-
          Achterberg keeps thirty-seven repeating tidal constituents on the wall. The daily forecast
          adds only the eight largest. She wants you to distinguish different ways a sum can be stopped
          and what information each one leaves behind.
        guide: >-
          Each of the four cases on the left is a sum that stops partway through. A partial sum.
          Match each one to what stopping there really does to the answer. Here is the one thing
          to watch: in some sums the later terms keep shrinking. In others they do not. Only the
          shrinking kind lets you stop and still say something honest about what you left out.
        assumes:
          - a partial sum is what a sum comes to after a stated number of terms
        takeaway: Stopping a sum early is a choice. It has to come with a statement of what that choice cost.
        format: PROTOCOL
        task: Match each way of stopping a sum to what it leaves you holding.
        scenarios:
          - Eight terms are added, and the twenty-nine dropped amplitudes are listed right next to the total.
          - Eight terms are added, and the rest of the list is never mentioned at all.
          - Terms are added until the total stops changing by more than a centimeter.
          - Terms are added in the order they were fitted. That's not the order of their sizes.
        choices:
          - A number with a known ceiling on its own error.
          - A number that might be right, but cannot be backed up.
          - A total where the next few terms are small. But nothing is said about the terms far down the list.
          - A partial sum that might be missing a term bigger than several it already has.
        mapping: [0, 1, 2, 3]
        why: >-
          A partial sum is a choice about where to stop adding. The four cases differ in what
          that choice leaves you able to say. Listing what got dropped turns an unknown into a
          bound — a known ceiling. Dropping it with no list leaves a number nobody can defend.
          Stopping once the total settles down tells you about the terms you checked. It says
          nothing about the ones you didn't. Worst of the four is adding in fitted order instead
          of size order. That's because the biggest missing term could be anywhere in that order.
  # ---------------------------------------------------------------- day 3
  - title: Where the water actually goes
    objective: Separate distance travelled from displacement, and test whether a changing flow can be frozen into a half-hour table.
    briefing: Ten working days remain. A float can loop through kilometres of water and finish close to where it started.
    stake: >-
      The station has been using start and finish positions as shorthand for what the tide did. Today
      you use arc length to measure the full path, compare it with the straight-line displacement, and
      then ask whether a gate instruction based on one instant can stay valid for the next thirty
      minutes.
    takeaway: Distance travelled, displacement and a rate measured at one instant answer three different questions.
    segue: >-
      Float 7 travelled about eighty-four kilometres while ending only six kilometres from where it began.
      That does not prove what the whole estuary does; it proves that start and finish can hide most of
      the motion. A more urgent uncertainty is still on Calloway's board: twenty-nine tidal terms are
      missing. On day 4 you put a hard ceiling on what they can change.
    stops:
      - group: TRACK
        task: Measure the full length of the float's curved path
        title: How far did the water really travel?
        reason: Start and finish positions can hide most of the motion in a tide that reverses direction
        concept: Arc length of a parametric path
        place: Survey Pontoon
        at: plottable
        scene: >-
          For the float's first two hours, Palmer has smooth formulas for both coordinates. The straight
          line between the endpoints is not the distance travelled. She wants the arc length along every
          bend of the fitted path.
        guide: >-
          Palmer builds the working one line at a time, picking up whichever expression the line
          above gives. Length is just speed added up over time — that's what an integral does
          here. So the two rates come first, then the speed they make.
          Then the integral of that
          speed between the two times. Don't guess that last integral. The expression under the
          root has the derivative of its own inside sitting right outside it. That's exactly
          what makes a substitution work.
        background:
          - >-
            Why the arc length is an integral of speed. The arc length
            is the true length measured along the path. It isn't the straight gap
            between its ends. Over a very short stretch of time, a
            path looks just like a straight line. Its length is speed times that short
            stretch. Adding up all those little pieces is exactly what an integral does. This is
            the one place in the course where the thing being added up is a length. It
            isn't a total
            amount of something.
          - >-
            Why the substitution is the natural one to try. The speed here is 600t√(1+t²), and
            the derivative of 1 + t² is 2t. The t sitting outside the root is exactly half of
            what a substitution needs. So letting u = 1 + t² clears the whole expression.
            It turns it into the square root of a single variable.
          - >-
            What this answer is actually for. Nkechi Ude, the estuary ecologist, is asking how far
            a mud particle has really travelled through the water. That is the arc length. The
            float went in at one point. The straight-line distance between there and where it is now is a
            different number entirely. That one gets answered at the mud lab this afternoon.
        takesAsRead:
          - The definite integral as an accumulation of a rate
        assumes:
          - the length of a path is the accumulation of speed over the time spent on it
        takeaway: An arc length is speed added up over time. So a track that turns and loops is far longer than the straight gap. That gap runs between its two ends.
        format: DERIVE
        question: How long is the fitted path over the first two hours, measured along the path?
        answerText: >-
          About 2,040 metres. The speed is 600t√(1 + t²) metres an hour. Letting u = 1 + t²
          turns the integral into 200[(1 + t²)^{3/2}] evaluated between the two times.
        why: >-
          The path is about 2,040 metres long. Each coordinate gets differentiated on its own.
          The two rates go into the speed as the two shorter sides of a right-angled
          triangle. That speed then has to be added up over the whole two hours. That's what
          makes the length an integral instead of a simple multiplication. The float isn't
          moving at a constant speed at any point in those two hours. The substitution works
          because the derivative of what's inside the root is already sitting right outside it.
          That's true up to a factor of two.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: x(t) = 300t²,  y(t) = 200t³
          startNote: metres, with t in hours from release; the launch surveyed the float from t = 0 to t = 2
          goal: the length of the path from t = 0 to t = 2, in metres
          askRule: true
          rules:
            - power rule
            - definition of speed
            - arc length as an integral of speed
            - substitution
            - evaluation at the two ends
            - rearrangement
          steps:
            - ask: Differentiate both coordinates with respect to time.
              answer: 2
              candidates:
                - text: dx/dt = 300t,  dy/dt = 200t²
                  rule: power rule
                  survives: true
                  why: >-
                    The exponents have come down by one and the factors have not come out in front.
                    Both rates are then too small by a factor of two or three. Every line after
                    this one is clean arithmetic on the wrong numbers.
                - text: dx/dt = 600t²,  dy/dt = 600t³
                  rule: power rule
                  why: >-
                    The factor has come out in front and the exponent has not dropped. A rate cannot
                    have the same power of t as the quantity it is the rate of.
                - text: dx/dt = 600t,  dy/dt = 600t²
                  rule: power rule
                - text: dx/dt = 600t,  dy/dt = 200t³
                  rule: power rule
                  why: >-
                    The northing has been left undifferentiated. One coordinate has been done and the
                    other copied across.
            - ask: Write down the speed those two rates make.
              answer: 3
              candidates:
                - text: speed = 600t + 600t²
                  rule: definition of speed
                  why: >-
                    Adding components is only correct when they point the same way. Easting and
                    northing are at right angles by construction.
                - text: speed = √(600t + 600t²)
                  rule: definition of speed
                  why: >-
                    The components are squared before they are added, not after. As written, the units
                    inside the root are metres an hour rather than their square.
                - text: speed = 600t²·√(1 + t²)
                  rule: rearrangement
                  survives: true
                  why: >-
                    One power too many outside the root. It is dimensionally consistent, and it factors
                    beautifully. But it gives a length forty per cent too large.
                - text: speed = 600t·√(1 + t²)
                  rule: definition of speed
            - ask: Set up the length as an integral.
              answer: 1
              candidates:
                - text: L = 600t·√(1 + t²) × 2
                  rule: arc length as an integral of speed
                  survives: true
                  why: >-
                    Speed times the interval is right only for a constant speed. But this speed goes
                    from nothing to 2,683 metres an hour across the two hours. Taken at the end point
                    it overstates the length by a third.
                - text: L = ∫₀² 600t·√(1 + t²) dt
                  rule: arc length as an integral of speed
                - text: L = ∫₀² (600t + 600t²) dt
                  rule: arc length as an integral of speed
                  why: >-
                    That accumulates the sum of the two rates rather than the speed. That counts the
                    two directions as though the float went east and then north. But the float
                    actually moves both directions at once.
                - text: L = ∫₀² 600t·√(1 + t²) dx
                  rule: substitution
                  why: >-
                    The variable of integration has to match the variable the rates are with respect
                    to. Everything here is a function of time.
            - ask: Substitute and evaluate.
              answer: 0
              candidates:
                - text: u = 1 + t²,  L = 300∫₁⁵√u du = 200[5^{3/2} − 1] = 2036 m
                  rule: substitution
                - text: u = 1 + t²,  L = 600∫₁⁵√u du = 400[5^{3/2} − 1] = 4072 m
                  rule: substitution
                  survives: true
                  why: >-
                    The factor of a half from du = 2t dt has been dropped. The limits are carried
                    across correctly and the answer is exactly twice the truth.
                - text: u = 1 + t²,  L = 300∫₀²√u du = 200[2^{3/2}] = 566 m
                  rule: evaluation at the two ends
                  why: >-
                    The limits have not been carried across with the variable. When t runs 0 to 2, u
                    runs 1 to 5. Integrating in u between 0 and 2 answers a different question.
                - text: L = 600·[t²/2]₀² ·√(1 + t²) = 1200·√5 = 2683 m
                  rule: rearrangement
                  why: >-
                    The root has been treated as a constant. It was left outside the integral while the t
                    was integrated. It contains the variable.
          commit: Commit the derivation
      - group: FLATS
        task: Compare the float's total travel with its displacement
        title: Why can 84 kilometres end only 6 kilometres away?
        reason: The station has been using the gap between endpoints as shorthand for a journey that repeatedly turns with the tide
        concept: Distance travelled against displacement
        place: Mud Laboratory
        at: corebench
        scene: >-
          Ude puts two numbers on the bench. Adding the float's ten-minute legs gives 84 kilometres of
          travel. She wants the one straight-line distance from the first fix to the last so the
          difference between travel and displacement is impossible to miss.
        guide: >-
          Four numbers sit on the bench, and only two of them build the answer you need. Displacement
          is the straight-line distance from where float 7 started to where it ended. It depends only
          on the first fix and the last one. Nothing that happened in between adds anything to it. The
          two changes in position run at right angles to each other. That is what tells you how to
          combine them.
        takesAsRead:
          - Arc length of a parametric path
          - Vector-valued functions, and acceleration as the derivative of velocity
        assumes:
          - a displacement is fixed by two positions and by nothing in between them
        takeaway: Distance travelled divided by displacement tells you how much of a fortnight's travel the tide simply cancelled out.
        format: BALLPARK
        question: How far is float 7's final fix from its first fix in a straight line?
        estimate:
          prompt: >-
            The transport calculation needs both numbers and they are not the same. This is the one
            that depends only on the two ends of the record.
          question: How far is float 7's last fix from its first, in a straight line?
          relationship: >-
            Displacement = the straight-line gap between the first fix and the last, built from the
            two changes in position.
          labels:
            - 3900 m  (change in easting over the record)
            - 4800 m  (change in northing over the record)
            - 84000 m  (total of the ten-minute legs)
            - 12.4 h  (the tidal period at this station)
          values: [3900, 4800, 84000, 12.4]
          slots: 2
          template: 'hypotenuse of {0} and {1}'
          formula: Math.sqrt(a*a+b*b)
          correct: [0, 1]
          target: 6183
          tolerance: 120
          units: m
          solution: The two changes are 3,900 m and 4,800 m, so the gap is about 6,180 m.
          explanation: >-
            The 84 kilometres is the length of the path and has already been accumulated along it.
            Putting it into a displacement counts the same water twice, once going and once coming
            back.
        why: >-
          The displacement is about 6,180 metres, against 84 kilometres of travel. Twice a day, the
          tide carries a float up the estuary and back down again. Almost all of that travel cancels
          out. What is left over two weeks is a small drift. Both numbers are real, and they answer
          different questions. A mud particle sits in 84 kilometres of moving water. It ends up only
          six kilometres from where it began. Using the smaller number where the bigger one belongs
          would understate the transport by a factor of thirteen.
      - group: SLUICE
        task: Identify what a half-hour instruction assumes about a changing flow
        title: Can a half-hour gate table fall behind?
        reason: A gate instruction based on the flow at 14:00 may already be wrong before the next row is used
        concept: A rate of change, and the derivative as a rate
        place: Sluice Control
        at: gatetable
        person: true
        scene: >-
          The sluice engineer Beke's operating sheet is rewritten every thirty minutes. Each row uses the flow at the start
          of the interval as though that rate will continue unchanged until the next row. The basin
          level is already changing underneath that assumption.
        guide: >-
          Beke's table gives one instruction per half-hour row, and every row was worked out
          from the flow at the instant it was written. Head is the gap between the water level
          outside and the level held inside, and head is what drives the flow through a gate.
          So the question to put to this table is a narrow one. What has to be true of the flow
          for one instant's value to stand for a whole half hour? Then ask which way the error
          runs if it is not true.
        assumes:
          - a rate quoted at an instant is the rate at that instant only
        takeaway: Using a rate over an interval assumes the rate held for the whole interval. It usually did not.
        format: CHOICE
        question: What does the table assume when it uses the flow at the start of each half hour?
        why: >-
          It assumes the flow held for the whole half hour. But flow through a part-open gate
          depends on the head, and the head closes as the impoundment fills. So the true flow
          keeps falling through the interval. Taking the value from the start overstates the
          water passed, and the error grows with the interval's length. This is the assumption
          behind stepping a differential equation — an equation linking a rate to its own amount
          — forward in flat pieces. Its cost can be worked out, not argued about.
        choices:
          - That the flow held at its top-of-the-hour value for the whole half hour
          - That the head across the gates was constant for the whole day
          - That the flow depends on the gate opening and not on the head
          - That the impoundment is large enough for its level not to change
        answer: That the flow held at its top-of-the-hour value for the whole half hour
        rebuttals:
          - The table is rewritten every half hour precisely because the head changes across the day.
          - The table's own rows come from the head, so it plainly does depend on it.
          - The level in the impoundment changes by metres in a tide, and the table's rows are written from it.
  # ---------------------------------------------------------------- day 4
  - title: How wrong can the forecast be?
    objective: Put a hard bound on the omitted tide terms and compare that uncertainty with waiting for a slow gauge.
    briefing: Nine working days remain. Calloway says the forecast is precise enough to act on; Oyelaran says measured water should decide.
    stake: >-
      The argument can finally be turned into numbers. Today you calculate the worst error from the
      twenty-nine omitted tidal waves, then compare it with how far the real water moves during the
      forty minutes the main gauge takes to settle.
    takeaway: An error bound becomes useful only when it is compared with the delay and uncertainty of the alternative measurement.
    segue: >-
      For the repeating tide alone, Calloway wins this round. The omitted terms can move the level by at
      most nineteen centimetres, while the water can move much farther during the gauge's forty-minute
      lag. But that bound covers only tidal terms the model knows about. On day 5 the water at the far
      wall shows another effect the board does not describe.
    stops:
      - group: PRED
        task: Put a worst-case bound on the twenty-nine omitted tidal waves
        title: How wrong can eight tidal terms be?
        reason: Calloway cannot claim the eight-term forecast is safe until the part he leaves out has a numerical ceiling
        concept: Truncating a sum, and stating what was left out
        place: Prediction Office
        at: tailwall
        scene: >-
          Achterberg has the amplitudes of all twenty-nine omitted tidal constituents. At any instant
          each cosine can contribute no more than its amplitude. Calloway wants the worst possible
          water-level error if every omitted term happens to point the same way.
        guide: >-
          You build the working one line at a time. The remainder is the sum of the terms you
          left out. Each of those terms is an amplitude, a wave's height. Each is that amplitude
          times a cosine of some angle. You don't know what that angle is at the hour that
          matters. So the useful step is the one that stops needing to know it at all. A cosine
          can never be bigger than one, no matter its angle.
        background:
          - >-
            Why a ceiling, not a guess. The twenty-nine dropped constituents each turn at their
            own speed. At any one hour, some of them add together and some cancel out. So the
            real sum is almost always much smaller than the worst case. But nobody knows in
            advance which hour will matter most. That is why the honest number to print is the
            ceiling. The largest it could possibly be. Not a guess at the likely value.
          - >-
            Where the triangle inequality comes in. The size of a sum is never bigger than the
            sum of the sizes of its parts. That is the whole trick used here. It is also why the
            answer doesn't depend on any of the twenty-nine timing angles. It works no matter
            what those angles turn out to be. That independence is exactly what makes the
            ceiling worth printing.
          - >-
            Why the comparison at the end is the real point of the day. A ceiling is only useful
            next to something else. Twenty centimeters either way is a lot of water in a shallow
            estuary. But it is almost nothing next to how far the level moves. That's true even
            over the forty minutes a stilling well takes to settle down. Knowing which of those
            two is bigger is what decides how the gates get programmed.
        takesAsRead:
          - Alternating series, and the error after n terms
        assumes:
          - a cosine is never larger than one in size, whatever its argument
          - the size of a sum is at most the sum of the sizes of its terms
        takeaway: A sum that stops early still has a ceiling on its error. That ceiling needs no knowledge of the dropped terms' timing.
        format: DERIVE
        question: If every dropped tidal term lines up against the forecast, what is the largest level error they can produce at one instant?
        answerText: >-
          At most 0.19 m. Every dropped cosine can never be bigger than one in size. So the tail
          is capped by the sum of its own amplitudes. 0.041 + 0.033 + 0.028 + 0.022 + 0.066.
        why: >-
          The tail cannot go past 0.19 metres. Each dropped term is an amplitude times a cosine.
          A cosine never gets bigger than one in size. So each term is capped by its own
          amplitude, no matter its timing. Add those caps up and you get a ceiling on the whole
          tail. Not a guess, a hard limit. Most hours, the twenty-nine terms partly cancel and
          add only a few centimeters. What makes the ceiling worth having is that it holds at
          every hour. Nobody needs to know the timings at all.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: R = Σ_{n=9}^{37} Aₙ·cos(ωₙt − φₙ)
          startNote: the twenty-nine dropped amplitudes are 0.041, 0.033, 0.028, 0.022 and twenty-five more totalling 0.066 m
          goal: a ceiling on |R| in metres, valid at any hour
          askRule: true
          rules:
            - the size of a cosine
            - triangle inequality
            - substitution of the fitted values
            - comparison of magnitudes
            - rearrangement
          steps:
            - ask: Bound the size of one dropped term.
              answer: 1
              candidates:
                - text: "|Aₙ·cos(ωₙt − φₙ)| ≤ Aₙ·ωₙ"
                  rule: the size of a cosine
                  why: >-
                    An angular speed has no place in a height. Multiplying an amplitude by
                    degrees-per-hour gives something that isn't a water level at all.
                - text: "|Aₙ·cos(ωₙt − φₙ)| ≤ Aₙ"
                  rule: the size of a cosine
                - text: "|Aₙ·cos(ωₙt − φₙ)| ≤ Aₙ/2"
                  rule: the size of a cosine
                  survives: true
                  why: >-
                    A cosine averages to zero. Its size averages to about two-thirds. So a
                    half looks like a believable typical value. But it's not a ceiling. At the
                    hour the cosine equals one, the real term is twice this size.
                - text: "|Aₙ·cos(ωₙt − φₙ)| ≤ 1"
                  rule: the size of a cosine
                  why: >-
                    The bound on the cosine got applied to the whole term instead. One meter is
                    technically a ceiling, but a useless one. It's bigger than every amplitude on
                    the list added together.
            - ask: Bound the size of the whole sum.
              answer: 3
              candidates:
                - text: "|R| ≤ √(Σ Aₙ²)"
                  rule: triangle inequality
                  survives: true
                  why: >-
                    That is the root-sum-of-squares rule. It's the right combination for
                    independent random errors, and the wrong one here. It gives 0.06 m, three times too
                    small, and nothing about these terms is random. Their timings are fitted,
                    fixed constants.
                - text: "|R| ≤ 29 × max Aₙ"
                  rule: comparison of magnitudes
                  why: >-
                    A ceiling, but a very loose one: 1.19 m, six times bigger than the real tail.
                    It treats every term as if it were the biggest one.
                - text: "|R| ≤ Σ Aₙ − A₉"
                  rule: rearrangement
                  why: >-
                    The biggest term got removed from its own ceiling. Nothing allows dropping a
                    term out of a sum of sizes.
                - text: "|R| ≤ Σ Aₙ"
                  rule: triangle inequality
            - ask: Put the fitted amplitudes in.
              answer: 2
              candidates:
                - text: 0.041 + 0.033 + 0.028 + 0.022 = 0.124 m
                  rule: substitution of the fitted values
                  survives: true
                  why: >-
                    The twenty-five smaller terms got left out of the ceiling. That's the same
                    mistake one level down. A tail dropped from a calculation that is itself
                    about a dropped tail.
                - text: 29 × 0.041 = 1.19 m, the largest amplitude taken twenty-nine times
                  rule: substitution of the fitted values
                  why: >-
                    Every term has been given the largest amplitude. That was the loose bound
                    rejected at the previous line.
                - text: 0.041 + 0.033 + 0.028 + 0.022 + 0.066 = 0.19 m
                  rule: substitution of the fitted values
                - text: 0.041 + 0.066 = 0.107 m
                  rule: substitution of the fitted values
                  why: >-
                    Only the biggest term and the block of small ones got added. The second,
                    third and fourth terms went missing in between.
            - ask: Compare that ceiling with waiting forty minutes for the gauge to settle, at 0.9 m/h.
              answer: 0
              candidates:
                - text: the level moves 0.60 m in that time, three times the bound
                  rule: comparison of magnitudes
                - text: the level moves 0.15 m in that time, less than the bound
                  rule: comparison of magnitudes
                  survives: true
                  why: >-
                    Forty minutes got turned into a fraction of an hour by dividing by four
                    instead of sixty. Or the rate got cut in half. Either way, the comparison
                    flips, and the whole day's argument comes out backwards.
                - text: the level moves 36 m in that time, so no comparison is needed
                  rule: substitution of the fitted values
                  why: >-
                    A rate in meters-per-hour, multiplied straight by a time in minutes. The
                    units were never matched up, and the answer comes out deeper than the
                    estuary itself.
                - text: the two cannot be compared, since one is a bound and one is a movement
                  rule: comparison of magnitudes
                  why: >-
                    Both numbers are heights of water, in meters. A ceiling is worth having
                    exactly for that reason. You can set it beside the other costs of a decision.
          commit: Commit the derivation
      - group: SLUICE
        task: Calculate the water-level change during the forty-minute gauge lag
        title: How far can the sea move while the gauge catches up?
        reason: Waiting for a measurement is only safer if the water does not move farther during the wait than the forecast's known error
        concept: A rate of change, and the derivative as a rate
        place: Sluice Control
        at: gatedesk
        scene: >-
          The main stilling-well gauge takes about forty minutes to settle after the outside level
          changes. On a spring ebb the sea level is moving at nine-tenths of a metre per hour. Oyelaran
          wants the size of the delay translated into metres of water.
        guide: >-
          Four numbers are offered, and only two of them make the answer. The trap is the time. A
          rate in metres per hour needs a time in hours to match it, and forty is written in
          minutes. The prediction's bound is on the list for comparison later. It is not part of
          this arithmetic.
        assumes:
          - a rate multiplied by a time gives the change over that time, in the rate's own units
        takeaway: The cost of waiting for a measurement is measured in the same units as the error of not waiting.
        format: BALLPARK
        question: How much can the outside water level change during the gauge's forty-minute settling time?
        estimate:
          prompt: >-
            Oyelaran will not read the well until it has settled. This is what the water does in
            the meantime. It is the other half of the comparison Calloway is asking for.
          question: How much does the level outside move while the well is settling?
          relationship: >-
            Level change = the rate the level is moving multiplied by the waiting time, with both in
            the same unit of time.
          labels:
            - 0.9 m/h  (rate the level is falling)
            - 0.667 h  (the forty-minute wait, in hours)
            - 40 min  (the same wait, in minutes)
            - 0.19 m  (the ceiling on the twenty-nine unused terms)
          values: [0.9, 0.667, 40, 0.19]
          slots: 2
          template: '{0} × {1}'
          formula: a*b
          correct: [0, 1]
          target: 0.60
          tolerance: 0.05
          units: m
          solution: 0.9 × 0.667 = 0.60 m of level while the well settles.
          explanation: >-
            The wait has to be in hours because the rate is per hour. Using the forty directly gives
            36 metres, which is deeper than the estuary and is the commonest way this arithmetic
            fails.
        why: >-
          The level moves about 0.60 metres while the well settles. That is three times this
          morning's ceiling on the twenty-nine unused terms. That comparison turns the argument
          into something you can decide with numbers, not just a guess. On a fast ebb, waiting for
          a settled reading costs more level than the board's worst-case error. That does not
          settle the question for every day. It settles it for a day dropping this fast.
      - group: ROSE
        task: Find out how the current meter compresses many samples into one report
        title: What does one ten-minute current reading mean?
        reason: A number written every ten minutes is not automatically an instantaneous measurement
        concept: The definite integral as an accumulation of a rate
        place: Currents Room
        at: meterbank
        person: true
        scene: >-
          Loots, the instrument technician, opens meter three. The instrument samples the current several times each second but
          writes only one speed and bearing every ten minutes. You need to know what operation turns all
          of those samples into the single number on the record.
        guide: >-
          All four options are things the number on the record could be. For each one, ask what
          it would take hundreds of samples to build it. Then ask which of them you could still
          recover afterward. Only the one reading is kept. The samples themselves are gone.
        assumes:
          - an average over an interval is the accumulated quantity divided by the length of the interval
        takeaway: A reported reading is an accumulation divided by its own interval. What happened inside the interval is gone.
        format: CHOICE
        question: What does meter three's one reported value every ten minutes actually represent?
        why: >-
          It is the mean — the average — over the ten minutes. The samples are added up, then
          divided by the length of the interval. That adding-up is called accumulation. It is
          what an average value really is. Anything that happened faster than ten minutes gets
          folded into that accumulation. It cannot be pulled back out. That matters when the
          record is compared with a float. The float is somewhere specific at each instant. The
          meter has already smoothed the instants together.
        choices:
          - The mean of the samples taken across those ten minutes
          - The largest speed reached during those ten minutes
          - The speed at the instant the ten minutes ended
          - The total distance the water moved in those ten minutes
        answer: The mean of the samples taken across those ten minutes
        rebuttals:
          - A peak is one sample out of hundreds, and a record of peaks would rise with the sampling rate.
          - A single instant would be as noisy as the water, which is why the samples are combined at all.
          - A distance would grow with the length of the interval, and this number does not.
  # ---------------------------------------------------------------- day 5
  - title: The tide turns, but the water does not
    objective: Turn the ebb and flood current patterns into comparable numbers and investigate a delayed rise at the wall.
    briefing: Eight working days remain. A gauge at the far wall keeps rising after the tide at the gates has already turned.
    stake: >-
      The current room has two complicated rose-shaped plots and no single number for either. Today you
      use polar area to compare the ebb and flood patterns, then follow a twenty-minute delay at the
      wall that cannot be explained by the local tide turning late.
    takeaway: Polar area can compare directional current patterns, but it is not itself a volume of water.
    segue: >-
      The ebb current pattern encloses more polar area than the flood pattern, but that is a comparison of
      current strength and direction, not proof that more water leaves than enters. The stranger result is
      at the wall: its level keeps climbing after the tide turns. On day 6 you test whether repeated
      reflections can add up to the extra water there.
    stops:
      - group: ROSE
        task: Use polar area to turn the ebb current rose into one number
        title: How large is the ebb-current pattern?
        reason: The current plot is a shape, and the team needs a reproducible way to compare it with the flood plot
        concept: Area of a polar region as half the integral of r squared
        place: Currents Room
        at: roseplot
        scene: >-
          Vos has fitted the ebb current as speed versus bearing. In polar form that makes a rose-shaped
          curve. She wants the geometric area inside the curve over the half-turn occupied by the ebb.
        guide: >-
          You build the working a line at a time. There are no axes to integrate against here.
          So the piece to work with is a thin wedge at one bearing. It is nearly a triangle,
          with the reach as its two long sides and a very short base. Adding the wedges round
          the figure is the integral. The square in it is why the expansion has to be done
          before anything can be integrated.
        background:
          - >-
            Why a wedge and not a strip. A rose has no top and bottom, so a vertical strip cuts
            it in places that mean nothing. A wedge of angle dθ at reach r has area very nearly
            ½r²dθ. It is a triangle with base r·dθ and height r, and the error in that
            approximation vanishes faster than the wedge does.
          - >-
            Why the square is the awkward part. The reach is a sum of two terms, so its square
            has three: a constant, a cosine, and a cosine squared. The last one has to be
            rewritten using the double-angle form before it can be integrated. It is also the
            term that carries the asymmetry between the two halves of the tide.
          - >-
            What the number is for. This is a polar area — the space closed in by a curve that is
            drawn by bearing and reach instead of by x and y. On its own it is an index rather
            than a physical quantity: its units are speed squared times an angle, not square
            metres. What makes it worth having is that the same construction, applied to the
            flood rose, gives a number in the same units. The difference between the two areas is
            the transport asymmetry the flats are being built out of.
        takesAsRead:
          - The definite integral as an accumulation of a rate
          - Polar coordinates, and a curve given as r of theta
        assumes:
          - a thin wedge of angle dθ at reach r has area very nearly one half r squared dθ
        takeaway: A polar area is half the integral of the square of the reach, and the square is what makes the expansion necessary.
        format: DERIVE
        question: What polar area does the ebb-current rose enclose over its half turn?
        answerText: >-
          About 6.24, in units of speed squared times radians. The square expands into a constant, a
          cosine and a cosine squared, and only the first and last survive the half turn.
        why: >-
          The area comes out at about 6.24. A wedge at bearing θ has area one half r squared dθ.
          So the area of the whole figure is half the integral of the square of the reach.
          Squaring the reach gives three terms, and each is integrated on its own. The constant
          gives 1.96 times π. The plain cosine integrates to zero over a symmetric half turn.
          The cosine squared has to be rewritten as one half of one plus the double angle before
          it will integrate at all.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: r(θ) = 1.4 + 0.9·cos θ
          startNote: metres a second, with θ the bearing in radians; the ebb occupies θ from −π/2 to +π/2
          goal: the area the rose encloses over that half turn
          askRule: true
          rules:
            - area of a thin wedge
            - expansion of a square
            - the double-angle form
            - term-by-term integration
            - evaluation at the two ends
            - rearrangement
          steps:
            - ask: Write the area as an integral.
              answer: 2
              candidates:
                - text: A = ∫ r dθ
                  rule: area of a thin wedge
                  survives: true
                  why: >-
                    That is the sum of the reaches, which is a length times an angle rather than an
                    area. It integrates cleanly and gives 4.4, which is the right order of magnitude
                    and the wrong quantity.
                - text: A = ∫ 2πr dθ
                  rule: area of a thin wedge
                  why: >-
                    That is the circumference of a full circle at each reach. Nothing here is a full
                    circle, and an area does not have a 2π in it from this construction.
                - text: A = ½∫ r² dθ
                  rule: area of a thin wedge
                - text: A = π∫ r² dθ
                  rule: rearrangement
                  why: >-
                    The half in front comes from the area of a triangle. Replacing it with π is
                    borrowing the area of a circle for a shape that is not one, and it is six times
                    too large.
            - ask: Square the reach and expand it.
              answer: 3
              candidates:
                - text: r² = 1.96 + 0.81·cos²θ
                  rule: expansion of a square
                  survives: true
                  why: >-
                    The cross term has been dropped. It is the term that integrates to zero over this
                    particular half turn, so the final answer is right here. Over the flood half,
                    though, the tide is not symmetric about the same axis. There, the same line would
                    be wrong.
                - text: r² = 1.96 + 2.52·cos θ
                  rule: expansion of a square
                  why: >-
                    The square of the cosine term has gone missing. That term carries the asymmetry
                    and is the reason the two roses differ at all.
                - text: r² = (1.4 + 0.9·cos θ)² = (1.4 + 0.9)²·cos²θ
                  rule: rearrangement
                  why: >-
                    The constant and the cosine cannot be added before the cosine is evaluated. As
                    written, the reach is zero at ninety degrees, which the rose plainly is not.
                - text: r² = 1.96 + 2.52·cos θ + 0.81·cos²θ
                  rule: expansion of a square
            - ask: Deal with the cosine squared.
              answer: 0
              candidates:
                - text: cos²θ = ½(1 + cos 2θ)
                  rule: the double-angle form
                - text: cos²θ = 1 − sin²θ
                  rule: rearrangement
                  survives: true
                  why: >-
                    A true identity that has not helped. The sine squared is exactly as hard to
                    integrate as the cosine squared, so the working goes round in a circle rather than
                    wrong.
                - text: cos²θ = cos 2θ
                  rule: the double-angle form
                  why: >-
                    A cosine squared is never negative and cos 2θ is negative over half its range, so
                    these cannot be the same function.
                - text: cos²θ = ½·cos 2θ
                  rule: the double-angle form
                  why: >-
                    The constant half has been dropped. That constant is the whole average value of a
                    cosine squared, and losing it removes 1.27 from the answer.
            - ask: Integrate term by term over the half turn and halve it.
              answer: 1
              candidates:
                - text: A = ½[1.96π + 5.04 + 1.27] = 4.14
                  rule: term-by-term integration
                  survives: true
                  why: >-
                    The cross term has been integrated as though the range ran from zero, rather than
                    from minus a half turn. Over a range symmetric about zero, the sine values at the
                    two ends cancel out. So that 5.04 does not belong.
                - text: A = ½[1.96π + 0 + 1.27] = 3.12
                  rule: term-by-term integration
                  why: >-
                    Every piece is right and the halving has been done twice. Both the wedge formula's
                    half and a further half have been applied.
                - text: A = 1.96π + 0 + 1.27 = 7.43
                  rule: term-by-term integration
                  why: >-
                    The half from the wedge has been forgotten altogether, so this is twice the area
                    of the figure.
                - text: A = ½[1.96π + 0 + 2.54] = 4.35
                  rule: evaluation at the two ends
                  why: >-
                    The cosine-squared term has been given the whole half turn rather than half of it.
                    Its average value over any whole number of half turns is one half.
          commit: Commit the derivation
      - group: FLATS
        task: Compare the ebb and flood roses by their polar areas
        title: Which current pattern is stronger?
        reason: Two pictures on a wall do not settle whether one directional current pattern is larger than the other
        concept: Area between two polar curves, and which one is outside
        place: Mud Laboratory
        at: corebench
        scene: >-
          Ude has the ebb and flood curves on the same polar axes. Their squared radii are already
          integrated over the same bearings. She wants the difference in enclosed polar area, used here
          as a compact comparison of the two current patterns.
        guide: >-
          Four quantities sit on the bench, and three of them belong in your answer. The area
          between the two roses is the outer rose's area with the inner rose's area taken out.
          That means each rose's square gets integrated on its own, before any subtracting
          happens. One of the four numbers comes from subtracting the reaches first and squaring
          second. That is the mistake almost everyone makes, so watch for it.
        takesAsRead:
          - Area of a polar region as half the integral of r squared
        assumes:
          - an area between two curves is the outer area with the inner one removed
        takeaway: The area between two roses comes from the difference between their squares, never from the square of their difference.
        format: BALLPARK
        question: By how much does the ebb rose's polar area exceed the flood rose's over the same half turn?
        estimate:
          prompt: >-
            Both squared reaches have already been integrated over the same half turn. The transport
            asymmetry is the region the ebb rose encloses that the flood rose does not.
          question: What is the area between the ebb rose and the flood rose over the half turn?
          relationship: >-
            Area between the two = one half times the integral of the ebb reach squared minus the
            flood reach squared.
          labels:
            - 0.5  (the half in front of a polar area)
            - 12.47  (the integral of the ebb reach squared)
            - 8.10  (the integral of the flood reach squared)
            - 2.34  (the integral of the difference of the reaches, squared)
          values: [0.5, 12.47, 8.10, 2.34]
          slots: 3
          template: '{0} × ({1} − {2})'
          formula: a*(b-c)
          correct: [0, 1, 2]
          target: 2.19
          tolerance: 0.1
          units: speed squared times radians
          solution: 0.5 × (12.47 − 8.10) = 2.19.
          explanation: >-
            Squaring the difference of the two reaches gives a smaller number for a different region
            and cannot be repaired by scaling. The two areas are each built from a square, so the
            subtraction happens after the squaring.
        why: >-
          The area between them is about 2.19, which is a third of the ebb rose's own area. Each
          rose's area is half the integral of its own squared reach. So the area between the two
          roses is half the integral of the difference between the squares. Squaring the
          difference instead gives 1.17 — the right units, the wrong area, and no way to tell from
          the number alone. The imbalance stays positive over this whole half turn. That is why
          the eastern flats are gaining ground and the western ones are not.
      - group: WALL
        task: Explain the twenty-minute delay at the wall head
        title: Why is the wall still rising after the tide turns?
        reason: A delayed peak at the far wall means local water motion is doing something the simple tide-at-the-gates picture does not capture
        concept: Sequences, partial sums, and what convergence means
        place: Wall Station
        at: wallgauge
        person: true
        scene: >-
          The wall keeper Fell's notebook shows the same pattern on every large tide: the water at the gates turns, but
          the gauge at the far end of the wall keeps rising for about twenty more minutes. The delay is
          too regular to dismiss as a bad reading.
        guide: >-
          The water at one end of the wall is still rising. The water at the other end has
          already turned. All four choices are ways this could happen. Check each one two ways.
          Would it happen on every big tide? Would it grow bigger than the first arrival — the
          first wave that reaches the wall head? Those two checks are what Fell's notebook
          really shows.
        assumes:
          - a disturbance takes time to travel the length of a wall and back
        takeaway: When something bounces back again and again, the returns add up into one running total. That total is what the gauge actually measures.
        format: CHOICE
        question: What physical effect can make the wall-head level keep rising after the tide at the gates has already turned?
        why: >-
          A wave of water runs down the wall, bounces off the far end, and comes back. That is
          the only choice that happens every time and keeps building. Each returning wave is a
          smaller copy of the last one. The waves arrive in step. That is because the round trip
          takes about as long as the forcing period — one tide cycle. So the gauge is not
          reading one wave. It is adding up a running total of many. That sum is made of
          shrinking pieces, so it settles on one number instead of growing forever.
        choices:
          - A wave that runs down the wall and comes back
          - A gauge whose stilling well — a slow-reading pipe — cannot keep up with the water outside it
          - Wind holding water against the wall for as long as the turn lasts
          - The flats draining into the channel after the level has dropped
        answer: A wave that runs down the wall and comes back
        rebuttals:
          - A slow stilling well lags behind the water. It never reads higher than the gates did, but Fell's gauge does.
          - Wind would show up with the weather, not on every single big tide.
          - Water draining off the flats happens after low tide. But Fell's rise happens after high tide, right after the turn.
  # ---------------------------------------------------------------- day 6
  - title: When one wave comes back again and again
    objective: Add the repeated reflections at the wall and decide what repeated evidence can actually prove.
    briefing: Seven working days remain. The far wall sees a much larger rise than the first arriving wave can explain.
    stake: >-
      On the sixth morning one wave reaches the wall, reflects, returns and reflects again. Today you sum the whole chain,
      decide when a shrinking sequence really has a finite total, and stop the station from treating one
      drifting float as proof of what the entire estuary does.
    takeaway: Repeated terms can have a finite total, but a tidy total is not permission to generalize one measurement to an entire system.
    segue: >-
      The reflected-wave chain explains the high reading at the wall, so the old wall-design assumption
      goes into the safety review. The flood gates are still the thing that can protect the marsh this
      month. On day 7 the gates themselves become part of the mathematics: once they move, the water level
      behind them changes the rate of everything that follows.

          whether it would build to something larger than the first arrival, because those two
          properties are what Fell's notebook actually records.
        assumes:
          - a disturbance takes time to travel the length of a wall and back
        takeaway: Something that arrives, returns and arrives again builds a running total, and the total is what is measured.
        format: CHOICE
        question: What kind of process would produce Fell's twenty minutes, on every large tide?
        why: >-
          A disturbance running down the wall, reflecting off the hard end and coming back is the
          only one of these that repeats and that builds. Each return brings a fraction of the last
          one, and they arrive in step because the return trip takes about as long as the forcing
          period, so what the gauge reads is a running total rather than a single arrival. That total
          is a sum whose terms shrink, which is why it settles on a value instead of growing without
          limit.

      - group: PRED
        task: Decide what terms shrinking to zero actually prove
        title: Do smaller and smaller terms guarantee a total?
        reason: The station keeps treating 'eventually tiny' as though it automatically means 'safe to ignore'
        concept: The nth-term test, and what it can and cannot settle
        place: Prediction Office
        scene: >-
          Achterberg shows two infinite sums. In both, the terms get smaller and approach zero. One sum
          settles to a finite value and the other does not. Calloway wants the exact conclusion the
          shrinking terms do and do not justify.
        guide: >-
          Here are four claims about a sum whose terms shrink to zero. For each one, ask what it
          actually lets you write in a report. Here is the key difference. A test can rule a sum
          out, or it can rule one in. This one only does the first. Terms shrinking to zero is
          required for a sum to settle. It is nowhere near enough on its own.
        assumes:
          - a sum can only settle if its terms eventually become small
        takeaway: Terms shrinking to zero is required for a sum to settle on a total. It is not proof that one exists.
        format: CHOICE
        question: If the terms of an infinite sum shrink to zero, what can you conclude for certain?
        why: >-
          On its own, it proves nothing. If the terms don't shrink to zero, the sum definitely
          has no total. So this test can rule a sum out. It cannot rule one in. The terms 1/n
          shrink to zero, and their sum still grows without limit. The terms 1/n² also shrink to
          zero, and their sum settles just fine. Both have terms vanishing to nothing. What
          separates them isn't the size of any one term. It's how fast the sizes fall away.
        choices:
          - That nothing follows from this alone. Terms that failed to shrink to zero would settle it outright.
          - That the sum has a total, since the terms eventually add nothing.
          - That the sum has no total, since infinitely many terms are still being added.
          - That the sum has a total if the terms are also all positive.
        answer: That nothing follows from this alone. Terms that failed to shrink to zero would settle it outright.
        rebuttals:
          - The terms 1/n shrink to zero, and their sum still climbs past every value eventually.
          - Terms that shrink fast enough do settle on a total. So the number of terms alone can't decide it either.
          - Positive terms that shrink slowly still have no total. The harmonic series is a perfect example, and every one of its terms is positive.

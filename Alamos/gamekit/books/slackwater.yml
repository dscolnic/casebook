# Slack Water — Sarn Barrage, and twelve working days before the equinoctial springs.
#
# Written to gamekit/tools/BOOK_TEMPLATE.md. The place is themes/slackwater/site.js.
#
# AP Calculus BC, the half of the course that starts where AB stops: parametric,
# polar and vector-valued functions, series and convergence, and the integration
# techniques the second term adds. Twelve of the thirty-six stops are DERIVE
# panels and they are the spine — one a day, in the order the mathematics has to
# arrive in:
#
#   day  1  the beat of two constituents, out of a sum-to-product identity
#   day  2  speed as the size of a velocity vector
#   day  3  arc length, out of the speed the day before
#   day  4  the bound on a truncated harmonic sum
#   day  5  the area of a polar region
#   day  6  the sum of a reflection chain
#   day  7  the impoundment equation, separated and solved
#   day  8  the flushing integral, taken to infinity
#   day  9  the shallow-water correction, expanded about mean level
#   day 10  the Lagrange bound on what that expansion left out
#   day 11  the generation integral, by parts
#   day 12  the radius of convergence of the expansion the programme rests on
#
# `askRule: true` is on. In this course the name of the licence IS the content:
# a student who differentiates a product correctly and calls it the chain rule
# has not understood which rule did the work, and the commonest lost point on the
# BC paper is a line that is algebraically legal and licensed by nothing.
#
# The argument: Calloway holds that a prediction with a stated bound is a
# measurement of the future and that the gate programme should be written from
# it. Oyelaran holds that a barrage closes on what the gauge reads. Calloway is
# right on day 4 — the bound is smaller than the gauge's own lag, so waiting for
# the reading costs the window and buys nothing. Oyelaran is right on day 10 —
# a surge is not periodic, so no number of constituents contains it and the
# bound, honestly computed, is a bound on the wrong quantity.
#
# The timeline the cards are checked against:
#   nine years ago      the barrage commissioned; the harmonic constants fitted
#   March, last year    the eastern sluice re-gated; the wall left un-surveyed
#   ten days ago        float 7 released on the ebb, still out
#   now                 twelve working days to the equinoctial springs
#   day 13              predicted 11.4 m range, with a surge forecast on top
#   six weeks after     the licence review that decides the generation window

theme:
  id: slackwater
  title: Slack Water
  subtitle: Tidal Prediction Lead · Sarn Barrage, twelve days before the springs

groups:
  - id: PRED
    code: PRED
    name: Prediction Office
    color: '#4f7fa8'
    desc: The tide written as a sum, and what is left out of the sum.
    defaultLeader: calloway
    milestones: [Fit the constants, Bound the tail, State the error, Ready to hand over]
  - id: TRACK
    code: TRACK
    name: Survey & Drift
    color: '#3f8f7a'
    desc: A float is a path in time, and every question about it is a question about two rates.
    defaultLeader: palmer
    milestones: [Recover the float, Read the track, Measure the length, Ready to hand over]
  - id: ROSE
    code: ROSE
    name: Currents Room
    color: '#8a6fb0'
    desc: Speed against bearing, which is a curve in polar form and an area worth having.
    defaultLeader: vos
    milestones: [Plot the rose, Take the area, Compare the halves, Ready to hand over]
  - id: SLUICE
    code: SLUICE
    name: Sluice Control
    color: '#c2703f'
    desc: Six gates, a impoundment behind them, and a rate that depends on what it has already done.
    defaultLeader: oyelaran
    milestones: [Set the rate, Solve the fill, Step the model, Ready to hand over]
  - id: FLATS
    code: FLATS
    name: Mud Laboratory
    color: '#8a8f4a'
    desc: What the estuary keeps and what it flushes, over a tail that never quite ends.
    defaultLeader: ude
    milestones: [Sample the flats, Take the tail, Bound the exchange, Ready to hand over]
  - id: WALL
    code: WALL
    name: Wall Station
    color: '#6f6a86'
    desc: The training wall, two hundred metres along the shore, where a wave comes back and comes back again.
    defaultLeader: grieve
    milestones: [Time the return, Sum the chain, Set the limit, Ready to hand over]

roster:
  - id: calloway
    name: Idris Calloway
    role: Chief Tidal Analyst
    division: PRED
    bio: |
      Fitted the harmonic constants for this station nine years ago and has
      re-fitted them twice since. He holds that a tide is the most predictable
      thing in the natural world and that people who say otherwise are thinking
      of weather.

      His argument with operations is always the same. A prediction with a bound
      printed beside it is not a guess; it is a measurement of a time that has
      not happened yet, and refusing to act on one is refusing the only warning
      the estuary ever gives in advance.

      His limit is that his bound is a bound on the sum he wrote down. Anything
      the sum does not contain is outside it, and a bound that is honest about
      the wrong quantity is the most convincing wrong number there is.
    quiz:
      - q: Why does Calloway treat a prediction with a bound as better than a later reading?
        a: The bound is a stated ceiling on the error, and it arrives while there is still time to act
        wrong:
          - Gauges at this station are calibrated only once a year and drift badly between visits
          - A harmonic prediction contains the surge as well, so nothing further is needed
          - Readings from a stilling well are averages and cannot be compared with predictions
  - id: achterberg
    name: Wren Achterberg
    role: Harmonic Analyst
    division: PRED
    bio: |
      Runs the constituent list. Thirty-seven of them are fitted for this
      station and eight are used for the daily prediction, and she can say what
      each of the other twenty-nine is worth in centimetres.

      She thinks in tails rather than in terms. Her question about any sum is
      never whether it is right but how much of it has been thrown away, and
      she keeps the dropped amplitudes on the wall in descending order so that
      nobody has to guess.

      Her limit is that the list is fitted to nine years of this station's own
      record. A constituent that was small in those nine years is small on her
      wall whatever the estuary has done since the sluice was re-gated.
    quiz:
      - q: Why does Achterberg keep the amplitudes of the constituents she does not use?
        a: Their sum is the worst the dropped tail can contribute, which makes the truncation a number
        wrong:
          - The unused constituents are needed to check that the fitted phases are consistent
          - A constituent can be promoted into the daily list only if its amplitude is recorded
          - The list has to show thirty-seven entries for the record to be accepted at review
  - id: oyelaran
    name: Renate Oyelaran
    role: Barrage Master
    division: SLUICE
    bio: |
      Has the authority to close the gates and is the only person here who has
      used it against a prediction. That was four years ago, in a surge, and
      the prediction was excellent and the water came over the wall anyway.

      She is careful about how she puts it. The prediction is not wrong and
      Calloway is not careless. Her point is narrower: the harmonic sum is
      built out of things that repeat, and the water that has done the damage
      at this barrage twice in nine years was pushed up the estuary by wind.

      Her limit is that closing early costs the generation window and floods
      the upper marsh, and a gate closed on a surge that then does not arrive
      leaves nothing in the record to defend the decision with.
    quiz:
      - q: Why does Oyelaran hold that a good prediction can still be the wrong thing to close on?
        a: A harmonic sum contains only what repeats, and wind-driven water does not
        wrong:
          - Predictions at this station are issued for the outer gauge rather than for the impoundment
          - The gates take four hours to close, which is longer than any prediction is valid for
          - Harmonic constants fitted nine years ago are no longer accurate enough to use
  - id: beke
    name: Tomas Beke
    role: Sluice Engineer
    division: SLUICE
    bio: |
      Six gates, two of them re-gated last March, and a impoundment of four hundred
      hectares behind all of them. He is the person who can tell you what the
      flow through an opening actually does as the levels come together.

      He works in steps rather than in solutions. The gate programme is a table
      of what to do at the top of each half hour, so a rate that changes
      continuously has to be turned into something a person on a walkway can
      follow, and he wants to know how much the stepping itself costs.

      His limit is that his table is only as good as its interval. He has never
      been given a defensible reason for using half an hour rather than ten
      minutes, and he asks for one about twice a year.
    quiz:
      - q: Why does Beke want to know the cost of the interval his gate table uses?
        a: Stepping a changing rate forward in flat pieces leaves an error that depends on the step
        wrong:
          - A shorter interval would let the gates be worked by one operator instead of two
          - The table has to match the half-hourly interval the licence reports are written to
          - Flow through a sluice cannot be computed at all unless the interval is fixed first
  - id: palmer
    name: Sunniva Palmer
    role: Hydrographic Surveyor
    division: TRACK
    bio: |
      Runs the launch and the float programme. Eleven drifting floats have gone
      into this estuary in two years and nine have come back, which she regards
      as a good return and Calloway regards as a sampling problem.

      A float is the only instrument here that reports what the water actually
      did rather than what a model of the water says. It carries no compass and
      no speedometer: it carries a clock and a position, and everything else
      about its journey has to be got out of those two columns.

      Her limit is that a track is one path on one tide. She will not generalise
      from a single float and she has watched other people do it in reports she
      has had to sign.
    quiz:
      - q: Why does Palmer say a float reports nothing directly about how fast the water was moving?
        a: It records position against time, and speed has to be worked out from how those change
        wrong:
          - The floats are ballasted for the surface layer and read only the top half metre
          - Its clock and its position fixes are taken at different intervals and cannot be paired
          - A float travels more slowly than the water it sits in because of the drag of its drogue
  - id: mbeki
    name: Owen Mbeki
    role: Drifter Technician
    division: TRACK
    bio: |
      Builds and recovers the floats. He knows where they strand, which is a
      shorter list than the chart suggests, and he has walked most of the
      eastern flats at low water looking for them.

      The one that is out now went in on the ebb ten days ago and has been
      reporting a fix every ten minutes since. He is interested in the
      difference between how far it has gone and how far away it is, because
      the second number is small and the first one is not.

      His limit is that a stranded float keeps reporting from wherever it
      stranded, and the record does not say which fixes were taken in water.
    quiz:
      - q: Why is Mbeki unwilling to read the float's total travel off its start and finish positions?
        a: A path that turns with each tide is far longer than the gap between its ends
        wrong:
          - The first and last fixes are the two least accurate ones in the record
          - Fixes are dropped whenever the float is inside the barrage, so the ends are missing
          - The float is recovered by boat, so its finish position is not where it stopped
  - id: vos
    name: Dr. Halina Vos
    role: Currents Scientist
    division: ROSE
    bio: |
      Reads the current meters. There are four of them on the barrage face and
      one on the wall, and each reports a speed and a bearing every ten minutes,
      which she plots as a figure rather than as two columns.

      Her figures are polar because the estuary is. A current at this station is
      not a number that goes up and down; it is a direction that swings through
      the whole compass twice a day and is much stronger on one leg than the
      other, and the shape of that asymmetry is what moves the sediment.

      Her limit is that a rose throws time away. Two tides that reached the same
      speeds in the same directions in a different order plot identically.
    quiz:
      - q: What does Vos accept she has lost by plotting a tide as a rose rather than as two columns?
        a: The order in which the speeds and bearings occurred
        wrong:
          - The bearings, which have to be converted to radians before plotting
          - The slack water periods, which have no bearing and cannot be drawn
          - The peak speed, since the outer edge of a rose is an average
  - id: loots
    name: Pieter Loots
    role: Instrument Technician
    division: ROSE
    bio: |
      Keeps the current meters running, which at this station means keeping mud
      out of them. He services the barrage-face four on a fortnightly cycle and
      the wall meter whenever the launch can get alongside.

      He is exact about what an instrument reports. A meter gives an average
      over its own sampling interval and a bearing referred to magnetic north,
      and both of those have been the answer to a disagreement between a plot
      and a float at least once each.

      His limit is the wall meter. It has been serviced twice this year instead
      of six times, and he says so in writing every month.
    quiz:
      - q: Why does Loots insist a meter's reading is an average rather than a value?
        a: Each figure is taken over the meter's own sampling interval, and anything faster is smoothed away
        wrong:
          - The meters average four sensors, one at each corner of the housing
          - Readings are averaged in the office before they reach the currents room
          - A bearing referred to magnetic north cannot be reported instantaneously
  - id: ude
    name: Nkechi Ude
    role: Estuary Ecologist
    division: FLATS
    bio: |
      Runs the mud laboratory, which is a bench, a drying oven and eleven years
      of cores. Her subject is what the estuary keeps: the fine sediment, the
      nutrients that come with it and the animals that live in both.

      Her question about any discharge is how long it stays. A tide that
      exchanges a third of the impoundment every cycle does not clear it in three
      tides, because what comes back on the flood is partly what went out on
      the ebb, and the tail of that process is long enough to matter.

      Her limit is that the tail is where the assumptions live. She can measure
      the first few tides directly and everything after that comes out of a
      model she did not fit.
    quiz:
      - q: Why does Ude reject the idea that a impoundment exchanging a third of its water each tide is clear in three tides?
        a: Part of what leaves on the ebb returns on the flood, so the decline is a fraction of a fraction
        wrong:
          - The exchange fraction falls as the impoundment empties, so later tides move less water
          - Fine sediment settles out before the third tide and is no longer in the water
          - Three tides is less than the time the laboratory needs to take a sample
  - id: reddy
    name: Cal Reddy
    role: Sediment Technician
    division: FLATS
    bio: |
      Takes the cores and runs the oven. Fourteen stations on the flats, four
      times a year, at low water on a spring tide, which is the only time most
      of them can be reached on foot.

      He is the reason the record is comparable. Every core is taken at the
      same state of the tide, in the same order, by somebody who walks the same
      route, because the alternative is a series of samples that differ by
      whatever the weather was doing.

      His limit is the two stations out past the wall, which need the launch. In
      a bad quarter they are missed, and a missing station is not the same as a
      zero.
    quiz:
      - q: Why does Reddy take every core at the same state of the tide?
        a: Otherwise a difference between cores could be the tide rather than the flats
        wrong:
          - The oven cannot process wet cores taken on a flood tide
          - Low water on a spring tide is the only time the flats are legally accessible
          - Sediment concentration is defined at low water in the licence
  - id: grieve
    name: Marta Grieve
    role: Structures and Resonance Engineer
    division: WALL
    bio: |
      Responsible for the training wall, three hundred metres of concrete and
      armour that turns the ebb into a channel and is the reason the barrage has
      a deep berth in front of it.

      Her subject is what comes back. A long wall with a hard end reflects part
      of every wave that runs down it, and when the return trip takes about as
      long as the forcing period the returns arrive in step and add up. The
      arithmetic is a chain of diminishing bounces and its total is not the
      first one.

      Her limit is that the wall has not been surveyed since it was re-gated,
      so the fraction that survives a round trip is a number she is working
      from a fortnight of records rather than from the wall itself.
    quiz:
      - q: Why does Grieve say the height at the wall is not the height of the first wave?
        a: Each reflection returns a fraction of the last and they arrive in step, so they add
        wrong:
          - The wall shoals the water, which raises every wave passing along it
          - The first wave is measured at the gauge and the others at the wall head
          - Reflections arrive out of step and cancel, which lowers the total
  - id: fell
    name: Jonas Fell
    role: Wall Keeper
    division: WALL
    bio: |
      Walks the wall. Two hundred and forty armour units, a gauge at the head, a
      hut with a stove in it, and a causeway that is covered for four hours
      either side of high water.

      He is the person who knows what the sea does out there, which is not what
      it does at the barrage. He has watched the gauge at the head go on rising
      for twenty minutes after the level at the gates has turned, and he has
      been telling the office that for two years.

      His limit is that he has a gauge and a notebook. Nobody has ever gone out
      with an instrument fast enough to record what he is describing.
    quiz:
      - q: Why does Fell's observation at the wall head matter to the barrage?
        a: A level still rising out there after the gates have turned means the two ends are not one water level
        wrong:
          - The wall gauge is the reference the barrage predictions are issued for
          - It shows the wall gauge reads twenty minutes late and needs recalibrating
          - It means the causeway is covered for longer than the tables say

glossary:
  - name: Tide
    aliases: [tide, tides, tidal]
    def: The rise and fall of the water, morning and afternoon, at this station.
  - name: Estuary
    aliases: [estuary, estuaries]
    def: The reach of a river that salt water comes up into, where the two meet and mix.
  - name: Chart datum
    aliases: [chart datum, datum]
    def: The level every depth and height at a station is quoted above, chosen so the water very rarely goes under it.
  - name: Tidal range
    aliases: [tidal range, range of the tide]
    def: How far the level moves between one turn and the next, in metres.
  - name: Spring tide
    aliases: [spring tide, springs, equinoctial springs]
    def: The largest tides of a month, when the sun and the moon line up and their effects add.
  - name: Neap tide
    aliases: [neap tide, neaps]
    def: The smallest tides, a week later, when the two are working across each other.
  - name: Ebb
    aliases: [ebb, ebbing, on the ebb]
    def: The part of a tide when the level is going down and water is leaving through the gates.
  - name: Flood
    aliases: [flood tide, on the flood, flooding tide]
    def: The part of a tide when the level is coming up and water is entering through the gates.
  - name: Slack water
    aliases: [slack water, slack]
    def: The short period at the turn, when the water is barely moving in any direction.
  - name: Amplitude
    aliases: [amplitude, amplitudes]
    def: How far one rising-and-settling term reaches either side of its own mean.
  - name: Phase lag
    aliases: [phase lag, phase, lag of]
    def: How far behind its cause one term of a prediction arrives at this particular station.
  - name: Tidal constituent
    aliases: [tidal constituent, constituent, constituents]
    def: One cosine term of what a prediction is built by adding, with its own size, period and timing.
  - name: Harmonic prediction
    aliases: [harmonic prediction, predicted tide, prediction for]
    def: A level worked out by adding up the terms fitted to a station's own past record.
  - name: Storm surge
    aliases: [storm surge, surge]
    def: Extra water pushed inland by wind and by a drop in air pressure, which does not repeat on any regular period.
  - name: Shallow-water overtide
    aliases: [shallow-water overtide, overtide, shallow-water term]
    def: An extra term made where the water is shoal, running at two or three times the speed of what produced it.
  - name: Barrage
    aliases: [barrage]
    def: A structure built across the neck of an estuary with gates in it, to hold a difference in level and to pass water through turbines.
  - name: Sluice
    aliases: [sluice, sluice gate, gates]
    def: A gate that can be set anywhere between shut and fully open.
  - name: Impoundment
    aliases: [impoundment, impounded water]
    def: The water held on the landward side, four hundred hectares of it at this station.
  - name: Head
    aliases: [head, head across the gates]
    def: The difference in level across the gates at one instant, which is what drives the flow through them.
  - name: Tide gauge
    aliases: [tide gauge, gauge, gauges]
    def: An instrument that records the water level against time at one place.
  - name: Stilling well
    aliases: [stilling well, well]
    def: A vertical tube with a small inlet that a gauge floats in, so waves are smoothed out before the level is read.
  - name: Training wall
    aliases: [training wall, the wall]
    def: A wall built out from the shore to hold the outgoing water in one channel instead of letting it spread.
  - name: Seiche
    aliases: [seiche]
    def: A standing oscillation of the water along a wall, set going from outside and kept going by its own reflections.
  - name: Drifting float
    aliases: [drifting float, float, drifter]
    def: A weighted buoy that goes wherever the water goes and reports where it is every few minutes.
  - name: Fix
    aliases: [fix, fixes, position fix]
    def: One recorded position at one recorded time.
  - name: Bearing
    aliases: [bearing, bearings]
    def: A direction, given as an angle round from north.
  - name: Current rose
    aliases: [current rose, rose, rose plot]
    def: A figure with speed drawn as a distance from the centre and direction as the angle round it.
  - name: Partial sum
    aliases: [partial sum, partial sums]
    def: What a sum comes to after a stated number of its terms, before any of the rest are added.
  - name: Convergence
    aliases: [convergence, converge, converges, convergent]
    def: The property of a running total that settles on one value however many further terms are added.
  - name: Truncation
    aliases: [truncation, truncated, truncate]
    def: Stopping after a chosen number of terms and using what you have.
  - name: Arc length
    aliases: [arc length, length of the path, length of the track]
    def: The distance actually travelled along a path, as against the straight-line gap between its ends.
  - name: Polar form
    aliases: [polar form, polar, in polar]
    def: Describing a curve by how far out it reaches at each direction, rather than by height against distance.
  - name: Taylor polynomial
    aliases: [taylor polynomial, taylor, maclaurin, expansion about]
    def: A polynomial built from the value and the derivatives of a quantity at one point, used as a stand-in for it nearby.
  - name: Error bound
    aliases: [error bound, bound on the error, stated bound]
    def: A number the error is guaranteed not to exceed, as against an estimate of what the error probably is.
  - name: Euler step
    aliases: [euler step, euler's method, stepped forward]
    def: Advancing a quantity by assuming its present rate holds for a short interval, then working the rate out again.
  - name: Flushing time
    aliases: [flushing time, flushing, exchange time]
    def: How long this reach takes to replace what is dissolved in it, counted over the whole tail of the process.
  - name: Exchange fraction
    aliases: [exchange fraction, exchanged each tide]
    def: The share of the impounded water that leaves and is replaced by new water in one tide.

missions:
  # ---------------------------------------------------------------- day 1
  - title: The board and the gauge
    objective: Establish what the prediction is made of, and what the barrage does with it.
    briefing: Twelve working days to the equinoctial springs, and the gate programme has not been written.
    stake: >-
      Monday, and the springs are twelve working days out. Sarn Barrage holds a impoundment of four
      hundred hectares behind six gates, and the programme that says when each one moves is
      written from a predicted tide rather than from a measured one. Idris Calloway, the chief
      tidal analyst, fitted the constants for this station and reads the board every morning.
      Renate Oyelaran, the barrage master, has closed against a prediction once in nine years
      and remembers it. Today you take the prediction apart into the terms it is made of, work
      out what the head across the gates will be at the top of the afternoon, and find out what a
      drifting float can and cannot tell you. A gate programme built on a number nobody can
      defend is a licence review nobody can defend either.
    takeaway: A predicted tide is a sum of terms, and every question about it is a question about the terms.
    stops:
      - group: PRED
        task: Get the spring interval out of two constituents
        title: Two terms and a fortnight
        concept: A quantity written as a sum of periodic terms
        place: Prediction Office
        scene: >-
          Calloway has the two largest constituents on the board and nothing else: one driven by
          the moon, one by the sun, each with the same amplitude this month. He wants the interval
          between one spring tide and the next out of those two lines alone.
        guide: >-
          You build the working a line at a time, choosing at each step the expression the line
          above actually gives you. Every wrong branch here is legal algebra, so looking for a
          malformed line will not help. Two cosines added can be rewritten as a product of two
          cosines, one fast and one slow, and it is the slow factor that decides how often the
          two terms come back into step.
        background:
          - >-
            Why a product rather than a sum. Added together, two cosines of nearly equal speed
            give a wave whose height rises and falls over days. Written as a product, that is
            explicit: one factor at the average speed, one at half the difference, and the second
            factor is the envelope the first one runs inside.
          - >-
            Where the factor of two comes from at the end. The springs happen whenever the
            envelope is at its largest, and the envelope is the size of the slow cosine rather
            than the cosine itself. A cosine reaches its largest size twice per period, once
            positive and once negative, so the interval between springs is half the period of the
            slow factor.
          - >-
            Why the amplitudes were made equal for this exercise. When the two amplitudes differ,
            the envelope never reaches zero and the arithmetic acquires a term that carries no
            teaching. The real station has the moon term at 3.4 m and the sun term at 1.1 m, and
            the interval between springs comes out the same, because it depends on the two speeds
            and not on the two heights.
        assumes:
          - a cosine of angular speed ω has period 360° ÷ ω
          - two terms are in step when their arguments differ by a whole number of turns
        takeaway: A beat interval is set by the difference of two speeds, not by either speed and not by the amplitudes.
        format: DERIVE
        question: How long is it from one spring tide to the next, out of the two constituents' speeds?
        answerText: >-
          About 353 hours, which is 14.7 days. The slow factor has a period of 706 hours and the
          springs come at every peak of its size, which is twice per period.
        why: >-
          The interval comes out at 14.7 days. Adding two cosines of nearly equal speed is the
          same thing as multiplying a fast cosine by a slow one, and the slow factor runs at half
          the difference of the two speeds. That is 0.51 degrees an hour here, so the slow cosine
          takes 706 hours to come round. The springs arrive whenever that factor is largest in
          size, which happens twice in each of its periods, and half of 706 hours is a fortnight.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: h(t) = A·cos(ω₁t) + A·cos(ω₂t)
          startNote: ω₁ = 28.98 °/h for the moon term, ω₂ = 30.00 °/h for the sun term, A = 1.7 m for both this month
          goal: the interval between one spring tide and the next, in days
          askRule: true
          rules:
            - trigonometric identity
            - rearrangement
            - period of a cosine
            - the size of a factor
            - substitution of the fitted values
          steps:
            - ask: Write the sum of the two cosines as a product.
              answer: 0
              candidates:
                - text: 2A·cos(½(ω₁+ω₂)t)·cos(½(ω₁−ω₂)t)
                  rule: trigonometric identity
                - text: 2A·cos(½(ω₁+ω₂)t)·sin(½(ω₁−ω₂)t)
                  rule: trigonometric identity
                  survives: true
                  why: >-
                    That is the identity for a difference of cosines, and it is a perfectly good
                    product. It is also zero at t = 0, where the two terms are in fact exactly in
                    step, so the derivation runs on and puts a spring tide where a neap is.
                - text: A²·cos(ω₁t)·cos(ω₂t)
                  rule: trigonometric identity
                  why: >-
                    The two terms are added, not multiplied, so nothing here should end up with an
                    amplitude squared. A metre squared is not a level.
                - text: A·cos((ω₁·ω₂)t)
                  rule: rearrangement
                  why: >-
                    A product of two angular speeds has units of degrees squared per hour squared,
                    which cannot be inside a cosine at all.
            - ask: Say which factor is the slow one, and what its angular speed is.
              answer: 2
              candidates:
                - text: the first factor, at ½(28.98 + 30.00) = 29.49 °/h
                  rule: substitution of the fitted values
                  why: >-
                    That is the fast factor. It comes round in a little over twelve hours, which is
                    the tide itself rather than the fortnight the tide is running inside.
                - text: the second factor, at (30.00 − 28.98) = 1.02 °/h
                  rule: substitution of the fitted values
                  survives: true
                  why: >-
                    The half has been dropped. The number is the right size and the wrong value, and
                    it halves every result after it — a fortnight becomes a week and looks credible.
                - text: the second factor, at ½(30.00 − 28.98) = 0.51 °/h
                  rule: substitution of the fitted values
                - text: the second factor, at ½(30.00 + 28.98) = 29.49 °/h
                  rule: rearrangement
                  why: >-
                    The identity puts the difference in the slow factor and the sum in the fast one.
                    Using the sum in both leaves nothing slow anywhere in the expression.
            - ask: Turn the slow factor's angular speed into the period of that cosine.
              answer: 1
              candidates:
                - text: T = 2π ÷ 0.51 = 12.3 h
                  rule: period of a cosine
                  why: >-
                    The speed is in degrees an hour, so a full turn is 360 of them and not 2π. Mixing
                    the two conventions here gives an answer near the tidal period, which is exactly
                    the wrong order of magnitude to notice.
                - text: T = 360° ÷ 0.51 °/h = 706 h
                  rule: period of a cosine
                - text: T = 0.51 ÷ 360 = 0.0014 h
                  rule: rearrangement
                  survives: true
                  why: >-
                    An inverted division that still divides. Every unit cancels the wrong way, and the
                    only tell is that a fortnight has come out as five seconds.
                - text: T = 180° ÷ 0.51 °/h = 353 h
                  rule: period of a cosine
                  why: >-
                    That is the right final number reached one step early, by using half a turn as the
                    period of a cosine. The halving belongs to the next line and for a stated reason.
            - ask: The springs come whenever the slow factor is largest in size. How often is that?
              answer: 3
              candidates:
                - text: once per period, 706 h — every 29.4 days
                  rule: period of a cosine
                  survives: true
                  why: >-
                    A month is a thoroughly plausible answer for a tidal cycle and it is the wrong
                    one. It counts only the positive peaks of the slow cosine, but the envelope is the
                    size of that factor, and its negative peak is just as large.
                - text: four times per period, 176 h — every 7.4 days
                  rule: the size of a factor
                  why: >-
                    A cosine reaches its largest size twice per period, not four times. Four counts the
                    zeros as well, which are the neaps.
                - text: it does not repeat, so there is no interval
                  rule: the size of a factor
                  why: >-
                    The slow factor is a cosine, so its size is periodic by construction. Something
                    that did not repeat could not be written as this product at all.
                - text: twice per period, 353 h — every 14.7 days
                  rule: the size of a factor
          commit: Commit the derivation
      - group: SLUICE
        task: Work out the head across the gates at 14:00
        title: What the gates will see at two o'clock
        concept: A quantity written as a sum of periodic terms
        place: Sluice Control
        scene: >-
          Oyelaran wants the head across the gates at 14:00 before she signs the afternoon
          programme. The impoundment is being held at 4.30 m. Outside, the prediction is the mean level
          with two terms on top of it, each already evaluated for that hour.
        guide: >-
          Five quantities are on offer and three of them belong in the sum. Two of the five are the
          constituents' own amplitudes rather than what those constituents are contributing at
          14:00, and the difference between an amplitude and a term's present value is the whole of
          what this stop is about. The head is what is left after the impoundment level is taken off the
          outside level.
        assumes:
          - a constituent contributes its amplitude only at the moment its cosine is one
        takeaway: An amplitude is the most a term can ever contribute; what it is contributing now is a different number.
        format: BALLPARK
        question: What is the head across the gates at 14:00?
        estimate:
          prompt: >-
            The afternoon programme is signed against this number. Outside level is the station mean
            plus the two constituent terms; the impoundment is being held where it is.
          question: What is the head across the gates at 14:00?
          relationship: >-
            Head = mean level + each constituent's term at that hour − the level held in the impoundment.
          labels:
            - 6.10 m  (station mean level)
            - +2.41 m  (the moon term at 14:00)
            - −0.62 m  (the sun term at 14:00)
            - −4.30 m  (the level held in the impoundment)
            - 3.40 m  (the moon term's amplitude)
          values: [6.10, 2.41, -0.62, -4.30, 3.40]
          slots: 4
          template: '{0} + {1} + {2} + {3}'
          formula: a+b+c+d
          correct: [0, 1, 2, 3]
          target: 3.59
          tolerance: 0.12
          units: m
          solution: 6.10 + 2.41 − 0.62 − 4.30 = 3.59 m of head.
          explanation: >-
            The two terms are what those constituents are worth at 14:00, not what they are worth at
            their own high water. Using an amplitude instead puts a metre of head on the sheet that
            the water will not supply.
        why: >-
          The head is 3.59 m. A constituent is a cosine, so it contributes its full amplitude only
          at the instant its own cosine reaches one, and at any other hour it contributes less —
          or, on the far side of its cycle, takes level away. The sun term is negative at 14:00 and
          the moon term is at about seven tenths of its amplitude. The head is the outside level
          minus the level being held inside, and both of those are levels above the same datum.
      - group: TRACK
        task: Ask Mbeki what the float's record contains
        title: A clock and a position
        concept: Parametric curves, and a path described by time rather than by x
        place: Survey Pontoon
        person: true
        scene: >-
          Owen Mbeki, the drifter technician, has float 7 on the screen at the pontoon. It went out
          on the ebb ten days ago and has reported a position every ten minutes since. There is no
          other instrument on it.
        guide: >-
          All four options are things somebody might want from a float. Ask of each whether a
          column of times and a column of positions could contain it directly, or whether it would
          have to be worked out from how those columns change. What is recorded and what is
          recoverable are different questions, and only one of the four is recorded.
        assumes:
          - a position is two coordinates, and a track is those coordinates against time
        takeaway: A path given as two coordinates against time carries its speed and its direction implicitly, not explicitly.
        format: CHOICE
        question: What does float 7's record contain directly, without anything being worked out?
        why: >-
          The record is where the float was and when it was there. Speed does not appear in it:
          speed is how fast those coordinates are changing, and getting it means differencing the
          columns. The same goes for the direction of travel and for the distance covered. A path
          described by two coordinates against time is the definition of a parametric curve, and
          every question about how it moved is a question about the rates of its two coordinates.
        choices:
          - Where it was at each of a series of times
          - How fast it was moving at each of those times
          - The length of the path it has followed since release
          - The bearing it was travelling on at each fix
        answer: Where it was at each of a series of times
        rebuttals:
          - Speed is the rate the coordinates change at, which is recoverable from the record rather than in it.
          - Length has to be accumulated along the whole path, and no single fix contains any of it.
          - A direction of travel is the ratio of two rates, and one fix on its own has no rates.
  # ---------------------------------------------------------------- day 2
  - title: A path, not a shape
    objective: Get speed and heading out of a record that contains neither.
    briefing: Float 7 is still out, and eleven days of fixes have never been reduced.
    stake: >-
      Tuesday, and float 7 has been in the water eleven days. Sunniva Palmer, the hydrographic
      surveyor, has its fixes in two columns and wants them turned into the numbers the sediment
      work needs. Dr. Halina Vos, the currents scientist, has four meters on the barrage face
      reporting speed and bearing every ten minutes, which is the same information written the
      other way round, and the two records have never been compared. Today you get the float's
      speed at a stated hour, work out the heading of its track where it passes the meters, and
      settle what the office can safely say from eight constituents rather than thirty-seven. If
      the float and the meters disagree, the sediment budget in the licence report rests on
      whichever one somebody preferred.
    takeaway: A record of positions against time holds the speed and the heading, but neither is written in it.
    stops:
      - group: TRACK
        task: Get the float's speed at 14:00 from its fitted track
        title: Two rates make one speed
        concept: Speed as the magnitude of a velocity vector
        place: Survey Pontoon
        scene: >-
          Palmer has fitted a smooth curve through the last twelve hours of fixes, one expression
          for the easting and one for the northing, both in metres with time in hours from local
          low water. She wants the speed at t = 2.0 h.
        guide: >-
          You build the working a line at a time, choosing the expression the line above gives
          you. Each coordinate is differentiated separately, which turns one path into two rates.
          Only then do the two rates combine, and they combine as the sides of a right-angled
          triangle rather than by being added. Watch the inner factor on the easting: its angle is
          not simply t.
        background:
          - >-
            Why the components are differentiated separately. Position here is two numbers that
            happen to share a clock. Nothing in the easting expression appears in the northing
            one, so each is differentiated on its own, and the pair of answers is the velocity.
          - >-
            Why speed throws the direction away. Velocity is a pair of numbers and speed is one.
            Squaring both, adding and taking the root gives the length of the arrow without any
            record of where it points, which is exactly what is wanted when the next step is to
            accumulate distance along the path.
          - >-
            What the inner factor is doing. The easting is a sine of πt/6.2 rather than of t,
            because the tide comes round in 12.4 hours, and differentiating it brings the π/6.2
            out in front. That factor is 0.507 per hour, and forgetting it makes the eastward rate
            twice as large as anything this estuary has ever recorded.
        takesAsRead:
          - A rate of change, and the derivative as a rate
        assumes:
          - each coordinate can be differentiated on its own with respect to time
        takeaway: Differentiating a path means differentiating its components, and speed is the length of the pair they make.
        format: DERIVE
        question: What speed was float 7 making at t = 2.0 hours?
        answerText: >-
          About 1,540 metres an hour, which is 0.43 m/s. The eastward rate is 1,501 m/h at that
          instant and the northward rate 324 m/h.
        why: >-
          The speed is about 1,540 metres an hour. Differentiating the easting needs the chain
          rule, because the sine is of πt/6.2 and not of t, and that inner factor of 0.507 per hour
          is what keeps the eastward rate at a credible 1,501 metres an hour. The northing is a
          polynomial, so its rate falls steadily and is 324 metres an hour at t = 2. Speed is the
          length of the vector those two make, so the components are squared, added, and rooted.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: x(t) = 5600·sin(πt/6.2),  y(t) = 380t − 14t²
          startNote: metres, with t in hours from local low water; the tide here comes round in 12.4 hours
          goal: the speed at t = 2.0 h, in metres an hour
          askRule: true
          rules:
            - chain rule
            - power rule
            - definition of speed
            - substitution of the stated time
            - rearrangement
          steps:
            - ask: Differentiate the easting with respect to time.
              answer: 1
              candidates:
                - text: dx/dt = 5600·cos(πt/6.2)
                  rule: chain rule
                  survives: true
                  why: >-
                    The inner factor has been dropped. It is a clean derivative of a sine and it is
                    2,837 metres an hour at its peak instead of 1,436, which is a current no
                    instrument at this station has ever seen and nothing later in the working checks.
                - text: dx/dt = 5600·(π/6.2)·cos(πt/6.2)
                  rule: chain rule
                - text: dx/dt = 5600·(π/6.2)·sin(πt/6.2)
                  rule: chain rule
                  why: >-
                    Differentiating a sine gives a cosine. Leaving it as a sine puts the largest
                    eastward rate at the moment the float is furthest east, which is when it is
                    turning.
                - text: dx/dt = 5600·(6.2/π)·cos(πt/6.2)
                  rule: rearrangement
                  why: >-
                    The inner factor is inverted. The chain rule multiplies by the derivative of the
                    inside, which is π/6.2 per hour, not its reciprocal.
            - ask: Differentiate the northing with respect to time.
              answer: 2
              candidates:
                - text: dy/dt = 380 − 14t
                  rule: power rule
                  why: >-
                    The exponent has not come down. Differentiating t² gives 2t, so the coefficient is
                    28 and not 14.
                - text: dy/dt = 380t − 28t
                  rule: power rule
                  why: >-
                    The first term has been left undifferentiated while the second was done. A rate
                    cannot contain the quantity it is the rate of.
                - text: dy/dt = 380 − 28t
                  rule: power rule
                - text: dy/dt = −28t
                  rule: power rule
                  survives: true
                  why: >-
                    A constant term does differentiate to nothing — but 380t is not a constant. Losing
                    it makes the northward rate negative all afternoon, and the float has been going
                    north all afternoon.
            - ask: Put t = 2.0 h into both rates.
              answer: 3
              candidates:
                - text: dx/dt = 2837·cos(2.0) = −1181,  dy/dt = 324
                  rule: substitution of the stated time
                  survives: true
                  why: >-
                    The cosine has been taken of 2.0 radians rather than of πt/6.2 at t = 2, which is
                    1.013 radians. The sign flips, so the float is now travelling west, and every
                    later line is arithmetically perfect.
                - text: dx/dt = 2837·cos(1.013°) = 2837,  dy/dt = 324
                  rule: substitution of the stated time
                  why: >-
                    The argument is in radians, not degrees. Read as degrees it is almost zero, so the
                    cosine is almost one and the rate comes out at its maximum at an arbitrary hour.
                - text: dx/dt = 1501,  dy/dt = 380
                  rule: substitution of the stated time
                  why: >-
                    The northward rate has been left at its value at t = 0. It falls by 28 metres an
                    hour for every hour, and two hours have passed.
                - text: dx/dt = 1501,  dy/dt = 324
                  rule: substitution of the stated time
            - ask: Combine the two rates into the speed.
              answer: 0
              candidates:
                - text: speed = √(1501² + 324²) = 1536 m/h
                  rule: definition of speed
                - text: speed = 1501 + 324 = 1825 m/h
                  rule: definition of speed
                  survives: true
                  why: >-
                    Adding the components is only right when they point the same way, and these are at
                    right angles. It overstates every speed by up to forty per cent and never by
                    enough to look absurd.
                - text: speed = √(1501² − 324²) = 1466 m/h
                  rule: definition of speed
                  why: >-
                    A difference of squares belongs to a right-angled triangle where one of these is
                    the hypotenuse. Here they are the two shorter sides.
                - text: speed = 1501 × 324 = 486,324 m/h
                  rule: rearrangement
                  why: >-
                    A product of two speeds has units of metres squared per hour squared, which is not
                    a speed at all.
          commit: Commit the derivation
      - group: ROSE
        task: Work out the heading of the track where it passes the meters
        title: The slope of a track with no formula
        concept: The slope of a parametric path, dy/dx out of two rates
        place: Currents Room
        takesAsRead:
          - The chain rule, and a quantity that moves because another one does
        scene: >-
          Vos wants the float's track drawn on the chart with the right slope where it passes meter
          three, so that it can be laid over the rose from the same hour. The two rates at that
          instant are on the board.
        guide: >-
          Four quantities are offered and two of them belong in the answer. The track has no
          formula in easting and northing, so its slope on the chart cannot be found by
          differentiating one against the other. What is available is the two rates, and their
          ratio is the slope. The two entries that give a speed rather than a rate are there to be
          left out.
        assumes:
          - a slope on a chart is a change in northing divided by a change in easting
        takeaway: Where a path is given by two rates, its slope is their ratio, and the speed plays no part in it.
        format: BALLPARK
        question: What is the slope of float 7's track at t = 2.0 hours?
        estimate:
          prompt: >-
            The chart wants the track's slope where it passes meter three, at t = 2.0 h. Both rates
            at that instant are on the board, along with the speed they make.
          question: What is the slope of float 7's track at t = 2.0 hours?
          relationship: >-
            Slope of the track = the northward rate divided by the eastward rate at that instant.
          labels:
            - 324 m/h  (northward rate at t = 2.0)
            - 1501 m/h  (eastward rate at t = 2.0)
            - 1536 m/h  (the speed at t = 2.0)
            - 0.43 m/s  (the same speed in SI units)
          values: [324, 1501, 1536, 0.43]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 0.216
          tolerance: 0.02
          units: metres north per metre east
          solution: 324 ÷ 1501 = 0.216, so the track rises about one north for every five east.
          explanation: >-
            A slope is a ratio of two changes in the same instant. The speed is the length of the
            velocity and carries no information about direction, so neither entry containing it can
            appear in a slope.
        why: >-
          The slope is 0.216, about one north for every five east. Neither coordinate is a function
          of the other, so there is nothing to differentiate directly; what there is instead is how
          fast each is changing, and dividing the northward rate by the eastward one gives the
          slope of the path on the chart. The speed cannot appear, because it was made by throwing
          the direction away. Where the eastward rate passes through zero this ratio has no value,
          and the track has a vertical tangent there rather than a fault.
      - group: PRED
        task: Ask Achterberg what eight terms leave out
        title: Eight terms of thirty-seven
        concept: Sequences, partial sums, and what convergence means
        place: Prediction Office
        person: true
        scene: >-
          Wren Achterberg, the harmonic analyst, has the constituent list open at the wall. Eight
          of the thirty-seven are used for the daily board. The other twenty-nine are fitted,
          recorded, and not added in.
        guide: >-
          Each of the four situations on the left is about a sum that stops somewhere. Match it to
          what stopping there actually does to the answer. The distinction that matters is between
          a sum whose later terms shrink and one whose later terms do not, because only the first
          kind can be stopped with anything honest to say about the rest.
        assumes:
          - a partial sum is what a sum comes to after a stated number of terms
        takeaway: Stopping a sum is a decision that has to come with a statement about what stopping cost.
        format: PROTOCOL
        task: Match each way of stopping a sum to what it leaves you holding.
        scenarios:
          - Eight terms are added and the twenty-nine dropped amplitudes are listed beside the total.
          - Eight terms are added and the rest of the list is not mentioned anywhere.
          - Terms are added until the total stops moving by more than a centimetre.
          - Terms are added in the order they were fitted, which is not the order of their sizes.
        choices:
          - A number with a ceiling on its own error.
          - A number that may be right and cannot be defended.
          - A total whose next few terms are known to be small, and nothing said about the far tail.
          - A partial sum that may be missing a term larger than several it contains.
        mapping: [0, 1, 2, 3]
        why: >-
          A partial sum is a decision about where to stop, and the four situations differ in what
          survives that decision. Listing what was dropped converts an unknown into a bound.
          Dropping it silently leaves a number that cannot be argued for. Stopping when the total
          settles says something about the terms you have looked at and nothing about the ones you
          have not. Adding in fitted order rather than in order of size is the worst of the four,
          because the largest missing term can be anywhere in the queue.
  # ---------------------------------------------------------------- day 3
  - title: How far it went, and how far away it is
    objective: Separate the length of a path from the gap between its ends.
    briefing: The sediment budget needs the distance float 7 travelled, not the distance it ended up.
    stake: >-
      Wednesday, and the sediment budget for the licence report is due at the end of next week.
      Nkechi Ude, the estuary ecologist, needs to know how much water a particle of mud actually
      rides through in a fortnight, and the only measurement of that in this building is float 7.
      Palmer has a smooth curve fitted through the first two hours of its track, which is the part
      that was surveyed from the launch and is trustworthy. Today you get the length of that
      fitted path, work out how far the float finished from where it started, and settle with
      Tomas Beke, the sluice engineer, what happens to a rate while you are using it. Two of those
      numbers differ by a factor of thirteen, and only one of them is the transport distance.
    takeaway: Length is accumulated along a path; displacement only looks at the two ends.
    stops:
      - group: TRACK
        task: Get the length of the fitted track over two hours
        title: Two thousand metres in two hours
        concept: Arc length of a parametric path
        place: Survey Pontoon
        scene: >-
          The launch surveyed float 7 continuously for its first two hours, and Palmer has fitted
          both coordinates as powers of the time. She wants the length of that path in metres,
          measured along it.
        guide: >-
          You build the working a line at a time. Length is speed accumulated over time, so the two
          rates come first, then the speed they make, then the integral of that speed between the
          two times. The integral at the end is not one to be guessed at: the expression under the
          root has the derivative of its own inside sitting outside it, which is what makes a
          substitution work.
        background:
          - >-
            Why length is an integral of speed. Over a very short interval a path is
            indistinguishable from a straight line, and its length is speed times that interval.
            Adding those pieces is the definition of the integral, and this is the one place in the
            course where the accumulated quantity is a length rather than a total.
          - >-
            Why the substitution is the natural one. The speed here is 600t√(1+t²), and the
            derivative of 1 + t² is 2t. The t outside the root is therefore half of what a
            substitution needs, so u = 1 + t² clears the whole expression and turns it into the
            root of one variable.
          - >-
            What the answer is for. Ude's transport question is about how much water a mud particle
            rides through, which is the length of its path. The distance between where the float
            went in and where it is now is a different quantity and is answered at the mud
            laboratory this afternoon.
        takesAsRead:
          - The definite integral as an accumulation of a rate
        assumes:
          - the length of a path is the accumulation of speed over the time spent on it
        takeaway: An arc length is the integral of the speed, so a track that turns is far longer than the gap between its ends.
        format: DERIVE
        question: How long is the fitted path over the first two hours, measured along the path?
        answerText: >-
          About 2,040 metres. The speed is 600t√(1 + t²) metres an hour, and the substitution
          u = 1 + t² turns the integral into 200[(1 + t²)^{3/2}] between the two times.
        why: >-
          The path is about 2,040 metres long. Each coordinate is differentiated on its own, and the
          two rates go into the speed as the sides of a right-angled triangle. The speed then has to
          be accumulated over the two hours, which is what makes the length an integral rather than
          a multiplication: the float is not going at a constant speed at any point in the two
          hours. The substitution works because the derivative of the inside of the root is
          already sitting outside it, up to a factor of two.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: x(t) = 300t²,  y(t) = 200t³
          startNote: metres, with t in hours from release; the launch surveyed the float from t = 0 to t = 2
          goal: the length of the path from t = 0 to t = 2, in metres
          askRule: true
          rules:
            - power rule
            - definition of speed
            - arc length as an integral of speed
            - substitution
            - evaluation at the two ends
            - rearrangement
          steps:
            - ask: Differentiate both coordinates with respect to time.
              answer: 2
              candidates:
                - text: dx/dt = 300t,  dy/dt = 200t²
                  rule: power rule
                  survives: true
                  why: >-
                    The exponents have come down by one and the factors have not come out in front.
                    Both rates are then too small by a factor of two or three, and every line after
                    this one is clean arithmetic on the wrong numbers.
                - text: dx/dt = 600t²,  dy/dt = 600t³
                  rule: power rule
                  why: >-
                    The factor has come out in front and the exponent has not dropped. A rate cannot
                    have the same power of t as the quantity it is the rate of.
                - text: dx/dt = 600t,  dy/dt = 600t²
                  rule: power rule
                - text: dx/dt = 600t,  dy/dt = 200t³
                  rule: power rule
                  why: >-
                    The northing has been left undifferentiated. One coordinate has been done and the
                    other copied across.
            - ask: Write down the speed those two rates make.
              answer: 3
              candidates:
                - text: speed = 600t + 600t²
                  rule: definition of speed
                  why: >-
                    Adding components is only correct when they point the same way. Easting and
                    northing are at right angles by construction.
                - text: speed = √(600t + 600t²)
                  rule: definition of speed
                  why: >-
                    The components are squared before they are added, not after. As written, the units
                    inside the root are metres an hour rather than their square.
                - text: speed = 600t²·√(1 + t²)
                  rule: rearrangement
                  survives: true
                  why: >-
                    One power too many outside the root. It is dimensionally consistent, it factors
                    beautifully, and it gives a length forty per cent too large.
                - text: speed = 600t·√(1 + t²)
                  rule: definition of speed

    concept: 20   # Euler/logistic delay
    reason: "The repairs delay release, so the reservoir forecast must be advanced to the new starting time."
    scene: "Repairs delay release by 1.0 h, so update dH/dt=0.20(5-H) from H(0)=4.20 m. Compare Euler steps of 1.0 and 0.5 h, restoring the first setting before the safe decision."
    motivation: "The updated height estimate determines the reservoir state from which the delayed release plan must begin."
    format: CONTROL
    question: "Choose Euler step size from candidate controls step size, initial level, and rate constant. Measure the delayed forecast with 1.0 h steps, change only the step to 0.5 h while $H(0)=4.20$ m and $dH/dt=0.20(5-H)$ remain fixed, remeasure at the same final time, restore 1.0 h and measure again, then submit the conservative level in metres and conclusion."
    answerText: "The completed check shows 4.36 m."
    why: "4.36 m. The delayed start must use a numerical forecast consistent with the same differential model."
    # wrong-path feedback, one rebuttal per wrong option:

    - {"title":"Displacement versus distance","problem":"A particle has x(t)=(t-2)² m for 0≤t≤4 s. Find displacement and total distance.","rule":"Displacement = final minus initial position; distance adds travel lengths on each direction interval.","steps":["Set up the relationship: Displacement = final minus initial position; distance adds travel lengths on each direction interval.","Δx=x(4)-x(0)=4-4=0 m; distance=|x(2)-x(0)|+|x(4)-x(2)|=4+4=8 m."],"answer":"Displacement is 0 m; distance is 8 m.","mistake":"Returning to the starting point does not mean no distance was travelled."}
    - {"title":"A growing square","problem":"A square side s is 3 cm and grows at ds/dt=2 cm/s. Find dA/dt for area A.","rule":"A=s², so dA/dt=2s(ds/dt).","steps":["Set up the relationship: A=s², so dA/dt=2s(ds/dt).","dA/dt=2(3)(2)=12 cm²/s."],"answer":"The area grows at 12 cm²/s.","mistake":"Differentiate before inserting the fixed side length."}
    - {"title":"A growing circle","problem":"A circle has radius r=2 cm and dr/dt=1 cm/s. Find its area growth rate.","rule":"A=πr², so dA/dt=2πr(dr/dt).","steps":["Set up the relationship: A=πr², so dA/dt=2πr(dr/dt).","dA/dt=2π(2)(1)=4π cm²/s."],"answer":"The area growth rate is 4π cm²/s.","mistake":"Area change has square-length units per time, not length per time."}
    - {"title":"Read speed from velocity","problem":"A particle has v(t)=t-3 m/s. Find its speed at t=1 s and when it changes direction.","rule":"Speed = |velocity|; a direction change requires velocity to change sign.","steps":["Set up the relationship: Speed = |velocity|; a direction change requires velocity to change sign.","speed at 1=|1-3|=2 m/s. Velocity crosses zero at t=3 s, from negative to positive."],"answer":"Speed is 2 m/s at t=1; direction changes at t=3.","mistake":"A zero velocity without a sign change would not establish a reversal."}


  worked:
    label: "Worked examples"
    title: "Mission 13: worked examples"
    examples:
    - {"title":"Approximate a nearby square root","problem":"Estimate sqrt(4.04) using f(x)=sqrt(x) near x=4.","rule":"L(x)=f(4)+f′(4)(x-4), and f′(x)=1/(2sqrt(x)).","steps":["Set up the relationship: L(x)=f(4)+f′(4)(x-4), and f′(x)=1/(2sqrt(x)).","L(4.04)=2+(1/4)(0.04)=2.01."],"answer":"sqrt(4.04)≈2.01, a local linear approximation.","mistake":"An approximation is not an exact equality for the original nonlinear function."}
    - {"title":"Propagate a small radius error","problem":"A circle has r=10 cm with small uncertainty ±0.1 cm. Estimate area uncertainty.","rule":"For A=πr², dA≈2πr dr.","steps":["Set up the relationship: For A=πr², dA≈2πr dr.","|dA|≈2π(10)(0.1)=2π cm²; relative error≈2(0.1/10)=2%."],"answer":"The approximate area uncertainty is ±2π cm², or ±2%.","mistake":"This differential estimate is local, not an exact finite-error calculation."}
    - {"title":"A measurement minus a prediction","problem":"A thermometer model predicts 20 °C; an independent thermometer reads 22 °C. Find the residual.","rule":"Residual = observed value - predicted value.","steps":["residual = 22 °C - 20 °C. Keep observed first.","residual = +2 °C. The positive sign means the observation is above the prediction."],"answer":"The model underpredicts this reading by 2 °C.","mistake":"Reversing the subtraction reverses the meaning of the sign."}
    - {"title":"Separate a fitted product","problem":"A rectangle has area 24 cm². Can area alone determine its length and width?","rule":"Area = length × width. One equation may leave more than one unknown pair.","steps":["24 = 6×4 and 24 = 8×3. Both pairs have the correct area.","If width is independently measured as 4 cm, length = 24/4 = 6 cm."],"answer":"Area alone is insufficient; the additional width measurement selects 6 cm by 4 cm.","mistake":"One matching output does not identify both input parameters."}
    - {"title":"Test an entire allowed range","problem":"A component must operate at or below 80 °C. Its estimated temperature is 77 ± 4 °C. Does every allowed value pass?","rule":"Test the worst allowed value against the stated bound.","steps":["allowed interval = [77-4, 77+4] = [73,81] °C.","maximum allowed temperature = 81 °C > 80 °C. At least one allowed value fails."],"answer":"The estimate does not establish that every allowed temperature passes.","mistake":"Checking only the central estimate ignores the uncertainty."}


    - {"title":"Compare marginal cost and revenue","problem":"Revenue is R(q)=10q dollars and cost is C(q)=q² dollars. Find where profit stops increasing.","rule":"Profit P=R-C, so P′=R′-C′.","steps":["Set up the relationship: Profit P=R-C, so P′=R′-C′.","P′(q)=10-2q=0 gives q=5; P″=-2<0."],"answer":"Profit is maximized at q=5 on q≥0.","mistake":"Maximize profit, not revenue alone."}

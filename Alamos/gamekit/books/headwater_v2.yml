    concept: 11   # optimization/threshold synthesis
    reason: "The repair schedule and delayed release time are ready for a warning-readiness commitment."
    scene: "Repairs finish in 65 min, the minimum warning lead is 280 min, and release begins no sooner than 360 min from now. Commit the inclusive readiness slack before circuit results appear."
    motivation: "Readiness slack determines whether repaired circuits can still provide the minimum warning lead before release."
    format: TRIGGER
    question: "Calculate and submit slack 360-280-65 in minutes; commit READY if slack >=0 and all four circuits pass, then reveal circuit results."

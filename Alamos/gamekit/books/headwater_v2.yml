  # --- Stop 20: Prove an intermediate crossing
  #     Concept: IVT/MVT/differentiability; Keystone: Limits and extrema; Area: Storage & Level Board; Learning role: RETRIEVE; Difficulty: L4; Story role: decision.
  #     placement: CHOICE, asked by Nia Chen beside machine-board.
  - group: STORE
    at: machine-board
    title: "Prove an intermediate crossing"
    person: chen
    concept: 2   # IVT/MVT/differentiability
    reason: "The revised release plan still needs to establish whether reservoir height crosses the warning level."
    scene: "The continuous level model gives H(2)=4.3 m and H(4)=4.9 m, while warning level is 4.6 m. Choose the theorem guaranteeing a crossing, then distinguish it from the Mean Value Theorem."
    motivation: "Continuity between the two measured heights can guarantee a level crossing without identifying its exact time."
    format: CHOICE
    question: "Select exactly one of four theorem conclusions and submit its label."
    choices:
    - "Intermediate Value Theorem: some time has the intermediate level because the level function is continuous and the endpoints bracket it."
    - "Mean Value Theorem: some time has the intermediate level because the average rate is 0.3 m/h."
    - "Extreme Value Theorem: the desired level must be a maximum or minimum."
    - "No theorem applies unless the exact crossing time can first be solved."
    answer: "Intermediate Value Theorem: some time has the intermediate level because the level function is continuous and the endpoints bracket it."
    answerText: "The completed check shows iVT. MVT would instead guarantee some derivative equal (4.9-4.3)/2=0.3 m/h if differentiable."
    why: "IVT. MVT would instead guarantee some derivative equal (4.9-4.3)/2=0.3 m/h if differentiable. The theorem's hypotheses determine what the crew may guarantee between readings."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2)
    # correct result: IVT. MVT would instead guarantee some derivative equal (4.9-4.3)/2=0.3 m/h if differentiable.
    # state/output: old plan rejected.

    motivation: "The initial-value solution predicts whether seepage should decay enough before the next load review."
    format: DERIVE
    question: "Submit S(4) in litres per minute."
    answerText: "S(4)=12e^-1.2=3.614 L/min."
    why: "S(4)=12e^-1.2=3.614 L/min. A negative constant should produce measured decay rather than hidden growth."

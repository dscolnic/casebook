copy:
  SPEC: <p>The specimen store, first door on the west side. A wall of numbered drawers, a bench to put one down on, and a docket book by the door.</p>
  CARDS: <p>The card desk, at the far end of the west side. One long table down the middle of the room, a card for every element, and nothing pinned down.</p>
  BENCH: <p>The analysis bench, across the corridor. A balance, a displacement vessel, a rack of reagents, and three grams of metal that arrived by post.</p>
  HALL: <p>The lecture hall, opposite the card desk. Three raked benches, a demonstration table, and an instrument on a trolley that nobody in 1869 could have wheeled in.</p>
  PORCH: <p>The porter's room, inside the front door. A book that doubles as the fire roll, a rack of pigeonholes, and a bell.</p>
  TEA: <p>The common room, halfway down the west side. A samovar, eight chairs that never leave, and a rota with two blank days on it.</p>
  WEIGH: <p>The weighing room, beside the porter. One balance under glass, three sets of standards, and a door that has to be shut before anybody reads anything.</p>
  RACK: <p>The reagent store at the end of the west side. Acids, alkalis, filter paper, and one tin of oil for the drawers that will not last the term.</p>
  LIB: <p>The library at the far end. German journals on the left, offprints in a case, and the only quiet in the building.</p>

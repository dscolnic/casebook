        takeaway: Two numbers that agree because they came through the same step have not confirmed each other.
        reason: Five pieces of the comparison are on the screen, and each was computed from something else
        format: TRACE
        why: Both groups counted layers as far as they could. Then they handed the rest to the same flow model, with the same assumption of uniform vertical strain. Below those counts the two age scales are not independent estimates that happen to agree; they are one calculation applied twice. What survives the model being wrong is the counted section, which is arithmetic on measured layers. The other is the tephra horizon, whose date came from a volcano and not from any ice. Those two are the comparison. The rest is a shared assumption.
        trace:
          channels:
            - id: ourdeep
              label: Our ages below 1,600 m
              reading: 18,400 yr at 2,100 m
              depends:
                - flow
            - id: skarvdeep
              label: Skarv ages below their count
              reading: 18,050 yr at their 1,940 m
              depends:
                - flow
            - id: ourcount
              label: Our counted section, surface to 1,180 m
              reading: 9,900 layers counted
              depends: []
            - id: tephra
              label: Tephra horizon, dated by its eruption
              reading: 1,642 m, dated independently
              depends: []
            - id: skarvgas
              label: Skarv gas ages below their count
              reading: 17,600 yr at their 1,940 m
              depends:
                - flow
                - offset
          resources:
            - id: flow
              label: The Nye flow model, used by both groups below their counts
            - id: offset
              label: The gas–ice age difference, estimated from firn density
          independent:
            - ourcount
            - tephra
          target: flow
          hint: Open each piece to see what it was computed from. Keep the ones that would still stand on their own, then name the thing the rest have in common.
          commit: Commit the independent evidence
        guide: Open each piece of the comparison to see what it was computed from. Keep the ones that would still stand if the flow model were wrong, and untick the ones that run through it. Then name the shared dependency. A piece that survives is worth more than the number attached to it suggests.
        background:
          - What a flow model does here. It converts depth into age by describing how the ice has thinned and moved since it fell. Almost every quantity that carries a date has passed through it. That is what makes it the most consequential assumption in the building.
          - Why some things survive it. Anything measured against a fixed marker is a claim about ice rather than about the model. An ash layer, a known event, a directly counted section. Those hold whatever the model does, and they are how the model itself gets tested.
          - Why the question is asked this way round. Nobody expects the flow model to be wrong outright. The question is which conclusions are hostages to it. The flow model is revised every few years. When it is, the group knows exactly what has to be redone.
        concept: Model against data, and what a mismatch can mean
        answerText: The counted section and the tephra tie point. Everything below the counts on both sides was dated with the same flow model, so those two agreeing establishes nothing about it.
      - group: GAS
        task: Turn a gas record into an energy number
        title: What the carbon dioxide change was worth
        place: Gas Laboratory
        question: Estimate the radiative forcing between the two concentrations.
        scene: Adeyemi has carbon dioxide at 190 parts per million through the cold interval and 280 at the top of the core. Halvorsen wants the difference expressed as an energy imbalance.
        assumes:
          - a greenhouse gas reduces the rate at which the surface loses heat to space
        takeaway: A concentration becomes a climate statement only through the energy it changes.
        reason: Carbon dioxide ran 190 parts per million in the cold spell against 280 at the top of the core
        format: BALLPARK
        why: "Carbon dioxide absorbs in bands that are already partly saturated. So each extra molecule does less than the one before it. The forcing goes as the logarithm of the concentration rather than in proportion to it. That is why the effect is usually stated per doubling: every doubling adds about the same. Between the cold interval and the top of the core the concentration rose by half. That is worth about two watts on every square metre of the planet, sustained for as long as it lasts."
        estimate:
          prompt: Carbon dioxide is 190 parts per million in the cold interval and 280 at the top of the core.
          question: Estimate the radiative forcing between the two.
          labels:
            - 280 ppm  (top of the core)
            - 190 ppm  (the cold interval)
            - 5.35  (the coefficient for carbon dioxide)
            - 0.67  (the isotope temperature slope)
          values: [280, 190, 5.35, 0.67]
          slots: 3
          template: "{2} × ln({0} ÷ {1})"
          formula: c*Math.log(a/b)
          correct: [0, 1, 2]
          target: 2.07
          tolerance: 0.25
          units: W/m²
          solution: 5.35 × ln(280 ÷ 190) = 2.07 W/m².
          explanation: The isotope slope converts a ratio into degrees at this site, which is a different step in a different part of the argument.
          relationship: ΔF = 5.35 × ln(C ÷ C₀) — the logarithm of the concentration ratio, times the coefficient for carbon dioxide, in watts per square metre.
        guide: Four numbers, and one of them is the isotope temperature slope, which belongs to another question. Ask of each whether this forcing uses it. And note the shape of the relationship. The bands are already partly saturated. Each extra molecule does less than the last, so the effect follows a logarithm rather than a proportion.
        background:
          - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated. Nothing here has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs. Then, whether the size of the answer looks right once they are in place.
          - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label catches a unit mismatch before it is placed. It also catches a quantity belonging to a different part of the problem. That is the habit this format exists to build.
        concept: "Radiative forcing: turning a concentration into a temperature push"
        answerText: About 2.1 watts per square metre. The change from 190 to 280 parts per million is roughly a third of the way to a doubling.

        why: >-
          Isotope ratios differ from one another in the fourth decimal place, so nobody reports
          them as ratios. The convention is to divide the sample's ratio by the ratio of one
          agreed water. Then subtract 1 so that the standard itself reads 0. Then multiply by
          1000 so the numbers are convenient. What comes out is a difference in parts per
          thousand. It is always negative for polar snow. Every stage of the journey from the
          ocean has already removed some of the heavy isotope. The scale is a comparison, and it

      - group: CORE
        task: Log the core sections before the light goes.
        title: A year, or a summer that melted
        concept: "Annual layer counting, and where counting fails"
        place: Core Processing Trench
        scene: Sections come out of the trench faster than they can be logged properly. A layer that formed over a year is one thing. A layer where the surface melted and refroze is another, and both are visible on the light table.
        guide: >-
          Two bins, and the question is whether the layer is a year of accumulation or a
          melt event inside one. An annual layer pairs a coarse summer with a fine winter and
          keeps its bubbles. A melt layer is clear, dense and bubble-poor, because the water
          filled the spaces before it refroze. Sort on the ice, not on the label.
        background:
          - >-
              Why the difference decides the chronology. The count of annual layers is the
              clock. A melt layer counted as a year makes the core older than it is at every
              depth below. A year missed makes it younger. Both errors propagate all the way
              down.
          - >-
              What melt does to everything else. Percolating water moves the chemistry down
              through the layers it passes. So a melt layer is not only a counting problem. It
              smears the record either side of it, which is why the site was chosen where melt
              is rare.
        assumes:
          - snow builds up in layers and can melt and refreeze
        takeaway: A layer counted wrong moves every date below it, in the same direction, for ever.
        format: BELT
        question: Send each section to the bin that says what made the layer.
        answerText: Coarse-over-fine with bubbles is a year. Clear, dense and bubble-poor is melt, and counting it as a year ages everything beneath it.
        why: >-
          An annual layer is built by a season. Coarse crystals from summer sun. Fine
          wind-packed snow through winter. And air trapped as bubbles throughout. A melt layer
          is built by water. The surface thaws, and the water percolates down and refreezes in
          the pore space. What comes out on the light table is clear, dense and almost free of
          bubbles. Both are stripes in a core and only one of them is a year. The cost of
          confusing them is not local. Annual layer counting is the clock. So a melt layer
          counted as a year makes every date below it too old. A year missed makes every date
          too young, all the way to the bottom of the core. Melt also does something worse than
          miscount. Water moving down carries the chemistry with it. So the isotopes and the
          ions either side of the layer are smeared. That is why a site is chosen for how rarely
          its surface melts rather than for how much snow it gets.
        belt:
          left: { name: Annual layer }
          right: { name: Melt layer }
          need: 20
          lives: 3
          pass: 0.8
          hint: Look for bubbles. Water fills the spaces that air would have kept.
          items:
            - { name: Coarse over fine, bin: left }
            - { name: Bubbles throughout, bin: left }
            - { name: Summer hoar, bin: left }
            - { name: Wind crust pair, bin: left }
            - { name: Depth hoar band, bin: left }
            - { name: Fine winter pack, bin: left }
            - { name: Regular spacing, bin: left }
            - { name: Isotope peak pair, bin: left }
            - { name: Dust maximum, bin: left }
            - { name: Grain size cycle, bin: left }
            - { name: Bubble-rich stripe, bin: left }
            - { name: Sea salt winter, bin: left }
            - { name: Clear glassy band, bin: right }
            - { name: Bubble-poor lens, bin: right }
            - { name: Dense refrozen ice, bin: right }
            - { name: Percolation column, bin: right }
            - { name: Smeared isotopes, bin: right }
            - { name: Ion peak washed, bin: right }
            - { name: Infiltration finger, bin: right }
            - { name: Surface glaze, bin: right }
            - { name: Ice lens, bin: right }
            - { name: Refrozen crust, bin: right }
            - { name: Trapped meltwater, bin: right }
            - { name: Bubble-free layer, bin: right }
            - { name: Vertical pipe, bin: right }
            - { name: Melt-welded grain, bin: right }
          commit: Start the line
  - title: One aircraft, and what leaves on it
    objective: Decide what is measured while the Skarv samples are still on the station.
    briefing: The Skarv group's samples fly out on Thursday and cannot come back.
    stake: >-
      Thursday is the aircraft window. Eleven Skarv samples sit in the core store until it
      opens. Halvorsen has the Skarv record on one screen and this station's on the other. The
      two do not agree. The gap is wider than either group has claimed for its own error. She
      wants one measurement made while both cores can be run on the same instrument. Okonkwo
      wants nothing said until the two timescales are matched. Today you choose what to measure
      before the plane leaves, what one shared machine settles, and what it leaves open. After
      Thursday the two cores are in two different places. Then it is one laboratory against
      another, not one core against another.
    takeaway: Some comparisons are only available for as long as both things are in the same room.
    stops:
      - group: DATA
        task: Spend the last day of access
        title: What is worth measuring before Thursday
        place: Science Module
        scene: >-
          11 Skarv samples, one working day, and the isotope line can take 4 of them.
          The data manager, Jonas Aalto, has the two records side by side and the difference between
          them on a third screen.
        guide: >-
          Eleven samples, one working day, and the isotope line takes four. Open each
          candidate and ask what its result would change about the difference between
          the two records. Four runs that confirm what is already agreed have spent the
          day; four that could move the disagreement have bought something.
        background:
          - >-
              Why the difference is the subject. Two records side by side, with a gap
              between them on a third screen, is the whole question of the week. A run that
              tightens a part of the record nobody disputes cannot narrow that gap.
          - >-
              What a day of the isotope line is worth. It is the only instrument that can
              settle certain questions and it runs four samples. That makes each slot a
              choice against the other seven, and the deadline is Thursday rather than the
              end of the season.
          - >-
              Why sampling depth matters as much as sample count. Four runs clustered in one
              interval answer one question well. Four spread across the disagreement answer a
              different question. Which of them is worth more depends on whether the gap is
              thought to be an offset or a shape.
        assumes:
          - two laboratories measuring the same quantity can differ by a fixed amount
        takeaway: A measurement is worth its cost when the decision changes depending on how it comes out.
        format: VALUE
        question: Which four runs should the day buy?
        answerText: The paired standards and the overlap depths. Those are what would show a fixed offset between the two laboratories, which is the only explanation the comparison cannot rule out from here.
        value:
          hint: Buy what would change the answer. A measurement that confirms what you already believe has bought nothing.
          budget: { amount: 4, unit: instrument runs }
          decision: Is the difference between the two records a difference in the ice, or a difference between two laboratories?
          options:
            - id: standards
              label: Both groups' working standards, run back to back
              cost: 1
              axis: where the two reporting scales sit
              decisive: true
              reveals: 'The Skarv scale reads 0.4 per mil heavy against ours, on the same water.'
            - id: overlap
              label: Four Skarv depths that overlap ours, run on our line
              cost: 2
              axis: whether one instrument gives one answer on one piece of ice
              decisive: true
              reveals: 'The same ice, measured here, sits 0.4 per mil from their published value.'
            - id: deeper
              label: The deepest Skarv sample, at a depth this station has not drilled
              cost: 1
              axis: ice older than anything here
              reveals: 'An isotope value with nothing of ours to compare it against.'
            - id: repeat
              label: A repeat of our own 1,400 m sample
              cost: 1
              axis: how tightly our own line repeats
              reveals: 'Within 0.05 per mil of the first run, as it was last week.'
            - id: density
              label: Density profile of the Skarv firn section
              cost: 1
              axis: the other site's close-off depth
              reveals: 'Close-off at 71 m, which their published report already states.'
          commit: Book the runs
        why: >-
          Two laboratories measuring the same water can differ by a fixed amount. A fixed amount
          looks exactly like a climate difference when it is plotted against depth. The
          standards measure that offset directly; the overlapping depths test it on real ice.
          Between them they either remove the explanation or establish it. The deepest sample is
          interesting and settles nothing, since nothing here overlaps it. The density profile
          is already in the other group's published report. Repeating our own sample tests our
          line, which is not the thing in dispute.
      - group: COLD
        task: Say what one instrument removes
        title: The same water, twice
        place: Cold Laboratory
        scene: >-
          Tanabe has both groups' working standards on the bench and 30 minutes of instrument
          time. Skarv reports its values against its own standard, calibrated in a different
          laboratory four years ago.
        guide: >-
          Four things a joint run might establish. Ask of each whether one instrument in
          one afternoon could separate it from the alternatives. An isotope value is a
          difference from a reference water, so it carries whatever that reference is
          worth. Two laboratories keep their own. A scale gap and a real site difference
          both appear as a constant shift. That is why one of these needs both standards
          on one instrument.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be
              the answer under one specific misreading. A step skipped. A quantity confused with
              a rate. A correlation taken for a cause. Identifying which misreading each belongs
              to is where the learning is. The right answer alone can be reached on instinct and
              teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance. Before it was fixed, that was 88 per
              cent of passage quizzes here. It is now checked per game as a binomial tail.
              Length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them. Each is the reason that option fails, not a restatement of
              the right one. They are worth reading after a correct answer as well. A right
              choice made for an approximate reason is indistinguishable from a sound one. That
              holds until the day the approximation is what is being tested.
        assumes:
          - an isotope value is reported as a difference from an agreed reference water
        takeaway: A ratio reported against two different references is two different numbers about the same water.
        format: CHOICE
        question: What does running both standards on this instrument establish?
        answerText: The size of any fixed offset between the two reporting scales, which would otherwise be read as a difference between the two sites.
        choices:
          - How far apart the two laboratories' reporting scales sit
          - That the Skarv samples were stored correctly on their way here
          - Which of the two laboratories is measuring more precisely
          - Whether the isotope thermometer has the same slope at both sites
        answer: How far apart the two laboratories' reporting scales sit
        why: >-
          An isotope value is not an amount; it is a difference from a reference water, so it
          carries whatever that reference is worth. Two laboratories keep their own working
          standards, both traceable to the same international water and both slightly off it.
          Run side by side on one instrument, the two standards show the gap between the scales
          directly. That gap comes out in the same units the records are plotted in. Nothing
          else on the bench can separate that gap from a real difference between the sites,
          because both appear as a constant shift.
        rebuttals:
          - Storage matters and is a separate question, answered by the temperature log rather than the standard
          - Precision is scatter between repeats; this compares where the two scales sit, not how tightly they repeat
          - The temperature slope is a property of each site's weather and cannot be read off a bottle of standard water
      - group: GAS
        task: Sort what a joint run can and cannot settle
        title: Which differences a shared instrument removes
        place: Gas Laboratory
        scene: >-
          The gas geochemist, Samuel Adeyemi, has four ways the two records could differ written
          on the board. There is one working day in which both cores are in the same building.
        guide: >-
          Four ways the records could differ, and four kinds of evidence. Pair them by
          asking what sharing an instrument can and cannot remove. A stretched timescale
          is a chronology problem and needs an event dated in both cores. A real climate
          difference is what survives after everything else is eliminated. And melting
          alters the outside of a section more than the inside.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on boards
              like this are written to be plausible for more than one situation. Choosing them
              one at a time lets a nearly-right answer through unexamined. Having to place all
              of them forces the comparison — not "is this reasonable here", but "is it more
              right here than there".
          - >-
              How to use the one-each rule. The responses are a set to be distributed rather
              than a list to be sampled. So every join you make constrains the rest. Settling
              the two you are confident of can leave the remaining pair decided by elimination.
              Where it does not, two responses are still competing for one situation. That is
              exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once, three
              correct joins leave the fourth with only one place to go. Any error therefore
              involves at least two joins. That is worth remembering when the last pair looks
              forced. The fault is usually not in the join you are struggling with. It is in one
              you made early and stopped questioning.
        takesAsRead:
          - Accumulation rate, and what a site with little snow buys and costs
          - Annual layer counting, and where counting fails
        assumes:
          - two measurements of one quantity can differ for reasons that have nothing to do with the quantity
        takeaway: Sharing an instrument removes the differences the instrument was causing, and only those.
        format: PROTOCOL
        columns:
          - Why the two records might differ
          - What would settle it
        scenarios:
          - The two laboratories' reference waters are not identical
          - One core's timescale is stretched relative to the other's
          - The two sites really did have different temperatures
          - One group's samples were partly melted in transit
        choices:
          - Run both working standards on one instrument and read the gap
          - Find an event dated in both cores and pin them to each other at it
          - Measure overlapping depths on one instrument and see the difference survive
          - Check the transit temperature record against the isotope profile of the outer ice
        mapping: [0, 1, 2, 3]
        why: >-
          Only the first of these is fixed by sharing an instrument. A stretched timescale is a
          chronology problem and needs an event of known date present in both cores. A real
          climate difference is what is left once every other explanation has been removed. That
          is why it is established by elimination rather than measured directly. Melting in
          transit alters the outer ice more than the inner. So it leaves a signature in the
          profile across a section, rather than in the average. Four differences, four different
          pieces of evidence.
        rebuttals:
          - A shared instrument removes instrument differences, and a stretched timescale is not one
          - A tie point fixes two clocks to each other, which is a different question from what the ice contains
          - Transit damage shows in the profile across a section rather than in a comparison of averages
  # ------------------------------------------------------------------ day 5
  - title: Turning a ratio into a temperature
    objective: Establish what the isotope record measures and how confidently it can be stated in degrees.
    briefing: The isotope profile is finished to 1,600 metres and nobody has agreed what it says in degrees.
    stake: >-
      Friday. The isotope profile is done down to 1,600 metres. Tanabe has the numbers.
      Halvorsen wants them in degrees for the season summary. To turn a ratio into degrees you
      need a slope. The slope is not fixed. Someone measured it. They could have got it wrong.
      Brandt has eleven years of mast readings to test it against. Today you turn the profile
      into a temperature change. You decide how tightly it can be stated. And you settle what
      the isotopes are really a thermometer of. Take the slope on trust and every degree in this
      record is someone else's guess, not yours.
    takeaway: A proxy becomes a number through a calibration, and the calibration is part of the result.
    stops:
      - group: COLD
        task: Put the profile into degrees
        title: What the ratio says in degrees
        place: Cold Laboratory
        scene: >-
          Tanabe has the isotope profile against depth. The section covering the last cold
          interval sits 1.8 per mil below the modern surface value. The site's calibration slope
          is on the board.
        guide: >-
          Four numbers, and two of them belong elsewhere: a slope for a different
          isotope, and the years of mast overlap. Ask of each whether this conversion
          uses it. And note where the slope comes from. It is not a constant of physics
          but a fit to this site's own weather, measured over the years that have both
          records.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is already
              measured or stated. Nothing here has to be derived. What is being tested is
              whether you can pick the quantities the relationship actually needs. Then, whether
              the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label catches a unit mismatch before it
              is placed. It also catches a quantity belonging to a different part of the
              problem. That is the habit this format exists to build.
        takesAsRead:
          - "Stable isotopes as a thermometer: δ¹⁸O and deuterium"
        assumes:
          - colder air loses its heavier water molecules earlier, leaving the snow isotopically lighter
        takeaway: A slope converts a measurement into a claim, and it is measured rather than assumed.
        format: BALLPARK
        question: Estimate the temperature change that isotope shift represents.
        answerText: About 2.7 degrees colder. The shift is 1.8 per mil and the site slope is 0.67 per mil for every degree.
        why: >-
          Water carrying the heavy isotope condenses first. Air that has cooled further has
          already lost more of it, so the snow falling last is the lightest. Over a useful range
          the ratio and the temperature move together in a straight line. The slope of that line
          is not a constant of physics. It belongs to this site's weather. It is measured by
          comparing the isotope record with the mast during the years that have both. Dividing
          the shift by the slope gives the change in degrees.
        estimate:
          prompt: The cold interval sits 1.8 per mil below the modern surface value. Calibration against the mast gives 0.67 per mil for each degree of temperature change.
          question: Estimate the temperature difference between that interval and the present.
          relationship: ΔT = Δδ¹⁸O ÷ α — the isotope shift in parts per thousand, divided by the site's calibration slope in parts per thousand per degree.
          labels:
            - 1.8 ‰  (the isotope shift)
            - 0.67 ‰/°C  (the site calibration slope)
            - 8.0 ‰/°C  (the deuterium slope, a different isotope)
            - 11  (years of overlap with the mast)
          values: [1.8, 0.67, 8.0, 11]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 2.7
          tolerance: 0.3
          units: °C colder
          solution: 1.8 ÷ 0.67 = 2.7 °C.
          explanation: The deuterium slope belongs to a different isotope of a different element, and using it here would give an answer 11 times too small.
      - group: FIELD
        task: State the cooling with its uncertainty
        title: How firmly the cooling can be stated
        place: Snow Study Hut
        scene: >-
          Brandt has the mast record, the calibration years and the scatter around the fitted slope.
          The season summary needs a statement that the interval was colder than the present, and
          how sure of it anybody is.
        guide: >-
          The band is the reconstructed cooling with its calibration uncertainty on it.
          The summary wants to claim the interval was more than two degrees colder. Two
          pieces of work are available and they act differently on the band: one moves
          it, one narrows it. Apply what you would fund, watching the middle and the
          width separately. Then say whether the claim is cleared.
        takesAsRead:
          - Random against systematic uncertainty
          - Separating a trend from year-to-year noise
        assumes:
          - a fitted relationship carries a spread as well as a central value
        takeaway: Narrowing a distribution and moving it are different actions with different evidence behind them.
        format: CLOUD
        question: Which work would let the summary state that the interval was more than two degrees colder? Place the bars to report the mean and its one-sigma uncertainty.
        answerText: Extending the overlap with the mast record. It narrows the calibration spread, which is what the claim needs; re-centring the slope moves the estimate without making it any surer.
        cloud:
          hint: >-
            The band is the reconstructed cooling with its calibration uncertainty. The claim is
            cleared only when the whole distribution sits past the limit.
          centre: 2.7
          spread: 0.55
          bounds: { min: 2.0, max: 5.0, label: 'between two and five degrees colder' }
          pass: 0.95
          actions:
            - id: overlap
              label: Add six more years of mast overlap to the calibration
              effect: narrow
              amount: 0.6
              note: Six more years of both records measured against each other
            - id: recentre
              label: Apply the revised source-region correction to the slope
              effect: shift
              amount: 0.15
              note: Moves the central estimate, on the same 11 years
          commit: State the cooling
        why: >-
          The reconstruction is a distribution, not a number. The slope was fitted to 11 years
          of overlap, and it carries the scatter of that fit. A claim that the interval was more
          than two degrees colder is a claim about where the whole distribution sits. It is
          cleared by making the distribution narrower, rather than by moving its middle. More
          overlap years is the only action here that adds information. The source-region
          correction changes the central value. It leaves the spread exactly as wide as it was.
      - group: DATA
        task: Say what the thermometer is a thermometer of
        title: The temperature of what, and where
        place: Science Module
        scene: >-
          Aalto is drafting the summary line and has written that the isotopes give the temperature
          of the last cold interval. Halvorsen wants the sentence narrowed before it goes anywhere.
        guide: >-
          Four things the isotope record might be about. Ask of each where and when the
          ratio is actually set. It is fixed as vapour condenses, in the cloud, in the
          seasons that deliver most of the snow. Getting from there to a ground
          temperature needs the site calibration. Two of these options are separate
          measurements entirely, one of them taken with a thermometer in the hole.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be
              the answer under one specific misreading. A step skipped. A quantity confused with
              a rate. A correlation taken for a cause. Identifying which misreading each belongs
              to is where the learning is. The right answer alone can be reached on instinct and
              teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance. Before it was fixed, that was 88 per
              cent of passage quizzes here. It is now checked per game as a binomial tail.
              Length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them. Each is the reason that option fails, not a restatement of
              the right one. They are worth reading after a correct answer as well. A right
              choice made for an approximate reason is indistinguishable from a sound one. That
              holds until the day the approximation is what is being tested.
        assumes:
          - snow forms in a cloud and falls to a surface some distance below it
        takeaway: A proxy measures one specific thing, and the sentence has to say which.
        format: CHOICE
        question: What does the isotope record most directly record?
        answerText: The condensation temperature of the air that made this snow, which is close to but not the same as the surface temperature here.
        choices:
          - Where the snow condensed, over this region, in the season it fell
          - The average annual temperature of the whole hemisphere at that time
          - The temperature of the ice itself, preserved from when it was buried
          - The temperature of the ocean the water evaporated from
        answer: Where the snow condensed, over this region, in the season it fell
        why: >-
          The isotope ratio is set as water vapour condenses. So it records conditions in the
          cloud that produced this snow, weighted towards the seasons that deliver most of it.
          Getting from there to a surface temperature needs the relationship between cloud and
          ground, which is what the site calibration supplies. The ocean the water came from
          does leave a mark, which is why source-region corrections exist. The ice's own
          temperature is a separate measurement, taken with a thermometer in the borehole. It
          says nothing about the year the snow fell.
        rebuttals:
          - A single site records its own region; hemispheric averages are built by combining many sites
          - Borehole thermometry measures the ice now, and is used to check the isotopes rather than to replace them
          - Evaporation conditions leave a second-order mark, which is a correction rather than the signal
  # ------------------------------------------------------------------ day 6
  - title: Air that stopped moving
    objective: Establish what a bubble is, when it sealed, and why its air is younger than its ice.
    briefing: The gas record and the ice record from the same depth are not the same age.
    stake: >-
      Saturday. Adeyemi has carbon dioxide from four depths and a problem with all four. The air
      in a bubble kept moving for centuries after the snow around it fell. So the air is younger
      than the ice that holds it. At a site as dry as this one, that gap is the biggest
      correction in the whole record. Okonkwo needs it before the two clocks can be put
      together. Today you work out how big the gap is here. You name the step in the chain that
      sets it. And you settle why the gas record is smoother than the ice record. Plot the gas
      on the ice's own clock and the whole record is shifted by centuries.
    takeaway: Two things in the same piece of ice can be different ages, and the difference has to be calculated.
    stops:
      - group: GAS
        task: Put a number on the age offset
        title: How much younger the air is
        place: Gas Laboratory
        scene: >-
          The pores seal at 88 metres here. Above that the firn is open to the atmosphere, and its
          mean density is about 0.62 of solid ice. Adeyemi has the accumulation rate on the board
          beside it.
        guide: >-
          Four numbers, and one of them is the same year written as a snow thickness
          rather than as ice. Ask of each whether the units match the others. The air
          keeps mixing with the atmosphere until the pores close. So the bubble is as
          old as the sealing, and the ice is as old as the snow. Get this wrong and a
          gas record is plotted centuries too early.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is already
              measured or stated. Nothing here has to be derived. What is being tested is
              whether you can pick the quantities the relationship actually needs. Then, whether
              the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label catches a unit mismatch before it
              is placed. It also catches a quantity belonging to a different part of the
              problem. That is the habit this format exists to build.
        assumes:
          - air moves freely through connected pore spaces until they close
        takeaway: A bubble is sealed at a depth, and the ice around it arrived at that depth long before.
        format: BALLPARK
        question: Estimate the age difference between a bubble and the ice around it.
        answerText: About 460 years. The snow at close-off depth is that old, and the air sealed into it is essentially modern at the moment of sealing.
        why: >-
          Air circulates through the connected pore spaces of the firn and mixes with the
          atmosphere until those pores close. So the air in a bubble is roughly as old as the
          moment of sealing. The ice around it is as old as the snow. Converting the firn column
          to ice equivalent and dividing by the accumulation rate gives that interval. It is set
          by how deep the close-off is and how fast snow arrives. So cold dry sites carry
          offsets of centuries, and wet coastal ones a few decades. Ignore it and a gas record
          is plotted centuries too early.
        estimate:
          prompt: Close-off is at 88 metres, the firn above it averages 0.62 of the density of solid ice, and the site accumulates 0.119 metres of ice equivalent a year.
          question: Estimate the difference between the age of the gas and the age of the ice around it.
          relationship: Δage ≈ z_close × ρ̄ ÷ b — the close-off depth, scaled by mean firn density, divided by the accumulation in ice equivalent.
          labels:
            - 88 m  (close-off depth)
            - 0.62  (mean firn density, relative to ice)
            - 0.119 m/yr  (accumulation in ice equivalent)
            - 0.32 m/yr  (the same year as a snow thickness)
          values: [88, 0.62, 0.119, 0.32]
          slots: 3
          template: '{0} × {1} ÷ {2}'
          formula: a*b/c
          correct: [0, 1, 2]
          target: 458
          tolerance: 40
          units: years
          solution: 88 × 0.62 ÷ 0.119 = 458 years.
          explanation: The snow thickness is the distractor: the density conversion has already been applied, so using it again would count the same correction twice.
      - group: DRILL
        task: Name the step that fixes the offset
        title: From snowfall to sealed bubble
        place: Drill Trench
        scene: >-
          Lindqvist has the borehole's own record on the wall. Five stages between a snowflake
          landing and air being locked away, with a measurement against each one.
        guide: >-
          Put the five stages in the order a snowflake actually passes through them,
          from landing to being sealed in. Then name the stage that decides how much
          older the ice is than the air inside it. Each stage has a measurement against
          it, so read those rather than choosing the stage that sounds most important.
        background:
          - >-
              Why the ice and its air have different ages. Fresh snow is open to the atmosphere,
              and it stays open as it compacts. Air moves in and out of that layer for decades
              or centuries. Only when the pores finally pinch off is the air sealed. By then the
              ice around it has been buried a long time.
          - >-
              What sets the size of the gap. The depth at which the pores close, and how long
              the snow takes to get there. Both depend on temperature and on how much snow falls
              each year. That is why the gap is hundreds of years at a cold, dry site and much
              less at a warm, snowy one.
          - >-
              Why it matters more than it sounds. Every comparison between a gas record and an
              ice record has this offset in it. Read a carbon dioxide rise against a temperature
              change without correcting for it and you can get the order of events wrong. That
              is a claim about cause.
        assumes:
          - a quantity that passes through several stages is limited by one of them
        takeaway: In a chain of stages, one of them sets the answer and the others follow it.
        format: CHAIN
        question: Which stage decides how much older the ice is than the air inside it?
        answerText: Pore close-off. The offset is the age of the ice at the depth where the pores seal, so everything above that depth is a firn column and everything below it is a bubble.
        chain:
          hint: >-
            Put the stages in the order air actually passes through them, then name the one that
            fixes the size of the age difference.
          links:
            - id: snowfall
              label: Snow lands on the surface
              transfers: New mass, carrying the isotopes of the air it condensed from
              reading: 0.32 m of new snow a year
            - id: burial
              label: The layer is buried and begins to compact
              transfers: Load from everything above it, squeezing the pore space smaller
              reading: Density rising from 340 to 550 kg per cubic metre
            - id: mixing
              label: Air moves through the open pores
              transfers: Atmospheric composition, exchanged with the surface
              reading: Mixes to within a decade of the surface air
            - id: closeoff
              label: The pores seal into separate bubbles
              transfers: The atmosphere of that moment, locked into the ice
              reading: Complete by 88 m
            - id: compression
              label: Bubbles compress and eventually become clathrate
              transfers: Pressure into the trapped gas, then into the crystal structure
              reading: Bubbles gone below about 1,200 m
          order: [snowfall, burial, mixing, closeoff, compression]
          governing: closeoff
          distractor: mixing
          commit: Name the governing stage
        why: >-
          Every stage moves something, but only one of them fixes the size of the offset. Air
          exchanges with the atmosphere all the way down the firn. So its age barely changes
          while the ice around it gets older year by year. The moment the pores seal is the
          moment that exchange stops. The age difference is then fixed at whatever the ice's age
          is at that depth. Mixing looks like the answer because it is the process that keeps
          the air young. But its effect is a decade against a difference of centuries.
      - group: CORE
        task: Explain the smoother record
        title: Why the gas record has no sharp edges
        place: Core Line
        scene: >-
          Okonkwo has the two records from the same depths on one plot. The ice record has features
          a few years wide. The gas record from the same interval has nothing narrower than a few
          decades.
        guide: >-
          Four explanations for a record with no sharp edges. Ask of each whether it is a
          property of the site or of the laboratory. Cutting smaller pieces would help one of
          them a little. The pores do not all close at once. So the air sealed in one layer is a
          mixture spanning the years that range covers. A wetter site closes them in a decade.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be
              the answer under one specific misreading. A step skipped. A quantity confused with
              a rate. A correlation taken for a cause. Identifying which misreading each belongs
              to is where the learning is. The right answer alone can be reached on instinct and
              teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance. Before it was fixed, that was 88 per
              cent of passage quizzes here. It is now checked per game as a binomial tail.
              Length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them. Each is the reason that option fails, not a restatement of
              the right one. They are worth reading after a correct answer as well. A right
              choice made for an approximate reason is indistinguishable from a sound one. That
              holds until the day the approximation is what is being tested.
        takesAsRead:
          - "Stable isotopes as a thermometer: δ¹⁸O and deuterium"
        assumes:
          - a measurement that averages over an interval cannot show anything shorter than it
        takeaway: A record made by an averaging process cannot show a change faster than the averaging.
        format: CHOICE
        question: Why is the gas record smoother than the ice record from the same depths?
        answerText: The air mixed through the whole firn column before it was sealed, so each bubble holds an average of several decades of atmosphere rather than one year of it.
        choices:
          - Each bubble holds air mixed over the decades it took the pores to close
          - Gas measurements are made on larger samples, so they average more ice
          - Carbon dioxide changes more slowly in the atmosphere than temperature does
          - Bubbles leak slowly into one another over thousands of years
        answer: Each bubble holds air mixed over the decades it took the pores to close
        why: >-
          Air is in contact with the atmosphere throughout the open firn, and the pores do not
          all close at once. The closing happens across a depth range. So the bubbles sealed in
          one layer hold a mixture spanning the years that range represents. That smoothing is a
          property of the site. A high-accumulation site closes its pores in a decade and keeps
          sharp features. This one takes several. Sample size makes a small contribution and
          could be reduced by cutting smaller pieces. The smoothing cannot.
        rebuttals:
          - Sample size is a choice and could be made smaller; the firn smoothing is fixed by the site
          - Some atmospheric changes are genuinely fast, and this record could not show them either
          - Bubbles are sealed and do not exchange with each other on any timescale that matters here
  # ------------------------------------------------------------------ day 7
  - title: What the wind brought
    objective: Use the chemistry in the ice to date it and to say something about elsewhere.
    briefing: Dust, sea salt and volcanic acid arrive from three different places for three different reasons.
    stake: >-
      Sunday. The chemistry line has run the section from 1,100 to 1,300 metres. Dust is up four
      times through the cold spell. Sodium is up by half. There is one sulphate spike, and
      Okonkwo wants it named before anybody uses it for anything. Cruz has the isotope ratios
      from the same stretch of core. Today you turn a raw ratio into an isotope value, say what
      the dust is evidence of, and decide which chemistry the season should pay for. The dust

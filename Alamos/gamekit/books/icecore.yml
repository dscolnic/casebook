  - title: Two records, side by side
    objective: Put both records on one plot and find out how much of the comparison is independent.
    briefing: The Skarv record and this one differ by more than either group's stated uncertainty.
    stake: >-
      Wednesday. Both records are on one screen for the first time. Through the cold spell they
      differ by about half a per mil. That is more than either group has claimed as its own
      error. Halvorsen has a draft paragraph written already. Okonkwo has asked what the two
      records have in common, before anybody asks what they disagree about. Today you work out
      which parts of the comparison stand on their own. You say what the gas record adds about
      the energy budget. And you put half a per mil into degrees. Two records built the same way
      are one record with two names on it.
    takeaway: Agreement between two records is worth what their independence is worth.
    stops:
      - group: DATA
        task: Find what the two records share
        title: What both records rest on
        place: Science Module
        scene: >-
          Five pieces of the comparison are on Aalto's screen, each one computed from something.
          Okonkwo wants to know which of them would still stand if the flow model were wrong.
        guide: >-
          Open each piece of the comparison to see what it was computed from. Keep the
          ones that would still stand if the flow model were wrong, and untick the ones
          that run through it. Then name the shared dependency. A piece that survives is
          worth more than the number attached to it suggests.
        background:
          - >-
              What a flow model does here. It converts depth into age by describing how the
              ice has thinned and moved since it fell. Almost every quantity that carries a
              date has passed through it, which is what makes it the most consequential
              assumption in the building.
          - >-
              Why some things survive it. Anything measured against a fixed marker is a claim
              about ice rather than about the model. An ash layer, a known event, a directly
              counted section. Those hold whatever the model does, and they are how the model
              itself gets tested.
          - >-
              Why the question is asked this way round. Nobody expects the flow model to be
              wrong outright. The question is which conclusions are hostages to it. So when it
              is revised — as it is every few years — the group knows exactly what has to be
              redone.
        assumes:
          - two results computed from one assumption fail together if that assumption fails
        takeaway: Two numbers that agree because they came through the same step have not confirmed each other.
        format: TRACE
        question: Which parts of this comparison would survive the flow model being wrong?
        answerText: The counted section and the tephra tie point. Everything below the counts on both sides was dated with the same flow model, so those two agreeing establishes nothing about it.
        trace:
          hint: >-
            Open each piece to see what it was computed from. Keep the ones that would still stand
            on their own, then name the thing the rest have in common.
          channels:
            - { id: ourdeep, label: 'Our ages below 1,600 m', reading: '18,400 yr at 2,100 m', depends: [flow] }
            - { id: skarvdeep, label: 'Skarv ages below their count', reading: '18,050 yr at their 1,940 m', depends: [flow] }
            - { id: ourcount, label: 'Our counted section, surface to 1,180 m', reading: '9,900 layers counted', depends: [] }
            - { id: tephra, label: 'Tephra horizon, dated by its eruption', reading: '1,642 m, dated independently', depends: [] }
            - { id: skarvgas, label: 'Skarv gas ages below their count', reading: '17,600 yr at their 1,940 m', depends: [flow, offset] }
          resources:
            - { id: flow, label: 'The Nye flow model, used by both groups below their counts' }
            - { id: offset, label: 'The gas–ice age difference, estimated from firn density' }
          independent: [ourcount, tephra]
          target: flow
          commit: Commit the independent evidence
        why: >-
          Both groups counted layers as far as they could. Then they handed the rest to the same
          flow model, with the same assumption of uniform vertical strain. Below those counts
          the two age scales are not independent estimates that happen to agree; they are one
          calculation applied twice. What survives the model being wrong is the counted section,
          which is arithmetic on measured layers. The other is the tephra horizon, whose date
          came from a volcano and not from any ice. Those two are the comparison. The rest is a
          shared assumption.
      - group: GAS
        task: Turn a gas record into an energy number
        title: What the carbon dioxide change was worth
        place: Gas Laboratory
        scene: >-
          Adeyemi has carbon dioxide at 190 parts per million through the cold interval and 280 at
          the top of the core. Halvorsen wants the difference expressed as an energy imbalance.
        guide: >-
          Four numbers, and one of them is the isotope temperature slope, which belongs
          to another question. Ask of each whether this forcing uses it. And note the
          shape of the relationship. The bands are already partly saturated. Each extra
          molecule does less than the last, so the effect follows a logarithm rather
          than a proportion.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is already
              measured or stated. Nothing here has to be derived. What is being tested is
              whether you can pick the quantities the relationship actually needs. Then, whether
              the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label catches a unit mismatch before it
              is placed. It also catches a quantity belonging to a different part of the
              problem. That is the habit this format exists to build.
        assumes:
          - a greenhouse gas reduces the rate at which the surface loses heat to space
        takeaway: A concentration becomes a climate statement only through the energy it changes.
        format: BALLPARK
        question: Estimate the radiative forcing between the two concentrations.
        answerText: About 2.1 watts per square metre. The change from 190 to 280 parts per million is roughly a third of the way to a doubling.
        why: >-
          Carbon dioxide absorbs in bands that are already partly saturated. So each extra
          molecule does less than the one before it. The forcing goes as the logarithm of the
          concentration rather than in proportion to it. That is why the effect is usually
          stated per doubling: every doubling adds about the same. Between the cold interval and
          the top of the core the concentration rose by half. That is worth about two watts on
          every square metre of the planet, sustained for as long as it lasts.
        estimate:
          prompt: Carbon dioxide is 190 parts per million in the cold interval and 280 at the top of the core.
          question: Estimate the radiative forcing between the two.
          relationship: ΔF = 5.35 × ln(C ÷ C₀) — the logarithm of the concentration ratio, times the coefficient for carbon dioxide, in watts per square metre.
          labels:
            - 280 ppm  (top of the core)
            - 190 ppm  (the cold interval)
            - 5.35  (the coefficient for carbon dioxide)
            - 0.67  (the isotope temperature slope)
          values: [280, 190, 5.35, 0.67]
          slots: 3
          template: '{2} × ln({0} ÷ {1})'
          formula: c*Math.log(a/b)
          correct: [0, 1, 2]
          target: 2.07
          tolerance: 0.25
          units: W/m²
          solution: 5.35 × ln(280 ÷ 190) = 2.07 W/m².
          explanation: The isotope slope converts a ratio into degrees at this site, which is a different step in a different part of the argument.
      - group: COLD
        task: Say what the offset is worth in degrees
        title: Half a per mil, in degrees
        place: Cold Laboratory
        scene: >-
          The two records differ by about half a per mil through the cold interval. Tanabe has the
          site calibration slope and Halvorsen's draft paragraph, which calls the difference a
          different climate.
        guide: >-
          Four readings of half a per mil, and one of them refuses to convert at all.
          Ask of each whether it uses this site's own slope, and in which direction.
          Multiplying where you should divide gives an answer far too large. And note
          why the conversion matters. In per mil the difference sounds like rounding,
          and in degrees it is a quarter of the season's headline.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be
              the answer under one specific misreading. A step skipped. A quantity confused with
              a rate. A correlation taken for a cause. Identifying which misreading each belongs
              to is where the learning is. The right answer alone can be reached on instinct and
              teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance. Before it was fixed, that was 88 per
              cent of passage quizzes here. It is now checked per game as a binomial tail.
              Length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them. Each is the reason that option fails, not a restatement of
              the right one. They are worth reading after a correct answer as well. A right
              choice made for an approximate reason is indistinguishable from a sound one. That
              holds until the day the approximation is what is being tested.
        assumes:
          - an isotope difference is converted to a temperature difference by the site slope
        takeaway: A difference has to be converted into the units of the claim before anybody can judge it.
        format: CHOICE
        question: What does half a per mil amount to, in the terms the draft paragraph uses?
        answerText: About three quarters of a degree — which is smaller than the cooling being reported and large enough to matter to it.
        choices:
          - About three quarters of a degree — a quarter of the reported cooling
          - About half a degree, since the slope is close to one per mil for each degree
          - Nothing until the difference exceeds the scatter of a single measurement
          - About four degrees, since the slope is measured in per mil per degree
        answer: About three quarters of a degree — a quarter of the reported cooling
        why: >-
          The site slope is 0.67 per mil for each degree, so half a per mil is about 0.75 of a
          degree. That is the whole point of converting. In per mil the difference sounds like a
          rounding error. In degrees it is a quarter of the cooling the season intends to
          report. Whether it is a real climate difference or a shared method's shortcoming is a
          separate question. It cannot be argued about honestly until both sides are talking in
          the same units.
        rebuttals:
          - A slope of one per mil per degree is not this site's slope, and using it changes the answer by half
          - Scatter on a single measurement is much smaller than this difference, which is why it was noticed
          - Multiplying by the slope instead of dividing by it gives a number about 5 times too large
  # ------------------------------------------------------------------ day 11
  - title: The offset that was not climate
    objective: Test whether the age difference accounts for the disagreement before it is called one.
    briefing: The two records may differ because one dates ice and the other dates gas.
    stake: >-
      Thursday. Adeyemi has spent the night on the two groups' age scales. Skarv gets four times
      as much snow a year as this station does. So the gap between its air ages and its ice ages
      is only a small part of ours. Up to now the comparison has been drawn with both gas
      records on their own ice clocks. Okonkwo has said since the first week that two clocks
      have to be matched first. Today you predict what the difference becomes once the
      correction is put in, put it in, and check the result against the one date neither group
      worked out. Get this wrong and a dating mistake goes out to the world as a climate result.
    takeaway: A disagreement between two records is a claim about both of them, including how they were dated.
    stops:
      - group: GAS
        task: Predict, correct, then check
        title: What the correction leaves behind
        place: Gas Laboratory
        scene: >-
          Adeyemi has the age difference for both sites and the machinery to re-plot both gas
          records on their own gas timescales. The tephra horizon is dated independently of either
          calculation.
        guide: >-
          Lock what you expect the difference to become once both gas records sit on their own
          gas timescales. Then re-plot them and see. The tephra horizon is dated independently
          of either calculation. So it is the check that can tell you whether the correction did
          what you predicted, rather than merely what you wanted.
        background:
          - >-
              What the correction does. Each site's gas is younger than the ice around it,
              by an amount that differs between sites. Putting each gas record on its own
              gas timescale removes that offset. Any difference remaining afterwards is a
              difference between the sites rather than between their chronologies.
          - >-
              Why a prediction first. If you re-plot and then decide what you expected, any
              residual difference can be explained after the fact. Committing to a number is
              what makes the result capable of surprising you, which is the only way it can
              be evidence.
          - >-
              Why the tephra matters. A volcanic ash layer arrives at both sites within days and
              is dated by neither calculation. So it is a fixed point both records must agree
              on. If the correction is right, the ash lines up. If it does not, something in the
              correction is wrong.
        assumes:
          - a correction should be predicted before it is applied, or it cannot be wrong
        takeaway: A prediction made before the correction is the only thing that can test it.
        format: VERIFY
        question: What is left of the difference once both gas records are on their own gas timescales?
        answerText: About 0.15 per mil — most of the difference was the age offset, and what remains is inside both groups' stated uncertainties.
        verify:
          hint: >-
            Write down what you expect the difference to become. It cannot be changed after the
            correction is applied, which is the point of writing it first.
          prediction: { label: Difference remaining after the correction, unit: '‰', min: 0, max: 1.2, step: 0.05 }
          truth: 0.15
          passRatio: [0.4, 2.0]
          intervention:
            label: Re-plot both gas records on their own gas timescales
            note: Each site's age difference applied to its own record, from its own firn density and accumulation.
            outcome: Both curves move. This station's moves by 450 years, Skarv's by 110.
          measurement:
            label: The remaining difference, measured at the tephra horizon
            note: The one depth in both cores whose date came from a volcano rather than a model.
            cost: 1
            costUnit: runs
          unmeasuredMoral: >-
            The correction was applied, both curves moved, and nobody checked the result against the
            one date that did not come from either calculation. A correction that is never tested is
            an assumption with more arithmetic in it.
          commit: Report what is left
        why: >-
          Air keeps mixing with the atmosphere until the firn seals. So gas is younger than the
          ice around it. The amount is set by how deep the sealing is and how fast snow arrives.
          Skarv accumulates four times as fast, so its offset is a fraction of this station's.
          Plotting both gas records on ice timescales therefore shifts one curve much further
          than the other. It produces a difference that looks like climate and is arithmetic.
          What makes the corrected answer trustworthy is the tephra: a date neither calculation
          produced.
      - group: CORE
        task: Date ice the counting cannot reach
        title: The clock that does not need layers
        place: Core Line
        scene: >-
          Okonkwo has a sample from the deep section and a radiometric result. The isotope in it
          has fallen to 0.55 of the amount it starts with. Its mean lifetime is on the bench.
        guide: >-
          Four numbers, and two of them are traps. One is the half-life of the same
          isotope, which is not the same as its average life. One is the ice thickness.
          Ask of each whether this clock depends on it. And note why the answer is worth
          having. The decay rate cares nothing about temperature, pressure or flow, so
          it owes nothing to the flow model.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is already
              measured or stated. Nothing here has to be derived. What is being tested is
              whether you can pick the quantities the relationship actually needs. Then, whether
              the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label catches a unit mismatch before it
              is placed. It also catches a quantity belonging to a different part of the
              problem. That is the habit this format exists to build.
        assumes:
          - a radioactive isotope decays at a rate nothing in the ice can change
        takeaway: Where counting has run out, a clock that runs on its own is the only independent date left.
        format: BALLPARK
        question: Estimate the age of the sample from what is left of the isotope.
        answerText: About 4,900 years. Decay is the one clock in the core that does not depend on the flow model.
        why: >-
          Radioactive decay proceeds at a rate that no temperature, pressure or flow in the ice
          can change. That is what makes it usable where the layers have stopped being
          countable. The amount left falls exponentially with time. So taking the natural
          logarithm of the fraction remaining and multiplying by the mean lifetime gives the age
          directly. It carries its own uncertainties. How much was there to begin with, and
          whether anything was added or lost. None of them is the flow model, which is why the
          result is worth having.
        estimate:
          prompt: The isotope has fallen to 0.55 of its initial amount. Its mean lifetime is 8,267 years.
          question: Estimate the age of the sample.
          relationship: t = −τ × ln(N ÷ N₀) — the isotope's mean lifetime, times the logarithm of the fraction still remaining.
          labels:
            - 0.55  (fraction of the isotope remaining)
            - 8267 yr  (mean lifetime)
            - 5730 yr  (the half-life of the same isotope)
            - 3010 m  (ice thickness)
          values: [0.55, 8267, 5730, 3010]
          slots: 2
          template: '−{1} × ln({0})'
          formula: -b*Math.log(a)
          correct: [0, 1]
          target: 4941
          tolerance: 400
          units: years
          solution: −8267 × ln(0.55) = 4,941 years.
          explanation: The half-life is the same clock in different units and belongs in a different form of the equation; using it here gives an age a third too short.
      - group: DATA
        task: Say what the corrected comparison supports
        title: What is left to disagree about
        place: Science Module
        scene: >-
          Both records are re-plotted, the tephra horizon lines up in both, and 0.15 per mil of
          difference remains. Both groups quote uncertainties larger than that.
        guide: >-
          Four readings of what is left after the correction. Ask of each whether the
          remaining difference is bigger or smaller than the uncertainties either group
          quotes. And ask what a correction does to a result. This one was predicted
          before it was applied, then checked against a date that came from neither
          calculation. Both records were on the wrong clock; only one moved far.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be
              the answer under one specific misreading. A step skipped. A quantity confused with
              a rate. A correlation taken for a cause. Identifying which misreading each belongs
              to is where the learning is. The right answer alone can be reached on instinct and
              teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance. Before it was fixed, that was 88 per
              cent of passage quizzes here. It is now checked per game as a binomial tail.
              Length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them. Each is the reason that option fails, not a restatement of
              the right one. They are worth reading after a correct answer as well. A right
              choice made for an approximate reason is indistinguishable from a sound one. That
              holds until the day the approximation is what is being tested.
        assumes:
          - a difference smaller than the uncertainty of either measurement is not a measured difference
        takeaway: Explaining a disagreement away is a result, and it is the result that has to be published.
        format: CHOICE
        question: What does the corrected comparison support?
        answerText: That the two records are consistent, and that most of the apparent difference was the gas–ice age offset rather than climate.
        choices:
          - The two records are consistent once both are on gas timescales
          - The two records disagree, but by less than was first thought
          - Nothing at all, since a correction had to be applied to reach the result
          - The Skarv record is wrong, since its offset was the smaller of the two
        answer: The two records are consistent once both are on gas timescales
        why: >-
          What remains after the correction is smaller than either group's stated uncertainty,
          so there is no measured difference left to explain. That is a positive result rather
          than an absence of one. Two independently drilled cores, once put on comparable
          clocks, record the same cooling. The correction does not weaken it. It was predicted
          before it was applied, and then checked against a date that came from neither
          calculation. And nothing here makes Skarv wrong; both records were plotted on the
          wrong clock, and only one of them moved far.
        rebuttals:
          - A remaining difference below both uncertainties is not a disagreement of any size
          - A correction that was predicted and then tested is evidence rather than a weakness
          - Both records were on ice timescales; the offset is smaller at Skarv because it snows more there
  # ------------------------------------------------------------------ day 12
  - title: A day when nothing is wrong
    objective: Spend what is left of the season on the work that will still matter next year.
    briefing: The drill is running clean and there are nine drilling days left.
    stake: >-
      Friday, and for the first time this season nothing is broken. The drill is running clean
      and the chemistry line has caught up. The camp manager, Anneke de Vries, needs the rest of
      the plan before the fuel figures are locked. Nine drilling days are left and four jobs
      want them. Today you commit the drill time, settle what one stake reading is worth on its
      own, and fix the order a measurement run is made in. Nothing is on fire anywhere on the
      station. That has not happened before this season. So this is the one day you get to
      choose the work because it is worth doing, and not because something just broke.
    takeaway: The quiet days are when the season decides what it will have been about.
    stops:
      - group: DRILL
        task: Commit the last drilling days
        title: Nine days, four jobs
        place: Drill Trench
        scene: >-
          Lindqvist has nine drilling days before the station closes. De Vries has the fuel
          committed for those nine and no more, and four pieces of work want them.
        guide: >-
          Nine drilling days, fuel committed for exactly nine, and four jobs that want them.
          Watch the questions list rather than the depths: it shows which questions the current
          plan can still answer. Every day you spend is a question you can answer and one you
          have given up. Nothing can be added after the station closes.
        background:
          - >-
              Why the fuel is the real constraint. Days can in principle be found; the fuel
              for those days cannot. It was committed before the season and there is no
              more, so the plan has to fit the fuel rather than the calendar.
          - >-
              Why depth is not the same as value. Drilling deeper always produces more core,
              and the extra core answers a question only if it reaches something the record
              needs. A shallower job that closes a comparison can be worth more than a
              deeper one that extends a series nobody is arguing about.
          - >-
              What the closing date does to the choice. Anything unfinished is unfinished
              for a year, and a core left mid-hole can be lost to closure or to the hole
              itself. So a plan that just fits is worse than one that fits with something in
              reserve.
        assumes:
          - a season ends on a date fixed by aircraft rather than by science
        takeaway: A plan is judged by which questions it can still answer, not by how much it fits in.
        format: ALLOCATE
        question: Which questions can the last nine days still answer?
        answerText: Extending the deep section and cutting the replicate at the tephra horizon, on top of the fluid change the drill cannot run without. The firn re-drill and the borehole log are real work and neither answers a question this season needs.
        allocate:
          hint: >-
            The fluid change is not optional. What is left has to be spent on the questions that
            change what the season can claim.
          pool: { amount: 9, unit: drilling days, mode: scalar }
          items:
            - { id: fluid, label: Drill fluid change and barrel service, cost: 2, protected: true, note: 'the drill does not turn without it' }
            - { id: deepen, label: Extend the hole past the modelled clathrate boundary, cost: 4 }
            - { id: replicate, label: Cut the replicate core through the tephra horizon, cost: 3 }
            - { id: firn, label: Re-drill the shallow firn core that broke, cost: 2 }
            - { id: logging, label: Run the borehole temperature log to the bottom, cost: 3 }
          answers:
            - { question: 'Does the deep section reach ice older than the counted record can reach?', requires: [deepen], required: true }
            - { question: 'Is the tephra horizon present in a second hole 400 metres away?', requires: [replicate], required: true }
            - { question: 'What is the firn air profile this season?', requires: [firn] }
            - { question: 'What is the present-day temperature profile of the ice?', requires: [logging] }
          commit: Commit the drilling plan
        why: >-
          The two required questions are the ones this season exists to answer. Whether the deep
          section reaches older ice. And whether the horizon everything is now tied to appears
          in ice that shared the weather but not the drill. Together with the fluid change they
          use exactly the nine days available. The firn profile and the borehole log are both
          good work. Both can be done next season by somebody who has not yet drilled to 2,400
          metres. A plan that fits everything in is a plan that has not been asked what it is
          for.
      - group: FIELD
        task: Say what one stake is worth
        title: The stake that gained a centimetre
        place: Snow Study Hut
        scene: >-
          Brandt has 48 stakes read this morning. One near the hut has gained a centimetre since the
          last reading. 11 others across the array have lost about the same.
        guide: >-
          Four readings of one stake that gained a centimetre while eleven others lost.
          Ask of each whether a single stake can separate snow that fell from snow that
          arrived sideways. Wind moves far more snow across this plateau in a fortnight
          than falls out of the sky. Summed across the array, the moving snow cancels.
          That is why forty-eight stakes are read rather than one.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be
              the answer under one specific misreading. A step skipped. A quantity confused with
              a rate. A correlation taken for a cause. Identifying which misreading each belongs
              to is where the learning is. The right answer alone can be reached on instinct and
              teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance. Before it was fixed, that was 88 per
              cent of passage quizzes here. It is now checked per game as a binomial tail.
              Length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them. Each is the reason that option fails, not a restatement of
              the right one. They are worth reading after a correct answer as well. A right
              choice made for an approximate reason is indistinguishable from a sound one. That
              holds until the day the approximation is what is being tested.
        assumes:
          - wind moves snow across a surface after it has fallen
        takeaway: A measurement of a surface that moves has to be made in enough places to catch what moved.
        format: CHOICE
        question: What does the gain at that one stake establish?
        answerText: Almost nothing on its own. Snow moves sideways in wind, so a gain in one place and losses elsewhere is redistribution until the whole array is added up.
        choices:
          - Little on its own; the whole array separates snowfall from drift
          - That accumulation is higher near the hut, which shelters the surface from the wind
          - That this fortnight's snowfall was about a centimetre
          - That the stake has been disturbed, since the others lost snow
        answer: Little on its own; the whole array separates snowfall from drift
        why: >-
          Wind on this plateau moves far more snow horizontally than falls out of the sky in a
          fortnight. So any single stake is measuring snowfall and redistribution added
          together. It cannot separate them. The array can. Snow moved from one place to another
          cancels when the whole array is summed. What is left is what actually arrived. That is
          why 48 stakes are read rather than 1, and why the accumulation figure is a season's
          arithmetic rather than a reading.
        rebuttals:
          - Sheltering is a real effect and would have to be established across several fortnights, not one
          - A fortnight's snowfall is what the whole array establishes, since drift cancels only in the sum
          - 11 stakes losing snow is what redistribution looks like, and does not point at one disturbed stake
      - group: COLD
        task: Fix the order of a run
        title: The order a run is made in
        place: Cold Laboratory
        scene: >-
          Cruz has 16 samples to run and the instrument warmed up. Tanabe's rule is that a run
          has to be able to say afterwards whether it can be trusted.
        guide: >-
          All five of these will be done, so ask what each one makes possible. A blank
          says what the process adds with no ice in it. An opening standard fixes the
          scale. Standards inside the run reveal drift while it happens. Ask which of
          them a correction could be computed without. And note why both raw and
          corrected values are kept.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency. Each step
              is here because the one before it has already happened, or has to have. One
              transposed pair falsifies that claim wherever it sits. Partial credit would be
              credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained by
              having nothing before or after them. That usually makes them the two you can
              settle from the scene alone. Pinning them collapses the remaining arrangements
              sharply. What is left in the middle is where the actual judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the only
              one. An order can run on cost, on risk, or on reversibility. Reversibility puts
              every observation that leaves the sample as it was before any that consumes it. On
              those boards a chronological reading finds nothing. None of the steps has to
              happen at a particular hour.
        assumes:
          - an instrument's response can move slowly during a long run
        takeaway: A run is designed so that it can be checked afterwards, not so that it finishes soonest.
        format: SEQUENCE
        cards:
          - Run a blank, to see what the process contributes with no sample in it
          - Run the working standard, to fix where the scale sits at the start
          - Run the samples in depth order, with a standard after every eighth
          - Run the working standard again at the end, to measure the drift across the run
          - Correct the samples for drift, and write the raw and corrected values to the record
        order: [0, 1, 2, 3, 4]
        why: >-
          Every step here exists to make the run auditable. The blank establishes what the
          process adds before any ice is involved. The opening standard fixes the scale. The
          standards inside the run reveal drift while it is happening. The closing standard
          measures how far it moved overall. Only then can the samples be corrected. Both the
          raw and the corrected values are kept. A correction is a claim about the instrument
          that somebody may want to check later.
  # ------------------------------------------------------------------ day 13
  - title: The night the generator stopped
    objective: Work out what the core store record can still prove after a power failure.
    briefing: The store was without power for six hours and the log says nothing about it.
    stake: >-
      Saturday. The number two generator stopped at some point in the night. The core store came
      back at minus 19. The log has an entry for the whole night, signed by the watch. De Vries
      needs the drill and the store brought back in a fixed order. Lindqvist wants his own list
      done first. Aalto has been asked how much of the season's temperature record survives the
      scatter in it. Today you decide which signatures are worth checking, what gets restarted
      first, and how tightly a mean can be quoted. Ice that warmed up is a problem. Ice that
      warmed up and was signed for as cold is a worse one.
    takeaway: A record is a claim about a condition, and the two can come apart in a night.
    stops:
      - group: COLD
        task: Check what is worth checking
        title: Six signatures and two hours
        place: Cold Laboratory
        scene: >-
          Six lines on the night sheet, all signed. Tanabe has two hours before the flight
          manifest closes and can verify two of them properly.
        guide: >-
          Six signed lines, two hours, and two of them can be verified properly. Open
          each claim and read what already backs it. A signature records that somebody
          took responsibility, not that anybody observed the thing. Hold what the
          backing does not support, and spend the two hours where being wrong would
          matter after the flight has gone.
        background:
          - >-
              Why the manifest deadline is the whole pressure. Once the flight closes, anything
              unverified stays unverified until next season. The samples or the equipment it
              concerns are already off the ice. A claim checked next year is a claim about
              something nobody can revisit.
          - >-
              What a night sheet is. A running record of what was done on shift, signed at the
              end. It is written by people who were tired, at the end of a working night. Its
              purpose is continuity rather than evidence. That is exactly why some lines on it
              are firmer than others.
          - >-
              How to choose between two doubtful lines. Not by which is least likely to be
              true. By which one, if wrong, would change what somebody does with the
              material afterwards. That is consequence, and it is the judgement the two
              hours are for.
        takesAsRead:
          - Random against systematic uncertainty
          - Separating a trend from year-to-year noise
        assumes:
          - a signature records that somebody believed something, at the time they signed
        takeaway: A signed record is evidence that a claim was made, which is not evidence that it was true.
        format: ATTEST
        question: Which two claims should the two hours verify?
        answerText: The store temperature and the gas samples. Both are critical, both are signed with nothing behind them, and both would invalidate measurements if they are wrong.
        attest:
          hint: >-
            Everything here is signed. Verifying costs time and there is not enough of it for the
            whole sheet.
          checks: 2
          claims:
            - { id: store, label: 'Core store held at −25 °C all night', signedBy: 'Ekwueme', critical: true, evidence: 'signed at 0600 for the whole night; the store was reading −19 °C when the power came back' }
            - { id: gas, label: 'Gas samples remained below −20 °C', signedBy: 'Menon', critical: true, evidence: 'signed on the same sheet, from the same store, at the same time' }
            - { id: drill, label: 'Drill fluid tank heater running', signedBy: 'Lindqvist', backed: true, evidence: 'independent tank thermistor logged to a separate recorder all night' }
            - { id: mast, label: 'Mast instruments powered from the second circuit', signedBy: 'Brandt', critical: true, backed: true, evidence: 'the mast record itself is continuous through the outage' }
            - { id: kitchen, label: 'Food store above freezing', signedBy: 'de Vries', evidence: 'nobody has looked since the power came back' }
            - { id: fuel, label: 'Day tank filled at 2200', signedBy: 'de Vries', backed: true, evidence: 'level gauge reading logged before and after' }
          commit: Verify the two
        why: >-
          A signature says that somebody believed something when they signed. The store reading
          of minus 19 says the belief was wrong for at least part of the night. Two of these
          claims are both critical and carried by nothing but the signature: the store and the
          gas samples. Both decide whether measurements made on that ice can be defended. The
          mast is critical and already carries its own continuous record; the drill tank has an
          independent logger. The food and the fuel matter to the camp and not to the science.
      - group: DRILL
        task: Put the restart in order
        title: What comes back first
        place: Drill Trench
        scene: >-
          Power is back on one generator. Lindqvist, de Vries and Tanabe each want their own
          system restarted first. The single generator will not carry all of them at once.
        guide: >-
          Four systems, and three of them are waiting. Ask of each whether the delay
          costs time or costs evidence. Ice above minus twenty starts losing gas from
          the bubbles near its cut faces, and nothing recovers it. A drilling day is a
          day. Queued samples are as good tomorrow. Order by what is still being lost.
        background:
          - >-
              Why first is a different question from most important. When several calls compete
              for the same hour, what a choice is worth is not its own importance. It is the
              difference between doing it now and doing it later. A serious problem that will be
              no worse in an hour costs nothing to defer. A smaller one that closes a door costs
              everything behind that door.
          - >-
              What to look for in the options. Two things separate them. Which is still
              changing, and which is a precondition for the others. A situation that is
              deteriorating has a cost per hour attached to it. A step that unblocks the rest
              multiplies the value of the hours after it. Everything else is a preference about
              where to start.
          - >-
              Why only one answer is marked. In the situation these options describe, all of
              them eventually happen. What is being tested is the head of the queue, because
              that is where the reasoning is visible. The verdict names what each of the others
              was waiting on. That is worth reading even when the choice was right. The ordering
              behind the first place is the rest of the answer.
        assumes:
          - a system that has already failed is more informative than one that has not yet been used
        takeaway: Restart in the order of what is still being lost, not in the order of who asked.
        format: TRIAGE
        question: What is restarted first?
        answerText: The core store. It is the only one of the 4 still losing something irreversibly, and every hour above minus 20 costs gas measurements that cannot be made again.
        choices:
          - The core store refrigeration, which is still warming
          - The drill, so the day's run is not lost
          - The chemistry line, so the 16 queued samples can be run
          - The satellite link, so the season report can be sent
        answer: The core store refrigeration, which is still warming
        why: >-
          Three of these are waiting and one is deteriorating. Ice above minus 20 starts losing
          gas from the bubbles near its cut faces. That loss cannot be undone or measured
          around. Every hour is more of the core that can no longer answer a gas question. A
          lost drilling day is a day. The queued samples are as good tomorrow as today. A report
          sent six hours late is a report sent. Order by what is still being lost.
        rebuttals:
          - A drilling day is recoverable, and the drill is not losing anything while it stands idle
          - Queued samples are in the store; if the store is warm they are the thing being lost, not the queue
          - A report is not perishable, and the link is the only item here that changes nothing by waiting
      - group: DATA
        task: Say how tightly the mean can be quoted
        title: How much of it is noise
        place: Science Module
        scene: >-
          Aalto has 30 years of reconstructed annual temperature from the top of the core. The
          year-to-year scatter is 1.4 degrees and the summary wants a mean for the period.
        guide: >-
          Four numbers, and two of them belong to other questions: the calibration
          slope, and the years of mast overlap. Ask of each whether this uncertainty
          depends on it. Averaging does not remove the scatter of individual years. It
          reduces the uncertainty of the mean, and only as the square root of how many
          years went in.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is already
              measured or stated. Nothing here has to be derived. What is being tested is
              whether you can pick the quantities the relationship actually needs. Then, whether
              the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label catches a unit mismatch before it
              is placed. It also catches a quantity belonging to a different part of the
              problem. That is the habit this format exists to build.
        takesAsRead:
          - Random against systematic uncertainty
        assumes:
          - averaging independent years reduces the scatter of the average, not of the years
        takeaway: An average is only as tight as the scatter divided by the root of how many years went into it.
        format: BALLPARK
        question: Estimate the standard error of the thirty-year mean.
        answerText: About 0.26 degrees. A difference between two such means smaller than half a degree is not a difference at all.
        why: >-
          Individual years scatter because weather scatters, and averaging does not remove that
          scatter. It reduces the uncertainty of the average, and only as the square root of the
          number of years. 30 years of a record with 1.4 degrees of year-to-year variation give
          a mean known to about a quarter of a degree. Two such means half a degree apart are
          two standard errors apart. That is where a claim of difference starts becoming
          defensible, and not before. Doubling the precision would take 120 years.
        estimate:
          prompt: The reconstructed annual temperatures scatter by 1.4 degrees, and the period is 30 years long.
          question: Estimate the standard error of the thirty-year mean.
          relationship: SE = s ÷ √n — the year-to-year scatter, divided by the square root of how many years were averaged.
          labels:
            - 1.4 °C  (year-to-year scatter)
            - 30  (years in the period)
            - 0.67 ‰/°C  (the site calibration slope)
            - 11  (years of mast overlap)
          values: [1.4, 30, 0.67, 11]
          slots: 2
          template: '{0} ÷ √{1}'
          formula: a/Math.sqrt(b)
          correct: [0, 1]
          target: 0.256
          tolerance: 0.04
          units: °C
          solution: 1.4 ÷ √30 = 0.26 °C.
          explanation: The calibration slope is already inside the reconstruction; applying it again would convert degrees into degrees per degree.
  # ------------------------------------------------------------------ day 14
  - title: What the season is allowed to say
    objective: Choose the claim that survives the range of the correction, and get the report out.
    briefing: The report goes tomorrow, and the correction it rests on has a range rather than a value.
    stake: >-
      Sunday. The season report closes tomorrow morning. Most of the gap with Skarv was
      explained by the age offset. But that offset is a sum, and it comes out as a range rather
      than one value. Halvorsen has four possible sentences on the board. Okonkwo will sign the
      one that holds right across that range. She will not sign any of the others. Adeyemi has
      been asked what the gas record on its own can prove. Today you choose the sentence. You
      settle what the carbon dioxide numbers let you say. And you fix what has to happen before
      the report is sent. After tomorrow nobody can add to this season. What the report says is
      what the season said.
    takeaway: A claim has to survive the worst credible value of everything it rests on.
    stops:
      - group: DATA
        task: Choose the sentence that survives
        title: Four sentences and a range
        concept: Random against systematic uncertainty
        place: Science Module
        scene: >-
          The correction removes somewhere between a tenth and four tenths of a per mil of the
          difference. That depends on assumptions nobody can settle this season. Four sentences
          are on the board.
        guide: >-
          The correction removes somewhere between a tenth and four tenths of a per mil, and
          nobody can settle which this season. Move it to the least favourable end before
          choosing between the four sentences. A sentence can be true at the middle of the range
          and false at the end of it. That is not a sentence the season summary can carry.
        background:
          - >-
              Why the pessimistic end rather than the best estimate. A published sentence is
              read as a claim about the world, not about the middle of somebody's uncertainty.
              Choosing at the expected value means publishing something that has a real chance
              of being wrong. The retraction costs more than the caution would have.
          - >-
              What makes one sentence survive and another not. Sentences that assert a direction
              usually survive. Sentences that assert a size usually do not. The size is exactly
              what the correction's range moves. A carefully weakened claim can be both true and
              useful.
          - >-
              Why this cannot wait for the assumptions to settle. The summary is written
              this season and the assumptions will not be settled for years. The
              professional move is to write the strongest sentence that survives the whole
              range rather than the strongest sentence full stop.
        assumes:
          - a correction estimated from a model carries a range rather than a single value
        takeaway: The claim to publish is the one that is still true at the least favourable end of what you assumed.
        format: STRESS
        question: Which sentence would still be true at the least favourable end of the correction's range?
        answerText: That part of the difference is chronological and the remainder is not yet explained. It is the only sentence that holds whether the correction removes a tenth of a per mil or four tenths.
        stress:
          hint: >-
            The correction has a range because the firn model has one. Move it to the unfavourable
            end before choosing what to sign.
          assumption:
            label: Difference removed by the age correction
            unit: '‰'
            min: 0.10
            max: 0.40
            nominal: 0.30
            step: 0.01
          criteria:
            - { key: weeks, label: Weeks to draft and review, unit: wk }
            - { key: risk, label: Chance of later correction, unit: '%' }
          candidates:
            - { id: consistent, label: 'The two records are consistent once the correction is applied' }
            - { id: partial, label: 'Part of the difference is chronological; the rest is unexplained' }
            - { id: entirely, label: 'The difference is entirely chronological' }
            - { id: climate, label: 'The two sites recorded different coolings' }
          scores:
            consistent: { weeks: 3, risk: 18 }
            partial: { weeks: 5, risk: 12 }
            entirely: { weeks: 2, risk: 46 }
            climate: { weeks: 2, risk: 61 }
          feasible:
            consistent: 0.25
            partial: 0.10
            entirely: 0.38
            climate: 0.45
          optimiseOn: weeks
          robust: partial
          commit: Sign the sentence
        why: >-
          The correction is calculated from a firn model. Firn models disagree with each other
          by more than anybody would like. So what comes out is a range. A sentence is
          publishable when it is still true at the least favourable end of that range. Saying
          the records are consistent needs the correction to do most of the work, and at the low
          end it does not. Saying the difference is entirely chronological needs more than the
          correction can do at any end. The hedged sentence is the slowest to write and the only
          one that survives.
      - group: GAS
        task: Say what the gas record alone establishes
        title: What the bubbles license
        concept: Carbon dioxide and methane records, and what a ppm is
        place: Gas Laboratory
        scene: >-
          Adeyemi has carbon dioxide through the cold interval and the modern section, measured on
          this core and reproduced on the replicate. Halvorsen wants to know what it supports on its
          own.
        guide: >-
          Four options, and the question is what this measurement is of. Ask of each how
          far the quantity travels before it is measured. Carbon dioxide stays in the
          air long enough to mix through all of it, so a bubble here reports the planet.
          The isotopes record condensation over this region, and reach degrees through a
          slope fitted at this site. Local at both steps.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be
              the answer under one specific misreading. A step skipped. A quantity confused with
              a rate. A correlation taken for a cause. Identifying which misreading each belongs
              to is where the learning is. The right answer alone can be reached on instinct and
              teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance. Before it was fixed, that was 88 per
              cent of passage quizzes here. It is now checked per game as a binomial tail.
              Length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them. Each is the reason that option fails, not a restatement of
              the right one. They are worth reading after a correct answer as well. A right
              choice made for an approximate reason is indistinguishable from a sound one. That
              holds until the day the approximation is what is being tested.
        assumes:
          - a measurement made at one site can record a quantity that is the same everywhere
        takeaway: Some quantities measured at one place are global, and a proxy of local weather is not one of them.
        format: CHOICE
        question: What does the carbon dioxide record support that the isotope record cannot?
        answerText: A statement about the whole atmosphere. Carbon dioxide mixes globally within a couple of years, so a measurement here is a measurement of the planet's air.
        choices:
          - A statement about the global atmosphere, since the gas is well mixed
          - A statement about the temperature of this site, more directly than the isotopes do
          - A statement about how much snow fell, since concentration depends on accumulation
          - Nothing the isotope record does not already support, since both come from the same ice
        answer: A statement about the global atmosphere, since the gas is well mixed
        why: >-
          Carbon dioxide stays in the air long enough to mix through all of it before it is removed.
          Its concentration is therefore very nearly the same everywhere. A bubble from this plateau
          reports the whole planet's air, and it is the one global quantity this core measures
          directly. The isotopes are different. They record the condensation temperature over this
          region, and they reach degrees through a slope fitted at this site. Local at both steps.
        rebuttals:
          - Temperature at this site is what the isotopes measure, through a slope, and the gas does not measure it at all
          - A gas concentration in a bubble is a mixing ratio and does not depend on how much snow buried it
          - Sharing the same ice is not the same as supporting the same claims, which is the whole distinction here
      - group: CORE
        task: Fix what happens before the report goes
        title: Before anything is sent
        place: Core Line
        scene: >-
          Okonkwo has the sentence, the corrected records and a report that closes in the morning.
          Four things are outstanding and their order is not obvious.
        guide: >-
          All five of these will be done before the report goes. Ask of each what the
          next step would mean without it. Nobody can reproduce a result without knowing
          which version of the age scales produced it. Recomputing from raw data tests
          that the draft's number is the method's number. And one of these turns a
          disagreement about another group's record into a conversation with them.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency. Each step
              is here because the one before it has already happened, or has to have. One
              transposed pair falsifies that claim wherever it sits. Partial credit would be
              credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained by
              having nothing before or after them. That usually makes them the two you can
              settle from the scene alone. Pinning them collapses the remaining arrangements
              sharply. What is left in the middle is where the actual judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the only
              one. An order can run on cost, on risk, or on reversibility. Reversibility puts
              every observation that leaves the sample as it was before any that consumes it. On
              those boards a chronological reading finds nothing. None of the steps has to
              happen at a particular hour.
        assumes:
          - a result should be reproducible by somebody who was not present
        takeaway: A result leaves the station as a package: the numbers, the version, and what was assumed.
        format: SEQUENCE
        cards:
          - Freeze the version of both age scales the result was computed on
          - Recompute the corrected comparison from that frozen version, from raw data
          - Write the correction, its range and the firn model it came from into the methods
          - Circulate the draft to the Skarv group before it is submitted anywhere
          - Send the report, with the archived data referenced by version
        order: [0, 1, 2, 3, 4]
        why: >-
          Each step is what makes the next one mean something. Freezing the age scales fixes what
          the result was computed on, which is the only way anybody can reproduce it later.
          Recomputing from raw data on that frozen version tests that the number in the draft is
          the number the method produces. Writing the correction and its range into the methods is
          what lets a reader disagree with it specifically. Circulating to the other group is what
          turns a disagreement about their record into a conversation with them. Then it goes.
  # ------------------------------------------------------------------ day 15
  - title: What is known, and how well
    objective: State what the season established, at what precision, and what it could not reach.
    briefing: The last day is spent deciding what the record supports and what the next season must do.
    stake: >-
      Monday, the last working day. The aircraft comes on Wednesday. The report is sent.
      Halvorsen wants the season's own account of itself. What is established. What rests on a
      model. What the next team has to do first. Brandt is closing the stake array. Tanabe has
      one question left about how fine this record can ever be. Today you settle which sentence
      the record supports. You sort what the season proved from what it assumed. And you put a
      number on the shortest event this ice could still show. What the next team believes about
      this ice is what gets written down here, this week, by you.
    takeaway: A record is worth what its limits are known to be.
    stops:
      - group: DATA
        task: Choose the sentence the record supports
        title: The sentence the record will carry
        place: Science Module
        scene: >-
          Four versions of the season's headline claim, all of them true in some sense, on Aalto's
          screen. One of them is the one the evidence actually reaches.
        guide: >-
          Four sentences, all of them true in some sense. Ask of each what it claims
          beyond what was measured here. One calls two records independent, and below
          the counts they share a flow model. One rounds until the uncertainty
          disappears. One is a claim about every record at this latitude, and nobody
          here has read them all.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be
              the answer under one specific misreading. A step skipped. A quantity confused with
              a rate. A correlation taken for a cause. Identifying which misreading each belongs
              to is where the learning is. The right answer alone can be reached on instinct and
              teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance. Before it was fixed, that was 88 per
              cent of passage quizzes here. It is now checked per game as a binomial tail.
              Length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them. Each is the reason that option fails, not a restatement of
              the right one. They are worth reading after a correct answer as well. A right
              choice made for an approximate reason is indistinguishable from a sound one. That
              holds until the day the approximation is what is being tested.
        assumes:
          - a claim is supported when the evidence would have come out differently if it were false
        takeaway: An honest claim states what was measured, over what period, with what uncertainty.
        format: CHOICE
        question: Which sentence does this season's evidence reach?
        answerText: The one that names the cooling, the period, the uncertainty and the fact that the deep dating rests on a flow model.
        choices:
          - A cooling of about 2.7 degrees, modelled below the counted section
          - A cooling of 2.7 degrees, established by 2 independent records
          - A cooling of about three degrees, consistent with the Skarv site
          - The largest cooling yet recorded at this latitude, pending the deep section
        answer: A cooling of about 2.7 degrees, modelled below the counted section
        why: >-
          The first sentence says what was measured, over what interval, and which part of it
          depends on something that was not measured here. The second calls the two records
          independent, which the shared flow model makes untrue below the counts. The third rounds
          the number until the uncertainty disappears into it and attributes agreement to a site
          whose comparison needed a correction. The fourth is a claim about every other record at
          this latitude, and nobody at this station has read them all.
        rebuttals:
          - The two records share a flow model below their counts, so "independent" is the word that fails
          - Rounding to three degrees hides the uncertainty that decides whether this differs from other sites
          - A superlative is a claim about everybody else's records, which this season did not examine
      - group: FIELD
        task: Sort established from assumed
        title: What rests on what
        place: Snow Study Hut
        scene: >-
          Brandt has the season's four headline numbers written on the hut wall and a column beside
          each one that nobody has filled in.
        guide: >-
          Four headline numbers, and four descriptions of how each was got. Pair them by
          asking how many steps sit between the instrument and the number. One is a
          direct surface measurement checkable next year. One passes through a slope
          fitted to eleven years. One is counted where counting worked and modelled
          below. And one is a solid measurement attached to a modelled date.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on boards
              like this are written to be plausible for more than one situation. Choosing them
              one at a time lets a nearly-right answer through unexamined. Having to place all
              of them forces the comparison — not "is this reasonable here", but "is it more
              right here than there".
          - >-
              How to use the one-each rule. The responses are a set to be distributed rather
              than a list to be sampled. So every join you make constrains the rest. Settling
              the two you are confident of can leave the remaining pair decided by elimination.
              Where it does not, two responses are still competing for one situation. That is
              exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once, three
              correct joins leave the fourth with only one place to go. Any error therefore
              involves at least two joins. That is worth remembering when the last pair looks
              forced. The fault is usually not in the join you are struggling with. It is in one
              you made early and stopped questioning.
        assumes:
          - a number is only as strong as the weakest step between the ice and it
        takeaway: Every number in a proxy record belongs to a class, and the class is part of the number.
        format: PROTOCOL
        columns:
          - The season's number
          - What it actually rests on
        scenarios:
          - Accumulation of 0.119 metres of ice equivalent a year
          - A cooling of 2.7 degrees in the cold interval
          - An age of 18,400 years at 2,100 metres
          - Carbon dioxide of 190 parts per million in the cold interval
        choices:
          - Measured directly at the surface, and checkable against next season's stakes
          - Measured, then converted through a slope fitted to 11 years of overlap
          - Counted as far as the layers allowed, and modelled below that
          - Measured on air that is well mixed, at a depth whose own age is modelled
        mapping: [0, 1, 2, 3]
        why: >-
          The four numbers are not the same kind of thing, and the report has to say so. The
          accumulation is a direct measurement of the surface and can be checked next year. The
          cooling is a measurement passed through a calibration, so it inherits the
          calibration's uncertainty. The age is counted where counting worked and modelled where
          it did not. The gas concentration is a solid measurement of a global quantity,
          attached to a depth whose age is itself modelled. It is strong in what it measures,
          weaker in when it happened.
        rebuttals:
          - The cooling is not a direct surface measurement; it arrives through a fitted slope
          - The age below the counted section is not checkable against next season's stakes
          - The gas concentration is well measured and its date is the modelled part of it
      - group: COLD
        task: Put a number on the finest event
        title: The shortest thing this ice can show
        place: Cold Laboratory
        scene: >-
          Tanabe has the firn diffusion length for this site and the surface layer thickness. The
          next team wants to know whether a single warm summer could ever be found in this core.
        guide: >-
          Four numbers, and one of them is a year at two thousand four hundred metres
          rather than at the surface. Ask which layer thickness the question is about.
          Diffusion smooths anything thinner than about twice the distance the molecules
          travel. Divide that limit by a year's thickness and the answer is in years. At
          the surface this site can just hold one.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is already
              measured or stated. Nothing here has to be derived. What is being tested is
              whether you can pick the quantities the relationship actually needs. Then, whether
              the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label catches a unit mismatch before it
              is placed. It also catches a quantity belonging to a different part of the
              problem. That is the habit this format exists to build.
        assumes:
          - water molecules move through firn before the pores seal, averaging nearby layers together
        takeaway: A record has a shortest event it can show, and it is set by the site rather than by the instrument.
        format: BALLPARK
        question: Estimate the shortest event this record could still resolve, in years.
        answerText: About 1.3 years at the surface, and longer at every depth below it as the layers thin.
        why: >-
          Water molecules diffuse through the connected pores of the firn for as long as those
          pores are open. That averages each layer with its neighbours. The scale of that
          averaging is the diffusion length, and anything thinner than about twice it is
          smoothed away past recovery. Dividing that limit by the annual layer thickness gives
          the answer in years. At the surface this site can just about hold a single year.
          Deeper, where the layers have thinned, the same diffusion length covers many years.
          The annual signal is then gone for good.
        estimate:
          prompt: The firn diffusion length at this site is 0.08 metres, and a year at the surface is 0.119 metres of ice equivalent.
          question: Estimate the shortest event the isotope record could still resolve.
          relationship: shortest event = 2σ ÷ λ — twice the diffusion length, divided by the thickness of 1 annual layer.
          labels:
            - 0.08 m  (diffusion length)
            - 2  (the factor below which a feature is lost)
            - 0.119 m/yr  (a year at the surface)
            - 0.0241 m/yr  (a year at 2,400 metres)
          values: [0.08, 2, 0.119, 0.0241]
          slots: 3
          template: '{1} × {0} ÷ {2}'
          formula: b*a/c
          correct: [0, 1, 2]
          target: 1.34
          tolerance: 0.2
          units: years
          solution: 2 × 0.08 ÷ 0.119 = 1.34 years.
          explanation: Using the deep layer thickness instead would answer a different question — the resolution at 2,400 metres, which is nearly 7 years.

# What is inside each room the player walks into.
interiors:
  DRILL:
    caption: Three kilometres of hole, and one attempt at every metre of it.
    standLine: Run 214 on the barrel, 2,410 m. Brittle zone cleared, fluid due a change.
    station:
      kind: panel
      title: Winch and hole
      rows:
        - { label: Depth, value: 2410 m, status: normal }
        - { label: Cable tension, value: 11.4 kN, status: normal }
        - { label: Fluid return temperature, value: −31 °C, status: normal }
        - { label: Days of drilling left, value: '9', status: low }
  CORE:
    caption: A metre of ice is a decade here, and it is only worth that while its depth is known.
    standLine: Section 1,642.10–1,643.05 m. Sulphate spike and glass shards, logged, not yet cut.
    station:
      kind: panel
      title: Core line log
      rows:
        - { label: Section, value: '1,642.10 m', status: normal }
        - { label: Layer thickness here, value: 21 mm, status: low }
        - { label: Counted to, value: '1,180 m', status: normal }
        - { label: Breaks in this run, value: '3', status: high }
  COLD:
    caption: Every sample is melted once, and everything that touched it is written down first.
    standLine: 16 samples queued. Blank clean, opening standard within 0.03 per mil.
    station:
      kind: panel
      title: Isotope line
      rows:
        - { label: Laboratory temperature, value: −25 °C, status: normal }
        - { label: 'Standard, last run', value: '−0.02 ‰ from nominal', status: normal }
        - { label: Blank, value: at the usual level, status: normal }
        - { label: Samples queued, value: '16', status: high }
  GAS:
    caption: Air that stopped moving 450 years after the snow around it fell.
    standLine: Extraction vessel loaded, 1,642 m. Line tested against standard gas at 0740.
    station:
      kind: panel
      title: Extraction line
      rows:
        - { label: Vessel pressure, value: 4.1e-3 mbar, status: normal }
        - { label: Line blank, value: '0.6 ppm', status: normal }
        - { label: Sample depth, value: '1,642 m', status: normal }
        - { label: Age difference applied, value: '458 yr', status: high }
  FIELD:
    caption: The only part of this record anybody can still watch being made.
    standLine: 48 stakes, read this morning. Pit wall photographed to 1.4 m.
    station:
      kind: panel
      title: Mast and stake array
      rows:
        - { label: Air temperature, value: −41 °C, status: normal }
        - { label: Wind, value: 14 m/s, status: high }
        - { label: Stakes read today, value: '48 of 48', status: normal }
        - { label: Array mean gain, value: 4 mm, status: normal }
  DATA:
    caption: What the season can say out loud, and with how much of a margin.
    standLine: Season report closes Monday. Two records on the screen and one paragraph unwritten.
    station:
      kind: panel
      title: Records
      rows:
        - { label: Age scale version, value: 'v11, frozen', status: normal }
        - { label: Difference after correction, value: '0.15 ‰', status: normal }
        - { label: Stated uncertainty, value: '±0.28 ‰', status: normal }
        - { label: Days to the aircraft, value: '2', status: high }

# --------------------------------------------------------------- the warm-ups
warmups:
  greet:
    title: Fourteen people, one season, and the aircraft leaves on Wednesday
    why: >-
      The camp is fourteen people who will be within fifty metres of each other for six weeks,
      and half of them arrived on the last flight. Halvorsen, the chief scientist, wants as many
      of them known to you as you can manage before the drill turns, because on a plateau the
      only thing you cannot fix later is a working relationship.
  trial-near:
    title: Walk the camp while the weather is holding
    why: >-
      Modules on legs, flag lines between them, and a trench under the drill tower. Walk it all
      once now, in clear air, because the next time you cross the camp in a hurry it will be in
      blowing snow where the flag lines are the only thing telling you where the next module is.
  follow:
    title: Lindqvist walks the drill floor round once
    why: >-
      The drill has a rhythm and it is not written down anywhere: which valve is checked at
      which point in the run, which noise means the barrel is loading. Lindqvist, the drill
      engineer, walks it once. Stay with him and stay out of the winch path, which is the one
      part of this camp that will not stop for you.
  hunt:
    title: Six core boxes on the manifest, four in the trench
    item: { name: core box, plural: core boxes }
    why: >-
      The aircraft takes what is boxed and labelled, and two boxes from last week are not where
      the manifest says. Until they are found nobody can say what is flying out and what is
      staying another year, and ice that stays another year is ice with another year's
      temperature history on it.
  canvass:
    title: Who actually heard the generator stop
    why: >-
      The number two generator stopped some time in the night and the log says nothing about it.
      How long the core store was without power decides what the season can claim. Ask round the
      camp until enough accounts agree on when the lights flickered.
  evade:
    title: The film crew who want you in shot
    why: >-
      There is a documentary team on the plateau this week and they want somebody standing at
      the drill looking thoughtful. The core comes up whether or not anybody is filming it, and
      a section that sits at the wrong temperature while somebody adjusts a light is a section
      nobody can use. Keep out of shot.
  tag:
    title: Catch Okonkwo before she goes into the counting room
    why: >-
      Okonkwo, the chronology lead, has the layer count for the brittle section, and it is the
      only thing that puts today's depths on a year scale. Once she is in the counting room with
      the lights down she is not interrupted for anybody, and every date this afternoon rests on
      that count.

copy:
  DRILL: <p>The drill trench, roofed and dug into the snow, with the tower over the hole and the winch drum turning slowly. Everything here is one attempt.</p>
  CORE: <p>The core line: a long lit bench where every metre is measured, logged and cut in the order it came out of the ground.</p>
  COLD: <p>The cold laboratory at minus 25, where samples are melted exactly once and nobody stays longer than an hour.</p>
  GAS: <p>The gas laboratory, a vacuum line with 14 fittings and a rule about each 1. What comes off the ice here is old air.</p>
  FIELD: <p>The snow study hut, and the mast and stake array beyond it. The only measurements on this station that can be checked against the thing they measure.</p>
  DATA: <p>The science module: screens, the season's records, and the argument about what they support.</p>

# --------------------------------------------------------------------- reviews
#
# Unattached lessons. A callback day reaches a "— Review" variant by title, so
# these are the spaced-retrieval half of the campaign rather than spares: from
# day 3 every day wants one, and `shapeMissions` only adds a callback where the
# oldest taught lesson has a variant nobody has been served yet. Each of these
# is the idea of its base stop on a case the player has not seen.
lessons:
  - group: FIELD
    title: How thick a year is here — Review
    task: Put a second pit on the same axis as the first
    concept: Resolution against record length — what choosing a site decides
    place: Snow Study Hut
    scene: >-
      The field glaciologist, Nadia Brandt, is back from the flank camp forty kilometres
      downslope with a pit wall of her own. The last summer surface there sits seventy-one
      centimetres down, and the snow above it is denser than anything on the dome.
    guide: >-
      Five numbers, and only three of them describe the flank pit. Ask of each whether it says
      something about that snow as it lies. The close-off depth and the dome's own
      ice-equivalent figure are on the board so the two sites can be compared afterwards. They
      do not go into the sum. The conversion is the one you ran on the dome, on a site that is
      not the dome.
    background:
      - >-
          Why an estimate rather than a calculation. Every quantity on this board is already
          measured or stated. Nothing here has to be derived. What is being tested is whether
          you can pick the quantities the relationship actually needs. Then, whether the size of
          the answer looks right once they are in place.
      - >-
          Why the tiles carry labels. A bare number cannot be checked against the relationship
          it is going into. Reading the label catches a unit mismatch before it is placed. It
          also catches a quantity belonging to a different part of the problem. That is the
          habit this format exists to build.
    takesAsRead:
      - Accumulation rate, and what a site with little snow buys and costs
    assumes:
      - snow becomes ice by being compressed under the snow that falls on it
    takeaway: A wetter site writes finer layers and runs out sooner, and ice equivalent is what shows the trade.
    format: BALLPARK
    question: Estimate the flank camp's accumulation in ice equivalent.
    answerText: About 0.30 metres of ice equivalent a year — roughly two and a half times what the dome lays down.
    why: >-
      Choosing a site is choosing between the detail a core carries and the span it covers. That
      trade only becomes visible once both sites are stated in the ice their snow will become.
      The flank camp catches more than twice the snow and lays it down denser. So its layers
      stay thick enough to count far deeper than the dome's. It pays at the bottom. The same
      three kilometres of ice is spent in a third of the time. The oldest year in it is a few
      thousand rather than tens of thousands.
    estimate:
      prompt: The last summer surface at the flank camp sits 0.71 metres down, in snow of density 385 kilograms per cubic metre.
      question: Estimate the flank camp's accumulation in metres of ice equivalent.
      relationship: b = λ × ρ_snow ÷ ρ_ice — the snow layer λ scaled by the ratio of its own density to the density of solid ice.
      labels:
        - 0.71 m  (the flank camp's snow layer)
        - 385 kg/m³  (density of that snow)
        - 917 kg/m³  (density of solid ice)
        - 88 m  (close-off depth on the dome)
        - 0.119 m/yr  (the dome's own accumulation in ice equivalent)
      values: [0.71, 385, 917, 88, 0.119]
      slots: 3
      template: '{0} × {1} ÷ {2}'
      formula: a*b/c
      correct: [0, 1, 2]
      target: 0.298
      tolerance: 0.03
      units: m ice equivalent per year
      solution: 0.71 × 385 ÷ 917 = 0.298 m of ice equivalent.
      explanation: The close-off depth and the dome's own rate are the tiles that do not belong: both are answers to other questions, and neither describes the snow in this pit.

  - group: DRILL
    title: The run through the brittle zone — Review
    task: Order the work on a section that cannot be drilled again
    concept: "Drilling: fluid, brittle ice and what damage costs the record"
    place: Core Line
    scene: >-
      The core line technician, Sigrid Holt, has a section from 1,150 metres on the light table.
      Four teams are down on the request sheet for a piece of it. Nothing on the sheet says
      which of them goes first.
    guide: >-
      Five operations, all of which will happen to this section. Nothing here has to happen at a
      particular hour, so reading the rail as a timetable finds nothing. Ask of each how much of
      the section it spends. Whether it could be done again next season. Whether it leaves the
      inner core whole. Or whether the ice is gone once it is finished.
    background:
      - >-
          Why the order is graded whole. A sequence is a claim about dependency. Each step is
          here because the one before it has already happened, or has to have. One transposed
          pair falsifies that claim wherever it sits. Partial credit would be credit for a
          sequence that does not work.
      - >-
          Why the ends are the place to start. The first and last cards are constrained by
          having nothing before or after them. That usually makes them the two you can settle
          from the scene alone. Pinning them collapses the remaining arrangements sharply. What
          is left in the middle is where the actual judgement lives.
      - >-
          What the rail can be ordered on. Time is the usual axis, but it is not the only one.
          An order can run on cost, on risk, or on reversibility. Reversibility puts every
          observation that leaves the sample as it was before any that consumes it. On those
          boards a chronological reading finds nothing. None of the steps has to happen at a
          particular hour.
    takesAsRead:
      - "Why ice keeps a record at all: burial without melting"
    assumes:
      - a length of ice removed from a core cannot be put back
    takeaway: Where a sample cannot be replaced, the order of work is set by what each step spends.
    format: SEQUENCE
    cards:
      - Photograph the whole section on the light table, which touches nothing and can be repeated
      - Log the breaks and read the density along its length with the non-contact scanner
      - Take the outer trim for chemistry, leaving the inner core whole
      - Cut the inner core into sample lengths and melt them for the isotope run
      - Crush what is left of the ice under vacuum to release the trapped air
    order: [0, 1, 2, 3, 4]
    axis: Order the five operations by how much of the section each one spends, from the one that leaves it exactly as it arrived to the one that ends it. Nothing here has to happen at a particular hour.
    ends: [Leaves the ice as it arrived, Ends the section]
    why: >-
      Ice gets one reading. So the order of work on a section is decided by what each operation
      costs, rather than by when anybody wants it. A photograph can be taken again next season.
      A non-contact scan reads the outside and leaves everything. A trim gives up the skin that
      handling and drill fluid have already reached, and keeps the core. A melt turns a length
      of ice into a number and nothing else, and a crush ends the section. Run that order
      backwards and no time is lost — the measurements the earlier steps would have made are.

  - group: COLD
    title: The sample that was clean until it was handled — Review
    task: Say what a quiet control has established
    concept: Contamination and blanks in a cold laboratory
    place: Cold Laboratory
    scene: >-
      The cold laboratory technician, Elena Cruz, has a calcium result twice the runs either
      side of it. Both blanks are ordinary and the outer centimetre was trimmed to
      specification. The replicate core from the second hole doubles at the same depth.
    guide: >-
      Four readings of one panel, and the argument turns on what a control that did not move is
      worth. Ask of each option which reading it would need to have gone the other way. A blank
      is the process with no ice in it. So an ordinary blank speaks for everything the sample
      touched. A second hole speaks for everything this hole did.
    background:
      - >-
          Why the wrong options are the interesting ones. Each distractor is written to be the
          answer under one specific misreading. A step skipped. A quantity confused with a rate.
          A correlation taken for a cause. Identifying which misreading each belongs to is where
          the learning is. The right answer alone can be reached on instinct and teach nothing.
      - >-
          Why a clean control is a result. A reading that stays where it always sits is easy to
          skip past. It is the only kind of reading that can rule a mechanism out. The loud
          number is consistent with several explanations at once; the quiet ones are consistent
          with fewer, which is what makes them decisive.
      - >-
          What the verdict adds. Every wrong option carries its own rebuttal, and the verdict
          prints them. Each is the reason that option fails, not a restatement of the right one.
          They are worth reading after a correct answer as well. A right choice made for an
          approximate reason is indistinguishable from a sound one. That holds until the day the
          approximation is what is being tested.
    takesAsRead:
      - "What a proxy is: the chain between the thing and the number"
    assumes:
      - a blank is run through the same process as a sample, with no sample in it
    takeaway: A control that did not move is a measurement, not the absence of one.
    format: CHOICE
    question: What does this panel support?
    answerText: The doubling belongs to the ice: every control that would have moved for a laboratory source stayed where it always sits.
    choices:
      - The doubling is in the ice, since the controls that would have moved did not
      - The doubling is contamination the blanks are not sensitive enough to have caught at this level
      - The doubling arrived at the cutting bench, which both of these sections passed over before melting
      - Nothing can be concluded until a third hole has been drilled and sampled at the same depth
    answer: The doubling is in the ice, since the controls that would have moved did not
    why: >-
      A blank is the process with no ice in it. So an ordinary blank is a positive statement
      about everything the sample touched on the way to the instrument. The saw, the gloves, the
      vials, the acid. Both of them are ordinary. The outer centimetre was trimmed, so the
      surface handling is out as well. What is left is a second core, recovered from a different
      hole, doubling at the same depth. Two independent recoveries agreeing on a number is the
      ice speaking, and the quiet readings are what allow it to be heard.
    rebuttals:
      - A blank that catches sodium at a tenth of this level is not blind to calcium at twice it
      - The bench is inside what a blank measures, and both blanks came back at the usual level
      - A third hole would add a recovery, and two independent ones already rule out the process

  - group: CORE
    title: What makes one year different from the next — Review
    task: Attribute four features on a deeper section
    concept: Annual layer counting, and where counting fails
    place: Core Line
    scene: >-
      The chronology lead, Ines Okonkwo, has a metre from 540 metres on the light table. It is
      deeper than anything counted this week. Four features on it have to be attributed before
      the section is released to the teams.
    guide: >-
      Four features and four things that could have made them. Pair them by asking two questions
      of each. What the feature is physically made of. And how long whatever made it went on
      for. An eruption lasts a season or two. A shift in the weather lasts decades. A surface
      lasts a summer. Only one of these four repeats on a yearly beat, and that is the one a
      count can be built on.
    background:
      - >-
          Why this is a matching board and not four separate questions. Responses on boards like
          this are written to be plausible for more than one situation. Choosing them one at a
          time lets a nearly-right answer through unexamined. Having to place all of them forces
          the comparison — not "is this reasonable here", but "is it more right here than
          there".
      - >-
          How to use the one-each rule. The responses are a set to be distributed rather than a
          list to be sampled. So every join you make constrains the rest. Settling the two you
          are confident of can leave the remaining pair decided by elimination. Where it does
          not, two responses are still competing for one situation. That is exactly the
          distinction the stop is testing.
      - >-
          Why you cannot be wrong about exactly one. With every response used once, three
          correct joins leave the fourth with only one place to go. Any error therefore involves
          at least two joins. That is worth remembering when the last pair looks forced. The
          fault is usually not in the join you are struggling with. It is in one you made early
          and stopped questioning.
    assumes:
      - a feature in the ice was put there by something with a duration of its own
    takeaway: A feature is a year only where whatever made it repeats every year.
    format: PROTOCOL
    columns:
      - What is in the ice
      - What put it there
    scenarios:
      - Two sulphate spikes four centimetres apart
      - A steady rise and fall in sodium across thirty centimetres
      - A single band of coarse crystals with large bubbles in it
      - A run of a dozen evenly spaced light and dark bands
    choices:
      - Two eruptions a few years apart, each laying down its acid and then stopping
      - A stormier stretch of winters driving marine air inland for a decade or so
      - A summer surface that sat exposed long enough for its crystals to grow before burial
      - Successive years, each compressed by about the same amount on its way down
    mapping: [0, 1, 2, 3]
    why: >-
      Attribution is the step before counting. It runs on what a feature is made of, and how
      long the thing that made it lasted. Acid arrives with an eruption and stops when the
      eruption does, so a pair of spikes is two events rather than two years. Sea salt is
      delivered by weather that shifts over decades. Coarse crystals with large bubbles are one
      surface that sat in the sun. Only the even banding is compression repeating on a yearly
      beat, and only that one can be counted.
    rebuttals:
      - Sodium is carried in by weather rather than laid down by an eruption, and weather does not stop after a season
      - A decade of stormier winters is a slow rise and fall, not a band of grown crystals
      - Repeated banding is compression happening again and again, which no single exposed surface can produce

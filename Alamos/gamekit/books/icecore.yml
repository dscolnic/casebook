# Ice Core — Vestri Dome, and the season that had to decide what it had found.
#
# Written to gamekit/tools/BOOK_TEMPLATE.md. The place is themes/icecore/site.js;
# the plan it came from is in ../GAME_IDEAS.md under "Ice Core".
#
# The argument: Marit Halvorsen holds that a disagreement kept quiet is a
# decision made for everybody else, and the assessment closes in March. Ines
# Okonkwo holds that two records on different clocks cannot disagree about
# anything yet. Halvorsen is right on day 4. Okonkwo is right on day 11.

theme:
  id: icecore
  title: Ice Core
  subtitle: Season Science Lead · Vestri Dome

groups:
  - id: DRILL
    code: DRILL
    name: Drilling & Recovery
    color: '#2f6f9f'
    desc: Getting ice out of a hole three kilometres deep without changing what it says.
    defaultLeader: lindqvist
    milestones: [Read the run sheet, Get the core up whole, Log what came back, Ready to hand over]
  - id: CORE
    code: CORE
    name: Chronology & the Core Line
    color: '#7a4fa3'
    desc: What is a year, how it is counted, and what the counting is worth at depth.
    defaultLeader: okonkwo
    milestones: [Log the section, Count the layers, Fix the depth, Ready to hand over]
  - id: COLD
    code: COLD
    name: Cold Laboratory
    color: '#1f7a6b'
    desc: Melting a sample without adding to it, and turning a ratio into a temperature.
    defaultLeader: tanabe
    milestones: [Prepare the sample, Run the standard, Read the ratio, Ready to hand over]
  - id: GAS
    code: GAS
    name: Trapped Gas
    color: '#b3462f'
    desc: Air that stopped moving centuries after the snow around it fell.
    defaultLeader: adeyemi
    milestones: [Cut the sample, Extract the air, Compare the record, Ready to hand over]
  - id: FIELD
    code: FIELD
    name: Surface & Accumulation
    color: '#b0762a'
    desc: What the surface is doing now, which is the only part anybody can check.
    defaultLeader: brandt
    milestones: [Read the mast, Dig the pit, Weigh the year, Ready to hand over]
  - id: DATA
    code: DATA
    name: Records & Reporting
    color: '#5b6a72'
    desc: What the season can say out loud, and with how much of a margin.
    defaultLeader: halvorsen
    milestones: [Assemble the record, State the uncertainty, Agree the wording, Ready to hand over]

roster:
  - id: halvorsen
    name: Marit Halvorsen
    role: Chief Scientist
    division: DATA
    bio: |
      Runs the season, which mostly means deciding what the season is allowed to
      claim. She has spent 11 years on this plateau and reads a record the
      way an auditor reads a ledger: not for what it says, for what it would
      take to make it say something else.

      Her position on the Skarv disagreement is that a result held back is a
      result somebody else makes for you. The assessment that will quote both
      records closes in March, and a silence in March is a decision.

      Her limit is the same as her strength. She is fastest at deciding what a
      number means, and the fastest reading of a number is the one that assumes
      the other people measured it the way she would have.
    quiz:
      - q: Why does Halvorsen treat staying quiet until next season as a decision rather than a delay?
        a: The March assessment quotes whatever is published by then
        wrong:
          - Station funding is reviewed on how many papers come out of each season on the ice
          - A record that is not published within a year cannot be published at all
          - The Skarv group has asked for a response and is owed one
  - id: okonkwo
    name: Ines Okonkwo
    role: Chronology Lead
    division: CORE
    bio: |
      Owns the depth–age scale, which is the sentence every other result in the
      station ends with. She counts layers, ties them to dated ash, and writes
      down how wrong each stretch could be.

      Her position on Skarv is not caution for its own sake. Two records cannot
      disagree until they are on one clock, and she has not finished putting
      them on one. Announcing a difference between two timescales is announcing
      something about the timescales.

      Her limit is that counting has an end. Below about 2000 metres the
      layers are thinner than anything she can resolve, and from there the ages
      come from a flow model she did not build and cannot check.
    quiz:
      - q: Why will Okonkwo not call the difference between the two records a disagreement yet?
        a: On two timescales, a difference could belong to the dating
        wrong:
          - The Skarv core has not been measured on the same mass spectrometer
          - A difference is only real once it exceeds three standard deviations
          - The two cores were drilled in different years, which makes them incomparable in principle
  - id: lindqvist
    name: Pär Lindqvist
    role: Drill Engineer
    division: DRILL
    bio: |
      22 seasons on deep drills, and he can tell from the winch load
      what the hole is doing 800 metres down. The drill is a
      three-tonne instrument that gets one attempt per run.

      He runs the brittle zone slowly and refuses to be hurried through it. Ice
      between 500 and 1,200 metres holds bubbles at pressures
      the surface cannot support, and a core brought up fast comes up as gravel.

      His limit is that he cannot see anything. Everything he knows about the
      hole arrives as tension on a cable and the temperature of returning fluid.
    quiz:
      - q: Why does Lindqvist slow the winch through the brittle zone?
        a: The bubbles are at a pressure the surface cannot hold
        wrong:
          - The drill fluid freezes onto the barrel if it is raised too quickly
          - Cable tension readings become unreliable above a certain speed
          - The winch motor overheats on a continuous lift from that depth and has to be rested
  - id: tanabe
    name: Yuki Tanabe
    role: Isotope Chemist
    division: COLD
    bio: |
      Runs the cold laboratory at minus 25, where every sample is
      melted exactly once and everything that touches it has been accounted for
      first. She measures ratios that differ in the fourth decimal place.

      She runs a standard between every eighth sample, which everybody agrees
      with in principle and resents in practice, because the instrument drifts
      and drift is invisible from inside a run.

      Her limit is that she measures water, not weather. Turning a ratio into a
      temperature needs a slope, and the slope is somebody's measurement of a
      relationship that has not held perfectly for the whole record.
    quiz:
      - q: Why does Tanabe run a standard between every eighth sample?
        a: Only a known sample can reveal drift while it happens
        wrong:
          - The instrument must be re-zeroed after a fixed number of runs to stay in specification
          - Samples measured late in a run are colder than those measured early
          - It gives the run an even number of measurements for averaging
  - id: adeyemi
    name: Samuel Adeyemi
    role: Gas Geochemist
    division: GAS
    bio: |
      Cuts ice, puts it in a vessel, evacuates the vessel and melts the ice, and
      what comes off is air that last touched the atmosphere a long time ago. He
      has been doing it for nine years and still calls it unreasonable.

      He is the reason the station argues about age twice: the ice around a
      bubble and the air inside it are not the same age, and at a dry site like
      this one the difference runs to centuries rather than decades.

      His limit is sample size. A gas measurement destroys the ice it was made
      on, so every question he answers is one somebody else cannot ask again.
    quiz:
      - q: Why does Adeyemi insist the ice and the air inside it are dated separately?
        a: Air keeps moving through the snowpack until the pores seal
        wrong:
          - Gas measurements are made on a different instrument from the ice ones
          - Bubbles migrate slowly upward through the ice over thousands of years, arriving young
          - The extraction line adds a delay that has to be subtracted afterwards
  - id: brandt
    name: Nadia Brandt
    role: Field Glaciologist
    division: FIELD
    bio: |
      Responsible for everything above the surface: the stake farm, the mast,
      the snow pits, and the only measurements in the station that can be
      checked against the thing they are measuring.

      She digs a pit every fortnight and photographs the wall, because the
      surface is where the record is made and it is the one part of it anybody
      can still watch happening.

      Her limit is wind. The plateau moves snow sideways, so a stake that gained
      a centimetre may be reporting the weather or the drift, and the difference
      takes a season of stakes to see.
    quiz:
      - q: Why does one stake gaining snow tell Brandt so little on its own?
        a: Wind moves snow, so a gain here is a loss elsewhere
        wrong:
          - A single stake cannot be levelled accurately enough to trust
          - Snow settles under its own weight faster than new snow arrives to replace it
          - Stakes have to be read at the same time of day to be comparable
  - id: ekwueme
    name: Tom Ekwueme
    role: Drill Assistant
    division: DRILL
    bio: |
      Second on the drill, which means he handles every core that comes up and
      writes the run sheet while Lindqvist watches the cable. He has recorded
      every break and every short run this season.
    quiz:
      - q: What does Ekwueme's run sheet let the chronology team do that the core itself cannot?
        a: It says which sections came up short of their full length
        wrong:
          - It records the drill fluid temperature for every run made through the season
          - It proves the core was handled within the required window
          - It gives the winch speed that produced the cleanest breaks
  - id: holt
    name: Sigrid Holt
    role: Core Line Technician
    division: CORE
    bio: |
      Logs, measures and cuts every metre that comes off the drill, in the order
      it arrives and never out of it. She has seen the whole core and almost
      nobody else has.
    quiz:
      - q: Why does Holt refuse to let a section be cut before it is logged?
        a: After cutting, a feature's depth survives only on the label
        wrong:
          - Cutting warms the ice and releases some of the trapped gas
          - The saw blade needs the logged section length before it can set its cutting depth
          - Logging after cutting takes twice as long for the same information
  - id: cruz
    name: Elena Cruz
    role: Cold Laboratory Technician
    division: COLD
    bio: |-
      Prepares the samples for the isotope line: cuts the outer centimetre off every
      piece, weighs it, logs it, and runs the blanks nobody else volunteers for.

      The blanks are the part she will not skip. A season's worth of results rests on
      knowing what the process contributes when there is no ice in it, and that number
      is only known if somebody keeps measuring nothing.
    quiz:
      - q: Why does Cruz cut the outer centimetre off every sample?
        a: The outside has touched the drill and the bench; the inside has not
        wrong:
          - The outer ice sublimates during storage and reads too heavy
          - Cutting every sample to a standard size is what makes the melt times comparable
          - The outer layer is where fractures concentrate during the lift
  - id: menon
    name: Ravi Menon
    role: Gas Laboratory Technician
    division: GAS
    bio: |
      Runs the extraction line, which is a vacuum system with 14 fittings
      and a rule about every one of them. He tests the line against a standard
      gas before any sample is cut.
    quiz:
      - q: Why does Menon run a standard gas through the line before cutting a sample?
        a: A leak arrives as modern air, which reads as a result
        wrong:
          - The line has to be brought to the same temperature as the sample
          - Standard gas removes water vapour left over from the previous run
          - It confirms that the line's 14 pressure gauges agree with each other first
  - id: devries
    name: Anneke de Vries
    role: Camp Manager
    division: FIELD
    bio: |
      Fuel, flights, generators and food, in that order. Every scientific
      decision on this station is a decision about drums of fuel, and she is the
      one who has to say so out loud.
    quiz:
      - q: Why does de Vries need the science plan a fortnight before the aircraft window?
        a: Fuel and flight weight are committed before the plane leaves
        wrong:
          - The pilots require a full manifest of every sample being flown off the plateau
          - The generators must be serviced before the last resupply lands
          - Weather forecasts are only reliable at two weeks' range
  - id: aalto
    name: Jonas Aalto
    role: Data Manager
    division: DATA
    bio: |
      Keeps the station's records, which means he is the only person who can say
      what version of anything anybody is arguing about. Every dataset here has
      a date on it and half of them have two.
    quiz:
      - q: Why does Aalto version every dataset rather than replacing it?
        a: A result was reached on one version and belongs to it
        wrong:
          - Station policy requires every record to be retained for ten years after the season
          - Older versions are needed to recover from a disk failure
          - Two people cannot edit the same file at the same time

glossary:
  - name: Accumulation
    aliases: [accumulate, accumulates, accumulated]
    def: How much snow is added to the surface in a year, after wind and sublimation have had their say.
  - name: Ice equivalent
    aliases: [water equivalent]
    def: A snow thickness converted to the thickness of solid ice it will become, so two sites can be compared.
  - name: Annual layer
    aliases: [annual layers, layer counting, layer count]
    def: One year of snowfall, recognisable in the core because summer and winter snow differ.
  - name: Ice
    aliases: []
    def: Snow compressed until the air between its grains is sealed off, at about 917 kilograms per cubic metre.
  - name: Calibration
    aliases: [calibrate, calibrated, calibration slope]
    def: Measuring an instrument or a relationship against something already known, so its numbers can be trusted.
  - name: Firn
    aliases: [firn column]
    def: The layer of snow between the surface and solid ice, still open enough for air to move through it.
  - name: Close-off depth
    aliases: [close-off, closes off, closed off]
    def: The depth where firn stops letting air through, 60 to 100 metres down, and the trapped air becomes separate bubbles.
  - name: Delta age
    aliases: [Δage, gas age, ice age difference]
    def: The difference between the age of a bubble's air and the age of the ice around it, because the air kept moving until close-off.
  - name: Proxy
    aliases: [proxies]
    def: Something measurable that stands in for something that was not measured, through a chain somebody has to be able to state.
  - name: Isotope ratio
    aliases: [delta-18, oxygen-18, deuterium, isotopic]
    def: How much heavy oxygen or hydrogen the ice holds compared with ocean water, reported as a difference in parts per thousand.
  - name: Thinning
    aliases: [thinned, thins]
    def: The stretching of every layer as the ice sheet spreads under its own weight, so old layers are thinner than they fell.
  - name: Depth-age scale
    aliases: [depth–age, age scale, timescale]
    def: The table that turns a depth in the core into a year, built by counting layers and anchored to dated events.
  - name: Tie point
    aliases: [tie points, tied to]
    def: An event of known date found in two records, which fixes them to each other at that moment.
  - name: Sulphate horizon
    aliases: [sulphate, sulfate, volcanic horizon]
    def: A thin band of volcanic sulphur in the ice, laid down within a year or two of a known eruption.
  - name: Tephra
    aliases: [ash layer]
    def: Volcanic glass shards in the ice, which can be chemically matched to the volcano that produced them.
  - name: Diffusion length
    aliases: [diffusion, diffuses]
    def: How far a water molecule wanders in the firn before the ice seals, which smooths away anything thinner than about twice that distance.
  - name: Brittle ice
    aliases: [brittle zone]
    def: The depth range where trapped bubbles are at high pressure and the core fractures as it is brought up.
  - name: Blank
    aliases: [blank run, blanks]
    def: A run with no sample in it. Anything it shows was added by the process rather than measured from the ice.
  - name: Chain of custody
    aliases: [custody]
    def: The unbroken written record of who held a sample and when, which is what makes a measurement attributable to a depth.
  - name: Radiative forcing
    aliases: [forcing]
    def: The change in the energy balance at the top of the atmosphere caused by a change in a greenhouse gas, in watts per square metre.
  - name: Standard error
    aliases: [standard errors]
    def: How far an average is expected to sit from the truth, given the scatter in the data and how many years went into it.
  - name: Replicate core
    aliases: [replicate, replicates]
    def: A second core drilled nearby, so a feature can be checked against ice that shared the weather but not the drill.

missions:
  # ------------------------------------------------------------------ day 1
  - title: What the plateau has been writing down
    objective: Establish what this site records, how fast it records it, and why anybody drilled here.
    briefing: A new season opens on a core that is already 2000 metres deep.
    stake: >-
      First morning of the season. The drill has not turned yet. The field glaciologist, Nadia
      Brandt, has a fortnight of stake readings and a fresh pit wall. The chief scientist, Marit
      Halvorsen, wants this season's accumulation figure. She wants it before the science plan
      is written. Accumulation is how much snow the surface adds in a year. Today you settle
      what this site records, how much of a year the surface adds, and why the hole was put
      here. It could have gone 40 kilometres downslope instead. Get the accumulation wrong and
      every age below it comes out wrong as well. All of them wrong in the same direction, and
      nothing in the core shows the mistake. Three kilometres of ice, dated wrong.
    takeaway: A record is only as good as the rate at which it was written.
    stops:
      - group: FIELD
        task: Turn a fortnight of snow into a year of record
        title: How thick a year is here
        place: Snow Study Hut
        scene: >-
          Brandt has the pit wall photographed and the last summer surface marked at 32 centimetres
          down. The snow above it weighs a third of what the same thickness of solid ice would.
        guide: >-
          Five numbers, and two of them belong elsewhere: the density of liquid water,
          and the days of stake readings. Ask of each whether the conversion needs it.
          Snow and ice are the same material at different densities, so a thickness of
          snow is not a thickness of record. Only ice equivalent lets two sites be
          compared, and this site gets a tenth of what a coastal one does.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is already
              measured or stated. Nothing here has to be derived. What is being tested is
              whether you can pick the quantities the relationship actually needs. Then, whether
              the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label catches a unit mismatch before it
              is placed. It also catches a quantity belonging to a different part of the
              problem. That is the habit this format exists to build.
        takesAsRead:
          - Accumulation rate, and what a site with little snow buys and costs
        assumes:
          - snow becomes ice by being compressed under the snow that falls on it
        takeaway: An accumulation rate means nothing until it is stated as the ice it will become.
        format: BALLPARK
        question: Estimate this year's accumulation in ice equivalent.
        answerText: About 0.12 metres of ice equivalent — a third of the snow thickness, because the snow is a third as dense.
        why: >-
          Snow and ice are the same material at different densities, so a thickness of snow is
          not a thickness of record. Multiplying the layer by the ratio of the two densities
          converts it to the ice it will become once the air is squeezed out. That is the only
          form in which two sites can be compared. Vestri gets about 12 centimetres a year in
          ice equivalent. A coastal site gets a metre. That difference decides everything
          downstream. How far back the core reaches. How thin the layers get. And how much older
          the ice is than its own trapped air.
        estimate:
          prompt: The last summer surface sits 32 centimetres below this year's, in snow of density 340 kilograms per cubic metre.
          question: Estimate this year's accumulation in metres of ice equivalent.
          relationship: b = λ × ρ_snow ÷ ρ_ice — the snow layer λ scaled by the ratio of its own density to the density of solid ice.
          labels:
            - 0.32 m  (this year's snow layer)
            - 340 kg/m³  (density of the snow)
            - 917 kg/m³  (density of solid ice)
            - 1000 kg/m³  (density of liquid water)
            - 14  (days of stake readings)
          values: [0.32, 340, 917, 1000, 14]
          slots: 3
          template: '{0} × {1} ÷ {2}'
          formula: a*b/c
          correct: [0, 1, 2]
          target: 0.119
          tolerance: 0.012
          units: m ice equivalent per year
          solution: 0.32 × 340 ÷ 917 = 0.119 m of ice equivalent.
          explanation: The water density is the tile that does not belong: the conversion is snow to ice, and liquid water is never part of this record.
      - group: DRILL
        task: Say what the site was chosen for
        title: Why the hole is on the dome
        place: Drill Trench
        scene: >-
          The drill engineer, Pär Lindqvist, has the hole at 2,040 metres. On the wall is a map
          with 3 abandoned sites on it, all of them on slopes. Vestri Dome is the high point for
          200 kilometres.
        guide: >-
          Four things a dome might buy, and three of them are about the ice being cold,
          thick or flat. Ask of each whether it is about where the ice came from. An ice
          sheet flows outward from its high points. On a slope the ice at a given depth
          arrived from upstream, so the record mixes one place's weather with a journey.
          Domes pay for that in thin layers.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be
              the answer under one specific misreading. A step skipped. A quantity confused with
              a rate. A correlation taken for a cause. Identifying which misreading each belongs
              to is where the learning is. The right answer alone can be reached on instinct and
              teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance. Before it was fixed, that was 88 per
              cent of passage quizzes here. It is now checked per game as a binomial tail.
              Length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them. Each is the reason that option fails, not a restatement of
              the right one. They are worth reading after a correct answer as well. A right
              choice made for an approximate reason is indistinguishable from a sound one. That
              holds until the day the approximation is what is being tested.
        takesAsRead:
          - "Why ice keeps a record at all: burial without melting"
        assumes:
          - ice spreads outwards from the high points of an ice sheet
        takeaway: A core is a column of what fell above it only where the ice has not travelled sideways.
        format: CHOICE
        question: What does drilling at the dome buy that a site on the slope cannot?
        answerText: The ice at each depth fell close to where it now sits, so the core is a column of one place's weather.
        choices:
          - The ice at each depth fell near this spot, not upstream
          - The ice is colder at the summit, which slows the chemical reactions in it
          - Snowfall is heaviest at the high point, giving the thickest annual layers
          - The bedrock beneath a dome is flattest, which keeps a three-kilometre hole vertical
        answer: The ice at each depth fell near this spot, not upstream
        why: >-
          An ice sheet flows outwards from its high points. On a slope the ice at a given depth
          arrived from somewhere upstream. So a core there mixes the weather of one place with
          the history of a journey. The two cannot be separated afterwards. Under a dome the
          flow is almost straight down. So the column below the drill is very nearly the snow
          that fell on it. Domes pay for that: they are high, cold and dry, which means thin
          layers and a long slow season.
        rebuttals:
          - Summit ice is colder, and cold ice is not what makes depth correspond to time
          - Domes are the driest part of an ice sheet, not the snowiest — thin layers are the price paid here
          - Bed shape matters to the deepest ice, and it is not why the site sits at the high point
      - group: CORE
        task: Read a year off the core
        title: What makes one year different from the next
        concept: Annual layer counting, and where counting fails
        place: Core Line
        scene: >-
          A metre of core from 60 metres is on the light table. The chronology lead, Ines Okonkwo,
          has four features marked on it and wants each one attributed before the section is cut.
        guide: >-
          Four features on one metre of core, and four things that could have made them.
          Pair them by asking what each feature is physically made of: crystals, acid,
          mineral grains, or bubbles. Then ask what season each belongs to. No single
          marker survives the whole core, so a year is where several independent signals
          agree. Where only one does, it is a candidate.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on boards
              like this are written to be plausible for more than one situation. Choosing them
              one at a time lets a nearly-right answer through unexamined. Having to place all
              of them forces the comparison — not "is this reasonable here", but "is it more
              right here than there".
          - >-
              How to use the one-each rule. The responses are a set to be distributed rather
              than a list to be sampled. So every join you make constrains the rest. Settling
              the two you are confident of can leave the remaining pair decided by elimination.
              Where it does not, two responses are still competing for one situation. That is
              exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once, three
              correct joins leave the fourth with only one place to go. Any error therefore
              involves at least two joins. That is worth remembering when the last pair looks
              forced. The fault is usually not in the join you are struggling with. It is in one
              you made early and stopped questioning.
        assumes:
          - snow that falls in summer sits under different conditions from snow that falls in winter
        takeaway: A year is counted from several signals that agree, not from one that looks convincing.
        format: PROTOCOL
        columns:
          - What is in the ice
          - What put it there
        scenarios:
          - A band of large, loosely bonded crystals
          - A narrow spike in electrical conductivity
          - A rise in fine mineral dust
          - Alternating light and dark bands about a centimetre apart
        choices:
          - A summer surface that sat exposed and grew coarse before it was buried
          - Acid from an eruption, laid down in a season or two and then gone
          - Windier months on distant continents, carried here and settled out
          - Bubble size changing through the year as the snow was compressed
        mapping: [0, 1, 2, 3]
        why: >-
          No single marker survives the whole core, so a year is established where several
          independent signals line up. Coarse crystals form on a summer surface that stayed
          exposed. Conductivity spikes are acid, and volcanic acid arrives in a season. Dust is
          delivered by winds thousands of kilometres away and peaks with their season. The light
          and dark banding is bubble structure changing as each layer was compressed. Where
          three of the four agree, a year is a year. Where only one does, it is a candidate.
        rebuttals:
          - Conductivity responds to acid, and the coarse crystal band is a surface that was left exposed
          - Dust is delivered from elsewhere and does not follow the crystal growth on this surface
          - Banding tracks how the snow was compressed rather than what was carried in from outside
  # ------------------------------------------------------------------ day 2
  - title: Three kilometres of one attempt
    objective: Get the core to the surface and onto the line without changing what it can say.
    briefing: The brittle zone starts at 540 metres and the run sheet has 3 short runs on it.
    stake: >-
      Second day of the season. The drill is going back down after a night of maintenance.
      Lindqvist has three short runs on the sheet from last season's brittle zone. Brittle ice
      is the depth band where the core comes up cracked. The core line technician, Sigrid Holt,
      has a section that arrived with no depth mark on it. Today you decide how the brittle run
      is made, what happens to a section nobody can place, and what a dirty sample costs. Ice
      gets one reading and no more. What breaks on the way up cannot be drilled again. What is
      dirtied cannot be cleaned. Every metre lost today is a metre this record never has.
    takeaway: Everything the core can say is decided before anybody measures anything.
    stops:
      - group: DRILL
        task: Bring a brittle section up whole
        title: The run through the brittle zone
        place: Drill Trench
        scene: >-
          The barrel is at 780 metres, inside the depth range where the ice comes up cracked. The
          winch, the fluid and the storage are all set for ordinary ice and Lindqvist wants the
          order settled before the lift starts.
        guide: >-
          All five of these will happen, so ask what each one buys the next. Between
          about five hundred and twelve hundred metres the bubbles are at pressures the
          surface cannot support. Ask of each step whether it reduces the shock, lets
          the pressure equalise, or fixes information that is about to be lost. One of
          them destroys the depth record if it comes early.
        background:
          - >-
              Why the order is graded whole. A sequence is a claim about dependency. Each step
              is here because the one before it has already happened, or has to have. One
              transposed pair falsifies that claim wherever it sits. Partial credit would be
              credit for a sequence that does not work.
          - >-
              Why the ends are the place to start. The first and last cards are constrained by
              having nothing before or after them. That usually makes them the two you can
              settle from the scene alone. Pinning them collapses the remaining arrangements
              sharply. What is left in the middle is where the actual judgement lives.
          - >-
              What the rail can be ordered on. Time is the usual axis, but it is not the only
              one. An order can run on cost, on risk, or on reversibility. Reversibility puts
              every observation that leaves the sample as it was before any that consumes it. On
              those boards a chronological reading finds nothing. None of the steps has to
              happen at a particular hour.
        takesAsRead:
          - "Why ice keeps a record at all: burial without melting"
        assumes:
          - gas trapped at depth is at the pressure of the ice around it
        takeaway: Ice recovered badly is a shorter record, not a cheaper one.
        format: SEQUENCE
        cards:
          - Slow the winch through the depth band where bubbles are at their highest pressure
          - Let the section rest in the trench at drill-hole temperature before it is handled
          - Log the breaks and their positions before anything is moved off the barrel
          - Carry the section to the storage trench and leave it there for the relaxation period
          - Cut and distribute only after the section has stopped cracking
        order: [0, 1, 2, 3, 4]
        why: >-
          Between about 500 and 1,200 metres the bubbles are at pressures the surface cannot
          support. The ice around them fractures as it is brought up. Each step buys the next
          one. A slow lift reduces the shock. Resting the core at hole temperature lets the
          pressure equalise gradually. Logging the breaks fixes what depth each fragment came
          from before anything moves. Storing it for weeks lets it finish cracking. Cutting
          first destroys the depth information and cuts a section that is still moving.
      - group: CORE
        task: Decide what an unmarked section is worth
        title: The metre with no label
        place: Core Line
        scene: >-
          A section has arrived at the line with a broken depth mark. Holt can place it to within
          about four metres from the run sheet, and the isotope team has asked for it.
        guide: >-
          Four options for a section that can only be placed within four metres. Ask of each
          what the depth is for. It is what turns a measurement into a statement about a year,
          and four metres here is thirty-odd years. Some work does not use depth at all. And
          note the real rule. The uncertainty has to travel with the sample, because the danger
          is somebody downstream who never hears about it.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be
              the answer under one specific misreading. A step skipped. A quantity confused with
              a rate. A correlation taken for a cause. Identifying which misreading each belongs
              to is where the learning is. The right answer alone can be reached on instinct and
              teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance. Before it was fixed, that was 88 per
              cent of passage quizzes here. It is now checked per game as a binomial tail.
              Length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them. Each is the reason that option fails, not a restatement of
              the right one. They are worth reading after a correct answer as well. A right
              choice made for an approximate reason is indistinguishable from a sound one. That
              holds until the day the approximation is what is being tested.
        assumes:
          - a measurement belongs to the depth it came from, and to no other
        takeaway: A sample without a depth is a measurement of nothing in particular.
        format: CHOICE
        question: What should the section be used for?
        answerText: Work that does not need a precise depth — density, crystal fabric, drill performance — with the four-metre uncertainty recorded against it.
        choices:
          - Work that tolerates a four-metre depth uncertainty, recorded as such
          - Isotope work, since the four-metre window is small compared with the whole core
          - Nothing; an unplaced section is discarded so it cannot contaminate the record
          - Anything, once the run sheet is used to assign it the most likely depth
        answer: Work that tolerates a four-metre depth uncertainty, recorded as such
        why: >-
          A depth is what converts a measurement into a statement about a year. Four metres here
          is thirty-odd years. So an isotope value from this section cannot be placed in the
          record. It would sit in it as a point with no time. It is still perfectly good ice for
          anything the depth does not enter: density, crystal fabric, how the drill is
          performing. The rule that matters is that the uncertainty travels with the sample. The
          danger is not the gap. It is somebody downstream who never hears about it.
        rebuttals:
          - 4 metres is 30 years at this site, which is larger than most of the features the isotopes are used to find
          - Discarding it throws away measurements that never needed a depth in the first place
          - Assigning a most likely depth writes a guess into the record in the same handwriting as the measurements
      - group: COLD
        task: Find out where a signal came from
        title: The sample that was clean until it was handled
        concept: Contamination and blanks in a cold laboratory
        place: Cold Laboratory
        scene: >-
          The cold laboratory technician, Elena Cruz, has a sodium result four times higher than
          the run before it. She has the blank, the run order and the section's handling record on
          the bench.
        guide: >-
          Five readings, and the quiet ones do the work. The blank before is ordinary
          and the blank after is high. The trim was done to specification. The replicate
          core holds the same year with no sodium in it. Ask of each candidate how many
          of the five it covers. What identifies the source is not the loud number but
          which of the others stayed quiet.
        background:
          - >-
              Why the unremarkable readings decide it. The salient reading is what draws
              attention. It is usually consistent with several explanations at once, which is
              why it rarely settles anything. The readings that discriminate are the ones a
              candidate predicts should have moved, and which have not. A normal value is a
              positive result against every mechanism that would have disturbed it.
          - >-
              How to work the candidates. Take each mechanism and predict the panel it implies
              before you look at the panel again. Which readings it drives, in which direction,
              and by roughly how much. Then compare. Working that way round is what separates a
              diagnosis from a rationalisation. The prediction is made before the data is
              consulted.
          - >-
              Why only one candidate survives. Several will account for part of the panel,
              deliberately so. A partial fit is exactly what a confident wrong answer feels like
              from the inside. When two remain, look for the reading on which their predictions
              differ and let it decide. If no reading separates them you have not finished
              reading the panel.
        takesAsRead:
          - "What a proxy is: the chain between the thing and the number"
        assumes:
          - a blank is run through the same process as a sample, with no sample in it
        takeaway: A blank measures the process, so anything it shows was never evidence about the ice.
        format: DIAGNOSIS
        headline: One sodium result is four times the run before it — and the blank that followed it is high too.
        readings:
          - { zone: Sample, label: Sodium, value: 4.1× the previous run, status: alarm }
          - { zone: Blank after it, label: Sodium, value: raised, status: alarm }
          - { zone: Blank before it, label: Sodium, value: at the usual level, status: normal }
          - { zone: Outer trim, label: Removed, value: '1 cm, as specified', status: normal }
          - { zone: Neighbouring depth, label: Sodium on the replicate core, value: ordinary, status: normal, note: 'same year, different hole' }
        choices:
          - label: Sea salt reached the plateau in the year this ice fell
            mechanism: A storm carried marine air far inland and the ice recorded it.
          - label: Something in the laboratory entered the run and stayed
            mechanism: The process itself contributed, and went on contributing to what followed.
          - label: The outer surface was not trimmed
            mechanism: Drill fluid and handling left salt on the outside of the section.
          - label: The replicate core missed the layer and is the wrong comparison
            mechanism: The second hole missed the layer entirely.
        answer: Something in the laboratory entered the run and stayed
        why: >-
          The blank before the sample is ordinary and the blank after it is high. That places
          the contamination inside the run rather than in the ice. The trim was done to
          specification, so the outside of the section is ruled out. The replicate core holds
          the same year with no sodium in it. So the atmosphere is ruled out as well. Every
          clean reading here is doing work. What identifies the source is not the loud number,
          but which of the quiet ones stayed quiet.
  # ------------------------------------------------------------------ day 3
      - group: DRILL
        task: Hold the borehole fluid while the hole is open.
        title: The level that holds the hole open
        takesAsRead:
          - "Why ice keeps a record at all: burial without melting"
        concept: "Drilling: fluid, brittle ice and what damage costs the record"
        place: Drill Tower
        scene: The borehole is three kilometres deep and the ice around it is trying to close it. The fluid column is what holds it open. The level in the tower has to stay where the pressure balance needs it while the drill runs.
        guide: >-
          Hold the fluid level inside the band on the tower gauge. The band narrows as the hole
          deepens, because the deeper the hole the less margin there is between closing it and
          fracturing it. The pump between the tank and the hole is your control. Every run of
          the winch changes the balance until you answer it.
        background:
          - >-
              Why the hole needs holding at all. Ice at three kilometres is under enough
              pressure to flow, and it closes a borehole slowly and permanently. A column of
              fluid at close to the ice pressure holds it open. That is the only reason a deep
              hole can be re-entered at all.
          - >-
              Why too much is as bad as too little. Overpressure fractures the wall and takes fluid
              into the ice, which is both a lost hole and a contaminated record. The band is
              two-sided for that reason, and it is not symmetric in consequence.
          - >-
              Why the drill itself moves it. Pulling the drill out displaces less than it did
              going in. Chips come up with fluid on them. Cold fluid coming off the reel is
              denser than what is in the hole. Each of them is a rate, not a step.
        assumes:
          - a column of fluid exerts pressure that grows with its depth
        takeaway: A hole is held open by a balance, and a balance is held by somebody.
        format: HOLD
        question: Hold the fluid level while the drill runs.
        answerText: Inside the band for most of the run, with the pump set to answer each displacement rather than tapped after the level has already moved.
        why: >-
          Ice this deep flows, and a borehole through it closes on its own unless something
          holds it open. That something is the fluid column. Its pressure at the bottom has to
          sit close to the pressure of the ice around it. A little under and the wall creeps in.
          A little over and it fractures and swallows fluid. Everything in a drilling run
          disturbs that balance and none of it is a single step. Pulling the drill removes
          displacement continuously while the winch runs. Chips come up carrying fluid. Cold
          fluid off the reel is denser than the column it joins, and keeps sinking into it. So
          the pump is set to a new rate and held rather than tapped. The band narrows with depth
          because the two failure modes converge. The deeper the hole, the smaller the gap
          between the pressure that closes it and the pressure that breaks it. Both ends of that
          gap cost the same thing. A hole nobody can re-enter, and a season nobody can repeat.
        hold:
          quantity: Fluid level against the balance point
          unit: m
          control: Tank pump
          hold: 0
          band: 0.4
          narrowTo: 0.2
          duration: 45
          direction: raise
          authority: 0.1
          pass: 0.8
          hint: Each winch run keeps changing the balance. Set the pump to answer it, not the gauge.
          disturbances:
            - { label: Drill comes up and stops displacing, at: 4, amount: -0.03 }
            - { label: Chips return with fluid on them, at: 20, amount: 0.05 }
            - { label: Cold fluid off the reel goes down, at: 38, amount: -0.045 }
          commit: Report the run
  - title: Counting to 2000
    objective: Establish how a year is counted, and find the depth where counting stops working.
    briefing: Okonkwo needs the depth at which the layer thickness drops below what the line can resolve.
    stake: >-
      Wednesday. The dates are holding up everything else on the station. Okonkwo has counted
      layers by eye down to 1,180 metres. The layers get thinner every hundred metres she goes
      down. Halvorsen wants the season's scale from depth to age before the aircraft window. The
      whole comparison with the Skarv record rests on it. Today you find where counting stops
      working, decide which yearly signal to count with, and put a number on how deep the firn's
      own clock runs. Firn is the snow above the ice, still open enough for air to move through.
      Below the depth where layers stop showing up, every age comes out of a model. A model is
      not a count.
    takeaway: Every dating method has a depth where it stops working, and knowing it is part of the date.
    stops:
      - group: CORE
        task: Find where the layers stop being countable
        title: The depth the counting runs out
        place: Core Line
        scene: >-
          Snow buries snow, and each year's layer is squeezed thinner by the weight
          above it and the ice spreading below it. The scanner can separate two bands
          three millimetres apart and no closer. Okonkwo needs the depth where the
          annual layers thin to that limit, because past it the years cannot be counted
          at all.
        guide: >-
          Drag the depth. The readout is the measured thickness of one year's layer
          there, in millimetres, and only the depths you stop at get plotted. You are
          not looking for a peak: you want the depth at which the thickness falls to the
          scanner's three-millimetre limit. Sweep down the core, find that crossing,
          then mark the depth and commit.
        background:
          - >-
              Why layers thin with depth. Ice under ice is compressed. An ice sheet also spreads
              sideways under its own weight, stretching each buried layer thinner as it goes.
              Near the surface a year is centimetres of ice; two kilometres down the same year's
              snowfall may be a few millimetres.
          - >-
              What the limit costs. Above the crossing, a year is a band somebody can point
              at, and the age of the ice is a count. Below it, two years arrive inside one
              scanner resolution and the count stops. The ages then come from a flow model
              instead, which is an inference with its own uncertainty rather than a tally.
          - >-
              Why the crossing is a depth rather than a year. The thinning depends on the
              ice's own flow, so the same limit lands at different depths in different
              cores. It has to be measured in each one, which is why this reading is taken
              before any chronology is published.
        takesAsRead:
          - Accumulation rate, and what a site with little snow buys and costs
        assumes:
          - layers are stretched thinner as the ice below them spreads outwards
        takeaway: A count ends where the instrument stops separating one year from the next.
        format: SWEEP
        question: The line resolves bands three millimetres apart and no closer. At what depth does the annual layer thickness fall to that limit?
        answerText: About 2,180 metres. Below that the bands are closer together than the line can separate, and the ages have to come from the flow model.
        sweep:
          axis: { label: Depth in the core, unit: m, min: 0, max: 2600, step: 20 }
          readout: { label: Measured annual layer thickness, unit: mm }
          baseline: 119
          response:
            - { at: 0, value: 119 }
            - { at: 200, value: 104 }
            - { at: 400, value: 90 }
            - { at: 600, value: 76 }
            - { at: 800, value: 62 }
            - { at: 1000, value: 49 }
            - { at: 1200, value: 37 }
            - { at: 1400, value: 26 }
            - { at: 1600, value: 17 }
            - { at: 1800, value: 10 }
            - { at: 1900, value: 7.4 }
            - { at: 2000, value: 5.4 }
            - { at: 2100, value: 3.9 }
            - { at: 2180, value: 3.0 }
            - { at: 2260, value: 2.3 }
            - { at: 2400, value: 1.5 }
            - { at: 2600, value: 0.8 }
          target: 2180
          tolerance: 70
          start: 0
          commit: Mark the end of the counted record
        why: >-
          Ice spreads outwards under its own weight, so every layer is stretched thinner as it
          sinks, and the thinning compounds with depth. At Vestri the surface lays down about 12
          centimetres a year in ice equivalent. At 2 kilometres down the same year is a few
          millimetres. Where the layers close to within the resolution of the measurement, the
          count stops. Not because the years are gone, but because two of them can no longer be
          told apart. Everything deeper is dated by a flow model anchored to whatever dated
          events can still be found.
      - group: COLD
        task: Choose the signal to count with
        title: Which year marker survives the depth
        concept: "Diffusion in firn, and the short events it erases"
        place: Cold Laboratory
        scene: >-
          The isotope chemist, Yuki Tanabe, has 4 annual signals measured on the same stretch of
          core at 1,400 metres. There a year is about 26 millimetres thick.
        guide: >-
          Four annual signals, and a year here is twenty-six millimetres thick. Ask of
          each whether the thing being measured can move through the firn. Water
          molecules travel through open pores for decades, and that smooths anything
          thinner than about twice the distance they cover. Sea salt and mineral grains
          do not travel. And two of these fade for other reasons entirely.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be
              the answer under one specific misreading. A step skipped. A quantity confused with
              a rate. A correlation taken for a cause. Identifying which misreading each belongs
              to is where the learning is. The right answer alone can be reached on instinct and
              teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance. Before it was fixed, that was 88 per
              cent of passage quizzes here. It is now checked per game as a binomial tail.
              Length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them. Each is the reason that option fails, not a restatement of
              the right one. They are worth reading after a correct answer as well. A right
              choice made for an approximate reason is indistinguishable from a sound one. That
              holds until the day the approximation is what is being tested.
        takesAsRead:
          - "Firn: snow densifying into ice, and the close-off depth"
          - "Stable isotopes as a thermometer: δ¹⁸O and deuterium"
        assumes:
          - water molecules can move through the connected air spaces in firn
        takeaway: A signal is only useful for counting while it is still sharper than the layer it marks.
        format: CHOICE
        question: At 1,400 metres, which signal is still able to separate 1 year from the next?
        answerText: The chemistry — sodium and dust — because those travel in the ice as particles and solutes rather than as water molecules, so firn diffusion never smoothed them.
        choices:
          - Sodium and dust, which never moved through the firn
          - The isotope ratio, which has the largest annual swing at the surface
          - Visible layering, which needs no chemical measurement to read at all
          - Electrical conductivity, which responds to every acid in the ice
        answer: Sodium and dust, which never moved through the firn
        why: >-
          Water molecules move through the open pores of the firn for decades. That movement
          smooths the isotope record. Anything thinner than about twice the diffusion length is
          averaged away. At this site that removes the yearly signal long before 1,400 metres.
          Sodium arrives as sea salt. Dust arrives as mineral grains. Neither travels through
          the pore space, so their yearly structure survives as far down as the measurement can
          read it. Visible layering fades once the bubbles are gone, and conductivity marks
          eruptions.
        rebuttals:
          - The isotope swing is the largest at the surface and the first one diffusion removes
          - Visible banding depends on bubbles, which are gone below the depth where they turn to clathrate
          - Conductivity finds acid, and acid arrives when a volcano erupts rather than every year
      - group: FIELD
        task: Put a number on the firn's own clock
        title: How old the bottom of the firn is
        place: Snow Study Hut
        scene: >-
          Brandt has the firn temperature string reading down to 88 metres, which is where the pores
          seal at this site. The surface is adding about 0.32 metres of snow a year.
        guide: >-
          Four numbers, and two of them belong to other questions: the ice-equivalent
          rate, and the density of solid ice. Ask of each whether it describes snow as
          it lies. In the firn the layers have not been thinned by flow, so this is a
          straight division. Deeper down the same sum has to be done interval by
          interval, because the layers get thinner.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is already
              measured or stated. Nothing here has to be derived. What is being tested is
              whether you can pick the quantities the relationship actually needs. Then, whether
              the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label catches a unit mismatch before it
              is placed. It also catches a quantity belonging to a different part of the
              problem. That is the habit this format exists to build.
        takesAsRead:
          - "Why ice keeps a record at all: burial without melting"
          - Accumulation rate, and what a site with little snow buys and costs
        assumes:
          - a depth divided by an annual layer thickness gives a number of years
        takeaway: A depth becomes an age only through the rate that filled it.
        format: BALLPARK
        question: Estimate the age of the snow at the close-off depth.
        answerText: About 275 years. The firn column here holds nearly three centuries of snow that has not yet become ice.
        why: >-
          A depth–age scale is arithmetic on layer thicknesses. Divide the depth by the
          thickness one year adds, and you have the years it took to get there. In the firn the
          layers have not yet been thinned by flow, so the sum is a straight division. Deeper in
          the ice the same calculation has to be done interval by interval, as the layers get
          thinner. Nearly three centuries of snow sit above the close-off depth at Vestri. Every
          one of those years is still open to the atmosphere.
        estimate:
          prompt: The pores seal at 88 metres. The surface adds about 0.32 metres of snow a year, and the firn has not been thinned by flow.
          question: Estimate the age of the snow at the close-off depth.
          relationship: age = depth ÷ annual layer thickness, valid while the layers have not yet been thinned by ice flow.
          labels:
            - 88 m  (close-off depth)
            - 0.32 m/yr  (annual snow layer)
            - 0.119 m/yr  (the same year in ice equivalent)
            - 917 kg/m³  (density of solid ice)
          values: [88, 0.32, 0.119, 917]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 275
          tolerance: 25
          units: years
          solution: 88 ÷ 0.32 = 275 years.
          explanation: The ice-equivalent figure is the distractor: the firn is snow, and this depth is measured in snow.

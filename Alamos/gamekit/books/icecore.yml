      - group: DATA
        task: Fund the chemistry that dates the core
        title: What the chemistry budget should buy
        place: Science Module
        scene: Halvorsen has one chemistry line, six weeks, and four proposals from three groups. The depth–age scale below 1,600 metres is the season's stated objective.
        takesAsRead:
          - Random against systematic uncertainty
          - Separating a trend from year-to-year noise
        assumes:
          - an eruption of known date leaves a signature in ice all over the world
        takeaway: Work that could change what the season can claim is worth more than work that adds detail to what it already claims.
        format: SCIENCETANK
        why: The season's stated objective is a depth–age scale below the counted section. Only the volcanic work bears on it. Sulphate and conductivity find the candidates. The tephra chemistry turns a candidate into a named eruption with a date on it. Neither is worth much without the other. The pollution record is a real result for a different question. And a third run on ice that already has two agreeing measurements buys nothing at all.
        proposals:
          - label: A
            text: Continuous sulphate and conductivity through the undated section, to find volcanic horizons.
          - label: B
            text: Tephra shard chemistry on every sulphate spike found, to match eruptions by name.
          - label: C
            text: Trace metals at high resolution through the modern century, for a pollution record.
          - label: D
            text: Repeat sodium measurements on the section already measured twice.
        recommended:
          A: 45
          B: 35
          C: 20
        guide: The section below 1,600 metres carries no dated horizon and the layer count stopped above it. Two eruptions of known date are expected somewhere in that depth range. Sulphate and conductivity find candidate horizons; tephra shard chemistry is what puts a name and a date on one. The modern pollution record is a genuine result and bears on nothing in the timescale. The sodium section has been measured twice and both runs agree inside the analytical error. There is one chemistry line and six weeks.
        background:
          - Why the whole spread is graded. Funding is not a vote for one idea. A portfolio says what you think is likely, what is worth hedging against, and what is not worth pursuing at all. The last two are where most of the information is. Backing the right proposal while quietly funding a bad one is a worse answer than it looks. That is why the small numbers count as much as the big one.
          - "What the three numbers are for. Thirty-five is what makes a lead a lead: below it you have hedged rather than chosen. Fifteen is the most that can sit on unsupported work before it stops being a rounding error. Past that it is a second opinion nobody argued for. Twenty is the floor under a line of work you have already called strong. Funding it too thin to finish spends the money and buys nothing."
          - Why there is a floor on the total. Points held back are not caution. They are a decision not to decide, taken with somebody else's money and deadline. The floor is what forces the panel to say something.
        concept: "Reporting an uncertain record: what it licenses and what it does not"
  - title: The year written in both cores
    objective: Use a volcanic horizon to anchor the ice chronology, while keeping the gas chronology separate.
    briefing: Glass shards at 1,642 metres may give both cores a date neither flow model produced.
    stake: Monday. A sulphate spike at 1,642 metres has volcanic glass in it. Today you name the eruption, say which of the two clocks it fixes, and spend the one clear day before the storm.
    takeaway: An independent tie point is valuable because it can test the clock rather than inherit it.
    stops:
      - group: CORE
        task: Identify the horizon
        title: The spike at 1,642 metres
        place: Core Line
        scene: One sulphate spike, two candidate eruptions of similar age, and a set of glass shards recovered from the same centimetre. Okonkwo has the shard chemistry, the layer count and the modelled age on the bench.
        assumes:
          - volcanic glass carries the chemical composition of the volcano that erupted it
        takeaway: A horizon is identified by what is in it, not by the date it would be convenient for it to have.
        reason: Two eruptions of similar age fit one sulphate spike, and a tie point is worth nothing until it is named
        format: DIAGNOSIS
        why: The shard chemistry is the only reading here that is independent of the timescale. It is the one that discriminates. Glass composition is a fingerprint of a particular magma and a particular volcano. The modelled age cannot choose between 2 candidates 90 years apart because its own uncertainty is larger than that gap. Sea-salt sulphate does not arrive with volcanic glass. And waiting for the layer count is waiting for something that stopped 460 metres higher. That is the reason a dated horizon matters here at all.
        headline: A sulphate spike at 1,642 m, with glass shards, and 2 candidate eruptions within a century of each other.
        readings:
          - zone: Sulphate
            label: Peak height
            value: 8× background
            status: alarm
          - zone: Glass shards
            label: Composition
            value: high-potassium, matches the northern candidate
            status: alarm
          - zone: Layer count
            label: Age at this depth
            value: stopped 460 m above
            status: low
          - zone: Flow model
            label: Modelled age
            value: within 90 years of both candidates
            status: normal
          - zone: Replicate core
            label: Same spike
            value: present, 1.1 m shallower
            status: normal
            note: the 2 holes are 400 m apart
        choices:
          - label: The northern eruption, identified by the shard chemistry
            mechanism: Glass composition is specific to a volcano and does not depend on the timescale.
          - label: The southern eruption, since the modelled age fits it slightly better
            mechanism: The flow model puts this depth marginally closer to the southern date.
          - label: Neither; the spike is a sea-salt sulphate peak
            mechanism: Marine sulphate can produce peaks without any volcano at all.
          - label: Undecidable until the layer count is extended down to it
            mechanism: Nothing can be assigned a date without a continuous count reaching it.
        answer: The northern eruption, identified by the shard chemistry
        guide: "Five readings, and only one of them is independent of the timescale. Ask of each whether it could tell two eruptions ninety years apart from each other. The modelled age cannot: its own uncertainty is wider than the gap. Sea-salt sulphate does not arrive with volcanic glass. And the layer count stopped four hundred and sixty metres higher up."
        background:
          - Why the unremarkable readings decide it. The salient reading is what draws attention. It is usually consistent with several explanations at once, which is why it rarely settles anything. The readings that discriminate are the ones a candidate predicts should have moved, and which have not. A normal value is a positive result against every mechanism that would have disturbed it.
          - How to work the candidates. Take each mechanism and predict the panel it implies before you look at the panel again. Which readings it drives, in which direction, and by roughly how much. Then compare. Working that way round is what separates a diagnosis from a rationalisation. The prediction is made before the data is consulted.
          - Why only one candidate survives. Several will account for part of the panel, deliberately so. A partial fit is exactly what a confident wrong answer feels like from the inside. When two remain, look for the reading on which their predictions differ and let it decide. If no reading separates them you have not finished reading the panel.

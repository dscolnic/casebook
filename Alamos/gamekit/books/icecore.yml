          - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading. A step skipped. A quantity confused with a rate. A correlation taken for a cause. Identifying which misreading each belongs to is where the learning is. The right answer alone can be reached on instinct and teach nothing.
          - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance. Before it was fixed, that was 88 per cent of passage quizzes here. It is now checked per game as a binomial tail. Length, hedging and specificity have had the signal taken out of them deliberately.
          - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them. Each is the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason is indistinguishable from a sound one. That holds until the day the approximation is what is being tested.
        concept: Diffusion in firn, and the short events it erases
      - group: FIELD
        task: Account for compaction before turning firn depth into time
        title: How much ice is packed into the firn
        place: Snow Study Hut
        question: Estimate the ice-equivalent thickness contained in the 88-metre firn column.
        scene: Brandt's density profile puts pore close-off at 88 metres. Averaged over that column, the firn is about 0.62 times as dense as solid ice. Samuel Adeyemi, the gas geochemist, needs the ice-equivalent material above close-off before he can turn it into an age.
        takesAsRead:
          - Accumulation rate, and what a site with little snow buys and costs
          - "Why ice keeps a record at all: burial without melting"
        assumes:
          - the mean density ratio represents the mass in the 88-metre firn column well enough for a first estimate
        takeaway: In compacting firn, physical depth is not time until density is accounted for.
        reason: The gas-age estimate needs the mass in the firn column, and physical depth is not that mass
        format: BALLPARK
        why: "Firn gets denser as its pore space collapses. So a layer that fell as 32 centimetres of fresh snow is thinner than that by close-off. Multiply the physical depth by the mean density relative to ice. That gives the thickness the whole column would have as solid ice: about 55 metres. On Day 6 that column is divided by the annual accumulation in ice equivalent. The answer is how long the ice took to reach close-off. Dividing 88 by 0.32 would ignore centuries of compaction."
        estimate:
          prompt: Close-off is at 88 metres and the mean density of the firn above it is 0.62 times the density of solid ice.
          question: Estimate the ice-equivalent thickness of the firn column.
          labels:
            - 88 m  (close-off depth)
            - 0.62  (mean firn density relative to ice)
            - 0.119 m/yr  (annual accumulation in ice equivalent)
            - 0.32 m/yr  (fresh annual snow thickness)
          values: [88, 0.62, 0.119, 0.32]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 54.56
          tolerance: 5
          units: m ice equivalent
          solution: 88 × 0.62 = 54.6 m of ice equivalent.
          explanation: The annual accumulation rates belong to the next step, when this conserved column mass is converted into years.
          relationship: ice-equivalent thickness = z × ρ̄_rel — physical firn depth multiplied by mean density relative to solid ice.
        guide: Do not divide 88 metres by the thickness of fresh snow. Buried firn compacts, so old annual layers are physically thinner than they were at the surface even before deep-ice flow matters. Convert the whole firn column to ice equivalent first. That keeps the conserved mass and removes the changing pore space.
        background:
          - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated. Nothing here has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs. Then, whether the size of the answer looks right once they are in place.
          - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label catches a unit mismatch before it is placed. It also catches a quantity belonging to a different part of the problem. That is the habit this format exists to build.
        concept: "Firn: snow densifying into ice, and the close-off depth"
        answerText: About 55 metres of ice equivalent. That conserved mass—not 88 metres of physical depth—is the quantity the gas-age estimate needs.
      - group: CORE
        task: Log the core sections before the light goes.
        title: A year, or a summer that melted
        place: Core Processing Trench
        question: Send each section to the bin that says what made the layer.
        scene: Sections come out of the trench faster than they can be logged properly. A layer that formed over a year is one thing. A layer where the surface melted and refroze is another, and both are visible on the light table.
        assumes:
          - snow builds up in layers and can melt and refreeze
        takeaway: A layer counted wrong moves every date below it, in the same direction, for ever.
        reason: Sections are arriving faster than they can be logged, and every one has to be sorted before the light goes
        format: BELT
        why: An annual layer is built by a season. Coarse crystals from summer sun. Fine wind-packed snow through winter. And air trapped as bubbles throughout. A melt layer is built by water. The surface thaws, and the water percolates down and refreezes in the pore space. What comes out on the light table is clear, dense and almost free of bubbles. Both are stripes in a core and only one of them is a year. The cost of confusing them is not local. Annual layer counting is the clock. So a melt layer counted as a year makes every date below it too old. A year missed makes every date too young, all the way to the bottom of the core. Melt also does something worse than miscount. Water moving down carries the chemistry with it. So the isotopes and the ions either side of the layer are smeared. That is why a site is chosen for how rarely its surface melts rather than for how much snow it gets.

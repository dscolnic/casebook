      - group: FIELD
        task: Spend the clear day
        title: One clear day, three jobs
        place: Snow Study Hut
        question: Which job takes the clear day?
        scene: Brandt has a forecast that gives her one clear day and then four of blowing snow. Three jobs are outstanding and each takes most of a day on its own.
        takesAsRead:
          - "Why ice keeps a record at all: burial without melting"
        assumes:
          - a measurement that cannot be repeated should be taken when it can be taken
        takeaway: Order the work by what becomes impossible, not by what is most important.
        reason: One clear day, then four of blowing snow, and three outstanding jobs that each take most of a day
        format: TRIAGE
        why: Two of these can be done in bad weather and one cannot. The pit is beside the hut, and the mast is a short walk on a fixed line. Both survive four days of blowing snow with nothing worse than discomfort. The stake array runs two kilometres out and needs visibility to level against. More to the point, blowing snow redistributes the surface the stakes are measuring. A reading taken after the storm is measuring something different. The shallow core can be re-drilled in any weather at all.
        rebuttals:
          - The pit is a few metres from the hut door and can be dug in any weather
          - The mast is on a fixed line and its record is stored until somebody collects it
          - A firn core that broke can be re-drilled whenever the drill is free
        choices:
          - Read and re-level the stake farm across the whole array
          - Dig and photograph the fortnightly snow pit beside the hut
          - Service the mast instruments and download the temperature record

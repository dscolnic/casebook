        task: Report a ratio the way everyone else does
        title: The number that is a difference
        place: Cold Laboratory
        question: Estimate the isotope value of this sample in parts per thousand.
        scene: Cruz has the raw ratio of heavy to light oxygen for a sample and the same ratio for the standard water. The record is plotted in parts per thousand and the raw numbers are not.
        assumes:
          - an isotope ratio is the amount of a heavy isotope divided by the amount of a light one
        takeaway: An isotope value is a comparison with an agreed water, which is why every one of them is negative here.
        format: BALLPARK
        why: Isotope ratios differ from one another in the fourth decimal place, so nobody reports them as ratios. The convention is to divide the sample's ratio by the ratio of one agreed water. Then subtract 1 so that the standard itself reads 0. Then multiply by 1000 so the numbers are convenient. What comes out is a difference in parts per thousand. It is always negative for polar snow. Every stage of the journey from the ocean has already removed some of the heavy isotope. The scale is a comparison, and it only means anything if everyone uses the same water.
        estimate:
          prompt: The sample's ratio of heavy to light oxygen is 1.935 in thousandths; the standard ocean water reads 2.005 in the same units.
          question: Estimate the sample's isotope value in parts per thousand.
          labels:
            - 1.935  (sample ratio, in thousandths)
            - 2.005  (standard ocean water, in thousandths)
            - 1000  (the factor that makes it parts per thousand)
            - 0.67  (the site temperature slope)
          values: [1.935, 2.005, 1000, 0.67]
          slots: 3
          template: ({0} ÷ {1} − 1) × {2}
          formula: (a/b-1)*c
          correct: [0, 1, 2]
          target: -34.9
          tolerance: 2
          units: ‰
          solution: (1.935 ÷ 2.005 − 1) × 1000 = −34.9 per mil.
          explanation: The temperature slope belongs to the next step, after the value is on the scale everybody shares.
          relationship: δ¹⁸O = (R_sample ÷ R_standard − 1) × 1000 — the sample's heavy-to-light ratio against ocean water's, in parts per thousand.
        guide: Four numbers, and one of them is the site temperature slope, which belongs to a later step. Ask of each what part of the convention it supplies. Ratios differ in the fourth decimal place, so nobody reports them as ratios. The scale is a comparison with one agreed water, set so that the standard itself reads zero. Polar snow is always negative.
        background:
          - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated. Nothing here has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs. Then, whether the size of the answer looks right once they are in place.
          - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label catches a unit mismatch before it is placed. It also catches a quantity belonging to a different part of the problem. That is the habit this format exists to build.
        concept: "Stable isotopes as a thermometer: δ¹⁸O and deuterium"
        answerText: About −35 per mil. The sample holds 3.5% less heavy oxygen than ocean water, which is what a polar site looks like.

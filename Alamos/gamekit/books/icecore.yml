        assumes:
          - fine dust reaching this plateau has travelled thousands of kilometres
        takeaway: A concentration in the ice is a product of what was produced, what was carried, and how much snow diluted it.
        format: CHOICE
        question: What is the most defensible reading of four times the dust?
        answerText: More dust arrived per unit of snow — which is some combination of drier source regions, stronger transport, and less snowfall to dilute it, and the three are not separable from this measurement alone.
        choices:
          - More dust arrived per unit of snow, for reasons this cannot separate
          - The source regions released four times as much dust as they do today
          - Winds over the Southern Ocean were four times stronger during the cold interval
          - Four times as much dust was produced globally at that time

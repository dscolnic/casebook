  - title: A day when nothing is wrong
    objective: Spend the remaining season on measurements that can still change the final claim.
    briefing: Good work and work this season needs are not the same list, and the fuel was committed before anybody
    stake: Friday. For the first time this season nothing is broken, and that makes the choice harder. Nine drilling days are left and four good jobs want them. Today you commit the last of the drill time. Some of that work would help the station, and only some of it can still change the record.
    takeaway: When time is scarce, fund the measurement that can still change the conclusion.
    stops:
      - group: DRILL
        task: Commit the last drilling days
        title: Nine days, four jobs
        place: Drill Trench
        question: Which questions can the last nine days still answer?
        scene: Lindqvist has nine drilling days before the station closes. Anneke de Vries, the camp manager, has the fuel committed for those nine and no more. Four pieces of work want them.
        takesAsRead:
          - "Why ice keeps a record at all: burial without melting"
        assumes:
          - a season ends on a date fixed by aircraft rather than by science
        takeaway: A plan is judged by which questions it can still answer, not by how much it fits in.
        format: ALLOCATE
        why: The two required questions are the ones this season exists to answer. Whether the deep section reaches older ice. And whether the horizon everything is now tied to appears in ice that shared the weather but not the drill. Together with the fluid change they use exactly the nine days available. The firn profile and the borehole log are both good work. Both can be done next season by somebody who has not yet drilled to 2,400 metres. A plan that fits everything in is a plan that has not been asked what it is for.
        allocate:
          pool:
            amount: 9
            unit: drilling days
            mode: scalar
          items:
            - id: fluid
              label: Drill fluid change and barrel service
              cost: 2
              protected: true
              note: the drill does not turn without it
            - id: deepen
              label: Extend the hole past the modelled clathrate boundary
              cost: 4
            - id: replicate
              label: Cut the replicate core through the tephra horizon
              cost: 3
            - id: firn
              label: Re-drill the shallow firn core that broke
              cost: 2
            - id: logging
              label: Run the borehole temperature log to the bottom
              cost: 3
          answers:
            - question: Does the deep section reach ice older than the counted record can reach?
              requires:
                - deepen
              required: true
            - question: Is the tephra horizon present in a second hole 400 metres away?
              requires:
                - replicate
              required: true
            - question: What is the firn air profile this season?
              requires:
                - firn
            - question: What is the present-day temperature profile of the ice?
              requires:
                - logging
          hint: The fluid change is not optional. What is left has to be spent on the questions that change what the season can claim.
          commit: Commit the drilling plan
        guide: "Nine drilling days, fuel committed for exactly nine, and four jobs that want them. Watch the questions list rather than the depths: it shows which questions the current plan can still answer. Every day you spend is a question you can answer and one you have given up. Nothing can be added after the station closes."
        background:
          - Why the fuel is the real constraint. Days can in principle be found; the fuel for those days cannot. It was committed before the season and there is no more. The plan has to fit the fuel rather than the calendar.
          - Why depth is not the same as value. Drilling deeper always produces more core, and the extra core answers a question only if it reaches something the record needs. A shallower job that closes a comparison can be worth more. A deeper one that extends a series nobody is arguing about is worth less.
          - What the closing date does to the choice. Anything unfinished is unfinished for a year. A core left mid-hole can be lost to closure, or to the hole itself. So a plan that just fits is worse than one that fits with something in reserve.
        concept: "Drilling: fluid, brittle ice and what damage costs the record"
        answerText: Extending the deep section and cutting the replicate at the tephra horizon, on top of the fluid change the drill cannot run without. The firn re-drill and the borehole log are real work and neither answers a question this season needs.
      - group: FIELD
        task: Say what one stake is worth
        title: The stake that gained a centimetre
        place: Snow Study Hut
        question: What does the gain at that one stake establish?
        scene: Brandt has 48 stakes read this morning. One near the hut has gained a centimetre since the last reading. 11 others across the array have lost about the same.
        assumes:
          - wind moves snow across a surface after it has fallen
        takeaway: A measurement of a surface that moves has to be made in enough places to catch what moved.
        format: CHOICE
        why: Wind on this plateau moves far more snow horizontally than falls out of the sky in a fortnight. So any single stake is measuring snowfall and redistribution added together. It cannot separate them. The array can. Snow moved from one place to another cancels when the whole array is summed. What is left is what actually arrived. That is why 48 stakes are read rather than 1, and why the accumulation figure is a season's arithmetic rather than a reading.
        rebuttals:
          - Sheltering is a real effect and would have to be established across several fortnights, not one
          - A fortnight's snowfall is what the whole array establishes, since drift cancels only in the sum
          - 11 stakes losing snow is what redistribution looks like, and does not point at one disturbed stake
        choices:
          - Little on its own; the whole array separates snowfall from drift
          - That accumulation is higher near the hut, which shelters the surface from the wind
          - That this fortnight's snowfall was about a centimetre
          - That the stake has been disturbed, since the others lost snow
        answer: Little on its own; the whole array separates snowfall from drift
        guide: Four readings of one stake that gained a centimetre while eleven others lost. Ask of each whether a single stake can separate snow that fell from snow that arrived sideways. Wind moves far more snow across this plateau in a fortnight than falls out of the sky. Summed across the array, the moving snow cancels. That is why forty-eight stakes are read rather than one.
        background:
          - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading. A step skipped. A quantity confused with a rate. A correlation taken for a cause. Identifying which misreading each belongs to is where the learning is. The right answer alone can be reached on instinct and teach nothing.
          - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance. Before it was fixed, that was 88 per cent of passage quizzes here. It is now checked per game as a binomial tail. Length, hedging and specificity have had the signal taken out of them deliberately.
          - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them. Each is the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason is indistinguishable from a sound one. That holds until the day the approximation is what is being tested.
        concept: "Why ice keeps a record at all: burial without melting"
      - group: COLD
        task: Fix the order of a run
        title: The order a run is made in
        place: Cold Laboratory
        scene: Cruz has 16 samples to run and the instrument warmed up. Tanabe's rule is that a run has to be able to say afterwards whether it can be trusted.
        assumes:
          - an instrument's response can move slowly during a long run
        takeaway: A run is designed so that it can be checked afterwards, not so that it finishes soonest.
        format: SEQUENCE
        why: Every step here exists to make the run auditable. The blank establishes what the process adds before any ice is involved. The opening standard fixes the scale. The standards inside the run reveal drift while it is happening. The closing standard measures how far it moved overall. Only then can the samples be corrected. Both the raw and the corrected values are kept. A correction is a claim about the instrument that somebody may want to check later.
        cards:
          - Run a blank, to see what the process contributes with no sample in it
          - Run the working standard, to fix where the scale sits at the start
          - Run the samples in depth order, with a standard after every eighth
          - Run the working standard again at the end, to measure the drift across the run
          - Correct the samples for drift, and write the raw and corrected values to the record
        order: [0, 1, 2, 3, 4]
        guide: All five of these will be done, so ask what each one makes possible. A blank says what the process adds with no ice in it. An opening standard fixes the scale. Standards inside the run reveal drift while it happens. Ask which of them a correction could be computed without. And note why both raw and corrected values are kept.
        background:
          - Why the order is graded whole. A sequence is a claim about dependency. Each step is here because the one before it has already happened, or has to have. One transposed pair falsifies that claim wherever it sits. Partial credit would be credit for a sequence that does not work.
          - Why the ends are the place to start. The first and last cards are constrained by having nothing before or after them. That usually makes them the two you can settle from the scene alone. Pinning them collapses the remaining arrangements sharply. What is left in the middle is where the actual judgement lives.
          - What the rail can be ordered on. Time is the usual axis, but it is not the only one. An order can run on cost, on risk, or on reversibility. Reversibility puts every observation that leaves the sample as it was before any that consumes it. On those boards a chronological reading finds nothing. None of the steps has to happen at a particular hour.
        concept: Contamination and blanks in a cold laboratory
  - title: The night the generator stopped
    objective: Decide what the cold-chain excursion actually invalidates, what must be quarantined, and what uncertainty it leaves behind.
    briefing: The core store crossed its validated handling limit overnight and the log does not say when.
    stake: Saturday. The number-two generator died in the night, and the store came back at minus 19 instead of minus 20. Four gas sections can no longer be called clean. Today you say what the broken record actually spoils. Then you restart what is still drifting, and put a number on the scatter.
    takeaway: When the evidence chain breaks, record the break; do not convert uncertainty into certainty in either direction.
    stops:
      - group: COLD
        task: Check what is worth checking
        title: Six signatures and two hours
        place: Cold Laboratory
        question: Which two claims should the two hours verify?
        scene: Six lines on the night sheet, all signed. Tanabe has two hours before the flight manifest closes and can verify two of them properly.
        takesAsRead:
          - Random against systematic uncertainty
          - Separating a trend from year-to-year noise
        assumes:
          - a signature records that somebody believed something, at the time they signed
        takeaway: A protocol excursion creates a documented uncertainty; it does not automatically create either a valid sample or a destroyed one.
        format: ATTEST
        why: The signatures prove that somebody recorded the claims, not that the conditions were continuously observed. The store was outside the laboratory's validated handling range when power returned, and the logger cannot say when the excursion began. That does not prove the gas measurements are ruined. It means the four chronology sections must be quarantined or specially tested rather than silently treated as ordinary samples. Because those sections were intended to tighten Δage, the break widens the final chronology uncertainty.
        attest:
          claims:
            - id: store
              label: Core store stayed inside the validated ≤ −20 °C handling range all night
              signedBy: Ekwueme
              evidence: signed at 0600 for the whole night; the store was at −19 °C when power returned and the logger has a gap
              critical: true
            - id: gas
              label: Four chronology gas sections remained inside validated cold-chain conditions
              signedBy: Menon
              evidence: signed on the same sheet; those sections were in the same store and were meant to tighten Δage
              critical: true
            - id: drill
              label: Drill fluid tank heater running
              signedBy: Lindqvist
              evidence: independent tank thermistor logged to a separate recorder all night
              backed: true
            - id: mast
              label: Mast instruments powered from the second circuit
              signedBy: Brandt
              evidence: the mast record itself is continuous through the outage
              critical: true
              backed: true
            - id: kitchen
              label: Food store above freezing
              signedBy: de Vries
              evidence: nobody has looked since the power came back
            - id: fuel
              label: Day tank filled at 2200
              signedBy: de Vries
              evidence: level gauge reading logged before and after
              backed: true
          checks: 2
          hint: Everything here is signed. Verifying costs time and there is not enough of it for the whole sheet.
          commit: Verify the two
        guide: Six signed lines, two hours, and two of them can be verified properly. Open each claim and read what already backs it. A signature records that somebody took responsibility, not that anybody observed the thing. Hold what the backing does not support. Spend the two hours where being wrong would matter after the flight has gone.
        background:
          - Why the manifest deadline is the whole pressure. Once the flight closes, anything unverified stays unverified until next season. The samples or the equipment it concerns are already off the ice. A claim checked next year is a claim about something nobody can revisit.
          - What a night sheet is. A running record of what was done on shift, signed at the end. It is written by people who were tired, at the end of a working night. Its purpose is continuity rather than evidence. That is exactly why some lines on it are firmer than others.
          - How to choose between two doubtful lines. Not by which is least likely to be true. By which one, if wrong, would change what somebody does with the material afterwards. That is consequence, and it is the judgement the two hours are for.
        concept: "Reporting an uncertain record: what it licenses and what it does not"
        answerText: Verify the core-store temperature record and the four gas sections. Both claims lack independent backing, and both affect whether the sections can be used to tighten the chronology.
      - group: DRILL
        task: Put the restart in order
        title: What comes back first
        place: Drill Trench
        question: What is restarted first?
        scene: Power is back on one generator. Lindqvist, de Vries and Tanabe each want their own system restarted first. The single generator will not carry all of them at once.
        assumes:
          - a system that has already failed is more informative than one that has not yet been used
        takeaway: Restart what is still changing irreversibly or leaving the validated evidence envelope.
        format: TRIAGE
        why: The store is still warming, so delay continues to change the condition of irreplaceable samples. The drill loses schedule time if it waits. The chemistry queue is still measurable tomorrow, and the satellite link can wait for the next window. Restart priority follows the rate at which evidence is becoming harder to defend, not the loudest request. The point is not that minus 20 is a universal physical cliff. It is the station's validated handling boundary. The longer the excursion runs, the less well those sections match the conditions the method was qualified under.
        rebuttals:
          - A drilling day is recoverable, and the drill is not losing anything while it stands idle
          - Queued samples are in the store; if the store is warm they are the thing being lost, not the queue
          - A report is not perishable, and the link is the only item here that changes nothing by waiting
        choices:
          - The core store refrigeration, which is still warming
          - The drill, so the day's run is not lost
          - The chemistry line, so the 16 queued samples can be run
          - The satellite link, so the season report can be sent
        answer: The core store refrigeration, which is still warming
        guide: Four systems want the one generator. Ask which condition is still moving away from a validated state while you wait. The core store is already outside its qualified handling range and is still warming. The drill loses schedule time, the chemistry queue can wait, and the satellite has another window. Restart what is still changing, not what is merely delayed.
        background:
          - Why first is different from most important. Restart order depends on what another hour changes. A major system that will be in the same condition an hour from now can wait. A smaller system whose evidence quality is still drifting cannot.
          - Why the temperature boundary is procedural rather than magical. The laboratory validated its handling and gas-analysis method for sections kept at or below a stated temperature. Crossing that boundary creates a qualification problem, not an instant physical verdict. The correct response is to restore control and document the excursion.
          - Why the science still has stakes. These four sections were intended to tighten the gas–ice age estimate. Losing confidence in them does not erase the season's result. It widens the uncertainty of the correction the final comparison depends on.
        concept: "Drilling: fluid, brittle ice and what damage costs the record"
      - group: DATA
        task: Say how tightly the mean can be quoted
        title: How much of it is noise
        place: Science Module
        question: Estimate the standard error of the thirty-year mean, given the year-to-year noise.
        scene: Aalto has 30 years of reconstructed annual temperature from the top of the core. The year-to-year scatter is 1.4 degrees and the summary wants a mean for the period.
        takesAsRead:
          - Random against systematic uncertainty
        assumes:
          - averaging independent years reduces the scatter of the average, not of the years
        takeaway: Averaging shrinks independent random scatter; it does not shrink a systematic that moves the whole record together.
        format: BALLPARK
        why: Treat the year-to-year scatter as independent random variation. Then 1.4 degrees over 30 years gives a standard error of about 0.26 degrees on the mean. That calculation describes only the random component. A common isotope-temperature calibration error or a chronology shift moves many years together and does not average down with more years. The final uncertainty therefore cannot be built by quoting 0.26 alone.
        estimate:
          prompt: The reconstructed annual temperatures scatter by 1.4 degrees, and the period is 30 years long.
          question: Estimate the standard error of the thirty-year mean, given the year-to-year noise.
          labels:
            - 1.4 °C  (year-to-year scatter)
            - 30  (years in the period)
            - 0.67 ‰/°C  (the site calibration slope)
            - 11  (years of mast overlap)
          values: [1.4, 30, 0.67, 11]
          slots: 2
          template: "{0} ÷ √{1}"
          formula: a/Math.sqrt(b)
          correct: [0, 1]
          target: 0.256
          tolerance: 0.04
          units: °C
          solution: 1.4 ÷ √30 = 0.26 °C.
          explanation: The calibration slope is already inside the reconstruction; applying it again would convert degrees into degrees per degree.
          relationship: SE = s ÷ √n — the year-to-year scatter, divided by the square root of how many years were averaged.
        guide: "Four numbers, and two of them belong to other questions: the calibration slope, and the years of mast overlap. Ask of each whether this uncertainty depends on it. Averaging does not remove the scatter of individual years. It reduces the uncertainty of the mean, and only as the square root of how many years went in."
        background:
          - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated. Nothing here has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs. Then, whether the size of the answer looks right once they are in place.
          - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label catches a unit mismatch before it is placed. It also catches a quantity belonging to a different part of the problem. That is the habit this format exists to build.
        concept: Separating a trend from year-to-year noise
        answerText: About 0.26 °C for the random-only standard error under the independent-year approximation. Calibration and chronology systematics do not shrink as 1/√n.
  - title: What survives the uncertainty
    objective: Choose the comparison statement that remains true across the credible range of the clock correction.
    briefing: The nominal alignment removed most of the mismatch, but the generator incident left the gas-age correction wider than planned.
    stake: Sunday. Matching each site's two clocks leaves about 0.15 per mil between the records, and the honest range runs out to 0.4. Today you pick the strongest sentence that holds across all of it.
    takeaway: A publishable claim must survive the uncertainty in the assumptions that produced it.
    stops:
      - group: DATA
        task: Choose the sentence that survives
        title: Four sentences and a range
        place: Science Module
        question: Which sentence is still defensible across the full credible range of the systematic clock correction?
        scene: After the laboratory correction, 0.5 per mil remained between the isotope records. The best clock remapping removes about 0.35. The credible correction runs from 0.10 to 0.40 per mil. The firn model is uncertain, and four chronology sections are quarantined. Four possible report sentences are on the board.
        assumes:
          - a correction estimated from a model carries a range rather than a single value
        takeaway: The claim to publish is the one that is still true at the least favourable end of what you assumed.
        reason: Four possible report sentences are on the board and the correction behind them is a range, not a number
        format: STRESS
        why: At the best estimate the chronology correction leaves only about 0.15 per mil. The final sentence has to survive the whole credible range, not the preferred point. If the correction removes only 0.10, a 0.40 per mil residual remains; if it removes 0.40, only 0.10 remains. That range is too broad to claim the records are fully consistent. It is also too broad to claim the sites cooled differently. The robust result is that chronology accounts for part of the original mismatch and the remainder is unresolved this season.
        stress:
          candidates:
            - id: consistent
              label: The two records are consistent once the correction is applied
            - id: partial
              label: Part of the difference is chronological; the rest is unexplained
            - id: entirely
              label: The difference is entirely chronological
            - id: climate
              label: The two sites recorded different coolings
          criteria:
            - key: weeks
              label: Weeks to draft and review
              unit: wk
            - key: risk
              label: Chance of later correction
              unit: "%"
          scores:
            consistent:
              weeks: 3
              risk: 18
            partial:
              weeks: 5
              risk: 12
            entirely:
              weeks: 2
              risk: 46
            climate:
              weeks: 2
              risk: 61
          feasible:
            consistent: 0.25
            partial: 0.1
            entirely: 0.38
            climate: 0.45
          assumption:
            label: Part of the 0.5‰ residual removed by clock remapping
            unit: ‰
            min: 0.1
            max: 0.4
            nominal: 0.35
            step: 0.01
          robust: partial
          optimiseOn: weeks
          hint: Start from the 0.5 per mil residual left after the laboratory correction. Move the chronology correction across its credible range before deciding what survives.
          commit: Sign the sentence
        guide: The correction removes somewhere between a tenth and four tenths of a per mil. Nobody can settle which, this season. Move it to the least favourable end before choosing between the four sentences. A sentence can be true at the middle of the range and false at the end of it. That is not a sentence the season summary can carry.
        background:
          - Why the pessimistic end rather than the best estimate. A published sentence is read as a claim about the world, not about the middle of somebody's uncertainty. Choosing at the expected value means publishing something that has a real chance of being wrong. The retraction costs more than the caution would have.
          - What makes one sentence survive and another not. Sentences that assert a direction usually survive. Sentences that assert a size usually do not. The size is exactly what the correction's range moves. A carefully weakened claim can be both true and useful.
          - Why this cannot wait for the assumptions to settle. The summary is written this season and the assumptions will not be settled for years. The professional move is to write the strongest sentence that survives the whole range. Not the strongest sentence full stop.
        concept: Random against systematic uncertainty
        answerText: That chronology explains part of the apparent difference and the remaining difference is unresolved. It survives whether the clock correction removes 0.10 or 0.40 per mil.
      - group: GAS
        task: Say what the gas record alone establishes
        title: What the bubbles license
        place: Gas Laboratory
        question: What does the carbon dioxide record support that the isotope record cannot?
        scene: Adeyemi has carbon dioxide through the cold interval and the modern section, measured on this core and reproduced on the replicate. Halvorsen wants to know what it supports on its own.
        assumes:
          - a measurement made at one site can record a quantity that is the same everywhere
        takeaway: Some quantities measured at one place are global, and a proxy of local weather is not one of them.
        reason: The carbon dioxide record was reproduced on the replicate core, and what it supports on its own is still open
        format: CHOICE
        why: "Carbon dioxide has a long atmospheric lifetime and mixes fast. So ice-core concentrations stand for the whole atmosphere rather than for the weather over Vestri. The measurement therefore supports a statement about atmospheric composition at the gas age assigned to the sample. Water isotopes answer a different question: they are a local-to-regional precipitation proxy whose conversion to temperature needs a site calibration. Strong gas concentration data can still have a less certain date if the gas chronology is uncertain."
        rebuttals:
          - Temperature at this site is what the isotopes measure, through a slope, and the gas does not measure it at all
          - A gas concentration in a bubble is a mixing ratio and does not depend on how much snow buried it
          - Sharing the same ice is not the same as supporting the same claims, which is the whole distinction here
        choices:
          - A statement about the global atmosphere, since the gas is well mixed
          - A statement about the temperature of this site, more directly than the isotopes do
          - A statement about how much snow fell, since concentration depends on accumulation
          - Nothing the isotope record does not already support, since both come from the same ice
        answer: A statement about the global atmosphere, since the gas is well mixed
        guide: Four options, and the question is what this measurement is of. Ask of each how far the quantity travels before it is measured. Carbon dioxide stays in the air long enough to mix through all of it, so a bubble here reports the planet. The isotopes record condensation over this region, and reach degrees through a slope fitted at this site. Local at both steps.
        background:
          - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading. A step skipped. A quantity confused with a rate. A correlation taken for a cause. Identifying which misreading each belongs to is where the learning is. The right answer alone can be reached on instinct and teach nothing.
          - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance. Before it was fixed, that was 88 per cent of passage quizzes here. It is now checked per game as a binomial tail. Length, hedging and specificity have had the signal taken out of them deliberately.
          - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them. Each is the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason is indistinguishable from a sound one. That holds until the day the approximation is what is being tested.
        concept: Carbon dioxide and methane records, and what a ppm is
      - group: CORE
        task: Fix what happens before the report goes
        title: Before anything is sent
        place: Core Line
        scene: Okonkwo has the sentence, the corrected records and a report that closes in the morning. Four things are outstanding and their order is not obvious.
        assumes:
          - a result should be reproducible by somebody who was not present
        takeaway: "A result leaves the station as a package: the numbers, the version, and what was assumed."
        reason: Four things are outstanding before the report closes in the morning, and their order is not obvious
        format: SEQUENCE
        why: Each step is what makes the next one mean something. Freezing the age scales fixes what the result was computed on, which is the only way anybody can reproduce it later. Recomputing from raw data on that frozen version tests that the number in the draft is the number the method produces. Writing the correction and its range into the methods is what lets a reader disagree with it specifically. Circulating to the other group is what turns a disagreement about their record into a conversation with them. Then it goes.
        cards:
          - Freeze the version of both age scales the result was computed on
          - Recompute the corrected comparison from that frozen version, from raw data
          - Write the correction, its range and the firn model it came from into the methods
          - Circulate the draft to the Skarv group before it is submitted anywhere
          - Send the report, with the archived data referenced by version
        order: [0, 1, 2, 3, 4]
        guide: All five of these will be done before the report goes. Ask of each what the next step would mean without it. Nobody can reproduce a result without knowing which version of the age scales produced it. Recomputing from raw data tests that the draft's number is the method's number. And one of these turns a disagreement about another group's record into a conversation with them.
        background:
          - Why the order is graded whole. A sequence is a claim about dependency. Each step is here because the one before it has already happened, or has to have. One transposed pair falsifies that claim wherever it sits. Partial credit would be credit for a sequence that does not work.
          - Why the ends are the place to start. The first and last cards are constrained by having nothing before or after them. That usually makes them the two you can settle from the scene alone. Pinning them collapses the remaining arrangements sharply. What is left in the middle is where the actual judgement lives.
          - What the rail can be ordered on. Time is the usual axis, but it is not the only one. An order can run on cost, on risk, or on reversibility. Reversibility puts every observation that leaves the sample as it was before any that consumes it. On those boards a chronological reading finds nothing. None of the steps has to happen at a particular hour.
        concept: Replicate cores, and what agreement between them establishes
  - title: Sign the record
    objective: Separate measurement, calibration, model, and inference—then make the final release decision.
    briefing: The Vestri Record is complete; the last job is deciding exactly what you are willing to sign.
    stake: Monday. The report is written and the aircraft leaves on Wednesday. Today you sort what was measured from what was guessed, then sign — or refuse to sign — the sentence others will quote.
    takeaway: The final scientific act is not another calculation. It is deciding what the evidence licenses you to say.
    stops:
      - group: FIELD
        task: Sort measurement, calibration, model, and inference
        title: What rests on what
        place: Snow Study Hut
        scene: Brandt has the season's headline quantities on the wall. Before you sign anything, each one has to be labelled by how it was obtained. The four labels are direct measurement, calibrated proxy, counted or modelled chronology, and atmospheric measurement on its own age model.
        assumes:
          - a number is only as strong as the weakest step between the ice and it
        takeaway: Every number in a proxy record belongs to a class, and the class is part of the number.
        reason: The season's headline numbers are on the wall, and none of them can be signed until it is labelled
        format: PROTOCOL
        why: The accumulation is observed at the surface and converted to ice equivalent. The cooling comes from measured water isotopes passed through a site calibration. The chronology is counted where annual layers are resolvable and modelled below that, with volcanic and radiocarbon constraints. Carbon dioxide is measured directly in trapped air. The age given to that air belongs to the gas chronology, not to the ice depth alone. Those categories are part of the result because they tell the next reader which uncertainty can move which conclusion.
        rebuttals:
          - The cooling is not a direct surface measurement; it arrives through a fitted slope
          - The age below the counted section is not checkable against next season's stakes
          - The gas concentration is well measured and its date is the modelled part of it
        columns:
          - The season's number
          - What it actually rests on
        scenarios:
          - Accumulation of 0.119 metres of ice equivalent a year
          - A cooling of 2.7 degrees in the cold interval
          - An age of 18,400 years at 2,100 metres
          - Carbon dioxide of 190 parts per million in the cold interval
        choices:
          - Measured directly at the surface, and checkable against next season's stakes
          - Measured, then converted through a slope fitted to 11 years of overlap
          - Counted as far as the layers allowed, and modelled below that
          - Measured on air that is well mixed, at a depth whose own age is modelled
        mapping: [0, 1, 2, 3]
        guide: Four headline numbers, and four descriptions of how each was got. Pair them by asking how many steps sit between the instrument and the number. One is a direct surface measurement checkable next year. One passes through a slope fitted to eleven years. One is counted where counting worked and modelled below. And one is a solid measurement attached to a modelled date.
        background:
          - Why this is a matching board and not four separate questions. Responses on boards like this are written to be plausible for more than one situation. Choosing them one at a time lets a nearly-right answer through unexamined. Having to place all of them forces the comparison. The question is not "is this reasonable here", but "is it more right here than there".
          - How to use the one-each rule. The responses are a set to be distributed rather than a list to be sampled. So every join you make constrains the rest. Settling the two you are confident of can leave the remaining pair decided by elimination. Where it does not, two responses are still competing for one situation. That is exactly the distinction the stop is testing.
          - Why you cannot be wrong about exactly one. With every response used once, three correct joins leave the fourth with only one place to go. Any error therefore involves at least two joins. That is worth remembering when the last pair looks forced. The fault is usually not in the join you are struggling with. It is in one you made early and stopped questioning.
        concept: "What a proxy is: the chain between the thing and the number"
      - group: COLD
        task: State the time resolution the ice can actually preserve
        title: The shortest thing this ice can show
        place: Cold Laboratory
        question: Estimate the near-surface event duration that corresponds to twice the firn diffusion length.
        scene: Tanabe has the firn diffusion length and the annual layer thickness at deposition. Before the final sign-off, the next team wants one number. It is the shortest surface event the isotope archive could keep, before deep-flow thinning is considered.
        assumes:
          - water molecules move through firn before the pores seal, averaging nearby layers together
        takeaway: A simple resolution estimate is valid only on the depth scale for which its diffusion length and layer thickness are defined.
        reason: The next team wants one number for the shortest event this archive could keep, and nobody has stated it
        format: BALLPARK
        why: Water-isotope variations are smoothed by molecular diffusion while the snow is still firn. Using twice the diffusion length as a simple width criterion gives 0.16 metres. Dividing by the 0.119-metre annual layer at deposition gives about 1.3 years. This is deliberately a near-surface estimate. Deeper in the core, ice flow changes both the annual layers and the diffusion profile they inherited. So the time resolution has to be carried through a thinning-and-diffusion model. Reusing the surface diffusion length unchanged does not work down there.
        estimate:
          prompt: The firn diffusion length at deposition is 0.08 metres, and one annual layer is 0.119 metres of ice equivalent.
          question: Estimate the near-surface duration corresponding to twice the diffusion length.
          labels:
            - 0.08 m  (firn diffusion length)
            - 2  (rule-of-thumb width factor)
            - 0.119 m/yr  (annual layer at deposition)
            - 0.62  (mean firn density relative to ice)
          values: [0.08, 2, 0.119, 0.62]
          slots: 3
          template: "{1} × {0} ÷ {2}"
          formula: b*a/c
          correct: [0, 1, 2]
          target: 1.34
          tolerance: 0.2
          units: years
          solution: 2 × 0.08 ÷ 0.119 = 1.34 years.
          explanation: The mean firn density is useful for converting the close-off column to ice equivalent; it is not part of this diffusion-timescale estimate.
          relationship: shortest event = 2σ ÷ λ — twice the diffusion length, divided by the thickness of 1 annual layer.
        guide: Use the diffusion length and the surface annual layer thickness only. Twice the diffusion length is a rule-of-thumb width below which a feature is strongly smoothed in firn. Dividing that width by one year's deposited thickness gives a near-surface timescale. Do not use the deep layer thickness here. Once the ice has flowed and thinned, the diffusion profile has been thinned with it. The deep resolution then needs a forward model rather than this shortcut.
        background:
          - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated. Nothing here has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs. Then, whether the size of the answer looks right once they are in place.
          - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label catches a unit mismatch before it is placed. It also catches a quantity belonging to a different part of the problem. That is the habit this format exists to build.
        concept: Diffusion in firn, and the short events it erases
        answerText: About 1.3 years as a rule-of-thumb near-surface resolution before deep-flow thinning is modelled.
      - group: DATA
        task: Make the release decision
        title: Sign the Vestri Record
        place: Science Module
        question: What do you sign?
        scene: The final page is on Halvorsen's screen. The Vestri cooling estimate is ready and the laboratory-scale offset with Skarv is measured. The chronology correction is real but uncertain, and the deep ages are still model-dependent. Four dispositions are possible. Only one says everything the evidence supports without claiming what the season did not settle.
        assumes:
          - a claim is supported when the evidence would have come out differently if it were false
        takeaway: The strongest defensible conclusion is the one that keeps the measurement and its limits together.
        reason: The final page is on the screen, the aircraft leaves Wednesday, and four dispositions are still possible
        format: CHOICE
        why: The record has enough evidence to be useful and not enough evidence to support the strongest possible story. Vestri's accumulation, isotope measurements, gas concentrations, counted chronology, and independent tie points all survive the audit. The deep ages remain model-dependent. The 0.4 per mil laboratory offset is measured. The gas–ice clock mismatch is a demonstrated contributor to the gap that is left. The size of the final residual is still not known tightly enough. It cannot be called full agreement, and it cannot be called different climates. Signing the qualified release preserves the result and the uncertainty together. That is the scientific decision the fifteen days were for.
        rebuttals:
          - The best-fit correction is not known exactly, so it cannot support an unconditional consistency claim
          - A possible residual is not evidence that climate caused it once chronology uncertainty still spans that residual
          - Science does not require zero model uncertainty; it requires that the uncertainty and dependencies be stated honestly
        choices:
          - Release the Vestri record, state its calibration and deep-age limits, and report that methods explain part of the Skarv mismatch while the remainder is unresolved
          - Release both records as fully consistent because the best-fit clock correction leaves only 0.15 per mil
          - Release a claim that Vestri and Skarv experienced different cooling because a residual can remain at the low end of the correction
          - Hold the Vestri record until every model uncertainty is removed and the two cores agree exactly
        answer: Release the Vestri record, state its calibration and deep-age limits, and report that methods explain part of the Skarv mismatch while the remainder is unresolved
        guide: Four sentences, all of them true in some sense. Ask of each what it claims beyond what was measured here. One calls two records independent, and below the counts they share a flow model. One rounds until the uncertainty disappears. One is a claim about every record at this latitude, and nobody here has read them all.
        background:
          - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading. A step skipped. A quantity confused with a rate. A correlation taken for a cause. Identifying which misreading each belongs to is where the learning is. The right answer alone can be reached on instinct and teach nothing.
          - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance. Before it was fixed, that was 88 per cent of passage quizzes here. It is now checked per game as a binomial tail. Length, hedging and specificity have had the signal taken out of them deliberately.
          - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them. Each is the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason is indistinguishable from a sound one. That holds until the day the approximation is what is being tested.
        concept: Model against data, and what a mismatch can mean

# Why this campaign takes each of the seven runs that open a morning.
warmups:
  greet:
    title: Fourteen people, one season, and the aircraft leaves on Wednesday
    why: The camp is fourteen people who will be within fifty metres of each other for six weeks, and half of them arrived on the last flight. Halvorsen, the chief scientist, wants as many of them known to you as you can manage before the drill turns, because on a plateau the only thing you cannot fix later is a working relationship.
  trial-near:
    title: Walk the camp while the weather is holding
    why: Modules on legs, flag lines between them, and a trench under the drill tower. Walk it all once now, in clear air, because the next time you cross the camp in a hurry it will be in blowing snow where the flag lines are the only thing telling you where the next module is.
  follow:
    title: Lindqvist walks the drill floor round once
    why: "The drill has a rhythm and it is not written down anywhere: which valve is checked at which point in the run, which noise means the barrel is loading. Lindqvist, the drill engineer, walks it once. Stay with him and stay out of the winch path, which is the one part of this camp that will not stop for you."
  hunt:
    title: Six core boxes on the manifest, four in the trench
    item:
      name: core box
      plural: core boxes
    why: The aircraft takes what is boxed and labelled, and two boxes from last week are not where the manifest says. Until they are found nobody can say what is flying out and what is staying another year, and ice that stays another year is ice with another year's temperature history on it.
  canvass:
    title: Who actually heard the generator stop
    why: The number two generator stopped some time in the night and the log says nothing about it. How long the core store was without power decides what the season can claim. Ask round the camp until enough accounts agree on when the lights flickered.
  evade:
    title: The film crew who want you in shot
    why: There is a documentary team on the plateau this week and they want somebody standing at the drill looking thoughtful. The core comes up whether or not anybody is filming it, and a section that sits at the wrong temperature while somebody adjusts a light is a section nobody can use. Keep out of shot.
  tag:
    title: Catch Okonkwo before she goes into the counting room
    why: Okonkwo, the chronology lead, has the layer count for the brittle section, and it is the only thing that puts today's depths on a year scale. Once she is in the counting room with the lights down she is not interrupted for anybody, and every date this afternoon rests on that count.

# Lessons no mission stop points at — review variants and spares. Reachable as callbacks.
lessons:
  - group: DRILL
    task: Order the work on a section that cannot be drilled again
    title: The run through the brittle zone — Review
    place: Core Line
    scene: The core line technician, Sigrid Holt, has a section from 1,150 metres on the light table. Four teams are down on the request sheet for a piece of it. Nothing on the sheet says which of them goes first.
    takesAsRead:
      - "Why ice keeps a record at all: burial without melting"
    assumes:
      - a length of ice removed from a core cannot be put back
    takeaway: Where a sample cannot be replaced, the order of work is set by what each step spends.
    format: SEQUENCE
    why: Ice gets one reading. So the order of work on a section is decided by what each operation costs, rather than by when anybody wants it. A photograph can be taken again next season. A non-contact scan reads the outside and leaves everything. A trim gives up the skin that handling and drill fluid have already reached, and keeps the core. A melt turns a length of ice into a number and nothing else, and a crush ends the section. Run that order backwards and no time is lost — the measurements the earlier steps would have made are.
    cards:
      - Photograph the whole section on the light table, which touches nothing and can be repeated
      - Log the breaks and read the density along its length with the non-contact scanner
      - Take the outer trim for chemistry, leaving the inner core whole
      - Cut the inner core into sample lengths and melt them for the isotope run
      - Crush what is left of the ice under vacuum to release the trapped air
    order: [0, 1, 2, 3, 4]
    axis: Order the five operations by how much of the section each one spends, from the one that leaves it exactly as it arrived to the one that ends it. Nothing here has to happen at a particular hour.
    ends:
      - Leaves the ice as it arrived
      - Ends the section
    guide: Five operations, all of which will happen to this section. Nothing here has to happen at a particular hour, so reading the rail as a timetable finds nothing. Ask of each how much of the section it spends. Whether it could be done again next season. Whether it leaves the inner core whole. Or whether the ice is gone once it is finished.
    background:
      - Why the order is graded whole. A sequence is a claim about dependency. Each step is here because the one before it has already happened, or has to have. One transposed pair falsifies that claim wherever it sits. Partial credit would be credit for a sequence that does not work.
      - Why the ends are the place to start. The first and last cards are constrained by having nothing before or after them. That usually makes them the two you can settle from the scene alone. Pinning them collapses the remaining arrangements sharply. What is left in the middle is where the actual judgement lives.
      - What the rail can be ordered on. Time is the usual axis, but it is not the only one. An order can run on cost, on risk, or on reversibility. Reversibility puts every observation that leaves the sample as it was before any that consumes it. On those boards a chronological reading finds nothing. None of the steps has to happen at a particular hour.
    concept: "Drilling: fluid, brittle ice and what damage costs the record"
  - group: CORE
    task: Attribute four features on a deeper section, and find the annual layer among them
    title: What makes one year different from the next — Review
    place: Core Line
    scene: The chronology lead, Ines Okonkwo, has a metre from 540 metres on the light table. It is deeper than anything counted this week. Four features on it have to be attributed before the section is released to the teams.
    assumes:
      - a feature in the ice was put there by something with a duration of its own
    takeaway: A feature is a year only where whatever made it repeats every year.
    format: PROTOCOL
    why: Attribution is the step before counting. It runs on what a feature is made of, and how long the thing that made it lasted. Acid arrives with an eruption and stops when the eruption does, so a pair of spikes is two events rather than two years. Sea salt is delivered by weather that shifts over decades. Coarse crystals with large bubbles are one surface that sat in the sun. Only the even banding is compression repeating on a yearly beat, and only that one can be counted.
    rebuttals:
      - Sodium is carried in by weather rather than laid down by an eruption, and weather does not stop after a season
      - A decade of stormier winters is a slow rise and fall, not a band of grown crystals
      - Repeated banding is compression happening again and again, which no single exposed surface can produce
    columns:
      - What is in the ice
      - What put it there
    scenarios:
      - Two sulphate spikes four centimetres apart
      - A steady rise and fall in sodium across thirty centimetres
      - A single band of coarse crystals with large bubbles in it
      - A run of a dozen evenly spaced light and dark bands
    choices:
      - Two eruptions a few years apart, each laying down its acid and then stopping
      - A stormier stretch of winters driving marine air inland for a decade or so
      - A summer surface that sat exposed long enough for its crystals to grow before burial
      - Successive years, each compressed by about the same amount on its way down
    mapping: [0, 1, 2, 3]
    guide: Four features and four things that could have made them. Pair them by asking two questions of each. What the feature is physically made of. And how long whatever made it went on for. An eruption lasts a season or two. A shift in the weather lasts decades. A surface lasts a summer. Only one of these four repeats on a yearly beat, and that is the one a count can be built on.
    background:
      - Why this is a matching board and not four separate questions. Responses on boards like this are written to be plausible for more than one situation. Choosing them one at a time lets a nearly-right answer through unexamined. Having to place all of them forces the comparison. The question is not "is this reasonable here", but "is it more right here than there".
      - How to use the one-each rule. The responses are a set to be distributed rather than a list to be sampled. So every join you make constrains the rest. Settling the two you are confident of can leave the remaining pair decided by elimination. Where it does not, two responses are still competing for one situation. That is exactly the distinction the stop is testing.
      - Why you cannot be wrong about exactly one. With every response used once, three correct joins leave the fourth with only one place to go. Any error therefore involves at least two joins. That is worth remembering when the last pair looks forced. The fault is usually not in the join you are struggling with. It is in one you made early and stopped questioning.
    concept: Annual layer counting, and where counting fails
  - group: COLD
    task: Say what a quiet control has established
    title: The sample that was clean until it was handled — Review
    place: Cold Laboratory
    question: What does this panel support?
    scene: The cold laboratory technician, Elena Cruz, has a calcium result twice the runs either side of it. Both blanks are ordinary and the outer centimetre was trimmed to specification. The replicate core from the second hole doubles at the same depth.
    takesAsRead:
      - "What a proxy is: the chain between the thing and the number"
    assumes:
      - a blank is run through the same process as a sample, with no sample in it
    takeaway: A control that did not move is a measurement, not the absence of one.
    format: CHOICE
    why: A blank is the process with no ice in it. So an ordinary blank is a positive statement about everything the sample touched on the way to the instrument. The saw, the gloves, the vials, the acid. Both of them are ordinary. The outer centimetre was trimmed, so the surface handling is out as well. What is left is a second core, recovered from a different hole, doubling at the same depth. Two independent recoveries agreeing on a number is the ice speaking, and the quiet readings are what allow it to be heard.
    rebuttals:
      - A blank that catches sodium at a tenth of this level is not blind to calcium at twice it
      - The bench is inside what a blank measures, and both blanks came back at the usual level
      - A third hole would add a recovery, and two independent ones already rule out the process
    choices:
      - The doubling is in the ice, since the controls that would have moved did not
      - The doubling is contamination the blanks are not sensitive enough to have caught at this level
      - The doubling arrived at the cutting bench, which both of these sections passed over before melting
      - Nothing can be concluded until a third hole has been drilled and sampled at the same depth
    answer: The doubling is in the ice, since the controls that would have moved did not
    guide: Four readings of one panel, and the argument turns on what a control that did not move is worth. Ask of each option which reading it would need to have gone the other way. A blank is the process with no ice in it. So an ordinary blank speaks for everything the sample touched. A second hole speaks for everything this hole did.
    background:
      - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading. A step skipped. A quantity confused with a rate. A correlation taken for a cause. Identifying which misreading each belongs to is where the learning is. The right answer alone can be reached on instinct and teach nothing.
      - Why a clean control is a result. A reading that stays where it always sits is easy to skip past. It is the only kind of reading that can rule a mechanism out. The loud number is consistent with several explanations at once; the quiet ones are consistent with fewer, which is what makes them decisive.
      - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them. Each is the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason is indistinguishable from a sound one. That holds until the day the approximation is what is being tested.
    concept: Contamination and blanks in a cold laboratory
  - group: FIELD
    task: Weigh the flank camp's snow against the record length it buys
    title: How thick a year is here — Review
    place: Snow Study Hut
    question: Estimate the flank camp's accumulation in ice equivalent.
    scene: The field glaciologist, Nadia Brandt, is back from the flank camp forty kilometres downslope with a pit wall of her own. The last summer surface there sits seventy-one centimetres down, and the snow above it is denser than anything on the dome.
    takesAsRead:
      - Accumulation rate, and what a site with little snow buys and costs
    assumes:
      - snow becomes ice by being compressed under the snow that falls on it
    takeaway: A wetter site writes finer layers and runs out sooner, and ice equivalent is what shows the trade.
    format: BALLPARK
    why: Choosing a site is choosing between the detail a core carries and the span it covers. That trade only becomes visible once both sites are stated in the ice their snow will become. The flank camp catches more than twice the snow and lays it down denser. So its layers stay thick enough to count far deeper than the dome's. It pays at the bottom. The same three kilometres of ice is spent in a third of the time. The oldest year in it is a few thousand rather than tens of thousands.
    estimate:
      prompt: The last summer surface at the flank camp sits 0.71 metres down, in snow of density 385 kilograms per cubic metre.
      question: Estimate the flank camp's accumulation in metres of ice equivalent.
      labels:
        - 0.71 m  (the flank camp's snow layer)
        - 385 kg/m³  (density of that snow)
        - 917 kg/m³  (density of solid ice)
        - 88 m  (close-off depth on the dome)
        - 0.119 m/yr  (the dome's own accumulation in ice equivalent)
      values: [0.71, 385, 917, 88, 0.119]
      slots: 3
      template: "{0} × {1} ÷ {2}"
      formula: a*b/c
      correct: [0, 1, 2]
      target: 0.298
      tolerance: 0.03
      units: m ice equivalent per year
      solution: 0.71 × 385 ÷ 917 = 0.298 m of ice equivalent.
      explanation: "The close-off depth and the dome's own rate are the tiles that do not belong: both are answers to other questions, and neither describes the snow in this pit."
      relationship: b = λ × ρ_snow ÷ ρ_ice — the measured layer thickness λ, scaled by the density of the snow against the density of solid ice.
    guide: Five numbers, and only three of them describe the flank pit. Ask of each whether it says something about that snow as it lies. The close-off depth and the dome's own ice-equivalent figure are on the board so the two sites can be compared afterwards. They do not go into the sum. The conversion is the one you ran on the dome, on a site that is not the dome.
    background:
      - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated. Nothing here has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs. Then, whether the size of the answer looks right once they are in place.
      - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label catches a unit mismatch before it is placed. It also catches a quantity belonging to a different part of the problem. That is the habit this format exists to build.
    concept: Resolution against record length — what choosing a site decides
    answerText: About 0.30 metres of ice equivalent a year — roughly two and a half times what the dome lays down.

# What each place says when the player reads it.
copy:
  DRILL: <p>The drill trench, roofed and dug into the snow, with the tower over the hole and the winch drum turning slowly. Everything here is one attempt.</p>
  CORE: "<p>The core line: a long lit bench where every metre is measured, logged and cut in the order it came out of the ground.</p>"
  COLD: <p>The cold laboratory at minus 25, where samples are melted exactly once and nobody stays longer than an hour.</p>
  GAS: <p>The gas laboratory, a vacuum line with 14 fittings and a rule about each 1. What comes off the ice here is old air.</p>
  FIELD: <p>The snow study hut, and the mast and stake array beyond it. The only measurements on this station that can be checked against the thing they measure.</p>
  DATA: "<p>The science module: screens, the season's records, and the argument about what they support.</p>"


  # ------------------------------------------------------------------ day 8
  - title: The year that is written everywhere
    objective: Use a dated eruption to tie this core to another one, and know what that tie does not fix.
    briefing: A sulphate spike at 1,642 metres could be the anchor the deep section needs.
    stake: >-
      Monday. The chemistry has found a sulphate spike at 1,642 metres with glass shards in it.
      If it is the eruption Okonkwo thinks it is, the deep section gets its first fixed date.
      The two records get their first shared point as well. Adeyemi wants to know what that does
      for the gas record. The forecast gives Brandt one clear day, and she has three jobs that
      want it. Today you identify the spike, say what a tie point fixes, and choose what gets
      done before the wind comes back. A layer named wrongly is worse than no layer at all.
      Every age below it takes on the same mistake. The record then looks better dated than it
      is.
    takeaway: A dated event in two records fixes them to each other at that moment, and nowhere else.
    stops:
      - group: CORE
        task: Identify the horizon
        title: The spike at 1,642 metres
        place: Core Line
        scene: >-
          One sulphate spike, two candidate eruptions of similar age, and a set of glass shards
          recovered from the same centimetre. Okonkwo has the shard chemistry, the layer count and
          the modelled age on the bench.
        guide: >-
          Five readings, and only one of them is independent of the timescale. Ask of
          each whether it could tell two eruptions ninety years apart from each other.
          The modelled age cannot: its own uncertainty is wider than the gap. Sea-salt
          sulphate does not arrive with volcanic glass. And the layer count stopped four
          hundred and sixty metres higher up.
        background:
          - >-
              Why the unremarkable readings decide it. The salient reading is what draws
              attention. It is usually consistent with several explanations at once, which is
              why it rarely settles anything. The readings that discriminate are the ones a
              candidate predicts should have moved, and which have not. A normal value is a
              positive result against every mechanism that would have disturbed it.
          - >-
              How to work the candidates. Take each mechanism and predict the panel it implies
              before you look at the panel again. Which readings it drives, in which direction,
              and by roughly how much. Then compare. Working that way round is what separates a
              diagnosis from a rationalisation. The prediction is made before the data is
              consulted.
          - >-
              Why only one candidate survives. Several will account for part of the panel,
              deliberately so. A partial fit is exactly what a confident wrong answer feels like
              from the inside. When two remain, look for the reading on which their predictions
              differ and let it decide. If no reading separates them you have not finished
              reading the panel.
        assumes:
          - volcanic glass carries the chemical composition of the volcano that erupted it
        takeaway: A horizon is identified by what is in it, not by the date it would be convenient for it to have.
        format: DIAGNOSIS
        headline: A sulphate spike at 1,642 m, with glass shards, and 2 candidate eruptions within a century of each other.
        readings:
          - { zone: Sulphate, label: Peak height, value: 8× background, status: alarm }
          - { zone: Glass shards, label: Composition, value: 'high-potassium, matches the northern candidate', status: alarm }
          - { zone: Layer count, label: Age at this depth, value: 'stopped 460 m above', status: low }
          - { zone: Flow model, label: Modelled age, value: 'within 90 years of both candidates', status: normal }
          - { zone: Replicate core, label: Same spike, value: 'present, 1.1 m shallower', status: normal, note: 'the 2 holes are 400 m apart' }
        choices:
          - label: The northern eruption, identified by the shard chemistry
            mechanism: Glass composition is specific to a volcano and does not depend on the timescale.
          - label: The southern eruption, since the modelled age fits it slightly better
            mechanism: The flow model puts this depth marginally closer to the southern date.
          - label: Neither; the spike is a sea-salt sulphate peak
            mechanism: Marine sulphate can produce peaks without any volcano at all.
          - label: Undecidable until the layer count is extended down to it
            mechanism: Nothing can be assigned a date without a continuous count reaching it.
        answer: The northern eruption, identified by the shard chemistry
        why: >-
          The shard chemistry is the only reading here that is independent of the timescale. It
          is the one that discriminates. Glass composition is a fingerprint of a particular
          magma and a particular volcano. The modelled age cannot choose between 2 candidates 90
          years apart because its own uncertainty is larger than that gap. Sea-salt sulphate
          does not arrive with volcanic glass. And waiting for the layer count is waiting for
          something that stopped 460 metres higher. That is the reason a dated horizon matters
          here at all.
      - group: GAS
        task: Say what the tie point does for the gas
        title: What a dated ash layer fixes
        place: Gas Laboratory
        scene: >-
          Adeyemi has the eruption date and the depth it sits at. Beside them are the carbon
          dioxide measurements from the bubbles in the same section of core.
        guide: >-
          Four things a dated ash layer might fix. Ask of each which of the two clocks
          in the core it belongs to. Ash falls on the surface and is buried with the
          snow. The air beside it was sealed centuries later and lower down. So a tie
          point fixes one clock and leaves the other to a calculation. That is why the
          age difference has to be estimated first.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be
              the answer under one specific misreading. A step skipped. A quantity confused with
              a rate. A correlation taken for a cause. Identifying which misreading each belongs
              to is where the learning is. The right answer alone can be reached on instinct and
              teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance. Before it was fixed, that was 88 per
              cent of passage quizzes here. It is now checked per game as a binomial tail.
              Length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them. Each is the reason that option fails, not a restatement of
              the right one. They are worth reading after a correct answer as well. A right
              choice made for an approximate reason is indistinguishable from a sound one. That
              holds until the day the approximation is what is being tested.
        assumes:
          - volcanic ash settles out of the atmosphere within a year or two of an eruption
        takeaway: A tie point dates the material it is in, and anything else has to be reached by a calculation.
        format: CHOICE
        question: What does the dated horizon fix?
        answerText: The age of the ice at that depth. The age of the gas in the same section still has to be reached by subtracting the age difference.
        choices:
          - The age of the ice at that depth, and nothing else on its own
          - The age of both the ice and the gas at that depth, since they are in the same section
          - The age of the gas, because the ash and the atmosphere arrived together
          - The accumulation rate at that time, from the thickness of the ash layer
        answer: The age of the ice at that depth, and nothing else on its own
        why: >-
          Ash falls onto the surface and is buried with the snow, so it dates the ice it sits
          in. The air in the bubbles beside it was sealed centuries later, at the close-off
          depth, and it is that much younger. A tie point therefore fixes one of the two clocks
          in the core. The other one has to be reached by calculation. That is exactly why the
          age difference has to be estimated. It has to be done before any comparison between a
          gas record and an ice record can be made.
        rebuttals:
          - The two clocks are in the same section and are not the same clock, which is what the age difference measures
          - Ash arrives at the surface, and the air at that depth stopped moving centuries after it was buried
          - A layer thickness gives an accumulation rate only once its own age scale is known
      - group: FIELD
        task: Spend the clear day
        title: One clear day, three jobs
        place: Snow Study Hut
        scene: >-
          Brandt has a forecast that gives her one clear day and then four of blowing snow. Three
          jobs are outstanding and each takes most of a day on its own.
        guide: >-
          Four jobs, all of them a day's work. Ask of each whether it could be done in
          four days of blowing snow, and whether the storm changes what it measures. The
          pit is beside the hut and the mast is on a fixed line. One of these runs two
          kilometres out and measures a surface that drifting snow rearranges.
        background:
          - >-
              Why first is a different question from most important. When several calls compete
              for the same hour, what a choice is worth is not its own importance. It is the
              difference between doing it now and doing it later. A serious problem that will be
              no worse in an hour costs nothing to defer. A smaller one that closes a door costs
              everything behind that door.
          - >-
              What to look for in the options. Two things separate them. Which is still
              changing, and which is a precondition for the others. A situation that is
              deteriorating has a cost per hour attached to it. A step that unblocks the rest
              multiplies the value of the hours after it. Everything else is a preference about
              where to start.
          - >-
              Why only one answer is marked. In the situation these options describe, all of
              them eventually happen. What is being tested is the head of the queue, because
              that is where the reasoning is visible. The verdict names what each of the others
              was waiting on. That is worth reading even when the choice was right. The ordering
              behind the first place is the rest of the answer.
        assumes:
          - a measurement that cannot be repeated should be taken when it can be taken
        takeaway: Order the work by what becomes impossible, not by what is most important.
        format: TRIAGE
        question: Which job takes the clear day?
        answerText: The stake farm. It is the only one of the three that cannot be done in blowing snow, and a missed reading is a gap in the accumulation series that nothing can fill later.
        choices:
          - Read and re-level the stake farm across the whole array
          - Dig and photograph the fortnightly snow pit beside the hut
          - Service the mast instruments and download the temperature record
          - Re-drill the shallow firn core that broke last week
        answer: Read and re-level the stake farm across the whole array
        why: >-
          Two of these can be done in bad weather and one cannot. The pit is beside the hut, and
          the mast is a short walk on a fixed line. Both survive four days of blowing snow with
          nothing worse than discomfort. The stake array runs two kilometres out and needs
          visibility to level against. More to the point, blowing snow redistributes the surface
          the stakes are measuring. A reading taken after the storm is measuring something
          different. The shallow core can be re-drilled in any weather at all.
        rebuttals:
          - The pit is a few metres from the hut door and can be dug in any weather
          - The mast is on a fixed line and its record is stored until somebody collects it
          - A firn core that broke can be re-drilled whenever the drill is free
  # ------------------------------------------------------------------ day 9
  - title: Where the record runs out
    objective: Establish how thin the deep layers are and which uncertainty dominates what is claimed from them.
    briefing: The drill is at 2,410 metres and every year down there is a few millimetres thick.
    stake: >-
      Tuesday. The drill has passed 2,400 metres. Lindqvist has clean core coming up. Okonkwo
      has ages that no longer come from counting anything. Halvorsen wants the deep section in
      the season summary. That means saying how well it is dated. Aalto has three sources of
      error to combine before anybody writes a number down. Today you work out how thin a year
      is at that depth. You decide which error is worth the season's last days. And you settle
      what the ice just above the bed can be used for. Deep ice is the whole reason this hole
      was drilled. It is also the part with the least evidence behind it.
    takeaway: The deepest ice holds the longest record and the weakest claim about it.
    stops:
      - group: DRILL
        task: Work out how thin a year is down there
        title: A year at 2400 metres
        place: Drill Trench
        scene: >-
          The ice is 3,010 metres thick here and the barrel is at 2,400. At the surface a year is
          about 0.119 metres of ice equivalent, and Lindqvist wants to know what one is now.
        guide: >-
          Four numbers, and one of them is the close-off depth, which belongs to the
          firn rather than to the flow. Ask of each whether it describes the surface,
          this depth, or the whole sheet. The thinning depends on how much ice is left
          below, so what matters is the distance to the bed. That is what packs a
          hundred thousand years into the bottom kilometre.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is already
              measured or stated. Nothing here has to be derived. What is being tested is
              whether you can pick the quantities the relationship actually needs. Then, whether
              the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label catches a unit mismatch before it
              is placed. It also catches a quantity belonging to a different part of the
              problem. That is the habit this format exists to build.
        takesAsRead:
          - Annual layer counting, and where counting fails
        assumes:
          - ice spreads outwards under its own weight, stretching the layers below
        takeaway: A simple thinning model gets the direction right and the size wrong. That is why a counted record and a modelled one end in different places.
        format: BALLPARK
        question: What does simple thinning predict for one annual layer at 2,400 metres?
        answerText: About 0.024 metres — a fifth of a surface year, or 24 millimetres. The line measures 1.5 millimetres there, so the real thinning near the bed is sixteen times what uniform strain predicts.
        why: >-
          Ice flows outwards from the dome, and to keep going it has to stretch. So each layer
          thins as the weight above it grows. The simplest model treats the vertical strain as
          uniform. That makes a layer's thickness fall in proportion to the distance left to the
          bed. At four-fifths of the way down, a layer is one-fifth of what it was. That gives
          24 millimetres here. The scanner reads 1.5. The model is not wrong about the
          direction. It is wrong about the size, because strain is not uniform near a bed the
          ice is being dragged over. That is the whole reason the counted record stops at 2,180
          metres. The modelled one carries on to the bottom with an uncertainty attached.
        estimate:
          prompt: The ice is 3,010 metres thick and the sample is from 2,400 metres. A year at the surface is 0.119 metres of ice equivalent.
          question: Estimate the thickness of one annual layer at that depth.
          relationship: λ(z) = λ₀ × (H − z) ÷ H — the layer's original thickness, scaled by how much of the ice sheet is left below it.
          labels:
            - 0.119 m  (a year at the surface)
            - 3010 m  (total ice thickness)
            - 2400 m  (depth of this sample)
            - 88 m  (close-off depth)
          values: [0.119, 3010, 2400, 88]
          slots: 3
          template: '{0} × ({1} − {2}) ÷ {1}'
          formula: a*(b-c)/b
          correct: [0, 1, 2]
          target: 0.0241
          tolerance: 0.003
          units: m per year
          solution: 0.119 × (3010 − 2400) ÷ 3010 = 0.0241 m.
          explanation: The close-off depth belongs to the firn at the top of the core and has nothing to do with how the deep layers are stretched.
      - group: DATA
        task: Find the uncertainty worth reducing
        title: Which width the answer is made of
        place: Science Module
        scene: >-
          Aalto has the dust flux from the cold interval and four quantities behind it, each with
          its own uncertainty. There is time to improve one of them before the season ends.
        guide: >-
          The panel shows an error budget: each input's own width, times the power it carries in
          the calculation, contributes a bar. Read the bars rather than the inputs. There is
          time to improve one quantity before the season ends. So buy the measurement that
          shortens the tallest bar. Not the one that is easiest to improve.
        background:
          - >-
              How the widths combine. In a product of quantities, the fractional
              uncertainties add in quadrature, each weighted by its exponent. A quantity
              raised to a power contributes that much more, and one measured badly can
              dominate even with an exponent of one.
          - >-
              Why the largest quantity is not the widest one. A big number measured precisely
              contributes little; a small one measured roughly can carry the whole budget. The
              bars are what separate those two. The intuition to be resisted is the one that
              goes by the size of the number.
          - >-
              Why improving the wrong term is worse than doing nothing. It spends the last of
              the season and moves the total uncertainty by almost nothing. And it produces a
              report that looks more careful than it is.
        assumes:
          - a quantity multiplied into a result carries its own uncertainty into that result
        takeaway: A term's contribution is its own width multiplied by the power it is raised to. The largest power is not always the largest contribution.
        format: PROPAGATE
        question: Which measurement should the remaining time buy?
        answerText: The past accumulation rate. Its 30% uncertainty enters once and still dominates everything else on the board, including the grain diameter that is cubed.
        propagate:
          hint: >-
            Each term contributes its own fractional width times the power it is raised to. The bar
            is that contribution, not the power.
          output: { label: Dust flux during the cold interval, unit: 'mg m⁻² yr⁻¹' }
          costUnit: days
          budget: 3
          inputs:
            - { id: diameter, label: Mean grain diameter, value: 2.1, unit: µm, sigmaFrac: 0.05, exponent: 3 }
            - { id: number, label: Grain number concentration, value: 41000, unit: 'per mL', sigmaFrac: 0.10, exponent: 1 }
            - { id: accum, label: Accumulation rate at the time, value: 0.06, unit: 'm ice eq/yr', sigmaFrac: 0.30, exponent: 1 }
            - { id: rho, label: Mineral density, value: 2650, unit: 'kg/m³', sigmaFrac: 0.04, exponent: 1 }
          improvable:
            - { id: diameter, label: Size every grain in four more sections, cost: 2, newSigmaFrac: 0.02 }
            - { id: accum, label: Layer-count the cold interval in the replicate core, cost: 3, newSigmaFrac: 0.08 }
            - { id: number, label: Recount at higher dilution, cost: 1, newSigmaFrac: 0.05 }
          dominant: accum
          commit: Book the work
        why: >-
          A term enters the result raised to some power. Its contribution to the width of the
          answer is that power multiplied by its own fractional uncertainty. The grain diameter
          is cubed, which makes it look like the term to fix. But it is known to 5%, so it
          contributes 15. The accumulation rate enters once and is known to 30, so it
          contributes twice as much on its own. Ranking by exponent is a reasonable habit and it
          picks the wrong measurement here.
      - group: CORE
        task: Say what the deepest ice is good for
        title: The last hundred metres
        place: Core Line
        scene: >-
          Holt has core from the bottom of the drilled section. The layers are folded back on
          themselves in places and the isotope profile has reversals in it that no year could
          produce.
        guide: >-
          Four options for folded basal ice. Ask of each what has been lost and what has
          not. The material is unchanged; the order is gone. So anything where depth
          means time is ruled out, and anything an unordered sample can answer is not.
          Note also what has to travel with the data, because the next person will not
          see the fold.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to be
              the answer under one specific misreading. A step skipped. A quantity confused with
              a rate. A correlation taken for a cause. Identifying which misreading each belongs
              to is where the learning is. The right answer alone can be reached on instinct and
              teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance. Before it was fixed, that was 88 per
              cent of passage quizzes here. It is now checked per game as a binomial tail.
              Length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them. Each is the reason that option fails, not a restatement of
              the right one. They are worth reading after a correct answer as well. A right
              choice made for an approximate reason is indistinguishable from a sound one. That
              holds until the day the approximation is what is being tested.
        assumes:
          - ice near the bed has flowed over rough ground for a long time
        takeaway: Ice can be perfectly good material and still hold no readable order.
        format: CHOICE
        question: What is the folded basal section still good for?
        answerText: Anything that does not need the layers to be in order — gas composition, total gas content, the age of the oldest ice present — with its stratigraphy declared as disturbed.
        choices:
          - Measurements that need no ordered layers, with the disturbance recorded
          - Nothing; disturbed ice is removed from the record and archived unmeasured
          - The same measurements as the rest of the core, since the ice itself is unaltered
          - Dating only, since the oldest ice is what the deep section was drilled for
        answer: Measurements that need no ordered layers, with the disturbance recorded
        why: >-
          Ice near the bed has been dragged over rough ground for a long time, so layers are
          folded, sheared and sometimes overturned. The material is unchanged and the order is
          gone. That rules out anything that depends on depth meaning time. A temperature
          history, a layer count, a rate of change. It does not rule out what an unordered
          sample can still answer. What gases are present. How much air the ice holds. How old
          the oldest ice down there is. The disturbance has to travel with the data, because the
          next person will not see the fold.
        rebuttals:
          - Archiving it unmeasured discards answers that never depended on the order
          - The ice is unaltered and the stratigraphy is not, and half the measurements need the stratigraphy
          - Dating disturbed ice gives the age of a fragment rather than the age of a depth

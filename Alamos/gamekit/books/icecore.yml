# Ice Core — Vestri Dome, and the season that had to decide what it had found.
#
# Written to gamekit/tools/BOOK_TEMPLATE.md. The place is themes/icecore/site.js;
# the plan it came from is in ../GAME_IDEAS.md under "Ice Core".
#
# The argument: Marit Halvorsen holds that a disagreement kept quiet is a
# decision made for everybody else, and the assessment closes in March. Ines
# Okonkwo holds that two records on different clocks cannot disagree about
# anything yet. Halvorsen is right on day 4. Okonkwo is right on day 11.

theme:
  id: icecore
  title: Ice Core
  subtitle: Season Science Lead · Vestri Dome

groups:
  - id: DRILL
    code: DRILL
    name: Drilling & Recovery
    color: '#2f6f9f'
    desc: Getting ice out of a hole three kilometres deep without changing what it says.
    defaultLeader: lindqvist
    milestones: [Read the run sheet, Get the core up whole, Log what came back, Ready to hand over]
  - id: CORE
    code: CORE
    name: Chronology & the Core Line
    color: '#7a4fa3'
    desc: What is a year, how it is counted, and what the counting is worth at depth.
    defaultLeader: okonkwo
    milestones: [Log the section, Count the layers, Fix the depth, Ready to hand over]
  - id: COLD
    code: COLD
    name: Cold Laboratory
    color: '#1f7a6b'
    desc: Melting a sample without adding to it, and turning a ratio into a temperature.
    defaultLeader: tanabe
    milestones: [Prepare the sample, Run the standard, Read the ratio, Ready to hand over]
  - id: GAS
    code: GAS
    name: Trapped Gas
    color: '#b3462f'
    desc: Air that stopped moving centuries after the snow around it fell.
    defaultLeader: adeyemi
    milestones: [Cut the sample, Extract the air, Compare the record, Ready to hand over]
  - id: FIELD
    code: FIELD
    name: Surface & Accumulation
    color: '#b0762a'
    desc: What the surface is doing now, which is the only part anybody can check.
    defaultLeader: brandt
    milestones: [Read the mast, Dig the pit, Weigh the year, Ready to hand over]
  - id: DATA
    code: DATA
    name: Records & Reporting
    color: '#5b6a72'
    desc: What the season can say out loud, and with how much of a margin.
    defaultLeader: halvorsen
    milestones: [Assemble the record, State the uncertainty, Agree the wording, Ready to hand over]

roster:
  - id: halvorsen
    name: Marit Halvorsen
    role: Chief Scientist
    division: DATA
    bio: |
      Runs the season, which mostly means deciding what the season is allowed to
      claim. She has spent eleven years on this plateau and reads a record the
      way an auditor reads a ledger: not for what it says, for what it would
      take to make it say something else.

      Her position on the Skarv disagreement is that a result held back is a
      result somebody else makes for you. The assessment that will quote both
      records closes in March, and a silence in March is a decision.

      Her limit is the same as her strength. She is fastest at deciding what a
      number means, and the fastest reading of a number is the one that assumes
      the other people measured it the way she would have.
    quiz:
      - q: Why does Halvorsen treat staying quiet until next season as a decision rather than a delay?
        a: The March assessment quotes whatever is published by then
        wrong:
          - Station funding is reviewed on how many papers come out of each season on the ice
          - A record that is not published within a year cannot be published at all
          - The Skarv group has asked for a response and is owed one
  - id: okonkwo
    name: Ines Okonkwo
    role: Chronology Lead
    division: CORE
    bio: |
      Owns the depth–age scale, which is the sentence every other result in the
      station ends with. She counts layers, ties them to dated ash, and writes
      down how wrong each stretch could be.

      Her position on Skarv is not caution for its own sake. Two records cannot
      disagree until they are on one clock, and she has not finished putting
      them on one. Announcing a difference between two timescales is announcing
      something about the timescales.

      Her limit is that counting has an end. Below about two thousand metres the
      layers are thinner than anything she can resolve, and from there the ages
      come from a flow model she did not build and cannot check.
    quiz:
      - q: Why will Okonkwo not call the difference between the two records a disagreement yet?
        a: On two timescales, a difference could belong to the dating
        wrong:
          - The Skarv core has not been measured on the same mass spectrometer
          - A difference is only real once it exceeds three standard deviations
          - The two cores were drilled in different years, which makes them incomparable in principle
  - id: lindqvist
    name: Pär Lindqvist
    role: Drill Engineer
    division: DRILL
    bio: |
      Twenty-two seasons on deep drills, and he can tell from the winch load
      what the hole is doing eight hundred metres down. The drill is a
      three-tonne instrument that gets one attempt per run.

      He runs the brittle zone slowly and refuses to be hurried through it. Ice
      between five hundred and twelve hundred metres holds bubbles at pressures
      the surface cannot support, and a core brought up fast comes up as gravel.

      His limit is that he cannot see anything. Everything he knows about the
      hole arrives as tension on a cable and the temperature of returning fluid.
    quiz:
      - q: Why does Lindqvist slow the winch through the brittle zone?
        a: The bubbles are at a pressure the surface cannot hold
        wrong:
          - The drill fluid freezes onto the barrel if it is raised too quickly
          - Cable tension readings become unreliable above a certain speed
          - The winch motor overheats on a continuous lift from that depth and has to be rested
  - id: tanabe
    name: Yuki Tanabe
    role: Isotope Chemist
    division: COLD
    bio: |
      Runs the cold laboratory at minus twenty-five, where every sample is
      melted exactly once and everything that touches it has been accounted for
      first. She measures ratios that differ in the fourth decimal place.

      She runs a standard between every eighth sample, which everybody agrees
      with in principle and resents in practice, because the instrument drifts
      and drift is invisible from inside a run.

      Her limit is that she measures water, not weather. Turning a ratio into a
      temperature needs a slope, and the slope is somebody's measurement of a
      relationship that has not held perfectly for the whole record.
    quiz:
      - q: Why does Tanabe run a standard between every eighth sample?
        a: Only a known sample can reveal drift while it happens
        wrong:
          - The instrument must be re-zeroed after a fixed number of runs to stay in specification
          - Samples measured late in a run are colder than those measured early
          - It gives the run an even number of measurements for averaging
  - id: adeyemi
    name: Samuel Adeyemi
    role: Gas Geochemist
    division: GAS
    bio: |
      Cuts ice, puts it in a vessel, evacuates the vessel and melts the ice, and
      what comes off is air that last touched the atmosphere a long time ago. He
      has been doing it for nine years and still calls it unreasonable.

      He is the reason the station argues about age twice: the ice around a
      bubble and the air inside it are not the same age, and at a dry site like
      this one the difference runs to centuries rather than decades.

      His limit is sample size. A gas measurement destroys the ice it was made
      on, so every question he answers is one somebody else cannot ask again.
    quiz:
      - q: Why does Adeyemi insist the ice and the air inside it are dated separately?
        a: Air keeps moving through the snowpack until the pores seal
        wrong:
          - Gas measurements are made on a different instrument from the ice ones
          - Bubbles migrate slowly upward through the ice over thousands of years, arriving young
          - The extraction line adds a delay that has to be subtracted afterwards
  - id: brandt
    name: Nadia Brandt
    role: Field Glaciologist
    division: FIELD
    bio: |
      Responsible for everything above the surface: the stake farm, the mast,
      the snow pits, and the only measurements in the station that can be
      checked against the thing they are measuring.

      She digs a pit every fortnight and photographs the wall, because the
      surface is where the record is made and it is the one part of it anybody
      can still watch happening.

      Her limit is wind. The plateau moves snow sideways, so a stake that gained
      a centimetre may be reporting the weather or the drift, and the difference
      takes a season of stakes to see.
    quiz:
      - q: Why does one stake gaining snow tell Brandt so little on its own?
        a: Wind moves snow, so a gain here is a loss elsewhere
        wrong:
          - A single stake cannot be levelled accurately enough to trust
          - Snow settles under its own weight faster than new snow arrives to replace it
          - Stakes have to be read at the same time of day to be comparable
  - id: ekwueme
    name: Tom Ekwueme
    role: Drill Assistant
    division: DRILL
    bio: |
      Second on the drill, which means he handles every core that comes up and
      writes the run sheet while Lindqvist watches the cable. He has recorded
      every break and every short run this season.
    quiz:
      - q: What does Ekwueme's run sheet let the chronology team do that the core itself cannot?
        a: It says which sections came up short of their full length
        wrong:
          - It records the drill fluid temperature for every run made through the season
          - It proves the core was handled within the required window
          - It gives the winch speed that produced the cleanest breaks
  - id: holt
    name: Sigrid Holt
    role: Core Line Technician
    division: CORE
    bio: |
      Logs, measures and cuts every metre that comes off the drill, in the order
      it arrives and never out of it. She has seen the whole core and almost
      nobody else has.
    quiz:
      - q: Why does Holt refuse to let a section be cut before it is logged?
        a: After cutting, a feature's depth survives only on the label
        wrong:
          - Cutting warms the ice and releases some of the trapped gas
          - The saw blade needs the logged section length before it can set its cutting depth
          - Logging after cutting takes twice as long for the same information
  - id: cruz
    name: Elena Cruz
    role: Cold Laboratory Technician
    division: COLD
    bio: |
      Prepares samples for the isotope line: cuts the outer centimetre off every
      piece, weighs it, logs it, and runs the blanks nobody else wants to run.
    quiz:
      - q: Why does Cruz cut the outer centimetre off every sample?
        a: The outside has touched the drill and the bench; the inside has not
        wrong:
          - The outer ice sublimates during storage and reads too heavy
          - Cutting every sample to a standard size is what makes the melt times comparable
          - The outer layer is where fractures concentrate during the lift
  - id: menon
    name: Ravi Menon
    role: Gas Laboratory Technician
    division: GAS
    bio: |
      Runs the extraction line, which is a vacuum system with fourteen fittings
      and a rule about every one of them. He tests the line against a standard
      gas before any sample is cut.
    quiz:
      - q: Why does Menon run a standard gas through the line before cutting a sample?
        a: A leak arrives as modern air, which reads as a result
        wrong:
          - The line has to be brought to the same temperature as the sample
          - Standard gas removes water vapour left over from the previous run
          - It confirms that the line's fourteen pressure gauges agree with each other first
  - id: devries
    name: Anneke de Vries
    role: Camp Manager
    division: FIELD
    bio: |
      Fuel, flights, generators and food, in that order. Every scientific
      decision on this station is a decision about drums of fuel, and she is the
      one who has to say so out loud.
    quiz:
      - q: Why does de Vries need the science plan a fortnight before the aircraft window?
        a: Fuel and flight weight are committed before the plane leaves
        wrong:
          - The pilots require a full manifest of every sample being flown off the plateau
          - The generators must be serviced before the last resupply lands
          - Weather forecasts are only reliable at two weeks' range
  - id: aalto
    name: Jonas Aalto
    role: Data Manager
    division: DATA
    bio: |
      Keeps the station's records, which means he is the only person who can say
      what version of anything anybody is arguing about. Every dataset here has
      a date on it and half of them have two.
    quiz:
      - q: Why does Aalto version every dataset rather than replacing it?
        a: A result was reached on one version and belongs to it
        wrong:
          - Station policy requires every record to be retained for ten years after the season
          - Older versions are needed to recover from a disk failure
          - Two people cannot edit the same file at the same time

glossary:
  - name: Accumulation
    aliases: [accumulate, accumulates, accumulated]
    def: How much snow is added to the surface in a year, after wind and sublimation have had their say.
  - name: Ice equivalent
    aliases: [water equivalent]
    def: A snow thickness converted to the thickness of solid ice it will become, so two sites can be compared.
  - name: Annual layer
    aliases: [annual layers, layer counting, layer count]
    def: One year of snowfall, recognisable in the core because summer and winter snow differ.
  - name: Ice
    aliases: []
    def: Snow compressed until the air between its grains is sealed off, at about 917 kilograms per cubic metre.
  - name: Calibration
    aliases: [calibrate, calibrated, calibration slope]
    def: Measuring an instrument or a relationship against something already known, so its numbers can be trusted.
  - name: Firn
    aliases: [firn column]
    def: The layer of snow between the surface and solid ice, still open enough for air to move through it.
  - name: Close-off depth
    aliases: [close-off, closes off, closed off]
    def: The depth where firn stops letting air through, sixty to a hundred metres down, and the trapped air becomes separate bubbles.
  - name: Delta age
    aliases: [Δage, gas age, ice age difference]
    def: The difference between the age of a bubble's air and the age of the ice around it, because the air kept moving until close-off.
  - name: Proxy
    aliases: [proxies]
    def: Something measurable that stands in for something that was not measured, through a chain somebody has to be able to state.
  - name: Isotope ratio
    aliases: [delta-18, oxygen-18, deuterium, isotopic]
    def: How much heavy oxygen or hydrogen the ice holds compared with ocean water, reported as a difference in parts per thousand.
  - name: Thinning
    aliases: [thinned, thins]
    def: The stretching of every layer as the ice sheet spreads under its own weight, so old layers are thinner than they fell.
  - name: Depth-age scale
    aliases: [depth–age, age scale, timescale]
    def: The table that turns a depth in the core into a year, built by counting layers and anchored to dated events.
  - name: Tie point
    aliases: [tie points, tied to]
    def: An event of known date found in two records, which fixes them to each other at that moment.
  - name: Sulphate horizon
    aliases: [sulphate, sulfate, volcanic horizon]
    def: A thin band of volcanic sulphur in the ice, laid down within a year or two of a known eruption.
  - name: Tephra
    aliases: [ash layer]
    def: Volcanic glass shards in the ice, which can be chemically matched to the volcano that produced them.
  - name: Diffusion length
    aliases: [diffusion, diffuses]
    def: How far a water molecule wanders in the firn before the ice seals, which smooths away anything thinner than about twice that distance.
  - name: Brittle ice
    aliases: [brittle zone]
    def: The depth range where trapped bubbles are at high pressure and the core fractures as it is brought up.
  - name: Blank
    aliases: [blank run, blanks]
    def: A run with no sample in it. Anything it shows was added by the process rather than measured from the ice.
  - name: Chain of custody
    aliases: [custody]
    def: The unbroken written record of who held a sample and when, which is what makes a measurement attributable to a depth.
  - name: Radiative forcing
    aliases: [forcing]
    def: The change in the energy balance at the top of the atmosphere caused by a change in a greenhouse gas, in watts per square metre.
  - name: Standard error
    aliases: [standard errors]
    def: How far an average is expected to sit from the truth, given the scatter in the data and how many years went into it.
  - name: Replicate core
    aliases: [replicate, replicates]
    def: A second core drilled nearby, so a feature can be checked against ice that shared the weather but not the drill.

missions:
  # ------------------------------------------------------------------ day 1
  - title: What the plateau has been writing down
    objective: Establish what this site records, how fast it records it, and why anybody drilled here.
    briefing: A new season opens on a core that is already two thousand metres deep.
    stake: >-
      First morning of the season, and the drill has not turned yet. The field glaciologist, Nadia
      Brandt, has a fortnight of stake readings and a fresh pit wall, and the chief scientist, Marit
      Halvorsen, wants the season's accumulation figure before the science plan is written. Today
      you settle what this site actually records, how much of a year the surface adds, and why the
      hole was put here rather than forty kilometres downslope. Get the accumulation wrong and
      every age below it is wrong in the same direction, quietly, for three kilometres.
    takeaway: A record is only as good as the rate at which it was written.
    stops:
      - group: FIELD
        task: Turn a fortnight of snow into a year of record
        title: How thick a year is here
        place: Snow Study Hut
        scene: >-
          Brandt has the pit wall photographed and the last summer surface marked at 32 centimetres
          down. The snow above it weighs a third of what the same thickness of solid ice would.
        assumes:
          - snow becomes ice by being compressed under the snow that falls on it
        takeaway: An accumulation rate means nothing until it is stated as the ice it will become.
        format: BALLPARK
        question: Estimate this year's accumulation in ice equivalent.
        answerText: About 0.12 metres of ice equivalent — a third of the snow thickness, because the snow is a third as dense.
        why: >-
          Snow and ice are the same material at different densities, so a thickness of snow is not a
          thickness of record. Multiplying the layer by the ratio of the two densities converts it
          to the ice it will become once the air is squeezed out, which is the only form in which
          two sites can be compared. Vestri gets about twelve centimetres a year in ice equivalent.
          A coastal site gets a metre, and that difference decides everything downstream: how far
          back the core reaches, how thin the layers get, and how much older the ice is than its own
          trapped air.
        estimate:
          prompt: The last summer surface sits 32 centimetres below this year's, in snow of density 340 kilograms per cubic metre.
          question: Estimate this year's accumulation in metres of ice equivalent.
          relationship: b = λ × ρ_snow ÷ ρ_ice — the snow layer λ scaled by the ratio of its own density to the density of solid ice.
          labels:
            - 0.32 m  (this year's snow layer)
            - 340 kg/m³  (density of the snow)
            - 917 kg/m³  (density of solid ice)
            - 1000 kg/m³  (density of liquid water)
            - 14  (days of stake readings)
          values: [0.32, 340, 917, 1000, 14]
          slots: 3
          template: '{0} × {1} ÷ {2}'
          formula: a*b/c
          correct: [0, 1, 2]
          target: 0.119
          tolerance: 0.012
          units: m ice equivalent per year
          solution: 0.32 × 340 ÷ 917 = 0.119 m of ice equivalent.
          explanation: The water density is the tile that does not belong: the conversion is snow to ice, and liquid water is never part of this record.
      - group: DRILL
        task: Say what the site was chosen for
        title: Why the hole is on the dome
        place: Drill Trench
        scene: >-
          The drill engineer, Pär Lindqvist, has the hole at 2,040 metres and a map on the wall with
          three abandoned sites on it, all of them on slopes. Vestri Dome is the high point for two
          hundred kilometres.
        assumes:
          - ice spreads outwards from the high points of an ice sheet
        takeaway: A core is a column of what fell above it only where the ice has not travelled sideways.
        format: CHOICE
        question: What does drilling at the dome buy that a site on the slope cannot?
        answerText: The ice at each depth fell close to where it now sits, so the core is a column of one place's weather.
        choices:
          - The ice at each depth fell near this spot, not upstream
          - The ice is colder at the summit, which slows the chemical reactions in it
          - Snowfall is heaviest at the high point, giving the thickest annual layers
          - The bedrock beneath a dome is flattest, which keeps a three-kilometre hole vertical
        answer: The ice at each depth fell near this spot, not upstream
        why: >-
          An ice sheet flows outwards from its high points. On a slope the ice at a given depth
          arrived from somewhere upstream, so a core there mixes the weather of one place with the
          history of a journey, and the two cannot be separated afterwards. Under a dome the flow is
          almost straight down, so the column below the drill is very nearly the snow that fell on
          it. Domes pay for that: they are high, cold and dry, which means thin layers and a long
          slow season.
        rebuttals:
          - Summit ice is colder, and cold ice is not what makes depth correspond to time
          - Domes are the driest part of an ice sheet, not the snowiest — thin layers are the price paid here
          - Bed shape matters to the deepest ice, and it is not why the site sits at the high point
      - group: CORE
        task: Read a year off the core
        title: What makes one year different from the next
        place: Core Line
        scene: >-
          A metre of core from 60 metres is on the light table. The chronology lead, Ines Okonkwo,
          has four features marked on it and wants each one attributed before the section is cut.
        assumes:
          - snow that falls in summer sits under different conditions from snow that falls in winter
        takeaway: A year is counted from several signals that agree, not from one that looks convincing.
        format: PROTOCOL
        columns:
          - What is in the ice
          - What put it there
        scenarios:
          - A band of large, loosely bonded crystals
          - A narrow spike in electrical conductivity
          - A rise in fine mineral dust
          - Alternating light and dark bands about a centimetre apart
        choices:
          - A summer surface that sat exposed and grew coarse before it was buried
          - Acid from an eruption, laid down in a season or two and then gone
          - Windier months on distant continents, carried here and settled out
          - Bubble size changing through the year as the snow was compressed
        mapping: [0, 1, 2, 3]
        why: >-
          No single marker survives the whole core, so a year is established where several
          independent signals line up. Coarse crystals form on a summer surface that stayed exposed;
          conductivity spikes are acid, and volcanic acid arrives in a season; dust is delivered by
          winds thousands of kilometres away and peaks with their season; the light and dark banding
          is bubble structure changing as each layer was compressed. Where three of the four agree,
          a year is a year. Where only one does, it is a candidate.
        rebuttals:
          - Conductivity responds to acid, and the coarse crystal band is a surface that was left exposed
          - Dust is delivered from elsewhere and does not follow the crystal growth on this surface
          - Banding tracks how the snow was compressed rather than what was carried in from outside
  # ------------------------------------------------------------------ day 2
  - title: Three kilometres of one attempt
    objective: Get the core to the surface and onto the line without changing what it can say.
    briefing: The brittle zone starts at 540 metres and the run sheet has three short runs on it.
    stake: >-
      Second day, and the drill is going back down after a night of maintenance. Lindqvist has three
      short runs on the sheet from last season's brittle zone and the core line technician, Sigrid
      Holt, has a section that arrived without its depth mark. Today you decide how the run
      through the brittle ice is made, what happens to a section that cannot be placed, and what a
      dirty sample costs. Ice is the only instrument here that gets one reading: what breaks on the
      way up cannot be drilled again, and what is contaminated cannot be un-contaminated.
    takeaway: Everything the core can say is decided before anybody measures anything.
    stops:
      - group: DRILL
        task: Bring a brittle section up whole
        title: The run through the brittle zone
        place: Drill Trench
        scene: >-
          The barrel is at 780 metres, inside the depth range where the ice comes up cracked. The
          winch, the fluid and the storage are all set for ordinary ice and Lindqvist wants the
          order settled before the lift starts.
        assumes:
          - gas trapped at depth is at the pressure of the ice around it
        takeaway: Ice recovered badly is a shorter record, not a cheaper one.
        format: SEQUENCE
        cards:
          - Slow the winch through the depth band where bubbles are at their highest pressure
          - Let the section rest in the trench at drill-hole temperature before it is handled
          - Log the breaks and their positions before anything is moved off the barrel
          - Carry the section to the storage trench and leave it there for the relaxation period
          - Cut and distribute only after the section has stopped cracking
        order: [0, 1, 2, 3, 4]
        why: >-
          Between about five hundred and twelve hundred metres the bubbles are at pressures the
          surface cannot support, and the ice around them fractures as it is brought up. Each step
          buys the next one: a slow lift reduces the shock, resting the core at hole temperature
          lets the pressure equalise gradually, logging the breaks fixes what depth each fragment
          came from before anything moves, and storing it for weeks lets it finish cracking. Cutting
          first destroys the depth information and cuts a section that is still moving.
      - group: CORE
        task: Decide what an unmarked section is worth
        title: The metre with no label
        place: Core Line
        scene: >-
          A section has arrived at the line with a broken depth mark. Holt can place it to within
          about four metres from the run sheet, and the isotope team has asked for it.
        assumes:
          - a measurement belongs to the depth it came from, and to no other
        takeaway: A sample without a depth is a measurement of nothing in particular.
        format: CHOICE
        question: What should the section be used for?
        answerText: Work that does not need a precise depth — density, crystal fabric, drill performance — with the four-metre uncertainty recorded against it.
        choices:
          - Work that tolerates a four-metre depth uncertainty, recorded as such
          - Isotope work, since the four-metre window is small compared with the whole core
          - Nothing; an unplaced section is discarded so it cannot contaminate the record
          - Anything, once the run sheet is used to assign it the most likely depth
        answer: Work that tolerates a four-metre depth uncertainty, recorded as such
        why: >-
          A depth is what converts a measurement into a statement about a year. Four metres here is
          thirty-odd years, so an isotope value from this section cannot be placed in the record and
          would sit in it as a point with no time. It is still perfectly good ice for anything the
          depth does not enter: density, crystal fabric, how the drill is performing. The rule that
          matters is that the uncertainty travels with the sample, because the danger is not the
          gap — it is somebody downstream who never hears about it.
        rebuttals:
          - Four metres is thirty years at this site, which is larger than most of the features the isotopes are used to find
          - Discarding it throws away measurements that never needed a depth in the first place
          - Assigning a most likely depth writes a guess into the record in the same handwriting as the measurements
      - group: COLD
        task: Find out where a signal came from
        title: The sample that was clean until it was handled
        place: Cold Laboratory
        scene: >-
          The cold laboratory technician, Elena Cruz, has a sodium result four times higher than
          the run before it. She has the blank, the run order and the section's handling record on
          the bench.
        assumes:
          - a blank is run through the same process as a sample, with no sample in it
        takeaway: A blank measures the process, so anything it shows was never evidence about the ice.
        format: DIAGNOSIS
        headline: One sodium result is four times the run before it — and the blank that followed it is high too.
        readings:
          - { zone: Sample, label: Sodium, value: 4.1× the previous run, status: alarm }
          - { zone: Blank after it, label: Sodium, value: raised, status: alarm }
          - { zone: Blank before it, label: Sodium, value: at the usual level, status: normal }
          - { zone: Outer trim, label: Removed, value: '1 cm, as specified', status: normal }
          - { zone: Neighbouring depth, label: Sodium on the replicate core, value: ordinary, status: normal, note: 'same year, different hole' }
        choices:
          - label: Sea salt reached the plateau in the year this ice fell
            mechanism: A storm carried marine air far inland and the ice recorded it.
          - label: Something in the laboratory entered the run and stayed
            mechanism: The process itself contributed, and went on contributing to what followed.
          - label: The outer surface was not trimmed
            mechanism: Drill fluid and handling left salt on the outside of the section.
          - label: The replicate core missed the layer and is the wrong comparison
            mechanism: The second hole missed the layer entirely.
        answer: Something in the laboratory entered the run and stayed
        why: >-
          The blank before the sample is ordinary and the blank after it is high, which places the
          contamination inside the run rather than in the ice. The trim was done to specification,
          so the outside of the section is ruled out, and the replicate core holds the same year with
          no sodium in it, so the atmosphere is ruled out as well. Every clean reading here is doing
          work: what identifies the source is not the loud number but which of the quiet ones stayed
          quiet.
  # ------------------------------------------------------------------ day 3
  - title: Counting to two thousand
    objective: Establish how a year is counted, and find the depth where counting stops working.
    briefing: Okonkwo needs the depth at which the layer thickness drops below what the line can resolve.
    stake: >-
      Wednesday, and the chronology is the thing holding up everything else. Okonkwo has counted to
      1,180 metres by eye and the layers are getting thinner every hundred metres. Halvorsen wants
      the season's depth–age scale by the aircraft window, and the whole comparison with the Skarv
      record rests on it. Today you find where counting stops being possible, decide which annual
      signal to count with, and put a number on how deep the firn's own clock runs. Below the depth
      where layers stop resolving, every age comes from a model, and a model is not a count.
    takeaway: Every dating method has a depth where it stops working, and knowing it is part of the date.
    stops:
      - group: CORE
        task: Find where the layers stop being countable
        title: The depth the counting runs out
        place: Core Line
        scene: >-
          The layer-thickness log runs from the surface to the bottom of the drilled core. The line
          can separate two bands three millimetres apart and no closer, and Okonkwo needs to know
          where the ice crosses that.
        assumes:
          - layers are stretched thinner as the ice below them spreads outwards
        takeaway: A count ends where the instrument stops separating one year from the next.
        format: SWEEP
        question: The line resolves bands three millimetres apart and no closer. At what depth does the annual layer thickness fall to that limit?
        answerText: About 2,180 metres. Below that the bands are closer together than the line can separate, and the ages have to come from the flow model.
        sweep:
          axis: { label: Depth in the core, unit: m, min: 0, max: 2600, step: 20 }
          readout: { label: Measured annual layer thickness, unit: mm }
          baseline: 119
          response:
            - { at: 0, value: 119 }
            - { at: 200, value: 104 }
            - { at: 400, value: 90 }
            - { at: 600, value: 76 }
            - { at: 800, value: 62 }
            - { at: 1000, value: 49 }
            - { at: 1200, value: 37 }
            - { at: 1400, value: 26 }
            - { at: 1600, value: 17 }
            - { at: 1800, value: 10 }
            - { at: 1900, value: 7.4 }
            - { at: 2000, value: 5.4 }
            - { at: 2100, value: 3.9 }
            - { at: 2180, value: 3.0 }
            - { at: 2260, value: 2.3 }
            - { at: 2400, value: 1.5 }
            - { at: 2600, value: 0.8 }
          target: 2180
          tolerance: 70
          start: 0
          commit: Mark the end of the counted record
        why: >-
          Ice spreads outwards under its own weight, so every layer is stretched thinner as it
          sinks, and the thinning compounds with depth. At Vestri the surface lays down about twelve
          centimetres a year in ice equivalent; two kilometres down the same year is a few
          millimetres. Where the layers close to within the resolution of the measurement, the
          count stops — not because the years are gone, but because two of them can no longer be
          told apart. Everything deeper is dated by a flow model anchored to whatever dated events
          can still be found.
      - group: COLD
        task: Choose the signal to count with
        title: Which year marker survives the depth
        place: Cold Laboratory
        scene: >-
          The isotope chemist, Yuki Tanabe, has four annual signals measured on the same stretch of
          core at 1,400 metres, where a year is about twenty-six millimetres thick.
        assumes:
          - water molecules can move through the connected air spaces in firn
        takeaway: A signal is only useful for counting while it is still sharper than the layer it marks.
        format: CHOICE
        question: At 1,400 metres, which signal is still able to separate one year from the next?
        answerText: The chemistry — sodium and dust — because those travel in the ice as particles and solutes rather than as water molecules, so firn diffusion never smoothed them.
        choices:
          - Sodium and dust, which never moved through the firn
          - The isotope ratio, which has the largest annual swing at the surface
          - Visible layering, which needs no chemical measurement to read at all
          - Electrical conductivity, which responds to every acid in the ice
        answer: Sodium and dust, which never moved through the firn
        why: >-
          Water molecules move through the open pores of the firn for decades. That movement smooths
          the isotope record. Anything thinner than about twice the diffusion length is averaged
          away, and at this site that removes the yearly signal long before 1,400 metres. Sodium
          arrives as sea salt. Dust arrives as mineral grains. Neither travels through the pore
          space, so their yearly structure survives as far down as the measurement can read it.
          Visible layering fades once the bubbles are gone, and conductivity marks eruptions.
        rebuttals:
          - The isotope swing is the largest at the surface and the first one diffusion removes
          - Visible banding depends on bubbles, which are gone below the depth where they turn to clathrate
          - Conductivity finds acid, and acid arrives when a volcano erupts rather than every year
      - group: FIELD
        task: Put a number on the firn's own clock
        title: How old the bottom of the firn is
        place: Snow Study Hut
        scene: >-
          Brandt has the firn temperature string reading down to 88 metres, which is where the pores
          seal at this site. The surface is adding about 0.32 metres of snow a year.
        assumes:
          - a depth divided by an annual layer thickness gives a number of years
        takeaway: A depth becomes an age only through the rate that filled it.
        format: BALLPARK
        question: Estimate the age of the snow at the close-off depth.
        answerText: About 275 years. The firn column here holds nearly three centuries of snow that has not yet become ice.
        why: >-
          A depth–age scale is arithmetic on layer thicknesses: divide the depth by the thickness
          one year adds and you have the years it took to get there. In the firn the layers have not
          yet been thinned by flow, so the sum is a straight division; deeper in the ice the same
          calculation has to be done interval by interval as the layers get thinner. Nearly three
          centuries of snow sit above the close-off depth at Vestri, and every one of those years
          is still open to the atmosphere.
        estimate:
          prompt: The pores seal at 88 metres. The surface adds about 0.32 metres of snow a year, and the firn has not been thinned by flow.
          question: Estimate the age of the snow at the close-off depth.
          relationship: age = depth ÷ annual layer thickness, valid while the layers have not yet been thinned by ice flow.
          labels:
            - 88 m  (close-off depth)
            - 0.32 m/yr  (annual snow layer)
            - 0.119 m/yr  (the same year in ice equivalent)
            - 917 kg/m³  (density of solid ice)
          values: [88, 0.32, 0.119, 917]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 275
          tolerance: 25
          units: years
          solution: 88 ÷ 0.32 = 275 years.
          explanation: The ice-equivalent figure is the distractor: the firn is snow, and this depth is measured in snow.
  # ------------------------------------------------------------------ day 4
  - title: One aircraft, and what leaves on it
    objective: Decide what is measured while the Skarv samples are still on the station.
    briefing: The Skarv group's samples fly out on Thursday and cannot come back.
    stake: >-
      Thursday is the aircraft window and eleven Skarv samples are in the core store until it
      opens. Halvorsen has the Skarv record on one screen and this station's on the other, and they
      disagree by more than either group's stated uncertainty. She wants a measurement made while
      both cores can be run on one instrument. Okonkwo wants nothing said until the timescales are
      matched. Today you choose what to measure before the plane leaves, what running both on the
      same machine settles, and what it does not. After Thursday the comparison is between two
      laboratories rather than two cores.
    takeaway: Some comparisons are only available for as long as both things are in the same room.
    stops:
      - group: DATA
        task: Spend the last day of access
        title: What is worth measuring before Thursday
        place: Science Module
        scene: >-
          Eleven Skarv samples, one working day, and the isotope line can take four of them.
          The data manager, Jonas Aalto, has the two records side by side and the difference between
          them on a third screen.
        assumes:
          - two laboratories measuring the same quantity can differ by a fixed amount
        takeaway: A measurement is worth its cost when the decision changes depending on how it comes out.
        format: VALUE
        question: Which four runs should the day buy?
        answerText: The paired standards and the overlap depths. Those are what would show a fixed offset between the two laboratories, which is the only explanation the comparison cannot rule out from here.
        value:
          hint: Buy what would change the answer. A measurement that confirms what you already believe has bought nothing.
          budget: { amount: 4, unit: instrument runs }
          decision: Is the difference between the two records a difference in the ice, or a difference between two laboratories?
          options:
            - id: standards
              label: Both groups' working standards, run back to back
              cost: 1
              axis: where the two reporting scales sit
              decisive: true
              reveals: 'The Skarv scale reads 0.4 per mil heavy against ours, on the same water.'
            - id: overlap
              label: Four Skarv depths that overlap ours, run on our line
              cost: 2
              axis: whether one instrument gives one answer on one piece of ice
              decisive: true
              reveals: 'The same ice, measured here, sits 0.4 per mil from their published value.'
            - id: deeper
              label: The deepest Skarv sample, at a depth this station has not drilled
              cost: 1
              axis: ice older than anything here
              reveals: 'An isotope value with nothing of ours to compare it against.'
            - id: repeat
              label: A repeat of our own 1,400 m sample
              cost: 1
              axis: how tightly our own line repeats
              reveals: 'Within 0.05 per mil of the first run, as it was last week.'
            - id: density
              label: Density profile of the Skarv firn section
              cost: 1
              axis: the other site's close-off depth
              reveals: 'Close-off at 71 m, which their published report already states.'
          commit: Book the runs
        why: >-
          Two laboratories measuring the same water can differ by a fixed amount, and a fixed amount
          looks exactly like a climate difference when it is plotted against depth. The standards
          measure that offset directly; the overlapping depths test it on real ice. Between them
          they either remove the explanation or establish it. The deepest sample is interesting and
          settles nothing, since nothing here overlaps it, and the density profile is already in the
          other group's published report. Repeating our own sample tests our line, which is not the
          thing in dispute.
      - group: COLD
        task: Say what one instrument removes
        title: The same water, twice
        place: Cold Laboratory
        scene: >-
          Tanabe has both groups' working standards on the bench and thirty minutes of instrument
          time. Skarv reports its values against its own standard, calibrated in a different
          laboratory four years ago.
        assumes:
          - an isotope value is reported as a difference from an agreed reference water
        takeaway: A ratio reported against two different references is two different numbers about the same water.
        format: CHOICE
        question: What does running both standards on this instrument establish?
        answerText: The size of any fixed offset between the two reporting scales, which would otherwise be read as a difference between the two sites.
        choices:
          - How far apart the two laboratories' reporting scales sit
          - That the Skarv samples were stored correctly on their way here
          - Which of the two laboratories is measuring more precisely
          - Whether the isotope thermometer has the same slope at both sites
        answer: How far apart the two laboratories' reporting scales sit
        why: >-
          An isotope value is not an amount; it is a difference from a reference water, so it
          carries whatever that reference is worth. Two laboratories keep their own working
          standards, both traceable to the same international water and both slightly off it. Run
          side by side on one instrument, the two standards show the gap between the scales directly,
          in the same units the records are plotted in. Nothing else on the bench can separate that
          gap from a real difference between the sites, because both appear as a constant shift.
        rebuttals:
          - Storage matters and is a separate question, answered by the temperature log rather than the standard
          - Precision is scatter between repeats; this compares where the two scales sit, not how tightly they repeat
          - The temperature slope is a property of each site's weather and cannot be read off a bottle of standard water
      - group: GAS
        task: Sort what a joint run can and cannot settle
        title: Which differences a shared instrument removes
        place: Gas Laboratory
        scene: >-
          The gas geochemist, Samuel Adeyemi, has four ways the two records could differ written on
          the board, and one working day in which both cores are in the same building.
        assumes:
          - two measurements of one quantity can differ for reasons that have nothing to do with the quantity
        takeaway: Sharing an instrument removes the differences the instrument was causing, and only those.
        format: PROTOCOL
        columns:
          - Why the two records might differ
          - What would settle it
        scenarios:
          - The two laboratories' reference waters are not identical
          - One core's timescale is stretched relative to the other's
          - The two sites really did have different temperatures
          - One group's samples were partly melted in transit
        choices:
          - Run both working standards on one instrument and read the gap
          - Find an event dated in both cores and pin them to each other at it
          - Measure overlapping depths on one instrument and see the difference survive
          - Check the transit temperature record against the isotope profile of the outer ice
        mapping: [0, 1, 2, 3]
        why: >-
          Only the first of these is fixed by sharing an instrument. A stretched timescale is a
          chronology problem and needs an event of known date present in both cores. A real climate
          difference is what is left once every other explanation has been removed, which is why it
          is established by elimination rather than measured directly. Melting in transit alters the
          outer ice more than the inner, so it leaves a signature in the profile across a section
          rather than in the average. Four differences, four different pieces of evidence.
        rebuttals:
          - A shared instrument removes instrument differences, and a stretched timescale is not one
          - A tie point fixes two clocks to each other, which is a different question from what the ice contains
          - Transit damage shows in the profile across a section rather than in a comparison of averages
  # ------------------------------------------------------------------ day 5
  - title: Turning a ratio into a temperature
    objective: Establish what the isotope record measures and how confidently it can be stated in degrees.
    briefing: The isotope profile is finished to 1,600 metres and nobody has agreed what it says in degrees.
    stake: >-
      Friday, and the isotope profile is complete to 1,600 metres. Tanabe has the numbers and
      Halvorsen wants them in degrees for the season summary, which means a slope, and the slope is
      a measurement somebody made rather than a constant. Brandt has eleven years of mast
      temperatures to test it against. Today you convert the profile into a temperature change,
      decide how tightly the conversion can be stated, and settle what the isotopes are actually a
      thermometer of. A slope taken on faith turns every degree in the record into somebody else's
      assumption.
    takeaway: A proxy becomes a number through a calibration, and the calibration is part of the result.
    stops:
      - group: COLD
        task: Put the profile into degrees
        title: What the ratio says in degrees
        place: Cold Laboratory
        scene: >-
          Tanabe has the isotope profile against depth, and the section covering the last cold
          interval sits 1.8 per mil below the modern surface value. The site's calibration slope is
          on the board.
        assumes:
          - colder air loses its heavier water molecules earlier, leaving the snow isotopically lighter
        takeaway: A slope converts a measurement into a claim, and it is measured rather than assumed.
        format: BALLPARK
        question: Estimate the temperature change that isotope shift represents.
        answerText: About 2.7 degrees colder. The shift is 1.8 per mil and the site slope is 0.67 per mil for every degree.
        why: >-
          Water carrying the heavy isotope condenses first. Air that has cooled further has already
          lost more of it, so the snow falling last is the lightest. Over a useful range the ratio
          and the temperature move together in a straight line. The slope of that line is not a
          constant of physics. It belongs to this site's weather, and it is measured by comparing
          the isotope record with the mast during the years that have both. Dividing the shift by
          the slope gives the change in degrees.
        estimate:
          prompt: The cold interval sits 1.8 per mil below the modern surface value. Calibration against the mast gives 0.67 per mil for each degree of temperature change.
          question: Estimate the temperature difference between that interval and the present.
          relationship: ΔT = Δδ¹⁸O ÷ α — the isotope shift in parts per thousand, divided by the site's calibration slope in parts per thousand per degree.
          labels:
            - 1.8 ‰  (the isotope shift)
            - 0.67 ‰/°C  (the site calibration slope)
            - 8.0 ‰/°C  (the deuterium slope, a different isotope)
            - 11  (years of overlap with the mast)
          values: [1.8, 0.67, 8.0, 11]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 2.7
          tolerance: 0.3
          units: °C colder
          solution: 1.8 ÷ 0.67 = 2.7 °C.
          explanation: The deuterium slope belongs to a different isotope of a different element, and using it here would give an answer eleven times too small.
      - group: FIELD
        task: State the cooling with its uncertainty
        title: How firmly the cooling can be stated
        place: Snow Study Hut
        scene: >-
          Brandt has the mast record, the calibration years and the scatter around the fitted slope.
          The season summary needs a statement that the interval was colder than the present, and
          how sure of it anybody is.
        assumes:
          - a fitted relationship carries a spread as well as a central value
        takeaway: Narrowing a distribution and moving it are different actions with different evidence behind them.
        format: CLOUD
        question: Which work would let the summary state that the interval was more than two degrees colder?
        answerText: Extending the overlap with the mast record. It narrows the calibration spread, which is what the claim needs; re-centring the slope moves the estimate without making it any surer.
        cloud:
          hint: >-
            The band is the reconstructed cooling with its calibration uncertainty. The claim is
            cleared only when the whole distribution sits past the limit.
          centre: 2.7
          spread: 0.55
          bounds: { min: 2.0, max: 5.0, label: 'between two and five degrees colder' }
          pass: 0.95
          actions:
            - id: overlap
              label: Add six more years of mast overlap to the calibration
              effect: narrow
              amount: 0.6
              note: Six more years of both records measured against each other
            - id: recentre
              label: Apply the revised source-region correction to the slope
              effect: shift
              amount: 0.15
              note: Moves the central estimate, on the same eleven years
          commit: State the cooling
        why: >-
          The reconstruction is a distribution, not a number: the slope was fitted to eleven years
          of overlap and it carries the scatter of that fit. A claim that the interval was more than
          two degrees colder is a claim about where the whole distribution sits, so it is cleared by
          making the distribution narrower rather than by moving its middle. More overlap years is
          the only action here that adds information; the source-region correction changes the
          central value and leaves the spread exactly as wide as it was.
      - group: DATA
        task: Say what the thermometer is a thermometer of
        title: The temperature of what, and where
        place: Science Module
        scene: >-
          Aalto is drafting the summary line and has written that the isotopes give the temperature
          of the last cold interval. Halvorsen wants the sentence narrowed before it goes anywhere.
        assumes:
          - snow forms in a cloud and falls to a surface some distance below it
        takeaway: A proxy measures one specific thing, and the sentence has to say which.
        format: CHOICE
        question: What does the isotope record most directly record?
        answerText: The condensation temperature of the air that made this snow, which is close to but not the same as the surface temperature here.
        choices:
          - Where the snow condensed, over this region, in the season it fell
          - The average annual temperature of the whole hemisphere at that time
          - The temperature of the ice itself, preserved from when it was buried
          - The temperature of the ocean the water evaporated from
        answer: Where the snow condensed, over this region, in the season it fell
        why: >-
          The isotope ratio is set as water vapour condenses, so it records conditions in the cloud
          that produced this snow, weighted towards the seasons that deliver most of it. Getting
          from there to a surface temperature needs the relationship between cloud and ground, which
          is what the site calibration supplies. The ocean the water came from does leave a mark,
          which is why source-region corrections exist. The ice's own temperature is a separate
          measurement, taken with a thermometer in the borehole, and it says nothing about the year
          the snow fell.
        rebuttals:
          - A single site records its own region; hemispheric averages are built by combining many sites
          - Borehole thermometry measures the ice now, and is used to check the isotopes rather than to replace them
          - Evaporation conditions leave a second-order mark, which is a correction rather than the signal
  # ------------------------------------------------------------------ day 6
  - title: Air that stopped moving
    objective: Establish what a bubble is, when it sealed, and why its air is younger than its ice.
    briefing: The gas record and the ice record from the same depth are not the same age.
    stake: >-
      Saturday, and Adeyemi has carbon dioxide from four depths and a problem with all of them. The
      air in a bubble stopped moving centuries after the snow around it fell, and at a site this dry
      the difference is the largest correction in the whole record. Okonkwo needs it before the two
      timescales can be put together. Today you work out how large the offset is here, name the step
      in the chain that decides it, and settle why the gas record is smoother than the ice one. A
      gas record plotted on the ice's own clock is a record shifted by centuries.
    takeaway: Two things in the same piece of ice can be different ages, and the difference has to be calculated.
    stops:
      - group: GAS
        task: Put a number on the age offset
        title: How much younger the air is
        place: Gas Laboratory
        scene: >-
          The pores seal at 88 metres here. Above that the firn is open to the atmosphere, and its
          mean density is about 0.62 of solid ice. Adeyemi has the accumulation rate on the board
          beside it.
        assumes:
          - air moves freely through connected pore spaces until they close
        takeaway: A bubble is sealed at a depth, and the ice around it arrived at that depth long before.
        format: BALLPARK
        question: Estimate the age difference between a bubble and the ice around it.
        answerText: About 460 years. The snow at close-off depth is that old, and the air sealed into it is essentially modern at the moment of sealing.
        why: >-
          Air circulates through the connected pore spaces of the firn and mixes with the atmosphere
          until those pores close, so the air in a bubble is roughly as old as the moment of
          sealing while the ice around it is as old as the snow. Converting the firn column to ice
          equivalent and dividing by the accumulation rate gives that interval. It is set by how
          deep the close-off is and how fast snow arrives, so cold dry sites carry offsets of
          centuries and wet coastal ones a few decades. Ignore it and a gas record is plotted
          centuries too early.
        estimate:
          prompt: Close-off is at 88 metres, the firn above it averages 0.62 of the density of solid ice, and the site accumulates 0.119 metres of ice equivalent a year.
          question: Estimate the difference between the age of the gas and the age of the ice around it.
          relationship: Δage ≈ z_close × ρ̄ ÷ b — the close-off depth, scaled by mean firn density, divided by the accumulation in ice equivalent.
          labels:
            - 88 m  (close-off depth)
            - 0.62  (mean firn density, relative to ice)
            - 0.119 m/yr  (accumulation in ice equivalent)
            - 0.32 m/yr  (the same year as a snow thickness)
          values: [88, 0.62, 0.119, 0.32]
          slots: 3
          template: '{0} × {1} ÷ {2}'
          formula: a*b/c
          correct: [0, 1, 2]
          target: 458
          tolerance: 40
          units: years
          solution: 88 × 0.62 ÷ 0.119 = 458 years.
          explanation: The snow thickness is the distractor: the density conversion has already been applied, so using it again would count the same correction twice.
      - group: DRILL
        task: Name the step that fixes the offset
        title: From snowfall to sealed bubble
        place: Drill Trench
        scene: >-
          Lindqvist has the borehole's own record on the wall: five stages between a snowflake
          landing and air being locked away, with a measurement against each one.
        assumes:
          - a quantity that passes through several stages is limited by one of them
        takeaway: In a chain of stages, one of them sets the answer and the others follow it.
        format: CHAIN
        question: Which stage decides how much older the ice is than the air inside it?
        answerText: Pore close-off. The offset is the age of the ice at the depth where the pores seal, so everything above that depth is a firn column and everything below it is a bubble.
        chain:
          hint: >-
            Put the stages in the order air actually passes through them, then name the one that
            fixes the size of the age difference.
          links:
            - id: snowfall
              label: Snow lands on the surface
              transfers: New mass, carrying the isotopes of the air it condensed from
              reading: 0.32 m of new snow a year
            - id: burial
              label: The layer is buried and begins to compact
              transfers: Load from everything above it, squeezing the pore space smaller
              reading: Density rising from 340 to 550 kg per cubic metre
            - id: mixing
              label: Air moves through the open pores
              transfers: Atmospheric composition, exchanged with the surface
              reading: Mixes to within a decade of the surface air
            - id: closeoff
              label: The pores seal into separate bubbles
              transfers: The atmosphere of that moment, locked into the ice
              reading: Complete by 88 m
            - id: compression
              label: Bubbles compress and eventually become clathrate
              transfers: Pressure into the trapped gas, then into the crystal structure
              reading: Bubbles gone below about 1,200 m
          order: [snowfall, burial, mixing, closeoff, compression]
          governing: closeoff
          distractor: mixing
          commit: Name the governing stage
        why: >-
          Every stage moves something, but only one of them fixes the size of the offset. Air
          exchanges with the atmosphere all the way down the firn, so its age barely changes while
          the ice around it gets older year by year; the moment the pores seal is the moment that
          exchange stops, and the age difference is fixed at whatever the ice's age is at that
          depth. Mixing looks like the answer because it is the process that keeps the air young,
          but its effect is a decade against a difference of centuries.
      - group: CORE
        task: Explain the smoother record
        title: Why the gas record has no sharp edges
        place: Core Line
        scene: >-
          Okonkwo has the two records from the same depths on one plot. The ice record has features
          a few years wide. The gas record from the same interval has nothing narrower than a few
          decades.
        assumes:
          - a measurement that averages over an interval cannot show anything shorter than it
        takeaway: A record made by an averaging process cannot show a change faster than the averaging.
        format: CHOICE
        question: Why is the gas record smoother than the ice record from the same depths?
        answerText: The air mixed through the whole firn column before it was sealed, so each bubble holds an average of several decades of atmosphere rather than one year of it.
        choices:
          - Each bubble holds air mixed over the decades it took the pores to close
          - Gas measurements are made on larger samples, so they average more ice
          - Carbon dioxide changes more slowly in the atmosphere than temperature does
          - Bubbles leak slowly into one another over thousands of years
        answer: Each bubble holds air mixed over the decades it took the pores to close
        why: >-
          Air is in contact with the atmosphere throughout the open firn, and the pores do not all
          close at once — the closing happens across a depth range, so the bubbles sealed in one
          layer hold a mixture spanning the years that range represents. That smoothing is a
          property of the site: a high-accumulation site closes its pores in a decade and keeps
          sharp features, while this one takes several. Sample size makes a small contribution and
          could be reduced by cutting smaller pieces. The smoothing cannot.
        rebuttals:
          - Sample size is a choice and could be made smaller; the firn smoothing is fixed by the site
          - Some atmospheric changes are genuinely fast, and this record could not show them either
          - Bubbles are sealed and do not exchange with each other on any timescale that matters here
  # ------------------------------------------------------------------ day 7
  - title: What the wind brought
    objective: Use the chemistry in the ice to date it and to say something about elsewhere.
    briefing: Dust, sea salt and volcanic acid arrive from three different places for three different reasons.
    stake: >-
      Sunday, and the chemistry line has run the 1,100 to 1,300 metre section. Dust is up by a
      factor of four through the cold interval, sodium is up by half, and there is one sulphate
      spike that Okonkwo wants identified before it is used for anything. Cruz has the isotope
      ratios from the same section. Today you turn a raw ratio into an isotope value, say what the
      dust is evidence of, and decide which chemistry the season should pay to measure. Chemistry
      that arrives from somewhere else is the only part of this record that is about anywhere else.
    takeaway: What the wind carried is evidence about the places it came from, not only about here.
    stops:
      - group: COLD
        task: Report a ratio the way everyone else does
        title: The number that is a difference
        place: Cold Laboratory
        scene: >-
          Cruz has the raw ratio of heavy to light oxygen for a sample and the same ratio for the
          standard water. The record is plotted in parts per thousand and the raw numbers are not.
        assumes:
          - an isotope ratio is the amount of a heavy isotope divided by the amount of a light one
        takeaway: An isotope value is a comparison with an agreed water, which is why every one of them is negative here.
        format: BALLPARK
        question: Estimate the isotope value of this sample in parts per thousand.
        answerText: About −35 per mil. The sample holds 3.5 per cent less heavy oxygen than ocean water, which is what a polar site looks like.
        why: >-
          Isotope ratios differ from one another in the fourth decimal place, so nobody reports them
          as ratios. The convention is to divide the sample's ratio by the ratio of one agreed
          water, subtract one so that the standard itself reads zero, and multiply by a thousand so
          the numbers are convenient. What comes out is a difference in parts per thousand, always
          negative for polar snow because every stage of the journey from the ocean has already
          removed some of the heavy isotope. The scale is a comparison, and it only means anything
          if everyone uses the same water.
        estimate:
          prompt: The sample's ratio of heavy to light oxygen is 1.935 in thousandths; the standard ocean water reads 2.005 in the same units.
          question: Estimate the sample's isotope value in parts per thousand.
          relationship: δ¹⁸O = (R_sample ÷ R_standard − 1) × 1000 — the sample's heavy-to-light ratio against ocean water's, in parts per thousand.
          labels:
            - 1.935  (sample ratio, in thousandths)
            - 2.005  (standard ocean water, in thousandths)
            - 1000  (the factor that makes it parts per thousand)
            - 0.67  (the site temperature slope)
          values: [1.935, 2.005, 1000, 0.67]
          slots: 3
          template: '({0} ÷ {1} − 1) × {2}'
          formula: (a/b-1)*c
          correct: [0, 1, 2]
          target: -34.9
          tolerance: 2
          units: ‰
          solution: (1.935 ÷ 2.005 − 1) × 1000 = −34.9 per mil.
          explanation: The temperature slope belongs to the next step, after the value is on the scale everybody shares.
      - group: CORE
        task: Say what more dust means
        title: Four times the dust
        place: Core Line
        scene: >-
          Through the cold interval the dust concentration is four times the modern value and the
          grains are the same size distribution as today's. Okonkwo has the sodium record beside it,
          up by half over the same depths.
        assumes:
          - fine dust reaching this plateau has travelled thousands of kilometres
        takeaway: A concentration in the ice is a product of what was produced, what was carried, and how much snow diluted it.
        format: CHOICE
        question: What is the most defensible reading of four times the dust?
        answerText: More dust arrived per unit of snow — which is some combination of drier source regions, stronger transport, and less snowfall to dilute it, and the three are not separable from this measurement alone.
        choices:
          - More dust arrived per unit of snow, for reasons this cannot separate
          - The source regions released four times as much dust as they do today
          - Winds over the Southern Ocean were four times stronger during the cold interval
          - Four times as much dust was produced globally at that time
        answer: More dust arrived per unit of snow, for reasons this cannot separate
        why: >-
          A concentration is an amount of dust divided by an amount of snow, so it responds to three
          separate things: how much dust the source regions released, how efficiently the winds
          delivered it, and how much snow fell here to dilute it. Accumulation at this site drops in
          cold intervals, which raises concentration on its own. Separating the three needs the flux
          — concentration multiplied by accumulation — and the grain size and chemistry to identify
          the source. The concentration alone establishes that the delivery changed, and no more.
        rebuttals:
          - Source aridity is one of three contributing factors and is not measured by this number
          - Transport strength contributes and is estimated from grain size rather than from concentration
          - Global production is not what a single site measures; this site measures what reached it
      - group: DATA
        task: Fund the chemistry that dates the core
        title: What the chemistry budget should buy
        place: Science Module
        scene: >-
          Halvorsen has one chemistry line, six weeks, and four proposals from three groups. The
          depth–age scale below 1,600 metres is the season's stated objective.
        assumes:
          - an eruption of known date leaves a signature in ice all over the world
        takeaway: Work that could change what the season can claim is worth more than work that adds detail to what it already claims.
        format: SCIENCETANK
        task_line: Spend the chemistry line where it changes what the season can claim.
        proposals:
          - { label: A, text: 'Continuous sulphate and conductivity through the undated section, to find volcanic horizons.' }
          - { label: B, text: 'Tephra shard chemistry on every sulphate spike found, to match eruptions by name.' }
          - { label: C, text: 'Trace metals at high resolution through the modern century, for a pollution record.' }
          - { label: D, text: 'Repeat sodium measurements on the section already measured twice.' }
        recommended: { A: 45, B: 35, C: 20 }
        evidence: |
          The section below 1,600 metres has no dated horizon in it at all, and the layer count
          stopped above it. Two eruptions of known date are expected somewhere in that depth range.
          The modern pollution record is a genuine result and does not bear on the timescale. The
          sodium section has been measured twice already and both runs agree.
        why: >-
          The season's stated objective is a depth–age scale below the counted section. Only the
          volcanic work bears on it. Sulphate and conductivity find the candidates. The tephra
          chemistry turns a candidate into a named eruption with a date on it. Neither is worth much
          without the other. The pollution record is a real result for a different question. And a
          third run on ice that already has two agreeing measurements buys nothing at all.
  # ------------------------------------------------------------------ day 8
  - title: The year that is written everywhere
    objective: Use a dated eruption to tie this core to another one, and know what that tie does not fix.
    briefing: A sulphate spike at 1,642 metres could be the anchor the deep section needs.
    stake: >-
      Monday, and the chemistry has found a sulphate spike at 1,642 metres with glass shards in it.
      If it is the eruption Okonkwo thinks it is, the deep section gets its first fixed date and the
      two records get their first common point. Adeyemi wants to know what it does for the gas
      record, and the weather forecast gives Brandt one clear day for three tasks. Today you
      identify the spike, say what a tie point fixes, and choose what gets done before the wind
      comes back. A horizon named wrongly is worse than none: every age below it inherits the
      mistake, and the record ends up looking better dated than it is.
    takeaway: A dated event in two records fixes them to each other at that moment, and nowhere else.
    stops:
      - group: CORE
        task: Identify the horizon
        title: The spike at 1,642 metres
        place: Core Line
        scene: >-
          One sulphate spike, two candidate eruptions of similar age, and a set of glass shards
          recovered from the same centimetre. Okonkwo has the shard chemistry, the layer count and
          the modelled age on the bench.
        assumes:
          - volcanic glass carries the chemical composition of the volcano that erupted it
        takeaway: A horizon is identified by what is in it, not by the date it would be convenient for it to have.
        format: DIAGNOSIS
        headline: A sulphate spike at 1,642 m, with glass shards, and two candidate eruptions within a century of each other.
        readings:
          - { zone: Sulphate, label: Peak height, value: 8× background, status: alarm }
          - { zone: Glass shards, label: Composition, value: 'high-potassium, matches the northern candidate', status: alarm }
          - { zone: Layer count, label: Age at this depth, value: 'stopped 460 m above', status: low }
          - { zone: Flow model, label: Modelled age, value: 'within 90 years of both candidates', status: normal }
          - { zone: Replicate core, label: Same spike, value: 'present, 1.1 m shallower', status: normal, note: 'the two holes are 400 m apart' }
        choices:
          - label: The northern eruption, identified by the shard chemistry
            mechanism: Glass composition is specific to a volcano and does not depend on the timescale.
          - label: The southern eruption, since the modelled age fits it slightly better
            mechanism: The flow model puts this depth marginally closer to the southern date.
          - label: Neither; the spike is a sea-salt sulphate peak
            mechanism: Marine sulphate can produce peaks without any volcano at all.
          - label: Undecidable until the layer count is extended down to it
            mechanism: Nothing can be assigned a date without a continuous count reaching it.
        answer: The northern eruption, identified by the shard chemistry
        why: >-
          The shard chemistry is the only reading here that is independent of the timescale, and it
          is the one that discriminates: glass composition is a fingerprint of a particular magma
          and a particular volcano. The modelled age cannot choose between two candidates ninety
          years apart because its own uncertainty is larger than that gap. Sea-salt sulphate does
          not arrive with volcanic glass. And waiting for the layer count is waiting for something
          that stopped four hundred and sixty metres higher, which is the reason a dated horizon
          matters here at all.
      - group: GAS
        task: Say what the tie point does for the gas
        title: What a dated ash layer fixes
        place: Gas Laboratory
        scene: >-
          Adeyemi has the eruption date, the depth it sits at, and the carbon dioxide measurements
          from the bubbles in the same section of core.
        assumes:
          - volcanic ash settles out of the atmosphere within a year or two of an eruption
        takeaway: A tie point dates the material it is in, and anything else has to be reached by a calculation.
        format: CHOICE
        question: What does the dated horizon fix?
        answerText: The age of the ice at that depth. The age of the gas in the same section still has to be reached by subtracting the age difference.
        choices:
          - The age of the ice at that depth, and nothing else on its own
          - The age of both the ice and the gas at that depth, since they are in the same section
          - The age of the gas, because the ash and the atmosphere arrived together
          - The accumulation rate at that time, from the thickness of the ash layer
        answer: The age of the ice at that depth, and nothing else on its own
        why: >-
          Ash falls onto the surface and is buried with the snow, so it dates the ice it sits in.
          The air in the bubbles beside it was sealed centuries later, at the close-off depth, and
          it is that much younger. A tie point therefore fixes one of the two clocks in the core and
          leaves the other one to be reached by calculation — which is exactly why the age
          difference has to be estimated before any comparison between a gas record and an ice
          record can be made.
        rebuttals:
          - The two clocks are in the same section and are not the same clock, which is what the age difference measures
          - Ash arrives at the surface, and the air at that depth stopped moving centuries after it was buried
          - A layer thickness gives an accumulation rate only once its own age scale is known
      - group: FIELD
        task: Spend the clear day
        title: One clear day, three jobs
        place: Snow Study Hut
        scene: >-
          Brandt has a forecast that gives her one clear day and then four of blowing snow. Three
          jobs are outstanding and each takes most of a day on its own.
        assumes:
          - a measurement that cannot be repeated should be taken when it can be taken
        takeaway: Order the work by what becomes impossible, not by what is most important.
        format: TRIAGE
        question: Which job takes the clear day?
        answerText: The stake farm. It is the only one of the three that cannot be done in blowing snow, and a missed reading is a gap in the accumulation series that nothing can fill later.
        choices:
          - Read and re-level the stake farm across the whole array
          - Dig and photograph the fortnightly snow pit beside the hut
          - Service the mast instruments and download the temperature record
          - Re-drill the shallow firn core that broke last week
        answer: Read and re-level the stake farm across the whole array
        why: >-
          Two of these can be done in bad weather and one cannot. The pit is beside the hut and the
          mast is a short walk on a fixed line, so both survive four days of blowing snow with
          nothing worse than discomfort. The stake array runs two kilometres out and needs
          visibility to level against; more to the point, blowing snow redistributes the surface the
          stakes are measuring, so a reading taken after the storm is measuring something different.
          The shallow core can be re-drilled in any weather at all.
        rebuttals:
          - The pit is a few metres from the hut door and can be dug in any weather
          - The mast is on a fixed line and its record is stored until somebody collects it
          - A firn core that broke can be re-drilled whenever the drill is free
  # ------------------------------------------------------------------ day 9
  - title: Where the record runs out
    objective: Establish how thin the deep layers are and which uncertainty dominates what is claimed from them.
    briefing: The drill is at 2,410 metres and every year down there is a few millimetres thick.
    stake: >-
      Tuesday, and the drill has passed 2,400 metres. Lindqvist has clean core and Okonkwo has ages
      that no longer come from counting anything. Halvorsen wants the deep section in the season
      summary, which means saying how well it is dated, and Aalto has three uncertainties to
      combine before anybody writes a number down. Today you work out how thin a year is at that
      depth, decide which uncertainty is worth spending the season's remaining time on, and settle
      what the ice just above the bed can be used for. Deep ice is the whole reason the hole is
      here, and it is also the part with the least evidence attached.
    takeaway: The deepest ice holds the longest record and the weakest claim about it.
    stops:
      - group: DRILL
        task: Work out how thin a year is down there
        title: A year at two thousand four hundred metres
        place: Drill Trench
        scene: >-
          The ice is 3,010 metres thick here and the barrel is at 2,400. At the surface a year is
          about 0.119 metres of ice equivalent, and Lindqvist wants to know what one is now.
        assumes:
          - ice spreads outwards under its own weight, stretching the layers below
        takeaway: Thinning is why a deep core holds so much time in so little ice.
        format: BALLPARK
        question: Estimate the thickness of one annual layer at 2,400 metres.
        answerText: About 0.024 metres — a fifth of a surface year, squeezed into twenty-four millimetres.
        why: >-
          Ice flows outwards from the dome, and to keep going it has to stretch, so each layer
          thins as the weight above it grows. The simplest model treats the vertical strain as
          uniform, which makes a layer's thickness fall in proportion to the distance left to the
          bed: at four-fifths of the way down, a layer is one-fifth of what it was. That is what
          packs a hundred thousand years into the bottom kilometre, and it is also why the count
          stops and the dating starts depending on a model.
        estimate:
          prompt: The ice is 3,010 metres thick and the sample is from 2,400 metres. A year at the surface is 0.119 metres of ice equivalent.
          question: Estimate the thickness of one annual layer at that depth.
          relationship: λ(z) = λ₀ × (H − z) ÷ H — the layer's original thickness, scaled by how much of the ice sheet is left below it.
          labels:
            - 0.119 m  (a year at the surface)
            - 3010 m  (total ice thickness)
            - 2400 m  (depth of this sample)
            - 88 m  (close-off depth)
          values: [0.119, 3010, 2400, 88]
          slots: 3
          template: '{0} × ({1} − {2}) ÷ {1}'
          formula: a*(b-c)/b
          correct: [0, 1, 2]
          target: 0.0241
          tolerance: 0.003
          units: m per year
          solution: 0.119 × (3010 − 2400) ÷ 3010 = 0.0241 m.
          explanation: The close-off depth belongs to the firn at the top of the core and has nothing to do with how the deep layers are stretched.
      - group: DATA
        task: Find the uncertainty worth reducing
        title: Which width the answer is made of
        place: Science Module
        scene: >-
          Aalto has the dust flux from the cold interval and four quantities behind it, each with
          its own uncertainty. There is time to improve one of them before the season ends.
        assumes:
          - a quantity multiplied into a result carries its own uncertainty into that result
        takeaway: A term's contribution is its own width multiplied by the power it is raised to, and the largest power is not always the largest contribution.
        format: PROPAGATE
        question: Which measurement should the remaining time buy?
        answerText: The past accumulation rate. Its thirty per cent uncertainty enters once and still dominates everything else on the board, including the grain diameter that is cubed.
        propagate:
          hint: >-
            Each term contributes its own fractional width times the power it is raised to. The bar
            is that contribution, not the power.
          output: { label: Dust flux during the cold interval, unit: 'mg m⁻² yr⁻¹' }
          costUnit: days
          inputs:
            - { id: diameter, label: Mean grain diameter, value: 2.1, unit: µm, sigmaFrac: 0.05, exponent: 3 }
            - { id: number, label: Grain number concentration, value: 41000, unit: 'per mL', sigmaFrac: 0.10, exponent: 1 }
            - { id: accum, label: Accumulation rate at the time, value: 0.06, unit: 'm ice eq/yr', sigmaFrac: 0.30, exponent: 1 }
            - { id: rho, label: Mineral density, value: 2650, unit: 'kg/m³', sigmaFrac: 0.04, exponent: 1 }
          improvable:
            - { id: diameter, label: Size every grain in four more sections, cost: 2, newSigmaFrac: 0.02 }
            - { id: accum, label: Layer-count the cold interval in the replicate core, cost: 3, newSigmaFrac: 0.08 }
            - { id: number, label: Recount at higher dilution, cost: 1, newSigmaFrac: 0.05 }
          dominant: accum
          commit: Book the work
        why: >-
          A term enters the result raised to some power, and its contribution to the width of the
          answer is that power multiplied by its own fractional uncertainty. The grain diameter is
          cubed, which makes it look like the term to fix, but it is known to five per cent, so it
          contributes fifteen. The accumulation rate enters once and is known to thirty, so it
          contributes twice as much on its own. Ranking by exponent is a reasonable habit and it
          picks the wrong measurement here.
      - group: CORE
        task: Say what the deepest ice is good for
        title: The last hundred metres
        place: Core Line
        scene: >-
          Holt has core from the bottom of the drilled section. The layers are folded back on
          themselves in places and the isotope profile has reversals in it that no year could
          produce.
        assumes:
          - ice near the bed has flowed over rough ground for a long time
        takeaway: Ice can be perfectly good material and still hold no readable order.
        format: CHOICE
        question: What is the folded basal section still good for?
        answerText: Anything that does not need the layers to be in order — gas composition, total gas content, the age of the oldest ice present — with its stratigraphy declared as disturbed.
        choices:
          - Measurements that need no ordered layers, with the disturbance recorded
          - Nothing; disturbed ice is removed from the record and archived unmeasured
          - The same measurements as the rest of the core, since the ice itself is unaltered
          - Dating only, since the oldest ice is what the deep section was drilled for
        answer: Measurements that need no ordered layers, with the disturbance recorded
        why: >-
          Ice near the bed has been dragged over rough ground for a long time, so layers are folded,
          sheared and sometimes overturned. The material is unchanged and the order is gone, which
          rules out anything that depends on depth meaning time — a temperature history, a layer
          count, a rate of change. It does not rule out what an unordered sample can still answer:
          what gases are present, how much air the ice holds, how old the oldest ice down there is.
          The disturbance has to travel with the data, because the next person will not see the fold.
        rebuttals:
          - Archiving it unmeasured discards answers that never depended on the order
          - The ice is unaltered and the stratigraphy is not, and half the measurements need the stratigraphy
          - Dating disturbed ice gives the age of a fragment rather than the age of a depth
  # ------------------------------------------------------------------ day 10
  - title: Two records, side by side
    objective: Put both records on one plot and find out how much of the comparison is independent.
    briefing: The Skarv record and this one differ by more than either group's stated uncertainty.
    stake: >-
      Wednesday, and both records are on one screen for the first time. They differ by about half a
      per mil through the cold interval, which is larger than either group has claimed as its
      uncertainty. Halvorsen has a draft paragraph written. Okonkwo has asked what the two records
      have in common before anybody asks what they disagree about. Today you work out which parts of
      the comparison are independent, what the gas record says about the energy budget, and what
      half a per mil is worth in degrees. Two records that share a method are one record with two
      names on it.
    takeaway: Agreement between two records is worth what their independence is worth.
    stops:
      - group: DATA
        task: Find what the two records share
        title: What both records rest on
        place: Science Module
        scene: >-
          Five pieces of the comparison are on Aalto's screen, each one computed from something.
          Okonkwo wants to know which of them would still stand if the flow model were wrong.
        assumes:
          - two results computed from one assumption fail together if that assumption fails
        takeaway: Two numbers that agree because they came through the same step have not confirmed each other.
        format: TRACE
        question: Which parts of this comparison would survive the flow model being wrong?
        answerText: The counted section and the tephra tie point. Everything below the counts on both sides was dated with the same flow model, so those two agreeing establishes nothing about it.
        trace:
          hint: >-
            Open each piece to see what it was computed from. Keep the ones that would still stand
            on their own, then name the thing the rest have in common.
          channels:
            - { id: ourdeep, label: 'Our ages below 1,600 m', reading: '18,400 yr at 2,100 m', depends: [flow] }
            - { id: skarvdeep, label: 'Skarv ages below their count', reading: '18,050 yr at their 1,940 m', depends: [flow] }
            - { id: ourcount, label: 'Our counted section, surface to 1,180 m', reading: '9,900 layers counted', depends: [] }
            - { id: tephra, label: 'Tephra horizon, dated by its eruption', reading: '1,642 m, dated independently', depends: [] }
            - { id: skarvgas, label: 'Skarv gas ages below their count', reading: '17,600 yr at their 1,940 m', depends: [flow, offset] }
          resources:
            - { id: flow, label: 'The Nye flow model, used by both groups below their counts' }
            - { id: offset, label: 'The gas–ice age difference, estimated from firn density' }
          independent: [ourcount, tephra]
          target: flow
          commit: Commit the independent evidence
        why: >-
          Both groups counted layers as far as they could and then handed the rest to the same flow
          model, with the same assumption of uniform vertical strain. Below those counts the two age
          scales are not independent estimates that happen to agree; they are one calculation
          applied twice. What survives the model being wrong is the counted section, which is
          arithmetic on measured layers, and the tephra horizon, whose date came from a volcano and
          not from any ice. Those two are the comparison. The rest is a shared assumption.
      - group: GAS
        task: Turn a gas record into an energy number
        title: What the carbon dioxide change was worth
        place: Gas Laboratory
        scene: >-
          Adeyemi has carbon dioxide at 190 parts per million through the cold interval and 280 at
          the top of the core. Halvorsen wants the difference expressed as an energy imbalance.
        assumes:
          - a greenhouse gas reduces the rate at which the surface loses heat to space
        takeaway: A concentration becomes a climate statement only through the energy it changes.
        format: BALLPARK
        question: Estimate the radiative forcing between the two concentrations.
        answerText: About 2.1 watts per square metre. The change from 190 to 280 parts per million is roughly a third of the way to a doubling.
        why: >-
          Carbon dioxide absorbs in bands that are already partly saturated, so each extra molecule
          does less than the one before it, and the forcing goes as the logarithm of the
          concentration rather than in proportion to it. That is why the effect is usually stated per
          doubling: every doubling adds about the same. Between the cold interval and the top of the
          core the concentration rose by half, which is worth about two watts on every square metre
          of the planet, sustained for as long as it lasts.
        estimate:
          prompt: Carbon dioxide is 190 parts per million in the cold interval and 280 at the top of the core.
          question: Estimate the radiative forcing between the two.
          relationship: ΔF = 5.35 × ln(C ÷ C₀) — the logarithm of the concentration ratio, times the coefficient for carbon dioxide, in watts per square metre.
          labels:
            - 280 ppm  (top of the core)
            - 190 ppm  (the cold interval)
            - 5.35  (the coefficient for carbon dioxide)
            - 0.67  (the isotope temperature slope)
          values: [280, 190, 5.35, 0.67]
          slots: 3
          template: '{2} × ln({0} ÷ {1})'
          formula: c*Math.log(a/b)
          correct: [0, 1, 2]
          target: 2.07
          tolerance: 0.25
          units: W/m²
          solution: 5.35 × ln(280 ÷ 190) = 2.07 W/m².
          explanation: The isotope slope converts a ratio into degrees at this site, which is a different step in a different part of the argument.
      - group: COLD
        task: Say what the offset is worth in degrees
        title: Half a per mil, in degrees
        place: Cold Laboratory
        scene: >-
          The two records differ by about half a per mil through the cold interval. Tanabe has the
          site calibration slope and Halvorsen's draft paragraph, which calls the difference a
          different climate.
        assumes:
          - an isotope difference is converted to a temperature difference by the site slope
        takeaway: A difference has to be converted into the units of the claim before anybody can judge it.
        format: CHOICE
        question: What does half a per mil amount to, in the terms the draft paragraph uses?
        answerText: About three quarters of a degree — which is smaller than the cooling being reported and large enough to matter to it.
        choices:
          - About three quarters of a degree — a quarter of the reported cooling
          - About half a degree, since the slope is close to one per mil for each degree
          - Nothing until the difference exceeds the scatter of a single measurement
          - About four degrees, since the slope is measured in per mil per degree
        answer: About three quarters of a degree — a quarter of the reported cooling
        why: >-
          The site slope is 0.67 per mil for each degree, so half a per mil is about 0.75 of a
          degree. That is the whole point of converting: in per mil the difference sounds like a
          rounding error, and in degrees it is a quarter of the cooling the season intends to
          report. Whether it is a real climate difference or a shared method's shortcoming is a
          separate question, and it cannot be argued about honestly until both sides are talking in
          the same units.
        rebuttals:
          - A slope of one per mil per degree is not this site's slope, and using it changes the answer by half
          - Scatter on a single measurement is much smaller than this difference, which is why it was noticed
          - Multiplying by the slope instead of dividing by it gives a number about five times too large
  # ------------------------------------------------------------------ day 11
  - title: The offset that was not climate
    objective: Test whether the age difference accounts for the disagreement before it is called one.
    briefing: The two records may differ because one dates ice and the other dates gas.
    stake: >-
      Thursday, and Adeyemi has spent the night on the two groups' age scales. Skarv sits at four
      times this station's accumulation rate, which means its gas–ice age difference is a fraction
      of ours — and the comparison so far has been plotted with both gas records on their own ice
      timescales. Okonkwo has been saying since the first week that two clocks have to be matched
      first. Today you predict what the difference becomes once the correction is applied, apply it,
      and check it against the one date neither group calculated. Getting this wrong publishes a
      chronology error as a climate result.
    takeaway: A disagreement between two records is a claim about both of them, including how they were dated.
    stops:
      - group: GAS
        task: Predict, correct, then check
        title: What the correction leaves behind
        place: Gas Laboratory
        scene: >-
          Adeyemi has the age difference for both sites and the machinery to re-plot both gas
          records on their own gas timescales. The tephra horizon is dated independently of either
          calculation.
        assumes:
          - a correction should be predicted before it is applied, or it cannot be wrong
        takeaway: A prediction made before the correction is the only thing that can test it.
        format: VERIFY
        question: What is left of the difference once both gas records are on their own gas timescales?
        answerText: About 0.15 per mil — most of the difference was the age offset, and what remains is inside both groups' stated uncertainties.
        verify:
          hint: >-
            Write down what you expect the difference to become. It cannot be changed after the
            correction is applied, which is the point of writing it first.
          prediction: { label: Difference remaining after the correction, unit: '‰', min: 0, max: 1.2, step: 0.05 }
          truth: 0.15
          passRatio: [0.4, 2.0]
          intervention:
            label: Re-plot both gas records on their own gas timescales
            note: Each site's age difference applied to its own record, from its own firn density and accumulation.
            outcome: Both curves move. This station's moves by four hundred and fifty years, Skarv's by a hundred and ten.
          measurement:
            label: The remaining difference, measured at the tephra horizon
            note: The one depth in both cores whose date came from a volcano rather than a model.
            cost: 1
            costUnit: runs
          unmeasuredMoral: >-
            The correction was applied, both curves moved, and nobody checked the result against the
            one date that did not come from either calculation. A correction that is never tested is
            an assumption with more arithmetic in it.
          commit: Report what is left
        why: >-
          Air keeps mixing with the atmosphere until the firn seals, so gas is younger than the ice
          around it by an amount set by how deep the sealing is and how fast snow arrives. Skarv
          accumulates four times as fast, so its offset is a fraction of this station's. Plotting
          both gas records on ice timescales therefore shifts one curve much further than the other,
          and produces a difference that looks like climate and is arithmetic. What makes the
          corrected answer trustworthy is the tephra: a date neither calculation produced.
      - group: CORE
        task: Date ice the counting cannot reach
        title: The clock that does not need layers
        place: Core Line
        scene: >-
          Okonkwo has a sample from the deep section and a radiometric result: the isotope in it has
          fallen to 0.55 of the amount it starts with. Its mean lifetime is on the bench.
        assumes:
          - a radioactive isotope decays at a rate nothing in the ice can change
        takeaway: Where counting has run out, a clock that runs on its own is the only independent date left.
        format: BALLPARK
        question: Estimate the age of the sample from what is left of the isotope.
        answerText: About 4,900 years. Decay is the one clock in the core that does not depend on the flow model.
        why: >-
          Radioactive decay proceeds at a rate that no temperature, pressure or flow in the ice can
          change, which is what makes it usable where the layers have stopped being countable. The
          amount left falls exponentially with time, so taking the natural logarithm of the fraction
          remaining and multiplying by the mean lifetime gives the age directly. It carries its own
          uncertainties — how much was there to begin with, whether anything was added or lost — and
          none of them is the flow model, which is why the result is worth having.
        estimate:
          prompt: The isotope has fallen to 0.55 of its initial amount. Its mean lifetime is 8,267 years.
          question: Estimate the age of the sample.
          relationship: t = −τ × ln(N ÷ N₀) — the isotope's mean lifetime, times the logarithm of the fraction still remaining.
          labels:
            - 0.55  (fraction of the isotope remaining)
            - 8267 yr  (mean lifetime)
            - 5730 yr  (the half-life of the same isotope)
            - 3010 m  (ice thickness)
          values: [0.55, 8267, 5730, 3010]
          slots: 2
          template: '−{1} × ln({0})'
          formula: -b*Math.log(a)
          correct: [0, 1]
          target: 4941
          tolerance: 400
          units: years
          solution: −8267 × ln(0.55) = 4,941 years.
          explanation: The half-life is the same clock in different units and belongs in a different form of the equation; using it here gives an age a third too short.
      - group: DATA
        task: Say what the corrected comparison supports
        title: What is left to disagree about
        place: Science Module
        scene: >-
          Both records are re-plotted, the tephra horizon lines up in both, and 0.15 per mil of
          difference remains. Both groups quote uncertainties larger than that.
        assumes:
          - a difference smaller than the uncertainty of either measurement is not a measured difference
        takeaway: Explaining a disagreement away is a result, and it is the result that has to be published.
        format: CHOICE
        question: What does the corrected comparison support?
        answerText: That the two records are consistent, and that most of the apparent difference was the gas–ice age offset rather than climate.
        choices:
          - The two records are consistent once both are on gas timescales
          - The two records disagree, but by less than was first thought
          - Nothing at all, since a correction had to be applied to reach the result
          - The Skarv record is wrong, since its offset was the smaller of the two
        answer: The two records are consistent once both are on gas timescales
        why: >-
          What remains after the correction is smaller than either group's stated uncertainty, so
          there is no measured difference left to explain. That is a positive result rather than an
          absence of one: two independently drilled cores, once put on comparable clocks, record the
          same cooling. The correction does not weaken it — it was predicted before it was applied
          and then checked against a date that came from neither calculation. And nothing here makes
          Skarv wrong; both records were plotted on the wrong clock, and only one of them moved far.
        rebuttals:
          - A remaining difference below both uncertainties is not a disagreement of any size
          - A correction that was predicted and then tested is evidence rather than a weakness
          - Both records were on ice timescales; the offset is smaller at Skarv because it snows more there
  # ------------------------------------------------------------------ day 12
  - title: A day when nothing is wrong
    objective: Spend what is left of the season on the work that will still matter next year.
    briefing: The drill is running clean and there are nine drilling days left.
    stake: >-
      Friday, and for the first time this season nothing is broken. The drill is running clean,
      the chemistry line is caught up, and the camp manager, Anneke de Vries, needs the remaining
      plan before the fuel figures are committed. Nine drilling days are left and four jobs want
      them. Today you commit the drill time, settle what a single stake reading is worth, and fix
      the order a measurement run is made in. Nothing on the station is on fire, which makes this
      the only day of the season when the decision can be made on what is worth doing rather than
      on what has just gone wrong.
    takeaway: The quiet days are when the season decides what it will have been about.
    stops:
      - group: DRILL
        task: Commit the last drilling days
        title: Nine days, four jobs
        place: Drill Trench
        scene: >-
          Lindqvist has nine drilling days before the station closes. De Vries has the fuel
          committed for those nine and no more, and four pieces of work want them.
        assumes:
          - a season ends on a date fixed by aircraft rather than by science
        takeaway: A plan is judged by which questions it can still answer, not by how much it fits in.
        format: ALLOCATE
        question: Which questions can the last nine days still answer?
        answerText: Extending the deep section and cutting the replicate at the tephra horizon, on top of the fluid change the drill cannot run without. The firn re-drill and the borehole log are real work and neither answers a question this season needs.
        allocate:
          hint: >-
            The fluid change is not optional. What is left has to be spent on the questions that
            change what the season can claim.
          pool: { amount: 9, unit: drilling days, mode: scalar }
          items:
            - { id: fluid, label: Drill fluid change and barrel service, cost: 2, protected: true, note: 'the drill does not turn without it' }
            - { id: deepen, label: Extend the hole past the modelled clathrate boundary, cost: 4 }
            - { id: replicate, label: Cut the replicate core through the tephra horizon, cost: 3 }
            - { id: firn, label: Re-drill the shallow firn core that broke, cost: 2 }
            - { id: logging, label: Run the borehole temperature log to the bottom, cost: 3 }
          answers:
            - { question: 'Does the deep section reach ice older than the counted record can reach?', requires: [deepen], required: true }
            - { question: 'Is the tephra horizon present in a second hole four hundred metres away?', requires: [replicate], required: true }
            - { question: 'What is the firn air profile this season?', requires: [firn] }
            - { question: 'What is the present-day temperature profile of the ice?', requires: [logging] }
          commit: Commit the drilling plan
        why: >-
          The two required questions are the ones this season exists to answer: whether the deep
          section reaches older ice, and whether the horizon everything is now tied to appears in
          ice that shared the weather but not the drill. Together with the fluid change they use
          exactly the nine days available. The firn profile and the borehole log are both good work
          and both can be done next season by somebody who has not yet drilled to 2,400 metres. A
          plan that fits everything in is a plan that has not been asked what it is for.
      - group: FIELD
        task: Say what one stake is worth
        title: The stake that gained a centimetre
        place: Snow Study Hut
        scene: >-
          Brandt has 48 stakes read this morning. One near the hut has gained a centimetre since the
          last reading. Eleven others across the array have lost about the same.
        assumes:
          - wind moves snow across a surface after it has fallen
        takeaway: A measurement of a surface that moves has to be made in enough places to catch what moved.
        format: CHOICE
        question: What does the gain at that one stake establish?
        answerText: Almost nothing on its own. Snow moves sideways in wind, so a gain in one place and losses elsewhere is redistribution until the whole array is added up.
        choices:
          - Little on its own; the whole array separates snowfall from drift
          - That accumulation is higher near the hut, which shelters the surface from the wind
          - That this fortnight's snowfall was about a centimetre
          - That the stake has been disturbed, since the others lost snow
        answer: Little on its own; the whole array separates snowfall from drift
        why: >-
          Wind on this plateau moves far more snow horizontally than falls out of the sky in a
          fortnight, so any single stake is measuring snowfall and redistribution added together
          and cannot separate them. The array can: snow moved from one place to another cancels
          when the whole array is summed, and what is left is what actually arrived. That is why
          forty-eight stakes are read rather than one, and why the accumulation figure is a season's
          arithmetic rather than a reading.
        rebuttals:
          - Sheltering is a real effect and would have to be established across several fortnights, not one
          - A fortnight's snowfall is what the whole array establishes, since drift cancels only in the sum
          - Eleven stakes losing snow is what redistribution looks like, and does not point at one disturbed stake
      - group: COLD
        task: Fix the order of a run
        title: The order a run is made in
        place: Cold Laboratory
        scene: >-
          Cruz has sixteen samples to run and the instrument warmed up. Tanabe's rule is that a run
          has to be able to say afterwards whether it can be trusted.
        assumes:
          - an instrument's response can move slowly during a long run
        takeaway: A run is designed so that it can be checked afterwards, not so that it finishes soonest.
        format: SEQUENCE
        cards:
          - Run a blank, to see what the process contributes with no sample in it
          - Run the working standard, to fix where the scale sits at the start
          - Run the samples in depth order, with a standard after every eighth
          - Run the working standard again at the end, to measure the drift across the run
          - Correct the samples for drift, and write the raw and corrected values to the record
        order: [0, 1, 2, 3, 4]
        why: >-
          Every step here exists to make the run auditable. The blank establishes what the process
          adds before any ice is involved; the opening standard fixes the scale; the standards
          inside the run reveal drift while it is happening; the closing standard measures how far
          it moved overall. Only then can the samples be corrected, and both the raw and the
          corrected values are kept because a correction is a claim about the instrument that
          somebody may want to check later.
  # ------------------------------------------------------------------ day 13
  - title: The night the generator stopped
    objective: Work out what the core store record can still prove after a power failure.
    briefing: The store was without power for six hours and the log says nothing about it.
    stake: >-
      Saturday, and the number two generator stopped at some point in the night. The core store came
      back at minus nineteen and the log has an entry for the whole night signed by the watch. De
      Vries needs the drill and the store back in a fixed order and Lindqvist wants his own list
      first. Aalto has been asked how much of the season's temperature record survives the scatter
      in it. Today you decide which signatures are worth checking, what gets restarted first, and
      how tightly a mean can be quoted. Ice that warmed and was signed for as cold is worse than
      ice that warmed.
    takeaway: A record is a claim about a condition, and the two can come apart in a night.
    stops:
      - group: COLD
        task: Check what is worth checking
        title: Six signatures and two hours
        place: Cold Laboratory
        scene: >-
          Six lines on the night sheet, all signed. Tanabe has two hours before the flight
          manifest closes and can verify two of them properly.
        assumes:
          - a signature records that somebody believed something, at the time they signed
        takeaway: A signed record is evidence that a claim was made, which is not evidence that it was true.
        format: ATTEST
        question: Which two claims should the two hours verify?
        answerText: The store temperature and the gas samples. Both are critical, both are signed with nothing behind them, and both would invalidate measurements if they are wrong.
        attest:
          hint: >-
            Everything here is signed. Verifying costs time and there is not enough of it for the
            whole sheet.
          checks: 2
          claims:
            - { id: store, label: 'Core store held at −25 °C all night', signedBy: 'Ekwueme', critical: true, evidence: 'signed at 0600 for the whole night; the store was reading −19 °C when the power came back' }
            - { id: gas, label: 'Gas samples remained below −20 °C', signedBy: 'Menon', critical: true, evidence: 'signed on the same sheet, from the same store, at the same time' }
            - { id: drill, label: 'Drill fluid tank heater running', signedBy: 'Lindqvist', backed: true, evidence: 'independent tank thermistor logged to a separate recorder all night' }
            - { id: mast, label: 'Mast instruments powered from the second circuit', signedBy: 'Brandt', critical: true, backed: true, evidence: 'the mast record itself is continuous through the outage' }
            - { id: kitchen, label: 'Food store above freezing', signedBy: 'de Vries', evidence: 'nobody has looked since the power came back' }
            - { id: fuel, label: 'Day tank filled at 2200', signedBy: 'de Vries', backed: true, evidence: 'level gauge reading logged before and after' }
          commit: Verify the two
        why: >-
          A signature says that somebody believed something when they signed, and the store reading
          of minus nineteen says the belief was wrong for at least part of the night. Two of these
          claims are both critical and carried by nothing but the signature — the store and the gas
          samples — and both decide whether measurements made on that ice can be defended. The mast
          is critical and already carries its own continuous record; the drill tank has an
          independent logger. The food and the fuel matter to the camp and not to the science.
      - group: DRILL
        task: Put the restart in order
        title: What comes back first
        place: Drill Trench
        scene: >-
          Power is back on one generator. Lindqvist, de Vries and Tanabe each want their own system
          restarted first, and the single generator will not carry all of them at once.
        assumes:
          - a system that has already failed is more informative than one that has not yet been used
        takeaway: Restart in the order of what is still being lost, not in the order of who asked.
        format: TRIAGE
        question: What is restarted first?
        answerText: The core store. It is the only one of the four still losing something irreversibly, and every hour above minus twenty costs gas measurements that cannot be made again.
        choices:
          - The core store refrigeration, which is still warming
          - The drill, so the day's run is not lost
          - The chemistry line, so the sixteen queued samples can be run
          - The satellite link, so the season report can be sent
        answer: The core store refrigeration, which is still warming
        why: >-
          Three of these are waiting and one is deteriorating. Ice above minus twenty starts losing
          gas from the bubbles near its cut faces, and that loss cannot be undone or measured
          around; every hour is more of the core that can no longer answer a gas question. A lost
          drilling day is a day, the queued samples are as good tomorrow as today, and a report sent
          six hours late is a report sent. Order by what is still being lost.
        rebuttals:
          - A drilling day is recoverable, and the drill is not losing anything while it stands idle
          - Queued samples are in the store; if the store is warm they are the thing being lost, not the queue
          - A report is not perishable, and the link is the only item here that changes nothing by waiting
      - group: DATA
        task: Say how tightly the mean can be quoted
        title: How much of it is noise
        place: Science Module
        scene: >-
          Aalto has thirty years of reconstructed annual temperature from the top of the core. The
          year-to-year scatter is 1.4 degrees and the summary wants a mean for the period.
        assumes:
          - averaging independent years reduces the scatter of the average, not of the years
        takeaway: An average is only as tight as the scatter divided by the root of how many years went into it.
        format: BALLPARK
        question: Estimate the standard error of the thirty-year mean.
        answerText: About 0.26 degrees. A difference between two such means smaller than half a degree is not a difference at all.
        why: >-
          Individual years scatter because weather scatters, and averaging does not remove that
          scatter — it reduces the uncertainty of the average, and only as the square root of the
          number of years. Thirty years of a record with 1.4 degrees of year-to-year variation give
          a mean known to about a quarter of a degree. Two such means half a degree apart are two
          standard errors apart, which is where a claim of difference starts becoming defensible and
          not before. Doubling the precision would take a hundred and twenty years.
        estimate:
          prompt: The reconstructed annual temperatures scatter by 1.4 degrees, and the period is thirty years long.
          question: Estimate the standard error of the thirty-year mean.
          relationship: SE = s ÷ √n — the year-to-year scatter, divided by the square root of how many years were averaged.
          labels:
            - 1.4 °C  (year-to-year scatter)
            - 30  (years in the period)
            - 0.67 ‰/°C  (the site calibration slope)
            - 11  (years of mast overlap)
          values: [1.4, 30, 0.67, 11]
          slots: 2
          template: '{0} ÷ √{1}'
          formula: a/Math.sqrt(b)
          correct: [0, 1]
          target: 0.256
          tolerance: 0.04
          units: °C
          solution: 1.4 ÷ √30 = 0.26 °C.
          explanation: The calibration slope is already inside the reconstruction; applying it again would convert degrees into degrees per degree.
  # ------------------------------------------------------------------ day 14
  - title: What the season is allowed to say
    objective: Choose the claim that survives the range of the correction, and get the report out.
    briefing: The report goes tomorrow, and the correction it rests on has a range rather than a value.
    stake: >-
      Sunday, and the season report closes tomorrow morning. The age difference that explained most
      of the disagreement is itself a calculation with a range, and Halvorsen has four possible
      sentences on the board. Okonkwo will sign the one that survives the whole range and no other.
      Adeyemi has been asked what the gas record on its own establishes. Today you choose the
      sentence, settle what the carbon dioxide measurements license, and fix what has to happen
      before anything is sent. Tomorrow the season stops being something anybody can add evidence
      to.
    takeaway: A claim has to survive the worst credible value of everything it rests on.
    stops:
      - group: DATA
        task: Choose the sentence that survives
        title: Four sentences and a range
        place: Science Module
        scene: >-
          The correction removes somewhere between a tenth and four tenths of a per mil of the
          difference, depending on assumptions nobody can settle this season. Four sentences are on
          the board.
        assumes:
          - a correction estimated from a model carries a range rather than a single value
        takeaway: The claim to publish is the one that is still true at the least favourable end of what you assumed.
        format: STRESS
        question: Which sentence would still be true at the least favourable end of the correction's range?
        answerText: That part of the difference is chronological and the remainder is not yet explained. It is the only sentence that holds whether the correction removes a tenth of a per mil or four tenths.
        stress:
          hint: >-
            The correction has a range because the firn model has one. Move it to the unfavourable
            end before choosing what to sign.
          assumption:
            label: Difference removed by the age correction
            unit: '‰'
            min: 0.10
            max: 0.40
            nominal: 0.30
            step: 0.01
          criteria:
            - { key: weeks, label: Weeks to draft and review, unit: wk }
            - { key: risk, label: Chance of later correction, unit: '%' }
          candidates:
            - { id: consistent, label: 'The two records are consistent once the correction is applied' }
            - { id: partial, label: 'Part of the difference is chronological; the rest is unexplained' }
            - { id: entirely, label: 'The difference is entirely chronological' }
            - { id: climate, label: 'The two sites recorded different coolings' }
          scores:
            consistent: { weeks: 3, risk: 18 }
            partial: { weeks: 5, risk: 12 }
            entirely: { weeks: 2, risk: 46 }
            climate: { weeks: 2, risk: 61 }
          feasible:
            consistent: 0.25
            partial: 0.10
            entirely: 0.38
            climate: 0.45
          optimiseOn: weeks
          robust: partial
          commit: Sign the sentence
        why: >-
          The correction is calculated from a firn model, and firn models disagree with each other
          by more than anybody would like, so what comes out is a range. A sentence is publishable
          when it is still true at the least favourable end of that range. Saying the records are
          consistent needs the correction to do most of the work, and at the low end it does not.
          Saying the difference is entirely chronological needs more than the correction can do at
          any end. The hedged sentence is the slowest to write and the only one that survives.
      - group: GAS
        task: Say what the gas record alone establishes
        title: What the bubbles license
        place: Gas Laboratory
        scene: >-
          Adeyemi has carbon dioxide through the cold interval and the modern section, measured on
          this core and reproduced on the replicate. Halvorsen wants to know what it supports on its
          own.
        assumes:
          - a measurement made at one site can record a quantity that is the same everywhere
        takeaway: Some quantities measured at one place are global, and a proxy of local weather is not one of them.
        format: CHOICE
        question: What does the carbon dioxide record support that the isotope record cannot?
        answerText: A statement about the whole atmosphere. Carbon dioxide mixes globally within a couple of years, so a measurement here is a measurement of the planet's air.
        choices:
          - A statement about the global atmosphere, since the gas is well mixed
          - A statement about the temperature of this site, more directly than the isotopes do
          - A statement about how much snow fell, since concentration depends on accumulation
          - Nothing the isotope record does not already support, since both come from the same ice
        answer: A statement about the global atmosphere, since the gas is well mixed
        why: >-
          Carbon dioxide stays in the air long enough to mix through all of it before it is removed.
          Its concentration is therefore very nearly the same everywhere. A bubble from this plateau
          reports the whole planet's air, and it is the one global quantity this core measures
          directly. The isotopes are different. They record the condensation temperature over this
          region, and they reach degrees through a slope fitted at this site. Local at both steps.
        rebuttals:
          - Temperature at this site is what the isotopes measure, through a slope, and the gas does not measure it at all
          - A gas concentration in a bubble is a mixing ratio and does not depend on how much snow buried it
          - Sharing the same ice is not the same as supporting the same claims, which is the whole distinction here
      - group: CORE
        task: Fix what happens before the report goes
        title: Before anything is sent
        place: Core Line
        scene: >-
          Okonkwo has the sentence, the corrected records and a report that closes in the morning.
          Four things are outstanding and their order is not obvious.
        assumes:
          - a result should be reproducible by somebody who was not present
        takeaway: A result leaves the station as a package: the numbers, the version, and what was assumed.
        format: SEQUENCE
        cards:
          - Freeze the version of both age scales the result was computed on
          - Recompute the corrected comparison from that frozen version, from raw data
          - Write the correction, its range and the firn model it came from into the methods
          - Circulate the draft to the Skarv group before it is submitted anywhere
          - Send the report, with the archived data referenced by version
        order: [0, 1, 2, 3, 4]
        why: >-
          Each step is what makes the next one mean something. Freezing the age scales fixes what
          the result was computed on, which is the only way anybody can reproduce it later.
          Recomputing from raw data on that frozen version tests that the number in the draft is
          the number the method produces. Writing the correction and its range into the methods is
          what lets a reader disagree with it specifically. Circulating to the other group is what
          turns a disagreement about their record into a conversation with them. Then it goes.
  # ------------------------------------------------------------------ day 15
  - title: What is known, and how well
    objective: State what the season established, at what precision, and what it could not reach.
    briefing: The last day is spent deciding what the record supports and what the next season must do.
    stake: >-
      Monday, the last working day, and the aircraft comes on Wednesday. The report is sent and
      Halvorsen wants the season's own account of itself: what is established, what rests on a
      model, and what the next team has to do first. Brandt is closing the stake array and Tanabe
      has one question left about how fine the record can ever be. Today you settle which sentence
      the record supports, sort what the season established from what it assumed, and put a number
      on the shortest event this ice could still show. What the next team believes about this ice is
      what gets written down now.
    takeaway: A record is worth what its limits are known to be.
    stops:
      - group: DATA
        task: Choose the sentence the record supports
        title: The sentence the record will carry
        place: Science Module
        scene: >-
          Four versions of the season's headline claim, all of them true in some sense, on Aalto's
          screen. One of them is the one the evidence actually reaches.
        assumes:
          - a claim is supported when the evidence would have come out differently if it were false
        takeaway: An honest claim states what was measured, over what period, with what uncertainty.
        format: CHOICE
        question: Which sentence does this season's evidence reach?
        answerText: The one that names the cooling, the period, the uncertainty and the fact that the deep dating rests on a flow model.
        choices:
          - A cooling of about 2.7 degrees, modelled below the counted section
          - A cooling of two point seven degrees, established by two independent records
          - A cooling of about three degrees, consistent with the Skarv site
          - The largest cooling yet recorded at this latitude, pending the deep section
        answer: A cooling of about 2.7 degrees, modelled below the counted section
        why: >-
          The first sentence says what was measured, over what interval, and which part of it
          depends on something that was not measured here. The second calls the two records
          independent, which the shared flow model makes untrue below the counts. The third rounds
          the number until the uncertainty disappears into it and attributes agreement to a site
          whose comparison needed a correction. The fourth is a claim about every other record at
          this latitude, and nobody at this station has read them all.
        rebuttals:
          - The two records share a flow model below their counts, so "independent" is the word that fails
          - Rounding to three degrees hides the uncertainty that decides whether this differs from other sites
          - A superlative is a claim about everybody else's records, which this season did not examine
      - group: FIELD
        task: Sort established from assumed
        title: What rests on what
        place: Snow Study Hut
        scene: >-
          Brandt has the season's four headline numbers written on the hut wall and a column beside
          each one that nobody has filled in.
        assumes:
          - a number is only as strong as the weakest step between the ice and it
        takeaway: Every number in a proxy record belongs to a class, and the class is part of the number.
        format: PROTOCOL
        columns:
          - The season's number
          - What it actually rests on
        scenarios:
          - Accumulation of 0.119 metres of ice equivalent a year
          - A cooling of 2.7 degrees in the cold interval
          - An age of 18,400 years at 2,100 metres
          - Carbon dioxide of 190 parts per million in the cold interval
        choices:
          - Measured directly at the surface, and checkable against next season's stakes
          - Measured, then converted through a slope fitted to eleven years of overlap
          - Counted as far as the layers allowed, and modelled below that
          - Measured on air that is well mixed, at a depth whose own age is modelled
        mapping: [0, 1, 2, 3]
        why: >-
          The four numbers are not the same kind of thing, and the report has to say so. The
          accumulation is a direct measurement of the surface and can be checked next year. The
          cooling is a measurement passed through a calibration, so it inherits the calibration's
          uncertainty. The age is counted where counting worked and modelled where it did not. The
          gas concentration is a solid measurement of a global quantity attached to a depth whose
          age is itself modelled — strong in what it measures, weaker in when it happened.
        rebuttals:
          - The cooling is not a direct surface measurement; it arrives through a fitted slope
          - The age below the counted section is not checkable against next season's stakes
          - The gas concentration is well measured and its date is the modelled part of it
      - group: COLD
        task: Put a number on the finest event
        title: The shortest thing this ice can show
        place: Cold Laboratory
        scene: >-
          Tanabe has the firn diffusion length for this site and the surface layer thickness. The
          next team wants to know whether a single warm summer could ever be found in this core.
        assumes:
          - water molecules move through firn before the pores seal, averaging nearby layers together
        takeaway: A record has a shortest event it can show, and it is set by the site rather than by the instrument.
        format: BALLPARK
        question: Estimate the shortest event this record could still resolve, in years.
        answerText: About 1.3 years at the surface, and longer at every depth below it as the layers thin.
        why: >-
          Water molecules diffuse through the connected pores of the firn for as long as those pores
          are open, which averages each layer with its neighbours. The scale of that averaging is
          the diffusion length, and anything thinner than about twice it is smoothed away past
          recovery. Dividing that limit by the annual layer thickness gives the answer in years. At
          the surface this site can just about hold a single year; deeper, where the layers have
          thinned, the same diffusion length covers many years and the annual signal is gone for
          good.
        estimate:
          prompt: The firn diffusion length at this site is 0.08 metres, and a year at the surface is 0.119 metres of ice equivalent.
          question: Estimate the shortest event the isotope record could still resolve.
          relationship: shortest event = 2σ ÷ λ — twice the diffusion length, divided by the thickness of one annual layer.
          labels:
            - 0.08 m  (diffusion length)
            - 2  (the factor below which a feature is lost)
            - 0.119 m/yr  (a year at the surface)
            - 0.0241 m/yr  (a year at 2,400 metres)
          values: [0.08, 2, 0.119, 0.0241]
          slots: 3
          template: '{1} × {0} ÷ {2}'
          formula: b*a/c
          correct: [0, 1, 2]
          target: 1.34
          tolerance: 0.2
          units: years
          solution: 2 × 0.08 ÷ 0.119 = 1.34 years.
          explanation: Using the deep layer thickness instead would answer a different question — the resolution at 2,400 metres, which is nearly seven years.

# What is inside each room the player walks into.
interiors:
  DRILL:
    caption: Three kilometres of hole, and one attempt at every metre of it.
    standLine: Run 214 on the barrel, 2,410 m. Brittle zone cleared, fluid due a change.
    station:
      kind: panel
      title: Winch and hole
      rows:
        - { label: Depth, value: 2410 m, status: normal }
        - { label: Cable tension, value: 11.4 kN, status: normal }
        - { label: Fluid return temperature, value: −31 °C, status: normal }
        - { label: Days of drilling left, value: '9', status: low }
  CORE:
    caption: A metre of ice is a decade here, and it is only worth that while its depth is known.
    standLine: Section 1,642.10–1,643.05 m. Sulphate spike and glass shards, logged, not yet cut.
    station:
      kind: panel
      title: Core line log
      rows:
        - { label: Section, value: '1,642.10 m', status: normal }
        - { label: Layer thickness here, value: 21 mm, status: low }
        - { label: Counted to, value: '1,180 m', status: normal }
        - { label: Breaks in this run, value: '3', status: high }
  COLD:
    caption: Every sample is melted once, and everything that touched it is written down first.
    standLine: Sixteen samples queued. Blank clean, opening standard within 0.03 per mil.
    station:
      kind: panel
      title: Isotope line
      rows:
        - { label: Laboratory temperature, value: −25 °C, status: normal }
        - { label: 'Standard, last run', value: '−0.02 ‰ from nominal', status: normal }
        - { label: Blank, value: at the usual level, status: normal }
        - { label: Samples queued, value: '16', status: high }
  GAS:
    caption: Air that stopped moving four hundred and fifty years after the snow around it fell.
    standLine: Extraction vessel loaded, 1,642 m. Line tested against standard gas at 0740.
    station:
      kind: panel
      title: Extraction line
      rows:
        - { label: Vessel pressure, value: 4.1e-3 mbar, status: normal }
        - { label: Line blank, value: '0.6 ppm', status: normal }
        - { label: Sample depth, value: '1,642 m', status: normal }
        - { label: Age difference applied, value: '458 yr', status: high }
  FIELD:
    caption: The only part of this record anybody can still watch being made.
    standLine: Forty-eight stakes, read this morning. Pit wall photographed to 1.4 m.
    station:
      kind: panel
      title: Mast and stake array
      rows:
        - { label: Air temperature, value: −41 °C, status: normal }
        - { label: Wind, value: 14 m/s, status: high }
        - { label: Stakes read today, value: '48 of 48', status: normal }
        - { label: Array mean gain, value: 4 mm, status: normal }
  DATA:
    caption: What the season can say out loud, and with how much of a margin.
    standLine: Season report closes Monday. Two records on the screen and one paragraph unwritten.
    station:
      kind: panel
      title: Records
      rows:
        - { label: Age scale version, value: 'v11, frozen', status: normal }
        - { label: Difference after correction, value: '0.15 ‰', status: normal }
        - { label: Stated uncertainty, value: '±0.28 ‰', status: normal }
        - { label: Days to the aircraft, value: '2', status: high }

copy:
  DRILL: <p>The drill trench, roofed and dug into the snow, with the tower over the hole and the winch drum turning slowly. Everything here is one attempt.</p>
  CORE: <p>The core line: a long lit bench where every metre is measured, logged and cut in the order it came out of the ground.</p>
  COLD: <p>The cold laboratory at minus twenty-five, where samples are melted exactly once and nobody stays longer than an hour.</p>
  GAS: <p>The gas laboratory, a vacuum line with fourteen fittings and a rule about each one. What comes off the ice here is old air.</p>
  FIELD: <p>The snow study hut, and the mast and stake array beyond it. The only measurements on this station that can be checked against the thing they measure.</p>
  DATA: <p>The science module: screens, the season's records, and the argument about what they support.</p>

  - title: The air is younger than the ice
    objective: "Build the two clocks inside one core: the age of the ice and the younger age of the gas trapped inside it."
    briefing: The same depth carries two ages because the snow became old while its pores were still connected to the atmosphere.
    stake: Saturday. The gas in a bubble is younger than the ice around it, because air keeps moving through the snow until the pores seal. Today you put a first number on that gap, and find the stage that sets it.
    takeaway: One depth in an ice core can carry two different clocks.
    stops:
      - group: GAS
        task: Put a number on the age offset
        title: How much younger the air is
        place: Gas Laboratory
        question: Estimate the age difference between a bubble and the ice around it.
        scene: The pores seal at 88 metres here. Above that the firn is open to the atmosphere, and its mean density is about 0.62 of solid ice. Adeyemi has the accumulation rate on the board beside it.
        assumes:
          - air moves freely through connected pore spaces until they close
        takeaway: The gas–ice age difference is large at a dry site, and its uncertainty belongs in every comparison that uses both clocks.
        reason: The pores here seal at 88 metres, and the age gap that opens above it has never been costed
        format: BALLPARK
        why: The 88-metre firn column contains about 55 metres of ice-equivalent mass. Divide that by the annual accumulation of 0.119 metres ice equivalent. It gives roughly 460 years for the surrounding ice to reach close-off. The trapped gas is much younger because the pore space stayed connected to the atmosphere during most of that burial. Treating the gas as exactly modern at close-off is only a first-order approximation. Real firn has a lock-in zone and a spread of ages. That uncertainty is carried forward rather than hidden.
        estimate:
          prompt: Close-off is at 88 metres, the firn above it averages 0.62 of the density of solid ice, and the site accumulates 0.119 metres of ice equivalent a year.
          question: Estimate the difference between the age of the gas and the age of the ice around it.
          labels:
            - 88 m  (close-off depth)
            - 0.62  (mean firn density, relative to ice)
            - 0.119 m/yr  (accumulation in ice equivalent)
            - 0.32 m/yr  (the same year as a snow thickness)
          values: [88, 0.62, 0.119, 0.32]
          slots: 3
          template: "{0} × {1} ÷ {2}"
          formula: a*b/c
          correct: [0, 1, 2]
          target: 458
          tolerance: 40
          units: years
          solution: 88 × 0.62 ÷ 0.119 = 458 years.
          explanation: "The snow thickness is the distractor: the density conversion has already been applied, so using it again would count the same correction twice."
          relationship: Δage ≈ z_close × ρ̄ ÷ b — the close-off depth, scaled by mean firn density, divided by the accumulation in ice equivalent.
        guide: Four numbers, and one of them is the same year written as a snow thickness rather than as ice. Ask of each whether the units match the others. The air keeps mixing with the atmosphere until the pores close. So the bubble is as old as the sealing, and the ice is as old as the snow. Get this wrong and a gas record is plotted centuries too early.
        background:
          - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated. Nothing here has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs. Then, whether the size of the answer looks right once they are in place.
          - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label catches a unit mismatch before it is placed. It also catches a quantity belonging to a different part of the problem. That is the habit this format exists to build.
        concept: Gas age against ice age, and why the difference matters
        answerText: About 460 years as a first-order estimate. A full firn model must still account for the gas-age distribution and uncertainty in close-off.
      - group: DRILL
        task: Name the step that fixes the offset
        title: From snowfall to sealed bubble
        place: Drill Trench
        question: Which stage decides how much older the ice is than the trapped gas in its bubbles?
        scene: Lindqvist has the borehole's own record on the wall. Five stages between a snowflake landing and air being locked away, with a measurement against each one.
        takesAsRead:
          - Gas age against ice age, and why the difference matters
        assumes:
          - a quantity that passes through several stages is limited by one of them
        takeaway: In a chain of stages, one of them sets the answer and the others follow it.
        reason: Five stages sit between a snowflake landing and air being locked away, each with a measurement against it
        format: CHAIN
        why: Air remains connected to the atmosphere through open firn while the ice matrix ages year by year. Pore close-off is the stage that ends that exchange and therefore fixes the scale of the gas–ice age difference. Mixing is essential to the process. It does not give one sharp gas age, because close-off happens over a depth range and leaves a spread of ages. That is why the simple estimate later becomes a range.
        chain:
          links:
            - id: snowfall
              label: Snow lands on the surface
              transfers: New mass, carrying the isotopes of the air it condensed from
              reading: 0.32 m of new snow a year
            - id: burial
              label: The layer is buried and begins to compact
              transfers: Load from everything above it, squeezing the pore space smaller
              reading: Density rising from 340 to 550 kg per cubic metre
            - id: mixing
              label: Air moves through the open pores
              transfers: Atmospheric composition, exchanged with the surface
              reading: Remains connected to surface air and much younger than the surrounding firn
            - id: closeoff
              label: The pores seal into separate bubbles
              transfers: The atmosphere of that moment, locked into the ice
              reading: Complete by 88 m
            - id: compression
              label: Bubbles compress and eventually become clathrate
              transfers: Pressure into the trapped gas, then into the crystal structure
              reading: Bubbles gone below about 1,200 m
          order:
            - snowfall
            - burial
            - mixing
            - closeoff
            - compression
          governing: closeoff
          distractor: mixing
          hint: Put the stages in the order air actually passes through them, then name the one that fixes the size of the age difference.
          commit: Name the governing stage
        guide: Put the five stages in the order a snowflake actually passes through them, from landing to being sealed in. Then name the stage that decides how much older the ice is than the air inside it. Each stage has a measurement against it, so read those rather than choosing the stage that sounds most important.
        background:
          - Why the ice and its air have different ages. Fresh snow is open to the atmosphere, and it stays open as it compacts. Air moves in and out of that layer for decades or centuries. Only when the pores finally pinch off is the air sealed. By then the ice around it has been buried a long time.
          - What sets the size of the gap. The depth at which the pores close, and how long the snow takes to get there. Both depend on temperature and on how much snow falls each year. That is why the gap is hundreds of years at a cold, dry site. At a warm, snowy one it is much less.
          - Why it matters more than it sounds. Every comparison between a gas record and an ice record has this offset in it. Read a carbon dioxide rise against a temperature change without correcting for it. You can get the order of events wrong. That is a claim about cause.
        concept: What the trapped gas is, and what it is not
        answerText: Pore close-off. The offset is the age of the ice at the depth where the pores seal, so everything above that depth is a firn column and everything below it is a bubble.
      - group: CORE
        task: Explain the smoother record
        title: Why the gas record has no sharp edges
        place: Core Line
        question: Why is the gas record smoother than the ice record from the same depths?
        scene: Okonkwo has the two records from the same depths on one plot. The ice record has features a few years wide. The gas record from the same interval has nothing narrower than a few decades.
        takesAsRead:
          - "Stable isotopes as a thermometer: δ¹⁸O and deuterium"
        assumes:
          - a measurement that averages over an interval cannot show anything shorter than it
        takeaway: A record made by an averaging process cannot show a change faster than the averaging.
        reason: The ice record has features a few years wide and the gas record from the same depths has none
        format: CHOICE
        why: Gas moves through connected firn and pores close over a range of depths rather than on one surface. Each extracted gas sample therefore averages atmospheric air over a span of ages before it is sealed. Higher-accumulation sites generally have smaller gas–ice age differences and narrower age distributions; dry interior sites smooth more strongly in time. Cutting a smaller laboratory sample cannot restore variation that the firn already averaged away.
        rebuttals:
          - Sample size is a choice and could be made smaller; the firn smoothing is fixed by the site
          - Some atmospheric changes are genuinely fast, and this record could not show them either
          - Bubbles are sealed and do not exchange with each other on any timescale that matters here
        choices:
          - Each bubble holds air mixed over the decades it took the pores to close
          - Gas measurements are made on larger samples, so they average more ice
          - Carbon dioxide changes more slowly in the atmosphere than temperature does

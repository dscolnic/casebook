      - group: COLD
        task: Work the cutting list while the sampling plan changes.
        title: What the saw is cutting for
        concept: "Core logging, orientation and chain of custody"
        place: Cold Laboratory
        scene: Sections come to the saw with a cutting list, and the list is set by whichever analysis has priority. The chief scientist changes that priority as the season goes. After the gas request. After the dating problem. After the aircraft date is confirmed.
        guide: >-
          Cut the sections the current priority wants and leave the rest in the rack. The
          priority on the cold-room board is changed during the day and nobody announces it.
          What is scored is the sections either side of a change, because a section cut for
          the wrong analysis cannot be uncut.
        background:
          - >-
              Why the priority changes. Early the season is about the chronology, so the dating
              sections come first. When the gas laboratory's slot is confirmed the priority
              becomes anything for gas. Gas needs the core's centre and cannot use what has been
              near the wall. Before the aircraft it becomes anything that has to fly.
          - >-
              Why this is irreversible in a way most work is not. Every other mistake here can
              be repeated. A cut cannot. The section is gone. The depth it came from cannot be
              re-drilled. What was cut for one analysis is unavailable to the others for ever.
        assumes:
          - a core section can only be cut up once
        takeaway: The cost of a withdrawn instruction is highest where the work cannot be repeated.
        format: SPOT
        question: Cut to the priority on the board, and keep watching the board.
        answerText: Read the board rather than the rack. Every change leaves a few minutes in which the old cutting list still looks like today's.
        why: >-
          Three priorities run across the day and each wants a different part of the rack.
          Anything for the dating work, then anything for gas, then anything leaving on the
          aircraft. A section can answer two of those at once, which is what makes the change
          cost something real. What the panel scores is the window either side of each change.
          Most of the rack is wanted by neither priority, and is correctly left alone by
          somebody who has read nothing. And this is the format's sharpest case, because a cut
          cannot be undone. Everything else on the plateau can be repeated with more time or
          more fuel. A section cut for isotopes is not available to the gas laboratory ever
          again. The ice at that depth cannot be drilled a second time this season.
        spot:

# The cast. `division` is what makes a person a valid person stop.
roster:
  - id: halvorsen
    name: Marit Halvorsen
    role: Chief Scientist
    division: DATA
    color: "#5b6a72"
    bio: |-
      Runs the season, which mostly means deciding what the season is allowed to claim. She has spent 11 years on this plateau and reads a record the way an auditor reads a ledger: not for what it says, for what it would take to make it say something else.

      Her position on the Skarv disagreement is that a result held back is a result somebody else makes for you. The assessment that will quote both records closes in March, and a silence in March is a decision.

      Her limit is the same as her strength. She is fastest at deciding what a number means, and the fastest reading of a number is the one that assumes the other people measured it the way she would have.
    quiz:
      - q: Why does Halvorsen treat staying quiet until next season as a decision rather than a delay?
        a: The March assessment quotes whatever is published by then
        wrong:
          - Station funding is reviewed on how many papers come out of each season on the ice
          - A record that is not published within a year cannot be published at all
          - The Skarv group has asked for a response and is owed one
  - id: okonkwo
    name: Ines Okonkwo
    role: Chronology Lead
    division: CORE
    color: "#7a4fa3"
    bio: |-
      Owns the depth–age scale, which is the sentence every other result in the station ends with. She counts layers, ties them to dated ash, and writes down how wrong each stretch could be.

      Her position on Skarv is not caution for its own sake. Two records cannot disagree until they are on the same measurement scale and the same clock. Announcing a difference before that is announcing something about the methods as if it were climate.

      Her limit is that counting has an end. Below about 2,200 metres the annual layers are thinner than the line can resolve. From there the ages come from a flow model anchored by whatever independent dates the ice still gives her.
    quiz:
      - q: Why will Okonkwo not call the difference between the two records a disagreement yet?
        a: On two timescales, a difference could belong to the dating
        wrong:
          - The Skarv core has not been measured on the same mass spectrometer
          - A difference is only real once it exceeds three standard deviations
          - The two cores were drilled in different years, which makes them incomparable in principle
  - id: lindqvist
    name: Pär Lindqvist
    role: Drill Engineer
    division: DRILL
    color: "#2f6f9f"
    bio: |-
      22 seasons on deep drills, and he can tell from the winch load what the hole is doing 800 metres down. The drill is a three-tonne instrument that gets one attempt per run.

      He runs the brittle zone slowly and refuses to be hurried through it. Ice between 500 and 1,200 metres holds bubbles at pressures the surface cannot support, and a core brought up fast comes up as gravel.

      His limit is that he cannot see anything. Everything he knows about the hole arrives as tension on a cable and the temperature of returning fluid.
    quiz:
      - q: Why does Lindqvist slow the winch through the brittle zone?
        a: The bubbles are at a pressure the surface cannot hold
        wrong:
          - The drill fluid freezes onto the barrel if it is raised too quickly
          - Cable tension readings become unreliable above a certain speed
          - The winch motor overheats on a continuous lift from that depth and has to be rested
  - id: tanabe
    name: Yuki Tanabe
    role: Isotope Chemist
    division: COLD
    color: "#1f7a6b"
    bio: |-
      Runs the cold laboratory at minus 25, where every sample is melted exactly once and everything that touches it has been accounted for first. She measures ratios that differ in the fourth decimal place.

      She runs a standard between every eighth sample, which everybody agrees with in principle and resents in practice, because the instrument drifts and drift is invisible from inside a run.

      Her limit is that she measures water, not weather. Turning a ratio into a temperature needs a slope, and the slope is somebody's measurement of a relationship that has not held perfectly for the whole record.
    quiz:
      - q: Why does Tanabe run a standard between every eighth sample?
        a: Only a known sample can reveal drift while it happens
        wrong:
          - The instrument must be re-zeroed after a fixed number of runs to stay in specification
          - Samples measured late in a run are colder than those measured early
          - It gives the run an even number of measurements for averaging
  - id: adeyemi
    name: Samuel Adeyemi
    role: Gas Geochemist
    division: GAS
    color: "#b3462f"
    bio: |-
      Cuts ice, puts it in a vessel, evacuates the vessel and melts the ice, and what comes off is air that last touched the atmosphere a long time ago. He has been doing it for nine years and still calls it unreasonable.

      He is the reason the station argues about age twice: the ice around a bubble and the air inside it are not the same age, and at a dry site like this one the difference runs to centuries rather than decades.

      His limit is sample size. A gas measurement destroys the ice it was made on, so every question he answers is one somebody else cannot ask again.
    quiz:
      - q: Why does Adeyemi insist the ice and the air inside it are dated separately?
        a: Air keeps moving through the snowpack until the pores seal
        wrong:
          - Gas measurements are made on a different instrument from the ice ones
          - Bubbles migrate slowly upward through the ice over thousands of years, arriving young
          - The extraction line adds a delay that has to be subtracted afterwards
  - id: brandt
    name: Nadia Brandt
    role: Field Glaciologist
    division: FIELD
    color: "#b0762a"
    bio: |-
      Responsible for everything above the surface: the stake farm, the mast, the snow pits, and the only measurements in the station that can be checked against the thing they are measuring.

      She digs a pit every fortnight and photographs the wall, because the surface is where the record is made and it is the one part of it anybody can still watch happening.

      Her limit is wind. The plateau moves snow sideways, so a stake that gained a centimetre may be reporting the weather or the drift, and the difference takes a season of stakes to see.
    quiz:
      - q: Why does one stake gaining snow tell Brandt so little on its own?
        a: Wind moves snow, so a gain here is a loss elsewhere
        wrong:
          - A single stake cannot be levelled accurately enough to trust
          - Snow settles under its own weight faster than new snow arrives to replace it
          - Stakes have to be read at the same time of day to be comparable
  - id: ekwueme
    name: Tom Ekwueme
    role: Drill Assistant
    division: DRILL
    color: "#2f6f9f"
    bio: Second on the drill, which means he handles every core that comes up and writes the run sheet while Lindqvist watches the cable. He has recorded every break and every short run this season.
    quiz:
      - q: What does Ekwueme's run sheet let the chronology team do that the core itself cannot?
        a: It says which sections came up short of their full length
        wrong:
          - It records the drill fluid temperature for every run made through the season
          - It proves the core was handled within the required window
          - It gives the winch speed that produced the cleanest breaks
  - id: holt
    name: Sigrid Holt
    role: Core Line Technician
    division: CORE
    color: "#7a4fa3"
    bio: Logs, measures and cuts every metre that comes off the drill, in the order it arrives and never out of it. She has seen the whole core and almost nobody else has.
    quiz:
      - q: Why does Holt refuse to let a section be cut before it is logged?
        a: After cutting, a feature's depth survives only on the label
        wrong:
          - Cutting warms the ice and releases some of the trapped gas
          - The saw blade needs the logged section length before it can set its cutting depth
          - Logging after cutting takes twice as long for the same information
  - id: cruz
    name: Elena Cruz
    role: Cold Laboratory Technician
    division: COLD
    color: "#1f7a6b"
    bio: |-
      Prepares the samples for the isotope line: cuts the outer centimetre off every piece, weighs it, logs it, and runs the blanks nobody else volunteers for.

      The blanks are the part she will not skip. A season's worth of results rests on knowing what the process contributes when there is no ice in it, and that number is only known if somebody keeps measuring nothing.
    quiz:
      - q: Why does Cruz cut the outer centimetre off every sample?
        a: The outside has touched the drill and the bench; the inside has not
        wrong:
          - The outer ice sublimates during storage and reads too heavy
          - Cutting every sample to a standard size is what makes the melt times comparable
          - The outer layer is where fractures concentrate during the lift
  - id: menon
    name: Ravi Menon
    role: Gas Laboratory Technician
    division: GAS
    color: "#b3462f"
    bio: Runs the extraction line, which is a vacuum system with 14 fittings and a rule about every one of them. He tests the line against a standard gas before any sample is cut.
    quiz:
      - q: Why does Menon run a standard gas through the line before cutting a sample?
        a: A leak arrives as modern air, which reads as a result
        wrong:
          - The line has to be brought to the same temperature as the sample
          - Standard gas removes water vapour left over from the previous run
          - It confirms that the line's 14 pressure gauges agree with each other first
  - id: devries
    name: Anneke de Vries
    role: Camp Manager
    division: FIELD
    color: "#b0762a"
    bio: Fuel, flights, generators and food, in that order. Every scientific decision on this station is a decision about drums of fuel, and she is the one who has to say so out loud.
    quiz:
      - q: Why does de Vries need the science plan a fortnight before the aircraft window?
        a: Fuel and flight weight are committed before the plane leaves
        wrong:
          - The pilots require a full manifest of every sample being flown off the plateau
          - The generators must be serviced before the last resupply lands
          - Weather forecasts are only reliable at two weeks' range
  - id: aalto
    name: Jonas Aalto
    role: Data Manager
    division: DATA
    color: "#5b6a72"
    bio: Keeps the station's records, which means he is the only person who can say what version of anything anybody is arguing about. Every dataset here has a date on it and half of them have two.
    quiz:
      - q: Why does Aalto version every dataset rather than replacing it?
        a: A result was reached on one version and belongs to it
        wrong:
          - Station policy requires every record to be retained for ten years after the season
          - Older versions are needed to recover from a disk failure
          - Two people cannot edit the same file at the same time

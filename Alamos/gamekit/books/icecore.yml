      - group: GAS
        task: Sort what a joint run can and cannot settle
        title: Which differences a shared instrument removes
        place: Gas Laboratory
        scene: The gas geochemist, Samuel Adeyemi, has four ways the two records could differ written on the board. There is one working day in which both cores are in the same building.
        takesAsRead:
          - "Thinning with depth: flow, and where a record runs out"
          - Annual layer counting, and where counting fails
        assumes:
          - two measurements of one quantity can differ for reasons that have nothing to do with the quantity
        takeaway: Sharing an instrument removes the differences the instrument was causing, and only those.
        reason: Four ways the records could differ are on the board, and one working day with both cores to test them
        format: PROTOCOL
        why: Only the first of these is fixed by sharing an instrument. A stretched timescale is a chronology problem and needs an event of known date present in both cores. A real climate difference is what is left once every other explanation has been removed. That is why it is established by elimination rather than measured directly. Melting in transit alters the outer ice more than the inner. So it leaves a signature in the profile across a section, rather than in the average. Four differences, four different pieces of evidence.
        rebuttals:
          - A shared instrument removes instrument differences, and a stretched timescale is not one
          - A tie point fixes two clocks to each other, which is a different question from what the ice contains
          - Transit damage shows in the profile across a section rather than in a comparison of averages
        columns:
          - Why the two records might differ
          - What would settle it
        scenarios:
          - The two laboratories' reference waters are not identical
          - One core's timescale is stretched relative to the other's
          - The two sites really did have different temperatures
          - One group's samples were partly melted in transit
        choices:
          - Run both working standards on one instrument and read the gap
          - Find an event dated in both cores and pin them to each other at it
          - Measure overlapping depths on one instrument and see the difference survive
          - Check the transit temperature record against the isotope profile of the outer ice
        mapping: [0, 1, 2, 3]
        guide: Four ways the records could differ, and four kinds of evidence. Pair them by asking what sharing an instrument can and cannot remove. A stretched timescale is a chronology problem and needs an event dated in both cores. A real climate difference is what survives after everything else is eliminated. And melting alters the outside of a section more than the inside.
        background:
          - Why this is a matching board and not four separate questions. Responses on boards like this are written to be plausible for more than one situation. Choosing them one at a time lets a nearly-right answer through unexamined. Having to place all of them forces the comparison. The question is not "is this reasonable here", but "is it more right here than there".
          - How to use the one-each rule. The responses are a set to be distributed rather than a list to be sampled. So every join you make constrains the rest. Settling the two you are confident of can leave the remaining pair decided by elimination. Where it does not, two responses are still competing for one situation. That is exactly the distinction the stop is testing.
          - Why you cannot be wrong about exactly one. With every response used once, three correct joins leave the fourth with only one place to go. Any error therefore involves at least two joins. That is worth remembering when the last pair looks forced. The fault is usually not in the join you are struggling with. It is in one you made early and stopped questioning.
        concept: Depth–age scales, and putting two cores on one clock

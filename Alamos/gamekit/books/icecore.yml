            - name: Bubble-free layer
              bin: right
            - name: Vertical pipe
              bin: right
            - name: Melt-welded grain
              bin: right
          need: 20
          lives: 3
          pass: 0.8
          hint: Look for bubbles. Water fills the spaces that air would have kept.
          commit: Start the line
        guide: Two bins, and the question is whether the layer is a year of accumulation or a melt event inside one. An annual layer pairs a coarse summer with a fine winter and keeps its bubbles. A melt layer is clear, dense and bubble-poor, because the water filled the spaces before it refroze. Sort on the ice, not on the label.
        background:
          - Why the difference decides the chronology. The count of annual layers is the clock. A melt layer counted as a year makes the core older than it is at every depth below. A year missed makes it younger. Both errors propagate all the way down.
          - What melt does to everything else. Percolating water moves the chemistry down through the layers it passes. So a melt layer is not only a counting problem. It smears the record either side of it, which is why the site was chosen where melt is rare.
        concept: Annual layer counting, and where counting fails
        answerText: Coarse-over-fine with bubbles is a year. Clear, dense and bubble-poor is melt, and counting it as a year ages everything beneath it.
  - title: Before the other core leaves
    objective: Use the last shared day with Skarv ice to test whether part of the disagreement belongs to the laboratories.
    briefing: After tonight the two laboratories cannot put the same water on the same instrument for two years.
    stake: Thursday, and the Skarv samples fly out tonight. The two records differ by 0.9 per mil, and nobody knows if the gap is the ice or the two labs. Today you spend four runs on the one question only today can answer.
    takeaway: Before comparing two records, make sure the measuring scales themselves agree.
    stops:
      - group: DATA
        task: Spend the last day of access
        title: What is worth measuring before Thursday
        place: Science Module
        question: Which four runs should the day buy to test what the 0.9 per mil mismatch means?
        scene: Eleven Skarv samples, one working day, and the isotope line can take four runs. The published records differ by about 0.9 per mil through the disputed interval. Jonas Aalto, the data manager, wants the runs that could show some of that gap belongs to the laboratories.
        assumes:
          - two laboratories measuring the same quantity can differ by a fixed amount
        takeaway: A measurement is worth its cost when the decision changes depending on how it comes out.
        reason: Eleven Skarv samples leave tonight, the line can take four runs, and the choice cannot be made twice
        format: VALUE
        why: A fixed reporting offset looks exactly like a climate shift if two records are plotted without cross-calibration. The paired standards measure where the two reporting scales sit; overlapping depths test the same effect on actual ice. Here both point to the same 0.4 per mil offset. Applying it reduces the raw 0.9 per mil mismatch to about 0.5, but does not explain the remaining difference. The day therefore removes one hypothesis rather than ending the story.
        value:
          budget:
            amount: 4
            unit: instrument runs
          decision: How much of the raw 0.9 per mil difference belongs to the laboratories rather than the ice?
          options:
            - id: standards
              label: Both groups' working standards, run back to back
              cost: 1
              axis: where the two reporting scales sit
              reveals: The Skarv working scale sits 0.4 per mil heavy relative to Vestri on the same reference water.
              decisive: true
            - id: overlap
              label: Four Skarv depths that overlap ours, run on our line
              cost: 2
              axis: whether one instrument gives one answer on one piece of ice
              reveals: The overlap samples reproduce the same 0.4 per mil reporting offset on real ice.
              decisive: true
            - id: deeper
              label: The deepest Skarv sample, at a depth this station has not drilled
              cost: 1
              axis: ice older than anything here
              reveals: An isotope value with nothing of ours to compare it against.
            - id: repeat
              label: A repeat of our own 1,400 m sample
              cost: 1
              axis: how tightly our own line repeats
              reveals: Within 0.05 per mil of the first run, as it was last week.
            - id: density
              label: Density profile of the Skarv firn section
              cost: 1
              axis: the other site's close-off depth
              reveals: Close-off at 71 m, which their published report already states.
          hint: Buy what would change the answer. A measurement that confirms what you already believe has bought nothing.
          commit: Book the runs
        guide: Eleven samples, one working day, and the isotope line takes four. Open each candidate and ask what its result would change about the difference between the two records. Four runs that confirm what is already agreed have spent the day. Four that could move the disagreement have bought something.
        background:
          - Why the difference is the subject. Two records sit side by side, with the gap between them on a third screen. That is the whole question of the week. A run that tightens a part of the record nobody disputes cannot narrow that gap.
          - What a day of the isotope line is worth. It is the only instrument that can settle certain questions and it runs four samples. That makes each slot a choice against the other seven. The deadline is Thursday, not the end of the season.
          - Why sampling depth matters as much as sample count. Four runs clustered in one interval answer one question well. Four spread across the disagreement answer a different question. Which of them is worth more depends on whether the gap is thought to be an offset or a shape.
        concept: Model against data, and what a mismatch can mean
        answerText: Run the paired standards and overlapping depths. Together they can reveal a fixed laboratory-scale offset before the shared samples disappear.
      - group: COLD
        task: Say what one instrument removes
        title: The same water, twice
        place: Cold Laboratory
        question: The two records differ by 0.9 per mil. What does running both groups' standards on this one instrument establish about that mismatch?
        scene: Tanabe has both groups' working standards on the bench and 30 minutes of instrument time. Skarv reports its values against its own standard, calibrated in a different laboratory four years ago.
        assumes:
          - an isotope value is reported as a difference from an agreed reference water
        takeaway: A ratio reported against two different references is two different numbers about the same water.
        reason: Both groups' standards are on the bench with thirty minutes of instrument time, which never happens again after tonight
        format: CHOICE
        why: An isotope value is a ratio reported relative to a reference water. Two laboratories can maintain working standards that are each traceable to the international scale yet still carry a small offset. Running both standards on one instrument estimates that offset directly. It says nothing about either site's isotope-to-temperature slope and nothing about chronology. In this case the offset is about 0.4 per mil, leaving roughly 0.5 per mil of the original mismatch still to explain.
        rebuttals:
          - Storage matters and is a separate question, answered by the temperature log rather than the standard
          - Precision is scatter between repeats; this compares where the two scales sit, not how tightly they repeat
          - The temperature slope is a property of each site's weather and cannot be read off a bottle of standard water
        choices:
          - How far apart the two laboratories' reporting scales sit
          - That the Skarv samples were stored correctly on their way here
          - Which of the two laboratories is measuring more precisely
          - Whether the isotope thermometer has the same slope at both sites
        answer: How far apart the two laboratories' reporting scales sit
        guide: Four things a joint run might establish. Ask of each whether one instrument in one afternoon could separate it from the alternatives. An isotope value is a difference from a reference water, so it carries whatever that reference is worth. Two laboratories keep their own. A scale gap and a real site difference both appear as a constant shift. That is why one of these needs both standards on one instrument.
        background:
          - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading. A step skipped. A quantity confused with a rate. A correlation taken for a cause. Identifying which misreading each belongs to is where the learning is. The right answer alone can be reached on instinct and teach nothing.
          - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance. Before it was fixed, that was 88 per cent of passage quizzes here. It is now checked per game as a binomial tail. Length, hedging and specificity have had the signal taken out of them deliberately.
          - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them. Each is the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason is indistinguishable from a sound one. That holds until the day the approximation is what is being tested.

# Terms the game may explain in place.
glossary:
  - name: Accumulation
    aliases:
      - accumulate
      - accumulates
      - accumulated
    def: How much snow is added to the surface in a year, after wind and sublimation have had their say.
  - name: Ice equivalent
    aliases:
      - water equivalent
    def: A snow thickness converted to the thickness of solid ice it will become, so two sites can be compared.
  - name: Annual layer
    aliases:
      - annual layers
      - layer counting
      - layer count
    def: One year of snowfall, recognisable in the core because summer and winter snow differ.
  - name: Ice
    def: Snow compressed until the air between its grains is sealed off, at about 917 kilograms per cubic metre.
  - name: Calibration
    aliases:
      - calibrate
      - calibrated
      - calibration slope
    def: Measuring an instrument or a relationship against something already known, so its numbers can be trusted.
  - name: Firn
    aliases:
      - firn column
    def: The layer of snow between the surface and solid ice, still open enough for air to move through it.
  - name: Close-off depth
    aliases:
      - close-off
      - closes off
      - closed off
    def: The depth where firn stops letting air through, 60 to 100 metres down, and the trapped air becomes separate bubbles.
  - name: Delta age
    aliases:
      - Δage
      - gas age
      - ice age difference
    def: The difference between the age of a bubble's air and the age of the ice around it, because the air kept moving until close-off.
  - name: Precipitation
    aliases:
      - precipitates
      - precipitated
    def: Snow or rain falling out of the air onto the surface. On this plateau it is almost always snow.
  - name: Proxy
    aliases:
      - proxies
    def: Something measurable that stands in for something that was not measured, through a chain somebody has to be able to state.
  - name: Isotope ratio
    aliases:
      - delta-18
      - oxygen-18
      - deuterium
      - isotopic
    def: How much heavy oxygen or hydrogen the ice holds compared with ocean water, reported as a difference in parts per thousand.
  - name: Thinning
    aliases:
      - thinned
      - thins
    def: The stretching of every layer as the ice sheet spreads under its own weight, so old layers are thinner than they fell.
  - name: Depth-age scale
    aliases:
      - depth–age
      - age scale
      - timescale
    def: The table that turns a depth in the core into a year, built by counting layers and anchored to dated events.
  - name: Tie point
    aliases:
      - tie points
      - tied to
    def: An event of known date found in two records, which fixes them to each other at that moment.
  - name: Sulphate horizon
    aliases:
      - sulphate
      - sulfate
      - volcanic horizon
    def: A thin band of volcanic sulphur in the ice, laid down within a year or two of a known eruption.
  - name: Tephra
    aliases:
      - ash layer
    def: Volcanic glass shards in the ice, which can be chemically matched to the volcano that produced them.
  - name: Diffusion length
    aliases:
      - diffusion
      - diffuses
    def: How far a water molecule wanders in the firn before the ice seals, which smooths away anything thinner than about twice that distance.
  - name: Brittle ice
    aliases:
      - brittle zone
    def: The depth range where trapped bubbles are at high pressure and the core fractures as it is brought up.
  - name: Blank
    aliases:
      - blank run
      - blanks
    def: A run with no sample in it. Anything it shows was added by the process rather than measured from the ice.
  - name: Chain of custody
    aliases:
      - custody
    def: The unbroken written record of who held a sample and when, which is what makes a measurement attributable to a depth.
  - name: Radiative forcing
    aliases:
      - forcing
    def: The change in the energy balance at the top of the atmosphere caused by a change in a greenhouse gas, in watts per square metre.
  - name: Standard error
    aliases:
      - standard errors
    def: How far an average is expected to sit from the truth, given the scatter in the data and how many years went into it.
  - name: Replicate core
    aliases:
      - replicate
      - replicates
    def: A second core drilled nearby, so a feature can be checked against ice that shared the weather but not the drill.

# The campaign: one working day each, three stops and a callback from day 3.
missions:
  - title: What the plateau has been writing down
    objective: Establish how fast Vestri writes time, what the core can preserve, and what can already bias the comparison.
    briefing: Before the first drill run, the team has to know how fast this site turns snowfall into a climate record.
    stake: First morning. Vestri and Skarv should describe the same cold spell, and their curves do not line up. Nobody can say yet whether that gap is climate or a measuring mistake. Today you fix the clock this site runs on. That means how much snow makes one year, why the hole sits on the dome, and what a year looks like in the ice.
    takeaway: The comparison is only as good as the clock underneath it.
    stops:
      - group: FIELD
        task: Measure how fast Vestri writes one year
        title: How thick a year is here
        place: Snow Study Hut
        question: Estimate this year's accumulation in ice equivalent.
        scene: Nadia Brandt, the field glaciologist, has the pit wall photographed and the last summer surface marked at 32 centimetres down. The snow above it weighs a third of what the same thickness of solid ice would.
        takesAsRead:
          - "Why ice keeps a record at all: burial without melting"
        assumes:
          - snow becomes ice by being compressed under the snow that falls on it
        takeaway: Accumulation is the rate at which this site writes time, expressed in conserved ice equivalent.
        format: BALLPARK
        why: Snow and ice contain the same water but not the same amount of air. Multiply the snow thickness by the ratio of snow density to ice density. That converts the layer to ice equivalent, the mass-based thickness two sites can be compared on. Vestri adds about 12 centimetres of ice equivalent in a year. That low accumulation buys a long record but also makes annual layers thin quickly and increases the gas–ice age difference. This rate feeds the modelled chronology. The counted years and the independent tie points are what catch the model if it drifts.
        estimate:
          prompt: The last summer surface sits 32 centimetres below this year's, in snow of density 340 kilograms per cubic metre.
          question: Estimate this year's accumulation in metres of ice equivalent.
          labels:
            - 0.32 m  (this year's snow layer)
            - 340 kg/m³  (density of the snow)
            - 917 kg/m³  (density of solid ice)
            - 1000 kg/m³  (density of liquid water)
            - 14  (days of stake readings)
          values: [0.32, 340, 917, 1000, 14]
          slots: 3
          template: "{0} × {1} ÷ {2}"
          formula: a*b/c
          correct: [0, 1, 2]
          target: 0.119
          tolerance: 0.012
          units: m ice equivalent per year
          solution: 0.32 × 340 ÷ 917 = 0.119 m of ice equivalent.
          explanation: "The water density is the tile that does not belong: the conversion is snow to ice, and liquid water is never part of this record."
          relationship: b = λ × ρ_snow ÷ ρ_ice — the measured layer thickness λ, scaled by the density of the snow against the density of solid ice.
        guide: "Five numbers, and two of them belong elsewhere: the density of liquid water, and the days of stake readings. Ask of each whether the conversion needs it. Snow and ice are the same material at different densities. So a thickness of snow is not a thickness of record. Only ice equivalent lets two sites be compared, and this site gets a tenth of what a coastal one does."
        background:
          - Why an estimate rather than a calculation. Every quantity on this board is already measured or stated. Nothing here has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs. Then, whether the size of the answer looks right once they are in place.
          - Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label catches a unit mismatch before it is placed. It also catches a quantity belonging to a different part of the problem. That is the habit this format exists to build.
        concept: Accumulation rate, and what a site with little snow buys and costs
        answerText: About 0.12 metres of ice equivalent — a third of the snow thickness, because the snow is a third as dense.
      - group: DRILL
        task: Say what the site was chosen for
        title: Why the hole is on the dome
        place: Drill Trench
        question: What does drilling at the dome buy that a site on the slope cannot?
        scene: The drill engineer, Pär Lindqvist, has the hole at 2,040 metres. On the wall is a map with 3 abandoned sites on it, all of them on slopes. Vestri Dome is the high point for 200 kilometres.
        takesAsRead:
          - Accumulation rate, and what a site with little snow buys and costs
          - Annual layer counting, and where counting fails
        assumes:
          - ice spreads outwards from the high points of an ice sheet
        takeaway: A dome reduces the upstream-history problem; it does not make ice flow disappear.
        format: CHOICE
        why: "Ice flows away from high points, so a core on a slope contains ice that fell upstream and travelled into the borehole. Near an ice divide the horizontal motion is much smaller. That makes the record more nearly local, and a one-dimensional chronology more defensible. It is not zero-flow ice: deep layers can still deform and move. That distinction matters later, when the simple flow model begins to fail near the bed."
        rebuttals:
          - Summit ice is colder, and cold ice is not what makes depth correspond to time
          - Domes are the driest part of an ice sheet, not the snowiest — thin layers are the price paid here
          - Bed shape matters to the deepest ice, and it is not why the site sits at the high point
        choices:
          - The ice at each depth fell near this spot, not upstream
          - The ice is colder at the summit, which slows the chemical reactions in it
          - Snowfall is heaviest at the high point, giving the thickest annual layers
          - The bedrock beneath a dome is flattest, which keeps a three-kilometre hole vertical
        answer: The ice at each depth fell near this spot, not upstream
        guide: Four things a dome might buy, and three of them are about the ice being cold, thick or flat. Ask of each whether it is about where the ice came from. An ice sheet flows outward from its high points. On a slope the ice at a given depth arrived from upstream, so the record mixes one place's weather with a journey. Domes pay for that in thin layers.
        background:
          - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading. A step skipped. A quantity confused with a rate. A correlation taken for a cause. Identifying which misreading each belongs to is where the learning is. The right answer alone can be reached on instinct and teach nothing.
          - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance. Before it was fixed, that was 88 per cent of passage quizzes here. It is now checked per game as a binomial tail. Length, hedging and specificity have had the signal taken out of them deliberately.
          - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them. Each is the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason is indistinguishable from a sound one. That holds until the day the approximation is what is being tested.
        concept: "Thinning with depth: flow, and where a record runs out"
      - group: CORE
        task: Read one annual layer off the core
        title: What makes one year different from the next
        place: Core Line
        scene: A metre of core from 60 metres is on the light table. The chronology lead, Ines Okonkwo, has four features marked on it and wants each one attributed before the section is cut.
        assumes:
          - snow that falls in summer sits under different conditions from snow that falls in winter
        takeaway: A year is counted from several signals that agree, not from one that looks convincing.
        format: PROTOCOL
        why: No single marker survives the whole core, so a year is established where several independent signals line up. Coarse crystals form on a summer surface that stayed exposed. Conductivity spikes are acid, and volcanic acid arrives in a season. Dust is delivered by winds thousands of kilometres away and peaks with their season. The light and dark banding is bubble structure changing as each layer was compressed. Where three of the four agree, a year is a year. Where only one does, it is a candidate.
        rebuttals:
          - Conductivity responds to acid, and the coarse crystal band is a surface that was left exposed
          - Dust is delivered from elsewhere and does not follow the crystal growth on this surface
          - Banding tracks how the snow was compressed rather than what was carried in from outside
        columns:
          - What is in the ice
          - What put it there
        scenarios:
          - A band of large, loosely bonded crystals
          - A narrow spike in electrical conductivity
          - A rise in fine mineral dust
          - Alternating light and dark bands about a centimetre apart
        choices:
          - A summer surface that sat exposed and grew coarse before it was buried
          - Acid from an eruption, laid down in a season or two and then gone
          - Windier months on distant continents, carried here and settled out
          - Bubble size changing through the year as the snow was compressed
        mapping: [0, 1, 2, 3]
        guide: "Four features on one metre of core, and four things that could have made them. Pair them by asking what each feature is physically made of: crystals, acid, mineral grains, or bubbles. Then ask what season each belongs to. No single marker survives the whole core, so a year is where several independent signals agree. Where only one does, it is a candidate."
        background:
          - Why this is a matching board and not four separate questions. Responses on boards like this are written to be plausible for more than one situation. Choosing them one at a time lets a nearly-right answer through unexamined. Having to place all of them forces the comparison. The question is not "is this reasonable here", but "is it more right here than there".
          - How to use the one-each rule. The responses are a set to be distributed rather than a list to be sampled. So every join you make constrains the rest. Settling the two you are confident of can leave the remaining pair decided by elimination. Where it does not, two responses are still competing for one situation. That is exactly the distinction the stop is testing.
          - Why you cannot be wrong about exactly one. With every response used once, three correct joins leave the fourth with only one place to go. Any error therefore involves at least two joins. That is worth remembering when the last pair looks forced. The fault is usually not in the join you are struggling with. It is in one you made early and stopped questioning.
        concept: Annual layer counting, and where counting fails
  - title: Every metre gets one recovery
    objective: Recover, label, and protect the ice without adding uncertainty that can never be removed later.
    briefing: The drill enters the brittle zone and one unlabelled section is already testing the chain of custody.
    stake: Second day. The drill is going back into ice that fractures on the way up, and one section has lost its depth mark. Today you decide what damage can be repaired, and what doubt has to travel with a sample.
    takeaway: A clean measurement is useless if nobody can say what depth it belongs to.
    stops:
      - group: DRILL
        task: Bring a brittle section up whole
        title: The run through the brittle zone
        place: Drill Trench
        scene: The barrel is at 780 metres, inside the depth range where the ice comes up cracked. The winch, the fluid and the storage are all set for ordinary ice and Lindqvist wants the order settled before the lift starts.
        takesAsRead:
          - "Why ice keeps a record at all: burial without melting"
        assumes:
          - gas trapped at depth is at the pressure of the ice around it
        takeaway: Ice recovered badly is a shorter record, not a cheaper one.
        reason: The barrel is in the cracking band at 780 metres, and the lift order must be settled before the winch moves
        format: SEQUENCE
        why: Between about 500 and 1,200 metres the bubbles are at pressures the surface cannot support. The ice around them fractures as it is brought up. Each step buys the next one. A slow lift reduces the shock. Resting the core at hole temperature lets the pressure equalise gradually. Logging the breaks fixes what depth each fragment came from before anything moves. Storing it for weeks lets it finish cracking. Cutting first destroys the depth information and cuts a section that is still moving.
        cards:
          - Slow the winch through the depth band where bubbles are at their highest pressure
          - Let the section rest in the trench at drill-hole temperature before it is handled
          - Log the breaks and their positions before anything is moved off the barrel
          - Carry the section to the storage trench and leave it there for the relaxation period
          - Cut and distribute only after the section has stopped cracking
        order: [0, 1, 2, 3, 4]
        guide: All five of these will happen, so ask what each one buys the next. Between about five hundred and twelve hundred metres the bubbles are at pressures the surface cannot support. Ask of each step whether it reduces the shock, lets the pressure equalise, or fixes information that is about to be lost. One of them destroys the depth record if it comes early.
        background:
          - Why the order is graded whole. A sequence is a claim about dependency. Each step is here because the one before it has already happened, or has to have. One transposed pair falsifies that claim wherever it sits. Partial credit would be credit for a sequence that does not work.
          - Why the ends are the place to start. The first and last cards are constrained by having nothing before or after them. That usually makes them the two you can settle from the scene alone. Pinning them collapses the remaining arrangements sharply. What is left in the middle is where the actual judgement lives.
          - What the rail can be ordered on. Time is the usual axis, but it is not the only one. An order can run on cost, on risk, or on reversibility. Reversibility puts every observation that leaves the sample as it was before any that consumes it. On those boards a chronological reading finds nothing. None of the steps has to happen at a particular hour.
        concept: "Drilling: fluid, brittle ice and what damage costs the record"
      - group: CORE
        task: Decide what an unmarked section is worth
        title: The metre with no label
        place: Core Line
        question: What should a section with a broken depth mark be used for?
        scene: A section has arrived at the line with a broken depth mark. Sigrid Holt, the core line technician, can place it to within about four metres from the run sheet. The isotope team has asked for it.
        takesAsRead:
          - "Drilling: fluid, brittle ice and what damage costs the record"
        assumes:
          - a measurement belongs to the depth it came from, and to no other
        takeaway: A sample with uncertain depth can still answer questions that do not require a precise age.
        reason: A section came up with its depth mark broken, and the isotope team has already asked for it
        format: CHOICE
        why: "A depth is what converts a measurement into a statement about a year. Four metres here is thirty-odd years. So an isotope value from this section cannot be placed in the record. It would sit in it as a point with no time. It is still perfectly good ice for anything the depth does not enter: density, crystal fabric, how the drill is performing. The rule that matters is that the uncertainty travels with the sample. The danger is not the gap. It is somebody downstream who never hears about it."
        rebuttals:
          - 4 metres is 30 years at this site, which is larger than most of the features the isotopes are used to find
          - Discarding it throws away measurements that never needed a depth in the first place
          - Assigning a most likely depth writes a guess into the record in the same handwriting as the measurements
        choices:
          - Work that tolerates a four-metre depth uncertainty, recorded as such
          - Isotope work, since the four-metre window is small compared with the whole core
          - Nothing; an unplaced section is discarded so it cannot contaminate the record
          - Anything, once the run sheet is used to assign it the most likely depth
        answer: Work that tolerates a four-metre depth uncertainty, recorded as such
        guide: Four options for a section that can only be placed within four metres. Ask of each what the depth is for. It is what turns a measurement into a statement about a year, and four metres here is thirty-odd years. Some work does not use depth at all. And note the real rule. The uncertainty has to travel with the sample, because the danger is somebody downstream who never hears about it.
        background:
          - Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading. A step skipped. A quantity confused with a rate. A correlation taken for a cause. Identifying which misreading each belongs to is where the learning is. The right answer alone can be reached on instinct and teach nothing.
          - Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance. Before it was fixed, that was 88 per cent of passage quizzes here. It is now checked per game as a binomial tail. Length, hedging and specificity have had the signal taken out of them deliberately.
          - What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them. Each is the reason that option fails, not a restatement of the right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason is indistinguishable from a sound one. That holds until the day the approximation is what is being tested.
        concept: Core logging, orientation and chain of custody
      - group: COLD
        task: Find out where a signal came from
        title: The sample that was clean until it was handled
        place: Cold Laboratory
        scene: The cold laboratory technician, Elena Cruz, has a sodium result four times higher than the run before it. She has the blank, the run order and the section's handling record on the bench.
        takesAsRead:
          - "What a proxy is: the chain between the thing and the number"
        assumes:
          - a blank is run through the same process as a sample, with no sample in it
        takeaway: A blank measures the process, so anything it shows was never evidence about the ice.
        reason: One sodium result is four times the run before it, and nobody knows if the ice or the bench did it
        format: DIAGNOSIS
        why: The blank before the sample is ordinary and the blank after it is high. That places the contamination inside the run rather than in the ice. The trim was done to specification, so the outside of the section is ruled out. The replicate core holds the same year with no sodium in it. So the atmosphere is ruled out as well. Every clean reading here is doing work. What identifies the source is not the loud number, but which of the quiet ones stayed quiet.
        headline: One sodium result is four times the run before it — and the blank that followed it is high too.
        readings:
          - zone: Sample
            label: Sodium
            value: 4.1× the previous run
            status: alarm
          - zone: Blank after it
            label: Sodium
            value: raised
            status: alarm
          - zone: Blank before it
            label: Sodium
            value: at the usual level
            status: normal
          - zone: Outer trim
            label: Removed
            value: 1 cm, as specified
            status: normal
          - zone: Neighbouring depth
            label: Sodium on the replicate core
            value: ordinary
            status: normal
            note: same year, different hole
        choices:
          - label: Sea salt reached the plateau in the year this ice fell
            mechanism: A storm carried marine air far inland and the ice recorded it.
          - label: Something in the laboratory entered the run and stayed
            mechanism: The process itself contributed, and went on contributing to what followed.
          - label: The outer surface was not trimmed
            mechanism: Drill fluid and handling left salt on the outside of the section.
          - label: The replicate core missed the layer and is the wrong comparison
            mechanism: The second hole missed the layer entirely.
        answer: Something in the laboratory entered the run and stayed
        guide: Five readings, and the quiet ones do the work. The blank before is ordinary and the blank after is high. The trim was done to specification. The replicate core holds the same year with no sodium in it. Ask of each candidate how many of the five it covers. What identifies the source is not the loud number but which of the others stayed quiet.
        background:
          - Why the unremarkable readings decide it. The salient reading is what draws attention. It is usually consistent with several explanations at once, which is why it rarely settles anything. The readings that discriminate are the ones a candidate predicts should have moved, and which have not. A normal value is a positive result against every mechanism that would have disturbed it.
          - How to work the candidates. Take each mechanism and predict the panel it implies before you look at the panel again. Which readings it drives, in which direction, and by roughly how much. Then compare. Working that way round is what separates a diagnosis from a rationalisation. The prediction is made before the data is consulted.
          - Why only one candidate survives. Several will account for part of the panel, deliberately so. A partial fit is exactly what a confident wrong answer feels like from the inside. When two remain, look for the reading on which their predictions differ and let it decide. If no reading separates them you have not finished reading the panel.
        concept: Contamination and blanks in a cold laboratory
      - group: DRILL
        task: Hold the borehole fluid while the hole is open.
        title: The level that holds the hole open
        place: Drill Tower
        question: Hold the fluid level while the drill runs.
        scene: The borehole is three kilometres deep and the ice around it is trying to close it. The fluid column is what holds it open. The level in the tower has to stay where the pressure balance needs it while the drill runs.
        takesAsRead:
          - "Why ice keeps a record at all: burial without melting"
        assumes:
          - a column of fluid exerts pressure that grows with its depth
        takeaway: A hole is held open by a balance, and a balance is held by somebody.
        reason: The hole is trying to close while the drill runs, and the fluid level is the only thing holding it open
        format: HOLD
        why: Ice this deep flows, and a borehole through it closes on its own unless something holds it open. That something is the fluid column. Its pressure at the bottom has to sit close to the pressure of the ice around it. A little under and the wall creeps in. A little over and it fractures and swallows fluid. Everything in a drilling run disturbs that balance and none of it is a single step. Pulling the drill removes displacement continuously while the winch runs. Chips come up carrying fluid. Cold fluid off the reel is denser than the column it joins, and keeps sinking into it. So the pump is set to a new rate and held rather than tapped. The band narrows with depth because the two failure modes converge. The deeper the hole, the smaller the gap between the pressure that closes it and the pressure that breaks it. Both ends of that gap cost the same thing. A hole nobody can re-enter, and a season nobody can repeat.
        hold:
          quantity: Fluid level against the balance point
          control: Tank pump
          unit: m
          hold: 0
          band: 0.4
          narrowTo: 0.2
          duration: 45
          authority: 0.1
          pass: 0.8
          direction: raise
          disturbances:
            - label: Drill comes up and stops displacing
              at: 4
              amount: -0.03
            - label: Chips return with fluid on them
              at: 20
              amount: 0.05
            - label: Cold fluid off the reel goes down
              at: 38
              amount: -0.045
          hint: Each winch run keeps changing the balance. Set the pump to answer it, not the gauge.
          commit: Report the run
        guide: Hold the fluid level inside the band on the tower gauge. The band narrows as the hole deepens, because the deeper the hole the less margin there is between closing it and fracturing it. The pump between the tank and the hole is your control. Every run of the winch changes the balance until you answer it.
        background:
          - Why the hole needs holding at all. Ice at three kilometres is under enough pressure to flow, and it closes a borehole slowly and permanently. A column of fluid at close to the ice pressure holds it open. That is the only reason a deep hole can be re-entered at all.
          - Why too much is as bad as too little. Overpressure fractures the wall and takes fluid into the ice, which is both a lost hole and a contaminated record. The band is two-sided for that reason, and it is not symmetric in consequence.
          - Why the drill itself moves it. Pulling the drill out displaces less than it did going in. Chips come up with fluid on them. Cold fluid coming off the reel is denser than what is in the hole. Each of them is a rate, not a step.
        concept: "Drilling: fluid, brittle ice and what damage costs the record"
        answerText: Inside the band for most of the run, with the pump set to answer each displacement rather than tapped after the level has already moved.
  - title: Where the count stops
    objective: Find the end of the annually counted record and separate physical depth from age in compacting firn.
    briefing: "There is a second trap at the top of the core: buried firn compacts, so depth is not yet time."
    stake: Wednesday. The layers thin with depth until the line cannot tell one year from the next. Today you mark where counting ends, and turn eighty-eight metres of firn into the mass it really holds.
    takeaway: A date is a method plus the depth range where that method still works.

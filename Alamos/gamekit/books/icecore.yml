          template: '({0} ÷ {1} − 1) × {2}'
          formula: (a/b-1)*c
          correct: [0, 1, 2]
          target: -34.9
          tolerance: 2
          units: ‰
          solution: (1.935 ÷ 2.005 − 1) × 1000 = −34.9 per mil.

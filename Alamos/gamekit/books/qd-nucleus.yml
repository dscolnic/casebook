# The Atomic Nucleus — a Quick Discovery.
#
# The 3 x 3 shape from great_discoveries_first10_expanded.docx, game 03, mapped
# onto the engine's day model: a level is a day, a micro-game is a stop, and the
# campaign is nine stops in one sitting. Three levels, in order:
#
#   1  Test the old atom       make the prediction before the data exists
#   2  The impossible bounce   count what arrives, and find what is forbidden
#   3  Invent the nuclear atom explain the dull majority and the ten exceptions
#
# The science guardrail from the source book, kept, in both halves. The nuclear
# atom is a step and not the modern one — electrons on classical orbits round a
# nucleus are unstable, which nothing here can fix and the ending says so. And the
# experimental work is separated from the interpretation throughout: the counting
# is done at a microscope in the dark by people whose names are on the tally book,
# and the argument is made in another room.
#
# Written for a reader two grades below the AP games, and every card teaches its
# method before it asks anything. The `guide` on each stop says in plain words
# what the question is about and how the move is made, and the first background
# paragraph is a worked example on different numbers from the ones being asked
# about — different numbers deliberately, because a worked example on the same
# numbers is the answer with a label on it, which `probeQuestions` would fail and
# should.
#
# Format budget. Nine stops, cap three of any one format: CHOICE 2, and one each
# of PROTOCOL, VERIFY, SEQUENCE, TALLY, BALLPARK, SWEEP, RESIDUAL. Eight formats
# in nine stops, three of them instruments the player drives.

theme:
  id: qd_nucleus
  title: The Atomic Nucleus
  subtitle: Research Assistant · Scattering Laboratory

groups:
  - id: BENCH
    code: BNCH
    name: Instrument Bench
    color: '#8a6a1e'
    desc: The source, the collimator, the foil, and the order they have to stand in.
    defaultLeader: marsden
    milestones: [Draw the foil, Line up the beam, Check the collimator, Ready to hand over]
  - id: CHAMBER
    code: CHMB
    name: Scattering Chamber
    color: '#3f6f8f'
    desc: A gold leaf in a vacuum, a screen on an arm, and a scale round the outside.
    defaultLeader: geiger
    milestones: [Mount the leaf, Pump down, Swing the arm, Ready to hand over]
  - id: COUNT
    code: CNT
    name: Counting Room
    color: '#7a4fa3'
    desc: Dark, quiet, and where a flash becomes a number in a book.
    defaultLeader: kowalczyk
    milestones: [Dark-adapt, Count the bin, Close the tally, Ready to hand over]
  - id: STUDY
    code: STDY
    name: Interpretation Room
    color: '#b5502f'
    desc: A blackboard, three candidate atoms on it, and no apparatus at all.
    defaultLeader: rutherford
    milestones: [State the model, Price the prediction, Name what survives, Ready to hand over]

roster:
  - id: rutherford
    name: Ernest Rutherford
    role: Professor of Physics
    real: true
    division: STUDY
    bio: |
      Runs the laboratory and does none of the counting, which is deliberate.
      The people at the microscope should not know what the argument in the next
      room needs the numbers to be.

      His method is to write down what the accepted model predicts, in a number,
      before anybody looks. A model that has not committed to a prediction cannot
      be wrong, and a model that cannot be wrong is not being tested.

      His limit is that he interprets. The angles and the counts are somebody
      else's work, and he will not have a conclusion of his read back as though
      it were a measurement.
    quiz:
      - q: Why does Rutherford keep the counting room out of the argument?
        a: Somebody who knows what is wanted counts toward it
        wrong:
          - The counting room is far too dark for anybody to hold a discussion in
          - Counting and interpretation are handled by separate university departments
          - He has never trusted the calibration of that particular microscope

  - id: geiger
    name: Hans Geiger
    role: Experimental Physicist
    real: true
    division: CHAMBER
    bio: |
      Owns the chamber. A gold leaf a few hundred atoms thick hangs in the middle
      of it; a zinc-sulfide screen rides on an arm that swings round a scale from
      five degrees to a hundred and fifty.

      His rule is that a measured angle only means something if the particle met
      one atom. That is what the thinness of the leaf buys, and it is the whole
      reason the apparatus is delicate rather than robust.

      His limit is the vacuum. Air in the chamber scatters as well as the leaf
      does, and a poor pump turns every number in the book into a number about
      the pump.
    quiz:
      - q: Why does Geiger insist on the thinnest possible gold leaf?
        a: So one turn means one encounter
        wrong:
          - So that the alpha particles hold on to more of the speed they set off with
          - So that the leaf cannot build up an electric charge of its own during a run
          - So that the zinc-sulfide screen is not damaged by particles arriving too fast

  - id: marsden
    name: Ernest Marsden
    role: Laboratory Assistant
    real: true
    division: BENCH
    bio: |
      Prepares the source and lines up the beam. The alpha particles come out of
      a radium salt in every direction, and what reaches the leaf is whatever
      survives a lead block with a hole down the middle of it.

      The collimator is the part that makes an angle mean anything. Without it a
      particle arriving at the screen from ten degrees off could have started off
      ten degrees off, and no measurement separates the two.

      His limit is that he cannot make the beam brighter without making it wider,
      and a wider beam is a worse angle. Every run is that trade.
    quiz:
      - q: What does Marsden's lead collimator make possible?
        a: A measured angle means a real turn
        wrong:
          - A brighter beam arriving at the gold leaf than the source could give on its own
          - Alpha particles that all carry very nearly the same energy as each other
          - A vacuum good enough that the air in the chamber can be ignored entirely

  - id: kowalczyk
    name: Ewa Kowalczyk
    role: Observer, Counting Room
    division: COUNT
    bio: |
      Counts the flashes. Twenty minutes in the dark before the first one is
      visible, an hour at the eyepiece, and every count written in the book with
      the time and the angle beside it.

      A flash is one alpha particle striking zinc sulfide. Turning flashes into a
      fraction is what makes one run comparable with another, and the fraction is
      what the argument in the next room is entitled to use.

      Her limit is the eye. Counting is slow, it is tiring, and the same observer
      counts differently in the last ten minutes than in the first, which is why
      two people sit at the microscope for anything that matters.
    quiz:
      - q: Why do two observers count the same bin at the microscope?
        a: A tiring eye drifts, and two counts show it
        wrong:
          - One of them watches the screen while the other reads the angle off the plate
          - The flashes are far too faint for any single person to pick out reliably
          - It halves the wall-clock time that an hour of counting takes to get through

  - id: bhatt
    name: Ravi Bhatt
    role: Vacuum and Instruments
    division: CHAMBER
    bio: |
      Keeps the pump and the angle scale. The chamber holds a pressure at which
      air scatters an alpha particle less often than the leaf does, and if it does
      not, nothing measured in it is about gold.

      He also keeps the scale honest. The screen's arm reads an angle off a plate
      round the outside of the chamber, and an arm that is a degree out is a run
      whose bins are all shifted the same way.

      His limit is that his checks are on the apparatus rather than on the
      result, so a bad run and a good one look identical to him until somebody
      counts them.
    quiz:
      - q: Why does the chamber have to be pumped down before a run?
        a: Air scatters as well, so part of the answer would be about air
        wrong:
          - Alpha particles cannot travel through ordinary air over any useful distance
          - The zinc-sulfide screen glows a good deal less brightly when there is air round it
          - The gold leaf slowly oxidises and tears unless the air is taken out first

  - id: aitken
    name: Margaret Aitken
    role: Computer and Records
    division: COUNT
    bio: |
      Turns the tally book into distributions. A column of counts against angle
      becomes a fraction per bin, and the fractions are what get compared with a
      prediction.

      She also keeps the predictions, which are written and dated before each run
      and never revised afterwards. A prediction that moves once the data arrives
      is a description of the data.

      Her limit is arithmetic. She can tell you what fraction of the beam did
      something; she cannot tell you what would have to be true of an atom for
      that fraction to come out.
    quiz:
      - q: Why does Aitken date the predictions before a run?
        a: One changed afterwards is just a summary of what turned up
        wrong:
          - So that the counting room knows in advance which of the bins are worth watching
          - Because the professor insists on a written record of everything done in the building
          - So that two runs taken on different days can safely be added together afterwards

glossary:
  - name: Alpha particle
    aliases: [alpha particle, alpha particles, alpha]
    def: A fast, positively charged fragment thrown out by a radium salt.
  - name: Gold leaf
    aliases: [gold leaf, gold foil, the foil, the leaf]
    def: Gold beaten so thin that most particles cross it meeting one atom or none.
  - name: Collimator
    aliases: [collimator, lead collimator]
    def: A lead block with a hole in it, which turns a spray of particles into a beam.
  - name: Zinc sulfide
    aliases: [zinc sulfide, zinc-sulfide screen, the screen]
    def: A coating that gives one faint flash of light for each particle that strikes it.
  - name: Scattering angle
    aliases: [scattering angle, deflection angle, the angle]
    def: How far a particle's direction was turned from the way the beam was going.
  - name: Impact parameter
    aliases: [impact parameter, how close it passes, aiming distance]
    def: How far off centre a particle was aimed at the thing it passes.
  - name: Multiple scattering
    aliases: [multiple scattering, many small deflections, compounded collisions]
    def: The total turn built up by a particle meeting several atoms in a row.
  - name: Residual
    aliases: [residual, residuals, what is left over]
    def: What a model fails to account for, bin by bin, once it has been fitted.
  - name: Cross section
    aliases: [cross section, effective target area]
    def: The effective size of a target, measured by how often something hits it.
  - name: Vacuum
    aliases: [vacuum, pumped down, chamber pressure]
    def: Air thin enough that the air itself scatters far less than the target does.

missions:
  - title: Test the old atom
    objective: Write down what the accepted atom predicts, in a number, before the beam is switched on.
    briefing: The prediction is dated and signed before Ernest Marsden, the laboratory assistant, lines up the beam.
    stake: >-
      Monday, and nothing has been fired at anything yet. Ernest Rutherford, the professor who
      runs this laboratory, has three candidate atoms on the blackboard and only one of them is
      the accepted model. Hans Geiger, who owns the scattering chamber, has a gold leaf mounted
      and a screen on an arm that swings out to a hundred and fifty degrees. Today you state what
      the accepted atom is made of, commit to the largest deflection it can produce, and put the
      beam line together so that a measured angle means something. A prediction written after the
      data arrives is not a prediction, and everyone in the building knows it.
    takeaway: A model earns a test by committing to a number it could be wrong about.
    stops:
      - group: STUDY
        task: State what the accepted atom is made of
        title: Charge spread everywhere, and a field to match
        place: Interpretation Room
        concept: 'A charge spread through a volume makes a weak field everywhere in it'
        scene: >
          The accepted atom is on the blackboard: positive charge spread evenly
          through a sphere, with electrons embedded in it. Rutherford wants each
          feature matched to what it does before anybody fires anything.
        guide: >-
          This is a matching question. On the left are four things the accepted atom says
          about itself; on the right are four consequences. Pair each one with the
          consequence it produces. The way to do it is to ask, for each feature, what
          quantity it decides — how much charge there is, where the charge sits, how hard the
          push gets anywhere inside, or how hard the very hardest single push could possibly
          be. Those are four different questions and each feature answers exactly one of
          them.
        background:
          - >-
              How to do it, on a different example. Suppose a model said the charge sat in a
              thin ring near the outside. Ask what each part of that fixes. "Near the outside"
              fixes where the charge is. "A thin ring" fixes how strong the push gets — thin
              means concentrated, so the push near the ring is fierce. And "near the outside"
              also fixes something about the hardest encounter, because almost every particle
              passes close to the outside. Each phrase answers one question. Do the same for
              the four below.
          - >-
              Why spreading a charge weakens it. The force on a passing particle depends on
              how much charge is near it. Spread the same total over the whole volume of an
              atom and no small region holds much of it, so wherever the particle goes the
              push it feels stays modest. Concentrating the same total makes one small region
              violent and everywhere else empty.
          - >-
              Why the electrons barely matter here. An alpha particle is some seven thousand
              times heavier than an electron. Whatever an electron does to it is the effect a
              gnat has on a lorry, so the whole question is what the positive charge is doing.
          - >-
              What the model is being asked to do. Not to be plausible — it is plausible, which
              is why it is the accepted one. It has to say what the hardest possible single
              encounter looks like, because that is the number a beam can be pointed at.
        assumes:
          - the electrical force on a charge depends on how much charge is near it
          - a much heavier particle is barely deflected by a much lighter one
        takeaway: Spreading a charge over a volume caps how hard any single encounter inside it can be.
        format: PROTOCOL
        task_line: Match each feature of the accepted atom to what it fixes.
        scenarios:
          - Positive charge is spread evenly through the whole sphere.
          - Electrons are embedded in that sphere, one about seven thousandth the mass of an alpha particle.
          - The field anywhere inside the sphere comes from only the charge nearer the centre than you are.
          - The model contains no small region holding a large share of the charge.
        choices:
          - Where the positive charge is, which is everywhere and therefore nowhere in particular.
          - Almost nothing about an alpha particle's path, because the masses are so unequal.
          - How strong the push gets at any point, which is modest everywhere and zero at the centre.
          - A ceiling on the hardest possible single encounter, and so on the largest single deflection.
        mapping: [0, 1, 2, 3]
        why: >
          Read the four together and the model's prediction falls out of them. Charge spread
          evenly means no region is special. Only the charge closer to the centre than you are
          pushes you, so the field is modest everywhere and vanishes in the middle rather than
          blowing up. The electrons are irrelevant on grounds of mass alone. And with no
          concentration anywhere, there is a hardest possible encounter and it is not very hard.
          That last line is the one worth keeping, because it is what makes the model testable:
          it is not merely that large deflections are unlikely under this atom, it is that they
          are unavailable.

      - group: CHAMBER
        task: Commit to the largest deflection, then fire
        title: A thousand nudges, and what they come to
        place: Scattering Chamber
        concept: 'Many small random deflections add as the square root of their number'
        relationship: The largest deflection multiple scattering can build is the square root of the number of atoms crossed, multiplied by the deflection one atom gives.
        scene: >
          The leaf is four hundred atoms thick, and one atom can turn an alpha
          particle about a hundredth of a degree. Margaret Aitken, who keeps the
          records, will date the prediction sheet before the shutter opens.
        guide: >-
          You set a number, then you find out. The number is the biggest turn the accepted
          atom can produce in this leaf, and it is built from two things on the card: how many
          atoms a particle crosses, and how far one atom can turn it. The rule is that turns
          in random directions do not add up — they partly cancel, and what is left grows as
          the square root of how many there were. So take the square root of the number of
          atoms and multiply by the one-atom turn. Lock that in, open the shutter, and pay for
          the counting that tells you whether you were right.
        background:
          - >-
              How to do it, on a different example. Say a particle crossed a hundred atoms and
              each could turn it a twentieth of a degree. The square root of a hundred is ten,
              so ten twentieths — half a degree. Notice how much smaller that is than a
              hundred twentieths, which would be five degrees. Random turns cancel, and the
              square root is what survives. The leaf on this bench is thicker than a hundred
              atoms and each atom turns less, so do the same two steps with the numbers on the
              card.
          - >-
              Why the nudges do not simply add. Each atom turns the particle a little, in a
              direction that has nothing to do with the last one. Some of those turns cancel.
              What survives after a great many of them grows as the square root of their
              number, which is the same arithmetic as a drunk walking home.
          - >-
              What the numbers give. Four hundred atoms at a hundredth of a degree each: the
              square root of four hundred is twenty, so twenty hundredths of a degree. Two
              tenths of a degree is the accepted atom's honest ceiling on a run like this
              one.
          - >-
              Why the shutter opens after the sheet is dated. The prediction is worth
              something only if it could have been wrong, and a number written down while the
              screen is glowing is a reading rather than a prediction. Aitken keeps the sheets
              and does not let them be revised.
          - >-
              And why the run has to be measured at all. A prediction that is never checked
              is the more comfortable half of an experiment. There is a cost to swinging the
              arm and counting, and paying it is the only thing that turns this into a result.
        assumes:
          - deflections in random directions partly cancel rather than adding
          - the number of atoms crossed is set by how thick the target is
        takeaway: Random deflections build as the square root of their number, which is a ceiling and not a guess.
        format: VERIFY
        question: >-
          Predict the largest deflection the accepted atom allows, open the shutter, and report
          what the screen shows.
        verify:
          hint: >-
            Lock the prediction before the shutter opens. Nothing about it can be changed
            afterwards, which is the point of making it first.
          prediction: { label: Largest deflection the accepted atom allows, unit: degrees, min: 0.05, max: 4.0, step: 0.05 }
          truth: 0.2
          passRatio: [0.5, 2.0]
          intervention:
            label: Open the shutter on the collimated beam
            note: Radium source, lead collimator, four hundred atoms of gold leaf.
            outcome: Beam confirmed at the leaf. The screen is glowing at small angles.
          measurement:
            label: Deflections read off the screen at the small-angle scale
            note: Two observers, twenty minutes dark-adapted, counts in the book.
            cost: 2
            costUnit: hours at the microscope
          unmeasuredMoral: >-
            The beam ran, the screen glowed, and nobody read the scale. That establishes that the
            apparatus works and nothing whatever about the atom.
          commit: Report the deflection
        answerText: >-
          About two tenths of a degree — twenty hundredths, because four hundred random nudges
          build as the square root of four hundred rather than as four hundred.
        why: >
          Four hundred atoms, a hundredth of a degree each, and the answer is not four degrees.
          The turns point in unrelated directions and partly cancel, so what survives grows as
          the square root of the count: twenty times a hundredth, or a fifth of a degree. That
          is the accepted atom's ceiling, and it is a hard ceiling rather than a typical value —
          getting much past it needs a different atom, not a luckier particle. Notice what the
          commitment cost. The prediction was made when it could still be wrong, and it will be
          on the sheet next week when the counting room brings in something that cannot be fitted
          under it.

      - group: BENCH
        task: Put the beam line in order
        title: Source, hole, leaf, screen, eye
        place: Instrument Bench
        concept: 'A thin target makes one deflection one encounter'
        scene: >
          Marsden has the pieces laid out on the bench: a radium source, a lead
          block drilled down the middle, the mounted leaf, the screen on its arm,
          and the microscope. None of them is fixed down yet.
        guide: >-
          Put the five pieces in the order one particle meets them. The way to work it out is
          to take each piece and ask what has to be true of a particle before that piece tells
          you anything. A detector only reports an angle if the particle already had a known
          direction. A known direction only exists after something has thrown away everything
          going the wrong way. Follow that back and the order builds itself from the far end.
        axis: >-
          Put the five in the order a single alpha particle meets them. This is not a
          timetable — everything on the bench is available now, and the question is what has to
          have happened to a particle before the next piece tells you anything.
        ends: [First thing the particle meets, Last thing the particle meets]
        background:
          - >-
              How to do it, on a different example. Think about weighing a letter. You need a
              balance, a letter and a zero setting, and only one order works: zero the balance,
              put the letter on, read the number. Reading before zeroing gives a number that
              means nothing, and zeroing with the letter already on it gives a zero that means
              nothing. Each step makes the next one readable. The beam line is the same idea
              with five pieces instead of three.
          - >-
              What the lead block is for. A radium salt throws alpha particles in every
              direction, so a particle arriving at the screen ten degrees off the axis might
              have been deflected by ten degrees or might have set off that way. The hole
              settles it: everything that gets through is going one way, so any angle
              afterwards was acquired at the leaf.
          - >-
              Why the leaf is as thin as it can be beaten. A deflection measured through a
              thick target is the sum of an unknown number of encounters, and nothing follows
              about any single one of them. Thin it until most particles meet one atom or
              none, and a measured angle becomes a statement about one interaction — which is
              the only kind of statement a model can be tested against.
          - >-
              Why the screen moves and the leaf does not. The quantity being measured is the
              angle, so the detector has to be able to sit at any angle while everything
              defining the axis stays put. A fixed screen and a rotating leaf would measure
              the mounting.
        assumes:
          - a deflection is only interpretable relative to a known incoming direction
          - the number of encounters in a target rises with its thickness
        takeaway: An apparatus is ordered by which operation makes the next one interpretable.
        format: SEQUENCE
        task_line: Order the beam line as a single particle meets it.
        cards:
          - The radium source, throwing alpha particles in every direction.
          - The lead block with a hole down the middle, so what gets through is going one way.
          - The gold leaf, thin enough that most particles meet a single atom.
          - The zinc-sulfide screen on its arm, giving one flash per particle at a chosen angle.
          - The microscope, and a dark-adapted eye behind it.
        order: [0, 1, 2, 3, 4]
        why: >
          Each piece only works on particles the piece before it has already acted on. The
          source on its own gives a spray with no direction. An angle measured after that means
          nothing. The hole fixes the direction, and only then does an angle at the far end
          record a real turn. The leaf comes next for that reason, and it is thin for a
          different one: a turn built out of many atoms is the sum of an unknown number of
          events. The screen rides on an arm because the angle is the measurement. The eye is
          last, because a flash is not a number until somebody counts it. Swap any pair and the
          apparatus still assembles, still glows, and measures something nobody can name.

  - title: The impossible bounce
    objective: Turn flashes into a distribution, and find the part of it the accepted atom forbids.
    briefing: Two observers, an hour each at the eyepiece, and one bin nobody expected to be occupied.
    stake: >-
      Tuesday, and the counting room has been dark since seven. Ewa Kowalczyk, the observer at
      the microscope, has an hour of counts per bin and a tally book that runs from five degrees
      to a hundred and fifty. Margaret Aitken, who turns the book into distributions, has the
      Monday prediction sheet beside it: nothing past a fifth of a degree. Today you build the
      distribution out of the counts, decide which part of it the accepted atom cannot survive,
      and work out how close something got to turn a particle right round. Ten flashes in ten
      thousand is a number small enough to be missed and large enough to be impossible.
    takeaway: An anomaly is worth what the model's own prohibition on it was worth.
    stops:
      - group: COUNT
        task: Take the counts band by band
        title: Where the two curves come apart
        place: Counting Room
        concept: 'A fraction is one count over another, and a tiny one is still not none'
        relationship: A band's share of the beam is its own count out of ten thousand particles.
        scene: >
          Kowalczyk has the screen on its arm and five angle bands to work
          through. Beside the tally book is Aitken's sheet of what the accepted
          atom allows in each band, worked out on Monday.
        guide: >-
          Nothing is on the screen until you take it. Swing the arm to a band, count, and the
          panel shows you what was counted there and what Monday's model said would be there.
          Both are given as a share out of ten thousand particles, so they can be compared
          directly. Work along the bands and name the first one where the two numbers stop
          agreeing — not the band with the biggest count, and not the band that surprises you,
          but the first place the model and the counting part company.
        background:
          - >-
              How to do it, on a different example. Suppose a bus timetable predicted 40, 12, 3
              and 1 passengers at four stops and the counts came in at 41, 11, 4 and 26. The
              first three agree to within the wobble you would expect on small numbers. The
              fourth does not agree at all, and it does not matter that the first stop has the
              biggest number in the table — the timetable is fine there. The break is at the
              fourth stop. Read the bands below the same way.
          - >-
              What a share out of ten thousand is. The count in a band divided by the number of
              particles that crossed the leaf, times ten thousand. It is written that way so a
              band watched for ten minutes can be compared with one watched for an hour, and so
              the counting can be compared with a prediction at all.
          - >-
              Why small counts wobble. A count of nine is nine give or take about three,
              because the scatter on a count is roughly its own square root. So agreement
              within a few, on a band holding a handful, is agreement. Disagreement by a factor
              of thousands is not a wobble.
          - >-
              What the model's column actually is. Monday's prediction, worked out from four
              hundred atoms at a hundredth of a degree each, and never revised. It allows a
              little scattering out to a few degrees because random turns build up, and it
              allows essentially nothing past that — the numbers in the far bands are not small,
              they are unimaginably small.
        assumes:
          - a count of rare events carries a scatter of about its own square root
          - a share of the whole is what makes two runs of different lengths comparable
        takeaway: A model fails at the first place its prediction and the counting stop agreeing, not at the place with the most events.
        format: PROBE
        question: >-
          Work along the angle bands and take the counts. At which band do the counting and
          Monday's model stop agreeing?
        probe:
          chainLabel: Angle band
          minReadings: 3
          stations:
            - id: B1
              label: Under one degree
              reading: 9,902 in 10,000
              expected: 9,900 in 10,000
              load: almost the whole beam, on either picture
            - id: B2
              label: One to five degrees
              reading: 88 in 10,000
              expected: 92 in 10,000
              load: random turns building up across four hundred atoms
            - id: B3
              label: Five to thirty degrees
              reading: 8 in 10,000
              expected: 7 in 10,000
              load: the far tail of the same building-up
            - id: B4
              label: Thirty to ninety degrees
              reading: 1.4 in 10,000
              expected: 1 in 10 million
              load: beyond what random turns can reach
            - id: B5
              label: Beyond ninety degrees
              reading: 0.6 in 10,000
              expected: 1 in a billion billion
              load: beyond what random turns can reach
          target: B4
          commit: Name the band
        answerText: >-
          Thirty to ninety degrees. The first three bands agree to within the wobble on small
          counts, and at the fourth the counting is more than ten thousand times what the model
          allows.
        why: >
          Work along the columns. Under one degree the two agree. At one to five degrees they
          agree. At five to thirty they agree too, and the gap between eight and seven is
          smaller than the wobble on a count of eight. Then at thirty to ninety the counting
          says about one and a half in ten thousand and the model allows one in ten million.
          That is a factor of more than ten thousand, and no amount of counting luck makes it
          go away. Two things here are worth keeping. The biggest count in the table sits in the
          band where the model is exactly right, so the size of a number says nothing about
          whether it is evidence. And the break is not gradual. The band past ninety degrees is
          worse again by a factor of a hundred million. That is what it looks like when a model
          is not slightly wrong but has no account of something at all.

      - group: CHAMBER
        task: Say which part of the data the old atom cannot survive
        title: Ninety-nine per cent agrees with you
        place: Scattering Chamber
        concept: 'A rare event is decisive when a model forbids it'
        scene: >
          Monday's prediction is drawn over Tuesday's counts, and the forward peak
          sits under it almost exactly. Ravi Bhatt, who keeps the vacuum and the
          angle plate, has the screen out at a hundred and fifty degrees. It is
          still flashing.
        guide: >-
          All four statements below are true of this run. Pick the one the accepted atom cannot
          explain. The test to apply to each is simple: does the accepted atom, with its charge
          spread out, have an account of this? If it does, the observation is no trouble for it,
          however striking it looks. If the model's own arithmetic says the thing cannot happen
          at all and it did, that is the one. Being right about everything else is not a
          defence.
        background:
          - >-
              How to think about it, on a different example. A weather forecast says tomorrow
              will be dry and mild, and tomorrow it is dry and mild — and hail falls for two
              minutes at noon. The dry mild day is not evidence for the forecast, because the
              forecast said so and so would almost any forecast. The hail is the interesting
              part, because the forecast said the air was nowhere near cold enough for it.
              Small and forbidden beats large and expected. Apply that test to the four below.
          - >-
              Why the forward peak is not evidence. The accepted atom predicts a narrow
              forward cone with nothing much past a fifth of a degree, and that is what the
              first bin shows. A model being right about what it predicted is the ordinary
              case; it is not a mark in its favour when the same model is silent about
              something else in the same data.
          - >-
              Why ten events beat nine thousand. Evidence is weighed by how surprising it is
              under the model being tested, not by how often it happens. Nine thousand
              straight paths are consistent with the accepted atom, with the nuclear atom, and
              with almost anything else. Ten reversals are consistent with almost nothing.
          - >-
              What would have to be wrong for the anomaly to go away. Air in the chamber, a
              mis-set angle scale, a second scattering surface in the beam path. Every one of
              those is worth checking, and every one of them is a claim that the ten flashes
              were never there — which is a different kind of claim from an explanation of
              them.
        assumes:
          - a model that predicts an outcome gains nothing from being right about it
          - a prohibition is stronger evidence than a prediction of what is common
        takeaway: The decisive observation is the one the model forbids, not the one you did not expect.
        format: CHOICE
        question: >-
          Which observation is hardest for an atom with its charge spread out to explain?
        choices:
          - A small number of particles coming off beyond ninety degrees.
          - Most particles going almost straight through.
          - The target being gold rather than some other metal.
          - The screen giving one faint flash for each particle.
        answer: A small number of particles coming off beyond ninety degrees.
        rebuttals:
          - Most particles going almost straight through is exactly what the accepted atom predicts, and a model gains nothing from being right about what it predicted.
          - Gold is used because it can be beaten thinner than anything else on the bench. Any metal thin enough would do, and nothing about the choice is in tension with either model.
          - One flash per particle is a property of zinc sulfide, and both models are equally silent about it. It is how the measurement is made rather than something the measurement is about.
        why: >
          The forward peak agrees with the accepted atom to a fifth of a degree. That is the
          model doing exactly what it said it would do. But it also said nothing gets past that
          angle, and about ten particles a run come back the way they arrived. Those ten are not
          just unexpected. They are arithmetically unavailable: a charge spread everywhere has a
          hardest possible push, and it is nowhere near this hard. So a tenth of a per cent is
          decisive and ninety-nine per cent agreement is worth nothing. It is also why the next
          job is to check the air, the angle plate and the beam path. The honest alternative to a
          new atom is that the ten flashes were never real, and that has to be ruled out rather
          than waved away.

      - group: STUDY
        task: Work out how close it got
        title: The distance a particle stops at
        place: Interpretation Room
        concept: 'The closest approach bounds the size of what did the repelling'
        scene: >
          Rutherford has one number on the board: an alpha particle from this
          source carries about seven point seven million electron volts. A
          particle that comes straight back has spent all of it.
        guide: >-
          A particle that comes straight back stopped somewhere and started again, and this is
          one division. The electrical push between a gold nucleus and an alpha particle is
          written on the card as a single quantity in joule-metres: it is how much energy the
          push costs multiplied by the distance it is measured at. Divide it by the energy the
          particle arrives with and what comes out is a distance — the point where the particle
          had spent everything it had. Two tiles, one division. The others describe gold and
          are not part of it.
        background:
          - >-
              How to do it, on a different example. Suppose the push were 8 × 10⁻²⁶ joule-metres
              and the particle arrived with 4 × 10⁻¹² joules. Eight divided by four is two, and
              ten to the minus twenty-six divided by ten to the minus twelve is ten to the
              minus fourteen. So the answer is 2 × 10⁻¹⁴ metres. Divide the numbers in front,
              subtract the powers of ten, and the units left over are metres because
              joule-metres divided by joules is metres.
          - >-
              What a reversal means in energy. The particle arrives with kinetic energy,
              climbs an electrical hill as it approaches a like charge, and comes to rest at
              the point where the hill has taken all of it. Then the same hill pushes it back
              out. Where it stopped is the closest it got.
          - >-
              Why that distance is an upper bound on a size. The particle got that close and
              was still pushed away, so all of the charge that pushed it must lie inside that
              distance. It says nothing about how much smaller the thing might be — only that
              it is not bigger.
          - >-
              What the answer is worth comparing with. A gold atom is about a ten-thousandth
              of a millionth of a metre across. Anything four orders of magnitude smaller than
              that is not a feature of the atom; it is an object inside a volume that is
              otherwise nothing at all.
        assumes:
          - kinetic energy converts entirely to potential energy at the turning point
          - the electrical potential energy of two like charges rises as they approach
        takeaway: A turning point converts an energy into a distance, and the distance bounds a size.
        format: BALLPARK
        question: How close does an alpha particle get before it is turned right round?
        estimate:
          prompt: >-
            Rutherford wants a distance on the board before anybody draws an atom.
          question: How close does an alpha particle get before it is turned right round?
          relationship: The closest approach is the Coulomb push between the two charges, in joule-metres, divided by the kinetic energy the alpha particle arrives with.
          labels:
            - 3.6e-26 J m  (the Coulomb push between a gold nucleus and an alpha particle)
            - 1.2e-12 J  (the kinetic energy one alpha particle arrives with)
            - 1.4e-10 m  (the radius of a gold atom)
            - 79  (the number of protons in a gold nucleus)
          values: [3.6e-26, 1.2e-12, 1.4e-10, 79]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 3.0e-14
          tolerance: 6e-15
          units: metres
          solution: Three point six divided by one point two is three, and ten to the minus twenty-six over ten to the minus twelve is ten to the minus fourteen — so about 3 × 10⁻¹⁴ metres.
          explanation: The atomic radius is on the bench because it is the number to compare the answer with rather than a term in it, and it is about five thousand times larger. The proton count is already inside the Coulomb push.
        why: >
          A particle that comes straight back has converted every joule of its motion into
          electrical potential energy and stopped. Setting the two equal turns an energy into a
          distance, and the distance comes out around three times ten to the minus fourteen
          metres. Read what that is and is not. It is an upper bound: the charge that turned the
          particle round is all inside that radius, and it could be very much smaller. And it is
          about five thousand times less than the radius of the atom it sits in, which means the
          concentration is not a dense core in a solid object. It is a speck in a volume that
          the other nine thousand nine hundred particles crossed without noticing anything at
          all.

  - title: Invent the nuclear atom
    objective: Explain the dull majority and the ten exceptions with one atom, and claim only what each half supports.
    briefing: Three candidate atoms, one distribution, and a verdict that has to say which clause came from where.
    stake: >-
      Wednesday, and the distribution is on the wall with three candidate atoms beside it.
      Rutherford will not accept a model on the strength of the tail alone, and Kowalczyk will
      not have the forward peak described as though it were a detail. Today you find out how the
      deflection depends on how close a particle was aimed, fit each candidate to the counts and
      look at what it leaves over, and write a claim in two clauses with a different half of the
      data behind each. The nuclear atom is a step and not the last one, and the last paragraph
      has to say so.
    takeaway: A structure is claimed clause by clause, each from the part of the data that supports it.
    stops:
      - group: CHAMBER
        task: Find how the deflection depends on the aim
        title: How close it passes is the whole of it
        place: Scattering Chamber
        concept: 'Deflection grows without limit as the impact parameter shrinks'
        scene: >
          Bhatt has set up a single scatterer with all the charge in one small
          region, and one control: how far off centre the particle is aimed. The
          screen reads the angle it comes off at.
        guide: >-
          One slider and one reading. The slider is how far off centre the particle is aimed;
          the reading is how far it gets turned. Start at the far end and bring the aim in,
          watching the angle. Most of the range will barely move it. You are hunting for the
          aiming distance where the angle reaches ninety degrees — the point at which a
          particle stops being nudged and starts being sent back. Note the value there rather
          than the largest angle you can find, because there is no largest.
        background:
          - >-
              How to read a sweep. It is a hunt, not a calculation. Move the control in big
              steps first to find out where anything happens at all, then in small steps
              through the part that moves. Here the whole outer three quarters of the range is
              flat, which is information: it tells you the interesting distance is small.
              Halving the aim roughly doubles the angle at first and then does much more than
              double it, so the last few steps are where the reading you want lives.
          - >-
              What the aim is. The perpendicular distance between the incoming line of flight
              and the centre of the scatterer, if the particle carried straight on. Everything
              about the encounter follows from it, because it decides how close the two charges
              ever get and therefore how hard and how long the push is.
          - >-
              Why the response is so uneven. A particle aimed well wide barely notices the
              charge and carries on. Bring the aim in and the deflection rises slowly, then
              steeply, then without any limit at all as the aim approaches dead centre. There
              is no largest deflection — there is only a smallest aim you happen to have tried.
          - >-
              Why that shape produces this distribution. The area available to a wide aim is
              enormous and the area available to a near-central one is tiny, so almost every
              particle takes the boring path and a countable few are aimed close enough to be
              turned right round. Nine thousand nine hundred and ten in the same experiment is
              not two facts. It is one shape.
          - >-
              And what the sign of the deflection says. The particle is pushed away from the
              centre rather than pulled toward it, which it could only be if the charge there
              is the same sign as the particle's own. Alpha particles are positive, so the
              centre is positive. That inference is free once the trajectory is on the screen.
        assumes:
          - the force between two like charges falls off with the square of their separation
          - the area available to a range of aiming distances grows with the distance
        takeaway: The angle a particle turns through is set by how close it was aimed, and it has no ceiling.
        format: SWEEP
        question: >-
          Bring the aim in from the edge. At what aiming distance does the deflection reach
          ninety degrees?
        sweep:
          axis:
            label: Aiming distance from the centre
            unit: 10⁻¹⁴ m
            min: 0.5
            max: 40.0
            step: 0.1
          readout:
            label: Deflection
            unit: degrees
          baseline: 0.4
          response:
            - { at: 40.0, value: 0.4 }
            - { at: 20.0, value: 0.8 }
            - { at: 10.0, value: 1.7 }
            - { at: 5.0, value: 3.4 }
            - { at: 2.0, value: 8.4 }
            - { at: 1.5, value: 22.0 }
            - { at: 1.0, value: 55.0 }
            - { at: 0.74, value: 90.0 }
            - { at: 0.5, value: 124.0 }
          target: 0.74
          tolerance: 0.12
          start: 40.0
        answerText: >-
          About 0.7 × 10⁻¹⁴ metres. Inside that the deflection runs past ninety degrees and keeps
          going; outside twenty times that distance there is nothing worth reading.
        why: >
          Almost the whole range of the control does nothing. Out at forty units the particle
          barely turns, and it is still under ten degrees at two — then between two and one half
          it goes from eight degrees to a hundred and twenty. There is no maximum deflection in
          this curve, only a smallest aim anybody has tried. Now put that together with how much
          room each aim has: the ring of area available at a wide aim is vast and the disc
          available at a near-central one is minute, so overwhelmingly the commonest outcome is
          nothing happening and a countable few are turned right round. The forward peak and the
          backward tail are not two findings that have to be reconciled. They are one curve.

      - group: COUNT
        task: Fit each candidate and read what it leaves
        title: What each atom cannot account for
        place: Counting Room
        concept: 'Structure left over by a fit is a cause the model does not contain'
        scene: >
          Aitken has fitted three candidate atoms to the same counts: charge
          spread through the volume, a hard hollow shell at the outside, and all
          the charge in one small central region. Three sheets of leftovers.
        guide: >-
          Three atoms have each been fitted to the same counts, and you are looking at what
          each fit failed to account for, bin by bin. Up means more particles arrived than the
          atom predicts; down means fewer. The move is to ignore the summary score and look at
          the shape. If the leftovers jump up and down at random, the model has nothing left to
          explain. If they are all up on one side of the chart, or all down, there is a cause
          the model does not contain — and the summary score will not show it, because a
          summary averages a pattern away.
        background:
          - >-
              How to do it, on a different example. Imagine fitting a straight line to a set of
              points that actually curve. The line can be placed to make the average error
              small, and the leftovers will still be positive at both ends and negative in the
              middle every time. That pattern is the curve, showing through. A fit with a worse
              average whose leftovers scatter randomly is describing its data better than a fit
              with a good average and a shape in what it missed.
          - >-
              What a leftover is. The counted number in a bin minus the number the fitted model
              says should be there. A complete model leaves leftovers that jump about at random,
              because all that is left is the scatter of finite counts.
          - >-
              Why a better summary number can be a worse model. A summary is one number over
              the whole distribution, so a model can improve it by fitting the middle better
              while still having no account at all of the ends. The pattern in the leftovers is
              what a summary averages away.
          - >-
              What each candidate does to the tail. Charge spread through the volume has a
              ceiling on its deflections, so everything past that ceiling sits outside its fit
              entirely. A hard shell at the outside deflects, but it deflects the particles that
              graze the edge — which is most of them — so it gets the tail at the cost of the
              peak. Charge in one small region gets both, because the same curve produces both.
        assumes:
          - a summary statistic averages over structure it cannot see
          - the leftovers of a complete model carry no pattern
        takeaway: A model is judged by the shape of what it fails to explain, not by the size of it.
        format: RESIDUAL
        question: >-
          Read the leftovers of each fit before you choose. Which atom would you carry forward?
        residual:
          hint: >-
            Each stick is one angular bin. Up is more counts than the fit predicts, down is
            fewer.
          fits:
            - id: diffuse
              label: Charge spread through the whole volume
              rms: 0.14
              structured: true
              residuals:
                - { x: -2, y: -2, value: 0.02 }
                - { x: 0, y: -2, value: 0.03 }
                - { x: 2, y: -2, value: 0.01 }
                - { x: -2, y: 2, value: 0.31 }
                - { x: 0, y: 2, value: 0.34 }
                - { x: 2, y: 2, value: 0.29 }
            - id: shell
              label: A hard hollow shell at the outside of the atom
              rms: 0.11
              structured: true
              residuals:
                - { x: -2, y: -2, value: -0.24 }
                - { x: 0, y: -2, value: -0.26 }
                - { x: 2, y: -2, value: -0.22 }
                - { x: -2, y: 2, value: 0.05 }
                - { x: 0, y: 2, value: 0.04 }
                - { x: 2, y: 2, value: 0.06 }
            - id: central
              label: All the charge in one small central region
              rms: 0.13
              residuals:
                - { x: -2, y: -2, value: 0.12 }
                - { x: 0, y: -2, value: -0.09 }
                - { x: 2, y: -2, value: 0.04 }
                - { x: -2, y: 2, value: -0.14 }
                - { x: 0, y: 2, value: 0.11 }
                - { x: 2, y: 2, value: -0.06 }
          accept: central
          commit: Carry this atom forward
        answerText: >-
          The small central region, at 0.13. The hollow shell scores better and its leftovers are
          negative right across the forward bins, which means it bought the tail by giving up the
          peak.
        why: >
          Two of the three leave a pattern. The spread-out charge accounts for the forward bins
          almost perfectly and leaves the whole backward tail standing outside its fit — a
          feature, not scatter, and no amount of extra counting will make it go away. The hollow
          shell has the better summary number and is the worse model: its leftovers run negative
          across every forward bin, because a shell at the outside deflects the particles that
          graze it and those are nearly all of them. It fits the tail by predicting far too few
          straight paths. The central region scores worst of the three on the summary and its
          leftovers change sign at random, which is what a complete description looks like. One
          large leftover would be a bad bin. Three of the same sign in a row are a cause.

      - group: STUDY
        task: Write the claim in two clauses
        title: Concentrated, and mostly nothing
        place: Interpretation Room
        concept: 'Two clauses, each from its own half of the distribution'
        scene: >
          The distribution, the closest-approach figure and the fitted atom are
          all on the board. Rutherford wants one sentence, and he wants to be
          told which part of the data each half of it rests on.
        guide: >-
          Four possible sentences, and you are choosing the one the week's counting actually
          supports. Test each one clause by clause. For every clause, ask which part of the
          distribution is behind it — the rare large angles, or the overwhelming majority of
          straight paths. A clause with no part of the data behind it is an overclaim, and a
          sentence that uses only one part of the data has left half the result out.
        background:
          - >-
              How to do it, on a different example. Somebody weighs a sealed box and shakes it.
              It is heavy, so there is something in it; it rattles freely, so whatever is in it
              is small compared with the box. Two clauses, and each rests on a different
              observation — the weight and the rattle. Neither one alone gets you both, and a
              conclusion that mentions the colour of the contents rests on nothing at all. Read
              the four sentences below the same way.
          - >-
              Where each clause comes from. The rare large angles say the positive charge and
              nearly all the mass are concentrated in something tiny — that is the tail and the
              closest-approach figure. The overwhelming majority of straight paths say the rest
              of the volume has almost nothing in it. Two clauses, two halves of one
              distribution, and neither half supports the other clause.
          - >-
              What empty does and does not mean. Nine thousand nine hundred particles crossing
              without a noticeable deflection means there is nothing dense in the way. It does
              not mean there is nothing there — the electrons are there, and something has to
              be said about them that this experiment cannot say.
          - >-
              What this atom cannot survive, which the claim has to leave room for. Electrons
              going round a concentrated positive charge on ordinary orbits would radiate and
              fall in, in a fraction of a second. The scattering says where the charge is. It
              says nothing about how anything stays in orbit round it, and that problem is not
              solved by anything in this building.
        assumes:
          - a claim is only as strong as the part of the data behind it
          - a result may be decisive about one question and silent about another
        takeaway: Each clause of a conclusion names the part of the evidence it rests on, and no clause outruns it.
        format: CHOICE
        question: What is the strongest justified statement from this experiment?
        choices:
          - The charge and the mass sit in a tiny centre, and the rest is nearly empty.
          - Atoms are mostly made of solid material, with only a small hollow space somewhere near the middle of each one.
          - The experiment shows how the electrons travel around the outside of the nucleus on their orbits.
          - Most alpha particles bounce back off atoms, which is why an atom has to have a hard outer core.
        answer: The charge and the mass sit in a tiny centre, and the rest is nearly empty.
        rebuttals:
          - Mostly solid is the opposite of what nine thousand nine hundred undeflected particles in ten thousand say. That count is the direct measurement of how much of the volume holds anything dense.
          - Nothing in this experiment observes an electron. An alpha particle is thousands of times heavier, so the electrons barely affect its path and the counting is silent about them.
          - >-
              Most particles do not bounce back — about one in a thousand does, and the whole
              argument rests on that being rare rather than common. Reversing the fraction turns
              the strongest result in the building into a description of a different experiment.
        why: >
          The claim comes in two clauses because the data comes in two parts. The ten reversals
          per ten thousand, together with the closest-approach figure, say the positive charge
          and the mass sit in something some five thousand times smaller than the atom. The nine
          thousand nine hundred straight paths say the remaining volume holds nothing dense
          enough to notice. Neither half would carry the other, and a sentence with only one of
          them in it is either an overclaim or a description of the boring bins. Then notice what
          is deliberately absent. Nothing here says how an electron stays in orbit round that
          centre, and on ordinary mechanics it cannot — it would radiate and fall in. This
          experiment locates the charge. Somebody else has to explain the rest of the atom.

warmups:
  greet:
    title: Six people, and one number between them
    why: >-
      Nothing in this building is measured by one person. The source, the vacuum, the angle
      plate, the counting and the arithmetic are five different hands, and a figure is worth
      what the hands behind it are worth. Put a name to as many of them as you can before the
      first run.
  trial-near:
    title: Walk the beam line before the shutter opens
    why: >-
      The bench and the chamber are on one side of the corridor and the counting room and the
      professor's room on the other. Walk it once now. Hans Geiger, who owns the scattering
      chamber, would rather you knew the way than opened the wrong door with the shutter up.
  follow:
    title: Kowalczyk carries a tally book from the eyepiece to the board
    why: >-
      A flash is counted in the dark, divided by a total in another room, and drawn on a board
      in a third, and most of what goes wrong happens between them. Ewa Kowalczyk, the observer
      at the microscope, walks one count all the way through. Stay with her and watch where the
      number changes hands.

interiors:
  BENCH:
    caption: A measured angle means nothing without a known incoming direction.
    standLine: A radium source, a drilled lead block, and a leaf four hundred atoms thick.
    station:
      kind: panel
      title: Beam line
      rows:
        - { label: Collimator bore, value: 1.1 mm, status: normal }
        - { label: Leaf thickness, value: 400 atoms, status: normal }
        - { label: Beam width at the leaf, value: 1.4 mm, status: normal }
        - { label: Source activity, value: falling, status: low }
  CHAMBER:
    caption: The screen moves and the axis does not, because the angle is the measurement.
    standLine: A gold leaf in a vacuum, and an arm that swings to a hundred and fifty degrees.
    station:
      kind: panel
      title: Chamber
      rows:
        - { label: Pressure, value: 0.02 mmHg, status: normal }
        - { label: Screen arm, value: 150°, status: high }
        - { label: Angle plate, value: checked Monday, status: normal }
        - { label: Shutter, value: open, status: alarm }
  COUNT:
    caption: A flash is not a number until somebody counts it.
    standLine: Two observers, twenty minutes dark-adapted, an hour to a bin.
    station:
      kind: plot
      title: Counts against angle
      note: the tail is what nobody predicted
      axes: { x: scattering angle, y: share of the beam }
      curves:
        - { points: [[0.02, 0.98], [0.06, 0.45], [0.12, 0.12], [0.3, 0.03], [0.6, 0.012], [0.95, 0.008]], label: counted }
        - { points: [[0.02, 0.99], [0.05, 0.4], [0.09, 0.04], [0.13, 0.0], [0.95, 0.0]], dashed: true, faint: true, label: the accepted atom }
  STUDY:
    caption: A prediction that moves after the data arrives is a description of the data.
    standLine: Three candidate atoms on the blackboard, and the Monday sheet still dated.
    station:
      kind: panel
      title: On the board
      rows:
        - { label: Predicted ceiling, value: 0.2°, status: normal }
        - { label: Counted beyond 90°, value: 0.1 %, status: alarm }
        - { label: Closest approach, value: 3 × 10⁻¹⁴ m, status: high }
        - { label: Atomic radius, value: 1.4 × 10⁻¹⁰ m, status: normal }

copy:
  BENCH: <p>The instrument bench, first door on the west side. A radium source in a lead pot, a block drilled down the middle, and the leaf press.</p>
  CHAMBER: <p>The scattering chamber, across the corridor. A brass vessel with a window, a leaf mounted in the middle of it, and a screen on an arm that reads off a plate round the outside.</p>
  COUNT: <p>The counting room, behind a double door and dark. A microscope, a stool, a hooded lamp over the tally book, and nothing else at all.</p>
  STUDY: <p>The interpretation room at the far end. A blackboard, three candidate atoms chalked on it, and not one piece of apparatus.</p>
  PORCH: <p>The porter's desk inside the front door. A signing-in book, a rack of pigeonholes, and a repeater lamp for the chamber shutter.</p>
  TEA: <p>The tea room halfway down the west side. Chairs that do not leave, an urn, and the counting rota on the back of the door.</p>
  DARK: <p>The dark-adaptation room, next to the counting room. Two chairs, no lamp, and twenty minutes of doing nothing before your eye is any use.</p>
  RACK: <p>The store at the end of the west side. Brass stock, lead sheet, spare screens, and the pump oil.</p>
  LIB: <p>The reading room at the far end. Journals, a loan card in every front cover, and the only quiet that is not also dark.</p>

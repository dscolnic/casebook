# instruments.yml — the Meridian Verification Office.
#
# THIS BOOK IS THE WORKED EXAMPLE OF THE 12 FORMATS IN `FORMATS.md`. One
# stop each, over four days, in a place invented for the purpose: an office that
# checks other people's measurements, so every 1 of the 12 is something
# somebody there does on an ordinary Tuesday.
#
# It exists for the reason `tools/BOOK_TEMPLATE.md` exists — a format nobody has
# authored is a format nobody has tested. Each stop below is deliberately the
# *minimum* that clears its own importer trap, so it doubles as the reference for
# what each block has to contain and why. Read a stop's comment before writing
# your own; every one of them records a check that will otherwise reject your book
# with a sentence you have to reverse-engineer.
#
#   node tools/import-book.mjs books/instruments.yml instruments --verify
#   THEME=instruments npm run dev   ->  /engine/dev/instruments.html

theme:
  id: instruments
  title: Meridian
  subtitle: Verification Officer · Meridian Verification Office

# ---------------------------------------------------------------- the areas
# A design decision. No design document contains it: the book teaches topics,
# and this is the choice of which topics are *places* the player walks to.
groups:
  - id: G1
    code: G1
    name: Field Station
    color: '#2980b9'
    desc: What an instrument can measure, and what it cannot.
    defaultLeader: lead1
    milestones: [Set up the notebook, Connect the evidence, Check it holds, Ready to hand over]
  - id: G2
    code: G2
    name: Sample Room
    color: '#27ae60'
    desc: Getting a number that means something.
    defaultLeader: lead2
    milestones: [Set up the notebook, Connect the evidence, Check it holds, Ready to hand over]
  - id: G3
    code: G3
    name: Records Office
    color: '#c0392b'
    desc: What was written down, and what it leaves out.
    defaultLeader: lead3
    milestones: [Set up the notebook, Connect the evidence, Check it holds, Ready to hand over]
  - id: G4
    code: G4
    name: Response Desk
    color: '#d35400'
    desc: Deciding what to do while the evidence is still incomplete.
    defaultLeader: lead4
    milestones: [Set up the notebook, Connect the evidence, Check it holds, Ready to hand over]

# ------------------------------------------------------------------ the cast
# Books name functions — "the local expert", "the skeptical reviewer". People
# are yours to invent. EVERY entry needs a `division` or that area's person
# stops are unreachable, and nothing says so until somebody walks the whole map.
roster:
  - id: lead1
    name: Ada Merrick
    role: Station Lead
    division: G1
    bio: |
      Runs the field station, which is two instruments and a rule. The rule is
      that a reading is a claim, and a claim needs evidence that could have come
      out differently.

      Every instrument here answers one narrow question well and every other
      question badly. Knowing which question an instrument is answering is most
      of the job.

      Her limit is calibration: an instrument that has drifted is confident and
      wrong, and it will not tell you which.
    quiz:
      - q: Why does Merrick distrust a single confident reading?
        a: A drifted instrument sounds exactly like one that has not drifted
        wrong:
          - Field instruments cannot resolve anything below about one part per million, whatever the display shows
          - Readings taken outdoors run low because the ambient temperature is never the calibration temperature
          - Any measurement has to be repeated the following week before it can be entered in the station log
  - id: lead2
    name: Tomas Oyelaran
    role: Sample Room Lead
    division: G2
    bio: |
      Keeps the sample room, where every container is a record of where it has
      been. A sample with no history is a sample about nothing.

      He measures twice and writes down both, because two numbers that disagree
      are information and one number that agrees with itself is not.

      His limit is time: some things change in the container, and the answer he
      gets is the answer at the moment he asks.
    quiz:
      - q: Why does Oyelaran write down both of two disagreeing numbers?
        a: The disagreement is itself information; one number hides it
        wrong:
          - Duplicate runs are required by the sample room's procedure before any result can leave it
          - The higher of the two readings is the one that gets reported, so both have to be on record
          - A disagreement between runs means the instrument is due for recalibration and must be logged
  - id: lead3
    name: Priya Naidoo
    role: Records Officer
    division: G3
    bio: |
      Holds the paperwork, which is the only part of this work that outlasts the
      people doing it. She reads a form for what it does not have room to say.

      A gap in a record is not the same as a zero, and she will not let anybody
      treat it as one.

      Her limit is that she was not there. Everything she has is somebody else's
      account of the day.
    quiz:
      - q: What does Naidoo refuse to let anybody treat a gap in a record as?
        a: A zero. Nothing written is not a written nothing
        wrong:
          - An error on the form, which has to be corrected before the day's paperwork can be filed
          - Evidence that the work was never done, since anything done would have been written down
          - A reason to reissue the whole day's paperwork and have every entry signed for a second time
  - id: lead4
    name: Ruth Calderón
    role: Response Desk Lead
    division: G4
    bio: |
      Sits at the desk that has to decide before the evidence is finished. Every
      hour spent making a number better is an hour the decision is not made in.

      She asks one question of any proposed piece of work: if it comes back the
      other way, does anybody do anything differently? Work that fails that test
      is work for the report, not for the response.

      Her limit is that she is paying for information with time, and the clock
      belongs to the people out at the site.
    quiz:
      - q: What does Calderón ask before funding a measurement?
        a: Whether a result the other way would change anything
        wrong:
          - Whether the instrument involved has been calibrated within the current month's schedule
          - Whether the result can be obtained and written up before the end of the working day
          - Whether anybody at the station or elsewhere has attempted the same measurement before
  - id: helper1
    name: Ben Achterberg
    role: Field Assistant
    division: G1
    bio: |
      Carries the kit, sets the stakes out and writes the times down. Has read
      every log in the station and remembers which ones disagree.
    quiz:
      - q: What is Achterberg most useful for on a disputed reading?
        a: He knows which earlier logs disagree with it
        wrong:
          - He recalibrates the station's instruments before every run and records the offsets he applied
          - He decides which of two disagreeing readings the field station reports up to the response desk
          - He signs off the day's measurements once the whole team has agreed what the numbers mean
  - id: helper2
    name: Kit Sorensen
    role: Laboratory Assistant
    division: G2
    bio: |
      Runs the routine measurements, which means they see every result before
      anybody else and notice when a run stops looking like the last one.
    quiz:
      - q: Why does running the routine measurements make Sorensen worth asking?
        a: Seeing every result in order is what makes a change visible
        wrong:
          - Routine measurements are inherently more accurate than the one-off runs done on request
          - They are the only person in the sample room permitted to operate the analysis instrument
          - They hold the calibration certificates, so nothing can be reported without going past them

  # ---- the rest of the station, added when the world-graded five were authored.
  # GREET wants a list longer than the number that has to be reached, CANVASS
  # wants a population big enough that a sample is a choice, and both want people
  # in more than one area — a round that is one walk to one place is not a round.
  - id: hand1
    name: Ines Vogel
    role: Instrument Technician
    division: G1
    bio: |
      Keeps the field station's two instruments working, which is mostly keeping
      their calibrations honest and their logs current.

      She distrusts anything that has been moved. A sensor that travelled in the
      back of a van has a zero worth checking before it has a reading worth
      believing.
    quiz:
      - q: Why does Vogel check the zero on an instrument that has been moved?
        a: Transport can shift the zero without changing anything you would notice
        wrong:
          - Moving an instrument voids its calibration certificate until an engineer re-issues it
          - Instruments read low after transport because they are colder than the room they arrive in
          - The station's insurance requires a documented check after any equipment leaves the site
  - id: hand2
    name: Owen Brathwaite
    role: Field Observer
    division: G1
    bio: |
      Walks the survey lines and writes down what he sees, in the order he sees
      it. He is the reason several of the station's odder results have a time
      against them.

      His view is that an observation nobody recorded on the day is an opinion by
      the end of the week.
    quiz:
      - q: Why does Brathwaite insist on recording an observation the same day?
        a: Memory reworks what was seen into what would make sense
        wrong:
          - Observations lose legal standing if they are entered more than a day after the event
          - The survey lines are re-walked weekly, so any older note is out of date by definition
          - Written notes are only accepted by the records office if they carry the same day's date
  - id: hand3
    name: Farida Osman
    role: Sample Custodian
    division: G2
    bio: |
      Signs samples in and out, and will not release one whose history has a gap
      in it. The gap is the interesting part.

      She has never lost an argument about a container, because the argument is
      always about a form somebody did not fill in.
    quiz:
      - q: Why will Osman not release a sample with a gap in its history?
        a: Nothing measured afterwards can say what happened during the gap
        wrong:
          - Samples degrade at a known rate, so a missing interval makes the result unusable
          - The custody form is a legal document and an incomplete one cannot be filed
          - A gap usually means the sample was frozen, which changes what it can be tested for
  - id: hand4
    name: Petar Ilić
    role: Analyst
    division: G2
    bio: |
      Runs the analyses that other people's decisions rest on, and reports the
      spread as often as he reports the number.

      He thinks the most dangerous result is one that agrees with what everybody
      expected, because nobody asks it any questions.
    quiz:
      - q: Why does Ilić treat an expected result as the dangerous one?
        a: Agreement stops people checking, so an error in it survives review
        wrong:
          - Expected results are usually produced by instruments that have not been recalibrated
          - A result matching the prediction is statistically less likely to be reproducible
          - Analysts are required to repeat any run whose outcome was predicted in advance
  - id: hand5
    name: Grace Ntuli
    role: Archivist
    division: G3
    bio: |
      Keeps the records that outlast the people who made them, which means
      keeping the conditions a record was made under alongside the record.

      A number with no method attached is, to her, a rumour with a decimal point
      in it.
    quiz:
      - q: Why does Ntuli file the method alongside the number?
        a: Without the method nobody can tell what the number is a number about
        wrong:
          - Archive standards require two documents per entry so that one can be destroyed safely
          - Methods change every few years, so the file has to show which version was current
          - A number filed on its own cannot be indexed by the records office search system
  - id: hand6
    name: Callum Reyes
    role: Records Clerk
    division: G3
    bio: |
      Enters the day's readings and queries the ones that arrive without a time,
      a place or a person against them.

      He is the last chance any of it has to be corrected while somebody still
      remembers what happened.
    quiz:
      - q: Why does Reyes query a reading that arrives with no time on it?
        a: Nothing later can reconstruct when it was taken, so it cannot be compared
        wrong:
          - Untimed readings are automatically rejected by the records database on entry
          - A missing time usually means the instrument clock had failed and the value is wrong
          - Readings are filed in the order they arrive, so an untimed one goes to the wrong week
  - id: hand7
    name: Naomi Adeyemi
    role: Duty Officer
    division: G4
    bio: |
      Takes the calls that come in before anybody has finished measuring
      anything, and decides what happens in the meantime.

      She says the hardest part is that the decision has to be made at the point
      where the evidence is thinnest, and cannot be postponed until it is not.
    quiz:
      - q: Why does Adeyemi say the decision comes when the evidence is thinnest?
        a: The moment a response is needed is before the measuring is finished
        wrong:
          - Duty officers are required to respond within an hour of any call being logged
          - Early evidence is unreliable because the instruments have not warmed up
          - The response desk is only staffed before the laboratory results are released
  - id: hand8
    name: Tobias Lindqvist
    role: Response Coordinator
    division: G4
    bio: |
      Puts people where they are needed and keeps track of who has been told
      what, which turns out to be the harder half.

      His standing complaint is that everybody remembers being told something and
      nobody remembers who told them.
    quiz:
      - q: Why does Lindqvist keep track of who has been told what?
        a: Otherwise a message everyone half-remembers is treated as confirmed
        wrong:
          - Response procedures require a signed acknowledgement from every person contacted
          - People forget instructions within the hour unless they are repeated twice
          - The coordinator is liable for any action taken by somebody who was not informed

glossary:
  - name: Calibration
    aliases: [calibrate, calibrated]
    def: Checking an instrument against something already known, so its numbers mean something.
  - name: Blank
    aliases: [blank run]
    def: A run with no sample in it. Anything it shows came from the process, not the thing measured.
  - name: Sonar
    aliases: [sonar array, the array]
    def: A set of underwater microphones and the displays that turn what they hear into a picture of frequency against time.
  - name: Common mode
    aliases: [common-mode, shared reference]
    def: An error that reaches several measurements at once because they were all computed from the same thing.
  - name: Locus
    aliases: [family of solutions]
    def: The set of parameter combinations that reproduce one measurement equally well.

# ---------------------------------------------------------------- the days
# Each mission is one working day: three stops, taken in whatever order the
# player likes. From day 3 the engine adds a fourth call revisiting an earlier
# area — you do not author that.
#
# Do not send a day into the same area twice: normalize.js turns the repeat into
# a person stop, which works, but the day reads better if you chose it.
# ---------------------------------------------------------------- the days
# 4 days, 12 stops, 1 per format in FORMATS.md. No day visits the same
# area twice, so nothing here becomes a person stop by accident.
missions:
  - title: Three instruments, one reference
    objective: Find out whether the numbers agree because they are right or because they share a source.
    briefing: Four channels agree, one gauge does not, and the bilge is still rising.
    stake: >-
      Tuesday, and the Halden site has filed a fortnight of readings that all agree with each other, which is what Ada Merrick does not like about them. The response desk wants to publish by noon; Priya Naidoo has found a signature on the closing checklist from somebody who was ashore that week. Today you establish which of the site's numbers were computed from a shared reference, account for a flow nobody has been adding up, and decide which of the closing claims can be signed off on the evidence actually present. A number that inherits somebody else's error is not wrong on its own terms, which is exactly why nobody catches it.
    takeaway: Agreement between measurements says nothing until you know what they were each computed from.
    stops:
      # ---- TRACE. The importer wants two things that are easy to leave out: at
      # least two channels sharing the target (with one there is no common mode)
      # and at least one genuinely independent channel (with none the right answer
      # is to throw everything away). It also refuses a channel whose own label
      # says "shared" — put the dependency in `depends`, or nobody opens the graph.
      - group: G1
        task: Find out what the agreeing numbers were computed from
        title: Four channels, one denominator
        place: Field Station
        scene: >
          Four of Halden's five numbers agree to within a few percent. The fifth,
          a mechanical gauge nobody has touched in a year, does not. Merrick has
          the derivation sheets and is waiting.
        guide: >-
          Open each of the five numbers to see what it was computed from. Keep the ones
          that stand on their own measurement, untick the ones whose chain runs through
          a shared step, and name that step. Four agreeing and one disagreeing is not
          four against one: if the four share a denominator, they are one number quoted
          four times.
        background:
          - >-
              Why agreement is weak evidence. Numbers derived through a common quantity move
              together whatever that quantity does. The agreement is then a property of the
              arithmetic rather than of the world, and it is the most convincing form a
              systematic error takes.
          - >-
              Why the untouched gauge is worth attention. A mechanical gauge with no shared
              electronics, no shared calibration and no shared denominator is independent by
              construction. Being the odd one out makes it suspect; being independent makes
              it valuable. Those are different facts about the same instrument.
          - >-
              What naming the source buys. Once the shared step is identified it can be
              corrected, and every dependent number moves together in a known direction.
              Discarding the disagreeing gauge instead leaves the error in place and removes
              the only thing that could have found it.
        assumes:
          - a ratio inherits the error of whatever it was divided by
          - two displays fed from one sensor are one measurement
        takeaway: Independence is a property of the measurement chain, not of how many displays report it.
        format: TRACE
        question: >-
          Everything except the mechanical gauge agrees. Open the derivations, keep what still
          stands, and name the source at fault.
        trace:
          hint: >-
            Open a channel to see what it was computed from. Tick the ones whose evidence still
            stands on its own, then name the source.
          channels:
            - { id: ratioA, label: Halden site ratio, reading: '3.0 amplitude ratio, dimensionless', depends: [vault] }
            - { id: ratioB, label: Harbour site ratio, reading: '2.1 amplitude ratio, dimensionless', depends: [vault] }
            - { id: driftC, label: Fortnight drift estimate, reading: '4 mm of horizontal drift', depends: [vault] }
            - { id: gauge, label: Mechanical gauge, reading: '0.31 bar, read off the dial', depends: [] }
            - { id: counts, label: Overnight event counts, reading: '61 events', depends: [] }
          resources:
            - { id: vault, label: 'Old vault, used as the competent-rock reference' }
            - { id: clock, label: Site timing model }
          independent: [gauge, counts]
          target: vault
          # The correction is a given, printed on the panel. Without it the answer
          # text below reasons from a factor of 1.6 that appears on no screen.
          correction:
            what: Site response of the old vault, the competent-rock reference
            was: '1.0x - assumed to be founded on competent rock'
            now: '1.6x in the working band, measured against a rock station alongside'
            effect: Every quantity divided by this station is low by that factor.
            corrected: 'The Halden ratio of 3.0 becomes about 4.8 and the Harbour ratio of 2.1 about 3.4, both relative to competent rock; the drift estimate moves with them.'
          commit: Correct it
        answerText: >-
          The old vault. It was treated as a competent-rock reference and reads 1.6 times rock in
          the working band, so every ratio computed against it is low by that factor — and the
          mechanical gauge and the event counts, which never used it, keep their evidence.
        why: >
          Three of these numbers are ratios, and a ratio is a comparison: it carries the error of
          whatever sits underneath the line. The vault was assumed to be rock and is not, so every
          quantity divided by it is wrong by the same factor and they agree with each other
          beautifully while doing it. That is what makes a common-mode error survive review —
          nothing looks inconsistent. The correction is arithmetic on exactly those three and
          nothing else: the gauge measured a pressure directly and the counts came off a separate
          network, so neither of them ever touched the bad denominator and neither should move.
      # ---- BALANCE. The trap is the last two checks: the streams must sum to the
      # total, AND the streams that are not `hidden` must NOT — otherwise leaving
      # the hidden term out still passes and the format has taught nothing.
      - group: G2
        task: Account for the whole flow, not the part that shows
        title: What the level rise leaves out
        place: Sample Room
        scene: >
          The bilge is up eight centimetres in a minute over four square metres
          of deck. The drain pump has been running the whole time. Tomas Oyelaran
          wants the leak rate, not the rise.
        guide: >-
          Reading a stream costs nothing, so read them all. Then count only what belongs
          in the total Oyelaran asked for: the water entering at the hull, before the
          pump takes any out. Eight centimetres over four square metres in a minute is
          the rise, and the pump has been running for that whole minute.
        background:
          - >-
              Why the rise is not the leak. What accumulates is what came in minus what has
              been removed. The pump was working throughout the measurement, so its
              contribution has already been subtracted from what you can see. Adding it back
              gives the inflow.
          - >-
              How the geometry enters. A depth in centimetres becomes a volume only through
              the area it sits on, and a volume becomes a rate only through the time it
              took. Four square metres and one minute are both part of the measurement, not
              context.
          - >-
              Why the leak rate rather than the level. The level says how bad it is now. The
              leak rate says whether the pumps can win and how long there is, which is what
              any decision after this one depends on.
        assumes:
          - a volume rate is a level rate multiplied by a plan area
          - what accumulates is what is left after everything already leaving has left
        takeaway: An accumulation rate is the inflow minus everything already being removed from it.
        format: BALANCE
        question: >-
          Read what you need and report the total inflow at the hull.
        balance:
          hint: >-
            Reading a stream is free. Counting it is the claim you are making about where the
            water is going.
          total: { amount: 410, unit: L/min, label: Inflow at the hull }
          streams:
            - { id: rise, label: Accumulation in the bilge, value: 320, display: '8 cm over 4.0 m2 in 1 minute = 320 L/min' }
            - { id: pump, label: Drain pump discharge, value: 90, display: 90 L/min, hidden: true, note: 'running since the alarm' }
            - { id: fw, label: Fresh-water tank level, value: 0, display: 'unchanged' }
          tolerance: 25
          commit: Report the inflow
        answerText: >-
          About 410 litres a minute — the 320 that accumulated plus the 90 the pump had already
          discharged during the same minute.
        why: >
          The level in the bilge is not the leak; it is what got past the pump. Anything already
          being removed while you were measuring has to go back into the total, and a pump that
          has been running since the alarm is easy to leave out precisely because it is not a
          reading — nothing on the panel changes when it runs. Report the 320 and the response is
          sized for a leak 2 thirds of its actual rate, which decides how many pumps are worth
          starting and, more to the point, whether starting pumps is the answer at all.
      # ---- ATTEST. Three interlocking counts: at least one critical claim
      # unbacked (or closing blind passes), no more of them than the `checks`
      # budget (or the stop is unanswerable), and at least one critical claim that
      # IS backed — without that, holding everything critical passes by reflex.
      - group: G3
        task: Close the list on evidence rather than on signatures
        title: The signature and the thing it stands for
        place: Records Office
        scene: >
          The closing checklist is signed throughout. Naidoo has the watch bill
          open beside it and has not said anything yet. There is time to verify
          three items.
        guide: >-
          Open each item on the checklist and read what actually stands behind it. Some
          are backed by an observation, some by another signature, and some by the watch
          bill saying somebody was on duty. Verify what the three checks allow, and hold
          whatever cannot be closed on the evidence present.
        background:
          - >-
              What a signature records. That somebody took responsibility for a line. Not
              that the thing was seen, tested or measured. On a closing checklist those two
              coincide most of the time, which is exactly why the exceptions are hard to
              notice.
          - >-
              Why the watch bill is beside it. It says who was where. A claim signed by
              somebody the bill puts elsewhere is not necessarily false, but it is a claim
              about what they were told rather than about what they saw.
          - >-
              Why holding is the useful outcome. Three checks against a full checklist means
              most items stay unverified, and that is fine as long as it is recorded. An
              unverified item marked as such is honest; the same item read later as closed
              is how a checklist becomes fiction.
        assumes:
          - a signature records responsibility, not a physical condition
          - an indication reports a commanded state rather than a measured one
        takeaway: A record is evidence that somebody accepted a claim, which is not evidence for the claim.
        format: ATTEST
        question: >-
          Verify what the time allows and hold whatever cannot be closed on the evidence present.
        attest:
          hint: >-
            Every one of these is signed. Verifying costs time and there is not enough of it for
            the whole list.
          checks: 3
          claims:
            - { id: hull, label: Hull valve 14 shut and locked, signedBy: Petrov, critical: true, backed: true, evidence: 'shut, locked, and witnessed at 0620' }
            - { id: bilge, label: Forward bilge dry, signedBy: Hallam, backed: true, evidence: 'dry, checked at 0640' }
            - { id: escape, label: Aft escape route clear, signedBy: Dunne, critical: true, evidence: 'obstructed since Tuesday — stores not struck down' }
            - { id: brkr, label: Breaker 2B isolated, signedBy: Okonkwo, critical: true, evidence: 'the log says isolated and the conductor reads 440 V' }
            - { id: pump, label: Drain pump tested, signedBy: Nakashima, backed: true, evidence: 'run and logged at 0700' }
            - { id: vent, label: Ventilation dampers set, signedBy: Lindqvist, evidence: 'set as recorded' }
        answerText: >-
          Hold the aft escape route and breaker 2B. Both are critical, both were signed, and
          neither has evidence that supports the claim — the route is obstructed and the
          conductor is live whatever the log says.
        why: >
          A checklist is a compression of experience, and its signatures record who accepted each
          claim at the time. That is worth having and it is not the same as the condition being
          true now. The two items that fail here fail differently: one was signed for a space
          nobody could enter, and one is contradicted by a direct measurement at the boundary,
          which beats a written record every time because it is the actual state rather than the
          reported one. Verifying the whole list is not available, so the decision that matters is
          which claims would hurt if they were wrong.

  - title: What the measurement is worth
    objective: Spend scarce evidence on the questions that change what happens next.
    briefing: The desk will fund one more measurement and wants to know which.
    stake: >-
      Wednesday, and Ruth Calderón has one slot left in the day's budget. Three proposals are on her desk and all three are good science; only one of them changes what the crew does at noon. Meanwhile the field station has a tone nobody can source and four candidate machines, and the sample room has a brightness that fits any size you like. Today you decide what to buy, isolate a cause by changing one thing at a time, and find out why a second measurement of different physics settles what a better version of the first one cannot.
    takeaway: The value of a measurement is the decision it would change, not the precision it would add.
    stops:
      # ---- VALUE. Three checks make the trap real: the board must cost more than
      # the budget, at least one option must be `decisive`, and at least two
      # distinct `axis` values must be present — buying more of the same axis is
      # the mistake, so the same axis everywhere means there is no mistake to make.
      - group: G4
        task: Buy the thing that would change the decision
        title: One slot, three good proposals
        place: Response Desk
        scene: >
          Three proposals, one funded slot, and a crew that mobilises at noon
          either way. Calderón has read all three and will not say which she
          prefers.
        guide: >-
          Two controls set the shot: the angle and the charge. The charge is not
          calibrated in anything, so change one control at a time and watch where the
          short mark lands — that is how you find out what each one does. Three marks at
          three ranges have to be hit, and the same angle will not do for all of them.
          Put a line on each.
        background:
          - >-
              Why forty-five degrees is not the answer. Forty-five maximises range for a
              given launch speed on flat ground with no air. Change the launch height, the
              drag, or the range you want, and the best angle moves — and for any range
              short of the maximum there are two angles that reach it, a low fast one and a
              high slow one, which behave very differently in wind.
          - >-
              Why one control at a time. Two unknown controls changed together give one
              landing point and no information about either. Fixing the angle and varying
              the charge, or the reverse, is the same isolation that CONTROL asks for, on a
              quay with a line thrower instead of a bench.
          - >-
              What the short mark is for. It is the cheapest place to learn: a shot that
              falls short tells you the sign and roughly the size of your error, and it
              costs one line to retrieve. Calibrating on the nearest target before
              attempting the far one is what a gunner does, and it is why the marks are at
              three ranges rather than one.
        assumes:
          - evidence is worth what it changes, not what it costs
          - a second measurement of the same kind narrows the same thing again
        takeaway: A measurement earns its cost by changing a decision that has not yet been taken.
        format: VALUE
        question: >-
          You have four hours of the day's budget. Buy what changes what the crew does at noon.
        value:
          hint: >-
            Everything here is real evidence. The question is which of it changes what happens at
            noon.
          budget: { amount: 4, unit: h }
          decision: Whether the crew enters the lower gallery at noon
          options:
            - { id: repeat, label: Repeat the surface survey, cost: 2, axis: surface concentration, reveals: 'The same value again, to a tighter uncertainty.' }
            - { id: deeper, label: Third surface transect, cost: 2, axis: surface concentration, reveals: 'Consistent with the first two.' }
            - { id: gallery, label: Lower the monitor into the gallery, cost: 3, axis: conditions where the crew will actually be, decisive: true, reveals: 'Oxygen at 17% 4 metres down, and falling with depth.' }
            - { id: archive, label: Pull the 1998 survey from the archive, cost: 1, axis: history of the site, reveals: 'The gallery was backfilled in two stages, which the plan does not show.' }
          commit: Fund it
        answerText: >-
          Lower the monitor into the gallery. It is the only measurement taken where the crew will
          be, and it is the only one whose result changes whether they go in.
        why: >
          Two of these proposals measure the surface again. They are careful and they will produce
          a tighter number about a place nobody is standing, which is the failure this decision
          exists to avoid: a measurement can be rigorous and still answer a question whose answer
          does not enter the choice. The test that separates them is whether a result the other
          way changes anything, and only the gallery reading does — a low oxygen four metres down
          stops the entry, while a third transect agreeing with the first two stops nothing. The
          archive is cheap and genuinely informative, and it still does not decide noon.
      # ---- CONTROL. `response` has to clear `noise` by more than 3×, or a trial
      # is a coin toss. Securing several machines at once is allowed and the panel
      # reports it as ambiguous, which is the teaching. The reversal is graded.
      - group: G1
        task: Make the tone follow one machine
        title: A cause, and a coincidence that looks like one
        place: Field Station
        scene: >
          A new tone appeared on the array overnight at 214 hertz. Four machines
          changed state in the same hour. Achterberg has the plant log and the
          sonar operator is waiting.
        guide: >-
          The number you are watching is the strength of the 214-hertz tone on the
          array. Four machines changed state in the hour it appeared, which makes four
          suspects and no evidence. Switching a machine asks whether the tone depends on
          it; a machine that is innocent leaves the tone where it was. Change one, run
          the measurement, put it back, then name the machine the tone follows.
        background:
          - >-
              Why the log is a list of suspects and not an answer. Four state changes in one
              hour is ordinary in a working plant, and the tone had to appear during
              somebody's hour. A record of what changed tells you where to look, and every
              one of the four would sound equally guilty written down in a report.
          - >-
              What switching actually tests. Stopping a machine removes its contribution and
              leaves everything else running, so the change in the tone is that machine's
              own share of it. Two machines stopped together answer a vaguer question —
              whether either mattered — and that answer will not survive the meeting.
          - >-
              Why the tone comes back. A cause is a thing the effect depends on, in both
              directions. Restarting the machine and watching the tone return rules out the
              ordinary alternative: that something else was drifting, settling or being
              switched somewhere else while you worked.
        assumes:
          - a controlled test changes one variable and holds the rest
          - a machinery-order tone scales with the rate of the machine producing it
        takeaway: A relationship is causal when it reverses, not when it coincides.
        format: CONTROL
        question: >-
          Four candidates, one tone. Establish which machine is producing it and prove it.
        control:
          hint: >-
            Change what you like and run the measurement. What you change is a decision; what it
            tells you depends on how many things moved.
          observable: { label: Tone at 214 Hz, unit: dB }
          held: [own speed, depth, array state]
          variables:
            - { id: tg2, label: Turbogenerator 2 }
            - { id: swb, label: Seawater pump B }
            - { id: hyd, label: Hydraulic plant }
            - { id: fan, label: Forward ventilation fan }
          truth: swb
          baseline: 74
          # Signed: securing the pump takes the tone DOWN 19 decibels.
          response: -19
          noise: 1.5
          changeVerb: secured
          run: Ask sonar for the level
          commit: Name it
        answerText: >-
          Seawater pump B. Securing it alone drops the tone 19 decibels, and restoring it
          brings the line straight back — which is what separates it from the machine that
          happened to start in the same hour.
        why: >
          Four things changed in one hour, so the log alone cannot name a cause; it can only name
          candidates. Securing several at once makes the display quieter and settles nothing,
          because a quieter display is consistent with any of them being responsible. One variable
          at a time gives a candidate, and restoring it is what turns the candidate into a cause:
          a coincidence does not come back on demand. The reversal also costs almost nothing here,
          which is worth noticing — the reason it gets skipped is not expense, it is that by then
          the answer already feels known.
      # ---- DEGENERACY. Two controls exactly. The first locus needs five points
      # and at least three of them outside the answer tolerance, or the first
      # measurement was never ambiguous and the second has nothing to collapse.
      # Both loci have to pass through the truth, or the crossing is not the answer.
      - group: G2
        task: Get a size out of a brightness
        title: Any size you like, for the right albedo
        place: Sample Room
        scene: >
          One brightness measurement, and a model with two knobs in it. Kit
          Sorensen has the thermal data on a second screen and has not brought it
          over yet.
        guide: >-
          Two knobs, one brightness measurement, and a family of settings that all match
          it. Slide along the family and see how wide it is before saying anything about
          size. The thermal data is on a second screen and has not been brought over —
          until it is, the honest answer is a range rather than a number.
        background:
          - >-
              Why one measurement cannot fix two unknowns. Brightness is the area times how
              reflective the surface is. Halve the reflectivity and double the area and the
              measurement is unchanged. That trade is the family, and it spans a factor of
              several in diameter.
          - >-
              What the thermal data does. Whatever is not reflected is absorbed and
              re-emitted as heat, so the infrared brightness depends on the same two
              quantities in a different combination. Where the two constraints cross is the
              answer.
          - >-
              Why reporting the family is not a failure. A single number derived from one
              measurement is a number the data does not contain. Saying what range fits, and
              what would narrow it, is the professional answer at that moment.
        assumes:
          - reflected brightness depends on the product of area and reflectivity
          - absorbed and reflected fractions of the incident light sum to one
        takeaway: One observable across two unknowns fixes a family of solutions, not a solution.
        format: DEGENERACY
        question: >-
          Match the brightness, then say what size it is.
        degeneracy:
          hint: >-
            Both controls change the model. The match to the measurement is the number to watch.
          observable: { label: Reflected brightness }
          controls:
            - { id: diameter, label: Diameter, min: 60, max: 600, step: 10, unit: m }
            - { id: albedo, label: Reflectivity, min: 0.03, max: 0.6, step: 0.01 }
          # The brightness locus: diameter falls as reflectivity rises, at fixed
          # brightness. Every point on it fits the measurement equally.
          locus:
            - { a: 100, b: 0.45 }
            - { a: 140, b: 0.23 }
            - { a: 180, b: 0.14 }
            - { a: 260, b: 0.067 }
            - { a: 360, b: 0.035 }
            - { a: 460, b: 0.021 }
          second:
            label: Thermal infrared flux
            apply: Bring the thermal data over
            # Thermal flux rises with area and with the absorbed fraction, so its
            # locus runs the other way and crosses the first once.
            locus:
              - { a: 120, b: 0.05 }
              - { a: 180, b: 0.14 }
              - { a: 250, b: 0.30 }
          truth: { a: 180, b: 0.14 }
          tolerance: { a: 25, b: 0.04 }
          still: [bulk density, internal strength]
          commit: Report the size
        answerText: >-
          About 180 metres, at a reflectivity near 0.14 — and that is the diameter measured, not
          the density or the strength, which are still inferred from a surface classification.
        why: >
          The brightness is the product of an area and a reflectivity, so halving one and
          quadrupling the other reproduces it exactly. That is not a noisy measurement; it is a
          measurement of one number where two are wanted, and a better telescope slides along the
          same curve. Thermal infrared breaks it because it responds to the absorbed fraction
          rather than the reflected one — the same albedo that makes an object faint makes it warm
          — so its curve runs the other way and the two cross once. What comes out is a diameter.
          The density underneath it is still an assumption wearing a number.

  - title: What the plan cannot answer
    objective: Trace a path, spend a finite pool, and locate something from constraints that do not meet at a point.
    briefing: The gym is cleared on paper, the crate holds 20 slots, and 3 stations disagree politely.
    stake: >-
      Thursday, and Priya Naidoo has three jobs that have to close before the report does. The gym next to the school is cleared on a rapid inspection that never traced a load path; the river programme has 20 laboratory slots and 6 questions that all deserve them; and the overnight event has 3 arrival times and 1 station whose clock has been drifting since the spring. Today you follow force from a roof to the ground, decide what a sampling plan is allowed not to answer, and report a location as the region it actually is.
    takeaway: A finite plan is defined as much by what it forgoes as by what it covers.
    stops:
      # ---- CHAIN. The `distractor` is required and must differ from `governing`,
      # and the governing link may not be first in the order — "the first thing in
      # the list" is answerable without reading anything.
      - group: G3
        task: Follow the force to the ground
        title: The small anchor and the large panel
        place: Records Office
        scene: >
          The gym is cleared on a rapid inspection. Naidoo has the drawings out
          and the roof-to-panel anchors are the only thing on them with no
          capacity written beside it.
        guide: >-
          Put the transfers in the order the force actually takes, from the moving panel
          to the ground. Then name the one that decides whether the path holds. The
          anchors are the only thing on the drawings with no capacity written beside
          them, which is a fact about the paperwork — the readings on each link are what
          settle which transfer governs.
        background:
          - >-
              Why a path is limited by its smallest transfer. Force handed from one element
              to the next has to be carried by every handover along the way. A large panel
              and a large roof are irrelevant if the connection between them cannot pass
              what arrives, and that is nearly always a connection rather than a member.
          - >-
              Why the anchors have no number. Connections are detailed late, sometimes on
              site, and often by somebody other than the engineer who sized the members. A
              blank on a drawing is not evidence that the anchor is weak; it is evidence
              that nobody has checked.
          - >-
              What a rapid inspection can and cannot say. It clears the obvious: no
              collapse, no visible distress, nothing hanging. It does not open a connection,
              and this whole stop is about the difference between a building that looks
              intact and a load path that has been demonstrated.
        assumes:
          - lateral force reaches the ground through a continuous set of physical connections
          - a chain of transfers is limited by the weakest one the path requires
        takeaway: A load path is governed by its weakest required transfer, whatever the elements either side of it can carry.
        format: CHAIN
        question: >-
          Put the transfers in the order the force takes, then name the one that decides whether
          the path holds.
        chain:
          hint: >-
            Every interface has to be there. A path with a gap in it is not a path.
          links:
            - { id: diaphragm, label: Roof deck acting as a diaphragm, transfers: 'roof inertia into the plane of the roof' }
            - { id: collector, label: Collector member, transfers: 'diaphragm shear along to the resisting line' }
            - { id: anchor, label: Roof-to-panel anchor, transfers: 'inertia across the joint between roof and wall' }
            - { id: panel, label: Precast wall panel, transfers: 'in-plane shear down to its base' }
            - { id: footing, label: Foundation, transfers: 'base shear into the ground' }
          order: [diaphragm, collector, anchor, panel, footing]
          governing: anchor
          distractor: panel
          commit: Name the governing transfer
        answerText: >-
          Roof deck, collector, roof-to-panel anchor, wall panel, foundation — governed by the
          anchor, the one transfer in the path with no tested capacity behind it.
        why: >
          Force does not travel from a roof to the ground by being near it. Every interface has to
          carry what the one above it delivers, and the path is limited by whichever required
          transfer is weakest — which has nothing to do with the size of the elements on either
          side. The panel is the largest thing here by a wide margin and it is not the question;
          if the anchor cannot pass the roof and wall inertia across the joint, the panel's own
          strength has nothing to act against and a heavy element is left unsupported out of
          plane. That is why the item with no number beside it is the item to test.
      # ---- ALLOCATE. Four counts to satisfy: the board costs more than the pool,
      # the protected items fit, at least one answer is `required`, and at least
      # one is NOT — a board where every answer is required has removed the
      # decision the format exists to make.
      - group: G4
        task: Spend 20 slots on a plan you can defend
        title: What 20 bottles cannot ask
        place: Response Desk
        scene: >
          A crate with 20 laboratory slots in it, the river map on the wall,
          and the partition model's prediction pinned beside it. Nobody has
          written down a recommended plan.
        guide: >-
          Three proposals, one funded slot, and a crew that mobilises at noon whatever
          you decide. Open each and ask what the crew would do differently at noon
          depending on how it comes out. A proposal whose result changes nothing before
          mobilisation has spent the four hours on something you could have bought
          tomorrow.
        background:
          - >-
              What makes a purchase decisive. Two possible results that lead to different
              actions. Calderón will not say which she prefers because the preference is not
              the point — the question is which result could change the plan, and that is a
              property of the proposal rather than of anybody's judgement.
          - >-
              Why the mobilisation time is the constraint. The crew leaves at noon either
              way, so information arriving afterwards is information about a decision
              already taken. The whole value of the slot is that it lands before the trucks
              do.
          - >-
              Why all three are good. They are meant to be. A choice between one good and
              two poor proposals tests nothing; the skill is separating valuable from
              decisive when everything on the table is worth doing.
        assumes:
          - a contaminant divides between water, suspended particles and sediment
          - a measurement without a blank cannot be defended afterwards
        takeaway: Sampling is experimental design under a budget, and every feasible plan forgoes a question.
        format: ALLOCATE
        question: >-
          20 slots. Build the plan, and know which of the four questions it leaves open.
        allocate:
          hint: >-
            Nothing here is a wrong choice on its own. What a plan cannot answer is the price of
            what it can.
          pool: { amount: 20, unit: slots, mode: scalar }
          items:
            - { id: intake, label: Intake water, cost: 4, protected: true, note: 'the release decision needs it' }
            - { id: qc, label: Blanks and replicates, cost: 3, note: 'nothing is defensible without them' }
            - { id: upstream, label: Upstream water, cost: 3 }
            - { id: downstream, label: Downstream water, cost: 3 }
            - { id: solids, label: Suspended solids, cost: 4 }
            - { id: cores, label: Sediment cores, cost: 6 }
            - { id: second, label: A second time point at every station, cost: 5 }
          answers:
            - { question: 'Is the intake above the release criterion today?', requires: [intake, qc], required: true }
            - { question: 'Is it travelling dissolved or on particles?', requires: [solids, downstream] }
            - { question: 'Is there a reservoir that keeps releasing after the plume passes?', requires: [cores] }
            - { question: 'Is the concentration rising or falling?', requires: [second] }
          commit: Commit the crate
        answerText: >-
          Any plan that keeps the intake and the QC and stays inside 20 slots is defensible —
          and it will answer 2 of the remaining 3 questions at most. Naming which one you
          left open is the answer.
        why: >
          Every line on this crate is worth sampling, which is exactly why a list of options
          cannot teach the decision: read one at a time they are all justified. A finite inventory
          makes the trade concrete — the sediment cores and the second time point together cost
          more than what is left after the protected slots, so a plan that asks whether the
          concentration is rising cannot also ask whether there is a reservoir underneath it. The
          error worth avoiding is not choosing badly. It is finishing the programme without having
          noticed that a question was silently dropped, and reporting reassurance built on the
          phase nobody sampled.
      # ---- TRIANGULATE. Every station's authored `distance` must put its ring
      # through the truth within tolerance, or the region does not contain the
      # answer; and a `systematic` must be larger than the tolerance, or
      # correcting it changes nothing and the player learns it did not matter.
      - group: G1
        task: Report where it was, not how far
        title: Three circles and an area
        place: Field Station
        scene: >
          Three stations, three arrival separations, and a regional map. The
          ridge station's clock has been drifting since the spring and there is a
          correction sheet for it on the bench.
        guide: >-
          Switching a station in draws the region its own measurement permits — a ring,
          not a point, because an arrival separation fixes a distance and says nothing
          about direction. Two rings cross in two places; three settle it. One station's
          clock has been drifting, and there is a correction sheet for it on the bench,
          so decide what to do about that before you commit. Then click the map where
          you think the source is.
        background:
          - >-
              Why one station gives a ring. What is measured is when the signal arrived
              relative to another station, which fixes how much further it travelled — a
              distance, with no information about bearing. Every point at that distance is
              equally consistent, and that set of points is the ring you see drawn.
          - >-
              Why the third station matters. Two rings intersect in two places, and both are
              consistent with everything measured so far. A third ring picks one of them,
              and the size of the region where all three overlap is the position
              uncertainty. That region, not its centre, is what a report should describe.
          - >-
              What a systematic does, and why it is not noise. A drifting clock offsets one
              station's arrival time by the same amount every time, so its ring is drawn in
              the wrong place — consistently. More measurements from that station will not
              average it away; only the correction will. That is the difference between an
              error you can beat with statistics and one you have to know about.
        assumes:
          - two wave types travelling at different speeds separate further with distance
          - a location computed from arrival times inherits any error in those times
        takeaway: One station gives a distance, three give a region, and a timing error moves the whole region.
        format: TRIANGULATE
        question: >-
          Switch the stations in, decide what to do about the ridge clock, and report the position.
        triangulate:
          hint: >-
            Switching a station in draws what its own measurement permits. Click the map to report
            where you think it is.
          unit: km
          stations:
            - { id: upper, label: Upper Town, x: 0, y: 0, distance: 33.9, observation: 'S–P 4.0 s' }
            - { id: bay, label: Bay Road, x: 11, y: -4, distance: 30.9, observation: 'S–P 3.7 s' }
            - { id: ridge, label: Ridge, x: -62, y: 38, distance: 87.1, observation: 'S–P 10.4 s' }
          truth: { x: 24, y: 24 }
          tolerance: 6
          systematic:
            id: ridgeclock
            label: Apply the ridge station clock correction (−0.6 s)
            appliesTo: ridge
            delta: 14
          commit: Report the position
        answerText: >-
          Around 24 east, 24 north, as a region several kilometres across — and only after the
          ridge clock correction, which moves that station's ring 14 kilometres.
        why: >
          One station's arrival separation says how far the source was. It says nothing about
          direction, so on its own it leaves a whole ring. Three rings intersect, and what they
          intersect in is an area, not a point. Reporting a coordinate claims a precision the
          arrival times do not support, and somebody downstream will treat it as certain. The
          clock matters because the calculation runs on times, not on waveforms. A station biased
          by six tenths of a second draws its ring in the wrong place. Its own record looks
          perfectly normal, and the intersection moves with it.

  - title: Before the number moves
    objective: Judge a spread against a limit, measure what you changed, and write the rules before the data arrives.
    briefing: Calderón wants the response board signed before tonight's update, not after it.
    stake: >-
      Friday, and three decisions have to be made in the order that makes them possible. The entry solution is a distribution and the corridor is two and a half degrees wide; the deflection was delivered on Tuesday and nobody has yet said what it did; and the public-response thresholds have to exist before tonight's orbit update rather than after it. Calderón will hold you to whichever rules you write. Today you narrow a spread instead of moving it, spend the tracking to find out what actually happened, and set thresholds against lead times that cannot be compressed.
    takeaway: A rule written after the number moves is not a rule, and an action nobody measured is not a result.
    stops:
      # ---- CLOUD. The importer computes both ends: applying every `shift` and no
      # `narrow` must fall short of `pass`, and applying everything must clear it.
      # Without the first the player learns that re-centring works.
      - group: G2
        task: Get the distribution inside the corridor
        title: Moving the dot and moving the cloud
        place: Sample Room
        scene: >
          The corridor runs 5.3 to 7.7 degrees. The current solution sits at 6.9
          with 9 tenths of a degree on it, and a fifth of the trajectories are
          outside.
        guide: >-
          You drive the round yourself. Every gate is lit and none is marked as next,
          because the order is the answer: work out which step has to come before which,
          and drive them in that sequence. The clock is only a clock — what is graded is
          the order you took, not how fast you took it. Take the gates in the order the
          sample actually has to move through them.
        background:
          - >-
              Why an order exists at all. Each station either changes the sample or measures
              it, and a measurement is only meaningful on a sample that has had everything
              before it done and nothing after it. Weigh it after drying and the number
              means one thing; weigh it before and it means another. So the sequence is not
              a convention — it is what makes each number interpretable.
          - >-
              Why nothing marks the next gate. A route that lights up in order tests whether
              you can follow instructions. This one tests whether you know why the order is
              what it is, which is the thing that survives a day when the instructions are
              missing or wrong.
          - >-
              Why the clock is not the grade. Driving fast in the wrong order arrives with
              the work undone, and a laboratory that rewards speed over sequence produces
              numbers nobody can use. The time is there because a round has to fit in an
              afternoon, not because it is being scored.
        assumes:
          - a state estimate is a distribution over what the measurements permit
          - the limits of a corridor come from survivability, not from navigation
        takeaway: Re-centring moves the whole distribution; only new information makes it narrower.
        format: CLOUD
        question: >-
          Bring the entry solution inside the corridor, place the bars to report the middle
          and its one-sigma uncertainty, and say when it is ready.
        cloud:
          hint: >-
            The band is what the measurements permit, not what is most likely. Everything in it is
            a trajectory you might actually be on.
          bounds: { min: 5.3, max: 7.7, unit: deg, label: Entry flight-path angle }
          centre: 6.9
          spread: 0.9
          pass: 0.97
          seed: 17
          costUnit: h
          actions:
            - { id: retarget, label: Retarget the nominal to corridor centre, effect: shift, amount: 1, cost: 1 }
            - { id: trim, label: Trim correction, effect: shift, amount: 0.5, cost: 2 }
            - { id: pass1, label: One more tracking pass, effect: narrow, amount: 0.62, cost: 4 }
            - { id: pass2, label: A second tracking pass, effect: narrow, amount: 0.72, cost: 4 }
          commit: Declare it ready
        answerText: >-
          Both tracking passes. Re-centring alone leaves better than 1 trajectory in 20
          outside the corridor; narrowing the spread is the only thing that moves that number.
        why: >
          The nominal angle is the one place the vehicle is least likely to be. Re-targeting it
          slides the whole distribution across without changing its width. The fraction outside
          the corridor barely moves; the trajectories that were long become shallow instead. What
          is being asked is not where to aim but how much the measurements permit, and only new
          tracking reduces that. It costs hours the day would rather spend elsewhere. That is the
          real decision, because the corridor is a survivability limit and does not negotiate.
      # ---- VERIFY. `truth` must sit inside the prediction range, and some
      # prediction in that range must fall outside `passRatio` — otherwise every
      # prediction passes and nothing is being tested. The measurement is
      # deliberately skippable: reporting without it is a distinct failure.
      - group: G3
        task: Find out what the impact actually did
        title: A confirmed impact is not a confirmed deflection
        place: Records Office
        scene: >
          The impactor arrived on Tuesday and the confirmation is on the wall.
          The ejecta enhancement was quoted as somewhere between one and five.
          Three tracking passes remain in the budget.
        guide: >-
          Lock a predicted period change before committing the impact, and it cannot be
          edited afterwards. Then run it, then spend one of the three tracking passes to
          find out what actually happened. The enhancement was quoted as somewhere
          between one and five, so your prediction is a range with an assumption in it —
          say which.
        background:
          - >-
              Why a confirmed impact is not a confirmed deflection. Arriving is a fact about
              the spacecraft. Moving the target is a fact about momentum, and most of the
              momentum transfer comes from material thrown off the surface, which nobody has
              measured for this body.
          - >-
              What an enhancement between one and five means. One means the impactor's own
              momentum and nothing more. Five means the ejecta carried four times as much
              again. That range is the difference between a demonstration and a technique,
              and only the tracking pass can narrow it.
          - >-
              Why the prediction is locked. With the measurement in hand, an enhancement can
              be chosen to fit and the prediction will appear to have been right. Committing
              to the range first is what makes the pass capable of measuring the one
              quantity the mission existed to measure.
        assumes:
          - momentum leaving a surface as ejecta carries some of the transferred impulse
          - an orbital period change is measurable by tracking
        takeaway: An intervention is verified by measuring what it changed, not by confirming that it happened.
        format: VERIFY
        question: >-
          Predict the period change, commit the impact, and report what happened.
        verify:
          hint: >-
            Lock a prediction before the intervention. Nothing about it can be changed afterwards,
            which is the point of making it first.
          prediction: { label: Predicted change in orbital period, unit: min, min: 2, max: 24, step: 0.5 }
          truth: 14.5
          passRatio: [0.6, 1.6]
          intervention:
            label: The kinetic impactor
            note: 610 kg at 6.1 km/s, closing on the leading hemisphere.
            outcome: Impact confirmed. Ejecta plume observed for 19 minutes.
          measurement:
            label: Post-impact orbital period
            note: Three tracking passes, refit against the pre-impact solution.
            cost: 3
            costUnit: passes
          unmeasuredMoral: >-
            The impactor arrived, the plume was photographed, and the orbit was never re-measured.
            Nothing in that sequence establishes that the asteroid moved.
          commit: Report the deflection
        answerText: >-
          Around 14 and a half minutes — but only the post-impact tracking establishes it.
          A confirmed impact with no measured orbit is a confirmed impact and nothing else.
        why: >
          The spacecraft's own momentum is known to a few percent. What is not known is how much
          more the ejecta carried away, and quoting that as a single number rather than the factor
          of several it actually is turns an honest uncertainty into a false prediction. Both
          halves of the error are ordinary; the failure that is specific to this decision is
          finishing without measuring. Confirmation of impact is confirmation of an event, not of
          an effect, and if the tracking budget goes on refining the pre-impact orbit there is
          nothing left to compare it against — the campaign then produces a photograph instead of
          a result.
      # ---- TRIGGER. The scale must reach above the stream's highest value, or
      # every threshold fires and no rule can be written badly; and for each stage
      # some update must arrive with its lead time still in hand, or the stage
      # cannot be got right.
      - group: G4
        task: Write the thresholds before tonight's update
        title: Rules, and the lead time they need
        place: Response Desk
        scene: >
          The response board is blank. The current probability is one in two and
          a half thousand, the next update lands tonight, and Calderón wants the
          board signed before it does.
        guide: >-
          One rule, set on the probability scale and signed before tonight's update exists. The
          evacuation takes fourteen days from the moment it is ordered, and only the early updates
          arrive with that much time left. Set the line low enough that one of them crosses it, and
          high enough that it would not have been crossed by an object which turned out to be
          nothing.
        background:
          - >-
              Why the board is signed first. A threshold moved while the updates come in is
              not a threshold, it is a description of what somebody has already decided. The
              signature is what makes tonight's actions attributable to a rule rather than to
              whoever happened to be at the desk.
          - >-
              What lead time is, and why every stage has a different one. An advisory can be
              published in an afternoon; an evacuation order cannot. The lead time is how
              long the action takes to arrive once it is called, so a stage set close to the
              end of the campaign starts something that cannot finish — worse than no rule,
              because it is a rule somebody trusted.
          - >-
              Why a line can also be drawn too early. A stage that fires on a reading which
              had shown nothing is a standing order, not a rule: it would have fired on any
              campaign whatever the object did. Both failures are graded, and they look
              nothing alike from the desk.
          - >-
              What the schedule is for. The updates arrive on a known timetable even though
              their contents are unknown, so the real decision is which update you want each
              stage to act on — and then the number that puts it there.
        assumes:
          - a probability is a statement about knowledge rather than about the object
          - a staged response has a lead time that cannot be compressed
        takeaway: A rule written before the data is a decision; the same rule written afterwards is a reaction.
        format: TRIGGER
        question: >-
          At what impact probability do you begin the staged evacuation, given it needs fourteen
          days?
        trigger:
          hint: >-
            Set the line on the probability scale, then release the board. The updates arrive afterwards
            and your own rule decides what happens.
          scale:
            label: Impact probability
            unit: '%'
            min: 0
            max: 12
            step: 0.05
            anchors:
              - { at: 0.04, means: 'one chance in two and a half thousand — the routine end of the risk list' }
              - { at: 2.5, means: 'one chance in forty, and the corridor is down to two provinces' }
          objective: >-
            The evacuation is ordered while the fourteen days it needs are still available.
          rehearsal:
            note: the 2029 object, worked at the same range
            stream:
              - { value: 0.02, hoursLeft: 528 }
              - { value: 0.09, hoursLeft: 432 }
              - { value: 0.4, hoursLeft: 312 }
              - { value: 0.12, hoursLeft: 240 }
              - { value: 0.05, hoursLeft: 168 }
          conditions:
            - { id: evac, label: Begin staged evacuation, leadHours: 336, owner: the prefecture, action: 'open the evacuation order', window: { min: 0.3, max: 0.5 } }
          stream:
            - { at: day 0, value: 0.04, hoursLeft: 528, update: '1 in 2500, 11 days of arc' }
            - { at: day 4, value: 0.32, hoursLeft: 432, update: '1 in 310 after radar; the nominal miss moves away' }
            - { at: day 9, value: 2.5, hoursLeft: 312, update: '1 in 40; the corridor narrows to 2 provinces' }
            - { at: day 15, value: 0.011, hoursLeft: 168, update: '1 in 9000 after the fourth tracking pass' }
          release: Release the board
          commit: Stand by the board
        answerText: >-
          Order the evacuation around 0.3 %. Only the first two updates arrive with the fourteen days
          it needs, so a line at a number that merely sounds serious fires on day 9 with 312 hours
          left and the order can no longer be carried out.
        why: >
          Two ways of getting this wrong look nothing alike and cost the same. A threshold set too
          high never fires, and the stage simply does not happen. A threshold set at a sensible
          number fires on the day 9 update with 300 hours left, which is a correct
          rule for an action that needed 336 — so the rule is satisfied
          and the evacuation is already impossible. The day 15 collapse to 1 in 9000
          does not make the day 9 decision a mistake, and the board is what makes that
          arguable afterwards, because it was signed before anybody knew.

  - title: Which number is carrying the error
    objective: Find what actually dominates an uncertainty, and what survives an assumption moving.
    briefing: Three jobs where the obvious quantity is not the one that decides anything.
    stake: >-
      Monday, and Ada Merrick has an energy figure quoted to three significant figures that nobody can defend. The radius is measured, the density is inferred, and the two are being treated as though they were the same kind of number. Meanwhile the remediation board has four options that are only ranked at one value of a containment endurance nobody measured, and the subsidence survey has two fits with a tenth of a millimetre between them. Today you find which input carries the uncertainty, which option survives the assumption moving, and which fit you would be willing to propagate.
    takeaway: A quantity is only as good as the widest thing it was built from.
    stops:
      # ---- PROPAGATE. Two checks make it a lesson rather than a shortcut: the
      # dominant term has to be the widest contribution (exponent × fractional
      # width, which the importer computes), and it must NOT be the term with the
      # largest exponent — otherwise ranking by exponent gets it right and the
      # arithmetic never has to be done.
      - group: G1
        task: Decide which measurement is worth buying
        title: The exponent is not the whole story
        place: Field Station
        scene: >
          The energy figure is on the board to three significant figures. Merrick
          has the three inputs it was built from beside it, each with what it is
          actually known to, and one measurement slot left in the day.
        guide: >-
          The number to hold is the room's temperature, and the trim heater is the only
          thing you can push with. Nothing tells you which way it pushes or how hard, so
          find that out early — while the band you have to stay inside is still wide. It
          narrows as the run goes on, and the disturbances arrive whether or not you are
          ready. Keep the room inside the band for the quarter of an hour.
        background:
          - >-
              Why the band narrows. A mass comparison gets more sensitive as it settles, so
              the same temperature error matters more at the end than at the beginning. The
              band is the tolerance the comparison can absorb at that moment, which is why a
              run can be comfortable for ten minutes and unrecoverable in the last two.
          - >-
              Why you should learn the control before you need it. A heater has a delay: it
              changes the rate at which the room warms, not the temperature itself, so a
              correction applied when you are already outside the band arrives late. Nudging
              it once early, and watching what happens, converts an unknown control into a
              known one at the cheapest moment.
          - >-
              What the propped door is doing there. Every disturbance in this run is
              something ordinary in a working building — a door, a lamp, somebody in the
              corridor. None of them announce themselves, and none of them wait. Holding a
              quantity steady in a room full of other people's work is the actual job.
        assumes:
          - fractional uncertainties combine weighted by the power each term is raised to
          - a measured quantity and an inferred one are different kinds of number
        takeaway: A term's contribution is its own width times its exponent, so a badly known number with no power over it can dominate a well-known one cubed.
        format: PROPAGATE
        question: >-
          One measurement is affordable. Which of these is carrying the uncertainty in the energy?
        propagate:
          hint: >-
            Each term contributes its own width times the power it is raised to. The bar is that
            contribution.
          output: { label: Impact energy, unit: J }
          costUnit: h
          budget: 2
          inputs:
            - { id: radius, label: Radius, value: 90, unit: m, sigmaFrac: 0.08, exponent: 3 }
            - { id: density, label: Bulk density, value: 2600, unit: kg/m3, sigmaFrac: 0.45, exponent: 1 }
            - { id: speed, label: Entry speed, value: 16.4, unit: km/s, sigmaFrac: 0.02, exponent: 2 }
          improvable:
            - { id: radius, label: One more radar pass, cost: 1, newSigmaFrac: 0.03 }
            - { id: density, label: Bulk sampling at two depths, cost: 2, newSigmaFrac: 0.12 }
            - { id: speed, label: Refit the arc, cost: 1 }
          dominant: density
          commit: Report the range
        answerText: >-
          The density. It is raised to the first power and known to 45%, which
          outweighs a radius cubed and known to 8 — so the sampling is the measurement worth
          buying, and the energy is a range rather than a figure.
        why: >
          A term contributes its exponent multiplied by its own fractional width. The radius is
          cubed, which is the part everybody sees, and it is known well enough that 3 times
          8% is still smaller than 1 times 45. Buying another radar pass
          therefore improves the number that was already good and moves the total almost not at
          all. What makes this worth catching is that the shortcut — rank by exponent — is
          reasonable, teachable and produces exactly the wrong answer here. The density is also
          the term nobody can measure directly from orbit, which is why it stays wide.
      # ---- STRESS. The board must have exactly one candidate feasible across the
      # whole range, and it must NOT be the one that wins on `optimiseOn` at the
      # nominal — otherwise choosing well costs nothing and the slider is scenery.
      - group: G2
        task: Choose the option that survives the assumption moving
        title: Best at the nominal, and nowhere else
        place: Sample Room
        scene: >
          Four remediation options are ranked on the board, all at one figure for
          how long the containment holds. Tomas Oyelaran has the range that figure
          actually came with and has said nothing about it.
        guide: >-
          The band is every entry angle the tracking permits — a fifth of it currently
          outside the corridor. Four actions are available, and they do two different
          kinds of thing to the band: some move it, some change how wide it is. Try them
          and watch the centre and the width separately. Then say when the solution is
          ready, which is a claim about the whole band rather than its middle.
        background:
          - >-
              What the band is, exactly. It is not a probability of being right about one
              number: it is the set of trajectories the measurements cannot rule out.
              Everything inside it is a trajectory this vehicle might actually fly, which is
              why a criterion is written as a fraction of the band inside the corridor
              rather than as a best estimate.
          - >-
              Two kinds of action. Retargeting and trimming move where the band sits. A
              tracking pass adds information and narrows it. A band whose width is wider
              than the corridor cannot be rescued by moving it, however good the centre
              looks — and a display that reports only the centre will show that rescue
              happening.
          - >-
              Why readiness is part of the answer. Actions cost, and there is no
              configuration in which the band is a point. So the decision has two halves:
              which work to buy, and when what you have is inside the corridor by enough to
              commit.
        assumes:
          - an assumption stated as a range is not a value
          - an option is only available while the conditions it needs still hold
        takeaway: A choice that is only best at the nominal is a choice that has not been tested.
        format: STRESS
        question: >-
          Move the endurance through its range, then choose the option you would commit to.
        stress:
          hint: >-
            The endurance has a range because nobody measured it exactly. Move it through the
            range before you choose.
          assumption:
            label: Containment endurance
            unit: h
            min: 58
            max: 94
            nominal: 78
            step: 1
          criteria:
            - { key: hours, label: Time to complete, unit: h }
            - { key: cost, label: Cost, unit: k }
            - { key: residual, label: Left behind, unit: kg }
          candidates:
            - { id: direct, label: Direct excavation }
            - { id: hybrid, label: Staged excavation with an interim cap }
            - { id: flush, label: In-place flushing }
            - { id: slow, label: Slow biological treatment }
          scores:
            direct: { hours: 58, cost: 210, residual: 4 }
            hybrid: { hours: 71, cost: 160, residual: 9 }
            flush: { hours: 91, cost: 95, residual: 31 }
            slow: { hours: 88, cost: 70, residual: 22 }
          # The hours of containment each option needs to remain possible at all.
          feasible:
            direct: 62
            hybrid: 54
            flush: 88
            slow: 84
          optimiseOn: hours
          robust: hybrid
          commit: Commit the choice
        answerText: >-
          The staged excavation. It is not the fastest at the nominal and it is the only one still
          possible at the pessimistic end of the endurance range, which is the end nobody
          measured away.
        why: >
          At 78 hours the direct excavation finishes first and looks like the obvious
          call. The endurance was never 78 hours; it was a range with 78 in
          the middle of it, and at the low end the direct option needs more containment than there
          is. What the slider shows is that three of the four options are conditional on an
          assumption holding, and the ranking everybody was reading is a ranking of what happens
          if it does. Choosing the staged option costs 13 hours and buys the property that
          the plan does not have to be abandoned partway.
      # ---- RESIDUAL. The lowest-RMS fit must be the wrong one and must be marked
      # `structured`, or "take the best number" is correct and nobody looks at the
      # field.
      - group: G3
        task: Say which fit you would propagate
        title: A pattern is not an outlier
        place: Records Office
        scene: >
          Three fits of the same subsidence survey are on Priya Naidoo's screen,
          within two hundredths of a millimetre of each other on the summary
          statistic. The residuals are plotted where each marker actually sits.
        guide: >-
          Three fits, and their summary statistics sit within two hundredths of a
          millimetre of each other. That number cannot choose between them. The residual
          field can: each stick is one marker, drawn where it actually sits. Look at all
          three before choosing, and propagate the fit whose leftovers look like nothing
          in particular.
        background:
          - >-
              Why the summary statistic cannot decide. It adds up how large the misses are
              and discards where they were. Two fits can miss by the same total, one
              scattering its misses at random and the other getting a whole region wrong in
              the same direction — and only the second is missing a term.
          - >-
              What structure in residuals means. Leftovers that rise across a corner of the
              survey, or that all lean one way near a boundary, say the model has not
              accounted for something real. Noise is what remains when the model is
              complete; a pattern is a message about what it lacks.
          - >-
              Why the lowest number is a trap. Fits are compared by statistic because it
              tabulates neatly, and the most flexible model usually wins on it while
              performing worst on next season's data. Choosing on the field is choosing on
              whether the model is right.
        assumes:
          - a complete model leaves residuals that look like noise
          - a fitted parameter can absorb a systematic without removing it
        takeaway: A low summary statistic with a pattern under it hides a systematic that will bias every later prediction the same way.
        format: RESIDUAL
        question: >-
          Look at each field before you choose. Which of these fits would you propagate forward?
        residual:
          hint: >-
            Each stick is one marker, drawn where it sits on the site. Up is a positive residual,
            down a negative one.
          fits:
            - id: filed
              label: As filed
              rms: 0.21
              structured: true
              residuals:
                - { x: -2, y: -2, value: 0.24 }
                - { x: 0, y: -2, value: 0.22 }
                - { x: 2, y: -2, value: 0.25 }
                - { x: -2, y: 2, value: -0.19 }
                - { x: 0, y: 2, value: -0.2 }
                - { x: 2, y: 2, value: -0.23 }
            - id: tilt
              label: With a tilt term fitted
              rms: 0.17
              structured: true
              residuals:
                - { x: -2, y: -2, value: 0.18 }
                - { x: 0, y: -2, value: 0.17 }
                - { x: 2, y: -2, value: 0.2 }
                - { x: -2, y: 2, value: -0.15 }
                - { x: 0, y: 2, value: -0.16 }
                - { x: 2, y: 2, value: -0.18 }
            - id: levelled
              label: After re-levelling the benchmark
              rms: 0.19
              residuals:
                - { x: -2, y: -2, value: 0.2 }
                - { x: 0, y: -2, value: -0.17 }
                - { x: 2, y: -2, value: 0.06 }
                - { x: -2, y: 2, value: -0.21 }
                - { x: 0, y: 2, value: 0.14 }
                - { x: 2, y: 2, value: -0.09 }
          accept: levelled
          commit: Accept this fit
        answerText: >-
          The re-levelled fit, at 0.19. The tilt term scores better and its residuals still change
          sign across the site, which means it absorbed the benchmark error into a parameter
          rather than removing it.
        why: >
          Two of these three leave residuals that are positive on one side of the site and
          negative on the other. That is not scatter; it is a quantity the model does not contain,
          and adding a free parameter that soaks it up improves the summary statistic while
          leaving the cause in place. It will then bias every extrapolation in the same direction,
          quietly, because nothing about the fit looks wrong afterwards. The re-levelled fit
          scores worse and its residuals change sign at random, which is what a complete model
          produces. One large residual would be a bad marker; six small ones in a pattern are a
          cause.

  - title: What you take yourself
    objective: Decide what command changes first, fly a plan with no damping, and measure your own blind spot.
    briefing: Four conditions at once, a trolley that will not stop, and a network that never sees one direction.
    stake: >-
      Tuesday, and four conditions arrive on Ruth Calderón's desk inside a minute. One of them is loud and none of the loud ones is the one with a margin running out. In the flooded gallery the survey trolley runs on a rail with nothing to slow it down, and the last operator stopped the motor at the mark and watched it carry on past. Kit Sorensen has the injection results for the monitoring network. Today you decide what you keep, what you hand over and with what condition, and what a network is failing to see at all.
    takeaway: What decides an order is a margin closing on something irreversible, not which alarm is loudest.
    stops:
      # ---- DELEGATE. Exactly one problem may be rising AND irreversible, or there
      # is no first; and at least one must be `loud` and stable, or the alarm and
      # the priority are the same thing and there is nothing to get wrong.
      - group: G4
        task: Take one condition and hand over the rest
        title: The loudest is not the first
        place: Response Desk
        scene: >
          Four conditions, one watch team, and a clock that runs whether or not
          anybody has decided. Ruth Calderón will take whichever one you leave
          her, and she wants the others owned.
        guide: >-
          Write each stage's threshold on the board before releasing it, and once
          released the numbers cannot be moved. The next update lands tonight, and every
          action a stage starts takes time to finish. Set the thresholds so each action
          completes before the situation it was written for arrives, then stand by what
          the board does.
        background:
          - >-
              Why a probability of one in two and a half thousand is not the trigger. It is
              the current state, and it will move with tonight's update. Thresholds are
              about what you will do at values you have not seen yet, which is exactly why
              they can be set calmly now and not later.
          - >-
              What lead time does to a threshold. An action that takes two weeks to complete
              must start at a probability that will still be two weeks early. Setting the
              trigger at the level where the action is needed is setting it at the moment it
              should already have been finished.
          - >-
              Why signing before the update. A threshold adjusted after seeing a number is
              not a rule; it is a justification. Calderón wants the board signed tonight
              because that is the difference between a policy and a series of reactions.
        assumes:
          - a trend and a rate say more than a current value
          - an instruction without a return condition produces no report until it is too late
        takeaway: A handover is an owner, a first action and a condition that brings them back; two of the three is nobody watching it.
        format: DELEGATE
        question: >-
          Which do you change first, and who has the others?
        delegate:
          hint: >-
            One of these you deal with yourself. Everything else goes to somebody, with a first
            action and a condition that brings them back.
          team:
            - { id: merrick, label: Merrick }
            - { id: oyelaran, label: Oyelaran }
            - { id: naidoo, label: Naidoo }
            - { id: achterberg, label: Achterberg }
          firstActions:
            - { id: isolate, label: isolate at the boundary }
            - { id: slow, label: reduce the rate and buy time }
            - { id: measure, label: take an independent reading }
            - { id: stand, label: stand by and log }
          problems:
            - id: gallery
              label: Groundwater rising toward the gallery sill
              trend: rising
              rate: 40 mm/h against 300 mm of freeboard
              consequence: once it is over the sill the records below cannot be recovered
              irreversible: true
              # Nobody else can weigh the records against the water; the other
              # three are a phone call, a bund and a taxi.
              delegable: false
            - id: alarm
              label: Fire panel in continuous alarm
              trend: stable
              rate: unchanged for 20 minutes
              consequence: a known fault on a detector head, logged twice this month
              loud: true
            - id: spill
              label: Bunded spill in the yard
              trend: rising
              rate: 2 L/min inside a 400 L bund
              consequence: contained, and cleanup cost rises with volume
            - id: cut
              label: Contractor with a cut hand
              trend: stable
              rate: bleeding controlled
              consequence: needs transport within the hour
          first: gallery
          commit: Take the watch
        answerText: >-
          Take the groundwater yourself. It is the only one whose margin is closing on something
          that cannot be undone, and everything else goes out with an owner, a first action and a
          condition that brings them back.
        why: >
          The fire panel is the loudest thing in the building and it has been stable for 20
          minutes on a fault that is already in the log. The spill is rising and it is inside a
          bund, so what it costs is money and time rather than an option. The groundwater is the
          only condition where waiting removes a choice: over the sill, the records are gone and
          no amount of later effort brings them back. That is what puts it first — not the rate,
          not the noise, but a margin closing on something irreversible. Everything else can be
          somebody else's if they are told when to come back.
      # ---- FLY. Two checks: some pulse and braking angle inside the ranges and
      # the budget must land on target, and braking AT the target must overshoot
      # by more than the tolerance — otherwise waiting until it arrives is right
      # and the format has no lesson.
      - group: G1
        task: Stop the trolley where you meant to
        title: You stopped driving. You did not stop
        place: Field Station
        scene: >
          The survey trolley runs on a rail in the flooded gallery, where nothing
          slows it down. Ben Achterberg has the last operator's trace, which
          shows the motor cut at the mark and the trolley 18 metres past it.
        guide: >-
          The panel shows an error budget: each input's own width, multiplied by the
          power it carries in the formula, contributes a bar. Read the bars rather than
          the inputs. One measurement is affordable, so buy the one that shortens the
          tallest bar — a large exponent on a well-measured quantity can matter less
          than a modest one measured badly.
        background:
          - >-
              How the widths combine. For a product of powers, the fractional uncertainties
              add in quadrature, each weighted by its exponent. That is why the answer is a
              sum of contributions rather than 'the worst input', and why the bars are the
              honest display.
          - >-
              Why three significant figures is a claim. Quoting an energy to three figures
              asserts a fractional uncertainty below about a per cent. If no combination of
              the inputs supports that, the figure is a statement the measurement cannot
              back — before anybody argues about which input to improve.
          - >-
              What to do if the tallest bar cannot be improved. Say so, and quote fewer
              figures. A budget that identifies an irreducible term has still done its job:
              it turns an indefensible number into a defensible one.
        assumes:
          - a body with no resisting force keeps whatever velocity it was given
          - removing a velocity takes the same impulse that produced it
        takeaway: With nothing to damp it, the braking impulse has to begin before the target, by exactly as far as the acceleration carried it.
        format: FLY
        question: >-
          Set the pulse and the distance at which braking starts, then run it and see where it
          stops.
        fly:
          hint: >-
            There is nothing to slow it down. Whatever you put in has to be taken back out, and
            taking it out takes as long as putting it in.
          state: { label: Distance along the rail, unit: m, init: 0 }
          rate: { label: Speed, unit: m/s }
          accel: 0.42
          pulse: { min: 4, max: 8, step: 0.5, unit: s }
          brake: { min: 40, max: 95, step: 1, unit: m }
          pulseLabel: Drive pulse, each way
          brakeLabel: Begin braking at
          target: 90
          tolerance: 3
          rateTolerance: 0.05
          budget: 12
          run: Run it
          commit: Report where it stopped
        answerText: >-
          Braking has to start about 7 and a half metres short of the mark on a six-second
          pulse — around 82 metres — because that is how far the trolley travels while the braking
          impulse is being applied.
        why: >
          The trolley leaves the acceleration with a speed, and on a rail in still water there is
          nothing to take that speed away except an equal impulse in the other direction. So the
          braking has to start early, and by a specific amount: the distance covered while the
          brake is working, which is set by the same pulse that produced the speed. Cutting the
          drive at the mark is not braking at all — it only stops adding speed, and the trolley
          carries the speed it already has. A longer pulse gets there sooner and needs a longer
          brake and more of the budget, which is the trade the two controls actually make.
      # ---- INJECT. The configuration with the most detections must NOT be the one
      # that wins on the metric, or counting detections answers the stop.
      - group: G2
        task: Find what the network cannot see
        title: More detections, the same amount of notice
        place: Sample Room
        scene: >
          5000 synthetic events with known times and sizes, ready to push
          through the monitoring network exactly as a real 1 would go. Kit
          Sorensen has the recovery display up and nothing on it yet.
        guide: >-
          Move the endurance figure through the range it actually came with, and watch
          which options go dark. All four are ranked at one number, which is why they
          look separable. Commit to the one that still works at the pessimistic end, not
          the one that wins in the middle.
        background:
          - >-
              Why a single figure hides the decision. Ranking four options at one endurance
              value produces a clean ordering and conceals that the ordering changes across
              the range. An option best at the nominal and worst at the low end is not the
              best option; it is the most fragile one.
          - >-
              What the range represents. Not disagreement between people — the honest spread
              of what is known. Choosing at its middle accepts a real chance of being on the
              wrong side, and containment failures are not the kind of error that can be
              corrected afterwards.
          - >-
              Why Oyelaran has said nothing. The board as presented is defensible and
              incomplete, which is the ordinary way a decision gets made badly. Being the
              person who asks for the range is most of the job.
        assumes:
          - a detection pipeline has a selection function, and it can be measured
          - a warning is only useful if it arrives while something can still be done
        takeaway: Injecting a population whose truth you know measures the pipeline rather than the world, and what never comes back is not absent.
        format: INJECT
        question: >-
          Run the configurations you want, then fund the upgrade that actually buys something.
        inject:
          hint: >-
            The population is synthetic and its truth is known, so what comes back out is a
            measurement of the network rather than of the ground.
          population: { n: 5000 }
          metric: { label: median warning time, unit: h }
          configs:
            - { id: current, label: The network as it stands, detections: 1200, metric: 9 }
            - { id: deeper, label: Lower the detection threshold, detections: 2900, metric: 11 }
            - { id: faster, label: Report every six minutes instead of hourly, detections: 2100, metric: 26 }
            - { id: upstream, label: Three stations above the catchment divide, detections: 1400, metric: 31 }
          best: upstream
          blindSpot: >-
            Nothing arriving from above the catchment divide is recovered in any configuration.
            Lowering the threshold does not change it, because the network has no station there.
          commit: Fund it
        answerText: >-
          The upstream stations. They recover the fewest additional events of any upgrade and more
          than triple the median warning time, because they are the only ones that see the
          direction the network is currently blind to.
        why: >
          Lowering the threshold more than doubles the count, which is the number everybody
          reports, and it adds two hours of notice. What the injection shows is that the extra
          events are ones the network was already going to catch, only slightly earlier. The
          direction above the divide produces no recoveries in any configuration at all, and that
          is not a property of the events — the truth is known and they are there. It is a
          property of where the stations are. A discovery is worth what the downstream response
          can do with the time it buys, so a configuration that finds more and warns no earlier
          has bought a longer list.

  - title: Down there without the lights
    objective: Learn a route well enough to rejoin it, and close the fortnight out.
    briefing: The vault lighting fails on Thursdays and the survey has to be finished either way.
    stake: >-
      Wednesday, and Priya Naidoo needs the lower vault surveyed before the transfer on Friday. The lighting circuit there has failed twice this fortnight and the second time somebody counted paces to get out, took a detour round a jammed door and finished the count in the wrong room. Ada Merrick wants the route learned as places rather than as a number. Today you walk it once with the labels showing, walk it again without them, and find out what a compartment sequence gives you that a pace count does not.
    takeaway: A route learned as places can be rejoined from anywhere in it; a count cannot.
    stops:
      # ---- ROUTE. Landmarks must all differ, or the recovery is a guess; the
      # detour has to drop the player ahead of where they stopped; and the labels
      # must not all be numbered, or the dark half is readable without them.
      - group: G3
        task: Learn the route, then find it again
        title: Where you are, and how you know
        place: Records Office
        scene: >
          The lower vault runs as one line of rooms with a door at each end. Priya
          Naidoo walks it with you once with the labels up, and mentions that one
          of the doors sticks.
        guide: >-
          Walk the route once with the labels showing. Then rebuild it from memory, in
          order, with the labels gone. Partway through, a door is jammed and you come
          out somewhere the route did not take you, and you have to say which room you
          are in. Nothing is timed. What is graded is the order and the room you name,
          and the room is nameable only from what is in it, because the labels are not
          there.
        background:
          - >-
              Why the count is the trap. Paces and turns both give a number, and a number
              feels like knowing where you are. But a count cannot be resumed: once the
              route is broken, the count describes a journey that did not happen, and there
              is no way to check it from inside the building. It fails silently, which is
              worse than failing loudly.
          - >-
              Why a list of places survives. Every room on the route can be recognised on
              its own, from something in it that no other room has. That means the route is
              re-enterable at any point: being put down in the middle of it costs you the
              rooms you missed and nothing else. A sequence of recognisable things has that
              property; a running total never does.
          - >-
              What to look at on the way out. On the lit walk, the labels are the easy thing
              to read and the useless thing to remember, because they will be gone. What is
              worth carrying is the one feature of each room you would still know it by in
              the dark — the rail, the drawers, the smell, the ramp. That is the whole of
              the method, and it is why the walk is offered before it is needed.
        assumes:
          - a count of paces or turns cannot be resumed once it is interrupted
          - a place can be recognised from something in it that is not a label
        takeaway: A sequence of recognisable places can be re-entered at any point; a count of anything cannot.
        format: ROUTE
        question: >-
          Walk it lit, then put it back together in the dark — and say where you are when the
          route is broken.
        route:
          hint: >-
            Walk it once with the names showing. They will not be there on the way back, and one
            of the doors will not open.
          stops:
            - { id: deed, label: Deed store, landmark: the brass rail along the shelving }
            - { id: map, label: Map and plan room, landmark: the wide flat drawers }
            - { id: micro, label: Microfilm bay, landmark: the smell of warm ballast }
            - { id: bind, label: Bindery, landmark: the press bolted to the floor }
            - { id: transfer, label: Transfer room, landmark: the trolley ramp up to the door }
            - { id: strong, label: Strong room, landmark: 'the second door, hinged inward' }
          order: [deed, map, micro, bind, transfer, strong]
          interruptAfter: 2
          resumeAt: transfer
          detour: >-
            The bindery door is jammed. You go round through the service passage and come out
            somewhere with no label on it. What you can see is:
          commit: Report your position
        answerText: >-
          Deed store, map room, microfilm bay, bindery, transfer room, strong room — and after the
          jammed door you are in the transfer room, because the trolley ramp is only in one of
          them.
        why: >
          A pace count and a turn count both produce an answer and neither can be resumed. Once
          the route is broken the count is measuring a journey that did not happen, and there is
          no way to check it from inside the building. A sequence of places has the property the
          count does not: every element of it is recognisable on its own, so being put down in the
          middle of it is recoverable. Naming where you are is the whole of the recovery, and it
          is only possible because each room has something in it that no other room has.
      # ---- Two of the older formats, so the day is not three instruments in a row.
      - group: G4
        task: Say what the fortnight established
        title: What can be signed off
        place: Response Desk
        scene: >
          Ruth Calderón has the fortnight's findings on one sheet and a transfer
          on Friday. She wants to know which of them she is entitled to put her
          name to.
        guide: >-
          Four sentences, and the office corrected one reference factor and recomputed
          what divided by it. Ask of each option how far it travels from that. One
          stretches a single number across a frequency range nobody worked in. One
          inverts what was found about the independent instrument. And one throws away
          the correctly measured numerators along with the bad denominator.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a corrected ratio and an uncorrected one are different claims
        takeaway: What a verification office establishes is bounded by what it actually measured.
        format: CHOICE
        question: Which of these can the office state without qualification?
        choices:
          - The Halden site ratio is 4.8 against competent rock, corrected for the vault reference.
          - The Halden site amplifies ground motion by a factor of five at all frequencies.
          - The mechanical gauge reading was wrong and has been discarded.
          - Every measurement taken at Halden this fortnight is unreliable.
        answer: The Halden site ratio is 4.8 against competent rock, corrected for the vault reference.
        why: >
          The office measured a reference factor and recomputed the ratios that used it. That is a
          bounded claim with a stated basis, and it is the only one on this list. The second is
          the same number stretched into a frequency range nobody worked in. The third inverts
          what was found — the gauge was the independent instrument and it stands. The fourth
          throws away the correctly measured numerators along with the mislabelled denominator,
          which is the failure the whole fortnight was about.
        rebuttals:
          - The correction was made in one frequency band, and the ratio outside it was never measured.
          - The gauge is the channel that did not use the vault, so it is the one thing untouched by the error.
          - The numerators were measured correctly; only the label on the denominator was wrong.
      - group: G2
        task: Match each finding to what it rests on
        title: What each claim is standing on
        place: Sample Room
        scene: >
          Four findings from the fortnight, and four different kinds of evidence
          underneath them. Tomas Oyelaran wants them paired before anything is
          filed.
        guide: >-
          Four findings and four kinds of evidence. Pair them by asking what makes each
          one strong. A direct measurement? One variable changed and put back? Two
          instruments answering through different physics? Or a record contradicted by
          an inspection? All four are strong. Confusing which is which is how a bounded
          claim becomes a general one downstream.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last
              pair looks forced: the fault is usually not in the join you are struggling
              with, but in one you made early and stopped questioning.
        assumes:
          - different kinds of evidence support different kinds of claim
        takeaway: A claim is only as strong as the kind of evidence under it, and the two are easy to swap.
        format: PROTOCOL
        task: Match each finding to the evidence it actually rests on.
        scenarios:
          - The inflow at the hull was 410 litres a minute.
          - The tone at 214 hertz came from seawater pump B.
          - The asteroid is about 180 metres across.
          - The aft escape route could not be signed off.
        choices:
          - A rate measured directly, plus a removal term that was running throughout.
          - A single variable changed and then restored, with the feature following it both ways.
          - Two measurements responding to the same property through different physics.
          - An inspection that found the physical condition did not match the record.
        mapping: [0, 1, 2, 3]
        why: >
          Each of these findings is strong, and each is strong for a different reason. Confusing
          them is how a bounded claim turns into a general one somewhere downstream.

      # ---- DERIVE. The thirteenth. Two halves are graded — the line and the
      # rule — and the trap is `survives`: at least one wrong branch per step
      # has to stay algebraically valid, or the step is passable by elimination.
      - group: G1
        task: Turn a gate opening into a rate of discharge
        title: What the gate is doing to the river
        place: Field Station
        scene: >
          The gate is winding open at a steady rate and the head above the sill is 2.0 metres.
          Ada Merrick needs the discharge rate written down before the shift changes, and the
          gauge downstream only reports what has already arrived.
        guide: >-
          You set two things: the size of the pulse and the distance at which braking
          starts. Then the run happens and you watch it. Nothing on this rail slows the
          trolley down, so cutting the motor is not stopping — whatever you put in has
          to be taken out deliberately, and the braking has to lead the mark.
        background:
          - >-
              What the last operator's trace shows. Motor cut at the mark, trolley eighteen
              metres past it. That is not a mistake about where the mark was; it is a
              mistake about what cutting power does. On a level rail with little friction,
              removing the drive leaves the speed almost unchanged.
          - >-
              Why braking has to start early. The distance needed to stop depends on the
              speed and on how hard you can brake. Both are known before the run, so the
              braking point is calculable rather than something to be judged as the mark
              approaches.
          - >-
              Why a smaller pulse is easier to fly. A gentle start takes longer and asks
              less of the braking, so an error in the braking point costs less. Speed is not
              being scored here; arriving at the mark at rest is.
        assumes:
          - the discharge over a weir depends on the head raised to a power
          - a quantity that changes because another one changes needs the chain rule
        takeaway: A rate on the left needs every factor the right-hand side's own change brings with it.
        format: DERIVE
        question: >-
          Derive how fast the discharge is rising, in terms of how fast the head is rising.
        derive:
          hint: >-
            Choose the line that actually follows from the one above it.
          start: 'Q = C·L·H^(3/2)'
          startNote: given
          goal: 'dQ/dt in terms of dH/dt'
          steps:
            - ask: Differentiate both sides with respect to time.
              answer: 0
              candidates:
                - text: 'dQ/dt = C·L·(3/2)·H^(1/2)·dH/dt'
                  rule: chain
                - text: 'dQ/dt = C·L·(3/2)·H^(1/2)'
                  rule: power
                  survives: true
                  why: >-
                    H is a function of t, so differentiating with respect to t carries a factor of
                    dH/dt. Without it this is dQ/dH — a different quantity, and one that stays
                    algebraically respectable for the rest of the derivation, which is why it
                    survives being wrong.
                - text: 'dQ/dt = C·L·(3/2)·H^(3/2)·dH/dt'
                  rule: chain
                  why: >-
                    The power rule drops the exponent by one. Left at 3/2 it is the original
                    power, so this line is not the derivative of anything.
                - text: 'dQ/dt = C·L·H^(1/2)·dH/dt'
                  rule: chain
                  why: >-
                    The 3/2 that comes down in front is part of the power rule, not a constant
                    that can be absorbed into C·L.
            - ask: 'Put in C·L = 21.0 and H = 2.0, and keep dH/dt symbolic.'
              answer: 2
              candidates:
                - text: 'dQ/dt = 21.0 × 1.5 × 2.00 × dH/dt = 63.0·dH/dt'
                  rule: power
                  why: >-
                    H^(1/2) at H = 2.0 is the square root of 2, about 1.41. Using 2.00 evaluates
                    H rather than its square root.
                - text: 'dQ/dt = 21.0 × 1.5 × 1.5 × dH/dt = 47.3·dH/dt'
                  rule: power
                  why: >-
                    The 3/2 is already in front as the 1.5. Multiplying by it again applies the
                    power rule twice.
                - text: 'dQ/dt = 21.0 × 1.5 × 1.41 × dH/dt = 44.5·dH/dt'
                  rule: power
                - text: 'dQ/dt = 21.0 × 1.41 × dH/dt = 29.7·dH/dt'
                  rule: power
                  survives: true
                  why: >-
                    This is the arithmetic of the line whose 3/2 was never brought down. Nothing
                    about it looks broken, and it is the derivative of the wrong function — which
                    is the mistake this step exists to catch.
          commit: Report the rate
        answerText: >-
          dQ/dt ≈ 44.5·dH/dt — so a head rising at 0.05 m/min raises the discharge by about
          2.2 cubic metres a second every minute.
        why: >
          The discharge does not follow the gate; it follows the head, and it follows it through a
          three-halves power. That exponent is why a spillway is hard to run: the same half metre
          of head does far more when the head is already high, so a rate that looked manageable an
          hour ago is not the rate you have now. The chain rule is what carries the head's own
          motion into the discharge, and dropping its inner factor leaves you with dQ/dH — a slope
          that is perfectly correct about a question nobody asked.

  # ------------------------------------------------------- day 8, the fun-first five
  # BELT, TRIAL, HOLD, SPOT and LOB came from `ARCADE.md` rather than from the six
  # interaction documents, and they are the formats where the move the panel renders
  # is the PLAYER'S rather than the scientist's. They are in this bank for the same
  # reason as the other twenty-two: a format nobody has authored is a format nobody
  # has tested — and until this day existed, seventeen of their importer traps were
  # skipped rather than passing, because the strings they patch were not in any book.
  #
  # Rule 3 governs all five: difficulty is judgement, never dexterity. Speed is the
  # pressure and accuracy is the grade. SPOT is the argued exception, and even there
  # what is weighted is the seconds around a change rather than reaction time.
  - title: What speed does to a decision
    objective: Meet the five panels where the pressure is the clock rather than the reasoning.
    briefing: A sorting line, a lap of the site, a bath to hold, a board to clear, and a line to throw.
    stake: "Friday, and the quarterly verification exercise runs all day. Every task on it is one somebody here does under time pressure in an ordinary week: the error notes sorted before the courier goes, the calibration bath held while a reference cell settles, the certificate board whose standing instruction changes the moment the harbour job lands. Priya Raman is running it and has said plainly that nobody is being tested on how fast they are. Today you sort the fortnight's errors, drive the sign-off round, hold the bath, clear the board and get a line across the river — and what the exercise measures is whether the category, the band and the instruction are still being consulted when there is no time left to reason them out. An office that only checks carefully when it is not busy is an office that checks nothing on the days it matters."
    takeaway: A decision made at speed is still a decision, and what it costs is the thing you stop checking.
    stops:
      # ---- BELT. Systematic against random, sorted at speed.
      #
      # THE TRAP, and it is the reason a belt is worth checking at all: a bank whose
      # items can be sorted by SPELLING teaches spelling. The importer tallies every
      # word appearing in four or more names and refuses if it sends more than four
      # in five to one bin. So "drift" cannot be a left-hand word, and neither can
      # "noise" be a right-hand one — each bin has to use the other's vocabulary.
      # The second trap is a bank that is two thirds one bin, which is played by
      # holding one key.
      - group: G1
        task: Sort the fortnight's error notes before the courier goes.
        title: Which kind of error is it
        place: Field Station
        scene: The fortnight's error notes have to go to the courier in ten minutes, sorted. One pile can be corrected after the fact. The other can only be averaged down.
        guide: >-
          Two bins. A systematic error pushes every reading the same way, so it can be
          found and taken out afterwards. A random error scatters readings either side of
          the truth, so it cannot be removed from a single reading and shrinks only when
          you take more of them. Sort on that, not on how the note is worded.
        background:
          - >-
              Why the two piles are treated so differently. A systematic error has a sign. Find it
              and every affected reading can be corrected by the same amount, years later if
              necessary. A random error has no sign to find, so the only remedy is more readings —
              and the scatter falls as the square root of how many.
          - >-
              Why the wording will not help you. Both piles contain drifts, both contain noises and
              both contain things that sound mechanical. The word is not the category, and a belt
              that could be sorted by the word would be measuring whether you can read.
        assumes:
          - a measurement can be wrong in a way that repeats, or wrong in a way that scatters
        takeaway: A systematic error can be corrected after the fact; a random one can only be averaged down.
        format: BELT
        question: Sort each note into the pile that says how it can be dealt with.
        answerText: Anything that pushes every reading the same way goes left and is correctable. Anything that scatters them goes right and only averages down.
        why: >-
          The two piles are not degrees of the same thing. A systematic error has a direction:
          a thermal drift, a stale calibration, a scale that reads 0.4 high all afternoon. Once
          it is identified every reading it touched can be corrected by the same amount, which
          is why old data can be rescued years later. A random error has no direction to find.
          Vibration from traffic, a flickering last digit, the operator's timing — each one moves
          a reading either way, so no correction can be applied to a single number and the only
          remedy is to take more of them and let the scatter fall as the square root of the count.
          That is the whole of why the courier gets two piles rather than one list. And the
          wording is deliberately no help: there are drifts on both sides and noises on both.
        belt:
          left: { name: Correctable afterwards }
          right: { name: Only averages down }
          need: 20
          lives: 3
          pass: 0.8
          hint: One pile can be corrected later. The other one only gets smaller if you take more readings.
          items:
            - { name: Thermal drift, bin: left }
            - { name: Parallax habit, bin: left }
            - { name: Stale calibration, bin: left }
            - { name: Cable resistance, bin: left }
            - { name: Buoyancy ignored, bin: left }
            - { name: Zero offset, bin: left }
            - { name: Meniscus read high, bin: left }
            - { name: Clock running slow, bin: left }
            - { name: Unlevelled tripod, bin: left }
            - { name: Wrong reference block, bin: left }
            - { name: Noise floor uncorrected, bin: left }
            - { name: Heater cycling, bin: left }
            - { name: Balance untrued, bin: left }
            - { name: Reading noise, bin: right }
            - { name: Draught on balance, bin: right }
            - { name: Vibration from traffic, bin: right }
            - { name: Last digit flicker, bin: right }
            - { name: Operator timing, bin: right }
            - { name: Mains ripple, bin: right }
            - { name: Static charge, bin: right }
            - { name: Turbulent flow, bin: right }
            - { name: Thermal noise, bin: right }
            - { name: Hand tremor, bin: right }
            - { name: Sample inhomogeneity, bin: right }
            - { name: Drift between samples, bin: right }
            - { name: Counting statistics, bin: right }
          commit: Start the line
      # ---- TRIAL. The theme's own world, driven through gates, graded on the ORDER.
      #
      # Its first trap is the only importer check in the repo that reads `site.js` to
      # grade the content, and it has to: an order that is also the nearest-neighbour
      # walk from the spawn is perfect on the page and free on the ground. A gate named
      # by building sits in FRONT of its door — `posOf` stands it off by d/2 + 10 — which
      # is the fix for the screenshot that once put every ring under the floor.
      - group: G3
        task: Drive the sign-off round in the order the paperwork has to happen.
        title: The round nobody can shorten
        place: Records Office
        scene: The quarterly round has five stops and one van. The route that covers the least ground is not the route the paperwork allows, and Wednesday's driver took the short one.
        guide: >-
          Drive the five gates in the order the work has to happen, not the order that
          covers the least ground. The sample cannot be signed in before it is collected,
          and it cannot be collected before the station is opened for the day. The clock
          is running and it is not what you are graded on.
        background:
          - >-
              Why the shortest route is the wrong one. Each stop hands something to the next.
              Driving them in the order that saves fuel means arriving somewhere with nothing to
              do there, going back for it, and signing a form out of sequence — which is what
              Wednesday's driver did and why the batch had to be repeated.
          - >-
              What the clock is for. Pressure, and nothing else. The grade is the order. A lap
              driven carefully in the right order beats a fast one that saves the records office
              until after the desk has already been asked to respond.
        assumes:
          - a round of stops can have an order that its paperwork requires
        takeaway: The route that covers the least ground is not always the route the work allows.
        format: TRIAL
        question: Drive the five gates in the order the round has to happen.
        answerText: Gatehouse, field station, sample room, records, response desk — collected before it is signed in, signed in before anybody is asked to act on it.
        why: >-
          The round is a chain of handovers. The gatehouse opens the day and issues the
          paperwork; nothing legitimately starts before it. The field station is where the
          sample is taken, and the sample room cannot receive what has not been collected.
          Records cannot file a result that the sample room has not produced, and the response
          desk cannot act on a finding that is not on the record. Driven in that order every
          stop has something waiting for it. Driven in the order that covers the least ground —
          station, gatehouse, records, desk, sample room — two stops are visited before the
          thing they need exists, which is exactly the lap Wednesday's driver drove.
        trial:
          gates:
            - id: gatehouse
              label: Gatehouse
              at: GATE
              note: where the day's paperwork is issued
            - id: station
              label: Field Station
              at: G1
              note: where the reading is taken
            - id: sampleroom
              label: Sample Room
              at: G2
              note: where the sample is signed in
            - id: records
              label: Records Office
              at: G3
              note: where the result is filed
            - id: desk
              label: Response Desk
              at: G4
              note: where somebody acts on it
          order: [gatehouse, station, sampleroom, records, desk]
          commit: Report the round

      # ---- HOLD. One quantity, one control, a band that narrows.
      #
      # THE TRAP is a band a do-nothing run survives: the importer integrates the
      # authored disturbances with the control untouched and refuses if the needle
      # never leaves the corridor. `direction` is never printed — which way the control
      # moves the quantity is the thing the stop teaches. The band IS printed, because
      # it is the constraint the answer is written against; the pass mark is not,
      # because it is grading slack.
      - group: G2
        task: Hold the bath while the reference cell settles.
        title: Twenty degrees, for three quarters of a minute
        place: Sample Room
        scene: The reference cell needs the calibration bath at twenty degrees while it settles. The door to the corridor is propped, a heater on the next bench cycles, and the fan comes on when the room warms.
        guide: >-
          Hold the bath at twenty degrees. The band is drawn on the dial and it narrows as
          the cell settles, because a cell that has nearly settled is disturbed by less.
          The trim wheel is the only control you have, and finding out which way it moves
          the temperature is part of the job.
        background:
          - >-
              Why the band narrows. Early on the cell is still coming to temperature and a tenth of
              a degree either way changes nothing. As it settles the same tenth of a degree becomes
              the difference between a usable calibration and one that has to be repeated.
          - >-
              What is actually pushing it. Three things, at known times: the corridor door, the
              heater on the next bench cycling, and the fan. None of them is large. All of them are
              steps in the RATE, so a bath left alone does not sit still — it keeps going.
        assumes:
          - a control can move a quantity up or down, and takes time to do it
        takeaway: A disturbance you do nothing about is not a disturbance that goes away.
        format: HOLD
        question: Hold the bath inside the band while the cell settles.
        answerText: Inside the band for most of the run, with the trim wheel answering each step rather than chasing the needle after it has left.
        why: >-
          Each disturbance here is a step in the rate rather than a step in the temperature.
          The corridor door does not drop the bath by three hundredths of a degree; it makes
          the bath lose three hundredths a second, and it goes on losing until something
          answers it. That is why a bath left alone leaves the band and keeps going, and why
          the trim wheel has to be moved to a new position rather than nudged and released.
          The second half of the job is the band narrowing. A correction that was comfortably
          good enough while the cell was coming to temperature is not good enough once it has
          nearly settled, so the same wheel has to be held closer as the run goes on.
        hold:
          quantity: Calibration bath temperature
          unit: °C
          control: Trim wheel
          hold: 20
          band: 0.4
          narrowTo: 0.2
          duration: 45
          direction: raise
          authority: 0.05
          pass: 0.8
          hint: The wheel moves the temperature. Which way is for you to find out, and each step needs answering rather than waiting out.
          disturbances:
            - { label: Corridor door propped open, at: 4, amount: -0.03 }
            - { label: Heater on the next bench cycles on, at: 20, amount: 0.05 }
            - { label: Fan comes on as the room warms, at: 38, amount: -0.045 }
          commit: Report the hold

      # ---- SPOT. A standing instruction, replaced mid-run without announcement.
      #
      # THE TRAP is the sharpest of the fun-first set, because the defect it catches is
      # the format measuring the opposite of its own subject: if the instruction changes
      # and the same items are still wanted, the player is rewarded for not noticing.
      # An item every rule wants is refused for the same reason.
      - group: G4
        task: Clear the certificate board while the priority keeps changing.
        title: The board changes its mind
        place: Response Desk
        scene: Certificates arrive on the board all morning. The desk works to whatever the standing instruction says, and the instruction is changed by whoever is running the desk, without an announcement.
        guide: >-
          Take the certificates the instruction currently wants, and leave the rest. The
          instruction at the top of the board is replaced during the run and nobody will
          tell you when. What is scored is the seconds either side of each change, because
          that is the only interval that measures anything.
        background:
          - >-
              Why the seconds after a change are the ones that count. Most of what arrives is wanted
              by neither instruction and is correctly ignored by somebody who has understood
              nothing. The items that separate a player who noticed from one who did not are the
              ones the old rule wanted and the new one does not.
          - >-
              Why this is not a reflex test. The instruction is on the screen the whole time. What
              costs you is continuing to work to the rule you had, which is a habit rather than a
              speed, and it is the thing a desk actually gets wrong.
        assumes:
          - a standing instruction can be replaced while work is still arriving
        takeaway: The cost of a withdrawn instruction is paid by whoever is still working to it.
        format: SPOT
        question: Clear the board to whatever the standing instruction currently says.
        answerText: Watch the top of the board rather than the certificates. Every change leaves a few seconds in which the old rule still feels right.
        why: >-
          Three instructions run during the exercise and each one wants a different part of
          the board. Anything overdue, anything from the harbour site, anything not yet
          checked — and a certificate can be two of those at once, which is what makes the
          switch cost real rather than notional. What the panel scores is the window either
          side of each change, because everything else on the board is wanted by neither rule
          and is ignored correctly by somebody who has read nothing. The desk's own version
          of this is a Tuesday when the harbour job lands: the standing instruction changes,
          and the work that goes out wrong in the next quarter of an hour is the work
          somebody was already doing.
        spot:
          duration: 40
          switchEvery: 12
          pass: 0.75
          hint: The instruction is at the top of the board, and it is replaced without warning.
          targets:
            - id: c1
              label: Vault cell, overdue
              tags: [vault, overdue]
            - id: c2
              label: Harbour gauge, overdue
              tags: [harbour, overdue]
            - id: c3
              label: Harbour tide staff
              tags: [harbour, signed]
            - id: c4
              label: Vault balance, signed
              tags: [signed]
            - id: c5
              label: Bench thermometer
              tags: [uncalibrated]
            - id: c6
              label: Harbour anemometer
              tags: [harbour, uncalibrated]
            - id: c7
              label: Vault reference block
              tags: [vault, signed]
            - id: c8
              label: Field station barometer
              tags: [uncalibrated, overdue]
          rules:
            - say: Anything overdue
              want: [overdue]
            - say: Anything from the harbour
              want: [harbour]
            - say: Anything not yet checked
              want: [uncalibrated]
          commit: Open the board

      # ---- LOB. Angle and charge against a mark, with the launch speed withheld.
      #
      # The withholding is the point and it is also the limit: LOB cannot be used where
      # the quantity is one somebody should be computing, which is why Wellmere's
      # isolation distances rejected it. A messenger line thrown across a river is a
      # knack, and saying so is honest. The traps are a mark any angle reaches, a mark
      # nothing reaches, and marks that do not work outward.
      - group: G1
        task: Get the messenger line across to the far gauge.
        title: The line across the river
        place: Field Station
        scene: The staff gauge is on the far bank and the bridge is four miles round. The line has to go across before the level can be read, and the throwing arm has an angle and a charge and no readout of what it is about to do.
        guide: >-
          Set the angle and the charge, and throw. Three marks, working outward. The arm
          does not tell you the speed it will give the line, so the only way to find it is
          to throw and watch — which is what the second shot at each mark is for.
        background:
          - >-
              Why there is no number to work from. The arm's spring is old and its charge dial is
              relative, so nobody can tell you the launch speed. Everything else in this office is
              a measurement; this is a knack, and pretending otherwise would put a calculation in
              front of something that is genuinely learned by throwing.
          - >-
              What the shape of the flight does tell you. A steeper throw spends longer in the air
              and lands shorter, a shallower one flies flatter and further, and past a point the
              extra charge is spent on height rather than distance. Two throws at a mark are enough
              to bracket it.
        assumes:
          - a thrown object rises and falls, and both angle and effort change where it lands
        takeaway: Some quantities are measured, and a few are learned by trying them.
        format: LOB
        question: Land the messenger line on each mark, working outward.
        answerText: Bracket each mark with two throws and correct on the third. The far ladder needs a flatter throw than it looks, because the extra charge is going into height.
        why: >-
          Three marks at three distances, and the arm gives you no number to start from. What
          the flight gives you instead is a bracket: a throw that lands short and a throw that
          lands long put the mark between two settings you have actually seen, and the third
          throw goes between them. That is a real method, and it is the one used when a
          quantity cannot be read off anything. The far ladder is the mark that teaches the
          rest of it. Aiming higher for a longer throw stops working past forty-five degrees,
          because the extra charge goes into height rather than distance — so the ladder wants
          a flatter throw than the bollard did, not a harder one.
        lob:
          shots: 3
          maxSpeed: 40
          gravity: 9.81
          wind: 0
          height: 1.5
          hint: Two throws bracket a mark. The third one goes between them.
          targets:
            - { label: Near bollard, distance: 55, radius: 3.5 }
            - { label: Gauge post, distance: 108, radius: 3 }
            - { label: Far ladder, distance: 152, radius: 2.5 }
          commit: Report the throws


  # ------------------------------------------------- day 9, the world-graded five
  # GREET, FOLLOW, HUNT, CANVASS and EVADE hand the player back to the site with
  # the panel down, the way TRIAL does. Their traps therefore read `site.js`, and
  # every one of them is the same sentence in different arithmetic: a run whose
  # goal is reached by standing still, or by walking to whatever is nearest, is a
  # run that asks nothing. See ARCADE.md and engine/world/worldFormats.js.
  #
  # The clock is game minutes, and the day runs at one game minute per real
  # second — so `minutes: 60` is an hour of the working day and sixty seconds of
  # walking. All five freeze the day's own countdown while they run, because a
  # format with its own pressure must not be charged twice.
  - title: Where the answer is the place
    objective: Meet the six panels that are graded against the site rather than against a board.
    briefing: A round of the station, a walk to keep up with, a search, a straw poll, a clear radius and a chase.
    stake: "Thursday, and the annual audit lands on Monday. None of what has to happen today can be done sitting down: the fortnight's loggers are still out where the storm left them, the auditor wants to walk the sampling route with somebody who can answer for it, and Ada Merrick wants a straight answer on whether the new duplicate procedure has actually changed anything before she signs a page saying it has. Tobias Lindqvist has the list of who has to be told about Monday, and telling somebody is walking to where they are standing. Today you get round the station, walk the route with Merrick, recover six of the loggers, ask the site whether the procedure has changed anything, keep the open tray clear while it settles and catch the analyst Petar Ilić before an unsigned form goes out of the gate. What all six have in common is that the work is somewhere else, the hour is real, and the order you choose is the only part of it you control."
    takeaway: Work that happens across a place is planned as a route, and the route is a decision that is made before the walking starts.
    stops:
      # ---- GREET. A round, and the list is longer than the number to be reached.
      #
      # THE TRAP: the ten nearest, walked from the spawn at the player's own pace,
      # must take most of the hour. If they do not, the hour is not a constraint
      # and the list might as well be whoever is standing by the gate.
      - group: G1
        task: Tell the station about Monday before the morning goes.
        title: Getting round them all
        place: Field Station
        scene: Monday's audit has to be told to everyone on site, in person, before the morning is out. Fourteen people work here, spread across four buildings, and none of them stays put.
        guide: >-
          Ten of the fourteen have to hear it from you. Get to somebody and press Use to tell
          them; the rings on the ground are the people still to hear it. Which ten you reach is
          settled before you set off, by the order you choose to walk them in.
        background:
          - >-
              Why ten of fourteen rather than all of them. A round with no choice in it is a
              route somebody else planned. Four buildings hold the fourteen unevenly, so the
              question is which cluster to spend the walk on and which to leave.
          - >-
              Why an hour. At walking pace the four buildings are about forty minutes apart in
              the best order and considerably more in the worst, so the hour is tight enough
              that the order decides the outcome and loose enough that a sensible one arrives.
        assumes:
          - a place has a shape, and walking it costs time in proportion
        takeaway: A round is a route, and who you reach is decided by the order before it is decided by the walking.
        format: GREET
        question: Tell ten of the fourteen about Monday before the hour is out.
        answerText: Ten of the fourteen, taken in an order that spends the hour on the clusters rather than on the ground between them.
        why: >-
          The people are not evenly spread and that is the whole of it. Four of them stand at
          the field station, four at the sample room, three at records and three at the desk,
          so the cost of the round is almost entirely the walking between buildings rather than
          the talking. A route that takes the two nearest clusters and then the third reaches
          ten inside the hour; one that crosses the site twice does not, and the four people you
          never reach are decided by a choice you made in the first two minutes. That is what a
          round is, and it is why the list is longer than the number that has to hear it.
        greet:
          target: 10
          minutes: 60
          hint: They walk about. The rings are the people who still have to hear it.
          moral: A round is a route. Who you reach is decided by the order you set off in, not by how fast you walk.
          roster:
            - { id: lead1, name: Ada Merrick, where: Field Station }
            - { id: helper1, name: Ben Achterberg, where: Field Station }
            - { id: hand1, name: Ines Vogel, where: Field Station }
            - { id: hand2, name: Owen Brathwaite, where: Field Station }
            - { id: lead2, name: Tomas Oyelaran, where: Sample Room }
            - { id: helper2, name: Kit Sorensen, where: Sample Room }
            - { id: hand3, name: Farida Osman, where: Sample Room }
            - { id: hand4, name: Petar Ilić, where: Sample Room }
            - { id: lead3, name: Priya Naidoo, where: Records Office }
            - { id: hand5, name: Grace Ntuli, where: Records Office }
            - { id: hand6, name: Callum Reyes, where: Records Office }
            - { id: lead4, name: Ruth Calderón, where: Response Desk }
            - { id: hand7, name: Naomi Adeyemi, where: Response Desk }
            - { id: hand8, name: Tobias Lindqvist, where: Response Desk }
          go: Start the round
          commit: Report the round
      # ---- FOLLOW. A band, not a chase: too close fails as well as too far.
      #
      # THE TRAP is HOLD's — what does a player who does nothing score? If the
      # route never leaves the far edge of the band, standing still is following.
      - group: G1
        task: Walk the sampling route with Merrick without being led.
        title: Staying with her
        place: Field Station
        scene: Merrick walks the sampling route once a fortnight and will not wait for anybody. She stops at each point long enough to look, and says nothing when she moves off again.
        guide: >-
          Stay between three and fourteen metres of her for the whole walk. Closer than three
          and you are in front of her the moment she stops; further than fourteen and you are
          guessing which way she went at the last corner. She pauses at each sampling point.
        background:
          - >-
              Why there is a near limit at all. Following somebody is not chasing them. A person
              who is being walked into stops explaining what they are looking at, and somebody
              who is ahead of the walk is no longer being shown anything.
          - >-
              Why the pauses matter more than the pace. She walks slower than you can, so nothing
              here is a race. The failures all happen where she stops or turns, which is exactly
              where somebody treating it as a race overshoots.
        assumes:
          - a distance can be too small as well as too large
        takeaway: Following is a band rather than a line, and both edges of it are a way of losing somebody.
        format: FOLLOW
        question: Stay with her from the station to the last sampling point.
        answerText: Inside the band for the whole route, including the stops — which is where the band is actually hard to hold.
        why: >-
          A band has two edges and only one of them feels like failure. Dropping behind is
          obvious: you lose sight of her at a corner and have to guess. Getting too close is
          not, because it feels like doing the task well, and it is the one that ruins the
          walk — she stops at each point to look at something, and somebody four paces from her
          shoulder arrives in front of the thing being looked at. She walks at about two thirds of
          your pace, so nothing here rewards speed. What it rewards is noticing that she has
          stopped before you have walked past her, which is the whole difference between being
          shown a route and merely arriving at the end of one.
        follow:
          guide: lead1
          speed: 2.6
          seconds: 60
          pass: 0.8
          band: { near: 3, far: 14 }
          hint: She will not wait, and she stops without saying so.
          moral: Both edges of a band are a way of losing somebody. The near one is the edge that feels like doing well.
          path:
            - { x: -20, z: 10, pause: 3 }
            - { x: 10, z: -15, pause: 3 }
            - { x: 35, z: -30 }
          go: Set off with her
          commit: Report the walk
      # ---- HUNT. Eight out there, five wanted, all of them on the map.
      #
      # THE TRAP is GREET's in another currency: the five nearest, walked from the
      # spawn, must take most of the time or there is no search.
      - group: G2
        task: Recover six of the loggers the storm scattered, before the audit wants them.
        title: Six of the ten, before the time goes
        place: Sample Room
        scene: Ten data loggers went out before the storm and none of them came back on their own. The sample room needs six of them working by Monday. Nobody wrote down where any of them ended up.
        guide: >-
          Six of the ten are enough, and they are not on the map. They are small orange cases
          lying where the water left them — against a wall, off the edge of a path, behind
          something. You have to walk the ground to see one, so the order you sweep it in is
          the whole of it.
        background:
          - >-
              Why a sweep beats wandering. Ground you have already walked is worth nothing to
              walk again, and the only way to know which ground that is, is to have covered it
              in some order. A search with no shape to it re-walks its own middle.
          - >-
              Why six rather than ten. Four of them are far enough out that fetching them costs
              more than the other six put together, and nobody knows in advance which four
              those are. A stopping rule is part of a search, and a search with no stopping rule
              is just walking until the time goes.
        assumes:
          - a route has a cost, and the cost is not the same for every order
        takeaway: A search is ground covered in an order, and the order is what stops you walking the same yard twice.
        format: HUNT
        question: Bring back six of the ten loggers before the time is out.
        answerText: Six, found by sweeping the ground in an order rather than crossing it — and the last four left wherever they are.
        why: >-
          Nothing here tells you where anything is, which is what makes it a search rather than
          a delivery round. Ten cases are lying about the site and six will do, so the question
          is never which one to fetch next — it is which ground to cover, in what order, and
          when to stop covering it. A sweep that works outward from the sample room sees new
          ground with every step. A player who crosses the site to a place they remember
          something being re-walks the middle twice and arrives with four. The far cases are not
          worth more than the near ones; they are only further away, and the clock does not
          care which is which.
        hunt:
          item: { name: Data logger }
          target: 6
          minutes: 75
          hint: They are not on the map. You have to be close to see one.
          moral: A search is ground covered in an order. The middle of the site is the part everybody walks twice.
          at:
            - { x: -46, z: 28 }
            - { x: -22, z: 6 }
            - { x: 6, z: -16 }
            - { x: 30, z: 4 }
            - { x: 48, z: 30 }
            - { x: -64, z: -14 }
            - { x: -6, z: -44 }
            - { x: 62, z: -24 }
            - { x: -34, z: 54 }
            - { x: 70, z: 40 }
          go: Start looking
          commit: Hand them in
      # ---- CANVASS. A yes-or-no question, and the nearest people are wrong.
      #
      # THE TRAP: if the five nearest the spawn already give the true answer four
      # to one, the sample can be taken without walking and a player who
      # understood none of this is right anyway. Here they give the false one.
      - group: G3
        task: Find out whether the new duplicate procedure actually changed anything.
        title: How many is enough
        place: Records Office
        scene: The new duplicate procedure was piloted at the field station in March and rolled out everywhere in May. Merrick signs a page on Monday saying it has cut disagreements between runs. Nobody has asked the site.
        guide: >-
          Get to somebody, press Use, and they will tell you whether the procedure has made a
          difference in their own work. Everybody answers. Nobody will tell you when you have
          asked enough, and the answer you report at the end is your own — not the tally.
        background:
          - >-
              Why the sample is the question. Fourteen people is small enough to ask all of them
              and large enough that you will not, and the place is laid out so that the people
              nearest the office are not a fair picture of it.
          - >-
              Where the pilot ran. The field station has been using the procedure since March and
              everybody else since May, so the two groups have had very different amounts of time
              with it. That is a real difference between the people you can ask, and it is the
              reason the nearest answers lean one way.
        assumes:
          - a sample can be unrepresentative without anybody lying
        takeaway: A sample is not a smaller copy of a place; asking the nearest few measures your own route.
        format: CANVASS
        question: Has the new duplicate procedure cut disagreements between runs across the site?
        answerText: No. The field station says yes and it has had the procedure since March; the rest of the site has had it since May and says no.
        why: >-
          Four of the five people nearest this office work at the field station, where the
          procedure was piloted in March, and they will tell you it works. They are not wrong
          about their own work. They are four people out of fourteen, and the other ten have had
          the procedure for a few weeks rather than a few months. Ask the near cluster and stop,
          and you have measured where you were standing rather than the thing you asked about —
          and the sample will be internally consistent while you do it, which is why nothing
          about the answer feels wrong at the time. The remedy is not a bigger sample. It is a
          sample that crosses the site.
        canvass:
          claim: The new duplicate procedure has cut disagreements between runs across the whole site.
          answer: false
          minutes: 60
          yes: it has helped
          no: no difference
          trueLabel: It has cut them site-wide
          falseLabel: Not across the site
          hint: Everybody will answer. Nobody will say when you have asked enough.
          moral: Ask the nearest few and you have measured your own route. A sample crosses the place or it describes where you stood.
          population:
            - { id: lead1, says: true }
            - { id: helper1, says: true }
            - { id: hand1, says: false }
            - { id: hand2, says: true }
            - { id: lead2, says: true }
            - { id: helper2, says: false }
            - { id: hand3, says: false }
            - { id: hand4, says: false }
            - { id: lead3, says: false }
            - { id: hand5, says: false }
            - { id: hand6, says: false }
            - { id: lead4, says: true }
            - { id: hand7, says: false }
            - { id: hand8, says: false }
          go: Go and ask
          commit: Answer it
      # ---- EVADE. A clear radius held for a stretch of time, using the ground.
      #
      # THE TRAP is the do-nothing run once more: the pursuer starts across the
      # site, so clear seconds bank while they walk in. If they cannot cross that
      # gap before the drill is satisfied, standing still passes it.
      - group: G4
        task: Get the open tray to the hood without anybody coming near it.
        title: Keeping the radius
        place: Response Desk
        scene: The tray is open and has to settle for half a minute before it can be closed. Nobody may come within nine metres of it while it does. Ruth Calderón wants a signature and is following you to get one.
        guide: >-
          Hold nine metres of clear ground for thirty seconds. The count runs only while you are
          clear and stops while she is closer than that, so being caught costs seconds rather
          than the drill. She walks slower than you and she does not walk through buildings.
        background:
          - >-
              Why the count stops rather than resets. A drill that ends the moment somebody gets
              near it is measuring reaction time. One that costs you the seconds is measuring
              whether you can keep hold of a constraint while somebody is trying to talk to you.
          - >-
              Why nobody is faster than you. If she were, the only outcome would be decided by
              how fast you can press a key. She is not, so the drill is decided by where you go —
              which means the buildings, the gaps between them and the fence behind you.
        assumes:
          - a fixed distance can be maintained by choosing ground rather than by speed
        takeaway: A radius held under pressure is a matter of ground, not of speed, once nobody involved is faster than you.
        format: EVADE
        question: Hold nine metres of clear ground for thirty seconds while the tray settles.
        answerText: Thirty seconds of clear ground, kept by putting buildings between the tray and anybody walking towards it.
        why: >-
          Nobody in this drill is faster than you, so being caught is never about speed. It is
          about the ground you were standing on when she arrived. Walk in a straight line and
          the fence at the edge of the site ends the run for you — there is nowhere further to
          go and she closes the last few metres while you stand at it. Put a building between
          you and she has to walk round it, which buys the seconds the tray needs. The count
          stopping rather than resetting is deliberate: the cost of losing the radius is the
          time it takes to get it back, which is exactly what it costs in the room this drill
          is standing in for.
        evade:
          pursuer: lead4
          distance: 9
          seconds: 30
          speed: 3.4
          hint: She walks straight at you, slower than you, and not through buildings.
          moral: Nobody here is faster than you, so being caught is about the ground you were standing on when they arrived.
          go: Open the tray
          commit: Report the drill
      # ---- TAG. EVADE's distance test the other way round.
      #
      # THE TRAP is the same one from the other end: somebody walking straight
      # away is closed on at the DIFFERENCE of two walking paces, so a run long
      # enough for that alone is a chase the ground plays no part in.
      - group: G2
        task: Catch Ilić before the tray leaves with an unsigned form.
        title: Catching him before the gate
        place: Sample Room
        scene: Ilić is walking the afternoon tray down to the courier van and the custody form on it has not been signed. Once it is through the gate it is somebody else's problem for a fortnight.
        guide: >-
          Get within two and a half metres of him inside half a minute. He walks away from you
          and nowhere else, and he is slower than you are — so this is not a race. Walking
          straight at him closes the gap slowly enough that he reaches the gate first.
        background:
          - >-
              Why a straight line does not work. Two people walking in the same direction close
              at the difference between their paces, not the sum. Against somebody two thirds
              your speed that difference is small, and half a minute of it is not enough ground.
          - >-
              What does work. He turns away from wherever you are, so where you stand decides
              where he goes. Come at him from the side he wants and the fence, the sample room
              wall and the corner of the yard all do the work the walking cannot.
        assumes:
          - two people moving the same way close at the difference between their speeds
        takeaway: A chase against somebody slower is won by the line you take, because closing speed is a difference and not a sum.
        format: TAG
        question: Catch Ilić before the tray goes through the gate.
        answerText: Caught inside half a minute, by cutting the corner he has to turn rather than by following him across the yard.
        why: >-
          The arithmetic is the whole of it. He walks at about two thirds of your pace, so
          following directly behind him closes the distance at the difference between the two —
          a metre and a half a second against fifty metres of yard, which is more than the half
          minute you have. Nothing about that improves if you try harder. What changes it is
          that he moves away from wherever you are standing, so your position steers him: come
          round one side and he turns toward the fence, and the ground he has left runs out
          before your time does. That is a chase decided by geometry rather than by pace.
        tag:
          quarry: hand4
          reach: 2.5
          seconds: 30
          speed: 2.8
          hint: He walks away from you and nowhere else, and he is slower than you are.
          moral: Closing speed is a difference, not a sum. The line you take is the only thing that changes it.
          go: Go after him
          commit: Report the chase


# --------------------------------------------------------------- the warm-ups
# The bank's own warm-ups. It is a template as much as a game, so these are
# deliberately the plainest correct version of each: a reason, in this office's
# own terms, and nothing dressed up.
warmups:
  greet:
    title: Fourteen people who check each other's work
    why: >-
      The office verifies other people's measurements, which means every result here is read by
      somebody who did not take it. Raman wants you known to all fourteen before Monday, because
      a query about a number lands very differently from somebody whose name the analyst knows.
  trial-near:
    title: Walk the floor before the first job
    why: >-
      Four areas and a gatehouse, and the work moves between them in a fixed order — station,
      sample room, records, response desk. Walk it once. The round you will be driving on Friday
      is this route, and the paperwork order only makes sense once you have seen the distance
      between the doors.
  follow:
    title: The sampling route, walked once by Merrick
    why: >-
      Merrick, the station lead, walks the sampling route once a fortnight and does not wait for
      anybody. Stay inside the band behind her: too far and you lose which way she turned, too
      close and you are standing in front of what she stopped to look at.
  hunt:
    title: Four reference blocks, and the store lists two
    item: { name: reference block, plural: reference blocks }
    why: >-
      Every calibration in this office traces back to a reference block, and two of them are not
      where the register says. A block nobody can find is a chain of measurements nobody can
      defend, which is the one thing this office exists not to have.
  canvass:
    title: Which analysts actually saw the revised method
    why: >-
      The method was revised three weeks ago and the office assumes everybody is using it. Ask
      round the areas until enough answers have come back to say whether the results this month
      are on one method or two.
  evade:
    title: The client who wants the result before the check
    why: >-
      He has been at the gatehouse since eight wanting the number before the second analyst has
      seen it, and the whole point of this office is that nothing leaves on one pair of eyes.
      Keep clear until the check is signed.
  tag:
    title: Catch Oyelaran before the balance room is closed
    why: >-
      Oyelaran, the sample room lead, has the morning's drift check for the balance, and the
      room is locked at noon for the air conditioning work. Every mass this afternoon is
      corrected against that check, and without it the day's weighings are numbers with no
      traceability.

# ---------------------------------------------------------------- the place
# What each room says when the player walks into it. The book owns this, or
# bookParity reports the theme shipping a file the book does not produce.
copy:
  ARRIVE: <p>Sign-in. Everybody who comes through this floor is on the sheet by the door.</p>
  WAIT: <p>Where people wait to be seen, and where they talk to each other while they do.</p>
  QUIET: <p>A room with a door that shuts. There is one of these in every building that works.</p>
  STORE: <p>Supplies. Nothing here is interesting until the day something has run out.</p>
  LABX: <p>The analysis bench. Shared, booked by the hour, and always behind.</p>
  DESK: <p>The team desk. Every argument about the week has happened at it.</p>
  BACK: <p>Back of house. Deliveries, spares, and the boxes nobody has opened.</p>
  GATE: <p>The gatehouse. Sign in, take the day's calls, and start walking.</p>
  G1: <p>The field station. Two instruments, and a rule about what they are each answering.</p>
  G2: <p>The sample room. Every container here is a record of where it has been.</p>
  G3: <p>The records office. The only part of this work that outlasts the people doing it.</p>
  G4: <p>The response desk. Where somebody has to decide before the evidence is finished.</p>

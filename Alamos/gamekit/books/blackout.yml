        task: Find every shortfall-and-inertia pair that fits the measured frequency slope, then use an independent inertia estimate to break the ambiguity.
        title: Why the island's frequency is falling slowly
        reason: >-
          The island is losing speed, and the wall gives you the slope rather than the shortfall
          behind it
        place: System Operations
        scene: The island frequency is falling at 0.10 hertz per second. Its dispatchable machine is already at full output, while inverter-connected ridge generation is low. Haddad wants the power shortfall, but the wall gives only the slope.
        guide: >-
          Two controls slide along a family of combinations that all reproduce the
          observed 0.10 hertz per second. Find out how wide that family is before naming
          a number. The wall gives only the slope, and a slope alone cannot separate a
          large shortfall on a heavy system from a small one on a light system. Then
          bring in the stored kinetic energy, which collapses it.
        background:
          - >-
              Why the slope alone is not enough. Frequency falls at a rate set by the power
              shortfall divided by the stored kinetic energy of everything spinning. One
              equation, two unknowns. Every pair that gives the same ratio produces exactly
              the same slope on the wall.
          - >-
              Why the ridge generation matters. Inverter-connected machines contribute
              little or no stored kinetic energy — they are not spinning masses locked to
              the frequency. So an island leaning on them has less inertia than its
              megawatts suggest, and the same shortfall drives the frequency down faster.
          - >-
              What measuring the inertia buys. It fixes one of the two unknowns, so the
              shortfall follows immediately. That is why system operators now measure
              inertia rather than assuming it: the assumption was safe while the fleet was
              synchronous and stopped being safe as it changed.
        assumes:
          - the island is near 50 Hz
          - the initial frequency slope follows df/dt = f₀ΔP/(2E_k)
        takeaway: A frequency slope constrains the ratio of power imbalance to stored kinetic energy; it does not determine either one by itself.
        format: DEGENERACY
        question: What power shortfall is consistent with the 0.10 Hz/s fall once the island’s stored kinetic energy is measured?
        degeneracy:
          hint: Move shortfall and stored kinetic energy until the predicted slope matches 0.10 Hz/s. Notice how many pairs work. Then reveal the independent stored-energy estimate and find the intersection.

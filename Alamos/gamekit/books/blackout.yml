        background:
          - >-
              What sets the temperature. Current heats a conductor as the square of itself,
              and the conductor loses that heat to the air by convection and to the sky by
              radiation. The temperature settles where the two balance. That is why the curve is not a straight line: doubling the current asks the cooling to remove four times as much heat.
          - >-
              Why a rating is a temperature. The ampere figure printed on a corridor is the
              current that reaches the temperature limit under an assumed ambient, an
              assumed wind and an assumed sun. Change any of those and the same amps arrive

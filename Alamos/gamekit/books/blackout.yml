        takeaway: A mismatch you do not answer is not a mismatch that goes away.
        format: HOLD
        question: Hold the system at fifty hertz through the evening rise.
        answerText: Inside the band for most of the rise, with the regulating set moved to a new output for each step rather than nudged after the frequency has already left the band.
        why: >-
          Every event here is a step in the rate rather than a step in the reading. A block of load coming on does not drop the frequency by twenty millihertz and stop. It makes the system lose speed, and it goes on losing while the mismatch stands. That is why the raise-lower control has to be moved to a new position and left there, rather than nudged and released. It is the whole difference between operating a system and chasing a needle. Droop has already answered part of each step and left an offset. A system that settles at 49.94 has done exactly what it was designed to do. Returning to fifty is a separate action, taken by somebody. And the band narrows for a reason that is not arbitrary. At peak there is less inertia spinning and less reserve behind it. So the same excursion sits closer to the frequency at which feeders start coming off on their own.
        hold:
          quantity: System frequency
          unit: Hz
          control: Regulating set raise-lower
          hold: 50
          band: 0.4
          narrowTo: 0.2
          duration: 45
          direction: raise
          authority: 0.1
          pass: 0.8
          hint: Each block of load is a mismatch that keeps pushing. Move the set to answer the mismatch, not the reading.

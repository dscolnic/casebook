      - group: OPS
        task: Work out what the path opposes before the order is signed
        title: What the path opposes at 50 hertz
        concept: Reactance, impedance and phasors
        place: System Operations
        scene: Reyes has the switching order for the second circuit in front of her. Novak has read the path's own figures out of the records: 3.1 ohms of resistance, and 12.4 ohms of reactance at 50 hertz. She wants one number before she signs.
        guide: >-
          Five numbers, and only two of them are properties of the path. Ask of each
          whether it describes what the path is, or what is being pushed through it.
          Resistance and reactance are both measured in ohms and both oppose the current,
          but they do it at different moments in the cycle, so they do not add end to end.
          Combine them the way you would two sides of a right-angled triangle, and notice
          before you commit how little the smaller one moves the answer.
        background:
          - >-
              Why the two do not simply add. Resistance turns electrical energy into heat and
              opposes the current itself. An inductance stores energy in a magnetic field and
              hands it back a quarter of a cycle later, so what it opposes is the change of
              current. The two oppositions peak at different instants, and adding them
              arithmetically would count a maximum that never happens.
          - >-
              Why an overhead path is mostly reactance. A long circuit is a large loop of wire,
              and its inductance grows with the area that loop encloses. At the spacings a
              400 kV tower needs, that inductance dominates: on this path the reactance is four
              times the resistance, so the resistance contributes about three per cent of the
              total, and heat is a small part of the story.
          - >-
              What the frequency has to do with it. Reactance is proportional to frequency, so a
              figure like this one is only true at the frequency it was measured at. Resistance
              is nearly a property of the metal; reactance is a property of the metal and the
              cycle together, which is why a record of it has to say 50 hertz.
        takesAsRead:
          - "AC waveforms: frequency, period and phase"
          - Capacitance, inductance and stored energy
          - RMS against peak and average
        assumes:
          - an alternating current has a frequency, and this system runs at 50 hertz
          - the hypotenuse of a right-angled triangle is the square root of the sum of the squares
        takeaway: Two oppositions that peak a quarter of a cycle apart combine at right angles, so the larger of them dominates the total.
        format: BALLPARK
        question: Estimate what the corridor path opposes at 50 hertz.
        answerText: About 12.8 ohms.
        why: Resistance opposes the current itself and turns part of it into heat. Reactance opposes the change of current, because an inductance answers a rising current by pushing back, and it does that a quarter of a cycle away from the resistance. Two oppositions that peak at different moments cannot be added end to end; they combine as the two shorter sides of a right-angled triangle. Here the reactance is four times the resistance, so the resistance moves the total by about three per cent.
        estimate:
          prompt: The path has 3.1 ohms of resistance and 12.4 ohms of reactance at 50 hertz. The corridor is carrying 1,150 A at a nominal 400 kV.
          question: Choose the two figures that are properties of the path.
          labels:
            - 3.1 Ω  (resistance of the path)
            - 12.4 Ω  (reactance of the path at 50 Hz)
            - 1,150 A  (present corridor current)
            - 400 kV  (nominal corridor voltage)
            - 50 Hz  (system frequency)
          values: [3.1, 12.4, 1150, 400, 50]
          slots: 2
          template: "√({0}² + {1}²)"
          formula: Math.sqrt(a*a + b*b)
          correct: [0, 1]
          target: 12.78
          tolerance: 0.4
          units: Ω
          solution: Z = √(3.1² + 12.4²) = √163.4 ≈ 12.8 Ω.
          explanation: |-
            About 12.8 ohms, and 12.4 of it is the reactance. The current and the nominal voltage decide what that opposition does at the far end of the path; neither is part of the opposition itself. The frequency is the condition the reactance figure was measured under, not a term in it.
          givens:
            - Resistance of the path is 3.1 Ω
            - Reactance of the path at 50 Hz is 12.4 Ω
          relationship: Z = √(R² + X²), the resistance and the reactance of the same path combined at right angles because they oppose the current a quarter of a cycle apart.

        task: Hold the system frequency while the evening load comes on.
        title: Fifty hertz, through the evening rise
        reason: >-
          The evening rise is starting, the frequency is drifting under it, and the raise-lower
          control is all that is left
        concept: Frequency as the balance of supply and demand
        place: Control Room
        scene: The evening rise is starting and the frequency is drifting under it. Governors are answering, and the only thing left on the desk is the regulating set's raise-lower control.
        guide: >-
          Hold the frequency inside the band on the wall display. The band narrows as the evening goes on. The tolerance a system can live with at seven o'clock is not the one it can live with at peak. The raise-lower control is what you have,
          and every load that comes on is a mismatch that keeps pushing until generation
          answers it.
        background:
          - >-
              Why frequency drifts at all. Frequency is the running balance between what is being
              generated and what is being drawn. A load that comes on is not a step in the frequency. It is a step in the *rate*, and the machines slow for as long as the mismatch lasts.
          - >-
              What the governors have already done. Droop has answered part of each step automatically and left an offset behind. That is what droop is for. It is why the frequency settles low rather than returning. Bringing it back to fifty is the
              operator's job, and it is what this control is.
          - >-
              Why the band narrows. Early evening the system has inertia and reserve to spare. At peak, with less spinning and more load, the same excursion is closer to the settings that shed feeders. So the same skill has to be exercised more tightly, on exactly the hour it is hardest.

  - title: A shift where nothing happens
    objective: Run an ordinary evening, and notice what ordinary is now resting on.
    briefing: The forecast holds, every circuit is inside limits, and nothing needs deciding.
    stake: >-
      Monday, and it is a quiet shift. The forecast is holding to within 30 megawatts, every corridor is
      comfortably inside rating, the ridge is producing steadily, and there is nothing on the board that
      needs a decision. Aaron Whitlock has the log open with almost nothing in it. Dolores Reyes uses these
      evenings to walk the room and ask what everybody is assuming, because a quiet shift is the only time
      anybody has to. Today you check what the system would do if one thing went, read a trend that is
      behaving, and say which of tonight's comforts is actually a measurement and which is a habit. Nothing
      will go wrong tonight. Nothing went wrong the Monday before last, either.
    takeaway: A quiet system is a set of assumptions nobody is currently being forced to check.
    stops:
      - group: OPS
        task: Say what the contingency check is actually asking
        title: The failure that has not happened
        place: System Operations
        scene: The screen says every single contingency is survivable tonight. Whitlock asks what the check does not cover, and Reyes says that is the right question on a quiet shift. The event board is still showing the overnight state.
        guide: >-
          All four options describe something a clean contingency check might mean. They
          differ in scope: one failure or two, survivable or likely. Ask of each whether
          the check's own list could support it. The check is exactly as broad as that
          list. Last Friday was a corridor already above a limit nobody knew about, and
          then a trip.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a system is required to survive any one credible failure
        takeaway: An N-1 check is a statement about single failures, and it says nothing about 2.
        format: CHOICE
        question: What does a clean contingency check tell you tonight?
        answerText: A clean N-1 check says each listed single failure leaves the modeled system inside limits. It says nothing about failure probability or simultaneous failures.
        why: "The check is exactly as broad as its list. It takes each credible single failure in turn, works out the flows afterwards, and confirms nothing ends up over a limit. That is a genuinely strong statement and a narrow one. It does not cover two failures at once, it does not cover a failure outside the list. It says nothing at all about what is likely — only about what is survivable. Last Friday was two things: a corridor already above a limit nobody knew about, and then the trip. When a second thing lands on neighbours checked only one at a time, each trips correctly in turn, and the sequence of events is what has to be reconstructed afterwards."
        choices:
          - Every listed single failure can occur without any element exceeding its operating limit afterward.
          - No listed element is likely to fail tonight because the post-contingency flows are acceptable.
          - Any pair of listed failures can occur together without producing an overload.
          - The present dispatch has enough margin that no further contingency analysis is needed this shift.
        answer: Every listed single failure can occur without any element exceeding its operating limit afterward.
        rebuttals:
          - Contingency analysis tests survivability after an assumed failure, not the probability that the failure will occur.
          - An N-1 study is explicitly a one-at-a-time test. It does not establish N-2 survivability.
          - A clean result is conditional on the modeled dispatch and list of failures; it does not make later checks unnecessary.
      - group: LOAD
        task: Read a forecast that is behaving
        title: The trend with nothing wrong with it
        place: Load & Forecasting
        scene: Lindgren's forecast has tracked within 30 megawatts all evening. He wants to know what that does and does not license the room to assume about tomorrow. The room is waiting for a written instruction.
        guide: >-
          Four observations about a forecast, and the right column says what each one
          licenses. Pair them by asking where in the distribution that day sits. A mild
          Monday is the middle, and the middle is where the model was best calibrated.
          Only one of these four is evidence about the method rather than about a night,
          and the room is deciding reserve on it.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last
              pair looks forced: the fault is usually not in the join you are struggling
              with, but in one you made early and stopped questioning.
        takesAsRead:
          - Charge, current, voltage and resistance
        assumes:
          - a forecast can be right by luck as easily as by skill on any one day
        takeaway: One good night is not evidence about the method, because the width was never a claim about tonight.
        format: PROTOCOL
        why: A forecast is a distribution. Landing inside 30 megawatts on a mild Monday is what the middle of that distribution looks like and it tells you almost nothing. That is because mild Mondays are the days the model was best calibrated for. The evidence that matters is how it behaves on the days it was least calibrated for, which are rare by construction. So a run of good nights is not a reason to hold less reserve.
        rebuttals:
          - A quiet Monday is the middle of the distribution and the easiest day the model has; it confirms very little.
          - Cold snaps are where the model is least calibrated, so they are where the width is actually tested.
          - A run of accurate nights does not narrow the width, because the width was never a claim about any one night.
          - One miss on an unusual day is a single draw, and it does not condemn the method any more than a hit vindicates it.
        columns:
          - The observation
          - What it is evidence about
        scenarios:
          - The forecast tracked within 30 megawatts on a mild Monday.
          - The forecast missed by 400 megawatts on the coldest night of last winter.
          - The forecast has been accurate for nine consecutive evenings.
          - The forecast's stated width has held over three winters.
        choices:
          - Very little. It is the easiest day the model has, and the middle of its own distribution.
          - The part of the range that matters, since that is where the model is least calibrated.
          - Nine draws from the middle, which does not license holding less reserve.
          - The only one of these that is evidence about the method rather than about a night.
        mapping: [0, 1, 2, 3]
      - group: GEN
        task: Spend the quiet-shift check budget on the assumption most likely to change the fast-frequency plan.
        title: Which of these is a measurement
        place: Generation Hall
        scene: Haddad lists four reasons the room feels comfortable tonight. Three are current measurements or long-run evidence. One is an inherited stored-energy figure written before the inverter-connected fleet became much larger.
        guide: >-
          Four reasons the room feels comfortable, and four check credits. Open each one
          and ask what it actually is: a current measurement, long-run evidence, or a
          number somebody inherited. Buy the evidence that could change the
          under-frequency timing. A figure written before the fleet changed is a claim
          about a different system.
        background:
          - >-
              Why the stored-energy figure is the suspect. Under-frequency protection is
              timed against how fast the frequency can fall, and that depends on the inertia
              of everything spinning. As inverter-connected generation grew, the inertia
              fell — but a number written down before that shift keeps being quoted because
              it has been in the file for years.
          - >-
              What separates a measurement from a comfort. Three of the four can be pointed
              at something measured recently on this system. The fourth is an inheritance,
              and the room's confidence rests on it without anybody having decided to trust
              it.
          - >-
              Why timing is where it bites. Under-frequency load shedding has to act before
              the frequency reaches the point where machines trip. If the real inertia is
              lower than assumed, the frequency gets there sooner and the settings are late
              — which is a blackout rather than a load-shedding event.
        assumes:
          - stored kinetic energy affects the initial rate of frequency change
          - inverter-connected generation may add power without adding synchronous inertia
        takeaway: An old assumption deserves priority when it is load-bearing, likely to have changed, and cheap enough to check.
        format: VALUE
        question: Which evidence should be bought before the room trusts its present under-frequency timing?
        value:
          hint: You have four check credits. Buy evidence that could change under-frequency timing tonight, not evidence that merely confirms a number already measured recently.
          budget:
            amount: 4
          decision: Keep or revise the present under-frequency timing assumptions.
          options:
            - id: inertia-audit
              label: Recompute stored kinetic energy from the machines actually online
              cost: 3
              axis: dynamic frequency response
              decisive: true
              reveals: Stored kinetic energy is about 18,000 MW·s. A 300 MW loss at 50 Hz gives |df/dt| ≈ 50×300/(2×18,000) ≈ 0.42 Hz/s, not 0.30.
            - id: reserve-reconcile
              label: Reconcile tonight’s reserve meters again
              cost: 2
              axis: available reserve
              decisive: false
              reveals: The 310 MW reserve total repeats within 5 MW; the fast-frequency timing assumption is unchanged.
            - id: corridor-read
              label: Repeat the corridor loading readout
              cost: 1
              axis: transmission loading
              decisive: false
              reveals: Loading matches the reading taken an hour ago; it does not determine the first-second frequency slope.
            - id: forecast-audit
              label: Re-score the forecast width over three winters
              cost: 4
              axis: load uncertainty
              decisive: false
              reveals: The seasonal width remains well calibrated; this does not restore missing synchronous kinetic energy.
        answerText: Buy the current machine-data inertia audit. It reveals about 18,000 MW·s rather than the inherited 25,000. For a 300 MW loss at 50 Hz, |df/dt| rises from 0.30 Hz/s to about 0.42 Hz/s.
        why: Three comforting numbers are current measurements or long-run evidence. The inherited inertia figure is different. The fleet has changed, and inverter-connected generation can supply real power without the same synchronous stored kinetic energy. That matters because stored energy sets how fast frequency moves after a sudden imbalance. Recomputing it from current machine data can therefore change protection timing immediately. If the old 25,000 MW·s figure has fallen to 18,000 MW·s. The same 300 MW trip moves frequency about 40% faster.
      - group: DIST
        task: Work the fault board while the standing instruction changes.
        title: What the desk is chasing now
        concept: "Islanding, black start and restoration order"
        place: Distribution Control
        scene: Faults arrive on the board all evening. The desk works to one standing priority, and the shift manager changes it as the picture changes — after the storm crosses, after the hospital calls, after the count of customers off passes ten thousand.
        guide: >-
          Take the faults the standing priority currently wants and leave the rest. The
          priority at the top of the board is replaced during the evening and nobody
          announces it. What is scored is the faults either side of a change, because they
          are the only ones that show whether the desk is reading the board.
        background:
          - >-
              Why the priority changes at all. Early in an event the work is restoring the most
              customers per crew-hour. Once a hospital is on generator the work is that hospital.
              After midnight it is whatever cannot be left overnight in the weather. Each of those
              is a different order of the same list.
          - >-
              Why the changeover is where it goes wrong. A desk that keeps dispatching to the old
              priority for ten more minutes sends its last free crew to the job that mattered an
              hour ago, and nothing on the board says that is what happened.
        assumes:
          - a control desk works to a stated priority that somebody can change
        takeaway: The cost of a withdrawn instruction is paid by whoever is still working to it.
        format: SPOT
        question: Dispatch to the priority on the board, and keep watching the board.
        answerText: Read the top of the board, not the fault list. Every change leaves a few minutes in which the old priority still feels like the right one.
        why: >-
          Three priorities run across the evening. Each one wants a different part of the board.
          Most customers restored first. Then anything with a vulnerable customer behind it.
          Then anything that cannot be left out overnight in the weather. A fault can answer two
          of those at once, and that is what makes the switch cost real. What the panel scores
          is the window either side of each change. Everything else on the board is wanted by
          neither priority, so it is left alone correctly by somebody who has read nothing. The
          desk's own version is the ten minutes after a hospital calls. The priority has already
          changed, and the crews rolling are rolling to the order in force when they left.
        spot:
          duration: 40
          switchEvery: 12
          pass: 0.75
          hint: The standing priority is at the top of the board, and the shift manager changes it without announcement.
          targets:
            - id: f1
              label: Feeder, 4,000 customers
              tags: [many]
            - id: f2
              label: Spur, hospital behind it
              tags: [vulnerable]
            - id: f3
              label: Overhead line down
              tags: [weather, many]
            - id: f4
              label: Village spur, 60 customers
              tags: [few]
            - id: f5
              label: Care home spur
              tags: [vulnerable, few]
            - id: f6
              label: Pole fire, road closed
              tags: [weather]
            - id: f7
              label: Town centre feeder
              tags: [many, few]
            - id: f8
              label: Farm supply, flooded
              tags: [weather, few]
          rules:
            - say: Most customers back first
              want: [many]
            - say: Anything with a vulnerable customer
              want: [vulnerable]
            - say: Anything that cannot wait out the weather
              want: [weather]
          commit: Open the board
  - title: Merit order
    objective: Decide what runs tomorrow, and what is held back for the day it is needed.
    briefing: The cheapest generation is on the ridge and it will not say what it is doing after four.
    stake: >-
      Thursday, and tomorrow has to be bought tonight. Sten Lindgren has a peak that moves with the
      temperature and a width he will not narrow. Mina Sarraf, the wind fleet controller, has a ridge that will produce almost nothing
      for money and cannot promise any of it, and she is tired of being asked to. Nadia Haddad has expensive
      machines that can be told exactly what to do. Dolores Reyes has to sign an order that puts them in
      sequence. Today you forecast the peak from the load curve, decide what merit order actually means when
      the cheapest plant is the least certain, and choose what to do with more wind than the corridor can
      carry.
    takeaway: Dispatch orders plant by cost, and the value of certainty is what stops that being the whole story.
    stops:
      - group: DIST
        task: Choose the last protection step before the crew approaches the conductor.
        title: The ground is not at one voltage
        place: Distribution Depot
        scene: The cable is isolated at both ends and a tester reads dead at the work point. Kowalczyk, the safety lead, stops the crew because one protection step is still missing. The substation remains connected to live equipment nearby.
        guide: >-
          All four options are things a crew could do next, and three of them sound
          careful. Ask of each what it would protect against: a source you know about,
          or one that arrives later. Isolation removes the known sources. A dead test
          confirms one moment. Neither holds the conductor down if switching changes or
          a voltage is induced nearby.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        takesAsRead:
          - Charge, current, voltage and resistance
        assumes:
          - a conductor can be re-energised from more than one direction
        takeaway: Isolation is not proof of safety, and earthing is what makes it provable.
        format: CHOICE
        question: What must happen after isolation and a successful dead test?
        answerText: Apply portable earths at the point of work. Isolation and testing dead establish the condition; earthing holds it near local ground potential if something changes.
        why: Isolation and proving dead answer different questions. Opening both ends removes the known sources, while the dead test confirms the condition at that moment. Neither guarantees the conductor will stay safe if switching changes or induced voltage appears. Portable earths provide a low-impedance path for unexpected current and keep the work conductor close to local ground potential. That is why earthing follows the dead test rather than replacing it. The sequence turns a measured safe state into a maintained safe state.
        choices:
          - Apply portable earths at the point of work.
          - Repeat the dead test every five minutes while the crew works.
          - Leave the conductor floating so any unexpected voltage remains measurable.
          - Close one isolator briefly to prove the protection will trip if power returns.
        answer: Apply portable earths at the point of work.
        rebuttals:
          - A repeated test is still only a sequence of snapshots; an applied earth makes an accidental return of voltage survivable.
          - A floating conductor can rise to a dangerous potential by induction or mistaken energisation.
          - Deliberately re-energising the work zone is not a protection test; the safe state is isolation, proving dead, then earthing.
      - group: OPS
        task: Match each plant to why it is dispatched where it is
        title: Cheapest first, and the exceptions that are not exceptions
        place: System Operations
        scene: |-
          Four plants and an order to sign. Reyes wants each one matched to the actual reason it sits where it does in the stack, rather than to its price alone.
        guide: >-
          Four plants and four reasons to sit where they do. Only one of the four
          reasons is price. Pair them by asking what bends the merit order: reliability,
          the ability to move quickly, or where the plant is. A machine at full output
          cannot sell reserve. A cheap machine in the wrong place can be worse than an
          expensive one in the right place.
        background:
          - >-
              Why explanations rather than labels. Naming a finding is not accounting for
              it, and a plausible-sounding mechanism attached to the wrong observation is
              the commonest way a wrong story survives. Committing an explanation to one
              clue means claiming it accounts for that clue specifically and not for its
              neighbour, which is where the two come apart.
          - >-
              How to use the one-each rule. The explanations are a set to be distributed,
              not a list to be sampled, so every join constrains the rest. Settling the two
              you are confident of can decide the remaining pair by elimination. Where it
              does not, two explanations are still competing for one clue, and that
              competition is the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every explanation used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two. That is worth remembering when the last pair
              looks forced: the fault is usually not in the join you are struggling with,
              but in one you made early and stopped questioning.
        assumes:
          - generation is scheduled in order of what it costs to run
        takeaway: Merit order is cost order, corrected for what the system also needs from a machine.
        format: CASEBOOK
        why: Dispatch starts from cost, because running the cheapest first is what makes electricity affordable. Then three things bend it. Plant with almost no running cost goes first and cannot be relied on. It displaces fuel without displacing the need for something reliable behind it. Plant that can change output quickly is worth holding part-loaded, because reserve is a service and a machine at full output cannot provide it. And plant in the right place can be needed regardless of price, when the alternative is a corridor over its limit.
        rebuttals:
          - Near-zero running cost puts it first in the stack, and the uncertainty is why something reliable still has to be behind it.
          - Holding a fast machine part-loaded is buying reserve, which a machine at full output cannot sell.
          - Being in the right place can be worth more than being cheap, when the cheap alternative overloads a corridor.
          - Expensive and slow means last, and it is the plant the system is trying not to need.
        columns:
          - The plant
          - Why it sits where it does
        scenarios:
          - The ridge fleet, almost free to run, output not promised beyond four hours.
          - A gas machine that can move 40 MW a minute, deliberately left at half output.
          - An old station on the wrong side of the corridor, kept off despite being mid-priced.
          - An old station on the right side of a constraint, run despite being expensive.
        choices:
          - First in the stack on cost, with something reliable behind it because the output is not promised.
          - Held part-loaded on purpose, because reserve is a service and only a part-loaded machine can sell it.
          - Kept off because running it would push flow onto a corridor that cannot take it.
          - Run out of merit order because of where it is, not what it costs.
        mapping: [0, 1, 2, 3]
      - group: GEN
        task: Decide what to do with more wind than the corridor can carry
        title: When the cheapest power cannot get out
        concept: Economic dispatch and merit order
        place: Generation Hall
        scene: Sarraf, the renewable operator, can produce 340 megawatts from the ridge tonight. The corridor out of the valley can carry about 190. There is no second export path available. A printed network diagram lies on the desk.
        guide: >-
          The ridge can produce 340 MW tonight and the corridor is rated at about 190 MW
          continuous. Nights like this occur perhaps 40 times a winter. Storage at the
          ridge would be 50 MW for four hours at 85 per cent round trip. That moves
          surplus in time rather than in space. The second circuit has been on the
          reinforcement list for two years without a date, and commissioning runs about
          three years from a start. Curtailment payments recur every night like this
          one. Running above a thermal rating anneals the conductor, and the annealing
          accumulates.
        rules: >-
          Spread the hundred points across the 4 proposals. At least 70 of them have to
          be committed, because a panel that funds almost nothing has not decided
          anything. Your largest single allocation must be 35 or more, and it has to
          land on what the evidence supports most. Keep the total sitting on proposals
          the evidence does not support under fifteen. And a proposal it does support
          should not be left under twenty.
        background:
          - >-
              Why the whole spread is graded. Funding is not a vote for one idea. A
              portfolio says what you think is likely, what is worth hedging against, and
              what is not worth pursuing at all — and the last two are where most of the
              information is. Backing the right proposal while quietly funding a bad one is
              a worse answer than it looks. That is why the small numbers count as much as
              the big one.
          - >-
              What the three numbers are for. Thirty-five is what makes a lead a lead: below
              it you have hedged rather than chosen. Fifteen is the most that can sit on
              unsupported work before it stops being a rounding error. Past that it is a
              second opinion nobody argued for. Twenty is the floor under a line of work you
              have already called strong, because funding it too thin to finish spends the
              money and buys nothing.
          - >-
              Why there is a floor on the total. Points held back are not caution; they are
              a decision not to decide, taken with somebody else's money and somebody else's
              deadline. The floor is what forces the panel to say something.
        assumes:
          - power has to have a path to where it is used
        takeaway: Curtailment is what a network limit looks like from the generator's end.
        format: SCIENCETANK
        why: Energy that cannot reach a customer is not energy, and a corridor at its thermal limit is a hard wall rather than a preference. So some of that output has to stop, and the question is only how the system pays for it and what it buys instead. Reinforcing the corridor fixes it permanently and takes years. Storage on the ridge moves the surplus in time rather than in space, which is exactly the right shape for this problem.
        proposals:
          - label: A
            text: Install storage at the ridge, to move the surplus into the hours when the corridor is free.
          - label: B
            text: Pay the fleet to curtail tonight, and every night like it, until something else changes.
          - label: C
            text: Reinforce the corridor with a second circuit, commissioned in about three years.
          - label: D
            text: Run the corridor above its limit and accept the risk while the wind lasts.
        recommended:
          A: 45
          C: 25
      - group: OPS
        task: Hold the system frequency while the evening load comes on.
        title: Fifty hertz, through the evening rise
        concept: Frequency as the balance of supply and demand
        place: Control Room
        scene: The evening rise is starting and the frequency is drifting under it. Governors are answering, and the only thing left on the desk is the regulating set's raise-lower control.
        guide: >-
          Hold the frequency inside the band on the wall display. The band narrows as the
          evening goes on, because the tolerance a system can live with at seven o'clock is
          not the one it can live with at peak. The raise-lower control is what you have,
          and every load that comes on is a mismatch that keeps pushing until generation
          answers it.
        background:
          - >-
              Why frequency drifts at all. Frequency is the running balance between what is being
              generated and what is being drawn. A load that comes on is not a step in the
              frequency — it is a step in the *rate*, and the machines slow for as long as the
              mismatch lasts.
          - >-
              What the governors have already done. Droop has answered part of each step
              automatically and left an offset behind: that is what droop is for, and it is why the
              frequency settles low rather than returning. Bringing it back to fifty is the
              operator's job, and it is what this control is.
          - >-
              Why the band narrows. Early evening the system has inertia and reserve to spare. At
              peak, with less spinning and more load, the same excursion is closer to the settings
              that shed feeders — so the same skill has to be exercised more tightly on exactly the
              hour it is hardest.
        assumes:
          - frequency falls when demand exceeds generation
        takeaway: A mismatch you do not answer is not a mismatch that goes away.
        format: HOLD
        question: Hold the system at fifty hertz through the evening rise.
        answerText: Inside the band for most of the rise, with the regulating set moved to a new output for each step rather than nudged after the frequency has already left the band.
        why: >-
          Every event here is a step in the rate rather than a step in the reading. A block of
          load coming on does not drop the frequency by twenty millihertz and stop; it makes the
          system lose speed and it goes on losing while the mismatch stands. That is why the
          raise-lower control has to be moved to a new position and left there rather than
          nudged and released, and it is the whole difference between operating a system and
          chasing a needle. Droop has already answered part of each step and left an offset — a
          system that settles at 49.94 has done exactly what it was designed to do — so
          returning to fifty is a separate action taken by somebody. And the band narrows for a
          reason that is not arbitrary: at peak there is less inertia spinning and less reserve
          behind it, so the same excursion sits closer to the frequency at which feeders start
          coming off on their own.
        hold:
          quantity: System frequency
          unit: Hz
          control: Regulating set raise-lower
          hold: 50
          band: 0.4
          narrowTo: 0.2
          duration: 45
          direction: raise
          authority: 0.1
          pass: 0.8
          hint: Each block of load is a mismatch that keeps pushing. Move the set to answer the mismatch, not the reading.
          disturbances:
            - { label: Evening block comes on, at: 4, amount: -0.03 }
            - { label: Interconnector import steps up, at: 20, amount: 0.05 }
            - { label: "Second block, and a unit trips off", at: 38, amount: -0.045 }
          commit: Report the evening
  - title: The last morning it can be changed
    objective: Commit the corridor to a course, knowing the window closes today.
    briefing: The reinforcement decision from last week has a date on it, and the date is today.
    stake: >-
      Monday, and the corridor decision comes back for the last time. The outage window that would let a
      second circuit be strung this year closes at close of business, and if it closes the next 1 is
      18 months out. June Farrow has the corrected thermal record, which says the corridor has spent
      more hours over limit than anybody thought. Amira Haddad has a storage quote that expires with the
      window. Dolores Reyes has a board that will not approve both. Today you work out what the corrected
      record does to the corridor's remaining life, decide what the money buys, and say what the decision
      commits the system to for the next 18 months. Last week this was a preference. This morning it
      is the last morning.
    takeaway: A reversible decision is a cheap one, and the moment it stops being reversible is the moment it needs the whole argument.
    stops:
      - group: METER
        task: Say what the corrected hours do to the conductor
        title: Hours over limit, added up
        place: Metering & Standards
        scene: |-
          Farrow's corrected record has the corridor above continuous rating for about 90 hours over 3 years. She wants to know whether that is a maintenance note or a design problem.
        guide: >-
          Four options, and they differ in whether the damage is reversible. Ask of each
          what happens when the conductor cools. Above about ninety-five degrees the
          aluminium's grain structure relaxes, and the strength it loses stays lost.
          That is why the hours are added up over three years rather than judged one
          event at a time. Nothing fails today, which is what makes this easy to file.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - time spent above a thermal limit accumulates rather than resetting
        takeaway: Thermal damage integrates over time, so 90 scattered hours count as 90 hours.
        format: CHOICE
        question: What do 90 accumulated hours above continuous rating mean for the conductor?
        why: Annealing is not a state the metal comes back from. Above about 95 degrees, aluminium's grain structure begins to relax, and the tensile strength it loses stays lost when it cools. The effect accumulates in hours-above-temperature, which is why the number is added up over three years rather than judged one event at a time. The consequence is not a failure today. It is a span that fails at a wind loading the design allowed for, some years from now.
        choices:
          - Nothing, because the conductor cooled fully between every one of those periods.
          - The aluminium has lost strength for good, and its life is shorter than designed.
          - The conductor has been proven capable of the higher current and can be re-rated upward.
          - The record is too old to act on, since most of those hours were more than a year ago.
        answer: The aluminium has lost strength for good, and its life is shorter than designed.
        rebuttals:
          - Cooling restores the temperature and not the strength; the loss is in the grain structure, and it is permanent.
          - Surviving a current is not the same as being rated for it, because the damage is cumulative rather than immediate.
          - The damage does not age out; hours from two years ago are still hours the metal spent losing strength.
      - group: TRANS
        task: Commit the money before the window closes
        title: What the window is worth
        place: Transmission & Protection
        scene: Two options, one budget, one afternoon. Novak points out that only one of them still exists tomorrow, and Haddad points out that only one of them fixes the corridor. The event board is still showing the overnight state.
        guide: >-
          The outage window closes at close of business and the next is 18 months out.
          The corrected record has the corridor above continuous rating for about 90
          hours over three years. The storage quote expires with the window and does not
          change a thermal rating. Curtailment on nights like last Friday runs about 40
          nights a winter. The review Farrow would want takes three weeks. The board
          will not approve both the storage and the circuit, and nobody who has read the
          corrected record has disputed it.
        rules: >-
          Spread the hundred points across the 4 proposals. At least 80 of them have to
          be committed, because a panel that funds almost nothing has not decided
          anything. Your largest single allocation must be 35 or more, and it has to
          land on what the evidence supports most. Keep the total sitting on proposals
          the evidence does not support under fifteen. And a proposal it does support
          should not be left under twenty.
        background:
          - >-
              Why the whole spread is graded. Funding is not a vote for one idea. A
              portfolio says what you think is likely, what is worth hedging against, and
              what is not worth pursuing at all — and the last two are where most of the
              information is. Backing the right proposal while quietly funding a bad one is
              a worse answer than it looks. That is why the small numbers count as much as
              the big one.
          - >-
              What the three numbers are for. Thirty-five is what makes a lead a lead: below
              it you have hedged rather than chosen. Fifteen is the most that can sit on
              unsupported work before it stops being a rounding error. Past that it is a
              second opinion nobody argued for. Twenty is the floor under a line of work you
              have already called strong, because funding it too thin to finish spends the
              money and buys nothing.
          - >-
              Why there is a floor on the total. Points held back are not caution; they are
              a decision not to decide, taken with somebody else's money and somebody else's
              deadline. The floor is what forces the panel to say something.
        assumes:
          - an option with an expiry date is worth more than the same option without one
        takeaway: When one path closes today, its value includes everything the eighteen-month delay would cost.
        format: SCIENCETANK
        why: This is not the same question as last week, because one option now expires. Reinforcement is the only choice that removes the constraint rather than working around it. Today is the last day it can be started this year — so its cost includes 18 months of curtailment, 90 more hours of annealing. Every evening the room has to hold a corridor it has now measured as weaker than it thought.
        proposals:
          - label: A
            text: Commit the outage window today and string the second circuit this year.
          - label: B
            text: Buy the ridge storage on the expiring quote and put reinforcement to the spring.
          - label: C
            text: Keep curtailing and revisit both when the next window opens in 18 months.
          - label: D
            text: Hold the budget until the corrected thermal record has been independently reviewed.
        recommended:
          A: 55
          B: 25
      - group: OPS
        task: Say what the decision commits the room to
        title: The 18 months you just bought
        place: System Operations
        scene: Reyes wants the consequences written down before the decision is signed, so that the next shift inherits a plan rather than a mood. The room is waiting for a written instruction.
        guide: >-
          Four things on the left, and what the decision does to each on the right. Pair
          them by asking what changes today and what changes only when the circuit
          exists. A build is a date, not relief. Between now and then the corridor is as
          weak as it was this morning, and now known to be weaker. One of these is
          closed so a shift can act at 16:40.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last
              pair looks forced: the fault is usually not in the join you are struggling
              with, but in one you made early and stopped questioning.
        assumes:
          - a decision to build something is also a decision about the years before it exists
        takeaway: Committing to a fix commits you to running the system without it until it arrives, and that has to be planned too.
        format: PROTOCOL
        why: A build is not relief. It is a date. Between today and that date the corridor is exactly as weak as it was this morning, and now known to be weaker. The room inherits three years of damage and no new capacity. So the emergency rating is recalculated on the corrected sensor. The curtailment nights are budgeted rather than absorbed. The contingency case is run at the corridor's real strength.
        rebuttals:
          - The emergency rating has to be recalculated, because the one in use was derived from the drifted sensor.
          - Curtailment nights become a budgeted cost rather than a surprise, since the corridor is unchanged until the circuit exists.
          - The contingency case has to be rerun at the corridor's real strength rather than its design strength.
          - The argument is settled, which is what lets a shift act quickly without reopening the decision.
        columns:
          - What the next 18 months contains
          - Why the decision puts it there
        scenarios:
          - The emergency rating in the operating instructions.
          - Roughly 40 curtailment nights a winter.
          - The corridor's contingency case.
          - The corridor argument itself.
        choices:
          - Has to be recalculated, because it came from the sensor that read 11 degrees low.
          - Becomes a budgeted cost, because nothing about the corridor changes until the circuit exists.
          - Has to be rerun at the conductor's real strength rather than its design strength.
          - Is closed, which is what lets a shift act at 16:40 without reopening it.
        mapping: [0, 1, 2, 3]
  - title: What we know, and how well
    objective: Say how strongly each of the fortnight's claims is held, and what outlives the emergency.
    briefing: The event report has to state what is established, what is inferred and what is still a guess.
    stake: >-
      Friday, and the fortnight goes into a report. Dolores Reyes will not sign a document that states
      everything at the same confidence, because a reader who cannot tell a measurement from an inference
      will act on both the same way. June Farrow has the evidence file. Ravi Lindgren wants his forecast
      width in as a range rather than a number. Piotr Novak wants the sensor drift written as a finding
      rather than an excuse. Today you sort the fortnight's claims by how strongly each is held, put
      numbers on the ones that deserve them, and decide which of the emergency's changes should become
      permanent practice. This is the part of the fortnight that will still matter in a year.
    takeaway: A finding is worth what its evidence is worth, and saying so is what makes a report usable a year later.
    stops:
      - group: METER
        task: Choose which report claims to verify before signing, with fewer checks than claims.
        title: Measured, inferred, assumed
        place: Metering & Standards
        scene: June Farrow, the metering engineer, has four statements ready for the final report and only two verification slots left before sign-off. Some claims are already backed. Others are still inference or suspicion.
        guide: >-
          Four statements are ready for the report and you have two verification slots.
          Open each claim and read what already backs it: some are measured, some are
          inferred from something measured, and some are suspicion written confidently.
          Hold what the backing does not support, and spend the checks where a wrong
          claim would do the most damage.
        background:
          - >-
              The three categories, and why they read alike. A measured claim points at a
              record. An inferred one is a chain of reasoning from a record, which is only
              as good as its weakest step. A suspicion has neither, and in a report all
              three appear as declarative sentences in the same typeface.
          - >-
              Why consequence rather than doubt decides the spend. The least-supported claim
              is not automatically the one to check. A weakly backed statement nobody will
              act on costs little; a well-worded inference that will drive an equipment
              replacement costs a great deal if it is wrong.
          - >-
              What holding a claim means. Not deleting it — marking it as not yet supported,
              so the report says what it can stand behind and what it cannot. A finding is a
              claim the author is willing to be wrong about in public, which is a higher bar
              than believing it.
        assumes:
          - a report claim can be measured, inferred or still assumed
          - verification time is limited before the report closes
        takeaway: A signed claim is still only as strong as the evidence behind it; verification should go first to critical claims that remain unbacked.
        format: ATTEST
        question: Which claims deserve the limited verification budget before they become findings?
        attest:
          hint: You may verify only two claims. Read what currently backs each one, then spend checks where a wrong critical claim would most damage the report.
          checks: 2
          claims:
            - id: sensor-offset
              label: The corridor sensor reads about 11 °C low
              critical: true
              backed: true
              evidence: infrared survey + sag estimate + firmware date
              verification: repeat independent temperature comparison
            - id: strength-loss
              label: The conductor has permanent tensile-strength loss
              critical: true
              backed: false
              evidence: inference from corrected thermal history; no sample test
              verification: laboratory tensile test on a representative removed sample
            - id: store-efficiency
              label: The ridge store returned about 85% on the tested cycle
              critical: false
              backed: true
              evidence: one measured charge-discharge cycle
              verification: repeat at a second discharge rate
            - id: relay-cause
              label: A particular relay setting caused the original trip
              critical: true
              backed: false
              evidence: plausible sequence; no causal test yet
              verification: replay the event against the relay setting and independent event timing
          correctVerify:
            - strength-loss
            - relay-cause
        answerText: Use the two checks on conductor strength and the proposed relay cause. The sensor offset is already independently backed, while the storage-efficiency result is lower-stakes for the inquiry finding.
        why: The report contains claims at different evidence levels. The sensor offset is critical but already backed by two independent methods and a firmware date. Permanent conductor-strength loss is plausible metallurgy, yet no sample has tested it. The storage result is measured but not central to the cause finding. The proposed relay cause is both critical and still unproved. With only two verification slots, checking everything is impossible. Spend them on the critical claims whose present evidence cannot support a final finding.
      - group: LOAD
        task: Put a range on the forecast rather than a number
        title: The number that has to be a range
        place: Load & Forecasting
        scene: Lindgren's winter peak goes into the report. He wants the width in the sentence, and Reyes wants to know what the width is for. The control-room phone is already ringing.
        guide: >-
          Four reasons for a range, and they differ in what the width is for. Ask of
          each whether it is about blame, measurement, or planning. Reserve is not held
          against the expected peak. It is held against the amount by which the peak
          might exceed it, and that is the width. A single figure deletes the only
          quantity a planner needs.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        takesAsRead:
          - Charge, current, voltage and resistance
        assumes:
          - a forecast is a distribution rather than a single value
        takeaway: A prediction is only usable by a planner if it says how wrong it might be.
        format: CHOICE
        question: Why does the winter peak go in as a range rather than as a single figure?
        answerText: The width quantifies how far the actual peak could plausibly sit above the centre. That upper-tail uncertainty is what reserve planning has to cover.
        why: "Reserve is not held against the expected peak. It is held against the amount by which the peak might exceed it. That is a property of the width and not of the centre. A report that states a single megawatt figure has deleted the only quantity a planner needs. The planner then invents one — usually badly, and usually optimistically. The width is also the honest part: it says which conditions the model was calibrated for and which it was not."
        choices:
          - Because reserve must cover plausible outcomes above the forecast centre, which depends on the forecast width.
          - Because a range prevents one unusual winter peak from counting as a model failure.
          - Because the centre estimate is not measurable until after winter, while the width is measurable now.
          - Because a range automatically includes the reserve already scheduled by the operators.
        answer: Because reserve must cover plausible outcomes above the forecast centre, which depends on the forecast width.
        rebuttals:
          - The range makes the forecast more testable, not less; outcomes outside the stated width are evidence against its calibration.
          - Both centre and width are estimated from data before the season; neither requires waiting for the realized peak.
          - The forecast distribution and the reserve decision are separate. The width informs reserve; it does not already contain it.
      - group: OPS
        task: Decide which of the fortnight's changes becomes permanent
        title: What outlives the emergency
        place: System Operations
        scene: Four things the room started doing under pressure. Reyes asks which of them are worth their cost on an ordinary Monday, when nothing is going wrong. A printed network diagram lies on the desk.
        guide: >-
          All four changes are defensible and all four cost something every day. Ask of
          each whether it would have caught this fortnight's failure, and whether the
          room will still be doing it in March. The sensor's offset survived months
          because nothing was compared against it. More frequent reports of a wrong
          number are not information.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - a practice adopted under pressure has a cost that only shows up later
        takeaway: Keep the practices that would have caught the fault early, and drop the ones that only paid off because the fortnight was abnormal.
        format: CHOICE
        question: Which of the fortnight's changes is most worth keeping permanently?
        why: One of these would have caught the whole thing. The sensor's offset survived for months because nothing was ever compared against it, and an independent check costs a survey and an afternoon. Elevated reserve is expensive every night and only useful on the rare ones. That is what a width is for deciding rather than a fortnight. More frequent loading reports would not have helped at all, because the readings were wrong rather than late. More of a wrong number is not information.
        choices:
          - Cross-checking any instrument that a decision rests on against an independent method.
          - Holding reserve at the fortnight's elevated level all winter.
          - Reporting corridor loading to the control room every 15 minutes rather than every hour.
          - Requiring two operators to sign any load-shedding decision.
        answer: Cross-checking any instrument that a decision rests on against an independent method.
        rebuttals:
          - Elevated reserve costs money every night for a benefit on a handful, which is a width question rather than a policy.
          - The loading readings were wrong, not late; reporting a wrong number four times as often adds nothing.
          - A second signature slows the one decision that was both correct and time-critical.
# ------------------------------------------------------------- the rooms
# What is inside each area, for the interior the player walks into. The station
# panel is the instrument that area reasons with, so it carries that area's own
# quantity rather than a generic readout.
interiors:
  OPS:
    caption: Frequency is the whole system's supply and demand, arriving as a number.
    standLine: One unit off, frequency settled low, and two people already naming a cause.
    station:
      kind: panel
      title: System overview
      rows:
        - { label: Frequency, value: 49.82 Hz, status: low }
        - { label: Rate of change, value: 0.24 Hz/s at trip, status: high }
        - { label: Generation online, value: '6, 400 MW', status: normal }
        - { label: Spinning reserve, value: 310 MW, status: low }
  GEN:
    caption: A generator is a flywheel first and a power source second.
    standLine: Four machines online, one tripped, and a ramp rate nobody can argue with.
    station:
      kind: panel
      title: Machine hall
      rows:
        - { label: Units online, value: 4 of 5, status: low }
        - { label: Stored inertia, value: '4, 200 MW·s', status: normal }
        - { label: Fastest ramp, value: 8 MW/min, status: low }
        - { label: Governor droop, value: 4%, status: normal }
  TRANS:
    caption: A rating is a time and a temperature, not a wall.
    standLine: 1 corridor above continuous rating, and a relay that will decide in 40 minutes.
    station:
      kind: panel
      title: Corridor loading
      rows:
        - { label: Circuit 2 loading, value: 108%, status: high }
        - { label: Continuous rating, value: '1, 060 A', status: normal }
        - { label: Emergency rating, value: '1, 240 A for 30 min', status: high }
        - { label: Conductor temperature, value: 78 °C, status: high }
  DIST:
    caption: Restoration is measured in households and how long they waited.
    standLine: 11 feeders out, and 2 of them have the clinic on them.
    station:
      kind: panel
      title: Feeder status
      rows:
        - { label: Feeders out, value: 11, status: high }
        - { label: Households off, value: '14, 200', status: high }
        - { label: Priority load off, value: 2 circuits, status: high }
        - { label: Crews available, value: 3, status: low }
  LOAD:
    caption: A forecast is a distribution, and the width is what the reserve has to cover.
    standLine: Tomorrow's peak, and two estimates a factor apart on the cold snap.
    station:
      kind: panel
      title: Demand forecast
      rows:
        - { label: Forecast peak, value: '6, 900 MW', status: normal }
        - { label: Forecast width, value: plus or minus 400 MW, status: high }
        - { label: Reserve held, value: 310 MW, status: low }
        - { label: Temperature at peak, value: -4 °C, status: normal }
  METER:
    caption: A sequence of events is a claim about order, and order needs clocks.
    standLine: Three records of the same eight seconds, disagreeing about what came first.
    station:
      kind: panel
      title: Records bench
      rows:
        - { label: Fast recorder, value: 20 ms, status: normal }
        - { label: SCADA scan, value: 4 s, status: high }
        - { label: Relay clock offset, value: 1.6 s early, status: high }
        - { label: Last calibration, value: 41 days, status: low }

# ------------------------------------------------------------------ the copy
# What each place says when the player reads its panel. Keyed by group id for the
# six areas and by the plain landmark ids in site.js — a building with no entry
# here shows a bare title, and validateContent notes it.
# --------------------------------------------------------------- the warm-ups
# The seven world-graded runs, and why THIS campaign takes each of them. The
# schedule is the engine's — `engine/core/warmups.js` — so nothing here says when
# a run happens. What is here is the reason, because a run with no reason is a
# tutorial and the day model has a rule against those.
warmups:
  trial-near:
    title: Walk the yard before you touch anything
    why: >-
      Nobody works on a switching station they have not walked. Reyes, the shift supervisor,
      takes new engineers round the yard once, in daylight, before the first shift: the control
      room, the relay house, the transformer bays, the metering hut. Every one of them is
      somewhere you will be sent this fortnight, and the map on the plan card means nothing
      until you have stood in the places it names.
  greet:
    title: The shift changes at seven and nobody has met you
    why: >-
      Two crews work this station and they hand over at seven. Farrow, the metering and standards engineer,
      wants you known to both before anything goes wrong, because at four in the morning a voice
      on a radio is either somebody you have met or somebody you are going to argue with. Get
      round the yard and put a name to most of the shift before the handover is done.
  follow:
    title: The switching route, walked once by somebody who knows it
    why: >-
      Obi, the distribution lead, walks the restoration route the way it has to be walked, in
      the order the isolations happen, and she will not do it twice. Stay with her. Too far back
      and you lose which bay she turned into; too close and you are standing in front of the
      cubicle she is reading. She stops at each isolation point long enough to look at it, and
      that is where the walk is actually learned.
  hunt:
    title: Six earths, and the log says five
    item: { name: earth, plural: earths }
    why: >-
      Before the line can be re-energised every temporary earth has to be off. The log says five
      were applied. Lindgren, the load forecasting analyst, counted six going on. Until all of them are
      found and accounted for nothing gets switched in, because an earth left on a line that is
      made live is a fault the size of the station. Find them.
  canvass:
    title: Whose lights are actually back
    why: >-
      The system says eleven feeders are restored. The complaint line says otherwise, and the
      difference matters because a feeder that reads energised at the station and dead at the
      street is a fault somewhere in between. Ask along the affected streets until enough
      answers have come back to tell those two possibilities apart.
  evade:
    title: The contractor who wants a decision in the yard
    why: >-
      A contractor has been in the yard since six wanting a verbal instruction about the
      metering hut, and Reyes, the shift supervisor, has said plainly that nothing gets agreed
      on the ground without the paperwork. Keep out of his way and get your own round done.
      Anything agreed in a yard at seven in the morning is agreed by nobody in particular.
  tag:
    title: Catch Whitlock before she drives off
    why: >-
      Whitlock, the assistant operator, has the only set of relay settings that were never
      filed, and she is walking to her van. Once she is off site they are a week away. Catch her
      up before she gets there, because the whole afternoon rests on a number that currently
      exists in one person's notebook.

copy:
  OPS: <p>The control room. One long desk, a wall of the whole interconnection, and the only number on it that belongs to everybody.</p>
  GEN: <p>The machine hall. Four sets turning in step with every other machine on the system, which is what lets one number describe all of them.</p>
  TRANS: <p>Protection and switching. The rules for an argument that will happen in 80 milliseconds with nobody present.</p>
  DIST: <p>The depot. Where the network stops being a diagram and turns into a van, a pole and somebody's evening.</p>
  LOAD: <p>Forecasting. Weather, the school holidays, and whether it gets dark before people get home.</p>
  METER: <p>Standards. The question nobody wants opened during an incident: is that number the number.</p>
  GATE: <p>The gatehouse. Badge, permit to work, and the day's calls.</p>
  STORE: <p>Spares and cable. Nothing here is interesting until the night a restoration is limited by it.</p>
  TRAINING: <p>The simulator room. Last year's event, replayed at quarter speed, with the log open beside it.</p>

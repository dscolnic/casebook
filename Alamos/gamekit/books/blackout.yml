# blackout.yml — Blackout, as a book.
#
# Course: AP Physics 2 circuits and induction, with a first-year
# electrical-engineering unit. Grade 12–13. The syllabus this is measured against
# is `blackout` in tools/syllabus.js — 32 concepts and 10 equations, written
# before these questions, so page 3 of the printed book says what is still owed.
#
# The campaign is one argument with two right sides: shed load now and cut power
# to people who need it, or hold on and risk the whole interconnection. Both are
# correct on different days.
#
# The spine of the subject is one equation. Frequency is not a reading, it is the
# running balance of supply and demand, and everything a control room does
# follows from df/dt = (P_gen − P_load) / 2H. Days 1–5 build to it; the black
# start at the end of the campaign is the ordering puzzle it licenses.

theme:
  id: blackout
  title: Blackout
  subtitle: System Operator · Calder Interconnection

# ---------------------------------------------------------------- the areas
# Six, and each is a place with a different question. Operations holds the whole
# system and no single piece of it; the other five each own one physical layer.
groups:
  - id: OPS
    code: OPS
    name: System Operations
    color: '#c0392b'
    desc: The whole network at once, and the decisions that cannot wait for certainty.
    defaultLeader: reyes
    milestones: [Read the system, Find the constraint, Choose the action, Hand over the shift]
  - id: GEN
    code: GEN
    name: Generation
    color: '#d35400'
    desc: Machines that turn something into torque, and what they can be asked to do next.
    defaultLeader: haddad
    milestones: [Know the plant, Match the load, Hold the frequency, Ready to synchronise]
  - id: TRANS
    code: TRANS
    name: Transmission & Protection
    color: '#2980b9'
    desc: Getting power a long way, and the relays that decide when to give up on a line.
    defaultLeader: novak
    milestones: [Trace the path, Rate the line, Set the protection, Prove the coordination]
  - id: DIST
    code: DIST
    name: Distribution
    color: '#27ae60'
    desc: The last few kilometres, where the network stops being a diagram and becomes a street.
    defaultLeader: obi
    milestones: [Map the feeder, Balance the phases, Hold the voltage, Restore the customers]
  - id: LOAD
    code: LOAD
    name: Load & Forecasting
    color: '#8e44ad'
    desc: What people are about to do, and how much of it the system has to be ready for.
    defaultLeader: lindgren
    milestones: [Read the curve, Forecast the peak, Price the reserve, Justify the margin]
  - id: METER
    code: METER
    name: Metering & Standards
    color: '#b0762a'
    desc: Whether the numbers everybody is arguing about are the numbers.
    defaultLeader: farrow
    milestones: [Trace the instrument, Bound the error, Reconcile the records, Certify the data]

# ------------------------------------------------------------------ the cast
roster:
  - id: reyes
    name: Dolores Reyes
    role: Shift Supervisor, System Operations
    division: OPS
    bio: |
      Twenty-two years on the desk, eleven of them on nights. She runs the room
      the way a bridge is run: nobody touches a control without saying out loud
      what they expect to happen, and then whether it did.

      Her rule is that frequency is the only number on the wall that belongs to
      everybody. Voltage is local and can be argued about; frequency is the whole
      interconnection agreeing or failing to agree, and it moves before anything
      else does.

      Her limit is that she is paid to act before the picture is complete. The
      operator who waits for certainty is the operator who watches the cascade.
    quiz:
      - q: Why does Reyes treat frequency differently from voltage?
        a: Frequency is one number for the whole interconnection
        wrong:
          - Voltage instruments are more accurate than frequency instruments during a disturbance
          - Voltage cannot be measured while the system is swinging
          - Frequency matters at the generators and nowhere else
  - id: haddad
    name: Nadia Haddad
    role: Generation Lead
    division: GEN
    bio: |
      Came up through turbine commissioning and still walks a machine hall
      listening rather than reading. She can tell a governor hunting from the
      sound of it before the trend on the screen has moved.

      What she wants understood is that a generator is a flywheel first and a
      power source second. The stored rotational energy is what buys the seconds
      in which anybody gets to make a decision.

      Her limit is ramp rate. A machine that can supply four hundred megawatts
      cannot supply them in the ninety seconds after a trip, and no amount of
      wanting changes the thermal gradient in a steam drum.
    quiz:
      - q: Why does Haddad describe a generator as a flywheel first?
        a: Its stored rotational energy slows the frequency change
        wrong:
          - Because a flywheel stores more energy per tonne than a boiler and its steam plant do
          - Because the turbine and the flywheel are the same component
          - Because rotational energy costs less per megawatt than fuel
  - id: novak
    name: Piotr Novak
    role: Protection Engineer
    division: TRANS
    quiz:
      - q: Why does Novak call a relay setting the rules for an argument nobody attends?
        a: The relay has to decide alone, in milliseconds, from settings written months earlier
        wrong:
          - Relay settings are agreed by a standing committee that never meets in the same room
          - The argument is between the two ends of a line that cannot talk to each other in time
          - Nobody is allowed in the yard while protection is live
    bio: |
      Sets the relays, which means he designs the conditions under which the
      network is allowed to give up on part of itself. He describes the job as
      writing the rules for an argument that will happen in eighty milliseconds
      with nobody present.

      A relay that never trips is not a cautious relay, it is a relay that lets a
      fault burn. A relay that trips early takes out a healthy line and moves the
      overload somewhere less convenient. Coordination is the whole discipline.

      His limit is that he is protecting against faults he has to imagine in
      advance, and the cascade always finds the sequence nobody drew.
  - id: obi
    name: Chinelo Obi
    role: Distribution Lead
    division: DIST
    bio: |
      Runs the feeders, which is where the network acquires customers, trees and
      opinions. She points out that every elegant thing decided in the control
      room arrives here as a van, a pole and somebody's evening.

      Her measure of a restoration is not megawatts, it is households and how
      long they waited, and she will say so in a meeting about megawatts.

      Her limit is that the low-voltage network is only sparsely instrumented.
      Past the substation she is often reasoning from the shape of the load
      rather than from a reading.
    quiz:
      - q: Why does Obi resist reporting restoration purely in megawatts?
        a: A few large customers can dominate the megawatts restored
        wrong:
          - Megawatts restored is a settlement quantity and is not available until afterwards
          - Household supply is not counted in the system total
          - Distribution work is measured in amperes rather than in watts
  - id: lindgren
    name: Sten Lindgren
    role: Load Forecasting
    division: LOAD
    quiz:
      - q: What does Lindgren mean by calling forecasting anthropology with a thermometer?
        a: Demand is what people do, and weather is only one of the things that decides it
        wrong:
          - Forecasters interview a panel of households about their heating every winter
          - The model is built from historical temperature alone
          - Demand can be predicted from population size and nothing else
    bio: |
      Forecasts demand, which he insists is a branch of anthropology conducted
      with a thermometer. Weather, the television schedule, the school holidays
      and whether it gets dark before people get home.

      He is precise about what a forecast is: a distribution, not a number. The
      useful output is the width, because the width is what the reserve has to
      cover.

      His limit is that the events worth forecasting are rare by construction, so
      the model is always best calibrated for the days that matter least.
  - id: farrow
    name: June Farrow
    role: Metering & Standards
    division: METER
    bio: |
      Owns the question nobody wants to open during an incident: is that number
      the number. Instrument transformers, telemetry lag, clock skew, and the
      cheerful confidence of a meter reading the wrong side of a saturated core.

      She keeps the traceability chain because after the event there will be an
      inquiry, and the inquiry will run on the records rather than on anybody's
      memory of the night.

      Her limit is that she is usually reconstructing rather than observing, and
      the highest-value seconds are the ones with the worst data.
    quiz:
      - q: Why does Farrow distrust telemetry during a fast disturbance?
        a: Scan rates and clock skew can put readings in the wrong order
        wrong:
          - Instrument transformers saturate during a fault and stop reporting altogether
          - Telemetry stops being sent once frequency leaves its band
          - Digital meters are less accurate than the analogue ones they replaced
  - id: whitlock
    name: Aaron Whitlock
    role: Assistant Operator
    division: OPS
    quiz:
      - q: Why is the log Whitlock keeps worth more than the reports written afterwards?
        a: It records what the room knew at the time, before anybody knew how it ended
        wrong:
          - It is the only document the regulator is entitled to ask the company for
          - Reports are written afterwards by people who were not on shift that night
          - The log records exact times and the reports do not
    bio: |
      Second seat on nights, three years in, and the person who actually keeps
      the log. Has read every sequence-of-events report the company owns and can
      quote which ones contradict the official account.
  - id: sarraf
    name: Mina Sarraf
    role: Wind Fleet Controller
    division: GEN
    quiz:
      - q: Why does Sarraf say curtailing a turbine is not waste?
        a: Energy that cannot reach a customer was never available, whatever the wind was doing
        wrong:
          - Curtailed output is held in storage and released later the same night
          - The fleet is paid the same under contract whether it runs or not
          - Turbines last longer when they are not run at full output
    bio: |
      Dispatches the ridge fleet from a desk with more forecast on it than
      telemetry. Explains patiently and often that curtailing a turbine is not
      waste when the alternative is a line at its thermal limit.
  - id: dube
    name: Thabo Dube
    role: Substation Technician
    division: TRANS
    quiz:
      - q: Why does Dube read a switching order back before he touches anything?
        a: Saying it aloud is the one chance to catch a wrong item before it is irreversible
        wrong:
          - The control room records the readback afterwards as proof of who is liable
          - Reading aloud is required by the radio protocol in the yard
          - It gives the control room time to cancel the instruction
    bio: |
      Does the switching in the yard when the control room asks for it, in the
      order it is written, reading it back before he touches anything. Has opinions
      about people who improvise switching sequences.
  - id: kowalczyk
    name: Ewa Kowalczyk
    role: Field Crew Lead
    division: DIST
    quiz:
      - q: Why does Kowalczyk know which streets have the dialysis clinic on them?
        a: Restoration order is decided by what waiting costs, not by how many houses are on the feeder
        wrong:
          - Those streets are required by law to be restored first in every outage
          - Medical addresses are the only ones the fault-finding system records
          - Crews are paid a premium for restoring critical premises
    bio: |
      Runs the crew that finds the fault, which is usually a tree, and puts the
      feeder back. Knows which streets have the hospital, the dialysis clinic and
      the two houses on home oxygen.
  - id: alvarez
    name: Rafael Alvarez
    role: Demand Analyst
    division: LOAD
    quiz:
      - q: What is Alvarez's counterfactual demand curve for?
        a: It says what demand would have been without the event, which is what the loss is measured against
        wrong:
          - It predicts what demand will be over the course of the following week
          - It shows which feeders were restored in which order
          - It converts megawatts into megawatt-hours for the report
    bio: |
      Builds the load curves and the counterfactuals. Spends the day after an
      event working out what demand would have been if the event had not happened,
      which is the number every settlement argument turns on.
  - id: bergström
    name: Klara Bergström
    role: Calibration Technician
    division: METER
    quiz:
      - q: Why will Bergström not be hurried over a disputed reading?
        a: A reading is only admissible if the instrument's traceability can be shown, and that takes as long as it takes
        wrong:
          - Calibration records can only be updated at the end of an accounting month
          - She is the only person permitted to touch the standards
          - A rushed calibration would damage the reference instrument
    bio: |
      Keeps the standards traceable and the calibration records current. The
      cheerful arbiter of whether a disputed reading is admissible, and immune to
      being hurried.

# ------------------------------------------------------------------- glossary
glossary:
  - name: Frequency
    aliases: [frequency, hertz]
    def: How many times a second the alternating supply completes a cycle. It is the same number everywhere
      on one interconnection, and it moves up when generation exceeds demand and down when demand exceeds
      generation.
  - name: Load
    aliases: [load, demand]
    def: The total power being drawn from the system at a given moment.
  - name: Megawatt
    aliases: [megawatt, mw]
    def: A million watts. The unit a power system is argued about in; a large generating unit is a few
      hundred of them.
  - name: SCADA
    aliases: [scada]
    def: The monitoring system that collects readings from substations and presents them in the control
      room. It samples every few seconds, which is slow compared with a fault.
  - name: Inertia
    aliases: [inertia, rotational inertia]
    def: The rotational energy stored in spinning generators. It resists a change in frequency, which is
      what buys time for anything else to respond.
  - name: RMS
    aliases: [rms, root mean square]
    def: The steady value that would deliver the same power as a varying one. Mains voltages are quoted
      this way, not as their peak.
  - name: Power factor
    aliases: [power factor]
    def: The fraction of the apparent power that does real work, equal to the cosine of the angle between
      voltage and current.
  - name: Reactive power
    aliases: [reactive power, kvar, mvar]
    def: Power that flows back and forth without being consumed. It does no work but it occupies capacity
      and it is what moves voltage.
  - name: Apparent power
    aliases: [apparent power, volt-ampere]
    def: The product of RMS voltage and RMS current, whatever the phase between them. It is what a cable
      and a transformer are rated for.
  - name: Droop
    aliases: [droop, governor droop]
    def: A deliberate setting that makes a generator reduce output as frequency rises, so several machines
      share a change in load without fighting each other.
  - name: Contingency
    aliases: [contingency, n-1]
    def: A credible single failure the system is required to survive without shedding load.
  - name: Load shedding
    aliases: [load shedding, shed load]
    def: Disconnecting customers on purpose to bring demand down to what generation can supply.
  - name: Calibration
    aliases: [calibration, calibrate, calibrated]
    def: Checking an instrument against a standard already known to be right, so that its readings mean
      something. A drifted instrument is confident and wrong, and it does not say which.
  - name: Instrument transformer
    aliases: [instrument transformer, current transformer]
    def: A device that scales a large voltage or current down to something a meter can read safely.
  - name: Feeder
    aliases: [feeder]
    def: One distribution circuit leaving a substation, with the homes and businesses it supplies
      spread along it.

# ---------------------------------------------------------------- the days
missions:
  - title: The number on the wall
    objective: Establish what the frequency is actually telling the room before anybody acts on it.
    briefing: A unit tripped at 04:12 and the frequency has not come back to where it started.
    stake: >-
      Tuesday, 04:12, and the largest unit on the Calder system has tripped without warning. Frequency fell
      and then steadied somewhere below where it began, which Dolores Reyes says matters more than the fall
      itself — a system that stops falling has found a new balance, and the new balance is short. Nadia Haddad
      has machines that can make up the shortfall but not in the next two minutes. June Farrow wants the
      records checked before anybody calls it a lost unit, and Reyes is not waiting: a system this far
      short does not get more certain while you read about it. This morning Reyes is right. Today you read what the
      frequency is telling you, work out how much generation actually went missing, and decide what to ask
      for first. Read it as a fault on one machine and you will spend the morning fixing the wrong thing.
    takeaway: Frequency is not a reading from a place; it is the whole system's supply and demand, arriving as a number.
    stops:
      - group: OPS
        task: From a falling trend to a statement about the system
        title: What a frequency trend is evidence of
        place: System Operations
        scene: >
          The wall shows frequency dropping for eight seconds and then flattening, low. Aaron Whitlock,
          the assistant operator, has the log open and wants to know what to write in it. Two people in
          the room have already named a cause.
        assumes:
          - an alternating supply has a frequency measured in cycles per second
        takeaway: A frequency deviation is a statement about the whole interconnection, not about one machine.
        format: PROTOCOL
        why: >
          Frequency is set by the balance between what the machines generate and what the customers draw,
          everywhere at once. That is because every synchronous machine on the system turns in step. So a
          fall means demand now exceeds generation. The rate of the fall measures the size of the mismatch
          against the spinning inertia that was there to absorb it. Flattening is not recovery. The governors
          have found a new equilibrium at a lower speed, and it will stay there until something adds real
          power. Voltage tells you where the problem is. Frequency tells you that there is one, and how
          large.
        rebuttals:
          - A common frequency across the system is the machines turning in step, not a coincidence of separate meters.
          - The rate of fall measures the size of the mismatch against the inertia available, which is why it is the first number to read.
          - Flattening low is a new equilibrium the governors have settled into, not the system recovering.
          - Voltage is the local quantity; it tells you where, and it is why it disagrees between substations.
        scenarios:
          - Every substation reports the same frequency to two decimal places.
          - The trend fell steeply for the first two seconds, then more slowly.
          - The frequency has stopped falling and is sitting below its starting value.
          - Two substations report voltages that differ by three per cent.
        choices:
          - The machines are all turning in step, so this is one system-wide quantity.
          - The steepness measures the mismatch against the inertia that was there to absorb it.
          - The governors have found a new balance at a lower speed, and it will stay there.
          - Voltage is local, which is what makes it useful for saying where rather than whether.
        mapping: [0, 1, 2, 3]
      - group: GEN
        task: Estimate the generation that went missing
        title: How much power actually left the system
        place: Generation Hall
        scene: >
          Haddad needs a number before she starts anything. The only clean evidence is the first two seconds
          of the trend, and the inertia figure for what was online overnight.
        assumes:
          - a rate of change can be read off the steep part of a trend
        takeaway: The initial rate of frequency change measures the size of the imbalance, given the inertia.
        format: BALLPARK
        question: Estimate the generation lost at the moment of the trip.
        why: >
          In the first instant after a trip nothing has responded yet. No governor, no reserve. The only
          thing opposing the imbalance is the rotational energy already spinning. That gives the swing
          relation: the rate of frequency change equals the power imbalance divided by twice the stored
          inertia, in the same units. Rearranged, the imbalance is the rate of change times twice the
          inertia, times the nominal frequency to get back to megawatts. It is the cleanest measurement the
          first two seconds offer, and it arrives before any telemetry from the tripped plant.
        estimate:
          prompt: >
            Frequency fell at 0.30 Hz per second over the first two seconds. The machines online held
            25,000 MW·s of stored kinetic energy. Nominal frequency is 50 Hz.
          question: Choose the stored energy, the rate of fall and the nominal frequency.
          labels:
            - 25000 MW·s  (stored kinetic energy)
            - 0.30 Hz/s  (initial rate of fall)
            - 50 Hz  (nominal frequency)
            - 0.18 Hz  (the settled deviation)
            - 6400 MW  (generation online)
          values: [25000, 0.30, 50, 0.18, 6400]
          slots: 3
          template: '2 × {0} × {1} ÷ {2}'
          formula: 2*a*b/c
          correct: [0, 1, 2]
          target: 300
          tolerance: 45
          units: MW
          solution: ΔP = 2 × 25,000 × 0.30 ÷ 50 = 300 MW.
          explanation: >
            About three hundred megawatts. That is a unit, not a faulty meter. The settled deviation and the
            generation online are both real figures, and neither belongs here. The first is what the
            governors did afterwards. The second is the denominator for a different question.
          givens:
            - Stored kinetic energy online is 25,000 MW·s
            - Initial rate of fall is 0.30 Hz per second
            - Nominal frequency is 50 Hz
          relationship: >
            Power imbalance = 2 × the stored kinetic energy × the rate of frequency change ÷ the nominal
            frequency, with the energy in megawatt-seconds and the rate in hertz per second.
        answerText: About 300 MW.
      - group: METER
        task: Decide whether the trend is admissible evidence
        title: The order the records claim things happened in
        place: Metering & Standards
        scene: >
          June Farrow has three records of the same eight seconds and they do not agree about what
          happened first. The inquiry will run on these, and one of them is timestamped from a clock
          nobody has checked since spring.
        assumes:
          - a recorded value has a time attached to it, and the time can be wrong
        takeaway: A sequence of events is a claim about order, and order needs clocks that were traceable at the time.
        format: DIAGNOSIS
        headline: Three records of the same eight seconds disagree about which happened first.
        task: Which explanation fits every record, including the ones that look fine?
        readings:
          - { zone: Fast recorder, label: Sample interval, value: 20 ms, status: normal, note: its own GPS clock }
          - { zone: SCADA, label: Scan interval, value: 4 s, status: alarm, note: two scans covered the whole event }
          - { zone: Relay log, label: Timestamp, value: 1.6 s early, status: alarm }
          - { zone: Relay log, label: Internal counter, value: consistent, status: normal, note: intervals agree with the fast recorder }
        choices:
          - { label: The relay operated 1.6 seconds before the trip, mechanism: Its timestamp is earlier, so its action came first. }
          - { label: The relay clock has drifted and its ordering is still good, mechanism: Its intervals match the fast recorder even though its absolute time does not. }
          - { label: The fast recorder is the one that is wrong, mechanism: A single instrument disagreeing with two others is usually the faulty one. }
          - { label: Nothing to explain — records always disagree slightly, mechanism: Ordinary scatter between systems, no cause needed. }
        answer: The relay clock has drifted and its ordering is still good
        why: >
          A record carries two different claims and they fail independently. The absolute timestamp says
          when, and it is only as good as the clock that stamped it. The intervals between a record's own
          entries say in what order and how far apart. Those survive a drifting clock intact.
          Here the relay's intervals agree with the GPS-locked recorder while its absolute time does not,
          which is exactly the signature of drift rather than of an early operation. The SCADA scan is not
          wrong either — it is simply too slow to order anything inside a four-second window, and treating
          its two samples as a sequence is how an inquiry invents a cause.
        rebuttals:
          - Reading the early timestamp as an early operation trusts the absolute time, which is the part that failed.
          - The fast recorder is GPS-locked and the relay's own intervals agree with it, so it is the reference here.
          - Records that disagree by 1.6 seconds in a fault sequence are not ordinary scatter; that is longer than the whole event.

  - title: What the line can carry
    objective: Decide which circuit takes the flow once one path is gone.
    briefing: With the unit off, the flow has redistributed and one corridor is running warm.
    stake: >-
      Wednesday, and the replacement generation is coming from the wrong side of the system, which means it
      is arriving down two circuits instead of three. Piotr Novak has a corridor sitting above its
      continuous rating and a relay that will take the decision away from the room in about forty minutes
      if nobody else does. The forty minutes comes off a thermal record June Farrow has not verified, and she
      says so. Thabo Dube is in the yard waiting for a switching instruction. Today you rate
      the line honestly, work out where the flow goes if it trips, and decide whether to move generation
      or accept the risk. A thermal rating is not a cliff, and treating it as one is how a warm line becomes
      two cold ones.
    takeaway: A rating is a time and a temperature, not a wall, and what matters is where the flow goes next.
    stops:
      - group: TRANS
        task: Put the overload response in the order it has to happen
        title: What you do before a relay does it for you
        place: Transmission Control
        scene: >
          The corridor is at 108 per cent of continuous rating and rising slowly. Novak wants the response
          in an order he can hand to Dube as a written instruction.
        assumes:
          - a conductor heats up over minutes, not instantly
        takeaway: The order is set by what is reversible: measure, then reduce, then reconfigure, then shed.
        format: SEQUENCE
        why: >
          A conductor's rating is a thermal limit reached over time. So the first move is to establish how
          much time there is: the emergency rating, and the minutes it is good for. Then the cheapest
          reversible action, which is to redispatch generation so less flow takes that path. Reconfiguring
          the network comes next, because switching changes what the remaining contingencies are and cannot
          be undone in seconds. Shedding load is last. Not because it is drastic, but because it is the only
          step that takes the decision away from customers, and every earlier step that works makes it
          unnecessary. In the wrong order, an operator sheds load to protect a line that could have been
          unloaded by moving two hundred megawatts.
        cards:
          - Establish the emergency rating and how long it is valid for.
          - Redispatch generation so less flow takes the loaded path.
          - Reconfigure the network to open another route.
          - Shed load on the feeders behind the constraint.
        order: [0, 1, 2, 3]
      - group: LOAD
        task: Estimate the loss in the loaded corridor
        title: The power that never arrives
        place: Load & Forecasting
        scene: >
          Sten Lindgren, who forecasts demand, wants the loss figure before the morning call. The argument
          about moving generation is really an argument about waste.
        assumes:
          - current through a resistance dissipates power as heat
        takeaway: Loss rises with the square of current, which is why a small overload costs more than it looks.
        format: BALLPARK
        question: Estimate the power lost as heat in the loaded corridor.
        why: >
          Loss in a conductor is the current squared times the resistance, and the square is the whole
          point. A circuit carrying ten per cent more current does not lose ten per cent more, it loses
          about twenty-one per cent more, and the heat is what the thermal rating is about in the first
          place. This is also the argument for transmitting at high voltage: for a given power, raising the
          voltage lowers the current, and lowering the current lowers the loss by its square. The resistance
          here is the whole corridor's, and the answer is a real quantity of fuel nobody gets to sell.
        estimate:
          prompt: >
            The corridor is carrying 1,150 A per phase through a total resistance of 4.2 ohms, on three
            phases.
          question: Choose the current, the resistance and the number of phases.
          labels:
            - 1150 A  (current per phase)
            - 4.2 Ω  (resistance of the corridor)
            - 3  (phases)
            - 400 kV  (line voltage)
            - 0.96  (power factor)
          values: [1150, 4.2, 3, 400, 0.96]
          slots: 3
          template: '{0} × {0} × {1} × {2}'
          formula: a*a*b*c
          correct: [0, 1, 2]
          target: 16663500
          tolerance: 1500000
          units: W
          solution: P = 3 × 1150² × 4.2 ≈ 1.7 × 10⁷ W ≈ 17 MW.
          explanation: >
            About seventeen megawatts, turned into warm air. The line voltage and the power factor both
            belong to other calculations — voltage sets what current is needed for a given power, and power
            factor decides how much of the apparent power does work — but neither enters the loss itself.
          givens:
            - Current is 1,150 A per phase
            - Corridor resistance is 4.2 Ω
            - There are three phases
          relationship: >
            Loss = the number of phases × the current squared × the resistance, which is why loss rises
            with the square of current and not in step with it.
        answerText: About 17 MW.
      - group: OPS
        task: Choose what to do about the warm corridor
        title: The contingency you are actually protecting against
        place: System Operations
        scene: >
          Reyes wants a decision. The corridor is inside its emergency rating for another half hour, and
          the question on the table is what happens to the rest of the system if it goes.
        assumes:
          - a network is required to survive the loss of any single element
        takeaway: A rating is only interesting alongside what the flow does when that element is gone.
        format: CHOICE
        question: What makes the loaded corridor a problem worth acting on now?
        choices:
          - It is above its continuous rating, and continuous ratings are not meant to be exceeded at all.
          - If it trips, the flow lands on a circuit that cannot carry it, and the next trip is not optional.
          - The loss of seventeen megawatts is expensive and the fuel has to be paid for by somebody.
          - The relay protecting it may be miscoordinated and could operate before its setting.
        answer: If it trips, the flow lands on a circuit that cannot carry it, and the next trip is not optional.
        why: >
          Running above a continuous rating is a decision about time and temperature. The emergency rating
          exists so that decision can be made. What turns this from expensive into dangerous is the
          contingency. One corridor is already loaded. Lose it, and its flow lands on neighbours that are
          not rated for the sum. That second trip is a relay working correctly, not a choice anybody makes.
          This is the whole of the N-1 rule. The system is not required to be comfortable. It is required to
          survive any single failure without cascading. So the question is never whether this line is hot.
          It is what is hot after the next thing goes.
        rebuttals:
          - Continuous ratings are exceeded deliberately and often; that is what an emergency rating is for.
          - The loss matters and is worth about seventeen megawatts of fuel, but expense is not what makes this urgent.
          - Miscoordination is a real fault worth finding, and it is not what is happening here.

  - title: The last few kilometres
    objective: Get customers back on in an order that can be defended afterwards.
    briefing: Eleven feeders are still dead and the crews can only be in one place at a time.
    stake: >-
      Thursday, and the transmission side is steady, but eleven distribution feeders are still dead. Chinelo
      Obi has three crews and fourteen thousand households in the dark. One of her circuits carries a
      dialysis clinic. Another carries a thousand homes. Ewa Kowalczyk is at the first fault already, and it
      is a tree. Today you work out why the far end of a long feeder sits below limit, decide what sets the
      current a conductor may carry, and choose which circuit gets the first crew. Every hour of this is
      somebody sitting in the cold. The order you choose is the order an inquiry will read back to you.
    takeaway: Restoration is a series of choices about people, made with instruments that only see the substation.
    stops:
      - group: DIST
        task: Estimate the volt drop to the end of the feeder
        title: Why the far end sits low
        place: Distribution Depot
        scene: >
          The substation end of the feeder is at nominal voltage. Customers four kilometres along it are
          complaining, and the only meter is back at the substation.
        assumes:
          - current flowing through a resistance produces a drop in voltage
        takeaway: Volt drop is set by the current and by both parts of the line's impedance.
        format: BALLPARK
        question: Estimate the volt drop from the substation to the far end.
        why: >
          A conductor is not a wire in a diagram. It has resistance and it has reactance, and current
          through either one costs voltage. The two do not add straight, because the current is not in step
          with the voltage. The resistance takes its share in proportion to the in-phase part of the
          current, and the reactance takes its share in proportion to the out-of-phase part. That is why
          power factor appears in a question about voltage. It also explains why adding reactive support at
          the far end lifts the voltage without sending any more real power down the line.
        estimate:
          prompt: >
            The feeder carries 310 A. Over four kilometres it has 1.8 ohms of resistance and 0.9 ohms of
            reactance. The load runs at 0.95 power factor, so sin of the angle is 0.31.
          question: Choose the current, both parts of the impedance, and the two parts of the angle.
          labels:
            - 310 A  (feeder current)
            - 1.8 Ω  (resistance)
            - 0.95  (cos φ)
            - 0.9 Ω  (reactance)
            - 0.31  (sin φ)
            - 11000 V  (nominal feeder voltage)
          values: [310, 1.8, 0.95, 0.9, 0.31, 11000]
          slots: 5
          template: '{0} × ({1} × {2} + {3} × {4})'
          formula: a*(b*c+d*e)
          correct: [0, 1, 2, 3, 4]
          target: 616.6
          tolerance: 60
          units: V
          solution: ΔV = 310 × (1.8 × 0.95 + 0.9 × 0.31) ≈ 617 V.
          explanation: >
            About six hundred volts lost along the way, on an eleven thousand volt feeder. That is over five
            per cent, which is why the far end complains while the substation meter looks healthy. The
            nominal voltage is what the drop is judged against. It is not part of working the drop out.
          givens:
            - Feeder current is 310 A
            - Resistance is 1.8 Ω and reactance is 0.9 Ω
            - Power factor is 0.95, so sin φ is 0.31
          relationship: >
            Volt drop ≈ the current × (the resistance × cos φ + the reactance × sin φ), with cos φ the
            power factor of the load.
      - group: TRANS
        task: Match each observation to what it constrains
        title: What actually limits a conductor
        place: Transmission & Protection
        scene: >
          Novak is asked to allow more current down a circuit for the afternoon. He wants each reason for
          saying no matched to the thing it is actually about.
        assumes:
          - a conductor warms up as current passes through it
        takeaway: Current sets the heat, voltage sets the insulation, and the two limits are separate.
        format: PROTOCOL
        why: >
          Two different limits get confused. Heat comes from current, and it does not care what voltage the
          conductor is at. The insulation and the clearances care about voltage, and they do not care what
          current is flowing. So a circuit can be at nominal voltage and still be over its thermal limit,
          which is the case in front of the room. Volt drop is a third thing again, a consequence of
          current, and it is a customer problem rather than a safety one. Sag is where heat turns into a
          clearance question, which is the one place the two meet.
        rebuttals:
          - Heating is proportional to current squared and is independent of the voltage the conductor sits at.
          - Insulation and clearance are set by voltage, and are unaffected by how much current flows.
          - Volt drop follows from current along the impedance, and it reaches the customer before it reaches a limit.
          - Sag is thermal expansion, which is the one point where a heat limit becomes a clearance limit.
        columns:
          - What somebody has noticed
          - What it is a constraint on
        scenarios:
          - The conductor is running at 78 °C on a 75 °C continuous rating.
          - The circuit has been switched to a higher nominal voltage than it was built for.
          - Customers at the end of the circuit report low voltage in the evening peak.
          - The span over the road has dropped by a metre since the morning.
        choices:
          - A heat limit, set by current and not by voltage at all.
          - An insulation limit, set by voltage and not by current.
          - A volt drop, which is a consequence of current along the line's impedance.
          - A clearance limit, which is where a heat limit turns into a safety one.
        mapping: [0, 1, 2, 3]
      - group: OPS
        task: Decide which circuit gets the crew first
        title: The order somebody will read back to you
        place: System Operations
        scene: >
          Three crews, eleven dead feeders, and a list in front of Reyes that mixes household counts with
          one clinic and one pumping station.
        assumes:
          - a crew can only work one fault at a time
        takeaway: The first crew goes where the consequence of waiting is worst, not where the count is biggest.
        format: TRIAGE
        question: Which feeder should take the first crew?
        choices:
          - The feeder with 4,100 households, faulted at the substation end, four hours' work.
          - The dialysis clinic feeder — 180 homes, one pole, an hour's work.
          - The feeder with 2,600 households and a fault nobody has located yet.
          - The feeder feeding the water pumping station, already on its standby supply.
        answer: The dialysis clinic feeder — 180 homes, one pole, an hour's work.
        why: >
          Two things decide this, and household count is only one of them. The first is what waiting costs,
          and for a dialysis clinic it is measured in treatments rather than in inconvenience. The second is
          how long the work takes, because a one-hour job frees the crew to take the next fault the same
          shift. The clinic circuit is worst on the first and best on the second, so it goes first on both
          counts. The largest feeder is a four-hour job and stays a four-hour job whenever it is started.
          The unlocated fault cannot be scheduled at all until somebody has found it. The pumping station is
          already supplied, which is what a standby supply is for.
        rebuttals:
          - The biggest count is a four-hour job, and starting it commits a crew for the whole shift.
          - A fault nobody has located cannot be given a duration, so it cannot be scheduled against the others.
          - The pumping station is running on its standby supply, so it is not off, and it can wait.

  - title: Is that number the number
    objective: Establish which readings the incident account is allowed to rest on.
    briefing: The report is due and two of the figures in it come from instruments nobody has checked.
    stake: >-
      Friday, and the account of Tuesday night has to be written down. Dolores Reyes wants it filed today so the
      week can close. June Farrow will not sign it while
      two of its figures come from instruments last calibrated in the spring. Nadia Haddad needs a machine
      back on the bars before the evening peak, and there is a right order for that which is not the order
      anybody is in a hurry to follow. Today you work out what the system was actually delivering, put the
      steps of synchronising a machine in the order physics requires, and settle an argument between a meter
      and an oscilloscope. This time Farrow is right, and the delay is the cheapest thing in the week: a number
      in a report outlives everybody who knew what it meant.
    takeaway: A reading is a claim about one quantity, and two instruments can disagree while both are right.
    stops:
      - group: METER
        task: Estimate the power the circuit was delivering
        title: What three phases actually add up to
        place: Metering & Standards
        scene: >
          Farrow has line voltage, line current and a power factor from the night of the event. The report
          claims a figure for delivered power that nobody has reproduced.
        assumes:
          - a three-phase supply carries power on three conductors at once
        takeaway: Three-phase power from line quantities carries a factor of root three, and it is not three.
        format: BALLPARK
        question: Estimate the real power the circuit was delivering.
        why: >
          The tempting mistake is to multiply by three, because there are three phases. The factor is the
          square root of three instead, and the reason is that line voltage is measured between two phases
          rather than from one phase to neutral. Those two ways of measuring differ by root three, and the
          formula written in line quantities carries it. Power factor then takes its usual bite, because
          only the in-phase part of the current does work. Get the factor wrong and the answer is out by
          about seventy per cent, which is more than enough to change what the report concludes.
        estimate:
          prompt: >
            The circuit was at 11,000 V between lines, carrying 310 A per line, at 0.95 power factor. Root
            three is about 1.732.
          question: Choose root three, the line voltage, the line current and the power factor.
          labels:
            - 1.732  (√3)
            - 11000 V  (line voltage)
            - 310 A  (line current)
            - 0.95  (power factor)
            - 3  (number of phases)
            - 0.31  (sin φ)
          values: [1.732, 11000, 310, 0.95, 3, 0.31]
          slots: 4
          template: '{0} × {1} × {2} × {3}'
          formula: a*b*c*d
          correct: [0, 1, 2, 3]
          target: 5610814
          tolerance: 400000
          units: W
          solution: P = 1.732 × 11,000 × 310 × 0.95 ≈ 5.6 × 10⁶ W ≈ 5.6 MW.
          explanation: >
            About five and a half megawatts. Using three instead of root three gives nearly ten, which is a
            different circuit. The phase count is a real fact about the system and is not the multiplier
            here. Sin φ belongs to the reactive part, which is a separate question.
          givens:
            - Line voltage is 11,000 V and line current is 310 A
            - Power factor is 0.95
            - Root three is about 1.732
          relationship: >
            Real power = √3 × the line voltage × the line current × the power factor, with the voltage
            measured between lines rather than to neutral.
      - group: GEN
        task: Put the steps of synchronising in the order physics requires
        title: Four things that have to agree before the breaker closes
        place: Generation Hall
        scene: >
          Haddad has a machine at rest and a system running at nominal. She wants the sequence written down
          before anybody is standing at the panel.
        assumes:
          - a generator joined to a live system is forced to turn at the system's speed
        takeaway: Speed, then voltage, then phase angle, and only then the breaker.
        format: SEQUENCE
        why: >
          Each step removes one way of getting hurt, and the order is set by how violent the mismatch is.
          Speed comes first, because closing onto a system turning at a different rate slams the rotor into
          step and can shear a shaft. Voltage next, because a difference in size drives a heavy current of
          reactive power the instant the contacts meet. Phase angle after that, since it is the last thing
          left and the one that has to be caught in a narrow window as the two drift past each other.
          The breaker closes last, on all three conditions at once, which is the only moment it is safe.
        cards:
          - Bring the machine up to the system's frequency.
          - Match the machine's voltage to the system's.
          - Wait for the phase angle between them to close on zero.
          - Close the breaker.
        order: [0, 1, 2, 3]
      - group: TRANS
        task: Settle the argument between the meter and the scope
        title: Two instruments, two quantities
        place: Transmission & Protection
        scene: >
          An oscilloscope on the busbar shows a peak of 325 volts. The panel meter beside it reads 230. Both
          were calibrated last month and neither has moved.
        assumes:
          - an alternating voltage changes continuously through each cycle
        takeaway: Peak and RMS are different quantities, and one is the other divided by root two.
        format: CHOICE
        question: Which instrument is reporting the wrong voltage?
        choices:
          - The oscilloscope, because 325 volts is not a voltage this system runs at.
          - Neither, since the scope shows peak and the meter shows RMS.
          - The meter, because it is averaging and averaging loses the true value.
          - Both, because two instruments this far apart cannot both be calibrated.
        answer: Neither, since the scope shows peak and the meter shows RMS.
        why: >
          An alternating voltage does not have one value, so any single number is a summary and the summary
          has to be named. The peak is the highest the waveform reaches. The RMS value is the steady voltage
          that would deliver the same power into a resistance, and for a sine wave it is the peak divided by
          root two. Divide 325 by 1.414 and the meter's 230 comes straight out. This is why mains voltages
          are quoted as RMS everywhere: it is the figure that predicts heating and power. The peak still
          matters, but it matters to insulation rather than to power.
        rebuttals:
          - 325 volts is exactly what a 230 volt RMS supply peaks at, so it is the expected figure, not an impossible one.
          - The meter is reporting RMS rather than a simple average, and RMS is the quantity that predicts power.
          - Both instruments agree once you notice they are reporting different quantities, so neither is out of calibration.

  - title: Enough in the tank
    objective: Decide what the system is holding back, and whether it is enough.
    briefing: Tomorrow's peak is colder than the forecast the reserve was set against.
    stake: >-
      Monday, and the forecast for tomorrow's evening peak has moved four degrees colder. Sten Lindgren says
      the number has not changed much but the width has, and the width is what the reserve has to cover.
      Rafael Alvarez has the storage figures from the weekend and they are worse than the brochure. Dolores
      Reyes has to say tonight how much generation is held back and how much is sold. Today you work out
      what the battery will really give back, decide why the transmission side runs at high voltage at all,
      and choose what evidence is worth buying before the peak. Hold too much back and it is wasted. Hold
      too little and Thursday happens again.
    takeaway: A reserve is bought with something, and the argument is always about how much uncertainty it has to cover.
    stops:
      - group: LOAD
        task: Estimate what the store gives back
        title: What comes out against what went in
        place: Load & Forecasting
        scene: >
          The battery took charge overnight on Saturday and discharged into Sunday's peak. Alvarez has both
          totals and the brochure figure, and the three do not agree.
        assumes:
          - storing energy and recovering it both lose some of it
        takeaway: Round-trip efficiency is measured on the energy, not on the power rating.
        format: BALLPARK
        question: Estimate the round-trip efficiency of the store.
        why: >
          Everything that moves energy in and out loses a share of it, in the converter, in the chemistry
          and in keeping itself cool. Round-trip efficiency is the plain ratio of what came out to what went
          in, over a whole cycle, and it is the only figure that tells you what the store is worth as
          reserve. A power rating is a different claim: it says how fast, not how much. Duration is a third
          one again. Read the rating as reserve and you will count megawatts the store cannot sustain for
          long enough to matter.
        estimate:
          prompt: >
            The store took in 220 MWh over Saturday night and gave back 187 MWh into Sunday's peak. It is
            rated at 50 MW for four hours.
          question: Choose the energy out and the energy in.
          labels:
            - 187 MWh  (energy returned)
            - 220 MWh  (energy taken in)
            - 50 MW  (power rating)
            - 4 h  (rated duration)
          values: [187, 220, 50, 4]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 0.85
          tolerance: 0.03
          units: fraction
          solution: η = 187 ÷ 220 = 0.85, or 85 per cent.
          explanation: >
            Eighty-five per cent, so fifteen per cent of everything put in never comes back. The rating and
            the duration describe how the store behaves, not how much survives the trip. Multiply them and
            you get an energy figure that has nothing to do with this question.
          givens:
            - Energy in was 220 MWh
            - Energy returned was 187 MWh
          relationship: Round-trip efficiency = the energy out ÷ the energy in, measured over a full cycle.
      - group: GEN
        task: Say why the transmission side is at high voltage
        title: The reason the wires are not at wall voltage
        place: Generation Hall
        scene: >
          A visitor asks Haddad why the machine makes power at twenty thousand volts and the line outside
          runs at four hundred thousand.
        assumes:
          - a transformer changes voltage in proportion to its turns
        takeaway: Raising voltage lowers current for the same power, and loss falls with the square of current.
        format: CHOICE
        question: Why is power sent long distances at high voltage?
        choices:
          - Because high voltage pushes the power along the line faster.
          - Because higher voltage means less current, and loss goes as current squared.
          - Because insulation is cheaper than conductor, so high voltage costs less to build.
          - Because generators cannot be built to produce power at low voltage.
        answer: Because higher voltage means less current, and loss goes as current squared.
        why: >
          Power is voltage times current, so a given amount of power can be sent as a lot of current at low
          voltage or a little current at high voltage. Loss in the conductor is the current squared times
          the resistance, and that square is what decides the matter. Halve the current and the loss falls
          to a quarter. A transformer is what makes the trade available, changing voltage in proportion to
          its turns while leaving the power almost untouched. This is the whole reason a transmission system
          exists as a separate voltage level rather than as long extension leads.
        rebuttals:
          - Power travels at nearly the speed of light on any line; voltage does not change how fast it arrives.
          - Insulation for high voltage is expensive rather than cheap, and it is a cost accepted to save the loss.
          - Generators are built at whatever voltage suits the machine, and a transformer takes it from there.
      - group: OPS
        task: Fund the evidence that would change tonight's decision
        title: What is worth knowing before the peak
        place: System Operations
        scene: >
          Reyes has a small budget and four things she could find out before the evening peak. Only some of
          them would change what she does about the reserve.
        assumes:
          - information is only worth buying if a decision turns on it
        takeaway: Buy the measurement whose result would change the decision, not the one that is easiest to get.
        format: SCIENCETANK
        why: >
          Evidence is worth what the decision it changes is worth. A reserve is set against the width of a
          forecast, so the measurement that narrows the width is the one that moves the number: how the load
          actually responds to that fourth degree of cold. Second to it is what the store will really
          return, since the reserve is partly made of it and the brochure figure has already been shown
          wrong. Repeating a measurement that is already good buys precision nobody is short of. Anything
          whose result arrives after the peak cannot change a decision taken before it, however interesting
          the answer is.
        proposals:
          - { label: A, text: Measure how much extra load the last degree of cold actually brings on, from this winter's own data. }
          - { label: B, text: Re-test the store's round-trip efficiency at the discharge rate the peak would use. }
          - { label: C, text: Repeat the frequency-response test on the machine that already passed it in the autumn. }
          - { label: D, text: Commission a full survey of feeder-level demand, reporting in six weeks. }
        recommended: { A: 45, B: 35 }
        evidence: |
          The forecast peak has moved by 400 MW of width rather than of centre. The reserve currently held
          is 310 MW. The store is counted as 50 MW of that, on a brochure figure of 92 per cent that the
          weekend's own numbers put at 85. The machine tested in the autumn has not been touched since.

  - title: Where the current actually goes
    objective: Work out how flow divides between paths before switching changes them.
    briefing: Two circuits share the same corridor and they are not sharing it equally.
    stake: >-
      Tuesday, a week on, and the corridor has two circuits in it rather than one. Piotr Novak points out
      that this does not halve anything. The flow divides according to what each path costs it, and the
      newer circuit is the lower-impedance one, so it is taking two thirds of the load while the older one
      idles. Thabo Dube is waiting to be told which one to switch out for the morning's work. Today you work
      out how the current splits, decide what a node can and cannot hide, and say which arrangement leaves
      the least exposure. Switch the wrong one and the remaining circuit finds out what the sum was.
    takeaway: Current divides between parallel paths in inverse proportion to their impedance, whatever anybody intended.
    stops:
      - group: TRANS
        task: Estimate the current in the older circuit
        title: How the flow splits between two paths
        place: Transmission & Protection
        scene: >
          Nine hundred amps leave the busbar for the same destination by two routes. The older circuit is
          six ohms, the newer one three, and only the total is metered.
        assumes:
          - two paths between the same two points carry the same voltage across them
        takeaway: The lower-impedance path takes the larger share, in inverse proportion.
        format: BALLPARK
        question: Estimate the current flowing in the older, higher-impedance circuit.
        why: >
          Both circuits start and finish at the same two busbars, so the voltage across each is identical.
          By Ohm's law the current in each is that voltage divided by its own impedance, which means the
          smaller impedance carries the larger current. Working the shares out gives each path the other
          one's impedance over the sum. This is why adding a circuit does not split flow evenly, and why a
          new low-impedance line can quietly overload itself while an old one sits half empty. Nothing on
          the total meter shows any of it.
        estimate:
          prompt: >
            The total leaving the busbar is 900 A. The older circuit is 6 ohms and the newer one is 3 ohms.
            Both run between the same two busbars.
          question: Choose the total current, the other path's impedance and the sum of the two.
          labels:
            - 900 A  (total current)
            - 6 Ω  (older circuit)
            - 3 Ω  (newer circuit)
            - 11000 V  (busbar voltage)
          values: [900, 6, 3, 11000]
          slots: 3
          template: '{0} × {2} ÷ ({1} + {2})'
          formula: a*c/(b+c)
          correct: [0, 1, 2]
          target: 300
          tolerance: 40
          units: A
          solution: I_old = 900 × 3 ÷ (6 + 3) = 300 A.
          explanation: >
            Three hundred amps in the old circuit and six hundred in the new one. Each path takes the
            other's impedance over the sum, so the low-impedance route carries twice as much. The busbar
            voltage is the same for both, which is why it cancels and never enters the arithmetic.
          givens:
            - Total current is 900 A
            - The older circuit is 6 Ω and the newer is 3 Ω
          relationship: >
            Current in one of two parallel paths = the total × the other path's impedance ÷ the sum of the
            two impedances.
      - group: OPS
        task: Say what the busbar meter can and cannot tell you
        title: What a node has to add up to
        place: System Operations
        scene: >
          The busbar meter reads 900 A out. Reyes wants to know what that single figure rules out about the
          two circuits underneath it.
        assumes:
          - charge does not accumulate at a junction
        takeaway: A node's currents must sum, which constrains the parts without revealing them.
        format: CHOICE
        question: What does the 900 A total tell you about the two circuits?
        choices:
          - Both circuits are carrying 450 A, since the total divides between them.
          - The two currents must add to 900 A, and nothing in that figure says how.
          - Each circuit is carrying 900 A, because they are in parallel across the same busbar.
          - Nothing at all, because a total is not a measurement of anything real.
        answer: The two currents must add to 900 A, and nothing in that figure says how.
        why: >
          Charge does not pile up at a junction, so whatever arrives has to leave. That is the whole content
          of the current law, and it is a constraint rather than a solution: it fixes the sum and says
          nothing about the split. To get the split you need the impedances, which is a different
          measurement. Assuming an even share is the common error and here it is wrong by a factor of two.
          Assuming each path carries the full total confuses parallel with series. The total is real and
          useful; it is simply one equation with two unknowns in it.
        rebuttals:
          - An even split needs equal impedances, and these differ by a factor of two.
          - In parallel the voltage is shared and the current divides; it is series connection where the current is common.
          - A total is a real constraint and it is exactly one equation; it just is not two.
      - group: DIST
        task: Match each connection to what it shares
        title: What is common and what divides
        place: Distribution Depot
        scene: >
          Obi is training a new starter and wants the four cases on the whiteboard matched to what stays the
          same across each arrangement.
        assumes:
          - a circuit can be connected end to end or side by side
        takeaway: Series shares the current and divides the voltage; parallel shares the voltage and divides the current.
        format: PROTOCOL
        why: >
          Two arrangements, and the thing that stays common is what tells them apart. End to end there is
          only one path, so every element passes the same current and the supply voltage divides between
          them in proportion to impedance. Side by side each element sees the whole voltage, so the current
          divides instead. Everything else follows. Adding a parallel branch lowers the combined impedance
          and raises the total current, while adding a series element raises the impedance and lowers it.
          Getting these the wrong way round is how somebody sizes a fuse for the wrong number.
        rebuttals:
          - One path end to end means one current through everything, with the voltage dividing between them.
          - Side by side each branch sees the full voltage, so what divides is the current.
          - Another parallel branch offers another route, lowering the combined impedance and raising the total.
          - Another element in line adds impedance and reduces the current everywhere in that loop.
        columns:
          - The arrangement
          - What it does
        scenarios:
          - Three elements connected end to end in one loop.
          - Three elements connected side by side across the same two points.
          - A fourth branch is added side by side to an existing three.
          - A fourth element is added end to end into an existing loop.
        choices:
          - The current is the same in all of them, and the voltage divides between them.
          - The voltage is the same across all of them, and the current divides between them.
          - The combined impedance falls, so the total current rises.
          - The combined impedance rises, so the current falls everywhere in the loop.
        mapping: [0, 1, 2, 3]

  - title: Eighty milliseconds
    objective: Establish what a fault does before anybody can respond to it.
    briefing: A cable failed at the substation and the protection cleared it before the alarm reached the room.
    stake: >-
      Wednesday, and a cable failed inside the substation at 13:40. The protection cleared it in under a
      tenth of a second, which is the whole story: nobody in the control room saw the fault, they saw the
      aftermath. Piotr Novak needs the fault current worked out before he will sign the switchgear back into
      service. June Farrow wants to know how a current transformer produces a reading from a wire it never
      touches. Ewa Kowalczyk has a crew standing at a gate and a rule about earthing that they are quietly
      impatient with. Today you size the fault, explain the instrument, and decide who may approach.
    takeaway: A fault is limited only by impedance, which is why the numbers are enormous and the times are tiny.
    stops:
      - group: TRANS
        task: Estimate the current the fault drew
        title: What a short circuit is limited by
        place: Transmission & Protection
        scene: >
          The cable failed phase to earth. Phase voltage is 6,350 volts and the total impedance back to the
          source is 0.42 ohms. Novak wants the current the switchgear had to interrupt.
        assumes:
          - a short circuit leaves almost no impedance in the path
        takeaway: Fault current is the driving voltage over the impedance of the path, and nothing else limits it.
        format: BALLPARK
        question: Estimate the current that flowed during the fault.
        why: >
          Normal load current is set by what the customer is drawing. Fault current is not: the load has
          been bypassed, so the only thing left to limit the flow is the impedance of the source, the
          transformer and the cable back to it. That is a very small number, and dividing the phase voltage
          by it gives a current tens of times larger than anything the circuit carries in service. This is
          why switchgear is rated for a breaking current rather than a running one, and why the clearing
          time is quoted in milliseconds. The energy released goes as the current squared times the time.
        estimate:
          prompt: >
            Phase voltage at the fault was 6,350 V. Total impedance of the source, transformer and cable
            back to it is 0.42 Ω. Normal load on the circuit is 310 A.
          question: Choose the driving voltage and the impedance of the path.
          labels:
            - 6350 V  (phase voltage)
            - 0.42 Ω  (impedance back to source)
            - 310 A  (normal load current)
            - 0.08 s  (clearing time)
          values: [6350, 0.42, 310, 0.08]
          slots: 2
          template: '{0} ÷ {1}'
          formula: a/b
          correct: [0, 1]
          target: 15119
          tolerance: 1500
          units: A
          solution: I = 6,350 ÷ 0.42 ≈ 1.5 × 10⁴ A.
          explanation: >
            About fifteen thousand amps, roughly fifty times the normal load. The load current does not
            limit a fault, because the fault has gone around the load. The clearing time matters for the
            energy released rather than for the size of the current.
          givens:
            - Phase voltage is 6,350 V
            - Impedance back to the source is 0.42 Ω
          relationship: >
            Fault current = the driving phase voltage ÷ the total impedance of the path back to the source,
            with the load bypassed and contributing nothing.
      - group: METER
        task: Explain how the instrument reads a wire it never touches
        title: A reading taken without a connection
        place: Metering & Standards
        scene: >
          Farrow has a current transformer clamped around a conductor at eleven thousand volts, feeding a
          meter on the panel at five amps. Nothing connects the two circuits.
        assumes:
          - a changing magnetic field produces a voltage in a nearby conductor
        takeaway: A changing current makes a changing field, and a changing field drives a current in a second winding.
        format: CHOICE
        question: How does the current transformer produce its reading?
        choices:
          - The changing magnetic field induces a current in the second winding.
          - A small amount of current leaks across the insulation into the meter circuit.
          - The conductor warms the core, and the meter reads the temperature rise.
          - The meter senses the electric field around the conductor and infers the current from it.
        answer: The changing magnetic field induces a current in the second winding.
        why: >
          A current in a conductor makes a magnetic field around it. If the current alternates, the field
          alternates with it, and a changing field through a coil drives a voltage in that coil. That is
          Faraday's law, and it is the whole basis of the instrument: the two circuits share a magnetic
          path and no electrical one, which is what keeps the meter and the person reading it at low
          voltage. It is also why a current transformer works only on alternating current. On direct current
          the field is steady, nothing changes, and the reading is zero.
        rebuttals:
          - Leakage across insulation is a fault, not a measuring principle, and it would be far too small and unstable to read.
          - The core does warm slightly, and it is a loss rather than the signal.
          - There is an electric field around the conductor, and it depends on the voltage rather than on the current.
      - group: DIST
        task: Decide who may approach the failed cable
        title: The ground is not at one voltage
        place: Distribution Depot
        scene: >
          The cable is out of service and the crew wants to start. Kowalczyk has not applied earths yet, and
          the substation is fed from two directions.
        assumes:
          - a conductor can be re-energised from more than one direction
        takeaway: Isolation is not proof of safety, and earthing is what makes it provable.
        format: TRIAGE
        question: What has to happen before the crew touches the cable?
        choices:
          - Switch it out at both ends, then test it dead and apply earths at the point of work.
          - Switch it out at the near end, since one open point breaks the circuit.
          - Test it dead with an instrument, which proves nothing can arrive while they work.
          - Wait for the fault current to decay, then work quickly and stay clear of the ends.
        answer: Switch it out at both ends, then test it dead and apply earths at the point of work.
        why: >
          Each step covers a different way of getting hurt, so all of them are needed. Opening one end
          leaves the other end able to feed the cable, and this substation has supply from two directions.
          Testing dead proves the state at the moment of the test and says nothing about a minute later,
          which is why earths follow it. An applied earth is what makes a mistake survivable, because it
          gives any returning current a path that is not through somebody. It also holds the conductor near
          the potential of the ground the crew is standing on, which is what step and touch voltage is
          about.
        rebuttals:
          - One open point still leaves the second supply able to energise the cable.
          - Testing dead is a snapshot, and earths are what make it stay true while the work goes on.
          - Fault current does not linger; the danger is re-energisation, which no amount of working quickly prevents.

  - title: Merit order
    objective: Decide what runs tomorrow, and what is held back for the day it is needed.
    briefing: The cheapest generation is on the ridge and it will not say what it is doing after four.
    stake: >-
      Thursday, and tomorrow has to be bought tonight. Sten Lindgren has a peak that moves with the
      temperature and a width he will not narrow. Mina Sarraf has a ridge that will produce almost nothing
      for money and cannot promise any of it, and she is tired of being asked to. Nadia Haddad has expensive
      machines that can be told exactly what to do. Dolores Reyes has to sign an order that puts them in
      sequence. Today you forecast the peak from the load curve, decide what merit order actually means when
      the cheapest plant is the least certain, and choose what to do with more wind than the corridor can
      carry.
    takeaway: Dispatch orders plant by cost, and the value of certainty is what stops that being the whole story.
    stops:
      - group: LOAD
        task: Estimate tomorrow's peak from the curve
        title: The peak, and how far the cold moves it
        place: Load & Forecasting
        scene: >
          The base peak for a Friday in this week of the year is 6,400 megawatts. Lindgren's own figure for
          this winter is 120 megawatts of extra demand per degree below zero, and tomorrow is minus four.
        assumes:
          - demand rises as the temperature falls, roughly in step
        takeaway: A forecast is a base shape plus a sensitivity, and the sensitivity is measured rather than assumed.
        format: BALLPARK
        question: Estimate tomorrow's evening peak.
        why: >
          A load curve is the same shape most days, because people do the same things at the same times.
          What moves it is weather, and the useful form of that is a sensitivity: how many megawatts one
          degree is worth on this system, measured from this winter's own data rather than from a textbook.
          Base plus sensitivity times degrees gets the centre of the forecast. It does not get the width,
          which is what the reserve has to cover, and the width comes from how wrong the temperature
          forecast itself can be. Both numbers are needed and they answer different questions.
        estimate:
          prompt: >
            Base Friday peak for this week of the year is 6,400 MW. Demand sensitivity is 120 MW per degree
            below zero. Tomorrow's forecast is minus four degrees.
          question: Choose the base peak, the sensitivity and the degrees below zero.
          labels:
            - 6400 MW  (base peak)
            - 120 MW/°C  (demand sensitivity)
            - 4  (degrees below zero)
            - 310 MW  (reserve held)
          values: [6400, 120, 4, 310]
          slots: 3
          template: '{0} + {1} × {2}'
          formula: a+b*c
          correct: [0, 1, 2]
          target: 6880
          tolerance: 120
          units: MW
          solution: Peak ≈ 6,400 + 120 × 4 = 6,880 MW.
          explanation: >
            About 6,900 megawatts at the centre of the forecast. The reserve is what covers the width around
            that centre, so it is a separate decision and not part of this sum. Add it in here and you have
            double-counted the thing the reserve exists for.
          givens:
            - Base peak is 6,400 MW
            - Sensitivity is 120 MW per degree below zero
            - Tomorrow is four degrees below zero
          relationship: >
            Forecast peak = the base peak for that day and season + the demand sensitivity × the degrees
            below zero, with the sensitivity measured from this winter's own data.
      - group: OPS
        task: Match each plant to why it is dispatched where it is
        title: Cheapest first, and the exceptions that are not exceptions
        place: System Operations
        scene: >
          Four plants and an order to sign. Reyes wants each one matched to the actual reason it sits where
          it does in the stack, rather than to its price alone.
        assumes:
          - generation is scheduled in order of what it costs to run
        takeaway: Merit order is cost order, corrected for what the system also needs from a machine.
        format: CASEBOOK
        why: >
          Dispatch starts from cost, because running the cheapest first is what makes electricity affordable.
          Then three things bend it. Plant with almost no running cost goes first and cannot be relied on,
          so it displaces fuel without displacing the need for something reliable behind it. Plant that can
          change output quickly is worth holding part-loaded, because reserve is a service and a machine at
          full output cannot provide it. And plant in the right place can be needed regardless of price, when
          the alternative is a corridor over its limit. None of these is charity. Each is the system paying
          for something other than energy.
        rebuttals:
          - Near-zero running cost puts it first in the stack, and the uncertainty is why something reliable still has to be behind it.
          - Holding a fast machine part-loaded is buying reserve, which a machine at full output cannot sell.
          - Being in the right place can be worth more than being cheap, when the cheap alternative overloads a corridor.
          - Expensive and slow means last, and it is the plant the system is trying not to need.
        columns:
          - The plant
          - Why it sits where it does
        scenarios:
          - The ridge fleet, almost free to run, output not promised beyond four hours.
          - A gas machine that can move 40 MW a minute, deliberately left at half output.
          - An old station on the wrong side of the corridor, kept off despite being mid-priced.
          - An old station on the right side of a constraint, run despite being expensive.
        choices:
          - First in the stack on cost, with something reliable behind it because the output is not promised.
          - Held part-loaded on purpose, because reserve is a service and only a part-loaded machine can sell it.
          - Kept off because running it would push flow onto a corridor that cannot take it.
          - Run out of merit order because of where it is, not what it costs.
        mapping: [0, 1, 2, 3]
      - group: GEN
        task: Decide what to do with more wind than the corridor can carry
        title: When the cheapest power cannot get out
        place: Generation Hall
        scene: >
          Sarraf's ridge could produce 340 megawatts tonight. The corridor out of the valley is good for
          about 190 before it is at its limit, and there is nothing else to send it to.
        assumes:
          - power has to have a path to where it is used
        takeaway: Curtailment is what a network limit looks like from the generator's end.
        format: SCIENCETANK
        why: >
          Energy that cannot reach a customer is not energy, and a corridor at its thermal limit is a hard
          wall rather than a preference. So some of that output has to stop, and the question is only how the
          system pays for it and what it buys instead. Reinforcing the corridor fixes it permanently and
          takes years. Storage on the ridge moves the surplus in time rather than in space, which is exactly
          the right shape for this problem. Paying the fleet to curtail is the immediate answer and buys
          nothing lasting. Doing nothing is not available: the relay will curtail it less gracefully.
        proposals:
          - { label: A, text: Install storage at the ridge, to move the surplus into the hours when the corridor is free. }
          - { label: B, text: Pay the fleet to curtail tonight, and every night like it, until something else changes. }
          - { label: C, text: Reinforce the corridor with a second circuit, commissioned in about three years. }
          - { label: D, text: Run the corridor above its limit and accept the risk while the wind lasts. }
        recommended: { A: 45, C: 25 }
        evidence: |
          The ridge can produce 340 MW tonight. The corridor is rated at about 190 MW continuous. Nights like
          this occur perhaps forty times a winter. Storage at the ridge would be about 50 MW for four hours,
          at 85 per cent round trip. The corridor's second circuit has been on the reinforcement list for
          two years without a date.

  - title: The system splits
    objective: Work out what an island is, and whether the one that has formed can hold.
    briefing: The corridor tripped and the valley is now running on its own, for the moment.
    stake: >-
      Friday, 18:20, and the corridor tripped at the worst hour of the worst day — the same corridor the room chose
      to hold inside its emergency rating a week ago, on a thermal record nobody had checked. The valley did not go dark.
      It separated, and it is now an island of its own with the ridge, one gas machine and about a fifth of
      the demand it had at lunchtime. Dolores Reyes has minutes to decide whether to help it survive or shut
      it down deliberately. Nadia Haddad says the one machine in there has almost no inertia behind it.
      Chinelo Obi has the customer numbers. Today you work out what is holding that island's frequency up,
      decide what stored energy is actually available, and choose whether to keep it or collapse it.
    takeaway: An island lives or dies on whether generation inside it can follow the load inside it.
    stops:
      - group: OPS
        task: Work out which explanation fits the island's readings
        title: Why the island's frequency is falling slowly
        place: System Operations
        scene: >
          The island's frequency is drifting down at a tenth of a hertz per second. Its one machine is at
          full output and the ridge is at nine per cent of capacity, in a rising wind.
        assumes:
          - an island's frequency depends only on what is inside it
        takeaway: Inverter-connected generation supplies power without supplying inertia, which changes what a deviation means.
        format: DIAGNOSIS
        headline: The island is short of generation and its frequency is falling more slowly than it should.
        task: Which explanation fits every reading, including the ones that look fine?
        readings:
          - { zone: Island, label: Frequency, value: falling 0.1 Hz/s, status: alarm }
          - { zone: Gas machine, label: Output, value: at maximum, status: alarm, note: nothing left to give }
          - { zone: Ridge fleet, label: Output, value: 9 per cent of capacity, status: low, note: wind is rising }
          - { zone: Island, label: Voltage, value: within limits, status: normal }
        choices:
          - { label: The island has plenty of reserve after all, mechanism: A slow fall means the shortfall is small. }
          - { label: The load is shedding itself as the frequency falls, mechanism: Some demand falls away with frequency, which slows the decline without fixing it. }
          - { label: The ridge is providing inertia, mechanism: Its spinning mass is holding the frequency up. }
          - { label: The frequency meter is faulty, mechanism: Voltage is normal, so the island is fine. }
        answer: The load is shedding itself as the frequency falls
        why: >
          A slow fall is not evidence of a small shortfall. It is evidence that something is reducing demand
          as the frequency drops, and a good deal of load does exactly that: motors slow, and the power they
          draw falls with them. That buys time and it is not a solution, because the frequency is still
          going the wrong way. The ridge is not helping here in the way people assume. Its machines reach
          the system through inverters, so they can deliver power without delivering any stored rotational
          energy, and an island leaning on them has less inertia than its megawatts suggest. Voltage being
          normal rules out a different fault, not this one.
        rebuttals:
          - A slow fall with the only dispatchable machine at maximum is not reserve; it is demand quietly falling away.
          - Inverter-connected plant supplies power without inertia, so its megawatts do not slow the frequency change.
          - Voltage is normal because this is a power balance problem rather than a reactive one, so it rules out the wrong fault.
      - group: METER
        task: Say where an island's short-term energy actually comes from
        title: What is stored, and for how long
        place: Metering & Standards
        scene: >
          Farrow is asked to list what the island has to draw on in the first ten seconds. Two of the four
          things on her list cannot help at that timescale.
        assumes:
          - energy can be stored in a spinning mass, in a magnetic field or in a chemical cell
        takeaway: Every store has a timescale, and matching the store to the timescale is the whole trick.
        format: PROTOCOL
        why: >
          Each store answers over a different interval and confusing them is how a plan fails. Rotational
          energy in a spinning machine is there instantly, without anybody asking, and it is gone in
          seconds. A battery through an inverter responds in well under a second and can hold for hours,
          which makes it the most useful thing an island can have. Energy in the magnetic fields of
          transformers and lines is real, and it is a fraction of a cycle: nothing dispatchable. Boiler
          thermal storage is minutes away, useful for the recovery and useless for the first ten seconds.
        rebuttals:
          - Rotational energy arrives instantly with no command and is spent within seconds.
          - A battery through an inverter answers in well under a second and can hold for hours, which is the useful combination.
          - Energy in inductance and capacitance is real and lasts a fraction of a cycle, so nothing can be dispatched from it.
          - Boiler storage is a matter of minutes, which helps the recovery and not the first ten seconds.
        columns:
          - Where the energy is
          - When it can help
        scenarios:
          - The rotating mass of the gas machine.
          - The ridge's battery, through its inverter.
          - The inductance of the island's transformers, and the capacitance of its lines.
          - Heat in the gas machine's boiler and steam drum.
        choices:
          - Instantly and without being asked, for a few seconds only.
          - Within a second of being asked, and for hours if needed.
          - For a fraction of one cycle, which is what inductance and capacitance hold and is too brief to dispatch.
          - After several minutes, which suits the recovery rather than the emergency.
        mapping: [0, 1, 2, 3]
      - group: DIST
        task: Choose what to do about the island
        title: Keeping it, or collapsing it on purpose
        place: Distribution Depot
        scene: >
          Obi has 26,000 households inside the island and a frequency still falling. Holding it needs demand
          off. Collapsing it means all of them, and a longer way back.
        assumes:
          - restoring a collapsed island takes longer than holding a live one
        takeaway: Shedding some load to keep an island alive is usually cheaper than restoring it from nothing.
        format: CHOICE
        question: What should be done with the island?
        choices:
          - Shed about a fifth of the island's load now, to stop the fall and keep the rest supplied.
          - Let it collapse, and restore the whole valley from the main system once the corridor is back.
          - Hold on without shedding, on the chance the rising wind lifts the ridge's output in time.
          - Reconnect it to the main system immediately, before the frequency falls any further.
        answer: Shed about a fifth of the island's load now, to stop the fall and keep the rest supplied.
        why: >
          An island with its only dispatchable machine at maximum has one lever left, and that is demand.
          Shedding a fifth stops the fall and keeps four fifths of the valley supplied, which is a far better
          outcome than everybody off. Letting it collapse costs all 26,000 households and buys a restoration
          measured in hours, because a dead network has to be built back piece by piece. Waiting on wind is
          betting the island on a forecast. Reconnecting now is the worst of the four: two systems at
          different frequencies must not be joined, and doing it would trip the machine and take the island
          down anyway.
        rebuttals:
          - Collapsing it loses every customer and turns a shedding problem into a restoration measured in hours.
          - Waiting on the wind bets the island on a forecast, with nothing in reserve if the forecast is late.
          - Two systems at different frequencies cannot be joined; attempting it trips the machine and collapses the island.

  - title: Cranking path
    objective: Build a live system out of a dead one, in the only order that works.
    briefing: The valley collapsed at 19:04 and nothing in it can start without power it has not got.
    stake: >-
      Saturday, 19:04, and the island went. The valley is dark and every machine in it needs electricity to
      start: the boiler feed pumps, the fans, the control systems, the switchgear itself. Nadia Haddad has
      one small hydro set at the head of the valley that can start on its own, and Thabo Dube has a yard full
      of open switches. Dolores Reyes has to decide the order, and there is only one that works. Today you
      cost the energy the valley has already lost, work out why the small set matters more than the large
      one, and write the restoration in the sequence physics allows rather than the one people want.
    takeaway: A dead system is rebuilt from one machine that needs nothing, outward along a path chosen in advance.
    stops:
      - group: GEN
        task: Estimate the energy the valley has not had
        title: What the dark hours actually cost
        place: Generation Hall
        scene: >
          The valley was drawing about 300 megawatts when it went. Haddad expects the restoration to take
          two and a half hours, and the report will want the figure in energy rather than power.
        assumes:
          - power sustained over a period of time delivers energy
        takeaway: Power is a rate and energy is the amount, and the settlement is always in energy.
        format: BALLPARK
        question: Estimate the energy not delivered during the restoration.
        why: >
          Power says how fast energy is being delivered. Energy says how much arrived. The two are confused
          constantly, because both get called demand. Multiply the power by the time it was sustained and the
          result is energy — megawatt-hours, if the power was in megawatts and the time in hours. That is the
          number every settlement, every compensation claim and every inquiry runs on, because it is the one
          that scales with duration. Two systems can lose the same megawatts and owe entirely different
          amounts. The difference is only how long they took to come back.
        estimate:
          prompt: >
            The valley was drawing about 300 MW when it collapsed. The restoration is expected to take about
            two and a half hours.
          question: Choose the power and the duration.
          labels:
            - 300 MW  (demand at collapse)
            - 2.5 h  (expected restoration)
            - 26000  (households affected)
            - 49.4 Hz  (frequency before the split)
          values: [300, 2.5, 26000, 49.4]
          slots: 2
          template: '{0} × {1}'
          formula: a*b
          correct: [0, 1]
          target: 750
          tolerance: 80
          units: MWh
          solution: E = 300 × 2.5 = 750 MWh.
          explanation: >
            Seven hundred and fifty megawatt-hours never delivered. The household count and the frequency
            are both central to the story and neither belongs in this calculation. One is who was affected;
            the other is why it happened.
          givens:
            - Demand at collapse was about 300 MW
            - Restoration is expected to take about 2.5 hours
          relationship: Energy = the power × the time it is sustained for, in megawatt-hours when power is in megawatts.
      - group: OPS
        task: Put the restoration in the order it has to happen
        title: The order physics allows
        place: System Operations
        scene: >
          One hydro set that can start unaided, a dead network, and a room full of people who want the big
          station back first. Reyes needs the sequence written before anybody switches anything.
        assumes:
          - most generating plant needs an electrical supply before it can start
        takeaway: Start with the machine that needs nothing, build a path to a machine that needs a little, and grow outward.
        format: SEQUENCE
        why: >
          Almost every large machine needs power to start, so a dead system cannot be restarted from its
          biggest asset. It has to begin with the one plant that needs nothing external, which here is the
          hydro set: open a gate and it turns. That machine then energises a narrow path to a larger station
          so its pumps and fans can run, and only then can the large station be brought up. Load is added in
          small blocks throughout, because each block is a step change the tiny live system has to absorb.
          Reconnecting to the neighbouring system comes last, and only once the island is stable enough to be
          synchronised to it rather than dragged into step.
        cards:
          - Start the hydro set, which needs no outside supply.
          - Energise a narrow path from it to the large station's own supply.
          - Bring the large station up, now that its pumps and fans can run.
          - Add load in small blocks, and synchronise to the neighbouring system last.
        order: [0, 1, 2, 3]
      - group: DIST
        task: Match each restoration step to the reason it is limited
        title: Why it cannot go faster
        place: Distribution Depot
        scene: >
          Obi has crews asking why they are switching a few streets at a time when the substation is live
          and the whole feeder could be closed in one movement.
        assumes:
          - a small live system is disturbed more by a given block of load than a large one
        takeaway: Every restoration step is limited by something different, and hurrying the wrong one collapses it again.
        format: CASEBOOK
        why: >
          The limits change as the system grows. Very early, the live island is tiny and a block of load is
          enormous relative to it, so blocks stay small: this is a frequency limit. Energising long circuits
          with almost no load on them raises voltage rather than lowering it, which is a reactive limit and
          the opposite of most people's instinct. Cold load picks up higher than normal, because every
          thermostat in the street is calling at once. And synchronising two live systems is a matching
          problem, not a capacity one. Four steps, four different constraints.
        rebuttals:
          - Early on the island is small, so a given block is a large fraction of it, and that is a frequency limit.
          - A long line energised with little load on it pushes voltage up rather than down, which is a reactive limit.
          - Cold load returns above its normal value, because everything that was cut off is calling at once.
          - Joining two live systems is a matching problem in frequency, voltage and angle, not a question of capacity.
        columns:
          - The step
          - What limits it
        scenarios:
          - Adding the first blocks of load to a very small live island.
          - Energising a long, lightly loaded circuit out to the next substation.
          - Restoring a residential feeder that has been off for two hours in winter.
          - Joining the restored island back to the neighbouring system.
        choices:
          - A frequency limit, because a small system cannot absorb a large step.
          - A reactive limit, because a lightly loaded line raises the voltage at its far end.
          - A cold-load limit, because everything that was cut off comes back on at once.
          - A matching limit, because frequency, voltage and angle must agree before the breaker closes.
        mapping: [0, 1, 2, 3]


  - title: Six hours, not forty minutes
    objective: Re-read the week from a record nobody had checked.
    briefing: Farrow has traced the corridor's thermal record, and the number the room worked from was wrong.
    stake: >-
      Sunday, and June Farrow has finished tracing the corridor's thermal history. The emergency rating that
      bought the room forty minutes a week ago was calculated from a sensor that had been reading eleven
      degrees low since a firmware update in the spring. The corridor was not forty minutes from its limit.
      It had been above continuous rating for six hours, and it had been there twice before. Dolores Reyes
      has to decide what that does to every decision taken since. Today you work out what a drifted sensor
      does to a rating, decide which of the week's conclusions still stand, and say what you would have done
      differently. Nothing in the week was reasoned badly. It was reasoned from a number.
    takeaway: A conclusion is only as good as the measurement under it, and a drifted instrument leaves the reasoning intact and the answer wrong.
    stops:
      - group: METER
        task: Work out which explanation fits the thermal record
        title: The sensor that was confident and wrong
        place: Metering & Standards
        scene: >
          Farrow has three sources for the corridor's temperature that week: the sensor, an infrared survey
          from the ground, and the sag measured off a photograph. Two of them agree with each other.
        assumes:
          - an instrument can be precise and still be offset from the truth
        takeaway: Precision is repeatability; accuracy is being right. A drifted sensor has the first and not the second.
        format: DIAGNOSIS
        headline: The corridor's own sensor disagrees with two independent measurements of the same week.
        task: Which explanation fits every reading, including the steady ones?
        readings:
          - { zone: Conductor sensor, label: Peak temperature, value: 78 °C, status: normal, note: scatter under 0.3 °C }
          - { zone: Ground survey, label: Infrared, value: 89 °C, status: alarm }
          - { zone: Photograph, label: Sag, value: consistent with 90 °C, status: alarm }
          - { zone: Conductor sensor, label: Firmware, value: updated in the spring, status: low }
        choices:
          - { label: The sensor is correct and both other methods are crude, mechanism: Its scatter is tiny, so it is the precise measurement. }
          - { label: The sensor has a fixed offset from the firmware update, mechanism: It repeats well and sits low, which two independent methods both show. }
          - { label: The corridor really did run at two temperatures, mechanism: Different parts of a long conductor can differ. }
          - { label: The photograph is unreliable and should be discarded, mechanism: Sag depends on tension as well as temperature. }
        answer: The sensor has a fixed offset from the firmware update
        why: >
          Tight scatter is the trap. It says the instrument repeats, and repeating is not the same as being
          right: a constant offset produces beautifully consistent readings that are all wrong by the same
          amount. Two methods that share nothing with the sensor, and nothing much with each other, both put
          the conductor about eleven degrees hotter, and the firmware date says when the offset arrived.
          Sag does depend on tension, which is why it is corroboration rather than proof — and corroboration
          from an unrelated method is exactly what a drifted instrument cannot produce.
        rebuttals:
          - Tight scatter proves the sensor repeats itself, which is what a constant offset looks like from the inside.
          - A long conductor does vary along its length, and not by eleven degrees in the same direction on every survey.
          - Sag is sensitive to tension, which makes it weak alone and useful as the second independent method.
      - group: TRANS
        task: Say what the corrected temperature does to the rating
        title: What a rating is a statement about
        place: Transmission & Protection
        scene: >
          Novak has the corrected figures. At 89 degrees the corridor was not inside an emergency rating at
          all, and the relay that never operated is now the thing he wants explained.
        assumes:
          - a conductor's rating is a limit on temperature rather than on current
        takeaway: A rating is a temperature expressed as a current, so a wrong temperature makes the current limit meaningless.
        format: CHOICE
        question: What does the corrected temperature change about that week?
        choices:
          - Nothing important, because the corridor did not actually fail during those six hours.
          - The corridor was outside its rating, so the decisions that assumed a margin had none.
          - The rating was too conservative, since the corridor survived a temperature above it.
          - The relay must have been miscoordinated, because it should have tripped at 89 degrees.
        answer: The corridor was outside its rating, so the decisions that assumed a margin had none.
        why: >
          A thermal rating is not a fuse setting. It is the current at which the conductor reaches a
          temperature the operator has agreed to accept, chosen so the metal keeps its strength and the span
          keeps its clearance. Surviving a higher temperature does not validate it, because the damage a
          rating protects against is cumulative: annealing and loss of tensile strength accumulate over
          hours above limit and show up years later as a span that fails in a wind nobody thought was
          remarkable. The relay is not the backstop either. Protection watches for faults, not for a
          conductor slowly cooking.
        rebuttals:
          - Not failing is not the same as being inside a limit; the damage a rating prevents is cumulative and invisible at the time.
          - A rating that is survived once has not been shown conservative, any more than a corner taken too fast proves the speed limit wrong.
          - Protection looks for faults on a timescale of milliseconds; it does not and cannot watch a conductor's temperature.
      - group: OPS
        task: Decide which of the week's conclusions still stand
        title: What survives a bad number
        place: System Operations
        scene: >
          Reyes has the week's decisions on the board and one wrong input underneath several of them. She
          wants each one marked as still good, now unsupported, or wrong.
        assumes:
          - a conclusion can depend on one input or on several
        takeaway: A bad input invalidates what rested on it and leaves the rest standing, and telling them apart is the work.
        format: CASEBOOK
        why: >
          One wrong number does not void a week. It voids whatever leaned on it, and the job is tracing
          which. The choice to hold the corridor rested entirely on the duration, so it falls. The loss
          calculation used current and resistance and never touched temperature, so it stands. The
          restoration order was argued from consequence and household counts, which the sensor never
          entered. And the decision to shed a fifth of the island was taken on a frequency the sensor has
          nothing to do with — it was right then and it is right now, which is worth saying out loud, because
          a room that treats every past decision as suspect after one bad number stops being able to decide
          anything.
        rebuttals:
          - Holding the corridor rested on the duration and nothing else, so it is the one decision that falls outright.
          - The loss figure came from current and resistance, neither of which the sensor touched.
          - The restoration order was argued from consequence and household counts, which the thermal record never entered.
          - The island shed was taken on frequency, which the sensor has nothing to do with; it was right then and still is.
        columns:
          - The decision
          - What the bad number does to it
        scenarios:
          - Holding the corridor inside its emergency rating rather than redispatching.
          - The seventeen megawatts of loss calculated for the corridor.
          - The order the eleven feeders were restored in.
          - Shedding a fifth of the island to hold its frequency.
        choices:
          - Falls. It rested on the duration, and the duration was wrong.
          - Stands. It used current and resistance, and never used temperature.
          - Stands. It was argued from consequence and household counts.
          - Stands, and should be said out loud. It was taken on frequency, which the sensor never touched.
        mapping: [0, 1, 2, 3]

  - title: A shift where nothing happens
    objective: Run an ordinary evening, and notice what ordinary is now resting on.
    briefing: The forecast holds, every circuit is inside limits, and nothing needs deciding.
    stake: >-
      Monday, and it is a quiet shift. The forecast is holding to within thirty megawatts, every corridor is
      comfortably inside rating, the ridge is producing steadily, and there is nothing on the board that
      needs a decision. Aaron Whitlock has the log open with almost nothing in it. Dolores Reyes uses these
      evenings to walk the room and ask what everybody is assuming, because a quiet shift is the only time
      anybody has to. Today you check what the system would do if one thing went, read a trend that is
      behaving, and say which of tonight's comforts is actually a measurement and which is a habit. Nothing
      will go wrong tonight. Nothing went wrong the Monday before last, either.
    takeaway: A quiet system is a set of assumptions nobody is currently being forced to check.
    stops:
      - group: OPS
        task: Say what the contingency check is actually asking
        title: The failure that has not happened
        place: System Operations
        scene: >
          The screen says every single contingency is survivable tonight. Whitlock asks what the check does
          not cover, and Reyes says that is the right question on a quiet shift.
        assumes:
          - a system is required to survive any one credible failure
        takeaway: An N-1 check is a statement about single failures, and it says nothing about two.
        format: CHOICE
        question: What does a clean contingency check tell you tonight?
        choices:
          - That the system is safe, because every failure it considers has been survived on paper.
          - That any single credible failure leaves the system inside limits, and nothing more.
          - That nothing will fail tonight, since the check has found no weaknesses.
          - That the margins are too generous, since everything passes comfortably.
        answer: That any single credible failure leaves the system inside limits, and nothing more.
        why: >
          The check is exactly as broad as its list. It takes each credible single failure in turn, works out
          the flows afterwards, and confirms nothing ends up over a limit. That is a genuinely strong
          statement and a narrow one. It does not cover two failures at once, it does not cover a failure
          outside the list, and it says nothing at all about what is likely — only about what is survivable.
          Last Friday was two things: a corridor already above a limit nobody knew about, and then the trip.
          Each alone was survivable. The check had been clean all week.
        rebuttals:
          - Safe is a stronger word than the check earns; it clears single failures from a list, not everything.
          - The check says nothing about likelihood, only about whether the system stays inside limits afterwards.
          - Passing comfortably is what the margin is for; a check that only just passed would be the alarming one.
      - group: LOAD
        task: Read a forecast that is behaving
        title: The trend with nothing wrong with it
        place: Load & Forecasting
        scene: >
          Lindgren's forecast has tracked within thirty megawatts all evening. He wants to know what that
          does and does not license the room to assume about tomorrow.
        assumes:
          - a forecast can be right by luck as easily as by skill on any one day
        takeaway: One good night is not evidence about the method, because the width was never a claim about tonight.
        format: PROTOCOL
        why: >
          A forecast is a distribution. Landing inside thirty megawatts on a mild Monday is what the middle
          of that distribution looks like and it tells you almost nothing, because mild Mondays are the days
          the model was best calibrated for. The evidence that matters is how it behaves on the days it was
          least calibrated for, which are rare by construction. So a run of good nights is not a reason to
          hold less reserve, and one bad night on a cold snap is not a reason to distrust the method either.
          Both are single draws. The width is the claim, and the width is tested over a season.
        rebuttals:
          - A quiet Monday is the middle of the distribution and the easiest day the model has; it confirms very little.
          - Cold snaps are where the model is least calibrated, so they are where the width is actually tested.
          - A run of accurate nights does not narrow the width, because the width was never a claim about any one night.
          - One miss on an unusual day is a single draw, and it does not condemn the method any more than a hit vindicates it.
        columns:
          - The observation
          - What it is evidence about
        scenarios:
          - The forecast tracked within thirty megawatts on a mild Monday.
          - The forecast missed by four hundred megawatts on the coldest night of last winter.
          - The forecast has been accurate for nine consecutive evenings.
          - The forecast's stated width has held over three winters.
        choices:
          - Very little. It is the easiest day the model has, and the middle of its own distribution.
          - The part of the range that matters, since that is where the model is least calibrated.
          - Nine draws from the middle, which does not license holding less reserve.
          - The only one of these that is evidence about the method rather than about a night.
        mapping: [0, 1, 2, 3]
      - group: GEN
        task: Separate tonight's measured comforts from its habits
        title: Which of these is a measurement
        place: Generation Hall
        scene: >
          Haddad lists four reasons the room is relaxed tonight. Two of them are numbers somebody took. Two
          are things everyone has stopped checking.
        assumes:
          - a figure can be current, or it can be inherited
        takeaway: An assumption that has not been measured recently is a habit wearing a number's clothes.
        format: TRIAGE
        question: Which of tonight's four comforts is the one most worth checking?
        choices:
          - The reserve figure, taken from this evening's own dispatch and metering.
          - The ridge's inertia, from a figure written when the fleet was smaller.
          - The corridor loading, read live off the yard's own instruments an hour ago.
          - The forecast width, held over three winters of outcomes.
        answer: The ridge's inertia, from a figure written when the fleet was smaller.
        why: >
          Three of these are current measurements or long-run evidence. The fourth is an inherited number
          about a fleet that has doubled, and inertia is the quantity the whole first week turned on — it
          sets how fast frequency moves when something goes. Worse, it is the one figure on the list that has
          moved in the wrong direction as the fleet grew, because inverter-connected plant supplies power
          without supplying rotational energy. So the number is old, it is load-bearing, and the change since
          it was written makes it optimistic rather than merely stale. That combination is what makes it
          first.
        rebuttals:
          - The reserve figure came off tonight's own dispatch and metering, so it is as current as anything here.
          - Corridor loading was read live an hour ago from the yard's instruments.
          - The forecast width is the one item backed by three winters of outcomes rather than by one night.

  - title: Three things at once
    objective: Rank three simultaneous problems, and hold the reasoning while they interfere.
    briefing: A fault, a forecast miss and a plant coming off at the same hour, and one room.
    stake: >-
      Thursday, 16:40, and three things arrive together. A cable fault has taken a feeder with 3,300
      households on it. Ravi Lindgren's forecast is running two hundred megawatts under actual and still
      climbing. And the gas machine that has carried the evening peak all week has to come off at eighteen
      hundred for a fuel limit Amira Haddad flagged this morning and nobody built a plan around. Dolores
      Reyes has one control room, one crew on shift and about eighty minutes. Today you decide what gets
      attention first, work out what the corridor is costing at the higher flow, and put the evening's moves
      in an order that does not undo itself. None of these is new. All three at once is.
    takeaway: Ranking is not about which problem is worst but about which one gets worse fastest and which one is cheapest to remove.
    stops:
      - group: OPS
        task: Decide what the room does first
        title: Which of the three cannot wait
        place: System Operations
        scene: >
          Reyes has the three on the board and asks for an order, not an opinion. Whitlock notes that two of
          them are already as bad as they are going to get.
        assumes:
          - a problem that is still growing is different from one that has finished growing
        takeaway: Rank by rate of deterioration and by how cheap the fix is, not by how bad the headline sounds.
        format: TRIAGE
        question: Which of the three gets the room's attention first?
        choices:
          - The forecast running two hundred megawatts under and still climbing.
          - The cable fault, with 3,300 households off and a crew already dispatched.
          - The gas machine coming off at eighteen hundred for a fuel limit.
          - The corridor loading, which has risen but is still inside its rating.
        answer: The forecast running two hundred megawatts under and still climbing.
        why: >
          The fault is bad and it is finished: those households are off, a crew is on the way, and nothing
          the control room does in the next hour changes the outcome. The machine coming off is a known time
          and a known quantity, which makes it schedulable. The forecast error is neither — it is growing,
          it eats the reserve that covers both of the others, and every minute spent elsewhere is a minute
          of margin gone. It also has the cheapest fix on the board, because reserve can be brought forward
          with a phone call and a fault cannot be repaired with one.
        rebuttals:
          - The fault has stopped getting worse; a crew is already committed and the room cannot speed the repair.
          - The machine coming off is a known megawatt figure at a known hour, which makes it a plan rather than an emergency.
          - The corridor is inside its rating, and it is a consequence of the other three rather than a fourth problem.
      - group: TRANS
        task: Work out the corridor's loss at the higher flow
        title: Loss when the load turns up anyway
        place: Transmission & Protection
        scene: >
          With the feeder out, flow has redistributed and the corridor is carrying more. Novak wants the heat
          figure before he decides whether the evening needs a switching change.
        assumes:
          - loss in a conductor rises with the square of the current
        takeaway: A tenth more current is about a fifth more heat, which is why the square is the number that matters.
        format: BALLPARK
        question: Estimate the power now lost as heat in the corridor.
        why: >
          Same relation, worse number. Loss is current squared times resistance, three phases of it. The
          square is why the redistribution matters more than it sounds. Current has risen about eleven per
          cent. The heat has risen nearly a quarter. All of it goes into a conductor whose rating is a
          temperature limit rather than a current limit. The figure is also the argument for spending eighty
          minutes moving generation rather than watching it. Every megawatt taken off this path comes back
          twice over in heat nobody has to shed.
        estimate:
          prompt: >
            The corridor is now carrying 1,280 A per phase through the same total resistance of 4.2 ohms,
            on three phases.
          question: Choose the current, the resistance and the number of phases.
          labels:
            - 1280 A  (current per phase now)
            - 4.2 Ω  (resistance of the corridor)
            - 3  (phases)
            - 1150 A  (the current an hour ago)
            - 89 °C  (corrected conductor temperature)
          values: [1280, 4.2, 3, 1150, 89]
          slots: 3
          template: '{0} × {0} × {1} × {2}'
          formula: a*a*b*c
          correct: [0, 1, 2]
          target: 20643840
          tolerance: 1800000
          units: W
          solution: P = 3 × 1280² × 4.2 ≈ 2.1 × 10⁷ W ≈ 21 MW.
          explanation: >
            About twenty-one megawatts, against seventeen an hour ago. Current rose by eleven per cent and
            the heat rose by nearly a quarter, because the square does the work. The earlier current and the
            corrected temperature are both real numbers about this corridor and neither enters the loss.
          givens:
            - Current is now 1,280 A per phase
            - Corridor resistance is still 4.2 Ω
            - There are three phases
          relationship: >
            Loss = the number of phases × the current squared × the resistance, so a small rise in current
            is a larger rise in heat.
        answerText: About 21 MW.
      - group: LOAD
        task: Order the evening's moves so none of them undoes another
        title: An order that survives being carried out
        place: Load & Forecasting
        scene: >
          Lindgren has four moves for the evening and no view on the order. Two of them change what the
          others are worth, and one of them cannot be reversed inside the shift.
        assumes:
          - some actions change the value of the actions that follow them
        takeaway: Do the moves that improve your information first and the moves you cannot undo last.
        format: SEQUENCE
        why: >
          Correct the forecast first. Every other number is sized against it, and a wrong demand figure means
          doing the right thing to the wrong amount. Bring reserve forward next. It is reversible, it costs
          money rather than customers, and it covers the machine coming off at eighteen hundred. Then move
          the replacement plant, which takes real minutes to load and has to be underway before the fuel
          limit bites. Reconfiguring the network is last. Switching changes which contingencies are credible,
          and a change made on the old forecast would only be argued again on the new one.
        cards:
          - Correct the forecast, so every other figure is sized against a real demand.
          - Bring reserve forward to cover the machine coming off at eighteen hundred.
          - Start loading the replacement plant, which needs the minutes.
          - Reconfigure the network around the faulted feeder.
        order: [0, 1, 2, 3]

  - title: The last morning it can be changed
    objective: Commit the corridor to a course, knowing the window closes today.
    briefing: The reinforcement decision from last week has a date on it, and the date is today.
    stake: >-
      Monday, and the corridor decision comes back for the last time. The outage window that would let a
      second circuit be strung this year closes at close of business, and if it closes the next one is
      eighteen months out. June Farrow has the corrected thermal record, which says the corridor has spent
      more hours over limit than anybody thought. Amira Haddad has a storage quote that expires with the
      window. Dolores Reyes has a board that will not approve both. Today you work out what the corrected
      record does to the corridor's remaining life, decide what the money buys, and say what the decision
      commits the system to for the next eighteen months. Last week this was a preference. This morning it
      is the last morning.
    takeaway: A reversible decision is a cheap one, and the moment it stops being reversible is the moment it needs the whole argument.
    stops:
      - group: METER
        task: Say what the corrected hours do to the conductor
        title: Hours over limit, added up
        place: Metering & Standards
        scene: >
          Farrow's corrected record has the corridor above continuous rating for about ninety hours over
          three years. She wants to know whether that is a maintenance note or a design problem.
        assumes:
          - time spent above a thermal limit accumulates rather than resetting
        takeaway: Thermal damage integrates over time, so ninety scattered hours count as ninety hours.
        format: CHOICE
        question: What do ninety accumulated hours above continuous rating mean for the conductor?
        choices:
          - Nothing, because the conductor cooled fully between every one of those periods.
          - The aluminium has lost strength for good, and its life is shorter than designed.
          - The conductor has been proven capable of the higher current and can be re-rated upward.
          - The record is too old to act on, since most of those hours were more than a year ago.
        answer: The aluminium has lost strength for good, and its life is shorter than designed.
        why: >
          Annealing is not a state the metal comes back from. Above about ninety-five degrees, aluminium's
          grain structure begins to relax, and the tensile strength it loses stays lost when it cools. The
          effect accumulates in hours-above-temperature, which is why the number is added up over three
          years rather than judged one event at a time. The consequence is not a failure today. It is a span
          that fails at a wind loading the design allowed for, some years from now, and a record that
          explains why only after somebody adds up the hours.
        rebuttals:
          - Cooling restores the temperature and not the strength; the loss is in the grain structure, and it is permanent.
          - Surviving a current is not the same as being rated for it, because the damage is cumulative rather than immediate.
          - The damage does not age out; hours from two years ago are still hours the metal spent losing strength.
      - group: TRANS
        task: Commit the money before the window closes
        title: What the window is worth
        place: Transmission & Protection
        scene: >
          Two options, one budget, one afternoon. Novak points out that only one of them still exists
          tomorrow, and Haddad points out that only one of them fixes the corridor.
        assumes:
          - an option with an expiry date is worth more than the same option without one
        takeaway: When one path closes today, its value includes everything the eighteen-month delay would cost.
        format: SCIENCETANK
        why: >
          This is not the same question as last week, because one option now expires. Reinforcement is the
          only choice that removes the constraint rather than working around it, and today is the last day
          it can be started this year — so its cost includes eighteen months of curtailment, ninety more
          hours of annealing, and every evening the room has to hold a corridor it has now measured as
          weaker than it thought. Storage is genuinely good and it is a workaround; it moves surplus in
          time, it does not raise a thermal limit, and it will still be purchasable in the spring. Curtailing
          buys another eighteen months of the same week. Doing nothing spends the window for free.
        proposals:
          - { label: A, text: Commit the outage window today and string the second circuit this year. }
          - { label: B, text: Buy the ridge storage on the expiring quote and put reinforcement to the spring. }
          - { label: C, text: Keep curtailing and revisit both when the next window opens in eighteen months. }
          - { label: D, text: Hold the budget until the corrected thermal record has been independently reviewed. }
        recommended: { A: 55, B: 25 }
        evidence: |
          The outage window closes at close of business and the next is eighteen months out. The corrected
          record has the corridor above continuous rating for about ninety hours over three years. Storage
          would be 50 MW for four hours and does not change a thermal rating. Curtailment on nights like
          last Friday runs about forty nights a winter. The review Farrow would want takes three weeks.
      - group: OPS
        task: Say what the decision commits the room to
        title: The eighteen months you just bought
        place: System Operations
        scene: >
          Reyes wants the consequences written down before the decision is signed, so that the next shift
          inherits a plan rather than a mood.
        assumes:
          - a decision to build something is also a decision about the years before it exists
        takeaway: Committing to a fix commits you to running the system without it until it arrives, and that has to be planned too.
        format: PROTOCOL
        why: >
          A build is not relief. It is a date. Between today and that date the corridor is exactly as weak as
          it was this morning, and now known to be weaker. The room inherits three years of damage and no
          new capacity. So the emergency rating is recalculated on the corrected sensor. The curtailment
          nights are budgeted rather than absorbed. The contingency case is run at the corridor's real
          strength. The one thing the decision buys today is a closed argument, and a closed argument is what
          lets a shift act at 16:40.
        rebuttals:
          - The emergency rating has to be recalculated, because the one in use was derived from the drifted sensor.
          - Curtailment nights become a budgeted cost rather than a surprise, since the corridor is unchanged until the circuit exists.
          - The contingency case has to be rerun at the corridor's real strength rather than its design strength.
          - The argument is settled, which is what lets a shift act quickly without reopening the decision.
        columns:
          - What the next eighteen months contains
          - Why the decision puts it there
        scenarios:
          - The emergency rating in the operating instructions.
          - Roughly forty curtailment nights a winter.
          - The corridor's contingency case.
          - The corridor argument itself.
        choices:
          - Has to be recalculated, because it came from the sensor that read eleven degrees low.
          - Becomes a budgeted cost, because nothing about the corridor changes until the circuit exists.
          - Has to be rerun at the conductor's real strength rather than its design strength.
          - Is closed, which is what lets a shift act at 16:40 without reopening it.
        mapping: [0, 1, 2, 3]

  - title: What we know, and how well
    objective: Say how strongly each of the fortnight's claims is held, and what outlives the emergency.
    briefing: The event report has to state what is established, what is inferred and what is still a guess.
    stake: >-
      Friday, and the fortnight goes into a report. Dolores Reyes will not sign a document that states
      everything at the same confidence, because a reader who cannot tell a measurement from an inference
      will act on both the same way. June Farrow has the evidence file. Ravi Lindgren wants his forecast
      width in as a range rather than a number. Piotr Novak wants the sensor drift written as a finding
      rather than an excuse. Today you sort the fortnight's claims by how strongly each is held, put
      numbers on the ones that deserve them, and decide which of the emergency's changes should become
      permanent practice. This is the part of the fortnight that will still matter in a year.
    takeaway: A finding is worth what its evidence is worth, and saying so is what makes a report usable a year later.
    stops:
      - group: METER
        task: Sort the fortnight's claims by the evidence under them
        title: Measured, inferred, assumed
        place: Metering & Standards
        scene: >
          Farrow has four statements from the fortnight, all of which the room believes. They are not held
          for the same reasons and she will not let them into the report as equals.
        assumes:
          - a claim can rest on a measurement, on an inference from one, or on nothing yet
        takeaway: Sorting claims by their evidence is what lets a later reader know which ones to check first.
        format: CASEBOOK
        why: >
          The sensor's offset is the strongest thing in the file. Two independent methods agree, and the
          firmware date says when it started. The lost strength is an inference: sound metallurgy on a
          corrected record, with no sample pulled. The storage figure is one weekend at one discharge rate,
          which is real evidence and thin evidence at once. The cause of the trip is still unestablished. The
          room has a plausible story and no proof. Writing it as a finding would be the sensor's own mistake,
          one level up.
        rebuttals:
          - The sensor offset has two independent methods and a firmware date, which is as strong as anything in the file.
          - The lost strength is an inference from a corrected record; sound, and untested on an actual sample.
          - The store's efficiency rests on one weekend at one discharge rate, which is real and thin at once.
          - The cause of the trip has a plausible story and no proof, and it goes in as an open question.
        columns:
          - The claim
          - How strongly it is held
        scenarios:
          - The corridor sensor reads about eleven degrees low.
          - The conductor has lost tensile strength it will not recover.
          - The ridge store returns about 85 per cent rather than 92.
          - A particular relay setting caused the original trip.
        choices:
          - Established. Two independent methods agree and the firmware date fixes when it began.
          - Inferred. Good metallurgy on a corrected record, with no sample pulled.
          - Measured once. One weekend at one discharge rate, which is thin.
          - Unestablished. A plausible story with no proof, and it goes in as an open question.
        mapping: [0, 1, 2, 3]
      - group: LOAD
        task: Put a range on the forecast rather than a number
        title: The number that has to be a range
        place: Load & Forecasting
        scene: >
          Lindgren's winter peak goes into the report. He wants the width in the sentence, and Reyes wants
          to know what the width is for.
        assumes:
          - a forecast is a distribution rather than a single value
        takeaway: A forecast without a width cannot size a reserve, because the reserve is sized against the width.
        format: CHOICE
        question: Why does the winter peak go in as a range rather than as a single figure?
        choices:
          - Because a range is more cautious, and caution is appropriate after an event like this one.
          - Because the reserve is sized against the width, not the centre.
          - Because the model is not accurate enough yet to state a single number honestly.
          - Because a range cannot be shown to be wrong afterwards.
        answer: Because the reserve is sized against the width, not the centre.
        why: >
          Reserve is not held against the expected peak. It is held against the amount by which the peak
          might exceed it, which is a property of the width and not of the centre. A report that states a
          single megawatt figure has deleted the only quantity a planner needs, and the planner then invents
          one — usually badly, and usually optimistically. The width is also the honest part: it says which
          conditions the model was calibrated for and which it was not, so a cold snap outside that range
          reads as expected rather than as a failure of the method.
        rebuttals:
          - Caution is not the reason; the width is a specific quantity the reserve calculation needs as an input.
          - The model's accuracy is what the width states, which is the opposite of hiding it.
          - A range makes the claim checkable rather than unfalsifiable, because outcomes outside it count against the width.
      - group: OPS
        task: Decide which of the fortnight's changes becomes permanent
        title: What outlives the emergency
        place: System Operations
        scene: >
          Four things the room started doing under pressure. Reyes asks which of them are worth their cost
          on an ordinary Monday, when nothing is going wrong.
        assumes:
          - a practice adopted under pressure has a cost that only shows up later
        takeaway: Keep the practices that would have caught the fault early, and drop the ones that only paid off because the fortnight was abnormal.
        format: TRIAGE
        question: Which of the fortnight's changes is most worth keeping permanently?
        choices:
          - Cross-checking any instrument that a decision rests on against an independent method.
          - Holding reserve at the fortnight's elevated level all winter.
          - Reporting corridor loading to the control room every fifteen minutes rather than every hour.
          - Requiring two operators to sign any load-shedding decision.
        answer: Cross-checking any instrument that a decision rests on against an independent method.
        why: >
          One of these would have caught the whole thing. The sensor's offset survived for months because
          nothing was ever compared against it, and an independent check costs a survey and an afternoon.
          Elevated reserve is expensive every night and only useful on the rare ones, which is what a width
          is for deciding rather than a fortnight. More frequent loading reports would not have helped at
          all, because the readings were wrong rather than late — more of a wrong number is not information.
          And a second signature on shedding adds minutes to the one decision in the fortnight that was
          correct and had to be fast.
        rebuttals:
          - Elevated reserve costs money every night for a benefit on a handful, which is a width question rather than a policy.
          - The loading readings were wrong, not late; reporting a wrong number four times as often adds nothing.
          - A second signature slows the one decision that was both correct and time-critical.

# ------------------------------------------------------------- the rooms
# What is inside each area, for the interior the player walks into. The station
# panel is the instrument that area reasons with, so it carries that area's own
# quantity rather than a generic readout.
interiors:
  OPS:
    caption: Frequency is the whole system's supply and demand, arriving as a number.
    standLine: One unit off, frequency settled low, and two people already naming a cause.
    station:
      kind: panel
      title: System overview
      rows:
        - { label: Frequency, value: 49.82 Hz, status: low }
        - { label: Rate of change, value: 0.24 Hz/s at trip, status: high }
        - { label: Generation online, value: 6,400 MW, status: normal }
        - { label: Spinning reserve, value: 310 MW, status: low }
  GEN:
    caption: A generator is a flywheel first and a power source second.
    standLine: Four machines online, one tripped, and a ramp rate nobody can argue with.
    station:
      kind: panel
      title: Machine hall
      rows:
        - { label: Units online, value: 4 of 5, status: low }
        - { label: Stored inertia, value: 4,200 MW·s, status: normal }
        - { label: Fastest ramp, value: 8 MW/min, status: low }
        - { label: Governor droop, value: 4 per cent, status: normal }
  TRANS:
    caption: A rating is a time and a temperature, not a wall.
    standLine: One corridor above continuous rating, and a relay that will decide in forty minutes.
    station:
      kind: panel
      title: Corridor loading
      rows:
        - { label: Circuit 2 loading, value: 108 per cent, status: high }
        - { label: Continuous rating, value: 1,060 A, status: normal }
        - { label: Emergency rating, value: 1,240 A for 30 min, status: high }
        - { label: Conductor temperature, value: 78 °C, status: high }
  DIST:
    caption: Restoration is measured in households and how long they waited.
    standLine: Eleven feeders out, and two of them have the clinic on them.
    station:
      kind: panel
      title: Feeder status
      rows:
        - { label: Feeders out, value: 11, status: high }
        - { label: Households off, value: 14,200, status: high }
        - { label: Priority load off, value: 2 circuits, status: high }
        - { label: Crews available, value: 3, status: low }
  LOAD:
    caption: A forecast is a distribution, and the width is what the reserve has to cover.
    standLine: Tomorrow's peak, and two estimates a factor apart on the cold snap.
    station:
      kind: panel
      title: Demand forecast
      rows:
        - { label: Forecast peak, value: 6,900 MW, status: normal }
        - { label: Forecast width, value: plus or minus 400 MW, status: high }
        - { label: Reserve held, value: 310 MW, status: low }
        - { label: Temperature at peak, value: -4 °C, status: normal }
  METER:
    caption: A sequence of events is a claim about order, and order needs clocks.
    standLine: Three records of the same eight seconds, disagreeing about what came first.
    station:
      kind: panel
      title: Records bench
      rows:
        - { label: Fast recorder, value: 20 ms, status: normal }
        - { label: SCADA scan, value: 4 s, status: high }
        - { label: Relay clock offset, value: 1.6 s early, status: high }
        - { label: Last calibration, value: 41 days, status: low }

# ------------------------------------------------------------------ the copy
# What each place says when the player reads its panel. Keyed by group id for the
# six areas and by the plain landmark ids in site.js — a building with no entry
# here shows a bare title, and validateContent notes it.
copy:
  OPS: <p>The control room. One long desk, a wall of the whole interconnection, and the only number on it that belongs to everybody.</p>
  GEN: <p>The machine hall. Four sets turning in step with every other machine on the system, which is what lets one number describe all of them.</p>
  TRANS: <p>Protection and switching. The rules for an argument that will happen in eighty milliseconds with nobody present.</p>
  DIST: <p>The depot. Where the network stops being a diagram and turns into a van, a pole and somebody's evening.</p>
  LOAD: <p>Forecasting. Weather, the school holidays, and whether it gets dark before people get home.</p>
  METER: <p>Standards. The question nobody wants opened during an incident: is that number the number.</p>
  GATE: <p>The gatehouse. Badge, permit to work, and the day's calls.</p>
  STORE: <p>Spares and cable. Nothing here is interesting until the night a restoration is limited by it.</p>
  TRAINING: <p>The simulator room. Last year's event, replayed at quarter speed, with the log open beside it.</p>

          switching change
        concept: Transmission losses and conductor sizing
        place: Transmission & Protection
        scene: With the feeder out, flow has redistributed and the corridor is carrying more. Novak, the protection engineer, wants the heat figure before he decides whether the evening needs a switching change. A printed network diagram lies on the desk.
        guide: >-
          Five numbers, and two of them are the current an hour ago and the conductor
          temperature. Neither belongs in the loss. Ask of each number whether the heat
          depends on it. And note the square. Current has risen about eleven per cent,
          and the heat rises by nearly a quarter. The rating is thermal, so that is a
          bigger bite of the margin than it looks.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs. And whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how you catch a unit mismatch before you place it. It also catches a quantity that belongs to a different part of the problem. That habit is what this format exists to build.
        takesAsRead:
          - Ohm's law and resistive networks
          - Electrical power and energy over time
        assumes:
          - loss in a conductor rises with the square of the current
        takeaway: When a quantity enters squared, a small change in it is a large change in the result.
        format: BALLPARK
        question: Estimate the power now lost as heat in the corridor.
        answerText: About 21 MW.
        why: The same loss relation now gives a worse answer. Resistive heating rises with the square of RMS current, across all three phases. Current has risen by about 11%, from 1,150 A to 1,280 A. The heat rises by about 24%, from roughly 17 MW to 21 MW. That matters because the conductor rating is thermal. A small-looking increase in current can therefore use a much larger fraction of the available temperature margin.

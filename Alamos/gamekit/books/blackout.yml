          - >-
              What happens above the limit. Aluminium held above its continuous temperature
              begins to anneal, losing strength it does not get back, and the hotter span
              stretches and sags. The clearance over the road below is a legal minimum. So the temperature limit is doing two jobs at once: protecting the conductor, and keeping the line where the survey says it is.

# blackout.yml — Blackout, as a book.
#
# Course: AP Physics 2 circuits and induction, with a first-year
# electrical-engineering unit. Grade 12–13. The syllabus this is measured against
# is `blackout` in tools/syllabus.js — 32 concepts and 10 equations, written
# before these questions, so page 3 of the printed book says what is still owed.
#
# The campaign is one argument with two right sides: shed load now and cut power
# to people who need it, or hold on and risk the whole interconnection. Both are
# correct on different days.
#
# The spine of the subject is one equation. Frequency is not a reading, it is the
# running balance of supply and demand, and everything a control room does
# follows from df/dt = (P_gen − P_load) / 2H. Days 1–5 build to it; the black
# start at the end of the campaign is the ordering puzzle it licenses.

theme:
  id: blackout
  title: Blackout
  subtitle: System Operator · Calder Interconnection

# ---------------------------------------------------------------- the areas
# Six, and each is a place with a different question. Operations holds the whole
# system and no single piece of it; the other five each own one physical layer.
groups:
  - id: OPS
    code: OPS
    name: System Operations
    color: '#c0392b'
    desc: The whole network at once, and the decisions that cannot wait for certainty.
    defaultLeader: reyes
    milestones: [Read the system, Find the constraint, Choose the action, Hand over the shift]
  - id: GEN
    code: GEN
    name: Generation
    color: '#d35400'
    desc: Machines that turn something into torque, and what they can be asked to do next.
    defaultLeader: haddad
    milestones: [Know the plant, Match the load, Hold the frequency, Ready to synchronise]
  - id: TRANS
    code: TRANS
    name: Transmission & Protection
    color: '#2980b9'
    desc: Getting power a long way, and the relays that decide when to give up on a line.
    defaultLeader: novak
    milestones: [Trace the path, Rate the line, Set the protection, Prove the coordination]
  - id: DIST
    code: DIST
    name: Distribution
    color: '#27ae60'
    desc: The last few kilometres, where the network stops being a diagram and becomes a street.
    defaultLeader: obi
    milestones: [Map the feeder, Balance the phases, Hold the voltage, Restore the customers]
  - id: LOAD
    code: LOAD
    name: Load & Forecasting
    color: '#8e44ad'
    desc: What people are about to do, and how much of it the system has to be ready for.
    defaultLeader: lindgren
    milestones: [Read the curve, Forecast the peak, Price the reserve, Justify the margin]
  - id: METER
    code: METER
    name: Metering & Standards
    color: '#b0762a'
    desc: Whether the numbers everybody is arguing about are the numbers.
    defaultLeader: farrow
    milestones: [Trace the instrument, Bound the error, Reconcile the records, Certify the data]

# ------------------------------------------------------------------ the cast
roster:
  - id: reyes
    name: Dolores Reyes
    role: Shift Supervisor, System Operations
    division: OPS
    bio: |
      22 years on the desk, 11 of them on nights. She runs the room
      the way a bridge is run: nobody touches a control without saying out loud
      what they expect to happen, and then whether it did.

      Her rule is that frequency is the only number on the wall that belongs to
      everybody. Voltage is local and can be argued about; frequency is the whole
      interconnection agreeing or failing to agree, and it moves before anything
      else does.

      Her limit is that she is paid to act before the picture is complete. The
      operator who waits for certainty is the operator who watches the cascade.
    quiz:
      - q: Why does Reyes treat frequency differently from voltage?
        a: Frequency is one number for the whole interconnection
        wrong:
          - Voltage instruments are more accurate than frequency instruments during a disturbance
          - Voltage cannot be measured while the system is swinging
          - Frequency matters at the generators and nowhere else
  - id: haddad
    name: Nadia Haddad
    role: Generation Lead
    division: GEN
    bio: |
      Came up through turbine commissioning and still walks a machine hall
      listening rather than reading. She can tell a governor hunting from the
      sound of it before the trend on the screen has moved.

      What she wants understood is that a generator is a flywheel first and a
      power source second. The stored rotational energy is what buys the seconds
      in which anybody gets to make a decision.

      Her limit is ramp rate. A machine that can supply 400 megawatts
      cannot supply them in the 90 seconds after a trip, and no amount of
      wanting changes the thermal gradient in a steam drum.
    quiz:
      - q: Why does Haddad describe a generator as a flywheel first?
        a: Its stored rotational energy slows the frequency change
        wrong:
          - Because a flywheel stores more energy per tonne than a boiler and its steam plant do
          - Because the turbine and the flywheel are the same component
          - Because rotational energy costs less per megawatt than fuel
  - id: novak
    name: Piotr Novak
    role: Protection Engineer
    division: TRANS
    quiz:
      - q: Why does Novak call a relay setting the rules for an argument nobody attends?
        a: The relay has to decide alone, in milliseconds, from settings written months earlier
        wrong:
          - Relay settings are agreed by a standing committee that never meets in the same room
          - The argument is between the two ends of a line that cannot talk to each other in time
          - Nobody is allowed in the yard while protection is live
    bio: |
      Sets the relays, which means he designs the conditions under which the
      network is allowed to give up on part of itself. He describes the job as
      writing the rules for an argument that will happen in 80 milliseconds
      with nobody present.

      A relay that never trips is not a cautious relay, it is a relay that lets a
      fault burn. A relay that trips early takes out a healthy line and moves the
      overload somewhere less convenient. Coordination is the whole discipline.

      His limit is that he is protecting against faults he has to imagine in
      advance, and the cascade always finds the sequence nobody drew.
  - id: obi
    name: Chinelo Obi
    role: Distribution Lead
    division: DIST
    bio: |
      Runs the feeders, which is where the network acquires customers, trees and
      opinions. She points out that every elegant thing decided in the control
      room arrives here as a van, a pole and somebody's evening.

      Her measure of a restoration is not megawatts, it is households and how
      long they waited, and she will say so in a meeting about megawatts.

      Her limit is that the low-voltage network is only sparsely instrumented.
      Past the substation she is often reasoning from the shape of the load
      rather than from a reading.
    quiz:
      - q: Why does Obi resist reporting restoration purely in megawatts?
        a: A few large customers can dominate the megawatts restored
        wrong:
          - Megawatts restored is a settlement quantity and is not available until afterwards
          - Household supply is not counted in the system total
          - Distribution work is measured in amperes rather than in watts
  - id: lindgren
    name: Sten Lindgren
    role: Load Forecasting
    division: LOAD
    quiz:
      - q: What does Lindgren mean by calling forecasting anthropology with a thermometer?
        a: Demand is what people do, and weather is only one of the things that decides it
        wrong:
          - Forecasters interview a panel of households about their heating every winter
          - The model is built from historical temperature alone
          - Demand can be predicted from population size and nothing else
    bio: |
      Forecasts demand, which he insists is a branch of anthropology conducted
      with a thermometer. Weather, the television schedule, the school holidays
      and whether it gets dark before people get home.

      He is precise about what a forecast is: a distribution, not a number. The
      useful output is the width, because the width is what the reserve has to
      cover.

      His limit is that the events worth forecasting are rare by construction, so
      the model is always best calibrated for the days that matter least.
  - id: farrow
    name: June Farrow
    role: Metering & Standards
    division: METER
    bio: |
      Owns the question nobody wants to open during an incident: is that number
      the number. Instrument transformers, telemetry lag, clock skew, and the
      cheerful confidence of a meter reading the wrong side of a saturated core.

      She keeps the traceability chain because after the event there will be an
      inquiry, and the inquiry will run on the records rather than on anybody's
      memory of the night.

      Her limit is that she is usually reconstructing rather than observing, and
      the highest-value seconds are the ones with the worst data.
    quiz:
      - q: Why does Farrow distrust telemetry during a fast disturbance?
        a: Scan rates and clock skew can put readings in the wrong order
        wrong:
          - Instrument transformers saturate during a fault and stop reporting altogether
          - Telemetry stops being sent once frequency leaves its band
          - Digital meters are less accurate than the analogue ones they replaced
  - id: whitlock
    name: Aaron Whitlock
    role: Assistant Operator
    division: OPS
    quiz:
      - q: Why is the log Whitlock keeps worth more than the reports written afterwards?
        a: It records what the room knew at the time, before anybody knew how it ended
        wrong:
          - It is the only document the regulator is entitled to ask the company for
          - Reports are written afterwards by people who were not on shift that night
          - The log records exact times and the reports do not
    bio: |
      Second seat on nights, three years in, and the person who actually keeps
      the log. Has read every sequence-of-events report the company owns and can
      quote which ones contradict the official account.
  - id: sarraf
    name: Mina Sarraf
    role: Wind Fleet Controller
    division: GEN
    quiz:
      - q: Why does Sarraf say curtailing a turbine is not waste?
        a: Energy that cannot reach a customer was never available, whatever the wind was doing
        wrong:
          - Curtailed output is held in storage and released later the same night
          - The fleet is paid the same under contract whether it runs or not
          - Turbines last longer when they are not run at full output
    bio: |
      Dispatches the ridge fleet from a desk with more forecast on it than
      telemetry. Explains patiently and often that curtailing a turbine is not
      waste when the alternative is a line at its thermal limit.
  - id: dube
    name: Thabo Dube
    role: Substation Technician
    division: TRANS
    quiz:
      - q: Why does Dube read a switching order back before he touches anything?
        a: Saying it aloud is the one chance to catch a wrong item before it is irreversible
        wrong:
          - The control room records the readback afterwards as proof of who is liable
          - Reading aloud is required by the radio protocol in the yard
          - It gives the control room time to cancel the instruction
    bio: |
      Does the switching in the yard when the control room asks for it, in the
      order it is written, reading it back before he touches anything. Has opinions
      about people who improvise switching sequences.
  - id: kowalczyk
    name: Ewa Kowalczyk
    role: Field Crew Lead
    division: DIST
    quiz:
      - q: Why does Kowalczyk know which streets have the dialysis clinic on them?
        a: Restoration order is decided by what waiting costs, not by how many houses are on the feeder
        wrong:
          - Those streets are required by law to be restored first in every outage
          - Medical addresses are the only ones the fault-finding system records
          - Crews are paid a premium for restoring critical premises
    bio: |
      Runs the crew that finds the fault, which is usually a tree, and puts the
      feeder back. Knows which streets have the hospital, the dialysis clinic and
      the two houses on home oxygen.
  - id: alvarez
    name: Rafael Alvarez
    role: Demand Analyst
    division: LOAD
    quiz:
      - q: What is Alvarez's counterfactual demand curve for?
        a: It says what demand would have been without the event, which is what the loss is measured against
        wrong:
          - It predicts what demand will be over the course of the following week
          - It shows which feeders were restored in which order
          - It converts megawatts into megawatt-hours for the report
    bio: |
      Builds the load curves and the counterfactuals. Spends the day after an
      event working out what demand would have been if the event had not happened,
      which is the number every settlement argument turns on.
  - id: bergström
    name: Klara Bergström
    role: Calibration Technician
    division: METER
    quiz:
      - q: Why will Bergström not be hurried over a disputed reading?
        a: A reading is only admissible if the instrument's traceability can be shown, and that takes as long as it takes
        wrong:
          - Calibration records can only be updated at the end of an accounting month
          - She is the only person permitted to touch the standards
          - A rushed calibration would damage the reference instrument
    bio: |
      Keeps the standards traceable and the calibration records current. The
      cheerful arbiter of whether a disputed reading is admissible, and immune to
      being hurried.

# ------------------------------------------------------------------- glossary
glossary:
  - name: Frequency
    aliases: [frequency, hertz]
    def: How many times a second the alternating supply completes a cycle. It is the same number everywhere
      on one interconnection, and it moves up when generation exceeds demand and down when demand exceeds
      generation.
  - name: Load
    aliases: [load, demand]
    def: The total power being drawn from the system at a given moment.
  - name: Megawatt
    aliases: [megawatt, mw]
    def: 1 million watts. The unit a power system is argued about in; a large generating unit is a few
      hundred of them.
  - name: SCADA
    aliases: [scada]
    def: The monitoring system that collects readings from substations and presents them in the control
      room. It samples every few seconds, which is slow compared with a fault.
  - name: Inertia
    aliases: [inertia, rotational inertia]
    def: The rotational energy stored in spinning generators. It resists a change in frequency, which is
      what buys time for anything else to respond.
  - name: RMS
    aliases: [rms, root mean square]
    def: The steady value that would deliver the same power as a varying one. Mains voltages are quoted
      this way, not as their peak.
  - name: Power factor
    aliases: [power factor]
    def: The fraction of the apparent power that does real work, equal to the cosine of the angle between
      voltage and current.
  - name: Reactive power
    aliases: [reactive power, kvar, mvar]
    def: Power that flows back and forth without being consumed. It does no work but it occupies capacity
      and it is what moves voltage.
  - name: Apparent power
    aliases: [apparent power, volt-ampere]
    def: The product of RMS voltage and RMS current, whatever the phase between them. It is what a cable
      and a transformer are rated for.
  - name: Droop
    aliases: [droop, governor droop]
    def: A deliberate setting that makes a generator reduce output as frequency rises, so several machines
      share a change in load without fighting each other.
  - name: Contingency
    aliases: [contingency, n-1]
    def: A credible single failure the system is required to survive without shedding load.
  - name: Load shedding
    aliases: [load shedding, shed load]
    def: Disconnecting customers on purpose to bring demand down to what generation can supply.
  - name: Calibration
    aliases: [calibration, calibrate, calibrated]
    def: Checking an instrument against a standard already known to be right, so that its readings mean
      something. A drifted instrument is confident and wrong, and it does not say which.
  - name: Instrument transformer
    aliases: [instrument transformer, current transformer]
    def: A device that scales a large voltage or current down to something a meter can read safely.
  - name: Feeder
    aliases: [feeder]
    def: One distribution circuit leaving a substation, with the homes and businesses it supplies
      spread along it.

# ---------------------------------------------------------------- the days
missions:
  - title: The number on the wall
    objective: Establish what the frequency is actually telling the room before anybody acts on it.
    briefing: A unit tripped at 04:12 and the frequency has not come back to where it started.
    stake: >-
      Tuesday, 04:12, and the largest unit on the Calder system has tripped without warning. Frequency fell
      and then steadied somewhere below where it began, which Dolores Reyes says matters more than the fall
      itself — a system that stops falling has found a new balance, and the new balance is short. Nadia Haddad
      has machines that can make up the shortfall but not in the next two minutes. June Farrow wants the
      records checked before anybody calls it a lost unit, and Reyes is not waiting: a system this far
      short does not get more certain while you read about it. This morning Reyes is right. Today you read what the
      frequency is telling you, work out how much generation actually went missing, and decide what to ask
      for first. Read it as a fault on one machine and you will spend the morning fixing the wrong thing.
    takeaway: Frequency is not a reading from a place; it is the whole system's supply and demand, arriving as a number.
    stops:
      - group: OPS
        task: From a falling trend to a statement about the system
        title: What a frequency trend is evidence of
        place: System Operations
        scene: The wall shows frequency dropping for eight seconds, then flattening low. Aaron Whitlock, the assistant operator, has the log open. Two people have already named a cause, and he wants a statement the record can defend.
        assumes:
          - an alternating supply has a frequency measured in cycles per second
        takeaway: Frequency is a system-wide balance signal; its rate of change depends on both the power mismatch and stored kinetic energy.
        format: PROTOCOL
        why: System frequency reflects the balance between real power entering the interconnection and real power being demanded. After a sudden generation loss, stored kinetic energy in synchronized machines supplies the deficit briefly, so frequency begins to fall. The initial rate of change depends on both the power mismatch and that stored energy. A later flattening can be governor response at a lower frequency, not full recovery. Frequency is therefore strong evidence of a system-wide imbalance, while voltage is much more local.
        rebuttals:
          - A common frequency across the system is the machines turning in step, not a coincidence of separate meters.
          - The rate of fall measures the size of the mismatch against the inertia available, which is why it is the first number to read.
          - Flattening low is a new equilibrium the governors have settled into, not the system recovering.
          - Voltage is the local quantity; it tells you where, and it is why it disagrees between substations.
        scenarios:
          - Every substation reports the same frequency to two decimal places.
          - The trend fell steeply for the first two seconds, then more slowly.
          - The frequency has stopped falling and is sitting below its starting value.
          - Two substations report voltages that differ by 3%.
        choices:
          - The machines are all turning in step, so this is one system-wide quantity.
          - The steepness measures the mismatch against the inertia that was there to absorb it.
          - The governors have found a new balance at a lower speed, and it will stay there.
          - Voltage is local, which is what makes it useful for saying where rather than whether.
        mapping: [0, 1, 2, 3]
      - group: GEN
        task: Estimate the generation that went missing
        title: How much power actually left the system
        place: Generation Hall
        scene: Haddad, the generation lead, needs a number before starting anything. The only clean evidence is the first two seconds of the trend and the stored-energy figure for the machines that were online overnight.
        assumes:
          - a rate of change can be read off the steep part of a trend
        takeaway: The initial rate of frequency change measures the size of the imbalance, given the inertia.
        format: BALLPARK
        question: Estimate the generation lost at the moment of the trip.
        answerText: About 300 MW.
        why: Immediately after a generator trip, governor and reserve actions have not yet changed the power balance. Stored kinetic energy supplies the shortfall for the first moments, so frequency moves. With stored kinetic energy E_k, nominal frequency f₀ and measured rate df/dt, the imbalance is ΔP = 2E_k|df/dt|/f₀. Using 25,000 MW·s, 50 Hz and 0.30 Hz/s gives about 300 MW. This estimate is most useful before slower controls begin reshaping the trace.
        estimate:
          prompt: |-
            Frequency fell at 0.30 Hz per second over the first 2 seconds. The machines online held 25,000 MW·s of stored kinetic energy. Nominal frequency is 50 Hz.
          question: Choose the stored energy, the rate of fall and the nominal frequency.
          labels:
            - 25000 MW·s  (stored kinetic energy)
            - 0.30 Hz/s  (initial rate of fall)
            - 50 Hz  (nominal frequency)
            - 0.18 Hz  (the settled deviation)
            - 6400 MW  (generation online)
          values: [25000, 0.3, 50, 0.18, 6400]
          slots: 3
          template: 2 × {0} × {1} ÷ {2}
          formula: 2*a*b/c
          correct: [0, 1, 2]
          target: 300
          tolerance: 45
          units: MW
          solution: "|ΔP| = 2 × 25,000 × 0.30 ÷ 50 = 300 MW."
          explanation: |-
            About 300 megawatts. That is a unit, not a faulty meter. The settled deviation and the generation online are both real figures, and neither belongs here. The first is what the governors did afterwards. The second is the denominator for a different question.
          givens:
            - Stored kinetic energy online is 25,000 MW·s
            - Initial rate of fall is 0.30 Hz per second
            - Nominal frequency is 50 Hz
          relationship: Power imbalance magnitude = 2 × stored kinetic energy × |df/dt| ÷ nominal frequency.
      - group: METER
        task: Open the timing dependencies, keep the evidence that stands independently, and name the failed time source.
        title: The order the records claim things happened in
        place: Metering & Standards
        scene: June Farrow, the metering engineer, has three records of the same eight seconds. They disagree about what happened first. One record was stamped by a clock nobody has checked since spring.
        assumes:
          - a timestamp combines a measured event with a clock reference
          - two channels can agree because they share the same source
        takeaway: Agreement is independent evidence only when the channels do not share the same dependency.
        format: TRACE
        question: Which records still support the event order, and what shared source explains the false early timestamps?
        trace:
          hint: Open each channel to see which clock and physical input it depends on. Keep only the claims each channel can support, then name the shared source behind the false early time.
          channels:
            - id: relay-log
              label: Protection relay event log
              reading: pickup 1.6 s before the GPS record; internal intervals match
              measures: event order and absolute time
              depends:
                - relay-clock
                - breaker-contact
            - id: relay-annunciator
              label: Local relay annunciator
              reading: alarm 1.6 s early on the same absolute clock
              measures: alarm time
              depends:
                - relay-clock
            - id: gps-recorder
              label: GPS disturbance recorder
              reading: pickup, then trip 0.28 s later
              measures: event order and absolute time
              depends:
                - gps-clock
                - breaker-contact
            - id: scada
              label: SCADA historian
              reading: breaker open in the next 2.0 s scan
              measures: coarse breaker state
              depends:
                - scada-clock
                - breaker-contact
          resources:
            - id: gps-clock
              label: GPS time receiver
              note: Locked throughout the event.
            - id: relay-clock
              label: Relay internal clock
              note: Last checked in spring.
            - id: scada-clock
              label: SCADA server clock
              note: Network-synchronised; scan period 2.0 s.
            - id: breaker-contact
              label: Breaker auxiliary contact
              note: Reports physical breaker state.
          target: relay-clock
          independent:
            - gps-recorder
            - scada
        answerText: Keep the GPS disturbance recorder for event order and the SCADA record only for coarse breaker state. The relay event log and local relay annunciator share the drifted relay clock; that clock is the failed source.
        why: A timestamp contains a physical event and a clock claim. Those can fail separately. Two relay-derived records can agree because they share one internal clock, so their agreement is not two independent measurements. The GPS disturbance recorder uses a different time source and preserves the physical ordering. The slower SCADA record can still confirm breaker state, even though its two-second scan cannot resolve sub-second order. Dependency tracing keeps useful evidence instead of discarding every channel touched by the bad clock.
  - title: What the line can carry
    objective: Decide which circuit takes the flow once one path is gone.
    briefing: With the unit off, the flow has redistributed and one corridor is running warm.
    stake: >-
      Wednesday, and the replacement generation is coming from the wrong side of the system, which means it
      is arriving down two circuits instead of three. Piotr Novak has a corridor sitting above its
      continuous rating and a relay that will take the decision away from the room in about 40 minutes
      if nobody else does. The 40 minutes comes off a thermal record June Farrow has not verified, and she
      says so. Thabo Dube is in the yard waiting for a switching instruction. Today you rate
      the line honestly, work out where the flow goes if it trips, and decide whether to move generation
      or accept the risk. A thermal rating is not a cliff, and treating it as one is how a warm line becomes
      two cold ones.
    takeaway: A rating is a time and a temperature, not a wall, and what matters is where the flow goes next.
    stops:
      - group: TRANS
        task: Set the overload action thresholds before the corridor trend is released.
        title: What you do before a relay does it for you
        place: Transmission Control
        scene: The corridor is at 108% of continuous rating and rising slowly. Novak, the transmission engineer, wants a response he can hand to Dube, the switching operator, before the relay makes the choice for them.
        assumes:
          - continuous and emergency ratings are different limits
          - redispatch is slower than automatic or operator load shedding
        takeaway: A protection plan must be written before the number moves, with earlier thresholds for actions that take longer to arrive.
        format: TRIGGER
        question: At what loading should redispatch and then load shedding be committed, given their different lead times?
        trigger:
          hint: Choose a loading threshold for each action, then release the trend. The action begins only after its lead time, so a threshold can be correct in principle and still arrive too late.
          scale:
            min: 100
            max: 125
            unit: "% of continuous rating"
          ceiling: 120
          stream:
            - t: 0
              value: 108
              hoursLeft: 576
              at: day 0
              update: 108 % of continuous rating
            - t: 4
              value: 110
              hoursLeft: 480
              at: day 4
              update: 110 % of continuous rating
            - t: 8
              value: 113
              hoursLeft: 384
              at: day 8
              update: 113 % of continuous rating
            - t: 12
              value: 116
              hoursLeft: 288
              at: day 12
              update: 116 % of continuous rating
            - t: 16
              value: 118
              hoursLeft: 192
              at: day 16
              update: 118 % of continuous rating
            - t: 20
              value: 119.5
              hoursLeft: 96
              at: day 20
              update: 119.5 % of continuous rating
            - t: 24
              value: 120.5
              hoursLeft: 0
              at: day 24
              update: 120.5 % of continuous rating
          tolerance: 1
          conditions:
            - id: redispatch
              label: Redispatch 200 MW away from the corridor
              target: 110
              unit: min
              leadHours: 6
            - id: shed
              label: Shed 8% of downstream load
              target: 118
              unit: min
              leadHours: 1
        answerText: Set redispatch to trigger at 110% of continuous rating and emergency shedding at 118%. Those thresholds leave enough lead time on this authored trend for the slower action to arrive before the 120% emergency ceiling.
        why: An emergency rating is a time-limited thermal allowance, not permission to wait until the relay acts. The response has stages because each action has a different lead time. Redispatch takes several minutes, so it must be triggered while thermal margin still exists. Load shedding acts faster and can sit at a later threshold. Writing both rules before the trend appears prevents hindsight from turning into policy. A threshold that is physically sensible but fires after its action can arrive is still a failed rule.
      - group: LOAD
        task: Estimate the loss in the loaded corridor
        title: The power that never arrives
        place: Load & Forecasting
        scene: Sten Lindgren, who forecasts demand, wants the loss figure before the morning call. The argument about moving generation is really an argument about waste. The yard radio is still live beside them.
        assumes:
          - current through a resistance dissipates power as heat
        takeaway: Loss rises with the square of current, which is why a small overload costs more than it looks.
        format: BALLPARK
        question: Estimate the power lost as heat in the loaded corridor.
        answerText: About 17 MW.
        why: Resistive loss in one phase is the RMS current squared times that phase resistance. A balanced three-phase corridor has three such conductors, so the total is three times I squared R. The square is the key. 10% more current means about 21% more heat. High transmission voltage helps because the same real power can be moved with less current. Lower current then cuts resistive loss sharply, which is why a modest overload can consume thermal margin faster than its percentage suggests.
        estimate:
          prompt: The balanced corridor carries 1,150 A RMS in each phase. Each phase has 4.2 ohms of resistance over the full corridor.
          question: Choose the current, the resistance and the number of phases.
          labels:
            - 1150 A  (RMS current per phase)
            - 4.2 Ω  (resistance per phase)
            - 3  (phases)
            - 400 kV  (line voltage)
            - 0.96  (power factor)
          values: [1150, 4.2, 3, 400, 0.96]
          slots: 3
          template: "{0} × {0} × {1} × {2}"
          formula: a*a*b*c
          correct: [0, 1, 2]
          target: 16663500
          tolerance: 1500000
          units: W
          solution: P_loss = 3 × 1150² × 4.2 ≈ 1.67 × 10⁷ W ≈ 17 MW.
          explanation: |-
            About 17 megawatts, turned into warm air. The line voltage and the power factor both belong to other calculations — voltage sets what current is needed for a given power, and power factor decides how much of the apparent power does work — but neither enters the loss itself.
          givens:
            - RMS current is 1,150 A in each phase
            - Resistance is 4.2 Ω per phase over the corridor
            - There are three phases
          relationship: Line loss = 3 × I_rms² × R_phase, the electrical power P = I²R paid once per phase. The current is RMS, the resistance per phase.
      - group: OPS
        task: Choose what to do about the warm corridor
        title: The contingency you are actually protecting against
        place: System Operations
        scene: Reyes, the system operator, wants a decision. The corridor is inside its emergency rating for another half hour. The question on the table is what happens elsewhere if this element trips.
        assumes:
          - a network is required to survive the loss of any single element
        takeaway: A rating is only interesting alongside what the flow does when that element is gone.
        format: CHOICE
        question: What makes the loaded corridor a problem worth acting on now?
        answerText: "The urgent problem is the post-contingency flow: if this corridor trips, a neighbouring circuit exceeds its emergency rating and a cascade can begin."
        why: Running above a continuous rating is a decision about time and temperature. The emergency rating exists so that decision can be made. What turns this from expensive into dangerous is the contingency. One corridor is already loaded. Lose it, and its flow lands on neighbours that are not rated for the sum. That second trip is a relay working correctly, not a choice anybody makes. This is the whole of the N-1 rule. The system is not required to be comfortable.
        choices:
          - Because exceeding the continuous rating means insulation damage starts immediately.
          - Because losing this corridor would push a neighbouring circuit beyond its emergency rating and invite a second trip.
          - Because the 17 MW of resistive loss is already large enough to make protection operate.
          - Because the protection relay must trip before the operator can use the emergency rating.
        answer: Because losing this corridor would push a neighbouring circuit beyond its emergency rating and invite a second trip.
        rebuttals:
          - An emergency rating exists specifically to allow limited operation above the continuous rating; the urgent issue is what follows a trip.
          - Resistive loss creates heat, but the protection concern here is the post-contingency overload on the neighbouring circuit.
          - The relay and emergency rating are coordinated; the danger is the next circuit exceeding its own limit after the first corridor is lost.
  - title: The last few kilometres
    objective: Get customers back on in an order that can be defended afterwards.
    briefing: 11 feeders are still dead and the crews can only be in 1 place at a time.
    stake: >-
      Thursday, and the transmission side is steady, but 11 distribution feeders are still dead. Chinelo
      Obi has 3 crews and 14000 households in the dark. One of her circuits carries a
      dialysis clinic. Another carries 1000 homes. Ewa Kowalczyk is at the first fault already, and it
      is a tree. Today you work out why the far end of a long feeder sits below limit, decide what sets the
      current a conductor may carry, and choose which circuit gets the first crew. Every hour of this is
      somebody sitting in the cold. The order you choose is the order an inquiry will read back to you.
    takeaway: Restoration is a series of choices about people, made with instruments that only see the substation.
    stops:
      - group: DIST
        task: Estimate the volt drop to the end of the feeder
        title: Why the far end sits low
        place: Distribution Depot
        scene: The substation end of the feeder is at nominal voltage. Customers four kilometres along it are complaining, and the only meter is back at the substation. The room is waiting for a written instruction.
        assumes:
          - current flowing through a resistance produces a drop in voltage
        takeaway: Volt drop is set by the current and by both parts of the line's impedance.
        format: BALLPARK
        question: Estimate the volt drop from the substation to the far end.
        answerText: About 1.07 kV line-to-line, roughly 9.7% of an 11 kV feeder.
        why: A real feeder has both resistance and reactance. Current through those terms produces a voltage drop whose size depends on the load phase angle. The resistive part follows the in-phase current. The reactive part follows the out-of-phase current. For a balanced three-phase feeder expressed with line-to-line voltage, the result carries a factor of root three. That factor matters here because 11 kV is a line-to-line rating. Reactive support can raise the far-end voltage by reducing the reactive part of the drop.
        estimate:
          prompt: |-
            The feeder carries 310 A. Over 4 kilometres it has 1.8 ohms of resistance and 0.9 ohms of reactance. The load runs at 0.95 power factor, so sin of the angle is 0.31.
          question: Choose the current, both parts of the impedance, and the two parts of the angle.
          labels:
            - 310 A  (feeder current)
            - 1.8 Ω  (resistance)
            - 0.95  (cos φ)
            - 0.9 Ω  (reactance)
            - 0.31  (sin φ)
            - 11000 V  (nominal feeder voltage)
          values: [310, 1.8, 0.95, 0.9, 0.31, 11000]
          slots: 5
          template: "{0} × ({1} × {2} + {3} × {4})"
          formula: a*(b*c+d*e)
          correct: [0, 1, 2, 3, 4]
          target: 616.6
          tolerance: 60
          units: V
          solution: ΔV_LL ≈ 1.732 × 310 × (1.8 × 0.95 + 0.9 × 0.31) ≈ 1,069 V ≈ 1.07 kV.
          explanation: About 1.07 kV line-to-line, close to 10% of an 11 kV feeder. That is large enough to explain complaints at the far end while the sending-end meter looks normal. The nominal 11 kV is used to judge the percentage drop; it is not multiplied into the drop formula.
          givens:
            - Feeder current is 310 A
            - Resistance is 1.8 Ω and reactance is 0.9 Ω
            - Power factor is 0.95, so sin φ is 0.31
          relationship: For a balanced three-phase feeder, line-to-line drop ≈ √3 × I × (R cos φ + X sin φ), using per-phase R and X.
      - group: TRANS
        task: Match each observation to what it constrains
        title: What actually limits a conductor
        place: Transmission & Protection
        scene: Novak is asked to allow more current down a circuit for the afternoon. He wants each reason for saying no matched to the thing it is actually about. The shift log is open beside them.
        assumes:
          - a conductor warms up as current passes through it
        takeaway: Current sets the heat, voltage sets the insulation, and the two limits are separate.
        format: PROTOCOL
        why: Two different limits get confused. Heat comes from current, and it does not care what voltage the conductor is at. The insulation and the clearances care about voltage, and they do not care what current is flowing. So a circuit can be at nominal voltage and still be over its thermal limit, which is the case in front of the room. Volt drop is a third thing again, a consequence of current, and it is a customer problem rather than a safety one.
        rebuttals:
          - Heating is proportional to current squared and is independent of the voltage the conductor sits at.
          - Insulation and clearance are set by voltage, and are unaffected by how much current flows.
          - Volt drop follows from current along the impedance, and it reaches the customer before it reaches a limit.
          - Sag is thermal expansion, which is the one point where a heat limit becomes a clearance limit.
        columns:
          - What somebody has noticed
          - What it is a constraint on
        scenarios:
          - The conductor is running at 78 °C on a 75 °C continuous rating.
          - The circuit has been switched to a higher nominal voltage than it was built for.
          - Customers at the end of the circuit report low voltage in the evening peak.
          - The span over the road has dropped by a metre since the morning.
        choices:
          - A heat limit, set by current and not by voltage at all.
          - An insulation limit, set by voltage and not by current.
          - A volt drop, which is a consequence of current along the line's impedance.
          - A clearance limit, which is where a heat limit turns into a safety one.
        mapping: [0, 1, 2, 3]
      - group: OPS
        task: Decide which circuit gets the crew first
        title: The order somebody will read back to you
        place: System Operations
        scene: 3 crews, 11 dead feeders, and a list in front of Reyes that mixes household counts with 1 clinic and 1 pumping station. The control-room phone is already ringing.. The shift log and network board are open beside them.
        assumes:
          - a crew can only work one fault at a time
        takeaway: The first crew goes where the consequence of waiting is worst, not where the count is biggest.
        format: CHOICE
        question: Which feeder should take the first crew?
        why: Two things decide this, and household count is only one of them. The first is what waiting costs, and for a dialysis clinic it is measured in treatments rather than in inconvenience. The second is how long the work takes, because a one-hour job frees the crew to take the next fault the same shift. The clinic circuit is worst on the first and best on the second, so it goes first on both counts.
        choices:
          - The feeder with 4,100 households, faulted at the substation end, 4 hours' work.
          - The dialysis clinic feeder — 180 homes, 1 pole, an hour's work.
          - The feeder with 2,600 households and a fault nobody has located yet.
          - The feeder feeding the water pumping station, already on its standby supply.
        answer: The dialysis clinic feeder — 180 homes, 1 pole, an hour's work.
        rebuttals:
          - The biggest count is a four-hour job, and starting it commits a crew for the whole shift.
          - A fault nobody has located cannot be given a duration, so it cannot be scheduled against the others.
          - The pumping station is running on its standby supply, so it is not off, and it can wait.
  - title: Is that number the number
    objective: Establish which readings the incident account is allowed to rest on.
    briefing: The report is due and two of the figures in it come from instruments nobody has checked.
    stake: >-
      Friday, and the account of Tuesday night has to be written down. Dolores Reyes wants it filed today so the
      week can close. June Farrow will not sign it while
      two of its figures come from instruments last calibrated in the spring. Nadia Haddad needs a machine
      back on the bars before the evening peak, and there is a right order for that which is not the order
      anybody is in a hurry to follow. Today you work out what the system was actually delivering, put the
      steps of synchronising a machine in the order physics requires, and settle an argument between a meter
      and an oscilloscope. This time Farrow is right, and the delay is the cheapest thing in the week: a number
      in a report outlives everybody who knew what it meant.
    takeaway: A reading is a claim about one quantity, and two instruments can disagree while both are right.
    stops:
      - group: METER
        task: Estimate the power the circuit was delivering
        title: What three phases actually add up to
        place: Metering & Standards
        scene: Farrow has line voltage, line current and a power factor from the night of the event. The report claims a figure for delivered power that nobody has reproduced. A printed network diagram lies on the desk.
        assumes:
          - a three-phase supply carries power on three conductors at once
        takeaway: Three-phase power from line quantities carries a factor of root three, and it is not three.
        format: BALLPARK
        question: Estimate the real power the circuit was delivering.
        answerText: About 5.6 MW of real three-phase power.
        why: The tempting mistake is to multiply by three because there are three phases. The factor is root three instead. Line voltage is measured between two phases, not from one phase to neutral. Those voltage definitions differ by root three, so the line-quantity power formula carries that factor. Power factor then selects the in-phase current that produces real power. Using three instead of root three overstates the answer enough to change the report.
        estimate:
          prompt: |-
            The circuit was at 11,000 V between lines, carrying 310 A per line, at 0.95 power factor. Root 3 is about 1.732.
          question: Choose root three, the line voltage, the line current and the power factor.
          labels:
            - 1.732  (√3)
            - 11000 V  (line voltage)
            - 310 A  (line current)
            - 0.95  (power factor)
            - 3  (number of phases)
            - 0.31  (sin φ)
          values: [1.732, 11000, 310, 0.95, 3, 0.31]
          slots: 4
          template: "{0} × {1} × {2} × {3}"
          formula: a*b*c*d
          correct: [0, 1, 2, 3]
          target: 5610814
          tolerance: 400000
          units: W
          solution: P = 1.732 × 11,000 × 310 × 0.95 ≈ 5.6 × 10⁶ W ≈ 5.6 MW.
          explanation: |-
            About five and a half megawatts. Using three instead of root three gives nearly ten, which is a different circuit. The phase count is a real fact about the system and is not the multiplier here. Sin φ belongs to the reactive part, which is a separate question.
          givens:
            - Line voltage is 11,000 V and line current is 310 A
            - Power factor is 0.95
            - Root 3 is about 1.732
          relationship: |-
            Real power = √3 × the line voltage × the line current × the power factor, with the voltage measured between lines rather than to neutral.
      - group: GEN
        task: Put the steps of synchronising in the order physics requires
        title: Four things that have to agree before the breaker closes
        place: Generation Hall
        scene: Haddad has a machine at rest and a system running at nominal. She wants the sequence written down before anybody is standing at the panel. The next operating call is minutes away.
        assumes:
          - a generator joined to a live system is forced to turn at the system's speed
        takeaway: Speed, then voltage, then phase angle, and only then the breaker.
        format: SEQUENCE
        why: Each step removes a different mismatch before the breaker closes. Match frequency first, because a speed difference forces a violent torque when the machine is tied to the grid. Match voltage next to avoid a large reactive current. Then wait for phase angle to approach zero as the two waveforms drift past each other. The breaker closes only when frequency, voltage and phase are all inside their allowed windows. Closing earlier turns a synchronization error into electrical and mechanical stress.
        cards:
          - Bring the machine up to the system's frequency.
          - Match the machine's voltage to the system's.
          - Wait for the phase angle between them to close on zero.
          - Close the breaker.
        order: [0, 1, 2, 3]
      - group: TRANS
        task: Check whether the scope and meter are consistent with the same sine-wave voltage.
        title: Two instruments, two quantities
        place: Transmission & Protection
        scene: An oscilloscope on the busbar shows a peak of 325 volts. The panel meter beside it reads 230. Both were calibrated last month and neither has moved. The yard radio is still live beside them.
        assumes:
          - an alternating voltage changes continuously through each cycle
        takeaway: Peak and RMS are different quantities, and one is the other divided by root two.
        format: CHOICE
        question: Which numerical relation should hold if both instruments are correct?
        answerText: 325 V ≈ 230 V × √2, or equivalently 325/√2 ≈ 230 V. The scope and meter are reporting peak and RMS values of the same sine wave.
        why: "An alternating voltage does not have one value, so any single number is a summary and the summary has to be named. The peak is the highest the waveform reaches. The RMS value is the steady voltage that would deliver the same power into a resistance. For a sine wave it is the peak divided by root two. Divide 325 by 1.414 and the meter's 230 comes straight out. This is why mains voltages are quoted as RMS everywhere: it is the figure that predicts heating and power."
        choices:
          - 325 V ≈ 230 V × √2
          - 325 V ≈ 230 V × 2
          - 230 V ≈ 325 V × √2
          - 230 V ≈ 325 V ÷ 2
        answer: 325 V ≈ 230 V × 2
        rebuttals:
          - Doubling would make peak twice RMS, but a sine wave differs by root two.
          - RMS is smaller than peak, so multiplying the peak by root two moves in the wrong direction.
          - Halving gives about 163 V, not the meter reading.
  - title: Enough in the tank
    objective: Decide what the system is holding back, and whether it is enough.
    briefing: Tomorrow's peak is colder than the forecast the reserve was set against.
    stake: >-
      Monday, and the forecast for tomorrow's evening peak has moved four degrees colder. Sten Lindgren says
      the number has not changed much but the width has, and the width is what the reserve has to cover.
      Rafael Alvarez has the storage figures from the weekend and they are worse than the brochure. Dolores
      Reyes has to say tonight how much generation is held back and how much is sold. Today you work out
      what the battery will really give back, decide why the transmission side runs at high voltage at all,
      and choose what evidence is worth buying before the peak. Hold too much back and it is wasted. Hold
      too little and Thursday happens again.
    takeaway: A reserve is bought with something, and the argument is always about how much uncertainty it has to cover.
    stops:
      - group: LOAD
        task: Estimate what the store gives back
        title: What comes out against what went in
        place: Load & Forecasting
        scene: The battery charged overnight on Saturday and discharged into Sunday's peak. Alvarez, the storage engineer, has both energy totals and the brochure figure. The three numbers do not agree. The event board is still showing the overnight state.
        assumes:
          - storing energy and recovering it both lose some of it
        takeaway: Round-trip efficiency is measured on the energy, not on the power rating.
        format: BALLPARK
        question: Estimate the round-trip efficiency of the store.
        answerText: About 85% round-trip efficiency.
        why: "Everything that moves energy in and out loses a share of it, in the converter, in the chemistry and in keeping itself cool. Round-trip efficiency is the plain ratio of what came out to what went in, over a whole cycle. It is the only figure that tells you what the store is worth as reserve. A power rating is a different claim: it says how fast, not how much. Duration is a third one again."
        estimate:
          prompt: |-
            The store took in 220 MWh over Saturday night and gave back 187 MWh into Sunday's peak. It is rated at 50 MW for 4 hours.
          question: Choose the energy out and the energy in.
          labels:
            - 187 MWh  (energy returned)
            - 220 MWh  (energy taken in)
            - 50 MW  (power rating)
            - 4 h  (rated duration)
          values: [187, 220, 50, 4]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 0.85
          tolerance: 0.03
          units: fraction
          solution: η = 187 ÷ 220 = 0.85, or 85%.
          explanation: |-
            85%, so 15% of everything put in never comes back. The rating and the duration describe how the store behaves, not how much survives the trip. Multiply them and you get an energy figure that has nothing to do with this question.
          givens:
            - Energy in was 220 MWh
            - Energy returned was 187 MWh
          relationship: Round-trip efficiency = the energy out ÷ the energy in, measured over a full cycle.
      - group: GEN
        task: Work out what the voltage step-up does to current and line loss.
        title: The reason the wires are not at wall voltage
        place: Generation Hall
        scene: A visitor asks Haddad why the machine makes power at 20000 volts and the line outside runs at 400000. The room is waiting for a written instruction.
        assumes:
          - a transformer changes voltage in proportion to its turns
        takeaway: The same power can be delivered in more than one way, and the ways are not equally wasteful.
        format: CHOICE
        question: For the same real power, what happens when voltage is stepped from 20 kV to 400 kV?
        answerText: The voltage rises by 20×, so current falls by 20× for the same power. Resistive loss then falls by 20² = 400×, ignoring transformer losses.
        why: For a given real power, raising voltage allows the same power to move with less current. Resistive loss then falls with current squared. Halving current cuts that loss to one quarter. A transformer makes the trade possible by changing voltage in proportion to turns while transferring nearly the same power, apart from losses. That is why long-distance transmission uses high voltage despite the harder insulation problem. The cost of insulation buys a much larger saving in conductor heating.
        choices:
          - Current falls by 20× and resistive line loss falls by 400×.
          - Current falls by 20× and resistive line loss falls by 20×.
          - Current stays the same and only the insulation requirement changes.
          - Current rises by 20× and resistive line loss rises by 400×.
        answer: Current falls by 20× and resistive line loss falls by 20×.
        rebuttals:
          - At fixed power, current scales inversely with voltage. Loss then scales with the square of that current, not in direct proportion.
          - The insulation requirement does change, but the electrical reason for stepping up voltage is the large reduction in current and I²R loss.
          - Raising voltage for the same power reduces current; it does not increase it.
      - group: OPS
        task: Spend the evidence budget on measurements that can change the reserve decision before the evening peak.
        title: What is worth knowing before the peak
        place: System Operations
        scene: Reyes has a small budget and four things she could find out before the evening peak. Only some of them would change what she does about the reserve. The shift log is open beside them.
        assumes:
          - reserve is held against uncertainty rather than only the forecast centre
          - storage power and storage deliverability are separate claims
        takeaway: The value of a measurement is the decision it can change, not how precise or interesting it sounds.
        format: VALUE
        question: Which measurements are worth buying before 18:00?
        value:
          hint: You have five evidence credits. Buy results that can still change the 18:00 reserve decision; every option shows what you would learn after purchase.
          budget:
            amount: 5
          decision: Set the reserve carried into the 18:00 peak.
          options:
            - id: cold-sensitivity
              label: Re-estimate the last degree of cold from this winter
              cost: 3
              axis: load uncertainty
              decisive: true
              reveals: The last degree adds 210 MW, not 120 MW; the forecast width must be widened before 18:00.
            - id: store-test
              label: Test the ridge store at the intended peak discharge rate
              cost: 2
              axis: reserve deliverability
              decisive: true
              reveals: The store returns about 85% over the cycle at this rate, so its credited energy is lower than the brochure case.
            - id: machine-repeat
              label: Repeat the autumn frequency-response test
              cost: 2
              axis: generator response
              decisive: false
              reveals: The machine repeats its autumn response within measurement scatter; tonight’s reserve plan does not move.
            - id: feeder-survey
              label: Commission a full feeder-demand survey
              cost: 4
              axis: spatial demand
              decisive: false
              reveals: The survey would refine feeder planning, but the result arrives in six weeks and cannot affect tonight.
        answerText: Buy the current-winter cold-load sensitivity and the peak-rate storage test. Together they cost the full five-credit budget and address two independent uncertainties that can still change tonight’s reserve.
        why: Reserve depends on uncertainty in demand and on resources that can actually deliver when called. Measuring this winter’s cold-load sensitivity can change the forecast width before the peak. Re-testing storage at the relevant discharge rate can change how much reserve the store deserves credit for. Repeating a generator test that is already current mainly buys reassurance. A feeder survey that arrives in six weeks may be useful planning evidence, but it cannot change tonight. Evidence has value only when its result can still alter the decision.
  - title: Where the current actually goes
    objective: Work out how flow divides between paths before switching changes them.
    briefing: Two circuits share the same corridor and they are not sharing it equally.
    stake: >-
      Tuesday, a week on, and the corridor has two circuits in it rather than one. Piotr Novak points out
      that this does not halve anything. The flow divides according to what each path costs it, and the
      newer circuit is the lower-impedance one, so it is taking two thirds of the load while the older one
      idles. Thabo Dube is waiting to be told which one to switch out for the morning's work. Today you work
      out how the current splits, decide what a node can and cannot hide, and say which arrangement leaves
      the least exposure. Switch the wrong one and the remaining circuit finds out what the sum was.
    takeaway: Current divides between parallel paths in inverse proportion to their impedance, whatever anybody intended.
    stops:
      - group: TRANS
        task: Estimate the current in the older circuit
        title: How the flow splits between two paths
        place: Transmission & Protection
        scene: 900 amps leave the busbar for the same destination by 2 routes. The older circuit is six ohms, the newer one three, and only the total is metered. The control-room phone is already ringing.
        assumes:
          - two paths between the same two points carry the same voltage across them
        takeaway: The lower-impedance path takes the larger share, in inverse proportion.
        format: BALLPARK
        question: Estimate the current flowing in the older, higher-impedance circuit.
        answerText: About 300 A in the older 6 Ω path and 600 A in the newer 3 Ω path.
        why: Both circuits connect the same two busbars, so they have the same voltage across them. Current therefore divides inversely with impedance. For two parallel paths, one path takes the other path’s impedance divided by the sum. With 6 Ω and 3 Ω, the lower-impedance circuit carries twice the current of the older 1. This is why a new parallel circuit does not split flow evenly. The total busbar current constrains the sum, but the impedances determine the share in each route.
        estimate:
          prompt: |-
            The total leaving the busbar is 900 A. The older circuit is 6 ohms and the newer 1 is 3 ohms. Both run between the same two busbars.
          question: Choose the total current, the other path's impedance and the sum of the two.
          labels:
            - 900 A  (total current)
            - 6 Ω  (older circuit)
            - 3 Ω  (newer circuit)
            - 11000 V  (busbar voltage)
          values: [900, 6, 3, 11000]
          slots: 3
          template: "{0} × {2} ÷ ({1} + {2})"
          formula: a*c/(b+c)
          correct: [0, 1, 2]
          target: 300
          tolerance: 40
          units: A
          solution: I_old = 900 × 3 ÷ (6 + 3) = 300 A.
          explanation: |-
            300 amps in the old circuit and 600 in the new 1. Each path takes the other's impedance over the sum, so the low-impedance route carries twice as much. The busbar voltage is the same for both, which is why it cancels and never enters the arithmetic.
          givens:
            - Total current is 900 A
            - The older circuit is 6 Ω and the newer is 3 Ω
          relationship: |-
            Current in one of two parallel paths = the total × the other path's impedance ÷ the sum of the two impedances.
      - group: OPS
        task: Say what the busbar meter can and cannot tell you
        title: What a node has to add up to
        place: System Operations
        scene: The busbar meter reads 900 A out. Reyes wants to know what that single figure rules out about the two circuits underneath it. A printed network diagram lies on the desk.
        assumes:
          - charge does not accumulate at a junction
        takeaway: A conservation law bounds the parts of a system without identifying any of them.
        format: CHOICE
        question: What does the 900 A total tell you about the 2 circuits?
        answerText: The branch currents must add to 900 A. Their individual values require another relation, such as the branch impedances.
        why: Charge does not build up at a junction, so current entering a node must equal current leaving it. Kirchhoff’s current law gives that conservation rule. It fixes the sum of the branch currents without telling you how the total divides. The split needs another relation, such as the branch impedances. Assuming an even split is wrong when the paths differ. Assuming each branch carries the full total confuses parallel and series circuits. One equation constrains two unknown branch currents; it does not determine both alone.
        choices:
          - The 2 branch currents must be 450 A each because they share the same 2 busbars.
          - The 2 branch currents must add algebraically to 900 A, but the total alone does not give the split.
          - Each branch must carry 900 A because every parallel branch sees the same busbar voltage.
          - The lower-impedance branch must carry 900 A and the higher-impedance branch must carry 0.
        answer: The 2 branch currents must add algebraically to 900 A, but the total alone does not give the split.
        rebuttals:
          - Equal voltage does not imply equal current unless the branch impedances are equal.
          - Parallel branches share voltage, not current; the node law constrains only the sum of the branch currents.
          - A nonzero higher-impedance branch still carries current, so the lower-impedance path cannot take the full total by itself.
      - group: DIST
        task: Match each connection to what it shares
        title: What is common and what divides
        place: Distribution Depot
        scene: Obi, the distribution supervisor, is training a new starter. Four circuit sketches are on the whiteboard, and he wants each matched to the quantity that stays common across that arrangement.
        assumes:
          - a circuit can be connected end to end or side by side
        takeaway: Series shares the current and divides the voltage; parallel shares the voltage and divides the current.
        format: PROTOCOL
        why: Series and parallel circuits differ by what stays common. In series there is one path, so every element carries the same current. The supply voltage divides across the elements. In parallel every branch connects to the same two nodes, so each branch has the same voltage. The current divides instead. Adding a parallel branch lowers the equivalent resistance and raises total current. Adding a series resistance raises the equivalent resistance and lowers the loop current. Mixing these rules leads directly to wrong fuse and conductor sizing.
        rebuttals:
          - One path end to end means one current through everything, with the voltage dividing between them.
          - Side by side each branch sees the full voltage, so what divides is the current.
          - Another parallel branch offers another route, lowering the combined impedance and raising the total.
          - Another element in line adds impedance and reduces the current everywhere in that loop.
        columns:
          - The arrangement
          - What it does
        scenarios:
          - Three elements connected end to end in one loop.
          - Three elements connected side by side across the same two points.
          - A fourth branch is added side by side to an existing three.
          - A fourth element is added end to end into an existing loop.
        choices:
          - The current is the same in all of them, and the voltage divides between them.
          - The voltage is the same across all of them, and the current divides between them.
          - The combined impedance falls, so the total current rises.
          - The combined impedance rises, so the current falls everywhere in the loop.
        mapping: [0, 1, 2, 3]
  - title: 80 milliseconds
    objective: Establish what a fault does before anybody can respond to it.
    briefing: A cable failed at the substation and the protection cleared it before the alarm reached the room.
    stake: >-
      Wednesday, and a cable failed inside the substation at 13:40. The protection cleared it in under a
      tenth of a second, which is the whole story: nobody in the control room saw the fault, they saw the
      aftermath. Piotr Novak needs the fault current worked out before he will sign the switchgear back into
      service. June Farrow wants to know how a current transformer produces a reading from a wire it never
      touches. Ewa Kowalczyk has a crew standing at a gate and a rule about earthing that they are quietly
      impatient with. Today you size the fault, explain the instrument, and decide who may approach.
    takeaway: A fault is limited only by impedance, which is why the numbers are enormous and the times are tiny.
    stops:
      - group: TRANS
        task: Estimate the current the fault drew
        title: What a short circuit is limited by
        place: Transmission & Protection
        scene: |-
          The cable failed phase to earth. Phase voltage is 6,350 volts and the total impedance back to the source is 0.42 ohms. Novak wants the current the switchgear had to interrupt.
        assumes:
          - a short circuit leaves almost no impedance in the path
        takeaway: Fault current is the driving voltage over the impedance of the path, and nothing else limits it.
        format: BALLPARK
        question: Estimate the current that flowed during the fault.
        answerText: About 15 kA RMS for the initial fault-current estimate.
        why: Normal load current is set by the equipment drawing power. A fault bypasses that load, so the current is instead limited mainly by the source and network impedance back to the fault. Using the phase voltage and the Thevenin impedance gives the first symmetrical RMS estimate. Here 6,350 V divided by 0.42 Ω is about 15 kA. That is why switchgear has a separate interrupting rating. Clearing time then controls how long the large current can deposit heat and mechanical stress.
        estimate:
          prompt: |-
            Phase voltage at the fault was 6,350 V. Total impedance of the source, transformer and cable back to it is 0.42 Ω. Normal load on the circuit is 310 A.
          question: Choose the driving voltage and the impedance of the path.
          labels:
            - 6350 V  (phase voltage)
            - 0.42 Ω  (impedance back to source)
            - 310 A  (normal load current)
            - 0.08 s  (clearing time)
          values: [6350, 0.42, 310, 0.08]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 15119
          tolerance: 1500
          units: A
          solution: I = 6,350 ÷ 0.42 ≈ 1.5 × 10⁴ A.
          explanation: |-
            About 15000 amps, roughly 50 times the normal load. The load current does not limit a fault, because the fault has gone around the load. The clearing time matters for the energy released rather than for the size of the current.
          givens:
            - Phase voltage is 6,350 V
            - Impedance back to the source is 0.42 Ω
          relationship: |-
            Fault current = the driving phase voltage ÷ the total impedance of the path back to the source, with the load bypassed and contributing nothing.
      - group: METER
        task: Use the test loop to isolate what makes the current transformer produce a secondary signal.
        title: A reading taken without a connection
        place: Metering & Standards
        scene: June Farrow, the metering engineer, has a protected low-voltage current-transformer test loop beside the yard diagram. The bench shows primary current, secondary current and a movable core. She wants a cause, not a remembered definition.
        assumes:
          - a changing magnetic field can induce voltage in a nearby coil
          - the bench current transformer has 1 primary turn and 20 secondary turns
        takeaway: A current transformer responds to changing magnetic flux; a steady primary current produces no sustained secondary signal.
        format: CONTROL
        question: Which change makes the secondary current disappear, and does the signal return when that change is reversed?
        control:
          hint: Change one control at a time and run the test. To commit a cause, remove the suspect while the other controls stay fixed, then restore it and confirm the response returns.
          noise: 0.05
          baseline: 5
          observable:
            label: Reading
            unit: A secondary
          response: -4.95
          truth: waveform
          variables:
            - id: waveform
              label: Primary current waveform
            - id: primary-current
              label: Primary current
            - id: core-path
              label: Magnetic core path
        answerText: The waveform is the causal control. With the core closed and 100 A primary current, AC gives about 5.0 A secondary. Changing only AC to steady DC drops the settled signal to about 0.05 A; restoring AC brings it back to 5.0 A.
        why: A current transformer needs no electrical connection between primary and secondary. Alternating primary current creates changing magnetic flux in the core. Faraday’s law then induces an emf in the secondary, and the turns ratio sets the secondary current approximately. A steady DC current can still create a magnetic field. After the switching transient, however, the flux stops changing and the secondary signal falls almost to zero. Removing the suspected cause and then restoring it is stronger evidence than changing several controls together.
      - group: DIST
        task: Choose the last protection step before the crew approaches the conductor.
        title: The ground is not at one voltage
        place: Distribution Depot
        scene: The cable is isolated at both ends and a tester reads dead at the work point. Kowalczyk, the safety lead, stops the crew because one protection step is still missing. The substation remains connected to live equipment nearby.
        assumes:
          - a conductor can be re-energised from more than one direction
        takeaway: Isolation is not proof of safety, and earthing is what makes it provable.
        format: CHOICE
        question: What must happen after isolation and a successful dead test?
        answerText: Apply portable earths at the point of work. Isolation and testing dead establish the condition; earthing holds it near local ground potential if something changes.
        why: Isolation and proving dead answer different questions. Opening both ends removes the known sources, while the dead test confirms the condition at that moment. Neither guarantees the conductor will stay safe if switching changes or induced voltage appears. Portable earths provide a low-impedance path for unexpected current and keep the work conductor close to local ground potential. That is why earthing follows the dead test rather than replacing it. The sequence turns a measured safe state into a maintained safe state.
        choices:
          - Apply portable earths at the point of work.
          - Repeat the dead test every five minutes while the crew works.
          - Leave the conductor floating so any unexpected voltage remains measurable.
          - Close one isolator briefly to prove the protection will trip if power returns.
        answer: Apply portable earths at the point of work.
        rebuttals:
          - A repeated test is still only a sequence of snapshots; an applied earth makes an accidental return of voltage survivable.
          - A floating conductor can rise to a dangerous potential by induction or mistaken energisation.
          - Deliberately re-energising the work zone is not a protection test; the safe state is isolation, proving dead, then earthing.
  - title: Merit order
    objective: Decide what runs tomorrow, and what is held back for the day it is needed.
    briefing: The cheapest generation is on the ridge and it will not say what it is doing after four.
    stake: >-
      Thursday, and tomorrow has to be bought tonight. Sten Lindgren has a peak that moves with the
      temperature and a width he will not narrow. Mina Sarraf has a ridge that will produce almost nothing
      for money and cannot promise any of it, and she is tired of being asked to. Nadia Haddad has expensive
      machines that can be told exactly what to do. Dolores Reyes has to sign an order that puts them in
      sequence. Today you forecast the peak from the load curve, decide what merit order actually means when
      the cheapest plant is the least certain, and choose what to do with more wind than the corridor can
      carry.
    takeaway: Dispatch orders plant by cost, and the value of certainty is what stops that being the whole story.
    stops:
      - group: LOAD
        task: Estimate tomorrow's peak from the curve
        title: The peak, and how far the cold moves it
        place: Load & Forecasting
        scene: |-
          The base peak for a Friday in this week of the year is 6,400 megawatts. Lindgren's own figure for this winter is 120 megawatts of extra demand per degree below 0, and tomorrow is minus 4.
        assumes:
          - demand rises as the temperature falls, roughly in step
        takeaway: A forecast is a base shape plus a sensitivity, and the sensitivity is measured rather than assumed.
        format: BALLPARK
        question: Estimate tomorrow's evening peak.
        answerText: About 6,880 MW at the centre of the forecast.
        why: "A load curve is the same shape most days, because people do the same things at the same times. What moves it is weather, and the useful form of that is a sensitivity: how many megawatts one degree is worth on this system. Measured from this winter's own data rather than from a textbook. Base plus sensitivity times degrees gets the centre of the forecast. It does not get the width, which is what the reserve has to cover."
        estimate:
          prompt: |-
            Base Friday peak for this week of the year is 6,400 MW. Demand sensitivity is 120 MW per degree below 0. Tomorrow's forecast is minus four degrees.
          question: Choose the base peak, the sensitivity and the degrees below zero.
          labels:
            - 6400 MW  (base peak)
            - 120 MW/°C  (demand sensitivity)
            - 4  (degrees below 0)
            - 310 MW  (reserve held)
          values: [6400, 120, 4, 310]
          slots: 3
          template: "{0} + {1} × {2}"
          formula: a+b*c
          correct: [0, 1, 2]
          target: 6880
          tolerance: 120
          units: MW
          solution: Peak ≈ 6,400 + 120 × 4 = 6,880 MW.
          explanation: |-
            About 6,900 megawatts at the centre of the forecast. The reserve is what covers the width around that centre, so it is a separate decision and not part of this sum. Add it in here and you have double-counted the thing the reserve exists for.
          givens:
            - Base peak is 6,400 MW
            - Sensitivity is 120 MW per degree below 0
            - Tomorrow is four degrees below zero
          relationship: |-
            Forecast peak = the base peak for that day and season + the demand sensitivity × the degrees below zero, with the sensitivity measured from this winter's own data.
      - group: OPS
        task: Match each plant to why it is dispatched where it is
        title: Cheapest first, and the exceptions that are not exceptions
        place: System Operations
        scene: |-
          Four plants and an order to sign. Reyes wants each one matched to the actual reason it sits where it does in the stack, rather than to its price alone.
        assumes:
          - generation is scheduled in order of what it costs to run
        takeaway: Merit order is cost order, corrected for what the system also needs from a machine.
        format: CASEBOOK
        why: Dispatch starts from cost, because running the cheapest first is what makes electricity affordable. Then three things bend it. Plant with almost no running cost goes first and cannot be relied on. It displaces fuel without displacing the need for something reliable behind it. Plant that can change output quickly is worth holding part-loaded, because reserve is a service and a machine at full output cannot provide it. And plant in the right place can be needed regardless of price, when the alternative is a corridor over its limit.
        rebuttals:
          - Near-zero running cost puts it first in the stack, and the uncertainty is why something reliable still has to be behind it.
          - Holding a fast machine part-loaded is buying reserve, which a machine at full output cannot sell.
          - Being in the right place can be worth more than being cheap, when the cheap alternative overloads a corridor.
          - Expensive and slow means last, and it is the plant the system is trying not to need.
        columns:
          - The plant
          - Why it sits where it does
        scenarios:
          - The ridge fleet, almost free to run, output not promised beyond four hours.
          - A gas machine that can move 40 MW a minute, deliberately left at half output.
          - An old station on the wrong side of the corridor, kept off despite being mid-priced.
          - An old station on the right side of a constraint, run despite being expensive.
        choices:
          - First in the stack on cost, with something reliable behind it because the output is not promised.
          - Held part-loaded on purpose, because reserve is a service and only a part-loaded machine can sell it.
          - Kept off because running it would push flow onto a corridor that cannot take it.
          - Run out of merit order because of where it is, not what it costs.
        mapping: [0, 1, 2, 3]
      - group: GEN
        task: Decide what to do with more wind than the corridor can carry
        title: When the cheapest power cannot get out
        place: Generation Hall
        scene: Sarraf, the renewable operator, can produce 340 megawatts from the ridge tonight. The corridor out of the valley can carry about 190. There is no second export path available. A printed network diagram lies on the desk.
        assumes:
          - power has to have a path to where it is used
        takeaway: Curtailment is what a network limit looks like from the generator's end.
        format: SCIENCETANK
        why: Energy that cannot reach a customer is not energy, and a corridor at its thermal limit is a hard wall rather than a preference. So some of that output has to stop, and the question is only how the system pays for it and what it buys instead. Reinforcing the corridor fixes it permanently and takes years. Storage on the ridge moves the surplus in time rather than in space, which is exactly the right shape for this problem.
        proposals:
          - label: A
            text: Install storage at the ridge, to move the surplus into the hours when the corridor is free.
          - label: B
            text: Pay the fleet to curtail tonight, and every night like it, until something else changes.
          - label: C
            text: Reinforce the corridor with a second circuit, commissioned in about three years.
          - label: D
            text: Run the corridor above its limit and accept the risk while the wind lasts.
        recommended:
          A: 45
          C: 25
        evidence: |-
          The ridge can produce 340 MW tonight. The corridor is rated at about 190 MW continuous. Nights like
          this occur perhaps 40 times a winter. Storage at the ridge would be about 50 MW for 4 hours,
          at 85% round trip. The corridor's second circuit has been on the reinforcement list for
          two years without a date.
  - title: The system splits
    objective: Work out what an island is, and whether the one that has formed can hold.
    briefing: The corridor tripped and the valley is now running on its own, for the moment.
    stake: >-
      Friday, 18:20, and the corridor tripped at the worst hour of the worst day — the same corridor the room chose
      to hold inside its emergency rating a week ago, on a thermal record nobody had checked. The valley did not go dark.
      It separated, and it is now an island of its own with the ridge, one gas machine and about a fifth of
      the demand it had at lunchtime. Dolores Reyes has minutes to decide whether to help it survive or shut
      it down deliberately. Nadia Haddad says the one machine in there has almost no inertia behind it.
      Chinelo Obi has the customer numbers. Today you work out what is holding that island's frequency up,
      decide what stored energy is actually available, and choose whether to keep it or collapse it.
    takeaway: An island lives or dies on whether generation inside it can follow the load inside it.
    stops:
      - group: OPS
        task: Find every shortfall-and-inertia pair that fits the measured frequency slope, then use an independent inertia estimate to break the ambiguity.
        title: Why the island's frequency is falling slowly
        place: System Operations
        scene: The island frequency is falling at 0.10 hertz per second. Its dispatchable machine is already at full output, while inverter-connected ridge generation is low. Haddad wants the power shortfall, but the wall gives only the slope.
        assumes:
          - the island is near 50 Hz
          - the initial frequency slope follows df/dt = f₀ΔP/(2E_k)
        takeaway: A frequency slope constrains the ratio of power imbalance to stored kinetic energy; it does not determine either one by itself.
        format: DEGENERACY
        question: What power shortfall is consistent with the 0.10 Hz/s fall once the island’s stored kinetic energy is measured?
        degeneracy:
          hint: Move shortfall and stored kinetic energy until the predicted slope matches 0.10 Hz/s. Notice how many pairs work. Then reveal the independent stored-energy estimate and find the intersection.
          controls:
            - id: shortfall
              label: Generation shortfall
              unit: MW
              min: 60
              max: 180
              step: 1
            - id: stored-energy
              label: Stored kinetic energy
              unit: MW·s
              min: 15000
              max: 45000
              step: 250
          observable:
            label: Initial frequency fall
            value: 0.1
            unit: Hz/s
            nominalFrequency: 50
          truth:
            a: 100
            b: 25000
          locus:
            - a: 80
              b: 20000
            - a: 100
              b: 25000
            - a: 120
              b: 30000
            - a: 140
              b: 35000
            - a: 160
              b: 40000
          second:
            label: Independent machine-data estimate of stored kinetic energy
            locus:
              - a: 90
                b: 25000
              - a: 100
                b: 25000
              - a: 110
                b: 25000
          tolerance:
            a: 8
            b: 1000
        answerText: At 50 Hz, a 0.10 Hz/s fall satisfies |ΔP|/E_k = 0.004 s⁻¹. The independent inertia estimate is 25,000 MW·s, so the shortfall is about 100 MW.
        why: "The initial frequency slope comes from two quantities at once: the real-power mismatch and the stored kinetic energy resisting it. A slow fall can therefore mean a small shortfall, large inertia, or a matching combination of both. Inverter-connected wind can add real power without adding the same synchronous kinetic energy, so installed megawatts do not settle the question. First trace the combinations that reproduce 0.10 Hz/s. Then use an independent estimate of stored kinetic energy to select the matching power shortfall."
      - group: METER
        task: Say where an island's short-term energy actually comes from
        title: What is stored, and for how long
        place: Metering & Standards
        scene: |-
          Farrow is asked to list what the island has to draw on in the first ten seconds. Two of the four things on her list cannot help at that timescale.
        assumes:
          - energy can be stored in a spinning mass, in a magnetic field or in a chemical cell
        takeaway: Every store has a timescale, and matching the store to the timescale is the whole trick.
        format: PROTOCOL
        why: "Each store answers over a different interval and confusing them is how a plan fails. Rotational energy in a spinning machine is there instantly, without anybody asking, and it is gone in seconds. A battery through an inverter responds in well under a second and can hold for hours. That makes it the most useful thing an island can have. Energy in the magnetic fields of transformers and lines is real, and it is a fraction of a cycle: nothing dispatchable."
        rebuttals:
          - Rotational energy arrives instantly with no command and is spent within seconds.
          - A battery through an inverter answers in well under a second and can hold for hours, which is the useful combination.
          - Energy in inductance and capacitance is real and lasts a fraction of a cycle, so nothing can be dispatched from it.
          - Boiler storage is a matter of minutes, which helps the recovery and not the first ten seconds.
        columns:
          - Where the energy is
          - When it can help
        scenarios:
          - The rotating mass of the gas machine.
          - The ridge's battery, through its inverter.
          - The inductance of the island's transformers, and the capacitance of its lines.
          - Heat in the gas machine's boiler and steam drum.
        choices:
          - Instantly and without being asked, for a few seconds only.
          - Within a second of being asked, and for hours if needed.
          - For a fraction of one cycle, which is what inductance and capacitance hold and is too brief to dispatch.
          - After several minutes, which suits the recovery rather than the emergency.
        mapping: [0, 1, 2, 3]
      - group: DIST
        task: Choose what to do about the island
        title: Keeping it, or collapsing it on purpose
        place: Distribution Depot
        scene: Obi has 26,000 households inside the island and a frequency still falling. Holding it needs demand off. Collapsing it means all of them, and a longer way back. The event board is still showing the overnight state.
        assumes:
          - restoring a collapsed island takes longer than holding a live one
        takeaway: Shedding some load to keep an island alive is usually cheaper than restoring it from nothing.
        format: CHOICE
        question: What should be done with the island?
        why: An island with its only dispatchable machine at maximum has one lever left, and that is demand. Shedding a fifth stops the fall and keeps four fifths of the valley supplied, which is a far better outcome than everybody off. Letting it collapse costs all 26,000 households and buys a restoration measured in hours. That is because a dead network has to be built back piece by piece. Waiting on wind is betting the island on a forecast.
        choices:
          - Shed about a fifth of the island's load now, to stop the fall and keep the rest supplied.
          - Let it collapse, and restore the whole valley from the main system once the corridor is back.
          - Hold on without shedding, on the chance the rising wind lifts the ridge's output in time.
          - Reconnect it to the main system immediately, before the frequency falls any further.
        answer: Shed about a fifth of the island's load now, to stop the fall and keep the rest supplied.
        rebuttals:
          - Collapsing it loses every customer and turns a shedding problem into a restoration measured in hours.
          - Waiting on the wind bets the island on a forecast, with nothing in reserve if the forecast is late.
          - Two systems at different frequencies cannot be joined; attempting it trips the machine and collapses the island.
  - title: Cranking path
    objective: Build a live system out of a dead one, in the only order that works.
    briefing: The valley collapsed at 19:04 and nothing in it can start without power it has not got.
    stake: >-
      Saturday, 19:04, and the island went. The valley is dark and every machine in it needs electricity to
      start: the boiler feed pumps, the fans, the control systems, the switchgear itself. Nadia Haddad has
      one small hydro set at the head of the valley that can start on its own, and Thabo Dube has a yard full
      of open switches. Dolores Reyes has to decide the order, and there is only one that works. Today you
      cost the energy the valley has already lost, work out why the small set matters more than the large
      one, and write the restoration in the sequence physics allows rather than the one people want.
    takeaway: A dead system is rebuilt from one machine that needs nothing, outward along a path chosen in advance.
    stops:
      - group: GEN
        task: Estimate the energy the valley has not had
        title: What the dark hours actually cost
        place: Generation Hall
        scene: |-
          The valley was drawing about 300 megawatts when it went. Haddad expects the restoration to take two and a half hours, and the report will want the figure in energy rather than power.
        assumes:
          - power sustained over a period of time delivers energy
        takeaway: Power is a rate and energy is the amount, and the settlement is always in energy.
        format: BALLPARK
        question: Estimate the energy not delivered during the restoration.
        answerText: About 750 MWh not delivered.
        why: Power says how fast energy is being delivered. Energy says how much arrived. The two are confused constantly, because both get called demand. Multiply the power by the time it was sustained and the result is energy. Megawatt-hours, if the power was in megawatts and the time in hours. That is the number every settlement, every compensation claim and every inquiry runs on, because it is the one that scales with duration. Two systems can lose the same megawatts and owe entirely different amounts.
        estimate:
          prompt: |-
            The valley was drawing about 300 MW when it collapsed. The restoration is expected to take about two and a half hours.
          question: Choose the power and the duration.
          labels:
            - 300 MW  (demand at collapse)
            - 2.5 h  (expected restoration)
            - 26000  (households affected)
            - 49.4 Hz  (frequency before the split)
          values: [300, 2.5, 26000, 49.4]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 750
          tolerance: 80
          units: MWh
          solution: E = 300 × 2.5 = 750 MWh.
          explanation: |-
            750 megawatt-hours never delivered. The household count and the frequency are both central to the story and neither belongs in this calculation. One is who was affected; the other is why it happened.
          givens:
            - Demand at collapse was about 300 MW
            - Restoration is expected to take about 2.5 hours
          relationship: Energy = the power × the time it is sustained for, in megawatt-hours when power is in megawatts.

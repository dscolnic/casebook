        answerText: Order the path from reservoir gate to hydro turbine, hydro generator, startup feeder, station auxiliaries and then the large generator. The 8 MW startup feeder is the governing link; the 500 MW generator is the obvious distractor.
        why: A dead network cannot start from its biggest generator if that machine needs pumps, fans and controls before it can turn. The black-start hydro unit works because water can supply torque without outside electrical power. Its generator then energises a bus and a narrow startup feeder to the large station. The feeder only needs to carry the station auxiliaries, not the future 500 MW output. That modest link governs the restart. Once the auxiliaries are live, the large machine can start and the system can grow outward.
      - group: DIST
        task: Match each restoration step to the reason it is limited
        title: Why it cannot go faster
        place: Distribution Depot
        scene: Obi has crews asking why restoration is moving a few streets at a time. The substation is live, and the whole feeder could be closed in one movement. The switching sheet is open beside him.
        assumes:
          - a small live system is disturbed more by a given block of load than a large one
        takeaway: Every restoration step is limited by something different, and hurrying the wrong one collapses it again.
        format: CASEBOOK
        why: "The limits change as the system grows. Very early, the live island is tiny and a block of load is enormous relative to it. Blocks stay small: this is a frequency limit. Energising long circuits with almost no load on them raises voltage rather than lowering it. That is a reactive limit and the opposite of most people's instinct. Cold load picks up higher than normal, because every thermostat in the street is calling at once. And synchronising two live systems is a matching problem, not a capacity one."
        rebuttals:
          - Early on the island is small, so a given block is a large fraction of it, and that is a frequency limit.
          - A long line energised with little load on it pushes voltage up rather than down, which is a reactive limit.
          - Cold load returns above its normal value, because everything that was cut off is calling at once.
          - Joining two live systems is a matching problem in frequency, voltage and angle, not a question of capacity.
        columns:
          - The step
          - What limits it
        scenarios:
          - Adding the first blocks of load to a very small live island.
          - Energising a long, lightly loaded circuit out to the next substation.
          - Restoring a residential feeder that has been off for two hours in winter.
          - Joining the restored island back to the neighbouring system.
        choices:
          - A frequency limit, because a small system cannot absorb a large step.
          - A reactive limit, because a lightly loaded line raises the voltage at its far end.
          - A cold-load limit, because everything that was cut off comes back on at once.
          - A matching limit, because frequency, voltage and angle must agree before the breaker closes.
        mapping: [0, 1, 2, 3]
  - title: 6 hours, not 40 minutes
    objective: Re-read the week from a record nobody had checked.
    briefing: Farrow has traced the corridor's thermal record, and the number the room worked from was wrong.
    stake: >-
      Sunday, and June Farrow has finished tracing the corridor's thermal history. The emergency rating that
      bought the room 40 minutes a week ago was calculated from a sensor that had been reading 11
      degrees low since a firmware update in the spring. The corridor was not 40 minutes from its limit.
      It had been above continuous rating for six hours, and it had been there twice before. Dolores Reyes
      has to decide what that does to every decision taken since. Today you work out what a drifted sensor
      does to a rating, decide which of the week's conclusions still stand, and say what you would have done
      differently. Nothing in the week was reasoned badly. It was reasoned from a number.
    takeaway: A conclusion is only as good as the measurement under it, and a drifted instrument leaves the reasoning intact and the answer wrong.
    stops:
      - group: METER
        task: Choose the explanation that fits the sensor, infrared survey and sag estimate together.
        title: The sensor that was confident and wrong
        place: Metering & Standards
        scene: "Farrow has three sources for the corridor's temperature that week: the sensor, an infrared survey from the ground. The sag measured off a photograph. Two of them agree with each other."
        assumes:
          - an instrument can be precise and still be offset from the truth
        takeaway: Precision is repeatability; accuracy is being right. A drifted sensor has the first and not the second.
        format: CHOICE
        question: Which explanation best fits all three temperature sources?
        why: Small scatter only shows that an instrument repeats. A fixed offset can produce readings that are precise and wrong at the same time. Here 2 methods that do not share the corridor sensor both place the conductor about 11 degrees hotter. The firmware date also marks when the disagreement begins. Sag depends on tension as well as temperature, so it is not proof alone. Its value is that it corroborates an infrared method through different physics, which is exactly what a sensor offset cannot explain away.
        headline: The corridor's own sensor disagrees with two independent measurements of the same week.
        readings:
          - zone: Conductor sensor
            label: Peak temperature
            value: 78 °C
            status: normal
            note: scatter under 0.3 °C
          - zone: Ground survey
            label: Infrared
            value: 89 °C
            status: alarm
          - zone: Photograph
            label: Sag
            value: consistent with 90 °C
            status: alarm
          - zone: Conductor sensor
            label: Firmware
            value: updated in the spring
            status: low
        choices:
          - label: The sensor is correct and both other methods are crude
            mechanism: Its scatter is tiny, so it is the precise measurement.
          - label: The sensor has a fixed offset from the firmware update
            mechanism: It repeats well and sits low, which two independent methods both show.
          - label: The corridor really did run at two temperatures
            mechanism: Different parts of a long conductor can differ.
          - label: The photograph is unreliable and should be discarded
            mechanism: Sag depends on tension as well as temperature.
        answer: The sensor has a fixed offset from the firmware update
        rebuttals:
          - Tight scatter proves the sensor repeats itself, which is what a constant offset looks like from the inside.
          - A long conductor does vary along its length, and not by 11 degrees in the same direction on every survey.
          - Sag is sensitive to tension, which makes it weak alone and useful as the second independent method.
      - group: TRANS
        task: Say what the corrected temperature does to the rating
        title: What a rating is a statement about
        place: Transmission & Protection
        scene: Novak has the corrected figures and the standard the corridor was built to. Its conductors may run continuously at 75 degrees and no hotter. That is because above that the aluminium begins to lose strength and the span loses clearance over the road beneath it.
        assumes:
          - a conductor's rating is a limit on temperature rather than on current
          - resistive heating rises faster than the current that causes it
        takeaway: A rating is a temperature expressed as a current, so a wrong temperature makes the current limit meaningless.
        format: SWEEP
        question: 75 degrees is the limit the conductor was built to. What current does that allow it to carry all day?
        answerText: About 1,150 A. The corridor was carrying 1,280 A. The corrected figures put it near 89 degrees, about 14 degrees above the continuous limit.
        why: "A rating is not a fuse setting. It is a temperature translated into a current, and the translation runs through the heating. That goes as the square of the current: the last hundred amps buy far more degrees than the first hundred. The curve steepens and the rating sits where it crosses the agreed temperature. Two consequences follow. A rating is only as good as the temperature measurement behind it. That is why a drifted sensor moves a limit that looks like a fixed property of the metal."
        sweep:
          axis:
            label: Corridor current
            unit: A
            min: 600
            max: 1600
            step: 10
          readout:
            label: Conductor temperature
            unit: °C
          baseline: 25
          response:
            - at: 600
              value: 38
            - at: 800
              value: 48
            - at: 1000
              value: 61
            - at: 1150
              value: 75
            - at: 1280
              value: 89
            - at: 1400
              value: 103
            - at: 1600
              value: 129
          target: 1150
          tolerance: 60
          start: 600
          commit: Mark the continuous rating
      - group: OPS
        task: Decide which of the week's conclusions still stand
        title: What survives a bad number
        place: System Operations
        scene: Reyes has the week's decisions on the board and one wrong input underneath several of them. She wants each one marked as still good, now unsupported, or wrong. The yard radio is still live beside them.
        assumes:
          - a conclusion can depend on one input or on several
        takeaway: A bad input invalidates what rested on it and leaves the rest standing, and telling them apart is the work.
        format: CASEBOOK
        why: One wrong number does not void a week. It voids whatever leaned on it, and the job is tracing which. The choice to hold the corridor rested entirely on the duration, so it falls. The loss calculation used current and resistance and never touched temperature, so it stands. The restoration order was argued from consequence and household counts, which the sensor never entered. And the decision to shed a fifth of the island was taken on a frequency the sensor has nothing to do with.
        rebuttals:
          - Holding the corridor rested on the duration and nothing else, so it is the one decision that falls outright.
          - The loss figure came from current and resistance, neither of which the sensor touched.
          - The restoration order was argued from consequence and household counts, which the thermal record never entered.
          - The island shed was taken on frequency, which the sensor has nothing to do with; it was right then and still is.
        columns:
          - The decision
          - What the bad number does to it
        scenarios:
          - Holding the corridor inside its emergency rating rather than redispatching.
          - The 17 megawatts of loss calculated for the corridor.
          - The order the 11 feeders were restored in.
          - Shedding a fifth of the island to hold its frequency.
        choices:
          - Falls. It rested on the duration, and the duration was wrong.
          - Stands. It used current and resistance, and never used temperature.
          - Stands. It was argued from consequence and household counts.
          - Stands, and should be said out loud. It was taken on frequency, which the sensor never touched.
        mapping: [0, 1, 2, 3]
  - title: A shift where nothing happens
    objective: Run an ordinary evening, and notice what ordinary is now resting on.
    briefing: The forecast holds, every circuit is inside limits, and nothing needs deciding.
    stake: >-
      Monday, and it is a quiet shift. The forecast is holding to within 30 megawatts, every corridor is
      comfortably inside rating, the ridge is producing steadily, and there is nothing on the board that
      needs a decision. Aaron Whitlock has the log open with almost nothing in it. Dolores Reyes uses these
      evenings to walk the room and ask what everybody is assuming, because a quiet shift is the only time
      anybody has to. Today you check what the system would do if one thing went, read a trend that is
      behaving, and say which of tonight's comforts is actually a measurement and which is a habit. Nothing
      will go wrong tonight. Nothing went wrong the Monday before last, either.
    takeaway: A quiet system is a set of assumptions nobody is currently being forced to check.
    stops:
      - group: OPS
        task: Say what the contingency check is actually asking
        title: The failure that has not happened
        place: System Operations
        scene: The screen says every single contingency is survivable tonight. Whitlock asks what the check does not cover, and Reyes says that is the right question on a quiet shift. The event board is still showing the overnight state.
        assumes:
          - a system is required to survive any one credible failure
        takeaway: An N-1 check is a statement about single failures, and it says nothing about 2.
        format: CHOICE
        question: What does a clean contingency check tell you tonight?
        answerText: A clean N-1 check says each listed single failure leaves the modeled system inside limits. It says nothing about failure probability or simultaneous failures.
        why: "The check is exactly as broad as its list. It takes each credible single failure in turn, works out the flows afterwards, and confirms nothing ends up over a limit. That is a genuinely strong statement and a narrow one. It does not cover two failures at once, it does not cover a failure outside the list. It says nothing at all about what is likely — only about what is survivable. Last Friday was two things: a corridor already above a limit nobody knew about, and then the trip."
        choices:
          - Every listed single failure can occur without any element exceeding its operating limit afterward.
          - No listed element is likely to fail tonight because the post-contingency flows are acceptable.
          - Any pair of listed failures can occur together without producing an overload.
          - The present dispatch has enough margin that no further contingency analysis is needed this shift.
        answer: Every listed single failure can occur without any element exceeding its operating limit afterward.
        rebuttals:
          - Contingency analysis tests survivability after an assumed failure, not the probability that the failure will occur.
          - An N-1 study is explicitly a one-at-a-time test. It does not establish N-2 survivability.
          - A clean result is conditional on the modeled dispatch and list of failures; it does not make later checks unnecessary.
      - group: LOAD
        task: Read a forecast that is behaving
        title: The trend with nothing wrong with it
        place: Load & Forecasting
        scene: Lindgren's forecast has tracked within 30 megawatts all evening. He wants to know what that does and does not license the room to assume about tomorrow. The room is waiting for a written instruction.
        assumes:
          - a forecast can be right by luck as easily as by skill on any one day
        takeaway: One good night is not evidence about the method, because the width was never a claim about tonight.
        format: PROTOCOL
        why: A forecast is a distribution. Landing inside 30 megawatts on a mild Monday is what the middle of that distribution looks like and it tells you almost nothing. That is because mild Mondays are the days the model was best calibrated for. The evidence that matters is how it behaves on the days it was least calibrated for, which are rare by construction. So a run of good nights is not a reason to hold less reserve.
        rebuttals:
          - A quiet Monday is the middle of the distribution and the easiest day the model has; it confirms very little.
          - Cold snaps are where the model is least calibrated, so they are where the width is actually tested.
          - A run of accurate nights does not narrow the width, because the width was never a claim about any one night.
          - One miss on an unusual day is a single draw, and it does not condemn the method any more than a hit vindicates it.
        columns:
          - The observation
          - What it is evidence about
        scenarios:
          - The forecast tracked within 30 megawatts on a mild Monday.
          - The forecast missed by 400 megawatts on the coldest night of last winter.
          - The forecast has been accurate for nine consecutive evenings.
          - The forecast's stated width has held over three winters.
        choices:
          - Very little. It is the easiest day the model has, and the middle of its own distribution.
          - The part of the range that matters, since that is where the model is least calibrated.
          - Nine draws from the middle, which does not license holding less reserve.
          - The only one of these that is evidence about the method rather than about a night.
        mapping: [0, 1, 2, 3]
      - group: GEN
        task: Spend the quiet-shift check budget on the assumption most likely to change the fast-frequency plan.
        title: Which of these is a measurement
        place: Generation Hall
        scene: Haddad lists four reasons the room feels comfortable tonight. Three are current measurements or long-run evidence. One is an inherited stored-energy figure written before the inverter-connected fleet became much larger.
        assumes:
          - stored kinetic energy affects the initial rate of frequency change
          - inverter-connected generation may add power without adding synchronous inertia
        takeaway: An old assumption deserves priority when it is load-bearing, likely to have changed, and cheap enough to check.
        format: VALUE
        question: Which evidence should be bought before the room trusts its present under-frequency timing?
        value:
          hint: You have four check credits. Buy evidence that could change under-frequency timing tonight, not evidence that merely confirms a number already measured recently.
          budget:
            amount: 4
          decision: Keep or revise the present under-frequency timing assumptions.
          options:
            - id: inertia-audit
              label: Recompute stored kinetic energy from the machines actually online
              cost: 3
              axis: dynamic frequency response
              decisive: true
              reveals: Stored kinetic energy is about 18,000 MW·s. A 300 MW loss at 50 Hz gives |df/dt| ≈ 50×300/(2×18,000) ≈ 0.42 Hz/s, not 0.30.
            - id: reserve-reconcile
              label: Reconcile tonight’s reserve meters again
              cost: 2
              axis: available reserve
              decisive: false
              reveals: The 310 MW reserve total repeats within 5 MW; the fast-frequency timing assumption is unchanged.
            - id: corridor-read
              label: Repeat the corridor loading readout
              cost: 1
              axis: transmission loading
              decisive: false
              reveals: Loading matches the reading taken an hour ago; it does not determine the first-second frequency slope.
            - id: forecast-audit
              label: Re-score the forecast width over three winters
              cost: 4
              axis: load uncertainty
              decisive: false
              reveals: The seasonal width remains well calibrated; this does not restore missing synchronous kinetic energy.
        answerText: Buy the current machine-data inertia audit. It reveals about 18,000 MW·s rather than the inherited 25,000. For a 300 MW loss at 50 Hz, |df/dt| rises from 0.30 Hz/s to about 0.42 Hz/s.
        why: Three comforting numbers are current measurements or long-run evidence. The inherited inertia figure is different. The fleet has changed, and inverter-connected generation can supply real power without the same synchronous stored kinetic energy. That matters because stored energy sets how fast frequency moves after a sudden imbalance. Recomputing it from current machine data can therefore change protection timing immediately. If the old 25,000 MW·s figure has fallen to 18,000 MW·s. The same 300 MW trip moves frequency about 40% faster.
  - title: Three things at once
    objective: Rank three simultaneous problems, and hold the reasoning while they interfere.
    briefing: A fault, a forecast miss and a plant coming off at the same hour, and one room.
    stake: >-
      Thursday, 16:40, and 3 things arrive together. A cable fault has taken a feeder with 3,300
      households on it. Ravi Lindgren's forecast is running 200 megawatts under actual and still
      climbing. And the gas machine that has carried the evening peak all week has to come off at 1800
      for a fuel limit Amira Haddad flagged this morning and nobody built a plan around. Dolores
      Reyes has 1 control room, 1 crew on shift and about 80 minutes. Today you decide what gets
      attention first, work out what the corridor is costing at the higher flow, and put the evening's moves
      in an order that does not undo itself. None of these is new. All three at once is.
    takeaway: Ranking is not about which problem is worst but about which one gets worse fastest and which one is cheapest to remove.
    stops:
      - group: OPS
        task: Keep the one condition that cannot safely wait and delegate the rest with an owner, first action and return condition.
        title: Which of the three cannot wait
        place: System Operations
        scene: Reyes has three live problems on the board and only one attention channel she can keep herself. Aaron Whitlock is ready to take a handoff, but she refuses any instruction that amounts to “watch it.”.
        assumes:
          - a stable problem can be severe without becoming more urgent each minute
          - reserve actions need lead time before the peak
        takeaway: Urgency comes from how fast a condition is worsening, how reversible it is, and whether somebody else can own the next move.
        format: DELEGATE
        question: What do you keep, and what exactly do you hand off?
        delegate:
          hint: Choose one problem to keep. For every handoff, assign a person, a first action and a measurable return condition; “watch it” is refused.
          problems:
            - id: forecast
              label: Forecast is 200 MW low and worsening
              rate: +40 MW error per 10 min
              consequence: Reserve procurement closes in 20 min; lost lead time cannot be recovered before the peak.
              trend: rising
              irreversible: true
              loud: false
              delegable: false
            - id: cable
              label: Cable fault with 3,300 households off
              rate: 0 additional households per 10 min
              consequence: Customers remain off while the dispatched crew repairs the fault.
              trend: stable
              irreversible: false
              loud: true
              delegable: true
            - id: fuel
              label: Gas machine reaches its fuel limit at 18:00
              rate: known 180 MW loss at a fixed time
              consequence: Replacement generation must be loaded before 18:00.
              trend: stable
              irreversible: false
              loud: false
              delegable: true
          firstActions:
            - id: field-check
              label: Confirm crew arrival and fault location
            - id: start-replacement
              label: Begin loading 180 MW of replacement generation
          returnConditions:
            - problem: cable
              condition: crew reports the fault is larger than a one-shift repair
            - problem: fuel
              condition: replacement generation is more than 30 MW behind its loading plan
          team:
            - id: field
              label: Field coordinator
            - id: generation
              label: Generation desk
          first: forecast
        answerText: Keep the growing forecast error. Delegate the cable fault to the field coordinator. Send the scheduled machine loss to the generation desk, with a first action and return threshold for each.
        why: "The cable outage is loud but stable: customers are already off and a crew is moving. The fuel-limited machine has a known time and quantity, so another operator can prepare its replacement. The forecast error is different. It is still growing, and reserve procurement needs lead time before the evening peak. Every update that passes without action removes options that cannot be recovered later. Delegation is therefore not “watch it.” Each handoff needs an owner, a first action and a condition that brings the problem back."
      - group: TRANS
        task: Work out the corridor's loss at the higher flow
        title: Loss when the load turns up anyway
        place: Transmission & Protection
        scene: With the feeder out, flow has redistributed and the corridor is carrying more. Novak wants the heat figure before he decides whether the evening needs a switching change. A printed network diagram lies on the desk.
        assumes:
          - loss in a conductor rises with the square of the current
        takeaway: When a quantity enters squared, a small change in it is a large change in the result.
        format: BALLPARK
        question: Estimate the power now lost as heat in the corridor.
        answerText: About 21 MW.
        why: The same loss relation now gives a worse answer. Resistive heating rises with the square of RMS current, across all three phases. Current has risen by about 11%, from 1,150 A to 1,280 A. The heat rises by about 24%, from roughly 17 MW to 21 MW. That matters because the conductor rating is thermal. A small-looking increase in current can therefore use a much larger fraction of the available temperature margin.
        estimate:
          prompt: The balanced corridor now carries 1,280 A RMS in each phase. Each phase still has 4.2 ohms of resistance over the full corridor.
          question: Choose the current, the resistance and the number of phases.
          labels:
            - 1280 A  (RMS current per phase now)
            - 4.2 Ω  (resistance per phase)
            - 3  (phases)
            - 1150 A  (the current an hour ago)
            - 89 °C  (corrected conductor temperature)
          values: [1280, 4.2, 3, 1150, 89]
          slots: 3
          template: "{0} × {0} × {1} × {2}"
          formula: a*a*b*c
          correct: [0, 1, 2]
          target: 20643840
          tolerance: 1800000
          units: W
          solution: P_loss = 3 × 1280² × 4.2 ≈ 2.06 × 10⁷ W ≈ 21 MW.
          explanation: |-
            About 21 megawatts, against 17 an hour ago. Current rose by 11% and the heat rose by nearly a quarter, because the square does the work. The earlier current and the corrected temperature are both real numbers about this corridor and neither enters the loss.
          givens:
            - RMS current is now 1,280 A in each phase
            - Resistance remains 4.2 Ω per phase
            - There are three phases
          relationship: Total three-phase loss = 3 × I_rms² × R_phase, so a small rise in current makes a larger rise in heat.
      - group: LOAD
        task: Order the evening's moves so none of them undoes another
        title: An order that survives being carried out
        place: Load & Forecasting
        scene: |-
          Lindgren has four moves for the evening and no view on the order. Two of them change what the others are worth, and one of them cannot be reversed inside the shift.
        assumes:
          - some actions change the value of the actions that follow them
        takeaway: Do the moves that improve your information first and the moves you cannot undo last.
        format: SEQUENCE
        why: Correct the forecast first. Every other number is sized against it, and a wrong demand figure means doing the right thing to the wrong amount. Bring reserve forward next. It is reversible, it costs money rather than customers, and it covers the machine coming off at 1800. Then move the replacement plant, which takes real minutes to load and has to be underway before the fuel limit bites. Reconfiguring the network is last.
        cards:
          - Correct the forecast, so every other figure is sized against a real demand.
          - Bring reserve forward to cover the machine coming off at 1800.
          - Start loading the replacement plant, which needs the minutes.
          - Reconfigure the network around the faulted feeder.
        order: [0, 1, 2, 3]
        axis: Order the four moves by what each one commits you to, not by the clock. All four are available now; what differs is how much they improve the figures you are working from, and how easily they can be taken back.
        ends: [Improves your information, Cannot be taken back]
  - title: The last morning it can be changed
    objective: Commit the corridor to a course, knowing the window closes today.
    briefing: The reinforcement decision from last week has a date on it, and the date is today.
    stake: >-
      Monday, and the corridor decision comes back for the last time. The outage window that would let a
      second circuit be strung this year closes at close of business, and if it closes the next 1 is
      18 months out. June Farrow has the corrected thermal record, which says the corridor has spent
      more hours over limit than anybody thought. Amira Haddad has a storage quote that expires with the
      window. Dolores Reyes has a board that will not approve both. Today you work out what the corrected
      record does to the corridor's remaining life, decide what the money buys, and say what the decision
      commits the system to for the next 18 months. Last week this was a preference. This morning it
      is the last morning.
    takeaway: A reversible decision is a cheap one, and the moment it stops being reversible is the moment it needs the whole argument.
    stops:
      - group: METER
        task: Say what the corrected hours do to the conductor
        title: Hours over limit, added up
        place: Metering & Standards
        scene: |-
          Farrow's corrected record has the corridor above continuous rating for about 90 hours over 3 years. She wants to know whether that is a maintenance note or a design problem.
        assumes:
          - time spent above a thermal limit accumulates rather than resetting
        takeaway: Thermal damage integrates over time, so 90 scattered hours count as 90 hours.
        format: CHOICE
        question: What do 90 accumulated hours above continuous rating mean for the conductor?
        why: Annealing is not a state the metal comes back from. Above about 95 degrees, aluminium's grain structure begins to relax, and the tensile strength it loses stays lost when it cools. The effect accumulates in hours-above-temperature, which is why the number is added up over three years rather than judged one event at a time. The consequence is not a failure today. It is a span that fails at a wind loading the design allowed for, some years from now.
        choices:
          - Nothing, because the conductor cooled fully between every one of those periods.
          - The aluminium has lost strength for good, and its life is shorter than designed.
          - The conductor has been proven capable of the higher current and can be re-rated upward.
          - The record is too old to act on, since most of those hours were more than a year ago.
        answer: The aluminium has lost strength for good, and its life is shorter than designed.
        rebuttals:
          - Cooling restores the temperature and not the strength; the loss is in the grain structure, and it is permanent.
          - Surviving a current is not the same as being rated for it, because the damage is cumulative rather than immediate.
          - The damage does not age out; hours from two years ago are still hours the metal spent losing strength.
      - group: TRANS
        task: Commit the money before the window closes
        title: What the window is worth
        place: Transmission & Protection
        scene: Two options, one budget, one afternoon. Novak points out that only one of them still exists tomorrow, and Haddad points out that only one of them fixes the corridor. The event board is still showing the overnight state.
        assumes:
          - an option with an expiry date is worth more than the same option without one
        takeaway: When one path closes today, its value includes everything the eighteen-month delay would cost.
        format: SCIENCETANK
        why: This is not the same question as last week, because one option now expires. Reinforcement is the only choice that removes the constraint rather than working around it. Today is the last day it can be started this year — so its cost includes 18 months of curtailment, 90 more hours of annealing. Every evening the room has to hold a corridor it has now measured as weaker than it thought.
        proposals:
          - label: A
            text: Commit the outage window today and string the second circuit this year.
          - label: B
            text: Buy the ridge storage on the expiring quote and put reinforcement to the spring.
          - label: C
            text: Keep curtailing and revisit both when the next window opens in 18 months.
          - label: D
            text: Hold the budget until the corrected thermal record has been independently reviewed.
        recommended:
          A: 55
          B: 25
        evidence: |-
          The outage window closes at close of business and the next is 18 months out. The corrected
          record has the corridor above continuous rating for about 90 hours over 3 years. Storage
          would be 50 MW for 4 hours and does not change a thermal rating. Curtailment on nights like
          last Friday runs about 40 nights a winter. The review Farrow would want takes three weeks.
      - group: OPS
        task: Say what the decision commits the room to
        title: The 18 months you just bought
        place: System Operations
        scene: Reyes wants the consequences written down before the decision is signed, so that the next shift inherits a plan rather than a mood. The room is waiting for a written instruction.
        assumes:
          - a decision to build something is also a decision about the years before it exists
        takeaway: Committing to a fix commits you to running the system without it until it arrives, and that has to be planned too.
        format: PROTOCOL
        why: A build is not relief. It is a date. Between today and that date the corridor is exactly as weak as it was this morning, and now known to be weaker. The room inherits three years of damage and no new capacity. So the emergency rating is recalculated on the corrected sensor. The curtailment nights are budgeted rather than absorbed. The contingency case is run at the corridor's real strength.
        rebuttals:
          - The emergency rating has to be recalculated, because the one in use was derived from the drifted sensor.
          - Curtailment nights become a budgeted cost rather than a surprise, since the corridor is unchanged until the circuit exists.
          - The contingency case has to be rerun at the corridor's real strength rather than its design strength.
          - The argument is settled, which is what lets a shift act quickly without reopening the decision.
        columns:
          - What the next 18 months contains
          - Why the decision puts it there
        scenarios:
          - The emergency rating in the operating instructions.
          - Roughly 40 curtailment nights a winter.
          - The corridor's contingency case.
          - The corridor argument itself.
        choices:
          - Has to be recalculated, because it came from the sensor that read 11 degrees low.
          - Becomes a budgeted cost, because nothing about the corridor changes until the circuit exists.
          - Has to be rerun at the conductor's real strength rather than its design strength.
          - Is closed, which is what lets a shift act at 16:40 without reopening it.
        mapping: [0, 1, 2, 3]
  - title: What we know, and how well
    objective: Say how strongly each of the fortnight's claims is held, and what outlives the emergency.
    briefing: The event report has to state what is established, what is inferred and what is still a guess.
    stake: >-
      Friday, and the fortnight goes into a report. Dolores Reyes will not sign a document that states
      everything at the same confidence, because a reader who cannot tell a measurement from an inference
      will act on both the same way. June Farrow has the evidence file. Ravi Lindgren wants his forecast
      width in as a range rather than a number. Piotr Novak wants the sensor drift written as a finding
      rather than an excuse. Today you sort the fortnight's claims by how strongly each is held, put
      numbers on the ones that deserve them, and decide which of the emergency's changes should become
      permanent practice. This is the part of the fortnight that will still matter in a year.
    takeaway: A finding is worth what its evidence is worth, and saying so is what makes a report usable a year later.
    stops:
      - group: METER
        task: Choose which report claims to verify before signing, with fewer checks than claims.
        title: Measured, inferred, assumed
        place: Metering & Standards
        scene: June Farrow, the metering engineer, has four statements ready for the final report and only two verification slots left before sign-off. Some claims are already backed. Others are still inference or suspicion.
        assumes:
          - a report claim can be measured, inferred or still assumed
          - verification time is limited before the report closes
        takeaway: A signed claim is still only as strong as the evidence behind it; verification should go first to critical claims that remain unbacked.
        format: ATTEST
        question: Which claims deserve the limited verification budget before they become findings?
        attest:
          hint: You may verify only two claims. Read what currently backs each one, then spend checks where a wrong critical claim would most damage the report.
          checks: 2
          claims:
            - id: sensor-offset
              label: The corridor sensor reads about 11 °C low
              critical: true
              backed: true
              evidence: infrared survey + sag estimate + firmware date
              verification: repeat independent temperature comparison
            - id: strength-loss
              label: The conductor has permanent tensile-strength loss
              critical: true
              backed: false
              evidence: inference from corrected thermal history; no sample test
              verification: laboratory tensile test on a representative removed sample
            - id: store-efficiency
              label: The ridge store returned about 85% on the tested cycle
              critical: false
              backed: true
              evidence: one measured charge-discharge cycle
              verification: repeat at a second discharge rate
            - id: relay-cause
              label: A particular relay setting caused the original trip
              critical: true
              backed: false
              evidence: plausible sequence; no causal test yet
              verification: replay the event against the relay setting and independent event timing
          correctVerify:
            - strength-loss
            - relay-cause
        answerText: Use the two checks on conductor strength and the proposed relay cause. The sensor offset is already independently backed, while the storage-efficiency result is lower-stakes for the inquiry finding.
        why: The report contains claims at different evidence levels. The sensor offset is critical but already backed by two independent methods and a firmware date. Permanent conductor-strength loss is plausible metallurgy, yet no sample has tested it. The storage result is measured but not central to the cause finding. The proposed relay cause is both critical and still unproved. With only two verification slots, checking everything is impossible. Spend them on the critical claims whose present evidence cannot support a final finding.
      - group: LOAD
        task: Put a range on the forecast rather than a number
        title: The number that has to be a range
        place: Load & Forecasting
        scene: Lindgren's winter peak goes into the report. He wants the width in the sentence, and Reyes wants to know what the width is for. The control-room phone is already ringing.
        assumes:
          - a forecast is a distribution rather than a single value
        takeaway: A prediction is only usable by a planner if it says how wrong it might be.
        format: CHOICE
        question: Why does the winter peak go in as a range rather than as a single figure?
        answerText: The width quantifies how far the actual peak could plausibly sit above the centre. That upper-tail uncertainty is what reserve planning has to cover.
        why: "Reserve is not held against the expected peak. It is held against the amount by which the peak might exceed it. That is a property of the width and not of the centre. A report that states a single megawatt figure has deleted the only quantity a planner needs. The planner then invents one — usually badly, and usually optimistically. The width is also the honest part: it says which conditions the model was calibrated for and which it was not."
        choices:
          - Because reserve must cover plausible outcomes above the forecast centre, which depends on the forecast width.
          - Because a range prevents one unusual winter peak from counting as a model failure.
          - Because the centre estimate is not measurable until after winter, while the width is measurable now.
          - Because a range automatically includes the reserve already scheduled by the operators.
        answer: Because reserve must cover plausible outcomes above the forecast centre, which depends on the forecast width.
        rebuttals:
          - The range makes the forecast more testable, not less; outcomes outside the stated width are evidence against its calibration.
          - Both centre and width are estimated from data before the season; neither requires waiting for the realized peak.
          - The forecast distribution and the reserve decision are separate. The width informs reserve; it does not already contain it.
      - group: OPS
        task: Decide which of the fortnight's changes becomes permanent
        title: What outlives the emergency
        place: System Operations
        scene: Four things the room started doing under pressure. Reyes asks which of them are worth their cost on an ordinary Monday, when nothing is going wrong. A printed network diagram lies on the desk.
        assumes:
          - a practice adopted under pressure has a cost that only shows up later
        takeaway: Keep the practices that would have caught the fault early, and drop the ones that only paid off because the fortnight was abnormal.
        format: CHOICE
        question: Which of the fortnight's changes is most worth keeping permanently?
        why: One of these would have caught the whole thing. The sensor's offset survived for months because nothing was ever compared against it, and an independent check costs a survey and an afternoon. Elevated reserve is expensive every night and only useful on the rare ones. That is what a width is for deciding rather than a fortnight. More frequent loading reports would not have helped at all, because the readings were wrong rather than late. More of a wrong number is not information.
        choices:
          - Cross-checking any instrument that a decision rests on against an independent method.
          - Holding reserve at the fortnight's elevated level all winter.
          - Reporting corridor loading to the control room every 15 minutes rather than every hour.
          - Requiring two operators to sign any load-shedding decision.
        answer: Cross-checking any instrument that a decision rests on against an independent method.
        rebuttals:
          - Elevated reserve costs money every night for a benefit on a handful, which is a width question rather than a policy.
          - The loading readings were wrong, not late; reporting a wrong number four times as often adds nothing.
          - A second signature slows the one decision that was both correct and time-critical.
# ------------------------------------------------------------- the rooms
# What is inside each area, for the interior the player walks into. The station
# panel is the instrument that area reasons with, so it carries that area's own
# quantity rather than a generic readout.
interiors:
  OPS:
    caption: Frequency is the whole system's supply and demand, arriving as a number.
    standLine: One unit off, frequency settled low, and two people already naming a cause.
    station:
      kind: panel
      title: System overview
      rows:
        - { label: Frequency, value: 49.82 Hz, status: low }
        - { label: Rate of change, value: 0.24 Hz/s at trip, status: high }
        - { label: Generation online, value: '6, 400 MW', status: normal }
        - { label: Spinning reserve, value: 310 MW, status: low }
  GEN:
    caption: A generator is a flywheel first and a power source second.
    standLine: Four machines online, one tripped, and a ramp rate nobody can argue with.
    station:
      kind: panel
      title: Machine hall
      rows:
        - { label: Units online, value: 4 of 5, status: low }
        - { label: Stored inertia, value: '4, 200 MW·s', status: normal }
        - { label: Fastest ramp, value: 8 MW/min, status: low }
        - { label: Governor droop, value: 4%, status: normal }
  TRANS:
    caption: A rating is a time and a temperature, not a wall.
    standLine: 1 corridor above continuous rating, and a relay that will decide in 40 minutes.
    station:
      kind: panel
      title: Corridor loading
      rows:
        - { label: Circuit 2 loading, value: 108%, status: high }
        - { label: Continuous rating, value: '1, 060 A', status: normal }
        - { label: Emergency rating, value: '1, 240 A for 30 min', status: high }
        - { label: Conductor temperature, value: 78 °C, status: high }
  DIST:
    caption: Restoration is measured in households and how long they waited.
    standLine: 11 feeders out, and 2 of them have the clinic on them.
    station:
      kind: panel
      title: Feeder status
      rows:
        - { label: Feeders out, value: 11, status: high }
        - { label: Households off, value: '14, 200', status: high }
        - { label: Priority load off, value: 2 circuits, status: high }
        - { label: Crews available, value: 3, status: low }
  LOAD:
    caption: A forecast is a distribution, and the width is what the reserve has to cover.
    standLine: Tomorrow's peak, and two estimates a factor apart on the cold snap.
    station:
      kind: panel
      title: Demand forecast
      rows:
        - { label: Forecast peak, value: '6, 900 MW', status: normal }
        - { label: Forecast width, value: plus or minus 400 MW, status: high }
        - { label: Reserve held, value: 310 MW, status: low }
        - { label: Temperature at peak, value: -4 °C, status: normal }
  METER:
    caption: A sequence of events is a claim about order, and order needs clocks.
    standLine: Three records of the same eight seconds, disagreeing about what came first.
    station:
      kind: panel
      title: Records bench
      rows:
        - { label: Fast recorder, value: 20 ms, status: normal }
        - { label: SCADA scan, value: 4 s, status: high }
        - { label: Relay clock offset, value: 1.6 s early, status: high }
        - { label: Last calibration, value: 41 days, status: low }

# ------------------------------------------------------------------ the copy
# What each place says when the player reads its panel. Keyed by group id for the
# six areas and by the plain landmark ids in site.js — a building with no entry
# here shows a bare title, and validateContent notes it.
copy:
  OPS: <p>The control room. One long desk, a wall of the whole interconnection, and the only number on it that belongs to everybody.</p>
  GEN: <p>The machine hall. Four sets turning in step with every other machine on the system, which is what lets one number describe all of them.</p>
  TRANS: <p>Protection and switching. The rules for an argument that will happen in 80 milliseconds with nobody present.</p>
  DIST: <p>The depot. Where the network stops being a diagram and turns into a van, a pole and somebody's evening.</p>
  LOAD: <p>Forecasting. Weather, the school holidays, and whether it gets dark before people get home.</p>
  METER: <p>Standards. The question nobody wants opened during an incident: is that number the number.</p>
  GATE: <p>The gatehouse. Badge, permit to work, and the day's calls.</p>
  STORE: <p>Spares and cable. Nothing here is interesting until the night a restoration is limited by it.</p>
  TRAINING: <p>The simulator room. Last year's event, replayed at quarter speed, with the log open beside it.</p>

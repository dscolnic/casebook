        guide: >-
          Four numbers, and two of them belong to the healthy circuit and the
          protection. Normal load current is set by equipment drawing power, and a fault
          bypasses that equipment. Ask of each number whether it describes the load or
          the path back to the source. The clearing time decides how long the current
          flows, not how large it is.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is

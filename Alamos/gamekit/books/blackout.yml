            - 3 Ω  (newer circuit)
            - 11000 V  (busbar voltage)
          values: [900, 6, 3, 11000]
          slots: 3
          template: "{0} × {2} ÷ ({1} + {2})"
          formula: a*c/(b+c)
          correct: [0, 1, 2]
          target: 300
          tolerance: 40
          units: A
          solution: I_old = 900 × 3 ÷ (6 + 3) = 300 A.
          explanation: |-
            300 amps in the old circuit and 600 in the new 1. Each path takes the other's impedance over the sum, so the low-impedance route carries twice as much. The busbar voltage is the same for both, which is why it cancels and never enters the arithmetic.
          givens:
            - Total current is 900 A
            - The older circuit is 6 Ω and the newer is 3 Ω
          relationship: |-
            Current in one of two parallel paths = the total × the other path's impedance ÷ the sum of the two impedances.
      - group: OPS
        task: Spend the evidence budget on measurements that can change the reserve decision before the evening peak.
        title: What is worth knowing before the peak
        place: System Operations
        scene: Reyes has a small budget and four things she could find out before the evening peak. Only some of them would change what she does about the reserve. The shift log is open beside them.
        guide: >-
          Five evidence credits, four things you could find out, and a reserve decision
          at six o'clock. Open each card and ask what its result would change. A
          measurement that confirms something already settled is not worth a credit,
          however clean it would be. Buy the ones that could still move the decision,
          and commit before the peak.
        background:
          - >-
              What makes evidence worth its credit. Two possible results that point at
              different actions. If both outcomes leave you doing the same thing about the
              reserve, the measurement is interesting and not useful — and tonight the
              difference between those two words is a credit you cannot get back.
          - >-
              Why the deadline is part of the question. A result that arrives at seven is a
              result about a decision already made. So a slower, better measurement can be
              worth less than a rough one in time, which is the opposite of how the same
              choice would be scored in a laboratory.
          - >-
              What the shift log is doing open beside her. It records what has already been
              decided and why, which is the fastest way to see which of the four questions
              are still open. Half of buying evidence well is knowing what is already
              settled.
        takesAsRead:
          - Electrical power and energy over time
        assumes:
          - reserve is held against uncertainty rather than only the forecast centre
          - storage power and storage deliverability are separate claims
        takeaway: The value of a measurement is the decision it can change, not how precise or interesting it sounds.
        format: VALUE
        question: Which measurements are worth buying before 18:00?
        value:
          hint: You have five evidence credits. Buy results that can still change the 18:00 reserve decision; every option shows what you would learn after purchase.
          budget:
            amount: 5
          decision: Set the reserve carried into the 18:00 peak.
          options:
            - id: cold-sensitivity
              label: Re-estimate the last degree of cold from this winter
              cost: 3
              axis: load uncertainty
              decisive: true
              reveals: The last degree adds 210 MW, not 120 MW; the forecast width must be widened before 18:00.
            - id: store-test
              label: Test the ridge store at the intended peak discharge rate
              cost: 2
              axis: reserve deliverability
              decisive: true
              reveals: The store returns about 85% over the cycle at this rate, so its credited energy is lower than the brochure case.
            - id: machine-repeat
              label: Repeat the autumn frequency-response test
              cost: 2
              axis: generator response
              decisive: false
              reveals: The machine repeats its autumn response within measurement scatter; tonight’s reserve plan does not move.
            - id: feeder-survey
              label: Commission a full feeder-demand survey
              cost: 4
              axis: spatial demand
              decisive: false
              reveals: The survey would refine feeder planning, but the result arrives in six weeks and cannot affect tonight.
        answerText: Buy the current-winter cold-load sensitivity and the peak-rate storage test. Together they cost the full five-credit budget and address two independent uncertainties that can still change tonight’s reserve.
        why: Reserve depends on uncertainty in demand and on resources that can actually deliver when called. Measuring this winter’s cold-load sensitivity can change the forecast width before the peak. Re-testing storage at the relevant discharge rate can change how much reserve the store deserves credit for. Repeating a generator test that is already current mainly buys reassurance. A feeder survey that arrives in six weeks may be useful planning evidence, but it cannot change tonight. Evidence has value only when its result can still alter the decision.
      - group: DIST
        task: Estimate the volt drop to the end of the feeder
        title: Why the far end sits low
        place: Distribution Depot
        scene: The substation end of the feeder is at nominal voltage. Customers four kilometres along it are complaining, and the only meter is back at the substation. The room is waiting for a written instruction.
        guide: >-
          Six numbers, and one of them is the feeder's nominal voltage, which the drop
          does not use. Two pairs go together: resistance with the in-phase part,
          reactance with the out-of-phase part. Ask of each number which half of the
          impedance it belongs to. And note the rating. Eleven kilovolts is measured
          between lines, which is why a factor arrives with it.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - current flowing through a resistance produces a drop in voltage
        takeaway: Volt drop is set by the current and by both parts of the line's impedance.
        format: BALLPARK
        question: Estimate the volt drop from the substation to the far end.
        answerText: About 1.07 kV line-to-line, roughly 9.7% of an 11 kV feeder.
        why: A real feeder has both resistance and reactance. Current through those terms produces a voltage drop whose size depends on the load phase angle. The resistive part follows the in-phase current. The reactive part follows the out-of-phase current. For a balanced three-phase feeder expressed with line-to-line voltage, the result carries a factor of root three. That factor matters here because 11 kV is a line-to-line rating. Reactive support can raise the far-end voltage by reducing the reactive part of the drop.
        estimate:
          prompt: |-
            The feeder carries 310 A. Over 4 kilometres it has 1.8 ohms of resistance and 0.9 ohms of reactance. The load runs at 0.95 power factor, so sin of the angle is 0.31.
          question: Choose the current, both parts of the impedance, and the two parts of the angle.
          labels:
            - 310 A  (feeder current)
            - 1.8 Ω  (resistance)
            - 0.95  (cos φ)
            - 0.9 Ω  (reactance)
            - 0.31  (sin φ)
            - 11000 V  (nominal feeder voltage)
          values: [310, 1.8, 0.95, 0.9, 0.31, 11000]
          slots: 5
          template: "{0} × ({1} × {2} + {3} × {4})"
          formula: a*(b*c+d*e)
          correct: [0, 1, 2, 3, 4]
          target: 616.6
          tolerance: 60
          units: V
          solution: ΔV_LL ≈ 1.732 × 310 × (1.8 × 0.95 + 0.9 × 0.31) ≈ 1,069 V ≈ 1.07 kV.
          explanation: About 1.07 kV line-to-line, close to 10% of an 11 kV feeder. That is large enough to explain complaints at the far end while the sending-end meter looks normal. The nominal 11 kV is used to judge the percentage drop; it is not multiplied into the drop formula.
          givens:
            - Feeder current is 310 A
            - Resistance is 1.8 Ω and reactance is 0.9 Ω
            - Power factor is 0.95, so sin φ is 0.31
          relationship: For a balanced three-phase feeder, line-to-line drop ≈ √3 × I × (R cos φ + X sin φ), using per-phase R and X.
  - title: 80 milliseconds
    objective: Establish what a fault does before anybody can respond to it.
    briefing: A cable failed at the substation and the protection cleared it before the alarm reached the room.
    stake: >-
      Wednesday, and a cable failed inside the substation at 13:40. The protection cleared it in under a
      tenth of a second, which is the whole story: nobody in the control room saw the fault, they saw the
      aftermath. Piotr Novak needs the fault current worked out before he will sign the switchgear back into
      service. June Farrow wants to know how a current transformer produces a reading from a wire it never
      touches. Ewa Kowalczyk has a crew standing at a gate and a rule about earthing that they are quietly
      impatient with. Today you size the fault, explain the instrument, and decide who may approach.
    takeaway: A fault is limited only by impedance, which is why the numbers are enormous and the times are tiny.
    stops:
      - group: TRANS
        task: Estimate the current the fault drew
        title: What a short circuit is limited by
        place: Transmission & Protection
        scene: |-
          The cable failed phase to earth. Phase voltage is 6,350 volts and the total impedance back to the source is 0.42 ohms. Novak wants the current the switchgear had to interrupt.
        guide: >-
          Four numbers, and two of them belong to the healthy circuit and the
          protection. Normal load current is set by equipment drawing power, and a fault
          bypasses that equipment. Ask of each number whether it describes the load or
          the path back to the source. The clearing time decides how long the current
          flows, not how large it is.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        assumes:
          - a short circuit leaves almost no impedance in the path
        takeaway: Fault current is the driving voltage over the impedance of the path, and nothing else limits it.
        format: BALLPARK
        question: Estimate the current that flowed during the fault.
        answerText: About 15 kA RMS for the initial fault-current estimate.
        why: Normal load current is set by the equipment drawing power. A fault bypasses that load, so the current is instead limited mainly by the source and network impedance back to the fault. Using the phase voltage and the Thevenin impedance gives the first symmetrical RMS estimate. Here 6,350 V divided by 0.42 Ω is about 15 kA. That is why switchgear has a separate interrupting rating. Clearing time then controls how long the large current can deposit heat and mechanical stress.
        estimate:
          prompt: |-
            Phase voltage at the fault was 6,350 V. Total impedance of the source, transformer and cable back to it is 0.42 Ω. Normal load on the circuit is 310 A.
          question: Choose the driving voltage and the impedance of the path.
          labels:
            - 6350 V  (phase voltage)
            - 0.42 Ω  (impedance back to source)
            - 310 A  (normal load current)
            - 0.08 s  (clearing time)
          values: [6350, 0.42, 310, 0.08]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 15119
          tolerance: 1500
          units: A
          solution: I = 6,350 ÷ 0.42 ≈ 1.5 × 10⁴ A.
          explanation: |-
            About 15000 amps, roughly 50 times the normal load. The load current does not limit a fault, because the fault has gone around the load. The clearing time matters for the energy released rather than for the size of the current.
          givens:
            - Phase voltage is 6,350 V
            - Impedance back to the source is 0.42 Ω
          relationship: |-
            Fault current = the driving phase voltage ÷ the total impedance of the path back to the source, with the load bypassed and contributing nothing.
      - group: METER
        task: Use the test loop to isolate what makes the current transformer produce a secondary signal.
        title: A reading taken without a connection
        place: Metering & Standards
        scene: June Farrow, the metering engineer, has a protected low-voltage current-transformer test loop beside the yard diagram. The bench shows primary current, secondary current and a movable core. She wants a cause, not a remembered definition.
        guide: >-
          The rig is a current transformer: a conductor carrying current, and a core
          around it with a winding that reports a scaled copy. The number you are
          watching is that secondary current. Three controls can be changed, and a
          response counts only if it is larger than the bench's own wander. Change one,
          run it, put it back, and name the control the secondary current follows.
        background:
          - >-
              How a current transformer works, and why nothing touches the conductor.
              Current in the primary makes a changing magnetic field, the core carries that
              field around the winding, and the changing field induces a proportional
              current in it. Nothing is connected to the primary at all — which is exactly
              why the instrument is safe on a live circuit, and why what it needs is change
              rather than contact.
          - >-
              Why a steady current reads nothing. Induction responds to a field that is
              changing. Hold the primary current constant and the field stops changing, so
              the winding reports nothing while the conductor is still carrying full load.
              An instrument that reads zero on a live conductor looks broken and is behaving
              exactly as designed.
          - >-
              Why the core is the third control. Open the magnetic path and the field no
              longer links the winding, so the secondary falls away even with a changing
              primary. Two different controls therefore kill the reading for two different
              reasons, and telling them apart is what the reversal is for.
        takesAsRead:
          - "AC waveforms: frequency, period and phase"
          - Charge, current, voltage and resistance
        assumes:
          - a changing magnetic field can induce voltage in a nearby coil
          - the bench current transformer has 1 primary turn and 20 secondary turns
        takeaway: A current transformer responds to changing magnetic flux; a steady primary current produces no sustained secondary signal.
        format: CONTROL
        question: Which change makes the secondary current disappear, and does the signal return when that change is reversed?
        control:
          hint: Change one control at a time and run the test. To commit a cause, remove the suspect while the other controls stay fixed, then restore it and confirm the response returns.
          noise: 0.05
          baseline: 5
          observable:
            label: Reading
            unit: A secondary
          response: -4.95
          truth: waveform
          variables:
            - id: waveform
              label: Primary current waveform
            - id: primary-current
              label: Primary current
            - id: core-path
              label: Magnetic core path
        answerText: The waveform is the causal control. With the core closed and 100 A primary current, AC gives about 5.0 A secondary. Changing only AC to steady DC drops the settled signal to about 0.05 A; restoring AC brings it back to 5.0 A.
        why: A current transformer needs no electrical connection between primary and secondary. Alternating primary current creates changing magnetic flux in the core. Faraday’s law then induces an emf in the secondary, and the turns ratio sets the secondary current approximately. A steady DC current can still create a magnetic field. After the switching transient, however, the flux stops changing and the secondary signal falls almost to zero. Removing the suspected cause and then restoring it is stronger evidence than changing several controls together.
      - group: LOAD
        task: Estimate tomorrow's peak from the curve
        title: The peak, and how far the cold moves it
        place: Load & Forecasting
        scene: |-
          The base peak for a Friday in this week of the year is 6,400 megawatts. Lindgren's own figure for this winter is 120 megawatts of extra demand per degree below 0, and tomorrow is minus 4.
        guide: >-
          Four numbers, and one of them is the reserve held, which belongs to the width
          of the forecast rather than its centre. Ask of each whether it is a base, a
          sensitivity, or a temperature. A sensitivity is megawatts per degree on this
          system, measured from this winter. What comes out is the centre of a forecast,
          and the reserve covers the rest.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        takesAsRead:
          - Electrical power and energy over time
        assumes:
          - demand rises as the temperature falls, roughly in step
        takeaway: A forecast is a base shape plus a sensitivity, and the sensitivity is measured rather than assumed.
        format: BALLPARK
        question: Estimate tomorrow's evening peak.
        answerText: About 6,880 MW at the centre of the forecast.
        why: "A load curve is the same shape most days, because people do the same things at the same times. What moves it is weather, and the useful form of that is a sensitivity: how many megawatts one degree is worth on this system. Measured from this winter's own data rather than from a textbook. Base plus sensitivity times degrees gets the centre of the forecast. It does not get the width, which is what the reserve has to cover."
        estimate:
          prompt: |-
            Base Friday peak for this week of the year is 6,400 MW. Demand sensitivity is 120 MW per degree below 0. Tomorrow's forecast is minus four degrees.
          question: Choose the base peak, the sensitivity and the degrees below zero.
          labels:
            - 6400 MW  (base peak)
            - 120 MW/°C  (demand sensitivity)
            - 4  (degrees below 0)
            - 310 MW  (reserve held)
          values: [6400, 120, 4, 310]
          slots: 3
          template: "{0} + {1} × {2}"
          formula: a+b*c
          correct: [0, 1, 2]
          target: 6880
          tolerance: 120
          units: MW
          solution: Peak ≈ 6,400 + 120 × 4 = 6,880 MW.
          explanation: |-
            About 6,900 megawatts at the centre of the forecast. The reserve is what covers the width around that centre, so it is a separate decision and not part of this sum. Add it in here and you have double-counted the thing the reserve exists for.
          givens:
            - Base peak is 6,400 MW
            - Sensitivity is 120 MW per degree below 0
            - Tomorrow is four degrees below zero
          relationship: |-
            Forecast peak = the base peak for that day and season + the demand sensitivity × the degrees below zero, with the sensitivity measured from this winter's own data.
  - title: The system splits
    objective: Work out what an island is, and whether the one that has formed can hold.
    briefing: The corridor tripped and the valley is now running on its own, for the moment.
    stake: >-
      Friday, 18:20, and the corridor tripped at the worst hour of the worst day — the same corridor the room chose
      to hold inside its emergency rating a week ago, on a thermal record nobody had checked. The valley did not go dark.
      It separated, and it is now an island of its own with the ridge, one gas machine and about a fifth of
      the demand it had at lunchtime. Dolores Reyes has minutes to decide whether to help it survive or shut
      it down deliberately. Nadia Haddad says the one machine in there has almost no inertia behind it.
      Chinelo Obi has the customer numbers. Today you work out what is holding that island's frequency up,
      decide what stored energy is actually available, and choose whether to keep it or collapse it.
    takeaway: An island lives or dies on whether generation inside it can follow the load inside it.
    stops:
      - group: OPS
        task: Find every shortfall-and-inertia pair that fits the measured frequency slope, then use an independent inertia estimate to break the ambiguity.
        title: Why the island's frequency is falling slowly
        place: System Operations
        scene: The island frequency is falling at 0.10 hertz per second. Its dispatchable machine is already at full output, while inverter-connected ridge generation is low. Haddad wants the power shortfall, but the wall gives only the slope.
        guide: >-
          Two controls slide along a family of combinations that all reproduce the
          observed 0.10 hertz per second. Find out how wide that family is before naming
          a number. The wall gives only the slope, and a slope alone cannot separate a
          large shortfall on a heavy system from a small one on a light system. Then
          bring in the stored kinetic energy, which collapses it.
        background:
          - >-
              Why the slope alone is not enough. Frequency falls at a rate set by the power
              shortfall divided by the stored kinetic energy of everything spinning. One
              equation, two unknowns. Every pair that gives the same ratio produces exactly
              the same slope on the wall.
          - >-
              Why the ridge generation matters. Inverter-connected machines contribute
              little or no stored kinetic energy — they are not spinning masses locked to
              the frequency. So an island leaning on them has less inertia than its
              megawatts suggest, and the same shortfall drives the frequency down faster.
          - >-
              What measuring the inertia buys. It fixes one of the two unknowns, so the
              shortfall follows immediately. That is why system operators now measure
              inertia rather than assuming it: the assumption was safe while the fleet was
              synchronous and stopped being safe as it changed.
        assumes:
          - the island is near 50 Hz
          - the initial frequency slope follows df/dt = f₀ΔP/(2E_k)
        takeaway: A frequency slope constrains the ratio of power imbalance to stored kinetic energy; it does not determine either one by itself.
        format: DEGENERACY
        question: What power shortfall is consistent with the 0.10 Hz/s fall once the island’s stored kinetic energy is measured?
        degeneracy:
          hint: Move shortfall and stored kinetic energy until the predicted slope matches 0.10 Hz/s. Notice how many pairs work. Then reveal the independent stored-energy estimate and find the intersection.
          controls:
            - id: shortfall
              label: Generation shortfall
              unit: MW
              min: 60
              max: 180
              step: 1
            - id: stored-energy
              label: Stored kinetic energy
              unit: MW·s
              min: 15000
              max: 45000
              step: 250
          observable:
            label: Initial frequency fall
            value: 0.1
            unit: Hz/s
            nominalFrequency: 50
          truth:
            a: 100
            b: 25000
          locus:
            - a: 80
              b: 20000
            - a: 100
              b: 25000
            - a: 120
              b: 30000
            - a: 140
              b: 35000
            - a: 160
              b: 40000
          second:
            label: Independent machine-data estimate of stored kinetic energy
            locus:
              - a: 90
                b: 25000
              - a: 100
                b: 25000
              - a: 110
                b: 25000
          tolerance:
            a: 8
            b: 1000
        answerText: At 50 Hz, a 0.10 Hz/s fall satisfies |ΔP|/E_k = 0.004 s⁻¹. The independent inertia estimate is 25,000 MW·s, so the shortfall is about 100 MW.
        why: "The initial frequency slope comes from two quantities at once: the real-power mismatch and the stored kinetic energy resisting it. A slow fall can therefore mean a small shortfall, large inertia, or a matching combination of both. Inverter-connected wind can add real power without adding the same synchronous kinetic energy, so installed megawatts do not settle the question. First trace the combinations that reproduce 0.10 Hz/s. Then use an independent estimate of stored kinetic energy to select the matching power shortfall."
      - group: METER
        task: Say where an island's short-term energy actually comes from
        title: What is stored, and for how long
        concept: Capacitance, inductance and stored energy
        place: Metering & Standards
        scene: |-
          Farrow is asked to list what the island has to draw on in the first ten seconds. Two of the four things on her list cannot help at that timescale.
        guide: >-
          Four stores of energy, and the right column is four timescales. Pair them by
          asking how soon each one answers, and for how long. Two of these are on the
          list and cannot help in ten seconds. The fields in transformers and lines hold
          real energy for a fraction of a cycle, which is nothing you can dispatch.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last
              pair looks forced: the fault is usually not in the join you are struggling
              with, but in one you made early and stopped questioning.
        takesAsRead:
          - "AC waveforms: frequency, period and phase"
          - Charge, current, voltage and resistance
        assumes:
          - energy can be stored in a spinning mass, in a magnetic field or in a chemical cell
        takeaway: Every store has a timescale, and matching the store to the timescale is the whole trick.
        format: PROTOCOL
        why: "Each store answers over a different interval and confusing them is how a plan fails. Rotational energy in a spinning machine is there instantly, without anybody asking, and it is gone in seconds. A battery through an inverter responds in well under a second and can hold for hours. That makes it the most useful thing an island can have. Energy in the magnetic fields of transformers and lines is real, and it is a fraction of a cycle: nothing dispatchable."
        rebuttals:
          - Rotational energy arrives instantly with no command and is spent within seconds.
          - A battery through an inverter answers in well under a second and can hold for hours, which is the useful combination.
          - Energy in inductance and capacitance is real and lasts a fraction of a cycle, so nothing can be dispatched from it.
          - Boiler storage is a matter of minutes, which helps the recovery and not the first ten seconds.
        columns:
          - Where the energy is
          - When it can help
        scenarios:
          - The rotating mass of the gas machine.
          - The ridge's battery, through its inverter.
          - The inductance of the island's transformers, and the capacitance of its lines.
          - Heat in the gas machine's boiler and steam drum.
        choices:
          - Instantly and without being asked, for a few seconds only.
          - Within a second of being asked, and for hours if needed.
          - For a fraction of one cycle, which is what inductance and capacitance hold and is too brief to dispatch.
          - After several minutes, which suits the recovery rather than the emergency.
        mapping: [0, 1, 2, 3]
      - group: DIST
        task: Choose what to do about the island
        title: Keeping it, or collapsing it on purpose
        place: Distribution Depot
        scene: Obi has 26,000 households inside the island and a frequency still falling. Holding it needs demand off. Collapsing it means all of them, and a longer way back. The event board is still showing the overnight state.
        guide: >-
          Four options, and the island has one dispatchable machine already at maximum.
          So ask what lever each option actually uses. Two of them are bets on something
          outside the room. One costs all twenty-six thousand households and a
          restoration measured in hours, because a dead network is built back piece by
          piece. The frequency is still falling while you choose.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - restoring a collapsed island takes longer than holding a live one
        takeaway: Shedding some load to keep an island alive is usually cheaper than restoring it from nothing.
        format: CHOICE
        question: What should be done with the island?
        why: An island with its only dispatchable machine at maximum has one lever left, and that is demand. Shedding a fifth stops the fall and keeps four fifths of the valley supplied, which is a far better outcome than everybody off. Letting it collapse costs all 26,000 households and buys a restoration measured in hours. That is because a dead network has to be built back piece by piece. Waiting on wind is betting the island on a forecast.
        choices:
          - Shed about a fifth of the island's load now, to stop the fall and keep the rest supplied.
          - Let it collapse, and restore the whole valley from the main system once the corridor is back.
          - Hold on without shedding, on the chance the rising wind lifts the ridge's output in time.
          - Reconnect it to the main system immediately, before the frequency falls any further.
        answer: Shed about a fifth of the island's load now, to stop the fall and keep the rest supplied.
        rebuttals:
          - Collapsing it loses every customer and turns a shedding problem into a restoration measured in hours.
          - Waiting on the wind bets the island on a forecast, with nothing in reserve if the forecast is late.
          - Two systems at different frequencies cannot be joined; attempting it trips the machine and collapses the island.
  - title: Cranking path
    objective: Build a live system out of a dead one, in the only order that works.
    briefing: The valley collapsed at 19:04 and nothing in it can start without power it has not got.
    stake: >-
      Saturday, 19:04, and the island went. The valley is dark and every machine in it needs electricity to
      start: the boiler feed pumps, the fans, the control systems, the switchgear itself. Nadia Haddad has
      one small hydro set at the head of the valley that can start on its own, and Thabo Dube has a yard full
      of open switches. Dolores Reyes has to decide the order, and there is only one that works. Today you
      cost the energy the valley has already lost, work out why the small set matters more than the large
      one, and write the restoration in the sequence physics allows rather than the one people want.
    takeaway: A dead system is rebuilt from one machine that needs nothing, outward along a path chosen in advance.
    stops:
      - group: GEN
        task: Estimate the energy the valley has not had
        title: What the dark hours actually cost
        concept: Electrical power and energy over time
        place: Generation Hall
        scene: |-
          The valley was drawing about 300 megawatts when it went. Haddad expects the restoration to take two and a half hours, and the report will want the figure in energy rather than power.
        guide: >-
          Four numbers, and two of them belong to other questions: the household count
          and the frequency before the split. Ask of each whether it is a power, a
          duration, or neither. Power says how fast energy is delivered. Energy says how
          much arrived, and it is what a settlement runs on. Both get called demand,
          which is where this goes wrong.
        background:
          - >-
              Why an estimate rather than a calculation. Every quantity on this board is
              already measured or stated, so nothing here has to be derived. What is being
              tested is whether you can pick the quantities the relationship actually needs,
              and whether the size of the answer looks right once they are in place.
          - >-
              Why the tiles carry labels. A bare number cannot be checked against the
              relationship it is going into. Reading the label is how a unit mismatch, or a
              quantity belonging to a different part of the problem, is caught before it is
              placed — which is the habit this format exists to build.
        takesAsRead:
          - Charge, current, voltage and resistance
        assumes:
          - power sustained over a period of time delivers energy
        takeaway: Power is a rate and energy is the amount, and the settlement is always in energy.
        format: BALLPARK
        question: Estimate the energy not delivered during the restoration.
        answerText: About 750 MWh not delivered.
        why: Power says how fast energy is being delivered. Energy says how much arrived. The two are confused constantly, because both get called demand. Multiply the power by the time it was sustained and the result is energy. Megawatt-hours, if the power was in megawatts and the time in hours. That is the number every settlement, every compensation claim and every inquiry runs on, because it is the one that scales with duration. Two systems can lose the same megawatts and owe entirely different amounts.
        estimate:
          prompt: |-
            The valley was drawing about 300 MW when it collapsed. The restoration is expected to take about two and a half hours.
          question: Choose the power and the duration.
          labels:
            - 300 MW  (demand at collapse)
            - 2.5 h  (expected restoration)
            - 26000  (households affected)
            - 49.4 Hz  (frequency before the split)
          values: [300, 2.5, 26000, 49.4]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 750
          tolerance: 80
          units: MWh
          solution: E = 300 × 2.5 = 750 MWh.
          explanation: |-
            750 megawatt-hours never delivered. The household count and the frequency are both central to the story and neither belongs in this calculation. One is who was affected; the other is why it happened.
          givens:
            - Demand at collapse was about 300 MW
            - Restoration is expected to take about 2.5 hours
          relationship: Energy = the power × the time it is sustained for, in megawatt-hours when power is in megawatts.
      - group: OPS
        task: Build the black-start power path in order, then identify the link that governs whether the large station can start.
        title: The order physics allows
        place: System Operations
        scene: One hydro set that can start unaided, a dead network, and a room full of people who want the big station back first. Reyes needs the sequence written before anybody switches anything.
        guide: >-
          Build the path in the order the energy actually travels, from the machine that
          can start unaided to the one that cannot. Then name the required link that
          limits it. The biggest station is not the answer, and neither is the largest
          number on the board: a path is limited by the link with the least to give, and
          the readings tell you which.
        background:
          - >-
              What black start means. Almost every generator needs power to start:
              excitation, auxiliaries, pumps, controls. A hydro set with a battery, a
              governor and a head of water behind it does not, which makes it the only place
              a dead network can begin. Everything else is downstream of it.
          - >-
              Why the order is not a preference. Energising a path means charging line
              capacitance and picking up auxiliaries in an order the equipment can survive.
              Take too much at once and the small starting machine collapses, and the
              network is dead again with less to try next.
          - >-
              Why the room wants the wrong thing. The big station is what everybody is
              waiting for and what the public will notice. That is a reason to write the
              sequence down before anybody switches anything, rather than a reason to put it
              first.
        assumes:
          - the large station needs electrical auxiliaries before it can start
          - the hydro unit can start without an outside electrical supply
        takeaway: "A black start is a dependency chain: the largest generator is useless until a smaller source can energise its auxiliaries through a complete path."
        format: CHAIN
        question: How does startup power reach the large station, and which required link limits the path?
        chain:
          hint: Assemble the transfer path from the source that can start unaided to the machine that cannot. Then choose the required link whose capacity governs whether startup power reaches the auxiliaries.
          links:
            - id: gate
              label: Reservoir gate
              transfers: water flow
              reading: "30 MW equivalent"
            - id: turbine
              label: Hydro turbine
              transfers: mechanical torque
              reading: "24 MW"
            - id: hydro-gen
              label: Hydro generator
              transfers: electrical power
              reading: "20 MW"
            - id: startup-feeder
              label: Black-start feeder
              transfers: electrical power to station auxiliaries
              reading: "8 MW"
            - id: auxiliaries
              label: Large-station pumps and fans
              transfers: startup services
              reading: "needs 6 MW"
            - id: large-gen
              label: Large station generator
              transfers: electrical output after startup
              reading: "500 MW"
          distractor: large-gen
          order:
            - gate
            - turbine
            - hydro-gen
            - startup-feeder
            - auxiliaries
            - large-gen
          governing: startup-feeder
        answerText: Order the path from reservoir gate to hydro turbine, hydro generator, startup feeder, station auxiliaries and then the large generator. The 8 MW startup feeder is the governing link; the 500 MW generator is the obvious distractor.
        why: A dead network cannot start from its biggest generator if that machine needs pumps, fans and controls before it can turn. The black-start hydro unit works because water can supply torque without outside electrical power. Its generator then energises a bus and a narrow startup feeder to the large station. The feeder only needs to carry the station auxiliaries, not the future 500 MW output. That modest link governs the restart. Once the auxiliaries are live, the large machine can start and the system can grow outward.
      - group: DIST
        task: Match each restoration step to the reason it is limited
        title: Why it cannot go faster
        place: Distribution Depot
        scene: Obi has crews asking why restoration is moving a few streets at a time. The substation is live, and the whole feeder could be closed in one movement. The switching sheet is open beside him.
        guide: >-
          Four restoration steps, and four different limits. Pair them by asking what is
          small: the live system, the load on the line, or the agreement between two
          systems. One of these is the opposite of most people's instinct. A long
          circuit with almost nothing on it raises the voltage at its far end rather
          than lowering it.
        background:
          - >-
              Why explanations rather than labels. Naming a finding is not accounting for
              it, and a plausible-sounding mechanism attached to the wrong observation is
              the commonest way a wrong story survives. Committing an explanation to one
              clue means claiming it accounts for that clue specifically and not for its
              neighbour, which is where the two come apart.
          - >-
              How to use the one-each rule. The explanations are a set to be distributed,
              not a list to be sampled, so every join constrains the rest. Settling the two
              you are confident of can decide the remaining pair by elimination. Where it
              does not, two explanations are still competing for one clue, and that
              competition is the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every explanation used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two. That is worth remembering when the last pair
              looks forced: the fault is usually not in the join you are struggling with,
              but in one you made early and stopped questioning.
        assumes:
          - a small live system is disturbed more by a given block of load than a large one
        takeaway: Every restoration step is limited by something different, and hurrying the wrong one collapses it again.
        format: CASEBOOK
        why: "The limits change as the system grows. Very early, the live island is tiny and a block of load is enormous relative to it. Blocks stay small: this is a frequency limit. Energising long circuits with almost no load on them raises voltage rather than lowering it. That is a reactive limit and the opposite of most people's instinct. Cold load picks up higher than normal, because every thermostat in the street is calling at once. And synchronising two live systems is a matching problem, not a capacity one."
        rebuttals:
          - Early on the island is small, so a given block is a large fraction of it, and that is a frequency limit.
          - A long line energised with little load on it pushes voltage up rather than down, which is a reactive limit.
          - Cold load returns above its normal value, because everything that was cut off is calling at once.
          - Joining two live systems is a matching problem in frequency, voltage and angle, not a question of capacity.
        columns:
          - The step
          - What limits it
        scenarios:
          - Adding the first blocks of load to a very small live island.
          - Energising a long, lightly loaded circuit out to the next substation.
          - Restoring a residential feeder that has been off for two hours in winter.
          - Joining the restored island back to the neighbouring system.
        choices:
          - A frequency limit, because a small system cannot absorb a large step.
          - A reactive limit, because a lightly loaded line raises the voltage at its far end.
          - A cold-load limit, because everything that was cut off comes back on at once.
          - A matching limit, because frequency, voltage and angle must agree before the breaker closes.
        mapping: [0, 1, 2, 3]
  - title: 6 hours, not 40 minutes
    objective: Re-read the week from a record nobody had checked.
    briefing: Farrow has traced the corridor's thermal record, and the number the room worked from was wrong.
    stake: >-
      Sunday, and June Farrow has finished tracing the corridor's thermal history. The emergency rating that
      bought the room 40 minutes a week ago was calculated from a sensor that had been reading 11
      degrees low since a firmware update in the spring. The corridor was not 40 minutes from its limit.
      It had been above continuous rating for six hours, and it had been there twice before. Dolores Reyes
      has to decide what that does to every decision taken since. Today you work out what a drifted sensor
      does to a rating, decide which of the week's conclusions still stand, and say what you would have done
      differently. Nothing in the week was reasoned badly. It was reasoned from a number.
    takeaway: A conclusion is only as good as the measurement under it, and a drifted instrument leaves the reasoning intact and the answer wrong.
    stops:
      - group: METER
        task: Choose the explanation that fits the sensor, infrared survey and sag estimate together.
        title: The sensor that was confident and wrong
        place: Metering & Standards
        scene: "Farrow has three sources for the corridor's temperature that week: the sensor, an infrared survey from the ground. The sag measured off a photograph. Two of them agree with each other."
        guide: >-
          Four options, and three temperature sources have to be accounted for. Two
          agree with each other and neither of them shares the corridor sensor. Ask of
          each option how many of the three it explains. Small scatter shows an
          instrument repeats, not that it is right. And the firmware date marks where
          the disagreement starts.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the
              longest option far more often than chance — 88 per cent of passage quizzes
              here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well: a right
              choice made for an approximate reason is indistinguishable from a sound one
              until the day the approximation is what is being tested.
        assumes:
          - an instrument can be precise and still be offset from the truth
        takeaway: Precision is repeatability; accuracy is being right. A drifted sensor has the first and not the second.
        format: CHOICE
        question: Which explanation best fits all three temperature sources?
        why: Small scatter only shows that an instrument repeats. A fixed offset can produce readings that are precise and wrong at the same time. Here 2 methods that do not share the corridor sensor both place the conductor about 11 degrees hotter. The firmware date also marks when the disagreement begins. Sag depends on tension as well as temperature, so it is not proof alone. Its value is that it corroborates an infrared method through different physics, which is exactly what a sensor offset cannot explain away.
        headline: The corridor's own sensor disagrees with two independent measurements of the same week.
        readings:
          - zone: Conductor sensor
            label: Peak temperature
            value: 78 °C
            status: normal
            note: scatter under 0.3 °C
          - zone: Ground survey
            label: Infrared
            value: 89 °C
            status: alarm
          - zone: Photograph
            label: Sag
            value: consistent with 90 °C
            status: alarm
          - zone: Conductor sensor
            label: Firmware
            value: updated in the spring
            status: low
        choices:
          - label: The sensor is correct and both other methods are crude
            mechanism: Its scatter is tiny, so it is the precise measurement.
          - label: The sensor has a fixed offset from the firmware update
            mechanism: It repeats well and sits low, which two independent methods both show.
          - label: The corridor really did run at two temperatures
            mechanism: Different parts of a long conductor can differ.
          - label: The photograph is unreliable and should be discarded
            mechanism: Sag depends on tension as well as temperature.
        answer: The sensor has a fixed offset from the firmware update
        rebuttals:
          - Tight scatter proves the sensor repeats itself, which is what a constant offset looks like from the inside.
          - A long conductor does vary along its length, and not by 11 degrees in the same direction on every survey.
          - Sag is sensitive to tension, which makes it weak alone and useful as the second independent method.
      - group: TRANS
        task: Say what the corrected temperature does to the rating
        title: What a rating is a statement about
        place: Transmission & Protection
        scene: >-
          The corridor's conductors may run continuously at 75 degrees and no hotter.
          Above that the aluminium starts to lose strength, and the span sags towards
          the road beneath it. Novak has the corrected figures and wants the current
          that limit allows, because a rating quoted in amps is really a statement about
          temperature.
        guide: >-
          Drag the corridor current. The readout is the conductor's own temperature, not
          its rating, and only the currents you stop at get plotted. You want the
          current at which that temperature reaches the 75-degree limit named above.
          Heating rises faster than the current causing it, so the curve steepens as you
          go and the last hundred amps cost more than the first. Mark that current and
          commit.
        background:
          - >-
              What sets the temperature. Current heats a conductor as the square of itself,
              and the conductor loses that heat to the air by convection and to the sky by
              radiation. The temperature settles where the two balance, which is why the
              curve is not a straight line: doubling the current asks the cooling to remove
              four times as much heat.
          - >-
              Why a rating is a temperature. The ampere figure printed on a corridor is the
              current that reaches the temperature limit under an assumed ambient, an
              assumed wind and an assumed sun. Change any of those and the same amps arrive
              at a different temperature. That is why a corrected weather figure can move a
              rating without anybody touching the line, and why a rating quoted without its
              assumptions is not a limit at all.
          - >-
              What happens above the limit. Aluminium held above its continuous temperature
              begins to anneal, losing strength it does not get back, and the hotter span
              stretches and sags. The clearance over the road below is a legal minimum, so
              the temperature limit is doing two jobs at once: protecting the conductor, and
              keeping the line where the survey says it is.
        assumes:
          - a conductor's rating is a limit on temperature rather than on current
          - resistive heating rises faster than the current that causes it
        takeaway: A rating is a temperature expressed as a current, so a wrong temperature makes the current limit meaningless.
        format: SWEEP
        question: 75 degrees is the limit the conductor was built to. What current does that allow it to carry all day?
        answerText: About 1,150 A. The corridor was carrying 1,280 A. The corrected figures put it near 89 degrees, about 14 degrees above the continuous limit.
        why: "A rating is not a fuse setting. It is a temperature translated into a current, and the translation runs through the heating. That goes as the square of the current: the last hundred amps buy far more degrees than the first hundred. The curve steepens and the rating sits where it crosses the agreed temperature. Two consequences follow. A rating is only as good as the temperature measurement behind it. That is why a drifted sensor moves a limit that looks like a fixed property of the metal."
        sweep:
          axis:
            label: Corridor current
            unit: A
            min: 600
            max: 1600
            step: 10
          readout:
            label: Conductor temperature
            unit: °C
          baseline: 25
          response:
            - at: 600
              value: 38
            - at: 800
              value: 48
            - at: 1000
              value: 61
            - at: 1150
              value: 75
            - at: 1280
              value: 89
            - at: 1400
              value: 103
            - at: 1600
              value: 129
          target: 1150
          tolerance: 60
          start: 600
          commit: Mark the continuous rating
      - group: OPS
        task: Decide which of the week's conclusions still stand
        title: What survives a bad number
        place: System Operations
        scene: Reyes has the week's decisions on the board and one wrong input underneath several of them. She wants each one marked as still good, now unsupported, or wrong. The yard radio is still live beside them.
        guide: >-
          Four decisions from the week, and one wrong input underneath some of them.
          Trace each decision back to what it was argued from. Ask whether temperature
          is in that chain at all. A loss calculation that used current and resistance
          never touched the sensor. Neither did a frequency. One wrong number voids what
          leaned on it and nothing more.
        background:
          - >-
              Why explanations rather than labels. Naming a finding is not accounting for
              it, and a plausible-sounding mechanism attached to the wrong observation is
              the commonest way a wrong story survives. Committing an explanation to one
              clue means claiming it accounts for that clue specifically and not for its
              neighbour, which is where the two come apart.
          - >-
              How to use the one-each rule. The explanations are a set to be distributed,
              not a list to be sampled, so every join constrains the rest. Settling the two
              you are confident of can decide the remaining pair by elimination. Where it
              does not, two explanations are still competing for one clue, and that
              competition is the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every explanation used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two. That is worth remembering when the last pair
              looks forced: the fault is usually not in the join you are struggling with,
              but in one you made early and stopped questioning.
        assumes:
          - a conclusion can depend on one input or on several
        takeaway: A bad input invalidates what rested on it and leaves the rest standing, and telling them apart is the work.
        format: CASEBOOK
        why: One wrong number does not void a week. It voids whatever leaned on it, and the job is tracing which. The choice to hold the corridor rested entirely on the duration, so it falls. The loss calculation used current and resistance and never touched temperature, so it stands. The restoration order was argued from consequence and household counts, which the sensor never entered. And the decision to shed a fifth of the island was taken on a frequency the sensor has nothing to do with.
        rebuttals:
          - Holding the corridor rested on the duration and nothing else, so it is the one decision that falls outright.
          - The loss figure came from current and resistance, neither of which the sensor touched.
          - The restoration order was argued from consequence and household counts, which the thermal record never entered.
          - The island shed was taken on frequency, which the sensor has nothing to do with; it was right then and still is.
        columns:
          - The decision
          - What the bad number does to it
        scenarios:
          - Holding the corridor inside its emergency rating rather than redispatching.
          - The 17 megawatts of loss calculated for the corridor.
          - The order the 11 feeders were restored in.
          - Shedding a fifth of the island to hold its frequency.
        choices:
          - Falls. It rested on the duration, and the duration was wrong.
          - Stands. It used current and resistance, and never used temperature.
          - Stands. It was argued from consequence and household counts.
          - Stands, and should be said out loud. It was taken on frequency, which the sensor never touched.

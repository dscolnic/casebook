      - group: LOAD
        task: Sort the feeder list before the shed order goes out.
        title: What can come off, and what cannot
        concept: Load shedding as a decision under uncertainty
        place: Load Dispatch
        scene: A shed order needs a list in ten minutes. Some feeders can be dropped and restored an hour later with nobody harmed. Others carry something that cannot simply be switched off and switched back.
        guide: >-
          Two bins. A feeder can be shed if the load behind it tolerates an hour without
          power and comes back the way it went off. It cannot be shed if something behind it
          needs power to stay safe, or cannot be restarted at will. Sort on what is behind
          the feeder, not on how important it sounds.
        background:
          - >-
              Why sheddable is not the same as unimportant. A large industrial customer with its own
              standby plant is sheddable; a small clinic on one supply is not. Size, revenue and
              prominence have nothing to do with it, which is why the list is written in advance and
              not argued out at the time.
          - >-
              What makes a load unsheddable. Something behind it that fails unsafely without power,
              or that cannot be brought back on demand — a furnace that sets solid, a pumped drain
              that floods, a process that has to be run to a finish once started.
        assumes:
          - some loads can be interrupted and restored, and some cannot
        takeaway: What can be shed is decided by what is behind the feeder, not by how important it sounds.
        format: BELT
        question: Send each feeder to the bin that says whether the shed order can take it.
        answerText: Anything that can be dropped and restored with nothing harmed goes left. Anything that fails unsafely or cannot be restarted goes right.
        why: >-
          A shed order is written to the state of what is behind each feeder. On one side sit
          the loads that tolerate an hour off and come back exactly as they went — cold stores
          with thermal mass, offices, street lighting, a works with its own standby set. On the
          other side are loads where an hour without power is not an hour of inconvenience: a
          hospital on one supply, a smelter whose bath sets solid, a pumped drain under a
          town, a process that has to run to a finish once it has started. None of that maps
          onto size or importance, which is exactly why the list is prepared cold and not
          decided at four in the morning by whoever is loudest on the phone. The one thing a
          dispatcher cannot do is work it out during the event.

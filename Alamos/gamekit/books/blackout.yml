        task: Use the test loop to isolate what makes the current transformer produce a secondary signal.
        title: A reading taken without a connection
        reason: >-
          Farrow wants a cause, not a remembered definition, for how an instrument reads a wire it
          never touches
        place: Metering & Standards
        scene: June Farrow, the metering engineer, has a protected low-voltage current-transformer test loop beside the yard diagram. The bench shows primary current, secondary current and a movable core. She wants a cause, not a remembered definition.
        guide: >-
          The rig is a current transformer: a conductor carrying current, and a core
          around it with a winding that reports a scaled copy. The number you are
          watching is that secondary current. Three controls can be changed, and a
          response counts only if it is larger than the bench's own wander. Change one,
          run it, put it back, and name the control the secondary current follows.
        background:
          - >-
              How a current transformer works, and why nothing touches the conductor.
              Current in the primary makes a changing magnetic field, the core carries that
              field around the winding, and the changing field induces a proportional
              current in it. Nothing is connected to the primary at all. That is exactly why the instrument is safe on a live circuit. And why what it needs is change rather than contact.
          - >-
              Why a steady current reads nothing. Induction responds to a field that is
              changing. Hold the primary current constant and the field stops changing, so
              the winding reports nothing while the conductor is still carrying full load.
              An instrument that reads zero on a live conductor looks broken and is behaving
              exactly as designed.
          - >-
              Why the core is the third control. Open the magnetic path and the field no
              longer links the winding, so the secondary falls away even with a changing
              primary. Two different controls therefore kill the reading for two different
              reasons, and telling them apart is what the reversal is for.
        takesAsRead:
          - "AC waveforms: frequency, period and phase"
          - Charge, current, voltage and resistance
        assumes:
          - a changing magnetic field can induce voltage in a nearby coil
          - the bench current transformer has 1 primary turn and 20 secondary turns
        takeaway: A current transformer responds to changing magnetic flux; a steady primary current produces no sustained secondary signal.
        format: CONTROL
        question: Which change stops the flux from inducing a secondary current, and does the signal return when that change is reversed?
        control:
          hint: Change one control at a time and run the test. To commit a cause, remove the suspect while the other controls stay fixed, then restore it and confirm the response returns.
          noise: 0.05
          baseline: 5
          observable:
            label: Reading
            unit: A secondary
          response: -4.95
          truth: waveform
          variables:
            - id: waveform
              label: Primary current waveform
            - id: primary-current
              label: Primary current
            - id: core-path
              label: Magnetic core path
        answerText: The waveform is the causal control. With the core closed and 100 A primary current, AC gives about 5.0 A secondary. Changing only AC to steady DC drops the settled signal to about 0.05 A; restoring AC brings it back to 5.0 A.
        why: A current transformer needs no electrical connection between primary and secondary. Alternating primary current creates changing magnetic flux in the core. Faraday’s law then induces an emf in the secondary, and the turns ratio sets the secondary current approximately. A steady DC current can still create a magnetic field. After the switching transient, however, the flux stops changing and the secondary signal falls almost to zero. Removing the suspected cause and then restoring it is stronger evidence than changing several controls together.

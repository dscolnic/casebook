              qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance. It ran to 88 per cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason looks exactly like a sound one. The difference shows up on the day the approximation is what is being tested.
        assumes:
          - thermal effects depend on both temperature and exposure time
          - an operating record can establish exposure without directly measuring remaining tensile strength
        takeaway: Cumulative high-temperature exposure is a design concern, but the operating record alone does not measure the conductor’s remaining strength.
        format: CHOICE
        question: What does the ninety-hour record justify saying now?
        why: The corrected history matters. Thermal effects do not reset simply because the conductor cools between events. Higher temperatures increase sag immediately, and long or hot exposure can contribute to permanent creep or annealing. But the record is an exposure history, not a tensile test. The defensible conclusion is that the conductor’s remaining margin must be evaluated. Claiming a specific permanent strength loss before modeling or testing would turn an inference into a measurement.
        choices:
          - The record proves repeated high-temperature exposure that may have reduced long-term margin; quantify remaining strength before assuming the original design margin still holds.
          - Nothing, because cooling after each event resets both conductor temperature and material condition.
          - The corridor has proved it can carry the higher current, so the continuous rating can be raised to match the record.
          - The record proves a specific permanent tensile-strength loss, even without a conductor model or sample test.
        answer: The record proves repeated high-temperature exposure that may have reduced long-term margin; quantify remaining strength before assuming the original design margin still holds.
        rebuttals:
          - Cooling removes the immediate temperature but does not guarantee that every long-term material effect resets.
          - Surviving an operating point is not the same as establishing a safe continuous rating; ratings include thermal and clearance assumptions.
          - The exposure history supports concern, but a specific remaining-strength claim requires a conductor model or direct test.
      - group: TRANS


        task: Commit the money, or keep curtailing, before the window closes
        title: What the window is worth
        reason: >-
          One budget, one afternoon, and one of these options stops existing when the window closes
          at five
        place: Transmission & Protection
        scene: Two options, one budget, one afternoon. Novak points out that only one option removes the corridor bottleneck; Haddad points out that only one construction window disappears at five. The corrected thermal record is on the table, and the exact conductor-strength test is still pending.
        guide: >-
          The construction window closes at five and the next one is eighteen months away. The corrected
          record already proves repeated operation above the continuous thermal case. The storage quote
          also expires today, but storage does not add transmission capacity. Curtailment on nights like
          last Friday occurs about forty nights a winter. Farrow's strength review will refine the asset
          condition, but it will not create another corridor path. The board will not approve both
          storage and reinforcement.
        rules: >-
          Spread the hundred points across the 4 proposals. At least 80 of them have to
          be committed, because a panel that funds almost nothing has not decided
          anything. Your largest single allocation must be 35 or more, and it has to
          land on what the evidence supports most. Keep the total sitting on proposals
          the evidence does not support under fifteen. And a proposal it does support
          should not be left under twenty.
        background:
          - >-
              Why the whole spread is graded. Funding is not a vote for one idea. A portfolio says three things: what you think is likely, what is worth hedging against, and what is not worth pursuing at all. The last two are where most of the information is. Backing the right proposal while quietly funding a bad one is
              a worse answer than it looks. That is why the small numbers count as much as
              the big one.
          - >-
              What the three numbers are for. Thirty-five is what makes a lead a lead: below
              it you have hedged rather than chosen. Fifteen is the most that can sit on
              unsupported work before it stops being a rounding error. Past that it is a
              second opinion nobody argued for. Twenty is the floor under a line of work you
              have already called strong, because funding it too thin to finish spends the
              money and buys nothing.
          - >-
              Why there is a floor on the total. Points held back are not caution; they are
              a decision not to decide, taken with somebody else's money and somebody else's
              deadline. The floor is what forces the panel to say something.
        assumes:
          - an option with an expiry date is worth more than the same option without one
        takeaway: When one path closes today, its value includes everything the eighteen-month delay would cost.
        format: SCIENCETANK
        why: This is different from last week because one option now expires. A third circuit is the only proposal that removes the transmission bottleneck rather than working around it. Waiting eighteen months means more curtailment and more operation close to a thermal limit whose historical margin was overstated. The pending strength test should change maintenance assumptions if needed, but it does not erase the measured congestion or create a new path.
        proposals:
          - label: A
            text: Commit the outage window today and string the third circuit this year.
          - label: B
            text: Buy the ridge storage on the expiring quote and put reinforcement to the spring.
          - label: C
            text: Keep curtailing and revisit both when the next window opens in 18 months.
          - label: D
            text: Hold the budget until the corrected thermal record has been independently reviewed.
        recommended:
          A: 55
          B: 25
      - group: OPS


        task: Say what the decision commits the room to
        title: The 18 months you just bought
        reason: >-
          Reyes wants the consequences written down before the signature, so the next shift inherits
          a plan rather than a mood
        place: System Operations
        scene: Reyes wants the consequences written down before the decision is signed, so that the next shift inherits a plan rather than a mood. The room is waiting for a written instruction.
        guide: >-
          Four things on the left, and what the decision does to each on the right. Pair
          them by asking what changes today and what changes only when the circuit
          exists. A build is a date, not relief. Between now and then the corridor is as
          weak as it was this morning, and now known to be weaker. One of these is
          closed so a shift can act at 16:40.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last pair looks forced. The fault is usually not in the join you are struggling with. It is in one you made early and stopped questioning.
        assumes:
          - a decision to build something is also a decision about the years before it exists
        takeaway: Committing to a fix commits you to running the system without it until it arrives, and that has to be planned too.
        format: PROTOCOL
        why: A build is not relief. It is a date. Between today and that date the corridor is exactly as weak as it was this morning, and now known to be weaker. The room inherits three years of damage and no new capacity. So the emergency rating is recalculated on the corrected sensor. The curtailment nights are budgeted rather than absorbed. The contingency case is run at the corridor's real strength.
        rebuttals:
          - The emergency rating has to be recalculated, because the one in use was derived from the drifted sensor.
          - Curtailment nights become a budgeted cost rather than a surprise, since the corridor is unchanged until the circuit exists.
          - The contingency case has to be rerun at the corridor's real strength rather than its design strength.
          - The argument is settled, which is what lets a shift act quickly without reopening the decision.
        columns:
          - What the next 18 months contains
          - Why the decision puts it there
        scenarios:
          - The emergency rating in the operating instructions.
          - Roughly 40 curtailment nights a winter.
          - The corridor's contingency case.
          - The corridor argument itself.
        choices:
          - Has to be recalculated, because it came from the sensor that read 11 degrees low.
          - Becomes a budgeted cost, because nothing about the corridor changes until the circuit exists.
          - Has to be rerun at the conductor's real strength rather than its design strength.
          - Is closed, which is what lets a shift act at 16:40 without reopening it.
        mapping: [0, 1, 2, 3]
  - title: Sign what you can prove




    objective: Separate measured facts from inferences, verify the claims that still matter, and sign the one operating rule that should survive the emergency.
    briefing: The winter case is due today; the final signature has to distinguish what is measured, what is inferred and what is still unknown.
    stake: >-
      Friday, and the winter case is on the desk to sign. The sensor offset is well backed, the
      conductor is still being tested, and one relay cause is only a guess. Today you decide what the
      report may call a finding.
    takeaway: A signed finding is worth only the evidence under it; uncertainty belongs in the report, not hidden behind confident wording.
    stops:
      - group: METER


        task: Choose which report claims to verify before signing, with fewer checks than claims.
        title: Measured, inferred, assumed
        reason: >-
          Four statements are ready for the report, and there are only two verification slots left
          before sign-off
        place: Metering & Standards
        scene: June Farrow, the metering engineer, has four statements ready for the final report and only two verification slots left before sign-off. Some claims are already backed. Others are still inference or suspicion.
        guide: >-
          Four statements are ready for the report and you have two verification slots.
          Open each claim and read what already backs it: some are measured, some are
          inferred from something measured, and some are suspicion written confidently.
          Hold what the backing does not support, and spend the checks where a wrong
          claim would do the most damage.
        background:
          - >-
              The three categories, and why they read alike. A measured claim points at a
              record. An inferred one is a chain of reasoning from a record, which is only
              as good as its weakest step. A suspicion has neither, and in a report all
              three appear as declarative sentences in the same typeface.
          - >-
              Why consequence rather than doubt decides the spend. The least-supported claim
              is not automatically the one to check. A weakly backed statement nobody will
              act on costs little; a well-worded inference that will drive an equipment
              replacement costs a great deal if it is wrong.
          - >-
              What holding a claim means. Not deleting it — marking it as not yet supported,
              so the report says what it can stand behind and what it cannot. A finding is a
              claim the author is willing to be wrong about in public, which is a higher bar
              than believing it.
        assumes:
          - a report claim can be measured, inferred or still assumed
          - verification time is limited before the report closes
        takeaway: A signed claim is still only as strong as the evidence behind it; verification should go first to critical claims that remain unbacked.
        format: ATTEST
        question: The storage round-trip figure is one of four claims. Which of them deserve the limited verification budget before they become findings?
        attest:
          hint: You may verify only two claims. Read what currently backs each one, then spend checks where a wrong critical claim would most damage the report.
          checks: 2
          claims:
            - id: sensor-offset
              label: The corridor sensor reads about 11 °C low
              critical: true
              backed: true
              evidence: infrared survey + sag estimate + firmware date
              verification: repeat independent temperature comparison
            - id: strength-loss
              label: The conductor has permanent tensile-strength loss
              critical: true
              backed: false
              evidence: inference from corrected thermal history; no sample test
              verification: laboratory tensile test on a representative removed sample
            - id: store-efficiency
              label: The ridge store returned about 85% on the tested cycle
              critical: false
              backed: true
              evidence: one measured charge-discharge cycle
              verification: repeat at a second discharge rate
            - id: relay-cause
              label: A particular relay setting caused the original trip
              critical: true
              backed: false
              evidence: plausible sequence; no causal test yet
              verification: replay the event against the relay setting and independent event timing
          correctVerify:
            - strength-loss
            - relay-cause
        answerText: Use the two checks on conductor strength and the proposed relay cause. The sensor offset is already independently backed, while the storage-efficiency result is lower-stakes for the inquiry finding.
        why: The report contains claims at different evidence levels. The sensor offset is critical but already backed by two independent methods and a firmware date. Permanent conductor-strength loss is plausible metallurgy, yet no sample has tested it. The storage result is measured but not central to the cause finding. The proposed relay cause is both critical and still unproved. With only two verification slots, checking everything is impossible. Spend them on the critical claims whose present evidence cannot support a final finding.
      - group: LOAD


        task: Put a range on the forecast rather than a number
        title: The number that has to be a range
        reason: >-
          The winter peak will not go in as one certain number, and the desk wants to know what the width is for
        place: Load & Forecasting
        scene: Lindgren's winter peak goes into the report. He wants the width in the sentence, and Reyes wants to know what the width is for. The control-room phone is already ringing.
        guide: >-
          Four reasons for a range, and they differ in what the width is for. Ask of
          each whether it is about blame, measurement, or planning. Reserve is not held
          against the expected peak. It is held against the amount by which the peak
          might exceed it, and that is the width. A single figure deletes the only
          quantity a planner needs.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance. It ran to 88 per cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason looks exactly like a sound one. The difference shows up on the day the approximation is what is being tested.
        takesAsRead:
          - Charge, current, voltage and resistance
        assumes:
          - a forecast is a distribution rather than a single value
        takeaway: A prediction is only usable by a planner if it says how wrong it might be.
        format: CHOICE
        question: Why does the winter peak — a power figure in megawatts — go in as a range rather than as a single number?
        answerText: The width quantifies how far the actual peak could plausibly sit above the centre. That upper-tail uncertainty is what reserve planning has to cover.
        why: "Reserve is not held against the expected peak. It is held against the amount by which the peak might exceed it. That is a property of the width and not of the centre. A report that states a single megawatt figure has deleted the only quantity a planner needs. The planner then invents one — usually badly, and usually optimistically. The width is also the honest part: it says which conditions the model was calibrated for and which it was not."
        choices:
          - Because reserve must cover plausible outcomes above the forecast centre, which depends on the forecast width.
          - Because a range prevents one unusual winter peak from counting as a model failure.
          - Because the centre estimate is not measurable until after winter, while the width is measurable now.
          - Because a range automatically includes the reserve already scheduled by the operators.
        answer: Because reserve must cover plausible outcomes above the forecast centre, which depends on the forecast width.
        rebuttals:
          - The range makes the forecast more testable, not less; outcomes outside the stated width are evidence against its calibration.
          - Both centre and width are estimated from data before the season; neither requires waiting for the realized peak.
          - The forecast distribution and the reserve decision are separate. The width informs reserve; it does not already contain it.
      - group: OPS


        task: Sign the one operating rule that should outlive the emergency.
        title: The rule you sign
        reason: >-
          The last page asks which emergency practice is cheap enough to become a standing rule on
          ordinary nights
        place: System Operations
        scene: Reyes turns the last page toward you. Four emergency practices are listed, but only one is cheap enough and powerful enough to become a standing rule on ordinary nights. Your choice is the final instruction in the winter case.
        guide: >-
          All four changes are defensible and all four cost something every day. Ask of
          each whether it would have caught this campaign's failure, and whether the
          room will still be doing it in March. The sensor's offset survived months
          because nothing was compared against it. More frequent reports of a wrong
          number are not information.
        background:
          - >-
              Why the wrong options are the interesting ones. Each distractor is written to
              be the answer under one specific misreading — a step skipped, a quantity
              confused with a rate, a correlation taken for a cause. Identifying which
              misreading each belongs to is where the learning is; the right answer alone
              can be reached on instinct and teach nothing.
          - >-
              Why the shape of an option tells you nothing. A correct answer collects the
              qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance. It ran to 88 per cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so
              length, hedging and specificity have had the signal taken out of them
              deliberately.
          - >-
              What the verdict adds. Every wrong option carries its own rebuttal, and the
              verdict prints them — the reason that option fails, not a restatement of the
              right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason looks exactly like a sound one. The difference shows up on the day the approximation is what is being tested.
        assumes:
          - a practice adopted under pressure has a cost that only shows up later
        takeaway: Keep the practice that would have exposed the hidden failure before the crisis, without making every ordinary shift pay for an emergency-level response.
        format: CHOICE
        question: Which operating rule do you sign into permanent practice?
        why: The sensor offset survived for months because no independent method was routinely compared with the number carrying the operating decision. A cross-check would have exposed that failure before the corridor crisis. Permanently elevated reserve is expensive and should instead be sized to forecast uncertainty. Faster reporting would only repeat the same bad sensor more often. A second signature on urgent load shedding adds delay to a decision that sometimes has to be made in seconds.
        choices:
          - Cross-check any instrument that an operating limit or emergency decision depends on against an independent method at defined intervals.
          - Hold reserve at the campaign's emergency level for the entire winter, regardless of the forecast distribution.
          - Report corridor loading every fifteen minutes instead of every hour, using the same measurement chain.
          - Require two operators to sign every load-shedding action before any feeder can be opened.
        answer: Cross-check any instrument that an operating limit or emergency decision depends on against an independent method at defined intervals.
        rebuttals:
          - Emergency-level reserve costs money every night; the forecast distribution should determine how much is needed.
          - The failure was accuracy, not reporting speed. Repeating the same wrong reading more often adds no independent information.
          - A mandatory second signature delays the one class of action that may need to occur before certainty or consensus is available.
# ------------------------------------------------------------- the rooms
# What is inside each area, for the interior the player walks into. The station
# panel is the instrument that area reasons with, so it carries that area's own
# quantity rather than a generic readout.
interiors:
  OPS:
    caption: Frequency is the whole system's supply and demand, arriving as a number.
    standLine: One unit off, frequency settled low, and two people already naming a cause.
    station:
      kind: panel
      title: System overview
      rows:
        - { label: Frequency, value: 49.82 Hz, status: low }
        - { label: Rate of change, value: 0.24 Hz/s at trip, status: high }
        - { label: Generation online, value: '6,400 MW', status: normal }
        - { label: Spinning reserve, value: 310 MW, status: low }
  GEN:
    caption: A generator is a flywheel first and a power source second.
    standLine: Four machines online, one tripped, and a ramp rate nobody can argue with.
    station:
      kind: panel
      title: Machine hall
      rows:
        - { label: Units online, value: 4 of 5, status: low }
        - { label: Stored inertia, value: '4,200 MW·s', status: normal }
        - { label: Fastest ramp, value: 8 MW/min, status: low }
        - { label: Governor droop, value: 4%, status: normal }
  TRANS:
    caption: A rating is a time and a temperature, not a wall.
    standLine: 1 corridor above continuous rating, and a relay that will decide in 40 minutes.
    station:
      kind: panel
      title: Corridor loading
      rows:
        - { label: Circuit 2 loading, value: 108%, status: high }
        - { label: Continuous rating, value: '1,060 A', status: normal }
        - { label: Emergency rating, value: '1,240 A for 30 min', status: high }
        - { label: Conductor temperature, value: 78 °C, status: high }
  DIST:
    caption: Restoration is measured in households and how long they waited.
    standLine: 11 feeders out, and 2 of them have the clinic on them.
    station:
      kind: panel
      title: Feeder status
      rows:
        - { label: Feeders out, value: 11, status: high }
        - { label: Households off, value: '14,200', status: high }
        - { label: Priority load off, value: 2 circuits, status: high }
        - { label: Crews available, value: 3, status: low }
  LOAD:
    caption: A forecast is a distribution, and the width is what the reserve has to cover.
    standLine: Tomorrow's peak, and two estimates a factor apart on the cold snap.
    station:
      kind: panel
      title: Demand forecast
      rows:
        - { label: Forecast peak, value: '6,900 MW', status: normal }
        - { label: Forecast width, value: plus or minus 400 MW, status: high }
        - { label: Reserve held, value: 310 MW, status: low }
        - { label: Temperature at peak, value: -4 °C, status: normal }
  METER:
    caption: A sequence of events is a claim about order, and order needs clocks.
    standLine: Three records of the same eight seconds, disagreeing about what came first.
    station:
      kind: panel
      title: Records bench
      rows:
        - { label: Fast recorder, value: 20 ms, status: normal }
        - { label: SCADA scan, value: 4 s, status: high }
        - { label: Relay clock offset, value: 1.6 s early, status: high }
        - { label: Last calibration, value: 41 days, status: low }

# ------------------------------------------------------------------ the copy
# What each place says when the player reads its panel. Keyed by group id for the
# six areas and by the plain landmark ids in site.js — a building with no entry
# here shows a bare title, and validateContent notes it.
# --------------------------------------------------------------- the warm-ups
# The seven world-graded runs, and why THIS campaign takes each of them. The
# schedule is the engine's — `engine/core/warmups.js` — so nothing here says when
# a run happens. What is here is the reason, because a run with no reason is a
# tutorial and the day model has a rule against those.
warmups:
  trial-near:
    title: Walk the yard before you touch anything
    why: >-
      Nobody works on a switching station they have not walked. Reyes, the shift supervisor,
      takes new engineers round the yard once, in daylight, before the first shift: the control
      room, the relay house, the transformer bays, the metering hut. Every one of them is
      somewhere you will be sent during these shifts, and the map on the plan card means nothing
      until you have stood in the places it names.
  greet:
    title: The shift changes at seven and nobody has met you
    why: >-
      Two crews work this station and they hand over at seven. Farrow, the metering and standards engineer,
      wants you known to both before anything goes wrong, because at four in the morning a voice
      on a radio is either somebody you have met or somebody you are going to argue with. Get
      round the yard and put a name to most of the shift before the handover is done.
  follow:
    title: The switching route, walked once by somebody who knows it
    why: >-
      Obi, the distribution lead, walks the restoration route the way it has to be walked, in
      the order the isolations happen, and she will not do it twice. Stay with her. Too far back
      and you lose which bay she turned into; too close and you are standing in front of the
      cubicle she is reading. She stops at each isolation point long enough to look at it, and
      that is where the walk is actually learned.
  hunt:
    title: Six earths, and the log says five
    item: { name: earth, plural: earths }
    why: >-
      Before the line can be re-energised every temporary earth has to be off. The log says five
      were applied. Lindgren, the load forecasting analyst, counted six going on. Until all of them are
      found and accounted for nothing gets switched in, because an earth left on a line that is
      made live is a fault the size of the station. Find them.
  canvass:
    title: Whose lights are actually back
    why: >-
      The system says eleven feeders are restored. The complaint line says otherwise, and the
      difference matters because a feeder that reads energised at the station and dead at the
      street is a fault somewhere in between. Ask along the affected streets until enough
      answers have come back to tell those two possibilities apart.
  evade:
    title: The contractor who wants a decision in the yard
    why: >-
      A contractor has been in the yard since six wanting a verbal instruction about the
      metering hut, and Reyes, the shift supervisor, has said plainly that nothing gets agreed
      on the ground without the paperwork. Keep out of his way and get your own round done.
      Anything agreed in a yard at seven in the morning is agreed by nobody in particular.
  tag:
    title: Catch Whitlock before she drives off
    why: >-
      Whitlock, the assistant operator, has the only set of relay settings that were never
      filed, and she is walking to her van. Once she is off site they are a week away. Catch her
      up before she gets there, because the whole afternoon rests on a number that currently
      exists in one person's notebook.

copy:
  OPS: <p>The control room. One long desk, a wall of the whole interconnection, and the only number on it that belongs to everybody.</p>
  GEN: <p>The machine hall. Four sets turning in step with every other machine on the system, which is what lets one number describe all of them.</p>
  TRANS: <p>Protection and switching. The rules for an argument that will happen in 80 milliseconds with nobody present.</p>
  DIST: <p>The depot. Where the network stops being a diagram and turns into a van, a pole and somebody's evening.</p>
  LOAD: <p>Forecasting. Weather, the school holidays, and whether it gets dark before people get home.</p>
  METER: "<p>Standards. The question nobody wants opened during an incident: is that number the number.</p>"
  GATE: <p>The gatehouse. Badge, permit to work, and the day's calls.</p>
  STORE: <p>Spares and cable. Nothing here is interesting until the night a restoration is limited by it.</p>
  TRAINING: <p>The simulator room. Last year's event, replayed at quarter speed, with the log open beside it.</p>

# --------------------------------------------------------------- the reviews
# Lessons no mission stop points at. From day 3 every day carries a callback, and
# `shapeMissions` will only add one where the oldest taught lesson has an unserved
# "— Review" variant to hand out. Without these the campaign served no callbacks
# at all, because a byte-identical re-serve is recognition rather than retrieval.
#
# Each one is the same concept on a different case, and each names its `concept:`
# outright: the key-concept picker scores keywords across the whole campaign, and a
# stop written after the rarity pass is exactly the kind it mis-resolves.
lessons:
  - group: LOAD
    title: What comes out against what went in — Review
    task: Estimate the round trip on the older store
    concept: Storage, round-trip efficiency and ramp rate
    place: Load & Forecasting
    scene: >-
      Sten Lindgren, the load forecasting analyst, has a second store's Thursday cycle open: one
      charge overnight, one discharge into the morning rise. Rafael Alvarez, the demand analyst,
      wants to know whether it is worth counting as reserve at all.
    guide: >-
      Four numbers, and only two of them are energies. The other two say how hard the
      unit can push and for how long it can keep pushing, which is a different claim
      about the same machine. Ask of each tile what it would be measured in. A round
      trip is one energy divided by another energy of the same kind, over one complete
      cycle. This unit is smaller and older than the one on Sunday's log, and nobody has
      cycled it deliberately since spring.
    background:
      - >-
          Why an estimate rather than a calculation. Every quantity on this board is
          already measured or stated, so nothing here has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs. And whether the size of the answer looks right once they are in place.
      - >-
          Why the tiles carry labels. A bare number cannot be checked against the
          relationship it is going into. Reading the label is how you catch a unit mismatch before you place it. It also catches a quantity that belongs to a different part of the problem. That habit is what this format exists to build.
    takesAsRead:
      - Electrical power and energy over time
    assumes:
      - storing energy and recovering it both lose some of it
      - a rating in megawatts is a rate rather than an amount
    takeaway: A store's worth as reserve is a fraction, and the same fraction is asked of every machine whatever its nameplate says.
    format: BALLPARK
    question: Estimate the round-trip efficiency of the older store.
    answerText: About 77% round-trip efficiency.
    why: >-
      Every store loses a share of what it is given, in the converter, in the chemistry
      and in holding itself at temperature, and an older unit loses more. The test does
      not change with the machine. Divide what came back out by what went in, over one
      complete cycle. The answer is the fraction of the nameplate you may count as
      reserve. A rating in megawatts answers how fast, and a duration answers how long.
      Neither answers how much survives.
    estimate:
      prompt: >-
        The store took in 96 MWh on Wednesday night and gave back 74 MWh into Thursday's morning
        rise. It is rated at 30 MW for 3 hours.
      question: Choose the energy out and the energy in.
      labels:
        - 74 MWh  (energy returned)
        - 96 MWh  (energy taken in)
        - 30 MW  (power rating)
        - 3 h  (rated duration)
      values: [74, 96, 30, 3]
      slots: 2
      template: "{0} ÷ {1}"
      formula: a/b
      correct: [0, 1]
      target: 0.77
      tolerance: 0.03
      units: fraction
      solution: η = 74 ÷ 96 = 0.77, or 77%.
      explanation: >-
        77%, so nearly a quarter of everything put in never comes back. That is eight points
        worse than the newer store, and it is this figure the reserve has to be sized on. The
        rating multiplied by the duration gives 90 MWh, which is a capability rather than a
        measurement.
      givens:
        - Energy in was 96 MWh
        - Energy returned was 74 MWh
      relationship: Round-trip efficiency = the energy out ÷ the energy in, measured over a full cycle.

  - group: GEN
    title: The reason the wires are not at wall voltage — Review
    task: Say what a transformer costs while it carries nothing
    concept: Transformers, turns ratio and losses
    place: Generation Hall
    scene: >-
      The spare bank at the far end of the yard has been left energised through three quiet
      nights so it can be picked up instantly. Nadia Haddad, the generation lead, wants the
      standing cost of that decision written down before the audit.
    guide: >-
      All four options divide the loss into two parts and disagree about which part the
      load controls. The test is what each part is dissipated in, and what has to be
      present for it to appear at all. Work out what is still going on inside a
      transformer that is connected and carrying nothing. The distinction decides whether
      leaving spare plant hot is free or is a bill every night of the year.
    background:
      - >-
          Why the wrong options are the interesting ones. Each distractor is written to
          be the answer under one specific misreading — a step skipped, a quantity
          confused with a rate, a correlation taken for a cause. Identifying which
          misreading each belongs to is where the learning is; the right answer alone
          can be reached on instinct and teach nothing.
      - >-
          Why the shape of an option tells you nothing. A correct answer collects the
          qualifying clause and the unit. So across a whole game the key used to be the longest option far more often than chance. It ran to 88 per cent of passage quizzes here, before it was fixed. It is now checked per game as a binomial tail, so
          length, hedging and specificity have had the signal taken out of them
          deliberately.
      - >-
          What the verdict adds. Every wrong option carries its own rebuttal, and the
          verdict prints them — the reason that option fails, not a restatement of the
          right one. They are worth reading after a correct answer as well. A right choice made for an approximate reason looks exactly like a sound one. The difference shows up on the day the approximation is what is being tested.
    takesAsRead:
      - Electrical power and energy over time
      - Faraday's law and electromagnetic induction
    assumes:
      - a transformer is energised the moment it is connected, whether or not it carries load
    takeaway: A cost that does not follow the load is still a cost, and it is the one an idle machine goes on paying.
    format: CHOICE
    question: A transformer bank sits energised all night carrying almost no load. What is it costing?
    answerText: The core loss carries on at close to its full-load figure while the winding loss falls away with the load.
    why: >-
      A transformer has two families of loss and they answer to different things. Copper
      loss is dissipated in the windings by the current through them, so it rises and
      falls with the load and disappears when the load does. Iron loss is dissipated in the core by the flux reversing fifty times a second. The flux is set by the applied voltage rather than by the load. Energise the bank and you pay it, all
      night, carrying nothing.
    choices:
      - The core loss carries on at close to its full-load figure while the winding loss falls away with the load.
      - Both the core loss and the winding loss fall away with the load, since every loss in the machine is dissipated by the current flowing through its windings.
      - The winding loss carries on at close to its full-load figure while the core loss falls away, because the windings stay at their working voltage overnight.
      - Nothing measurable, because a transformer only dissipates while it is actually transferring power from one winding to the other.
    answer: The core loss carries on at close to its full-load figure while the winding loss falls away with the load.
    rebuttals:
      - Only the winding loss is set by the current; the core is magnetised by the applied voltage, and that does not go away when the load does.
      - Voltage across a winding is not current through it, and it is the current that heats the copper.
      - An energised core is reversing its flux fifty times a second whether or not anything is drawing from the secondary.

  - group: OPS
    title: What a node has to add up to — Review
    task: Say what each observation at the node establishes
    concept: Kirchhoff's laws and nodal analysis
    place: System Operations
    scene: >-
      A relay upgrade has left one branch meter dead on a four-way node, and the yard wants to
      know whether the shift can carry on without it. Aaron Whitlock, the assistant operator,
      has the four readings in front of him, one of them blank.
    guide: >-
      Four observations from the same substation, and the right column says what each one
      establishes. Pair them by asking which of the two bookkeeping rules is being
      invoked, and whether the observation settles anything on its own. One rule fixes a
      sum at a junction. The other fixes a sum around a closed path. What neither of them
      gives you is how a total divides between two ways round.
    background:
      - >-
          Why this is a matching board and not four separate questions. Responses on
          boards like this are written to be plausible for more than one situation, so
          choosing them one at a time lets a nearly-right answer through unexamined.
          Having to place all of them forces the comparison — not "is this reasonable
          here", but "is it more right here than there".
      - >-
          How to use the one-each rule. Because the responses are a set to be
          distributed rather than a list to be sampled, every join you make constrains
          the rest. Settling the two you are confident of can leave the remaining pair
          decided by elimination. Where it does not, two responses are still competing
          for one situation, and that is exactly the distinction the stop is testing.
      - >-
          Why you cannot be wrong about exactly one. With every response used once,
          three correct joins leave the fourth with only one place to go. Any error
          therefore involves at least two joins. That is worth remembering when the last pair looks forced. The fault is usually not in the join you are struggling with. It is in one you made early and stopped questioning.
    takesAsRead:
      - Charge, current, voltage and resistance
      - Ohm's law and resistive networks
    assumes:
      - charge does not accumulate at a junction
      - a network drawing can be read as a set of junctions and closed paths
    takeaway: A rule that fixes a sum is how a term nobody measured is recovered from the terms somebody did.
    format: PROTOCOL
    why: >-
      Both of these rules are bookkeeping, and bookkeeping is what makes a missing entry
      recoverable. Currents at a junction have to sum to nothing, so three branch readings
      and the incoming total give the fourth without a meter on it. Voltages around a
      closed path have to sum to nothing, so a path that does not close is a statement
      about the readings rather than about the network. Neither rule says how a total
      divides. That takes the impedances.
    scenarios:
      - The three working branch meters and the incoming meter are read at the same instant.
      - The measured voltages around a closed path of the network add to a figure well away from nothing.
      - Two circuits between the same pair of busbars are carrying very different currents.
      - A drawing shows the node feeding four branches and nothing else.
    choices:
      - The dead branch's current is recoverable, because the sum at the junction is fixed even when one term is unmeasured.
      - Something in that path is unmetered or one of the readings is wrong, since a closed path has to come back to where it started.
      - The two paths differ in impedance, which is the second relation the junction rule was never going to supply.
      - Nothing is allowed to leave the node except down those branches, which is the assumption the whole sum rests on.
    mapping: [0, 1, 2, 3]
    rebuttals:
      - Three readings and a total leave one unknown in one equation, which is a measurement by arithmetic rather than a gap.
      - A path that does not close is evidence about the instruments; the network cannot store a voltage that goes nowhere.
      - Equal voltage across two paths says nothing about how the current splits until their impedances are known.
      - The sum only means anything while every way out of the junction is on the drawing.

  - group: TRANS
    title: Loss when the load turns up anyway — Review
    task: Work out the heat in the circuit standing in
    concept: Transmission losses and conductor sizing
    place: Transmission & Protection
    scene: >-
      Thabo Dube, the substation technician, is standing at the second circuit with a clamp
      meter and a drawing. It has picked up flow it does not normally carry, and Piotr Novak,
      the protection engineer, wants the heat figure before dark.
    guide: >-
      Five numbers, and two of them are about the circuit rather than about tonight. The
      current it normally carries belongs to a comparison you can make afterwards. The
      operating voltage belongs to a different relationship entirely. Ask of each number
      whether the heat depends on it. Then notice that the flow has doubled, and decide
      what that does to a quantity the current enters twice.
    background:
      - >-
          Why an estimate rather than a calculation. Every quantity on this board is
          already measured or stated, so nothing here has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs. And whether the size of the answer looks right once they are in place.
      - >-
          Why the tiles carry labels. A bare number cannot be checked against the
          relationship it is going into. Reading the label is how you catch a unit mismatch before you place it. It also catches a quantity that belongs to a different part of the problem. That habit is what this format exists to build.
    takesAsRead:
      - Ohm's law and resistive networks
      - Electrical power and energy over time
    assumes:
      - loss in a conductor rises with the square of the current
      - a thermal rating is a temperature reached over a stated time
    takeaway: A circuit standing in for another does not share out the heat in proportion to the flow it has taken on.
    format: BALLPARK
    question: Estimate the power now lost as heat in the second circuit.
    answerText: About 13 MW.
    why: >-
      Resistive heating in one phase is the current squared times the resistance, and three
      phases carry three times that. This circuit is holding twice its usual flow, so it
      sheds four times its usual heat — about thirteen megawatts against a little over
      three. What matters is what that does to the margin. A conductor's limit is a temperature reached over time, and it is the heat that drives the temperature. So a doubled current spends the margin far faster than the current figure suggests.
    estimate:
      prompt: >-
        The circuit is carrying 820 A RMS in each phase. Each phase has 6.5 ohms of resistance
        over its length.
      question: Choose the current, the resistance and the number of phases.
      labels:
        - 820 A  (RMS current per phase now)
        - 6.5 Ω  (resistance per phase)
        - 3  (phases)
        - 410 A  (the current this circuit normally carries)
        - 33 kV  (the circuit's operating voltage)
      values: [820, 6.5, 3, 410, 33]
      slots: 3
      template: "{0} × {0} × {1} × {2}"
      formula: a*a*b*c
      correct: [0, 1, 2]
      target: 13111800
      tolerance: 1200000
      units: W
      solution: P_loss = 3 × 820² × 6.5 ≈ 1.31 × 10⁷ W ≈ 13 MW.
      explanation: >-
        About 13 megawatts. At its usual 410 A the same circuit sheds a quarter of that, near
        3.3 megawatts, because doubling the current quadruples the heat. The operating voltage
        is a real figure about this circuit and it does not enter the loss at all.
      givens:
        - RMS current is now 820 A in each phase
        - Resistance is 6.5 Ω per phase
        - There are three phases
      relationship: Total three-phase loss = 3 × I_rms² × R_phase, so doubling the current quadruples the heat.

        concept: Ohm's law and resistive networks
        place: Load & Forecasting
        scene: Sten Lindgren, who forecasts demand, wants the loss figure before the morning call. The argument about moving generation is really an argument about waste. The yard radio is still live beside them.
        guide: >-
          Five numbers, and two of them are the voltage and the power factor. Neither
          appears in a resistive loss. Ask of each number whether the heat depends on
          it. Heat comes from current and resistance, and it is paid once per phase.
          Note the square while you are choosing. Ten per cent more current is about

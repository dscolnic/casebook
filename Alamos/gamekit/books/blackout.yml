            - t: 0
              value: 108
              hoursLeft: 8
              at: now
              update: 108 % of continuous rating
            - t: 1
              value: 109.5
              hoursLeft: 7
              at: +1 h
              update: 109.5 % of continuous rating
            - t: 2
              value: 111
              hoursLeft: 6
              at: +2 h
              update: 111 % of continuous rating
            - t: 3
              value: 112.5
              hoursLeft: 5
              at: +3 h
              update: 112.5 % of continuous rating
            - t: 4
              value: 114
              hoursLeft: 4
              at: +4 h
              update: 114 % of continuous rating
            - t: 5
              value: 115.5
              hoursLeft: 3
              at: +5 h
              update: 115.5 % of continuous rating
            - t: 6
              value: 117
              hoursLeft: 2
              at: +6 h
              update: 117 % of continuous rating
            - t: 7
              value: 118.5
              hoursLeft: 1
              at: +7 h
              update: 118.5 % of continuous rating
            - t: 8
              value: 121.5
              hoursLeft: 0
              at: +8 h

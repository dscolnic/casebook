        task: Say where an island's short-term energy actually comes from
        title: What is stored, and for how long
        reason: >-
          Two of the four things the room is counting on cannot help in the first ten seconds
        concept: Capacitance, inductance and stored energy
        place: Metering & Standards
        scene: |-
          Farrow is asked to list what the island has to draw on in the first ten seconds. Two of the four things on her list cannot help at that timescale.
        guide: >-
          Four stores of energy, and the right column is four timescales. Pair them by
          asking how soon each one answers, and for how long. Two of these are on the
          list and cannot help in ten seconds. The fields in transformers and lines hold
          real energy for a fraction of a cycle, which is nothing you can dispatch.
        background:
          - >-
              Why this is a matching board and not four separate questions. Responses on
              boards like this are written to be plausible for more than one situation, so
              choosing them one at a time lets a nearly-right answer through unexamined.
              Having to place all of them forces the comparison — not "is this reasonable
              here", but "is it more right here than there".
          - >-
              How to use the one-each rule. Because the responses are a set to be
              distributed rather than a list to be sampled, every join you make constrains
              the rest. Settling the two you are confident of can leave the remaining pair
              decided by elimination. Where it does not, two responses are still competing
              for one situation, and that is exactly the distinction the stop is testing.
          - >-
              Why you cannot be wrong about exactly one. With every response used once,
              three correct joins leave the fourth with only one place to go. Any error
              therefore involves at least two joins. That is worth remembering when the last pair looks forced. The fault is usually not in the join you are struggling with. It is in one you made early and stopped questioning.
        takesAsRead:
          - "AC waveforms: frequency, period and phase"
          - Charge, current, voltage and resistance
        assumes:
          - energy can be stored in a spinning mass, in a magnetic field or in a chemical cell
        takeaway: Every store has a timescale, and matching the store to the timescale is the whole trick.
        format: PROTOCOL
        why: "Each store answers over a different interval and confusing them is how a plan fails. Rotational energy in a spinning machine is there instantly, without anybody asking, and it is gone in seconds. A battery through an inverter responds in well under a second and can hold for hours. That makes it the most useful thing an island can have. Energy in the magnetic fields of transformers and lines is real, and it is a fraction of a cycle: nothing dispatchable."
        rebuttals:
          - Rotational energy arrives instantly with no command and is spent within seconds.
          - A battery through an inverter answers in well under a second and can hold for hours, which is the useful combination.
          - Energy in inductance and capacitance is real and lasts a fraction of a cycle, so nothing can be dispatched from it.
          - Boiler storage is a matter of minutes, which helps the recovery and not the first ten seconds.
        columns:
          - Where the energy is
          - When it can help
        scenarios:
          - The rotating mass of the gas machine.
          - The ridge's battery, through its inverter.
          - The inductance of the island's transformers, and the capacitance of its lines.
          - Heat in the gas machine's boiler and steam drum.
        choices:
          - Instantly and without being asked, for a few seconds only.
          - Within a second of being asked, and for hours if needed.
          - For a fraction of one cycle, which is what inductance and capacitance hold and is too brief to dispatch.
          - After several minutes, which suits the recovery rather than the emergency.

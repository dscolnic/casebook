  # --- Stop 48: Close hydrogen over the whole plant
  #     Concept: whole-system inventory; Keystone: balancing and coupled systems; Area: Electrolysis Hall; Learning role: TRANSFER; Difficulty: L4; Story role: reveal.
  #     placement: BALANCE, at stack-accounting-panel.
  - group: ELEC
    at: stack
    title: "Close hydrogen over the whole plant"
    concept: 13   # whole-system inventory
    reason: "The water treatment passes, but the next shift's hydrogen shortage still needs a whole-plant explanation."
    scene: "With clean water flowing, total hydrogen across the entire plant to identify the missing return and close the recycling loop."
    motivation: "The hydrogen ledger separates a present unmeasured leak from lost future production caused by missing return water."
    format: BALANCE
    # MODEL CONVERSION. The bible's ledger has two sides; the engine's has a total
    # and the streams that have to add up to it. The total is the bible's
    # `closure.available`, 420 kmol H2, the measured uses are its `use` streams,
    # and its `closure.reserve` of 50 is the hidden term — what the ledger is
    # short by until the reserve is counted. The oxygen coproduct stays on the
    # board and off the sum, which is the boundary error the bible names. ONE
    # NUMBER IS NOT THE BIBLE'S: it writes `tolerance: 0`, and the engine needs a
    # positive tolerance, so the closure is graded to half a kilomole.
    balance:
      total: { amount: 420, unit: "kmol H2", label: "Hydrogen available this shift" }
      tolerance: 0.5
      streams:
      - { id: reactor_use, label: "Reactor consumption", value: 360, unit: "kmol H2" }
      - { id: vents, label: "Measured vents", value: 4, unit: "kmol H2" }
      - { id: line_fill, label: "Increase in line inventory", value: 6, unit: "kmol H2" }
      - { id: oxygen_coproduct, label: "Electrolysis oxygen coproduct", value: 200, unit: "kmol O2", countable: false }
      - { id: reserve, label: "Left in reserve", value: 50, unit: "kmol H2", hidden: true }
      commit: "Close the hydrogen ledger"
    question: "Reconcile produced hydrogen and inventory, then identify why next-shift production falls."
    answerText: "The current ledger closes with 50 kmol H2; missing 80 kmol return water causes an 80 kmol next-shift H2 deficit."
    why: "The \"missing hydrogen\" is a timing and boundary error. Each room closes locally while the return stream fails between shifts. Expand the system boundary and include storage/recycle."

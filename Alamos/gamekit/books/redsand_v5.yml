    - {"title":"Separate amount from concentration","problem":"Two solutions both have concentration 0.5 mol/L. Their volumes are 1 L and 2 L. Compare solute amounts.","rule":"n=cV.","steps":["Set up the relationship: n=cV.","n₁=0.5(1)=0.5 mol; n₂=0.5(2)=1 mol."],"answer":"The larger solution contains twice the solute amount.","mistake":"Equal concentration does not mean equal total amount."}
    - {"title":"Use a calibration line","problem":"A sensor obeys A=2c+0.1, with dimensionless reading A and concentration c in mmol/L. A sample gives A=0.5.","rule":"Subtract the intercept before dividing by the slope.","steps":["Set up the relationship: Subtract the intercept before dividing by the slope.","c=(0.5-0.1)/2=0.2 mmol/L."],"answer":"The concentration is 0.2 mmol/L.","mistake":"Dividing 0.5 directly by 2 ignores the baseline reading."}
    - {"title":"Count independent evidence sources","problem":"Three reports copy one balance reading. A fourth report uses a separately calibrated balance. How many measurement sources are there?","rule":"Reports are not independent measurements when they copy a common source.","steps":["source group 1 = the first balance and its three copies. Count that measurement once.","source group 2 = the second balance. It adds a separate measurement route."],"answer":"There are two measurement sources, not four.","mistake":"Agreement among copies cannot establish independent confirmation."}

  stops:
  # --- Stop 17: Concentrated is not necessarily more
  #     Concept: concentration versus amount; Keystone: concentration is not amount; Area: Water Plant; Learning role: INTRODUCE; Difficulty: L1; Story role: character.
  #     placement: CHOICE, asked at Rosalind Achebe beside water-report.
  - group: SOIL
    at: water-report
    title: "Concentrated is not necessarily more"
    person: cho
    concept: 6   # concentration versus amount
    reason: "The water investigation presents bottles of different volumes and concentrations."
    scene: "Before treating the alarm as water loss, compare sample volume and concentration to determine which container actually holds more chloride."
    motivation: "Comparing total solute prevents a concentrated small sample from being mistaken for the larger contaminant inventory."
    format: CHOICE
    question: "Which bottle contains more moles of chloride?"
    choices:
    - "Bottle B: 1.5 mol versus Bottle A's 1.0 mol"
    - "Bottle A because 2.0 M is larger."
    - "They contain the same amount because both contain chloride."
    - "Cannot know without molar mass."
    answer: "Bottle B: 1.5 mol versus Bottle A's 1.0 mol"
    answerText: "Bottle B contains more total chloride even though its concentration is lower."
    why: "Amount equals concentration times volume. A contains (2.0 mol/L)(0.50 L)=1.0 mol; B contains (0.30)(5.0)=1.5 mol. Molar mass is needed for mass, not for moles when molarity and volume are already given."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2) The larger molarity in Bottle A does not overcome its much smaller volume; concentration alone is not total amount. (3) Two bottles containing the same solute need not contain the same number of moles. (4) Molarity times volume already gives moles, so molar mass is not needed for this comparison.
    # correct result: Bottle B.
    # state/output: Clear misleading alarm label; unlock report calculation.

  # --- Stop 18: Put the water sample on a molar scale
  #     Concept: molarity; Keystone: concentration is not amount; Area: Water Plant; Learning role: PRACTICE; Difficulty: L2; Story role: clue.
  #     placement: BALLPARK, at water-assay-desk.
  - group: SOIL
    at: water-assay-desk
    title: "Put the water sample on a molar scale"
    concept: 6   # molarity
    reason: "The concentration-inventory distinction is settled and the recycle-water sample needs a molar concentration."
    scene: "The acid sample is ready for the concentration check. The volume label must be converted before the result can guide dosing."
    motivation: "Molarity supplies a comparable process measurement for checking the water alarm with an independent instrument."
    format: BALLPARK
    question: "Dissolve 0.365 g HCl to make 250.0 mL solution. With molar mass 36.46 g/mol, fill mass, molar mass and volume in litres in M=(mass/molar mass)/volume."
    # CONVERTED from the bible's `data` line, (0.365 g / 36.46 g mol^-1) / 0.2500 L,
    # and its "0.0400 M; tolerance ±3%" (3% of 0.0400 = 0.0012).
    estimate:
      question: "Estimate the HCl molarity if the model treats it as fully dissociated."
      relationship: "molarity = grams ÷ molar mass ÷ litres of solution"
      labels:
      - "0.365 g HCl"
      - "36.46 g/mol HCl"
      - "0.2500 L"
      values: [0.365, 36.46, 0.2500]
      slots: 3
      template: '{0} ÷ {1} ÷ {2}'
      formula: a/b/c
      correct: [0, 1, 2]
      target: 0.0400
      tolerance: 0.0012
      units: M
    answerText: "The sample concentration is 0.0400 M HCl."
    why: "Convert grams to moles, milliliters to liters, then divide moles by solution volume. The calculation describes the modeled acid concentration; later pH reasoning can use strong-acid dissociation."
    # wrong-path feedback, one rebuttal per wrong option:
    #   0.000040 usually keeps milliliters as liters; 1.46 divides mass by volume without molar mass.
    # data: (0.365 g / 36.46 g mol^-1) / 0.2500 L.
    # correct result: 0.0400 M; tolerance ±3%.
    # state/output: Set recycle_acid_model = 0.0400.

  # --- Stop 19: Choose the measurement wavelength
  #     Concept: Beer-Lambert/spectroscopy; Keystone: solutions and spectroscopy; Area: Water Plant; Learning role: INTRODUCE; Difficulty: L3; Story role: clue.
  #     placement: SWEEP, operated at spectrophotometer.
  - group: SOIL
    at: spectrophotometer
    title: "Choose the measurement wavelength"
    concept: 6   # Beer-Lambert/spectroscopy
    reason: "The sample concentration is ready, but the optical instrument needs a suitable measurement wavelength."
    scene: "Choose the wavelength where the colored complex responds most strongly so an independent sample can confirm or reject the alarm."
    motivation: "The selected absorption region provides sensitivity without saturating the detector used for the water check."
    format: SWEEP
    question: "Sweep wavelength and select the operating wavelength with the greatest useful sensitivity."
    # CONVERTED from the payload below. `control` -> `axis`, `response_label` ->
    # `readout`, `standard_curve` -> the authored response points, and
    # `correct_setting` -> the target and its tolerance. `start` is the low end of
    # the bible's own range, which is not its answer.
    sweep:
      mode: peak
      axis: { label: "Wavelength", unit: nm, min: 400, max: 650, step: 10 }
      readout: { label: "absorbance" }
      response:
      - { at: 400, value: 0.08 }
      - { at: 440, value: 0.19 }
      - { at: 470, value: 0.48 }
      - { at: 490, value: 0.70 }
      - { at: 510, value: 0.82 }
      - { at: 530, value: 0.68 }
      - { at: 560, value: 0.40 }
      - { at: 620, value: 0.13 }
      - { at: 650, value: 0.06 }
      target: 510
      tolerance: 10
      start: 400
      commit: "Set the operating wavelength"
    answerText: "Use about 510 nm, where the standard has its strongest unsaturated response."
    why: "Beer-Lambert response changes most strongly with concentration where the absorbing species has high absorbance, provided the detector is not saturated. Measuring at a weak wavelength compresses differences and hides a small calibration error."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Choosing the lowest absorbance maximizes headroom but sacrifices sensitivity. Choosing a wavelength without running the standard leaves the instrument unqualified.
    # correct result: Select about 510 nm.
    # state/output: Unknown reports normal chloride when read against the sealed standard, contradicting the wall meter.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   sweep:
    #     control: {id: wavelength, label: "Wavelength", min: 400, max: 650, step: 10, unit: nm}
    #     response_label: absorbance
    #     standard_curve: [[400,0.08],[440,0.19],[470,0.48],[490,0.70],[510,0.82],[530,0.68],[560,0.40],[620,0.13],[650,0.06]]
    #     saturation_limit: 1.20
    #     required_action: "Run sealed standard before unknown."
    #     correct_setting: {value: 510, unit: nm, tolerance: 10}
    #     correct_reason: "Maximum useful unsaturated sensitivity."

  # --- Stop 20: Trace the agreement
  #     Concept: evidence dependency; Keystone: evidence must be independent; Area: Plant Control; Learning role: INTRODUCE; Difficulty: L4; Story role: reveal.
  #     placement: TRACE, operated at rover-sampler.
  - group: GIBBS
    at: rover-sampler
    title: "Trace the agreement"
    concept: 6   # evidence dependency
    reason: "Several alarm channels agree, and their calibration sources must be traced before counting them as separate evidence."
    scene: "The dependency map will show how many separate measurements really exist."
    motivation: "The dependency map establishes whether the alarm has independent confirmation or repeats one shared standard."
    format: TRACE
    question: "Open every dependency and identify whether the three alarming channels are independent."
    # CONVERTED from the payload below. `shared_resources` -> `resources`,
    # `depends_on` -> `depends`, and `truth.independent_channels` -> `independent`.
    # The engine's `depends` names resources, so a channel the bible routes through
    # another channel is declared against the standard both of them inherit; the
    # bible's `independent_volume` is dropped because it names no resource the
    # board declares.
    trace:
      resources:
      - { id: standard_c, label: "Plant Standard C" }
      - { id: standard_a, label: "Sealed Standard A" }
      target: standard_c
      channels:
      - { id: wall_chloride, label: "Wall chloride meter", reading: "HIGH", depends: [standard_c] }
      - { id: recycle_estimator, label: "Recycle estimator", reading: "LOW RETURN", depends: [standard_c] }
      - { id: control_correction, label: "Control-room water correction", reading: "ALARM", depends: [standard_c] }
      - { id: portable_spec, label: "Portable spectrophotometer", reading: "NORMAL", depends: [standard_a] }
      - { id: field_sample, label: "Ice Cut field sample", reading: "NORMAL", depends: [standard_a] }
      independent: [portable_spec, field_sample]
      commit: "Name the shared source"
    answerText: "The three alarming channels share Standard C; the portable field path is independent."
    why: "Agreement strengthens a conclusion only when evidence can fail separately. Here one biased standard propagates through three displays. The distant trip matters because a new sample and independent standard break the dependency chain."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Counting displays is not counting evidence. A derived estimator cannot independently confirm its own input.
    # correct result: The three alarming channels are not independent; all inherit Plant Standard C. The portable/field path is independent and does not reproduce the alarm.
    # state/output: Set evidence_flags.shared_calibration = true; unlock calibration-stream replacement; update water_reserve upward by 4 apparent units but leave real deficit unresolved.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   trace:

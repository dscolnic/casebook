    why: "(6.60 x 10^6 g / 44.01 g mol^-1)(16.04 g mol^-1) = 2.405 x 10^6 g = 2405 kg CH4. Rounded to three significant figures this is 2.41 x 10^3 kg. CO2 is sufficient for the 2000 kg requirement."

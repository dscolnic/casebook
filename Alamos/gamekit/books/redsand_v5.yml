- title: "Power"
  card:
    header: "MISSION 13 - 3 WORK SHIFTS REMAIN BEFORE LAUNCH."
    title: "POWER"
    goNow: "Go to the Solar Array and meet Yusuf Demir, the power and life-support officer, at the live power board."
    body: "3 work shifts remain before launch. The habitat breaker tags sit beside a climbing tank gauge. Today you decide how much power the fuel cells may use."
    objective: "Turn the available electricity into launch gases while protecting every critical system."
  objective: "Turn the available electricity into launch gases while protecting every critical system."
  stake: "3 work shifts remain before launch. The habitat breaker tags sit beside a climbing tank gauge. Today you decide how much power the fuel cells may use."
  takeaway: "A power allocation is scientific when every funded load protects a named consequence."
  segue: "But Achebe carries a fresh Batch C vial toward the lab; full tanks have not yet earned the word ready."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Electron", def: "a particle with negative electric charge found in atoms. Electron arrangement helps determine how atoms join and whether a particle has a net charge."}
  - {name: "Electrode", def: "a solid part where electrons enter or leave a chemical system. The water cell has a cathode and an anode."}
  - {name: "Cathode", def: "the electrode where reduction occurs. The powered cell sends electrons to this electrode."}
  - {name: "Anode", def: "the electrode where oxidation occurs. Electrons leave this electrode through the outside circuit."}
  equations:
  - {"e":"Q = It","c":"finding the total electric charge delivered during a timed run","v":[["Q","charge in coulombs"],["I","current in amperes"],["t","time in seconds"]],"s":"The dust-limited array gives the crew current and time, but the recovery plan needs a predicted amount of hydrogen and oxygen."}
  - {"e":"Faraday's law calculation, moles of electrons = Q / F","c":"converting electric charge into chemical amount","v":[["Q","charge in coulombs"],["F","96,485 coulombs per mole of electrons"]],"s":"Electron amount is the bridge between the power board and the number of gas molecules the plant can make."}
  - {"e":"actual product = theoretical product x current efficiency","c":"correcting ideal gas production for practical electrical losses","v":[["actual","product is the usable amount made"],["theoretical","product follows electron stoichiometry"],["current","efficiency is written as a decimal fraction"]],"s":"The launch plan must budget for the cell the crew actually has rather than a perfect 100-percent cell."}
  primer:
  - "Reduction occurs at the cathode and oxidation occurs at the anode in both driven and spontaneous cells."
  - "Electrons travel through the outside circuit; ions move through the liquid to keep charge balanced."
  - "Producing more gas is not a valid plan if cooling, purification, refrigeration, or habitat power falls below its required minimum."


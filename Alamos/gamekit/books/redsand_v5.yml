          label: visible inflow
          value: 72
        - id: visible_b
          label: visible outflow
          value: -41
        - id: visible_c
          label: recorded storage change
          value: 24
        - id: hidden_loss
          label: unlogged removal
          value: 45
          hidden: true
      tolerance: 0.5


  #     placement: CHOICE, asked at Ingrid Sundqvist beside rate-board.
  - group: KINET
    at: rate-board
    title: "Read the initial-rate table"
    person: sundqvist
    concept: 9   # experimental rate laws
    reason: "The thermal review is complete and the rate data can now test the effect of diluted hydrogen."
    scene: "The exponents will predict why hydrogen dilution damages output so strongly."
    motivation: "The reaction orders show how strongly output responds to each feed concentration."
    format: CHOICE
    question: "Which rate law fits?"
    choices:
    - "rate = k\\[CO2\\]\\[H2\\]^2"
    - "rate = k\\[CO2\\]^2\\[H2\\]"
    - "rate = k\\[CO2\\]\\[H2\\]"
    - "rate = k\\[CO2\\]^2\\[H2\\]^4"
    answer: "rate = k\\[CO2\\]\\[H2\\]^2"
    answerText: "The rate law is rate = k[CO2][H2]^2."
    why: "Doubling CO2 at fixed H2 doubles rate, so exponent 1. Doubling H2 at fixed CO2 quadruples rate, so exponent 2. Overall order is 3."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2) Doubling CO2 at fixed H2 doubles the rate, so CO2 is first order rather than second order. (3) Doubling H2 at fixed CO2 quadruples the rate, so H2 is second order rather than first order. (4) Copying balanced-equation coefficients into a rate law overpredicts both concentration effects; reaction orders come from the trials.
    # correct result: First order in CO2 and second order in H2.
    # state/output: Rate-law card added to case file.

  # --- Stop 30: Calculate k
  #     Concept: rate constant/units; Keystone: kinetics and rate law; Area: Catalyst Bay; Learning role: PRACTICE; Difficulty: L2; Story role: clue.
  #     placement: BALLPARK, at rate-board.
  - group: KINET
    at: rate-board
    title: "Calculate k"
    concept: 9   # rate constant/units
    reason: "The reaction orders are identified and the temperature intervention needs a quantitative rate baseline."
    scene: "The rate measurements have fixed the reaction orders. The operator now needs the constant that makes the model predict this run."
    motivation: "The rate constant makes the later temperature test comparable with the measured initial-rate trials."
    format: BALLPARK
    question: "The rate law is rate=k[A][B]². Measured rate is 1.20×10⁻³ M/s at [A]=0.10 M and [B]=0.20 M. Fill rate,[A],[B] in k=rate/([A][B]²)."
    # CONVERTED from the bible's `data` line, k = 1.20e-3 / [(0.10)(0.20)^2], and
    # its "0.300 M^-2 s^-1; tolerance +/-2%" (2% of 0.300 = 0.006).
    estimate:
      question: "Use Trial 1 and rate = k[CO2][H2]^2 to find k."
      relationship: "k = rate ÷ ([CO2] × [H2]²)"
      labels:
      - "1.20×10⁻³ M/s"
      - "0.10 M CO2"
      - "0.20 M H2"
      values: [1.20e-3, 0.10, 0.20]
      slots: 3
      template: '{0} ÷ ({1} × {2}²)'
      formula: a/(b*c*c)
      correct: [0, 1, 2]
      target: 0.300
      tolerance: 0.006
      units: "M^-2 s^-1"
    answerText: "The rate constant is 0.300 M^-2 s^-1."
    why: "The concentration product is 0.0040 M^3, so k = (1.20e-3 M/s)/(0.0040 M^3) = 0.300 M^-2 s^-1. Substituting another trial should reproduce the same k at the same temperature."
    # wrong-path feedback, one rebuttal per wrong option:
    #   A unit of s^-1 belongs to a first-order law, not this one.
    # data: k = 1.20e-3 / \[(0.10)(0.20)^2\].
    # correct result: 0.300 M^-2 s^-1; tolerance +/-2%.
    # state/output: Predicts the rate drop expected from reduced temperature for Stop 31.

  # --- Stop 31: Establish causation by reversal
  #     Concept: temperature and rate; Keystone: kinetics and rate law; Area: Catalyst Bay; Learning role: APPLY; Difficulty: L3; Story role: character.
  #     placement: CONTROL, operated at skid.
  - group: KINET
    at: skid
    title: "Establish causation by reversal"
    concept: 9   # temperature and rate
    reason: "The rate baseline is fixed and the suspected temperature effect is ready for a controlled intervention."
    scene: "Hold feed, pressure, and flow fixed and reverse only temperature to prove whether Herrera's change caused the slowdown."
    motivation: "A reversible rate response isolates temperature as a cause rather than relying on coincident changes."
    format: CONTROL
    question: "Which controlled change demonstrates that the override caused the immediate rate loss, and does the response reverse?"
    # MODEL CONVERSION. The bible lists five plant variables, three of them
    # candidates, and a rate index that falls 100 -> 72 and returns. The engine's
    # CONTROL board offers the candidates, holds the rest, and grades the named
    # cause: `response` is the signed change in the reading (72 - 100), `noise` is
    # the bible's noise band, and `truth` its `correct`.
    control:
      observable: { label: "Rate index" }
      variables:
      - { id: temperature_K, label: "Reactor temperature" }
      - { id: h2_M, label: "H2 concentration" }
      - { id: pressure_bar, label: "Pressure" }
      held: ["CO2 concentration", "Flow"]
      truth: temperature_K
      baseline: 100
      response: -28
      noise: 2
      run: "Run the measurement"
      commit: "Name the cause"
    answerText: "Lower only temperature, observe the rate fall, then restore temperature and observe the rate return."
    why: "Reversal makes drift less plausible. The result proves the lower set point reduced reaction rate. It does not prove whether lowering it was unnecessary, because the short test does not recreate the developing thermal condition."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Changing flow or concentration confounds the intended causal question. A one-way change without restoration cannot separate intervention from drift.
    # correct result: Lower temperature alone, observe rate fall, restore temperature, observe rate return.
    # state/output: Set evidence_flags.override_caused_rate_drop = true.

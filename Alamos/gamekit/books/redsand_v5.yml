      - {key: "D", text: "States the measurement condition that causes an action. One clear rule prevents the operator from moving the acceptance line after seeing an inconvenient sample.", why: "This describes trigger rule. It does not answer the question about purity."}

  # The five worked examples the mission card offers behind a button.

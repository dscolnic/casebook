        load: "Still normal immediately before the purge tie-in"
      - id: reactor_branch
        label: "Reactor branch"
        reading: "19.5 atm; 68% H2; 31% N2; 1% other; H2 partial pressure 13.3 atm"
        expected: "Hydrogen should remain near the regulator composition; a simple pressure drop should not create a 31% N2 fraction"
        load: "First major composition break; nitrogen replaces hydrogen while total pressure stays nearly normal"
    answerText: "The reactor branch first fails; hydrogen partial pressure there is about 13.3 atm."
    why: "Total pressure is the sum of component pressures. The branch gauge stays high because nitrogen contributes pressure. The desired H2 partial pressure has fallen even though the needle barely moves. Sampling every station localizes the change between regulator outlet and reactor branch."

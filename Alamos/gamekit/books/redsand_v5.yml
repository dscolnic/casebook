      "Batch C reprocessing": 35
      "Timed electrolysis": 15
      "Validated 550 K / 12 bar operation": 10
      "Independent final verification": 25
      "Habitat and safety margin": 15
      "Production above validated point": 0
      "Cosmetic dashboard recalibration": 0
    question: "Allocate exactly 100 points. Minimums: reprocessing 25, electrolysis 15, validated operation 10, independent assay 15 and safety 10. Reprocessing plus assay must total at least 60. Assign zero to unvalidated heating and cosmetic recalibration. Submit the allocation; the board checks the total and each requirement."
    answerText: "The accepted plan funds every required capability within the stated limits; extra points may be distributed only as the public rule allows."
    why: "The grade rewards investments that can alter the decision or protect a binding constraint. Spending everything on production solves the old problem and recreates the new one."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Overfunding raw production while underfunding reprocessing or final assay cannot make off-spec methane flight-ready. Spending points on cosmetic recalibration changes a display rather than the batch, and cutting safety or electrolysis breaks a binding link in the recovery chain.
    # correct result: 35 reprocessing, 25 independent verification, 15 electrolysis, 10 validated reactor, and 15 safety/habitat; total 100. Accept variants with at least 60 points across reprocessing + verification and no points to cosmetic recalibration, provided safety gets at least 10.
    # state/output: Execute the plan through persistent equipment and world-state updates; Batch C returns to Tank Farm.

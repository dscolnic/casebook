    on: { enter: true, at: CUT }
    world: "An 80 kmol gap sits in the water-return column."
    panel: "MISSION 12 - THE LOOP"
    # unlocks: Stop 45 at the Ice Cut loop board.
    bubbles:
    - who: cho   # Cho
      say: "Ice becomes water, water becomes hydrogen, hydrogen becomes methane, and the reactor makes water again. Follow every transfer until the loop closes."
  - id: after-stop-45
    # After Stop 45 | Ice Cut chain board | automatic response
    on: { after: [1] }
    world: "At process-map, the dated accepted-result slip for Stop 45 reads: \"Correct order; electrolysis is the driven link.\". The slip remains in that fixture's evidence holder."
    panel: "MOVE TO WATER PLANT."
    # unlocks: The Water Plant waypoint and Stop 46; Stop 47 unlocks immediately after Stop 46.
    bubbles:
    - who: demir   # Demir
      say: "Nice work. The water can cycle. The energy cannot. First make sure the water reaching electrolysis is fit to use."
  - id: after-stops-46-and-47
    # After Stops 46 and 47 | Water Plant | automatic treatment verification
    on: { after: [2, 3] }
    world: "At columns, the dated accepted-result slip for Stop 46 reads: \"Map suspended regolith to the particle filter, dissolved ions to ion exchange, excess acid to measured base neutralization, and useful dissolved CO2 to retention.\". The slip remains in that fixture's evidence holder."
    panel: "NEXT TASK - STOP 48: CLOSE HYDROGEN OVER THE WHOLE PLANT"
    # unlocks: The Electrolysis Hall waypoint and Stop 48.
    bubbles:
    - who: achebe   # Achebe
      say: "Good thinking. The treated stream now meets the electrolyzer limit. Release it and compare the amount that arrives with the amount the reactor returned."
  - id: after-stop-48
    # After Stop 48 | Electrolysis Hall | automatic deeper reveal
    on: { after: [4] }
    world: "At brinetank, the dated accepted-result slip for Stop 47 reads: \"initial H+ 0.00100 mol; OH- 0.000900 mol; excess H+ 0.000100 mol; total volume 0.1900 L; \\[H+\\]=5.26e-4 M; pH=3.28. Measured pH 3.30.\". The slip remains in that fixture's evidence holder."
    panel: "HYDROGEN DID NOT DISAPPEAR / RECYCLE WATER FAILED TO RETURN ON TIME."
    # unlocks: The Mission 12 outcome beat.
    bubbles:
    - who: cho   # Cho
      say: "Exactly right. Our separator sent too much water away from the return path. The next shift began without the feed it was counting on."
  - id: at-mission-end
    # At mission end | Electrolysis Hall | automatic outcome and hook
    on: { missionEnd: true }
    world: "At stack-accounting-panel, Yusuf Demir clips the WATER RETURN: 80 KMOL RECOVERED entry into the stack ledger. The dated prop remains here on later visits."
    panel: "NEXT ROUTE - SOLAR ARRAY -\\> BATTERY GALLERY -\\> ELECTROLYSIS HALL."
    # unlocks: Mission 13 briefing and the Solar Array waypoint.
    bubbles:
    - who: demir   # Yusuf Demir
      say: "The water came back. Now we have to pay to split it. But Abiola's final production shift shares power with heat and air; Demir must protect those loads before startup."


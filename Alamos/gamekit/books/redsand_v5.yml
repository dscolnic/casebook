    #       - {id: water_removal, label: "Remove product water", baseline: 0, test: 1, unit: state}
    #       - {id: inert_n2, label: "Add inert N2 at fixed volume", baseline: 0, test: 1, unit: state}
    #       - {id: pressure_bar, label: "Compress mixture", baseline: 8, test: 12, unit: bar}
    #     candidates: [water_removal, inert_n2, pressure_bar]
    #     response: {label: "Methane conversion", baseline: 60, water_removal: 68, inert_n2: 60, pressure_bar: 65, after_restore: 60, unit: percent, noise_band: 1}
    #     fixed: {temperature_K: 550, feed_composition: unchanged}
    #     required_sequence: [change_water_removal_only, measure, restore, measure_again]
    #     correct: water_removal

  # --- Stop 44: Two plans look equally fast
  #     Concept: kinetics vs equilibrium; Keystone: gas pressure, kinetics, equilibrium, and energy; Area: Reactor Hall; Learning role: RETRIEVE; Difficulty: L4; Story role: decision.
  #     placement: DEGENERACY, at operating-point-board.
  - group: EQUIL
    at: operating-point-board
    title: "Two plans look equally fast"
    concept: 12   # kinetics vs equilibrium
    reason: "Two plans appear equally fast, but neither can be approved on reaction rate alone."
    scene: "Combine rate, equilibrium, pressure, and heat limits to choose between two plans that initially appear equally fast."
    motivation: "The combined rate, equilibrium, and thermal checks identify which operating pair also preserves yield and safety margin."
    format: DEGENERACY
    # CONVERTED from the payload below. `first_locus` -> `locus` and its label ->
    # the observable both plans match on; `second_locus` -> `second`;
    # `truth_pair` -> `truth`; the bible's single `tolerance: 2` is carried on both
    # controls, and its `physics` line is the second measurement's hint.
    degeneracy:
      controls:
      - { id: temperature_K, label: "Temperature", min: 545, max: 575, step: 5, unit: K }
      - { id: pressure_bar, label: "Pressure", min: 8, max: 13, step: 1, unit: bar }
      observable: { label: "Equal immediate rate index" }
      locus:
      - { a: 575, b: 8 }
      - { a: 570, b: 9 }
      - { a: 565, b: 10 }
      - { a: 558, b: 11 }
      - { a: 550, b: 12 }
      second:
        label: "Equilibrium methane fraction >=70% and inlet peak <600 K"
        apply: "Apply the second measurement"
        locus:
        - { a: 550, b: 12 }
        - { a: 550, b: 13 }
        - { a: 545, b: 13 }
      truth: { a: 550, b: 12 }
      tolerance: { a: 2, b: 2 }
      hint: "Exothermic equilibrium, gas-mole compression, and thermal margin"
      commit: "Report the operating point"
    question: "Add the physical constraints that separate the equal-rate plans."
    answerText: "Use 550 K and 12 bar with water removal; it alone meets rate, equilibrium-yield, and heat limits."
    why: "Equal immediate rates do not imply equal final composition or safety. The extra physics collapses the degeneracy."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Choosing the hotter equal-rate plan uses speed as the only criterion and ignores its poorer exothermic equilibrium yield and smaller thermal margin. The extra constraints are what separate the plans.
    # correct result: Plan B survives: lower temperature improves exothermic equilibrium and thermal margin; higher pressure favors three product gas moles over five reactant gas moles. Plan A violates equilibrium fraction and approaches heat limit.
    # state/output: Set validated_operating_point = {T:550K,P:12bar}; visible plan board turns amber, not green, pending loop and power checks.

- title: "The Saboteur"
  card:
    header: "MISSION 10 - 6 WORK SHIFTS REMAIN BEFORE LAUNCH."
    title: "THE SABOTEUR"
    goNow: "Go to the Sabatier Reactor and meet Commander Laila Abiola, the mission commander, at the sealed model display."
    body: "6 work shifts remain before launch. The sealed old run waits beneath Ingrid's blame model. Today you decide whether the old setting was safe."
    objective: "Test the accusation against unseen evidence and reconstruct Herrera's reason for the override."
  objective: "Test the accusation against unseen evidence and reconstruct Herrera's reason for the override."
  stake: "6 work shifts remain before launch. The sealed old run waits beneath Ingrid's blame model. Today you decide whether the old setting was safe."
  takeaway: "A fair character reversal keeps the action true and changes its scientifically supported meaning."
  segue: "Therefore Ingrid and Herrera must build a safer yield plan together; the launch clock has not stopped for their argument."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Model", def: "a simplified explanation that makes testable predictions. A model is useful only where its predictions survive evidence it did not use for fitting."}
  - {name: "Residual", def: "the measured value minus the model's predicted value. A repeated pattern in residuals can reveal a missing cause even when average error is small."}
  - {name: "Sensor bias", def: "a measurement error that tends to shift readings in one direction. Stressing the allowed bias shows whether a safety decision is robust."}
  - {name: "Safety margin", def: "the distance between the operating condition and a dangerous boundary. A plan fails if allowed uncertainty can erase that distance."}
  primer:
  - "Freeze a model before revealing holdout data."
  - "Inspect where residuals occur, not only their overall size."
  - "A suspicious action can cause production loss and still prevent a larger danger."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-reactor-hall
    # On arrival at Reactor Hall | automatic | 
    on: { enter: true, at: EQUIL }
    world: "The sealed old run waits beneath Ingrid's blame model."
    panel: "MISSION 10 - THE SABOTEUR"
    # unlocks: Stop 37 at the holdout-model display; Stop 38 unlocks immediately after Stop 37.
    bubbles:
    - who: abiola   # Abiola
      say: "The accusation fits the records everyone saw. It must also predict the record nobody used to build it."
  - id: after-stops-37-and-38
    # After Stops 37 and 38 | model display | automatic reversal
    on: { after: [1, 2] }
    world: "At analyser, the dated accepted-result slip for Stop 37 reads: \"Freeze and choose model B after holdout; model A fails unseen safety behavior.\". The slip remains in that fixture's evidence holder."
    panel: "MODEL MISSES DANGER AT THE SAFETY BOUNDARY."
    # unlocks: Stop 39 at the uncertainty panel.
    bubbles:
    - who: achebe   # Achebe
      say: "Nice work. Its average error looked small because safe runs outnumbered dangerous ones. The failure is patterned exactly where it matters."
  - id: after-stop-39
    # After Stop 39 | uncertainty control | automatic safety decision
    on: { after: [3] }
    world: "At residual-field, the dated accepted-result slip for Stop 38 reads: \"Model B.\". The slip remains in that fixture's evidence holder."
    panel: "NEXT TASK - STOP 40: WHAT DID HERRERA KNOW, AND WHEN?"
    # unlocks: The Plant Control waypoint and Stop 40.
    bubbles:
    - who: abiola   # Abiola
      say: "Good thinking. The old point is not safe across the sensor's allowed error. It will not be restored."
  - id: after-stop-40
    # After Stop 40 | Plant Control chronology wall | automatic Twist 2
    on: { after: [4] }
    world: "At reactor-console, the dated accepted-result slip for Stop 39 reads: \"No. If the sensor reads 2% low, actual peak is about 624 K, already above limit; at -5% actual is about 644 K. The lower point remains below limit across the range.\". The slip remains in that fixture's evidence holder."

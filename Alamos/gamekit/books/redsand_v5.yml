  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Specification", def: "a measurable requirement a material must pass before use. A full tank can fail if its composition lies outside even one required limit."}
  - {name: "Purity", def: "the fraction of a sample made of the desired substance. High total mass does not guarantee high purity."}
  - {name: "Certification", def: "a documented decision that measured material meets every required specification. It must rely on evidence capable of testing the claimed property."}

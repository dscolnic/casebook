  # --- Stop 22: Does calibration uncertainty rescue the leak theory?
  #     Concept: uncertainty/robustness; Keystone: evidence must be independent; Area: Plant Control; Learning role: APPLY; Difficulty: L4; Story role: decision.
  #     placement: STRESS, asked at Commander Laila Abiola beside evidence-board.
  - group: GIBBS
    at: evidence-board
    title: "Does calibration uncertainty rescue the leak theory?"
    person: abiola
    concept: 7   # uncertainty/robustness
    reason: "The leak theory is weakened, but the conclusion still needs testing against calibration uncertainty."
    scene: "The carbon-intake calibration can be varied over the displayed uncertainty range. The panel compares each resulting carbon residual with the methane schedule shortfall and the separate hydrogen-delivery evidence."
    motivation: "The largest supported carbon residual determines whether a leak could account for the production shortfall."
    format: STRESS
    question: "Stress the carbon-intake calibration across its allowed range. Which diagnosis remains viable throughout?"
    answerText: "The hydrogen-delivery diagnosis survives the full allowed calibration range."
    why: "Robust conclusions survive reasonable error. The exact residual moves, but not enough to cross the decision boundary. Uncertainty should weaken claims in proportion to its size, not erase all evidence."

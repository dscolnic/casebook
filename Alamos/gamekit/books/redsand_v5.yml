# Split back out of books/redsand_v5.yml by tools/split-book.mjs; the book's text, verbatim.
# Lifted from ../fpl_gpt/Mars_AP_Chemistry_Campaign_Implementation_Bible_v10.5_Explicit_Build_Ownership.md by tools/v10extract.mjs. Every quoted string below is
# the bible's, verbatim; engine/dev/bibleParity.mjs holds it to that.
- title: "Fast Is Not the Same as More"
  card:
    header: "MISSION 11 - 5 WORK SHIFTS REMAIN BEFORE LAUNCH."
    title: "FAST IS NOT THE SAME AS MORE"
    goNow: "Go to the Sabatier Reactor and meet Dr. Tomás Herrera, the reactor and safety engineer, at the equilibrium board."
    body: "5 work shifts remain before launch. Two trials rise at the same early speed and end at different yields. Today you decide which safe setting makes more methane in the end."
    objective: "Choose reactor conditions that satisfy production speed, final methane yield, and thermal safety."
  objective: "Choose reactor conditions that satisfy production speed, final methane yield, and thermal safety."
  stake: "5 work shifts remain before launch. Two trials rise at the same early speed and end at different yields. Today you decide which safe setting makes more methane in the end."
  takeaway: "Kinetics sets speed; equilibrium sets the composition approached."
  segue: "But Demir's water return is short; better yield means little if the next shift cannot make hydrogen."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Equilibrium constant", def: "compares product and reactant concentrations at equilibrium for one temperature. Its value changes when temperature changes."}
  - {name: "Reaction quotient", def: "uses the same concentration form as the equilibrium constant but can be calculated before equilibrium. Comparing Q with K predicts the direction of net change."}
  - {name: "Initial-change-equilibrium (ICE) table", def: "organizes initial concentrations, their linked changes, and equilibrium concentrations. One reaction extent controls every change through the balanced coefficients."}
  - {name: "Equilibrium yield", def: "the product amount or fraction present after forward and reverse rates become equal. It is different from how quickly that state is reached."}
  equations:
  - {"e":"Kc = [CH4][H2O]^2 / ([CO2][H2]^4)","c":"comparing equilibrium products with reactants for the Sabatier reaction","v":[["brackets","equilibrium molar concentrations"],["each exponent","the coefficient from the balanced equation"]],"s":"The safer reactor setting must still reach enough final methane, not merely produce methane quickly at the start."}
  - {"e":"concentration at equilibrium = initial concentration + coefficient-linked change","c":"completing an ICE table with one reaction extent","v":[["initial concentration","the starting value; change is negative for consumed reactants and positive for formed products; coefficients set relative sizes"]],"s":"The plant needs a numerical methane ceiling at the safe temperature before committing pressure and water-removal power."}
  primer:
  - "Kinetics determines speed; equilibrium determines final composition."
  - "For an exothermic reaction, raising temperature can speed the approach while reducing the equilibrium methane yield."
  - "Removing a product or raising pressure can favor methane production without returning to the dangerous temperature."


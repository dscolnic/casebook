    - {"title":"Find excess strong acid","problem":"Mix 20 mL of 0.1 M HCl with 10 mL of 0.1 M NaOH. Assume additive volumes. Find excess H⁺ concentration.","rule":"Subtract reacting moles, then divide excess amount by total solution volume.","steps":["Set up the relationship: Subtract reacting moles, then divide excess amount by total solution volume.","n_excess=0.002-0.001=0.001 mol; [H⁺]=0.001/0.030=1/30 M."],"answer":"The excess acid concentration is approximately 0.033 M.","mistake":"Divide by the full 30 mL, not just the acid volume."}

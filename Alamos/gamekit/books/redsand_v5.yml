    format: CHOICE
    question: "Which Kc expression matches the gas-phase Sabatier equation?"
    choices:
    - "\\[CH4\\]\\[H2O\\]^2 / (\\[CO2\\]\\[H2\\]^4)"
    - "\\[CH4\\]\\[H2O\\] / (\\[CO2\\]\\[H2\\])"
    - "\\[CO2\\]\\[H2\\]^4 / (\\[CH4\\]\\[H2O\\]^2)"
    - "\\[CH4\\]^1\\[H2O\\]^2 - \\[CO2\\]^1\\[H2\\]^4"
    answer: "\\[CH4\\]\\[H2O\\]^2 / (\\[CO2\\]\\[H2\\]^4)"
    answerText: "Kc = [CH4][H2O]^2 / ([CO2][H2]^4)."
    why: "Coefficients become exponents; products are over reactants; equilibrium expressions multiply activities rather than subtracting concentrations."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2) The balanced coefficients become exponents, so H2O must be squared and H2 raised to the fourth power. (3) Products belong in the numerator and reactants in the denominator for the reaction as written. (4) An equilibrium expression multiplies concentration terms; it does not subtract the reactant product from the product product.
    # correct result: First choice.
    # state/output: Unlock ICE board.

  # --- Stop 42: Complete the ICE table
  #     Concept: ICE stoichiometry; Keystone: equilibrium and stoichiometry; Area: Reactor Hall; Learning role: PRACTICE; Difficulty: L3; Story role: clue.
  #     placement: BALANCE, at ice-board.
  - group: EQUIL
    at: ice-board
    title: "Complete the ICE table"
    concept: 12   # ICE stoichiometry
    reason: "The equilibrium relationship is selected and the safe-temperature mixture needs calculating."
    scene: "The equilibrium sample is ready. The crew checks the constant against the balanced reaction before predicting a shift."
    motivation: "The concentration table establishes the methane ceiling and remaining reactants for the proposed operating condition."
    format: BALLPARK
    question: "For CO₂+4H₂⇌CH₄+2H₂O, equilibrium concentrations are [CH₄]=0.5 M and [H₂O]=[CO₂]=[H₂]=1 M. Fill these four concentrations in Kc=[CH₄][H₂O]²/([CO₂][H₂]⁴)."
    answerText: "The equilibrium row is 1.00, 1.00, 0.50, and 1.00 M, giving Kc = 0.50."
    why: "Every change is tied to one reaction extent x and multiplied by coefficients. Hydrogen changes by -4x; water by +2x. The balanced row is the guardrail against treating each concentration independently."
    # wrong-path feedback, one rebuttal per wrong option:
    #   If H2 falls by 0.60, point to coefficient four. If water becomes 0.60, point to coefficient two.
    # correct result: Change -0.60 CO2, -2.40 H2, +0.60 CH4, +1.20 H2O; equilibrium 0.40, 1.60, 0.60, 1.20 M. Kc=(0.60)(1.20)^2/\[(0.40)(1.60)^4\] = 0.329 (about 0.33).
    # state/output: Model predicts that lowering product-water activity can drive more conversion.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   balance:

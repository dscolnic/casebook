# redsand.yml. Red Sand: the propellant plant at Arcadia Rise.
#
# AP Chemistry, taught through the back half of the course that The Contaminated
# City leaves alone: kinetics, equilibrium, electrochemistry, entropy and free
# energy, phase behaviour and intermolecular forces, and the solution chemistry
# of a brine nobody on Earth has to drink.
#
# The place is a propellant plant on Arcadia Planitia making methane and oxygen
# out of the atmosphere and the ground, against a transfer window that does not
# move. Format is tools/BOOK_TEMPLATE.md; import with
#
#   node tools/import-book.mjs books/redsand.yml redsand --verify

theme:
  id: redsand
  title: Red Sand
  subtitle: Propellant Lead · Arcadia Rise

# ---------------------------------------------------------------- the areas
# Six areas, chosen as the six units of the course this game exists to teach.
# The argument the campaign turns on runs between two of them: Catalyst Bay
# wants rate and Reactor Hall wants yield, and they are both right on a
# named sol.
groups:
- id: KINET
  code: KINET
  name: Catalyst Bay
  color: '#d19a2b'
  desc: How fast the reaction goes, what the catalyst does, and what stops it working.
  defaultLeader: sundqvist
  milestones:
  - Establish what the bed is doing now
  - Separate rate from yield
  - Find what is taking the activity away
  - Qualify a charge somebody else can trust
- id: EQUIL
  code: EQUIL
  name: Reactor Hall
  color: '#c05a33'
  desc: How much methane a pass can give, and what moves that limit.
  defaultLeader: herrera
  milestones:
  - State the balance the loop settles at
  - Move it on purpose rather than by accident
  - Close the carbon ledger across the loop
  - Certify a batch against the flight specification
- id: PHASE
  code: PHASE
  name: Cold End
  color: '#4a86b8'
  desc: Where a gas becomes a liquid, what holds it there, and what it costs.
  defaultLeader: cho
  milestones:
  - Establish what condenses where
  - Keep the water and the carbon dioxide out of the cold line
  - Account for every kilogram that boils off
  - Hand a loaded tank to the vehicle
- id: ELEC
  code: ELEC
  name: Electrolysis Hall
  color: '#3f9e8c'
  desc: Splitting water and carbon dioxide with electricity, and what the current buys.
  defaultLeader: achebe
  milestones:
  - Name the half-reactions at each electrode
  - Turn charge into kilograms
  - Find where the current goes when it makes nothing
  - Run the stack inside its thermal limit
- id: GIBBS
  code: GIBBS
  name: Plant Control
  color: '#8d6bb5'
  desc: Which way a reaction runs on its own, and what has to be paid for.
  defaultLeader: demir
  milestones:
  - Sort the driven steps from the spontaneous ones
  - Put an energy number on each of them
  - Close the sol's ledger against the array
  - Decide what the station stops doing
- id: SOIL
  code: SOIL
  name: Water Plant
  color: '#9a8352'
  desc: Getting water out of frozen ground, and the ions that come with it.
  defaultLeader: abiola
  milestones:
  - Get water out of the ground and keep it
  - Identify what is dissolved in it
  - Take out what the plant downstream cannot survive
  - Leave a rule the next crew can follow

# ------------------------------------------------------------------ the cast
# 13 people, at least 2 per area. Sundqvist and Herrera are the argument;
# everybody else has a position they will defend and a limit they admit to.
roster:
- id: abiola
  name: "Commander Laila Abiola"
  role: "mission authority"
  division: GIBBS
  bio: |
    She must bring the crew home while protecting the resources they need if launch is delayed.
    Several green dashboard channels can feel like independent confirmation.
- id: sundqvist
  name: "Ingrid Sundqvist"
  role: "production and catalyst lead"
  division: KINET
  bio: |
    Ingrid is responsible for recovering lost production before the launch window closes. Higher
    rate is her first remedy, even when yield or quality may be the actual limit.
- id: herrera
  name: "Tomás Herrera"
  role: "reactor and safety engineer"
  division: EQUIL
  bio: |
    Herrera is responsible for keeping the reactor inside a tested thermal envelope. He worries
    that others will act on an incomplete record before he can explain its limits.
- id: cho
  name: "Mei-Ling Cho"
  role: "water and cryogenics engineer"
  division: SOIL
  bio: |
    She is responsible for equipment that can be damaged by contaminants at low temperatures and
    wants sample custody taken seriously. An ideal separation model can overshadow maintenance
    history and shared calibration.
- id: achebe
  name: "Rosalind Achebe"
  role: "PHASE analytical and electrochemistry lead"
  division: PHASE
  bio: |
    Every extra assay uses scarce time, but a false-ready batch could waste the entire recovery
    effort. The wish for perfect evidence can make it difficult to name a sufficient stopping
    rule.
- id: demir
  name: "Yusuf Demir"
  role: "power and life-support officer"
  division: ELEC
  bio: |
    He must explain any plant power diversion to the crew relying on heat, air and water. He can
    see every additional production demand as a fixed loss before accounting for recovery and
    recycling.

glossary:
- name: Sabatier reaction
  aliases: [sabatier, the assembly reaction]
  def: Carbon dioxide and hydrogen combining over a catalyst to give methane and water. It gives out heat.
- name: Catalyst
  aliases: [catalytic, catalyse, catalyses, catalysed]
  def: A material that speeds a reaction up by offering an easier path, and is not used up doing it.
- name: Activation energy
  aliases: [activation barrier, energy barrier]
  def: The energy hill a reaction has to get over. A catalyst lowers it; heating helps more molecules clear it.
- name: Rate law
  aliases: [rate equation, order of reaction, reaction order]
  def: How the speed of a reaction depends on the amounts present. Found by experiment, not from the equation.
- name: Rate constant
  aliases: [rate coefficient]
  def: The number in a rate law that carries the temperature dependence. It rises steeply as the bed is heated.
- name: Residence time
  aliases: [contact time, space velocity]
  def: How long gas spends inside the catalyst bed. Volume of the bed divided by the flow through it.
- name: Poisoning
  aliases: [poisoned, poison, deactivation, deactivating]
  def: A substance in the feed binding to the catalyst's active sites and stopping them working.
- name: Feed
  aliases: [feed stream, reactor feed]
  def: The gas, liquid, or other material sent into a process.
- name: Sintering
  aliases: [sinter, sintered]
  def: Heat making the small metal particles of a catalyst merge into larger ones, so less surface is left to work on.
- name: Equilibrium
  aliases: [at equilibrium, equilibrium position]
  def: The state a reaction settles at, where the forward and reverse changes proceed at matching rates.
- name: Equilibrium constant
  aliases: [equilibrium constant K, the constant K, K]
  def: The fixed ratio of products to reactants a reaction settles at, at one temperature. Changing the temperature 
    changes it.
- name: Reaction quotient
  aliases: [reaction quotient Q, Q]
  def: The same ratio worked out from what is in the vessel right now. Comparing it with K says which way the reaction 
    will run.
- name: Le Châtelier's principle
  aliases: [le chatelier, le châtelier]
  def: Disturb a system at equilibrium and it shifts in the direction that partly undoes the disturbance.
- name: Partial pressure
  aliases: [partial pressures]
  def: The pressure one gas in a mixture would exert alone. The pressures of the parts add up to the total.
- name: Yield
  aliases: [conversion, per-pass yield, single-pass conversion]
  def: How much of what went in came out as the product you wanted, on one pass through the reactor.
- name: Recycle loop
  aliases: [recycle, recycled, recycling]
  def: Sending the unreacted gas back to the reactor inlet, so a poor conversion per pass can still give a good overall 
    one.
- name: Enthalpy change
  aliases: [enthalpy, heat of reaction, ΔH]
  def: The heat a reaction gives out or takes in at constant pressure. Negative means heat comes out.
- name: Entropy
  aliases: [entropy change, ΔS]
  def: A measure of how spread out the energy and the matter are. Making fewer gas molecules lowers it.
- name: Gibbs free energy
  aliases: [free energy, gibbs, ΔG]
  def: The combination of enthalpy and entropy that decides direction. Negative means the change can run on its own.
- name: Spontaneous
  aliases: [spontaneity, runs on its own]
  def: Able to proceed without being driven from outside. It says nothing about how fast.
- name: Electrolysis
  aliases: [electrolyse, electrolyser, electrolytic, electrolysed]
  def: Using an electric current to drive a reaction that would not run on its own, such as splitting water.
- name: Half-reaction
  aliases: [half reaction, half-reactions, half equations]
  def: One side of an electron transfer written on its own: what is oxidised at one electrode, what is reduced at the 
    other.
- name: Oxidation
  aliases: [oxidised, oxidise]
  def: Loss of electrons. It happens at the anode.
- name: Reduction
  aliases: [reduced, reduce]
  def: Gain of electrons. It happens at the cathode.
- name: Faraday's constant
  aliases: [faraday constant, faraday's law, faraday's laws]
  def: The charge carried by 1 mole of electrons, about 96,485 coulombs. It converts current and time into moles.
- name: Overpotential
  aliases: [overvoltage, excess voltage]
  def: The extra electrode driving voltage needed above the reversible potential because real reactions and current 
    paths have kinetic and resistive losses. It contributes to electrical inefficiency and heat; it is not the same 
    thing as the reaction's reversible free-energy voltage.
- name: Current efficiency
  aliases: [faradaic efficiency, coulombic efficiency]
  def: The fraction of charge passed that makes the intended product. Side reactions or leakage make the collected 
    amount smaller than Faraday's-law ceiling.
- name: Vapour pressure
  aliases: [vapor pressure, saturation pressure]
  def: The pressure of the gas standing above its own liquid. It rises steeply with temperature.
- name: Boiling point
  aliases: [condensation temperature, condenses at]
  def: "The temperature at which a liquid's vapour pressure matches the surrounding pressure. It is not one universal temperature:
    change the pressure and the boiling or condensation temperature changes."
- name: Intermolecular forces
  aliases: [intermolecular force, dispersion forces, london forces, hydrogen bonding]
  def: The attractions between whole molecules. Stronger attractions mean a higher boiling point.
- name: Deposition
  aliases: [deposit, deposits, freezing out, freeze out]
  def: A gas turning straight into a solid without passing through a liquid. Carbon dioxide does it readily.
- name: Triple point
  aliases: [triple-point]
  def: The one temperature and pressure at which solid, liquid and gas all sit together.
- name: Boil-off
  aliases: [boiloff, boil off]
  def: Cryogenic liquid lost as vapour when heat reaches the tank. The liquid stays at its boiling point and evaporates 
    instead of warming.
- name: Cryogenic
  aliases: [cryogen, cryogenics]
  def: Cold enough that ordinary gases are liquids. Methane and oxygen are stored that way.
- name: Perchlorate
  aliases: [perchlorates, perchlorate salt]
  def: An ion made of chlorine and oxygen. Its salts are common on Mars, dissolve easily, and can keep water liquid at
    much lower temperatures. It is not the same ion as chloride, so the plant tracks it on its own.
- name: Chloride
  aliases: [chloride ion, chlorides]
  def: A chlorine ion found in many salts. It is not perchlorate. The plant watches for it because chlorine-bearing
    material can reach the reactor and poison nickel.
- name: Sulphate
  aliases: [sulfate, sulphate ion]
  def: A dissolved ion of sulphur and oxygen. It comes out of solution as hard scale on a hot surface.
- name: Brine
  aliases: [brines, salt solution]
  def: Water with a great deal of salt dissolved in it. It stays liquid far below the freezing point of fresh water.
- name: Freezing point depression
  aliases: [depression of the freezing point, colligative]
  def: Dissolved particles lowering the temperature at which a solution freezes. How many particles matters, not which.
- name: Molality
  aliases: [molal, moles per kilogram]
  def: Moles of dissolved substance per kilogram of solvent. Used where temperature changes make volumes unreliable.
- name: Ion exchange
  aliases: [ion-exchange, polishing column, polishing bed]
  def: A packed bed that swaps unwanted ions out of water for harmless ones. It holds a fixed number and no more.
- name: Breakthrough
  aliases: [breaks through, broken through]
  def: The moment a packed bed is full, after which what goes in comes straight out again.
- name: Optical depth
  aliases: [opacity, dust opacity, tau]
  def: How much dust stands between the sun and the ground. Each unit cuts the direct beam by a further factor.
- name: Sol
  aliases: [sols]
  def: 1 Martian day, 24 hours 39 minutes: about 88,800 seconds.
- name: Mixture ratio
  aliases: [oxidiser-to-fuel ratio, o/f ratio]
  def: The mass of oxidiser burned per unit mass of fuel. It decides what fraction of the tank is oxygen.
- name: Specification
  aliases: [spec, flight specification]
  def: The written limits a batch has to meet before it may be loaded into the vehicle.
- name: Adsorber
  aliases: [adsorb, adsorbed]
  def: A trap whose surface catches molecules from a gas or liquid passing through it.
- name: Stoichiometric ratio
  aliases: [stoichiometric, stoichiometry]
  def: The exact amount of each reactant required by a balanced chemical equation.

# ---------------------------------------------------------------- the sols
# 15 critical working sols across the surface season. Sols 291-300 are the
# consecutive failure investigation; later checkpoints are sols 340, 420, 421,
# 445 and 475. The window opens on sol 486 and does not move. Each selected sol
# visits 3 different areas; the engine adds a callback from sol 3 onward.

beatRooms: [ARRAY, BATT, CUT, HSTORE, INTAKE, TANKS]

missions:
# 15 mission fragment(s), assembled by tools/assemble-book.mjs from
# redsand_v5/ — edit the fragments, not this file.
# ============================================================ MISSION 1
# Split back out of books/redsand_v5.yml by tools/split-book.mjs; the book's text, verbatim.
# Lifted from ../fpl_gpt/Mars_AP_Chemistry_Campaign_Implementation_Bible_v10.5_Explicit_Build_Ownership.md by tools/v10extract.mjs. Every quoted string below is
# the bible's, verbatim; engine/dev/bibleParity.mjs holds it to that.
- title: "The Shortfall"
  card:
    header: "MISSION 1 - 15 WORK SHIFTS REMAIN BEFORE LAUNCH."
    title: "THE SHORTFALL"
    goNow: "Go to Plant Control and meet Commander Laila Abiola, the mission commander, at the carbon ledger."
    body: "15 work shifts remain before launch. The fuel gauge glows above a tray of unused valve spanners. Today you decide whether a methane leak explains the missing fuel."
    objective: "Use the production records to decide whether a large methane leak can explain the fuel shortage."
  objective: "Use the production records to decide whether a large methane leak can explain the fuel shortage."
  stake: "15 work shifts remain before launch. The fuel gauge glows above a tray of unused valve spanners. Today you decide whether a methane leak explains the missing fuel."
  takeaway: "A nearly closed carbon ledger weakens a large methane-leak explanation; it does not identify the real cause."
  segue: "But Ingrid's next shift still lacks methane; the intake must prove it supplies enough carbon before another valve is blamed."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Particle", def: "one counted piece of matter. In this mission, a particle may be an atom, a molecule, or an ion."}
  - {name: "Atom", def: "the smallest ordinary piece of one kind of matter that keeps that identity. Counting atoms lets the plant check whether matter has disappeared."}
  - {name: "Ion", def: "an atom or group of atoms with an electrical charge. It is not the same thing as a neutral atom or molecule."}
  - {name: "Mole", def: "a fixed count of particles, the same count for every substance. One mole contains 6.022 x 10^23 particles; one kilomole contains one thousand moles."}
  equations:
  - {"e":"moles = grams / molar mass; particles = moles x 6.022 x 10^23","c":"turning a mass on a scale into a count of particles","v":[["grams","the measured mass"],["molar mass","the grams in one mole"],["6.022 x 10^23","Avogadro's number, the particles in one mole"]],"s":"The tank scale reports mass, but the reactor and atom ledger must count particles before the crew can decide whether fuel is missing."}
  - {"e":"unaccounted amount = amount entering - amount accounted for","c":"closing a material ledger","v":[["amount entering","the measured input"],["amount accounted for","the total in products, recycle, samples, and measured losses"]],"s":"The crew should hunt a leak only if the carbon entering the plant cannot be found in known streams."}
  primer:
  - "Matter can change form during a reaction, but atoms are not created or destroyed."
  - "A mass shortage is not automatically a leak; first ask whether the unit conversion and atom count close."
  - "Chemical formulas show how many atoms of each element are present in one particle."

  # The bible's beat script. `world` is its World state line, `panel` its
  # Panel/HUD text, `bubbles` its dialogue. `on:` and any `stage:` rows are
  # the implementation's: which trigger, and which board the change lands on.
  beats:
  - id: on-arrival-at-plant-control
    # On arrival at Plant Control | automatic | 
    on: { enter: true, at: GIBBS }
    world: "The fuel gauge glows above a tray of unused valve spanners."
    panel: "MISSION 1 - THE SHORTFALL"
    # unlocks: Stop 1 at the sample tray.
    bubbles:
    - who: abiola   # Abiola
      say: "Those valves stay open until we know whether matter is actually missing. We have fifteen shifts to make the fuel that gets us home. Start with the ledger."
  - id: after-stop-1
    # After Stop 1 | sample tray | automatic correct-answer response
    on: { after: [1] }
    world: "At sample-tray, the dated accepted-result slip for Stop 1 reads: \"Choice 1.\". The slip remains in that fixture's evidence holder."
    panel: "NEXT TASK - STOP 2: HOW MUCH METHANE IS MISSING?"
    # unlocks: Stop 2 at the conversion board; Stop 3 unlocks immediately after Stop 2.
    bubbles:
    - who: abiola   # Abiola
      say: "Nice work. If the software calls every object the same kind of particle, the count can be correct and the conclusion can still be wrong."
  - id: after-stops-2-and-3
    # After Stops 2 and 3 | conversion board | automatic transition
    on: { after: [2, 3] }
    world: "At conversion-board, the dated accepted-result slip for Stop 2 reads: \"6.01 x 10^28 CH4 molecules; target 6.0 x 10^28, tolerance ±6%.\". The slip remains in that fixture's evidence holder."
    panel: "MASS -\\> MOLES -\\> MOLECULES."
    # unlocks: Stop 4 at the carbon ledger.
    bubbles:
    - who: abiola   # Abiola
      say: "Good thinking. Now the tank scale and the reactor model are speaking the same language. Open the carbon ledger."
  - id: after-stop-4
    # After Stop 4 | carbon ledger | automatic discovery
    on: { after: [4] }
    world: "At conversion-board, the dated accepted-result slip for Stop 3 reads: \"As listed.\". The slip remains in that fixture's evidence holder."
    panel: "CARBON ACCOUNTED FOR: 99.8% / METHANE TARGET: NOT MET."
    # unlocks: The Mission 1 outcome beat.
    bubbles:
    - who: abiola   # Abiola
      say: "Exactly right. We are still short of methane. We may not be short of carbon."
  - id: at-mission-end
    # At mission end | Plant Control | automatic outcome and hook
    on: { missionEnd: true }
    world: "At ledger, Commander Laila Abiola clips the CARBON ACCOUNTED FOR: 99.8% sheet into the carbon ledger. The dated prop remains here on later visits."
    panel: "NEXT DESTINATION - ATMOSPHERE INTAKE."
    # unlocks: Mission 2 briefing and the Atmosphere Intake waypoint.
    bubbles:
    - who: abiola   # Commander Laila Abiola
      say: "Put the spanners down. Follow what entered the plant. But Ingrid's next shift still lacks methane; the intake must prove it supplies enough carbon before another valve is blamed."

  # The optional review, offered when the mission is finished and graded

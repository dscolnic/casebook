  #     placement: PROBE, operated at gas-sampling-ports.
  - group: EQUIL
    at: gas-sampling-ports
    title: "Sample the branches"
    concept: 4   # Dalton's law and composition
    reason: "The total inventory is established and samples from successive ports can locate the abnormal branch."
    scene: "Four sampling ports show gas pressure and composition along the hydrogen supply route. The readings include each port's hydrogen fraction, so equal gauge pressures need not mean equal usable hydrogen."
    motivation: "The composition and partial-pressure profile identifies where usable hydrogen first falls below the expected mixture."
    format: PROBE
    question: "Probe all four ports and name where the pattern breaks."
    # CONVERTED from the payload below — a rename only. The bible's four stations,
    # readings, `expected` lines and `load` notes are carried across unchanged.
    probe:
      chainLabel: "Sampling port"
      commit: "Name the first abnormal port"
      minReadings: 4
      target: reactor_branch
      stations:

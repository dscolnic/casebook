  # --- Stop 23: Close C, H, and O at the Tank Farm
  #     Concept: full atom ledger; Keystone: particles, moles, balancing, and stoichiometry; Area: Reactor Hall; Learning role: RETRIEVE; Difficulty: L4; Story role: payoff.
  #     placement: BALANCE, at farm-gauges.
  - group: EQUIL
    at: farm-gauges
    title: "Close C, H, and O at the Tank Farm"
    concept: 2   # full atom ledger
    reason: "The carbon result points away from a large leak, so hydrogen and oxygen need closing too."
    scene: "The reactor feed contains both reactants, but only one will run out first. The methane promise has to respect that limit."
    motivation: "The three element balances distinguish lost matter from matter retained in another chemical form or an insufficient feed."
    format: BALLPARK
    question: "CO₂+4H₂→CH₄+2H₂O. Feed is 100 mol CO₂ and 320 mol H₂. Identify the limiting reactant, then fill its mole amount and the H₂:CH₄ coefficient in the methane calculation."
    answerText: "All C, H, and O atoms close; 320 mol H2 limits production to 80 mol CH4."
    why: "The ledger explains low methane without lost matter. Carbon not converted remains CO2. Hydrogen appears in methane and water exactly as the equation requires."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Count atoms, not molecules; water contains two H and one O; remaining CO2 belongs in output inventory.
    # correct result: Inputs: C 100, H 640, O 200 mol atoms. Outputs: C 80+20=100; H 80x4 +160x2=640; O 20x2 +160=200. H2 is limiting because only 320 mol is supplied, supporting 80 mol CH4.
    # state/output: Tank composition display changes from "missing mass" to "unconverted CO2 / N2 dilution."
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   balance:
    #     target: {label: "Normalized reactor interval", reactions: {co2_mol: 100, h2_mol: 320}}
    #     streams:
    #       - {id: input_co2, label: "CO2 in", atoms: {C: 100, O: 200}, count: true}
    #       - {id: input_h2, label: "H2 in", atoms: {H: 640}, count: true}
    #       - {id: output_ch4, label: "CH4 out", molecules_mol: 80, atoms: {C: 80, H: 320}, count: true}
    #       - {id: output_h2o, label: "H2O out", molecules_mol: 160, atoms: {H: 320, O: 160}, count: true}
    #       - {id: output_co2, label: "CO2 unreacted", molecules_mol: 20, atoms: {C: 20, O: 40}, count: true}
    #       - {id: purge_n2, label: "N2 dilution gas", molecules_mol: 20, atoms: {N: 40}, count: false}
    #     closure: {C: [100,100], H: [640,640], O: [200,200], tolerance: 0}
    #     correct_action: "Count atoms in every input and output; identify H2 as limiting."
    estimate:
      prompt: divide hydrogen feed by the 4:1 stoichiometric coefficient
      question: maximum methane from the hydrogen supply
      labels:
        - 320 mol H2  (Hydrogen feed)
        - 4 mol H2 per mol CH4  (Hydrogen coefficient)
        - 100 mol CO2  (Carbon-dioxide feed)
      values:
        - 320
        - 4
        - 100
      slots: 2
      template: n_CH{0}={1}/4
      formula: n_CH4=320/4
      correct:
        - 1
        - 0
      target: 80
      tolerance: 1
      units: mol CH4
      explanation: Mixing a contextual reading into the arithmetic or reversing the subtraction.
    balance:

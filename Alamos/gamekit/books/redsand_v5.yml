  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Mission 15: worked examples"
    examples:
    - {"title":"Mass and amount","problem":"A sample contains 18 g of water. Use molar mass M=18 g/mol. Find amount n.","rule":"n=m/M.","steps":["Set up the relationship: n=m/M.","n=18/18=1 mol."],"answer":"The sample contains 1 mol of water molecules.","mistake":"Grams measure mass; moles measure amount."}
    - {"title":"Calculate percent yield","problem":"A reaction could produce 20 g of product but yields 16 g.","rule":"percent yield=actual yield/theoretical yield×100%.","steps":["Set up the relationship: percent yield=actual yield/theoretical yield×100%.","percent yield=16/20×100%=80%."],"answer":"The percent yield is 80%.","mistake":"Reversing the ratio gives an inappropriate value above 100% here."}
    - {"title":"Calculate sensible heat","problem":"Warm 100 g of a material by 10 °C. Its specific heat is 4 J/(g °C).","rule":"q=mcΔT.","steps":["Set up the relationship: q=mcΔT.","q=100(4)(10)=4000 J=4 kJ."],"answer":"The material absorbs 4 kJ.","mistake":"Use temperature change, not final temperature."}
    - {"title":"Use electrons per deposited ion","problem":"Copper deposition follows Cu²⁺+2e⁻→Cu. An electrolysis supplies 0.1 mol electrons with 100% current efficiency. Use M_Cu=64 g/mol.","rule":"n_Cu=n_e/2; m_Cu=n_Cu M_Cu.","steps":["Set up the relationship: n_Cu=n_e/2; m_Cu=n_Cu M_Cu.","n_Cu=0.1/2=0.05 mol; m_Cu=0.05(64)=3.2 g."],"answer":"The deposited copper mass is 3.2 g.","mistake":"Two moles of electrons deposit one mole of copper."}
    - {"title":"Calculate mass purity","problem":"A 20 g sample contains 18 g of the desired substance.","rule":"mass purity=desired mass/total mass×100%.","steps":["Set up the relationship: mass purity=desired mass/total mass×100%.","mass purity=18/20×100%=90%."],"answer":"The sample is 90% pure by mass.","mistake":"Do not divide by the impurity mass."}

  stops:
  # --- Stop 57: Buy one measurement that could change the decision
  #     Concept: value of information; Keystone: evidence must be independent; Area: Plant Control; Learning role: TRANSFER; Difficulty: L5; Story role: decision.
  #     placement: VALUE, asked at Commander Laila Abiola beside final-recovery-board.
  - group: GIBBS
    at: final-recovery-board
    title: "Buy one measurement that could change the decision"
    person: abiola
    concept: 15   # value of information
    reason: "The final decision still hinges on composition, not on another confirmation of pressure or mass."
    scene: "Batch C remains quarantined while pressure and mass are already measured precisely. The unresolved question is whether its composition meets the launch specifications."
    motivation: "The selected assay supplies the independent contaminant evidence that can change the batch's certification status."
    format: VALUE
    # CONVERTED from the payload below. `budget.value` -> `budget.amount`; each
    # option's `cost` and `axis` unchanged; the bible's one `required` option —
    # its `correct` — is the engine's `decisive`, the buy that can change the
    # decision, and its `decision_changed` line is what that buy reveals.
    value:
      budget: { amount: 10, unit: test_points }
      options:
      - { id: pressure, label: "Repeat total-pressure reading", cost: 6, axis: amount }
      - { id: mass, label: "Duplicate tank mass", cost: 7, axis: amount }
      - { id: assay, label: "Independent Batch C contaminant assay", cost: 10, axis: composition,
          decisive: true, reveals: "Confirms whether quarantine and reprocessing remain required." }
      - { id: catalyst_temp, label: "Repeat average catalyst temperature", cost: 5, axis: thermal }
      - { id: valve, label: "Visual valve inspection", cost: 4, axis: hardware }
      commit: "Commit the decision"
    question: "You have 10 test points. Cover every required outcome at the lowest total cost within the budget; keep all unused capacity in reserve. Select whole packages, then submit the plan; the board shows its total and remaining reserve for you to check."
    answerText: "Each funded package supplies a required outcome; an affordable package that leaves one unresolved is insufficient."
    why: "Pressure and mass are already precise and are not the disputed claim. Average temperature cannot certify tank contents. A second independent assay determines whether quarantine/reprocessing remains necessary and directly controls GO/NO-GO."
    # wrong-path feedback, one rebuttal per wrong option:

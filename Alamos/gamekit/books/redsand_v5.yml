  stops:
  # --- Stop 1: Labels on the sample tray
  #     Concept: particles; Keystone: particles, moles, and molar mass; Area: Plant Control; Learning role: INTRODUCE; Difficulty: L1; Story role: obstacle.
  #     placement: CHOICE, asked at Commander Laila Abiola beside sample-tray.
  - group: GIBBS
    at: sample-tray
    title: "Labels on the sample tray"
    person: abiola
    concept: 1   # particles
    reason: "The shortage investigation cannot compare samples until their chemical labels are interpreted consistently."
    scene: "Before the plant can compare its records, classify the four sample symbols so the ledger counts atoms, molecules, and ions correctly."
    motivation: "Distinguishing atoms, molecules, and ions prevents the first inventory from counting different kinds of particles as equivalent."
    format: CHOICE
    question: "Which classification is completely correct?"
    choices:
    - "Ar is an atom; CH4 and CO2 are molecules; H+ is an ion."
    - "All four are molecules because each symbol describes matter."
    - "Ar and H+ are atoms; CH4 and CO2 are ions."
    - "CO2 is an atom because it is one chemical formula."
    answer: "Ar is an atom; CH4 and CO2 are molecules; H+ is an ion."
    answerText: "Ar is an atom; CH4 and CO2 are molecules; H+ is an ion."
    why: "Ar is a single neutral atom. CH4 and CO2 contain bonded atoms and are neutral molecules. H+ has a positive charge, so it is an ion. \"Particle\" is the umbrella word; it does not erase these distinctions."
    # wrong-path feedback, one rebuttal per wrong option:
    #   (2) A formula can name an atom, molecule, or ion; the word formula does not decide. (3) H+ is charged, while CH4 and CO2 have no net charge. (4) One written formula can contain several atoms.
    # correct result: Choice 1.
    # state/output: Set evidence_flags.particle_labels = true; unlock the conversion board.

  # --- Stop 2: How much methane is missing?
  #     Concept: grams-moles-particles; Keystone: particles, moles, and molar mass; Area: Plant Control; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: BALLPARK, at conversion-board.
  - group: GIBBS
    at: conversion-board
    title: "How much methane is missing?"
    concept: 1   # grams-moles-particles
    reason: "The sample labels are checked, but the methane mass record still needs comparison with a particle count."
    scene: "The fuel shortfall must be expressed as molecules before the reaction ledger can use it."
    motivation: "The molecule total puts the methane inventory on the same counting basis as the production record."
    format: BALLPARK
    question: "Convert a 1,600 kg methane shortfall to molecules using molar mass 16.04 g/mol and Avogadro's constant 6.022×10²³ mol⁻¹. Fill mass in kilograms, molar mass and Avogadro's constant; the equation converts kg to g."
    # CONVERTED from the bible's `data` and `correct result` lines below. The four
    # tiles are the bible's four data numbers; the target and tolerance are its
    # "target 6.0 x 10^28, tolerance ±6%", said as a number (6% of 6.0e28 = 3.6e27).
    estimate:
      question: "Estimate the number of methane molecules represented by the shortfall."
      relationship: "molecules = mass in grams ÷ molar mass × Avogadro's number"
      labels:
      - "1.60×10³ kg"
      - "1000 g/kg"
      - "16.04 g/mol CH4"
      - "6.022×10²³ molecules/mol"
      values: [1600, 1000, 16.04, 6.022e23]
      slots: 4
      template: '{0} × {1} ÷ {2} × {3}'
      formula: a*b/c*d
      correct: [0, 1, 2, 3]
      target: 6.0e28
      tolerance: 3.6e27
      units: "CH4 molecules"
    answerText: "The shortfall represents about 6.01 x 10^28 methane molecules."
    why: "Kilograms must become grams before dividing by grams per mole. The result is about 9.98 x 10^4 mol, and each mole represents Avogadro's number of molecules. Multiplying mass directly by Avogadro's number skips molar mass and gives meaningless units."
    # wrong-path feedback, one rebuttal per wrong option:
    #   If near 6 x 10^25, the kilogram-to-gram factor was missed. If near 9.98 x 10^4, the player stopped at moles. If the player multiplies by 16.04, remind them that molar mass divides grams into mole-sized groups.
    # data: 1.60 x 10^3 kg; 1000 g/kg; 16.04 g/mol CH4; 6.022 x 10^23 molecules/mol.
    # correct result: 6.01 x 10^28 CH4 molecules; target 6.0 x 10^28, tolerance ±6%.
    # state/output: Update the wall display from kilograms to both kilograms and kilomoles; no inventory change.

  # --- Stop 3: Rebuild the conversion
  #     Concept: dimensional analysis; Keystone: particles, moles, and molar mass; Area: Plant Control; Learning role: PRACTICE; Difficulty: L2; Story role: clue.
  #     placement: SEQUENCE, at conversion-board.
  - group: GIBBS
    at: conversion-board
    title: "Rebuild the conversion"
    concept: 1   # dimensional analysis
    reason: "A deleted spreadsheet formula could have created the apparent shortage before any material was lost."
    scene: "Because a deleted formula could create a false shortage, rebuild the full mass-to-molecules conversion before trusting yesterday's estimate. A complete unit path will expose whether the estimate is artificial before repairs begin."
    motivation: "The complete mass-to-molecule conversion determines whether the earlier methane estimate has a valid unit path."
    format: SEQUENCE
    question: "Put the methane conversion workflow in order."
    # CONVERTED from the bible's `data` line below; `correct result: As listed`.
    cards:
    - "Read tank mass in kg"
    - "Convert kg to g"
    - "Divide by CH4 molar mass"
    - "Multiply by Avogadro's number"
    - "Report molecules with units"
    order: [0, 1, 2, 3, 4]
    answerText: "Use mass, convert to grams, divide by molar mass, multiply by Avogadro's number, and report particles."
    why: "Dimensional analysis is a path whose units cancel. Kilograms cannot cancel grams per mole until kilograms become grams. Dividing by molar mass leaves moles; multiplying by molecules per mole leaves molecules. The unit trail is also an error detector."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Highlight the first adjacent pair whose units cannot cancel. Do not reveal the full order until a second failed commit.
    # data: Read tank mass in kg / Convert kg to g / Divide by CH4 molar mass / Multiply by Avogadro's number / Report molecules with units.
    # correct result: As listed.
    # state/output: Set evidence_flags.conversion_rebuilt = true; carbon ledger becomes interactable.

  # --- Stop 4: Close the first carbon ledger
  #     Concept: atom conservation; Keystone: balancing and stoichiometry; Area: Plant Control; Learning role: INTRODUCE; Difficulty: L2; Story role: clue.
  #     placement: BALANCE, at ledger.
  - group: GIBBS
    at: ledger
    title: "Close the first carbon ledger"
    concept: 2   # atom conservation
    reason: "The conversion is checked and the carbon inputs must now be reconciled with the outputs."
    scene: "The ledger records 100.0 kmol of carbon entering the interval, with 81.6 kmol in methane, 17.9 kmol in recycled carbon dioxide, and 0.3 kmol in samples and measured vents. A separate row lists 160.0 kmol of water coproduct."
    motivation: "The unassigned carbon fraction tests whether a large methane leak is compatible with the material balance."
    format: BALANCE
    question: "Count the legitimate carbon streams and close the ledger."
    # CONVERTED from the payload below. `target` -> `total`; `count:` -> `countable:`;
    # `closure.tolerance` -> `tolerance`; `closure.residual` becomes the hidden
    # stream, which is what the engine's ledger is short by until it is found.
    balance:
      total: { amount: 100.0, unit: "kmol C", label: "Carbon entering interval" }
      tolerance: 0.1
      streams:
      - { id: methane_product, label: "Carbon in methane product", value: 81.6, unit: "kmol C" }
      - { id: recycle_co2, label: "Carbon in recycle CO2", value: 17.9, unit: "kmol C" }
      - { id: sample_and_vents, label: "Carbon in samples and measured vents", value: 0.3, unit: "kmol C" }
      - { id: water, label: "Water coproduct", value: 160.0, unit: "kmol H2O", countable: false }
      - { id: unassigned, label: "Carbon unassigned", value: 0.2, unit: "kmol C", hidden: true }
      commit: "Report the total carbon"
    answerText: "The ledger accounts for 99.8 kmol C and leaves only 0.2 kmol C unassigned."
    why: "One mole of CO2 and one mole of CH4 each contain one mole of carbon atoms. Add carbon streams as carbon, not total molecular mass. A 0.2% residual can be measurement uncertainty; it cannot explain an 18% methane schedule shortfall. This does not yet prove there is no leak, but it makes a large carbon leak a poor explanation."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Do not count water; it contains no carbon. Do not multiply CH4 by four; the subscript four counts hydrogen atoms. Do not treat the 18% schedule gap as a carbon stream.
    # data: total 100.0 kmol C; visible streams 81.6, 17.9, 0.3; hidden closure 0.2 kmol C; tolerance 0.1 kmol.
    # correct result: 99.8 kmol C is directly accounted for and only 0.2 kmol C (0.2%) is unassigned.
    # state/output: Set evidence_flags.carbon_nearly_closed = true; add Casebook card CARBON CLOSES; increase crew_trust by one.

  deeper:
    intro: "Try six independent practice questions. Each includes its own context and any needed data; no mission records are required."
    concepts:
    - {name: "Electric charge", def: "a property that can be positive or negative and makes particles attract or repel. An object with equal positive and negative charge is neutral."}
    - {name: "Electron", def: "a particle with negative electric charge found in atoms. Electron arrangement helps determine how atoms join and whether a particle has a net charge."}
    - {name: "Chemical bond", def: "a strong connection that holds atoms together inside a molecule. Breaking or making bonds changes how atoms are grouped but does not create or destroy the atoms."}
    - {name: "Chemical reaction", def: "rearranges atoms by breaking or making chemical bonds. The kinds and counts of atoms remain the same before and after the change."}
    - {name: "Molecule", def: "two or more atoms joined by chemical bonds. Methane and carbon dioxide are molecules, so one molecule contains several atoms."}
    - {name: "Molar mass", def: "the mass of one mole of a substance. It connects a mass on a scale to the number of particles in the plant."}

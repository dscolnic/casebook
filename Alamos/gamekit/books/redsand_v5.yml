    # unlocks: The Mission 10 outcome beat.
    bubbles:
    - who: herrera   # Herrera
      say: "Exactly right. I cut production because the inlet was running away."
    - who: abiola   # Abiola
      say: "You prevented a reactor failure. You also withheld an incomplete warning. Both facts stand."
  - id: at-mission-end
    # At mission end | Plant Control | automatic outcome and hook
    on: { missionEnd: true }
    world: "At analyser, Commander Laila Abiola pins the OVERRIDE PREVENTED RUNAWAY finding beside the revealed run. The dated prop remains here on later visits."
    panel: "NEXT ROUTE - REACTOR -\\> COLD END -\\> PLANT CONTROL."
    # unlocks: Mission 11 briefing and the Sabatier Reactor waypoint.
    bubbles:
    - who: abiola   # Commander Laila Abiola
      say: "You were right to lower it. You were wrong to leave us guessing. Therefore Ingrid and Herrera must build a safer yield plan together; the launch clock has not stopped for their argument."


    title: "Mission 14: worked examples"
    examples:
    - {"title":"Calculate mass purity","problem":"A 20 g sample contains 18 g of the desired substance.","rule":"mass purity=desired mass/total mass×100%.","steps":["Set up the relationship: mass purity=desired mass/total mass×100%.","mass purity=18/20×100%=90%."],"answer":"The sample is 90% pure by mass.","mistake":"Do not divide by the impurity mass."}
    - {"title":"Find a partial pressure","problem":"An ideal-gas mixture is 25% helium by mole and has total pressure 8 atm.","rule":"P_He=x_He P_total.","steps":["Set up the relationship: P_He=x_He P_total.","P_He=0.25(8)=2 atm."],"answer":"Helium contributes 2 atm.","mistake":"Use mole fraction, not mass fraction."}
    - {"title":"Apply simultaneous conditions","problem":"A sample must have purity ≥95% and temperature ≤30 °C. It has purity 97% and temperature 32 °C. Does it pass?","rule":"When both conditions are required, both must be true.","steps":["purity test = 97 ≥ 95, true.","temperature test = 32 ≤ 30, false. A passing purity cannot cancel a failed temperature."],"answer":"The sample fails the combined specification.","mistake":"Averaging a pass and a fail is not a logical AND."}

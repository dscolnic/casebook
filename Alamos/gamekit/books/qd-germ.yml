copy:
  REG: <p>The registrar's office, on the near side of the lane. Ledgers of returns, a rate book, and a district map with eighty-four pins in it.</p>
  PUMP: <p>The court, across the lane. A standpipe on a stone step, two terraces of houses round it, and the shelter the parish put up over the tools.</p>
  LAB: <p>The laboratory hut, ninety metres up the lane past the fence. A microscope, an incubator, plates in a rack, and sixty matched animals in cages along the far wall.</p>
  WARD: <p>The fever ward, on the hospital ground. Two wings off one entrance, the same beds in each, and a chlorinated lime basin at one of the two doors.</p>
  LODGE: <p>The gate lodge, at the entrance. A book everybody signs, a lamp, and the keys to the yard gate.</p>
  WATER: <p>The water company's office, by the lane. A wall map of which street is on which main, and a counter nobody stands at.</p>
  MORT: <p>The mortuary, behind the ward. Cold, quiet, and the place a cause of death is written down before it becomes a line in a ledger.</p>

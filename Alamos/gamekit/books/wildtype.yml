roster:
- id: penn
  name: "Ada Penn"
  role: "preserve director"
  division: PLAN
  pronouns: "she/her."
  bio: |
    Ada Penn is preserve director. Wants give the mainland a justified chance to recover. A complete manifest can look more certain than its evidence. Moves from whole-manifest certification to a staged permit-limited pilot. Says, "What does this result let us do?"
- id: vale
  name: "Mara Vale"
  role: "veterinary biologist"
  division: CLINIC
  pronouns: "she/her."
  bio: |
    Mara Vale is veterinary biologist. Wants keep each organism healthy through handling. Can focus on individual health before community needs. Accepts that a healthy organism can still lack a needed partner. Says, "Which comparison stayed healthy?"
- id: reed
  name: "Ivo Reed"
  role: "plant physiologist"
  division: GROW
  pronouns: "he/him."
  bio: |
    Ivo Reed is plant physiologist. Wants restore vigorous nursery growth. Initially sees recovered leaves as evidence the old settings work broadly. Limits the reset after flowering and visitor evidence. Says, "What changed in the matched tray?"
- id: shah
  name: "Nell Shah"
  role: "conservation geneticist"
  division: SEED
  pronouns: "she/her."
  bio: |
    Nell Shah is conservation geneticist. Wants preserve variation and traceable families. Can overvalue a sequence lead before organismal evidence. Keeps causal claims narrower than the sequence story. Says, "Can we still trace that family?"
- id: rowan
  name: "Tess Rowan"
  role: "field ecologist"
  division: MARSH
  pronouns: "she/her."
  bio: |
    Tess Rowan is field ecologist. Wants protect working habitats and relationships. Can assume island dependencies transfer with the organisms. Requires receiving-site tests instead of copying the island wholesale. Says, "What else depends on that?"

glossary:
  - name: Calibration
    aliases: [calibration, calibrate, calibrated, calibrating]
    def: Checking an instrument against something already known, so its readings can be trusted.
  - name: Spectrum
    aliases: [spectrum, spectra]
    def: The set of energies or wavelengths something gives out, and how much of each.
  - name: Refractive index
    aliases: [refractive index, index, indices]
    def: How much more slowly light goes in a material than in empty space.
  - name: Optical fibre
    aliases: [optical fibre, fibre, fibres]
    def: A hair of very pure glass that carries light along its own length.
  - name: Core
    aliases: [core]
    def: The thin middle of a fibre, where the light travels.
  - name: Cladding
    aliases: [cladding]
    def: The layer round the core, made with a slightly lower index than the middle.
  - name: Total internal reflection
    aliases: [total internal reflection]
    def: What happens when light meets a boundary too obliquely to cross it, and none of it gets out.
  - name: Critical angle
    aliases: [critical angle]
    def: The angle beyond which none of the light crosses a boundary at all.
  - name: Numerical aperture
    aliases: [numerical aperture, acceptance angle]
    def: How wide a cone of light a fibre will take and keep.
  - name: Wavelength
    aliases: [wavelength, wavelengths]
    def: The distance between one crest of a wave and the next.
  - name: Nanometre
    aliases: [nanometre, nanometres, nm]
    def: A thousand-millionth of a metre, which is the unit light is measured in here.
  - name: Photon
    aliases: [photon, photons]
    def: One indivisible quantum of light, carrying an amount of energy fixed by its own colour.
  - name: Electron volt
    aliases: [electron volt, electron volts, ev]
    def: A very small unit of energy, convenient for one particle at a time.
  - name: Decibel
    aliases: [decibel, decibels, db]
    def: A way of stating a ratio as a logarithm, so that stages along a path add up.
  - name: Attenuation
    aliases: [attenuation, attenuates]
    def: The steady weakening of a signal as it goes, quoted per kilometre or per millimetre.
  - name: Rayleigh scattering
    aliases: [rayleigh scattering, scattering]
    def: Light turned aside by the tiny irregularities of the material it is passing through.
  - name: Dispersion
    aliases: [dispersion]
    def: The spreading of a pulse, because not every colour in it travels at quite the same speed.
  - name: Group index
    aliases: [group index]
    def: The number that says how fast a pulse travels, as against how fast one steady colour does.
  - name: Reflectometer
    aliases: [reflectometer, otdr]
    def: An instrument that sends a pulse down a fibre and times what comes back.
  - name: Trace
    aliases: [trace, traces]
    def: "The picture a reflectometer draws: how much came back, against how long it took."
  - name: Splice
    aliases: [splice, splices, spliced]
    def: A joint between two fibres, either welded or held end to end.
  - name: Cleave
    aliases: [cleave, cleaved, cleaving]
    def: A cut made on purpose, so that the end of a fibre is square rather than ragged.
  - name: Index-matching gel
    aliases: [index-matching gel, matching gel, gel]
    def: A clear jelly of the same index as the glass, used to remove a step at a joint.
  - name: Fresnel reflection
    aliases: [fresnel reflection, fresnel]
    def: The part of a beam that comes straight back wherever the index changes abruptly.
  - name: Repeater
    aliases: [repeater, repeaters]
    def: A sealed housing on the sea floor that strengthens the signals passing through it.
  - name: Erbium amplifier
    aliases: [erbium amplifier, erbium]
    def: A coil of fibre with a rare-earth element in the glass, which gives the signal energy it takes from
      a laser.
  - name: Pump laser
    aliases: [pump laser, pump]
    def: The laser whose light lifts those atoms into a state they can give energy from.
  - name: Stimulated emission
    aliases: [stimulated emission]
    def: An excited atom made to release its energy early, by a passing wave it then joins.
  - name: Population inversion
    aliases: [population inversion]
    def: The state in which more atoms are excited than are not, without which nothing is amplified.
  - name: Quantum efficiency
    aliases: [quantum efficiency]
    def: How often an arriving quantum of light frees a charge where it lands.
  - name: Responsivity
    aliases: [responsivity]
    def: The current a detector gives for each watt falling on it.
  - name: Shot noise
    aliases: [shot noise]
    def: The unevenness that comes from anything being counted rather than measured.
  - name: Landing station
    aliases: [landing station]
    def: The building where an undersea cable comes ashore and its signals go onto land equipment.
  - name: Power feed
    aliases: [power feed]
    def: The high voltage applied to a cable’s single conductor to run the housings along it.
  - name: Slack
    aliases: [slack]
    def: The extra length paid out while laying, so the cable lies down instead of hanging.
  - name: Grapnel
    aliases: [grapnel]
    def: A heavy hook dragged from a repair ship to catch an undersea cable so the crew can lift it.
  - name: Radiography
    aliases: [radiography, radiograph, radiographed]
    def: Making a picture of the inside of something by shining rays through it onto film.
  - name: Activity
    aliases: [activity]
    def: How many nuclei of a source break up each second.
  - name: Half-life
    aliases: [half-life]
    def: The time in which half of a batch of unstable nuclei have decayed.
  - name: Barrier distance
    aliases: [barrier distance]
    def: How far back everybody has to stand while an exposure is being made.

missions:
# 15 mission fragment(s), assembled by tools/assemble-book.mjs from
# wildtype/ — edit the fragments, not this file.
# ============================================================ MISSION 1
# Lifted from ../fpl_gpt/WILDTYPE_AP_Biology_Campaign_Implementation_Bible_v1.0.md by tools/v10extract.mjs. Every quoted string below is
# the bible's, verbatim; engine/dev/bibleParity.mjs holds it to that.
- title: "THE FOOD THAT IS NOT ENOUGH"
  card:
    header: "DAY 1 OF 15 — SHIP DEPARTS AFTER DAY 15"
    title: "THE FOOD THAT IS NOT ENOUGH"
    goNow: "Go to Field Clinic and meet Mara Vale, veterinary biologist, at the Sample Bench."
    body: "The first trays have pale new leaves, but the ship is booked. Plants need the right mix of matter as well as fuel. Check the feed with Mara at the Sample Bench. Today you decide whether to replace the failing seedling feed."
    objective: "Resolve whether to replace the failing seedling feed; the young plants may die before planting."
  objective: "Resolve whether to replace the failing seedling feed; the young plants may die before planting."
  stake: "The first trays have pale new leaves, but the ship is booked. Plants need the right mix of matter as well as fuel. Check the feed with Mara at the Sample Bench. Today you decide whether to replace the failing seedling feed."
  takeaway: "Replace the feed with a complete nutrient mix. ---"
  segue: "Mission decision: Replace the feed with a complete nutrient mix. The nitrogen test restores growth."
  # The mission card's own "Primer concepts", printed on the plan card.
  terms:
  - {name: "Element", def: "A substance made of one kind of atom."}
  - {name: "Monomer", def: "A small building unit that can join others."}
  - {name: "Protein", def: "A chain of amino acids folded into a working shape."}
  - {name: "Enzyme", def: "A protein or RNA catalyst: a substance that speeds a reaction without being consumed."}
  - {name: "Control", def: "A comparison treated the same way except for the tested factor."}
  - {name: "Atom", def: "A small unit of an element."}
  - {name: "Molecule", def: "Two or more atoms bonded together."}
  - {name: "Amino acid", def: "A building unit of a protein."}
  - {name: "Nucleotide", def: "A building unit of DNA or RNA."}
  - {name: "DNA", def: "A molecule that stores inherited sequence information."}
  - {name: "RNA", def: "A molecule used in gene expression and other cell functions."}
  - {name: "Phospholipid", def: "A lipid with a water-attracting head and water-avoiding tails."}
  - {name: "Lipid", def: "A mostly water-insoluble molecule used in membranes or energy storage."}
  - {name: "Nitrate", def: "A nitrogen-containing ion that some organisms use as a nitrogen source."}
  - {name: "Phosphate", def: "A phosphorus-containing ion used in many biological molecules."}
  - {name: "Carbon skeleton", def: "The connected carbon atoms forming the framework of an organic molecule."}
  - {name: "Hydrolysis", def: "Breaking a chemical link by adding water."}
  equations:
  - {"e":"deficit = requirement − supply","c":"Find the missing daily amount.","s":"Size the nutrient replacement test."}
  primer:
  - "Carbon forms four bonds and can build diverse molecules."
  - "Calories alone do not provide all the elements needed to build new cells."
  - "Evidence from matched treatments can separate a nutrient shortage from a broken assay."

  # The five worked examples the mission card offers behind a button.
  # GENERATED by tools/bible-examples.mjs from the campaign bible. Reference,
  # never graded — see the panel in engine/core/worked.js.
  worked:
    label: "Worked examples"
    title: "Worked examples"
    examples:
    - {"title":"","problem":"A carbohydrate chain has 8 sugar units; joining them needs 7 links and releases 7 water molecules.","rule":"","steps":[],"answer":"","mistake":""}
    - {"title":"","problem":"A protein has 12 amino acids; hydrolysis of all 11 peptide links consumes 11 water molecules.","rule":"","steps":[],"answer":"","mistake":""}
    - {"title":"","problem":"An oil contains glycerol and fatty acids; these are not a repeating monomer chain, so oil is not a true polymer.","rule":"","steps":[],"answer":"","mistake":""}
    - {"title":"","problem":"An enzyme works at neutral pH but loses activity at extreme pH; altered charges disrupt folding, so substrate binding can fail.","rule":"","steps":[],"answer":"","mistake":""}
    - {"title":"","problem":"Two leaves have equal sugar but only one has nitrogen; nitrogen is needed in amino acids, so equal sugar does not guarantee equal protein production.","rule":"","steps":[],"answer":"","mistake":""}

  stops:
  # --- Stop 1: Read the feed ingredients
  #     Concept: 2 — Macromolecules and hydrolysis; Keystone: Structure and function, Matter conservation; Area: CLINIC; Prerequisites: Mission primer; no prior graded knowledge assumed.; Learning role: INTRODUCE; Difficulty: L2; Story role: clue.
  #     placement: PROTOCOL, Field Clinic — Sample Bench.
  - group: CLINIC
    at: sample-bench
    title: "Read the feed ingredients"
    concept: 1   # Water and carbon chemistry
    reason: "The feed label must explain what the seedlings can build."
    scene: "The first shipment trays have pale new leaves, even though the feed label lists plenty of stored energy. Mara Vale asks: \"The clinic needs the ingredients connected to what cells build before it can decide which shortage to test.\""
    motivation: "Distinguishing these mechanisms keeps the next handling decision tied to the evidence."
    format: PROTOCOL
    question: "Match each labeled observation to one explanation; submit all matches, using each explanation once."
    choices:
      - Supplies fatty acids for storage and membranes
      - Supplies nitrogen for amino acids
      - Supplies phosphorus for nucleotides and phospholipids
      - Supplies carbon skeletons and chemical energy
    answerText: "The pale seedlings need materials as well as fuel. This result is now recorded for the next comparison."
    why: "The pale seedlings need materials as well as fuel. Sugar provides carbon skeletons, while nitrate supplies nitrogen and phosphate supplies phosphorus. Amino acids and nucleotides require those additional elements. Oil can store chemical energy but cannot replace missing nitrogen. Matching ingredients to what cells build makes the feed label useful evidence. It does not prove which ingredient is missing yet; the next comparison must test the actual stored mix against an appropriate complete-feed control."
    # wrong-path feedback, one rebuttal per wrong option:
    #   Swapping sugar and nitrate treats energy as a source of every atom. Swapping phosphate and oil confuses a required element with an entire storage molecule. Match the chemical contribution of each fraction before retrying. Retry: keep the visible evidence, clear only the committed response and reopen this board; no later stop unlocks until a correct submission. For matching/order errors, highlight the first mismatched biological relationship with the specific feedback above; for numerical errors, display the stated formula and substituted units after grading.
    # data: The following labeled observations and candidates are shown in full before submission.
    # correct result: {"e1": "r1", "e2": "r2", "e3": "r3", "e4": "r4"}; exact label, complete mapping or complete order; no partial completion.
    # state/output: Read the feed ingredients is recorded with its evidence on the Field Clinic log; the next comparison becomes available.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   scenarios:
    #   - id: e1
    #     label: Sugar fraction
    #   - id: e2
    #     label: Phosphate fraction
    #   - id: e3
    #     label: Nitrate fraction
    #   - id: e4
    #     label: Oil fraction
    #   choices:
    #   - id: r4
    #     label: Supplies fatty acids for storage and membranes
    #   - id: r3
    #     label: Supplies nitrogen for amino acids
    #   - id: r2
    #     label: Supplies phosphorus for nucleotides and phospholipids
    #   - id: r1
    #     label: Supplies carbon skeletons and chemical energy
    #   mapping:
    #     e1: r1
    #     e2: r2
    #     e3: r3
    #     e4: r4
    #   rebuttals:
    #     e1→r4: Sugar fraction supports Supplies carbon skeletons and chemical energy; Supplies fatty acids for storage and membranes describes a different mechanism and does not account for that observation. Reopen this match and compare the stated effect.
    #     e1→r3: Sugar fraction supports Supplies carbon skeletons and chemical energy; Supplies nitrogen for amino acids describes a different mechanism and does not account for that observation. Reopen this match and compare the stated effect.
    #     e1→r2: Sugar fraction supports Supplies carbon skeletons and chemical energy; Supplies phosphorus for nucleotides and phospholipids describes a different mechanism and does not account for that observation. Reopen this match and compare the stated effect.
    #     e2→r4: Phosphate fraction supports Supplies phosphorus for nucleotides and phospholipids; Supplies fatty acids for storage and membranes describes a different mechanism and does not account for that observation. Reopen this match and compare the stated effect.
    #     e2→r3: Phosphate fraction supports Supplies phosphorus for nucleotides and phospholipids; Supplies nitrogen for amino acids describes a different mechanism and does not account for that observation. Reopen this match and compare the stated effect.
    #     e2→r1: Phosphate fraction supports Supplies phosphorus for nucleotides and phospholipids; Supplies carbon skeletons and chemical energy describes a different mechanism and does not account for that observation. Reopen this match and compare the stated effect.
    #     e3→r4: Nitrate fraction supports Supplies nitrogen for amino acids; Supplies fatty acids for storage and membranes describes a different mechanism and does not account for that observation. Reopen this match and compare the stated effect.
    #     e3→r2: Nitrate fraction supports Supplies nitrogen for amino acids; Supplies phosphorus for nucleotides and phospholipids describes a different mechanism and does not account for that observation. Reopen this match and compare the stated effect.
    #     e3→r1: Nitrate fraction supports Supplies nitrogen for amino acids; Supplies carbon skeletons and chemical energy describes a different mechanism and does not account for that observation. Reopen this match and compare the stated effect.
    #     e4→r3: Oil fraction supports Supplies fatty acids for storage and membranes; Supplies nitrogen for amino acids describes a different mechanism and does not account for that observation. Reopen this match and compare the stated effect.
    #     e4→r2: Oil fraction supports Supplies fatty acids for storage and membranes; Supplies phosphorus for nucleotides and phospholipids describes a different mechanism and does not account for that observation. Reopen this match and compare the stated effect.
    #     e4→r1: Oil fraction supports Supplies fatty acids for storage and membranes; Supplies carbon skeletons and chemical energy describes a different mechanism and does not account for that observation. Reopen this match and compare the stated effect.
    #   answerText: The pale seedlings need materials as well as fuel. This result is now recorded for the next comparison.
    scenarios:
      - Sugar fraction
      - Phosphate fraction
      - Nitrate fraction
      - Oil fraction
    mapping:
      - 3
      - 2
      - 1
      - 0

  # --- Stop 2: Count the missing nitrogen
  #     Concept: 2 — Macromolecules and hydrolysis; Keystone: Matter conservation; Area: CLINIC; Prerequisites: Mission primer and Stop 1: Read the feed ingredients; Learning role: INTRODUCE; Difficulty: L2; Story role: obstacle.
  #     placement: BALLPARK, Field Clinic — Sample Bench.
  - group: CLINIC
    at: sample-bench
    title: "Count the missing nitrogen"
    concept: 2   # Macromolecules and hydrolysis
    reason: "The replacement test needs the missing nitrogen amount."
    scene: "The ingredient matches show that carbon-rich food cannot supply every element needed for new cells, and the stored mix contains little nitrogen. Mara Vale asks: \"Calculate the shortfall so the clinic can prepare a measured comparison instead of guessing.\""
    motivation: "The calculated quantity sets the comparison the crew must satisfy before it acts."
    format: BALLPARK
    question: "Use the number tiles to calculate the daily nitrogen deficit in mg per day; submit need minus supply."
    answerText: "The deficit is the daily requirement minus the nitrogen already supplied: 12 − 3 = 9 mg per day. This result is now recorded for the next comparison."
    why: "The deficit is the daily requirement minus the nitrogen already supplied: 12 − 3 = 9 mg per day. Both quantities refer to the same tray and time interval, so no extra multiplication is needed. Carbon-rich feed cannot create the missing nitrogen atoms. The result sets the size of the suspected shortage, but it does not establish that nitrogen alone explains the symptoms. A matched complete-feed comparison is needed before the crew replaces the mix."
    # wrong-path feedback, one rebuttal per wrong option:
    #   15 adds supply to need instead of finding the shortfall. 3 reports the supplied amount rather than what is missing. Retry: keep the visible evidence, clear only the committed response and reopen this board; no later stop unlocks until a correct submission. For matching/order errors, highlight the first mismatched biological relationship with the specific feedback above; for numerical errors, display the stated formula and substituted units after grading.
    # data: A tray needs 12 mg nitrogen per day; the stored feed supplies 3 mg per day. Assume no other nitrogen input.
    # correct result: 9; absolute tolerance ±0.05 in the requested unit, inclusive.
    # state/output: Count the missing nitrogen is recorded with its evidence on the Field Clinic log; the next comparison becomes available.
    # THE BIBLE'S PAYLOAD. Convert to the canonical schema in
    # tools/import-book.mjs — some of these are a rename and some are a
    # model conversion. Do not paste it in as it stands.
    #   estimate:
    #     quantity: Count the missing nitrogen
    #     units: mg/day
    #     labels:
    #     - need
    #     - supply
    #     - trays
    #     - hours
    #     values:
    #     - 12
    #     - 3
    #     - 4
    #     - 24
    #     slots: 2
    #     template: '{0} {1} → mg/day'
    #     formula: a-b
    #     correct:
    #     - 0
    #     - 1
    #     target: 9

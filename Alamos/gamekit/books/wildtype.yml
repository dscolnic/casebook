# Dark Fibre — Pellow Head Island, twelve days to guide one repair attempt.
#
# Written to gamekit/tools/BOOK_TEMPLATE.md. The place is themes/darkfibre/site.js;
# the sketch it came from is ../GAME_IDEAS.md under "Fibre", where it sat parked
# because Deep Watch already owned "everything you know arrives as a signal".
# What settled it is the course: AP Physics 2's optics and modern-physics half is
# four concepts and three concepts in deepwatch_hs, retrofitted onto a submarine,
# and it is the whole of both units here.
#
# Twelve of the thirty-six stops are DERIVE panels, one a day, in the order the
# optics has to arrive in:
#
#   day  1  the acceptance cone, from Snell's law and the critical angle
#   day  2  the apparent fault distance, from delay and the speed in glass
#   day  3  the reflection expected from a clean break
#   day  4  the full span loss budget in decibels
#   day  5  the energy of one 1550 nm photon and the photon rate in a power
#   day  6  the measured photodiode responsivity
#   day  7  gamma attenuation through the replacement housing
#   day  8  the anti-reflection coating used to clean up the two-colour test
#   day  9  radioactive decay of the radiography source
#   day 10  the corrected seabed route position
#   day 11  the pump-power ceiling from photon energies
#   day 12  the final loss budget after the spare-pump recovery
#
# `askRule: true` is on. Optics is a course where the same arithmetic is licensed
# by four different physical laws, and a student who divides the indices the right
# way round without knowing whether they are using Snell or the critical-angle
# condition has not understood either.
#
# The story: Pellow Head is a small island whose main phone and internet link to the mainland
# is an undersea fibre cable. The cable lost 4.1 dB suddenly and the island is running on one
# backup route. A repair ship reaches the island in twelve days, just before bad weather closes
# the sea for weeks. The player has to use the physics of light to answer two questions before
# that one safe recovery day: what failed, and exactly where it is on the seabed route.
#
# The timeline the cards are checked against:
#   eleven years ago    the cable laid; 1.5 per cent slack paid out over the route
#   four years ago      repeater 6 replaced; its pump output logged at 118 mW
#   eight months ago    the radiography source renewed; 73.8-day half-life
#   nineteen days ago   the span lost 4.1 dB overnight and the traffic moved
#   now                 twelve working days until the repair ship arrives
#   day 13              one safe repair day before the weather closes the sea
#   after that          the next safe offshore repair window may be weeks away

theme:
  id: darkfibre
  title: Dark Fibre
  subtitle: Optical Measurements Lead · Pellow Head Island · twelve days to guide one repair attempt
  opening: >-
    Pellow Head is a small island. Nearly every phone call and internet connection to the mainland runs through
    one fibre-optic cable on the ocean floor. Nineteen days ago it lost most of its signal, leaving the island
    on one backup line. If that fails, emergency calls, hospital links and normal communication with the mainland
    go down.

    A repair ship arrives in twelve days, just before bad weather closes the sea for weeks. It gets one safe day
    to pull up one part of the cable. You are the optical measurements lead. Use the physics of light to answer
    two questions: what failed, and where is it? Send the ship to the wrong thing or place, and Pellow Head may
    stay on its last link until the sea reopens.


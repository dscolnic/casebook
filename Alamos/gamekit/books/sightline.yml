    background:
    - >
      Why this is a teaching budget. Eyes move several times each second, but a transcript cannot reconstruct where Cardoza
      looked on each movement. The board makes the competition visible without pretending those exact costs were measured
      in 2019.
    - >
      Why the items compete. Reading a plate, inspecting a face and tracking a threat all draw on limited visual attention.
      A threatening object often attracts attention, but the size of that effect varies across people and events.
    - >

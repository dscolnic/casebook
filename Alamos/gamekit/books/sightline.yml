  - group: MEASURE
    task: Decide what the phrase in the scene report is worth
    title: A word where a reading should be
    reason: >-
      Baptiste is asking how much longer Ward serves while the word normal is treated as a measurement
    place: Records Store
    scene: Ines Baptiste, the unit director, stands on the rebuilt corner beside the lux meter and the scene report. The 
      report says only 'street lighting normal.' No night reading survives. She asks how much longer Ward should serve 
      while the unit treats that word as data.
    guide: >-
      Four objections to one word. Ask of each whether it questions the officer or the record. Normal is a judgement against
      something unstated. It could mean the lamps looked usual, or that nothing seemed odd, or that the road was familiar.
      Those imply different physical conditions, and none of them gives a number anybody can go back and check.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
      — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
      belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
      a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here,
      before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the
      signal taken out of them deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
      fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made
      for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
    assumes:
    - a measurement can be repeated by somebody else and a description cannot
    takeaway: A word describing a condition and a reading of that condition are different kinds of evidence, and only 
      one can be checked.
    format: CHOICE
    question: Why can the review not simply accept "street lighting normal" as evidence about the light?
    why: "'Normal' is a judgment against an unstated comparison. It could mean the lamps looked usual, that nothing seemed
      unusual, or simply that the road was familiar. Those meanings imply different physical conditions. None gives a lux
      value another reviewer can reproduce. A meter reading carries a defined quantity and unit. Seven years later, somebody
      else can make the same measurement. A descriptive word cannot supply that missing standard, however sincere the writer
      was."
    choices:
    - Nobody can now say what the officer compared it against
    - Officers are not trained to assess lighting conditions at a scene
    - The report was written the following morning rather than at the scene
    - A single observer is never enough to establish a physical condition
    answer: Nobody can now say what the officer compared it against
    rebuttals:
    - Training is not the issue, because a trained observer's impression would still lack a stated comparison.
    - Timing would matter for detail recall, and the phrase would be equally uncheckable written on the spot.
    - One observer with an instrument is sufficient, which is what shows the problem is the phrase rather than the 
      number of people.
  # ---------------------------------------------------------------- day 5
- title: What entered the first account?
  objective: Establish how the first full account was taken, and who was in the room.
  briefing: The account everybody has argued about since was recorded on 18 November.
  stake: >-
    Friday. Cardoza’s first full interview happened four days after the robbery. The unit has the recording, and a transcript
    nobody has checked against it. There is something else in the file. Her husband sat in for the whole hour. Today you rebuild
    an interview that protects what a witness has of her own. You test how a nod in a listening room can change what she
    says next time. You read the words she was given before the photos came out. The point is not to prove that any one later
    detail was fed to her. It is to name which routes into her account were open before the lineup began.
  takeaway: An account is not collected; it is produced, by a method, in a room, with people in it.
  stops:
  - group: MEMORY
    task: Order the steps of an interview that protects what the witness actually has.
    title: The order an account is taken in
    reason: >-
      Okada has the 18 November recording queued, and the order the questions arrived in decides what the account is worth
    place: Interview Suite A
    scene: Ren Okada lays five interview steps along the corridor floor and queues the 18 November recording. In the 
      audio, the second question arrives eleven seconds after Cardoza begins. He asks the room to rebuild the order 
      before replaying it.
    guide: >-
      All five steps will happen, so ask what each one protects from the ones after it. Once somebody else's words are in
      the room, the account cannot be returned to what it was. So ask of each step whether it adds information or only invites
      it. And one of them has to happen before any photograph exists.
    background:
    - >-
      Why the order is graded whole. A sequence is a claim about dependency: each step is here because the one before it has
      already happened, or has to have. One transposed pair falsifies that claim wherever it sits, so partial credit would
      be credit for a sequence that does not work.
    - >-
      Why the ends are the place to start. The first and last cards are constrained by having nothing before or after them,
      which usually makes them the two you can settle from the scene alone. Pinning them collapses the remaining arrangements
      sharply, and what is left in the middle is where the actual judgement lives.
    - >-
      What the rail can be ordered on. Time is the usual axis, but it is not the only one. An order can run on cost, on risk,
      or on reversibility — every observation that leaves the sample as it was, before any that consumes it. On those boards
      a chronological reading finds nothing, because none of the steps has to happen at a particular hour.
    takesAsRead:
    - "How a lineup is built: fillers, and the ones nobody would pick"
    assumes:
    - a question can introduce a detail that was not in the witness's own account
    takeaway: Every question narrows what comes next, so the questions go last and the witness's own account goes first.
    format: SEQUENCE
    why: Interview order protects later information from earlier contamination. First, make 'I do not know' an 
      acceptable answer. Then take uninterrupted free recall before adding anybody else's words. Open questions can 
      follow because they expand material the witness already raised. Closed questions come later and only on existing 
      topics. Confidence must be recorded before photographs or feedback arrive. Once outside information enters, the 
      original state of the account cannot be recreated by asking more carefully.
    cards:
    - Say plainly that "I do not know" is a full answer and will not disappoint anybody
    - Take an uninterrupted account in the witness's own words, asking nothing during it
    - Return to what the witness raised, using open questions that name no new detail
    - Put closed questions only about things the witness has already brought up
    - Record the witness's confidence in each element, before any photograph or any feedback arrives
    order: [0, 1, 2, 3, 4]
  - group: SOCIAL
    task: Change one feature of the listening room at a time, then reverse the change that moves which details survive 
      into the second telling.
    title: Eleven small agreements
    reason: >-
      Cardoza's husband agreed at eleven points in that hour, and the listening room can be re-run with one feature changed
    place: Deliberation Room
    scene: Grace Ntuli plays the 18 November interview in the listening room. Cardoza's husband is present throughout 
      and agrees at eleven points. A second console can replay the same account with one feature of the room changed.
    guide: >-
      The number you are watching is how many details from the first account survive into the second one. Three features of
      the listening room can be changed, one at a time, and the same recording is replayed each time. A response counts only
      if it is larger than the run-to-run scatter. Change one, replay, restore it, and name the feature the surviving details
      follow.
    takesAsRead:
    - "How a lineup is built: fillers, and the ones nobody would pick"
    assumes:
    - people adjust what they say to the reaction they are getting
    takeaway: A controlled study can establish that social feedback can move an account; the case record still has to 
      show whether that mechanism reached this witness.
    format: CONTROL
    question: Feedback from the room — a nod, a pause, an agreement — can change what a witness repeats. Which room
      feature is causing reinforced details to survive, and does the effect return when that feature is restored?
    control:
      hint: Change one control from baseline, read the number of details that survive into the second telling, then 
        restore it. Do not change two room features together.
      noise: 0.7
      baseline: 8
      observable:
        label: Reading
        unit: details repeated
      response: 3
      truth: listener_agreement
      variables:
      - id: listener_agreement
        label: Listener agreement cues
      - id: open_questions
        label: Open questions after free recall
      - id: pause_seconds
        label: Interviewer pause after an answer
    answerText: In this authored control run, agreement cues cause more details to survive into a second telling. That 
      demonstrates a plausible social-feedback mechanism; it does not prove that Cardoza’s husband caused any specific 
      change in her account.
    why: Social feedback can shape what a speaker repeats without deliberate coaching. In this controlled volunteer run,
      changing listener agreement while holding the interviewer and timing fixed changes which details survive into the 
      second telling, and reversing the cue reverses the effect. That is causal evidence for the mechanism in the rig. 
      The 2019 interview was not a controlled experiment, so the review may say that an influence pathway existed—not 
      that it can reconstruct which sentence, if any, the husband changed.
  - group: IDENT
    task: Find the instruction that was not given
    title: The man may not be here
    reason: >-
      One instruction is missing from the 2019 array record, and it is the one that changes what a pick means
    concept: "Signal detection: sensitivity against where the line is set"
    place: Identification Suite
    scene: |-
      Ilori has the 2019 array form. There is a line for the witness's signature and no line for the caution that the person she saw might not be among the photographs. In 2019 there was no such line.
    guide: >-
      Match each outcome an array can produce to what it actually costs, and to who bears the cost. Two of the four are errors
      and two are correct answers, and the caution is what changes the rate of one specific error without changing the others.
      Sorting them is how the missing line stops being a paperwork point.
    background:
    - >-
      Why an array has four outcomes and not two. The offender is either in the array or not, and the witness either picks
      the suspect, picks a filler, or declines. That gives a hit, a miss, a filler pick and a correct rejection — and the
      four are not equally visible afterwards, which is why a procedure can look successful while producing the wrong ones.
    - >
      What the caution changes. A witness can reject an array even without the instruction, but explicitly saying that the
      offender may be absent reduces the pressure to treat one of the photographs as the required answer. That matters most
      when the offender is absent.
    - >-
      Why a filler pick is the useful signal. It is the one error the system can see: nobody charges a filler, so a filler
      pick tells the investigation the witness was guessing. An identification of the suspect under the same guessing produces
      a charge and looks like evidence.
    takesAsRead:
    - "How a lineup is built: fillers, and the ones nobody would pick"
    assumes:
    - a witness expects an investigation to have found somebody before showing an array
    takeaway: A may-not-be-present instruction makes rejection explicit and reduces pressure to choose; its absence does
      not make a choice inevitable.
    format: PROTOCOL
    question: Signal detection splits an array into four outcomes: a hit, a miss, a false alarm and a filler pick.
      Match each outcome to what it costs and who carries it.
    scenarios:
    - The offender is in the array and the witness picks the suspect
    - The offender is absent and the witness picks the suspect
    - The offender is absent and the witness picks a filler
    - The offender is in the array and the witness declines to pick
    choices:
    - Evidence the case can use, and the outcome the procedure exists to produce
    - A wrongful identification that reads as evidence, carried entirely by an innocent person
    - A visible warning that the witness was guessing, carried by the investigation
    - A lost opportunity, carried by the case and by anybody the offender goes on to harm
    mapping: [0, 1, 2, 3]
    answerText: A hit is useful evidence, a filler pick is a visible error, and a declined identification can lose a 
      real opportunity. A false suspect identification is especially dangerous because it can look like a hit. Omitting 
      the may-not-be-present caution can increase pressure to choose when the offender is absent.
    why: "An array can produce a hit, a miss, a filler pick, a suspect pick when the offender is absent, or a correct rejection.
      Those outcomes are not equally visible later. A filler pick is obviously an error because the filler is known innocent;
      a suspect pick can travel through the case as evidence. The missing caution matters because a clear may-not-be-present
      instruction legitimises saying “none of them” and can reduce choosing pressure. It does not eliminate every error, and
      its absence does not force a witness to choose. The defensible finding is that a protective instruction was missing
      from a procedure already vulnerable to a suspect who stood out."


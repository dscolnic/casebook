      her estimate, separate the shout from the man crossing the kerb. The bay clock is set to six.
    guide: >-
      Six seconds of attention, and a list of things that would take longer than that between them. Spend it, and read off
      what the account can then contain. Nothing on the list is a wrong thing to have looked at; what the six seconds cannot

  - group: PERCEPT
    task: Read what the utility says about the lamp
    title: Column 4471
    reason: >-
      The power company answered Solomon's letter this morning, and its ticket covers the night of the robbery
    place: Reconstruction Bay
    scene: Vision scientist Frey lays the utility fault ticket for column 4471 beside the bay switch. It runs from 2 to 
      21 November 2019. She kills the modeled lantern; the doorway meter settles near two lux from shop-window spill.
    guide: >-
      Read the fault ticket against the earlier calculation. The arithmetic described the lantern if it was working; the ticket
      covers the robbery night. What remains is shop-window spill at roughly two lux: dim, mesopic vision in which colour,
      contrast and fine facial detail are poorer, not absent.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
      — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
      belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
      a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here,
      before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the
      signal taken out of them deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
      fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made
      for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
    assumes:
    - illuminance falls off with the square of the distance from a source
    takeaway: With the column out, what light the corner had came from a shop window twelve metres the other way.
    format: CHOICE
    question: What does the fault ticket do to the twelve lux the review calculated on day four?
    why: The 12.5-lux calculation described column 4471 if its lantern was working. The utility ticket shows it was out 
      from 2 through 21 November, including the robbery on 14 November. The arithmetic was correct and the premise was 
      false. Bekele's reconstruction leaves about two lux of shop-window spill at the doorway. That is dim rather than 
      dark and lies in a mesopic regime where both rods and cones can contribute. Colour discrimination, contrast and 
      fine facial detail are poorer than in the working-lamp model, but they do not simply disappear.
    choices:
    - It removes the source that figure was calculated from, leaving the shop window
    - It shows the calculation was done with the wrong intensity for that lantern
    - It means the corner was completely dark, so nothing could have been seen at all
    - It changes the distance the illuminance should have been calculated over
    answer: It removes the source that figure was calculated from, leaving the shop window
    rebuttals:
    - The lantern's rating is from the utility's own asset record and is not in question.
    - Two lux is dim rather than dark, and a review that says nothing could be seen overclaims immediately.
    - The distance from lamp to doorway was correct; the objection is that the lamp was not lit.
  # ---------------------------------------------------------------- day 12
- title: The nineteenth hour
  objective: Read the interview that produced the only words the file has from Ward.
  briefing: Nineteen hours in custody, no lawyer, and an agreement retracted the next morning.
  stake: >-
    Tuesday. The custody log is the last big document nobody has read closely. Ward was arrested at 06:40 on 3 December 2019.
    At 01:20 the next morning he agreed with an account put to him. That was the nineteenth hour, and the log shows no chance
    to sleep in any of them. Eight hours later, after sleep, he took it back. The log can fix the timing and the conditions.
    It cannot read what was going on in his head. Today you ask which findings hold up under the worst honest guess about
    his judgement, then look at the softened version of the act he was offered. Last, you set a witness’s later account beside
    the one taken before years of news coverage.
  takeaway: An admission is evidence about the interview as well as about the event, and the interview is on the record.
  stops:
  - group: BRAIN
    task: Move the cognitive-control assumption to its pessimistic end, then choose the evidentiary treatment that 
      remains defensible.
    title: What survives the bad end of nineteen hours
    place: Physiology Bay
    scene: Priya Raghunathan and clinical psychologist Oyelaran put the custody log beside Ward's 01:20 agreement. 
      Baptiste wants a sentence the board can use. The panel instead asks which treatment of the admission still works 
      if cognitive control was badly degraded.
    guide: >-
      Move the assumption about Ward's cognitive control to its bad end, and watch which treatments of the 01:20 admission
      survive. A sentence the board can use has to hold at the pessimistic end of nineteen hours, not merely at the likely
      one. Choose the treatment that still works there.
    background:
    - >-
      What nineteen hours does. Sustained wakefulness degrades the ability to weigh distant consequences against immediate
      relief long before it affects speech or memory of ordinary facts. A person can be lucid, cooperative and articulate
      while being much worse at judging what agreeing now will cost later.
    - >-
      Why the range is the question. Nobody can measure what Ward's control was at 01:20. The evidence gives a range, and
      a review that picks the middle of it has made an assumption it cannot defend. Testing at the bad end is what turns an
      untestable claim into a decidable one.
    - >-
      What survives, and what does not. Treatments that rely on the admission being a considered decision fail at the pessimistic
      end. Treatments that use it as one item among others, weighted by the conditions it was made in, hold — which is why
      the answer is about how to use it rather than whether to believe it.
    assumes:
    - the ability to weigh a future consequence against a present one degrades without sleep
    takeaway: When a psychological state was not measured, use it as an uncertainty range rather than as a diagnosis 
      that decides truth.
    format: STRESS
    question: How should the review use Ward's 01:20 agreement if his ability to weigh distant consequences was badly 
      reduced?
    stress:
      hint: Move cognitive-control reserve down to twenty. The quick treatment is the one that counts the agreement as 
        corroboration; the question is which one is still defensible when his reserve was at the bad end of the range.
      assumption:
        id: control_reserve
        label: Cognitive-control reserve
        min: 20
        max: 100
        step: 10
        nominal: 70
        unit: index
      criteria:
      - id: no_false_independence
        label: Does not count an officer-supplied account as independent knowledge
        operator: ">="
        target: 1
        key: no_false_independence
      - id: no_state_verdict
        label: Does not treat sleep loss itself as proof of truth or falsity
        operator: ">="
        target: 1
        key: no_state_verdict
      - id: closure_days
        label: Working days to a board-ready conclusion
        unit: days
        direction: lower_is_better
        key: closure_days
      candidates:
      - id: rely
        label: Treat the agreement as independent corroboration
      - id: corroborate
        label: Use only independently corroborated details Ward supplied himself
      - id: discard
        label: Discard the agreement solely because he was exhausted
      - id: withdrawal
        label: Treat the morning withdrawal as proof the agreement was false
      robust: corroborate
      optimiseOn: closure_days
      feasible:
        rely: 70
        corroborate: 20
        discard: 110
        withdrawal: 110
      scores:
        rely:
          no_false_independence: 0
          no_state_verdict: 1
          closure_days: 2
        corroborate:
          no_false_independence: 1
          no_state_verdict: 1
          closure_days: 9
        discard:
          no_false_independence: 1
          no_state_verdict: 0
          closure_days: 3
        withdrawal:
          no_false_independence: 1
          no_state_verdict: 0
          closure_days: 4
    answerText: Require independent corroboration for any detail Ward supplied himself. At the lowest cognitive-control 
      reserve, this is the only candidate still feasible. It also avoids treating exhaustion as proof that the agreement
      was false.
    why: Prolonged custody and the absence of a recorded sleep opportunity can impair attention and decision control, 
      but the file does not measure Ward’s exact cognitive state. The robust question is therefore not whether 
      exhaustion “caused” a false statement. It is what evidentiary treatment remains safe across plausible levels of 
      impairment. Ward supplied no unique detail and retracted the agreement after sleep without receiving new case 
      information. Requiring independent corroboration for any detail he supplied is defensible even at the pessimistic 
      end without treating fatigue as proof that the statement was false.
  - group: SOCIAL
    task: Name what the officer's version of the account offered
    title: The cheap version
    place: Deliberation Room
    scene: |-
      Ntuli reads the account that was put to Ward at 01:20. It describes a man who went along with something, who did not plan it, and who was not the one holding the bag.
    guide: >-
      Work the arithmetic the room offered him. Two numbers were on the table at 01:20 — what the minimised version was presented
      as costing, and what holding out was presented as costing — and the expected years of the second one is the sentence
      times the chance of conviction he was given. One tile is the sentence the law actually attaches to the minimised account,
      which is the number nobody in the room said.
    background:
    - >-
      What minimisation does. It lowers the apparent cost of admitting, by offering a version of events that sounds partial,
      reluctant and forgivable. Maximisation raises the apparent cost of denying, by presenting conviction as near-certain.
      Together they change the arithmetic a person is doing without changing anything about what they did.
    - >-
      Why the arithmetic is what matters and not the person's character. For an innocent person, admitting a lesser version
      at an apparent nine months against an apparent near-certain eight years is a rational trade at that moment, in that
      room, on those numbers. That is the mechanism, and it does not require anybody to be weak or confused.
    - >-
      Why the numbers were not real. The law does not price a minimised account the way the interview room did: going along
      with a robbery in which a weapon was carried attracts a sentence in the same band as planning it. So the trade offered
      was between a real eight years and an imaginary nine months, and only one side of it was ever going to arrive.
    assumes:
    - people admit more readily to a version that costs them less
    takeaway: Minimisation lowers what an admission appears to cost, and the law does not price it the way the interview
      room does.
    format: BALLPARK
    question: What did holding out appear to cost him, as the room presented it at 01:20?
    answerText: About 7.2 years of expected sentence, against an apparent nine months for the minimised version. The 
      real sentence for that version is six years, and nobody in the room said so.
    why: "Minimisation and maximisation work on arithmetic rather than on character. At 01:20 the room presented two options
      with numbers attached. Hold out, and conviction was put at 90 per cent certain with a sentence of eight years: 0.90
      × 8 = 7.2 expected years. Take the offered version — went along with it, did not plan it, was not holding the bag —
      and the implication was a matter of months. On those numbers, admitting is the rational move for a guilty person and
      for an innocent one alike, which is the whole point: the mechanism does not need the person to be weak, confused or
      unintelligent. What makes it a false-confession risk is that one of the two numbers was not real. The law does not price
      a minimised account the way an interview room does, and going along with a robbery where a weapon was carried attracts
      about six years — so the trade on the table was a genuine 7.2 against an imaginary 0.75, and the reason it looked like
      a good deal is that the second number was never going to be honoured."
    estimate:
      prompt: At 01:20 the room put conviction at 90 per cent certain with an eight-year sentence, and implied the 
        minimised version was worth about nine months.
      question: Choose the chance of conviction he was given and the sentence attached to it.
      labels:
      - 0.90  (chance of conviction, as presented)
      - 8  (years, the sentence if convicted at trial)
      - 0.75  (years, the minimised version as implied)
      - 6  (years the law actually attaches to the minimised account)
      - 1.2  (hours he had been in the room)
      values: [0.90, 8, 0.75, 6, 1.2]
      slots: 2
      template: '{0} × {1}'
      formula: a*b
      correct: [0, 1]
      target: 7.2
      tolerance: 0.4
      units: expected years
      solution: 0.90 × 8 = 7.2 expected years against an apparent 0.75, and the real figure for the minimised account is
        6.
      explanation: The trade was between a real number and an imaginary one. That is what minimisation and maximisation 
        do to the arithmetic.
      givens:
      - conviction presented as 90 per cent certain, sentence eight years
      - the minimised version implied at about nine months
      relationship: The expected cost of holding out is the chance of conviction times the sentence attached to it, and 
        the minimised alternative is priced by the room rather than by the law.
  - group: MEMORY
    task: Find out what a re-interview after years actually records
    title: What Aktaş remembers now
    concept: "Storage and forgetting: the curve is steep at the start"
    place: Interview Suite B
    scene: Baptiste asks whether the unit should re-interview Cardoza before the report closes. Ren Okada puts Deniz 
      Aktaş's 2023 interview beside his 2019 statement. Four new details appear, each already present somewhere in the 
      public record.
    guide: >-
      Say what fraction of the 2019 account a re-interview four years later should still reproduce, then run the comparison
      and read the result. The curve is steep at the start and shallow later, so most of what was going to be lost went in
      the first weeks. Commit to a number before the answer appears — the interesting finding is not how much was lost but
      what arrived.
    background:
    - >-
      What the forgetting curve does. Retention falls fast at first and then flattens, so the difference between four years
      and four months is much smaller than the difference between four months and four days. An account four years old is
      not four years' worth of decay; it is a few weeks' decay and then a long plateau.
    - >-
      Why the new details are the finding. Four particulars appear in 2023 that are not in the 2019 statement, and every one
      of them is somewhere in the public record — the paper, the appeal coverage, the campaign. Memory does not tag a detail
      with where it came from, so they are held with the same confidence as everything else.
    - >-
      What follows for the decision. A fresh interview cannot recover the 2019 account, because nothing subtracts what has
      arrived since. It can only produce a 2023 account, and the unit already has one. The 2019 statement is the evidence;
      a re-interview adds a document about the intervening four years.
    takesAsRead:
    - "Encoding: memory is built at the moment, from what was attended to"
    assumes:
    - an account can be compared with an earlier account by the same person
    takeaway: A later account includes years of forgetting, retrieval and post-event exposure; it cannot simply be 
      subtracted back to recover the 2019 memory state.
    format: VERIFY
    question: Four years of forgetting sit between the two accounts. Predict how much of the 2019 account the 2023
      interview still reproduces, then run the comparison.
    answerText: About 70 per cent of the original particulars survive — and four new ones arrive, each traceable to the 
      public record. The loss is the predictable part; the additions are what make a re-interview useless as evidence.
    why: The forgetting curve is steep at the start and shallow afterwards, so most of what was going to be lost from 
      the 2019 statement was gone within weeks and the four years since have cost relatively little. Compared item by 
      item, about seven particulars in ten survive intact — which is roughly what the curve predicts and is not the 
      finding. The finding is the other direction. Four details appear in 2023 that are not in the 2019 statement, and 
      each one can be found in the newspaper report, the appeal coverage or the campaign material. Memory stores no tag 
      saying where a detail came from, so Aktaş holds those four exactly as he holds the ones he saw, with the same 
      confidence and no sense of having acquired them. That is why the answer to Baptiste's question is no. A 
      re-interview cannot recreate the 2019 memory state, because nothing subtracts the intervening four years. It 
      produces a 2023 account whose differences may reflect forgetting, later information, retrieval and ordinary 
      variability; tracing new details to public sources makes post-event influence a plausible explanation rather than 
      a certainty.
    verify:
      prediction:
        label: Share of the 2019 particulars still reproduced in 2023
        unit: per cent
        min: 20
        max: 100
        step: 5
      truth: 70
      passRatio: [0.75, 1.3]
      intervention:
        label: Compare the 2023 interview against the 2019 statement, particular by particular
        note: both documents are in the file; the comparison is done blind to which is which by a second reader
        outcome: The comparison completes and the two accounts are matched item by item, with additions listed 
          separately.
      measurement:
        label: Read off the surviving share and the list of additions
        note: 23 particulars in the 2019 statement
        cost: 2
        costUnit: hours of reading
      unmeasuredMoral: Predicting the loss and never running the comparison misses the whole finding, because the loss 
        was the predictable half. What a re-interview adds is only visible by looking.

  # ---------------------------------------------------------------- day 13
- title: What is one identification worth?
  objective: Separate what a procedure can say about evidentiary weight from any unsupported numerical claim about 
    guilt.
  briefing: Three claims are ready and the board reads three weeks of work as one page.
  stake: >-
    Wednesday. Three things are ready at once. Weill has worked out the pool of men who could have been on that street. Ilori
    has six hundred runs of the unit's own procedure, using arrays where the guilty man was not present. Baptiste wants one
    thing from you. She wants to know which finding goes at the top of a page the board will read in ten minutes. Today you
    work out what a witness pick multiplies. Then you find what the unit's own procedure cannot see. Last, you rank three
    claims by how hard each one is to argue with. The order they appear in is most of what the board will take away.
  takeaway: The strength of a piece of evidence and the strength of a case are different quantities.
  stops:
  - group: MEASURE
    task: Show why a likelihood ratio cannot become a case probability without a defensible prior.
    title: A multiplier still needs a starting point
    reason: >-
      The board will be handed a likelihood figure, and a figure with no starting pool behind it means nothing
    place: Data Room
    scene: |-
      Weill writes two deliberately hypothetical numbers on the board and refuses to call them Ward’s odds. One is a starting odds assumption; the other describes how strongly an identification procedure discriminates in a test population.
    guide: >-
      Five numbers, and three belong elsewhere: the multiplier for the other procedure, the size of the pool itself, and a
      resolution limit. Ask of each what this calculation needs. Evidence multiplies the odds you started with, so the answer
      depends on both assumptions. Neither of them can be left unstated.
    background:
    - >-
      Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here
      has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs, and
      whether the size of the answer looks right once they are in place.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label
      is how a unit mismatch, or a quantity belonging to a different part of the problem, is caught before it is placed —
      which is the habit this format exists to build.
    assumes:
    - the exercise supplies a hypothetical prior rather than measuring one for Ward
    - a likelihood ratio multiplies prior odds; it does not create the starting odds
    takeaway: A likelihood ratio says how evidence shifts odds; it does not supply the prior, so this exercise cannot 
      become Ward’s probability of guilt.
    format: BALLPARK
    question: Under the stated hypothetical assumptions, calculate the updated odds—and then state why the case file is 
      not entitled to call them Ward’s odds.
    answerText: 0.00025 × 15 = 0.00375, about 1:267 in odds under the toy assumptions. The arithmetic is valid; calling 
      it Ward’s probability of guilt would not be, because the prior is illustrative rather than measured from this 
      case.
    why: Bayes’ rule multiplies prior odds by a likelihood ratio. Here the exercise deliberately supplies prior odds of 
      1:4,000 and an illustrative likelihood ratio of 15, giving updated odds of about 1:267. That demonstrates 
      base-rate dependence. It does not measure the prior probability that Ward was the offender, and a geographic “pool
      of men” is not a defensible substitute for such a prior. The review can use procedure performance to discuss 
      evidentiary weight without manufacturing a case-specific probability of guilt.
    estimate:
      prompt: For a deliberately hypothetical sensitivity check, suppose prior odds were 1 in 4,000 and a procedure 
        supplied a likelihood ratio of 15. These inputs are teaching assumptions, not measured odds that Ward was the 
        offender.
      question: Choose the prior odds and the multiplier the procedure earns.
      labels:
      - 0.00025  (prior odds, from a pool of 4,000)
      - 15  (likelihood ratio for the 2019 procedure)
      - 60  (an unrelated illustrative likelihood ratio)
      - 4000  (men in the pool)
      - 0.0102  (m, the resolution limit at 34 m)
      values: [0.00025, 15, 60, 4000, 0.0102]
      slots: 2
      template: "{0} × {1}"
      formula: a*b
      correct: [0, 1]
      target: 0.00375
      tolerance: 0.0009
      units: odds
      relationship: Posterior odds = prior odds × likelihood ratio, the odds before the evidence multiplied by how much 
        more often that evidence arises when the claim is true.
      solution: 0.00025 × 15 = 0.00375, about 1:267 in odds under the stated toy assumptions.
      explanation: The calculation is correct under the supplied assumptions. Its purpose is to show that an evidence 
        multiplier cannot be interpreted without starting odds. Because the case does not have a defensible measured 
        prior of 1:4,000, the result is not Ward’s probability of guilt.
      givens:
      - Prior odds of 0.00025, from a pool of 4,000
      - A likelihood ratio of about 15 for the 2019 procedure
  - group: IDENT
    task: Measure the unit's own procedure against a population it knows the truth about
    title: Six hundred arrays with no offender in them
    reason: >-
      The unit's own current procedure has never been measured against cases whose answer is already known
    place: Identification Suite
    scene: |-
      Ilori has six hundred synthetic cases where the offender is known to be absent, and four versions of the procedure to push them through. What comes back is a measurement of the procedure rather than of anybody's guilt.
    guide: >-
      Six hundred synthetic cases with the offender known to be absent, and four versions of the procedure. Run the ones you
      want and watch what comes back. Every pick in these runs is a false identification by construction, so what you are
      measuring is the procedure's own error rate rather than anybody's guilt. Recommend the version that actually buys something.
    background:
    - >-
      Why a known-absent population is the instrument. If the offender is not in the array, a correct procedure produces no
      identification. Every pick is therefore an error, and counting them measures how often this procedure would accuse an
      innocent person — which cannot be measured from real cases, because nobody knows the truth in those.
    - >
      What the versions differ in. The runs alter concrete system variables such as filler quality, the may-not-be-present
      instruction and whether the administrator knows the suspect. The combined reform changes several protections together,
      so it can test the package without isolating the contribution of every component.
    - >-
      Why 'buys something' rather than 'lowest error'. A version that eliminates false identifications by making witnesses
      pick nobody at all has bought nothing. The comparison has to hold correct identifications up against false ones, which
      is what the run reports.
    assumes:
    - a procedure can be run on cases whose answer is already known
    - when the offender is absent, any pick is an error
    takeaway: Running a known population through your own procedure measures the procedure, and the errors it makes are 
      the ones your real cases contain.
    format: INJECT
    question: Six hundred lineups were built with no offender in them, so every pick was a filler. Run the versions
      you want, then recommend the one that actually buys something.
    inject:
      hint: The offender is absent from every one of these arrays, so every pick is an error. What differs is where the 
        errors land.
      population:
        n: 600
      metric:
        label: share of picks landing on a filler rather than the suspect
        unit: "%"
      configs:
      - id: current
        label: The 2019 procedure as run
        detections: 402
        metric: 34
      - id: caution
        label: Add the may-not-be-present caution
        detections: 250
        metric: 61
      - id: fillers
        label: Rebuild the array with matched fillers
        detections: 300
        metric: 71
      - id: blindseq
        label: 'Combined reform: blind administrator, matched fillers and standard caution'
        detections: 190
        metric: 78
      best: blindseq
      blindSpot: No version tells you whether the offender was in the array in the first place. An innocent-suspect run 
        measures where a procedure's errors land, and never whether a particular case is one of them.
      commit: Recommend it
    answerText: "In this authored injection test, the combined reformed package produces the safest error pattern of the options
      tested. That supports the package as tested; it does not isolate which component caused the gain or prove that one presentation
      format is universally superior."
    why: Every synthetic array here is offender-absent, so every identification is an error by construction. The useful 
      question is where those errors land and how often the procedure produces them. A filler pick announces itself 
      because the selected person is known not to be the suspect; a suspect pick can travel through a case as 
      normal-looking evidence. The combined reform performs best in this authored test. Because several protections 
      change together, the experiment supports that tested package rather than assigning the whole improvement to any 
      one component.
  - group: SOCIAL
    task: Rank three findings by how hard each is to argue with
    title: The order the board reads them in
    reason: >-
      The packet is being assembled today, and what the board reads first sets what the rest of it looks like
    place: Deliberation Room
    scene: Three findings sit on one page and the board has ten minutes. Grace Ntuli places the cards along the corridor
      from the rebuilt corner to the interview room. She asks which finding should make the reader stop first.
    guide: >-
      Order the three by how hard each is to argue with, hardest first. The rail is not a clock — all three findings are already
      established and go in the same report. What separates them is whether a reader can dispute the finding itself or only
      what follows from it, and a finding that rests on a measurement is in a different class from one that rests on a judgement
      about a person.
    axis: Order the three by how hard each is to argue with, hardest first. This is not a clock — all three are 
      established and all three go in the report; the question is which one a reader cannot get around.
    ends: [Cannot be argued with, Open to argument]
    background:
    - >
      What makes a finding hard to argue with. A quantity somebody can go and re-measure, with a stated method and an independent
      cross-check. The 34.2-metre sightline is that kind of finding. A missing line on the original 2019 form is nearly as
      direct.
    - >
      What makes one more inferential. Administrator expectancy is a well-supported mechanism, but the 2019 file cannot measure
      how much it moved Cardoza. That is exactly why it belongs after the two findings that require less inference.
    - >-
      What makes one arguable. Anything resting on an inference about what a person knew, intended or transmitted. The expectancy
      finding is sound and it is the one a reader will contest, which is exactly why it belongs after the two that cannot
      be contested rather than in front of them.
    assumes:
    - a reader gives most weight to what they read first
    takeaway: Put the finding nobody can argue with first, because it is what the arguable ones are then read against.
    format: SEQUENCE
    question: Order the three findings by how hard each is to argue with.
    cards:
    - The doorway is 34.2 m from Cardoza’s stated position, independently surveyed
    - The 2019 array form has no line for the may-not-be-present caution
    - The administrator knew which photograph was the suspect
    order: [0, 1, 2]
    answerText: The surveyed distance first, the missing caution line second, the administrator’s knowledge last. The 
      first two rest on repeatable geometry and the original form; the third is a procedural inference and should be 
      read against them.
    why: "A board reading quickly should meet the hardest-to-dispute findings first. The 34.2-metre geometry can be re-surveyed
      and independently checked against the lease plan. The missing caution is visible on the original 2019 form. The administrator’s
      knowledge is also documented, but what that knowledge did in this particular case is an inference informed by controlled
      research. Putting the reproducible findings first makes the report’s evidentiary hierarchy visible rather than relying
      on rhetoric."

  # ---------------------------------------------------------------- day 14
  - group: SOCIAL
    task: Work the file review while the standing question changes.
    title: What the review is looking for now
    reason: >-
      The file is bigger than the time left, and Ntuli changes the standing question during the day without announcing it
    concept: "Post-identification feedback and confidence inflation"
    place: Deliberation Room
    scene: The file is larger than the review has time for. Ntuli sets one question the team is answering, and changes 
      it as the picture develops — after the array form turns up, after the lux measurement, after the confidence 
      statements are compared.
    guide: >-
      Pull the documents the current question wants and leave the rest in the file. The question on the board changes during
      the day and nobody announces it. What is scored is the documents either side of a change, because they are the only
      ones that show whether the room is reading the board.
    background:
    - >-
      Why a review changes its question. It starts on procedure, because procedure is checkable. Once the light measurement
      lands it becomes what could have been seen. Once the two confidence statements are side by side it becomes what happened
      to the witness after the identification, which is a different set of documents entirely.
    - >-
      Why the changeover costs a review. Reading time is the only resource here, and a document read under the old question
      is read for the wrong thing — people do not re-read a document they have already ticked off.
    assumes:
    - a review works to a stated question that somebody can change
    takeaway: The cost of a withdrawn instruction is paid by whoever is still working to it.
    format: SPOT
    question: Pull to the question on the board, and keep watching the board. It runs from the procedure, to what
      could be seen, to the feedback the witness met after the identification.
    answerText: Read the board rather than the file. Every change leaves an hour in which the old question still looks 
      like today's.
    why: >-
      Three questions run across the day and each wants a different part of the file. Anything about how the procedure was
      run, then anything about what could have been seen, then anything about what the witness was told afterwards. A document
      can answer two at once, which is what makes the change cost real. The panel scores the window either side of each change,
      because most of the file is wanted by neither question and is correctly left unread by somebody who has read nothing.
      And a review is the worst case for a withdrawn instruction, because nobody re-reads a document they have already been
      through: read under the wrong question, it is not merely unhelpful — it is ticked, and the thing it would have shown
      is now behind a mark that says somebody looked.
    spot:
      duration: 40
      switchEvery: 12
      pass: 0.75
      hint: The question is on the board, and Ntuli changes it without an announcement.
      targets:
      - id: d1
        label: Array form, 2019
        tags: [procedure]
      - id: d2
        label: Lux survey, this month
        tags: [perception]
      - id: d3
        label: Officer notebook, procedure
        tags: [procedure]
      - id: d4
        label: Confidence statement, 2023
        tags: [afterwards]
      - id: d5
        label: Street lighting record
        tags: [perception]
      - id: d6
        label: Feedback note after picking
        tags: [afterwards, procedure]
      - id: d7
        label: Witness eye test
        tags: [perception]
      - id: d8
        label: Press cutting, 2020
        tags: [afterwards]
      rules:
      - say: Anything about how it was run
        want: [procedure]
      - say: Anything about what could be seen
        want: [perception]
      - say: Anything the witness met afterwards
        want: [afterwards]
      commit: Open the file
- title: The last reversible moment
  objective: Decide what else to buy, and what asking again would cost.
  briefing: After today the report is drafting, and one of the options on the table cannot be undone.
  stake: >-
    Thursday. This is the last day anything can still be added. Ines Baptiste has money for one more piece of work. She has
    four proposals in front of her. One of them is a fresh interview with Alma Cardoza. Ren Okada has spent two weeks explaining
    what that interview would cost. It is not money he is talking about. Samuel Oyelaran has been asked a harder question.
    Does Cardoza's distress about the case tell anybody anything at all? Today you choose what to buy. Then you read a test
    score against the group it was scored against. Last, you settle what a frightened witness's state does and does not prove.
  takeaway: The value of a measurement is the decision it would change, and one of these cannot be taken back.
  stops:
  - group: MEMORY
    task: Spend the final three workdays on evidence that can still change the report without mistaking a new 2026 
      account for the lost 2019 memory state.
    title: Three days, and one irreversible purchase
    place: Interview Suite A
    scene: Three days remain. Ren Okada lays four proposals on the last empty desk and turns the re-interview card face 
      down. He says one purchase can create a new account without recovering the old one, while using time the unit 
      cannot get back.
    guide: >-
      Three days and four proposals. Open each and ask what its result would change about the review's conclusion. One of
      them creates a new memory report that cannot recover the pre-photograph state, while consuming time that could answer
      a still-open physical question. Weigh that against what it would tell you, then commit.
    background:
    - >-
      Why a re-interview cannot recover the past. Asking again creates another retrieval episode, and the answer can be influenced
      by everything learned since 2019. The original 2019 document remains intact, but no 2026 interview can recreate the
      memory state that existed before later photographs, feedback and publicity. Scarce time should therefore go where a
      result can change the decision. be spent last.
    - >-
      What makes a purchase worth three days. Two possible results that point at different conclusions. A proposal that would
      confirm what the file already says has spent the unit's last window on reassurance.
    - >-
      Why the card is face down. Okada is making the irreversibility visible rather than letting it be discovered afterwards,
      which is the whole of what good evidence handling looks like from the inside.
    assumes:
    - work that cannot change a conclusion is not evidence for it
    - some evidence is used up by being collected
    takeaway: The best evidence purchase changes the decision without consuming information that cannot be recovered 
      later.
    format: VALUE
    question: Which work do you buy with the last three days: a physical measurement, a dated document, a new
      account, or more mock witnesses?
    value:
      decision: What evidence should the unit buy before the final recommendation is locked?
      budget:
        amount: 3
        unit: workdays
        label: Time remaining before disposition
      hint: Open each proposal to see what it can change. Count an irreversible re-interview as a cost even if it fits 
        on the calendar.
      options:
      - id: camera
        label: Obtain the 2019 shop-camera maintenance record
        cost: 1
        axis: camera chronology
        decisive: true
        reveals: Whether the camera recorder was already out on the robbery date, fixing a second physical timeline 
          fact.
      - id: survey
        label: Commission the board-appointed independent corner survey
        cost: 2
        axis: distance provenance
        decisive: true
        reveals: Whether an outside survey reproduces Bekele's 34.2 m result, answering the board's written independence
          question.
      - id: reinterview
        label: Re-interview Alma Cardoza with a full cognitive interview
        cost: 1
        axis: memory
        decisive: false
        reveals: A 2026 account after years of exposure; collecting it ends the clean comparison with the 2019 
          pre-photograph account.
      - id: mock_extension
        label: Extend the mock-witness study from 40 to 200 volunteers
        cost: 3
        axis: lineup precision
        decisive: false
        reveals: A narrower interval around a functional-size result that is already far outside a fair six-member 
          array.
    answerText: Buy the board-appointed independent survey and the 2019 camera-maintenance record. Together they use the
      three workdays and address open physical questions. Do not re-interview Cardoza merely to try to recover 2019 
      memory, or spend the whole window tightening a mock-witness estimate that is already decision-stable.
    why: Evidence has value when it can change the recommendation. The independent survey answers a question the board 
      has already asked and tests the unit's central physical finding. The camera record can settle another dated fact 
      cheaply. More mock witnesses would narrow an interval that is already far from a fair six-person array. 
      Re-interviewing Cardoza is different because it consumes something. It cannot recreate the pre-photograph memory 
      state and may influence any later account, while the original 2019 document itself remains preserved as the 
      baseline.
  - group: MEASURE
    task: Read the 2026 test score against the group it should be compared with
    title: One score, and what it is compared against
    place: Data Room
    scene: "Alma Cardoza took a standard face-matching test for the unit in March and scored 42. Tomas Weill opens the age-band
      norms beside it: mean 51, standard deviation 7, with the rebuilt street visible through the glass."
    guide: >-
      Five numbers, and two of them belong elsewhere: the highest score the test allows, and the surveyed distance. Ask of
      each whether this comparison needs it. A raw score means nothing without a distribution to sit in. And note the limits:
      the test was taken seven years later, with the pictures present.
    background:
    - >-
      Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here
      has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs, and
      whether the size of the answer looks right once they are in place.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label
      is how a unit mismatch, or a quantity belonging to a different part of the problem, is caught before it is placed —
      which is the habit this format exists to build.
    takesAsRead:
    - "Reliability: the same measurement twice, and two people measuring once"
    assumes:
    - a raw score has no meaning without the distribution it came from
    takeaway: A standard score says how unusual a result is, which is the only form in which one person's score can be 
      compared with anybody's.
    format: BALLPARK
    question: Estimate how far below the norm group's mean Cardoza's score falls, in standard deviations.
    answerText: The score is 1.29 standard deviations below the norm mean; the signed z-score is −1.29. That 
      standardises a 2026 test result and does not recreate 2019 identification accuracy.
    why: A raw score becomes interpretable only against a norm distribution. Cardoza's 42 is nine points below the mean 
      of 51. Dividing that gap by the seven-point standard deviation gives 1.29 standard deviations below the mean. The 
      signed z-score is therefore -1.29. That is low but not a diagnosis. The test was also taken seven years after the 
      robbery. Face matching with pictures present is related to, but different from, identifying a remembered face from
      a dark street.
    estimate:
      prompt: Cardoza scored 42 on the face-matching test. The norms for her age band give a mean of 51 and a standard 
        deviation of 7.
      question: Choose the norm group's mean, her score and the standard deviation.
      labels:
      - 51  (mean of the norm group)
      - 42  (her score)
      - 7  (standard deviation of the norm group)
      - 60  (highest score the test allows)
      - 34  (m, the surveyed distance)
      values: [51, 42, 7, 60, 34]
      slots: 3
      template: ({0} − {1}) ÷ {2}
      formula: (a-b)/c
      correct: [0, 1, 2]
      target: 1.29
      tolerance: 0.2
      units: standard deviations
      relationship: A standard score is z = (X − μ) / σ. For a score below the mean, (μ − X) / σ gives the same size 
        without the sign.
      solution: (51 − 42) ÷ 7 = 1.29 standard deviations below the mean; the signed z-score is −1.29.
      explanation: The score is 1.29 standard deviations below the norm mean, so its signed z-score is −1.29. That 
        locates the score in the norm distribution. It does not diagnose a condition, and it does not recreate vision or
        memory from 2019. The maximum score and the surveyed street distance are real numbers, but neither belongs in 
        this standardisation calculation.
      givens:
      - A score of 42 against a norm group mean of 51
      - A norm group standard deviation of 7
  - group: BRAIN
    task: Use the toy model to see why an unmeasured psychological state cannot be reconstructed from one outcome.
    title: What distress cannot tell you
    reason: >-
      Oyelaran has been asked twice this week whether her distress supports the identification, and once whether it sinks it
    concept: "Arousal and encoding: the amygdala, cortisol and the inverted U"
    place: Physiology Bay
    scene: |-
      Oyelaran has been asked twice this week whether Cardoza's distress about the case supports her identification, and once whether it undermines it. He writes both questions on the board and answers neither.
    guide: >-
      Two dials, one readout. Set the arousal at encoding and the arousal now, and watch the accuracy the model predicts.
      Find the settings that produce the accuracy actually observed — and then keep looking, because more than one pair produces
      it. The second measurement on the panel is what narrows the family down.
    background:
    - >-
      Why the curve has two sides. Moderate arousal at encoding sharpens attention on central detail and improves what is
      remembered about it. High arousal narrows attention further and degrades the periphery, so accuracy for anything outside
      the centre falls. One accuracy figure therefore fits a low arousal and a high one.
    - >-
      What distress now is evidence of. Distress at interview is arousal at retrieval, and it is produced by having been in
      a frightening event, by being told the case is important, and by being asked repeatedly — which is why it cannot separate
      a witness who encoded well from one who did not. Both branches of the board's question predict it.
    - >-
      What does separate them. Central-detail accuracy against peripheral-detail accuracy, measured separately: high arousal
      at encoding predicts a specific pattern — good on the weapon, poor on the face — that moderate arousal does not. That
      is the second measurement, and it is why the answer is a family of possibilities until it arrives.
    takesAsRead:
    - "Encoding: memory is built at the moment, from what was attended to"
    assumes:
    - distress can be assessed without assessing what caused it
    takeaway: A psychological mechanism can suggest vulnerabilities without reconstructing an unmeasured state years 
      later.
    format: DEGENERACY
    question: Use the toy model to find several arousal states that fit the same overall performance. What, if
      anything, does Cardoza’s distress now establish about her identification in 2019?
    answerText: More than one encoding state fits the same overall performance in the toy model. A 
      central-versus-peripheral pattern can distinguish scenarios inside the simulation, but Cardoza’s distress years 
      later does not identify her 2019 arousal state or establish whether the identification was accurate.
    why: "The inverted-U board is a teaching model, not a picture of Cardoza's body. Two different states can give the same
      overall score, so one score cannot choose between them. Real stress effects depend on timing, on the task and on the
      person. Comparing central detail with peripheral detail tests one prediction of an attention-narrowing model. It still cannot
      recover an arousal value from a seven-year-old file. Distress now is weaker still: a correct pick and a wrong pick can
      both leave a witness shaken. What holds is a limit on what can be claimed, not a finding about her."
    degeneracy:
      controls:
      - id: encode
        label: Arousal at encoding
        min: 0
        max: 10
        step: 0.5
        unit: units of the arousal scale
      - id: retrieve
        label: Arousal now, at interview
        min: 0
        max: 10
        step: 0.5
        unit: units of the arousal scale
      observable:
        label: Toy-model overall identification performance
      locus:
      - {a: 3.0, b: 2.0}
      - {a: 3.5, b: 4.0}
      - {a: 4.0, b: 6.0}
      - {a: 7.5, b: 6.0}
      - {a: 8.0, b: 7.5}
      - {a: 8.5, b: 9.0}
      second:
        label: Toy-model central detail minus peripheral detail
        apply: Compare central and peripheral detail as a model check, not as a physiological meter
        locus:
        - {a: 7.5, b: 4.0}
        - {a: 8.0, b: 6.0}
        - {a: 8.0, b: 7.5}
        - {a: 8.5, b: 9.0}
      truth: {a: 8.0, b: 7.5}
      tolerance: {a: 0.6, b: 1.0}
      still:
      - that current distress does not identify the 2019 encoding state
      - that the toy model cannot convert the record into a case-specific accuracy probability
- title: Sign the referral
  objective: Separate reproducible findings, witness-dependent findings and unresolved claims, then sign the 
    recommendation the evidence can actually carry.
  briefing: Tonight you sign. The board is not deciding whether Ward is innocent; it is deciding whether this 
    identification was strong enough to keep carrying his conviction.
  stake: >-
    Friday. The report goes tonight. Ines Baptiste has the page in front of her. Ren Okada has a list of the things the review
    may not say. Marcus Ilori wants the recommendation to be about the procedure. He does not want it to be about Karen Loomis,
    who followed the policy of her year. Elias Ward has now served seven years and three weeks. Today you sort the review's
    claims by what stands behind each one. Then you settle what the recommendation actually asks the board to do. Last, you
    name which findings would still hold if every witness withdrew tomorrow. Nothing can be added after tonight.
  takeaway: A review that says only what it can support is the only kind a board can act on.
  stops:
  - group: SOCIAL
    task: Match each claim to what stands behind it.
    title: What stands behind each sentence
    reason: >-
      The closing sentences are drafted, and each one has to trace back to something the review actually measured
    place: Deliberation Room
    scene: |-
      Four sentences from the draft are on the table. Ntuli asks the room to put each one beside the kind of support it actually has, and warns that one of them has none.
    guide: >-
      Four sentences from the draft, and four kinds of support. Pair them by asking who could check each one, and how. A survey
      can be repeated. An experiment can be rerun. A chronology sits in dated documents. And one of the four has no support
      here at all, which is why saying so protects the other three.
    background:
    - >-
      Why explanations rather than labels. Naming a finding is not accounting for it, and a plausible-sounding mechanism attached
      to the wrong observation is the commonest way a wrong story survives. Committing an explanation to one clue means claiming
      it accounts for that clue specifically and not for its neighbour, which is where the two come apart.
    - >-
      How to use the one-each rule. The explanations are a set to be distributed, not a list to be sampled, so every join
      constrains the rest. Settling the two you are confident of can decide the remaining pair by elimination. Where it does
      not, two explanations are still competing for one clue, and that competition is the distinction the stop is testing.
    - >-
      Why you cannot be wrong about exactly one. With every explanation used once, three correct joins leave the fourth with
      only one place to go. Any error therefore involves at least two. That is worth remembering when the last pair looks
      forced: the fault is usually not in the join you are struggling with, but in one you made early and stopped questioning.
    assumes:
    - claims of different kinds cannot be defended in the same way
    takeaway: Every sentence in a report is answerable in a particular way, and the ones that are not answerable at all 
      should not be in it.
    format: CASEBOOK
    why: Different claims require different kinds of support. A distance can be checked by another survey. A lineup 
      effect can be tested by repeating an experiment. A chronology can be checked against dated records. The claim that
      Ward was not the man has none of those supports in this review. Leaving that sentence out protects the others. A 
      report gains credibility when each claim has matching evidence. Unsupported conclusions should remain explicitly 
      unresolved.
    scenarios:
    - The doorway is 34 m from where the witness stood.
    - The array offered about one and a half real alternatives.
    - The certainty in the file was recorded three weeks after the choice.
    - Elias Ward was not the man who came out of the shop.
    choices:
    - Measured on the ground and confirmed against an independent plan.
    - Measured on strangers who never saw the crime, and repeatable next week.
    - Established by dates on three documents, none of which is a memory.
    - Not established by anything in this review, and not what the review is for.
    mapping: [0, 1, 2, 3]
  - group: PERCEPT
    task: Name the findings that survive without any witness
    title: What holds if everybody withdraws
    reason: >-
      Frey is shutting the bay down, and the findings that survive without a witness are the ones the board can lean on
    place: Reconstruction Bay
    scene: Vision scientist Frey shuts the bay lamps down for the last time. She repeats the question from the first 
      morning. Which findings would remain true if nobody involved in the case ever spoke again?
    guide: >-
      Four findings, and the question is which survives everybody withdrawing. Ask of each whether it rests on a memory, a
      form, or a measurement. A distance can be remeasured. A utility record and a reconstruction can be repeated. The others
      still matter and depend on accounts, which is exactly what the question removes.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
      — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
      belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
      a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here,
      before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the
      signal taken out of them deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
      fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made
      for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
    assumes:
    - a claim about a place can be checked without the people who were there
    takeaway: The strongest spine of a contested review separates repeatable measurements, dated external records and 
      witness-dependent accounts instead of treating them as one kind of evidence.
    format: CHOICE
    question: Which evidence would remain available if every witness in the case withdrew tomorrow?
    why: Some evidence survives because it is not stored in anybody’s memory. The sightline can be surveyed again. The
      utility outage is a dated record kept by the power company. The reconstruction can be run again under stated conditions.
      Those are three different kinds of support: a measurement, a record and a repeatable model. None of them needs Cardoza
      or Aktaş to remember anything. The array form and the co-witness agreement still matter. They are records of what people said,
      and they leave with the people who said it.
    choices:
    - The 34.2 m survey, the utility outage record and the repeatable reconstruction of the viewing conditions
    - The certainty recorded on the array form at the time of the choice
    - The four particulars the two accounts agree on
    - The state Ward was in at the nineteenth hour of the interview
    answer: The 34.2 m survey, the utility outage record and the repeatable reconstruction of the viewing conditions
    rebuttals:
    - The array form is a strong document and it is still a record of what one person said.
    - The agreeing particulars come from two accounts and go with them if either is withdrawn.
    - The custody log is a record about a person, and its value depends on his account of that night.
  - group: IDENT
    task: Make the decision the fifteen-day review has been building toward.
    title: Put your name on it
    reason: >-
      The packet closes tonight, after seven years of a fourteen-year sentence
    place: Identification Suite
    scene: Ines Baptiste has three versions of the closing sentence and has struck out two. Marcus Ilori reads the 
      survivor at the end of the sightline. The board packet closes tonight, after seven years of a fourteen-year 
      sentence.
    guide: >-
      Four recommendations, and the review has weighed one piece of evidence without reconstructing the robbery. Ask of each
      whether it claims more than that. One asserts innocence. One blames an individual for following the policy then in force.
      One waits for evidence nobody is looking for. The packet closes tonight.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
      — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
      belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across

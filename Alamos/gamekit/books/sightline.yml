      before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the
      signal taken out of them deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
      fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made
      for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
    takesAsRead:
    - "Storage and forgetting: the curve is steep at the start"
    assumes:
    - a review recommends a course of action rather than reaching a verdict
    takeaway: A recommendation should be no broader than the evidence chain that can still support it under challenge.
    format: CHOICE
    question: The review has weighed how one identification was assembled, not who stood in the doorway. What do you
      sign and send to the board tonight?
    why: The review can assess the weight of the identification without reconstructing the robbery itself. Referral asks
      the body with authority to reopen a conviction to examine evidence that cannot carry the role assigned to it. The 
      same procedural finding also matters beyond Ward because Loomis followed the policy then in force. Discipline 
      would misplace the failure on an individual. An innocence finding would go further than the evidence. The 
      recommendation should match the strongest claim the review can actually support.
    choices:
    - Refer the conviction back because the identification cannot carry it alone
    - Recommend release because the review has disproved the identification
    - Limit the finding to Ward's case and leave the 2019 procedure out of it
    - Record the concerns but wait for new evidence about the robbery
    answer: Refer the conviction back because the identification cannot carry it alone
    rebuttals:
    - The review has shown limits on the identification, not who stood in the doorway.
    - The procedure is the general finding. Loomis followed the policy then in force, so limiting the result to one case
      misses the cause.
    - Waiting leaves a conviction resting on evidence the review has already shown cannot bear the weight assigned to 
      it.

# Callback lessons. From day 3 the engine appends a fourth call revisiting an
# area taught earlier, and it prefers a "— Review" variant where one exists.

lessons:
- group: PERCEPT
  title: How much light the corner had — Review
  task: Apply the inverse square where the source is not the one you expect
  place: Reconstruction Bay
  scene: >
    Frey has moved the bay's lamp to the shop window and asks the same question about a different source. The window is twelve
    metres from the doorway on the other side.
  guide: >-
    Four answers, and three of them move the light because the observer moved. Ask what illuminance is a property of. It belongs
    to the surface and the source, and neither of them walked anywhere. What her ten metres changes is the angle the face
    subtends, which is a separate calculation. Mixing the two is the commonest error in this material.
  background:
  - >-
    Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
    — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
    belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
  - >-
    Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
    a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before
    it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken
    out of them deliberately.
  - >-
    What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
    fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made
    for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
  assumes:
  - illuminance depends on the distance from the source to the surface being lit
  takeaway: Illuminance belongs to the surface and the source; where anybody stands to look is a separate calculation.
  format: CHOICE
  question: A witness steps ten metres further back from the doorway. What happens to the light on the doorway?
  choices:
  - 'Nothing: the light on it is set by the lamp, not by her'
  - It falls by about a third, because she is further from the scene
  - It falls by a quarter, following the inverse square
  - It rises, because her eyes adapt as she moves into the dark
  answer: 'Nothing: the light on it is set by the lamp, not by her'
  why: >
    Illuminance is a property of the surface and the source. Moving an observer changes neither. What her extra ten metres
    changes is the angle the face subtends, and that is a separate calculation. Putting the observer distance into the light
    arithmetic is the commonest error in this material. The two belong apart because they cost the identification different
    things. One takes detail out of the scene. The other takes it out of the eye.
  rebuttals:
  - The inverse square applies to the source and the lit surface, and she is neither.
  - A quarter would be right if the lamp had moved twice as far away, which is not what happened.
  - Adaptation changes what she can use and leaves the light on the doorway exactly where it was.
- group: MEMORY
  title: Six seconds, and what they hold — Review
  task: Decide what a longer viewing would and would not have bought
  place: Interview Suite A
  scene: >
    Okada puts the question the other way round. Suppose the file said sixteen seconds rather than six. What would the review
    be able to say then?
  guide: >-
    Four things a longer viewing time might establish. Ask of each whether duration reports on what was possible or on what
    happened. Time gives attention more to spend, and where it went was set by what was threatening and moving. So a long
    report cannot rescue an identification at the resolution limit, and a short one does not refute it.
  background:
  - >-
    Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
    — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
    belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
  - >-
    Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
    a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before
    it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken
    out of them deliberately.
  - >-
    What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
    fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made
    for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
  assumes:
  - attention selects part of a scene at a time
  takeaway: More time helps only if the extra time was spent on the face, and no witness can report how it was spent.
  format: CHOICE
  question: What would a longer reported viewing time actually establish?
  choices:
  - That more could have been encoded, without saying that any of it was the face
  - That the identification would have been reliable at that distance, whatever the light
  - That the witness had time to compare the face with somebody she knew
  - That the account would contain fewer errors of detail overall
  answer: That more could have been encoded, without saying that any of it was the face
  why: >
    Duration bounds what was possible and reports nothing about what happened inside it. A longer event gives attention more
    to spend, and where it was spent is set by what was threatening, moving or unexpected rather than by what an investigation
    later needs. This is why the reported duration is a weak quantity in both directions: it cannot rescue an identification
    at the resolution limit, and a short viewing does not by itself refute one.
  rebuttals:
  - Reliability at a distance is set by what the eye can resolve, and time does not improve that.
  - Comparison with a familiar face needs the face to be resolvable in the first place.
  - Errors of detail track what was attended to, not how long the whole event lasted.
- group: IDENT
  title: Six at once — Review
  task: Say what changes when the faces arrive one at a time
  place: Identification Suite
  scene: >
    Ilori runs the same six photographs past a volunteer singly, with a decision required on each before the next appears.
    He asks the room what has actually changed.
  guide: >-
    Four things showing faces one at a time takes away. Ask of each whether it changes the question the witness is answering.
    A row supports a comparison, and a comparison has a winner. One at a time, the question becomes whether this face is the
    man, which can be answered no six times. And the cost is real: some correct picks are lost too.
  background:
  - >-
    Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
    — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
    belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
  - >-
    Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
    a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before
    it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken
    out of them deliberately.
  - >-
    What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
    fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made
    for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
  assumes:
  - a witness shown several faces together can compare them
  takeaway: One-at-a-time presentation reduces direct side-by-side comparison; whether it improves overall accuracy 
    depends on the full procedure and decision rule.
  format: CHOICE
  question: What does showing the photographs one at a time most directly reduce?
  choices:
  - Direct side-by-side comparison among all six faces
  - The chance to see every photograph before deciding anything
  - The ability to describe why a particular face was chosen
  - The record of how long she spent on each photograph
  answer: Direct side-by-side comparison among all six faces
  why: >-
    A row of faces makes direct side-by-side comparison easy. Showing photographs one at a time removes that comparison and
    changes the witness’s decision process. It can also change both correct and incorrect identification rates, and the research
    does not support treating sequential presentation as universally more accurate. The defensible lesson is therefore about
    what comparison is removed, not that one format always wins.
  rebuttals:
  - The witness eventually sees the set, but direct side-by-side comparison is what the one-at-a-time format removes.
  - Reasons can be given under either procedure and are recorded in both.
  - Decision timing can be recorded under either format; that is a documentation choice rather than the defining 
    scientific difference.
- group: BRAIN
  title: What the dark takes — Review
  task: Work out what a witness in a dark street is reliable about
  place: Dark Adaptation Booth
  scene: >
    Raghunathan asks the reverse question. Two lux takes colour and fine detail away; the room has spent a fortnight on what
    is lost, and she wants the other half of the list.
  guide: >-
    Four things a witness at two lux might get right, and the room has spent a fortnight on what is lost. Ask of each whether
    rods can carry it. They pool signals, which buys reach and costs resolution, and they are missing from the centre of gaze.
    So the useful question is which part of the account the conditions could support.
  background:
  - >-
    Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
    — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
    belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
  - >-
    Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
    a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before
    it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken
    out of them deliberately.
  - >-
    What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
    fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made
    for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
  assumes:
  - rods are sensitive, coarse and colour-blind
  takeaway: A dark-adapted witness is a good instrument for movement, outline and direction, and a poor one for a face.
  format: CHOICE
  question: What is a witness at two lux most likely to be right about?
  choices:
  - The way the man moved and the direction he went
  - The colour of the jacket he was wearing
  - The features of the face under the hood
  - Whether the man had a mark on his chin
  answer: The way the man moved and the direction he went
  why: >
    Rods pool their signals, which buys reach in the dark and costs resolution, and they are absent from the very centre of
    gaze — so a dark scene delivers movement, outline and heading well and everything fine badly. A report that treats a witness
    as reliable or unreliable as a whole gets this wrong in both directions. The useful question is always which part of the
    account the conditions could support, and gait and direction are the parts that survive two lux at thirty-four metres.
  rebuttals:
  - Colour vision needs cones and is gone below a few lux, whatever the witness believes she saw.
  - Facial features are the first thing the coarse rod system loses.
  - A chin mark is a small detail on a face, which is the hardest thing on this list.
- group: SOCIAL
  title: What a clean file would look like — Review
  task: Apply the standard the room wrote down on the first morning
  place: Deliberation Room
  scene: >
    Ntuli reads back the whiteboard from the first morning. The room agreed then what a sound 2019 procedure would have looked
    like, and she wants to know what the list is for now.
  guide: >-
    Four things a written standard buys. Ask of each whether it helps the room or helps a reader who distrusts the room. A
    comparison against a written standard can be argued with in two places: the standard, or whether the file meets it. A
    judgement cannot be argued with at all, which is the same protection a prespecified analysis gives.
  background:
  - >-
    Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
    — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
    belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
  - >-
    Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
    a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before
    it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken
    out of them deliberately.
  - >-
    What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
    fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made
    for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
  assumes:
  - a standard agreed in advance can be compared against afterwards
  takeaway: A standard written before the reading turns the report into a comparison anybody can repeat.
  format: CHOICE
  question: What does the review gain by comparing the file against a standard it wrote first?
  choices:
  - A reader can check the comparison without trusting the reviewers
  - The findings become harder for the sponsor of the review to overrule
  - The team avoids disagreeing with each other about individual documents
  - The report can be written more quickly at the end of the work
  answer: A reader can check the comparison without trusting the reviewers
  why: >
    A finding stated as a comparison against a written standard is checkable by somebody who thinks the reviewers are biased:
    they can dispute the standard, or dispute whether the file meets it, and both arguments are out in the open. A finding
    stated as a judgement is not checkable at all. The protection is the same one a prespecified analysis gives an experiment,
    and it works for the same reason — the standard cannot be adjusted after the answer is known.
  rebuttals:
  - Overruling is a matter of authority, and a written standard makes the disagreement visible rather than impossible.
  - Internal disagreement is useful and a standard does not remove it; it gives it something to be about.
  - Writing is faster with a standard, and speed is not the protection being bought.
- group: MEASURE
  title: A word where a reading should be — Review
  task: Tell a measurement from a description in a second document
  place: Records Store
  scene: >
    Achterberg hands over a page from another case. It records that a corridor was "well lit", that a door was "about two
    metres" from a bed, and that a lamp was "the usual type".
  guide: >-
    Three entries from another file, and four options. Ask of each entry whether it says what would count as disagreement.
    A quantity and a unit do, even a rough one. Well lit and the usual type do not, however sincere the writer was. So the
    test is not whether an entry sounds precise but whether somebody else could contradict it.
  background:
  - >-
    Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
    — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
    belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
  - >-
    Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
    a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before
    it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken
    out of them deliberately.
  - >-
    What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
    fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made
    for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
  assumes:
  - a measurement states its units and can be repeated
  takeaway: A quantity somebody could repeat is a measurement; everything else is a description, however numerical it 
    looks.
  format: CHOICE
  question: Which of these three entries is closest to a measurement?
  choices:
  - "About two metres, because a distance and a unit are stated"
  - "Well lit, because it describes a condition anybody would recognise"
  - "The usual type, because it identifies the fitting"
  - None of them, because all three were written from memory
  answer: "About two metres, because a distance and a unit are stated"
  why: >
    A measurement names a quantity and a unit, which is what lets somebody else go back and get the same number or a different
    one. "About two metres" is a weak measurement — no instrument, no tolerance — and it is still checkable in a way that
    "well lit" and "the usual type" are not, because it says what would count as disagreement. That is the test to apply to
    any file: not whether the entry sounds precise, but whether it says what would have to be true for it to be wrong.
  rebuttals:
  - "\"Well lit\" names no quantity, so nothing could contradict it."
  - "\"The usual type\" identifies a fitting by custom rather than by specification, and the custom has changed since."
  - Being written from memory weakens all three and does not make the one with a unit equivalent to the two without.

- group: IDENT
  title: What the first description constrains — Review
  task: Say what the file does not record about the witness and the man
  place: Identification Suite
  scene: >
    Ilori has the description form and the array side by side again. Weill asks a question nobody has asked out loud: what
    does the file say about how familiar those faces were to the person looking at them.
  guide: >-
    Four things the effect might require the review to say. Ask of each whether the file contains the information it would
    need. The effect is about exposure and practice rather than about attitudes, and it is large and repeated. But nothing
    here records how familiar such faces were to her. An unmeasured factor named honestly is worth more than one applied confidently.
  background:
  - >-
    Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
    — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
    belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
  - >-
    Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
    a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before
    it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken
    out of them deliberately.
  - >-
    What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
    fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made
    for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
  assumes:
  - people differ in how much experience they have of particular faces
  takeaway: Telling faces apart is a practised skill, and a review can only report what was measured about it.
  format: CHOICE
  question: What does the cross-race effect require the review to note about this identification?
  choices:
  - That the file records nothing about how familiar such faces were to her
  - That the identification is unreliable and should be set aside on that ground
  - That the witness holds a view about the group the suspect belongs to
  - That the effect applies only where a witness has said the faces looked alike
  answer: That the file records nothing about how familiar such faces were to her
  why: >
    Faces from a group somebody has little day-to-day experience of are harder to tell apart, and the effect is large, repeated
    and about exposure rather than about attitudes. It is a fact about practice, in the same way that reading unfamiliar handwriting
    is. What it means for a review is narrow: the file has no information on the point, so it can be listed as an unmeasured
    factor and cannot be applied to Cardoza as a finding. An unmeasured factor that is named honestly is worth more than one
    applied confidently.
  rebuttals:
  - Setting an identification aside needs a finding about this witness, and none exists in the file.
  - Attitudes are a different subject; this effect turns up in people who hold none.
  - A witness who does not notice the difficulty is exactly the case the effect describes.
- group: BRAIN
  title: What a flashbulb memory is worth — Review
  task: Weigh how vivid a memory feels against how accurate it is
  place: Physiology Bay
  scene: >
    Cardoza has said, in three separate places, that she remembers the night like a photograph. Raghunathan is asked what
    follows from that, and warns the room that the answer is the opposite of what it sounds like.
  guide: >-
    Four things a photographic feeling might indicate. Ask of each whether confidence and accuracy have been measured together.
    People asked the morning after a shocking event, and again years later, keep the confidence while the account measurably
    changes. Vividness tracks how much the event mattered and how often it has been retold, and both rise with time.
  background:
  - >-
    Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
    — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
    belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
  - >-
    Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
    a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before
    it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken
    out of them deliberately.
  - >-
    What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
    fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made
    for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
  assumes:
  - people can report how clear a memory feels to them
  takeaway: Vividness and accuracy are separately measurable, and studies that measure both find them barely related.
  format: CHOICE
  question: A flashbulb memory is one that feels like a photograph of the moment. What does that feeling tell you
    about the account's accuracy?
  choices:
  - Almost nothing, since the two have been measured separately and barely track
  - That the event was emotionally significant enough to be stored well
  - That the memory has been rehearsed often since the event
  - That the witness is reconstructing rather than remembering
  answer: Almost nothing, since the two have been measured separately and barely track
  why: >
    Flashbulb memories are the standard demonstration. People asked the morning after a shocking public event, and again years
    later, report enormous confidence in accounts that have measurably changed, and the confidence does not fall as the accuracy
    does. Vividness appears to track how much the event mattered and how often it has been retold, both of which rise with
    time. So a witness saying she can still see it is reporting something real about her experience and nothing usable about
    the night.
  rebuttals:
  - Significance does raise vividness, and it is the reason the two come apart rather than a reason to trust it.
  - Rehearsal raises vividness too, and rehearsal is exactly what does not improve accuracy.
  - Everybody retrieving a memory is reconstructing, so this cannot separate an accurate account from a wrong one.
- group: MEMORY
  title: The order an account is taken in — Review
  task: Work out what asking the same question twice does
  place: Interview Suite B
  scene: >
    Okada counts the times Cardoza was asked about the chin between November and the trial. The answer is nine, by five different
    people, four of whom already knew what the answer was expected to be.
  guide: >-
    Four accounts of what nine askings do. Ask of each whether it is about the witness's patience or about what the repetition
    tells her. A question asked again says somebody was not satisfied. Adults shift under that, and children shift far more.
    So every version after the first was produced under that pressure, and nobody here had counted the askings.
  background:
  - >-
    Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
    — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
    belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
  - >-
    Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
    a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here, before
    it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the signal taken
    out of them deliberately.
  - >-
    What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
    fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made
    for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
  assumes:
  - a question can be asked more than once about the same detail
  takeaway: Repeating a question implies the first answer was wrong, and the account moves toward whatever the asking 
    suggests.
  format: CHOICE
  question: Why does asking about the same detail nine times damage the account?
  choices:
  - Repetition signals that the earlier answer was not the one wanted
  - Each retelling wears the memory down until nothing specific is left
  - Witnesses become irritated and stop cooperating with the interviewer
  - The later answers are recorded less carefully than the first
  answer: Repetition signals that the earlier answer was not the one wanted
  why: >
    A question asked again carries information: somebody was not satisfied. Adults shift under that pressure. A child witness
    shifts far more, and suggestibility rises with each repeated question, which is why guidance on interviewing children
    is largely a set of rules about not asking twice. The account does not decay so much as drift toward whatever the repeated
    asking implies, and every version after the first is a version produced under that pressure. It is also why the count
    of how often a question was put belongs in a review, and why nobody had counted it here.
  rebuttals:
  - Retelling does degrade an account, and the direction of the drift is what the repetition itself supplies.
  - Irritation is real and does not explain why the answers move in a particular direction.
  - The later answers were recorded carefully, which is how the drift is visible at all.

# What is inside each room the player walks into.
interiors:
  PERCEPT:
    caption: Measure the place, light it as it was, and see what an eye can do there.
    standLine: Ferrier Street at 1:1. Kerb, doorway, column, and a mark on the floor at the surveyed distance.
    station:
      kind: panel
      title: Bay light and range
      rows:
      - {label: Illuminance at the doorway, value: 2.1 lux, status: low}
      - {label: Range to the mark, value: 34.2 m, status: normal}
      - {label: Lamp channel, value: column 4471 dark, status: alarm}
  MEMORY:
    caption: An account is produced, by a method, in a room, with people in it.
    standLine: Cardoza, 18 November 2019, ninety minutes. The last recording taken before the photograph.
    station:
      kind: panel
      title: Interview record
      rows:
      - {label: Delay to first full account, value: 4 days, status: high}
      - {label: Third party present, value: 'yes, throughout', status: alarm}
      - {label: Free recall before questions, value: 11 seconds, status: alarm}
  IDENT:
    caption: How the six were chosen, who stood behind the witness, and what was said after.
    standLine: The array of 4 December 2019, as laid out, with the form that has no caution on it.
    station:
      kind: panel
      title: Array 2019-114
      rows:
      - {label: Members shown, value: 6 together, status: high}
      - {label: Functional size, value: 1.5, status: alarm}
      - {label: Administrator blind, value: 'no', status: alarm}
  BRAIN:
    caption: What arousal and exhaustion do to what gets in and what comes out.
    standLine: Custody log, 3 December 2019. Nineteen hours, no representation, one agreement.
    station:
      kind: vitals
      title: State reconstruction
      rows:
      - {label: Hours awake at agreement, value: 19, status: alarm}
      - {label: Interval to withdrawal, value: 8 h, status: high}
      - {label: Detail added by the suspect, value: none, status: normal}
  SOCIAL:
    caption: What other people do to an account, a decision and a report.
    standLine: Twelve volunteers, a transcript and a camera. What a room does to a claim repeated in it.
    station:
      kind: panel
      title: Deliberation panel 14
      rows:
      - {label: Repetitions of the key phrase, value: 11, status: high}
      - {label: Panels reaching agreement, value: 9 of 12, status: normal}
      - {label: Qualifications surviving to verdict, value: 1 of 6, status: alarm}
  MEASURE:
    caption: What a number about a person is entitled to claim, and what the file says instead.
    standLine: The Ward file, in the order it arrived. Nothing in it has been reordered or corrected.
    station:
      kind: panel
      title: File audit
      rows:
      - {label: Assertions with a measurement behind them, value: 4 of 19, status: alarm}
      - {label: Documents dated independently, value: 12 of 19, status: high}
      - {label: Pages altered since receipt, value: 0, status: normal}

# What each place says when the player reads it.
# --------------------------------------------------------------- the warm-ups
warmups:
  greet:
    title: A unit assembled for one case, and the review starts Monday
    why: >-
      The integrity unit is a psychologist, an engineer, two lawyers and a retired detective who have never worked a case
      together. Ntuli, the deliberation study coordinator, wants you known to as many of them as you can before the file is
      opened, because every finding in this review depends on one of them accepting what another one measured.
  trial-near:
    title: Walk the hall, and the corner they rebuilt in it
    why: >-
      One hall, with the Ferrier Street corner rebuilt across the end of it and the identification distance painted on the
      floor. Walk it once. The whole review turns on what could be seen from one spot at one light level, and standing on
      the mark is worth more than any number about it.
  follow:
    title: Walk the route the witness walked, at her pace
    why: >-
      Cardoza came out of the shop, crossed to the corner and stopped. The reconstruction is only worth what the route is
      worth. Stay with whoever is walking it and stay behind them — somebody walking in front of the sightline is standing
      exactly where the argument is.
  hunt:
    title: Six pieces of the 2019 file, and the box holds four
    item: {name: file piece, plural: file pieces}
    why: >-
      The array form, the custody log, the two contemporaneous statements, the lux survey and the officer's notebook. Four
      are in the box. Until the other two are found the review cannot say whether the procedure was followed or whether the
      record of it is simply missing, and those are different findings.
  canvass:
    title: Who on Ferrier Street was actually asked in 2019
    why: >-
      The file names two witnesses and the street had more people on it than that. Ask along the road until enough answers
      have come back to say whether nobody else saw anything or whether nobody else was asked.
  evade:
    title: The campaign spokesman who wants a line before the report
    why: >-
      He has been outside the hall since eight wanting something quotable about the light measurement, and a half-finding
      in a newspaper is a finding the board can no longer consider calmly. Keep clear of him until the report is signed.
  tag:
    title: Catch Bekele before the bay is reset
    why: >-
      Bekele, the reconstruction technician, has the meter log from this morning's run at the corner's illuminance, and the
      bay is being reset for the afternoon in ten minutes. Once the lamps are changed the run cannot be repeated at that level,
      and the log is the only record that it was ever held there.

copy:
  PERCEPT: <p>The reconstruction bay. Ferrier Street at full size, built to the survey rather than to the photographs, 
    with the lamps on a dimmer that reads in lux. The mark on the floor is where the witness stood.</p>
  MEMORY: <p>The interview suites. One-way glass, two chairs, a recorder with a visible clock, and a rule on the wall 
    about who else may be in the room.</p>
  IDENT: <p>The identification suite. The 2019 array, the form it was recorded on, and the rig the unit uses to run 
    volunteers through both procedures.</p>
  BRAIN: <p>The physiology bay. Custody logs on one screen, a dark adaptation booth through the door, and the clock that
    turns an interview transcript into a state.</p>
  SOCIAL: <p>The deliberation room. Twelve chairs and a camera. Nobody in here decides anything about anybody, and it is
    said out loud before every session.</p>
  MEASURE: <p>The data room and the store behind it. Norms, reliability coefficients, and a file that has been kept in 
    the order it arrived because a tidy file is an edited one.</p>
  INT2: <p>The second interview suite. Kept free for the recordings that are only listened to, and the clock on its 
    recorder has been four minutes fast since March.</p>
  BOOTH: <p>The dark adaptation booth. A bench, a chart on the far wall, and twenty minutes. Everybody who works here 
    has sat in it and everybody was surprised by how long it took.</p>
  QUIET: <p>The quiet room. The only room in this building where nobody is being reviewed, and the only one with a rule 
    against talking about a case.</p>
  BAYE: <p>The survey and equipment store. Tripods, levelling staffs, lamp channels and a lux meter that is signed out 
    more often than anything else on the shelf.</p>
  OBS: <p>The observation room, behind one-way glass. The glass is one way and the wall is not, which is written on a 
    card by the door.</p>
  RECS: <p>The records store. Three hundred and eighteen boxes in the order they arrived, four destruction requests 
    refused, and the refusals filed in box twelve.</p>


  - group: IDENT
    task: Predict the description-only suspect-pick share, run the forty-person check, then spend the measurement to see
      where the choices actually landed.
    title: Predict it before the forty cards turn
    reason: >-
      The forty description-only cards are ready to turn, and a prediction made first is worth more than one made after
    place: Identification Suite
    scene: Marcus Ilori lays Cardoza's first description beside the six 2019 photographs at the identification bench. 
      Forty mock-witness cards are face down beside them. Nobody holding a card has seen the robbery.
    guide: >-
      Commit to the share of mock witnesses you expect to pick the suspect from the description alone, before any card is
      turned. It cannot be changed afterwards. Then turn the forty cards and read the measured distribution. Nobody holding
      a card saw the robbery, so what comes back measures the array rather than anybody's memory.
    background:
    - >-
      What a fair array looks like in numbers. Six photographs, one of them the suspect, and a description that does not single
      anybody out should send about one witness in six to each. A share much higher than that means the array itself is pointing,
      and the description is doing the work rather than the memory.
    - >-
      Why mock witnesses who saw nothing are the right test. They cannot recognise anybody, so anything above chance comes
      from the procedure: fillers who do not match the description, a photograph that stands out, an instruction that implies
      the offender is present.
    - >-
      Why the prediction is locked first. A distribution read and then explained is a distribution that can be made to support
      whatever the reader already believed. Committing first is what makes the forty cards evidence about the array.
    assumes:
    - a lineup is built to be consistent with the description already given
    takeaway: A procedure can be tested by people who know the description but not the event; where they land measures 
      the array rather than memory.
    format: VERIFY
    question: Functional size is how many of the six were real alternatives to somebody working from the description
      alone. What suspect-pick share do you expect from forty mock witnesses, and does the measured spread support a
      fair six-person array?
    verify:
      decision: Does the description-only mock-witness test behave like a fair six-person array?
      hint: Lock a predicted share before the cards turn. Then run all forty volunteers and spend the one check on the 
        distribution of picks, not just on whether the run completed.
      prediction:
        min: 0.2
        max: 0.8
        unit: suspect-pick proportion
        step: 0.01
      intervention:
        id: mock_run
        label: Run 40 mock witnesses from the first description only
        n: 40
      checks: 1
      truth: 0.65
      passRatio: [0.8, 1.2]
      measurement:
        label: Count picks by photograph
        cost: 1
    answerText: Measure the picks by photograph. Twenty-six of forty mock witnesses choose Ward from the description 
      alone, a suspect-pick share of 0.65. That result is far from an even six-way spread and becomes the input to the 
      later functional-size calculation.
    why: A fair lineup should not point to the suspect through the description alone. Mock witnesses are useful because 
      they never saw the event. They can respond only to the description and the photographs. If one photograph attracts
      most of them, the array is doing part of the identifying. Cardoza's description is broad, so visual matching alone
      cannot establish fairness. Measuring where mock witnesses land turns that concern into an empirical property of 
      the procedure.
  # ---------------------------------------------------------------- day 3
- title: Where does this test fall to chance?
  objective: Use a small reconstruction study to bound identification performance without turning one sample into a 
    universal human cutoff.
  briefing: The bay can show where this group’s performance begins to look like guessing. It cannot draw a universal 
    line beyond which nobody can recognise a face.
  stake: >-
    Wednesday. Twelve volunteers have worked the reconstruction at seven marked distances. They could describe something from
    every mark. Describing and identifying are not the same task. The file treats them as one. Today you find the first mark
    where this small sample stops beating the one-in-six chance rate. Then you learn what a dim scene trades away. You also
    learn why I saw his face is really four claims tied together. Twelve people is a small sample. So what comes out is a
    bound the review can use, not a magic distance at which people stop knowing a face. Say which of the two it is tonight.
  takeaway: There is a distance at which a face becomes a shape, and it is closer than anybody expects.
  stops:
  - group: PERCEPT
    task: Find the first station where this small sample is no longer clearly above the six-way chance baseline.
    title: Where this sample stops beating chance
    reason: >-
      Bekele has twelve volunteers' results at seven marks, and the bay is reset tomorrow morning
    place: Reconstruction Bay
    scene: >-
      Twelve volunteers stood at each of seven marks down the bay floor and described a face at the far end. Later each tried
      to pick that person out of six photographs. Describing and identifying are not the same task. Picking one of six by
      chance alone succeeds about twice in twelve, and Bekele wants the distance where naming stops beating that.
    guide: >-
      Nothing is read for you. Press Read on any mark and it reports what the twelve described from there, and how many of
      them later picked the right face out of six. Take at least three. Judge the naming rate against what chance alone would
      give rather than against zero. Then click the first mark where naming has stopped working, and commit.
    background:
    - >-
      Why the two tasks come apart. Build, clothing, gait and hair are separate features, and any one of them survives a long
      look at low detail. Recognising a particular face depends on the relations between its parts — the spacing of the eyes
      against the width of the nose — and those relations blur first. So a witness can be entirely accurate about a jacket
      at a distance where the face was never available at all.
    - >-
      What chance looks like in this data. Twelve people picking blindly from six photographs will average two correct, and
      will sometimes give three or one. A station scoring two out of twelve is therefore reporting no identification at all,
      and one scoring three is reporting almost none. Zero is not the benchmark, and treating it as one makes a witness sound
      better the further away they stood.
    - >-
      Why the distance is worth writing down. Testimony arrives as a description and an identification in one sentence, and
      a jury hears both as one claim. Knowing the distance at which naming failed in a controlled test on this same bay gives
      the court a number to put against the sentence rather than an impression.
    takesAsRead:
    - "Storage and forgetting: the curve is steep at the start"
    assumes:
    - features can be described without the person being identifiable
    - the same face was used at every distance
    takeaway: A controlled reconstruction can bound performance under its own conditions; it does not create a universal
      distance limit.
    format: PROBE
    question: Each later pick is a retrieval: the face is rebuilt each time from what the eye actually got, not played
      back from a recording. At which station does this small sample first perform no better than the six-way chance
      expectation?
    answerText: "At twenty metres the observed count is two of twelve, exactly the six-way chance expectation. With only twelve
      volunteers, that is evidence that performance has become weak here—not a universal twenty-metre cutoff for face identification."
    why: Large features such as build, clothing and gait survive distance longer than identity-carrying facial 
      relationships. In this authored reconstruction, correct naming falls to two of twelve at twenty metres, while 
      broad description survives. Because the sample is small, the scientifically defensible conclusion is that 
      identification performance is no longer clearly above chance under these test conditions. The study does not 
      establish a hard human recognition distance, and it does not by itself tell what Cardoza saw in 2019.
    probe:
      chainLabel: Mark
      stations:
      - id: M5
        label: 5 m
        reading: eye colour, a scar, the shape of the mouth
        expected: 11 of 12 named the right face
        load: well above chance
      - id: M10
        label: 10 m
        reading: features described, no eye colour
        expected: 10 of 12 named the right face
        load: well above chance
      - id: M15
        label: 15 m
        reading: face described in general terms
        expected: 7 of 12 named the right face
        load: above chance
      - id: M20
        label: 20 m
        reading: build, jacket, hair; face described with confidence
        expected: 2 of 12 named the right face
        load: at chance for six alternatives
      - id: M25
        label: 25 m
        reading: build, jacket, hair
        expected: 2 of 12 named the right face
        load: at chance for six alternatives
      - id: M30
        label: 30 m
        reading: build and jacket
        expected: 2 of 12 named the right face
        load: at chance for six alternatives
      - id: M40
        label: 40 m
        reading: a figure, moving
        expected: 1 of 12 named the right face
        load: at chance for six alternatives
      target: M20
      minReadings: 3
  - group: BRAIN
    task: Establish what the eye gives up in a dark street
    title: What the dark takes
    reason: >-
      The bay is held at five lux tonight, which is the only chance to ask what a dark street costs the eye
    concept: "Rods, cones and scotopic vision: what the dark takes away"
    place: Dark Adaptation Booth
    scene: Priya Raghunathan, the psychophysiologist, shuts the booth door and waits ten minutes. She can then find the 
      chart on the far wall but cannot name its colours. She wanted the room to experience that loss before reading 
      about it.
    guide: >-
      Four things a dark scene might take away. Ask of each whether it fits what the two receptor types do. Cones give colour
      and fine detail and need light. Rods pool signals, so they buy reach and lose resolution. That means a dark street does
      not simply dim a face. It removes some things and leaves others intact.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
      — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
      belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
      a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here,
      before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the
      signal taken out of them deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
      fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made
      for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
    takesAsRead:
    - Illuminance, and the light a scene actually had
    assumes:
    - the retina has two kinds of light-sensing cell with different jobs
    takeaway: Sensitivity in a dark place is bought, and the price is paid in what the eye can no longer separate.
    format: CHOICE
    question: What is most strongly degraded as vision shifts from cone-dominated toward rod-dominated vision in very 
      dim light?
    why: Cones provide colour and fine central detail, but they need more light. Rods work when illumination falls and 
      trade detail for the ability to see at all. They also pool signals across retinal areas, which makes the result 
      coarser. A dark street therefore does not simply dim a face. It removes colour and fine relationships while 
      preserving movement, outline and broad form. That pattern can support confident description of some features while
      leaving identification detail weak.
    choices:
    - Colour discrimination and fine spatial detail
    - Movement, because motion detection needs cone vision
    - Peripheral vision, because rods disappear there first
    - Distance judgment, because depth cues require bright light
    answer: Colour discrimination and fine spatial detail
    rebuttals:
    - Motion is detected well in low light; rods are highly sensitive to change.
    - Rods dominate the periphery, so peripheral detection survives better than fine central detail.
    - Depth uses several cues and does not disappear simply because cones are no longer carrying colour.

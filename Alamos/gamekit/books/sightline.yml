    why: "Confidence has its strongest relation to accuracy when it is recorded immediately after an uncontaminated identification.
      Later certainty includes everything learned after the choice. That can include feedback, charging decisions and repeated
      commitment to the identification. The 4 December form preserves Cardoza's own words: 'maybe, number four.' The 26 December

# What each place says when the player reads it.
copy:
  PERCEPT: <p>The reconstruction bay. Ferrier Street at full size, built to the survey rather than to the photographs, with the lamps on a dimmer that reads in lux. The mark on the floor is where the witness stood.</p>
  MEMORY: <p>The interview suites. One-way glass, two chairs, a recorder with a visible clock, and a rule on the wall about who else may be in the room.</p>
  IDENT: <p>The identification suite. The 2019 array, the form it was recorded on, and the rig the unit uses to run volunteers through both procedures.</p>
  BRAIN: <p>The physiology bay. Custody logs on one screen, a dark adaptation booth through the door, and the clock that turns an interview transcript into a state.</p>
  SOCIAL: <p>The deliberation room. Twelve chairs and a camera. Nobody in here decides anything about anybody, and it is said out loud before every session.</p>
  MEASURE: <p>The data room and the store behind it. Norms, reliability coefficients, and a file that has been kept in the order it arrived because a tidy file is an edited one.</p>
  INT2: <p>The second interview suite. Kept free for the recordings that are only listened to, and the clock on its recorder has been four minutes fast since March.</p>
  BOOTH: <p>The dark adaptation booth. A bench, a chart on the far wall, and twenty minutes. Everybody who works here has sat in it and everybody was surprised by how long it took.</p>
  QUIET: <p>The quiet room. The only room in this building where nobody is being reviewed, and the only one with a rule against talking about a case.</p>
  BAYE: <p>The survey and equipment store. Tripods, levelling staffs, lamp channels and a lux meter that is signed out more often than anything else on the shelf.</p>
  OBS: <p>The observation room, behind one-way glass. The glass is one way and the wall is not, which is written on a card by the door.</p>
  RECS: <p>The records store. Three hundred and eighteen boxes in the order they arrived, four destruction requests refused, and the refusals filed in box twelve.</p>


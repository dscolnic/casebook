      asking the witness again. Recognition is the part that remains tied to memory and procedure."
    choices:
    - It states four separate things at once, so no one of them can be examined
    - It comes from the witness rather than from an expert, which juries weigh more heavily
    - It is emotional language, and emotional language dominates a deliberation
    - It is short, and short statements are recalled better than long ones at the end of a session
    answer: It states four separate things at once, so no one of them can be examined
    rebuttals:
    - Juries do weigh eyewitnesses heavily, and that is about the source of the claim rather than its structure.
    - The phrase is plain rather than emotional, which is part of why it passes unexamined.
    - Brevity aids recall, and a longer sentence stating the same bundle would cause the same problem.
  # ---------------------------------------------------------------- day 4
  - group: PERCEPT
    task: Hold a deliberately chosen dim-light test condition steady so the bay’s results are interpretable.
    title: Hold a dim-light test steady
    reason: >-
      Before any result from this bay counts, the bay has to be shown holding the light level it claims
    concept: "Illuminance, and the light a scene actually had"
    place: Reconstruction Bay
    scene: Before anyone claims to have reconstructed 2019, the bay team runs a control at five lux. Lamps warm and 
      drift, somebody opens the corridor door, and the dimmer is the only control. This is a calibration drill, not yet 
      a claim about the robbery night.
    guide: >-
      Hold the bay at the five-lux test condition, inside the band on the meter. The point is to prove the reconstruction
      can hold a stated condition before the team decides what historical condition belongs in it.
    background:
    - >
      Why this has to be held rather than set. Lamp output and stray corridor light change during a run. A reconstruction
      that drifts cannot tell whether the outcome changed because of the participant or because the room changed.
    - >
      Why the level is labelled a test condition. Five lux is deliberately dim and useful for showing how visual performance
      changes, but the historical light level on 14 November has not yet been established. A stable model can still be a model
      of the wrong night.
    - >
      Why the door is a disturbance. Stray light adds to the scene and cannot be subtracted from a participant’s response
      afterwards. The meter is what makes the run repeatable.
    assumes:
    - a scene can be reproduced at a measured light level
    takeaway: A reconstruction can be perfectly controlled and still model the wrong historical condition; control and 
      historical validity are separate questions.
    format: HOLD
    question: Hold the bay at the five-lux test condition while the walk is done.
    answerText: Inside the band for most of the walk, with the dimmer set against each drift rather than corrected only 
      after the meter has moved.
    why: >-
      The value of a reconstruction begins with control. The bay first has to show that it can hold a stated light level while
      lamps warm and doors change the stray light. Five lux is a deliberately chosen dim test condition, not the claimed 2019
      illuminance. That distinction matters: repeatability answers whether the experiment is controlled; the maintenance record
      and scene evidence answer whether the chosen condition belongs to the historical night.
    hold:
      quantity: Dim-light test illuminance
      unit: lux
      control: Dimmer
      hold: 5.0
      band: 0.8
      narrowTo: 0.4
      duration: 45
      direction: raise
      authority: 0.1
      pass: 0.8
      hint: The lamps and stray light drift. Hold the five-lux test condition rather than chasing the meter after the 
        fact.
      disturbances:
      - {label: Lamps warm and output climbs, at: 4, amount: 0.09}
      - {label: Corridor door closes again, at: 20, amount: -0.15}
      - {label: Second bank of lamps reaches temperature, at: 38, amount: 0.135}
      commit: Report the walk
- title: If the lamp was working
  objective: Model the light implied by the file without mistaking a correct calculation for proof that the lamp was 
    actually on.
  briefing: The scene report says the lighting was “normal.” Today you calculate what that would mean if the listed 
    streetlamp was working—and leave the premise open.
  stake: >-
    Thursday. The unit can settle some of this without asking Cardoza a thing. That is right about the method. It is not yet
    right about the answer. The scene report says the street light was normal. Nobody put a meter on it. Nobody has found
    the ticket that would prove it either. Today you work out how much light the doorway had if column 4471 was on. Then
    you keep that math apart from the word normal, which is not a number. You also ask what fear does to what a person takes
    in. Do not turn a rule about people at large into a claim about one witness. By tonight the light claim is a test waiting
    on a paper trail, not a fact copied off a report.
  takeaway: Most of what decides an identification can be measured without ever asking the witness again.
  stops:
  - group: PERCEPT
    task: Work out the illuminance on the doorway from the column
    title: How much light the corner had
    reason: >-
      The utility specification for column 4471 is the one lighting number in the file that can still be checked
    place: Reconstruction Bay
    scene: |-
      Frey has the column's specification from the utility: a 1,800 candela lantern, twelve metres from the shop doorway along the kerb. The scene report's word for this is "normal".
    guide: >-
      Five numbers, and three of them are the witness's distance and two figures offered for comparison. Ask of each whether
      this calculation needs it. The distance that matters runs from the lamp to what it lights, not from the eye to the scene.
      And note what the answer is not: it assumes the lantern was on that night.
    background:
    - >-
      Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here
      has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs, and
      whether the size of the answer looks right once they are in place.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label
      is how a unit mismatch, or a quantity belonging to a different part of the problem, is caught before it is placed —
      which is the habit this format exists to build.
    assumes:
    - light from a single source spreads over an area that grows with distance
    takeaway: Illuminance is set by the distance from the lamp to the thing lit, not by the distance to whoever is 
      looking.
    format: BALLPARK
    question: Estimate the illuminance the column put on the doorway when it was working.
    answerText: 1800 ÷ 12² = 12.5 lux if column 4471 is working. That is the modeled lamp contribution, not proof that 
      the lamp was on that night.
    why: Light from a source spreads over increasing area, so illuminance falls with the square of distance. The 
      relevant distance runs from the lantern to the doorway it lights. Cardoza's distance belongs in the angular-size 
      calculation instead. A working 1,800-candela lantern at twelve metres gives 12.5 lux. That is dim street lighting,
      not darkness. The calculation is sound. Whether the lantern was actually on that night is a separate factual 
      question the calculation cannot answer.
    estimate:
      prompt: Column 4471 carries an 1,800 candela lantern and stands twelve metres from the shop doorway. Cardoza was 
        twenty-two metres from the doorway, on the far pavement.
      question: Choose the intensity of the lamp and the distance from it to what it is lighting.
      labels:
      - 1800  (cd, the lantern's luminous intensity)
      - 12  (m, from the column to the doorway)
      - 22  (m, from Cardoza to the doorway)
      - 500  (lux, a supermarket aisle)
      - 5  (lux, a typical lit street)
      values: [1800, 12, 22, 500, 5]
      slots: 2
      template: "{0} ÷ ({1} × {1})"
      formula: a/(b*b)
      correct: [0, 1]
      target: 12.5
      tolerance: 2.5
      units: lux
      relationship: Illuminance E = I / d², with E in lux, I the source intensity in candela and d the distance from the
        source to the lit surface.
      solution: 1800 ÷ 12² = 1800 ÷ 144 = 12.5 lux.
      explanation: About 12.5 lux with the lantern working. The twenty-two metres belongs to the observer and therefore 
        to the angle calculation, not this lighting calculation. The arithmetic answers what the lamp would deliver if 
        lit. The utility record later answers whether that premise was true on 14 November.
      givens:
      - Column 4471 carries an 1,800 candela lantern
      - The column stands 12 m from the shop doorway
  - group: BRAIN
    task: Which explanation fits all four readings rather than the loudest one?
    title: The middle of the event and its edges
    reason: >-
      Raghunathan has four parts of the account on one screen and wants a mechanism that fits all four
    concept: Weapon focus, and what an arousing object does to a description
    place: Physiology Bay
    scene: Priya Raghunathan has four parts of Cardoza's account on the screen. One shows detailed recall, one shows 
      nothing, one is wrong, and one was never mentioned. She wants one mechanism that fits the whole pattern.
    guide: >-
      Four readings, and one of them is an absence. Nothing at all about the second man. Ask of each candidate whether it
      explains dense detail in one place and nothing in another. Two options say the account is bad throughout, which the
      stable broad features contradict. The pattern is structured, and a structured pattern has a mechanism.
    background:
    - >-
      Why the unremarkable readings decide it. The salient reading is what draws attention, and it is usually consistent with
      several explanations at once, which is why it rarely settles anything. The readings that discriminate are the ones a
      candidate predicts should have moved and which have not: a normal value is a positive result against every mechanism
      that would have disturbed it.
    - >-
      How to work the candidates. Take each mechanism and predict the panel it implies before you look at the panel again
      — which readings it drives, in which direction, and by roughly how much. Then compare. Working that way round is what
      separates a diagnosis from a rationalisation, because the prediction is made before the data is consulted.
    - >-
      Why only one candidate survives. Several will account for part of the panel, deliberately so, and a partial fit is exactly
      what a confident wrong answer feels like from the inside. When two remain, look for the reading on which their predictions
      differ and let it decide. If no reading separates them you have not finished reading the panel.
    assumes:
    - a threat triggers a fast alarm response before any decision is made
    - attention narrows under threat
    takeaway: A record dense in one place and empty in another is telling the review where a witness was looking, not
      that the whole account is worthless.
    format: DIAGNOSIS
    why: 'Threat can draw attention toward the most urgent object and reduce processing of other information. That makes weapon-focus-like
      trade-offs a plausible explanation for a record rich in central threat details and weaker elsewhere. But it is a tendency,
      not a rule that tells the review exactly what Cardoza encoded. The point of the pattern is to generate a testable vulnerability:
      peripheral and facial details deserve more caution, while later chronology is still needed to determine whether any
      particular detail changed after the event.'
    headline: The account is minutely detailed in one place and empty in others, and both are being read as 
      unreliability.
    readings:
    - zone: Described in detail
      label: The bag and the hand holding it
      value: nine specific details
      status: alarm
    - zone: Not described
      label: What the second man was wearing
      value: nothing at all
      status: alarm
    - zone: Reported wrongly
      label: Duration of the event
      value: "\"a couple of minutes\""
      status: high
    - zone: Stable across accounts
      label: Build, jacket, direction of travel
      value: unchanged in three tellings
      status: normal
      note: no drift between November and December
    choices:
    - label: The account is unreliable throughout
      mechanism: A witness who is wrong about one thing is wrong about everything.
    - label: Attention narrowed onto the threat
      mechanism: What was attended to is detailed, peripheral details were less likely to be encoded well, and time is 

# Sightline — the Hallam Conviction Integrity Unit, and 15 working days to
# report on State v. Elias Ward.
#
# Written to gamekit/tools/BOOK_TEMPLATE.md. The place is themes/sightline/plan.js;
# the arc it follows is in ../GAME_IDEAS.md under "Sightline".
#
# The argument: Baptiste holds that the procedure is already unrecoverable and
# that every month spent proving it again is a month of somebody's sentence.
# Okada holds that the only uncontaminated account of that night is a perishable
# thing, and that asking Cardoza again is not free. Baptiste is right on day 4.
# Okada is right on day 12.
#
# The timeline the cards are checked against:
#   14 Nov 2019, 21:40   the robbery at Ferrier Street and Wickham Row
#   2–21 Nov 2019        column 4471 out — the utility's own ticket
#   18 Nov 2019          Cardoza's first full interview, 4 days after
#   19 Nov 2019          the Hallam Register prints a photograph of Ward
#   4 Dec 2019           the six-photograph array, administered by Loomis
#   26 Dec 2019          the "absolutely certain" statement, 3 weeks after
#   June 2020            conviction; 14 years, of which 7 are served
#   now                  15 working days to the review board

theme:
  id: sightline
  title: Sightline
  subtitle: Review Analyst · Conviction Integrity Unit

groups:
  - id: PERCEPT
    code: PERCEPT
    name: Perception & the Scene
    color: '#2f6f9f'
    desc: What an eye can take from a place, at that distance and in that light.
    defaultLeader: frey
    milestones: [Measure the place, Light it as it was, Find the limit, Ready to hand over]
  - id: MEMORY
    code: MEMORY
    name: Memory & Interview
    color: '#7a4fa3'
    desc: What happens to an account between the night and the question.
    defaultLeader: okada
    milestones: [Date the account, Find what arrived later, Separate the sources, Ready to hand over]
  - id: IDENT
    code: IDENT
    name: Identification Procedure
    color: '#b3462f'
    desc: How the six were chosen, who stood behind the witness, and what was said after.
    defaultLeader: ilori
    milestones: [Rebuild the array, Test it on strangers, Date the certainty, Ready to hand over]
  - id: BRAIN
    code: BRAIN
    name: Stress, Sleep & the Body
    color: '#1f7a6b'
    desc: What arousal and exhaustion do to what gets in and what comes out.
    defaultLeader: raghunathan
    milestones: [Read the physiology, Reconstruct the hours, Weigh the state, Ready to hand over]
  - id: SOCIAL
    code: SOCIAL
    name: Influence & the Room
    color: '#b0762a'
    desc: What other people do to an account, a decision and a report.
    defaultLeader: baptiste
    milestones: [Find the influence, Name who was present, Test the room, Ready to hand over]
  - id: MEASURE
    code: MEASURE
    name: Testing & Records
    color: '#5b6a72'
    desc: What a number about a person is entitled to claim, and what the file says instead.
    defaultLeader: weill
    milestones: [Read the record, Check the instrument, State the strength, Ready to hand over]

roster:
  - id: baptiste
    name: Ines Baptiste
    role: Unit Director
    division: SOCIAL
    bio: |
      Ran a public defender's office for eleven years before the unit existed,
      and took this job because the cases she lost were not lost on the facts.
      She reads a file for the procedure first and the story second.

      Her argument with the psychologists is the same one every week. A
      procedure that cannot support a conviction has already failed, and the
      months spent proving it a second way are months a man serves. She is not
      arguing that Ward is innocent. She is arguing that nobody can say.

      Her limit is that a review board is not a jury and will not be hurried.
      A recommendation it does not believe is a recommendation it declines, and
      the next date on the calendar after that is 2033.
    quiz:
      - q: Why does Baptiste treat another month of work as a cost rather than as care?
        a: The sentence runs while the unit is careful
        wrong:
          - A review board loses interest in any case that has been under examination for longer than a year
          - Evidence gathered late in a review is inadmissible before the board that commissioned it
          - Witnesses become unwilling to cooperate once a review has run past its original deadline
  - id: okada
    name: Dr. Ren Okada
    role: Memory Scientist
    division: MEMORY
    bio: |
      Studies what happens to an account in the weeks after the event, which in
      practice means studying what interviewers do to it. He has testified for
      both sides and describes that as the only defensible arrangement.

      He treats Alma Cardoza's November 2019 interview as a specimen: the last
      record of that night taken before a photograph, a lineup and a courtroom
      had all had a turn at it. Asking her again in 2026 does not recover the
      night. It produces a 2026 account and destroys the comparison.

      His limit is that he can say an account is contaminated and not what the
      uncontaminated version would have been. He is the reason the unit is slow
      and he agrees that being slow has a price.
    quiz:
      - q: Why does Okada object to re-interviewing Cardoza rather than welcoming the extra evidence?
        a: A new account cannot be compared with one it has already been influenced by
        wrong:
          - Witnesses interviewed more than twice are barred from giving evidence at a review hearing
          - Seven years is long enough that no useful detail of any kind survives in memory
          - An interview conducted by a review unit carries less weight than one taken by police
  - id: frey
    name: Dr. Halina Frey
    role: Vision Scientist
    division: PERCEPT
    bio: |
      Measures what an eye could have done, which is a narrower claim than what
      a person saw and a much harder one to argue with. She carries a lux meter
      in a coat pocket and has never once been asked for it politely.

      Her interest in this case began with a number nobody had checked. The file
      says twenty-two metres. The distance decides what a face is at that range,
      and a face at the resolution limit is a shape with hair on it.

      Her limit is that the eye is not the whole of seeing. She can put a bound
      on what arrived at the retina and say nothing at all about what the brain
      then made of it, which is Okada's half of the corridor.
    quiz:
      - q: Why does Frey insist a measured distance settles more than an argument about eyesight does?
        a: Distance sets the angle a detail arrives at, whatever the eye behind it
        wrong:
          - Eyesight varies so little between adults that it can be treated as identical for everybody
          - Courts have ruled that measured distances outrank all other forms of evidence about a scene
          - An eye test taken seven years later cannot be admitted in any proceeding
  - id: ilori
    name: Marcus Ilori
    role: Identification Procedures Adviser
    division: IDENT
    bio: |
      Nineteen years a detective, and ran identification parades the way the
      1990s ran them: his own suspect, his own witness, his own encouragement.
      He now trains the officers who are not allowed to do any of that.

      He is careful about how he says it. Nobody he worked with was cheating.
      The procedure let an honest belief leak out through a pause, a repeated
      photograph, a "take your time" that landed on the fourth face, and the
      point of the reforms is that honesty was never enough.

      His limit is that he liked being right, and he knows what that felt like
      from the inside. He is the person in the building least surprised by
      Loomis and least willing to talk about her.
    quiz:
      - q: Why does Ilori argue that an honest administrator is not enough protection?
        a: A belief reaches the witness through pauses and small encouragements
        wrong:
          - Administrators who believe in the suspect are more likely to falsify the paperwork afterwards
          - An honest officer will usually decline to run the procedure at all
          - Witnesses are able to detect dishonesty and adjust their answers accordingly
  - id: raghunathan
    name: Dr. Priya Raghunathan
    role: Psychophysiologist
    division: BRAIN
    bio: |
      Works on what arousal does to encoding, and on the flatter, duller thing
      that eighteen hours awake does to a person's ability to weigh anything at
      all. Both halves of this case need her and for opposite reasons.

      She is precise about arousal because the popular version is wrong in both
      directions. Fear does not print a scene into memory and it does not erase
      one. It narrows what is attended to, so the middle of the event is sharp
      and the edges were never encoded.

      Her limit is that she cannot read a state off a transcript. What she has
      of the interrogation room is a clock, a custody log and the fact that
      nobody offered Ward a bed for nineteen hours.
    quiz:
      - q: Why does Raghunathan reject the idea that fear makes a memory more complete?
        a: Fear selects part of a scene, and the rest is not stored at all
        wrong:
          - Memories formed under fear are stored in a separate system that decays faster than ordinary memory
          - People under threat close their eyes for most of the event and encode almost nothing
          - Fear has no measurable effect on memory in either direction once the event has ended
  - id: weill
    name: Dr. Tomas Weill
    role: Psychometrician
    division: MEASURE
    bio: |
      Builds and breaks measurements of people for a living. He is the person
      who asks what the number would have been if the same person were measured
      twice, which is a question most files have never been asked.

      His standing objection to this case is that its central quantity was never
      measured at all. "Absolutely certain" is not a scale. It was recorded once,
      three weeks after the identification and after a conversation, and the
      file treats it as though it had been read off an instrument.

      His limit is that he is not interested in what happened on Ferrier Street.
      He is interested in whether any of the quantities in the file mean what
      they are being used to mean, which makes him unpopular in a room that
      wants to know who did it.
    quiz:
      - q: Why does Weill refuse to treat Cardoza's "absolutely certain" as a measurement?
        a: It was recorded once, after feedback, on no defined scale
        wrong:
          - Statements of certainty are excluded from psychological evidence by professional guidelines
          - Certainty can only be quantified using specialist equipment that was unavailable in 2019
          - A witness is never able to report their own confidence with any accuracy at all
  - id: solomon
    name: Yara Solomon
    role: Case Analyst
    division: MEMORY
    bio: |
      Reads files for a living and has read this one eleven times. She found the
      utility ticket for column 4471 in a folder of unrelated correspondence,
      because she reads the unrelated correspondence.

      Her method is dates. Every claim in a file has a date on which somebody
      first wrote it down, and half the arguments in this building dissolve when
      the two dates are put side by side. The certainty statement is three weeks
      later than the identification it describes, and nothing in the file says so.

      Her limit is that a date is not a motive. She can show that the account
      moved and cannot show what moved it, which is the difference between her
      half of the work and Okada's.
    quiz:
      - q: Why does Solomon date every claim in the file rather than reading it as a narrative?
        a: A file reads as one moment when it was written across months
        wrong:
          - Undated documents are inadmissible in a conviction review and must be identified early
          - Narrative accounts are always less accurate than lists of dated facts
          - The order in which documents were filed is the order in which they were written
  - id: bekele
    name: Dawit Bekele
    role: Reconstruction Technician
    division: PERCEPT
    bio: |
      Built the corner in the bay: the shopfront, the kerb line, the doorway, and
      the column in the position the survey put it rather than the position the
      file drew it. He works from measurements and refuses to work from
      photographs, which is a slower way to be right.

      He surveyed Ferrier Street himself over two nights with the shop's
      permission and a tripod. The kerb has not moved since 2019 and neither has
      the doorway, which is why a reconstruction is possible at all.

      His limit is the light. The bay's lamps can be set to the illuminance the
      survey measured, and no rig can reproduce a sodium lamp that has been
      replaced with a different fitting.
    quiz:
      - q: Why does Bekele build from survey measurements rather than from scene photographs?
        a: A photograph has a lens, an exposure and a position nobody recorded
        wrong:
          - Photographs taken by police are routinely withheld from conviction review units
          - The colours in a photograph fade over the seven years since it was taken
          - A photograph cannot show the height of anything, only its width
  - id: loomis
    name: Karen Loomis
    role: Retired Detective
    division: IDENT
    bio: |
      Ran the six-photograph array on 4 December 2019, and everything she did
      that afternoon was permitted by the policy then in force. She knew which
      photograph was the suspect, because in 2019 the officer running the array
      always did.

      She has come in voluntarily twice. She remembers saying something after
      Cardoza chose, and she does not remember what, and she is the one who says
      that is the problem rather than the defence.

      Her limit is memory, and she knows exactly how that sounds. She is a
      witness to her own procedure, seven years on, with a reputation in it.
    quiz:
      - q: Why does Loomis treat her own inability to recall what she said as the important fact?
        a: A remark she cannot recall is one nobody can rule out
        wrong:
          - Officers are required by law to record every word spoken during an identification procedure
          - Anything she cannot remember was by definition too brief to have influenced anybody
          - Her recollection would be excluded from the review as an interested account
  - id: oyelaran
    name: Dr. Samuel Oyelaran
    role: Clinical Psychologist
    division: BRAIN
    bio: |
      Assesses whether somebody understood what was being asked of them, which
      in this file means the nineteenth hour of an interview conducted without
      counsel. He works from custody records, not from impressions.

      He is careful with the word trauma. Cardoza was frightened on Ferrier
      Street and has been frightened by this case since, and neither fact tells
      anybody whether she saw a face. Distress is real and it is not evidence
      about accuracy in either direction.

      His limit is that he never meets the people he writes about at the time
      that matters. Everything he assesses is seven years old and reaches him as
      paper.
    quiz:
      - q: Why does Oyelaran refuse to draw a conclusion about accuracy from Cardoza's distress?
        a: Being frightened says nothing about what was seen
        wrong:
          - Distress recorded years after an event is unrelated to the distress felt at the time
          - Clinical psychologists are not permitted to comment on the evidence of witnesses
          - Frightened witnesses are known to be less accurate than calm ones in every study
  - id: ntuli
    name: Grace Ntuli
    role: Deliberation Study Coordinator
    division: SOCIAL
    bio: |
      Runs the unit's mock deliberation panels: twelve volunteers, a transcript,
      and a camera. She is not trying to guess what the 2020 jury did. She is
      measuring what a room does to a claim that is repeated in it.

      What she reports most often is unwelcome. A confident identification does
      not have to persuade twelve people. It has to persuade three, after which
      the room's own agreement does the rest, and the panel remembers the
      certainty long after the qualifications have dropped out of it.

      Her limit is that volunteers know they are volunteers. Nobody in her room
      is deciding anything about anybody, and she says so before every session.
    quiz:
      - q: Why does Ntuli argue that a confident witness only has to persuade a few jurors?
        a: Once a few agree, the room's own agreement carries the rest
        wrong:
          - Juries in this jurisdiction are permitted to return a verdict on a majority of three
          - Jurors who disagree with the majority are removed from the deliberation room
          - A confident witness is usually the only evidence a jury is shown
  - id: achterberg
    name: Nell Achterberg
    role: Records Custodian
    division: MEASURE
    bio: |
      Holds the file, and holds it in the state it arrived in. Nothing in her
      store has been reordered, corrected or tidied, because a tidy file is a
      file somebody has edited and the edits are never written down.

      She is the reason the review has anything to work with. The utility ticket,
      the 2019 policy document, the custody log and the array photographs are
      all in the store because she refused four requests to destroy duplicates.

      Her limit is that she has what was sent. The array itself — the six
      photographs as they were laid out — exists as a photocopy of a photocopy,
      and nobody in 2019 recorded which order they were in.
    quiz:
      - q: Why does Achterberg refuse to tidy or reorder a file she is holding?
        a: Corrections leave no record of what was there before
        wrong:
          - Reordering documents is prohibited by the archive standard the unit is accredited to
          - A tidy file takes longer to search than one left in the order it arrived
          - Documents lose their legal status once they have been removed from their original folder

glossary:
  - name: Lux
    aliases: [lux, illuminance]
    def: A measure of how much light is falling on a surface; a supermarket aisle is about 500, a lit street about 5.
  - name: Acuity
    aliases: [acuity, visual acuity]
    def: How small a detail vision can separate, measured as an angle rather than as a size.
  - name: Cone
    aliases: [cone, cones]
    def: The retinal cell that carries colour and small detail, and needs a reasonably bright scene to work.
  - name: Rod
    aliases: [rod, rods]
    def: The other kind of cell in the retina, which still works when there is almost no light and reports shape and movement only.
  - name: Dark adaptation
    aliases: [dark adaptation, dark-adapted, adapted eye]
    def: The slow gain in what the eye can pick up in the dark, most of it within ten minutes and not finished for half an hour.
  - name: Encoding
    aliases: [encoding, encoded]
    def: What actually gets into memory at the moment of an event, which is only ever part of what was in front of the eyes.
  - name: Retrieval
    aliases: [retrieval, retrieved, recall]
    def: Bringing an account back, which rebuilds it from fragments rather than replaying a recording.
  - name: Attention
    aliases: [attention, attended, attending]
    def: The selection of one part of a scene for processing, at the cost of the rest of it.
  - name: Inattentional blindness
    aliases: [inattentional blindness, inattentional]
    def: Failing to register something in plain view because attention was on something else.
  - name: Weapon focus
    aliases: [weapon focus]
    def: The narrowing of attention onto a threatening or unusual object, at the cost of the face behind it.
  - name: Misinformation effect
    aliases: [misinformation effect, misinformation, post-event information]
    def: A detail that arrived after an event turning up in the account of the event itself.
  - name: Source monitoring
    aliases: [source monitoring, source of a memory]
    def: Keeping track of where a remembered detail came from, which fails more often than the detail itself does.
  - name: Co-witness contamination
    aliases: [co-witness contamination, co-witness, co-witnesses]
    def: Two accounts that have been compared with each other, after which their agreement says nothing.
  - name: Cross-race effect
    aliases: [cross-race effect, cross-race, own-race]
    def: The repeated finding that faces from a group a person has little experience of are harder to distinguish.
  - name: Flashbulb memory
    aliases: [flashbulb memory, flashbulb]
    def: A memory that feels photographic and detailed, and is no more accurate than an ordinary one.
  - name: Amygdala
    aliases: [amygdala]
    def: The structure that tags an event as threatening and drives the body's alarm response.
  - name: Cortisol
    aliases: [cortisol]
    def: The stress hormone released minutes into a threat, which sharpens the centre of an event and costs its edges.
  - name: Filler
    aliases: [filler, fillers]
    def: A person in a lineup whom the police know did not do it, included so that a choice means something.
  - name: Functional size
    aliases: [functional size]
    def: How many members of a lineup are genuine alternatives, found by handing the description to people who were not there.
  - name: Sequential presentation
    aliases: [sequential presentation, sequential, one at a time]
    def: Showing lineup members one after another, so each is judged on its own rather than against the rest.
  - name: Double-blind administration
    aliases: [double-blind administration, double-blind, blind administration]
    def: Running an identification with an officer who has not been told which member is the suspect.
  - name: Confidence inflation
    aliases: [confidence inflation, inflated confidence]
    def: The rise in a witness's stated certainty after being told, in any form, that they chose the expected person.
  - name: Hit rate
    aliases: [hit rate, hits]
    def: How often a witness chooses correctly when the person who did it is in the lineup.
  - name: False alarm
    aliases: [false alarm, false alarms, false alarm rate]
    def: How often a witness names one of the faces when nobody in the lineup did it.
  - name: Sensitivity
    aliases: [sensitivity, d-prime]
    def: How well witnesses distinguish a true match from a similar face, read from the hit rate and the false alarm rate together.
  - name: Criterion
    aliases: [criterion, the line]
    def: How ready a witness is to answer at all, which moves both rates together and is not the same as seeing better.
  - name: Base rate
    aliases: [base rate, base rates, prior]
    def: How common something is before any evidence is considered — here, how many people could have been on that street.
  - name: Likelihood ratio
    aliases: [likelihood ratio]
    def: How much more often a piece of evidence turns up when a claim is true than when it is false.
  - name: Reliability
    aliases: [reliability, reliable, test-retest, inter-rater]
    def: Whether a measurement gives the same answer twice — on a second occasion, or in a second person's hands.
  - name: Validity
    aliases: [validity, valid]
    def: Whether a measurement is measuring what it is being used to measure, which reliability alone does not settle.
  - name: Norms
    aliases: [norms, norm group, normed]
    def: The distribution of scores in a defined group, against which one person's score is read.
  - name: Standard score
    aliases: [standard score, z-score]
    def: A score expressed as how many standard deviations it sits from the mean of the norm group.
  - name: Minimisation
    aliases: [minimisation, minimising]
    def: An interview tactic that offers a face-saving version of the act, making an admission feel cheap.
  - name: Expectancy
    aliases: [expectancy, experimenter expectancy]
    def: The influence of what the person running a procedure believes on what the person taking part does.

missions:
  # ---------------------------------------------------------------- day 1
  - title: What the file claims
    objective: Establish what the record asserts before anybody characterises it.
    briefing: Fifteen working days to the board, and nobody has read this file end to end since 2020.
    stake: >-
      Monday, and the review board sits in fifteen working days. Elias Ward has served seven
      years of fourteen for the robbery at Ferrier Street, on one identification and nothing
      else beside it. Ines Baptiste has read the file twice and wants the recommendation
      written on the procedure alone; Ren Okada wants to know what the procedure was before
      anybody describes it. Today you take the file as it arrived, put a date and a signature
      against every assertion in it, and find out which of them the store can support, because
      the board weighs what the unit says against what the record carries.
    takeaway: A file states things; the question is always which of them anything stands behind.
    stops:
      - group: MEASURE
        task: Separate what is asserted from what is supported
        title: The signature and the thing it stands for
        place: Records Store
        scene: Records custodian Nell Achterberg opens the Ward file on the hall's long table. The cover says seven years served of fourteen. Every page is signed. The unit has fifteen working days, and this morning buys only three checks.
        assumes:
          - a signature records that somebody accepted a claim at the time
          - a review has less time than a file has pages
        takeaway: A record is evidence that a claim was accepted, which is not evidence for the claim.
        format: ATTEST
        question: Verify what the morning allows, and hold whatever the store cannot stand behind.
        attest:
          hint: All six are signed and none has ever been questioned. Going behind one costs the best part of an hour.
          checks: 3
          claims:
            - id: dist
              label: Witness stood 22 m from the doorway
              signedBy: Case summary
              critical: true
              evidence: an officer sketch marked not to scale, with no measurement on it
            - id: light
              label: Street lighting normal at the time
              signedBy: Scene report
              critical: true
              evidence: the phrase and nothing else — no meter reading and no lamp check
            - id: array
              label: Six-photograph array shown 4 December 2019
              signedBy: Custody record
              backed: true
              evidence: the signed array record, with the time and the room on it
            - id: cert
              label: Witness stated she was absolutely certain
              signedBy: Witness statement
              critical: true
              backed: true
              evidence: a signed statement in her own words, dated 26 December
            - id: area
              label: Ward was in the area that evening
              signedBy: Officer note
              evidence: a note of a phone call from somebody the note does not name
            - id: print
              label: No fingerprints recovered from the counter
              signedBy: Forensic report
              backed: true
              evidence: a laboratory report with exhibit numbers and a named analyst
        answerText: Hold the distance and the lighting. Both decide what could have been seen, both rest on a phrase rather than a measurement, and neither has anything in the store behind it. The certainty statement is a real signed document — what is wrong with it is its date, which is a different objection.
        why: "A file compresses months of work into signed claims. A signature shows who accepted a claim, not whether the condition was true. That difference matters most for claims carrying the case. Distance and lighting are both decisive and neither has a repeatable measurement behind it. The certainty statement is different: it is a real record, but its date changes what it can support. With only three checks, verification belongs where an unsupported claim could change the review."
      - group: IDENT
        task: Establish what Cardoza was actually asked to do
        title: Six at once
        place: Identification Suite
        scene: Marcus Ilori has the 4 December 2019 array record on the table. Six photographs were laid out together. The witness was asked whether the man she saw was among them. It was standard procedure that year.
        assumes:
          - a lineup contains one suspect and a number of people known not to be the offender
        takeaway: Shown together, a lineup asks which face is closest; shown one at a time, it asks whether this is the face.
        format: CHOICE
        question: What does laying all six photographs out together invite a witness to do?
        why: Six faces shown together invite relative judgment. The witness can ask which face is closest to memory instead of whether any face is the offender. That easier question always has a winner, even when the offender is absent. Nothing dishonest has to happen for the error to appear. Sequential presentation changes the task. Each face must be judged before the next arrives, which makes rejecting the lineup a live response rather than a comparison lost among six alternatives.
        choices:
          - Compare them and choose whichever is nearest her memory
          - Report a lower level of certainty than she actually holds
          - Rely on colour and complexion detail the scene could not have given her
          - Recall the array afterwards in place of recalling the man in the doorway
        answer: Compare them and choose whichever is nearest her memory
        rebuttals:
          - Certainty tends to rise after a choice from an array rather than fall, so this is the wrong direction.
          - Complexion is a real limit of that night, and it constrains what she saw before the array existed.
          - Remembering the array instead of the event is a later problem, and it needs a second procedure to appear.
      - group: SOCIAL
        task: Guard the review against the answer it wants
        title: What a clean file would look like
        place: Deliberation Room
        scene: |-
          Grace Ntuli stops the first meeting four minutes in. Everybody in the room came here to find bad procedure, she says, and the file has not been opened yet. She wants something written on the whiteboard before it is.
        assumes:
          - people find more of what they are looking for than of what they are not
        takeaway: Write down what would count against you before you look, or you will not recognise it later.
        format: CHOICE
        question: What does writing down the features of a sound 2019 procedure protect the review from?
        why: Expectancy changes what people notice and remember without making them fabricate evidence. Reviewers who expect bad procedure naturally recognize faults faster than facts pointing the other way. Writing the standard first creates a comparison instead of a search. The same logic supports preregistration in experiments. Evidence that contradicts the room's expectation already has a place to land. That makes it harder to move the standard after the file starts telling a persuasive story.
        choices:
          - Counting only the findings that point the way the room already leans
          - The board rejecting a report that has not been agreed in advance
          - Disagreement between the psychologists and the lawyers about the standard
          - Spending time on documents that turn out not to matter to the outcome
        answer: Counting only the findings that point the way the room already leans
        rebuttals:
          - The board's agreement is not what is at issue; it reads the report after the work rather than before it.
          - A shared standard does help the two professions agree, and that is a benefit rather than the risk being guarded against.
          - Time is genuinely wasted in reviews, and no written standard would tell anybody in advance which documents matter.
  # ---------------------------------------------------------------- day 2
  - title: What a face is at that distance
    objective: Turn the file's own distance into what an eye could have resolved.
    briefing: The reconstruction bay is built to the survey, and the first arithmetic is the file's own.
    stake: >-
      Tuesday, and the bay is finished: Dawit Bekele has the Ferrier Street corner up at full
      size, kerb line, doorway and column. Halina Frey wants the file's own claim tested before
      anybody argues about it, because twenty-two metres is a number the case summary asserts
      and nobody has ever put through anything. Today you work out what a face is at that range
      as an angle at the eye, then read what Cardoza's first account actually contained. Ward is
      thirty-four and has served seven years on what one person could make out across a street.
    takeaway: A face at a distance arrives as an angle, and the angle is small long before the person is.
    stops:
      - group: PERCEPT
        task: Work out the angle a face subtends at the file's distance
        title: Twenty-two metres, as an angle
        place: Reconstruction Bay
        scene: Vision scientist Frey lights the reconstruction bay and runs a tape to the twenty-two-metre floor mark. She puts a face at the doorway and asks what its features become at an eye across the rebuilt street.
        assumes:
          - the eyes of an adult face are about six centimetres apart
          - an angle in radians is a length divided by a distance
        takeaway: Doubling the distance halves the angle, and the angle is what the eye has to work with.
        format: BALLPARK
        question: Estimate the angle the gap between a person's eyes subtends at the distance the file records.
        answerText: 0.063 ÷ 22 ≈ 0.0029 radians, about ten arc minutes. The face is visible as a face; the identity-carrying features occupy smaller angles inside it.
        why: A face reaches the eye as angles, not metres. Angular size is the feature's size divided by its distance, so every step backward shrinks the usable detail. The eye gap here spans about three milliradians, or ten arc minutes. That can make a face visible as a face. Identity depends on smaller relationships inside that angle. The file's distance is therefore not background description. It sets the scale of the information available before memory enters the problem.
        estimate:
          prompt: The case summary puts Cardoza twenty-two metres from the doorway. The gap between the eyes of an adult face is about 0.063 m.
          question: Choose the size of the detail and the distance it was seen from.
          labels:
            - 0.063  (m, the gap between the eyes of an adult face)
            - 22  (m, the distance the case summary records)
            - 0.15  (m, the width of a whole face)
            - 1.75  (m, the height of the shop doorway)
            - 6  (s, how long the file says she was watching)
          values: [0.063, 22, 0.15, 1.75, 6]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 0.00286
          tolerance: 0.0005
          units: radians
          relationship: Angular size θ = s / d, with θ the angle at the eye in radians, s the size of the detail and d the distance to it.
          solution: 0.063 ÷ 22 ≈ 0.0029 radians, which is about 10 arc minutes.
          explanation: About three milliradians, or ten arc minutes. That is enough to see a face as a face in good light, while identity depends on smaller relationships within it. The whole-face width and doorway height are plausible measurements, but neither is the detail this calculation asks about.
          givens:
            - The gap between the eyes of an adult face is about 0.063 m
            - The case summary records a distance of 22 m
      - group: MEMORY
        task: Establish how much time there was to take anything in
        title: Six seconds, and what they hold
        place: Interview Suite A
        scene: Memory scientist Ren Okada opens Alma Cardoza's first full account at the doorway paragraph. Six seconds, by her estimate, separate the shout from the man crossing the kerb. The bay clock is set to six.
        assumes:
          - memory is built from what was attended to during an event
        takeaway: What is remembered is what was attended to, and attention takes one thing at a time.
        format: CHOICE
        question: Why does six seconds of viewing not deliver six seconds of face?
        why: A scene is not encoded as a complete recording. Attention selects some inputs for deeper processing while other visible inputs receive little. Six seconds contained a shout, a doorway, a moving person, a bag and traffic at the kerb. Each competed for limited attention. Event duration is therefore not the same as face-viewing duration. Later confidence cannot recover which fractions of those six seconds were actually spent processing the face.
        choices:
          - Attention has to be divided among competing parts of the scene
          - The eye needs several seconds in one position before it registers anything at all
          - Short events are stored briefly and are gone from memory within a few days
          - Threat makes a witness close her eyes for most of the event without noticing
        answer: Attention has to be divided among competing parts of the scene
        rebuttals:
          - Recognition takes a fraction of a second, so the delay before anything registers is far shorter than that.
          - Brief events are often remembered for years, and duration alone does not decide how long a memory lasts.
          - Eyes stay open under threat, and closing them would leave nothing to explain about the account.
      - group: IDENT
        task: Predict the description-only suspect-pick share, run the forty-person check, then spend the measurement to see where the choices actually landed.
        title: Predict it before the forty cards turn
        place: Identification Suite
        scene: Marcus Ilori lays Cardoza's first description beside the six 2019 photographs at the identification bench. Forty mock-witness cards are face down beside them. Nobody holding a card has seen the robbery.
        assumes:
          - a lineup is built to be consistent with the description already given
        takeaway: A procedure can be tested by people who know the description but not the event; where they land measures the array rather than memory.
        format: VERIFY
        question: What suspect-pick share do you expect from the description alone, and does the measured distribution support a fair six-person array?
        verify:
          decision: Does the description-only mock-witness test behave like a fair six-person array?
          hint: Lock a predicted share before the cards turn. Then run all forty volunteers and spend the one check on the distribution of picks, not just on whether the run completed.
          prediction:
            min: 0.2
            max: 0.8
            unit: suspect-pick proportion
            step: 0.01
          intervention:
            id: mock_run
            label: Run 40 mock witnesses from the first description only
            n: 40
          checks: 1
          truth: 0.65
          passRatio: [0.8, 1.2]
          measurement:
            label: Count picks by photograph
            cost: 1
        answerText: Measure the picks by photograph. Twenty-six of forty mock witnesses choose Ward from the description alone, a suspect-pick share of 0.65. That result is far from an even six-way spread and becomes the input to the later functional-size calculation.
        why: A fair lineup should not point to the suspect through the description alone. Mock witnesses are useful because they never saw the event. They can respond only to the description and the photographs. If one photograph attracts most of them, the array is doing part of the identifying. Cardoza's description is broad, so visual matching alone cannot establish fairness. Measuring where mock witnesses land turns that concern into an empirical property of the procedure.
  # ---------------------------------------------------------------- day 3
  - title: Walk it
    objective: Find the distance at which a face stops being a face.
    briefing: The bay is a straight sightline with marks on the floor, and today it gets used.
    stake: >-
      Wednesday, and the bay has been calibrated overnight. Twelve volunteers stood at marked
      distances yesterday and reported what they could make out of a face at each one, and
      Halina Frey has the readings but has not looked at them in order. Today you take them
      station by station and find where the sightline breaks, then sit in the dark booth long
      enough to learn what the eye trades away to see at all. Grace Ntuli's panel hears "I saw
      his face" as one claim; the bay is where it becomes several.
    takeaway: There is a distance at which a face becomes a shape, and it is closer than anybody expects.
    stops:
      - group: PERCEPT
        task: Find the station where face identification breaks down
        title: Where the sightline goes
        place: Reconstruction Bay
        scene: Reconstruction technician Bekele has seven distance marks down the bay floor and a face at the far end. Each station card records what twelve volunteers described there and how often they later named the right person from six.
        assumes:
          - features can be described without the person being identifiable
          - the same face was used at every distance
        takeaway: Describing a build is not identifying a face, and the two fail at different distances.
        format: PROBE
        question: The volunteers could describe something from every mark. At which station does naming the individual stop working?
        answerText: "Naming first falls to chance at the twenty-metre station: two of twelve, which matches blind picking from six. Descriptions of build and clothing still survive there."
        why: Large features survive distance longer than identity does. Build, clothing, hair and rough age need only coarse visual information. Identifying one face among similar faces depends on smaller relations between features. Those relations disappear first as angular size shrinks. In the bay, volunteers still describe a person beyond twenty metres while correct naming falls to chance. That distinction matters. A witness can truthfully report seeing a man while the information needed to recognize which man is already gone.
        probe:
          chainLabel: Mark
          hint: Each mark reports what the twelve volunteers described from it and how many of them later picked the right face out of six. Read as few or as many as you like.
          stations:
            - id: M5
              label: 5 m
              reading: eye colour, a scar, the shape of the mouth
              expected: 11 of 12 named the right face
              load: well above chance
            - id: M10
              label: 10 m
              reading: features described, no eye colour
              expected: 10 of 12 named the right face
              load: well above chance
            - id: M15
              label: 15 m
              reading: face described in general terms
              expected: 7 of 12 named the right face
              load: above chance
            - id: M20
              label: 20 m
              reading: build, jacket, hair; face described with confidence
              expected: 2 of 12 named the right face
              load: at chance for six alternatives
            - id: M25
              label: 25 m
              reading: build, jacket, hair
              expected: 2 of 12 named the right face
              load: at chance for six alternatives
            - id: M30
              label: 30 m
              reading: build and jacket
              expected: 2 of 12 named the right face
              load: at chance for six alternatives
            - id: M40
              label: 40 m
              reading: a figure, moving
              expected: 1 of 12 named the right face
              load: at chance for six alternatives
          target: M20
          minReadings: 3
      - group: BRAIN
        task: Establish what the eye gives up in a dark street
        title: What the dark takes
        place: Dark Adaptation Booth
        scene: Priya Raghunathan shuts the booth door and waits ten minutes. She can then find the chart on the far wall but cannot name its colours. She wanted the room to experience that loss before reading about it.
        assumes:
          - the retina has two kinds of light-sensing cell with different jobs
        takeaway: Sensitivity in a dark place is bought, and the price is paid in what the eye can no longer separate.
        format: CHOICE
        question: What does a witness lose when a scene is dark enough that only rods are working?
        why: Cones provide colour and fine central detail, but they need more light. Rods work when illumination falls and trade detail for the ability to see at all. They also pool signals across retinal areas, which makes the result coarser. A dark street therefore does not simply dim a face. It removes colour and fine relationships while preserving movement, outline and broad form. That pattern can support confident description of some features while leaving identification detail weak.
        choices:
          - Colour and fine central detail
          - Movement, because motion detection needs cone vision
          - Peripheral vision, because rods disappear there first
          - Distance judgment, because depth cues require bright light
        answer: Colour and fine central detail
        rebuttals:
          - Motion is detected well in low light; rods are highly sensitive to change.
          - Rods dominate the periphery, so peripheral detection survives better than fine central detail.
          - Depth uses several cues and does not disappear simply because cones are no longer carrying colour.
      - group: SOCIAL
        task: Take apart the sentence the panel actually hears
        title: One claim, or four
        place: Deliberation Room
        scene: Grace Ntuli plays a panel recording in the hall. A volunteer juror repeats 'she saw his face' eleven times across forty minutes. By the end, nobody in the room is asking how far away the face was.
        assumes:
          - a repeated phrase becomes the thing a room is deciding about
        takeaway: "\"I saw his face\" bundles a distance, a light level, a duration and a recognition into one unarguable sentence."
        format: CHOICE
        question: Why does the phrase "she saw his face" make a room's decision harder rather than easier?
        why: "'She saw his face' bundles several claims into one sentence. It contains distance, illumination, viewing time and recognition. Treating the phrase as one fact forces a reviewer to accept or reject all four together. Separating them is not an attack on honesty. It is how each claim becomes testable. Distance, lighting and timing can be checked without asking the witness again. Recognition is the part that remains tied to memory and procedure."
        choices:
          - It states four separate things at once, so no one of them can be examined
          - It comes from the witness rather than from an expert, which juries weigh more heavily
          - It is emotional language, and emotional language dominates a deliberation
          - It is short, and short statements are recalled better than long ones at the end of a session
        answer: It states four separate things at once, so no one of them can be examined
        rebuttals:
          - Juries do weigh eyewitnesses heavily, and that is about the source of the claim rather than its structure.
          - The phrase is plain rather than emotional, which is part of why it passes unexamined.
          - Brevity aids recall, and a longer sentence stating the same bundle would cause the same problem.
  # ---------------------------------------------------------------- day 4
  - title: Two lamps and a wet road
    objective: Put a number on the light the corner had, using the file's own assumptions.
    briefing: The scene report says lighting was normal, which is a phrase rather than a reading.
    stake: >-
      Thursday, and Ines Baptiste has spent the morning arguing that the unit already has enough.
      Not one of yesterday's findings needed Alma Cardoza, and she is right about that: the
      distance, the light and the array are all facts about a street and a procedure, and none of
      them asks a frightened woman anything. Today you work out how much light was on the doorway
      under the file's own assumptions, and read what fear does to the edges of an event. Ren
      Okada wants the account preserved; Baptiste wants a man's seventh year to be his last.
    takeaway: Most of what decides an identification can be measured without ever asking the witness again.
    stops:
      - group: PERCEPT
        task: Work out the illuminance on the doorway from the column
        title: How much light the corner had
        place: Reconstruction Bay
        scene: |-
          Frey has the column's specification from the utility: a 1,800 candela lantern, twelve metres from the shop doorway along the kerb. The scene report's word for this is "normal".
        assumes:
          - light from a single source spreads over an area that grows with distance
        takeaway: Illuminance is set by the distance from the lamp to the thing lit, not by the distance to whoever is looking.
        format: BALLPARK
        question: Estimate the illuminance the column put on the doorway when it was working.
        answerText: 1800 ÷ 12² = 12.5 lux if column 4471 is working. That is the modeled lamp contribution, not proof that the lamp was on that night.
        why: Light from a source spreads over increasing area, so illuminance falls with the square of distance. The relevant distance runs from the lantern to the doorway it lights. Cardoza's distance belongs in the angular-size calculation instead. A working 1,800-candela lantern at twelve metres gives 12.5 lux. That is dim street lighting, not darkness. The calculation is sound. Whether the lantern was actually on that night is a separate factual question the calculation cannot answer.
        estimate:
          prompt: Column 4471 carries an 1,800 candela lantern and stands twelve metres from the shop doorway. Cardoza was twenty-two metres from the doorway, on the far pavement.
          question: Choose the intensity of the lamp and the distance from it to what it is lighting.
          labels:
            - 1800  (cd, the lantern's luminous intensity)
            - 12  (m, from the column to the doorway)
            - 22  (m, from Cardoza to the doorway)
            - 500  (lux, a supermarket aisle)
            - 5  (lux, a typical lit street)
          values: [1800, 12, 22, 500, 5]
          slots: 2
          template: "{0} ÷ ({1} × {1})"
          formula: a/(b*b)
          correct: [0, 1]
          target: 12.5
          tolerance: 2.5
          units: lux
          relationship: Illuminance E = I / d², with E in lux, I the source intensity in candela and d the distance from the source to the lit surface.
          solution: 1800 ÷ 12² = 1800 ÷ 144 = 12.5 lux.
          explanation: About 12.5 lux with the lantern working. The twenty-two metres belongs to the observer and therefore to the angle calculation, not this lighting calculation. The arithmetic answers what the lamp would deliver if lit. The utility record later answers whether that premise was true on 14 November.
          givens:
            - Column 4471 carries an 1,800 candela lantern
            - The column stands 12 m from the shop doorway
      - group: BRAIN
        task: Which explanation fits all four readings rather than the loudest one?
        title: The middle of the event and its edges
        place: Physiology Bay
        scene: Priya Raghunathan has four parts of Cardoza's account on the screen. One shows detailed recall, one shows nothing, one is wrong, and one was never mentioned. She wants one mechanism that fits the whole pattern.
        assumes:
          - a threat triggers a fast alarm response before any decision is made
          - attention narrows under threat
        takeaway: Arousal does not print or erase a scene; it narrows what is taken in, so the centre is sharp and the edges were never there.
        format: DIAGNOSIS
        why: Arousal does not strengthen every part of memory equally. Threat narrows attention toward the most urgent object and reduces processing elsewhere. That can produce weapon focus and inattentional blindness in the same event. Cardoza reports many details about the bag and none about the second man. Broad features such as build and jacket remain stable. The pattern is therefore structured rather than globally unreliable. Stress predicts where information may be dense and where it may never have been encoded.
        headline: The account is minutely detailed in one place and empty in others, and both are being read as unreliability.
        readings:
          - zone: Described in detail
            label: The bag and the hand holding it
            value: nine specific details
            status: alarm
          - zone: Not described
            label: What the second man was wearing
            value: nothing at all
            status: alarm
          - zone: Reported wrongly
            label: Duration of the event
            value: "\"a couple of minutes\""
            status: high
          - zone: Stable across accounts
            label: Build, jacket, direction of travel
            value: unchanged in three tellings
            status: normal
            note: no drift between November and December
        choices:
          - label: The account is unreliable throughout
            mechanism: A witness who is wrong about one thing is wrong about everything.
          - label: Attention narrowed onto the threat
            mechanism: What was attended to is detailed, what was outside it was never encoded, and time is overestimated under arousal.
          - label: She is filling gaps to be helpful
            mechanism: Details are being invented to satisfy the interviewer.
          - label: The interviews were badly conducted
            mechanism: The questions failed to ask about the second man.
        answer: Attention narrowed onto the threat
        rebuttals:
          - Nothing here is wrong except the duration, and the features that survived are the ones a narrowed account keeps.
          - Invented detail drifts between tellings, and these three tellings do not drift.
          - The interviews did ask about the second man; the answer was that she had not looked at him.
      - group: MEASURE
        task: Decide what the phrase in the scene report is worth
        title: A word where a reading should be
        place: Records Store
        scene: Unit Director Ines Baptiste stands on the rebuilt corner beside the lux meter and the scene report. The report says only 'street lighting normal.' No night reading survives. She asks how much longer Ward should serve while the unit treats that word as data.
        assumes:
          - a measurement can be repeated by somebody else and a description cannot
        takeaway: A word describing a condition and a reading of that condition are different kinds of evidence, and only one can be checked.
        format: CHOICE
        question: Why can the review not simply accept "street lighting normal" as evidence about the light?
        why: "'Normal' is a judgment against an unstated comparison. It could mean the lamps looked usual, that nothing seemed unusual, or simply that the road was familiar. Those meanings imply different physical conditions. None gives a lux value another reviewer can reproduce. A meter reading carries a defined quantity and unit. Seven years later, somebody else can make the same measurement. A descriptive word cannot supply that missing standard, however sincere the writer was."
        choices:
          - Nobody can now say what the officer compared it against
          - Officers are not trained to assess lighting conditions at a scene
          - The report was written the following morning rather than at the scene
          - A single observer is never enough to establish a physical condition
        answer: Nobody can now say what the officer compared it against
        rebuttals:
          - Training is not the issue, because a trained observer's impression would still lack a stated comparison.
          - Timing would matter for detail recall, and the phrase would be equally uncheckable written on the spot.
          - One observer with an instrument is sufficient, which is what shows the problem is the phrase rather than the number of people.
  # ---------------------------------------------------------------- day 5
  - title: Four days before anybody asked
    objective: Establish how the first full account was taken, and who was in the room.
    briefing: The account everybody has argued about since was recorded on 18 November.
    stake: >-
      Friday, and the first full interview is four days later than it should have been. Ren Okada
      has the 18 November recording and a transcript nobody has checked against it. Yara Solomon
      has found that Cardoza's husband sat in for the whole of it, which the file mentions once,
      in a margin. Today you set out how an account ought to be taken, work out what a
      sympathetic listener does to one, and read the instruction Cardoza was given before the
      photographs came out. Everything the case rests on passed through that hour.
    takeaway: An account is not collected; it is produced, by a method, in a room, with people in it.
    stops:
      - group: MEMORY
        task: Order the steps of an interview that protects what the witness actually has.
        title: The order an account is taken in
        place: Interview Suite A
        scene: Ren Okada lays five interview steps along the corridor floor and queues the 18 November recording. In the audio, the second question arrives eleven seconds after Cardoza begins. He asks the room to rebuild the order before replaying it.
        assumes:
          - a question can introduce a detail that was not in the witness's own account
        takeaway: Every question narrows what comes next, so the questions go last and the witness's own account goes first.
        format: SEQUENCE
        why: Interview order protects later information from earlier contamination. First, make 'I do not know' an acceptable answer. Then take uninterrupted free recall before adding anybody else's words. Open questions can follow because they expand material the witness already raised. Closed questions come later and only on existing topics. Confidence must be recorded before photographs or feedback arrive. Once outside information enters, the original state of the account cannot be recreated by asking more carefully.
        cards:
          - Say plainly that "I do not know" is a full answer and will not disappoint anybody
          - Take an uninterrupted account in the witness's own words, asking nothing during it
          - Return to what the witness raised, using open questions that name no new detail
          - Put closed questions only about things the witness has already brought up
          - Record how sure the witness is of each element, before any photographs exist
        order: [0, 1, 2, 3, 4]
      - group: SOCIAL
        task: Change one feature of the listening room at a time, then reverse the change that moves which details survive into the second telling.
        title: Eleven small agreements
        place: Deliberation Room
        scene: Grace Ntuli plays the 18 November interview in the listening room. Cardoza's husband is present throughout and agrees at eleven points. A second console can replay the same account with one feature of the room changed.
        assumes:
          - people adjust what they say to the reaction they are getting
        takeaway: A social effect becomes causal evidence only when the social cue changes and the rest of the room does not.
        format: CONTROL
        question: Which room feature is causing reinforced details to survive, and does the effect return when that feature is restored?
        control:
          hint: Change one control from baseline, read the number of details that survive into the second telling, then restore it. Do not change two room features together.
          noise: 0.7
          baseline: 8
          observable:
            label: Reading
            unit: details repeated
          response: 3
          truth: listener_agreement
          variables:
            - id: listener_agreement
              label: Listener agreement cues
            - id: open_questions
              label: Open questions after free recall
            - id: pause_seconds
              label: Interviewer pause after an answer
        answerText: The listener agreement is the causal feature in this authored control run. Eleven agreement cues raise repeated details from 8.0 to 11.0; changing question count or pause length does not. Restoring silence returns the result to 8.1.
        why: Social feedback can shape an account without anyone intending to coach it. A speaker notices which sentences receive agreement and which receive nothing. Reinforced parts are more likely to be repeated later. Unreinforced parts can shrink or disappear. The mechanism is selective retention, not necessarily invention. A controlled comparison can test it by changing listener reactions while holding the interviewer and timing steady. That separates a room effect from other features of the interview.
      - group: IDENT
        task: Find the instruction that was not given
        title: The man may not be here
        place: Identification Suite
        scene: |-
          Ilori has the 2019 array form. There is a line for the witness's signature and no line for the caution that the person she saw might not be among the photographs. In 2019 there was no such line.
        assumes:
          - a witness expects an investigation to have found somebody before showing an array
        takeaway: Without being told the offender may be absent, a witness answers "which of these" rather than "is he here".
        format: CHOICE
        question: What does the missing caution change about the task Cardoza was given?
        why: A witness usually assumes police have brought photographs for a reason. Without an explicit caution, 'none of them' can stop feeling like a real answer. The task then shifts toward finding the closest face among the six. An offender-absent lineup still produces a winner under that rule. A may-not-be-present instruction restores rejection as an expected response. It changes the decision criterion before any face is judged, which is why the warning belongs before the array appears.
        choices:
          - It turns the task into choosing, rather than deciding whether to choose
          - It removes her right to decline to take part in the procedure
          - It means her choice could not be recorded as a formal identification
          - It prevents the array from being repeated later with different photographs
        answer: It turns the task into choosing, rather than deciding whether to choose
        rebuttals:
          - Declining was always allowed; what was missing was any statement that not choosing was a real answer.
          - The choice was recorded and used as an identification, which is the problem rather than a bar to it.
          - Repeat procedures are ruled out by having seen the first array, not by anything in the caution.
  # ---------------------------------------------------------------- day 6
  - title: The photograph in the evening paper
    objective: Find out what entered the account after the night it describes.
    briefing: The Hallam Register ran Ward's photograph on 19 November, the day after the interview.
    stake: >-
      Monday of the second week, and Solomon has three documents side by side with their dates
      showing. The 18 November account, the following evening's newspaper, and the statement
      Cardoza signed on 26 December. Tomas Weill has already said the interesting thing is not
      what any of them says but the order they were written in. Ines Baptiste wants to know
      whether the review is calling the witness a liar, and Ren Okada has spent the morning
      explaining why that is the wrong question. Today you work out what a detail's arrival date
      tells you about where it came from, and why the biology of a frightening night cannot
      account for something that first appears five weeks after it.
    takeaway: A detail that is absent before a photograph and present after it has a source, and the source is not the night.
    stops:
      - group: MEMORY
        task: Which explanation fits every dated item rather than the most damning one?
        title: The scar
        place: Interview Suite B
        scene: Ren Okada has four dated items on the screen when Unit Director Ines Baptiste asks whether Cardoza is lying about the scar. Okada says that question arrives too late. He puts the dates across the corridor instead.
        assumes:
          - a remembered detail carries no label saying where it came from
        takeaway: Post-event information is stored as memory of the event, because memory does not tag what it took in from where.
        format: DIAGNOSIS
        why: Memory often preserves content better than source. A detail seen in a newspaper can later feel as though it came from the event itself. Source monitoring becomes harder as time and later exposure accumulate. That can produce an honest, confident memory with the wrong origin. The dates matter here. Cardoza's long first interview contains no scar. Ward's photograph appears the next day. The scar enters later. Certainty cannot repair the missing source label.
        headline: A chin scar is absent from the account taken four days after the robbery and present in the statement five weeks later.
        readings:
          - zone: 18 November account
            label: Mention of a scar
            value: none, in ninety minutes
            status: normal
          - zone: 19 November newspaper
            label: Photograph of Ward
            value: full face, scar clearly visible
            status: alarm
          - zone: 4 December array
            label: Photograph chosen
            value: the same image the newspaper ran
            status: alarm
          - zone: 26 December statement
            label: Mention of a scar
            value: "\"the mark on his chin\""
            status: alarm
          - zone: Cardoza
            label: Account of where the detail came from
            value: certain she saw it on the night
            status: high
            note: no hesitation on the point
        choices:
          - label: She is lying about the scar
            mechanism: The detail was added deliberately to strengthen the identification.
          - label: The detail arrived from the photograph
            mechanism: Information met after the event is stored as part of it, and its source is lost first.
          - label: She saw it and forgot to mention it
            mechanism: A detail can be encoded and left out of an early account.
          - label: The interviewer suggested it in November
            mechanism: The word came from the question rather than the witness.
        answer: The detail arrived from the photograph
        rebuttals:
          - Lying predicts hesitation and inconsistency, and there is none — she is certain, which fits an honest source error better.
          - A forgotten detail can reappear, and it would not so often be the detail that ran in a photograph the next evening.
          - The November transcript contains no mention of a scar by anybody, so the suggestion has no route in.
      - group: MEASURE
        task: Close the chronology from the robbery to the later certainty statement and find the interval the simplified file leaves out.
        title: Close the forty-two days
        place: Records Store
        scene: "Tomas Weill lays four dates along the identification corridor: 14 November, 18 November, 19 November and 26 December. The spans almost close. Nell Achterberg has independent records for each date and one missing interval to account for."
        assumes:
          - a document's date can be checked against the record of when it was received
        takeaway: Chronology is only as complete as the intervals it preserves, especially when a missing interval contains a new source of information.
        format: BALANCE
        question: Where do all forty-two days go, and which missing interval changes what sources were available to the witness?
        balance:
          total:
            amount: 42
            unit: days
            label: 14 November robbery to 26 December certainty statement
          streams:
            - id: robbery_interview
              label: Robbery to first full interview
              value: 4
              display: 14 → 18 November
            - id: interview_photo
              label: First full interview to newspaper photograph
              value: 1
              display: 18 → 19 November
              hidden: true
              note: The Register publishes Ward's photograph in this interval.
            - id: photo_array
              label: Newspaper photograph to array
              value: 15
              display: 19 November → 4 December
            - id: array_certainty
              label: Array to later certainty statement
              value: 22
              display: 4 → 26 December
          tolerance: 0.1
          hint: Close the days first. The missing term is an interval, not a document. Only after the total reaches forty-two should you ask what entered during that interval.
        answerText: The forty-two days close as 4 + 1 + 15 + 22. The hidden one-day interval is 18 to 19 November, between the first full interview and publication of Ward's photograph.
        why: Chronology is evidence only when its intervals are independently anchored. The robbery is 14 November. The full interview is four days later, the photograph one day after that, and the array fifteen days later. The later certainty statement follows after another twenty-two days. Those intervals close to forty-two days. Leaving out the one-day newspaper interval creates a gap exactly where new face information entered. Dating does not prove causation, but it defines which sources were available before each account.
      - group: BRAIN
        task: Rule the biology in or out for a change five weeks later
        title: What the hormones cannot explain
        place: Physiology Bay
        scene: |-
          Raghunathan is asked whether the stress of the robbery could have delayed the scar into the account. She draws the time course of the alarm response on the board: seconds, minutes, and hours.
        assumes:
          - the stress response has a time course that can be measured
        takeaway: Every mechanism has a window it operates in, and a cause has to reach the moment it is being blamed for.
        format: CHOICE
        question: Why can the stress response not explain a detail that first appears five weeks after the event?
        why: Stress biology acts during the event and the hours that follow. The amygdala responds rapidly, and cortisol changes over minutes. Those systems can affect attention, encoding and consolidation. They cannot insert a new facial feature five weeks later. The relevant biological window has long closed by then. Stress still matters elsewhere in this case because it can explain uneven encoding across the scene. It does not explain a detail that first appears after later information has entered the record.
        choices:
          - It acts during encoding and the hours of consolidation that follow
          - Stress hormones are cleared within minutes, so later memory is unaffected
          - Stress changes emotional content only, leaving neutral facial detail untouched
          - A second stress response in December could rewrite what was encoded in November
        answer: It acts during encoding and the hours of consolidation that follow
        rebuttals:
          - Cortisol persists longer than minutes, but the relevant window is still hours rather than five weeks.
          - Arousal affects attention across the scene; it is not limited to content that feels emotional later.
          - A December stress response acts on December processing. It cannot insert a feature into November encoding.
  # ---------------------------------------------------------------- day 7
  - title: Two witnesses who agree
    objective: Find out whether the agreement between the accounts is worth anything.
    briefing: The shop assistant's statement matches Cardoza's in four particulars.
    stake: >-
      Tuesday, and the file's strongest-looking page is the one that compares the two witnesses.
      Deniz Aktaş was behind the counter and his December statement agrees with Cardoza's on the
      jacket, the build, the direction of travel and the mark on the chin. Marcus Ilori has been
      saying for a week that agreement is the easiest thing in the world to manufacture. Today
      you open each account and find what it was built from, and work out what Aktaş could see
      through his own window. Elias Ward was convicted on two accounts that had met.
    takeaway: Two accounts that share a source are one account, and the file counts them as two.
    stops:
      - group: SOCIAL
        task: Find the source the agreeing accounts have in common
        title: Agreement is not independence
        place: Deliberation Room
        scene: Five items in the file point the same way. Grace Ntuli has them on the board with their derivations closed. Ines Baptiste asks why the unit is spending a morning on the part of the case nobody disputes.
        assumes:
          - two pieces of evidence built on the same source can only ever agree
        takeaway: Evidence that agrees because it shares a source carries the weight of one item, not of several.
        format: TRACE
        question: Four of these five point at Ward. Open them, keep whatever still stands on its own, and name the source they have in common.
        trace:
          hint: Open an item to see what it was built from. Tick the ones whose evidence would survive if a shared source were removed, then name the source.
          channels:
            - id: cardoza
              label: Cardoza December statement
              reading: names Ward; mentions a mark on the chin
              depends:
                - paper
                - remark
            - id: aktas
              label: Aktaş December statement
              reading: agrees on jacket, build and the mark
              depends:
                - paper
                - talk
            - id: caller
              label: Anonymous telephone call
              reading: names Ward as the man in the doorway
              depends:
                - paper
            - id: till
              label: Till roll
              reading: last sale rung at 21:41
              depends: []
            - id: depot
              label: Bus depot camera 300 m north
              reading: a figure northbound at 21:44
              depends: []
          resources:
            - id: paper
              label: The Hallam Register of 19 November, which ran one photograph
            - id: remark
              label: Whatever was said to Cardoza after she chose
            - id: talk
              label: The twenty minutes the two witnesses waited together
          independent:
            - till
            - depot
          target: paper
          commit: Name the shared source
        answerText: The shared source is the Hallam Register photograph. Three Ward-pointing items pass through it, so they are not independent. The till roll and depot camera keep their weight because neither touched that source.
        why: Agreement counts as corroboration only when the sources are independent. Three items here pass through the same newspaper photograph. Their agreement therefore does not create three separate measurements. Remove the shared source and their independence disappears. The till roll and depot camera are different because neither depends on the photograph or on a witness identifying Ward. Those sources can disagree with the case narrative. Evidence earns extra weight when it had a real chance to come out differently.
      - group: MEMORY
        task: Work out what twenty minutes of waiting cost
        title: Twenty minutes on the kerb
        place: Interview Suite B
        scene: |-
          The first officers arrived at 21:58. Between the robbery and their arrival, Cardoza and Aktaş stood together outside the shop. Okada asks what the file can now say about the four particulars they agree on.
        assumes:
          - people compare accounts when something has just happened to both of them
        takeaway: Once two witnesses have talked, their accounts cannot be added together, and neither can be recovered alone.
        format: CHOICE
        question: What has the wait outside the shop done to the two accounts?
        why: Co-witness discussion makes two accounts partly dependent. One person's detail becomes available to the other as content, and later source memory may not preserve where it came from. That means four shared particulars cannot simply be counted twice. The contamination also cannot be subtracted afterwards. Investigators separate witnesses because independence is easiest to protect before accounts meet. Once Cardoza and Deniz Aktaş talked for twenty minutes, agreement stopped being clean evidence that both had encoded the same detail independently.
        choices:
          - They are no longer independent accounts
          - They now cover more of the event because two viewpoints have been combined
          - They remain independent because both witnesses were describing the same person
          - Only Aktaş's account is affected because his original view was poorer
        answer: They are no longer independent accounts
        rebuttals:
          - Two viewpoints help only when the accounts are collected before they can influence each other.
          - Describing the same person is the very claim agreement was supposed to support; discussion makes that agreement dependent.
          - Both accounts can exchange material. A better original view does not protect a witness from later source confusion.
      - group: PERCEPT
        task: Work out what the man behind the counter could see
        title: Looking out of a lit room
        place: Reconstruction Bay
        scene: |-
          Bekele has the bay set up from the shop side. The counter, the window, the interior lights at the level the shop record gives. Beyond the glass, the street at the illuminance the corner had.
        assumes:
          - the eye adjusts to the general level of light it is in
        takeaway: An eye set for a lit room is the wrong eye for a dark street, and the glass makes it worse.
        format: CHOICE
        question: Why is Aktaş's view of the street worse than his position suggests?
        why: The eye adapts to the light level around it. A bright shop leaves it set for a bright shop, which is the wrong setting for a dim street. Dark adaptation can improve that, but it takes minutes. Aktaş did not have those minutes during the robbery. The window creates another problem. Interior light reflects from the glass and overlays the darker scene outside. Distance alone therefore overstates his viewing advantage. A closer witness can still have poorer usable vision when the lighting around the eye is wrong.
        choices:
          - His eyes are adapted to the bright shop, and the glass reflects it back
          - The counter blocks the part of the doorway where a face would appear
          - Ordinary window glass removes more than half the light from outside
          - His reflection hides only the centre of the window and leaves the face clear
        answer: Ordinary window glass removes more than half the light from outside
        rebuttals:
          - The counter is low enough that it does not block a face at the doorway.
          - Ordinary glazing transmits most outside light; reflected interior light is the larger problem here.
          - A reflection can overlay much of the view when the room behind the observer is brighter than the street.
  # ---------------------------------------------------------------- day 8
  - title: How the six were chosen
    objective: Test the array on people who were never there.
    briefing: Forty volunteers have read Cardoza's description and seen nothing else.
    stake: >-
      Wednesday, and the mock-witness run finished overnight. Forty volunteers read the
      description Cardoza gave on the night, saw the 2019 array and pointed at whoever fitted, and
      not one of them has ever seen the robbery. Marcus Ilori has the tally and will not say the
      number out loud until somebody has worked out what a fair one would be. Today you turn that
      tally into a size, decide what would actually make the procedure sound, and look at what a
      photograph asks an eye to do. Ward was convicted out of six faces.
    takeaway: A lineup's real size is how many of its members a stranger could plausibly pick.
    stops:
      - group: IDENT
        task: Turn the mock-witness tally into the array's real size
        title: Six photographs, and how many alternatives
        place: Identification Suite
        scene: Marcus Ilori spreads forty mock-witness tally marks across the identification bench. Twenty-six sit under one photograph. The volunteers had Cardoza's description and nothing else. He asks how many real alternatives the six-photo array actually offered.
        assumes:
          - a lineup member who nobody would pick from the description is not an alternative
        takeaway: Nominal size is how many faces are on the table; functional size is how many of them a stranger could land on.
        format: BALLPARK
        question: Estimate the functional size of the 2019 array.
        answerText: 40 ÷ 26 = 1.54 effective members. A nominal six-photo array offered only about one and a half real alternatives to description-only mock witnesses.
        why: Lineup protection comes from real alternatives, not from the printed number of photographs. If all six fit the description equally, guessing should spread across them. Mock witnesses test that because they know only the description. Here twenty-six of forty choose Ward's photograph. Functional size is therefore 40 divided by 26, about 1.54. The nominal array had six members. Its effective protection was closer to one and a half alternatives, making an innocent-suspect pick far easier than the form suggests.
        estimate:
          prompt: Forty mock witnesses read Cardoza's description and were shown the 2019 array. Twenty-six of them chose Ward's photograph.
          question: Choose the number of mock witnesses and the number who landed on the suspect.
          labels:
            - 40  (mock witnesses asked)
            - 26  (of them chose the suspect)
            - 6  (photographs in the array)
            - 5  (fillers in the array)
            - 12  (volunteers in the reconstruction bay)
          values: [40, 26, 6, 5, 12]
          slots: 2
          template: "{0} ÷ {1}"
          formula: a/b
          correct: [0, 1]
          target: 1.54
          tolerance: 0.25
          units: effective members
          relationship: Functional size FS = m / k, with m the mock witnesses asked and k how many of them chose the suspect.
          solution: 40 ÷ 26 ≈ 1.5 effective members.
          explanation: About 1.54 effective members. Six photographs were printed, but the mock-witness choices behaved as though only about one and a half were real alternatives. The nominal size and filler count are useful distractors because functional size is designed to test whether those printed numbers overstate the protection.
          givens:
            - 40 mock witnesses were shown the array
            - 26 of them chose the suspect from the description alone
      - group: MEASURE
        task: Bring the procedure inside the fair band
        title: Moving the middle is not narrowing the spread
        place: Data Room
        scene: |-
          Weill has the mock-witness result as a distribution against the band a fair six-member array would sit in. Four changes are available to the unit's recommendation and each of them costs days of drafting.
        assumes:
          - a fair six-member array is picked from at about one time in six
          - a recommendation can propose changes to a procedure as well as criticise it
        takeaway: A procedure fails on its spread as often as on its centre, and only one kind of change touches the spread.
        format: CLOUD
        question: Bring the recommended procedure inside the fair band, and say when it is defensible.
        cloud:
          hint: The band is where a fair six-member array lands. The cloud is what this procedure produces across administrators and sites, not what it produces on a good day.
          bounds:
            min: 10
            max: 24
            unit: "%"
            label: Share of mock witnesses landing on the suspect
          centre: 42
          spread: 13
          pass: 0.85
          seed: 23
          costUnit: d
          actions:
            - id: fillers
              label: Rebuild the array with fillers matched to the description
              effect: shift
              amount: 15
              cost: 3
            - id: caution
              label: Add the may-not-be-present caution
              effect: shift
              amount: 8
              cost: 1
            - id: blind
              label: Show sequentially with an administrator who does not know the suspect
              effect: narrow
              amount: 0.45
              cost: 4
            - id: script
              label: Standardise the wording and the lighting across every site
              effect: narrow
              amount: 0.6
              cost: 2
          commit: Call it defensible
        answerText: Use all four changes. Better fillers and the caution move the centre but still leave too many administrations outside the fair band. Blind sequential presentation and a standard script narrow the spread enough to clear it.
        why: A fair procedure needs both an acceptable centre and a controlled spread. Better fillers and a may-not-be-present caution can move average performance toward the fair band. They do not remove variation between administrators and rooms. Standard scripts and blind administration reduce that spread. A recommendation should therefore ask how many real administrations remain unfair, not only where the average lands. Moving the centre can improve a mean while leaving too many individual procedures outside the acceptable region.
      - group: PERCEPT
        task: Work out what a photograph asks the eye to do
        title: A face on paper
        place: Reconstruction Bay
        scene: |-
          Frey has the array photographs and a live volunteer at the same distance under the same lamp. She asks the room which of the two tasks is closer to what Cardoza was doing on 14 November.
        assumes:
          - a face is recognised from more than a single frozen view of it
        takeaway: A stand-in for a task is easier or harder than the task itself, and the difference is whatever it leaves out.
        format: CHOICE
        question: What does an array of photographs remove from the recognition task?
        why: Real face recognition draws on changing views. Head turns, expression, gait and feature motion all add information across time. A lineup photograph freezes one angle under one lighting condition. The witness must compare that single view with a memory that was never a still image. That makes the task harder and can make photographs uneven. One person's chosen image may resemble the remembered view more by chance than another person's, even when both are equally plausible fillers.
        choices:
          - Movement and all but one view of the face
          - Colour, which is the main cue used first in face recognition
          - Scale, because a smaller printed face is harder to recognise
          - Context, because the street itself supplies the identity cue
        answer: Movement and all but one view of the face
        rebuttals:
          - Colour can help, but motion and changing viewpoints are the larger information loss between a live face and one photograph.
          - Visual recognition handles changes in apparent size routinely; printed scale is not the main loss.
          - Context is removed too, but that is not the face information a photograph freezes into one view.
  # ---------------------------------------------------------------- day 9
  - title: Thirty-four metres
    objective: Settle the distance, and work out what it leaves of the identification.
    briefing: Bekele's survey and the case summary do not agree, and nothing on the street has moved.
    stake: >-
      Thursday of the second week, and two numbers are on the same wall. Dawit Bekele's survey of
      Ferrier Street makes the doorway thirty-four metres from where Cardoza says she stood. The
      case summary says twenty-two, and has said so since 2020. Nothing physical has changed since
      the robbery, so one of these is a measurement and one of them is not. Today you find out
      which, work out what the eye can resolve at the distance that survives, and decide what the
      review is entitled to say about the identification. Everything the file argues rests on this.
    takeaway: The most important number in a case can be wrong for seven years because nobody ever measured it.
    stops:
      - group: MEASURE
        task: Which explanation is consistent with all five items?
        title: Where the twenty-two came from
        place: Records Store
        scene: Bekele hooks the tape at Cardoza's repeated position and walks past the file's twenty-two-metre floor mark. The tape keeps going to 34.2 m. Tomas Weill puts the unscaled sketch and the shop lease plan beside it.
        assumes:
          - a measurement can be repeated and an estimate cannot
        takeaway: A number that entered a file without a measurement behind it never becomes a measurement by being repeated.
        format: DIAGNOSIS
        why: The 22-metre figure is the only distance here without a repeatable measurement behind it. Bekele's survey gives 34.2 m, and the lease plan independently matches that geometry within 0.2 m. Cardoza also places herself at the same location across three accounts. The summary traces back to a sketch marked not to scale. Repetition then gave the estimate the appearance of a measured fact. Nothing has to be falsified for a number to acquire false authority through copying.
        headline: The summary and the survey differ by twelve metres, and the street has not changed since 2019.
        readings:
          - zone: Case summary
            label: Distance to the doorway
            value: 22 m
            status: alarm
          - zone: Survey
            label: Kerb to doorway, measured
            value: 34.2 m
            status: alarm
          - zone: Officer sketch
            label: Scale
            value: marked not to scale
            status: high
            note: the only source the summary cites
          - zone: Lease plan
            label: Shop frontage
            value: agrees with the survey to 0.2 m
            status: normal
          - zone: Cardoza
            label: Where she was standing
            value: outside the launderette, unchanged in three accounts
            status: normal
        choices:
          - label: The witness has misremembered where she stood
            mechanism: The account of her position is wrong, and the summary is right.
          - label: The summary was read off a sketch with no scale
            mechanism: An estimate taken from a drawing became a figure and was then repeated.
          - label: The street has been rebuilt since 2019
            mechanism: The frontage or the kerb has moved.
          - label: The survey is in error
            mechanism: The measurement was taken from the wrong point.
        answer: The summary was read off a sketch with no scale
        rebuttals:
          - Her position is the most consistent item in the file and is confirmed by where the launderette stands.
          - A rebuild would show in the lease plan, which agrees with the survey to twenty centimetres.
          - A survey error would have to be twelve metres, and the frontage check rules that out independently.
      - group: PERCEPT
        task: Work out what an eye can resolve at the surveyed distance
        title: A centimetre of face
        place: Reconstruction Bay
        scene: |-
          Frey moves the mark to the surveyed distance and reads out the eye's resolution limit in good light. She wants to know what size of detail that limit corresponds to at the far end of the bay.
        assumes:
          - an eye in good light resolves details about one arc minute across
          - one arc minute is about 0.0003 radians
        takeaway: The resolution limit is an angle, so the size of the smallest visible detail grows with distance.
        format: BALLPARK
        question: Estimate the smallest detail an eye could resolve at the surveyed distance.
        answerText: 0.0003 × 34 = 0.0102 m, about one centimetre in good light. Low illumination makes the practical facial-detail limit coarser still.
        why: An angular resolution limit becomes a physical size once distance is supplied. At 34 metres, 0.0003 radians corresponds to about 0.0102 m, roughly one centimetre. Fine facial differences often live at that scale or below. Low light makes the practical limit worse because rod pooling trades resolution for reach. The corrected distance shrinks facial information before lighting is considered. The two-lux scene then removes still more fine detail from the visual signal.
        estimate:
          prompt: The survey puts the doorway 34 m from where Cardoza stood. An eye in good light resolves about one arc minute, which is 0.0003 radians.
          question: Choose the eye's resolution limit and the distance it is being applied over.
          labels:
            - 0.0003  (radians, one arc minute)
            - 34  (m, the surveyed distance)
            - 22  (m, the distance the summary recorded)
            - 0.063  (m, the gap between the eyes)
            - 12.5  (lux, the corner with the lamp working)
          values: [0.0003, 34, 22, 0.063, 12.5]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 0.0102
          tolerance: 0.0018
          units: m
          relationship: Resolution limit s_min = θ_min × d, with θ_min the eye's angular limit and d the distance to the face.
          solution: 0.0003 × 34 ≈ 0.010 m, about a centimetre.
          explanation: About one centimetre in good light. At the corner's two lux, practical resolution is worse. The twenty-two-metre summary figure would give a smaller value, which is why the twelve-metre correction matters. Whole-face spacing and the working-lamp lux value belong to other questions, not this multiplication.
          givens:
            - The surveyed distance is 34 m
            - An eye in good light resolves about 0.0003 radians
      - group: IDENT
        task: State what the corrected distance licenses the review to say
        title: What this does and does not settle
        place: Identification Suite
        scene: |-
          Baptiste wants the finding in the report by the end of the week. Ilori asks her to write the sentence first, because the sentence is where reviews are lost, and the room spends an hour on one line.
        assumes:
          - a limit on what could be seen is not evidence about who was there
        takeaway: A measurement can show that a procedure could not support a recognition without showing that the recognition was wrong.
        format: CHOICE
        question: What is the review entitled to conclude from the corrected distance?
        why: These measurements bound the information available to the eye. They do not observe who stood in the doorway. A witness near a visual limit can still identify correctly by chance or by information the reconstruction does not capture. The review therefore cannot infer innocence from poor viewing conditions. It can make a narrower claim about evidence. If the sightline cannot distinguish recognition from a lineup choice, the identification cannot bear more weight than the procedure can support.
        choices:
          - The sightline cannot establish recognition
          - Cardoza could not have seen any person leave the shop
          - Ward could not have been the person in the doorway
          - The identification would have been reliable at twenty-two metres
        answer: The sightline cannot establish recognition
        rebuttals:
          - The reconstruction shows weak identity information, not an inability to see that a person was present.
          - Whether Ward was there is a claim about the event, and the sightline cannot answer it.
          - Even twenty-two metres leaves identification close to the bay's failure range, so the shorter figure would not settle reliability.
  # ---------------------------------------------------------------- day 10
  - title: Who was standing behind her
    objective: Establish what the administrator's knowledge did, by removing it.
    briefing: Loomis knew which photograph was the suspect, because in 2019 the administrator always did.
    stake: >-
      Friday, and Karen Loomis has come in for the second time. She ran the array, she knew which
      photograph was Ward, and she remembers saying something to Cardoza afterwards and not what
      it was. Four features of that afternoon's procedure could have mattered and the file cannot
      separate them. Today you take them apart one at a time in the unit's own rig, work out how a
      belief travels from an officer to a witness without either of them noticing, and read what
      approval does to an account. Ilori trained the officers who replaced her.
    takeaway: Four things wrong at once is not four findings; it is one until somebody changes them one at a time.
    stops:
      - group: IDENT
        task: Isolate which feature of the 2019 procedure inflates certainty
        title: Change one thing
        place: Identification Suite
        scene: The unit's rig runs twenty volunteer administrations at a time. Four features of the 2019 procedure can be switched independently. The readout is reported certainty after a choice, and the room has to isolate which feature moves it.
        assumes:
          - a feature can only be shown to matter by changing it and changing it back
        takeaway: Changing several things at once moves the number and names nothing; one at a time, reversed, names a cause.
        format: CONTROL
        question: Four features, one effect on certainty. Establish which of them is producing it and prove it.
        control:
          hint: Switch what you like and run the block. What you change is a decision; what it tells you depends on how many things moved at once.
          observable:
            label: Volunteers reporting high certainty after choosing
            unit: "%"
          held:
            - the array
            - the description
            - the witness pool
            - the script
          variables:
            - id: knew
              label: Administrator knows which photograph is the suspect
            - id: simul
              label: All six shown together
            - id: nocaution
              label: Caution that the man may be absent omitted
            - id: room
              label: Run in the interview room rather than the suite
          truth: knew
          baseline: 68
          response: -31
          noise: 4
          changeVerb: removed
          run: Run twenty administrations
          commit: Name it
        answerText: Administrator knowledge is the cause in the rig. Removing it drops reported certainty by thirty-one points. Restoring it restores the effect. The other three features move less than the block-to-block variation.
        why: Several features changed together in the original procedure, so the file alone cannot identify a cause. A controlled test changes one variable while holding the others fixed. If confidence moves, that variable becomes a candidate explanation. Reversing the change is the stronger check. The response should return when the suspected cause is restored. Changing several features together can lower confidence and still leave every causal explanation open. Control and reversal turn association into evidence about which feature actually moved the outcome.
      - group: SOCIAL
        task: Work out how a belief reaches a witness without being stated
        title: Nobody said anything
        place: Deliberation Room
        scene: |-
          Loomis is clear that she did not point, prompt or name anybody. Ntuli believes her and plays a recording of a volunteer administration where the same thing is true and the effect is visible anyway.
        assumes:
          - people take up small cues from somebody running a procedure they are taking part in
        takeaway: Expectancy travels through timing and reaction, so an honest administrator transmits a belief as reliably as a dishonest one.
        format: CHOICE
        question: How does an administrator's knowledge reach the witness when nothing is said?
        why: Expectancy can leak through behaviour without any deliberate cue. A witness watches pauses, tone, facial reactions and timing because the administrator is the only guide to whether the task is going well. Small differences can therefore carry information. Loomis did not need to point or prompt for knowledge to matter. Blind administration removes the knowledge itself. That is more reliable than asking a well-intentioned administrator to suppress every tiny behaviour that a nervous witness might read as feedback.
        choices:
          - Through when the pause falls and how the reaction differs between the faces
          - Through the order the photographs are laid out in, which the witness reads as ranking
          - Through the administrator's answers to questions the witness asks during the array
          - Through the paperwork, which names the suspect on a page the witness can see
        answer: Through when the pause falls and how the reaction differs between the faces
        rebuttals:
          - Layout order does matter and is fixed before the witness arrives, so it cannot carry what the administrator learns during it.
          - Questions during an array are discouraged and were not asked here, and the effect appears without any.
          - The array form was face down throughout, and the effect appears in rigs where no paperwork is present at all.
      - group: MEMORY
        task: Find what confirmation changed besides the confidence
        title: What "that's our man" moves
        place: Interview Suite A
        scene: Ren Okada puts the unit's replication on the confidence screen. Half the volunteers are told their choice matched the suspect. Both groups then report how good their original view was and how long they looked.
        assumes:
          - a witness reports the conditions of an event from memory, like everything else
        takeaway: What somebody says about the circumstances of an event is itself remembered, so it can move long after the event has finished.
        format: CHOICE
        question: Besides certainty, what does confirming feedback change in a witness's later account?
        why: Post-identification feedback changes more than stated certainty. After being told their choice matches the suspect, witnesses often report a clearer view and longer attention at the event. They can also remember a better position for seeing. Those claims concern the original night but are reconstructed after feedback. That matters in court because 'I had a clear look' sounds like direct evidence about encoding. It may instead partly reflect information learned after the identification was already made.
        choices:
          - Her later report of viewing quality and duration
          - Her willingness to attend court and repeat the identification
          - How quickly she made the original choice from the array
          - How much clothing detail she can report from the event
        answer: Her later report of viewing quality and duration
        rebuttals:
          - Feedback can affect willingness to testify, but that is not a reconstructed claim about the original viewing conditions.
          - The original response time is already fixed on the array record and cannot be changed by later feedback.
          - Clothing memory can change, but the replicated feedback effect here concerns retrospective reports of viewing quality and attention.
  # ---------------------------------------------------------------- day 11
  - title: How sure, and when
    objective: Date the certainty, and separate telling faces apart from being willing to choose.
    briefing: Nothing goes wrong today. Three things get confirmed, and one of them is the lamp.
    stake: >-
      Monday of the third week, and it is the quietest day the review has had. Nothing has gone
      wrong and three things have been confirmed. The certainty statement's date is settled by the
      custody record, the mock-witness rates are in from both procedures, and the utility has
      answered Yara Solomon's letter about column 4471. Tomas Weill wants the two identification
      procedures compared properly rather than by which of them produced more identifications.
      Today you separate seeing from choosing, establish when Cardoza's certainty was written
      down, and read what the utility says about the lamp. One of those three changes the case.
    takeaway: A quiet day in a review is three confirmations, and one of them usually changes the case.
    stops:
      - group: MEASURE
        task: Compare the two procedures on how well witnesses told the faces apart
        title: Seeing, and being willing to say so
        place: Data Room
        scene: |-
          Weill has both procedures' rates on the board. The 2019-style procedure produced more identifications than the blind sequential one, and Baptiste has already called that an argument in its favour.
        assumes:
          - a procedure can be run with the offender present and with the offender absent
          - a proportion can be converted to a standard score from a table
        takeaway: A procedure that produces more identifications may only be producing more of both kinds.
        format: BALLPARK
        question: Estimate the sensitivity of the 2019-style procedure.
        answerText: d′ = 0.52 − (−0.52) = 1.04. The procedure creates many choices, but its ability to separate offender-present from offender-absent arrays is only modest.
        why: A procedure can produce many identifications simply by making witnesses more willing to choose. That raises hits and false alarms together. Sensitivity separates this response tendency from actual discrimination. Converting both rates to standard scores gives a common scale. Here 0.52 minus negative 0.52 gives d-prime = 1.04. The raw rate difference of 0.40 is not comparable in the same way. More choices are not automatically better performance when the extra choices include more false alarms.
        estimate:
          prompt: In the 2019-style procedure the volunteers picked the offender 70 per cent of the time when he was present, and picked somebody 30 per cent of the time when he was not. The table gives z = 0.52 for 0.70 and z = −0.52 for 0.30.
          question: Choose the two standard scores.
          labels:
            - 0.52  (z for a hit rate of 0.70)
            - "-0.52  (z for a false-alarm rate of 0.30)"
            - 0.70  (the hit rate itself, as a proportion)
            - 0.30  (the false-alarm rate itself, as a proportion)
            - 40  (volunteers in each condition)
          values: [0.52, -0.52, 0.7, 0.3, 40]
          slots: 2
          template: "{0} − {1}"
          formula: a-b
          correct: [0, 1]
          target: 1.04
          tolerance: 0.12
          units: standard units
          relationship: Sensitivity d′ = z(H) − z(FA), the hit rate and the false-alarm rate each converted to a standard score and subtracted.
          solution: 0.52 − (−0.52) = 1.04 standard units.
          explanation: About 1.04 standard units of separation. The blind sequential procedure in the same rig reaches 1.9 while producing fewer identifications. Subtracting the raw proportions gives 0.40, but that is not d-prime. Sensitivity uses standardised hit and false-alarm rates so willingness to choose does not masquerade as better discrimination.
          givens:
            - Hit rate 0.70, which is z = 0.52
            - False-alarm rate 0.30, which is z = −0.52
      - group: IDENT
        task: Spend two authentication credits on the records that determine what Cardoza's confidence can legitimately say about the 4 December choice.
        title: Buy the confidence that still means something
        place: Identification Suite
        scene: Case analyst Solomon brings four sealed record pulls to the confidence desk. Two can be authenticated before the day's board packet closes. Somewhere in them are Cardoza's words on 4 December and her certainty statement on 26 December.
        assumes:
          - a witness's certainty can change between the identification and a later statement
        takeaway: Confidence is evidence about accuracy only when its timing and the information available before it are preserved.
        format: VALUE
        question: Which records are worth authenticating before the board packet closes?
        value:
          decision: What can the report legitimately say about confidence at the moment of the 4 December identification?
          budget:
            amount: 2
            unit: authentication credits
            label: Records that can be authenticated before the board packet closes
          hint: Buy records whose timing can change the meaning of confidence. A useful adjacent fact can still be poor value for this decision.
          options:
            - id: array_form
              label: Authenticate the original 4 December array form
              cost: 1
              axis: initial confidence
              decisive: true
              reveals: The witness's recorded words at the choice were “maybe, number four.”
            - id: certainty_statement
              label: Authenticate the 26 December certainty statement
              cost: 1
              axis: later confidence
              decisive: true
              reveals: Three weeks later the file records “absolutely certain.”
            - id: policy
              label: Pull the full 2019 array-policy manual
              cost: 2
              axis: procedure policy
              decisive: false
              reveals: The simultaneous procedure followed the policy of its year; the manual does not recover initial confidence.
            - id: current_test
              label: Repeat the 2026 face-matching test
              cost: 2
              axis: current ability
              decisive: false
              reveals: A current matching score says nothing about how certain the 4 December choice was at the moment it was made.
        answerText: Authenticate the 4 December array form and the 26 December statement. Together they preserve the change from “maybe, number four” to “absolutely certain” and show why the later wording cannot be substituted for initial confidence.
        why: "Confidence has its strongest relation to accuracy when it is recorded immediately after an uncontaminated identification. Later certainty includes everything learned after the choice. That can include feedback, charging decisions and repeated commitment to the identification. The 4 December form preserves Cardoza's own words: 'maybe, number four.' The 26 December statement says 'absolutely certain.' Both are real records. They answer different questions because three weeks of post-identification experience lie between them."
      - group: PERCEPT
        task: Read what the utility says about the lamp
        title: Column 4471
        place: Reconstruction Bay
        scene: Vision scientist Frey lays the utility fault ticket for column 4471 beside the bay switch. It runs from 2 to 21 November 2019. She kills the modeled lantern; the doorway meter settles near two lux from shop-window spill.
        assumes:
          - illuminance falls off with the square of the distance from a source
        takeaway: With the column out, what light the corner had came from a shop window twelve metres the other way.
        format: CHOICE
        question: What does the fault ticket do to the twelve lux the review calculated on day four?
        why: The 12.5-lux calculation described column 4471 if its lantern was working. The utility ticket shows it was out from 2 through 21 November, including the robbery on 14 November. The arithmetic was correct and the premise was false. Bekele's reconstruction leaves about two lux of shop-window spill at the doorway. That is dim rather than dark. It also pushes vision toward rods, where colour disappears and fine facial detail becomes much coarser than in the working-lamp model.
        choices:
          - It removes the source that figure was calculated from, leaving the shop window
          - It shows the calculation was done with the wrong intensity for that lantern
          - It means the corner was completely dark, so nothing could have been seen at all
          - It changes the distance the illuminance should have been calculated over
        answer: It removes the source that figure was calculated from, leaving the shop window
        rebuttals:
          - The lantern's rating is from the utility's own asset record and is not in question.
          - Two lux is dim rather than dark, and a review that says nothing could be seen overclaims immediately.
          - The distance from lamp to doorway was correct; the objection is that the lamp was not lit.
  # ---------------------------------------------------------------- day 12
  - title: The nineteenth hour
    objective: Read the interview that produced the only words the file has from Ward.
    briefing: Nineteen hours in custody, no lawyer, and an agreement retracted the next morning.
    stake: >-
      Tuesday, and the custody log is the last document in the file nobody has read closely. Elias
      Ward was arrested at 06:40 on 3 December 2019 and agreed with an account put to him at 01:20
      the following morning, which he withdrew eight hours after that. Samuel Oyelaran has the log
      and Priya Raghunathan has the times. Ren Okada has something else, from a different part of
      the case: the appeal solicitor re-interviewed Deniz Aktaş in 2023 and his account has moved
      four details. Today you weigh a state, name the tactic the interview used, and find out what
      asking somebody again after years actually produces.
    takeaway: An admission is evidence about the interview as well as about the event, and the interview is on the record.
    stops:
      - group: BRAIN
        task: Move the cognitive-control assumption to its pessimistic end, then choose the evidentiary treatment that remains defensible.
        title: What survives the bad end of nineteen hours
        place: Physiology Bay
        scene: Priya Raghunathan and clinical psychologist Oyelaran put the custody log beside Ward's 01:20 agreement. Baptiste wants a sentence the board can use. The panel instead asks which treatment of the admission still works if cognitive control was badly degraded.
        assumes:
          - the ability to weigh a future consequence against a present one degrades without sleep
        takeaway: A decision is more robust when it still works under the pessimistic end of an uncertain psychological state.
        format: STRESS
        question: How should the review use Ward's 01:20 agreement if his ability to weigh distant consequences was badly reduced?
        stress:
          hint: Move cognitive-control reserve down to twenty. The quick treatment is the one that counts the agreement as corroboration; the question is which one is still defensible when his reserve was at the bad end of the range.
          assumption:
            id: control_reserve
            label: Cognitive-control reserve
            min: 20
            max: 100
            step: 10
            nominal: 70
            unit: index
          criteria:
            - id: no_false_independence
              label: Does not count an officer-supplied account as independent knowledge
              operator: ">="
              target: 1
              key: no_false_independence
            - id: no_state_verdict
              label: Does not treat sleep loss itself as proof of truth or falsity
              operator: ">="
              target: 1
              key: no_state_verdict
            - id: closure_days
              label: Working days to a board-ready conclusion
              unit: days
              direction: lower_is_better
              key: closure_days
          candidates:
            - id: rely
              label: Treat the agreement as independent corroboration
            - id: corroborate
              label: Use only independently corroborated details Ward supplied himself
            - id: discard
              label: Discard the agreement solely because he was exhausted
            - id: withdrawal
              label: Treat the morning withdrawal as proof the agreement was false
          robust: corroborate
          optimiseOn: closure_days
          feasible:
            rely: 70
            corroborate: 20
            discard: 110
            withdrawal: 110
          scores:
            rely:
              no_false_independence: 0
              no_state_verdict: 1
              closure_days: 2
            corroborate:
              no_false_independence: 1
              no_state_verdict: 1
              closure_days: 9
            discard:
              no_false_independence: 1
              no_state_verdict: 0
              closure_days: 3
            withdrawal:
              no_false_independence: 1
              no_state_verdict: 0
              closure_days: 4
        answerText: Require independent corroboration for any detail Ward supplied himself. At the lowest cognitive-control reserve, this is the only candidate still feasible. It also avoids treating exhaustion as proof that the agreement was false.
        why: Sleep loss changes decision control without proving that any statement is false. After nineteen hours awake, immediate relief can outweigh a distant legal cost. Minimisation can strengthen that pressure by making agreement feel cheaper in the room. Ward added no unique detail to the account put to him. He withdrew it after sleep without receiving new information. Those facts make independent corroboration essential. The safest evidentiary use is the one that still works if his cognitive control was near the pessimistic end.
      - group: SOCIAL
        task: Name what the officer's version of the account offered
        title: The cheap version
        place: Deliberation Room
        scene: |-
          Ntuli reads the account that was put to Ward at 01:20. It describes a man who went along with something, who did not plan it, and who was not the one holding the bag.
        assumes:
          - people admit more readily to a version that costs them less
        takeaway: Minimisation lowers what an admission appears to cost, and the law does not price it the way the interview room does.
        format: CHOICE
        question: What does offering a lesser version of the act change for somebody in the room?
        why: Minimisation changes the apparent price of agreeing. A version where somebody merely went along can feel like an explanation rather than a confession. That makes agreement look like a route out of the room. The legal consequence may remain unchanged. The tactic therefore affects decision framing rather than the truth of the account. It is different from feeding facts, which contaminates content. Here the concern is that the offered story makes immediate compliance feel cheaper than continued resistance.
        choices:
          - It makes agreeing feel cheap while the legal consequence stays the same
          - It gives the suspect facts he can use to make a false account convincing
          - It removes the interviewer's obligation to caution him again
          - It shortens the interview, which is what the tactic exists to do
        answer: It makes agreeing feel cheap while the legal consequence stays the same
        rebuttals:
          - Feeding facts is a separate fault, contamination rather than minimisation, and it makes an admission look more reliable than it is.
          - The caution stands throughout an interview and is unaffected by how an account is phrased.
          - Interviews under minimisation are often longer, and brevity is not what the tactic is for.
      - group: MEMORY
        task: Find out what a re-interview after years actually records
        title: What Aktaş remembers now
        place: Interview Suite B
        scene: Baptiste asks whether the unit should re-interview Cardoza before the report closes. Ren Okada puts Deniz Aktaş's 2023 interview beside his 2019 statement. Four new details appear, each already present somewhere in the public record.
        assumes:
          - an account can be compared with an earlier account by the same person
        takeaway: An account given years later records everything the person has met since, and there is no way to subtract it.
        format: CHOICE
        question: What does the 2023 re-interview establish about asking Cardoza again now?
        why: Later interviews cannot be cleaned back to their earlier state. Aktaş's four new details all have sources in the public record, yet he now experiences them as memories of the shop. Good interview technique protects information before contamination. It cannot subtract years of trials, news and retelling. That is why the November 2019 Cardoza account is perishable evidence. Re-interviewing her in 2026 would create another account while destroying the unit's ability to compare future material with an untouched baseline.
        choices:
          - A new account would record seven years of exposure rather than the night
          - A new account would be inadmissible, because too much time has passed
          - A new account would contain less detail than the original and add nothing
          - A new account would be reliable if it were taken with a proper interview method
        answer: A new account would record seven years of exposure rather than the night
        rebuttals:
          - Late accounts are admitted routinely; the objection here is what the account would be evidence of.
          - New accounts are often longer rather than shorter, and Aktaş's has grown by four details.
          - Interview method protects an uncontaminated account and does nothing for one that has already met the trial.
  # ---------------------------------------------------------------- day 13
  - title: What a match is worth
    objective: Put the identification in the pool it came from, and measure the procedure against itself.
    briefing: Three claims are ready and the board reads three weeks of work as one page.
    stake: >-
      Wednesday, and three things are ready at once. Weill has the pool of men who could have been
      on that street; Ilori has six hundred runs of the unit's own procedure with known-innocent
      arrays; Baptiste wants to know which of the review's findings goes at the top of a page a
      board will read in ten minutes. Today you work out what an identification multiplies, find
      what the unit's own procedure cannot see, and rank three claims by how hard each is to
      argue with. The order they appear in is most of what the board will take away.
    takeaway: The strength of a piece of evidence and the strength of a case are different quantities.
    stops:
      - group: MEASURE
        task: Work out what the identification does to the odds
        title: The pool the identification came from
        place: Data Room
        scene: |-
          Weill has two numbers on the board and will not put them together until the room agrees what each of them assumes. One is about Hallam and one is about the procedure.
        assumes:
          - odds before the evidence are set by how many people could have been responsible
          - evidence multiplies odds rather than replacing them
        takeaway: The same identification means one thing in a pool of twelve and another in a pool of four thousand.
        format: BALLPARK
        question: Estimate the odds that the identified man is the offender, given the pool and the procedure.
        answerText: 0.00025 × 15 = 0.00375 posterior odds, about 1:267. The result depends on both the pool assumption and the measured value of the procedure.
        why: Evidence changes prior odds by multiplying them. The starting odds depend on the pool of people who could have fit the basic circumstances. The review uses 4,000, giving prior odds of 0.00025. The procedure contributes a likelihood ratio near 15. Multiplying gives 0.00375, about one to 267 in odds. That number depends on both assumptions. The identification is not worthless, but its value cannot be stated without the base rate and the procedure's measured discrimination.
        estimate:
          prompt: The review's stated pool is 4,000 men who could have been on that street fitting the description, giving prior odds of 0.00025. The mock-witness work puts the likelihood ratio for an identification from the 2019 procedure at about 15.
          question: Choose the prior odds and the multiplier the procedure earns.
          labels:
            - 0.00025  (prior odds, from a pool of 4,000)
            - 15  (likelihood ratio for the 2019 procedure)
            - 60  (likelihood ratio for a blind sequential procedure)
            - 4000  (men in the pool)
            - 0.0102  (m, the resolution limit at 34 m)
          values: [0.00025, 15, 60, 4000, 0.0102]
          slots: 2
          template: "{0} × {1}"
          formula: a*b
          correct: [0, 1]
          target: 0.00375
          tolerance: 0.0009
          units: odds
          relationship: Posterior odds = prior odds × likelihood ratio, the odds before the evidence multiplied by how much more often that evidence arises when the claim is true.
          solution: 0.00025 × 15 ≈ 0.0038, which is odds of about 1 in 270.
          explanation: Posterior odds are 0.00375, about one to 267, on the review's stated assumptions. A stronger procedure would earn a larger likelihood ratio, but the same base rate still matters. The pool size and visual-resolution value are inputs to other parts of the review and are distractors here, not multipliers.
          givens:
            - Prior odds of 0.00025, from a pool of 4,000
            - A likelihood ratio of about 15 for the 2019 procedure
      - group: IDENT
        task: Measure the unit's own procedure against a population it knows the truth about
        title: Six hundred arrays with no offender in them
        place: Identification Suite
        scene: |-
          Ilori has six hundred synthetic cases where the offender is known to be absent, and four versions of the procedure to push them through. What comes back is a measurement of the procedure rather than of anybody's guilt.
        assumes:
          - a procedure can be run on cases whose answer is already known
          - when the offender is absent, any pick is an error
        takeaway: Running a known population through your own procedure measures the procedure, and the errors it makes are the ones your real cases contain.
        format: INJECT
        question: Run the versions you want, then recommend the one that actually buys something.
        inject:
          hint: The offender is absent from every one of these arrays, so every pick is an error. What differs is where the errors land.
          population:
            n: 600
          metric:
            label: share of picks landing on a filler rather than the suspect
            unit: "%"
          configs:
            - id: current
              label: The 2019 procedure as run
              detections: 402
              metric: 34
            - id: caution
              label: Add the may-not-be-present caution
              detections: 250
              metric: 61
            - id: fillers
              label: Rebuild the array with matched fillers
              detections: 300
              metric: 71
            - id: blindseq
              label: Blind administration, shown one at a time
              detections: 190
              metric: 78
          best: blindseq
          blindSpot: No version tells you whether the offender was in the array in the first place. An innocent-suspect run measures where a procedure's errors land, and never whether a particular case is one of them.
          commit: Recommend it
        answerText: Use blind administration with sequential presentation. It produces the fewest identifications and sends more errors onto fillers, where the mistake is visible. A filler error cannot masquerade as a correct suspect identification.
        why: Every synthetic array here is offender-absent, so every identification is an error by design. The useful question is where those errors land. A filler pick announces itself because the selected person is known not to be the suspect. A suspect pick looks like a normal identification and can travel further through a case. Injection therefore measures the pipeline's blind spot. The best procedure is not the one producing the most identifications. It is the one producing fewer dangerous, non-self-announcing errors.
      - group: SOCIAL
        task: Rank three findings by how hard each is to argue with
        title: The order the board reads them in
        place: Deliberation Room
        scene: Three findings sit on one page and the board has ten minutes. Grace Ntuli places the cards along the corridor from the rebuilt corner to the interview room. She asks which finding should make the reader stop first.
        assumes:
          - a reader gives most weight to what they read first
        takeaway: Put the finding nobody can argue with first, because it is what the arguable ones are then read against.
        format: CHOICE
        question: Which finding should open the report?
        why: A board gives early claims more attention and uses them to frame what follows. The distance finding is unusually strong because anyone can repeat it with a tape. The lease plan independently confirms it. Opening there forces the reader to confront a concrete error before reaching studies run by the unit. Mock-witness results then explain the procedure. Feedback and custody findings are more inferential. They land better after the report has established that its first reversal is physically repeatable.
        choices:
          - The surveyed distance, which anybody can repeat with a tape
          - The functional size of the array, which rests on the unit's own volunteers
          - The account of what feedback did to Cardoza's certainty
          - The custody log's account of the nineteenth hour of interview
        answer: The surveyed distance, which anybody can repeat with a tape
        rebuttals:
          - The functional size is the review's best experimental work and it is the unit's own volunteers, which is exactly what a sceptical reader questions first.
          - What feedback did is an inference from a pattern rather than a measurement of this witness, and it reads as speculation in the opening line.
          - The custody log is about a different half of the case, and opening on the interview invites the reader to treat the review as advocacy.
  # ---------------------------------------------------------------- day 14
  - title: The last reversible moment
    objective: Decide what else to buy, and what asking again would cost.
    briefing: After today the report is drafting, and one of the options on the table cannot be undone.
    stake: >-
      Thursday, and this is the last day anything can still be added. Ines Baptiste has funding
      for one more piece of work and four proposals in front of her, one of which is a fresh
      interview with Alma Cardoza. Ren Okada has spent two weeks explaining what that would spend.
      Samuel Oyelaran has been asked whether Cardoza's distress about the case tells anybody
      anything. Today you choose what to buy, read a test score against the norms it belongs to,
      and settle what a frightened witness's state does and does not establish.
    takeaway: The value of a measurement is the decision it would change, and one of these cannot be taken back.
    stops:
      - group: MEMORY
        task: Spend the final three workdays on evidence that can still change the report without destroying evidence the unit cannot replace.
        title: Three days, and one irreversible purchase
        place: Interview Suite A
        scene: Three days remain. Ren Okada lays four proposals on the last empty desk and turns the re-interview card face down. He says one purchase can consume evidence the unit will never be able to restore.
        assumes:
          - work that cannot change a conclusion is not evidence for it
          - some evidence is used up by being collected
        takeaway: The best evidence purchase changes the decision without consuming information that cannot be recovered later.
        format: VALUE
        question: Which work do you buy with the last three days?
        value:
          decision: What evidence should the unit buy before the final recommendation is locked?
          budget:
            amount: 3
            unit: workdays
            label: Time remaining before disposition
          hint: Open each proposal to see what it can change. Count an irreversible re-interview as a cost even if it fits on the calendar.
          options:
            - id: camera
              label: Obtain the 2019 shop-camera maintenance record
              cost: 1
              axis: camera chronology
              decisive: true
              reveals: Whether the camera recorder was already out on the robbery date, fixing a second physical timeline fact.
            - id: survey
              label: Commission the board-appointed independent corner survey
              cost: 2
              axis: distance provenance
              decisive: true
              reveals: Whether an outside survey reproduces Bekele's 34.2 m result, answering the board's written independence question.
            - id: reinterview
              label: Re-interview Alma Cardoza with a full cognitive interview
              cost: 1
              axis: memory
              decisive: false
              reveals: A 2026 account after years of exposure; collecting it ends the clean comparison with the 2019 pre-photograph account.
            - id: mock_extension
              label: Extend the mock-witness study from 40 to 200 volunteers
              cost: 3
              axis: lineup precision
              decisive: false
              reveals: A narrower interval around a functional-size result that is already far outside a fair six-member array.
        answerText: Buy the board-appointed independent survey and the 2019 camera-maintenance record. Together they use the three authored workdays and address open physical questions. Do not spend the final window re-interviewing Cardoza or merely tightening the already decisive mock-witness estimate.
        why: Evidence has value when it can change the recommendation. The independent survey answers a question the board has already asked and tests the unit's central physical finding. The camera record can settle another dated fact cheaply. More mock witnesses would narrow an interval that is already far from a fair six-person array. Re-interviewing Cardoza is different because it consumes something. It creates new post-event information and ends the possibility of keeping the 2019 account as the last pre-photograph baseline.
      - group: MEASURE
        task: Read the 2026 test score against the group it should be compared with
        title: One score, and what it is compared against
        place: Data Room
        scene: "Alma Cardoza took a standard face-matching test for the unit in March and scored 42. Tomas Weill opens the age-band norms beside it: mean 51, standard deviation 7, with the rebuilt street visible through the glass."
        assumes:
          - a raw score has no meaning without the distribution it came from
        takeaway: A standard score says how unusual a result is, which is the only form in which one person's score can be compared with anybody's.
        format: BALLPARK
        question: Estimate how far below the norm group's mean Cardoza's score falls, in standard deviations.
        answerText: The score is 1.29 standard deviations below the norm mean; the signed z-score is −1.29. That standardises a 2026 test result and does not recreate 2019 identification accuracy.
        why: A raw score becomes interpretable only against a norm distribution. Cardoza's 42 is nine points below the mean of 51. Dividing that gap by the seven-point standard deviation gives 1.29 standard deviations below the mean. The signed z-score is therefore -1.29. That is low but not a diagnosis. The test was also taken seven years after the robbery. Face matching with pictures present is related to, but different from, identifying a remembered face from a dark street.
        estimate:
          prompt: Cardoza scored 42 on the face-matching test. The norms for her age band give a mean of 51 and a standard deviation of 7.
          question: Choose the norm group's mean, her score and the standard deviation.
          labels:
            - 51  (mean of the norm group)
            - 42  (her score)
            - 7  (standard deviation of the norm group)
            - 60  (highest score the test allows)
            - 34  (m, the surveyed distance)
          values: [51, 42, 7, 60, 34]
          slots: 3
          template: ({0} − {1}) ÷ {2}
          formula: (a-b)/c
          correct: [0, 1, 2]
          target: 1.29
          tolerance: 0.2
          units: standard deviations
          relationship: A standard score is z = (X − μ) / σ. For a score below the mean, (μ − X) / σ gives the same size without the sign.
          solution: (51 − 42) ÷ 7 = 1.29 standard deviations below the mean; the signed z-score is −1.29.
          explanation: The score is 1.29 standard deviations below the norm mean, so its signed z-score is −1.29. That locates the score in the norm distribution. It does not diagnose a condition, and it does not recreate vision or memory from 2019. The maximum score and the surveyed street distance are real numbers, but neither belongs in this standardisation calculation.
          givens:
            - A score of 42 against a norm group mean of 51
            - A norm group standard deviation of 7
      - group: BRAIN
        task: Settle what the witness's distress establishes
        title: What being frightened is evidence of
        place: Physiology Bay
        scene: |-
          Oyelaran has been asked twice this week whether Cardoza's distress about the case supports her identification, and once whether it undermines it. He writes both questions on the board and answers neither.
        assumes:
          - distress can be assessed without assessing what caused it
        takeaway: A state that both possibilities predict cannot tell them apart, however strongly it is felt.
        format: CHOICE
        question: What does Cardoza's distress about this case establish about her accuracy?
        why: Distress is real and can be measured, but it does not point toward accuracy or error. A witness who was right can be distressed after seven years. A witness who was wrong can be distressed too. Sincerity therefore cannot be converted into identification accuracy. The assessment still has a useful purpose. It can inform whether another interview would harm Cardoza. That is a question about her present welfare, not a way to infer what happened on Ferrier Street in 2019.
        choices:
          - It establishes distress, not the direction of identification accuracy
          - It shows the event was encoded more strongly than an ordinary memory
          - It shows later pressure must have changed the original identification
          - It proves another interview would be unsafe regardless of her current assessment
        answer: It establishes distress, not the direction of identification accuracy
        rebuttals:
          - Later distress does not measure encoding strength and is separated from the event by seven years.
          - Years of pressure may affect memory, but distress alone cannot show that it did so in this case.
          - Whether another interview is safe requires a present clinical assessment. Distress by itself does not settle that decision.
  # ---------------------------------------------------------------- day 15
  - title: Disposition
    objective: Say what the review holds, how strongly it holds each part, and what it does not claim.
    briefing: One page to the board, and every sentence on it has to survive being argued with.
    stake: >-
      Friday, and the report goes tonight. Ines Baptiste has the page in front of her; Ren Okada
      has a list of the things the review is not entitled to say; Marcus Ilori wants the
      recommendation to be about the procedure rather than about Karen Loomis, who followed the
      policy of her year. Elias Ward has served seven years and three weeks. Today you sort the
      review's claims by what stands behind each one, settle what the recommendation actually
      asks the board to do, and name which findings would still hold if every witness in the case
      withdrew tomorrow. Nothing can be added after tonight.
    takeaway: A review that says only what it can support is the only kind a board can act on.
    stops:
      - group: SOCIAL
        task: Match each claim to what stands behind it.
        title: What stands behind each sentence
        place: Deliberation Room
        scene: |-
          Four sentences from the draft are on the table. Ntuli asks the room to put each one beside the kind of support it actually has, and warns that one of them has none.
        assumes:
          - claims of different kinds cannot be defended in the same way
        takeaway: Every sentence in a report is answerable in a particular way, and the ones that are not answerable at all should not be in it.
        format: CASEBOOK
        why: Different claims require different kinds of support. A distance can be checked by another survey. A lineup effect can be tested by repeating an experiment. A chronology can be checked against dated records. The claim that Ward was not the man has none of those supports in this review. Leaving that sentence out protects the others. A report gains credibility when each claim has matching evidence. Unsupported conclusions should remain explicitly unresolved.
        scenarios:
          - The doorway is 34 m from where the witness stood.
          - The array offered about one and a half real alternatives.
          - The certainty in the file was recorded three weeks after the choice.
          - Elias Ward was not the man who came out of the shop.
        choices:
          - Measured on the ground and confirmed against an independent plan.
          - Measured on strangers who never saw the crime, and repeatable next week.
          - Established by dates on three documents, none of which is a memory.
          - Not established by anything in this review, and not what the review is for.
        mapping: [0, 1, 2, 3]
      - group: IDENT
        task: Settle what the recommendation actually asks for
        title: What the board is being asked to do
        place: Identification Suite
        scene: Ines Baptiste has three versions of the closing sentence and has struck out two. Marcus Ilori reads the survivor at the end of the sightline. The board packet closes tonight, after seven years of a fourteen-year sentence.
        assumes:
          - a review recommends a course of action rather than reaching a verdict
        takeaway: A recommendation should be no broader than the evidence chain that can still support it under challenge.
        format: CHOICE
        question: What should the review's recommendation ask the board to do?
        why: The review can assess the weight of the identification without reconstructing the robbery itself. Referral asks the body with authority to reopen a conviction to examine evidence that cannot carry the role assigned to it. The same procedural finding also matters beyond Ward because Loomis followed the policy then in force. Discipline would misplace the failure on an individual. An innocence finding would go further than the evidence. The recommendation should match the strongest claim the review can actually support.
        choices:
          - Refer the conviction back because the identification cannot carry it alone
          - Recommend release because the review has disproved the identification
          - Limit the finding to Ward's case and leave the 2019 procedure out of it
          - Record the concerns but wait for new evidence about the robbery
        answer: Refer the conviction back because the identification cannot carry it alone
        rebuttals:
          - The review has shown limits on the identification, not who stood in the doorway.
          - The procedure is the general finding. Loomis followed the policy then in force, so limiting the result to one case misses the cause.
          - Waiting leaves a conviction resting on evidence the review has already shown cannot bear the weight assigned to it.
      - group: PERCEPT
        task: Name the findings that survive without any witness
        title: What holds if everybody withdraws
        place: Reconstruction Bay
        scene: Vision scientist Frey shuts the bay lamps down for the last time. She repeats the question from the first morning. Which findings would remain true if nobody involved in the case ever spoke again?
        assumes:
          - a claim about a place can be checked without the people who were there
        takeaway: The findings that need no witness are the ones a review can promise will still be there next year.
        format: CHOICE
        question: Which finding would still stand if every witness in the case withdrew tomorrow?
        why: Some findings survive because they do not depend on anyone's memory. Distance can be remeasured. The utility record and reconstruction can establish lighting. Visual limits can be tested again at the same range. Those claims remain available if every witness withdraws. Other findings still matter, but they depend on forms, logs or accounts. Physical measurements are unusually durable because another person can reproduce them later. That makes them the spine of a review that expects its evidence to be challenged.
        choices:
          - The distance, the illuminance and what an eye resolves at that range
          - The certainty recorded on the array form at the time of the choice
          - The four particulars the two accounts agree on
          - The state Ward was in at the nineteenth hour of the interview
        answer: The distance, the illuminance and what an eye resolves at that range
        rebuttals:
          - The array form is a strong document and it is still a record of what one person said.
          - The agreeing particulars come from two accounts and go with them if either is withdrawn.
          - The custody log is a record about a person, and its value depends on his account of that night.
# Callback lessons. From day 3 the engine appends a fourth call revisiting an
# area taught earlier, and it prefers a "— Review" variant where one exists.
lessons:
  - group: PERCEPT
    title: How much light the corner had — Review
    task: Apply the inverse square where the source is not the one you expect
    place: Reconstruction Bay
    scene: >
      Frey has moved the bay's lamp to the shop window and asks the same question about a
      different source. The window is twelve metres from the doorway on the other side.
    assumes:
      - illuminance depends on the distance from the source to the surface being lit
    takeaway: Illuminance belongs to the surface and the source; where anybody stands to look is a separate calculation.
    format: CHOICE
    question: A witness steps ten metres further back from the doorway. What happens to the light on the doorway?
    choices:
      - 'Nothing: the light on it is set by the lamp, not by her'
      - It falls by about a third, because she is further from the scene
      - It falls by a quarter, following the inverse square
      - It rises, because her eyes adapt as she moves into the dark
    answer: 'Nothing: the light on it is set by the lamp, not by her'
    why: >
      Illuminance is a property of the surface and the source. Moving an observer changes
      neither. What her extra ten metres changes is the angle the face subtends, and that is a
      separate calculation. Putting the observer distance into the light arithmetic is the
      commonest error in this material. The two belong apart because they cost the
      identification different things. One takes detail out of the scene. The other takes it out
      of the eye.
    rebuttals:
      - The inverse square applies to the source and the lit surface, and she is neither.
      - A quarter would be right if the lamp had moved twice as far away, which is not what happened.
      - Adaptation changes what she can use and leaves the light on the doorway exactly where it was.
  - group: MEMORY
    title: Six seconds, and what they hold — Review
    task: Decide what a longer viewing would and would not have bought
    place: Interview Suite A
    scene: >
      Okada puts the question the other way round. Suppose the file said sixteen seconds rather
      than six. What would the review be able to say then?
    assumes:
      - attention selects part of a scene at a time
    takeaway: More time helps only if the extra time was spent on the face, and no witness can report how it was spent.
    format: CHOICE
    question: What would a longer reported viewing time actually establish?
    choices:
      - That more could have been encoded, without saying that any of it was the face
      - That the identification would have been reliable at that distance, whatever the light
      - That the witness had time to compare the face with somebody she knew
      - That the account would contain fewer errors of detail overall
    answer: That more could have been encoded, without saying that any of it was the face
    why: >
      Duration bounds what was possible and reports nothing about what happened inside it. A
      longer event gives attention more to spend, and where it was spent is set by what was
      threatening, moving or unexpected rather than by what an investigation later needs. This
      is why the reported duration is a weak quantity in both directions: it cannot rescue an
      identification at the resolution limit, and a short viewing does not by itself refute one.
    rebuttals:
      - Reliability at a distance is set by what the eye can resolve, and time does not improve that.
      - Comparison with a familiar face needs the face to be resolvable in the first place.
      - Errors of detail track what was attended to, not how long the whole event lasted.
  - group: IDENT
    title: Six at once — Review
    task: Say what changes when the faces arrive one at a time
    place: Identification Suite
    scene: >
      Ilori runs the same six photographs past a volunteer singly, with a decision required on
      each before the next appears. He asks the room what has actually changed.
    assumes:
      - a witness shown several faces together can compare them
    takeaway: Sequential presentation removes the comparison, so each face has to be answered against the memory instead of against the others.
    format: CHOICE
    question: What does showing the photographs one at a time take away from the witness?
    choices:
      - The option of picking whichever face is nearest the rest
      - The chance to see every photograph before deciding anything
      - The ability to describe why a particular face was chosen
      - The record of how long she spent on each photograph
    answer: The option of picking whichever face is nearest the rest
    why: >
      A row of faces supports a comparison, and a comparison always has a winner. Taken one at a
      time, the question changes to whether this face is the man, which can be answered no six
      times in a row. The cost is real: sequential procedures produce fewer identifications, and
      some of the ones they lose are correct. What they lose more of is picks that land on an
      innocent member, which is the error a court cannot see.
    rebuttals:
      - Seeing all of them is exactly what is removed, and the review's question is what that removal buys.
      - Reasons can be given under either procedure and are recorded in both.
      - Timing is recorded better under sequential presentation, since each decision is separate.
  - group: BRAIN
    title: What the dark takes — Review
    task: Work out what a witness in a dark street is reliable about
    place: Dark Adaptation Booth
    scene: >
      Raghunathan asks the reverse question. Two lux takes colour and fine detail away; the room
      has spent a fortnight on what is lost, and she wants the other half of the list.
    assumes:
      - rods are sensitive, coarse and colour-blind
    takeaway: A dark-adapted witness is a good instrument for movement, outline and direction, and a poor one for a face.
    format: CHOICE
    question: What is a witness at two lux most likely to be right about?
    choices:
      - The way the man moved and the direction he went
      - The colour of the jacket he was wearing
      - The features of the face under the hood
      - Whether the man had a mark on his chin
    answer: The way the man moved and the direction he went
    why: >
      Rods pool their signals, which buys reach in the dark and costs resolution, and they are absent
      from the very centre of gaze — so a dark scene delivers movement, outline and heading well
      and everything fine badly. A report that treats a witness as reliable or unreliable as a
      whole gets this wrong in both directions. The useful question is always which part of the
      account the conditions could support, and gait and direction are the parts that survive
      two lux at thirty-four metres.
    rebuttals:
      - Colour vision needs cones and is gone below a few lux, whatever the witness believes she saw.
      - Facial features are the first thing the coarse rod system loses.
      - A chin mark is a small detail on a face, which is the hardest thing on this list.
  - group: SOCIAL
    title: What a clean file would look like — Review
    task: Apply the standard the room wrote down on the first morning
    place: Deliberation Room
    scene: >
      Ntuli reads back the whiteboard from the first morning. The room agreed then what a sound
      2019 procedure would have looked like, and she wants to know what the list is for now.
    assumes:
      - a standard agreed in advance can be compared against afterwards
    takeaway: A standard written before the reading turns the report into a comparison anybody can repeat.
    format: CHOICE
    question: What does the review gain by comparing the file against a standard it wrote first?
    choices:
      - A reader can check the comparison without trusting the reviewers
      - The findings become harder for the sponsor of the review to overrule
      - The team avoids disagreeing with each other about individual documents
      - The report can be written more quickly at the end of the work
    answer: A reader can check the comparison without trusting the reviewers
    why: >
      A finding stated as a comparison against a written standard is checkable by somebody who
      thinks the reviewers are biased: they can dispute the standard, or dispute whether the file
      meets it, and both arguments are out in the open. A finding stated as a judgement is not
      checkable at all. The protection is the same one a prespecified analysis gives an
      experiment, and it works for the same reason — the standard cannot be adjusted after the
      answer is known.
    rebuttals:
      - Overruling is a matter of authority, and a written standard makes the disagreement visible rather than impossible.
      - Internal disagreement is useful and a standard does not remove it; it gives it something to be about.
      - Writing is faster with a standard, and speed is not the protection being bought.
  - group: MEASURE
    title: A word where a reading should be — Review
    task: Tell a measurement from a description in a second document
    place: Records Store
    scene: >
      Achterberg hands over a page from another case. It records that a corridor was "well lit",
      that a door was "about two metres" from a bed, and that a lamp was "the usual type".
    assumes:
      - a measurement states its units and can be repeated
    takeaway: A quantity somebody could repeat is a measurement; everything else is a description, however numerical it looks.
    format: CHOICE
    question: Which of these three entries is closest to a measurement?
    choices:
      - "About two metres, because a distance and a unit are stated"
      - "Well lit, because it describes a condition anybody would recognise"
      - "The usual type, because it identifies the fitting"
      - None of them, because all three were written from memory
    answer: "About two metres, because a distance and a unit are stated"
    why: >
      A measurement names a quantity and a unit, which is what lets somebody else go back and get
      the same number or a different one. "About two metres" is a weak measurement — no
      instrument, no tolerance — and it is still checkable in a way that "well lit" and "the
      usual type" are not, because it says what would count as disagreement. That is the test to
      apply to any file: not whether the entry sounds precise, but whether it says what would
      have to be true for it to be wrong.
    rebuttals:
      - "Well lit" names no quantity, so nothing could contradict it.
      - "The usual type" identifies a fitting by custom rather than by specification, and the custom has changed since.
      - Being written from memory weakens all three and does not make the one with a unit equivalent to the two without.

  - group: IDENT
    title: What the first description constrains — Review
    task: Say what the file does not record about the witness and the man
    place: Identification Suite
    scene: >
      Ilori has the description form and the array side by side again. Weill asks a question
      nobody has asked out loud: what does the file say about how familiar those faces were to
      the person looking at them.
    assumes:
      - people differ in how much experience they have of particular faces
    takeaway: Telling faces apart is a practised skill, and a review can only report what was measured about it.
    format: CHOICE
    question: What does the cross-race effect require the review to note about this identification?
    choices:
      - That the file records nothing about how familiar such faces were to her
      - That the identification is unreliable and should be set aside on that ground
      - That the witness holds a view about the group the suspect belongs to
      - That the effect applies only where a witness has said the faces looked alike
    answer: That the file records nothing about how familiar such faces were to her
    why: >
      Faces from a group somebody has little day-to-day experience of are harder to tell apart,
      and the effect is large, repeated and about exposure rather than about attitudes. It is a
      fact about practice, in the same way that reading unfamiliar handwriting is. What it means
      for a review is narrow: the file has no information on the point, so it can be listed as
      an unmeasured factor and cannot be applied to Cardoza as a finding. An unmeasured factor
      that is named honestly is worth more than one applied confidently.
    rebuttals:
      - Setting an identification aside needs a finding about this witness, and none exists in the file.
      - Attitudes are a different subject; this effect turns up in people who hold none.
      - A witness who does not notice the difficulty is exactly the case the effect describes.
  - group: BRAIN
    title: What nineteen hours takes away — Review
    task: Weigh how vivid a memory feels against how accurate it is
    place: Physiology Bay
    scene: >
      Cardoza has said, in three separate places, that she remembers the night like a
      photograph. Raghunathan is asked what follows from that, and warns the room that the
      answer is the opposite of what it sounds like.
    assumes:
      - people can report how clear a memory feels to them
    takeaway: Vividness and accuracy are separately measurable, and studies that measure both find them barely related.
    format: CHOICE
    question: What does a memory feeling photographic tell you about its accuracy?
    choices:
      - Almost nothing, since the two have been measured separately and barely track
      - That the event was emotionally significant enough to be stored well
      - That the memory has been rehearsed often since the event
      - That the witness is reconstructing rather than remembering
    answer: Almost nothing, since the two have been measured separately and barely track
    why: >
      Flashbulb memories are the standard demonstration. People asked the morning after a
      shocking public event, and again years later, report enormous confidence in accounts that
      have measurably changed, and the confidence does not fall as the accuracy does. Vividness
      appears to track how much the event mattered and how often it has been retold, both of
      which rise with time. So a witness saying she can still see it is reporting something
      real about her experience and nothing usable about the night.
    rebuttals:
      - Significance does raise vividness, and it is the reason the two come apart rather than a reason to trust it.
      - Rehearsal raises vividness too, and rehearsal is exactly what does not improve accuracy.
      - Everybody retrieving a memory is reconstructing, so this cannot separate an accurate account from a wrong one.
  - group: MEMORY
    title: The order an account is taken in — Review
    task: Work out what asking the same question twice does
    place: Interview Suite B
    scene: >
      Okada counts the times Cardoza was asked about the chin between November and the trial.
      The answer is nine, by five different people, four of whom already knew what the answer
      was expected to be.
    assumes:
      - a question can be asked more than once about the same detail
    takeaway: Repeating a question implies the first answer was wrong, and the account moves toward whatever the asking suggests.
    format: CHOICE
    question: Why does asking about the same detail nine times damage the account?
    choices:
      - Repetition signals that the earlier answer was not the one wanted
      - Each retelling wears the memory down until nothing specific is left
      - Witnesses become irritated and stop cooperating with the interviewer
      - The later answers are recorded less carefully than the first
    answer: Repetition signals that the earlier answer was not the one wanted
    why: >
      A question asked again carries information: somebody was not satisfied. Adults shift under
      that pressure. A child witness shifts far more, and suggestibility rises with each repeated
      question, which is why guidance on interviewing children is largely a set of rules about not
      asking twice. The account does not decay so
      much as drift toward whatever the repeated asking implies, and every version after the
      first is a version produced under that pressure. It is also why the count of how often a
      question was put belongs in a review, and why nobody had counted it here.
    rebuttals:
      - Retelling does degrade an account, and the direction of the drift is what the repetition itself supplies.
      - Irritation is real and does not explain why the answers move in a particular direction.
      - The later answers were recorded carefully, which is how the drift is visible at all.


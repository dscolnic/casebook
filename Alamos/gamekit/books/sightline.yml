      status: high
      note: no hesitation on the point
    choices:
    - label: She is lying about the scar
      mechanism: The detail was added deliberately to strengthen the identification.
    - label: The detail arrived from the photograph
      mechanism: Information met after the event is stored as part of it, and its source is lost first.
    - label: She saw it and forgot to mention it
      mechanism: A detail can be encoded and left out of an early account.
    - label: The interviewer suggested it in November
      mechanism: The word came from the question rather than the witness.
    answer: The detail arrived from the photograph
    rebuttals:
    - Lying predicts hesitation and inconsistency, and there is none — she is certain, which fits an honest source error
      better.
    - A forgotten detail can reappear, and it would not so often be the detail that ran in a photograph the next 
      evening.
    - The November transcript contains no mention of a scar by anybody, so the suggestion has no route in.
  - group: MEASURE
    task: Close the chronology from the robbery to the later certainty statement and find the interval the simplified 
      file leaves out.
    title: Close the forty-two days
    reason: >-
      Achterberg has independent records for four dates and one interval nobody has yet accounted for
    concept: "Storage and forgetting: the curve is steep at the start"
    place: Records Store
    scene: "Tomas Weill lays four dates along the identification corridor: 14 November, 18 November, 19 November and 26 December.
      The spans almost close. Nell Achterberg has independent records for each date and one missing interval to account for."
    guide: >-
      Reading a record costs nothing, so read them all. Then count only the intervals that belong in the same ledger — the
      forty-two days between the first date and the last. One interval is missing, and finding where it goes is the point:
      the answer changes which sources the witness could have been exposed to before her certainty statement.
    background:
    - >-
      Why the days have to close. Four dates and the spans between them should account for the whole period. If they do not,
      some days are unaccounted for, and unaccounted days are days when something could have happened that nobody has recorded.
    - >-
      What an interval means here. Not idle time. Time during which a witness may have seen a photograph in a newspaper, spoken
      to another witness, or been told that somebody had been charged. Each of those changes what a later identification is
      evidence of.
    - >-
      Why independent records matter. Achterberg's records were made for other purposes — custody, duty rosters, correspondence
      — so they were not written to support anybody's account. That is what makes them able to close a gap the case file cannot.
    takesAsRead:
    - "Encoding: memory is built at the moment, from what was attended to"
    assumes:
    - a document's date can be checked against the record of when it was received
    takeaway: Chronology is only as complete as the intervals it preserves, especially when a missing interval contains 
      a new source of information.
    format: BALANCE
    question: Forgetting is steepest in the first days, so the delay before each document matters. Where do all
      forty-two days go, and which missing interval changes what sources were available to the witness?
    balance:
      total:
        amount: 42
        unit: days
        label: 14 November robbery to 26 December certainty statement
      streams:
      - id: robbery_interview
        label: Robbery to first full interview
        value: 4
        display: 14 → 18 November
      - id: interview_photo
        label: First full interview to newspaper photograph
        value: 1
        display: 18 → 19 November
        hidden: true
        note: The Register publishes Ward's photograph in this interval.
      - id: photo_array
        label: Newspaper photograph to array
        value: 15
        display: 19 November → 4 December
      - id: array_certainty
        label: Array to later certainty statement
        value: 22
        display: 4 → 26 December
      tolerance: 0.1
      hint: Close the days first. The missing term is an interval, not a document. Only after the total reaches 
        forty-two should you ask what entered during that interval.
    answerText: The forty-two days close as 4 + 1 + 15 + 22. The hidden one-day interval is 18 to 19 November, between 
      the first full interview and publication of Ward's photograph.
    why: Chronology is evidence only when its intervals are independently anchored. The robbery is 14 November. The full
      interview is four days later, the photograph one day after that, and the array fifteen days later. The later 
      certainty statement follows after another twenty-two days. Those intervals close to forty-two days. Leaving out 
      the one-day newspaper interval creates a gap exactly where new face information entered. Dating does not prove 
      causation, but it defines which sources were available before each account.
  - group: BRAIN
    task: Rule the biology in or out for a change five weeks later
    title: What the hormones cannot explain
    reason: >-
      Raghunathan has been asked whether fear could have delayed a detail by five weeks, and she has the time course
    place: Physiology Bay
    scene: |-
      Raghunathan is asked whether the stress of the robbery could have delayed the scar into the account. She draws the time course of the alarm response on the board: seconds, minutes, and hours.
    guide: >-
      Four options, and the question is a window in time. Ask of each when the mechanism it names is actually acting. The
      alarm response works during the event and the hours after it. Five weeks is long outside that. Stress still explains
      uneven encoding across the scene, which is a different claim about a different part of the file.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
      — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
      belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
      a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here,
      before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the
      signal taken out of them deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
      fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made
      for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
    assumes:
    - the stress response has a time course that can be measured
    takeaway: Every mechanism has a window it operates in, and a cause has to reach the moment it is being blamed for.
    format: CHOICE
    question: Why can the stress response not explain a detail that first appears five weeks after the event?
    why: Stress biology acts during the event and the hours that follow. The amygdala responds rapidly, and cortisol 
      changes over minutes. Those systems can affect attention, encoding and consolidation. They cannot insert a new 
      facial feature five weeks later. The relevant biological window has long closed by then. Stress still matters 
      elsewhere in this case because it can explain uneven encoding across the scene. It does not explain a detail that 
      first appears after later information has entered the record.
    choices:
    - It acts during encoding and the hours of consolidation that follow
    - Stress hormones are cleared within minutes, so later memory is unaffected
    - Stress changes emotional content only, leaving neutral facial detail untouched
    - A second stress response in December could rewrite what was encoded in November
    answer: It acts during encoding and the hours of consolidation that follow
    rebuttals:
    - Cortisol persists longer than minutes, but the relevant window is still hours rather than five weeks.
    - Arousal affects attention across the scene; it is not limited to content that feels emotional later.
    - A December stress response acts on December processing. It cannot insert a feature into November encoding.
  # ---------------------------------------------------------------- day 7
- title: Two witnesses, one source
  objective: Find out whether the agreement between the accounts is worth anything.
  briefing: The shop assistant's statement matches Cardoza's in four particulars.
  stake: >-
    Tuesday. The strongest looking page in the file is the one that lines the two witnesses up. Deniz Aktaş was behind the
    counter that night. His December statement agrees with Cardoza's on the jacket, the build, the way the man ran and the
    mark on his chin. Marcus Ilori has been saying for a week that agreement is the easiest thing in the world to make. Today
    you open each account and find out what it was built from. Then you work out what Aktaş could actually see through his
    own window. Elias Ward was convicted on two accounts. The two accounts had met.
  takeaway: Two accounts that share a source are one account, and the file counts them as two.
  stops:
  - group: SOCIAL
    task: Find the source the agreeing accounts have in common
    title: Agreement is not independence
    reason: >-
      Two accounts agree on four particulars, and the report is about to call that corroboration
    place: Deliberation Room
    scene: Five items in the file point the same way. Grace Ntuli has them on the board with their derivations closed. 
      Ines Baptiste asks why the unit is spending a morning on the part of the case nobody disputes.
    guide: >-
      Open each of the five items to see what it was derived from. Keep the ones that stand on their own, untick the ones
      whose chain runs through a shared source, and then name that source. Four items pointing the same way is not four pieces
      of evidence if all four came from one.
    background:
    - >-
      Why the undisputed part is worth a morning. A case that everybody agrees about is a case nobody has audited. The four
      items agree because they are derived from one another, and the agreement is what made them look unassailable.
    - >-
      How dependence hides. A statement quoted in a summary, then cited by a report, then relied on in a later interview,
      appears three times in the file and is one observation. Closing the derivations is the only way to see it.
    - >-
      What survives, and why it matters. Anything that came from a separate observation still stands after the shared source
      is removed. The case does not disappear; it becomes accurately sized, which is the difference between a review and a
      demolition.
    assumes:
    - two pieces of evidence built on the same source can only ever agree
    takeaway: Shared sources reduce independence; agreement can remain informative without counting as multiple 
      independent confirmations.
    format: TRACE
    question: Four of these five point at Ward. Open them, keep whatever still stands on its own, and name the source 
      they have in common.
    trace:
      hint: Open an item to see what it was built from. Tick the ones whose evidence would survive if a shared source 
        were removed, then name the source.
      channels:
      - id: cardoza
        label: Cardoza December statement
        reading: names Ward; mentions a mark on the chin
        depends:
        - paper
        - remark
      - id: aktas
        label: Aktaş December statement
        reading: agrees on jacket, build and the mark
        depends:
        - paper
        - talk
      - id: caller
        label: Anonymous telephone call
        reading: names Ward as the man in the doorway
        depends:
        - paper
      - id: till
        label: Till roll
        reading: last sale rung at 21:41
        depends: []
      - id: depot
        label: Bus depot camera 300 m north
        reading: a figure northbound at 21:44
        depends: []
      resources:
      - id: paper
        label: The Hallam Register of 19 November, which ran one photograph
      - id: remark
        label: Whatever was said to Cardoza after she chose
      - id: talk
        label: The twenty minutes the two witnesses waited together
      independent:
      - till
      - depot
      target: paper
      commit: Name the shared source
    answerText: The Hallam Register photograph is a shared source for three Ward-pointing details. Their agreement 
      therefore cannot be counted as three independent confirmations. The till roll and depot camera remain independent 
      because neither depended on that photograph.
    why: Agreement becomes stronger evidence when the sources could have failed differently. Three items here pass 
      through the same newspaper photograph, so their later agreement is partly dependent on a common source. That does 
      not make the details worthless; it means they cannot be multiplied as independent corroboration. The till roll and
      depot camera are different because neither depends on the photograph or on a witness identifying Ward, so they 
      retain separate evidentiary weight.
  - group: MEMORY
    task: Work out what twenty minutes of waiting cost
    title: Twenty minutes on the kerb
    reason: >-
      The two witnesses stood together on the kerb for twenty minutes before anybody took a statement
    concept: "Co-witness contamination: two accounts that have met are one account"
    place: Interview Suite B
    scene: |-
      The first officers arrived at 21:58. Between the robbery and their arrival, Cardoza and Aktaş stood together outside the shop. Okada asks what the file can now say about the four particulars they agree on.
    guide: >-
      Six statements in the file, and five sources they could rest on. Name the source the two accounts share, then keep only
      the statements that do not come through it. Two witnesses agreeing is two pieces of evidence only if they could have
      disagreed — and for twenty minutes on the kerb they could not.
    background:
    - >-
      Why agreement is not independence. Once two people have discussed what happened, each account contains the other. The
      agreement is then a fact about the conversation rather than about the robbery, and it feels like corroboration to everybody
      involved, including the witnesses.
    - >-
      Why it cannot be unpicked afterwards. What one witness heard from the other is encoded the same way as what she saw
      herself, with no tag saying which is which. Asking her to separate them asks for something the memory system does not
      store, which is why the only remedy is separating witnesses before they talk.
    - >-
      What survives. Anything each of them recorded before the twenty minutes — the triple-nine call, a text message with
      a timestamp — and anything only one of them could have known. Those are genuinely two sources, and they are what the
      file can still add together.
    assumes:
    - people compare accounts when something has just happened to both of them
    takeaway: Once witnesses exchange details, later agreement on those details is no longer independent corroboration; 
      records made before they spoke still are.
    format: TRACE
    question: Which statements in the file are still independent of the twenty minutes on the kerb?
    answerText: Cardoza’s emergency call and Aktaş’s timestamped text were recorded before the two witnesses spoke. 
      Details discussed during the twenty minutes on the kerb can no longer be treated as two independent confirmations 
      merely because they later appear in both accounts.
    why: "Two accounts are strongest as corroboration when they could have come out differently. Cardoza and Aktaş spoke together
      for roughly twenty minutes before their later formal statements, so details they discussed acquired a shared pathway.
      That is co-witness contamination: later agreement on those details is not clean evidence of two independent memories.
      It does not prove the details are false. The pre-conversation emergency call and timestamped text remain especially
      valuable because each was recorded before the witnesses could influence one another."
    trace:
      resources:
      - id: kerb
        label: The twenty minutes on the kerb, 21:38 to 21:58
      - id: call
        label: Cardoza's 999 call at 21:41
      - id: text
        label: Aktaş's text to his brother at 21:44
      - id: officer
        label: The first officer's notebook
      - id: cctv
        label: The bus-stop camera across the road
      channels:
      - id: height
        label: Both describe the man as about six feet
        reading: 'Cardoza: "about six foot"; Aktaş: "six foot, maybe a bit more"'
        depends: [kerb, officer]
      - id: jacket
        label: Both describe a dark hooded jacket
        reading: 'agreed wording in both first accounts'
        depends: [kerb, officer]
      - id: direction
        label: Both say he went left toward Ferrier Street
        reading: 'agreed in both accounts, and in neither contemporaneous record'
        depends: [kerb, officer]
      - id: second
        label: Both mention a second man by the car
        reading: 'Cardoza volunteers him; Aktaş agrees when asked'
        depends: [kerb, officer]
      - id: callrec
        label: Cardoza's 999 call describes a man in dark clothing running
        reading: 'recorded 21:41, before the two spoke'
        depends: [call]
      - id: textrec
        label: Aktaş's text says the man was carrying something in his right hand
        reading: 'sent 21:44, before the two spoke'
        depends: [text]
      independent: [callrec, textrec]
      target: kerb
  - group: PERCEPT
    task: Work out what the man behind the counter could see
    title: Looking out of a lit room
    reason: >-
      The shop assistant's account is the other identification in the file, and he was standing in the light
    concept: Dark adaptation, and how long the eye takes to arrive
    place: Reconstruction Bay
    scene: |-
      Bekele has the bay set up from the shop side. The counter, the window, the interior lights at the level the shop record gives. Beyond the glass, the street at the illuminance the corner had.
    guide: >-
      Say what the counter position can resolve on the street after two minutes of looking out, then run the bay and read
      the result. The prediction is the part that matters: the eye behind the counter is set for the shop, not for the pavement,
      and how far along the adaptation curve two minutes gets is a number worth committing to before the answer appears.
    background:
    - >-
      What dark adaptation is. Cone vision adjusts within about a minute; rod vision takes twenty to thirty and gives no colour
      and poor acuity. An eye that has been in a lit shop is at the very start of that curve when it turns to a dark street,
      so the first minutes are the worst of both — cones short of light, rods not yet in.
    - >-
      Why the glass makes it worse. A lit interior reflects in the window, adding a veil of light that never came from outside.
      That veil raises the level the eye is adapting to and reduces the contrast of everything beyond it, which is why cupping
      hands to the glass is what people do without being told.
    - >-
      Why two minutes is the honest number. The witness statement puts the man at the counter for a couple of minutes before
      the shout, so the reconstruction has to model that eye, not a fully dark-adapted one. The difference is not subtle:
      a few minutes on the curve is a factor of several in threshold.
    assumes:
    - the eye adjusts to the general level of light it is in
    takeaway: An eye set for a lit room is the wrong eye for a dark street, and the glass makes it worse.
    format: VERIFY
    question: His eyes are set to the counter light, and dark adaptation has not begun. Predict what the counter
      position can resolve out on the street after two minutes, then run the bay and measure.
    answerText: About 0.9 metres of detail at the corner — enough to see that somebody is there and their direction, not
      enough to describe a face. Fully dark-adapted the same eye reaches about 0.25 m, and it takes twenty minutes to 
      get there.
    why: "Two visual systems with different clocks are what makes this answerable. Cones adapt over the first several minutes,
      while rod sensitivity continues improving for roughly twenty to thirty minutes. Dim scenes become increasingly rod-dominated,
      with poorer colour discrimination and coarser acuity. An eye that has spent the evening in a lit shop is at the beginning
      of that curve, so at two minutes it is short of both. Measured in the bay at the corner's illuminance, the counter position
      resolves detail of about 0.9 m — a person, a direction, a gait, and no face. After twenty minutes rod sensitivity is
      much greater, though spatial detail remains coarse; the reconstruction's fully adapted result is therefore a different
      viewing state, not a correction that can be applied automatically to the witness. The window adds the rest: the lit
      interior reflects in the glass and lays a veil over everything beyond it, raising the level the eye is adapting to and
      cutting the contrast of the street. That is why the reconstruction has to model the eye the witness actually had, and
      why predicting first is the discipline — a threshold looked up afterwards fits whatever the bay produced."
    verify:
      prediction:
        label: Smallest detail resolvable at the corner from the counter, after two minutes
        unit: m
        min: 0.1
        max: 2.0
        step: 0.05
      truth: 0.9
      passRatio: [0.6, 1.6]
      intervention:
        label: Run the bay at the shop's interior level with the street at the corner's illuminance
        note: the observer starts at the counter after two minutes in the lit interior, looking through the glass
        outcome: The bay reaches the set levels and the observer takes the reading from the counter mark.
      measurement:
        label: Read the resolved detail from the acuity chart at the corner distance
        note: chart at 8.4 m, the corner distance from the counter
        cost: 4
        costUnit: minutes of bay time
      unmeasuredMoral: A dark-adapted threshold from a textbook is the right number for the wrong eye, and reporting it 
        without running the bay hands the board a figure four times too optimistic.

  # ---------------------------------------------------------------- day 8
- title: Did the array point at Ward?
  objective: Test whether the six-photo array offered real alternatives and identify reforms supported by evidence 
    rather than by habit.
  briefing: Forty volunteers have read Cardoza's description and seen nothing else.
  stake: >-
    Wednesday. The mock witness run finished overnight. Forty volunteers read the description Cardoza gave on the night of
    the robbery. Then they saw the 2019 array of photographs and pointed at whoever fitted. Not one of them has ever seen
    the robbery. Marcus Ilori has the tally. He will not say the number out loud yet. First somebody has to work out what
    a fair number would be. Today you turn that tally into a size. Then you decide what would make the procedure a sound one.
    Last, you look at what a photograph asks an eye to do. Ward was picked out of six faces.
  takeaway: A lineup's real size is how many of its members a stranger could plausibly pick.
  stops:
  - group: IDENT
    task: Turn the mock-witness tally into the array's real size
    title: Six photographs, and how many alternatives
    reason: >-
      The six photographs from 2019 are on the table, and the description they were chosen against is in the file
    place: Identification Suite
    scene: Marcus Ilori spreads forty mock-witness tally marks across the identification bench. Twenty-six sit under one
      photograph. The volunteers had Cardoza's description and nothing else. He asks how many real alternatives the 
      six-photo array actually offered.
    guide: >-
      Five numbers, and three belong elsewhere: the photographs, the fillers, and the volunteers in the other bay. Ask of
      each whether this measure needs it. Protection comes from real alternatives rather than printed ones. Mock witnesses
      know only the description, so where they land is a measurement of the array rather than of the case.
    background:
    - >-
      Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here
      has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs, and
      whether the size of the answer looks right once they are in place.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label
      is how a unit mismatch, or a quantity belonging to a different part of the problem, is caught before it is placed —
      which is the habit this format exists to build.
    takesAsRead:
    - "How a lineup is built: fillers, and the ones nobody would pick"
    assumes:
    - a lineup member who nobody would pick from the description is not an alternative
    takeaway: Nominal size is how many faces are on the table; functional size is how many of them a stranger could land
      on.
    format: BALLPARK
    question: Estimate the functional size of the 2019 array.
    answerText: 40 ÷ 26 = 1.54 effective members. A nominal six-photo array offered only about one and a half real 
      alternatives to description-only mock witnesses.
    why: Lineup protection comes from real alternatives, not from the printed number of photographs. If all six fit the 
      description equally, guessing should spread across them. Mock witnesses test that because they know only the 
      description. Here twenty-six of forty choose Ward's photograph. Functional size is therefore 40 divided by 26, 
      about 1.54. The nominal array had six members. Its effective protection was closer to one and a half alternatives,
      making an innocent-suspect pick far easier than the form suggests.
    estimate:
      prompt: Forty mock witnesses read Cardoza's description and were shown the 2019 array. Twenty-six of them chose 
        Ward's photograph.
      question: Choose the number of mock witnesses and the number who landed on the suspect.
      labels:
      - 40  (mock witnesses asked)
      - 26  (of them chose the suspect)
      - 6  (photographs in the array)
      - 5  (fillers in the array)
      - 12  (volunteers in the reconstruction bay)
      values: [40, 26, 6, 5, 12]
      slots: 2
      template: "{0} ÷ {1}"
      formula: a/b
      correct: [0, 1]
      target: 1.54
      tolerance: 0.25
      units: effective members
      relationship: Functional size FS = m / k, with m the mock witnesses asked and k how many of them chose the 
        suspect.
      solution: 40 ÷ 26 ≈ 1.5 effective members.
      explanation: About 1.54 effective members. Six photographs were printed, but the mock-witness choices behaved as 
        though only about one and a half were real alternatives. The nominal size and filler count are useful 
        distractors because functional size is designed to test whether those printed numbers overstate the protection.
      givens:
      - 40 mock witnesses were shown the array
      - 26 of them chose the suspect from the description alone
  - group: MEASURE
    task: Bring the procedure inside the fair band
    title: Moving the middle is not narrowing the spread
    reason: >-
      The report has to recommend a procedure rather than only criticise one, and that goes in tonight
    place: Data Room
    scene: |-
      Weill has the mock-witness result as a distribution against the band a fair six-member array would sit in. Four changes are available to the unit's recommendation and each of them costs days of drafting.
    guide: >-
      The cloud is what this procedure produces across administrations; the band is where a fair six-member array would land.
      Four changes are available and each costs days of drafting. They act differently — some move the cloud, some tighten
      it — so watch the middle and the spread separately. Apply what you would recommend, then say when the procedure is defensible.
    background:
    - >-
      What the two shapes are. The band is a standard: run a fair array many times and this is the share of mock witnesses
      who land on the suspect. The cloud is this unit's own procedure measured the same way. A procedure whose cloud sits
      outside the band is producing identifications a fair array would not.
    - >-
      Moving and tightening are different fixes. Matching fillers to the description or adding a may-not-be-present caution
      changes how strongly the array points toward the suspect. Blind administration and a standard script remove avoidable
      administrator and site variation. This authored cloud is a teaching model of those different failure modes; it does
      not assign a universal effect to simultaneous or sequential presentation.
    - >-
      Why 'defensible' is the word. This becomes a recommendation other units follow, and it will be read out in court. That
      makes the claim a claim about every administration rather than about the average one, which is why the criterion is
      written on the whole cloud.
    assumes:
    - with equally plausible members and conditional on a mock witness making a choice, a fair six-member array sends 
      about one choice in six to the suspect
    - a recommendation can propose changes to a procedure as well as criticise it
    takeaway: Improve the parts of a lineup with well-supported failure modes—fillers, instructions, blinding and 
      documentation—without claiming one presentation format always wins.
    format: CLOUD
    question: A lineup built out of six photographs is fair when about one choice in six goes to the suspect. Place
      the bars to report the mean and its one-sigma uncertainty, then bring the recommended procedure inside the fair
      band and say when it is defensible.
    cloud:
      hint: The band is where a fair six-member array lands. The cloud is what this procedure produces across 
        administrators and sites, not what it produces on a good day.
      bounds:
        min: 10
        max: 24
        unit: "%"
        label: Share of mock witnesses landing on the suspect
      centre: 42
      spread: 13
      pass: 0.85
      seed: 23
      costUnit: d
      actions:
      - id: fillers
        label: Rebuild the array with fillers matched to the description
        effect: shift
        amount: 15
        cost: 3
      - id: caution
        label: Add the may-not-be-present caution
        effect: shift
        amount: 8
        cost: 1
      - id: blind
        label: Use an administrator who does not know which photograph is the suspect
        effect: narrow
        amount: 0.45
        cost: 4
      - id: script
        label: Standardise the wording and the lighting across every site
        effect: narrow
        amount: 0.6
        cost: 2
      commit: Call it defensible
    answerText: Use all four tested protections. Better fillers and a may-not-be-present caution move the average 
      suspect-pick rate toward the fair band; blind administration and a standard script reduce avoidable variation 
      between administrations.
    why: A fair procedure needs both a defensible average and a controlled way of producing it. Better fillers and a 
      may-not-be-present instruction address how strongly the array points toward the suspect. Blind administration 
      removes a pathway for expectancy, and a standard script reduces site-to-site variation. This authored simulation 
      shows the four protections working together. It does not establish that any one presentation format is universally
      superior.
  - group: PERCEPT
    task: Work out what a photograph asks the eye to do
    title: A face on paper
    reason: >-
      Every one of the six is a single frozen view, which is not what face recognition normally runs on
    place: Reconstruction Bay
    scene: |-
      Frey has the array photographs and a live volunteer at the same distance under the same lamp. She asks the room which of the two tasks is closer to what Cardoza was doing on 14 November.
    guide: >-
      Four things a photograph array removes. Ask of each whether real recognition depends on it. A remembered face was never
      a still image. Head turns, expression and gait all add information across time, and a print freezes one angle under
      one light. That also makes the photographs uneven in a way no filler rule controls.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
      — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
      belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
      a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here,
      before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the
      signal taken out of them deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
      fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made
      for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
    assumes:
    - a face is recognised from more than a single frozen view of it
    takeaway: A stand-in for a task is easier or harder than the task itself, and the difference is whatever it leaves 
      out.
    format: CHOICE
    question: What does a lineup built out of six photographs remove from the recognition task?
    why: Real face recognition draws on changing views. Head turns, expression, gait and feature motion all add 
      information across time. A lineup photograph freezes one angle under one lighting condition. The witness must 
      compare that single view with a memory that was never a still image. That makes the task harder and can make 
      photographs uneven. One person's chosen image may resemble the remembered view more by chance than another 
      person's, even when both are equally plausible fillers.
    choices:
    - Movement and all but one view of the face
    - Colour, which is the main cue used first in face recognition
    - Scale, because a smaller printed face is harder to recognise
    - Context, because the street itself supplies the identity cue
    answer: Movement and all but one view of the face
    rebuttals:
    - Colour can help, but motion and changing viewpoints are the larger information loss between a live face and one 
      photograph.
    - Visual recognition handles changes in apparent size routinely; printed scale is not the main loss.
    - Context is removed too, but that is not the face information a photograph freezes into one view.
  # ---------------------------------------------------------------- day 9
  - group: IDENT
    task: Sort the lineup photographs before the array is built.
    title: A filler, or a giveaway
    reason: >-
      Ilori wants the array rebuilt before the mock witnesses see it, so the fillers get looked at first
    concept: "How a lineup is built: fillers, and the ones nobody would pick"
    place: Identification Suite
    scene: The array has to be built from the photograph library before the witness arrives. A filler works if somebody 
      who never saw the offender could plausibly pick it. Anything else narrows the array without anybody noticing.
    guide: >-
      Two bins. A photograph works as a filler if it fits the witness's own description as well as the suspect does. It fails
      if it stands out — wrong description, different background, a mugshot board, or simply the only one of something. Sort
      on whether a stranger could plausibly pick it.
    background:
    - >-
      Why a bad filler is worse than a missing one. An array of six with three implausible fillers behaves like an array of
      three, so the chance of a false identification rises and nothing in the paperwork records that it did.
    - >-
      What makes a photograph stand out. Not being like the suspect — being unlike the others. A different background, a visible
      custody board, the only person with a beard when the description said clean-shaven, the only photograph in colour.
    assumes:
    - a lineup contains one suspect and people known not to be the offender
    takeaway: A filler that nobody would pick is not in the array, whatever the paperwork says.
    format: BELT
    question: Send each photograph to the bin that says whether it works as a filler.
    answerText: Anything a stranger could plausibly pick from the description works. Anything that stands out narrows 
      the array without appearing to.
    why: >-
      A lineup's protection comes from its effective size, not its nominal one. Six photographs where three could never be
      chosen is an array of three, and the chance that a guessing witness lands on the innocent suspect goes from one in six
      to one in three — with the form still saying six. What makes a filler fail is standing out from the others rather than
      differing from the suspect: a different background, a custody board visible at the bottom, the only one in colour, the
      only one photographed from slightly above. And the description is the test that matters. If the witness said clean-shaven
      and mid-thirties, then every filler has to be clean-shaven and mid-thirties, because a witness scanning for the description
      eliminates anybody outside it before making a choice at all. That elimination is invisible afterwards, which is why
      the array is scored when it is built rather than argued about later.
    belt:
      left: {name: Works as a filler}
      right: {name: Stands out}
      need: 20
      lives: 3
      pass: 0.8
      hint: Ask whether somebody who never saw the offender could plausibly pick it.
      items:
      - {name: Matches the description, bin: left}
      - {name: Same background, bin: left}
      - {name: Lit like the, bin: left}
      - {name: Similar age, bin: left}
      - {name: Similar build, bin: left}
      - {name: Clean-shaven as described, bin: left}
      - {name: Cropped alike, bin: left}
      - {name: Neutral expression, bin: left}
      - {name: Plain shirt, bin: left}
      - {name: Same resolution, bin: left}
      - {name: Similar hairline, bin: left}
      - {name: Ordinary studio shot, bin: left}
      - {name: Custody board visible, bin: right}
      - {name: Bearded not described, bin: right}
      - {name: Different background, bin: right}
      - {name: In colour, bin: right}
      - {name: Twenty years older, bin: right}
      - {name: Smiling broadly, bin: right}
      - {name: Prison clothing, bin: right}
      - {name: Blurred and grainy, bin: right}
      - {name: Shot from above, bin: right}
      - {name: Indoor shot, bin: right}
      - {name: Visibly injured, bin: right}
      - {name: Different crop, bin: right}
      - {name: In uniform, bin: right}
      - {name: Name band showing, bin: right}
      commit: Start the line
- title: Thirty-four metres
  objective: Settle the distance, and work out what it leaves of the identification.
  briefing: The number the case has trusted for seven years is wrong. The file says twenty-two metres; the independent 
    geometry says thirty-four.
  stake: >-
    Thursday of the second week. Two numbers are up on the same wall. Dawit Bekele has surveyed Ferrier Street. His survey
    puts the doorway thirty-four metres from the spot where Cardoza says she stood. The case summary says twenty-two, and
    has said so since 2020. Nothing on that street has moved since the robbery. So one of these numbers is a measurement.
    The other one is not. Today you find out which is which. Then you work out what the eye can pick out at the distance that
    survives. Last, you decide what the review is allowed to say about the moment she picked Ward out. Everything the file
    argues rests on this.
  takeaway: The most important number in a case can be wrong for seven years because nobody ever measured it.
  stops:
  - group: MEASURE
    task: Which explanation is consistent with all five items?
    title: Where the twenty-two came from
    place: Records Store
    scene: Bekele hooks the tape at Cardoza's repeated position and walks past the file's twenty-two-metre floor mark. 
      The tape keeps going to 34.2 m. Tomas Weill puts the unscaled sketch and the shop lease plan beside it.
    guide: >-
      Five items, and two of them are independent measurements that agree with each other. Ask of each candidate how many
      of the five it fits. The witness places herself in the same spot in three accounts. The lease plan matches the survey.
      The one figure with nothing repeatable behind it traces to a sketch marked not to scale.
    background:
    - >-
      Why the unremarkable readings decide it. The salient reading is what draws attention, and it is usually consistent with
      several explanations at once, which is why it rarely settles anything. The readings that discriminate are the ones a
      candidate predicts should have moved and which have not: a normal value is a positive result against every mechanism
      that would have disturbed it.
    - >-
      How to work the candidates. Take each mechanism and predict the panel it implies before you look at the panel again
      — which readings it drives, in which direction, and by roughly how much. Then compare. Working that way round is what
      separates a diagnosis from a rationalisation, because the prediction is made before the data is consulted.
    - >-
      Why only one candidate survives. Several will account for part of the panel, deliberately so, and a partial fit is exactly
      what a confident wrong answer feels like from the inside. When two remain, look for the reading on which their predictions
      differ and let it decide. If no reading separates them you have not finished reading the panel.
    assumes:
    - a measurement can be repeated and an estimate cannot
    takeaway: A number that entered a file without a measurement behind it never becomes a measurement by being 
      repeated.
    format: DIAGNOSIS
    why: The 22-metre figure is the only distance here without a repeatable measurement behind it. Bekele's survey gives
      34.2 m, and the lease plan independently matches that geometry within 0.2 m. Cardoza also places herself at the 
      same location across three accounts. The summary traces back to a sketch marked not to scale. Repetition then gave
      the estimate the appearance of a measured fact. Nothing has to be falsified for a number to acquire false 
      authority through copying.
    headline: The summary and the survey differ by twelve metres, and the street has not changed since 2019.
    readings:
    - zone: Case summary
      label: Distance to the doorway
      value: 22 m
      status: alarm
    - zone: Survey
      label: Kerb to doorway, measured
      value: 34.2 m
      status: alarm
    - zone: Officer sketch
      label: Scale
      value: marked not to scale
      status: high
      note: the only source the summary cites
    - zone: Lease plan
      label: Shop frontage
      value: agrees with the survey to 0.2 m
      status: normal
    - zone: Cardoza
      label: Where she was standing
      value: outside the launderette, unchanged in three accounts
      status: normal
    choices:
    - label: The witness has misremembered where she stood
      mechanism: The account of her position is wrong, and the summary is right.
    - label: The summary was read off a sketch with no scale
      mechanism: An estimate taken from a drawing became a figure and was then repeated.
    - label: The street has been rebuilt since 2019
      mechanism: The frontage or the kerb has moved.
    - label: The survey is in error
      mechanism: The measurement was taken from the wrong point.
    answer: The summary was read off a sketch with no scale
    rebuttals:
    - Her position is the most consistent item in the file and is confirmed by where the launderette stands.
    - A rebuild would show in the lease plan, which agrees with the survey to twenty centimetres.
    - A survey error would have to be twelve metres, and the frontage check rules that out independently.
  - group: PERCEPT
    task: Work out what an eye can resolve at the surveyed distance
    title: A centimetre of face
    place: Reconstruction Bay
    scene: |-
      Frey moves the mark to the surveyed distance and reads out the eye's resolution limit in good light. She wants to know what size of detail that limit corresponds to at the far end of the bay.
    guide: >-
      Five numbers, and three of them belong to other stops: the earlier distance, the eye gap, and a light level. Ask of
      each whether this limit needs it. An angular limit becomes a size only once a distance is supplied. And note the order
      of the argument: distance shrinks the detail before lighting is considered at all.
    background:
    - >-
      Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here
      has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs, and
      whether the size of the answer looks right once they are in place.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label
      is how a unit mismatch, or a quantity belonging to a different part of the problem, is caught before it is placed —
      which is the habit this format exists to build.
    assumes:
    - an eye in good light resolves details about one arc minute across
    - one arc minute is about 0.0003 radians
    takeaway: The resolution limit is an angle, so the size of the smallest visible detail grows with distance.
    format: BALLPARK
    question: Estimate the smallest detail an eye could resolve at the surveyed distance.
    answerText: 0.0003 × 34 = 0.0102 m, about one centimetre under good high-contrast conditions. Dimmer conditions 
      would make practical facial discrimination coarser; the historical light level is still unresolved today.
    why: An angular resolution limit becomes a physical size once distance is supplied. At 34 metres, 0.0003 radians 
      corresponds to about 0.0102 m, roughly one centimetre under good high-contrast conditions. Fine facial differences
      often live at that scale or below, and low illumination can make practical discrimination worse. The corrected 
      distance therefore reduces the available facial detail before the historical lighting question has even been 
      settled. The maintenance record still has to answer what light actually belonged in the reconstruction.
    estimate:
      prompt: The survey puts the doorway 34 m from where Cardoza stood. An eye in good light resolves about one arc 
        minute, which is 0.0003 radians.
      question: Choose the eye's resolution limit and the distance it is being applied over.
      labels:
      - 0.0003  (radians, one arc minute)
      - 34  (m, the surveyed distance)
      - 22  (m, the distance the summary recorded)
      - 0.063  (m, the gap between the eyes)
      - 12.5  (lux, the corner with the lamp working)
      values: [0.0003, 34, 22, 0.063, 12.5]
      slots: 2
      template: "{0} × {1}"
      formula: a*b
      correct: [0, 1]
      target: 0.0102
      tolerance: 0.0018
      units: m
      relationship: Resolution limit s_min = θ_min × d, with θ_min the eye's angular limit and d the distance to the 
        face.
      solution: 0.0003 × 34 ≈ 0.010 m, about a centimetre.
      explanation: About one centimetre under good high-contrast conditions. Dimmer viewing would worsen practical 
        facial discrimination, but the historical light level is not settled until the maintenance record arrives. The 
        twenty-two-metre summary figure would give a smaller value, which is why the distance correction matters.
      givens:
      - The surveyed distance is 34 m
      - An eye in good light resolves about 0.0003 radians
  - group: IDENT
    task: State what the corrected distance licenses the review to say
    title: What this does and does not settle
    concept: Retrieval is reconstruction, not playback
    place: Identification Suite
    scene: |-
      Baptiste wants the finding in the report by the end of the week. Ilori asks her to write the sentence first, because the sentence is where reviews are lost, and the room spends an hour on one line.
    guide: >-
      Six statements the draft could make, and three verifications. Each rests on something in the file rather than on something
      anybody has seen, so check the ones that would hurt most if the file were wrong. A statement can only be held once it
      has been verified — and two of these cannot be supported by any measurement of the corner, however carefully it was
      taken.
    background:
    - >-
      What a limit on perception establishes. The measured distance, light and reconstruction can show that reliable facial
      identification was substantially harder than the file implies. That is a claim about evidentiary weight and the conditions.
      It does not establish who was on Ferrier Street, and no measurement of light or distance can, because absence of sufficient
      information is not information about the answer.
    - >-
      Why the distinction decides the sentence. "The measured conditions make this identification much less reliable than
      the file treated it" is what the review has evidence for. "Ward was not there" is a different claim, resting on evidence
      nobody in this building has, and a report that slides from the first to the second loses everything the first one earned.
    - >-
      What retrieval adds. A recognition is reconstructed at the moment of asking rather than replayed, so confidence can
      coexist with poor viewing conditions and later influence. That is compatible with the mechanism; it does not by itself
      prove how this identification arose. Confidence is not a check on the conditions, and a witness's certainty is not evidence
      that the conditions were adequate.
    takesAsRead:
    - "Storage and forgetting: the curve is steep at the start"
    assumes:
    - a limit on what could be seen is not evidence about who was there
    takeaway: A measurement can show that an identification deserves less weight without showing who was actually there.
    format: ATTEST
    question: An identification is a retrieval: the account is rebuilt each time, not played back. Which statements
      in the draft cannot be held, given what the review's evidence actually supports?
    answerText: Hold the 34.2-metre survey and the missing caution line. Hold the historical-lighting claim for another 
      record. Do not hold either sentence that says who was on Ferrier Street or that Cardoza must have been mistaken.
    why: "The review now has strong evidence for two kinds of claim: geometry and procedure. Bekele’s survey gives 34.2 metres
      and the independent lease plan agrees; the 2019 array form lacks a may-not-be-present caution. The historical lighting
      is not yet settled, because a correct lamp calculation is not evidence that the lamp was on. And none of those findings
      identifies the person at the doorway. The review can say that the case file overstated the strength of the identification
      without saying that Ward was absent or that Cardoza was dishonest or mistaken."
    attest:
      checks: 3
      moral: Every measurement here is a fact about the corner. A fact about the corner is not a fact about who walked 
        around it.
      claims:
      - id: lux
        label: Street lighting was normal at the time of the offence
        signedBy: Scene report
        evidence: The word “normal”; no night reading or maintenance record has yet been tied to the robbery date
        critical: true
        backed: false
      - id: distance
        label: The doorway was 34.2 metres from Cardoza’s stated position
        signedBy: Bekele survey and lease plan
        evidence: Independent survey geometry agrees with the fixed lease plan within 0.2 m
        critical: true
        backed: true
      - id: form
        label: The 2019 array form carried no may-not-be-present caution
        signedBy: Ilori, from the original form
        evidence: The form itself and adjacent 2019 forms
        critical: false
        backed: true
      - id: notthere
        label: Ward was not the man on Ferrier Street
        signedBy: the draft's third paragraph
        evidence: Rests on the perceptual limit, which says nothing about who was present
        critical: true
        backed: false
      - id: mistaken
        label: The witness was mistaken about what she saw
        signedBy: the draft's fourth paragraph
        evidence: No measurement of the corner reaches what she saw, only what could be resolved from where she was
        critical: true
        backed: false
      - id: confidence
        label: The file contains a later statement of absolute certainty
        signedBy: 26 December witness statement
        evidence: A dated signed statement; what it means about initial confidence is a separate question
        critical: false
        backed: true

  # ---------------------------------------------------------------- day 10
- title: What did the administrator change?
  objective: Establish what the administrator's knowledge did, by removing it.
  briefing: Loomis knew which photograph was the suspect, because in 2019 the administrator always did.
  stake: >-
    Friday. Karen Loomis, the retired detective, has come in for the second time. She ran the photo array in 2019. She knew
    which of the six photographs was Ward. She remembers saying something to Cardoza afterwards. She does not remember what
    it was. Four things about that afternoon could have mattered. The file cannot pull them apart. Today you take them apart
    one at a time, in the unit's own rig. Then you work out how a belief travels from an officer to a witness with neither
    of them noticing. Last, you read what praise does to an account. Ilori trained the officers who replaced Loomis.
  takeaway: Four things wrong at once is not four findings; it is one until somebody changes them one at a time.
  stops:
  - group: IDENT
    task: Isolate which feature of the 2019 procedure inflates certainty
    title: Change one thing
    reason: >-
      Four features of the 2019 procedure could be inflating certainty, and the volunteer rig can test one at a time
    place: Identification Suite
    scene: The unit's rig runs twenty volunteer administrations at a time. Four features of the 2019 procedure can be 
      switched independently. The readout is reported certainty after a choice, and the room has to isolate which 
      feature moves it.
    guide: >-
      The number you are watching is the certainty volunteers report after they have chosen. Four features of the 2019 procedure
      can be switched independently, and twenty administrations run in a block. A response counts only if it is larger than
      the block-to-block scatter. Switch one feature, run a block, switch it back, and name the feature certainty follows.
    background:
    - >-
      Why certainty is worth measuring at all. It is what a courtroom hears: a witness who says they are sure is believed
      more than one who hesitates. If a feature of the procedure can move certainty without changing whether the choice was
      right, then the procedure is manufacturing confidence, and the court has no way to tell that from the inside.
    - >-
      What the four features are. Whether the administrator knows which photograph is the suspect, whether the six are shown
      together or one at a time, whether the witness is told the man may be absent, and where the block is run. Each is a
      real difference between police procedures in use, and each is defensible until it is tested.
    - >-
      Why one at a time, and why put it back. Four features switched together give one number and no attribution. Switching
      back guards against the other explanation: volunteers who arrived later in the day, or a room that got noisier, drifting
      the number while you worked.
    assumes:
    - a feature can only be shown to matter by changing it and changing it back
    takeaway: A controlled experiment can establish a mechanism; a historical file still has to show whether and how 
      strongly that mechanism reached the case.
    format: CONTROL
    question: Four features, one effect on certainty. Change one thing at a time, hold the rest constant, and prove
      which of them is producing it.
    control:
      hint: Switch what you like and run the block. What you change is a decision; what it tells you depends on how many
        things moved at once.
      observable:
        label: Volunteers reporting high certainty after choosing
        unit: "%"
      held:
      - the array
      - the description
      - the witness pool
      - the script
      variables:
      - id: knew
        label: Administrator knows which photograph is the suspect
      - id: simul
        label: All six shown together
      - id: nocaution
        label: Caution that the man may be absent omitted
      - id: room
        label: Run in the interview room rather than the suite
      truth: knew
      baseline: 68
      response: -31
      noise: 4
      changeVerb: removed
      run: Run twenty administrations
      commit: Name it
    answerText: Administrator knowledge is the causal feature in this authored volunteer rig. Removing it lowers 
      reported certainty and restoring it restores the effect. That establishes a mechanism under controlled conditions;
      it does not prove how much Loomis changed Cardoza’s 2019 certainty.
    why: 'Several features changed together in the original procedure, so the case file alone cannot identify a cause. A controlled
      volunteer test changes one variable while holding the others fixed, and a reversal checks whether the response follows
      that variable in both directions. In this authored rig, administrator knowledge moves the outcome. The case-level conclusion
      is deliberately narrower: because Loomis knew the suspect, a known pathway for expectancy was open. The experiment cannot
      measure how strongly that pathway affected Cardoza in 2019.'
  - group: SOCIAL
    task: Work out how a belief reaches a witness without being stated
    title: Nobody said anything
    reason: >-
      Loomis did not point or prompt, and Ntuli has a recording where that is also true and the effect shows anyway
    concept: Double-blind administration, and expectancy
    place: Deliberation Room
    scene: |-
      Loomis is clear that she did not point, prompt or name anybody. Ntuli believes her and plays a recording of a volunteer administration where the same thing is true and the effect is visible anyway.
    guide: >-
      Four things differ between the administrations where the witness picked the suspect and the ones where she did not.
      Change one and run the volunteer session again; the readout is how often the suspect is chosen. Changing several at
      once tells you nothing about any of them, and putting your suspect back is what separates a cause from a coincidence.
    background:
    - >-
      What expectancy is made of. Not prompting or pointing, which nobody here did. It is carried in latency — the half-second
      before "take your time" — in which photographs get a second look, in the pitch of an acknowledgement, and in what happens
      after a choice rather than before it.
    - >-
      Why an honest administrator transmits it. The cues are not chosen and mostly not noticed, by either party. An administrator
      who knows which photograph is the suspect produces them; one who does not cannot, whatever their intentions. That asymmetry
      is the whole argument for double-blind administration.
    - >-
      Why the remedy is structural. You cannot train somebody out of a behaviour they are not performing deliberately, and
      you cannot audit it from a transcript, because the transcript records words. Removing the knowledge removes the mechanism,
      which is why the rule is about who runs the array rather than about how they run it.
    assumes:
    - people take up small cues from somebody running a procedure they are taking part in
    takeaway: Blind administration closes an expectancy pathway; a historical review should not turn a laboratory effect
      into an unmeasured case-specific number.
    format: CONTROL
    question: Expectancy travels from whoever runs a procedure to whoever takes part in it, without anybody saying a
      word. Which difference between the sessions is actually moving how often the suspect is picked?
    answerText: In this authored volunteer rig, whether the administrator knows the suspect moves the suspect-pick rate.
      Blind administration removes that pathway. The run demonstrates the risk mechanism, not the size of Loomis’s 
      effect on Cardoza.
    why: "The volunteer sessions isolate administrator knowledge while holding the photographs, witness pool, recording and
      time of day fixed. In this authored rig the suspect-pick rate follows that knowledge when it is removed and restored,
      supporting a causal effect in the experiment. That is why blind administration is a robust procedural protection. The
      2019 record cannot tell the unit how much expectancy, if any, changed Cardoza’s particular choice, so the report should
      describe an avoidable pathway rather than invent a case-specific effect size."
    control:
      observable:
        label: Rate at which the volunteer picks the suspect
        unit: per cent of sessions
      variables:
      - id: knows
        label: Whether the administrator knows which photograph is the suspect
      - id: script
        label: Which wording of the instruction script is read
      - id: room
        label: Which room the administration is held in
      - id: order
        label: The order the six photographs are laid out in
      held:
      - the volunteer pool and their briefing
      - the photographs themselves
      - the recording setup
      - the time of day
      truth: knows
      baseline: 62
      response: -31
      noise: 5
      hint: The volunteer sessions can be re-run on demand. Set what you want changed, run it, and watch the rate.
      run: Run a volunteer session
      commit: Name the difference that is doing it
  - group: MEMORY
    task: Find what confirmation changed besides the confidence
    title: What "that's our man" moves
    reason: >-
      Half the volunteers were told their choice matched the suspect, and what moved besides their confidence is on the screen
    place: Interview Suite A
    scene: Ren Okada puts the unit's replication on the confidence screen. Half the volunteers are told their choice 

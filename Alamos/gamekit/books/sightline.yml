      Those sound like evidence about encoding and are partly reconstructed after the choice.
    background:
    - >-
      Why the wrong options are the interesting ones. Each distractor is written to be the answer under one specific misreading
      — a step skipped, a quantity confused with a rate, a correlation taken for a cause. Identifying which misreading each
      belongs to is where the learning is; the right answer alone can be reached on instinct and teach nothing.
    - >-
      Why the shape of an option tells you nothing. A correct answer collects the qualifying clause and the unit. So across
      a whole game the key used to be the longest option far more often than chance — 88 per cent of passage quizzes here,
      before it was fixed. It is now checked per game as a binomial tail, so length, hedging and specificity have had the
      signal taken out of them deliberately.
    - >-
      What the verdict adds. Every wrong option carries its own rebuttal, and the verdict prints them — the reason that option
      fails, not a restatement of the right one. They are worth reading after a correct answer as well: a right choice made
      for an approximate reason is indistinguishable from a sound one until the day the approximation is what is being tested.
    assumes:
    - a witness reports the conditions of an event from memory, like everything else
    takeaway: What somebody says about the circumstances of an event is itself remembered, so it can move long after the
      event has finished.
    format: CHOICE
    question: Besides certainty, what does confirming feedback change in a witness's later account?
    why: Post-identification feedback changes more than stated certainty. After being told their choice matches the 
      suspect, witnesses often report a clearer view and longer attention at the event. They can also remember a better 
      position for seeing. Those claims concern the original night but are reconstructed after feedback. That matters in
      court because 'I had a clear look' sounds like direct evidence about encoding. It may instead partly reflect 
      information learned after the identification was already made.
    choices:
    - Her later report of viewing quality and duration
    - Her willingness to attend court and repeat the identification
    - How quickly she made the original choice from the array
    - How much clothing detail she can report from the event
    answer: Her later report of viewing quality and duration
    rebuttals:
    - Feedback can affect willingness to testify, but that is not a reconstructed claim about the original viewing 
      conditions.
    - The original response time is already fixed on the array record and cannot be changed by later feedback.
    - Clothing memory can change, but the replicated feedback effect here concerns retrospective reports of viewing 
      quality and attention.
  # ---------------------------------------------------------------- day 11
- title: The streetlamp was out
  objective: Date the certainty, and separate telling faces apart from being willing to choose.
  briefing: "The distance was worse than the file said. Today the second load-bearing claim breaks: the streetlamp was out
    on the night of the robbery."
  stake: >-
    Monday of the third week. It is the quietest day the review has had. Nothing has gone wrong. Three things have been confirmed.
    The custody record settles the date of the certainty statement. The mock witness rates are in from both procedures. And
    the power company has answered Yara Solomon's letter about column 4471. Tomas Weill wants the two procedures compared
    properly. Not by which one produced more picks. Today you separate seeing from choosing. Then you settle when Cardoza's
    certainty was written down. Last, you read what the power company says about that lamp. One of those three findings changes
    the case.
  takeaway: A quiet day in a review is three confirmations, and one of them usually changes the case.
  stops:
  - group: MEASURE
    task: Compare the two procedures on how well witnesses told the faces apart
    title: Seeing, and being willing to say so
    reason: >-
      The outage is confirmed, so the question is now what a witness says when she can see less
    place: Data Room
    scene: |-
      Weill has two procedure conditions on the board. The 2019-style condition produced more identifications than a reformed blind condition, and Baptiste asks whether “more identifications” means “better identification.”
    guide: >-
      Five numbers, and two of them are the raw rates rather than their standard scores. Ask of each what the measure is built
      from. A procedure can produce more identifications simply by making people readier to choose, which lifts hits and false
      alarms together. So more choices is not automatically better performance.
    background:
    - >-
      Why an estimate rather than a calculation. Every quantity on this board is already measured or stated, so nothing here
      has to be derived. What is being tested is whether you can pick the quantities the relationship actually needs, and
      whether the size of the answer looks right once they are in place.
    - >-
      Why the tiles carry labels. A bare number cannot be checked against the relationship it is going into. Reading the label
      is how a unit mismatch, or a quantity belonging to a different part of the problem, is caught before it is placed —
      which is the habit this format exists to build.
    assumes:
    - a procedure can be run with the offender present and with the offender absent
    - a proportion can be converted to a standard score from a table
    takeaway: A procedure that produces more identifications may only be producing more of both kinds.
    format: BALLPARK
    question: Estimate the sensitivity of the 2019-style procedure.
    answerText: d′ = 0.52 − (−0.52) = 1.04. The procedure creates many choices, but its ability to separate 
      offender-present from offender-absent arrays is only modest.
    why: A procedure can produce many identifications simply by making witnesses more willing to choose. That raises 
      hits and false alarms together. Sensitivity separates this response tendency from actual discrimination. 
      Converting both rates to standard scores gives a common scale. Here 0.52 minus negative 0.52 gives d-prime = 1.04.
      The raw rate difference of 0.40 is not comparable in the same way. More choices are not automatically better 
      performance when the extra choices include more false alarms.
    estimate:
      prompt: In the 2019-style procedure the volunteers picked the offender 70 per cent of the time when he was 
        present, and picked somebody 30 per cent of the time when he was not. The table gives z = 0.52 for 0.70 and z = 
        −0.52 for 0.30.
      question: Choose the two standard scores.
      labels:
      - 0.52  (z for a hit rate of 0.70)
      - "-0.52  (z for a false-alarm rate of 0.30)"
      - 0.70  (the hit rate itself, as a proportion)
      - 0.30  (the false-alarm rate itself, as a proportion)
      - 40  (volunteers in each condition)
      values: [0.52, -0.52, 0.7, 0.3, 40]
      slots: 2
      template: "{0} − {1}"
      formula: a-b
      correct: [0, 1]
      target: 1.04
      tolerance: 0.12
      units: standard units
      relationship: Sensitivity d′ = z(H) − z(FA), the hit rate and the false-alarm rate each converted to a standard 
        score and subtracted.
      solution: 0.52 − (−0.52) = 1.04 standard units.
      explanation: About 1.04 standard units of separation for the 2019-style condition. The reformed blind condition in
        the same authored rig reaches greater separation while producing fewer total choices. The lesson is about 
        sensitivity versus willingness to choose, not about declaring one presentation format universally superior.
      givens:
      - Hit rate 0.70, which is z = 0.52
      - False-alarm rate 0.30, which is z = −0.52
  - group: IDENT
    task: Spend two authentication credits on the records that determine what Cardoza's confidence can legitimately say 
      about the 4 December choice.
    title: Buy the confidence that still means something
    reason: >-
      The certainty on the array form and the certainty three weeks later are two documents, and only one is dated usefully
    place: Identification Suite
    scene: Case analyst Solomon brings four sealed record pulls to the confidence desk. Two can be authenticated before 
      the day's board packet closes. Somewhere in them are Cardoza's words on 4 December and her certainty statement on 
      26 December.
    guide: >-
      Four sealed record pulls, two authentications before the packet closes. Open each and read what it would establish.
      Cardoza's words on 4 December and her certainty statement on 26 December are somewhere in them, and the gap between
      those dates is the point. Buy the records that can show what her confidence was before it had time to grow.
    background:
    - >-
      Why the date matters more than the content. Confidence rises after an identification, especially when a witness learns
      that others agree or that a suspect was charged. A certainty statement taken three weeks later is a measurement of a
      different thing from one taken at the time.
    - >-
      What authenticating buys. A record's value depends on when it was made and by whom, and a sealed pull is a claim about
      both until somebody checks. An unauthenticated record put in front of a board carries the weight of a document and the
      reliability of an assertion.
    - >-
      Why two rather than four. The packet closes today, and the choice between them is the judgement being tested: which
      two records, if genuine, most change what the board can responsibly conclude.
    assumes:
    - a witness's certainty can change between the identification and a later statement
    takeaway: Confidence is evidence about accuracy only when its timing and the information available before it are 
      preserved.
    format: VALUE
    question: Which records are worth authenticating before the board packet closes?
    value:
      decision: What can the report legitimately say about confidence at the moment of the 4 December identification?
      budget:
        amount: 2
        unit: authentication credits

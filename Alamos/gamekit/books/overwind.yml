  # ---------------------------------------------------------------- day 4
  - title: The torque is there
    objective: Find the torque the faster wind needs, and say whether the machine has it.
    briefing: Marchetti's case comes down to one number in newton metres, and today it gets computed.
    stake: >-
      Thursday, and this is the day Marchetti has waited a fortnight for. The drum's inertia has
      been measured off the drum. The tension has been taken at the right end of the rope. So
      the torque the faster wind asks for can now be worked out instead of claimed. Torque is
      the twist the motor has to supply. Otieno has said all week that he is not arguing about
      torque. Iona Craig, the brake fitter, has a different question. She wants to know what the
      pads can hold once the motor has been given those numbers. Today you take the torque at
      the hardest instant of the cycle. You also settle what a friction limit is, and put the
      drum and the rope into one relation with Ubah. If the torque comes in under the motor's
      rating, the submission goes forward.
    takeaway: A rotating machine needs torque for its own inertia and for the load, and they are separate terms.
    stops:

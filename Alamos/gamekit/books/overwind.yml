      - group: CAGE
        task: Work out what the cage floor pushes with on the ramp
        title: What the floor has to push with
        concept: Free-body thinking, and the net force on one chosen body
        place: Shaft and Brake House
        scene: >-
          Aziz Rahimi, the shaft engineer, has the cage on the bench drawing: four tonnes of cage and men, accelerating upward
          at the peak of the ramp. He wants the force the floor has to push up with while that is
          happening.
        guide: >-
          Five quantities are offered and three of them belong in the sum. The body being drawn round
          is the cage and everybody in it, and there are two forces on it: the floor pushing up and
          gravity pulling down. The rope's own mass is on the list because it is not part of this
          body, and neither is the drum.
        assumes:
          - a net force upward means the upward forces exceed the downward ones
        takeaway: The force a floor pushes with is the weight plus whatever the acceleration needs, and only the chosen body's mass belongs in it.
        format: BALLPARK
        question: What force does the cage floor push up with at the peak of the ramp?
        estimate:
          prompt: >-
            The cage and the men in it are one body. Two forces act on it, and its acceleration is
            the peak of the new ramp.
          question: What force does the cage floor push up with at the peak of the ramp?
          relationship: >-
            Net force equals mass times the acceleration, so the floor's push is the mass times
            gravity plus the acceleration.
          labels:
            - 4000 kg  (cage and men, the chosen body)
            - 9.81 m/s²  (gravity)
            - 1.2 m/s²  (peak acceleration of the ramp)
            - 11000 kg  (the winding rope, which is not this body)
            - 7.2 m/s  (the speed at the end of the ramp)
          values: [4000, 9.81, 1.2, 11000, 7.2]
          slots: 3
          template: '{0} × ({1} + {2})'
          formula: a*(b+c)
          correct: [0, 1, 2]
          target: 44040
          tolerance: 500
          units: N
          solution: 4000 × (9.81 + 1.2) = 44,040 N.
          explanation: >-
            The rope's eleven tonnes are carried by the drum, not by the cage floor, so putting them
            in this body's mass triples the answer. The speed at the end of the ramp does not enter
            a force at all.
        why: >-
          The floor pushes with about 44 kilonewtons. Drawing the body is the whole of the work.
          Once the cage and the men are one object, only two forces act on it. The second law
          fixes their difference. The floor therefore pushes with more than the weight while the
          cage is speeding up. That is what everybody in it feels. On the way into the stop it
          pushes with less than the weight. Anything outside the drawn body — the rope, the drum, the
          headframe — belongs to a different free-body diagram.
      - group: WIND
        task: Ask Marchetti what the twelve seconds are made of
        title: Where twelve seconds come from
        concept: Position, velocity and acceleration as successive derivatives
        place: Winder House
        person: true
        scene: >-
          Marchetti has the two cycles side by side on the winder house desk, the present one and
          the one she wants. The full-speed section is the same length in both.
        guide: >-
          All four options are places a cycle could be shortened. Ask of each what it would change about the curve on the desk. Then ask which parts of that curve the
          depth of the shaft has already fixed. Only one of the four has any seconds in it that are not already spoken for.
        assumes:
          - a journey is made of a ramp up, a run at speed, a ramp down and a slow approach
        takeaway: A cycle time is the sum of parts fixed by different things. Only some of them are anybody's to
        choose.
        format: CHOICE
        question: Where do Marchetti's twelve seconds have to come from?
        why: >-
          They come out of the ramps and the crawl. The full-speed section is fixed by the depth of the shaft
          and the speed the winder may run at. Shortening it means winding faster, not accelerating
          harder. The loading time at each landing is fixed by how long men take to get on and off.
          What is left is how hard the cage is accelerated, and how long it spends creeping into the
          landing. That is why this proposal is a proposal about acceleration and about margin.
        choices:
          - The ramps and the crawl at the end
          - The full-speed run between the landings
          - The loading time at each landing
          - The signalling between the bank and the inset
        answer: The ramps and the crawl at the end
        rebuttals:
          - The full-speed run is the depth divided by the speed, and both are set elsewhere.
          - Loading is set by how long it takes men to get on and off, which no winder controls.
          - Signalling happens while the cage is standing, and shortening it changes nothing about the journey.
  # ---------------------------------------------------------------- day 2
  - title: What the drum is
    objective: Get the drum's inertia out of how its mass is arranged, not out of its weight.
    briefing: The torque calculation on the desk uses a figure for the drum nobody can source.
    stake: >-
      Tuesday. The submission gives a moment of inertia for the drum with no working behind it.
      Moment of inertia is how hard a spinning thing is to speed up or slow down. Marchetti took
      the figure from a handover file that is eighteen years old. The drum has been re-flanged
      since then. Samuel Otieno, the chief rope examiner, has read the same file. It has the
      rope forty metres longer than the rope really is. Today you work the drum's inertia out
      from the drum's own size. You also have to settle what the rope's eleven tonnes hang from,
      and go down to the inset to see Tom Halloway, the onsetter. Every torque in the submission
      rests on that one number. So does every stopping sum, and every cycle time.
    takeaway: How hard something is to spin up depends on where its mass sits, not on how much of it there is.
    stops:
      - group: WIND
        task: Take the drum's moment of inertia off its dimensions
        title: Eighteen tonnes, and where it sits
        concept: Moment of inertia as an integral over the mass
        place: Winder House
        takesAsRead:
          - Angular velocity and angular acceleration
        scene: >-
          The drum is a steel cylinder of eighteen tonnes, 2.1 metres to its outside and 1.9 to its
          bore, turning about its axis. Marchetti wants its moment of inertia from the drum itself
          rather than from the file.
        guide: >-
          You build the working a line at a time. The quantity wanted is a sum over the whole body. Each piece contributes its mass times the square
          of its distance from the axis. So the first decision is what a piece is. Choose it so that
          every part of the piece is the same distance out. The integral then becomes one in a
          single variable.
        background:
          - >-
            Why a thin shell is the right element. Mass at different radii contributes differently,
            so an element has to be all at one radius. A thin cylindrical shell of radius r and thickness dr is exactly that. Its mass is the total mass
            times its share of the cross-sectional area.
          - >-
            Why the fourth powers collapse. Integrating r³ gives r⁴/4. So the shells leave a difference of fourth powers over a difference of
            squares. That factors, because a difference of squares is what a difference of fourth
            powers is made of. What survives is
            the mean of the two squared radii, which is why the answer looks so simple.
          - >-
            Why this is not the mass. A solid cylinder of the same eighteen tonnes and the same outside radius has an inertia of 39,700
            kilogram metres squared. This one comes out at 72,200. The solid drum's mass is spread
            inward towards the axis, where it counts for little. The
            two machines behave nothing alike and weigh the same.
        assumes:
          - the moment of inertia of a small mass is that mass times the square of its distance from the axis
        takeaway: A moment of inertia is an integral over the body. Two bodies of one mass can differ in it by a
        factor of two.
        format: DERIVE
        question: What is the drum's moment of inertia about its own axis?
        answerText: >-
          About 72,200 kg·m². The shells give I = ½m(R₁² + R₂²), which is 9,000 × (3.61 + 4.41).
        why: >-
          The drum's inertia is about 72,200 kilogram metres squared. Taking a thin shell as the element makes
          the integral possible. Every part of a shell is the same distance from the axis. The
          shell's mass is the total mass times its share of the cross-section, so the integral is in
          r alone. Integrating r³ between the two radii leaves a difference of fourth powers. That
          factors into the mean of the squares. A solid drum of the same mass would come out at
          about half of this.
        derive:
          hint: Each line has to follow from the one above it, and each one is licensed by a rule.
          start: I = ∫r² dm
          startNote: m = 18,000 kg between R₁ = 1.9 m and R₂ = 2.1 m, of uniform steel, turning about its axis
          goal: the moment of inertia about the axis, in kilogram metres squared
          askRule: true
          rules:
            - the choice of the mass element
            - substitution of the element
            - integration with respect to radius
            - factorising a difference of powers
            - substitution of the stated values
            - rearrangement
          steps:
            - ask: Choose the element of mass.
              answer: 1
              candidates:
                - text: a flat slice of thickness dz along the axis
                  rule: the choice of the mass element
                  why: >-
                    Every slice contains matter at every radius from the bore to the outside, so the
                    r² inside the integral has no single value on it and cannot be taken out.
                - text: a thin cylindrical shell of radius r and thickness dr
                  rule: the choice of the mass element
                - text: a wedge of angle dθ cut through the whole thickness of the wall
                  rule: the choice of the mass element
                  survives: true
                  why: >-
                    A perfectly good element and it has the same defect: a wedge spans every radius.
                    The integral in θ then comes out to 2π and looks like progress, while the r² is
                    still inside it.
                - text: the whole wall at its mean radius of 2.0 m
                  rule: substitution of the element
                  survives: true
                  why: >-
                    All the mass placed at one radius gives 72,000 — two hundred out of 72,200, which
                    is within a third of a per cent here and is wrong for a reason that matters: it
                    happens to work only because this wall is thin.
            - ask: Write the element's mass in terms of r.
              answer: 3
              candidates:
                - text: dm = m·dr/(R₂ − R₁)
                  rule: substitution of the element
                  survives: true
                  why: >-
                    Mass shared out evenly across the thickness rather than by area. Outer shells hold
                    more steel than inner ones, and this gives 71,900 — close enough to pass, and it
                    is the wrong model of the body.
                - text: dm = m·2πr·dr
                  rule: substitution of the element
                  why: >-
                    That is an area rather than a fraction of the mass, so the units come out as
                    kilogram metres squared before the r² is even applied.
                - text: dm = m·r·dr/(R₂² − R₁²)
                  rule: substitution of the element
                  why: >-
                    The factor of two from the area of an annulus is missing, so the total mass of all
                    the shells is half the drum.
                - text: dm = 2m·r·dr/(R₂² − R₁²)
                  rule: substitution of the element
            - ask: Do the integral.
              answer: 0
              candidates:
                - text: I = 2m/(R₂² − R₁²) · [r⁴/4] from R₁ to R₂
                  rule: integration with respect to radius
                - text: I = 2m/(R₂² − R₁²) · [r³/3] from R₁ to R₂
                  rule: integration with respect to radius
                  survives: true
                  why: >-
                    The r² and the r from the element have not been combined before integrating, so
                    the cube has been integrated instead of the fourth power. The units give it away
                    and the number, 71,000, does not.
                - text: I = 2m/(R₂² − R₁²) · [r⁴] from R₁ to R₂
                  rule: integration with respect to radius
                  why: >-
                    Integrating r³ brings a divisor of four. Without it the answer is four times too
                    large.
                - text: I = 2m·[r⁴/4] from R₁ to R₂
                  rule: rearrangement
                  why: >-
                    The normalising denominator has been dropped, which is the part that makes the
                    shells add up to the drum's actual mass.
            - ask: Simplify and put the numbers in.
              answer: 2
              candidates:
                - text: I = ½m(R₂² − R₁²) = 9,000 × 0.80 = 7,200 kg·m²
                  rule: factorising a difference of powers
                  survives: true
                  why: >-
                    A difference where a sum belongs. The factorisation of a difference of fourth
                    powers leaves the sum of the squares, and this answer is a factor of ten small in
                    a way nothing downstream would notice.
                - text: I = m(R₁² + R₂²) = 18,000 × 8.02 = 144,000 kg·m²
                  rule: substitution of the stated values
                  why: >-
                    The half has been lost. It comes from the four in the integration against the two
                    in the element.
                - text: I = ½m(R₁² + R₂²) = 9,000 × 8.02 = 72,200 kg·m²
                  rule: factorising a difference of powers
                - text: I = ½m·R₂² = 9,000 × 4.41 = 39,700 kg·m²
                  rule: substitution of the stated values
                  why: >-
                    That is a solid cylinder of the same mass and outside radius. It is the answer to
                    a different drum, and it is the figure in the handover file.
          commit: Commit the derivation
      - group: ROPE
        task: Settle which body carries the rope
        title: Eleven tonnes, hung from what
        concept: Newton's second law as a vector statement
        place: Rope Shop
        scene: >-
          Otieno has the rope's own weight written on the shop board: about eleven tonnes with the
          cage at the inset. The submission's force calculation has it appearing in the cage's line
          and nowhere else.
        guide: >-
          Four accounts of where the rope's weight is carried. Ask of each which body has been drawn round. A force belongs to a diagram rather than to a site. The
          distinction that decides it is between what hangs below a point and what is held above it.
          The answer changes as the cage moves.
        assumes:
          - a force appears in the equation of whichever body it acts on
        takeaway: A force belongs to whichever body it acts on. Choosing the body is the first move in every problem
        here.
        format: CHOICE
        question: Whose free-body diagram does the hanging rope's weight belong in?
        why: >-
          It belongs to the drum, through the tension at the top of the rope. Each point of the rope carries
          everything below it. So the tension grows from the cappel at the bottom to the drum at the
          top. The eleven tonnes is fully accounted for only at the drum. The cage carries nothing
          of it: the rope pulls up on the cage, not down. This is why the tension in the submission
          has to be a function of where the cage is.
        choices:
          - The drum's, through the tension at the top of the rope
          - The cage's, since the rope is attached to it
          - Nobody's, since the rope is neither the load nor the machine
          - The headframe's, since the sheave wheels take the whole weight
        answer: The drum's, through the tension at the top of the rope
        rebuttals:
          - The rope pulls up on the cage; the cage carries only itself and its load.
          - Eleven tonnes acts on something, and leaving it out of every diagram loses a third of the tension.
          - The sheave changes the direction of the rope's pull and does not decide what tension is in it.
      - group: BANK
        task: Ask Halloway what the depth recorder can be made to say
        title: Three things out of one trace
        concept: Getting velocity and distance back by integrating an acceleration
        place: The Bank
        person: true
        scene: >-
          Halloway has the depth recorder's paper from the March wind: one pen, one trace, position
          against time, and nothing else recorded anywhere on the plant.
        guide: >-
          Each thing the inquiry wanted on the left has one operation on the right. That operation would get
          it from a trace of position against time. What separates them is which direction you have
          to go. Differentiating gives rates. Accumulating gives totals. One of the four is on the
          trace already.
        assumes:
          - a trace of position against time contains every rate derived from it
        takeaway: A single record of position against time yields speed, acceleration and jerk by differentiating, and needs no other instrument.
        format: PROTOCOL
        task: Match each thing the inquiry wanted to what has to be done to the trace.
        scenarios:
          - How fast the cage was going as it approached the bank.
          - How hard it was being retarded in the last two seconds.
          - How far the cage went past the landing.
          - Whether the retardation was itself changing.
        choices:
          - Take the slope of the trace at that point.
          - Take the slope of the slope.
          - Read the difference between two positions off the paper.
          - Take the slope a third time.
        mapping: [0, 1, 2, 3]
        why: >-
          A position record contains everything derived from it. Speed is its slope. Retardation is the slope
          of the speed. How fast the retardation is changing is one slope further down. Three
          quantities, out of one pen. The distance past the landing is on the paper directly,
          because it is a difference of positions. Accumulating is the other way, and you need it
          when the record is a rate rather than a position. That is the case at the winder, where
          the tachometer reads speed.
  # ---------------------------------------------------------------- day 3
  - title: The rope is heavier than the cage
    objective: Get the tension at the drum with the rope's own weight in it, and see what a body feels.
    briefing: The submission's tension figure is one number, and the rope's weight changes with where the cage is.
    stake: >-
      Wednesday. Otieno has stopped the submission going forward. The tension in it is the cage
      and its load times gravity. That is the pull at the cappel, up at the top of the cage. It
      is not the pull anywhere a rope ever breaks. With the cage at the inset there are twelve
      hundred and forty metres of steel hanging above it. The rope weighs nearly three times
      what the cage carries. Today you find the tension at the drum with the rope's own weight
      in it. Then you work out what a man standing in the cage feels as the stop begins. Ruth
      Anand, the winder driver, will tell you how a hard ramp differs from a soft one.
      Marchetti's whole case rests on a margin worked out at the wrong end of the rope.
    takeaway: The tension in a hoisting rope is a function of where the cage is, and its worst value is at the drum.
    stops:
